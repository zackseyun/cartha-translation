reference: Daniel 9:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִגְבִּ֥יר בְּרִ֛ית לָ/רַבִּ֖ים שָׁב֣וּעַ אֶחָ֑ד וַ/חֲצִ֨י הַ/שָּׁב֜וּעַ יַשְׁבִּ֣ית זֶ֣בַח וּ/מִנְחָ֗ה וְ/עַ֨ל כְּנַ֤ף שִׁקּוּצִים֙ מְשֹׁמֵ֔ם וְ/עַד כָּלָה֙ וְ/נֶ֣חֱרָצָ֔ה תִּתַּ֖ךְ עַל שֹׁמֵֽם׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/027.yaml
  text: And he will make a firm covenant with the many for one week[a], and for half of the week he will put a stop to sacrifice and offering. And on the wing of abominations will come one who makes desolate[e][d][c][b], until the decreed end is poured out on the desolator.
translation:
  language: fr
  text: Il affermira une alliance avec le grand nombre pendant une semaine[a] et, pendant la moitié de la semaine, il fera cesser le sacrifice et l’offrande[b]. Et sur l’aile des abominations[c] viendra celui qui dévaste[d], jusqu’à ce que la fin décrétée soit déversée sur le dévastateur[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il confirmera une alliance » ou « Il fera prévaloir une alliance ». Le verbe hébreu signifie rendre fort ou faire prévaloir. Le mot traduit par « semaine » désigne une unité de sept.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le sacrifice et l’offrande végétale ». Le second terme peut désigner plus précisément une offrande de céréales.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « sur l’aile des abominations ». L’expression est difficile ; on propose aussi « sur le pinacle des abominations » ou « sur une aile d’abominations ».'
    reason: alternative_reading
  - marker: d
    text: 'Ou : « un dévastateur », « celui qui cause la dévastation ». Le verbe « viendra » est suppléé pour rendre la phrase intelligible en français.'
    reason: lexical_alternative
  - marker: e
    text: 'On peut aussi comprendre : « soit déversée sur celui qui est dévasté » ou « sur le lieu dévasté ». La dernière proposition est textuellement stable, mais sa syntaxe est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגְבִּיר
  choice: Il rendra ferme
  rationale: Le hifil de גבר exprime ici l’action de rendre fort ou de faire prévaloir. « Rendra ferme » conserve cette valeur causative sans présupposer qu’il s’agit de confirmer une alliance déjà conclue.
- source_word: בְּרִית
  choice: une alliance
  rationale: « Alliance » garde le poids relationnel et juridique du terme biblique בְּרִית, que « accord » affaiblirait.
- source_word: לָרַבִּים
  choice: avec la multitude
  rationale: Dans ce contexte d’alliance, « avec » donne un français naturel. « La multitude » préserve la nuance collective et définie de רַבִּים mieux que l’indéfini « beaucoup de gens ».
- source_word: שָׁבוּעַ אֶחָד
  choice: pendant une semaine
  rationale: שָׁבוּעַ désigne littéralement une unité de sept et, dans ce passage, se rend traditionnellement et lisiblement par « semaine », sans préciser dans le texte la portée symbolique de cette période.
- source_word: וַחֲצִי הַשָּׁבוּעַ
  choice: pendant la moitié de la semaine
  rationale: Cette formulation reste proche de l’expression hébraïque « la moitié de la semaine » et évite de la transformer sans nécessité en « au milieu de la semaine ».
- source_word: יַשְׁבִּית
  choice: il fera cesser
  rationale: 'Le hifil de שבת a une valeur causative : faire cesser ou mettre fin à quelque chose. « Fera cesser » est à la fois exact et digne en français courant.'
- source_word: זֶבַח וּמִנְחָה
  choice: le sacrifice et l’offrande
  rationale: זֶבַח désigne le sacrifice, tandis que מִנְחָה désigne une offrande et peut, dans le culte, viser plus précisément l’offrande végétale. Le texte principal conserve le terme plus général, avec précision en note.
- source_word: וְעַל כְּנַף שִׁקּוּצִים
  choice: Et sur l’aile des abominations
  rationale: כָּנָף signifie normalement « aile ». La traduction littérale préserve l’image obscure et l’ambiguïté du syntagme au lieu d’imposer une interprétation architecturale comme « sommet » ou « pinacle ».
- source_word: מְשֹׁמֵם
  choice: viendra celui qui dévaste
  rationale: Le participe de שׁמם décrit un agent qui cause la dévastation. Le verbe « viendra », suppléé pour former une phrase française intelligible, n’identifie pas cet agent.
- source_word: וְעַד כָּלָה וְנֶחֱרָצָה
  choice: jusqu’à ce que la fin décrétée
  rationale: Le groupe associe l’idée d’un terme complet à celle d’une décision arrêtée. « La fin décrétée » rend les deux éléments avec concision.
- source_word: תִּתַּךְ
  choice: soit déversée
  rationale: נתך exprime l’action de verser ou déverser, souvent à propos d’un jugement. Le subjonctif après « jusqu’à ce que » est requis en français sans diminuer la certitude annoncée.
- source_word: עַל שֹׁמֵם
  choice: sur le dévastateur
  rationale: Le participe masculin singulier se comprend le plus naturellement comme désignant l’agent de la dévastation. Les autres analyses syntaxiques possibles sont signalées en note.
theological_decisions:
- issue: Identité du sujet « il » dans le verset
  choice: Le pronom « il » est conservé sans identification explicite.
  alternative: L’oint ou le Messie ; le chef à venir du verset précédent ; Antiochos IV ; Titus ; un dirigeant eschatologique.
  rationale: L’antécédent n’est pas nommé dans ce verset, et les grandes traditions d’interprétation divergent. La traduction ne tranche donc pas cette question théologique.
- issue: Sens de כְּנַף שִׁקּוּצִים
  choice: « l’aile des abominations »
  alternative: « le pinacle des abominations » ; « l’extrémité des abominations » ; une construction ou un emplacement associé à des choses abominables.
  rationale: L’expression est lexicalement et syntaxiquement difficile. Garder l’image de l’aile préserve la tension du texte, tandis que la note présente les principales possibilités.
- issue: Référent de שֹׁמֵם dans la dernière proposition
  choice: « le dévastateur »
  alternative: « celui qui est dévasté » ; « le lieu dévasté » ou « ce qui est dévasté ».
  rationale: La forme masculine singulière se prête le mieux à une lecture active désignant un agent, mais la syntaxe demeure difficile ; les lectures passives ou locatives ne doivent donc pas être dissimulées.
translation_notes:
  register: Français international moderne, digne et accessible. La structure du verset et ses images fortes sont conservées. Les formulations littérales sont maintenues là où une expression plus fluide imposerait une interprétation contestée ; les principales possibilités sont alors données en notes.
