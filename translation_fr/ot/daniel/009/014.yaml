id: DAN.9.14
reference: Daniel 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁקֹ֤ד יְהוָה֙ עַל הָ֣/רָעָ֔ה וַ/יְבִיאֶ֖/הָ עָלֵ֑י/נוּ כִּֽי צַדִּ֞יק יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַל כָּל מַֽעֲשָׂי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/לֹ֥א שָׁמַ֖עְנוּ בְּ/קֹלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/014.yaml
  text: So Yahweh kept watch over the disaster and brought it upon us[a], for Yahweh our God is righteous in all the works that he has done[c][b], and we have not listened to his voice.
translation:
  language: fr
  text: Ainsi, Yahweh a veillé sur le malheur et l’a fait venir sur nous[a], car Yahweh, notre Dieu, est juste dans toutes les œuvres qu’il a accomplies[b], et nous n’avons pas écouté sa voix[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la catastrophe ». Le mot hébreu peut aussi signifier « le mal », mais il désigne ici le malheur du jugement qui a frappé le peuple.
    reason: lexical_alternative
  - marker: b
    text: Le verbe rendu par « a veillé sur » peut aussi signifier « a été vigilant à l’égard de » ou, de manière plus interprétative, « s’est hâté de faire venir ».
    reason: lexical_alternative
  - marker: c
    text: « Écouter sa voix » implique ici de lui obéir.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּשְׁקֹד
  choice: a veillé sur
  rationale: Le verbe שׁקד exprime la vigilance et le fait de rester attentif. « A veillé sur » conserve cette image sans adopter l’interprétation plus appuyée « s’est empressé ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הָרָעָה
  choice: le malheur
  rationale: Dans ce contexte de jugement, רָעָה désigne le malheur ou la catastrophe qui frappe le peuple, et non une faute morale commise par Dieu.
- source_word: וַיְבִיאֶהָ עָלֵינוּ
  choice: et l’a fait venir sur nous
  rationale: Cette formulation rend le causatif de בוא et reprend explicitement le nom féminin « le malheur ».
- source_word: כִּי צַדִּיק יְהוָה אֱלֹהֵינוּ
  choice: car Yahweh, notre Dieu, est juste
  rationale: כִּי introduit ici la raison; « juste » rend naturellement צַדִּיק dans l’affirmation que les actes judiciaires de Dieu sont conformes à la justice.
- source_word: עַל כָּל מַעֲשָׂיו אֲשֶׁר עָשָׂה
  choice: dans tout ce qu’il a fait
  rationale: La tournure française exprime que la justice de Dieu se manifeste dans l’ensemble de ses actes, sans reproduire lourdement la répétition nominale de l’hébreu.
- source_word: וְלֹא שָׁמַעְנוּ בְּקֹלוֹ
  choice: et nous n’avons pas écouté sa voix
  rationale: La traduction conserve l’expression hébraïque; dans ce contexte, écouter la voix implique aussi d’obéir.
theological_decisions:
- issue: Sens de רָעָה lorsque Yahweh en est l’auteur judiciaire
  choice: le malheur
  alternative: le mal; la catastrophe
  rationale: « Le malheur » préserve l’idée d’un jugement réellement amené par Dieu sans laisser entendre qu’il aurait commis un mal moral; la note signale l’amplitude lexicale du terme.
- issue: Rapport entre la justice de Dieu et le jugement
  choice: est juste dans tout ce qu’il a fait
  alternative: est juste quant à toutes les œuvres qu’il a accomplies
  rationale: 'La formulation maintient l’affirmation du texte: le jugement appartient aux actes dans lesquels la justice de Dieu est reconnue, sans ajouter d’explication doctrinale.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement de la confession hébraïque. « A veillé sur » garde la métaphore de la vigilance; « malheur » est naturel en français biblique actuel et convient au contexte judiciaire.
