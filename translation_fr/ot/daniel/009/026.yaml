source:
  edition: WLC
  text: וְ/אַחֲרֵ֤י הַ/שָּׁבֻעִים֙ שִׁשִּׁ֣ים וּ/שְׁנַ֔יִם יִכָּרֵ֥ת מָשִׁ֖יחַ וְ/אֵ֣ין ל֑/וֹ וְ/הָ/עִ֨יר וְ/הַ/קֹּ֜דֶשׁ יַ֠שְׁחִית עַ֣ם נָגִ֤יד הַ/בָּא֙ וְ/קִצּ֣/וֹ בַ/שֶּׁ֔טֶף וְ/עַד֙ קֵ֣ץ מִלְחָמָ֔ה נֶחֱרֶ֖צֶת שֹׁמֵמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/026.yaml
  text: And after the sixty-two weeks[a], an anointed one will be cut off and will have nothing. And the city and the sanctuary the people of the coming ruler will destroy. Its end will come with a flood, and until the end there will be war[d][c][b]; desolations are decreed.
translation:
  language: fr
  text: Après les soixante-deux semaines, un oint[a] sera retranché et il n’aura rien[b]. Le peuple d’un chef qui viendra[c] détruira la ville et le sanctuaire. Sa fin viendra dans un déferlement[d]. Jusqu’à la fin, il y aura la guerre ; des dévastations sont décrétées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Messie sera retranché ». L’hébreu dit « un oint » ; l’identification précise de cette personne est discutée.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « et il n’y aura rien pour lui », ou « et personne ne sera avec lui ». La proposition hébraïque est concise et difficile.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le peuple du chef à venir ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « sa fin viendra dans un flot ». Le référent de « sa » est discuté ; le mot peut aussi désigner une inondation.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: les soixante-deux semaines
  rationale: « Semaines » est l’équivalent conventionnel et lexicalement défendable de שָׁבוּעַ. Il conserve l’image d’unités de sept sans préciser davantage leur durée.
- source_word: יִכָּרֵת
  choice: sera retranché
  rationale: Le niphal de כרת exprime ici le fait d’être supprimé ou coupé, probablement de manière violente. « Retranché » conserve la force solennelle de l’idiome sans expliciter le mode de cette disparition.
- source_word: מָשִׁיחַ
  choice: un homme ayant reçu l’onction
  rationale: Le nom sans article désigne lexicalement une personne ointe. Cette formulation française claire évite de décider dans le texte principal s’il s’agit spécifiquement du Messie.
- source_word: וְאֵין לוֹ
  choice: et il n’aura rien
  rationale: La proposition hébraïque est très concise et ambiguë. Cette traduction exprime la privation sans préciser s’il est question de biens, d’appui, de droit ou d’une personne.
- source_word: הָעִיר וְהַקֹּדֶשׁ
  choice: la ville et le sanctuaire
  rationale: Dans ce contexte, הַקֹּדֶשׁ désigne le lieu saint ou l’enceinte sacrée ; « sanctuaire » est précis, naturel et digne.
- source_word: יַשְׁחִית
  choice: détruira
  rationale: Le hiphil de שׁחת indique une action destructrice exercée contre la ville et le sanctuaire.
- source_word: עַם נָגִיד הַבָּא
  choice: le peuple d’un chef qui viendra
  rationale: נָגִיד désigne un dirigeant ou chef. L’indéfini rend l’absence d’article devant נָגִיד, tandis que la relative traduit naturellement le participe défini הַבָּא.
- source_word: וְקִצּוֹ בַשֶּׁטֶף
  choice: Sa fin viendra dans un déferlement
  rationale: « Sa » conserve le suffixe pronominal dont le référent reste discuté. « Déferlement » maintient l’image puissante d’un flot ou d’une inondation sans imposer une lecture strictement littérale.
- source_word: וְעַד קֵץ מִלְחָמָה
  choice: Jusqu’à la fin, il y aura la guerre
  rationale: Cette formulation française naturelle exprime la continuation de la guerre jusqu’à la fin, conformément à la proposition nominale hébraïque condensée.
- source_word: נֶחֱרֶצֶת שֹׁמֵמוֹת
  choice: des dévastations sont décrétées
  rationale: Le passif de חרץ exprime une décision arrêtée, et שֹׁמֵמוֹת évoque des états ou actes de dévastation au pluriel.
theological_decisions:
- issue: Faut-il rendre מָשִׁיחַ explicitement par « le Messie » ?
  choice: un homme ayant reçu l’onction
  alternative: le Messie sera retranché
  rationale: Le mot hébreu n’a pas d’article et peut désigner plus généralement une personne ointe. Le texte principal reste lexicalement transparent, tandis que la lecture messianique, importante mais débattue, est signalée en note.
- issue: Comment comprendre וְאֵין לוֹ ?
  choice: et il n’aura rien
  alternative: 'et il n’y aura rien pour lui ; ou : et personne ne sera avec lui'
  rationale: La syntaxe ne précise pas la nature de ce qui lui manque. La traduction retenue préserve cette indétermination et n’importe aucune interprétation doctrinale particulière.
- issue: Quel est le référent du suffixe dans וְקִצּוֹ ?
  choice: Conserver le pronom ambigu dans « Sa fin »
  alternative: 'la fin de la ville et du sanctuaire ; ou : la fin du chef'
  rationale: Le contexte permet plusieurs antécédents. La traduction ne tranche pas une ambiguïté réelle du texte hébreu.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe suit de près la progression de l’hébreu tout en évitant les tours archaïques. Les formulations ambiguës du texte source sont conservées dans le corps du verset et précisées, sans être résolues, dans les notes.
