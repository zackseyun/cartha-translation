source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר כָּתוּב֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/זֹּ֖את בָּ֣אָה עָלֵ֑י/נוּ וְ/לֹֽא חִלִּ֜ינוּ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֵ֗י/נוּ לָ/שׁוּב֙ מֵֽ/עֲוֺנֵ֔/נוּ וּ/לְ/הַשְׂכִּ֖יל בַּ/אֲמִתֶּֽ/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/013.yaml
  text: Just as it is written in the Law of Moses[a], all this calamity has come upon us[c][b], yet we have not sought the favor of Yahweh our God by turning from our iniquities and by gaining insight into your truth.
translation:
  language: fr
  text: Comme il est écrit dans la loi de Moïse, tout ce malheur s’est abattu sur nous. Pourtant, nous n’avons pas cherché la faveur de Yahweh notre Dieu en nous détournant de nos fautes et en nous rendant attentifs à ta vérité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière expression peut aussi se comprendre : « en comprenant ta vérité », « en agissant avec discernement dans ta vérité » ou « par ta vérité ». Le mot traduit par « vérité » peut également signifier « fidélité ».'
    reason: Le verbe hébreu שׂכל peut évoquer la compréhension, l’attention avisée ou l’action prudente; la préposition ב et le terme אֱמֶת admettent plusieurs nuances.
lexical_decisions:
- source_word: כַּאֲשֶׁר כָּתוּב
  choice: Comme cela est écrit
  rationale: Rend naturellement la correspondance entre l’avertissement écrit et ce qui est arrivé, tout en conservant la force comparative de כַּאֲשֶׁר.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: dans la loi de Moïse
  rationale: Dans ce contexte d’alliance et de jugement, תּוֹרָה désigne l’enseignement légal attribué à Moïse; « loi de Moïse » est l’expression française claire et consacrée.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: tout ce malheur
  rationale: רָעָה désigne ici le désastre subi comme jugement, et non le mal moral. « Malheur » garde la gravité du terme sans suggérer que Dieu commet le mal.
- source_word: בָּאָה עָלֵינוּ
  choice: s’est abattu sur nous
  rationale: Cette formulation française idiomatique exprime avec force la survenue du jugement impliquée par l’hébreu « est venu sur nous ».
- source_word: וְלֹא חִלִּינוּ אֶת פְּנֵי
  choice: Pourtant, nous n’avons pas cherché la faveur de
  rationale: Le piel de חלה avec פְּנֵי est une locution signifiant implorer, apaiser ou rechercher la faveur. « Chercher la faveur de » en explicite le sens relationnel.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh notre Dieu
  rationale: Reproduit le nom divin et la désignation d’alliance sans remplacer le tétragramme par un titre.
- source_word: לָשׁוּב מֵעֲוֺנֵנוּ
  choice: en nous détournant de nos fautes
  rationale: Le retour exprime ici la repentance concrète. עָוֹן peut désigner faute, iniquité et culpabilité; « fautes » est naturel et conserve la dimension morale.
- source_word: וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ
  choice: et en discernant ta vérité
  rationale: Le hiphil de שׂכל peut signifier comprendre, devenir avisé ou agir avec discernement. « Discerner ta vérité » maintient cette amplitude mieux qu’une compréhension purement intellectuelle; la note signale l’ambiguïté de אֱמֶת et de la préposition ב.
theological_decisions:
- issue: Sens de רָעָה dans le contexte du jugement
  choice: malheur
  alternative: mal, désastre, calamité
  rationale: Le contexte parle du désastre annoncé dans la loi et subi par le peuple, non d’un mal moral attribué à Dieu.
- issue: Rendu du nom יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR, Jéhovah
  rationale: Le texte porte explicitement le nom divin; sa translittération préserve cette donnée sans lui substituer un titre.
- issue: Rapport entre repentance, discernement et recherche de la faveur divine
  choice: en nous détournant… et en discernant
  alternative: afin de nous détourner… et de comprendre
  rationale: Les infinitifs peuvent préciser la manière ou le contenu de la démarche. Le rendu par « en » exprime ce rapport sans faire de ces actes un mécanisme méritoire ni exclure une nuance de finalité.
- issue: Sens de אֱמֶת
  choice: vérité
  alternative: fidélité
  rationale: Les deux sens sont possibles. « Vérité » convient au verbe de discernement, tandis qu’une note conserve explicitement la possibilité de « fidélité ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour éviter une période trop lourde. « S’est abattu » rend idiomatiquement la gravité du désastre; « pourtant » explicite la valeur adversative du ו après le jugement. Le seul appel de note figure bien dans le texte.
