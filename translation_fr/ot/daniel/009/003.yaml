  yaml_path: translation/ot/daniel/009/003.yaml
  text: So I turned my face to the Lord God[a], to seek prayer and pleas for mercy, with fasting, sackcloth[b], and ashes.
translation:
  language: fr
  text: Je tournai alors mon visage vers le Seigneur Dieu[a], pour le chercher par la prière et les supplications[b], avec jeûne, sac et cendre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je donnai [ou plaçai] mon visage vers le Seigneur Dieu ». Cette expression hébraïque indique une orientation volontaire et résolue.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour chercher prière et supplications ». Dans ce contexte, on peut comprendre que Daniel cherche Dieu par la prière et les supplications; l’hébreu reste plus condensé.'
    reason: source_ambiguity
  - marker: c
    text: Le « sac » était une étoffe grossière portée en signe de deuil ou d’humiliation.
    reason: cultural_context
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת־פָּנַי
  choice: Je tournai alors mon visage
  rationale: L’expression hébraïque signifie littéralement « donner/placer son visage » vers quelqu’un et exprime une orientation volontaire et résolue. « Tourner son visage » conserve l’image concrète tout en restant naturel en français.
- source_word: אֶל־אֲדֹנָי הָאֱלֹהִים
  choice: vers le Seigneur Dieu
  rationale: אֲדֹנָי est le titre « Seigneur », et non le nom divin YHWH; הָאֱלֹהִים est rendu par « Dieu ». La formulation française conserve les deux titres sans introduire la convention « l’Éternel » ou « le SEIGNEUR ».
- source_word: לְבַקֵּשׁ
  choice: pour le chercher
  rationale: L’infinitif exprime le but. Le complément pronominal « le », naturellement compris comme Dieu, est implicite dans le contexte; son ajout permet une phrase française intelligible, tandis qu’une note signale la construction condensée de l’hébreu.
- source_word: תְּפִלָּה וְתַחֲנוּנִים
  choice: par la prière et les supplications
  rationale: תְּפִלָּה désigne la prière de manière générale; תַחֲנוּנִים désigne des demandes instantes de faveur ou de compassion. « Supplications » conserve le ton humble et pressant. « Par » explicite la valeur instrumentale naturelle de la construction dans ce contexte.
- source_word: בְּצוֹם וְשַׂק וָאֵפֶר
  choice: dans le jeûne, le sac et la cendre
  rationale: La préposition ב marque ici les circonstances accompagnant la démarche. La formulation garde la série sobre et concrète du texte hébreu. Le singulier « cendre » est idiomatique en français biblique et actuel dans l’expression du deuil et de l’humiliation.
theological_decisions:
- issue: Titre divin אֲדֹנָי הָאֱלֹהִים
  choice: le Seigneur Dieu
  alternative: le Seigneur, Dieu
  rationale: Le texte porte אֲדֹנָי et non YHWH. « Seigneur Dieu » rend directement les deux titres, sans substituer le nom d’alliance ni imposer une lecture confessionnelle.
- issue: Objet de לְבַקֵּשׁ et rapport avec « prière et supplications »
  choice: pour le chercher par la prière et les supplications
  alternative: pour rechercher la prière et les supplications
  rationale: La syntaxe hébraïque est condensée et peut se traduire très littéralement par « rechercher la prière et les supplications ». Dans le contexte de l’orientation vers Dieu, la lecture instrumentale — chercher Dieu par la prière — donne un français cohérent sans supprimer l’ambiguïté, laquelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. L’image hébraïque du visage est conservée; « supplications » maintient la gravité du registre sans archaïsme excessif. Les éléments pénitentiels restent formulés de manière concise, conformément au rythme de l’original.
