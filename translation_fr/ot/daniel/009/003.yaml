  - severity: low
    issue: « Dans le jeûne, le sac et la cendre » est moins direct et moins naturel que la coordination circonstancielle sans articles.
    rationale: Les trois noms forment une série rituelle succincte; « avec jeûne, sac et cendre » conserve mieux cette forme.
  - severity: low
    issue: La note c ajoute « repentance » à la fonction du sac.
    rationale: Le sac est notamment associé au deuil et à l’humiliation. La repentance peut être présente dans le contexte élargi, mais n’est pas à présenter comme une valeur imposée par ce verset.
