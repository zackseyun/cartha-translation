id: DAN.9.8
reference: Daniel 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֗ה לָ֚/נוּ בֹּ֣שֶׁת הַ/פָּנִ֔ים לִ/מְלָכֵ֥י/נוּ לְ/שָׂרֵ֖י/נוּ וְ/לַ/אֲבֹתֵ֑י/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
translation:
  language: fr
  text: Seigneur, à nous la honte au visage[a], à nos rois, à nos chefs et à nos pères[b], car nous avons péché contre toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la honte du visage », expression qui évoque l’humiliation ou le déshonneur manifeste.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nos ancêtres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Seigneur
  rationale: Rend le nom divin YHWH selon la convention française courante, tout en conservant l’adresse directe de la prière.
- source_word: לָנוּ
  choice: à nous
  rationale: 'Le ל préfixé marque ici l’attribution ou la possession : la honte revient au peuple. La construction nominale française préserve la concision et le parallélisme de l’hébreu.'
- source_word: בֹּשֶׁת הַפָּנִים
  choice: la honte au visage
  rationale: Conserve l’image concrète de l’expression hébraïque, qui évoque une humiliation manifeste, sans recourir à une tournure française archaïque.
- source_word: לִמְלָכֵינוּ
  choice: à nos rois
  rationale: Préserve la répétition de la préposition et désigne les souverains du peuple.
- source_word: לְשָׂרֵינוּ
  choice: à nos chefs
  rationale: שָׂרִים peut désigner des princes, dirigeants ou hauts responsables. « Chefs » est naturel en français moderne et suffisamment large dans ce contexte politique.
- source_word: וְלַאֲבֹתֵינוּ
  choice: et à nos pères
  rationale: Reproduit le terme masculin concret de l’hébreu; dans ce contexte, il peut aussi désigner les ancêtres du peuple.
- source_word: אֲשֶׁר
  choice: car
  rationale: La particule introduit ici la cause de la honte; « car » exprime naturellement ce rapport dans une confession solennelle.
- source_word: חָטָאנוּ
  choice: nous avons péché
  rationale: Le passé composé convient à l’accompli hébreu et exprime une faute passée dont la culpabilité demeure présente.
- source_word: לָךְ
  choice: contre toi
  rationale: Avec le verbe חטא, la préposition désigne la personne offensée; « pécher contre » est l’expression française idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Seigneur
  alternative: Yahweh
  rationale: « Seigneur » suit la convention française largement reconnue pour YHWH et convient à l’adresse directe, sans ajouter le vocatif « ô », absent du texte hébreu.
- issue: Portée collective de la confession
  choice: nous avons péché
  alternative: ils ont péché
  rationale: La première personne du pluriel de חָטָאנוּ inclut Daniel dans la confession collective; elle ne doit pas être reportée seulement sur les rois, les chefs ou les pères.
translation_notes:
  register: Français moderne, sobre et solennel. La structure nominale « à nous la honte » conserve le parallélisme accusateur de l’hébreu. « Chefs » évite la coloration dynastique plus étroite de « princes », tandis que « pères » maintient le terme source avec une note explicitant son sens ancestral.
