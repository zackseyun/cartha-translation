source:
  edition: WLC
  text: בִּ/תְחִלַּ֨ת תַּחֲנוּנֶ֜י/ךָ יָצָ֣א דָבָ֗ר וַ/אֲנִי֙ בָּ֣אתִי לְ/הַגִּ֔יד כִּ֥י חֲמוּד֖וֹת אָ֑תָּה וּ/בִין֙ בַּ/דָּבָ֔ר וְ/הָבֵ֖ן בַּ/מַּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/023.yaml
  text: At the beginning of your pleas[a], a word went out, and I have come to tell it, because you are greatly beloved[b]. So consider the word and understand the vision.
translation:
  language: fr
  text: Dès le début de tes supplications, une parole est sortie[a], et je suis venu te l’annoncer, car tu es très aimé[b]. Prête donc attention à la parole et comprends la vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un message est parti » ou « un ordre a été donné ». Littéralement, l’hébreu dit : « une parole est sortie ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « tu es tenu en très haute estime » ou « tu es précieux ». L’expression hébraïque indique que Daniel est particulièrement précieux ou aimé.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת תַּחֲנוּנֶיךָ
  choice: Dès le début de tes supplications
  rationale: La tournure situe le départ de l’action au commencement des prières insistantes de Daniel. « Supplications » conserve l’idée de demandes instantes dans un registre digne et intelligible.
- source_word: יָצָא דָבָר
  choice: une parole est sortie
  rationale: Cette formulation garde l’image hébraïque d’une parole qui « sort », sans décider s’il s’agit précisément d’un message, d’une réponse ou d’un ordre.
- source_word: וַאֲנִי בָּאתִי לְהַגִּיד
  choice: et je suis venu te l’annoncer
  rationale: Le pronom « l’ » reprend naturellement « une parole »; « te » explicite en français le destinataire déjà évident dans le contexte, sans modifier le contenu annoncé.
- source_word: כִּי חֲמוּדוֹת אָתָּה
  choice: car tu es très aimé
  rationale: La formule exprime que Daniel est particulièrement précieux et aimé. « Très aimé » rend sa force relationnelle sans introduire de catégorie doctrinale supplémentaire.
- source_word: וּבִין בַּדָּבָר
  choice: Prête donc attention à la parole
  rationale: L’impératif de בין appelle ici au discernement attentif. Cette formulation française évite la répétition peu naturelle de « comprends » tout en maintenant le lien lexical avec la parole déjà mentionnée.
- source_word: וְהָבֵן בַּמַּרְאֶה
  choice: et comprends la vision
  rationale: Le second impératif demande explicitement de comprendre la révélation visionnaire; « vision » est le sens contextuel usuel de מַרְאֶה dans Daniel.
theological_decisions:
- issue: Portée de חֲמוּדוֹת אָתָּה concernant la position de Daniel devant Dieu
  choice: tu es très aimé
  alternative: tu es tenu en très haute estime ; tu es précieux
  rationale: Le choix exprime la faveur particulière accordée à Daniel et la dimension relationnelle de l’expression, sans préciser au-delà de l’hébreu la nature doctrinale de cette faveur.
- issue: Nature de la parole qui « sort » en réponse aux supplications
  choice: une parole est sortie
  alternative: un message est parti ; un ordre a été donné
  rationale: Le texte peut évoquer une communication divine ou un ordre mis à exécution. La traduction conserve cette ouverture plutôt que de trancher en faveur d’un décret ou d’une simple réponse verbale.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse hébraïque singulière. La traduction conserve l’image de la parole qui « sort » et accompagne cette tournure légèrement sémitique d’une note explicative.
