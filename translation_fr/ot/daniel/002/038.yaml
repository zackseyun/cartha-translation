  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/כָל דִּ֣י דארין בְּֽנֵי אֲ֠נָשָׁ/א חֵיוַ֨ת בָּרָ֤/א וְ/עוֹף שְׁמַיָּ/א֙ יְהַ֣ב בִּ/ידָ֔/ךְ וְ/הַשְׁלְטָ֖/ךְ בְּ/כָלְּ/ה֑וֹן אַנְתְּה ה֔וּא רֵאשָׁ֖/ה דִּ֥י דַהֲבָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/038.yaml
  text: And wherever the children of men dwell[a], the beasts of the field and the birds of the heavens—he has given them into your hand and made you ruler over all of them[c][b]. You are the head of gold.
translation:
  language: fr
  text: Partout où ils habitent, il a remis entre tes mains les êtres humains, les animaux des champs et les oiseaux du ciel ; il t’a établi souverain sur eux tous[b]. C’est toi qui es la tête d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Le sujet implicite de « a remis » et « a établi » est Dieu, mentionné au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל דִּי דארין
  choice: Partout où habitent
  rationale: La construction araméenne a un sens locatif distributif. « Partout où » est naturel en français et rend bien l’idée de tout lieu habité.
- source_word: בְּנֵי אֲנָשָׁא
  choice: les êtres humains
  rationale: L’expression signifie littéralement « les fils de l’homme/des hommes », mais fonctionne ici comme une désignation collective de l’humanité. « Les êtres humains » est clair, actuel et exact; la forme littérale est signalée en note.
- source_word: חֵיוַת בָּרָא
  choice: les animaux des champs
  rationale: Le groupe désigne les animaux de la campagne ou des espaces ouverts. Cette formulation conserve l’image concrète sans suggérer uniquement les animaux féroces.
- source_word: וְעוֹף שְׁמַיָּא
  choice: les oiseaux du ciel
  rationale: « Du ciel » rend naturellement en français l’araméen tout en conservant son imagerie verticale.
- source_word: יְהַב בִּידָךְ
  choice: il les a livrés entre tes mains
  rationale: L’expression idiomatique indique que ces créatures sont remises au pouvoir du roi. « Entre tes mains » préserve l’image sémitique, tandis que « livrés » exprime la remise sous autorité.
- source_word: וְהַשְׁלְטָךְ
  choice: et t’a établi souverain
  rationale: La forme causative signifie que le roi a été placé en position de domination. « Établi souverain » restitue à la fois la nomination et l’exercice de l’autorité.
- source_word: בְּכָלְּהוֹן
  choice: sur eux tous
  rationale: Le pronom renvoie aux êtres humains, aux animaux et aux oiseaux qui viennent d’être mentionnés.
- source_word: אַנְתְּה הוּא
  choice: C’est toi qui es
  rationale: La tournure emphatique française restitue mieux l’insistance du pronom araméen qu’un simple « Tu es ».
- source_word: רֵאשָׁה דִּי דַהֲבָא
  choice: la tête d’or
  rationale: Cette traduction garde la construction nominale et l’image précise de la statue, plutôt que de la réduire à l’adjectif « dorée ».
theological_decisions:
- issue: Sujet implicite de « a livrés » et « a établi »
  choice: Conserver le pronom « il » dans le texte, avec une note identifiant son référent contextuel à Dieu.
  alternative: Insérer explicitement « Dieu » dans le corps du verset.
  rationale: Le sujet n’est pas exprimé dans ce segment araméen, mais le verset précédent désigne le Dieu du ciel comme celui qui accorde la royauté. Le pronom respecte l’enchaînement du texte sans rendre le passage obscur.
- issue: Portée de בְּנֵי אֲנָשָׁא
  choice: Employer « les êtres humains » comme désignation collective.
  alternative: Traduire littéralement « les fils des hommes » ou traditionnellement « les enfants des hommes ».
  rationale: Dans ce contexte, l’expression vise l’humanité, non un groupe masculin restreint. La traduction principale communique directement cette portée, tandis que la note préserve l’image littérale.
translation_notes:
  register: Français international moderne, digne et fluide. Le verset conserve les images sémitiques naturelles en français (« entre tes mains », « tête d’or ») et rend explicitement l’emphase de אַנְתְּה הוּא par « C’est toi qui es ».
