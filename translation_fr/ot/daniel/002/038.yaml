    issue: Portée insuffisamment explicite de « les êtres humains »
    rationale: Dans le brouillon, « les êtres humains » dépend naturellement de « Partout où habitent » et n’apparaît plus clairement parmi les êtres remis au roi. Or l’araméen énumère les humains, les animaux des champs et les oiseaux du ciel avant « il a donné ... entre tes mains » et « il t’a établi sur tous ».
  revised_text: Partout où ils habitent, il a remis entre tes mains les êtres humains, les animaux des champs et les oiseaux du ciel ; il t’a établi souverain sur eux tous[b]. C’est toi qui es la tête d’or.
