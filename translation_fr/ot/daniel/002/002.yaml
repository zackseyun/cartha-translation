base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/002.yaml
  text: Then the king ordered the magicians[a], the enchanters, the sorcerers, and the Chaldeans to tell the king his dreams[b]. So they came and stood before the king.
translation:
  language: fr
  text: Alors le roi ordonna de faire venir les magiciens, les enchanteurs, les sorciers et les Chaldéens[a], afin qu’ils lui fassent connaître ses rêves. Ils vinrent donc se tenir devant le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « Chaldéens » peut désigner soit le peuple chaldéen, soit, dans ce contexte, une catégorie de sages de la cour babylonienne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִקְרֹא
  choice: ordonna de faire venir
  rationale: La tournure signifie littéralement « dit d’appeler », mais elle exprime ici un ordre royal de convoquer. « Ordonna de faire venir » restitue naturellement à la fois la valeur directive et l’idée de convocation.
- source_word: חַרְטֻמִּים
  choice: magiciens
  rationale: Le terme désigne des spécialistes de la divination ou de la magie attachés à la cour. « Magiciens » est clair, courant et adapté au contexte.
- source_word: אַשָּׁפִים
  choice: enchanteurs
  rationale: La spécialité exacte de ce groupe demeure incertaine. « Enchanteurs » le distingue des autres catégories sans imposer le sens plus précis et discuté d’« astrologues ».
- source_word: מְכַשְּׁפִים
  choice: sorciers
  rationale: Le mot vient d’une racine associée à la pratique de la sorcellerie. « Sorciers » en conserve nettement la portée occulte.
- source_word: כַּשְׂדִּים
  choice: Chaldéens[a]
  rationale: Le terme peut désigner le peuple chaldéen ou, dans ce contexte, une catégorie de sages de la cour babylonienne. La translittération préserve cette ambiguïté, explicitée en note.
- source_word: לְהַגִּיד
  choice: révèlent
  rationale: Le verbe signifie faire connaître ou déclarer. « Révèlent » convient au contexte où les spécialistes doivent faire connaître au roi le contenu de ses rêves, tout en évitant une formulation française maladroite comme « dire ses rêves ».
- source_word: חֲלֹמֹתָיו
  choice: ses rêves
  rationale: Le suffixe masculin singulier renvoie au roi. Le pluriel de l’hébreu est conservé.
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: Ils vinrent donc se tenir devant le roi
  rationale: Cette formulation conserve les deux verbes narratifs et rend naturellement l’idée de comparaître en présence du souverain.
theological_decisions: []
