id: DAN.2.32
reference: Daniel 2:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֣וּא צַלְמָ֗/א רֵאשֵׁ/הּ֙ דִּֽי דְהַ֣ב טָ֔ב חֲד֥וֹ/הִי וּ/דְרָע֖וֹ/הִי דִּ֣י כְסַ֑ף מְע֥וֹ/הִי וְ/יַרְכָתֵ֖/הּ דִּ֥י נְחָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/032.yaml
  text: That image—its head was of fine gold[a], its chest and its arms of silver[c][b], its belly and its thighs of bronze.
translation:
  language: fr
  text: Cette statue[a] avait la tête en or fin[b], la poitrine et les bras en argent, le ventre et les cuisses en bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « image ». Le mot araméen peut désigner une image ou une statue.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « bon or », c’est-à-dire un or de grande qualité.
    reason: lexical_clarification
  - marker: c
    text: Ou « cuivre ». Dans ce contexte, le mot araméen désigne généralement le bronze, mais les termes anciens relatifs aux métaux peuvent se recouper.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא צַלְמָא
  choice: Cette statue
  rationale: Le pronom reprend la figure déjà décrite, et צַלְמָא désigne ici une représentation matérielle. « Statue » est le terme le plus naturel en français dans ce contexte, tandis qu’« image » reste une possibilité réelle signalée en note.
- source_word: רֵאשֵׁהּ
  choice: la tête
  rationale: Le possessif araméen renvoie à la statue. La construction française avec « avait » permet l’article défini devant les parties du corps.
- source_word: דְהַב טָב
  choice: or fin
  rationale: L’expression signifie littéralement « bon or » et désigne un or de grande qualité, sans imposer la notion technique d’une pureté absolue.
- source_word: חֲדוֹהִי וּדְרָעוֹהִי
  choice: la poitrine et les bras
  rationale: « Poitrine » rend naturellement la partie antérieure du torse, et « bras » correspond directement au pluriel araméen.
- source_word: כְסַף
  choice: argent
  rationale: Équivalent direct du nom du métal dans ce contexte.
- source_word: מְעוֹהִי
  choice: le ventre
  rationale: Le terme désigne le ventre ou la région abdominale; « ventre » est clair, courant et adapté à la suite anatomique.
- source_word: יַרְכָתֵהּ
  choice: les cuisses
  rationale: Le mot peut désigner les cuisses, les hanches ou les flancs. Dans cette énumération des parties du corps, « cuisses » est précis et naturel.
- source_word: נְחָשׁ
  choice: bronze
  rationale: Dans les listes bibliques de métaux, le terme est traditionnellement et contextuellement rendu par « bronze », même si la terminologie ancienne peut aussi recouvrir le cuivre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « avait la tête… » restitue naturellement en français la proposition nominale araméenne et évite une dislocation lourde. Les termes anatomiques suivent la progression du texte source.
