  text: עָנֵ֣ה וְ/אָמַ֗ר לְ/אַרְיוֹךְ֙ שַׁלִּיטָ֣/א דִֽי מַלְכָּ֔/א עַל מָ֥ה דָתָ֛/א מְהַחְצְפָ֖ה מִן קֳדָ֣ם מַלְכָּ֑/א אֱדַ֣יִן מִלְּתָ֔/א הוֹדַ֥ע אַרְי֖וֹךְ לְ/דָנִיֵּֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/015.yaml
  text: He answered and said to Arioch[a], the king’s commander[b], “Why is the decree so harsh from before the king?” Then Arioch made the matter known to Daniel.
translation:
  language: fr
  text: 'Il répondit à Ariok, l’officier du roi : « Pourquoi le décret du roi est-il si sévère[a] ? » Alors Ariok informa Daniel de l’affaire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si pressant », « si dur » ou « si précipité ». Le terme araméen peut exprimer le caractère impérieux ou sévère du décret, ainsi que la hâte avec laquelle il doit être exécuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: Il prit la parole et dit
  rationale: Rend naturellement en français la formule narrative sémitique tout en conservant ses deux éléments, sans suggérer nécessairement une réponse à une question explicite.
- source_word: שַׁלִּיטָא דִי מַלְכָּא
  choice: le haut fonctionnaire du roi
  rationale: Le terme désigne ici un agent royal investi d’autorité. « Haut fonctionnaire » reste suffisamment large, puisque le mot araméen ne précise pas à lui seul un grade militaire.
- source_word: עַל מָה
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique en français.
- source_word: דָתָא
  choice: le décret
  rationale: Dans ce contexte de cour, il s’agit d’une décision royale officiellement promulguée.
- source_word: מְהַחְצְפָה
  choice: si pressant
  rationale: Le mot évoque une décision impérieuse, sévère ou précipitée. « Pressant » exprime à la fois l’urgence imposée et sa force contraignante, tandis qu’une note préserve les autres nuances possibles.
- source_word: מִן קֳדָם מַלְכָּא
  choice: émanant du roi
  rationale: Rend en français courant l’idiome araméen signifiant littéralement « de devant le roi », c’est-à-dire provenant de sa présence ou de son autorité.
- source_word: אֱדַיִן
  choice: Alors
  rationale: Connecteur narratif naturel correspondant au terme araméen.
- source_word: מִלְּתָא
  choice: l’affaire
  rationale: Désigne ici la situation ou la question en cause, sans en préciser davantage le contenu.
- source_word: הוֹדַע
  choice: informa
  rationale: 'Exprime naturellement le causatif : Ariok fit connaître l’affaire à Daniel.'
