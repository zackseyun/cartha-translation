  text: בֵּ/אדַ֣יִן דָּנִיֵּ֗אל הֲתִיב֙ עֵטָ֣א וּ/טְעֵ֔ם לְ/אַרְי֕וֹךְ רַב טַבָּחַיָּ֖/א דִּ֣י מַלְכָּ֑/א דִּ֚י נְפַ֣ק לְ/קַטָּלָ֔ה לְ/חַכִּימֵ֖י בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/014.yaml
  text: Then Daniel answered Arioch[a], the chief of the king’s executioners, with counsel and discretion—the one who had gone out to kill the wise men of Babylon.
translation:
  language: fr
  text: Alors Daniel répondit avec sagesse et discernement à Ariok[a], chef des exécuteurs du roi, qui était sorti pour tuer les sages de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef de la garde du roi ». Le titre araméen signifie littéralement « chef de ceux qui égorgent » et peut désigner, dans un contexte royal, les exécuteurs ou la garde royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: הֲתִיב
  choice: répondit
  rationale: Rend l’idiome araméen qui introduit une réponse, tout en conservant un ton narratif digne.
- source_word: עֵטָא וּטְעֵם
  choice: avec sagesse et discernement
  rationale: Rend les deux qualités complémentaires de la réponse de Daniel. « Sagesse » exprime ici le conseil avisé, tandis que « discernement » traduit l’idée de jugement mesuré et de tact.
- source_word: לְאַרְיוֹךְ
  choice: à Ariok
  rationale: Translittération française usuelle du nom propre, avec la préposition exigée par « répondre ».
- source_word: רַב טַבָּחַיָּא דִּי מַלְכָּא
  choice: chef des exécuteurs du roi
  rationale: Le titre signifie littéralement le chef de ceux qui mettent à mort; le contexte immédiat favorise « exécuteurs », sans exclure la fonction possible de garde royale, signalée en note.
- source_word: דִּי נְפַק
  choice: qui était sorti
  rationale: La relative décrit Ariok et situe sa sortie avant l’intervention de Daniel.
- source_word: לְקַטָּלָה
  choice: pour tuer
  rationale: Exprime directement le but de la sortie d’Ariok, sans atténuer la violence du décret.
- source_word: לְחַכִּימֵי בָּבֶל
  choice: les sages de Babylone
  rationale: Désignation de cour cohérente avec le contexte du livre de Daniel.
