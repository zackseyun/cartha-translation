source:
  edition: WLC
  text: וּ/מַלְכוּ֙ רביעיה תֶּהֱוֵ֥א תַקִּיפָ֖ה כְּ/פַרְזְלָ֑/א כָּ/ל קֳבֵ֗ל דִּ֤י פַרְזְלָ/א֙ מְהַדֵּ֤ק וְ/חָשֵׁל֙ כֹּ֔לָּ/א וּֽ/כְ/פַרְזְלָ֛/א דִּֽי מְרָעַ֥ע כָּל אִלֵּ֖ין תַּדִּ֥ק וְ/תֵרֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/040.yaml
  text: And the fourth kingdom will be strong like iron[a], because iron crushes and shatters everything; and like iron that breaks all these things[b], it will crush and shatter.
translation:
  language: fr
  text: Le quatrième royaume sera fort comme le fer[a], car le fer écrase et brise tout. Et comme le fer qui met en pièces toutes ces choses[b], il les écrasera et les brisera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Un quatrième royaume ». L’araméen n’emploie pas d’article défini, mais le contexte indique clairement qu’il s’agit du quatrième royaume de la série.
    reason: lexical_alternative
  - marker: b
    text: « Toutes ces choses » renvoie probablement aux royaumes précédents représentés dans la vision de la statue.
    reason: cross_reference
lexical_decisions:
- source_word: וּמַלְכוּ רביעיה
  choice: Le quatrième royaume
  rationale: מַלְכוּ désigne un « royaume » et רביעיה le qualifie de « quatrième ». Malgré l’absence d’article explicite en araméen, le contexte présente ce royaume comme le quatrième de la série.
- source_word: תֶּהֱוֵא תַקִּיפָה
  choice: sera fort
  rationale: L’imparfait de היה exprime ici un état futur, et תַקִּיפָה indique la force ou la puissance. « Sera fort » est direct et naturel en français moderne.
- source_word: כְּפַרְזְלָא
  choice: comme le fer
  rationale: La particule comparative כְ introduit une comparaison explicite avec le fer.
- source_word: כָּל קֳבֵל דִּי
  choice: car
  rationale: La locution introduit la raison de la comparaison. « Car » conserve clairement ce lien causal dans un registre narratif digne.
- source_word: מְהַדֵּק וְחָשֵׁל כֹּלָּא
  choice: écrase et brise tout
  rationale: Les deux verbes décrivent l’action destructrice du fer. « Écrase et brise » maintient leur parallélisme sans les fondre en une seule idée.
- source_word: וּכְפַרְזְלָא דִּי מְרָעַע
  choice: Et comme le fer qui met en pièces
  rationale: מְרָעַע exprime l’idée de briser ou de réduire en morceaux. « Met en pièces » rend vivement cette force destructive tout en variant naturellement le vocabulaire.
- source_word: כָּל אִלֵּין
  choice: toutes ces choses
  rationale: La formule démonstrative reste suffisamment ouverte pour renvoyer aux éléments ou royaumes précédemment évoqués, sans imposer davantage de précision que le texte.
- source_word: תַּדִּק וְתֵרֹעַ
  choice: il les écrasera et les brisera
  rationale: Les deux verbes futurs expriment une destruction complète par deux actions proches mais distinctes. Le pronom « les » reprend naturellement « toutes ces choses ».
theological_decisions: []
