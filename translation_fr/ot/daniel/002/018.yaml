source:
  edition: WLC
  text: וְ/רַחֲמִ֗ין לְ/מִבְעֵא֙ מִן קֳדָם֙ אֱלָ֣הּ שְׁמַיָּ֔/א עַל רָזָ֖/ה דְּנָ֑ה דִּ֣י לָ֤א יְהֹֽבְדוּן֙ דָּנִיֵּ֣אל וְ/חַבְר֔וֹ/הִי עִם שְׁאָ֖ר חַכִּימֵ֥י בָבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/018.yaml
  text: and to seek mercy from before the God of heaven concerning this mystery[a], so that Daniel and his companions might not perish with the rest of the wise men of Babylon.
translation:
  language: fr
  text: et de solliciter la compassion du Dieu du ciel au sujet de ce mystère[a], afin que Daniel et ses compagnons ne périssent pas avec les autres sages de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secret ». Le terme araméen désigne une réalité cachée qui ne peut être connue que par révélation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַחֲמִין לְמִבְעֵא
  choice: et de demander compassion
  rationale: Le pluriel araméen רַחֲמִין a ici le sens collectif de compassion ou miséricorde. En français, « demander compassion » restitue naturellement l’idée d’une supplication adressée à Dieu, tout en évitant le calque peu idiomatique « chercher de la compassion ».
- source_word: מִן קֳדָם אֱלָהּ שְׁמַיָּא
  choice: au Dieu du ciel
  rationale: מִן קֳדָם signifie littéralement « de devant », mais fonctionne ici comme marque de la personne auprès de qui l’on sollicite quelque chose. « Au Dieu du ciel » est naturel en français et conserve le titre divin.
- source_word: עַל רָזָה דְּנָה
  choice: au sujet de ce mystère
  rationale: רָז désigne une réalité cachée qui exige une révélation divine. « Mystère » préserve cette dimension, tandis que « secret » demeure une possibilité lexicale signalée en note.
- source_word: דִּי לָא יְהֹבְדוּן
  choice: afin que ... ne périssent pas
  rationale: La proposition exprime le but recherché. Le haphil de אבד peut évoquer le fait d’être mis à mort ou détruit; « ne périssent pas » rend ici avec naturel l’issue fatale sans surdéterminer le moyen.
- source_word: וְחַבְרוֹהִי
  choice: et ses compagnons
  rationale: « Compagnons » convient aux proches associés de Daniel dans le récit et garde un registre digne et courant.
- source_word: עִם שְׁאָר חַכִּימֵי בָבֶל
  choice: avec les autres sages de Babylone
  rationale: שְׁאָר renvoie au reste du groupe dont Daniel et ses compagnons font partie. « Les autres sages » exprime clairement cette relation en français moderne.
theological_decisions:
- issue: Sens de רָז dans le récit de Daniel 2
  choice: mystère
  alternative: secret
  rationale: Le terme désigne ici une chose cachée inaccessible à la sagesse humaine et devant être révélée par Dieu. « Mystère » conserve cette tension narrative et théologique sans lui imposer un sens technique provenant d’autres corpus bibliques.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe infinitive maintient le lien avec l’instruction donnée au verset précédent. Le calque araméen « de devant le Dieu du ciel » a été évité parce qu’il serait opaque et peu idiomatique en français.
