  - severity: low
    issue: 'Formulation de la note : « une réalité cachée qui exige une révélation »'
    rationale: La tournure est compréhensible, mais « qui ne peut être connue que par révélation » est plus idiomatique et décrit plus exactement la fonction du terme dans Daniel 2.
