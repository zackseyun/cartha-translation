  text: עָנֵ֤ה דָֽנִיֵּאל֙ וְ/אָמַ֔ר לֶהֱוֵ֨א שְׁמֵ֤/הּ דִּֽי אֱלָהָ/א֙ מְבָרַ֔ךְ מִן עָלְמָ֖/א וְ/עַ֣ד עָלְמָ֑/א דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א דִּ֥י לֵֽ/הּ הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/020.yaml
  text: 'Daniel answered and said: “Blessed be the name of God from everlasting to everlasting[b][a], for wisdom and might belong to him.”'
translation:
  language: fr
  text: 'Daniel répondit : « Que le nom de Dieu soit béni d’éternité en éternité[a], car la sagesse et la puissance lui appartiennent[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « d’âge en âge » ou « pour toujours et à jamais ».

      '
    reason: lexical_alternative
  - marker: b
    text: 'Ou « sont à lui ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: prit la parole et dit
  rationale: Cette formule rend naturellement en français l’idiome araméen qui associe « répondre » et « dire », sans suggérer nécessairement que Daniel répond à une question explicite.
- source_word: לֶהֱוֵא ... מְבָרַךְ
  choice: Que ... soit béni
  rationale: Le subjonctif introduit naturellement le souhait bénédictif et conserve le registre solennel de la doxologie.
- source_word: שְׁמֵהּ דִּי אֱלָהָא
  choice: le nom de Dieu
  rationale: Cette formulation directe préserve l’idiome biblique du « nom », qui évoque l’identité manifestée et l’honneur de Dieu.
- source_word: מִן עָלְמָא וְעַד עָלְמָא
  choice: d’éternité en éternité
  rationale: Expression française consacrée et intelligible qui restitue l’ampleur temporelle de la formule araméenne, tout en signalant en note les rendus possibles par « âge ».
- source_word: דִּי
  choice: car
  rationale: 'La particule introduit ici le motif de la bénédiction : la sagesse et la puissance appartiennent à Dieu.'
- source_word: חָכְמְתָא
  choice: la sagesse
  rationale: Équivalent direct de ce nom abstrait araméen.
- source_word: גְבוּרְתָא
  choice: la puissance
  rationale: Le terme désigne la force ou la puissance. « Puissance » convient au contexte doxologique et s’associe naturellement à « sagesse ».
- source_word: דִּי לֵהּ הִיא
  choice: lui appartiennent
  rationale: Cette tournure exprime clairement la possession sans ajouter l’idée d’exclusivité, qui n’est pas explicitement formulée.
theological_decisions:
- issue: Formule doxologique et attributs divins
  choice: Présenter le verset comme une bénédiction du nom de Dieu, motivée par le fait que la sagesse et la puissance lui appartiennent.
  alternative: 'Traduire plus littéralement : « Que le nom de Dieu soit béni… parce que la sagesse et la puissance sont à lui. »'
  rationale: Le texte est une doxologie plutôt qu’une définition métaphysique. La formulation conserve la bénédiction et l’attribution à Dieu de la sagesse et de la puissance sans développer de conclusion doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « prit la parole et dit » évite le calque peu naturel « répondit et dit », tandis que « Que… soit béni » maintient la solennité de la bénédiction.
