  text: וְ/הֵ֨ן חֶלְמָ֤/א וּ/פִשְׁרֵ/הּ֙ תְּֽהַחֲוֺ֔ן מַתְּנָ֤ן וּ/נְבִזְבָּה֙ וִ/יקָ֣ר שַׂגִּ֔יא תְּקַבְּל֖וּן מִן קֳדָמָ֑/י לָהֵ֕ן חֶלְמָ֥/א וּ/פִשְׁרֵ֖/הּ הַחֲוֺֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/006.yaml
  text: But if you make known the dream and its interpretation[a], you will receive from me gifts and rewards and great honor. Therefore make known to me the dream and its interpretation.
translation:
  language: fr
  text: Mais si vous faites connaître le rêve et son interprétation[a], vous recevrez de ma part des cadeaux, une récompense et un grand honneur. Faites-moi donc connaître le rêve et son interprétation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous révélez » ou « vous déclarez »; le même verbe araméen est repris dans l’ordre « faites-moi connaître ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵן
  choice: Mais si
  rationale: Introduit une condition qui contraste avec la menace du verset précédent.
- source_word: חֶלְמָא
  choice: le rêve
  rationale: L’article défini convient au rêve précis dont le roi exige le récit.
- source_word: וּפִשְׁרֵהּ
  choice: et son interprétation
  rationale: פשר désigne couramment dans Daniel l’interprétation ou l’explication d’un rêve.
- source_word: תְּהַחֲוֺן / הַחֲוֺנִי
  choice: vous faites connaître / faites-moi connaître
  rationale: Le haphel de חוה exprime l’action de faire connaître ou de déclarer; la répétition française conserve celle du texte araméen.
- source_word: מַתְּנָן
  choice: des cadeaux
  rationale: Le pluriel désigne des biens de valeur accordés par le roi; « cadeaux » est clair en français moderne.
- source_word: וּנְבִזְבָּה
  choice: une récompense
  rationale: Le nom singulier désigne une gratification ou récompense royale.
- source_word: וִיקָר שַׂגִּיא
  choice: et de grands honneurs
  rationale: Rend naturellement en français l’idée d’un honneur ou prestige considérable.
- source_word: תְּקַבְּלוּן
  choice: vous recevrez
  rationale: L’imparfait araméen a ici une valeur future dans la conséquence de la condition.
- source_word: מִן קֳדָמַי
  choice: de ma part
  rationale: Cette tournure idiomatique exprime que les dons proviendront du roi.
- source_word: לָהֵן
  choice: donc
  rationale: Marque l’inférence qui conduit de la récompense promise à l’ordre final.
