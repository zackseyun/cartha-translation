id: DAN.2.45
reference: Daniel 2:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דִּֽי חֲזַ֡יְתָ דִּ֣י מִ/טּוּרָ/א֩ אִתְגְּזֶ֨רֶת אֶ֜בֶן דִּי לָ֣א בִ/ידַ֗יִן וְ֠/הַדֶּקֶת פַּרְזְלָ֨/א נְחָשָׁ֤/א חַסְפָּ/א֙ כַּסְפָּ֣/א וְ/דַהֲבָ֔/א אֱלָ֥הּ רַב֙ הוֹדַ֣ע לְ/מַלְכָּ֔/א מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/יַצִּ֥יב חֶלְמָ֖/א וּ/מְהֵימַ֥ן פִּשְׁרֵֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/045.yaml
  text: Just as you saw that a stone was cut from the mountain not by hands[a], and that it crushed the iron, the bronze, the clay, the silver, and the gold, the great God has made known to the king what will happen after this. The dream is certain, and its interpretation is trustworthy.
translation:
  language: fr
  text: De même, tu as vu qu’une pierre avait été taillée dans la montagne sans l’intervention de mains humaines[a] et qu’elle a broyé le fer, le bronze, l’argile, l’argent et l’or. Le grand Dieu a fait connaître au roi ce qui arrivera après cela. Le rêve est certain, et son interprétation est digne de confiance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « non par des mains »; cette expression indique que la pierre n’a pas été taillée par une action humaine.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: De même
  rationale: Cette locution araméenne introduit ici le rapport entre le détail vu dans le rêve et son explication. « De même » rend naturellement cette valeur de correspondance sans imposer une causalité trop forte.
- source_word: חֲזַיְתָ
  choice: tu as vu
  rationale: Le singulier correspond à l’adresse directe au roi et conserve la simplicité du verbe araméen.
- source_word: מִטּוּרָא
  choice: de la montagne
  rationale: La forme déterminée désigne « la montagne »; la préposition marque la provenance.
- source_word: אִתְגְּזֶרֶת אֶבֶן
  choice: une pierre s’est détachée
  rationale: Le verbe passif signifie littéralement que la pierre « fut taillée/coupée ». Dans ce contexte, « s’est détachée » exprime naturellement sa séparation de la montagne, tandis que la note préserve l’indication d’une action non humaine.
- source_word: דִּי לָא בִידַיִן
  choice: sans l’intervention de mains humaines
  rationale: Littéralement « non par des mains ». Cette formulation française rend clairement l’absence d’action humaine sans identifier plus précisément l’agent.
- source_word: וְהַדֶּקֶת
  choice: et qu’elle a broyé
  rationale: Le verbe évoque l’action de réduire en morceaux ou de pulvériser. « Broyé » est précis, vigoureux et naturel.
- source_word: פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא
  choice: le fer, le bronze, l’argile, l’argent et l’or
  rationale: L’ordre des cinq matières est conservé exactement. « Bronze » convient au métal désigné ici par נְחָשָׁא.
- source_word: אֱלָהּ רַב
  choice: Le grand Dieu
  rationale: Rendu direct de l’adjectif et du nom, en conservant la désignation solennelle sans ajouter une qualification doctrinale.
- source_word: הוֹדַע לְמַלְכָּא
  choice: a fait connaître au roi
  rationale: Le causatif signifie « faire connaître ». La formulation reste proche de l’araméen et idiomatique en français.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: ce qui arrivera après cela
  rationale: La proposition est tournée vers l’avenir. « Après cela » conserve le démonstratif singulier sans explicitation supplémentaire.
- source_word: וְיַצִּיב חֶלְמָא
  choice: Le rêve est certain
  rationale: יַצִּיב exprime ce qui est ferme, établi ou certain. « Certain » communique ici la validité assurée du rêve.
- source_word: וּמְהֵימַן פִּשְׁרֵהּ
  choice: et son interprétation est digne de confiance
  rationale: מְהֵימַן signifie fiable ou digne de confiance. La formulation française attribue clairement cette qualité à l’interprétation.
theological_decisions:
- issue: Agent implicite dans l’expression « non par des mains »
  choice: 'Conserver l’absence d’intervention humaine sans nommer explicitement l’agent : « sans l’intervention de mains humaines »'
  alternative: « sans aucune main » ou « sans intervention humaine »
  rationale: Le contexte implique une action qui ne vient pas des humains et l’attribue ultimement à Dieu, mais l’expression araméenne ne nomme pas directement l’agent. La traduction conserve cette retenue et la tension théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement conserve le singulier de l’adresse araméenne au roi. Le vocabulaire reste accessible tout en maintenant le caractère solennel de la déclaration.
