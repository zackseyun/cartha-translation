  naturalness: Le français est clair, moderne et d'un registre convenant au discours solennel. « Avait été taillée dans la montagne » est naturel et rend plus explicitement l'image de la pierre taillée tout en conservant sa provenance.
  terminology: « Le grand Dieu », « bronze », « interprétation » et « digne de confiance » conviennent. La note conserve utilement l'idiome relatif aux mains et son absence d'agence humaine explicite.
