id: DAN.2.29
reference: Daniel 2:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א רַעְיוֹנָ/ךְ֙ עַל מִשְׁכְּבָ֣/ךְ סְלִ֔קוּ מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/גָלֵ֧א רָזַיָּ֛/א הוֹדְעָ֖/ךְ מָה דִ֥י לֶהֱוֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/029.yaml
  text: As for you[a], O king, your thoughts came up on your bed about what would happen after this, and he who reveals mysteries has made known to you what would happen.
translation:
  language: fr
  text: Quant à toi, ô roi, pendant que tu étais sur ton lit, tes pensées se sont portées sur ce qui arriverait après cela, et celui qui révèle les mystères t’a fait connaître ce qui arriverait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְתְּה
  choice: Quant à toi
  rationale: Le pronom indépendant est emphatique et place le roi au premier plan; cette tournure conserve naturellement cette mise en relief en français.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Le nom est employé en adresse directe; « ô roi » maintient le registre solennel et courtois du récit.
- source_word: רַעְיוֹנָךְ
  choice: tes pensées
  rationale: Le nom désigne les pensées ou réflexions du roi; « pensées » est courant et suffisamment large.
- source_word: עַל מִשְׁכְּבָךְ
  choice: pendant que tu étais sur ton lit
  rationale: Cette formulation naturelle conserve le cadre locatif tout en évitant en français l’enchaînement maladroit « tes pensées sur ton lit ».
- source_word: סְלִקוּ
  choice: se sont portées sur
  rationale: Le verbe évoque littéralement des pensées qui montent ou surgissent. Avec leur complément de contenu, « se sont portées sur » rend naturellement le mouvement mental sans en modifier le sens.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: ce qui arriverait après cela
  rationale: La proposition indique le contenu futur des pensées; le conditionnel convient au futur envisagé depuis le moment passé du récit.
- source_word: וְגָלֵא רָזַיָּא
  choice: et celui qui révèle les mystères
  rationale: Le participe araméen décrit celui qui révèle les choses cachées et peut avoir une valeur quasi titulaire. Cette traduction préserve les deux nuances sans imposer une majuscule titulaire.
- source_word: הוֹדְעָךְ
  choice: t’a fait connaître
  rationale: La forme causative signifie « faire connaître »; le passé composé convient au discours explicatif adressé au roi.
- source_word: מָה דִי לֶהֱוֵא
  choice: ce qui arriverait
  rationale: La répétition de l’expression future est conservée afin de respecter la structure et l’insistance du texte araméen.
theological_decisions:
- issue: Valeur divine et éventuellement titulaire de גָלֵא רָזַיָּא
  choice: celui qui révèle les mystères
  alternative: le Révélateur des mystères
  rationale: Le texte emploie un participe descriptif sans nommer explicitement Dieu dans cette proposition. La formulation retenue identifie la fonction divine sans transformer nécessairement l’expression en titre formel ni ajouter un nom absent.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à la deuxième personne singulière araméenne et demeure naturel dans l’adresse royale biblique. La syntaxe a été légèrement réorganisée pour éviter une ambiguïté française sur l’emplacement des pensées, tout en conservant l’ordre logique du verset et sa répétition finale.
