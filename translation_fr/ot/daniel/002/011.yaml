  text: וּ/מִלְּתָ֨/א דִֽי מַלְכָּ֤/ה שָׁאֵל֙ יַקִּירָ֔ה וְ/אָחֳרָן֙ לָ֣א אִיתַ֔י דִּ֥י יְחַוִּנַּ֖/הּ קֳדָ֣ם מַלְכָּ֑/א לָהֵ֣ן אֱלָהִ֔ין דִּ֚י מְדָ֣רְ/ה֔וֹן עִם בִּשְׂרָ֖/א לָ֥א אִיתֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/011.yaml
  text: And the thing that the king asks is difficult[a], and there is no other who can declare it before the king except the gods[b], whose dwelling is not with flesh.
translation:
  language: fr
  text: Ce que le roi demande est difficile[a], et personne d’autre ne peut le faire connaître devant le roi, excepté les dieux, dont la demeure n’est pas parmi les êtres de chair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce que le roi demande est ardu » ; le terme peut aussi évoquer quelque chose de rare ou d’extraordinaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dont la demeure n’est pas parmi les humains » ou « parmi les mortels ». Littéralement : « avec la chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּתָא
  choice: ce que
  rationale: Le nom araméen peut désigner une chose, une affaire ou une parole. La tournure « ce que le roi demande » exprime naturellement en français l’objet de sa demande sans en préciser excessivement la nature.
- source_word: שָׁאֵל
  choice: demande
  rationale: Le participe désigne ce que le roi est en train de demander. « Demande » reste direct sans renforcer indûment le verbe en « exige ».
- source_word: יַקִּירָה
  choice: difficile
  rationale: L’adjectif peut évoquer ce qui est lourd, rare, précieux ou difficile. Dans ce contexte, les sages soulignent l’extrême difficulté de la demande.
- source_word: וְאָחֳרָן לָא אִיתַי
  choice: et personne d’autre ne peut
  rationale: L’expression nie l’existence de quelqu’un d’autre capable de fournir la réponse. Cette formulation française rend explicitement le référent humain sous-entendu et s’enchaîne naturellement avec le verbe suivant.
- source_word: יְחַוִּנַּהּ
  choice: l’exposer
  rationale: Le verbe signifie montrer, déclarer ou faire connaître. « Exposer » convient à une déclaration officielle devant le roi tout en gardant le pronom qui renvoie à la chose demandée.
- source_word: קֳדָם מַלְכָּא
  choice: devant le roi
  rationale: La locution signifie « en présence du roi ». « Devant le roi » en conserve directement l’image et le cadre de cour.
- source_word: לָהֵן
  choice: excepté
  rationale: La particule introduit ici l’unique exception à l’affirmation précédente.
- source_word: אֱלָהִין
  choice: les dieux
  rationale: La forme est plurielle et, dans la bouche des sages babyloniens, désigne naturellement les dieux plutôt que le Dieu d’Israël.
- source_word: מְדָרְהוֹן
  choice: dont la demeure
  rationale: Le nom désigne le lieu où l’on habite. « Demeure » garde la construction relationnelle et un registre digne sans être archaïque.
- source_word: עִם בִּשְׂרָא
  choice: avec la chair
  rationale: L’araméen dit littéralement « avec la chair ». Le texte principal préserve cette image concrète et le contraste entre les dieux et les êtres corporels; une note fournit des formulations interprétatives plus courantes.
- source_word: לָא אִיתוֹהִי
  choice: n’est pas
  rationale: L’expression existentielle ou copulative fonctionne ici comme une simple négation portant sur la demeure.
theological_decisions:
- issue: Référent de אֱלָהִין
  choice: les dieux
  alternative: les êtres divins; Dieu
  rationale: La morphologie plurielle et le contexte de la cour babylonienne favorisent « les dieux ». Le singulier « Dieu » introduirait dans les paroles des conseillers un cadre monothéiste que la formulation araméenne n’impose pas.
- issue: Sens de בִּשְׂרָא
  choice: la chair
  alternative: les humains; les mortels
  rationale: Le terme concret est « chair ». Le conserver maintient l’imagerie et l’ambiguïté du texte, tandis que la note indique les référents humains possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure fluide tout en conservant « devant le roi » et l’image inhabituelle de la demeure qui n’est pas « avec la chair ».
