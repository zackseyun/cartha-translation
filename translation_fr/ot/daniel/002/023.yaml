  terminology: « Dieu de mes pères », « sagesse », « force », « faire connaître » et « l’affaire du roi » sont appropriés. La note sur « question du roi » est un peu plus étroite que le terme araméen; « affaire » ou « chose » préservent mieux son amplitude.
