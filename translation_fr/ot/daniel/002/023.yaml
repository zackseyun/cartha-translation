source:
  edition: WLC
  text: לָ֣/ךְ אֱלָ֣הּ אֲבָהָתִ֗/י מְהוֹדֵ֤א וּ/מְשַׁבַּח֙ אֲנָ֔ה דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א יְהַ֣בְתְּ לִ֑/י וּ/כְעַ֤ן הֽוֹדַעְתַּ֨/נִי֙ דִּֽי בְעֵ֣ינָא מִנָּ֔/ךְ דִּֽי מִלַּ֥ת מַלְכָּ֖/א הוֹדַעְתֶּֽ/נָא׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/023.yaml
  text: To you[a], O God of my fathers, I give thanks and praise, because you have given me wisdom and might, and now you have made known to me what we requested from you[c][b], for you have made known to us the king’s matter.
translation:
  language: fr
  text: À toi, Dieu de mes pères[a], je rends grâce et je te loue, car tu m’as donné sagesse et force. Et maintenant, tu m’as fait connaître ce que nous t’avions demandé, car tu nous as fait connaître l’affaire du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu de mes ancêtres ». L’araméen dit littéralement « Dieu de mes pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la parole du roi » ou « la chose du roi ». Le terme araméen peut désigner une parole, une chose ou une affaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהּ אֲבָהָתִי
  choice: Dieu de mes pères
  rationale: La formulation conserve le sens littéral et le lien familial avec les générations précédentes. En français biblique, « pères » demeure compréhensible et plus proche de l’araméen que « ancêtres ».
- source_word: מְהוֹדֵא וּמְשַׁבַּח אֲנָה
  choice: je rends grâce et j’adresse mes louanges
  rationale: 'Cette formulation naturelle et digne maintient les deux actes coordonnés : remercier Dieu et le louer. L’expression « j’adresse mes louanges » explicite naturellement en français le destinataire déjà placé en tête : « À toi ».'
- source_word: חָכְמְתָא וּגְבוּרְתָא
  choice: sagesse et force
  rationale: « Sagesse » rend directement חָכְמְתָא. « Force » conserve la portée assez large de גְבוּרְתָא sans la limiter à la seule force physique ni la transformer en autorité institutionnelle.
- source_word: יְהַבְתְּ לִי
  choice: tu m’as donné
  rationale: Le passé composé exprime naturellement en français l’action accomplie dont Daniel constate le résultat présent.
- source_word: וּכְעַן
  choice: Et maintenant
  rationale: Cette transition marque le passage des dons reçus à la révélation qui vient d’être accordée.
- source_word: הוֹדַעְתַּנִי
  choice: tu m’as fait connaître
  rationale: Le causatif de ידע signifie littéralement « faire connaître ». La traduction garde aussi le parallélisme avec הוֹדַעְתֶּנָא à la fin du verset.
- source_word: דִּי בְעֵינָא מִנָּךְ
  choice: ce que nous t’avions demandé
  rationale: Le pluriel « nous » reproduit la première personne du pluriel de l’araméen et rappelle la requête commune de Daniel et de ses compagnons. Le plus-que-parfait situe clairement cette demande avant la réponse désormais reçue.
- source_word: מִלַּת מַלְכָּא
  choice: l’affaire du roi
  rationale: מִלָּה peut désigner une parole, une chose ou une affaire. Dans le contexte, « affaire » désigne sans surinterprétation la question soumise par le roi.
- source_word: הוֹדַעְתֶּנָא
  choice: tu nous as fait connaître
  rationale: Le suffixe de première personne du pluriel est explicitement conservé, malgré le singulier employé juste auparavant pour Daniel.
theological_decisions:
- issue: Continuité familiale et historique dans l’adresse à Dieu
  choice: Dieu de mes pères
  alternative: Dieu de mes ancêtres
  rationale: « Pères » préserve l’expression araméenne et son évocation de la continuité avec les générations antérieures, sans ajouter une interprétation confessionnelle.
- issue: Alternance entre le singulier et le pluriel
  choice: tu m’as fait connaître ce que nous t’avions demandé… tu nous as fait connaître
  alternative: 'Uniformiser au singulier : « ce que je t’avais demandé… tu m’as fait connaître »'
  rationale: L’araméen passe expressément du singulier au pluriel. La traduction maintient cette tension grammaticale et la dimension communautaire de la demande.
- issue: Portée de מִלַּת מַלְכָּא
  choice: l’affaire du roi
  alternative: la parole du roi
  rationale: « Affaire » conserve la largeur sémantique du terme et convient au rêve ainsi qu’à la question posée par le roi, sans préciser davantage que le texte.
translation_notes:
  register: 'Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu. La répétition de « faire connaître » est volontaire : elle reflète celle du texte araméen. Les formes singulières et plurielles sont maintenues avec précision.'
