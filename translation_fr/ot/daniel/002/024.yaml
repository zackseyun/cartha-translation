  text: כָּ/ל קֳבֵ֣ל דְּנָ֗ה דָּֽנִיֵּאל֙ עַ֣ל עַל אַרְי֔וֹךְ דִּ֚י מַנִּ֣י מַלְכָּ֔/א לְ/הוֹבָדָ֖ה לְ/חַכִּימֵ֣י בָבֶ֑ל אֲזַ֣ל וְ/כֵ֣ן אֲמַר לֵ֗/הּ לְ/חַכִּימֵ֤י בָבֶל֙ אַל תְּהוֹבֵ֔ד הַעֵ֨לְ/נִי֙ קֳדָ֣ם מַלְכָּ֔/א וּ/פִשְׁרָ֖/א לְ/מַלְכָּ֥/א אֲחַוֵּֽא־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/024.yaml
  text: 'Therefore Daniel went in to Arioch[a], whom the king had appointed to destroy the wise men of Babylon. He went and said this to him: “Do not destroy the wise men of Babylon. Bring me in before the king[b], and I will show the interpretation to the king.”'
translation:
  language: fr
  text: 'C’est pourquoi Daniel se rendit auprès d’Ariok, que le roi avait chargé de faire périr les sages de Babylone. Il alla lui dire : « Ne fais pas périr les sages de Babylone. Fais-moi entrer en présence du roi, et je ferai connaître au roi l’interprétation. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: C’est pourquoi
  rationale: Rend naturellement le marqueur araméen de conséquence et relie l’action de Daniel à la révélation reçue précédemment.
- source_word: עַל עַל־אַרְיוֹךְ
  choice: se rendit auprès d’Ariok
  rationale: Exprime l’approche d’Ariok dans le cadre de la cour, sans imposer l’idée plus précise d’entrer dans une pièce.
- source_word: דִּי מַנִּי מַלְכָּא
  choice: que le roi avait chargé
  rationale: מני indique ici une désignation ou une mission officielle; « avait chargé » convient directement avec l’infinitif qui suit.
- source_word: לְהוֹבָדָה / אַל תְּהוֹבֵד
  choice: faire périr / Ne fais pas périr
  rationale: Le causatif de אבד signifie causer la perte ou la mort. « Faire périr » conserve la portée du verbe tout en rendant clairement l’ordre d’exécution, avec cohérence entre ses deux occurrences.
- source_word: לְחַכִּימֵי בָבֶל
  choice: les sages de Babylone
  rationale: Désignation française naturelle des spécialistes de la cour babylonienne dans ce contexte.
- source_word: אֲזַל וְכֵן אֲמַר לֵהּ
  choice: Il alla lui dire
  rationale: Formulation française fluide qui conserve la succession du déplacement et de la prise de parole.
- source_word: הַעֵלְנִי קֳדָם מַלְכָּא
  choice: Fais-moi entrer en présence du roi
  rationale: Reproduit le causatif « fais-moi entrer » et la locution « devant/en présence du roi » dans un français digne et idiomatique.
- source_word: וּפִשְׁרָא
  choice: l’interprétation
  rationale: פשר est le terme technique employé dans Daniel pour l’interprétation d’un rêve ou d’un mystère.
- source_word: אֲחַוֵּא
  choice: je ferai connaître
  rationale: Le verbe signifie « montrer, faire connaître ». Avec « interprétation », « faire connaître » est naturel en français et garde la valeur déclarative du verbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « faire périr » préserve le lien lexical araméen entre la mission confiée à Ariok et l’ordre que Daniel lui donne de ne pas l’exécuter. Aucun ajout confessionnel ni résolution théologique étrangère au texte.
