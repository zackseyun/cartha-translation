id: DAN.2.46
reference: Daniel 2:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֵּ֠/אדַיִן מַלְכָּ֤/א נְבֽוּכַדְנֶצַּר֙ נְפַ֣ל עַל אַנְפּ֔וֹ/הִי וּ/לְ/דָנִיֵּ֖אל סְגִ֑ד וּ/מִנְחָה֙ וְ/נִ֣יחֹחִ֔ין אֲמַ֖ר לְ/נַסָּ֥כָה לֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/046.yaml
  text: Then King Nebuchadnezzar fell on his face and paid homage to Daniel[c][b][a], and he commanded that an offering and incense be offered to him.
translation:
  language: fr
  text: Alors le roi Nebucadnetsar tomba face contre terre et rendit hommage à Daniel[a]. Puis il ordonna qu’on lui offre une offrande et des parfums agréables[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adora Daniel » ou « se prosterna devant Daniel ». Le verbe araméen peut désigner une prosternation ou un hommage révérenciel.
    reason: alternative_reading
  - marker: b
    text: Ou « des odeurs agréables » ou « des parfums apaisants ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe traduit par « offre » évoque plus précisément l’action de verser, notamment de répandre une libation pour quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la succession narrative de manière naturelle en français moderne.
- source_word: מַלְכָּא נְבוּכַדְנֶצַּר
  choice: le roi Nebucadnetsar
  rationale: Rend naturellement l’apposition araméenne du titre et du nom.
- source_word: נְפַל עַל אַנְפּוֹהִי
  choice: tomba face contre terre
  rationale: Conserve l’image physique forte de l’expression araméenne dans une tournure française idiomatique.
- source_word: סְגִד
  choice: rendit hommage
  rationale: Le verbe peut désigner la prosternation ou un hommage révérenciel. Ce choix conserve la révérence extrême sans affirmer explicitement qu’un culte divin est rendu à Daniel.
- source_word: מִנְחָה
  choice: une offrande
  rationale: Terme assez large pour préserver à la fois l’idée de présent et la nuance cultuelle, sans préciser indûment la nature de l’offrande.
- source_word: נִיחֹחִין
  choice: des parfums agréables
  rationale: Rend plus directement le pluriel et l’idée d’odeurs apaisantes ou agréables associées à l’offrande, tout en restant intelligible en français.
- source_word: אֲמַר לְנַסָּכָה לֵהּ
  choice: il ordonna qu’on lui offre
  rationale: Exprime clairement la valeur de commandement et produit une phrase française naturelle; une note signale que le verbe évoque plus précisément l’action de verser une libation.
theological_decisions:
- issue: Faut-il rendre סְגִד envers Daniel par « adorer » ou par un terme moins chargé théologiquement ?
  choice: rendit hommage
  alternative: adora Daniel / se prosterna devant Daniel
  rationale: « Rendit hommage » préserve la prosternation révérencielle sans décider que Nebucadnetsar reconnaît Daniel comme divin. La note maintient ouvertes les nuances permises par l’araméen.
translation_notes:
  register: Français international moderne, narratif et digne. « Face contre terre » conserve la vivacité de l’idiome; « rendit hommage » évite une surinterprétation théologique; « parfums agréables » garde la nuance sensorielle du pluriel araméen.
