id: DAN.2.19
reference: Daniel 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱדַ֗יִן לְ/דָנִיֵּ֛אל בְּ/חֶזְוָ֥/א דִֽי לֵילְיָ֖/א רָזָ֣/ה גֲלִ֑י אֱדַ֨יִן֙ דָּֽנִיֵּ֔אל בָּרִ֖ךְ לֶ/אֱלָ֥הּ שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/019.yaml
  text: Then the mystery was revealed to Daniel in a vision of the night[c][b][a]. Then Daniel blessed the God of heaven.
translation:
  language: fr
  text: Alors le mystère fut révélé à Daniel dans une vision de la nuit[a]. Alors Daniel bénit le Dieu du ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une vision nocturne ».
    reason: lexical_alternative
  - marker: b
    text: Ou « loua le Dieu du ciel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marqueur narratif de succession, rendu de façon naturelle tout en conservant sa répétition au début des deux propositions.
- source_word: בְּחֶזְוָא דִי לֵילְיָא
  choice: dans une vision de la nuit
  rationale: Rend de près la formulation araméenne et conserve son image, tout en restant compréhensible en français moderne.
- source_word: רָזָה
  choice: le mystère
  rationale: Désigne ici la réalité cachée concernant le rêve du roi et sa signification; « mystère » convient à une chose cachée que Dieu dévoile.
- source_word: גֲלִי
  choice: fut révélé
  rationale: Le passif exprime que le mystère a été porté à la connaissance de Daniel, sans préciser explicitement l'agent dans cette proposition.
- source_word: בָּרִךְ
  choice: bénit
  rationale: Correspond directement au verbe araméen et conserve l'expression biblique appliquée à la réponse humaine envers Dieu.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: le Dieu du ciel
  rationale: Titre biblique naturel en français, qui rend le sens déterminé de l'expression araméenne.
- source_word: דָנִיֵּאל
  choice: Daniel
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Le langage de révélation appliqué à la réalité cachée
  choice: le mystère fut révélé
  alternative: le secret fut dévoilé
  rationale: « Révélé » préserve l'idée d'une communication divine en réponse à la prière, sans ajouter un agent que la proposition araméenne laisse implicite.
- issue: La réponse de Daniel à Dieu dans בָּרִךְ
  choice: Daniel bénit le Dieu du ciel
  alternative: Daniel loua le Dieu du ciel
  rationale: « Bénit » reflète plus directement le verbe source et maintient la tension propre à l'idiome biblique, tandis que « loua » en expliciterait le sens contextuel.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « Alors » reproduit la progression narrative de l'araméen. Le passé simple convient au registre narratif biblique sans archaïsme marqué.
