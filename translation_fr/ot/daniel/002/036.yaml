  text: This was the dream[a], and we will tell its interpretation before the king.
translation:
  language: fr
  text: Tel était le rêve[a] ; nous allons en exposer l’interprétation devant le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici le rêve ; et nous en exposerons l’interprétation devant le roi. » La phrase nominale araméenne permet de légères différences de temps et de ponctuation sans changement essentiel de sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Tel était
  rationale: Le démonstratif araméen renvoie au rêve qui vient d’être raconté. « Tel était » forme en français une conclusion rétrospective naturelle sans ajouter de contenu.
- source_word: חֶלְמָא
  choice: le rêve
  rationale: Le nom défini désigne le rêve précis de Nabuchodonosor.
- source_word: וּפִשְׁרֵהּ
  choice: son interprétation / en exposer l’interprétation
  rationale: פִשְׁרָא est le terme technique employé pour l’interprétation d’un rêve ou d’un mystère. La reprise pronominale « en » renvoie clairement au rêve en français.
- source_word: נֵאמַר
  choice: nous allons exposer
  rationale: L’imparfait araméen à la première personne du pluriel annonce ce qui va être dit. « Exposer » convient à la présentation ordonnée d’une interprétation devant le roi, tandis que « allons » garde la valeur prospective immédiate.
- source_word: קֳדָם
  choice: devant
  rationale: Le terme signifie « devant » ou « en présence de » et maintient ici le cadre de la cour royale.
- source_word: מַלְכָּא
  choice: le roi
  rationale: Le nom défini suffit, puisque le référent est évident dans le contexte et que le texte source ne répète pas son nom.
