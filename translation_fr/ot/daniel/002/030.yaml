reference: Daniel 2:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנָ֗ה לָ֤א בְ/חָכְמָה֙ דִּֽי אִיתַ֥י בִּ/י֙ מִן כָּל חַיַּיָּ֔/א רָזָ֥/א דְנָ֖ה גֱּלִ֣י לִ֑/י לָהֵ֗ן עַל דִּבְרַת֙ דִּ֤י פִשְׁרָ/א֙ לְ/מַלְכָּ֣/א יְהוֹדְע֔וּן וְ/רַעְיוֹנֵ֥י לִבְבָ֖/ךְ תִּנְדַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/030.yaml
  text: But as for me[a], this mystery has been revealed to me not because of wisdom that is in me more than in all the living, but in order that the interpretation may be made known to the king[b], and that you may know the thoughts of your heart.
translation:
  language: fr
  text: Quant à moi, ce mystère ne m’a pas été révélé parce que j’aurais en moi plus de sagesse que tous les vivants, mais afin que l’interprétation soit portée à la connaissance du roi et que tu connaisses les pensées de ton cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנָה
  choice: Quant à moi
  rationale: Le pronom indépendant introduit Daniel comme thème contrastif. « Quant à moi » rend cette mise en relief avec naturel, sans alourdir la phrase par un « mais » supplémentaire.
- source_word: לָא בְחָכְמָה דִּי אִיתַי בִּי מִן כָּל חַיַּיָּא
  choice: non parce que j’aurais en moi plus de sagesse que tous les vivants
  rationale: La préposition exprime ici le fondement ou la cause, et מִן marque la comparaison. Le conditionnel « j’aurais » formule naturellement en français le motif explicitement nié, tout en conservant l’humilité de Daniel et la comparaison avec tous les vivants.
- source_word: רָזָא דְנָה
  choice: ce mystère
  rationale: Dans Daniel, רָז désigne une réalité cachée rendue accessible par révélation. « Mystère » conserve cette dimension de dévoilement divin mieux que le simple « secret ».
- source_word: גֱּלִי לִי
  choice: m’a été révélé
  rationale: Le passif indique clairement que Daniel reçoit la révélation sans en être la source. Le passé composé convient à l’explication présente qu’il donne au roi.
- source_word: לָהֵן עַל דִּבְרַת דִּי
  choice: mais afin que
  rationale: L’ensemble introduit le but en contraste avec le motif qui vient d’être nié. « Mais afin que » restitue à la fois ce contraste et la valeur finale.
- source_word: פִשְׁרָא
  choice: l’interprétation
  rationale: פשר est le terme usuel de Daniel pour l’interprétation d’un rêve ou d’un mystère; « interprétation » est ici précis et idiomatique.
- source_word: לְמַלְכָּא יְהוֹדְעוּן
  choice: soit portée à la connaissance du roi
  rationale: Le pluriel verbal a ici une valeur impersonnelle proche du passif. Cette formulation française évite d’introduire un sujet non exprimé et communique clairement que le roi doit recevoir l’interprétation.
- source_word: וְרַעְיוֹנֵי לִבְבָךְ
  choice: les pensées de ton cœur
  rationale: La traduction conserve « cœur », qui désigne dans l’anthropologie biblique le siège de la pensée et de la réflexion, plutôt que de le réduire à « esprit ».
- source_word: תִּנְדַּע
  choice: tu connaisses
  rationale: Le subjonctif dépend naturellement de « afin que » et exprime le but de la révélation.
theological_decisions:
- issue: Le refus par Daniel de toute supériorité personnelle comme cause de la révélation
  choice: 'Conserver explicitement la comparaison: « plus de sagesse que tous les vivants »'
  alternative: Formuler seulement un refus général de sagesse personnelle, sans comparaison explicite
  rationale: מִן כָּל חַיַּיָּא exprime une comparaison réelle. La conserver montre que Daniel n’attribue pas la révélation à une sagesse qui le placerait au-dessus des autres vivants.
- issue: Le langage anthropologique du cœur
  choice: « les pensées de ton cœur »
  alternative: « les pensées de ton esprit »
  rationale: Le « cœur » biblique englobe la pensée, la volonté et la vie intérieure. Le maintenir respecte l’image de la source sans lui imposer une catégorie psychologique moderne plus étroite.
- issue: Agent de la révélation non nommé dans ce verset
  choice: Maintenir le passif « m’a été révélé »
  alternative: Expliciter « Dieu m’a révélé »
  rationale: Le contexte attribue la révélation à Dieu, mais le verset emploie un passif et ne nomme pas ici l’agent. Le français conserve cette formulation sans ajouter à l’énoncé.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure araméenne tout en étant naturelle. « Tous les vivants » conserve l’expression large du texte source; « portée à la connaissance » rend idiomatiquement la construction impersonnelle. Aucun marqueur de note n’est nécessaire.
