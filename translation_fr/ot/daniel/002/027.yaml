id: DAN.2.27
reference: Daniel 2:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
translation:
  language: fr
  text: 'Daniel répondit devant le roi : « Le mystère[a] sur lequel le roi s’interroge, ni les sages, ni les enchanteurs[b], ni les magiciens, ni les devins ne sont capables de le faire connaître au roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secret ». Le terme araméen est rendu ici par « mystère » afin de préserver le thème, répété dans ce chapitre, d’une réalité cachée que Dieu seul dévoile.
    reason: lexical_alternative
  - marker: b
    text: « Enchanteurs » traduit un terme technique désignant une catégorie de spécialistes babyloniens; « astrologues » est une traduction traditionnelle possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה
  choice: répondit
  rationale: Verbe narratif araméen courant introduisant une réponse; le passé simple convient au récit soutenu.
- source_word: קֳדָם
  choice: devant
  rationale: Préserve le sens spatial et relationnel de « devant, en présence de » ainsi que le cadre de cour.
- source_word: רָזָה
  choice: mystère
  rationale: Désigne dans ce chapitre une réalité cachée que Dieu seul peut dévoiler; « mystère » maintient ce fil thématique, sans exclure le sens de « secret ».
- source_word: שָׁאֵל
  choice: sur lequel le roi s’interroge
  rationale: Rend naturellement en français la demande dont le mystère est l’objet, sans imposer un aspect temporel absent du contexte immédiat.
- source_word: חַכִּימִין
  choice: sages
  rationale: Terme collectif courant pour les conseillers savants de la cour.
- source_word: אָשְׁפִין
  choice: enchanteurs
  rationale: Rendu prudent d’un terme technique incertain désignant une catégorie de spécialistes babyloniens des pratiques occultes; il la distingue des autres groupes de la liste.
- source_word: חַרְטֻמִּין
  choice: magiciens
  rationale: Équivalent français clair et établi pour cette classe de spécialistes occultes.
- source_word: גָּזְרִין
  choice: devins
  rationale: Exprime la fonction de praticiens censés déterminer ou prononcer des réalités cachées, dans un français actuel.
- source_word: יָכְלִין
  choice: ne sont capables
  rationale: Exprime explicitement l’incapacité, avec un registre digne adapté au discours devant le roi.
- source_word: לְהַחֲוָיָה
  choice: de le faire connaître
  rationale: Rend la valeur causative de divulguer ou révéler; le pronom reprend clairement « le mystère ».
- source_word: לְמַלְכָּא
  choice: au roi
  rationale: Marque simplement le destinataire de la révélation et se distingue du premier « devant le roi ».
