  variant: modern international French
source:
  edition: WLC
  text: חָזֵ֣ה הֲוַ֗יְתָ עַ֠ד דִּ֣י הִתְגְּזֶ֤רֶת אֶ֨בֶן֙ דִּי לָ֣א בִ/ידַ֔יִן וּ/מְחָ֤ת לְ/צַלְמָ/א֙ עַל רַגְל֔וֹ/הִי דִּ֥י פַרְזְלָ֖/א וְ/חַסְפָּ֑/א וְ/הַדֵּ֖קֶת הִמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/034.yaml
  text: You were watching until a stone was cut out[a], not by hands[b], and it struck the statue on its feet of iron and clay and crushed them.
translation:
  language: fr
  text: Tu regardais jusqu’au moment où une pierre fut taillée sans l’intervention de mains[a]. Elle frappa la statue[b] aux pieds de fer et d’argile, et les pulvérisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « non par des mains ». L’expression indique que la pierre n’a pas été taillée par une intervention humaine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’image ». Le mot araméen peut désigner une image ou une statue ; ici, il s’agit de la grande figure vue dans le rêve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוַיְתָ
  choice: Tu regardais
  rationale: La construction associant le participe à הוה exprime une action continue dans le passé. « Tu regardais » en rend naturellement la durée.
- source_word: עַד דִּי
  choice: jusqu’au moment où
  rationale: Cette locution marque le terme jusqu’auquel l’observation se poursuit. La formulation explicite est naturelle en français et prépare clairement l’événement suivant.
- source_word: הִתְגְּזֶרֶת אֶבֶן
  choice: une pierre fut détachée
  rationale: La forme verbale présente la pierre comme subissant l’action. « Fut détachée » conserve le passif et convient au mouvement d’une pierre extraite d’un ensemble.
- source_word: דִּי לָא בִידַיִן
  choice: sans l’intervention de mains humaines
  rationale: L’expression araméenne signifie littéralement « non par des mains » et exclut ici l’action humaine. Cette formulation en communique clairement le sens tout en préservant l’idée d’une autre forme d’intervention.
- source_word: וּמְחָת
  choice: Elle frappa
  rationale: Le verbe féminin singulier reprend « la pierre ». « Frapper » exprime avec dignité et précision la violence du choc.
- source_word: לְצַלְמָא
  choice: la statue
  rationale: צְלֵם peut désigner une image ou une statue. Dans ce rêve, « statue » rend concrètement la grande figure matérielle décrite.
- source_word: עַל רַגְלוֹהִי דִּי פַרְזְלָא וְחַסְפָּא
  choice: aux pieds, qui étaient de fer et d’argile
  rationale: Cette formulation française conserve « pieds », rattache clairement les deux matières à ceux-ci et évite l’ambiguïté d’un groupe nominal trop compact.
- source_word: וְהַדֵּקֶת הִמּוֹן
  choice: et les pulvérisa
  rationale: Le verbe évoque l’action de broyer ou de réduire en morceaux. « Pulvérisa » en conserve la force, tandis que le pronom pluriel renvoie aux pieds.
theological_decisions:
- issue: Expression indiquant une action non humaine
  choice: sans l’intervention de mains humaines
  alternative: non par des mains
  rationale: Le texte exclut l’action humaine sans nommer explicitement l’agent qui détache la pierre. La traduction conserve cette réserve et n’ajoute aucune identification théologique.
- issue: Référent de צְלֵם
  choice: statue
  alternative: image
  rationale: « Statue » convient à la figure matérielle du rêve, tandis que la note préserve la portée lexicale plus large d’« image ».
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe de Daniel au roi dans ce récit. La syntaxe explicite le rattachement du fer et de l’argile aux pieds sans résoudre l’identité symbolique de la pierre ni celle de la statue.
