  text: וּ/בָתְרָ֗/ךְ תְּק֛וּם מַלְכ֥וּ אָחֳרִ֖י ארע/א מִנָּ֑/ךְ וּ/מַלְכ֨וּ תליתיא אָחֳרִי֙ דִּ֣י נְחָשָׁ֔/א דִּ֥י תִשְׁלַ֖ט בְּ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/039.yaml
  text: And after you another kingdom[a], inferior to yours, will arise; and yet a third kingdom, of bronze[b], which will rule over all the earth.
translation:
  language: fr
  text: Après toi surgira un autre royaume, inférieur au tien[a] ; puis un troisième royaume, de bronze, dominera toute la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus bas que toi ». L’expression araméenne est difficile ; elle semble indiquer que le royaume suivant sera inférieur à celui de Nabuchodonosor par le rang ou la splendeur.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout le pays ». Le terme araméen peut désigner soit la terre, soit un pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתְרָךְ
  choice: Après toi
  rationale: La locution marque la succession temporelle après Nabuchodonosor ; cette formulation est naturelle et précise en français.
- source_word: תְּקוּם
  choice: surgira
  rationale: Le verbe signifie littéralement « se lever » et, appliqué à un royaume, exprime naturellement son apparition ou son accession au pouvoir.
- source_word: מַלְכוּ אָחֳרִי
  choice: un autre royaume
  rationale: Le nom désigne ici un royaume ou empire politique, et l’adjectif indique qu’il succède au premier tout en étant distinct de lui.
- source_word: ארעא מִנָּךְ
  choice: inférieur au tien
  rationale: L’expression araméenne est difficile. Le contexte des métaux successifs favorise une comparaison de rang ou de splendeur ; « au tien » explicite que la comparaison porte sur le royaume de Nabuchodonosor.
- source_word: וּמַלְכוּ תליתיא
  choice: puis un troisième royaume
  rationale: La conjonction poursuit la séquence ; « puis » rend clairement la progression sans ajouter d’interprétation historique.
- source_word: דִּי נְחָשָׁא
  choice: de bronze
  rationale: La construction identifie le troisième royaume au bronze de la statue ; la formulation est concise et idiomatique.
- source_word: דִּי תִשְׁלַט
  choice: dominera
  rationale: Le verbe exprime l’exercice de la domination. « Dominera » conserve cette force politique plus directement que le simple « régnera ».
- source_word: בְּכָל אַרְעָא
  choice: sur toute la terre
  rationale: אַרְעָא peut désigner la terre entière ou un pays. La portée impériale et généralisante du contexte favorise « toute la terre », tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Sens comparatif de ארעא מִנָּךְ
  choice: inférieur au tien
  alternative: plus bas que toi ; tourné vers la terre par rapport à toi
  rationale: La syntaxe est inhabituelle et ne doit pas être présentée comme parfaitement certaine. Le contexte immédiat de la statue et de la valeur décroissante des métaux soutient néanmoins l’idée d’infériorité, sans identifier les royaumes à des puissances historiques précises.
- issue: Portée de בְּכָל אַרְעָא
  choice: sur toute la terre
  alternative: sur tout le pays
  rationale: Le langage de domination impériale favorise une portée universalisante, mais le champ sémantique du terme araméen permet aussi le sens plus limité de « pays », conservé en note.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve la progression de la vision et ses images politiques, tandis que les deux ambiguïtés lexicales importantes sont signalées en notes.
