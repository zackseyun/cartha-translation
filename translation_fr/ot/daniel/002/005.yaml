source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר ל/כשדי/א מִלְּתָ֖/א מִנִּ֣/י אַזְדָּ֑א הֵ֣ן לָ֤א תְהֽוֹדְעוּנַּ֨/נִי֙ חֶלְמָ֣/א וּ/פִשְׁרֵ֔/הּ הַדָּמִין֙ תִּתְעַבְד֔וּן וּ/בָתֵּי/כ֖וֹן נְוָלִ֥י יִתְּשָׂמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/005.yaml
  text: 'The king answered and said to the Chaldeans[a], “The word from me is firm: if you do not make known to me the dream and its interpretation, you will be made into limbs[b], and your houses will be made a refuse heap.”'
translation:
  language: fr
  text: 'Le roi répondit aux Chaldéens : « Ma parole est irrévocable[a] : si vous ne me faites pas connaître le rêve et son interprétation, vous serez mis en pièces[b], et vos maisons seront réduites en tas d’ordures. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La parole est sortie de moi. »'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « vous serez réduits en membres », c’est-à-dire démembrés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: le roi
  rationale: Équivalent français courant et naturel du titre royal, adapté au registre narratif.
- source_word: לכשדיא
  choice: aux Chaldéens
  rationale: Le terme araméen désigne les Chaldéens; le nom est conservé plutôt que remplacé par une interprétation fonctionnelle comme « astrologues ».
- source_word: מִלְּתָא מִנִּי אַזְדָּא
  choice: Ma parole est irrévocable
  rationale: Cette formulation française naturelle exprime une décision royale arrêtée, tout en signalant en note l’autre analyse possible de אַזְדָּא.
- source_word: תְהוֹדְעוּנַּנִי
  choice: vous ne me faites pas connaître
  rationale: Le causatif de ידע est rendu avec précision par « faire connaître », dans une langue soutenue mais actuelle.
- source_word: חֶלְמָא וּפִשְׁרֵהּ
  choice: le rêve et son interprétation
  rationale: « Interprétation » conserve le sens technique régulièrement porté par פשר dans Daniel.
- source_word: הַדָּמִין תִּתְעַבְדוּן
  choice: vous serez mis en pièces
  rationale: L’expression communique naturellement en français la menace de démembrement. La note conserve le sens nominal plus littéral de « membres ».
- source_word: וּבָתֵּיכוֹן נְוָלִי יִתְּשָׂמוּן
  choice: vos maisons seront réduites en tas d’ordures
  rationale: « Tas d’ordures » rend l’image de déshonneur et de dévastation sans recourir au terme vieilli « fumier »; « réduites en » exprime idiomatiquement le résultat.
theological_decisions:
- issue: Sens de מִנִּי אַזְדָּא
  choice: La parole du roi est irrévocable.
  alternative: La parole est sortie de ma bouche.
  rationale: Le contexte immédiat favorise l’idée d’une décision arrêtée, mais l’analyse lexicale traditionnelle selon laquelle la parole « est sortie » demeure possible et est conservée en note.
- issue: Image du châtiment exprimée par הַדָּמִין
  choice: vous serez mis en pièces
  alternative: vous serez réduits en membres / démembrés
  rationale: Le texte menace d’un démembrement violent. « Mis en pièces » est l’équivalent français naturel, tandis que la note rend explicite l’image corporelle littérale du terme araméen.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La tournure redondante « répondit et dit » a été condensée en « répondit ». Les formulations idiomatiques du texte principal préservent la violence et la fermeté de l’araméen, tandis que les notes rendent visibles ses ambiguïtés lexicales.
