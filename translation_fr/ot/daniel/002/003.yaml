translation_notes:
  register: Français international moderne, naturel et digne. La traduction privilégie une formulation idiomatique dans le discours direct, tout en conservant « mon esprit » et la répétition de « rêve ». Les notes préservent l’emphase de la construction hébraïque ainsi que l’ambiguïté de la relation exprimée par לָדַעַת.
