  yaml_path: translation/ot/daniel/002/003.yaml
  text: And the king said to them[a], “I have dreamed a dream[c][b], and my spirit is troubled to know the dream.”
translation:
  language: fr
  text: 'Et le roi leur dit : « J’ai fait un rêve[a], et mon esprit est troublé : je veux connaître ce rêve[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « J’ai rêvé un rêve. » L’hébreu associe le nom et le verbe de même racine — « un rêve, j’ai rêvé » — ce qui produit un effet d’insistance.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « mon esprit a été troublé » ou « mon esprit est agité ». Le mot « esprit » peut désigner ici le moi intérieur ou, plus idiomatiquement, la pensée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et … dit
  rationale: Le wayyiqtol narratif de אמר poursuit le récit. « Et … dit » conserve l’enchaînement hébreu sans imposer une nuance temporelle plus précise.
- source_word: לָהֶם
  choice: leur
  rationale: Rend directement la préposition avec suffixe pronominal et désigne les interlocuteurs du roi.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction ordinaire du nom défini, qui renvoie en contexte à Nabuchodonosor.
- source_word: חֲלוֹם חָלָמְתִּי
  choice: J’ai fait un rêve
  rationale: Expression française naturelle pour l’hébreu emphatique « un rêve, j’ai rêvé ». La note signale la construction apparentée et sa formulation plus littérale.
- source_word: וַתִּפָּעֶם
  choice: est troublé
  rationale: Le verbe exprime une vive agitation intérieure. Le présent convient à l’état que le roi décrit au moment où il parle, tout en laissant en note la possibilité d’un rendu au passé.
- source_word: רוּחִי
  choice: mon esprit
  rationale: Conserve le terme anthropologique רוּחַ et son sens de moi intérieur, sans le réduire à la seule faculté intellectuelle.
- source_word: לָדַעַת
  choice: car je veux connaître
  rationale: L’infinitif avec ל exprime ici ce vers quoi tend l’agitation du roi. Cette formulation rend clairement en français son désir de connaître le rêve, sans préciser s’il s’agit de son contenu ou de sa signification.
- source_word: אֶת־הַחֲלוֹם
  choice: ce rêve
  rationale: Rend l’objet direct défini et reprend explicitement « rêve », comme l’hébreu, plutôt que de le remplacer par un pronom.
