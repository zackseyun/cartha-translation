  text: אֱדַ֨יִן מַלְכָּ֜/א לְ/דָנִיֵּ֣אל רַבִּ֗י וּ/מַתְּנָ֨ן רַבְרְבָ֤ן שַׂגִּיאָן֙ יְהַב לֵ֔/הּ וְ/הַ֨שְׁלְטֵ֔/הּ עַ֖ל כָּל מְדִינַ֣ת בָּבֶ֑ל וְ/רַב סִגְנִ֔ין עַ֖ל כָּל חַכִּימֵ֥י בָבֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/048.yaml
  text: Then the king made Daniel great and gave him many great gifts[b][a], and he made him ruler over the whole province of Babylon and chief prefect over all the wise men of Babylon.
translation:
  language: fr
  text: Alors le roi éleva Daniel et lui donna de nombreux et importants présents. Il l’établit gouverneur de toute la province de Babylone et préfet en chef de tous les sages de Babylone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le titre araméen traduit par « préfet en chef » désigne un haut fonctionnaire placé à la tête d’autres responsables de la cour ou de l’administration.
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe temporel et séquentiel qui assure naturellement la progression du récit.
- source_word: רַבִּי
  choice: éleva Daniel
  rationale: La forme verbale signifie littéralement « rendre grand »; dans le cadre de la cour, elle désigne l’élévation de Daniel à un rang supérieur. « Éleva » conserve cette image sans être artificiel.
- source_word: וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן יְהַב לֵהּ
  choice: lui donna de nombreux présents de grande valeur
  rationale: מַתְּנָן désigne des présents, tandis que רַבְרְבָן et שַׂגִּיאָן en soulignent à la fois l’abondance et l’importance. Cette formulation française exprime les deux aspects sans lourdeur.
- source_word: וְהַשְׁלְטֵהּ
  choice: Il l’établit gouverneur
  rationale: Le causatif de שלט signifie faire exercer l’autorité. « Établir gouverneur » rend clairement la fonction conférée dans ce contexte administratif.
- source_word: עַל כָּל מְדִינַת בָּבֶל
  choice: de toute la province de Babylone
  rationale: מְדִינָה désigne ici une province impériale; כָּל devant le singulier construit porte sur la totalité de cette province.
- source_word: וְרַב סִגְנִין
  choice: et préfet en chef
  rationale: רַב signifie « chef » et סִגְנִין renvoie à des hauts fonctionnaires ou préfets. Le titre administratif demeure toutefois difficile à cerner précisément, ce que signale la note.
- source_word: עַל כָּל חַכִּימֵי בָבֶל
  choice: de tous les sages de Babylone
  rationale: « Sages » est le terme français courant pour les spécialistes et conseillers de la cour désignés dans Daniel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Éleva » évite le littéralisme peu naturel « rendit grand », tandis que « présents de grande valeur » restitue l’intensification araméenne. La répétition du sujet « Il » clarifie la longue coordination sans modifier son sens.
