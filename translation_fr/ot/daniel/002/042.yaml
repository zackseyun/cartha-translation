id: DAN.2.42
reference: Daniel 2:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶצְבְּעָת֙ רַגְלַיָּ֔/א מנ/הון פַּרְזֶ֖ל ו/מנ/הון חֲסַ֑ף מִן קְצָ֤ת מַלְכוּתָ/א֙ תֶּהֱוֵ֣ה תַקִּיפָ֔ה וּ/מִנַּ֖/הּ תֶּהֱוֵ֥ה תְבִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/042.yaml
  text: And as the toes of the feet were partly iron and partly clay[a], so part of the kingdom will be strong[b], and part of it will be brittle.
translation:
  language: fr
  text: Quant aux orteils des pieds, ils étaient en partie de fer et en partie d’argile[a] ; de même, une partie du royaume sera forte, et une partie sera fragile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terre cuite » ou « poterie » pour le terme araméen traduit par « argile ».
    reason: lexical_alternative
  - marker: b
    text: Ou « cassante » ou « susceptible de se briser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְבְּעָת רַגְלַיָּא
  choice: les orteils des pieds
  rationale: La tournure conserve l’expression construite araméenne et maintient le lien explicite avec les pieds de la statue, malgré la légère redondance naturelle en français.
- source_word: מנ/הון ... ו/מנ/הון
  choice: en partie… et en partie
  rationale: La répétition signifie littéralement « parmi eux… et parmi eux » et décrit idiomatiquement la composition mixte des orteils.
- source_word: פַּרְזֶל
  choice: fer
  rationale: Équivalent français direct du métal dans l’image de la statue.
- source_word: חֲסַף
  choice: argile
  rationale: Le terme désigne ici une matière argileuse ou céramique opposée au fer. « Argile » s’intègre naturellement à l’image, tandis que les autres nuances sont signalées en note.
- source_word: מִן קְצָת מַלְכוּתָא
  choice: une partie du royaume
  rationale: Cette formulation garde le sens partitif de l’araméen et rend clairement la répartition des qualités au sein du royaume.
- source_word: תֶּהֱוֵה
  choice: sera
  rationale: Le futur français exprime simplement l’état annoncé du royaume.
- source_word: תַקִּיפָה
  choice: forte
  rationale: Équivalent direct qui convient au contraste symbolique entre le fer et l’argile.
- source_word: וּמִנַּהּ
  choice: et une partie
  rationale: Le suffixe féminin renvoie au royaume. La répétition de « une partie » explicite le contraste distributif en français.
- source_word: תְבִירָה
  choice: fragile
  rationale: Dans ce contexte, le mot évoque ce qui peut se briser plutôt qu’un état déjà brisé. « Fragile » est naturel en français et préserve cette nuance.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image et le parallélisme de l’araméen sans chercher à identifier historiquement ou théologiquement le royaume.
