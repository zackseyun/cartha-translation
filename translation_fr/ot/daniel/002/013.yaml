  text: וְ/דָתָ֣/א נֶפְקַ֔ת וְ/חַכִּֽימַיָּ֖/א מִֽתְקַטְּלִ֑ין וּ/בְע֛וֹ דָּנִיֵּ֥אל וְ/חַבְר֖וֹ/הִי לְ/הִתְקְטָלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/013.yaml
  text: So the decree went out[a], and the wise men were being killed[b]; and they sought Daniel and his companions to kill them.
translation:
  language: fr
  text: Le décret fut donc publié[a], et l’on mettait à mort les sages[b] ; on rechercha Daniel et ses compagnons afin qu’ils soient mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sortit ». Il s’agit de la promulgation du décret royal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « étaient tués ». La forme araméenne présente les exécutions comme étant en cours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָתָא
  choice: décret
  rationale: Ce terme araméen désigne ici une décision officielle du roi ; « décret » convient naturellement au contexte de la cour.
- source_word: נֶפְקַת
  choice: fut publié
  rationale: Littéralement, le décret « sortit ». En français, « fut publié » exprime clairement sa promulgation officielle, tandis que la note conserve l’image de l’original.
- source_word: חַכִּימַיָּא
  choice: les sages
  rationale: Il s’agit de la désignation collective des conseillers savants de la cour. « Les sages » est précis, naturel et traditionnel en français.
- source_word: מִתְקַטְּלִין
  choice: l’on mettait à mort
  rationale: Le participe araméen présente les exécutions comme un processus en cours, et non simplement comme un fait achevé.
- source_word: וּבְעוֹ
  choice: on rechercha
  rationale: Dans ce contexte, le verbe indique une recherche officielle visant Daniel et ses compagnons. Le sujet indéfini français évite d’identifier des agents que l’araméen ne nomme pas.
- source_word: חַבְרוֹהִי
  choice: ses compagnons
  rationale: Le terme désigne les hommes associés à Daniel ; « compagnons » garde cette portée sans imposer une nuance trop familière.
- source_word: לְהִתְקְטָלָה
  choice: pour les tuer
  rationale: L’infinitif exprime le but de la recherche. Le pronom pluriel rend explicite que Daniel et ses compagnons étaient tous visés.
