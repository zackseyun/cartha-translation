  variant: modern international French
source:
  edition: WLC
  text: וּֽ/בְ/יוֹמֵי/ה֞וֹן דִּ֧י מַלְכַיָּ֣/א אִנּ֗וּן יְקִים֩ אֱלָ֨הּ שְׁמַיָּ֤/א מַלְכוּ֙ דִּ֤י לְ/עָלְמִין֙ לָ֣א תִתְחַבַּ֔ל וּ/מַ֨לְכוּתָ֔/ה לְ/עַ֥ם אָחֳרָ֖ן לָ֣א תִשְׁתְּבִ֑ק תַּדִּ֤ק וְ/תָסֵיף֙ כָּל אִלֵּ֣ין מַלְכְוָתָ֔/א וְ/הִ֖יא תְּק֥וּם לְ/עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/044.yaml
  text: And in the days of those kings[a], the God of heaven will set up a kingdom that will never be destroyed, and the kingdom will not be left to another people. It will crush and put an end to all these kingdoms[b], and it will stand forever.
translation:
  language: fr
  text: Au temps de ces rois[a], le Dieu du ciel établira un royaume qui ne sera jamais détruit. Ce royaume ne sera pas laissé à un autre peuple. Il écrasera[b] tous ces royaumes et y mettra fin, et il subsistera pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ces rois » renvoie aux rois ou aux royaumes représentés dans le rêve de Nabuchodonosor ; l’identification historique précise demeure discutée.
    reason: alternative_reading
  - marker: b
    text: Ou « mettra en pièces » ; le verbe araméen évoque l’action de broyer ou de briser.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹמֵיהוֹן דִּי מַלְכַיָּא אִנּוּן
  choice: Au temps de ces rois
  rationale: La tournure rend naturellement l’expression temporelle et la référence anaphorique aux rois déjà représentés dans le rêve, sans préciser leur identification historique.
- source_word: יְקִים
  choice: établira
  rationale: Le verbe signifie mettre en place ou faire subsister; « établira » convient naturellement à la fondation d’un royaume.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: le Dieu du ciel
  rationale: Cette expression conserve le titre araméen biblique dans une formulation française courante et digne.
- source_word: מַלְכוּ דִּי לְעָלְמִין לָא תִתְחַבַּל
  choice: un royaume qui ne sera jamais détruit
  rationale: Le négatif associé à l’expression de durée indique une indestructibilité permanente; « jamais » en exprime clairement la force.
- source_word: וּמַלְכוּתָהּ לְעַם אָחֳרָן לָא תִשְׁתְּבִק
  choice: Ce royaume ne sera pas laissé à un autre peuple
  rationale: La reprise par « ce royaume » restitue clairement le suffixe anaphorique et le passif exprime qu’il ne passera pas aux mains d’un autre peuple.
- source_word: תַּדִּק
  choice: Il écrasera
  rationale: La forme causative de דק évoque l’action de broyer ou de mettre en pièces; « écrasera » garde la vigueur de l’image de la pierre.
- source_word: וְתָסֵיף
  choice: et y mettra fin
  rationale: Le verbe causatif signifie amener à leur terme; cette formulation le distingue du verbe précédent sans en atténuer la portée.
- source_word: כָּל אִלֵּין מַלְכְוָתָא
  choice: tous ces royaumes
  rationale: Le démonstratif renvoie aux royaumes présentés dans le rêve; « ces » maintient cette référence immédiate.
- source_word: וְהִיא תְּקוּם לְעָלְמַיָּא
  choice: mais lui-même subsistera pour toujours
  rationale: קום exprime ici la permanence. « Subsistera » est naturel en français, tandis que « lui-même » souligne le contraste avec les royaumes supprimés.
theological_decisions:
- issue: Nature du royaume final
  choice: Présenter son origine divine, son indestructibilité et sa victoire sans lui attribuer explicitement une identification doctrinale ultérieure.
  alternative: L’identifier directement dans le texte principal au royaume messianique du Christ, ou le réduire à une domination divine générique.
  rationale: Le verset affirme explicitement que Dieu établit ce royaume éternel, mais il ne formule pas lui-même une identification messianique détaillée; la traduction conserve donc la portée du texte sans ajout confessionnel.
- issue: Référent de « ces rois »
  choice: Conserver la référence anaphorique sans déterminer précisément quels souverains ou quelle phase historique sont visés.
  alternative: Préciser qu’il s’agit des quatre royaumes collectivement ou des dirigeants de la phase divisée du dernier royaume.
  rationale: Le contexte relie ces rois aux figures du rêve, mais l’étendue historique exacte demeure discutée; la formulation française préserve cette ambiguïté.
- issue: Rapport entre le royaume et « un autre peuple »
  choice: Dire que le royaume ne sera pas laissé à un autre peuple.
  alternative: Dire que sa souveraineté ne sera pas transmise à un autre peuple.
  rationale: Le suffixe araméen reprend le royaume mentionné. La formulation retenue reste proche du texte tout en évitant de préciser si l’accent porte sur la possession, l’administration ou la succession politique.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases sont légèrement segmentées pour la lisibilité. « Ce royaume » évite l’ambiguïté peu naturelle de « son royaume », et « mais lui-même » rend explicitement le contraste final déjà porté par la syntaxe araméenne.
