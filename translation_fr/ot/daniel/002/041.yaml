id: DAN.2.41
reference: Daniel 2:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דִֽי חֲזַ֜יְתָה רַגְלַיָּ֣/א וְ/אֶצְבְּעָתָ֗/א מנ/הון חֲסַ֤ף דִּֽי פֶחָר֙ ו/מנ/הון פַּרְזֶ֔ל מַלְכ֤וּ פְלִיגָה֙ תֶּהֱוֵ֔ה וּ/מִן נִצְבְּתָ֥/א דִ֥י פַרְזְלָ֖/א לֶֽהֱוֵא בַ֑/הּ כָּ/ל קֳבֵל֙ דִּ֣י חֲזַ֔יְתָה פַּ֨רְזְלָ֔/א מְעָרַ֖ב בַּ/חֲסַ֥ף טִינָֽ/א־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/041.yaml
  text: And as you saw the feet and toes[a], partly of potter’s clay and partly of iron, the kingdom will be divided; yet some of the firmness of iron will be in it[b], just as you saw the iron mixed with clay mud.
translation:
  language: fr
  text: Et comme tu as vu les pieds et les orteils, en partie en argile de potier et en partie en fer, le royaume sera divisé. Toutefois, il aura en lui quelque chose de la solidité du fer[a], comme tu as vu le fer mêlé à de l’argile boueuse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelque chose de la force du fer ». Le terme araméen peut désigner la solidité, la force ou la stabilité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’expression associe les mots « argile » et « boue » et souligne ainsi la nature instable du mélange.
    reason: lexical_clarification
lexical_decisions:
- source_word: רַגְלַיָּא וְאֶצְבְּעָתָא
  choice: les pieds et les orteils
  rationale: Dans le contexte de la statue et avec la mention des orteils, רַגְלַיָּא désigne les pieds plutôt que les jambes.
- source_word: מנ/הון ... ו/מנ/הון
  choice: en partie ... et en partie
  rationale: Cette tournure rend naturellement l’idiome araméen « de ceux-ci… et de ceux-ci » décrivant la composition des pieds et des orteils.
- source_word: חֲסַף דִּי פֶחָר
  choice: argile de potier
  rationale: La formulation conserve à la fois le matériau, חֲסַף, et la référence au potier, פֶחָר, dans un français idiomatique.
- source_word: פַּרְזֶל
  choice: fer
  rationale: Équivalent français direct et usuel du métal représenté dans la vision.
- source_word: מַלְכוּ פְלִיגָה
  choice: le royaume sera divisé
  rationale: Le royaume est défini par le contexte, et פְלִיגָה exprime son état partagé ou divisé.
- source_word: וּמִן נִצְבְּתָא דִי פַרְזְלָא לֶהֱוֵא בַהּ
  choice: il aura en lui quelque chose de la solidité du fer
  rationale: La formulation rend la valeur partitive de וּמִן et conserve l’image concrète de la fermeté ou solidité propre au fer.
- source_word: כָּל־קֳבֵל דִּי
  choice: puisque
  rationale: 'La locution peut exprimer ici le fondement de l’interprétation : le royaume gardera de la solidité puisque le fer apparaissait dans le mélange. La valeur comparative « comme » reste également possible.'
- source_word: מְעָרַב בַּחֲסַף טִינָא
  choice: mêlé à de l’argile boueuse
  rationale: « Mêlé » rend le participe, tandis qu’« argile boueuse » représente naturellement en français les deux termes matériels חֲסַף et טִינָא sans réduire l’expression au seul mot « argile ».
theological_decisions:
- issue: Rapport logique exprimé par כָּל־קֳבֵל דִּי
  choice: puisque
  alternative: tout comme
  rationale: Le contexte permet une nuance causale ou explicative aussi bien qu’une correspondance comparative. Le texte principal retient la lecture causale naturelle en français, sans en tirer d’interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement est maintenu comme adresse singulière à Daniel. La syntaxe reste proche de l’explication araméenne tout en évitant un calque artificiel.
