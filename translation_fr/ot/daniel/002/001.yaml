source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת שְׁתַּ֗יִם לְ/מַלְכוּת֙ נְבֻֽכַדְנֶצַּ֔ר חָלַ֥ם נְבֻֽכַדְנֶצַּ֖ר חֲלֹמ֑וֹת וַ/תִּתְפָּ֣עֶם רוּח֔/וֹ וּ/שְׁנָת֖/וֹ נִהְיְתָ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/001.yaml
  text: In the second year of Nebuchadnezzar’s reign[a], Nebuchadnezzar dreamed dreams, and his spirit was troubled[c][b], and his sleep left him.
translation:
  language: fr
  text: La deuxième année du règne de Nebucadnetsar, celui-ci fit des rêves[a]. Son esprit fut bouleversé[b], et le sommeil le quitta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rêva des rêves ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Son esprit fut agité. »'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression hébraïque est inhabituelle; littéralement : « son sommeil fut sur lui ». Elle est traditionnellement comprise comme indiquant que le sommeil l’avait quitté.'
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁתַּיִם
  choice: La deuxième année
  rationale: Le waw d’ouverture assure la continuité narrative, mais n’exige pas un « et » en français. La tournure temporelle sans préposition est naturelle et fidèle.
- source_word: לְמַלְכוּת
  choice: du règne de
  rationale: Dans ce repère chronologique, מַלְכוּת désigne la période où le roi exerce le pouvoir, plutôt que son royaume comme territoire.
- source_word: נְבֻכַדְנֶצַּר
  choice: Nebucadnetsar
  rationale: Cette forme française moderne reste proche de la forme hébraïque et est bien attestée dans les traductions bibliques contemporaines.
- source_word: חָלַם ... חֲלֹמוֹת
  choice: fit des rêves
  rationale: Cette formulation française naturelle conserve le pluriel hébreu. Une note signale la construction intensive ou expressive formée du verbe et de son nom apparenté.
- source_word: וַתִּתְפָּעֶם רוּחוֹ
  choice: Son esprit fut bouleversé
  rationale: « Esprit » préserve רוּחַ sans le réduire à l’intellect; « fut bouleversé » exprime une profonde agitation intérieure dans un français courant et digne.
- source_word: וּשְׁנָתוֹ נִהְיְתָה עָלָיו
  choice: le sommeil le quitta
  rationale: L’expression hébraïque est inhabituelle. Le contexte et l’ancienne compréhension de l’idiome soutiennent l’idée que le roi ne pouvait plus dormir; cette formulation évite un calque obscur.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et soutenu. La reprise pronominale « celui-ci » évite la répétition lourde du nom tout en gardant le même sujet clairement identifié. Les notes préservent la forme expressive de l’hébreu et l’ambiguïté de la dernière proposition.
