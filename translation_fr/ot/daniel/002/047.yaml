source:
  edition: WLC
  text: עָנֵה֩ מַלְכָּ֨/א לְ/דָנִיֵּ֜אל וְ/אָמַ֗ר מִן קְשֹׁט֙ דִּ֣י אֱלָהֲ/כ֗וֹן ה֣וּא אֱלָ֧הּ אֱלָהִ֛ין וּ/מָרֵ֥א מַלְכִ֖ין וְ/גָלֵ֣ה רָזִ֑ין דִּ֣י יְכֵ֔לְתָּ לְ/מִגְלֵ֖א רָזָ֥/ה דְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/047.yaml
  text: The king answered Daniel and said[a], “Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, because you were able to reveal this mystery.”
translation:
  language: fr
  text: 'Le roi répondit à Daniel et dit : « En vérité, votre Dieu est le Dieu des dieux, le Seigneur des rois et celui qui révèle les mystères[a], puisque tu as pu révéler ce mystère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les secrets ». Le terme araméen peut désigner, de façon générale, des choses cachées ; « mystères » conserve mieux le vocabulaire récurrent de Daniel concernant ce que Dieu révèle.
    reason: Alternative lexicale
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: répondit ... en disant
  rationale: Cette tournure rend la formule narrative araméenne avec ses deux verbes tout en restant naturelle en français moderne.
- source_word: מִן קְשֹׁט
  choice: En vérité
  rationale: L’expression affirme avec force la véracité de ce qui suit ; « En vérité » en conserve la solennité sans archaïsme excessif.
- source_word: אֱלָהֲכוֹן
  choice: votre Dieu
  rationale: Le suffixe est à la deuxième personne du pluriel et peut inclure Daniel et ses compagnons ; le pluriel français est donc conservé.
- source_word: אֱלָהּ אֱלָהִין
  choice: le Dieu des dieux
  rationale: La chaîne construite exprime la suprématie. L’article défini donne en français une formulation naturelle sans ajouter l’idée explicite que Dieu serait seul à exister.
- source_word: וּמָרֵא מַלְכִין
  choice: le Seigneur des rois
  rationale: מָרֵא signifie « seigneur » ou « maître » ; « Seigneur » convient au registre royal et théologique du passage.
- source_word: וְגָלֵה רָזִין
  choice: celui qui révèle les mystères
  rationale: Le participe décrit une action caractéristique de Dieu. Cette formulation est plus idiomatique en français que « un révélateur de mystères ».
- source_word: רָזִין / רָזָה
  choice: mystères / mystère
  rationale: Dans Daniel, le terme désigne des réalités cachées rendues accessibles par révélation divine. « Mystère » maintient ce vocabulaire thématique.
- source_word: דִּי יְכֵלְתָּ
  choice: puisque tu as pu
  rationale: La conjonction introduit le fondement de la déclaration du roi. « Puisque » exprime naturellement cette relation causale fondée sur un fait constaté.
- source_word: לְמִגְלֵא רָזָה דְנָה
  choice: révéler ce mystère
  rationale: La répétition de « révéler » conserve le lien lexical avec גלה dans la proposition précédente, et « ce mystère » renvoie au rêve précis et à son interprétation.
theological_decisions:
- issue: La déclaration de Nabuchodonosor implique-t-elle une conversion pleinement monothéiste ou seulement la reconnaissance de la suprématie du Dieu de Daniel ?
  choice: 'Conserver la confession élevée : « votre Dieu est le Dieu des dieux, le Seigneur des rois »'
  alternative: Paraphraser soit « votre Dieu seul est Dieu », soit par une formulation affaiblie qui réduirait la portée des titres
  rationale: L’araméen affirme nettement la suprématie du Dieu de Daniel, sans dire explicitement que le roi renonce à tous les autres dieux. La traduction préserve cette tension.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le passage de « votre Dieu » au pluriel à « tu as pu » au singulier est volontaire : il reproduit le changement de nombre présent dans l’araméen, où le Dieu de Daniel et de ses compagnons est évoqué avant que Daniel soit personnellement désigné.'
