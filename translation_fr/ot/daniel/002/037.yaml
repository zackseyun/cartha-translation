  source_fidelity: 'Le texte français rend fidèlement la structure araméenne : l’adresse emphatique (« Toi, ô roi »), le titre « le roi des rois », la relative indiquant que Dieu est l’auteur du don, et l’énumération des réalités accordées au roi. « La royauté, la force, la puissance et la gloire » reflète correctement מַלְכוּתָא, חִסְנָא, תָקְפָּא et וִיקָרָא, sans éliminer le léger chevauchement sémantique entre force et puissance.'
