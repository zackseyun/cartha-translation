id: DAN.2.37
reference: Daniel 2:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֔/א מֶ֖לֶךְ מַלְכַיָּ֑/א דִּ֚י אֱלָ֣הּ שְׁמַיָּ֔/א מַלְכוּתָ֥/א חִסְנָ֛/א וְ/תָקְפָּ֥/א וִֽ/יקָרָ֖/א יְהַב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/037.yaml
  text: You[a], O king, are the king of kings, to whom the God of heaven has given the kingdom, the might, the power, and the glory.
translation:
  language: fr
  text: Toi, ô roi, tu es le roi des rois, à qui le Dieu du ciel a donné la royauté, la force, la puissance et la gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’honneur » ou « la splendeur ».
    reason: Le terme araméen יְקָר peut désigner la gloire, l’honneur ou la splendeur dans un contexte de majesté royale.
lexical_decisions:
- source_word: אַ֣נְתְּה
  choice: Toi
  rationale: Le pronom personnel indépendant ouvre l’adresse avec emphase. « Toi » conserve cette mise en relief, reprise naturellement par « tu es » en français.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Le nom déterminé est employé en apostrophe. « Ô roi » rend le ton solennel et courtois de l’adresse sans ajouter de contenu.
- source_word: מֶלֶךְ מַלְכַיָּא
  choice: le roi des rois
  rationale: La chaîne construite exprime un titre royal superlatif. « Le roi des rois » en est l’équivalent français direct et traditionnel.
- source_word: דִּי
  choice: à qui
  rationale: La particule relative introduit la proposition indiquant le bénéficiaire du don divin. « À qui » conserve le lien syntaxique avec le titre précédent et avec le verbe « a donné ».
- source_word: אֱלָהּ שְׁמַיָּא
  choice: le Dieu du ciel
  rationale: Cette expression constitue un titre divin courant dans Daniel. Le singulier collectif français « du ciel » est naturel et fidèle au sens.
- source_word: מַלְכוּתָא
  choice: la royauté
  rationale: Le terme peut désigner le royaume, le règne ou l’autorité royale. Ici, « la royauté » s’accorde avec les qualités et prérogatives royales énumérées, tout en maintenant l’étendue sémantique du terme.
- source_word: חִסְנָא
  choice: la force
  rationale: Le nom désigne la force ou la puissance. « La force » le distingue en français du terme suivant sans effacer leur proximité sémantique.
- source_word: תָקְפָּא
  choice: la puissance
  rationale: Le terme évoque la vigueur, la puissance ou la capacité de domination. « La puissance » convient au contexte royal et préserve le parallélisme avec « la force ».
- source_word: וִיקָרָא
  choice: la gloire
  rationale: Le mot recouvre les idées de gloire, d’honneur et de splendeur liées à la majesté royale. « La gloire » garde le registre élevé tout en laissant les autres nuances en note.
- source_word: יְהַב לָךְ
  choice: a donné
  rationale: Le parfait araméen présente le don comme accompli. Le passé composé français exprime naturellement cet acte dont les effets demeurent, tandis que « à qui » représente le bénéficiaire.
theological_decisions:
- issue: Origine de l’autorité royale de Nabuchodonosor
  choice: La royauté, la force, la puissance et la gloire du roi sont explicitement présentées comme données par le Dieu du ciel.
  alternative: Présenter ces attributs comme inhérents au roi ou acquis uniquement par ses conquêtes.
  rationale: Le verbe « donner » attribue directement au Dieu du ciel l’origine de la grandeur royale. La traduction maintient cette affirmation sans développer une doctrine supplémentaire.
translation_notes:
  register: Français moderne, international et digne. L’apostrophe « ô roi » conserve la solennité de la scène de cour; la reprise « Toi… tu » rend l’emphase du pronom araméen de façon naturelle. La phrase unique préserve la relation syntaxique du texte source.
