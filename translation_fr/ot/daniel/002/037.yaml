  terminology: « Le Dieu du ciel » est un rendu exact et idiomatique du titre divin. « Le roi des rois » conserve le titre royal superlatif sans ajout interprétatif. « Royauté » est un choix défendable pour le domaine de la souveraineté royale dans cette énumération. La note sur « gloire » signale adéquatement les nuances possibles d’honneur et de splendeur.
