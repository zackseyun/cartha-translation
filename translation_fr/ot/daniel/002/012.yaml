source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָ֔ה מַלְכָּ֕/א בְּנַ֖ס וּ/קְצַ֣ף שַׂגִּ֑יא וַ/אֲמַר֙ לְ/ה֣וֹבָדָ֔ה לְ/כֹ֖ל חַכִּימֵ֥י בָבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/012.yaml
  text: Because of this[a], the king became furious and very enraged[b], and he commanded that all the wise men of Babylon be destroyed.
translation:
  language: fr
  text: À cause de cela[a], le roi devint furieux et entra dans une violente colère. Il ordonna[b] de faire périr tous les sages de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour cette raison » ou « C’est pourquoi ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe signifie littéralement « dit », mais il introduit ici un décret royal ; d’où « ordonna ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: À cause de cela
  rationale: Cette locution araméenne exprime explicitement la cause ou le motif. La formulation française est naturelle et conserve ce lien avec ce qui précède.
- source_word: מַלְכָּא
  choice: le roi
  rationale: La forme emphatique définie désigne simplement « le roi ».
- source_word: בְּנַס
  choice: devint furieux
  rationale: Le verbe décrit le fait de se mettre en colère. « Devint furieux » rend l’intensité et le changement d’état.
- source_word: וּקְצַף שַׂגִּיא
  choice: et entra dans une violente colère
  rationale: קְצַף exprime la colère, et שַׂגִּיא l’intensifie. La traduction maintient l’accumulation de deux expressions de colère sans devenir artificielle en français.
- source_word: וַאֲמַר
  choice: Il ordonna
  rationale: Le verbe signifie littéralement « il dit », mais il introduit ici un décret royal. « Il ordonna » en exprime clairement la valeur contextuelle.
- source_word: לְהוֹבָדָה
  choice: de faire périr
  rationale: La forme causative de אבד indique que le roi exige la mise à mort des sages. « Faire périr » conserve la portée du verbe sans la restreindre à un mode d’exécution.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: tous les sages de Babylone
  rationale: La traduction rend le quantificateur totalisant et le groupe des sages attachés à la cour babylonienne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition sémantique des deux expressions araméennes de colère est conservée, tandis que la seconde phrase évite une coordination trop lourde.
