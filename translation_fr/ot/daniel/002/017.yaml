  text: אֱדַ֥יִן דָּֽנִיֵּ֖אל לְ/בַיְתֵ֣/הּ אֲזַ֑ל וְ֠/לַ/חֲנַנְיָה מִֽישָׁאֵ֧ל וַ/עֲזַרְיָ֛ה חַבְר֖וֹ/הִי מִלְּתָ֥/א הוֹדַֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/017.yaml
  text: Then Daniel went to his house and made the matter known to Hananiah[a], Mishael, and Azariah, his companions.
translation:
  language: fr
  text: Alors Daniel se rendit chez lui et fit connaître l’affaire à Hanania, Mishaël et Azaria, ses compagnons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses amis ». Le terme araméen peut désigner des associés ou des compagnons qui lui sont étroitement liés.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Cet adverbe araméen marque la succession narrative. « Alors » rend naturellement cette progression temporelle en français.
- source_word: לְבַיְתֵהּ אֲזַל
  choice: se rendit chez lui
  rationale: L’expression signifie littéralement qu’il alla à sa maison. « Se rendit chez lui » est idiomatique, précis et convient au registre narratif.
- source_word: מִלְּתָא
  choice: l’affaire
  rationale: Dans ce contexte, le nom désigne la situation qui vient d’être exposée, notamment l’ordre du roi et la démarche de Daniel. « L’affaire » conserve cette portée générale.
- source_word: הוֹדַע
  choice: fit connaître
  rationale: La forme causative du verbe « connaître » est reflétée directement par « fit connaître », sans réduire le sens à une simple parole rapportée.
- source_word: חַבְרוֹהִי
  choice: ses compagnons
  rationale: Le terme désigne des personnes étroitement associées à Daniel. « Compagnons » préserve ce lien sans préciser plus que le texte la nature exacte de leur relation.
- source_word: חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: Hanania, Mishaël et Azaria
  rationale: Les noms sont translittérés selon leurs formes françaises modernes usuelles, avec le tréma de « Mishaël » pour guider la prononciation.
