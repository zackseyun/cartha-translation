base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/033.yaml
  text: its legs were of iron[a], its feet partly of iron and partly of clay.
translation:
  language: fr
  text: ses jambes étaient en fer, ses pieds en partie en fer et en partie en argile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terre cuite » ou « poterie » pour « argile » (araméen חֲסַף).
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקוֹהִי
  choice: ses jambes
  rationale: Le nom araméen désigne ici les jambes de la statue; « jambes » est naturel en français et maintient la distinction avec les pieds mentionnés ensuite.
- source_word: דִּי
  choice: en
  rationale: Dans la description de la matière dont sont faites les parties de la statue, le français idiomatique emploie « en fer » plutôt qu’une relative développée.
- source_word: פַרְזֶל
  choice: fer
  rationale: Équivalent français direct et usuel du terme araméen désignant le fer.
- source_word: רַגְלוֹהִי
  choice: ses pieds
  rationale: Le terme désigne les pieds et doit rester distinct de שָׁקוֹהִי, « ses jambes », afin de préserver la progression anatomique de la vision.
- source_word: מנ/הון
  choice: en partie
  rationale: L’expression signifie littéralement « d’entre eux » et répartit ici les pieds entre deux matières; « en partie » rend clairement et naturellement cette valeur distributive.
- source_word: ו/מנ/הון
  choice: et en partie
  rationale: La conjonction et l’expression distributive poursuivent la répartition des pieds entre deux matières.
- source_word: חֲסַף
  choice: argile
  rationale: Le terme peut désigner l’argile ou une matière céramique. « Argile » convient à l’image immédiate et reste l’expression la plus claire en français courant; les autres possibilités sont signalées en note.
