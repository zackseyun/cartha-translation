id: DAN.2.22
reference: Daniel 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֛וּא גָּלֵ֥א עַמִּיקָתָ֖/א וּ/מְסַתְּרָתָ֑/א יָדַע֙ מָ֣ה בַ/חֲשׁוֹכָ֔/א ו/נהיר/א עִמֵּ֥/הּ שְׁרֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/022.yaml
  text: He reveals deep and hidden things[a]; he knows what is in the darkness[b], and light dwells with him.
translation:
  language: fr
  text: C’est lui qui révèle les choses profondes et cachées[a] ; il sait ce qui est dans les ténèbres, et la lumière demeure auprès de lui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secrètes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la lumière est avec lui ». Le verbe araméen peut être rendu de manière plus statique, mais « demeure » préserve mieux l’image.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא גָּלֵא
  choice: C’est lui qui révèle
  rationale: La tournure clivée rend naturellement en français l’insistance du pronom araméen placé en tête, tandis que « révèle » exprime clairement l’action de dévoiler.
- source_word: עַמִּיקָתָא
  choice: les choses profondes
  rationale: Cette formulation conserve la métaphore de la profondeur et forme un parallélisme naturel avec « cachées ».
- source_word: וּמְסַתְּרָתָא
  choice: et cachées
  rationale: Le terme désigne ce qui est dissimulé. « Cachées » est transparent et moins interprétatif que « secrètes », qui reste possible.
- source_word: יָדַע מָה
  choice: il sait ce qui
  rationale: Cette formulation idiomatique introduit directement le contenu de la connaissance divine.
- source_word: בַחֲשׁוֹכָא
  choice: est dans les ténèbres
  rationale: « Les ténèbres » conserve l’image concrète et la forme déterminée de l’araméen, tout en étant naturel dans un registre biblique moderne.
- source_word: וּנְהִירָא
  choice: et la lumière
  rationale: « La lumière » rend le substantif en contraste direct avec « les ténèbres ».
- source_word: עִמֵּהּ שְׁרֵא
  choice: demeure auprès de lui
  rationale: « Demeure » préserve l’idée d’habitation ou de séjour portée par le verbe, et « auprès de lui » exprime une proximité personnelle avec naturel et dignité.
theological_decisions:
- issue: Personnification de la lumière dans sa relation à Dieu
  choice: la lumière demeure auprès de lui
  alternative: la lumière est avec lui
  rationale: Le verbe araméen évoque le fait de demeurer ou de séjourner plutôt qu’une simple présence statique. Cette traduction conserve l’image poétique sans lui imposer une précision doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « C’est lui qui » restitue l’emphase initiale sans lourdeur. Le parallélisme poétique entre profondeur, dissimulation, ténèbres et lumière est conservé.
