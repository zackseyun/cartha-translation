  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר לְ/דָנִיֵּ֔אל דִּ֥י שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר ה/איתי/ך כָּהֵ֗ל לְ/הוֹדָעֻתַ֛/נִי חֶלְמָ֥/א דִֽי חֲזֵ֖ית וּ/פִשְׁרֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/026.yaml
  text: The king answered and said to Daniel, whose name was Belteshazzar, “Are you able to make known to me the dream that I saw, and its interpretation?”
translation:
  language: fr
  text: 'Le roi répondit et dit à Daniel, qui s’appelait Beltshatsar : « Es-tu capable de me faire connaître le rêve que j’ai vu et son interprétation ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Le roi prit la parole et dit
  rationale: La formule araméenne signifie littéralement que le roi « répondit et dit ». En français narratif moderne, « prit la parole et dit » conserve les deux verbes sans produire la lourdeur de « répondit et dit », d’autant qu’il ne s’agit pas nécessairement ici d’une réponse directe.
- source_word: לְדָנִיֵּאל
  choice: à Daniel
  rationale: Rend directement le complément introduit par la préposition et conserve la forme française traditionnelle du nom.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: qui portait le nom de Beltshatsar
  rationale: Rend naturellement l’expression relative « dont le nom [était] » et indique le nom babylonien attribué à Daniel, sans suggérer qu’il aurait remplacé son identité.
- source_word: הֲאִיתָךְ כָּהֵל
  choice: Es-tu capable
  rationale: L’interrogation porte sur la capacité de Daniel. « Es-tu capable » est direct, naturel et conserve la nuance de pouvoir ou de compétence.
- source_word: לְהוֹדָעֻתַנִי
  choice: de me faire connaître
  rationale: Le causatif araméen signifie « faire savoir, faire connaître ». Cette formulation préserve mieux cette valeur que le simple verbe « dire ».
- source_word: חֶלְמָא דִי חֲזֵית
  choice: le rêve que j’ai vu
  rationale: Traduction formellement proche de l’araméen. En contexte biblique, « voir un rêve » demeure clair et préserve l’expression source plutôt que de la normaliser en « faire un rêve ».
- source_word: וּפִשְׁרֵהּ
  choice: et son interprétation
  rationale: Dans Daniel, פשר est le terme technique désignant l’interprétation d’un rêve ou d’un mystère. « Interprétation » est plus précis que « sens ».
