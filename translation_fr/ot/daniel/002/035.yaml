source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּ֣קוּ כַ/חֲדָ֡ה פַּרְזְלָ/א֩ חַסְפָּ֨/א נְחָשָׁ֜/א כַּסְפָּ֣/א וְ/דַהֲבָ֗/א וַ/הֲווֹ֙ כְּ/ע֣וּר מִן אִדְּרֵי קַ֔יִט וּ/נְשָׂ֤א הִמּוֹן֙ רוּחָ֔/א וְ/כָל אֲתַ֖ר לָא הִשְׁתֲּכַ֣ח לְ/ה֑וֹן וְ/אַבְנָ֣/א דִּֽי מְחָ֣ת לְ/צַלְמָ֗/א הֲוָ֛ת לְ/ט֥וּר רַ֖ב וּ/מְלָ֥ת כָּל אַרְעָֽ/א־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/035.yaml
  text: Then the iron[a], the clay, the bronze, the silver, and the gold were crushed all at once and became like chaff from the summer threshing floors, and the wind carried them away so that no place was found for them[c][b]. But the stone that struck the statue became a great mountain and filled the whole earth.
translation:
  language: fr
  text: Alors le fer, l’argile, le bronze, l’argent et l’or furent tous broyés en même temps[a] ; ils devinrent comme la balle des aires de battage en été[b]. Le vent les emporta, et il ne se trouva aucun lieu pour eux. Mais la pierre qui avait frappé la statue devint une grande montagne et remplit toute la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ensemble ». L’araméen indique que tous les matériaux furent broyés simultanément.'
    reason: lexical_alternative
  - marker: b
    text: La « balle » est l’enveloppe légère du grain, emportée lors du vannage. On pourrait aussi traduire plus généralement par « la poussière ».
    reason: lexical_alternative
  - marker: c
    text: Le mot araméen peut aussi signifier « pays » ; le contexte plus large de la vision favorise ici « terre ».
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la succession des événements dans le récit avec naturel en français moderne.
- source_word: דָּקוּ כַחֲדָה
  choice: furent tous ensemble réduits en morceaux
  rationale: Le verbe exprime une destruction par broyage ou concassage, et כַחֲדָה indique que tous les matériaux subissent simultanément le même sort.
- source_word: פַּרְזְלָא חַסְפָּא נְחָשָׁא כַּסְפָּא וְדַהֲבָא
  choice: le fer, l’argile, le bronze, l’argent et l’or
  rationale: Reproduit l’ordre des matériaux dans le texte araméen ; « bronze » convient au métal ou alliage désigné ici par נְחָשָׁא.
- source_word: וַהֲווֹ כְּעוּר
  choice: Ils devinrent comme la bale
  rationale: עוּר désigne ici les résidus légers du vannage ; « bale » conserve précisément l’image agricole.
- source_word: מִן אִדְּרֵי קַיִט
  choice: des aires de battage en été
  rationale: Rend le cadre saisonnier sec dans lequel les résidus du battage sont facilement emportés.
- source_word: וּנְשָׂא הִמּוֹן רוּחָא
  choice: le vent les emporta
  rationale: Rend directement le vent comme sujet et la disparition des matériaux comme résultat de son action.
- source_word: וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן
  choice: on ne retrouva plus aucune trace d’eux
  rationale: Formulation française idiomatique exprimant leur disparition totale, littéralement qu’aucun lieu ne fut trouvé pour eux.
- source_word: הֲוָת לְטוּר רַב
  choice: devint une grande montagne
  rationale: Restitue simplement la transformation de la pierre en montagne de grande taille.
- source_word: וּמְלָת כָּל אַרְעָא
  choice: et remplit toute la terre
  rationale: « Terre » préserve l’ampleur universelle suggérée par la vision, tout en restant une traduction directe de אַרְעָא.
theological_decisions:
- issue: Portée de אַרְעָא
  choice: toute la terre
  alternative: tout le pays
  rationale: Le cadre de la vision concerne des royaumes successifs et favorise ici une portée étendue ; « terre » conserve néanmoins la possibilité sémantique générale sans expliciter l’interprétation symbolique.
- issue: Valeur de la conjonction devant « la pierre »
  choice: Mais la pierre
  alternative: Et la pierre
  rationale: La conjonction araméenne est formellement additive, mais le contraste discursif oppose la disparition des matériaux à la croissance de la pierre. « Mais » rend clairement cette relation en français.
translation_notes:
  register: Français international moderne, clair et digne. « Bale » conserve avec précision l’image du battage et reçoit une note pour les lecteurs qui ne connaissent pas ce terme. La syntaxe reste narrative et fluide, sans ajouter d’identification doctrinale des symboles.
