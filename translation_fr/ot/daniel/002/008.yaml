id: DAN.2.8
reference: Daniel 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר מִן יַצִּיב֙ יָדַ֣ע אֲנָ֔ה דִּ֥י עִדָּנָ֖/א אַנְתּ֣וּן זָבְנִ֑ין כָּ/ל קֳבֵל֙ דִּ֣י חֲזֵית֔וֹן דִּ֥י אַזְדָּ֖א מִנִּ֥/י מִלְּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/008.yaml
  text: The king answered and said[a], “I know for certain that you are trying to gain time, because you have seen that the matter has gone from me.”
translation:
  language: fr
  text: 'Le roi répondit : « Je sais avec certitude que vous cherchez à gagner du temps, parce que vous avez vu que l’affaire m’a échappé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole est sortie de moi », « la chose m’a échappé », ou peut-être « mon ordre est irrévocable ». La formulation araméenne est concise et se prête ici à plusieurs interprétations.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן יַצִּיב
  choice: avec certitude
  rationale: Cette locution araméenne exprime une forte assurance. « Avec certitude » est naturel en français moderne et conserve l’insistance du roi.
- source_word: יָדַע אֲנָה
  choice: je sais
  rationale: Rendu direct du verbe de connaissance à la première personne, sans nuance supplémentaire indue.
- source_word: עִדָּנָא
  choice: du temps
  rationale: Le nom signifie « temps » ou « période »; la tournure verbale française porte ici l’idée de délai.
- source_word: אַנְתּוּן זָבְנִין
  choice: vous cherchez à gagner
  rationale: Le participe du verbe « acheter » forme ici l’idée idiomatique d’acheter ou gagner du temps. « Cherchez à gagner » exprime naturellement l’action calculée sans imposer en français une métaphore commerciale peu usuelle.
- source_word: כָּל־קֳבֵל דִּי
  choice: parce que
  rationale: Ce connecteur introduit le motif de l’accusation du roi; « parce que » en donne l’équivalent français le plus clair.
- source_word: חֲזֵיתוֹן
  choice: vous avez vu
  rationale: Le passé composé conserve l’action accomplie dont les conséquences restent présentes dans l’accusation.
- source_word: אַזְדָּא מִנִּי
  choice: m’a échappé
  rationale: La formule indique littéralement que quelque chose « est allé de moi ». « M’a échappé » est une expression française naturelle, tout en laissant ouverte la nature exacte de ce qui n’est plus à la disposition du roi.
- source_word: מִלְּתָא
  choice: l’affaire
  rationale: Le terme peut désigner une parole, une chose, une affaire ou un ordre. « L’affaire » demeure assez large pour ne pas trancher l’ambiguïté du contexte.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Le roi répondit
  rationale: La formule narrative emploie littéralement deux verbes, « répondit et dit ». En français actuel, « répondit » suffit à en transmettre naturellement la fonction sans lourdeur.
theological_decisions:
- issue: Ambiguïté de מִלְּתָא / אַזְדָּא מִנִּי
  choice: l’affaire m’a échappé
  alternative: « la parole est sortie de moi », « mon ordre est irrévocable » ou « la chose m’a échappé »
  rationale: L’araméen est compact et peut être compris soit comme une allusion à quelque chose que le roi ne peut plus fournir, soit comme l’affirmation que sa parole ou sa décision est arrêtée. Le texte principal reste général et une note conserve explicitement les principales possibilités sans résoudre la tension.
translation_notes:
  register: Français international moderne, clair et digne. La formule narrative est allégée selon l’usage naturel du français, tandis que la note conserve l’ambiguïté substantielle de la dernière proposition.
