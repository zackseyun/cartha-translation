source:
  edition: WLC
  text: וַֽ/יְדַבְּר֧וּ הַ/כַּשְׂדִּ֛ים לַ/מֶּ֖לֶךְ אֲרָמִ֑ית מַלְכָּ/א֙ לְ/עָלְמִ֣ין חֱיִ֔י אֱמַ֥ר חֶלְמָ֛/א ל/עבדי/ך וּ/פִשְׁרָ֥/א נְחַוֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/004.yaml
  text: 'Then the Chaldeans spoke to the king in Aramaic: “O king[a], live forever! Tell the dream to your servants[c][b], and we will declare the interpretation.”'
translation:
  language: fr
  text: 'Alors les Chaldéens parlèrent au roi en araméen[a] : « Ô roi, vis pour toujours ! Raconte le rêve à tes serviteurs, et nous en ferons connaître l’interprétation. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte araméen commence ici et se poursuit jusqu’à Daniel 7.28.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Alors ... parlèrent
  rationale: Le waw narratif fait progresser le récit. « Alors » exprime naturellement cette succession en français.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le terme désigne ici le groupe présent à la cour babylonienne. La désignation traditionnelle est conservée sans la réduire à la fonction plus interprétative d’« astrologues ».
- source_word: לַמֶּלֶךְ
  choice: au roi
  rationale: Rend directement le complément indiquant le destinataire de leurs paroles.
- source_word: אֲרָמִית
  choice: en araméen
  rationale: Cette indication précise la langue du discours et marque aussi le début de la section araméenne du livre.
- source_word: מַלְכָּא
  choice: Ô roi
  rationale: Le vocatif solennel convient au registre protocolaire de la cour.
- source_word: לְעָלְמִין חֱיִי
  choice: vis pour toujours
  rationale: Rend au plus près la formule d’acclamation royale, tout en laissant percevoir sa valeur de souhait.
- source_word: אֱמַר חֶלְמָא
  choice: Raconte le rêve
  rationale: Dans ce contexte, le roi est prié de rapporter le contenu du rêve ; « raconter » est plus naturel en français que le littéral « dire ».
- source_word: לְעַבְדָךְ
  choice: à tes serviteurs
  rationale: Il s’agit d’une autodésignation déférente propre au langage de cour, non d’une précision sur leur statut juridique.
- source_word: וּפִשְׁרָא
  choice: l’interprétation
  rationale: Dans Daniel, ce nom est le terme technique employé pour l’interprétation des rêves et des visions.
- source_word: נְחַוֵּא
  choice: nous en ferons connaître
  rationale: Le verbe signifie montrer ou faire connaître. Cette formulation française est naturelle et conserve la valeur déclarative du verbe.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement reflète les formes araméennes adressées au roi, tandis que « Ô roi » et la formule « vis pour toujours » préservent le ton protocolaire.
