  text: אֱדַ֤יִן אַרְיוֹךְ֙ בְּ/הִתְבְּהָלָ֔ה הַנְעֵ֥ל לְ/דָנִיֵּ֖אל קֳדָ֣ם מַלְכָּ֑/א וְ/כֵ֣ן אֲמַר לֵ֗/הּ דִּֽי הַשְׁכַּ֤חַת גְּבַר֙ מִן בְּנֵ֤י גָֽלוּתָ/א֙ דִּ֣י יְה֔וּד דִּ֥י פִשְׁרָ֖/א לְ/מַלְכָּ֥/א יְהוֹדַֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/025.yaml
  text: Then Arioch hurriedly brought Daniel before the king and said to him[a], “I have found a man from among the exiles of Judah who will make the interpretation known to the king.”
translation:
  language: fr
  text: 'Alors Ariok conduisit en toute hâte Daniel devant le roi et lui dit : « J’ai trouvé parmi les exilés de Juda[a] un homme qui fera connaître au roi l’interprétation. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les exilés juifs » ou « un Judéen parmi les exilés ». L’araméen présente Daniel comme appartenant au peuple de Juda en exil.
    reason: Alternative lexicale liée à la portée historique et ethnique de דִּי יְהוּד.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: בְּהִתְבְּהָלָה
  choice: en toute hâte
  rationale: Exprime l’empressement et l’urgence sans imposer la nuance moins probable d’effroi.
- source_word: הַנְעֵל
  choice: conduisit
  rationale: Le causatif signifie faire entrer ou amener; « conduisit ... devant le roi » convient naturellement à une présentation à la cour.
- source_word: קֳדָם מַלְכָּא
  choice: devant le roi
  rationale: Rend l’expression de cour désignant la présence royale avec concision.
- source_word: הַשְׁכַּחַת
  choice: J’ai trouvé
  rationale: Le parfait décrit une découverte accomplie dont Ariok annonce maintenant le résultat.
- source_word: גְּבַר
  choice: un homme
  rationale: Le nom araméen désigne ici explicitement un homme.
- source_word: מִן בְּנֵי גָלוּתָא
  choice: parmi les exilés
  rationale: Formulation idiomatique qui conserve le sens collectif des personnes déportées.
- source_word: דִּי יְהוּד
  choice: de Juda
  rationale: Préserve le lien historique avec Juda dans le contexte de l’exil sans trancher excessivement entre provenance territoriale et appartenance au peuple.
- source_word: פִשְׁרָא
  choice: l’interprétation
  rationale: Terme technique récurrent dans Daniel pour l’interprétation d’un rêve ou d’un mystère.
- source_word: יְהוֹדַע
  choice: fera connaître
  rationale: Rend précisément le causatif « faire savoir », sans renforcer le verbe en « révéler ».
theological_decisions:
- issue: Désignation historique et ethnique דִּי יְהוּד
  choice: de Juda
  alternative: des Juifs ; Judéen
  rationale: « De Juda » reste proche de l’araméen et du cadre de l’exil tout en laissant ouverte la nuance exacte entre origine territoriale et appartenance au peuple.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant le vocabulaire de cour et le terme daniélique « interprétation ».
