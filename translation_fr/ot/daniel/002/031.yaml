language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א חָזֵ֤ה הֲוַ֨יְתָ֙ וַ/אֲל֨וּ צְלֵ֥ם חַד֙ שַׂגִּ֔יא צַלְמָ֨/א דִּכֵּ֥ן רַ֛ב וְ/זִיוֵ֥/הּ יַתִּ֖יר קָאֵ֣ם לְ/קָבְלָ֑/ךְ וְ/רֵוֵ֖/הּ דְּחִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/031.yaml
  text: You[a], O king, were watching, and behold, there was one great statue[b]. That statue was immense, and its splendor was extraordinary; it was standing before you[c], and its appearance was terrifying.
translation:
  language: fr
  text: 'Toi, ô roi, tu regardais, et voici : il y avait une grande statue[a]. Cette statue était immense, et son éclat était extraordinaire ; elle se dressait devant toi, et son aspect était terrifiant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande image ». Le mot araméen peut désigner une image ou une statue ; « statue » convient ici à la grande figure visible qui se dresse devant le roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה מַלְכָּ֗א
  choice: Toi, ô roi
  rationale: Le pronom indépendant ouvre l’adresse et peut porter une légère emphase ; « Toi, ô roi » conserve cette mise en relief ainsi que la valeur vocative de מַלְכָּא.
- source_word: חָזֵ֤ה הֲוַ֨יְתָ֙
  choice: tu regardais
  rationale: Le participe accompagné de l’auxiliaire exprime une action en cours dans le passé ; l’imparfait français en rend naturellement la durée.
- source_word: וַאֲל֨וּ
  choice: et voici
  rationale: Cette interjection attire soudainement l’attention sur ce qui apparaît dans la vision ; « et voici » garde sa force présentative dans un registre digne.
- source_word: צְלֵ֥ם חַד֙ שַׂגִּ֔יא
  choice: une grande statue
  rationale: צְלֵם peut désigner une image ou une statue ; le contexte décrit une figure monumentale dressée devant le roi. חַד sert ici à introduire une entité unique et se rend naturellement par l’article indéfini français, sans imposer l’idée contrastive de « une seule ».
- source_word: צַלְמָ֨א דִּכֵּ֥ן רַ֛ב
  choice: Cette statue était immense
  rationale: Le démonstratif reprend la figure qui vient d’être introduite. « Immense » restitue l’intensification de רַב après שַׂגִּיא sans répétition française maladroite.
- source_word: וְזִיוֵ֥הּ יַתִּ֖יר
  choice: et son éclat extraordinaire
  rationale: זִיו désigne l’éclat, la splendeur ou la luminosité, tandis que יַתִּיר marque un degré exceptionnel. La proposition nominale araméenne est rendue de façon concise.
- source_word: קָאֵ֣ם לְקָבְלָ֑ךְ
  choice: elle se dressait devant toi
  rationale: Le participe décrit la position durable de la statue. « Se dressait » convient à une figure monumentale et לְקָבְלָךְ signifie « devant toi » ou « en face de toi ».
- source_word: וְרֵוֵ֖הּ דְּחִֽיל
  choice: et son aspect était terrifiant
  rationale: רֵו renvoie à l’aspect ou à l’apparence, et דְּחִיל qualifie ce qui suscite la peur. « Terrifiant » exprime clairement cet effet.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait maintient le caractère progressif de la scène. « Ô roi » conserve le ton solennel de l’adresse sans archaïsme excessif ; « et voici » garde la présentation soudaine propre au récit de vision.
