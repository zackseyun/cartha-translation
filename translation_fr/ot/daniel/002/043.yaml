source:
  edition: WLC
  text: די חֲזַ֗יְתָ פַּרְזְלָ/א֙ מְעָרַב֙ בַּ/חֲסַ֣ף טִינָ֔/א מִתְעָרְבִ֤ין לֶהֱוֺן֙ בִּ/זְרַ֣ע אֲנָשָׁ֔/א וְ/לָֽא לֶהֱוֺ֥ן דָּבְקִ֖ין דְּנָ֣ה עִם דְּנָ֑ה הֵֽא כְ/דִ֣י פַרְזְלָ֔/א לָ֥א מִתְעָרַ֖ב עִם חַסְפָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/043.yaml
  text: As you saw the iron mixed with clay[a], they will mix themselves with the seed of man, but they will not hold together, this one with that one[c][b], just as iron does not mix with pottery.
translation:
  language: fr
  text: De même que tu as vu le fer mêlé à l’argile[a], ils se mêleront à la descendance humaine, mais ils ne tiendront pas ensemble, l’un à l’autre[b], tout comme le fer ne se mêle pas à la terre cuite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’argile de boue »; on peut aussi comprendre « l’argile du potier ».'
    reason: Précision lexicale sur l’expression araméenne חֲסַף טִינָא.
  - marker: b
    text: 'Littéralement : « celui-ci avec celui-là »; autre traduction : « les uns aux autres ».'
    reason: Signaler la formulation distributive des démonstratifs araméens.
  - marker: c
    text: 'Ou : « l’argile » ou « la poterie ».'
    reason: Le dernier terme peut désigner l’argile, la terre cuite ou un objet de poterie.
lexical_decisions:
- source_word: חֲזַיְתָ
  choice: tu as vu
  rationale: Rend directement la deuxième personne masculine singulière et renvoie naturellement à la vision de Nabuchodonosor.
- source_word: פַּרְזְלָא
  choice: le fer
  rationale: Équivalent courant et précis dans l’image de la statue.
- source_word: מְעָרַב
  choice: mêlé
  rationale: Le verbe exprime le mélange; « mêlé » convient au registre et à l’image des matériaux.
- source_word: חֲסַף טִינָא
  choice: l’argile
  rationale: L’expression désigne la matière argileuse des pieds de la statue; « argile » est clair et naturel.
- source_word: מִתְעָרְבִין לֶהֱוֺן
  choice: ils se mêleront
  rationale: La forme à valeur réfléchie ou médio-passive est naturellement rendue en français par le verbe pronominal.
- source_word: בִּזְרַע אֲנָשָׁא
  choice: à la descendance humaine
  rationale: « Descendance » conserve l’image de זְרַע sans imposer le sens d’unions matrimoniales; « humaine » rend l’expression idiomatiquement en français tout en maintenant son ambiguïté.
- source_word: דָּבְקִין
  choice: resteront pas unis
  rationale: Exprime l’idée de ne pas adhérer ou tenir ensemble dans un français naturel adapté à l’instabilité de l’ensemble.
- source_word: דְּנָה עִם דְּנָה
  choice: l’un à l’autre
  rationale: Rend la relation réciproque entre les éléments distincts sans alourdir la phrase.
- source_word: הֵא כְדִי
  choice: tout comme
  rationale: Introduit clairement la comparaison qui fonde l’affirmation précédente.
- source_word: חַסְפָּא
  choice: la terre cuite
  rationale: Le terme peut désigner une matière ou un objet en argile cuite; « terre cuite » préserve une légère distinction avec l’argile mentionnée plus tôt.
theological_decisions:
- issue: Sens de « ils se mêleront à la descendance humaine »
  choice: Conserver la formulation ambiguë sans préciser le référent de « ils » ni la modalité du mélange.
  alternative: Traduire explicitement par « ils contracteront des mariages » ou identifier les groupes concernés.
  rationale: L’araméen ne tranche pas entre les diverses lectures historiques ou eschatologiques. Une formulation ouverte préserve la tension du texte sans importer un système d’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au roi dans le contexte. La tournure pronominale « se mêleront » conserve la nuance réfléchie, tandis que « descendance humaine » maintient l’image et l’ambiguïté de l’araméen.
