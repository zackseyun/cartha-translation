id: DAN.2.21
reference: Daniel 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/הוּא מְהַשְׁנֵ֤א עִדָּנַיָּ/א֙ וְ/זִמְנַיָּ֔/א מְהַעְדֵּ֥ה מַלְכִ֖ין וּ/מְהָקֵ֣ים מַלְכִ֑ין יָהֵ֤ב חָכְמְתָ/א֙ לְ/חַכִּימִ֔ין וּ/מַנְדְּעָ֖/א לְ/יָדְעֵ֥י בִינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/021.yaml
  text: He changes times and seasons[a]; he removes kings and sets up kings[b]; he gives wisdom to the wise and knowledge to those who have understanding.
translation:
  language: fr
  text: C’est lui qui change les temps et les moments fixés[a] ; il destitue les rois et établit les rois ; il donne la sagesse aux sages et la connaissance à ceux qui savent discerner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les temps et les occasions ». Les deux termes araméens peuvent désigner les périodes en général ainsi que les moments appropriés ou déterminés.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַשְׁנֵא
  choice: change
  rationale: Le participe araméen exprime l’action de faire changer ; le présent français conserve ici la portée générale et continue de l’énoncé.
- source_word: עִדָּנַיָּא וְזִמְנַיָּא
  choice: les temps et les moments fixés
  rationale: Le premier terme désigne des temps ou périodes, tandis que le second peut évoquer des occasions déterminées. Cette formulation naturelle maintient une distinction sans réduire la paire à une seule notion.
- source_word: מְהַעְדֵּה
  choice: destitue
  rationale: Avec les rois pour complément, le verbe signifie les écarter de leur fonction. « Destitue » rend précisément le contexte politique, tout en évitant d’évoquer leur mort.
- source_word: מַלְכִין
  choice: les rois
  rationale: Équivalent direct du pluriel araméen.
- source_word: מְהָקֵים
  choice: établit
  rationale: Le verbe signifie faire se lever ou établir. Appliqué à des rois, « établit » exprime naturellement leur accession ou leur maintien en fonction.
- source_word: יָהֵב
  choice: donne
  rationale: Traduction directe et courante du verbe araméen.
- source_word: חָכְמְתָא לְחַכִּימִין
  choice: la sagesse aux sages
  rationale: La formulation conserve la répétition lexicale et la concision du texte source.
- source_word: מַנְדְּעָא
  choice: la connaissance
  rationale: Ce choix distingue ce nom de בִינָה, qui relève ici du discernement ou de l’intelligence.
- source_word: לְיָדְעֵי בִינָה
  choice: à ceux qui savent discerner
  rationale: La construction signifie littéralement « à ceux qui connaissent l’intelligence/le discernement ». La formulation française préserve l’idée de savoir et celle de discernement sans produire une expression artificielle.
theological_decisions:
- issue: Souveraineté divine sur les dirigeants politiques
  choice: « il destitue les rois et établit les rois »
  alternative: « il permet aux rois de perdre ou de recevoir le pouvoir »
  rationale: L’araméen attribue directement les deux actions à Dieu. La traduction garde cette affirmation forte sans lui ajouter un système particulier concernant les moyens de l’action divine.
- issue: Don de la sagesse aux sages
  choice: Conserver « il donne la sagesse aux sages »
  alternative: Expliciter que Dieu rend sages ceux qui ne le sont pas encore
  rationale: 'La tension apparente appartient au texte : il donne la sagesse à ceux qui sont désignés comme sages. Il ne faut pas résoudre cette formulation en ajoutant une chronologie ou une doctrine absente du verset.'
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « les rois… les rois » et « la sagesse aux sages » conserve le parallélisme araméen. « Moments fixés » est plus explicite que « saisons », qui évoquerait trop facilement les saisons de l’année en français contemporain.
