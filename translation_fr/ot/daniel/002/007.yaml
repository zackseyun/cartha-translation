  text: They answered a second time and said[a], “Let the king tell the dream to his servants[b], and we will show the interpretation.”
translation:
  language: fr
  text: 'Ils répondirent une deuxième fois[a] : « Que le roi raconte le rêve à ses serviteurs, et nous en donnerons l’interprétation[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau ». L’adverbe araméen signifie plus précisément « une deuxième fois ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nous en ferons connaître l’interprétation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ
  choice: Ils répondirent
  rationale: Le parfait peal, à la 3e personne du pluriel, introduit leur nouvelle réponse. Le passé simple convient au registre narratif biblique sans être archaïque.
- source_word: תִנְיָנוּת
  choice: une deuxième fois
  rationale: Cette locution conserve la nuance ordinale explicite de l’adverbe araméen, plus précisément que « de nouveau ».
- source_word: וְאָמְרִין
  choice: 'répondirent … :'
  rationale: 'En français, la formule « répondre : » introduit naturellement les paroles et intègre le sens de « et dirent », dont la reproduction littérale serait lourde.'
- source_word: מַלְכָּא
  choice: le roi
  rationale: Le nom est sujet de יֵאמַר, et non une apostrophe; « le roi » respecte donc la syntaxe araméenne.
- source_word: חֶלְמָא
  choice: le rêve
  rationale: Rendu courant et précis du terme araméen dans ce contexte.
- source_word: יֵאמַר
  choice: Que le roi raconte
  rationale: La tournure avec « que » rend la valeur volitive ou jussive de l’imparfait. « Raconter un rêve » est plus idiomatique en français que « dire un rêve ».
- source_word: לְעַבְדוֹהִי
  choice: à ses serviteurs
  rationale: Dans cette adresse de cour, le terme désigne les personnes au service du roi et sert à parler respectueusement de soi; « serviteurs » convient mieux ici que « esclaves ».
- source_word: וּפִשְׁרָהּ
  choice: et nous en ferons connaître l’interprétation
  rationale: « Interprétation » correspond au vocabulaire araméen de l’explication des rêves. Le pronom « en » restitue naturellement en français le rapport possessif avec le rêve, tandis que « ferons connaître » rend le haphel de חוה.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La formule littérale « répondirent une deuxième fois et dirent » a été allégée en « répondirent une deuxième fois : », formulation française naturelle qui conserve la fonction des deux verbes.'
