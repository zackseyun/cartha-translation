base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/049.yaml
  text: And Daniel requested of the king[a], and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. But Daniel remained at the king’s court.
translation:
  language: fr
  text: Daniel présenta une requête au roi, et celui-ci nomma Shadrak, Méshak et Abed-Nego responsables de l’administration de la province de Babylone. Quant à Daniel, il resta à la cour du roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la porte du roi ». Cette expression désigne probablement la place de Daniel à la cour ou au sein de l’administration royale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָא מִן מַלְכָּא
  choice: adressa une demande au roi
  rationale: Le verbe araméen exprime l’action de demander ou de solliciter. Cette formulation est naturelle en français et convient au cadre officiel sans suggérer une procédure juridique précise.
- source_word: וּמַנִּי
  choice: et celui-ci nomma
  rationale: Le verbe signifie placer ou nommer à une fonction. Son sujet, non exprimé en araméen, est naturellement le roi dans ce contexte; « celui-ci » l’indique clairement sans ambiguïté.
- source_word: עַל עֲבִידְתָּא
  choice: responsables de l’administration
  rationale: Le nom peut désigner le travail, le service ou les affaires. Dans ce contexte gouvernemental, il s’agit vraisemblablement de responsabilités administratives.
- source_word: דִּי מְדִינַת בָּבֶל
  choice: de la province de Babylone
  rationale: En araméen impérial, מְדִינָה désigne couramment une circonscription administrative; « province » est le terme français le plus clair.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Ces graphies françaises rendent les trois noms araméens de manière reconnaissable et conforme à l’usage biblique francophone courant.
- source_word: וְדָנִיֵּאל
  choice: Quant à Daniel
  rationale: La conjonction introduit ici un contraste entre la charge provinciale confiée aux trois compagnons et la position de Daniel auprès du roi. « Quant à » rend ce changement de sujet sans durcir excessivement l’opposition.
- source_word: בִּתְרַע מַלְכָּא
  choice: à la cour du roi
  rationale: L’expression signifie littéralement « à la porte du roi ». Dans le langage administratif du Proche-Orient ancien, la porte peut désigner le lieu de l’administration et de la présence royales. « À la cour du roi » en communique naturellement le sens probable.
