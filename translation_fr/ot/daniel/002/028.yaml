  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּרַ֡ם אִיתַ֞י אֱלָ֤הּ בִּ/שְׁמַיָּ/א֙ גָּלֵ֣א רָזִ֔ין וְ/הוֹדַ֗ע לְ/מַלְכָּ/א֙ נְבֽוּכַדְנֶצַּ֔ר מָ֛ה דִּ֥י לֶהֱוֵ֖א בְּ/אַחֲרִ֣ית יוֹמַיָּ֑/א חֶלְמָ֨/ךְ וְ/חֶזְוֵ֥י רֵאשָׁ֛/ךְ עַֽל מִשְׁכְּבָ֖/ךְ דְּנָ֥ה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/028.yaml
  text: 'But there is a God in heaven who reveals mysteries[a], and he has made known to King Nebuchadnezzar what will happen in the latter days. Your dream, and the visions of your head as you lay on your bed[c][b], were these:'
translation:
  language: fr
  text: 'Mais il y a un Dieu dans le ciel[a] qui révèle les mystères, et il a fait connaître au roi Nabuchodonosor ce qui arrivera dans les derniers jours[b]. Voici ton rêve et les visions que tu as eues dans ton esprit[c] pendant que tu étais couché sur ton lit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Dieu dans le ciel » ou « le Dieu du ciel ». En araméen, l’expression est formellement indéfinie, bien que le contexte désigne clairement le Dieu véritable.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « à la fin des jours ». L’expression peut désigner une période future décisive sans préciser un système particulier concernant la fin des temps.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « les visions de ta tête ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Mais
  rationale: La particule adversative marque le contraste avec l’incapacité des sages de Babylone mentionnée auparavant.
- source_word: אִיתַי אֱלָהּ בִּשְׁמַיָּא
  choice: il y a un Dieu dans le ciel
  rationale: Cette formulation conserve l’assertion existentielle et le caractère formellement indéfini du nom araméen, tout en désignant clairement, par la majuscule et le contexte, le Dieu véritable.
- source_word: גָּלֵא רָזִין
  choice: qui révèle les mystères
  rationale: Le participe présente cette révélation comme une action caractéristique de Dieu; « mystères » maintient le motif des réalités cachées que Dieu dévoile dans Daniel.
- source_word: וְהוֹדַע
  choice: et il a fait connaître
  rationale: Le causatif signifie faire savoir; cette traduction le distingue du verbe précédent, rendu par « révèle ».
- source_word: מָה דִּי לֶהֱוֵא
  choice: ce qui arrivera
  rationale: Expression française naturelle de la proposition orientée vers l’avenir, sans archaïsme ni ajout interprétatif.
- source_word: בְּאַחֲרִית יוֹמַיָּא
  choice: dans les derniers jours
  rationale: Rend directement la perspective temporelle tout en laissant ouverte l’étendue exacte de la période annoncée.
- source_word: חֶלְמָךְ וְחֶזְוֵי רֵאשָׁךְ
  choice: ton rêve et les visions que tu as eues dans ton esprit
  rationale: « Dans ton esprit » transmet en français courant l’idiome araméen littéral « visions de ta tête », sans perdre la distinction entre rêve et visions.
- source_word: עַל מִשְׁכְּבָךְ
  choice: pendant que tu étais couché sur ton lit
  rationale: Rend naturellement la situation décrite par la locution prépositionnelle, sans suggérer que les visions se trouvaient physiquement sur le lit.
- source_word: דְּנָה הוּא
  choice: Voici
  rationale: Formule présentative idiomatique introduisant le contenu du rêve qui suit.
theological_decisions:
- issue: Caractère indéfini de אֱלָהּ dans un contexte monothéiste
  choice: un Dieu dans le ciel
  alternative: Dieu dans le ciel; le Dieu du ciel
  rationale: L’araméen est formellement indéfini. La traduction conserve cette forme et le contraste rhétorique de la cour païenne, tandis que la majuscule et le contexte indiquent qu’il s’agit du Dieu véritable, sans imposer une détermination absente du texte.
- issue: Portée temporelle de בְּאַחֲרִית יוֹמַיָּא
  choice: dans les derniers jours
  alternative: dans les temps à venir; à la fin des jours
  rationale: La formulation garde la possible portée eschatologique sans l’enfermer dans un système précis ni fixer davantage que le texte la chronologie annoncée.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe du sujet au roi dans le récit biblique. La syntaxe reste fluide tout en conservant l’indéfinité de « un Dieu » et l’ouverture théologique de « dans les derniers jours ».
