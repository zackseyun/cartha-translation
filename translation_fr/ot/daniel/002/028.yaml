  source_fidelity: 'Le texte rend fidèlement l’araméen : l’adversatif (« Mais »), l’expression existentielle formellement indéfinie (« il y a un Dieu dans le ciel »), l’action caractéristique de révéler les mystères, puis l’action accomplie de faire connaître au roi ce qui arrivera, sont bien distingués. « Dans les derniers jours » conserve la portée future et possiblement eschatologique de בְּאַחֲרִית יוֹמַיָּא sans la systématiser. La reformulation de « visions de ta tête » par « les visions que tu as eues dans ton esprit » est un léger idiomatisme interprétatif, mais demeure fidèle au sens et est correctement documentée par la note littérale.'
