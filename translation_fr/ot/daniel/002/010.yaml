source:
  edition: WLC
  text: עֲנ֨וֹ כשדי/א קֳדָם מַלְכָּ/א֙ וְ/אָ֣מְרִ֔ין לָֽא אִיתַ֤י אֲנָשׁ֙ עַל יַבֶּשְׁתָּ֔/א דִּ֚י מִלַּ֣ת מַלְכָּ֔/א יוּכַ֖ל לְ/הַחֲוָיָ֑ה כָּ/ל קֳבֵ֗ל דִּ֚י כָּל מֶ֨לֶךְ֙ רַ֣ב וְ/שַׁלִּ֔יט מִלָּ֤ה כִ/דְנָה֙ לָ֣א שְׁאֵ֔ל לְ/כָל חַרְטֹּ֖ם וְ/אָשַׁ֥ף וְ/כַשְׂדָּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/010.yaml
  text: The Chaldeans answered before the king and said, “There is not a man on earth who can make known the king’s matter, because no great and powerful king has asked for a thing like this from any diviner-priest, enchanter, or Chaldean.”
translation:
  language: fr
  text: 'Les Chaldéens répondirent au roi : « Il n’existe personne sur terre qui puisse faire connaître la chose demandée par le roi. En effet, jamais aucun roi, si grand et puissant soit-il, n’a demandé pareille chose à un prêtre-devin, à un enchanteur ou à un Chaldéen. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ כשדי/א קֳדָם מַלְכָּ/א
  choice: Les Chaldéens répondirent au roi
  rationale: Le verbe araméen signifie « répondre » et קֳדָם, littéralement « devant », introduit ici la personne à laquelle ils répondent. La formule française évite le pléonasme sémitique « répondirent et dirent ».
- source_word: לָא אִיתַי אֲנָשׁ עַל יַבֶּשְׁתָּא
  choice: Il n’existe personne sur terre
  rationale: יַבֶּשְׁתָּא désigne la terre ferme ou le monde terrestre; « sur terre » est naturel et conserve la portée universelle.
- source_word: מִלַּת מַלְכָּא
  choice: ce que demande le roi
  rationale: מִלָּה peut désigner une parole, une affaire ou une requête. Dans le contexte, il s’agit de l’exigence formulée par le roi; cette traduction restitue le sens sans retenir l’expression peu naturelle « l’affaire du roi ».
- source_word: יוּכַל לְהַחֲוָיָה
  choice: puisse faire connaître
  rationale: הַחֲוָיָה signifie montrer, déclarer ou faire connaître; « faire connaître » convient à la demande de révéler le songe.
- source_word: כָּל קֳבֵל דִּי
  choice: En effet
  rationale: La locution introduit la justification de l’affirmation précédente; « En effet » rend clairement ce lien causal.
- source_word: כָּל מֶלֶךְ רַב וְשַׁלִּיט
  choice: jamais aucun roi, si grand et puissant soit-il
  rationale: 'Avec la négation, כָּל a une valeur universelle: aucun roi. רַב וְשַׁלִּיט qualifie un souverain grand et puissant; la tournure concessive est idiomatique en français.'
- source_word: מִלָּה כִדְנָה לָא שְׁאֵל
  choice: n’a exigé pareille chose
  rationale: שְׁאֵל signifie demander, mais le contexte royal et la requête imposée justifient « exiger ». כִדְנָה est rendu par « pareille ».
- source_word: חַרְטֹּם וְאָשַׁף וְכַשְׂדָּי
  choice: prêtre-devin, enchanteur ou Chaldéen
  rationale: Les trois catégories de spécialistes sont maintenues distinctes. « Prêtre-devin » reflète la fonction cultuelle et divinatoire de חַרְטֹּם; « enchanteur » rend אָשַׁף; « Chaldéen » conserve ici le titre du groupe de sages de cour.
theological_decisions:
- issue: Portée de l’incapacité humaine
  choice: « Il n’existe personne sur terre »
  alternative: « Aucun être humain sur terre »
  rationale: La formulation conserve l’affirmation absolue des Chaldéens sans l’ériger en commentaire doctrinal du narrateur ni anticiper l’intervention divine.
- issue: Nature de la demande royale
  choice: « ce que demande le roi »
  alternative: « l’affaire du roi »
  rationale: Le terme araméen reste contextuellement polyvalent, mais la demande est bien l’objet immédiat du discours. La traduction n’ajoute aucune interprétation sur le contenu du songe.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe est allégée sans effacer la solennité de la scène de cour. Aucun marqueur de note n’est nécessaire.
