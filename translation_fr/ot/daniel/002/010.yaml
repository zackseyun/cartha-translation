  to: 'Les Chaldéens répondirent au roi : « Il n’existe personne sur terre qui puisse faire connaître la chose demandée par le roi. En effet, jamais aucun roi, si grand et puissant soit-il, n’a demandé pareille chose à un prêtre-devin, à un enchanteur ou à un Chaldéen. »'
