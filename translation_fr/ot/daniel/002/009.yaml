source:
  edition: WLC
  text: דִּ֣י הֵן חֶלְמָ/א֩ לָ֨א תְהֽוֹדְעֻנַּ֜/נִי חֲדָה הִ֣יא דָֽתְ/כ֗וֹן וּ/מִלָּ֨ה כִדְבָ֤ה וּ/שְׁחִיתָה֙ הזמנתון לְ/מֵאמַ֣ר קָֽדָמַ֔/י עַ֛ד דִּ֥י עִדָּנָ֖/א יִשְׁתַּנֵּ֑א לָהֵ֗ן חֶלְמָ/א֙ אֱמַ֣רוּ לִ֔/י וְֽ/אִנְדַּ֕ע דִּ֥י פִשְׁרֵ֖/הּ תְּהַחֲוֻנַּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/009.yaml
  text: But if you do not make the dream known to me[a], there is only one decree for you, for you have agreed to speak lying and corrupt words before me until the time changes. Therefore tell me the dream[c][b], and I will know that you can make its interpretation known to me.
translation:
  language: fr
  text: Mais si vous ne me faites pas connaître le rêve, une seule sentence vous attend[a], car vous vous êtes concertés pour prononcer devant moi des paroles mensongères et corrompues[b], jusqu’à ce que le temps change[c]. Dites-moi donc le rêve, et je saurai que vous pouvez m’en faire connaître l’interprétation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une seule décision est prise à votre sujet », « un seul décret est prononcé contre vous » ou « une seule loi s’applique à vous ». Le terme araméen peut désigner une loi, un décret ou une sentence judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous avez préparé » ou « vous avez arrangé entre vous » de prononcer devant moi des paroles fausses et corrompues.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « jusqu’à ce que le temps change » ; on pourrait aussi comprendre : « jusqu’à ce que les temps changent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי הֵן
  choice: Mais si
  rationale: Introduit une condition avec une nuance adversative qui convient au lien avec le verset précédent.
- source_word: חֶלְמָא
  choice: le rêve
  rationale: Le roi désigne le rêve précis déjà au centre de l’échange.
- source_word: לָא תְהוֹדְעֻנַּנִי
  choice: vous ne me faites pas connaître
  rationale: Conserve la valeur causative du haph‘el de ידע tout en restant naturel en français.
- source_word: חֲדָה הִיא דָתְכוֹן
  choice: une seule sentence vous attend
  rationale: Dans le contexte judiciaire de la cour, דָּת peut désigner la décision ou sentence applicable à tous; cette formulation exprime naturellement la menace sans en préciser indûment le contenu.
- source_word: וּמִלָּה כִדְבָה וּשְׁחִיתָה
  choice: des paroles mensongères et trompeuses
  rationale: 'Rend les deux qualificatifs: כִדְבָה marque le mensonge et שְׁחִיתָה une parole corrompue, pervertie ou propre à égarer.'
- source_word: הזמנתון
  choice: vous vous êtes concertés
  rationale: Le verbe évoque une préparation ou un arrangement délibéré; la forme réfléchie française fait ressortir ici l’action collective sans réduire le sens à un simple accord.
- source_word: לְמֵאמַר קָדָמַי
  choice: pour prononcer devant moi
  rationale: Exprime l’intention de présenter ces paroles en présence du roi.
- source_word: עַד דִּי עִדָּנָא יִשְׁתַּנֵּא
  choice: en attendant que la situation change
  rationale: Le singulier עִדָּנָא signifie littéralement «le temps»; dans l’accusation du roi, il vise vraisemblablement un changement de conjoncture. La note conserve l’alternative plus formelle.
- source_word: לָהֵן
  choice: donc
  rationale: Marque naturellement en français la conséquence tirée par le roi.
- source_word: אֱמַרוּ לִי
  choice: Dites-moi
  rationale: Rend directement et idiomatiquement l’impératif araméen.
- source_word: וְאִנְדַּע
  choice: et je saurai
  rationale: Préserve la coordination et la valeur résultative de l’imparfait.
- source_word: פִשְׁרֵהּ תְּהַחֲוֻנַּנִי
  choice: vous pouvez m’en faire connaître l’interprétation
  rationale: פשר est le terme technique récurrent pour l’interprétation; le présent «pouvez» exprime l’assurance que le roi tirera de leur capacité à révéler le rêve.
theological_decisions: []
