  register: Français international moderne, digne et accessible. La syntaxe suit l’enchaînement accusatoire du texte araméen, tandis que «la situation change» explicite sobrement l’expression temporelle dans le corps du texte; sa forme littérale est conservée en note. Tous les marqueurs de notes figurent dans le texte principal.
