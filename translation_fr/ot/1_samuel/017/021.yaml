  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: fr
  text: Israël et les Philistins se rangèrent en ordre de bataille, formation face à formation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement dit, chaque formation faisait face à l’autre. Littéralement, le texte répète : « formation face à formation »; on peut aussi traduire : « ligne de bataille contre ligne de bataille ».'
    reason: La note explique la construction répétitive de l’hébreu et fournit une alternative militaire plus explicite, sans modifier le sens du texte.
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: se rangèrent
  rationale: Dans ce contexte militaire, le verbe ערך décrit la disposition ordonnée des troupes. Le pluriel français rend naturellement le sujet composé, malgré la forme verbale hébraïque au singulier.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre traditionnel en français, désignant ici le peuple ou l’armée d’Israël.
- source_word: וּפְלִשְׁתִּים
  choice: et les Philistins
  rationale: Désignation française courante de ce peuple.
- source_word: מַעֲרָכָה
  choice: en ordre de bataille / une ligne
  rationale: Le nom désigne une formation militaire rangée. La formulation française évite une répétition lourde tout en conservant l’image de deux lignes de combat opposées.
- source_word: לִקְרַאת
  choice: face à
  rationale: L’expression indique que les deux formations se font face; « face à » préserve le sens spatial, tandis que le contexte établit leur opposition militaire.
- source_word: מַעֲרָכָה
  choice: l’autre
  rationale: La seconde occurrence renvoie à la formation adverse. « L’autre » produit un français naturel, et la note conserve la possibilité de reproduire explicitement la répétition hébraïque.
