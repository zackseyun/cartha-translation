  text: וַ/יֹּ֖אמֶר הַ/מֶּ֑לֶךְ שְׁאַ֣ל אַתָּ֔ה בֶּן מִי זֶ֖ה הָ/עָֽלֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/056.yaml
  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: fr
  text: 'Le roi dit : « Toi, cherche à savoir[a] de qui ce jeune homme est le fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renseigne-toi pour savoir de qui ce jeune homme est le fils ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple rend naturellement cette succession narrative sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne Saül dans le contexte, mais le texte hébreu emploie ici son titre plutôt que son nom.
- source_word: שְׁאַל
  choice: demande
  rationale: L’impératif de שׁאל signifie « demander » ou « s’informer ». « Demande de qui… » reste proche de la formulation hébraïque et convient au discours direct.
- source_word: אַתָּה
  choice: Toi
  rationale: Le pronom indépendant, explicitement exprimé en hébreu, donne de l’emphase au destinataire. Sa mise en tête préserve cette insistance.
- source_word: בֶּן מִי
  choice: de qui … est le fils
  rationale: Cette tournure rend directement l’expression hébraïque portant sur la filiation paternelle, dans un français clair et naturel.
- source_word: זֶה
  choice: ce
  rationale: Le démonstratif masculin singulier désigne le jeune homme présent ou immédiatement en vue.
- source_word: הָעָלֶם
  choice: jeune homme
  rationale: Le terme désigne un jeune individu de sexe masculin. « Jeune homme » est actuel, clair et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, au registre narratif digne. Le passé simple convient au récit biblique écrit, tandis que la parole du roi reste directe et compréhensible. L’emphase inhabituelle de אַתָּה est conservée par « Toi ».
