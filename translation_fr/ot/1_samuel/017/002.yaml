  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: fr
  text: Saül et les hommes d’Israël se rassemblèrent et établirent leur camp dans la vallée d’Éla ; ils se rangèrent en ordre de bataille face aux Philistins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour affronter les Philistins » ; littéralement, « à la rencontre des Philistins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאוּל
  choice: Saül
  rationale: En français, il n’est pas nécessaire de rendre systématiquement le waw narratif par « et » en tête de phrase ; l’enchaînement du récit reste naturel sans ce calque.
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: et les hommes d’Israël
  rationale: Le singulier collectif אִישׁ désigne ici les hommes mobilisés d’Israël. Cette formulation reste proche de l’hébreu sans expliciter davantage par « armée ».
- source_word: נֶאֶסְפוּ
  choice: se rassemblèrent
  rationale: Le niphal exprime ici le rassemblement collectif ; le verbe pronominal est naturel en français et convient au contexte militaire.
- source_word: וַיַּחֲנוּ
  choice: établirent leur camp
  rationale: Cette expression française courante rend clairement l’installation du camp, avec un registre narratif digne.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: dans la vallée d’Éla
  rationale: עֵמֶק signifie « vallée » et הָאֵלָה fonctionne ici comme un nom de lieu, translittéré « Éla » selon l’usage français.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: ils se rangèrent en ordre de bataille
  rationale: L’expression hébraïque évoque la disposition des troupes pour le combat. La traduction conserve cette image militaire sans le calque peu naturel « organiser la bataille ».
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: face aux Philistins
  rationale: לִקְרַאת peut indiquer le fait d’aller à la rencontre de quelqu’un ou de lui faire face. « Face aux » convient au déploiement militaire tout en évitant de suraccentuer la valeur adversative.
