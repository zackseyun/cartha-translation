    issue: Ambiguïté du possessif dans « Il prit son épée »
    rationale: En français, le possessif « son » après un sujet David se lit facilement comme désignant l’épée de David. Le texte hébreu dit qu’il prit l’épée du Philistin. Employer « l’épée du Philistin » restitue clairement cette référence sans alourdir indûment le style.
