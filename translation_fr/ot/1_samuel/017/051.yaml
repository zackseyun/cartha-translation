base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: fr
  text: Alors David courut et se tint près du Philistin[a]. Il prit l’épée du Philistin, la tira de son fourreau et le mit à mort, puis il lui coupa la tête avec elle. Quand les Philistins virent que leur vaillant guerrier[b] était mort, ils prirent la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tint au-dessus du Philistin ». L’expression hébraïque peut indiquer que David prit position près de lui; « au-dessus » correspondrait à la scène probable où David domine le Philistin tombé.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur homme fort », « leur héros » ou « leur champion ». Le mot hébreu désigne un homme puissant ou un guerrier valeureux; ici, il s’agit de Goliath, qui combattait au nom des Philistins.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: courut
  rationale: Le verbe רוץ exprime simplement la course rapide de David dans la séquence narrative.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: se tint près du Philistin
  rationale: La construction עמד אל indique que David prend position auprès du Philistin tombé. Cette formulation conserve la valeur spatiale sans imposer l'image plus précise de David debout au-dessus de lui.
- source_word: חַרְבּוֹ
  choice: son épée
  rationale: 'Le suffixe possessif renvoie naturellement au Philistin : David saisit l''épée de celui-ci.'
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: la tira de son fourreau
  rationale: שלף désigne l'action de tirer une arme, et תער son fourreau dans ce contexte.
- source_word: וַיְמֹתְתֵהוּ
  choice: le mit à mort
  rationale: La forme de מות est causative et décrit explicitement l'acte par lequel David achève le Philistin. La séquence du texte est maintenue malgré l'affirmation du verset précédent selon laquelle il était déjà tombé mortellement frappé.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: il lui coupa la tête avec elle
  rationale: כרת avec ראש signifie couper ou trancher la tête; « avec elle » reprend explicitement l'épée, conformément au féminin hébreu.
- source_word: גִּבּוֹרָם
  choice: leur vaillant guerrier
  rationale: גבור désigne un homme fort ou un guerrier valeureux. Cette traduction rend le sens lexical sans substituer directement le terme technique employé plus tôt pour le combattant représentatif.
- source_word: וַיָּנֻסוּ
  choice: ils prirent la fuite
  rationale: נוס est le verbe courant de la fuite, notamment militaire; l'expression française est naturelle et digne.
