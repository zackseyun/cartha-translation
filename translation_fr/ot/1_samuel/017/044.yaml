base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: fr
  text: 'Le Philistin dit à David : « Viens vers moi, et je donnerai ta chair aux oiseaux du ciel et aux bêtes des champs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: Le nom défini désigne ici Goliath en tant que représentant de son peuple. Cette traduction reste précise sans ajouter « guerrier », absent de l’hébreu.
- source_word: לְכָה אֵלַי
  choice: Viens vers moi
  rationale: L’impératif de הלך suivi de אֵלַי exprime une provocation directe. « Viens vers moi » est naturel en français et conserve le mouvement dirigé vers le locuteur.
- source_word: וְאֶתְּנָה
  choice: et je donnerai
  rationale: La forme exprime ici la ferme résolution du locuteur et se rend naturellement par un futur menaçant.
- source_word: בְּשָׂרְךָ
  choice: ta chair
  rationale: « Chair » traduit directement בשר et préserve l’image brutale de la menace sans l’atténuer en « corps » ni l’interpréter comme « cadavre ».
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: aux oiseaux du ciel
  rationale: Dans ce contexte, עוף désigne naturellement les oiseaux, et « du ciel » est l’expression française courante correspondant à הַשָּׁמַיִם.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: et aux bêtes des champs
  rationale: בְּהֵמָה peut désigner des animaux ou des bêtes. « Bêtes des champs » conserve la vigueur de la menace et l’idiome biblique tout en restant compréhensible.
