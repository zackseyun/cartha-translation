  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: fr
  text: 'David dit à Saül : « Ton serviteur gardait le troupeau de son père, et il arrivait qu’un lion ou un ours[a] vienne emporter une bête du troupeau[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « le lion et l’ours ». L’hébreu emploie « et », mais le sens est probablement distributif : l’un ou l’autre de ces prédateurs venait.'
    reason: lexical_alternative
  - marker: b
    text: Ou « un agneau ». Le terme hébreu peut désigner plus largement un animal du petit bétail, ovin ou caprin.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: gardait
  rationale: La construction avec le participe décrit l’activité habituelle de David. « Gardait » est naturel en français et exprime clairement son rôle de berger sans alourdir la phrase.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans une adresse au roi, il s’agit d’une formule conventionnelle d’humilité. « Ton serviteur » conserve cette déférence sans mettre indûment l’accent sur le statut d’esclave.
- source_word: לְאָבִיו בַּצֹּאן
  choice: le troupeau de son père
  rationale: Cette formulation française restitue naturellement l’idée que David prenait soin du petit bétail appartenant à son père.
- source_word: וּבָא
  choice: venait
  rationale: Dans ce souvenir décrivant ce qui pouvait se produire pendant son activité de berger, l’imparfait français rend bien la valeur habituelle ou récurrente.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: un lion ou un ours
  rationale: 'Bien que l’hébreu emploie les articles et la conjonction « et », le sens paraît distributif : l’un ou l’autre prédateur pouvait venir. Le français idiomatique emploie donc « un… ou un… », tout en signalant la forme plus littérale en note.'
- source_word: וְנָשָׂא
  choice: emporter
  rationale: Dans le contexte d’un prédateur saisissant une proie, « emporter » exprime de façon concise le fait de la prendre et de l’éloigner.
- source_word: שֶׂה
  choice: une bête du troupeau
  rationale: Le terme peut désigner une tête de petit bétail, ovine ou caprine, et pas nécessairement un jeune animal. Cette traduction garde cette amplitude sémantique.
- source_word: מֵהָעֵדֶר
  choice: du troupeau
  rationale: « Troupeau » est le terme français naturel pour le groupe d’animaux gardé par David.
theological_decisions: []
