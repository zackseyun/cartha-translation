source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: fr
  text: David prit la tête du Philistin et l’apporta à Jérusalem[b], et il déposa son équipement[a] dans sa tente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses armes » ou « son matériel ». Le terme hébreu est large et peut désigner des armes, une armure ou d’autres objets d’équipement militaire.
    reason: lexical_alternative
  - marker: b
    text: Certains lecteurs relèvent ici une tension chronologique, puisque Jérusalem n’était pas encore entièrement sous contrôle israélite à ce stade du récit. La traduction conserve la formulation hébraïque sans chercher à l’harmoniser.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח exprime ici simplement l’action de prendre; « prit » convient au récit narratif.
- source_word: רֹאשׁ
  choice: la tête
  rationale: Le sens concret de la partie du corps est clairement visé après la mort du Philistin.
- source_word: הַפְּלִשְׁתִּי
  choice: du Philistin
  rationale: Le gentilé substantivé désigne Goliath; cette formulation est naturelle et précise en français.
- source_word: וַיְבִאֵהוּ
  choice: l’apporta
  rationale: La forme causative de בוא signifie ici « apporter ». Le pronom français reprend naturellement « la tête ».
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: כֵּלָיו
  choice: son équipement
  rationale: כְּלִי est un terme large pouvant englober armes, armure et autres objets militaires. « Équipement » conserve mieux cette étendue sémantique que le seul mot « armes ».
- source_word: שָׂם
  choice: déposa
  rationale: Le verbe שׂים indique le fait de mettre ou placer quelque chose; « déposa » est naturel dans ce contexte et dans un registre narratif digne.
- source_word: בְּאָהֳלוֹ
  choice: dans sa tente
  rationale: אָהֶל désigne normalement une tente. Le possessif français conserve l’absence d’identification explicite du possesseur dans la forme hébraïque.
theological_decisions:
- issue: Référents des suffixes possessifs dans la dernière proposition
  choice: Conserver les possessifs « son » et « sa » sans expliciter leurs référents dans le corps du texte.
  alternative: Traduire explicitement « l’équipement du Philistin dans la tente de David ».
  rationale: Le contexte peut suggérer que l’équipement appartient au Philistin et que la tente est celle de David, mais l’hébreu ne nomme pas les possesseurs. Le français permet de préserver cette ambiguïté réelle.
- issue: Tension chronologique apparente concernant Jérusalem
  choice: Traduire directement « l’apporta à Jérusalem ».
  alternative: Paraphraser « devait plus tard l’apporter à Jérusalem » ou « l’apporta vers Jérusalem ».
  rationale: L’hébreu affirme directement l’action. La traduction ne doit pas résoudre par harmonisation une tension liée au fait que Jérusalem n’était pas encore entièrement sous contrôle israélite à ce stade du récit.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée par « et » suit le mouvement simple du récit hébreu sans introduire de contraste. Les possessifs restent volontairement non explicités afin de préserver l’ambiguïté du texte source.
