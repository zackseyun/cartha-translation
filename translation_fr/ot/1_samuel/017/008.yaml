  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: fr
  text: 'Il se tint et cria aux lignes de bataille d’Israël : « Pourquoi sortez-vous pour vous ranger en ordre de bataille ? Ne suis-je pas, moi, le Philistin, et vous, les esclaves de Saül[a] ? Choisissez-vous un homme, et qu’il descende vers moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les serviteurs de Saül ». Le mot hébreu peut désigner des serviteurs, des sujets ou des esclaves; « esclaves » rend ici la force méprisante de la provocation de Goliath.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Il se tint debout
  rationale: Le verbe עמד décrit ici la posture ferme et publique de Goliath; cette tournure conserve l’idée qu’il prend position sans alourdir le récit.
- source_word: וַיִּקְרָא אֶל מַעַרְכוֹת יִשְׂרָאֵל
  choice: cria aux lignes de bataille d’Israël
  rationale: קרא désigne un appel lancé à forte voix, et מַעֲרָכוֹת les formations militaires rangées; « lignes de bataille » conserve cette image.
- source_word: לָמָּה תֵצְאוּ לַעֲרֹךְ מִלְחָמָה
  choice: Pourquoi sortez-vous pour vous ranger en ordre de bataille ?
  rationale: La formulation garde le mouvement de sortie et le sens militaire de ערך, qui évoque la mise en ordre des combattants.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: Ne suis-je pas, moi, le Philistin
  rationale: L’article défini est conservé; Goliath se présente comme le représentant ou champion philistin. Le pronom tonique rend l’insistance de אָנֹכִי.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: les serviteurs de Saül
  rationale: עֲבָדִים peut désigner des serviteurs, sujets ou esclaves. Ici, « serviteurs » exprime leur subordination politique à Saül, tandis qu’une note signale l’alternative plus dure qui convient aussi à la provocation.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: Choisissez-vous un homme
  rationale: L’impératif signifie choisir ou sélectionner; le masculin singulier אִישׁ est conservé puisqu’il s’agit d’un combattant appelé au duel.
- source_word: וְיֵרֵד אֵלָי
  choice: et qu’il descende vers moi
  rationale: Le jussif qui suit l’impératif est naturellement rendu par « qu’il descende »; « vers moi » préserve la direction exprimée par אֵלַי.
theological_decisions:
- issue: Degré de dépendance exprimé par עֲבָדִים
  choice: serviteurs de Saül
  alternative: esclaves de Saül
  rationale: Le mot hébreu couvre plusieurs formes de dépendance. Le contexte militaire présente les Israélites comme les hommes placés sous l’autorité de Saül, mais la parole de Goliath peut aussi avoir une portée insultante plus forte; la note préserve cette tension lexicale.
- issue: Valeur représentative de הַפְּלִשְׁתִּי
  choice: le Philistin
  alternative: un Philistin
  rationale: L’article hébreu favorise « le Philistin » et souligne que Goliath se pose en champion représentatif face aux hommes de Saül, sans transformer cette nuance en affirmation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours direct conserve le ton provocateur, les images militaires et les répétitions significatives de l’hébreu.
