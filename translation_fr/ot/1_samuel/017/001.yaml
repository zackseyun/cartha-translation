source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: fr
  text: Les Philistins rassemblèrent leurs troupes pour livrer bataille[a]. Ils se réunirent à Soko, qui appartient à Juda[b], et établirent leur camp entre Soko et Azéqa, à Éfès-Dammim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leurs camps » : le terme hébreu peut désigner des camps militaires ou les troupes qui les composent.'
    reason: lexical_alternative
  - marker: b
    text: Soko était une ville du territoire de Juda.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ פְלִשְׁתִּים
  choice: Les Philistins rassemblèrent
  rationale: Le verbe אָסַף exprime ici le rassemblement en vue d’une action militaire. Le passé simple convient au récit suivi en français soutenu mais accessible.
- source_word: מַחֲנֵיהֶם
  choice: leurs troupes
  rationale: מַחֲנֶה peut désigner un camp ou, par métonymie, les forces qui y sont réunies. Avec « pour livrer bataille », « troupes » rend naturellement le sens militaire sans imposer l’idée d’armées nationales distinctes.
- source_word: לַמִּלְחָמָה
  choice: pour livrer bataille
  rationale: מִלְחָמָה peut signifier « guerre » ou « bataille »; dans cette scène de déploiement local, cette expression est idiomatique et précise.
- source_word: וַיֵּאָסְפוּ
  choice: Ils se réunirent
  rationale: La variation française évite la répétition immédiate de « rassemblèrent » tout en conservant le même noyau sémantique.
- source_word: שֹׂכֹה
  choice: Soko
  rationale: Translittération française lisible du toponyme hébreu שֹׂכֹה.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: qui appartient à Juda
  rationale: La construction avec לְ indique ici l’appartenance territoriale à Juda, plutôt qu’une simple localisation générale.
- source_word: וַיַּחֲנוּ
  choice: établirent leur camp
  rationale: Cette formulation française naturelle traduit clairement le verbe חנה, « camper ».
- source_word: בֵּין ... וּבֵין
  choice: entre ... et
  rationale: Rendu spatial direct de la construction corrélative hébraïque.
- source_word: עֲזֵקָה
  choice: Azéqa
  rationale: Translittération adaptée aux conventions et à la prononciation françaises.
- source_word: בְּאֶפֶס דַּמִּים
  choice: à Éfès-Dammim
  rationale: L’expression est comprise comme un nom de lieu; la préposition « à » convient à l’emplacement d’un campement.
theological_decisions: []
