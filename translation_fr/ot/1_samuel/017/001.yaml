  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique littéraire sans archaïsmes. Les noms propres sont francisés de manière cohérente. La répétition hébraïque du verbe « rassembler » est légèrement variée pour produire une phrase naturelle, sans modifier la progression du récit.
