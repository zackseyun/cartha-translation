base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: fr
  text: 'Jessé dit à David, son fils : « Prends, je te prie, pour tes frères cet épha[a] de grain grillé[b] et ces dix pains, et cours au camp, auprès de tes frères. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha était une ancienne mesure de capacité pour les matières sèches, équivalant approximativement à 22 litres.
    reason: cultural_note
  - marker: b
    text: Ou « grain torréfié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: Prends, je te prie
  rationale: L’impératif accompagné de נָא exprime une demande pressante tout en adoucissant l’ordre. « Je te prie » conserve cette nuance dans un français digne et naturel.
- source_word: לְאַחֶיךָ
  choice: pour tes frères / vers tes frères
  rationale: La préposition ל désigne d’abord les bénéficiaires des provisions, puis la destination du déplacement. Le français demande naturellement « pour » dans le premier cas et « vers » dans le second.
- source_word: אֵיפַת
  choice: cet épha de
  rationale: L’épha est une ancienne mesure de capacité pour les matières sèches. Conserver le terme ancien préserve la précision culturelle du texte, avec une note explicative.
- source_word: הַקָּלִיא
  choice: grain grillé
  rationale: Le nom désigne du grain préparé par exposition à la chaleur, grillé ou torréfié. « Grain grillé » est clair en français moderne.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: et ces dix pains
  rationale: לֶחֶם peut désigner le pain en général, mais, avec le nombre dix dans ce contexte de provisions, « dix pains » est concret et idiomatique.
- source_word: וְהָרֵץ
  choice: et cours
  rationale: L’impératif causatif de רוץ transmet ici l’idée d’un déplacement rapide. « Cours » conserve la vivacité de l’hébreu sans la réduire au sens plus abstrait de « dépêche-toi ».
- source_word: הַמַּחֲנֶה
  choice: le camp
  rationale: Dans ce contexte militaire, « le camp » est la traduction française naturelle et précise.
- source_word: בְּנוֹ
  choice: son fils
  rationale: L’expression appositive présente David selon son lien avec Jessé. « Son fils » rend simplement cette relation.
theological_decisions: []
