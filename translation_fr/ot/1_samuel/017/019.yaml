  text: וְ/שָׁא֤וּל וְ/הֵ֨מָּה֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל בְּ/עֵ֖מֶק הָֽאֵלָ֑ה נִלְחָמִ֖ים עִם פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/019.yaml
  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: fr
  text: Saül, eux et tous les hommes d’Israël se trouvaient dans la vallée d’Éla et combattaient les Philistins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « combattaient avec les Philistins ». Dans un contexte de guerre, la préposition hébraïque traduite par « avec » peut désigner l’adversaire affronté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל וְ/הֵמָּה
  choice: Saül, eux
  rationale: La coordination conserve le pronom indépendant explicite הֵמָּה, qui renvoie aux personnes mentionnées dans le contexte, sans remplacer ce pronom par une identification interprétative.
- source_word: וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: et tous les hommes d’Israël
  rationale: Cette formulation française naturelle rend le collectif distributif כָל אִישׁ et désigne ici les hommes engagés dans l’armée d’Israël.
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: dans la vallée d’Éla
  rationale: עֵמֶק désigne une vallée ; Éla est la transcription française usuelle du nom de lieu.
- source_word: נִלְחָמִים
  choice: se trouvaient … et combattaient
  rationale: Le participe exprime une action en cours. « Se trouvaient » rend naturellement la localisation implicite de la proposition nominale, tandis que « combattaient » conserve l’aspect duratif.
- source_word: עִם פְּלִשְׁתִּים
  choice: combattaient les Philistins
  rationale: עִם signifie littéralement « avec », mais, avec le verbe de combat, il marque ici l’engagement hostile. La construction française directe exprime clairement l’affrontement, tandis que la note conserve la forme littérale.
