  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: fr
  text: David était le plus jeune[a], et les trois aînés étaient partis à la suite de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et David était le plus jeune, et les trois aînés partirent à la suite de Saül. » La conjonction hébraïque peut se traduire simplement par « et », et le verbe peut être rendu sans plus-que-parfait.'
    reason: Variante de traduction liée à la valeur du connecteur narratif et au rapport temporel du verbe hébreu.
lexical_decisions:
- source_word: וְ/דָוִד
  choice: David
  rationale: Le וְ relie la phrase au récit, mais le français n’exige pas ici un « Et » initial. Sa valeur conjonctive reste perceptible dans la continuité du contexte; l’autre possibilité est signalée en note.
- source_word: הוּא
  choice: était
  rationale: Le pronom indépendant souligne légèrement David en hébreu (« David, lui… »), mais le français naturel exprime ici l’identification par la copule sans reprendre « lui ».
- source_word: הַ/קָּטָן
  choice: le plus jeune
  rationale: Littéralement « le petit/jeune », l’expression désigne, dans cette comparaison entre frères, le plus jeune.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: et les trois aînés
  rationale: Dans le cadre familial, הַגְּדֹלִים désigne les frères plus âgés, ici les trois aînés déjà mentionnés.
- source_word: הָלְכוּ אַחֲרֵי
  choice: étaient partis à la suite de
  rationale: L’expression signifie littéralement « aller derrière/après » et peut évoquer à la fois le déplacement et le fait de suivre Saül. Le plus-que-parfait présente naturellement cette action comme antérieure à l’explication concernant David, sans exclure la lecture narrative plus directe donnée en note.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et courante du nom propre biblique.
