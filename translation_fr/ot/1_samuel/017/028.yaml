source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: fr
  text: 'Éliab, son frère aîné, l’entendit parler aux hommes. Alors la colère d’Éliab s’enflamma contre David, et il dit : « Pourquoi es-tu descendu ici ? À qui as-tu laissé ces quelques brebis dans le désert ? Moi, je connais ton arrogance[a] et la méchanceté de ton cœur[b] ! C’est pour voir la bataille que tu es descendu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : ta présomption ; ou : ton insolence.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : le mal qui est dans ton cœur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַבְּרוֹ אֶל־הָאֲנָשִׁים
  choice: l’entendit parler aux hommes
  rationale: La construction à l’infinitif exprime l’action de David en cours lorsque son frère l’entend. « Les hommes » conserve le terme général du texte hébreu sans préciser « soldats ».
- source_word: וַיִּחַר אַף
  choice: la colère … s’enflamma
  rationale: Cette formulation garde l’image hébraïque vive d’une colère qui brûle, dans un français naturel.
- source_word: לָמָּה זֶּה יָרַדְתָּ
  choice: Pourquoi es-tu descendu ici ?
  rationale: « Descendre » traduit directement le verbe, tandis que « ici » restitue naturellement la force contextuelle de זֶה.
- source_word: וְעַל־מִי נָטַשְׁתָּ
  choice: À qui as-tu laissé
  rationale: Dans ce contexte pastoral, David a laissé le troupeau à la garde de quelqu’un. Cette traduction évite de renforcer indûment le verbe en « abandonner ».
- source_word: מְעַט הַצֹּאן הָהֵנָּה
  choice: ces quelques brebis
  rationale: « Quelques » exprime le petit nombre et laisse percevoir le ton dédaigneux d’Éliab; le démonstratif est conservé par « ces ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est la traduction biblique courante de מִדְבָּר, qui peut désigner une région inculte servant de pâturage.
- source_word: זְדֹנְךָ
  choice: ton arrogance
  rationale: Le nom désigne l’orgueil présomptueux ou l’insolence. « Arrogance » est courant et convient au reproche d’Éliab, tandis que les nuances voisines sont signalées en note.
- source_word: רֹעַ לְבָבֶךָ
  choice: la méchanceté de ton cœur
  rationale: La formulation exprime le mal moral attribué à la personne intérieure et demeure claire en français moderne.
- source_word: אֲנִי יָדַעְתִּי
  choice: Moi, je connais
  rationale: Le pronom indépendant אֲנִי est emphatique; la dislocation « Moi, je » en rend l’insistance accusatrice.
- source_word: לְמַעַן רְאוֹת הַמִּלְחָמָה
  choice: C’est pour voir la bataille
  rationale: La tournure clivée rend clairement le but et l’insistance accusatrice sans ajouter l’idée non explicite de « seulement ».
theological_decisions:
- issue: Statut moral du jugement porté sur David
  choice: Présenter les paroles comme l’accusation d’Éliab, sans confirmer qu’elles décrivent réellement les intentions de David.
  alternative: Reformuler le reproche comme un constat objectif sur le caractère de David.
  rationale: Le verset rapporte le jugement d’Éliab dans un dialogue; la traduction ne doit ni le valider ni l’atténuer au-delà du texte.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le discours direct conserve la vigueur du reproche d’Éliab, notamment par « Moi, je » et la tournure « C’est pour… », sans ajouter d’explication psychologique.
