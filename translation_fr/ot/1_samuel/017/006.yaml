  yaml_path: translation/ot/1_samuel/017/006.yaml
  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
translation:
  language: fr
  text: Il avait aux jambes des jambières de bronze et un javelot[a] de bronze entre les épaules.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lance » ; le terme hébreu peut désigner une arme légère semblable à une lance. Certains y voient un autre type d’arme, mais « javelot » convient le mieux ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: jambières
  rationale: Le terme désigne une pièce d’armure protégeant le bas des jambes. « Jambières » est précis, naturel en français et adapté au contexte militaire ancien.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans cet ancien contexte militaire, le mot désigne vraisemblablement le bronze employé pour les armes et les armures ; « laiton » serait anachronique et « cuivre » moins probable ici.
- source_word: עַל רַגְלָיו
  choice: aux jambes
  rationale: רֶגֶל peut désigner le pied ou la jambe, mais la présence de jambières impose ici le sens de « jambes ».
- source_word: כִידוֹן
  choice: javelot
  rationale: Le mot désigne probablement une arme légère apparentée à la lance, distincte de la grande lance mentionnée plus loin dans le récit. « Javelot » convient au contexte tout en laissant l’alternative en note.
- source_word: בֵּין כְּתֵפָיו
  choice: entre les épaules
  rationale: Cette traduction conserve l’image exacte et la légère ambiguïté de l’hébreu sans ajouter que l’arme était attachée ou portée en bandoulière.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation « entre les épaules » reste volontairement proche de l’hébreu et n’explicite pas un mode de port que le texte ne précise pas.
