  terminology: « Tenue de combat » convient dans le contexte militaire pour לְמַדָּיו, tout en laissant la note signaler la portée plus large du terme. « Essayer » préserve utilement la répétition de נסה sans imposer l’interprétation « être habitué ». Les noms et termes ne soulèvent pas de difficulté.
