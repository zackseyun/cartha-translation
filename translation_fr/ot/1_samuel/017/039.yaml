base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: fr
  text: 'David ceignit son épée par-dessus sa tenue de combat[a] et essaya d’avancer[b], car il n’avait pas essayé cet équipement[c]. Mais David dit à Saül : « Je ne peux pas avancer avec tout cela, car je ne l’ai pas essayé. » Alors David enleva tout cet équipement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner des vêtements ou une tenue ; dans ce contexte, il s’agit de l’équipement militaire dont Saül vient de revêtir David.
    reason: lexical_alternative
  - marker: b
    text: Ou « entreprit d’avancer » ; l’expression hébraïque peut indiquer qu’il se mit à avancer ou qu’il tenta de le faire.
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe hébreu signifie mettre à l’épreuve par l’usage ou l’expérience ; on pourrait aussi comprendre : « car il n’y était pas habitué ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: ceignit
  rationale: Le verbe חגר désigne l’action de ceindre ou d’attacher une arme. « Ceignit son épée » est précis, idiomatique et convient au registre narratif.
- source_word: חַרְבּוֹ
  choice: son épée
  rationale: Correspondance directe avec חֶרֶב et son suffixe possessif masculin singulier.
- source_word: מֵעַל לְמַדָּיו
  choice: par-dessus sa tenue de combat
  rationale: לְמַדִּים peut désigner des vêtements ou une tenue; le contexte militaire immédiat justifie « tenue de combat » sans réduire nécessairement le terme à la seule armure.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: essaya de marcher
  rationale: La construction יאל avec l’infinitif peut exprimer le fait d’entreprendre, de consentir ou de se risquer à une action. Ici, elle décrit naturellement la tentative de David de se déplacer avec cet équipement.
- source_word: כִּי לֹא נִסָּה
  choice: car il n’avait jamais essayé cet équipement
  rationale: Au piel, נסה signifie mettre à l’épreuve ou essayer. L’objet, implicite en hébreu, est explicité en français afin d’éviter une phrase obscure.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: Je ne peux pas marcher avec tout cela
  rationale: « Marcher » rend ici le déplacement concret que l’équipement entrave; « tout cela » reprend naturellement l’ensemble des pièces dont David vient d’être équipé.
- source_word: לֹא נִסִּיתִי
  choice: je ne l’ai jamais essayé
  rationale: La répétition du même verbe hébreu est conservée par « essayer ». Le pronom singulier reprend collectivement « tout cela ».
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: David enleva tout cet équipement
  rationale: Cette formulation française naturelle exprime clairement l’action de retirer de sur soi l’ensemble précédemment mentionné.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Ceignit » conserve la précision concrète de l’action sans archaïsme excessif; le reste de la formulation demeure immédiatement accessible. La répétition d’« essayer » reflète celle du verbe hébreu, tandis que les notes préservent ses nuances expérientielles et l’ambiguïté de וַיֹּאֶל.
