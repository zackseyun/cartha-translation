  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: fr
  text: 'David dit alors au Philistin : « Tu viens à moi avec une épée, une lance et un javelot ; mais moi, je viens à toi au nom de Yahweh des armées, le Dieu des lignes de bataille d’Israël[b], que tu as défié[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou : « le Dieu des troupes rangées d’Israël » ; le terme hébreu évoque des forces disposées en lignes de bataille.'
    reason: lexical_alternative
  - marker: c
    text: 'Le relatif hébreu peut aussi se rapporter aux lignes de bataille d’Israël : « que tu as insultées » ou « que tu as provoquées ». Le verbe peut signifier « outrager », « insulter » ou « provoquer avec mépris ».'
    reason: ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le wayyiqtol fait progresser le récit ; « dit alors » restitue naturellement cette succession en français moderne.
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: Le nom désigne Goliath par son appartenance ethnique, sans ajouter ici la notion de guerrier.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: viens à moi / viens à toi
  rationale: Les participes expriment l’action présente ou imminente ; le contexte suffit à en faire comprendre le caractère hostile.
- source_word: בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן
  choice: avec une épée, une lance et un javelot
  rationale: La préposition marque ici le moyen ; « javelot » distingue clairement כִידוֹן de la lance חֲנִית.
- source_word: בְּשֵׁם
  choice: au nom de
  rationale: Cette expression conserve l’idée d’autorité, de représentation et d’appui attachée à l’idiome hébreu.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, tandis que צְבָאוֹת est rendu par un terme immédiatement compréhensible qui conserve la portée militaire et souveraine du titre.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: le Dieu des lignes de bataille d’Israël
  rationale: מַעַרְכוֹת désigne des forces disposées en ordre de bataille. Cette traduction préserve cette image précise plutôt que de la réduire au terme plus général « armées ».
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: que tu as défié
  rationale: Dans ce contexte, חרף exprime une provocation méprisante. « Défier » en restitue la force conflictuelle, tandis qu’une note signale les nuances et l’ambiguïté de l’antécédent.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme tel au lieu de lui substituer un titre.
- issue: Sens du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le Seigneur des armées / Yahweh des puissances
  rationale: « Des armées » rend directement צְבָאוֹת et maintient la dimension martiale particulièrement pertinente dans cette scène.
- issue: Antécédent de אֲשֶׁר dans אֲשֶׁר חֵרַפְתָּ
  choice: Dieu, dans le texte principal
  alternative: les lignes de bataille d’Israël
  rationale: La formulation peut présenter l’affront fait aux troupes d’Israël comme un défi lancé à leur Dieu. Puisque l’hébreu ne marque pas le genre ou le nombre du relatif אֲשֶׁר, l’autre rattachement demeure possible et est conservé en note.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure antithétique « Tu viens… mais moi, je viens… » et la triple énumération des armes sont maintenues. Le point-virgule allège la longue phrase tout en conservant sa solennité.
