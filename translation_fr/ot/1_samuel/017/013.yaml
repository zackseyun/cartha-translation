source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: fr
  text: 'Les trois fils aînés de Jessé étaient partis à la suite de Saül[a] pour combattre. Voici les noms de ses trois fils qui étaient partis au combat : Éliab, le premier-né, Abinadab, le deuxième, et Shamma, le troisième.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « derrière Saül » et peut aussi se comprendre « en suivant Saül ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: étaient partis
  rationale: Le plus-que-parfait présente naturellement en français cette information d’arrière-plan, tandis que la répétition verbale hébraïque est allégée sans perte de sens.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: les trois fils aînés de Jessé
  rationale: Dans ce contexte familial, הַגְּדֹלִים indique l’âge ou le rang d’aînesse, non la taille ou l’importance sociale.
- source_word: אַחֲרֵי שָׁאוּל
  choice: à la suite de Saül
  rationale: Cette expression française conserve l’image de quelqu’un qui va derrière un chef tout en pouvant évoquer le fait de le suivre.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: pour combattre / au combat
  rationale: מִלְחָמָה peut désigner la guerre ou le combat. Dans cette scène militaire précise, ces formulations sont naturelles et évitent une répétition pesante.
- source_word: וְשֵׁם
  choice: Voici les noms
  rationale: Bien que שֵׁם soit formellement au singulier, l’expression introduit une liste de plusieurs noms; le pluriel est idiomatique en français.
- source_word: בָּנָיו
  choice: ses trois fils
  rationale: Le possessif renvoie à Jessé, comme dans le texte hébreu.
- source_word: הַבְּכוֹר
  choice: le premier-né
  rationale: בְּכוֹר désigne précisément le statut de premier-né, et pas seulement le fils le plus âgé.
- source_word: וּמִשְׁנֵהוּ
  choice: le deuxième
  rationale: Le terme situe Abinadab au deuxième rang dans la succession des frères; cette formulation est claire et naturelle en français.
- source_word: וְהַשְּׁלִשִׁי
  choice: et Shamma, le troisième
  rationale: La formulation maintient la séquence ordinale explicite du texte hébreu.
theological_decisions: []
