  text: וְ/דָוִד֩ בֶּן אִ֨ישׁ אֶפְרָתִ֜י הַ/זֶּ֗ה מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וּ/שְׁמ֣/וֹ יִשַׁ֔י וְ/ל֖/וֹ שְׁמֹנָ֣ה בָנִ֑ים וְ/הָ/אִישׁ֙ בִּ/ימֵ֣י שָׁא֔וּל זָקֵ֖ן בָּ֥א בַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: fr
  text: David était le fils de cet Éphrathien de Bethléem en Juda, qui s’appelait Jessé. Celui-ci avait huit fils. À l’époque de Saül, cet homme était vieux, avancé en âge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est inhabituelle; littéralement : « vieux, venu parmi les hommes » ou « vieux, entré parmi les hommes ».'
    reason: Conserver l’opacité de l’expression source tout en donnant dans le texte son sens probable relatif au grand âge.
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: Éphrathien
  rationale: Dans ce contexte lié à Bethléem en Juda, le terme désigne un habitant d’Éphrata/Bethléem et non un membre de la tribu d’Éphraïm. « Éphrathien » conserve la désignation géographique.
- source_word: הַזֶּה
  choice: cet
  rationale: Le démonstratif hébreu est explicite et se rapporte à l’Éphrathien; il est donc conservé.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Bethléem en Juda
  rationale: Cette formulation française naturelle indique l’origine géographique et distingue cette ville des autres localités nommées Bethléem.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: nommé Jessé
  rationale: Rend naturellement en français la proposition coordonnée hébraïque qui identifie l’homme.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: Celui-ci avait huit fils
  rationale: Rend idiomatiquement la construction possessive hébraïque tout en indiquant clairement que le sujet est Jessé.
- source_word: בִּימֵי שָׁאוּל
  choice: À l’époque de Saül
  rationale: Équivalent français actuel et naturel de l’expression temporelle hébraïque.
- source_word: זָקֵן
  choice: était vieux
  rationale: Traduction directe du terme désignant l’âge avancé.
- source_word: בָּא בַאֲנָשִׁים
  choice: avancé en âge
  rationale: L’expression hébraïque est inhabituelle et probablement idiomatique. Le texte principal en donne le sens probable, tandis que la note conserve sa formulation littérale énigmatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La légère redondance « vieux, avancé en âge » reflète les deux éléments de l’hébreu. Le marqueur de note est placé après l’expression qu’il explique.
