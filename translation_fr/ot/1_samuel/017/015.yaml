  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: fr
  text: David faisait des allers-retours entre Saül et Bethléem pour garder le troupeau de son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « David allait et revenait d’auprès de Saül pour faire paître le troupeau de son père à Bethléem. »'
    reason: La note conserve la formulation verbale hébraïque ainsi que la relation explicite avec Saül, tout en indiquant par « allait et revenait » le caractère répété des déplacements.
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: allait … puis revenait
  rationale: L’imparfait et les deux verbes coordonnés rendent le mouvement habituel ou répété exprimé par la construction hébraïque, tout en restant naturels en français.
- source_word: מֵעַל שָׁאוּל
  choice: auprès de Saül, puis revenait
  rationale: מֵעַל indique ici l’éloignement de la présence ou du service de Saül. La formulation française répartit naturellement cette relation sur les deux mouvements sans suggérer que David revenait de dessus Saül.
- source_word: לִרְעוֹת
  choice: garder
  rationale: Dans le contexte d’un troupeau, garder exprime naturellement l’activité du berger. « Faire paître » est plus formel et figure dans la note.
- source_word: צֹאן
  choice: troupeau
  rationale: Le nom collectif peut désigner le petit bétail, notamment les moutons et les chèvres; « troupeau » préserve cette portée sans la réduire aux seuls moutons.
- source_word: אָבִיו
  choice: de son père
  rationale: Cette tournure possessive est idiomatique en français et correspond au syntagme construit hébreu.
- source_word: בֵּית לָחֶם
  choice: Bethléem
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: וְ
  choice: absence de connecteur explicite
  rationale: Le waw relie la proposition au récit, mais le français n’exige pas ici un « et » initial; aucun adverbe temporel tel que « maintenant » n’est ajouté.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits indiquent une pratique répétée. « Auprès de Saül » convient mieux que « chez Saül », qui pourrait évoquer seulement son domicile. La formulation principale explicite naturellement les deux directions du déplacement, tandis que la note préserve la structure hébraïque plus formelle.
