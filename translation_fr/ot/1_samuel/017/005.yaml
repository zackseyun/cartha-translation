base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: fr
  text: Il avait sur la tête un casque de bronze et était revêtu d’une armure à écailles[a]. Le poids de cette armure était de cinq mille sicles de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On traduit parfois « cotte de mailles ». L’hébreu décrit plus précisément une armure faite de pièces superposées comme des écailles.
    reason: lexical_alternative
  - marker: b
    text: Cinq mille sicles correspondent approximativement à 57 kilogrammes.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: casque
  rationale: Dans ce contexte militaire, le mot désigne une protection de tête. « Casque » est l’équivalent français moderne le plus clair.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou un alliage cuivreux. Pour un équipement militaire de cette époque, « bronze » est le rendu conventionnel et contextuellement probable.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: armure à écailles
  rationale: L’expression désigne une armure corporelle constituée de pièces superposées comme des écailles. Ce rendu est précis et évite l’expression « cotte de mailles », qui évoque généralement des anneaux entrelacés.
- source_word: הוּא לָבוּשׁ
  choice: était revêtu de
  rationale: Cette formulation conserve la valeur stative de l’hébreu tout en restant naturelle et digne en français.
- source_word: מִשְׁקַל
  choice: poids
  rationale: « Poids » est le terme français courant et adapté à la description d’une mesure de lourdeur.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: cinq mille sicles
  rationale: Le texte principal conserve l’unité antique. Une équivalence moderne approximative est donnée en note.
