base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: fr
  text: 'Le Philistin dit à David : « Suis-je un chien, pour que tu viennes à moi avec des bâtons[a] ? » Puis le Philistin maudit David par ses dieux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec des verges » ou « avec des bâtons ». Le terme hébreu peut désigner des bâtons, des verges ou des staffs ; dans cette question rhétorique, il participe au ton méprisant du Philistin.'
    reason: alternative lexicale
  - marker: b
    text: 'Ou : « au nom de ses dieux ». La préposition hébraïque peut exprimer le moyen ou l’invocation.'
    reason: autre formulation de la préposition
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: Le nom désigne Goliath par son appartenance ethnique. Cette formulation sobre suit le style narratif sans ajouter « guerrier ».
- source_word: הֲכֶלֶב אָנֹכִי
  choice: Suis-je un chien
  rationale: La question rhétorique exprime l’indignation et le mépris. L’image du chien est conservée, car elle est importante dans le récit.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette question rhétorique, la conjonction introduit le fait qui provoque l’indignation. « Pour que » donne en français une articulation naturelle sans effacer la nuance de motif ou de conséquence.
- source_word: בָא אֵלַי
  choice: tu viennes contre moi
  rationale: Le participe décrit l’action présente. Dans le contexte d’un affrontement, « contre moi » rend naturellement la direction hostile exprimée par אֵלַי.
- source_word: בַּמַּקְלוֹת
  choice: avec des bâtons
  rationale: מַקֵּל peut désigner un bâton, une verge ou un bâton de marche. Le pluriel et le terme courant « bâtons » préservent le ton méprisant du Philistin.
- source_word: וַיְקַלֵּל
  choice: maudit
  rationale: Le verbe désigne ici l’invocation d’une malédiction, et non une simple insulte.
- source_word: בֵּאלֹהָיו
  choice: par ses dieux
  rationale: 'La préposition ב peut être instrumentale : le Philistin invoque ses divinités pour maudire David. Le pluriel convient au contexte philistin, tout en laissant l’autre analyse grammaticale en note.'
theological_decisions:
- issue: Nombre de אֱלֹהִים avec le suffixe masculin singulier dans un contexte philistin
  choice: ses dieux
  alternative: son dieu
  rationale: La forme אֱלֹהִים peut être comprise comme un pluriel ou comme un singulier selon le contexte. Le pluriel est le plus naturel ici dans le contexte religieux philistin, mais la possibilité du singulier est signalée afin de ne pas supprimer l’ambiguïté réelle.
- issue: Valeur de la préposition ב dans בֵּאלֹהָיו
  choice: par ses dieux
  alternative: au nom de ses dieux
  rationale: « Par » conserve de façon concise la valeur instrumentale ou associative de la préposition. « Au nom de » explicite davantage l’acte d’invocation et est donc proposé en note.
translation_notes:
  register: Français international moderne, direct et digne. La question conserve sa force insultante sans devenir familière. « Puis » marque naturellement la progression narrative du second וַ־.
