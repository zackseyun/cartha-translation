  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: fr
  text: Alors un champion[a] sortit des camps des Philistins. Il s’appelait Goliath et venait de Gath. Il mesurait six coudées et un empan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « un homme de l’entre-deux », probablement un combattant qui s’avançait entre les lignes pour représenter son armée.
    reason: lexical_alternative
  - marker: b
    text: Six coudées et un empan correspondent à environ 3 mètres, selon la longueur de la coudée retenue.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: un champion
  rationale: L’expression signifie littéralement « homme de l’entre-deux » et désigne probablement le combattant qui s’avance entre les lignes pour représenter son camp. « Champion » rend clairement cette fonction en français.
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe indique que le combattant sort des positions philistines et s’avance sur le terrain entre les armées.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: des camps des Philistins
  rationale: Le pluriel « camps » est conservé conformément au texte massorétique.
- source_word: גָּלְיָת שְׁמוֹ מִגַּת
  choice: Il s’appelait Goliath et venait de Gath
  rationale: Cette formulation française naturelle conserve à la fois le nom du personnage et son lieu d’origine.
- source_word: גָּבְהוֹ שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: Il mesurait six coudées et un empan
  rationale: Les unités anciennes sont maintenues dans le texte; une équivalence moderne approximative est donnée en note.
