base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: fr
  text: Il prit son bâton en main, choisit pour lui-même cinq pierres lisses du torrent[a] et les mit dans son sac de berger, dans la besace[b]. Sa fronde à la main, il s’avança vers le Philistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le lit du torrent » ou « dans l’oued ». Le mot hébreu נַחַל peut désigner un cours d’eau, un ravin ou le lit, parfois saisonnier, où il coule.
    reason: lexical_alternative
  - marker: b
    text: Ou « petit sac ». Le mot hébreu יַלְקוּט désigne une besace ou un petit sac servant à transporter des objets.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: son bâton
  rationale: מַקֵּל désigne couramment un bâton ou une canne. « Bâton » convient naturellement au contexte pastoral sans suggérer un objet cérémoniel.
- source_word: וַיִּבְחַר לוֹ
  choice: choisit pour lui
  rationale: Le complément לוֹ marque que David fait lui-même ce choix en vue de son propre usage. La formulation conserve cette nuance sans alourdir la phrase.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: cinq pierres lisses
  rationale: חַלֻּקֵי qualifie ici des pierres rendues lisses, vraisemblablement par l’eau. « Pierres lisses » est précis et idiomatique.
- source_word: מִן הַנַּחַל
  choice: dans le torrent
  rationale: נַחַל peut désigner un torrent, son lit ou un cours d’eau saisonnier. « Torrent » est clair en français moderne et convient au paysage évoqué, tandis qu’une note préserve l’étendue du terme.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ וּבַיַּלְקוּט
  choice: dans son sac de berger, dans la besace
  rationale: כְּלִי est un terme général pour un objet ou récipient, précisé ici par יַלְקוּט, un petit sac. La traduction garde le mouvement du général au particulier et rattache naturellement l’objet à David.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: Sa fronde à la main
  rationale: La proposition hébraïque est sans verbe. Cette tournure française conserve sa brièveté et l’image concrète sans ajouter inutilement « était ».
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: il s’avança vers le Philistin
  rationale: נגשׁ exprime l’idée de s’approcher. « S’avança vers » rend ici le mouvement volontaire dans un français narratif naturel.
