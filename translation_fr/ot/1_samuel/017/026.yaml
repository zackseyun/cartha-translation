base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: fr
  text: 'David demanda aux hommes qui se tenaient avec lui : « Que fera-t-on pour l’homme qui abattra ce Philistin et ôtera l’opprobre d’Israël ? Car qui est-il, ce Philistin incirconcis, lui qui a défié les lignes de bataille du Dieu vivant ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: abattra
  rationale: Dans ce contexte de combat singulier, le verbe signifie frapper jusqu’à vaincre ou tuer; « abattra » exprime naturellement cette portée sans alourdir la phrase.
- source_word: חֶרְפָּה
  choice: la honte qui pèse sur Israël
  rationale: Le nom désigne l’opprobre, l’humiliation ou la honte. L’ajout idiomatique « qui pèse sur » rend la construction מֵעַל, littéralement « de dessus Israël ».
- source_word: הֶעָרֵל
  choice: incirconcis
  rationale: Conserve le terme identitaire et religieux explicite du texte hébreu, ici employé avec mépris.
- source_word: מַעַרְכוֹת
  choice: les lignes de bataille
  rationale: Le pluriel désigne les rangs ou formations militaires déployés; cette formulation conserve l’image collective du texte.
- source_word: אֱלֹהִים חַיִּים
  choice: du Dieu vivant
  rationale: Rend l’expression hébraïque idiomatiquement en français tout en préservant son contraste théologique implicite avec les dieux sans vie.
theological_decisions:
- issue: Portée de l’expression « Philistin incirconcis »
  choice: Maintien littéral de « incirconcis »
  alternative: « païen philistin » ou omission du qualificatif
  rationale: Le texte met explicitement en contraste l’appartenance du Philistin et celle du peuple allié au Dieu vivant; une paraphrase ou une omission effacerait cette tension.
- issue: Valeur de כִּי avant חֵרֵף
  choice: « pour avoir défié »
  alternative: « puisqu’il a défié » ou « pour qu’il défie »
  rationale: Dans cette question rhétorique, la tournure française exprime naturellement le motif de l’indignation de David, sans transformer le propos en simple identification.
- issue: Aspect de חֵרֵף
  choice: « avoir défié »
  alternative: « défie »
  rationale: La forme hébraïque présente l’acte comme accompli; l’infinitif passé français en conserve la valeur dans la question rhétorique.
translation_notes:
  register: Français moderne, digne et oralement fluide. « Que fera-t-on » préserve la forme passive indéfinie de l’hébreu. La reprise disloquée « qui est-il, ce Philistin incirconcis » restitue l’insistance méprisante de l’ordre hébreu sans introduire d’explication doctrinale.
