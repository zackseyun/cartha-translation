  text: וַ/יַּשְׁכֵּ֨ם דָּוִ֜ד בַּ/בֹּ֗קֶר וַ/יִּטֹּ֤שׁ אֶת הַ/צֹּאן֙ עַל שֹׁמֵ֔ר וַ/יִּשָּׂ֣א וַ/יֵּ֔לֶךְ כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יִשָׁ֑י וַ/יָּבֹא֙ הַ/מַּעְגָּ֔לָ/ה וְ/הַ/חַ֗יִל הַ/יֹּצֵא֙ אֶל הַ/מַּ֣עֲרָכָ֔ה וְ/הֵרֵ֖עוּ בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: fr
  text: David se leva de bon matin, laissa le troupeau à la garde d’un gardien, prit les provisions et partit, comme Jessé le lui avait ordonné. Il arriva au campement[a] au moment où l’armée sortait vers les lignes de bataille en poussant le cri de guerre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au cercle du camp » ou « à l’enceinte de chariots » ; le terme hébreu peut désigner plus précisément la disposition circulaire du camp ou son périmètre défensif.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et ils poussèrent des cris dans/pour la bataille ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: David se leva donc de bon matin
  rationale: « Se lever de bon matin » rend naturellement le verbe exprimant une action matinale et conserve l’idée de promptitude; « donc » reprend la continuité narrative de וַ.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: laissa les moutons à la garde d’un berger
  rationale: La tournure exprime que David laisse le troupeau sous la responsabilité de quelqu’un. « Berger » convient au contexte pastoral et reste plus naturel ici que « gardien ».
- source_word: וַיִּשָּׂא
  choice: prit les provisions
  rationale: Le verbe signifie littéralement « souleva/emporta »; son objet implicite est fourni par les provisions mentionnées au verset précédent. L’explicitation évite une phrase française obscure.
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: « Partit » exprime clairement la mise en route dans cette suite narrative.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: comme Jessé le lui avait ordonné
  rationale: Cette formulation conserve le sens précis de צוה, « ordonner », ainsi que l’antériorité naturelle de l’ordre en français.
- source_word: הַמַּעְגָּלָה
  choice: le campement
  rationale: Le terme désigne ici l’aire du camp, peut-être sa formation circulaire ou son enceinte défensive. « Campement » est clair dans le texte, et les nuances concrètes sont conservées en note.
- source_word: הַחַיִל
  choice: l’armée
  rationale: Dans ce contexte militaire, le mot désigne l’ensemble des forces combattantes.
- source_word: הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: sortait pour se mettre en ligne de bataille
  rationale: Le participe décrit l’action en cours au moment de l’arrivée de David; מַעֲרָכָה évoque l’ordre ou la ligne de bataille.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: en poussant le cri de guerre
  rationale: Le hiphil de רוע désigne ici un grand cri collectif lié au combat. La formulation française restitue directement sa portée militaire.
