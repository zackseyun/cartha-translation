base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: fr
  text: Lorsque David revint après avoir abattu le Philistin, Abner le prit et l’amena devant Saül, tandis que la tête du Philistin était dans sa main[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et la tête du Philistin était dans sa main ». L’hébreu emploie une proposition sans verbe qui peut être comprise comme une proposition coordonnée ou comme l’indication d’une circonstance. Le possessif peut grammaticalement renvoyer à David ou à Abner ; le contexte désigne probablement David.'
    reason: ambiguïté syntaxique et référentielle
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: Lorsque David revint
  rationale: La conjonction suivie de l’infinitif construit de שׁוב introduit une proposition temporelle. « Lorsque … revint » rend naturellement cette relation en français.
- source_word: מֵהַכּוֹת
  choice: après avoir abattu
  rationale: נכה signifie ici frapper à mort. « Abattu » conserve la force concrète du verbe tout en exprimant naturellement l’issue fatale dans ce contexte.
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: Le texte hébreu emploie le titre ethnique, non le nom Goliath ni l’expression « champion philistin ».
- source_word: וַיִּקַּח אֹתוֹ
  choice: Abner le prit
  rationale: לקח signifie simplement « prendre » ici. Cette formulation n’ajoute ni violence ni nuance absente du texte.
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: l’amena devant Saül
  rationale: Le hifil de בוא signifie « amener », et לִפְנֵי désigne ici la présence de Saül.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: tandis que la tête du Philistin était dans sa main
  rationale: La proposition nominale hébraïque décrit une circonstance concomitante. Le possessif « sa » maintient l’ambiguïté grammaticale du texte sur la personne dont il s’agit, même si le contexte désigne probablement David.
