source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/פְּלִשְׁתִּ֔י אֲנִ֗י חֵרַ֛פְתִּי אֶת מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל הַ/יּ֣וֹם הַ/זֶּ֑ה תְּנוּ לִ֣/י אִ֔ישׁ וְ/נִֽלָּחֲמָ֖ה יָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: fr
  text: 'Puis le Philistin dit : « Aujourd’hui même,[a] j’ai défié[b] les rangs d’Israël.[c] Donnez-moi un homme, et combattons l’un contre l’autre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ce jour-ci »; on peut aussi traduire simplement « aujourd’hui ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut aussi être rendu par « insulté », « outragé » ou « couvert de mépris ». « Défié » souligne ici la provocation militaire.
    reason: lexical_alternative
  - marker: c
    text: Ou « les lignes de bataille d’Israël » ou, par extension, « les armées d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: Le substantif avec article désigne Goliath par son appartenance ethnique. « Le champion philistin » ajouterait ici une notion absente de ce mot.
- source_word: חֵרַפְתִּי
  choice: j’ai défié
  rationale: Dans ce contexte militaire, le verbe exprime à la fois l’affront, le mépris et la provocation ouverte. « J’ai défié » rend naturellement la portée du défi lancé, sans effacer entièrement l’idée d’insulte.
- source_word: מַעַרְכוֹת
  choice: les rangs
  rationale: Le pluriel évoque des troupes disposées en formation de combat. « Les rangs » est concis, naturel et plus précis que le terme général « armées ».
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui même
  rationale: Cette formulation française rend à la fois l’indication temporelle et l’insistance du démonstratif hébreu.
- source_word: תְּנוּ לִי אִישׁ
  choice: Donnez-moi un homme
  rationale: La traduction directe conserve la vigueur de l’impératif pluriel et le défi de produire un combattant représentant Israël.
- source_word: וְנִלָּחֲמָה
  choice: et combattons
  rationale: La première personne à valeur volitive invite, sur le mode du défi, au combat; « combattons » en conserve la force mieux qu’un simple futur.
- source_word: יָחַד
  choice: l’un contre l’autre
  rationale: Bien que le mot signifie littéralement « ensemble », le contexte est celui d’un combat mutuel. En français, « combattons ensemble » pourrait à tort suggérer que les deux hommes combattent dans le même camp.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. « Aujourd’hui même » préserve l’emphase hébraïque; « l’un contre l’autre » évite l’ambiguïté française de « combattons ensemble », qui pourrait suggérer une alliance plutôt qu’un duel.
