  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: fr
  text: Je me lançais à sa poursuite, je le frappais et j’arrachais la brebis à sa gueule[a]. S’il se dressait contre moi, je le saisissais par la barbe[b], je le frappais et je le tuais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je délivrais [la brebis] de sa bouche ». L’objet de « délivrais » est sous-entendu ; les suffixes masculins singuliers renvoient au prédateur.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « par sa barbe »; certaines traductions rendent l’expression de façon plus interprétative par « par la crinière » ou « par la mâchoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: Je me lançais à sa poursuite
  rationale: Dans le récit d’une situation habituelle, l’imparfait français convient naturellement. « Se lancer à sa poursuite » rend le mouvement volontaire exprimé par יצא suivi de אחרי.
- source_word: וְהִכִּתִיו
  choice: je le frappais
  rationale: נכה désigne ici l’action de frapper sans anticiper le sens explicitement létal du dernier verbe.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: j’arrachais la bête de sa gueule
  rationale: Le hiphil de נצל exprime l’action de délivrer ou d’arracher au danger. « Gueule » est le terme français naturel pour la bouche d’un prédateur; « la bête » explicite l’objet sous-entendu, repris du verset précédent.
- source_word: וַיָּקָם עָלַי
  choice: S’il se dressait contre moi
  rationale: קום עלי exprime un mouvement hostile. La tournure conditionnelle française rend le caractère éventuel de cette réaction dans la description habituelle de David.
- source_word: וְהֶחֱזַקְתִּי
  choice: je le saisissais
  rationale: Le hiphil de חזק indique ici une prise ferme; « saisir » conserve la vigueur de l’action dans un registre courant et digne.
- source_word: בִּזְקָנוֹ
  choice: par la barbe
  rationale: זקן signifie normalement « barbe ». Ce choix préserve l’image concrète et singulière de l’hébreu sans la remplacer par « crinière » ou « mâchoire ».
- source_word: וַהֲמִיתִּיו
  choice: je le tuais
  rationale: Le hiphil de מות exprime explicitement le fait de faire mourir et forme le point culminant de la séquence.
