  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: fr
  text: Le Philistin s’avança, se rapprochant de David, avec devant lui l’homme qui portait le bouclier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « bouclier » (צִנָּה) peut désigner plus précisément un grand bouclier. La succession d’un verbe conjugué et de participes décrit une avancée continue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב
  choice: Le Philistin avançait, se rapprochant
  rationale: Le verbe conjugué suivi des participes dépeint une progression continue. Cette formulation française restitue le mouvement prolongé vers l’adversaire sans ajouter l’idée de « champion », absente du verset.
- source_word: אֶל דָּוִד
  choice: de David
  rationale: Avec « se rapprochant », le français exige naturellement « de » pour exprimer la direction vers David.
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  choice: tandis que l’homme qui portait le grand bouclier
  rationale: La proposition décrit une circonstance accompagnant l’avancée du Philistin. צִנָּה désigne vraisemblablement un bouclier de grande taille, distinction utile dans ce contexte.
- source_word: לְפָנָיו
  choice: marchait devant lui
  rationale: L’expression situe le porteur de bouclier en avant du Philistin. « Marchait » explicite naturellement son déplacement concomitant, implicite dans la construction circonstancielle.
