revisions:
- from: Le Philistin regarda David et, en le voyant, il le méprisa, car ce n’était qu’un jeune homme, au teint coloré[a] et beau de visage.
  to: Le Philistin regarda et vit David; il le méprisa, car il était jeune, roux[a] et de belle apparence.
  rationale: La révision retire l’intensification non exprimée (« ne… que »), remplace une expression française imprécise par « roux » avec une note qui maintient l’ambiguïté sémantique de l’hébreu, et rend « beau d’apparence » sans restreindre la description au visage. Aucun changement théologique ou interprétatif n’est introduit.
