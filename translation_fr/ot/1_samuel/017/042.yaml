base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: fr
  text: Le Philistin regarda et vit David; il le méprisa, car il était jeune, roux[a] et de belle apparence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une coloration rougeâtre ». L’adjectif hébreu peut désigner une coloration rougeâtre plus générale et ne renvoie pas nécessairement à la seule couleur des cheveux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: regarda
  rationale: Le verbe exprime le fait de diriger son regard. « Regarda » est naturel et permet de conserver la progression avec le verbe suivant, « voir ».
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: Le texte hébreu emploie ici la simple désignation ethnique, sans répéter que cet homme est le champion.
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: en le voyant
  rationale: Cette formulation française rend le verbe courant « voir » tout en évitant la lourdeur de « regarda et vit David ».
- source_word: וַיִּבְזֵהוּ
  choice: il le méprisa
  rationale: Le verbe בזה signifie tenir quelqu’un pour méprisable ou sans valeur; « méprisa » en donne une traduction directe et concise.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du mépris. « Car » convient naturellement à la narration et maintient le lien explicatif.
- source_word: הָיָה נַעַר
  choice: ce n’était qu’un jeune homme
  rationale: נַעַר peut désigner un garçon ou un jeune homme. Ici, « jeune homme » évite de faire de David un enfant, tandis que « ne… que » explicite la valeur dépréciative que la description prend dans le regard du Philistin.
- source_word: אַדְמֹנִי
  choice: au teint coloré
  rationale: L’adjectif indique une coloration rougeâtre sans préciser avec certitude s’il s’agit du teint ou des cheveux. Cette formulation retient le sens probable dans ce portrait tout en signalant l’alternative en note.
- source_word: עִם יְפֵה מַרְאֶה
  choice: et beau de visage
  rationale: L’expression décrit une apparence agréable. « Beau de visage » est digne, compréhensible et préserve la dimension visuelle du terme מַרְאֶה.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La succession hébraïque « regarda… vit » est rendue idiomatiquement par « regarda… en le voyant ». La description de David conserve l’ambiguïté de אַדְמֹנִי grâce à une note lexicale.
