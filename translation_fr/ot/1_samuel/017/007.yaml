base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: fr
  text: La hampe de sa lance était comme la barre d’un métier à tisser, et la pointe en fer de sa lance pesait six cents sicles. Le porteur du grand bouclier marchait devant lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: la hampe de sa lance
  rationale: Dans ce contexte, חץ désigne la longue partie en bois de la lance, comparée à une pièce de métier à tisser. « Hampe » est le terme français précis et courant pour le manche d’une arme d’hast.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: comme la barre d’un métier à tisser
  rationale: Cette formulation conserve l’image concrète du texte hébreu tout en évitant le terme technique et moins accessible « ensouple ».
- source_word: לַהֶבֶת חֲנִיתוֹ
  choice: la pointe de sa lance
  rationale: לַהֶבֶת désigne ici la partie métallique offensive de la lance. « Pointe » est naturel en français et convient mieux à une lance que « lame ».
- source_word: שֵׁשׁ מֵאוֹת שְׁקָלִים בַּרְזֶל
  choice: la pointe en fer de sa lance pesait six cents sicles
  rationale: L’hébreu dit littéralement « six cents sicles de fer »; le verbe « pesait » explicite l’ellipse sans modifier le sens, tandis que « en fer » indique le matériau.
- source_word: נֹשֵׂא הַצִּנָּה
  choice: le porteur du grand bouclier
  rationale: צִנָּה désigne généralement un grand bouclier couvrant largement le corps. Cette précision lexicale peut être exprimée directement dans le texte français.
- source_word: הֹלֵךְ לְפָנָיו
  choice: marchait devant lui
  rationale: Le participe décrit le déplacement continu de l’écuyer devant Goliath; « marchait devant lui » est fidèle et naturel.
