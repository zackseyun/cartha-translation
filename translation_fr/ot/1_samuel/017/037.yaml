  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: fr
  text: 'David dit : « Yahvé, qui m’a délivré des griffes du lion et des griffes de l’ours, c’est lui qui me délivrera de la main de ce Philistin. » Saül dit à David : « Va, et que Yahvé soit avec toi[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Va, et Yahvé sera avec toi. » L’hébreu peut exprimer ici soit un souhait ou une bénédiction, soit une déclaration au futur.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle translittère le nom divin יהוה au lieu de le remplacer par un titre.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: m’a délivré / me délivrera
  rationale: Le hiphil de נצל exprime ici l’action d’arracher quelqu’un à un danger. La répétition de « délivrer » conserve le lien voulu entre l’expérience passée de David et sa confiance pour l’avenir.
- source_word: מִיַּד הָאֲרִי / מִיַּד הַדֹּב
  choice: des griffes du lion / des griffes de l’ours
  rationale: L’hébreu dit littéralement « de la main ». Appliqué à des fauves, « des griffes » rend naturellement en français l’image concrète de leur prise menaçante.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Le pronom indépendant est emphatique. La tournure disloquée française met en relief la certitude de David sans alourdir la phrase.
- source_word: מִיַּד הַפְּלִשְׁתִּי הַזֶּה
  choice: de la main de ce Philistin
  rationale: Avec une personne, « de la main de » reste une expression française compréhensible et conserve l’image hébraïque ainsi que la désignation précise « ce Philistin ».
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif hébreu est bref et direct.
- source_word: יִהְיֶה עִמָּךְ
  choice: que Yahvé soit avec toi
  rationale: Dans cette parole d’envoi, l’imparfait hébreu se comprend naturellement comme un souhait ou une bénédiction. Une note conserve la lecture possible comme déclaration au futur.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. Sa translittération préserve son statut de nom propre plutôt que de lui substituer un titre.
- issue: Valeur de la dernière proposition prononcée par Saül
  choice: 'souhait ou bénédiction : « que Yahvé soit avec toi »'
  alternative: 'déclaration au futur : « Yahvé sera avec toi »'
  rationale: La forme verbale hébraïque permet les deux compréhensions. Le contexte d’envoi favorise la bénédiction, tandis que la note maintient explicitement l’autre possibilité sans transformer Saül en garant prophétique du résultat.
translation_notes:
  register: Français moderne, international et digne. « Des griffes » est plus idiomatique que « de la patte » pour évoquer le danger représenté par le lion et l’ours. « C’est lui qui » préserve l’insistance portée par le pronom hébreu הוּא.
