  text: וְ/הָיָה֙ כִּֽי קָ֣ם הַ/פְּלִשְׁתִּ֔י וַ/יֵּ֥לֶךְ וַ/יִּקְרַ֖ב לִ/קְרַ֣את דָּוִ֑ד וַ/יְמַהֵ֣ר דָּוִ֔ד וַ/יָּ֥רָץ הַ/מַּעֲרָכָ֖ה לִ/קְרַ֥את הַ/פְּלִשְׁתִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: fr
  text: Quand le Philistin se leva, s’avança et s’approcha pour aller à la rencontre de David, David se hâta et courut vers la ligne de bataille[a] pour aller à la rencontre du Philistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers les rangs ». Le nom hébreu peut désigner une ligne de bataille ou des troupes rangées en ordre de bataille.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La formule narrative introduit l’événement suivant. En français actuel, « Quand » exprime naturellement la relation temporelle sans reproduire lourdement l’hébreu par « Et il arriva que ».
- source_word: קָם
  choice: se leva
  rationale: Le verbe indique que le Philistin se met debout ou se lève pour passer à l’action; « se leva » reste concret et fidèle.
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: Le texte dit simplement « le Philistin »; ajouter « champion » importerait un élément du contexte.
- source_word: וַיֵּלֶךְ
  choice: s’avança
  rationale: Dans cette scène de confrontation, le verbe décrit le déplacement du Philistin vers David. « S’avança » rend ce mouvement de façon naturelle sans supprimer l’étape distincte exprimée ensuite par « s’approcha ».
- source_word: וַיִּקְרַב
  choice: s’approcha
  rationale: Cette formulation conserve le mouvement progressif vers David et distingue ce verbe du précédent.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Dans les deux occurrences, l’expression marque un mouvement vers une personne en vue d’une rencontre, ici hostile. « À la rencontre de » préserve cette nuance sans expliciter « contre ».
- source_word: וַיְמַהֵר
  choice: se hâta
  rationale: Le verbe exprime l’empressement et la rapidité d’action. « Se hâta » est digne, clair et encore courant dans un récit.
- source_word: וַיָּרָץ
  choice: courut
  rationale: Traduction directe du verbe « courir », distincte de l’empressement exprimé par le verbe précédent.
- source_word: הַמַּעֲרָכָה
  choice: vers la ligne de bataille
  rationale: Le nom peut désigner une ligne de bataille, des rangs ou un dispositif militaire. Dans ce contexte, « ligne de bataille » est clair, tout en laissant l’alternative « les rangs » en note.
