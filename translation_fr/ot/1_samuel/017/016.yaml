  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: fr
  text: Le Philistin s’avançait matin et soir et prenait position pendant quarante jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’avançait
  rationale: Le verbe signifie « s’approcher » ou « s’avancer ». Dans cette scène militaire et avec l’action répétée matin et soir, l’imparfait « s’avançait » est naturel et évocateur.
- source_word: הַפְּלִשְׁתִּי
  choice: Le Philistin
  rationale: L’hébreu dit simplement « le Philistin ». Ajouter « champion » importerait une précision donnée dans le contexte, mais absente de ce verset.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: matin et soir
  rationale: Cette expression française courante rend avec concision le rythme quotidien indiqué par les deux formes temporelles hébraïques.
- source_word: וַיִּתְיַצֵּב
  choice: prenait position
  rationale: La forme réflexive du verbe exprime le fait de se placer ou de prendre position. L’imparfait convient à l’action habituelle répétée pendant quarante jours.
- source_word: אַרְבָּעִים יוֹם
  choice: pendant quarante jours
  rationale: Le groupe nominal indique la durée de cette action répétée. « Pendant » explicite naturellement cette fonction en français.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Les imparfaits rendent la répétition habituelle suggérée par « matin et soir » sur une période de quarante jours. « Ainsi » rattache clairement la durée à l’ensemble de l’action sans ajouter de contenu interprétatif substantiel.
