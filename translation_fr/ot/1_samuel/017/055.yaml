base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: fr
  text: 'Quand Saül vit David sortir à la rencontre du Philistin, il demanda à Abner, le chef de l’armée : « De qui ce jeune homme est-il le fils, Abner ? » Abner répondit : « Aussi vrai que tu es vivant, ô roi, je n’en sais rien. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: Quand Saül vit
  rationale: La conjonction suivie de l’infinitif construit introduit une proposition temporelle ; cette formulation est naturelle en français et conserve la succession narrative.
- source_word: יֹצֵא לִקְרַאת
  choice: partir à la rencontre de
  rationale: Le participe de יצא décrit David en train de sortir, et לקראת son mouvement vers l’adversaire. « Partir à la rencontre de » restitue naturellement l’ensemble sans ajouter l’idée explicite de confrontation.
- source_word: הַפְּלִשְׁתִּי
  choice: le Philistin
  rationale: L’hébreu emploie simplement le gentilé substantivé au singulier avec l’article ; « champion » ne figure pas dans cette proposition.
- source_word: שַׂר הַצָּבָא
  choice: le chef de l’armée
  rationale: Le titre désigne le responsable militaire. « Chef de l’armée » est clair, actuel et suffisamment digne.
- source_word: בֶּן מִי זֶה הַנַּעַר
  choice: De qui ce jeune homme est-il le fils ?
  rationale: Cette formulation suit de près la structure hébraïque tout en restant idiomatique. « Jeune homme » convient mieux que « garçon » à David dans ce contexte militaire.
- source_word: חֵי נַפְשְׁךָ
  choice: Aussi vrai que tu es vivant
  rationale: Il s’agit d’une formule de serment invoquant la vie de l’interlocuteur. Cette équivalence française en transmet la force sans le calque peu naturel « par la vie de ton âme ».
- source_word: אִם יָדָעְתִּי
  choice: je n’en sais rien
  rationale: Dans une formule de serment, אִם introduit elliptiquement une dénégation solennelle. Le français exprime directement ce sens ; « en » renvoie à l’identité familiale demandée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formule de serment est rendue idiomatiquement tout en conservant sa solennité ; aucune précision contextuelle absente de l’hébreu, telle que « champion », n’est ajoutée.
