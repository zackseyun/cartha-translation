  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: fr
  text: 'Les hommes d’Israël se disaient : « Avez-vous vu cet homme qui monte ? C’est pour défier Israël qu’il monte. Celui qui l’abattra, le roi le comblera de grandes richesses, lui donnera sa fille et rendra libre en Israël la maison de son père[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exemptera en Israël la famille de son père », probablement des impôts, des corvées ou d’autres obligations envers le roi.
    reason: Alternative lexicale précisant le sens administratif probable de חָפְשִׁי et la portée familiale de בֵּית אָבִיו.
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: Les hommes d’Israël se disaient
  rationale: Le syntagme est morphologiquement au singulier, mais il a ici une valeur collective ou distributive dans l’échange entre soldats. Le pluriel avec « se disaient » rend naturellement cette scène en français.
- source_word: הַרְּאִיתֶם
  choice: Avez-vous vu
  rationale: Le parfait interrogatif à la deuxième personne du pluriel convient à une question rhétorique portant sur l’homme présent sous leurs yeux.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: cet homme qui monte
  rationale: Le participe exprime l’action en cours. « Monte » conserve le mouvement vers le lieu du combat sans l’expliciter davantage.
- source_word: כִּי לְחָרֵף אֶת יִשְׂרָאֵל עֹלֶה
  choice: C’est pour défier Israël qu’il monte
  rationale: Cette tournure française restitue l’explication emphatique introduite par כִּי et le but exprimé par לְחָרֵף.
- source_word: יַכֶּנּוּ
  choice: l’abattra
  rationale: Le verbe נכה peut désigner le fait de frapper, d’abattre ou de tuer. Dans ce contexte, « abattre » exprime la victoire décisive sans réduire le verbe à une simple frappe.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: le comblera de grandes richesses
  rationale: La formulation garde le verbe causatif et son complément de même racine, tout en évitant en français la lourdeur de « l’enrichira de grandes richesses ».
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: lui donnera sa fille
  rationale: Rendu direct et naturel de la récompense matrimoniale annoncée.
- source_word: בֵּית אָבִיו
  choice: la maison de son père
  rationale: « Maison » conserve l’image et l’étendue possible du groupe familial paternel, là où « famille » serait plus interprétatif.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: rendra libre en Israël
  rationale: Le texte principal conserve la formulation large de חָפְשִׁי. La note indique le sens administratif probable sans l’imposer comme seule lecture.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et oralement fluide. La répétition de « monte » est conservée parce qu’elle structure la remarque des soldats. Le texte maintient « Israël » sans ajouter « l’armée », et laisse ouverte dans le corps du verset la nature exacte de la liberté promise.
