  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: fr
  text: Puis David se détourna de lui pour s’adresser à un autre et posa la même question. Les gens lui répondirent comme la première fois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les gens lui répondirent une parole semblable à la première parole », c’est-à-dire qu’ils lui donnèrent la même réponse que précédemment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ אֶל מוּל אַחֵר
  choice: David se détourna de lui pour s’adresser à un autre
  rationale: Le verbe exprime un mouvement de retrait et de réorientation depuis Éliab vers une autre personne. Le nom « David », fourni par le contexte, évite en français une succession ambiguë de pronoms; « pour s’adresser à » rend naturellement l’orientation vers l’autre interlocuteur.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: posa la même question
  rationale: Littéralement, David « dit une chose comme celle-ci ». Dans le contexte immédiat, il répète sa question précédente; cette formulation française explicite l’acte de parole sans en modifier la teneur.
- source_word: וַיְשִׁבֻהוּ הָעָם
  choice: Les gens lui répondirent
  rationale: Le hifil de שוב a ici le sens de répondre. עם désigne collectivement les personnes présentes; « les gens » est naturel en français et évite de préciser « soldats » au-delà du terme hébreu.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: comme la première fois
  rationale: L’expression signifie littéralement « une parole semblable à la première parole » et indique que la réponse fut la même que précédemment.
