base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: fr
  text: David laissa les affaires qu’il portait au gardien des bagages[a], puis courut vers la ligne de bataille[b]. À son arrivée, il demanda à ses frères comment ils allaient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner des objets, des affaires, du matériel ou des bagages. Dans ce contexte, ces affaires comprennent notamment les provisions apportées par David.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « vers les rangs » : le terme hébreu désigne une ligne ou une formation de troupes disposées pour le combat.'
    reason: lexical_alternative
  - marker: c
    text: Littéralement « il interrogea ses frères au sujet de la paix » ; cette expression hébraïque signifie qu’il s’enquit de leur bien-être.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: laissa
  rationale: 'Le verbe peut signifier laisser, délaisser ou abandonner. Ici, David ne se débarrasse pas des objets : il les confie temporairement à une personne chargée de les garder.'
- source_word: הַכֵּלִים
  choice: les provisions / les bagages
  rationale: כֵּלִים est un terme large désignant des objets, des affaires ou du matériel. « Provisions » convient à ce que David apporte, tandis que « bagages » désigne naturellement l’ensemble des effets confiés au préposé du camp.
- source_word: מֵעָלָיו
  choice: qu’il portait
  rationale: L’expression signifie littéralement que les objets étaient « sur lui ». La proposition relative restitue explicitement ce détail dans un français naturel.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: aux soins du préposé aux bagages
  rationale: L’expression « auprès de la main de » indique ici la garde ou la responsabilité. « Aux soins de » conserve cette idée, et « préposé » désigne clairement la personne chargée des bagages.
- source_word: וַיָּרָץ
  choice: courut
  rationale: Le verbe signifie directement « courir » et exprime l’empressement de David.
- source_word: הַמַּעֲרָכָה
  choice: la ligne de bataille
  rationale: Le nom désigne ici les troupes rangées en formation. « Ligne de bataille » est clair, actuel et adapté au contexte militaire.
- source_word: וַיָּבֹא
  choice: À son arrivée
  rationale: Cette tournure française naturelle conserve la succession temporelle du récit sans reproduire mécaniquement « il vint ».
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: il demanda à ses frères comment ils allaient
  rationale: L’expression hébraïque signifie littéralement demander à quelqu’un au sujet de la paix et constitue une manière de s’enquérir de son bien-être.
