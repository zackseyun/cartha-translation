  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: fr
  text: Alors Saül revêtit David de sa tenue[a], lui mit un casque de bronze sur la tête et le revêtit d’une armure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ses vêtements » ou « de sa tenue militaire ». Le terme hébreu peut désigner des vêtements liés au rang ou au combat.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’une cuirasse » ou « d’une protection corporelle ». Le terme hébreu ne précise pas ici la forme exacte de cet équipement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: revêtit
  rationale: Le hifil de לבשׁ exprime ici le fait de faire porter un vêtement ou un équipement. « Revêtit » conserve ce sens causatif et convient au registre narratif.
- source_word: מַדָּיו
  choice: sa tenue
  rationale: מַד peut désigner des vêtements, notamment une tenue officielle ou militaire. « Sa tenue » préserve l’indétermination du terme et le suffixe possessif renvoyant à Saül, sans le confondre avec la cuirasse mentionnée ensuite.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: un casque de bronze
  rationale: קוֹבַע désigne un casque, et נְחֹשֶׁת renvoie ici naturellement au bronze employé pour l’équipement militaire antique.
- source_word: עַל רֹאשׁוֹ
  choice: sur la tête
  rationale: Formulation française directe et idiomatique. Le possessif n’a pas besoin d’être répété après « lui mit ».
- source_word: שִׁרְיוֹן
  choice: une cuirasse
  rationale: Le terme désigne une protection du torse ou une armure corporelle. « Cuirasse » distingue clairement cet élément du casque tout en restant naturel et précis.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « revêtit » reproduit les deux emplois du verbe hébreu, tandis que « lui mit » évite une construction lourde pour le casque.
