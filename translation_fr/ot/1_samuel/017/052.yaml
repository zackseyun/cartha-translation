  register: 'Français international actuel, clair et digne. La syntaxe narrative demeure vive. Les noms propres suivent une translittération francisée cohérente : Éqron, Shaaraïm; Gath conserve sa forme française traditionnelle. Les appels de notes sont placés précisément après les expressions qu’ils éclairent.'
