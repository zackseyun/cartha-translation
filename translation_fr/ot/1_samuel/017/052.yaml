source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: fr
  text: Alors les hommes d’Israël et de Juda se levèrent, poussèrent des cris[b] et poursuivirent les Philistins jusqu’à l’entrée de la vallée[a] et jusqu’aux portes d’Éqron. Les Philistins frappés à mort tombèrent le long de la route de Shaaraïm, jusqu’à Gath et jusqu’à Éqron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi être compris comme un nom de lieu : « jusqu’à Gaï ». La tournure est difficile sur le plan textuel et syntaxique.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « poussèrent un cri de guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le qal narratif de קום décrit la mobilisation soudaine des combattants après la chute de Goliath; « se levèrent » reste naturel et précis.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: les hommes d’Israël et de Juda
  rationale: Le contexte est celui des combattants, et אַנְשֵׁי signifie littéralement « hommes de »; le construit porte sur Israël et Juda.
- source_word: וַיָּרִעוּ
  choice: poussèrent des cris
  rationale: רוע désigne ici une forte clameur, vraisemblablement guerrière. La traduction principale reste naturelle sans rendre explicite une nuance indiquée en note.
- source_word: וַיִּרְדְּפוּ
  choice: poursuivirent
  rationale: רדף est le verbe courant pour une poursuite militaire.
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: jusqu’à l’entrée de la vallée
  rationale: La tournure est difficile, mais בואך peut idiomatiquement signaler l’arrivée ou l’accès à un lieu, et גיא signifie normalement « vallée ». L’ambiguïté avec un éventuel nom de lieu est conservée en note.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: et jusqu’aux portes d’Éqron
  rationale: Traduction directe de la limite spatiale, avec le pluriel concret « portes ».
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: Les Philistins frappés à mort tombèrent
  rationale: חַלְלֵי désigne les hommes abattus ou mortellement atteints, non de simples blessés. Cette formulation évite l’expression française peu naturelle « les tués tombèrent » tout en conservant le verbe « tomber ».
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: le long de la route de Shaaraïm
  rationale: בדרך suivi d’un lieu désigne naturellement la route qui y mène; « le long de » convient à la répartition des morts sur l’itinéraire.
- source_word: שַׁעֲרַיִם
  choice: Shaaraïm
  rationale: Le nom de lieu est translittéré; le tréma aide le lecteur francophone à distinguer les voyelles.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: jusqu’à Gath et jusqu’à Éqron
  rationale: La répétition de עַד est conservée pour marquer l’étendue de la déroute.
theological_decisions: []
