- source_word: יַכֶּנּוּ
  choice: le tuera
  rationale: Le verbe נכה signifie littéralement « frapper », mais, dans le contexte du combat contre Goliath, il désigne le fait de l’abattre ou de le tuer. « Le tuera » exprime clairement l’issue visée.
- source_word: כֹּה יֵעָשֶׂה
  choice: Voilà ce qui sera fait
  rationale: Cette tournure française rend naturellement la formule hébraïque annonçant la récompense accordée à l’homme concerné.
