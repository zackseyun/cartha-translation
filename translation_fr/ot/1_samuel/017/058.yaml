source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שָׁא֔וּל בֶּן מִ֥י אַתָּ֖ה הַ/נָּ֑עַר וַ/יֹּ֣אמֶר דָּוִ֔ד בֶּֽן עַבְדְּ/ךָ֥ יִשַׁ֖י בֵּ֥ית הַלַּחְמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: fr
  text: 'Saül lui dit : « De qui es-tu le fils, jeune homme ? » David dit : « Je suis le fils de ton serviteur Jessé, de Bethléem[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Le fils de ton serviteur Jessé, celui de Bethléem. » La réponse hébraïque n’exprime pas le verbe « je suis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: De qui es-tu le fils
  rationale: Cette formulation naturelle en français conserve l’accent de l’expression hébraïque sur la filiation paternelle, sans la remplacer par la question plus interprétative « Qui est ton père ? ».
- source_word: הַנָּעַר
  choice: jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune ou un jeune homme. Dans ce contexte, « jeune homme » exprime la jeunesse de David sans suggérer nécessairement qu’il s’agit d’un enfant.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Ici, עֶבֶד relève du langage déférent employé devant le roi. « Ton serviteur » rend cette politesse de cour sans imposer l’idée plus forte d’un statut d’esclave.
- source_word: בֵּית הַלַּחְמִי
  choice: de Bethléem
  rationale: Le gentilé hébreu indique l’origine de Jessé. « De Bethléem » est plus naturel et immédiatement compréhensible en français moderne que « le Bethléhémite ».
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: dit ... dit
  rationale: Les deux propositions emploient le verbe hébreu courant « dire ». Le conserver dans les deux cas reste proche de la forme du texte, tandis que la ponctuation indique clairement la question et la réponse.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: Je suis le fils de ton serviteur Jessé
  rationale: L’hébreu formule la réponse sans copule explicite. L’ajout de « Je suis » restitue en français la copule sous-entendue et produit une réponse complète et naturelle.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement reflète les formes hébraïques singulières adressées directement à David et à Saül. La tournure « de Bethléem » privilégie l’intelligibilité courante tout en conservant l’indication d’origine portée par le gentilé hébreu.
