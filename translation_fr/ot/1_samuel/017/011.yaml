lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendirent
  rationale: Le qal de שׁמע signifie couramment « entendre » ; avec « ces paroles » comme complément, « entendirent » est naturel en français narratif.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: וְכָל יִשְׂרָאֵל
  choice: et tout Israël
  rationale: Conserve l'expression collective hébraïque, qui désigne ici les Israélites présents, notamment l'armée.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: ces paroles du Philistin
  rationale: Rend directement le démonstratif, le pluriel construit et la désignation du champion philistin déjà identifié par le contexte.
- source_word: וַיֵּחַתּוּ
  choice: ils furent consternés
  rationale: חתת exprime ici l'abattement, l'effondrement du courage ou la consternation. « Furent consternés » est précis, naturel et se distingue du verbe de peur qui suit.
- source_word: וַיִּירְאוּ מְאֹד
  choice: et eurent très peur
  rationale: Rend simplement ירא et l'intensif מְאֹד dans un français moderne et idiomatique.
