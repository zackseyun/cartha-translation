base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: fr
  text: Les Philistins se tenaient sur une montagne[a] d’un côté, et Israël se tenait sur une montagne de l’autre côté ; la vallée[b] était entre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « colline » ici et dans la seconde occurrence ; le mot hébreu peut désigner une montagne ou une colline selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « ravin » ; le mot hébreu peut désigner une vallée aux versants abrupts.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Les Philistins
  rationale: Le nom du peuple est rendu selon sa forme française usuelle. La conjonction initiale n’a pas besoin d’être exprimée isolément dans cette description de scène.
- source_word: עֹמְדִים
  choice: se tenaient
  rationale: Le participe décrit une position qui dure dans la scène. « Se tenaient » reste naturel en français sans ajouter l’idée plus précise d’une affectation militaire.
- source_word: אֶל הָהָר מִזֶּה
  choice: sur la montagne d’un côté
  rationale: Avec עמד, אֶל peut décrire la position par rapport à un lieu. La formulation française exprime clairement la disposition des deux camps; הַר est rendu par « montagne », avec « colline » signalé en note.
- source_word: וְיִשְׂרָאֵל
  choice: et Israël
  rationale: Le texte hébreu désigne collectivement le peuple ou l’armée par le nom « Israël »; cette métonymie demeure naturelle en français.
- source_word: אֶל הָהָר מִזֶּה
  choice: sur la montagne de l’autre
  rationale: La reprise parallèle « de l’autre » rend idiomatiquement l’opposition spatiale avec « d’un côté ».
- source_word: וְהַגַּיְא בֵּינֵיהֶם
  choice: la vallée entre eux
  rationale: La proposition nominale finale situe la vallée entre les deux camps. « Vallée » est le terme courant, tandis que « ravin » reste possible selon la topographie.
