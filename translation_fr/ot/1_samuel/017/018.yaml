  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: fr
  text: Apporte aussi ces dix portions de fromage au commandant de l’unité de mille hommes. Assure-toi que tes frères vont bien et rapporte un gage de leur part[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prends leur gage ». Le mot hébreu peut désigner un gage, un signe ou une preuve rapportée pour attester de leur situation.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: portions de fromage
  rationale: Le nom חֲרִצִים peut désigner des morceaux découpés ou des formes compactes. « Portions de fromage » garde l’image concrète d’un produit laitier réparti en pièces sans imposer une forme précise.
- source_word: שַׂר הָאָלֶף
  choice: commandant de l’unité de mille hommes
  rationale: שַׂר désigne ici un chef militaire, et אֶלֶף une unité organisée théoriquement autour d’un millier d’hommes. Cette formulation rend la structure militaire intelligible en français moderne.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: assure-toi que tes frères vont bien
  rationale: Dans ce contexte, פקד associé à שָׁלוֹם signifie constater l’état ou le bien-être des frères. La tournure choisie est naturelle et fidèle à cette instruction.
- source_word: עֲרֻבָּתָם
  choice: un gage de leur part
  rationale: Le terme rare peut désigner un gage, un signe ou une preuve. « Un gage de leur part » conserve sa valeur concrète et son ambiguïté mieux qu’une explicitation certaine.
- source_word: וְאֵת
  choice: aussi
  rationale: Le waw ajoute les fromages aux provisions mentionnées auparavant ; « aussi » rend clairement cette valeur additive.
- source_word: תָּבִיא
  choice: apporte
  rationale: Le verbe décrit l’acheminement et la remise des provisions au camp ; « apporte » convient naturellement au point de vue du locuteur.
- source_word: תִּקָּח
  choice: rapporte
  rationale: לקח signifie littéralement « prendre », mais le contexte implique que David doit revenir auprès de Jessé avec l’objet reçu. « Rapporte » exprime cette orientation contextuelle sans préciser la nature de l’objet.
