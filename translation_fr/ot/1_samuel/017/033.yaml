  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד לֹ֤א תוּכַל֙ לָ/לֶ֨כֶת֙ אֶל הַ/פְּלִשְׁתִּ֣י הַ/זֶּ֔ה לְ/הִלָּחֵ֖ם עִמּ֑/וֹ כִּֽי נַ֣עַר אַ֔תָּה וְ/ה֛וּא אִ֥ישׁ מִלְחָמָ֖ה מִ/נְּעֻרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: fr
  text: 'Saül dit à David : « Tu ne peux pas aller te battre contre ce Philistin, car tu es un jeune homme[a], tandis que lui est un homme de guerre depuis sa jeunesse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner un garçon ou un adolescent.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Tu ne peux pas
  rationale: Exprime directement l’incapacité affirmée par Saül, plutôt qu’une interdiction.
- source_word: לָלֶכֶת אֶל הַפְּלִשְׁתִּי הַזֶּה
  choice: aller affronter ce Philistin
  rationale: Dans ce contexte militaire, « aller affronter » rend naturellement le mouvement hostile vers l’adversaire.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: pour combattre contre lui
  rationale: Conserve explicitement l’idée d’engager le combat avec cet adversaire, malgré une légère redondance naturelle dans le discours de Saül.
- source_word: נַעַר
  choice: jeune homme
  rationale: Le terme peut désigner un garçon, un adolescent ou un jeune homme. Ici, « jeune homme » évite de préciser indûment l’âge de David.
- source_word: אִישׁ מִלְחָמָה
  choice: un homme de guerre
  rationale: Reproduit l’expression hébraïque solennelle et souligne l’expérience militaire de Goliath.
- source_word: מִנְּעֻרָיו
  choice: depuis sa jeunesse
  rationale: Rend la durée commencée dans la jeunesse et poursuivie jusqu’au moment du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre la jeunesse de David et l’expérience guerrière ancienne du Philistin est conservé. « Tu n’es qu’un » explicite la valeur argumentative du contraste sans transformer l’affirmation en jugement théologique.
