  text: אִם יוּכַ֞ל לְ/הִלָּחֵ֤ם אִתִּ/י֙ וְ/הִכָּ֔/נִי וְ/הָיִ֥ינוּ לָ/כֶ֖ם לַ/עֲבָדִ֑ים וְ/אִם אֲנִ֤י אֽוּכַל ל/וֹ֙ וְ/הִכִּיתִ֔י/ו וִ/הְיִ֤יתֶם לָ֨/נוּ֙ לַ/עֲבָדִ֔ים וַ/עֲבַדְתֶּ֖ם אֹתָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: fr
  text: S’il est capable de combattre contre moi et de m’abattre[a], nous serons vos esclaves[b]. Mais si, moi, je l’emporte sur lui[c] et l’abats[a], vous serez nos esclaves[b] et vous nous servirez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi être traduit par « tue » ou « vainc » ; « abat » conserve l’idée d’un coup décisif sans préciser davantage son résultat.
    reason: lexical_alternative
  - marker: b
    text: Ou « serviteurs ». Ici, le contexte militaire évoque l’asservissement du peuple vaincu.
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « si je suis capable contre lui ». Dans ce contexte de combat, l’expression signifie « si je l’emporte sur lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל
  choice: est capable
  rationale: Le verbe יכל exprime ici la capacité dans la condition posée par Goliath. « Est capable » conserve explicitement cette nuance.
- source_word: לְהִלָּחֵם אִתִּי
  choice: combattre contre moi
  rationale: L’infinitif niphal de לחם avec אִתִּי décrit un combat réciproque. En français actuel, « combattre contre moi » exprime naturellement le duel.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: m’abat / je l’abats
  rationale: Le verbe נכה peut désigner le fait de frapper, d’abattre, de vaincre ou de tuer selon le contexte. « Abattre » rend le caractère décisif du coup sans imposer explicitement « tuer ».
- source_word: לַעֲבָדִים
  choice: esclaves
  rationale: Dans ce contexte de soumission collective imposée à l’issue d’un combat, עֲבָדִים désigne une condition d’asservissement plutôt qu’un simple service volontaire.
- source_word: אֲנִי אוּכַל לוֹ
  choice: moi, je l’emporte sur lui
  rationale: Avec la préposition ל, יכל peut signifier avoir le dessus sur quelqu’un. La tournure française rend cette nuance de victoire tout en maintenant l’insistance portée par אֲנִי.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: vous nous servirez
  rationale: Le verbe עבד décrit le service accompli par le peuple soumis. « Servir » conserve le lien lexical et sémantique avec la condition d’esclave.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux conditions est conservé, tandis que « moi, je » reproduit l’emphase de l’hébreu. « Esclaves » explicite la soumission contrainte impliquée par le contexte militaire.
