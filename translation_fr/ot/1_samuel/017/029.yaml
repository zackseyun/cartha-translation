  text: וַ/יֹּ֣אמֶר דָּוִ֔ד מֶ֥ה עָשִׂ֖יתִי עָ֑תָּה הֲ/ל֖וֹא דָּבָ֥ר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/029.yaml
  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: fr
  text: 'David dit : « Et maintenant, qu’est-ce que j’ai fait ? N’était-ce pas seulement une parole[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’était-ce pas seulement une affaire ? » Le mot hébreu דָּבָר peut désigner une parole, une affaire ou une chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Formule narrative ordinaire introduisant un discours direct ; « dit » est l’équivalent français le plus simple et naturel.
- source_word: דָּוִד
  choice: David
  rationale: Forme française conventionnelle du nom propre.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: Et maintenant, qu’est-ce que j’ai fait ?
  rationale: Cette formulation conserve עָתָּה (« maintenant ») et rend naturellement en français la question de protestation de David.
- source_word: הֲלוֹא
  choice: N’était-ce pas
  rationale: La tournure interrogative appelle une réponse affirmative et garde la force rhétorique de l’hébreu.
- source_word: דָּבָר
  choice: une parole
  rationale: « Parole » retient le sens verbal probable dans ce contexte, où David minimise ce qu’il a fait, sans effacer la possibilité lexicale de « question », « affaire » ou « chose », signalée en note.
- source_word: הוּא
  choice: ce
  rationale: Le pronom renvoie à ce que David vient de faire ou de dire ; la construction française « N’était-ce pas… ? » l’exprime naturellement.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Et maintenant » restitue l’exaspération liée à עָתָּה sans recourir au plus familier « Qu’est-ce que j’ai encore fait ? ». La note préserve l’ambiguïté réelle de דָּבָר.
