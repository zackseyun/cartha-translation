  edition: WLC
  text: וַ/יְּשָּֽׁמְעוּ֙ הַ/דְּבָרִ֔ים אֲשֶׁ֖ר דִּבֶּ֣ר דָּוִ֑ד וַ/יַּגִּ֥דוּ לִ/פְנֵֽי שָׁא֖וּל וַ/יִּקָּחֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/031.yaml
  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: fr
  text: Quand on entendit les paroles que David avait prononcées, on les rapporta à Saül, qui le fit venir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il le prit ». Le sens est probablement que Saül fit amener David auprès de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: on entendit
  rationale: Le pluriel hébreu peut avoir ici une valeur indéfinie. Le pronom « on » évite d’introduire des personnes non identifiées et reste naturel en français.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: les paroles que David avait prononcées
  rationale: « Paroles » convient au contexte de propos tenus, et le plus-que-parfait marque naturellement leur antériorité dans le récit.
- source_word: וַיַּגִּדוּ לִפְנֵי שָׁאוּל
  choice: on les rapporta à Saül
  rationale: Le verbe exprime la transmission d’une information. Dans ce contexte, « à Saül » rend idiomatiquement l’expression littérale « devant Saül ».
- source_word: וַיִּקָּחֵהוּ
  choice: qui le fit venir
  rationale: Bien que לקח signifie littéralement « prendre », le contexte indique vraisemblablement que Saül ordonna qu’on amène David auprès de lui. « Le fit venir » restitue cette valeur causative implicite sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. L’emploi de « on » conserve l’indétermination des sujets pluriels hébreux; la relative finale évite une répétition pesante de « on ».
