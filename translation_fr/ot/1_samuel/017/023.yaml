base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: fr
  text: Pendant qu’il parlait avec eux, voici que le champion[a], Goliath le Philistin, de Gath, s’avança depuis les rangs des Philistins[b]. Il prononça ces paroles, et David entendit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme de l’entre-deux », expression désignant un combattant représentant son camp dans un combat singulier.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque est difficile. Elle semble désigner les lignes de bataille ou les rangs des Philistins ; certains traduisent : « depuis les camps des Philistins »'
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: parlait avec eux
  rationale: Le participe accompagné du pronom exprime une action en cours, et עִם désigne ici une conversation avec les hommes.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française conserve la vivacité du marqueur narratif hébreu tout en restant naturelle.
- source_word: אִישׁ הַבֵּנַיִם
  choice: le champion
  rationale: L’expression idiomatique désigne le combattant représentant son camp dans un combat singulier; son sens littéral est indiqué en note.
- source_word: עוֹלֶה
  choice: s’avança
  rationale: Dans cette scène militaire, le participe décrit Goliath qui monte ou sort de la formation philistine pour se présenter entre les deux armées. « S’avança » rend naturellement ce mouvement.
- source_word: גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: il s’appelait Goliath, le Philistin de Gath
  rationale: Cette formulation française naturelle préserve le nom, l’identité philistine et l’origine géographique de Goliath.
- source_word: ממערות פְּלִשְׁתִּים
  choice: depuis les rangs des Philistins
  rationale: La forme transmise est difficile, mais le contexte indique vraisemblablement la formation militaire philistine. La note signale l’autre rendu courant.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: Il prononça les mêmes paroles
  rationale: L’expression renvoie au défi déjà rapporté; « les mêmes paroles » explicite ce renvoi sans répéter le discours.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: David l’entendit
  rationale: Le verbe signifie simplement entendre; le pronom reprend naturellement Goliath et son discours, dont l’objet reste implicite en hébreu.
