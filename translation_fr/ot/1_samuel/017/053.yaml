source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/דְּלֹ֖ק אַחֲרֵ֣י פְלִשְׁתִּ֑ים וַ/יָּשֹׁ֖סּוּ אֶת מַחֲנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: fr
  text: Les Israélites revinrent après avoir poursuivi les Philistins, puis pillèrent leur camp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: revinrent
  rationale: Le verbe שׁוב exprime ici le retour après la poursuite; « revinrent » convient naturellement au récit.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: Cette formulation française courante désigne fidèlement les membres du peuple d’Israël; le calque « les fils d’Israël » serait moins naturel et pourrait suggérer à tort que seuls des descendants masculins sont visés, même si le contexte militaire concerne les combattants.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: après avoir poursuivi
  rationale: דלק avec אַחֲרֵי décrit une poursuite active. Cette tournure rend clairement le lien temporel avec leur retour sans alourdir la phrase.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française traditionnelle et actuelle de ce peuple.
- source_word: וַיָּשֹׁסּוּ
  choice: pillèrent
  rationale: Le verbe שסס signifie dépouiller ou piller; « pillèrent » est naturel en français moderne dans un contexte militaire.
- source_word: מַחֲנֵיהֶם
  choice: leur camp
  rationale: La forme consonantique et la tradition massorétique permettent une difficulté de nombre dans ce mot. Le singulier collectif « leur camp » convient au contexte immédiat de l’armée philistine, tout en signalant l’autre lecture en note.
