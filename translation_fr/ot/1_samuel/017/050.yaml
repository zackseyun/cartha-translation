base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: fr
  text: 'Ainsi David l’emporta sur le Philistin avec une fronde et une pierre : il frappa le Philistin et le tua, alors qu’il n’avait pas d’épée à la main.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et David n’avait pas d’épée à la main ». La conjonction hébraïque peut être rendue simplement par « et » ; le texte principal explicite sa valeur circonstancielle et contrastive dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: David l’emporta sur le Philistin
  rationale: Dans cette construction, חזק avec מִן exprime le fait de se montrer plus fort que l’adversaire ou de triompher de lui. « L’emporta sur » est naturel en français et convient au contexte du combat.
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: avec une fronde et une pierre
  rationale: La préposition ב indique ici le moyen employé. Le singulier « une pierre » est conservé.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: il frappa le Philistin
  rationale: נכה signifie couramment « frapper ». Cette formulation moderne conserve la force concrète du geste.
- source_word: וַיְמִיתֵהוּ
  choice: et le tua
  rationale: La forme causative de מות signifie « faire mourir, tuer ». « Le tua » est direct et fidèle.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: alors qu’il n’avait pas d’épée à la main
  rationale: La conjonction introduit ici naturellement une circonstance contrastive. Le français idiomatique emploie « alors que », tandis que « à la main » préserve l’image concrète de l’hébreu.
