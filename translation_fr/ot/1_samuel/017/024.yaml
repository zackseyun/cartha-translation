  text: And every man of Israel, when they saw the man, fled from before him and were very afraid.
translation:
  language: fr
  text: Tous les hommes d’Israël, en voyant cet homme, s’enfuirent devant lui et eurent très peur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: Tous les hommes d’Israël
  rationale: Le singulier distributif hébreu désigne collectivement les hommes d’Israël; le pluriel français rend naturellement l’accord pluriel qui suit dans le texte source.
- source_word: בִּרְאוֹתָם
  choice: en voyant
  rationale: Rend la construction temporelle hébraïque avec suffixe pluriel, sans lourdeur en français.
- source_word: הָאִישׁ
  choice: cet homme
  rationale: Le démonstratif reprend naturellement l’homme déjà présent dans la scène, tout en conservant le terme générique du texte source.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: s’enfuirent loin de lui
  rationale: Exprime la fuite hors de sa présence; «loin de lui» est idiomatique et conserve l’idée d’éloignement.
- source_word: וַיִּירְאוּ מְאֹד
  choice: saisis d’une très grande peur
  rationale: Rend avec force l’intensification מְאֹד et évite le français moins naturel «eurent très peur» dans ce registre narratif.
