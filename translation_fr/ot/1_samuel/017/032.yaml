  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל אַל יִפֹּ֥ל לֵב אָדָ֖ם עָלָ֑י/ו עַבְדְּ/ךָ֣ יֵלֵ֔ךְ וְ/נִלְחַ֖ם עִם הַ/פְּלִשְׁתִּ֥י הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: fr
  text: 'David dit à Saül : « Que personne ne perde courage à cause de lui.[a] Ton serviteur ira combattre ce Philistin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « à cause de ce Philistin ». L’hébreu dit « à cause de lui » ; le contexte permet d’identifier le référent.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français narratif, le passé simple exprime naturellement cette succession sans qu’il soit nécessaire de rendre systématiquement le waw par « et ».
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: Que personne ne perde courage
  rationale: L’hébreu dit littéralement que « le cœur d’un homme » ne doit pas tomber. « Perdre courage » restitue clairement et naturellement le sens de cette expression en français moderne.
- source_word: אָדָם
  choice: personne
  rationale: Dans cette tournure négative, אָדָם a une portée humaine générale. « Personne » est idiomatique en français et ne réduit pas indûment la référence aux seuls hommes adultes.
- source_word: עָלָיו
  choice: à cause de lui
  rationale: Le pronom renvoie, d’après le contexte, au Philistin. La traduction conserve la référence pronominale et son explicitation contextuelle est indiquée en note.
- source_word: עַבְדְּךָ
  choice: Ton serviteur
  rationale: David emploie devant le roi une formule de déférence. « Ton serviteur » en rend naturellement la valeur de présentation de soi, sans accentuer ici la notion d’esclavage.
- source_word: יֵלֵךְ וְנִלְחַם
  choice: ira combattre
  rationale: Les formes verbales expriment la résolution de David. « Ira combattre » rend en français courant le mouvement suivi de l’action, sans lourdeur.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: ce Philistin
  rationale: Avec un verbe de combat, עִם désigne l’adversaire affronté. En français, « combattre ce Philistin » est plus naturel que « combattre avec ce Philistin », qui pourrait laisser entendre une alliance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à la forme hébraïque singulière adressée à Saül et convient à la formule de déférence « ton serviteur ». L’image littérale du cœur qui tombe est rendue par l’expression française usuelle « perdre courage ».
