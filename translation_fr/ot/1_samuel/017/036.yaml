source:
  edition: WLC
  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: fr
  text: Ton serviteur a abattu aussi bien le lion que l’ours, et ce Philistin incirconcis sera comme l’un d’eux, car il a défié les lignes de bataille[a] du Dieu vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les armées du Dieu vivant ». Le terme hébreu peut désigner les lignes de bataille, les rangs ou, par extension, les armées.
    reason: alternative lexicale
lexical_decisions:
- source_word: הִכָּה
  choice: a abattu
  rationale: Le verbe נכה signifie frapper ou abattre. Ici, « a abattu » exprime naturellement la victoire de David sur les prédateurs sans préciser davantage que l’hébreu la manière dont ils ont péri.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans l’adresse à Saül, le terme est une formule de déférence. « Ton serviteur » conserve cette nuance de cour sans mettre indûment l’accent sur le statut d’esclave.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: le lion ... l’ours
  rationale: Les deux noms portent l’article en hébreu et renvoient aux prédateurs déjà évoqués par David.
- source_word: וְהָיָה
  choice: sera
  rationale: Dans ce contexte, la forme a une valeur prédictive et exprime l’assurance de David quant au sort du Philistin.
- source_word: הֶעָרֵל
  choice: incirconcis
  rationale: Le terme littéral garde toute la force physique, rhétorique et liée à l’alliance présente dans l’hébreu.
- source_word: כְּאַחַד מֵהֶם
  choice: comme l’un d’eux
  rationale: Cette formulation française naturelle conserve la comparaison distributive entre le Philistin, le lion et l’ours.
- source_word: חֵרֵף
  choice: a défié
  rationale: Dans ce cadre militaire et théologique, « défier » rend le mépris hostile exprimé par חרף.
- source_word: מַעַרְכֹת
  choice: les lignes de bataille
  rationale: Le nom désigne des formations, rangs ou lignes disposés pour le combat. Cette traduction conserve l’image militaire concrète du pluriel hébreu.
- source_word: אֱלֹהִים חַיִּים
  choice: du Dieu vivant
  rationale: Cette expression hébraïque consacrée souligne que Dieu est vivant et réel; le sens exige le singulier en français.
theological_decisions:
- issue: Portée liée à l’alliance du qualificatif « incirconcis »
  choice: Conserver « incirconcis » dans le texte principal
  alternative: « étranger à l’alliance » ou « impie »
  rationale: L’hébreu emploie le signe physique de l’alliance comme désignation polémique. Le rendre littéralement préserve cette force sans imposer une explication théologique.
- issue: Sens de מַעַרְכֹת en rapport avec Dieu
  choice: « les lignes de bataille du Dieu vivant »
  alternative: « les armées du Dieu vivant » ou « les rangs du Dieu vivant »
  rationale: « Lignes de bataille » maintient l’image des formations militaires d’Israël appartenant à Dieu, tandis que « armées » constitue une extension possible mais moins concrète.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement reflète l’adresse hébraïque singulière à Saül. « Aussi bien… que… » rend le double גַּם sans lourdeur, tandis que « lignes de bataille » conserve l’image militaire inhabituelle de la source.
