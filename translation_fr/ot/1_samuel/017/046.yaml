  source_fidelity: 'Le texte rend fidèlement la succession des propositions hébraïques : Yahweh remet Goliath au pouvoir de David, David le frappe et lui ôte la tête, puis livre les cadavres de la troupe philistine aux oiseaux et aux bêtes, avec pour but la reconnaissance universelle de Dieu en relation avec Israël. « Entre mes mains » est une locution française naturelle pour l’image hébraïque au singulier (« dans ma main »). « Séparer ta tête de ton corps » explicite seulement ce que l’expression hébraïque, dans ce contexte, signifie manifestement, sans ajouter de détail narratif pertinent.'
