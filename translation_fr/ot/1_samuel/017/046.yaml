  terminology: « Yahweh » correspond au choix de translittération du nom divin. « Camp philistin », « oiseaux du ciel », « animaux sauvages de la terre » et « toute la terre » sont naturels et proches du lexique source. « Un Dieu pour Israël » conserve utilement l’ambiguïté relationnelle de לְיִשְׂרָאֵל; l’alternative locative est correctement portée en note.
