source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: fr
  text: Aujourd’hui même, Yahweh te livrera entre mes mains ; je te frapperai et je séparerai ta tête de ton corps. Aujourd’hui même, je donnerai les cadavres du camp philistin aux oiseaux du ciel et aux animaux sauvages de la terre, afin que toute la terre sache qu’il y a un Dieu pour Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il y a un Dieu en Israël ». L’hébreu dit littéralement « pour Israël », expression qui peut marquer une relation d’appartenance ou l’engagement de Dieu en faveur d’Israël.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ יְהוָה בְּיָדִי
  choice: Yahweh te livrera entre mes mains
  rationale: Le hiphil de סגר exprime ici la remise de l’adversaire au pouvoir de quelqu’un. « Livrer entre mes mains » conserve l’image hébraïque dans un français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וְהִכִּיתִךָ
  choice: je te frapperai
  rationale: נכה peut désigner le fait de frapper ou d’abattre. Le contexte rend l’issue mortelle explicite sans qu’il soit nécessaire de traduire directement par « tuer ».
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: je séparerai ta tête de ton corps
  rationale: La formulation communique clairement la décapitation tout en reflétant le verbe סור, « enlever, écarter », plutôt qu’en introduisant un verbe hébreu signifiant explicitement « couper ».
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: les cadavres du camp philistin
  rationale: Le singulier פֶּגֶר a ici une valeur collective, comme l’indique le camp entier livré aux charognards.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְחַיַּת הָאָרֶץ
  choice: aux oiseaux du ciel et aux animaux sauvages de la terre
  rationale: Cette traduction garde les images hébraïques et précise naturellement que חַיָּה désigne ici les animaux sauvages terrestres.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: afin que toute la terre sache
  rationale: La tournure rend la valeur de but ou de résultat de la proposition tout en conservant l’ampleur rhétorique de « toute la terre ».
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: il y a un Dieu pour Israël
  rationale: « Pour Israël » reproduit directement la relation exprimée par לְ sans la réduire à une simple localisation. L’autre lecture idiomatique est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel ; sa translittération préserve cette distinction plutôt que de lui substituer un titre.
- issue: Valeur de לְ dans לְיִשְׂרָאֵל
  choice: un Dieu pour Israël
  alternative: un Dieu en Israël
  rationale: La traduction principale conserve la relation, éventuellement l’appartenance ou l’engagement en faveur d’Israël, exprimée par la préposition. La lecture locative traditionnelle demeure plausible et figure donc en note.
translation_notes:
  register: Français international actuel, solennel et direct. La violence explicite du texte est conservée sans archaïsmes ni intensification gratuite. La répétition de « Aujourd’hui même » reproduit l’insistance rhétorique de l’hébreu.
