  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד אֶת יָד֜/וֹ אֶל הַ/כֶּ֗לִי וַ/יִּקַּ֨ח מִ/שָּׁ֥ם אֶ֨בֶן֙ וַ/יְקַלַּ֔ע וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י אֶל מִצְח֑/וֹ וַ/תִּטְבַּ֤ע הָ/אֶ֨בֶן֙ בְּ/מִצְח֔/וֹ וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: fr
  text: Alors David mit la main dans le sac[a], y prit une pierre, la lança avec sa fronde et frappa le Philistin au front. La pierre s’enfonça dans son front[b], et il tomba face contre terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la sacoche ». Le terme hébreu désigne de façon générale un récipient ou une pièce d’équipement ; ici, il s’agit du contenant où David avait mis ses pierres.
    reason: lexical_alternative
  - marker: b
    text: Ou « La pierre resta fichée dans son front ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « il tomba sur son visage, à terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: mit la main dans le sac
  rationale: L’expression hébraïque signifie littéralement « envoya sa main vers/dans le récipient ». « Mit la main dans le sac » est naturel en français et rend clairement le geste dans ce contexte.
- source_word: הַכֶּלִי
  choice: le sac
  rationale: כְּלִי est un terme large désignant un récipient, un objet ou une pièce d’équipement. Ici, il désigne le contenant où David avait placé les pierres ; « sac » est clair sans préciser indûment sa forme.
- source_word: אֶבֶן
  choice: une pierre
  rationale: « Pierre » est le terme français courant et précis pour le projectile choisi par David.
- source_word: וַיְקַלַּע
  choice: la lança avec sa fronde
  rationale: Le verbe désigne l’action de lancer au moyen d’une fronde. Cette formulation explicite naturellement en français l’instrument impliqué par le verbe hébreu.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: frappa le Philistin au front
  rationale: « Frapper quelqu’un au front » est l’expression idiomatique française correspondant au point d’impact marqué par אֶל.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: La pierre s’enfonça dans son front
  rationale: Le verbe טבע exprime ici l’idée de s’enfoncer ou de rester fiché. « S’enfonça » conserve l’image vive du texte sans ajouter de détail anatomique.
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: il tomba face contre terre
  rationale: Cette expression française naturelle rend à la fois la chute, la posture sur le visage et la direction vers le sol.
theological_decisions: []
