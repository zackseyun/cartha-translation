base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: fr
  text: Et toute cette assemblée saura que ce n’est ni par l’épée ni par la lance que Yahweh sauve[a], car la bataille appartient à Yahweh[b], et il vous livrera entre nos mains[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « délivre » ; le verbe peut désigner ici le salut ou la délivrance militaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car la bataille est à Yahweh ».'
    reason: literal_rendering
  - marker: c
    text: 'Littéralement : « il vous donnera dans notre main » ; cette expression signifie qu’il vous livrera en notre pouvoir.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Et … saura
  rationale: L’imparfait qal exprime ici le résultat futur de l’action annoncée par David. Le collectif singulier « toute cette assemblée » appelle naturellement « saura » en français.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: toute cette assemblée
  rationale: קהל désigne ici l’ensemble des personnes réunies. « Assemblée » convient au contexte public et militaire sans connotation ecclésiale excessive.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  choice: ce n’est ni par l’épée ni par la lance
  rationale: Les prépositions marquent le moyen. La corrélation française « ni… ni… » rend naturellement la paire d’armes sous la négation.
- source_word: יְהוֹשִׁיעַ
  choice: sauve
  rationale: Le hiphil de ישׁע peut signifier sauver ou délivrer. « Sauve » convient au contexte militaire tout en conservant la portée plus large du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: car la bataille appartient à Yahweh
  rationale: Le second כִּי introduit la raison, et la construction avec ל exprime l’appartenance. Cette formulation française est claire tout en conservant l’affirmation théologique du texte.
- source_word: וְנָתַן
  choice: et il vous livrera
  rationale: Dans cette déclaration orientée vers l’avenir, le qatal a une valeur prédictive. « Livrera » explicite idiomatiquement l’idée de remettre l’adversaire au pouvoir de quelqu’un.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: vous livrera entre nos mains
  rationale: L’expression hébraïque signifie placer quelqu’un au pouvoir d’un autre. Le pluriel « entre nos mains » est l’idiome français naturel; une note signale la forme littérale au singulier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve le nom propre sans lui substituer un titre.
- issue: Portée de יְהוֹשִׁיעַ dans le contexte militaire
  choice: sauve
  alternative: délivre
  rationale: « Sauve » maintient à la fois le sens concret de délivrance militaire et la portée plus large du verbe hébreu.
- issue: Possession exprimée par לַיהוָה הַמִּלְחָמָה
  choice: la bataille appartient à Yahweh
  alternative: la bataille est à Yahweh
  rationale: La formulation retenue exprime clairement que la bataille et son issue relèvent de Yahweh, sans préciser davantage le mode de son action.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu, tandis que « ni… ni… » et « entre nos mains » assurent un français naturel. Les notes conservent les principales possibilités lexicales et la tournure idiomatique originale.
