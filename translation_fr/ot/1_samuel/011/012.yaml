source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/עָם֙ אֶל שְׁמוּאֵ֔ל מִ֣י הָ/אֹמֵ֔ר שָׁא֖וּל יִמְלֹ֣ךְ עָלֵ֑י/נוּ תְּנ֥וּ הָ/אֲנָשִׁ֖ים וּ/נְמִיתֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: fr
  text: 'Alors le peuple dit à Samuel : « Qui donc a dit : “Saül régnera-t-il sur nous ?” Livrez-nous ces hommes, et nous les mettrons à mort. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Saül régnera sur nous. » La forme verbale hébraïque peut exprimer ici une question portant sur l’avenir ou, moins probablement dans ce contexte, une affirmation.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le wayyiqtol fait progresser le récit; « Alors » exprime naturellement cette succession en français.
- source_word: הָעָם
  choice: le peuple
  rationale: Équivalent collectif courant de עָם dans ce contexte.
- source_word: אֶל שְׁמוּאֵל
  choice: à Samuel
  rationale: אֶל indique le destinataire de la parole; « Samuel » est la forme française usuelle du nom.
- source_word: מִי הָאֹמֵר
  choice: Qui donc disait
  rationale: L’interrogatif suivi du participe substantivé demande d’identifier celui qui tenait ces propos. « donc » restitue naturellement l’insistance sans ajouter de contenu.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: Saül régnera-t-il sur nous ?
  rationale: L’imparfait hébreu peut avoir ici une valeur future et interrogative; l’inversion française conserve à la fois la question et la nuance royale de מלך.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: Livrez-nous ces hommes
  rationale: L’impératif demande que les opposants soient remis au groupe en vue de leur exécution. Le complément « nous », implicite dans la construction et explicité par la suite à la première personne, rend l’expression idiomatique en français.
- source_word: וּנְמִיתֵם
  choice: et nous les mettrons à mort
  rationale: Le hifil de מות signifie « faire mourir »; « mettre à mort » garde la nuance d’exécution plutôt que le simple « tuer ».
theological_decisions:
- issue: Valeur de יִמְלֹךְ dans la citation
  choice: 'Question future : « Saül régnera-t-il sur nous ? »'
  alternative: 'Déclaration : « Saül régnera sur nous. »'
  rationale: Le contexte rappelle la contestation de la royauté de Saül en 1 Samuel 10.27, ce qui favorise la lecture interrogative, tout en laissant subsister une ambiguïté grammaticale signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Qui donc disait » reste naturel tout en reflétant l’immédiateté du participe hébreu. La note est placée après la phrase, avec le marqueur correspondant dans le texte.
