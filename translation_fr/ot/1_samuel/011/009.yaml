  text: וַ/יֹּאמְר֞וּ לַ/מַּלְאָכִ֣ים הַ/בָּאִ֗ים כֹּ֤ה תֹֽאמְרוּ/ן֙ לְ/אִישׁ֙ יָבֵ֣ישׁ גִּלְעָ֔ד מָחָ֛ר תִּהְיֶֽה לָ/כֶ֥ם תְּשׁוּעָ֖ה ב/חם הַ/שָּׁ֑מֶשׁ וַ/יָּבֹ֣אוּ הַ/מַּלְאָכִ֗ים וַ/יַּגִּ֛ידוּ לְ/אַנְשֵׁ֥י יָבֵ֖ישׁ וַ/יִּשְׂמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: fr
  text: 'Ils dirent aux messagers qui étaient venus : « Voici ce que vous direz aux gens de Yabesh de Galaad[a] : Demain, quand le soleil sera brûlant[b], vous serez délivrés. » Les messagers vinrent et l’annoncèrent aux gens de Yabesh, qui s’en réjouirent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à l’homme de Yabesh de Galaad » ; le singulier hébreu désigne vraisemblablement ici collectivement les habitants de la ville.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans la chaleur du soleil » ; l’expression désigne vraisemblablement le moment le plus chaud de la journée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: Dans ce récit, le terme désigne des êtres humains chargés de transmettre un message, et non des êtres célestes.
- source_word: הַבָּאִים
  choice: qui étaient venus
  rationale: Le participe identifie les messagers arrivés auprès de Saül; le plus-que-parfait convient naturellement au contexte narratif français.
- source_word: כֹּה תֹאמְרוּן
  choice: Voici ce que vous direz
  rationale: Cette formulation française actuelle et digne rend clairement la formule hébraïque qui introduit les paroles à transmettre.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: aux gens de Yabesh en Galaad
  rationale: Le singulier אִישׁ a ici une valeur collective, confirmée par le pluriel employé dans la suite du verset. « Gens » inclut naturellement les habitants concernés sans créer un destinataire individuel fictif.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: vous serez délivrés
  rationale: Dans ce contexte militaire, תְּשׁוּעָה désigne le fait d’être arraché à la menace ennemie. Cette tournure est plus naturelle en français que le calque « vous aurez une délivrance ».
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: quand le soleil sera brûlant
  rationale: La tournure conserve l’image concrète de la chaleur solaire et comprend la préposition comme indiquant le moment, vraisemblablement la partie chaude de la journée.
- source_word: וַיַּגִּידוּ
  choice: transmettre cette nouvelle
  rationale: Le verbe signifie faire connaître ou rapporter. Cette formulation évite la répétition lourde de « dire » tout en restant précise dans le contexte.
- source_word: וַיִּשְׂמָחוּ
  choice: s’en réjouirent
  rationale: Cette expression rend directement la joie provoquée par la nouvelle et conserve le ton narratif.
