  source_fidelity: La formulation « Les messagers allèrent transmettre cette nouvelle » inverse le mouvement exprimé par וַיָּבֹאוּ (« ils vinrent ») et ajoute l'idée d'aller, absente du texte. La seconde note propose « avant la grande chaleur du soleil », alors que בְּחֹם signifie « dans/à la chaleur de » et non « avant ». Le reste rend bien le sens collectif du singulier, la délivrance attendue et la joie finale.
  naturalness: Le français est globalement moderne et naturel. « Vinrent et l’annoncèrent » est à la fois plus fidèle et fluide dans le récit.
  terminology: « Messagers », « gens de Yabesh de Galaad », « délivrés » et « se réjouirent » conviennent au contexte. « Yabesh de Galaad » rend plus directement le nom composé que « Yabesh en Galaad ».
