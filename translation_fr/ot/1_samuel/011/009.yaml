  register: Français international moderne, naturel et digne. Le nom יָבֵישׁ est transcrit « Yabesh » et גִּלְעָד est rendu par la forme géographique française traditionnelle « Galaad ». Le discours direct reste solennel sans employer de tournures inutilement archaïques.
