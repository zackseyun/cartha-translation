id: 1SA.11.14
reference: 1 Samuel 11:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: fr
  text: 'Samuel dit alors au peuple : « Venez, allons à Guilgal, et renouvelons-y la royauté[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confirmons la royauté » ou « renouvelons le royaume ».
    reason: 'Alternative lexicale : חדש peut exprimer le renouvellement ou la confirmation, et מְלוּכָה peut désigner la royauté ou le royaume.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit ; « dit alors » rend naturellement cette succession en français.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle du nom propre.
- source_word: אֶל הָעָם
  choice: au peuple
  rationale: עָם désigne ici le peuple d’Israël rassemblé ; « peuple » en restitue le sens courant sans le réduire à l’armée.
- source_word: לְכוּ וְנֵלְכָה
  choice: Venez, allons
  rationale: L’impératif suivi du cohortatif constitue une invitation à une action commune. Cette formulation française est naturelle et conserve les deux verbes.
- source_word: הַגִּלְגָּל
  choice: Guilgal
  rationale: Transcription française usuelle du nom de lieu biblique.
- source_word: וּנְחַדֵּשׁ
  choice: renouvelons
  rationale: Le piel de חדש signifie « renouveler, rendre de nouveau ». Le contexte suggère une réaffirmation, mais le choix principal conserve l’expression ouverte du texte hébreu.
- source_word: שָׁם
  choice: -y
  rationale: Le pronom adverbial « y » renvoie naturellement à Guilgal et rend la valeur locative de שָׁם.
- source_word: הַמְּלוּכָה
  choice: la royauté
  rationale: מְלוּכָה désigne ici la fonction, l’autorité ou l’institution royale plutôt que le territoire d’un royaume ; « royauté » préserve cette portée.
theological_decisions:
- issue: Sens du renouvellement de la royauté
  choice: Conserver « renouvelons la royauté » dans le texte principal
  alternative: « confirmons la royauté » ou « renouvelons le royaume »
  rationale: Après la victoire de Saül, il s’agit vraisemblablement de réaffirmer publiquement son autorité royale. Cependant, l’hébreu n’explicite ni le rite ni toute la portée institutionnelle ; la traduction maintient donc cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. L’invitation « Venez, allons » reste accessible tout en reflétant la structure de l’hébreu. « Royauté » évite de confondre l’autorité royale avec le territoire.
