  naturalness: Le français est naturel, moderne et d’un registre biblique sobre. « Venez, allons à Guilgal » est une invitation idiomatique qui conserve l’élan de l’impératif suivi du cohortatif. La tournure « renouvelons-y la royauté » est correcte et rend explicitement la valeur locative de שָׁם.
