  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: fr
  text: Les messagers arrivèrent à Guibéa de Saül et rapportèrent ces paroles devant le peuple. Alors tout le peuple éclata en sanglots[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout le peuple éleva la voix et pleura ».'
    reason: La note conserve l’idiome hébreu collectif derrière la formulation française naturelle « éclata en sanglots ».
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: Dans ce contexte humain, מַלְאָךְ désigne les hommes envoyés par les habitants de Yabesh, et non des êtres célestes.
- source_word: גִּבְעַת שָׁאוּל
  choice: Guibéa de Saül
  rationale: Cette forme conserve le rapport construit de l’hébreu et identifie la ville associée à Saül.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: rapportèrent ces paroles
  rationale: « Rapportèrent » convient à la mission des messagers, tandis que « ces paroles » préserve le caractère concret de הַדְּבָרִים.
- source_word: בְּאָזְנֵי הָעָם
  choice: devant le peuple
  rationale: L’expression signifie que les paroles sont prononcées publiquement à portée d’oreille du peuple; « devant le peuple » est naturel en français et conserve cette dimension publique.
- source_word: וַיִּשְׂאוּ כָל הָעָם אֶת קוֹלָם וַיִּבְכּוּ
  choice: Alors tout le peuple éclata en sanglots
  rationale: Cette formulation française naturelle exprime l’élévation collective de la voix suivie des pleurs, sans calquer maladroitement l’idiome hébreu.
