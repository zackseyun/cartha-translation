source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: fr
  text: 'Nahash l’Ammonite leur répondit : « Je conclurai une alliance avec vous à cette condition : je vous arracherai à tous l’œil droit et j’infligerai ainsi une honte à tout Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶכְרֹת לָכֶם
  choice: je conclurai une alliance avec vous
  rationale: L’expression idiomatique « couper pour vous » signifie conclure une alliance ou un pacte. « Alliance » conserve la portée formelle de l’accord imposé.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: je vous arracherai à tous l’œil droit
  rationale: נקר désigne l’action d’arracher ou de crever un œil. La formulation française exprime naturellement que chacun sera mutilé, tout en conservant l’action attribuée à Nahash.
- source_word: חֶרְפָּה
  choice: une honte
  rationale: Le terme évoque la honte publique, l’opprobre ou le déshonneur. « Honte » est clair et idiomatique dans ce contexte.
- source_word: וְשַׂמְתִּיהָ ... עַל כָּל־יִשְׂרָאֵל
  choice: j’infligerai ainsi une honte à tout Israël
  rationale: Le sens littéral est « je la placerai comme honte sur tout Israël ». « Infliger une honte à » restitue naturellement l’idée d’un déshonneur imposé; « ainsi » rend le lien entre la mutilation et son effet collectif.
theological_decisions:
- issue: Nature de l’accord proposé par Nahash
  choice: alliance
  alternative: traité / accord
  rationale: בְּרִית est sous-entendu par l’idiome כרת ל. Le mot « alliance » ne confère ici aucune valeur religieuse positive; il désigne un pacte politique de soumission.
- issue: Rapport syntaxique entre la mutilation et la honte d’Israël
  choice: deux actions coordonnées, la seconde découlant de la première
  alternative: présenter la honte comme simple reformulation ou finalité exclusive de la mutilation
  rationale: Le waw de וְשַׂמְתִּיהָ coordonne explicitement les propositions. « Ainsi » indique leur lien sans effacer cette coordination.
translation_notes:
  register: Français international moderne, sobre et digne. « Leur répondit » convient au contexte dialogué, même si ויאמר signifie littéralement « dit ». La menace reste directe et violente, sans atténuation.
