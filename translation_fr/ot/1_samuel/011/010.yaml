  rationale: La révision supprime le connecteur interprétatif « donc » et sa note, qui ne sont pas nécessaires pour rendre le waw narratif. Elle remplace « vous pourrez nous faire » par « vous ferez de nous », formulation française plus naturelle qui correspond mieux à la valeur prospective de la clause hébraïque tout en conservant l’absence du terme explicite « se rendre ».
