  - severity: low
    issue: Note attachée à « donc »
    rationale: Le waw narratif assure la progression du récit, mais « donc » peut suggérer une conséquence plus marquée que le texte ne l’explicite. Supprimer cet ajout et sa note produit une formulation plus neutre, sans perdre le déroulement narratif.
