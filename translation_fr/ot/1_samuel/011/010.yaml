  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: fr
  text: 'Les hommes de Yabesh dirent : « Demain, nous sortirons vers vous, et vous ferez de nous tout ce qui vous semblera bon. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: dirent donc
  rationale: Le waw consécutif fait progresser le récit et, dans le contexte, introduit la conséquence de ce qui précède ; « donc » rend naturellement ce lien.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: les hommes de Yabesh
  rationale: אַנְשֵׁי désigne précisément les hommes. Le verset porte la forme courte du nom de lieu, Yabesh, plutôt que l'appellation complète Yabesh-de-Galaad.
- source_word: מָחָר
  choice: Demain
  rationale: L'adverbe indique simplement le jour suivant.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: nous sortirons vers vous
  rationale: יצא signifie « sortir ». Cette formulation conserve le mouvement exprimé par l'hébreu sans expliciter par « nous nous rendrons » une soumission seulement impliquée par le contexte.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: et vous pourrez nous faire
  rationale: Dans cette situation, la forme exprime ce que les assiégeants seront libres de leur faire ; « pourrez » restitue cette nuance sans transformer les paroles en ordre.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: tout ce qui vous semblera bon
  rationale: Cette tournure française naturelle garde l'idée de ce qui paraît bon aux destinataires, sans reproduire lourdement l'expression hébraïque « à vos yeux ».
