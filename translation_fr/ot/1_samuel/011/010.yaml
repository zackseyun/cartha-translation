  source_fidelity: 'Le sens global est fidèle : les hommes de Yabesh annoncent qu’ils sortiront le lendemain et laissent aux assiégeants la possibilité d’agir selon ce qui leur paraît bon. Cependant, « vous pourrez nous faire » infléchit légèrement la forme verbale hébraïque vers une simple permission. Dans cette déclaration, le futur français rend plus directement l’action attendue après leur sortie.'
  naturalness: « Nous sortirons vers vous » est compréhensible et conserve volontairement le mouvement de « sortir », sans introduire explicitement l’idée de reddition. « Vous ferez de nous tout ce qui vous semblera bon » est plus idiomatique et plus net en français moderne que « vous pourrez nous faire tout ce qui vous semblera bon ».
  terminology: « Les hommes de Yabesh » respecte le texte hébreu, qui emploie la désignation courte du lieu. Le nom est conservé tel qu’il est établi dans le projet. L’expression « ce qui vous semblera bon » rend naturellement l’idiome « bon à vos yeux » sans en imposer une interprétation théologique ou morale.
