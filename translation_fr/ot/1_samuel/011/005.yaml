revisions:
- from: 'Or voici que Saül revenait du champ derrière les bœufs[a]. Il demanda : « Qu’arrive-t-il au peuple pour qu’il pleure ? » On lui rapporta les paroles des hommes de Yabesh.'
  to: 'Et voici que Saül venait du champ, à la suite du gros bétail[a]. Il demanda : « Qu’est-ce qui arrive au peuple, pour qu’il pleure ? » Ils lui rapportèrent les paroles des hommes de Yabesh.'
  rationale: La révision retire l’idée non exprimée de retour, rend בָּקָר par un terme français plus large, conserve le pluriel narratif et améliore la formulation de la question sans modifier son sens. La note conserve l’ambiguïté légitime entre une lecture spatiale (« derrière ») et dynamique (« à la suite »).
