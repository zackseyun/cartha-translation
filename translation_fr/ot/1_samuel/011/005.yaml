  text: וְ/הִנֵּ֣ה שָׁא֗וּל בָּ֣א אַחֲרֵ֤י הַ/בָּקָר֙ מִן הַ/שָּׂדֶ֔ה וַ/יֹּ֣אמֶר שָׁא֔וּל מַה לָּ/עָ֖ם כִּ֣י יִבְכּ֑וּ וַ/יְסַ֨פְּרוּ ל֔/וֹ אֶת דִּבְרֵ֖י אַנְשֵׁ֥י יָבֵֽישׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: fr
  text: 'Et voici que Saül venait du champ, à la suite du gros bétail[a]. Il demanda : « Qu’est-ce qui arrive au peuple, pour qu’il pleure ? » Ils lui rapportèrent les paroles des hommes de Yabesh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « derrière le gros bétail ». L’expression hébraïque peut décrire Saül comme venant derrière les bovins; « gros bétail » désigne les bovins de manière générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici que
  rationale: Conserve la fonction de transition et la vivacité narrative de הִנֵּה dans une tournure française digne et intelligible.
- source_word: בָּא
  choice: revenait
  rationale: L’emploi d’un verbe à l’imparfait rend l’action en cours exprimée par le participe hébreu; « revenait » convient au mouvement depuis le champ avec les bœufs.
- source_word: אַחֲרֵי הַבָּקָר
  choice: derrière les bœufs[a]
  rationale: Rend concrètement le sens spatial de אַחֲרֵי. « Bœufs » est naturel dans ce cadre agricole, tandis que la note signale que בָּקָר peut désigner plus largement le gros bétail.
- source_word: מִן הַשָּׂדֶה
  choice: du champ
  rationale: Reproduit simplement le point de départ indiqué par la préposition מִן.
- source_word: מַה לָּעָם כִּי יִבְכּוּ
  choice: Qu’arrive-t-il au peuple pour qu’il pleure ?
  rationale: Exprime naturellement en français l’idiome interrogatif hébreu tout en conservant le peuple comme sujet collectif et les pleurs comme action en cours.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: On lui rapporta
  rationale: Le sujet n’étant pas précisé en hébreu, le pronom indéfini français évite d’en inventer un; « rapporta » convient à la transmission du message.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: les paroles des hommes de Yabesh
  rationale: « Paroles » garde le sens concret et littéral de דִּבְרֵי, sans exclure l’idée du message transmis; « hommes » correspond à אַנְשֵׁי dans ce contexte.
