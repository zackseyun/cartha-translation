  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: fr
  text: 'Les anciens de Jabesh lui dirent : « Accorde-nous un délai de sept jours, et nous enverrons des messagers dans tout le territoire d’Israël. S’il n’y a personne pour nous secourir, nous sortirons vers toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: Laisse-nous sept jours de répit
  rationale: L’impératif signifie littéralement « relâche-nous / laisse-nous tranquilles » ; « laisse-nous… de répit » exprime naturellement la demande d’un délai sans surinterpréter.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte humain et politique, le terme désigne des envoyés, non des anges.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: dans tout le territoire d’Israël
  rationale: גְּבוּל peut désigner une frontière ou l’étendue territoriale qu’elle délimite ; ici, les messagers parcourent le territoire.
- source_word: מוֹשִׁיעַ אֹתָנוּ
  choice: personne ne vient à notre secours
  rationale: Le participe hiphil exprime celui qui délivre ou sauve ; cette formulation française convient à une délivrance militaire attendue.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: nous nous rendrons à toi
  rationale: Littéralement « nous sortirons vers toi » ; dans le contexte d’un siège, il s’agit de sortir de la ville pour se livrer à l’ennemi.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le nom יָבֵישׁ est translittéré « Yabesh ». Le discours direct conserve la progression de l’hébreu et la tension narrative.
