  source_fidelity: 'Le projet rend correctement les anciens, l’envoi de messagers dans tout le territoire d’Israël et l’absence éventuelle de secours. Toutefois, « nous nous rendrons à toi » explicite une capitulation que l’hébreu n’énonce pas directement : וְיָצָאנוּ אֵלֶיךָ signifie littéralement « nous sortirons vers toi ». Dans ce contexte, la reddition est plausible, mais doit rester implicite dans le texte traduit.'
  naturalness: '« Laisse-nous sept jours de répit » est maladroit en français : la construction naturelle est « Accorde-nous un délai de sept jours » (ou « Laisse-nous tranquilles pendant sept jours »). La révision maintient un registre moderne et narratif.'
