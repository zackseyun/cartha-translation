base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: fr
  text: 'Mais Saül dit : « Personne ne sera mis à mort aujourd’hui, car en ce jour Yahweh a accompli une délivrance en Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Saül dit
  rationale: Le waw consécutif fait progresser le récit, tandis que « Mais » exprime naturellement le contraste avec la proposition de mettre à mort les opposants au verset précédent.
- source_word: לֹא יוּמַת אִישׁ
  choice: Personne ne sera mis à mort
  rationale: 'Le hofal de מות exprime le fait d’être mis à mort, et אִישׁ a ici une valeur distributive : « personne ». Cette formulation conserve la portée juridique tout en étant naturelle en français.'
- source_word: בַּיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: L’expression signifie littéralement « en ce jour », mais « aujourd’hui » rend clairement et naturellement l’interdiction temporelle en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Saül pour refuser toute exécution.
- source_word: הַיּוֹם
  choice: en ce jour
  rationale: Cette formulation maintient la répétition temporelle de l’hébreu tout en évitant de répéter exactement « aujourd’hui » en français.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: Yahweh a accordé la délivrance
  rationale: L’expression signifie que Yahweh a produit ou réalisé le salut. Dans ce contexte militaire, « délivrance » rend clairement le secours victorieux sans réduire le terme à la seule victoire militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: בְּיִשְׂרָאֵל
  choice: à Israël
  rationale: Bien que ב puisse être rendu formellement par « en Israël », le français idiomatique avec « accorder la délivrance » exprime ici Israël comme bénéficiaire. La lecture locative demeure possible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Sens de תְּשׁוּעָה dans un contexte militaire
  choice: délivrance
  alternative: salut; victoire
  rationale: « Délivrance » conserve l’idée d’un secours accompli par Dieu et convient au contexte militaire. « Salut » est plus large sur le plan théologique, tandis que « victoire » est plus étroitement militaire.
- issue: Valeur de בְּיִשְׂרָאֵל
  choice: à Israël
  alternative: en Israël
  rationale: Avec le verbe français « accorder », la valeur bénéficiaire est naturelle. L’hébreu permet toutefois une compréhension plus directement locative, « en Israël ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste narratif, la solennité juridique de la décision de Saül et l’attribution explicite de la délivrance à Yahweh.
