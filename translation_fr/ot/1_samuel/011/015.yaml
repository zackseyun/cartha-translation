source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: fr
  text: Tout le peuple se rendit donc à Guilgal, et là, à Guilgal, ils établirent Saül roi devant Yahweh. Là, ils offrirent des sacrifices de paix[a] devant Yahweh, et Saül et tous les hommes d’Israël se réjouirent grandement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ». Le terme hébreu désigne une catégorie de sacrifices communautaires associée à la paix, à l’intégrité et à une célébration partagée.
    reason: Alternative lexicale pour זְבָחִים שְׁלָמִים, dont le champ de sens dépasse toute équivalence française unique.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: se rendit
  rationale: Dans cette séquence narrative, הלך exprime un déplacement. Le singulier français s’accorde naturellement avec le collectif « tout le peuple ».
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: עָם désigne ici la population rassemblée dans son ensemble, et non uniquement les soldats.
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: Guilgal
  rationale: Transcription française usuelle du nom de lieu hébreu גִּלְגָּל.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: ils établirent Saül comme roi
  rationale: Le hifil de מלך signifie faire régner ou établir comme roi. Cette formulation n’ajoute ni proclamation formelle ni onction, absentes de l’hébreu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי marque ici la présence de Dieu dans le cadre public et cultuel de l’intronisation et des sacrifices.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu fourni.
- source_word: וַיִּזְבְּחוּ
  choice: ils offrirent des sacrifices
  rationale: Dans ce contexte cultuel, זבח désigne l’action sacrificielle; cette tournure est naturelle en français et s’articule clairement avec la catégorie d’offrandes qui suit.
- source_word: זְבָחִים שְׁלָמִים
  choice: sacrifices de communion
  rationale: שְׁלָמִים désigne une catégorie de sacrifices liée à la paix, à l’intégrité et au repas partagé. « Sacrifices de communion » exprime bien leur dimension communautaire sans épuiser le terme.
- source_word: וַיִּשְׂמַח
  choice: se réjouirent
  rationale: Le verbe singulier précède un sujet composé en hébreu. Le pluriel est requis en français avec « Saül et tous les hommes d’Israël ».
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: et tous les hommes d’Israël
  rationale: אַנְשֵׁי signifie explicitement « hommes de »; la traduction conserve cette expression masculine plutôt que de la neutraliser.
- source_word: עַד מְאֹד
  choice: énormément
  rationale: L’expression intensifie fortement la joie; « énormément » est clair et actuel en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » en conserve la fonction personnelle sans le remplacer par un titre.
- issue: Portée de אַנְשֵׁי יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  alternative: tous les Israélites
  rationale: L’hébreu emploie le nom masculin אַנְשֵׁי. Le rendre explicitement préserve la donnée lexicale, sans décider au-delà du texte qui participait concrètement au rassemblement.
- issue: Nature de l’acte royal exprimé par וַיַּמְלִכוּ
  choice: ils établirent Saül comme roi
  alternative: ils proclamèrent Saül roi
  rationale: Le causatif indique que le peuple fait de Saül le roi ou confirme son règne. La traduction évite de préciser un rite de proclamation ou d’onction que le verset ne nomme pas.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. Les répétitions de « Là » et « devant Yahweh » sont maintenues parce qu’elles structurent et soulignent le texte hébreu.
