  text: וַ/תִּצְלַ֤ח רֽוּחַ אֱלֹהִים֙ עַל שָׁא֔וּל ב/שמע/ו אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וַ/יִּ֥חַר אַפּ֖/וֹ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: fr
  text: L’Esprit de Dieu fondit sur Saül avec puissance[a] lorsqu’il entendit ces paroles, et sa colère s’enflamma violemment[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vint avec puissance sur Saül ». Le verbe hébreu évoque ici la venue soudaine et puissante de l’Esprit sur une personne.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son nez brûla fortement », expression hébraïque désignant une colère intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: fondit sur … avec puissance
  rationale: Dans les récits où l’Esprit vient sur une personne, צלח exprime une venue soudaine et puissante, porteuse d’élan ou de capacité. Cette formulation française conserve à la fois la force du verbe et son dynamisme.
- source_word: רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  rationale: Le groupe construit désigne ici l’Esprit divin. La formulation est naturelle, reconnaissable et ne précise pas davantage que l’hébreu la manière exacte de cette action.
- source_word: עַל
  choice: sur
  rationale: La préposition marque la venue de l’Esprit sur Saül et s’intègre naturellement à « fondit sur ».
- source_word: בְּשָׁמְעוֹ
  choice: lorsqu’il entendit
  rationale: La préposition בְּ suivie de l’infinitif construit et du suffixe a ici une valeur temporelle.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: דְּבָרִים peut signifier « paroles », « choses » ou « faits » ; dans le contexte immédiat d’un message rapporté, « ces paroles » convient le mieux tout en restant proche du lexème.
- source_word: וַיִּחַר אַפּוֹ
  choice: sa colère s’enflamma
  rationale: Cette expression signifie littéralement que le nez de Saül brûla. Le français retenu préserve l’image du feu tout en rendant clairement l’idiome de la colère.
- source_word: מְאֹד
  choice: violemment
  rationale: L’adverbe intensifie fortement la colère. Avec « s’enflamma », « violemment » produit un français actuel et vigoureux.
theological_decisions:
- issue: Nature de רוּחַ אֱלֹהִים dans ce récit
  choice: « l’Esprit de Dieu », compris comme l’Esprit divin agissant puissamment sur Saül
  alternative: « un esprit venant de Dieu »
  rationale: Le contexte narratif de l’investiture et de la capacité accordée à Saül favorise la référence à l’Esprit de Dieu. La traduction conserve toutefois la sobriété de l’hébreu et ne définit pas plus précisément la nature de cette action.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le mouvement soudain de l’action divine et l’image vive de la colère, avec des notes pour le sens littéral et l’autre rendu possible.
