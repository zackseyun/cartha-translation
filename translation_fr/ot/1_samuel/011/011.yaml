source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: fr
  text: Le lendemain, Saül répartit le peuple en trois corps[a]. Ils pénétrèrent au milieu du camp pendant la veille du matin[b] et frappèrent les Ammonites jusqu’à ce que le jour devienne chaud[c]. Les survivants se dispersèrent, si bien qu’il n’en resta pas deux ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « trois têtes », expression qui désigne ici trois corps ou unités militaires.
    reason: lexical_alternative
  - marker: b
    text: La « veille du matin » était la période de garde militaire qui précédait ou entourait l’aube.
    reason: cultural_note
  - marker: c
    text: Littéralement « jusqu’à la chaleur du jour », probablement vers la fin de la matinée.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français moderne, qui marque clairement la succession narrative.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: Saül répartit le peuple en trois corps
  rationale: Littéralement « trois têtes » ; dans ce contexte militaire, l’expression désigne trois unités ou corps. « Répartit » rend l’organisation sans surinterpréter la tactique.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: pénétrèrent au milieu du camp
  rationale: Rend le mouvement vers l’intérieur du camp ennemi et conserve la force spatiale de בְתוֹךְ.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: pendant la veille du matin
  rationale: Conserve la désignation ancienne d’une période de garde militaire, tout en restant intelligible grâce à la note.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: frappèrent les Ammonites
  rationale: Le nom collectif « Ammon » désigne ici les forces ammonites ; le gentilé est plus naturel en français sans transformer le verbe en « vainquirent ».
- source_word: עַד חֹם הַיּוֹם
  choice: jusqu’à ce que le jour devienne chaud
  rationale: Préserve l’image hébraïque et son indétermination temporelle plutôt que de préciser arbitrairement « midi ».
- source_word: הַנִּשְׁאָרִים
  choice: Les survivants
  rationale: Dans le contexte d’une bataille, ce terme désigne clairement ceux qui ont survécu ou échappé au massacre.
- source_word: וַיָּפֻצוּ
  choice: se dispersèrent
  rationale: Le verbe exprime la dispersion complète des survivants après la déroute, sans ajouter explicitement l’idée de fuite.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: si bien qu’il n’en resta pas deux ensemble
  rationale: Formulation française naturelle qui garde l’image frappante d’une dispersion telle qu’aucun binôme ne subsiste.
- source_word: וַיְהִי ... וַיְהִי
  choice: Le lendemain ... Les survivants
  rationale: Les formules narratives hébraïques sont ici intégrées à une syntaxe française fluide ; les traduire deux fois par « il arriva que » alourdirait inutilement le récit.
theological_decisions: []
