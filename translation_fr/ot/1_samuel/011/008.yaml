  text: וַֽ/יִּפְקְדֵ֖/ם בְּ/בָ֑זֶק וַ/יִּהְי֤וּ בְנֵֽי יִשְׂרָאֵל֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וְ/אִ֥ישׁ יְהוּדָ֖ה שְׁלֹשִׁ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: fr
  text: Il les passa en revue à Bézeq. Les fils d’Israël[a] étaient trois cent mille, et les hommes de Juda, trente mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Israélites ». L’hébreu dit littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: Il les passa en revue
  rationale: Dans ce contexte militaire, פקד désigne le recensement ou l’inspection des troupes rassemblées. « Passa en revue » exprime naturellement cette opération sans la réduire à un simple comptage.
- source_word: בְּבָזֶק
  choice: à Bézeq
  rationale: Le nom de lieu est translittéré « Bézeq » ; la préposition ב indique ici le lieu du rassemblement et se rend idiomatiquement par « à ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale masculine du texte hébreu et la distinction littéraire établie ici entre Israël et Juda. Une formulation collective plus courante est indiquée en note.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: trois cent mille
  rationale: Traduction directe du nombre cardinal hébreu.
- source_word: וְאִישׁ יְהוּדָה
  choice: les hommes de Juda
  rationale: אִישׁ, singulier de forme, a ici une valeur collective et désigne les hommes appartenant à Juda.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: trente mille
  rationale: Traduction directe du nombre cardinal hébreu.
theological_decisions:
- issue: Rendu de l’expression tribale et collective בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Aucun enjeu doctrinal particulier n’est tranché. Le choix principal préserve la forme masculine et familiale de l’hébreu ainsi que le contraste littéraire avec Juda ; la note fournit l’équivalent collectif naturel.
translation_notes:
  register: Français international moderne, sobre et digne. « Passa en revue » appartient au registre militaire courant. La ponctuation allège la seconde proposition tout en conservant le parallélisme des deux effectifs.
