source:
  edition: WLC
  text: וַ/יַּ֗עַל נָחָשׁ֙ הָֽ/עַמּוֹנִ֔י וַ/יִּ֖חַן עַל יָבֵ֣שׁ גִּלְעָ֑ד וַ/יֹּ֨אמְר֜וּ כָּל אַנְשֵׁ֤י יָבֵישׁ֙ אֶל נָחָ֔שׁ כְּרָת לָ֥/נוּ בְרִ֖ית וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: fr
  text: 'Puis Nahash l’Ammonite monta et établit son camp contre Yabesh-de-Galaad. Tous les hommes de Yabesh dirent à Nahash : « Conclus une alliance avec nous[a], et nous te servirons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Coupe une alliance avec nous. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime ici une montée, possiblement dans le cadre d’une avancée militaire. « Monta » conserve cette image sans préciser davantage la direction ni transformer explicitement le mouvement en attaque.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: Nahash l’Ammonite
  rationale: Le nom propre est translittéré et le gentilé est rendu directement, dans une forme française naturelle.
- source_word: וַיִּחַן עַל
  choice: établit son camp contre
  rationale: חנה désigne l’installation d’un camp, tandis que עַל prend ici une valeur hostile. Cette formulation préserve le contexte militaire sans introduire l’idée plus forte d’un siège.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Yabesh-de-Galaad
  rationale: Cette forme traite l’ensemble comme un nom géographique composé, tout en employant les translittérations françaises usuelles.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: tous les hommes de Yabesh
  rationale: אַנְשֵׁי signifie littéralement « les hommes de ». Le maintien de « hommes » convient au cadre civique et militaire de la négociation.
- source_word: כְּרָת לָנוּ בְרִית
  choice: Conclus une alliance avec nous
  rationale: L’hébreu dit littéralement « coupe une alliance ». En français actuel, « conclure une alliance » restitue naturellement l’acte d’engagement politique exprimé par בְּרִית, sans reproduire un idiome obscur.
- source_word: וְנַעַבְדֶךָּ
  choice: et nous te servirons
  rationale: Le verbe עבד suivi d’un objet personnel signifie directement « servir ». Cette traduction évite d’expliciter excessivement la soumission ou le statut de serviteur.
theological_decisions: []
