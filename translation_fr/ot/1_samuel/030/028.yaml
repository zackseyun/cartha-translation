  text: and to those in Aroer[a], and to those in Siphmoth, and to those in Eshtemoa[b],
translation:
  language: fr
  text: à ceux d’Aroër, à ceux de Siphmoth et à ceux d’Eshtemoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: à ceux
  rationale: La formule associe la conjonction, la préposition ל et le relatif אֲשֶׁר. Dans cette liste de destinataires, « à ceux de » exprime naturellement en français les habitants ou bénéficiaires de chaque localité. La coordination finale par « et » évite une répétition lourde sans modifier les destinataires.
- source_word: בַּעֲרֹעֵר
  choice: d’Aroër
  rationale: Le nom de lieu est translittéré. Après « ceux », le français idiomatique emploie « de » pour désigner les personnes de cette localité; la préposition hébraïque ב conserve ici sa valeur de localisation implicite.
- source_word: בְּשִׂפְמוֹת
  choice: de Sifmoth
  rationale: Le toponyme hébreu est translittéré selon une forme française claire; « de » rattache les destinataires à leur localité.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: d’Eshtemoa
  rationale: Le toponyme est conservé par translittération. « d’Eshtemoa » désigne idiomatiquement ceux qui se trouvent ou résident dans cette localité.
theological_decisions: []
translation_notes:
  register: Formulation moderne, sobre et adaptée à une liste de destinataires. Le verset étant la continuation syntaxique du précédent, il commence par une minuscule. La répétition hébraïque de וְלַאֲשֶׁר devant chaque localité est légèrement allégée en français, tout en maintenant explicitement « ceux » pour chacune des trois villes.
