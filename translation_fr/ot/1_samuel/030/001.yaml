source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: fr
  text: Lorsque David et ses hommes arrivèrent à Tsiklag, le troisième jour, les Amalécites avaient lancé un raid contre le Néguev[a] et contre Tsiklag. Ils avaient attaqué Tsiklag et l’avaient incendiée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Sud » ; le mot hébreu néguev peut désigner soit le sud en général, soit la région particulière appelée le Néguev.'
    reason: Alternative lexicale et géographique authentique du terme hébreu נֶגֶב.
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: Lorsque … arrivèrent
  rationale: La construction introduit la circonstance temporelle de l’arrivée de David. « Lorsque … arrivèrent » restitue naturellement cette fonction narrative sans recourir à la formule vieillie « il arriva que ».
- source_word: וַאֲנָשָׁיו
  choice: et ses hommes
  rationale: Dans ce contexte, אֲנָשִׁים désigne les membres de la troupe de David, et non la population en général.
- source_word: צִקְלַג
  choice: Tsiklag
  rationale: Translittération française courante de ce nom de lieu biblique.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Équivalent temporel direct et idiomatique.
- source_word: וַעֲמָלֵקִי
  choice: les Amalécites
  rationale: Bien que la forme hébraïque soit morphologiquement singulière, les verbes au pluriel indiquent ici un collectif.
- source_word: פָשְׁטוּ
  choice: avaient lancé un raid
  rationale: Dans un contexte militaire, פשט décrit une incursion ou un raid. Le plus-que-parfait marque clairement que l’attaque avait précédé l’arrivée de David.
- source_word: אֶל נֶגֶב
  choice: contre le Néguev
  rationale: נֶגֶב peut désigner le sud en général ou la région appelée Néguev. Le contexte géographique favorise ici le nom régional, tandis que « contre » exprime la visée hostile du raid.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: Ils avaient attaqué Tsiklag
  rationale: נכה a un sens large, « frapper, attaquer ». « Attaquer » convient naturellement à une ville et évite l’ambiguïté peu idiomatique de « frapper une ville » en français moderne.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: et l’avaient incendiée
  rationale: « Incendier » exprime naturellement en français le fait de brûler la ville par le feu, sans la tournure redondante « brûler par le feu ».
theological_decisions: []
translation_notes:
  register: Français narratif moderne, naturel et digne. Le passé simple situe l’arrivée de David au premier plan du récit, tandis que le plus-que-parfait présente le raid, l’attaque et l’incendie comme antérieurs. Le marqueur de note est placé après « Néguev », le mot auquel il se rapporte.
