  text: וּ/שְׁתֵּ֥י נְשֵֽׁי דָוִ֖ד נִשְׁבּ֑וּ אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: fr
  text: 'Les deux femmes de David avaient été faites prisonnières : Ahinoam de Jizréel[a] et Abigaïl, femme de Nabal, l’homme de Carmel[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la Jizréélite ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit ici de Carmel, localité de Juda, et non du mont Carmel ni d’un ordre religieux apparu bien plus tard.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: Les deux femmes de David
  rationale: Le waw relie la phrase au récit précédent, sans qu’un « et » initial soit nécessaire en français. La chaîne construite est rendue naturellement par « les deux femmes de David ».
- source_word: נִשְׁבּוּ
  choice: avaient été faites prisonnières
  rationale: Le nifal accompli de שׁבה exprime le fait d’avoir été emmenées comme captives. Le plus-que-parfait situe cet événement avant la scène racontée.
- source_word: הַ/יִּזְרְעֵלִית
  choice: de Jizréel
  rationale: Le gentilé féminin indique l’origine d’Ahinoam. « De Jizréel » est plus naturel en français moderne que « la Jizréélite », tout en conservant le sens géographique.
- source_word: אֵשֶׁת נָבָל
  choice: femme de Nabal
  rationale: Cette formulation reproduit sobrement l’identification appositive du texte hébreu sans préciser ici si Nabal est encore vivant.
- source_word: הַֽ/כַּרְמְלִי
  choice: l’homme de Carmel
  rationale: Le gentilé masculin désigne Nabal comme originaire de Carmel. Cette formulation évite l’ambiguïté moderne de « carmélite », qui évoque généralement un ordre religieux.
theological_decisions: []
