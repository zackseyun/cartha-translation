base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: fr
  text: Ils trouvèrent un Égyptien dans un champ et l’amenèrent à David. Ils lui donnèrent du pain, et il mangea, puis ils lui donnèrent de l’eau à boire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Ils trouvèrent
  rationale: Le wayyiqtol fait progresser le récit; le passé simple convient au registre narratif biblique français tout en restant clair.
- source_word: אִישׁ מִצְרִי
  choice: un Égyptien
  rationale: En français, le gentilé substantivé exprime naturellement qu’il s’agit d’un homme égyptien; «un homme égyptien» serait moins idiomatique.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שָׂדֶה peut désigner un champ ou l’espace rural non urbain; ici, «dans la campagne» rend naturellement le lieu où l’homme est découvert sans ajouter l’idée d’un terrain cultivé précis.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: et l’amenèrent à David
  rationale: לקח avec une personne et une destination peut signifier prendre ou amener; «l’amenèrent à David» exprime naturellement le déplacement vers David.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: Ils lui donnèrent du pain
  rationale: לֶחֶם signifie ici littéralement «pain»; le partitif français est naturel et n’élargit pas inutilement le sens à toute nourriture.
- source_word: וַיֹּאכַל
  choice: et il mangea
  rationale: Comme l’hébreu, la traduction laisse l’objet implicite.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: puis ils lui donnèrent de l’eau à boire
  rationale: Le hiphil de שׁקה signifie donner à boire ou faire boire. Cette formulation française conserve le sens causatif sans suggérer une contrainte.
theological_decisions: []
translation_notes:
  register: Français international moderne et digne, avec passé simple narratif. La coordination hébraïque est légèrement modulée par «puis» afin d’éviter une succession pesante de «et» sans modifier l’ordre des actions.
