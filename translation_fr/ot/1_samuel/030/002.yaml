base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: fr
  text: Ils firent prisonnières les femmes qui s’y trouvaient, toutes, de la plus petite à la plus grande[a]. Ils ne tuèrent personne. Ils les emmenèrent et poursuivirent leur chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des plus jeunes aux plus âgées ». L’expression hébraïque « de la plus petite à la plus grande » peut désigner l’ensemble du groupe, sans exception.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Ils emmenèrent captives
  rationale: Le verbe שׁבה désigne la capture de personnes en contexte de guerre. Cette formulation française exprime clairement leur mise en captivité.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Le nom désigne ici les femmes en général; « les épouses » serait plus restrictif que l’hébreu.
- source_word: אֲשֶׁר בָּהּ
  choice: qui s’y trouvaient
  rationale: Le pronom féminin singulier renvoie à la ville mentionnée au verset précédent. « S’y trouvaient » conserve ce renvoi sans répéter explicitement « la ville ».
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: toutes, de la plus petite à la plus grande
  rationale: La formule hébraïque exprime une totalité couvrant toute l’étendue du groupe. L’accord au féminin est naturel en français puisque l’expression porte ici sur les femmes; « toutes » rend explicite la valeur inclusive de l’idiome.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: Ils ne tuèrent personne
  rationale: אִישׁ fonctionne ici comme un indéfini désignant toute personne, et non exclusivement un homme adulte.
- source_word: וַיִּנְהֲגוּ
  choice: Ils les emmenèrent
  rationale: נהג signifie conduire ou mener. Le pronom reprend naturellement les captives et rend le déplacement forcé sans lourdeur.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: poursuivirent leur chemin
  rationale: Cette expression rend naturellement l’idiome hébraïque indiquant qu’ils repartirent et continuèrent leur route.
