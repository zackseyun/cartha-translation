  text: וַ/יָּבֹ֣א דָוִ֗ד אֶל מָאתַ֨יִם הָ/אֲנָשִׁ֜ים אֲשֶֽׁר פִּגְּר֣וּ מִ/לֶּ֣כֶת אַחֲרֵ֣י דָוִ֗ד וַ/יֹּֽשִׁיבֻ/ם֙ בְּ/נַ֣חַל הַ/בְּשׂ֔וֹר וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את דָּוִ֔ד וְ/לִ/קְרַ֖את הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וַ/יִּגַּ֤שׁ דָּוִד֙ אֶת הָ/עָ֔ם וַ/יִּשְׁאַ֥ל לָ/הֶ֖ם לְ/שָׁלֽוֹם־־׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: fr
  text: David arriva auprès des deux cents hommes qui, trop épuisés, n’avaient pas pu continuer à le suivre[a] et qu’on avait laissés au torrent de Besor[b]. Ils sortirent à la rencontre de David et de ceux qui l’accompagnaient. David s’approcha de ces hommes et leur demanda comment ils allaient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui étaient restés en arrière, trop épuisés pour continuer à suivre David ».
    reason: Le verbe hébreu peut évoquer à la fois l’épuisement et le fait de ne pas pouvoir suivre le groupe.
  - marker: b
    text: Ou « à l’oued de Besor ». Le terme hébreu peut désigner un torrent, souvent intermittent, ou son lit.
    reason: La réalité géographique exprimée par נחל admet plusieurs désignations françaises.
  - marker: c
    text: L’expression hébraïque signifie littéralement qu’il s’enquit de leur paix, c’est-à-dire de leur bien-être.
    reason: La note conserve l’image de l’idiome hébreu derrière la formulation française naturelle.
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: qui, trop épuisés, n’avaient pas pu continuer à le suivre
  rationale: פּגר exprime ici l’épuisement ou l’incapacité à poursuivre la marche. Cette formulation française rend clairement la cause et conserve l’idée de continuer derrière David, sans suggérer une défection volontaire.
- source_word: וַיֹּשִׁיבֻם
  choice: qu’on avait fait rester
  rationale: Le hiphil de ישׁב signifie faire rester, installer ou laisser sur place. Le sujet n’étant pas exprimé, le pronom indéfini « on » évite d’attribuer avec une certitude excessive l’action à David seul ou à tout son groupe.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: au torrent de Besor
  rationale: נחל désigne un cours d’eau, souvent intermittent, ainsi que son lit. « Torrent » est une désignation géographique biblique naturelle en français; une note signale l’autre rendu courant « oued ».
- source_word: לִקְרַאת דָּוִד וְלִקְרַאת הָעָם אֲשֶׁר אִתּוֹ
  choice: à la rencontre de David et de ceux qui l’accompagnaient
  rationale: לִקְרַאת indique qu’ils sortent au-devant d’eux. « Ceux qui l’accompagnaient » rend naturellement הָעָם אֲשֶׁר אִתּוֹ sans élargir le groupe à l’ensemble du peuple ni le réduire explicitement aux seuls combattants.
- source_word: וַיִּגַּשׁ דָּוִד אֶת הָעָם
  choice: David s’approcha de ces hommes
  rationale: נגשׁ signifie s’avancer ou s’approcher. « Ces hommes » reprend sans ambiguïté les deux cents, tout en évitant le sens trop large que pourrait avoir « le peuple » dans ce contexte.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: leur demanda comment ils allaient
  rationale: L’expression idiomatique signifie s’enquérir de la paix, du bien-être ou de l’état de quelqu’un. La formulation choisie est naturelle en français moderne et garde le caractère personnel de la demande.
