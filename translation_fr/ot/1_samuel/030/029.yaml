lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: à ceux de
  rationale: Dans cette liste de destinataires, la construction répétée waw + lamed + relatif désigne ceux qui se trouvent dans les lieux nommés. « À ceux de » exprime naturellement en français la destination des présents et l'appartenance locale; la conjonction n'est conservée qu'avant le dernier élément, conformément à l'usage français.
- source_word: בְּרָכָל
  choice: de Rakal
  rationale: Nom de lieu translittéré d'après les consonnes hébraïques. Après « ceux », le français idiomatique emploie « de Rakal » plutôt que « dans Rakal ».
- source_word: בְּעָרֵי
  choice: des villes de
  rationale: עִיר peut désigner une ville ou une localité. « Villes » est ici une désignation française naturelle et digne pour les agglomérations associées à ces groupes, sans préjuger précisément de leur taille.
- source_word: הַיְּרַחְמְאֵלִי
  choice: les Yerahmeélites
  rationale: Le gentilé hébreu singulier avec article a un sens collectif après « villes de »; le pluriel français désigne naturellement le peuple concerné. La translittération rend le yod initial par Y.
- source_word: הַקֵּינִי
  choice: les Qénites
  rationale: Le gentilé singulier hébreu est collectif dans ce contexte. « Qénites » est la forme française traditionnelle et reconnaissable du nom de ce peuple.
