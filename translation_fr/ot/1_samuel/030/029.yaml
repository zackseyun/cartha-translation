  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: fr
  text: à ceux de Rakal[a], à ceux des villes des Yerahmeélites et à ceux des villes des Qénites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rakal est aussi transcrit « Racal » dans certaines traditions anglaises.
