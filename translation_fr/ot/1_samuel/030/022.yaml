  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: fr
  text: 'Alors tous les hommes méchants et vauriens[a], parmi ceux qui avaient accompagné David, prirent la parole et dirent : « Puisqu’ils ne sont pas partis avec moi[b], nous ne leur donnerons rien du butin[c] que nous avons récupéré, si ce n’est que chacun prenne sa femme et ses enfants, les emmène et s’en aille ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Vauriens » traduit ici un terme hébreu péjoratif qui peut aussi se rendre par « sans valeur » ou « sans foi ni loi » ; il ne s’agit pas nécessairement du nom propre « Bélial ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit « avec moi ». Bien que les locuteurs forment un groupe, le texte emploie ici le singulier, puis revient au pluriel : « nous ne leur donnerons ».'
    reason: source_ambiguity
  - marker: c
    text: Ou « biens pillés ». Le terme hébreu désigne le butin ou les biens pris lors d’un conflit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: prirent la parole et dirent
  rationale: Cette formulation française naturelle conserve les deux éléments hébreux qui introduisent la réponse, sans employer le calque pesant « répondirent et dirent ».
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: tous les hommes méchants et indignes
  rationale: רָע exprime ici la méchanceté morale, tandis que בְלִיַּעַל dépeint des hommes indignes ou sans valeur. Le terme n’est pas traité comme le nom propre « Bélial ».
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: parmi ceux qui étaient partis avec David
  rationale: 'La préposition מִן a une valeur partitive : les hommes décrits forment un sous-groupe de ceux qui avaient accompagné David.'
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: La conjonction introduit la raison invoquée par les hommes pour justifier leur refus.
- source_word: לֹא הָלְכוּ עִמִּי
  choice: ils ne sont pas venus avec moi
  rationale: Le singulier « moi » est conservé, bien que le groupe parle ensuite à la première personne du pluriel, afin de ne pas effacer le changement de nombre du texte hébreu.
- source_word: לֹא נִתֵּן לָהֶם
  choice: nous ne leur donnerons rien
  rationale: L’imparfait hébreu exprime ici la résolution du groupe; le futur français en rend naturellement la force.
- source_word: מֵהַשָּׁלָל
  choice: du butin
  rationale: שָׁלָל désigne les biens pris ou repris dans un contexte de guerre. La négation « rien du butin » rend la valeur partitive de מִן.
- source_word: אֲשֶׁר הִצַּלְנוּ
  choice: que nous avons récupéré
  rationale: Le hiphil de נצל signifie sauver ou arracher à quelqu’un; appliqué aux biens repris aux pillards, « récupérer » exprime clairement le sens contextuel.
- source_word: כִּי אִם אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: à part leur femme et leurs enfants
  rationale: כִּי אִם introduit l’unique exception. בָּנָיו peut désigner les fils au sens strict ou, dans ce contexte familial, les enfants.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: Que chacun les emmène et s’en aille !
  rationale: La tournure rend les deux verbes, « conduire/emmener » et « aller/partir », ainsi que la force permissive ou injonctive de la déclaration.
theological_decisions:
- issue: Sens de בְלִיַּעַל
  choice: indignes
  alternative: sans foi ni loi; vauriens; Bélial
  rationale: Dans ce récit, בְלִיַּעַל caractérise péjorativement des personnes et ne désigne pas nécessairement une figure démoniaque. « Indignes » évite donc d’importer l’emploi plus tardif de « Bélial » comme nom propre, tout en préservant la condamnation morale.
- issue: Changement entre « moi » et « nous »
  choice: conserver « moi » puis « nous »
  alternative: harmoniser en « nous »
  rationale: Le texte hébreu porte explicitement le suffixe singulier עִמִּי, puis un verbe à la première personne du pluriel. La traduction maintient cette tension grammaticale au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste ferme et abrupt. La répétition hébraïque « répondit et dirent » est rendue idiomatiquement par « prirent la parole et dirent », tandis que le changement significatif de personne entre « moi » et « nous » est conservé et signalé.
