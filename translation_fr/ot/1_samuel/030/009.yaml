source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: fr
  text: David partit donc, lui et les six cents hommes qui étaient avec lui, et ils arrivèrent jusqu’au torrent de Besor[a]. Ceux qui restaient s’arrêtèrent là[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « torrent de Besor » peut aussi être rendu par « oued de Besor » : il s’agit d’un cours d’eau pouvant être saisonnier, ou de son lit.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « et ceux qui restaient se tinrent debout » ; on peut aussi comprendre : « et les autres restèrent là ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit donc
  rationale: Le wayyiqtol fait progresser le récit; « partit donc » rend naturellement cette succession narrative et le sens de הלך.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: lui et les six cents hommes qui étaient avec lui
  rationale: Le pronom indépendant הוּא est conservé dans sa fonction appositionnelle; אִישׁ désigne ici les hommes du groupe de combattants.
- source_word: וַיָּבֹאוּ עַד
  choice: et ils arrivèrent jusqu’à
  rationale: Le pluriel inclut David et ses hommes; עַד exprime ici le point atteint au cours du déplacement.
- source_word: נַחַל הַבְּשׂוֹר
  choice: torrent de Besor
  rationale: נַחַל peut désigner un cours d’eau, souvent intermittent, ainsi que son lit. « Torrent » est intelligible en français et convient à ce type de réalité géographique sans imposer que l’eau y coule en permanence.
- source_word: וְהַנּוֹתָרִים
  choice: ceux qui restaient
  rationale: Le participe désigne ceux qui demeuraient en arrière ou ne poursuivaient pas la marche; la formulation préserve cette valeur sans préciser davantage que le texte.
- source_word: עָמָדוּ
  choice: s’arrêtèrent là
  rationale: עמד signifie littéralement « se tenir debout », mais, dans ce contexte de déplacement, indique qu’ils s’arrêtèrent et demeurèrent sur place. « Là » explicite en français le lieu naturellement sous-entendu.
