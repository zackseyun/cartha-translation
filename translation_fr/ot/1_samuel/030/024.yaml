source:
  edition: WLC
  text: וּ/מִי֙ יִשְׁמַ֣ע לָ/כֶ֔ם לַ/דָּבָ֖ר הַ/זֶּ֑ה כִּ֞י כְּ/חֵ֣לֶק הַ/יֹּרֵ֣ד בַּ/מִּלְחָמָ֗ה וּֽ/כְ/חֵ֛לֶק הַ/יֹּשֵׁ֥ב עַל הַ/כֵּלִ֖ים יַחְדָּ֥ו יַחֲלֹֽקוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: fr
  text: 'Mais qui vous écoutera dans cette affaire ? Car la part de celui qui descend au combat sera la même que celle de celui qui reste auprès du matériel[a] : ils partageront à parts égales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès des bagages ». Le terme hébreu peut désigner des objets, de l’équipement ou des bagages.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: Mais qui
  rationale: La conjonction introduit ici la réplique de David. « Mais qui » rend naturellement en français la valeur adversative que prend le waw dans ce contexte.
- source_word: יִשְׁמַע לָכֶם
  choice: vous écoutera
  rationale: שׁמע construit avec ל peut signifier écouter, prêter attention ou obéir. Dans cette question rhétorique, « vous écoutera » exprime sans surinterprétation l'idée d'accepter leur proposition.
- source_word: לַדָּבָר הַזֶּה
  choice: dans cette affaire
  rationale: דבר désigne ici la question ou la proposition en litige, plutôt qu'une simple parole.
- source_word: כְּחֵלֶק ... וּכְחֵלֶק
  choice: la part ... sera la même que celle
  rationale: La construction comparative affirme l'équivalence des parts. Cette formulation française explicite naturellement la comparaison sans ajouter l'idée au texte.
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: celui qui descend au combat
  rationale: Le participe substantivé est conservé, ainsi que l'idiome hébreu « descendre », plutôt que d'être aplati en « combattant ».
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  choice: celui qui reste auprès du matériel
  rationale: יֹשֵׁב décrit celui qui demeure en arrière, tandis que כֵּלִים peut désigner les objets, l'équipement ou les bagages. « Matériel » convient au contexte militaire tout en gardant une portée assez large.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: ils partageront ensemble
  rationale: יַחְדָּו souligne la participation commune, et חלק désigne ici le partage ou la répartition du butin.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La formulation conserve la question rhétorique, l’idiome « descendre au combat » et la portée réglementaire de la déclaration, sans préciser davantage que l’hébreu la nature exacte du matériel gardé.
