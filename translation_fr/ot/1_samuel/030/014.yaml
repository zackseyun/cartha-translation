base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: fr
  text: Nous avons fait une incursion dans le Néguev des Kéréthiens[a], dans le territoire appartenant à Juda et dans le Néguev de Caleb ; et nous avons livré Tsiklag aux flammes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre translittération : « Kerétiens ».'
    reason: Variante de translittération du nom du peuple.
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: nous avons mené des raids
  rationale: Dans ce contexte militaire, le verbe désigne une incursion de pillage. Cette tournure française est naturelle et conserve la valeur du verbe.
- source_word: נֶגֶב
  choice: Néguev
  rationale: Le terme désigne ici la région aride du sud plutôt qu’une simple direction géographique. Le nom propre usuel en français préserve cette nuance.
- source_word: הַכְּרֵתִי
  choice: les Kerétiens
  rationale: Il s’agit du nom d’un peuple. « Kerétiens » suit de près les consonnes hébraïques et demeure intelligible en français biblique.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: sur le territoire qui appartient à Juda
  rationale: La préposition prolonge la liste des zones visées par les raids, tandis que la relative exprime l’appartenance à Juda. « Territoire » explicite naturellement le référent spatial implicite.
- source_word: נֶגֶב כָּלֵב
  choice: le Néguev de Caleb
  rationale: La formule désigne vraisemblablement le district méridional associé à Caleb ou à son clan. La structure hébraïque est conservée sans trancher davantage.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: nous avons livré Tsiqlag aux flammes
  rationale: Cette expression française rend à la fois l’action de brûler et la mention explicite du feu, sans redondance maladroite.
- source_word: צִקְלַג
  choice: Tsiqlag
  rationale: Translittération française transparente du nom de lieu hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination conserve l’énumération des trois zones attaquées ; le point-virgule distingue l’incendie de Tsiqlag du récit des raids.
