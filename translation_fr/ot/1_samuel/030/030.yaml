  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: fr
  text: à ceux de Horma, à ceux de Bor-Ashan[a] et à ceux d’Athak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bor-Ashan est un nom de lieu ; ses éléments peuvent littéralement évoquer un « puits de fumée » ou une « fosse de fumée », mais le nom est translittéré plutôt que traduit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: à ceux de
  rationale: Dans cette liste de destinataires, la combinaison de la conjonction, de la préposition ל et du relatif אֲשֶׁר désigne idiomatiquement les habitants des lieux cités. « À ceux de » exprime naturellement en français le bénéficiaire et l’appartenance locale; la coordination finale suffit, sans répéter systématiquement « et ».
- source_word: בְּחָרְמָה
  choice: de Horma
  rationale: Le préfixe locatif ב situe les destinataires à Horma. Après « ceux », le français idiomatique emploie « de » pour désigner les gens du lieu.
- source_word: בְּבוֹר עָשָׁן
  choice: de Bor-Ashân
  rationale: Il s’agit d’un nom de lieu composé, translittéré plutôt que traduit. Le trait d’union le présente comme un seul toponyme.
- source_word: בַּעֲתָךְ
  choice: d’Atak
  rationale: Nom de lieu précédé du préfixe locatif ב. « Ceux d’Atak » est la formulation française naturelle pour les habitants ou personnes présentes dans cette localité.
