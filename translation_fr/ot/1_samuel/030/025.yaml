  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: fr
  text: 'Il en fut ainsi à partir de ce jour-là : David en fit une prescription et une règle pour Israël, jusqu’à ce jour[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il l’établit comme prescription et comme décision normative pour Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Dès ce jour-là et par la suite
  rationale: Dans cette construction, וַיְהִי introduit l’état de choses qui s’établit à partir de ce moment. En français, il est plus naturel de l’intégrer à l’expression temporelle que de traduire littéralement « et il en fut ainsi ».
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: dès ce jour-là et par la suite
  rationale: Cette expression marque le point de départ et la continuation dans le temps; la formulation retenue est actuelle et conserve cette valeur durative.
- source_word: וַיְשִׂמֶהָ
  choice: David en fit
  rationale: שׂים signifie ici établir ou faire de la pratique précédente une norme. Le suffixe féminin est naturellement rendu par « en », et le sujet implicite est explicité par « David » pour la clarté en français.
- source_word: לְחֹק
  choice: une prescription
  rationale: חֹק désigne ce qui est fixé ou prescrit. « Prescription » garde la portée normative sans suggérer nécessairement une loi écrite au sens moderne.
- source_word: וּלְמִשְׁפָּט
  choice: et une règle
  rationale: מִשְׁפָּט peut désigner un jugement, une décision normative ou une règle. En parallèle avec חֹק, « règle » exprime ici une norme applicable à Israël tout en maintenant la distinction lexicale.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: La préposition ל indique le peuple auquel cette norme s’applique.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française établie qui conserve le point de vue temporel du narrateur et affirme la persistance de la pratique jusqu’à son époque.
