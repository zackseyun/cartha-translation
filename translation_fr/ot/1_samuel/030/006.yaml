  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: fr
  text: 'David fut alors dans une très grande détresse, car le peuple parlait de le lapider : tous étaient profondément amers[a], chacun à cause de ses fils et de ses filles. Mais David puisa des forces en Yahweh, son Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’âme de tout le peuple était amère ».'
    reason: L’hébreu emploie une image concrète où נֶפֶשׁ (« âme, être intérieur, vie ») est le siège de leur profonde amertume.
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: David fut alors dans une très grande détresse
  rationale: La construction impersonnelle avec לְדָוִד exprime la situation extrêmement pénible dans laquelle David se trouve; cette formulation française est naturelle et conserve l’intensité de מְאֹד.
- source_word: הָעָם
  choice: les hommes
  rationale: Dans ce contexte, le collectif désigne les hommes de la troupe de David. « Les hommes » identifie naturellement le référent en français sans suggérer toute une population.
- source_word: אָמְרוּ ... לְסָקְלוֹ
  choice: parlaient de le lapider
  rationale: L’infinitif après אָמְרוּ évoque l’action projetée ou discutée; « parlaient de » évite de présenter la lapidation comme déjà commencée.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: tous étaient profondément amers
  rationale: Littéralement, « l’âme de tout le peuple était amère ». La formulation choisie rend clairement en français l’état collectif d’amertume intense tout en signalant l’image hébraïque en note.
- source_word: אִישׁ
  choice: chacun
  rationale: Employé distributivement, אִישׁ individualise chaque homme du groupe; « chacun » est précis et naturel après « les hommes ».
- source_word: עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: à cause de ses fils et de ses filles
  rationale: עַל indique ici la cause de leur profonde amertume et de leur douleur.
- source_word: וַיִּתְחַזֵּק
  choice: puisa des forces
  rationale: Le hitpael présente David comme trouvant ou prenant lui-même des forces. « Puisa des forces » rend naturellement cette valeur moyenne ou réflexive sans préciser davantage le mécanisme.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: en Yahweh, son Dieu
  rationale: La préposition בְּ présente Yahweh comme la source ou la sphère de la force de David; le nom divin est translittéré afin de conserver le nom propre de l’hébreu.
theological_decisions:
- issue: Sens de la force trouvée par David en Yahweh
  choice: David puisa des forces en Yahweh, son Dieu
  alternative: David se fortifia en Yahweh, son Dieu
  rationale: Le texte attribue à David une réponse active tout en désignant Yahweh comme la source ou la sphère de sa force. La traduction ne précise pas si cette force vient de la prière, du souvenir des promesses ou d’un autre moyen.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le distingue du titre אֲדֹנָי et préserve son caractère personnel et covenantiel sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le verset conserve la forte opposition entre la détresse de David, l’amertume de ses hommes et les forces qu’il trouve en son Dieu. Le deux-points explicite le lien causal déjà marqué en hébreu.
