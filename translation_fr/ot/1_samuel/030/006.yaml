  verdict: revise
  source_fidelity: La traduction rend correctement la grande détresse de David, le projet de lapidation, l’amertume collective causée par les fils et les filles, et le fait que David se fortifie en Yahweh. Toutefois, הָעָם est rendu deux fois par « les hommes » ou implicitement par « tous », alors que l’hébreu emploie explicitement « le peuple »; le contexte permet de comprendre qu’il s’agit de ses hommes, mais le texte ne le spécifie pas.
  naturalness: Le français est moderne, clair et de registre narratif approprié. « Profondément amers » et « puisa des forces en Yahweh » sont naturels. Le maintien de « le peuple » reste idiomatique et respecte mieux la répétition du texte source.
  terminology: « Yahweh, son Dieu » rend fidèlement יהוה אֱלֹהָיו. « Lapider » est exact. La note explique adéquatement l’expression hébraïque נֶפֶשׁ sans lui imposer un sens doctrinal.
