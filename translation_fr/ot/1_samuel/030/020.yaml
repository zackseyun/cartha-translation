  text: וַ/יִּקַּ֣ח דָּוִ֔ד אֶת כָּל הַ/צֹּ֖אן וְ/הַ/בָּקָ֑ר נָהֲג֗וּ לִ/פְנֵי֙ הַ/מִּקְנֶ֣ה הַ/ה֔וּא וַ/יֹּ֣אמְר֔וּ זֶ֖ה שְׁלַ֥ל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: fr
  text: 'David prit tout le petit et le gros bétail. Ils les poussèrent devant ce bétail-là[a] et dirent : « Voici le butin de David. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le référent de « ce bétail-là » n’est pas explicitement précisé en hébreu. Il s’agit probablement du bétail récupéré auparavant, devant lequel les animaux nouvellement pris furent poussés pour être présentés comme le butin de David.
    reason: ambiguïté référentielle et contexte narratif
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie normalement « prendre » dans ce récit. « S’empara de » accentuerait inutilement l’idée de violence.
- source_word: כָּל הַצֹּאן וְהַבָּקָר
  choice: tout le petit et le gros bétail
  rationale: צֹאן désigne collectivement les ovins et les caprins, tandis que בָּקָר désigne les bovins. Cette formulation française conserve la distinction sans énumération explicative.
- source_word: נָהֲגוּ
  choice: ils les poussèrent
  rationale: נהג décrit ici l’action de faire avancer du bétail. Le pronom objet, implicite en hébreu, renvoie naturellement aux animaux qui viennent d’être mentionnés.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme indique une position en avant, ici dans le mouvement d’un groupe d’animaux.
- source_word: הַמִּקְנֶה הַהוּא
  choice: ce bétail-là
  rationale: מקנה est un collectif désignant le bétail, et le démonstratif הַהוּא est conservé. Cette traduction évite de préciser dans le corps du texte un référent que l’hébreu ne nomme pas explicitement.
- source_word: וַיֹּאמְרוּ
  choice: et dirent
  rationale: La forme verbale est explicitement au pluriel; le français permet de conserver le sujet « ils » de la proposition précédente.
- source_word: זֶה שְׁלַל דָּוִד
  choice: Voici le butin de David
  rationale: שׁלל désigne le butin pris lors d’un raid ou d’un combat. « Voici » rend naturellement la désignation introduite par זֶה, sans forcer l’accord avec les animaux.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Petit et gros bétail » est une expression courante dans les contextes bibliques et agricoles; elle restitue précisément les deux catégories hébraïques. Le démonstratif est maintenu afin de préserver l’ambiguïté du texte source.
