  text: וַ/יֹּ֣רִדֵ֔/הוּ וְ/הִנֵּ֥ה נְטֻשִׁ֖ים עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ אֹכְלִ֤ים וְ/שֹׁתִים֙ וְ/חֹ֣גְגִ֔ים בְּ/כֹל֙ הַ/שָּׁלָ֣ל הַ/גָּד֔וֹל אֲשֶׁ֥ר לָקְח֛וּ מֵ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים וּ/מֵ/אֶ֥רֶץ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: fr
  text: Il le fit descendre. Et voici qu’ils étaient éparpillés dans toute la région[a], mangeant, buvant et faisant la fête à cause de tout l’important butin[b] qu’ils avaient emporté du pays des Philistins et du pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « répandus dans toute la région ». Le participe hébreu peut souligner soit leur dispersion, soit la vaste surface qu’ils occupaient.
    reason: lexical_alternative
  - marker: b
    text: Ou « faisant la fête avec tout l’important butin ». La préposition hébraïque peut indiquer le motif de leurs réjouissances ou les circonstances dans lesquelles elles avaient lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: Il le conduisit en bas
  rationale: Le hiphil de ירד signifie « faire descendre, conduire en bas ». Le contexte présente l’homme comme guide de David; cette formulation conserve à la fois l’idée de direction et celle de conduite.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette formule narrative attire vivement l’attention sur la scène découverte, sans employer le plus archaïque « voici » isolé.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ils étaient dispersés sur toute l’étendue du pays
  rationale: Le participe passif décrit un groupe largement répandu ou dispersé. « Toute l’étendue du pays » rend l’idiome spatial עַל־פְּנֵי et garde la portée locale imposée par le contexte.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: mangeant, buvant et faisant la fête
  rationale: Les trois participes dépeignent des actions simultanées en cours. La traduction conserve leur succession et rend חֹגְגִים par une expression française actuelle et naturelle.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: à cause de tout l’immense butin
  rationale: La préposition ב peut indiquer ici le motif ou l’occasion des réjouissances. « Butin » convient au contexte militaire, et « immense » exprime naturellement l’ampleur indiquée par גָּדוֹל.
- source_word: אֲשֶׁר לָקְחוּ
  choice: qu’ils avaient pris
  rationale: Le plus-que-parfait français indique naturellement que la prise du butin précède les réjouissances.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: au pays des Philistins et au pays de Juda
  rationale: La répétition de « au pays de » préserve le parallélisme territorial du texte hébreu. Avec le verbe « prendre », le français emploie naturellement « prendre quelque chose à un pays ou à un peuple » pour en indiquer la provenance spoliée.
