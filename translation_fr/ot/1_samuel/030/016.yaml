  naturalness: 'La révision emploie un français narratif moderne et international : « Il le fit descendre » est naturel, tandis que « en bas » sonne oral et spatialement imprécis dans ce contexte. « Éparpillés dans toute la région » exprime naturellement l’étendue locale sans suggérer « toute la terre ».'
  terminology: « Butin » convient au contexte de razzia. « Philistins » et « Juda » sont conservés. Les notes sont rattachées aux expressions qu’elles expliquent réellement, plutôt qu’à des segments non concernés.
