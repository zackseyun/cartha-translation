base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: fr
  text: 'David lui demanda : « Me feras-tu descendre vers cette bande de pillards[a] ? » Il répondit : « Jure-moi par Dieu que tu ne me tueras pas et que tu ne me livreras pas aux mains de mon maître, et je te ferai descendre vers cette bande de pillards. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette troupe » ; le terme hébreu désigne ici un groupe armé qui mène des raids.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  choice: Me conduiras-tu jusqu’à
  rationale: Le hiphil de ירד est causatif et comporte une nuance directionnelle, littéralement « me feras-tu descendre ». En français, « conduire jusqu’à » exprime naturellement ici le fait de guider David vers le groupe, sans imposer une descente topographique peu claire.
- source_word: הַגְּדוּד
  choice: bande de pillards
  rationale: גדוד désigne ici le groupe armé et maraudeur des Amalécites qui avait pillé Tsiqlag. « Bande de pillards » rend plus précisément ce caractère qu’un simple « groupe » ou « détachement ».
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: Jure-moi par Dieu
  rationale: L’impératif niphal et le complément introduit par ב expriment un serment solennel avec invocation de Dieu. Cette formulation est directe et idiomatique en français.
- source_word: אִם תְּמִיתֵנִי
  choice: que tu ne me tueras pas
  rationale: Dans cette formule de serment, אִם a une valeur négative elliptique. Le français doit expliciter la négation demandée.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: que tu ne me livreras pas aux mains de mon maître
  rationale: Le hiphil de סגר signifie ici livrer quelqu’un au pouvoir d’un autre. « Aux mains de » conserve l’image hébraïque de domination tout en restant naturel en français.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Le mot désigne le propriétaire humain du serviteur égyptien, non Dieu. « Maître » exprime clairement cette relation.
- source_word: וְאוֹרִדְךָ
  choice: alors je te conduirai jusqu’à
  rationale: Le hiphil de ירד répond au verbe employé dans la question. « Alors » rend naturellement la relation conditionnelle créée par le serment demandé, tandis que « conduirai jusqu’à » décrit l’action de guider David vers le groupe.
