id: 1SA.30.23
reference: 1 Samuel 30:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: fr
  text: 'Mais David dit : « N’agissez pas ainsi, mes frères, avec ce que Yahweh nous a donné[a]. Il nous a protégés[b] et il a livré entre nos mains[c] la bande de pillards qui était venue contre nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « au sujet de ce que Yahweh nous a donné ». La construction hébraïque est condensée et introduit la question dont David parle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Il nous a gardés » ou « Il nous a préservés ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dans notre main », expression hébraïque signifiant « en notre pouvoir ».'
    reason: idiom
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: N’agissez pas ainsi
  rationale: Cette formulation rend l’interdiction directe adressée à plusieurs personnes dans un français moderne et ferme.
- source_word: אֶחָי
  choice: mes frères
  rationale: Le terme signifie littéralement « mes frères » et constitue ici l’adresse fraternelle de David à ses hommes.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: avec ce que Yahweh nous a donné
  rationale: 'La construction hébraïque est resserrée et introduit ce sur quoi porterait l’action condamnée : les biens reçus de Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: Il nous a protégés
  rationale: Dans ce contexte militaire, שׁמר exprime la garde et la protection assurées par Dieu.
- source_word: הַגְּדוּד
  choice: la bande de pillards
  rationale: Dans le contexte, גְּדוּד désigne la troupe ennemie qui avait mené un raid, et non une unité militaire générique.
- source_word: הַבָּא עָלֵינוּ
  choice: qui était venue contre nous
  rationale: Cette traduction conserve à la fois l’idée de mouvement et la nuance hostile de la tournure hébraïque.
- source_word: בְּיָדֵנוּ
  choice: entre nos mains
  rationale: L’expression française conserve l’image hébraïque de la main comme symbole de pouvoir ou de maîtrise, tout en restant naturelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Rôle de Yahweh dans la victoire
  choice: Il nous a protégés et il a livré l’ennemi entre nos mains
  alternative: Il nous a gardés et nous a donné la bande ennemie
  rationale: 'La traduction maintient les deux affirmations distinctes du texte : la protection des hommes de David et la remise de leurs adversaires en leur pouvoir, sans atténuer l’attribution de la victoire à Yahweh.'
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse « mes frères » et le nom « Yahweh » sont conservés. Le discours reste ferme sans adopter une tournure archaïque.
