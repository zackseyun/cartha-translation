base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: fr
  text: 'David lui dit : « À qui appartiens-tu et d’où viens-tu ? » Il répondit : « Je suis un jeune Égyptien, esclave d’un Amalécite. Mon maître m’a abandonné parce que je suis tombé malade il y a trois jours. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: À qui appartiens-tu ?
  rationale: Littéralement « à qui es-tu ? » ; cette formulation naturelle en français conserve l’idée d’appartenance ou de dépendance impliquée par le contexte servile.
- source_word: נַעַר מִצְרִי
  choice: un jeune Égyptien
  rationale: נַעַר désigne ici un jeune homme ; « jeune Égyptien » est idiomatique et fidèle sans suggérer nécessairement un enfant.
- source_word: עֶבֶד
  choice: esclave
  rationale: Dans ce contexte, le personnage appartient à un maître qui l’abandonne ; « esclave » rend plus précisément la condition exprimée que le plus large « serviteur ».
- source_word: וַיַּעַזְבֵנִי
  choice: m’a abandonné
  rationale: Le verbe עזב exprime ici le fait de laisser sur place et d’abandonner.
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: parce que je suis tombé malade il y a trois jours
  rationale: L’hébreu emploie une tournure idiomatique, littéralement proche de « car je suis tombé malade, aujourd’hui trois [jours] » ; le français explicite naturellement le repère temporel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste direct et naturel ; la question initiale conserve l’idée sociale d’appartenance présente dans l’hébreu.
