source:
  edition: WLC
  text: וַ/יִּתְּנוּ ל/וֹ֩ פֶ֨לַח דְּבֵלָ֜ה וּ/שְׁנֵ֤י צִמֻּקִים֙ וַ/יֹּ֔אכַל וַ/תָּ֥שָׁב רוּח֖/וֹ אֵלָ֑י/ו כִּ֠י לֹֽא אָ֤כַל לֶ֨חֶם֙ וְ/לֹא שָׁ֣תָה מַ֔יִם שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: fr
  text: Ils lui donnèrent un morceau de gâteau de figues[a] et deux gâteaux de raisins secs[b]. Il mangea, et son esprit lui revint[c], car il n’avait pas mangé de pain ni bu d’eau depuis trois jours et trois nuits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit d’une préparation faite de figues pressées.
    reason: cultural_note
  - marker: b
    text: Ou « deux grappes de raisins secs »; la forme exacte de ces portions est incertaine.
    reason: lexical_alternative
  - marker: c
    text: Ou « il reprit des forces » ou « il revint à lui »; littéralement, « son esprit lui revint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: un morceau de gâteau de figues
  rationale: פֶלַח désigne un morceau ou une tranche, et דְּבֵלָה une masse de figues pressées. « Gâteau de figues » est naturel en français tout en désignant cette préparation ancienne.
- source_word: שְׁנֵי צִמֻּקִים
  choice: deux gâteaux de raisins secs
  rationale: צִמֻּקִים désigne ici des unités de raisins secs, vraisemblablement pressés en gâteaux. Cette traduction s’accorde avec l’usage du terme ailleurs dans Samuel, sans masquer l’autre analyse possible en « grappes ».
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: son esprit lui revint
  rationale: La traduction conserve littéralement l’image hébraïque. Dans le contexte, l’expression signifie qu’il reprit vie ou retrouva ses forces, sens signalé en note.
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens concret de לֶחֶם convient dans la tournure parallèle « mangé de pain ni bu d’eau »; il n’est pas nécessaire de le généraliser en « nourriture ».
- source_word: שָׁתָה מַיִם
  choice: bu d’eau
  rationale: La formulation conserve la mention précise de l’eau dans le texte hébreu.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: trois jours et trois nuits
  rationale: Traduction directe de l’expression temporelle hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l’image hébraïque de l’esprit qui revient tout en l’expliquant en note, et emploie des désignations alimentaires compréhensibles sans moderniser excessivement les réalités anciennes.
