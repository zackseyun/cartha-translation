base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: fr
  text: 'David consulta le SEIGNEUR : « Dois-je poursuivre cette bande de pillards ? Les rattraperai-je ? » Le SEIGNEUR lui répondit : « Poursuis-les, car tu les rattraperas à coup sûr et tu réussiras assurément à délivrer[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne précise pas l’objet de « délivrer ». Dans le contexte, la promesse concerne ce qui a été emmené lors du raid, notamment les personnes capturées.
    reason: Préserve l’ellipse de l’hébreu dans le texte tout en donnant au lecteur le contexte nécessaire.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consulta le SEIGNEUR
  rationale: « Consulter le SEIGNEUR » exprime naturellement en français la démarche de recherche d’une réponse divine, tout en restant proche de l’hébreu.
- source_word: הַגְּדוּד
  choice: cette bande de pillards
  rationale: Dans le contexte, גְּדוּד désigne le groupe armé qui a mené le raid; cette formulation est claire et idiomatique.
- source_word: הַאַשִּׂגֶנּוּ
  choice: Les rattraperai-je ?
  rationale: Le verbe נשׂג exprime ici l’idée d’atteindre ou de rejoindre des fuyards; le suffixe singulier renvoie collectivement à la bande, rendue naturellement par le pluriel en français.
- source_word: הַשֵּׂג תַּשִּׂיג
  choice: tu les rattraperas à coup sûr
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie la certitude; « à coup sûr » restitue cette emphase.
- source_word: וְהַצֵּל תַּצִּיל
  choice: tu délivreras les captifs
  rationale: La construction emphatique promet une délivrance certaine. L’objet n’est pas exprimé dans ce verset, mais le contexte immédiat indique les personnes emmenées captives.
theological_decisions:
- issue: Identification de celui qui répond à David
  choice: Le SEIGNEUR lui répondit
  alternative: Il lui répondit
  rationale: Le sujet de וַיֹּאמֶר est grammaticalement implicite. Le contexte l’identifie comme le SEIGNEUR; le nommer évite une ambiguïté artificielle en français sans ajouter une interprétation doctrinale.
- issue: Portée de la promesse finale
  choice: tu délivreras les captifs
  alternative: tu délivreras certainement
  rationale: L’hébreu laisse l’objet non exprimé, mais le contexte narratif fournit clairement les captifs. L’ajout explicatif est retenu pour produire un français complet et naturel.
translation_notes:
  register: Français international moderne, narratif et digne. Questions directes concises; répétitions emphatiques hébraïques rendues idiomatiquement sans alourdir le verset.
