base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/004.yaml
  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: fr
  text: Alors David et les gens qui étaient avec lui élevèrent la voix et pleurèrent jusqu’à ne plus avoir la force de pleurer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « jusqu’à ce qu’il n’y ait plus en eux de force pour pleurer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: élevèrent la voix
  rationale: L’expression idiomatique נָשָׂא אֶת־קוֹל signifie « élever la voix ». Le français emploie naturellement le singulier collectif « la voix », comme l’hébreu.
- source_word: וַיִּבְכּוּ
  choice: pleurèrent
  rationale: בכה désigne l’action de pleurer. Ce choix convient au registre narratif solennel et évite la possible ambiguïté de « crier ».
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: jusqu’à ne plus avoir la force
  rationale: Cette formulation française naturelle exprime l’épuisement complet littéralement décrit par « il n’y avait plus de force en eux ».
- source_word: לִבְכּוֹת
  choice: de pleurer
  rationale: La répétition de « pleurer » conserve l’insistance lexicale du texte hébreu.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: les gens qui étaient avec lui
  rationale: עָם signifie ici collectivement les personnes accompagnant David. « Les gens » reste général sans préciser « hommes » ou « soldats », termes que ce verset n’emploie pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique écrit. « Élevèrent la voix » conserve l’image hébraïque tout en étant idiomatique en français.
