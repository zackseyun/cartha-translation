base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: fr
  text: David les frappa depuis le crépuscule[a] jusqu’au soir du lendemain. Pas un seul d’entre eux n’échappa, à l’exception de quatre cents jeunes hommes qui s’enfuirent à dos de chameau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « depuis l’aube » : le mot hébreu peut désigner le crépuscule du matin comme celui du soir. Certains comprennent ici qu’il s’agit des premières lueurs du jour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: les frappa
  rationale: Dans ce contexte militaire, נכה désigne le fait de frapper violemment et de mettre en déroute. « Les frappa » conserve la force du verbe sans préciser davantage que l’hébreu si chaque adversaire fut tué.
- source_word: מֵהַנֶּשֶׁף
  choice: depuis le crépuscule
  rationale: נֶשֶׁף peut désigner la pénombre du soir ou celle du matin. « Crépuscule » conserve cette ambiguïté lexicale, même si en français le mot évoque plus spontanément le soir; la note signale l’autre possibilité.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: jusqu’au soir du lendemain
  rationale: Cette formulation française naturelle rend une action qui se prolonge jusqu’au soir du jour suivant.
- source_word: נִמְלַט מֵהֶם אִישׁ
  choice: Pas un seul d’entre eux n’échappa
  rationale: Le singulier distributif אִישׁ exprime ici une totalité emphatique. « Pas un seul » la restitue clairement et naturellement.
- source_word: כִּי אִם
  choice: à l’exception de
  rationale: L’expression introduit l’exception apportée à l’affirmation générale précédente.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: quatre cents jeunes hommes
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Le contexte de combattants capables de fuir à dos de chameau favorise « jeunes hommes », sans suggérer l’enfance ni un statut servile.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: montèrent sur les chameaux
  rationale: La formulation garde l’idée explicite de monter sur les chameaux et convient au mouvement de fuite décrit dans la proposition.
- source_word: וַיָּנֻסוּ
  choice: et s’enfuirent
  rationale: נוּס signifie fuir. « S’enfuirent » maintient la distinction avec נִמְלַט, rendu auparavant par « échappa ».
