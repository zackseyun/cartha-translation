lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: à ceux de
  rationale: Dans cette liste de destinataires, לְ avec אֲשֶׁר indique à qui David envoie une part. En français, « à ceux de » exprime naturellement le datif et l’appartenance locale.
- source_word: בְּבֵית אֵל
  choice: de Béthel
  rationale: בֵית אֵל est ici un nom de lieu. Après « ceux », le français idiomatique emploie « de » pour désigner les habitants ou les personnes qui se trouvent à Béthel.
- source_word: בְּרָמוֹת נֶגֶב
  choice: de Ramoth-du-Néguev
  rationale: L’expression est traitée comme un toponyme composé. « du Néguev » conserve le nom géographique tout en laissant ouverte la relation précise entre רָמוֹת et נֶגֶב.
- source_word: בְּיַתִּר
  choice: de Yattir
  rationale: Nom de lieu translittéré selon une forme proche de l’hébreu; « de » s’accorde naturellement avec la tournure française « ceux de ».
- source_word: וְ
  choice: et
  rationale: Conjonction simple reliant le dernier élément de l’énumération.
