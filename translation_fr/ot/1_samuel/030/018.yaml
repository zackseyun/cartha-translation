  text: וַ/יַּצֵּ֣ל דָּוִ֔ד אֵ֛ת כָּל אֲשֶׁ֥ר לָקְח֖וּ עֲמָלֵ֑ק וְ/אֶת שְׁתֵּ֥י נָשָׁ֖י/ו הִצִּ֥יל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/018.yaml
  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: fr
  text: David récupéra tout ce qu’Amaléc avait pris[a], et David délivra ses deux épouses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivra » dans les deux propositions. L’hébreu emploie le même verbe dans les deux cas, mais le français dit plus naturellement « récupéra » pour ce qui avait été pris et « délivra » pour les épouses de David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: récupéra / délivra
  rationale: Le même verbe hébreu est employé deux fois. Avec « tout ce qu’Amaléc avait pris », « récupéra » exprime naturellement le fait de reprendre ce qui avait été enlevé ; avec les deux épouses de David, « délivra » convient mieux en français. La note signale cette variation contextuelle.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: tout ce qu’Amaléc avait pris
  rationale: Cette formulation rend directement כָּל אֲשֶׁר. Le plus-que-parfait situe clairement la prise avant l’action de David dans la séquence narrative.
- source_word: עֲמָלֵק
  choice: Amaléc
  rationale: Le nom propre singulier du texte hébreu est conservé ; il désigne ici collectivement le peuple amalécite.
- source_word: שְׁתֵּי נָשָׁיו
  choice: ses deux épouses
  rationale: « Épouses » exprime sans ambiguïté le sens matrimonial de נָשִׁים dans ce contexte, tout en conservant explicitement le nombre deux.
- source_word: דָּוִד ... דָּוִד
  choice: David… David
  rationale: La répétition du nom dans l’hébreu est maintenue afin d’en préserver l’insistance et la structure.
