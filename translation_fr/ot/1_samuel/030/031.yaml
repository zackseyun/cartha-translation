  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: fr
  text: à ceux qui étaient à Hébron, et à tous les lieux où David et ses hommes avaient circulé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’étaient déplacés » ou « étaient allés de lieu en lieu ». Le verbe hébreu suggère des déplacements répétés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר בְּחֶבְרוֹן
  choice: à ceux qui étaient à Hébron
  rationale: La préposition et le relatif poursuivent la liste des destinataires du verset précédent. Le pluriel implicite se rend naturellement par « ceux qui étaient ».
- source_word: וּלְכָל הַמְּקֹמוֹת
  choice: et dans tous les lieux
  rationale: Bien que לְ signifie normalement « à », le français exprime ici plus naturellement l’étendue des lieux fréquentés par « dans tous les lieux », sans changer le sens locatif de la proposition.
- source_word: אֲשֶׁר ... שָׁם
  choice: où
  rationale: Avec « lieux » comme antécédent, « où » intègre naturellement le relatif אֲשֶׁר et l’adverbe locatif שָׁם, qu’il serait redondant de traduire séparément.
- source_word: הִתְהַלֶּךְ
  choice: avaient circulé
  rationale: La forme hitpael de הלך évoque ici des déplacements répétés ou d’un lieu à l’autre. « avaient circulé » conserve cette nuance sans réduire le verbe à une seule marche.
- source_word: דָּוִד הוּא וַאֲנָשָׁיו
  choice: David et ses hommes
  rationale: Le pronom הוּא reprend David dans une construction appositionnelle. Le français naturel n’exige pas « lui-même », qui risquerait d’ajouter une insistance excessive; אֲנָשָׁיו désigne ici les hommes de sa troupe.
