source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: fr
  text: 'Quand David arriva à Tsiklag, il envoya une partie du butin aux anciens de Juda, ses amis, en leur disant : « Voici pour vous un présent[a] provenant du butin pris aux ennemis de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une bénédiction pour vous ». Le mot hébreu signifie « bénédiction », mais il désigne ici un présent matériel tiré du butin.
    reason: Alternative lexicale préservant le sens littéral et sa résonance théologique.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Quand David arriva
  rationale: Le wayyiqtol fait progresser le récit, mais l’action suivante constitue l’apodose naturelle en français ; « Quand » exprime clairement la succession temporelle.
- source_word: צִקְלַג
  choice: Tsiklag
  rationale: Translittération française usuelle du nom propre hébreu, avec « Ts » pour צ.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: il envoya une partie du butin
  rationale: La préposition מִן indique qu’il envoya quelque chose prélevé sur l’ensemble du butin ; « une partie du butin » explicite naturellement ce sens partitif.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: aux anciens de Juda
  rationale: Rendu direct ; les « anciens » sont ici les dirigeants reconnus de Juda.
- source_word: לְרֵעֵהוּ
  choice: qui étaient ses amis
  rationale: רֵעַ peut désigner un ami, un compagnon ou un proche. Dans ce contexte relationnel et politique, « ses amis » conserve le sens sans préciser indûment la nature de leur alliance.
- source_word: הִנֵּה לָכֶם
  choice: Voici pour vous
  rationale: « Voici » restitue la valeur déictique de הִנֵּה dans un français actuel et digne, sans l’archaïsme de « voici que ».
- source_word: בְּרָכָה
  choice: un présent
  rationale: Le mot signifie littéralement « bénédiction », mais désigne ici un don matériel tiré du butin. « Présent » convient à la formule d’offre et garde une nuance favorable ; le sens littéral est signalé en note.
- source_word: מִשְּׁלַל
  choice: provenant du butin pris
  rationale: « Provenant du butin » rend מִן ; l’ajout naturel de « pris » clarifie qu’il s’agit du butin obtenu sur les ennemis sans changer le référent.
- source_word: אֹיְבֵי יְהוָה
  choice: aux ennemis de Yahweh
  rationale: Le groupe construit présente ces adversaires comme les ennemis de Yahweh ; la formulation française conserve cette qualification théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom divin sans lui substituer un titre traditionnel.
- issue: Valeur de בְּרָכָה dans un contexte de distribution matérielle
  choice: un présent, avec « bénédiction » en note
  alternative: une bénédiction
  rationale: Le contexte immédiat montre que David envoie une part concrète du butin. Le texte principal exprime ce référent matériel, tandis que la note conserve la portée lexicale et théologique du terme hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. « Butin », « anciens » et « présent » restent accessibles sans être familiers. La syntaxe évite les tournures archaïques tout en conservant la solennité sobre du récit.
