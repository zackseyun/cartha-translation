  naturalness: 'La phrase est compréhensible et de registre approprié, mais l’enchaînement « depuis le plus petit jusqu’au plus grand, ni fils ni filles » est plus fluide avec une construction négative explicite et parallèle : « ni du plus petit au plus grand, ni fils ni filles… ».'
