base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: fr
  text: 'Il ne leur manquait rien : ni du plus petit au plus grand, ni fils ni filles, ni butin, ni rien de tout ce qu’ils avaient pris pour eux-mêmes[a]. David ramena tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « tout ce qu’ils avaient pris pour eux-mêmes ». Dans le contexte, il s’agit de ce que les Amalécites avaient pris aux gens de David.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: ne manquait
  rationale: Le niphal de עדר exprime ici l’absence ou le manque après la récupération; « ne manquait » est naturel et convient aussi bien aux personnes qu’aux biens.
- source_word: לָהֶם
  choice: de ce qui leur appartenait
  rationale: Le datif indique ici ceux auxquels les personnes et les biens appartenaient; cette formulation idiomatique rend clairement la relation de possession.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: depuis le plus petit jusqu’au plus grand
  rationale: Cette tournure conserve le mérisme hébreu et son ambiguïté possible entre âge, taille ou importance, sans le réduire à une seule interprétation.
- source_word: בָּנִים וּבָנוֹת
  choice: fils ni filles
  rationale: L’hébreu nomme explicitement les enfants des deux sexes; la négation distributive « ni… ni… » s’intègre naturellement à la phrase française.
- source_word: מִשָּׁלָל
  choice: butin
  rationale: « Butin » est le terme français courant et précis pour les biens emportés lors d’un raid.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: rien de tout ce qu’ils avaient pris pour eux-mêmes
  rationale: La formulation garde le sujet implicite fourni par le contexte, les Amalécites, et conserve le pronom réfléchi לָהֶם plutôt que de le transformer silencieusement en « pris aux gens de David ».
- source_word: הַכֹּל הֵשִׁיב
  choice: David ramena tout
  rationale: Le hiphil de שוב décrit concrètement le fait de faire revenir ou de rapporter ce qui avait été emporté.
- source_word: דָּוִד
  choice: David
  rationale: Forme française traditionnelle et standard du nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La structure en « ni… ni… » rend la portée de la négation naturelle en français. Le mérisme « depuis le plus petit jusqu’au plus grand » est conservé afin de ne pas trancher entre âge, taille et importance.
