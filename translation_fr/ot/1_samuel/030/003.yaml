  yaml_path: translation/ot/1_samuel/030/003.yaml
  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: fr
  text: Quand David et ses hommes arrivèrent à la ville, ils virent qu’elle avait été incendiée et que leurs femmes, leurs fils et leurs filles avaient été emmenés en captivité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ils virent que
  rationale: Dans ce récit, la particule attire l’attention sur ce que David et ses hommes découvrent à leur arrivée. Cette formulation française naturelle conserve l’effet de constat soudain sans recourir à l’archaïque « voici ».
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: avait été incendiée
  rationale: Le participe passif avec « par le feu » décrit l’état résultant d’une destruction antérieure. Le plus-que-parfait marque clairement que l’incendie avait précédé leur arrivée; « incendiée » rend naturellement en français l’idée explicite du feu.
- source_word: נִשְׁבּוּ
  choice: avaient été emmenés en captivité
  rationale: Le nifal de שׁבה signifie être fait ou emmené captif. Le plus-que-parfait situe cet enlèvement avant l’arrivée de David et de ses hommes.
- source_word: בְּנֵיהֶם וּבְנֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: Traduction directe qui préserve les catégories distinctes du texte hébreu.
