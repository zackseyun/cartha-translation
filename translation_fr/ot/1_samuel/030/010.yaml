base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: fr
  text: David poursuivit avec quatre cents hommes, tandis que deux cents hommes restèrent, trop épuisés pour traverser le torrent de Besor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner un torrent, un oued ou le lit d’un cours d’eau saisonnier.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: continua donc la poursuite
  rationale: רדף désigne le fait de poursuivre. Dans le contexte immédiat, « continua la poursuite » exprime naturellement que David poursuit son expédition avec un groupe réduit; « donc » rend la progression narrative de וַ.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: avec quatre cents hommes
  rationale: La construction désigne David accompagné de quatre cents hommes. « Avec » est idiomatique en français et évite la tournure lourde « lui et quatre cents hommes ».
- source_word: וַיַּעַמְדוּ מָאתַיִם אִישׁ
  choice: tandis que deux cents s’arrêtèrent
  rationale: עמד signifie littéralement « se tenir, s’arrêter »; ici, ces hommes ne continuent pas la poursuite. « S’arrêtèrent » conserve l’action sans ajouter explicitement « restèrent en arrière ».
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: trop épuisés pour traverser
  rationale: Dans ce contexte, פגר exprime l’épuisement ou la défaillance qui empêche de continuer; la construction avec מִן et l’infinitif est rendue idiomatiquement par « trop… pour ».
- source_word: נַחַל הַבְּשׂוֹר
  choice: le torrent de Besor
  rationale: נחל peut désigner un torrent, un oued ou son lit. « Torrent » est naturel, digne et suffisamment ouvert quant au caractère permanent ou saisonnier du cours d’eau; le nom propre est translittéré « Besor ».
