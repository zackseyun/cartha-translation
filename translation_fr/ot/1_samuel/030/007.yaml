source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל אֶבְיָתָ֤ר הַ/כֹּהֵן֙ בֶּן אֲחִימֶ֔לֶךְ הַגִּֽישָׁ/ה נָּ֥א לִ֖/י הָ/אֵפֹ֑ד וַ/יַּגֵּ֧שׁ אֶבְיָתָ֛ר אֶת הָ/אֵפֹ֖ד אֶל דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: fr
  text: 'David dit alors à Abiathar, le prêtre, fils d’Ahimélek : « Je t’en prie, apporte-moi[a] l’éphod[b]. » Abiathar apporta donc l’éphod à David.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présente-moi ». Le verbe hébreu signifie « faire approcher », « apporter » ou « présenter ».
    reason: lexical_alternative
  - marker: b
    text: L’éphod était un objet ou vêtement sacré lié au service sacerdotal et au culte d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit; « alors » marque naturellement la succession en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le groupe nominal défini indique la fonction d’Abiathar.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: fils d’Ahimélek
  rationale: La construction hébraïque exprime la filiation; l’apposition sans article est naturelle en français.
- source_word: הַגִּישָׁה נָּא לִי
  choice: Je t’en prie, apporte-moi
  rationale: L’impératif causatif de נגשׁ signifie faire approcher, apporter ou présenter; « Je t’en prie » rend la particule de requête נָא avec dignité et naturel.
- source_word: הָאֵפֹד
  choice: l’éphod
  rationale: Ce terme désigne une réalité sacerdotale propre à l’ancien Israël sans équivalent français exact; la translittération évite une précision injustifiée.
- source_word: וַיַּגֵּשׁ
  choice: apporta donc
  rationale: Le même radical que dans l’ordre précédent décrit son exécution; « donc » fait ressortir sobrement la conséquence narrative.
- source_word: אֶל דָּוִד
  choice: à David
  rationale: La préposition indique ici le mouvement de l’objet vers David.
theological_decisions:
- issue: Nature et fonction de l’éphod dans cet épisode
  choice: Conserver « éphod » dans le texte et donner une explication générale en note
  alternative: « vêtement sacerdotal » ou « objet sacré sacerdotal »
  rationale: Le contexte suivant associe l’éphod à la consultation de Dieu, mais le verset ne précise pas lui-même sa forme ni son rôle exact. La translittération préserve cette retenue et évite de trancher entre objet et vêtement.
translation_notes:
  register: Français international moderne, narratif et digne. La demande polie est rendue par « Je t’en prie »; les noms propres suivent une translittération française usuelle. Les marqueurs de note sont placés sur les expressions qu’ils expliquent.
