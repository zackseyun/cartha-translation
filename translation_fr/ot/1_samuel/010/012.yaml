base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: fr
  text: 'Alors, un homme de là répondit : « Et qui est leur père[a] ? » C’est pourquoi cela devint un proverbe : « Saül est-il aussi parmi les prophètes ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son père ». Certaines traductions rapportent la question précisément à Saül, mais le texte massorétique porte « leur père ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: prit la parole
  rationale: Dans ce contexte narratif, ענה introduit la réaction d’un interlocuteur. « Prit la parole » est naturel en français sans supposer nécessairement une question explicite immédiatement précédente.
- source_word: אִישׁ מִשָּׁם
  choice: un homme de cet endroit
  rationale: La tournure rend directement l’identité locale de l’intervenant anonyme; « de là » serait possible, mais moins naturel ici.
- source_word: וּמִי אֲבִיהֶם
  choice: Et qui est leur père ?
  rationale: Le texte massorétique porte un suffixe masculin pluriel. Le conserver maintient la référence au groupe des prophètes et évite de ramener silencieusement la question au seul Saül.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution exprime naturellement en français la conséquence étiologique introduite par l’hébreu.
- source_word: הָיְתָה לְמָשָׁל
  choice: cette parole est devenue un proverbe
  rationale: מָשָׁל désigne ici une formule proverbiale. « Cette parole » explicite avec naturel le sujet implicite féminin sans modifier le sens.
- source_word: הֲגַם
  choice: est-il aussi
  rationale: L’interrogatif joint à גַּם marque l’inclusion étonnante de Saül dans le groupe.
- source_word: בַּנְּבִאִים
  choice: parmi les prophètes
  rationale: La préposition marque ici l’appartenance ou l’inclusion au sein du groupe.
theological_decisions:
- issue: Référent de « leur père » dans la question rhétorique
  choice: Maintenir le pluriel massorétique « leur père », en référence aux prophètes comme groupe.
  alternative: « son père », en rapportant la question uniquement à Saül.
  rationale: La morphologie du texte massorétique soutient le pluriel. Celui-ci laisse entendre que l’activité prophétique ne dépend pas d’une filiation particulière, tout en préservant la tension du passage. La lecture singulière est signalée en note en raison de son ancienneté dans la tradition de traduction.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le tour proverbial et le pluriel du texte massorétique, tout en évitant un calque narratif trop lourd.
