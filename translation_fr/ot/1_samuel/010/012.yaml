  naturalness: La formulation est globalement naturelle. « Un homme de là répondit » est à la fois plus direct et idiomatique que « un homme de cet endroit prit la parole et dit ». Le passé narratif « devint » rend plus nettement le wayyiqtol que « est devenue ».
