reference: 1 Samuel 10:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: fr
  text: Alors l’Esprit de Yahvé fondra sur toi[a] ; tu prophétiseras avec eux et tu deviendras un autre homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « viendra avec puissance sur toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה
  choice: fondra
  rationale: Avec l’Esprit de Yahvé pour sujet, צלח exprime ici une venue soudaine et puissante. « Fondra sur toi » rend cette force en français naturel, sans retenir les sens généraux de réussite ou de prospérité.
- source_word: עָלֶיךָ
  choice: sur toi
  rationale: La préposition עַל se rend naturellement par « sur » avec ce verbe et conserve l’idée que l’Esprit vient saisir Saul.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahvé
  rationale: רוּחַ désigne ici l’Esprit de Dieu, et le nom divin יהוה est représenté directement par « Yahvé ».
- source_word: וְהִתְנַבִּיתָ
  choice: tu prophétiseras
  rationale: Le hitpael de נבא décrit l’activité prophétique de Saul avec le groupe de prophètes. « Tu prophétiseras » est direct, actuel et fidèle.
- source_word: עִמָּם
  choice: avec eux
  rationale: 'עִם exprime ici l’accompagnement : Saul se joindra à leur activité prophétique.'
- source_word: וְנֶהְפַּכְתָּ
  choice: tu deviendras
  rationale: Le nifal de הפך indique un changement d’état. Dans l’expression française, « tu deviendras un autre homme » restitue naturellement le résultat passif sans préciser indûment la nature de ce changement.
- source_word: לְאִישׁ אַחֵר
  choice: un autre homme
  rationale: Cette traduction conserve le substantif masculin אִישׁ et l’ambiguïté de אַחֵר entre « autre » et « différent », sans importer une catégorie théologique ultérieure.
theological_decisions:
- issue: Nature du changement de Saul
  choice: Le texte annonce un changement réel lié à l’action de l’Esprit et à l’activité prophétique de Saul, sans en préciser l’étendue morale, intérieure ni la permanence.
  alternative: Comprendre soit une simple expérience extatique extérieure, soit une pleine régénération intérieure.
  rationale: L’hébreu affirme que Saul deviendra « un autre homme », mais ne définit pas davantage ce changement. La formulation française préserve donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple suit la valeur prédictive de la construction hébraïque. « Fondra sur toi » exprime l’irruption puissante de l’Esprit ; la note conserve une formulation moins imagée.
