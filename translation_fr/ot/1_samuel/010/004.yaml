  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: fr
  text: Ils te demanderont comment tu vas[a] et te donneront deux pains[b] ; tu les recevras de leur main[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils te salueront. » L’expression hébraïque signifie littéralement qu’ils s’enquerront de ta paix, c’est-à-dire de ton bien-être.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’hébreu dit « deux [unités de] pain » ; « deux pains » en exprime le sens idiomatique en français.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tu les prendras de leur main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: Ils te demanderont comment tu vas
  rationale: L’expression hébraïque signifie littéralement demander au sujet du bien-être ou de la paix de quelqu’un. Cette formulation française naturelle conserve l’idée d’une demande explicite, plutôt que de la réduire à une simple salutation.
- source_word: שָׁלוֹם
  choice: comment tu vas
  rationale: Dans cette expression idiomatique, שָׁלוֹם désigne l’état ou le bien-être de la personne, non la paix au sens abstrait.
- source_word: וְנָתְנוּ לְךָ
  choice: et te donneront
  rationale: Le verbe poursuit la série d’événements futurs annoncés par Samuel ; le futur simple convient naturellement en français.
- source_word: שְׁתֵּי לֶחֶם
  choice: deux pains
  rationale: Bien que לֶחֶם désigne le pain, la construction avec le nombre deux évoque deux unités comptables. « Deux pains » est idiomatique en français et ne précise pas indûment leur forme.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: tu les recevras de leur main
  rationale: לקח signifie fondamentalement « prendre », mais, puisque les pains sont donnés, « recevoir » exprime naturellement l’action dans ce contexte. « De leur main » maintient l’image hébraïque.
- source_word: מִיָּדָם
  choice: de leur main
  rationale: L’hébreu emploie le singulier « main » avec un suffixe pluriel. Le français peut conserver cette tournure collective intelligible.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier. La formulation garde l’enchaînement prédictif des verbes et préserve, dans le texte principal, l’image de la main présente en hébreu.
