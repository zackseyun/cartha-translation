  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֜ל אֶל כָּל הָ/עָ֗ם הַ/רְּאִיתֶם֙ אֲשֶׁ֣ר בָּֽחַר בּ֣/וֹ יְהוָ֔ה כִּ֛י אֵ֥ין כָּמֹ֖/הוּ בְּ/כָל הָ/עָ֑ם וַ/יָּרִ֧עוּ כָל הָ/עָ֛ם וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: fr
  text: 'Alors Samuel dit à tout le peuple : « Voyez-vous[a] celui que Yahweh a choisi ? Il n’y en a aucun comme lui parmi tout le peuple. » Tout le peuple poussa des cris et dit : « Vive le roi ![b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avez-vous vu ».'
    reason: La forme hébraïque est morphologiquement un parfait et peut se rendre par une question au passé, même si elle sert ici naturellement à attirer l’attention sur Saül.
  - marker: b
    text: 'Littéralement : « Que le roi vive ! »'
    reason: Le jussif hébreu formule un souhait, rendu idiomatiquement en français par « Vive le roi ! »
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » en restitue naturellement la succession en français moderne.
- source_word: הַרְּאִיתֶם
  choice: Voyez-vous
  rationale: Bien que la forme hébraïque soit un parfait à la deuxième personne du pluriel, elle attire ici l’attention sur Saül, présent devant l’assemblée. « Voyez-vous » convient naturellement au contexte, tout en signalant en note la valeur plus formelle « Avez-vous vu ».
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: celui que Yahweh a choisi
  rationale: La proposition relative désigne Saül comme l’homme choisi par Yahweh. Le passé composé exprime un choix accompli dont le résultat demeure actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu qui emploie le tétragramme.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: Il n’y en a aucun comme lui
  rationale: Cette formulation française exprime directement l’absence de tout homme comparable à Saül. La relation explicative portée par כִּי ressort de l’enchaînement des deux phrases sans ajout pesant de « car ».
- source_word: בְּכָל הָעָם
  choice: parmi tout le peuple
  rationale: La préposition marque ici le groupe au sein duquel s’établit la comparaison.
- source_word: וַיָּרִעוּ
  choice: poussa des cris
  rationale: Le verbe désigne une forte clameur collective. Cette traduction préserve l’expression vocale sans préciser indûment s’il s’agit d’acclamations joyeuses ou d’un autre type de cri.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Vive le roi !
  rationale: C’est l’acclamation française consacrée qui rend naturellement le souhait exprimé par le jussif hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le nom personnel divin ; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de l’affirmation « aucun comme lui »
  choice: Conserver la comparaison sans en préciser le motif
  alternative: Expliciter qu’il s’agit de sa taille, de son apparence ou de son aptitude royale
  rationale: Le verset ne précise pas en quoi Saül est sans pareil parmi le peuple. La traduction garde cette ouverture et n’importe pas l’explication du contexte dans l’énoncé.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste solennel sans archaïsme ; « tout le peuple » est traité comme un nom collectif singulier, conformément à l’usage français.
