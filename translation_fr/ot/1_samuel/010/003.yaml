base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: fr
  text: 'Puis tu continueras ton chemin et iras plus loin. Tu arriveras au chêne de Tabor[a]. Là, trois hommes qui montent vers Dieu à Béthel[b] viendront à ta rencontre : l’un portera trois chevreaux, un autre trois pains, et le troisième une outre de vin[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au térébinthe de Tabor ». Le mot hébreu peut désigner un grand arbre, notamment un chêne ou un térébinthe.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui montent vers Dieu à Béthel » ; il s’agit probablement d’un déplacement vers un lieu de culte à Béthel.'
    reason: cultural_note
  - marker: c
    text: 'Le terme hébreu désigne un récipient à liquide, probablement une outre ; littéralement : « une outre de vin ».'
    reason: lexical_note
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: tu continueras ton chemin et iras plus loin
  rationale: Cette formulation naturelle rend à la fois le mouvement à partir du lieu précédent et l’idée de poursuivre au-delà.
- source_word: אֵלוֹן תָּבוֹר
  choice: le chêne de Tabor
  rationale: אֵלוֹן désigne un grand arbre, souvent identifié comme un chêne ou un térébinthe. « Chêne » est clair dans le texte, tandis que la note conserve l’alternative lexicale.
- source_word: וּמְצָאוּךָ
  choice: viendront à ta rencontre
  rationale: Dans ce contexte, le verbe « trouver » décrit une rencontre. Cette tournure française garde les trois hommes comme sujet, conformément à l’hébreu.
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: qui montent vers Dieu à Béthel
  rationale: La formulation conserve l’orientation vers Dieu et le lien avec Béthel sans ajouter explicitement une action cultuelle absente du texte.
- source_word: גְדָיִים
  choice: chevreaux
  rationale: Le terme désigne de jeunes chèvres ; « chevreaux » est précis, courant et digne en français.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: pains
  rationale: כִּכָּר désigne ici des pains, probablement de forme ronde. En français, « trois pains » est naturel et suffisamment précis.
- source_word: נֵבֶל יָיִן
  choice: une outre de vin
  rationale: נֵבֶל désigne un récipient pour un liquide, vraisemblablement une outre dans ce contexte. « Une outre de vin » rend aussi explicitement יָיִן.
theological_decisions:
- issue: Sens de « monter vers Dieu à Béthel »
  choice: Conserver la formulation « montent vers Dieu à Béthel »
  alternative: « montent à Béthel pour adorer Dieu »
  rationale: Le contexte évoque vraisemblablement un déplacement vers un lieu de culte, mais le texte ne dit pas explicitement « adorer ». La traduction maintient donc la formulation religieuse et son lien avec Béthel sans préciser davantage le rite ou l’intention.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse personnelle à Saül. La structure séquentielle et les trois porteurs sont clairement distingués, sans explicitation doctrinale ou rituelle supplémentaire.
