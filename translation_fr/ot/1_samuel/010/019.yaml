  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: fr
  text: 'Mais aujourd’hui, vous avez rejeté votre Dieu, lui qui vous sauve de tous vos malheurs et de toutes vos détresses[a], et vous lui avez dit : « Non, mais mets un roi à notre tête. » Maintenant donc, présentez-vous devant Yahweh, par tribus et par milliers[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tous vos maux et de toutes vos afflictions ». Les deux termes hébreux peuvent désigner des malheurs, des calamités, des difficultés ou des situations de détresse.
    reason: lexical_alternative
  - marker: b
    text: Ou « par clans » ou « par unités de mille ». Le mot hébreu traduit par « milliers » peut désigner des subdivisions sociales ou militaires, et pas seulement le nombre littéral de mille.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: vous avez rejeté
  rationale: Le verbe מָאַס exprime ici le rejet ou le refus. « Rejeté » rend clairement la gravité de l’acte sans ajouter la nuance plus affective de « méprisé ».
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici, avec le contexte et le participe singulier, le Dieu d’Israël.
- source_word: מוֹשִׁיעַ
  choice: lui qui vous sauve
  rationale: Le participe présente l’action salvatrice comme caractéristique de Dieu. La tournure française souligne le pronom הוּא sans alourdir la phrase.
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: de tous vos malheurs et de toutes vos détresses
  rationale: Dans ce contexte, רָעוֹת désigne les maux ou calamités subis, tandis que צָרוֹת évoque les situations de détresse. Les deux termes français conservent la distinction et forment une paire naturelle.
- source_word: כִּי מֶלֶךְ תָּשִׂים עָלֵינוּ
  choice: « Non ! Établis plutôt un roi sur nous. »
  rationale: כִּי introduit ici une réplique insistante et contrastive. L’impératif français rend naturellement la demande portée par l’inaccompli hébreu dans ce contexte, tandis que « plutôt » explicite le contraste avec le règne sauveur de Dieu.
- source_word: הִתְיַצְּבוּ
  choice: présentez-vous
  rationale: Le hitpael demande aux Israélites de prendre formellement position devant Yahweh pour la procédure de désignation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לְשִׁבְטֵיכֶם
  choice: selon vos tribus
  rationale: La préposition לְ indique ici l’organisation par groupes. « Selon vos tribus » est idiomatique en français dans ce cadre procédural.
- source_word: וּלְאַלְפֵיכֶם
  choice: et vos milliers
  rationale: אֶלֶף peut désigner mille personnes, mais aussi une subdivision sociale, clanique ou militaire. « Milliers » garde l’image et la transparence du terme hébreu, avec une note explicative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie directement le tétragramme. La translittération maintient le nom personnel sans lui substituer un titre.
- issue: Force de la demande adressée à Dieu
  choice: « Non ! Établis plutôt un roi sur nous. »
  alternative: « Mais tu établiras un roi sur nous. »
  rationale: La formulation choisie rend en français courant l’insistance contrastive de כִּי et la valeur de demande de תָּשִׂים dans le contexte. L’alternative plus formelle conserve davantage la forme inaccomplie, mais peut sonner comme une simple prédiction.
translation_notes:
  register: Français international moderne, digne et direct. Le discours conserve le ton de réprimande de Samuel. La répétition de « tous/toutes » reflète naturellement la portée de מִכָּל sur les deux catégories de souffrances, et la ponctuation rend l’insistance du refus sans langage archaïque.
