source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: fr
  text: 'Alors Samuel prit le flacon d’huile, en versa sur sa tête et l’embrassa. Puis il dit : « Yahweh ne t’a-t-il pas oint comme dirigeant[a] de son héritage ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef » ou « prince ». Le terme hébreu désigne une personne établie pour gouverner et ne correspond pas exactement, par sa nuance, au titre « roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: le flacon d’huile
  rationale: פַּךְ désigne un petit récipient. « Flacon » rend concrètement cette idée en français moderne sans employer le terme vieilli « fiole ».
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: en versa sur sa tête
  rationale: Le verbe יצק signifie « verser ». Le pronom « en » reprend naturellement l’huile en français, tandis que « sur sa tête » suit de près l’hébreu.
- source_word: וַיִּשָּׁקֵהוּ
  choice: l’embrassa
  rationale: Le verbe נשׁק signifie ici clairement « embrasser ». Le geste est conservé sans atténuation ni interprétation ajoutée.
- source_word: הֲלוֹא כִּי
  choice: ne t’a-t-il pas
  rationale: Cette formulation française naturelle conserve la force de l’interrogation rhétorique affirmative.
- source_word: מְשָׁחֲךָ
  choice: t’a consacré par l’onction
  rationale: Cette expression rend explicitement le geste rituel et la mise à part impliqués par משׁח. Le simple « t’a oint » serait plus formel, mais moins immédiatement compréhensible pour de nombreux lecteurs modernes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui préserve le nom personnel présent dans le texte hébreu.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: נַחֲלָה désigne un héritage ou une possession attribuée. « Son héritage » conserve ici l’idée d’appartenance particulière d’Israël à Yahweh.
- source_word: לְנָגִיד
  choice: comme dirigeant
  rationale: נָגִיד désigne une personne établie à la tête du peuple pour le gouverner. « Dirigeant » exprime cette fonction sans l’assimiler trop vite au titre plus précis de « roi ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance au lieu de lui substituer un titre.
- issue: Portée de נָגִיד dans le contexte de l’établissement de Saül
  choice: dirigeant
  alternative: chef ou prince
  rationale: Saül est ici établi pour gouverner, mais le terme hébreu n’est pas identique au titre מֶלֶךְ, « roi ». « Dirigeant » maintient cette distinction sans nier la portée royale de la scène.
- issue: Sens de l’onction de Saül
  choice: consacré par l’onction comme dirigeant
  alternative: oint pour être dirigeant
  rationale: La traduction conserve à la fois le rite d’onction et la nomination à une fonction, sans ajouter de précision sur la nature spirituelle ou politique de cette consécration.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’interrogation rhétorique de l’hébreu. Les pronoms restent non explicités, comme dans le verset source, sans ajouter le nom de Saül. « Puis » évite une accumulation lourde de coordinations tout en maintenant la succession narrative.
