base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: fr
  text: Tu descendras avant moi à Guilgal. Voici, je descendrai vers toi pour offrir des holocaustes et des sacrifices de paix[a]. Tu attendras sept jours, jusqu’à ce que je vienne vers toi et te fasse savoir ce que tu devras faire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ». Le terme hébreu désigne des sacrifices associés à la paix, à l’intégrité et à un repas partagé.
    reason: Alternative lexicale reflétant l’étendue sémantique de שְׁלָמִים.
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: Tu descendras
  rationale: Le parfait qal avec waw s’inscrit dans une suite d’instructions à portée future. Le futur français exprime naturellement la directive tout en conservant le sens spatial de « descendre ».
- source_word: לְפָנַי
  choice: avant moi
  rationale: L’expression signifie littéralement « devant ma face » et peut avoir une nuance spatiale et temporelle. Dans ce contexte, « avant moi » indique clairement que Saül doit précéder Samuel sans effacer entièrement l’idée d’aller devant lui.
- source_word: הַגִּלְגָּל
  choice: Guilgal
  rationale: Translittération française usuelle du nom de lieu.
- source_word: וְהִנֵּה
  choice: Voici
  rationale: Ce présentatif attire l’attention et donne de la vivacité à l’annonce. « Voici » en conserve la force solennelle dans un français actuel et digne.
- source_word: אָנֹכִי יֹרֵד אֵלֶיךָ
  choice: je descendrai vers toi
  rationale: Le participe présente l’action comme prévue ou imminente. Le futur est idiomatique en français dans cette instruction et « vers toi » maintient le point d’arrivée explicite.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: pour offrir des holocaustes
  rationale: L’expression désigne l’offrande de sacrifices entièrement consumés. « Holocaustes » est le terme sacrificiel français établi, sans suggérer qu’il s’agit simplement de faire monter quelque chose.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: et sacrifier des sacrifices de paix
  rationale: Le verbe et son nom apparenté sont conservés par « sacrifier des sacrifices ». « Sacrifices de paix » rend le lien de שְׁלָמִים avec la paix et l’intégrité, tandis qu’une note signale les autres nuances possibles.
- source_word: תּוֹחֵל
  choice: Tu attendras
  rationale: Bien que le verbe puisse aussi évoquer l’espérance, le contexte d’une consigne temporelle appelle clairement le sens « attendre ».
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: jusqu’à ce que je vienne vers toi
  rationale: L’infinitif construit avec suffixe est rendu naturellement par une proposition temporelle française, en maintenant le mouvement vers Saül.
- source_word: וְהוֹדַעְתִּי לְךָ
  choice: et te fasse savoir
  rationale: Cette formulation conserve la valeur causative du hiphil de ידע, plus précisément que le simple verbe « dire ».
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: ce que tu devras faire
  rationale: La tournure française exprime naturellement l’objet de la révélation à venir ainsi que la portée directive de l’action demandée.
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion ; sacrifices de bien-être
  rationale: Le terme désigne des sacrifices liés à la paix, à l’intégrité ou au bien-être, souvent accompagnés d’un repas partagé. « Sacrifices de paix » garde le lien lexical avec שָׁלוֹם sans imposer une interprétation doctrinale étroite ; les autres dimensions sont préservées en note.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve le ton directif et prophétique du discours. La terminologie sacrificielle reste reconnaissable, avec une note pour préserver la richesse sémantique du terme hébreu.
