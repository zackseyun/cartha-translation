  text: וַ/יַּצְעֵ֤ק שְׁמוּאֵל֙ אֶת הָ/עָ֔ם אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: fr
  text: Alors Samuel convoqua le peuple auprès de Yahweh, à Mitspa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appela le peuple à se rassembler auprès de Yahweh, à Mitspa ». Le verbe hébreu peut, dans ce contexte, exprimer l’action d’appeler ou de convoquer une assemblée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: convoqua
  rationale: Avec « le peuple » comme complément direct, le verbe désigne ici l’action de convoquer ou de rassembler, plutôt que celle de pousser un cri. « Convoqua » est naturel en français et convient au cadre d’une assemblée.
- source_word: אֶת הָעָם
  choice: le peuple
  rationale: עָם désigne ici le peuple d’Israël appelé à se réunir; « le peuple » est la traduction directe et contextuellement appropriée.
- source_word: אֶל יְהוָה
  choice: auprès de Yahweh
  rationale: La préposition אֶל exprime normalement un mouvement ou une orientation vers quelqu’un. « Auprès de Yahweh » conserve la relation exprimée par l’hébreu sans la transformer explicitement en « devant Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הַמִּצְפָּה
  choice: à Mitspa
  rationale: Le mot désigne ici la localité de Mitspa. La préposition « à » rend naturellement en français le lieu où le peuple est convoqué.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom divin au lieu de le remplacer par un titre.
- issue: Relation de l’assemblée à Yahweh
  choice: auprès de Yahweh
  alternative: devant Yahweh
  rationale: « Devant Yahweh » expliciterait une scène cultuelle possible, mais l’hébreu porte אֶל, « vers/auprès de ». La formulation retenue évite de résoudre plus précisément que le texte la nature de cette relation.
translation_notes:
  register: Français international moderne, sobre et digne. « Convoqua » exprime clairement l’action institutionnelle de réunir le peuple; « auprès de Yahweh » maintient la formulation inhabituelle et la légère ambiguïté de l’hébreu.
