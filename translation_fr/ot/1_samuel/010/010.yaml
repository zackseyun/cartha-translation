source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: fr
  text: Lorsqu’ils arrivèrent là, à la colline[a], voici qu’un groupe de prophètes vint à sa rencontre. L’Esprit de Dieu fondit sur lui, et il prophétisa au milieu d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Guibéa ». La forme hébraïque peut désigner le lieu nommé Guibéa ou signifier « à la colline ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: à la colline
  rationale: La forme avec hé directionnel peut désigner « la colline » ou le lieu nommé Guibéa. L’article favorise ici le nom commun, tandis qu’une note préserve l’autre lecture.
- source_word: חֶבֶל נְבִאִים
  choice: un groupe de prophètes
  rationale: חֶבֶל désigne ici une troupe ou un ensemble de personnes. « Groupe » est naturel en français moderne sans préciser indûment son degré d’organisation.
- source_word: לִקְרָאתוֹ
  choice: vint à sa rencontre
  rationale: L’expression indique un mouvement vers Saül en vue d’une rencontre; cette formulation est idiomatique et fidèle.
- source_word: רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  rationale: Dans le contexte de l’action et de la puissance divines accordées à Saül, l’expression renvoie le plus naturellement à l’Esprit appartenant à Dieu, sans ajouter de précision doctrinale ultérieure.
- source_word: וַתִּצְלַח עָלָיו
  choice: fondit sur lui
  rationale: Avec רוּחַ comme sujet, צלח exprime une venue soudaine et puissante. « Fondit sur lui » conserve cette vigueur en français naturel et digne.
- source_word: וַיִּתְנַבֵּא
  choice: il prophétisa
  rationale: Le hitpael de נבא désigne ici l’exercice d’une activité prophétique sans en définir précisément la forme.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: La locution situe Saül au sein du groupe et suggère sa participation à son activité prophétique.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: « Voici que » rend la fonction présentative de הִנֵּה et attire l’attention sur l’apparition soudaine du groupe, dans un registre biblique encore courant.
theological_decisions:
- issue: Sens de רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  alternative: un esprit venant de Dieu
  rationale: Le récit présente une intervention divine qui saisit et rend Saül capable de prophétiser. La lecture définie convient le mieux, tout en évitant d’importer dans le passage une formulation doctrinale plus développée.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » garde la mise en relief narrative; « fondit sur lui » conserve la soudaineté et la force du verbe hébreu. La syntaxe est légèrement réorganisée pour éviter l’ambiguïté française de « là, à la colline » tout en maintenant les deux indications du texte source.
