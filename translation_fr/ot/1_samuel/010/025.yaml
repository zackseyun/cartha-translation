  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: fr
  text: Samuel exposa alors au peuple la règle de la royauté[a]. Il la consigna dans le livre et le déposa devant Yahweh. Puis Samuel renvoya tout le peuple, chacun chez lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le droit », « la procédure » ou « la coutume de la royauté ». L’expression hébraïque peut désigner une ordonnance juridique ou la pratique établie du pouvoir royal.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chacun vers sa maison ». Cette expression distributive signifie que tous repartirent chacun dans leur maison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: exposa
  rationale: Avec un destinataire introduit par אֶל et un contenu explicite, le verbe désigne ici une présentation adressée au peuple. « Exposa » convient au caractère normatif de ce qui suit.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: les droits et les devoirs liés à la royauté
  rationale: מִשְׁפַּט peut désigner le droit, une prescription ou une pratique établie, tandis que מְלֻכָה vise ici l’institution royale. Cette formulation rend clairement la dimension normative sans réduire l’expression aux seuls privilèges du roi; une note conserve les autres sens possibles.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: Il les consigna dans le livre
  rationale: « Consigna » exprime naturellement la mise par écrit officielle. Le pronom pluriel reprend en français les droits et devoirs qui viennent d’être exposés. סֵפֶר peut désigner un livre, un rouleau ou un document; « le livre » reste sobre et concorde avec l’article hébreu.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: déposa celui-ci devant Yahweh
  rationale: Le verbe signifie poser ou déposer. « Celui-ci » renvoie sans ambiguïté au livre et « devant » préserve la possible portée cultuelle de l’acte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom propre présent dans le texte hébreu.
- source_word: וַיְשַׁלַּח
  choice: renvoya
  rationale: Dans ce contexte, le verbe décrit la dispersion ou le congé de l’assemblée, non l’envoi en mission.
- source_word: אִישׁ לְבֵיתוֹ
  choice: chacun chez lui
  rationale: 'Cette tournure française naturelle restitue la valeur distributive de l’expression hébraïque: les membres du peuple repartent individuellement dans leurs foyers. La forme littérale est signalée en note.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée normative de מִשְׁפַּט הַמְּלֻכָה
  choice: les droits et les devoirs liés à la royauté
  alternative: la règle, la procédure ou la coutume de la royauté
  rationale: Le contexte peut viser les dispositions régissant la fonction royale, mais le substantif hébreu garde une amplitude entre droit, ordonnance et usage. Le texte principal adopte une formulation intelligible, tandis que la note maintient l’ambiguïté.
- issue: Expression distributive masculine אִישׁ לְבֵיתוֹ
  choice: chacun chez lui
  alternative: chaque homme vers sa maison
  rationale: « Chacun chez lui » conserve en français le distributif singulier et son accord masculin, tout en évitant une traduction artificielle.
translation_notes:
  register: Français international actuel, digne et accessible. Les verbes « exposa », « consigna » et « déposa » donnent au passage sa tonalité officielle sans archaïsme. La formulation conserve l’ambiguïté de מִשְׁפַּט dans une note plutôt que de la résoudre silencieusement.
