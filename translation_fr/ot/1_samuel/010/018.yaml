source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: fr
  text: 'Il dit aux fils d’Israël[a] : « Voici ce que dit Yahvé, le Dieu d’Israël : C’est moi qui ai fait monter Israël d’Égypte et qui vous ai délivrés du pouvoir des Égyptiens et du pouvoir de tous les royaumes qui vous opprimaient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites »; traditionnellement, « aux enfants d’Israël ».
    reason: Alternative lexicale pour l’ethnonyme hébreu littéralement rendu par « fils d’Israël ».
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation conserve le masculin pluriel explicite et l’expression ethnonymique hébraïque; une formulation française plus courante est signalée en note.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française naturelle et solennelle pour introduire une déclaration divine, sans reproduire artificiellement la syntaxe hébraïque.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin, plutôt que substitution par un titre.
- source_word: הֶעֱלֵיתִי
  choice: ai fait monter
  rationale: Préserve le causatif et l’image biblique de la montée depuis l’Égypte.
- source_word: וָאַצִּיל
  choice: ai délivrés
  rationale: Exprime le sauvetage hors d’une puissance hostile dans un registre biblique actuel et digne.
- source_word: מִיַּד
  choice: du pouvoir de
  rationale: Rend clairement en français le sens idiomatique de « de la main de », c’est-à-dire hors de l’emprise ou de la puissance de quelqu’un.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Dans l’expression liée à la « main », le nom désigne par métonymie la puissance égyptienne; le français exige ici une référence naturelle aux Égyptiens.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: qui vous opprimaient
  rationale: L’imparfait restitue la valeur durative du participe hébreu et convient au récit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; la transcription du nom propre en conserve la fonction personnelle et alliancielle.
- issue: Ethnonyme genré בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal maintient la forme masculine explicite de l’hébreu, tandis que la note indique l’équivalent collectif courant sans restreindre le groupe aux seuls hommes.
- issue: Emphase du pronom אָנֹכִי
  choice: C’est moi qui ai fait monter
  alternative: J’ai fait monter
  rationale: La construction française marque le pronom indépendant emphatique de l’hébreu sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité du discours divin; les idiomes opaques sont clarifiés sans effacer l’imagerie de l’exode.
