    issue: « Alors les gens se dirent, chacun à son voisin »
    rationale: Le verbe וַיֹּאמֶר est suivi de la formule distributive « un homme à son voisin » ; il convient de rendre une parole adressée à son voisin, non une parole réflexive. « Alors les gens se dirent, chacun à son voisin » mêle deux constructions françaises et affaiblit la relation explicitée par le texte.
