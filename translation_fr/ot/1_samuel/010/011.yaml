  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: fr
  text: 'Tous ceux qui le connaissaient auparavant[a] le virent : voilà qu’il prophétisait avec les prophètes. Alors les gens dirent, chacun à son voisin : « Qu’est-il arrivé au fils de Qish ? Saül est-il lui aussi[b] parmi les prophètes ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le connaissaient depuis hier et avant-hier », expression hébraïque signifiant qu’ils le connaissaient déjà auparavant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Même Saül est-il parmi les prophètes ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: le connaissaient auparavant
  rationale: L’expression hébraïque signifie littéralement « le connaissaient depuis hier et avant-hier », mais fonctionne ici comme un idiome désignant le temps passé. « Auparavant » rend naturellement le contraste avec le comportement présent de Saül.
- source_word: וַיְהִי
  choice: intégré à la progression narrative sans formule autonome
  rationale: Dans ce contexte, וַיְהִי assure surtout la continuité du récit. Une formule comme « Et il arriva que » serait plus lourde et archaïsante en français moderne.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: 'le virent : voilà que'
  rationale: La construction conserve à la fois l’acte de voir et l’effet de surprise introduit par וְהִנֵּה, dans un français vivant et digne.
- source_word: עִם נְבִאִים
  choice: avec les prophètes
  rationale: עִם signifie directement « avec ». Ce choix maintient aussi la distinction avec בַּנְּבִיאִים, rendu ensuite par « parmi les prophètes ».
- source_word: נִבָּא
  choice: il prophétisait
  rationale: L’imparfait présente l’activité prophétique en cours au moment où les témoins la constatent, sans faire de Saül un prophète de fonction permanente.
- source_word: הָעָם אִישׁ אֶל רֵעֵהוּ
  choice: les gens se dirent, chacun à son voisin
  rationale: « Les gens » convient au groupe témoin, tandis que « chacun à son voisin » garde la formulation distributive et masculine du texte hébreu sans raideur excessive.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: Qu’est-il arrivé au fils de Qish ?
  rationale: Cette formulation française naturelle exprime la surprise devant le changement observé sans ajouter l’idée interprétative de possession ou de frénésie.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: Saül est-il lui aussi parmi les prophètes ?
  rationale: « Lui aussi » rend la particule גַם et son effet de surprise. « Parmi » correspond à בְּ et se distingue du précédent « avec ».
theological_decisions:
- issue: Nature de l’activité prophétique de Saül
  choice: il prophétisait avec les prophètes
  alternative: il était saisi d’une frénésie prophétique avec les prophètes
  rationale: Le texte rapporte une activité prophétique observable, mais ne précise ni sa forme psychologique ni l’établissement durable de Saül dans une fonction prophétique. La traduction conserve cette tension.
- issue: Portée de la question finale
  choice: Saül est-il lui aussi parmi les prophètes ?
  alternative: Même Saül est-il parmi les prophètes ?
  rationale: Les deux lectures expriment la surprise attachée à הֲגַם. Le texte principal retient une formulation française plus naturelle, tandis que la note conserve l’alternative plus appuyée.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « voilà que » préserve la vivacité et la surprise de l’hébreu. Le nom קִישׁ est transcrit « Qish » afin de refléter sa consonne initiale, tout en restant lisible.
