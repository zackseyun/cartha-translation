  to: 'Tous ceux qui le connaissaient auparavant[a] le virent : voilà qu’il prophétisait avec les prophètes. Alors les gens dirent, chacun à son voisin : « Qu’est-il arrivé au fils de Qish ? Saül est-il lui aussi[b] parmi les prophètes ? »'
