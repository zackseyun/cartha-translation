  text: וְ/גַ֨ם שָׁא֔וּל הָלַ֥ךְ לְ/בֵית֖/וֹ גִּבְעָ֑תָ/ה וַ/יֵּלְכ֣וּ עִמּ֔/וֹ הַ/חַ֕יִל אֲשֶׁר נָגַ֥ע אֱלֹהִ֖ים בְּ/לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: fr
  text: Saül aussi rentra chez lui, à Guibéa, et les hommes vaillants[a] dont Dieu avait touché le cœur[b] allèrent avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes de valeur » ou « les guerriers ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie que Dieu avait agi sur leurs dispositions intérieures.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Marque l’ajout et la continuité du récit; « aussi » est naturel et concis en français.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: rentra chez lui à Guibéa
  rationale: Rend à la fois la destination personnelle exprimée par לְבֵיתוֹ et la direction vers Guibéa; « rentrer chez lui » est idiomatique dans ce contexte.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: partirent avec lui
  rationale: Exprime naturellement l’accompagnement dans la suite narrative, sans suggérer qu’ils habitaient nécessairement avec Saül.
- source_word: הַחַיִל
  choice: les hommes de valeur
  rationale: Préserve l’étendue sémantique de חַיִל, qui peut évoquer la vaillance, la capacité ou la qualité guerrière, sans réduire nécessairement le groupe à une armée constituée.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: dont Dieu avait touché le cœur
  rationale: Conserve la métaphore hébraïque de l’action divine sur la disposition intérieure. Le singulier collectif « le cœur » reflète le texte hébreu et reste naturel en français.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Désigne ici clairement le Dieu d’Israël.
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » rend de façon transparente l’être intérieur, notamment la volonté, la pensée et les dispositions, sans limiter le sens aux émotions.
theological_decisions:
- issue: Nature de l’action de Dieu sur le cœur de ces hommes
  choice: Conserver l’image selon laquelle Dieu avait « touché le cœur » des hommes.
  alternative: « dont Dieu avait disposé le cœur » ou « dont Dieu avait remué le cœur »
  rationale: Le texte affirme une initiative divine agissant sur leur disposition intérieure, mais ne précise ni le mécanisme ni la portée doctrinale de cette action. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide tout en conservant la métaphore théologique du texte source et l’ambiguïté de חַיִל.
