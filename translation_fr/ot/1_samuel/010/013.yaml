  text: וַ/יְכַל֙ מֵֽ/הִתְנַבּ֔וֹת וַ/יָּבֹ֖א הַ/בָּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/013.yaml
  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: fr
  text: Quand il eut fini de prophétiser, il se rendit au haut lieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sanctuaire situé sur la hauteur » ; l’hébreu désigne un lieu de culte, souvent aménagé sur une hauteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Quand il eut fini
  rationale: Le verbe marque ici l’achèvement de l’activité précédente. La proposition temporelle rend naturellement en français l’antériorité de cette action.
- source_word: מֵהִתְנַבּוֹת
  choice: de prophétiser
  rationale: L’infinitif de נבא après מן désigne l’activité qui prend fin. « Prophétiser » reste direct et conserve la portée prophétique du terme.
- source_word: וַיָּבֹא
  choice: il se rendit
  rationale: בוא peut signifier venir ou aller selon le point de vue. « Se rendit » exprime le déplacement vers le lieu sans imposer une perspective spatiale absente du contexte immédiat.
- source_word: הַבָּמָה
  choice: au haut lieu
  rationale: במה désigne généralement un lieu de culte, souvent situé en hauteur. « Haut lieu » est le terme français traditionnel et transparent, sans préciser ici la légitimité du sanctuaire.
theological_decisions:
- issue: Portée cultuelle de הַבָּמָה
  choice: au haut lieu
  alternative: au sanctuaire situé sur la hauteur
  rationale: Le terme indique un lieu de culte, mais le verset ne tranche pas la question de sa légitimité. La formulation retenue préserve cette tension et la note en explicite brièvement le sens.
translation_notes:
  register: Français moderne, narratif et digne. Le passé antérieur après « quand » marque clairement la succession des actions. « Haut lieu » conserve le vocabulaire cultuel sans ajouter de jugement théologique.
