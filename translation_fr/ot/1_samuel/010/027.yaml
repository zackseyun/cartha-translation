  text: וּ/בְנֵ֧י בְלִיַּ֣עַל אָמְר֗וּ מַה יֹּשִׁעֵ֨/נוּ֙ זֶ֔ה וַ/יִּבְזֻ֕/הוּ וְ/לֹֽא הֵבִ֥יאוּ ל֖/וֹ מִנְחָ֑ה וַ/יְהִ֖י כְּ/מַחֲרִֽישׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: fr
  text: 'Mais des vauriens dirent : « Comment celui-ci pourrait-il nous sauver ? » Ils le méprisèrent et ne lui apportèrent aucun présent. Mais Saül resta comme quelqu’un qui garde le silence.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme s’il était sourd ». L’expression hébraïque peut décrire le fait de garder délibérément le silence face à une provocation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: des vauriens
  rationale: L’expression signifie littéralement « fils de vauriennerie / de perversité » et désigne des hommes moralement méprisables. « Des vauriens » restitue naturellement l’idiome en français moderne sans lui donner un sens technique.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: Comment celui-ci pourrait-il nous sauver ?
  rationale: La question exprime un défi sceptique et méprisant. « Celui-ci » conserve la valeur dépréciative possible de זֶה, tandis que le conditionnel rend naturellement l’incrédulité de la question en français.
- source_word: וַיִּבְזֻהוּ
  choice: Ils le méprisèrent
  rationale: Le verbe בזה signifie mépriser ou tenir pour insignifiant. Cette traduction est directe et correspond au ton narratif.
- source_word: מִנְחָה
  choice: présent
  rationale: Dans ce contexte royal, le mot désigne un don remis au nouveau roi, avec une possible portée d’hommage politique. « Présent » conserve cette nuance sans imposer le sens cultuel d’« offrande » ni la précision politique de « tribut ».
- source_word: כְּמַחֲרִישׁ
  choice: comme quelqu’un qui garde le silence
  rationale: Le participe de חרשׁ évoque ici le fait de se taire, et le préfixe כְּ marque explicitement une comparaison. La formulation conserve ce tour inhabituel plutôt que de le réduire à « il ne répondit pas ».
- source_word: וַיְהִי
  choice: resta
  rationale: Dans ce contexte, היה introduit l’attitude adoptée par Saül face au mépris. « Resta » donne un français naturel et indique la continuité de son silence sans préciser davantage son intention.
theological_decisions:
- issue: Caractérisation de la réaction de Saül
  choice: Saül demeure silencieux devant le mépris
  alternative: Saül fait comme s’il était sourd à leurs insultes
  rationale: כְּמַחֲרִישׁ peut évoquer soit celui qui garde le silence, soit celui qui se comporte comme s’il n’entendait pas. Le texte principal retient le sens le plus direct tout en maintenant la comparaison; la note conserve l’autre lecture et la possible idée d’un silence délibéré.
translation_notes:
  register: Français international moderne, narratif et digne. « Vauriens » rend l’idiome hébreu avec vigueur sans archaïsme marqué; « présent » convient au cadre royal. La syntaxe finale conserve autant que possible la comparaison singulière de l’hébreu.
