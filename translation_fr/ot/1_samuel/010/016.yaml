base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: fr
  text: 'Saül dit à son oncle : « Il nous a bien dit que les ânesses avaient été retrouvées. » Mais il ne lui dit rien de ce que Samuel avait dit au sujet de la royauté[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du royaume ». Le terme hébreu peut désigner la royauté ou le royaume selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: son oncle
  rationale: Dans ce contexte familial, דּוֹד désigne l’oncle de Saül plutôt qu’un bien-aimé.
- source_word: הַגֵּד הִגִּיד
  choice: Il nous a bien annoncé
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation ; « bien » rend cette insistance naturellement en français.
- source_word: נִמְצְאוּ
  choice: avaient été retrouvées
  rationale: Le passif et l’antériorité par rapport au récit rapporté sont rendus naturellement par le plus-que-parfait.
- source_word: הָאֲתֹנוֹת
  choice: les ânesses
  rationale: Le nom hébreu désigne explicitement des ânesses ; le français courant permet de conserver cette précision sans lourdeur.
- source_word: דְּבַר הַמְּלוּכָה
  choice: de la royauté
  rationale: דָּבָר désigne ici l’affaire ou le sujet, et מְלוּכָה la dignité ou fonction royale promise à Saül plutôt qu’un territoire.
- source_word: לֹא הִגִּיד לוֹ
  choice: il ne lui parla pas
  rationale: Cette formulation française évite la répétition lourde d’« annoncer » tout en conservant l’idée que Saül ne communiqua pas cette information à son oncle.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: dont Samuel lui avait parlé
  rationale: La relative est rattachée naturellement à la royauté ; « lui » explicite en français le destinataire déjà établi par le contexte.
theological_decisions:
- issue: Sens de מְלוּכָה
  choice: la royauté
  alternative: le royaume
  rationale: Dans ce passage, le terme vise vraisemblablement l’accession de Saül à la fonction royale, et non le royaume comme territoire ; une note conserve toutefois l’autre traduction possible.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de l’hébreu tout en évitant les tournures artificielles ; la précision « ânesses » est naturelle en français et conserve le genre lexical du terme hébreu.
