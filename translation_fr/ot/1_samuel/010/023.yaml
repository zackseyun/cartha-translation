revisions:
- from: Ils coururent donc le chercher là où il était[a], puis il se tint au milieu du peuple. Il dépassait tout le peuple de la tête et des épaules.
  to: Ils coururent le prendre de là[a], puis il se tint au milieu du peuple. Il était plus grand que tout le peuple, les dépassant à partir des épaules.
  rationale: La révision retire l’inférence « donc », rend plus directement le verbe hébreu « prendre », et reformule la description de taille pour refléter l’image « depuis son épaule et vers le haut » sans recourir à une expression française susceptible de devenir figurée. La note conserve l’éclairage contextuel fourni par le verset précédent, sans le substituer au texte.
