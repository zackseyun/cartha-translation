  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: fr
  text: Ils coururent le prendre de là[a], puis il se tint au milieu du peuple. Il était plus grand que tout le peuple, les dépassant à partir des épaules.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils le prirent de là ». Dans ce contexte, on peut aussi comprendre qu’ils allèrent le chercher ou le ramenèrent de l’endroit où il s’était caché (voir le verset 22).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: Ils coururent
  rationale: Le verbe רוץ désigne directement l’action de courir et conserve ici la vivacité du récit.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: le chercher là où il était
  rationale: לקח signifie couramment « prendre », mais, avec מִשָּׁם dans ce contexte, l’expression décrit le fait d’aller récupérer Saül à l’endroit où il s’était caché. Cette formulation est naturelle en français tout en signalant en note la traduction plus littérale.
- source_word: וַיִּתְיַצֵּב
  choice: il se tint
  rationale: Le hitpael de יצב signifie se placer, se tenir ou prendre position. « Il se tint » reste proche de la forme pronominale hébraïque sans ajouter de nuance cérémonielle.
- source_word: בְּתוֹךְ הָעָם
  choice: au milieu du peuple
  rationale: Rend directement l’idée spatiale de בְּתוֹךְ dans un français naturel.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם מִשִּׁכְמוֹ וָמָעְלָה
  choice: Il dépassait tout le peuple de la tête et des épaules
  rationale: La tournure française idiomatique « dépasser de la tête et des épaules » exprime clairement que Saül était plus grand que tous, conformément à l’hébreu « depuis son épaule et au-dessus ».
