  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: fr
  text: 'Quand tu partiras d’auprès de moi aujourd’hui, tu trouveras deux hommes près du tombeau de Rachel, sur le territoire de Benjamin[a], à Tseltsah. Ils te diront : « Les ânesses que tu étais allé chercher ont été retrouvées. Voici que ton père a laissé de côté la question des ânesses[b] et qu’il s’inquiète pour vous[c], en disant : “Que vais-je faire au sujet de mon fils ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la frontière de Benjamin ». Le mot hébreu peut désigner une frontière ou un territoire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « a délaissé l’affaire des ânesses ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le pronom hébreu est au pluriel : le père s’inquiète vraisemblablement pour Saül et pour le serviteur qui l’accompagne.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: Quand tu partiras d’auprès de moi aujourd’hui
  rationale: La construction temporelle avec l’infinitif est rendue naturellement, tandis que « d’auprès de moi » conserve l’idée précise d’un départ depuis la présence de Samuel.
- source_word: וּמָצָאתָ
  choice: tu trouveras
  rationale: Dans cette annonce prophétique, l’accompli hébreu présente ce que Saül rencontrera ensuite ; le futur français convient au contexte.
- source_word: עִם קְבֻרַת רָחֵל
  choice: près du tombeau de Rachel
  rationale: Dans ce contexte locatif, עִם signifie « près de ». « Tombeau » désigne naturellement un lieu de sépulture connu.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: sur le territoire de Benjamin
  rationale: גְּבוּל peut désigner soit une frontière, soit un territoire. Le sens territorial s’intègre bien à l’indication géographique, sans exclure l’autre possibilité signalée en note.
- source_word: בְּצֶלְצַח
  choice: à Tseltsah
  rationale: Le nom de lieu est translittéré selon une forme lisible en français.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: Les ânesses que tu étais allé chercher ont été retrouvées
  rationale: Le féminin précis de אֲתֹנוֹת est naturel en français. Le plus-que-parfait situe la recherche avant cette rencontre, et le passé composé passif exprime le résultat présent.
- source_word: וְהִנֵּה
  choice: Voici que
  rationale: Cette tournure actuelle conserve la fonction présentative et le relief discursif de הִנֵּה sans archaïsme excessif.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: ton père a laissé de côté la question des ânesses
  rationale: 'La formulation reste proche de l’image hébraïque : le père a délaissé l’affaire concernant les ânesses, plutôt que d’avoir cessé de leur accorder toute valeur.'
- source_word: וְדָאַג לָכֶם
  choice: et qu’il s’inquiète pour vous
  rationale: דאג exprime une inquiétude réelle. Le pronom hébreu est pluriel ; le français « vous » la conserve, avec une note pour éviter qu’il soit compris comme un simple vouvoiement.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: Que vais-je faire pour mon fils ?
  rationale: La préposition ל peut ici exprimer ce qui concerne le fils ou ce qui est fait pour lui. « Pour mon fils » garde la concision et l’inquiétude de la question.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond au discours direct adressé personnellement à Saül ; le pluriel « vous » est conservé là où l’hébreu inclut probablement Saül et son serviteur. Les guillemets imbriqués distinguent les paroles des deux hommes de la question rapportée du père.
