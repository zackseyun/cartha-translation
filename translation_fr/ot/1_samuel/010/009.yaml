base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: fr
  text: Il arriva que, lorsqu’il tourna le dos à Samuel pour partir[a], Dieu lui donna un autre cœur[b], et tous ces signes se produisirent ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « lorsqu’il tourna son épaule », expression décrivant le fait de se détourner pour partir.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Dieu changea pour lui un autre cœur » ; on peut aussi comprendre : « Dieu lui changea le cœur, lui en donnant un autre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Il arriva que
  rationale: Cette formule narrative rend l’introduction hébraïque sans recourir à l’archaïsme « il advint ».
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: lorsqu’il tourna le dos
  rationale: L’hébreu dit littéralement « lorsqu’il tourna son épaule » ; « tourner le dos » exprime naturellement en français le geste de se détourner pour partir.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: à Samuel pour partir
  rationale: La tournure française rattache clairement l’éloignement à Samuel tout en conservant l’idée explicite du départ.
- source_word: וַיַּהֲפָךְ לֹו אֱלֹהִים לֵב אַחֵר
  choice: Dieu lui donna un autre cœur
  rationale: Cette formulation française naturelle conserve « un autre cœur » et exprime le résultat du changement opéré par Dieu ; une note signale la construction hébraïque plus littérale.
- source_word: וַיָּבֹאוּ כָּל הָאֹתוֹת הָאֵלֶּה
  choice: tous ces signes se produisirent
  rationale: « Se produisirent » indique que les signes annoncés eurent effectivement lieu, sans ajouter l’idée plus interprétative d’un accomplissement prophétique formel.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Équivalent temporel direct, idiomatique et précis en français moderne.
theological_decisions:
- issue: Nature du changement intérieur de Saül exprimé par « un autre cœur »
  choice: Conserver l’image ouverte « Dieu lui donna un autre cœur »
  alternative: Dieu le régénéra ; Dieu transforma son caractère ; Dieu lui donna du courage pour régner
  rationale: Le texte attribue à Dieu un changement intérieur réel, mais n’en définit pas ici la nature doctrinale exacte. La traduction évite donc de l’identifier explicitement à la régénération, à une transformation morale complète ou au seul courage royal.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tandis que les notes préservent l’image hébraïque de l’épaule et la formulation inhabituelle concernant le cœur sans imposer une interprétation doctrinale.
