  text: וַ/יֹּ֖אמֶר דּ֣וֹד שָׁא֑וּל הַגִּֽידָ/ה נָּ֣א לִ֔/י מָֽה אָמַ֥ר לָ/כֶ֖ם שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/015.yaml
  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: fr
  text: 'Alors l’oncle de Saül lui dit : « Dis-moi, je te prie, ce que Samuel vous a dit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « vous » est au pluriel en hébreu ; il désigne probablement Saül et son serviteur ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » rend naturellement cette progression narrative en français moderne.
- source_word: דּוֹד שָׁאוּל
  choice: l’oncle de Saül
  rationale: Dans ce contexte de parenté, דּוֹד désigne l’oncle; la construction avec le nom Saül est rendue naturellement par « de Saül ».
- source_word: הַגִּידָה נָּא לִי
  choice: Raconte-moi, s’il te plaît
  rationale: L’impératif hiphil de נגד demande de rapporter ce qui a été dit, et נָא atténue la demande par une nuance de politesse. « Raconte-moi » convient au contexte d’un échange dont on veut connaître le contenu.
- source_word: מָה
  choice: ce que
  rationale: Après « raconte-moi », la proposition interrogative indirecte s’exprime idiomatiquement en français par « ce que ».
- source_word: אָמַר
  choice: a dit
  rationale: Le verbe אמר est le verbe courant pour « dire »; le passé composé est naturel dans ce dialogue narratif français.
- source_word: לָכֶם
  choice: vous a dit
  rationale: La forme hébraïque est à la deuxième personne masculine du pluriel. Le français « vous » en préserve la forme, mais son ambiguïté entre singulier de politesse et pluriel nécessite une note.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Transcription française conventionnelle du nom propre biblique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le contraste entre « raconte-moi » au singulier, adressé à Saül, et « vous a dit » au pluriel, qui renvoie vraisemblablement à Saül et à son serviteur.
