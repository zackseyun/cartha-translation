source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: fr
  text: Après cela, tu arriveras à Guibéath-ha-Élohim[a], où se trouve la garnison des Philistins[b]. Quand tu arriveras là, dans la ville, tu rencontreras un groupe de prophètes descendant du haut lieu, avec devant eux une harpe, un tambourin, une flûte et une lyre[c] ; ils prophétiseront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la colline de Dieu » ou « Guibéa de Dieu » ; l'hébreu peut être compris comme un nom de lieu ou comme une désignation descriptive.
    reason: alternative_reading
  - marker: b
    text: Ou « un poste avancé des Philistins » ou « les fonctionnaires des Philistins » ; le terme hébreu peut désigner une installation militaire ou des responsables, mais le contexte favorise ici le sens militaire.
    reason: alternative_reading
  - marker: c
    text: L'identification exacte de ces instruments anciens est incertaine. La « harpe » pourrait être une sorte de luth, et la « flûte », un chalumeau.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: Guibéath-ha-Élohim
  rationale: La tournure fonctionne probablement comme un nom de lieu; la translittération préserve cette lecture sans effacer la possibilité d'un sens descriptif, signalée en note.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: le poste militaire des Philistins
  rationale: נְצִיב peut désigner un poste établi ou un responsable. Le contexte géographique et militaire favorise ici le sens de poste ou garnison; «poste militaire» est clair en français moderne.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: Quand tu entreras dans la ville
  rationale: La formule temporelle hébraïque est rendue naturellement. Le français n'a pas besoin de reproduire séparément שָׁם, déjà impliqué par le lieu précédemment nommé.
- source_word: וּפָגַעְתָּ
  choice: tu rencontreras
  rationale: Le verbe exprime ici le fait de tomber sur quelqu'un ou de le rencontrer; ce choix est naturel et fidèle au contexte.
- source_word: חֶבֶל נְבִיאִים
  choice: un groupe de prophètes
  rationale: חֶבֶל désigne ici une troupe ou un groupe. «Groupe» est immédiatement compréhensible et évite la possible confusion de «bande» avec les musiciens.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: qui descendra du haut lieu
  rationale: בָּמָה désigne un lieu cultuel élevé. «Haut lieu» conserve le terme biblique établi sans le réduire à un simple sanctuaire.
- source_word: נֵבֶל
  choice: harpe
  rationale: L'identification précise de l'instrument antique reste incertaine; «harpe» constitue une approximation accessible, avec une note signalant l'alternative.
- source_word: תֹף
  choice: tambourin
  rationale: Le mot désigne vraisemblablement un instrument de percussion tenu à la main; «tambourin» est le terme français courant.
- source_word: חָלִיל
  choice: flûte
  rationale: Il s'agit d'un instrument à vent; «flûte» est une désignation claire, bien que «chalumeau» ou «pipeau» soient envisageables.
- source_word: כִּנּוֹר
  choice: lyre
  rationale: L'instrument est généralement identifié comme une lyre; ce choix permet aussi de le distinguer du נֵבֶל rendu par «harpe».
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: et ils prophétiseront
  rationale: Cette formulation conserve directement l'idée d'activité prophétique sans préciser indûment si elle consiste en paroles inspirées, musique ou comportement extatique.
theological_decisions:
- issue: Nature de l'activité exprimée par מִתְנַבְּאִים
  choice: «ils prophétiseront», sans caractériser davantage le phénomène
  alternative: «ils seront en état d'extase prophétique» ou «ils chanteront sous l'inspiration»
  rationale: Le verbe indique une activité prophétique, mais le texte ne définit pas exactement sa forme. La traduction maintient cette ouverture théologique et phénoménologique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est fluide sans supprimer les éléments narratifs du texte hébreu. Les termes bibliques utiles, notamment «haut lieu» et «prophétiser», sont conservés; les ambiguïtés réelles concernant le toponyme, le poste philistin, les instruments et l'activité prophétique sont maintenues dans le texte ou les notes.
