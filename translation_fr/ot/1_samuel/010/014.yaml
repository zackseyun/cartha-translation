base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: fr
  text: 'L’oncle de Saül demanda à Saül et à son jeune compagnon[a] : « Où êtes-vous allés ? » Saül répondit : « Nous sommes allés chercher les ânesses. Quand nous avons vu qu’elles étaient introuvables, nous sommes allés trouver Samuel[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son jeune serviteur ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nous sommes venus auprès de Samuel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: l’oncle de Saül
  rationale: Dans ce récit de parenté, דּוֹד désigne naturellement l’oncle de Saül plutôt qu’un parent indéterminé.
- source_word: אֶלָיו וְאֶל נַעֲרוֹ
  choice: lui, ainsi qu’à son jeune compagnon
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. « Jeune compagnon » convient à celui qui accompagne Saül sans imposer un statut servile que le terme seul ne tranche pas.
- source_word: אָן הֲלַכְתֶּם
  choice: Où êtes-vous allés ?
  rationale: La deuxième personne du pluriel vise Saül et son compagnon. Le passé composé est naturel dans un dialogue en français moderne.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: Nous sommes allés chercher les ânesses
  rationale: בקשׁ signifie ici « chercher ». אֲתֹנוֹת est explicitement féminin pluriel, distinction que le français rend naturellement par « ânesses ».
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: Quand nous avons vu qu’elles étaient introuvables
  rationale: Littéralement, la proposition indique qu’il n’y en avait pas ou qu’elles n’étaient pas là. « Introuvables » exprime clairement le constat dans le contexte de la recherche.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: nous sommes allés trouver Samuel
  rationale: בוא exprime le déplacement vers Samuel. « Aller trouver Samuel » est idiomatique en français et évite l’ambiguïté que pourrait créer « venir » dans ce récit rapporté.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste fluide, et la forme féminine précise du mot hébreu pour les ânesses est conservée directement dans le texte.
