  text: וְ/הָיָ֗ה כִּ֥י תבאינה הָ/אֹת֥וֹת הָ/אֵ֖לֶּה לָ֑/ךְ עֲשֵׂ֤ה לְ/ךָ֙ אֲשֶׁ֣ר תִּמְצָ֣א יָדֶ֔/ךָ כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: fr
  text: Lorsque ces signes t’arriveront, fais ce que ta main trouvera à faire[a], car Dieu est avec toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais tout ce qui est à ta portée ». Littéralement, l’hébreu dit : « fais pour toi ce que ta main trouvera ».'
    reason: L’expression hébraïque emploie l’image de la main pour ce qui se présente à quelqu’un ou ce qui est à sa portée ; « à faire » explicite en français l’action sous-entendue.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La construction introduit une circonstance future. « Quand » en rend naturellement la valeur temporelle en français moderne.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: ces signes se produiront pour toi
  rationale: Avec des « signes » pour sujet, בוא indique ici leur survenue. « Se produiront pour toi » reste naturel tout en conservant la nuance personnelle de לָךְ.
- source_word: עֲשֵׂה לְךָ
  choice: fais
  rationale: L’impératif est rendu directement. La nuance personnelle de לְךָ est déjà perceptible dans l’ordre adressé à Saül ; la traduire par « pour toi-même » alourdirait la phrase et pourrait suggérer à tort un intérêt égoïste.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: tout ce que ta main trouvera à faire
  rationale: Cette formulation conserve l’image concrète de la main, qui désigne ce qui se présente et se trouve au pouvoir de Saül, tout en explicitant naturellement l’action sous-entendue.
- source_word: כִּי
  choice: car
  rationale: La conjonction donne la raison de l’ordre ; « car » convient au registre digne du passage.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article hébreu, le nom désigne ici de manière définie le Dieu d’Israël ; « Dieu » est la formulation française idiomatique.
- source_word: עִמָּךְ
  choice: est avec toi
  rationale: La traduction directe exprime la présence et le soutien divins promis à Saül.
theological_decisions:
- issue: Valeur de l’article dans הָאֱלֹהִים
  choice: Dieu
  alternative: le Dieu
  rationale: En français, l’article hébreu n’impose pas « le Dieu » dans cette phrase. « Dieu est avec toi » rend clairement la référence définie au Dieu d’Israël sans ajout confessionnel.
- issue: Portée de l’ordre donné à Saül
  choice: fais tout ce que ta main trouvera à faire
  alternative: fais tout ce qui est en ton pouvoir
  rationale: Le texte autorise Saül à agir dans la situation qui se présentera, en raison de la présence de Dieu. Conserver l’image hébraïque évite de préciser davantage la nature ou l’étendue de cette action.
translation_notes:
  register: Français international moderne, clair et digne. L’image hébraïque de la main est conservée dans le texte, tandis que la note en donne le sens idiomatique.
