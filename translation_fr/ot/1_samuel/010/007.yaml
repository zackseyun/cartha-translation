  - severity: low
    issue: Formulation de la note comme si « à faire » était littéral
    rationale: L’hébreu dit littéralement « fais pour toi ce que ta main trouvera » ; « à faire » est une explicitation française légitime, mais ne devrait pas figurer dans la citation présentée comme littérale.
  revised_text: Lorsque ces signes t’arriveront, fais ce que ta main trouvera à faire[a], car Dieu est avec toi.
