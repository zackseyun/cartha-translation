  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: fr
  text: 'Ils consultèrent de nouveau Yahweh : « L’homme est-il déjà venu ici ? » Yahweh dit : « Voici qu’il est caché parmi les bagages[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un terme général qui peut désigner des objets, des ustensiles ou du matériel. Ici, il s’agit vraisemblablement des bagages ou des provisions des personnes rassemblées.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: Ils consultèrent encore Yahweh
  rationale: Avec בַּיהוָה, le verbe שׁאל désigne ici le fait de consulter Dieu pour recevoir une réponse, et עוֹד marque la répétition.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: L’homme est-il déjà venu ici ?
  rationale: La question porte sur la venue effective de l’homme recherché. « Déjà » rend naturellement עוֹד dans cette interrogation, tandis que « ici » restitue הֲלֹם.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette tournure attire l’attention sur la révélation qui suit sans donner à entendre que Saül est déjà visible.
- source_word: נֶחְבָּא
  choice: il s’est caché
  rationale: 'Le niphal de חבא se comprend naturellement ici dans un sens réfléchi : Saül s’est dissimulé.'
- source_word: אֶל הַכֵּלִים
  choice: parmi les bagages
  rationale: כֵּלִים peut désigner divers objets, ustensiles ou équipements ; dans le cadre de ce rassemblement, « bagages » exprime clairement les affaires et le matériel entreposés.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » conserve le nom divin personnel plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et orale dans le dialogue, tout en conservant l’effet d’insistance de הִנֵּה.
