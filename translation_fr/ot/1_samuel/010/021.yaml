source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: fr
  text: Il fit alors approcher la tribu de Benjamin, clan par clan[a], et le clan des Matrites fut désigné par le sort[b]. Puis Saül, fils de Qish, fut désigné, mais on le chercha sans le trouver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « selon ses familles ». Le terme hébreu peut désigner des familles étendues ou des clans au sein d’une tribu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fut pris ». Il s’agit ici d’une désignation par le sort, et non d’une capture.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Il fit alors approcher
  rationale: Le hiphil de קרב signifie « faire approcher » ou « présenter ». Cette formulation conserve le mouvement procédural du tirage au sort.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: la tribu de Benjamin
  rationale: « Tribu » est le terme français courant pour cette unité d’organisation d’Israël.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: clan par clan
  rationale: מִשְׁפָּחָה désigne ici un groupe familial étendu à l’intérieur de la tribu; la tournure distributive rend naturellement le לְ hébreu.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: fut désigné par le sort / fut désigné
  rationale: Dans ce contexte, le niphal de לכד indique celui que le sort désigne, non une capture militaire. La seconde occurrence reprend implicitement le même procédé.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: le clan des Matrites
  rationale: Cette formulation garde le gentilé collectif hébreu tout en restant naturelle en français.
- source_word: שָׁאוּל בֶּן־קִישׁ
  choice: Saül, fils de Qish
  rationale: Le patronyme est rendu selon l’usage français. « Qish » représente directement la consonne initiale ק du nom hébreu.
- source_word: וַיְבַקְשֻׁהוּ וְלֹא נִמְצָא
  choice: mais on le chercha sans le trouver
  rationale: La tournure française exprime avec naturel la recherche suivie de son échec, sans ajouter l’idée d’une impossibilité intrinsèque.
theological_decisions:
- issue: Nature de la désignation de Saül
  choice: Expliciter le tirage au sort à la première occurrence de לכד
  alternative: Traduire littéralement « fut pris »
  rationale: « Fut pris » évoquerait normalement en français une arrestation ou une capture. Le contexte immédiat décrit une sélection sacrée par le sort; l’explicitation évite ce contresens culturel sans préciser davantage le rôle divin que ne le fait le verset.
translation_notes:
  register: Français international moderne, narratif et digne. « Clan par clan » clarifie la progression tribu → clan → individu. Le passé simple convient au registre biblique littéraire sans être archaïque.
