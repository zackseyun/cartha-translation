  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: fr
  text: Puis Samuel fit approcher toutes les tribus d’Israël, et la tribu de Benjamin fut désignée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fut prise ». Il s’agit ici d’une sélection par tirage au sort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fit approcher
  rationale: Le hiphil de קרב exprime l’action de faire approcher ou de présenter. « Fit approcher » conserve cette valeur causative et convient à la présentation successive des tribus.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: toutes les tribus d’Israël
  rationale: Rendu naturel et fidèle du groupe construit avec כָּל, en maintenant la portée collective.
- source_word: וַיִּלָּכֵד
  choice: fut désignée par le sort
  rationale: Le niphal de לכד signifie littéralement « fut prise ». Dans ce contexte, il décrit le résultat d’une sélection sacrée par tirage au sort. Le rendu explicite le mécanisme contextuel tout en signalant le sens littéral en note.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: la tribu de Benjamin
  rationale: Formulation française usuelle qui identifie clairement la tribu retenue parmi celles d’Israël.
theological_decisions:
- issue: Agent implicite et moyen de la sélection
  choice: Employer le passif « fut désignée par le sort » sans nommer explicitement Dieu comme agent
  alternative: « l’Éternel désigna la tribu de Benjamin »
  rationale: L’hébreu emploie un passif et ne nomme pas l’agent dans ce verset. Le contexte indique le recours au sort, mais il ne faut pas remplacer le passif par un agent divin explicite.
translation_notes:
  register: Français international moderne, clair et digne. « Fit approcher » préserve la forme causative du verbe hébreu; « fut désignée par le sort » rend intelligible l’emploi contextuel de « fut prise », dont la formulation littérale est conservée en note.
