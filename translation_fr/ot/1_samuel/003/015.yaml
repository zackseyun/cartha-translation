id: 1SA.3.15
reference: 1 Samuel 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: fr
  text: Samuel resta couché jusqu’au matin, puis il ouvrit les portes de la maison de Yahweh. Mais Samuel avait peur de raconter la vision[a] à Éli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’apparition ». Le mot hébreu mar’ah peut désigner une apparition ou une révélation reçue en vision. Ici, « vision » convient le mieux au contexte de la révélation nocturne faite à Samuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: resta couché
  rationale: Le verbe שׁכב signifie « se coucher » ou « être couché ». Avec « jusqu’au matin », « resta couché » est naturel en français et n’ajoute pas l’idée, non explicitée, qu’il dormit.
- source_word: עַד הַבֹּקֶר
  choice: jusqu’au matin
  rationale: Rend directement et naturellement la limite temporelle indiquée par l’hébreu.
- source_word: וַיִּפְתַּח
  choice: puis il ouvrit
  rationale: « Ouvrit » traduit précisément le verbe; « puis » exprime sobrement la progression narrative portée par le waw consécutif.
- source_word: דַּלְתוֹת
  choice: les portes
  rationale: Le pluriel hébreu est conservé sans préciser davantage la forme ou la fonction des battants.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » correspond à בֵּית et évite le terme plus spécifique, voire anachronique ici, de « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: יָרֵא
  choice: avait peur
  rationale: Expression idiomatique en français moderne qui conserve clairement l’émotion de Samuel.
- source_word: מֵהַגִּיד
  choice: de raconter
  rationale: Après « avoir peur », la construction française naturelle est « avoir peur de ». « Raconter » convient à la communication détaillée de la révélation reçue.
- source_word: הַמַּרְאָה
  choice: la vision
  rationale: מַרְאָה peut désigner une apparence ou une manifestation visionnaire. Dans le contexte de la révélation nocturne faite à Samuel, « vision » est le meilleur équivalent contextuel tout en signalant l’autre possibilité en note.
- source_word: אֶל עֵלִי
  choice: à Éli
  rationale: Rend naturellement le destinataire du récit en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Nature de הַמַּרְאָה
  choice: la vision
  alternative: l’apparition
  rationale: Le contexte présente une révélation nocturne adressée à Samuel. « Vision » convient donc le mieux, sans exclure la nuance d’« apparition », conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite d’affirmer que Samuel dormit et conserve « maison » plutôt que « temple ». Le marqueur de note est placé après « vision », le mot auquel la variante lexicale se rapporte.
