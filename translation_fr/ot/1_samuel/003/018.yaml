base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: fr
  text: 'Samuel lui rapporta toutes les paroles, sans rien lui cacher. Éli dit : « C’est Yahweh. Qu’il fasse[a] ce qui est bon à ses yeux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il fera ». La forme verbale hébraïque peut exprimer soit une acceptation soumise — « Qu’il fasse » — soit un simple futur.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « à ses yeux », expression qui signifie ici : selon son propre jugement, ou comme il le juge bon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: rapporta
  rationale: Le hifil de נגד signifie ici faire connaître ou rapporter. « Rapporta » convient au récit et à la transmission directe du message à Éli.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: toutes ces paroles
  rationale: דְּבָרִים peut désigner des paroles ou des choses. Le contexte renvoie au message que Samuel vient de recevoir; « toutes ces paroles » en conserve la forme verbale et la totalité.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: sans rien lui cacher
  rationale: כחד exprime l’action de cacher ou de retenir une information. La formulation française est naturelle et souligne que Samuel n’a rien omis.
- source_word: יְהוָה הוּא
  choice: C’est Yahweh
  rationale: La proposition nominale hébraïque identifie avec insistance Yahweh comme l’auteur de la parole annoncée. « C’est Yahweh » est idiomatique en français sans ajouter de copule théologiquement chargée.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: ce qui est bon à ses yeux
  rationale: La traduction conserve l’image hébraïque des « yeux », qui exprime ici le jugement propre de Yahweh.
- source_word: יַעֲשֶׂה
  choice: Qu’il fasse
  rationale: Dans la réponse d’Éli, l’imparfait hébreu se comprend naturellement avec une valeur volitive exprimant l’acceptation ou la soumission, tout en laissant en note la lecture prédictive possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom divin lui-même; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Valeur de יַעֲשֶׂה dans la déclaration finale d’Éli
  choice: Qu’il fasse
  alternative: Il fera
  rationale: Le contexte favorise une parole de soumission au jugement annoncé, mais la forme hébraïque peut aussi être comprise comme un futur simple; cette ambiguïté est signalée en note.
- issue: Sens de יְהוָה הוּא
  choice: C’est Yahweh
  alternative: Il est Yahweh
  rationale: Le français idiomatique exprime ainsi l’identification emphatique de l’auteur du message, sans transformer la phrase en affirmation abstraite sur l’être divin.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant l’image hébraïque « à ses yeux » et le nom divin Yahweh.
