  variant: modern international French
source:
  edition: WLC
  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: fr
  text: 'Je lui ai annoncé que je juge sa maison pour toujours, à cause de la faute dont il avait connaissance : ses fils attiraient sur eux-mêmes la malédiction[a], et il ne les a pas réprimés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre lecture attestée par certains témoins anciens et suivie par de nombreuses traductions : « ses fils maudissaient Dieu » ou « blasphémaient ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: Je lui ai annoncé
  rationale: Le hiphil de נגד exprime l’action de faire connaître ou d’annoncer. Le passé composé convient à une déclaration déjà faite et toujours pertinente dans le discours.
- source_word: שֹׁפֵט אֲנִי
  choice: je juge
  rationale: Le participe accompagné du pronom explicite présente le jugement comme actuel ou imminent. Le présent français conserve cette solennité sans imposer un simple futur.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: L’expression hébraïque peut désigner à la fois la maisonnée et la lignée. « Sa maison » en préserve volontairement l’étendue.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression marque une durée sans terme précisé et souligne le caractère durable du jugement.
- source_word: בַּעֲוֺן אֲשֶׁר יָדַע
  choice: à cause de la faute dont il avait connaissance
  rationale: Cette formulation naturelle rend la culpabilité d’Éli liée à sa connaissance de la faute, sans suggérer que le verbe « connaître » aurait pour objet ses fils eux-mêmes.
- source_word: מְקַלְלִים לָהֶם
  choice: attiraient sur eux-mêmes la malédiction
  rationale: La forme du texte massorétique se comprend naturellement comme une malédiction que les fils faisaient venir sur eux-mêmes. Cette traduction conserve cette lecture difficile sans introduire dans le corps du texte la variante « Dieu ».
- source_word: וְלֹא כִהָה בָּם
  choice: et il ne les a pas réprimés
  rationale: Le verbe évoque ici le fait de contenir, corriger ou arrêter leur conduite. « Réprimer » exprime clairement le manquement d’Éli tout en restant proche de cette gamme de sens.
theological_decisions:
- issue: Objet de la malédiction ou du blasphème commis par les fils d’Éli
  choice: 'Le texte principal suit le texte massorétique : « attiraient sur eux-mêmes la malédiction »'
  alternative: « maudissaient Dieu » ou « blasphémaient »
  rationale: Le texte hébreu massorétique soutient la lecture réflexive retenue, tandis que certains témoins anciens reflètent une lecture mentionnant Dieu. La variante est signalée sans effacer la difficulté textuelle.
- issue: Étendue du jugement porté sur la maison d’Éli
  choice: Conserver « sa maison » sans en préciser davantage la portée
  alternative: « sa maisonnée » ou « sa lignée »
  rationale: L’idiome hébreu peut englober le foyer immédiat aussi bien que la descendance. Le conserver évite de trancher indûment.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation avec deux-points explicite naturellement le lien entre la faute connue d’Éli et la conduite de ses fils, tout en conservant la progression du verset hébreu.
