source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: fr
  text: Le jeune Samuel était au service de Yahweh en présence d’Éli. En ce temps-là, la parole de Yahweh était rare, et les visions n’étaient pas fréquentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression hébraïque peut se rendre par « il n’y avait pas de vision qui se répandait » ou « qui jaillissait ». Elle indique que les visions révélatrices étaient peu courantes et ne se manifestaient pas largement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר שְׁמוּאֵל
  choice: Le jeune Samuel
  rationale: הַנַּעַר désigne ici un garçon ou un jeune serviteur. « Le jeune Samuel » est naturel en français et convient à son âge dans le récit; le וְ initial n’exige pas nécessairement un « et » autonome en ouverture de scène.
- source_word: מְשָׁרֵת אֶת־יְהוָה
  choice: servait Yahweh
  rationale: Le participe exprime une activité suivie. « Servait » conserve cette valeur durative et peut porter en français la nuance religieuse du service accompli pour Yahweh.
- source_word: לִפְנֵי עֵלִי
  choice: sous la direction d’Éli
  rationale: Littéralement « devant Éli » ou « en présence d’Éli ». Dans ce contexte, l’expression indique que Samuel accomplit son service sous la supervision d’Éli; cette formulation évite l’ambiguïté spatiale peu naturelle de « devant Éli ».
- source_word: וּדְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Rend directement l’expression hébraïque consacrée qui désigne ici la révélation communiquée par Dieu.
- source_word: יָקָר
  choice: était rare
  rationale: Le mot peut signifier « précieux », mais le parallélisme avec la rareté des visions indique ici ce qui est peu fréquent ou peu disponible.
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Équivalent français idiomatique de « en ces jours-là », sans archaïsme inutile.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: les visions n’étaient pas fréquentes
  rationale: חָזוֹן concerne la vision révélatrice; נִפְרָץ évoque ce qui se répand ou surgit largement. La formulation française exprime clairement que de telles révélations étaient inhabituelles, tout en signalant en note l’image hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » rend le nom propre et le distingue d’un titre, conformément à la couche de consultation fournie.
- issue: Relation de Samuel avec Éli dans לִפְנֵי עֵלִי
  choice: sous la direction d’Éli
  alternative: devant Éli / en présence d’Éli
  rationale: Le sens littéral demeure possible, mais le contexte suggère la supervision d’Éli. Le choix français explicite cette relation sans lui attribuer une fonction théologique supplémentaire.
- issue: Nature de חָזוֹן
  choice: les visions
  alternative: la vision
  rationale: Le singulier hébreu peut avoir une valeur collective. Le pluriel français exprime naturellement la rareté des manifestations révélatrices sans prétendre qu’aucune vision n’existait absolument.
translation_notes:
  register: Français international moderne, simple et digne. « Éli » reçoit l’accent nécessaire à la lecture française. La phrase est divisée en deux pour préserver la clarté, et le point-virgule hébraïque implicite est rendu par une coordination naturelle. Le marqueur [a] est placé après l’expression qu’il explique.
