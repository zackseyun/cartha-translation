  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: fr
  text: Tout Israël, depuis Dan jusqu’à Beer-Shéba, sut que Samuel était reconnu comme prophète de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « établi comme prophète de Yahweh ». Le terme hébreu peut évoquer le fait d’être reconnu fiable, établi ou confirmé.
    reason: Alternative lexicale permettant de préserver l’étendue sémantique de נֶאֱמָן.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: sut
  rationale: Le verbe ידע exprime ici une connaissance devenue générale. Le passé simple « sut » rend sobrement le constat narratif, sans transformer explicitement cette connaissance en décision officielle.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette expression collective désigne l’ensemble du peuple et se transpose naturellement en français biblique courant par « tout Israël ».
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: depuis Dan jusqu’à Beer-Shéba
  rationale: Les deux lieux forment un mérisme désignant toute l’étendue du pays. Les conserver préserve l’image géographique du texte hébreu.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que tout Israël savait.
- source_word: נֶאֱמָן
  choice: confirmé
  rationale: Le participe niphal de אמן peut indiquer ce qui est établi, reconnu fiable ou confirmé. Dans le contexte, où les paroles de Samuel s’accomplissent, « confirmé » exprime que son statut prophétique s’est révélé authentique, sans suggérer une ordination technique.
- source_word: לְנָבִיא
  choice: comme prophète
  rationale: La préposition לְ marque ici la fonction ou le statut reconnu de Samuel.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: La construction indique la relation de Samuel avec Yahweh, dont il est le prophète. « de Yahweh » est naturel et conserve directement le nom divin.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre de l’alliance au lieu de le remplacer par un titre.
- issue: Portée de נֶאֱמָן appliqué au statut prophétique de Samuel
  choice: confirmé comme prophète
  alternative: établi comme prophète / reconnu digne de confiance comme prophète
  rationale: Le contexte met l’accent sur l’authentification publique du ministère prophétique de Samuel. La note conserve toutefois la gamme sémantique réelle du terme au lieu d’exclure ses nuances de fiabilité et d’établissement.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit historique. « Depuis Dan jusqu’à Beer-Shéba » conserve l’expression géographique traditionnelle, tandis que la note signale sans la résoudre abusivement l’ambiguïté de נֶאֱמָן.
