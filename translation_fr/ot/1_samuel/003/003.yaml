source:
  edition: WLC
  text: וְ/נֵ֤ר אֱלֹהִים֙ טֶ֣רֶם יִכְבֶּ֔ה וּ/שְׁמוּאֵ֖ל שֹׁכֵ֑ב בְּ/הֵיכַ֣ל יְהוָ֔ה אֲשֶׁר שָׁ֖ם אֲר֥וֹן אֱלֹהִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: fr
  text: La lampe de Dieu n’était pas encore éteinte, et Samuel était couché dans le temple de Yahvé[a], où se trouvait l’arche de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire de Yahvé ». Le mot hébreu peut désigner un temple ou un sanctuaire; ici, il s’agit du lieu où Yahvé demeure à Silo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: la lampe de Dieu
  rationale: נֵר désigne une lampe, et le complément אֱלֹהִים est rendu directement par « de Dieu ». Dans ce contexte, il s’agit vraisemblablement de la lampe liée au culte dans le sanctuaire.
- source_word: טֶרֶם יִכְבֶּה
  choice: n’était pas encore éteinte
  rationale: טֶרֶם exprime qu’un événement ne s’est pas encore produit, et כבה décrit naturellement l’extinction d’une lampe. Cette tournure française conserve le sens temporel sans préciser si quelqu’un l’a éteinte.
- source_word: שֹׁכֵב
  choice: était couché
  rationale: Le participe décrit la position de Samuel. « Était couché » reste proche du sens lexical sans affirmer explicitement qu’il dormait.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahvé
  rationale: הֵיכָל peut désigner un temple, un sanctuaire ou un palais. « Temple » est ici naturel dans un contexte cultuel, tandis qu’une note signale « sanctuaire », qui évite une possible association anachronique avec le temple de Salomon.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par le titre « le Seigneur ».
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: où se trouvait l’arche de Dieu
  rationale: La proposition relative situe le lieu par rapport à la présence de l’arche. Cette formulation est naturelle en français et conserve la valeur locative de שָׁם.
theological_decisions:
- issue: Sens de הֵיכַל יְהוָה dans le contexte prémonarchique de Silo
  choice: le temple de Yahvé
  alternative: le sanctuaire de Yahvé
  rationale: Même avant la construction du temple de Salomon, הֵיכָל peut lexicalement désigner le lieu de culte de Silo. « Temple » est donc possible, mais « sanctuaire » demeure une traduction légitime et historiquement moins susceptible d’être mal comprise; elle est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination de l’hébreu est conservée, tandis que « où se trouvait » donne à la proposition locative une forme française naturelle. Le marqueur de note est placé après « temple de Yahvé », terme auquel la note se rapporte.
