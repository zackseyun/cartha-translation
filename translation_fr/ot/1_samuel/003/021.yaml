source:
  edition: WLC
  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: fr
  text: Yahweh continua d’apparaître à Silo, car Yahweh se révélait à Samuel à Silo par la parole de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au moyen de la parole de Yahweh ».'
    reason: La préposition hébraïque ב peut être comprise ici comme indiquant le moyen ou la médiation.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: continua
  rationale: La construction יסף suivie de l’infinitif exprime ici la continuation ou la répétition. « Continua » rend naturellement cette valeur en français.
- source_word: לְהֵרָאֹה
  choice: d’apparaître
  rationale: Le nifal de ראה désigne ici une manifestation perceptible de Dieu. « Apparaître » conserve la formulation du texte sans préciser davantage le mode de cette manifestation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: à Silo
  rationale: La préposition ב est locative. En français, « à Silo » est la tournure naturelle pour une ville ou un sanctuaire.
- source_word: כִּי
  choice: En effet
  rationale: כִּי introduit ici l’explication de l’affirmation précédente. « En effet » exprime clairement ce rapport tout en évitant une subordination française pesante.
- source_word: נִגְלָה
  choice: se révélait
  rationale: Le nifal de גלה évoque la manifestation ou le dévoilement de soi. L’imparfait français convient à la portée récapitulative et répétée du contexte, tout en distinguant ce verbe de « apparaître ».
- source_word: אֶל שְׁמוּאֵל
  choice: à Samuel
  rationale: Cette formulation rend naturellement en français la personne à qui Yahweh se révèle.
- source_word: בִּדְבַר יְהוָה
  choice: par la parole de Yahweh
  rationale: La préposition ב peut ici marquer le moyen ou la médiation. « Par la parole de Yahweh » conserve la concision de l’hébreu et indique que la révélation s’effectue par sa parole.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. La transcription « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Nature de la manifestation divine
  choice: Maintenir à la fois « apparaître » et « se révéler… par la parole »
  alternative: Préciser qu’il s’agit exclusivement d’une vision ou d’une apparition corporelle
  rationale: L’hébreu associe le langage de l’apparition à celui d’une révélation par la parole, sans définir plus exactement son mode. La traduction conserve cette tension sans imposer une interprétation.
- issue: Valeur de ב dans בִּדְבַר יְהוָה
  choice: par la parole de Yahweh
  alternative: au moyen de la parole de Yahweh ; dans la parole de Yahweh
  rationale: La lecture instrumentale est la plus naturelle dans le contexte, mais la note signale une formulation possible qui explicite davantage la médiation.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « Yahweh » est maintenue parce qu’elle appartient à la structure insistante de l’hébreu. « En effet » rend le lien explicatif de manière naturelle, et l’imparfait « se révélait » s’accorde avec la continuité évoquée dans la première proposition.
