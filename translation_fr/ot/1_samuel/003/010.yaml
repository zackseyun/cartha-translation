source:
  edition: WLC
  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: fr
  text: 'Alors Yahweh vint, se tint là et appela comme les fois précédentes[a] : « Samuel ! Samuel ! » Samuel dit : « Parle, car ton serviteur écoute. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme auparavant ». L’expression hébraïque compare cet appel aux appels précédents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération usuelle du nom divin personnel préserve sa distinction d’avec le titre « Seigneur ».
- source_word: וַיָּבֹא
  choice: vint
  rationale: Le verbe בוא exprime simplement la venue ou l’arrivée ; « vint » convient au récit et reste direct.
- source_word: וַיִּתְיַצַּב
  choice: se tint là
  rationale: La forme hitpael de יצב décrit le fait de prendre position et de se tenir en un lieu. Cette formulation conserve le caractère concret de la scène sans lui ajouter d’explication.
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Dans ce contexte, קרא désigne l’action de s’adresser à Samuel à voix haute ; « appela » n’exagère pas l’intensité de la voix.
- source_word: כְפַעַם בְּפַעַם
  choice: comme les fois précédentes
  rationale: L’expression idiomatique rapproche cet appel des appels antérieurs du récit. La formulation française rend clairement cette comparaison.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: Samuel ! Samuel !
  rationale: La répétition du nom est conservée, car elle exprime l’insistance personnelle de l’appel.
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif hébreu est simple et direct ; « Parle » en garde la brièveté.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison pour laquelle Samuel invite Dieu à parler. « Car » exprime ce lien avec concision.
- source_word: שֹׁמֵעַ
  choice: écoute
  rationale: Le participe décrit l’attention présente de Samuel. En français, « écoute » exprime naturellement cette disponibilité active.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Bien que עבד puisse désigner un esclave, il s’agit ici d’une formule de déférence et de soumission ; « ton serviteur » convient au contexte.
theological_decisions:
- issue: Description anthropomorphique de la venue de Yahweh
  choice: Conserver les actions concrètes « vint » et « se tint là »
  alternative: Atténuer la formulation en traduisant par « apparut » ou « manifesta sa présence »
  rationale: L’hébreu raconte l’action de Yahweh en termes personnels et concrets. La traduction maintient cette tension narrative sans expliquer ni spiritualiser la scène.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ou Jéhovah
  rationale: « Yahweh » distingue le nom personnel divin du titre אֲדֹנָי et évite d’introduire dans le corps du texte un substitut absent de l’hébreu consonantique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative reste sobre, la répétition du nom est préservée et le discours direct suit la ponctuation française contemporaine.
