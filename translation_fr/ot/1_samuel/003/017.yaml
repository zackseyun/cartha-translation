  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: fr
  text: 'Il dit : « Quelle est la parole qu’il t’a adressée ? Je t’en prie, ne me la cache pas. Que Dieu te fasse ceci, et davantage encore, si tu me caches une seule chose de toute la parole qu’il t’a adressée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus fluide : « si tu me caches quoi que ce soit de tout ce qu’il t’a dit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: Quelle est la parole
  rationale: « Parole » conserve le lien thématique avec la révélation et les actes de parler qui structurent le récit, sans réduire דָּבָר au seul sens de « message ».
- source_word: דִּבֶּר אֵלֶיךָ
  choice: qu’il t’a adressée
  rationale: Cette tournure française naturelle exprime une parole dite directement à Samuel tout en maintenant le rapport avec « la parole ».
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: Je t’en prie, ne me la cache pas
  rationale: « Je t’en prie » rend la particule d’insistance et de supplication נָא ; « la » reprend naturellement « la parole ».
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: Que Dieu te fasse ceci, et davantage encore
  rationale: La formulation conserve le caractère volontairement non précisé de la malédiction conditionnelle et la force solennelle de la formule de serment hébraïque.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: si tu me caches une seule chose de toute la parole
  rationale: « Une seule chose » rend le second דָּבָר selon son sens contextuel, tandis que « toute la parole » maintient le singulier collectif et la répétition significative du terme hébreu.
theological_decisions:
- issue: Sens de אֱלֹהִים dans la formule de serment
  choice: Dieu
  alternative: les dieux
  rationale: Dans ce contexte israélite et dans cette formule de serment habituelle, אֱלֹהִים désigne le Dieu d’Israël ; le pluriel français donnerait à tort un sens polythéiste.
- issue: Formule de malédiction laissée sans objet explicite
  choice: Que Dieu te fasse ceci, et davantage encore
  alternative: Que Dieu te punisse très sévèrement
  rationale: L’hébreu ne précise pas le malheur invoqué. La traduction retenue préserve cette réserve rhétorique et évite d’expliciter la nature du châtiment.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond à l’adresse d’Éli au jeune Samuel. La légère solennité de la formule de serment est conservée sans archaïsmes.
