base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: fr
  text: Ce jour-là, je mettrai à exécution contre Éli[a] tout ce que j’ai déclaré au sujet de sa maison[b], du commencement à la fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’accomplirai à l’égard d’Éli tout ce que j’ai déclaré au sujet de sa maison ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « maison » peut désigner la maisonnée, la lignée familiale ou la maison sacerdotale d’Éli.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle française naturelle qui conserve la référence à un jour futur précis.
- source_word: אָקִים
  choice: je mettrai à exécution
  rationale: Le hiphil de קום, avec pour objet tout ce que Dieu a déclaré, signifie ici faire tenir sa parole, la réaliser. « Mettre à exécution » convient particulièrement à l’annonce d’un jugement.
- source_word: אֶל עֵלִי
  choice: contre Éli
  rationale: La préposition אֶל signifie souvent « vers » ou « à », mais le contexte de jugement indique que l’accomplissement annoncé est dirigé contre Éli. Une note préserve la formulation alternative moins interprétative.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: tout ce que j’ai déclaré
  rationale: Rend la totalité exprimée par כָּל אֲשֶׁר et la parole divine antérieure, toujours pertinente dans le contexte.
- source_word: אֶל בֵּיתוֹ
  choice: au sujet de sa maison
  rationale: Après le verbe « déclarer », אֶל peut indiquer ce sur quoi portait la parole. Cette formulation distingue utilement Éli, contre qui le jugement est exécuté, de sa maison, au sujet de laquelle Dieu avait parlé.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: 'Conserve l’étendue sémantique de בַּיִת : maisonnée, lignée familiale et, dans ce contexte, maison sacerdotale.'
- source_word: הָחֵל וְכַלֵּה
  choice: du commencement à la fin
  rationale: Cette expression verbale coordonnée souligne que l’exécution sera intégrale, depuis son commencement jusqu’à son achèvement.
theological_decisions:
- issue: Portée du jugement concernant Éli et sa maison
  choice: Conserver « sa maison » dans le texte principal sans en limiter explicitement la portée.
  alternative: Traduire par « sa famille », « sa lignée » ou « sa maison sacerdotale ».
  rationale: Le mot בֵּיתוֹ peut englober la maisonnée, la lignée familiale et la maison sacerdotale d’Éli. Le terme « maison », accompagné d’une note, préserve cette ampleur et ne tranche pas indûment.
- issue: Valeur de אֶל devant Éli
  choice: Traduire « contre Éli » selon le contexte de jugement.
  alternative: Traduire « pour Éli » ou « envers Éli », en restant plus près du sens directionnel ordinaire de la préposition.
  rationale: Le contenu annoncé en 1 Samuel 2 est un jugement défavorable. « Contre » rend clairement cette force contextuelle, tandis que la note signale l’autre possibilité grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. « Mettre à exécution » exprime naturellement l’accomplissement certain d’une parole de jugement. La formulation garde la portée familiale et sacerdotale de « maison » sans la préciser excessivement.
