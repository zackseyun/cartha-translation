  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/עֵלִ֖י שֹׁכֵ֣ב בִּ/מְקֹמ֑/וֹ ו/עינ/ו הֵחֵ֣לּוּ כֵה֔וֹת לֹ֥א יוּכַ֖ל לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: fr
  text: Ce jour-là, Éli était couché à sa place. Ses yeux[a] avaient commencé à faiblir, et il ne pouvait pas voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son œil avait commencé à faiblir ». La forme hébraïque peut être comprise collectivement comme désignant la vue ; d’où « ses yeux » dans le texte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[non rendu séparément]'
  rationale: La forme narrative introduit ici la situation. En français moderne, ajouter « Or » ou « Il arriva que » alourdirait le récit sans apporter de contenu temporel explicite.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend directement l’expression temporelle avec le démonstratif, dans un français naturel.
- source_word: שֹׁכֵב
  choice: était couché
  rationale: Le participe décrit l’état prolongé d’Éli. « Était couché » convient au contexte nocturne et reste plus naturel que « était en train de se coucher », qui suggérerait une action.
- source_word: בִּמְקֹמוֹ
  choice: à sa place
  rationale: Préserve le terme général מָקוֹם sans préciser indûment qu’il s’agissait d’une chambre.
- source_word: וְעֵינוֹ
  choice: Ses yeux
  rationale: Le texte évoque la faculté visuelle d’Éli ; le pluriel est idiomatique en français et s’accorde avec le verbe hébreu pluriel qui suit. La forme susceptible d’être comprise au singulier est signalée en note.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: avaient commencé à faiblir
  rationale: Conserve à la fois l’idée de commencement et celle d’un affaiblissement progressif de la vue. Le plus-que-parfait situe cette évolution avant la scène racontée.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: il ne pouvait pas voir
  rationale: Traduction directe et naturelle de l’incapacité exprimée, sans préciser davantage son degré ou sa durée.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation en deux phrases évite une coordination trop lourde tout en conservant la progression du verset. Le marqueur de note est placé après « yeux », là où se trouve réellement la variante lexicale.
