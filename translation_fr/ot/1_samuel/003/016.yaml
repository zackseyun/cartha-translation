  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: fr
  text: 'Alors Éli appela Samuel et dit : « Samuel, mon fils ! » Il répondit : « Me voici. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Dans ce contexte narratif, קרא désigne naturellement le fait d’appeler quelqu’un en lui adressant la parole. « Appela » est précis et idiomatique.
- source_word: עֵלִי
  choice: Éli
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: La marque hébraïque de l’objet direct אֶת ne se traduit pas en français ; le nom propre conserve sa forme française usuelle.
- source_word: וַיֹּאמֶר
  choice: dit / répondit
  rationale: אמר est le verbe narratif ordinaire de parole. « Dit » le rend directement dans la première proposition ; pour la réplique de Samuel, « répondit » exprime naturellement en français la fonction contextuelle du même verbe sans en modifier le sens.
- source_word: שְׁמוּאֵל בְּנִי
  choice: Samuel, mon fils !
  rationale: בְּנִי signifie littéralement « mon fils » et marque ici le lien ainsi que l’affection d’Éli envers Samuel. L’exclamation convient à l’interpellation directe.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Formule française consacrée qui exprime à la fois la présence et la disponibilité contenues dans l’hébreu הִנֵּנִי.
- source_word: וַ
  choice: Alors / coordination implicite
  rationale: La première forme narrative fait avancer la séquence et se rend naturellement par « Alors ». Devant la réponse, le français n’exige pas de traduire explicitement la coordination hébraïque.
