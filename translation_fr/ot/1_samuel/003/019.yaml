base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: fr
  text: Samuel grandit. Yahweh était avec lui et ne laissa tomber à terre aucune de ses paroles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement dit : « ne laissa aucune de ses paroles rester sans effet ». L’expression hébraïque dit littéralement qu’il ne laissa aucune de ses paroles « tomber à terre ».'
    reason: Explication de l’idiome hébraïque et indication d’un rendu lexical possible.
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: grandissait
  rationale: Le verbe גדל décrit ici la croissance et la maturation de Samuel. L’imparfait français exprime naturellement ce développement continu dans le récit, sans le limiter à la croissance physique ni l’interpréter comme une accession à la grandeur.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle et courante du nom personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui préserve son caractère de nom propre plutôt que de lui substituer un titre.
- source_word: הָיָה עִמּוֹ
  choice: était avec lui
  rationale: Rendu direct qui conserve l’expression hébraïque de la présence et de la faveur divines.
- source_word: וְלֹא הִפִּיל
  choice: et ne laissait aucune … tomber
  rationale: Le hifil de נפל sous négation indique que Yahweh ne permettait pas que les paroles de Samuel tombent, c’est-à-dire restent sans effet. La formulation française conserve à la fois la nuance causative et l’image hébraïque.
- source_word: מִכָּל דְּבָרָיו
  choice: aucune de ses paroles
  rationale: La tournure hébraïque signifie idiomatiquement qu’aucune des paroles de Samuel n’est exclue. « Paroles » reste volontairement plus large que « prophéties » ou « prédictions ».
- source_word: אָרְצָה
  choice: à terre
  rationale: La forme directionnelle signifie « vers la terre » et appartient à l’image idiomatique d’une parole qui « tombe à terre », autrement dit qui échoue ou reste sans effet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel sans lui substituer un titre.
- issue: Portée de l’expression « ne laissait aucune de ses paroles tomber à terre »
  choice: Conserver l’image hébraïque dans le texte et en expliquer le sens en note.
  alternative: ne laissait aucune de ses paroles rester sans effet / accomplissait toutes ses paroles
  rationale: Le contexte atteste la fiabilité prophétique de Samuel, mais le texte emploie une image plus large. La conserver évite de réduire explicitement ses « paroles » à des prédictions tout en maintenant la force littéraire de l’hébreu.
translation_notes:
  register: Français moderne, clair et digne. L’imparfait donne aux trois propositions une continuité narrative naturelle. L’idiome hébraïque est conservé dans le texte, avec une note explicative pour éviter toute obscurité.
