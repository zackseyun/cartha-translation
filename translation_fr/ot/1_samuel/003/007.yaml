  text: וּ/שְׁמוּאֵ֕ל טֶ֖רֶם יָדַ֣ע אֶת יְהוָ֑ה וְ/טֶ֛רֶם יִגָּלֶ֥ה אֵלָ֖י/ו דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: fr
  text: Samuel ne connaissait pas encore Yahweh[a], et la parole de Yahweh ne lui avait pas encore été révélée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Samuel n’avait pas encore reconnu Yahweh ». En hébreu, le verbe traduit par « connaître » peut désigner une connaissance relationnelle ou fondée sur l’expérience, notamment dans le cadre d’une révélation divine. Yahweh est la transcription du nom divin יהוה, traditionnellement rendu par « le SEIGNEUR ».
    reason: lexical_alternative_and_divine_name
lexical_decisions:
- source_word: וּשְׁמוּאֵל
  choice: Samuel
  rationale: Le waw introduit ici une explication au sein du récit. En français, aucun connecteur explicite n’est nécessaire.
- source_word: טֶרֶם
  choice: ne… pas encore
  rationale: Cette tournure exprime naturellement en français un état qui ne s’était pas encore réalisé à ce moment du récit.
- source_word: יָדַע אֶת־יְהוָה
  choice: connaissait Yahweh
  rationale: « Connaître » préserve l’étendue sémantique de יָדַע, qui peut désigner une connaissance relationnelle ou issue de l’expérience; le parallélisme avec la révélation de la parole éclaire le sens sans le réduire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְטֶרֶם יִגָּלֶה
  choice: ne lui avait pas encore été révélée
  rationale: Le nifal de גלה est rendu au passif; le plus-que-parfait convient à cette explication d’arrière-plan dans le récit.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom complément placé avec « révélée » rend idiomatiquement la relation « à lui » en français.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formulation conserve l’expression prophétique biblique et sa portée, sans la réduire au sens plus interprétatif de « message ».
theological_decisions:
- issue: Sens de « Samuel ne connaissait pas encore Yahweh »
  choice: Conserver la formulation ouverte « ne connaissait pas encore », éclairée par la proposition parallèle sur la révélation de la parole.
  alternative: Traduire explicitement « Samuel n’avait pas encore reconnu Yahweh » ou affirmer qu’il ne l’avait pas encore rencontré personnellement dans une révélation prophétique.
  rationale: Le contexte oriente vers l’absence d’une expérience directe de révélation, mais le texte hébreu emploie le verbe général « connaître ». La traduction préserve donc l’ambiguïté et évite d’en tirer une affirmation sur l’ignorance totale de Samuel ou sur son état spirituel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; le terme biblique « parole » est maintenu. Le marqueur de note suit immédiatement la première occurrence du nom divin et couvre à la fois la nuance de « connaître » et l’explication de « Yahweh ».
