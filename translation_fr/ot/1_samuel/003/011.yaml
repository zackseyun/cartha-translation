  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל הִנֵּ֧ה אָנֹכִ֛י עֹשֶׂ֥ה דָבָ֖ר בְּ/יִשְׂרָאֵ֑ל אֲשֶׁר֙ כָּל שֹׁ֣מְע֔/וֹ תְּצִלֶּ֖ינָה שְׁתֵּ֥י אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: fr
  text: 'Alors le SEIGNEUR dit à Samuel : « Voici, je vais faire en Israël une chose qui fera bourdonner les deux oreilles de quiconque l’entendra. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, en petites capitales.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la particule qui attire solennellement l’attention sur l’annonce divine.
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: je vais accomplir … une chose
  rationale: Le participe hébreu présente une action imminente; « accomplir » convient au registre d’une action divine sans préciser indûment sa nature.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: fera tinter les deux oreilles
  rationale: Préserve l’image hébraïque frappante et son effet physique, plutôt que de la réduire à une simple réaction émotionnelle.
- source_word: כָּל־שֹׁמְעוֹ
  choice: quiconque en entendra parler
  rationale: Exprime naturellement que l’on entend parler de l’événement annoncé; le pronom « en » reprend « une chose ».
theological_decisions:
- issue: Degré de précision sur l’action divine annoncée
  choice: une chose
  alternative: quelque chose
  rationale: « Une chose » reflète דָבָר et conserve le caractère solennel mais encore indéterminé de l’annonce.
- issue: Effet produit sur ceux qui entendront
  choice: fera tinter les deux oreilles
  alternative: fera bourdonner les deux oreilles
  rationale: Le texte emploie une image auditive idiomatique marquant le choc; la traduction retenue la conserve sans expliciter davantage la nature de la réaction.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe conserve la solennité de l’annonce et l’image concrète de l’hébreu, sans ajouter d’explication doctrinale.
