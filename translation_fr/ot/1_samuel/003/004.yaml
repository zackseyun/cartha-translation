  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: fr
  text: 'Alors Yahweh appela Samuel[a], et Samuel dit : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, translittéré ici « Yahweh » ; « Jéhovah » est une forme traditionnelle.'
    reason: Préciser la forme hébraïque du nom divin et signaler une translittération traditionnelle alternative sans présenter le rendu retenu comme une alternative.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le qal wayyiqtol de קרא poursuit le récit et désigne ici un appel audible; « appela » est naturel et précis en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin rend directement le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֶל שְׁמוּאֵל
  choice: Samuel
  rationale: Avec le verbe « appeler », le français exprime naturellement le destinataire comme complément direct; le nom propre suit la forme française usuelle.
- source_word: וַיֹּאמֶר
  choice: qui répondit
  rationale: Le sujet implicite est Samuel. Dans ce contexte d’appel, « répondit » rend naturellement la fonction de ויאמר, sans modifier le contenu de sa parole.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Formule française consacrée et encore compréhensible, exprimant à la fois la présence et la disponibilité du locuteur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel tout en suivant la reconstruction moderne la plus courante.
translation_notes:
  register: Français moderne, simple et digne. « Alors » marque la progression narrative; « Me voici » conserve le registre biblique sans être obscur.
