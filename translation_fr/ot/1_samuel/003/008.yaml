  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: fr
  text: 'Yahweh appela Samuel une troisième fois. Samuel se leva, alla trouver Éli et dit : « Me voici, car tu m’as appelé. » Alors Éli comprit que Yahweh appelait le garçon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: appela ... de nouveau
  rationale: La construction יָסַף suivie de l’infinitif exprime ici la répétition. « Appela de nouveau » rend naturellement l’idiome hébreu sans calque maladroit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu et à la ligne éditoriale fournie.
- source_word: בַּשְּׁלִשִׁית
  choice: pour la troisième fois
  rationale: Cette expression adverbiale indique clairement qu’il s’agit du troisième appel; cette formulation est idiomatique en français.
- source_word: וַיָּקָם
  choice: Samuel se leva
  rationale: « Se leva » est une formulation narrative naturelle et actuelle. Le nom est répété afin d’éviter une succession ambiguë de pronoms en français.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: alla trouver Éli
  rationale: Cette tournure française exprime naturellement le déplacement vers Éli dans ce contexte de réponse à un appel.
- source_word: הִנְנִי
  choice: Me voici
  rationale: Formule française consacrée et naturelle dans un contexte d’appel et de réponse, exprimant la présence et la disponibilité.
- source_word: כִּי קָרָאתָ לִי
  choice: puisque tu m’as appelé
  rationale: כִּי introduit ici la raison pour laquelle Samuel est venu. « Puisque » convient à une raison tenue pour acquise par le locuteur.
- source_word: וַיָּבֶן
  choice: comprit
  rationale: Le verbe indique qu’Éli parvient à comprendre l’origine de l’appel; « comprit » reste simple et peu interprétatif.
- source_word: קֹרֵא
  choice: appelait
  rationale: Le participe hébreu présente l’action en cours ou caractérise ce qui se passait; l’imparfait français rend bien cet aspect dans le récit.
- source_word: לַנָּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un garçon ou un jeune homme. Dans cette scène où Samuel est encore sous la garde d’Éli, « le garçon » convient au contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve explicitement sans lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un lectorat général; aucun archaïsme n’est nécessaire. La répétition du nom « Samuel » clarifie le référent sans modifier le sens.
