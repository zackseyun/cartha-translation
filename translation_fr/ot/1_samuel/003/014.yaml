source:
  edition: WLC
  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: fr
  text: 'C’est pourquoi j’ai juré au sujet de la maison d’Éli : jamais la faute de la maison d’Éli ne sera expiée par un sacrifice ou par une offrande[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la faute de la maison d’Éli ne sera certainement jamais expiée ». Après « j’ai juré », l’hébreu emploie une formule de serment avec « si » pour exprimer une forte négation.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « offrande » désigne souvent plus précisément une offrande végétale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du jugement annoncé précédemment, tout en conservant la force logique de l’hébreu.
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré
  rationale: Le parfait désigne un serment accompli dont la force demeure; le passé composé convient au français moderne et garde la solennité de la déclaration.
- source_word: לְבֵית עֵלִי
  choice: au sujet de la maison d’Éli
  rationale: La préposition ל désigne ici la cible ou l’objet du serment. « Au sujet de » évite de suggérer que le serment est adressé directement à la famille, tout en laissant son caractère défavorable ressortir de la suite.
- source_word: אִם
  choice: jamais… ne
  rationale: Après un verbe de serment, אִם appartient à une formule elliptique exprimant une négation solennelle. Le français idiomatique « jamais… ne » en restitue la force.
- source_word: יִתְכַּפֵּר
  choice: sera expiée
  rationale: La forme exprime ici l’expiation ou l’effacement de la faute. « Sera expiée » conserve le sens cultuel et théologique sans ajouter d’explication doctrinale.
- source_word: עֲוֺן
  choice: faute
  rationale: עָוֹן peut désigner la faute ainsi que la culpabilité qui en découle. « Faute » est actuel, grave sans être archaïque, et maintient une part de cette amplitude sémantique.
- source_word: בֵּית עֵלִי
  choice: la maison d’Éli
  rationale: « Maison » garde le sens dynastique et familial de בַּיִת dans ce contexte.
- source_word: בְּזֶבַח
  choice: par un sacrifice
  rationale: La préposition בְּ marque le moyen; « par » indique que le sacrifice ne peut ici produire l’expiation.
- source_word: וּבְמִנְחָה
  choice: ou par une offrande
  rationale: Dans ce couple cultuel, מִנְחָה désigne une offrande et peut plus précisément renvoyer à l’offrande végétale. Le terme général est naturel dans le texte, et la précision est donnée en note.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: Avec la formule négative du serment, l’expression indique le caractère définitif de la non-expiation. « Jamais » rend cette portée de façon concise et naturelle.
theological_decisions:
- issue: Portée du jugement prononcé contre la maison d’Éli
  choice: Le texte affirme qu’aucun sacrifice ni aucune offrande ne pourra expier cette faute.
  alternative: On pourrait comprendre que seuls les moyens cultuels mentionnés sont exclus, sans que le verset se prononce sur toute possibilité de miséricorde divine.
  rationale: La traduction conserve l’affirmation explicite sur l’inefficacité des moyens sacrificiels dans ce cas, sans l’élargir en une déclaration doctrinale sur ce que Dieu pourrait ou non faire en dehors de ces moyens.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la solennité du serment, le sens familial de « maison » et la tension théologique du texte. Les deux appels de note [a] et [b] figurent dans le texte principal.
