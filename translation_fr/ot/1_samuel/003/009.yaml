source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: fr
  text: 'Alors Éli dit à Samuel : « Va te coucher. S’il t’appelle, tu diras : “Parle, Yahweh[a], car ton serviteur écoute.” » Samuel alla donc se coucher à sa place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu יהוה (YHWH) est traditionnellement rendu en français par « le SEIGNEUR » ou « l’Éternel ».
    reason: Signaler le rendu traditionnel du nom divin tout en conservant le nom propre dans le texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Éli dit
  rationale: Le wayyiqtol fait avancer le récit ; « Alors » exprime naturellement la succession narrative.
- source_word: לֵךְ שְׁכָב
  choice: Va te coucher
  rationale: Les deux impératifs sont rendus par une formulation française directe et naturelle, sans ajouter explicitement l’idée de dormir.
- source_word: וְהָיָה אִם
  choice: S’il
  rationale: La construction introduit une condition réelle ; « si » préserve cette valeur sans la transformer en certitude temporelle par « quand ».
- source_word: יִקְרָא אֵלֶיךָ
  choice: il t’appelle
  rationale: Le sujet masculin singulier reste implicite en hébreu. Le contexte permet le pronom « il » sans expliciter davantage l’identité de celui qui appelle.
- source_word: וְאָמַרְתָּ
  choice: tu diras
  rationale: Après la proposition conditionnelle, cette forme exprime la conduite prescrite à Samuel.
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif simple conserve la brièveté et la force de l’adresse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH, ici employé en adresse directe ; sa translittération préserve le nom propre plutôt que de lui substituer un titre.
- source_word: כִּי שֹׁמֵעַ עַבְדֶּךָ
  choice: car ton serviteur écoute
  rationale: Le participe שֹׁמֵעַ exprime ici l’attention disponible et active ; « écoute » est plus juste dans le contexte que le simple constat « entend ».
- source_word: וַיֵּלֶךְ שְׁמוּאֵל וַיִּשְׁכַּב
  choice: Samuel alla donc se coucher
  rationale: Les verbes narratifs successifs indiquent que Samuel exécute l’instruction ; « donc » rend naturellement cette conséquence.
- source_word: בִּמְקוֹמוֹ
  choice: à sa place
  rationale: Cette traduction reste proche de l’hébreu sans préciser qu’il s’agirait de son lit ou de sa place habituelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le terme hébreu est le nom propre divin et non un titre. « Yahweh » le représente directement, tandis que la note signale l’usage traditionnel français.
- issue: Sujet implicite de יִקְרָא
  choice: il t’appelle
  alternative: quelqu’un t’appelle
  rationale: L’hébreu ne nomme pas le sujet dans cette proposition, mais le contexte immédiat montre qu’Éli a compris que l’appel venait de Yahweh. Le pronom conserve à la fois l’implicite grammatical et l’inférence narrative.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct ; « Va te coucher » et « ton serviteur écoute » sont naturels sans effacer la solennité de la scène.
