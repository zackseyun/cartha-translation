  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: fr
  text: 'Alors le SEIGNEUR appela encore Samuel. Samuel se leva, alla trouver Éli et dit : « Me voici, puisque tu m’as appelé. » Mais Éli répondit : « Je ne t’ai pas appelé, mon fils. Retourne te coucher. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, tout en le distinguant d’un simple titre.
- source_word: קְרֹא עוֹד
  choice: appela encore
  rationale: Reproduit naturellement en français l’idée d’un nouvel appel.
- source_word: הִנְנִי
  choice: Me voici
  rationale: Formule française consacrée qui conserve la disponibilité exprimée par l’hébreu.
- source_word: כִּי קָרָאתָ לִי
  choice: puisque tu m’as appelé
  rationale: Dans ce contexte, כִּי donne la raison pour laquelle Samuel se présente auprès d’Éli.
- source_word: שׁוּב שְׁכָב
  choice: Retourne te coucher
  rationale: Expression idiomatique moderne qui communique le mouvement de retour et l’ordre de se recoucher.
theological_decisions:
- issue: Identification explicite de celui qui appelle
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Le texte hébreu nomme explicitement le Dieu d’Israël par le tétragramme; la traduction retient la convention française en petites capitales sans ajouter d’interprétation.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue demeure direct et naturel; « mon fils » conserve la tendresse de l’adresse d’Éli.
