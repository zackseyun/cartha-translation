- source_word: אֵת אֲשֶׁר עָשׂוּ פְלִשְׁתִּים לְשָׁאוּל
  choice: ce que les Philistins avaient fait à Saül
  rationale: Rend directement la relative hébraïque et respecte l’antériorité de l’action par le plus-que-parfait.
