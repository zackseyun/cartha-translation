  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: fr
  text: Quand les hommes d’Israël qui étaient de l’autre côté de la vallée[a], ainsi que ceux qui étaient de l’autre côté du Jourdain, virent que les hommes d’Israël avaient fui et que Saül et ses fils étaient morts, ils abandonnèrent les villes et s’enfuirent ; les Philistins vinrent et s’y installèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà de la vallée ». L’expression hébraïque désigne le côté opposé ou la région située au-delà.
    reason: lexical_alternative
  - marker: b
    text: Ou « y habitèrent ». Le verbe hébreu peut exprimer le fait d’habiter un lieu ou de s’y installer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: virent
  rationale: Le verbe ראה signifie d’abord « voir ». Dans ce contexte, il exprime un constat fondé sur les événements observables, sans qu’il soit nécessaire de l’expliciter par « apprirent » ou « comprirent ».
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Cette traduction conserve la formulation genrée de l’hébreu et convient au contexte militaire et territorial.
- source_word: בְּעֵבֶר הָעֵמֶק
  choice: de l’autre côté de la vallée
  rationale: עֵבֶר désigne le côté opposé ou la région située au-delà d’un repère. La formulation française reste naturelle tout en préservant l’indétermination du point de vue géographique.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: La même expression spatiale est rendue de la même manière afin de conserver la répétition de l’hébreu.
- source_word: כִּי נָסוּ
  choice: que les hommes d’Israël avaient fui
  rationale: Le plus-que-parfait français situe naturellement la fuite avant le constat fait par les habitants des régions mentionnées.
- source_word: מֵתוּ
  choice: étaient morts
  rationale: מות affirme la mort sans préciser ici sa cause. « Étaient morts » préserve cette valeur résultative et n’ajoute pas « avaient été tués ».
- source_word: וּבָנָיו
  choice: et ses fils
  rationale: La coordination simple reproduit fidèlement l’association de Saül et de ses fils dans l’annonce de leur mort.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: ils abandonnèrent les villes
  rationale: עזב exprime le fait de laisser derrière soi ou d’abandonner. « Abandonnèrent » rend bien la fuite forcée et la perte de ces localités.
- source_word: וַיָּנֻסוּ
  choice: et s’enfuirent
  rationale: נוס est le verbe courant pour la fuite. « S’enfuirent » est naturel et soutenu en français narratif.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Les Philistins vinrent alors
  rationale: בוא signifie largement « venir » ou « entrer ». « Vinrent » reste proche du texte, tandis que « alors » rend l’enchaînement narratif du waw sans ajouter de contenu causal fort.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: s’y installer
  rationale: ישב peut signifier habiter, demeurer ou s’installer. Dans le contexte de villes abandonnées puis occupées, « s’y installer » exprime naturellement la prise de possession sans imposer l’idée d’une permanence définitive.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit, tandis que le plus-que-parfait clarifie l’antériorité de la fuite et de la mort. Les répétitions significatives de l’hébreu sont conservées sans alourdir inutilement la phrase.
