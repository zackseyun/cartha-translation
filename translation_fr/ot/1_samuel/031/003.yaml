base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: fr
  text: La bataille s’intensifia contre Saül. Les archers le trouvèrent[a], et il fut grièvement blessé par eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’atteignirent » ou « le rejoignirent ». Le verbe hébreu signifie littéralement « trouvèrent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il éprouva une très grande angoisse à cause des archers ». Le verbe hébreu est difficile et peut évoquer une douleur intense, un tremblement ou une profonde détresse plutôt qu’une blessure physique explicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: Le combat devint acharné contre Saül
  rationale: Le verbe כבד évoque littéralement ce qui devient lourd et, dans ce contexte militaire, l’intensification du combat ou la forte pression exercée sur Saül. « Devint acharné contre » restitue naturellement cette idée en français.
- source_word: וַיִּמְצָאֻהוּ
  choice: le trouvèrent
  rationale: Le verbe מצא signifie d’abord « trouver ». La formulation française conserve cette image, tout en laissant la note signaler le sens contextuel possible d’atteindre ou de rejoindre quelqu’un au combat.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: les archers
  rationale: L’expression hébraïque désigne littéralement « les tireurs, des hommes à l’arc ». « Les archers » en exprime tout le sens sans reproduire une apposition redondante en français.
- source_word: וַיָּחֶל מְאֹד
  choice: il fut grièvement blessé
  rationale: Le verbe difficile peut évoquer une blessure grave, mais aussi une douleur, un tremblement ou une détresse intense. Le contexte immédiat des archers favorise ici la blessure physique; l’ambiguïté est explicitement conservée en note.
- source_word: מֵהַמּוֹרִים
  choice: par eux
  rationale: La préposition מן indique ici la source ou la cause de l’état de Saül. Le pronom évite la répétition peu naturelle d’« archers » tout en gardant clairement l’agent.
theological_decisions:
- issue: Nature exacte de l’état de Saül exprimé par וַיָּחֶל
  choice: Blessure physique grave dans le texte principal
  alternative: Angoisse, détresse, tremblement ou douleur intense causés par les archers
  rationale: Le contexte narratif favorise la blessure, mais la forme hébraïque demeure lexicalement difficile. La note évite de présenter cette interprétation comme certaine et préserve la tension du texte source.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste concise; le terme courant « archers » remplace l’apposition hébraïque littérale, redondante en français. L’ambiguïté principale du dernier verbe est conservée par une note.
