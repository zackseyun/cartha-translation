  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: fr
  text: Ils déposèrent les armes de Saül dans le temple d’Ashtaroth[a] et fixèrent son corps à la muraille de Beth-Shân[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la maison d’Ashtaroth ». Il s’agit ici d’un temple ou d’un sanctuaire. Le nom hébreu est de forme plurielle ; selon le contexte, il peut être compris comme renvoyant à Astarté ou à des formes, manifestations ou représentations cultuelles qui lui sont associées.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « plantèrent son corps dans la muraille de Beth-Shân ». Le verbe hébreu peut signifier « enfoncer », « planter » ou « fixer » ; la manière exacte dont le corps fut exposé n’est pas précisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Ils déposèrent
  rationale: שׂוּם signifie « mettre, placer ». « Déposèrent » convient naturellement au placement des armes dans un sanctuaire et conserve le ton narratif.
- source_word: כֵּלָיו
  choice: les armes de Saül
  rationale: כְּלִי peut désigner des objets, du matériel ou des armes. Dans ce contexte militaire, « armes » est naturel. Le nom « de Saül » lève en français une possible ambiguïté du possessif sans ajouter de référent étranger au contexte immédiat.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: le temple des Astartés
  rationale: בֵּית signifie littéralement « maison », mais désigne ici un sanctuaire. עַשְׁתָּרוֹת est morphologiquement pluriel; « des Astartés » préserve cette forme sans imposer qu’il s’agisse nécessairement de plusieurs déesses distinctes.
- source_word: גְּוִיָּתוֹ
  choice: son corps
  rationale: Le nom désigne le corps, ici celui d’un mort. Le contexte rend le décès explicite, de sorte que « corps » suffit sans la dureté supplémentaire de « cadavre ».
- source_word: תָּקְעוּ
  choice: fixèrent
  rationale: תקע peut signifier enfoncer, planter ou fixer. « Fixèrent » exprime l’attachement du corps à la muraille sans préciser abusivement la manière exacte.
- source_word: בְּחוֹמַת
  choice: à la muraille de
  rationale: Avec תקע et la préposition ב, « à la muraille » rend naturellement en français l’idée d’une fixation au rempart urbain.
- source_word: בֵּית שָׁן
  choice: Beth-Shân
  rationale: Translittération française claire du nom de lieu, avec accent circonflexe pour signaler la voyelle longue de שָׁן.
theological_decisions:
- issue: Valeur du pluriel עַשְׁתָּרוֹת
  choice: Astartés
  alternative: Astarté
  rationale: Le pluriel hébreu est conservé dans le texte afin de ne pas réduire silencieusement une forme qui peut désigner des manifestations, images ou formes cultuelles d’Astarté.
- issue: Mode d’exposition du corps
  choice: fixèrent son corps
  alternative: empalèrent son corps
  rationale: Le verbe autorise une action consistant à planter ou enfoncer, mais le passage ne précise pas assez le procédé pour imposer l’idée technique d’un empalement.
translation_notes:
  register: Français international moderne, narratif et digne. « Temple » explicite la fonction cultuelle de « maison »; « muraille » convient mieux que « mur » au rempart d’une ville. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
