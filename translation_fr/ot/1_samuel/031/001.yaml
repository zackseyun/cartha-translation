  text: וּ/פְלִשְׁתִּ֖ים נִלְחָמִ֣ים בְּ/יִשְׂרָאֵ֑ל וַ/יָּנֻ֜סוּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר הַ/גִּלְבֹּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: fr
  text: Les Philistins combattaient Israël, et les hommes d’Israël s’enfuirent devant les Philistins et tombèrent morts sur le mont Guilboa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Les Philistins
  rationale: Le nom traditionnel « Philistins » identifie clairement ce peuple. En tête de cette unité narrative, le ו relie le récit à son contexte, mais n’exige pas nécessairement un « et » initial en français.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: combattaient Israël
  rationale: Le participe présente une action en cours et appelle l’imparfait. Avec le verbe לחם, la préposition ב marque ici l’adversaire; en français, « combattre » peut prendre directement son complément.
- source_word: וַ/יָּנֻסוּ
  choice: s’enfuirent
  rationale: Dans ce contexte militaire, « s’enfuirent » rend naturellement la fuite devant l’ennemi tout en conservant le premier plan narratif du wayyiqtol.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Cette traduction conserve la référence masculine explicite de אַנְשֵׁי, sans ajouter au texte le terme « armée ».
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: devant les Philistins
  rationale: L’expression idiomatique signifie qu’ils prirent la fuite face aux Philistins. « Devant » conserve l’image spatiale de l’hébreu tout en restant naturel en français.
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: tombèrent, tués
  rationale: La collocation décrit des hommes qui tombent comme victimes mortelles au combat. La formulation conserve à la fois le verbe « tomber » et le caractère fatal exprimé par חֲלָלִים.
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: sur le mont Guilboa
  rationale: « Le mont Guilboa » est la désignation française traditionnelle et « sur » convient naturellement à la localisation sur une montagne.
