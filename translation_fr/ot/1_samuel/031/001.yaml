translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait établit l’action militaire en cours, tandis que les passés simples portent les événements successifs. Aucun marqueur de note n’est requis, puisque les choix retenus n’appellent pas ici d’alternative essentielle.
