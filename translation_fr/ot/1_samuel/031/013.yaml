base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: fr
  text: Ils prirent leurs ossements et les enterrèrent sous le tamaris à Jabès[a]. Puis ils jeûnèrent pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jabès abrège Jabès-Galaad, mentionnée au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: leurs ossements
  rationale: עֶצֶם désigne concrètement les os. Après l’incinération des corps au verset 12, « ossements » conserve ce sens précis sans le généraliser en « restes ».
- source_word: וַיִּקְבְּרוּ
  choice: les enterrèrent
  rationale: קבר est le verbe courant signifiant « enterrer »; ce choix convient au style narratif simple du passage.
- source_word: תַחַת
  choice: sous
  rationale: תַחַת exprime ici la position sous ou au pied de l’arbre; « sous » est direct et naturel.
- source_word: הָאֶשֶׁל
  choice: le tamaris
  rationale: אֶשֶׁל nomme spécifiquement le tamaris. En français, le nom désigne déjà clairement l’arbre, sans qu’il soit nécessaire d’ajouter « arbre ».
- source_word: בְּיָבֵשָׁה
  choice: à Yabesh
  rationale: La préposition בְּ marque ici le lieu. « À » est l’usage français naturel devant un nom de ville; le contexte identifie Yabesh à Yabesh-Galaad.
- source_word: וַיָּצֻמוּ
  choice: Puis ils jeûnèrent
  rationale: צום signifie « jeûner ». « Puis » rend naturellement la progression narrative du waw consécutif sans alourdir la phrase.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: L’ajout idiomatique de « pendant » exprime clairement en français la durée indiquée par l’hébreu.
- source_word: וַיִּקְחוּ
  choice: Ils prirent
  rationale: לקח signifie « prendre »; le passé simple rend de façon digne et concise la succession narrative.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit. « Yabesh » suit une translittération proche de l’hébreu; la précision contextuelle « Yabesh-Galaad » est placée en note. Le nom spécifique « tamaris » est conservé dans le texte.
