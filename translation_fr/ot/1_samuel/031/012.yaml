  text: וַ/יָּק֜וּמוּ כָּל אִ֣ישׁ חַיִל֮ וַ/יֵּלְכ֣וּ כָל הַ/לַּיְלָה֒ וַ/יִּקְח֞וּ אֶת גְּוִיַּ֣ת שָׁא֗וּל וְ/אֵת֙ גְּוִיֹּ֣ת בָּנָ֔י/ו מֵ/חוֹמַ֖ת בֵּ֣ית שָׁ֑ן וַ/יָּבֹ֣אוּ יָבֵ֔שָׁ/ה וַ/יִּשְׂרְפ֥וּ אֹתָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: fr
  text: Alors tous les hommes vaillants se levèrent, firent route toute la nuit, retirèrent de la muraille de Beth-Shân le corps de Saül et les corps de ses fils[a], puis arrivèrent à Yabesh[b] et les y brûlèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne précisément un corps mort, un cadavre.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, Yabesh désigne Yabesh-Galaad.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: tous les hommes vaillants
  rationale: L’expression désigne collectivement des hommes courageux et aptes au combat. Cette formulation naturelle conserve la référence masculine et la valeur militaire du contexte.
- source_word: וַיָּק֜וּמוּ
  choice: se levèrent
  rationale: Le verbe signifie littéralement « se lever ». Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: marchèrent toute la nuit
  rationale: Dans ce contexte de déplacement prolongé, « marchèrent » rend naturellement le verbe sans ajouter de moyen de transport.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: le corps ... ceux
  rationale: Le terme hébreu désigne spécifiquement des corps morts. « Corps » est digne et courant; le pronom « ceux » évite une répétition lourde en français.
- source_word: מֵחוֹמַת
  choice: de la muraille
  rationale: La préposition et le nom indiquent que les corps sont retirés de la muraille de la ville. « Muraille » convient mieux qu’un simple « mur » à cet ouvrage défensif.
- source_word: בֵּית שָׁן
  choice: Beth-Shân
  rationale: Translittération française reconnaissable du nom de lieu, avec l’accent circonflexe signalant la voyelle longue sans surcharger la forme.
- source_word: יָבֵשָׁה
  choice: à Yabesh
  rationale: La terminaison directionnelle indique un mouvement vers Yabesh. Le texte hébreu ne donne pas ici le nom complet Yabesh-Galaad.
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: les y brûlèrent
  rationale: Cette tournure française concise conserve le verbe général « brûler », le pronom objet et l’indication de lieu, sans préciser davantage la nature du rite.
theological_decisions:
- issue: Rendu de l’expression collective masculine désignant les sauveteurs
  choice: tous les hommes vaillants
  alternative: tous les vaillants guerriers
  rationale: Les formes hébraïques sont masculines et le contexte est celui d’hommes aptes au combat. Une formulation neutre effacerait cette précision; « hommes vaillants » évite toutefois d’ajouter explicitement « guerriers ».
- issue: Nature de l’action de brûler les corps
  choice: les y brûlèrent
  alternative: les y incinérèrent
  rationale: Le verbe hébreu signifie simplement « brûler ». « Incinérer » pourrait présenter l’acte comme une crémation formelle et résoudre une question que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient le ton du récit écrit sans archaïsmes. Les noms propres suivent une translittération française cohérente. Les deux notes sont toutes appelées dans le texte principal.
