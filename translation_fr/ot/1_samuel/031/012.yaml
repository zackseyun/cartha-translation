revisions:
- from: Alors tous les hommes vaillants se levèrent, marchèrent toute la nuit, retirèrent de la muraille de Beth-Shân le corps de Saül et ceux de ses fils[a], puis vinrent à Yabesh[b] et les y brûlèrent.
  to: Alors tous les hommes vaillants se levèrent, firent route toute la nuit, retirèrent de la muraille de Beth-Shân le corps de Saül et les corps de ses fils[a], puis arrivèrent à Yabesh[b] et les y brûlèrent.
  rationale: La révision évite de surinterpréter le verbe hébreu de déplacement comme une marche à pied et explicite le pluriel « les corps » conformément au texte source. Elle conserve le registre narratif moderne, les noms propres retenus, les deux ancres de notes et l’ambiguïté du verbe « brûler ».
