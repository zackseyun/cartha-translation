base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: fr
  text: Le lendemain, les Philistins vinrent dépouiller les morts[a] et trouvèrent Saül et ses trois fils tombés sur le mont Guilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dépouiller les tués » ou « dépouiller les morts du combat ». Le verbe hébreu désigne ici le fait d'enlever aux morts leurs vêtements ou leur équipement militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Le lendemain
  rationale: Cette expression temporelle désigne le jour qui suit les événements racontés; « Le lendemain » est naturel et précis en français.
- source_word: לְפַשֵּׁט
  choice: dépouiller
  rationale: Dans ce contexte militaire, le verbe désigne l’action d’enlever aux morts leurs vêtements, leurs armes ou leur armure. « Dépouiller » exprime directement cette idée.
- source_word: הַחֲלָלִים
  choice: ceux qui avaient été tués
  rationale: Le terme désigne les personnes tuées au combat. Cette formulation moderne conserve le contexte martial sans employer le substantif plus littéraire « les tués ».
- source_word: וַיִּמְצְאוּ
  choice: Ils trouvèrent
  rationale: Rend simplement la succession narrative du verbe hébreu.
- source_word: נֹפְלִים
  choice: tombés
  rationale: Conserve l’image hébraïque de combattants tombés, plutôt que de l’aplatir en traduisant seulement « morts ».
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: sur le mont Guilboa
  rationale: Forme française idiomatique et traditionnelle du nom géographique.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: ses trois fils
  rationale: Rendu direct et naturel du groupe nominal hébreu.
