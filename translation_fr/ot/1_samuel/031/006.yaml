  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: fr
  text: Ainsi, Saül mourut, ainsi que ses trois fils, son porteur d’armes et tous ses hommes[a][b], ce jour-là, tous ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses soldats ». L’hébreu dit littéralement « tous ses hommes » ; dans ce contexte de bataille, il s’agit probablement de ses combattants ou de sa garde, et non de toute personne liée à Saül.
    reason: lexical_alternative
  - marker: b
    text: Certains témoins grecs portent « toutes ses armes » au lieu de « tous ses hommes ». Le texte hébreu porte « tous ses hommes ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: Ainsi, Saül mourut
  rationale: Le waw consécutif fait progresser le récit et présente ici l’aboutissement des événements précédents ; « Ainsi » exprime naturellement cette continuité résultative.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: ainsi que ses trois fils
  rationale: Rend directement le groupe nominal hébreu tout en évitant en français une succession lourde de « et ».
- source_word: וְנֹשֵׂא כֵלָיו
  choice: celui qui portait ses armes
  rationale: L’expression hébraïque désigne littéralement le porteur de son équipement ou de ses armes. Cette formulation claire évite le terme plus spécialisé « écuyer ».
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: et tous ses hommes
  rationale: גַּם ajoute le dernier groupe à l’énumération ; la coordination française en restitue ici naturellement la force. « Ses hommes » préserve la formulation hébraïque sans préciser excessivement leur statut militaire.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Équivalent temporel français direct et idiomatique.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: Conserve l’idée que tous connurent le même sort ce même jour.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La répétition finale de « moururent » clarifie sans ambiguïté que tous les membres de l’énumération sont sujets du même verbe, tandis que « celui qui portait ses armes » reste transparent pour un lectorat général.
