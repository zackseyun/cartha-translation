  to: 'Saül dit à son porteur d’armes : « Tire ton épée et transperce-moi avec elle, de peur que ces incirconcis ne viennent me transpercer et me maltraiter[a]. » Mais son porteur d’armes ne voulut pas le faire, car il avait très peur. Alors Saül prit l’épée et tomba sur elle.'
  rationale: 'La révision ne modifie pas le sens : elle complète l’instrument exprimé par l’hébreu (« avec elle ») et emploie « tomba sur elle », formulation française claire qui conserve la référence à l’épée. La note et son ancre sont maintenues.'
