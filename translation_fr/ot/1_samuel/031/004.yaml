base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: fr
  text: 'Saül dit à son porteur d’armes : « Tire ton épée et transperce-moi avec elle, de peur que ces incirconcis ne viennent me transpercer et me maltraiter[a]. » Mais son porteur d’armes ne voulut pas le faire, car il avait très peur. Alors Saül prit l’épée et tomba sur elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se jouer de moi », « m’humilier » ou « me traiter outrageusement ».
    reason: Le verbe hébreu peut désigner diverses formes de traitement abusif ou humiliant, sans en spécifier ici la nature exacte.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: son porteur d’armes
  rationale: L’expression désigne l’assistant militaire chargé de porter l’équipement d’un guerrier. « Porteur d’armes » est précis, transparent et naturel dans ce contexte ancien.
- source_word: שְׁלֹף
  choice: Tire
  rationale: Dans « Tire ton épée », le verbe exprime naturellement en français l’action de sortir l’épée de son fourreau.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: transperce-moi avec / me transpercer
  rationale: « Transpercer » rend la force létale de דקר. La répétition du même verbe français conserve celle de l’hébreu.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française exprime clairement l’issue redoutée introduite par פֶּן, dans un registre digne mais actuel.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: ces incirconcis
  rationale: La formulation conserve la désignation péjorative et liée à la circoncision du texte hébreu, sans la remplacer explicitement par « Philistins ».
- source_word: וְהִתְעַלְּלוּ בִי
  choice: et me maltraiter
  rationale: « Maltraiter » transmet l’idée d’un traitement abusif et humiliant sans en préciser indûment la forme.
- source_word: וְלֹא אָבָה
  choice: ne voulut pas le faire
  rationale: Cette expression rend clairement le refus ou l’absence de volonté; « le faire » explicite naturellement en français l’action demandée.
- source_word: כִּי יָרֵא מְאֹד
  choice: car il avait très peur
  rationale: La formulation conserve à la fois le lien causal et l’intensification exprimée par מְאֹד.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: et tomba dessus
  rationale: La traduction reste proche de « tomba sur elle » tout en évitant en français un pronom féminin potentiellement peu naturel; elle n’ajoute pas le geste plus interprétatif « se jeta ».
theological_decisions:
- issue: Nature exacte des sévices redoutés par Saül
  choice: me maltraiter
  alternative: se jouer de moi ; m’humilier ; me traiter outrageusement
  rationale: Le verbe évoque un traitement abusif et dégradant, mais ne précise pas s’il s’agit de torture, de dérision ou d’une autre forme d’humiliation. Le choix conserve cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde l’urgence de la scène; « ces incirconcis » préserve la dureté de la désignation hébraïque, tandis que la note maintient l’ambiguïté lexicale concernant les sévices redoutés.
