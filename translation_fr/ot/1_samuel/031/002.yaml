base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: fr
  text: Les Philistins rattrapèrent Saül et ses fils[a], puis ils abattirent Jonathan, Abinadab et Malki-Shoua[b], les fils de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rejoignirent Saül et ses fils » ou « serrèrent de près Saül et ses fils ». Le verbe hébreu évoque une poursuite rapprochée qui atteint sa cible.
    reason: lexical_alternative
  - marker: b
    text: Ou « tuèrent Jonathan, Abinadab et Malki-Shoua ». Le verbe hébreu signifie littéralement « frapper », mais, dans ce contexte de bataille, il implique vraisemblablement la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: rattrapèrent
  rationale: Dans ce contexte militaire, דבק décrit une poursuite serrée qui atteint sa cible. « Rattrapèrent » exprime naturellement en français le fait que les poursuivants rejoignent Saül et ses fils, sans réduire le verbe à une simple poursuite.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française courante de ce peuple; l’article défini convient à un groupe déjà identifié dans le récit.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: Saül et ses fils
  rationale: בָּנָיו désigne ici précisément ses fils, comme le confirme l’énumération des trois hommes dans la proposition suivante.
- source_word: וַיַּכּוּ
  choice: abattirent
  rationale: Le verbe נכה signifie largement « frapper », mais, dans ce récit de bataille et avec des victimes nommées, il indique vraisemblablement une action mortelle. « Abattirent » conserve l’image violente tout en laissant une légère part à l’implicite.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et courante du nom.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Transcription française courante du nom.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-Shoua
  rationale: Transcription qui représente clairement les éléments consonantiques et la prononciation du nom hébreu; le trait d’union en reflète la forme composée.
- source_word: בְּנֵי שָׁאוּל
  choice: les fils de Saül
  rationale: Cette apposition identifie les trois hommes nommés et préserve la structure ainsi que l’insistance du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Rattrapèrent » et « abattirent » rendent la scène militaire avec naturel sans expliciter davantage que l’hébreu. La répétition de « les Philistins » est allégée en « ils » pour une lecture française fluide, tandis que l’apposition finale est conservée.
