  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל חַרְבּ֖/וֹ וַ/יָּ֥מָת עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: fr
  text: Quand celui qui portait ses armes vit que Saül était mort[a], il se jeta lui aussi sur son épée et mourut avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était déjà mort ». L’hébreu peut décrire l’état de Saül ou présenter sa mort comme un fait accompli sur lequel se fonde l’action de celui qui portait ses armes.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: celui qui portait ses armes
  rationale: La construction désigne littéralement le porteur de l’équipement ou des armes de Saül. Cette formulation naturelle évite « porteur d’armes », qui peut aussi évoquer un héraut ou porte-drapeau en français moderne.
- source_word: כִּי
  choice: que
  rationale: 'La conjonction introduit ici le contenu de la perception : il vit que Saül était mort.'
- source_word: מֵת
  choice: était mort
  rationale: Cette forme peut décrire l’état constaté de Saül. « Était mort » rend directement ce sens statif, tandis que « était décédé » serait moins naturel dans ce récit.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: L’expression marque que le porteur d’armes accomplit à son tour le même geste fatal que Saül.
- source_word: עַל חַרְבּוֹ
  choice: sur son épée
  rationale: La tournure « se jeter sur son épée » rend naturellement en français l’action exprimée par le verbe tomber et la préposition עַל, sans en atténuer la violence.
- source_word: וַיָּמָת עִמּוֹ
  choice: et mourut avec lui
  rationale: « Avec lui » conserve l’idée d’une mort partagée ou concomitante sans ajouter une proximité spatiale qui n’est pas explicitement indiquée.
- source_word: וַיַּרְא
  choice: Quand … vit
  rationale: La subordination temporelle relie naturellement en français le constat à l’action qui en résulte tout en conservant la progression narrative.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Celui qui portait ses armes » est clair pour un lectorat général et reste proche de l’expression hébraïque.
