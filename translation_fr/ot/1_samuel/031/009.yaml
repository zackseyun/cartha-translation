source:
  edition: WLC
  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: fr
  text: Ils lui coupèrent la tête et le dépouillèrent de ses armes[a]. Puis ils envoyèrent des messagers dans tout le pays des Philistins pour annoncer la bonne nouvelle dans le temple de leurs idoles et au peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de son équipement ». Le terme peut désigner plus largement l’ensemble du matériel de combat de Saül, et non seulement ses armes.'
    reason: alternative rendering
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: Ils lui coupèrent la tête
  rationale: Avec « sa tête » comme complément, כרת signifie ici nettement trancher ou couper. La tournure française avec pronom indirect est naturelle et précise.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: le dépouillèrent de ses armes
  rationale: פשׁט décrit l’action de dépouiller quelqu’un de ce qu’il porte, et כֵּלִים désigne ici son matériel de combat. « Ses armes » convient au contexte, tout en laissant en note la possibilité plus large d’« équipement ».
- source_word: וַיְשַׁלְּחוּ
  choice: ils envoyèrent des messagers
  rationale: Le verbe signifie littéralement « ils envoyèrent ». L’objet sous-entendu est explicité par « des messagers », puisque leur mission est d’annoncer la victoire à travers le territoire philistin.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: dans tout le pays des Philistins
  rationale: סָבִיב exprime ici une diffusion de tous côtés dans le territoire. « Dans tout le pays » rend cette portée distributive sans lourdeur.
- source_word: לְבַשֵּׂר
  choice: pour porter la bonne nouvelle
  rationale: Le piel de בשׂר désigne l’annonce d’une nouvelle favorable, ici du point de vue des vainqueurs philistins. La formulation ne porte aucun jugement moral du narrateur.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: au temple de leurs idoles
  rationale: בֵּית, « maison », désigne dans ce contexte cultuel le sanctuaire ou temple où se trouvent les idoles. « Temple » est plus immédiatement intelligible en français moderne.
- source_word: וְאֶת־הָעָם
  choice: et au peuple
  rationale: Le marqueur d’objet אֵת rattache « le peuple » à l’annonce. En français, « porter la nouvelle au peuple » exprime naturellement le destinataire.
theological_decisions:
- issue: Désignation du sanctuaire et des objets cultuels philistins
  choice: le temple de leurs idoles
  alternative: la maison de leurs idoles
  rationale: « Temple » explicite la fonction cultuelle de בֵּית dans ce contexte, tandis qu’« idoles » rend עֲצַבִּים sans présenter ces objets comme des divinités réelles.
- issue: Valeur positive de la nouvelle annoncée
  choice: la bonne nouvelle
  alternative: la nouvelle
  rationale: בשׂר évoque une nouvelle réjouissante pour ceux qui l’annoncent. Cette joie appartient au point de vue philistin et ne signifie pas que le narrateur approuve la mort de Saül.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un large lectorat, tout en conservant la violence directe du récit et le point de vue triomphal des Philistins.
