- from: Ils lui coupèrent la tête et le dépouillèrent de ses armes[a]. Puis ils envoyèrent des messagers dans tout le pays des Philistins pour porter la bonne nouvelle au temple de leurs idoles et au peuple.
  to: Ils lui coupèrent la tête et le dépouillèrent de ses armes[a]. Puis ils envoyèrent des messagers dans tout le pays des Philistins pour annoncer la bonne nouvelle dans le temple de leurs idoles et au peuple.
  rationale: La révision ne modifie pas le déroulement ni la portée du verset. Elle remplace seulement une formulation française qui faisait du temple un destinataire peu naturel par une formulation locative compatible avec le texte hébreu et avec l’usage français, tout en maintenant le peuple comme destinataire de l’annonce.
