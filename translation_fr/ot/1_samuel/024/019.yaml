source:
  edition: WLC
  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: fr
  text: 'Tu as montré aujourd’hui le bien que tu m’as fait : Yahweh m’a livré entre tes mains[a], et tu ne m’as pas tué.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remis en ton pouvoir ». L’hébreu peut aussi se traduire par « livré dans ta main ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: tu as montré
  rationale: Le hiphil de נגד signifie normalement « annoncer, faire connaître ». Ici, la conduite de David a rendu manifeste le bien qu’il a fait à Saül ; « montré » exprime naturellement cette valeur en français.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent temporel direct et naturel.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: le bien que tu m’as fait
  rationale: Cette formulation conserve le substantif hébreu « bien » et exprime clairement l’action bénéfique de David envers Saül.
- source_word: סִגְּרַנִי
  choice: m’avait livré
  rationale: Dans ce contexte, סגר désigne le fait de remettre quelqu’un au pouvoir d’un autre. « Livré » restitue ce sens sans adopter le littéralisme inadéquat « enfermé ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: בְּיָדְךָ
  choice: entre tes mains
  rationale: L’expression française conserve l’image hébraïque tout en indiquant naturellement que Saül se trouvait au pouvoir de David.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: mais tu ne m’as pas tué
  rationale: « Tuer » est l’équivalent moderne, direct et précis. La conjonction prend ici une valeur contrastive naturelle en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve la fonction de nom propre sans lui substituer un titre.
- issue: Agent divin et responsabilité humaine
  choice: Yahweh m’avait livré entre tes mains, mais tu ne m’as pas tué
  alternative: quand Yahweh m’a livré entre tes mains, tu ne m’as pas tué
  rationale: 'La traduction maintient la tension du texte : Yahweh place Saül au pouvoir de David, tandis que David choisit de ne pas le tuer. Le plus-que-parfait rend naturellement en français l’antériorité logique de cette remise.'
translation_notes:
  register: Français international moderne, sobre et digne. « Tu » suit l’adresse personnelle de Saül à David. Le deux-points préserve le rapport explicatif entre le bien manifesté et l’acte de clémence.
