base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: fr
  text: 'Il dit à ses hommes : « Loin de moi, par égard pour Yahweh, de faire cela à mon seigneur, l’oint de Yahweh, en portant la main sur lui ![a] Car il est l’oint de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une tournure plus traditionnelle : « Que Yahweh me garde de faire cela ! » L’expression hébraïque marque un rejet très énergique d’un tel acte en lien avec Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Loin de moi, à cause de Yahweh
  rationale: חָלִילָה exprime un rejet énergique, tandis que מֵיְהוָה rattache ce refus à Yahweh. La formulation française conserve cette motivation religieuse sans faire explicitement de Yahweh le sujet d’une interdiction.
- source_word: אִם אֶעֱשֶׂה
  choice: l’idée de faire
  rationale: Après חָלִילָה, אִם appartient à une tournure idiomatique de répudiation plutôt qu’à une condition réelle. « Loin de moi l’idée de faire » rend naturellement cette force en français.
- source_word: הַדָּבָר הַזֶּה
  choice: une telle chose
  rationale: דָּבָר désigne ici l’acte envisagé. « Une telle chose » reste général tout en étant idiomatique dans ce contexte de vive répudiation.
- source_word: לַאדֹנִי
  choice: à mon seigneur
  rationale: Cette expression maintient le respect que David témoigne à Saül et conserve la préposition du texte hébreu sans anticiper la formulation hostile qui suit.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: celui qui a reçu l’onction de Yahweh
  rationale: מָשִׁיחַ désigne ici le roi consacré par onction. Cette formulation claire pour le lecteur moderne préserve l’image et la fonction royale sans introduire prématurément le titre « Messie ».
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: porter la main sur lui
  rationale: Cette locution française naturelle conserve l’image de la main et exprime une action hostile sans préciser indûment s’il s’agit de frapper ou de tuer.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: Car il est celui qui a reçu l’onction de Yahweh
  rationale: כִּי introduit la raison du refus. La répétition du titre, présente en hébreu, est maintenue pour préserver l’insistance théologique du verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver sa valeur de nom propre dans le texte hébreu.
theological_decisions:
- issue: Sens de מָשִׁיחַ appliqué à Saül
  choice: celui qui a reçu l’onction de Yahweh
  alternative: le Messie de Yahweh / l’oint de Yahweh
  rationale: Dans ce contexte, le mot désigne Saül comme roi consacré par l’onction. « Messie » risquerait d’importer une association christologique ultérieure, tandis que « celui qui a reçu l’onction » conserve le sens royal et sacré du terme.
- issue: Rapport entre le refus de David et Yahweh dans חָלִילָה לִּי מֵיְהוָה
  choice: à cause de Yahweh
  alternative: Que Yahweh me garde de
  rationale: Le texte lie fortement la répugnance de David à Yahweh, mais la construction ne présente pas sans ambiguïté Yahweh comme l’agent direct d’une interdiction. Le texte principal garde cette nuance, et la note fournit la tournure traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition rhétorique du titre de Saül et l’image de la main, tout en évitant les formulations excessivement archaïques.
