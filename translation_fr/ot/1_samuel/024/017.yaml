base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: fr
  text: 'Quand David eut fini de dire ces paroles à Saül, Saül dit : « Est-ce ta voix, mon fils David ? » Alors Saül éleva la voix et pleura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Quand … eut fini
  rationale: La construction introduit une proposition temporelle marquant l’achèvement de la parole de David avant la réaction de Saül. Le passé antérieur convient au récit soutenu en français.
- source_word: לְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: de dire ces paroles
  rationale: Dans ce contexte de discours, דְּבָרִים désigne les paroles que David vient de prononcer. Cette formulation reste proche de l’hébreu tout en étant naturelle.
- source_word: הֲקֹלְךָ זֶה
  choice: Est-ce bien ta voix
  rationale: קוֹל désigne ici la voix reconnue. « Bien » rend naturellement en français la nuance de reconnaissance interrogative sans modifier le contenu de la question.
- source_word: בְּנִי דָוִד
  choice: mon fils David
  rationale: Conserve l’appellation filiale et affective de Saül, avec un ordre des mots naturel en français.
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ
  choice: Saül éleva la voix
  rationale: Reproduit l’image de l’expression hébraïque sans la réduire au simple fait de pleurer; la proposition suivante en précise la manifestation émotionnelle.
- source_word: וַיֵּבְךְּ
  choice: et pleura
  rationale: Le verbe désigne précisément l’action de pleurer. La coordination conserve la succession formelle des deux verbes hébreux.
theological_decisions:
- issue: L’appellation « mon fils David »
  choice: Maintien du langage filial et relationnel
  alternative: Comprendre l’expression uniquement comme une formule politique de faveur ou de patronage
  rationale: L’hébreu emploie explicitement « mon fils ». La traduction en conserve la force affective et sociale sans affirmer une filiation littérale ni ajouter une portée doctrinale.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé antérieur « eut fini » marque clairement l’antériorité immédiate; « éleva la voix et pleura » conserve l’idiome hébreu dans une formulation compréhensible.
