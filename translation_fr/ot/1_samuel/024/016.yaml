  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: fr
  text: Que le SEIGNEUR soit juge et tranche entre toi et moi ! Qu’il voie, qu’il défende ma cause et qu’il me fasse justice en me délivrant de ta main !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: le SEIGNEUR
  rationale: Rend le nom divin selon la convention française courante en petites capitales, dans un registre biblique naturel et digne.
- source_word: וְשָׁפַט
  choice: et tranche
  rationale: Dans le contexte judiciaire, le verbe signifie rendre une décision entre deux parties ; « trancher entre » évite la répétition lourde de « juge… juge » tout en conservant le sens.
- source_word: וְיָרֵב אֶת־רִיבִי
  choice: qu’il défende ma cause
  rationale: 'L’expression appartient au langage judiciaire : elle présente le SEIGNEUR comme celui qui prend en charge et soutient la cause de David.'
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: qu’il me fasse justice en me délivrant de ta main
  rationale: 'Le verbe garde sa portée judiciaire, tandis que מִיָּדֶךָ exprime l’issue recherchée : être soustrait au pouvoir de Saül.'
theological_decisions:
- issue: Rôle du SEIGNEUR dans le conflit
  choice: Conserver l’enchaînement des demandes judiciaires adressées au SEIGNEUR
  alternative: Réduire l’ensemble à une simple demande de délivrance
  rationale: Le texte présente Dieu à la fois comme juge, arbitre et défenseur de la cause de David ; cette tension judiciaire doit rester explicite.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Les exclamations rendent naturellement la valeur souhaitative des formes verbales hébraïques.
