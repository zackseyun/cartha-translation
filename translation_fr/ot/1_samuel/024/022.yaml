  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: fr
  text: Maintenant, jure-moi par Yahweh que tu ne retrancheras pas ma descendance après moi[a][b] et que tu ne feras pas disparaître mon nom de la maison de mon père[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement « si » dans la formule de serment ; ici, ce mot introduit ce que Saül demande à David de jurer, d’où « que tu ne… pas ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mes descendants » ; littéralement « ma semence ».
    reason: lexical_alternative
  - marker: c
    text: Ici, « mon nom » désigne la continuité et la mémoire de la lignée de Saül au sein de sa famille ancestrale.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers la demande finale de Saül; « Maintenant » est naturel en français moderne.
- source_word: הִשָּׁבְעָה לִּי
  choice: jure-moi
  rationale: L’impératif nifal de שבע avec le complément indirect exprime directement une demande de serment.
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: Formule de serment invoquant explicitement le nom divin יהוה.
- source_word: אִם … וְאִם
  choice: que tu ne… et que tu ne…
  rationale: Dans cette formule de serment, אִם introduit les engagements demandés; le français exige ici une formulation négative explicite plutôt qu’un « si » incomplet.
- source_word: תַכְרִית
  choice: tu ne retrancheras pas
  rationale: Le hiphil de כרת signifie éliminer ou « retrancher », particulièrement une descendance ou une lignée.
- source_word: זַרְעִי
  choice: mes descendants
  rationale: זֶרַע désigne ici la postérité de Saül, non une semence au sens concret.
- source_word: אַחֲרָי
  choice: après moi
  rationale: 'L’expression a ici un sens temporel: après la mort de Saül.'
- source_word: תַשְׁמִיד
  choice: tu ne feras pas disparaître
  rationale: Le hiphil de שמד exprime l’anéantissement; « faire disparaître » convient au contexte où il est question d’effacer un nom familial.
- source_word: שְׁמִי
  choice: mon nom
  rationale: La formulation concrète de l’hébreu est conservée; le « nom » évoque l’identité et la continuité mémorielle de la lignée.
- source_word: מִבֵּית אָבִי
  choice: de la maison de mon père
  rationale: Rend l’expression de parenté hébraïque désignant la famille paternelle ou le clan ancestral.
theological_decisions:
- issue: Rendu du nom divin יהוה dans la formule de serment
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère personnel du nom invoqué dans le serment.
- issue: Valeur négative de אִם dans la demande de serment
  choice: que tu ne… pas
  alternative: si tu…
  rationale: L’hébreu conserve une formule de serment elliptique susceptible d’être rendue littéralement par « si »; dans ce contexte, Saül demande clairement à David de jurer qu’il n’exterminera ni sa postérité ni son nom. La note signale la forme littérale sans rendre le français obscur.
translation_notes:
  register: Français international moderne, digne et accessible. « Retrancher » conserve l’image forte de כרת sans être excessivement archaïque. L’expression « maison de mon père » maintient la structure familiale du texte hébreu; une note explique la portée culturelle de « mon nom ».
