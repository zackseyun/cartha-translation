  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: fr
  text: 'Regarde : aujourd’hui, tu as vu de tes propres yeux que Yahweh t’a livré aujourd’hui entre mes mains dans la grotte. Quelqu’un a dit de te tuer[a], mais je t’ai épargné[b]. J’ai dit : « Je ne porterai pas la main sur mon seigneur, car il est l’oint de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a dit de te tuer », « il a été dit de te tuer » ou « on a dit que je devais te tuer ». Le verbe hébreu est au singulier et son sujet n’est pas précisé.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « mais j’ai eu pitié de toi ». La forme hébraïque transmise peut aussi se comprendre comme « mais mon œil t’a épargné » ; le verbe exprime le fait d’épargner, éventuellement par compassion.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Regarde
  rationale: Cette interjection attire fortement l’attention. « Regarde » est naturel en français moderne et conserve sa valeur déictique.
- source_word: הַיּוֹם הַזֶּה רָאוּ עֵינֶיךָ
  choice: aujourd’hui même, tu as vu de tes propres yeux
  rationale: La formulation conserve l’insistance temporelle ainsi que l’image hébraïque des yeux comme témoins directs.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: Yahweh t’a livré entre mes mains
  rationale: La construction exprime le fait de remettre quelqu’un au pouvoir d’un autre. « Livré entre mes mains » rend naturellement cet idiome en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: בַּמְּעָרָה
  choice: dans la grotte
  rationale: Traduction locative directe et idiomatique.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: Quelqu’un a dit de te tuer
  rationale: Le verbe hébreu est au singulier sans sujet exprimé. Cette traduction garde l’agent indéterminé sans corriger silencieusement le texte ni l’identifier avec certitude à David.
- source_word: וַתָּחָס עָלֶיךָ
  choice: mais je t’ai épargné
  rationale: Dans ce contexte, le verbe exprime le fait de préserver par pitié ou retenue. Le français explicite David comme sujet d’après la suite du discours, tout en signalant l’autre nuance en note.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: Je ne porterai pas la main
  rationale: Cette expression française conserve l’image de la main et communique clairement l’idée d’une action hostile.
- source_word: בַּאדֹנִי
  choice: sur mon seigneur
  rationale: Le titre désigne Saül comme supérieur humain et roi. « Mon seigneur » garde le registre respectueux et politique du récit.
- source_word: מְשִׁיחַ יְהוָה
  choice: l’oint de Yahweh
  rationale: Dans ce récit royal, l’expression désigne le roi consacré par Yahweh. « L’oint » préserve cette portée sans imposer directement le titre eschatologique « Messie ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme ; sa transcription préserve le caractère propre du nom d’alliance.
- issue: Sens de מְשִׁיחַ יְהוָה dans le récit royal
  choice: l’oint de Yahweh
  alternative: le Messie de Yahweh
  rationale: Le référent immédiat est Saül en tant que roi consacré. « L’oint » conserve la portée théologique du terme sans transformer ici le titre en désignation eschatologique.
- issue: Sujet non exprimé de וְאָמַר
  choice: Quelqu’un a dit
  alternative: J’ai dit
  rationale: La forme consonantique transmise est un verbe masculin singulier à la troisième personne sans sujet explicite. La traduction retenue maintient cette indétermination ; la note présente les autres lectures possibles.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde le respect de David envers Saül. Les répétitions emphatiques de « aujourd’hui » et des « yeux » sont rendues de façon idiomatique par « aujourd’hui même » et « de tes propres yeux ». Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
