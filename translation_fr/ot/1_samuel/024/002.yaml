base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: fr
  text: 'Lorsque Saül revint après avoir poursuivi les Philistins, on lui annonça : « Voici, David est dans le désert d’Ein-Guédi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: après avoir poursuivi les Philistins
  rationale: L’expression indique que Saül revient de derrière les Philistins, c’est-à-dire de leur poursuite; cette formulation est naturelle en français et conserve le sens contextuel.
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: on vint lui dire
  rationale: Le sujet indéfini pluriel hébreu se rend naturellement par « on »; « vint » exprime dans ce récit l’arrivée de l’information, tandis que « dire » représente לֵאמֹר sans le calque lourd « en disant ».
- source_word: הִנֵּה
  choice: non exprimé séparément
  rationale: Dans cette annonce, הִנֵּה attire l’attention sur l’information qui suit. Le français oral naturel peut porter cette mise en relief directement par l’annonce « David est… », sans ajouter un « voici » artificiel.
- source_word: מִדְבַּר עֵין גֶּדִי
  choice: le désert d’Ein-Guédi
  rationale: מִדְבָּר désigne ici une région sauvage ou désertique. « Désert » est l’équivalent biblique français courant, et « Ein-Guédi » translittère le toponyme hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe évite les hébraïsmes pesants tout en conservant la progression du verset et le discours direct.
