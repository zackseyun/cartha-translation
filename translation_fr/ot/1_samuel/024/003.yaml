  text: וַ/יִּקַּ֣ח שָׁא֗וּל שְׁלֹ֧שֶׁת אֲלָפִ֛ים אִ֥ישׁ בָּח֖וּר מִ/כָּל יִשְׂרָאֵ֑ל וַ/יֵּ֗לֶךְ לְ/בַקֵּ֤שׁ אֶת דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו עַל פְּנֵ֖י צוּרֵ֥י הַ/יְּעֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: fr
  text: Alors Saül prit trois mille hommes d’élite de tout Israël et partit à la recherche de David et de ses hommes, en face des rochers des bouquetins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des escarpements des chèvres sauvages »; l’animal désigné est probablement le bouquetin.
    reason: Alternative lexicale et précision zoologique pour צוּרֵי הַיְּעֵלִים.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Dans ce contexte militaire, לקח indique que Saül prend avec lui ou mobilise des hommes; « prit » conserve directement la structure du récit.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: trois mille hommes d’élite
  rationale: בָּחוּר qualifie ici des hommes choisis pour leur valeur; « hommes d’élite » est naturel en français et exprime la sélection militaire sans lourdeur.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: de tout Israël
  rationale: La préposition מן exprime la provenance ou la sélection au sein de l’ensemble d’Israël.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: partit à la recherche de
  rationale: L’infinitif marque le but du déplacement. Cette formulation française rend clairement la poursuite intentionnelle.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: David et ses hommes
  rationale: « Ses hommes » désigne naturellement les compagnons ou partisans armés de David.
- source_word: עַל פְּנֵי
  choice: du côté de
  rationale: L’expression spatiale peut signifier « devant », « en face de » ou situer une action dans le voisinage d’un relief. « Du côté de » reste naturel tout en évitant une précision topographique excessive.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: les rochers des bouquetins
  rationale: צוּרֵי désigne des rochers ou escarpements; יְעֵלִים désigne probablement des bouquetins, terme zoologique courant et précis en français.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Hommes d’élite » rend idiomatiquement la sélection militaire; « bouquetins » privilégie la précision zoologique, avec l’équivalent plus littéral en note.
