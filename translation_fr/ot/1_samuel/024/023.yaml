base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: fr
  text: David prêta donc serment à Saül. Puis Saül rentra chez lui, mais David et ses hommes montèrent au refuge fortifié.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et David et ses hommes montèrent au refuge fortifié ». La conjonction hébraïque signifie simplement « et » ; « mais » explicite ici le contraste narratif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: prêta serment
  rationale: Le nifal de שׁבע signifie ici prêter serment. Cette formulation est naturelle et digne en français narratif.
- source_word: לְשָׁאוּל
  choice: à Saül
  rationale: La préposition ל indique ici la personne envers qui David s'engage par serment.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל־בֵּיתוֹ
  choice: Puis Saül rentra chez lui
  rationale: ביתו peut désigner sa maison ou son foyer; « rentra chez lui » exprime naturellement le retour de Saül à sa résidence.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: mais David et ses hommes
  rationale: La conjonction hébraïque signifie littéralement « et », mais le contexte oppose la destination de David à celle de Saül. Cette explicitation est signalée en note.
- source_word: עָלוּ
  choice: montèrent
  rationale: עלה conserve ici son sens directionnel de monter, adapté au relief où se trouve le refuge.
- source_word: הַמְּצוּדָה
  choice: le refuge fortifié
  rationale: מְצוּדָה désigne une position forte servant de refuge. « Refuge fortifié » restitue à la fois la sécurité et le caractère défensif du lieu sans préciser davantage sa nature.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. « Prêta serment » évite une tournure archaïque; « refuge fortifié » rend la fonction de la מְצוּדָה dans le cadre désertique. Le contraste introduit par « mais » est transparent grâce à la note.
