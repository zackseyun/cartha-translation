base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: fr
  text: Il arriva aux enclos à moutons, au bord du chemin. Il y avait là une grotte, et Saül y entra pour satisfaire un besoin naturel.[a] David et ses hommes étaient assis tout au fond de la grotte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour se couvrir les pieds », expression hébraïque signifiant « satisfaire un besoin naturel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: les enclos à moutons
  rationale: Le nom désigne des enceintes destinées au petit bétail. « Enclos à moutons » est concret et immédiatement compréhensible en français moderne.
- source_word: עַל הַדֶּרֶךְ
  choice: qui bordaient le chemin
  rationale: Dans ce contexte, la préposition situe les enclos par rapport au chemin. Cette formulation française exprime naturellement cette proximité spatiale.
- source_word: מְעָרָה
  choice: une grotte
  rationale: Équivalent français courant et précis du nom hébreu.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: pour satisfaire un besoin naturel
  rationale: L’expression hébraïque est un euphémisme désignant le fait de se soulager. La traduction conserve un registre pudique et clair; l’image littérale est donnée en note.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: tout au fond de la grotte
  rationale: Le terme désigne les parties les plus reculées. « Tout au fond » restitue clairement la disposition de la scène dans un français naturel.
- source_word: יֹשְׁבִים
  choice: étaient assis
  rationale: Le participe décrit ici leur position dans la grotte plutôt qu’un séjour durable.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: Il arriva ... Saül y entra
  rationale: Les deux verbes marquent d’abord l’arrivée aux enclos, puis l’entrée de Saül dans la grotte. La variation est naturelle en français tout en gardant la succession narrative.
