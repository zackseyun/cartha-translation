  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: fr
  text: 'Alors les hommes de David lui dirent : « Voici le jour dont Yahvé t’a parlé : “Voici, je livre ton ennemi[a] entre tes mains ; tu pourras lui faire ce qui te semblera bon[b].” » David se leva et coupa discrètement le pan du manteau de Saül.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le ketiv porte « tes ennemis », tandis que le qeré lit « ton ennemi ». Le singulier est soutenu par le contexte et par les pronoms singuliers qui suivent.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « ce qui sera bon à tes yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד אֵלָיו
  choice: Alors les hommes de David lui dirent
  rationale: Le waw consécutif fait progresser le récit ; « Alors » rend naturellement la succession, et « les hommes de David » désigne ses compagnons.
- source_word: הִנֵּה הַיּוֹם
  choice: Voici le jour
  rationale: « Voici » conserve la force déictique et emphatique de הִנֵּה dans un français actuel et digne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui le distingue du titre « le Seigneur ».
- source_word: נֹתֵן
  choice: je livre
  rationale: Dans l’expression idiomatique « livrer quelqu’un entre les mains de », le présent français exprime clairement l’action imminente et vive du participe hébreu.
- source_word: איביך
  choice: ton ennemi
  rationale: La lecture traditionnelle est au singulier, conformément aux pronoms singuliers qui suivent et au contexte, où il s’agit de Saül.
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Cette expression française conserve l’image hébraïque tout en communiquant naturellement l’idée de mettre quelqu’un au pouvoir d’un autre.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: tu pourras lui faire
  rationale: Dans le contexte, les hommes de David présentent la remise de l’ennemi comme l’occasion et l’autorisation d’agir, plutôt que comme l’ordre précis de le tuer.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: ce qui te semblera bon
  rationale: Formulation française naturelle qui conserve l’idée de ce que David estimera bon ; l’image littérale des yeux est signalée en note.
- source_word: וַיָּקָם דָּוִד
  choice: David se leva
  rationale: Rend directement le mouvement narratif sans surcharger le style.
- source_word: וַיִּכְרֹת אֶת כְּנַף הַמְּעִיל
  choice: coupa le pan du manteau
  rationale: כָּנָף désigne ici l’extrémité ou le pan du vêtement ; « coupa » exprime suffisamment le détachement de cette partie.
- source_word: בַּלָּט
  choice: discrètement
  rationale: L’adverbe indique une action accomplie en secret ou sans être remarquée ; « discrètement » convient au contexte narratif.
theological_decisions:
- issue: Statut de la parole attribuée à Yahvé par les hommes de David
  choice: 'La traduction rapporte directement leur affirmation : « le jour au sujet duquel Yahvé t’a dit »'
  alternative: 'Prendre une distance explicite, par exemple : « le jour qui, selon eux, accomplissait une parole de Yahvé »'
  rationale: L’hébreu rapporte l’interprétation des hommes de David sans confirmer ni réfuter qu’une parole divine antérieure ait exactement annoncé cet événement. La formulation garde cette tension narrative.
- issue: Valeur de וְעָשִׂיתָ dans la parole rapportée
  choice: « tu pourras lui faire »
  alternative: « tu lui feras »
  rationale: 'La valeur permissive convient à l’argument des hommes de David : Yahvé lui aurait remis son ennemi afin qu’il agisse comme bon lui semble. Cette traduction n’ajoute pas un ordre divin explicite de tuer Saül.'
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures « Voici » et « entre tes mains » conservent des images fortes de l’hébreu sans archaïsme excessif ; les formulations idiomatiques restent accessibles à un lectorat général.
