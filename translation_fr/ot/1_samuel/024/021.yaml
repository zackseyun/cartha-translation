  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: fr
  text: Et maintenant, je sais bien que tu régneras assurément et que le royaume d’Israël sera établi sous ton autorité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: Et maintenant
  rationale: En contexte, הִנֵּה attire l’attention sur la certitude nouvellement reconnue par Saül. En français naturel, « Et maintenant, je sais » porte déjà cette mise en relief; un littéral « voici » ou « regarde » serait ici peu idiomatique.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: tu régneras certainement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation; « certainement » exprime cette emphase sans surcharger la phrase.
- source_word: וְקָמָה
  choice: sera affermi
  rationale: Le verbe קום décrit ici l’établissement durable et assuré du royaume, et non simplement son apparition.
- source_word: בְּיָדְךָ
  choice: entre tes mains
  rationale: L’expression idiomatique désigne l’autorité et la maîtrise de David. Le pluriel français « entre tes mains » est naturel tout en conservant l’image hébraïque.
theological_decisions:
- issue: Certitude de l’accession de David au trône
  choice: tu régneras certainement
  alternative: tu deviendras bel et bien roi
  rationale: La formulation retenue conserve l’emphase grammaticale de l’hébreu sans préciser davantage la source ou le mode d’accomplissement de cette certitude.
translation_notes:
  register: Français moderne, digne et oralement fluide. La répétition emphatique hébraïque est rendue par un adverbe, et l’image de l’autorité exercée « entre les mains » est conservée.
