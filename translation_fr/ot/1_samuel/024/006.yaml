  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: fr
  text: Après cela, le cœur de David le frappa[a] parce qu’il avait coupé un pan du manteau de Saül[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le cœur de David le frappa », expression qui indique que sa conscience le troublait.'
    reason: lexical_alternative
  - marker: b
    text: Ou « le bord » ou « l’extrémité » du manteau de Saül ; le mot hébreu peut désigner l’extrémité d’un vêtement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette expression marque la succession temporelle. « Après cela » est naturel en français moderne tout en conservant le lien avec l’action précédente.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: le cœur de David le frappa
  rationale: La formulation conserve l’image vive de l’hébreu, où le cœur est le sujet du verbe « frapper », sans remplacer silencieusement cette image par l’interprétation « sa conscience le tourmenta ».
- source_word: עַל אֲשֶׁר
  choice: parce que
  rationale: La locution introduit la raison du trouble intérieur de David ; « parce que » en exprime clairement la valeur causale.
- source_word: כָּרַת
  choice: avait coupé
  rationale: Le plus-que-parfait situe l’action de couper avant la réaction intérieure de David. Le verbe hébreu signifie couper ou retrancher.
- source_word: כָּנָף
  choice: un pan
  rationale: Dans le contexte d’un vêtement, le mot désigne une extrémité, un bord ou un pan. « Un pan » est idiomatique en français et ne précise pas indûment qu’il s’agissait nécessairement de l’ourlet.
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: un pan du manteau de Saül
  rationale: L’hébreu mentionne littéralement l’extrémité appartenant à Saül ; le nom du vêtement est explicité à partir du contexte immédiat afin d’éviter une formulation obscure en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. L’idiome hébreu du cœur qui frappe est maintenu dans le texte principal malgré son caractère inhabituel, puis expliqué en note. « Manteau » est fourni d’après le contexte immédiat.
