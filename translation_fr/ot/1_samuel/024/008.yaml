source:
  edition: WLC
  text: וַ/יְשַׁסַּ֨ע דָּוִ֤ד אֶת אֲנָשָׁי/ו֙ בַּ/דְּבָרִ֔ים וְ/לֹ֥א נְתָנָ֖/ם לָ/ק֣וּם אֶל שָׁא֑וּל וְ/שָׁא֛וּל קָ֥ם מֵ/הַ/מְּעָרָ֖ה וַ/יֵּ֥לֶךְ בַּ/דָּֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: fr
  text: David retint ses hommes par ses paroles et ne leur permit pas de se dresser contre Saül[a]. Puis Saül se leva, sortit de la grotte et poursuivit son chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « David réprimanda sévèrement ses hommes par ses paroles. » Le verbe hébreu est rare et peut exprimer une action plus énergique qu’une simple retenue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: retint
  rationale: Le verbe est rare et difficile. Dans le contexte, David empêche énergiquement ses hommes de s’en prendre à Saül. « Retint » exprime clairement ce résultat sans imposer l’image littérale possible de déchirement; la note signale la nuance plus vive.
- source_word: אֲנָשָׁיו
  choice: ses hommes
  rationale: L’expression désigne ici les hommes qui suivent David dans la grotte; « ses hommes » est naturel et précis en français.
- source_word: בַּדְּבָרִים
  choice: par ses paroles
  rationale: La préposition indique le moyen employé par David. « Par ses paroles » conserve explicitement l’intervention verbale sans supposer qu’il s’agit uniquement des paroles citées juste avant.
- source_word: וְלֹא נְתָנָם
  choice: ne leur permit pas
  rationale: Avec l’infinitif, נתן exprime ici la permission. Cette formulation est claire, actuelle et fidèle à la construction.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: de se dresser contre Saül
  rationale: Dans ce contexte hostile, קום avec אֶל évoque une action dirigée contre Saül. « Se dresser contre » préserve l’image du verbe et la dimension adverse sans expliciter davantage par « attaquer ».
- source_word: קָם מֵהַמְּעָרָה
  choice: se leva, sortit de la grotte
  rationale: L’hébreu dit littéralement que Saül « se leva de la grotte ». En français, la coordination explicite naturellement le fait qu’il se lève puis en sort, tout en conservant le verbe קום repris dans le verset.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: poursuivit son chemin
  rationale: Cette expression française naturelle rend l’idée de partir et de continuer sa route, plutôt que la formulation littérale moins idiomatique « alla sur le chemin ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve la répétition de l’idée de « se lever/se dresser » autant que le permet un français naturel, et la note maintient l’incertitude liée au verbe rare וַיְשַׁסַּע.
