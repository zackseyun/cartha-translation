  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: fr
  text: 'David dit à Saül : « Pourquoi écoutes-tu les paroles d’un homme[a] qui dit : “Voici, David cherche à te faire du mal[b]” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des paroles humaines ». Le singulier hébreu peut parfois avoir un sens humain général ; ici, « d’un homme » conserve la forme singulière et peut évoquer un accusateur.'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « cherche ton mal » ; ou : « cherche le mal contre toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif biblique en français moderne et soutenu.
- source_word: לְשָׁאוּל
  choice: à Saül
  rationale: La préposition לְ introduit le destinataire, et « Saül » est la forme française traditionnelle du nom.
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Cette traduction directe restitue naturellement l’interrogation.
- source_word: תִשְׁמַע
  choice: écoutes-tu
  rationale: Dans ce contexte, שׁמע signifie prêter attention ou accorder du crédit, et non simplement percevoir un son.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: les paroles d’un homme
  rationale: Le singulier אָדָם est conservé, puisqu’il peut désigner ici un accusateur individuel, tout en laissant en note la possibilité d’un sens humain plus général.
- source_word: לֵאמֹר
  choice: qui dit
  rationale: Après « les paroles d’un homme », la relative est plus idiomatique en français qu’un participe détaché et introduit clairement le discours rapporté.
- source_word: הִנֵּה
  choice: Regarde
  rationale: L’impératif restitue la fonction de הִנֵּה comme appel à l’attention dans une parole directe, sans l’archaïsme possible de « voici » dans cet emploi.
- source_word: מְבַקֵּשׁ
  choice: cherche à
  rationale: Le participe présente une conduite en cours ou attribuée à David; la construction française « cherche à » en rend naturellement la visée.
- source_word: רָעָתֶךָ
  choice: te faire du mal
  rationale: Cette formulation idiomatique exprime l’idée d’un mal dirigé contre Saül, sans imposer à רָעָה un sens exclusivement moral.
theological_decisions:
- issue: Portée de אָדָם
  choice: un homme
  alternative: les humains / quelqu’un
  rationale: Le texte porte un singulier. « Un homme » respecte cette forme et la référence vraisemblable à un accusateur, sans exclure en note une portée humaine plus générale.
- issue: Sens de רָעָה
  choice: faire du mal
  alternative: chercher ton malheur / chercher le mal contre toi
  rationale: Le contexte concerne une menace supposée contre Saül. « Faire du mal » exprime cette accusation sans déterminer si רָעָה désigne précisément un tort, un malheur ou un mal moral.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif soutenu sans archaïsme; le dialogue reste direct et immédiatement compréhensible.
