base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: fr
  text: 'Après cela, David se leva, sortit de la grotte et appela Saül alors qu’il s’éloignait : « Mon seigneur, le roi ! » Saül regarda derrière lui, et David s’inclina, le visage contre terre, puis se prosterna.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se courba profondément ». Le verbe hébreu peut désigner une profonde marque de respect ou d’hommage ; ici, il décrit l’attitude de David devant Saül, et non l’adoration divine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal de קום indique ici que David se lève pour agir; « se leva » convient au récit et reste proche de l’hébreu.
- source_word: אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette locution temporelle marque simplement la succession des événements.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: sortit de la grotte
  rationale: יצא exprime la sortie; cette formulation est naturelle en français et respecte le point de vue narratif.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: appela Saül par-derrière
  rationale: קרא avec אַחֲרֵי présente David appelant Saül depuis l’arrière, vraisemblablement tandis que celui-ci s’éloigne.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mon seigneur le roi
  rationale: L’expression conserve à la fois l’adresse respectueuse אֲדֹנִי et le titre royal, sans donner à « seigneur » un sens divin.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: Saül regarda derrière lui
  rationale: נבט signifie regarder, et אַחֲרָיו précise la direction du regard. La coordination directe reproduit la progression hébraïque.
- source_word: וַיִּקֹּד
  choice: s’inclina
  rationale: קדד désigne l’inclination du corps; ce choix permet de distinguer ce premier geste du verbe suivant.
- source_word: אַפַּיִם אַרְצָה
  choice: le visage contre terre
  rationale: L’expression idiomatique, littéralement orientée « face/narines vers la terre », décrit une profonde inclination.
- source_word: וַיִּשְׁתָּחוּ
  choice: se prosterna
  rationale: שׁחה décrit ici un geste corporel marqué d’hommage ou de soumission. « Se prosterna » en conserve l’intensité sans le réduire au geste précédent.
theological_decisions:
- issue: Sens du geste de David devant Saül
  choice: Geste physique de profond respect et de soumission
  alternative: « adora » ou « rendit hommage »
  rationale: Le verbe שׁחה peut décrire soit l’adoration de Dieu, soit la prosternation devant un humain selon le contexte. Puisque David s’adresse ici à Saül, « se prosterna » préserve le geste sans suggérer que David lui rend un culte.
translation_notes:
  register: Français international moderne, narratif et digne. Les deux verbes corporels sont distingués par « s’inclina » et « se prosterna ». « Par-derrière » explicite la relation spatiale exprimée par אַחֲרֵי sans ajouter que Saül se retourne.
