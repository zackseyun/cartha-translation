  text: כַּ/אֲשֶׁ֣ר יֹאמַ֗ר מְשַׁל֙ הַ/קַּדְמֹנִ֔י מֵ/רְשָׁעִ֖ים יֵ֣צֵא רֶ֑שַׁע וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: fr
  text: 'Comme le dit le proverbe ancien[a] : « La méchanceté vient des méchants. » Mais je ne porterai pas la main sur toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme le dit le proverbe des anciens. » L’adjectif hébreu peut signifier que le proverbe est ancien ou qu’il vient des anciens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: Comme le dit
  rationale: Cette formule introduit naturellement en français une citation proverbiale. Le présent rend la valeur générale de l’imparfait hébreu.
- source_word: מְשַׁל הַקַּדְמֹנִי
  choice: le proverbe ancien
  rationale: מָשָׁל désigne ici une maxime traditionnelle. L’adjectif peut qualifier le proverbe comme ancien ou être compris comme une référence aux anciens; cette ambiguïté est signalée en note.
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: La méchanceté vient des méchants
  rationale: La préposition marque la provenance et יֵצֵא exprime ce qui sort ou provient. « Méchanceté » et « méchants » conservent le lien lexical et l’effet proverbial de l’hébreu.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: Mais je ne porterai pas la main sur toi
  rationale: La tournure française conserve l’image de la main tout en exprimant naturellement l’idée que David n’exercera aucune violence contre Saül. La conjonction prend ici une valeur contrastive.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La maxime garde sa brièveté et son jeu lexical; l’expression « porter la main sur » rend idiomatiquement la menace de violence sans ajouter d’interprétation théologique.
