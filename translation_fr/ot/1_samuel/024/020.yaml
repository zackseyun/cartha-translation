source:
  edition: WLC
  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: fr
  text: Car, lorsqu’un homme trouve son ennemi, le laisse-t-il repartir sain et sauf ? Que Yahweh te rende le bien que tu m’as fait aujourd’hui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh te rendra le bien ». La forme hébraïque peut exprimer soit un souhait ou une bénédiction, soit une affirmation concernant l’avenir.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי יִמְצָא אִישׁ אֶת אֹיְבוֹ
  choice: Car, lorsqu’un homme trouve son ennemi
  rationale: Le tour introduit l’affirmation rhétorique de Saül en lien avec le contexte précédent. « Un homme » conserve le masculin singulier générique de אִישׁ.
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: le laisse-t-il repartir sain et sauf ?
  rationale: Dans ce contexte, שׁלח décrit le fait de relâcher celui qui était à sa merci. La question rhétorique, naturellement implicite dans la formulation hébraïque, est rendue explicitement en français; « sain et sauf » exprime l’idée idiomatique de בְּדֶרֶךְ טוֹבָה, littéralement « sur un bon chemin ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin יהוה, plutôt que remplacement par un titre.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: Que Yahweh te rende le bien
  rationale: Le yiqtol peut exprimer ici un souhait ou une bénédiction. « Rendre le bien » conserve le sens de rétribution positive et la présence lexicale de טוֹבָה.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: que tu m’as fait aujourd’hui
  rationale: 'Formulation française naturelle de la correspondance exprimée par תַּחַת : Yahweh est appelé à récompenser David en retour de son acte envers Saül ce jour-là.'
theological_decisions:
- issue: Valeur de יְשַׁלֶּמְךָ
  choice: Que Yahweh te rende
  alternative: Yahweh te rendra
  rationale: La parole de Saül se comprend naturellement comme une bénédiction, mais la forme hébraïque peut aussi être entendue comme une prédiction; l’alternative est signalée en note.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; la translittération le préserve sans lui substituer un titre.
translation_notes:
  register: 'Français international moderne, digne et oralement naturel. La première proposition est formulée comme une question rhétorique, conformément au sens contextuel : normalement, personne ne trouve son ennemi à sa merci pour ensuite le laisser repartir indemne.'
