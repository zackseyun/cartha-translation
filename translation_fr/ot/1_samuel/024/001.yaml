  text: Then David went up from there and stayed in the strongholds of En-gedi.
translation:
  language: fr
  text: David monta de là et séjourna dans les refuges fortifiés d’Ein-Guédi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: partit
  rationale: Le verbe עלה indique littéralement un mouvement vers le haut. En contexte géographique, le français narratif « partit » est plus naturel; la direction ascendante, difficile à rendre ici sans lourdeur, reste implicite dans le déplacement vers Ein-Guédi.
- source_word: מִשָּׁם
  choice: de là
  rationale: Équivalent français direct, idiomatique et précis de l’adverbe déictique.
- source_word: וַיֵּשֶׁב
  choice: s’établit
  rationale: ישב peut signifier s’asseoir, habiter, demeurer ou séjourner. Ici, « s’établit » exprime que David prend temporairement position dans ces lieux sans nécessairement suggérer une installation permanente.
- source_word: בִּמְצָדוֹת
  choice: dans les refuges fortifiés
  rationale: מְצָדוֹת désigne des lieux défendables ou des places fortes. « Refuges fortifiés » convient au cadre désertique et n’impose pas l’idée de forteresses bâties.
- source_word: עֵין גֶּדִי
  choice: Ein-Guédi
  rationale: Le nom de lieu est translittéré selon une forme française usuelle, sans être traduit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concise et conserve le caractère défensif des lieux sans les présenter nécessairement comme des ouvrages militaires.
