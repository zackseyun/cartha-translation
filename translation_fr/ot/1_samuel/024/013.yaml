base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: fr
  text: Que Yahweh juge entre moi et toi, et que Yahweh me venge de toi[a] ! Mais ma main ne se portera pas contre toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il tire vengeance de toi en ma faveur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais ma main ne sera pas contre toi » ; expression hébraïque indiquant que David s’abstiendra d’agir avec hostilité contre Saül.'
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Que … juge
  rationale: 'Le yiqtol a ici une valeur jussive : David formule un appel solennel plutôt qu’une simple prédiction.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé dans le texte hébreu, sans lui substituer un titre.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre moi et toi
  rationale: Cette formulation conserve la construction judiciaire et l’opposition personnelle explicite de l’hébreu.
- source_word: וּנְקָמַנִי … מִמֶּךָּ
  choice: et que Yahweh me venge de toi
  rationale: Le verbe נקם exprime l’action de venger, et נקם מן peut naturellement se rendre en français par « venger quelqu’un de quelqu’un ».
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: Mais ma main ne se portera pas contre toi
  rationale: La formulation garde l’image hébraïque de la main tout en exprimant naturellement l’idée que David s’abstiendra de toute action hostile.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » en préserve la fonction de nom personnel.
- issue: Nature de l’appel de David à la vengeance
  choice: David demande à Yahweh de le venger tout en refusant d’agir lui-même contre Saül
  alternative: David demande seulement à être reconnu innocent
  rationale: נקם a une force plus précise que la seule justification judiciaire. Le texte oppose délibérément l’action attendue de Dieu à la retenue personnelle de David; cette tension est conservée.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le double emploi de « Yahweh » et la structure « entre moi et toi » sont maintenus pour préserver l’insistance et la portée judiciaire de l’hébreu.
