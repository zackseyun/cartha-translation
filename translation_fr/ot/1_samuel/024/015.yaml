    issue: « Après qui le roi d’Israël est-il parti ? » peut avoir un sens temporel en français.
    rationale: La locution « partir après quelqu’un » signifie fréquemment partir plus tard que cette personne. Elle ne communique donc pas clairement l’idée de sortir à la poursuite de quelqu’un présente dans l’hébreu.
  - severity: low
    issue: « Après qui cours-tu ? » est moins précis que רֹדֵף.
    rationale: « Courir après » est idiomatique, mais peut décrire une poursuite non hostile ou momentanée. « Poursuivre » correspond plus directement au verbe hébreu dans ce contexte.
