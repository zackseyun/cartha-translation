  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: fr
  text: À la poursuite de qui le roi d’Israël est-il sorti ? Qui poursuis-tu[a] ? À la poursuite d’un chien mort, d’une seule puce ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie à plusieurs reprises une préposition signifiant littéralement « après », au sens de la poursuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: Après qui
  rationale: La préposition signifie littéralement « après » et désigne ici la personne poursuivie. « Après qui » reste naturel en français et conserve la reprise rhétorique de l’hébreu.
- source_word: יָצָא
  choice: est-il parti
  rationale: Le verbe signifie « sortir, partir ». Dans ce contexte, « partir » évoque naturellement le fait de se mettre en campagne, sans alourdir la question.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: La formulation directe préserve la dignité du titre et le contraste ironique avec l’insignifiance revendiquée par David.
- source_word: אַתָּה רֹדֵף
  choice: cours-tu
  rationale: En français, « courir après quelqu’un » exprime idiomatiquement une poursuite soutenue. Ce choix permet aussi de conserver la construction répétée « après qui ».
- source_word: כֶּלֶב מֵת
  choice: un chien mort
  rationale: Cette traduction littérale et claire conserve l’image d’abaissement employée par David.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: une seule puce
  rationale: « Une seule » rend l’accent porté par אֶחָד sur l’extrême insignifiance de la cible.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: Après ... Après ... Après ... après ...
  rationale: La répétition est conservée autant que le permet un français naturel afin de reproduire la cadence et l’ironie de la question hébraïque.
