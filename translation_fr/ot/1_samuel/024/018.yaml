  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: fr
  text: 'Il dit à David : « Tu es plus juste que moi[a], car toi, tu m’as rendu le bien, tandis que moi, je t’ai rendu le mal. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu as davantage raison que moi. »'
    reason: Alternative lexicale de צַדִּיק, qui peut exprimer ici la rectitude morale ou le fait d’être dans son droit.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: Il dit à David
  rationale: Le wayyiqtol narratif est rendu naturellement par le passé simple. Le sujet demeure pronominal comme dans l’hébreu, bien que le contexte identifie Saül.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: Tu es plus juste que moi
  rationale: צַדִּיק peut désigner celui qui est juste moralement ou qui est dans son droit. « Plus juste » conserve cette portée morale tout en laissant ouverte la nuance judiciaire.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’affirmation précédente; « car » en restitue clairement la valeur explicative.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: tu m’as rendu le bien
  rationale: « Rendre le bien » exprime la manière dont David a traité Saül et préserve le parallélisme lexical ainsi que l’opposition avec « rendre le mal ».
- source_word: וַאֲנִי
  choice: tandis que moi
  rationale: Cette formulation rend explicitement et naturellement le contraste porté ici par la coordination et le pronom indépendant.
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: je t’ai rendu le mal
  rationale: La répétition de « rendre » reproduit celle de גמל, tandis que « le mal » conserve l’antithèse directe avec « le bien ».
theological_decisions:
- issue: Portée de צַדִּיק dans la comparaison
  choice: plus juste que moi
  alternative: davantage dans ton droit que moi
  rationale: Le texte peut évoquer à la fois la rectitude morale de David et le fait qu’il est dans son droit. Le corps du texte retient la formulation française la plus concise et digne, et la note conserve l’autre nuance sans trancher davantage.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique soutenu sans archaïsme. Le parallélisme « rendu le bien / rendu le mal » garde la force rhétorique et morale de l’hébreu.
