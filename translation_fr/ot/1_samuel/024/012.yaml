source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: fr
  text: Mon père, regarde, oui, regarde le pan de ton manteau dans ma main ! Lorsque j’ai coupé le pan de ton manteau, je ne t’ai pas tué. Sache-le et vois qu’il n’y a dans ma main ni mal ni révolte[a], et que je n’ai pas péché contre toi. Pourtant, tu traques ma vie pour la prendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : transgression.'
    reason: פֶשַׁע peut désigner une révolte contre l’autorité aussi bien qu’une faute ou transgression grave.
lexical_decisions:
- source_word: וְאָבִי
  choice: Mon père
  rationale: Le vocatif conserve l’adresse déférente et quasi familiale de David envers Saül. Le וְ initial n’exige pas ici un « et » peu naturel en français.
- source_word: רְאֵה גַּם רְאֵה
  choice: regarde, oui, regarde
  rationale: La répétition renforcée par גַּם exprime une insistance pressante, rendue naturellement sans supprimer le redoublement.
- source_word: כְּנַף מְעִילְךָ
  choice: le pan de ton manteau
  rationale: כָּנָף désigne ici l’extrémité ou le bord du vêtement. « Pan » est concret et idiomatique en français dans cette scène.
- source_word: בְּיָדִי
  choice: dans ma main
  rationale: La formulation littérale convient à la preuve matérielle que David montre et maintient le lien avec l’emploi figuré ultérieur de la main comme siège de l’action.
- source_word: כִּי בְּכָרְתִי
  choice: Lorsque j’ai coupé
  rationale: כִּי introduit la preuve explicative ; le français temporel exprime clairement que David aurait pu tuer Saül au moment où il a coupé le vêtement.
- source_word: דַּע וּרְאֵה
  choice: Sache-le et vois
  rationale: 'Les deux impératifs sont conservés : Saül doit reconnaître le fait et en constater la portée morale.'
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: il n’y a dans ma main ni mal ni révolte
  rationale: « Dans ma main » reprend l’image du texte. Dans le rapport de David au roi, פֶשַׁע peut désigner une révolte ou une transgression ; « révolte » fait entendre la dimension politique sans effacer l’ambiguïté, signalée en note.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: je n’ai pas péché contre toi
  rationale: La traduction conserve le poids moral et religieux de חטא ainsi que l’offense dirigée contre une personne.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: Pourtant, tu traques ma vie pour la prendre
  rationale: « Traquer » maintient l’image de la chasse, tandis que « ma vie » et le pronom « la » reproduisent le lien explicite entre נֶפֶשׁ et le suffixe féminin.
theological_decisions:
- issue: Portée morale et politique de פֶשַׁע dans la défense de David
  choice: révolte
  alternative: transgression, crime
  rationale: Devant le roi, David nie notamment toute entreprise rebelle, mais le terme garde une portée morale plus large. La note préserve cette possibilité au lieu de réduire le mot à une seule nuance.
translation_notes:
  register: Français moderne, digne et direct. La répétition emphatique est conservée, ainsi que les images concrètes de la main et de la chasse. « Pan de ton manteau » est naturel en français international et évite un archaïsme inutile.
