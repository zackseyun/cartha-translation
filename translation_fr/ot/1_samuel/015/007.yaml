  text: וַ/יַּ֥ךְ שָׁא֖וּל אֶת עֲמָלֵ֑ק מֵֽ/חֲוִילָה֙ בּוֹאֲ/ךָ֣ שׁ֔וּר אֲשֶׁ֖ר עַל פְּנֵ֥י מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: fr
  text: Alors Saül frappa Amalec[a], depuis Havila, en allant vers Shour[b], qui est en face de l’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Amalécites » ; l’hébreu porte « Amalec », nom de l’ancêtre employé collectivement pour désigner le peuple.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme tu viens à Shour ». On peut aussi traduire « qui est en face de l’Égypte » par « qui est à l’est de l’Égypte » ou « qui est devant l’Égypte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe נכה signifie frapper, abattre ou vaincre. « Frappa » conserve sa force concrète sans préciser à lui seul l’étendue de la victoire.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Le nom singulier de l’ancêtre désigne ici collectivement le peuple; garder « Amalec » reproduit cette forme hébraïque, avec une note explicative.
- source_word: מֵחֲוִילָה
  choice: depuis Havila
  rationale: La préposition מִן indique le point de départ de l’étendue géographique.
- source_word: בּוֹאֲךָ שׁוּר
  choice: jusqu’aux abords de Shour
  rationale: L’expression géographique idiomatique signifie littéralement « quand tu viens à Shour » et désigne l’approche ou la direction de ce lieu. Cette formulation est naturelle en français.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרָיִם
  choice: qui se trouve en face de l’Égypte
  rationale: עַל־פְּנֵי peut exprimer une position devant, vis-à-vis ou à l’est d’un lieu. « En face de » reste géographiquement neutre et préserve cette latitude.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: שׁוּר
  choice: Shour
  rationale: Translittération française usuelle du nom de lieu hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « depuis… jusqu’aux abords de… » rend naturellement l’étendue géographique tout en signalant dans la note l’idiome hébreu. Les noms propres suivent les formes françaises bibliques courantes.
