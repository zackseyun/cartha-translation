  to: 'Saül dit aux Qénites[a] : « Partez, retirez-vous, descendez d’entre les Amalécites, de peur que je ne vous emporte avec eux[b]. Car vous avez fait preuve de bonté[c] envers tous les Israélites[d] quand ils sont remontés d’Égypte. » Les Qénites se retirèrent donc d’entre les Amalécites.'
