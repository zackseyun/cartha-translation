  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: fr
  text: 'Saül dit aux Qénites[a] : « Partez, retirez-vous, descendez d’entre les Amalécites, de peur que je ne vous emporte avec eux[b]. Car vous avez fait preuve de bonté[c] envers tous les Israélites[d] quand ils sont remontés d’Égypte. » Les Qénites se retirèrent donc d’entre les Amalécites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici un gentilé au singulier, « le Qénite », employé collectivement ; les ordres qui suivent sont au pluriel.
    reason: ambiguïté grammaticale et collectif singulier
  - marker: b
    text: Ou « de peur que je ne vous détruise avec eux ». Le verbe hébreu peut évoquer le fait d’être emporté ou supprimé avec d’autres lors d’un jugement.
    reason: alternative lexicale
  - marker: c
    text: 'Ou « fidélité » ou « bienveillance loyale » ; hébreu : ḥésed.'
    reason: alternative lexicale
  - marker: d
    text: 'Littéralement : « tous les fils d’Israël », expression nationale courante désignant le peuple d’Israël.'
    reason: forme littérale
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: aux Qénites / Les Qénites
  rationale: L’hébreu emploie un gentilé singulier à valeur collective, tandis que les impératifs sont au pluriel. Le pluriel français exprime naturellement le groupe visé; une note conserve la forme singulière de la source.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: Partez, retirez-vous, descendez
  rationale: La succession des trois impératifs est maintenue. « Descendez » conserve le mouvement concret exprimé par ירד, sans préciser une topographie absente du texte.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: du milieu des Amalécites
  rationale: Cette formulation française rend clairement la séparation d’avec le peuple amalécite et assure la cohésion entre les deux occurrences.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: de peur que je ne vous fasse disparaître avec eux
  rationale: Dans ce contexte de jugement, אסף désigne vraisemblablement le fait d’emporter ou de faire disparaître avec les autres, plutôt qu’un simple rassemblement. Le pluriel français correspond au groupe qénite et aux Amalécites collectivement.
- source_word: חֶסֶד
  choice: bonté
  rationale: Ici, le mot désigne un bienfait loyal accordé à Israël. « Bonté » reste naturel et peu interprétatif; la note signale les nuances possibles de fidélité et de bienveillance loyale.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les Israélites
  rationale: Il s’agit d’une désignation nationale conventionnelle. « Tous les Israélites » est le rendu courant en français moderne; la note indique la forme littérale « tous les fils d’Israël ».
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: lorsqu’ils sont montés d’Égypte
  rationale: Le verbe עלה, « monter », est conservé afin de respecter l’image traditionnelle du départ d’Égypte.
- source_word: וַיָּסַר
  choice: se retirèrent
  rationale: Le même champ lexical que l’impératif סֻּרוּ est repris, montrant que les Qénites obéissent à l’ordre de Saül.
theological_decisions:
- issue: Portée relationnelle de חֶסֶד dans un contexte humain
  choice: bonté
  alternative: fidélité loyale; bienveillance
  rationale: Le contexte évoque une conduite favorable passée envers Israël, sans établir explicitement une alliance formelle avec les Qénites. « Bonté » préserve donc la portée morale du terme sans introduire une notion d’alliance plus précise que le texte.
- issue: Expression nationale כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les Israélites
  alternative: tous les fils d’Israël
  rationale: L’expression hébraïque désigne collectivement le peuple d’Israël. Le rendu idiomatique français ne modifie pas la portée référentielle, tandis que la note préserve la forme de l’hébreu.
translation_notes:
  register: Français international moderne, digne et narratif. Les impératifs successifs et l’image de la montée hors d’Égypte sont conservés, tandis que les collectifs hébreux sont rendus au pluriel pour une lecture française naturelle.
