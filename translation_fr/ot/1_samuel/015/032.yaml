  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַגִּ֤ישׁוּ אֵלַ/י֙ אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וַ/יֵּ֣לֶךְ אֵלָ֔י/ו אֲגַ֖ג מַעֲדַנֹּ֑ת וַ/יֹּ֣אמֶר אֲגָ֔ג אָכֵ֖ן סָ֥ר מַר הַ/מָּֽוֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: fr
  text: 'Alors Samuel dit : « Amenez-moi Agag, roi d’Amalec. » Agag s’avança vers lui d’un air assuré[a] et déclara : « Certainement, l’amertume de la mort s’est éloignée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu traduit par « d’un air assuré » est incertain. On peut aussi comprendre « avec précaution », « en tremblant » ou, selon une autre interprétation, « dans les chaînes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: Amenez-moi
  rationale: L’impératif hiphil pluriel de נגשׁ ordonne aux serviteurs de faire approcher Agag. « Amenez-moi » exprime naturellement en français le mouvement vers Samuel indiqué par אֵלַי.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agag, roi d’Amalec
  rationale: La tournure appositive française rend clairement le titre royal exprimé par la construction hébraïque.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: s’avança vers lui
  rationale: Le verbe signifie littéralement qu’Agag alla vers Samuel. « S’avança vers lui » convient au cadre narratif et évite l’ambiguïté française de « vint à lui ».
- source_word: מַעֲדַנֹּת
  choice: d’un air assuré
  rationale: Ce mot hébreu rare est de sens incertain. La déclaration qui suit peut suggérer qu’Agag croyait le danger passé, mais la traduction principale reste signalée par une note afin de ne pas masquer les autres interprétations anciennes et modernes.
- source_word: אָכֵן
  choice: Certainement
  rationale: L’adverbe introduit ici une affirmation appuyée; « certainement » conserve cette force sans préciser davantage si Agag parle avec soulagement, confiance ou résignation.
- source_word: סָר
  choice: s’est éloignée
  rationale: Le parfait qal de סור exprime l’idée de s’écarter ou de disparaître. « S’est éloignée » préserve l’image d’une menace qui se retire.
- source_word: מַר הַמָּוֶת
  choice: l’amertume de la mort
  rationale: Cette formulation proche de l’hébreu conserve la densité poétique et l’ambiguïté entre l’expérience amère de mourir et la menace de mort.
theological_decisions: []
