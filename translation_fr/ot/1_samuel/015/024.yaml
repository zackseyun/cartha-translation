    issue: Le second marqueur causal hébreu כִּי n’est pas rendu comme lien causal.
    rationale: Le texte source dit littéralement que Saül a transgressé l’ordre de Yahweh et les paroles de Samuel « parce qu’il a craint le peuple et écouté leur voix ». Le point dans le projet dissocie cette proposition de la justification précédente.
