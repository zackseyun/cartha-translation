base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: fr
  text: 'Alors Saül dit à Samuel : « J’ai péché, car j’ai enfreint l’ordre de Yahweh[a] et tes paroles, parce que j’ai eu peur du peuple et j’ai écouté leur voix[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la bouche de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je leur ai obéi » ; littéralement : « j’ai écouté leur voix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: Le parfait hébreu exprime ici l’aveu présent d’une faute accomplie. Le passé composé rend naturellement cette confession personnelle en français.
- source_word: עָבַרְתִּי
  choice: j’ai enfreint
  rationale: Le verbe signifie littéralement « passer au-delà » et, dans ce contexte, violer une instruction. « Enfreindre » conserve sa portée morale et normative dans un français actuel.
- source_word: פִּי יְהוָה
  choice: l’ordre de Yahweh
  rationale: Littéralement « la bouche de Yahweh », cette expression désigne ce que Yahweh a déclaré et ordonné. « L’ordre » explicite ici l’emploi idiomatique sans effacer la formulation littérale, signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: דְּבָרֶיךָ
  choice: tes paroles
  rationale: Le pluriel hébreu avec suffixe de deuxième personne masculine singulière est conservé et renvoie aux paroles adressées par Samuel.
- source_word: יָרֵאתִי
  choice: J’ai eu peur
  rationale: Cette expression idiomatique française rend directement la crainte invoquée par Saül.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme désigne collectivement les gens placés sous l’autorité de Saül; le contexte militaire ne justifie pas de le restreindre à « l’armée » ou aux « soldats ».
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: et j’ai écouté leur voix
  rationale: La formulation conserve l’image hébraïque de la voix et son contraste narratif avec l’écoute de la voix divine. La note indique le sens implicite d’obéissance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. La translittération préserve le nom propre et évite de lui substituer silencieusement un titre.
- issue: Sens de l’expression פִּי יְהוָה
  choice: l’ordre de Yahweh
  alternative: la bouche de Yahweh
  rationale: Dans ce récit, Saül reconnaît avoir violé une directive divine précise. Le rendu idiomatique communique ce sens, tandis que la note préserve la métaphore littérale.
- issue: Portée de l’écoute du peuple
  choice: j’ai écouté leur voix
  alternative: je leur ai obéi
  rationale: Le choix maintient la tension du récit entre la voix de Yahweh et celle du peuple, sans dissimuler que l’expression peut impliquer l’obéissance.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde la répétition causale de l’hébreu tout en employant des tournures françaises naturelles. « Enfreint » conserve la gravité de l’aveu sans recourir au plus soutenu « transgressé ».
