  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: fr
  text: Samuel se rendit à Rama, et Saül monta chez lui, à Guibéa de Saül.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Guibéa de Saül ». L’hébreu conserve le nom de lieu sous la forme « Guibéa de Saül ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: Dans cette forme narrative, הלך fait progresser le récit avec le sens simple d’aller. « Se rendit » est naturel en français et convient à une destination explicitement indiquée.
- source_word: הָרָמָתָה
  choice: à Rama
  rationale: Le hé directionnel attaché au nom de lieu indique un mouvement vers Rama, rendu naturellement en français par « à Rama ».
- source_word: עָלָה
  choice: monta
  rationale: עלה signifie couramment « monter » et peut conserver ici sa nuance topographique. Le français permet de la préserver sans lourdeur.
- source_word: בֵּיתוֹ
  choice: chez lui
  rationale: Littéralement « sa maison ». Dans la tournure « monter à sa maison », le français moderne préfère « monter chez lui », qui en transmet naturellement le sens.
- source_word: גִּבְעַת שָׁאוּל
  choice: Guibéa de Saül
  rationale: Cette forme garde le génitif du texte hébreu sans trancher entre une relation possessive et un nom de lieu établi.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Chez lui » évite la tournure peu idiomatique « à sa maison », tandis que « monta » et « Guibéa de Saül » préservent les traits significatifs de l’hébreu.
