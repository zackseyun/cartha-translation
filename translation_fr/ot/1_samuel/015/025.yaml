source:
  edition: WLC
  text: וְ/עַתָּ֕ה שָׂ֥א נָ֖א אֶת חַטָּאתִ֑/י וְ/שׁ֣וּב עִמִּ֔/י וְ/אֶֽשְׁתַּחֲוֶ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: fr
  text: Maintenant, je t’en prie, pardonne mon péché[a] et reviens avec moi, afin que je me prosterne devant Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « enlève (ou porte) mon péché » ; cette expression hébraïque signifie « pardonne mon péché ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin que j’adore Yahvé » ; le verbe hébreu désigne littéralement le fait de se courber ou de se prosterner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit la demande immédiate de Saül. Le וְ de liaison n’a pas besoin d’être rendu séparément en français naturel.
- source_word: שָׂא נָא
  choice: je t’en prie, pardonne
  rationale: Avec חַטָּאת, le verbe נָשָׂא, littéralement « lever, porter, emporter », forme une expression idiomatique signifiant pardonner le péché. « Je t’en prie » rend la particule de supplication נָא.
- source_word: אֶת חַטָּאתִי
  choice: mon péché
  rationale: Dans cette confession, חַטָּאת désigne clairement le péché de Saül, et non un sacrifice pour le péché.
- source_word: וְשׁוּב עִמִּי
  choice: et reviens avec moi
  rationale: שׁוּב exprime le retour; Saül demande à Samuel de l’accompagner de nouveau.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: afin que je me prosterne
  rationale: Le verbe désigne concrètement l’action de se courber ou de se prosterner, ici comme acte d’adoration. Après l’impératif, le וְ peut naturellement introduire le but recherché.
- source_word: לַיהוָה
  choice: devant Yahvé
  rationale: La préposition לְ marque ici celui devant qui Saül veut se prosterner. « Devant » est idiomatique en français, et le nom divin est rendu par « Yahvé ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » conserve ici le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de וְאֶשְׁתַּחֲוֶה
  choice: je me prosterne
  alternative: j’adore
  rationale: « Se prosterner » préserve le geste physique exprimé par le verbe hébreu sans nier sa portée cultuelle dans ce contexte.
translation_notes:
  register: Français international moderne, clair et digne. La supplication est rendue sans lourdeur, et le parallélisme des demandes est conservé.
