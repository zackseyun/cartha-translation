source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « J’ai pris en compte ce qu’Amalec a fait à Israël[a], la manière dont il s’est opposé à lui[b] sur le chemin, quand Israël montait d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Je me souviens de ce qu’Amalec a fait à Israël » ou, dans ce contexte de jugement, « Je vais demander compte de ce qu’Amalec a fait à Israël ». Le verbe hébreu peut exprimer l’idée de s’occuper de quelqu’un ou d’une affaire, de s’en souvenir activement, ou d’intervenir pour juger.'
    reason: lexical_alternative
  - marker: b
    text: '« Lui » désigne Israël, considéré comme un peuple au singulier. L’expression peut aussi se traduire : « il s’est dressé contre lui » et, peut-être, « il lui a tendu une embuscade ».'
    reason: lexical_and_referential_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule de messager prophétique concise et reconnue, digne sans être archaïque.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, tandis que « des armées » rend naturellement צְבָאוֹת sans limiter explicitement celles-ci aux forces humaines ou célestes.
- source_word: פָּקַדְתִּי
  choice: J’ai pris en compte
  rationale: Cette formulation conserve la nuance d’attention et de souvenir menant au jugement, sans faire signifier au verbe à lui seul que la sanction a déjà été exécutée.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: ce qu’Amalec a fait à Israël
  rationale: Rendu français direct qui conserve la portée générale de l’acte hostile.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: la manière dont il s’est dressé contre lui sur le chemin
  rationale: Rend l’opposition hostile exprimée par la tournure hébraïque sans imposer le sens tactique plus précis d’une embuscade.
- source_word: בַּעֲלֹתוֹ מִמִּצְרָיִם
  choice: quand Israël montait d’Égypte
  rationale: Conserve l’expression biblique de la montée hors d’Égypte; la répétition explicite d’Israël évite en français une chaîne de pronoms masculins ambigus.
theological_decisions:
- issue: Portée du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh des puissances
  rationale: « Des armées » demeure proche du lexème et garde ouverte la portée du titre divin, sans préciser qu’il s’agirait exclusivement d’armées terrestres ou célestes.
- issue: Rapport entre souvenir divin et jugement dans פָּקַדְתִּי
  choice: J’ai pris en compte
  alternative: Je me souviens de / Je vais punir
  rationale: Le contexte annonce un jugement fondé sur une faute passée. Le choix principal préserve le lien entre attention, souvenir actif et intervention judiciaire sans réduire le verbe à une seule nuance.
- issue: Référent du pronom singulier לוֹ
  choice: lui, renvoyant collectivement à Israël
  alternative: eux / Israël
  rationale: Le singulier hébreu est conservé là où le français reste intelligible, tout en explicitant ensuite Israël pour éviter une ambiguïté excessive.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe garde la solennité de la formule prophétique. « Montait d’Égypte » conserve l’image hébraïque usuelle; l’explicitation finale d’« Israël » améliore la lisibilité sans effacer le singulier collectif signalé par la note.
