  to: 'Yahweh t’a envoyé accomplir une mission et t’a dit : « Va, voue les pécheurs, les Amalécites[a], à la destruction[b], et combats-les jusqu’à les avoir exterminés. »'
  rationale: La révision remplace le démonstratif non marqué dans l’hébreu, emploie la formule française plus naturelle « vouer à la destruction » et rend explicitement l’action prescrite à Saül dans la proposition finale. Les ancres de notes restent attachées respectivement à l’identification appositionnelle d’Amalec et au terme technique de destruction.
