base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: fr
  text: 'Yahweh t’a envoyé accomplir une mission et t’a dit : « Va, voue les pécheurs, les Amalécites[a], à la destruction[b], et combats-les jusqu’à les avoir exterminés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les pécheurs, Amalec » ; « Amalec » est le nom collectif du peuple amalécite et identifie ici ceux qui sont appelés « les pécheurs ».'
    reason: Précision sur l’apposition et sur le collectif hébreu.
  - marker: b
    text: 'Ou : « extermine-les complètement ». Le verbe hébreu désigne le fait de vouer quelque chose à la destruction en le plaçant sous l’interdit.'
    reason: Explication du terme technique חרם et de son autre traduction possible.
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ בְּדָרֶךְ
  choice: t’a envoyé accomplir une mission
  rationale: Après le verbe « envoyer », בְּדָרֶךְ désigne ici la voie ou la tâche assignée à Saül, et non simplement un déplacement sur une route. Cette formulation française restitue naturellement l’idée de mandat.
- source_word: לֵךְ
  choice: Va
  rationale: Rend directement et naturellement l’impératif hébreu.
- source_word: וְהַחֲרַמְתָּה
  choice: voue … à l’anéantissement
  rationale: Le hiphil de חרם désigne ici la mise à part sous l’interdit en vue d’une destruction totale. Cette expression conserve la dimension de consécration judiciaire mieux que le seul verbe « détruire ».
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: ces pécheurs, les Amalécites
  rationale: Le texte qualifie moralement le groupe de « pécheurs », puis l’identifie par le collectif « Amalec ». En français courant, « les Amalécites » rend clairement le peuple visé, tandis que l’apposition et son emphase sont conservées.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: combats-les
  rationale: Le suffixe hébreu est singulier parce qu’il reprend le collectif « Amalec ». Le pluriel français s’accorde naturellement avec « les Amalécites » sans changer le référent.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: jusqu’à ce qu’ils soient exterminés
  rationale: La tournure exprime l’achèvement total de leur destruction. Le passif français conserve la focalisation sur l’issue sans préciser davantage que l’hébreu la construction de l’agent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » présente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée cultuelle et judiciaire de חרם
  choice: vouer à l’anéantissement
  alternative: exterminer entièrement
  rationale: Le choix principal conserve à la fois la mise sous l’interdit et sa conséquence destructrice, sans réduire le terme à une simple action militaire.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle faite à Saül. La formulation garde la qualification morale explicite du texte et distingue le terme technique חרם de l’expression finale d’extermination.
