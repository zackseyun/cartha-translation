  - severity: low
    issue: Passif final
    rationale: « Jusqu’à ce qu’ils soient exterminés » exprime l’issue, mais la construction hébraïque, dans l’ordre adressé à Saül, implique son action contre Amalec. « Jusqu’à les avoir exterminés » le restitue plus directement.
  - severity: low
    issue: « Anéantissement »
    rationale: Le terme est possible, mais « destruction » est le correspondant français plus usuel et plus transparent de la formule technique « vouer à la destruction ».
