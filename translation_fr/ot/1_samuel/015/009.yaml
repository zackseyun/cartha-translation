  text: וַ/יַּחְמֹל֩ שָׁא֨וּל וְ/הָ/עָ֜ם עַל אֲגָ֗ג וְ/עַל מֵיטַ֣ב הַ/צֹּאן֩ וְ/הַ/בָּקָ֨ר וְ/הַ/מִּשְׁנִ֤ים וְ/עַל הַ/כָּרִים֙ וְ/עַל כָּל הַ/טּ֔וֹב וְ/לֹ֥א אָב֖וּ הַחֲרִימָ֑/ם וְ/כָל הַ/מְּלָאכָ֛ה נְמִבְזָ֥ה וְ/נָמֵ֖ס אֹתָ֥/הּ הֶחֱרִֽימוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: fr
  text: Mais Saül et le peuple épargnèrent Agag, ainsi que le meilleur du petit et du gros bétail, les bêtes de la seconde portée[a], les béliers et tout ce qui était bon ; ils ne voulurent pas les vouer à la destruction[b]. En revanche, ils vouèrent à la destruction tout ce qui était méprisé et sans valeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bêtes grasses ». Le sens du terme hébreu מִשְׁנִים est incertain ; il paraît lié à l’idée de « second » ou de « double ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne ici le fait de placer des êtres ou des biens sous l’interdit en vue de leur destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: épargnèrent
  rationale: Dans ce contexte, le verbe désigne le fait de ne pas exécuter la destruction ordonnée ; « épargner » exprime naturellement ce résultat concret sans réduire le terme à un sentiment intérieur.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: le meilleur du petit et du gros bétail
  rationale: « Petit et gros bétail » rend avec précision les deux catégories collectives צֹאן et בָּקָר, tandis que « le meilleur » conserve la valeur superlative de מֵיטַב.
- source_word: הַמִּשְׁנִים
  choice: les bêtes de la seconde portée
  rationale: Le terme hébreu rare et difficile est lié à l’idée de « second » ou de « double ». Cette formulation garde ce lien visible sans introduire avec certitude l’interprétation traditionnelle « bêtes grasses » ; l’incertitude est signalée en note.
- source_word: הַכָּרִים
  choice: les béliers
  rationale: Le nom désigne couramment des béliers ou de jeunes mâles du troupeau ; « béliers » convient à l’inventaire du bétail et évite de généraliser en « agneaux ».
- source_word: לֹא אָבוּ
  choice: ils ne voulurent pas
  rationale: Le verbe exprime le refus ou l’absence de volonté, et présente donc leur conduite comme délibérée plutôt que comme une incapacité.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: les vouer à la destruction / vouèrent à la destruction
  rationale: 'Cette expression conserve la portée technique de חרם : placer des êtres ou des biens sous l’interdit en vue de leur destruction, et non simplement les détruire dans un sens ordinaire.'
- source_word: כָל הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: tout ce qui était méprisé et sans valeur
  rationale: Dans le contexte du butin, מְלָאכָה a une portée collective. La tournure française rend les deux qualifications évaluatives sans surdéterminer la nature exacte des biens.
theological_decisions:
- issue: Rendu de חרם dans le contexte de la guerre sacrée
  choice: vouer à la destruction
  alternative: frapper d’interdit ; exterminer
  rationale: « Vouer à la destruction » maintient à la fois le caractère consacré ou placé sous interdit et l’issue destructrice, sans atténuer la gravité du texte ni réduire le terme à une simple action militaire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La coordination et le point-virgule conservent le contraste entre ce qui fut épargné et ce qui fut détruit. Les deux emplois du terme technique חרם sont traduits de façon cohérente.
