  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: fr
  text: 'Samuel dit à Saül : « Je ne retournerai pas avec toi, car tu as rejeté la parole de Yahweh, et Yahweh t’a rejeté en tant que roi sur Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Samuel dit
  rationale: Le wayyiqtol fait avancer le récit. Le passé simple convient au registre narratif français et évite un « et » initial peu naturel ici.
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: Je ne retournerai pas avec toi
  rationale: שׁוב signifie ici « retourner », et עִם exprime simplement l’accompagnement.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du refus de Samuel. « Car » est naturel dans une parole solennelle sans alourdir la phrase.
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: tu as rejeté / t’a rejeté
  rationale: La répétition de « rejeter » conserve la reprise intentionnelle de la même racine מאס et la réciprocité entre l’acte de Saül et la réponse de Yahweh.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: דָּבָר désigne ici la parole communiquée, qui a valeur d’ordre. « Parole » préserve l’expression biblique sans réduire explicitement le terme à « commandement ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: מִהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: tu ne seras plus roi sur Israël
  rationale: Cette formulation idiomatique exprime la destitution indiquée par מִן avec l’infinitif de היה, tout en conservant « sur Israël » pour עַל יִשְׂרָאֵל.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie le nom propre divin; « Yahweh » le représente directement sans lui substituer un titre.
- issue: Réciprocité exprimée par la répétition de מאס
  choice: Employer « rejeter » dans les deux propositions
  alternative: Varier avec « mépriser », « repousser » ou « écarter »
  rationale: La répétition lexicale souligne que Saül a rejeté la parole de Yahweh et que Yahweh l’a rejeté de la royauté. La conserver évite d’atténuer ce parallélisme théologique.
- issue: Portée de מִהְיוֹת מֶלֶךְ
  choice: tu ne seras plus roi
  alternative: il t’a rejeté pour que tu ne sois plus roi / il t’a rejeté de la fonction de roi
  rationale: Le tour hébreu exprime le retrait de Saül de son statut royal. La formulation retenue est naturelle en français et ne précise pas artificiellement le calendrier de sa destitution.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au dialogue direct entre Samuel et Saül. Le passé simple maintient un registre narratif biblique courant sans archaïsme marqué.
