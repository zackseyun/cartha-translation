  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמוּאֵ֖ל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/010.yaml
  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: fr
  text: 'Alors, la parole de Yahweh[a] fut adressée à Samuel :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors … fut adressée
  rationale: La forme narrative introduit un nouveau développement. En français moderne, « Alors » exprime naturellement la succession, tandis que la tournure complète rend idiomatiquement la venue de la parole.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » est la traduction française consacrée et transparente, qui conserve le lien avec la révélation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole divine; « à » convient naturellement à la locution française « être adressé à ».
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Le nom propre est rendu selon sa forme française usuelle.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit le contenu du discours. En français contemporain, les deux-points remplissent cette fonction plus naturellement que le littéral « en disant » lorsque les paroles suivent immédiatement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve le caractère de nom propre, tandis qu’une note signale le rendu traditionnel sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et clair. La formule « la parole de Yahweh fut adressée à Samuel » restitue l’expression prophétique dans un français naturel; les deux-points évitent le calque pesant « en disant ».
