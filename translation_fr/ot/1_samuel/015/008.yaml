  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: fr
  text: Il captura vivant Agag, roi d’Amalec, et voua tout le peuple à la destruction[a] par le tranchant de l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « extermina entièrement tout le peuple » ; le verbe hébreu désigne le fait de vouer quelque chose à la destruction dans le cadre de l’interdit.
    reason: Variante lexicale pour le terme חרם.
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: captura
  rationale: Le verbe exprime ici l’action de s’emparer de quelqu’un dans un contexte militaire ; « captura » est précis et naturel.
- source_word: אֲגַג
  choice: Agag
  rationale: Le nom propre est translittéré selon son usage français établi.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: roi d’Amalec
  rationale: Cette formulation rend directement la relation construite en hébreu et reste naturelle en français.
- source_word: חָי
  choice: vivant
  rationale: L’adjectif indique qu’Agag fut capturé en vie, contrairement au reste du peuple.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: « Peuple » conserve l’étendue du terme hébreu sans le limiter arbitrairement aux soldats ou à la population civile.
- source_word: הֶחֱרִים
  choice: voua … à la destruction
  rationale: Le hiphil de חרם désigne la mise sous interdit en vue de la destruction. Cette traduction conserve la portée particulière du terme sans employer le vocabulaire technique et moins accessible de « l’interdit ».
- source_word: לְפִי חָרֶב
  choice: par le tranchant de l’épée
  rationale: L’expression hébraïque signifie littéralement « à la bouche de l’épée ». La formulation retenue garde l’image tout en étant idiomatique en français.
theological_decisions:
- issue: Rendu du vocabulaire de guerre associé à חרם
  choice: voua tout le peuple à la destruction
  alternative: extermina entièrement tout le peuple
  rationale: Le choix principal préserve la notion de consécration irrévocable à la destruction attachée à חרם, plutôt que de réduire le terme au seul acte de tuer. La variante explicite le résultat concret et courant du verbe sans imposer cette simplification au texte principal.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure proche de l’hébreu tout en étant fluide ; « par le tranchant de l’épée » conserve son image traditionnelle sans archaïsme excessif.
