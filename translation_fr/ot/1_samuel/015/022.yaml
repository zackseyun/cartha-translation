revisions:
- from: 'Samuel dit : « L’Éternel prend-il autant plaisir aux holocaustes et aux sacrifices qu’à l’obéissance à sa voix ? Écoutez : obéir vaut mieux qu’un sacrifice, et prêter attention vaut mieux que la graisse des béliers. »'
  to: 'Samuel dit : « L’Éternel prend-il autant plaisir aux holocaustes et aux sacrifices qu’à obéir à la voix de l’Éternel ? Voici : obéir vaut mieux que le sacrifice, et être attentif vaut mieux que la graisse des béliers. »'
  rationale: La révision remplace l’impératif interprétatif « Écoutez » par « Voici », plus proche de הִנֵּה, et rétablit explicitement la seconde occurrence du nom divin. Le reste de la traduction conserve les choix lexicaux solides du projet et le parallélisme du verset.
