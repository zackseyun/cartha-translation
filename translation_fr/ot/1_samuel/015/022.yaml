base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: fr
  text: 'Samuel dit : « L’Éternel prend-il autant plaisir aux holocaustes et aux sacrifices qu’à obéir à la voix de l’Éternel ? Voici : obéir vaut mieux que le sacrifice, et être attentif vaut mieux que la graisse des béliers. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: prend-il autant plaisir
  rationale: Le nom חֵפֶץ exprime ici le plaisir ou l’agrément. Avec la comparaison introduite par כִּ, cette formulation française rend naturellement la question rhétorique sans suggérer que les sacrifices n’ont jamais été agréés.
- source_word: עֹלוֹת וּזְבָחִים
  choice: holocaustes et sacrifices
  rationale: « Holocaustes » désigne les offrandes entièrement consumées, tandis que « sacrifices » conserve la catégorie plus générale du second terme.
- source_word: כִּשְׁמֹעַ בְּקוֹל יְהוָה
  choice: qu’à l’obéissance à sa voix
  rationale: L’expression idiomatique « écouter la voix » implique ici l’obéissance. Le possessif évite une répétition lourde tout en gardant clairement l’Éternel comme référent.
- source_word: הִנֵּה
  choice: Écoutez
  rationale: L’interjection attire fortement l’attention sur la conclusion. « Écoutez » est idiomatique en français et fait écho, sans confusion, au thème de l’écoute obéissante.
- source_word: שְׁמֹעַ
  choice: obéir
  rationale: Dans ce contexte de désobéissance au commandement divin, le sens effectif est l’obéissance, et non la simple perception auditive.
- source_word: לְהַקְשִׁיב
  choice: prêter attention
  rationale: Le terme signifie écouter attentivement, être réceptif. Cette traduction préserve le parallélisme avec « obéir » sans rendre les deux membres identiques.
- source_word: חֵלֶב אֵילִים
  choice: la graisse des béliers
  rationale: Traduction concrète de la partie sacrificielle réputée précieuse et offerte à Dieu.
theological_decisions:
- issue: Rapport entre obéissance et sacrifice
  choice: La comparaison affirme la supériorité de l’obéissance sans nier en soi la légitimité des sacrifices prescrits.
  alternative: Formuler la phrase comme un rejet absolu de tout sacrifice.
  rationale: Le comparatif מִן (« mieux que ») et la question rhétorique portent sur les priorités dans le contexte de la désobéissance de Saül, non sur l’abolition générale du culte sacrificiel.
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: Yahvé
  rationale: « L’Éternel » est une convention française largement reconnue pour le tétragramme et convient au registre biblique digne visé.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du parallélisme hébreu, avec une formulation naturelle à l’oral comme à l’écrit. Aucun marqueur de note n’est requis.
