base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: fr
  text: 'Il dit : « J’ai péché. Maintenant, je t’en prie, honore-moi devant les anciens de mon peuple et devant Israël. Reviens avec moi, afin que je me prosterne[a] devant Yahvé, ton Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et je me prosternerai devant Yahvé, ton Dieu ». La forme hébraïque peut exprimer soit le but de la demande précédente (« afin que »), soit une simple continuation (« et je… »).'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: Le qal accompli à la première personne exprime l’aveu d’une faute commise dont la portée demeure immédiate ; le passé composé est naturel en français.
- source_word: כַּבְּדֵנִי נָא
  choice: je t’en prie, honore-moi
  rationale: Le piel impératif demande à Samuel d’accorder à Saül un honneur public. « Je t’en prie » rend la particule נָא sans affaiblir la demande.
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: devant les anciens de mon peuple et devant Israël
  rationale: « Devant » exprime la visibilité publique, et la répétition conserve l’insistance de l’hébreu. Aucun « tout » n’est ajouté à Israël.
- source_word: וְשׁוּב עִמִּי
  choice: Reviens avec moi
  rationale: שׁוב désigne ici le retour de Samuel en compagnie de Saül ; l’impératif français convient au prolongement de la requête.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: afin que je me prosterne
  rationale: Le verbe désigne l’inclination ou la prosternation cultuelle. Cette formulation préserve le geste concret et lit la coordination comme exprimant le but, tout en signalant l’autre analyse en note.
- source_word: לַיהוָה
  choice: devant Yahvé
  rationale: La préposition marque la personne devant qui Saül se prosterne. « Yahvé » rend directement le nom divin יהוה en français courant.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne du singulier est conservé, maintenant la tension narrative créée par la manière dont Saül s’adresse à Samuel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » préserve le caractère de nom propre et correspond à la forme française traditionnelle, sans remplacer le nom par un titre.
- issue: Parole de Saül אֱלֹהֶיךָ
  choice: ton Dieu
  alternative: notre Dieu
  rationale: L’hébreu dit explicitement « ton Dieu ». Le conserver évite d’atténuer la tension narrative et théologique du propos de Saül.
- issue: Valeur de וְהִשְׁתַּחֲוֵיתִי
  choice: afin que je me prosterne
  alternative: et je me prosternerai
  rationale: Après la demande « Reviens avec moi », la coordination peut naturellement indiquer le but. La forme hébraïque permet aussi une simple continuation ; cette ambiguïté est conservée par une note.
translation_notes:
  register: Français international moderne, naturel et digne. La demande de Saül reste directe et socialement marquée ; la répétition de « devant » ainsi que « mon peuple » et « ton Dieu » sont maintenues.
