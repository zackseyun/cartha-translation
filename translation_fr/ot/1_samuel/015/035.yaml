  source_fidelity: 'L’ensemble rend fidèlement l’hébreu : l’idiome négatif « ne revit plus », le possessif ambigu de « sa mort », la répétition de « Samuel », ainsi que le regret attribué à Yahweh sont préservés. Toutefois, « prit le deuil » suggère plus précisément l’entrée dans un deuil ritualisé, souvent consécutif à un décès, nuance que l’hébreu n’impose pas ici puisque Saül est encore vivant.'
