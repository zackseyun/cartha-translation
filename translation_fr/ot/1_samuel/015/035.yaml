  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: fr
  text: Samuel ne revit plus Saül jusqu’au jour de sa mort, car Samuel était en deuil à cause de Saül. Et Yahweh regretta[a] d’avoir établi Saül roi sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éprouva de la peine ». Selon le contexte, le verbe hébreu peut aussi signifier « revenir sur une décision ». Ici, il exprime le regret ou la peine de Yahweh d’avoir établi Saül roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: ne revit plus
  rationale: Avec la négation, יָסַף suivi de l’infinitif signifie ne plus refaire une action. « Ne revit plus » rend naturellement cet idiome en français.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: revit Saül
  rationale: Le verbe ראה signifie simplement « voir ». « Revoir Saül » conserve ce sens tout en évoquant naturellement une nouvelle rencontre personnelle.
- source_word: עַד יוֹם מוֹתוֹ
  choice: jusqu’au jour de sa mort
  rationale: Cette formulation garde la construction solennelle de l’hébreu et ne précise pas artificiellement le référent du possessif.
- source_word: הִתְאַבֵּל
  choice: prit le deuil
  rationale: Le hitpael de אבל désigne l’action de mener deuil. « Prit le deuil » est naturel, digne et plus précis ici qu’un simple « s’affligea ».
- source_word: אֶל שָׁאוּל
  choice: pour Saül
  rationale: Après une expression de deuil, « pour » rend idiomatiquement l’orientation exprimée par אֶל et indique que Saül est l’objet du deuil de Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: נִחָם
  choice: regretta
  rationale: Dans la proposition « d’avoir établi Saül roi », le verbe exprime ici le regret ou la peine plutôt que le renoncement à une menace. « Regretta » conserve la force personnelle et la tension du texte.
- source_word: הִמְלִיךְ
  choice: avoir établi Saül roi
  rationale: Le hifil de מלך signifie faire de quelqu’un un roi. « Établir Saül roi » est une tournure française claire et fidèle.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: « Roi sur Israël » exprime normalement en français l’autorité royale et correspond à la préposition עַל.
theological_decisions:
- issue: Le langage attribuant à Dieu le regret dans נִחָם
  choice: Yahweh regretta
  alternative: Yahweh en éprouva de la peine ; Yahweh revint sur sa décision
  rationale: Le verset attribue explicitement נִחָם à Yahweh. « Regretta » préserve ce langage affectif et la tension théologique du passage, sans le réduire à une simple modification administrative ni expliquer à la place du texte comment ce regret s’accorde avec la constance divine.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition du nom « Samuel » est conservée comme en hébreu. Le possessif de « sa mort » reste volontairement non explicité afin de préserver la formulation et l’ambiguïté grammaticale du texte source. Le marqueur de note est placé après « regretta », le terme auquel la note se rapporte.
