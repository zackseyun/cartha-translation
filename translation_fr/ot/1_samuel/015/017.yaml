  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: fr
  text: 'Samuel dit : « Même si tu étais petit à tes propres yeux[a], n’étais-tu pas le chef des tribus d’Israël ? Et Yahweh t’oignit comme roi d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Alors que tu étais petit à tes propres yeux. » La construction hébraïque peut avoir une nuance légèrement différente ; elle rappelle que Saül se considérait comme peu important.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: n’étais-tu pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative ; cette tournure française en restitue naturellement la force dans un contexte passé.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: Même si tu étais petit à tes propres yeux
  rationale: Préserve la construction potentiellement concessive et l’image hébraïque de la faible estime que Saül avait de sa propre importance, sans en fixer excessivement la nuance.
- source_word: קָטֹן
  choice: petit
  rationale: Rend directement la métaphore hébraïque, qui peut évoquer une faible importance ou une humble perception de soi.
- source_word: בְּעֵינֶיךָ
  choice: à tes propres yeux
  rationale: Expression française naturelle correspondant à l’idiome hébraïque de l’estimation personnelle.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: le chef des tribus d’Israël
  rationale: « Chef » conserve l’idée de tête et d’autorité tout en étant plus naturel en français que le calque « la tête des tribus ».
- source_word: וַיִּמְשָׁחֲךָ
  choice: t’a consacré par l’onction
  rationale: Explicite naturellement en français l’acte royal concret de l’onction sans l’aplatir en simple nomination.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: comme roi sur Israël
  rationale: Exprime clairement le statut résultant de l’onction et conserve la relation d’autorité indiquée par עַל.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre traditionnel.
- issue: Portée de l’onction royale
  choice: consacré par l’onction comme roi
  alternative: établi roi
  rationale: Le verbe משׁח désigne spécifiquement l’onction ; conserver cet acte évite d’en réduire la portée rituelle et théologique à une simple nomination.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image « petit à tes propres yeux », la question rhétorique et la coordination finale de l’hébreu.
