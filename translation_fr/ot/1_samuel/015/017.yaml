  - severity: low
    issue: La note propose « Bien que... » comme alternative à « Même si... », sans présenter l’autre nuance principale possible.
    rationale: La construction avec אִם peut être comprise avec une coloration concessive ou temporelle/contextuelle. Une note mentionnant « Alors que » informe mieux sans surdéterminer le texte.
