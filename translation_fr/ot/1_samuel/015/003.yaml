source:
  edition: WLC
  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: fr
  text: Maintenant, va frapper Amalec[b] et vouez[d] à la destruction[a] tout ce qui lui appartient. Ne l’épargne pas, mais mets à mort aussi bien l’homme que la femme, l’enfant que le nourrisson, le bœuf que la bête du petit bétail[c], le chameau que l’âne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détruire entièrement » ou « mettre sous l’interdit ». Le verbe hébreu désigne le fait de vouer quelque chose irrévocablement à la destruction sous le jugement divin.
    reason: lexical_alternative
  - marker: b
    text: Ici, « Amalec » désigne collectivement le peuple amalécite ; les pronoms singuliers qui suivent ont le même référent.
    reason: referent_clarification
  - marker: c
    text: Le terme hébreu peut désigner une brebis, un mouton ou une chèvre, et plus largement une bête du petit bétail.
    reason: lexical_range
  - marker: d
    text: L’hébreu emploie ici un pluriel (« vous vouerez »), puis revient au singulier. La raison de cette alternance est incertaine.
    reason: grammatical_form
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marqueur temporel et discursif qui introduit directement la série d’ordres.
- source_word: לֵךְ וְהִכִּיתָה
  choice: va frapper
  rationale: Rend l’impératif de הלך et le verbe נכה de manière directe et naturelle, sans archaïsme.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Conserve le nom propre singulier du texte hébreu, employé collectivement pour le peuple amalécite.
- source_word: וְהַחֲרַמְתֶּם
  choice: vous vouerez à la destruction
  rationale: Préserve la dimension de mise à part irrévocable en vue de la destruction attachée au ḥerem, tout en respectant le passage soudain au pluriel dans l’hébreu.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartient
  rationale: Formulation française idiomatique qui conserve la portée globale et le référent collectif singulier.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: Ne l’épargne pas
  rationale: Dans ce contexte de jugement guerrier, « épargner » exprime clairement le sens contextuel de חמל.
- source_word: וְהֵמַתָּה
  choice: fais mourir
  rationale: Rend la forme causative du verbe מות avec gravité et sans recourir à une tournure archaïque.
- source_word: מֵאִישׁ עַד אִשָּׁה
  choice: aussi bien l’homme que la femme
  rationale: Exprime naturellement en français la totalité indiquée par la construction hébraïque « de… jusqu’à… », tout en conservant les deux catégories nommées.
- source_word: מֵעֹלֵל וְעַד יוֹנֵק
  choice: l’enfant que le nourrisson
  rationale: Maintient la distinction entre le jeune enfant et celui qui est encore allaité.
- source_word: מִשּׁוֹר וְעַד שֶׂה
  choice: le bœuf que la bête du petit bétail
  rationale: « Bœuf » rend le terme générique pour un bovin, tandis que « bête du petit bétail » laisse ouverte l’inclusion du mouton ou de la chèvre.
- source_word: מִגָּמָל וְעַד חֲמוֹר
  choice: le chameau que l’âne
  rationale: Conserve les catégories animales singulières et l’effet totalisant de la liste.
theological_decisions:
- issue: Langage de guerre associé à חרם
  choice: vouer à la destruction
  alternative: exterminer entièrement ; frapper d’interdit
  rationale: Le verbe possède une portée cultuelle et judiciaire qui dépasse l’idée d’une simple destruction militaire. La formulation choisie conserve cette charge sans ajouter d’explication doctrinale au corps du texte.
- issue: Singulier collectif « Amalec » et pronoms singuliers
  choice: Amalec… lui… l’
  alternative: les Amalécites… leur… les
  rationale: L’hébreu présente Amalec comme une entité collective au singulier. La traduction en conserve la forme, avec une note pour éviter toute confusion.
- issue: Alternance entre ordre singulier et ordre pluriel
  choice: va frapper… vous vouerez… Ne l’épargne pas… fais mourir
  alternative: va frapper… voue… Ne l’épargne pas… fais mourir
  rationale: Le texte hébreu passe réellement du singulier au pluriel pour וְהַחֲרַמְתֶּם, puis revient au singulier. La traduction conserve cette irrégularité significative au lieu de l’harmoniser silencieusement.
- issue: Paires humaines explicitement sexuées
  choice: l’homme… la femme
  alternative: les êtres humains
  rationale: Le texte nomme expressément les deux catégories ; une généralisation neutre effacerait la forme et la portée totalisante de la paire.
translation_notes:
  register: Français international moderne, direct et solennel. La syntaxe « aussi bien… que… » rend les mérismes hébreux sans la raideur de répétitions telles que « de l’homme à la femme ». L’alternance singulier-pluriel du texte source est volontairement maintenue.
