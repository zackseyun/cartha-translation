    rationale: Dans une série d’ordres, cette forme française ne rend pas directement la valeur injonctive de l’hébreu. « Vouez » conserve l’impératif pluriel attesté par la forme source.
  - severity: low
    issue: L’alternance de personne n’est pas documentée
    rationale: Le passage abrupt du singulier au pluriel, puis au singulier, pourrait paraître être une faute de français. Une note doit indiquer que cette alternance reflète la forme hébraïque et que son explication demeure incertaine.
  - severity: low
