  verdict: revise
  source_fidelity: La traduction rend correctement l’ordre, le singulier collectif « Amalec », la terminologie technique de חרם et la liste totalisante. Toutefois, « vous vouerez » au futur indicatif affaiblit la force impérative de la séquence. La forme hébraïque présente bien une alternance inhabituelle au pluriel à cet endroit; elle doit être rendue par un impératif pluriel et signalée sans en surinterpréter la raison.
  naturalness: Le texte est globalement clair, direct et de registre solennel. « Mets à mort » est plus idiomatique et plus précis dans ce contexte que « fais mourir ». L’alternance volontaire « va … vouez … ne l’épargne pas » reste inhabituelle en français, mais une note brève la rend intelligible et permet de conserver le phénomène du texte source.
