  yaml_path: translation/ot/1_samuel/015/005.yaml
  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
translation:
  language: fr
  text: Saül arriva à la ville d’Amalec et se mit en embuscade dans l’oued[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dressa une embuscade dans l’oued ». Le verbe hébreu est difficile; on l’a aussi compris au sens de « combattit » ou « entra en lutte », mais le contexte favorise l’idée d’une embuscade.
    reason: lexical_alternative
  - marker: b
    text: Un oued est le lit d’un cours d’eau, parfois encaissé, qui peut rester sec en dehors de la saison des pluies.
    reason: cultural_note
  - marker: c
    text: Ou « la ville des Amalécites ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le verbe בוא peut signifier « venir », « aller », « entrer » ou « arriver » selon le point de vue. Ici, « arriva à » exprime naturellement en français le déplacement jusqu’à l’objectif.
- source_word: עַד
  choice: à
  rationale: Avec un verbe de mouvement, עַד marque ici le terme atteint; la tournure française « arriver à » en rend idiomatiquement le sens.
- source_word: עִיר עֲמָלֵק
  choice: la ville d’Amalec
  rationale: Cette traduction suit directement la construction hébraïque. Puisque עֲמָלֵק peut aussi désigner le peuple amalécite, l’autre compréhension est signalée en note.
- source_word: וַיָּרֶב
  choice: se mit en embuscade
  rationale: La forme hébraïque est difficile. Le contexte militaire favorise l’idée d’une embuscade ou d’une position d’attente, sans que cette interprétation soit certaine; les autres sens possibles sont conservés en note.
- source_word: בַּנָּחַל
  choice: dans l’oued
  rationale: נחל désigne souvent un cours d’eau saisonnier et son lit encaissé. « Oued » est précis dans ce cadre géographique et évite de suggérer un ruisseau constamment alimenté.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Se mit en embuscade » rend clairement la nuance militaire tout en laissant la difficulté lexicale explicite dans la note. « Oued » est un terme géographique courant et précis, accompagné d’une brève explication.
