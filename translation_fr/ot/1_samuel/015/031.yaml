source:
  edition: WLC
  text: וַ/יָּ֥שָׁב שְׁמוּאֵ֖ל אַחֲרֵ֣י שָׁא֑וּל וַ/יִּשְׁתַּ֥חוּ שָׁא֖וּל לַֽ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: fr
  text: Samuel revint donc à la suite de Saül, et Saül se prosterna devant le SEIGNEUR.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « adora le SEIGNEUR ». Le verbe hébreu peut désigner le fait de se prosterner ou celui d’adorer, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime ici le retour de Samuel après son refus initial de revenir avec Saül. « Revint » est naturel en français et conserve l’idée de retournement dans le récit.
- source_word: אַחֲרֵי
  choice: à la suite de
  rationale: La préposition signifie littéralement « après, derrière ». « À la suite de » conserve cette relation tout en indiquant naturellement que Samuel accompagne Saül sans préciser davantage le mouvement.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Le verbe שׁחה désigne le fait de s’incliner profondément ou de se prosterner et peut, selon le contexte, exprimer l’adoration. « Se prosterna » maintient au premier plan le geste corporel sans exclure sa portée cultuelle.
- source_word: לַיהוָה
  choice: devant le SEIGNEUR
  rationale: La préposition ל marque ici celui vers qui la prosternation est dirigée. « Devant » est l’expression française idiomatique avec « se prosterner ». Le tétragramme יהוה est rendu par « le SEIGNEUR ».
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et courante du nom propre, avec tréma pour distinguer les voyelles.
theological_decisions:
- issue: Faut-il rendre וַיִּשְׁתַּחוּ par un acte explicitement cultuel (« adora ») ou par le geste corporel (« se prosterna ») ?
  choice: « se prosterna » dans le texte principal
  alternative: « adora le SEIGNEUR »
  rationale: Le verbe hébreu peut désigner soit une prosternation, soit l’adoration exprimée par cette posture. Comme le SEIGNEUR est explicitement celui vers qui le geste est dirigé, la dimension cultuelle est présente, mais « se prosterna » préserve mieux l’image concrète et l’étendue sémantique du verbe.
translation_notes:
  register: Français international moderne, sobre et digne. « À la suite de » évite l’ambiguïté possible de « après Saül » en français, tandis que « se prosterna devant » est idiomatique et conserve le geste concret du texte hébreu.
