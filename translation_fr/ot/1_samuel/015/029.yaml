id: 1SA.15.29
reference: 1 Samuel 15:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: fr
  text: De plus, la Gloire d’Israël[a] ne mentira pas et ne reviendra pas sur sa décision, car il n’est pas un être humain qui revient sur sa décision.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Éternel d’Israël », « la Force d’Israël » ou « la Victoire d’Israël ». Le titre hébreu possède un large champ de sens.
    reason: lexical_alternative
  - marker: b
    text: Ou « car il n’est pas un être humain qui change d’avis », « qui éprouve du regret » ou « qui cède ». Le même verbe hébreu est employé deux fois dans ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Rend naturellement la conjonction assortie d’une nuance additive et emphatique, en continuité avec la réprimande précédente.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: la Gloire d’Israël
  rationale: Conserve la forme solennelle d’un titre divin sans réduire le large champ sémantique de נֵצַח à la seule éternité, à la force ou à la victoire.
- source_word: יְשַׁקֵּר
  choice: ne mentira pas
  rationale: Rendu direct du piel de שׁקר, exprimant que Dieu ne parle ni n’agit faussement.
- source_word: וְלֹא יִנָּחֵם
  choice: et ne reviendra pas sur sa décision
  rationale: Dans le contexte du rejet de Saül, cette formulation française actuelle exprime la non-révocation de la décision sans suggérer un simple regret affectif.
- source_word: כִּי
  choice: car
  rationale: Introduit avec concision la raison de l’affirmation précédente.
- source_word: לֹא אָדָם הוּא
  choice: il n’est pas un être humain
  rationale: Exprime en français inclusif et naturel le contraste entre Dieu et l’humanité en général, plutôt qu’avec un homme de sexe masculin.
- source_word: לְהִנָּחֵם
  choice: qui revient sur sa décision
  rationale: Reprend le même sens contextuel de נחם et complète naturellement en français la proposition comparative.
theological_decisions:
- issue: Langage relatif à la constance divine
  choice: ne reviendra pas sur sa décision
  alternative: ne changera pas d’avis / ne se repentira pas / ne cédera pas
  rationale: Le verset affirme ici la fiabilité de Dieu et le maintien de son jugement concernant Saül. Ce choix évite d’étendre silencieusement l’énoncé en une thèse philosophique absolue, tout en préservant le contraste avec l’inconstance humaine.
- issue: Sens du titre divin נֵצַח יִשְׂרָאֵל
  choice: la Gloire d’Israël
  alternative: l’Éternel d’Israël / la Force d’Israël / la Victoire d’Israël
  rationale: Le substantif נֵצַח possède ici un champ sémantique débattu. Le texte principal retient un titre digne et plausible, tandis que la note maintient visibles les autres possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « revient sur sa décision » préserve la répétition hébraïque de נחם; la seconde occurrence est signalée par la note [b].
