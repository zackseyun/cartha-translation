  text: וַ/יִּקַּ֨ח הָ/עָ֧ם מֵ/הַ/שָּׁלָ֛ל צֹ֥אן וּ/בָקָ֖ר רֵאשִׁ֣ית הַ/חֵ֑רֶם לִ/זְבֹּ֛חַ לַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/גִּלְגָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: fr
  text: Mais le peuple a pris, parmi le butin, des moutons et des bovins, le meilleur de ce qui était voué à la destruction[a], afin de les sacrifier à l’Éternel[b], ton Dieu, à Guilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne ce qui avait été consacré à Dieu en vue de sa destruction et ne devait donc pas être gardé comme butin.
    reason: lexical_alternative
  - marker: b
    text: « L’Éternel » traduit ici le nom divin YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: a pris
  rationale: Le verbe לקח signifie simplement « prendre » dans ce contexte. « Mais » rend la valeur contrastive de la coordination dans le discours de Saül.
- source_word: הָעָם
  choice: le peuple
  rationale: Cette traduction formelle conserve la manière dont Saül rejette la responsabilité sur le groupe, même si celui-ci désigne ici ses troupes.
- source_word: מֵהַשָּׁלָל
  choice: sur le butin
  rationale: שׁלל désigne les biens pris à la guerre. « Prendre sur le butin » est naturel en français et exprime la sélection opérée parmi celui-ci.
- source_word: צֹאן וּבָקָר
  choice: des moutons et des bovins
  rationale: La formulation désigne concrètement le petit et le gros bétail; elle évite le sens plus collectif de « troupeaux ».
- source_word: רֵאשִׁית
  choice: le meilleur
  rationale: Bien que le mot puisse signifier « commencement » ou « prémices », il désigne ici la partie la plus choisie des animaux saisis.
- source_word: הַחֵרֶם
  choice: ce qui était voué à la destruction
  rationale: Cette expression rend la consécration irrévocable impliquée par חֵרֶם et le fait que ces biens devaient être détruits, sans recourir au jargon de « l’interdit ».
- source_word: לִזְבֹּחַ
  choice: afin de l’offrir en sacrifice
  rationale: L’infinitif indique le but. Le pronom singulier reprend collectivement « le meilleur » et rend la phrase naturelle en français.
- source_word: לַיהוָה
  choice: à l’Éternel
  rationale: « L’Éternel » est une convention française courante pour représenter le nom divin YHWH; une note signale explicitement ce choix.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le possessif de deuxième personne du singulier est conservé, car Saül dit à Samuel « ton Dieu », et non « notre Dieu ».
- source_word: בַּגִּלְגָּל
  choice: à Guilgal
  rationale: La préposition française « à » convient naturellement au nom de lieu Guilgal.
theological_decisions:
- issue: Rendu de חֵרֶם dans le contexte de la guerre consacrée
  choice: ce qui était voué à la destruction
  alternative: ce qui était frappé d’interdit
  rationale: 'Le choix conserve la tension du texte: les animaux prétendument réservés au sacrifice appartenaient déjà à ce que Dieu avait ordonné de détruire.'
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé / le Seigneur
  rationale: « L’Éternel » est intelligible et traditionnel en français tout en distinguant le nom divin du titre « Seigneur »; la note précise qu’il représente YHWH.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste initial, le déplacement de responsabilité vers « le peuple » et le possessif marqué « ton Dieu ». Le vocabulaire sacrificiel reste accessible sans atténuer la gravité de ce qui était voué à la destruction.
