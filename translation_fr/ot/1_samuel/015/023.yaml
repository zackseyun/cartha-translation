id: 1SA.15.23
reference: 1 Samuel 15:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: fr
  text: 'Car la rébellion est comme le péché de divination[a], et l’obstination comme le mal et les idoles domestiques[b]. Puisque tu as rejeté la parole de Yahweh, lui aussi t’a rejeté : tu ne seras plus roi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le péché de sorcellerie ». Le mot hébreu קֶסֶם désigne plus largement la divination, c’est-à-dire la recherche d’une connaissance cachée par des moyens interdits.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : תְּרָפִים (teraphim), images cultuelles ou idoles souvent conservées dans les maisons.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « il t’a rejeté comme roi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la réprimande précédente, tandis que יַעַן marque ensuite la cause précise de la sentence.
- source_word: חַטַּאת קֶסֶם
  choice: le péché de divination
  rationale: Rend la chaîne construite hébraïque et désigne clairement la recherche interdite d’une connaissance cachée, sans employer le terme plus étroit et potentiellement anachronique de « sorcellerie ».
- source_word: מֶרִי
  choice: la rébellion
  rationale: Exprime le refus délibéré de se soumettre à une autorité, ici le refus de Saül d’obéir au commandement divin.
- source_word: וְאָוֶן
  choice: le mal
  rationale: Dans ce rapprochement avec les teraphim, le mot porte une valeur morale forte. « Le mal » est actuel, clair et suffisamment large pour préserver l’étendue sémantique du terme.
- source_word: וּתְרָפִים
  choice: les idoles domestiques
  rationale: Les teraphim étaient des objets cultuels, souvent associés au cadre familial ou domestique. La traduction communique directement leur fonction au lecteur moderne.
- source_word: הַפְצַר
  choice: l’obstination
  rationale: Le terme évoque une insistance opiniâtre et présomptueuse. « Obstination » convient au comportement de Saül et conserve la gravité du parallèle.
- source_word: יַעַן
  choice: Puisque
  rationale: Introduit explicitement le motif de la sentence. « Puisque » évite de répéter immédiatement « car » et exprime naturellement une cause tenue pour établie.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: tu as rejeté la parole de Yahweh
  rationale: « Rejeté » conserve la répétition rhétorique du verbe מָאַס dans les deux membres de la sentence. Le nom divin est transcrit « Yahweh » conformément à l’usage du projet.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: 'lui aussi t’a rejeté : tu ne seras plus roi'
  rationale: Cette formulation française naturelle préserve la réciprocité du jugement et explicite le sens de מן, qui indique l’exclusion de la royauté, sans faire de la tournure française maladroite « rejeter de la royauté » le texte principal.
theological_decisions:
- issue: Structure comparative du premier membre
  choice: La rébellion est comparée au péché de divination, et l’obstination au mal et aux idoles domestiques.
  alternative: La rébellion est le péché de divination, et l’obstination est le mal et les teraphim.
  rationale: L’hébreu ne comporte pas de particule comparative explicite, mais le parallélisme proverbial permet une comparaison implicite. L’ajout de « comme » en français évite une formulation obscure tout en maintenant l’équivalence morale très forte établie par Samuel.
- issue: Portée de מִמֶּלֶךְ dans la sentence contre Saül
  choice: Yahweh rejette Saül de telle sorte qu’il ne sera plus roi.
  alternative: Yahweh rejette Saül en tant que roi.
  rationale: La préposition מן peut exprimer l’éloignement ou la privation d’un statut. Le texte principal met en avant la perte de la royauté, tandis que la note conserve l’autre formulation possible sans trancher davantage que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme proverbial et la répétition de « rejeté » sont conservés. « Obstination », « divination » et « idoles domestiques » restent accessibles tout en maintenant la gravité cultuelle et morale de l’hébreu.
