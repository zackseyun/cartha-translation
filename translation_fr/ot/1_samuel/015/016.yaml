  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל הֶ֚רֶף וְ/אַגִּ֣ידָה לְּ/ךָ֔ אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֵלַ֖/י הַ/לָּ֑יְלָה ו/יאמרו ל֖/וֹ דַּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: fr
  text: 'Alors Samuel dit à Saül : « Arrête ! Je vais te dire ce que Yahweh m’a dit la nuit dernière. » Saül lui répondit : « Parle. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme écrite en hébreu porte : « ils lui dirent ». Le contexte indique toutefois que Saül est celui qui répond ; le sens est donc singulier.'
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: Arrête !
  rationale: L’impératif de רפה ordonne ici vivement à Saül de cesser de parler. « Arrête ! » est direct, naturel et conserve le ton de réprimande.
- source_word: וְאַגִּידָה לְּךָ
  choice: Je vais te dire
  rationale: Le hiphil de נגד signifie « annoncer, déclarer, dire ». Après l’ordre initial, « je vais te dire » exprime naturellement l’intention immédiate de Samuel.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: ce que … m’a dit
  rationale: Cette tournure introduit le contenu de la parole divine. « Ce que … m’a dit » est idiomatique et fidèle au sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הַלָּיְלָה
  choice: la nuit dernière
  rationale: Avec le verbe au parfait et dans cette situation narrative, l’expression désigne la nuit qui vient de s’écouler.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Saül lui répondit
  rationale: La forme écrite est au pluriel, mais le contexte exige que Saül soit l’unique répondant. Nommer Saül clarifie les référents sans modifier le sens contextuel.
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif bref autorise Samuel à poursuivre. « Parle » en conserve la concision et la force.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » représente le nom propre hébreu et évite de remplacer celui-ci par un titre, sans ajouter d’interprétation doctrinale.
- issue: Nombre grammatical de וַיֹּאמְרוּ לוֹ
  choice: 'Singulier : « Saül lui répondit »'
  alternative: 'Pluriel littéral : « ils lui dirent »'
  rationale: Le pluriel de la forme écrite crée une difficulté textuelle réelle, mais aucun groupe susceptible de répondre n’est présent dans le contexte immédiat. Le texte principal suit donc le sens contextuel singulier, tandis que la note conserve la forme hébraïque attestée.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’échange personnel et hiérarchiquement tendu entre Samuel et Saül. La ponctuation souligne la brusquerie de l’ordre initial sans amplifier le contenu.
