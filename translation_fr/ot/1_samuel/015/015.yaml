  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: fr
  text: 'Saül répondit : « Ils les ont amenés de chez les Amalécites, car le peuple a épargné les meilleures bêtes du petit et du gros bétail afin de les sacrifier à Yahweh, ton Dieu. Quant au reste, nous l’avons voué à la destruction[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous l’avons entièrement détruit ». Le verbe hébreu traduit ici par « vouer à la destruction » est un terme technique qui désigne le fait de placer une personne ou une chose sous l’interdit en vue de sa destruction.'
    reason: Alternative lexicale et explication du sens technique de חרם.
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: Ils les ont amenés
  rationale: Le hiphil de בוא accompagné du suffixe objet de troisième personne du masculin pluriel signifie ici qu’ils ont fait venir, donc amené, les animaux. Le passé composé convient au discours direct en français moderne.
- source_word: מֵעֲמָלֵקִי
  choice: de chez les Amalécites
  rationale: La forme gentilice désigne le peuple amalécite. « De chez » exprime naturellement la provenance dans ce contexte.
- source_word: חָמַל ... עַל
  choice: a épargné
  rationale: Dans ce contexte militaire, l’expression signifie que le peuple s’est abstenu de détruire les animaux concernés, plutôt qu’elle ne décrit seulement un sentiment de pitié.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: les meilleures bêtes du petit et du gros bétail
  rationale: מֵיטַב désigne la partie la meilleure ou la plus choisie. « Petit et gros bétail » rend les deux catégories collectives sans réduire nécessairement צֹאן aux seuls moutons.
- source_word: לְמַעַן זְבֹחַ
  choice: afin de les sacrifier
  rationale: לְמַעַן marque explicitement le but. Le pronom « les » explicite en français que les animaux épargnés devaient servir de sacrifices.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », conformément à sa valeur de nom propre dans le texte source.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: 'Le suffixe masculin singulier est conservé : Saül dit à Samuel « ton Dieu », formulation rhétoriquement significative qui crée une certaine distance.'
- source_word: הַיּוֹתֵר
  choice: Quant au reste
  rationale: Le terme désigne tout ce qui restait après la mise à part des meilleures bêtes. La tournure introduit naturellement le contraste en français.
- source_word: הֶחֱרַמְנוּ
  choice: nous l’avons voué à la destruction
  rationale: 'Le hiphil de חרם appartient ici au vocabulaire de l’interdit : il ne désigne pas une destruction ordinaire, mais la remise irrévocable à la destruction sous jugement divin.'
theological_decisions:
- issue: Sens de חרם dans un contexte de guerre et de jugement
  choice: voué à la destruction
  alternative: entièrement détruit ; frappé d’interdit
  rationale: La formulation retenue préserve la dimension technique de consécration irrévocable à la destruction, sans employer dans le corps du texte un jargon difficile.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve sa fonction de nom propre et son caractère d’appellation d’alliance.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve l’opposition entre « le peuple » et « nous », ainsi que la formulation marquée « ton Dieu ». Le marqueur de note est placé après l’expression qu’il explique.
