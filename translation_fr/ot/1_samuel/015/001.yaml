id: 1SA.15.1
reference: 1 Samuel 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: fr
  text: 'Samuel dit alors à Saül : « C’est moi que Yahweh a envoyé pour t’oindre roi sur son peuple, sur Israël. Maintenant donc, écoute les paroles de Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écoute la voix des paroles de Yahweh ». En hébreu, cette expression appelle non seulement à entendre, mais aussi à tenir compte de ce qui est dit.'
    reason: La note préserve la forme particulière de l’expression hébraïque et sa nuance d’obéissance, tout en permettant une formulation fluide dans le texte principal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit. « Dit alors » rend cette progression dans un français narratif naturel.
- source_word: אֹתִי שָׁלַח
  choice: C’est moi que … a envoyé
  rationale: La construction clivée conserve la mise en relief du pronom objet אֹתִי, placé en tête en hébreu, tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel יהוה au lieu de lui substituer un titre.
- source_word: לִמְשָׁחֳךָ
  choice: pour t’oindre
  rationale: Le verbe משׁח désigne ici l’onction conférant la fonction royale; « oindre » conserve ce sens institutionnel et biblique.
- source_word: לְמֶלֶךְ
  choice: roi
  rationale: Après « t’oindre », l’attribut direct « roi » exprime naturellement en français la fonction à laquelle Saül est établi.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: sur son peuple, sur Israël
  rationale: La répétition de עַל est conservée afin de respecter l’insistance et le rythme de l’hébreu; Israël précise l’identité du peuple de Yahweh.
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Cette expression marque à la fois la transition et la conséquence pratique tirée du rappel de l’appel de Saül.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: écoute les paroles de Yahweh
  rationale: Cette formulation naturelle transmet l’ordre d’écouter avec l’idée implicite d’obéir; la tournure hébraïque plus littérale est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de l’impératif שְׁמַע
  choice: écoute
  alternative: obéis
  rationale: « Écoute » conserve le sens lexical et laisse subsister la portée implicite d’obéissance, sans réduire le verbe à une seule conséquence interprétative.
translation_notes:
  register: Français international moderne, courant et digne. Le passé composé convient au discours direct; la construction « C’est moi que… » restitue l’emphase hébraïque sans lourdeur excessive. Le nom « Yahweh » et le terme biblique « oindre » sont maintenus pour leur précision.
