id: 1SA.15.28
reference: 1 Samuel 15:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: fr
  text: 'Samuel lui dit : « Yahweh t’a arraché aujourd’hui la royauté sur Israël et l’a donnée à l’un de tes semblables[a], qui est meilleur que toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ton prochain », « à ton compagnon » ou « à l’un de tes proches ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit simplement « meilleur que toi », sans préciser en quel sens.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: Samuel lui dit
  rationale: Le wayyiqtol fait avancer le récit. En français, l’enchaînement est naturel sans qu’il soit nécessaire d’ajouter systématiquement « et » ou « alors ».
- source_word: קָרַע ... מֵעָלֶיךָ
  choice: t’a arraché
  rationale: « Arracher » conserve l’image vive de la déchirure du vêtement au verset précédent tout en exprimant naturellement en français la privation imposée à Saül.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom propre hébreu plutôt que de lui substituer un titre.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: la royauté sur Israël
  rationale: Dans ce contexte de transfert d’autorité royale d’une personne à une autre, « royauté sur Israël » rend mieux la fonction et le pouvoir concernés que le territoire désigné par « royaume d’Israël ».
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne et direct qui conserve l’immédiateté du jugement prononcé.
- source_word: וּנְתָנָהּ
  choice: et l’a donnée
  rationale: Le parfait présente le don comme décidé et accompli dans la déclaration divine, même si sa réalisation historique complète est encore à venir.
- source_word: לְרֵעֲךָ
  choice: à l’un de tes semblables
  rationale: רֵעַ peut désigner le prochain, le compagnon ou une autre personne appartenant au même milieu. « L’un de tes semblables » évite de réduire le terme à un voisin géographique ou à un ami intime.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: qui est meilleur que toi
  rationale: La formulation garde le comparatif simple de l’hébreu et rattache clairement la qualité à la personne qui reçoit la royauté, sans préciser selon quel critère elle est meilleure.
theological_decisions:
- issue: Jugement présenté comme accompli ou comme futur
  choice: 'Passés composés : « t’a arraché ... l’a donnée »'
  alternative: 'Futurs : « t’arrachera ... la donnera »'
  rationale: Les formes hébraïques présentent la décision divine comme accomplie et irrévocable, tout en laissant subsister la tension avec sa réalisation historique ultérieure.
- issue: Sens de « meilleur que toi »
  choice: Conserver le comparatif général sans l’expliciter
  alternative: « plus digne que toi » ou « plus apte que toi »
  rationale: Le texte ne précise pas si la supériorité est morale, spirituelle ou liée à l’aptitude royale. La traduction ne doit pas résoudre cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. « Royauté sur Israël » met l’accent sur l’autorité royale transférée. « T’a arraché » maintient l’écho concret de la déchirure du vêtement au verset précédent sans produire une tournure française artificielle.
