base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: fr
  text: 'Samuel arriva auprès de Saül, et Saül lui dit : « Béni sois-tu par Yahweh[a] ! J’ai mis en œuvre[b] la parole de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Béni es-tu pour Yahweh » ; la préposition hébraïque peut, dans cette formule de bénédiction, présenter Yahweh comme la source ou l’agent de la bénédiction.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « J’ai accompli » ou « J’ai exécuté la parole de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva auprès de
  rationale: Le verbe בוא décrit ici l’arrivée de Samuel en présence de Saül. « Arriva auprès de » exprime naturellement ce mouvement en français sans imposer le point de vue de « vint » ou « alla ».
- source_word: וַיֹּאמֶר לוֹ
  choice: lui dit
  rationale: Cette formulation française naturelle conserve explicitement le complément לוֹ, « à lui ».
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: Béni sois-tu par Yahweh
  rationale: Cette formule solennelle et compréhensible rend la bénédiction adressée à Samuel, en présentant Yahweh comme source ou agent de la bénédiction. Une note conserve la valeur plus littérale, mais moins idiomatique, de la préposition לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu qui emploie le tétragramme.
- source_word: הֲקִימֹתִי
  choice: j’ai mis en œuvre
  rationale: Le hiphil de קום avec דְּבַר יְהוָה signifie faire tenir ou rendre effectif ce qui a été dit. « Mettre en œuvre » communique l’affirmation d’obéissance de Saül sans ajouter qu’elle était réellement complète.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » préserve l’expression hébraïque et sa portée, tandis que le contexte indique qu’il s’agit d’un ordre divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom personnel divin. Sa translittération préserve cette donnée au lieu de lui substituer un titre.
- issue: Portée de l’affirmation d’obéissance de Saül
  choice: j’ai mis en œuvre la parole
  alternative: j’ai accompli l’ordre
  rationale: La traduction rapporte la prétention de Saül sans confirmer implicitement qu’il a parfaitement obéi, ce que la suite du récit conteste. Elle conserve aussi le terme plus large דָּבָר, « parole ».
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion « Béni sois-tu » garde le caractère solennel d’une formule de bénédiction, tandis que « mis en œuvre » reste courant et n’efface pas l’ironie narrative de la déclaration de Saül.
