base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: fr
  text: 'Saül dit à Samuel : « Mais j’ai bien obéi à la voix de Yahweh[a] : j’ai suivi le chemin sur lequel Yahweh m’a envoyé, j’ai amené Agag, roi d’Amaleq, et j’ai voué Amaleq à la destruction[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai écouté la voix de Yahweh ». En hébreu, cette expression signifie couramment « obéir à la voix de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’ai entièrement détruit Amaleq » ou « j’ai frappé Amaleq d’interdit ». Le verbe hébreu désigne le fait de vouer quelque chose à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: j’ai bien obéi à la voix de
  rationale: La construction שׁמע בְּקוֹל signifie couramment « obéir à la voix de » ou « écouter la voix de ». « Bien » rend l’insistance défensive de Saül dans ce contexte, tandis que l’expression « à la voix de » conserve l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: j’ai suivi le chemin sur lequel Yahweh m’avait envoyé
  rationale: Cette formulation naturelle conserve la métaphore du « chemin » et le sens de la mission confiée, sans remplacer l’image par une explicitation.
- source_word: וָאָבִיא
  choice: j’ai ramené
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Dans le contexte du retour de l’expédition auprès de Samuel, « ramené » est naturel, bien que l’idée de retour soit contextuelle plutôt qu’encodée dans le verbe seul.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agag, roi d’Amaleq
  rationale: L’apposition française restitue directement l’identification hébraïque.
- source_word: הֶחֱרַמְתִּי
  choice: j’ai voué … à la destruction
  rationale: Au hiphil, חרם désigne ici le fait de vouer une personne ou un peuple à la destruction. Cette traduction garde la dimension de mise à part irrévocable, là où « exterminer » n’en exprimerait que le résultat.
- source_word: וְאֶת עֲמָלֵק
  choice: Amaleq
  rationale: Le nom propre singulier est conservé comme désignation collective du peuple, conformément à l’hébreu.
theological_decisions:
- issue: Rendu de חרם dans le contexte de la guerre vouée à Dieu
  choice: j’ai voué Amaleq à la destruction
  alternative: j’ai entièrement détruit Amaleq ; j’ai frappé Amaleq d’interdit
  rationale: Le choix retenu préserve à la fois l’idée d’une consécration irrévocable et son issue destructrice, sans réduire le terme à une simple action militaire ni imposer un vocabulaire confessionnel.
- issue: Insistance de Saül dans sa défense
  choice: Mais j’ai bien obéi à la voix de Yahweh
  alternative: J’ai obéi à la voix de Yahweh ; Si, j’ai obéi à la voix de Yahweh
  rationale: Le contexte donne à אֲשֶׁר une force de réplique et de contestation. « Mais » et « bien » rendent cette insistance défensive de façon idiomatique, sans présenter l’affirmation de Saül comme l’évaluation du narrateur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les répétitions de la défense de Saül et l’image du chemin, tout en restant naturelle. « Amaleq » est employé collectivement comme dans l’hébreu.
