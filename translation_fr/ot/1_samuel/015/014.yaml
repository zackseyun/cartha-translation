  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וּ/מֶ֛ה קֽוֹל הַ/צֹּ֥אן הַ/זֶּ֖ה בְּ/אָזְנָ֑/י וְ/ק֣וֹל הַ/בָּקָ֔ר אֲשֶׁ֥ר אָנֹכִ֖י שֹׁמֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: fr
  text: 'Mais Samuel dit : « Alors, quel est ce bruit de petit bétail qui parvient à mes oreilles, et ce bruit de gros bétail que j’entends ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Samuel dit
  rationale: Le waw narratif fait progresser le récit, tandis que « mais » exprime naturellement l’opposition contextuelle entre l’affirmation d’obéissance de Saül et la contestation de Samuel.
- source_word: וּמֶה
  choice: Alors, quel est
  rationale: L’interrogatif demande une explication et prend ici la forme d’une objection rhétorique ; « alors » rend la valeur logique de la conjonction en français courant.
- source_word: קוֹל
  choice: bruit
  rationale: קוֹל peut désigner une voix, un son ou un bruit. Appliqué aux animaux que Samuel entend, « bruit » est naturel et conserve la même désignation générale dans les deux occurrences.
- source_word: הַצֹּאן
  choice: petit bétail
  rationale: צֹאן désigne collectivement les ovins et les caprins. « Petit bétail » préserve cette étendue lexicale sans réduire indûment le groupe aux seuls moutons.
- source_word: הַזֶּה בְּאָזְנָי
  choice: ce … qui parvient à mes oreilles
  rationale: Le démonstratif signale le bruit immédiatement perceptible. Cette formulation française conserve l’image des oreilles tout en évitant le tour peu idiomatique « dans mes oreilles ».
- source_word: וְקוֹל הַבָּקָר
  choice: et ce bruit de gros bétail
  rationale: בָּקָר est un collectif désignant les bovins. « Gros bétail » répond précisément à « petit bétail » et évite de limiter le sens à des bœufs.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: que j’entends
  rationale: Le présent rend directement la perception en cours. Le pronom hébreu explicite אָנֹכִי peut être emphatique, mais le contexte interrogatif porte déjà suffisamment l’insistance en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La distinction « petit bétail / gros bétail » restitue plus exactement les collectifs hébreux que « moutons / bœufs ». Le parallélisme sonore est maintenu par la répétition de « bruit ».
