base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: fr
  text: 'Samuel dit : « De même que ton épée a privé des femmes de leurs enfants, de même ta mère sera privée d’enfants parmi les femmes[a]. » Puis Samuel mit Agag en pièces[b] devant Yahvé, à Guilgal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « De même que ton épée a endeuillé des femmes, de même ta mère sera endeuillée parmi les femmes. » L’hébreu emploie le même verbe dans les deux propositions, soulignant la rétribution correspondante.'
    reason: lexical_alternative
  - marker: b
    text: Ou « coupa Agag en morceaux » ; le verbe hébreu est rare et décrit une action violente consistant à mettre en pièces.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל
  choice: a privé des femmes de leurs enfants / sera privée de son enfant
  rationale: Le même champ verbal est conservé dans les deux propositions afin de rendre la rétribution symétrique exprimée par l’hébreu. Cette formulation française indique clairement la perte des enfants sans employer une tournure artificielle comme « rendre sans enfants ».
- source_word: חַרְבֶּךָ
  choice: ton épée
  rationale: 'Traduction directe qui conserve la métonymie naturelle : l’épée représente les actes meurtriers d’Agag.'
- source_word: מִנָּשִׁים
  choice: parmi les femmes
  rationale: Dans cette expression comparative, « parmi » rend naturellement la préposition hébraïque מן.
- source_word: וַיְשַׁסֵּף
  choice: coupa Agag en morceaux
  rationale: Le verbe rare et violent désigne le fait de couper ou de mettre en pièces. Cette traduction en préserve la force sans archaïsme ni amplification gratuite.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: « Devant » rend directement לִפְנֵי dans ce cadre public, judiciaire et religieux.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme « Yahvé », courante en français, représente explicitement le nom divin plutôt que de le remplacer par un titre.
- source_word: בַּגִּלְגָּל
  choice: à Guilgal
  rationale: « À » est la préposition française idiomatique pour situer l’action dans cette localité, dont le nom reçoit sa graphie française usuelle.
theological_decisions:
- issue: Rendre l’exécution violente sans l’atténuer ni la dramatiser davantage
  choice: Samuel coupa personnellement Agag en morceaux
  alternative: Samuel mit Agag à mort
  rationale: Le sujet hébreu est explicitement Samuel et le verbe décrit une action plus précise et plus violente qu’une simple mise à mort. La traduction conserve donc cette gravité sans ajouter de justification théologique.
- issue: Rendre le nom divin
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme יהוה. La traduction le représente par la forme française reconnue « Yahvé », préservant le nom propre dans le corps du verset.
- issue: Préserver la logique de rétribution mesurée
  choice: répéter la notion de privation d’enfants dans les deux propositions
  alternative: endeuiller des femmes / être endeuillée
  rationale: La répétition fait entendre le parallélisme voulu par le texte sans expliquer ni approuver moralement l’acte raconté.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme de la parole de Samuel est maintenu, tandis que le récit de l’exécution demeure explicite sans vocabulaire archaïque ni effet sensationnaliste.
