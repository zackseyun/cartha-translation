  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: fr
  text: Samuel se tourna pour partir, et Saül saisit le pan[a] du manteau de Samuel, qui se déchira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le coin » ou « le bord ». Le mot hébreu peut désigner l’extrémité d’un vêtement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: se retournait
  rationale: Le verbe סבב décrit ici le mouvement de Samuel qui se détourne en vue de partir. L’imparfait français s’intègre naturellement à la tournure « Comme… ».
- source_word: לָלֶכֶת
  choice: pour partir
  rationale: L’infinitif de הלך indique l’intention liée au mouvement. « Partir » rend clairement le départ de Samuel dans ce contexte.
- source_word: וַיַּחֲזֵק
  choice: saisit
  rationale: Le hiphil de חזק exprime ici une prise ferme et soudaine. « Saisit » est naturel et conserve la force de l’action.
- source_word: בִּכְנַף
  choice: le pan
  rationale: כָּנָף désigne littéralement une aile, puis l’extrémité ou le coin d’un vêtement. « Pan » convient naturellement à un manteau sans préciser indûment s’il s’agit du coin ou de l’ourlet.
- source_word: מְעִילוֹ
  choice: de son manteau
  rationale: מְעִיל désigne un vêtement de dessus. « Manteau » est clair, moderne et adapté au récit.
- source_word: וַיִּקָּרַע
  choice: qui se déchira
  rationale: Le niphal peut être compris de façon passive ou intransitive. « Se déchira » restitue naturellement l’événement sans préciser davantage son mécanisme.
theological_decisions:
- issue: Sujet implicite de וַיַּחֲזֵק
  choice: Saül
  alternative: un pronom masculin ambigu (« il »)
  rationale: Bien que l’hébreu n’exprime que « il saisit », le contexte immédiat identifie Saül comme celui qui retient Samuel. Nommer Saül évite en français une ambiguïté référentielle artificielle, sans modifier le sens du récit.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la syntaxe et des images de l’hébreu tout en clarifiant le sujet implicite requis par l’usage français.
