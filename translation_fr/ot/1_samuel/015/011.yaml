  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: fr
  text: « Je regrette d’avoir établi Saül comme roi[a], car il s’est détourné de moi[b] et n’a pas mis mes paroles en pratique[c]. » Samuel s’enflamma de colère[d] et cria à Yahweh toute la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis désolé d’avoir établi Saül comme roi » ou « Je me ravise d’avoir établi Saül comme roi ». L’hébreu exprime le regret de Yahweh au sujet de la royauté de Saül.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il est revenu de derrière moi », expression qui signifie qu’il a cessé de suivre Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « n’a pas accompli mes paroles » ou « n’a pas obéi à mes paroles ».'
    reason: lexical_alternative
  - marker: d
    text: Expression hébraïque évoquant une colère qui s’enflamme. Certains comprennent ici que Samuel fut profondément peiné ou bouleversé.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: Je regrette
  rationale: Le niphal de נחם exprime ici le regret et la douleur de Dieu à propos de la royauté de Saül. « Je regrette » garde cette force et la tension théologique sans suggérer que Dieu aurait commis une faute morale.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: d’avoir établi Saül comme roi
  rationale: Le hiphil de מלך désigne l’action d’installer quelqu’un dans la fonction royale. « Établi […] comme roi » est naturel, digne et précis.
- source_word: שָׁב מֵאַחֲרַי
  choice: il s’est détourné de moi
  rationale: L’expression signifie se détourner de la suite de quelqu’un. La formulation française naturelle rend la rupture d’allégeance; une note conserve l’image littérale de cesser de suivre.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: et n’a pas mis mes paroles en pratique
  rationale: Avec « paroles », הקים évoque leur accomplissement concret. Cette formulation garde l’idée d’exécuter ce qui a été dit, sans réduire le sens au seul verbe « obéir ».
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: Samuel en fut brûlant de colère
  rationale: L’expression חרה ל désigne lexicalement une colère qui s’enflamme. « En fut » relie naturellement la réaction à la déclaration reçue, tandis que « brûlant de colère » préserve l’image hébraïque.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: cria vers Yahweh
  rationale: זעק indique un cri intense, souvent motivé par la détresse ou une supplication urgente. « Cria vers » conserve à la fois l’intensité et la direction de l’appel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כָּל־הַלָּיְלָה
  choice: toute la nuit
  rationale: Formulation française idiomatique qui exprime fidèlement la durée entière.
theological_decisions:
- issue: Le regret divin exprimé par נִחַמְתִּי
  choice: Je regrette
  alternative: Je suis peiné ; je reviens sur ma décision
  rationale: Le texte présente un regret divin réel à l’égard de la royauté de Saül. La traduction conserve cette tension sans l’expliquer comme une faute morale de Dieu ni l’atténuer en simple changement d’action.
- issue: La réaction émotionnelle de Samuel en וַיִּחַר לִשְׁמוּאֵל
  choice: Samuel en fut brûlant de colère
  alternative: Samuel en fut profondément peiné
  rationale: Le sens lexical habituel de l’expression est la colère, même si le contexte peut aussi suggérer douleur ou profond déplaisir. Le texte principal retient la valeur lexicale, et la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est clairement délimité. Les images hébraïques importantes sont conservées lorsqu’elles restent intelligibles, et leurs ambiguïtés lexicales ou théologiques sont signalées en notes.
