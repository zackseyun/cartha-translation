  text: וַ/יַּשְׁכֵּ֧ם שְׁמוּאֵ֛ל לִ/קְרַ֥את שָׁא֖וּל בַּ/בֹּ֑קֶר וַ/יֻּגַּ֨ד לִ/שְׁמוּאֵ֜ל לֵ/אמֹ֗ר בָּֽא שָׁא֤וּל הַ/כַּרְמֶ֨לָ/ה֙ וְ/הִנֵּ֨ה מַצִּ֥יב ל/וֹ֙ יָ֔ד וַ/יִּסֹּב֙ וַֽ/יַּעֲבֹ֔ר וַ/יֵּ֖רֶד הַ/גִּלְגָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: fr
  text: 'Samuel se leva de bon matin pour aller à la rencontre de Saül. On informa Samuel en ces termes : « Saül est arrivé au Carmel et voici qu’il a érigé un monument pour lui-même[a]. Puis il a fait demi-tour, a poursuivi son chemin et est descendu à Guilgal. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une main pour lui-même ». Ici, « main » désigne un signe commémoratif ou un monument.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: se leva de bon matin
  rationale: Cette tournure française naturelle exprime à la fois l’action de se lever tôt et la précision temporelle du matin.
- source_word: לִקְרַאת
  choice: pour aller à la rencontre de
  rationale: L’infinitif précédé de ל indique ici le but; la formulation française rend explicitement le déplacement vers Saül.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: On informa Samuel en ces termes
  rationale: Le pronom indéfini conserve l’absence d’agent identifié dans la forme passive hébraïque, tandis que « en ces termes » rend naturellement לֵאמֹר.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: Saül est allé au Carmel
  rationale: Dans ce discours rapporté, « est allé » rend naturellement le mouvement vers le Carmel marqué par le hé directionnel, sans imposer le point de vue déictique de « est venu ».
- source_word: וְהִנֵּה
  choice: et, vois,
  rationale: « Vois » conserve la fonction déictique et l’effet d’attirer l’attention, dans un registre actuel mais digne.
- source_word: מַצִּיב
  choice: s’y est érigé
  rationale: Le passé composé rend l’état résultant suggéré par הִנֵּה suivi du participe; la forme pronominale exprime de façon concise que Saül l’a fait pour lui-même.
- source_word: יָד
  choice: un monument
  rationale: Bien que le sens littéral soit « main », le mot désigne ici un signe commémoratif ou monument; le rendre littéralement obscurcirait le sens.
- source_word: לּוֹ
  choice: s’y est érigé
  rationale: La construction pronominale française intègre la valeur réflexive de « pour lui-même », probablement pour sa propre gloire.
- source_word: וַיִּסֹּב
  choice: il a fait demi-tour
  rationale: Dans cette succession de déplacements, l’expression indique clairement que Saül a changé de direction.
- source_word: וַיַּעֲבֹר
  choice: a poursuivi son chemin
  rationale: Cette formulation idiomatique traduit la continuation du déplacement sans suggérer nécessairement qu’il est passé devant un objet précis.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: est descendu à Guilgal
  rationale: « Descendre » préserve la nuance topographique courante de ירד; « Guilgal » est la forme française traditionnelle et intelligible du toponyme.
theological_decisions:
- issue: Finalité du monument
  choice: s’y est érigé un monument
  alternative: a dressé un monument pour lui-même
  rationale: Le texte associe explicitement le monument à Saül par לּוֹ, mais n’énonce pas directement son intention intérieure. La formulation conserve l’auto-commémoration apparente sans ajouter une condamnation psychologique explicite.
translation_notes:
  register: Français international moderne, narratif et digne. Les temps du passé composé conviennent au discours rapporté et rendent l’état résultant du participe מַצִּיב. La répétition hébraïque des verbes de déplacement est légèrement idiomatisée sans supprimer les étapes du parcours.
