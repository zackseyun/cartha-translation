revisions:
- from: 'Samuel se leva de bon matin pour aller à la rencontre de Saül. On informa Samuel en ces termes : « Saül est allé au Carmel et, vois, il s’y est érigé un monument[a]. Puis il a fait demi-tour, a poursuivi son chemin et est descendu à Guilgal. »'
  to: 'Samuel se leva de bon matin pour aller à la rencontre de Saül. On informa Samuel en ces termes : « Saül est arrivé au Carmel et voici qu’il a érigé un monument pour lui-même[a]. Puis il a fait demi-tour, a poursuivi son chemin et est descendu à Guilgal. »'
  rationale: La révision remplace une construction pronominale ambiguë par « il a érigé un monument pour lui-même », qui rend explicitement et naturellement le participe מציב et le datif לו. « Voici qu’ » conserve la fonction d’appel d’attention de והנה dans un français narratif moderne. Le reste du texte et la note sont maintenus, car ils correspondent au sens de l’hébreu.
