  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: fr
  text: Pourquoi donc n’as-tu pas obéi à la voix de Yahweh, et t’es-tu précipité sur le butin[a], et as-tu fait ce qui est mal aux yeux de Yahweh ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « tu as fondu sur le butin » ; le verbe hébreu évoque un mouvement vif et avide vers les biens pris à l’ennemi.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וְלָמָּה
  choice: Pourquoi donc
  rationale: « Pourquoi » rend l’interrogatif לָמָּה, tandis que « donc » exprime naturellement en français la force connective et argumentative de וְ dans le reproche de Samuel.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: obéi à la voix
  rationale: Dans ce contexte de commandement, שׁמע בְּקוֹל signifie écouter de manière à obéir. Cette formulation française conserve à la fois le sens d’obéissance et l’image concrète de la voix.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וַתַּעַט אֶל
  choice: tu t’es précipité sur
  rationale: Le verbe évoque un mouvement vif et avide vers le butin, possiblement comparable à celui d’un oiseau de proie. « Se précipiter sur » est actuel, clair et conserve cette ardeur répréhensible.
- source_word: הַשָּׁלָל
  choice: le butin
  rationale: « Butin » est le terme militaire français courant pour les biens pris lors d’une victoire et convient au contexte narratif.
- source_word: וַתַּעַשׂ הָרַע
  choice: tu as fait ce qui est mal
  rationale: Cette expression rend naturellement l’idiome hébreu et tient compte de l’article défini sans produire le français moins idiomatique « faire le mal » dans cette construction coordonnée.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La formulation conserve la métaphore évaluative hébraïque tout en restant naturelle et immédiatement compréhensible en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente sans lui substituer un titre.
- issue: Portée du reproche interrogatif
  choice: Une question suivie de deux affirmations coordonnées
  alternative: Maintenir toute la phrase sous une seule question
  rationale: L’hébreu demande pourquoi Saül n’a pas obéi, puis enchaîne par des formes narratives décrivant sa ruée sur le butin et son acte mauvais. La ponctuation choisie préserve cette progression sans imposer au français une coordination interrogative maladroite.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse personnelle de Samuel à Saül. La répétition de « Yahweh » et l’expression « aux yeux de » conservent les traits saillants de l’hébreu.
