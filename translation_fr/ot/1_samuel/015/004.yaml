base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: fr
  text: 'Saül convoqua donc le peuple et le passa en revue à Telaïm[a] : deux cent mille fantassins et dix mille hommes de Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avec des agneaux », si בַּטְּלָאִים est pris dans son sens courant plutôt que comme le nom de lieu Telaïm.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: convoqua
  rationale: Le hifil de שׁמע signifie ici, dans ce contexte militaire, faire appeler ou rassembler; « convoqua » rend naturellement cette valeur.
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom signifie littéralement « le peuple ». Le contexte désigne les hommes mobilisés, mais le choix conserve la formulation hébraïque sans expliciter davantage que le texte.
- source_word: וַיִּפְקְדֵם
  choice: le passa en revue
  rationale: Dans un cadre militaire, פקד désigne le recensement ou la revue des troupes. Cette expression française est claire et convient à l’énumération qui suit.
- source_word: בַּטְּלָאִים
  choice: à Telaïm
  rationale: La forme est comprise principalement comme le nom du lieu où le rassemblement eut lieu, lecture cohérente avec le contexte; l’autre analyse possible est signalée en note.
- source_word: מָאתַיִם אֶלֶף רַגְלִי
  choice: deux cent mille fantassins
  rationale: רַגְלִי désigne ici collectivement les soldats combattant à pied; « fantassins » est précis et naturel en français moderne.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אֶת אִישׁ יְהוּדָה
  choice: auxquels s’ajoutaient dix mille hommes de Juda
  rationale: La tournure rend clairement le second contingent, distinct du premier total, tout en conservant son appartenance tribale.
