revisions:
- from: Comme toutes les actions qu’ils ont commises depuis le jour où je les ai fait sortir d’Égypte jusqu’à aujourd’hui — ils m’ont abandonné et ont servi d’autres dieux —, ainsi agissent-ils aussi envers toi.
  to: De même que, dans tout ce qu’ils ont fait depuis le jour où je les ai fait sortir d’Égypte jusqu’à ce jour, ils m’ont abandonné et ont servi d’autres dieux, de même ils agissent aussi envers toi.
  rationale: 'La révision remplace le calque comparatif par une corrélation idiomatique française (« De même que …, de même … »). Elle conserve l’étendue temporelle, les deux actes qui caractérisent la conduite d’Israël, le sens cultuel non interprété de « servir d’autres dieux » et l’ouverture délibérée de « ils agissent aussi envers toi ». Aucune note n’est nécessaire : les alternatives « jusqu’à ce jour »/« jusqu’à aujourd’hui » et « servir »/« adorer » ne créent pas ici d’ambiguïté significative en français.'
