  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: fr
  text: De même que, dans tout ce qu’ils ont fait depuis le jour où je les ai fait sortir d’Égypte jusqu’à ce jour, ils m’ont abandonné et ont servi d’autres dieux, de même ils agissent aussi envers toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲש׶ר עָשׂוּ
  choice: Comme toutes les actions qu’ils ont commises
  rationale: La préposition כְּ introduit ici la comparaison développée par כֵּן. « Actions » rend מַעֲשִׂים naturellement, tandis que « commises » conserve la portée négative du contexte sans préciser davantage leur nature.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: depuis le jour où je les ai fait sortir d’Égypte
  rationale: Le hifil de עלה appartient à la formule de l’exode. En français courant, « faire sortir d’Égypte » exprime clairement le mouvement causatif sans la lourdeur de « faire monter hors d’Égypte ».
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Équivalent français idiomatique qui conserve toute l’étendue temporelle indiquée par l’hébreu.
- source_word: וַיַּעַזְבֻנִי
  choice: ils m’ont abandonné
  rationale: « Abandonner » restitue directement עזב et sa portée de déloyauté, sans ajouter explicitement une notion de rébellion.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: ont servi d’autres dieux
  rationale: « Servir » demeure proche du sens littéral de עבד et exprime ici naturellement l’allégeance cultuelle.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: ainsi agissent-ils aussi envers toi
  rationale: « Ainsi » marque l’autre terme de la comparaison; « envers toi » garde ouverte la nature exacte de leur conduite envers Samuel, comme dans l’hébreu.
theological_decisions:
- issue: Rapport entre l’abandon de l’Éternel et la conduite du peuple envers Samuel
  choice: Conserver l’analogie formulée par le texte sans qualifier explicitement leur conduite de rébellion ou de rejet.
  alternative: « Ils se révoltent aussi contre toi » ou « ils te rejettent comme ils m’ont rejeté ».
  rationale: Le verset inscrit la demande du peuple dans une longue histoire d’infidélité, mais la dernière proposition reste volontairement générale. La traduction ne doit pas expliciter au-delà de cette analogie.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets mettent en relief les deux actions qui caractérisent la conduite passée d’Israël tout en préservant le mouvement comparatif de la phrase hébraïque. Aucun marqueur de note n’est requis puisqu’aucune note n’est retenue.
