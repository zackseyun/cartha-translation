  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל שְׁמַע֙ בְּ/ק֣וֹל הָ/עָ֔ם לְ/כֹ֥ל אֲשֶׁר יֹאמְר֖וּ אֵלֶ֑י/ךָ כִּ֣י לֹ֤א אֹֽתְ/ךָ֙ מָאָ֔סוּ כִּֽי אֹתִ֥/י מָאֲס֖וּ מִ/מְּלֹ֥ךְ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: fr
  text: 'Yahweh dit à Samuel : « Écoute la voix du peuple dans tout ce qu’ils te disent, car ce n’est pas toi qu’ils ont rejeté, mais moi qu’ils ont rejeté comme leur roi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « de régner sur eux ».'
    reason: La construction hébraïque מִמְּלֹךְ עֲלֵיהֶם exprime le rejet de Yahweh par rapport à son règne sur le peuple; « comme leur roi » en donne une formulation française idiomatique.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif demande à Samuel de prêter attention à la requête du peuple et d’en tenir compte ; « Écoute » reste proche de l’hébreu sans expliciter excessivement l’idée d’obéissance.
- source_word: בְּקוֹל הָעָם
  choice: la voix du peuple
  rationale: Cette formulation conserve l’image de l’expression hébraïque tout en restant claire en français.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: dans tout ce qu’il te dira
  rationale: Le peuple étant un nom collectif singulier en français, le pronom singulier assure une formulation naturelle tout en exprimant la totalité de sa demande.
- source_word: מָאַס
  choice: rejeter
  rationale: Le verbe exprime ici le refus de reconnaître une autorité personnelle ; « rejeter » convient aux deux emplois parallèles.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: car ce n’est pas toi qu’ils ont rejeté, mais moi
  rationale: La construction française met clairement en relief le contraste explicite entre Samuel et Yahweh.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: ils ne veulent plus que je règne sur eux
  rationale: Cette formulation naturelle rend la valeur privative de מִן avec l’infinitif et conserve l’idée verbale de la royauté divine sans transformer « régner » en simple notion générale de gouvernement.
theological_decisions:
- issue: La royauté divine face à la demande d’un roi humain
  choice: La demande du peuple est présentée comme un rejet de Yahweh et de son règne sur lui.
  alternative: La demande ne constituerait qu’un rejet de la direction exercée par Samuel.
  rationale: Le texte hébreu oppose explicitement Samuel à Yahweh et rattache le rejet à l’exercice de la royauté divine. La traduction maintient cette affirmation sans ajouter d’interprétation doctrinale.
- issue: Nuance de מִמְּלֹךְ עֲלֵיהֶם
  choice: ils ne veulent plus que je règne sur eux
  alternative: ils m’ont rejeté comme leur roi
  rationale: La traduction principale préserve l’idée verbale de « régner » et rend en français idiomatique l’effet du rejet ; la note signale l’autre formulation possible, centrée sur le statut de roi.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « la voix du peuple » conserve l’image hébraïque ; l’alternance entre « il » pour le collectif grammatical et « ils » pour les personnes qui composent le peuple est naturelle dans ce contexte.
