  revision_rationale: La révision retire l’ajout temporel « plus », rend le parallélisme des deux occurrences de « rejeter » plus directement et traduit la royauté divine par une expression française idiomatique. La note conserve la forme verbale explicite de l’hébreu sans imposer une interprétation supplémentaire.
