revisions:
- from: 'Yahweh dit à Samuel : « Écoute la voix du peuple dans tout ce qu’il te dira, car ce n’est pas toi qu’ils ont rejeté, mais moi : ils ne veulent plus que je règne sur eux[a]. »'
  to: 'Yahweh dit à Samuel : « Écoute la voix du peuple dans tout ce qu’ils te disent, car ce n’est pas toi qu’ils ont rejeté, mais moi qu’ils ont rejeté comme leur roi[a]. »'
  rationale: La révision retire l’ajout temporel « plus », rend le parallélisme des deux occurrences de « rejeter » plus directement et traduit la royauté divine par une expression française idiomatique. La note conserve la forme verbale explicite de l’hébreu sans imposer une interprétation supplémentaire.
