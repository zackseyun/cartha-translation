id: 1SA.8.14
reference: 1 Samuel 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת שְׂ֠דֽוֹתֵי/כֶם וְ/אֶת כַּרְמֵי/כֶ֧ם וְ/זֵיתֵי/כֶ֛ם הַ/טּוֹבִ֖ים יִקָּ֑ח וְ/נָתַ֖ן לַ/עֲבָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: fr
  text: Il prendra vos champs, vos vignobles et vos meilleures oliveraies[a], et il les donnera à ses serviteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oliviers » ou « plantations d’oliviers » ; l’hébreu désigne probablement ici des cultures d’oliviers considérées comme des biens agricoles.
    reason: lexical_alternative
  - marker: b
    text: Ou « esclaves » ; le mot hébreu peut désigner des serviteurs ou des esclaves selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: vos champs
  rationale: שָׂדֶה désigne couramment un champ ou une terre cultivée. « Champs » est direct, naturel et convient à cette liste de biens agricoles.
- source_word: כַּרְמֵיכֶם
  choice: vos vignobles
  rationale: כֶּרֶם désigne normalement un vignoble. « Vignobles » est le terme français précis et usuel.
- source_word: זֵיתֵיכֶם
  choice: vos oliveraies
  rationale: זַיִת peut désigner des oliviers collectivement ou des plantations d’oliviers. Dans cette énumération parallèle de propriétés agricoles, « oliveraies » rend naturellement l’idée d’exploitations productives.
- source_word: הַטּוֹבִים
  choice: meilleures
  rationale: טוֹב signifie « bon », mais, dans le contexte d’une confiscation royale, le pluriel défini qualifie les propriétés les plus avantageuses ou les plus productives. « Meilleures » exprime ce sens idiomatique sans surenchère.
- source_word: יִקָּח
  choice: prendra
  rationale: לָקַח est le verbe courant pour « prendre ». Le contexte indique le caractère contraint de l’acte, sans qu’il soit nécessaire de renforcer le verbe par « confisquera » ou « saisira ».
- source_word: וְנָתַן
  choice: et il les donnera
  rationale: נָתַן signifie ordinairement « donner ». Le pronom « les » est ajouté en français pour reprendre clairement les biens énumérés et produire une phrase naturelle.
- source_word: לַעֲבָדָיו
  choice: à ses serviteurs
  rationale: עֶבֶד peut désigner un serviteur, un esclave ou, dans un cadre royal, un homme au service du roi. Ici, « serviteurs » convient au contexte de bénéficiaires liés à la cour, tandis que l’autre possibilité est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la simplicité répétitive de l’avertissement hébreu tout en ajoutant le pronom « les », nécessaire à une syntaxe française naturelle. Les notes sont placées après les termes qu’elles expliquent.
