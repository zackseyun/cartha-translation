  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הִנֵּה֙ אַתָּ֣ה זָקַ֔נְתָּ וּ/בָנֶ֕י/ךָ לֹ֥א הָלְכ֖וּ בִּ/דְרָכֶ֑י/ךָ עַתָּ֗ה שִֽׂימָ/ה לָּ֥/נוּ מֶ֛לֶךְ לְ/שָׁפְטֵ֖/נוּ כְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: fr
  text: 'Ils lui dirent : « Vois, tu as vieilli, et tes fils ne suivent pas ta voie. Maintenant, établis sur nous un roi pour nous juger[a], comme en ont toutes les nations. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour nous gouverner » ou « pour régner sur nous » ; le verbe hébreu traduit par « juger » peut aussi désigner l’exercice plus large de l’autorité politique dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tu le vois
  rationale: Marque naturellement en français moderne l’appel à constater la situation, tout en conservant la force démonstrative et directe de l’hébreu.
- source_word: זָקַנְתָּ
  choice: tu as vieilli
  rationale: Le passé composé rend le processus arrivé à son état présent, conformément à la forme accomplie hébraïque.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: ne suivent pas ta voie
  rationale: Rend clairement la métaphore éthique de la marche sans produire en français une expression artificielle; le singulier collectif « voie » désigne la conduite et l’exemple de Samuel.
- source_word: שִׂימָה לָּנוּ
  choice: établis sur nous
  rationale: Dans cette demande d’institution monarchique, « établir » exprime la mise en fonction, tandis que « sur nous » conserve la portée d’autorité impliquée par le roi.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: Équivalent direct du nom hébreu désignant le monarque.
- source_word: לְשָׁפְטֵנוּ
  choice: pour nous gouverner
  rationale: Dans ce contexte politique, שׁפט dépasse la seule activité judiciaire et englobe l’exercice du gouvernement; une note conserve le sens plus formel « juger ».
- source_word: כְּכָל הַגּוֹיִם
  choice: comme en ont toutes les nations
  rationale: 'Explicite naturellement en français l’ellipse comparative: les nations environnantes ont des rois. « Nations » évite les connotations plus tardives de « païens ».'
theological_decisions:
- issue: La demande d’une monarchie sur le modèle des peuples environnants
  choice: comme en ont toutes les nations
  alternative: comme toutes les nations
  rationale: La formulation française explicite seulement l’ellipse grammaticale — toutes les nations ont un roi — sans atténuer la tension théologique liée au désir d’Israël de se conformer aux autres peuples.
- issue: L’étendue de la fonction exprimée par שׁפט
  choice: pour nous gouverner
  alternative: pour nous juger
  rationale: Le contexte concerne l’autorité royale dans son ensemble. « Gouverner » communique cette portée ordinaire, tandis que la note maintient visible le sens lexical plus littéral et son ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours reste direct et ferme. « Tu le vois » évite l’archaïsme de « voici » dans cet emploi; « établis sur nous » conserve la dimension d’autorité de la demande.
