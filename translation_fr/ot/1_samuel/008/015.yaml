  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: fr
  text: Il prélèvera un dixième de vos semences et de vos vignes, et le donnera à ses officiers[a] et à ses serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ses eunuques » ; le mot hébreu peut désigner des eunuques ou, plus largement, des officiers de la cour royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: vos semences
  rationale: זֶרַע désigne littéralement la semence et peut, dans un contexte agricole, englober ce qui est semé ou produit. « Vos semences » conserve l’image hébraïque sans réduire indûment le sens à une céréale précise.
- source_word: כַרְמֵיכֶם
  choice: vos vignes
  rationale: כֶּרֶם désigne un vignoble. En français courant, « vos vignes » exprime naturellement les exploitations viticoles dont le roi prélèvera le dixième.
- source_word: יַעְשֹׂר
  choice: prélèvera un dixième
  rationale: Le hifil de עשר exprime ici l’action d’exiger ou de prendre la dixième partie. « Prélèvera un dixième » convient au contexte d’exaction royale et évite la coloration cultuelle possible de « donnera la dîme ».
- source_word: וְנָתַן
  choice: et le donnera
  rationale: Le qatal précédé de waw poursuit la description future commencée par l’imparfait. Le pronom « le » reprend naturellement « un dixième » en français.
- source_word: לְסָרִיסָיו
  choice: à ses hauts fonctionnaires
  rationale: סָרִיס peut désigner un eunuque ou, plus largement, un dignitaire de la cour. « Hauts fonctionnaires » rend la fonction administrative probable dans ce contexte, tandis que l’autre sens est conservé en note.
- source_word: וְלַעֲבָדָיו
  choice: et à ses serviteurs
  rationale: עֶבֶד peut signifier serviteur ou esclave. Ici, le terme désigne le personnel du roi sans préciser nécessairement son statut juridique; « serviteurs » préserve cette amplitude.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image agricole du texte et le caractère contraignant du prélèvement royal, tout en signalant l’ambiguïté de סָרִיס.
