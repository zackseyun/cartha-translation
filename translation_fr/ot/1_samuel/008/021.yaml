  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: fr
  text: Samuel entendit toutes les paroles du peuple et les rapporta à Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux oreilles de Yahweh », expression qui signifie « à son écoute » ou « en sa présence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le nom divin est YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre transcription française possible : « Yahvé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Le verbe שׁמע désigne ici simplement le fait que Samuel entend les paroles du peuple; « entendit » convient naturellement au récit.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: toutes les paroles du peuple
  rationale: Cette formulation conserve la totalité exprimée par כָּל et la valeur concrète de דִּבְרֵי, tout en restant claire en français.
- source_word: וַיְדַבְּרֵם
  choice: il les rapporta
  rationale: Le suffixe renvoie aux paroles du peuple. Dans ce contexte, « rapporta » exprime naturellement en français le fait que Samuel les communique à Yahweh, sans préciser davantage leur formulation.
- source_word: בְּאָזְנֵי
  choice: à
  rationale: L’expression hébraïque signifie littéralement « aux oreilles de » et désigne ce qui est dit à quelqu’un ou en sa présence. Le français naturel emploie ici « à »; l’image hébraïque est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription usuelle « Yahweh », qui conserve le nom divin plutôt que de lui substituer un titre.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: La forme française traditionnelle et courante du nom est retenue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin YHWH. « Yahweh » le représente comme un nom propre, tandis que « le SEIGNEUR » relève d’une tradition de substitution.
translation_notes:
  register: Français moderne, sobre et narratif. « Puis » explicite légèrement la succession portée par les formes narratives hébraïques. Le tour idiomatique hébreu est rendu naturellement dans le texte et conservé littéralement en note.
