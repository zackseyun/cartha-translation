  text: Then all the elders of Israel gathered together and came to Samuel at Ramah[a].
translation:
  language: fr
  text: Alors tous les anciens d’Israël se rassemblèrent et vinrent trouver Samuel à Rama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu indique littéralement un mouvement « vers Rama » ; ici, « à Rama » exprime naturellement le lieu de destination où se trouve Samuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: se rassemblèrent
  rationale: Le hitpael de קבץ exprime ici le fait de se réunir en groupe. « Se rassemblèrent » restitue naturellement cette valeur collective en français.
- source_word: כֹּל
  choice: tous
  rationale: « Tous » rend directement la totalité du groupe désigné, les anciens d’Israël.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Expression française courante dans le registre biblique pour désigner les responsables reconnus du peuple, sans réduire le terme à leur seul âge.
- source_word: וַיָּבֹאוּ אֶל
  choice: vinrent trouver
  rationale: בוא avec אֶל indique qu’ils se rendent auprès de Samuel. « Vinrent trouver » est idiomatique en français narratif et exprime clairement une démarche vers une personne.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: הָרָמָתָה
  choice: à Rama
  rationale: Le ה directionnel marque littéralement le mouvement vers Rama. En français, « à Rama » peut naturellement désigner à la fois la destination et le lieu où Samuel est trouvé.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Alors » marque la progression du récit ; « vinrent trouver » évite la tournure moins naturelle « vinrent à Samuel » tout en conservant le mouvement vers lui.
