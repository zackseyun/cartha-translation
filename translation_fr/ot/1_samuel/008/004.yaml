  text: וַ/יִּֽתְקַבְּצ֔וּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּבֹ֥אוּ אֶל שְׁמוּאֵ֖ל הָ/רָמָֽתָ/ה־׃
