  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: fr
  text: 'Mais le peuple refusa d’écouter Samuel[a] et dit : « Non ! Un roi régnera sur nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « refusa d’obéir à Samuel ». L’expression hébraïque « écouter la voix de » peut signifier tenir compte de quelqu’un ou lui obéir, et pas seulement l’entendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: refusa
  rationale: Le verbe מאן exprime un refus délibéré. Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne ici collectivement les Israélites qui réclament un roi ; « le peuple » est le rendu naturel et traditionnel.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: d’écouter la voix de
  rationale: Ce rendu conserve l’image de l’idiome hébreu, lequel peut aussi impliquer l’idée de tenir compte de quelqu’un ou de lui obéir. La note explicite cette nuance sans la résoudre dans le texte.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française usuelle du nom propre.
- source_word: וַיֹּאמְרוּ
  choice: et dit
  rationale: Le singulier collectif s’accorde naturellement avec « le peuple » en français ; אמר est le verbe courant signifiant « dire ».
- source_word: לֹא
  choice: Non !
  rationale: La négation isolée exprime un rejet énergique. Le point d’exclamation en rend la force dans le dialogue.
- source_word: כִּי אִם
  choice: Il y aura
  rationale: Après le refus autonome « Non ! », le contraste implicite est rendu naturellement par une nouvelle proposition affirmative, sans le calque peu idiomatique « mais ».
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: Il y aura un roi sur nous
  rationale: Le futur assertif traduit l’insistance du peuple, et « sur nous » préserve la formulation relationnelle de l’hébreu, qui évoque l’autorité royale.
