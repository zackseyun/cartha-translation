id: 1SA.8.20
reference: 1 Samuel 8:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיִ֥ינוּ גַם אֲנַ֖חְנוּ כְּ/כָל הַ/גּוֹיִ֑ם וּ/שְׁפָטָ֤/נוּ מַלְכֵּ֨/נוּ֙ וְ/יָצָ֣א לְ/פָנֵ֔י/נוּ וְ/נִלְחַ֖ם אֶת מִלְחֲמֹתֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: fr
  text: afin que nous aussi, nous soyons comme toutes les nations[a], que notre roi nous juge[b], qu’il marche à notre tête et qu’il combatte nos batailles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et nous serons comme toutes les nations » : la forme hébraïque peut être rendue plus littéralement comme la suite d’actions futures, bien qu’elle exprime probablement ici le but de la demande du peuple.'
    reason: lexical_alternative
  - marker: b
    text: « Nous juge » peut aussi avoir le sens plus large de « nous gouverne » ou « règne sur nous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ
  choice: afin que… nous soyons
  rationale: Dans le contexte de la demande formulée au verset précédent, la forme poursuit l’expression du but recherché. « Afin que » rend naturellement cette valeur en français, tandis que la possibilité d’une suite au futur est signalée en note.
- source_word: גַם אֲנַחְנוּ
  choice: nous aussi, nous
  rationale: 'Le redoublement du pronom, idiomatique en français, conserve l’insistance : Israël veut être, lui aussi, semblable aux autres peuples.'
- source_word: כְּכָל הַגּוֹיִם
  choice: comme toutes les nations
  rationale: « Nations » désigne ici les autres peuples et préserve la tension du désir d’Israël de leur ressembler, sans introduire le sens technique plus tardif de « païens ».
- source_word: וּשְׁפָטָנוּ
  choice: que notre roi nous juge
  rationale: Le verbe שׁפט peut signifier juger, gouverner ou exercer l’autorité. « Juger » maintient le lien lexical avec la fonction des juges dans le livre; la portée plus large est indiquée en note.
- source_word: מַלְכֵּנוּ
  choice: notre roi
  rationale: Le possessif explicite traduit directement le texte et souligne l’institution politique demandée par le peuple.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: qu’il marche à notre tête
  rationale: Cette expression française naturelle conserve l’image d’un roi allant devant le peuple, notamment comme chef militaire, sans la réduire au seul fait de le conduire hors d’un lieu.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: qu’il combatte nos batailles
  rationale: La formulation garde la construction apparentée de l’hébreu et exprime clairement le rôle militaire attendu du roi.
theological_decisions:
- issue: Sens de גּוֹיִם dans la demande d’un roi
  choice: nations
  alternative: païens
  rationale: Le passage compare Israël aux peuples environnants sur les plans politique et militaire. « Nations » traduit le terme dans ce contexte sans importer un emploi religieux ou technique plus tardif.
- issue: Portée de שׁפט appliqué au roi
  choice: juge
  alternative: gouverne
  rationale: « Juge » conserve le motif littéraire et théologique des juges, tout en laissant ouverte la portée gouvernementale du verbe, explicitée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe coordonnée suit le mouvement de l’hébreu. « Marche à notre tête » rend l’image de la direction publique et militaire de façon immédiatement compréhensible.
