source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע בְּ/קוֹלָ֑/ם אַ֗ךְ כִּֽי הָעֵ֤ד תָּעִיד֙ בָּ/הֶ֔ם וְ/הִגַּדְתָּ֣ לָ/הֶ֔ם מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: fr
  text: Maintenant donc, écoute-les. Toutefois, avertis-les solennellement et expose-leur les pratiques du roi qui régnera sur eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le droit du roi », « la règle du roi » ou « la manière d’agir du roi ». Le mot hébreu peut désigner le droit, la règle établie ou la pratique habituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: écoute-les
  rationale: L’expression signifie écouter ou prêter attention à quelqu’un, avec ici l’idée de donner suite à sa demande. La formulation française est naturelle sans impliquer que Samuel approuve cette demande.
- source_word: אַךְ כִּי
  choice: toutefois
  rationale: Cette locution introduit une forte réserve à l’ordre précédent. « Toutefois » marque clairement le contraste en français moderne.
- source_word: הָעֵד תָּעִיד
  choice: avertis-les solennellement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action, tandis que le verbe possède ici une dimension formelle de témoignage et de mise en garde.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: et expose-leur
  rationale: Le hiphil de נגד signifie faire connaître ou déclarer. « Expose-leur » convient à l’annonce détaillée qui suit dans le passage.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: les pratiques du roi
  rationale: מִשְׁפָּט peut désigner le droit, la règle, la manière d’agir ou la pratique établie. Le pluriel français « pratiques » annonce naturellement les actes et les prélèvements décrits aux versets suivants, sans les présenter d’emblée comme moralement légitimes.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: qui régnera sur eux
  rationale: Le verbe מלך désigne précisément l’exercice de la royauté; « régnera » conserve cette nuance royale.
theological_decisions:
- issue: 'Valeur de מִשְׁפַּט הַמֶּלֶךְ : droit légitime ou conduite royale décrite'
  choice: les pratiques du roi
  alternative: le droit du roi / la règle du roi / la manière d’agir du roi
  rationale: Les versets suivants décrivent les exigences pesantes du roi. « Pratiques » maintient la portée descriptive et le ton d’avertissement, sans décider si toutes ces prérogatives sont juridiquement ou divinement légitimes.
translation_notes:
  register: Français international moderne, clair et digne. « Écoute-les » évite le calque peu naturel « écoute leur voix ». « Expose-leur » prépare la description détaillée des versets suivants. La note conserve l’ambiguïté réelle de מִשְׁפָּט.
