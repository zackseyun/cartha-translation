  text: וְ/לֹֽא הָלְכ֤וּ בָנָי/ו֙ ב/דרכ/ו וַ/יִּטּ֖וּ אַחֲרֵ֣י הַ/בָּ֑צַע וַ/יִּ֨קְחוּ שֹׁ֔חַד וַ/יַּטּ֖וּ מִשְׁפָּֽט־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: fr
  text: Mais ses fils ne suivirent pas ses voies. Ils se détournèrent pour rechercher un profit malhonnête[a], acceptèrent des pots-de-vin et faussèrent la justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un gain injuste ». Le terme hébreu désigne un profit recherché de manière injuste ou au détriment d’autrui.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « firent dévier le jugement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכָיו
  choice: suivirent ... sa voie
  rationale: L’expression hébraïque « marcher dans la voie de quelqu’un » décrit la conduite. « Suivre sa voie » conserve l’image tout en restant naturel en français moderne.
- source_word: וַיִּטּוּ
  choice: ils se détournèrent
  rationale: Le verbe נטה exprime ici l’abandon d’une conduite droite et introduit la recherche d’un gain illicite.
- source_word: אַחֲרֵי הַבָּצַע
  choice: pour rechercher un profit malhonnête
  rationale: בצע désigne dans ce contexte un gain recherché ou obtenu de manière injuste, particulièrement dans le cadre de la corruption judiciaire. Cette formulation garde l’idée de profit et son caractère illicite.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: acceptèrent des pots-de-vin
  rationale: שֹׁחַד désigne précisément un présent corrupteur, notamment dans un contexte judiciaire. « Pots-de-vin » est l’expression française courante et exacte.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: faussèrent la justice
  rationale: L’expression hébraïque signifie faire dévier ou infléchir le jugement. « Fausser la justice » rend naturellement la portée judiciaire de l’accusation.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le masculin pluriel hébreu désigne ici les fils de Samuel.
theological_decisions:
- issue: Description morale et judiciaire des fils de Samuel
  choice: 'Présenter leur conduite comme une corruption judiciaire explicite : recherche de profit malhonnête, pots-de-vin et justice faussée.'
  alternative: Employer une accusation morale générale, telle que « ils étaient cupides » ou « ils agirent injustement ».
  rationale: L’hébreu accumule des termes précis relevant de la corruption judiciaire. La traduction conserve cette force juridique sans réduire le texte à un simple défaut de caractère.
translation_notes:
  register: Français international moderne, clair et digne. « Suivre sa voie » maintient discrètement la métaphore hébraïque; « pots-de-vin » et « fausser la justice » rendent avec précision et naturel le cadre judiciaire.
