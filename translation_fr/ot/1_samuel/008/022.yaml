base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: fr
  text: 'Yahweh dit à Samuel : « Écoute leur voix[a] et établis un roi pour eux. » Puis Samuel dit aux hommes d’Israël[b] : « Allez, chacun dans sa ville. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tiens compte de ce qu’ils disent » ou « Obéis à leur voix ». L’expression hébraïque peut signifier qu’il faut accéder à leur demande.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les hommes d’Israël ». L’expression peut désigner de manière représentative les Israélites réunis.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom propre présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: שְׁמַע בְּקוֹלָם
  choice: Écoute leur voix
  rationale: Cette formulation préserve l’expression hébraïque, qui implique ici d’accéder à leur demande; une note signale ce sens idiomatique.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: établis un roi pour eux
  rationale: Le hifil de מלך désigne l’action d’installer quelqu’un comme roi. « Établir un roi » exprime cette intronisation dans un français naturel et soutenu.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: La traduction conserve la formulation masculine explicite de l’hébreu, tout en signalant en note sa possible portée représentative.
- source_word: לְכוּ
  choice: Allez
  rationale: Impératif direct et naturel du verbe הלך.
- source_word: אִישׁ לְעִירוֹ
  choice: chacun dans sa ville
  rationale: אִישׁ a ici une valeur distributive. « Chacun dans sa ville » restitue la formule de renvoi avec un français idiomatique sans ajouter explicitement l’idée de domicile.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le Tétragramme; « Yahweh » en préserve la fonction de nom personnel.
- issue: Portée de l’ordre שְׁמַע בְּקוֹלָם
  choice: Conserver « Écoute leur voix » avec une note sur le sens d’obtempérer
  alternative: Écoute-les / Accède à leur demande / Obéis-leur
  rationale: L’expression peut désigner à la fois l’écoute et le fait de se conformer à la demande. Le texte principal maintient cette tension sans réduire le propos à une seule paraphrase.
- issue: Langage masculin dans אַנְשֵׁי יִשְׂרָאֵל et אִישׁ
  choice: les hommes d’Israël; chacun
  alternative: les Israélites; le peuple d’Israël; chaque personne
  rationale: Les formes hébraïques sont masculines. La formulation choisie les conserve sans exclure la possible fonction représentative du groupe assemblé.
translation_notes:
  register: Français international moderne, digne et direct. Les tours « établis un roi » et « chacun dans sa ville » gardent la couleur du texte hébreu tout en restant naturels. Les deux marqueurs de note figurent dans le texte principal à l’endroit correspondant.
