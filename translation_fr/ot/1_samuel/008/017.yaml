source:
  edition: WLC
  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: fr
  text: Il prélèvera un dixième de votre petit bétail, et vous deviendrez ses esclaves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le terme hébreu peut désigner des personnes au service d’un maître ; ici, le contexte d’exactions royales et de perte de liberté favorise « esclaves ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: votre petit bétail
  rationale: צֹאן désigne collectivement le petit bétail, surtout les moutons et les chèvres. « Petit bétail » conserve cette étendue de sens sans réduire le terme aux seuls moutons.
- source_word: יַעְשֹׂר
  choice: il prélèvera un dixième
  rationale: Le verbe exprime ici l’action de prendre le dixième. « Prélèvera un dixième » convient au contexte d’exactions royales et évite la connotation cultuelle ou volontaire que pourrait avoir « lèvera la dîme ».
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: et vous deviendrez ses
  rationale: L’hébreu dit littéralement qu’ils « seront à lui ». « Vous deviendrez ses » rend naturellement en français la condition qui résultera des prélèvements et de la domination du roi.
- source_word: לַעֲבָדִים
  choice: esclaves
  rationale: עֲבָדִים peut désigner des serviteurs ou des esclaves. Dans cet avertissement sur la sujétion coercitive au roi et la perte de liberté, « esclaves » exprime le mieux la gravité du propos.
theological_decisions:
- issue: Sens de עֲבָדִים dans le contexte de la sujétion royale
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte présente l’aboutissement oppressif des exigences du roi. « Esclaves » préserve la force de l’avertissement, tandis que la note signale l’autre traduction lexicalement possible sans imposer une catégorie théologique ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. « Petit bétail » est précis et courant dans un contexte biblique ou rural ; « prélever un dixième » rend l’exaction royale sans coloration cultuelle indue.
