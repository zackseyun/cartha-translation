  text: וְ/אֶת עַבְדֵי/כֶם֩ וְֽ/אֶת שִׁפְח֨וֹתֵי/כֶ֜ם וְ/אֶת בַּחוּרֵי/כֶ֧ם הַ/טּוֹבִ֛ים וְ/אֶת חֲמוֹרֵי/כֶ֖ם יִקָּ֑ח וְ/עָשָׂ֖ה לִ/מְלַאכְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: fr
  text: Il prendra vos serviteurs[a], vos servantes, vos meilleurs jeunes hommes et vos ânes, et les mettra à son service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos esclaves, hommes et femmes ». Les termes hébreux peuvent désigner plus largement des serviteurs, mais le contexte de réquisition imposée par le roi peut suggérer ici des personnes de condition servile.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: vos serviteurs
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. « Serviteurs » préserve cette amplitude sémantique en français, tandis qu’une note signale la possibilité de « esclaves » dans ce contexte de réquisition royale.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: vos servantes
  rationale: שִׁפְחָה désigne une servante, souvent de condition servile. « Servantes » est naturel et maintient le parallélisme avec « serviteurs », sans trancher au-delà de ce que le terme impose.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: vos meilleurs jeunes hommes
  rationale: בָּחוּר désigne un jeune homme dans la force de l’âge, et הַטּוֹבִים qualifie ici les meilleurs d’entre eux. La formulation conserve à la fois l’âge et la qualité.
- source_word: חֲמוֹרֵיכֶם
  choice: vos ânes
  rationale: « Ânes » est l’équivalent français courant et direct de חֲמוֹרִים.
- source_word: יִקָּח
  choice: il prendra
  rationale: Le futur français convient à la série d’actes royaux annoncés; « prendra » conserve le sens ordinaire de לקח tout en laissant le contexte exprimer la contrainte.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: et il les affectera à ses travaux
  rationale: L’expression indique que le roi mettra les personnes et les animaux au service de ses propres tâches. « Affectera à ses travaux » est idiomatique et fait ressortir cette appropriation de leur force de travail.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation évite l’archaïsme « servantes esclaves » et conserve dans le texte l’ambiguïté lexicale entre service et esclavage, explicitée en note.
