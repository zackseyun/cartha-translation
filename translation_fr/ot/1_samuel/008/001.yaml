  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר זָקֵ֖ן שְׁמוּאֵ֑ל וַ/יָּ֧שֶׂם אֶת בָּנָ֛י/ו שֹׁפְטִ֖ים לְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/001.yaml
  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: fr
  text: Lorsque Samuel eut vieilli, il nomma ses fils juges pour Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il nomma ses fils juges sur Israël ». Le verbe hébreu signifie littéralement « placer » ou « établir », et la préposition devant « Israël » peut être comprise comme « pour » ou, selon la façon dont cette nomination est envisagée, comme « sur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule narrative introduit ici une circonstance temporelle. « Lorsque » en rend naturellement la fonction sans reproduire lourdement l’expression littérale « et il arriva quand ».
- source_word: זָקֵן
  choice: devint vieux
  rationale: Le verbe exprime l’entrée dans la vieillesse ou le vieillissement, et non simplement un état statique.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: La forme française traditionnelle et courante du nom propre est conservée.
- source_word: וַיָּשֶׂם
  choice: établit
  rationale: Le verbe signifie littéralement « placer, mettre » ; dans ce contexte, « établir » exprime clairement l’attribution d’une fonction tout en restant proche de l’image hébraïque.
- source_word: אֶת בָּנָיו
  choice: ses fils
  rationale: L’hébreu désigne précisément les fils de Samuel.
- source_word: שֹׁפְטִים
  choice: juges
  rationale: Ce terme conserve la fonction judiciaire et gouvernementale propre au contexte du livre de Samuel.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: La préposition לְ peut ici indiquer ceux au service ou à l’égard desquels la fonction s’exerce. « Pour Israël » préserve cette formulation sans imposer exclusivement une nuance d’autorité.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et narrative ; « devint vieux » préserve la valeur dynamique du verbe hébreu, tandis que la note maintient l’ambiguïté de la préposition.
