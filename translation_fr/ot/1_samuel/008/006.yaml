  text: וַ/יֵּ֤רַע הַ/דָּבָר֙ בְּ/עֵינֵ֣י שְׁמוּאֵ֔ל כַּ/אֲשֶׁ֣ר אָמְר֔וּ תְּנָ/ה לָּ֥/נוּ מֶ֖לֶךְ לְ/שָׁפְטֵ֑/נוּ וַ/יִּתְפַּלֵּ֥ל שְׁמוּאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: fr
  text: 'Mais l’affaire parut mauvaise aux yeux de Samuel[a] quand ils dirent : « Donne-nous un roi pour nous juger[b]. » Alors Samuel pria Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement que l’affaire « fut mauvaise aux yeux de Samuel », formule qui exprime son jugement fortement négatif. On pourrait aussi traduire : « déplut à Samuel ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « juger » peut aussi avoir le sens plus large de « gouverner » ou « diriger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: parut mauvaise
  rationale: Conserve la force évaluative de la racine רעע, plutôt que de réduire la réaction de Samuel à un simple mécontentement, tout en donnant une formulation française intelligible.
- source_word: הַדָּבָר
  choice: l’affaire
  rationale: דָּבָר désigne ici ce qui vient d’être dit ou proposé. « L’affaire » reste assez général et évite de préciser davantage que l’hébreu.
- source_word: בְּעֵינֵי שְׁמוּאֵל
  choice: aux yeux de Samuel
  rationale: Reproduit l’image de l’idiome hébreu et indique clairement qu’il s’agit de l’évaluation de Samuel.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: quand ils dirent
  rationale: Rend la relation temporelle naturelle dans le récit sans imposer une causalité plus explicite que celle du texte.
- source_word: תְּנָה לָּנוּ
  choice: Donne-nous
  rationale: Rend directement l’impératif de נתן et la vigueur de la demande des anciens.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: Équivalent français usuel et précis de מֶלֶךְ dans ce contexte.
- source_word: לְשָׁפְטֵנוּ
  choice: pour nous juger
  rationale: Préserve le sens premier de שׁפט et le lien lexical avec le thème des juges dans le livre, tout en signalant en note son sens gouvernemental plus large.
- source_word: וַיִּתְפַּלֵּל
  choice: pria
  rationale: Équivalent naturel du hitpael de פלל; « intercéda » préciserait indûment l’objet de la prière.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Rend explicitement le nom divin יהוה conformément à la convention du projet; la construction française « pria Yahweh » exprime naturellement la direction de la prière.
theological_decisions:
- issue: Force de l’évaluation exprimée par וַיֵּרַע
  choice: parut mauvaise aux yeux de Samuel
  alternative: déplut à Samuel
  rationale: Le choix retenu garde la portée morale ou évaluative possible de l’hébreu ainsi que le point de vue de Samuel, sans affirmer que le narrateur ou Dieu qualifie directement la demande de mauvaise.
- issue: Portée de לְשָׁפְטֵנוּ
  choice: pour nous juger
  alternative: pour nous gouverner
  rationale: « Juger » conserve le lien avec la fonction de juge exercée par Samuel; la note maintient ouverte la portée plus large de gouverner ou diriger.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé sous la forme française « Yahweh », conformément à la convention fournie et sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve l’image hébraïque « aux yeux de Samuel » ainsi que la progression narrative. Le passé simple convient au registre narratif biblique sans être archaïque.
