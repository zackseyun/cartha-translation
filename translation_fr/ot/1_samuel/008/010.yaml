  yaml_path: translation/ot/1_samuel/008/010.yaml
  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: fr
  text: Samuel rapporta toutes les paroles de Yahweh au peuple qui lui demandait un roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui lui avait demandé un roi ». Le participe hébreu peut désigner soit une action en cours, soit le peuple caractérisé par cette demande.'
    reason: Alternative lexicale et aspectuelle du participe hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: rapporta
  rationale: Dans ce contexte, le verbe introduit la transmission au peuple de l’ensemble du message divin. « Rapporta » est naturel en français et conserve cette idée sans alourdir la phrase.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: toutes les paroles de Yahweh
  rationale: Cette formulation garde l’accent hébreu sur la totalité du message et rend visible l’expression biblique « les paroles de Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֶל הָעָם
  choice: au peuple
  rationale: L’hébreu dit simplement « au peuple » ; aucune précision telle que « d’Israël » n’est nécessaire.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: qui lui demandait un roi
  rationale: Le participe peut présenter la demande comme en cours ou caractéristique du peuple. Le singulier « demandait » s’accorde naturellement avec le collectif « peuple », et « lui » indique que la demande était adressée à Samuel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin ; « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Valeur temporelle du participe הַשֹּׁאֲלִים
  choice: qui lui demandait un roi
  alternative: qui lui avait demandé un roi
  rationale: Le participe hébreu ne fixe pas à lui seul une opposition stricte entre action en cours et demande antérieure. Le texte principal retient la valeur progressive ou caractéristique, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant idiomatique ; « rapporta » évite la raideur de « dit toutes les paroles », et le nom divin est conservé sous la forme « Yahweh ».
