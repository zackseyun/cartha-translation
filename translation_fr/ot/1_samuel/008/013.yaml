  text: וְ/אֶת בְּנוֹתֵי/כֶ֖ם יִקָּ֑ח לְ/רַקָּח֥וֹת וּ/לְ/טַבָּח֖וֹת וּ/לְ/אֹפֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/013.yaml
  text: He will take your daughters to be perfumers[a], cooks, and bakers.
translation:
  language: fr
  text: Il prendra vos filles pour en faire des préparatrices de parfums[a], des cuisinières et des boulangères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « préparatrices d’onguents ». Le terme hébreu peut désigner plus largement celles qui préparent des mélanges aromatiques, notamment des parfums ou des onguents.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וְאֶת
  choice: '[marqueur du complément d’objet direct, non traduit séparément]'
  rationale: Ce marqueur désigne « vos filles » comme complément direct du verbe « prendra » ; le français ne le rend pas par un mot distinct.
- source_word: בְּנוֹתֵיכֶם
  choice: vos filles
  rationale: Le pluriel construit de « fille », accompagné du suffixe de deuxième personne du masculin pluriel, désigne naturellement les filles des Israélites auxquels Samuel s’adresse.
- source_word: יִקָּח
  choice: il prendra
  rationale: L’imparfait hébreu a ici une valeur future dans l’avertissement de Samuel. « Prendra » conserve l’idée coercitive de réquisition au service du roi.
- source_word: לְרַקָּחוֹת
  choice: pour en faire des préparatrices de parfums
  rationale: Le terme féminin pluriel désigne des femmes qui composent des mélanges aromatiques, notamment des parfums ou des onguents. Cette formulation exprime clairement le métier sans le limiter excessivement.
- source_word: וּלְטַבָּחוֹת
  choice: des cuisinières
  rationale: Le nom féminin pluriel désigne des femmes chargées de préparer les aliments ; « cuisinières » est naturel et précis en français moderne.
- source_word: וּלְאֹפוֹת
  choice: des boulangères
  rationale: La forme féminine plurielle, dérivée du verbe « cuire au four », désigne celles qui font cuire le pain ; « boulangères » convient au contexte professionnel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « pour en faire » rend naturellement la réquisition en vue de fonctions déterminées, tandis que les noms féminins reflètent les formes féminines de l’hébreu.
