  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: fr
  text: 'Il dit : « Voici comment agira le roi qui régnera sur vous : il prendra vos fils[b] et les affectera pour ses chars[c] et parmi ses cavaliers ; ils courront devant ses chars. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: L’hébreu dit précisément « vos fils », ce qui correspond au contexte du service militaire royal.
    reason: cultural_note
  - marker: c
    text: L’hébreu porte le singulier « son char », qui peut être compris individuellement ou dans un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: pratique
  rationale: Dans ce contexte, le terme décrit la manière habituelle dont le roi agira envers le peuple. « Pratique » reste naturel et évite de présenter d’emblée ces actes comme un droit légitime, tout en signalant en note l’autre sens possible.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: le roi qui régnera sur vous
  rationale: Cette formulation conserve le champ lexical royal de מלך ainsi que l’idée d’autorité exercée sur le peuple.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: il prendra vos fils
  rationale: Le texte hébreu désigne précisément les fils, ce qui correspond ici au contexte du service militaire royal.
- source_word: וְשָׂם לוֹ
  choice: et les affectera
  rationale: Le verbe signifie ici placer ou assigner quelqu’un au service du roi. « Affectera » exprime cette attribution à une fonction de manière idiomatique.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: à ses chars
  rationale: Le singulier hébreu peut avoir un sens collectif. Le pluriel français convient naturellement à l’organisation militaire décrite.
- source_word: וּבְפָרָשָׁיו
  choice: et parmi ses cavaliers
  rationale: פָרָשִׁים désigne les cavaliers. « Parmi ses cavaliers » conserve la préposition et présente les fils comme intégrés à ce corps.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: ils courront devant ses chars
  rationale: La formulation rend l’image des coureurs royaux qui précèdent les véhicules du roi et maintient l’interprétation collective de « char ».
theological_decisions:
- issue: Valeur normative ou descriptive de מִשְׁפַּט
  choice: Le texte principal emploie « pratique », dans un sens descriptif.
  alternative: « Le droit du roi » ou « la règle du roi ».
  rationale: Le passage avertit le peuple de la conduite du futur roi. Traduire par « droit » risquerait de trancher en faveur d’une légitimité juridique que le contexte ne rend pas certaine ; une note préserve cette ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le ton solennel de l’avertissement tout en employant un vocabulaire courant. Le point-virgule distingue les affectations militaires du rôle particulier des coureurs royaux.
