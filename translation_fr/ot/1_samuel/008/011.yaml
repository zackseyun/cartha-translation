  terminology: « Régnera sur vous », « vos fils », « cavaliers » et « courront devant ses chars » conviennent au registre et au contexte. La note sur מִשְׁפָּט préserve utilement l’alternative « droit du roi » sans présenter ce droit comme incontestablement légitime.
