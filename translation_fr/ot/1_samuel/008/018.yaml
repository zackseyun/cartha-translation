  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: fr
  text: Ce jour-là, vous crierez à cause de votre roi, celui que vous vous êtes choisi, mais Yahweh ne vous répondra pas ce jour-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: vous crierez
  rationale: Le verbe זעק exprime un cri de détresse, souvent un appel au secours. « Vous crierez » reste naturel en français et préserve l’intensité sans préciser davantage l’objet de l’appel.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française naturelle, répétée comme dans l’hébreu afin de conserver l’insistance solennelle.
- source_word: מִלִּפְנֵי
  choice: à cause de
  rationale: 'Bien que l’expression signifie littéralement « de devant » ou « loin de la présence de », elle indique ici la cause du cri : les conséquences liées au roi.'
- source_word: מַלְכְּכֶם
  choice: du roi
  rationale: 'Le possessif est exprimé dans la proposition relative « que vous vous serez choisi », ce qui évite en français une formulation lourde tout en conservant le référent : leur propre roi.'
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: que vous vous serez choisi
  rationale: Le pronom réfléchi restitue לָכֶם et souligne la responsabilité d’Israël. Le futur antérieur situe le choix comme accompli avant le cri annoncé.
- source_word: וְלֹא יַעֲנֶה
  choice: mais ... ne vous répondra pas
  rationale: « Mais » rend la valeur adversative produite par le contraste entre le cri du peuple et l’absence de réponse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, plutôt que substitution par un titre.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Avec « répondre », le français courant construit ici directement la personne au moyen du pronom « vous ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Portée de la non-réponse divine
  choice: ne vous répondra pas ce jour-là
  alternative: ne vous exaucera pas ce jour-là
  rationale: « Répondre » conserve la formulation générale de ענה et n’interprète pas davantage la non-réponse comme un refus explicite d’accorder la demande.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition de « ce jour-là » reproduit l’insistance hébraïque. Aucun archaïsme ni tournure confessionnelle n’est introduit.
