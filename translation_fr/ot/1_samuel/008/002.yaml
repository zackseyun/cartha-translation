lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: s’appelait
  rationale: Dans cette formule de dénomination, le français idiomatique « s’appelait » rend naturellement l’hébreu littéral « le nom de… était », sans en modifier le sens.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: son fils aîné
  rationale: בֵּן désigne le fils et הַבְּכוֹר le premier-né dans l’ordre familial. « Fils aîné » est naturel en français moderne et conserve cette relation.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Transcription française traditionnelle et transparente du nom hébreu.
- source_word: מִשְׁנֵהוּ
  choice: le second
  rationale: Le terme indique celui qui vient en deuxième position; « fils » reste clairement sous-entendu grâce au parallélisme.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Transcription proche de la forme hébraïque, adaptée à la phonologie et à l’orthographe françaises.
- source_word: שֹׁפְטִים
  choice: Ils étaient juges
  rationale: Le participe masculin pluriel exprime la fonction durable exercée par les deux fils; cette formulation française est claire et directe.
- source_word: בִּבְאֵר שָׁבַע
  choice: à Beer-Shéba
  rationale: La préposition בְּ marque ici le lieu; « à » est l’usage français naturel devant un nom de ville. « Beer-Shéba » conserve les deux éléments du toponyme hébreu.
