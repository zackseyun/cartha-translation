  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: fr
  text: Il nommera des chefs de milliers et des chefs de cinquantaines[a] ; il affectera des hommes à labourer ses terres et à moissonner sa récolte[b], ainsi qu’à fabriquer son matériel de guerre[c] et l’équipement de ses chars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des commandants de milliers et des commandants de cinquantaines ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « labourer son labour et moissonner sa récolte », une tournure qui souligne que ce travail est accompli pour le roi.'
    reason: lexical_alternative
  - marker: c
    text: Ou « ses armes de guerre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: Il se nommera
  rationale: L’infinitif poursuit la description des actes du roi commencée au verset précédent. « Se nommer » exprime ici qu’il établira ces responsables à son propre service.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: des chefs de milliers et des chefs de cinquantaines
  rationale: « Chefs » rend שָׂר sans archaïsme, tandis que « milliers » et « cinquantaines » conservent les unités militaires et administratives hébraïques.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: de labourer ses terres
  rationale: La construction apparentée signifie littéralement « labourer son labour ». « Ses terres » rend naturellement le domaine agricole travaillé pour le roi.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: de moissonner sa récolte
  rationale: Cette formulation française conserve le complément apparenté et souligne que la récolte appartient au roi.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: de fabriquer son matériel de guerre
  rationale: כְּלֵי peut désigner des objets, des instruments ou des armes. « Matériel de guerre » maintient cette portée générale sans la réduire aux seules armes.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: et l’équipement de ses chars
  rationale: רֶכֶב désigne ici les chars ou la charrerie royale ; « équipement de ses chars » préserve le rapport génitif et reste naturel en français.
