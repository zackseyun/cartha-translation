  to: Il nommera des chefs de milliers et des chefs de cinquantaines[a] ; il affectera des hommes à labourer ses terres et à moissonner sa récolte[b], ainsi qu’à fabriquer son matériel de guerre[c] et l’équipement de ses chars.
