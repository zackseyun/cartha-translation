  source_fidelity: 'La formulation « Il se nommera » est fautive en français : elle signifie qu’il se donnera un nom à lui-même, non qu’il nommera des personnes à son service. Le texte hébreu décrit l’action du roi qui établit des responsables et affecte des personnes à des tâches agricoles et militaires. La révision rend cette structure sans ajouter de division explicite entre « les uns » et « les autres ».'
  naturalness: « Nommer » et « affecter des hommes à » sont naturels dans un français moderne et conservent le registre institutionnel et militaire du passage. « Chefs de milliers » et « chefs de cinquantaines » maintiennent volontairement la désignation des unités hébraïques.
  terminology: « Matériel de guerre » rend bien la portée large de כְּלֵי מִלְחַמְתּוֹ, tandis que « équipement de ses chars » préserve le génitif de כְּלֵי רִכְבּוֹ. La note b est ajustée pour refléter précisément les deux substantifs apparentés hébreux, « labour » et « récolte ».
