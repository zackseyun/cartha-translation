base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: fr
  text: 'David dit à Ahimélek : « N’as-tu pas ici, à ta disposition[a], une lance ou une épée ? Je n’ai emporté avec moi ni mon épée ni mon équipement[b], car l’affaire du roi[c] était urgente. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous ta main » ; l’expression peut signifier « à ta disposition » ou « en ta possession ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mes armes » ; le terme hébreu peut désigner plus largement du matériel ou de l’équipement.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la mission du roi », « la parole du roi » ou « l’ordre du roi » ; le terme hébreu a un sens large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: David dit à Ahimélek
  rationale: Le passé simple convient au récit suivi en français et introduit naturellement le discours direct. Le nom propre est translittéré sous la forme française Ahimélek.
- source_word: וְאִין יֶשׁ פֹּה
  choice: N’as-tu pas ici
  rationale: La double formulation existentielle hébraïque est rendue par une question négative naturelle en français.
- source_word: תַחַת יָדְךָ
  choice: à ta disposition
  rationale: Littéralement « sous ta main » ; l’équivalent idiomatique français exprime clairement ce qui se trouve à la disposition ou en la possession d’Ahimélek.
- source_word: חֲנִית אוֹ חָרֶב
  choice: une lance ou une épée
  rationale: Traduction directe des deux noms d’armes au singulier.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי לֹא לָקַחְתִּי בְיָדִי
  choice: Je n’ai emporté avec moi ni mon épée ni mon équipement
  rationale: La corrélation négative « ni… ni… » rend naturellement la portée de la négation avec les deux éléments. « Emporté avec moi » transpose l’expression concrète « pris dans ma main » sans suggérer que David tenait normalement tout son matériel dans une seule main.
- source_word: כֵּלַי
  choice: mon équipement
  rationale: Le terme désigne largement des objets, instruments ou pièces d’équipement ; dans ce contexte, l’équipement militaire est probable, mais le terme général préserve l’étendue lexicale.
- source_word: דְבַר הַמֶּלֶךְ
  choice: l’affaire du roi
  rationale: דבר peut désigner une parole, une affaire, une mission ou un ordre. « L’affaire du roi » conserve mieux cette latitude que « l’ordre ».
- source_word: נָחוּץ
  choice: urgente
  rationale: Exprime clairement le caractère pressant de la situation en français moderne.
theological_decisions: []
