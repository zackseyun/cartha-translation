source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: fr
  text: 'Akish dit à ses serviteurs : « Regardez : vous voyez un homme qui se comporte comme un fou[a]. Pourquoi me l’amenez-vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un homme pris de folie » ou « un fou ». Le participe hébreu peut décrire aussi bien une folie réelle qu’un comportement présenté comme de la folie.'
    reason: Alternative lexicale préservant l’ambiguïté du participe hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple convient au récit français et rend naturellement le wayyiqtol narratif sans préciser davantage le lien logique avec ce qui précède.
- source_word: אָכִישׁ
  choice: Akish
  rationale: Translittération française courante du nom propre hébreu.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce cadre royal, le terme désigne des hommes au service du roi; « serviteurs » reste direct et naturel, tout en pouvant inclure des courtisans ou des officiers.
- source_word: הִנֵּה תִרְאוּ
  choice: Regardez ! Vous voyez bien
  rationale: « Regardez ! » restitue l’appel à l’attention de הִנֵּה, tandis que « vous voyez bien » conserve le verbe pluriel תִרְאוּ et la force d’une évidence signalée aux serviteurs.
- source_word: אִישׁ
  choice: un homme
  rationale: Rend explicitement le nom hébreu sans le généraliser en « quelqu’un ».
- source_word: מִשְׁתַּגֵּעַ
  choice: qui se comporte comme un fou
  rationale: Le participe hitpael décrit un comportement de folie et, dans le contexte, permet de maintenir l’ambiguïté entre folie réelle et folie jouée.
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: Pourquoi me l’amenez-vous ?
  rationale: Le présent français rend directement l’imparfait hébreu dans cette question vive et convient à la situation où l’homme est conduit devant Akish; l’ordre des pronoms est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, oral mais digne. La réplique vive d’Akish est rendue sans archaïsme; « se comporte comme un fou » évite de trancher entre un état réel et un comportement simulé.
