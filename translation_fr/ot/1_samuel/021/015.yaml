  source_fidelity: 'Le sens est globalement fidèle : Akish s’adresse à ses serviteurs, attire leur attention sur un homme au comportement de fou, puis demande pourquoi ils le lui amènent. Le présent « amenez-vous » rend de façon défendable l’imparfait hébreu dans cette question directe. Toutefois, « bien » introduit une nuance d’insistance explicite qui n’est pas nécessairement portée par תִרְאוּ ; l’attention est déjà exprimée par הִנֵּה (« Regardez »).'
  naturalness: 'Le français est naturel, moderne et adapté à une réplique vive. « Regardez : vous voyez un homme… » est plus sobre et plus proche de la construction hébraïque que « Regardez ! Vous voyez bien… », tout en restant idiomatique.'
  terminology: « Serviteurs » convient au personnel royal sans restreindre indûment le terme à des esclaves ou à des officiers. « Se comporte comme un fou » rend bien le participe hitpael et évite de décider si la folie est réelle ou feinte. « Akish » est une translittération française moderne acceptable.
