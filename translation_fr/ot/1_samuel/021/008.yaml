  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: fr
  text: Ce jour-là, un homme parmi les serviteurs de Saül se trouvait là, retenu devant Yahweh[a]. Il s’appelait Doëg l’Édomite et était le chef des bergers de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « empêché de partir devant Yahweh » ou « maintenu devant Yahweh ». L’hébreu ne précise pas pourquoi Doëg était retenu.
    reason: alternative lexicale préservant l’ambiguïté du texte hébreu
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: un homme parmi les serviteurs de Saül se trouvait là
  rationale: '« Parmi » exprime naturellement la valeur partitive de מִן : cet homme était l’un des serviteurs de Saül. « Se trouvait là » rend שָׁם dans un français narratif courant.'
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Formulation temporelle française idiomatique qui conserve la référence précise au jour en question.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: retenu devant Yahweh
  rationale: Le participe passif évoque le fait d’être retenu, empêché de partir ou maintenu sur place, sans en préciser la raison. La formulation garde volontairement cette indétermination.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: Il s’appelait Doëg l’Édomite
  rationale: Rend naturellement la formule hébraïque du nom et emploie les formes françaises usuelles du nom propre et du gentilé.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: le chef des bergers de Saül
  rationale: Dans ce contexte, אַבִּיר désigne vraisemblablement le personnage principal ou supérieur parmi les bergers plutôt que le plus fort physiquement. La relative possessive est intégrée naturellement à « bergers de Saül ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de נֶעְצָר לִפְנֵי יְהוָה
  choice: retenu devant Yahweh
  alternative: empêché de partir devant Yahweh ; maintenu devant Yahweh
  rationale: Le contexte peut être cultuel ou rituel, mais le verset n’indique ni la cause ni la nature exacte de cette rétention. Le texte principal et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, sans archaïsmes. « Serviteurs » conserve la portée large de עֲבָדִים, tandis que « chef » exprime sobrement le rang suggéré par אַבִּיר.
