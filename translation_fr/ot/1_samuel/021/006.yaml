- from: 'David répondit au prêtre : « Oui, nous nous sommes tenus éloignés des femmes[a] comme d’habitude avant mon départ[b]. Les affaires des jeunes gens sont saintes[c], bien que ce soit un voyage ordinaire. À plus forte raison seront-elles aujourd’hui sanctifiées dans le contenant[d]. »'
  to: 'David répondit au prêtre et lui dit : « Oui, nous nous sommes abstenus de femmes[a] comme hier et avant-hier[b], lorsque je suis parti, et le matériel des jeunes gens est consacré[c], bien qu’il s’agisse d’un voyage ordinaire. À plus forte raison, aujourd’hui, cela sera sanctifié dans le matériel[d]. »'
  rationale: La révision restitue l’allusion temporelle aux jours précédents, sans lui attribuer le sens d’une habitude. Elle remplace des choix français opaques par « matériel » et évite de fixer artificiellement le sujet du dernier verbe. Les notes conservent les principales ambiguïtés lexicales et syntaxiques du texte hébreu.
