  text: וַ/יַּעַן֩ דָּוִ֨ד אֶת הַ/כֹּהֵ֜ן וַ/יֹּ֣אמֶר ל֗/וֹ כִּ֣י אִם אִשָּׁ֤ה עֲצֻֽרָה לָ֨/נוּ֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם בְּ/צֵאתִ֕/י וַ/יִּהְי֥וּ כְלֵֽי הַ/נְּעָרִ֖ים קֹ֑דֶשׁ וְ/הוּא֙ דֶּ֣רֶךְ חֹ֔ל וְ/אַ֕ף כִּ֥י הַ/יּ֖וֹם יִקְדַּ֥שׁ בַּ/כֶּֽלִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: fr
  text: 'David répondit au prêtre et lui dit : « Oui, nous nous sommes abstenus de femmes[a] comme hier et avant-hier[b], lorsque je suis parti, et le matériel des jeunes gens est consacré[c], bien qu’il s’agisse d’un voyage ordinaire. À plus forte raison, aujourd’hui, cela sera sanctifié dans le matériel[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme nous est tenue éloignée » ou « une femme nous est interdite ». L’expression désigne ici l’abstinence sexuelle en vue d’un état rituellement approprié.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme hier, avant-hier ». Cet idiome renvoie aux jours précédents; certains le comprennent plus précisément comme « depuis environ trois jours ».'
    reason: lexical_alternative
  - marker: c
    text: Le terme rendu par « matériel » peut désigner les objets ou l’équipement des jeunes gens; certains y voient un euphémisme pour leur corps ou leur personne.
    reason: lexical_alternative
  - marker: d
    text: 'La fin du verset est très difficile en hébreu. On peut aussi comprendre : « même si le voyage est ordinaire, aujourd’hui cela sera consacré quant au matériel », ou de manière semblable. Le mot rendu ici par « matériel » est le même que celui rendu plus haut par « matériel », mais il est au singulier dans cette dernière expression.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: nous nous sommes tenus éloignés des femmes
  rationale: Cette formulation française naturelle exprime l’abstinence sexuelle requise dans ce contexte rituel, tout en laissant à la note la construction littérale, plus ambiguë.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: comme d’habitude avant mon départ
  rationale: L’expression idiomatique renvoie aux jours précédents et probablement à la pratique habituelle lors d’un départ; elle ne permet pas d’imposer avec certitude un compte exact de trois jours.
- source_word: כְלֵי הַנְּעָרִים
  choice: les affaires des jeunes gens
  rationale: כְלִי peut désigner des objets, du matériel ou, par euphémisme, les corps ou personnes. « Affaires » demeure concret sans réduire entièrement l’ambiguïté.
- source_word: קֹדֶשׁ
  choice: saintes
  rationale: Le terme exprime ici un état de sainteté ou de consécration rituelle, et non simplement la propreté.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: bien que ce soit un voyage ordinaire
  rationale: חֹל signifie ici « commun, ordinaire », par contraste avec ce qui est saint, sans connotation de faute morale.
- source_word: וְאַף כִּי
  choice: À plus forte raison
  rationale: La locution peut marquer un renforcement logique, même si la syntaxe de toute la proposition demeure difficile.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: seront-elles aujourd’hui sanctifiées
  rationale: Le passif rend la valeur contextuelle probable du verbe et l’accord au pluriel reprend naturellement « les affaires » en français.
- source_word: בַּכֶּלִי
  choice: dans le contenant
  rationale: « Contenant » garde le sens fondamental de כְּלִי et son lien lexical avec le terme précédent, sans décider s’il s’agit d’un objet, du matériel ou d’un emploi figuré.
theological_decisions:
- issue: Pureté rituelle liée à l’abstinence et aux pains consacrés
  choice: Employer le vocabulaire de sainteté et de sanctification rituelles.
  alternative: Interpréter la déclaration comme portant principalement sur la pureté morale ou la simple propreté matérielle.
  rationale: Le contexte oppose le saint au commun et concerne l’aptitude à recevoir du pain consacré. La traduction n’importe pas de catégories doctrinales ultérieures.
- issue: Rapport entre les affaires des hommes, le voyage ordinaire et la sanctification présente
  choice: Conserver la progression argumentative tout en signalant en note l’obscurité syntaxique.
  alternative: Résoudre explicitement le passage comme une référence certaine aux corps, aux armes, aux sacs ou au récipient du pain.
  rationale: L’hébreu est difficile et ne permet pas d’identifier sûrement le référent de כְּלִי ni tous les rapports syntaxiques.
translation_notes:
  register: Français international moderne, digne et lisible. « Jeunes gens » convient au récit ancien sans archaïsme excessif. Les formulations trop littérales « vases » et « dans le vase » ont été évitées dans le texte principal, car elles seraient opaques ou trompeuses en français contemporain; les ambiguïtés lexicales et syntaxiques sont néanmoins conservées dans les notes.
