  terminology: « Consacré » rend naturellement le statut cultuel de קֹדֶשׁ en français moderne; « sanctifié » maintient la valeur verbale de יִקְדַּשׁ. La formulation sur les femmes exprime l’abstinence sans transformer ce statut rituel en jugement moral.
