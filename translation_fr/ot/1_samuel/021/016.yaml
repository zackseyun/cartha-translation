  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: fr
  text: Est-ce que je manque de fous, pour que vous m’ayez amené celui-ci afin qu’il fasse le fou devant moi[a] ? Celui-ci va-t-il entrer dans ma maison ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’il se comporte comme un fou devant moi ». L’infinitif hébreu peut désigner plus généralement un comportement insensé ; le contexte suggère toutefois une folie simulée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: Est-ce que je manque de fous
  rationale: La tournure prédicative hébraïque forme une question rhétorique sarcastique. « Manquer de fous » en conserve la vigueur et reste naturel en français.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: vous m’ayez amené celui-ci
  rationale: Le démonstratif répété a une valeur dédaigneuse. « Celui-ci » préserve ce ton sans ajouter une nuance absente du texte; le pronom « m’ » rend naturellement en français la destination impliquée et explicitée par « devant moi ».
- source_word: לְהִשְׁתַּגֵּעַ
  choice: faire le fou
  rationale: L’infinitif hitpael décrit ici un comportement de folie. « Faire le fou » convient au contexte de la folie simulée sans affirmer explicitement l’intention dans le verset.
- source_word: עָלָי
  choice: devant moi
  rationale: Dans ce contexte, la préposition désigne un comportement qui se déroule en présence du roi et sous ses yeux, plutôt qu’une action hostile « contre » lui.
- source_word: הֲזֶה יָבוֹא אֶל בֵּיתִי
  choice: Celui-ci va-t-il entrer dans ma maison ?
  rationale: La reprise de « celui-ci » conserve l’insistance méprisante. « Entrer dans ma maison » exprime clairement le mouvement vers l’intérieur de la maison ou maisonnée royale.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le sarcasme d’Akish et la répétition méprisante du démonstratif sont conservés. « Faire le fou » est idiomatique et garde ouverte, dans la formulation même, la distinction entre folie réelle et comportement simulé.
