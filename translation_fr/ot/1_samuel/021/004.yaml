base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: fr
  text: Et maintenant, qu’as-tu sous la main[a] ? Donne-moi cinq pains[b], ou ce qui est disponible[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’y a-t-il sous ta main ? » Expression hébraïque désignant ce qui est immédiatement disponible ou en la possession de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « donne cinq pains dans ma main » ; c’est-à-dire : « donne-m’en ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ce qui se trouve » ; littéralement : « ce qui est trouvé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la coordination avec ce qui précède et la transition vers une demande immédiate, dans un français naturel.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: qu’as-tu sous la main
  rationale: L’expression hébraïque désigne ce qui est immédiatement disponible ou en possession de quelqu’un. « Avoir sous la main » est un équivalent idiomatique français proche de l’image source.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: cinq pains
  rationale: Le nom hébreu « pain » est employé collectivement avec le nombre cinq. Le français compte naturellement ici des pains individuels.
- source_word: תְּנָה בְיָדִי
  choice: Donne-moi
  rationale: Littéralement, la demande porte sur le fait de donner « dans ma main ». Le pronom indirect français exprime naturellement ce transfert sans lourdeur.
- source_word: אוֹ הַנִּמְצָא
  choice: ou ce qui se trouvera
  rationale: Cette formulation garde la valeur du participe passif de מצא, « ce qui est trouvé / se trouve », ainsi que l’expression elliptique du texte, sans préciser qu’il s’agit nécessairement d’un autre aliment.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La question et l’impératif restent simples, conformément au caractère pressant de la scène. « Sous la main » préserve l’image hébraïque tout en étant idiomatique en français ; la dernière proposition conserve l’ellipse et une part de l’ambiguïté de l’original.
