  text: וַ/יָּבֹ֤א דָוִד֙ נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ הַ/כֹּהֵ֑ן וַ/יֶּחֱרַ֨ד אֲחִימֶ֜לֶךְ לִ/קְרַ֣את דָּוִ֗ד וַ/יֹּ֤אמֶר ל/וֹ֙ מַדּ֤וּעַ אַתָּה֙ לְ/בַדֶּ֔/ךָ וְ/אִ֖ישׁ אֵ֥ין אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: fr
  text: 'David se rendit à Nob, auprès du prêtre Ahimélek. Ahimélek vint à sa rencontre en tremblant et lui demanda : « Pourquoi es-tu seul, sans personne avec toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: se rendit
  rationale: Exprime naturellement en français le déplacement de David vers Nob, sans surtraduire le simple verbe « venir/entrer ».
- source_word: וַיֶּחֱרַד
  choice: en tremblant
  rationale: Conserve l’image physique et l’intensité du verbe hébreu, qui peut également évoquer l’effroi ou une vive inquiétude.
- source_word: לִקְרַאת דָּוִד
  choice: vint à sa rencontre
  rationale: Rend l’idée d’aller au-devant de David dans un français idiomatique.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: sans personne avec toi
  rationale: L’hébreu emploie littéralement « aucun homme », mais le sens contextuel est l’absence de tout accompagnateur; « personne » est naturel et inclusif en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la réaction troublée d’Ahimélek sans préciser la cause de sa peur, que le texte ne donne pas.
