  text: וַ/יָּ֣קָם דָּוִ֔ד וַ/יִּבְרַ֥ח בַּ/יּוֹם הַ/ה֖וּא מִ/פְּנֵ֣י שָׁא֑וּל וַ/יָּבֹ֕א אֶל אָכִ֖ישׁ מֶ֥לֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/011.yaml
  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: fr
  text: David se leva et s’enfuit ce jour-là pour échapper à Saül. Il se rendit auprès d’Akish, roi de Gath.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום signifie littéralement « se lever ». Cette formulation conserve la succession narrative sans lui donner le sens plus précis de « se mettre en route ».
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: ברח exprime directement l’idée de fuir et préserve ici l’urgence de l’action de David.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française naturelle qui conserve la précision du syntagme hébreu.
- source_word: מִפְּנֵי שָׁאוּל
  choice: loin de Saül
  rationale: Littéralement « de devant la face ou la présence de Saül » ; dans ce contexte, la locution indique que David fuit Saül. « Loin de Saül » rend clairement cette idée en français courant.
- source_word: וַיָּבֹא אֶל
  choice: il se rendit auprès de
  rationale: בוא avec אֶל peut signifier venir ou aller vers quelqu’un. « Se rendit auprès de » évite une perspective française maladroite tout en exprimant l’arrivée de David auprès d’Akish.
- source_word: אָכִישׁ
  choice: Akish
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: מֶלֶךְ גַּת
  choice: roi de Gath
  rationale: Le groupe construit identifie la fonction royale d’Akish ; l’apposition sans article est naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit historique écrit. La coordination hébraïque est légèrement structurée en deux phrases pour une lecture naturelle, sans modifier la succession des événements.
