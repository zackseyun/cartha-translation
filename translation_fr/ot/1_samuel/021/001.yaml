  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: fr
  text: Il se leva alors et partit, et Jonathan entra dans la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Il se leva alors
  rationale: Le qal wayyiqtol de קום exprime le fait de se lever et fait avancer le récit. « Alors » rend naturellement la succession narrative portée par וַ.
- source_word: וַיֵּלַךְ
  choice: et partit
  rationale: Le qal wayyiqtol de הלך signifie aller ou marcher. Dans cette scène de séparation, « partit » exprime idiomatiquement l’éloignement sans ajouter de destination.
- source_word: וִיהוֹנָתָן
  choice: tandis que Jonathan
  rationale: Le nom propre est rendu selon sa forme française usuelle. « Tandis que » marque naturellement le contraste entre les mouvements des deux personnages, sans imposer une opposition théologique.
- source_word: בָּא
  choice: entra
  rationale: Le qal accompli de בוא peut signifier venir ou entrer. Avec « la ville » comme destination, « entra » est naturel en français et évite de fixer inutilement le centre déictique par « vint ».
- source_word: הָעִיר
  choice: dans la ville
  rationale: עִיר peut désigner une ville ou une localité. « La ville » conserve la détermination du texte et correspond au registre narratif biblique courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le pronom « Il » conserve l’implicite de l’hébreu plutôt que de réintroduire le nom de David. La coordination hébraïque est rendue par « tandis que » pour une lecture française fluide et pour distinguer les trajectoires des deux personnages.
