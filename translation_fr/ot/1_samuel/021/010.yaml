  text: וַ/יֹּ֣אמֶר הַ/כֹּהֵ֗ן חֶרֶב֩ גָּלְיָ֨ת הַ/פְּלִשְׁתִּ֜י אֲשֶׁר הִכִּ֣יתָ בְּ/עֵ֣מֶק הָאֵלָ֗ה הִנֵּה הִ֞יא לוּטָ֣ה בַ/שִּׂמְלָה֮ אַחֲרֵ֣י הָ/אֵפוֹד֒ אִם אֹתָ֤/הּ תִּֽקַּח לְ/ךָ֙ קָ֔ח כִּ֣י אֵ֥ין אַחֶ֛רֶת זוּלָתָ֖/הּ בָּ/זֶ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אֵ֥ין כָּמ֖וֹ/הָ תְּנֶ֥/נָּה לִּֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: fr
  text: 'Le prêtre dit : « L’épée de Goliath, le Philistin, que tu as abattu dans la vallée d’Éla, la voici : elle est enveloppée dans un vêtement[a], derrière l’éphod. Si tu veux la prendre pour toi, prends-la, car il n’y a pas d’autre épée ici que celle-là. » David dit : « Elle n’a pas son pareil. Donne-la-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner un manteau ou une pièce d’étoffe.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: L’épée de Goliath, le Philistin
  rationale: Rend naturellement la relation construite et conserve l’identification ethnique en apposition.
- source_word: הִכִּיתָ
  choice: tu as abattu
  rationale: Dans ce contexte guerrier, נכה désigne le fait de frapper et de terrasser, sans qu’il soit nécessaire d’expliciter davantage le mode de mise à mort.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: dans la vallée d’Éla
  rationale: Forme française moderne et claire du nom géographique.
- source_word: הִנֵּה הִיא
  choice: la voici
  rationale: Restitue avec naturel la fonction déictique de הִנֵּה et l’accord avec l’épée.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: elle est enveloppée dans un vêtement
  rationale: לוּטָה exprime l’action d’envelopper ou de couvrir; שִׂמְלָה désigne un vêtement, souvent un vêtement extérieur. Le terme général évite de préciser indûment sa forme.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: derrière l’éphod
  rationale: Le sens spatial de אַחֲרֵי convient au contexte et « éphod » conserve le terme cultuel traditionnel.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: Si tu veux la prendre pour toi, prends-la
  rationale: Rend l’offre conditionnelle et permissive dans un français idiomatique tout en conservant l’idée de prise pour soi.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: car il n’y en a pas d’autre ici qu’elle
  rationale: Conserve explicitement l’exception marquée par זוּלָתָהּ et comprend בָּזֶה comme une indication du lieu présent.
- source_word: אֵין כָּמוֹהָ
  choice: Elle n’a pas son pareil
  rationale: Expression française naturelle qui traduit l’unicité ou l’excellence de l’épée sans choisir entre ces nuances.
- source_word: תְּנֶנָּה לִּי
  choice: Donne-la-moi
  rationale: Conserve l’impératif direct ainsi que le féminin grammatical du référent français « épée ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « La voici » évite l’archaïsme de « voici que »; « vêtement » maintient l’étendue sémantique du terme hébreu, avec les autres possibilités signalées en note.
