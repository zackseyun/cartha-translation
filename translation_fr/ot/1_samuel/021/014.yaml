base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: fr
  text: Alors il changea de comportement sous leurs yeux et fit le fou alors qu’il était entre leurs mains[a] ; il traça des marques sur les battants de la porte[b] et laissa couler sa salive sur sa barbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « simula la folie ». Le verbe hébreu décrit un comportement insensé ; le contexte indique que David agit ainsi volontairement.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est difficile. On peut aussi comprendre : « griffa » ou « griffonna sur les battants de la porte ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: il changea de comportement
  rationale: טַעַם peut désigner le discernement ou la raison ; dans cette scène, l’expression vise l’attitude observable de David. « Comportement » évite d’affirmer qu’il a réellement perdu la raison.
- source_word: בְּעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Cette expression française naturelle conserve l’image vive de l’idiome hébreu et signifie « en leur présence ».
- source_word: וַיִּתְהֹלֵל
  choice: fit le fou
  rationale: Le hitpael décrit ici un comportement de personne démente. « Fit le fou » est naturel et, dans le contexte, laisse comprendre que David joue ce rôle sans intégrer cette conclusion directement au sens lexical du verbe.
- source_word: בְּיָדָם
  choice: entre leurs mains
  rationale: La traduction garde l’image hébraïque, qui peut aussi suggérer que David se trouve en leur pouvoir.
- source_word: ויתו
  choice: il traça des marques
  rationale: La forme verbale est difficile. Cette formulation prudente décrit l’action sans trancher entre griffer, gratter et griffonner.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: les battants de la porte
  rationale: « Battants » rend le pluriel דְּלָתוֹת et désigne naturellement les panneaux mobiles de la porte.
- source_word: וַיּוֹרֶד רִירוֹ
  choice: laissa couler sa salive
  rationale: La tournure française exprime naturellement le mouvement descendant causé ou permis par David.
- source_word: אֶל־זְקָנוֹ
  choice: sur sa barbe
  rationale: Dans ce contexte de mouvement, אֶל indique que la salive descend jusque sur la barbe.
theological_decisions:
- issue: La folie de David était-elle réelle ou simulée ?
  choice: « fit le fou » présente un comportement observable et délibéré dans le contexte
  alternative: « devint fou » ou « feignit la folie »
  rationale: Le récit indique une conduite intentionnelle, mais le verbe lui-même décrit surtout le comportement. La traduction évite donc aussi bien de présenter une perte réelle de raison que d’ajouter explicitement « feignit » au texte principal.
translation_notes:
  register: Français international actuel, clair et digne. « Fit le fou » est idiomatique sans être relâché dans ce contexte narratif. La syntaxe conserve la progression vive des actions hébraïques, tandis que les notes signalent les deux principales incertitudes lexicales.
