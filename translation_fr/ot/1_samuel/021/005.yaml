base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: fr
  text: 'Le prêtre répondit à David : « Je n’ai pas de pain ordinaire sous la main, mais il y a du pain consacré, à condition que les jeunes hommes se soient tenus éloignés des femmes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’une femme »; il s’agit de s’être abstenu de relations sexuelles en vue de la pureté rituelle.'
    reason: Préciser la forme singulière de l’hébreu et le sens contextuel sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: pain ordinaire
  rationale: חֹל s’oppose ici à קֹדֶשׁ et désigne un pain non consacré, sans connotation morale négative. « Pain ordinaire » exprime naturellement ce contraste cultuel.
- source_word: אֶל תַּחַת יָדִי
  choice: sous la main
  rationale: L’expression signifie que le pain est disponible ou en possession du prêtre. « Sous la main » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: כִּי אִם
  choice: mais
  rationale: Dans cette construction, la locution introduit l’exception qui contraste avec l’absence de pain ordinaire.
- source_word: לֶחֶם קֹדֶשׁ
  choice: pain consacré
  rationale: קֹדֶשׁ indique que le pain est mis à part pour l’usage cultuel. « Consacré » rend clairement cette catégorie en français courant.
- source_word: אִם נִשְׁמְרוּ
  choice: à condition que… se soient tenus éloignés
  rationale: Le niphal de שׁמר exprime ici le fait de s’être gardé de quelque chose. Cette tournure française transmet la condition et l’idée d’abstinence sans explicitation excessive.
- source_word: הַנְּעָרִים
  choice: les jeunes hommes
  rationale: נְעָרִים peut désigner des jeunes gens ou des accompagnateurs. « Jeunes hommes » préserve le sens lexical sans préciser indûment leur statut.
- source_word: אַךְ
  choice: à condition que
  rationale: La particule a ici une force restrictive liée à la condition. En français, la restriction est portée naturellement par l’ensemble « à condition que… se soient tenus éloignés des femmes », sans ajout maladroit de « seulement ».
- source_word: מֵאִשָּׁה
  choice: des femmes
  rationale: Le singulier אִשָּׁה après מִן peut avoir une valeur collective. « Des femmes » est idiomatique, tandis que la note précise le sens contextuel.
theological_decisions:
- issue: Condition de pureté rituelle pour recevoir le pain consacré
  choice: Présenter la remise du pain comme conditionnée par l’abstinence sexuelle des jeunes hommes, sans développer au-delà de l’hébreu.
  alternative: Expliciter dans le texte principal qu’ils se sont abstenus de relations sexuelles afin de rester rituellement purs.
  rationale: Le passage relève des catégories de sainteté et de pureté cultuelles; il ne formule pas un jugement général sur les femmes ni sur la sexualité. Le texte principal conserve donc la formulation concrète, et la note en éclaire la portée.
translation_notes:
  register: Français international moderne, naturel et digne. « Je n’ai pas… sous la main » restitue directement la parole du prêtre; « pain consacré » rend le contraste cultuel avec « pain ordinaire ». La formulation évite le terme plus chargé « profane » et maintient la condition sans surinterprétation.
