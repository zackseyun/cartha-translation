  to: 'Les serviteurs d’Akish lui dirent : « N’est-ce pas David, le roi du pays ? N’est-ce pas celui dont on chantait[a] au cours des danses : “Saül a abattu ses milliers, et David ses dizaines de milliers[b]” ? »'
