  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: fr
  text: 'Les serviteurs d’Akish lui dirent : « N’est-ce pas David, le roi du pays ? N’est-ce pas celui dont on chantait[a] au cours des danses : “Saül a abattu ses milliers, et David ses dizaines de milliers[b]” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, littéralement, « auquel on répondait dans les danses » ; le verbe peut désigner un chant responsorial.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « ses myriades » ou « ses dix milliers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Le terme désigne largement les hommes attachés à Akish, probablement des membres de sa maison ou de sa cour. « Serviteurs » en conserve l’étendue sans préciser indûment leur fonction.
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: Cette tournure conserve la forme interrogative et l’attente d’une réponse affirmative.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: le roi du pays
  rationale: La formulation reste proche de l’hébreu et ne décide pas si les serviteurs parlent d’un titre officiel, d’une perception populaire ou de manière hyperbolique.
- source_word: לָזֶה
  choice: celui dont
  rationale: Dans ce contexte, l’expression désigne David comme le sujet du chant. « Celui dont » est naturel en français.
- source_word: יַעֲנוּ
  choice: on chantait
  rationale: Dans un contexte de danses et de célébration, le verbe évoque un chant, possiblement responsorial. Le pronom « on » rend naturellement le sujet indéfini en français, tandis que la note conserve la nuance de réponse.
- source_word: בַמְּחֹלוֹת
  choice: pendant les danses
  rationale: Cette expression claire évoque les célébrations dansées au cours desquelles le chant était entonné.
- source_word: הִכָּה
  choice: a abattu
  rationale: Dans ce chant de victoire, le verbe renvoie à des ennemis vaincus et tués au combat. « A abattu » est direct, actuel et non archaïque.
- source_word: באלפו
  choice: ses milliers
  rationale: Cette formulation idiomatique conserve le chiffre attribué à Saül et le parallélisme du chant.
- source_word: ברבבתו
  choice: ses dizaines de milliers
  rationale: Le terme רְבָבָה désigne dix mille ou, au pluriel dans l’expression, des dizaines de milliers. Cette formulation est naturelle en français et maintient le contraste avec « milliers ».
theological_decisions:
- issue: Le statut de David dans l’expression « roi du pays »
  choice: Conserver « le roi du pays » sans explication interprétative dans le texte
  alternative: Préciser qu’il s’agit seulement de la perception ou de l’exagération des serviteurs philistins
  rationale: L’hébreu rapporte leurs paroles sans indiquer s’ils attribuent à David un règne officiel ou s’ils décrivent sa renommée de façon populaire ou hyperbolique. La traduction préserve cette tension narrative.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et le parallélisme du chant sont conservés. Le marqueur [a] est placé après le verbe auquel se rapporte réellement la variante lexicale.
