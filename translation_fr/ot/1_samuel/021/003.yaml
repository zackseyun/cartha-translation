  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/אֲחִימֶ֣לֶךְ הַ/כֹּהֵ֗ן הַ/מֶּלֶךְ֮ צִוַּ֣/נִי דָבָר֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אִ֣ישׁ אַל יֵ֧דַע מְא֛וּמָה אֶת הַ/דָּבָ֛ר אֲשֶׁר אָנֹכִ֥י שֹׁלֵֽחֲ/ךָ֖ וַ/אֲשֶׁ֣ר צִוִּיתִ֑/ךָ וְ/אֶת הַ/נְּעָרִ֣ים יוֹדַ֔עְתִּי אֶל מְק֥וֹם פְּלֹנִ֖י אַלְמוֹנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: fr
  text: 'David dit au prêtre Ahimélek : « Le roi m’a chargé d’une affaire et m’a dit : “Que personne ne sache quoi que ce soit[a] de l’affaire pour laquelle je t’envoie et dont je t’ai chargé.” Quant aux jeunes gens, je leur ai indiqué un certain endroit[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qu’aucun homme ne sache quoi que ce soit. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie littéralement « à tel-et-tel endroit » et désigne un lieu non précisé ou tenu secret.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: m’a confié une mission
  rationale: Le verbe צוה exprime l’ordre ou la charge confiée, et דָבָר désigne ici l’affaire dont David prétend avoir été chargé. « Confié une mission » rend naturellement en français la portée d’un mandat royal sans ajouter de contenu.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: Que personne ne sache quoi que ce soit
  rationale: Littéralement, la tournure dit qu’« aucun homme » ne doit savoir « quoi que ce soit ». En français moderne, « personne » exprime naturellement cette négation générale, tandis que « quoi que ce soit » conserve la force de מְאוּמָה.
- source_word: הַדָּבָר
  choice: la mission
  rationale: Dans ce contexte, דָּבָר renvoie à l’affaire ou à la tâche royale alléguée par David. « Mission » assure la cohérence avec la première proposition et convient à l’envoi mentionné ensuite.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: pour laquelle je t’envoie
  rationale: Cette formulation conserve le lien relatif entre la mission et l’envoi de David tout en restant idiomatique en français.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: et des instructions que je t’ai données
  rationale: La reprise de צוה évoque ici ce que le roi aurait ordonné à David. « Instructions » rend le contenu du mandat royal plus naturellement qu’une répétition lourde de « mission » ou de « commander ».
- source_word: וְאֶת־הַנְּעָרִים
  choice: Quant aux jeunes gens
  rationale: נְעָרִים peut désigner de jeunes hommes, des serviteurs ou des accompagnateurs. « Jeunes gens » préserve cette relative ouverture sémantique; la dislocation avec « quant à » reflète le changement de thème marqué par וְאֶת.
- source_word: יוֹדַעְתִּי
  choice: je leur ai indiqué
  rationale: Le hifil de ידע signifie fondamentalement « faire savoir ». Avec un lieu comme complément, « indiquer » offre un sens naturel sans aller jusqu’à l’idée plus interprétative de donner rendez-vous ou d’ordonner de se rendre quelque part.
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: tel ou tel endroit
  rationale: La locution redoublée désigne un endroit volontairement non précisé. « Tel ou tel endroit » garde la couleur idiomatique de l’hébreu et le caractère indéterminé ou confidentiel du lieu.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. Le discours direct garde un ton de mandat royal, sans archaïsmes. Les deux ambiguïtés principales sont maintenues : נְעָרִים reste « jeunes gens » plutôt que « serviteurs », et le lieu demeure volontairement indéterminé.'
