revisions:
- from: 'David dit au prêtre Ahimélek : « Le roi m’a confié une mission et m’a dit : “Que personne ne sache quoi que ce soit[a] de la mission pour laquelle je t’envoie et des instructions que je t’ai données.” Quant aux jeunes gens, je leur ai indiqué tel ou tel endroit[b]. »'
  to: 'David dit au prêtre Ahimélek : « Le roi m’a chargé d’une affaire et m’a dit : “Que personne ne sache quoi que ce soit[a] de l’affaire pour laquelle je t’envoie et dont je t’ai chargé.” Quant aux jeunes gens, je leur ai indiqué un certain endroit[b]. »'
  rationale: La révision rétablit les deux relatives qui se rapportent à une seule « affaire » et rend le double emploi du verbe « charger ». Elle remplace une expression française potentiellement distributive par « un certain endroit », dont la note explicite la valeur idiomatique hébraïque.
