  text: וַ/יָּ֧שֶׂם דָּוִ֛ד אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בִּ/לְבָב֑/וֹ וַ/יִּרָ֣א מְאֹ֔ד מִ/פְּנֵ֖י אָכִ֥ישׁ מֶֽלֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: fr
  text: David prit ces paroles à cœur[a] et il eut très peur d’Akish, roi de Gath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « David mit ces choses dans son cœur ». Cette expression hébraïque indique qu’il prit ces propos au sérieux et y réfléchit intérieurement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: prit ... à cœur
  rationale: L’expression française naturelle « prendre à cœur » conserve l’image du cœur et exprime ici le fait que David accueille intérieurement ces paroles et les prend au sérieux.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans le contexte immédiat, דְּבָרִים renvoie aux propos tenus par les serviteurs d’Akish au verset précédent; « paroles » est donc précis tout en restant fidèle.
- source_word: וַיִּרָא מְאֹד
  choice: il eut très peur
  rationale: Cette formulation courante restitue clairement l’intensification produite par מְאֹד sans archaïsme.
- source_word: מִפְּנֵי
  choice: de
  rationale: Avec le verbe « avoir peur », la préposition française idiomatique est « de »; elle rend ici le sens de crainte devant la personne d’Akish.
- source_word: אָכִישׁ
  choice: Akish
  rationale: Translittération française courante du nom propre hébreu.
- source_word: מֶלֶךְ גַּת
  choice: roi de Gath
  rationale: Le groupe construit hébreu est rendu directement; l’apposition sans article convient naturellement après le nom propre en français.
