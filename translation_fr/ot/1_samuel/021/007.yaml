  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: fr
  text: Alors le prêtre lui donna du pain consacré, car il n’y avait là aucun pain, si ce n’est le pain de la Présence[a], qu’on avait retiré de devant Yahweh pour y mettre du pain chaud le jour où on l’avait retiré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « les pains de proposition ». Littéralement : « le pain de la Présence ».'
    reason: Signaler l’appellation traditionnelle tout en indiquant le sens de l’expression hébraïque.
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: pain consacré
  rationale: Le nom signifie littéralement « chose sainte », mais le contexte désigne précisément le pain consacré. Cette formulation explicite naturellement le référent sans ajouter d’idée étrangère.
- source_word: לֶחֶם הַפָּנִים
  choice: le pain de la Présence
  rationale: Cette expression cultuelle désigne le pain placé devant Dieu. « Pain de la Présence » reste transparent pour le lecteur moderne et conserve le lien avec la présence divine mieux que l’appellation traditionnelle « pains de proposition ».
- source_word: הַמּוּסָרִים
  choice: qu’on avait retiré
  rationale: Le participe passif décrit le pain déjà ôté dans le cadre de son remplacement rituel. Une proposition relative avec le pronom indéfini « on » est naturelle en français et conserve le sens passif sans lourdeur.
- source_word: מִלִּפְנֵי יְהוָה
  choice: de devant Yahweh
  rationale: La formulation garde l’image spatiale et cultuelle de l’hébreu, selon laquelle le pain se trouvait devant Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre, conformément à sa fonction dans le texte hébreu.
- source_word: לֶחֶם חֹם
  choice: du pain chaud
  rationale: L’adjectif hébreu signifie directement « chaud ». Cette traduction laisse au contexte le soin de suggérer qu’il s’agissait de pain fraîchement préparé.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: le jour de son retrait
  rationale: La tournure nominale française rend avec concision l’expression temporelle hébraïque et évite une répétition maladroite de « retirer ».
- source_word: כִּי לֹא הָיָה שָׁם לֶחֶם כִּי אִם
  choice: car il n’y avait là aucun autre pain que
  rationale: Cette formulation exprime clairement à la fois la cause et l’exception indiquées par la construction hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom divin lui-même. Le conserver sous la forme « Yahweh » permet de distinguer ce nom personnel d’un titre, sans introduire d’interprétation confessionnelle.
translation_notes:
  register: Français international actuel, digne et accessible. « Pain consacré » évite l’ambiguïté de « pain saint », tandis que « pain de la Présence » conserve la terminologie cultuelle. La phrase suit étroitement la progression de l’hébreu tout en restant naturelle en français.
