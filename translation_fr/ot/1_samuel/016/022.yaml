base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: fr
  text: 'Alors Saül envoya dire à Jessé : « Que David reste, je te prie, à mon service[a], car il a trouvé grâce à mes yeux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se tienne devant moi »; l’expression peut désigner le fait de rester au service personnel du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי לֵאמֹר
  choice: Alors Saül envoya dire à Jessé
  rationale: Le wayyiqtol fait avancer le récit. « Envoya dire » rend naturellement en français la construction avec שׁלח et l’infinitif quotatif לֵאמֹר.
- source_word: יַעֲמָד נָא דָוִד לְפָנַי
  choice: Que David reste, je te prie, à mon service
  rationale: Le jussif de עמד accompagné de נָא formule une demande courtoise. Dans le cadre de la cour royale, « se tenir devant » désigne le fait de demeurer au service personnel du roi; « reste à mon service » communique ce sens clairement en français moderne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Saül et « car » convient au registre digne du discours direct.
- source_word: מָצָא חֵן בְּעֵינָי
  choice: il a trouvé grâce à mes yeux
  rationale: Cette formulation conserve l’expression imagée de l’hébreu et reste intelligible en français. Ici, « grâce » exprime l’approbation personnelle du roi, sans imposer un sens théologique technique.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: David / Saül / Jessé
  rationale: Formes françaises traditionnelles et largement reconnues des noms propres bibliques.
