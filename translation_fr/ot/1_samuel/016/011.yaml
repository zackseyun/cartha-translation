  to: 'Samuel demanda alors à Jessé : « Est-ce que ce sont tous les jeunes hommes ? » Jessé répondit : « Il reste encore le plus jeune, et le voici qui garde le troupeau[a]. » Samuel dit à Jessé : « Envoie quelqu’un le chercher et fais-le venir. Nous ne nous mettrons pas à table[b] jusqu’à ce qu’il arrive ici. »'
  rationale: La révision rétablit la valeur présentative de וְהִנֵּה par « le voici », améliore légèrement la fluidité du dialogue et rend עַד בֹּאוֹ פֹה par une tournure temporelle française plus directe. Elle préserve l’interprétation contextuelle de « se mettre à table » tout en conservant dans la note l’ambiguïté de לֹא נָסֹב.
