base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: fr
  text: 'Samuel demanda alors à Jessé : « Est-ce que ce sont tous les jeunes hommes ? » Jessé répondit : « Il reste encore le plus jeune, et le voici qui garde le troupeau[a]. » Samuel dit à Jessé : « Envoie quelqu’un le chercher et fais-le venir. Nous ne nous mettrons pas à table[b] jusqu’à ce qu’il arrive ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il fait paître le troupeau ». Le terme hébreu désigne collectivement un troupeau de moutons et de chèvres.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous ne prendrons pas place » ou « nous ne nous installerons pas ». Dans ce contexte, il s’agit probablement de ne pas commencer le repas ou la réunion officielle avant son arrivée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: Est-ce là tous les jeunes hommes ?
  rationale: תמם exprime ici l’idée d’un ensemble complet. Cette question idiomatique indique clairement que Samuel demande si tous les fils concernés lui ont été présentés, tandis que « jeunes hommes » rend la souplesse de נְעָרִים sans les qualifier d’enfants.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: Il reste encore le plus jeune
  rationale: עוֹד שָׁאַר souligne qu’un fils n’a pas encore été présenté, et הַקָּטָן désigne naturellement le benjamin dans ce contexte familial.
- source_word: וְהִנֵּה רֹעֶה בַּצֹּאן
  choice: il est en train de faire paître le troupeau
  rationale: La tournure progressive restitue la valeur continue du participe רֹעֶה. En français actuel, la ponctuation et la formulation rendent naturellement l’introduction de l’information portée par הִנֵּה, sans recourir au solennel « voici ».
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: Envoie quelqu’un le chercher et fais-le venir
  rationale: 'La formulation explicite les deux mouvements coordonnés : envoyer quelqu’un, puis faire venir le jeune homme. Elle évite l’ambiguïté française de « envoie-le », qui pourrait signifier que David lui-même doit être envoyé ailleurs.'
- source_word: לֹא נָסֹב
  choice: Nous ne nous mettrons pas à table
  rationale: Dans la scène du sacrifice et du repas, le verbe exprime vraisemblablement le fait de prendre place ou de s’installer. Cette formulation française est naturelle, tandis qu’une note conserve l’étendue de l’expression.
- source_word: עַד בֹּאוֹ פֹה
  choice: avant qu’il soit arrivé ici
  rationale: Cette proposition temporelle rend directement la limite indiquée par עַד et le mouvement vers le lieu où se trouve Samuel.
theological_decisions:
- issue: Portée de לֹא נָסֹב
  choice: Nous ne nous mettrons pas à table
  alternative: Nous ne prendrons pas place / nous ne nous installerons pas
  rationale: Le contexte favorise le repas sacrificiel, mais l’expression peut viser plus largement le fait de prendre place pour commencer la réunion. La note maintient cette nuance sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste direct et accessible. « Jessé » suit la forme française biblique établie ; « faire paître le troupeau » conserve le vocabulaire pastoral, et les notes signalent les nuances lexicales réelles sans alourdir le verset.
