source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח וַ/יְבִיאֵ֨/הוּ֙ וְ/ה֣וּא אַדְמוֹנִ֔י עִם יְפֵ֥ה עֵינַ֖יִם וְ/ט֣וֹב רֹ֑אִי וַ/יֹּ֧אמֶר יְהוָ֛ה ק֥וּם מְשָׁחֵ֖/הוּ כִּֽי זֶ֥ה הֽוּא־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: fr
  text: 'Il envoya donc le chercher et le fit venir. Il avait le teint rosé[a], de beaux yeux et une belle apparence. Yahweh dit : « Lève-toi, oins-le, car c’est lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il était roux ». Le mot hébreu indique une coloration rougeâtre sans préciser avec certitude s’il s’agit du teint ou des cheveux.
    reason: lexical_alternative
  - marker: b
    text: Ou « car c’est celui-là ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: Il envoya donc le chercher et le fit venir
  rationale: Les deux formes narratives font progresser le récit. Cette formulation française naturelle conserve le sujet implicite et évite d’ajouter le nom de David ou un messager absent de l’hébreu.
- source_word: אַדְמוֹנִי
  choice: avait le teint rosé
  rationale: Le mot évoque une coloration rougeâtre, probablement du teint, sans imposer la lecture plus précise « aux cheveux roux ». Une note conserve cette ambiguïté lexicale.
- source_word: עִם יְפֵה עֵינַיִם
  choice: de beaux yeux
  rationale: Rendu direct, idiomatique et fidèle de la description physique.
- source_word: וְטוֹב רֹאִי
  choice: une belle apparence
  rationale: La locution décrit un aspect agréable à voir sans lui attribuer de qualité morale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: קוּם מְשָׁחֵהוּ
  choice: Lève-toi, oins-le
  rationale: Les deux impératifs sont rendus avec concision. « Oins-le » conserve précisément le geste royal exprimé par משׁח.
- source_word: כִּי זֶה הוּא
  choice: car c’est lui
  rationale: Cette formule brève garde l’identification emphatique de l’hébreu; la variante « c’est celui-là » est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; conserver le nom propre évite de le remplacer par un titre.
- issue: Description extérieure de David
  choice: Conserver uniquement les traits physiques mentionnés
  alternative: Interpréter la rougeur comme une couleur de cheveux ou comme un symbole moral
  rationale: Le verset décrit l’apparence de David sans expliquer la portée de ces traits. La traduction ne leur ajoute donc aucune signification morale ou symbolique.
- issue: Identification divine כִּי זֶה הוּא
  choice: car c’est lui
  alternative: car c’est celui-là / car c’est le bon
  rationale: « C’est lui » préserve la brièveté et la force de l’identification sans expliciter davantage que l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La narration reste concise; « oins-le » est retenu comme terme biblique précis, tandis que les notes rendent accessibles les deux ambiguïtés lexicales réelles.
