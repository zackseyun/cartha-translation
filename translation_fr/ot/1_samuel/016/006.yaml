source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֔/ם וַ/יַּ֖רְא אֶת אֱלִיאָ֑ב וַ/יֹּ֕אמֶר אַ֛ךְ נֶ֥גֶד יְהוָ֖ה מְשִׁיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: fr
  text: 'Lorsqu’ils arrivèrent, Samuel vit Éliab et dit : « À coup sûr, l’oint de Yahweh[a] est devant Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son oint ». Le même mot hébreu peut aussi être rendu par « Messie » ; ici, il désigne l’homme que Samuel suppose choisi par Yahweh pour l’onction royale.'
    reason: Préserver le lien lexical avec « Messie » sans imposer au récit une portée théologique ultérieure.
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: Lorsqu’ils entrèrent
  rationale: La formule narrative וַיְהִי, suivie de בְּ et de l’infinitif construit, introduit ici le moment où Jessé et ses fils entrent en présence de Samuel. Cette formulation française actuelle en restitue naturellement la fonction temporelle sans archaïsme.
- source_word: וַיַּרְא אֶת־אֱלִיאָב
  choice: Samuel vit Éliab
  rationale: Le verbe ראה est rendu directement par « vit ». Le nom de Samuel, sujet implicite en hébreu, est repris en français afin d’éviter que « ils » soit compris comme sujet.
- source_word: וַיֹּאמֶר
  choice: et dit
  rationale: Le sens ordinaire de אמר est conservé. « Se dit » aurait explicitement présenté les paroles comme une pensée intérieure, nuance que l’hébreu ne marque pas.
- source_word: אַךְ
  choice: À coup sûr
  rationale: Dans ce contexte, אַךְ exprime la conviction immédiate et assurée de Samuel.
- source_word: מְשִׁיחוֹ
  choice: celui que Yahweh a consacré par l’onction
  rationale: Cette expression naturelle rend le sens royal immédiat de « son oint » tout en évitant que le lecteur moderne comprenne nécessairement une désignation messianique technique.
- source_word: נֶגֶד יְהוָה
  choice: se tient devant lui
  rationale: נֶגֶד יְהוָה signifie « devant Yahweh » ou « en présence de Yahweh ». Le pronom renvoie clairement à Yahweh, déjà nommé dans la même proposition, et évite une répétition peu naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par le titre « le Seigneur ».
theological_decisions:
- issue: Portée de מְשִׁיחוֹ dans le choix du futur roi
  choice: celui que Yahweh a consacré par l’onction
  alternative: son oint / son Messie
  rationale: Samuel croit reconnaître l’homme choisi pour recevoir l’onction royale. La traduction retient ce sens historique immédiat sans effacer le lien lexical avec le terme « Messie », signalé en note.
- issue: Référent de « devant lui »
  choice: le pronom renvoie à Yahweh
  alternative: répéter « devant Yahweh »
  rationale: Le texte hébreu nomme explicitement Yahweh après נֶגֶד. Le français emploie un pronom pour éviter la répétition, sans modifier le référent.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un large public ; « consacré par l’onction » explicite une expression biblique potentiellement obscure, tandis que la note conserve sa forme littérale et son prolongement messianique.
