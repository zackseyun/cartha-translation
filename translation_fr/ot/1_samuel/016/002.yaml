  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: fr
  text: 'Samuel dit : « Comment pourrais-je y aller ? Si Saül l’apprend, il me tuera. » Yahweh dit : « Tu prendras avec toi une jeune vache[a] et tu diras : “Je suis venu offrir un sacrifice à Yahweh.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une génisse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: Comment pourrais-je y aller ?
  rationale: La tournure française exprime naturellement l’objection de Samuel quant à la possibilité pratique de partir, sans réduire la question à l’itinéraire.
- source_word: וְשָׁמַע שָׁאוּל
  choice: Si Saül l’apprend
  rationale: Le waw suivi du parfait a ici une valeur conditionnelle. « L’apprend » rend naturellement l’idée que Saül serait informé du déplacement de Samuel.
- source_word: וַהֲרָגָנִי
  choice: il me tuera
  rationale: Le futur exprime la conséquence redoutée et présentée comme certaine si Saül apprend la nouvelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: עֶגְלַת בָּקָר
  choice: une jeune vache
  rationale: Cette expression courante et précise désigne une jeune femelle bovine; elle est plus immédiatement compréhensible en français moderne que le terme spécialisé « génisse ».
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Tu prendras avec toi
  rationale: Littéralement « tu prendras dans ta main »; « avec toi » restitue naturellement l’idiome hébreu.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: offrir un sacrifice à Yahweh
  rationale: Cette formulation française explicite naturellement la valeur cultuelle de זבח sans ajouter de détail rituel absent du texte.
- source_word: בָּאתִי
  choice: Je suis venu
  rationale: Le passé composé convient à une déclaration faite à l’arrivée et conserve la valeur accomplie du parfait hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Véracité de la raison donnée par Samuel
  choice: Traduction directe sans commentaire interprétatif
  alternative: Expliquer dans le texte qu’il s’agit d’une dissimulation ou d’une raison partielle
  rationale: Le verset rapporte l’ordre de Yahweh et la déclaration de Samuel sans résoudre explicitement la tension morale; la traduction conserve cette tension.
translation_notes:
  register: Français moderne, clair et digne. Le conditionnel dans la question rend l’objection inquiète de Samuel; le futur est conservé dans la menace et dans l’instruction divine. Le discours direct reste sobre et oralement naturel.
