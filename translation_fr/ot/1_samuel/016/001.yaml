  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: fr
  text: 'Yahweh dit à Samuel : « Jusqu’à quand vas-tu t’affliger au sujet de Saül, alors que je l’ai rejeté comme roi d’Israël ? Remplis ta corne d’huile et va. Je t’envoie auprès de Jessé, de Bethléem, car j’ai choisi pour moi un roi parmi ses fils[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai vu pour moi un roi parmi ses fils ». Dans ce contexte, le verbe « voir » peut exprimer le fait de reconnaître, de choisir ou de se pourvoir de quelqu’un.'
    reason: Conserver l’image hébraïque et signaler l’éventail de sens de רָאִיתִי sans imposer une seule nuance.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver son caractère de nom personnel.
- source_word: מִתְאַבֵּל אֶל שָׁאוּל
  choice: t’affliger au sujet de Saül
  rationale: Cette formulation exprime le deuil et la profonde tristesse de Samuel sans laisser entendre que Saül est déjà mort.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל יִשְׂרָאֵל
  choice: je l’ai rejeté pour qu’il ne règne plus sur Israël
  rationale: La traduction limite explicitement le rejet à la fonction royale, comme le fait le complément hébreu, sans en tirer de conclusion plus générale sur Saül.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: Remplis ta corne d’huile
  rationale: Le terme concret « corne » conserve l’image historique du récipient utilisé pour l’huile d’onction.
- source_word: אֶשְׁלָחֲךָ
  choice: Je t’envoie
  rationale: Le présent français rend naturellement la mission immédiate et décidée exprimée dans le discours direct.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: Jessé, le Bethléemite
  rationale: L’adjectif d’origine hébreu est conservé dans une forme française claire et traditionnelle.
- source_word: רָאִיתִי ... לִי
  choice: j’ai choisi pour moi
  rationale: Le verbe signifie littéralement « voir », mais l’expression désigne ici la reconnaissance ou la désignation divine d’un roi. « Choisi » communique ce sens contextuel en français naturel, tandis qu’une note conserve l’image littérale.
- source_word: בְּבָנָיו
  choice: parmi ses fils
  rationale: La préposition situe le roi désigné à l’intérieur du groupe formé par les fils de Jessé.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: L’indéfini respecte la forme hébraïque et le fait que le fils concerné n’est pas encore nommé.
theological_decisions:
- issue: Portée du rejet divin de Saül
  choice: je l’ai rejeté pour qu’il ne règne plus sur Israël
  alternative: je l’ai rejeté
  rationale: Le complément précise que le rejet concerne ici la royauté de Saül. La traduction n’étend donc pas l’énoncé à son statut spirituel ou à sa destinée ultime.
- issue: Sens de רָאִיתִי לִי dans la désignation du roi
  choice: j’ai choisi pour moi un roi
  alternative: j’ai vu pour moi un roi
  rationale: Le contexte de l’onction donne au verbe « voir » une valeur de reconnaissance ou de choix. La traduction principale rend cette valeur sans préciser lequel des fils est choisi ni développer davantage la nature de cette élection.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste ferme sans devenir archaïque. « S’affliger au sujet de » évite l’ambiguïté funéraire de « porter le deuil de », et « corne d’huile » préserve le cadre culturel du récit.
