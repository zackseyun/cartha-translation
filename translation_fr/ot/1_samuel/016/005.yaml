  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם לִ/זְבֹּ֤חַ לַֽ/יהוָה֙ בָּ֔אתִי הִֽתְקַדְּשׁ֔וּ וּ/בָאתֶ֥ם אִתִּ֖/י בַּ/זָּ֑בַח וַ/יְקַדֵּ֤שׁ אֶת יִשַׁי֙ וְ/אֶת בָּנָ֔י/ו וַ/יִּקְרָ֥א לָ/הֶ֖ם לַ/זָּֽבַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: fr
  text: 'Il répondit[a] : « Paix. Je suis venu offrir un sacrifice à Yahweh. Consacrez-vous et venez avec moi au sacrifice. » Puis il consacra Jessé et ses fils et les invita au sacrifice.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout va bien » ou « Je viens en paix ». L’hébreu dit simplement : « Paix », pour assurer que la venue de Samuel n’est pas hostile.'
    reason: Alternative lexicale et explication de l’emploi idiomatique de שָׁלוֹם.
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Paix
  rationale: Le nom isolé répond à la crainte exprimée au verset précédent et assure que la venue de Samuel est pacifique. « Paix » conserve la brièveté et l’étendue sémantique de l’hébreu; une note explicite l’emploi idiomatique.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: offrir un sacrifice à Yahweh
  rationale: L’infinitif exprime le but de la venue. En français courant, « offrir un sacrifice » est plus naturel que « sacrifier » employé sans complément d’objet, tout en gardant le sens cultuel.
- source_word: בָּאתִי
  choice: Je suis venu
  rationale: Le passé composé convient à l’explication présente que Samuel donne de sa venue.
- source_word: הִתְקַדְּשׁוּ
  choice: Consacrez-vous
  rationale: La forme réfléchie de קדשׁ désigne ici la préparation rituelle en vue du sacrifice. « Consacrez-vous » préserve cette portée sans la réduire à la seule purification.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: et venez avec moi au sacrifice
  rationale: Dans la suite de l’impératif, la forme fonctionne comme une instruction ou une invitation. Cette formulation française est naturelle et conserve le mouvement exprimé par בוא.
- source_word: וַיְקַדֵּשׁ
  choice: il consacra
  rationale: Le piel de קדשׁ décrit l’action de Samuel qui prépare rituellement Jessé et ses fils pour le sacrifice; la répétition de « consacrer » maintient le lien lexical avec l’ordre précédent.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: les invita au sacrifice
  rationale: קרא avec ל peut exprimer l’appel ou l’invitation. Ici, après leur consécration, « invita » rend naturellement leur inclusion dans la cérémonie sans suggérer inutilement une convocation coercitive.
- source_word: יִשַׁי
  choice: Jessé
  rationale: Forme française biblique usuelle du nom propre.
- source_word: בָּנָיו
  choice: ses fils
  rationale: L’hébreu désigne explicitement les fils de Jessé, distinction importante pour la suite du récit.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin comme nom propre et suit la décision éditoriale fournie, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde la concision de l’hébreu; le vocabulaire cultuel « sacrifice » et « consacrer » est conservé, avec une syntaxe naturelle.
