base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: fr
  text: Alors Samuel prit la corne d’huile et l’oignit au milieu de ses frères. L’Esprit de Yahweh fondit sur David[a][b] dès ce jour-là et par la suite. Puis Samuel se leva et partit pour Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vint avec puissance sur David ». Le verbe hébreu peut évoquer la venue énergique de l’Esprit, qui rend une personne capable d’agir.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’esprit de Yahweh fondit sur David ». La majuscule relève de l’interprétation ; les manuscrits hébreux ne marquent pas cette distinction.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: la corne d’huile
  rationale: קֶרֶן désigne littéralement une corne, probablement une corne animale servant de récipient. Cette formulation conserve l’image concrète du texte.
- source_word: וַיִּמְשַׁח אֹתוֹ
  choice: lui donna l’onction
  rationale: משׁח désigne ici l’acte rituel consistant à oindre. « Donner l’onction » exprime naturellement en français l’acte physique et sa portée royale sans les réduire à une simple application d’huile.
- source_word: בְּקֶרֶב אֶחָיו
  choice: au milieu de ses frères
  rationale: La traduction suit le sens concret de בְּקֶרֶב et précise correctement que les personnes présentes sont les frères de David, sans tirer de conclusion supplémentaire sur le caractère public de l’événement.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: L’Esprit de Yahweh fondit sur David
  rationale: Dans les récits de Samuel, צלח avec רוּחַ יְהוָה évoque une venue soudaine, énergique et habilitante. « Fondit sur » conserve cette vigueur, même si l’expression peut paraître plus rude que des paraphrases comme « vint avec puissance ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par le titre traditionnel « le Seigneur », afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: à partir de ce jour-là et par la suite
  rationale: Cette expression marque le commencement d’une réalité qui se prolonge. La formulation française en rend explicitement la durée.
- source_word: וַיָּקָם שְׁמוּאֵל
  choice: Samuel se leva
  rationale: קום introduit ici l’action suivante dans la séquence narrative. « Se leva » reste concis et naturel dans un registre narratif digne.
- source_word: הָרָמָתָה
  choice: partit pour Rama
  rationale: Le ה directionnel indique un mouvement vers Rama. « Partit pour » rend ce mouvement naturellement en français.
theological_decisions:
- issue: Interprétation de רוּחַ יְהוָה
  choice: L’Esprit de Yahweh
  alternative: l’esprit de Yahweh
  rationale: Dans ce contexte, l’expression désigne très probablement la présence divine qui habilite David. La majuscule reflète cette lecture sans masquer que l’écriture hébraïque ne signale pas cette distinction typographique.
- issue: Cadre de l’onction de David
  choice: au milieu de ses frères
  alternative: en présence de ses frères
  rationale: La traduction conserve l’affirmation explicite du texte tout en évitant de préciser, au-delà de celui-ci, l’étendue de la reconnaissance publique de l’onction.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe narrative demeure simple. « Corne d’huile » préserve l’image concrète ; « fondit sur » maintient la force inhabituelle du verbe hébreu, tandis que la note fournit une formulation française plus explicative.
