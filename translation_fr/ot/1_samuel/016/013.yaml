    issue: Rendu de וַיִּמְשַׁח
    rationale: « Lui donna l’onction » reformule le verbe rituel et ne dit pas directement que Samuel oignit David. « L’oignit » correspond précisément au verbe hébreu tout en restant idiomatique dans ce registre.
  - severity: medium
    issue: Ancrage des notes
    rationale: Les deux notes portent sur l’expression « l’Esprit de Yahweh fondit sur David » (nuance de צלח et majuscule de « Esprit »). Elles doivent être ancrées à cette expression, et non après l’indication temporelle.
  - severity: low
    issue: Formulation temporelle
    rationale: « Dès ce jour-là et par la suite » exprime naturellement le commencement ce jour même et la continuation ensuite, sans la légère lourdeur de « à partir de ce jour-là et par la suite ».
