revisions:
- from: Alors Samuel prit la corne d’huile et lui donna l’onction au milieu de ses frères. L’Esprit de Yahweh fondit sur David à partir de ce jour-là et par la suite[a][b]. Puis Samuel se leva et partit pour Rama.
  to: Alors Samuel prit la corne d’huile et l’oignit au milieu de ses frères. L’Esprit de Yahweh fondit sur David[a][b] dès ce jour-là et par la suite. Puis Samuel se leva et partit pour Rama.
  rationale: La révision remplace une périphrase par le verbe direct « oignit », améliore légèrement l’expression de la durée et replace les appels de notes sur l’expression qu’elles commentent. Elle conserve l’imagerie de la corne, la vigueur de « fondit sur », le nom Yahweh et l’ambiguïté typographique du terme hébreu pour esprit.
