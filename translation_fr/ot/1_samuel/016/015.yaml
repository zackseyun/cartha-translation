source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי שָׁא֖וּל אֵלָ֑י/ו הִנֵּה נָ֧א רֽוּחַ אֱלֹהִ֛ים רָעָ֖ה מְבַעִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: fr
  text: 'Les serviteurs de Saül lui dirent : « Voici qu’un esprit mauvais[a] venant de Dieu te remplit de terreur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit nuisible » ou « un esprit accablant ». Le mot hébreu peut désigner l’esprit comme mauvais ou comme causant du mal et de la détresse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français, sans qu’il soit nécessaire de traduire mécaniquement la conjonction initiale.
- source_word: עַבְדֵי שָׁאוּל
  choice: les serviteurs de Saül
  rationale: Dans le cadre de la cour royale, « serviteurs » exprime naturellement leur relation de service envers Saül sans mettre l’accent sur un statut d’esclave.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom complément rend directement la préposition hébraïque et son suffixe.
- source_word: הִנֵּה נָא
  choice: Voici que
  rationale: Cette tournure attire l’attention sur la situation présente dans un français actuel et digne. La particule נָא renforce ici l’appel à constater plutôt qu’elle ne formule une demande distincte.
- source_word: רוּחַ אֱלֹהִים
  choice: un esprit […] venant de Dieu
  rationale: « Venant de Dieu » explicite idiomatiquement le rapport exprimé par l’hébreu dans ce contexte, sans identifier cet esprit à l’Esprit de Dieu.
- source_word: רָעָה
  choice: mauvais
  rationale: רָעָה peut qualifier ce qui est mauvais ou ce qui cause du mal et de la détresse. « Mauvais » conserve le sens lexical direct, tandis qu’une note maintient l’autre nuance possible.
- source_word: מְבַעִתֶּךָ
  choice: te remplit de terreur
  rationale: Le participe décrit une action en cours. Cette expression française restitue la forte idée d’épouvante portée par le verbe hébreu.
theological_decisions:
- issue: Rendre רוּחַ אֱלֹהִים רָעָה sans atténuer son rapport à Dieu ni l’identifier à l’Esprit de Dieu
  choice: un esprit mauvais venant de Dieu
  alternative: un esprit nuisible, ou accablant, venant de Dieu
  rationale: Le texte rattache réellement l’esprit à Dieu, sans préciser ici la nature exacte de ce rapport. « Venant de Dieu » préserve cette tension tout en évitant de présenter cet esprit comme l’Esprit même de Dieu. La note conserve l’ambiguïté de רָעָה entre mal et effet nuisible ou accablant.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » garde la fonction d’appel à l’attention sans l’archaïsme marqué de « voici donc » ou « regarde maintenant »; « te remplit de terreur » exprime naturellement l’intensité et la durée suggérées par le participe.
