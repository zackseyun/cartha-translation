  text: וַ/יִּקְרָ֤א יִשַׁי֙ אֶל אֲבִ֣ינָדָ֔ב וַ/יַּעֲבִרֵ֖/הוּ לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹֽא בָחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: fr
  text: 'Alors Jessé appela Abinadab et le fit passer devant Samuel. Samuel dit : « Yahweh n’a pas choisi celui-ci non plus. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: Alors Jessé appela Abinadab
  rationale: « Appela » rend naturellement קרא dans ce récit, tandis que la préposition אֶל est absorbée par la construction française directe. « Alors » marque la progression narrative de וַ sans imposer une opposition.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: et le fit passer devant Samuel
  rationale: Le factitif du hifil de עבר est conservé explicitement par « fit passer »; לִפְנֵי est rendu par « devant ».
- source_word: וַיֹּאמֶר
  choice: Celui-ci dit
  rationale: Le sujet grammatical est implicite. Le contexte désigne Samuel; « celui-ci » clarifie le référent en français sans répéter son nom.
- source_word: גַּם בָּזֶה לֹא בָחַר
  choice: n’a pas non plus choisi celui-ci
  rationale: « Pas non plus » exprime idiomatiquement la valeur additive de גַּם dans une proposition négative, et le passé composé communique le résultat actuel du choix.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle présente dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre divin. « Yahweh » en conserve la fonction et évite de le remplacer silencieusement par un titre.
- issue: Identification du sujet de וַיֹּאמֶר
  choice: Celui-ci, c’est-à-dire Samuel
  alternative: il, avec référent laissé grammaticalement implicite
  rationale: Le contexte et le contenu de la déclaration indiquent Samuel. La formulation française clarifie ce référent sans ajouter son nom au discours source.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve le factitif hébreu tout en évitant une syntaxe artificielle. Aucun appel de note n’est nécessaire.
