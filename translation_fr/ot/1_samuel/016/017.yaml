  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: fr
  text: 'Alors Saül dit à ses serviteurs : « Je vous prie de me trouver un homme qui joue bien et de me l’amener. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme désigne ici les serviteurs ou membres de l’entourage royal de Saül. « Serviteurs » reste proche de l’hébreu et convient au contexte.
- source_word: רְאוּ נָא
  choice: Je vous prie de me trouver
  rationale: L’impératif de ראה accompagné de נָא constitue ici une demande polie visant à rechercher et repérer quelqu’un. Cette formulation française en restitue naturellement la politesse.
- source_word: לִי
  choice: me trouver
  rationale: Le pronom avec la préposition marque l’intérêt ou le bénéfice de Saül ; le pronom indirect « me » rend ce rapport idiomatiquement en français.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et désigne explicitement un homme dans ce contexte.
- source_word: מֵיטִיב לְנַגֵּן
  choice: qui joue bien
  rationale: Littéralement « qui fait bien en jouant », l’expression indique l’habileté musicale sans préciser ici l’instrument.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: et de me l’amener
  rationale: La forme s’adresse au pluriel aux serviteurs de Saül et demande qu’ils conduisent auprès de lui l’homme recherché. La coordination avec « je vous prie de » produit une tournure française fluide.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La demande polie est rendue par « Je vous prie de », tandis que « un homme » et « ses serviteurs » conservent les référents explicites de l’hébreu. Aucun instrument n’est ajouté, puisque le verset ne le nomme pas.
