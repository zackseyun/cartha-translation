  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: fr
  text: 'Mais Yahweh dit à Samuel : « Ne considère ni son apparence ni sa haute stature, car je l’ai rejeté. En effet, Yahweh ne voit pas comme l’être humain[a] voit[b] : l’être humain voit ce qui se présente aux yeux[c], mais Yahweh voit le cœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « l’être humain » désigne les êtres humains en général.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est elliptique : littéralement, « car non ce que voit l’être humain ». On pourrait aussi traduire : « Car ce n’est pas ce que voit l’être humain… »'
    reason: source_ambiguity
  - marker: c
    text: Littéralement, « pour les yeux » ou « aux yeux » ; il s’agit de ce qui est extérieurement visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel employé dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: תַּבֵּט
  choice: ne considère
  rationale: Dans ce contexte de choix d’un roi, le verbe interdit de fixer son appréciation sur les traits extérieurs. « Ne considère » exprime naturellement cette portée sans ajouter l’idée d’être impressionné.
- source_word: מַרְאֵהוּ
  choice: son apparence
  rationale: Le nom désigne ici l’aspect visible de la personne.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: sa haute stature
  rationale: Cette formulation française naturelle conserve l’accent mis sur la grande taille physique, sans le tour lourd « la hauteur de sa stature ».
- source_word: מְאַסְתִּיהוּ
  choice: je l’ai rejeté
  rationale: Dans le contexte de la sélection royale, le verbe signifie refuser quelqu’un comme candidat, et non nécessairement le mépriser.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: L’article et le contexte donnent au singulier une valeur générique. « L’être humain » inclut clairement l’humanité en général et maintient le contraste avec Yahweh.
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: Yahweh ne voit pas comme l’être humain voit
  rationale: L’hébreu est elliptique. L’ajout contextuel de « Yahweh » rend en français le contraste entre la perception divine et la perception humaine, tandis qu’une note conserve la forme plus littérale et son ambiguïté syntaxique.
- source_word: לַעֵינַיִם
  choice: ce qui se présente aux yeux
  rationale: La formulation garde l’image hébraïque des yeux tout en exprimant idiomatiquement ce qui est extérieurement visible.
- source_word: לַלֵּבָב
  choice: le cœur
  rationale: « Le cœur » conserve l’image biblique du centre intérieur de la pensée, de la volonté et des dispositions.
theological_decisions:
- issue: Contraste entre la perception humaine et la perception divine
  choice: Yahweh ne voit pas comme l’être humain voit… Yahweh voit le cœur
  alternative: Ce n’est pas ce que voit l’être humain…
  rationale: Le texte oppose explicitement, dans l’ensemble de la phrase, ce que perçoit l’être humain à ce que perçoit Yahweh. La formulation retenue explicite le sujet sous-entendu de la première proposition sans réduire « le cœur » aux seules émotions.
- issue: Portée de הָאָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le terme est générique ici. « L’être humain » communique cette portée universelle en français moderne sans suggérer exclusivement le sexe masculin.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite le calque lourd « la hauteur de sa stature », emploie « l’être humain » au sens générique et conserve les images bibliques des yeux et du cœur.
