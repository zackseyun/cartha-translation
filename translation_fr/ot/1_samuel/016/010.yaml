  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: fr
  text: 'Jessé fit passer sept de ses fils devant Samuel. Samuel dit à Jessé : « Yahvé n’a choisi aucun d’eux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: fit ainsi passer
  rationale: 'Le hifil est causatif : Jessé fait passer ses fils devant Samuel. Cette tournure française conserve ce sens tout en restant naturelle; « ainsi » relie le geste à la série commencée dans le contexte.'
- source_word: שִׁבְעַת בָּנָיו
  choice: sept de ses fils
  rationale: Cette formulation respecte le sens partitif possible et n’implique pas que Jessé n’avait en tout que sept fils.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » exprime naturellement la présentation des fils en présence de Samuel.
- source_word: לֹא בָחַר
  choice: n’a choisi
  rationale: Le passé composé rend naturellement en français le constat de Samuel à l’issue de la présentation, tout en conservant le verbe théologiquement significatif « choisir ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » translittère le nom divin plutôt que de lui substituer un titre.
- source_word: בָּאֵלֶּה
  choice: aucun de ceux-ci
  rationale: Dans ce contexte, la préposition בְּ avec le démonstratif désigne le groupe présenté; la négation signifie qu’aucun de ses membres n’a été choisi.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé », forme bien établie en français, préserve son statut de nom personnel au lieu de le remplacer par un titre.
- issue: Portée de la négation dans לֹא בָחַר יְהוָה בָּאֵלֶּה
  choice: Yahvé n’a choisi aucun de ceux-ci
  alternative: Yahvé n’a pas choisi ceux-ci
  rationale: La formulation retenue exprime clairement que chaque candidat du groupe est exclu, sens contextuel de l’hébreu, sans préciser encore qui sera choisi.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple « fit » convient au récit biblique sans archaïsme marqué; le discours direct emploie le passé composé, naturel dans une déclaration actuelle. Aucun ajout explicatif ni note n’est nécessaire.
