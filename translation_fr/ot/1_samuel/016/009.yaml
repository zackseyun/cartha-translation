  text: וַ/יַּעֲבֵ֥ר יִשַׁ֖י שַׁמָּ֑ה וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹא בָחַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: fr
  text: 'Puis Jessé fit passer Shamma, et il dit : « Yahweh n’a pas choisi celui-ci non plus. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: fit passer
  rationale: 'Le hifil de עבר a une valeur causative : Jessé fait passer Shamma devant Samuel. « Fit passer » conserve cette nuance de manière naturelle et concise.'
- source_word: יִשַׁי
  choice: Jessé
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: שַׁמָּה
  choice: Shamma
  rationale: Transcription française simple du nom hébreu, conforme à sa forme massorétique.
- source_word: וַיֹּאמֶר
  choice: il dit
  rationale: L’hébreu emploie seulement un pronom implicite. Le contexte identifie Samuel comme locuteur, mais la traduction conserve la formulation non explicite du texte source.
- source_word: גַּם בָּזֶה
  choice: celui-ci non plus
  rationale: Dans cette phrase négative, « non plus » rend naturellement la valeur additive de גַּם, tandis que « celui-ci » exprime le démonstratif masculin בָּזֶה.
- source_word: לֹא בָחַר
  choice: n’a pas choisi
  rationale: Le verbe בחר signifie « choisir ». Le passé composé convient au jugement formulé dans cette scène narrative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription « Yahweh » représente le nom divin du texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Identification du sujet de וַיֹּאמֶר
  choice: il dit
  alternative: Samuel dit
  rationale: Le contexte indique Samuel, mais l’hébreu ne répète pas son nom. Le pronom préserve la formulation et la continuité narrative du texte source.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple assure la continuité du récit, tandis que le passé composé dans la parole directe sonne naturel. Aucun ajout explicatif n’est nécessaire.
