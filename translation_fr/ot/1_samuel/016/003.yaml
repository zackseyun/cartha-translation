base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: fr
  text: Invite Jessé au sacrifice[a], et moi, je te ferai savoir ce que tu devras faire[b] ; tu oindras pour moi celui que je te désignerai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Convoque Jessé pour le sacrifice ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je te montrerai ce que tu dois faire ».
    reason: lexical_alternative
  - marker: c
    text: Ou « celui que je te dirai ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ לְיִשַׁי בַּזָּבַח
  choice: Invite Jessé au sacrifice
  rationale: Dans ce contexte, קרא désigne l’appel ou l’invitation à participer à une occasion sacrificielle. « Invite » est naturel en français et « au sacrifice » conserve la portée de זבח sans préciser davantage la nature du repas.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: Moi, je te ferai savoir
  rationale: Le pronom indépendant אָנֹכִי porte une certaine insistance, rendue par « Moi ». Le hiphil de ידע signifie faire connaître ou informer; « je te ferai savoir » en garde la nuance causative dans un français courant.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: ce que tu devras faire
  rationale: La forme verbale exprime ici une action future prescrite. « Tu devras faire » communique clairement cette valeur directive sans transformer la phrase en commandement autonome.
- source_word: וּמָשַׁחְתָּ לִי
  choice: tu donneras pour moi l’onction
  rationale: משׁח désigne l’acte d’oindre. La locution française « donner l’onction » reste accessible et préserve le caractère formel de l’acte; « pour moi » rend לִי, qui indique que l’acte est accompli pour Dieu ou en son nom.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: à celui que je t’indiquerai
  rationale: L’hébreu dit littéralement « celui que je te dirai ». En français, « celui que je t’indiquerai » exprime naturellement que Dieu désignera la personne, sans préciser son identité ou sa fonction.
theological_decisions:
- issue: Nature de l’onction
  choice: Conserver l’acte d’onction sans nommer la fonction conférée
  alternative: Préciser qu’il s’agit d’établir ou d’oindre un roi
  rationale: Le contexte narratif indique une onction royale, mais ce verset ne nomme pas explicitement la royauté. La traduction laisse donc le contexte apporter cette information.
- issue: Portée de לִי (« pour moi »)
  choice: Conserver explicitement « pour moi »
  alternative: Reformuler « en mon nom »
  rationale: '« Pour moi » maintient l’ambiguïté féconde de la préposition: l’acte est accompli à la demande de Dieu, pour son dessein et sous son autorité, sans réduire le sens à une seule de ces nuances.'
translation_notes:
  register: Français international moderne, clair et digne. « Donner l’onction » évite le caractère aujourd’hui rare du verbe « oindre » tout en conservant le vocabulaire cultuel. La reprise « Moi, je » rend l’insistance du pronom hébreu sans lourdeur excessive.
