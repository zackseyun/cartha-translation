  source_fidelity: La formulation « tu donneras pour moi l’onction » ne rend pas directement le verbe hébreu משׁח (« oindre ») et risque de décrire l’attribution d’une onction plutôt que l’acte d’oindre une personne. Le reste suit fidèlement la structure et les principales nuances du texte hébreu, y compris l’insistance de « moi » et la désignation ultérieure de la personne.
  naturalness: « Invite Jessé au sacrifice » et « je te ferai savoir » sont naturels dans un français moderne. « Oindre », quoique relevant d’un registre biblique et rituel, est ici le terme français précis, clair dans ce contexte et préférable à une périphrase qui modifierait le sens.
  terminology: Conserver « sacrifice », « Jessé » et « oindre ». « Oindre pour moi » rend sobrement לִי sans imposer le sens plus étroit de « en mon nom » ou celui, non explicite dans le verset, d’une onction royale.
