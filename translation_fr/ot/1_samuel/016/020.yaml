  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: fr
  text: Alors Jessé prit un âne chargé de pain[a], une outre de vin et un chevreau, et les envoya à Saül par David, son fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un âne, du pain ». L’hébreu juxtapose les deux termes ; il s’agit vraisemblablement d’un âne portant le pain.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de David, son fils », expression hébraïque indiquant ici l’intermédiaire chargé du transport ou de la remise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Jessé prit donc
  rationale: Le wayyiqtol fait avancer le récit. « donc » relie naturellement cette action à la demande précédente sans reproduire mécaniquement « et ».
- source_word: חֲמוֹר לֶחֶם
  choice: un âne chargé de pain
  rationale: L’hébreu juxtapose « âne » et « pain » sans expliciter leur rapport. Dans ce contexte de transport de provisions, l’âne porte vraisemblablement le pain; la note conserve la forme plus littérale et son ambiguïté grammaticale.
- source_word: נֹאד יַיִן
  choice: une outre de vin
  rationale: נֹאד désigne un récipient fait de peau, notamment destiné au vin. « outre de vin » est précis, naturel et historiquement approprié.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: un chevreau
  rationale: L’expression désigne un seul petit de la chèvre. « un chevreau » rend naturellement en français l’espèce, l’âge et le nombre.
- source_word: וַיִּשְׁלַח
  choice: puis il envoya le tout
  rationale: Le complément renvoie aux provisions énumérées. « le tout » explicite sobrement cet objet implicite et évite de faire de l’âne un élément syntaxiquement isolé.
- source_word: בְּיַד
  choice: par
  rationale: Littéralement « par la main de », cette locution hébraïque exprime ici l’intermédiaire chargé de remettre les présents. Le français naturel emploie simplement « par »; la note signale l’idiome source.
- source_word: דָּוִד בְּנוֹ
  choice: son fils David
  rationale: Cette formulation française naturelle conserve la relation familiale indiquée par l’hébreu.
- source_word: אֶל שָׁאוּל
  choice: à Saül
  rationale: La préposition marque simplement la destination ou le destinataire.
