- from: Que notre seigneur donne donc l’ordre à tes serviteurs qui se tiennent devant toi de chercher un homme qui sache jouer de la lyre. Quand un esprit mauvais venant de Dieu sera sur toi[a], cet homme jouera de sa main, et tu iras mieux.
  to: Que notre seigneur veuille bien ordonner à tes serviteurs qui se tiennent devant toi de chercher un homme qui sache jouer de la lyre. Lorsqu’un esprit mauvais venant de Dieu sera sur toi[a], il jouera de la lyre, et cela te fera du bien.
