review_pass:
  verdict: revise
  source_fidelity: La proposition initiale est une requête déférente demandant au roi de donner un ordre; « donne donc l’ordre » est trop direct et impératif en français. « Tu iras mieux » réduit וְטוֹב לָךְ à une amélioration comparative, alors que l’hébreu exprime plus largement que cela lui sera bénéfique. Le reste rend fidèlement la recherche d’un musicien compétent, la lyre et l’attribution explicite de l’esprit à Dieu.
  naturalness: La formulation révisée conserve le respect de cour en français moderne international. « Veuille bien ordonner » rend la requête polie sans archaïsme excessif. « Cela te fera du bien » est plus naturel et plus large que « tu iras mieux ».
  terminology: « Seigneur » convient comme titre humain respectueux; « lyre » est précis pour כִּנּוֹר. « Esprit mauvais venant de Dieu » conserve la tension du texte; la note maintient l’alternative « nuisible » et l’ambiguïté de la relation exprimée par le génitif hébreu.
  issues:
  - severity: medium
    issue: « donne donc l’ordre » transforme une requête déférente en injonction directe.
    rationale: יֹאמַר נָא formule la proposition respectueuse des serviteurs au roi. Une expression telle que « veuille bien ordonner » restitue mieux cette valeur.
  - severity: medium
    issue: « tu iras mieux » est trop restrictif pour וְטוֹב לָךְ.
    rationale: La formule hébraïque ne dit pas nécessairement une amélioration comparative de l’état de Saül; elle annonce plus généralement un effet bénéfique.
  - severity: low
    issue: « jouera de sa main » est peu idiomatique en français contemporain.
    rationale: L’expression hébraïque désigne concrètement le jeu instrumental. « Jouera de la lyre » transmet clairement l’action sans ajouter de sens.
