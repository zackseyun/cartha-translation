  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: fr
  text: Que notre seigneur veuille bien ordonner à tes serviteurs qui se tiennent devant toi de chercher un homme qui sache jouer de la lyre. Lorsqu’un esprit mauvais venant de Dieu sera sur toi[a], il jouera de la lyre, et cela te fera du bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un esprit nuisible venant de Dieu » ; hébreu : « un esprit mauvais/nuisible de Dieu » ou « venant de Dieu ».'
    reason: La construction hébraïque et l’adjectif רָעָה permettent plusieurs nuances qu’il convient de préserver.
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: donne donc l’ordre
  rationale: Dans ce contexte, le jussif accompagné de נָא introduit avec déférence la demande adressée à Saül. La formulation française rend naturellement la proposition des serviteurs et prépare la subordonnée exprimant ce qu’ils doivent faire.
- source_word: אֲדֹנֵינוּ
  choice: notre seigneur
  rationale: Titre de respect adressé à Saül dans le cadre de la cour. La minuscule distingue ce titre humain du nom ou titre divin.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: tes serviteurs qui se tiennent devant toi
  rationale: La relative explicite naturellement en français la position et la fonction des courtisans présents auprès du roi, sans perdre l’image spatiale de l’hébreu.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: de chercher un homme
  rationale: L’infinitif dépend de « donne l’ordre » et exprime la proposition selon laquelle les serviteurs doivent trouver une personne appropriée.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: qui sache jouer
  rationale: Le participe יֹדֵעַ associé à l’infinitif exprime la compétence. Le subjonctif est naturel après la recherche d’une personne non encore identifiée.
- source_word: כִּנּוֹר
  choice: lyre
  rationale: La lyre correspond plus précisément à l’ancien instrument à cordes désigné par כִּנּוֹר que le traditionnel « harpe ».
- source_word: וְהָיָה בִּהְיוֹת
  choice: Quand
  rationale: Cette construction temporelle hébraïque introduit la circonstance dans laquelle le musicien interviendra; « Quand » la rend clairement sans lourdeur.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: un esprit mauvais venant de Dieu
  rationale: « Mauvais » conserve la force lexicale et l’ambiguïté de רָעָה entre caractère mauvais et effet nuisible. « Venant de Dieu » exprime la relation de source suggérée par la construction sans effacer l’attribution explicite du texte.
- source_word: עָלֶיךָ
  choice: sera sur toi
  rationale: Cette expression garde l’image hébraïque de l’esprit qui vient peser sur Saül, tout en restant compréhensible en français.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: jouera de sa main
  rationale: La traduction conserve l’expression concrète de l’hébreu, qui décrit l’action de jouer de l’instrument avec la main.
- source_word: וְטוֹב לָךְ
  choice: tu iras mieux
  rationale: Cette formulation française naturelle exprime l’amélioration attendue pour Saül. Elle reste assez large pour ne pas limiter le bienfait à une seule dimension émotionnelle.
theological_decisions:
- issue: Rendre רוּחַ אֱלֹהִים רָעָה sans atténuer l’attribution à Dieu ni définir excessivement la nature de l’esprit
  choice: un esprit mauvais venant de Dieu
  alternative: un esprit nuisible venant de Dieu ; un mauvais esprit de Dieu
  rationale: Le texte relie explicitement l’esprit à Dieu. « Venant de Dieu » préserve cette provenance sans suggérer que Dieu serait lui-même moralement mauvais. « Mauvais » garde la tension du terme רָעָה, tandis que la note signale qu’il peut aussi qualifier l’effet nuisible de l’esprit.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours reste respectueux envers le roi. « Lyre » privilégie la précision historique; la tournure « se tiennent devant toi » conserve la couleur de cour sans archaïsme excessif.
