  text: וְ/הָיָ֗ה בִּֽ/הְי֤וֹת רֽוּחַ אֱלֹהִים֙ אֶל שָׁא֔וּל וְ/לָקַ֥ח דָּוִ֛ד אֶת הַ/כִּנּ֖וֹר וְ/נִגֵּ֣ן בְּ/יָד֑/וֹ וְ/רָוַ֤ח לְ/שָׁאוּל֙ וְ/ט֣וֹב ל֔/וֹ וְ/סָ֥רָה מֵ/עָלָ֖י/ו ר֥וּחַ הָ/רָעָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: fr
  text: Chaque fois que l’esprit de Dieu[c] venait sur Saül, David prenait la lyre[a] et en jouait de sa main. Alors Saül éprouvait du soulagement, cela lui faisait du bien, et l’esprit malfaisant[b] se retirait de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la harpe ». Le mot hébreu kinnor désigne un ancien instrument à cordes, probablement plus proche d’une lyre que d’une harpe moderne.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’esprit mauvais ». Le mot hébreu peut qualifier ce qui est mauvais ou ce qui fait du mal; ici, il peut souligner l’effet pénible de cet esprit sur Saül.
    reason: lexical_alternative
  - marker: c
    text: La première proposition dit « l’esprit de Dieu », tandis que la dernière dit « l’esprit malfaisant ». La traduction conserve cette différence de formulation présente dans l’hébreu au lieu d’harmoniser les deux expressions.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: Chaque fois que
  rationale: La construction avec היה et l’infinitif construit présente ici une circonstance récurrente. « Chaque fois que » en restitue naturellement la valeur itérative.
- source_word: רוּחַ אֱלֹהִים
  choice: l’esprit de Dieu
  rationale: L’hébreu porte simplement « esprit de Dieu » dans la première proposition; il convient de ne pas y introduire l’adjectif « mauvais » ou « malfaisant » tiré de la fin du verset.
- source_word: אֶל שָׁאוּל
  choice: venait sur Saül
  rationale: Cette formulation exprime l’arrivée de l’esprit qui affecte Saül tout en restant proche de la construction hébraïque.
- source_word: הַכִּנּוֹר
  choice: la lyre
  rationale: Le kinnor était un ancien instrument à cordes, vraisemblablement plus proche de la lyre que de la harpe moderne.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: en jouait de sa main
  rationale: Le verbe désigne le jeu d’un instrument à cordes. Le pronom « en » reprend naturellement « la lyre », tandis que « de sa main » conserve l’expression hébraïque.
- source_word: וְרָוַח לְשָׁאוּל
  choice: Saül éprouvait du soulagement
  rationale: Le verbe exprime le répit ou le soulagement; cette tournure française présente clairement Saül comme celui qui en bénéficie.
- source_word: וְטוֹב לוֹ
  choice: cela lui faisait du bien
  rationale: Cette expression naturelle traduit l’amélioration de l’état de Saül sans préciser indûment si elle était seulement émotionnelle ou également physique.
- source_word: רוּחַ הָרָעָה
  choice: l’esprit malfaisant
  rationale: רָעָה peut évoquer le mal moral ou un effet nuisible et affligeant. « Malfaisant » met en avant l’effet dommageable sans supprimer entièrement l’ambiguïté du terme.
- source_word: וְסָרָה מֵעָלָיו
  choice: se retirait de lui
  rationale: Le verbe סור indique ici l’éloignement ou le départ. « Se retirait de lui » convient à la récurrence de la scène et au registre narratif.
theological_decisions:
- issue: Rapport entre רוּחַ אֱלֹהִים dans la première proposition et רוּחַ הָרָעָה dans la dernière
  choice: Conserver « l’esprit de Dieu » au début et « l’esprit malfaisant » à la fin, sans harmoniser les deux expressions.
  alternative: Traduire dès le début « l’esprit malfaisant venant de Dieu », ou rendre la dernière expression par « l’esprit mauvais ».
  rationale: Le texte hébreu emploie deux formulations différentes. Les maintenir préserve la tension du passage et évite d’insérer dans la première proposition une synthèse interprétative empruntée au contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure narrative et accessible; « de sa main » garde une légère couleur biblique justifiée par le texte source, tandis que « cela lui faisait du bien » évite une tournure française artificielle.
