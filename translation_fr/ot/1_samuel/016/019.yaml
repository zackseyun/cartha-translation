  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: fr
  text: 'Saül envoya des messagers à Jessé et lui dit : « Envoie-moi ton fils David, qui est avec le troupeau. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שׁלח exprime ici une action passée dans le récit ; « envoya » est l’équivalent français naturel.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte humain, מַלְאָכִים désigne des personnes chargées de transmettre un message, sans exiger le sens plus officiel d’« émissaires ».
- source_word: אֶל יִשָׁי
  choice: à Jessé
  rationale: La préposition אֶל marque la direction vers Jessé ; « à Jessé » convient naturellement après « envoya des messagers ».
- source_word: וַיֹּאמֶר
  choice: lui dit
  rationale: אמר introduit le discours direct. Le pronom « lui » rend explicite en français le destinataire déjà indiqué, sans modifier le sens.
- source_word: שִׁלְחָה אֵלַי
  choice: Envoie-moi
  rationale: L’impératif de שׁלח suivi de אֵלַי se rend idiomatiquement par « Envoie-moi ».
- source_word: אֶת דָּוִד בִּנְךָ
  choice: ton fils David
  rationale: Cette formulation conserve l’apposition qui identifie David comme le fils de Jessé.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: qui est avec le troupeau
  rationale: La préposition ב peut exprimer ici la présence avec ou parmi le petit bétail. « Avec le troupeau » reste naturel et préserve la nuance spatiale sans préciser davantage l’activité de David.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est rendue par « donc » pour assurer la continuité du récit. « Troupeau » est plus naturel en français que « brebis » ici et n’ajoute pas explicitement que David le garde.
