  source_fidelity: La question « Ta venue annonce-t-elle la paix ? » introduit le verbe et la notion de présage (« annonce »), absents de שָׁלוֹם בּוֹאֶךָ. La formulation directe « Viens-tu en paix ? » rend fidèlement la question sur le caractère pacifique de la venue. Le « donc » initial n’est pas marqué dans l’hébreu et peut être omis. « Tremblants, vinrent à sa rencontre » conserve à la fois le tremblement et le mouvement exprimé par לִקְרָאתוֹ.
  naturalness: Le passé simple convient au récit biblique en français moderne soutenu. « Les anciens de la ville, tremblants, vinrent à sa rencontre » est naturel, clair et maintient l’enchaînement narratif sans transformer le tremblement en simple réaction à l’arrivée.
  terminology: « Yahweh » respecte la décision de rendre le tétragramme par le nom divin. « Les anciens » est le terme usuel et approprié pour זִקְנֵי העיר. « Paix » conserve la portée de שָׁלוֹם sans explicitation doctrinale ou interprétative.
