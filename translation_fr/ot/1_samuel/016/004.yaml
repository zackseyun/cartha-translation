  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: fr
  text: 'Samuel fit ce que Yahweh avait dit et se rendit à Bethléem. Les anciens de la ville, tremblants, vinrent à sa rencontre et lui demandèrent : « Viens-tu en paix ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ שְׁמוּאֵל אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: Samuel fit donc ce que Yahweh avait dit
  rationale: « Fit ce que » rend simplement עשה, tandis que « avait dit » traduit naturellement דִּבֶּר dans le contexte des instructions précédentes, sans ajouter explicitement l’idée de commandement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: se rendit à Bethléem
  rationale: Dans un récit français, « se rendit à » exprime naturellement le déplacement vers Bethléem, là où le littéral « vint » serait moins idiomatique sans point de vue local explicite.
- source_word: וַיֶּחֶרְדוּ זִקְנֵי הָעִיר לִקְרָאתוֹ
  choice: Les anciens de la ville vinrent à sa rencontre en tremblant
  rationale: Cette formulation rattache clairement לִקְרָאתוֹ au mouvement des anciens et préserve la force physique et émotionnelle de חרד.
- source_word: שָׁלֹם בּוֹאֶךָ
  choice: Ta venue annonce-t-elle la paix ?
  rationale: Cette question française naturelle conserve la tournure nominale concise de l’hébreu et la préoccupation des anciens quant au caractère pacifique ou non de cette venue.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve directement sans le remplacer par un titre.
- issue: Portée de שָׁלוֹם dans la question des anciens
  choice: Ta venue annonce-t-elle la paix ?
  alternative: Viens-tu en paix ?
  rationale: 'La traduction retenue laisse ouverte la nuance de l’hébreu : les anciens peuvent demander aussi bien si Samuel vient avec des intentions pacifiques que si sa venue présage une situation favorable.'
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Anciens » conserve le rôle social reconnu des responsables de la ville.
