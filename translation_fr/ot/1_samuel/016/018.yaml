  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: fr
  text: 'Alors l’un des jeunes gens prit la parole et dit : « J’ai vu un fils de Jessé le Bethléhémite, qui sait jouer d’un instrument[b], homme vaillant[a], guerrier, avisé dans ses paroles et de belle apparence, et Yahvé est avec lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « un homme de valeur » ou, selon le contexte, « un homme capable ».
    reason: lexical_alternative
  - marker: b
    text: L’instrument n’est pas nommé dans ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: prit la parole
  rationale: Cette formule narrative introduit ici l’intervention d’un membre du groupe. « Prit la parole » rend naturellement l’hébreu sans laisser entendre qu’il répond nécessairement à une question explicite.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: l’un des jeunes gens
  rationale: נְעָרִים peut désigner de jeunes hommes, des serviteurs ou des assistants. « Jeunes gens » reste proche du sens lexical sans préciser leur fonction à la cour.
- source_word: הִנֵּה רָאִיתִי
  choice: J’ai vu
  rationale: Le parfait exprime une observation antérieure pertinente pour la recommandation présente. En français, « J’ai vu » est naturel; le présentatif הִנֵּה n’exige pas ici un « voici » peu idiomatique devant une proposition complète.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: un fils de Jessé, le Bethléhémite
  rationale: La formulation conserve l’expression filiale et le gentilé appliqué à Jessé, sans remplacer celui-ci par une simple indication géographique susceptible de modifier le fils.
- source_word: יֹדֵעַ נַגֵּן
  choice: qui sait jouer de la musique
  rationale: La construction indique l’aptitude à jouer d’un instrument. L’instrument n’étant pas nommé dans ce verset, « de la musique » exprime la compétence sans ajouter la lyre du contexte.
- source_word: גִּבּוֹר חַיִל
  choice: un homme de valeur
  rationale: L’expression peut évoquer la vaillance, la force ou plus largement la capacité. « Homme de valeur » maintient cette amplitude, tandis que la mention suivante précise explicitement le caractère guerrier.
- source_word: אִישׁ מִלְחָמָה
  choice: un guerrier
  rationale: Rendu français direct et courant de l’expression littérale « homme de guerre ».
- source_word: נְבוֹן דָּבָר
  choice: avisé dans ses paroles
  rationale: נבון exprime le discernement et דבר peut viser la parole ou, plus largement, une affaire. Dans cette caractérisation personnelle, le rendu retient la compréhension liée à la manière de parler tout en évitant de réduire le terme à l’éloquence.
- source_word: אִישׁ תֹּאַר
  choice: de belle apparence
  rationale: תֹּאַר désigne la forme ou l’apparence extérieure. Cette formulation française est naturelle et ne précise pas au-delà du texte la nature exacte de son attrait.
- source_word: וַיהוָה עִמּוֹ
  choice: Yahvé est avec lui
  rationale: Le nom divin est rendu comme nom propre, et la proposition nominale hébraïque est naturellement exprimée au présent.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahvé » préserve sa fonction de nom propre et distingue celui-ci du titre אֲדֹנָי.
- issue: Portée de « Yahvé est avec lui »
  choice: conserver l’énoncé sans explicitation
  alternative: Yahvé lui accorde sa faveur / lui donne la réussite
  rationale: La formule peut impliquer présence, faveur et réussite divines, mais le texte ne sélectionne ni n’explicite une seule de ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La longue énumération hébraïque est répartie en phrases pour la lisibilité, tout en conservant chaque qualité attribuée à David. « Bethléhémite » maintient le gentilé ancien mais intelligible; les autres formulations évitent l’archaïsme et les précisions absentes du verset.
