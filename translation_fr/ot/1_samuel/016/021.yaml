source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל שָׁא֔וּל וַֽ/יַּעֲמֹ֖ד לְ/פָנָ֑י/ו וַ/יֶּאֱהָבֵ֣/הֽוּ מְאֹ֔ד וַֽ/יְהִי ל֖/וֹ נֹשֵׂ֥א כֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: fr
  text: David vint auprès de Saül et se tint devant lui. Saül l’aima beaucoup, et David devint son porteur d’armes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porteur de son équipement militaire ». L’expression hébraïque désigne littéralement celui qui porte l’équipement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint auprès de
  rationale: Dans ce récit, בוא exprime le déplacement vers Saül. « Vint auprès de Saül » est naturel en français et n’ajoute pas l’idée explicite d’entrer dans un lieu.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: se tint devant lui
  rationale: Cette formulation conserve l’image hébraïque tout en laissant entendre, sans l’expliciter excessivement, le service auprès d’un supérieur.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: Saül l’aima beaucoup
  rationale: Le contexte désigne Saül comme sujet. « Aima beaucoup » rend simplement l’intensité de מְאֹד sans sentimentaliser la faveur personnelle exprimée.
- source_word: וַיְהִי לוֹ
  choice: David devint son
  rationale: La construction indique ici un nouvel état ou une nouvelle fonction. La répétition de « David » lève naturellement l’ambiguïté des pronoms en français.
- source_word: נֹשֵׂא כֵלִים
  choice: porteur d’armes
  rationale: L’expression désigne celui qui porte l’équipement militaire d’un combattant. « Porteur d’armes » est clair, digne et plus immédiatement compréhensible en français moderne que le terme spécialisé « écuyer ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La syntaxe narrative reste proche de l’hébreu, tandis que la répétition des noms évite une ambiguïté pronominale étrangère au sens du contexte.
