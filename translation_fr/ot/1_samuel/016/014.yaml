  text: וְ/ר֧וּחַ יְהוָ֛ה סָ֖רָה מֵ/עִ֣ם שָׁא֑וּל וּ/בִֽעֲתַ֥תּ/וּ רֽוּחַ רָעָ֖ה מֵ/אֵ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: fr
  text: L’Esprit de l’Éternel s’était retiré de Saül, et un esprit mauvais[a] venant de l’Éternel le terrifia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit nuisible » ou « un esprit funeste ». L’adjectif hébreu peut désigner ce qui est mauvais, nuisible ou calamiteux par ses effets.
    reason: Alternative lexicale préservant l’étendue sémantique de רָעָה.
lexical_decisions:
- source_word: וְ/ר֧וּחַ יְהוָ֛ה
  choice: L’Esprit de l’Éternel
  rationale: רוּחַ désigne ici l’Esprit divin qui avait investi Saül. La majuscule indique ce référent personnel, et « l’Éternel » rend le nom divin יְהוָה dans un français biblique courant et digne.
- source_word: סָ֖רָה מֵ/עִ֣ם
  choice: s’était retiré de
  rationale: סוּר exprime l’éloignement ou le retrait. Le plus-que-parfait marque naturellement en français que ce retrait précède l’action décrite ensuite.
- source_word: שָׁא֑וּל
  choice: Saül
  rationale: Forme française usuelle du nom propre.
- source_word: וּ/בִֽעֲתַ֥תּ/וּ
  choice: le terrifiait
  rationale: Le verbe בעת exprime une terreur intense. L’imparfait convient au trouble subi par Saül dans le déroulement du récit, sans ajouter l’idée plus large de tourment.
- source_word: רֽוּחַ רָעָ֖ה
  choice: un esprit mauvais
  rationale: רָע peut qualifier ce qui est mauvais, nuisible ou funeste. « Esprit mauvais » est la formulation directe; les autres nuances possibles sont signalées en note.
- source_word: מֵ/אֵ֥ת יְהוָֽה
  choice: venant de l’Éternel
  rationale: מֵאֵת indique ici la provenance. « Venant de » conserve cette attribution explicite sans développer le texte en « envoyé par ».
theological_decisions:
- issue: L’attribution à l’Éternel de l’esprit qui terrifie Saül
  choice: un esprit mauvais venant de l’Éternel
  alternative: un esprit nuisible venant de l’Éternel; un esprit mauvais envoyé par l’Éternel
  rationale: L’hébreu attribue explicitement à יְהוָה la provenance de cet esprit. La traduction maintient cette tension théologique sans l’atténuer ni préciser, au-delà du texte, le mode de son intervention.
translation_notes:
  register: Français international actuel, clair et digne. La phrase reste proche de la structure hébraïque tout en employant des temps et des tournures naturels en français.
