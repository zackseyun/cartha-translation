base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: fr
  text: Jonathan appela David et lui rapporta toutes ces choses. Puis Jonathan amena David auprès de Saül, et David fut en sa présence comme auparavant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme hier et avant-hier », expression hébraïque signifiant « comme auparavant » ou « comme autrefois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: appela David
  rationale: Avec לְ suivi d’une personne, קרא signifie couramment « appeler » ou « convoquer ». « Appela » reste naturel et ne précise pas indûment le caractère formel de l’appel.
- source_word: וַיַּגֶּד לוֹ
  choice: lui rapporta
  rationale: Le hiphil de נגד signifie « faire connaître, raconter, rapporter ». « Lui rapporta » convient au récit que Jonathan fait à David des paroles et intentions de Saül.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces choses
  rationale: דבר peut désigner des paroles, des faits ou des affaires. « Toutes ces choses » conserve cette étendue de sens sans limiter le contenu aux seules paroles.
- source_word: וַיָּבֵא ... אֶל
  choice: amena ... auprès de
  rationale: Le hiphil de בוא exprime ici l’action de faire venir ou d’amener quelqu’un. « Auprès de Saül » rend naturellement la destination personnelle.
- source_word: וַיְהִי לְפָנָיו
  choice: David se tint en sa présence
  rationale: L’expression signifie littéralement être devant quelqu’un et peut évoquer sa présence ou son service. La répétition de « David » lève en français l’ambiguïté pronominale, tandis que « se tint en sa présence » préserve le cadre de la cour sans préciser excessivement une fonction officielle.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: comme auparavant
  rationale: Cette locution temporelle, littéralement liée aux jours précédents, est un idiome signifiant « comme autrefois » ou « comme auparavant ». Le choix français en transmet le sens dans un récit moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste claire pour un lectorat courant; la reprise du nom « David » évite que « il » puisse renvoyer à Jonathan. Le marqueur de note est placé après l’expression qu’il explique.
