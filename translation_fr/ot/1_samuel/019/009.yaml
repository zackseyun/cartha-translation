  source_fidelity: 'La mention explicite de « la lyre » dépasse le texte de 1 Samuel 19:9 : מְנַגֵּן בְּיָד exprime que David jouait/produisait de la musique « de la main », sans nommer l’instrument. Le contexte proche permet de l’inférer, mais non de l’intégrer au texte courant. « Un esprit mauvais venant de Yahweh » rend de façon recevable la relation קשה de רוּחַ יְהוָה רָעָה, et « s’abattit sur Saül » est une expression française défendable pour l’irruption de l’esprit.'
