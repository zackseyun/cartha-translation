  text: וַ/תְּהִי֩ ר֨וּחַ יְהוָ֤ה רָעָה֙ אֶל שָׁא֔וּל וְ/הוּא֙ בְּ/בֵית֣/וֹ יוֹשֵׁ֔ב וַ/חֲנִית֖/וֹ בְּ/יָד֑/וֹ וְ/דָוִ֖ד מְנַגֵּ֥ן בְּ/יָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: fr
  text: Alors, un esprit mauvais venant de Yahweh[a] s’abattit sur Saül pendant qu’il était assis dans sa maison, sa lance à la main. David jouait de la musique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit nuisible venant de Yahweh ». L’adjectif hébreu peut signifier « mauvais », « nuisible » ou « accablant ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « jouait de la main ». L’instrument n’est pas nommé dans ce verset, bien que le contexte indique que David jouait de la lyre.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַתְּהִי
  choice: s’abattit
  rationale: Avec אֶל שָׁאוּל, la forme introduit l’irruption de l’esprit contre Saül. « S’abattit sur » exprime naturellement en français cette venue soudaine et accablante.
- source_word: רוּחַ יְהוָה רָעָה
  choice: un esprit mauvais venant de Yahweh
  rationale: רוּחַ désigne ici un « esprit » et רָעָה peut signifier « mauvais », « nuisible » ou « accablant ». « Venant de » rend la relation avec Yahweh sans qualifier Yahweh lui-même de mauvais.
- source_word: בְּבֵיתוֹ יֹשֵׁב
  choice: pendant qu’il était assis dans sa maison
  rationale: Le participe יֹשֵׁב présente une action en cours qui sert d’arrière-plan à l’irruption de l’esprit.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: sa lance à la main
  rationale: Cette tournure française concise et idiomatique rend la proposition nominale hébraïque, littéralement « et sa lance [était] dans sa main ».
- source_word: מְנַגֵּן בְּיָד
  choice: jouait de la lyre
  rationale: מְנַגֵּן indique que David jouait d’un instrument. L’instrument n’est pas nommé dans ce verset, mais la lyre est clairement indiquée par le contexte proche; une note préserve la formulation littérale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Rapport entre l’esprit mauvais et Yahweh
  choice: un esprit mauvais venant de Yahweh
  alternative: un esprit mauvais de Yahweh / un esprit nuisible venant de Yahweh
  rationale: Cette formulation maintient l’affirmation difficile du texte selon laquelle l’esprit vient de Yahweh, sans laisser entendre que Yahweh serait lui-même moralement mauvais. La note conserve l’étendue sémantique de רָעָה.
translation_notes:
  register: Français international moderne, narratif et digne. « Sa lance à la main » et « jouait de la lyre » privilégient un français naturel, tandis que les notes signalent les ambiguïtés lexicales et l’instrument seulement implicite dans ce verset.
