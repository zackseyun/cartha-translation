  text: וַ/תִּקַּ֨ח מִיכַ֜ל אֶת הַ/תְּרָפִ֗ים וַ/תָּ֨שֶׂם֙ אֶל הַ/מִּטָּ֔ה וְ/אֵת֙ כְּבִ֣יר הָֽ/עִזִּ֔ים שָׂ֖מָה מְרַֽאֲשֹׁתָ֑י/ו וַ/תְּכַ֖ס בַּ/בָּֽגֶד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: fr
  text: Alors Mikal prit l’idole domestique[a] et la plaça sur le lit. Elle mit du côté de la tête un objet en poil de chèvre[b], puis le couvrit avec le vêtement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les téraphim », « les dieux domestiques » ou « la statue ». Le mot hébreu désigne des objets cultuels domestiques ; ici, l’objet semble servir de figure unique dans le lit.
    reason: lexical_alternative
  - marker: b
    text: Le sens exact de l’expression hébraïque est incertain. Il pourrait s’agir d’une étoffe tissée, d’un filet, d’une couverture, d’un coussin ou d’un objet semblable en poil de chèvre, placé dans la zone de la tête. Le texte ne précise pas sans ambiguïté de qui est cette tête.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: l’idole domestique
  rationale: Le terme תְּרָפִים désigne des objets cultuels domestiques. Bien que sa forme soit plurielle, la scène présente ici l’objet comme une figure unique placée dans le lit; « idole domestique » en communique clairement la fonction sans imposer une translittération obscure.
- source_word: אֶל הַמִּטָּה
  choice: sur le lit
  rationale: Avec le verbe שׂוּם dans cette scène, אֶל exprime naturellement le placement de l’objet sur le lit afin de simuler la présence de David.
- source_word: כְּבִיר הָעִזִּים
  choice: une pièce en poil de chèvre
  rationale: כְּבִיר est rare et de sens incertain. La formulation générale « une pièce » évite de trancher sans preuve entre coussin, filet, couverture ou étoffe, tandis que « en poil de chèvre » conserve la matière explicitement indiquée.
- source_word: מְרַאֲשֹׁתָיו
  choice: à l’endroit de sa tête
  rationale: Le mot désigne la zone de la tête ou du chevet. Cette tournure française préserve la référence pronominale masculine de l’hébreu et convient à la figure disposée dans le lit sans réduire le sens à un simple oreiller.
- source_word: בַּבָּגֶד
  choice: avec le vêtement
  rationale: בֶּגֶד est le terme général pour un vêtement. L’article défini est conservé; « manteau » serait plus précis que ne le permet le texte.
- source_word: וַתְּכַס
  choice: la couvrit
  rationale: Le verbe כסה signifie directement « couvrir ». Le pronom français explicite l’objet arrangé dans le lit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Alors » rend la progression du récit sans lourdeur. « Une pièce en poil de chèvre » conserve l’incertitude lexicale dans le texte principal, développée en note. Les marqueurs sont placés immédiatement après les expressions concernées.
