  source_fidelity: 'Le sens narratif est bien rendu : Mikal place le téraphim sur le lit, dispose un élément en poil de chèvre à la zone de la tête, puis le couvre. Toutefois, « à l’endroit de sa tête » impose une référence pronominale masculine qui demeure discutée dans le texte hébreu et produit une formulation française maladroite. « Une pièce en poil de chèvre » est également trop elliptique en français.'
  naturalness: Le registre est globalement moderne et narratif. « Elle mit à l’endroit de sa tête une pièce en poil de chèvre » est cependant lourd et peu idiomatique. Une formulation qui situe l’objet « du côté de la tête » est plus naturelle et conserve l’ambiguïté du suffixe hébreu.
  terminology: « Idole domestique » communique correctement la valeur cultuelle de תְּרָפִים, avec une note qui maintient les autres possibilités. Pour כְּבִיר הָעִזִּים, « objet en poil de chèvre » est volontairement générique, mais plus naturel que « pièce » et ne tranche pas la difficulté lexicale. « Vêtement » reste approprié pour בֶּגֶד.
  issues:
