    issue: Référence pronominale rendue trop étroitement par « sa tête »
    rationale: Le suffixe masculin singulier de מְרַאֲשֹׁתָיו peut être compris en lien avec la figure disposée ou avec la personne imitée. La formulation française actuelle favorise inutilement une lecture et sonne de surcroît peu naturelle. « Du côté de la tête » préserve l’indétermination.
  - severity: low
    issue: « Une pièce en poil de chèvre » est elliptique
    rationale: Le français moderne emploie rarement « pièce » seul pour un objet textile ou indéterminé. « Un objet en poil de chèvre » demeure prudent quant au sens difficile de כְּבִיר tout en étant idiomatique.
  - severity: low
