- from: Alors Mikal prit l’idole domestique[a] et la plaça sur le lit. Elle mit à l’endroit de sa tête une pièce en poil de chèvre[b], puis la couvrit avec le vêtement.
  to: Alors Mikal prit l’idole domestique[a] et la plaça sur le lit. Elle mit du côté de la tête un objet en poil de chèvre[b], puis le couvrit avec le vêtement.
  rationale: La révision améliore l’idiomaticité française et évite de résoudre dans le texte principal l’ambiguïté du suffixe masculin associé à la zone de la tête. Elle conserve le caractère indéterminé de כְּבִיר par « objet », tout en gardant explicitement le poil de chèvre et en développant les options dans la note. Le pronom « le » dans la dernière proposition renvoie naturellement à l’objet masculin disposé sur le lit, l’idole domestique.
