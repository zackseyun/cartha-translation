base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: fr
  text: 'Lui aussi retira ses vêtements et, lui aussi, prophétisa devant Samuel. Il tomba nu[a] et resta ainsi pendant tout ce jour-là et toute la nuit. C’est pourquoi on dit : « Saül est-il aussi parmi les prophètes ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « nu » peut désigner une nudité complète ou le fait d’avoir retiré ses vêtements de dessus ; l’hébreu ne donne pas davantage de précision.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: retira ses vêtements
  rationale: Le verbe פשט avec בְּגָדִים désigne l’action d’enlever ses vêtements. « Retira ses vêtements » est naturel en français moderne sans préciser au-delà de l’hébreu la manière dont Saul se dévêt.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: La reprise de « lui aussi » souligne que Saul lui-même subit ce qui était arrivé à ses messagers. La répétition est conservée.
- source_word: וַיִּתְנַבֵּא
  choice: prophétisa
  rationale: Cette traduction directe maintient ouverte la nature exacte de l’activité prophétique, qu’il s’agisse de paroles, d’un comportement inspiré ou des deux.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: devant Samuel
  rationale: לִפְנֵי exprime ici la présence de Samuel. « Devant Samuel » est fidèle, concis et naturel.
- source_word: וַיִּפֹּל עָרֹם
  choice: Il tomba nu et resta ainsi
  rationale: « Tomba » conserve le sens concret de נפל, tandis que « resta ainsi » permet de relier naturellement cette action à la longue durée indiquée ensuite. « Nu » rend directement עָרֹם sans en réduire la portée.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: pendant tout ce jour-là et toute la nuit
  rationale: La formulation reproduit l’insistance sur la durée complète tout en restant idiomatique en français.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: C’est pourquoi on dit
  rationale: Cette tournure française introduit naturellement la parole proverbiale dont le récit explique l’origine, tout en conservant le présent hébreu.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: Saül est-il aussi parmi les prophètes ?
  rationale: La question proverbiale est traduite au plus près, sans expliquer ni limiter en quoi consiste l’appartenance évoquée.
theological_decisions:
- issue: Portée de l’état décrit par עָרֹם
  choice: Traduire par « nu » dans le texte principal, avec une note signalant l’ambiguïté pratique.
  alternative: « Dévêtu » ou « dépouillé de ses vêtements de dessus »
  rationale: עָרֹם signifie directement « nu », mais le contexte ne permet pas d’établir avec certitude s’il s’agit d’une nudité complète ou du retrait des vêtements extérieurs. La traduction principale garde la force du terme et la note préserve l’incertitude.
- issue: Nature de l’activité prophétique de Saul
  choice: Employer « prophétisa » sans définir le phénomène.
  alternative: « entra dans un état d’extase prophétique » ou « se comporta comme un prophète »
  rationale: Le texte ne précise pas si cette activité consistait en paroles inspirées, en manifestations extatiques ou en plusieurs éléments. « Prophétisa » maintient cette tension sans imposer une interprétation.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « lui aussi » conserve l’emphase du texte hébreu. « On dit » rend naturellement la formule proverbiale, et « resta ainsi » clarifie le lien entre la chute et la durée sans transformer « tomba » en simple état statique.
