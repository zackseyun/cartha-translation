base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: fr
  text: 'Jonathan parla favorablement de David à Saül, son père[a], et lui dit : « Que le roi ne pèche pas contre son serviteur, contre David[b], car il n’a pas péché contre toi, et ses actes t’ont été très bénéfiques. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parla en faveur de David à son père Saül ». Littéralement, l’hébreu dit « parla bien au sujet de David ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète la préposition : « contre son serviteur, contre David », ce qui précise l’identité du serviteur et marque une insistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... טוֹב
  choice: parla en bien de
  rationale: Cette expression française naturelle rend l’idiome hébreu « parler du bien au sujet de quelqu’un » et exprime l’intervention favorable de Jonathan.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: à Saül, son père
  rationale: La formulation suit l’ordre hébreu tout en employant une apposition claire en français.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: Que le roi ne pèche pas
  rationale: Le tour jussif avec אַל est rendu par une défense solennelle, et le titre à la troisième personne conserve la déférence de Jonathan envers Saül.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: contre son serviteur, contre David
  rationale: La répétition de בְּ est conservée afin de rendre l’insistance et l’apposition explicative de l’hébreu.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: car lui n’a pas péché contre toi
  rationale: La répétition de la racine « pécher » maintient le contraste rhétorique entre la faute envisagée de Saül et l’innocence de David; « lui » souligne naturellement ce contraste.
- source_word: מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: ses actes t’ont été très bénéfiques
  rationale: Cette formulation exprime clairement que les actions de David ont grandement profité à Saül, sans réduire טוֹב à une simple qualité morale.
theological_decisions:
- issue: Le sens moral de חטא dans les deux propositions
  choice: Conserver « pécher » dans les deux occurrences
  alternative: Traduire « faire du tort » ou « commettre une faute »
  rationale: Le maintien du même terme préserve le contraste moral et rhétorique voulu par le texte sans atténuer sa portée.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve la déférence de cour exprimée par « le roi », tandis que les répétitions significatives de l’hébreu sont maintenues sans rendre la phrase artificielle.
