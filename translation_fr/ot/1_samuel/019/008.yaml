  text: וַ/תּ֥וֹסֶף הַ/מִּלְחָמָ֖ה לִֽ/הְי֑וֹת וַ/יֵּצֵ֨א דָוִ֜ד וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יַּ֤ךְ בָּ/הֶם֙ מַכָּ֣ה גְדוֹלָ֔ה וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: fr
  text: La guerre reprit[a]. David partit combattre les Philistins et leur infligea une lourde défaite. Ils s’enfuirent devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La guerre continua » ou « Il y eut de nouveau la guerre ». L’expression hébraïque dit littéralement que « la guerre ajouta à être » et peut évoquer une reprise ou une continuation des combats.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: La guerre reprit
  rationale: L’expression avec יסף suivi de l’infinitif de היה indique ici la reprise ou le renouvellement de la guerre. Cette formulation est naturelle en français et conserve l’ambiguïté entre reprise et continuation, explicitée en note.
- source_word: וַיֵּצֵא דָוִד
  choice: David partit
  rationale: יצא signifie littéralement « sortir ». Dans ce contexte militaire, « partit » exprime naturellement le départ de David sans préciser un point de départ absent de l’hébreu.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: combattre les Philistins
  rationale: Le verbe לחם désigne l’action de combattre; la construction avec ב marque ici l’adversaire. En français moderne, « combattre les Philistins » est clair et idiomatique.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: leur infligea une lourde défaite
  rationale: La tournure נכה + מכה décrit un coup sévère porté à l’ennemi. « Infliger une lourde défaite » restitue le sens militaire sans supposer explicitement un massacre.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: Ils s’enfuirent devant lui
  rationale: Cette traduction conserve l’image de la fuite hors de la présence de David et reste naturelle dans un registre narratif digne.
