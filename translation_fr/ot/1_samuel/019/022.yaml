base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: fr
  text: 'Lui aussi se rendit à Rama. Arrivé à la grande citerne[a] qui se trouve à Sékou, il demanda : « Où sont Samuel et David ? » On lui répondit : « Les voilà[b] à Naïoth, à Rama. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand puits » ou « la grande fosse ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit : « Et il dit : Voici, à Naïoth, à Rama. » Le sujet de la réponse n’est pas précisé ; « on lui répondit » le rend anonyme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: se rendit à Rama
  rationale: Le hé directionnel indique un mouvement vers Rama ; cette formulation est naturelle en français narratif.
- source_word: בּוֹר הַגָּדוֹל
  choice: la grande citerne
  rationale: בּוֹר peut désigner une fosse, une citerne ou un puits. « Citerne » convient bien à un ouvrage servant de point de repère, tout en laissant en note les autres possibilités.
- source_word: בַּשֶּׂכוּ
  choice: à Sékou
  rationale: Le nom propre est translittéré et la préposition est rendue naturellement par « à ».
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: il demanda
  rationale: En français, le verbe introducteur suivi du discours direct exprime naturellement les deux verbes hébreux sans la lourdeur de « il demanda et dit ».
- source_word: אֵיפֹה
  choice: Où sont
  rationale: L’interrogatif porte sur le groupe coordonné « Samuel et David », d’où le pluriel en français.
- source_word: הִנֵּה
  choice: omis explicitement dans la réponse
  rationale: Ici, הִנֵּה introduit et présente la réponse. Un impératif comme « Regarde » serait peu naturel puisque l’endroit n’est pas nécessairement visible ; le français direct rend suffisamment sa fonction contextuelle.
- source_word: בנוית
  choice: à Naïoth
  rationale: Le nom propre est translittéré ; « à » convient pour situer des personnes dans ce lieu.
- source_word: בָּרָמָה
  choice: à Rama
  rationale: La phrase précise que Naïoth est situé à Rama ; « à Rama » est l’expression française naturelle.
- source_word: וַיֹּאמֶר
  choice: On lui répondit
  rationale: Le sujet hébreu n’est pas précisé. Le pronom indéfini « on » préserve cet anonymat, tandis que « répondit » explicite naturellement la fonction du verbe dans l’échange.
