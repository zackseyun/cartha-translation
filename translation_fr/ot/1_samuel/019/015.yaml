base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: fr
  text: 'Alors Saül envoya les messagers voir David, en leur disant : « Amenez-le-moi dans son lit[a], afin que je le mette à mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur son lit » ou « avec son lit ». La préposition hébraïque peut se comprendre de plusieurs manières ; l’ordre de Saül signifie probablement que David devait être transporté tel qu’il était couché.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors Saül envoya
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession des événements en français.
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: Dans ce récit de cour, מַלְאָךְ désigne les hommes envoyés par Saül, et non des êtres célestes.
- source_word: לִרְאוֹת
  choice: voir
  rationale: Cette traduction directe préserve le sens de ראה sans préciser indûment s'il s'agit de constater la présence ou l'état de David.
- source_word: לֵאמֹר
  choice: en leur disant
  rationale: Cette formule introduit naturellement en français l'ordre adressé aux messagers tout en conservant la structure de l'hébreu.
- source_word: הַעֲלוּ
  choice: Apportez-le-moi
  rationale: Le hifil de עלה signifie faire monter ou amener en haut. « Apportez-le-moi » convient à un homme supposé alité; la nuance directionnelle est ici portée par le contexte et la destination אֵלַי.
- source_word: בַמִּטָּה
  choice: dans son lit
  rationale: La préposition ב permet plusieurs compréhensions. Le contexte suggère que David doit être transporté tel qu'il est supposé se trouver, couché dans le lit; une note conserve les autres possibilités.
- source_word: אֵלַי
  choice: moi
  rationale: Le pronom intégré à « Apportez-le-moi » exprime clairement que Saül veut que David soit amené auprès de lui.
- source_word: לַהֲמִתוֹ
  choice: afin que je le mette à mort
  rationale: L'infinitif avec ל exprime ici le but. « Mettre à mort » garde la gravité et le registre de l'ordre royal.
