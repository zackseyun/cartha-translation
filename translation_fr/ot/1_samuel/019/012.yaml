  text: So Michal lowered David through the window, and he went and fled and escaped.
translation:
  language: fr
  text: Alors Mikal fit descendre David par la fenêtre. Il partit, s’enfuit et s’échappa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּרֶד
  choice: fit descendre
  rationale: Le hifil de ירד exprime ici l’action causative de faire descendre quelqu’un, probablement à l’aide d’un moyen implicite; « fit descendre » reste naturel sans ajouter un détail absent du texte.
- source_word: בְּעַד הַחַלּוֹן
  choice: par la fenêtre
  rationale: Dans ce contexte, בְּעַד indique le passage à travers l’ouverture; « par la fenêtre » est l’expression française idiomatique.
- source_word: וַיֵּלֶךְ וַיִּבְרַח וַיִּמָּלֵט
  choice: Il partit, s’enfuit et échappa ainsi à ses poursuivants
  rationale: La succession des trois verbes est conservée. « Échappa ainsi à ses poursuivants » explicite la valeur contextuelle de מלט tout en rendant la séquence naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le nom מיכל est transcrit « Mikal » afin de refléter plus directement l’hébreu et d’éviter la confusion avec le prénom masculin Michel.
