base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: fr
  text: Saül chercha à clouer David au mur avec la lance, mais David se déroba à Saül, et Saül planta la lance dans le mur. David s’enfuit et s’échappa cette nuit-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: à clouer David au mur avec la lance
  rationale: La construction hébraïque associe David et le mur comme cibles du coup; «clouer David au mur» exprime naturellement en français l’intention de le transpercer contre le mur, conformément au contexte.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: David se déroba devant lui
  rationale: Le verbe rare פטר décrit ici le fait de se dégager ou de s’esquiver hors de portée; «se déroba» rend ce mouvement sans ajouter de détail.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: Saül planta la lance dans le mur
  rationale: Littéralement, le texte dit qu’il frappa la lance dans le mur. «Planta» donne en français une image claire du projectile qui atteint et pénètre le mur; le nom explicite «Saül» évite l’ambiguïté des pronoms.
- source_word: נָס וַיִּמָּלֵט
  choice: s’enfuit et échappa ainsi à Saül
  rationale: Les deux verbes successifs expriment la fuite puis la mise en sûreté. Le complément «à Saül» est implicite dans le contexte et rend le français naturel.
- source_word: בַּלַּיְלָה הוּא
  choice: cette nuit-là
  rationale: La combinaison du nom avec le pronom démonstratif postposé désigne cette nuit précise.
