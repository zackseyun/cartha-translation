- from: Moi, je sortirai et je me tiendrai aux côtés de mon père dans le champ où tu seras. Je parlerai de toi à mon père, puis je verrai ce qu’il en est[a] et je te le dirai.
  to: Moi, je sortirai et je me tiendrai à côté de mon père dans le champ où tu es. Je parlerai de toi à mon père, puis je verrai ce qu’il en est[a] et je te le dirai.
  rationale: La révision remplace le futur interprétatif par le présent correspondant à la formulation hébraïque et améliore légèrement l’idiomaticité de l’expression de proximité. Elle maintient l’ellipse finale, explicitée seulement dans la note, sans en préciser indûment le contenu.
