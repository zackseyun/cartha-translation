base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: fr
  text: Moi, je sortirai et je me tiendrai à côté de mon père dans le champ où tu es. Je parlerai de toi à mon père, puis je verrai ce qu’il en est[a] et je te le dirai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je verrai quoi »; expression elliptique pouvant signifier « je verrai ce qui se passe » ou « je verrai quelle est la situation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: je sortirai
  rationale: Le qal à la première personne exprime l’action projetée de Jonathan; « sortir » conserve simplement le mouvement indiqué par le verbe.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: et je me tiendrai aux côtés de mon père
  rationale: עמד suivi de לְיַד décrit le fait de se placer ou de se tenir auprès de quelqu’un. Cette formulation est naturelle et conserve l’idée de proximité.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: dans le champ où tu seras
  rationale: La proposition relative désigne le champ où David doit se trouver au moment prévu. Le futur convient naturellement au projet annoncé dans le contexte.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: Je parlerai de toi à mon père
  rationale: Dans cette construction, דבר ב signifie parler au sujet de quelqu’un; « parler de toi à mon père » restitue clairement les deux compléments.
- source_word: וְרָאִיתִי מָה
  choice: puis je verrai ce qu’il en est
  rationale: L’hébreu dit elliptiquement « je verrai quoi ». L’expression française complète naturellement l’ellipse sans préciser d’avance ce que Jonathan découvrira.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: et je te le dirai
  rationale: Le hiphil de נגד signifie faire savoir ou rapporter. Le pronom « le » reprend naturellement ce que Jonathan aura constaté.
