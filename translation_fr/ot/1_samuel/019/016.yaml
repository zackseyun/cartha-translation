    rationale: וַיָּבֹאוּ signifie d’abord « ils vinrent/arrivèrent » ; le contexte permet l’arrivée dans la maison, mais le verbe ne l’énonce pas.
  - severity: medium
    issue: « à l’endroit de la tête » est maladroit en français.
    rationale: La formule est peu naturelle et rend insuffisamment la position/fonction de l’objet au chevet ou à la place de la tête. « À la place de la tête » reste sobre et n’identifie pas de façon excessive le référent du suffixe.
  - severity: low
    issue: La note contient une légère maladresse grammaticale et présente la couverture de manière trop affirmative.
    rationale: Il faut écrire « des représentations cultuelles domestiques ». Étant donné la rareté de כְּבִיר, la note devrait préciser que « couverture » est une interprétation contextuelle possible.
