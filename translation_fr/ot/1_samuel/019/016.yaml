  text: וַ/יָּבֹ֨אוּ֙ הַ/מַּלְאָכִ֔ים וְ/הִנֵּ֥ה הַ/תְּרָפִ֖ים אֶל הַ/מִּטָּ֑ה וּ/כְבִ֥יר הָ/עִזִּ֖ים מְרַאֲשֹׁתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: fr
  text: Quand les messagers arrivèrent, voici que les téraphim étaient dans le lit, avec une couverture de poil de chèvre à la place de la tête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « téraphim » étaient des objets ou des représentations cultuelles domestiques. Le mot traduit par « couverture » est rare et peut désigner plus généralement une pièce tissée ; « couverture de poil de chèvre » est une interprétation fondée sur le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: Dans ce contexte, il s’agit des hommes envoyés par Saül pour saisir David. « Messagers » rend naturellement le terme sans évoquer des êtres célestes.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure conserve l’effet de découverte soudaine du récit hébreu tout en restant naturelle en français.
- source_word: הַתְּרָפִים
  choice: les téraphim
  rationale: La translittération préserve le nom culturellement spécifique de ces objets cultuels sans préciser indûment leur taille ou leur fonction. Le pluriel grammatical de l’hébreu est maintenu.
- source_word: אֶל הַמִּטָּה
  choice: dans le lit
  rationale: Dans cette scène de découverte, la préposition exprime la position de l’objet placé dans le lit comme substitut du corps de David.
- source_word: וּכְבִיר הָעִזִּים
  choice: avec une couverture en poil de chèvre
  rationale: כְּבִיר est rare et désigne vraisemblablement une pièce tissée ou une couverture. Le contexte et הָעִזִּים permettent de comprendre qu’elle est faite en poil de chèvre.
- source_word: מְרַאֲשֹׁתָיו
  choice: à l’endroit de la tête
  rationale: L’expression désigne la place réservée à la tête. Cette formulation conserve l’ambiguïté du suffixe hébreu et évite d’attribuer artificiellement une tête réelle à l’objet.
theological_decisions:
- issue: Désignation de תְּרָפִים, objets cultuels associés à la religion domestique
  choice: les téraphim
  alternative: l’idole domestique / la statue d’idole
  rationale: Le texte nomme les objets sans formuler ici de jugement explicite. La translittération conserve leur spécificité culturelle et le pluriel de la forme hébraïque, sans imposer une interprétation plus précise que la source.
translation_notes:
  register: Français moderne, narratif et digne. « Voici que » garde la vivacité de la découverte. Le pluriel « les téraphim étaient » suit la morphologie hébraïque, tandis que « à l’endroit de la tête » préserve la tension référentielle du suffixe.
