base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: fr
  text: David s’enfuit et parvint à s’échapper. Il se rendit auprès de Samuel à Rama et lui raconta tout ce que Saül lui avait fait. Puis David et Samuel partirent et séjournèrent à Naïoth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naïoth est un nom de lieu ; le terme hébreu évoque probablement des habitations ou un établissement associé à Rama.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: s’enfuit et parvint à s’échapper
  rationale: 'Les deux verbes sont conservés : le premier exprime la fuite devant le danger, et le second son issue réussie. « Parvint à s’échapper » évite une répétition française maladroite sans introduire l’idée explicite d’une délivrance divine.'
- source_word: וַיָּבֹא אֶל שְׁמוּאֵל הָרָמָתָה
  choice: Il se rendit auprès de Samuel à Rama
  rationale: La construction présente Samuel comme la personne rejointe et Rama comme la destination. « Se rendit auprès de » exprime naturellement ce mouvement en français.
- source_word: וַיַּגֶּד לוֹ
  choice: lui raconta
  rationale: Dans ce récit, le hiphil de נגד signifie communiquer ou rapporter des faits. « Raconta » convient à l’exposé de tout ce que Saül lui avait fait.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: tout ce que Saül lui avait fait
  rationale: Cette formulation garde la totalité exprimée par כָּל, l’action antérieure de Saül et la dimension personnelle du complément לוֹ.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: Puis Samuel et lui partirent
  rationale: « Puis » rend la progression narrative du waw consécutif. La tournure française naturelle « Samuel et lui » conserve les deux sujets, dont le pronom hébreu explicite.
- source_word: וַיֵּשְׁבוּ
  choice: séjournèrent
  rationale: Dans ce contexte de déplacement, ישׁב désigne le fait de demeurer quelque temps dans un lieu plutôt que l’action littérale de s’asseoir.
- source_word: בְנוית
  choice: à Naïoth
  rationale: Le terme est traité comme un nom de lieu et translittéré selon l’usage français traditionnel. La préposition « à » convient à un séjour dans une localité.
