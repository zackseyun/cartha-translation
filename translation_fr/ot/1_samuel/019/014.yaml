  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: fr
  text: 'Alors Saül envoya des messagers pour saisir David[a], et elle dit : « Il est malade. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « et elle dit » ; le sujet féminin est identifié par le contexte comme Mikal.
    reason: Le sujet féminin singulier est implicite dans le texte hébreu ; la note explicite l’antécédent contextuel sans modifier le texte traduit.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors Saül envoya
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession en français.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte, le terme désigne des émissaires humains envoyés par Saül.
- source_word: לָקַחַת
  choice: pour saisir
  rationale: Le verbe signifie largement « prendre », mais le contexte indique qu'il s'agit d'appréhender David; « saisir » conserve cette force hostile sans surtraduire.
- source_word: אֶת דָּוִד
  choice: David
  rationale: La particule introduit le complément d'objet direct portant le nom propre David.
- source_word: וַתֹּאמֶר
  choice: et elle dit
  rationale: La forme verbale est au féminin singulier et la conjonction est rendue simplement par « et », sans ajouter un contraste absent de l'hébreu.
- source_word: חֹלֶה הוּא
  choice: Il est malade
  rationale: L'adjectif prédicatif suivi du pronom forme une déclaration simple et naturelle sur son état.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La traduction conserve la coordination simple de l'hébreu. Le féminin « elle » est grammaticalement explicite dans la forme verbale hébraïque; le contexte antérieur identifie la locutrice comme Mikal, sans qu'une note soit nécessaire ici.
