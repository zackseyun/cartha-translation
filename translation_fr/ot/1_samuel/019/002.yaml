  text: וַ/יַּגֵּ֤ד יְהוֹנָתָן֙ לְ/דָוִ֣ד לֵ/אמֹ֔ר מְבַקֵּ֛שׁ שָׁא֥וּל אָבִ֖/י לַ/הֲמִיתֶ֑/ךָ וְ/עַתָּה֙ הִשָּֽׁמֶר נָ֣א בַ/בֹּ֔קֶר וְ/יָשַׁבְתָּ֥ בַ/סֵּ֖תֶר וְ/נַחְבֵּֽאתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: fr
  text: 'Jonathan informa David en ces termes : « Saül, mon père, cherche à te tuer. Maintenant donc, je t’en prie, sois sur tes gardes au matin, reste dans un endroit caché[a] et tiens-toi caché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reste dans le secret », « reste à l’abri » ou « reste caché ». L’hébreu associe le verbe « rester » à un nom pouvant désigner le secret, un abri ou une cachette, puis ajoute « tiens-toi caché » pour renforcer la consigne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: informa
  rationale: Le hiphil de נגד signifie ici communiquer une information. « Informa » convient naturellement à l’avertissement donné par Jonathan.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule française introduit directement les paroles qui suivent tout en représentant la formule hébraïque d’introduction du discours.
- source_word: מְבַקֵּשׁ
  choice: cherche
  rationale: Le participe exprime l’intention actuelle et persistante de Saül sans affirmer qu’une tentative précise est déjà en cours.
- source_word: לַהֲמִיתֶךָ
  choice: à te faire mourir
  rationale: Le hiphil de מות signifie causer la mort. « Faire mourir » conserve cette valeur sans suggérer nécessairement une exécution judiciaire.
- source_word: הִשָּׁמֶר נָא
  choice: je t’en prie, sois sur tes gardes
  rationale: L’impératif niphal appelle David à se protéger et à rester vigilant ; « je t’en prie » rend la particule נָא et le ton pressant de Jonathan.
- source_word: בַבֹּקֶר
  choice: demain matin
  rationale: Littéralement « le matin » ; dans cette consigne donnée en vue de l’action suivante, le français idiomatique emploie « demain matin ».
- source_word: וְיָשַׁבְתָּ
  choice: reste
  rationale: ישב peut signifier s’asseoir, demeurer ou rester. Dans le contexte d’une cachette, « reste » transmet le sens contextuel sans littéralisme maladroit.
- source_word: בַסֵּתֶר
  choice: dans un lieu secret
  rationale: סֵתֶר peut désigner le secret, l’abri ou un lieu où l’on se cache. Le choix garde ici sa valeur locative et son ambiguïté lexicale est signalée en note.
- source_word: וְנַחְבֵּאתָ
  choice: tiens-toi caché
  rationale: Le verbe חבא exprime l’action de se cacher. Cette formulation réflexive naturelle maintient le renforcement produit par la proposition précédente.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: Jonathan ... David ... Saül, mon père
  rationale: Les noms suivent leurs formes françaises usuelles. « Mon père » est conservé, car il appartient aux paroles de Jonathan et souligne la tension personnelle de l’avertissement.
