    issue: « demain matin » ajoute une précision temporelle.
    rationale: Le texte hébreu dit littéralement « au/le matin ». Le contexte peut orienter vers le lendemain, mais cette précision n’est pas exprimée par le syntagme lui-même et ne doit pas être imposée dans le texte principal.
  - severity: low
    issue: « lieu secret » est moins précis en français pour סֵתֶר.
    rationale: Dans ce contexte, סֵתֶר renvoie à une dissimulation, une cachette ou un abri. « Endroit caché » conserve mieux la valeur locative sans suggérer seulement la confidentialité.
  - severity: low
    issue: « te faire mourir » est une formulation moins directe que nécessaire.
    rationale: Le verbe hébreu signifie « tuer / faire mourir »; « chercher à te tuer » est idiomatique, conserve le sens et n’implique pas une exécution officielle.
