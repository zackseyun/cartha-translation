  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: fr
  text: 'On informa Saül en ces termes : « David est à Naïoth, à Rama. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On informa
  rationale: Le passif hébreu indique que l’information fut communiquée à Saül sans identifier l’agent. Le français emploie naturellement le pronom indéfini « on » dans ce contexte tout en laissant l’agent indéterminé.
- source_word: לְשָׁאוּל
  choice: Saül
  rationale: Le complément indirect est intégré à la construction française « informer quelqu’un » ; le nom propre reçoit sa forme française usuelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit directement le contenu du message et rend naturellement la fonction quotative de l’infinitif hébreu.
- source_word: הִנֵּה
  choice: non exprimé séparément
  rationale: Dans ce bref rapport, הִנֵּה attire l’attention sur l’information annoncée. En français moderne, l’introduction directe après « en ces termes » porte suffisamment cette mise en relief ; « voici » devant une proposition de localisation serait moins naturel.
- source_word: דָוִד
  choice: David
  rationale: Forme française usuelle du nom propre.
- source_word: בְּנוָיֹת
  choice: à Naïoth
  rationale: La préposition בְ est locative. « À » est l’usage français naturel avec un nom de lieu, sans trancher la nature précise de Naïoth.
- source_word: בָּרָמָה
  choice: à Rama
  rationale: La seconde indication locative situe Naïoth par rapport à Rama ; la répétition de « à » reste claire et naturelle en français.
