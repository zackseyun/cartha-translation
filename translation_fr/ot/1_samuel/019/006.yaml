  text: וַ/יִּשְׁמַ֥ע שָׁא֖וּל בְּ/ק֣וֹל יְהוֹנָתָ֑ן וַ/יִּשָּׁבַ֣ע שָׁא֔וּל חַי יְהוָ֖ה אִם יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: fr
  text: 'Saül écouta Jonathan et jura : « Aussi vrai que Yahweh est vivant, David ne sera pas mis à mort[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Aussi vrai que Yahweh est vivant, s’il est mis à mort… » La particule hébraïque traduite littéralement par « si » fait ici partie d’une formule de serment elliptique et exprime une négation énergique : « il ne sera certainement pas mis à mort ».'
    reason: formule_de_serment_elliptique
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: Saül écouta Jonathan
  rationale: L’expression שׁמע בקול signifie ici écouter favorablement ou tenir compte de la parole de quelqu’un. « Écouta Jonathan » exprime naturellement en français la réponse de Saül à son intervention.
- source_word: וַיִּשָּׁבַע
  choice: il fit ce serment
  rationale: Le verbe désigne l’action de jurer ou de prêter serment. Cette formulation introduit clairement et dignement les paroles solennelles qui suivent.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette tournure française rend la formule hébraïque de serment et en conserve la force solennelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אִם יוּמָת
  choice: David ne sera pas mis à mort
  rationale: 'Dans cette formule de serment elliptique, אִם exprime une négation catégorique. Le hofal de מות est passif et causatif : « être mis à mort ». Le nom « David », explicite dans le contexte immédiat, évite en français une référence pronominale artificiellement ambiguë.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom personnel. « Yahweh » le conserve sans lui substituer un titre.
- issue: Interprétation de אִם dans la formule de serment
  choice: 'négation catégorique : « ne sera pas mis à mort »'
  alternative: 'traduction formelle elliptique : « s’il est mis à mort… »'
  rationale: Après חַי יְהוָה, אִם introduit une imprécation elliptique et porte ici la valeur d’une forte négation. Une traduction littérale avec « si » serait obscure et pourrait suggérer à tort une condition ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination est rendue par « puis » pour marquer la progression narrative. La formule « Aussi vrai que… » maintient le caractère solennel de l’ancien serment tout en restant immédiatement compréhensible.
