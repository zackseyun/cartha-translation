base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: fr
  text: On en informa Saül. Il envoya d’autres messagers, et eux aussi prophétisèrent. Saül envoya une troisième fois des messagers, et eux aussi prophétisèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: On le rapporta à Saül
  rationale: Le hiphil de נגד signifie « annoncer, rapporter ». La tournure impersonnelle française rend naturellement le pluriel indéfini hébreu sans inventer l’identité des informateurs.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: d’autres messagers
  rationale: מַלְאָכִים désigne ici des envoyés humains de Saül, et אֲחֵרִים les distingue du premier groupe.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: et eux aussi prophétisèrent
  rationale: Le hitpael de נבא est rendu par le terme biblique large « prophétiser », tandis que « eux aussi » conserve l’insistance de גַּם הֵמָּה sur la répétition du phénomène.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: Saül envoya encore
  rationale: יסף suivi d’une nouvelle action exprime ici la répétition; « encore » est idiomatique et conserve la progression narrative.
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: des messagers, une troisième fois
  rationale: שְׁלִשִׁים est compris contextuellement comme « pour la troisième fois » plutôt que comme le cardinal « trente ». Cette formulation française évite de suggérer explicitement que le texte parle d’un « troisième groupe » tout en clarifiant le sens.
theological_decisions:
- issue: Nature de l’activité prophétique des messagers
  choice: prophétisèrent
  alternative: entrèrent dans un état d’extase / se comportèrent en prophètes
  rationale: Le récit décrit un phénomène prophétique, mais ce verset n’en précise ni la forme ni le contenu. Le terme général préserve cette indétermination.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans être archaïque. La répétition « eux aussi prophétisèrent » reproduit l’insistance structurante de l’hébreu.
