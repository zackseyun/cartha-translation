source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: fr
  text: Car il a risqué sa vie[a] et a abattu le Philistin, et Yahvé a accompli une grande délivrance[b] pour tout Israël. Tu l’as vu et tu t’en es réjoui. Pourquoi donc pécherais-tu en faisant couler le sang d’un innocent, en mettant David à mort sans raison[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il a mis sa vie dans sa paume » ou « dans sa main ».'
    reason: L’expression imagée hébraïque décrit le fait d’exposer sa vie à un danger mortel.
  - marker: b
    text: 'On peut aussi traduire : « un grand salut » ou « une grande victoire ».'
    reason: Dans ce contexte militaire, תְּשׁוּעָה peut désigner le salut, la délivrance ou la victoire.
  - marker: c
    text: 'Ou : « gratuitement », c’est-à-dire sans motif valable.'
    reason: חִנָּם peut exprimer l’absence de cause, de justification ou de contrepartie.
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: il a risqué sa vie
  rationale: L’expression hébraïque signifie littéralement qu’il a placé sa vie dans sa paume, image qui exprime une exposition volontaire à un danger mortel. La traduction principale en donne naturellement le sens, tandis que la note conserve l’image.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: il a abattu le Philistin
  rationale: Dans ce contexte, נכה désigne le coup porté à Goliath qui entraîne sa défaite et sa mort. « Abattre » conserve la vigueur de l’action sans la réduire au seul verbe « tuer ».
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahvé a accordé un grand salut
  rationale: Le verbe עשה présente Yahvé comme l’auteur de l’intervention, et תְּשׁוּעָה peut désigner à la fois salut, délivrance et victoire. « A accordé » est naturel en français avec « salut » et maintient l’initiative divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre. « Yahvé » est la forme française courante.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: Tu l’as vu et tu t’en es réjoui
  rationale: Les deux verbes s’adressent directement à Saül. Les pronoms ajoutés rendent en français leur objet implicite, à savoir le salut accompli pour Israël.
- source_word: וְלָמָּה תֶחֱטָא בְּדָם נָקִי
  choice: Pourquoi donc pécherais-tu en faisant couler le sang d’un innocent
  rationale: La formulation française explicite naturellement l’idée hébraïque de faute liée au sang innocent, tout en conservant le vocabulaire moral et théologique du péché.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: en mettant David à mort sans raison
  rationale: L’infinitif précise comment Saül commettrait cette faute. חִנָּם signifie ici sans motif valable, gratuitement ou injustement.
theological_decisions:
- issue: Transcription du tétragramme יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom divin. Le rendre par un nom propre préserve cette distinction sans le remplacer par un titre.
- issue: Portée de תְּשׁוּעָה dans un contexte militaire
  choice: un grand salut
  alternative: une grande délivrance / une grande victoire
  rationale: Le contexte comprend une victoire militaire, mais le terme hébreu a une portée plus large et présente l’événement comme une intervention salvatrice de Dieu. « Salut » conserve cette tension, et la note indique les rendus contextuels possibles.
- issue: Responsabilité à l’égard du sang innocent
  choice: pécher en faisant couler le sang d’un innocent
  alternative: pécher contre le sang innocent
  rationale: Le choix principal exprime en français courant la culpabilité de sang impliquée par בְּדָם נָקִי, sans effacer le caractère moral et théologique de l’acte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle de Jonathan à Saül. La syntaxe reste accessible, tandis que « salut », « pécher » et « sang d’un innocent » préservent la portée théologique et judiciaire du texte.
