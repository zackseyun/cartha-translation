base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: fr
  text: 'Saül envoya des messagers à la maison de David pour le surveiller et le tuer au matin. Mikal, sa femme, avertit David : « Si tu ne sauves pas ta vie[a] cette nuit, demain tu seras mis à mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu ne t’échappes pas cette nuit, demain tu seras mis à mort. »'
    reason: L’expression hébraïque signifie littéralement délivrer ou sauver sa vie ; dans ce contexte, elle peut aussi être comprise comme « s’échapper avec la vie sauve ».
lexical_decisions:
- source_word: מַלְאָכִים
  choice: des hommes
  rationale: Dans ce contexte, le terme désigne des émissaires humains de Saül. « Des hommes » est naturel en français narratif et évite toute lecture angélique, bien que « messagers » soit plus formellement concordant.
- source_word: לְשָׁמְרוֹ
  choice: pour le surveiller
  rationale: Le verbe exprime ici une surveillance hostile de la maison de David, non une garde protectrice.
- source_word: וְלַהֲמִיתוֹ
  choice: et le tuer
  rationale: Le hiphil de מות exprime directement le fait de causer la mort; « tuer » convient au projet immédiat de Saül.
- source_word: בַּבֹּקֶר
  choice: au matin
  rationale: Cette expression temporelle indique le moment prévu pour tuer David; « au matin » est idiomatique et digne.
- source_word: וַתַּגֵּד
  choice: avertit
  rationale: Le sens de base est « annoncer/informer », mais le contenu et l'urgence du discours en font naturellement un avertissement en français.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: Mikal, sa femme
  rationale: Cette formulation conserve l'apposition hébraïque et identifie clairement le lien avec David.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: sauves ta vie
  rationale: L'expression signifie littéralement délivrer sa vie ou sa personne; « sauver sa vie » est clair et idiomatique, tandis que l'autre nuance possible est signalée en note.
- source_word: הַלַּיְלָה
  choice: cette nuit
  rationale: L'expression renvoie à la nuit présente; « cette nuit » est la formulation française naturelle.
- source_word: מוּמָת
  choice: tu seras mis à mort
  rationale: Le participe passif indique que David subira une mise à mort par des agents humains; la formulation préserve explicitement le passif.
