  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: fr
  text: Alors Saül envoya des messagers pour saisir David. Ils virent le groupe des prophètes[a] en train de prophétiser, avec Samuel qui se tenait debout à leur tête[b]. L’Esprit de Dieu vint sur les messagers de Saül, et eux aussi prophétisèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la troupe des prophètes ». Le terme hébreu désigne un groupe rassemblé.
    reason: lexical_alternative
  - marker: b
    text: Ou « au milieu d’eux ». L’hébreu peut aussi présenter Samuel comme placé au-dessus d’eux, dans une position de direction ou de supervision.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: messagers
  rationale: Dans ce récit, il s’agit d’émissaires humains envoyés par Saül, et non d’anges.
- source_word: לָקַחַת
  choice: pour saisir
  rationale: Le verbe signifie largement « prendre », mais le contexte indique que Saül veut faire arrêter David; « saisir » conserve cette intention hostile sans la surinterpréter.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: le groupe des prophètes
  rationale: Le nom désigne un ensemble réuni. « Groupe » est naturel en français moderne et n’ajoute aucune structure institutionnelle au texte.
- source_word: נִבְּאִים
  choice: en train de prophétiser
  rationale: Cette formulation rend la valeur progressive du participe et présente l’activité prophétique comme déjà en cours lorsque les messagers arrivent.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: se tenait debout à leur tête
  rationale: L’expression souligne la position stable de Samuel par rapport au groupe; « à leur tête » conserve la possible nuance de direction, tandis qu’une note signale l’ambiguïté spatiale.
- source_word: רוּחַ אֱלֹהִים
  choice: L’Esprit de Dieu
  rationale: Dans ce contexte, l’expression désigne l’action spirituelle venant de Dieu qui provoque l’activité prophétique, sans imposer au passage une précision doctrinale ultérieure.
- source_word: וַתְּהִי עַל
  choice: vint sur
  rationale: Cette tournure garde la force événementielle de l’expression hébraïque et demeure intelligible en français biblique moderne.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: eux aussi prophétisèrent
  rationale: « Eux aussi » restitue l’insistance de גַּם הֵמָּה sur le fait inattendu que les messagers de Saül participent à leur tour à l’activité prophétique.
theological_decisions:
- issue: Nature de רוּחַ אֱלֹהִים dans ce récit
  choice: « L’Esprit de Dieu vint sur les messagers de Saül »
  alternative: « Un esprit venant de Dieu vint sur les messagers de Saül »
  rationale: La construction sans article peut permettre une formulation indéfinie, mais, dans ce contexte, l’expression présente naturellement l’Esprit de Dieu comme l’agent de l’action prophétique. La traduction retenue préserve cette causalité divine sans importer une formulation doctrinale plus développée.
translation_notes:
  register: Français international moderne, narratif et digne. « Groupe » évite le caractère potentiellement militaire de « troupe », tandis que « à leur tête » exprime naturellement la nuance directrice possible de עֲלֵיהֶם. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
