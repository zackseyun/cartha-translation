base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: fr
  text: 'Alors Saül dit à Mikal : « Pourquoi m’as-tu ainsi trompé et as-tu laissé partir mon ennemi, de sorte qu’il s’est échappé ? » Mikal dit à Saül : « Il m’a dit : “Laisse-moi partir. Pourquoi te tuerais-je ?” »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « Laisse-moi partir, sinon je te tuerai. » Littéralement, l’hébreu dit : « Envoie-moi. Pourquoi te tuerais-je ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: m’as-tu trompé
  rationale: Le verbe רמה exprime ici la tromperie. « Tromper » est naturel en français moderne sans renforcer indûment l’accusation en « trahir ».
- source_word: כָּכָה
  choice: ainsi
  rationale: ככה indique la manière; « ainsi » restitue avec concision l’insistance de Saül.
- source_word: וַתְּשַׁלְּחִי / שַׁלְּחִנִי
  choice: tu as laissé partir / laisse-moi partir
  rationale: Dans ce contexte, שלח décrit le fait de permettre le départ. La répétition de « partir » maintient le lien lexical tout en produisant un dialogue français naturel.
- source_word: אֹיְבִי
  choice: mon ennemi
  rationale: Le terme conserve la désignation hostile que Saül applique à David ainsi que l’ironie narrative.
- source_word: וַיִּמָּלֵט
  choice: il s’est échappé
  rationale: Le nifal de מלט signifie « s’échapper ». La coordination française respecte la succession hébraïque sans imposer explicitement une relation finale.
- source_word: לָמָה אֲמִיתֵךְ
  choice: Pourquoi te tuerais-je ?
  rationale: Cette formulation traduit directement למה avec le hifil de מות et le suffixe féminin singulier, tout en préservant l’ambiguïté pragmatique de la question pouvant fonctionner comme une menace.
- source_word: מִיכַל
  choice: Mikal
  rationale: Translittération française proche de la forme hébraïque מִיכַל et distincte du prénom français Michel.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu שָׁאוּל.
theological_decisions:
- issue: Paroles rapportées attribuées à David par Mikal
  choice: « Laisse-moi partir. Pourquoi te tuerais-je ? »
  alternative: « Laisse-moi partir, sinon je te tuerai. »
  rationale: L’hébreu juxtapose un impératif et une question introduite par למה; il ne contient aucun équivalent explicite de « sinon ». Le texte principal conserve donc la formulation et sa tension, tandis que la note signale l’interprétation menaçante.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste vif sans archaïsme. La note conserve l’ambiguïté entre question littérale et menace implicite.
