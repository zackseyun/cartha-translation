revisions:
- from: 'Alors Saül dit à Mikal : « Pourquoi m’as-tu trompé ainsi ? Tu as laissé partir mon ennemi, et il s’est échappé ! » Mikal répondit à Saül : « Il m’a dit : “Laisse-moi partir. Pourquoi te tuerais-je ?” »[a]'
  to: 'Alors Saül dit à Mikal : « Pourquoi m’as-tu ainsi trompé et as-tu laissé partir mon ennemi, de sorte qu’il s’est échappé ? » Mikal dit à Saül : « Il m’a dit : “Laisse-moi partir. Pourquoi te tuerais-je ?” »[a]'
  rationale: 'La révision rétablit la portée interrogative des verbes coordonnés dans le reproche de Saül, emploie le verbe narratif neutre « dit » et rend exacte la mention de littéralité dans la note. Elle conserve l’ambiguïté de la parole rapportée : le texte principal ne transforme pas la question en menace conditionnelle explicite.'
