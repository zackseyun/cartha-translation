base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: fr
  text: Saül dit à Jonathan, son fils, et à tous ses serviteurs de tuer David[a]. Mais Jonathan, fils de Saül, appréciait beaucoup David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de faire mourir David ». Le verbe hébreu est à une forme causative, souvent employée dans ce contexte au sens de « tuer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prenait grand plaisir en David », « avait beaucoup d’affection pour David » ou « aimait beaucoup David ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: déclara
  rationale: Dans ce contexte narratif, דבר introduit les paroles par lesquelles Saül communique son intention. « Déclara » est naturel et évite de transformer implicitement ces paroles en ordre explicite.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme peut désigner les serviteurs, dignitaires ou hommes de cour du roi. « Serviteurs » conserve la désignation hébraïque sans préciser indûment leur fonction.
- source_word: לְהָמִית אֶת דָּוִד
  choice: qu’il fallait faire mourir David
  rationale: L’infinitif causatif de מות exprime ici le contenu ou le but des paroles de Saül. « Faire mourir » en conserve la forme causative, tandis que « qu’il fallait » donne en français une construction intelligible sans décider exactement qui devait exécuter cette volonté.
- source_word: וִיהוֹנָתָן
  choice: Mais Jonathan
  rationale: Le waw marque ici un contraste narratif entre le projet de Saül et l’attachement de Jonathan envers David.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: était très attaché à David
  rationale: חפץ ב exprime le plaisir, l’affection ou une disposition très favorable envers une personne. « Était très attaché à » rend naturellement cette vive affection sans employer automatiquement « aimer », correspondant ailleurs à un autre verbe hébreu.
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: son fils / fils de Saül
  rationale: Les deux indications de filiation sont conservées, comme dans l’hébreu, malgré leur proximité.
