revisions:
- from: Saül déclara à son fils Jonathan et à tous ses serviteurs qu’il fallait faire mourir David[a]. Mais Jonathan, fils de Saül, était très attaché à David[b].
  to: Saül dit à Jonathan, son fils, et à tous ses serviteurs de tuer David[a]. Mais Jonathan, fils de Saül, appréciait beaucoup David[b].
  rationale: La révision remplace l’obligation impersonnelle par une construction française qui relie naturellement les paroles de Saül à Jonathan et à ses serviteurs, tout en gardant « dit », qui ne surinterprète pas le verbe hébreu comme un terme technique d’ordre. La note sur le causatif est corrigée. Le rendu de חָפֵץ בְּ est ajusté pour exprimer une faveur ou une affection marquée dans un français moderne sobre.
