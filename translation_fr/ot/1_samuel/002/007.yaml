source:
  edition: WLC
  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: fr
  text: Yahweh rend pauvre[a] et rend riche ; il abaisse, et il élève[b] aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appauvrit ». Le verbe hébreu peut aussi évoquer plus largement le fait de causer une perte ou de déposséder.
    reason: lexical_alternative
  - marker: b
    text: Ou « exalte » ou « relève ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: מוֹרִישׁ
  choice: rend pauvre
  rationale: Dans ce parallélisme antithétique avec « rend riche », la forme causative exprime naturellement l’appauvrissement. La note conserve la possibilité lexicale plus large de perte ou de dépossession.
- source_word: וּמַעֲשִׁיר
  choice: et rend riche
  rationale: La formulation rend clairement la valeur causative du verbe et maintient la symétrie avec « rend pauvre ».
- source_word: מַשְׁפִּיל
  choice: il abaisse
  rationale: Ce choix préserve l’image verticale du texte et son opposition avec « il élève », sans limiter le sens à l’humilité intérieure.
- source_word: אַף
  choice: aussi
  rationale: L’adverbe garde la valeur additive et légèrement emphatique du terme hébreu sans imposer une opposition absente du texte.
- source_word: מְרוֹמֵם
  choice: il élève
  rationale: « Élève » conserve l’image verticale en parallèle avec « abaisse » et peut également porter le sens figuré d’exalter.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel de Dieu au lieu de lui substituer un titre.
- issue: Action souveraine exprimée par les verbes causatifs
  choice: Conserver les formulations directes « rend pauvre », « rend riche », « abaisse » et « élève »
  alternative: Atténuer par des formulations permissives telles que « laisse devenir pauvre »
  rationale: Les formes hébraïques attribuent directement ces renversements à Yahweh. La traduction préserve cette tension théologique sans l’expliquer ni l’atténuer.
translation_notes:
  register: Français international moderne, simple et digne. La structure antithétique et le parallélisme poétique sont conservés, avec la répétition de « rend » et de « il » pour la clarté et le rythme.
