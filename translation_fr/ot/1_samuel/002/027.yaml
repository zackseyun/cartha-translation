    text: « La maison de ton père » peut désigner la maisonnée ou la lignée ancestrale, et non seulement le père immédiat d’Éli.
    reason: La note éclaire la portée possible de l’expression hébraïque sans remplacer dans le texte sa formulation plus littérale.
  - marker: b
    text: Ou « rattachés à la maison de Pharaon ». L’expression peut évoquer leur dépendance à l’égard de la maison royale égyptienne.
    reason: Le complément hébreu est concis; la note signale une nuance possible sans imposer « au service de ».
  revision_rationale: La révision rétablit « maison de ton père » et évite de spécifier une relation de service envers Pharaon. Elle conserve l’intensité de la question rhétorique par « clairement » et fournit des notes pour les deux expressions dont la portée contextuelle dépasse le sens familial ou spatial immédiat.
