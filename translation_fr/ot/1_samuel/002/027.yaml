  to: 'Un homme de Dieu vint trouver Éli et lui dit : « Voici ce que dit le SEIGNEUR : Ne me suis-je pas clairement révélé à la maison de ton père, lorsqu’ils étaient en Égypte, dans la maison de Pharaon ? »'
  rationale: La révision rétablit « maison de ton père » et évite de spécifier une relation de service envers Pharaon. Elle conserve l’intensité de la question rhétorique par « clairement » et fournit des notes pour les deux expressions dont la portée contextuelle dépasse le sens familial ou spatial immédiat.
