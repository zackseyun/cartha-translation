  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: fr
  text: 'Un homme de Dieu vint trouver Éli et lui dit : « Voici ce que dit le SEIGNEUR : Ne me suis-je pas clairement révélé à la maison de ton père, lorsqu’ils étaient en Égypte, dans la maison de Pharaon ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: un homme de Dieu
  rationale: Expression consacrée et naturelle en français, qui désigne ici un messager prophétique sans préciser davantage son identité.
- source_word: בֵּית אָבִיךָ
  choice: la famille de ton ancêtre
  rationale: Dans ce contexte, בֵּית désigne la maisonnée ou la lignée, et אָבִיךָ renvoie vraisemblablement à l’ancêtre d’Éli, non à son père immédiat.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: Ne me suis-je pas clairement révélé
  rationale: L’infinitif absolu joint au verbe conjugué intensifie l’affirmation; « clairement » rend cette insistance sans lourdeur.
- source_word: לְבֵית פַּרְעֹה
  choice: au service de la maison du pharaon
  rationale: Le לְ exprime ici probablement le rattachement ou la sujétion à la maison royale; cette formulation française conserve l’idée d’appartenance fonctionnelle sans suggérer qu’Aaron était membre de la famille de Pharaon.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rendu traditionnel du tétragramme en français, signalé par les petites capitales.
theological_decisions:
- issue: Identité de la « maison du père » d’Éli
  choice: la famille de ton ancêtre
  alternative: la maison de ton père
  rationale: Le contexte suivant évoque l’élection de la lignée sacerdotale d’Aaron en Égypte. La traduction retenue évite de faire croire au lecteur moderne qu’il s’agit seulement du père immédiat d’Éli.
- issue: Rapport de la lignée sacerdotale à la maison de Pharaon
  choice: au service de la maison du pharaon
  alternative: dans la maison du pharaon / appartenant à la maison du pharaon
  rationale: L’hébreu est compact et permet plusieurs nuances. Le contexte égyptien soutient une relation de sujétion ou de service plutôt qu’une appartenance généalogique à la dynastie royale.
translation_notes:
  register: Français moderne, digne et accessible. La formule prophétique « Voici ce que dit le SEIGNEUR » reste solennelle sans archaïsme. La question rhétorique et l’intensité de la révélation divine sont préservées.
