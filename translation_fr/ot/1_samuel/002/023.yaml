  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: fr
  text: 'Il leur dit : « Pourquoi agissez-vous ainsi ? Car j’entends tous ces gens parler de vos mauvaises actions[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « J’entends de la part de tous ces gens vos mauvaises paroles — ou : vos mauvaises affaires. » Dans ce contexte, il s’agit des échos reçus au sujet de leur mauvaise conduite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Il leur dit
  rationale: Le wayyiqtol fait avancer le récit. Le présent de narration est naturel en français et לָהֶם est rendu par le pronom indirect « leur ».
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: Pourquoi agissez-vous ainsi ?
  rationale: L’imparfait hébreu désigne ici une conduite en cours ou habituelle. « Agissez-vous ainsi » exprime naturellement le sens de « faire de telles choses » sans alourdir la réprimande.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: J’entends en effet
  rationale: Le participe avec le pronom indépendant présente ce qu’Éli entend actuellement. « En effet » rend la valeur explicative de la proposition dans le contexte.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: parler de vos mauvaises actions
  rationale: דְּבָרִים peut désigner des paroles, des faits ou des affaires. Dans le contexte, il s’agit des actes répréhensibles des fils d’Éli dont le peuple parle ; la formulation française explicite cette construction sans masquer l’expression littérale, signalée en note.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: tout ce peuple
  rationale: מֵאֵת indique la source de ce qu’Éli entend, tandis que כָּל הָעָם אֵלֶּה désigne collectivement « tout ce peuple ». La syntaxe française l’intègre naturellement comme sujet de « parler ».
