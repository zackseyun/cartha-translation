  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: fr
  text: Ceux qui étaient rassasiés se font embaucher pour du pain, mais ceux qui avaient faim ont cessé[a]. Même la femme stérile a enfanté sept[b], tandis que celle qui avait beaucoup de fils dépérit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « ont cessé », sans préciser ce qui a cessé; le contexte peut signifier qu’ils ont cessé d’avoir faim ou de manquer de nourriture.
    reason: lexical_alternative
  - marker: b
    text: « Sept » peut désigner un nombre précis ou évoquer poétiquement la plénitude.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: ceux qui étaient rassasiés
  rationale: L’adjectif substantivé désigne ceux qui vivaient dans l’abondance; « rassasiés » conserve le contraste avec les affamés.
- source_word: בַּלֶּחֶם
  choice: pour du pain
  rationale: Conserve l’image concrète du pain, qui peut aussi représenter la nourriture en général.
- source_word: נִשְׂכָּרוּ
  choice: se louent
  rationale: Le nifal exprime ici le fait de devenir travailleurs à gages; cette formulation concise rend le renversement de leur situation.
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: mais ceux qui avaient faim ont cessé
  rationale: Le verbe signifie « cesser » et son complément reste sous-entendu en hébreu; le français maintient cette ellipse poétique, expliquée en note.
- source_word: עַד
  choice: même
  rationale: Dans ce contexte, la préposition marque le degré extrême du renversement, « au point que même ».
- source_word: עֲקָרָה
  choice: la femme stérile
  rationale: Rend directement l’adjectif féminin substantivé et préserve le contraste avec la mère de nombreux fils.
- source_word: יָלְדָה שִׁבְעָה
  choice: a enfanté sept fils
  rationale: Le verbe exprime l’enfantement; « fils », implicite en hébreu par rapport au membre parallèle, produit en français une phrase naturelle tout en conservant la référence masculine.
- source_word: וְרַבַּת בָּנִים
  choice: celle qui avait beaucoup de fils
  rationale: Préserve le sens explicitement masculin de בָּנִים et le contraste poétique.
- source_word: אֻמְלָלָה
  choice: dépérit
  rationale: Le verbe évoque l’affaiblissement et le déclin; « dépérit » restitue cette image sans ajouter l’idée explicite de mort.
theological_decisions:
- issue: Valeur littérale ou symbolique du nombre sept
  choice: Conserver « sept » sans l’interpréter dans le texte principal
  alternative: Comprendre sept comme un nombre poétique exprimant la plénitude
  rationale: L’hébreu donne directement le nombre et permet que sa valeur soit à la fois concrète et évocatrice de plénitude.
- issue: Explicitation de l’objet de חָדֵלּוּ
  choice: 'Maintenir l’ellipse : « ont cessé »'
  alternative: « ont cessé d’avoir faim » ou « ne souffrent plus de la faim »
  rationale: Le texte hébreu ne formule pas l’objet du verbe. La note indique le sens contextuel probable sans fermer l’ambiguïté du vers poétique.
- issue: Rendu de בָּנִים
  choice: fils
  alternative: enfants
  rationale: Le terme source est masculin pluriel et le parallèle poétique n’impose pas de le généraliser.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et les renversements du cantique sont conservés. « Se louer » est littéraire mais encore clair dans le sens de travailler comme salarié; « dépérit » rend sobrement le déclin évoqué par le dernier verbe.
