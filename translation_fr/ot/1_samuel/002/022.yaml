revisions:
- from: Éli était très âgé et il apprit tout ce que ses fils faisaient à tout Israël, ainsi que le fait qu’ils couchaient avec les femmes qui servaient[a] à l’entrée de la tente de la rencontre.
  to: Éli était très âgé. Il entendit parler de tout ce que ses fils faisaient à l’égard de tout Israël, et du fait qu’ils couchaient avec les femmes qui servaient[a] à l’entrée de la tente de la Rencontre.
  rationale: La révision rapproche le verbe principal de son sens premier (« entendre ») et remplace une tournure française maladroite par une expression naturelle qui maintient l’ambiguïté de la préposition hébraïque. Elle conserve l’euphémisme sexuel, le registre narratif sobre, l’expression cultuelle et l’ancre de note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:52:49Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’âge avancé d’Éli, les agissements continus de ses fils, l’euphémisme sexuel et la fonction/présence ambiguë des femmes. « Il apprit » est possible, mais « il entendit parler » reflète plus directement וְשָׁמַע, sans suggérer davantage qu’Éli serait parvenu à une connaissance nouvelle par un procédé particulier. La relation exprimée par לְכָל־יִשְׂרָאֵל est mieux rendue en français par « à l’égard de tout Israël » que par « faisaient à tout Israël », formulation peu idiomatique et ambiguë.
  naturalness: La phrase révisée est naturelle en français international moderne. « Entendit parler de » convient au contexte de rapports sur une conduite en cours. « Tente de la Rencontre » est une désignation cultuelle française claire et établie.
  terminology: « Coucher avec » conserve l’euphémisme explicite de l’hébreu. « Les femmes qui servaient » ne leur attribue pas indûment une fonction sacerdotale; la note préserve sobrement l’alternative lexicale « qui se rassemblaient ».
  issues:
  - severity: medium
    issue: « il apprit »
    rationale: Ce verbe est défendable, mais il explicite légèrement l’aboutissement de la connaissance. Le verbe hébreu signifie d’abord qu’Éli entendit; « il entendit parler » est à la fois plus proche de la source et idiomatique dans ce contexte.
  - severity: medium
    issue: « tout ce que ses fils faisaient à tout Israël »
    rationale: Cette construction est grammaticalement possible mais peu naturelle en français et laisse incertaine la relation des actes à Israël. « à l’égard de tout Israël » rend la portée relationnelle de ל sans imposer « contre ».
  revised_text: Éli était très âgé. Il entendit parler de tout ce que ses fils faisaient à l’égard de tout Israël, et du fait qu’ils couchaient avec les femmes qui servaient[a] à l’entrée de la tente de la Rencontre.
  revised_footnotes:
  - marker: a
    text: Ou « qui se rassemblaient ». Le participe hébreu peut désigner le fait de se rassembler ou d’accomplir un service organisé.
    reason: Alternative lexicale authentique concernant le rôle des femmes à l’entrée du sanctuaire.
  revision_rationale: La révision rapproche le verbe principal de son sens premier (« entendre ») et remplace une tournure française maladroite par une expression naturelle qui maintient l’ambiguïté de la préposition hébraïque. Elle conserve l’euphémisme sexuel, le registre narratif sobre, l’expression cultuelle et l’ancre de note.
