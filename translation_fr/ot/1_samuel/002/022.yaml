  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: fr
  text: Éli était très âgé. Il entendit parler de tout ce que ses fils faisaient à l’égard de tout Israël, et du fait qu’ils couchaient avec les femmes qui servaient[a] à l’entrée de la tente de la Rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se rassemblaient ». Le participe hébreu peut désigner le fait de se rassembler ou d’accomplir un service organisé.
    reason: Alternative lexicale authentique concernant le rôle des femmes à l’entrée du sanctuaire.
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: était très âgé
  rationale: L’adjectif prédicatif accompagné de l’intensif exprime naturellement un état fortement marqué. « Très âgé » est clair, digne et idiomatique.
- source_word: וְשָׁמַע
  choice: et il apprit
  rationale: Le qatal rapporte ici le fait qu’Éli eut connaissance de ces actes. Le passé simple convient au récit et évite d’imposer une valeur itérative.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: tout ce que ses fils faisaient
  rationale: L’imparfait français rend bien les agissements habituels ou continus résumés dans ce verset.
- source_word: לְכָל יִשְׂרָאֵל
  choice: à tout Israël
  rationale: Cette formulation conserve la relation marquée par ל sans préciser excessivement « contre » ou « pour », sens que le contexte pourrait suggérer mais que la préposition seule ne tranche pas.
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: ils couchaient avec les femmes
  rationale: Le verbe hébreu emploie un euphémisme sexuel conventionnel. « Coucher avec » en restitue clairement le sens sans devenir plus explicite que la source.
- source_word: הַצֹּבְאוֹת
  choice: qui servaient
  rationale: Dans ce contexte cultuel, le participe peut désigner un service organisé. « Servaient » est naturel et n’importe aucune fonction institutionnelle ultérieure.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Cette traduction lisible conserve l’expression cultuelle et le sens spatial précis de l’hébreu.
theological_decisions:
- issue: Nature du rôle des femmes auprès du sanctuaire
  choice: les femmes qui servaient à l’entrée
  alternative: les femmes qui se rassemblaient à l’entrée
  rationale: Le participe הַצֹּבְאוֹת peut évoquer soit un service organisé, soit un rassemblement. Le contexte cultuel, rapproché d’Exode 38.8, favorise « servaient », sans faire de ces femmes des prêtresses.
- issue: Degré d’explicitation de l’inconduite sexuelle
  choice: ils couchaient avec les femmes
  alternative: ils avaient des relations sexuelles avec les femmes
  rationale: La traduction retient un euphémisme français clair, conforme au caractère euphémistique du verbe hébreu, sans atténuer ni rendre plus clinique l’accusation.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination serrée suit la structure hébraïque tout en restant lisible. « Tente de la rencontre » conserve le terme cultuel sans archaïsme marqué.
