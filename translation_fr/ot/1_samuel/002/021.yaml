  text: כִּֽי פָקַ֤ד יְהוָה֙ אֶת חַנָּ֔ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד שְׁלֹשָֽׁה בָנִ֖ים וּ/שְׁתֵּ֣י בָנ֑וֹת וַ/יִּגְדַּ֛ל הַ/נַּ֥עַר שְׁמוּאֵ֖ל עִם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: fr
  text: 'Car Yahweh intervint en faveur d’Anne[a] : elle devint enceinte et mit au monde trois fils et deux filles. Quant au jeune Samuel, il grandit auprès de Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prit soin d’Anne » ou « se préoccupa d’Anne ». Le verbe hébreu peut désigner une intervention bienveillante en faveur de quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec Yahweh » ; dans ce contexte, l’expression peut évoquer le fait que Samuel grandissait dans la présence de Yahweh, au sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication ou la suite logique de ce qui précède ; « Car » en conserve la valeur explicative.
- source_word: פָקַד
  choice: intervint en faveur de
  rationale: Dans ce contexte, le verbe désigne l’attention agissante et bienveillante de Yahweh envers Anne, manifestée par sa fécondité. Cette formulation est naturelle en français sans réduire le sens à une simple prise de connaissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: וַתַּהַר
  choice: elle devint enceinte
  rationale: Formulation française actuelle et directe du fait de concevoir.
- source_word: וַתֵּלֶד
  choice: mit au monde
  rationale: Équivalent naturel de ילד dans un contexte de naissance.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: trois fils et deux filles
  rationale: Rendu direct des nombres et des termes de parenté.
- source_word: וַיִּגְדַּל
  choice: il grandissait
  rationale: L’imparfait exprime naturellement le développement progressif de Samuel dans le récit.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: le jeune Samuel
  rationale: « Jeune » rend נַעַר avec naturel, sans préciser davantage que l’hébreu son âge exact.
- source_word: עִם יְהוָה
  choice: auprès de Yahweh
  rationale: Littéralement « avec Yahweh ». « Auprès de » reste proche de cette relation de proximité tout en convenant au cadre du sanctuaire, sans transformer explicitement la phrase en « devant Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin ; le conserver distingue le nom personnel d’un titre.
- issue: Sens de עִם יְהוָה dans la croissance de Samuel
  choice: auprès de Yahweh
  alternative: avec Yahweh ; devant Yahweh ; en présence de Yahweh
  rationale: La formulation retenue préserve l’idée inhabituelle de proximité exprimée par עִם et permet au contexte du sanctuaire d’éclairer cette proximité, sans imposer une interprétation mystique ni remplacer le sens par une formule cultuelle plus explicite.
translation_notes:
  register: Français international moderne, narratif et digne. « Anne » suit la forme française traditionnelle du nom. La seconde phrase est introduite par « Quant à » afin de marquer naturellement le changement de sujet, tandis que « auprès de Yahweh » conserve l’ambiguïté relationnelle et spatiale de l’hébreu.
