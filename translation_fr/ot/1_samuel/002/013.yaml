  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: fr
  text: 'La pratique des prêtres à l’égard du peuple était la suivante : chaque fois qu’un homme offrait un sacrifice, le serviteur du prêtre venait pendant que la viande cuisait, avec une fourchette à trois dents à la main[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un croc à viande » : le mot hébreu désigne un ustensile semblable à une fourchette, utilisé pour retirer la viande du récipient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: Voici quelle était la pratique
  rationale: מִשְׁפָּט peut désigner une règle, un droit établi ou une coutume. Dans ce récit, « pratique » introduit naturellement la manière habituelle d’agir des prêtres sans lui conférer d’emblée une légitimité juridique.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: des prêtres envers le peuple
  rationale: « Envers le peuple » exprime la relation visée par אֶת sans préciser abusivement si cette conduite était favorable ou hostile.
- source_word: כָּל־אִישׁ
  choice: chaque fois qu’un homme
  rationale: Le singulier masculin אִישׁ est conservé par « un homme », tandis que la tournure temporelle rend le caractère distributif et habituel de la scène.
- source_word: זֹבֵחַ זֶבַח
  choice: offrait un sacrifice
  rationale: Le français naturel évite de reproduire lourdement la construction étymologique « sacrifiait un sacrifice », tout en gardant clairement l’acte sacrificiel.
- source_word: וּבָא
  choice: venait
  rationale: L’imparfait rend l’action répétée qui caractérise cette pratique habituelle.
- source_word: נַעַר הַכֹּהֵן
  choice: le serviteur du prêtre
  rationale: נַעַר peut désigner un jeune homme ou un serviteur. Ici, sa fonction auprès du prêtre est saillante; « serviteur » évite de lui attribuer un âge précis.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: pendant que la viande cuisait
  rationale: La préposition כ avec l’infinitif construit a une valeur temporelle. « Cuisait » reste naturel et ne précise pas davantage que l’hébreu le mode exact de cuisson.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: une fourchette à trois dents
  rationale: La formulation traduit l’image littérale des « trois dents » et désigne clairement l’ustensile servant à retirer la viande.
- source_word: בְּיָדוֹ
  choice: tenant à la main
  rationale: Cette tournure française naturelle indique que le serviteur portait l’ustensile, tout en conservant la référence explicite à la main.
theological_decisions:
- issue: Statut normatif de la pratique sacerdotale
  choice: « pratique »
  alternative: « règle » ou « droit »
  rationale: Le contexte décrit la conduite habituelle des prêtres, mais le terme מִשְׁפָּט pourrait aussi évoquer une règle ou un droit dû. « Pratique » préserve ici la description narrative sans présenter implicitement l’abus comme une prescription légitime.
translation_notes:
  register: Français international moderne, courant et digne. L’imparfait porte la valeur habituelle du passage. « Fourchette à trois dents » est immédiatement compréhensible; l’appellation plus traditionnelle « croc à viande » est conservée en note.
