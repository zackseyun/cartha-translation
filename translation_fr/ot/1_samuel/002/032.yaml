id: 1SA.2.32
reference: 1 Samuel 2:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: fr
  text: Tu verras la détresse de la demeure au milieu de tout le bien qu’il fera à Israël[a], et il n’y aura jamais de vieillard dans ta maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un adversaire dans la demeure », « la détresse dans le sanctuaire », ou une formulation semblable ; l’expression hébraïque est difficile.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: Tu verras
  rationale: Le hifil de נבט signifie ici regarder ou voir. « Tu verras » est direct et naturel, sans ajouter une nuance d’envie qui n’est pas certaine.
- source_word: צַר מָעוֹן
  choice: la détresse de la demeure
  rationale: Cette formulation reste proche des sens possibles de צַר et de מָעוֹן tout en conservant l’obscurité réelle de l’expression hébraïque.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת יִשְׂרָאֵל
  choice: au milieu de tout le bien qu’il fera à Israël
  rationale: La tournure exprime la simultanéité entre la détresse annoncée et le bien accordé à Israël. Le sujet implicite du verbe reste implicite en français.
- source_word: זָקֵן
  choice: de vieillard
  rationale: Le mot désigne ici un homme parvenu à un âge avancé, et non le titulaire d’une fonction d’ancien.
- source_word: בְּבֵיתְךָ
  choice: dans ta maison
  rationale: « Maison » conserve l’image hébraïque tout en pouvant naturellement désigner la famille ou la lignée d’Éli.
- source_word: כָּל הַיָּמִים
  choice: jamais
  rationale: Dans cette phrase négative, l’expression idiomatique « tous les jours » signifie qu’aucun membre de la maison n’atteindra la vieillesse; « jamais » rend ce sens clairement en français courant.
theological_decisions:
- issue: Interprétation de l’expression difficile צַר מָעוֹן
  choice: la détresse de la demeure
  alternative: un adversaire dans la demeure; la détresse dans le sanctuaire
  rationale: L’hébreu est difficile et permet plusieurs analyses. La traduction principale demeure formelle et ne précise pas indûment s’il s’agit d’une personne hostile, d’une affliction du sanctuaire ou d’une détresse liée à celui-ci.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « au milieu de » est plus idiomatique que le calque « dans tout le bien ». « Demeure » préserve la portée cultuelle possible sans imposer « sanctuaire » dans le texte principal.
