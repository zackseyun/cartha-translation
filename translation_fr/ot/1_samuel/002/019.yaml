id: 1SA.2.19
reference: 1 Samuel 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מְעִ֤יל קָטֹן֙ תַּעֲשֶׂה לּ֣/וֹ אִמּ֔/וֹ וְ/הַעַלְתָ֥ה ל֖/וֹ מִ/יָּמִ֣ים יָמִ֑ימָ/ה בַּֽ/עֲלוֹתָ/הּ֙ אֶת אִישָׁ֔/הּ לִ/זְבֹּ֖חַ אֶת זֶ֥בַח הַ/יָּמִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: fr
  text: Sa mère lui confectionnait un petit manteau[a] et le lui apportait chaque année[b], lorsqu’elle montait avec son mari pour offrir le sacrifice annuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une petite robe ». Le mot hébreu désigne un vêtement de dessus.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de jours en jours », expression qui signifie ici « d’année en année ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: manteau
  rationale: Le terme désigne un vêtement de dessus, éventuellement porté dans un cadre cultuel. « Manteau » est clair en français moderne sans préciser indûment sa forme.
- source_word: קָטֹן
  choice: petit
  rationale: L’adjectif indique que le vêtement était de petite taille, adapté à l’enfant Samuel.
- source_word: תַּעֲשֶׂה
  choice: confectionnait
  rationale: L’imparfait hébreu exprime ici une action habituelle dans le passé. « Confectionnait » convient naturellement à la fabrication d’un vêtement.
- source_word: וְהַעַלְתָה לּוֹ
  choice: et le lui apportait
  rationale: La forme verbale exprime également une action répétée. Le contexte de la montée au sanctuaire permet de rendre simplement le transport du vêtement, tandis que « montait » dans la proposition suivante conserve le motif de l’ascension.
- source_word: מִיָּמִים יָמִימָה
  choice: chaque année
  rationale: Littéralement « de jours en jours », cette locution idiomatique désigne une périodicité annuelle.
- source_word: בַּעֲלוֹתָהּ
  choice: lorsqu’elle montait
  rationale: La préposition et l’infinitif construit ont une valeur temporelle. « Montait » préserve le langage du pèlerinage vers le sanctuaire.
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte relationnel, אִישׁ avec le suffixe féminin signifie « son mari ».
- source_word: לִזְבֹּחַ
  choice: pour offrir
  rationale: Le verbe désigne l’acte sacrificiel; avec « sacrifice » comme complément, « offrir » produit une expression française naturelle.
- source_word: זֶבַח הַיָּמִים
  choice: le sacrifice annuel
  rationale: L’expression renvoie au sacrifice accompli selon le cycle des jours, ici à l’occasion de la visite annuelle.
theological_decisions: []
