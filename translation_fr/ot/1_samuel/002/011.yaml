id: 1SA.2.11
reference: 1 Samuel 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: fr
  text: Puis Elqana alla à Rama, chez lui. Quant au garçon, il servait Yahvé en présence d’Éli, le prêtre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « devant la face d’Éli, le prêtre » ; on peut aussi comprendre « sous le regard d’Éli, le prêtre ».
    reason: La tournure hébraïque peut exprimer la présence immédiate d’Éli et suggérer sa surveillance, sans définir explicitement la relation.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Le verbe הלך indique simplement le déplacement et fait progresser le récit. Le contexte permettrait « retourna », mais cette idée n’est pas explicitement exprimée par le verbe.
- source_word: הָרָמָתָה
  choice: à Rama
  rationale: Le ה directionnel attaché au nom de lieu marque le mouvement vers Rama ; « à Rama » est l’expression française naturelle.
- source_word: עַל בֵּיתוֹ
  choice: chez lui
  rationale: Dans cet emploi idiomatique, la locution désigne la maison ou le foyer comme destination. « Chez lui » restitue naturellement ce sens sans donner à עַל son sens spatial littéral de « sur ».
- source_word: וְהַנַּעַר
  choice: Quant au garçon
  rationale: נַעַר peut désigner un enfant, un garçon ou un jeune homme. Ici, Samuel est encore présenté comme jeune ; « le garçon » convient à cette étape du récit. « Quant à » marque naturellement le changement de sujet sans surcharger la coordination.
- source_word: הָיָה מְשָׁרֵת
  choice: il servait
  rationale: La construction היה suivie du participe exprime une activité continue. L’imparfait français rend cette durée, et « servir » convient au service accompli auprès de Yahvé dans le sanctuaire.
- source_word: אֶת יְהוָה
  choice: Yahvé
  rationale: Avec מְשָׁרֵת, la particule אֶת introduit celui qui est servi. La forme française traditionnelle et intelligible « Yahvé » représente directement le nom divin יְהוָה.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: en présence d’Éli, le prêtre
  rationale: L’expression renvoie littéralement à la face ou à la présence d’Éli. Cette formulation française conserve le sens spatial et relationnel sans transformer explicitement celui-ci en rapport hiérarchique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » transmet le nom propre dans une forme française courante, plutôt que de le remplacer par un titre.
- issue: Nature du rapport entre Samuel et Éli
  choice: en présence d’Éli
  alternative: sous l’autorité d’Éli
  rationale: Le texte situe le service de Samuel par rapport à Éli, mais ne précise pas directement ici s’il s’agit seulement de présence, de surveillance ou d’autorité. La traduction retenue préserve cette ouverture.
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait exprime la continuité du service de Samuel. La ponctuation sépare clairement le retour d’Elqana de la situation durable du garçon.
