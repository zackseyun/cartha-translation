  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: fr
  text: Les fils d’Éli étaient des vauriens[a] ; ils ne connaissaient pas Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils de ce qui est sans valeur » ; traduction traditionnelle : « des fils de Bélial ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils ne reconnaissaient pas Yahvé » ; ou encore : « ils n’avaient aucun respect pour Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: Les fils d’Éli
  rationale: Le waw assure la liaison avec le contexte sans exiger ici un marqueur discursif explicite en français. בְנֵי עֵלִי signifie « les fils d’Éli ».
- source_word: בְּנֵי בְלִיָּעַל
  choice: des vauriens
  rationale: L’expression idiomatique, littéralement « fils de ce qui est sans valeur », caractérise ces hommes comme moralement corrompus. « Vauriens » en restitue la force dans un français actuel sans faire de Bélial un nom propre.
- source_word: לֹא יָדְעוּ
  choice: ils ne connaissaient pas
  rationale: Le sens premier de יָדַע est « connaître ». La formulation conserve la portée relationnelle et morale possible du verbe sans la réduire à une seule interprétation.
- source_word: אֶת יְהוָה
  choice: Yahvé
  rationale: Le tétragramme יהוה est rendu comme un nom propre, selon sa valeur dans le texte hébreu ; la particule אֶת, qui marque le complément d’objet direct, ne se traduit pas.
theological_decisions:
- issue: Faut-il comprendre בְּלִיָּעַל comme un nom commun ou comme le nom propre « Bélial » ?
  choice: 'Une expression idiomatique désignant des hommes moralement indignes : « des vauriens »'
  alternative: « des fils de Bélial » ou, littéralement, « des fils de ce qui est sans valeur »
  rationale: Dans ce contexte, rien n’impose de voir en Bélial un être personnel. Le sens commun de l’expression évite d’introduire dans le passage une personnification théologique plus tardive.
- issue: Faut-il expliciter le sens relationnel de « ne pas connaître Yahvé » ?
  choice: Conserver « ils ne connaissaient pas Yahvé »
  alternative: « ils ne reconnaissaient pas Yahvé » ou « ils n’avaient aucun respect pour Yahvé »
  rationale: Le verbe hébreu peut évoquer plus qu’une connaissance intellectuelle, notamment la reconnaissance relationnelle et l’attachement. La traduction littérale préserve cette richesse et cette tension.
translation_notes:
  register: Français moderne, direct et digne. « Vauriens » exprime clairement la corruption morale sans lourdeur archaïque. Le point-virgule maintient le lien étroit entre la caractérisation des fils d’Éli et leur absence de connaissance de Yahvé.
