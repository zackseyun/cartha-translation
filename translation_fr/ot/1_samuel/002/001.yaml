  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: fr
  text: 'Anne pria et dit : « Mon cœur exulte en Yahweh ; ma corne[a] est élevée en Yahweh. Ma bouche[b] est grande ouverte contre mes ennemis, car je me réjouis de ton salut[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la poésie hébraïque, la corne représente la force, l’honneur ou une position élevée.
    reason: cultural_note
  - marker: b
    text: 'Ou « je parle avec assurance contre mes ennemis » ou « ma bouche triomphe de mes ennemis ». L’hébreu dit littéralement : « ma bouche est ouverte largement contre mes ennemis ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « de ta délivrance ». Le terme hébreu peut désigner le salut au sens large ou une délivrance concrète de la détresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: pria
  rationale: Le hitpael de פלל signifie couramment « prier ». Bien que la suite soit poétique, le verbe narratif présente explicitement les paroles d’Anne comme une prière.
- source_word: וַתֹּאמַר
  choice: dit
  rationale: Le texte emploie le verbe ordinaire « dire », non un verbe signifiant « chanter » ; « dit » conserve donc la formulation hébraïque.
- source_word: עָלַץ לִבִּי
  choice: Mon cœur exulte
  rationale: עלץ exprime une joie vive et triomphante. « Exulte » préserve la force poétique tout en gardant « mon cœur » comme sujet explicite.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב indique ici la sphère ou le fondement de la joie et de l’élévation. « En Yahweh » conserve cette relation sans la réduire à une simple cause.
- source_word: רָמָה קַרְנִי
  choice: ma corne s’élève
  rationale: La corne est une métaphore hébraïque de la force, de l’honneur ou d’une position élevée. L’image est conservée dans le texte et expliquée en note.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: Ma bouche s’ouvre toute grande contre mes ennemis
  rationale: La traduction conserve l’image corporelle de l’hébreu, qui évoque une parole hardie et triomphante dirigée contre les ennemis.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de l’assurance et de l’exultation d’Anne ; « car » convient au registre poétique et exprime clairement le lien causal.
- source_word: שָׂמַחְתִּי
  choice: je me réjouis
  rationale: Dans ce discours poétique, l’accompli peut exprimer un état présent résultant de l’action divine. Le présent français rend naturellement cette joie actuelle.
- source_word: בִּישׁוּעָתֶךָ
  choice: de ton salut
  rationale: יְשׁוּעָה peut désigner aussi bien le salut au sens large qu’une délivrance concrète. « Salut » conserve cette amplitude sémantique, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme יהוה. La translittération « Yahweh » préserve le nom divin personnel plutôt que de lui substituer un titre.
- issue: Portée de יְשׁוּעָה
  choice: salut
  alternative: délivrance
  rationale: « Salut » maintient la portée théologique large du terme tout en restant compatible avec la délivrance concrète vécue par Anne ; la note conserve explicitement l’autre nuance.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe reste claire pour un lectorat général, tandis que les images hébraïques du cœur, de la corne et de la bouche sont conservées. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
