  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: fr
  text: 'L’homme lui disait : « Qu’on fasse d’abord brûler la graisse aujourd’hui[a], puis prends pour toi tout ce que tu désires. » Mais le serviteur lui répondait : « Non, donne-la-moi tout de suite, sinon je la prendrai de force. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Qu’ils fassent assurément brûler la graisse aujourd’hui. » L’hébreu emploie une construction verbale emphatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: L’homme
  rationale: Le nom défini masculin singulier désigne ici l’homme qui apporte le sacrifice ; cette traduction conserve naturellement sa forme et sa fonction dans le récit.
- source_word: קַטֵּר יַקְטִירוּן
  choice: Qu’ils commencent par faire brûler
  rationale: 'L’infinitif absolu suivi de l’imparfait renforce le verbe. Dans le contexte, la demande porte aussi sur l’ordre des actes : la graisse doit être brûlée avant que la viande soit prise.'
- source_word: כַּיּוֹם
  choice: aujourd’hui
  rationale: Rendu temporel direct et naturel de l’expression hébraïque dans ce contexte.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Il s’agit des parties grasses du sacrifice destinées à être brûlées ; « la graisse » est précis sans ajouter d’explication rituelle au texte.
- source_word: וְקַח לְךָ
  choice: ensuite, prends pour toi
  rationale: L’impératif s’adresse au serviteur. « Ensuite » explicite l’enchaînement demandé, déjà impliqué par le contexte immédiat.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: tout ce que tu désires
  rationale: Le français courant exprime naturellement l’idiome hébreu, littéralement « selon ce que désire ton âme », sans suggérer ici une doctrine particulière de l’âme.
- source_word: וְאָמַר לוֹ
  choice: Mais le serviteur lui répondait
  rationale: Le contexte identifie celui qui parle comme le serviteur du prêtre. L’imparfait français rend le caractère habituel de la scène, et « mais » marque l’opposition.
- source_word: כִּי עַתָּה תִתֵּן
  choice: Non, donne-la-moi tout de suite
  rationale: כִּי a ici une valeur insistante ou adversative. « Non » rend la contradiction abrupte, tandis que l’impératif français communique l’exigence pressante. Le complément « me » est implicite dans la demande du serviteur.
- source_word: וְאִם לֹא
  choice: sinon
  rationale: Équivalent français idiomatique de la condition négative qui introduit la menace.
- source_word: לָקַחְתִּי
  choice: je la prendrai
  rationale: Bien que la forme soit un accompli hébreu, elle a dans cette menace une valeur future assurée.
- source_word: בְחָזְקָה
  choice: de force
  rationale: L’expression désigne une prise exercée par la contrainte ou la puissance ; « de force » est concis et exact.
theological_decisions:
- issue: Ordre de la procédure sacrificielle sous-entendu dans la protestation de l’homme
  choice: Présenter la combustion de la graisse comme préalable à la prise de viande, sans ajouter d’explication cultuelle dans le corps du verset.
  alternative: Traduire plus littéralement la construction emphatique sans rendre explicite l’antériorité contextuelle.
  rationale: Le contraste narratif porte sur la violation de l’ordre sacrificiel. « Commencent par » et « ensuite » rendent cet ordre intelligible tout en évitant d’introduire une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait rend la scène habituelle décrite dans le contexte. « Tout ce que tu désires » préfère l’idiome français courant au calque « ce que ton âme désire », tandis que la note conserve la force emphatique de l’hébreu.
