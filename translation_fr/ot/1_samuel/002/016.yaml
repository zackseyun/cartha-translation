    rationale: Le texte hébreu demande que la graisse soit effectivement brûlée; la priorité rituelle ressort de l’enchaînement. « D’abord » rend cette priorité sans ajouter l’idée lexicale de commencement.
  - severity: low
    issue: Le pronom sujet « ils » est peu déterminé dans le verset français isolé.
    rationale: L’hébreu a une forme plurielle qui peut se rendre naturellement par un impersonnel en français. « Qu’on fasse » conserve l’absence d’identification explicite des exécutants.
