  source_fidelity: La structure dialoguée et la menace sont fidèlement rendues. Toutefois, « commencent par faire brûler » prête à l’hébreu l’idée précise de commencer, alors que l’infinitif absolu suivi de l’imparfait exprime d’abord l’insistance; l’antériorité est mieux portée en français par « d’abord », dans la séquence avec « puis ».
  naturalness: Le français est naturel et le registre convient au récit. La tournure impersonnelle « Qu’on fasse d’abord brûler » est plus idiomatique ici et évite un « ils » sans antécédent explicite dans le verset isolé.
  terminology: « graisse », « de force » et « tout ce que tu désires » sont justes et d’un registre moderne. « Le serviteur » est contextuellement légitime, puisque l’interlocuteur est le serviteur sacerdotal dans la scène précédente.
