  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: fr
  text: Ne continuez pas à parler avec tant de hauteur ; que l’insolence ne sorte pas de votre bouche. Car Yahweh est un Dieu qui sait, et vos actes sont pesés par lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant plus strictement le texte consonantique : « et les actes ne sont pas pesés ». Le texte principal suit la lecture traditionnelle selon laquelle Yahweh évalue les actes humains.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: Ne multipliez pas les paroles
  rationale: La construction avec רבה et un verbe conjugué exprime l’intensification ou la répétition. Cette formulation conserve l’image hébraïque tout en restant claire en français.
- source_word: גְּבֹהָה גְבֹהָה
  choice: si hautaines
  rationale: Le redoublement souligne fortement l’élévation orgueilleuse du discours. « si hautaines » en restitue naturellement la portée morale.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: que l’insolence ne sorte pas de votre bouche
  rationale: עָתָק désigne ici une parole arrogante, présomptueuse ou insolente. La tournure française prolonge naturellement l’interdiction de la première proposition.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: Yahweh est un Dieu qui sait
  rationale: Le pluriel דֵּעוֹת peut évoquer l’étendue ou la plénitude de la connaissance. « un Dieu qui sait » est idiomatique sans ajouter explicitement « tout », absent du texte.
- source_word: וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: et c’est par lui que les actions sont pesées
  rationale: La lecture traditionnelle comprend que les actes sont évalués par Dieu. « pesées » conserve la métaphore de la mesure, tandis que la variante du texte consonantique est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » représente le nom propre divin sans le remplacer par un titre.
- issue: Interprétation de וְלֹא נִתְכְּנוּ עֲלִילוֹת
  choice: et c’est par lui que les actions sont pesées
  alternative: et les actions ne sont pas pesées
  rationale: La lecture traditionnelle et le contexte présentent Dieu comme celui qui évalue les actes. La lecture plus stricte des consonnes avec לֹא demeure réellement possible et est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde les images de la hauteur orgueilleuse, de la bouche et de la pesée, tout en évitant une syntaxe artificiellement calquée sur l’hébreu.
