source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: fr
  text: 'Alors, tous ceux qui resteront de ta famille viendront se prosterner devant lui pour une petite pièce d’argent[a] et une miche de pain. Chacun dira : “Je t’en prie, rattache-moi à l’une des fonctions sacerdotales[b], afin que je puisse manger un morceau de pain.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour une petite quantité d’argent » ; le terme hébreu désigne une petite unité d’argent.
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’un des services sacerdotaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר בְּבֵיתְךָ
  choice: ceux qui resteront de ta famille
  rationale: Le participe désigne les survivants ou ceux qui subsisteront après le jugement. « Ta famille » exprime ici le sens familial et dynastique de בַּיִת, plutôt qu’un bâtiment.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: se prosterner devant lui
  rationale: Le verbe décrit un geste physique de soumission ou de supplication; cette formulation conserve les deux dimensions.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: pour une petite pièce d’argent
  rationale: אֲגוֹרָה désigne une petite unité ou quantité d’argent. La formulation reste compréhensible sans imposer une valeur monétaire précise.
- source_word: כִכַּר לָחֶם
  choice: une miche de pain
  rationale: כִּכָּר désigne ici une unité de pain, vraisemblablement de forme ronde; « miche » est naturel en français moderne.
- source_word: סְפָחֵנִי נָא
  choice: Je t’en prie, rattache-moi
  rationale: ספח exprime l’idée d’adjoindre ou de rattacher quelqu’un, tandis que נָא marque une supplication polie.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: l’une des fonctions sacerdotales
  rationale: Le pluriel peut viser des charges ou services sacerdotaux plutôt que plusieurs sacerdoces distincts; une note conserve l’autre nuance possible.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: afin que je puisse manger un morceau de pain
  rationale: פַּת est un morceau ou une portion de pain. La traduction garde le caractère humble et pressant de la demande.
theological_decisions:
- issue: Référent du pronom לוֹ (« devant lui »)
  choice: Maintien du pronom masculin singulier sans identification supplémentaire
  alternative: Expliciter qu’il s’agit du prêtre alors en autorité
  rationale: Le texte souligne le renversement de la maison d’Éli, désormais dépendante d’un autre, mais n’identifie pas explicitement ici le référent. La traduction préserve cette indétermination.
- issue: Sens du pluriel הַכְּהֻנּוֹת
  choice: fonctions sacerdotales
  alternative: services sacerdotaux
  rationale: Le contexte évoque une place dans le service permettant de recevoir de quoi manger. « Fonctions » rend cette idée sans postuler plusieurs sacerdoces théologiquement distincts.
translation_notes:
  register: Français international moderne, digne et accessible. « Se prosterner » conserve la force concrète du geste; « rattache-moi » garde l’image d’adjonction du verbe hébreu. La syntaxe en deux phrases évite une période trop lourde tout en maintenant la progression de l’oracle.
