  text: וְ/הִכָּ֨ה בַ/כִּיּ֜וֹר א֣וֹ בַ/דּ֗וּד א֤וֹ בַ/קַּלַּ֨חַת֙ א֣וֹ בַ/פָּר֔וּר כֹּ֚ל אֲשֶׁ֣ר יַעֲלֶ֣ה הַ/מַּזְלֵ֔ג יִקַּ֥ח הַ/כֹּהֵ֖ן בּ֑/וֹ כָּ֚כָה יַעֲשׂ֣וּ לְ/כָל יִשְׂרָאֵ֔ל הַ/בָּאִ֥ים שָׁ֖ם בְּ/שִׁלֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: fr
  text: Il l’enfonçait dans la bassine, la marmite, le chaudron ou le faitout[a]. Tout ce que la fourchette[b] faisait remonter, le prêtre le prenait avec la fourchette. Ils agissaient ainsi envers tous les Israélites qui venaient à Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La distinction exacte entre les quatre termes hébreux désignant ces récipients de cuisson est incertaine.
    reason: cultural_note
  - marker: b
    text: Ou « fourche à viande » ; le terme hébreu désigne l’instrument utilisé pour retirer la viande du récipient sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: Il l’enfonçait
  rationale: Le hiphil de נכה décrit ici le geste répété consistant à plonger vigoureusement l’instrument dans un récipient. L’imparfait français exprime cette pratique habituelle, et le pronom reprend la fourchette mentionnée au verset précédent.
- source_word: בַכִּיּוֹר א֣וֹ בַדּוּד א֤וֹ בַקַּלַּחַת֙ א֣וֹ בַפָּרוּר
  choice: dans la bassine, la marmite, le chaudron ou le faitout
  rationale: Cette série conserve quatre récipients distincts dans un français courant, sans prétendre déterminer avec certitude leur forme exacte.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: Tout ce que la fourchette faisait remonter
  rationale: La formulation rend le mouvement ascendant exprimé par עלה et désigne ce que l’instrument retirait du récipient.
- source_word: הַמַּזְלֵג
  choice: la fourchette
  rationale: « Fourchette » est intelligible en français moderne et correspond à l’instrument à trois dents décrit au verset précédent; une note signale l’autre désignation possible.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: le prêtre le prenait avec elle
  rationale: 'Le pronom בּוֹ est compris instrumentalement: le prêtre prenait la viande au moyen de la fourchette. La répétition à l’imparfait restitue l’usage habituel.'
- source_word: כָּכָה יַעֲשׂוּ
  choice: Ils agissaient ainsi
  rationale: Le pluriel hébreu est conservé plutôt que ramené au singulier; il résume la conduite collective décrite dans le contexte.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: envers tous les Israélites qui venaient là, à Silo
  rationale: Le collectif « tout Israël » est rendu naturellement par « tous les Israélites », tandis que « là, à Silo » conserve les deux indications locatives.
theological_decisions:
- issue: Passage du singulier au pluriel dans le récit
  choice: Conserver « le prêtre » au singulier, puis « ils agissaient » au pluriel
  alternative: 'Uniformiser au singulier: « le prêtre agissait ainsi »'
  rationale: Le texte hébreu passe lui-même du singulier יִקַּח au pluriel יַעֲשׂוּ. Maintenir ce changement préserve la texture narrative et laisse le pluriel englober les personnes impliquées sans en préciser davantage le référent.
- issue: Valeur de בּוֹ
  choice: 'Sens instrumental: « avec elle »'
  alternative: 'Sens réfléchi ou bénéficiaire: « pour lui-même »'
  rationale: Dans ce contexte, le suffixe renvoie le plus naturellement à la fourchette comme instrument. La traduction n’ajoute donc pas explicitement l’idée de profit personnel, même si l’abus ressort du contexte.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait exprime une pratique répétée. Les noms de récipients restent concrets et usuels, tandis que les notes signalent les incertitudes lexicales sans alourdir le verset.
