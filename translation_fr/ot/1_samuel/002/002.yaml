  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: fr
  text: Nul n’est saint comme Yahweh[a], car il n’y en a pas d’autre que toi, et il n’y a pas de rocher comme notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yahweh », nom personnel du Dieu d’Israël.'
    reason: divine_name
lexical_decisions:
- source_word: אֵין
  choice: nul n’est / il n’y en a aucun / il n’est pas de
  rationale: La négation existentielle est rendue de manière idiomatique selon chaque proposition, tout en maintenant sa triple répétition et le parallélisme hébreu.
- source_word: קָדוֹשׁ
  choice: saint
  rationale: « Saint » conserve le sens établi de sainteté, de singularité et de séparation propre à Dieu.
- source_word: כַּיהוָה
  choice: comme Yahweh
  rationale: Le préfixe כ marque la comparaison, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: כִּי
  choice: car
  rationale: Ici, כִּי introduit le fondement de l’affirmation précédente et convient au registre poétique.
- source_word: בִּלְתֶּךָ
  choice: en dehors de toi
  rationale: Cette formulation exprime l’exclusion tout en conservant l’adresse directe à Dieu à la deuxième personne.
- source_word: צוּר
  choice: rocher
  rationale: « Rocher » préserve la métaphore concrète de force, de stabilité et de protection sans la réduire à une seule interprétation.
- source_word: כֵּאלֹהֵינוּ
  choice: comme notre Dieu
  rationale: Dans ce contexte, אֱלֹהִים avec le suffixe de première personne du pluriel désigne au singulier le Dieu d’Israël; כ marque la comparaison.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le Tétragramme; « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de בִּלְתֶּךָ
  choice: il n’y en a aucun en dehors de toi
  alternative: il n’y a rien en dehors de toi
  rationale: Le masculin singulier implicite dans le parallèle renvoie naturellement à « nul » et évite de transformer l’énoncé en affirmation métaphysique plus large que ne l’exige le texte.
translation_notes:
  register: Français international moderne, poétique et digne. La triple structure négative ainsi que la métaphore du rocher sont conservées. « Nul n’est saint » donne une cadence élevée mais reste immédiatement compréhensible.
