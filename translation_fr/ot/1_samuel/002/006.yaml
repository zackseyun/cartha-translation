id: 1SA.2.6
reference: 1 Samuel 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: fr
  text: Yahweh fait mourir et fait vivre ; il fait descendre au shéol[a] et en fait remonter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tombe » ou « le séjour des morts ». Le terme hébreu « shéol » désigne le domaine des morts et ne doit pas être automatiquement compris comme « l’enfer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve ici le nom personnel révélé à Israël au lieu de lui substituer un titre.
- source_word: מֵמִית
  choice: fait mourir
  rationale: Le hifil de מות a une valeur causative. « Fait mourir » en rend directement la force tout en restant naturel et digne en français.
- source_word: וּמְחַיֶּה
  choice: et fait vivre
  rationale: Cette formulation conserve la valeur causative de חיה et le parallélisme étroit avec « fait mourir », sans préciser indûment s’il s’agit de donner, de préserver ou de rendre la vie.
- source_word: מוֹרִיד
  choice: il fait descendre
  rationale: Le hifil de ירד exprime une action causative. « Fait descendre » préserve explicitement l’action souveraine de Yahweh et prépare l’opposition avec « fait remonter ».
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération évite d’assimiler automatiquement le terme hébreu à l’enfer ou à la seule tombe. L’article rend l’expression naturelle en français, et une note en explique la portée.
- source_word: וַיָּעַל
  choice: et en fait remonter
  rationale: La forme causative de עלה répond à « fait descendre ». Le pronom « en » explicite naturellement en français le point de départ, le shéol, sans ajouter la notion plus précise de résurrection corporelle.
theological_decisions:
- issue: Faut-il employer un vocabulaire qui affirme explicitement la résurrection corporelle ?
  choice: Conserver les expressions larges « fait vivre » et « fait remonter ».
  alternative: Traduire plus explicitement par « ressuscite » ou « fait revenir d’entre les morts ».
  rationale: Le verset affirme la souveraineté de Yahweh sur la mort et le shéol, mais les termes hébreux restent poétiques et plus larges qu’une affirmation explicite de la résurrection corporelle. La traduction préserve cette ampleur et cette tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé par la répétition de « fait » et par l’opposition « descendre / remonter ». Le point-virgule marque les deux membres parallèles du vers.
