id: 1SA.2.25
reference: 1 Samuel 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: fr
  text: Si un homme pèche contre un autre homme, Dieu arbitrera son cas[a] ; mais si un homme pèche contre Yahvé, qui intercédera pour lui[b] ? Pourtant, ils refusèrent d’écouter leur père, car Yahvé voulait les faire mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « les juges le jugeront ». Le mot hébreu אֱלֹהִים désigne normalement Dieu, mais peut aussi, dans certains contextes, se rapporter à des juges humains.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « qui priera pour lui ? » Le verbe hébreu peut exprimer la prière ou l’intercession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: pèche
  rationale: Le verbe חטא exprime ici une faute morale et religieuse ; « pécher » en conserve toute la force.
- source_word: אִישׁ לְאִישׁ
  choice: un homme… un autre homme
  rationale: Cette formulation respecte le masculin singulier de l’hébreu et exprime clairement une faute commise dans une relation humaine.
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: Dieu arbitrera son cas
  rationale: Le piel de פלל possède ici une valeur judiciaire. « Arbitrera son cas » rend cette intervention sans réduire le sens à une simple condamnation et conserve le lien sémantique avec יתפלל dans la proposition suivante.
- source_word: לַיהוָה
  choice: contre Yahvé
  rationale: La préposition désigne la personne offensée ; le nom divin יהוה est rendu par « Yahvé » plutôt que remplacé par un titre.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: qui intercédera pour lui ?
  rationale: Le hitpael de פלל peut signifier prier ou intercéder. Dans cette question rhétorique, « intercéder » exprime naturellement l’intervention en faveur du coupable et fait écho au rôle d’arbitre évoqué plus haut.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: Pourtant, ils refusèrent d’écouter leur père
  rationale: La tournure française traduit naturellement leur résistance volontaire et durable, sans conserver inutilement l’idiome « écouter la voix de ».
- source_word: כִּי חָפֵץ יְהוָה
  choice: car Yahvé voulait
  rationale: חפץ exprime ici la volonté ou le désir. « Voulait » préserve l’affirmation forte du texte sans l’atténuer en simple permission ni suggérer nécessairement le plaisir.
- source_word: לַהֲמִיתָם
  choice: les faire mourir
  rationale: Cette expression rend directement la valeur causative du hiphil de מות.
theological_decisions:
- issue: Référent de אֱלֹהִים dans la première proposition
  choice: Dieu
  alternative: les juges
  rationale: Le contraste avec le péché commis contre Yahvé favorise une référence divine. L’autre lecture, historiquement attestée et lexicalement possible, est conservée en note.
- issue: Rapport entre וּפִלְלוֹ et יִתְפַּלֶּל
  choice: arbitrera son cas… intercédera pour lui
  alternative: le jugera… priera pour lui
  rationale: Les deux formes appartiennent à la même racine, mais leurs constructions verbales et leur contexte orientent respectivement vers l’arbitrage judiciaire et l’intercession. La traduction conserve cette proximité sans leur imposer exactement le même sens.
- issue: Volonté divine dans כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: car Yahvé voulait les faire mourir
  alternative: car Yahvé avait décidé de les faire mourir
  rationale: La formulation retenue traduit directement חפץ et maintient sans l’expliquer la tension entre le refus humain d’écouter et la volonté divine de juger.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que « arbitrera », « intercédera » et « Yahvé » conservent la portée judiciaire et théologique du verset. Les marqueurs [a] et [b] sont placés immédiatement après les expressions auxquelles leurs notes se rapportent.
