source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל מְשָׁרֵ֖ת אֶת פְּנֵ֣י יְהוָ֑ה נַ֕עַר חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: fr
  text: Samuel servait en présence de Yahweh[a]. C’était un jeune garçon vêtu d’un éphod de lin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « devant la face de Yahweh », c’est-à-dire « en présence de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: Samuel
  rationale: Le waw relie la phrase au contexte, mais il n’est pas nécessaire de le rendre par « et » en français moderne lorsque l’enchaînement narratif suffit.
- source_word: מְשָׁרֵת
  choice: servait
  rationale: Le participe exprime ici une activité continue. « Servait » est naturel en français et convient au contexte cultuel sans surinterpréter la fonction précise de Samuel.
- source_word: אֶת פְּנֵי יְהוָה
  choice: en présence de Yahweh
  rationale: L’expression hébraïque évoque littéralement la face ou la présence de Yahweh. « En présence de » rend clairement l’idiome tout en conservant sa portée cultuelle.
- source_word: נַעַר
  choice: un jeune garçon
  rationale: Dans ce contexte, נַעַר souligne le jeune âge de Samuel. « Jeune garçon » est clair et naturel, sans lui attribuer un statut de serviteur qui n’est pas porté par ce nom.
- source_word: חָגוּר
  choice: vêtu de
  rationale: Le participe passif signifie littéralement « ceint de ». Pour un vêtement, « vêtu de » offre une formulation française actuelle et digne.
- source_word: אֵפוֹד
  choice: éphod
  rationale: Il s’agit d’un vêtement cultuel israélite sans équivalent français exact. La translittération préserve le référent sans préciser indûment sa forme.
- source_word: בָּד
  choice: de lin
  rationale: Dans ce contexte vestimentaire et cultuel, בָּד désigne le lin. Le texte ne justifie pas l’ajout de « fin ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin YHWH. « Yahweh » le rend comme nom propre et évite de le remplacer par un titre.
- issue: Nature du service de Samuel
  choice: servait
  alternative: exerçait son ministère
  rationale: « Servait » conserve l’idée générale d’un service cultuel sans importer une conception ultérieure ou institutionnelle du ministère.
translation_notes:
  register: Français international moderne, simple et digne. La seconde proposition est transformée en phrase complète afin d’éviter une apposition lourde, tout en conservant le contraste narratif centré sur le jeune Samuel et son vêtement cultuel.
