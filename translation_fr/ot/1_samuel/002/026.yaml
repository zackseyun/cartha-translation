  text: וְ/הַ/נַּ֣עַר שְׁמוּאֵ֔ל הֹלֵ֥ךְ וְ/גָדֵ֖ל וָ/ט֑וֹב גַּ֚ם עִם יְהוָ֔ה וְ/גַ֖ם עִם אֲנָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: fr
  text: Le jeune Samuel continuait de grandir et était agréable à Yahweh comme aux hommes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le jeune Samuel allait et grandissait, et il était bon, aussi avec Yahweh et aussi avec les hommes ». L’expression « était bon avec » peut désigner le fait d’être agréable ou approuvé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Le jeune
  rationale: נַעַר désigne un garçon ou un jeune homme. Dans ce contexte, Samuel est encore jeune ; « le jeune Samuel » est plus naturel en français que « le garçon Samuel », tout en conservant l’indication d’âge.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Le nom propre est rendu selon sa forme française usuelle.
- source_word: הֹלֵךְ וְגָדֵל
  choice: continuait de grandir
  rationale: La construction avec הֹלֵךְ exprime une progression continue. « Continuait de grandir » en restitue clairement la valeur durative.
- source_word: וָטוֹב
  choice: et jouissait de la faveur
  rationale: Dans la construction טוֹב עִם, l’adjectif exprime une appréciation favorable ou l’approbation dans une relation. Cette formulation française convient à la fois à la relation avec Dieu et à celle avec les êtres humains, sans réduire le sens à la seule popularité.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: tant de Yahweh que des hommes
  rationale: La corrélation répétée גַּם… וְגַם est rendue par « tant… que… ». אֲנָשִׁים est ici le pluriel ordinaire « hommes » et forme un contraste équilibré entre l’approbation divine et humaine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre substitutif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie explicitement le nom divin ; « Yahweh » le conserve comme nom propre.
- issue: Nature de la « faveur » de Samuel
  choice: jouissait de la faveur tant de Yahweh que des hommes
  alternative: était bon avec Yahweh et avec les hommes
  rationale: Le rendu choisi exprime l’approbation relationnelle suggérée par טוֹב עִם, sans préciser indûment si cette faveur désigne réputation, conduite agréable ou bienveillance reçue. La note conserve la forme plus littérale et son ambiguïté.
translation_notes:
  register: Français moderne, international et digne. « Le jeune Samuel » évite la tournure peu naturelle « le garçon Samuel ». « Jouissait de la faveur » rend l’idiome relationnel de façon fluide, tandis que la note signale la formulation hébraïque elliptique et maintient son ambiguïté.
