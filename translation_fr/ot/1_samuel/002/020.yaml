  to: 'Éli bénissait Elqana et sa femme en disant : « Que Yahweh t’accorde une descendance par cette femme, en remplacement de la demande qui a été faite à Yahweh[a]. » Puis ils s’en retournaient chez lui.'
  rationale: La révision corrige le contresens de « pour Yahweh » en « à Yahweh », rétablit explicitement le substantif « demande » et conserve l’ambiguïté du sujet grammatical par un passif français. La note documente à la fois le jeu de mots sur « demander » et l’anomalie du masculin singulier, sans imposer une solution interprétative dans le texte.
