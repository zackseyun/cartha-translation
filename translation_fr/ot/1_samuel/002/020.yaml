base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: fr
  text: 'Éli bénissait Elqana et sa femme en disant : « Que Yahweh t’accorde une descendance par cette femme, en remplacement de la demande qui a été faite à Yahweh[a]. » Puis ils s’en retournaient chez lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « en remplacement de la demande — ou du prêt — qu’il a demandé à Yahweh ». Le vocabulaire reprend le verbe « demander », fréquent dans le récit de la naissance de Samuel, et peut évoquer Samuel, demandé à Yahweh puis remis à Yahweh. Le verbe rendu ici par « a été faite » est au masculin singulier en hébreu, bien que le contexte désigne Anne comme celle qui avait demandé l’enfant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: bénissait
  rationale: L’imparfait français exprime naturellement l’action habituelle lors des visites annuelles indiquées par le contexte.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: Elqana et sa femme
  rationale: La formulation suit l’hébreu, qui dit explicitement « sa femme » sans reprendre le nom d’Anne.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: Que Yahweh t’accorde
  rationale: Dans cette bénédiction, « accorder » rend idiomatiquement le sens de שׂים, littéralement « placer, établir ».
- source_word: זֶרַע
  choice: une descendance
  rationale: Le nom collectif peut désigner une progéniture; « descendance » conserve cette valeur collective sans employer le littéral « semence ».
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: par cette femme
  rationale: Cette expression indique que la descendance viendra d’elle tout en restant naturelle en français.
- source_word: תַּחַת הַשְּׁאֵלָה
  choice: en remplacement de ce qui a été demandé
  rationale: « En remplacement de » conserve la valeur substitutive de תַּחַת; la tournure garde aussi l’écho du radical שׁאל sans identifier trop explicitement הַשְּׁאֵלָה au seul enfant.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: qui a été demandé pour Yahweh
  rationale: La formulation impersonnelle préserve la discordance entre le masculin singulier du verbe hébreu et le contexte où Anne est celle qui a demandé l’enfant; « pour Yahweh » convient à l’enfant consacré et remis à Yahweh.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: Puis ils retournaient chez lui
  rationale: Le pluriel renvoie au couple, tandis que le suffixe singulier signifie littéralement « son lieu »; « chez lui » en garde la forme, et l’imparfait marque l’habitude.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom divin présent dans le texte source plutôt que de lui substituer un titre.
- issue: Sujet et sens de אֲשֶׁר שָׁאַל לַיהוָה
  choice: 'formulation impersonnelle : « qui a été demandé pour Yahweh »'
  alternative: « qu’elle avait demandé à Yahweh » ou « qu’il avait demandé à Yahweh »
  rationale: Le verbe est morphologiquement masculin singulier, alors que le contexte désigne Anne comme celle qui avait demandé l’enfant. L’impersonnel conserve cette tension textuelle sans imposer silencieusement un sujet; « pour Yahweh » reflète la consécration de Samuel.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait rend le caractère habituel de la bénédiction et du retour. La tournure centrale reste volontairement proche et légèrement ouverte afin de préserver le jeu lexical et l’irrégularité grammaticale de l’hébreu.
