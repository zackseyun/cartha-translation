  naturalness: Le français est globalement clair et soutenu. « Du haut du ciel, il tonnera contre eux » est toutefois plus direct et idiomatique que « il fera retentir son tonnerre contre eux », tout en restant proche de l’image hébraïque.
  terminology: « Yahweh », « roi », « corne » et « oint » sont appropriés. « Confins de la terre » est une expression française plus naturelle que « extrémités de la terre » pour אַפְסֵי אָרֶץ. La note a doit dire « s’opposent à lui », non « contestent avec lui », qui inverse ou affaiblit la relation d’hostilité.
