  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: fr
  text: Les adversaires de Yahweh seront brisés[a] ; du haut du ciel, il tonnera contre eux[b]. Yahweh jugera les confins de la terre ; il donnera de la force à son roi et relèvera la corne de celui qu’il a oint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ceux qui s’opposent à lui seront brisés. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans le ciel ». Le contexte présente le ciel comme le lieu d’où retentit le tonnerre.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « son oint ». Le mot hébreu מְשִׁיחוֹ (meshikho) désigne le roi oint par Yahweh et est à l’origine du titre « Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel et son caractère d’alliance, conformément à la forme hébraïque.
- source_word: יֵחַתּוּ
  choice: seront brisés
  rationale: Le niphal de חתת exprime ici la défaite et l’anéantissement des adversaires ; « brisés » garde la vigueur de l’image.
- source_word: מריבו/ו על/ו
  choice: les adversaires de Yahweh
  rationale: La tradition ketiv-qere désigne ceux qui s’opposent à Yahweh. Cette formulation française est naturelle tout en gardant l’autre analyse dans une note.
- source_word: בַּשָּׁמַיִם יַרְעֵם
  choice: du ciel, il fera retentir son tonnerre contre eux
  rationale: Le contexte présente le ciel comme le lieu d’où vient l’action divine. La tournure causative rend la forme verbale et le suffixe dirigé contre les ennemis.
- source_word: יָדִין אַפְסֵי אָרֶץ
  choice: jugera les extrémités de la terre
  rationale: Préserve le langage judiciaire et l’expression hébraïque désignant l’étendue universelle du jugement.
- source_word: וְיִתֶּן עֹז לְמַלְכּוֹ
  choice: il donnera de la force à son roi
  rationale: Rend directement עֹז et conserve le terme royal explicite, malgré la place précoce du texte dans l’histoire de la monarchie.
- source_word: וְיָרֵם קֶרֶן
  choice: relèvera la corne
  rationale: Conserve la métaphore hébraïque de la force, de la dignité et de la victoire, importante dans l’ensemble du cantique d’Anne.
- source_word: מְשִׁיחוֹ
  choice: celui qu’il a oint
  rationale: Rend le sens lexical immédiat dans ce contexte royal sans imposer que « Messie » fonctionne déjà exclusivement comme un nom ou un titre technique ; la portée messianique du mot est signalée en note.
theological_decisions:
- issue: Portée royale et messianique de מְשִׁיחוֹ
  choice: celui qu’il a oint
  alternative: son Messie
  rationale: Le terme désigne littéralement la personne ointe par Yahweh, ici en parallèle avec « son roi ». Cette traduction garde ouverte la référence royale immédiate et la résonance messianique ultérieure, sans les confondre.
- issue: Mention d’un roi avant l’établissement de la monarchie israélite
  choice: son roi
  alternative: son dirigeant
  rationale: Le texte hébreu emploie sans ambiguïté מֶלֶךְ, « roi ». La tension historique et prophétique doit être conservée plutôt qu’atténuée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est conservé, ainsi que les images concrètes du tonnerre et de la corne. « Yahweh » maintient le nom divin ; « celui qu’il a oint » évite à la fois un archaïsme peu transparent et une résolution excessive de la portée messianique.
