  text: קֶ֥שֶׁת גִּבֹּרִ֖ים חַתִּ֑ים וְ/נִכְשָׁלִ֖ים אָ֥זְרוּ חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: fr
  text: Les arcs des vaillants sont brisés[a], mais ceux qui trébuchent se ceignent de force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sont fracassés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sont ceints de force ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: l’arc
  rationale: Le nom est singulier et peut avoir une valeur collective. Le français poétique permet de conserver ce singulier tout en l’associant au pluriel « des vaillants ».
- source_word: גִּבֹּרִים
  choice: les vaillants
  rationale: Le terme désigne des hommes forts ou valeureux, souvent des guerriers. « Les vaillants » conserve sa portée poétique sans la limiter explicitement au domaine militaire.
- source_word: חַתִּים
  choice: est brisé
  rationale: Avec « arc », le participe exprime naturellement la rupture plutôt que l’effroi. « Brisé » est idiomatique et garde la force concrète de l’image.
- source_word: נִכְשָׁלִים
  choice: ceux qui trébuchent
  rationale: Cette formulation conserve le sens concret du participe et l’image du renversement, sans l’aplatir en « les faibles ».
- source_word: אָזְרוּ
  choice: se ceignent
  rationale: La forme hébraïque est active et le geste de se ceindre peut naturellement être exprimé de façon pronominale en français. Cette traduction préserve l’image corporelle sans la remplacer par une abstraction.
- source_word: חָיִל
  choice: force
  rationale: Dans ce contraste, « force » rend largement la vigueur ou la puissance évoquée, sans restreindre le terme à la seule vaillance militaire.
theological_decisions:
- issue: L’imagerie du renversement dans le cantique d’Anne
  choice: Conserver les images concrètes de l’arc, du trébuchement et de l’action de se ceindre.
  alternative: « Les armes des guerriers sont détruites, mais les faibles deviennent forts. »
  rationale: Le texte présente poétiquement le renversement de la force et de la faiblesse. Le maintien des métaphores respecte cette tension littéraire et théologique sans ajouter d’explication doctrinale.
- issue: Valeur grammaticale de אָזְרוּ
  choice: Traduire par l’actif pronominal « se ceignent ».
  alternative: « sont ceints de force »
  rationale: Le verbe hébreu est morphologiquement actif, sans sujet divin exprimé. La formulation retenue évite d’introduire silencieusement un agent extérieur, tout en signalant en note l’autre rendu possible dans le parallélisme.
translation_notes:
  register: Français moderne, digne et poétique. Le singulier collectif « l’arc » suit de près l’hébreu; « les vaillants » reste plus large que « les guerriers ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
