base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: fr
  text: Ne l’ai-je pas choisi parmi toutes les tribus d’Israël pour être mon prêtre, pour monter à mon autel, pour brûler de l’encens et pour porter l’éphod devant moi ? Et j’ai donné à la famille de ton père toutes les offrandes des Israélites consumées par le feu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne l’ensemble des offrandes sacrificielles consumées par le feu, et non uniquement les holocaustes.
    reason: Précision lexicale sur le terme sacrificiel אִשֵּׁי.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: Je l’ai choisi
  rationale: La forme infinitive emphatique poursuit l’énoncé divin du contexte. Le français emploie naturellement un verbe conjugué; il n’est pas nécessaire d’ajouter une négation interrogative absente de cette proposition hébraïque.
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: parmi toutes les tribus d’Israël
  rationale: « Parmi » exprime clairement la sélection d’un élément au sein de l’ensemble des tribus.
- source_word: לִי לְכֹהֵן
  choice: pour qu’il soit prêtre à mon service
  rationale: Cette formulation rend à la fois la fonction sacerdotale et la relation marquée par לִי, sans suggérer qu’il serait l’unique prêtre de Dieu.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: qu’il monte vers mon autel
  rationale: Le choix conserve le mouvement concret exprimé par עלה sans l’interpréter directement comme l’acte d’offrir un sacrifice.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: qu’il fasse brûler l’encens
  rationale: Expression cultuelle claire en français moderne, qui rend l’action de produire la fumée odorante.
- source_word: לָשֵׂאת אֵפוֹד לְפָנָי
  choice: qu’il porte l’éphod devant moi
  rationale: נשא signifie porter; dans ce cadre sacerdotal, il s’agit de porter l’éphod comme vêtement ou insigne cultuel. « Porte » garde cette amplitude.
- source_word: לְבֵית אָבִיךָ
  choice: à la famille de ton père
  rationale: L’expression désigne ici la maison ancestrale, c’est-à-dire la lignée sacerdotale d’Éli; « famille » est naturel et précis en français actuel.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: toutes les offrandes des fils d’Israël consumées par le feu
  rationale: אִשֵּׁי désigne largement les offrandes présentées par le feu, sans se limiter aux holocaustes. La traduction conserve aussi la forme ethnonymique masculine בְּנֵי יִשְׂרָאֵל.
theological_decisions:
- issue: Force syntaxique de וּבָחֹר
  choice: 'affirmation: « Je l’ai choisi »'
  alternative: 'question rhétorique: « Ne l’ai-je pas choisi ? »'
  rationale: La question du verset précédent gouverne une série de compléments, mais la proposition présente ne comporte pas elle-même de particule interrogative. L’affirmation française préserve l’emphase sans introduire explicitement une négation.
- issue: Sens sacrificiel de אִשֵּׁי
  choice: « offrandes … consumées par le feu »
  alternative: « offrandes alimentaires »
  rationale: Le terme couvre les sacrifices offerts par le feu et ne désigne pas seulement des aliments ni seulement des holocaustes. Le rendu choisi maintient la portée rituelle générale.
- issue: Fonction de l’éphod
  choice: « porte l’éphod »
  alternative: « revête l’éphod »
  rationale: Le verbe source signifie littéralement porter ou prendre en charge. Dans le contexte sacerdotal, le port comme vêtement est probable, mais « porte » préserve la légère amplitude du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « qu’il » clarifie la série des fonctions sacerdotales. « Éphod » est conservé comme terme cultuel biblique, tandis que « famille de ton père » rend naturellement l’idée de maison ancestrale.
