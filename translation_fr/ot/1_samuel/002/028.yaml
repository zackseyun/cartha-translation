  to: Ne l’ai-je pas choisi parmi toutes les tribus d’Israël pour être mon prêtre, pour monter à mon autel, pour brûler de l’encens et pour porter l’éphod devant moi ? Et j’ai donné à la famille de ton père toutes les offrandes des Israélites consumées par le feu.[a]
  rationale: La révision restaure la question rhétorique exigée par la syntaxe et le contexte, affine le mouvement vers l’autel et emploie une expression française plus idiomatique pour l’encens. Elle préserve l’amplitude de « porter l’éphod » et le sens général, non restrictif, du terme sacrificiel אִשֵּׁי.
