  text: לָ֣/מָּה תִבְעֲט֗וּ בְּ/זִבְחִ/י֙ וּ/בְ/מִנְחָתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי מָע֑וֹן וַ/תְּכַבֵּ֤ד אֶת בָּנֶ֨י/ךָ֙ מִמֶּ֔/נִּי לְ/הַבְרִֽיאֲ/כֶ֗ם מֵ/רֵאשִׁ֛ית כָּל מִנְחַ֥ת יִשְׂרָאֵ֖ל לְ/עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: fr
  text: Pourquoi foulez-vous aux pieds mon sacrifice et mon offrande[a], que j’ai prescrits pour la demeure[b], et honores-tu tes fils plus que moi, en vous engraissant des prémices de toutes les offrandes d’Israël, mon peuple[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le verbe évoque le fait de « donner des coups de pied contre » quelque chose ; il peut aussi se traduire par « traiter avec mépris » ou « mépriser ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu difficile : « que j’ai prescrits pour/dans la demeure ». La « demeure » désigne probablement le sanctuaire où Dieu fait résider son nom.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « de la première part » ou « de la meilleure part de toute offrande d’Israël, mon peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: foulez-vous aux pieds
  rationale: Le verbe évoque concrètement le fait de donner des coups de pied et, au figuré, de traiter avec mépris. Cette expression française conserve l’image vigoureuse et la valeur de rejet méprisant.
- source_word: זִבְחִי
  choice: mon sacrifice
  rationale: זֶבַח désigne couramment un sacrifice impliquant l’immolation. « Mon sacrifice » est naturel et suffisamment précis ici.
- source_word: מִנְחָתִי
  choice: mon offrande
  rationale: מִנְחָה peut désigner une offrande végétale, mais aussi plus largement un don cultuel. En parallèle avec « sacrifice », « offrande » préserve cette amplitude.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: que j’ai prescrits pour la Demeure
  rationale: La tournure hébraïque est condensée et difficile. מָעוֹן renvoie vraisemblablement au sanctuaire comme demeure de Dieu. La majuscule signale ce référent sans ajouter dans le texte le possessif « ma », absent de l’expression hébraïque.
- source_word: וַתְּכַבֵּד
  choice: honores-tu
  rationale: כבד exprime ici l’honneur accordé à quelqu’un, en contraste direct avec l’honneur dû à Dieu.
- source_word: מִמֶּנִּי
  choice: plus que moi
  rationale: 'La préposition marque clairement une comparaison : Éli accorde à ses fils davantage d’honneur qu’à Dieu.'
- source_word: לְהַבְרִיאֲכֶם
  choice: en vous engraissant
  rationale: Le verbe décrit concrètement le fait de devenir gras ou bien nourri grâce aux portions détournées. Le pluriel « vous » respecte le suffixe hébreu et maintient la vigueur de l’accusation.
- source_word: מֵרֵאשִׁית
  choice: des prémices
  rationale: רֵאשִׁית désigne ce qui vient en premier et peut, par extension, évoquer la part de premier choix. « Prémices » conserve le lien avec la priorité cultuelle, tandis qu’une note explicite l’autre nuance.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל
  choice: de toutes les offrandes d’Israël
  rationale: Dans cette accusation générale concernant les prélèvements sacerdotaux, מִנְחָה se comprend naturellement au sens large d’offrande plutôt qu’au seul sens d’offrande végétale.
- source_word: לְעַמִּי
  choice: Israël, mon peuple
  rationale: La formulation appositive identifie naturellement Israël comme le peuple de Dieu, tout en évitant une construction française pesante.
theological_decisions:
- issue: Passage du pluriel au singulier dans l’accusation
  choice: Conserver « foulez-vous » au pluriel, puis « honores-tu » au singulier, et enfin « vous engraissant » au pluriel.
  alternative: Uniformiser tout le verset au singulier en visant uniquement Éli, ou tout mettre au pluriel en visant sa maison.
  rationale: Le texte hébreu ouvre l’accusation au pluriel, se concentre ensuite personnellement sur Éli au singulier, puis revient au pluriel. Conserver ces changements respecte la portée collective et la responsabilité particulière d’Éli sans les résoudre artificiellement.
- issue: Sens de רֵאשִׁית dans le contexte des offrandes
  choice: Rendre par « prémices », avec une note signalant « première part » et « meilleure part ».
  alternative: Traduire directement par « meilleure part » ou, plus littéralement, par « première part ».
  rationale: Le mot peut désigner ce qui est premier aussi bien que ce qui est de premier choix. « Prémices » garde cette tension cultuelle sans réduire le reproche à une seule nuance.
- issue: Référent de מָעוֹן
  choice: Comprendre « la Demeure » comme le sanctuaire, tout en signalant l’incertitude syntaxique.
  alternative: « dans la demeure », « pour la demeure » ou « au lieu de résidence » sans identifier explicitement le sanctuaire.
  rationale: Le contexte cultuel favorise une référence au sanctuaire, mais la relation syntaxique exacte demeure difficile; la note préserve donc les principales possibilités.
translation_notes:
  register: Français international moderne, digne et direct. L’image concrète de l’action méprisante et celle de l’engraissement sont conservées. Les alternances de nombre du texte hébreu sont volontairement maintenues, malgré leur caractère abrupt en français.
