source:
  edition: WLC
  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: fr
  text: Non, mes fils, car la nouvelle que j’entends n’est pas bonne. Vous poussez le peuple de Yahweh à pécher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible de l’hébreu : « Non, mes fils, car la nouvelle que j’entends le peuple de Yahweh répandre n’est pas bonne. »'
    reason: 'L’enchaînement syntaxique de מַעֲבִרִים עַם יְהוָה est difficile : il peut décrire les fils poussant le peuple à pécher, ou le peuple de Yahweh faisant circuler la nouvelle.'
lexical_decisions:
- source_word: אַל
  choice: Non
  rationale: Employé ici comme une vive interjection de désapprobation plutôt que comme une simple défense. « Non » est naturel et direct en français moderne.
- source_word: בָּנַי
  choice: mes fils
  rationale: Éli s’adresse précisément à ses fils ; cette traduction est littérale et naturelle.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de la réprimande d’Éli, dans un registre digne et concis.
- source_word: לֹא טוֹבָה
  choice: n’est pas bon
  rationale: Conserve l’expression évaluative sobre de l’hébreu sans la renforcer en « est mauvais ».
- source_word: הַשְּׁמֻעָה אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: ce que j’entends dire
  rationale: Rend naturellement en français l’idée d’un rapport ou de propos qui parviennent continuellement à Éli, sans suggérer nécessairement une rumeur incertaine.
- source_word: מַעֲבִרִים
  choice: vous poussez … à pécher
  rationale: Rend l’interprétation causative du hiphil de עבר dans un français courant. Le sujet « vous » est fourni par le contexte de l’adresse aux fils ; l’autre analyse syntaxique est signalée en note.
- source_word: עַם יְהוָה
  choice: le peuple de Yahweh
  rationale: Traduit directement le groupe construit et conserve le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le tétragramme comme nom propre, conformément à la convention du projet.
theological_decisions:
- issue: Interprétation de מַעֲבִרִים עַם יְהוָה
  choice: Vous poussez le peuple de Yahweh à pécher
  alternative: Ce que j’entends le peuple de Yahweh raconter n’est pas bon
  rationale: L’analyse causative s’accorde au contexte de la réprimande, mais la syntaxe hébraïque est difficile et permet de rattacher le peuple à la diffusion du rapport. La note maintient cette ambiguïté réelle.
- issue: Rendu de יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel ; « Yahweh » le conserve plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, direct et digne. « Pousser … à pécher » évite le tour peu idiomatique « faire transgresser » tout en conservant la portée morale et causative du texte.
