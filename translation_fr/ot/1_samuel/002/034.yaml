source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: fr
  text: 'Et voici le signe pour toi : ce qui arrivera à tes deux fils, Hofni et Pinhas ; tous deux mourront le même jour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאוֹת
  choice: le signe
  rationale: Le nom אוֹת désigne couramment un signe qui confirme une parole ou une annonce. « Le signe » est naturel en français et conserve ici la fonction confirmatrice sans la préciser excessivement.
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: Et voici le signe qui t’est donné
  rationale: La formulation rend la tournure déictique « et ceci [sera] pour toi le signe » dans un français actuel et digne, tout en conservant l’adresse personnelle à Éli.
- source_word: אֲשֶׁר יָבֹא אֶל שְׁנֵי בָנֶיךָ
  choice: ce qui arrivera à tes deux fils
  rationale: Avec un événement comme sujet, בוא אל peut exprimer ce qui advient à quelqu’un. « Arrivera à » est idiomatique en français et évite la formulation moins naturelle « viendra sur ».
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: Hofni et Pinhas
  rationale: Le second אֶל précise en apposition l’identité des deux fils. En français, leurs noms suivent naturellement « tes deux fils », sans répéter la préposition.
- source_word: בְּיוֹם אֶחָד
  choice: le même jour
  rationale: Littéralement « en/un jour », l’expression souligne ici que les deux décès se produiront au cours d’une seule et même journée. « Le même jour » transmet clairement cette portée dans un français naturel.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: tous deux mourront
  rationale: Cette formulation conserve l’insistance de שְׁנֵיהֶם sur le sort commun des deux fils et demeure concise et naturelle.
theological_decisions:
- issue: Nature du « signe »
  choice: Un signe confirmant le jugement annoncé contre la maison d’Éli
  alternative: Un simple présage prédictif dépourvu de fonction confirmatrice
  rationale: Dans le contexte, la mort des deux fils sert à confirmer la parole prophétique. Le texte traduit conserve toutefois le terme général « signe » et n’explicite pas davantage sa nature.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la solennité de l’annonce prophétique sans archaïsmes. Les graphies « Hofni » et « Pinhas » suivent des formes françaises courantes et proches de l’hébreu.
