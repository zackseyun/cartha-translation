  source_fidelity: 'Le sens fondamental est fidèlement rendu : l’inférence (« C’est pourquoi »), la déclaration divine antérieure intensifiée, le contraste introduit par « Mais maintenant », la réciprocité honorer/honorer et l’abaissement de ceux qui méprisent Dieu sont tous conservés. « Loin de moi cette pensée ! » explicite toutefois un objet que l’hébreu laisse implicite dans la formule חָלִילָה לִּי.'
  naturalness: Le français est globalement moderne, clair et d’un registre convenablement solennel. « Seront tenus pour peu de chose » est intelligible, mais « seront peu estimés » est plus idiomatique en français international tout en gardant le contraste avec l’honneur.
  terminology: « Yahweh », « le Dieu d’Israël », « maison », « honorer » et « mépriser » sont cohérents et précis. La répétition de la racine d’honneur est bien conservée.
