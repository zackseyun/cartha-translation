  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: fr
  text: 'C’est pourquoi, déclare Yahweh, le Dieu d’Israël : « J’avais bel et bien dit que ta maison et la maison de ton père marcheraient devant moi pour toujours. Mais maintenant, déclare Yahweh : loin de moi ! Car ceux qui m’honorent, je les honorerai ; mais ceux qui me méprisent seront peu estimés[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront déshonorés » ou « seront traités comme insignifiants ». Le verbe hébreu évoque ce qui devient léger, négligeable ou de peu de poids, par contraste avec « je les honorerai ».
    reason: Précise l’éventail lexical du verbe יֵקָלּוּ et le jeu de contraste avec כבד, « honorer, donner du poids ».
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion judiciaire tirée de l’accusation précédente.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Rend la formule solennelle de l’oracle dans un français actuel, tout en transcrivant explicitement le nom divin.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Reproduit directement la chaîne construite qui identifie Yahweh.
- source_word: אָמֹר אָמַרְתִּי
  choice: J’avais bel et bien dit
  rationale: L’expression « bel et bien » restitue l’insistance de l’infinitif absolu avec le verbe conjugué; le plus-que-parfait situe naturellement en français cette déclaration avant sa révocation présente.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: ta maison et la maison de ton père
  rationale: Conserve la répétition de « maison » ainsi que sa portée familiale et dynastique.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: marcheraient devant moi
  rationale: Préserve l’image hébraïque et sa résonance relationnelle et cultuelle sans la réduire au seul exercice du sacerdoce.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle correspondant à la durée permanente affirmée dans la déclaration antérieure.
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Marque clairement le brusque retournement par rapport à la déclaration précédente.
- source_word: חָלִילָה לִּי
  choice: loin de moi cette pensée !
  rationale: Formule française énergique de répudiation qui communique la force de l’hébreu sans expliciter davantage l’objet sous-entendu.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: j’honorerai ceux qui m’honorent
  rationale: Conserve la répétition intentionnelle de la racine כבד et sa réciprocité.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: ceux qui me méprisent seront tenus pour peu de chose
  rationale: « Méprisent » exprime le dédain de בזה; « tenus pour peu de chose » rend l’idée de légèreté ou de faible considération portée par קלל et maintient le contraste avec l’honneur.
theological_decisions:
- issue: Nature de la déclaration antérieure concernant la maison d’Éli
  choice: Présenter celle-ci comme une véritable déclaration divine antérieure, suivie ici d’une répudiation explicite de sa continuation.
  alternative: Comprendre d’emblée « pour toujours » comme une hyperbole, ou atténuer le retournement en simple restriction de privilège.
  rationale: Le verset oppose directement « J’avais bel et bien dit » à « Mais maintenant […] loin de moi cette pensée ! », puis fonde ce retournement sur l’opposition entre ceux qui honorent Dieu et ceux qui le méprisent. La formulation française préserve cette tension sans lui imposer une résolution systématique.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure de l’oracle et les répétitions significatives de l’hébreu sont conservées; la ponctuation et les temps verbaux sont adaptés à un récit français naturel.
