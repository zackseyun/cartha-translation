    rationale: La formule hébraïque est une répudiation énergique sans objet exprimé. « Loin de moi ! » préserve mieux sa concision et l’objet implicite.
  - severity: low
    issue: « Seront tenus pour peu de chose » est un peu lourd.
    rationale: « Seront peu estimés » est une formulation plus naturelle qui rend l’idée d’être de peu de poids/considération et maintient l’antithèse avec « honorer ».
