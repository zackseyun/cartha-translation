id: 1SA.2.9
reference: 1 Samuel 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַגְלֵ֤י חסיד/ו יִשְׁמֹ֔ר וּ/רְשָׁעִ֖ים בַּ/חֹ֣שֶׁךְ יִדָּ֑מּוּ כִּֽי לֹ֥א בְ/כֹ֖חַ יִגְבַּר אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: fr
  text: Il veille sur les pas de ceux qui lui sont fidèles[a], mais les méchants sont réduits au silence dans les ténèbres[b], car ce n’est pas par la force qu’un homme l’emporte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition textuelle hébraïque permet aussi de lire au singulier : « celui qui lui est fidèle ». Le pluriel est retenu en raison du parallélisme poétique et du sens collectif probable.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « restent immobiles » ou « sont retranchés ». Le verbe hébreu peut exprimer le silence ou l’immobilisation.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu traduit par « un homme » est un masculin singulier employé ici dans un sens général.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: les pas de
  rationale: Le nom signifie littéralement « pieds de », mais « veiller sur les pas » restitue naturellement en français l’image concrète de la conduite et de la protection, sans en modifier le sens.
- source_word: חסידו
  choice: ceux qui lui sont fidèles
  rationale: Cette formulation rend le sens collectif retenu et exprime la loyauté d’alliance, sans les connotations ecclésiastiques que pourrait avoir « saints ».
- source_word: יִשְׁמֹר
  choice: il veille sur
  rationale: Le verbe désigne l’action de garder ou de protéger. Avec « les pas », « veille sur » est idiomatique et conserve la valeur protectrice.
- source_word: וּרְשָׁעִים
  choice: mais les méchants
  rationale: La conjonction marque ici le contraste entre les fidèles et les méchants; « mais » explicite naturellement cette fonction en français.
- source_word: בַּחֹשֶׁךְ
  choice: dans les ténèbres
  rationale: Cette expression préserve l’image hébraïque de l’obscurité, associée ici au jugement et à l’impuissance.
- source_word: יִדָּמּוּ
  choice: sont réduits au silence
  rationale: Le nifal de דמם peut évoquer le fait de devenir silencieux, d’être immobilisé ou retranché. « Sont réduits au silence » conserve la passivité et la force judiciaire du contexte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison qui fonde le contraste précédent.
- source_word: לֹא בְכֹחַ
  choice: ce n’est pas par la force
  rationale: Cette tournure française naturelle conserve l’accent hébraïque sur l’insuffisance de la force humaine.
- source_word: יִגְבַּר
  choice: l’emporte
  rationale: Le verbe signifie être fort, triompher ou prévaloir. « L’emporte » exprime ici la réussite ou la victoire, plutôt que la simple possession de force.
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier hébreu est conservé; il possède ici une portée générale et proverbiale.
theological_decisions:
- issue: Nombre et sens de חסידו
  choice: 'sens collectif/pluriel : « ceux qui lui sont fidèles »'
  alternative: 'singulier : « celui qui lui est fidèle »'
  rationale: La tradition textuelle permet une lecture au singulier, mais le parallélisme avec « les méchants » et l’appui de témoins anciens favorisent le sens collectif. La variante demeure signalée en note.
- issue: Portée de אִישׁ
  choice: « un homme », employé dans un énoncé général
  alternative: « une personne » ou « personne »
  rationale: Le texte source emploie un substantif masculin singulier. La traduction en conserve la forme tout en laissant au proverbe sa portée générale.
- issue: Nature de la protection divine
  choice: « veille sur les pas »
  alternative: « garde les pieds »
  rationale: La formulation traduit une protection divine portant sur le chemin des fidèles, sans préciser davantage la manière ni promettre une exemption générale de toute souffrance.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme antithétique du vers est conservé. « Les pas » et « veille sur » forment une expression française naturelle qui maintient l’image de la conduite protégée; les ambiguïtés textuelle et lexicale sont signalées en notes.
