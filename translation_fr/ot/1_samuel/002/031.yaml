review_pass:
  verdict: revise
  source_fidelity: Le rendu de זְרוֹעַ par « force » est contextuellement justifié et correspond à la métaphore hébraïque. En revanche, « famille paternelle » peut évoquer en français la famille du côté paternel plutôt que « la maison de ton père », c’est-à-dire la lignée ancestrale. « Personne n’atteindra la vieillesse » explicite et élargit légèrement « il n’y aura pas de vieillard dans ta maison ».
  naturalness: La formulation est globalement claire et solennelle. « Voici, des jours viennent » et « la maison de ton père » sont naturels dans un registre biblique moderne; « retrancherai » rend plus précisément le verbe de suppression que « briserai ».
  terminology: « Force » restitue convenablement la valeur métaphorique de « bras ». « Maison de ton père » préserve le terme de parenté et sa portée lignagère sans l’ambiguïté moderne de « famille paternelle ». « Vieillard » indique ici l’âge avancé, non une fonction d’ancien.
  issues:
  - severity: medium
    issue: « ta famille paternelle » pour בֵּית אָבִיךָ
    rationale: Cette expression française désigne couramment la parenté du côté du père. L’hébreu vise plus précisément la maison ou lignée ancestrale du destinataire.
  - severity: medium
    issue: « personne n’atteindra la vieillesse » pour מֵהְיוֹת זָקֵן בְּבֵיתֶךָ
    rationale: La formulation transforme l’énoncé existentiel concernant l’absence d’un vieillard dans la maison en une généralisation sur toute personne et sur le fait d’atteindre la vieillesse. Une formulation plus directe conserve mieux la portée du texte.
  - severity: low
    issue: « je briserai ta force » pour וְגָדַעְתִּי
    rationale: « Briser » est possible avec « force », mais « retrancher » reproduit plus nettement l’idée de couper ou supprimer de façon décisive.
  revised_text: Voici, des jours viennent où je retrancherai ta force et la force de la maison de ton père, de sorte qu’il n’y aura pas de vieillard dans ta maison.
