revisions:
- from: Voici que des jours viennent où je briserai ta force et celle de ta famille paternelle, si bien que personne n’atteindra la vieillesse dans ta famille.
  to: Voici, des jours viennent où je retrancherai ta force et la force de la maison de ton père, de sorte qu’il n’y aura pas de vieillard dans ta maison.
  rationale: La révision conserve l’interprétation contextuelle de « bras » comme « force », tout en rétablissant « maison de ton père » pour la lignée ancestrale et une expression existentielle directe pour l’absence de vieillard. « Retrancherai » reflète mieux l’image de suppression exprimée par le verbe hébreu.
