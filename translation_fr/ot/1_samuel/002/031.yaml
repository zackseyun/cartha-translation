  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: fr
  text: Voici, des jours viennent où je retrancherai ta force et la force de la maison de ton père, de sorte qu’il n’y aura pas de vieillard dans ta maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit avec solennité l’annonce prophétique tout en restant naturel en français moderne.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Conserve la formule prophétique hébraïque et son orientation vers un jugement à venir.
- source_word: גָדַעְתִּי
  choice: je briserai
  rationale: Le verbe signifie couper ou retrancher. Avec « force », « briser » exprime naturellement la suppression décisive de la puissance, sans ajouter explicitement l’idée d’extermination.
- source_word: זְרֹעֲךָ
  choice: ta force
  rationale: Littéralement « ton bras » ; le bras représente ici la force, la puissance ou la capacité de subsister.
- source_word: זְרֹעַ בֵּית אָבִיךָ
  choice: celle de ta famille paternelle
  rationale: « Celle » reprend « force », tandis que « famille paternelle » rend clairement le groupe familial et ancestral désigné par l’expression hébraïque.
- source_word: בֵּית אָבִיךָ
  choice: ta famille paternelle
  rationale: Rend en français courant l’expression de parenté « maison de ton père », qui désigne la lignée ou la famille élargie.
- source_word: מֵהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: si bien que personne n’atteindra la vieillesse dans ta famille
  rationale: 'Exprime naturellement le résultat du jugement : aucun membre de cette famille ne parviendra à un âge avancé.'
- source_word: זָקֵן
  choice: atteindra la vieillesse
  rationale: Le mot renvoie ici à l’âge avancé, et non à la fonction d’ancien.
theological_decisions:
- issue: Sens métaphorique de « bras » dans l’oracle de jugement
  choice: Traduire זְרוֹעַ par « force » dans les deux occurrences
  alternative: Conserver littéralement « bras »
  rationale: Dans ce contexte, le bras représente la force ou la puissance de la famille d’Éli. Le rendu explicite le sens de l’image sans préciser indûment si le jugement vise surtout l’autorité, la vitalité ou la continuité de la lignée.
- issue: Portée de l’absence de זָקֵן dans la famille
  choice: « personne n’atteindra la vieillesse »
  alternative: « il n’y aura pas de vieillard »
  rationale: Cette formulation française transmet que les membres de la famille ne parviendront pas à un âge avancé, sans comprendre זָקֵן comme un titre religieux ou social.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure de l’annonce prophétique est conservée ; les idiomes hébreux « bras » et « maison » sont rendus selon leur sens contextuel afin d’éviter une formulation obscure.
