source:
  edition: WLC
  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: fr
  text: Ainsi, le péché des jeunes hommes était extrêmement grave devant Yahweh[a][b], car ces hommes méprisaient l’offrande[c] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu représenté par « Yahweh » est traditionnellement rendu par « le SEIGNEUR ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devant la face de Yahweh », expression qui peut aussi se comprendre comme « en présence de Yahweh » ou « aux yeux de Yahweh ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut désigner une offrande en général et, dans certains contextes, plus précisément une offrande végétale.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: péché
  rationale: Dans ce contexte, le nom désigne la faute commise par les fils d’Éli, et non un sacrifice pour le péché.
- source_word: הַנְּעָרִים
  choice: les jeunes hommes
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Ici, il s’agit des fils adultes d’Éli qui exercent un service sacerdotal.
- source_word: גְּדוֹלָה מְאֹד
  choice: extrêmement grave
  rationale: Cette formulation française naturelle exprime à la fois l’intensification de מְאֹד et la gravité morale indiquée par גְּדוֹלָה.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: devant Yahweh
  rationale: La locution hébraïque signifie littéralement « devant la face de Yahweh » et désigne ici ce qui est grave à ses yeux ou en sa présence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de l’évaluation qui précède; « car » convient au registre narratif et soutenu du passage.
- source_word: נִאֲצוּ
  choice: méprisaient
  rationale: Le verbe exprime le mépris ou le dédain; « méprisaient » en donne une traduction directe et naturelle.
- source_word: הָאֲנָשִׁים
  choice: ces hommes
  rationale: Le démonstratif français rend explicite, sans ambiguïté inutile, que « les hommes » renvoie aux jeunes hommes déjà mentionnés.
- source_word: מִנְחַת יְהוָה
  choice: l’offrande de Yahweh
  rationale: מִנְחָה peut désigner largement une offrande et, dans certains contextes, plus précisément une offrande végétale. Le contexte invite ici à conserver le sens large.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom personnel sans introduire une substitution traditionnelle par un titre.
- issue: Portée de l’expression אֶת־פְּנֵי יְהוָה
  choice: devant Yahweh
  alternative: aux yeux de Yahweh / en présence de Yahweh
  rationale: « Devant Yahweh » préserve l’image hébraïque et laisse subsister ses nuances possibles d’évaluation divine et de présence cultuelle.
translation_notes:
  register: Français international moderne, clair et digne. « Extrêmement grave » évite le calque peu naturel « très grand » appliqué au péché, tandis que « méprisaient » conserve la force directe du verbe hébreu. Les notes maintiennent les ambiguïtés lexicales réelles sans surcharger le corps du verset.
