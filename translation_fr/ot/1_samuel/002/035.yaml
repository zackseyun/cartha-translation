revisions:
- from: Je susciterai pour moi un prêtre fidèle, qui agira selon ce qui est dans mon cœur et dans mon âme. Je lui bâtirai une maison fidèle[a], et il marchera toujours devant celui que j’ai consacré par l’onction[b].
  to: Je susciterai pour moi un prêtre fidèle, qui agira selon ce qui est dans mon cœur et dans mon âme. Je lui bâtirai une maison durable[a], et il marchera devant mon oint tous les jours[b].
  rationale: La révision rétablit « mon oint » afin de conserver la forme et l’ambiguïté de מְשִׁיחִי, sans imposer une lecture messianique ou royale. Elle remplace « maison fidèle » par « maison durable », expression française naturelle qui rend la valeur de permanence de בַּיִת נֶאֱמָן; la note conserve la formulation littérale et l’ambiguïté de l’image.
