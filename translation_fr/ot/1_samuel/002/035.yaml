    issue: Reformulation interprétative de מְשִׁיחִי dans le texte principal
    rationale: « Celui que j’ai consacré par l’onction » transforme le substantif possessif « mon oint » en proposition relative et atténue la forme titulaire du terme hébreu. « Mon oint » préserve mieux la concision et l’ambiguïté du source.
  - severity: low
    issue: « Maison fidèle » est peu idiomatique en français
    rationale: Pour une maison au sens de maisonnée ou lignée, l’adjectif נֶאֱמָן exprime ici surtout la stabilité ou la permanence. « Maison durable » rend ce sens de manière naturelle, sans déterminer si la maison est une famille, une lignée ou une institution.
