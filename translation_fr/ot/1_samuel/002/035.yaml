base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: fr
  text: Je susciterai pour moi un prêtre fidèle, qui agira selon ce qui est dans mon cœur et dans mon âme. Je lui bâtirai une maison durable[a], et il marchera devant mon oint tous les jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une maison fidèle ». Il peut s’agir d’une maisonnée ou d’une lignée qui subsistera.
    reason: lexical_alternative
  - marker: b
    text: « Mon oint » pourrait aussi être rendu par « mon Messie » ou, dans ce contexte, « mon roi ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  choice: Je susciterai
  rationale: Le hifil de קום exprime ici l’action de faire paraître et d’établir quelqu’un dans une fonction. « Susciter » conserve à la fois l’initiative divine et la vocation personnelle.
- source_word: לִי
  choice: pour moi
  rationale: Le datif avec suffixe de première personne marque que le prêtre est choisi au service de Dieu. « Pour moi » est naturel et suffisamment appuyé en français.
- source_word: כֹּהֵן נֶאֱמָן
  choice: un prêtre fidèle
  rationale: « Prêtre » désigne normalement la fonction cultuelle; « fidèle » exprime la fiabilité et la loyauté attachées à נֶאֱמָן.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה
  choice: qui agira selon ce qui est dans mon cœur et dans mon âme
  rationale: La formulation conserve les deux anthropomorphismes hébreux, « cœur » et « âme », sans les réduire à la seule notion de volonté. « Agira » est plus idiomatique ici que « fera ».
- source_word: וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן
  choice: Je lui bâtirai une maison fidèle
  rationale: « Bâtir » et « maison » maintiennent l’image hébraïque; la maison désigne vraisemblablement une lignée ou maisonnée durable. La répétition de « fidèle » reflète celle de נֶאֱמָן.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: il marchera toujours devant
  rationale: « Marcher devant » préserve l’idiome hébreu d’une conduite ou d’un service continus. « Toujours » rend naturellement כָּל הַיָּמִים, littéralement « tous les jours ».
- source_word: מְשִׁיחִי
  choice: celui que j’ai consacré par l’onction
  rationale: Cette formulation rend le sens de « mon oint » en français moderne sans imposer dans le corps du texte le titre eschatologique « Messie » ni limiter explicitement le référent au roi.
theological_decisions:
- issue: Référent et portée de מְשִׁיחִי (« mon oint »)
  choice: celui que j’ai consacré par l’onction
  alternative: mon oint; mon Messie; mon roi
  rationale: Dans le contexte historique, le terme désigne celui qui a reçu l’onction de Dieu, probablement le souverain. La traduction garde le sens institutionnel sans imposer une identification messianique ultérieure; les autres rendus sont signalés en note.
- issue: Sens de « maison » dans בַּיִת נֶאֱמָן
  choice: maison fidèle
  alternative: maison durable; lignée durable
  rationale: L’expression peut évoquer une maisonnée ou une lignée stable. Le maintien de la métaphore et de la répétition de נֶאֱמָן préserve l’ambiguïté et le lien verbal avec le « prêtre fidèle ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant naturelle. Les images du cœur, de l’âme, de la maison bâtie et de la marche devant Dieu sont conservées; les ambiguïtés concernant la maison et l’oint sont explicitées en notes.
