  text: גַּם֮ בְּ/טֶרֶם֮ יַקְטִר֣וּ/ן אֶת הַ/חֵלֶב֒ וּ/בָ֣א נַ֣עַר הַ/כֹּהֵ֗ן וְ/אָמַר֙ לָ/אִ֣ישׁ הַ/זֹּבֵ֔חַ תְּנָ֣/ה בָשָׂ֔ר לִ/צְל֖וֹת לַ/כֹּהֵ֑ן וְ/לֹֽא יִקַּ֧ח מִמְּ/ךָ֛ בָּשָׂ֥ר מְבֻשָּׁ֖ל כִּ֥י אִם חָֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: fr
  text: 'Avant même qu’ils brûlent la graisse, le serviteur[a] du prêtre venait dire à l’homme qui offrait le sacrifice : « Donne de la viande à rôtir pour le prêtre, car il ne prendra pas de viande bouillie de ta part, mais seulement de la viande crue. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jeune homme du prêtre » ou « l’assistant du prêtre » ; le mot hébreu נַעַר peut désigner un jeune homme ou un serviteur. Ici, il s’agit vraisemblablement d’un subordonné qui agit pour le prêtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: Avant même que
  rationale: Cette tournure française exprime à la fois l’antériorité marquée par בְּטֶרֶם et la valeur emphatique de גַּם, qui aggrave ici la faute décrite.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: ils brûlent la graisse
  rationale: Le verbe désigne ici la combustion rituelle des parties grasses. « Brûler la graisse » reste clair et naturel sans ajouter un lieu absent du texte.
- source_word: נַעַר הַכֹּהֵן
  choice: le serviteur du prêtre
  rationale: נַעַר peut désigner un jeune homme ou un serviteur. Dans ce contexte, il agit comme subordonné du prêtre ; « serviteur » exprime le mieux cette fonction, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: à l’homme qui offrait le sacrifice
  rationale: La proposition relative rend naturellement en français le participe hébreu qui caractérise l’homme en train d’offrir un sacrifice.
- source_word: תְּנָה בָשָׂר
  choice: Donne de la viande
  rationale: L’impératif direct conserve le ton brusque de l’ordre, et « viande » convient au contexte alimentaire et sacrificiel.
- source_word: לִצְלוֹת לַכֹּהֵן
  choice: à rôtir pour le prêtre
  rationale: Cette formulation concise conserve l’idée de destination exprimée par l’infinitif et le bénéficiaire, sans préciser inutilement qui fera rôtir la viande.
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: car il ne prendra pas de viande bouillie de ta part
  rationale: Le futur français exprime le refus annoncé du prêtre. « De ta part » rend מִמְּךָ de façon compréhensible tout en conservant le verbe concret « prendre ».
- source_word: מְבֻשָּׁל
  choice: bouillie
  rationale: Le terme désigne précisément une cuisson à l’eau, opposée ici à la viande crue destinée à être rôtie.
- source_word: כִּי אִם חָי
  choice: mais seulement de la viande crue
  rationale: La construction exceptive oppose nettement la viande bouillie à la viande crue ; la répétition de « viande » rend le contraste naturel et explicite en français.
theological_decisions: []
