  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: fr
  text: Mais je ne retrancherai pas tous les tiens d’auprès de mon autel, afin de faire dépérir tes yeux et d’accabler ton âme de chagrin. Et toute la descendance de ta maison mourra dans la force de l’âge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mourront hommes »; le sens de cette expression hébraïque inhabituelle est incertain. Elle peut désigner une mort dans la force de l’âge.'
    reason: La formule יָמֻתוּ אֲנָשִׁים est brève et ambiguë. La note conserve sa tournure littérale tout en signalant le sens contextuel probable retenu dans le texte.
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: Mais je ne retrancherai pas tous les tiens d’auprès de mon autel
  rationale: 'Sous la portée de la négation, אִישׁ a une valeur distributive : Dieu ne retranchera pas chacun des hommes appartenant à la maison d’Éli. « Tous les tiens » exprime naturellement qu’un reste subsistera, tandis que « d’auprès de mon autel » rend la nuance spatiale de מֵעִם sans préciser indûment la fonction exacte de ce reste.'
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: afin de consumer tes yeux
  rationale: Le choix conserve l’image forte de כָּלָה appliquée aux yeux et la relation de but ou de conséquence exprimée par לְ, sans la réduire à une simple déficience visuelle.
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: et d’accabler ton âme de chagrin
  rationale: Le verbe rare exprime la douleur ou l’affliction. « Accabler… de chagrin » est idiomatique en français, et « âme » maintient ici le langage anthropologique de נֶפֶשׁ.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: Cependant, toute la descendance de ta maison
  rationale: מַרְבִּית désigne l’accroissement ou la multiplication de la maison, donc ses membres à venir. « Descendance » communique ce référent humain plus clairement que le calque peu naturel « accroissement de ta maison ».
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: mourra dans la force de l’âge
  rationale: La formule hébraïque est littéralement « mourront hommes » et paraît opposer la mort à l’âge d’homme à une mort après une longue vieillesse. Cette formulation française rend le sens probable tout en signalant en note la littéralité et l’ambiguïté de l’expression.
theological_decisions:
- issue: Étendue du jugement porté contre la maison sacerdotale d’Éli
  choice: Tous les membres de la maison d’Éli ne sont pas immédiatement retranchés d’auprès de l’autel; certains subsistent dans un contexte de jugement et de douleur.
  alternative: La maison d’Éli est entièrement et immédiatement exclue du service de l’autel.
  rationale: La négation portant sur אִישׁ indique que le retranchement n’atteint pas chaque individu. Les propositions suivantes font de cette subsistance une source d’affliction, ce qui maintient la tension du texte sans définir davantage le statut sacerdotal des survivants.
- issue: Sens de אֲנָשִׁים dans la formule finale
  choice: « dans la force de l’âge » dans le texte, avec le sens littéral indiqué en note
  alternative: « comme des hommes » ou une mort violente « par la main des hommes »
  rationale: Le texte massorétique ne contient aucun terme signifiant « épée » ou « main »; une mort violente ne doit donc pas être ajoutée. La formule inhabituelle peut désigner la mort à l’âge adulte ou en pleine vigueur, mais son caractère littéral est conservé dans la note.
translation_notes:
  register: Français international moderne, digne et lisible. « Retrancher » conserve le registre judiciaire et l’écho concret de כרת; « d’auprès de mon autel » garde la nuance de proximité. La dernière phrase évite l’ajout non attesté d’une épée ou d’une mise à mort par des hommes.
