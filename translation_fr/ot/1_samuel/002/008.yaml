source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: fr
  text: Il relève le pauvre de la poussière, il relève l’indigent du tas de cendres, pour les faire asseoir avec les nobles et leur donner en héritage un siège d’honneur.[a] Car les piliers de la terre appartiennent à Yahvé,[b] et c’est sur eux qu’il a posé le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un trône d’honneur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les fondements de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: Il relève le pauvre de la poussière
  rationale: Le participe hiphil de קום exprime l’action habituelle de faire se relever. « Relève » conserve l’image concrète de l’abaissement social portée par la poussière.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: il retire l’indigent du tas de cendres
  rationale: אַשְׁפֹּת désigne un tas de déchets ou de détritus. « Tas de cendres » garde l’image traditionnelle de déchéance, tandis que « retire » rend naturellement le mouvement ascendant de רום sans répétition lourde.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: pour les faire asseoir avec les nobles
  rationale: L’infinitif hiphil indique le but ou le résultat. נְדִיבִים désigne ici les personnes de rang élevé; « nobles » convient au renversement social décrit.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: et leur donner en héritage un siège d’honneur
  rationale: Le hiphil de נחל conserve l’idée d’attribution en héritage. כִּסֵּא peut désigner un siège ou un trône; « siège d’honneur » préserve l’idée d’élévation sans imposer une royauté individuelle.
- source_word: מְצֻקֵי אֶרֶץ
  choice: les piliers de la terre
  rationale: Le terme évoque les supports ou assises du monde. « Piliers » conserve l’image cosmologique concrète de la poésie hébraïque.
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: et c’est sur eux qu’il a posé le monde
  rationale: La tournure clivée met naturellement en français l’accent du complément עֲלֵיהֶם. תֵּבֵל désigne le monde ordonné et habité.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le tétragramme est rendu par le nom personnel « Yahvé », conformément à sa présence explicite dans le texte hébreu et à la couche anglaise fournie.
theological_decisions:
- issue: Image cosmologique de מְצֻקֵי אֶרֶץ
  choice: Conserver « les piliers de la terre » comme image poétique
  alternative: « les fondements de la terre »
  rationale: Le texte fonde la souveraineté divine sur une représentation poétique des supports du monde. La traduction garde cette image sans la transformer en affirmation scientifique ni l’aplatir en abstraction.
- issue: Portée de כִסֵּא כָבוֹד
  choice: « un siège d’honneur »
  alternative: « un trône glorieux » ou « un trône d’honneur »
  rationale: Le contexte concerne l’élévation du pauvre et de l’indigent en général. « Siège d’honneur » exprime le statut élevé tout en préservant dans une note la possibilité lexicale d’un trône.
- issue: Valeur causative et successorale de יַנְחִלֵם
  choice: « leur donner en héritage »
  alternative: « leur faire hériter de »
  rationale: La formulation retenue conserve explicitement le motif de l’héritage et reste naturelle en français, sans réduire le verbe à une simple donation.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre le pauvre et l’indigent est conservé, ainsi que les images concrètes de la poussière, du tas de cendres, du siège d’honneur et des piliers du monde.
