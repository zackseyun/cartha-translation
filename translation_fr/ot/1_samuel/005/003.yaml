source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: fr
  text: Le lendemain, les habitants d’Asdod se levèrent de bon matin, et voici que Dagon était tombé face contre terre devant l’arche de Yahweh. Ils prirent alors Dagon et le remirent à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: se levèrent de bon matin
  rationale: Le hifil de שׁכם exprime le fait de se lever tôt. « Se levèrent de bon matin » est naturel, digne et conserve cette précision temporelle.
- source_word: אַשְׁדּוֹדִים
  choice: les habitants d’Asdod
  rationale: Le gentilé pluriel désigne les gens de la ville. Cette formulation est plus immédiatement compréhensible en français courant qu’un gentilé rare.
- source_word: מִמָּחֳרָת
  choice: Le lendemain
  rationale: L’expression désigne le jour suivant. Placée en tête, elle donne au récit une progression temporelle naturelle.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: הִנֵּה attire soudainement l’attention sur une scène surprenante. « Et voici que » en maintient la force narrative sans archaïsme excessif.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: était tombé face contre terre
  rationale: Le participe décrit l’état dans lequel Dagon est découvert, résultant d’une chute antérieure. « Face contre terre » rend naturellement la posture humiliante exprimée par l’hébreu.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: devant l’arche de Yahweh
  rationale: לִפְנֵי a ici un sens spatial direct. « Devant » est clair et idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de le remplacer par un titre.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: Ils prirent alors Dagon
  rationale: לקח signifie ordinairement « prendre ». Le contexte fait comprendre qu’ils ont saisi ou relevé la statue; « alors » explicite sobrement la succession narrative portée par le waw.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: le remirent à sa place
  rationale: Le hifil de שׁוב signifie ici faire revenir ou remettre. Cette tournure française exprime naturellement le rétablissement de l’idole à son emplacement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Représentation de la chute de Dagon
  choice: face contre terre devant l’arche de Yahweh
  alternative: prosterné devant l’arche de Yahweh
  rationale: La posture peut évoquer une prosternation et une soumission, mais le texte décrit d’abord physiquement Dagon tombé sur sa face. La traduction conserve cette image sans expliciter davantage son interprétation théologique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en étant fluide; « et voici que » conserve l’effet de surprise, tandis que « face contre terre » rend l’image concrète sans imposer une interprétation.
