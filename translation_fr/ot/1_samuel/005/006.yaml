  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: fr
  text: La main de Yahweh s’appesantit sur les habitants d’Asdod. Il les dévasta et les frappa de tumeurs[a], à Asdod et sur son territoire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grosseurs » ; traditionnellement, certains traduisent plus précisément par « hémorroïdes ».
    reason: Le terme hébreu désigne des enflures ou tuméfactions, mais leur nature exacte reste incertaine.
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: La main de Yahweh s’appesantit
  rationale: Conserve l’image concrète de la « main » et l’idée hébraïque de poids, tout en employant une tournure française naturelle et digne pour exprimer une action accablante de jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: sur les habitants d’Asdod
  rationale: Le gentilé hébreu désigne les habitants de la ville. Avec « s’appesantit », la préposition « sur » exprime naturellement la direction hostile de l’action.
- source_word: וַיְשִׁמֵּם
  choice: Il sema la dévastation parmi eux
  rationale: Rend la forte idée de ruine et de désolation sans employer le peu naturel « il les dévasta » à propos de personnes.
- source_word: וַיַּךְ אֹתָם
  choice: frappa
  rationale: Le verbe courant de jugement est rendu directement, dans un français actuel, sans l’archaïsme de « frapper d’un fléau » ou d’autres amplifications.
- source_word: בָעֳפָלִים
  choice: de tumeurs
  rationale: Désigne des grosseurs ou tuméfactions corporelles. « Tumeurs » reste suffisamment général dans le texte principal ; la précision traditionnelle « hémorroïdes » demeure en note puisqu’elle est incertaine.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: Asdod et son territoire
  rationale: Présente la ville et la région qui en dépend comme l’étendue complète du fléau. « Territoire » rend ici le sens géographique de גְּבוּל plutôt que ses seules limites.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le nom personnel est conservé sous une translittération française largement intelligible, sans lui substituer un titre et sans imposer la forme traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore hébraïque de la main qui devient lourde est conservée sous la forme idiomatique « s’appesantit ». La répétition des objets en hébreu est légèrement resserrée en français, tout en maintenant à la fois les habitants touchés et l’étendue géographique du fléau.
