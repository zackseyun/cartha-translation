  text: וַ/יִּקְח֤וּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יָּבִ֥יאוּ אֹת֖/וֹ בֵּ֣ית דָּג֑וֹן וַ/יַּצִּ֥יגוּ אֹת֖/וֹ אֵ֥צֶל דָּגֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: fr
  text: Les Philistins prirent donc l’arche de Dieu, l’apportèrent dans la maison de Dagon[a] et la placèrent à côté de Dagon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le temple de Dagon ». Littéralement : « la maison de Dagon ».'
    reason: Alternative lexicale explicitant la fonction cultuelle de בֵּית sans l’introduire dans le texte principal.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: prirent
  rationale: Le verbe לקח exprime ici l’action ordinaire de prendre; « prirent » suit naturellement la chaîne narrative sans ajouter la nuance plus forte de « saisirent ».
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française courante de ce peuple, avec l’article défini requis en français.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: « Arche » est le terme consacré dans ce contexte cultuel. Le texte porte אֱלֹהִים, « Dieu », et non le nom divin YHWH.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: l’apportèrent
  rationale: Le hiphil de בוא signifie couramment « apporter ». Le pronom reprend « l’arche », féminin en français.
- source_word: בֵּית דָּגוֹן
  choice: la maison de Dagon
  rationale: Cette formulation conserve l’expression hébraïque littérale tout en restant intelligible; dans ce contexte, la « maison » est le temple ou sanctuaire de Dagon.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: la placèrent
  rationale: Le hiphil de יצג signifie mettre ou placer quelque chose dans une position déterminée. « Placèrent » est naturel et précis en français.
- source_word: אֵצֶל דָּגוֹן
  choice: à côté de Dagon
  rationale: אֵצֶל marque la proximité immédiate. Le texte dit simplement « Dagon », sans expliciter qu’il s’agit de sa statue cultuelle.
theological_decisions:
- issue: Désignation divine dans « l’arche de Dieu »
  choice: Dieu
  alternative: le Seigneur / l’Éternel
  rationale: L’hébreu emploie הָאֱלֹהִים et non YHWH; la traduction conserve donc la désignation effectivement présente.
- issue: Référence de « Dagon » dans la seconde occurrence
  choice: Dagon
  alternative: la statue de Dagon
  rationale: Le contexte suggère fortement l’image cultuelle du dieu, mais l’hébreu laisse cette référence implicite. La traduction préserve cette formulation et son léger degré d’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique écrit tout en gardant une syntaxe claire. La répétition de « Dagon » est maintenue comme dans l’hébreu.
