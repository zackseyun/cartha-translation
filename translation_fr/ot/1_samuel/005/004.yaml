  to: Le lendemain, ils se levèrent de bon matin, et voici que Dagon était tombé face contre terre devant l’arche de Yahweh. La tête de Dagon et les paumes de ses deux mains, tranchées, gisaient sur le seuil ; il ne restait que le corps de Dagon[a].
