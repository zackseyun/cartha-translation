  source_fidelity: La scène, la temporalité, la posture de Dagon, l’arche de Yahweh et la mutilation sont rendues avec fidélité. La dernière proposition hébraïque demeure idiomatique et syntaxiquement difficile ; « corps » est une explicitation contextuelle recevable, à condition que la note conserve clairement l’ambiguïté.
