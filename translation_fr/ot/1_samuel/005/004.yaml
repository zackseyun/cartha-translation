  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: fr
  text: Le lendemain, ils se levèrent de bon matin, et voici que Dagon était tombé face contre terre devant l’arche de Yahweh. La tête de Dagon et les paumes de ses deux mains, tranchées, gisaient sur le seuil ; il ne restait que le corps de Dagon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « seul Dagon restait sur lui ». La formule hébraïque est difficile, notamment quant à la valeur du pronom. Dans ce contexte, elle est généralement comprise comme indiquant que seul le corps de l’idole subsistait après que sa tête et ses mains eurent été tranchées.'
    reason: Conserve l’ambiguïté de l’hébreu tout en expliquant l’explicitation contextuelle « le corps de Dagon ».
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: Le lendemain, ils se levèrent de bon matin
  rationale: Rend à la fois l’idée de se lever tôt et celle du matin suivant, dans un ordre naturel en français narratif.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Conserve l’effet de découverte soudaine et de surprise du marqueur hébreu.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: était tombé face contre terre
  rationale: Décrit l’état constaté au moment de la découverte. « Face contre terre » exprime la posture d’abaissement indiquée par le contexte.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: devant l’arche de Yahweh
  rationale: Traduction spatiale directe, avec transcription du nom divin.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: les paumes de ses deux mains
  rationale: Préserve la précision de כַּפּוֹת, qui désigne les paumes, ainsi que le nombre deux.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: tranchées, gisaient sur le seuil
  rationale: « Tranchées » rend l’état résultant de la mutilation ; « gisaient » explicite naturellement en français la position des parties coupées au seuil sans attribuer d’agent.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: seul le corps de Dagon lui était resté
  rationale: Le contexte indique que, la tête et les mains ayant été retranchées, il ne restait que le corps de l’idole. La note signale que « corps » est une explicitation d’une formule hébraïque difficile.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve ici le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée symbolique de la chute de Dagon
  choice: Description factuelle sans commentaire théologique ajouté
  alternative: Expliciter dans le verset la soumission ou la défaite de Dagon
  rationale: La posture devant l’arche et la mutilation parlent d’elles-mêmes ; la traduction ne doit pas ajouter une interprétation absente de la formulation hébraïque.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme narratif demeure vif grâce à « et voici que ». « Face contre terre » et « gisaient sur le seuil » donnent une image claire et naturelle. Le point-virgule marque nettement la conclusion saisissante de la scène.
