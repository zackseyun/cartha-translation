source:
  edition: WLC
  text: עַל כֵּ֡ן לֹֽא יִדְרְכוּ֩ כֹהֲנֵ֨י דָג֜וֹן וְ/כָֽל הַ/בָּאִ֧ים בֵּית דָּג֛וֹן עַל מִפְתַּ֥ן דָּג֖וֹן בְּ/אַשְׁדּ֑וֹד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: fr
  text: C’est pourquoi, jusqu’à ce jour, les prêtres de Dagon et tous ceux qui entrent dans le temple de Dagon à Ashdod ne posent pas le pied sur le seuil de Dagon[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « ne foulent pas le seuil de Dagon ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la maison de Dagon » ; ici, il s’agit de son sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette expression introduit la conséquence de l’événement précédent et rend naturellement la valeur causale de l’hébreu.
- source_word: לֹא יִדְרְכוּ
  choice: ne posent pas le pied
  rationale: Le verbe דרך signifie « marcher sur, fouler ». Cette tournure française courante convient avec « seuil » et le présent exprime la pratique qui perdure.
- source_word: כֹהֲנֵי דָגוֹן
  choice: les prêtres de Dagon
  rationale: Rendu direct de la construction hébraïque, qui conserve clairement la référence cultuelle.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: et tous ceux qui entrent dans le temple de Dagon
  rationale: Dans ce contexte, « maison de Dagon » désigne son sanctuaire. « Temple » en communique clairement la fonction en français moderne.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: sur le seuil de Dagon
  rationale: מִפְתָּן désigne le seuil. La répétition explicite de « Dagon » respecte le texte source sans préciser davantage le rapport exact entre la divinité et le seuil.
- source_word: בְּאַשְׁדּוֹד
  choice: à Ashdod
  rationale: La préposition marque ici le lieu où se trouve le sanctuaire et où cette coutume est observée.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française naturelle qui exprime la continuité de la pratique jusqu’au présent du narrateur.
