review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est fidèlement rendu : après le déplacement de l’arche, la main de Yahweh agit contre la ville, suscite une panique extrême et frappe ses hommes, sans exclure les plus petits ni les plus grands. « S’abattit sur » interprète de manière recevable l’idiome « la main de Yahweh fut sur la ville ».'
  naturalness: La formulation est globalement claire et d’un registre biblique moderne. Toutefois, « des tumeurs apparurent sur eux » est peu idiomatique en français moderne ; « des tumeurs leur apparurent » conserve l’image d’apparition/éruption tout en étant naturel.
  terminology: « Yahweh », « la main », « panique », « les hommes de la ville » et « tumeurs » conviennent. « Tumeurs » évite à juste titre de trancher l’identification médicale disputée des עפלים. La note doit présenter l’alternative sans renforcer indûment l’idée qu’ils en étaient « couverts ».
  issues:
  - severity: low
    issue: Tournure peu naturelle pour l’affliction corporelle
    rationale: En français, « apparaître sur eux » est un calque maladroit. Le datif « leur apparurent » exprime naturellement que les gonflements se manifestèrent chez les personnes touchées, sans modifier le sens.
  - severity: low
    issue: Alternative de note légèrement surinterprétative
    rationale: « Ils furent couverts de tumeurs » peut suggérer une couverture généralisée que l’hébreu ne précise pas. « Ils eurent des tumeurs » est une alternative plus neutre.
