  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: fr
  text: Après qu’ils l’eurent déplacée, la main de Yahweh s’abattit sur la ville, y provoquant une très grande panique. Il frappa les hommes de la ville, du plus petit au plus grand, et des tumeurs leur apparurent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils eurent des tumeurs ». L’expression hébraïque rare décrit l’apparition ou l’éruption de gonflements corporels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: ils l’eurent déplacée
  rationale: Le hiphil de סבב avec le pronom objet décrit ici le transfert de l’arche. « Déplacer » est naturel en français et le féminin du pronom renvoie clairement à l’arche dans le contexte.
- source_word: יַד יְהוָה
  choice: la main de Yahweh s’abattit sur
  rationale: La métaphore hébraïque de la « main » est conservée, tandis que « s’abattit sur » exprime naturellement son action hostile et judiciaire dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: une très grande panique
  rationale: מְהוּמָה peut désigner la panique, la confusion ou le tumulte. « Une très grande panique » convient au contexte et reproduit l’intensification de l’hébreu.
- source_word: וַיַּךְ
  choice: il frappa
  rationale: Le sujet singulier implicite renvoie à Yahweh. « Frapper » conserve la force concrète du verbe sans employer un terme archaïque.
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: Le substantif hébreu désigne explicitement les hommes; la traduction évite de généraliser en « habitants » ou « population ».
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: du plus petit au plus grand
  rationale: Cette formule exprime toute l’étendue des personnes atteintes tout en laissant ouverte la nuance d’âge, de rang ou de condition.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: des tumeurs apparurent sur eux
  rationale: Le verbe rare et le nom décrivent l’apparition de gonflements corporels. « Tumeurs » reste suffisamment général et n’impose pas l’identification médicale plus précise d’« hémorroïdes ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » le rend comme un nom propre sans le remplacer par un titre.
- issue: Agent du jugement
  choice: Yahweh est le sujet de « il frappa »
  alternative: tournure passive impersonnelle
  rationale: Le verbe singulier prolonge naturellement l’action de la main de Yahweh; la traduction garde cette attribution explicite sans atténuer la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste proche de la progression hébraïque tout en évitant les archaïsmes. La répétition de « ville » et la métaphore de la main divine sont conservées.
