  text: וַ/יִּשְׁלְח֨וּ וַ/יַּאַסְפ֜וּ אֶת כָּל סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּֽאמְרוּ֙ שַׁלְּח֞וּ אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ וְ/יָשֹׁ֣ב לִ/מְקֹמ֔/וֹ וְ/לֹֽא יָמִ֥ית אֹתִ֖/י וְ/אֶת עַמִּ֑/י כִּֽי הָיְתָ֤ה מְהֽוּמַת מָ֨וֶת֙ בְּ/כָל הָ/עִ֔יר כָּבְדָ֥ה מְאֹ֛ד יַ֥ד הָ/אֱלֹהִ֖ים שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: fr
  text: 'Ils envoyèrent donc chercher tous les chefs des Philistins et les rassemblèrent. Ils dirent : « Renvoyez l’arche du Dieu d’Israël ; qu’elle retourne à sa place, afin qu’elle ne me fasse pas mourir, moi et mon peuple[a]. » En effet, une panique mortelle[b] régnait dans toute la ville ; la main de Dieu y pesait très lourdement[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le singulier « moi et mon peuple », bien que les paroles soient introduites par « ils dirent » ; un dirigeant parle peut-être ici au nom de la ville.
    reason: textual_ambiguity
  - marker: b
    text: Ou « une panique de mort », « une confusion mortelle » ou « un tumulte meurtrier ».
    reason: lexical_alternative
  - marker: c
    text: La « main de Dieu » est une image biblique désignant ici son action puissante dans le jugement.
    reason: metaphor_clarification
lexical_decisions:
- source_word: סַרְנֵי
  choice: princes
  rationale: Le terme désigne les dirigeants officiels des cités philistines. « Princes » conserve leur rang politique mieux que le terme plus général « chefs ».
- source_word: שַׁלְּחוּ
  choice: Faites partir
  rationale: L’impératif demande que l’arche soit éloignée de la ville. « Faites partir » exprime naturellement cette idée sans ajouter une destination absente de la proposition.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: l’arche du Dieu d’Israël
  rationale: Cette formulation respecte la construction génitive et indique clairement que l’arche est celle du Dieu d’Israël.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: qu’elle retourne à sa place
  rationale: Le subjonctif français restitue ici la valeur jussive qui suit l’impératif, tout en conservant l’expression « à sa place ».
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: afin qu’elle ne me fasse pas mourir, moi et mon peuple
  rationale: Le causatif de מות est rendu par « faire mourir ». Les suffixes singuliers du texte hébreu sont conservés malgré le pluriel du verbe introducteur.
- source_word: מְהוּמַת מָוֶת
  choice: une panique mortelle
  rationale: L’expression évoque à la fois un bouleversement terrifiant et la mort qu’il entraîne. « Panique mortelle » rend ces deux dimensions en français actuel.
- source_word: בְּכָל הָעִיר
  choice: dans toute la ville
  rationale: Cette formulation française naturelle conserve l’étendue totale exprimée par l’hébreu.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: la main de Dieu y pesait très lourdement
  rationale: La traduction maintient la métaphore biblique de la « main » comme puissance divine agissante, ainsi que l’intensité de מְאֹד.
theological_decisions:
- issue: Conserver ou expliciter la métaphore anthropomorphique de la main de Dieu
  choice: la main de Dieu y pesait très lourdement
  alternative: Dieu frappait très durement ce lieu
  rationale: L’hébreu mentionne explicitement la « main » de Dieu. Conserver cette image maintient les liens avec le langage biblique de l’action et du jugement divins sans imposer une paraphrase interprétative.
- issue: Maintenir le singulier « moi et mon peuple » malgré le pluriel « ils dirent »
  choice: me fasse pas mourir, moi et mon peuple
  alternative: ne nous fasse pas mourir, nous et notre peuple
  rationale: Les suffixes hébreux sont singuliers et peuvent représenter la parole d’un dirigeant parlant au nom de la ville. Les harmoniser au pluriel supprimerait une particularité réelle du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible tout en conservant les images fortes et les irrégularités significatives de l’hébreu.
