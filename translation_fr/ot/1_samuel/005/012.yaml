  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: fr
  text: Les hommes qui ne moururent pas furent frappés de tumeurs[a], et le cri de la ville monta jusqu’au ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de grosseurs ». Le terme hébreu désigne une grosseur ou une tumeur corporelle. Certaines traductions traditionnelles le rendent par « hémorroïdes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Quant aux hommes
  rationale: אֲנָשִׁים désigne ici naturellement les hommes; la tournure « Quant aux » introduit clairement le sort de ceux qui ont survécu sans ajouter d’information.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: qui ne moururent pas
  rationale: La proposition relative distingue directement les survivants de ceux qui étaient morts; le passé simple convient au registre narratif français.
- source_word: הֻכּוּ
  choice: furent frappés
  rationale: Le hofal de נכה est passif. « Furent frappés » conserve l’image vive et l’idiome biblique sans archaïsme.
- source_word: בָעֳפָלִים
  choice: de tumeurs
  rationale: Le terme עפלים désigne des grosseurs ou tumeurs corporelles. « Tumeurs » est clair et évite de préciser indûment une affection particulière.
- source_word: וַתַּעַל
  choice: monta
  rationale: עלה exprime un mouvement ascendant; « monta » restitue naturellement l’image du cri qui s’élève.
- source_word: שַׁוְעַת
  choice: le cri
  rationale: שַׁוְעָה est un cri de détresse ou un appel au secours. « Le cri » demeure concis tout en gardant cette force contextuelle.
- source_word: הָעִיר
  choice: de la ville
  rationale: Le groupe construit שַׁוְעַת הָעִיר signifie littéralement « le cri de la ville », c’est-à-dire son cri collectif.
- source_word: הַשָּׁמָיִם
  choice: jusqu’au ciel
  rationale: Bien que שָׁמַיִם ait une forme plurielle en hébreu, le français emploie naturellement le singulier « ciel » dans cette expression. « Jusqu’au » marque que le cri l’atteint.
