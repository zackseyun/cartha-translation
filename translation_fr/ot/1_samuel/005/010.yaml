base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: fr
  text: 'Ils envoyèrent donc l’arche de Dieu à Éqron. Mais lorsque l’arche de Dieu arriva à Éqron, les Éqronites s’écrièrent : « Ils ont fait venir chez moi l’arche du Dieu d’Israël pour me tuer, moi et mon peuple ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Ils envoyèrent donc
  rationale: Le verbe signifie « envoyer »; « donc » rend l’enchaînement narratif avec le contexte sans surcharger la coordination hébraïque.
- source_word: עֶקְרוֹן
  choice: Éqron
  rationale: Transcription française usuelle du nom de la ville philistine.
- source_word: וַיִּזְעֲקוּ
  choice: poussèrent des cris
  rationale: Rend l’intensité du verbe זעק, qui exprime ici un cri d’alarme et de détresse.
- source_word: הֵסַבּוּ אֵלַי
  choice: Ils ont amené jusqu’à moi
  rationale: Le hiphil de סבב évoque le fait de faire passer ou d’amener l’arche jusqu’à Éqron; le singulier « moi » est conservé conformément au texte massorétique.
- source_word: לַהֲמִיתֵנִי וְאֶת־עַמִּי
  choice: pour me faire mourir, moi et mon peuple
  rationale: Conserve les suffixes singuliers du texte hébreu et exprime naturellement la valeur causative de מות au hiphil.
theological_decisions:
- issue: Référent des formes singulières « moi » et « mon peuple »
  choice: 'Maintien du singulier : « moi et mon peuple »'
  alternative: 'Pluralisation collective : « nous et notre peuple »'
  rationale: Le texte massorétique porte explicitement les suffixes de première personne du singulier (אֵלַי, הֲמִיתֵנִי, עַמִּי). La traduction préserve cette tension grammaticale, même si les Éqronites parlent collectivement.
- issue: Désignation de l’arche
  choice: « l’arche de Dieu » puis « l’arche du Dieu d’Israël »
  alternative: Uniformiser toutes les occurrences
  rationale: La variation du texte source est conservée et ne doit pas être harmonisée théologiquement.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; le discours direct reste vif et naturel. Aucune note n’est nécessaire, car les singuliers inhabituels peuvent être conservés intelligiblement dans le corps du texte.
