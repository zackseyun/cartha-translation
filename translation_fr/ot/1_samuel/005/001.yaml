  text: וּ/פְלִשְׁתִּים֙ לָֽקְח֔וּ אֵ֖ת אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יְבִאֻ֛/הוּ מֵ/אֶ֥בֶן הָעֵ֖זֶר אַשְׁדּֽוֹדָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: fr
  text: Les Philistins avaient pris l’arche de Dieu et l’amenèrent d’Ében-Ézer à Ashdod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Les Philistins
  rationale: Le ו initial assure la continuité narrative, que le français peut laisser implicite ici sans ajouter un marqueur temporel absent de l’hébreu. « Philistins » est la forme française usuelle du nom de ce peuple.
- source_word: לָקְחוּ
  choice: avaient pris
  rationale: 'Le qatal de לקח signifie « prendre ». Le plus-que-parfait convient à la reprise narrative : la prise de l’arche a déjà eu lieu, puis son transfert est raconté.'
- source_word: אֵת
  choice: '[marqueur d’objet direct non traduit]'
  rationale: Le marqueur hébreu de l’objet direct défini n’a pas d’équivalent lexical en français.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Cette construction génitive rend directement l’expression hébraïque et conserve sa désignation théologique sans explicitation supplémentaire.
- source_word: וַיְבִאֻהוּ
  choice: et l’avaient transportée
  rationale: Le hiphil de בוא avec suffixe féminin renvoyant à l’arche signifie qu’ils l’ont fait venir ou amenée. « Transportée » est naturel pour le déplacement de l’arche entre deux lieux et évite la répétition de « avaient » comme auxiliaire autonome, tout en restant dans la portée du verbe.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: d’Ében-Ézer
  rationale: La préposition מִן indique le point de départ. « Ében-Ézer » est une translittération française claire du toponyme אֶבֶן הָעֵזֶר.
- source_word: אַשְׁדּוֹדָה
  choice: à Ashdod
  rationale: Le ה directionnel exprime un mouvement vers Ashdod ; le français le rend naturellement par « à Ashdod ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la reprise rétrospective suggérée par le parfait initial, sans introduire de « Or » ou de « Maintenant » qui n’aurait pas de correspondant temporel explicite dans le texte source.
