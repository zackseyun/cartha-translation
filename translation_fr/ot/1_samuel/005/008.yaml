base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: fr
  text: 'Ils envoyèrent chercher tous les chefs des Philistins et les réunirent auprès d’eux. Ils dirent : « Que ferons-nous de l’arche du Dieu d’Israël ? » Les chefs répondirent : « Que l’arche du Dieu d’Israël soit déplacée à Gath[a]. » Ils déplacèrent donc l’arche du Dieu d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que l’arche du Dieu d’Israël aille à Gath. » Le verbe souligne le déplacement de l’arche, sans préciser exactement comment elle fut transportée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: Ils envoyèrent chercher … et les réunirent
  rationale: Le premier verbe introduit l’envoi de messagers, implicite en hébreu, et le second le rassemblement effectif. Cette formulation est naturelle en français tout en conservant les deux actions.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: les chefs des Philistins
  rationale: סֶרֶן désigne les dirigeants des cités philistines. « Chefs » rend ce titre sans suggérer nécessairement une royauté héréditaire.
- source_word: אֲלֵיהֶם
  choice: auprès d’eux
  rationale: La préposition indique que les chefs furent rassemblés là où se trouvaient ceux qui les convoquaient.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: Que ferons-nous de l’arche
  rationale: L’imparfait hébreu exprime ici une délibération; en français, « Que ferons-nous de… ? » transmet naturellement cette nuance.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la construction hébraïque.
- source_word: גַּת
  choice: Gath
  rationale: Translittération française usuelle du nom de lieu.
- source_word: יִסֹּב / וַיַּסֵּבּוּ
  choice: soit transférée / transférèrent
  rationale: Dans ce contexte, סבב décrit le déplacement de l’arche vers une autre ville; le hifil suivant est causatif. « Transférer » exprime clairement ce mouvement sans préciser un mode de transport absent de l’hébreu.
