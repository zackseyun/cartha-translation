translation_notes:
  register: Français international moderne, narratif et digne. « Chefs » est immédiatement compréhensible et convient au titre des dirigeants philistins. La répétition de « l’arche du Dieu d’Israël » est maintenue conformément à l’insistance du texte hébreu.
