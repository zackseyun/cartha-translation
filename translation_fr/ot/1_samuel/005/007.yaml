base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: fr
  text: 'Quand les hommes d’Ashdod virent que c’était bien le cas, ils dirent : « Le coffre du Dieu d’Israël ne doit pas rester chez nous[a], car sa main pèse lourdement[b] sur nous et sur Dagon, notre dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « demeurer » ou « habiter ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement que sa main « est devenue dure » ou « sévère » contre eux. Cette image exprime une action divine puissante et accablante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Quand … virent
  rationale: Le waw consécutif fait progresser le récit; la tournure temporelle française exprime naturellement le lien avec la déclaration qui suit.
- source_word: אַנְשֵׁי אַשְׁדּוֹד
  choice: les hommes d’Asdod
  rationale: Rend directement le masculin pluriel hébreu, qui désigne les hommes de la ville, éventuellement ses représentants.
- source_word: כִּי כֵן
  choice: ce qui arrivait
  rationale: L’expression renvoie à la situation constatée dans le contexte précédent. Cette formulation est naturelle en français et évite l’expression raide « qu’il en était ainsi ».
- source_word: לֹא יֵשֵׁב
  choice: ne doit pas rester
  rationale: Le verbe יָשַׁב peut signifier « s’asseoir », « demeurer » ou « rester »; avec le coffre pour sujet, « rester » exprime clairement la présence prolongée, tandis que « ne doit pas » rend la décision catégorique des locuteurs.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: le coffre du Dieu d’Israël
  rationale: « Coffre » rend concrètement אֲרוֹן en français courant, tout en conservant la désignation formelle du Dieu d’Israël et le contraste avec Dagon.
- source_word: עִמָּנוּ
  choice: chez nous
  rationale: Dans ce contexte de localisation, « chez nous » rend naturellement l’idée de rester avec ou parmi les habitants d’Asdod.
- source_word: קָשְׁתָה יָדוֹ
  choice: sa main pèse lourdement
  rationale: Cette formulation conserve l’image anthropomorphique de la main tout en exprimant naturellement en français l’intensité de la pression ou du jugement divin.
- source_word: עָלֵינוּ
  choice: sur nous
  rationale: La préposition עַל est rendue directement; dans ce contexte, le poids de la main fait comprendre son effet hostile sans ajouter explicitement « contre ».
- source_word: וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: et sur Dagon, notre dieu
  rationale: La répétition de « sur » maintient le parallélisme. « Notre dieu » respecte le point de vue des Philistins sans valider la divinité de Dagon.
theological_decisions:
- issue: L’image du jugement divin dans קָשְׁתָה יָדוֹ
  choice: sa main pèse lourdement sur nous
  alternative: il nous traite durement
  rationale: Le texte principal préserve l’image de la « main » divine et la tension narrative d’une action dirigée à la fois vers les habitants d’Asdod et vers Dagon, plutôt que de la réduire à une explication.
- issue: La désignation de Dagon comme « notre dieu »
  choice: conserver les paroles des Philistins sans qualification dans le texte principal
  alternative: notre idole
  rationale: L’hébreu rapporte le point de vue des locuteurs. Remplacer « dieu » par « idole » introduirait un jugement polémique absent de leur formulation.
translation_notes:
  register: Français international moderne, naturel et digne. « Coffre » est préféré à « arche », dont le sens courant en français évoque surtout un grand bateau; la note conserve l’ambiguïté du verbe « rester/demeurer », et le texte maintient l’image théologique de la main divine.
