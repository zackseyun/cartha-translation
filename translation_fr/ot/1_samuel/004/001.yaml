id: 1SA.4.1
reference: 1 Samuel 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: fr
  text: La parole de Samuel parvint à tout Israël[a]. Israël partit alors affronter les Philistins au combat. Les Israélites établirent leur camp à Ében-Ézer[b], tandis que les Philistins campèrent à Afek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La nouvelle concernant Samuel se répandit dans tout Israël. » L’hébreu peut désigner la parole ou le message de Samuel et, dans ce contexte, renvoie probablement à sa parole prophétique.'
    reason: alternative_reading
  - marker: b
    text: Ében-Ézer signifie « pierre du secours ». L’expression sert ici de nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: La parole de Samuel parvint à tout Israël
  rationale: « Parvint à » rend naturellement la tournure hébraïque tout en conservant « parole », qui maintient le lien avec la parole prophétique de Samuel dans le contexte précédent.
- source_word: וַיֵּצֵא יִשְׂרָאֵל לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: Israël partit alors affronter les Philistins au combat
  rationale: « Partit » rend יצא sans surcharger le mouvement d'une nuance militaire absente du verbe lui-même; « affronter » exprime naturellement en français la rencontre hostile indiquée par le contexte et לַמִּלְחָמָה.
- source_word: וַיַּחֲנוּ
  choice: Les Israélites établirent leur camp
  rationale: Le sujet grammatical est Israël, mais le pluriel du verbe renvoie aux membres du peuple; l'explicitation évite en français une discordance maladroite entre le collectif singulier et le pronom pluriel.
- source_word: עַל הָאֶבֶן הָעֵזֶר
  choice: à Ében-Ézer
  rationale: La locution, littéralement « la pierre du secours », fonctionne ici comme un nom de lieu; une translittération française accompagnée d'une note préserve les deux dimensions.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: tandis que les Philistins campèrent à Afek
  rationale: « Tandis que » présente naturellement les deux camps en parallèle; « Afek » translittère le nom de lieu selon une forme adaptée au français.
theological_decisions:
- issue: 'Sens de דְבַר שְׁמוּאֵל : parole prophétique ou nouvelle/réputation concernant Samuel'
  choice: la parole de Samuel
  alternative: la nouvelle concernant Samuel
  rationale: La formulation conserve l'ambiguïté lexicale fondamentale tout en privilégiant, à la lumière de 1 Samuel 3, le lien littéraire avec la parole prophétique transmise par Samuel. La note signale l'autre compréhension possible sans la faire disparaître.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; « parvint » reste courant et précis. Les noms propres sont adaptés à l'usage français, sans archaïsmes inutiles.
