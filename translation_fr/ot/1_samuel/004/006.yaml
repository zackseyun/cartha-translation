base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: fr
  text: 'Quand les Philistins entendirent le bruit des acclamations[a], ils dirent : « Que signifie ce grand bruit d’acclamations dans le camp des Hébreux ? » Puis ils apprirent que l’arche de Yahweh était arrivée dans le camp.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des cris », « de la clameur » ou, dans un contexte militaire, « du cri de guerre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: bruit
  rationale: Dans les deux occurrences, le mot désigne le phénomène sonore produit par la clameur, et non une voix articulée. « Bruit » est naturel dans la question française.
- source_word: תְּרוּעָה
  choice: acclamations
  rationale: Le terme peut désigner des cris retentissants, une clameur ou un cri de guerre. Le contexte immédiat (v. 5) décrit la réaction enthousiaste d’Israël à l’arrivée de l’arche ; « acclamations » exprime cette joie sans en faire explicitement un signal militaire.
- source_word: מֶה
  choice: Que signifie
  rationale: L’interrogatif porte ici sur la nature ou la raison de cette clameur. « Que signifie ce grand bruit… ? » rend naturellement la question en français moderne.
- source_word: הַגְּדוֹלָה
  choice: grand
  rationale: Ce choix conserve le sens littéral de l’adjectif tout en évoquant l’ampleur du bruit ; « fort » serait une explicitation contextuelle possible.
- source_word: מַחֲנֶה
  choice: camp
  rationale: Le mot désigne le camp militaire dans les deux occurrences ; « camp » est la formulation française courante et concise.
- source_word: הָעִבְרִים
  choice: les Hébreux
  rationale: L’ethnonyme employé par les Philistins est conservé au lieu d’être normalisé en « Israélites », afin de respecter leur point de vue.
- source_word: וַיֵּדְעוּ
  choice: Puis ils apprirent
  rationale: Dans la progression narrative, le verbe indique l’acquisition d’une information nouvelle. « Ils apprirent » rend cette valeur naturellement, tandis que « ils surent » reste une possibilité plus formelle.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: « Arche » est le terme biblique français établi pour אֲרוֹן, et « Yahweh » représente directement le nom divin יהוה conformément à la décision théologique fournie.
- source_word: בָּא
  choice: était arrivée
  rationale: Le procès est achevé au moment où les Philistins l’apprennent. Le plus-que-parfait français marque clairement cette antériorité.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom propre et suit la décision théologique actualisée fournie, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « bruit » et d’« acclamations » reflète celle de l’hébreu. Les guillemets français et l’espace insécable avant le point d’interrogation relèvent de la typographie française.
