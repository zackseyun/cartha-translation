    issue: Temps de « qui arrive »
    rationale: Dans ce contexte narratif, le participe הַבָּא identifie l’homme déjà arrivé auprès d’Éli. Un passé composé français (« qui suis venu ») rend cette valeur de manière plus naturelle sans perdre la fonction identificatrice.
  - severity: low
    issue: Ajout de « même » dans « aujourd’hui même »
    rationale: הַיּוֹם signifie « aujourd’hui / ce jour-là » ; il ne porte pas en lui-même l’insistance ajoutée par « même ».
  - severity: low
    issue: Définition de la note
    rationale: מַעֲרָכָה désigne plus précisément un ordre, une formation ou un dispositif de combat ; « une armée disposée » peut déplacer légèrement le sens vers le personnel militaire plutôt que la formation.
