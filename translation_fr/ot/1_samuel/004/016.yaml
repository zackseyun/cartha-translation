base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: fr
  text: 'L’homme dit à Éli : « C’est moi qui suis venu de la ligne de bataille[a], et j’ai fui la ligne de bataille aujourd’hui. » Éli demanda : « Que s’est-il passé, mon fils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du combat », « des rangs » ou « du camp » ; le terme hébreu désigne une formation ou un dispositif militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: L’homme
  rationale: Le nom hébreu désigne simplement « l’homme ». Le contexte en fait un porteur de nouvelles, mais le texte n’emploie pas ici le terme spécialisé « messager ».
- source_word: הַבָּא
  choice: qui arrive
  rationale: Le participe substantivé avec אָנֹכִי identifie le locuteur. Le présent « qui arrive » conserve la valeur participiale et convient à quelqu’un qui vient tout juste d’arriver.
- source_word: מִן הַמַּעֲרָכָה
  choice: de la ligne de bataille
  rationale: מַעֲרָכָה évoque une armée rangée en formation, donc la ligne ou les rangs de bataille, plutôt que seulement le combat comme événement.
- source_word: נַסְתִּי
  choice: j’ai fui
  rationale: Le verbe נוּס signifie directement « fuir ». Cette traduction n’ajoute pas l’idée de réussite que pourrait suggérer « je me suis échappé ».
- source_word: הַיּוֹם
  choice: aujourd’hui même
  rationale: « Aujourd’hui » rend le sens temporel ; « même » donne en français naturel l’insistance contextuelle d’une fuite toute récente sans modifier l’information essentielle.
- source_word: מֶה הָיָה הַדָּבָר
  choice: Que s’est-il passé ?
  rationale: Littéralement, la question porte sur « ce qui a eu lieu » ou « l’affaire ». Cette formulation française courante exprime exactement la demande d’Éli.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le suffixe possessif est explicite. Il s’agit ici d’une adresse bienveillante ou courtoise à un homme plus jeune.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « ligne de bataille » est maintenue parce qu’elle reflète celle de l’hébreu. Le changement de sujet du second וַיֹּאמֶר est explicité par « Éli demanda » afin d’éviter une ambiguïté artificielle en français.
