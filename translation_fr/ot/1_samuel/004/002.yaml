base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: fr
  text: Les Philistins se rangèrent en ordre de bataille pour affronter Israël. La bataille s’étendit[a], et Israël fut battu devant les Philistins ; ceux-ci abattirent environ quatre mille hommes dans les rangs, en rase campagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la bataille s’engagea ». Le verbe hébreu peut décrire le début du combat ou son déploiement au cours de l’affrontement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: se rangèrent en ordre de bataille
  rationale: Le verbe ערך, dans ce contexte militaire, désigne la disposition des troupes en vue du combat. Cette formulation est claire et naturelle en français moderne.
- source_word: לִקְרַאת
  choice: pour affronter
  rationale: La préposition associée à קרא exprime ici la rencontre avec l’armée adverse. « Pour affronter » rend naturellement le mouvement hostile déjà établi par le contexte militaire.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: Le combat se déploya
  rationale: 'Cette traduction conserve l’image probable d’un combat qui s’étend ou se déploie, sans exclure l’autre compréhension possible : « le combat s’engagea ».'
- source_word: וַיִּנָּגֶף
  choice: fut battu
  rationale: Au nifal, נָגַף désigne couramment la défaite devant un ennemi. « Fut battu » distingue la défaite d’Israël des pertes humaines précisées ensuite.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » préserve l’expression militaire hébraïque sans la réduire au simple complément d’agent « par ».
- source_word: וַיַּכּוּ
  choice: abattirent
  rationale: Dans ce récit de bataille, נכה indique que les Philistins frappèrent mortellement les hommes mentionnés. « Abattirent » est actuel, sobre et non archaïque.
- source_word: בַמַּעֲרָכָה
  choice: dans les rangs
  rationale: מַעֲרָכָה renvoie ici à la formation ou à la ligne de bataille. « Dans les rangs » restitue ce sens militaire dans un français fluide.
- source_word: בַּשָּׂדֶה
  choice: en rase campagne
  rationale: Le terme signifie littéralement « dans le champ » et situe l’affrontement sur un terrain découvert. « En rase campagne » exprime ce cadre sans le confondre avec les rangs de bataille.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: environ quatre mille hommes
  rationale: La préposition כְּ devant le nombre marque l’approximation. אִישׁ désigne ici les hommes engagés dans le combat.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la progression hébraïque tout en évitant les tournures archaïques. Le démonstratif « ceux-ci » explicite naturellement que le sujet de « abattirent » est constitué par les Philistins.
