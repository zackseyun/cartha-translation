base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: fr
  text: Le peuple envoya à Silo, et ils transportèrent de là le coffre de l’alliance de Yahweh des armées[a], qui siège parmi les chérubins[b]. Les deux fils d’Éli, Hophni et Pinhas, étaient là avec le coffre de l’alliance de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le titre peut désigner les forces célestes aussi bien que les armées.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui siège [les] chérubins ». La formule peut aussi être comprise comme « qui siège au-dessus des chérubins ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: Le peuple envoya donc des hommes à Silo
  rationale: Le complément de « envoya » n’est pas exprimé en hébreu, mais le français exige ici de préciser les personnes envoyées. « des hommes » explicite sobrement l’agent implicite sans en faire des messagers officiels.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: et ils transportèrent de là
  rationale: Le verbe נשׂא exprime ici l’action physique de soulever et porter le coffre. « transportèrent » est naturel en français et garde cette idée mieux que le simple « apportèrent ».
- source_word: אֲרוֹן בְּרִית
  choice: le coffre de l’alliance
  rationale: אֲרוֹן désigne un coffre ou coffret. « coffre de l’alliance » est transparent pour le lecteur moderne et évite que le mot traditionnel « arche » soit confondu avec l’embarcation de Noé.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est transcrit « Yahweh ». צְבָאוֹת signifie littéralement « armées » ou « troupes » et demeure volontairement large, sans décider s’il s’agit exclusivement des armées célestes ou terrestres.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: qui siège au-dessus des chérubins
  rationale: Dans cette formule royale et cultuelle, יֹשֵׁב évoque le fait de siéger comme roi. « au-dessus » correspond à l’image du trône associé au coffre, tout en signalant en note l’ambiguïté spatiale de l’hébreu.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: avec le coffre de l’alliance de Dieu
  rationale: עִם signifie normalement « avec » et indique ici la présence des fils d’Éli auprès du coffre, sans imposer une relation spatiale plus précise.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni et Pinhas
  rationale: Formes françaises usuelles et reconnaissables des deux noms hébreux.
theological_decisions:
- issue: Rendu du nom divin dans יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées
  rationale: Le texte hébreu emploie le nom propre יְהוָה. Le conserver sous la forme « Yahweh » distingue le nom divin d’un titre et ne remplace pas silencieusement le nom par « Seigneur ».
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: des armées célestes
  rationale: Le terme peut évoquer les armées d’Israël, les puissances célestes ou l’ensemble des forces placées sous l’autorité divine. Le rendu non qualifié préserve cette amplitude.
- issue: Formule יֹשֵׁב הַכְּרֻבִים
  choice: qui siège au-dessus des chérubins
  alternative: qui siège parmi les chérubins
  rationale: L’expression présente Yahweh comme roi dans le cadre symbolique du coffre et des chérubins. L’hébreu ne précise toutefois pas explicitement la relation spatiale; la note conserve donc une autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression narrative de l’hébreu. « Coffre » privilégie la compréhension immédiate; les noms propres suivent des formes françaises courantes. Les deux notes sont placées directement après les expressions qu’elles expliquent.
