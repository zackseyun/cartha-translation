id: 1SA.4.13
reference: 1 Samuel 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: fr
  text: Quand il arriva, voici qu’Éli était assis sur son siège au bord de la route[a], guettant, car son cœur tremblait[b] pour l’arche de Dieu. L’homme entra dans la ville pour annoncer la nouvelle, et toute la ville poussa des cris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « à la main / au côté de la route », expression qui signifie « au bord de la route ».
    reason: cultural_note
  - marker: b
    text: Ou « son cœur était inquiet au sujet de l’arche de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Quand il arriva
  rationale: Le waw consécutif fait avancer le récit. « Quand il arriva » relie naturellement l’arrivée du messager à la scène qu’il découvre.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Ce marqueur attire vivement l’attention sur la scène; « voici que » en conserve la force sans employer un archaïsme.
- source_word: יֹשֵׁב עַל הַכִּסֵּא
  choice: était assis sur son siège
  rationale: La construction participiale décrit la posture continue d’Éli. « Siège » reste neutre et proche de כִּסֵּא.
- source_word: יַד דֶּרֶךְ
  choice: au bord de la route
  rationale: L’expression idiomatique désigne le côté de la route. Cette formulation est claire et naturelle en français moderne.
- source_word: מְצַפֶּה
  choice: guettant
  rationale: Le participe exprime une observation attentive et chargée d’attente; « guettant » restitue cette vigilance anxieuse avec concision.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: car son cœur tremblait
  rationale: La formulation conserve l’image concrète du cœur qui tremble et la force émotionnelle de חָרֵד, sans la réduire à une simple inquiétude abstraite.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: pour l’arche de Dieu
  rationale: Avec חָרֵד, עַל désigne l’objet de la crainte ou de la vive préoccupation. « Pour » permet de garder cette nuance en français.
- source_word: וְהָאִישׁ בָּא
  choice: L’homme entra
  rationale: Le nom renvoie au messager déjà mentionné. Dans ce contexte, בוא décrit son arrivée à l’intérieur de la ville; « entra » évite la répétition lourde de « arriva ».
- source_word: לְהַגִּיד
  choice: pour annoncer la nouvelle
  rationale: L’infinitif signifie faire savoir ou annoncer. « La nouvelle » explicite sobrement l’objet sous-entendu par le contexte, à savoir le rapport sur la bataille.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: La préposition ב marque ici le lieu où le messager transmet son rapport.
- source_word: וַתִּזְעַק כָּל הָעִיר
  choice: toute la ville poussa des cris
  rationale: זעק désigne des cris de détresse ou d’alarme. Cette tournure française exprime clairement la réaction collective.
theological_decisions:
- issue: Nature de l’émotion d’Éli envers l’arche
  choice: son cœur tremblait pour l’arche de Dieu
  alternative: son cœur était inquiet au sujet de l’arche de Dieu
  rationale: Le texte peut évoquer aussi bien un tremblement de peur qu’une profonde anxiété. La traduction principale conserve l’image hébraïque, tandis que la note signale la formulation plus abstraite possible.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient la vivacité du récit biblique; « siège », « guettant » et « poussa des cris » restent accessibles sans être familiers. Les appels de notes ont été placés auprès des expressions qu’ils expliquent.
