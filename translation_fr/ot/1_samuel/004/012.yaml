  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: fr
  text: Un homme de Benjamin courut depuis la ligne de bataille et arriva à Silo le jour même, ses vêtements déchirés et de la terre sur sa tête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les vêtements déchirés et la terre sur la tête étaient des signes habituels de deuil, de détresse ou de catastrophe.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: courut
  rationale: Le verbe רוץ indique ici un déplacement rapide. « Courut » en exprime le sens ordinaire sans lui attribuer le motif de la fuite.
- source_word: אִישׁ בִּנְיָמִן
  choice: un homme de Benjamin
  rationale: Cette formulation conserve de près l’identification tribale de l’hébreu tout en restant claire en français moderne.
- source_word: מֵהַמַּעֲרָכָה
  choice: depuis la ligne de bataille
  rationale: מַעֲרָכָה désigne plus précisément les troupes rangées ou la ligne d’engagement que la bataille prise abstraitement.
- source_word: וַיָּבֹא שִׁלֹה
  choice: arriva à Silo
  rationale: « Arriva à Silo » rend naturellement en français le verbe de mouvement בוא suivi de la destination.
- source_word: בַּיּוֹם הַהוּא
  choice: le jour même
  rationale: Littéralement « ce jour-là » ; dans ce récit, « le jour même » exprime naturellement la continuité temporelle et l’immédiateté.
- source_word: וּמַדָּיו קְרֻעִים
  choice: les vêtements déchirés
  rationale: מַדִּים désigne ici les vêtements, et le participe passif de קרע leur état déchiré, signe conventionnel de détresse ou de deuil.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: et de la terre sur la tête
  rationale: אֲדָמָה signifie proprement « terre, sol ». « Terre » préserve cette valeur lexicale sans la remplacer par le terme plus spécifique « poussière ».
