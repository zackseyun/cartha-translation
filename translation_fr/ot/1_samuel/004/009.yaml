source:
  edition: WLC
  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: fr
  text: Soyez forts et montrez-vous des hommes, Philistins, de peur que vous ne deveniez les esclaves des Hébreux, comme ils ont été vos esclaves. Montrez-vous des hommes et combattez !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: Soyez forts
  rationale: L’impératif hitpael pluriel de חזק appelle les combattants à prendre force et courage. « Soyez forts » est direct, naturel et conserve la vigueur de l’exhortation.
- source_word: וִהְיוּ לַאֲנָשִׁים
  choice: montrez-vous des hommes
  rationale: La tournure היה + לַאֲנָשִׁים est une exhortation martiale explicitement genrée. Cette formulation française en préserve l’image et la force rhétorique sans la rendre artificiellement littérale.
- source_word: פְּלִשְׁתִּים
  choice: Philistins
  rationale: Le nom fonctionne ici comme une apostrophe. En français, la juxtaposition après l’exhortation marque naturellement l’adresse directe, sans qu’il soit nécessaire d’ajouter « ô ».
- source_word: פֶּן
  choice: de peur que… ne
  rationale: פֶּן introduit l’issue redoutée. La construction française « de peur que… ne » restitue clairement cet avertissement dans un registre digne et courant.
- source_word: תַּעַבְדוּ לָעִבְרִים
  choice: vous ne deveniez les esclaves des Hébreux
  rationale: Dans ce contexte de défaite militaire et de domination politique, עבד désigne une condition d’asservissement plutôt qu’un service volontaire. « Devenir les esclaves » explicite justement ce statut.
- source_word: לָעִבְרִים
  choice: des Hébreux
  rationale: Le texte porte עִבְרִים, « Hébreux », appellation souvent employée par des étrangers ; il ne convient pas de l’harmoniser avec « Israélites ».
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: comme ils ont été les vôtres
  rationale: Le pronom possessif reprend naturellement « esclaves » et conserve le parallélisme de l’asservissement réciproque sans répétition pesante.
- source_word: וִהְיִיתֶם לַאֲנָשִׁים
  choice: Montrez-vous des hommes
  rationale: La reprise identique conserve la répétition insistante et la force oratoire de l’hébreu.
- source_word: וְנִלְחַמְתֶּם
  choice: et combattez
  rationale: Le parfait avec waw prend ici, dans la chaîne exhortative, une valeur impérative. « Combattez » est direct et adapté au contexte de bataille.
theological_decisions:
- issue: Exhortation genrée לַאֲנָשִׁים
  choice: montrez-vous des hommes
  alternative: soyez courageux
  rationale: L’expression s’adresse à des guerriers philistins et recourt explicitement à l’image des hommes comme modèle de bravoure martiale. Une paraphrase neutre communiquerait l’idée générale, mais effacerait la forme rhétorique marquée du texte.
- issue: Force de עבד dans un contexte de domination militaire
  choice: deveniez les esclaves des Hébreux
  alternative: serviez les Hébreux / soyez soumis aux Hébreux
  rationale: La menace est celle d’une défaite entraînant l’asservissement, non celle d’un service volontaire. « Esclaves » rend explicite la condition de dépendance imposée et maintient le parallèle avec l’ancienne domination des Philistins sur les Hébreux.
translation_notes:
  register: Français international moderne, direct et solennel. L’apostrophe « Philistins » reste naturelle sans l’archaïsant « ô ». La répétition de « Montrez-vous des hommes » est maintenue pour reproduire l’insistance martiale du verset.
