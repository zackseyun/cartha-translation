  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: fr
  text: 'Quand le peuple arriva au camp, les anciens d’Israël dirent : « Pourquoi Yahweh nous a-t-il frappés aujourd’hui devant les Philistins ? Allons chercher à Silo l’arche de l’alliance de Yahweh, afin qu’elle vienne au milieu de nous[a] et nous sauve de la main de nos ennemis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’il vienne au milieu de nous et nous sauve », si les verbes au singulier renvoient plus directement à Yahweh, dont la présence est associée à l’arche.'
    reason: Lecture alternative préservant l’ambiguïté du référent des verbes singuliers.
lexical_decisions:
- source_word: הָעָם
  choice: le peuple
  rationale: Rend le sens habituel du nom hébreu sans préciser excessivement « les troupes » ; le contexte du camp indique déjà qu’il s’agit des combattants israélites.
- source_word: הַמַּחֲנֶה
  choice: le camp
  rationale: Équivalent français courant et naturel dans un contexte militaire.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Désignation traditionnelle et exacte des responsables reconnus du peuple.
- source_word: נְגָפָנוּ
  choice: nous a-t-il frappés
  rationale: Conserve l’image forte du verbe hébreu et l’action attribuée à Yahweh, tout en évoquant la défaite militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: devant les Philistins
  rationale: Préserve la formulation hébraïque, intelligible ici au sens d’une défaite face aux Philistins.
- source_word: נִקְחָה אֵלֵינוּ מִשִּׁלֹה
  choice: Faisons venir de Silo … au milieu de nous
  rationale: Le cohortatif exprime une proposition. « Faisons venir » rend naturellement en français le déplacement depuis Silo vers le camp, tandis que « au milieu de nous » exprime אֵלֵינוּ sans lourdeur.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Reproduit clairement la chaîne construite hébraïque et sa portée liée à l’alliance.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: pour qu’elle vienne parmi nous
  rationale: Le féminin renvoie grammaticalement à « l’arche » en français ; « parmi nous » restitue le sens spatial de בְקִרְבֵּנוּ.
- source_word: וְיֹשִׁעֵנוּ
  choice: et nous sauve
  rationale: Rend directement le hiphil de ישׁע sans réduire le sens à la seule victoire militaire.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: de la main de nos ennemis
  rationale: Conserve l’idiome biblique de la « main » comme image du pouvoir ou de l’emprise.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme ; la transcription « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Référent des verbes singuliers וְיָבֹא et וְיֹשִׁעֵנוּ
  choice: « qu’elle vienne … et nous sauve », en référence grammaticale à l’arche
  alternative: « qu’il vienne … et nous sauve », en référence plus directe à Yahweh
  rationale: L’arche est l’antécédent grammatical immédiat. Le choix principal conserve cette syntaxe et l’attente problématique des anciens sans identifier explicitement l’arche à Dieu ; la note signale l’ambiguïté théologique réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Revint au camp » explicite naturellement le retour depuis le champ de bataille. La syntaxe reste proche de l’hébreu sans calque pesant ; l’idiome « de la main de nos ennemis » est conservé pour sa texture biblique.
