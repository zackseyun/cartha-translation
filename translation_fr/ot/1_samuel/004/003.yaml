    issue: Répétition et déplacement de « au milieu de nous »
    rationale: Le brouillon place « au milieu de nous » après « Faisons venir », puis répète la même idée dans « pour qu’elle vienne parmi nous ». Or le texte hébreu exprime d’abord l’initiative d’apporter l’arche depuis Silo, puis son entrée « au milieu de nous ». La formulation actuelle est redondante et brouille cette articulation.
