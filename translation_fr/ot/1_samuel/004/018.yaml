  verdict: revise
  source_fidelity: 'La séquence narrative, la chute en arrière, la rupture de la nuque, ainsi que « vieux et lourd » rendent fidèlement l’hébreu. La dernière proposition doit toutefois mieux exprimer שָׁפַט אֶת־יִשְׂרָאֵל : « juge en Israël » atténue le complément direct « Israël » et peut faire d’Éli un simple juge situé en Israël.'
  naturalness: Le français est globalement naturel. « Lorsque » est plus direct que « Au moment où » dans ce récit. La relative précisant l’emplacement du siège évite que « à côté de la porte » soit lu uniquement comme le lieu où Éli est tombé.
  terminology: « l’arche de Dieu », « Éli » et « juge d’Israël » sont appropriés au registre biblique moderne. « Lourd » conserve utilement la formulation non interprétative de l’hébreu.
