  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: fr
  text: Lorsque l’homme mentionna l’arche de Dieu, Éli tomba à la renverse de son siège, qui se trouvait à côté de la porte[a]. Sa nuque se brisa, et il mourut, car il était vieux et lourd[b]. Il avait été juge d’Israël pendant quarante ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « près de la porte » ou « sur le côté de la porte ». Elle dit littéralement « à la main de la porte ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « lourd ». Le terme peut laisser entendre que le poids d’Éli, ajouté à son grand âge, a contribué à rendre sa chute mortelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: au moment où l’homme mentionna
  rationale: Le hiphil de זכר signifie ici « mentionner ». Le pronom renvoie au messager du contexte immédiat; « l’homme » clarifie naturellement le changement de sujet sans nommer davantage le personnage.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Rend directement la construction hébraïque et reprend la terminologie biblique française habituelle.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: tomba de son siège à la renverse
  rationale: « À la renverse » exprime naturellement l’adverbe אֲחֹרַנִּית, tandis que « de son siège » rend explicitement le point de départ indiqué par מֵעַל.
- source_word: הַכִּסֵּא
  choice: son siège
  rationale: כִּסֵּא peut désigner un siège, une chaise ou un trône. Ici, « siège » reste neutre et convient à la scène près de la porte.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: à côté de la porte
  rationale: Cette expression locative, littéralement construite avec « main/côté de la porte », indique que le siège se trouvait près de la porte.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: il se brisa la nuque
  rationale: מַפְרֶקֶת désigne la nuque ou le cou. La tournure pronominale française exprime naturellement le résultat de la chute tout en conservant le sens du passif hébreu.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: car il était vieux et lourd
  rationale: « Lourd » conserve le sens concret de כָבֵד sans préciser abusivement s’il était obèse; avec l’âge, ce trait explique la gravité de la chute.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: avait été juge en Israël
  rationale: Le verbe שׁפט décrit ici la fonction exercée par Éli pendant une période achevée. Cette formulation française est plus claire que « juger Israël » et évite de réduire son rôle à des décisions judiciaires ponctuelles.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: Rend directement la durée indiquée par le numéral et le nom.
theological_decisions:
- issue: Sens de אֱלֹהִים dans אֲרוֹן הָאֱלֹהִים
  choice: Dieu
  alternative: les dieux
  rationale: Dans ce récit, l’arche appartient au Dieu d’Israël; le contexte impose donc le singulier « Dieu ».
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité. « Éli », « arche de Dieu » et « juge en Israël » restent familiers au registre biblique sans archaïsme.
