source:
  edition: WLC
  text: וְ/כַלָּת֣/וֹ אֵֽשֶׁת פִּינְחָס֮ הָרָ֣ה לָ/לַת֒ וַ/תִּשְׁמַ֣ע אֶת הַ/שְּׁמֻעָ֔ה אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וּ/מֵ֥ת חָמִ֖י/הָ וְ/אִישָׁ֑/הּ וַ/תִּכְרַ֣ע וַ/תֵּ֔לֶד כִּֽי נֶהֶפְכ֥וּ עָלֶ֖י/הָ צִרֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: fr
  text: Sa belle-fille, la femme de Pinhas, était enceinte et sur le point d’accoucher. Lorsqu’elle apprit que l’arche de Dieu avait été prise et que son beau-père et son mari étaient morts, elle se courba et accoucha, car les douleurs de l’enfantement la saisirent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car ses douleurs se retournèrent sur elle »; cette expression indique que les douleurs de l’accouchement la saisirent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: Sa belle-fille
  rationale: כַּלָּה désigne ici la belle-fille d’Éli. Le possessif maintient le lien avec le contexte précédent; le וְ narratif n’exige pas nécessairement un « et » en tête de phrase en français.
- source_word: אֵשֶׁת פִּינְחָס
  choice: la femme de Pinhas
  rationale: L’apposition hébraïque précise l’identité de la belle-fille; cette formulation la suit de près dans un français naturel.
- source_word: הָרָה לָלַת
  choice: était enceinte et sur le point d’accoucher
  rationale: הָרָה exprime la grossesse et l’infinitif לָלַת l’imminence de l’accouchement.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: Lorsqu’elle apprit
  rationale: שְׁמוּעָה désigne la nouvelle ou l’information reçue. En français, « apprit que » introduit naturellement son contenu sans devoir expliciter « la nouvelle ».
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: que l’arche de Dieu avait été prise
  rationale: Le passif הִלָּקַח indique que l’arche a été prise; le plus-que-parfait situe cet événement avant la réaction de la femme.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: et que son beau-père et son mari étaient morts
  rationale: מֵת peut décrire l’état résultant (« étaient morts ») tout en impliquant leur décès antérieur.
- source_word: וַתִּכְרַע
  choice: elle se courba
  rationale: כרע signifie se courber, s’accroupir ou s’agenouiller. « Se courba » conserve le geste sans préciser au-delà du texte s’il s’agit d’un effondrement ou d’une posture d’accouchement.
- source_word: וַתֵּלֶד
  choice: et accoucha
  rationale: Le qal de ילד, avec une femme pour sujet, signifie naturellement « accoucher ».
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: car les douleurs de l’enfantement la saisirent
  rationale: צִרֶיהָ désigne ici les douleurs de l’accouchement; נֶהֶפְכוּ עָלֶיהָ est une tournure imagée indiquant qu’elles survinrent et s’emparèrent d’elle.
