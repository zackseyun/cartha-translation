lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: l’arche de Dieu
  rationale: Le syntagme construit désigne l’arche appartenant à Dieu. « L’arche de Dieu » suit de près l’hébreu et conserve son caractère solennel.
- source_word: נִלְקָח
  choice: fut prise
  rationale: Le nifal de לקח est passif. Dans ce contexte de défaite militaire, « fut prise » exprime naturellement la capture de l’arche sans alourdir la formulation.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: et les deux fils d’Éli
  rationale: Le contexte identifie les deux fils connus d’Éli ; l’article défini français rend cette détermination avec clarté.
- source_word: מֵתוּ
  choice: moururent
  rationale: Le qal accompli de מות rapporte simplement leur mort. « Moururent » demeure direct et n’ajoute aucune image absente de l’hébreu.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni et Pinhas
  rationale: Les noms sont translittérés selon les conventions françaises courantes, en conservant leur fonction d’apposition après « les deux fils d’Éli ».
