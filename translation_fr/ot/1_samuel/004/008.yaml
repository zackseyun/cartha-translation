  text: א֣וֹי לָ֔/נוּ מִ֣י יַצִּילֵ֔/נוּ מִ/יַּ֛ד הָ/אֱלֹהִ֥ים הָ/אַדִּירִ֖ים הָ/אֵ֑לֶּה אֵ֧לֶּה הֵ֣ם הָ/אֱלֹהִ֗ים הַ/מַּכִּ֧ים אֶת מִצְרַ֛יִם בְּ/כָל מַכָּ֖ה בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: fr
  text: Malheur à nous ! Qui nous délivrera du pouvoir de ces dieux puissants ? Ce sont ces dieux qui ont frappé l’Égypte par tous les fléaux dans le désert[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « ces puissants Dieu(x) ». Les Philistins emploient cependant des formes plurielles, conformément à leur propre compréhension de la divinité d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « dans le désert ». L’expression est difficile dans ce contexte, puisque les fléaux ont frappé l’Égypte avant le séjour d’Israël au désert. La traduction suit le texte massorétique tel qu’il est écrit.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: Malheur à nous !
  rationale: L’expression française conserve la force de l’interjection de détresse et le registre grave de l’hébreu.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: Qui nous délivrera
  rationale: Le hiphil de נצל exprime la délivrance ou le sauvetage. Le futur français restitue naturellement la question désespérée sans ajouter explicitement une modalité absente du texte.
- source_word: מִיַּד
  choice: du pouvoir de
  rationale: Littéralement « de la main de » ; « du pouvoir de » rend clairement en français moderne la métaphore hébraïque de domination.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: ces dieux puissants
  rationale: Les accords pluriels de l’adjectif, du démonstratif et du participe favorisent ici le pluriel, qui reflète aussi la compréhension philistine du Dieu d’Israël. « Puissants » rend naturellement אַדִּירִים.
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: Ce sont ces dieux
  rationale: Cette tournure française garde l’identification emphatique du texte sans reproduire maladroitement sa redondance syntaxique.
- source_word: הַמַּכִּים
  choice: qui ont frappé
  rationale: Le participe désigne ici une action passée connue ; le passé composé convient au récit rapporté en français actuel.
- source_word: אֶת מִצְרַיִם
  choice: l’Égypte
  rationale: Le nom peut désigner collectivement le pays et son peuple ; « l’Égypte » est la formulation habituelle dans le récit des fléaux.
- source_word: בְּכָל מַכָּה
  choice: de toutes sortes de fléaux
  rationale: Littéralement « de tout fléau/coup ». Cette formulation rend la portée globale et évite le français peu naturel « de chaque fléau ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inculte ou désertique. « Désert » est naturel en français moderne, tout en conservant la difficulté contextuelle du texte massorétique.
theological_decisions:
- issue: Sens de אֱלֹהִים dans les paroles des Philistins
  choice: dieux
  alternative: Dieu
  rationale: Bien que le référent soit le Dieu d’Israël, les formes grammaticales plurielles et la perspective polythéiste des locuteurs soutiennent « dieux ». La traduction préserve ainsi la méprise des Philistins au lieu de la corriger théologiquement.
- issue: Localisation difficile בַּמִּדְבָּר
  choice: dans le désert
  alternative: omettre ou réinterpréter la localisation pour l’harmoniser avec le récit de l’Exode
  rationale: Le texte massorétique porte explicitement « dans le désert », malgré la difficulté créée par le fait que les fléaux ont frappé l’Égypte avant le séjour d’Israël au désert. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve l’intensité de la panique philistine. Les pluriels théologiquement tendus et la difficulté historique de la dernière expression sont maintenus, avec des notes explicatives.
