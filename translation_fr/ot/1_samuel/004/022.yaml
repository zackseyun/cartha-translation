  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: fr
  text: 'Elle dit : « La gloire s’est retirée d’Israël[a], car l’arche de Dieu a été prise[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La gloire est partie en exil d’Israël. » Le verbe hébreu peut évoquer un départ en exil ou un éloignement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parce que l’arche de Dieu a été prise. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le waw consécutif fait avancer le récit. En français narratif, « Elle dit » est naturel et fidèle sans exiger un « et » initial.
- source_word: גָּלָה
  choice: s’est retirée
  rationale: Le verbe peut exprimer le départ, l’éloignement ou l’exil. Avec « la gloire » pour sujet, « s’est retirée » rend naturellement l’idée de disparition hors d’Israël tout en laissant la nuance d’exil en note.
- source_word: כָבוֹד
  choice: la gloire
  rationale: Dans ce contexte, le terme évoque l’honneur et la présence manifeste de Dieu associés à Israël. « La gloire » conserve sa portée théologique et le lien avec le nom Ikabod dans le contexte immédiat.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition מן marque ici la séparation ou l’éloignement. « Se retirer d’Israël » est idiomatique en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la déclaration. « Car » convient au registre biblique moderne et peut aussi laisser percevoir le lien explicatif avec la prise de l’arche.
- source_word: נִלְקַח
  choice: a été prise
  rationale: Le niphal de לקח est passif. « A été prise » reste proche de l’hébreu, tandis que « capturée » préciserait davantage que le texte source.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Cette formulation rend directement la construction hébraïque et conserve l’expression biblique familière sans ajout interprétatif.
theological_decisions:
- issue: Sens de « la gloire » par rapport à Israël et à l’arche
  choice: La formulation évoque la perte ou le retrait de la gloire et de la présence manifeste associées à Dieu au milieu d’Israël, sans définir techniquement cette présence.
  alternative: Comprendre « la gloire » uniquement comme l’honneur national d’Israël, ou comme une affirmation directe que Dieu lui-même aurait quitté Israël.
  rationale: Le contexte relie explicitement cette déclaration à la prise de l’arche, ce qui lui confère une portée théologique dépassant la seule honte militaire. Cependant, le verset n’identifie pas simplement Dieu à l’arche et n’expose aucune doctrine métaphysique de sa présence ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le choix « s’est retirée » évite une personnification trop appuyée de la gloire tout en conservant l’idée de départ ; la nuance possible d’exil est signalée en note.
