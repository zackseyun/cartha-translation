  yaml_path: translation/ot/1_samuel/004/015.yaml
  text: Eli was ninety-eight years old[a], and his eyes were fixed so that he could not see.
translation:
  language: fr
  text: Éli avait quatre-vingt-dix-huit ans, et ses yeux étaient figés[a], de sorte qu’il ne pouvait voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étaient fixes » ou « étaient raides » ; l’hébreu décrit l’état de ses yeux d’une manière qui implique la cécité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: avait quatre-vingt-dix-huit ans
  rationale: L’expression hébraïque « fils de quatre-vingt-dix-huit ans » indique naturellement l’âge; la tournure française usuelle est « avait quatre-vingt-dix-huit ans ».
- source_word: וְעֵינָיו
  choice: Ses yeux
  rationale: Traduction directe du nom pluriel accompagné du suffixe possessif de troisième personne masculine.
- source_word: קָמָה
  choice: étaient figés
  rationale: La forme, grammaticalement singulière malgré le sujet pluriel, vient de קום et décrit ici des yeux devenus fixes ou immobiles. « Figés » conserve cette image concrète sans la remplacer par l’interprétation « affaiblis ».
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: et il ne pouvait plus voir
  rationale: Rend directement l’incapacité de voir. « Plus » exprime naturellement en français l’état acquis que suggèrent l’âge et la condition des yeux, sans préciser davantage sa cause.
- source_word: וְ
  choice: absence de connecteur initial explicite
  rationale: Le waw narratif assure la continuité du récit; en français, aucun « Or » ou « Et » initial n’est nécessaire ici.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Deux phrases courtes évitent une coordination lourde et préservent le lien entre l’état des yeux d’Éli et son incapacité à voir.
