  text: וְ/עֵלִ֕י בֶּן תִּשְׁעִ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה וְ/עֵינָ֣י/ו קָ֔מָה וְ/לֹ֥א יָכ֖וֹל לִ/רְאֽוֹת־׃
base_translation:
