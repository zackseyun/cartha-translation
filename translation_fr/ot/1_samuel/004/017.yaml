translation_notes:
  register: 'Français international moderne, clair et digne. Les répétitions de « aussi » rendent le rythme cumulatif du rapport hébreu, tandis que « répondit : » évite le calque pesant « répondit et dit ». Les points-virgules préservent la succession solennelle des quatre annonces.'
