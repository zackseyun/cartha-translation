base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: fr
  text: 'Le messager répondit : « Israël a fui devant les Philistins ; il y a eu aussi un grand massacre parmi le peuple[a] ; tes deux fils, Hofni et Phinéas, sont morts eux aussi ; et l’arche de Dieu a été prise[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il y a eu aussi une grande défaite parmi le peuple ». Le terme hébreu peut désigner un coup sévère, un fléau ou un massacre ; le contexte de la bataille favorise ici « massacre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’arche de Dieu a été capturée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: le messager
  rationale: Le participe désigne celui qui apporte la nouvelle. « Le messager » est naturel dans ce récit et n’ajoute aucune fonction absente de l’hébreu.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 'répondit :'
  rationale: 'Le doublet hébreu « répondit et dit » introduit ici la réponse. En français actuel, « répondit : » en restitue naturellement la fonction sans lourdeur.'
- source_word: נָס יִשְׂרָאֵל
  choice: Israël a fui
  rationale: Le verbe signifie directement « fuir ». Le passé composé convient à l’annonce d’un événement tout juste accompli sans expliciter davantage une déroute.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: devant les Philistins
  rationale: L’expression décrit Israël fuyant face à l’ennemi. « Devant les Philistins » conserve l’image et reste idiomatique en français.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: un grand massacre
  rationale: Le nom peut désigner un coup sévère, un fléau ou des pertes meurtrières. Dans ce contexte militaire, « grand massacre » exprime clairement l’ampleur des morts tout en maintenant une note sur l’autre sens possible.
- source_word: בָעָם
  choice: parmi le peuple
  rationale: L’hébreu dit littéralement « dans/parmi le peuple ». Le contexte vise les combattants israélites, mais « peuple » préserve le terme source.
- source_word: שְׁנֵי בָנֶיךָ
  choice: tes deux fils
  rationale: Rendu direct qui garde l’accent sur les deux fils précisément nommés.
- source_word: מֵתוּ
  choice: sont morts
  rationale: Le parfait présente leur mort comme un fait accompli. « Sont morts » est naturel dans une annonce immédiate en français.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni et Phinéas
  rationale: Ces formes françaises usuelles assurent une translittération reconnaissable des noms hébreux.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Traduction directe et consacrée de l’expression, sans développer la relation exprimée par le complément.
- source_word: נִלְקָחָה
  choice: a été prise
  rationale: Le passif hébreu signifie « a été prise ». Cette formulation conserve le passif et l’ambiguïté lexicale, tandis que « capturée » expliciterait davantage le contexte militaire.
