base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: fr
  text: 'Quand Éli entendit le bruit de la clameur[a], il demanda : « Quel est ce bruit de tumulte ? » L’homme se hâta, arriva et fit son rapport à Éli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des cris » ou « de l’appel au secours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הַצְּעָקָה
  choice: le bruit des cris
  rationale: L’expression désigne le phénomène audible d’une clameur, probablement faite de nombreux cris. Cette formulation est naturelle en français et conserve la force émotionnelle de צְעָקָה.
- source_word: מֶה קוֹל הֶהָמוֹן הַזֶּה
  choice: Que signifie ce tumulte ?
  rationale: Littéralement, la question porte sur ce qu’est le bruit de cette agitation. En français courant, « Que signifie ce tumulte ? » exprime naturellement qu’Éli demande la cause ou la nature du vacarme, sans en préciser davantage.
- source_word: הֶהָמוֹן
  choice: tumulte
  rationale: Dans ce contexte, הָמוֹן évoque une agitation collective et bruyante. « Tumulte » en rend l’intensité dans un registre narratif digne.
- source_word: וְהָאִישׁ
  choice: L’homme
  rationale: L’hébreu dit simplement « l’homme » et renvoie au Benjaminite mentionné auparavant ; « messager » serait une explicitation interprétative.
- source_word: מִהַר וַיָּבֹא
  choice: se dépêcha d’arriver
  rationale: Cette tournure rend les deux éléments du texte, la hâte et l’arrivée, sans le calque peu naturel « se hâta et vint ».
- source_word: וַיַּגֵּד לְעֵלִי
  choice: raconta tout à Éli
  rationale: Le hifil de נגד signifie annoncer ou rapporter. Dans le contexte, « raconta tout » est idiomatique ; « tout » explicite légèrement le contenu du rapport sans en déterminer les détails.
- source_word: עֵלִי
  choice: Éli
  rationale: La graphie française « Éli » facilite la prononciation et suit l’usage biblique français courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite les archaïsmes tout en conservant le contraste entre les cris entendus et le tumulte collectif.
