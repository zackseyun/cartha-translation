  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: fr
  text: Lorsque l’arche de l’alliance de Yahweh entra dans le camp, tout Israël poussa un grand cri, et la terre retentit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la terre trembla ». Le verbe hébreu peut désigner un tumulte sonore ou un tremblement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Lorsque … entra
  rationale: La construction narrative introduit une proposition temporelle. « Lorsque » rend naturellement cette relation, et le passé simple convient au récit soutenu.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Cette formulation conserve explicitement la chaîne construite hébraïque et le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הַמַּחֲנֶה
  choice: le camp
  rationale: Dans ce contexte militaire, « camp » est le terme français courant et précis.
- source_word: וַיָּרִיעוּ כָל יִשְׂרָאֵל תְּרוּעָה גְדוֹלָה
  choice: tout Israël poussa un grand cri
  rationale: « Pousser un cri » exprime naturellement l’action du verbe et son complément de même racine; « grand » préserve l’intensification sans préciser indûment qu’il s’agit d’un cri de guerre.
- source_word: וַתֵּהֹם
  choice: retentit
  rationale: Le verbe peut évoquer un tumulte sonore ou un tremblement. « Retentit » convient à l’effet du cri sur la terre sans imposer l’idée d’un séisme.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: « La terre » est le rendu direct et s’accorde naturellement avec « retentit »; le contexte ne requiert pas le sens géopolitique de « pays ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve ici le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Nature de la réaction de la terre
  choice: la terre retentit
  alternative: la terre trembla
  rationale: L’hébreu permet une nuance de tumulte ou de tremblement. Le texte principal retient l’effet sonore dans le contexte du grand cri, tandis que la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsme; la formulation reste proche de la structure hébraïque tout en étant idiomatique.
