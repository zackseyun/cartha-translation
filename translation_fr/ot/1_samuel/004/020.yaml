  text: וּ/כְ/עֵ֣ת מוּתָ֗/הּ וַ/תְּדַבֵּ֨רְנָה֙ הַ/נִּצָּב֣וֹת עָלֶ֔י/הָ אַל תִּֽירְאִ֖י כִּ֣י בֵ֣ן יָלָ֑דְתְּ וְ/לֹ֥א עָנְתָ֖ה וְ/לֹא שָׁ֥תָה לִבָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: fr
  text: 'Au moment où elle mourait, les femmes qui se tenaient auprès d’elle lui dirent : « N’aie pas peur, car tu as mis au monde un fils. » Mais elle ne répondit pas et ne le prit pas à cœur[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elle n’y appliqua pas son cœur », c’est-à-dire qu’elle ne prêta pas attention à ce qu’elles lui disaient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: Au moment où elle mourait
  rationale: La tournure introduit le moment de sa mort ou de son agonie. Cette formulation française reste proche de l’hébreu tout en indiquant naturellement qu’elle était en train de mourir.
- source_word: וַתְּדַבֵּרְנָה
  choice: lui dirent
  rationale: Le verbe au féminin pluriel rapporte les paroles des femmes présentes. Le pronom « lui » rend explicite en français la personne à qui elles s’adressent, déjà claire dans le contexte hébreu.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: les femmes qui se tenaient auprès d’elle
  rationale: Le participe féminin pluriel avec עַל décrit celles qui se tenaient près d’elle, probablement pour l’assister. La traduction conserve l’image concrète sans préciser davantage leur fonction.
- source_word: אַל תִּירְאִי
  choice: N’aie pas peur
  rationale: Formulation prohibitive courante et naturelle en français moderne, adressée à une femme.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: car tu as mis au monde un fils
  rationale: La proposition donne le motif de l’encouragement. « Mettre au monde » exprime naturellement en français l’acte maternel désigné par ילד.
- source_word: וְלֹא עָנְתָה
  choice: elle ne répondit pas
  rationale: ענה signifie ici répondre aux paroles qui viennent de lui être adressées.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: elle ne le prit pas à cœur
  rationale: Cette expression préserve l’image hébraïque du cœur tout en communiquant qu’elle n’accorda pas son attention ou son intérêt à l’annonce.
