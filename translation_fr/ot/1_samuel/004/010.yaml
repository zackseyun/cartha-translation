base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: fr
  text: 'Les Philistins livrèrent bataille, et Israël fut vaincu. Chacun s’enfuit vers sa tente[a]. Le massacre fut très grand[b] : trente mille fantassins d’Israël tombèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers sa demeure ». L’hébreu dit littéralement « vers sa tente », expression qui peut aussi désigner le lieu où l’on habite.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « La défaite fut extrêmement sévère ». L’hébreu dit littéralement : « Le coup fut très grand. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: Les Philistins livrèrent bataille
  rationale: Le verbe לחם décrit directement l’action militaire. « Livrèrent bataille » est naturel, digne et conserve la progression narrative.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: Israël fut vaincu
  rationale: Dans un contexte militaire, נגף indique qu’Israël subit une défaite. Cette formulation n’anticipe pas la fuite exprimée ensuite.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: Chacun s’enfuit vers sa tente
  rationale: אישׁ a ici une valeur distributive, rendue par « chacun ». « Tente » conserve l’image concrète de l’hébreu, tout en signalant en note son possible sens idiomatique.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: Le massacre fut très grand
  rationale: מכה signifie littéralement un coup ou une frappe, mais désigne ici les pertes meurtrières, comme le confirme le dénombrement qui suit.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: d’Israël tombèrent
  rationale: En contexte de bataille, נפל appliqué à des personnes signifie qu’elles tombèrent au combat, donc moururent. Le français conserve cette expression militaire.
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: trente mille fantassins
  rationale: רגלי désigne les combattants à pied. « Fantassins » est précis et courant en français moderne.
theological_decisions: []
