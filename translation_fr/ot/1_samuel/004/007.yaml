  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: fr
  text: 'Les Philistins eurent peur, car ils dirent : « Dieu est venu dans le camp[a]. » Ils dirent : « Malheur à nous ! Rien de pareil n’était arrivé auparavant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un dieu est venu dans le camp. » Le nom hébreu traduit par « Dieu » a une forme plurielle, mais le verbe qui l’accompagne est au singulier.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: eurent peur
  rationale: Le wayyiqtol de ירא exprime leur réaction immédiate dans le récit. « Eurent peur » est naturel en français et conserve la force émotionnelle.
- source_word: הַפְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française courante de ce peuple.
- source_word: כִּי אָמְרוּ
  choice: car ils se disaient
  rationale: כִּי introduit la raison de leur peur. Dans ce contexte, אָמְרוּ rapporte la pensée ou la parole qui circule parmi eux ; « ils se disaient » rend naturellement cette nuance sans exclure une déclaration prononcée.
- source_word: בָּא אֱלֹהִים
  choice: Dieu est venu
  rationale: Bien que אֱלֹהִים ait une forme morphologiquement plurielle, le verbe בָּא est au singulier, ce qui appuie un référent singulier. L’alternative « un dieu » demeure possible dans la bouche des Philistins et est signalée en note.
- source_word: אֶל הַמַּחֲנֶה
  choice: dans le camp
  rationale: La préposition אֶל marque ici le mouvement vers l’intérieur du camp ; « dans le camp » est l’expression française naturelle après « venir ».
- source_word: אוֹי לָנוּ
  choice: Malheur à nous !
  rationale: Rend avec dignité et vigueur ce cri de détresse devant un désastre redouté.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: Rien de pareil n’était encore jamais arrivé
  rationale: Formulation idiomatique française exprimant qu’un tel événement était sans précédent.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: encore jamais
  rationale: Cette locution hébraïque signifie ici « auparavant », et non seulement « hier ou avant-hier ». La tournure choisie transmet clairement l’idée d’absence de précédent.
theological_decisions:
- issue: Sens de אֱלֹהִים dans les paroles des Philistins
  choice: Dieu
  alternative: un dieu
  rationale: L’accord du verbe singulier בָּא favorise un référent singulier. Le contexte associe leur réaction à l’arrivée de l’arche du Dieu d’Israël, mais leur perspective polythéiste peut permettre la compréhension « un dieu » ; la note préserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. « Malheur à nous ! » conserve la gravité du cri sans archaïsme excessif. La répétition du verbe « dire » est légèrement modulée par « se disaient » puis « dirent » afin de rester naturelle tout en reflétant les deux emplois hébreux.
