  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: fr
  text: 'Elle donna au garçon le nom d’I-Kabod[a], en disant : « La gloire a quitté Israël », parce que l’arche de Dieu avait été prise, et à cause de son beau-père et de son mari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom I-Kabod semble formé d’éléments hébreux pouvant évoquer « pas de gloire » ou, peut-être, « où est la gloire ? ».
    reason: alternative lexicale et ambiguïté étymologique
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: Elle donna au garçon le nom de
  rationale: Dans ce contexte de nomination, קרא avec ל signifie donner un nom. Cette tournure est naturelle et précise en français.
- source_word: אִי כָבוֹד
  choice: Ikabod[a]
  rationale: Le nom propre est translittéré selon une forme française lisible; la note conserve l’incertitude sur sa formation et son sens.
- source_word: גָּלָה
  choice: s’en est allée loin de
  rationale: Le verbe peut évoquer le départ, l’éloignement ou l’exil. Cette formulation française exprime la séparation sans imposer une personnification passive ni effacer la nuance d’éloignement.
- source_word: כָבוֹד
  choice: la gloire
  rationale: « Gloire » garde la portée théologique et narrative du terme, qui peut renvoyer à la présence glorieuse de Dieu comme à l’honneur d’Israël.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: parce que l’arche de Dieu avait été prise
  rationale: Dans ce contexte, אֶל introduit naturellement la cause; la forme passive de לקח est rendue par « avait été prise ».
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: et à cause de son beau-père et de son mari
  rationale: La reprise de אֶל prolonge l’indication des motifs. אִישָׁהּ désigne clairement ici son mari.
theological_decisions:
- issue: Sens de « la gloire » par rapport à Israël
  choice: Conserver l’expression compacte « la gloire » sans préciser son référent.
  alternative: « La gloire de Dieu » ou « l’honneur »
  rationale: Le contexte associe la prise de l’arche à la mort d’Éli et de ses fils. L’hébreu peut ainsi faire résonner à la fois le retrait de la présence glorieuse de Dieu et la perte de l’honneur d’Israël; la traduction ne tranche pas.
- issue: Rapport entre la prise de l’arche et les décès familiaux
  choice: Présenter les deux comme motifs de la déclaration et du nom.
  alternative: Rattacher exclusivement la gloire disparue à la prise de l’arche.
  rationale: La syntaxe répète אֶל devant les événements familiaux et invite à conserver l’ensemble des motifs sans établir une hiérarchie absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Donner le nom de » clarifie l’acte de nomination; « arche de Dieu » maintient la désignation traditionnelle et transparente. La ponctuation rend lisible la parole explicative sans alourdir la phrase.
