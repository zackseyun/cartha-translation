translation:
  language: fr
  text: David envoya des éclaireurs et apprit avec certitude que Saül était arrivé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et apprit que Saül était bel et bien venu ». Le dernier terme hébreu semble exprimer ici la certitude ou la confirmation ; il peut aussi être compris, selon une autre analyse, comme une indication de lieu : « à un endroit déterminé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le verbe שׁלח signifie « envoyer »; le contexte de reconnaissance militaire précise naturellement la mission sans qu'il soit nécessaire d'ajouter un complément.
- source_word: מְרַגְּלִים
  choice: des éclaireurs
  rationale: Le terme désigne des hommes chargés d'explorer ou d'espionner. « Éclaireurs » convient au contexte tactique et reste naturel en français moderne.
- source_word: וַיֵּדַע
  choice: apprit
  rationale: Après l'envoi des éclaireurs, ידע exprime ici l'acquisition d'une information; « apprit » rend naturellement cette progression narrative.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que David apprit.
- source_word: בָא
  choice: était arrivé
  rationale: Le parfait présente la venue de Saül comme un fait accompli antérieur au moment où David en prend connaissance.
- source_word: אֶל נָכוֹן
  choice: bel et bien
  rationale: La tournure obscure est comprise ici comme une confirmation de la réalité de la venue de Saül. « Bel et bien » exprime cette certitude avec naturel; la note conserve l'ambiguïté du texte hébreu.
- source_word: דָּוִד
  choice: David
  rationale: Forme française traditionnelle du nom propre.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle du nom propre, avec tréma pour marquer la séparation des voyelles.
