  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: fr
  text: Yahweh m’en garde[a] ! Je ne porterai pas la main sur l’oint de Yahweh[b]. Maintenant, prends, je te prie, la lance qui est à son chevet ainsi que la cruche d’eau, puis allons-nous-en.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement, selon une construction difficile à reproduire : « Loin de moi, de Yahweh » ou « Loin de moi, par Yahweh ». Il s’agit d’un refus très énergique, à valeur solennelle.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est apparenté au mot « Messie » ; ici, il désigne Saul en tant que roi consacré par Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Yahweh m’en garde
  rationale: Cette formule française actuelle exprime avec force le refus horrifié porté par l’idiome hébreu. Elle intègre naturellement la mention de Yahweh, dont la fonction exacte peut être comprise comme une invocation solennelle ou comme l’origine de l’interdit.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: porter la main
  rationale: « Porter la main sur quelqu’un » est un idiome français naturel qui désigne une action hostile ou violente et correspond bien à l’image hébraïque.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: sur celui qui a reçu l’onction de Yahweh
  rationale: Cette formulation identifie clairement Saul comme le roi consacré par l’onction sans employer ici le titre « Messie », qui risquerait d’introduire une référence messianique plus précise que ne l’exige le contexte.
- source_word: קַח נָא
  choice: prends, je te prie
  rationale: La tournure conserve l’impératif tout en rendant la nuance d’insistance courtoise de נָא dans un registre digne et naturel.
- source_word: אֲשֶׁר מראשתו
  choice: qui est à son chevet
  rationale: Le terme désigne l’endroit près de la tête de Saul pendant son sommeil. « À son chevet » est précis et idiomatique en français.
- source_word: צַפַּחַת הַמַּיִם
  choice: la cruche d’eau
  rationale: « Cruche » désigne naturellement un récipient destiné à contenir de l’eau, sans l’archaïsme de termes plus anciens.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: puis allons-nous-en
  rationale: Le cohortatif propose un départ immédiat. La forme pronominale française rend explicitement l’idée de quitter les lieux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » représente le nom divin propre dans le texte source et suit l’orientation fournie, sans le remplacer par un titre.
- issue: Portée de מָשִׁיחַ dans ce récit royal
  choice: celui qui a reçu l’onction
  alternative: l’oint / le Messie
  rationale: Dans le contexte immédiat, le mot désigne Saul en tant que roi consacré. La traduction retenue préserve le sens de l’onction sans identifier directement Saul au titre eschatologique de « Messie ».
- issue: Fonction de מֵיְהוָה dans la formule de refus
  choice: Yahweh m’en garde
  alternative: Loin de moi, par Yahweh / Loin de moi, de la part de Yahweh
  rationale: La préposition peut porter une force d’invocation solennelle ou associer à Yahweh le caractère inconcevable de l’acte. La formulation principale reste naturelle tout en laissant la note signaler la construction inhabituelle.
translation_notes:
  register: Français international moderne, clair et digne. « Yahweh m’en garde » évite une construction française pesante tout en conservant la vigueur du refus. « Je te prie » maintient la nuance de נָא sans familiarité excessive, et « allons-nous-en » exprime naturellement le départ proposé.
