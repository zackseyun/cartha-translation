  to: Yahweh m’en garde[a] ! Je ne porterai pas la main sur l’oint de Yahweh[b]. Maintenant, prends, je te prie, la lance qui est à son chevet ainsi que la cruche d’eau, puis allons-nous-en.
  rationale: La seule correction consiste à remplacer une explicitation interprétative par « l’oint de Yahweh », équivalent lexical direct et naturel de l’hébreu. La note conserve l’explication contextuelle nécessaire pour éviter d’attribuer au mot, dans ce verset, une portée messianique ultérieure. La note a est légèrement resserrée afin de présenter les possibilités de la préposition sans introduire l’explicitation supplémentaire « de la part de » dans la citation littérale.
