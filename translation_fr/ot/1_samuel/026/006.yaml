base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: fr
  text: 'Alors David prit la parole et dit à Ahimélek le Hittite et à Abishaï, fils de Tserouya et frère de Joab : « Qui descendra avec moi vers Saül, vers le camp[a] ? » Abishaï répondit : « Moi, je descendrai avec toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre, de manière plus idiomatique : « vers Saül, dans le camp ». L’hébreu répète la préposition « vers » devant « Saül » et devant « le camp ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Alors David prit la parole et dit
  rationale: La formule hébraïque associe « répondre » et « dire ». Comme aucune parole immédiatement antérieure n’appelle ici une réponse, « prit la parole et dit » restitue naturellement en français la fonction narrative de la formule sans suggérer une question absente.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: Ahimélek le Hittite
  rationale: Le nom propre est translittéré selon un usage français clair, tandis que le qualificatif ethnique est traduit.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abishaï, fils de Tserouya et frère de Joab
  rationale: Cette formulation conserve les deux liens familiaux exprimés par l’hébreu et les présente sans ambiguïté en français courant.
- source_word: מִי יֵרֵד אִתִּי
  choice: Qui descendra avec moi
  rationale: « Descendre » conserve le mouvement exprimé par ירד et convient au contexte géographique et narratif.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: vers Saül, vers le camp
  rationale: La répétition de « vers » reflète celle de אֶל devant « Saül » et devant « le camp », en maintenant la légère tension syntaxique du texte source.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: Moi, je descendrai avec toi
  rationale: Le pronom indépendant אֲנִי reçoit une valeur emphatique naturelle par « Moi, je », et le même verbe « descendre » est repris comme en hébreu.
