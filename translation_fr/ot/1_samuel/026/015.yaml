  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל אַבְנֵ֜ר הֲ/לוֹא אִ֣ישׁ אַתָּ֗ה וּ/מִ֤י כָמ֨וֹ/ךָ֙ בְּ/יִשְׂרָאֵ֔ל וְ/לָ֨/מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל אֲדֹנֶ֖י/ךָ הַ/מֶּ֑לֶךְ כִּי בָא֙ אַחַ֣ד הָ/עָ֔ם לְ/הַשְׁחִ֖ית אֶת הַ/מֶּ֥לֶךְ אֲדֹנֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: fr
  text: 'David dit à Abner : « N’es-tu pas un homme ? Et qui est comme toi en Israël[a] ? Pourquoi donc n’as-tu pas veillé sur ton seigneur, le roi ? En effet, quelqu’un du peuple[b] est venu pour faire périr le roi, ton seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et qui est ton égal en Israël ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un du peuple », c’est-à-dire une personne venue du camp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: N’es-tu pas un homme ?
  rationale: La traduction conserve le sens littéral de אִישׁ et la forme de la question rhétorique. Le contexte implique qu’Abner est un homme de valeur et de haut rang, mais le texte hébreu n’ajoute aucun adjectif.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: Et qui est comme toi en Israël ?
  rationale: 'Cette formulation préserve directement la comparaison exprimée par כָמוֹךָ ainsi que sa portée rhétorique : Abner est présenté comme sans égal en Israël.'
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: Pourquoi donc n’as-tu pas veillé sur
  rationale: שׁמר désigne ici la vigilance protectrice attendue d’Abner. « Veiller sur » est naturel en français et convient au contexte militaire.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: ton seigneur, le roi
  rationale: « Seigneur » rend la relation hiérarchique exprimée par אֲדֹנֶיךָ, tandis que l’apposition « le roi » identifie Saül sans effacer la formulation hébraïque.
- source_word: כִּי בָא אַחַד הָעָם
  choice: En effet, quelqu’un du peuple est venu
  rationale: כִּי introduit ici la justification du reproche. « Quelqu’un du peuple » rend naturellement l’expression littérale « un du peuple » sans préciser indûment qu’il s’agissait d’un soldat.
- source_word: לְהַשְׁחִית
  choice: pour faire périr
  rationale: Le hifil de שׁחת signifie détruire ou causer la perte. Dans ce contexte où le roi est visé, « faire périr » exprime naturellement l’intention mortelle sans remplacer le verbe par le plus explicite « tuer ».
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: le roi, ton seigneur
  rationale: L’ordre hébreu et la répétition du rapport hiérarchique sont maintenus afin de conserver l’insistance accusatrice de David.
theological_decisions: []
