base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: fr
  text: 'Alors Saül reconnut la voix de David et dit : « Est-ce ta voix, mon fils David ? » David dit : « C’est ma voix, mon seigneur, le roi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: reconnut
  rationale: 'Le verbe נכר exprime ici l’identification par perception : Saül reconnaît la voix de David.'
- source_word: קוֹל
  choice: voix
  rationale: Dans ce dialogue, קוֹל désigne précisément la voix du locuteur plutôt qu’un simple son.
- source_word: הֲקוֹלְךָ זֶה
  choice: Est-ce bien ta voix
  rationale: Cette formulation française naturelle rend la question hébraïque et l’identification de la voix. « Bien » est idiomatique et n’altère pas le sens.
- source_word: בְּנִי
  choice: mon fils
  rationale: La traduction conserve la désignation masculine et la portée relationnelle de l’adresse de Saül, malgré son hostilité envers David.
- source_word: קוֹלִי
  choice: C’est ma voix
  rationale: La réponse hébraïque est littéralement « ma voix ». La copule explicitée donne une phrase française naturelle tout en maintenant la répétition de « voix ».
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: אֲדֹנִי est ici une marque de respect adressée à un homme, et non un titre divin. La formulation conserve à la fois la déférence et le titre royal.
- source_word: דָּוִד / שָׁאוּל
  choice: David / Saül
  rationale: Les noms propres suivent leurs formes françaises bibliques usuelles.
theological_decisions:
- issue: L’adresse relationnelle בְּנִי dans les paroles de Saül
  choice: mon fils
  alternative: mon enfant
  rationale: « Mon fils » préserve le genre du terme, sa valeur relationnelle et la tension narrative créée par cette parole affectueuse dans un contexte d’hostilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme autour de « voix » est conservé, ainsi que la déférence de David envers Saül.
