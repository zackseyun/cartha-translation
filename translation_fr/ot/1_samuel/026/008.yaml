  text: וַ/יֹּ֤אמֶר אֲבִישַׁי֙ אֶל דָּוִ֔ד סִגַּ֨ר אֱלֹהִ֥ים הַ/יּ֛וֹם אֶת אוֹיִבְ/ךָ֖ בְּ/יָדֶ֑/ךָ וְ/עַתָּה֩ אַכֶּ֨/נּוּ נָ֜א בַּ/חֲנִ֤ית וּ/בָ/אָ֨רֶץ֙ פַּ֣עַם אַחַ֔ת וְ/לֹ֥א אֶשְׁנֶ֖ה לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: fr
  text: 'Abishaï dit à David : « Aujourd’hui, Dieu a livré ton ennemi entre tes mains. À présent, laisse-moi, je t’en prie, le clouer à terre avec la lance, d’un seul coup[a] ; je ne le frapperai pas une seconde fois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec la lance et dans la terre, une seule fois » ; Abishaï propose de le transpercer jusqu’au sol d’un seul coup.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: a livré
  rationale: Dans ce contexte militaire, le verbe signifie que l’ennemi a été remis au pouvoir de David. « Livrer » exprime naturellement ce sens sans reprendre l’image littérale, mais opaque ici, d’« enfermer ».
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Cette expression française conserve l’image hébraïque de la main tout en exprimant clairement l’idée d’être au pouvoir de quelqu’un.
- source_word: אַכֶּנּוּ נָא
  choice: permets-moi, je te prie
  rationale: La forme volitive accompagnée de נָא présente l’action comme une demande pressante d’Abishaï, et non comme une simple déclaration.
- source_word: בַּחֲנִית וּבָאָרֶץ
  choice: le clouer à terre avec la lance
  rationale: 'La formulation rend en français naturel l’action décrite : transpercer Saül avec la lance de manière à le fixer au sol.'
- source_word: פַּעַם אַחַת
  choice: d’un seul coup
  rationale: L’expression souligne qu’une seule attaque suffira, ce que confirme la proposition suivante.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: je ne le frapperai pas une seconde fois
  rationale: Le verbe signifie littéralement « recommencer » ou « répéter » ; le verbe « frapper » est repris explicitement en français pour rendre l’ellipse compréhensible.
theological_decisions:
- issue: L’action divine dans la vulnérabilité de Saül
  choice: Dieu a livré ton ennemi entre tes mains
  alternative: Dieu a remis ton ennemi en ton pouvoir
  rationale: La traduction conserve telle quelle l’interprétation providentielle formulée par Abishaï, sans laisser entendre que le récit approuve pour autant son projet de tuer Saül.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct entre Abishaï et David. « Abishaï » suit une translittération française courante du nom hébreu.
