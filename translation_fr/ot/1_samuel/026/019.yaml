  to: 'Et maintenant, que mon seigneur le roi daigne écouter les paroles de son serviteur. Si c’est le SEIGNEUR qui t’a poussé contre moi, qu’il agrée une offrande[a] ! Mais si ce sont des hommes, ils sont maudits devant le SEIGNEUR, car ils m’ont chassé aujourd’hui, m’empêchant d’avoir part à l’héritage du SEIGNEUR[b], en disant : « Va servir d’autres dieux ! »'
