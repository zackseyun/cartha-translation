  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: fr
  text: 'Et maintenant, que mon seigneur le roi daigne écouter les paroles de son serviteur. Si c’est le SEIGNEUR qui t’a poussé contre moi, qu’il agrée une offrande[a] ! Mais si ce sont des hommes, ils sont maudits devant le SEIGNEUR, car ils m’ont chassé aujourd’hui, m’empêchant d’avoir part à l’héritage du SEIGNEUR[b], en disant : « Va servir d’autres dieux ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il sente une offrande », expression signifiant qu’il l’accueille favorablement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « m’empêchant de m’attacher à l’héritage du SEIGNEUR ». L’expression hébraïque peut évoquer l’appartenance au pays et au peuple qui appartiennent au SEIGNEUR.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec le discours précédent et la transition vers l’appel solennel de David.
- source_word: יִשְׁמַע נָא
  choice: que ... daigne écouter
  rationale: Le jussif accompagné de נָא exprime une requête déférente ; « daigne écouter » restitue naturellement le respect dû au roi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Reproduit la formule de cour adressée à Saül sans lui donner de sens divin.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: les paroles de son serviteur
  rationale: Préserve la désignation humble de David à la troisième personne, conforme au style de cour hébreu.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: Si c’est le SEIGNEUR qui t’a poussé contre moi
  rationale: « Poussé » conserve le caractère causatif de הסית sans préciser indûment la nature morale ou métaphysique de l’action.
- source_word: יָרַח מִנְחָה
  choice: qu’il agrée une offrande
  rationale: Rend le sens idiomatique de l’expression littérale « qu’il sente une offrande », à savoir qu’il l’accueille favorablement.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: Mais si ce sont des hommes
  rationale: Marque clairement le contraste entre l’action éventuelle du SEIGNEUR et celle d’agents humains.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: qu’ils soient maudits devant le SEIGNEUR
  rationale: Le français formule naturellement l’imprécation contextuelle au subjonctif, tout en maintenant le cadre judiciaire exprimé par « devant le SEIGNEUR ».
- source_word: גֵרְשׁוּנִי
  choice: ils m’ont chassé
  rationale: Exprime l’expulsion forcée de David hors de son pays et de sa communauté.
- source_word: מֵהִסְתַּפֵּחַ בְּנַחֲלַת יְהוָה
  choice: m’empêchant d’avoir part à l’héritage du SEIGNEUR
  rationale: Communique l’idée d’être attaché ou intégré à la part appartenant au SEIGNEUR, sans réduire celle-ci au seul territoire.
- source_word: לֵאמֹר
  choice: comme s’ils disaient
  rationale: Dans le contexte, les actes des adversaires ont cet effet implicite ; cette formulation évite d’affirmer qu’ils ont nécessairement prononcé ces mots.
theological_decisions:
- issue: Le SEIGNEUR aurait poussé Saül contre David
  choice: Maintenir l’affirmation conditionnelle d’une possible causalité divine
  alternative: L’interpréter explicitement soit comme une incitation directe, soit comme une simple permission providentielle
  rationale: L’hébreu ne définit pas le rapport entre causalité divine et responsabilité humaine ; la traduction conserve cette tension.
- issue: L’exclusion de « l’héritage du SEIGNEUR »
  choice: Conserver l’image large de la participation à l’héritage du SEIGNEUR
  alternative: Limiter le sens au territoire physique ou au seul accès au culte
  rationale: L’expression peut englober le pays, le peuple de l’alliance et la possibilité d’adorer le SEIGNEUR parmi eux.
- issue: La malédiction des agents humains
  choice: Formuler « qu’ils soient maudits » comme une imprécation contextuelle
  alternative: Employer la déclaration « ils sont maudits »
  rationale: La construction hébraïque est formellement nominale et peut se traduire comme une déclaration, mais dans l’opposition conditionnelle et l’appel de David, le français idiomatique favorise ici la force imprécatoire ; l’alternative est signalée en note.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La déférence de David est rendue par « daigne écouter » ; le tétragramme est traduit par « le SEIGNEUR ». Les images théologiques d’« offrande » et d’« héritage » sont conservées, avec des notes pour les idiomes ou ambiguïtés lexicales.
