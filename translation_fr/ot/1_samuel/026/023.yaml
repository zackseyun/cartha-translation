  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: fr
  text: Yahweh rendra à chacun selon sa justice et sa fidélité[a], puisque Yahweh t’a livré aujourd’hui entre mes mains, mais je n’ai pas voulu porter la main contre l’oint de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendra à chaque homme sa justice et sa fidélité ».'
    reason: Alternative lexicale qui préserve plus littéralement la construction hébraïque.
  - marker: b
    text: C’est-à-dire le roi auquel Yahweh a conféré l’onction.
    reason: Note culturelle précisant le sens historique du titre appliqué à Saül.
lexical_decisions:
- source_word: וַיהוָה יָשִׁיב לָאִישׁ
  choice: Yahweh récompensera chaque homme
  rationale: Le hiphil de שׁוב exprime ici le retour donné en rétribution. « Récompensera » est naturel en français et convient au contexte moral, tandis que « chaque homme » conserve le masculin singulier générique de אִישׁ.
- source_word: אֶת צִדְקָתוֹ וְאֶת אֱמֻנָתוֹ
  choice: pour sa justice et sa fidélité
  rationale: צְדָקָה désigne ici la droiture manifestée par la conduite, et אֱמוּנָה la loyauté ou fidélité. La préposition « pour » explicite idiomatiquement en français le rapport entre la conduite et la rétribution sans en changer le sens.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: puisque Yahweh t’a livré aujourd’hui entre mes mains
  rationale: La proposition relative explique l’occasion où David a manifesté sa droiture et sa fidélité. « Entre mes mains » rend l’image hébraïque de la main comme pouvoir, avec le possessif déduit du contexte à la première personne.
- source_word: וְלֹא אָבִיתִי
  choice: mais je n’ai pas voulu
  rationale: אבה porte sur la volonté ou le refus. « N’ai pas voulu » en garde la nuance, et « mais » exprime le contraste entre l’occasion offerte et la retenue de David.
- source_word: לִשְׁלֹחַ יָדִי
  choice: porter la main
  rationale: Cette expression française naturelle conserve l’image de la main tout en communiquant l’idée d’agir avec violence contre quelqu’un.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: sur l’oint de Yahweh
  rationale: מָשִׁיחַ signifie « oint » et désigne ici Saül en sa qualité de roi consacré par Yahweh. « Oint » préserve le titre historique sans introduire directement le titre messianique ultérieur.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Masculin générique אִישׁ
  choice: chaque homme
  alternative: chacun
  rationale: Le choix conserve le masculin singulier représentatif de l’hébreu, tout en restant compréhensible comme une maxime générale.
- issue: Sens de מְשִׁיחַ appliqué à Saül
  choice: l’oint de Yahweh
  alternative: le Messie de Yahweh
  rationale: Dans ce récit, le terme désigne le roi ayant reçu l’onction de Yahweh. « Messie » risquerait d’imposer ici une spécificité christologique que le contexte immédiat ne demande pas.
- issue: Rapport entre la rétribution et les qualités morales
  choice: récompensera chaque homme pour sa justice et sa fidélité
  alternative: rendra à chaque homme sa justice et sa fidélité
  rationale: Le verbe peut décrire soit une récompense correspondant à la conduite, soit le fait de rendre à chacun ses propres qualités. Le texte principal donne le sens contextuel le plus naturel, tandis que la note conserve la formulation plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde les images bibliques naturelles en français (« entre mes mains », « porter la main ») et emploie « l’oint » comme titre royal précis. Les deux occurrences du nom divin sont rendues uniformément par « Yahweh ».
