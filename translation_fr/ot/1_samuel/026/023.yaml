  source_fidelity: 'Le sens fondamental est bien rendu : Yahweh est sujet de la rétribution, celle-ci correspond à la justice et à la fidélité de chacun, et David refuse d’agir contre l’oint de Yahweh. Toutefois, « récompensera ... pour » restreint légèrement le verbe hébreu יָשִׁיב à l’idée positive de récompense et rend moins directement la correspondance entre la rétribution et la conduite. « Rendra à chacun selon » est plus fidèle et idiomatique.'
  naturalness: Le français est globalement moderne et clair. « Porter la main contre » est plus explicite que « porter la main sur » pour l’hostilité visée par l’hébreu, tout en gardant l’image biblique.
