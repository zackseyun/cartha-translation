base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: fr
  text: 'Alors Saül dit à David : « Tu es béni, mon fils David. Tu agiras assurément et tu l’emporteras assurément.[a] » Puis David partit de son côté, et Saül retourna à sa place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faisant, tu feras, et pouvant, tu pourras ». Ces deux constructions hébraïques renforcent la certitude de l’action et de la réussite futures de David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: Béni sois-tu
  rationale: Cette formule française de bénédiction adressée directement à David conserve la force de l’expression participiale hébraïque sans la réduire à une simple description.
- source_word: בְּנִי דָוִד
  choice: mon fils David
  rationale: Conserve sans l’atténuer l’appellation familiale ou patronale employée par Saül.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: Oui, tu agiras avec succès
  rationale: L’infinitif absolu suivi de l’imparfait renforce la certitude de l’action. « Agir avec succès » rend le sens contextuel sans ajouter les « grandes choses » absentes de l’hébreu.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: et tu l’emporteras certainement
  rationale: La seconde construction intensive signifie littéralement que David sera pleinement capable; dans le contexte, elle annonce qu’il réussira ou prévaudra.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: Puis David poursuivit son chemin
  rationale: Expression française naturelle pour le départ de David, tout en conservant l’image du chemin.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: tandis que Saül retourna chez lui
  rationale: « Chez lui » rend naturellement « à son lieu » dans ce récit de séparation, sans préciser qu’il s’agit nécessairement de sa résidence permanente.
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. Les deux constructions hébraïques intensives sont rendues avec fluidité, tandis que la note conserve leur forme littérale. Le parallélisme et la tension entre la bénédiction de Saül et la séparation finale sont maintenus.
