  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: fr
  text: 'Il dit : « Pourquoi mon seigneur poursuit-il ainsi son serviteur[a] ? Car qu’ai-je fait, et quel mal y a-t-il dans ma main[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « son serviteur ». Certaines traductions mettent « ton serviteur » pour rendre l’adresse directe plus naturelle, mais le texte massorétique emploie la troisième personne.
    reason: alternative_reading
  - marker: b
    text: « Dans ma main » est une expression hébraïque qui peut évoquer la culpabilité, l’intention ou le pouvoir de faire du mal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol introduit ici la prise de parole dans le récit. « Il dit » est naturel en français et n’ajoute pas de précision temporelle absente de l’hébreu.
- source_word: לָמָּה זֶּה
  choice: Pourquoi… ainsi
  rationale: Cette tournure interrogative possède une nuance emphatique, « pourquoi cela ? » ou « pourquoi de cette manière ? ». « Pourquoi… ainsi » la restitue dans un français fluide.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: David s’adresse respectueusement à Saül, son supérieur humain. La minuscule distingue ce titre de l’appellation divine.
- source_word: רֹדֵף אַחֲרֵי
  choice: poursuit
  rationale: Le participe avec la préposition décrit une poursuite active. « Poursuit » conserve ce sens sans ajouter la nuance plus interprétative de « persécute ».
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Le texte massorétique porte un suffixe de troisième personne du masculin singulier, littéralement « son serviteur ». Cette forme est conservée malgré son caractère inhabituel dans une adresse directe.
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Qu’ai-je donc fait
  rationale: כִּי introduit ici la justification de la question précédente. En français, « donc » relie naturellement les deux interrogations sans imposer un lien causal trop rigide.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: et quel mal y a-t-il dans ma main
  rationale: La formulation garde l’image hébraïque de la main comme siège de la responsabilité, de la capacité ou des moyens d’agir, tout en employant « mal » pour la portée forte et générale de רָעָה.
theological_decisions:
- issue: Personne grammaticale dans עַבְדּוֹ
  choice: Conserver « son serviteur » dans le texte principal
  alternative: Lire « ton serviteur » pour harmoniser avec l’adresse directe à Saül
  rationale: La troisième personne est la forme attestée par le texte massorétique. La conserver respecte l’ambiguïté textuelle et le registre déférent sans corriger silencieusement le texte.
translation_notes:
  register: Français international actuel, digne et accessible. L’inversion interrogative maintient le ton respectueux de l’adresse à Saül. L’image concrète « dans ma main » est conservée et expliquée en note.
