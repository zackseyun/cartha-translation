source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: fr
  text: 'Les Ziphites vinrent trouver Saül à Guibéa et lui dirent : « David ne se cache-t-il pas sur la colline de Hakila, face à la région désertique[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « face au Yeshimon ». Le terme hébreu peut désigner une région désertique ou être compris comme le nom géographique Yeshimon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent trouver
  rationale: Le wayyiqtol fait progresser le récit. « Vinrent trouver » exprime naturellement en français le déplacement vers Saül sans alourdir la phrase.
- source_word: הַזִּפִים
  choice: les Ziphites
  rationale: Le pluriel gentilique désigne les habitants de Ziph ; « Ziphites » conserve clairement leur identité géographique.
- source_word: הַגִּבְעָתָה
  choice: à Guibéa
  rationale: Le hé directionnel indique un mouvement vers Guibéa. Avec « vinrent trouver Saül », « à Guibéa » situe idiomatiquement le lieu où ils le rejoignent.
- source_word: לֵאמֹר
  choice: et lui dirent
  rationale: L’infinitif introduit le discours direct. Cette tournure est plus naturelle en français narratif que le calque « en disant ».
- source_word: הֲלוֹא
  choice: ne… pas
  rationale: La particule introduit une question rhétorique qui appelle une confirmation ; la forme « ne se cache-t-il pas » en conserve la force.
- source_word: מִסְתַּתֵּר
  choice: se cache
  rationale: Le participe hitpael de סתר présente David comme se tenant caché. Le présent français convient au signalement d’une situation en cours.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: sur la colline de Hakila
  rationale: גִּבְעָה désigne ordinairement une colline, et la préposition בְּ reçoit ici naturellement le sens topographique « sur ».
- source_word: עַל־פְּנֵי הַיְשִׁימֹן
  choice: face à la région désertique
  rationale: « Face à » préserve la relation spatiale de עַל־פְּנֵי sans imposer la précision interprétative « à l’est de ». « Région désertique » rend le sens commun possible de הַיְשִׁימֹן, tandis que la note conserve son interprétation comme nom régional.
