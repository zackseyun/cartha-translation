base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: fr
  text: 'David dit : « Aussi vrai que Yahweh est vivant, Yahweh le frappera certainement, ou bien son jour viendra et il mourra, ou bien il descendra au combat et y périra. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Formule française naturelle de serment solennel, qui conserve l’affirmation hébraïque fondée sur la vie de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כִּי אִם
  choice: Yahweh lui-même
  rationale: Dans cette formule de serment, כִּי אִם introduit avec force ce que David affirme. En français, l’emphase portée par « lui-même » rend naturellement cette valeur sans imposer une relation strictement exceptive.
- source_word: יִגָּפֶנּוּ
  choice: le frappera
  rationale: Le verbe נָגַף désigne ici un coup décisif infligé par Dieu, sans préciser le moyen; « frappera » préserve cette ouverture.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: son jour viendra et il mourra
  rationale: Conserve l’image hébraïque du jour qui vient ainsi que le verbe distinct « mourir », dans une syntaxe française claire.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: il descendra au combat
  rationale: Maintient le verbe concret « descendre », courant dans le langage hébreu des déplacements militaires, tout en restant compréhensible en français.
- source_word: וְנִסְפָּה
  choice: et y périra
  rationale: « Périr » garde la nuance distincte de ספה par rapport au verbe précédent « mourir »; « y » explicite naturellement le lien avec le combat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre; « Yahweh » le conserve et évite de le remplacer par un titre.
- issue: Agent et modalités de la mort de Saül
  choice: 'Trois possibilités laissées ouvertes : Yahweh le frappe, son jour vient et il meurt, ou il périt au combat'
  alternative: Comprendre la première proposition comme englobant ou déterminant explicitement les deux suivantes
  rationale: La construction hébraïque énumère trois issues sans préciser leurs rapports causaux. La traduction conserve cette tension et ne définit ni le moment ni le moyen de l’action divine.
translation_notes:
  register: Français international moderne, digne et accessible. La formule de serment demeure solennelle; la triple structure avec « ou bien » préserve le rythme de l’énumération hébraïque. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
