  source_fidelity: 'La structure ternaire est fidèlement rendue : Yahweh peut le frapper, son jour peut venir et il peut mourir, ou il peut descendre au combat et y périr. « Son jour viendra et il mourra » reflète correctement יוֹמוֹ יָבוֹא וָמֵת, et « périr » maintient utilement une nuance distincte de « mourir ». En revanche, כִּי אִם a ici une force assertive après le serment (« assurément », « certainement »), non une emphase sur l’agent divin.'
