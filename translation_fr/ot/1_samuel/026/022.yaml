base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: fr
  text: 'David répondit : « Voici la lance du roi. Que l’un des jeunes hommes[a] passe[b] et la prenne. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs » ou « assistants » ; le terme hébreu peut désigner de jeunes hommes ou des personnes placées au service de quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Ou « traverse » ; le verbe hébreu signifie littéralement « passer » ou « traverser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: David répondit
  rationale: La double formule hébraïque « répondit et dit » introduit ici la réplique. En français moderne, « répondit » en exprime naturellement la fonction sans lourdeur.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » attire l’attention sur un objet présent et visible, tout en restant naturel et digne en français contemporain.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: la lance du roi
  rationale: חֲנִית désigne une lance ou une arme d’hast comparable. « La lance du roi » restitue directement la relation possessive.
- source_word: וְיַעֲבֹר
  choice: passe de ce côté
  rationale: Le verbe עבר signifie passer ou traverser. Dans la situation, David demande à l’un des hommes de Saül de passer jusqu’à son côté ; cette formulation conserve l’idée de déplacement sans préciser un obstacle absent du texte.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: l’un des jeunes hommes
  rationale: Le numéral אֶחָד est rendu explicitement par « l’un », tandis que נְעָרִים garde son sens courant de « jeunes hommes » sans imposer la nuance de serviteurs ou d’assistants.
- source_word: וְיִקָּחֶהָ
  choice: et la prenne
  rationale: Le verbe לקח signifie couramment « prendre ». Le pronom féminin « la » renvoie clairement à la lance.
theological_decisions: []
translation_notes:
  register: Français moderne international, sobre et narratif. La formule hébraïque redoublée « répondit et dit » est rendue idiomatiquement par « répondit ». Les deux ambiguïtés lexicales pertinentes sont conservées en notes, avec leurs marqueurs placés sur les expressions concernées.
