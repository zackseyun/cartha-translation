source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: fr
  text: Puis David passa de l’autre côté et se tint au sommet de la montagne, à distance ; un grand espace les séparait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passa
  rationale: Le verbe עבר exprime ici le passage d’un côté à l’autre. Avec « de l’autre côté », « passa » est naturel en français et conserve ce mouvement.
- source_word: הָעֵבֶר
  choice: de l’autre côté
  rationale: Le nom désigne le côté opposé ou situé au-delà. Cette formulation est idiomatique et convient à la géographie du récit.
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: Le verbe signifie fondamentalement « se tenir debout » ou « prendre position ». « Se tint » exprime sobrement la position de David sans surinterprétation.
- source_word: עַל רֹאשׁ הָהָר
  choice: au sommet de la montagne
  rationale: Dans cet emploi topographique, רֹאשׁ, littéralement « tête », désigne le sommet. « Montagne » traduit הָהָר sans réduire arbitrairement le relief à une colline.
- source_word: מֵרָחֹק
  choice: à distance
  rationale: L’expression marque un éloignement spatial. « À distance » est clair, actuel et fidèle.
- source_word: רַב הַמָּקוֹם
  choice: un grand espace
  rationale: L’hébreu dit littéralement que « l’espace/le lieu était grand ». La formulation retenue conserve l’image concrète d’un espace important.
- source_word: בֵּינֵיהֶם
  choice: les séparait
  rationale: La préposition indique que cet espace se trouvait entre David et les autres. La tournure verbale est naturelle en français tout en gardant le même rapport spatial.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste proche de la structure hébraïque, tout en évitant une formulation peu naturelle comme « grand était l’espace entre eux ». Aucun enjeu théologique particulier n’est présent dans ce verset.
