base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: fr
  text: David et Abishaï arrivèrent donc de nuit auprès des troupes. Saül était là, couché et endormi au milieu du campement[a], sa lance plantée en terre près de sa tête. Abner et les troupes étaient couchés autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le cercle » : le terme hébreu désigne probablement la formation circulaire du camp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: les troupes
  rationale: Dans ce contexte militaire, le terme désigne les hommes qui composent la force de Saül, et non le peuple en général.
- source_word: לַיְלָה
  choice: de nuit
  rationale: Cette expression française concise rend naturellement l’accusatif adverbial de temps.
- source_word: וְהִנֵּה
  choice: Saül était là
  rationale: La tournure conserve l’effet de découverte visuelle du marqueur narratif hébreu sans recourir au plus archaïque « voici ».
- source_word: שֹׁכֵב יָשֵׁן
  choice: couché et endormi
  rationale: Les deux éléments sont maintenus afin d’exprimer à la fois la posture de Saül et son sommeil.
- source_word: בַּמַּעְגָּל
  choice: au milieu du campement
  rationale: Le mot désigne ici vraisemblablement l’espace protégé ou la formation circulaire du camp; cette formulation est claire en français tout en laissant l’alternative littérale en note.
- source_word: חֲנִיתוֹ
  choice: sa lance
  rationale: « Lance » est le terme militaire français courant qui convient à l’arme de Saül.
- source_word: מְעוּכָה בָאָרֶץ
  choice: plantée en terre
  rationale: Cette expression idiomatique indique que la lance avait été enfoncée et se tenait fixée dans le sol.
- source_word: מְרַאֲשֹׁתָיו
  choice: près de sa tête
  rationale: Le terme hébreu désigne idiomatiquement l’endroit situé à la tête d’une personne couchée.
- source_word: סְבִיבֹתָיו
  choice: autour de lui
  rationale: La formulation rend directement la disposition spatiale d’Abner et des troupes autour de Saül.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple fait avancer le récit, tandis que l’imparfait décrit la scène découverte par David et Abishaï. Le marqueur hébreu de présentation est rendu naturellement par « était là ».
