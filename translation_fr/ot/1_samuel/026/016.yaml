source:
  edition: WLC
  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: fr
  text: 'Ce que tu as fait n’est pas bien. Aussi vrai que Yahweh est vivant, vous méritez la mort[a], puisque vous n’avez pas veillé sur votre seigneur, sur l’oint de Yahweh. Et maintenant, regarde : où sont la lance du roi et la cruche d’eau qui étaient près de sa tête ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « vous êtes des fils de mort », expression signifiant qu’ils sont passibles de mort ou qu’ils méritent de mourir.'
    reason: Conserver la forme de l’idiome hébreu tout en donnant dans le texte son sens naturel en français.
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: Ce que tu as fait n’est pas bien
  rationale: Formulation française naturelle qui conserve l’évaluation sobre de לֹא טוֹב sans la renforcer en « c’est mal » ou « c’est mauvais ».
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Rend clairement la formule hébraïque de serment tout en conservant le nom divin.
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: vous méritez la mort[a]
  rationale: L’expression littérale « fils de mort » est opaque en français moderne ; le rendu exprime sa force judiciaire, tandis que la note conserve sa forme hébraïque.
- source_word: שְׁמַרְתֶּם עַל
  choice: avez veillé sur
  rationale: Dans ce contexte militaire, le verbe désigne la vigilance protectrice attendue des gardes.
- source_word: אֲדֹנֵיכֶם
  choice: votre seigneur
  rationale: Le terme désigne ici Saül en tant que supérieur. La minuscule et le possessif le distinguent nettement de Yahweh.
- source_word: מְשִׁיחַ יְהוָה
  choice: celui que Yahweh a consacré par l’onction
  rationale: Cette formulation explicite le sens royal et cultuel de מָשִׁיחַ sans employer « Messie », qui risquerait d’importer une identification ultérieure dans le contexte immédiat.
- source_word: צַפַּחַת הַמַּיִם
  choice: la cruche d’eau
  rationale: « Cruche » désigne naturellement en français un récipient portatif pour l’eau.
- source_word: מראשתו
  choice: près de sa tête
  rationale: Rend la position de l’objet à l’endroit où reposait la tête de Saül, sans l’expression française potentiellement ambiguë « à son chevet ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre de l’alliance.
- issue: Rendu du titre מְשִׁיחַ יְהוָה
  choice: celui que Yahweh a consacré par l’onction
  alternative: l’oint de Yahweh
  rationale: Le choix conserve l’onction royale de Saül tout en évitant que le français moderne comprenne automatiquement un titre christologique déterminé.
- issue: Force de בְנֵי מָוֶת
  choice: vous méritez la mort
  alternative: vous êtes des fils de mort
  rationale: L’idiome indique que les gardes sont passibles de mort ou dignes de mourir ; il ne décrit pas littéralement leur filiation.
translation_notes:
  register: 'Français international actuel, digne et direct. Le passage du singulier « tu » au pluriel « vous » suit l’hébreu : David s’adresse d’abord à Abner personnellement, puis inclut les hommes chargés de garder Saül.'
