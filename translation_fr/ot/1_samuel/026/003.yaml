  text: וַ/יִּ֨חַן שָׁא֜וּל בְּ/גִבְעַ֣ת הַ/חֲכִילָ֗ה אֲשֶׁ֛ר עַל פְּנֵ֥י הַ/יְשִׁימֹ֖ן עַל הַ/דָּ֑רֶךְ וְ/דָוִד֙ יֹשֵׁ֣ב בַּ/מִּדְבָּ֔ר וַ/יַּ֕רְא כִּ֣י בָ֥א שָׁא֛וּל אַחֲרָ֖י/ו הַ/מִּדְבָּֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: fr
  text: Saül établit son camp sur la colline de Hakila, qui fait face à Yeshimôn[a], près de la route. David, lui, séjournait dans le désert et vit que Saül était venu à sa suite dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeshimôn peut aussi être compris comme un nom commun signifiant « la terre désolée » ou « le désert » plutôt que comme un nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: établit son camp
  rationale: Dans ce contexte militaire et géographique, חנה désigne l’installation d’un camp. Cette formulation est naturelle et concrète en français.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: sur la colline de Hakila
  rationale: גִּבְעָה est traduit par « colline », tandis que חֲכִילָה est conservé comme nom de lieu sous la forme Hakila.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: qui fait face à Yeshimôn
  rationale: עַל־פְּנֵי exprime ici une position en face de ou vis-à-vis de. הַיְשִׁימֹן est traité dans le texte comme un toponyme, sans exclure son sens commun signalé en note.
- source_word: עַל הַדָּרֶךְ
  choice: près de la route
  rationale: La préposition עַל indique ici vraisemblablement la proximité; « près de » évite de suggérer que le camp occupait littéralement la chaussée.
- source_word: יֹשֵׁב
  choice: séjournait
  rationale: Le participe de ישב présente une situation continue. « Séjournait » convient au contexte sans imposer le sens littéral « était assis ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inhabitée ou aride. En français courant, « désert » convient ici sans nécessairement évoquer uniquement une étendue de sable.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: vit que Saül était venu l’y poursuivre
  rationale: אַחֲרָיו signifie littéralement « après lui » et prend ici une nette valeur de poursuite. « Était venu l’y poursuivre » rend à la fois le mouvement exprimé par בוא et son but contextuel.
- source_word: הַמִּדְבָּרָה
  choice: l’y
  rationale: La finale directionnelle indique un mouvement vers le désert. Le pronom adverbial évite une répétition lourde tout en conservant la destination.
theological_decisions: []
