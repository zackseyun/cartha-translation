  rationale: La révision se limite à remplacer « l’y poursuivre » par « à sa suite dans le désert ». Elle évite une explicitation interprétative de la poursuite, rétablit explicitement la destination indiquée par la terminaison directionnelle de הַמִּדְבָּרָה, et conserve le sens narratif du verset.
