  source_fidelity: La dernière proposition du projet (« était venu l’y poursuivre ») explicite indûment un but de poursuite. אַחֲרָיו signifie littéralement « après lui / à sa suite » et suggère certes un déplacement derrière David, sans employer un verbe technique qui impose explicitement « poursuivre ». La formulation révisée conserve cette nuance. Le mouvement directionnel vers le désert est maintenu.
  naturalness: Le français est narratif, clair et de registre moderne. « David, lui » rend naturellement le contraste marqué par וְדָוִד. « Venu à sa suite dans le désert » est plus idiomatique que « venu après lui » tout en évitant de transformer la relation spatiale en affirmation explicite de poursuite.
  terminology: « Saül », « Hakila » et « Yeshimôn » sont cohérents. « Désert » convient à מִדְבָּר dans ce contexte. La note préserve correctement l’alternative entre toponyme et nom commun pour Yeshimôn.
