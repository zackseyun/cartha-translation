  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: fr
  text: Maintenant donc, que mon sang ne tombe pas à terre loin de la présence de Yahweh, car le roi d’Israël s’est mis en route à la recherche d’une seule puce, comme on poursuit une perdrix dans les montagnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּמִי
  choice: mon sang
  rationale: Conserve l’image concrète d’une mort violente et la possible idée de culpabilité liée au sang versé; « ma vie » atténuerait cette force.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: que mon sang ne tombe pas à terre
  rationale: Rend naturellement la tournure prohibitive tout en maintenant l’image hébraïque du sang répandu sur le sol.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: loin de la présence de Yahweh
  rationale: « Présence » traduit idiomatiquement פְּנֵי, tandis que « loin de » conserve la dimension spatiale de מִנֶּגֶד sans produire une expression française artificielle.
- source_word: יָצָא
  choice: s’est mis en route
  rationale: Dans ce contexte, le verbe décrit le roi qui part en expédition; cette expression française est plus naturelle que le calque « est sorti ».
- source_word: לְבַקֵּשׁ
  choice: à la recherche de
  rationale: Garde le sens large de « chercher » et laisse au contexte l’ironie de la poursuite, sans imposer d’emblée « traquer ».
- source_word: פַּרְעֹשׁ אֶחָד
  choice: une seule puce
  rationale: Préserve la métaphore par laquelle David souligne sa petitesse ainsi que l’insistance portée par אֶחָד.
- source_word: הַקֹּרֵא
  choice: une perdrix
  rationale: Identification traditionnelle et lexicographiquement reconnue de cet oiseau dans ce contexte de chasse.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: comme on poursuit une perdrix dans les montagnes
  rationale: Reproduit la comparaison et le décor montagneux, avec une formulation française fluide et proche de la construction verbale hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte le nom divin, non un titre. « Yahweh » le représente directement et évite de le remplacer par une désignation traditionnelle.
- issue: Sens de מִנֶּגֶד פְּנֵי יְהוָה
  choice: loin de la présence de Yahweh
  alternative: loin de la face de Yahweh
  rationale: La formulation retenue préserve l’idée d’éloignement par rapport à Dieu sans décider plus précisément si l’expression vise surtout le pays, le sanctuaire ou la protection divine.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve les images fortes du sang, de la puce et de la perdrix, tout en évitant les calques peu naturels. Aucun marqueur de note n’est employé, puisque les variantes ne sont pas nécessaires à l’intelligence du verset.
