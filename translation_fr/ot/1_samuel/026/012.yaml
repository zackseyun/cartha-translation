source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: fr
  text: 'David prit donc la lance et la cruche d’eau qui se trouvaient près de la tête de Saül[a], puis ils repartirent. Personne ne vit rien, personne ne s’aperçut de rien et personne ne se réveilla, car tous dormaient : un profond sommeil venant de Yahweh était tombé sur eux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne l’endroit où se trouvaient les objets, à la hauteur de la tête de Saül pendant qu’il dormait.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un profond sommeil de Yahweh ». Cette expression indique que ce sommeil venait de l’action de Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: la lance
  rationale: חֲנִית désigne une arme d’hast pouvant être rendue par « lance » ; ce terme est naturel en français et convient au contexte militaire.
- source_word: צַפַּחַת הַמַּיִם
  choice: la cruche d’eau
  rationale: צַפַּחַת désigne un récipient pour l’eau, de type flacon, cruche ou gourde. « Cruche d’eau » reste concret, clair et courant.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: près de la tête de Saül
  rationale: L’expression hébraïque désigne l’endroit situé à la tête de Saül pendant qu’il dort, non sa tête elle-même.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: puis ils repartirent
  rationale: Le pluriel renvoie à David et Abishaï. La tournure indique qu’ils s’éloignent et poursuivent leur chemin ; « repartirent » l’exprime naturellement.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: Personne ne vit rien, personne ne s’aperçut de rien et personne ne se réveilla
  rationale: La triple construction אֵין + participe est conservée par une triple négation. Dans ce contexte, יָדַע exprime la prise de conscience ; « s’aperçut de rien » est plus idiomatique que « ne sut rien ».
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: car tous dormaient
  rationale: Rendu direct et naturel de la proposition explicative, tout en conservant l’état de sommeil en cours.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: un profond sommeil venant de Yahweh
  rationale: תַּרְדֵּמָה désigne un sommeil profond. Le génitif avec le nom divin peut marquer la source ou l’action divine ; « venant de » rend cette relation sans transformer la formulation nominale en causatif explicite.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: était tombé sur eux
  rationale: La métaphore hébraïque de la chute est intelligible en français, et le plus-que-parfait indique que ce sommeil était déjà à l’œuvre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Nature de la relation dans תַּרְדֵּמַת יְהוָה
  choice: un profond sommeil venant de Yahweh
  alternative: un profond sommeil de Yahweh
  rationale: Le génitif hébreu est compact et peut être compris comme indiquant la source ou l’action de Yahweh. Le texte principal explicite sobrement la provenance, tandis que la note signale la formulation plus littérale sans nier l’action divine.
translation_notes:
  register: Français international moderne, narratif et digne. La triple répétition de « personne » reproduit l’insistance de l’hébreu, tandis que « vit rien » et « s’aperçut de rien » rendent la suite naturelle en français. Les deux marqueurs [a] et [b] figurent dans le texte.
