  text: וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּ֨רֶד֙ אֶל מִדְבַּר זִ֔יף וְ/אִתּ֛/וֹ שְׁלֹֽשֶׁת אֲלָפִ֥ים אִ֖ישׁ בְּחוּרֵ֣י יִשְׂרָאֵ֑ל לְ/בַקֵּ֥שׁ אֶת דָּוִ֖ד בְּ/מִדְבַּר זִֽיף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: fr
  text: Alors Saül se leva et descendit dans la région sauvage de Ziph, avec trois mille hommes d’élite d’Israël, pour chercher David dans la région sauvage de Ziph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום, dans cette construction narrative, marque le début d’une action résolue. « Se leva » conserve cet idiome tout en restant naturel en français.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime un déplacement vers le bas. « Descendit » en préserve explicitement le sens directionnel.
- source_word: אֶל מִדְבַּר זִיף
  choice: vers le désert de Ziph
  rationale: מִדְבָּר désigne une région aride et inhabitée, sans impliquer nécessairement un désert de sable. « Vers » rend la direction indiquée par אֶל.
- source_word: וְאִתּוֹ
  choice: Il avait avec lui
  rationale: Cette formulation française naturelle rend la proposition circonstancielle d’accompagnement introduite par וְאִתּוֹ.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: trois mille hommes
  rationale: La traduction garde le nom générique « hommes » sans ajouter explicitement « soldats », même si le contexte est militaire.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: hommes d’élite d’Israël
  rationale: Dans ce contexte militaire, l’expression désigne des hommes sélectionnés, des troupes de choix. « Hommes d’élite » est précis et idiomatique en français moderne.
- source_word: לְבַקֵּשׁ
  choice: pour rechercher
  rationale: L’infinitif précédé de לְ exprime ici le but. « Rechercher » convient à la poursuite organisée de David.
- source_word: אֶת דָּוִד
  choice: David
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas; le nom propre est conservé sous sa forme française habituelle.
- source_word: בְּמִדְבַּר זִיף
  choice: dans le désert de Ziph
  rationale: La répétition du lieu présente dans l’hébreu est maintenue, et la préposition בְּ est rendue par « dans ».
theological_decisions: []
