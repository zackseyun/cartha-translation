  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: fr
  text: 'Et voici[a] : de même que ta vie a été précieuse à mes yeux aujourd’hui, que ma vie soit précieuse aux yeux de Yahweh et qu’il me délivre de toute détresse !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta vie a été grande à mes yeux […] que ma vie soit grande aux yeux de Yahweh ». L’hébreu emploie ici « être grand » pour exprimer l’idée d’une grande valeur, c’est-à-dire d’une vie tenue pour précieuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Introduit avec emphase ce qui suit. « Et voici » conserve la force discursive de l’hébreu dans un registre digne, sans être difficile à comprendre.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: de même que ... que
  rationale: Rend clairement la comparaison entre la valeur accordée par David à la vie de Saül et le souhait concernant sa propre vie devant Yahweh.
- source_word: גָּדְלָה נַפְשְׁךָ בְּעֵינַי
  choice: ta vie a été précieuse à mes yeux
  rationale: Littéralement, la vie de Saül « a été grande » aux yeux de David ; dans cet idiome, la grandeur exprime la haute valeur accordée à sa vie.
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans ce contexte où David a épargné Saül et demande d’être délivré du danger, נֶפֶשׁ désigne la vie plutôt que l’âme immatérielle.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Expression naturelle en français moderne qui préserve l’accent temporel de l’hébreu.
- source_word: תִּגְדַּל נַפְשִׁי בְּעֵינֵי יְהוָה
  choice: que ma vie soit précieuse aux yeux de Yahweh
  rationale: L’imparfait exprime ici un souhait. La reprise de « précieuse » maintient le parallélisme avec la première proposition.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin porté par le tétragramme plutôt que de le remplacer par un titre.
- source_word: וְיַצִּלֵנִי
  choice: et qu’il me délivre
  rationale: Le hiphil de נצל signifie couramment délivrer ou arracher au danger ; la tournure française poursuit naturellement l’expression du souhait.
- source_word: מִכָּל צָרָה
  choice: de toute détresse
  rationale: צָרָה désigne la détresse, le malheur ou l’adversité. « Toute détresse » conserve la portée générale et la gravité du terme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin au lieu de le remplacer par un titre.
- issue: Valeur modale de תִּגְדַּל et וְיַצִּלֵנִי
  choice: 'un souhait adressé implicitement à Dieu : « que ... soit ... et qu’il ... délivre »'
  alternative: 'une simple prédiction : « ma vie sera ... et il me délivrera »'
  rationale: Dans le contexte, les formes expriment naturellement le vœu ou la prière de David. La traduction garde toutefois la formulation indirecte du texte, sans ajouter une adresse explicite à Yahweh.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, ainsi que la nuance de souhait. « Et voici » maintient l’appel emphatique à l’attention ; la note signale la formulation hébraïque littérale sans l’imposer dans le corps du texte.
