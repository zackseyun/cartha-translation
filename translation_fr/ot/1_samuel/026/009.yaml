  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל אֲבִישַׁ֖י אַל תַּשְׁחִיתֵ֑/הוּ כִּ֠י מִ֣י שָׁלַ֥ח יָד֛/וֹ בִּ/מְשִׁ֥יחַ יְהוָ֖ה וְ/נִקָּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: fr
  text: 'Mais David dit à Abishaï : « Ne le tue pas ! En effet, qui pourrait porter la main sur l’oint de Yahvé[a] sans être coupable ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « oint » appartient à la même famille de mots que « Messie ». Ici, il désigne Saül comme roi oint par Yahvé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais David dit
  rationale: Le waw narratif fait progresser le récit, tandis que « Mais » exprime ici l’opposition de David à la proposition d’Abishaï.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Ne le tue pas
  rationale: Le hifil de שׁחת signifie détruire ou faire périr. Puisqu’il est question d’asséner à Saül un coup mortel, « tuer » exprime naturellement en français l’action précisément interdite sans changer sa portée dans ce contexte.
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit la raison de l’interdiction et relie naturellement les deux phrases en français moderne.
- source_word: מִי
  choice: qui pourrait
  rationale: L’interrogatif forme une question rhétorique portant à la fois sur la possibilité morale d’un tel acte et sur l’absence de culpabilité qui s’ensuivrait.
- source_word: שָׁלַח יָדוֹ
  choice: porter la main
  rationale: « Porter la main sur quelqu’un » est un idiome français naturel qui conserve l’image hébraïque et désigne une action violente contre une personne.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: sur celui que Yahvé a consacré par l’onction
  rationale: Cette formulation rend le sens historique de מָשִׁיחַ appliqué à Saül, roi oint par Yahvé, tout en conservant explicitement l’idée d’onction et sans lui attribuer directement le titre eschatologique de Messie.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin dans le texte hébreu.
- source_word: וְנִקָּה
  choice: et rester innocent
  rationale: נקה exprime ici le fait d’être exempt de culpabilité ou de responsabilité. « Rester innocent » conserve cette dimension juridique et morale sans réduire le sens au seul fait d’échapper au châtiment.
theological_decisions:
- issue: Sens de מְשִׁיחַ à propos de Saül
  choice: celui que Yahvé a consacré par l’onction
  alternative: l’oint de Yahvé / le Messie de Yahvé
  rationale: Dans ce contexte historique, le mot désigne Saül en tant que roi ayant reçu l’onction de Yahvé. La traduction retenue évite d’importer une identification messianique ultérieure, tout en gardant le lien lexical avec « Messie » dans la note.
- issue: Portée de וְנִקָּה
  choice: rester innocent
  alternative: demeurer impuni
  rationale: Le texte peut évoquer l’exemption de culpabilité et, par implication, de châtiment. La traduction maintient en premier lieu la catégorie morale et juridique présente dans le verbe, sans exclure l’implication judiciaire.
translation_notes:
  register: Français international moderne, naturel et digne. L’idiome « porter la main sur » restitue l’image hébraïque sans raideur. Le tutoiement convient au dialogue direct entre David et Abishaï. Le marqueur [a] figure bien dans le texte principal.
