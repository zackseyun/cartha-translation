source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וַ/יָּבֹא֮ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר חָנָה שָׁ֣ם שָׁאוּל֒ וַ/יַּ֣רְא דָּוִ֗ד אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר שָֽׁכַב שָׁ֣ם שָׁא֔וּל וְ/אַבְנֵ֥ר בֶּן נֵ֖ר שַׂר צְבָא֑/וֹ וְ/שָׁאוּל֙ שֹׁכֵ֣ב בַּ/מַּעְגָּ֔ל וְ/הָ/עָ֖ם חֹנִ֥ים סביבת/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: fr
  text: David se leva et se rendit à l’endroit où Saül avait établi son camp. David vit l’endroit où Saül était couché, ainsi qu’Abner, fils de Ner, chef de son armée. Saül était couché au milieu du camp[a], et les hommes campaient autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le cercle », expression qui désigne probablement l’espace intérieur ou central du camp disposé en cercle.'
    reason: Le terme מַעְגָּל conserve une image spatiale que « au milieu du camp » explicite sans pouvoir en fixer entièrement la configuration.
lexical_decisions:
- source_word: וַיָּקָם דָּוִד
  choice: David se leva
  rationale: La formule narrative avec קום introduit l’action suivante. « Se leva » reste proche de l’hébreu et convient au registre narratif.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: se rendit à l’endroit
  rationale: En français moderne, « se rendit à l’endroit » exprime naturellement le déplacement vers le lieu indiqué, sans imposer le point de vue déictique de « vint ».
- source_word: אֲשֶׁר חָנָה שָׁם שָׁאוּל
  choice: où Saül avait établi son camp
  rationale: Le plus-que-parfait marque que l’installation du camp précède l’arrivée de David. « Établir son camp » rend naturellement חנה dans ce contexte.
- source_word: וַיַּרְא דָּוִד אֶת־הַמָּקוֹם
  choice: David vit l’endroit
  rationale: « Vit » est l’équivalent simple de ראה et la répétition de « David » reflète celle du texte hébreu.
- source_word: אֲשֶׁר שָׁכַב שָׁם שָׁאוּל
  choice: où Saül était couché
  rationale: שכב décrit ici la position de Saül. L’imparfait français convient à la scène observée sans préciser qu’il dormait.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: ainsi qu’Abner, fils de Ner, chef de son armée
  rationale: La syntaxe hébraïque coordonne Abner à ce que David observe sans répéter de verbe. « Ainsi que » garde cette coordination tout en évitant d’affirmer explicitement qu’Abner était couché.
- source_word: בַּמַּעְגָּל
  choice: au milieu du camp
  rationale: מַעְגָּל désigne littéralement un cercle ou une disposition circulaire, probablement l’espace intérieur ou central du camp. Le rendu choisi est clair, tandis que la note conserve l’image exacte et l’incertitude.
- source_word: וְהָעָם חֹנִים סְבִיבֹתָיו
  choice: et les hommes campaient autour de lui
  rationale: Dans ce contexte militaire, « les hommes » rend העם plus naturellement que « le peuple ». L’imparfait traduit l’état continu exprimé par le participe חֹנִים.
theological_decisions: []
