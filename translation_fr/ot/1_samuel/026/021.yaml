base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: fr
  text: 'Alors Saül dit : « J’ai péché. Reviens, David, mon fils, car je ne te ferai plus de mal, puisque ma vie a été précieuse à tes yeux aujourd’hui. Voici, j’ai agi en insensé et je me suis gravement égaré. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: Le parfait qal à la première personne exprime ici l’aveu direct de Saül; le passé composé convient naturellement en français actuel.
- source_word: שׁוּב
  choice: Reviens
  rationale: L’impératif appelle David à revenir, sans préciser davantage le lieu ou la relation rétablie.
- source_word: בְּנִי דָוִד
  choice: David, mon fils
  rationale: Cette formulation française naturelle conserve à la fois le nom propre et l’appellation relationnelle employée comme vocatif.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: je ne te ferai plus de mal
  rationale: Le hiphil de רעע signifie ici faire du mal à quelqu’un; la tournure retenue est claire, digne et idiomatique.
- source_word: תַּחַת אֲשֶׁר
  choice: puisque
  rationale: La locution introduit ici le motif de la promesse de Saül; « puisque » rend naturellement cette valeur causale.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: ma vie a été précieuse à tes yeux
  rationale: Dans ce récit, נֶפֶשׁ désigne concrètement la vie de Saül, que David vient d’épargner; l’expression figurée « précieuse à tes yeux » préserve l’idiome hébreu.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Rendu français direct et naturel de la référence temporelle emphatique.
- source_word: הִנֵּה
  choice: Oui
  rationale: Ici, הִנֵּה attire l’attention sur l’aveu conclusif. « Oui » fonctionne comme marqueur discursif solennel et naturel, sans l’archaïsme de « voici » ou « voici que ».
- source_word: הִסְכַּלְתִּי
  choice: j’ai agi en insensé
  rationale: Le hiphil exprime un comportement insensé plutôt qu’un simple manque d’intelligence; cette formulation conserve la nuance active.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: je me suis gravement égaré
  rationale: שגה conserve l’image de l’égarement, tandis que « gravement » rend l’intensification הַרְבֵּה מְאֹד dans un français idiomatique.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans l’aveu de Saül
  choice: « ma vie »
  alternative: « mon âme » ou « ma personne »
  rationale: David a épargné la vie physique de Saül dans le contexte immédiat. « Ma vie » rend donc le référent narratif sans imposer au verset une affirmation particulière sur la nature de l’âme.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste solennel sans archaïsmes. L’ambiguïté potentielle de נֶפֶשׁ est résolue par le contexte immédiat en faveur de « vie »; aucune note n’est nécessaire pour la compréhension courante.
