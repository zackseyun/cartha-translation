base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: fr
  text: David se leva de bon matin, lui et ses hommes, pour repartir au pays des Philistins[a]. Les Philistins montèrent[b] à Jizreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour aller le matin, pour retourner au pays des Philistins ».'
    reason: La note conserve la succession des deux infinitifs hébreux, rendue plus idiomatiquement par « repartir » dans le texte.
  - marker: b
    text: 'Ou : « avancèrent vers Jizreel » ; « montèrent » traduit l’expression hébraïque, qui peut avoir une nuance topographique ou militaire.'
    reason: La formulation principale préserve l’idiome de mouvement hébreu, tandis que la note en précise la portée possible.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: se levèrent tôt
  rationale: Le hifil de שׁכם exprime couramment le fait de se lever ou de se mettre en route de bonne heure. « Se levèrent tôt » conserve cette indication temporelle dans un français naturel.
- source_word: הוּא וַאֲנָשָׁיו
  choice: David et ses hommes
  rationale: La tournure hébraïque met David et son groupe en relief. Dans ce contexte militaire, « ses hommes » est plus juste que « ses serviteurs » et moins interprétatif que « ses soldats ».
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: le matin pour repartir
  rationale: Les deux infinitifs, littéralement « aller… retourner », décrivent leur départ en vue d'un retour. « Repartir » réunit naturellement ces notions en français, tandis que « tôt le matin » rend à la fois וַיַּשְׁכֵּם et בַּבֹּקֶר sans répétition pesante. La construction plus formelle est signalée en note.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: vers le pays des Philistins
  rationale: « Pays des Philistins » conserve le nom concret אֶרֶץ et la désignation ethnique. « Vers » convient au mouvement exprimé par le retour.
- source_word: וּפְלִשְׁתִּים
  choice: Les Philistins, eux
  rationale: La dislocation avec « eux » marque naturellement en français le changement de sujet et le contraste narratif introduits par la conjonction hébraïque.
- source_word: עָלוּ
  choice: montèrent
  rationale: Le verbe עלה signifie « monter » et peut comporter ici une nuance topographique ou militaire. Le choix français conserve l'image sans ajouter explicitement l'idée d'une marche militaire.
- source_word: יִזְרְעֶאל
  choice: Jizréel
  rationale: Forme française usuelle du nom de lieu biblique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite la répétition peu naturelle « de bonne heure… au matin » en réunissant les indications temporelles dans « tôt le matin », tout en documentant en note la structure plus formelle de l'hébreu.
