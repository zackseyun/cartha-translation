  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: fr
  text: 'Akish répondit à David : « Je sais que tu es bon à mes yeux, comme un ange de Dieu.[a] Mais les chefs des Philistins ont dit : “Il ne montera pas avec nous au combat.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un messager de Dieu ». Le mot hébreu מַלְאָךְ peut désigner un messager ou un ange ; dans cette expression, « ange de Dieu » paraît toutefois le sens le plus naturel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: En français narratif, « répondit » rend naturellement la formule hébraïque redoublée « répondit et dit », sans lourdeur inutile.
- source_word: יָדַעְתִּי
  choice: Je sais
  rationale: Le parfait exprime ici l’évaluation établie d’Akish au moment où il parle.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: tu es bon à mes yeux
  rationale: Cette formulation conserve l’image évaluative de l’hébreu et sa portée assez large, sans la réduire à la loyauté ou à l’intégrité.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: comme un ange de Dieu
  rationale: Dans cette expression, « ange de Dieu » est le sens contextuel le plus naturel, tout en signalant en note le sens lexical possible de « messager ».
- source_word: אַךְ
  choice: Mais
  rationale: Marque clairement le contraste entre l’avis personnel d’Akish et la décision des chefs philistins.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: les chefs des Philistins
  rationale: « Chefs » convient à ces dirigeants militaires et politiques sans introduire le registre archaïque de « princes ».
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: Il ne montera pas avec nous au combat
  rationale: Le futur négatif rend la décision impérative rapportée, tandis que « montera » conserve le verbe de mouvement hébreu employé pour partir en campagne.
theological_decisions:
- issue: Sens de מַלְאַךְ אֱלֹהִים dans la comparaison d’Akish
  choice: « comme un ange de Dieu »
  alternative: « comme un messager de Dieu »
  rationale: La phrase est une comparaison exprimant la très haute estime d’Akish pour David, non une affirmation sur la nature de David. Le texte principal retient le sens probablement idiomatique, tandis que la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, international et digne. La formule hébraïque « répondit et dit » est allégée selon l’usage naturel du français, tandis que les images « bon à mes yeux » et « montera ... au combat » sont conservées.
