  text: וְ/עַתָּ֥ה שׁ֖וּב וְ/לֵ֣ךְ בְּ/שָׁל֑וֹם וְ/לֹֽא תַעֲשֶׂ֣ה רָ֔ע בְּ/עֵינֵ֖י סַרְנֵ֥י פְלִשְׁתִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: fr
  text: Et maintenant, retourne et va en paix, et ne fais rien de mal aux yeux des chefs philistins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne fais pas ce qui est mal aux yeux des chefs philistins ». L’expression hébraïque peut désigner ce qu’ils jugent mauvais ou inacceptable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et la valeur temporelle et discursive de l’expression hébraïque.
- source_word: שׁוּב וְלֵךְ
  choice: retourne et va
  rationale: Maintient les deux impératifs successifs de l’hébreu, plutôt que de les fondre en un seul verbe.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: Expression française naturelle qui garde l’idiome hébraïque et peut aussi suggérer un départ sans danger.
- source_word: וְלֹא תַעֲשֶׂה רָע בְּעֵינֵי
  choice: sans rien faire qui déplaise aux yeux de
  rationale: Dans ce contexte, רַע בְּעֵינֵי exprime ce que les chefs jugeraient mauvais ou inacceptable. Cette formulation française transmet ce point de vue évaluatif sans attribuer nécessairement à David un mal moral objectif.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: les chefs philistins
  rationale: סְרָנִים désigne les hauts dirigeants des cités philistines; « chefs » est clair et digne en français moderne.
theological_decisions:
- issue: Portée morale de רָע (« mal »)
  choice: qui déplaise
  alternative: ne fais pas de mal
  rationale: Le complément « aux yeux des chefs philistins » indique ici une appréciation portée par ces dirigeants. La traduction évite donc de présenter leur jugement comme une qualification morale absolue, tout en signalant l’ambiguïté dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « retourne et va » est volontaire afin de préserver les deux impératifs hébreux; « aux yeux de » conserve l’image du texte source.
