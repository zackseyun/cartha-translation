translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie une formulation naturelle tout en signalant en note le sens concret de מַחֲנֶה et l’autre valeur possible de עַיִן. Aucun marqueur temporel tel que « Or » ou « Maintenant » n’est ajouté.
