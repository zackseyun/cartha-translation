  text: וַ/יִּקְבְּצ֧וּ פְלִשְׁתִּ֛ים אֶת כָּל מַחֲנֵי/הֶ֖ם אֲפֵ֑קָ/ה וְ/יִשְׂרָאֵ֣ל חֹנִ֔ים בַּ/עַ֖יִן אֲשֶׁ֥ר בְּ/יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: fr
  text: Les Philistins rassemblèrent toutes leurs troupes[a] à Afek, tandis qu’Israël campait à la source[b] qui se trouve à Jizréel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous leurs camps »; on pourrait aussi traduire : « toutes leurs armées ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à la fontaine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: rassemblèrent
  rationale: Le verbe קבץ exprime ici l’action de réunir ou d’assembler. « Rassemblèrent » convient au récit militaire sans préciser indûment la manière de mobiliser.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française traditionnelle et courante du nom de ce peuple.
- source_word: כָּל מַחֲנֵיהֶם
  choice: toutes leurs troupes[a]
  rationale: מַחֲנֶה désigne littéralement un camp, mais au pluriel dans ce contexte militaire il peut désigner les contingents ou troupes qui y campent. « Troupes » est naturel en français; la note conserve le sens plus littéral.
- source_word: אֲפֵקָה
  choice: à Afek
  rationale: Le hé directionnel est rendu idiomatiquement par « à ». « Afek » suit une translittération française claire du toponyme.
- source_word: וְיִשְׂרָאֵל חֹנִים
  choice: tandis qu’Israël campait
  rationale: La conjonction présente une situation simultanée. Le participe חֹנִים décrit l’état ou l’activité du campement; le singulier français s’accorde naturellement avec le nom collectif « Israël ».
- source_word: בַּעַיִן
  choice: près de la source[b]
  rationale: עַיִן peut désigner une source ou une fontaine. « Source » est le terme géographique le plus naturel ici, et la préposition est rendue par « près de ».
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: qui se trouve à Jizréel
  rationale: La relative situe simplement la source. « À Jizréel » est idiomatique pour une localité ou son territoire immédiat.
