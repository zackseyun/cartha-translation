  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: fr
  text: 'Alors Akish appela David et lui dit : « Aussi vrai que Yahweh est vivant, tu es droit. Je vois d’un bon œil tes allées et venues avec moi dans le camp[a], car je n’ai rien trouvé de mauvais en toi depuis le jour où tu es venu auprès de moi jusqu’à aujourd’hui. Mais aux yeux des chefs philistins[b], tu n’es pas acceptable[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tes sorties et tes entrées avec moi dans le camp »; cette expression peut désigner la conduite ou l’ensemble des activités de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne par un titre particulier les dirigeants des Philistins.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « tu n’es pas bon »; ici, le sens est « tu n’es pas jugé acceptable ».'
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formule française naturelle conserve la force solennelle de la formule hébraïque de serment ainsi que le nom divin.
- source_word: יָשָׁר
  choice: droit
  rationale: Le terme exprime la droiture et l’intégrité; « droit » en garde la portée morale sans ajouter une accusation ou une nuance absente du texte.
- source_word: טוֹב בְּעֵינַי
  choice: Je vois d’un bon œil
  rationale: Cette expression française actuelle restitue naturellement l’évaluation positive tout en conservant l’image du regard présente en hébreu.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: tes allées et venues
  rationale: Le couple verbal désigne l’activité ou la conduite de David. « Tes allées et venues » en préserve l’image et convient au cadre du camp militaire.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: avec moi dans le camp
  rationale: « Camp » rend le sens direct de מַחֲנֶה, tandis que le contexte fait clairement ressortir sa dimension militaire.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: je n’ai rien trouvé de mauvais en toi
  rationale: Cette formulation conserve l’idée hébraïque de ne rien découvrir de mauvais ou de répréhensible chez David.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: depuis le jour où tu es venu auprès de moi jusqu’à aujourd’hui
  rationale: La tournure suit fidèlement la période indiquée par l’hébreu tout en restant naturelle en français.
- source_word: הַסְּרָנִים
  choice: les chefs philistins
  rationale: Le mot est le titre propre aux dirigeants des Philistins. « Chefs philistins » est clair en français moderne, avec une note signalant la particularité du titre.
- source_word: לֹא טוֹב אָתָּה
  choice: tu n’es pas acceptable
  rationale: L’hébreu dit littéralement « tu n’es pas bon », mais, dans cette construction évaluative, le sens contextuel est que les dirigeants ne jugent pas David acceptable. Une note conserve la formulation littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans un serment prononcé par un roi philistin
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. Le conserver sous la forme « Yahweh » rend le nom personnel sans substituer un titre, même si celui qui prononce ici le serment est philistin.
translation_notes:
  register: Français international moderne, digne et accessible. Les expressions « aussi vrai que… est vivant », « voir d’un bon œil » et « allées et venues » rendent naturellement les idiomes hébreux, tandis que les notes permettent de consulter leur forme plus littérale.
