  text: וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ עֹֽבְרִ֔ים לְ/מֵא֖וֹת וְ/לַ/אֲלָפִ֑ים וְ/דָוִ֣ד וַ/אֲנָשָׁ֗י/ו עֹֽבְרִ֛ים בָּ/אַחֲרֹנָ֖ה עִם אָכִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/002.yaml
  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: fr
  text: Les chefs des Philistins passaient par centaines et par milliers[a], et David et ses hommes passaient à l’arrière avec Akish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner des groupes organisés par centaines et par milliers, peut-être des unités militaires.
    reason: La formulation hébraïque peut exprimer une répartition numérique ou évoquer une organisation en unités militaires, sans trancher entre ces possibilités.
lexical_decisions:
- source_word: סַרְנֵי
  choice: chefs
  rationale: Le terme désigne les hauts dirigeants politico-militaires des cités philistines. « Chefs » est naturel en français et convient à leur rôle dans ce contexte.
- source_word: פְלִשְׁתִּים
  choice: Philistins
  rationale: Forme française usuelle du nom de ce peuple.
- source_word: עֹבְרִים
  choice: défilaient
  rationale: Le participe décrit un mouvement en cours dans une procession militaire. « Défiler » rend ici plus naturellement la scène que le sens général de « passer ».
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: par centaines et par milliers
  rationale: Cette formulation reste proche de l’expression distributive hébraïque et peut désigner soit le nombre des hommes, soit leur organisation en unités militaires.
- source_word: אֲנָשָׁיו
  choice: ses hommes
  rationale: L’expression désigne les compagnons armés de David sans les réduire nécessairement au statut formel de soldats.
- source_word: בָּאַחֲרֹנָה
  choice: à l’arrière
  rationale: Cette expression indique clairement leur position à la fin de la procession.
- source_word: עִם אָכִישׁ
  choice: avec Akish
  rationale: La préposition exprime simplement l’accompagnement. « Akish » est une translittération française claire du nom hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « défilaient » conserve le parallélisme du texte hébreu, tandis que « tandis que » rend naturelle la coordination des deux groupes dans la scène.
