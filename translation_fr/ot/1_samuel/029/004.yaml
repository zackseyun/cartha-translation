  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: fr
  text: 'Mais les chefs philistins se mirent en colère contre lui et lui dirent : « Renvoie cet homme. Qu’il retourne là où tu l’as affecté. Qu’il ne descende pas avec nous au combat, de peur qu’il ne devienne notre adversaire[a] pendant la bataille. En effet, par quel moyen cet homme pourrait-il rentrer en grâce auprès de son seigneur[b] ? Ne serait-ce pas avec les têtes de ces hommes-là ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « adversaire » signifie ici « opposant » ou « ennemi » ; il ne s’agit pas du nom propre « Satan ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se réconcilier avec son seigneur ». L’expression hébraïque désigne le fait de se rendre de nouveau acceptable à son supérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: se mirent en colère contre lui
  rationale: Le verbe קצף exprime une vive colère. Cette formulation française est naturelle et restitue l’entrée dans cet état sans en exagérer l’intensité.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: les chefs philistins
  rationale: שָׂרִים désigne ici les dirigeants militaires et politiques des Philistins. « Chefs » convient au contexte tout en évitant le caractère archaïque de « princes ».
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: Renvoie cet homme
  rationale: 'Le hiphil impératif de שוב est causatif : il ordonne de faire repartir l’homme. « Renvoie » est direct et idiomatique en français.'
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: Qu’il retourne là où tu l’as affecté
  rationale: La tournure volitive après l’impératif est conservée. הפקיד peut signifier affecter, préposer ou placer ; « affecté » convient au cadre militaire sans préciser indûment la nature du poste.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: Qu’il ne descende pas avec nous au combat
  rationale: « Descendre » conserve le verbe concret ירד, tandis que « au combat » rend naturellement la participation à la campagne.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: de peur qu’il ne devienne notre adversaire
  rationale: שָׂטָן est ici un nom commun désignant un adversaire ou un opposant. La formulation exprime le résultat redouté et n’introduit aucune référence au nom propre Satan.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: cet homme pourrait-il rentrer en grâce auprès de son seigneur
  rationale: Le hitpael de רצה évoque le fait de se rendre de nouveau acceptable à son supérieur. « Rentrer en grâce » communique clairement cette idée, tandis que « auprès de son seigneur » maintient la relation politique avec Saül.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: Ne serait-ce pas avec les têtes de ces hommes-là ?
  rationale: 'L’expression hébraïque est elliptique : David pourrait regagner la faveur de Saül en lui livrant les têtes de soldats philistins. La traduction reste proche de cette ellipse sans expliciter dans le corps du texte ce qui demeure sous-entendu.'
theological_decisions:
- issue: Sens de שָׂטָן
  choice: nom commun « adversaire »
  alternative: nom propre « Satan »
  rationale: Dans ce récit militaire, le mot désigne un opposant humain potentiel. Le traiter comme un nom propre importerait une identification théologique absente du contexte.
- issue: Sens de יִתְרַצֶּה אֶל אֲדֹנָיו
  choice: rentrer en grâce auprès de son seigneur
  alternative: se réconcilier avec son seigneur
  rationale: Le contexte met l’accent sur le rétablissement de David dans la faveur de Saül. « Rentrer en grâce » rend ce sens sans affirmer une réconciliation mutuelle plus large que l’expression hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs et les questions rhétoriques conservent la vigueur du discours direct. « Seigneur » est employé au sens politique et humain pour Saül, sans majuscule. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
