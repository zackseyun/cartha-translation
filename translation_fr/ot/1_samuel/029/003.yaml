  text: וַ/יֹּֽאמְרוּ֙ שָׂרֵ֣י פְלִשְׁתִּ֔ים מָ֖ה הָ/עִבְרִ֣ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר אָכִ֜ישׁ אֶל שָׂרֵ֣י פְלִשְׁתִּ֗ים הֲ/לֽוֹא זֶ֨ה דָוִ֜ד עֶ֣בֶד שָׁא֣וּל מֶֽלֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הָיָ֤ה אִתִּ/י֙ זֶ֤ה יָמִים֙ אוֹ זֶ֣ה שָׁנִ֔ים וְ/לֹֽא מָצָ֤אתִי ב/וֹ֙ מְא֔וּמָה מִ/יּ֥וֹם נָפְל֖/וֹ עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: fr
  text: 'Alors les commandants philistins dirent : « Que font ici ces Hébreux ? » Akish répondit aux commandants philistins : « N’est-ce pas David, le serviteur de Saül, roi d’Israël, qui est avec moi depuis des jours ou des années ? Je n’ai rien trouvé à lui reprocher depuis le jour où il s’est rallié à moi[a] jusqu’à aujourd’hui même. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis le jour de sa chute » ou « de son tomber ». Dans ce contexte, l’expression peut désigner le moment où il est passé de son côté ou s’est rallié à lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: les commandants philistins
  rationale: Dans ce contexte militaire, שָׂרִים désigne des chefs de haut rang; « commandants » est précis, naturel et moins archaïque que « princes ».
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: Que font ici ces Hébreux ?
  rationale: 'L’hébreu est elliptique, littéralement « Quoi, ces Hébreux ? ». Le français exige normalement de restituer l’implication pragmatique : leur présence parmi les troupes est mise en question.'
- source_word: הָעִבְרִים
  choice: ces Hébreux
  rationale: Conserve l’appellation ethnique employée du point de vue philistin, sans la remplacer par « Israélites ».
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: Préserve la question rhétorique qui appelle une réponse affirmative.
- source_word: עֶבֶד
  choice: le serviteur
  rationale: Dans la relation de David à la cour de Saül, « serviteur » convient mieux que « esclave » tout en restant proche du terme hébreu.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: depuis des jours, voire des années
  rationale: Rend naturellement l’expression temporelle inhabituelle tout en conservant son amplitude et son insistance; « voire » exprime ici la progression de « jours » à « années ».
- source_word: מְאוּמָה
  choice: rien trouvé à lui reprocher
  rationale: Dans ce contexte, l’expression signifie qu’Akish n’a découvert aucun motif de plainte ou d’accusation contre David.
- source_word: מִיּוֹם נָפְלוֹ
  choice: depuis le jour où il s’est rallié à moi
  rationale: נפל peut, dans un contexte politico-militaire, signifier passer dans le camp de quelqu’un. « Se rallier à » restitue ce sens sans la connotation morale parfois attachée à « faire défection ».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui même
  rationale: Rend l’expression temporelle et l’emphase du démonstratif.
- source_word: אָכִישׁ
  choice: Akish
  rationale: Translittération française courante du nom propre.
- source_word: דָוִד
  choice: David
  rationale: Forme française consacrée du nom propre.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française consacrée du nom propre, avec tréma pour marquer la diérèse.
