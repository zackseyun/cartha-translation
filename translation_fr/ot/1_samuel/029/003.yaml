- from: 'Alors les commandants philistins dirent : « Que font ici ces Hébreux ? » Akish répondit aux commandants philistins : « N’est-ce pas David, le serviteur de Saül, roi d’Israël, qui est avec moi depuis des jours, voire des années ? Je n’ai rien trouvé à lui reprocher depuis le jour où il s’est rallié à moi[a] jusqu’à aujourd’hui même. »'
  to: 'Alors les commandants philistins dirent : « Que font ici ces Hébreux ? » Akish répondit aux commandants philistins : « N’est-ce pas David, le serviteur de Saül, roi d’Israël, qui est avec moi depuis des jours ou des années ? Je n’ai rien trouvé à lui reprocher depuis le jour où il s’est rallié à moi[a] jusqu’à aujourd’hui même. »'
  rationale: La révision conserve l’explicitation française nécessaire de la première question et le sens contextuel de la dernière proposition. Elle remplace « voire » par « ou » afin de refléter la coordination hébraïque, et reformule la note pour signaler correctement l’ambiguïté de נפלו sans introduire dans le littéral un complément absent du texte source.
