  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: fr
  text: Maintenant, lève-toi de bon matin avec les serviteurs de ton maître qui sont venus avec toi. Lorsque vous vous lèverez de bon matin et qu’il fera jour[a], partez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Dès qu’il fera jour, partez » ou « À l’aube, partez ». L’hébreu dit littéralement : « et [ce sera] lumière pour vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers l’instruction immédiate sans alourdir le français par la conjonction hébraïque.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: lève-toi de bon matin
  rationale: Le hifil de שׁכם exprime le fait de se lever ou de se mettre en route tôt; «de bon matin» rend naturellement cette idée en français.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: toi et les serviteurs de ton maître
  rationale: Le groupe coordonné inclut David et ses hommes; «maître» convient au sens humain de אֲדֹנִים dans ce contexte.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: qui sont venus avec toi
  rationale: Le passé composé est naturel en français et présente leur venue comme pertinente dans la situation présente.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: Quand vous vous serez levés de bon matin
  rationale: La forme plurielle reprend David et ses compagnons. La proposition temporelle rend la séquence de l’instruction sans transformer inutilement le verbe en nouvel impératif.
- source_word: וְאוֹר לָכֶם
  choice: et qu’il fera jour pour vous
  rationale: Rend de près la tournure inhabituelle «et lumière pour vous» tout en restant intelligible; la note signale une formulation française plus idiomatique.
- source_word: וָלֵכוּ
  choice: partez
  rationale: Dans ce contexte, l’impératif pluriel de הלך ordonne de quitter les lieux; «partez» est plus naturel que le simple «allez» en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse singulière faite à David, puis le pluriel englobe David et les hommes venus avec lui. La répétition de « de bon matin » est conservée parce qu’elle figure dans l’hébreu.
