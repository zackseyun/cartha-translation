base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: fr
  text: 'N’est-ce pas ce David[a] au sujet duquel on chantait en se répondant lors des danses : « Saül a abattu ses milliers, et David ses dizaines de milliers[b] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « on se répondait à son sujet dans les danses » ; cette expression peut désigner un chant responsorial ou antiphoné.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu signifie littéralement « dizaines de milliers » et peut aussi se rendre par « myriades ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: N’est-ce pas ce David
  rationale: Conserve la forme de la question rhétorique, qui appelle l’assentiment, ainsi que la valeur identificatrice et légèrement emphatique du démonstratif.
- source_word: יַעֲנוּ לוֹ
  choice: dont on chantait en se répondant
  rationale: Le verbe ענה désigne ici un chant responsorial ou antiphoné. Cette formulation française exprime l’échange des voix sans réduire le sens à une simple parole adressée à David.
- source_word: בַּמְּחֹלוֹת
  choice: au milieu des danses
  rationale: מְחֹלוֹת évoque des danses festives, probablement collectives. La formulation est naturelle en français et maintient le cadre concret de la célébration.
- source_word: הִכָּה
  choice: a abattu
  rationale: Dans ce refrain guerrier, נכה indique que des ennemis ont été frappés et vaincus, vraisemblablement tués. « A abattu » garde la force militaire du terme sans explicitation excessive.
- source_word: בַּאֲלָפָיו
  choice: ses milliers
  rationale: Reproduit l’expression numérique et possessive du refrain ainsi que son parallélisme.
- source_word: בְרִבְבֹתָיו
  choice: ses dizaines de milliers
  rationale: רְבָבוֹת est le pluriel de « dix mille » et peut aussi évoquer des multitudes. « Dizaines de milliers » rend clairement le contraste numérique avec « milliers ».
