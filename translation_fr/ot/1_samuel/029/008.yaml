  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: fr
  text: 'David dit à Akish : « Mais qu’ai-je fait ? Quel tort as-tu trouvé chez ton serviteur depuis le jour où je suis entré à ton service jusqu’à aujourd’hui, pour que je ne puisse pas aller combattre les ennemis de mon seigneur le roi[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « mon seigneur le roi » est conservée telle que David la prononce. Elle peut désigner directement Akish, mais le contexte narratif permet aussi d’y entendre une ambiguïté intentionnelle.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Mais qu’ai-je fait ?
  rationale: כִּי introduit ici la protestation de David en réaction aux paroles précédentes d’Akish. « Mais » rend naturellement cette reprise adversative en français.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: Quel tort as-tu trouvé chez ton serviteur
  rationale: Avec ב, מָצָא exprime ici la découverte d’un motif de reproche. « Quel tort » explicite sobrement cette valeur négative, tandis que « chez ton serviteur » conserve l’idée de ce qui aurait été trouvé en lui.
- source_word: בְעַבְדְּךָ
  choice: ton serviteur
  rationale: עֶבֶד est ici une formule de déférence employée devant un roi plutôt qu’une désignation mettant l’accent sur l’esclavage.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: depuis le jour où je suis entré à ton service jusqu’à aujourd’hui
  rationale: Littéralement, David dit qu’il a été « devant » Akish. Dans ce contexte de dépendance politique et militaire, « entrer à ton service » en communique naturellement la portée en français.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: pour que je ne puisse pas aller combattre
  rationale: 'La proposition exprime la conséquence contestée par David : on l’empêche de participer au combat. Cette formulation française restitue clairement la force contextuelle sans suggérer une incapacité physique.'
- source_word: בְּאֹיְבֵי
  choice: combattre les ennemis de
  rationale: Avec נלחם, la préposition ב marque les adversaires affrontés. En français, le verbe « combattre » peut prendre directement son complément.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: אֲדֹנִי est ici un titre honorifique humain. La formulation conserve le registre déférent ainsi que l’ambiguïté possible concernant le référent voulu par David.
theological_decisions:
- issue: Référent et portée rhétorique de « les ennemis de mon seigneur le roi »
  choice: Conserver la formule prononcée sans préciser le référent de « mon seigneur le roi ».
  alternative: Identifier explicitement Akish comme le seigneur et roi visé, ou présenter les mots comme une allusion délibérée à un autre roi.
  rationale: L’hébreu ne précise pas l’intention intérieure de David. La formulation peut être entendue comme une adresse directe à Akish, tout en gardant dans le récit une possible ambiguïté. La traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours conserve la déférence de David envers Akish. « Quel tort as-tu trouvé » évite le calque peu idiomatique « qu’as-tu trouvé en ton serviteur », tandis que « entrer à ton service » rend le sens contextuel de l’expression littérale « être devant toi ».
