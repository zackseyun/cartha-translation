base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: fr
  text: Abigaïl se dépêcha de se lever, puis elle monta sur l’âne. Cinq de ses servantes marchaient derrière elle. Elle suivit les messagers de David et devint sa femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: se dépêcha de se lever
  rationale: Rend explicitement la hâte suivie de l’action de se lever, dans un français naturel et fidèle à la succession verbale hébraïque.
- source_word: נַעֲרֹתֶיהָ
  choice: ses servantes
  rationale: Dans ce contexte, le terme désigne les jeunes femmes attachées au service d’Abigaïl; « servantes » est idiomatique sans insister inutilement sur leur âge.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: marchaient derrière elle
  rationale: L’expression idiomatique signifie qu’elles l’accompagnaient à pied, à sa suite.
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: Elle suivit les messagers de David
  rationale: Conserve le sens concret de partir à la suite des envoyés de David.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: devint sa femme
  rationale: Formulation française directe correspondant à l’expression hébraïque indiquant l’entrée dans le mariage.
