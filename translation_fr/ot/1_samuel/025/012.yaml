  text: וַ/יַּהַפְכ֥וּ נַעֲרֵֽי דָוִ֖ד לְ/דַרְכָּ֑/ם וַ/יָּשֻׁ֨בוּ֙ וַ/יָּבֹ֔אוּ וַ/יַּגִּ֣דוּ ל֔/וֹ כְּ/כֹ֖ל הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: fr
  text: Les jeunes gens de David firent demi-tour et se remirent en route. Ils revinrent, arrivèrent auprès de lui et lui rapportèrent toutes ces paroles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ces choses ». Le terme hébreu peut désigner aussi bien des paroles que des faits ou des choses ; ici, « paroles » est retenu parce que le rapport porte sur la réponse prononcée par Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: firent demi-tour
  rationale: Dans ce contexte de déplacement, le verbe הפך indique un changement de direction plutôt qu’un renversement au sens littéral. « Firent demi-tour » est naturel et précis en français.
- source_word: נַעֲרֵי דָוִד
  choice: les jeunes gens de David
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. « Jeunes gens » conserve la nuance d’âge sans imposer un statut servile qui n’est pas explicite ici.
- source_word: לְדַרְכָּם
  choice: reprirent leur chemin
  rationale: Littéralement « vers leur chemin » ; avec le verbe précédent, l’expression française « reprirent leur chemin » rend clairement leur retour sur l’itinéraire.
- source_word: וַיָּשֻׁבוּ
  choice: ils revinrent
  rationale: Le verbe שׁוב exprime explicitement le retour. La traduction le maintient afin de respecter l’enchaînement narratif hébreu.
- source_word: וַיָּבֹאוּ
  choice: arrivèrent auprès de lui
  rationale: בוא signifie venir ou arriver. « Arrivèrent auprès de lui » exprime ici l’aboutissement du déplacement tout en conservant ce verbe distinct dans la succession narrative.
- source_word: וַיַּגִּדוּ לוֹ
  choice: lui rapportèrent
  rationale: נגד désigne ici le fait de transmettre un compte rendu. « Rapportèrent » convient à la mission de messagers des jeunes gens et reste idiomatique en français.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דְּבָרִים peut signifier « paroles », « choses » ou « faits ». Le contexte immédiat porte sur la réponse prononcée par Nabal ; « paroles » conserve donc au mieux la dimension verbale sans effacer l’autre possibilité.
theological_decisions: []
translation_notes:
  register: Français moderne, international et narratif. La légère répétition des verbes de mouvement (« reprirent », « revinrent », « arrivèrent ») conserve l’enchaînement caractéristique du récit hébreu sans devenir obscur. Le pronom « lui » reprend David, conformément au contexte.
