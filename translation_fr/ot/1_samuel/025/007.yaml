base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: fr
  text: Et maintenant, j’ai appris que tu fais tondre tes moutons. Maintenant, tes bergers, qui étaient avec nous, nous ne les avons pas maltraités[a], et rien ne leur a manqué pendant tout le temps où ils ont été au Carmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « nous ne les avons pas couverts de honte ». Le verbe hébreu peut désigner le fait d’humilier ou de faire subir un tort ; ici, le contexte évoque l’absence de mauvais traitements envers les bergers de Nabal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec le discours précédent et la transition temporelle de l’hébreu.
- source_word: שָׁמַעְתִּי
  choice: j’ai appris
  rationale: Dans ce contexte de nouvelle reçue, le passé composé français exprime naturellement l’information récemment parvenue à David.
- source_word: כִּי גֹזְזִים לָךְ
  choice: que tu fais tondre tes moutons
  rationale: Le participe avec le datif désigne la tonte effectuée pour Nabal. Cette formulation rend clairement la situation sans supposer que Nabal tond lui-même; « tes moutons » explicite naturellement l’objet implicite dans ce contexte.
- source_word: עַתָּה
  choice: Or
  rationale: La seconde occurrence introduit l’application immédiate de la nouvelle aux bergers de Nabal; « Or » maintient l’articulation rhétorique sans répéter lourdement « maintenant » en français.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: tes bergers
  rationale: Le possessif français rend naturellement l’expression hébraïque « les bergers qui sont à toi ».
- source_word: הָיוּ עִמָּנוּ
  choice: qui ont été avec nous
  rationale: Rend directement la relation exprimée par עִם sans ajouter l’idée d’hébergement ou d’appartenance au groupe.
- source_word: לֹא הֶכְלַמְנוּם
  choice: nous ne les avons pas maltraités
  rationale: Le hiphil de כלם peut évoquer le fait de couvrir de honte ou de faire subir un tort. Dans ce contexte pastoral, « maltraités » communique l’absence d’abus tout en signalant en note le sens plus littéral.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: et rien ne leur a manqué
  rationale: Formulation française naturelle qui conserve le datif לָהֶם et le sens passif de נפקד, « être manquant ».
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: pendant tout le temps où ils ont été
  rationale: Rend idiomatiquement la durée totale exprimée par « tous les jours de leur présence ».
- source_word: בַּכַּרְמֶל
  choice: au Carmel
  rationale: Le terme désigne ici le lieu nommé Carmel en Juda; en français, l’usage locatif naturel est « au Carmel ».
