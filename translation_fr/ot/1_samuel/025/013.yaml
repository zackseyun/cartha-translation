  text: וַ/יֹּאמֶר֩ דָּוִ֨ד לַ/אֲנָשָׁ֜י/ו חִגְר֣וּ אִ֣ישׁ אֶת חַרְבּ֗/וֹ וַֽ/יַּחְגְּרוּ֙ אִ֣ישׁ אֶת חַרְבּ֔/וֹ וַ/יַּחְגֹּ֥ר גַּם דָּוִ֖ד אֶת חַרְבּ֑/וֹ וַֽ/יַּעֲל֣וּ אַחֲרֵ֣י דָוִ֗ד כְּ/אַרְבַּ֤ע מֵאוֹת֙ אִ֔ישׁ וּ/מָאתַ֖יִם יָשְׁב֥וּ עַל הַ/כֵּלִֽים׀־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: fr
  text: 'Alors David dit à ses hommes : « Que chacun attache son épée à sa ceinture ! » Chacun attacha donc son épée à sa ceinture, et David attacha lui aussi la sienne. Environ quatre cents hommes montèrent à la suite de David, tandis que deux cents restèrent auprès du matériel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les bagages » ou « près de l’équipement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: attacher son épée à sa ceinture
  rationale: Le verbe חגר désigne ici l’action de ceindre ou de fixer une arme. Cette formulation concrète est naturelle en français moderne et évite l’archaïsme « ceindre ».
- source_word: אִישׁ אֶת־חַרְבּוֹ
  choice: que chacun attache son épée à sa ceinture
  rationale: « Chacun » restitue la valeur distributive de אִישׁ, tandis que « son épée » conserve la précision de חֶרֶב.
- source_word: גַּם
  choice: lui aussi
  rationale: Cette expression marque clairement que David participe personnellement à l’armement, comme ses hommes.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: montèrent à la suite de David
  rationale: « Montèrent » conserve le sens directionnel de עלה, et « à la suite de » rend le mouvement derrière David sans imposer une nuance supplémentaire.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: environ quatre cents hommes
  rationale: « Environ » rend la valeur approximative du préfixe כְּ devant le nombre.
- source_word: יָשְׁבוּ
  choice: restèrent
  rationale: Dans ce contexte narratif, le verbe signifie que ces hommes demeurèrent en arrière plutôt qu’ils ne s’assirent littéralement.
- source_word: עַל־הַכֵּלִים
  choice: auprès du matériel
  rationale: כֵּלִים est un terme large désignant ici les affaires, l’équipement ou les bagages du groupe. « Matériel » reste suffisamment général, tandis que les autres possibilités sont signalées en note.
- source_word: לַאֲנָשָׁיו
  choice: à ses hommes
  rationale: Dans ce contexte militaire, אֲנָשִׁים désigne les hommes placés sous l’autorité de David, plutôt que des gens en général ou des serviteurs domestiques.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’impératif hébreu distributif est rendu par « Que chacun… ! ». La répétition de l’action d’attacher l’épée est conservée, avec « la sienne » dans la troisième occurrence pour alléger naturellement la phrase sans perdre le référent.
