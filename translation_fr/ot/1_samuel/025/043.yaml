id: 1SA.25.43
reference: 1 Samuel 25:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: fr
  text: David prit aussi Ahinoam de Jizréel[a], et toutes les deux devinrent ses femmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ahinoam la Jizréélite ».'
    reason: Alternative lexicale pour rendre l’expression géographique מִיִּזְרְעֶאל.
lexical_decisions:
- source_word: לָקַח
  choice: prit
  rationale: Le verbe signifie littéralement « prendre ». Dans ce contexte matrimonial, la proposition suivante en précise clairement le sens, ce qui permet de conserver la formulation hébraïque sans la remplacer par « épousa ».
- source_word: אֲחִינֹעַם
  choice: Ahinoam
  rationale: Le nom propre est translittéré selon une forme française claire et usuelle.
- source_word: מִיִּזְרְעֶאל
  choice: de Jizréel
  rationale: La préposition מִן jointe au nom de lieu exprime ici l’origine ou l’appartenance géographique. « de Jizréel » est naturel en français et reste proche de la forme hébraïque.
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: et toutes les deux devinrent
  rationale: Le verbe féminin pluriel et l’expression « toutes les deux » renvoient à Ahinoam et Abigaïl. « Devinrent » conserve la valeur verbale de היה et le passage à leur statut d’épouses.
- source_word: לְנָשִׁים
  choice: ses femmes
  rationale: L’expression לּוֹ לְנָשִׁים signifie idiomatiquement qu’elles furent pour lui des épouses. « Ses femmes » est une formulation française naturelle qui maintient explicitement le pluriel.
- source_word: גַּם
  choice: aussi
  rationale: 'La particule marque l’addition : en plus d’Abigaïl, David prit Ahinoam.'
theological_decisions:
- issue: Description d’un mariage polygynique
  choice: Le verset affirme explicitement que les deux femmes devinrent les femmes de David.
  alternative: Employer une formulation euphémique qui atténuerait la pluralité des épouses.
  rationale: L’hébreu décrit sans ambiguïté la situation matrimoniale au pluriel. La traduction la rapporte sans l’occulter ni ajouter de jugement moral absent du verset.
translation_notes:
  register: Français international moderne, simple et digne. La construction « prit… devinrent ses femmes » conserve le relief de l’hébreu tout en restant immédiatement compréhensible.
