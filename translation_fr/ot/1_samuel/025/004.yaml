source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע דָּוִ֖ד בַּ/מִּדְבָּ֑ר כִּֽי גֹזֵ֥ז נָבָ֖ל אֶת צֹאנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: fr
  text: David apprit dans le désert que Nabal tondait ses moutons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus largement, « son troupeau ». Le mot hébreu peut désigner collectivement le petit bétail, mais « moutons » convient particulièrement au contexte de la tonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Dans ce contexte, le verbe שׁמע indique que David reçut cette information. « Apprit » est naturel en français et évite la tournure plus lourde « entendit dire ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région sauvage, aride ou peu habitée, pas nécessairement un désert de sable. « Dans le désert » est la formulation biblique française courante et indique ici le lieu où se trouvait David.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de l’information reçue par David.
- source_word: גֹזֵז
  choice: tondait
  rationale: Le participe hébreu présente l’action comme en cours. L’imparfait français rend naturellement cet aspect contemporain de ce que David apprit.
- source_word: נָבָל
  choice: Nabal
  rationale: Le nom propre est translittéré selon l’usage français.
- source_word: אֶת צֹאנוֹ
  choice: ses moutons
  rationale: צֹאן peut désigner collectivement le petit bétail, notamment les moutons et les chèvres. Le contexte de la tonte favorise ici « moutons ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve l’indication de lieu et l’aspect duratif du participe hébreu sans alourdir la narration.
