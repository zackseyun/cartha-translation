  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: fr
  text: 'Quand David apprit que Nabal était mort, il dit : « Béni soit Yahweh, qui a défendu ma cause contre l’insulte que Nabal m’avait faite[a] et qui a retenu son serviteur de faire le mal[b] ! Yahweh a fait retomber sur la tête de Nabal le mal qu’il avait commis[c]. » Puis David envoya parler à Abigaïl afin de la prendre pour femme[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui a plaidé la cause de mon déshonneur de la main de Nabal ». L’hébreu emploie le langage d’un procès. Autres traductions possibles : « qui m’a vengé de l’insulte » ou « qui a défendu ma cause dans l’affront que Nabal m’avait infligé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui a empêché son serviteur de faire du tort ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Yahweh a fait revenir le mal de Nabal sur sa tête », image exprimant que les conséquences du mal retombent sur son auteur.'
    reason: cultural_note
  - marker: d
    text: 'Ou : « David envoya faire à Abigaïl la proposition de la prendre pour femme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Béni soit Yahweh
  rationale: Cette formule française traditionnelle conserve la portée doxologique et performative de la bénédiction hébraïque, tandis que « Yahweh » rend le nom divin.
- source_word: רָב אֶת רִיב חֶרְפָּתִי מִיַּד נָבָל
  choice: a défendu ma cause contre l’insulte que Nabal m’avait faite
  rationale: « Défendre ma cause » maintient l’image judiciaire de ריב, et la formulation explicite naturellement en français la relation entre Nabal et l’insulte sans effacer le sens de חֶרְפָּה.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: a retenu son serviteur de faire le mal
  rationale: חָשַׂךְ exprime la retenue ou l’empêchement. « Faire le mal » préserve la valeur morale possible de רָעָה et convient au projet violent de David.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: Yahweh a fait retomber sur la tête de Nabal le mal qu’il avait commis
  rationale: Cette tournure française conserve l’image hébraïque de la rétribution revenant sur la tête du coupable, tout en indiquant clairement que « le mal de Nabal » désigne ici celui qu’il a commis.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: David envoya des messagers parler à Abigaïl
  rationale: Le sujet implicite de « parler » peut être compris comme les envoyés de David. Cette formulation rend naturellement l’action médiatisée sans remplacer le verbe « parler » par l’interprétation plus précise « demander en mariage ».
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: afin de la prendre pour femme
  rationale: La formulation reste proche de l’expression matrimoniale hébraïque tout en étant intelligible en français actuel.
theological_decisions:
- issue: Jugement divin et rétribution dans la mort de Nabal
  choice: Conserver l’affirmation de David selon laquelle Yahweh a défendu sa cause et fait retomber sur Nabal le mal qu’il avait commis.
  alternative: Expliciter que Yahweh a directement mis Nabal à mort en jugement.
  rationale: Le verset attribue explicitement à Yahweh la défense de la cause de David et la rétribution de Nabal, mais la traduction ne doit pas développer cette déclaration narrative en une affirmation doctrinale plus générale ou plus précise que le texte.
- issue: Valeur morale de רָעָה concernant l’action projetée par David
  choice: faire le mal
  alternative: faire du tort
  rationale: Dans le contexte, David reconnaît que la vengeance sanglante dont il a été détourné aurait été moralement mauvaise. « Faire le mal » conserve cette force sans préciser davantage la nature de l’acte.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe juridique hébraïque est rendue avec assez de naturel pour être immédiatement comprise, tandis que les notes conservent sa forme littérale et ses ambiguïtés. Le nom divin est translittéré « Yahweh » de manière cohérente.
