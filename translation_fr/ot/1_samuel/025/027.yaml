  yaml_path: translation/ot/1_samuel/025/027.yaml
  text: And now, let this gift that your servant has brought to my lord be given to the young men who follow my lord.
translation:
  language: fr
  text: Et maintenant, que ce présent que ta servante a apporté à mon seigneur soit donné aux jeunes hommes qui suivent mon seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּרָכָה
  choice: ce présent
  rationale: Littéralement « cette bénédiction », mais dans ce contexte le mot désigne le don concret qu’Abigaïl apporte; « présent » restitue naturellement cet emploi sans perdre le registre respectueux.
- source_word: שִׁפְחָתְךָ
  choice: ta servante
  rationale: Formule d’humilité par laquelle Abigaïl parle d’elle-même devant David; le français conserve cette troisième personne de politesse.
- source_word: הַנְּעָרִים
  choice: les jeunes hommes
  rationale: Le terme désigne ici les hommes de la troupe de David, probablement ses serviteurs ou compagnons; « jeunes hommes » reste proche de l’hébreu sans préciser davantage.
- source_word: הַמִּתְהַלְּכִים בְּרַגְלֵי אֲדֹנִי
  choice: qui suivent mon seigneur
  rationale: L’expression idiomatique signifie littéralement « qui marchent aux pieds de mon seigneur » et désigne ceux qui l’accompagnent ou le suivent.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et naturel. Les appellations répétées « ta servante » et « mon seigneur » sont conservées, car elles structurent le discours déférent d’Abigaïl. Le tutoiement correspond au singulier hébreu adressé à David.
