  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: fr
  text: Cet homme s’appelait Nabal, et sa femme s’appelait Abigaïl. La femme était intelligente et belle, mais l’homme était dur et mauvais dans sa conduite ; c’était un Calebite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu signifie probablement « un Calebite », c’est-à-dire un membre du clan de Caleb. La forme écrite est inhabituelle, et certains estiment qu’elle pourrait se lire autrement.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: Nabal
  rationale: Nom propre conservé sous sa forme française biblique usuelle.
- source_word: אֲבִגָיִל
  choice: Abigaïl
  rationale: Forme française usuelle du nom propre, avec tréma pour guider la prononciation.
- source_word: טוֹבַת שֶׂכֶל
  choice: intelligente
  rationale: L’expression signifie littéralement « bonne de discernement / d’intelligence » ; « intelligente » en rend clairement la valeur élogieuse en français moderne.
- source_word: וִיפַת תֹּאַר
  choice: belle
  rationale: La construction désigne la beauté de l’apparence ou de la forme ; dans ce contexte, « belle » est naturel et suffisamment concret.
- source_word: קָשֶׁה
  choice: dur
  rationale: Le terme décrit ici un caractère rude et intraitable ; « dur » préserve sa force tout en restant idiomatique.
- source_word: רַע מַעֲלָלִים
  choice: mauvais dans ses actes
  rationale: מַעֲלָלִים désigne les actes ou la conduite. Cette formulation conserve explicitement le jugement moral du texte sans le limiter aux seules relations d’affaires.
- source_word: כלבו
  choice: un Calebite
  rationale: La lecture traditionnelle comprend cette forme comme une désignation clanique liée à Caleb. La forme consonantique étant inhabituelle, l’incertitude est signalée en note.
theological_decisions:
- issue: Interprétation de וְהוּא כלבו
  choice: c’était un Calebite
  alternative: il appartenait à la maison de Caleb ; la forme écrite pourrait aussi être comprise autrement
  rationale: Il s’agit surtout d’une difficulté textuelle et lexicale. La compréhension gentilice, « Calebite », convient au contexte et à la tradition ancienne, mais l’ambiguïté de la forme écrite ne doit pas être passée sous silence.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « s’appelait » évite une tournure nominale pesante. Le contraste entre la femme et l’homme est conservé par « mais ». Aucun marqueur temporel absent de l’hébreu n’a été ajouté.
