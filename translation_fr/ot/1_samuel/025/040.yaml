source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: fr
  text: 'Les serviteurs de David arrivèrent auprès d’Abigaïl, à Carmel, et lui dirent : « David nous a envoyés vers toi pour te prendre pour femme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour t’épouser » ; littéralement, « pour te prendre pour lui comme femme ».
    reason: La traduction principale préserve l’expression matrimoniale hébraïque, tandis que la variante en explicite le sens idiomatique et que la formulation littérale rend visible le pronom לוֹ.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: arrivèrent
  rationale: Le verbe בוא peut signifier « venir » ou « aller » selon le point de vue. Avec la destination marquée « vers Carmel », « arrivèrent » exprime naturellement ici l’aboutissement du déplacement.
- source_word: עַבְדֵי דָוִד
  choice: les serviteurs de David
  rationale: עֶבֶד peut désigner un esclave, un serviteur ou un agent. Dans ce contexte, ces hommes sont les envoyés de David, sans insistance sur leur statut juridique ; « serviteurs » convient donc le mieux.
- source_word: הַכַּרְמֶלָה
  choice: à Carmel
  rationale: La terminaison directionnelle indique un mouvement vers Carmel. Après « arrivèrent », le français exprime idiomatiquement la destination atteinte par « à Carmel ».
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: et lui dirent
  rationale: La formule hébraïque signifie littéralement « ils lui parlèrent en disant ». « Lui dirent » restitue cette introduction de discours de manière naturelle et actuelle, sans lourdeur.
- source_word: שְׁלָחָנוּ אֵלַיִךְ
  choice: nous a envoyés vers toi
  rationale: Le parfait décrit l’envoi accompli dont les messagers exécutent maintenant la mission. Le passé composé convient au français, et « vers toi » conserve la valeur directionnelle de אֶל.
- source_word: לְקַחְתֵּךְ לוֹ לְאִשָּׁה
  choice: pour te prendre pour femme
  rationale: Dans un contexte matrimonial, לקח avec לְאִשָּׁה est l’expression consacrée pour prendre une femme en mariage. « Te prendre pour femme » demeure proche de la formulation hébraïque tout en étant compréhensible en français moderne ; le pronom לוֹ est implicitement repris par le sujet David.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit, tandis que le discours direct emploie le passé composé naturel. L’expression « prendre pour femme » conserve la tournure matrimoniale de l’hébreu sans employer de vocabulaire archaïque.
