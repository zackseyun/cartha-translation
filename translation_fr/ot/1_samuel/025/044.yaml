id: 1SA.25.44
reference: 1 Samuel 25:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁא֗וּל נָתַ֛ן אֶת מִיכַ֥ל בִּתּ֖/וֹ אֵ֣שֶׁת דָּוִ֑ד לְ/פַלְטִ֥י בֶן לַ֖יִשׁ אֲשֶׁ֥ר מִ/גַּלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: fr
  text: Saül avait donné sa fille Mikal, femme de David, à Palti, fils de Laïsh, qui était de Gallim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: Saül
  rationale: Le nom est rendu selon sa forme française usuelle. La conjonction וְ n’est pas exprimée séparément, puisque la continuité narrative ressort naturellement du contexte sans ajout d’un marqueur comme « Or ».
- source_word: נָתַן
  choice: avait donné
  rationale: Le plus-que-parfait présente cette action accomplie comme antérieure au récit environnant.
- source_word: מִיכַל בִּתּוֹ
  choice: sa fille Mikal
  rationale: Cette formulation française naturelle conserve l’apposition qui identifie Mikal comme la fille de Saül.
- source_word: אֵשֶׁת דָּוִד
  choice: femme de David
  rationale: Le groupe construit indique le lien conjugal de Mikal avec David, sans résoudre la tension créée par le fait que Saül l’a donnée à un autre homme.
- source_word: לְפַלְטִי
  choice: à Palti
  rationale: Translittération directe de la forme hébraïque פַלְטִי.
- source_word: בֶן לַיִשׁ
  choice: fils de Laïsh
  rationale: Rendu patronymique courant et fidèle à l’hébreu.
- source_word: אֲשֶׁר מִגַּלִּים
  choice: qui était de Gallim
  rationale: La préposition מִן marque ici l’origine géographique; « être de » est idiomatique et concis en français.
theological_decisions:
- issue: Statut conjugal de Mikal après que Saül l’a donnée à Palti
  choice: Conserver l’expression « femme de David »
  alternative: Reformuler comme « qui avait été la femme de David »
  rationale: L’hébreu la désigne directement comme la femme de David. Le texte maintient ainsi une tension juridique et narrative qu’il ne faut pas atténuer par une reformulation au passé.
translation_notes:
  register: 'Français international moderne, sobre et narratif. Les noms propres suivent des graphies françaises courantes tout en restant proches de l’hébreu. Aucune note n’est nécessaire: la note anglaise fournie est incohérente, puisqu’elle présente deux fois la même graphie « Palti » et ne signale donc aucune véritable variante.'
