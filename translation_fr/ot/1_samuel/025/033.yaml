  text: וּ/בָר֥וּךְ טַעְמֵ֖/ךְ וּ/בְרוּכָ֣ה אָ֑תְּ אֲשֶׁ֨ר כְּלִתִ֜/נִי הַ/יּ֤וֹם הַ/זֶּה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הֹשֵׁ֥עַ יָדִ֖/י לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: fr
  text: Béni soit ton discernement[a], et bénie sois-tu, toi qui m’as retenu aujourd’hui de verser le sang[b] et de me faire justice de ma propre main[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton bon sens » ou « ton jugement ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « d’entrer dans les sangs » ; l’expression peut aussi évoquer la culpabilité liée au sang versé.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « et de sauver ma main pour moi ». L’expression peut aussi se rendre par « m’assurer moi-même la délivrance par ma main » ; dans ce contexte, elle évoque la vengeance personnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Béni soit
  rationale: La formule de bénédiction au participe passif est rendue par une tournure française exclamative, digne et naturelle.
- source_word: טַעְמֵךְ
  choice: ton discernement
  rationale: Dans ce contexte, טַעַם désigne le bon sens ou la capacité de juger dont Abigail a fait preuve en retenant David.
- source_word: וּבְרוּכָה אָתְּ
  choice: et bénie sois-tu
  rationale: L’accord féminin explicite l’adresse à Abigail et conserve le parallélisme de la formule hébraïque.
- source_word: כְּלִתִנִי
  choice: m’as retenu
  rationale: Le verbe exprime ici l’action d’empêcher ou de détourner David de son projet violent.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Cette formulation restitue naturellement en français moderne l’expression temporelle emphatique.
- source_word: מִבּוֹא בְדָמִים
  choice: de verser le sang
  rationale: L’expression littérale « entrer dans les sangs » désigne idiomatiquement le fait de commettre une effusion de sang, avec une possible nuance de culpabilité liée au sang.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: et de me faire justice de ma propre main
  rationale: La formulation rend dans ce contexte l’idée de se procurer soi-même délivrance ou réparation par une vengeance personnelle, sans réduire l’expression au seul sens abstrait de « se sauver ».
theological_decisions:
- issue: 'Nuance de דָּמִים : effusion de sang ou culpabilité liée au sang'
  choice: verser le sang
  alternative: se rendre coupable de meurtre / contracter une culpabilité liée au sang
  rationale: Le contexte immédiat met en avant le massacre projeté par David. Une note conserve toutefois la dimension morale et juridique possible du pluriel hébreu.
- issue: Sens contextuel de וְהֹשֵׁעַ יָדִי לִי
  choice: me faire justice de ma propre main
  alternative: me sauver de ma propre main
  rationale: Le sens lexical de délivrance demeure en arrière-plan, mais le récit concerne une vengeance par laquelle David entend obtenir lui-même réparation. La note maintient la formulation plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux bénédictions est conservé, tandis que les idiomes hébreux sont rendus clairement dans le texte et leurs nuances sont signalées en notes.
