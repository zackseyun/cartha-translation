source:
  edition: WLC
  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: fr
  text: Environ dix jours plus tard[a], Yahweh frappa Nabal, et celui-ci mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après environ dix jours. » L’expression hébraïque indique une période approximative de dix jours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: plus tard
  rationale: Dans cette suite narrative, la formule introduit l’événement suivant. « Plus tard » exprime naturellement en français la progression temporelle sans reproduire mécaniquement « et il arriva ».
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: Environ dix jours
  rationale: Le préfixe כְּ marque ici l’approximation. Cette formulation conserve à la fois la durée approximative et, avec « plus tard », son rapport au récit précédent.
- source_word: וַיִּגֹּף
  choice: frappa
  rationale: Le verbe נָגַף désigne une atteinte ou un coup infligé, souvent dans le cadre d’une action divine. « Frappa » garde la force et l’indétermination du terme sans préciser le moyen employé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle employée dans le texte hébreu.
- source_word: אֶת נָבָל
  choice: Nabal
  rationale: La particule אֶת, qui marque le complément d’objet direct, ne se traduit pas; le nom propre est conservé sous la forme « Nabal ».
- source_word: וַיָּמֹת
  choice: et celui-ci mourut
  rationale: Le second verbe est rendu comme un événement narratif distinct. « Celui-ci » évite une éventuelle hésitation sur l’antécédent tout en préservant la succession des deux propositions.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin. Sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Degré de causalité dans le jugement divin
  choice: Yahweh frappa Nabal, et celui-ci mourut
  alternative: Yahweh frappa Nabal à mort
  rationale: 'L’hébreu présente deux verbes successifs: Yahweh frappe Nabal, puis Nabal meurt. La traduction maintient cette séquence et l’affirmation d’une action divine sans les condenser en une formule causalement plus explicite.'
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique dignifié; « frappa » conserve la concision du texte source, tandis que la note signale l’autre agencement temporel naturel.
