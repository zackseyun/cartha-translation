base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: fr
  text: Prendrais-je mon pain, mon eau et mes bêtes que j’ai abattues pour ceux qui tondent mes moutons[b], et les donnerais-je à des hommes dont je ne sais pas d’où ils viennent[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et je prendrai… et je donnerai » ; l’hébreu emploie des formes accomplies dans une question rhétorique.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des ouvriers chargés de la tonte des moutons de Nabal.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Prendrais-je donc
  rationale: Le qatal à la première personne, coordonné dans cette question rhétorique, exprime ici une éventualité rejetée avec indignation. Le conditionnel interrogatif est naturel en français; « donc » fait ressortir la force contextuelle sans changer le contenu.
- source_word: לַחְמִי
  choice: mon pain
  rationale: Le sens concret de « pain » est conservé dans l’énumération des provisions, tout en laissant subsister sa possible portée alimentaire plus large.
- source_word: מֵימַי
  choice: mon eau
  rationale: La traduction littérale préserve l’insistance répétée de Nabal sur ce qui lui appartient.
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: la viande que j’ai abattue
  rationale: Cette formulation rend le produit de l’abattage et reprend verbalement la même racine, sans généraliser en « festin » ou en « nourriture ».
- source_word: לְגֹזְזָי
  choice: pour ceux qui tondent mes moutons
  rationale: Le participe désigne les tondeurs; l’ajout explicite de « mes moutons » rend immédiatement compréhensible le contexte pastoral en français moderne.
- source_word: וְנָתַתִּי
  choice: et les donnerais-je
  rationale: Le second qatal coordonné prolonge la même question rhétorique. Le pronom pluriel reprend collectivement le pain, l’eau et la viande.
- source_word: לַאֲנָשִׁים
  choice: à des hommes
  rationale: Le masculin pluriel hébreu est conservé, ainsi que la distance méprisante exprimée par Nabal.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: dont je ne sais même pas
  rationale: Avec la proposition d’origine qui suit, ידע porte naturellement sur la connaissance de leur provenance. « même pas » rend l’insistance indignée implicite dans la question, sans prétendre que Nabal ne connaît absolument rien d’eux.
- source_word: אֵי מִזֶּה הֵמָּה
  choice: d’où ils viennent
  rationale: Cette tournure idiomatique française exprime clairement la question de l’origine ou de la provenance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’accumulation des possessifs, qui souligne l’égoïsme indigné de Nabal. Le conditionnel interrogatif restitue la fonction rhétorique des formes verbales hébraïques. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
