  to: Prendrais-je mon pain, mon eau et mes bêtes que j’ai abattues pour ceux qui tondent mes moutons[b], et les donnerais-je à des hommes dont je ne sais pas d’où ils viennent[a] ?
  rationale: La révision remplace une expression française non naturelle par « mes bêtes que j’ai abattues », qui correspond au champ sémantique de l’abattage et conserve l’écho entre le nom et le verbe hébreux. Elle retire aussi l’intensification non nécessaire « même », tout en conservant le ton indigné de la question rhétorique.
