base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: fr
  text: 'Elle se leva, se prosterna le visage contre terre[a] et dit : « Voici ta servante : une esclave[b] pour laver les pieds des serviteurs de mon seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « s’inclina, le visage contre terre ». Cette posture exprime une profonde déférence.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici deux termes féminins proches, rendus par « servante » et « esclave ». La construction est elliptique : littéralement, « Voici ta servante, pour une esclave, pour laver… » ; elle exprime l’humble disponibilité d’Abigaïl sans préciser de verbe.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: וַתָּקָם
  choice: Elle se leva
  rationale: Le wayyiqtol de קום marque l’action suivante du récit ; « se leva » est direct et naturel en français moderne.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: se prosterna le visage contre terre
  rationale: L’expression décrit une profonde marque de soumission, le visage tourné jusqu’au sol. « Se prosterna » restitue clairement la posture sans l’affaiblir.
- source_word: הִנֵּה
  choice: Voici
  rationale: L’interjection introduit la présentation humble qu’Abigaïl fait d’elle-même. « Voici » conserve sa force déictique dans un registre digne et actuel.
- source_word: אֲמָתְךָ
  choice: ta servante
  rationale: אָמָה désigne ici une femme en position de service et sert de formule d’autodésignation déférente. « Ta servante » est idiomatique en français et garde le féminin.
- source_word: לְשִׁפְחָה
  choice: elle se fera esclave
  rationale: שִׁפְחָה est un second terme féminin de servitude. Cette formulation le distingue de אֲמָתְךָ et exprime l’abaissement volontaire d’Abigaïl, tout en rendant en français la construction nominal elliptique.
- source_word: לִרְחֹץ רַגְלֵי
  choice: pour laver les pieds
  rationale: L’infinitif précédé de לְ exprime ici le but ; la traduction française est directe.
- source_word: עַבְדֵי אֲדֹנִי
  choice: des serviteurs de mon seigneur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave ; dans cette formule de cour, « serviteurs » convient au personnel de David, tandis que « mon seigneur » conserve l’adresse honorifique אֲדֹנִי.
theological_decisions:
- issue: Les deux termes féminins de servitude, אָמָה et שִׁפְחָה
  choice: Les différencier par « servante » et « esclave »
  alternative: Traduire les deux par « servante »
  rationale: L’hébreu emploie deux mots proches mais distincts dans l’autodésignation d’Abigaïl. Les différencier préserve la progression rhétorique de son humilité sans prétendre fixer une hiérarchie sociale précise entre les deux termes.
- issue: La construction nominal elliptique אֲמָתְךָ לְשִׁפְחָה
  choice: '« ta servante : elle se fera esclave »'
  alternative: « ta servante est une esclave » ou « ta servante sera une servante »
  rationale: L’hébreu ne comporte pas de verbe exprimé. « Elle se fera » produit une phrase française naturelle dans le contexte de son acceptation tout en conservant, dans la note, l’ellipse et l’ambiguïté de la formulation source.
translation_notes:
  register: Français international moderne, digne et narratif. Le tutoiement correspond à l’adresse personnelle et hiérarchique du récit. « Mon seigneur » conserve la déférence sociale sans identifier אֲדֹנִי au titre divin.
