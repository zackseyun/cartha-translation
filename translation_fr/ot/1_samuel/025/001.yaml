base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: fr
  text: Samuel mourut. Tout Israël se rassembla, le pleura[a] et ils l’enterrèrent chez lui, à Rama. Puis David se leva et descendit au désert de Parân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se lamenta pour lui ». Le verbe hébreu désigne les lamentations et les rites de deuil accomplis pour un mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: Samuel mourut
  rationale: Rend simplement la mort de Samuel et laisse l’enchaînement narratif être porté naturellement par la succession des phrases, sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: Tout Israël se rassembla
  rationale: Conserve l’expression collective nationale « tout Israël » et rend naturellement le nifal de קבץ.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: se lamenta sur lui
  rationale: ספד désigne ici les lamentations et les rites de deuil accomplis pour un mort. Le singulier respecte le sujet collectif « tout Israël ».
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ בָּרָמָה
  choice: On l’enterra chez lui, à Rama
  rationale: « Chez lui » préserve la référence à la maison ou au domaine de Samuel sans imposer l’idée qu’il fut enseveli à l’intérieur même de l’habitation. Le pronom indéfini évite une répétition lourde du sujet collectif.
- source_word: וַיָּקָם דָּוִד
  choice: Puis David se leva
  rationale: Rend le mouvement narratif exprimé par קום, avec un connecteur français sobre qui marque la progression du récit.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: descendit vers le désert de Parân
  rationale: Conserve le sens topographique de ירד et rend מִדְבָּר par « désert », terme français courant pour une région sauvage et peu habitée. « Parân » suit une translittération française traditionnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique écrit. Les formulations « tout Israël », « chez lui » et « se leva » gardent la concision et plusieurs traits de l’hébreu sans produire un français artificiel.
