    text: 'Hébreu : « petite chose ou grande chose », expression signifiant qu’elle ne lui dit absolument rien.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jusqu’à l’aube ». Littéralement : « jusqu’à la lumière du matin ».'
    reason: lexical_alternative
