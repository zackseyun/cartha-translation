base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: fr
  text: Quand Abigaïl arriva chez Nabal, voici qu’il donnait chez lui un festin comme un festin de roi. Nabal avait le cœur en joie et il était très ivre. Elle ne lui dit donc absolument rien, ni peu ni beaucoup[a], jusqu’à la lumière du matin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « petite chose ou grande chose », expression signifiant qu’elle ne lui dit absolument rien.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jusqu’à l’aube ». Littéralement : « jusqu’à la lumière du matin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֲבִיגַיִל אֶל נָבָל וְהִנֵּה
  choice: Quand Abigaïl revint auprès de Nabal, elle le trouva
  rationale: Le waw consécutif poursuit le récit, tandis que וְהִנֵּה introduit la situation qu’Abigaïl découvre. « Elle le trouva » rend naturellement en français cet effet de découverte sans alourdir le récit avec « voici ».
- source_word: מִשְׁתֶּה בְּבֵיתוֹ כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: en train de donner chez lui un festin digne d’un roi
  rationale: מִשְׁתֶּה désigne un festin ou banquet, souvent arrosé. « Digne d’un roi » conserve la comparaison et exprime naturellement l’ampleur royale du festin.
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: Nabal avait le cœur en fête
  rationale: Cette expression française actuelle préserve l’image hébraïque du cœur tout en exprimant l’humeur joyeuse de Nabal dans le contexte du festin.
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: il était complètement ivre
  rationale: « Complètement ivre » rend clairement l’intensification עַד מְאֹד dans un français moderne et naturel.
- source_word: וְלֹא הִגִּידָה לוֹ דָּבָר קָטֹן וְגָדוֹל
  choice: Elle ne lui dit donc absolument rien, ni peu ni beaucoup
  rationale: La négation est explicitée par « absolument rien », et le mérisme hébreu « petit et grand » est rendu par l’expression française plus idiomatique « ni peu ni beaucoup ».
- source_word: עַד אוֹר הַבֹּקֶר
  choice: jusqu’aux premières lueurs du matin
  rationale: Cette formulation conserve l’image littérale de la lumière matinale tout en restant naturelle en français.
