revisions:
- from: Quand Abigaïl revint auprès de Nabal, elle le trouva en train de donner chez lui un festin digne d’un roi. Nabal avait le cœur en fête et il était complètement ivre. Elle ne lui dit donc absolument rien, ni peu ni beaucoup[a], jusqu’aux premières lueurs du matin[b].
  to: Quand Abigaïl arriva chez Nabal, voici qu’il donnait chez lui un festin comme un festin de roi. Nabal avait le cœur en joie et il était très ivre. Elle ne lui dit donc absolument rien, ni peu ni beaucoup[a], jusqu’à la lumière du matin[b].
  rationale: La révision supprime l’idée non explicite de retour, restitue la comparaison du festin de manière plus directe, rend l’intensif hébreu sans surinterprétation et harmonise la note avec le mérisme conservé en français. Elle maintient le ton narratif moderne et les deux ancres de note.
