source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: fr
  text: Quand Yahweh aura fait pour mon seigneur tout le bien qu’il a dit à ton sujet[a] et qu’il t’aura établi chef sur Israël[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le bien qu’il a promis à ton sujet ». Littéralement, l’hébreu parle du « bien » que Yahweh a dit au sujet de David.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’il t’aura chargé d’être chef sur Israël ». Le verbe signifie souvent « commander », mais il peut ici exprimer l’idée d’établir ou de charger quelqu’un d’une fonction dirigeante.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette tournure introduit ici une circonstance future. « Quand » est naturel en français et convient à la phrase qui se poursuit au verset suivant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לַאדֹנִי
  choice: pour mon seigneur
  rationale: Abigaïl s’adresse respectueusement à David; « mon seigneur » conserve cette déférence sans archaïsme excessif.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: tout le bien qu’il a annoncé à ton sujet
  rationale: « Annoncé » rend naturellement דִּבֶּר dans ce contexte de parole divine favorable, sans expliciter celle-ci en « promesse »; « à ton sujet » traduit עָלֶיךָ.
- source_word: וְצִוְּךָ לְנָגִיד
  choice: et qu’il t’aura établi chef
  rationale: צוה signifie couramment « commander », mais avec לְנָגִיד la construction désigne vraisemblablement l’établissement ou la désignation à une fonction d’autorité. « Chef » rend נָגִיד dans un français moderne.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: La préposition indique ici l’autorité exercée sur Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte le nom divin propre; la translittération préserve ce nom au lieu de lui substituer un titre.
- issue: Portée de וְצִוְּךָ לְנָגִיד
  choice: qu’il t’aura établi chef
  alternative: qu’il t’aura chargé d’être chef
  rationale: Le contexte soutient une désignation à la direction d’Israël, mais une note maintient visible le sens verbal plus littéral de « commander/charger ».
translation_notes:
  register: Français international moderne, digne et accessible. Le verset demeure syntaxiquement ouvert par une virgule, puisqu’il forme la proposition circonstancielle dont la suite et l’aboutissement se trouvent au verset 31.
