  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: fr
  text: 'David dit à Abigaïl : « Béni soit Yahweh, le Dieu d’Israël, qui t’a envoyée aujourd’hui[a] à ma rencontre ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce jour-ci ».'
    reason: L’expression hébraïque הַיּוֹם הַזֶּה signifie littéralement « ce jour-ci » ; « aujourd’hui » en est un rendu idiomatique en français moderne.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: David dit
  rationale: Le wayyiqtol fait progresser le récit. En français narratif, le passé simple rend naturellement cette action ponctuelle sans qu’il soit nécessaire de reproduire le ו initial par « et ».
- source_word: לַאֲבִיגַל
  choice: à Abigaïl
  rationale: La préposition ל marque ici la destinataire des paroles. « À Abigaïl » est la tournure française naturelle.
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif appartient à une formule de bénédiction ou de louange. « Béni soit » en conserve la solennité tout en restant clair en français contemporain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. La translittération « Yahweh » le distingue du titre « Seigneur ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette construction à l’état construit identifie Yahweh comme le Dieu d’Israël; l’article défini donne une formulation française idiomatique.
- source_word: אֲשֶׁר שְׁלָחֵךְ
  choice: qui t’a envoyée
  rationale: אֲשֶׁר introduit une relative dont Yahweh est l’antécédent. Le passé composé exprime une action accomplie dont l’effet demeure présent; l’accord au féminin reflète le suffixe de deuxième personne féminine singulière désignant Abigaïl.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: L’expression signifie littéralement « ce jour-ci ». « Aujourd’hui » en restitue directement le sens temporel dans un français actuel; une note conserve la formulation plus littérale.
- source_word: לִקְרָאתִי
  choice: à ma rencontre
  rationale: La construction לִקְרַאת avec suffixe exprime le mouvement vers une rencontre. « À ma rencontre » est idiomatique et maintient le point de vue de David.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin יהוה et non un titre. « Yahweh » préserve cette donnée textuelle sans substituer une appellation confessionnelle.
- issue: Agent de l’envoi d’Abigaïl
  choice: qui t’a envoyée
  alternative: qui a permis que tu viennes
  rationale: La proposition relative attribue grammaticalement l’envoi à Yahweh. La traduction conserve cette affirmation directe sans l’atténuer ni préciser le mode de l’action divine.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration écrite; le passé composé dans la parole de David souligne l’action accomplie liée à la situation présente. L’exclamation finale rend la force de la formule de bénédiction sans ajouter de contenu.
