base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: fr
  text: 'Il y avait à Maon un homme dont les affaires étaient à Carmel[a]. Cet homme était très riche[b] : il possédait trois mille moutons et mille chèvres. Il était en train de tondre ses moutons à Carmel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont le travail était à Carmel » ou « dont les biens étaient à Carmel ». Le terme hébreu peut désigner le travail, les affaires ou les possessions d’une personne.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’homme était très grand », ce qui peut évoquer son importance sociale aussi bien que sa richesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּמָעוֹן
  choice: à Maon un homme
  rationale: Formule narrative indéfinie rendue naturellement en français, avec le toponyme translittéré.
- source_word: מַעֲשֵׂהוּ
  choice: ses activités
  rationale: Le terme peut désigner le travail, les affaires ou les biens d’une personne. « Activités » conserve cette largeur de sens sans réduire d’emblée le référent à une entreprise commerciale ou à une propriété.
- source_word: בַכַּרְמֶל
  choice: à Carmel
  rationale: Il s’agit ici du toponyme Carmel; la préposition française « à » convient au nom de lieu.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: Cet homme était très riche
  rationale: Dans ce contexte, la « grandeur » est principalement socio-économique, comme l’indique immédiatement l’énumération de son bétail.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: il possédait trois mille moutons et mille chèvres
  rationale: La construction possessive hébraïque est rendue par une formulation française claire; les nombres sont conservés exactement.
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: Il était alors en train de tondre ses moutons
  rationale: La construction présente une action en cours qui forme la circonstance narrative. « Alors » marque cette progression sans introduire un « maintenant » temporel absent de l’hébreu.
