base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: fr
  text: 'David prit de sa main ce qu’elle lui avait apporté, puis il lui dit : « Remonte en paix chez toi. Vois, je t’ai écoutée et je t’ai accordé ma faveur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai relevé ton visage » ; l’expression peut aussi signifier « je t’ai accueillie favorablement » ou « j’ai accepté ta requête ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח דָּוִד מִיָּדָהּ
  choice: David prit donc de sa main
  rationale: Conserve le sens concret de לקח et l’image explicite de la main, tout en employant un ordre naturel en français.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: ce qu’elle lui avait apporté
  rationale: Le plus-que-parfait situe naturellement l’apport d’Abigaïl avant le geste de David et rend fidèlement la proposition relative.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: Remonte en paix chez toi
  rationale: « Remonte » préserve le mouvement exprimé par עלה dans ce contexte; « chez toi » rend idiomatiquement la destination לְבֵיתֵךְ en français moderne.
- source_word: רְאִי
  choice: Vois
  rationale: Maintient l’impératif qui attire l’attention, sans recourir à l’archaïque « voici » ou « regarde donc ».
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: je t’ai écoutée
  rationale: Rend le sens contextuel d’avoir entendu et pris en compte l’appel d’Abigaïl; le féminin est requis par la destinataire.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: je t’ai accordé ma faveur
  rationale: Exprime naturellement la valeur idiomatique de « relever/porter le visage » dans ce contexte, où David accueille favorablement la personne et sa requête.
theological_decisions:
- issue: Portée de l’expression idiomatique וָאֶשָּׂא פָּנָיִךְ
  choice: je t’ai accordé ma faveur
  alternative: je t’ai accueillie favorablement / j’ai relevé ton visage
  rationale: La traduction retient l’idée de faveur et d’acceptation sans transformer l’expression en affirmation doctrinale. Une note conserve l’image littérale et les autres nuances possibles.
translation_notes:
  register: Français international moderne, naturel et digne. « Remonte » conserve la nuance spatiale du texte hébreu; « chez toi » évite la raideur de « vers ta maison ». Le marqueur [a] est placé immédiatement après l’expression idiomatique expliquée.
