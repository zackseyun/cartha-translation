  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: fr
  text: Quand Abigaïl vit David, elle s’empressa de descendre de son âne. Puis elle tomba devant David, la face contre terre, et se prosterna à terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’inclina profondément à terre ». Le verbe hébreu peut désigner une profonde inclination ou une prosternation ; ici, il exprime l’hommage rendu à David, sans impliquer nécessairement une adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: vit
  rationale: Le verbe ראה désigne ici simplement le fait de voir; « vit » est l’équivalent narratif naturel.
- source_word: וַתְּמַהֵר
  choice: s’empressa
  rationale: מהר exprime la rapidité et l’urgence. « S’empressa de » convient au français moderne et s’enchaîne naturellement avec l’infinitif.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: descendre de son âne
  rationale: ירד signifie « descendre ». Le possessif est idiomatique en français dans ce contexte, bien que l’hébreu emploie l’article défini.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל פָּנֶיהָ
  choice: elle tomba face contre terre devant David
  rationale: Cette formulation conserve à la fois l’idée de tomber devant David et la position concrète du visage contre terre, sans introduire les « pieds », absents de l’hébreu.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: se prosterna jusqu’à terre
  rationale: Dans cette rencontre humaine, שׁחה décrit un geste profond d’hommage ou de soumission. « Se prosterna » rend mieux l’intensité du geste que le simple « s’inclina », sans impliquer nécessairement un culte divin.
theological_decisions:
- issue: Sens de שׁחה dans un hommage rendu à un être humain
  choice: se prosterna jusqu’à terre
  alternative: adora; s’inclina jusqu’à terre
  rationale: Le contexte décrit l’hommage d’Abigaïl envers David, non nécessairement une adoration religieuse. La traduction conserve la force physique du geste tout en évitant d’y importer le langage du culte divin.
translation_notes:
  register: Français international moderne, narratif et digne. « Face contre terre » restitue clairement la posture; « se prosterna » garde la force du geste d’hommage. Le découpage en deux phrases allège une longue coordination hébraïque sans modifier la succession des actions.
