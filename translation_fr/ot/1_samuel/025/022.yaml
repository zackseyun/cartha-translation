base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: fr
  text: Que Dieu fasse ainsi aux ennemis de David[a], et qu’il fasse encore davantage, si, d’ici au matin, je laisse en vie un seul mâle[b] parmi tous ceux qui lui appartiennent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains interprètes considèrent « les ennemis de David » comme un euphémisme scribal pour « David » ou « moi », car cette formule de serment appelle habituellement la malédiction sur celui qui parle.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « quelqu’un qui urine contre un mur », expression crue désignant un mâle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: Que Dieu traite ainsi… et qu’il leur inflige pire encore
  rationale: Formule hébraïque traditionnelle de serment et de malédiction. Cette formulation française en conserve la force imprécatoire sans reproduire lourdement la répétition.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré la forme morphologiquement plurielle du nom, le verbe est au singulier et il s’agit ici de Dieu dans une formule de serment.
- source_word: לְאֹיְבֵי דָוִד
  choice: les ennemis de David
  rationale: Le texte massorétique porte cette expression inattendue; elle est conservée dans le texte principal plutôt que corrigée silencieusement.
- source_word: אִם
  choice: si
  rationale: Dans cette formule de serment, אִם introduit la condition qui déclenche la malédiction; «si» préserve naturellement cette structure en français.
- source_word: אַשְׁאִיר
  choice: je laisse en vie
  rationale: Le hiphil de שׁאר signifie «laisser, faire rester». Dans ce contexte de menace de mort, «laisser en vie» explicite naturellement le sens sans aller jusqu’au terme plus interprétatif «épargner».
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: parmi tous ceux qui lui appartiennent
  rationale: La tournure possessive est rendue personnellement puisque l’expression suivante désigne des êtres humains de sexe masculin.
- source_word: עַד הַבֹּקֶר
  choice: d’ici demain matin
  rationale: Expression française naturelle marquant l’échéance fixée par le locuteur.
- source_word: מַשְׁתִּין בְּקִיר
  choice: un seul mâle
  rationale: L’expression hébraïque, littéralement «quelqu’un qui urine contre un mur», est une désignation crue et méprisante des mâles. Le texte principal en donne clairement le référent et la note en conserve la forme concrète.
theological_decisions:
- issue: La formulation massorétique «les ennemis de David» dans le serment
  choice: Conserver «les ennemis de David» dans le texte principal
  alternative: Comprendre ou corriger en «David» ou «moi», conformément à la forme habituelle d’un serment où celui qui parle appelle la malédiction sur lui-même
  rationale: La formulation attestée par le texte source est maintenue afin de ne pas résoudre silencieusement une difficulté réelle. La possibilité d’un euphémisme ou d’une modification scribale est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La rudesse de l’idiome hébreu est signalée en note; la formulation inhabituelle du serment est conservée dans le texte principal. Les marqueurs [a] et [b] figurent tous deux dans le texte.
