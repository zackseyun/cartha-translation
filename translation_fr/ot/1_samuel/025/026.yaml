source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: fr
  text: Maintenant, mon seigneur, aussi vrai que Yahweh est vivant et que tu es vivant, puisque Yahweh t’a empêché de te rendre coupable d’effusion de sang et de te sauver par ta propre main[a], que tes ennemis et ceux qui cherchent à faire du mal à mon seigneur soient comme Nabal[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans ce contexte, on peut aussi comprendre : « de te faire justice toi-même » ou « de te venger de ta propre main ».'
    reason: L’expression hébraïque signifie littéralement que la main de David le sauve ou le délivre lui-même, tandis que le contexte vise une vengeance violente.
  - marker: b
    text: Nabal est le nom du mari d’Abigaïl; ce nom fait aussi écho au mot hébreu qui signifie « insensé ».
    reason: La note conserve le jeu de mots hébreu sans remplacer le nom propre dans le texte.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: L’adverbe עַתָּה est explicite dans le texte hébreu. En tête de phrase, « Maintenant » conserve la transition du discours d’Abigaïl; la seconde occurrence est rendue naturellement par la tournure exhortative « que… ».
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Titre de respect adressé à David. « Mon seigneur » garde la déférence sans désigner ici la divinité.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: aussi vrai que Yahweh est vivant et que tu es vivant
  rationale: Cette formulation française naturelle rend la double formule de serment. « Tu es vivant » exprime idiomatiquement חֵי נַפְשְׁךָ, littéralement lié à la vie de l’interlocuteur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui préserve son caractère de nom propre plutôt que de lui substituer un titre.
- source_word: מְנָעֲךָ
  choice: t’a empêché de
  rationale: Le verbe exprime ici l’action de retenir David et de l’empêcher d’accomplir son projet violent.
- source_word: מִבּוֹא בְדָמִים
  choice: de te rendre coupable d’avoir versé le sang
  rationale: L’expression, littéralement « d’entrer dans les sangs », évoque à la fois l’effusion de sang et la culpabilité qui en découle. La formulation française rend explicitement cette portée morale dans le contexte.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: et de te sauver par ta propre main
  rationale: Cette traduction conserve le sens lexical de ישׁע, « sauver, délivrer », ainsi que l’image de la main. Le contexte de vengeance personnelle est signalé en note sans être imposé au texte principal.
- source_word: יִהְיוּ כְנָבָל
  choice: deviennent comme Nabal
  rationale: נָבָל désigne d’abord le personnage nommé Nabal. « Deviennent » convient à la valeur souhaitée de la proposition et à la menace implicite concernant son sort.
- source_word: אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: tes ennemis et ceux qui cherchent à faire du mal à mon seigneur
  rationale: Cette formulation actuelle et claire rend l’expression hébraïque « chercher le mal contre quelqu’un » sans raideur inutile.
theological_decisions:
- issue: Portée de מִבּוֹא בְדָמִים
  choice: La phrase désigne l’effusion de sang envisagée comme une culpabilité dont Yahweh préserve David.
  alternative: « de verser le sang » ou « d’en venir au sang »
  rationale: Le pluriel דָּמִים peut désigner le sang versé et la responsabilité qui s’y attache. Le contexte moral justifie d’exprimer la culpabilité, sans préciser davantage la catégorie juridique.
- issue: Sens de וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: « de te sauver par ta propre main »
  alternative: « de te faire justice toi-même » ou « de te venger de ta propre main »
  rationale: Le contexte soutient fortement l’idée de vengeance, mais le verbe hébreu signifie formellement « sauver, délivrer ». Le texte principal conserve cette tension lexicale et la note présente l’interprétation contextuelle.
- issue: Résonance du nom נָבָל
  choice: Le nom propre « Nabal » est maintenu dans le texte.
  alternative: « un insensé »
  rationale: Le référent immédiat est le mari d’Abigaïl. Le jeu avec le nom commun hébreu signifiant « insensé » est réel, mais secondaire; il est donc indiqué en note.
translation_notes:
  register: Français international moderne, digne et accessible. La double formule de serment reste solennelle sans recourir à l’expression plus littérale mais moins naturelle « aussi vrai que ton âme est vivante ». Le vouvoiement n’est pas employé, conformément au tutoiement narratif traditionnel et à la deuxième personne singulière du texte.
