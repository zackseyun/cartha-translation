revisions:
- from: Maintenant, mon seigneur, aussi vrai que Yahweh est vivant et que tu es vivant, puisque Yahweh t’a empêché de te rendre coupable d’avoir versé le sang et de te sauver par ta propre main[a], que tes ennemis et ceux qui cherchent à faire du mal à mon seigneur deviennent comme Nabal[b] !
  to: Maintenant, mon seigneur, aussi vrai que Yahweh est vivant et que tu es vivant, puisque Yahweh t’a empêché de te rendre coupable d’effusion de sang et de te sauver par ta propre main[a], que tes ennemis et ceux qui cherchent à faire du mal à mon seigneur soient comme Nabal[b] !
  rationale: 'La révision est limitée à deux ajustements sûrs : « effusion de sang » évite de présenter comme accompli le meurtre dont David est retenu, et « soient comme Nabal » reflète plus directement la valeur jussive du verbe hébreu. Les deux notes et leurs ancres demeurent appropriées et sont conservées.'
