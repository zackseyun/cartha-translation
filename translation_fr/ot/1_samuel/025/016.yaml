source:
  edition: WLC
  text: חוֹמָה֙ הָי֣וּ עָלֵ֔י/נוּ גַּם לַ֖יְלָה גַּם יוֹמָ֑ם כָּל יְמֵ֛י הֱיוֹתֵ֥/נוּ עִמָּ֖/ם רֹעִ֥ים הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/016.yaml
  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: fr
  text: Ils ont été une muraille autour de nous, de nuit comme de jour, tout le temps que nous avons passé avec eux à garder le troupeau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « troupeau » désigne collectivement le petit bétail et peut comprendre des moutons comme des chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: comme une muraille
  rationale: Le nom désigne littéralement une muraille. L’ajout de « comme » rend naturelle en français la fonction métaphorique du groupe tout en conservant l’image concrète de l’hébreu.
- source_word: הָיוּ
  choice: ils ont été
  rationale: Le qal accompli de היה fonctionne ici comme copule et décrit le rôle protecteur durable de ces hommes dans le passé.
- source_word: עָלֵינוּ
  choice: autour de nous
  rationale: Bien que על signifie couramment « sur » ou « au-dessus de », associé à « muraille » il exprime ici une présence protectrice entourant les bergers.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: de nuit comme de jour
  rationale: Cette tournure française naturelle conserve l’insistance de la construction corrélative גם…גם sur une protection continuelle.
- source_word: כָּל יְמֵי
  choice: pendant tout le temps
  rationale: Dans ce contexte temporel, cette formulation idiomatique transmet la totalité de la période exprimée littéralement par « tous les jours ».
- source_word: הֱיוֹתֵנוּ עִמָּם
  choice: où nous avons été avec eux
  rationale: L’infinitif construit avec suffixe pronominal indique la période durant laquelle les locuteurs se trouvaient avec ces hommes; une proposition finie est naturelle en français moderne.
- source_word: רֹעִים
  choice: à garder
  rationale: Le participe de רעה désigne l’action de faire paître et de prendre soin du petit bétail; « garder » convient naturellement au contexte pastoral.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: צאן est un collectif pouvant comprendre des moutons et des chèvres; « troupeau » en préserve l’étendue sans le réduire aux seuls moutons.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’image concrète de la muraille est conservée, tandis que la syntaxe est rendue idiomatique. « De nuit comme de jour » maintient l’insistance et l’ordre de l’hébreu.
