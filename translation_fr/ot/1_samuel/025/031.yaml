  text: וְ/לֹ֣א תִהְיֶ֣ה זֹ֣את לְ/ךָ֡ לְ/פוּקָה֩ וּ/לְ/מִכְשׁ֨וֹל לֵ֜ב לַ/אדֹנִ֗/י וְ/לִ/שְׁפָּךְ דָּם֙ חִנָּ֔ם וּ/לְ/הוֹשִׁ֥יעַ אֲדֹנִ֖/י ל֑/וֹ וְ/הֵיטִ֤ב יְהוָה֙ לַֽ/אדֹנִ֔/י וְ/זָכַרְתָּ֖ אֶת אֲמָתֶֽ/ךָ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: fr
  text: Alors, cela ne sera pour toi ni une cause de remords[a] ni un poids sur la conscience de mon seigneur[b], parce que tu auras versé du sang sans raison ou que mon seigneur se sera fait justice lui-même[c]. Lorsque Yahweh aura fait du bien à mon seigneur, souviens-toi de ta servante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est rare. Il peut évoquer une occasion de trébucher, une cause de trouble ou un remords douloureux.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un obstacle pour le cœur de mon seigneur ».'
    reason: literal_rendering
  - marker: c
    text: 'Littéralement : « se sauver lui-même ». Dans ce contexte, il s’agit pour David de prendre lui-même en main sa défense ou sa vengeance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: une cause de remords
  rationale: Ce nom rare évoque vraisemblablement un faux pas, un choc intérieur ou une cause de regret douloureux. Dans le contexte, Abigaïl avertit David du remords futur que provoquerait un meurtre injustifié.
- source_word: מִכְשׁוֹל לֵב
  choice: un poids sur la conscience
  rationale: Littéralement « un obstacle pour le cœur ». La formulation française exprime naturellement le trouble moral intérieur tout en signalant l’image hébraïque en note.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: mon seigneur
  rationale: Formule de respect employée par Abigaïl envers David, sans connotation divine dans ce contexte.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: verser le sang sans raison
  rationale: חִנָּם désigne ici une effusion de sang gratuite ou sans juste motif.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: se faire justice lui-même
  rationale: Le verbe signifie ordinairement « sauver, délivrer », mais le contexte oppose l’action violente de David à la délivrance que Yahweh lui accordera. La traduction contextuelle conserve l’idée d’une intervention entreprise pour son propre compte, tandis que la lecture plus littérale est donnée en note.
- source_word: וְהֵיטִב יְהוָה
  choice: lorsque Yahweh aura fait du bien
  rationale: La suite verbale a ici une orientation future et temporelle dans la bouche d’Abigaïl.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu.
- source_word: אֲמָתֶךָ
  choice: ta servante
  rationale: Le nom hébreu est explicitement féminin et constitue ici l’humble manière dont Abigaïl se désigne elle-même.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de לְהוֹשִׁיעַ ... לוֹ dans ce contexte
  choice: se faire justice lui-même
  alternative: se sauver lui-même
  rationale: La formulation hébraïque peut être rendue littéralement par « se sauver lui-même », mais le récit concerne David prêt à obtenir réparation par une vengeance sanglante. La note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement implicite du discours respectueux est rendu par « mon seigneur »; « ta servante » conserve toutefois la forme relationnelle directe et humble de l’hébreu. Les deux conséquences morales sont formulées avec fluidité, et les images ou ambiguïtés inhabituelles sont conservées en notes.
