  text: וְ/לַ/אֲבִיגַ֨יִל֙ אֵ֣שֶׁת נָבָ֔ל הִגִּ֧יד נַֽעַר אֶחָ֛ד מֵ/הַ/נְּעָרִ֖ים לֵ/אמֹ֑ר הִנֵּ֣ה שָׁלַח֩ דָּוִ֨ד מַלְאָכִ֧ים מֵֽ/הַ/מִּדְבָּ֛ר לְ/בָרֵ֥ךְ אֶת אֲדֹנֵ֖י/נוּ וַ/יָּ֥עַט בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: fr
  text: 'Mais l’un des jeunes gens informa Abigaïl, la femme de Nabal : « Écoute, David a envoyé des messagers depuis le désert pour saluer[a] notre maître, et il s’en est pris à eux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour bénir » ; le verbe hébreu peut ici désigner une salutation courtoise.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est très expressif : il peut évoquer le fait de fondre sur quelqu’un ou de s’en prendre violemment à lui.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: Mais… Abigaïl
  rationale: La conjonction poursuit le récit tout en marquant ici le contraste avec le refus de Nabal rapporté au verset précédent.
- source_word: הִגִּיד
  choice: informa
  rationale: Le hiphil de נגד signifie annoncer, rapporter ou informer; « informa » convient naturellement à un serviteur transmettant un rapport.
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: l’un des jeunes gens
  rationale: Cette formulation conserve le sens large de נער sans préciser davantage que le contexte qu’il s’agit de membres de la maisonnée.
- source_word: הִנֵּה
  choice: Écoute
  rationale: Dans cette prise de parole, la particule attire vivement l’attention d’Abigaïl; « Écoute » est idiomatique en français moderne.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Le contexte humain et diplomatique impose le sens de messagers, et non celui d’anges.
- source_word: מֵהַמִּדְבָּר
  choice: du désert
  rationale: Le terme désigne la région inculte où séjournaient David et ses hommes; « désert » est naturel et précis dans ce contexte.
- source_word: לְבָרֵךְ
  choice: pour saluer
  rationale: Bien que ברך signifie ordinairement « bénir », il désigne ici une salutation courtoise, comme le montre le contexte immédiat.
- source_word: אֶת אֲדֹנֵינוּ
  choice: notre maître
  rationale: Dans la bouche d’un membre de la maisonnée, אדון désigne Nabal en tant que maître, sans portée divine.
- source_word: וַיָּעַט בָּהֶם
  choice: mais celui-ci s’est emporté contre eux
  rationale: Le verbe très expressif évoque le fait de fondre sur quelqu’un ou de l’accabler avec agressivité; cette formulation française garde la vigueur et l’indétermination relative entre attaque verbale et mouvement hostile.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formule introductive hébraïque « disant » n’est pas reproduite mécaniquement; les deux-points assurent une transition naturelle vers le discours direct. Le second « mais » explicite le contraste interne entre la démarche courtoise de David et la réaction agressive de Nabal.
