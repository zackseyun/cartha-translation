revisions:
- from: 'Mais l’un des jeunes gens informa Abigaïl, la femme de Nabal : « Écoute, David a envoyé du désert des messagers pour saluer notre maître[a], mais celui-ci s’est emporté contre eux[b]. »'
  to: 'Mais l’un des jeunes gens informa Abigaïl, la femme de Nabal : « Écoute, David a envoyé des messagers depuis le désert pour saluer[a] notre maître, et il s’en est pris à eux[b]. »'
  rationale: La révision corrige l’ancrage de la note sur le rendu de לברך et emploie une expression française plus vigoureuse pour וַיָּעַט בָּהֶם. Elle maintient le registre narratif moderne, la fonction sociale de « notre maître » et l’ambiguïté contrôlée du verbe final.
