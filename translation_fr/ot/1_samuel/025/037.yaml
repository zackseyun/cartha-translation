base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: fr
  text: Le matin, lorsque les effets du vin se furent dissipés chez Nabal[a], sa femme lui rapporta ces faits. Son cœur mourut en lui[b], et il devint comme une pierre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quand le vin fut sorti de Nabal », c’est-à-dire quand il eut retrouvé sa sobriété ou que les effets du vin se furent dissipés.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi comprendre : « son cœur défaillit en lui ». L’hébreu emploie une image forte, sans donner de diagnostic médical précis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: Le matin
  rationale: Expression temporelle française naturelle et fidèle à l’hébreu.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: quand Nabal eut cuvé son vin
  rationale: L’expression hébraïque signifie littéralement que « le vin sortit de Nabal ». « Couver son vin » rend naturellement en français le retour à la sobriété, tandis que la note conserve l’image concrète de l’original.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: sa femme lui raconta
  rationale: Le hifil de נגד signifie annoncer, raconter ou rapporter. « Raconta » convient au récit des événements survenus.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: tout ce qui s’était passé
  rationale: דברים peut désigner des paroles, des choses ou des faits. Dans ce contexte, Abigail rapporte les événements de la nuit précédente; cette formulation française en exprime naturellement le sens.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: son cœur mourut au-dedans de lui
  rationale: Conserve l’image hébraïque saisissante sans lui substituer un diagnostic médical précis.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: il devint comme une pierre
  rationale: Rend idiomatiquement la comparaison hébraïque tout en préservant son ambiguïté descriptive.
theological_decisions:
- issue: Faut-il donner un diagnostic médical précis de l’état de Nabal ?
  choice: 'Préserver les images : « son cœur mourut au-dedans de lui » et « il devint comme une pierre ».'
  alternative: Il eut une crise cardiaque; il fut victime d’un accident vasculaire cérébral; son cœur lâcha et il fut paralysé.
  rationale: Le texte décrit l’effondrement de Nabal par des images narratives et non par des termes médicaux techniques. La traduction ne tranche donc pas entre le choc, la défaillance cardiaque, la paralysie ou un autre état.
translation_notes:
  register: Français international moderne, narratif et digne. « Eut cuvé son vin » est idiomatique sans être familier. Les images corporelles de l’hébreu sont maintenues dans la seconde moitié du verset, et les deux appels de note [a] et [b] figurent dans le texte.
