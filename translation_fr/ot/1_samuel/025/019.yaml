id: 1SA.25.19
reference: 1 Samuel 25:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לִ/נְעָרֶ֨י/הָ֙ עִבְר֣וּ לְ/פָנַ֔/י הִנְ/נִ֖י אַחֲרֵי/כֶ֣ם בָּאָ֑ה וּ/לְ/אִישָׁ֥/הּ נָבָ֖ל לֹ֥א הִגִּֽידָה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: fr
  text: 'Elle dit à ses serviteurs : « Passez devant moi. Je vais vous suivre[a]. » Mais elle n’en dit rien à son mari Nabal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Me voici, venant derrière vous. »'
    reason: La note préserve le déictique הִנְנִי, l’aspect participial de בָּאָה et l’image spatiale de אַחֲרֵיכֶם, rendus plus idiomatiquement dans le texte principal.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le wayyiqtol poursuit simplement la narration ; en français, le passé simple exprime naturellement cette succession sans qu’un connecteur soit nécessaire.
- source_word: לִנְעָרֶיהָ
  choice: à ses serviteurs
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. Ici, il s’agit des hommes d’Abigaïl chargés de transporter les provisions ; « serviteurs » rend clairement leur fonction en français courant.
- source_word: עִבְרוּ לְפָנַי
  choice: Passez devant moi
  rationale: L’impératif de עבר associé à לְפָנַי demande aux serviteurs de partir et d’avancer devant elle. Cette formulation conserve l’image spatiale de l’hébreu tout en restant naturelle.
- source_word: הִנְנִי אַחֲרֵיכֶם בָּאָה
  choice: Je vais vous suivre
  rationale: L’expression présente Abigaïl comme venant à la suite de ses serviteurs. Le futur proche rend naturellement en français l’action imminente du participe hébreu ; la note conserve une formulation plus proche de la structure et de l’image spatiale de l’original.
- source_word: וּלְאִישָׁהּ
  choice: Mais … à son mari
  rationale: אִישׁ désigne ici sans ambiguïté contextuelle le mari d’Abigaïl. « Mais » explicite le contraste narratif entre les instructions données aux serviteurs et ce qui est caché à Nabal.
- source_word: נָבָל
  choice: Nabal
  rationale: Le nom propre est translittéré selon sa forme usuelle en français biblique.
- source_word: לֹא הִגִּידָה
  choice: elle n’en dit rien
  rationale: Le hiphil de נגד signifie faire savoir, raconter ou informer. Avec le pronom « en », cette tournure française exprime naturellement qu’elle ne révéla pas son projet à Nabal.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue est direct et naturel ; « serviteurs » privilégie la fonction contextuelle plutôt que l’âge possible des hommes. La ponctuation française et les espaces avant les deux-points sont respectées.
