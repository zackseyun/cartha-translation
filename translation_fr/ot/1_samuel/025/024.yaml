  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: fr
  text: 'Elle tomba à ses pieds et dit[a] : « Que la faute soit sur moi, mon seigneur ! Permets, je t’en prie, à ta servante de te parler, et écoute les paroles de ta servante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sur moi, mon seigneur, soit la faute ! » L’hébreu emploie une formule très condensée par laquelle Abigaïl assume la faute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: Elle tomba à ses pieds
  rationale: Rend directement le geste de supplication exprimé par l’hébreu, dans un français naturel.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: Que la faute retombe sur moi, mon seigneur !
  rationale: Conserve l’idée hébraïque d’une faute qu’Abigaïl prend sur elle, tout en explicitant naturellement la tournure nominale très condensée.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Marque la déférence envers David sans désigner ici le Seigneur divin.
- source_word: וּתְדַבֶּר נָא
  choice: Laisse, je t’en prie, … parler
  rationale: Le tour avec נָא exprime une demande pressante mais polie; cette formulation française en garde la force respectueuse.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: ta servante
  rationale: Le nom hébreu est explicitement féminin. « Servante » est actuel, clair et conserve l’auto-abaissement d’Abigaïl ainsi que la répétition du texte.
- source_word: בְּאָזְנֶיךָ
  choice: à tes oreilles
  rationale: Préserve l’image hébraïque tout en restant compréhensible dans ce discours solennel.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: et écoute les paroles de
  rationale: « Écoute » rend ici l’appel à prêter attention, tandis que « les paroles » maintient la formulation du texte source.
