  source_fidelity: Le sens général est fidèle, y compris le geste de supplication, l’auto-attribution de la faute et le double emploi déférent de « ta servante ». Toutefois, « retombe sur moi » ajoute l’image d’une faute qui revient ou s’abat, absente de la formule nominale hébraïque, et « à tes oreilles » est un calque peu naturel ici.
  naturalness: Le registre est convenablement respectueux et solennel. En français moderne, « Permets, je t’en prie, à ta servante de te parler » rend plus naturellement la demande de pouvoir parler « à l’écoute » de David que « parler à tes oreilles ».
  terminology: « Mon seigneur » et « ta servante » conviennent au rapport social et à la forme féminine אמה. « Faute » est un bon équivalent contextuel de הֶעָוֹן.
