  text: אַל נָ֣א יָשִׂ֣ים אֲדֹנִ֣/י אֶת לִבּ֡/וֹ אֶל אִישׁ֩ הַ/בְּלִיַּ֨עַל הַ/זֶּ֜ה עַל נָבָ֗ל כִּ֤י כִ/שְׁמ/וֹ֙ כֶּן ה֔וּא נָבָ֣ל שְׁמ֔/וֹ וּ/נְבָלָ֖ה עִמּ֑/וֹ וַֽ/אֲנִי֙ אֲמָ֣תְ/ךָ֔ לֹ֥א רָאִ֛יתִי אֶת נַעֲרֵ֥י אֲדֹנִ֖/י אֲשֶׁ֥ר שָׁלָֽחְתָּ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: fr
  text: 'Je t’en prie, mon seigneur, ne fais pas attention à cet homme sans valeur, à Nabal. Car il est tel que son nom : Nabal[a] est son nom, et la folie l’accompagne. Mais moi, ta servante, je n’ai pas vu les jeunes gens que mon seigneur a envoyés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Nabal » rappelle les mots hébreux pour « insensé » et « folie » ; Abigaïl fait ici un jeu de mots entre son nom et son caractère.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: prête pas attention à
  rationale: Cette expression française naturelle rend l’idée de diriger son attention et sa considération vers quelqu’un. Une traduction littérale comme « mette son cœur sur » serait trompeuse en français moderne.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: homme indigne
  rationale: Dans ce contexte, בְּלִיַּעַל qualifie moralement Nabal comme un homme vil ou sans valeur; « indigne » conserve l’insulte sans traiter le terme comme un nom propre.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: Car il est bien tel que son nom
  rationale: Cette formulation conserve la structure proverbiale et le lien explicite entre le nom de Nabal et son caractère.
- source_word: נָבָל / נְבָלָה
  choice: Nabal / la folie
  rationale: Le nom propre est translittéré, tandis que « folie » rend le mot apparenté נְבָלָה et préserve le jeu de mots au moyen d’une note.
- source_word: אֲמָתְךָ
  choice: ta servante
  rationale: Le substantif hébreu est féminin et appartient ici à une formule d’humilité. « Ta servante » est naturel, précis et non archaïque.
- source_word: נַעֲרֵי
  choice: les jeunes gens
  rationale: Le terme désigne littéralement de jeunes hommes, ici les hommes envoyés par David; ce choix reste proche du lexique sans ajouter leur fonction.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une formule respectueuse adressée à David, et non du nom divin. « Mon seigneur » en conserve la portée sociale.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le discours respectueux d’Abigaïl est conservé par « mon seigneur » et « ta servante ». Le passage du nom propre au mot « folie » maintient la tension rhétorique de l’hébreu sans traduire artificiellement le nom dans le corps du texte.
