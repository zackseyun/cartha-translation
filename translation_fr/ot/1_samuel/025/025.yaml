  naturalness: L’ouverture « Que mon seigneur, je t’en prie, ne prête pas attention » est syntaxiquement heurtée en français moderne. L’adresse directe respectueuse « Je t’en prie, mon seigneur, ne fais pas attention » est naturelle et conserve le registre de supplication. « La folie l’accompagne » est également plus fluide.
  terminology: « Mon seigneur » et « ta servante » rendent bien les formules sociales et l’humilité d’Abigaïl. Nabal doit rester translittéré; la note explique utilement le jeu de mots sans le surinterpréter.
