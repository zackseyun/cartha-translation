  text: וְ/הָיָ֞ה הִ֣יא רֹכֶ֣בֶת עַֽל הַ/חֲמ֗וֹר וְ/יֹרֶ֨דֶת֙ בְּ/סֵ֣תֶר הָ/הָ֔ר וְ/הִנֵּ֤ה דָוִד֙ וַ/אֲנָשָׁ֔י/ו יֹרְדִ֖ים לִ/קְרָאתָ֑/הּ וַ/תִּפְגֹּ֖שׁ אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: fr
  text: Tandis qu’elle descendait à dos d’âne par un endroit caché de la montagne[a], voici que David et ses hommes descendaient à sa rencontre, et elle les rencontra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le côté caché de la montagne ». L’expression hébraïque désigne un endroit dissimulé ou abrité de la montagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: Tandis qu’elle
  rationale: La construction narrative avec היה introduit ici l’action en cours et sa simultanéité avec la rencontre; « Tandis que » l’exprime naturellement en français.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: à dos d’âne
  rationale: Expression française courante et précise pour indiquer qu’Abigaïl se déplace montée sur un âne.
- source_word: וְיֹרֶדֶת
  choice: descendait
  rationale: L’imparfait rend l’action continue du participe hébreu dans le cadre narratif.
- source_word: בְּסֵתֶר הָהָר
  choice: par un endroit caché de la montagne
  rationale: סֵתֶר évoque un lieu dissimulé, retiré ou abrité. Cette formulation conserve la valeur topographique sans trancher entre versant caché, creux et abri.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: « Voici que » garde la fonction de הִנֵּה, qui attire vivement l’attention sur l’arrivée inattendue de David et de ses hommes.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: descendaient dans sa direction
  rationale: לִקְרָאתָהּ indique un mouvement orienté vers elle; « dans sa direction » évite d’affirmer plus que nécessaire qu’ils avaient délibérément l’intention de la rencontrer.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: et elle les rencontra
  rationale: פגש signifie rencontrer ou croiser; « rencontra » convient au récit et conserve le sujet féminin explicite.
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. « Voici que » conserve la vivacité du récit biblique sans employer l’archaïque « voici ». La répétition de « descendait/descendaient » est maintenue parce qu’elle reflète la convergence spatiale exprimée par l’hébreu.
