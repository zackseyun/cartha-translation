language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: fr
  text: Mais, aussi vrai que Yahweh, le Dieu d’Israël, est vivant, lui qui m’a empêché de te faire du mal, si tu ne t’étais pas dépêchée de venir à ma rencontre, il ne serait resté à Nabal, avant les premières lueurs du matin, pas un seul homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quelqu’un qui urine contre un mur », expression crue désignant un homme.'
    reason: La traduction principale communique le référent, tandis que la note préserve l’image et le registre de l’hébreu.
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais
  rationale: Introduit avec naturel l’opposition entre l’intervention d’Abigaïl et ce qui aurait autrement eu lieu.
- source_word: חַי יְהוָה
  choice: aussi vrai que Yahweh … est vivant
  rationale: Rend en français actuel la formule hébraïque solennelle de serment sans en réduire la force.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé directement par le tétragramme.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Reproduit directement le groupe construit hébreu.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: lui qui m’a empêché
  rationale: Le verbe indique que Yahweh a retenu David et l’a empêché d’agir.
- source_word: מֵהָרַע אֹתָךְ
  choice: de te faire du mal
  rationale: Expression française naturelle qui conserve l’idée hébraïque de commettre un mal contre Abigaïl, ici dans un contexte de violence projetée.
- source_word: כִּי לוּלֵי
  choice: si tu ne t’étais pas
  rationale: Exprime clairement la condition irréelle du passé introduite par la locution hébraïque.
- source_word: מִהַרְתְּ
  choice: dépêchée
  rationale: Conserve l’idée de hâte ainsi que le féminin singulier de l’adresse à Abigaïl.
- source_word: וַתָּבֹאתִי לִקְרָאתִי
  choice: de venir à ma rencontre
  rationale: Rend idiomatiquement l’action de sortir ou venir rencontrer quelqu’un.
- source_word: נוֹתַר לְנָבָל
  choice: il ne serait resté à Nabal
  rationale: Préserve la formulation de reste ou de survivant et la relation au foyer de Nabal.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: avant les premières lueurs du matin
  rationale: Exprime la limite temporelle fixée par l’apparition de la lumière matinale.
- source_word: מַשְׁתִּין בְּקִיר
  choice: pas un seul homme
  rationale: Traduit le sens référentiel de l’expression hébraïque volontairement crue, tandis que la note en conserve la forme littérale.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin; sa transcription maintient cette distinction sans substituer un titre.
- issue: Portée de מֵהָרַע אֹתָךְ
  choice: de te faire du mal
  alternative: de commettre le mal contre toi
  rationale: La formulation retenue conserve la portée concrète du projet violent de David sans décider si le mot constitue aussi un jugement moral plus général sur son intention.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure solennelle du serment est maintenue; la condition irréelle est rendue naturellement. Le marqueur de note est placé après « homme », le segment auquel il se rapporte.
