base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: fr
  text: Même si un homme s’est dressé pour te poursuivre et attenter à ta vie, la vie de mon seigneur sera liée dans le faisceau des vivants[a] auprès de Yahweh, ton Dieu ; mais la vie de tes ennemis, il la lancera au loin[b] depuis la poche de la fronde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sera liée dans le faisceau des vivants ». L’image hébraïque évoque quelque chose que l’on rassemble et attache pour le garder en sûreté.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu désigne l’action de lancer avec une fronde ; il forme un contraste voulu avec la vie gardée liée dans le faisceau. La « poche » correspond au creux de la fronde où repose le projectile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: Même si un homme s’est dressé
  rationale: Le waw suivi du qatal introduit ici une circonstance concessive. « Un homme » conserve le singulier masculin et renvoie concrètement à l’adversaire de David.
- source_word: לִרְדָפְךָ
  choice: pour te poursuivre
  rationale: Le verbe רדף exprime une poursuite hostile ; « poursuivre » convient au registre digne du discours.
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: et en vouloir à ta vie
  rationale: נֶפֶשׁ désigne ici la vie menacée. L’expression française naturelle « en vouloir à la vie de quelqu’un » rend l’intention meurtrière sans introduire la notion distincte d’âme.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: la vie de mon seigneur
  rationale: « Vie » maintient le sens contextuel de נֶפֶשׁ et « mon seigneur » conserve la formule respectueuse employée par Abigaïl.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: restera liée dans le faisceau des vivants
  rationale: Cette formulation préserve l’image concrète de quelque chose rassemblé et attaché en sûreté. « Des vivants » reflète la forme plurielle substantivée הַחַיִּים.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: auprès de Yahweh, ton Dieu
  rationale: אֵת exprime ici l’association ou la proximité. « Auprès de » est naturel en français et évoque la sécurité dans la présence de Dieu sans expliciter davantage la métaphore.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: mais la vie de tes ennemis
  rationale: Le singulier נֶפֶשׁ est conservé comme collectif malgré le pluriel « ennemis ». « Mais » rend clairement le contraste marqué entre le sort de David et celui de ses ennemis.
- source_word: יְקַלְּעֶנָּה
  choice: il la lancera au loin
  rationale: Le verbe קלע évoque spécifiquement le jet à la fronde. La mention explicite de la fronde dans la suite maintient cette image en français.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: du creux de la fronde
  rationale: כַּף désigne la paume ou le creux et, dans ce contexte, la poche où repose le projectile. « Creux de la fronde » conserve l’image inhabituelle du texte hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la donnée hébraïque.
theological_decisions:
- issue: Contraste métaphorique entre la préservation de David et l’élimination de ses ennemis
  choice: Conserver les images concrètes du faisceau où la vie est liée et de la fronde qui lance au loin.
  alternative: Interpréter « le faisceau des vivants » comme une affirmation explicite de la vie éternelle, ou réduire les deux images à la protection et à la défaite.
  rationale: L’hébreu affirme la préservation divine de David et l’élimination de ses ennemis au moyen d’images concrètes, sans formuler explicitement une doctrine de l’au-delà.
- issue: Référent du sujet implicite de יְקַלְּעֶנָּה
  choice: Employer « il », avec Yahweh comme antécédent contextuel.
  alternative: Répéter « Yahweh » ou utiliser une tournure passive.
  rationale: Le sujet masculin implicite se comprend naturellement comme Yahweh, nommé dans la proposition précédente ; le pronom respecte cette continuité sans ajouter au texte.
- issue: Valeur collective de נֶפֶשׁ avec אֹיְבֶיךָ
  choice: Conserver le singulier « la vie de tes ennemis ».
  alternative: Employer le pluriel « les vies de tes ennemis ».
  rationale: Le singulier hébreu peut avoir une portée collective. Le français reste compréhensible et préserve la forme et le contraste singulier du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier hébreu adressé à David. Les métaphores inhabituelles du faisceau et du creux de la fronde sont conservées ; les notes les éclairent sans leur imposer une interprétation doctrinale.
