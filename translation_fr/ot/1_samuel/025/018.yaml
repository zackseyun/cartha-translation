  text: וַ/תְּמַהֵ֣ר אבוגיל וַ/תִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּ/שְׁנַ֣יִם נִבְלֵי יַ֗יִן וְ/חָמֵ֨שׁ צֹ֤אן עשוות וְ/חָמֵ֤שׁ סְאִים֙ קָלִ֔י וּ/מֵאָ֥ה צִמֻּקִ֖ים וּ/מָאתַ֣יִם דְּבֵלִ֑ים וַ/תָּ֖שֶׂם עַל הַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: fr
  text: Abigaïl se hâta de prendre deux cents pains, deux outres de vin, cinq moutons déjà préparés, cinq séas de grain rôti[a], cent grappes de raisins secs et deux cents gâteaux de figues. Elle chargea le tout sur des ânes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un séa était une ancienne mesure de capacité pour les matières sèches.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: se hâta
  rationale: Le verbe exprime l’empressement et l’urgence; « se hâta » convient à un récit de registre digne et actuel.
- source_word: מָאתַיִם לֶחֶם
  choice: deux cents pains
  rationale: Dans ce contexte dénombré, לֶחֶם désigne naturellement des pains individuels.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: deux outres de vin
  rationale: נֵבֶל désigne ici un récipient à liquide, vraisemblablement une outre; ce terme évite l’anachronisme de « bouteilles ».
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: cinq moutons déjà préparés
  rationale: Le participe indique que les animaux avaient été apprêtés pour être consommés, sans préciser davantage l’étape culinaire.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: cinq séas de grain rôti
  rationale: סְאָה est une mesure ancienne de capacité pour les matières sèches; la translittération conserve la précision historique, tandis que la note l’explique. קָלִי désigne du grain rôti ou grillé.
- source_word: מֵאָה צִמֻּקִים
  choice: cent grappes de raisins secs
  rationale: צִמֻּקִים désigne des raisins secs, ici présentés comme des unités dénombrables, probablement des amas ou grappes compactes.
- source_word: מָאתַיִם דְּבֵלִים
  choice: deux cents gâteaux de figues
  rationale: דְּבֵלָה désigne une masse de figues pressées, rendue idiomatiquement par « gâteau de figues ».
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: Elle chargea le tout sur des ânes
  rationale: Le verbe signifie littéralement « mettre, placer »; dans ce contexte, « charger » exprime naturellement l’action sans ajouter d’information substantielle.
