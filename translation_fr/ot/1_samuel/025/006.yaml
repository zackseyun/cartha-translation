  register: Français international moderne, digne et accessible. Le tutoiement reflète les formes hébraïques au singulier adressées à Nabal. La triple occurrence hébraïque de שָׁלוֹם est rendue par une seule proposition française coordonnée afin d’éviter une répétition raide, tout en conservant sa portée sur la personne, la maison et les possessions.
