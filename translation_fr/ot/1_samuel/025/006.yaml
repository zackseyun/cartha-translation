  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: fr
  text: 'Vous leur direz : « Longue vie à toi ![a] Paix à toi, paix à ta maison[b] et paix à tout ce qui t’appartient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « à la vie » ou, selon une autre analyse, « au vivant ». Il s’agit probablement d’une salutation ou d’un souhait : « Longue vie à toi ! » On pourrait aussi traduire plus généralement : « Salutations ! »'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « paix » peut aussi évoquer le bien-être, l’intégrité et la prospérité. Ici, « maison » désigne probablement toute la maisonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם כֹּה
  choice: Vous leur direz
  rationale: Le parfait précédé de waw poursuit l’instruction donnée par David. En français, le futur a ici une valeur directive naturelle; כֹּה introduit directement les paroles à transmettre.
- source_word: לֶחָי
  choice: Longue vie à toi !
  rationale: L’expression hébraïque, littéralement « à la vie » ou peut-être « au vivant », est difficile. Dans ce contexte, elle paraît fonctionner comme une salutation ou un souhait de vie; cette formulation en restitue le sens probable sans masquer l’incertitude, signalée en note.
- source_word: וְאַתָּה שָׁלוֹם
  choice: Que la paix soit avec toi
  rationale: La proposition nominale exprime vraisemblablement un souhait. Cette tournure française naturelle conserve la portée bénédictive de la formule.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: avec ta maison
  rationale: « Maison » garde l’image hébraïque tout en pouvant désigner naturellement la famille et l’ensemble de la maisonnée.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: et avec tout ce qui t’appartient
  rationale: La formulation étend le souhait de paix à tout ce qui relève de Nabal, biens comme personnes à sa charge.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est le correspondant français traditionnel et concis; une note précise que שָׁלוֹם englobe aussi le bien-être, l’intégrité et la prospérité.
