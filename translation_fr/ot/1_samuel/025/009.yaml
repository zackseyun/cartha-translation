  rationale: La révision remplace « rapportèrent » par « parlèrent » afin de rendre directement le verbe hébreu, et introduit « selon » pour représenter la préposition כְּ. Elle maintient « attendirent », lecture contextuelle possible du dernier verbe, tout en conservant dans la note les sens lexicaux alternatifs et l’ambiguïté du texte.
