base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: fr
  text: Les jeunes hommes de David arrivèrent et parlèrent à Nabal selon toutes ces paroles, au nom de David; puis ils attendirent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « puis ils se reposèrent » ou « puis ils s’arrêtèrent ». Le verbe hébreu signifie habituellement « se reposer » ou « se poser »; dans ce contexte, il peut indiquer qu’ils cessèrent de parler et attendirent la réponse de Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי דָוִד
  choice: les jeunes hommes de David
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. Ici, il s’agit des émissaires de David; « jeunes hommes » conserve la désignation hébraïque sans les réduire à leur fonction.
- source_word: וַיָּבֹאוּ
  choice: arrivèrent
  rationale: בוא signifie couramment « venir » ou « entrer ». Dans ce récit, « arrivèrent » exprime naturellement l’aboutissement de leur déplacement auprès de Nabal.
- source_word: וַיְדַבְּרוּ אֶל נָבָל
  choice: ils rapportèrent à Nabal
  rationale: La construction signifie littéralement « ils parlèrent à Nabal ». Avec pour complément les paroles confiées par David, « rapportèrent » rend naturellement en français l’action de transmettre fidèlement un message.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: La préposition כְּ indique qu’ils parlèrent conformément à toutes ces paroles, donc qu’ils transmirent intégralement le message. « Toutes ces paroles » garde la précision verbale de דְּבָרִים.
- source_word: בְּשֵׁם דָּוִד
  choice: au nom de David
  rationale: L’expression indique que les messagers parlent comme représentants autorisés de David. « Au nom de David » en conserve la forme et la portée.
- source_word: וַיָּנוּחוּ
  choice: puis ils attendirent
  rationale: נוח signifie fondamentalement « se poser, se reposer ». Après la transmission du message, il peut évoquer le fait de s’arrêter et d’attendre; cette formulation convient au déroulement du récit, tandis qu’une note préserve le sens plus littéral.
