  source_fidelity: La traduction de וַיָּבֹאוּ par « arrivèrent », de נַעֲרֵי par « jeunes hommes » et de בְּשֵׁם דָּוִד par « au nom de David » est fidèle. En revanche, « ils rapportèrent » interprète davantage וַיְדַבְּרוּ (« ils parlèrent ») comme une transmission de rapport. La formulation révisée rend explicitement l’acte de parler et la valeur de כְּכָל (« selon toutes »). « Ils attendirent » demeure une interprétation contextuelle recevable de וַיָּנוּחוּ, à condition que la note conserve les autres possibilités.
  naturalness: Le passé simple et le registre narratif conviennent au français biblique moderne. « Parlèrent à Nabal selon toutes ces paroles » est légèrement soutenu, mais clair, idiomatique dans ce registre et plus près de la construction hébraïque que « rapportèrent à Nabal toutes ces paroles ».
  terminology: « Jeunes hommes de David » conserve utilement l’ambiguïté fonctionnelle de נַעֲרֵי sans les identifier de façon réductrice comme des serviteurs. « Au nom de David » est exact. La note sur le dernier verbe doit présenter « attendirent » comme une lecture contextuelle plutôt que comme son sens lexical de base.
