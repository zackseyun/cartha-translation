  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: fr
  text: 'Pourtant, ces hommes ont été très bons envers nous : nous n’avons pas été humiliés[a], et rien ne nous a manqué[b] pendant tout le temps où nous circulions avec eux dans les champs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous n’avons pas été maltraités » ou « nous n’avons subi aucun affront ».
    reason: lexical_alternative
  - marker: b
    text: Ou « rien n’a disparu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Pourtant, ces hommes
  rationale: Le waw est rendu par « Pourtant » pour marquer le contraste contextuel avec le jugement hostile de Nabal; « ces hommes » désigne naturellement le groupe déjà mentionné.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: ont été très bons envers nous
  rationale: Cette formulation conserve le vocabulaire simple de טוֹב et exprime leur conduite bienveillante envers les bergers.
- source_word: הָכְלַמְנוּ
  choice: nous n’avons pas été humiliés
  rationale: Le hophal de כלם est passif et signifie être couvert de honte, humilié ou traité de manière déshonorante; le choix retient directement cette valeur sans la généraliser en simple mauvais traitement.
- source_word: פָקַדְנוּ מְאוּמָה
  choice: rien ne nous a manqué
  rationale: Dans ce contexte, l’expression indique qu’aucune perte n’a été constatée. Le français est naturel tout en laissant la note préciser l’idée concrète de disparition.
- source_word: כָּל יְמֵי
  choice: pendant tout le temps
  rationale: Équivalent français idiomatique de l’expression temporelle désignant toute la durée.
- source_word: הִתְהַלַּכְנוּ אִתָּם
  choice: nous avons circulé avec eux
  rationale: Le hitpael de הלך évoque des déplacements répétés en compagnie du groupe; « circulé avec eux » préserve cette nuance dynamique.
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: lorsque nous étions dans les champs
  rationale: La proposition temporelle situe les faits dans les pâturages ou la campagne; le pluriel français est naturel pour cet espace ouvert.
