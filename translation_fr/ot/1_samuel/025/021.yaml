base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: fr
  text: 'David s’était dit : « C’est bien en vain que j’ai protégé dans le désert tout ce qui appartient à cet homme, de sorte que rien de tout ce qui lui appartient n’a manqué ; et il m’a rendu le mal pour le bien. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: C’est vraiment pour rien
  rationale: אַךְ renforce ici l’amère constatation de David, tandis que לַשֶּׁקֶר exprime l’inutilité apparente de ses efforts. Cette formulation est naturelle en français et conserve l’emphase.
- source_word: שָׁמַרְתִּי
  choice: j’ai protégé
  rationale: Dans ce contexte, le verbe ne signifie pas seulement surveiller, mais préserver les biens de Nabal contre toute perte ou attaque.
- source_word: לֹא נִפְקַד ... מְאוּמָה
  choice: Rien ... n’a manqué
  rationale: Le passif נִפְקַד indique qu’aucun élément n’a été constaté absent ou perdu. « Rien n’a manqué » rend directement l’idée sans surinterprétation.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: il me rend le mal pour le bien
  rationale: Cette tournure française conserve l’opposition concise entre רָעָה et טוֹבָה ainsi que le sens de rétribution exprimé par שׁוב avec לִי.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le plus-que-parfait « s’était dit » situe naturellement cette parole intérieure avant l’action en cours dans le récit. La reprise emphatique « et lui » fait ressortir le contraste accusateur présent dans la plainte de David sans ajouter de contenu doctrinal.
