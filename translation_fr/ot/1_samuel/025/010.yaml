source:
  edition: WLC
  text: וַ/יַּ֨עַן נָבָ֜ל אֶת עַבְדֵ֤י דָוִד֙ וַ/יֹּ֔אמֶר מִ֥י דָוִ֖ד וּ/מִ֣י בֶן יִשָׁ֑י הַ/יּוֹם֙ רַבּ֣וּ עֲבָדִ֔ים הַ/מִּתְפָּ֣רְצִ֔ים אִ֖ישׁ מִ/פְּנֵ֥י אֲדֹנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: fr
  text: 'Nabal répondit aux serviteurs de David : « Qui est David, et qui est le fils de Jessé ? De nos jours, les serviteurs qui s’échappent de chez leur maître sont nombreux.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De nos jours, les serviteurs qui s’échappent de chez leur maître se sont multipliés. »'
    reason: La forme verbale רַבּוּ peut être rendue plus littéralement par « se sont multipliés » ou « sont devenus nombreux ».
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans cet échange narratif, ענה signifie naturellement « répondre ». La formulation française évite le pléonasme hébraïque « répondit et dit » sans en perdre le sens.
- source_word: עַבְדֵי דָוִד
  choice: les serviteurs de David
  rationale: עבד désigne ici les hommes envoyés par David. « Serviteurs » reste lexicalement transparent sans imposer le sens plus fort d’« esclaves ».
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: Qui est David, et qui est le fils de Jessé ?
  rationale: La répétition de « qui » conserve la tournure méprisante de Nabal, et « le fils de Jessé » maintient l’expression hébraïque plutôt que de la remplacer par le nom de David.
- source_word: הַיּוֹם
  choice: De nos jours
  rationale: Dans cette généralisation, le mot signifie idiomatiquement « actuellement » ou « de nos jours », plutôt que le seul jour présent.
- source_word: רַבּוּ
  choice: nombreux sont
  rationale: Le verbe רבה signifie littéralement « être devenus nombreux » ou « s’être multipliés ». « Nombreux sont » en conserve la valeur quantitative dans un français naturel et soutenu.
- source_word: עֲבָדִים
  choice: les serviteurs
  rationale: Le contexte présente des subordonnés quittant leurs maîtres. « Serviteurs » préserve cette relation sociale sans préciser indûment qu’il s’agit juridiquement d’esclaves.
- source_word: הַמִּתְפָּרְצִים
  choice: qui se détachent
  rationale: Le participe hitpael de פרץ évoque l’action de rompre ou de se dégager. « Se détachent » garde l’idée de séparation volontaire sans expliciter une rébellion formelle que le texte ne nomme pas.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: chacun de son maître
  rationale: איש a ici une valeur distributive, « chacun ». La préposition מִפְּנֵי exprime idiomatiquement l’éloignement d’auprès de quelqu’un ; en français, « de son maître » transmet ce mouvement sans calque spatial peu naturel.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: אדון désigne ici un supérieur humain. « Maître » convient au rapport social visé et évite la possible coloration divine de « Seigneur ».
theological_decisions:
- issue: Portée de l’accusation de Nabal
  choice: « se détachent »
  alternative: « se révoltent »
  rationale: Le contexte permet d’entendre une allusion hostile à la rupture entre David et Saül, mais le verbe décrit d’abord le fait de se dégager ou de rompre. La traduction ne transforme donc pas cette insinuation en accusation explicite de rébellion.
translation_notes:
  register: Français international moderne, naturel et digne. La question répétée conserve le mépris rhétorique de Nabal. La syntaxe légèrement soutenue « nombreux sont » rend la valeur verbale de רַבּוּ tout en restant accessible.
