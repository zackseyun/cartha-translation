  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: fr
  text: Maintenant, sache donc et vois ce que tu dois faire, car le malheur est décidé contre notre maître et contre toute sa maison. Quant à lui, c’est un vaurien[a] à qui l’on ne peut pas parler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un fils de Bélial » ; expression hébraïque désignant un homme sans valeur ou sans scrupules.'
    reason: Signaler la formulation traditionnelle et le sens idiomatique, sans imposer à « Bélial » le statut de nom propre ni affirmer une étymologie incertaine.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque avec naturel la transition urgente dans les paroles du serviteur.
- source_word: דְּעִי וּרְאִי
  choice: sache-le et vois
  rationale: Conserve les deux impératifs féminins singuliers. « Vois » prend ici le sens délibératif de considérer la conduite à tenir, rendu clair par la proposition qui suit.
- source_word: מַה תַּעֲשִׂי
  choice: ce que tu dois faire
  rationale: Exprime l’action envisagée et l’urgence pratique sans transformer la parole du serviteur en commandement explicite.
- source_word: כָלְתָה הָרָעָה
  choice: le malheur est décidé
  rationale: L’expression indique qu’un malheur est arrêté ou tenu pour certain. Cette formulation préserve le caractère imminent et déterminé de la menace.
- source_word: אֶל אֲדֹנֵינוּ
  choice: contre notre maître
  rationale: Dans ce contexte, אֶל indique la direction hostile du malheur; « maître » convient à la relation domestique.
- source_word: וְעַל כָּל בֵּיתוֹ
  choice: contre toute sa maison
  rationale: « Maison » garde la portée collective de l’hébreu, qui englobe ici la maisonnée de Nabal, sans la réduire au bâtiment.
- source_word: בֶּן בְּלִיַּעַל
  choice: un vaurien
  rationale: Rend en français actuel l’idiome désignant un homme moralement indigne et intraitable, sans faire de Bélial un nom propre dans ce contexte.
- source_word: מִדַּבֵּר אֵלָיו
  choice: à qui l’on ne peut pas parler
  rationale: Rend naturellement l’idée qu’il est impossible de raisonner ou de communiquer avec cet homme, tout en conservant le verbe général « parler ».
theological_decisions:
- issue: Sens de בְּלִיַּעַל
  choice: vaurien
  alternative: fils de Bélial / homme de rien
  rationale: Dans ce passage, le terme appartient à un idiome hébreu qualifiant un homme indigne; rien n’oblige à y voir le nom propre d’une puissance démoniaque.
translation_notes:
  register: Français international moderne, direct et digne. Le discours garde son urgence et son adresse féminine singulière à Abigaïl. « Vaurien » exprime fortement l’indignité et l’intraitabilité de Nabal sans registre excessivement archaïque.
