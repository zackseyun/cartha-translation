source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: fr
  text: Pardonne, je te prie, la faute de ta servante, car Yahweh établira certainement pour mon seigneur une maison durable[a], puisque mon seigneur combat les combats de Yahweh, et aucun mal ne se trouvera en toi durant toute ta vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une maison sûre » ou « une dynastie durable ». Ici, le mot hébreu traduit par « maison » désigne une lignée stable, et non simplement une habitation ou une maisonnée.
    reason: Préciser le sens dynastique de la métaphore tout en signalant des traductions possibles de נֶאֱמָן.
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: Pardonne, je te prie, la faute
  rationale: L’expression idiomatique « porter/enlever une transgression » signifie ici pardonner. « Je te prie » restitue la force suppliante de נָא, tandis que « faute » conserve la gravité morale de פֶּשַׁע dans un français naturel.
- source_word: אֲמָתֶךָ
  choice: ta servante
  rationale: Le nom אמה désigne explicitement une servante; le féminin est conservé et convient à la manière humble dont Abigaïl parle d’elle-même.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: établira certainement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’assurance de l’action. « Établir » rend naturellement la constitution durable d’une maison ou lignée.
- source_word: לַאדֹנִי
  choice: pour mon seigneur
  rationale: Il s’agit d’une formule de respect adressée à David; « mon seigneur » garde ce registre sans suggérer ici un titre divin.
- source_word: בַּיִת נֶאֱמָן
  choice: une maison durable
  rationale: « Maison » conserve la métaphore hébraïque de la lignée, tandis que « durable » exprime la stabilité contenue dans נֶאֱמָן sans remplacer la métaphore par « dynastie ».
- source_word: מִלְחֲמוֹת יְהוָה
  choice: les combats de Yahweh
  rationale: Le syntagme désigne les combats menés pour la cause de Yahweh. « Combats » est naturel et maintient le lien lexical avec le verbe suivant.
- source_word: אֲדֹנִי נִלְחָם
  choice: mon seigneur combat
  rationale: Le participe présente cette activité comme continue ou caractéristique; le présent français convient à cette valeur.
- source_word: וְרָעָה
  choice: aucun mal
  rationale: רָעָה peut évoquer le mal moral, le malheur ou le tort. « Mal » préserve cette amplitude sémantique au lieu de trancher exclusivement en faveur de la culpabilité morale.
- source_word: לֹא תִמָּצֵא בְךָ
  choice: ne se trouvera en toi
  rationale: La formulation reste proche de l’hébreu et conserve l’idée que le mal ne sera pas trouvé chez David ou attaché à sa conduite.
- source_word: מִיָּמֶיךָ
  choice: durant toute ta vie
  rationale: L’expression signifie idiomatiquement pendant tous les jours de la personne. Cette formulation est claire et naturelle en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle du tétragramme dans le texte source.
theological_decisions:
- issue: Sens dynastique de « maison » dans la bénédiction d’Abigaïl
  choice: Conserver « maison » et préciser sa stabilité par « durable »
  alternative: Traduire explicitement par « dynastie durable » ou plus littéralement par « maison sûre »
  rationale: Le contexte vise vraisemblablement une lignée stable pour David. « Maison durable » préserve la métaphore biblique et ses échos intertextuels, tandis que la note explicite le sens dynastique.
- issue: Portée de רָעָה concernant David
  choice: Employer le terme large « mal »
  alternative: Préciser « faute », « méchanceté » ou « malheur »
  rationale: Le mot hébreu peut viser le mal moral, le tort ou le malheur. Le contexte favorise probablement la conduite morale de David, mais le français « mal » maintient l’ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La supplication conserve une légère solennité par « je te prie » et « mon seigneur », sans archaïsmes. La répétition « combat les combats » reflète volontairement le lien lexical hébreu; elle demeure intelligible en français biblique courant.
