  text: שְׁאַ֨ל אֶת נְעָרֶ֜י/ךָ וְ/יַגִּ֣ידוּ לָ֗/ךְ וְ/יִמְצְא֨וּ הַ/נְּעָרִ֥ים חֵן֙ בְּ/עֵינֶ֔י/ךָ כִּֽי עַל י֥וֹם ט֖וֹב בָּ֑נוּ תְּנָ/ה נָּ֗א אֵת֩ אֲשֶׁ֨ר תִּמְצָ֤א יָֽדְ/ךָ֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְ/בִנְ/ךָ֖ לְ/דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: fr
  text: Demande à tes jeunes gens, et ils te le diront. Que les jeunes gens trouvent donc grâce à tes yeux, car nous sommes venus en un jour de fête[a]. Donne, je te prie, ce que ta main trouvera[b] à tes serviteurs et à ton fils David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un bon jour ». Dans ce contexte, la tonte des moutons était une occasion de réjouissance.'
    reason: cultural_note
  - marker: b
    text: 'Autrement dit : « ce que tu peux donner » ; littéralement : « ce que ta main trouvera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת־נְעָרֶיךָ
  choice: Demande à tes jeunes gens
  rationale: L’impératif est direct, et « jeunes gens » conserve la portée de נַעַר ainsi que le lien lexical avec הַנְּעָרִים dans la phrase suivante, sans préciser à tort leur statut.
- source_word: וְיַגִּידוּ לָךְ
  choice: et ils te le diront
  rationale: Le hiphil de נגד signifie ici « dire, faire savoir ». Le pronom « le » est naturel en français et renvoie à ce que Nabal veut vérifier auprès de ses hommes.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: Que les jeunes gens trouvent donc grâce à tes yeux
  rationale: Cette formulation garde l’image de l’expression hébraïque « trouver grâce aux yeux de » et rend la nuance jussive; « donc » exprime le lien avec le témoignage attendu des hommes de Nabal.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: car nous sommes arrivés un jour de fête
  rationale: יוֹם טוֹב signifie littéralement « bon jour », mais le contexte de la tonte des moutons indique une journée de réjouissance. « Jour de fête » communique cette valeur contextuelle sans préciser la nature de la célébration.
- source_word: תְּנָה נָּא
  choice: Donne, je te prie
  rationale: L’impératif garde sa force, tandis que « je te prie » rend la particule de supplication נָא dans un registre digne et actuel.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: ce que ta main trouvera
  rationale: La traduction conserve l’image hébraïque, qui désigne ce que Nabal a à sa disposition ou peut donner. Une explication idiomatique figure en note.
- source_word: לַעֲבָדֶיךָ
  choice: à tes serviteurs
  rationale: עֶבֶד sert ici d’autodésignation déférente des hommes de David; « serviteurs » convient mieux au contexte de la requête que « esclaves ».
- source_word: וּלְבִנְךָ לְדָוִד
  choice: et à ton fils David
  rationale: La formulation maintient l’humble autodésignation de David comme « fils » de Nabal, sans la transformer en filiation littérale.
theological_decisions:
- issue: La désignation de David comme « ton fils »
  choice: Conserver « ton fils David » dans le texte
  alternative: Expliciter « David, qui se considère comme ton fils » ou remplacer par une formule de déférence
  rationale: Le texte présente une formule rhétorique d’humilité plutôt qu’une filiation biologique. La conserver respecte cette stratégie discursive sans l’interpréter dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond aux formes hébraïques du singulier. L’expression « trouver grâce à tes yeux » et l’image de la main sont conservées pour préserver la rhétorique du texte, avec des notes là où leur sens pourrait ne pas être immédiatement transparent.
