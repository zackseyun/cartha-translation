  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד עֲשָׂרָ֣ה נְעָרִ֑ים וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/נְּעָרִ֗ים עֲל֤וּ כַרְמֶ֨לָ/ה֙ וּ/בָאתֶ֣ם אֶל נָבָ֔ל וּ/שְׁאֶלְתֶּם ל֥/וֹ בִ/שְׁמִ֖/י לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: fr
  text: 'David envoya dix jeunes hommes et leur dit : « Montez à Carmel, allez trouver Nabal et, en mon nom, demandez-lui comment il va[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « demandez-lui, en mon nom, au sujet de la paix » ; « paix » désigne ici son bien-être, dans une formule de salutation.'
    reason: La note conserve l’expression hébraïque tout en précisant sa valeur idiomatique dans ce contexte.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Rend simplement le verbe שׁלח dans ce récit, sans ajouter la nuance plus marquée de « dépêcha ».
- source_word: עֲשָׂרָה נְעָרִים
  choice: dix jeunes hommes
  rationale: נְעָרִים peut désigner des jeunes hommes ou des serviteurs. Le contexte montre qu'ils servent de messagers, mais le texte les qualifie d'abord selon leur âge ou leur statut de jeunes gens.
- source_word: עֲלוּ כַרְמֶלָה
  choice: Montez à Carmel
  rationale: Conserve le mouvement ascendant exprimé par עלה et rend naturellement le hé directionnel attaché à Carmel.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: allez trouver Nabal
  rationale: Dans une consigne donnée à des envoyés, « allez trouver » est plus naturel en français que le littéral « venez vers », tout en exprimant leur arrivée auprès de Nabal.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: demandez-lui comment il va
  rationale: La construction שאל ל... לשלום est une formule idiomatique par laquelle on s'enquiert du bien-être de quelqu'un; cette formulation française en communique clairement la fonction.
- source_word: בִשְׁמִי
  choice: de ma part
  rationale: Exprime naturellement en français l'idée de parler au nom de David, sans suggérer une simple utilisation formelle de son nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition du nom de David dans l’hébreu est allégée par « leur dit », puisque le référent reste parfaitement clair. La salutation idiomatique est rendue dans le texte par une formule française courante, tandis que la note préserve l’image hébraïque de la paix.
