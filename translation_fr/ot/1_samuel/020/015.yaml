  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: fr
  text: Tu ne priveras jamais ma maison de ta fidélité[a], pas même lorsque Yahweh retranchera de la face de la terre chacun des ennemis de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton amour fidèle » ou « ta bonté loyale ». Le mot hébreu חֶסֶד désigne souvent un amour fidèle qui se manifeste dans une relation d’alliance.
    reason: alternative lexicale
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: retireras / retranchera
  rationale: 'Le contexte exige deux réalisations françaises différentes du même verbe hébreu : « retirer » convient à la fidélité accordée à une famille, tandis que « retrancher » exprime naturellement l’élimination des ennemis. La répétition exacte serait peu idiomatique en français.'
- source_word: חַסְדְּךָ
  choice: ta fidélité
  rationale: Dans le cadre de l’alliance entre Jonathan et David, חֶסֶד désigne une bienveillance loyale et durable. « Fidélité » rend clairement cette dimension relationnelle sans transformer le mot en terme juridique technique.
- source_word: מֵעִם בֵּיתִי
  choice: à ma maison
  rationale: « Maison » conserve le sens familial et dynastique de בַּיִת ; la construction française « retirer à » exprime naturellement la relation marquée par מֵעִם.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: Avec la négation, « ne… jamais » rend de manière naturelle la durée indéfinie exprimée par עַד עוֹלָם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération garde le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֹיְבֵי דָוִד
  choice: les ennemis de David
  rationale: Cette formulation rend directement et naturellement la chaîne construite hébraïque.
- source_word: אִישׁ
  choice: chacun
  rationale: Après le pluriel « ennemis », le singulier distributif אִישׁ souligne que tous seront retranchés individuellement. « Chacun » restitue cette force avec naturel en français.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface de la terre
  rationale: Cette expression française conserve l’image solennelle de l’idiome hébreu tout en restant actuelle et compréhensible.
- source_word: וְלֹא ... וְלֹא
  choice: ne… jamais, pas même lorsque
  rationale: '« Pas même lorsque » rattache la seconde proposition à la demande de Jonathan comme une extension emphatique : sa maison devra bénéficier de la fidélité de David même au temps où les ennemis de celui-ci seront éliminés.'
theological_decisions:
- issue: Portée de חֶסֶד dans le contexte de l’alliance
  choice: « ta fidélité », avec une note signalant les nuances de bonté loyale et d’amour fidèle
  alternative: « ton amour fidèle » ou « ta loyauté envers l’alliance »
  rationale: Le contexte donne au mot une forte dimension d’engagement et de loyauté, mais le texte ne contraint pas à en faire un terme technique exclusivement juridique.
- issue: Lien syntaxique de la seconde proposition
  choice: La demande demeure valable même lorsque Yahweh retranchera tous les ennemis de David.
  alternative: Lire la seconde proposition comme une remarque parenthétique moins directement liée à la demande.
  rationale: Le second וְלֹא et la proposition infinitive renforcent le plaidoyer de Jonathan et mettent en relief sa demande de grâce pour sa maison malgré la disparition future des adversaires de David.
- issue: Valeur distributive de אִישׁ
  choice: « chacun des ennemis de David »
  alternative: « tous les ennemis de David »
  rationale: « Chacun » préserve l’insistance distributive du singulier hébreu sans ajouter en français une désignation masculine superflue, puisque le nom « ennemis » est déjà grammaticalement masculin.
translation_notes:
  register: Français international moderne, digne et direct. « Ma maison » conserve la portée familiale et dynastique du texte. La différence entre « retirer » et « retrancher » privilégie l’idiome français, tout en maintenant le contraste entre la fidélité préservée et les ennemis éliminés.
