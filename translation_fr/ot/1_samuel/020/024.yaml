  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: fr
  text: David se cacha dans le champ. Quand vint la nouvelle lune, le roi s’assit pour prendre le repas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’assit sur le pain pour manger » ; ici, le « pain » désigne le repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: se cacha
  rationale: 'Le nifal de סתר a ici un sens réfléchi ou intransitif : David se dissimule intentionnellement. « Se cacha » est naturel et précis en français.'
- source_word: בַּשָּׂדֶה
  choice: dans le champ
  rationale: שׂדה désigne directement le champ, avec l’article défini dans le texte hébreu.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: Quand vint la nouvelle lune
  rationale: Dans ce contexte, חֹדֶשׁ désigne l’occasion marquée par la nouvelle lune, plutôt que le mois de manière abstraite. La tournure temporelle rend clairement la progression du récit.
- source_word: וַיֵּשֶׁב
  choice: s’assit
  rationale: ישׁב exprime ici l’action de prendre place pour manger. « S’assit » conserve directement cette action.
- source_word: עַל הַלֶּחֶם
  choice: pour prendre le repas
  rationale: L’expression signifie littéralement « sur le pain », mais לֶחֶם désigne ici le repas par métonymie. Avec לֶאֱכֹל, « pour prendre le repas » restitue naturellement l’ensemble de l’expression.
- source_word: לֶאֱכֹל
  choice: pour prendre
  rationale: 'L’infinitif exprime le but : le roi s’assoit afin de manger. Il est intégré à l’expression française idiomatique « prendre le repas ».'
- source_word: דָּוִד
  choice: David
  rationale: Le nom propre suit sa forme française traditionnelle.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte emploie le titre défini, qui renvoie à Saül dans le contexte, sans le nommer ici.
