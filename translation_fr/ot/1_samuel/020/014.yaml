  verdict: revise
  source_fidelity: Le sens conditionnel (« si je suis encore en vie »), la demande adressée à David et la finale (« afin que je ne meure pas ») sont bien rendus. Toutefois, « agir envers moi avec la fidélité » reste trop calqué sur l’hébreu et obscurcit l’idiome עשה עם חֶסֶד, qui appelle en français un verbe tel que « témoigner » ou « manifester ».
  naturalness: « N’agiras-tu pas envers moi avec… » est grammatical, mais peu idiomatique en français moderne, particulièrement avec « fidélité ». « Ne me témoigneras-tu pas… » exprime naturellement la demande pressante de Jonathan tout en gardant la forme interrogative négative.
  terminology: « Yahvé » est approprié pour le tétragramme dans une traduction française. Pour חֶסֶד, « bonté fidèle » rend mieux à la fois la bienveillance et la loyauté que le simple « fidélité », lequel peut paraître abstrait et attribuer sans nécessité cette fidélité à Yahvé lui-même. La note conserve correctement les lectures possibles du génitif.
