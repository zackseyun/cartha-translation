  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: fr
  text: Et si je suis encore en vie, ne me témoigneras-tu pas la bonté fidèle de Yahvé[a], afin que je ne meure pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque peut aussi se comprendre : « la fidélité de Yahvé » ou « une fidélité digne de Yahvé ». Elle peut désigner plus directement la propre fidélité de Yahvé, ou la loyauté que David doit manifester sous son regard.'
    reason: Ambiguïté lexicale et syntaxique de חֶסֶד יְהוָה.
lexical_decisions:
- source_word: וְלֹא אִם
  choice: Et si
  rationale: Dans cette demande solennelle, la suite négative et conditionnelle est idiomatique. « Et si » restitue naturellement la continuité du propos sans imposer un « non » peu intelligible en français.
- source_word: עוֹדֶנִּי חָי
  choice: je suis encore en vie
  rationale: Cette formulation française courante conserve la nuance temporelle de עוֹד et l’état exprimé par חָי.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: n’agiras-tu pas envers moi avec
  rationale: La tournure עשה עם signifie « agir envers » ou « traiter ». Avec חֶסֶד, cette traduction reste proche de l’idiome hébreu tout en étant naturelle.
- source_word: חֶסֶד
  choice: fidélité
  rationale: Dans le contexte de l’engagement liant Jonathan et David, חֶסֶד désigne une bonté loyale et constante. « Fidélité » garde cette force relationnelle sans expliciter davantage que le texte la notion d’alliance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est transcrit sous sa forme française courante « Yahvé », plutôt que remplacé par un titre.
- source_word: וְלֹא אָמוּת
  choice: afin que je ne meure pas
  rationale: La proposition finale exprime ici le résultat recherché par Jonathan. « Afin que » rend clairement cette valeur en français.
theological_decisions:
- issue: Sens de חֶסֶד יְהוָה
  choice: la fidélité de Yahvé
  alternative: la bonté fidèle de Yahvé ; une fidélité digne de Yahvé ; la fidélité manifestée au nom de Yahvé
  rationale: Le génitif hébreu peut renvoyer à la fidélité propre à Yahvé, à une fidélité inspirée ou exigée par lui, ou à une bonté loyale manifestée sous son regard. Le texte principal conserve la construction compacte et la note signale cette ambiguïté.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Puisque le texte porte le nom propre divin, sa transcription permet de le distinguer du titre « Seigneur ».
translation_notes:
  register: Français international moderne, digne et accessible. La question négative conserve le caractère pressant de la demande de Jonathan. « Fidélité » évite à la fois le terme trop faible « gentillesse » et une explicitation dogmatique excessive de l’alliance.
