  text: וַ/יִּכְרֹ֥ת יְהוֹנָתָ֖ן עִם בֵּ֣ית דָּוִ֑ד וּ/בִקֵּ֣שׁ יְהוָ֔ה מִ/יַּ֖ד אֹיְבֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: fr
  text: Jonathan conclut une alliance avec la maison de David, et que le SEIGNEUR en demande compte aux ennemis de David ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition hébraïque est elliptique : le verbe peut se comprendre comme un constat (« et le SEIGNEUR le réclama aux ennemis de David ») ou, dans ce contexte d’alliance, comme une formule de souhait (« que le SEIGNEUR en demande compte aux ennemis de David »). L’objet de « réclamer » ou « demander compte » n’est pas exprimé.'
    reason: Conserver l’ambiguïté grammaticale et sémantique du texte hébreu, sans attribuer explicitement cette formule à Jonathan comme discours direct.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: conclut ... une alliance avec
  rationale: Littéralement « coupa avec » ; cette expression idiomatique hébraïque désigne la conclusion d’une alliance.
- source_word: בֵּית דָּוִד
  choice: la maison de David
  rationale: Conserve l’expression dynastique et familiale de l’hébreu, sans la réduire aux seuls contemporains de David.
- source_word: וּבִקֵּשׁ יְהוָה מִיַּד
  choice: Que le SEIGNEUR en demande compte à
  rationale: Dans ce contexte d’alliance, la forme est comprise comme une formule imprécatoire souhaitant que le SEIGNEUR exige réparation ou fasse rendre compte. « En » représente l’objet implicite en hébreu, probablement la violation de l’alliance.
- source_word: אֹיְבֵי דָוִד
  choice: aux ennemis de David
  rationale: Rend directement le groupe nominal hébreu.
theological_decisions:
- issue: Valeur de la dernière proposition
  choice: 'Formule de souhait ou d’imprécation : « Que le SEIGNEUR en demande compte… »'
  alternative: 'Indicatif : « et le SEIGNEUR en demanda compte… » ou formulation plus interprétative : « que le SEIGNEUR se venge… »'
  rationale: Le contexte immédiat d’une alliance solennelle favorise une formule appelant le jugement divin contre ceux qui la violeraient. La traduction évite toutefois « se venge », qui explicite davantage que le verbe hébreu בִּקֵּשׁ.
- issue: Objet implicite de בִּקֵּשׁ
  choice: Le pronom adverbial « en », dont le référent demeure implicite
  alternative: Préciser « la violation de l’alliance » ou supprimer tout objet
  rationale: L’hébreu ne donne pas d’objet exprimé. « En » produit une phrase française naturelle tout en laissant ouverte la nature exacte de ce dont Dieu demandera compte.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Conclure une alliance » est idiomatique et digne ; « demander compte » conserve le caractère judiciaire de la formule sans imposer une notion plus précise de vengeance.
