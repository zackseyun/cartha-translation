  text: וַ/יֹּֽאמֶר ל֥/וֹ יְהוֹנָתָ֖ן מָחָ֣ר חֹ֑דֶשׁ וְ/נִפְקַ֕דְתָּ כִּ֥י יִפָּקֵ֖ד מוֹשָׁבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/018.yaml
  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: fr
  text: 'Jonathan lui dit : « Demain, ce sera la nouvelle lune, et on remarquera ton absence, car ta place sera inoccupée.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu manqueras, car ta place sera vide ». L’hébreu répète dans les deux propositions le même verbe, פקד, créant un jeu de mots difficile à reproduire naturellement en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ יְהוֹנָתָן
  choice: Jonathan lui dit
  rationale: Formule narrative naturelle en français, avec le nom comme sujet et le complément indirect conservé.
- source_word: מָחָר חֹדֶשׁ
  choice: Demain, ce sera la nouvelle lune
  rationale: Dans ce contexte de repas royal, חֹדֶשׁ désigne la célébration de la nouvelle lune, et non simplement le mois.
- source_word: וְנִפְקַדְתָּ
  choice: on remarquera ton absence
  rationale: Le nifal de פקד indique ici que l'absence de David sera constatée ou remarquée. Cette formulation française exprime clairement le sens passif sans suggérer nécessairement qu'il sera regretté affectivement.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement la raison pour laquelle l'absence de David sera remarquée.
- source_word: יִפָּקֵד מוֹשָׁבֶךָ
  choice: ta place sera inoccupée
  rationale: מוֹשָׁב désigne ici la place de David au repas. Le second emploi du nifal de פקד indique que cette place sera constatée comme vacante; « inoccupée » rend le résultat avec naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « On remarquera ton absence » évite l'ambiguïté affective possible de « tu manqueras », tandis que la note signale la répétition et l'ambiguïté de l'hébreu.
