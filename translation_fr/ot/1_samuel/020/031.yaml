review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la durée, le patronyme dépréciatif « le fils de Jessé », l’enjeu de l’établissement de Jonathan et de sa royauté, ainsi que l’idiome final sont préservés. Toutefois, « envoie quelqu’un le chercher et amène-le-moi » attribue maladroitement la seconde action à Jonathan après l’envoi d’un tiers. La formulation révisée conserve les deux impératifs et leur résultat attendu.'
  naturalness: Le français est globalement moderne et soutenu. La révision rend la double injonction plus cohérente en français, sans expliciter inutilement un agent absent du texte hébreu.
  terminology: « Royauté » convient à מַלְכוּת dans son sens de pouvoir et de succession royales. « Fils de la mort » conserve volontairement l’idiome hébreu ; la note en fournit les deux valeurs possibles sans les confondre.
  issues:
  - severity: medium
    issue: Construction de « envoie quelqu’un le chercher et amène-le-moi »
    rationale: Après avoir ordonné d’envoyer quelqu’un, le texte français ordonne à Jonathan d’amener lui-même David. L’hébreu enchaîne deux impératifs dont le sens est d’envoyer chercher David puis de le faire venir auprès de Saül. Une formulation causative française rend mieux cet enchaînement.
  revised_text: Car aussi longtemps que le fils de Jessé vivra sur la terre, ni toi ni ta royauté ne serez solidement établis. Maintenant donc, envoie-le chercher et fais-le amener auprès de moi, car c’est un fils de la mort[a].
