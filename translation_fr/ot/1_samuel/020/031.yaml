source:
  edition: WLC
  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: fr
  text: Car aussi longtemps que le fils de Jessé vivra sur la terre, ni toi ni ta royauté ne serez solidement établis. Maintenant donc, envoie-le chercher et fais-le amener auprès de moi, car c’est un fils de la mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque : « fils de la mort », c’est-à-dire un homme passible de mort ou voué à mourir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication donnée par Saül et conserve clairement sa valeur causale dans le contexte.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: aussi longtemps que
  rationale: Cette tournure rend naturellement en français l’expression hébraïque de durée.
- source_word: בֶּן יִשַׁי
  choice: le fils de Jessé
  rationale: Saül évite délibérément le nom de David. Le patronyme maintient cette distance chargée de mépris.
- source_word: חַי עַל הָאֲדָמָה
  choice: vivra sur la terre
  rationale: Cette traduction directe conserve la portée générale de אֲדָמָה sans la limiter au territoire d’Israël.
- source_word: לֹא תִכּוֹן
  choice: ne serez solidement établis
  rationale: Le nifal de כון exprime l’idée d’être affermi ou établi. L’adverbe « solidement » restitue la nuance de stabilité dynastique.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: ni toi ni ta royauté
  rationale: La coordination négative est idiomatique en français. « Royauté » désigne ici à la fois le pouvoir royal de Jonathan et sa continuité dynastique, plus précisément que le territoire d’un royaume.
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: La formule marque à la fois l’urgence et la conséquence que Saül tire de ce qui précède.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: envoie quelqu’un le chercher et amène-le-moi
  rationale: Le premier impératif suppose l’envoi d’un tiers; cette formulation française explicite seulement ce complément implicite tout en conservant les deux actions ordonnées.
- source_word: בֶּן מָוֶת הוּא
  choice: c’est un fils de la mort
  rationale: La traduction garde l’image hébraïque forte et laisse la note en expliquer la valeur idiomatique, au lieu de choisir silencieusement entre le fait de mériter la mort et celui d’y être voué.
theological_decisions:
- issue: Portée de l’expression « fils de la mort »
  choice: Conserver l’expression imagée dans le texte
  alternative: « il mérite la mort » ou « il est voué à la mort »
  rationale: L’idiome peut désigner une personne passible de mort ou destinée à mourir. Le conserver évite de trancher artificiellement entre ces nuances dans la parole de Saül.
translation_notes:
  register: Français moderne, digne et direct. Le futur « vivra » convient à la perspective formulée par Saül. L’accord au masculin pluriel dans « établis » coordonne Jonathan et sa royauté. Le marqueur de note est placé après l’expression qu’il explique.
