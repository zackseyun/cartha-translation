  to: Car aussi longtemps que le fils de Jessé vivra sur la terre, ni toi ni ta royauté ne serez solidement établis. Maintenant donc, envoie-le chercher et fais-le amener auprès de moi, car c’est un fils de la mort[a].
  rationale: La seconde injonction est reformulée afin que l’envoi et l’amenée de David relèvent d’une même instruction adressée à Jonathan, tout en préservant la concision et l’ambiguïté fonctionnelle des impératifs hébreux. Aucun changement de sens théologique ou historique n’est introduit.
