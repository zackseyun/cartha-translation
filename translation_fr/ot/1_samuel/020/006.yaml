  text: אִם פָּקֹ֥ד יִפְקְדֵ֖/נִי אָבִ֑י/ךָ וְ/אָמַרְתָּ֗ נִשְׁאֹל֩ נִשְׁאַ֨ל מִמֶּ֤/נִּי דָוִד֙ לָ/רוּץ֙ בֵּֽית לֶ֣חֶם עִיר֔/וֹ כִּ֣י זֶ֧בַח הַ/יָּמִ֛ים שָׁ֖ם לְ/כָל הַ/מִּשְׁפָּחָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: fr
  text: 'Si ton père remarque vraiment mon absence[a], tu diras : « David m’a demandé avec insistance la permission de se rendre à Bethléem, sa ville, en toute hâte[b], car le sacrifice annuel y a lieu pour toute la famille[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « constate vraiment que je ne suis pas là ». L’hébreu renforce le verbe au moyen d’un infinitif absolu associé à un verbe conjugué.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « courir à Bethléem » ; le sens est de s’y rendre rapidement.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le sacrifice des jours », expression qui désigne ici un sacrifice périodique, probablement annuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: remarque vraiment mon absence
  rationale: La construction infinitif absolu + verbe conjugué renforce פקד. Dans le contexte du repas, Saül constatera que David est absent. Cette formulation française exprime naturellement à la fois l’acte de remarquer et l’objet implicite de cette constatation.
- source_word: אָבִיךָ
  choice: ton père
  rationale: Traduction directe et naturelle du nom avec suffixe de deuxième personne du masculin singulier, David s’adressant à Jonathan.
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  choice: m’a demandé avec insistance la permission
  rationale: La seconde construction emphatique, infinitif absolu + verbe conjugué, est rendue par « avec insistance ». Le contexte appelle une demande de permission adressée à Jonathan.
- source_word: לָרוּץ
  choice: courir
  rationale: Le sens concret du verbe est conservé. Ici, il peut aussi exprimer le fait de partir ou de se rendre rapidement quelque part.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: Bethléem, sa ville
  rationale: Rendu formel de l’apposition hébraïque, sans remplacer « ville » par l’interprétation plus précise « ville natale ».
- source_word: זֶבַח הַיָּמִים
  choice: le sacrifice annuel
  rationale: L’expression désigne un sacrifice périodique lié au cycle des jours, vraisemblablement célébré chaque année.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: toute la famille
  rationale: מִשְׁפָּחָה peut désigner une famille ou un clan. « Toute la famille » est clair et naturel, tout en maintenant la portée collective de כָל.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe reste proche de l’hébreu, mais la dernière proposition est réorganisée (« toute la famille y célèbre ») afin d’éviter une tournure française lourde. Les deux constructions emphatiques hébraïques sont explicitement rendues.
