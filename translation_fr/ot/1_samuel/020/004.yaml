  yaml_path: translation/ot/1_samuel/020/004.yaml
  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: fr
  text: 'Alors Jonathan dit à David : « Que désires-tu[a] ? Je le ferai pour toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Que dira ton âme ? » Ici, « âme » exprime le désir ou la volonté intérieure.'
    reason: Préserve l’idiome hébreu sous-jacent et explique le rendu français naturel.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » rend naturellement cette succession en français.
- source_word: יְהוֹנָתָן אֶל דָּוִד
  choice: Jonathan dit à David
  rationale: Les noms suivent leur forme française traditionnelle, et אֶל introduit le destinataire de la parole.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: Dis-moi ce que tu désires
  rationale: Littéralement, « que dira ton être/ton âme ? ». Dans ce contexte, נֶפֶשׁ désigne la personne intérieure et son désir. La formulation française retenue conserve l'invitation ouverte de Jonathan sans employer l'expression peu naturelle « que dit ton âme ? ».
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: et je le ferai pour toi
  rationale: 'Le verbe עשה signifie couramment « faire » ; le pronom « le » reprend naturellement en français ce que David demandera, tandis que לְ exprime ici le bénéfice : « pour toi ».'
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement convient au dialogue personnel entre Jonathan et David. L'idiome hébreu fondé sur נֶפֶשׁ est rendu par son sens contextuel afin d'éviter une tournure artificielle en français.
