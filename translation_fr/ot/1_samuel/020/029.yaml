  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: fr
  text: 'Il a dit : « Laisse-moi partir, je te prie, car nous avons un sacrifice familial dans la ville, et mon frère lui-même m’a donné l’ordre. Maintenant donc, si j’ai trouvé grâce à tes yeux, permets-moi, je te prie, de m’échapper[a] et d’aller voir mes frères[b]. » C’est pourquoi il n’est pas venu à la table du roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « me dérober » ou « partir discrètement ».
    reason: lexical_alternative
  - marker: b
    text: « Mes frères » peut désigner les frères de David au sens strict ou, plus largement, les hommes de sa parenté au sein du groupe familial.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: Laisse-moi partir, je te prie
  rationale: L’impératif de שלח accompagné du suffixe de première personne demande ici l’autorisation de partir. « Je te prie » rend la particule de politesse נָא dans un registre digne et naturel.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: un sacrifice familial
  rationale: זֶבַח désigne bien un sacrifice, généralement accompagné d’un repas communautaire, tandis que מִשְׁפָּחָה le rattache à la famille ou au clan. Cette formulation conserve la dimension cultuelle sans réduire l’événement à un simple repas.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Rendu locatif direct et naturel de la préposition ב avec עִיר.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: et mon frère lui-même me l’a ordonné
  rationale: « Lui-même » fait entendre l’emphase portée par הוּא. Le verbe צוה exprime un ordre plutôt qu’une simple invitation; le pronom « l’ » restitue en français l’objet implicite sans en préciser indûment le contenu.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: si j’ai trouvé grâce à tes yeux
  rationale: Cette formule de politesse hébraïque reste intelligible en français et en conserve l’image ainsi que la tonalité respectueuse.
- source_word: אִמָּלְטָה נָּא
  choice: permets-moi, je te prie, de m’échapper
  rationale: Le cohortatif de מלט peut exprimer le fait d’échapper ou de se dérober. La construction avec « permets-moi » rend la demande d’autorisation portée par le contexte, tandis que « je te prie » représente נָא.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: et d’aller voir mes frères
  rationale: ראה signifie littéralement « voir »; « aller voir » est idiomatique en français dans le contexte d’une réunion familiale. אֶחָי demeure « mes frères », avec une note signalant son extension possible à la parenté masculine.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution introduit naturellement en français la conséquence qui explique l’absence de David.
- source_word: לֹא בָא אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: il n’est pas venu à la table du roi
  rationale: Le passé composé convient à l’explication présente de son absence et conserve l’image concrète de la table royale.
theological_decisions: []
translation_notes:
  register: Français international moderne, respectueux et narratif. La formulation conserve les répétitions de politesse, l’image « trouver grâce à tes yeux », l’emphase sur le frère et l’ambiguïté de מלט, sans expliciter ce que le frère a précisément ordonné.
