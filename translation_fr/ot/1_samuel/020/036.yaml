  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: fr
  text: 'Il dit à son jeune serviteur : « Cours donc chercher les flèches que je tire. » Le jeune serviteur courut, et Jonathan tira la flèche au-delà de lui[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après lui », c’est-à-dire au-delà du jeune serviteur.
    reason: Alternative lexicale pour la relation spatiale exprimée par לְהַעֲבִרוֹ ; elle précise le référent de « lui » sans modifier le sens.
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: à son jeune serviteur / le jeune serviteur
  rationale: נַעַר peut désigner un jeune homme, un garçon ou un serviteur. Ici, le contexte montre qu’il s’agit de l’assistant de Jonathan ; « jeune serviteur » conserve à la fois la nuance d’âge et la fonction sans réduire le terme à l’une des deux.
- source_word: רוּץ
  choice: Cours
  rationale: L’impératif concret « cours » rend directement רוּץ et correspond à l’action demandée.
- source_word: מְצָא נָא
  choice: je te prie, retrouver
  rationale: מְצָא signifie « trouver » ou, dans ce contexte de ramassage, « retrouver » ; נָא adoucit la demande et se rend naturellement par « je te prie » dans un registre digne.
- source_word: הַחִצִּים
  choice: les flèches
  rationale: Le pluriel défini est rendu directement.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: que je tire
  rationale: Le participe מוֹרֶה présente l’action en cours ou imminente. Le présent français convient naturellement à la scène.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: et Jonathan tira la flèche
  rationale: Le sujet pronominal renvoie à Jonathan dans le contexte. Répéter son nom en français évite que « il » soit compris comme désignant le jeune serviteur. L’article du singulier hébreu est conservé par « la flèche ».
- source_word: לְהַעֲבִרוֹ
  choice: au-delà de lui
  rationale: La forme causative de עבר indique que Jonathan fait passer la flèche au-delà du jeune serviteur. Cette formulation garde le signal spatial important pour la suite du récit.
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. « Je te prie » conserve la nuance de נָא sans devenir familier. La répétition de « jeune serviteur » suit celle du nom hébreu et clarifie les référents.
