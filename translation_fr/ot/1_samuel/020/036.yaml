revisions:
- from: 'Il dit à son jeune serviteur : « Cours, je te prie, retrouver les flèches que je tire. » Le jeune serviteur courut, et Jonathan tira la flèche au-delà de lui[a].'
  to: 'Il dit à son jeune serviteur : « Cours donc chercher les flèches que je tire. » Le jeune serviteur courut, et Jonathan tira la flèche au-delà de lui[a].'
  rationale: La révision remplace « retrouver » par une expression française idiomatique qui ne présuppose pas que les flèches avaient déjà été localisées. Elle fluidifie aussi l’impératif tout en conservant la valeur d’incitation de נָא. Le reste de la formulation maintient la répétition du jeune serviteur, l’identification claire de Jonathan et le signal narratif essentiel selon lequel la flèche passe au-delà de l’attendant.
