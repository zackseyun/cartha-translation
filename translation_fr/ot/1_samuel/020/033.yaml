  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: fr
  text: Alors Saül lança la lance contre lui pour le frapper, et Jonathan comprit que son père avait décidé[a] de tuer David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « son père avait résolu » ou « la chose était arrêtée du côté de son père ». L’expression hébraïque présente la décision de Saül comme ferme et définitive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  choice: lança
  rationale: Le verbe désigne l’action de jeter ou de lancer. « Lança » convient naturellement à une arme dirigée avec violence contre quelqu’un.
- source_word: הַחֲנִית
  choice: sa lance
  rationale: Le nom désigne une lance ou un javelot. En français courant, « lance » est le terme général le plus naturel; le possessif explicite que l’arme est celle de Saül, ce que le contexte rend évident.
- source_word: עָלָיו
  choice: contre lui
  rationale: Avec le verbe « lancer », la préposition exprime ici une direction hostile. « Contre lui » restitue clairement cette nuance.
- source_word: לְהַכֹּתוֹ
  choice: pour le frapper
  rationale: L’infinitif précédé de לְ exprime le but. Cette formulation reste proche de l’hébreu sans préciser au-delà du texte la nature exacte du coup recherché.
- source_word: וַיֵּדַע
  choice: comprit
  rationale: Le verbe signifie normalement « savoir », mais, après l’acte de Saül, il marque ici la prise de conscience de Jonathan. « Comprit » est plus naturel dans la narration française.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Jonathan comprend.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: son père avait fermement décidé
  rationale: L’expression hébraïque présente la décision comme arrêtée et menée à son terme du côté du père de Jonathan. La traduction française en exprime la résolution ferme tout en signalant l’idiome dans une note.
- source_word: לְהָמִית אֶת דָּוִד
  choice: de faire mourir David
  rationale: La tournure causative signifie mettre quelqu’un à mort. « Faire mourir David » conserve cette valeur et la gravité de l’intention délibérée.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle du nom propre.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle du nom propre.
- source_word: דָּוִד
  choice: David
  rationale: Forme française traditionnelle du nom propre.
