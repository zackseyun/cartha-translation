  text: וַ/יְהִ֗י מִֽ/מָּחֳרַ֤ת הַ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י וַ/יִּפָּקֵ֖ד מְק֣וֹם דָּוִ֑ד וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל יְהוֹנָתָ֣ן בְּנ֔/וֹ מַדּ֜וּעַ לֹא בָ֧א בֶן יִשַׁ֛י גַּם תְּמ֥וֹל גַּם הַ/יּ֖וֹם אֶל הַ/לָּֽחֶםס־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: fr
  text: 'Le lendemain, le deuxième jour de la nouvelle lune, on constata que la place de David était vide. Saül dit alors à son fils Jonathan : « Pourquoi le fils de Jessé n’est-il venu au repas[a] ni hier ni aujourd’hui ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « au pain » ; le pain désigne ici le repas pris à table.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת
  choice: Le lendemain
  rationale: Cette expression temporelle désigne le jour qui suit celui mentionné auparavant. « Le lendemain » est naturel et précis en français moderne.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: le deuxième jour de la nouvelle lune
  rationale: Dans ce contexte de repas royal lié à l’observance de la nouvelle lune, חֹדֶשׁ renvoie à la nouvelle lune plutôt qu’au mois en général, et הַשֵּׁנִי précise qu’il s’agit du deuxième jour.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: on constata que la place de David était vide
  rationale: Le niphal de פקד indique ici que l’absence à la place de David fut remarquée. Cette formulation exprime clairement le constat tout en conservant la place comme sujet logique de l’observation.
- source_word: בְּנוֹ
  choice: son fils
  rationale: La désignation filiale est explicitement conservée, conformément à l’hébreu.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Équivalent français direct et naturel de l’interrogatif demandant la raison.
- source_word: בֶן יִשַׁי
  choice: le fils de Jessé
  rationale: Saül désigne David par son patronyme plutôt que par son nom. Le conserver maintient la distance rhétorique, voire le mépris possible, sans l’expliciter dans le texte.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: ni hier ni aujourd’hui
  rationale: Sous la négation, la tournure française avec « ni… ni… » rend naturellement l’hébreu littéral « aussi hier, aussi aujourd’hui » et préserve la portée sur les deux jours.
- source_word: אֶל הַלָּחֶם
  choice: au repas
  rationale: לֶחֶם signifie littéralement « pain », mais désigne ici par métonymie le repas à la table du roi. « Au repas » transmet clairement le sens contextuel, tandis qu’une note conserve l’image hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La formulation évite le calque pesant « et il arriva » tout en conservant la progression du récit. Le patronyme « fils de Jessé » est maintenu sans ajouter d’interprétation psychologique explicite.
