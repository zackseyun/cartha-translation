  text: וַ/יֵּ֣שֶׁב הַ֠/מֶּלֶךְ עַל מ֨וֹשָׁב֜/וֹ כְּ/פַ֣עַם בְּ/פַ֗עַם אֶל מוֹשַׁב֙ הַ/קִּ֔יר וַ/יָּ֨קָם֙ יְה֣וֹנָתָ֔ן וַ/יֵּ֥שֶׁב אַבְנֵ֖ר מִ/צַּ֣ד שָׁא֑וּל וַ/יִּפָּקֵ֖ד מְק֥וֹם דָּוִֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: fr
  text: Le roi s’assit à sa place, comme les autres fois, près du mur. Jonathan se leva, Abner s’assit à côté de Saül, mais la place de David resta vide[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la place de David manquait ». Le verbe hébreu peut indiquer qu’une personne ou une chose attendue fait défaut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne Saül, mais le texte hébreu emploie ici son titre; la traduction conserve cette forme du récit.
- source_word: מוֹשָׁבוֹ כְּפַעַם בְּפַעַם
  choice: à sa place habituelle
  rationale: Dans le contexte du repas, מוֹשָׁב désigne la place où l’on s’assied, et l’expression répétitive כְּפַעַם בְּפַעַם signifie « comme les autres fois » ou « comme d’habitude ». La formulation française réunit naturellement ces deux éléments.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: contre le mur
  rationale: La phrase situe la place du roi par rapport au mur. « Contre le mur » restitue concrètement et naturellement cette disposition sans créer l’expression artificielle « siège du mur ».
- source_word: וַיָּקָם יְהוֹנָתָן
  choice: Jonathan se leva
  rationale: Le verbe קום signifie ici « se lever ». La traduction conserve l’action telle que la présente le texte massorétique, sans tenter d’en expliquer la raison.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: Abner s’assit à côté de Saül
  rationale: מִצַּד exprime la proximité latérale; « à côté de » est clair et idiomatique en français moderne.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: la place de David resta vide
  rationale: Dans ce contexte, la forme de פקד indique que la place attendue de David se trouve sans son occupant. « Resta vide » exprime naturellement la scène tout en laissant la nuance lexicale alternative à la note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque autour de מוֹשָׁב est condensée en « place habituelle » pour éviter une lourdeur peu naturelle, tandis que l’ordre des actions et la difficulté non résolue de « Jonathan se leva » sont conservés.
