  to: Le roi s’assit à sa place, comme les autres fois, près du mur. Jonathan se leva, Abner s’assit à côté de Saül, mais la place de David resta vide[a].
  rationale: La révision rétablit la comparaison temporelle explicite et remplace une note interprétative par une véritable alternative lexicale, sans résoudre la difficulté narrative liée au fait que Jonathan se lève.
