base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: fr
  text: 'David dit à Jonathan : « Regarde, demain, c’est la nouvelle lune[a], et je suis censé m’asseoir avec le roi pour manger. Mais laisse-moi partir, et je me cacherai dans la campagne jusqu’au troisième soir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « nouvelle lune » marquait le début du mois et donnait lieu à une célébration, notamment à un repas particulier.
    reason: cultural_note
  - marker: b
    text: 'Ou : « jusqu’au soir du troisième jour ». L’expression hébraïque est elliptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Écoute
  rationale: Marque l’appel à l’attention de Jonathan dans un français oral naturel; « Voici » serait ici plus solennel et moins idiomatique.
- source_word: חֹדֶשׁ מָחָר
  choice: demain, c’est la nouvelle lune
  rationale: חֹדֶשׁ désigne ici la nouvelle lune et, dans ce contexte de repas royal, l’observance mensuelle qui lui est associée.
- source_word: יָשֹׁב אֵשֵׁב
  choice: je suis censé prendre place
  rationale: La construction intensive exprime l’attente ferme que David soit assis à la table royale, plutôt qu’un devoir moral personnel.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: auprès du roi pour le repas
  rationale: Rend naturellement la présence de David assis avec le roi afin de manger, sans alourdir la phrase.
- source_word: וְשִׁלַּחְתַּנִי
  choice: Mais laisse-moi partir
  rationale: Le sens littéral « envoie-moi » prend en contexte la valeur d’une demande de permission adressée à Jonathan.
- source_word: וְנִסְתַּרְתִּי
  choice: je me cacherai
  rationale: Le waw enchaîne le résultat ou la suite projetée de la permission demandée; le futur français conserve ce lien sans imposer une finalité trop explicite.
- source_word: בַשָּׂדֶה
  choice: dans la campagne
  rationale: Dans ce récit, שָׂדֶה désigne l’espace ouvert hors de la ville; « campagne » est plus naturel en français que le singulier « dans le champ » lorsqu’aucune parcelle précise n’est visée.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: jusqu’au troisième soir
  rationale: Reproduit la formulation elliptique de l’hébreu au lieu de trancher silencieusement en faveur de « l夕 du troisième jour ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue garde un ton direct. « Prendre place auprès du roi pour le repas » explicite l’image de la présence attendue à table sans transformer cette attente sociale en obligation morale. Les marqueurs [a] et [b] sont placés sur les expressions qu’ils expliquent.
