  naturalness: Le français est fluide et de registre moderne. « Regarde » convient naturellement dans ce dialogue. « M’asseoir avec le roi pour manger » est simple, idiomatique et conserve l’image concrète du texte.
  terminology: « Nouvelle lune » est le terme approprié dans ce contexte. « Je suis censé » rend de façon équilibrée l’attente marquée par l’infinitif absolu et le verbe fini, sans lui donner le sens d’un devoir moral. « Dans la campagne » est recevable pour בַשָּׂדֶה.
