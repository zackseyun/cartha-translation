base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: fr
  text: 'Il lui répondit : « Certainement pas ! Tu ne mourras pas. Écoute, mon père ne fait rien, que ce soit important ou insignifiant, sans m’en informer[a]. Pourquoi donc mon père me cacherait-il cette affaire ? Il n’en est rien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans découvrir mon oreille », expression hébraïque signifiant « sans m’en informer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: Certainement pas !
  rationale: Cette expression marque un rejet énergique. La formulation française est naturelle et n’introduit pas de référence explicite à Dieu, absente de l’hébreu.
- source_word: לֹא תָמוּת
  choice: Tu ne mourras pas
  rationale: Rend directement l’assurance donnée à David dans un français actuel.
- source_word: הִנֵּה
  choice: Écoute,
  rationale: L’interjection attire l’attention sur l’explication qui suit ; « Écoute » remplit naturellement cette fonction dans le dialogue.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: rien, que ce soit important ou insignifiant
  rationale: Conserve le mérisme hébreu, qui englobe toute action ou affaire, quelle qu’en soit l’importance.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: sans m’en informer
  rationale: Traduit le sens de l’expression idiomatique « découvrir mon oreille » tout en signalant sa forme littérale en note.
- source_word: יַסְתִּיר
  choice: cacherait
  rationale: Le conditionnel convient à la question rhétorique française fondée sur le raisonnement de Jonathan.
- source_word: הַדָּבָר הַזֶּה
  choice: cette affaire
  rationale: דבר désigne ici le projet attribué à Saül, plutôt qu’une simple parole.
- source_word: אֵין זֹאת
  choice: Ce n’est pas vrai
  rationale: Rend la brève négation finale par laquelle Jonathan rejette l’affirmation de David, sans développer davantage son sens.
- source_word: אָבִי
  choice: mon père
  rationale: La répétition explicite de l’hébreu est conservée afin de maintenir l’insistance relationnelle de Jonathan.
