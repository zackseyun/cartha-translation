base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: fr
  text: 'Alors la colère de Saül s’enflamma contre Jonathan, et il lui dit : « Fils d’une femme perverse et rebelle[a] ! Est-ce que je ne sais pas que tu as choisi le fils de Jessé[b], à ta propre honte et à la honte de la nudité de ta mère[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Fils de perversion et de rébellion ! » L’injure hébraïque est difficile et très idiomatique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu prends le parti du fils de Jessé ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression « la honte de la nudité de ta mère » est une formule hébraïque très dure exprimant le déshonneur familial.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: la colère de Saül s’enflamma contre Jonathan
  rationale: L’expression hébraïque associe littéralement le fait de brûler à אַף, terme qui désigne ici la colère. « S’enflamma » conserve cette image vive dans un français naturel, et « contre » marque la personne visée.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: Fils d’une femme perverse et rebelle
  rationale: L’injure hébraïque est difficile et fortement idiomatique. L’ajout explicite de « femme » rend en français l’insulte visant la mère de Jonathan, que confirme la fin du verset, sans en atténuer la violence.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Est-ce que je ne sais pas
  rationale: La tournure interrogative négative est rhétorique et accusatrice. La conserver respecte le ton de confrontation plutôt que de la transformer en simple affirmation.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: tu as choisi le fils de Jessé
  rationale: Le verbe בחר signifie fondamentalement « choisir ». Dans le contexte, ce choix implique que Jonathan prend le parti de David, mais la formulation principale maintient l’ambiguïté et le noyau lexical de l’hébreu.
- source_word: לְבָשְׁתְּךָ
  choice: à ta propre honte
  rationale: La préposition לְ exprime ici le résultat ou la conséquence. « À ta propre honte » est naturel et souligne que Saül présente le choix de Jonathan comme son déshonneur personnel.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: et à la honte de la nudité de ta mère
  rationale: עֶרְוָה signifie littéralement « nudité » et porte ici une forte connotation de honte familiale. La traduction conserve délibérément la formulation choquante et inhabituelle de l’injure.
