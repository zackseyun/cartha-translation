id: 1SA.20.23
reference: 1 Samuel 20:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: fr
  text: Quant à l’affaire[a] dont nous avons parlé, toi et moi, voici que Yahvé est entre moi et toi pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la parole ». Le mot hébreu peut signifier « parole », « affaire » ou « chose » ; il renvoie ici à ce dont Jonathan et David viennent de parler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: Quant à l’affaire
  rationale: דָּבָר peut désigner une parole, une affaire ou une chose. Ici, le terme renvoie à ce que Jonathan et David viennent de convenir. « Quant à » rend naturellement la reprise thématique introduite par וְהַ־.
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: dont nous avons parlé, toi et moi
  rationale: Cette formulation française est naturelle avec « affaire » et conserve l’insistance explicite du texte hébreu sur les deux interlocuteurs.
- source_word: הִנֵּה
  choice: voici que
  rationale: « Voici que » attire solennellement l’attention sur l’affirmation qui suit, sans employer l’archaïsme « voici » isolé ni le registre familier de « regarde ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: בֵּינִי וּבֵינְךָ
  choice: entre moi et toi
  rationale: La traduction conserve l’ordre hébreu et la formulation relationnelle, sans expliciter dans le corps du verset un rôle de témoin ou de garant seulement suggéré par le contexte.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression moderne et digne rend clairement la durée indéfinie et durable exprimée par l’idiome hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. Sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Sens de Yahvé « entre » Jonathan et David
  choice: conserver littéralement « entre moi et toi »
  alternative: expliciter « témoin » ou « garant entre nous »
  rationale: Le contexte d’alliance permet de comprendre Yahvé comme témoin ou garant, mais le verset ne donne pas lui-même ce complément. La traduction maintient donc l’ambiguïté et la force théologique de l’expression.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe garde la reprise thématique et l’insistance personnelle du texte hébreu, tout en évitant une formulation excessivement littérale.
