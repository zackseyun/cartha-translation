id: 1SA.20.22
reference: 1 Samuel 20:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: fr
  text: 'Mais si je dis au jeune homme : « Regarde, les flèches sont au-delà de toi[a] », alors va, car Yahvé t’a fait partir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque peut aussi se traduire : « les flèches sont plus loin que toi ». Elles ont dépassé le jeune homme, signalant ainsi à David qu’il doit partir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit, en contraste avec le signal précédent, l’autre éventualité envisagée par Jonathan.
- source_word: לָעֶלֶם
  choice: au jeune homme
  rationale: עֶלֶם désigne un jeune homme; le terme ne précise pas à lui seul qu’il s’agit d’un serviteur.
- source_word: הִנֵּה
  choice: Regarde
  rationale: Rend naturellement en français moderne la particule qui attire l’attention sur l’emplacement des flèches.
- source_word: מִמְּךָ וָהָלְאָה
  choice: sont au-delà de toi
  rationale: L’expression situe les flèches plus loin que le jeune homme, donc après lui du point de vue de Jonathan, tout en conservant l’image spatiale du signal.
- source_word: לֵךְ
  choice: va
  rationale: Rend directement l’impératif de הלך sans ajouter une destination absente du texte.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison donnée à David de partir.
- source_word: שִׁלַּחֲךָ
  choice: t’a fait partir
  rationale: Dans ce contexte, le piel de שׁלח exprime le fait de renvoyer ou de faire partir David; cette formulation française conserve l’idée de départ sans suggérer une mission précise.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin יהוה au lieu de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin; « Yahvé » le représente explicitement en français.
- issue: Agent du départ de David
  choice: Yahvé t’a fait partir
  alternative: Yahvé t’a renvoyé
  rationale: La formulation maintient l’affirmation théologique selon laquelle le départ de David relève de l’action de Yahvé, tout en évitant la nuance potentiellement disciplinaire de « renvoyer ».
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste vif, et l’expression spatiale du signal est conservée sans archaïsme.
