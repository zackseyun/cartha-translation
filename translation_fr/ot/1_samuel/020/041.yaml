base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: fr
  text: Quand le garçon fut arrivé, David se leva d’auprès du Néguev[a], puis il tomba face contre terre et se prosterna trois fois. Ils s’embrassèrent et pleurèrent ensemble, jusqu’à ce que David pleure plus encore[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’auprès du sud » ou « d’auprès du Néguev ». L’expression hébraïque est difficile ; certains comprennent qu’elle désigne le tertre ou la pierre près desquels David s’était caché.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « jusqu’à ce que David l’emporte ». L’hébreu peut indiquer que les pleurs de David dépassèrent ceux de Jonathan ou qu’ils devinrent plus intenses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: Quand le garçon fut arrivé
  rationale: נַעַר désigne ici le jeune serviteur de Jonathan mentionné dans le contexte précédent. La tournure temporelle assure un enchaînement narratif naturel.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: du côté sud
  rationale: נֶגֶב signifie normalement « sud » ou « Néguev ». La construction est difficile dans ce contexte ; le texte principal conserve l’indication directionnelle du texte massorétique sans la remplacer par une conjecture telle que « près du tertre ».
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: il tomba face contre terre
  rationale: Cette expression rend directement la posture physique indiquée par l’idiome hébreu, dans un français naturel.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: se prosterna trois fois
  rationale: Le verbe désigne ici un profond geste d’inclination ou de prosternation. « Se prosterna » correspond à la posture décrite, sans préciser indûment sa portée sociale.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: Ils s’embrassèrent
  rationale: La construction réciproque est rendue idiomatiquement. Le geste d’affection et d’adieu est conservé sans euphémisme.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: pleurèrent ensemble
  rationale: La formulation française exprime clairement la réciprocité de la scène tout en restant concise.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: jusqu’à ce que David pleure davantage
  rationale: Le verbe גדל, littéralement « devenir grand, augmenter », est elliptique ici. Dans le contexte des pleurs, il indique vraisemblablement que ceux de David s’intensifièrent ou dépassèrent ceux de Jonathan ; la traduction maintient cette relative indétermination.
