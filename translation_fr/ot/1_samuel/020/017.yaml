  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: fr
  text: Jonathan fit de nouveau prêter serment à David[a], en raison de l’amour qu’il lui portait[b], car il l’aimait comme sa propre vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « continua de faire prêter serment à David » ou « plaça de nouveau David sous serment ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « dans son amour pour lui ». La tournure peut exprimer le fondement ou le motif du renouvellement du serment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: fit de nouveau
  rationale: Avec l’infinitif qui suit, יסף exprime ici la répétition de l’action. « De nouveau » est naturel en français tout en conservant cette valeur.
- source_word: לְהַשְׁבִּיעַ
  choice: prêter serment à David
  rationale: Le hiphil de שבע signifie faire jurer quelqu’un ou le placer sous serment. La construction « fit … prêter serment » en conserve la valeur causative.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: au nom de l’amour qu’il lui portait
  rationale: Cette formulation française rend la relation entre le serment et l’amour de Jonathan sans réduire cet amour à la simple amitié. La préposition ב peut ici indiquer le fondement ou le motif de l’action.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit l’explication de l’action de Jonathan ; « car » maintient clairement ce lien dans un registre narratif digne.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: comme sa propre vie
  rationale: נפש peut désigner l’âme, la personne ou la vie. Dans cette expression, « sa propre vie » communique naturellement en français l’intensité de l’attachement sans imposer une anthropologie particulière.
- source_word: אֲהֵבוֹ
  choice: il l’aimait
  rationale: Le verbe affirme l’amour de Jonathan pour David dans l’explication narrative. L’imparfait convient au contexte et à l’état durable évoqué.
theological_decisions:
- issue: Nature de l’amour de Jonathan pour David
  choice: Conserver le terme fort « amour » et l’image de la propre vie, sans qualifier davantage la nature de cet attachement.
  alternative: Parler seulement d’amitié, ou employer une formulation qui suggérerait explicitement un attachement romantique ou sexuel.
  rationale: Le texte hébreu insiste sur אהב et sur נפש. La traduction doit préserver cette profonde affection personnelle et sa portée d’engagement, sans atténuation ni ajout interprétatif.
translation_notes:
  register: Français international moderne, narratif et digne. « Fit … prêter serment » préserve la valeur causative de l’hébreu ; « comme sa propre vie » reste idiomatique tout en gardant la force de l’expression hébraïque.
