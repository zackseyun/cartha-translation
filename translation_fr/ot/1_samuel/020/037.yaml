source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/נַּ֨עַר֙ עַד מְק֣וֹם הַ/חֵ֔צִי אֲשֶׁ֥ר יָרָ֖ה יְהוֹנָתָ֑ן וַ/יִּקְרָ֨א יְהוֹנָתָ֜ן אַחֲרֵ֤י הַ/נַּ֨עַר֙ וַ/יֹּ֔אמֶר הֲ/ל֥וֹא הַ/חֵ֖צִי מִמְּ/ךָ֥ וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: fr
  text: 'Lorsque le garçon arriva à l’endroit où se trouvait la flèche que Jonathan avait tirée[a], Jonathan l’appela et lui dit : « La flèche n’est-elle pas plus loin que toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà de toi ». L’expression hébraïque signifie littéralement « à partir de toi et plus loin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le verbe בוא au wayyiqtol exprime ici l’arrivée du garçon à un endroit précis; « arriva » est naturel dans un récit français.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un jeune homme ou un serviteur; dans cette scène, « le garçon » convient au jeune auxiliaire de Jonathan sans surinterpréter sa fonction.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: à l’endroit où se trouvait la flèche
  rationale: Cette formulation rend naturellement en français le mouvement jusqu’au lieu de la flèche, tout en évitant l’expression peu idiomatique « l’endroit de la flèche ».
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: que Jonathan avait tirée
  rationale: ירה désigne ici le tir d’une flèche; le plus-que-parfait marque clairement l’antériorité de ce tir par rapport à l’arrivée du garçon.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: Jonathan l’appela
  rationale: Avec אַחֲרֵי, קרא décrit un appel adressé à quelqu’un qui se trouve devant ou plus loin; le pronom « l’ » donne ici un français fluide sans changer le référent.
- source_word: הֲלוֹא
  choice: n’est-elle pas
  rationale: La tournure interrogative conserve la question rhétorique qui appelle une réponse affirmative.
- source_word: הַחֵצִי
  choice: la flèche
  rationale: « Flèche » est le sens ordinaire de חֵץ et convient directement au contexte.
- source_word: מִמְּךָ וָהָלְאָה
  choice: plus loin que toi
  rationale: La locution signifie littéralement « à partir de toi et au-delà »; « plus loin que toi » en restitue naturellement le sens spatial tout en préservant sa fonction de signal codé.
