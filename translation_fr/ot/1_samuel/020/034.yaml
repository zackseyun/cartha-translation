  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: fr
  text: Jonathan se leva de table dans une ardente colère et ne mangea rien le deuxième jour du mois[a], car il était peiné à cause de David, parce que son père l’avait humilié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le deuxième jour de la nouvelle lune ». Le mot hébreu peut désigner le mois ou la nouvelle lune; il s’agit ici du repas royal célébré à la nouvelle lune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe narratif קום au wayyiqtol indique que Jonathan se lève et quitte la table; « se leva » est naturel dans un récit français.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: de table
  rationale: Dans le contexte d’un repas, « se lever de table » rend idiomatiquement le mouvement d’éloignement exprimé par מֵעִם.
- source_word: בָּחֳרִי אָף
  choice: dans une ardente colère
  rationale: L’expression évoque littéralement la chaleur ou l’embrasement de la colère; « ardente colère » en conserve l’intensité dans un registre digne.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: ne mangea rien
  rationale: לֶחֶם peut désigner le pain ou, par extension, la nourriture. Ici, l’idée est qu’il s’abstient du repas; « ne mangea rien » l’exprime naturellement.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: le deuxième jour du mois
  rationale: חֹדֶשׁ peut signifier « mois » ou « nouvelle lune ». La traduction principale suit la lecture temporelle la plus directe, tandis qu’une note préserve l’autre possibilité liée au repas de la nouvelle lune.
- source_word: נֶעְצַב
  choice: il était peiné
  rationale: Le niphal de עצב exprime le fait d’être affligé ou blessé intérieurement; « peiné » convient au contexte relationnel.
- source_word: אֶל דָּוִד
  choice: à cause de David
  rationale: La préposition marque ici l’objet ou le motif de la peine de Jonathan; cette formulation française reste naturelle sans préciser davantage la nature exacte de son émotion.
- source_word: הִכְלִמוֹ
  choice: l’avait humilié
  rationale: Le hiphil de כלם signifie couvrir de honte ou humilier; le contexte immédiat donne à l’action de Saül une forte dimension publique et relationnelle.
- source_word: אָבִיו
  choice: son père
  rationale: Le suffixe renvoie au père de Jonathan, Saül; conserver « son père » maintient la formulation hébraïque et la tension familiale.
theological_decisions:
- issue: Référent du pronom objet dans הִכְלִמוֹ
  choice: « l’avait humilié », avec David comme référent le plus proche
  alternative: Comprendre que Saül avait humilié Jonathan
  rationale: La morphologie ne précise pas le référent masculin singulier. La proximité de « David » favorise David, mais le contexte permet aussi de comprendre que Jonathan s’est senti personnellement couvert de honte. La traduction française conserve le pronom et donc l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure simple et accessible. Le pronom de « l’avait humilié » est volontairement maintenu afin de ne pas trancher une ambiguïté réelle du texte hébreu.
