  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: fr
  text: 'Jonathan dit alors à David : « Viens, allons dans les champs. » Ils allèrent tous les deux dans les champs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw narratif fait progresser le récit; « alors » marque naturellement la succession en français.
- source_word: יְהוֹנָתָן אֶל־דָּוִד
  choice: Jonathan dit ... à David
  rationale: Les noms suivent leur forme française usuelle, et אֶל désigne ici le destinataire de la parole.
- source_word: לְכָה
  choice: Viens
  rationale: Bien que l’impératif puisse littéralement signifier « va », il sert ici à inviter David à accompagner Jonathan; « viens » est l’équivalent idiomatique naturel.
- source_word: וְנֵצֵא
  choice: sortons
  rationale: Le cohortatif à la première personne du pluriel exprime une proposition ou invitation commune, rendue directement par l’impératif français.
- source_word: הַשָּׂדֶה
  choice: dans les champs
  rationale: Dans ce contexte, שׂדה désigne l’espace ouvert hors du lieu habité. Le français idiomatique emploie volontiers « les champs » avec « sortir », sans supposer une parcelle particulière.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: Et ils sortirent tous les deux
  rationale: « Et » conserve la coordination narrative hébraïque, tandis que « tous les deux » maintient l’insistance explicite sur les deux hommes.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation concise « Viens, sortons » restitue naturellement l’invitation et évite la lourdeur de « viens, et sortons ». La répétition de la destination est conservée comme dans l’hébreu.
