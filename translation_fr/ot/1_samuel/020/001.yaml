  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: fr
  text: 'David s’enfuit de Naïoth, à Rama[a]. Il vint trouver Jonathan et lui dit : « Qu’ai-je fait ? De quoi suis-je coupable ? Quel péché ai-je commis envers ton père, pour qu’il cherche à me tuer ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Naïoth en Rama ». L’hébreu désigne probablement le lieu connu sous le nom de Naïoth, associé à Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: Le verbe ברח exprime la fuite ou l’évasion. « S’enfuit » rend naturellement l’urgence du récit sans préciser indûment la manière.
- source_word: מִנָּוֹת בָּרָמָה
  choice: de Naïoth, à Rama
  rationale: Dans ce contexte, נָוֹת est compris comme un nom de lieu associé à Rama. La virgule et « à Rama » expriment cette relation tout en conservant le toponyme.
- source_word: וַיָּבֹא ... לִפְנֵי יְהוֹנָתָן
  choice: Il vint trouver Jonathan
  rationale: Cette formulation française naturelle réunit le mouvement exprimé par בוא et l’arrivée en présence de Jonathan exprimée par לִפְנֵי, sans lourdeur littérale.
- source_word: מֶה עָשִׂיתִי
  choice: Qu’ai-je fait ?
  rationale: Formulation interrogative idiomatique qui conserve la force rhétorique du parfait hébreu.
- source_word: עֲוֺנִי
  choice: De quoi suis-je coupable ?
  rationale: עָוֹן peut désigner la faute ou la culpabilité. Cette tournure française met ici en valeur la dimension judiciaire et défensive de la question.
- source_word: חַטָּאתִי
  choice: Quel péché ai-je commis
  rationale: « Péché » conserve la portée morale de חַטָּאת et le distingue de la culpabilité évoquée juste avant.
- source_word: לִפְנֵי אָבִיךָ
  choice: envers ton père
  rationale: Dans cette question sur une faute commise, « envers ton père » rend clairement la relation visée par לִפְנֵי sans imposer le sens plus étroit de « sous ses yeux ».
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: il cherche à me tuer
  rationale: L’expression hébraïque signifie chercher à prendre la vie de quelqu’un. La traduction explicite son sens idiomatique en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le rythme bref des trois questions est conservé. L’idiome final est explicité afin d’éviter l’expression française ambiguë « chercher ma vie ».
