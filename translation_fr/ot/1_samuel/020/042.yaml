base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: fr
  text: 'Jonathan dit à David : « Va en paix, puisque nous avons tous deux prêté serment au nom du SEIGNEUR en disant : “Que le SEIGNEUR soit entre moi et toi, entre mes descendants et tes descendants, pour toujours.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: Va en paix
  rationale: Rend naturellement la formule hébraïque de départ tout en conservant son sens de bienveillance et de sécurité.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ שְׁנֵינוּ אֲנַחְנוּ
  choice: puisque nous avons tous deux prêté serment
  rationale: « Puisque » exprime la valeur circonstancielle de אֲשֶׁר dans ce contexte, et « tous deux » reproduit l’insistance de שְׁנֵינוּ אֲנַחְנוּ.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom du SEIGNEUR
  rationale: Formulation française usuelle d’un serment invoquant le nom divin; « SEIGNEUR » représente le tétragramme.
- source_word: זַרְעִי ... זַרְעֲךָ
  choice: mes descendants ... tes descendants
  rationale: Dans ce contexte d’alliance durable entre lignées, « descendants » transmet mieux que le littéral « semence » le sens collectif de זֶרַע.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française directe et naturelle de la durée indéfinie ou perpétuelle indiquée par l’hébreu.
theological_decisions:
- issue: Valeur de יִהְיֶה dans la formule de serment
  choice: Que le SEIGNEUR soit entre moi et toi
  alternative: Le SEIGNEUR sera entre moi et toi
  rationale: Le subjonctif français rend la force volitive ou invocatoire possible du yiqtol dans la parole de serment, sans préciser davantage la manière dont Dieu se tient « entre » les parties.
- issue: Fonction de la présence divine « entre » les deux parties
  choice: Conserver simplement « soit entre »
  alternative: Ajouter « comme témoin » ou « comme garant »
  rationale: Le texte hébreu ne nomme explicitement ni la fonction de témoin ni celle de garant; ne pas l’ajouter préserve l’ouverture théologique de la formule.
translation_notes:
  register: Français moderne, digne et accessible. La structure solennelle du serment est conservée sans lourdeur; les répétitions nécessaires (« entre » et « descendants ») maintiennent le parallélisme hébraïque.
