base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/020.yaml
  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
translation:
  language: fr
  text: Quant à moi, je tirerai les trois flèches vers le côté[a], comme pour tirer sur une cible[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers le côté ». Le texte hébreu ne précise pas de référent.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement, de façon elliptique : « pour envoyer/tirer pour moi vers une cible ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant marque le passage à l’action que Jonathan accomplira lui-même dans le plan; « Quant à moi » rend naturellement cette mise en relief.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: les trois flèches
  rationale: Le numéral construit avec le nom défini désigne les trois flèches prévues comme signal.
- source_word: צִדָּה
  choice: sur le côté
  rationale: La forme comporte ici un hé directionnel, et non un suffixe féminin singulier renvoyant explicitement à un objet. « Sur le côté » conserve donc la direction sans ajouter de référent absent du texte.
- source_word: אוֹרֶה
  choice: je tirerai
  rationale: Dans ce contexte de tir à l’arc, le hiphil de ירה signifie naturellement « tirer »; le futur convient à l’action projetée.
- source_word: לְשַׁלַּח לִי לְמַטָּרָה
  choice: comme si je visais une cible
  rationale: L’expression littérale est peu idiomatique en français. Dans le contexte, elle présente le tir comme un exercice dirigé vers une cible; cette formulation en restitue clairement la fonction apparente sans introduire de précision doctrinale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation évite d’ajouter « de celle-ci », car le hé final de צִדָּה est directionnel dans le texte massorétique fourni, et non un suffixe pronominal féminin.
