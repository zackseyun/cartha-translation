  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: fr
  text: Agis donc avec bonté envers ton serviteur[a], puisque tu as fait entrer ton serviteur avec toi dans l’alliance de Yahweh. Mais si je suis coupable, mets-moi toi-même à mort. Pourquoi m’amènerais-tu jusqu’à ton père ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais preuve de fidélité envers ton serviteur ». Le mot hébreu peut désigner une bonté fidèle, notamment dans le cadre d’une alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד עַל עַבְדֶּךָ
  choice: Agis donc avec bonté envers ton serviteur
  rationale: La tournure française est naturelle et conserve la valeur relationnelle de חֶסֶד, qui peut désigner une bonté fidèle, notamment dans un contexte d’alliance. « Ton serviteur » rend la formule de déférence employée par David.
- source_word: כִּי בִּבְרִית יְהוָה הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: puisque tu as fait entrer ton serviteur avec toi dans l’alliance de Yahweh
  rationale: Le hifil de בוא est rendu par « faire entrer ». La place de עִמָּךְ permet de comprendre que Jonathan a fait entrer David avec lui dans cette alliance; cette formulation maintient ce lien sans explicitation excessive.
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: Mais si je suis coupable
  rationale: Dans ce contexte, עָוֹן vise la culpabilité éventuelle de David. La formulation personnelle est plus idiomatique en français que « s’il y a de la culpabilité en moi ».
- source_word: הֲמִיתֵנִי אַתָּה
  choice: mets-moi toi-même à mort
  rationale: « Mettre à mort » convient à la gravité de la demande, tandis que « toi-même » restitue l’insistance portée par le pronom אַתָּה.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: Pourquoi m’amènerais-tu jusqu’à ton père ?
  rationale: « Jusqu’à » rend la nuance de וְעַד et la question au conditionnel transmet naturellement la force rhétorique de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Portée de חֶסֶד dans un contexte d’alliance
  choice: bonté, avec une note signalant la fidélité liée à l’alliance
  alternative: fidélité envers ton serviteur
  rationale: « Bonté » reste claire et naturelle, tandis que la note préserve la dimension de loyauté que le contexte immédiat de l’alliance rend particulièrement pertinente.
- issue: Rapport entre Jonathan, David et l’alliance de Yahweh
  choice: tu as fait entrer ton serviteur avec toi dans l’alliance de Yahweh
  alternative: tu as fait entrer ton serviteur dans une alliance conclue devant Yahweh
  rationale: Le texte rattache directement בְּרִית à Yahweh et place עִמָּךְ avec l’entrée du serviteur dans l’alliance. La traduction conserve cette structure sans déterminer plus précisément si Yahweh en est l’auteur, le garant ou le témoin.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération rend explicitement le nom divin du texte source et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le discours conserve la déférence de David et la solennité de son appel, sans archaïsmes. La répétition de « ton serviteur », marquée en français, est maintenue parce qu’elle structure l’appel dans l’hébreu.
