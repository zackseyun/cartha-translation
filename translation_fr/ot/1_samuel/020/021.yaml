    rationale: 'וָבֹאָה suit « prends-les » dans l’instruction citée au jeune homme : « prends-les et viens ». La conséquence pour David commence avec « car/alors tu seras en sécurité ». La note actuelle présente ce découpage source comme seulement une possibilité, alors qu’il est celui soutenu par la syntaxe massorétique.'
