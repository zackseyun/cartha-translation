revisions:
- from: 'Puis j’enverrai le jeune homme en lui disant : « Va chercher les flèches. » Si je lui dis clairement : « Regarde, les flèches sont de ton côté[a] ; prends-les », alors viens, car tu peux être en paix : il n’y a aucun danger, aussi vrai que Yahweh est vivant[b].'
  to: '« Voici, j’enverrai le jeune homme en lui disant : “Va trouver les flèches.” Si je dis expressément au jeune homme : “Voici, les flèches sont en deçà de toi[a] ; prends-les et viens”, alors tu seras en sécurité et il n’y aura aucun danger, aussi vrai que Yahweh est vivant[b]. »'
  rationale: 'La révision rétablit « prends-les et viens » comme l’ordre complet transmis au jeune homme, conformément au texte hébreu et à son articulation. Elle garde la distinction entre cet ordre et l’assurance donnée à David. Les notes sont simplifiées : la note spatiale conserve les options de rendu, tandis que la note finale explique seulement la formule de serment. Aucun changement doctrinal n’est introduit.'
  reviewer_model: gpt-5.6-terra
