  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: fr
  text: '« Voici, j’enverrai le jeune homme en lui disant : “Va trouver les flèches.” Si je dis expressément au jeune homme : “Voici, les flèches sont en deçà de toi[a] ; prends-les et viens”, alors tu seras en sécurité et il n’y aura aucun danger, aussi vrai que Yahweh est vivant[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les flèches sont plus près que toi » ou « les flèches sont de ton côté ». L’hébreu indique qu’elles sont tombées avant l’endroit où se trouve le jeune homme, et non au-delà de lui.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Yahweh est vivant ». C’est une formule de serment qui affirme la vérité de la déclaration.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Puis
  rationale: Dans ce contexte, la particule introduit l’étape suivante du signal convenu. « Puis » rend naturellement la progression du discours sans recourir à l’archaïsme « voici ».
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: j’enverrai le jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. « Le jeune homme » conserve l’indication d’âge et de statut sans préciser excessivement sa fonction.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: Va chercher les flèches
  rationale: En français idiomatique, « chercher » convient à l’ordre donné au jeune homme chargé de repérer et de ramasser les flèches.
- source_word: אִם אָמֹר אֹמַר
  choice: Si je lui dis clairement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’acte de parole. « Clairement » exprime cette insistance sans lourdeur.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: Regarde, les flèches sont de ton côté
  rationale: La formule indique que les flèches sont tombées en deçà du jeune homme, du côté de Jonathan, par opposition à « au-delà de toi » au verset suivant.
- source_word: קָחֶנּוּ
  choice: prends-les
  rationale: Le suffixe est morphologiquement singulier, mais son antécédent explicite, « les flèches », est pluriel; le français reprend naturellement ce référent au pluriel.
- source_word: וָבֹאָה
  choice: alors viens
  rationale: L’impératif orienté vers le locuteur appelle vraisemblablement David à sortir de sa cachette une fois le signal rassurant donné. La ponctuation laisse l’ordre hors des paroles adressées au jeune homme, tout en signalant en note l’autre découpage possible.
- source_word: כִּי שָׁלוֹם לְךָ וְאֵין דָּבָר
  choice: 'car tu peux être en paix : il n’y a aucun danger'
  rationale: שָׁלוֹם exprime ici la sécurité et le bien-être de David; דָּבָר désigne dans le contexte une affaire fâcheuse ou une menace. La formulation française conserve l’idée de paix tout en explicitant le danger absent.
- source_word: חַי יְהוָה
  choice: aussi vrai que Yahweh est vivant
  rationale: Cette formule rend l’idiome hébreu de serment en français actuel et conserve le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » le traite comme le nom propre divin plutôt que de le remplacer par un titre.
- issue: Destinataire de l’impératif וָבֹאָה (« viens »)
  choice: David
  alternative: le jeune homme
  rationale: Le signal a pour but d’indiquer à David qu’il peut venir sans danger, ce qui favorise ce rattachement. Toutefois, l’hébreu ne marque pas explicitement un changement de destinataire; cette ambiguïté est donc indiquée en note.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les impératifs restent directs, comme dans le dialogue hébreu. « Regarde » remplace l’archaïsant « voici » comme marque d’attention, et la formule de serment est rendue explicitement sans perdre le nom divin.
