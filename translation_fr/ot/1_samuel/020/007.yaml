revisions:
- from: 'S’il dit : « Bien ! », ton serviteur sera en paix. Mais s’il se met dans une grande colère, sache qu’il est résolu à faire le mal[a].'
  to: 'S’il dit : « Bien », ton serviteur sera en sécurité. Mais s’il se met très en colère, sache qu’il a résolu de faire le mal[a].'
  rationale: La révision rend le sens contextuel de שָׁלוֹם par « sera en sécurité », conserve la déférence de « ton serviteur », exprime naturellement l’intensification de la colère et rend la décision déjà arrêtée de Saül par « il a résolu ». La note conserve l’éclairage sur l’expression hébraïque sans imposer un développement doctrinal ou une identification plus précise du mal envisagé.
