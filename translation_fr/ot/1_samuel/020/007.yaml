  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: fr
  text: 'S’il dit : « Bien », ton serviteur sera en sécurité. Mais s’il se met très en colère, sache qu’il a résolu de faire le mal[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « le mal est achevé de sa part » ; c’est-à-dire que Saül a fermement arrêté un dessein mauvais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Bien !
  rationale: Adjectif employé elliptiquement comme réponse approbatrice de Saül ; « Bien ! » est naturel dans le dialogue et conserve la brièveté de l’hébreu.
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: ton serviteur sera en paix
  rationale: שָׁלוֹם désigne ici la sécurité et le bien-être de David ; le futur exprime la conclusion que David pourra tirer de la réaction de Saül.
- source_word: לְעַבְדֶּךָ
  choice: ton serviteur
  rationale: Jonathan parle de David à la troisième personne dans une formule de déférence ; « serviteur » convient au registre relationnel sans mettre au premier plan l’idée d’esclavage.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: il se met dans une grande colère
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’intensité ; cette tournure française rend clairement l’emportement marqué par l’hébreu.
- source_word: דַּע
  choice: sache
  rationale: Impératif direct invitant David à tirer une conclusion certaine de la réaction de Saül.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: il est résolu à faire le mal
  rationale: Dans ce contexte, כלה présente le dessein mauvais comme arrivé à pleine résolution, tandis que מֵעִמּוֹ en désigne la source. La formulation française rend le sens idiomatique sans effacer l’image littérale signalée en note.
theological_decisions:
- issue: Nature du mal attribué à Saül
  choice: faire le mal
  alternative: le mal est pleinement décidé de sa part
  rationale: Le contexte vise le dessein nuisible fermement arrêté par Saül. La traduction conserve la qualification morale « mal » sans préciser davantage l’acte envisagé.
translation_notes:
  register: Français international moderne, digne et direct. Le dialogue reste concis ; « ton serviteur » conserve la déférence de la formule hébraïque, et la note maintient l’ambiguïté de l’expression כָלְתָה הָרָעָה מֵעִמּוֹ.
