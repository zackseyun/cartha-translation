base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: fr
  text: 'Jonathan répondit : « Loin de toi cette pensée ! Si je savais avec certitude que mon père avait définitivement décidé de te faire du mal[a], ne t’en informerais-je pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que le mal était fixé » ou « que le mal était arrivé à son terme ». L’expression hébraïque peut indiquer que l’intention nuisible de Saül était devenue ferme ou pleinement formée.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: Loin de toi cette pensée !
  rationale: Cette tournure française exprime un rejet énergique tout en conservant la deuxième personne marquée par לָּךְ. Dans le contexte, Jonathan rejette vivement le soupçon formulé par David.
- source_word: כִּי אִם
  choice: Si
  rationale: La séquence introduit ici la condition qui fonde la question rhétorique suivante. Le simple « si » est naturel en français.
- source_word: יָדֹעַ אֵדַע
  choice: je savais avec certitude
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’idée de connaissance certaine.
- source_word: כָלְתָה הָרָעָה
  choice: avait définitivement décidé de te faire du mal
  rationale: Dans ce contexte, l’expression indique que l’intention nuisible serait parvenue à un état arrêté ou pleinement formé. La formulation active avec le père comme agent est naturelle en français, tandis qu’une note conserve les autres nuances possibles de l’hébreu.
- source_word: מֵעִם אָבִי
  choice: mon père avait… décidé
  rationale: La préposition indique que le mal projeté a pour source le père de Jonathan. L’intégration de cette source comme sujet agentif produit une phrase française claire.
- source_word: לָבוֹא עָלֶיךָ
  choice: de te faire du mal
  rationale: La menace qui doit « venir sur » David est rendue idiomatiquement sans préciser davantage sa forme.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: ne t’en informerais-je pas ?
  rationale: La question rhétorique attend une réponse affirmative. « En informer » rend naturellement נגד et le pronom féminin renvoyant au mal projeté.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et oralement naturel. « Loin de toi cette pensée » conserve l’idiome solennel sans archaïsme excessif; la question finale garde la force rassurante et rhétorique de la réponse de Jonathan.
