base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: fr
  text: Que Yahweh fasse ainsi à Jonathan, et qu’il ajoute encore[a], si mon père a l’intention de te faire du mal[b] et si je manque à t’en informer[c] et à te laisser partir en paix[d] ! Que Yahweh soit avec toi, comme il l’a été avec mon père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formule de serment et de malédiction : le châtiment désigné par « ainsi » reste sous-entendu.'
    reason: cultural_context
  - marker: b
    text: 'Plus littéralement : « si le mal contre toi paraît bon à mon père », c’est-à-dire s’il lui plaît ou s’il a décidé de te faire du mal.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « je découvre ton oreille », expression qui signifie « je t’informe » ou « je te révèle la chose ».'
    reason: idiom
  - marker: d
    text: 'La négation est implicite dans la formule de serment. Les verbes hébreux ont formellement un sens positif : « je t’en informe et te laisse partir en paix » ; la malédiction porte vraisemblablement sur le cas où Jonathan manquerait à ces deux actes.'
    reason: source_ambiguity
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: Que Yahweh fasse ceci à Jonathan, et qu’il y ajoute encore
  rationale: Cette formule imprécatoire consacrée introduit une malédiction conditionnelle. La troisième personne « Jonathan » est conservée, conformément à l’hébreu, et « ceci » laisse le châtiment sous-entendu comme dans le texte source.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: si mon père a l’intention de te faire du mal
  rationale: La tournure elliptique signifie littéralement que le mal projeté contre David « paraît bon » au père de Jonathan. « Avoir l’intention » exprime naturellement cette disposition sans suggérer que le mal serait moralement bon.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: et que je ne t’en informe pas
  rationale: « Découvrir l’oreille » est un idiome signifiant informer ou révéler. La négation, absente de la forme verbale elle-même, est explicitée selon la logique de la formule de serment, tout en étant signalée en note.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: et ne te laisse pas partir
  rationale: Le piel de שׁלח indique que Jonathan fera partir David ou lui permettra de partir. Dans ce contexte, « laisser partir » est naturel et conserve son intervention active.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: afin que tu t’en ailles en paix
  rationale: La formulation française rend la valeur de but ou de résultat de la séquence, tout en conservant l’expression hébraïque « aller en paix ».
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: Que Yahweh soit avec toi
  rationale: Le jussif devient un souhait explicite en français. Le nom divin est translittéré « Yahweh » conformément à la politique de traduction indiquée.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: comme il a été avec mon père
  rationale: Le parfait décrit l’accompagnement accordé jusque-là à Saül, pris comme point de comparaison pour le souhait adressé à David.
theological_decisions:
- issue: Négation implicite dans le serment de Jonathan
  choice: Expliciter « que je ne t’en informe pas et ne te laisse pas partir » dans le texte principal.
  alternative: 'Traduire les verbes positivement : « alors je t’en informerai et te laisserai partir ».'
  rationale: L’hébreu enchaîne des verbes positifs après la condition, mais la formule de malédiction initiale implique naturellement que Jonathan appelle le châtiment sur lui s’il manque à ces actes. La traduction explicite cette relation pour rendre le serment intelligible, tandis qu’une note préserve la forme et l’ambiguïté du texte hébreu.
- issue: Continuité de la faveur divine de Saül à David
  choice: 'Conserver simplement la comparaison : « comme il a été avec mon père ».'
  alternative: Paraphraser en affirmant que Yahweh abandonne Saül au profit de David.
  rationale: Le verset formule un souhait et une comparaison, mais n’explicite pas à lui seul une doctrine de transfert ou de rejet. La traduction maintient cette tension narrative sans l’interpréter davantage.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au dialogue personnel entre Jonathan et David. La structure solennelle « Que Yahweh… » conserve la force du serment sans archaïsmes inutiles.
