  to: Que Yahweh fasse ainsi à Jonathan, et qu’il ajoute encore[a], si mon père a l’intention de te faire du mal[b] et si je manque à t’en informer[c] et à te laisser partir en paix[d] ! Que Yahweh soit avec toi, comme il l’a été avec mon père.
