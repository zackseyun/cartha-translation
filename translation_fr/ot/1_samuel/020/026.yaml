base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: fr
  text: 'Mais Saül ne dit rien ce jour-là, car il pensait : « Il lui est arrivé quelque chose ; il n’est pas pur — il n’est certainement pas pur.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il est rituellement impur ». Dans le contexte de ce repas, l’hébreu parle vraisemblablement de pureté rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: ne dit rien
  rationale: Cette tournure française naturelle rend fidèlement l’idiome hébreu « ne parla/dit pas quoi que ce soit ».
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française courante, correspondant directement à l’hébreu.
- source_word: כִּי אָמַר
  choice: car il pensait
  rationale: Le verbe signifie littéralement « dit », mais introduit ici le raisonnement intérieur de Saül ; « pensait » l’exprime naturellement sans changer le point de vue.
- source_word: מִקְרֶה הוּא
  choice: C’est un incident
  rationale: מִקְרֶה désigne un événement fortuit ou une circonstance imprévue. Cette formulation conserve l’absence de complément explicite en hébreu et évite d’ajouter « lui est arrivé ».
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: Il n’est pas pur
  rationale: La négation de טָהוֹר est reproduite plutôt que remplacée dans le texte par l’interprétation explicite « rituellement impur ».
- source_word: כִּי לֹא טָהוֹר
  choice: oui, il n’est pas pur
  rationale: La reprise insistante de l’hébreu est conservée ; « oui » rend ici la valeur confirmative probable de כִּי sans transformer l’affirmation en certitude plus forte que le texte.
theological_decisions:
- issue: Nature de l’impureté exprimée par טָהוֹר
  choice: La traduction principale conserve « pur », tandis que la note précise le sens rituel probable.
  alternative: Traduire directement « il est rituellement impur » ou comprendre une impureté morale générale.
  rationale: Dans le contexte du repas de la nouvelle lune, l’impureté rituelle explique naturellement l’absence, mais le texte hébreu emploie le terme général relatif à la pureté. La formulation retenue préserve cette donnée tout en guidant le lecteur par une note.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition finale, marquée dans l’hébreu, est volontairement maintenue. Le marqueur de note est placé après l’expression qu’il explique.
