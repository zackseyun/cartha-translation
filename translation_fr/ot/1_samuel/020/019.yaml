  text: וְ/שִׁלַּשְׁתָּ֙ תֵּרֵ֣ד מְאֹ֔ד וּ/בָאתָ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁר נִסְתַּ֥רְתָּ שָּׁ֖ם בְּ/י֣וֹם הַֽ/מַּעֲשֶׂ֑ה וְ/יָ֣שַׁבְתָּ֔ אֵ֖צֶל הָ/אֶ֥בֶן הָ/אָֽזֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: fr
  text: Le troisième jour[a], descends rapidement et rends-toi à l’endroit où tu t’étais caché le jour de l’affaire[b]. Reste près de la pierre d’Ézel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme hébraïque, liée au nombre « trois », est inhabituelle. Elle peut aussi évoquer le fait de faire cela une troisième fois ou, possiblement, une durée de trois jours.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « l’acte », « l’événement » ou « ce qui s’était passé ». Il renvoie probablement à une affaire antérieure connue de Jonathan et de David.
    reason: lexical_alternative
  - marker: c
    text: « Ézel » est probablement un nom de lieu ou la désignation de cette pierre. Le terme hébreu peut être apparenté à l’idée de partir ou de s’éloigner, mais son sens exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: Le troisième jour
  rationale: La forme intensive de שׁלשׁ est inhabituelle et signifie ici, dans le déroulement des instructions, que David doit agir le troisième jour. Cette formulation française est naturelle tout en signalant en note l’ambiguïté de l’expression.
- source_word: תֵּרֵד מְאֹד
  choice: descends rapidement
  rationale: ירד signifie « descendre » et מְאֹד renforce ici l’instruction. Dans ce contexte de déplacement urgent et discret, « rapidement » rend naturellement la valeur intensive, bien que le sens littéral soit moins précis.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: et rends-toi à l’endroit
  rationale: בוא exprime l’arrivée à un lieu. « Rends-toi à l’endroit » est plus naturel en français dans une consigne que le calque « viens à l’endroit ».
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: où tu t’étais caché
  rationale: 'Le nifal de סתר a ici une valeur réfléchie en contexte : David s’était volontairement dissimulé. Le plus-que-parfait situe clairement cette action avant les présentes instructions.'
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: le jour de l’affaire
  rationale: מַעֲשֶׂה peut désigner un acte, une action, une affaire ou une circonstance. « L’affaire » conserve l’imprécision du texte et renvoie naturellement à l’occasion antérieure connue des interlocuteurs.
- source_word: וְיָשַׁבְתָּ
  choice: Reste
  rationale: ישׁב signifie littéralement « s’asseoir », mais peut aussi vouloir dire demeurer ou rester. Dans cette instruction donnée à quelqu’un qui attend caché, « reste » exprime clairement le sens contextuel.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: près de la pierre d’Ézel
  rationale: אֵצֶל signifie « près de » et אֶבֶן « pierre ». הָאָזֶל est probablement le nom ou la désignation fixe de cette pierre; sa translittération évite de trancher un sens étymologique incertain.
