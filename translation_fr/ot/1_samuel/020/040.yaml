id: 1SA.20.40
reference: 1 Samuel 20:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהֽוֹנָתָן֙ אֶת כֵּלָ֔י/ו אֶל הַ/נַּ֖עַר אֲשֶׁר ל֑/וֹ וַ/יֹּ֣אמֶר ל֔/וֹ לֵ֖ךְ הָבֵ֥יא הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: fr
  text: 'Jonathan remit ses armes[a] au jeune homme qui était à son service[b] et lui dit : « Va, apporte-les[c] à la ville. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « armes » peut aussi désigner plus largement le matériel ou l’équipement. Le contexte de l’arc et des flèches favorise ici « armes ».
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « au garçon qui l’accompagnait » ou « à son jeune serviteur ». L’hébreu présente ce jeune homme comme étant attaché au service de Jonathan.'
    reason: lexical_alternative
  - marker: c
    text: Le complément de « apporte » est sous-entendu en hébreu. « Les » a été ajouté en français et renvoie aux armes, ou à l’équipement, de Jonathan.
    reason: implicit_object
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: remit
  rationale: Le verbe נתן signifie couramment « donner ». Dans cette scène, « remit » exprime naturellement le fait de confier directement des objets à quelqu’un, sans ajouter d’idée étrangère au texte.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כֵּלָיו
  choice: ses armes
  rationale: כְּלִי peut désigner des objets, du matériel ou des armes. Le contexte immédiat de l’arc et des flèches favorise « armes », tout en laissant signaler en note le sens plus large possible.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: le jeune homme qui était à son service
  rationale: נַעַר désigne ici un jeune subordonné, et אֲשֶׁר לוֹ marque son lien avec Jonathan. Cette formulation française rend ce rapport de service sans employer le littéral et peu naturel « qui lui appartenait ».
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: Traduction française directe et idiomatique de la formule narrative.
- source_word: לֵךְ
  choice: Va
  rationale: Impératif simple et direct de הלך.
- source_word: הָבֵיא
  choice: apporte-les
  rationale: Le hifil de בוא signifie normalement « faire venir, apporter ». Le pronom « les », nécessaire en français, reprend les armes mentionnées juste avant.
- source_word: הָעִיר
  choice: à la ville
  rationale: Le nom défini est rendu sans préciser l’identité de la ville, que le texte hébreu ne nomme pas ici.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Remit » et « était à son service » sont naturels sans être familiers. La traduction conserve la portée potentiellement large de כֵּלָיו au moyen d’une note et n’ajoute aucune précision théologique.
