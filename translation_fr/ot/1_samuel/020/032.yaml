  yaml_path: translation/ot/1_samuel/020/032.yaml
  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: fr
  text: 'Jonathan répondit à Saül, son père, et lui dit : « Pourquoi serait-il mis à mort[a] ? Qu’a-t-il fait ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi faut-il le mettre à mort ? » Le verbe hébreu désigne ici le fait d’être mis à mort, et non simplement de mourir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans cette formule narrative, ענה signifie répondre; « répondit » restitue directement l’échange dialogué.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française courante du nom propre.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: à Saül, son père
  rationale: Cette formulation conserve Saül comme destinataire explicite et « son père » comme apposition, conformément à l’ordre de l’hébreu.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: et lui dit
  rationale: Le destinataire pronominal, explicite en hébreu, est conservé malgré la légère redondance avec la proposition précédente.
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Équivalent interrogatif direct, naturel et précis.
- source_word: יוּמַת
  choice: serait-il mis à mort
  rationale: Le hophal de מות exprime le fait de subir une mise à mort, et non simplement de mourir. Le conditionnel rend naturellement en français la contestation délibérative exprimée dans ce contexte.
- source_word: מֶה עָשָׂה
  choice: Qu’a-t-il fait ?
  rationale: Le passé composé exprime naturellement un acte antérieur dont la pertinence demeure présente dans l’accusation.
