  text: וַ/יַּ֥עַן יְהוֹנָתָ֖ן אֶת שָׁא֑וּל נִשְׁאֹ֨ל נִשְׁאַ֥ל דָּוִ֛ד מֵ/עִמָּדִ֖/י עַד בֵּ֥ית לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: fr
  text: 'Jonathan répondit à Saül : « David m’a demandé avec insistance la permission d’aller à Bethléem. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le wayyiqtol de ענה introduit normalement une réponse dans un dialogue narratif ; « répondit » est direct et naturel en français.
- source_word: אֶת שָׁאוּל
  choice: à Saül
  rationale: La construction désigne Saül comme la personne à laquelle Jonathan répond ; le français exige ici la préposition « à ».
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: m’a demandé avec insistance
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’idée verbale. « Avec insistance » conserve cette emphase sans décider qu’il s’agissait nécessairement de demandes répétées.
- source_word: מֵעִמָּדִי
  choice: m’a demandé … la permission
  rationale: La préposition exprime que la permission est sollicitée auprès de Jonathan. La tournure française naturelle intègre le pronom indirect « m’ ».
- source_word: עַד בֵּית לָחֶם
  choice: d’aller à Bethléem
  rationale: Dans ce contexte de demande d’autorisation, la destination implique le déplacement ; l’explicitation « d’aller » rend le sens clairement et naturellement.
- source_word: בֵּית לָחֶם
  choice: Bethléem
  rationale: Forme française usuelle du nom de lieu.
