  yaml_path: translation/ot/1_samuel/020/010.yaml
  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: fr
  text: 'David dit alors à Jonathan : « Qui me le fera savoir ? Ou bien, que faire si ton père te répond durement[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé : « Qui me le fera savoir ? Ou que te répondra ton père — durement ? » La traduction explicite l’ellipse de la seconde question.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit ; « dit alors » en restitue naturellement la valeur séquentielle.
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: David dit … à Jonathan
  rationale: Les noms suivent leur forme française traditionnelle, et אֶל introduit normalement le destinataire du discours.
- source_word: מִי יַגִּיד לִי
  choice: Qui me le fera savoir ?
  rationale: Le hifil de נגד signifie « annoncer, faire savoir ». Le pronom « le » reste volontairement général et renvoie à la réponse du père de Jonathan.
- source_word: אוֹ
  choice: Ou
  rationale: La conjonction disjonctive est conservée malgré la formulation hébraïque elliptique.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: si ton père te répond durement ?
  rationale: ענה signifie « répondre » et קָשָׁה, adjectif employé adverbialement, qualifie une réponse sévère ou hostile. La tournure française conserve l’interrogation elliptique sans lui imposer une résolution absente de l’hébreu.
