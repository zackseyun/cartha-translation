  source_fidelity: Le premier membre rend correctement מִי יַגִּיד לִי (« Qui me le fera savoir ? »). Dans le second, מַה appelle une question sur la conduite à tenir ou sur l’éventualité envisagée ; « Ou si ton père te répond durement ? » n’est pas une interrogation française complète et ne rend pas explicitement cette valeur de « que ». « Ou bien, que faire si… ? » explicite sobrement l’ellipse tout en conservant la disjonction et le sens d’une réponse hostile.
