  to: 'Mais David jura de nouveau et dit : « Ton père sait très bien que j’ai trouvé grâce à tes yeux, et il a dit : “Jonathan ne doit pas savoir cela, de peur qu’il n’en soit peiné.” Mais, aussi vrai que l’Éternel est vivant et que toi-même tu es vivant, il n’y a qu’un pas entre moi et la mort. »'
