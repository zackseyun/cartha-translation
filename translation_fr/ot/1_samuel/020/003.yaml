base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: fr
  text: 'Mais David jura de nouveau et dit : « Ton père sait très bien que j’ai trouvé grâce à tes yeux, et il a dit : “Jonathan ne doit pas savoir cela, de peur qu’il n’en soit peiné.” Mais, aussi vrai que l’Éternel est vivant et que toi-même tu es vivant, il n’y a qu’un pas entre moi et la mort. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: sait très bien
  rationale: L’infinitif absolu suivi du verbe conjugué marque ici une forte insistance; cette tournure la rend naturellement en français.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: j’ai trouvé grâce à tes yeux
  rationale: Conserve l’expression hébraïque traditionnelle et intelligible qui désigne la faveur accordée par Jonathan.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: Que Jonathan ne sache rien de cela
  rationale: Rend la pensée attribuée à Saül comme une volonté ou une consigne, sans transformer la formulation en simple constat.
- source_word: חַי יְהוָה וְחֵי נַפְשֶׁךָ
  choice: aussi vrai que l’Éternel est vivant et que tu es vivant
  rationale: Restitue les deux formules solennelles de serment dans un français naturel; נֶפֶשׁ désigne ici la personne vivante.
- source_word: כְפֶשַׂע
  choice: qu’un pas
  rationale: L’image exprime une distance infime; « un pas » conserve la métaphore dans un français idiomatique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: « l’Éternel » est une convention française digne et largement comprise; le texte maintient explicitement le nom divin comme fondement du serment.
- issue: Nature de la parole intérieure de Saül
  choice: il s’est dit
  alternative: il a dit
  rationale: Le contexte et le contenu indiquent vraisemblablement le raisonnement de Saül; « il s’est dit » le signale sans prétendre qu’il a prononcé ces mots devant quelqu’un.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe conserve la solennité du double serment et l’image finale, tout en évitant les formulations inutilement archaïques.
