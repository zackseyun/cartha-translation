    issue: « il s’est dit » pour ויאמר
    rationale: Le texte massorétique porte simplement « il a dit ». Même si le contexte peut suggérer un raisonnement de Saül, le réfléchi explicite une parole intérieure qui n’est pas marquée dans la source.
