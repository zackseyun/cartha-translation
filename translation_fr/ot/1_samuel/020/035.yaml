id: 1SA.20.35
reference: 1 Samuel 20:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יֵּצֵ֧א יְהוֹנָתָ֛ן הַ/שָּׂדֶ֖ה לְ/מוֹעֵ֣ד דָּוִ֑ד וְ/נַ֥עַר קָטֹ֖ן עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: fr
  text: Le matin, Jonathan se rendit au champ pour le rendez-vous fixé avec David[a]. Un jeune garçon[b] était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moment fixé avec David ». Le mot hébreu מוֹעֵד peut désigner soit un moment fixé, soit une rencontre convenue; le contexte de leur arrangement préalable favorise ici « rendez-vous ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un petit garçon » ou « un jeune serviteur ». Selon le contexte, le mot hébreu נַעַר peut désigner un garçon, un jeune homme ou un serviteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Le matin
  rationale: La formule narrative וַיְהִי introduit ici l’événement suivant; en français courant, la proposition temporelle suffit sans ajouter le calque lourd « il arriva que ».
- source_word: וַיֵּצֵא
  choice: se rendit
  rationale: Le verbe יָצָא exprime le fait de sortir ou d’aller dehors. Avec la destination « au champ », « se rendit » produit une narration française naturelle tout en conservant le déplacement.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française courante du nom propre.
- source_word: הַשָּׂדֶה
  choice: au champ
  rationale: שָׂדֶה désigne ici le champ ou l’espace découvert où devait avoir lieu le signal convenu.
- source_word: לְמוֹעֵד דָּוִד
  choice: pour le rendez-vous fixé avec David
  rationale: מוֹעֵד peut désigner un moment fixé ou une rencontre convenue. Le contexte d’un arrangement préalable entre Jonathan et David favorise ici « rendez-vous », sans supprimer l’autre possibilité, signalée en note.
- source_word: וְנַעַר קָטֹן
  choice: Un jeune garçon
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur, et קָטֹן souligne ici son jeune âge ou sa petitesse. « jeune garçon » est clair et naturel dans le contexte.
- source_word: עִמּוֹ
  choice: était avec lui
  rationale: Cette formulation explicite naturellement en français la relation d’accompagnement exprimée de manière elliptique en hébreu.
