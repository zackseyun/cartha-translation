  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: fr
  text: Mais le garçon ne savait rien ; seuls Jonathan et David étaient au courant de l’affaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Mais le garçon
  rationale: נַעַר désigne ici le jeune serviteur de Jonathan. « Garçon » est naturel dans ce contexte, et le וְ prend une valeur adversative en raison du contraste avec Jonathan et David.
- source_word: לֹא יָדַע מְאוּמָה
  choice: ne savait rien
  rationale: Avec la négation, מְאוּמָה signifie « quoi que ce soit » ; en français idiomatique, l’ensemble se rend naturellement par « ne savait rien ».
- source_word: אַךְ
  choice: seuls
  rationale: 'La particule a ici une valeur restrictive : la connaissance de l’affaire était limitée à Jonathan et David.'
- source_word: יְהוֹנָתָן וְדָוִד
  choice: Jonathan et David
  rationale: Les noms propres suivent leurs formes françaises bibliques usuelles.
- source_word: יָדְעוּ אֶת־הַדָּבָר
  choice: étaient au courant de l’affaire
  rationale: Cette formulation française exprime naturellement la connaissance d’une affaire ou d’un arrangement sans préciser davantage ce que le terme large דָּבָר laisse implicite.
