base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: fr
  text: 'Jonathan dit à David : « Yahweh, le Dieu d’Israël, m’en est témoin ![a] Demain, vers cette heure-ci, ou le troisième jour[b], je sonderai mon père. Si je le trouve bien disposé envers David, ne t’enverrai-je pas alors un message pour te le révéler[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation hébraïque est elliptique et difficile. Elle paraît introduire un engagement solennel en invoquant Yahweh ; on peut aussi comprendre une formule telle que : « Aussi vrai que Yahweh, le Dieu d’Israël, est vivant » ou « Par Yahweh, le Dieu d’Israël ».'
    reason: ambiguïté syntaxique
  - marker: b
    text: 'L’expression temporelle hébraïque est condensée et difficile. Autre traduction possible : « demain, vers cette heure-ci, au troisième jour ».'
    reason: autre traduction possible
  - marker: c
    text: 'Littéralement : « découvrir ton oreille », expression qui signifie révéler ou communiquer une information.'
    reason: idiome hébreu
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, le Dieu d’Israël
  rationale: Rend le nom divin par sa translittération usuelle en français et conserve l’apposition du texte hébreu.
- source_word: כִּי
  choice: m’en est témoin !
  rationale: Dans cette formulation elliptique, la particule introduit vraisemblablement une déclaration solennelle. Cette expression française rend la fonction d’attestation sans transformer explicitement la formule en « aussi vrai que Yahweh est vivant ».
- source_word: אֶחְקֹר אֶת אָבִי
  choice: je sonderai mon père
  rationale: Le verbe désigne ici le fait d’examiner discrètement les dispositions de Saül ; « sonder » garde cette nuance exploratoire.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: demain vers cette heure-ci, ou le troisième jour
  rationale: La formulation temporelle hébraïque est condensée et difficile. La traduction conserve les deux repères sans prétendre lever entièrement leur relation.
- source_word: וְהִנֵּה טוֹב אֶל דָּוִד
  choice: si je constate qu’il est bien disposé envers David
  rationale: Dans le contexte, le bien évoqué concerne l’attitude de Saül envers David ; « si je constate » rend naturellement la valeur conditionnelle de וְהִנֵּה dans la phrase.
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: ne t’enverrai-je pas alors un message
  rationale: Conserve la tournure interrogative négative et le verbe « envoyer ». « Un message » explicite sobrement l’objet sous-entendu en français.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: pour te le révéler
  rationale: L’expression signifie littéralement « découvrir ton oreille » et désigne la communication confidentielle d’une information.
theological_decisions:
- issue: Forme du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu, sans le remplacer par un titre.
- issue: Invocation elliptique de Yahweh
  choice: Yahweh, le Dieu d’Israël, m’en est témoin !
  alternative: Aussi vrai que Yahweh, le Dieu d’Israël, est vivant
  rationale: L’hébreu transmis ne contient pas explicitement le verbe « vivre ». La traduction exprime la portée solennelle probable tout en signalant l’ellipse dans une note.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe a été légèrement réorganisée pour rendre intelligible la formule hébraïque elliptique, tandis que les ambiguïtés de l’invocation et du repère temporel sont conservées en notes.
