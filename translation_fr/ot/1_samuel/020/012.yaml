- from: 'Jonathan dit à David : « Yahweh, le Dieu d’Israël, m’en est témoin ![a] Demain vers cette heure-ci, ou le troisième jour[b], je sonderai mon père. Si je constate qu’il est bien disposé envers David, ne t’enverrai-je pas alors un message pour te le révéler[c] ? »'
  to: 'Jonathan dit à David : « Yahweh, le Dieu d’Israël, m’en est témoin ![a] Demain, vers cette heure-ci, ou le troisième jour[b], je sonderai mon père. Si je le trouve bien disposé envers David, ne t’enverrai-je pas alors un message pour te le révéler[c] ? »'
  rationale: Révision légère pour améliorer l’idiomaticité française et éviter une explicitation inutile de la particule discursive hébraïque. L’incertitude de l’invocation et du repère temporel demeure explicitement signalée dans les notes, sans imposer une interprétation confessionnelle ou textuellement indue.
