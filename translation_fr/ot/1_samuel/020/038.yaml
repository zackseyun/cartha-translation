source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יְהֽוֹנָתָן֙ אַחֲרֵ֣י הַ/נַּ֔עַר מְהֵרָ֥ה ח֖וּשָׁ/ה אַֽל תַּעֲמֹ֑ד וַ/יְלַקֵּ֞ט נַ֤עַר יְהֽוֹנָתָן֙ אֶת ה/חצי וַ/יָּבֹ֖א אֶל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: fr
  text: 'Jonathan cria au garçon : « Vite ! Dépêche-toi ! Ne t’arrête pas ! » Le garçon de Jonathan ramassa les flèches[a] et revint auprès de son maître.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme hébraïque traduite par « flèches » présente ici une graphie qui peut paraître singulière, mais le contexte désigne les flèches que Jonathan avait tirées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: Jonathan cria au garçon
  rationale: Avec אַחֲרֵי, קרא décrit un appel lancé à quelqu’un qui s’éloigne. « Cria au garçon » exprime naturellement en français la voix portée et l’urgence, sans surcharger la formulation.
- source_word: מְהֵרָה חוּשָׁה
  choice: Vite ! Dépêche-toi !
  rationale: Les deux expressions hébraïques successives sont rendues séparément afin de préserver le redoublement insistant de l’urgence.
- source_word: אַל תַּעֲמֹד
  choice: Ne t’arrête pas !
  rationale: Le sens littéral est « ne reste pas debout », mais, dans ce contexte de mouvement pressé, l’expression signifie naturellement qu’il ne faut pas s’arrêter.
- source_word: וַיְלַקֵּט
  choice: ramassa
  rationale: לקט signifie rassembler ou recueillir. « Ramassa » convient précisément à l’action de récupérer les flèches au sol.
- source_word: נַעַר יְהוֹנָתָן
  choice: Le garçon de Jonathan
  rationale: « Garçon » conserve la nuance d’âge et de statut de נַעַר; la relation de service ressort ensuite de la mention de son maître.
- source_word: אֶת ה/חצי
  choice: les flèches
  rationale: Malgré une graphie susceptible de paraître singulière, le contexte désigne collectivement les flèches tirées par Jonathan; le pluriel est donc requis en français.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: revint auprès de son maître
  rationale: Le verbe בוא signifie venir; dans la situation narrative, le garçon retourne vers Jonathan. « Revint auprès de » rend ce mouvement de façon idiomatique, et « maître » désigne son supérieur humain.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Les impératifs brefs conservent le rythme pressant de l’hébreu. Une seule note est maintenue pour signaler la particularité textuelle réelle concernant « flèches »; le sens contextuel de « ne t’arrête pas » ne nécessite pas de note dans une traduction par équivalence optimale.
