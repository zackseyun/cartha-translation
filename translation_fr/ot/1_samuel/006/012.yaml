source:
  edition: WLC
  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: fr
  text: Les vaches allèrent tout droit sur la route qui mène à Beth-Shémesh, en suivant une seule voie[a]. Elles continuèrent d’avancer en mugissant[b], sans s’écarter ni à droite ni à gauche. Les princes des Philistins[c] marchaient derrière elles jusqu’à la limite du territoire de Beth-Shémesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur une seule route ». L’hébreu souligne que les vaches suivirent un itinéraire unique et déterminé.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe désigne le cri des bovins : les vaches continuaient à mugir tout en avançant.'
    reason: cultural_note
  - marker: c
    text: Ou « les dirigeants des Philistins ». Le terme hébreu est le titre donné aux chefs des principales villes philistines.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: allèrent tout droit
  rationale: Le verbe issu de ישר exprime ici une progression directe, sans déviation. « Allèrent tout droit » est naturel en français et prépare l’explication selon laquelle elles ne s’écartèrent ni à droite ni à gauche.
- source_word: הַפָּרוֹת
  choice: les vaches
  rationale: Le contexte parle de vaches qui allaitent et qui ont été attelées au chariot. « Vaches » est donc plus exact que « génisses ».
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: par la route de Beth-Shémesh
  rationale: La répétition de דרך souligne un itinéraire déterminé. La formulation française conserve l’idée de route et la destination sans reproduire lourdement la répétition hébraïque.
- source_word: בִּמְסִלָּה אַחַת
  choice: en suivant une seule voie
  rationale: מְסִלָּה désigne une route aménagée ou une chaussée. « Une seule voie » préserve surtout l’insistance du texte sur l’itinéraire unique, sans évoquer une autoroute moderne.
- source_word: הָלְכוּ הָלוֹךְ
  choice: continuèrent d’avancer
  rationale: L’infinitif absolu associé au verbe donne ici une valeur durative. Cette expression rend clairement la continuité du mouvement.
- source_word: וְגָעוֹ
  choice: en mugissant
  rationale: Le verbe désigne le cri des bovins. « Mugir » est le terme français courant, précis et digne.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: sans s’écarter ni à droite ni à gauche
  rationale: 'Cette tournure conserve l’idiome hébraïque et le sens de סור : quitter ou dévier de la route suivie.'
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: les princes des Philistins
  rationale: סְרָנִים est le titre propre aux dirigeants des principales villes philistines. « Princes » garde la valeur politique et le registre narratif sans en faire des souverains héréditaires au sens moderne.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: marchaient derrière elles
  rationale: Le participe exprime une action concomitante et continue. L’imparfait français rend naturellement cet arrière-plan narratif.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: jusqu’à la limite du territoire de Beth-Shémesh
  rationale: גְּבוּל peut désigner une frontière, une limite ou le territoire délimité. Cette formulation explicite qu’il s’agit de la limite du domaine de la ville.
