base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: fr
  text: 'Et voici les tumeurs d’or[a] que les Philistins rendirent à Yahweh comme offrande de réparation : une pour Ashdod, une pour Gaza, une pour Ashkelon, une pour Gath et une pour Ékron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enflures d’or » ; le mot hébreu désigne l’affection corporelle représentée par ces offrandes votives. Il est traditionnellement rendu, de façon plus précise, par « hémorroïdes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule introduit naturellement en français la liste explicative, tandis que le lien avec le contexte demeure évident.
- source_word: טְחֹרֵי הַזָּהָב
  choice: les tumeurs d’or
  rationale: Le terme désigne l’affection corporelle représentée par ces objets votifs. « Tumeurs » reste naturel et suffisamment précis sans imposer l’interprétation médicale plus étroite « hémorroïdes ».
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: que les Philistins rendirent
  rationale: Le hifil de שוב exprime ici l’action de rendre ou renvoyer; « rendirent » convient au contexte de restitution cultuelle.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française usuelle du nom de ce peuple.
- source_word: אָשָׁם
  choice: comme offrande de réparation
  rationale: אָשָׁם désigne une offrande liée à la culpabilité et à la réparation. Cette formulation met en relief la restitution exigée par le contexte tout en restant compréhensible.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », sans le remplacer par un titre.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: une pour Ashdod, une pour Gaza, une pour Ashkelon, une pour Gath et une pour Ékron
  rationale: La répétition de la préposition ל avec אֶחָד associe un objet à chacune des cinq villes. Le féminin « une » reprend naturellement « tumeur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée cultuelle de אָשָׁם
  choice: offrande de réparation
  alternative: offrande de culpabilité / sacrifice de réparation
  rationale: Dans ce contexte, le présent remis avec l’arche vise à reconnaître la faute et à réparer le tort. « Offrande » n’impose pas l’idée que ces objets aient été sacrifiés sur un autel.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique. Les noms géographiques suivent leurs formes françaises courantes; « Ékron » reçoit l’accent requis par l’orthographe française.
