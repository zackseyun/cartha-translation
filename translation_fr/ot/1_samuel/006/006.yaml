base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: fr
  text: Pourquoi donc endurcissez-vous vos cœurs[a], comme l’Égypte et le pharaon ont endurci leur cœur ? N’est-ce pas lorsqu’il les a traités durement qu’ils les ont laissés partir[b], et que les Israélites sont partis ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rendez vos cœurs lourds », comme l’Égypte et le pharaon « ont rendu leur cœur lourd ». En hébreu, cette image signifie ici « endurcir ».'
    reason: lexical_alternative
  - marker: b
    text: Dans « il les a traités durement », « les » désigne l’Égypte et le pharaon. Dans « ils les ont laissés partir », « ils » désigne l’Égypte et le pharaon, tandis que « les » désigne les Israélites.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: endurcissez / ont endurci
  rationale: Avec « cœur », le piel de כבד forme un idiome signifiant rendre le cœur lourd, donc l’endurcir. « Endurcir » en restitue naturellement le sens en français, tout en signalant l’image littérale en note.
- source_word: לְבַבְכֶם / לִבָּם
  choice: vos cœurs / leur cœur
  rationale: Le cœur désigne ici le siège de la volonté et des dispositions intérieures. Le pluriel « vos cœurs » convient à l’adresse collective, tandis que « leur cœur » suit naturellement en français la forme collective hébraïque concernant l’Égypte et le pharaon.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: l’Égypte et le pharaon
  rationale: Le nom de pays représente collectivement les Égyptiens ou leur pouvoir. La formulation conserve cette métonymie du texte hébreu.
- source_word: הִתְעַלֵּל
  choice: a traités durement
  rationale: Dans cette allusion à l’Exode, le verbe exprime une action sévère et punitive. « Traiter durement » est idiomatique sans préciser davantage la nature de l’action.
- source_word: וַיְשַׁלְּחוּם
  choice: ils les ont laissés partir
  rationale: שלח peut signifier envoyer, renvoyer ou laisser partir. Ici, l’allusion à la libération d’Israël favorise « laisser partir ».
- source_word: וַיֵּלֵכוּ
  choice: ils sont partis
  rationale: Cette formulation simple conserve la brièveté de la séquence hébraïque.
theological_decisions:
- issue: Sujet implicite de הִתְעַלֵּל
  choice: Le pronom « il » demeure sans référent explicitement ajouté, Dieu étant compris dans le contexte de l’Exode.
  alternative: 'Nommer directement Dieu, ou rendre la proposition de façon impersonnelle : « lorsque le malheur les a frappés ».'
  rationale: L’hébreu n’exprime pas ici le sujet, mais le contexte évoque l’action de Dieu contre l’Égypte. Le pronom préserve au mieux cette implicitation sans introduire un nom absent du verset.
- issue: Référents changeants des pronoms pluriels
  choice: Conserver les pronoms dans le texte et expliquer leurs référents en note.
  alternative: Remplacer les pronoms par « les Égyptiens » et « les Israélites ».
  rationale: Le texte hébreu passe de l’Égypte et du pharaon comme personnes frappées et agents du renvoi à Israël comme groupe renvoyé puis parti. Une note clarifie ce changement sans expliciter excessivement le corps du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe interrogative conserve la force rhétorique du verset, tandis que les notes rendent visibles l’idiome hébreu et les changements de référents pronominaux.
