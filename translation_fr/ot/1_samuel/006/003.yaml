  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: fr
  text: 'Ils répondirent : « Si vous renvoyez l’arche du Dieu d’Israël, ne la renvoyez pas sans rien ; vous devrez absolument lui remettre une offrande de réparation[a]. Alors vous serez guéris, et vous saurez pourquoi sa main[b] ne se détourne pas de vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande pour la culpabilité » ; traditionnellement « un sacrifice de culpabilité ».
    reason: lexical_alternative
  - marker: b
    text: La « main » de Dieu est ici une image de sa puissance à l’œuvre dans le jugement.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: renvoyez / ne la renvoyez pas
  rationale: Dans ce contexte, שלח désigne le renvoi de l’arche hors du territoire philistin. « Renvoyer » exprime naturellement ce retour tout en conservant la répétition hébraïque.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: l’arche du Dieu d’Israël
  rationale: Cette formulation rend directement la construction génitive sans ajouter « de l’alliance », absent de l’hébreu.
- source_word: רֵיקָם
  choice: sans rien
  rationale: L’expression signifie qu’il ne faut pas renvoyer l’arche sans don compensatoire. « Sans rien » est idiomatique en français et convient mieux à l’arche que « les mains vides ».
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: vous devrez absolument lui remettre
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’obligation. « Devrez absolument » en restitue à la fois la force et l’insistance.
- source_word: לּוֹ
  choice: lui
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au Dieu d’Israël plutôt qu’à l’arche, nom féminin en hébreu comme en français.
- source_word: אָשָׁם
  choice: une offrande de réparation
  rationale: Le terme désigne une offrande liée à la culpabilité et à la réparation du tort. « Offrande de réparation » met en relief sa fonction dans ce contexte philistin.
- source_word: תֵּרָפְאוּ
  choice: vous serez guéris
  rationale: Le nifal de רפא exprime ici la délivrance de l’affliction subie et conserve une valeur passive.
- source_word: וְנוֹדַע לָכֶם
  choice: vous saurez
  rationale: 'Cette tournure française naturelle rend le sens résultatif et impersonnel du nifal : la cause leur deviendra connue.'
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: pourquoi sa main ne s’est pas détournée de vous
  rationale: La métaphore hébraïque de la « main » est conservée, tandis que le passé composé exprime naturellement en français la persistance antérieure de l’affliction jusqu’au moment envisagé.
theological_decisions:
- issue: Référent du pronom dans לּוֹ
  choice: L’offrande est remise « à lui », c’est-à-dire au Dieu d’Israël.
  alternative: L’offrande est renvoyée « avec elle », c’est-à-dire avec l’arche.
  rationale: Le masculin singulier et la notion d’offrande réparatrice favorisent un référent divin personnel. La formulation ne réduit donc pas le geste à un simple cadeau accompagnant l’arche.
- issue: Sens de « sa main »
  choice: Conserver la métaphore de la main de Dieu comme expression de sa puissance agissante dans le jugement.
  alternative: Expliciter par « son châtiment » ou « le fléau qu’il vous inflige ».
  rationale: Cette image récurrente et théologiquement significative de l’Ancien Testament est intelligible en contexte et ne doit pas être remplacée par une interprétation plus étroite.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe directe convient à un conseil donné aux chefs philistins. « Arche » demeure en minuscule selon l’usage courant, et les métaphores hébraïques porteuses de sens sont préservées.
