reference: 1 Samuel 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: fr
  text: 'Regardez donc : si elle monte par la route de son territoire vers Beth-Shémesh, c’est lui qui nous a fait ce grand malheur[a]. Sinon, nous saurons que ce n’est pas sa main qui nous a frappés : c’est par hasard que cela nous est arrivé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cette grande catastrophe » ou « ce grand fléau ». Le mot hébreu peut désigner un dommage grave ou une calamité, sans nécessairement évoquer un mal moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce fut pour nous un événement fortuit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Regardez donc
  rationale: L’impératif pluriel introduit l’observation qui permettra de trancher. « Regardez donc » est naturel en français et conserve la valeur injonctive.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: par la route de son territoire
  rationale: Cette formulation reste proche des termes hébreux « route/chemin » et « territoire/frontière », tout en laissant au possessif une part de l’ambiguïté du texte source.
- source_word: יַעֲלֶה
  choice: elle monte
  rationale: Le verbe עלה signifie couramment « monter ». Le féminin français renvoie naturellement à l’arche, bien que le pronom hébreu soit déterminé par le genre grammatical de son référent implicite.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Le nom du lieu est translittéré selon une graphie française lisible.
- source_word: הוּא עָשָׂה לָנוּ
  choice: c’est lui qui nous a fait
  rationale: La tournure clivée rend l’insistance portée par le pronom indépendant הוּא et oppose explicitement l’action divine au hasard.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: ce grand malheur
  rationale: Dans ce contexte, רָעָה désigne le dommage ou la calamité subie, sans nécessairement qualifier un mal moral. « Malheur » garde la gravité de l’affliction et demeure idiomatique.
- source_word: וְאִם לֹא
  choice: Sinon
  rationale: « Sinon » exprime avec concision l’autre résultat possible de l’épreuve.
- source_word: וְיָדַעְנוּ
  choice: nous saurons
  rationale: Le futur français rend la conclusion à laquelle les Philistins parviendront après avoir observé le trajet.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: sa main qui nous a frappés
  rationale: L’image de la « main » est conservée, tandis que « frappés » communique mieux ici la puissance qui afflige que le littéral « touchés ».
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: c’est par hasard que cela nous est arrivé
  rationale: Cette tournure française naturelle conserve l’idée d’un événement fortuit opposé à une intervention divine.
theological_decisions:
- issue: Sens de רָעָה lorsqu’une action est attribuée à Dieu
  choice: ce grand malheur
  alternative: ce grand mal / cette grande catastrophe / ce grand fléau
  rationale: Le contexte parle d’une calamité infligée et non nécessairement d’un mal moral. « Malheur » préserve la réalité sévère du jugement sans résoudre le terme en une affirmation morale étrangère au contexte.
- issue: Opposition entre intervention divine et hasard
  choice: c’est lui qui… / c’est par hasard que…
  alternative: il nous a fait… / cela nous est arrivé fortuitement
  rationale: Les deux tournures clivées rendent nettement le contraste expérimental formulé par les Philistins, sans que la traduction approuve ou réfute leur conception du hasard.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’impératif d’observation, l’image de la main, l’insistance sur « lui » et la tension entre causalité divine et hasard. Les marqueurs [a] et [b] sont placés directement après les expressions qu’ils éclairent.
