  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: fr
  text: Faites donc des représentations de vos tumeurs[a] et de vos souris qui ravagent le pays, et rendez gloire au Dieu d’Israël. Peut-être rendra-t-il sa main moins lourde sur vous, sur vos dieux et sur votre pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos hémorroïdes ». Le terme hébreu désigne des grosseurs ou des enflures corporelles; cette traduction traditionnelle plus précise est possible, mais non certaine.
    reason: Alternative lexicale due à l’imprécision anatomique du terme hébreu.
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Faites donc
  rationale: Le wayyiqtol à valeur injonctive poursuit la consigne et exprime ici une conséquence. « Faites donc » restitue naturellement cette progression.
- source_word: צַלְמֵי
  choice: des représentations de
  rationale: צֶלֶם désigne une image ou une reproduction. « Représentations » convient à la fois aux tumeurs et aux souris et évoque des objets façonnés sans préciser indûment leur forme.
- source_word: עפלי/כם
  choice: vos tumeurs
  rationale: Le terme désigne des grosseurs ou enflures corporelles. « Tumeurs » reste suffisamment large; la traduction traditionnelle plus précise « hémorroïdes » est signalée en note.
- source_word: וְצַלְמֵי עַכְבְּרֵיכֶם
  choice: et de vos souris
  rationale: עַכְבָּר désigne une souris, ou plus largement un petit rongeur. « Souris » est le sens usuel et convient au contexte traditionnel du passage.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: qui ravagent le pays
  rationale: Le participe exprime une action destructrice en cours. « Ravagent » en rend la vigueur; « le pays » désigne ici le territoire touché.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: et rendez gloire
  rationale: L’expression signifie reconnaître publiquement le poids, l’honneur et la puissance du Dieu d’Israël. « Rendre gloire » est idiomatique en français biblique actuel.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: au Dieu d’Israël
  rationale: Le syntagme construit désigne sans ambiguïté le Dieu d’Israël.
- source_word: אוּלַי
  choice: Peut-être
  rationale: אוּלַי marque une possibilité espérée, sans garantir le résultat.
- source_word: יָקֵל אֶת יָדוֹ מֵעֲלֵיכֶם
  choice: rendra-t-il sa main moins lourde sur vous
  rationale: Le hiphil de קלל signifie ici alléger. Cette formulation conserve l’image de la main divine pesante tout en étant naturelle en français.
- source_word: וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: sur vos dieux et sur votre pays
  rationale: La répétition de « sur » maintient la portée rhétorique de מֵעַל et montre que la même main pèse sur les Philistins, leurs dieux et leur territoire.
theological_decisions:
- issue: Nature précise de l’affliction désignée par עפלים
  choice: tumeurs
  alternative: hémorroïdes; enflures
  rationale: Le mot hébreu évoque des grosseurs corporelles sans imposer avec certitude une localisation anatomique. Le texte principal conserve donc un terme général, tandis que la lecture traditionnelle est maintenue en note.
- issue: Image anthropomorphique de la main divine
  choice: conserver « sa main » et l’idée de son poids
  alternative: sa puissance; son châtiment
  rationale: L’image hébraïque est intelligible et souligne directement l’action contraignante de Dieu. La paraphraser ferait perdre une tension et un motif importants du récit.
- issue: Les dieux philistins sous la main du Dieu d’Israël
  choice: « sur vos dieux »
  alternative: expliciter leur humiliation ou leur impuissance
  rationale: Le texte affirme que la main du Dieu d’Israël pèse aussi sur leurs dieux, mais n’en développe pas ici les implications. La traduction conserve cette affirmation sans lui ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant le calque peu naturel « alléger sa main de dessus vous ». « Rendra sa main moins lourde sur » préserve à la fois l’image du poids et la triple répétition concernant les personnes, les dieux et le pays.
