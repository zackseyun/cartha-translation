source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: fr
  text: Prenez ensuite l’arche de Yahweh et placez-la sur le chariot. Mettez dans un coffre, à côté d’elle, les objets en or que vous lui rendez comme offrande de réparation. Puis envoyez-la, et elle ira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et elle ira ». Dans cette suite d’instructions, l’expression peut aussi se comprendre comme une conséquence de l’ordre précédent ou avec une nuance permissive : « laissez-la partir ».'
    reason: Préserver l’ambiguïté entre conséquence future et nuance permissive ou jussive.
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: אֲרוֹן désigne ici l’arche sacrée, et le nom divin est translittéré « Yahweh » conformément à la politique fournie pour ce terme contesté.
- source_word: הָעֲגָלָה
  choice: le chariot
  rationale: עֲגָלָה désigne un véhicule à roues; « chariot » est naturel dans ce récit, où il s’agit du chariot neuf mentionné au verset précédent.
- source_word: כְּלֵי הַזָּהָב
  choice: les objets en or
  rationale: כְּלִי est un terme large pouvant désigner divers objets, articles ou récipients; le contexte appelle une formulation non spécialisée.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: que vous lui rendez
  rationale: Le hiphil de שׁוב exprime le fait de rendre ou renvoyer quelque chose; le présent français convient à l’instruction en cours.
- source_word: אָשָׁם
  choice: offrande de réparation
  rationale: אָשָׁם associe ici culpabilité et compensation. « Offrande de réparation » conserve la dimension réparatrice particulièrement saillante dans ce contexte philistin.
- source_word: בָאַרְגַּז
  choice: dans un coffre
  rationale: אַרְגָּז désigne une boîte ou un coffre; « coffre » convient à un contenant placé auprès de l’arche sans être archaïque.
- source_word: מִצִּדּוֹ
  choice: à côté d’elle
  rationale: Le suffixe renvoie le plus naturellement à l’arche; le féminin français reprend clairement « l’arche ».
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: Puis renvoyez-la
  rationale: שׁלח signifie ici envoyer au loin ou laisser partir; « renvoyez-la » exprime naturellement le retour de l’arche.
- source_word: וְהָלָךְ
  choice: et qu’elle parte
  rationale: La forme signifie littéralement « et elle ira ». Après l’impératif, la tournure française garde la nuance jussive ou permissive sans la transformer en simple prédiction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente directement le nom propre hébreu et suit la politique du projet indiquée dans les données de consultation.
- issue: Valeur cultuelle de אָשָׁם dans un contexte philistin
  choice: offrande de réparation
  alternative: sacrifice de culpabilité
  rationale: Le mot appartient au vocabulaire cultuel hébreu, mais le présent contexte souligne aussi la réparation offerte en retour. Le choix retenu préserve cette tension sans supposer que les Philistins pratiquent exactement le rite israélite ultérieurement codifié.
- issue: Valeur de וְהָלָךְ après l’ordre de renvoyer l’arche
  choice: et qu’elle parte
  alternative: et elle ira
  rationale: L’hébreu peut se lire formellement comme une conséquence future ou, dans cette suite d’instructions, comme une permission/injonction. La formulation retenue conserve la nuance volitive contextuelle, tandis que la note signale le sens littéral.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe directe d’instruction. « Objets en or » évite de préciser indûment la nature de כְּלֵי; « coffre » reste concret et courant. Le pronom féminin renvoie à l’arche, référent le plus naturel dans la séquence.
