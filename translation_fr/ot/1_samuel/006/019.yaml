  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: fr
  text: Il frappa des hommes de Beth-Shémesh parce qu’ils avaient regardé dans l’arche de Yahweh[a]. Il frappa, parmi le peuple, soixante-dix hommes, cinquante mille hommes[b], et le peuple fut en deuil parce que Yahweh avait frappé le peuple d’un grand coup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’ils avaient regardé l’arche de Yahweh ». La préposition hébraïque peut avoir ce sens plus général, bien que « regardé dans » corresponde probablement à l’offense dans ce contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement : « soixante-dix hommes, cinquante mille hommes », formulation difficile. Elle peut être comprise comme « soixante-dix hommes sur cinquante mille », « cinquante mille et soixante-dix hommes », ou provenir d’un problème de transmission du texte ; certains témoins anciens donnent un nombre bien inférieur.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: il frappa
  rationale: Le verbe נכה signifie « frapper » et peut, dans ce contexte de jugement, impliquer la mort. « Il frappa » conserve le lien lexical avec הִכָּה plus loin dans le verset sans expliciter davantage que l’hébreu.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: certains des hommes de Beth-Shémesh
  rationale: 'La préposition בְּ peut ici avoir une valeur partitive : Yahweh frappa parmi les hommes de la ville, et non nécessairement tous. Le nom de lieu est translittéré sous la forme française Beth-Shémesh.'
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: parce qu’ils avaient regardé dans l’arche de Yahweh
  rationale: Avec ראה, la préposition ב peut signifier regarder dans ou regarder l’objet. « Regardé dans » convient probablement à l’offense décrite, tandis qu’une note conserve l’autre possibilité.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le syntagme construit est rendu directement, avec translittération du nom divin.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: soixante-dix hommes, cinquante mille hommes
  rationale: La suite numérique difficile du texte massorétique est conservée sans ajouter une relation syntaxique absente du texte.
- source_word: וַיִּתְאַבְּלוּ
  choice: prit le deuil
  rationale: Le hitpael de אבל désigne l’action de mener deuil après une mort ou un désastre. « Prendre le deuil » est naturel et précis en français.
- source_word: מַכָּה גְדוֹלָה
  choice: un coup terrible
  rationale: מַכָּה désigne un coup ou un fléau. « Coup terrible » garde le rapport avec le verbe « frapper » tout en exprimant idiomatiquement la gravité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le rend directement plutôt que de lui substituer un titre.
- issue: Nature de l’offense envers l’arche
  choice: regardé dans l’arche
  alternative: regardé l’arche
  rationale: La construction hébraïque permet les deux compréhensions. Le contexte favorise probablement l’idée de regarder à l’intérieur, mais l’ambiguïté est signalée en note.
- issue: Nombre des victimes
  choice: conserver « soixante-dix hommes, cinquante mille hommes » dans le texte principal
  alternative: « soixante-dix hommes sur cinquante mille », « cinquante mille soixante-dix hommes » ou un nombre inférieur d’après certains témoins anciens
  rationale: La formulation massorétique est notoirement difficile. La conserver évite de trancher silencieusement une question textuelle et syntaxique incertaine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste volontairement heurtée dans l’énoncé du nombre afin de préserver la difficulté de l’hébreu. Le passé simple convient au récit biblique soutenu, tandis que « prit le deuil » demeure courant et intelligible.
