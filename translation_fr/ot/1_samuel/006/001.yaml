  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: fr
  text: L’arche de Yahweh resta sept mois dans le territoire des Philistins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le champ des Philistins »; le mot hébreu peut aussi désigner leur pays ou leur territoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: resta
  rationale: Dans cette suite narrative, la forme de היה décrit la durée de présence de l’arche. « Resta » rend naturellement en français cette situation prolongée sans reproduire mécaniquement la tournure hébraïque.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: La chaîne construite est rendue directement. « Arche » est le terme français établi dans ce contexte cultuel, et le nom divin est conservé comme nom propre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est translittéré afin de préserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: dans le territoire des Philistins
  rationale: שָׂדֶה signifie littéralement « champ », mais peut désigner un pays ou un territoire. Ici, le contexte géographique collectif favorise « territoire », formulation claire et naturelle; le sens littéral est signalé en note.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: sept mois
  rationale: La durée numérique est rendue directement, sans adaptation nécessaire.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre de Dieu. « Yahweh » le conserve sans le remplacer par un titre et sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre des constituants a été légèrement réorganisé pour une phrase naturelle, tout en conservant la durée et la localisation du texte hébreu.
