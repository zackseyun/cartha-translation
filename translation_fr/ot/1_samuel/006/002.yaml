  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: fr
  text: 'Alors les Philistins firent appeler les prêtres et les devins et leur dirent : « Que devons-nous faire de l’arche de Yahweh ? Dites-nous avec quoi[a] nous devons l’envoyer à sa place. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par quel moyen ». L’expression hébraïque peut demander comment envoyer l’arche ou ce qui doit l’accompagner.
    reason: Préserver l’étendue de sens de בַּמֶּה sans imposer au verset l’explication donnée par la suite du récit.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: firent appeler
  rationale: Cette tournure française exprime naturellement la convocation de spécialistes afin de les consulter.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française usuelle de ce peuple, avec l’article requis par le contexte narratif.
- source_word: לַכֹּהֲנִים
  choice: les prêtres
  rationale: Le terme désigne ici les prêtres philistins; le texte n’exige pas d’ajouter ce qualificatif.
- source_word: וְלַקֹּסְמִים
  choice: et les devins
  rationale: « Devins » rend les praticiens de la divination dans un français actuel et digne.
- source_word: מַה נַּעֲשֶׂה
  choice: Que devons-nous faire
  rationale: Rend naturellement la question délibérative à la première personne du pluriel.
- source_word: לַאֲרוֹן יְהוָה
  choice: de l’arche de Yahweh
  rationale: Dans cette construction interrogative, « faire de » est l’équivalent idiomatique français de la préposition ל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הוֹדִיעֻנוּ
  choice: Dites-nous
  rationale: Traduction française naturelle de l’impératif hiphil « faites-nous savoir ».
- source_word: בַּמֶּה
  choice: avec quoi
  rationale: Conserve la formulation concrète de l’hébreu et son ouverture possible quant au moyen employé ou à ce qui doit accompagner l’arche.
- source_word: נְשַׁלְּחֶנּוּ
  choice: nous devons la renvoyer
  rationale: Le verbe exprime ici l’action envisagée après consultation. « Renvoyer » est naturel en français dans ce contexte de restitution, bien que l’idée de retour vienne du contexte.
- source_word: לִמְקוֹמוֹ
  choice: à sa place
  rationale: Traduction directe qui conserve le suffixe possessif sans préciser davantage la destination.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie le Tétragramme comme nom propre; « Yahweh » le conserve explicitement sans le remplacer par un titre.
- issue: Sens de בַּמֶּה dans les instructions concernant le renvoi de l’arche
  choice: avec quoi
  alternative: comment / par quel moyen
  rationale: La formulation littérale préserve l’ambiguïté entre le moyen du renvoi et ce qui doit accompagner l’arche; le contexte suivant évoquera une offrande, mais celle-ci n’est pas explicitée dans ce verset.
translation_notes:
  register: Français international moderne, narratif et digne. « Firent appeler » et « Dites-nous » assurent une lecture naturelle; « avec quoi » conserve volontairement l’étrangeté et l’ambiguïté pertinentes de l’hébreu.
