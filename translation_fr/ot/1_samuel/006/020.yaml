base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: fr
  text: 'Alors les hommes de Beth-Shémesh dirent : « Qui peut se tenir devant Yahweh, ce Dieu saint ? Et vers qui montera-t-il, loin de nous[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne précise pas le sujet de « montera ». Dans le contexte, il s’agit probablement de l’arche de Yahweh ; on pourrait traduire : « Et vers qui l’arche montera-t-elle loin de nous ? »'
    reason: Le sujet du verbe masculin singulier יַעֲלֶה n’est pas exprimé ; le contexte favorise l’arche.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors … dirent
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette succession narrative en français.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: les hommes de Beth-Shémesh
  rationale: אַנְשֵׁי signifie ici littéralement « les hommes de ». La formulation conserve cette désignation masculine plutôt que de la généraliser en « habitants ».
- source_word: מִי יוּכַל לַעֲמֹד לִפְנֵי
  choice: Qui peut tenir devant
  rationale: יכל exprime la capacité, et l’expression עמד לפני signifie se tenir ou subsister devant quelqu’un. « Tenir devant » rend avec naturel l’idée d’être capable de demeurer en présence de Dieu après le jugement rapporté.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: ce Dieu saint
  rationale: Cette formulation naturelle conserve à la fois la sainteté attribuée à Dieu et la force immédiate du démonstratif הַזֶּה.
- source_word: וְאֶל מִי יַעֲלֶה
  choice: Et vers qui montera-t-il
  rationale: Le verbe עלה signifie « monter » et son sujet reste implicite en hébreu. Le pronom masculin maintient cette indétermination formelle dans le texte principal, tandis qu’une note indique le référent contextuel probable.
- source_word: מֵעָלֵינוּ
  choice: en partant de chez nous
  rationale: מֵעָלֵינוּ exprime ici un mouvement d’éloignement depuis le lieu où se trouvent les habitants. Cette tournure est plus idiomatique en français que le calque « de dessus nous ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le nom personnel au lieu de lui substituer un titre.
- issue: Sujet implicite de יַעֲלֶה
  choice: montera-t-il
  alternative: l’arche montera-t-elle
  rationale: L’hébreu présente un verbe masculin singulier sans sujet exprimé. Le contexte désigne probablement l’arche, mais le texte ne la nomme pas dans cette phrase. Le corps du verset préserve donc l’ambiguïté, et la note fournit l’explicitation probable.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative conserve la crainte solennelle des habitants, sans archaïsme inutile. Le toponyme est rendu sous la forme française courante « Beth-Shémesh ».
