  source_fidelity: La première question rend fidèlement מי יוכל לעמד לפני (« qui peut se tenir devant ») et conserve Yahweh ainsi que le démonstratif de « ce Dieu saint ». Dans la seconde, le sujet de יַעֲלֶה demeure non exprimé en hébreu, mais le masculin de « montera-t-il » en français donne facilement l’impression qu’il s’agit de Dieu, mentionné juste avant. Le contexte vise probablement l’arche ; il convient donc de le signaler plus directement tout en précisant en note que l’hébreu n’explicite pas le sujet.
  naturalness: « Qui peut se tenir devant » est plus idiomatique et plus exact que « Qui peut tenir devant ». « Loin de nous » rend naturellement le mouvement d’éloignement exprimé par מֵעָלֵינוּ, sans la coloration domestique de « en partant de chez nous ».
  terminology: « Beth-Shémesh », « Yahweh » et « Dieu saint » conviennent au français international moderne et au registre solennel du passage.
