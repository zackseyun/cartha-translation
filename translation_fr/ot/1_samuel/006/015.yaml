reference: 1 Samuel 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: fr
  text: Les Lévites firent descendre l’arche de Yahweh[a], ainsi que le coffre qui l’accompagnait et qui contenait les objets en or[b], puis ils les déposèrent sur la grande pierre[c]. Ce jour-là, les hommes de Beth-Shémesh offrirent des holocaustes et immolèrent des sacrifices à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu peut désigner largement des objets, des ustensiles ou des articles en or.
    reason: lexical_alternative
  - marker: c
    text: 'Ou peut-être : « près de la grande pierre ». La préposition hébraïque peut exprimer la direction ou la proximité; le contexte favorise ici l’idée d’un dépôt sur la pierre.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְהַלְוִיִּם הוֹרִידוּ
  choice: Les Lévites firent descendre
  rationale: Le hiphil de ירד exprime ici le fait de faire descendre ou de retirer de la charrette. « Firent descendre » reste proche de la forme hébraïque tout en étant naturel en français.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Dans ce contexte cultuel, אֲרוֹן désigne l’arche. Le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: הָאַרְגַּז
  choice: le coffre
  rationale: Le terme désigne un contenant distinct de l’arche et placé avec elle. « Coffre » est clair, digne et suffisamment général en français contemporain.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui l’accompagnait
  rationale: Cette formulation rend naturellement la relation exprimée par « qui était avec elle », sans ajouter de précision spatiale absente de l’hébreu.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: qui contenait les objets en or
  rationale: כְּלֵי est un terme large pouvant désigner des objets, ustensiles ou articles. « Objets en or » évite de préciser indûment leur forme ou leur usage.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: puis ils les déposèrent sur la grande pierre
  rationale: Avec שׂים, la préposition אֶל peut ici indiquer le lieu où les objets sont déposés. Le contexte immédiat favorise « sur », mais une nuance « près de/contre » demeure possible et est signalée en note.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: les hommes de Beth-Shémesh
  rationale: אַנְשֵׁי est explicitement masculin. « Les hommes » conserve cette donnée plutôt que de la neutraliser, tandis que « Beth-Shémesh » suit une translittération française lisible.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: offrirent des holocaustes
  rationale: Il s’agit de l’expression sacrificielle habituelle pour faire monter une offrande entièrement consumée. « Offrir des holocaustes » est le terme français traditionnel et précis.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: immolèrent des sacrifices
  rationale: Cette formulation conserve l’action sacrificielle concrète du verbe זבח et le nom apparenté זבחים sans produire en français la répétition maladroite « sacrifièrent des sacrifices ».
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: Ce jour-là … à Yahweh
  rationale: La tournure rend directement l’indication temporelle et le destinataire des actes sacrificiels.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie le Tétragramme comme nom propre. La translittération « Yahweh » le rend explicitement sans le remplacer par un titre; l’usage traditionnel est indiqué en note.
- issue: Portée de אַנְשֵׁי
  choice: les hommes de Beth-Shémesh
  alternative: les habitants de Beth-Shémesh
  rationale: Le nom hébreu est masculin et le contexte n’oblige pas à l’interpréter comme une désignation générique de toute la population.
translation_notes:
  register: Français international contemporain, au registre narratif digne et accessible. La syntaxe a été légèrement fluidifiée, notamment par « qui l’accompagnait » et « puis », sans effacer les rapports entre les propositions hébraïques. Les termes cultuels établis « arche », « holocaustes » et « sacrifices » sont maintenus pour leur précision.
