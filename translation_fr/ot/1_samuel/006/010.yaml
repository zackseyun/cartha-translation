  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: fr
  text: 'Les hommes firent donc ainsi : ils prirent deux vaches qui allaitaient[a], les attelèrent au chariot et enfermèrent leurs veaux dans la maison.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux vaches qui donnaient du lait ». L’hébreu décrit des vaches qui allaitaient encore leurs veaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: firent donc ainsi
  rationale: Expression hébraïque concise indiquant qu’ils exécutèrent les instructions reçues; cette tournure garde le lien logique et le style narratif.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le nom désigne ici les hommes chargés d’accomplir l’action, plutôt qu’un groupe indifférencié.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: deux vaches qui allaitaient
  rationale: עָלוֹת qualifie ici des vaches donnant encore du lait à leurs petits; la formulation explicite naturellement ce fait décisif pour le signe narratif.
- source_word: וַיַּאַסְרוּם
  choice: les attelèrent
  rationale: Bien que le verbe signifie fondamentalement « lier », il décrit ici la fixation d’animaux de trait à un véhicule; « atteler » est le terme français précis.
- source_word: בָּעֲגָלָה
  choice: au chariot
  rationale: Le nom désigne le véhicule destiné à transporter l’arche et les offrandes; « chariot » convient au contexte ancien.
- source_word: וְאֶת בְּנֵיהֶם
  choice: leurs veaux
  rationale: Littéralement « leurs fils/petits », mais l’antécédent animal impose naturellement « veaux » en français.
- source_word: כָּלוּ בַבָּיִת
  choice: enfermèrent ... dans la maison
  rationale: Le verbe exprime ici le fait de retenir ou de confiner, tandis que בַּבָּיִת signifie littéralement « dans la maison »; la traduction conserve cette image sans la remplacer par « étable ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Atteler » et « chariot » sont précis sans être techniques; « qui allaitaient » rend clairement la situation des vaches et de leurs veaux.
