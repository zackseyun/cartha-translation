  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: fr
  text: 'Ils demandèrent : « Quelle offrande de réparation[a] devons-nous lui renvoyer ? » Ils répondirent : « D’après le nombre des dirigeants philistins : cinq tumeurs en or[b] et cinq souris en or. En effet, un seul fléau a frappé tous, ainsi que vos dirigeants. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrande de culpabilité » ; il s’agit d’une offrande destinée à réparer une faute.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne probablement des enflures provoquées par le fléau ; certains traduisent plus précisément par « hémorroïdes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: offrande de réparation
  rationale: Dans ce contexte cultuel, אָשָׁם désigne une offrande destinée à réparer une faute. « Offrande de réparation » exprime clairement sa fonction sans réduire le terme au seul sentiment de culpabilité.
- source_word: נָשִׁיב לוֹ
  choice: devons-nous lui renvoyer
  rationale: Le hiphil de שׁוב signifie ici « renvoyer » ou « rendre ». Le pronom masculin singulier est conservé par « lui » et renvoie naturellement au Dieu d’Israël, tout en laissant le contexte guider l’identification.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: d’après le nombre des dirigeants philistins
  rationale: La tournure indique une correspondance avec le nombre des chefs philistins. « D’après le nombre » rend cette relation de façon naturelle.
- source_word: סַרְנֵי
  choice: dirigeants
  rationale: סֶרֶן est un titre propre aux principaux chefs politiques philistins. « Dirigeants » est moderne et évite les connotations féodales de « seigneurs ».
- source_word: עפלי זָהָב
  choice: tumeurs en or
  rationale: Le nom désigne vraisemblablement des enflures liées au fléau. « Tumeurs » reste concret sans préciser de manière incertaine leur nature exacte.
- source_word: עַכְבְּרֵי זָהָב
  choice: souris en or
  rationale: עַכְבָּר signifie directement « souris ». La tournure « en or » est idiomatique en français pour indiquer la matière des représentations.
- source_word: מַגֵּפָה אַחַת
  choice: un même fléau
  rationale: L’expression souligne qu’un fléau unique ou identique atteint tous les groupes mentionnés. « Un même fléau » rend naturellement cette unité en français.
- source_word: לְכֻלָּם
  choice: a frappé chacun de vous
  rationale: Le suffixe de troisième personne renvoie, dans le discours cité, à l’ensemble des Philistins concernés. Le français direct « chacun de vous » explicite naturellement le changement de perspective impliqué par la réponse adressée aux interlocuteurs.
- source_word: וּלְסַרְנֵיכֶם
  choice: ainsi que vos dirigeants
  rationale: Le suffixe de deuxième personne du pluriel est rendu par « vos ». La relation avec le fléau est exprimée par le verbe « a frappé » déjà posé dans la proposition.
theological_decisions:
- issue: Référent du pronom לוֹ dans la question sur l’offrande
  choice: « lui », compris naturellement comme renvoyant au Dieu d’Israël
  alternative: « la lui renvoyer » ou « la renvoyer à l’arche », si le référent était compris comme l’arche
  rationale: Le texte porte un pronom masculin singulier. Le contexte d’une offrande réparatrice favorise une référence personnelle au Dieu d’Israël, sans qu’il soit nécessaire d’ajouter son nom dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue est rendu naturellement en distinguant la question des Philistins et la réponse des prêtres et devins. « Dirigeants » évite l’archaïsme de « seigneurs », tandis que « tumeurs » préserve l’incertitude médicale du terme hébreu.
