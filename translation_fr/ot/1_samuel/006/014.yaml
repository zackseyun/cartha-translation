  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: fr
  text: Le chariot arriva dans le champ de Josué de Beth-Shémesh[a] et s’y arrêta[b]. Il y avait là une grande pierre. Ils fendirent le bois du chariot et offrirent les vaches en holocauste à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Josué le Beth-Shémite ». L’hébreu désigne Josué par son lien avec Beth-Shémesh.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « se tint là » ; à propos du chariot, le verbe indique qu’il s’immobilisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: le chariot
  rationale: Dans ce récit, עֲגָלָה désigne le véhicule qui transporte l’arche et les objets d’or. « Chariot » est naturel en français moderne et convient mieux ici que « charrette », qui évoquerait plus nettement un véhicule agricole léger.
- source_word: בָּאָה אֶל
  choice: arriva dans
  rationale: Le verbe בוא exprime l’arrivée ou le mouvement vers un lieu. Avec שְׂדֵה, « arriva dans le champ » rend naturellement le déplacement sans ajouter de nuance absente du texte.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: le champ de Josué de Beth-Shémesh
  rationale: L’expression rattache Josué à Beth-Shémesh. Cette formulation française est claire et concise tout en conservant l’ambiguïté entre l’origine géographique et le gentilé explicitée en note.
- source_word: וַתַּעֲמֹד שָׁם
  choice: et s’y arrêta
  rationale: עמד signifie littéralement « se tenir debout » ou « se tenir », mais, appliqué à un chariot en mouvement, il indique naturellement qu’il s’immobilise. La note conserve le sens littéral.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: Il y avait là une grande pierre
  rationale: Cette phrase autonome respecte la coordination narrative de l’hébreu et rend clairement la présence de la pierre à cet endroit.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: Ils fendirent le bois du chariot
  rationale: בקע exprime l’action de fendre. « Le bois du chariot » rend l’expression collective hébraïque et indique que ses éléments en bois servent de combustible.
- source_word: הַפָּרוֹת
  choice: les vaches
  rationale: Le pluriel féminin désigne des bovins femelles. Le contexte précédent précise qu’elles allaitaient, de sorte que « vaches » est plus exact que « génisses ».
- source_word: הֶעֱלוּ עֹלָה
  choice: offrirent … en holocauste
  rationale: La construction sacrificielle désigne l’offrande entièrement consumée. « Offrir en holocauste » est une formulation française établie qui conserve la valeur rituelle du texte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte hébreu emploie directement le nom divin יהוה. « Yahweh » le représente comme nom propre plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset contient le tétragramme comme nom divin. Le rendre par « Yahweh » préserve sa fonction de nom propre et évite de le confondre avec le titre אֲדֹנָי.
- issue: Nature du sacrifice des vaches
  choice: offrirent les vaches en holocauste
  alternative: sacrifièrent les vaches comme holocauste
  rationale: Le choix conserve la terminologie sacrificielle de הֶעֱלוּ עֹלָה sans expliquer ni atténuer la tension narrative liée à l’offrande de ces animaux.
translation_notes:
  register: Français international moderne, sobre et narratif. La coordination simple reflète le rythme du récit hébreu, tandis que les formulations idiomatiques « s’y arrêta » et « offrirent … en holocauste » assurent une lecture naturelle sans effacer les particularités du texte source.
