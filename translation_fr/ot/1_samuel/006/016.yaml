lexical_decisions:
- source_word: וַ/חֲמִשָּׁה סַרְנֵי פְלִשְׁתִּים
  choice: les cinq chefs des Philistins
  rationale: Le groupe construit désigne les cinq détenteurs de l’autorité dans les principales cités philistines. « Chefs » exprime naturellement leur fonction politique en français moderne, sans connotation féodale.
- source_word: רָאוּ
  choice: après avoir vu cela
  rationale: Le verbe signifie littéralement « ils virent » sans complément exprimé. « Cela » reprend sans la préciser davantage la scène qui vient d’être racontée; la tournure circonstancielle rend naturellement la relation narrative avec leur retour.
- source_word: וַ/יָּשֻׁבוּ
  choice: retournèrent
  rationale: Le verbe שׁוב dans cette séquence narrative indique qu’ils regagnèrent leur point de départ.
- source_word: עֶקְרוֹן
  choice: à Éqron
  rationale: Le nom de lieu est translittéré; le français exige la préposition « à » pour marquer la destination.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: ce même jour
  rationale: Littéralement « ce jour-là ». Dans ce contexte narratif, « ce même jour » souligne naturellement que le retour eut lieu sans attendre, tout en conservant l’indication temporelle.
