  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: fr
  text: Quand les cinq chefs des Philistins virent cela, ils retournèrent à Ékron ce même jour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce jour-là ».'
