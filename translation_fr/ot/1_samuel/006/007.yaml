  text: וְ/עַתָּ֗ה קְח֨וּ וַ/עֲשׂ֜וּ עֲגָלָ֤ה חֲדָשָׁה֙ אֶחָ֔ת וּ/שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת אֲשֶׁ֛ר לֹא עָלָ֥ה עֲלֵי/הֶ֖ם עֹ֑ל וַ/אֲסַרְתֶּ֤ם אֶת הַ/פָּרוֹת֙ בָּ/עֲגָלָ֔ה וַ/הֲשֵׁיבֹתֶ֧ם בְּנֵי/הֶ֛ם מֵ/אַחֲרֵי/הֶ֖ם הַ/בָּֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: fr
  text: À présent, prenez et fabriquez un chariot neuf, ainsi que deux vaches allaitantes qui n’ont jamais porté le joug[a]. Attelez les vaches au chariot, mais ramenez leurs veaux à la maison, loin d’elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur lesquelles aucun joug n’est venu » ; c’est-à-dire des vaches qui n’ont jamais été employées comme animaux de trait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque naturellement en français la transition vers l’étape suivante des instructions.
- source_word: קְחוּ וַעֲשׂוּ
  choice: prenez ... et préparez-le
  rationale: Conserve les deux impératifs tout en donnant à עשה son sens contextuel de préparer ou disposer le chariot.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: un chariot neuf
  rationale: « Chariot » rend le véhicule destiné à être tiré; l’article indéfini exprime naturellement l’unité en français.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: deux vaches qui allaitent
  rationale: עָלוֹת désigne des vaches ayant encore leurs veaux et donnant du lait; cette formulation est précise et courante.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: qui n’ont jamais porté le joug
  rationale: Rend idiomatiquement l’image hébraïque « sur lesquelles aucun joug n’est monté » et indique qu’elles n’ont encore servi à aucun travail de trait.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: Attelez les vaches au chariot
  rationale: « Atteler » est le terme français naturel pour fixer des animaux de trait à un véhicule.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: mais ramenez leurs veaux à la maison, loin d’elles
  rationale: « Ramenez » exprime le causatif de שוב; « leurs veaux » contextualise בְּנֵיהֶם, et « loin d’elles » conserve l’idée de séparation portée par מֵאַחֲרֵיהֶם.
theological_decisions: []
