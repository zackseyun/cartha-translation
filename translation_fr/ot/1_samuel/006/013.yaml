  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: fr
  text: Les habitants de Beth-Shémesh moissonnaient le blé dans la vallée. Ils levèrent les yeux[a], virent l’arche et se réjouirent de la voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils levèrent leurs yeux » ; expression hébraïque signifiant qu’ils regardèrent vers le haut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Les habitants de Beth-Shémesh
  rationale: Le nom de la ville est employé par métonymie pour ses habitants, comme l’indiquent le participe et les verbes au pluriel. « Les habitants » explicite ce sens sans préciser inutilement le genre.
- source_word: קֹצְרִים
  choice: moissonnaient
  rationale: Le participe pluriel décrit une action en cours servant d’arrière-plan au récit ; l’imparfait français en restitue naturellement la valeur durative.
- source_word: קְצִיר חִטִּים
  choice: le blé
  rationale: Avec « moissonner », traduire littéralement le nom d’action produirait une répétition pesante. « Moissonnaient le blé » exprime naturellement l’activité et la récolte désignées par l’hébreu.
- source_word: בָּעֵמֶק
  choice: dans la vallée
  rationale: עֵמֶק désigne ici une vallée ou une étendue basse ; « vallée » est le terme français le plus direct.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: Ils levèrent les yeux
  rationale: Cette expression hébraïque signifie qu’ils regardèrent vers le haut. La tournure française correspondante est naturelle et conserve l’image du texte source.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: virent l’arche
  rationale: Le verbe simple respecte la progression narrative. Dans le contexte de 1 Samuel 4–6, « l’arche » désigne sans ambiguïté l’arche de Dieu déjà connue du lecteur.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: se réjouirent de la voir
  rationale: L’infinitif exprime ce qui provoque leur joie. Le pronom féminin « la » reprend explicitement « l’arche », objet laissé implicite en hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. L’imparfait pose l’action de fond, puis le passé simple rend la succession des événements. Le connecteur initial וּ n’est pas surtraduit par un marqueur discursif artificiel.
