source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: fr
  text: 'Ils envoyèrent donc des messagers aux habitants de Kiriath-Yéarim pour leur dire : « Les Philistins ont ramené l’arche de Yahweh. Descendez et faites-la monter chez vous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie deux verbes topographiques : « descendre », puis « faire monter ». Ils reflètent probablement le relief entre Beth-Shémesh et Kiriath-Yéarim.'
    reason: Précision lexicale et géographique.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Ils envoyèrent donc
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français, et « donc » exprime naturellement l’enchaînement avec la scène précédente.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte de communication humaine, le mot désigne des envoyés; « anges » serait trompeur.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: aux habitants de Kiriath-Yéarim
  rationale: Le participe substantivé signifie « ceux qui habitent »; « habitants » est précis et naturel. Le nom du lieu est translittéré.
- source_word: לֵאמֹר
  choice: pour leur dire
  rationale: Cette tournure française introduit naturellement le discours direct et explicite les destinataires déjà mentionnés.
- source_word: הֵשִׁיבוּ פְלִשְׁתִּים
  choice: Les Philistins ont ramené
  rationale: Le hiphil de שוב exprime ici le fait de faire revenir ou de rapporter. Le passé composé présente l’action accomplie dont le résultat est pertinent au moment du message.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le syntagme construit est rendu directement, et le nom divin est translittéré afin de conserver le nom propre présent dans l’hébreu.
- source_word: רְדוּ
  choice: Descendez
  rationale: L’impératif de ירד indique un déplacement vers le bas, vraisemblablement de Kiriath-Yéarim à Beth-Shémesh. Le choix conserve explicitement la donnée topographique.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: faites-la monter chez vous
  rationale: Le hiphil de עלה signifie « faire monter ». « Chez vous » rend idiomatiquement אֲלֵיכֶם et indique que l’arche doit être conduite jusqu’au lieu où vivent les destinataires.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le distingue d’un simple titre tout en suivant une translittération française intelligible.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct demeure simple et oral sans devenir familier. Les verbes de mouvement topographiques sont conservés plutôt que nivelés.
