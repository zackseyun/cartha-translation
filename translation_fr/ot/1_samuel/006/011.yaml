source:
  edition: WLC
  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: fr
  text: Ils placèrent alors l’arche de Yahweh sur le chariot, ainsi que la caisse, les souris en or et les représentations de leurs tumeurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs enflures » ; peut-être « leurs hémorroïdes ».
    reason: 'Alternative lexicale : la nature précise de l’affection désignée par טְחֹרִים est incertaine.'
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Ils placèrent alors
  rationale: Le wayyiqtol de שׂים fait progresser le récit. « Alors » rend naturellement la succession narrative, et « placèrent » convient au déplacement des objets sur le chariot.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Dans ce contexte cultuel, אֲרוֹן désigne l’arche. Le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: אֶל הָעֲגָלָה
  choice: sur le chariot
  rationale: Avec ce véhicule, la préposition אֶל exprime ici le mouvement vers la surface où les objets sont déposés ; « sur le chariot » est l’expression française naturelle.
- source_word: הָאַרְגַּז
  choice: la caisse
  rationale: Le mot désigne le contenant des objets offerts. « Caisse » est clair et actuel, tout en le distinguant de l’« arche ».
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: les souris en or
  rationale: Le syntagme signifie littéralement « les souris d’or ». « En or » indique sans ambiguïté la matière des représentations.
- source_word: צַלְמֵי
  choice: les représentations de
  rationale: צֶלֶם désigne une image ou une forme reproduisant quelque chose. « Représentations » convient à ces objets façonnés et évite de suggérer de simples images planes.
- source_word: טְחֹרֵיהֶם
  choice: leurs tumeurs
  rationale: Le terme désigne les affections évoquées dans le récit, mais son référent médical précis reste discuté. « Tumeurs » garde un sens assez large ; les autres possibilités sont signalées en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahweh » conserve le caractère de nom propre sans lui substituer un titre.
- issue: Identification médicale de טְחֹרֵיהֶם
  choice: leurs tumeurs
  alternative: leurs enflures ; leurs hémorroïdes
  rationale: Le contexte décrit une plaie corporelle, mais ne permet pas d’en fixer avec certitude la nature exacte. Le texte principal reste général et la note préserve les lectures possibles.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, avec une syntaxe fluide, tout en conservant les termes cultuels et l’ambiguïté médicale du texte source.
