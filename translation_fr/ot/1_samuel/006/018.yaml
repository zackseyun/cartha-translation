  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: fr
  text: Les souris en or étaient aussi nombreuses que toutes les villes des Philistins relevant des cinq gouverneurs, depuis les villes fortifiées jusqu’aux villages sans murailles, et jusqu’à Grand-Abel[a], où ils avaient déposé l’arche de Yahweh. Ce lieu se trouve encore aujourd’hui dans le champ de Josué de Beth-Shémesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la grande pierre ». Le texte hébreu peut être compris comme le nom de lieu « Grand-Abel »; une variante ancienne permet la lecture « la grande pierre », sur laquelle l’arche aurait été déposée.
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: les souris en or
  rationale: עַכְבָּר peut désigner une souris ou un rat. « Souris » est le rendu traditionnel et naturel ici; « en or » exprime clairement la matière des représentations.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: étaient aussi nombreuses que toutes les villes des Philistins
  rationale: מִסְפַּר indique ici une correspondance numérique. Cette formulation française restitue naturellement l’idée qu’il y avait une souris pour chaque ville.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: relevant des cinq gouverneurs
  rationale: סְרָנִים est le titre propre aux principaux dirigeants philistins. « Gouverneurs » est clair en français moderne, tandis que « relevant de » exprime le rapport entre les villes et ces dirigeants.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: depuis les villes fortifiées jusqu’aux villages sans murailles
  rationale: L’expression englobe tout l’éventail des localités et maintient le contraste entre les places défendues et les villages ouverts.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: La grande pierre
  rationale: Le texte consonantique massorétique peut se lire comme le nom de lieu « Grand-Abel », mais la proposition relative qui suit, selon laquelle l’arche y fut déposée, favorise contextuellement la lecture « grande pierre », attestée par une ancienne variante textuelle. L’ambiguïté est signalée en note.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: sur laquelle ils déposèrent l’arche de Yahweh
  rationale: הִנִּיחוּ décrit l’action de poser ou déposer quelque chose. « Arche » est le terme français courant et digne pour אֲרוֹן dans ce contexte.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: se trouve encore aujourd’hui
  rationale: L’idiome affirme que le repère subsistait à l’époque du narrateur; l’ajout du verbe nécessaire en français rend ce sens explicite sans le développer.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: dans le champ de Josué, l’homme de Beth-Shémesh
  rationale: בֵּית הַשִּׁמְשִׁי est un gentilé désignant un habitant de Beth-Shémesh. « L’homme de Beth-Shémesh » est plus immédiatement compréhensible que le gentilé rare « Beth-Shémite ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom divin personnel au lieu de le remplacer par un titre.
- issue: Identification d’אָבֵל הַגְּדוֹלָה
  choice: la grande pierre
  alternative: Grand-Abel
  rationale: La lecture principale suit le contexte immédiat, où cet élément sert de support à l’arche, tout en conservant en note la lecture littérale possible du texte massorétique comme nom de lieu.
translation_notes:
  register: Français international moderne, narratif et digne. La première proposition transforme avec mesure la construction nominale hébraïque en comparaison numérique naturelle. Les noms propres suivent des formes françaises transparentes, avec « Beth-Shémesh » plutôt qu’un gentilé peu connu.
