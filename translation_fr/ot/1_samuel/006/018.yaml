revisions:
- from: Les souris en or étaient aussi nombreuses que toutes les villes des Philistins relevant des cinq gouverneurs, depuis les villes fortifiées jusqu’aux villages sans murailles. La grande pierre[a], sur laquelle ils déposèrent l’arche de Yahweh, se trouve encore aujourd’hui dans le champ de Josué, l’homme de Beth-Shémesh.
  to: Les souris en or étaient aussi nombreuses que toutes les villes des Philistins relevant des cinq gouverneurs, depuis les villes fortifiées jusqu’aux villages sans murailles, et jusqu’à Grand-Abel[a], où ils avaient déposé l’arche de Yahweh. Ce lieu se trouve encore aujourd’hui dans le champ de Josué de Beth-Shémesh.
  rationale: La correction est nécessaire pour faire suivre au texte principal la leçon du WLC tout en documentant la lecture alternative ancienne qui explique la tradition de « la grande pierre ». La phrase est ajustée avec un relatif locatif (« où »), approprié à un toponyme, et « Josué de Beth-Shémesh » rend naturellement le gentilé hébreu.
  reviewer_model: gpt-5.6-terra
