source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: fr
  text: 'Alors Samuel dit à toute la maison d’Israël : « Si vous revenez à Yahweh de tout votre cœur, ôtez du milieu de vous les dieux étrangers et les Astartés[a], orientez votre cœur vers Yahweh[b] et servez-le, lui seul. Alors il vous délivrera du pouvoir des Philistins[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pluriel hébreu peut désigner des manifestations, des représentations ou des formes cultuelles associées à la déesse Astarté.
    reason: Note culturelle et précision sur un pluriel inhabituel.
  - marker: b
    text: 'Ou : « disposez fermement votre cœur pour Yahweh » ; le verbe hébreu peut évoquer le fait d’établir, de préparer ou de diriger son cœur.'
    reason: Préservation de l’étendue sémantique de כּוּן.
  - marker: c
    text: 'Littéralement : « de la main des Philistins », expression qui désigne leur pouvoir ou leur domination.'
    reason: Explication d’un idiome hébreu rendu naturellement dans le texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Samuel dit
  rationale: Le waw narratif fait progresser le récit ; « Alors » restitue naturellement cette succession en français.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: Cette formulation conserve l’image collective et familiale de l’hébreu tout en restant compréhensible en français.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: Si vous revenez à Yahweh de tout votre cœur
  rationale: « Revenez » exprime le retour à la fidélité d’alliance ; « de tout votre cœur » garde l’idée d’un engagement entier.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement afin de préserver le nom d’alliance présent dans le texte hébreu.
- source_word: הָסִירוּ ... מִתּוֹכְכֶם
  choice: ôtez du milieu de vous
  rationale: L’impératif demande une élimination effective de la communauté ; cette tournure demeure naturelle et concrète.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: les dieux étrangers
  rationale: L’expression désigne des divinités étrangères à la fidélité due à Yahweh, et non simplement des dieux inhabituels.
- source_word: וְהָעַשְׁתָּרֹת
  choice: et les Astartés
  rationale: Le pluriel français conserve le pluriel hébreu tout en employant la forme du nom connue en français ; une note précise sa portée culturelle possible.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: orientez votre cœur vers Yahweh
  rationale: כּוּן peut signifier établir, disposer ou diriger fermement. « Orientez » rend l’engagement volontaire sans imposer une interprétation plus étroite.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: et servez-le, lui seul
  rationale: « Servir » conserve la portée large de עבד, qui comprend le culte, l’obéissance et l’allégeance exclusive.
- source_word: וְיַצֵּל אֶתְכֶם
  choice: Alors il vous délivrera
  rationale: Le futur exprime ici le résultat promis à la suite des impératifs ; « Alors » explicite sobrement ce lien logique.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: du pouvoir des Philistins
  rationale: Littéralement « de la main des Philistins » ; le français « du pouvoir » communique clairement l’idiome de domination.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Nature du retour exprimé par שָׁבִים
  choice: revenez à Yahweh
  alternative: retournez-vous vers Yahweh
  rationale: « Revenir » conserve l’idée de retour à la fidélité envers Yahweh sans développer le terme en une formulation doctrinale plus précise que l’hébreu.
- issue: Portée de עבד
  choice: servez-le, lui seul
  alternative: adorez-le, lui seul
  rationale: « Servir » inclut l’adoration mais ne réduit pas l’exigence à l’activité cultuelle ; il maintient l’idée plus large d’allégeance et d’obéissance.
- issue: Rapport entre les commandements et la délivrance
  choice: Alors il vous délivrera
  alternative: afin qu’il vous délivre
  rationale: La forme hébraïque permet de comprendre la délivrance comme le résultat attendu ou promis. Le futur avec « Alors » préserve ce rapport sans en faire une formule mécanique de mérite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère solennel de l’exhortation, tandis que « du pouvoir des Philistins » évite un calque moins naturel. Les répétitions de « cœur » et de « Yahweh » sont maintenues parce qu’elles structurent l’appel à une fidélité entière et exclusive.
