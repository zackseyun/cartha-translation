  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: fr
  text: Samuel prit un agneau encore nourri au lait[a] et l’offrit tout entier en holocauste à Yahweh. Samuel cria vers Yahweh en faveur d’Israël, et Yahweh lui répondit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « un agneau de lait ». L’expression hébraïque désigne un agneau encore alimenté au lait.'
    reason: Précision lexicale sur טְלֵה חָלָב et signalement d’une formulation française plus brève mais potentiellement moins transparente.
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: un agneau encore nourri au lait
  rationale: טְלֶה désigne un jeune ovin et חָלָב renvoie au lait. Cette formulation naturelle précise que l’agneau était encore alimenté au lait, tandis que « un » rend אֶחָד.
- source_word: וַיַּעֲלֵה
  choice: l’offrit
  rationale: Le hifil de עלה est ici le verbe sacrificiel usuel. « Offrit » exprime naturellement l’acte rituel en français sans imposer l’image étymologique de la montée.
- source_word: עוֹלָה כָּלִיל
  choice: tout entier en holocauste
  rationale: עוֹלָה désigne une offrande entièrement brûlée, traditionnellement appelée « holocauste » dans le vocabulaire biblique français; כָּלִיל souligne que la victime est offerte dans son intégralité.
- source_word: וַיִּזְעַק
  choice: cria vers
  rationale: זעק exprime un appel pressant au secours. « Cria vers » en conserve l’intensité sans remplacer le terme par le plus interprétatif « pria ».
- source_word: בְּעַד יִשְׂרָאֵל
  choice: en faveur d’Israël
  rationale: בְּעַד indique que Samuel intervient pour Israël. « En faveur de » rend cette dimension représentative sans préciser au-delà du texte le contenu de son appel.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: Yahweh lui répondit
  rationale: Le suffixe pronominal désigne Samuel comme destinataire de la réponse; l’ordre français conserve clairement Yahweh comme sujet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. « Holocauste » est maintenu comme terme sacrificiel biblique établi; « tout entier » explicite כָּלִיל. La répétition de « Yahweh » et de « Samuel » suit la structure insistante de l’hébreu.
