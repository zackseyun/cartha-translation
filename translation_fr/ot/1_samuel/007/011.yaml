  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִן הַ/מִּצְפָּ֔ה וַֽ/יִּרְדְּפ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יַּכּ֕וּ/ם עַד מִ/תַּ֖חַת לְ/בֵ֥ית כָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: fr
  text: Alors les hommes d’Israël sortirent de Mitspa, poursuivirent les Philistins et les frappèrent[a] jusqu’en contrebas de Beth-Kar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les battirent ». Le verbe hébreu peut désigner les coups portés au combat et, par extension, la défaite infligée.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « au-dessous de Beth-Kar », ce qui indique probablement un endroit moins élevé que cette localité.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Le qal narratif de יצא exprime simplement le fait de sortir d’un lieu; « sortirent » est naturel et fidèle au mouvement depuis Mitspa.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Cette traduction conserve la formulation masculine explicite du texte, qui désigne ici les combattants d’Israël.
- source_word: מִן הַמִּצְפָּה
  choice: de Mitspa
  rationale: Mitspa est la forme française traditionnelle et reconnaissable de ce nom de lieu hébreu.
- source_word: וַיִּרְדְּפוּ
  choice: poursuivirent
  rationale: Dans ce contexte militaire, רדף désigne une poursuite; le verbe français est précis et idiomatique.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Il s’agit de l’ethnonyme français courant.
- source_word: וַיַּכּוּם
  choice: les battirent
  rationale: נכה peut évoquer les coups portés aussi bien que la défaite infligée au combat. « Les battirent » convient au contexte militaire sans affirmer explicitement qu’ils les tuèrent tous.
- source_word: עַד
  choice: jusqu’en
  rationale: Avec une indication de lieu, עַד marque ici la limite géographique de la poursuite.
- source_word: מִתַּחַת
  choice: en contrebas de
  rationale: L’expression indique vraisemblablement un point situé plus bas que Beth-Kar; « en contrebas de » rend clairement ce rapport topographique.
- source_word: לְבֵית כָּר
  choice: Beth-Kar
  rationale: Le nom propre du lieu est translittéré plutôt que traduit.
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. Le passé simple convient au récit biblique écrit. La formulation conserve les hommes comme combattants explicitement désignés et rend la relation topographique sans surinterpréter l’emplacement exact.
