  text: וְ/הָלַ֗ךְ מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/סָבַב֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּ֖ל וְ/הַ/מִּצְפָּ֑ה וְ/שָׁפַט֙ אֶת יִשְׂרָאֵ֔ל אֵ֥ת כָּל הַ/מְּקוֹמ֖וֹת הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: fr
  text: Chaque année, il faisait une tournée, passant par Béthel, Guilgal et Mitspa, et il jugeait Israël dans tous ces lieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: il faisait une tournée
  rationale: Le qatal, associé à l’expression de récurrence annuelle, décrit ici l’habitude de Samuel plutôt qu’un déplacement unique.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: Chaque année
  rationale: Cette expression idiomatique indique une répétition annuelle régulière; « Chaque année » est naturel et précis en français moderne.
- source_word: וְסָבַב
  choice: faisait une tournée, passant par
  rationale: Le verbe évoque un parcours régulier entre plusieurs villes; cette formulation restitue l’idée d’un circuit établi sans suggérer qu’il encerclait les lieux.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: הַגִּלְגָּל
  choice: Guilgal
  rationale: Transcription française courante du nom de lieu.
- source_word: הַמִּצְפָּה
  choice: Mitspa
  rationale: Transcription française courante du nom de lieu biblique.
- source_word: וְשָׁפַט
  choice: il jugeait
  rationale: Le verbe conserve le sens judiciaire de שׁפט tout en laissant au contexte sa portée plus large de direction d’Israël.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Désigne le peuple d’Israël sur lequel Samuel exerçait sa fonction de juge.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: dans tous ces lieux
  rationale: Malgré la particule אֵת, le groupe fonctionne ici comme une indication des lieux où Samuel jugeait Israël.
