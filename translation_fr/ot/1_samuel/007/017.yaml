base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: fr
  text: Ensuite, il revenait à Rama[a], car c’est là qu’était sa maison, et c’est là qu’il jugeait Israël. Il y construisit un autel à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Et son retour était vers Rama. »'
    reason: La traduction principale verbalise le nom תְּשׁוּבָה afin d’exprimer naturellement en français le retour habituel de Samuel après sa tournée. La note conserve le nom « retour », le waw initial et l’idée directionnelle du hé directif.
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: Puis il revenait
  rationale: Le nom signifie littéralement « son retour ». Dans le contexte de la tournée régulière décrite au verset précédent, la verbalisation à l’imparfait rend naturellement l’action habituelle, tandis que « Puis » marque la continuité narrative.
- source_word: הָרָמָתָה
  choice: à Rama
  rationale: Le hé directif attaché au nom de lieu exprime le mouvement vers Rama ; le français emploie naturellement « à Rama » avec le verbe revenir.
- source_word: כִּי שָׁם בֵּיתוֹ
  choice: car c’est là qu’était sa maison
  rationale: כִּי introduit ici la raison du retour. Cette formulation conserve le concret de בֵּיתוֹ, « sa maison », et met en relief שָׁם, « là ».
- source_word: וְשָׁם שָׁפַט אֶת־יִשְׂרָאֵל
  choice: et c’est là qu’il jugeait Israël
  rationale: « Juger Israël » conserve le rôle institutionnel de Samuel sans le réduire à l’exercice judiciaire. La reprise de « c’est là » reflète la répétition structurante de שָׁם.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Il y construisit un autel
  rationale: Le passé simple fait avancer le récit et distingue cette construction des activités habituelles exprimées à l’imparfait. « y » reprend naturellement שָׁם sans ajouter une valeur comme « aussi », absente du texte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique que l’autel est destiné ou consacré à Yahweh ; « à » convient à l’expression française « construire un autel à ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le caractère de nom propre sans substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait exprime les habitudes de Samuel ; le passé simple marque la construction de l’autel comme événement narratif. La répétition hébraïque de « là » est préservée par deux tournures françaises naturelles.
