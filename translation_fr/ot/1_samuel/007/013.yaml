source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: fr
  text: Ainsi, les Philistins furent soumis et ne pénétrèrent plus sur le territoire d’Israël. La main de Yahweh fut contre les Philistins[a] pendant toute la vie de Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la main de Yahweh fut sur les Philistins ». Cette expression désigne ici la puissance de Yahweh agissant contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: furent soumis
  rationale: Le nifal de כנע exprime ici le fait d’être abaissés et placés sous domination après une défaite. « Furent soumis » convient au contexte militaire et conserve la valeur passive du verbe.
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: ne vinrent plus
  rationale: La construction יסף + עוד indique qu’une action ne se répète ou ne se poursuit plus. Cette formulation est concise et naturelle en français.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: sur le territoire d’Israël
  rationale: גְּבוּל peut désigner une frontière ou le territoire qu’elle délimite. Le contexte concerne la pénétration en terre israélite plutôt que le simple franchissement d’une ligne frontalière.
- source_word: וַתְּהִי יַד יְהוָה
  choice: La main de Yahweh fut
  rationale: La métaphore hébraïque de la « main » est conservée afin de représenter l’action puissante de Dieu sans la réduire à une paraphrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בַּפְּלִשְׁתִּים
  choice: contre les Philistins
  rationale: La préposition peut littéralement être rendue par « sur », mais le contexte montre que la puissance de Yahweh agit en opposition aux Philistins.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: pendant toute la vie de Samuel
  rationale: Cette expression française naturelle communique la durée indiquée par l’hébreu « tous les jours de Samuel ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Sens de l’expression « la main de Yahweh fut sur les Philistins »
  choice: contre les Philistins
  alternative: sur les Philistins
  rationale: Dans ce contexte de défaite et de soumission militaire, l’expression désigne une action divine hostile. « Contre » en rend clairement la force, tandis qu’une note conserve la formulation plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore biblique de la main divine est conservée, tandis que la valeur hostile de la préposition est explicitée dans le texte et documentée en note.
