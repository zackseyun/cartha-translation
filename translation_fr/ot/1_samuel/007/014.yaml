  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: fr
  text: Les villes que les Philistins avaient prises à Israël revinrent à Israël, depuis Éqrôn jusqu’à Gath. Israël arracha leur territoire au pouvoir des Philistins. Et il y eut la paix entre Israël et les Amorites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Cananéens », si le terme « Amorites » désigne ici, dans un sens large, les peuples du pays.'
    reason: Préserver l’interprétation possible de l’ethnonyme comme appellation collective plus large.
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: revinrent
  rationale: Le verbe שׁוב a pour sujet « les villes » et indique ici leur retour sous l’autorité d’Israël. « Revinrent à Israël » reste proche de la syntaxe hébraïque tout en étant naturel en français.
- source_word: הֶעָרִים
  choice: les villes
  rationale: Rendu usuel de עָרִים, adapté au contexte de centres urbains et de contrôle territorial.
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים מֵאֵת יִשְׂרָאֵל
  choice: que les Philistins avaient prises à Israël
  rationale: Le plus-que-parfait marque clairement que la prise des villes précède leur retour à Israël.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: depuis Éqrôn jusqu’à Gath
  rationale: Conserve explicitement les deux bornes géographiques exprimées en hébreu.
- source_word: וְאֶת גְּבוּלָן
  choice: leur territoire
  rationale: Le suffixe féminin pluriel renvoie grammaticalement aux villes. גְּבוּל peut désigner une frontière ou un territoire; le contexte de reconquête favorise « territoire ».
- source_word: הִצִּיל
  choice: arracha
  rationale: Le hiphil de נצל exprime le fait de soustraire ou délivrer quelque chose d’une puissance hostile. « Arracha… au pouvoir » rend ici la vigueur du verbe sans suggérer que le territoire est une personne secourue.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: au pouvoir des Philistins
  rationale: Littéralement « de la main des Philistins »; l’expression française choisie transmet clairement l’idée de domination ou de contrôle.
- source_word: וַיְהִי שָׁלוֹם
  choice: Et il y eut la paix
  rationale: Rendu direct de la proposition existentielle, dans un registre narratif digne et courant.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le texte massorétique emploie précisément l’ethnonyme « l’Amorite », collectif singulier rendu naturellement au pluriel en français.
theological_decisions:
- issue: Portée de l’ethnonyme הָאֱמֹרִי
  choice: les Amorites
  alternative: les Cananéens
  rationale: Le texte hébreu nomme les Amorites. Certains comprennent toutefois ce terme comme une désignation plus large des populations cananéennes du pays; cette possibilité est signalée en note sans remplacer le terme source dans le texte principal.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve la répétition d’« Israël », les bornes géographiques et le référent grammatical de « leur territoire », qui renvoie aux villes. Le marqueur [a] est placé immédiatement après « Amorites », objet de la note.
