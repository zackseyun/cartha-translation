  text: וַ/יָּסִ֨ירוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּרֹ֑ת וַ/יַּעַבְד֥וּ אֶת יְהוָ֖ה לְ/בַדּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: fr
  text: Les Israélites retirèrent donc les Baals et les Astartés, et ils servirent Yahweh seul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et ils adorèrent uniquement Yahweh ». Le verbe hébreu peut désigner à la fois le service et le culte lorsque Dieu en est l’objet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: retirèrent
  rationale: Le hifil de סוּר signifie ici enlever ou écarter. « Retirèrent » exprime clairement l’abandon concret des objets cultuels.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Bien que l’expression signifie littéralement « les fils d’Israël », « les Israélites » est l’ethnonyme français naturel et inclut ici l’ensemble du peuple.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel hébreu est conservé sans décider s’il désigne des manifestations locales de Baal ou leurs représentations cultuelles.
- source_word: הָעַשְׁתָּרֹת
  choice: les Astartés
  rationale: « Astartés » est la forme française reconnaissable qui préserve le pluriel hébreu et la référence cultuelle précise.
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: Quand Dieu est l’objet, עבד peut recouvrir le service et le culte. « Servirent » garde le sens lexical large d’allégeance tout en laissant entendre la dimension cultuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: Le mot marque ici l’exclusivité de leur attachement et de leur service envers Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom personnel divin; sa translittération préserve cette donnée du texte source.
- issue: Sens de עבד lorsque Yahweh est l’objet
  choice: ils servirent Yahweh seul
  alternative: ils adorèrent uniquement Yahweh
  rationale: « Servir » rend directement le verbe et évoque l’allégeance globale; « adorer » explicite légitimement sa dimension cultuelle sans épuiser son sens.
translation_notes:
  register: Français international moderne, sobre et digne. L’ethnonyme naturel « les Israélites » évite le calque peu idiomatique « les fils d’Israël ». Les pluriels cultuels sont conservés.
