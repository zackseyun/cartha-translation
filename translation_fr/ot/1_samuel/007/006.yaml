  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: fr
  text: 'Ils se rassemblèrent à Mitspa[a], puisèrent de l’eau et la répandirent devant Yahweh[b]. Ce jour-là, ils jeûnèrent et dirent : « Nous avons péché contre Yahweh. » Samuel jugea les Israélites[c] à Mitspa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « vers Mitspa » ; à cette première occurrence, la forme hébraïque comporte une terminaison indiquant la direction.
    reason: lexical_alternative
  - marker: b
    text: Le fait de répandre de l’eau devant Yahweh peut être compris comme un rite de repentance ou de lamentation, mais le texte n’en explique pas explicitement le sens.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: ils se rassemblèrent
  rationale: 'Le niphal de קבץ a ici un sens intransitif ou réfléchi : le peuple se réunit. « Se rassemblèrent » est naturel et ne précise pas d’agent extérieur.'
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  choice: à Mitspa
  rationale: La première forme comporte un suffixe directionnel, tandis que la dernière signifie « à/dans Mitspa ». En français, « se rassembler à Mitspa » exprime naturellement le lieu d’arrivée; une note signale la nuance directionnelle.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: puisèrent de l’eau
  rationale: שׁאב désigne couramment l’action de puiser de l’eau; cette formulation est directe et idiomatique.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: la répandirent devant Yahweh
  rationale: שׁפך signifie « verser, répandre ». Le pronom « la » reprend naturellement « l’eau », et לִפְנֵי est rendu par « devant ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin conserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: Ce jour-là, ils jeûnèrent
  rationale: צום désigne sans ambiguïté le jeûne; l’antéposition de « Ce jour-là » donne une phrase française fluide tout en conservant l’indication temporelle.
- source_word: חָטָאנוּ לַיהוָה
  choice: Nous avons péché contre Yahweh
  rationale: חטא avec ל exprime ici une faute commise contre quelqu’un. Le passé composé convient à une confession d’actes passés dont la culpabilité demeure présente.
- source_word: וַיִּשְׁפֹּט
  choice: jugea
  rationale: שׁפט peut couvrir l’exercice de la justice et du gouvernement. « Jugea » préserve le terme biblique sans le réduire explicitement à une seule fonction.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais désigne collectivement le peuple. « Les Israélites » est précis, actuel et inclusif dans ce contexte.
theological_decisions:
- issue: Sens du rite consistant à répandre de l’eau
  choice: Conserver l’action littérale sans en expliquer le symbolisme dans le corps du texte.
  alternative: L’interpréter comme un signe de repentance, une libation ou un geste de lamentation.
  rationale: Le récit rapporte le geste sans en donner l’interprétation. La traduction évite donc de trancher une question que le texte laisse ouverte; la note ne présente que des possibilités.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ou Jéhovah
  rationale: « Yahweh » conserve dans le texte français le caractère de nom propre du tétragramme.
- issue: Portée de la fonction de Samuel exprimée par שׁפט
  choice: Samuel « jugea » les Israélites.
  alternative: Samuel les gouverna ou leur administra la justice.
  rationale: Le verbe hébreu peut englober plusieurs dimensions de la direction exercée par Samuel. Le terme « jugea » en maintient l’étendue et la tension sans choisir une paraphrase plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsmes lexicaux. « Mitspa » suit une graphie française courante; « Yahweh » conserve le nom divin. Les formulations restent proches de l’hébreu tout en étant naturelles à la lecture.
