lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: jugea
  rationale: Le verbe שׁפט peut désigner l’exercice de la fonction de juge, avec des dimensions judiciaires et gouvernementales. « Jugea » préserve cette nuance propre au contexte du livre sans réduire le rôle de Samuel à la seule direction politique.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le marqueur d’objet direct אֶת ne se traduit pas; le nom propre est rendu par sa forme française usuelle.
- source_word: כֹּל יְמֵי
  choice: tous les jours de
  rationale: Cette formulation conserve l’expression temporelle hébraïque tout en restant claire et naturelle en français.
- source_word: חַיָּיו
  choice: sa vie
  rationale: L’expression hébraïque désigne toute la durée de sa vie; « sa vie » est la formulation française la plus directe.
