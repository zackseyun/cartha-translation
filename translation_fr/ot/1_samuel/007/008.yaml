  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: fr
  text: 'Les Israélites dirent à Samuel : « Ne cesse pas de crier vers Yahweh notre Dieu en notre faveur[a], afin qu’il nous sauve de la main des Philistins. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie l’image de ne pas garder le silence. Dans ce contexte, il s’agit de ne pas cesser de crier vers Yahweh pour eux.
    reason: La tournure hébraïque est inhabituelle en français. La note préserve l’image du silence sans lui attribuer à tort un sens spatial.
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: Cette expression française naturelle rend l’appellation collective hébraïque, littéralement « les fils d’Israël », sans donner à tort l’impression qu’il s’agit uniquement d’hommes.
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: Ne cesse pas de crier … en notre faveur
  rationale: Littéralement, l’hébreu demande à Samuel de ne pas « garder le silence » au point de s’abstenir de crier. En français, « ne cesse pas de crier » exprime naturellement l’interdiction de suspendre cette intercession; la note conserve l’image littérale.
- source_word: זעק
  choice: crier vers
  rationale: Le verbe désigne un appel pressant au secours; « crier vers » conserve sa force dans le contexte de la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le possessif et l’appel d’Israël à son Dieu.
- source_word: וְיֹשִׁעֵנוּ
  choice: afin qu’il nous sauve
  rationale: Le contexte permet de comprendre la proposition comme exprimant le but attendu de l’intercession, tout en évitant d’en faire une certitude formulée par le temps verbal.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: de la main des Philistins
  rationale: Conserve l’image hébraïque de la main comme puissance ou emprise, image claire en français biblique courant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur de וְיֹשִׁעֵנוּ
  choice: afin qu’il nous sauve
  alternative: et qu’il nous sauve
  rationale: La construction peut être entendue comme but ou résultat souhaité. « Afin que » rend cette relation sans affirmer davantage que l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Les Israélites » évite le calque ambigu « les fils d’Israël ». « Crier vers » garde l’intensité de l’appel, tandis que la note documente la formulation hébraïque littérale.
