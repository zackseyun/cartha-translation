base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: fr
  text: 'Alors Samuel prit une pierre et la plaça entre Mitspa et Shen. Il l’appela Ében-Ézer[a], car il dit : « Jusqu’ici, l’Éternel nous a secourus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ében-Ézer signifie « pierre du secours » ou « pierre de l’aide » en hébreu.
    reason: Le nom commémoratif porte le sens de la déclaration qui suit, mais ce jeu de sens n’est pas transparent en français.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: une pierre
  rationale: En français naturel, l’article indéfini exprime suffisamment l’unité; « une seule pierre » introduirait une insistance absente du contexte.
- source_word: וַיָּשֶׂם
  choice: la dressa
  rationale: Pour une pierre commémorative, « dresser » rend naturellement l’idée de la placer comme monument, sans surcharger le texte.
- source_word: אֶבֶן הָעָזֶר
  choice: Ében-Ézer
  rationale: Le nom traditionnel est conservé sous une translittération française; sa signification est donnée en note.
- source_word: עַד הֵנָּה
  choice: Jusqu’ici
  rationale: Expression concise qui conserve la portée spatiale ou temporelle possible de l’hébreu.
- source_word: עֲזָרָנוּ
  choice: nous a secourus
  rationale: « Secourir » exprime une aide décisive dans le contexte de la délivrance militaire.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel du tétragramme, distinct du titre אֲדֹנָי et immédiatement reconnaissable par un large lectorat.
- source_word: הַמִּצְפָּה
  choice: Mitspa
  rationale: Forme française traditionnelle du toponyme.
- source_word: הַשֵּׁן
  choice: Shen
  rationale: Translittération sobre du toponyme hébreu, dont l’identification demeure incertaine.
theological_decisions:
- issue: Portée de « Jusqu’ici »
  choice: Conserver la formule sans explicitation
  alternative: « Jusqu’à ce lieu » ou « jusqu’à présent »
  rationale: L’hébreu peut évoquer le lieu atteint aussi bien que le moment présent; la formulation française préserve cette tension.
- issue: Nature de l’aide divine
  choice: « nous a secourus »
  alternative: « nous a aidés »
  rationale: Le contexte décrit une délivrance concrète accordée par Dieu, sans préciser davantage le mode théologique de son action.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe simple, avec maintien des noms propres bibliques usuels et d’une formulation qui laisse ouverte la nuance spatiale ou temporelle de עַד הֵנָּה.
