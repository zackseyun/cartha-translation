  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: fr
  text: 'Alors Samuel dit : « Rassemblez tout Israël à Mitspa, et je prierai Yahweh en votre faveur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » en restitue naturellement la succession en français moderne.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle du nom propre.
- source_word: קִבְצוּ
  choice: Rassemblez
  rationale: L’impératif pluriel de קבץ convoque le peuple en un même lieu ; « Rassemblez » est direct et idiomatique.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette formulation conserve le sens collectif et national de l’expression hébraïque.
- source_word: הַמִּצְפָּתָה
  choice: à Mitspa
  rationale: Le ה directionnel indique un mouvement vers le lieu ; en français, « à Mitspa » exprime naturellement cette destination. « Mitspa » est la forme française traditionnelle du toponyme.
- source_word: וְאֶתְפַּלֵּל
  choice: et je prierai
  rationale: L’imparfait hébreu à la première personne après l’impératif exprime l’action que Samuel accomplira ensuite.
- source_word: בַּעַדְכֶם
  choice: en votre faveur
  rationale: Cette expression fait ressortir la nuance d’intercession portée par בְּעַד, sans ajouter d’idée étrangère au texte.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Le complément de « prier » se construit directement en français, sans rendre אֶל séparément. Le nom divin יהוה est translittéré « Yahweh », conformément à sa valeur de nom propre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre ; « le Seigneur » demeure une tradition de traduction possible, mais elle ne reflète pas aussi directement la forme du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’ordre narratif, le caractère impératif de l’appel et la nuance d’intercession, tout en évitant une syntaxe calquée sur l’hébreu.
