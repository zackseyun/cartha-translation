source:
  edition: WLC
  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: fr
  text: Pendant que Samuel offrait l’holocauste, les Philistins s’approchèrent pour combattre Israël. Mais, ce jour-là, Yahweh fit retentir un puissant tonnerre[a] contre les Philistins et les plongea dans la confusion. Ils furent battus devant Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec un grand son ». On peut aussi traduire : « avec un grand bruit » ou « d’un tonnerre formidable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה הָעוֹלָה
  choice: offrait l’holocauste
  rationale: Le participe hiphil exprime l’action en cours de présenter le sacrifice; « offrait » est naturel en français et conserve cette simultanéité. עֹלָה désigne l’holocauste, sacrifice entièrement consumé.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: s’approchèrent pour combattre Israël
  rationale: Cette formulation rend naturellement le mouvement d’approche hostile et la finalité militaire de l’expression hébraïque.
- source_word: וַיַּרְעֵם
  choice: fit retentir un puissant tonnerre
  rationale: Le verbe רעם désigne le tonnerre; la tournure causative française convient avec Yahweh pour sujet et s’accorde avec le complément בְּקוֹל גָּדוֹל.
- source_word: בְּקוֹל גָּדוֹל
  choice: un puissant tonnerre
  rationale: Littéralement « avec un grand son ». Dans ce contexte, « puissant tonnerre » donne un français clair sans suggérer à tort des paroles prononcées; la note conserve l’expression littérale et son amplitude lexicale.
- source_word: וַיְהֻמֵּם
  choice: les plongea dans la confusion
  rationale: Le hiphil de המם décrit l’action de semer confusion, panique ou désarroi dans les rangs ennemis; ce choix maintient la distinction avec la défaite exprimée ensuite.
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: Ils furent battus devant Israël
  rationale: Le niphal de נגף indique ici une défaite militaire. « Devant Israël » conserve l’idiome hébreu sans préciser davantage l’agent ou l’étendue des pertes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » le présente comme nom propre et évite de le substituer par un titre.
- issue: Nature du phénomène divin exprimé par רעם et קוֹל
  choice: un puissant tonnerre
  alternative: un grand bruit / un grand son
  rationale: Le verbe désigne clairement l’action de tonner, tandis que קוֹל גָּדוֹל en intensifie la manifestation. La note préserve toutefois le sens littéral plus large du nom קוֹל.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait marque l’action sacrificielle en cours, suivie du passé simple pour les événements successifs. Le vocabulaire militaire reste clair sans amplifier la défaite en massacre.
