  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: fr
  text: Alors les hommes de Kiriath-Yéarim vinrent et montèrent l’arche de Yahvé[a]. Ils l’amenèrent dans la maison d’Abinadab, sur la colline[b], et consacrèrent Éléazar, son fils, pour garder l’arche de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici le nom divin YHWH, rendu par « Yahvé ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « à Guibéa », si le mot hébreu est compris comme un nom de lieu plutôt que comme le nom commun « la colline ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ אַנְשֵׁי קִרְיַת יְעָרִים
  choice: Les hommes de Kiriath-Yéarim vinrent donc
  rationale: אַנְשֵׁי désigne ici les hommes de la localité. « Vinrent donc » rend naturellement l’avancée narrative du wayyiqtol et le lien avec le contexte précédent.
- source_word: וַיַּעֲלוּ
  choice: firent monter
  rationale: Le hiphil de עלה exprime le fait de faire monter ou d’emporter vers un lieu plus élevé; « firent monter » conserve explicitement cette nuance directionnelle.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahvé
  rationale: « Arche » est le terme français consacré dans ce contexte cultuel, et « Yahvé » représente directement le nom divin YHWH.
- source_word: וַיָּבִאוּ אֹתוֹ אֶל בֵּית אֲבִינָדָב
  choice: Ils la transportèrent dans la maison d’Abinadab
  rationale: Le verbe בוא au hiphil signifie « faire venir, apporter ». « Transportèrent dans » exprime clairement le déplacement de l’arche jusqu’à l’intérieur de la maison.
- source_word: בַּגִּבְעָה
  choice: sur la colline
  rationale: Avec l’article, גִּבְעָה se comprend le plus directement comme le nom commun « la colline ». La possibilité d’un nom de lieu est conservée en note.
- source_word: וְאֶת אֶלְעָזָר בְּנוֹ קִדְּשׁוּ
  choice: et consacrèrent son fils Éléazar
  rationale: קדשׁ indique une mise à part pour une fonction sacrée. Le possessif renvoie le plus naturellement à Abinadab, dernier homme nommé.
- source_word: לִשְׁמֹר
  choice: pour veiller sur
  rationale: שׁמר peut signifier garder, surveiller ou veiller sur. Cette formulation française exprime à la fois la garde et la responsabilité confiée à Éléazar.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: « Yahvé » rend le nom propre divin plutôt que de le remplacer par un titre, tout en restant une forme française largement reconnaissable. Une note signale explicitement la forme hébraïque.
- issue: Interprétation de בַּגִּבְעָה
  choice: sur la colline
  alternative: à Guibéa
  rationale: La présence de l’article favorise le sens commun « la colline », mais la vocalisation consonantique permet que le lecteur envisage un nom de lieu; l’alternative est donc conservée en note sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative reste fluide sans effacer la répétition de « l’arche de Yahvé ». « Consacrèrent » maintient la portée sacrée de la fonction, tandis que « veiller sur » rend naturellement sa dimension de garde.
