  verdict: revise
  source_fidelity: Le texte rend fidèlement la succession narrative, le déplacement ascendant de l’arche, sa destination chez Abinadab, la localisation « sur la colline », et la consécration d’Éléazar pour la garde de l’arche. La lecture alternative « Guibéa » est convenablement maintenue en note.
  naturalness: « Vinrent donc » introduit une valeur consécutive plus marquée que le simple enchaînement narratif hébreu. « Alors » est plus naturel et plus neutre. « Firent monter » est possible, mais « montèrent l’arche » est idiomatique en français tout en gardant la nuance directionnelle.
  terminology: « Arche », « Yahvé », « consacrèrent » et « garder » conviennent au registre biblique moderne et rendent les termes cultuels sans surcharge interprétative. La formulation « Éléazar, son fils » reproduit plus clairement l’apposition hébraïque et rattache naturellement « son fils » à Abinadab.
