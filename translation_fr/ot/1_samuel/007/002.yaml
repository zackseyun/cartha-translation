  source_fidelity: Le projet rend correctement la permanence de l’arche à Qiryath-Yéarim, la durée de vingt ans, « toute la maison d’Israël » et le nom Yahweh. Toutefois, « jusqu’à faire vingt ans » est peu idiomatique et brouille la proposition hébraïque « les jours devinrent nombreux, et ils furent vingt ans ». De plus, « en se tournant vers Yahweh » explicite un mouvement de retour seulement suggéré par l’expression ambiguë נהה ... אחרי.
  naturalness: « Les jours se multiplièrent jusqu’à faire vingt ans » n’est pas une formulation française naturelle. « Vingt ans passèrent » rend clairement la durée, tout en laissant la note signaler l’image hébraïque. Pour la dernière expression, « soupira après Yahweh » est une tournure française littéraire encore intelligible, plus naturelle que « se lamenter après », et elle préserve l’idée de désir sans affirmer explicitement la conversion.
  terminology: « Arche », « Qiryath-Yéarim », « maison d’Israël » et « Yahweh » sont cohérents et appropriés. « Soupirer après » est préférable ici à une paraphrase qui imposerait « se tourner vers »; la note doit conserver les possibilités de lamentation et d’orientation vers Yahweh.
