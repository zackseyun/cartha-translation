revisions:
- from: Depuis le jour où l’arche resta à Qiryath-Yéarim, les jours se multiplièrent jusqu’à faire vingt ans[a]. Toute la maison d’Israël se lamenta en se tournant vers Yahweh[b].
  to: 'Depuis le jour où l’arche resta à Qiryath-Yéarim, les jours se multiplièrent : vingt ans passèrent[a]. Alors toute la maison d’Israël soupira après Yahweh[b].'
  rationale: La révision remplace une expression temporelle maladroite par une formulation française claire et conserve l’image hébraïque en note. Elle remplace aussi « se lamenta en se tournant vers » par « soupira après », qui est une expression française recevable et garde ouverte l’ambiguïté entre plainte et désir; les autres lectures possibles sont signalées sans les imposer au texte principal.
