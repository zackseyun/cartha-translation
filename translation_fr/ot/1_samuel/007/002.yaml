base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: fr
  text: 'Depuis le jour où l’arche resta à Qiryath-Yéarim, les jours se multiplièrent : vingt ans passèrent[a]. Alors toute la maison d’Israël soupira après Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les jours devinrent nombreux, et ils furent vingt ans ».'
    reason: La note conserve l’image temporelle et la structure de l’hébreu, derrière la formulation française idiomatique.
  - marker: b
    text: 'Littéralement : « se lamenta après Yahweh ». L’expression peut évoquer la lamentation, le désir de Yahweh ou un mouvement de retour vers lui.'
    reason: La construction hébraïque associe un verbe de lamentation à « après » et son sens précis demeure ambigu.
lexical_decisions:
- source_word: שֶׁבֶת הָאָרוֹן
  choice: où l’arche resta
  rationale: L’infinitif construit de ישׁב décrit ici le maintien de l’arche dans un lieu. « Resta » est naturel en français pour un objet et conserve l’idée de durée.
- source_word: בְּקִרְיַת יְעָרִים
  choice: à Qiryath-Yéarim
  rationale: La préposition marque le lieu; « à » convient au nom d’une ville. La forme Qiryath-Yéarim suit une translittération française reconnaissable.
- source_word: וַיִּרְבּוּ הַיָּמִים וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: les jours se multiplièrent jusqu’à faire vingt ans
  rationale: Cette formulation conserve l’image hébraïque des jours qui deviennent nombreux tout en reliant naturellement en français la durée précisée, vingt ans.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: Cette traduction maintient l’expression collective et covenantale « maison d’Israël » au lieu de la réduire à « tout Israël ».
- source_word: וַיִּנָּהוּ ... אַחֲרֵי
  choice: se lamenta en se tournant vers
  rationale: נהה exprime la lamentation ou le deuil, tandis que אַחֲרֵי, littéralement « après », indique ici une orientation vers Yahweh. La formulation française garde ensemble la douleur et le mouvement vers lui sans imposer l’idée plus étroite d’un simple désir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
theological_decisions:
- issue: Nature de la réaction d’Israël dans וַיִּנָּהוּ ... אַחֲרֵי יְהוָה
  choice: Une lamentation orientée vers Yahweh, sans expliciter une repentance complète que le verset ne formule pas
  alternative: « regretta Yahweh », « aspira à retrouver Yahweh » ou « mena deuil en se tournant vers Yahweh »
  rationale: L’expression associe un verbe de lamentation à la préposition « après ». Le contexte suivant peut suggérer un retour à Yahweh, mais la traduction ne doit pas transformer cette suggestion en formule explicite de repentance.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve l’image hébraïque des jours qui se multiplient, tandis que la seconde phrase évite le calque français trompeur « se lamenter après quelqu’un ». Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
