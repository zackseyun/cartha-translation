  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: fr
  text: Quand les Philistins apprirent que les Israélites s’étaient rassemblés à Mitspa[a], les chefs des Philistins montèrent contre Israël. Quand les Israélites l’apprirent, ils eurent peur des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers Mitspa ». La forme hébraïque comporte une terminaison indiquant la direction, bien que le contexte présente les Israélites comme rassemblés sur place.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: apprirent
  rationale: Dans ce récit, שׁמע désigne le fait de recevoir une nouvelle. « Apprendre » est naturel en français et peut être répété dans les deux propositions comme en hébreu.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française usuelle du nom de ce peuple.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de la nouvelle reçue par les Philistins.
- source_word: הִתְקַבְּצוּ
  choice: s’étaient rassemblés
  rationale: Le hitpael de קבץ exprime un rassemblement; le plus-que-parfait situe naturellement celui-ci avant la nouvelle reçue.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation moderne et collective traduit naturellement l’expression hébraïque « fils d’Israël » sans suggérer que seuls les hommes sont visés.
- source_word: הַמִּצְפָּתָה
  choice: à Mitspa
  rationale: La finale directionnelle peut indiquer « vers Mitspa », mais le contexte présente le peuple comme rassemblé en ce lieu; « à Mitspa » rend le sens contextuel tout en signalant l’autre possibilité en note.
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Conserve l’image de עלה, courante pour un déplacement ou une expédition militaire, sans préciser indûment la manière de l’avancée.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: les chefs des Philistins
  rationale: סְרָנִים désigne les dirigeants politiques et militaires propres aux Philistins; « chefs » est clair et digne en français actuel.
- source_word: אֶל יִשְׂרָאֵל
  choice: contre Israël
  rationale: Dans ce contexte militaire, אֶל indique une avancée hostile; « contre » l’exprime idiomatiquement.
- source_word: וַיִּשְׁמְעוּ
  choice: l’apprirent
  rationale: Le pronom reprend implicitement la montée des chefs philistins, objet non exprimé en hébreu mais requis pour une formulation française naturelle.
- source_word: וַיִּירְאוּ
  choice: ils eurent peur
  rationale: Rend directement ירא dans une narration ponctuelle et dynamique.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: des Philistins
  rationale: Après « avoir peur », le français exprime naturellement par « de » la cause ou l’objet de la crainte porté par l’idiome hébreu מִפְּנֵי.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Israélites » est préféré au calque « fils d’Israël » pour une lecture collective naturelle. La répétition d’« apprirent » conserve celle de שׁמע. Le marqueur [a] figure dans le texte; aucune note [b] n’est ajoutée, car la variante concernant סַרְנֵי se rattache aux « chefs », et non au second verbe « apprirent ».
