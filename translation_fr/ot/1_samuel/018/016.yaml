  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: fr
  text: Mais tout Israël et Juda aimaient David, parce qu’il sortait et rentrait devant eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les faisait sortir et rentrer » ; cette expression peut indiquer qu’il les dirigeait publiquement, notamment à la guerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Mais tout
  rationale: La conjonction relie le verset par contraste à la crainte et à l’hostilité de Saül dans le contexte précédent; « mais » exprime naturellement cette valeur discursive, tandis que « tout » rend כָל.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: Israël et Juda
  rationale: La formulation conserve la distinction entre Israël et Juda sans l’expliciter davantage que l’hébreu.
- source_word: אֹהֵב אֶת דָּוִד
  choice: aimaient David
  rationale: Le participe décrit une disposition durable. Le pluriel est naturel en français avec le sujet collectif composé « tout Israël et Juda ».
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la raison de l’affection du peuple pour David.
- source_word: הוּא יוֹצֵא וָ/בָא
  choice: il sortait et rentrait
  rationale: L’imparfait rend l’activité habituelle exprimée par les participes. « Rentrer » est plus idiomatique en français que « venir » dans ce couple verbal, tout en maintenant l’image des déplacements publics de David.
- source_word: לִ/פְנֵי/הֶם
  choice: devant eux
  rationale: Cette traduction formellement proche préserve à la fois le sens spatial et la possible nuance de conduite publique ou militaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure concrète « sortait et rentrait devant eux » conserve l’ambiguïté de l’idiome hébreu; la note donne son sens possible de direction militaire sans l’imposer dans le texte principal.
