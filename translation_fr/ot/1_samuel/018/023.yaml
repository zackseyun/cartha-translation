base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: fr
  text: 'Les serviteurs de Saül dirent ces paroles à David. David répondit : « Est-ce peu de chose à vos yeux de devenir le gendre du roi[a], alors que je suis un homme pauvre et de peu d’importance ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de s’allier par mariage au roi »'
    reason: Le verbe hébreu exprime l’entrée dans une relation de parenté par mariage ; dans le contexte, cela revient pour David à devenir le gendre du roi.
lexical_decisions:
- source_word: וַיְדַבְּרוּ עַבְדֵי שָׁאוּל בְּאָזְנֵי דָוִד
  choice: Les serviteurs de Saül rapportèrent ces paroles à David
  rationale: Dans ce contexte, דבר suivi de l’expression idiomatique « aux oreilles de David » indique que les serviteurs transmettent à David les paroles précédentes. « Rapportèrent … à David » est naturel en français et conserve cette fonction narrative sans reproduire littéralement l’image des oreilles.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: Est-ce peu de chose à vos yeux
  rationale: Cette formulation française garde la question rhétorique, l’idiome évaluatif « à vos yeux » et l’idée de légèreté ou de peu d’importance portée par la racine קלל.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: devenir le gendre du roi
  rationale: Le hitpael de חתן désigne ici l’entrée dans une relation matrimoniale avec le roi par le mariage avec sa fille. La formulation explicite clairement le lien familial impliqué par le contexte.
- source_word: וְאָנֹכִי
  choice: alors que je suis
  rationale: Le waw introduit ici le contraste entre l’honneur d’une alliance avec le roi et l’humble condition que David s’attribue. « Alors que » exprime naturellement ce rapport sans imposer une causalité plus forte.
- source_word: אִישׁ רָשׁ וְנִקְלֶה
  choice: un homme pauvre et sans importance
  rationale: « Pauvre » rend directement רָשׁ. « Sans importance » exprime la faible considération sociale indiquée par נִקְלֶה, sans aller jusqu’au sens plus fort de « méprisé », et fait écho à « peu de chose ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et le contraste social sont conservés, ainsi que l’écho lexical entre « peu de chose » et « sans importance ».
