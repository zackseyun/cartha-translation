  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: fr
  text: Saül vit et reconnut que Yahweh était avec David et que Mical, fille de Saül, l’aimait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה signifie ordinairement « voir ». « Vit » préserve ici la progression entre l’observation de Saül et la compréhension qui en découle.
- source_word: וַיֵּדַע
  choice: comprit
  rationale: ידע exprime ici une connaissance acquise à partir de ce que Saül constate. En français narratif, « comprit » rend naturellement cette prise de conscience sans fusionner les deux verbes hébreux.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que Saül comprend.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: עִם דָּוִד
  choice: était avec David
  rationale: Cette formulation conserve le sens direct de présence et d’appui divins sans l’expliciter davantage.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: et que Mikal, fille de Saül
  rationale: Le second « que », absent mais sous-entendu en hébreu, est ajouté pour rendre clairement en français le second objet de la compréhension de Saül. L’apposition « fille de Saül » est naturelle et fidèle.
- source_word: אֲהֵבַתְהוּ
  choice: l’aimait
  rationale: Le participe féminin décrit un état ou une action en cours. L’imparfait français en rend naturellement la continuité dans ce récit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » préserve le nom propre divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, clair et digne. « Comprit » est plus idiomatique que « sut » dans cette séquence de prise de conscience, tandis que « vit » maintient l’étape préalable de l’observation. La graphie « Mikal » reflète directement le nom hébreu מִיכַל.
