base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: fr
  text: Le lendemain, un esprit mauvais venant de Dieu fondit sur Saül[a]. Saül se mit à prophétiser dans la maison[b], tandis que David jouait de la musique, comme il le faisait chaque jour[c]. Saül tenait sa lance à la main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit malfaisant venant de Dieu » ; littéralement, « un esprit mauvais de Dieu ».
    reason: Alternative lexicale et préservation de la tension concernant le rapport entre cet esprit et Dieu.
  - marker: b
    text: Le verbe hébreu peut signifier « prophétiser » ou décrire un comportement extatique. Dans ce contexte, il peut s’agir d’une transe ou d’un délire de type prophétique.
    reason: Le contexte autorise plusieurs nuances sans permettre de supprimer le sens prophétique du verbe.
  - marker: c
    text: L’instrument n’est pas nommé dans ce verset, bien qu’il soit précisé ailleurs dans le récit.
    reason: Évite d’introduire dans le texte principal une information absente de ce verset.
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français, qui maintient clairement la succession du récit.
- source_word: וַתִּצְלַח
  choice: fondit sur
  rationale: Avec « esprit » pour sujet, le verbe décrit une irruption soudaine et puissante. « Fondit sur » conserve cette force sans l'affaiblir en simple venue.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: un esprit mauvais venant de Dieu
  rationale: Cette formulation conserve à la fois la qualification רָעָה et le lien d'origine ou de mission exprimé par אֱלֹהִים, sans faire de la méchanceté un attribut de Dieu.
- source_word: וַיִּתְנַבֵּא
  choice: prophétisait
  rationale: Le choix maintient le sens formel du verbe hébreu et son ambiguïté, tandis que le contexte et la note signalent qu'il peut s'agir d'une transe ou d'un délire de type prophétique.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: au milieu de la maison
  rationale: Rendu direct de la locution spatiale, dans un registre narratif digne et courant.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: jouait de sa main
  rationale: Le verbe indique l'exécution musicale et le complément précise la main. L'instrument, absent de ce verset, n'est pas ajouté au texte.
- source_word: כְּיוֹם בְּיוֹם
  choice: comme il le faisait chaque jour
  rationale: Rend naturellement en français l'idée hébraïque d'une action habituelle et répétée.
- source_word: הַחֲנִית בְּיַד שָׁאוּל
  choice: Saül avait sa lance à la main
  rationale: Formulation française idiomatique qui préserve le détail menaçant préparant la suite du récit.
theological_decisions:
- issue: Lien entre l'esprit mauvais et Dieu dans רוּחַ אֱלֹהִים רָעָה
  choice: un esprit mauvais venant de Dieu
  alternative: un esprit malfaisant de Dieu
  rationale: Le texte attribue explicitement à Dieu l'origine, l'envoi ou la mission de l'esprit. « Venant de Dieu » préserve cette tension et la souveraineté divine du récit sans suggérer que Dieu serait lui-même moralement mauvais.
- issue: Nature de l'activité exprimée par וַיִּתְנַבֵּא
  choice: prophétisait
  alternative: était en proie à un délire prophétique
  rationale: Le contexte négatif peut évoquer une agitation extatique ou un délire, mais le verbe appartient bien au vocabulaire de la prophétie. Le texte principal conserve cette ambiguïté plutôt que de trancher selon une interprétation.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement réorganisée en trois phrases pour éviter une coordination lourde. « Jouait de sa main » reste volontairement proche de l'hébreu malgré son caractère peu habituel, afin de ne pas nommer un instrument que le verset ne précise pas.
