revisions:
- from: Le lendemain, un esprit mauvais venant de Dieu fondit sur Saül[a]. Celui-ci prophétisait au milieu de la maison[b], tandis que David jouait de sa main, comme il le faisait chaque jour[c]. Saül avait sa lance à la main.
  to: Le lendemain, un esprit mauvais venant de Dieu fondit sur Saül[a]. Saül se mit à prophétiser dans la maison[b], tandis que David jouait de la musique, comme il le faisait chaque jour[c]. Saül tenait sa lance à la main.
  rationale: La révision corrige deux calques peu naturels en français, sans modifier le sens du passage. « Dans la maison » restitue la valeur locative de l’hébreu. « Jouait de la musique » rend explicitement l’activité de David tout en évitant de nommer l’instrument; la mention instrumentale « de sa main », idiomatique en hébreu, n’a pas d’équivalent français naturel et n’apporte pas ici une distinction sémantique nécessaire. La formulation concernant Saül conserve l’ambiguïté lexicale et contextuelle de l’activité prophétique.
