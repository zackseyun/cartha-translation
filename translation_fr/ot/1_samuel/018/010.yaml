  terminology: « Esprit mauvais venant de Dieu » préserve la qualification de l’esprit et son rapport explicite à Dieu. La note maintient l’alternative « malfaisant » et la littéralité du construit hébreu. « Prophétiser » conserve volontairement l’ambiguïté de וַיִּתְנַבֵּא; la note ne l’interprète pas de manière doctrinale.
