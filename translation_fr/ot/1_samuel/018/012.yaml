source:
  edition: WLC
  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: fr
  text: Saül avait peur de David[a], parce que Yahweh était avec lui et s’était retiré de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Saül craignait David ». L’hébreu dit littéralement « Saül eut peur de devant David », tournure qui présente David comme l’objet ou la cause de sa peur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: avait peur
  rationale: Le verbe ירא exprime ici la peur. « Avait peur » est naturel en français moderne et convient au cadre narratif.
- source_word: מִלִּפְנֵי
  choice: de
  rationale: L’expression signifie littéralement « de devant/en présence de », mais, avec ירא et une personne, elle désigne naturellement l’objet ou la cause de la peur.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la raison de la peur de Saül; « parce que » exprime clairement ce rapport causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Le pronom renvoie naturellement à David. Cette formulation conserve la forme pronominale de l’hébreu sans créer d’ambiguïté réelle dans le contexte.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: et s’était retiré de Saül
  rationale: סור peut signifier se détourner, partir ou se retirer. Le plus-que-parfait rend l’état antérieur qui motive la peur de Saül, tandis que « se retirer de » préserve la formulation personnelle et solennelle du texte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée du retrait divin de Saül
  choice: Yahweh « s’était retiré de Saül », sans précision supplémentaire
  alternative: L’Esprit de Yahweh avait quitté Saül; la faveur de Yahweh s’était retirée de Saül
  rationale: Ce verset affirme seulement que Yahweh était avec David et s’était retiré de Saül. Ajouter « l’Esprit » ou réduire l’énoncé à la faveur divine importerait une interprétation absente de cette formulation.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait décrit l’état de peur de Saül; le plus-que-parfait marque le retrait divin antérieur. La note conserve l’alternative plus formelle « craignait » et signale l’idiome hébreu.
