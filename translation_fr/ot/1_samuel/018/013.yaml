base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/013.yaml
  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: fr
  text: Saül l’éloigna de sa présence et le nomma chef de mille hommes. David sortit et rentra devant le peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « sortir et rentrer » peut désigner l’exercice d’une activité publique ou militaire, éventuellement à la tête du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: l’éloigna
  rationale: La forme causative de סוּר exprime le fait d’écarter ou d’éloigner quelqu’un. « L’éloigna » reste concret sans préciser davantage le motif de Saül.
- source_word: מֵעִמּוֹ
  choice: de lui
  rationale: Littéralement « d’avec lui » ; « de lui » donne en français naturel l’idée que David n’est plus maintenu auprès de Saül.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: le nomma
  rationale: Dans ce contexte, שׂוּם avec la fonction qui suit désigne l’attribution officielle d’une charge. « Le nomma » est naturel et précis.
- source_word: שַׂר אָלֶף
  choice: commandant de mille hommes
  rationale: שַׂר désigne ici un responsable militaire. « Mille hommes » explicite en français l’unité militaire sous-entendue sans transformer le titre.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: sortait et rentrait
  rationale: La formulation conserve les deux verbes concrets de l’hébreu et leur aspect d’activité répétée, tandis que la note signale leur portée idiomatique possible.
- source_word: לִפְנֵי הָעָם
  choice: devant le peuple
  rationale: Cette traduction littérale préserve l’ambiguïté entre activité visible aux yeux du peuple et position de chef à sa tête.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le nom « David » est repris dans la seconde phrase pour éviter toute ambiguïté de référent. La tournure littérale « sortait et rentrait devant le peuple » maintient l’ambiguïté de l’hébreu, expliquée en note.
