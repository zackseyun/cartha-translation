  source_fidelity: 'Le sens général est bien rendu : Saül écarte David, lui confie un commandement de mille, puis David exerce une activité « devant le peuple ». Toutefois, « donc » n’a pas de correspondant dans l’hébreu et ajoute une inférence. La séquence narrative finale est mieux rendue au passé simple qu’à l’imparfait dans ce contexte.'
