base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: fr
  text: 'David dit à Saül : « Qui suis-je, et que vaut ma vie[a], que vaut la famille de mon père en Israël, pour que je devienne le gendre du roi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, dans une formulation difficile : « et qui est ma vie ? » L’expression hébraïque peut souligner l’insignifiance de David ou faire allusion aux siens et à sa condition familiale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: David dit à Saül
  rationale: Le passé simple convient au récit suivi en français et rend naturellement la progression du wayyiqtol, sans qu’il soit nécessaire de reproduire mécaniquement la conjonction initiale.
- source_word: מִי אָנֹכִי
  choice: Qui suis-je
  rationale: Cette question directe conserve la formulation hébraïque et l’humilité exprimée par David.
- source_word: וּמִי חַיַּי
  choice: et que vaut ma vie[a]
  rationale: L’hébreu est inhabituel et se traduit très littéralement par « et qui est ma vie ? ». Dans ce contexte, la tournure exprime vraisemblablement l’insignifiance ou la condition modeste de David. « Que vaut ma vie ? » reste proche de l’image tout en étant compréhensible en français; une note préserve l’ambiguïté possible concernant ses proches.
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: ou la famille de mon père en Israël
  rationale: « Famille » rend clairement מִשְׁפָּחָה, qui peut aussi désigner un clan. « Ou » présente cette expression comme un second élément de la question sans imposer qu’elle soit forcément une apposition à « ma vie ».
- source_word: כִּי אֶהְיֶה חָתָן לַמֶּלֶךְ
  choice: pour que je devienne le gendre du roi
  rationale: La tournure française exprime naturellement la conséquence jugée invraisemblable par David; חָתָן désigne ici précisément le gendre du roi.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La légère étrangeté de « que vaut ma vie » maintient le relief de l’hébreu, tandis que la note signale son ambiguïté réelle sans imposer une interprétation.
