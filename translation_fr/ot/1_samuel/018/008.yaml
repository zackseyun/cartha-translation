base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: fr
  text: 'Saül fut alors très irrité, et cette parole lui déplut. Il dit : « Elles ont attribué[a] à David les dizaines de milliers, et à moi les milliers ! Il ne lui manque plus que la royauté[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Elles ont donné à David les dizaines de milliers, et à moi les milliers. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est condensé : « et encore pour lui, seulement la royauté », c’est-à-dire que, selon Saül, la royauté est la seule chose qui reste à David à obtenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: Saül se mit alors dans une très grande colère
  rationale: Le verbe exprime littéralement une colère qui s’enflamme, et מְאֹד l’intensifie. Cette formulation naturelle conserve à la fois le déclenchement et la force de la réaction.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: lui déplurent
  rationale: L’idiome hébreu signifie littéralement « furent mauvaises à ses yeux ». « Lui déplurent » en transmet naturellement le sens dans ce contexte.
- source_word: הַדָּבָר הַזֶּה
  choice: ces paroles
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Ici, il renvoie au refrain chanté juste auparavant ; le pluriel français reprend naturellement son contenu verbal sans changer le référent.
- source_word: נָתְנוּ
  choice: elles ont attribué
  rationale: Le sujet implicite renvoie aux femmes qui chantaient. Dans le contexte d’un éloge public, « attribuer » exprime mieux que le littéral « donner » l’idée d’imputer à chacun ses victoires.
- source_word: רְבָבוֹת
  choice: les dizaines de milliers
  rationale: Le pluriel désigne des unités de dix mille. Cette expression est naturelle en français et maintient le contraste numérique avec « les milliers ».
- source_word: הָאֲלָפִים
  choice: les milliers
  rationale: La traduction conserve l’article hébreu et le parallélisme rhétorique avec « les dizaines de milliers ».
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: Il ne lui manque plus que la royauté
  rationale: 'La proposition hébraïque est très condensée : littéralement, « et encore pour lui, seulement la royauté ». La formulation française restitue la conclusion inquiète de Saül tout en gardant l’ambiguïté entre ce qui reste à David à obtenir et ce qui lui manque encore.'
- source_word: הַמְּלוּכָה
  choice: la royauté
  rationale: Le nom vise ici la dignité et le pouvoir royaux convoités ou susceptibles de revenir à David, plutôt que le territoire du royaume.
