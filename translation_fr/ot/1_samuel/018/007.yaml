  text: וַֽ/תַּעֲנֶ֛ינָה הַ/נָּשִׁ֥ים הַֽ/מְשַׂחֲק֖וֹת וַ/תֹּאמַ֑רְןָ הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד בְּ/רִבְבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: fr
  text: 'Les femmes qui célébraient se répondaient en chantant[a] :


    « Saül a frappé[b] ses milliers,


    et David ses dizaines de milliers. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se répondaient ». Dans ce contexte, il s’agit vraisemblablement d’un chant alterné ou responsorial. Le participe traduit par « célébraient » peut aussi évoquer le jeu, la danse ou les réjouissances.
    reason: lexical_alternative
  - marker: b
    text: Ou « a abattu » ou « a tué ». Le verbe hébreu signifie littéralement « a frappé » et possède ici un sens militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: se répondaient en chantant
  rationale: Dans ce contexte de chant collectif, ענה évoque une réponse chantée, probablement antiphonée. Cette formulation française conserve à la fois l’idée de réponse et celle de chant.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Traduction directe du nom pluriel, sans généralisation.
- source_word: הַמְשַׂחֲקוֹת
  choice: qui célébraient
  rationale: Le participe de שׂחק peut désigner des réjouissances festives comprenant jeu, danse ou gaieté. « célébraient » convient au contexte de victoire sans préciser excessivement l’activité.
- source_word: וַתֹּאמַרְןָ
  choice: introduit par les deux-points
  rationale: Le verbe « elles dirent » introduit le refrain. En français, après « se répondaient en chantant », les deux-points évitent une répétition peu naturelle tout en conservant clairement l’introduction de la citation.
- source_word: הִכָּה
  choice: a frappé
  rationale: Le verbe נכה signifie littéralement « frapper » et, dans ce contexte militaire, peut impliquer abattre ou tuer. Le choix littéral préserve cette amplitude sémantique.
- source_word: באלפו
  choice: ses milliers
  rationale: La préposition avec le nombre exprime ici un décompte d’exploits militaires; la formule poétique « ses milliers » reproduit le parallélisme hébreu.
- source_word: בְּרִבְבֹתָיו
  choice: ses dizaines de milliers
  rationale: רבבה désigne dix mille ou une très grande multitude. Le pluriel « dizaines de milliers » maintient le contraste poétique avec « milliers ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme en deux lignes conserve le parallélisme du refrain. « Se répondaient en chantant » explicite sobrement la valeur performative du verbe, tandis que « célébraient » laisse ouverte la forme précise des réjouissances.
