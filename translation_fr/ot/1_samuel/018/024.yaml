  yaml_path: translation/ot/1_samuel/018/024.yaml
  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: fr
  text: 'Les serviteurs de Saül lui rapportèrent : « David a parlé en ces termes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « David a parlé conformément à ces paroles. »'
    reason: La préposition hébraïque peut indiquer la conformité aux paroles rapportées ou une formulation de ce genre, sans nécessairement reproduire une citation mot à mot.
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: lui rapportèrent
  rationale: Le hifil de נגד signifie ici « annoncer, rapporter ». Dans ce contexte de cour, « rapportèrent » exprime naturellement la transmission à Saül des paroles de David.
- source_word: עַבְדֵי שָׁאוּל
  choice: Les serviteurs de Saül
  rationale: עבד peut désigner des serviteurs, des hommes de cour ou des fonctionnaires. « Serviteurs » conserve la portée générale du terme sans préciser indûment leur rang.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le contenu du rapport. En français moderne, les deux-points remplissent naturellement cette fonction sans alourdir la phrase par « en disant ».
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: de tels propos
  rationale: 'La préposition כ־ exprime ici l’idée de conformité ou de ressemblance : « selon ces paroles », « des paroles comme celles-ci ». « De tels propos » préserve cette nuance tout en restant idiomatique.'
- source_word: דִּבֶּר
  choice: a tenu
  rationale: Dans l’expression française « tenir de tels propos », ce verbe rend naturellement l’idée de parler ou de prononcer des paroles, sans modifier le sens de דבר.
- source_word: דָּוִד
  choice: David
  rationale: Forme française traditionnelle et standard du nom hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et fluide. Le passé simple convient au registre narratif biblique. La tournure « tenir de tels propos » conserve le caractère récapitulatif du rapport et la nuance de כַּ (« selon/comme »).
