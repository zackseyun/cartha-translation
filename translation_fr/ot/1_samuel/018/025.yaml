base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: fr
  text: 'Alors Saül dit : « Voici ce que vous direz à David : “Le roi ne demande pas d’autre prix nuptial[a] que cent prépuces de Philistins, afin de se venger des ennemis du roi.” » Saül, lui, comptait faire tomber David par la main des Philistins[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « prix nuptial » était un paiement lié au mariage, généralement remis par le futur époux ou sa famille à la famille de la jeune femme ; il ne correspond pas à la dot au sens courant du français moderne.
    reason: cultural_note
  - marker: b
    text: « Faire tomber David » signifie probablement provoquer sa mort, mais l’expression hébraïque reste moins explicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: prix nuptial
  rationale: Le terme désigne le paiement lié au mariage, normalement remis par le futur époux ou sa famille à la famille de la jeune femme. « Prix nuptial » est plus précis que « dot », qui désigne généralement en français moderne les biens apportés par l’épouse ou sa famille.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ ... כִּי
  choice: Le roi ne demande pas d’autre ... que
  rationale: Cette formulation française naturelle exprime que Saül ne veut aucun paiement matrimonial, sinon l’exigence qui suit, tout en conservant la structure exceptive du contexte.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: que cent prépuces de Philistins
  rationale: Traduction directe qui conserve le caractère concret et choquant de la demande hébraïque.
- source_word: לְהִנָּקֵם
  choice: afin de se venger
  rationale: Le nifal peut ici avoir une valeur réflexive et exprime le but officiellement avancé par Saül. « Se venger » est idiomatique en français sans effacer cette nuance.
- source_word: בְּאֹיְבֵי הַמֶּלֶךְ
  choice: des ennemis du roi
  rationale: Avec « se venger », le français demande naturellement la préposition « de » ; la désignation royale à la troisième personne est maintenue.
- source_word: חָשַׁב
  choice: comptait
  rationale: Dans ce contexte, le verbe exprime une intention calculée plutôt qu’une simple pensée. « Comptait » reste naturel et laisse entendre le dessein sans amplification.
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: faire tomber David
  rationale: Cette traduction conserve la métaphore causative de l’hébreu, qui suggère ici vraisemblablement la mort de David sans la rendre explicitement.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: par la main des Philistins
  rationale: La formulation conserve l’image hébraïque de la main comme instrument ou agent, dans un registre biblique encore intelligible en français.
theological_decisions:
- issue: Portée de « faire tomber David »
  choice: Conserver la métaphore « faire tomber » dans le texte
  alternative: « faire mourir David » ou « causer sa perte »
  rationale: Le contexte indique probablement que Saül espère la mort de David, mais l’expression hébraïque reste moins explicite. La traduction préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici ce que vous direz » rend naturellement la formule כֹּה תֹאמְרוּ. La reprise « Saül, lui » marque le contraste entre le motif déclaré et son intention réelle sans donner au simple waw une valeur excessivement forte. Le vocabulaire anatomique explicite de l’original est conservé.
