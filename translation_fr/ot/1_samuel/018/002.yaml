  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: fr
  text: Ce jour-là, Saül prit David et ne lui permit pas de retourner chez son père.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne l’autorisa pas à retourner ». Littéralement, l’hébreu dit : « ne le donna pas pour retourner à la maison de son père » ; le verbe « donner » est employé ici au sens d’accorder la permission.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: prit David avec lui
  rationale: Le verbe לקח signifie littéralement « prendre ». En français, « prit David avec lui » reste proche de l’hébreu tout en exprimant naturellement, dans ce contexte, que Saül le retient auprès de lui. Le nom « David », fourni par le contexte immédiat, évite un pronom initial ambigu en français.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et usuelle du nom שָׁאוּל.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend directement l’indication temporelle hébraïque dans un français naturel.
- source_word: וְלֹא נְתָנוֹ
  choice: et ne lui permit pas
  rationale: נתן suivi d’un infinitif fonctionne ici de manière idiomatique au sens de « permettre ». Une traduction littérale comme « ne le donna pas à retourner » serait obscure en français.
- source_word: לָשׁוּב
  choice: de retourner
  rationale: שׁוב exprime ici le retour vers le foyer paternel ; « retourner » en donne le sens direct.
- source_word: בֵּית אָבִיו
  choice: chez son père
  rationale: L’expression désigne la maison ou le foyer paternel. « Chez son père » est idiomatique en français moderne et convient au mouvement exprimé par « retourner ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche de la structure hébraïque tout en évitant un calque incompréhensible. « David » explicite le référent du pronom hébreu d’après le contexte immédiat.
