  verdict: revise
  source_fidelity: La première proposition rend bien l’idiome יָסַף + infinitif (« continuer à ») et la peur exprimée par ירא. Toutefois, « qu’auparavant » explicite un point de comparaison qui n’est pas formulé dans le verset même; עוֹד peut marquer « encore / davantage » sans cette précision. La seconde proposition rend correctement l’hostilité durable de Saül envers David; « constamment » est une interprétation recevable de כָּל־הַיָּמִים, à garder éclairée par note.
  naturalness: Le français est globalement naturel et de registre approprié. « Davantage encore » est plus fluide et plus proche de l’ambiguïté de עוֹד que « plus encore qu’auparavant ». La reprise de « Saül » dans la seconde proposition évite toute légère ambiguïté référentielle de « il » et « son ennemi ».
  terminology: « Avoir peur de », « ennemi » et les noms « Saül » et « David » conviennent au français biblique moderne international. Aucun enjeu théologique particulier n’est en cause.
