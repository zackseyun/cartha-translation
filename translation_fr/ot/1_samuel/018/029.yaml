  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
translation:
  language: fr
  text: Saül continua d’avoir peur de David, davantage encore[a], et Saül fut constamment l’ennemi de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Saül continua d’avoir peur de David, encore. » L’expression hébraïque associe l’idée de continuer ou d’ajouter à celle de craindre; « encore » peut marquer la continuation ou l’intensification.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous les jours ». L’expression peut signifier « continuellement » ou « durant toute sa vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא
  choice: continua d’avoir peur
  rationale: La construction יָסַף suivie de l’infinitif exprime ici la continuation ou l’accroissement d’une action. Cette formulation française garde l’idée de continuité sans calquer artificiellement « ajouta à craindre ».
- source_word: מִפְּנֵי דָוִד
  choice: de David
  rationale: Avec le verbe ירא, la locution littérale « devant la face de David » désigne idiomatiquement la personne que Saül redoute.
- source_word: עוֹד
  choice: plus encore qu’auparavant
  rationale: Dans le contexte, עוֹד renforce la peur déjà mentionnée et marque une aggravation. La comparaison explicite reste naturelle en français.
- source_word: וַיְהִי שָׁאוּל אֹיֵב אֶת דָּוִד
  choice: il fut constamment son ennemi
  rationale: אֹיֵב désigne directement un ennemi ou adversaire. Le pronom « son » rend naturellement David comme objet de l’hostilité de Saül.
- source_word: כָּל הַיָּמִים
  choice: constamment
  rationale: L’expression signifie littéralement « tous les jours » et peut décrire une hostilité continuelle, sans imposer dans le texte principal qu’elle se prolonge nécessairement jusqu’à la mort de Saül.
theological_decisions:
- issue: Durée de l’hostilité de Saül
  choice: constamment
  alternative: jusqu’à la fin de ses jours / toute sa vie
  rationale: L’hébreu כָּל הַיָּמִים peut souligner une continuité durable ou viser l’ensemble des jours de Saül. Le texte principal préserve l’idée d’hostilité continue sans trancher plus précisément que la source.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « plus encore qu’auparavant » restitue l’intensification narrative; « constamment » évite le calque peu naturel « tous les jours » tout en conservant l’ambiguïté de durée dans une note.
