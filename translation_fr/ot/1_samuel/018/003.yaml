  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: fr
  text: Alors Jonathan conclut une alliance avec David[a], parce qu’il l’aimait comme lui-même[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupa une alliance »; il s’agit de l’expression hébraïque habituelle pour conclure une alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme sa propre âme » ou « comme sa propre vie ». Les pronoms hébreux sont formellement ambigus, mais le contexte favorise le sens suivant : Jonathan aimait David comme lui-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: conclut
  rationale: Dans l’expression idiomatique כָּרַת בְּרִית, le verbe signifie littéralement « couper », mais « conclure une alliance » en restitue naturellement le sens en français.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: Jonathan … avec David
  rationale: Le verbe hébreu est au singulier et place Jonathan en tête. Dans le contexte, la coordination exprime que Jonathan établit l’alliance avec David; cette formulation française conserve Jonathan comme sujet grammatical.
- source_word: בְּרִית
  choice: alliance
  rationale: « Alliance » rend la portée solennelle et relationnelle de בְּרִית mieux que « accord » ou « traité » dans ce contexte personnel.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: parce qu’il l’aimait
  rationale: La préposition בְּ est comprise ici dans un sens causal ou circonstanciel. Le contexte favorise Jonathan comme sujet de l’amour et David comme objet, tout en laissant signaler l’ambiguïté formelle des pronoms.
- source_word: כְּנַפְשׁוֹ
  choice: comme lui-même
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Comme lui-même » exprime naturellement en français l’intensité de cet attachement sans imposer ici une anthropologie particulière.
theological_decisions:
- issue: Référents des pronoms dans בְּאַהֲבָתוֹ אֹתוֹ כְּנַפְשׁוֹ
  choice: Jonathan aimait David comme lui-même
  alternative: David aimait Jonathan comme lui-même; ou conserver une formulation entièrement ambiguë
  rationale: Les pronoms hébreux de troisième personne sont formellement ambigus pris isolément, mais le contexte immédiat, notamment les versets 1 et 3, favorise nettement Jonathan comme sujet et David comme objet. La note conserve l’existence de l’ambiguïté grammaticale sans ajouter d’interprétation sur la nature de leur relation.
translation_notes:
  register: Français international moderne, naturel et digne. « Conclure une alliance » conserve la solennité de l’expression sans reproduire littéralement un idiome hébreu obscur en français. « Comme lui-même » privilégie la clarté courante, tandis que la note garde l’image de l’âme ou de la vie et l’ambiguïté pronominale.
