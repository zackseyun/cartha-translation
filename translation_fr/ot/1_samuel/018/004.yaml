  text: וַ/יִּתְפַּשֵּׁ֣ט יְהוֹנָתָ֗ן אֶֽת הַ/מְּעִיל֙ אֲשֶׁ֣ר עָלָ֔י/ו וַֽ/יִּתְּנֵ֖/הוּ לְ/דָוִ֑ד וּ/מַדָּ֕י/ו וְ/עַד חַרְבּ֥/וֹ וְ/עַד קַשְׁתּ֖/וֹ וְ/עַד חֲגֹרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: fr
  text: Jonathan retira le manteau qu’il portait et le donna à David, ainsi que ses vêtements[a], y compris son épée, son arc et sa ceinture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa tenue » ou « sa tenue militaire »; le terme hébreu peut désigner des vêtements, notamment une tenue officielle ou militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: retira
  rationale: Le hitpael de פשט indique ici que Jonathan enlève lui-même un vêtement. « Retira » est naturel en français et, avec son complément, n’implique pas qu’il se déshabille entièrement.
- source_word: הַמְּעִיל אֲשֶׁר עָלָיו
  choice: le manteau qu’il portait
  rationale: מְעִיל désigne un vêtement extérieur, souvent une robe ou un manteau. « Le manteau qu’il portait » rend clairement et naturellement toute l’expression.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: et le donna à David
  rationale: Le pronom objet renvoie au manteau; la formulation conserve la simplicité de la narration hébraïque.
- source_word: וּמַדָּיו
  choice: ainsi que sa tenue
  rationale: מַדִּים peut désigner des vêtements, notamment une tenue officielle ou militaire. « Tenue » préserve cette latitude mieux qu’« armure », puisque les armes sont ensuite énumérées séparément.
- source_word: וְעַד
  choice: et même
  rationale: La répétition de עַד étend la liste jusqu’aux objets mentionnés. Une seule formulation française, « et même », en restitue naturellement la portée culminante sans répétition lourde.
- source_word: חַרְבּוֹ
  choice: son épée
  rationale: Équivalent français courant de חֶרֶב dans ce contexte.
- source_word: קַשְׁתּוֹ
  choice: son arc
  rationale: Équivalent français direct de קֶשֶׁת.
- source_word: חֲגֹרוֹ
  choice: sa ceinture
  rationale: חֲגוֹר désigne ce qui se porte serré autour de la taille; « ceinture » est le terme moderne naturel.
theological_decisions:
- issue: Portée narrative et symbolique des dons de Jonathan
  choice: Décrire les dons sans en expliciter la signification symbolique dans le verset.
  alternative: Présenter le geste comme la reconnaissance de la future royauté de David ou seulement comme un signe d’amitié d’alliance.
  rationale: Le texte hébreu rapporte les gestes concrets sans en donner ici une interprétation explicite. La traduction conserve donc la tension narrative et théologique.
translation_notes:
  register: Français international moderne, fluide et digne. « Manteau » est plus courant que « robe » pour un vêtement extérieur masculin dans ce contexte. « Tenue » maintient l’ambiguïté lexicale de מַדִּים, précisée en note.
