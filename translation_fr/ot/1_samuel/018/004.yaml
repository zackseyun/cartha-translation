- from: Jonathan retira le manteau qu’il portait et le donna à David, ainsi que sa tenue[a], et même son épée, son arc et sa ceinture.
  to: Jonathan retira le manteau qu’il portait et le donna à David, ainsi que ses vêtements[a], y compris son épée, son arc et sa ceinture.
  rationale: La révision rend explicitement le pluriel et le sens vestimentaire premier de מַדָּיו par « ses vêtements », tout en préservant en note la possibilité d’une tenue officielle ou militaire. « Y compris » restitue de façon naturelle l’inclusion marquée par la répétition de עַד dans l’énumération. Aucun sens symbolique n’est ajouté.
