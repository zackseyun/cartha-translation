    rationale: Le terme hébreu est au pluriel et peut désigner des vêtements ou un équipement vestimentaire, éventuellement officiel ou militaire. « Ses vêtements » est plus directement fidèle tout en laissant l’alternative en note.
  - severity: low
    issue: La portée de « et même » est légèrement ambiguë dans la liste française.
    rationale: La répétition de עַד introduit chacun des derniers objets. « Y compris » marque plus clairement qu’ils sont tous inclus parmi les présents, sans interpréter la portée symbolique du geste.
  revised_text: Jonathan retira le manteau qu’il portait et le donna à David, ainsi que ses vêtements[a], y compris son épée, son arc et sa ceinture.
