id: 1SA.18.30
reference: 1 Samuel 18:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּצְא֖וּ שָׂרֵ֣י פְלִשְׁתִּ֑ים וַ/יְהִ֣י מִ/דֵּ֣י צֵאתָ֗/ם שָׂכַ֤ל דָּוִד֙ מִ/כֹּל֙ עַבְדֵ֣י שָׁא֔וּל וַ/יִּיקַ֥ר שְׁמ֖/וֹ מְאֹֽד׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: fr
  text: Les chefs des Philistins partirent en campagne[a]. Chaque fois qu’ils partaient, David agissait avec plus de discernement que tous les serviteurs de Saül[b], et son nom fut tenu en très haute estime[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sortirent ». Dans ce contexte, il s’agit vraisemblablement d’une sortie militaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « David réussissait mieux que tous les serviteurs de Saül ». Le verbe hébreu peut désigner une conduite avisée et la réussite qui en découle.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « son nom devint très précieux »; autrement dit, sa réputation était grandement honorée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: les chefs des Philistins
  rationale: שָׂרִים désigne des dirigeants ou des responsables, ici vraisemblablement militaires. « Chefs » reste naturel et ne précise pas davantage le grade que l’hébreu.
- source_word: וַיֵּצְאוּ / מִדֵּי צֵאתָם
  choice: partirent en campagne / chaque fois qu’ils partaient
  rationale: 'יצא signifie littéralement « sortir » ou « partir ». Le contexte militaire permet « partir en campagne », tandis que מִדֵּי exprime clairement la répétition : « chaque fois que ».'
- source_word: שָׂכַל
  choice: agissait avec plus de discernement
  rationale: Le verbe peut exprimer une conduite avisée ainsi que la réussite qui en résulte. Cette formulation conserve l’idée de prudence sans exclure celle de succès; le comparatif est fourni par מִכֹּל.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: que tous les serviteurs de Saül
  rationale: עֲבָדִים désigne ici les hommes au service du roi, non nécessairement des esclaves. « Serviteurs » conserve la vaste portée du terme hébreu.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: son nom fut tenu en très haute estime
  rationale: L’expression hébraïque dit que son nom devint précieux, honoré ou estimé; en français, « être tenu en très haute estime » communique naturellement la réputation et l’honneur attachés à son nom.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. La répétition hébraïque est conservée par « chaque fois qu’ils partaient ». « Agissait avec plus de discernement » maintient la tension lexicale entre sagesse pratique et réussite, explicitée en note.
