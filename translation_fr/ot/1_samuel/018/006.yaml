base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: fr
  text: Or, comme ils arrivaient, lorsque David revint après avoir frappé le Philistin, les femmes sortirent de toutes les villes d’Israël, chantant et dansant, à la rencontre du roi Saül, avec des tambourins, dans la joie et au son d’instruments à trois cordes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu שָׁלִשִׁים est incertain. Il pourrait désigner des instruments à trois cordes, des luths ou un autre type d’accompagnement musical.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Or
  rationale: Introduit une nouvelle scène narrative sans recourir à la tournure vieillie « il arriva que ».
- source_word: בְּבוֹאָם
  choice: comme ils rentraient
  rationale: Le suffixe masculin pluriel est conservé par « ils », sans préciser son référent, que le verset laisse implicite.
- source_word: בְּשׁוּב דָּוִד
  choice: lorsque David revint
  rationale: Rend naturellement la proposition temporelle construite sur l’infinitif de שׁוב.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: après avoir abattu le Philistin
  rationale: נכה peut exprimer le fait de frapper, vaincre ou tuer. « Abattre » convient ici au champion philistin déjà tué tout en restant proche de l’image verbale.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: les femmes sortirent
  rationale: Exprime leur sortie des villes pour aller à la rencontre du cortège.
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: de toutes les villes d’Israël
  rationale: Rendu collectif direct et naturel.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: chantant et dansant
  rationale: La coordination idiomatique française rend l’infinitif « chanter » et le nom pluriel « danses » sans lourdeur.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: à la rencontre du roi Saül
  rationale: Conserve l’idée de mouvement vers le roi et emploie l’ordre français naturel du titre et du nom.
- source_word: בְּתֻפִּים
  choice: avec des tambourins
  rationale: תֹּף désigne un petit tambour sur cadre; « tambourin » est actuel et immédiatement compréhensible.
- source_word: בְּשִׂמְחָה
  choice: dans la joie
  rationale: Préserve la forme nominale et le sens de réjouissance.
- source_word: וּבְשָׁלִשִׁים
  choice: au son d’instruments à trois cordes
  rationale: Le terme est rare et incertain. Cette formulation maintient son probable caractère musical et l’hypothèse d’un instrument à trois parties ou cordes, sans masquer l’incertitude signalée en note.
theological_decisions: []
