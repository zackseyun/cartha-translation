  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: fr
  text: Lorsque David eut fini de parler à Saül, l’âme de Jonathan fut liée à l’âme de David[a], et Jonathan l’aima comme sa propre âme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « s’attacha à l’âme de David » ou « fut unie à l’âme de David ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète trois fois le même mot, rendu ici par « âme » : « l’âme de Jonathan… l’âme de David… sa propre âme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Lorsque
  rationale: Dans cette transition narrative, la formule וַיְהִי introduit la circonstance temporelle. Le français moderne peut l’intégrer naturellement à la proposition sans recourir à l’expression vieillie « il arriva que ».
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: David eut fini de parler
  rationale: La construction temporelle avec infinitif construit indique que le discours est achevé avant l’événement suivant. Le nom de David, clair dans le contexte immédiat, évite en français un pronom initial ambigu.
- source_word: אֶל שָׁאוּל
  choice: à Saül
  rationale: אֶל indique ici le destinataire des paroles.
- source_word: נֶפֶשׁ
  choice: âme
  rationale: Le terme est répété trois fois et désigne ici la personne dans sa vie intérieure et son attachement profond. « Âme » conserve cette répétition et la force de l’image.
- source_word: נִקְשְׁרָה
  choice: fut liée
  rationale: Le nifal de קשר exprime le fait d’être lié ou attaché. La formulation passive préserve directement la métaphore hébraïque.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: à l’âme de David
  rationale: Cette traduction garde explicite la seconde occurrence de נֶפֶשׁ et rend clairement le lien entre les deux personnes.
- source_word: וַיֶּאֱהָבוֹ
  choice: Jonathan l’aima
  rationale: Le suffixe objet renvoie à David et le sujet est Jonathan. Le verbe אהב signifie simplement aimer ici, sans que la traduction précise davantage la nature de cet amour.
- source_word: כְּנַפְשׁוֹ
  choice: comme sa propre âme
  rationale: « Propre » clarifie que le possessif renvoie à Jonathan, tandis que « âme » conserve la troisième occurrence du même mot hébreu.
theological_decisions:
- issue: Nature de l’amour de Jonathan pour David
  choice: Exprimer sans atténuation un profond attachement personnel, sans lui attribuer une nature sexuelle ou romantique que le verset ne précise pas.
  alternative: Interpréter cet amour principalement comme une alliance politique, ou explicitement comme un amour romantique ou sexuel.
  rationale: Les mots נֶפֶשׁ et אהב expriment un lien personnel intense, mais le texte ne définit pas ici plus précisément sa nature. La traduction conserve donc sa force et son ouverture.
translation_notes:
  register: Français international moderne, digne et lisible. La structure reste proche de l’hébreu tout en évitant une formule narrative archaïque. La répétition intentionnelle d’« âme » est maintenue.
