  text: וַ/יְהִ֗י בְּ/עֵ֥ת תֵּ֛ת אֶת מֵרַ֥ב בַּת שָׁא֖וּל לְ/דָוִ֑ד וְ/הִ֧יא נִתְּנָ֛ה לְ/עַדְרִיאֵ֥ל הַ/מְּחֹלָתִ֖י לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: fr
  text: Mais lorsque vint le moment de donner Mérab, fille de Saül, à David, elle fut donnée à Adriël, le Méholatite, pour femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Mais lorsque vint le moment
  rationale: La tournure introduit une nouvelle étape du récit et situe l’action dans le temps. « Mais » rend naturellement le contraste entre le mariage attendu et son issue réelle, tandis que « lorsque vint le moment » restitue l’expression temporelle.
- source_word: תֵּת
  choice: de donner
  rationale: L’infinitif construit de נתן dépend de בְּעֵת et conserve ici son sens direct dans le contexte d’un mariage arrangé.
- source_word: אֶת מֵרַב בַּת שָׁאוּל
  choice: Mérab, fille de Saül
  rationale: L’apposition française identifie clairement Mérab tout en conservant la désignation familiale de l’hébreu.
- source_word: לְדָוִד
  choice: à David
  rationale: La préposition indique le bénéficiaire prévu de l’union matrimoniale.
- source_word: וְהִיא נִתְּנָה
  choice: elle fut donnée
  rationale: Le pronom suivi du passif met Mérab au premier plan et souligne le dénouement inattendu. Le passif français préserve cette focalisation.
- source_word: לְעַדְרִיאֵל
  choice: à Adriel
  rationale: Transcription française usuelle du nom propre.
- source_word: הַמְּחֹלָתִי
  choice: le Méholatite
  rationale: Le gentilé hébreu est rendu par un gentilé français, plutôt que transformé en simple indication géographique.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Expression française naturelle et proche de l’idiome matrimonial hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique sans rendre la phrase archaïque. La structure conserve le contraste et la focalisation du texte hébreu.
