  text: וַ/יְצַ֨ו שָׁא֜וּל אֶת עֲבָדָ֗/ו דַּבְּר֨וּ אֶל דָּוִ֤ד בַּ/לָּט֙ לֵ/אמֹ֔ר הִנֵּ֨ה חָפֵ֤ץ בְּ/ךָ֙ הַ/מֶּ֔לֶךְ וְ/כָל עֲבָדָ֖י/ו אֲהֵב֑וּ/ךָ וְ/עַתָּ֖ה הִתְחַתֵּ֥ן בַּ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: fr
  text: 'Saül donna cet ordre à ses serviteurs : « Parlez à David en privé[a] et dites-lui : “Voici, le roi a de l’affection pour toi, et tous ses serviteurs t’aiment. Maintenant donc, deviens le gendre du roi[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en secret » ou « discrètement ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « deviens apparenté au roi par mariage » ; ou « allie-toi au roi par mariage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime un commandement ou une directive. « Donna cet ordre » restitue sa force tout en introduisant naturellement le discours direct en français.
- source_word: עֲבָדוֹ
  choice: ses serviteurs
  rationale: עבד peut désigner des serviteurs, des assistants ou des fonctionnaires. « Serviteurs » conserve le terme général du texte sans préciser indûment leur rang à la cour.
- source_word: דַּבְּרוּ אֶל־דָּוִד
  choice: Parlez à David
  rationale: L’impératif pluriel de דבר suivi de אֶל signifie ici s’adresser à David. La traduction garde la forme verbale directe.
- source_word: בַּלָּט
  choice: en secret
  rationale: Le terme indique une communication discrète, cachée ou faite à voix basse. « En secret » rend clairement l’intention de Saul dans ce contexte.
- source_word: הִנֵּה
  choice: Le roi…
  rationale: הנה attire l’attention sur ce qui suit. Dans ce discours français très bref, sa force présentative est portée naturellement par l’annonce directe, sans ajout d’un « voici » lourd.
- source_word: חָפֵץ בְּךָ
  choice: trouve son plaisir en toi
  rationale: חפץ avec ב exprime le plaisir, la faveur ou la satisfaction éprouvée envers quelqu’un. Cette formulation conserve l’image et évite une connotation romantique indue.
- source_word: אֲהֵבוּךָ
  choice: t’aiment
  rationale: Le verbe אהב signifie directement « aimer ». Le contexte peut inclure l’affection et la faveur de la cour, mais rien n’impose d’atténuer le mot.
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: L’expression marque à la fois la transition et la conclusion pratique tirée de la faveur annoncée.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: deviens le gendre du roi
  rationale: Le hitpael de חתן désigne l’entrée dans une relation familiale par mariage. Dans le contexte, David est invité à épouser la fille du roi ; « deviens le gendre du roi » exprime naturellement ce sens en français.
