- from: 'Saül donna cet ordre à ses serviteurs : « Parlez à David en secret[a] et dites-lui : “Le roi trouve son plaisir en toi, et tous ses serviteurs t’aiment. Maintenant donc, deviens le gendre du roi[b].” »'
  to: 'Saül donna cet ordre à ses serviteurs : « Parlez à David en privé[a] et dites-lui : “Voici, le roi a de l’affection pour toi, et tous ses serviteurs t’aiment. Maintenant donc, deviens le gendre du roi[b].” »'
  rationale: La révision rétablit la force présentative de הנה, améliore l’idiomaticité de l’expression de la faveur royale et clarifie la note sur la relation créée par mariage. Elle conserve le sens, le registre et l’ambiguïté lexicale du texte source.
