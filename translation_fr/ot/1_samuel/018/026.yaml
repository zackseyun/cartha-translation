    issue: « il deviendrait le gendre du roi »
    rationale: 'Cette proposition indépendante au conditionnel marque une conséquence ou un futur vu du passé, alors que l’infinitif לְהִתְחַתֵּן exprime ce qui était agréable à David : devenir apparenté au roi par mariage.'
  - severity: low
