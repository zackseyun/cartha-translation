    rationale: La tournure est explicative plutôt que littérale et « dans la famille » restreint inutilement l’expression. Le texte hébreu dit plus largement entrer dans une relation de parenté par mariage avec le roi.
  revised_text: Ses serviteurs rapportèrent ces paroles à David, et la possibilité de devenir le gendre du roi[a] plut à David ; le délai n’était pas encore écoulé[b].
