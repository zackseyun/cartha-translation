revisions:
- from: 'Ses serviteurs rapportèrent ces paroles à David. La proposition parut bonne à David : il deviendrait le gendre du roi[a]. Or, le délai n’était pas encore écoulé[b].'
  to: Ses serviteurs rapportèrent ces paroles à David, et la possibilité de devenir le gendre du roi[a] plut à David ; le délai n’était pas encore écoulé[b].
  rationale: La révision évite de présenter le mariage comme un simple événement futur (« il deviendrait ») et rattache explicitement l’infinitif au jugement favorable de David. Elle corrige aussi la note lexicale afin qu’elle représente sans surinterprétation la portée de l’expression hébraïque.
