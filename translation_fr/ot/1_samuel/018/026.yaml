  text: וַ/יַּגִּ֨דוּ עֲבָדָ֤י/ו לְ/דָוִד֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יִּשַׁ֤ר הַ/דָּבָר֙ בְּ/עֵינֵ֣י דָוִ֔ד לְ/הִתְחַתֵּ֖ן בַּ/מֶּ֑לֶךְ וְ/לֹ֥א מָלְא֖וּ הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: fr
  text: Ses serviteurs rapportèrent ces paroles à David, et la possibilité de devenir le gendre du roi[a] plut à David ; le délai n’était pas encore écoulé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « s’allier au roi par mariage » ou « devenir apparenté au roi par mariage ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que le temps fixé n’était pas encore arrivé à son terme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ עֲבָדָיו
  choice: Ses serviteurs rapportèrent
  rationale: Le hifil de נגד signifie ici « faire savoir, rapporter ». Dans le cadre de la cour royale, « serviteurs » rend directement עֲבָדָיו, tandis que « rapportèrent » convient à la transmission du message de Saül.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: דברים peut désigner des paroles ou des choses. Ici, les serviteurs transmettent verbalement la proposition qui précède ; « ces paroles » conserve ce lien immédiat.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: La proposition parut bonne à David
  rationale: L’expression signifie littéralement que « la chose fut droite aux yeux de David », c’est-à-dire qu’elle lui parut bonne ou acceptable. « La proposition » explicite naturellement le référent sans en modifier le sens.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: il deviendrait le gendre du roi
  rationale: Le hitpael de חתן exprime l’entrée dans une relation de parenté par mariage. Dans ce contexte précis, David doit épouser la fille de Saül et devenir ainsi son gendre.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: Or, le délai n’était pas encore écoulé
  rationale: L’expression indique que la période fixée n’était pas encore arrivée à son terme. Cette formulation idiomatique en français restitue clairement la valeur temporelle et la relation au récit suivant.
