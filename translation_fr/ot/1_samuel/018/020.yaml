  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: fr
  text: Mikal, fille de Saül, aima David. On en informa Saül, et cela lui plut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la chose était droite/agréable à ses yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: aimait
  rationale: Le verbe אהב exprime directement l’amour. « Aimait » reste sobre et n’ajoute pas la nuance initiale de « tomba amoureuse », absente de la forme hébraïque.
- source_word: מִיכַל
  choice: Mikal
  rationale: Transcription française moderne du nom hébreu, qui rend la consonne finale plutôt que d’adopter la forme traditionnelle « Mical ».
- source_word: בַּת שָׁאוּל
  choice: fille de Saül
  rationale: Rend naturellement en français la chaîne construite hébraïque et conserve l’identification familiale.
- source_word: אֶת דָּוִד
  choice: David
  rationale: La marque hébraïque de l’objet direct אֶת ne se traduit pas; le nom est rendu selon sa forme française usuelle.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: On le rapporta à Saül
  rationale: Le pluriel hébreu a un sujet non précisé. Le pronom indéfini « on » le préserve naturellement en français; « le » reprend le fait que Mikal aimait David.
- source_word: וַיִּשַׁר
  choice: plut
  rationale: Dans l’expression idiomatique « être droit/agréable aux yeux de quelqu’un », « plut » transmet naturellement l’évaluation favorable.
- source_word: הַדָּבָר
  choice: cela
  rationale: דבר désigne ici le fait ou la nouvelle rapportée. « Cela » est plus naturel que « l’affaire » dans ce bref récit.
- source_word: בְּעֵינָיו
  choice: lui
  rationale: L’expression littérale « à ses yeux » est intégrée à l’idiome français « cela lui plut »; sa forme hébraïque est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Deux phrases évitent une coordination lourde tout en conservant la progression narrative. Le sujet indéfini du verbe « rapporter » demeure non identifié.
