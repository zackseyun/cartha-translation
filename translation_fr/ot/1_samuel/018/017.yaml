base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: fr
  text: 'Alors Saül dit à David : « Voici ma fille aînée, Mérab. Je te la donnerai pour femme. Seulement, sois pour moi un vaillant guerrier et mène les combats de l’Éternel. » Car Saül se disait : « Que ma main ne soit pas contre lui, mais que celle des Philistins soit contre lui ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit naturellement en français la présentation de Mérab tout en conservant la force déictique de l’hébreu.
- source_word: בִתִּי הַגְּדוֹלָה
  choice: ma fille aînée
  rationale: Dans ce contexte familial, גְּדוֹלָה désigne la fille la plus âgée plutôt qu’une fille grande par la taille.
- source_word: בֶן־חַיִל
  choice: un vaillant guerrier
  rationale: L’expression demande ici courage et valeur militaire, comme le confirme l’ordre de combattre qui suit.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: les guerres de l’Éternel
  rationale: Le pluriel hébreu est conservé; « l’Éternel » rend le tétragramme dans un registre biblique français reconnu.
- source_word: וְשָׁאוּל אָמַר
  choice: Saül se disait
  rationale: Le contexte révèle une pensée ou intention intérieure de Saül plutôt qu’une parole nécessairement adressée à David.
- source_word: אַל־תְּהִי יָדִי בּוֹ
  choice: Que ce ne soit pas ma main qui le frappe
  rationale: Explicite sobrement la métonymie de la main hostile sans ajouter que Saül souhaite directement le tuer.
theological_decisions:
- issue: Caractère sacré attribué par Saül aux combats
  choice: « les guerres de l’Éternel »
  alternative: « les combats pour l’Éternel »
  rationale: 'La formulation conserve le génitif hébreu et sa tension narrative : Saül invoque les guerres de Dieu alors que le narrateur dévoile son dessein meurtrier.'
- issue: Nature de la déclaration finale de Saül
  choice: « Saül se disait »
  alternative: « Car Saül avait dit »
  rationale: Le rendu présente son calcul intérieur sans trancher au-delà du contexte sur le moment précis ou l’éventuelle expression orale de cette pensée.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste claire pour un large lectorat; le contraste entre la promesse publique et le calcul secret de Saül est préservé.
