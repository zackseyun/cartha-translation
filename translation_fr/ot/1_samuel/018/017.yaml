review_pass:
  verdict: revise
  source_fidelity: 'La proposition de mariage et l’appellation « ma fille aînée, Mérab » rendent bien le texte hébreu. Toutefois, « qui le frappe » explicite indûment la locution « ma main [ne soit] pas contre lui » : le texte exprime l’hostilité ou l’action contre David sans préciser le geste. La relation causale introduite par וְ (« car » dans ce contexte) devrait également être rendue.'
  naturalness: « Combats dans les guerres de l’Éternel » est compréhensible, mais moins idiomatique que « mène les combats de l’Éternel ». La formulation révisée demeure narrative et naturelle en français international moderne.
  terminology: « Saül », « Mérab », « Philistins » et « l’Éternel » sont cohérents avec le registre biblique français retenu. « Les combats de l’Éternel » conserve le pluriel et le génitif hébreux sans répétition lourde.
  issues:
  - severity: medium
    issue: Ajout de « qui le frappe »
    rationale: אַל־תְּהִי יָדִי בּוֹ signifie littéralement que la main de Saül ne soit pas contre David. Le verbe « frapper » restreint l’expression à une violence physique explicite, alors que l’hébreu conserve une formulation plus générale.
  - severity: low
    issue: Absence de marqueur causal avant la pensée de Saül
    rationale: Le second « Saül dit » explique son offre et son exigence; « Car Saül se disait » rend clairement ce lien narratif.
  - severity: low
    issue: 'Collocation peu naturelle : « combats dans les guerres »'
    rationale: Le verbe « mener » s’emploie naturellement avec « combats » et préserve l’idée de participer activement aux batailles de l’Éternel.
  revised_text: 'Alors Saül dit à David : « Voici ma fille aînée, Mérab. Je te la donnerai pour femme. Seulement, sois pour moi un vaillant guerrier et mène les combats de l’Éternel. » Car Saül se disait : « Que ma main ne soit pas contre lui, mais que celle des Philistins soit contre lui ! »'
