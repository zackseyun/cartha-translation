revisions:
- from: 'Alors Saül dit à David : « Voici ma fille aînée, Mérab. Je te la donnerai pour femme. Seulement, sois pour moi un vaillant guerrier et combats dans les guerres de l’Éternel. » Saül se disait : « Que ce ne soit pas ma main qui le frappe, mais celle des Philistins ! »'
  to: 'Alors Saül dit à David : « Voici ma fille aînée, Mérab. Je te la donnerai pour femme. Seulement, sois pour moi un vaillant guerrier et mène les combats de l’Éternel. » Car Saül se disait : « Que ma main ne soit pas contre lui, mais que celle des Philistins soit contre lui ! »'
  rationale: La révision retire l’explicitation non nécessaire de la « main » hostile, ajoute le lien causal porté par le récit et améliore la tournure française concernant les combats, tout en préservant le sens, le registre et l’ambiguïté du texte source.
  reviewer_model: gpt-5.6-terra
