  text: וַ/יַּ֣רְא שָׁא֔וּל אֲשֶׁר ה֖וּא מַשְׂכִּ֣יל מְאֹ֑ד וַ/יָּ֖גָר מִ/פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/015.yaml
  text: When Saul saw that he was very successful[b][a], he was afraid of him.
translation:
  language: fr
  text: Quand Saül vit que David réussissait très bien[a], il eut peur de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se conduisait avec beaucoup de sagesse» ou «prospérait grandement». Le verbe hébreu peut désigner une conduite avisée ainsi que la réussite qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא שָׁאוּל
  choice: Quand Saül vit
  rationale: Le premier verbe fait avancer le récit tout en établissant naturellement en français la circonstance qui provoque la réaction exprimée dans la seconde proposition.
- source_word: אֲשֶׁר הוּא
  choice: que David
  rationale: Le pronom hébreu renvoie à David. Répéter son nom évite en français une succession ambiguë de pronoms masculins sans modifier le référent.
- source_word: מַשְׂכִּיל מְאֹד
  choice: réussissait très bien
  rationale: Le participe hiphil de שׂכל peut exprimer une conduite avisée ou la réussite qui en découle. Dans ce contexte, la réussite visible de David motive la peur de Saül; la note conserve l'autre nuance authentique.
- source_word: וַיָּגָר
  choice: il eut peur
  rationale: Dans ce contexte, גור exprime la peur ou la crainte. «Eut peur» est direct, naturel et n'impose pas au verbe une durée que sa forme narrative ne précise pas.
- source_word: מִפָּנָיו
  choice: de lui
  rationale: Littéralement «de devant lui»; il s'agit d'une tournure hébraïque exprimant la personne que Saül craint. «De lui» en donne le sens idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La répétition de «David» clarifie les référents; la note maintient l'ambiguïté lexicale entre conduite prudente et réussite.
