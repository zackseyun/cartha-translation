  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: fr
  text: 'Saül lança sa lance et dit : « Je vais clouer David au mur. » Mais David se déroba devant lui, par deux fois.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: lança
  rationale: Le verbe décrit ici l’action de projeter la lance; « lança » est direct et naturel en français.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: Je vais clouer David au mur
  rationale: L’expression hébraïque évoque le fait de frapper David avec la lance jusque dans le mur. Cette formulation française restitue naturellement l’intention meurtrière et l’image, tandis qu’une note conserve la forme littérale inhabituelle.
- source_word: וַיִּסֹּב דָּוִד מִפָּנָיו
  choice: David esquiva le coup
  rationale: Littéralement, David se détourne ou s’écarte de devant Saül. Dans ce contexte, « esquiva le coup » exprime clairement et naturellement le mouvement d’évitement sans préciser davantage sa manière.
- source_word: פַּעֲמָיִם
  choice: à deux reprises
  rationale: Rend explicitement le duel hébreu signifiant « deux fois » et laisse ouverte la question de savoir comment les deux tentatives se sont déroulées.
