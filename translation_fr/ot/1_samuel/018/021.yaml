revisions:
- from: 'Saül se dit : « Je la lui donnerai, afin qu’elle devienne un piège pour lui et que la main des Philistins se dresse contre lui. » Puis Saül dit à David : « Par la seconde[a], tu peux devenir aujourd’hui mon gendre. »'
  to: 'Saül dit : « Je la lui donnerai, afin qu’elle devienne un piège pour lui et que la main des Philistins soit contre lui. » Puis Saül dit à David : « Par la seconde[a], tu peux devenir aujourd’hui mon gendre. »'
  rationale: La révision évite d’ajouter que Saül parle intérieurement et remplace une image française moins idiomatique par une formulation qui reflète directement l’hébreu. L’ambiguïté de « par la seconde » reste préservée dans le texte et explicitée en note.
