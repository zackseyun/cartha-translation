base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: fr
  text: 'Saül dit : « Je la lui donnerai, afin qu’elle devienne un piège pour lui et que la main des Philistins soit contre lui. » Puis Saül dit à David : « Par la seconde[a], tu peux devenir aujourd’hui mon gendre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour la deuxième fois, tu peux devenir aujourd’hui mon gendre. » L’expression hébraïque est elliptique et peut désigner soit la seconde fille de Saül, soit une deuxième occasion offerte à David d’entrer par mariage dans la famille de Saül.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: Je la lui donnerai
  rationale: Dans ce contexte matrimonial, נתן avec un objet féminin signifie donner sa fille en mariage. La formulation brève conserve l’expression hébraïque, le contexte explicitant le sens.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: afin qu’elle devienne un piège pour lui
  rationale: מוֹקֵשׁ désigne un piège ou un lacet. « Piège » est naturel en français moderne et conserve la métaphore ainsi que la valeur de but du verbe dans ce contexte.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: et que la main des Philistins se dresse contre lui
  rationale: La traduction maintient l’image hébraïque de la « main », symbole de puissance et d’action hostile, tout en rendant clairement son orientation contre David.
- source_word: בִּשְׁתַּיִם
  choice: Par la seconde
  rationale: L’expression est elliptique. Dans le contexte, « la seconde » peut désigner la deuxième fille de Saül, Mikal, et ב peut avoir une valeur instrumentale. L’ambiguïté avec une deuxième occasion est signalée en note.
- source_word: תִּתְחַתֵּן בִּי
  choice: tu peux devenir mon gendre
  rationale: Le hitpael de חתן avec ב exprime l’entrée dans une alliance matrimoniale. Ici, l’expression française précise naturellement que David deviendrait le gendre de Saül.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: הַיּוֹם signifie normalement « aujourd’hui » et conserve ici la force immédiate de la proposition de Saül.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Saül se dit… Puis Saül dit
  rationale: La première parole exprime manifestement le projet intérieur de Saül, tandis que la seconde s’adresse à David. Cette distinction naturelle en français préserve les deux actes de parole du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La métaphore de la main hostile est conservée, tandis que les tournures matrimoniales sont rendues idiomatiquement. L’ellipse difficile de בִּשְׁתַּיִם reste visible dans le texte et son autre interprétation est donnée en note.
