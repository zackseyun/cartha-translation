  yaml_path: translation/ot/1_samuel/018/009.yaml
  text: And Saul eyed David from that day forward[a].
translation:
  language: fr
  text: À partir de ce jour-là, Saül se mit à regarder David d’un mauvais œil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mit à surveiller David avec méfiance ». Le terme hébreu évoque ici un regard hostile, jaloux ou soupçonneux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: regarda
  rationale: La construction narrative avec היה introduit ici l’état durable exprimé par le verbe suivant. En français, le début de cet état est rendu naturellement par le complément « À partir de ce jour-là » sans traduire séparément la formule hébraïque.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: עון
  choice: regarda … d’un mauvais œil
  rationale: Cette forme rare ou défective désigne dans ce contexte un regard défavorable, marqué par l’hostilité, la jalousie ou la méfiance. L’expression française conserve cette nuance négative sans trancher précisément entre ces motivations.
- source_word: אֶת
  choice: —
  rationale: Marque de l’objet direct en hébreu, sans équivalent lexical distinct en français.
- source_word: דָּוִד
  choice: David
  rationale: Forme française standard du nom propre.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: À partir de ce jour-là
  rationale: Cette tournure française exprime le point de départ et la continuation dans le temps indiqués par l’ensemble de l’expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’expression idiomatique « regarder d’un mauvais œil » rend la durabilité et l’hostilité du regard tout en préservant l’ambiguïté entre jalousie et soupçon.
