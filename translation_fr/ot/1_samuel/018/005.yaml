source:
  edition: WLC
  text: וַ/יֵּצֵ֨א דָוִ֜ד בְּ/כֹל֩ אֲשֶׁ֨ר יִשְׁלָחֶ֤/נּוּ שָׁאוּל֙ יַשְׂכִּ֔יל וַ/יְשִׂמֵ֣/הוּ שָׁא֔וּל עַ֖ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֑ה וַ/יִּיטַב֙ בְּ/עֵינֵ֣י כָל הָ/עָ֔ם וְ/גַ֕ם בְּ/עֵינֵ֖י עַבְדֵ֥י שָׁאֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: fr
  text: David allait partout où Saül l’envoyait et agissait avec discernement[a]. Saül le mit donc à la tête des hommes de guerre. Cela parut bon à tout le peuple ainsi qu’aux serviteurs de Saül[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réussissait » ou « prospérait ». Le verbe hébreu peut désigner à la fois une conduite avisée et la réussite qui en découle.
    reason: lexical_alternative
  - marker: b
    text: Ou « cela plut à tout le peuple ainsi qu’aux serviteurs de Saül ». En hébreu, ce qui est ainsi jugé favorable peut être David lui-même, sa nomination ou l’ensemble de la situation qui vient d’être décrite.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: allait
  rationale: Le verbe יצא signifie littéralement « sortir, aller ». Dans cette construction distributive et ce contexte de missions répétées, l’imparfait « allait » rend naturellement l’action habituelle sans préciser indûment qu’il s’agissait toujours de campagnes militaires.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: partout où Saül l’envoyait
  rationale: Cette formulation française rend le sens distributif de « dans tout ce pour quoi Saül l’envoyait » tout en restant fluide. « Dans toutes les missions que Saül lui confiait » serait possible, mais expliciterait davantage la nature des envois.
- source_word: יַשְׂכִּיל
  choice: agissait avec discernement
  rationale: Le hiphil de שׂכל peut exprimer une conduite avisée aussi bien que la réussite qui en résulte. « Agissait avec discernement » maintient au premier plan la prudence et la sagesse pratique, tandis que la note conserve le sens possible de réussite.
- source_word: וַיְשִׂמֵהוּ
  choice: le mit
  rationale: Avec la préposition עַל, שׂים exprime ici le fait de placer quelqu’un en position d’autorité. « Le mit à la tête de » est une tournure française naturelle qui conserve l’image du texte sans surcharger le registre administratif.
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: à la tête des hommes de guerre
  rationale: « Hommes de guerre » rend directement l’expression hébraïque et garde sa portée militaire masculine collective. « Soldats » serait plus courant, mais légèrement plus interprétatif.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Cela parut bon à
  rationale: La tournure exprime une appréciation favorable tout en laissant « cela » reprendre globalement ce qui précède. La note signale que le sujet implicite de l’hébreu demeure ouvert.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: עם désigne ici le peuple dans son ensemble; rien n’impose de le limiter aux troupes.
- source_word: עַבְדֵי שָׁאוּל
  choice: les serviteurs de Saül
  rationale: עבדים peut englober les serviteurs, courtisans ou agents royaux. « Serviteurs » est le rendu le plus direct et le moins restrictif.
theological_decisions:
- issue: Sujet implicite de וַיִּיטַב
  choice: Le texte principal emploie « cela » et la note maintient l’indétermination du référent.
  alternative: Comprendre que David lui-même plaisait au peuple et aux serviteurs de Saül, ou que sa nomination leur plaisait.
  rationale: L’hébreu n’énonce pas explicitement le sujet de וַיִּיטַב. Il convient donc de ne pas transformer une ambiguïté grammaticale et narrative en affirmation théologique ou psychologique certaine.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait rend la dimension habituelle des missions confiées à David. Les expressions « hommes de guerre » et « serviteurs de Saül » conservent la texture sociale et militaire de l’hébreu, tandis que les notes préservent ses principales ambiguïtés lexicales et syntaxiques.
