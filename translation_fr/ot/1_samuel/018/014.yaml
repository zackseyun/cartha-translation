id: 1SA.18.14
reference: 1 Samuel 18:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֥י דָוִ֛ד לְ/כָל דָּרְכָ֖/ו מַשְׂכִּ֑יל וַֽ/יהוָ֖ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: fr
  text: David se conduisait avec sagesse dans toutes ses démarches[a], et Yahweh était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réussissait dans tout ce qu’il faisait » ; le terme hébreu peut désigner une conduite avisée qui aboutit à la réussite.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיְהִי דָוִד
  choice: David agissait
  rationale: La construction introduit ici une conduite habituelle de David; l’imparfait français exprime naturellement cette continuité dans le récit.
- source_word: לְכָל דָּרְכָו
  choice: dans toutes ses entreprises
  rationale: Littéralement «dans toutes ses voies»; dans ce contexte narratif, l’expression désigne tout ce que David entreprend. Cette formulation est naturelle en français tout en maintenant la portée générale.
- source_word: מַשְׂכִּיל
  choice: avec sagesse
  rationale: Le participe de שכל au hiphil peut exprimer une conduite avisée ainsi que la réussite qui en découle. «Agissait avec sagesse» maintient au premier plan la prudence sans exclure le succès.
- source_word: וַיהוָה
  choice: et Yahweh
  rationale: Le nom divin יהוה est rendu par «Yahweh», afin de représenter le nom personnel présent dans le texte hébreu.
- source_word: עִמּוֹ
  choice: était avec lui
  rationale: Cette expression rend directement la présence et le soutien divins, sans préciser davantage leur modalité.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme; «Yahweh» préserve la distinction entre le nom divin et le titre «Seigneur».
- issue: Rapport entre sagesse et réussite dans מַשְׂכִּיל
  choice: agissait avec sagesse
  alternative: réussissait / prospérait
  rationale: Le terme peut viser tant la conduite avisée que son heureux résultat. Le texte principal privilégie le sens comportemental, tandis que la note conserve l’autre possibilité sans imposer un lien théologique simplifié entre sagesse et réussite.
translation_notes:
  register: Français moderne, clair et digne. «Entreprises» est employé au sens de ce que David entreprend, non au sens commercial. La formulation garde le parallélisme simple du récit hébreu.
