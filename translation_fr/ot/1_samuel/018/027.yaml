base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: fr
  text: David se leva et partit, lui et ses hommes. Il tua deux cents Philistins. Puis David apporta leurs prépuces, et ils les remirent au roi au nombre complet[a], afin qu’il devienne le gendre du roi. Alors Saül lui donna sa fille Mikal pour femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils les comptèrent intégralement devant le roi ». Le verbe hébreu est difficile : il peut évoquer soit le comptage, soit la remise du nombre complet exigé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: David se leva donc et partit avec ses hommes
  rationale: « Se leva » conserve l’élan narratif de קום, tandis que « partit avec ses hommes » rend naturellement en français l’insistance du pronom explicite הוּא sans produire une tournure maladroite.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: Il tua deux cents Philistins
  rationale: Dans ce contexte militaire, נכה désigne une action mortelle, ce que confirme la collecte des prépuces. « Tua » est direct et idiomatique en français.
- source_word: עָרְלֹתֵיהֶם
  choice: leurs prépuces
  rationale: Le terme anatomique direct respecte le sens explicite de l’hébreu et ne dissimule pas la nature du prix nuptial exigé.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: on en présenta le nombre complet au roi
  rationale: La forme hébraïque est difficile. Cette formulation rend l’idée contextuelle d’une remise correspondant intégralement au nombre requis, sans imposer l’idée précise d’un comptage public.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: afin qu’il devienne le gendre du roi
  rationale: Le hitpael de חתן exprime ici l’entrée dans une alliance matrimoniale; dans le contexte, devenir le gendre du roi est la formulation française la plus précise.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: Alors Saül lui donna pour femme sa fille Mikal
  rationale: La formulation conserve l’idiome matrimonial du texte tout en restant claire et naturelle en français moderne. La graphie « Mikal » distingue le nom féminin biblique du prénom français Michel.
