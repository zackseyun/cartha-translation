base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: fr
  text: Saül avançait d’un côté de la montagne[a], et David et ses hommes se trouvaient de l’autre côté. David se dépêchait de s’éloigner de Saül, tandis que Saül et ses hommes se resserraient autour de David et de ses hommes pour les capturer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Saül allait du côté de la montagne, de ce côté-ci, et David et ses hommes du côté de la montagne, de ce côté-ci. » La traduction « d’un côté… de l’autre côté » explicite le contraste spatial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « encerclaient David et ses hommes pour s’emparer d’eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: avançait
  rationale: L’imparfait français rend naturellement le mouvement en cours et simultané dans cette scène de poursuite.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: d’un côté de la montagne ... de l’autre côté
  rationale: La formulation idiomatique française exprime clairement le contraste spatial visé par la répétition hébraïque de « de ce côté ».
- source_word: נֶחְפָּז
  choice: se dépêchait
  rationale: Le participe nifal exprime une hâte pressante; « se dépêchait » est actuel et naturel sans ajouter l’idée de panique.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: de s’éloigner de Saül
  rationale: Cette formulation conserve l’idée littérale d’aller loin de Saül sans renforcer le verbe en « fuir ».
- source_word: עֹטְרִים
  choice: se rapprochaient de
  rationale: Dans ce contexte tactique, le participe décrit les hommes de Saül qui resserrent leur mouvement autour de David; la note conserve le sens plus littéral « encerclaient ».
- source_word: לְתָפְשָׂם
  choice: pour les capturer
  rationale: L’infinitif exprime le but, et « capturer » convient précisément au contexte de poursuite armée.
