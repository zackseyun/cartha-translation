base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: fr
  text: Voyez donc et renseignez-vous sur toutes les cachettes où il se dissimule. Puis revenez vers moi avec des informations certaines, et j’irai avec vous. S’il est dans le pays, je le rechercherai parmi tous les clans[a] de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les milliers de Juda » ; il s’agit probablement des clans ou des subdivisions familiales de Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: Examinez donc … et renseignez-vous bien
  rationale: Les deux impératifs appellent ici à observer et à obtenir des renseignements fiables. Cette formulation française exprime leur portée pratique sans les réduire à un simple savoir abstrait.
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: toutes les cachettes où il se dissimule
  rationale: מַחֲבֹא désigne une cachette ou un lieu de refuge secret. « Se dissimule » rend la forme réflexive de חבא; le שָׁם spatial est naturellement inclus dans « où » en français.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: Puis revenez me voir avec des informations sûres
  rationale: Le parfait précédé de ו poursuit la série d’ordres. נָכוֹן indique ici ce qui est établi ou certain; l’ajout explicatif « informations » produit un français naturel dans ce contexte de reconnaissance.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: et j’irai avec vous
  rationale: Traduction directe de la promesse de Saül qui suivra leur retour.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: S’il est dans le pays
  rationale: La tournure conditionnelle hébraïque se rend naturellement ainsi. « Le pays » conserve la portée géographique de אֶרֶץ sans préciser davantage un territoire que le texte ne nomme pas ici.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: je le rechercherai
  rationale: חפשׂ exprime une recherche attentive. « Rechercherai » garde cette idée sans introduire la nuance plus familière de « traquer ».
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: parmi tous les clans de Juda
  rationale: אַלְפֵי signifie littéralement « milliers », mais peut désigner les subdivisions familiales ou sociales d’une tribu. « Clans » communique clairement ce sens probable, tandis que le sens littéral est signalé en note.
theological_decisions: []
