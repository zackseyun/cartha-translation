base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: fr
  text: 'David consulta de nouveau l’Éternel. L’Éternel lui répondit : « Lève-toi, descends à Keïla, car je vais livrer les Philistins entre tes mains. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד ... לִשְׁאֹל
  choice: consulta de nouveau
  rationale: L’expression hébraïque marque la répétition de la consultation; cette formulation est naturelle en français tout en gardant le sens.
- source_word: בַּיהוָה / יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et immédiatement reconnaissable du tétragramme dans le récit biblique.
- source_word: קוּם רֵד
  choice: Lève-toi, descends
  rationale: Conserve les deux impératifs hébreux et leur vigueur, sans réduire le premier à une simple particule d’encouragement.
- source_word: אֲנִי נֹתֵן
  choice: je vais livrer
  rationale: Le participe exprime ici une action divine imminente et assurée; « livrer » convient au contexte militaire.
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Préserve l’image idiomatique hébraïque de la remise au pouvoir de David et de ses hommes.
theological_decisions:
- issue: Certitude de la promesse divine exprimée par le participe נֹתֵן
  choice: je vais livrer
  alternative: je livre / je suis en train de livrer
  rationale: Le contexte présente une action future comme décidée et certaine, sans exiger qu’elle ait déjà commencé.
- issue: Représentation du nom divin יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: Ce choix suit un usage français biblique largement établi, sans ajouter d’interprétation doctrinale au verset.
translation_notes:
  register: 'Français international moderne, narratif et digne. La répétition de « l’Éternel » suit l’hébreu; le second « et dit » n’est pas reproduit séparément, car « répondit : » l’intègre naturellement en français.'
