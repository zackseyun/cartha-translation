  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: fr
  text: Saül cessa de poursuivre David et alla à la rencontre des Philistins. C’est pourquoi on appela ce lieu le Rocher de la Séparation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Rocher des Séparations », « le Rocher des Divisions » ou « le Rocher de la Rupture ». Ce nom fait probablement allusion à l’interruption de la poursuite de David par Saül.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: cessa donc
  rationale: Dans la construction avec מִרְדֹף, le verbe indique que Saül abandonne la poursuite en cours. « Cessa donc » exprime naturellement ce changement d’action en français, tandis que « donc » rattache la décision à l’urgence mentionnée au verset précédent.
- source_word: מִרְדֹף אַחֲרֵי דָוִד
  choice: de poursuivre David
  rationale: La préposition מן avec l’infinitif marque ici l’interruption d’une activité. « Poursuivre » convient au contexte militaire et narratif.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: à la rencontre des Philistins
  rationale: Cette expression peut désigner le fait d’aller rencontrer quelqu’un, y compris pour l’affronter. La formulation retenue préserve cette latitude sans expliciter davantage que l’hébreu.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette formule introduit l’explication du nom donné au lieu. « C’est pourquoi » est naturel, clair et digne en français moderne.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: on appela cet endroit
  rationale: Le pluriel hébreu a un sujet indéfini. Le pronom « on » le rend idiomatiquement sans inventer d’acteur précis.
- source_word: סֶלַע
  choice: Rocher
  rationale: Le nom désigne un rocher, un escarpement ou une formation rocheuse. « Rocher » convient bien à un nom de lieu.
- source_word: הַמַּחְלְקוֹת
  choice: de la Séparation
  rationale: Le terme évoque des divisions, séparations ou départs. Le singulier abstrait produit un toponyme français naturel, tandis que les autres nuances et la forme plurielle de l’hébreu sont signalées en note.
