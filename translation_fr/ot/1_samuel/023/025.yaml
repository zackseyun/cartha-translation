base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: fr
  text: Saül et ses hommes partirent à sa recherche. On informa David ; il descendit au rocher[a] et resta dans le désert de Maon. Lorsque Saül l’apprit, il poursuivit David dans le désert de Maon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le roc » ou « l’escarpement ». L’hébreu peut désigner une importante formation rocheuse.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: à sa recherche
  rationale: L’infinitif exprime le but du déplacement. Le pronom renvoyant à David est fourni par le contexte, comme l’exige le français naturel.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: On en informa David
  rationale: Le pluriel actif a un sujet indéterminé. Le pronom « on » restitue naturellement cette indétermination, et « en » reprend la venue de Saül et de ses hommes.
- source_word: וַיֵּרֶד
  choice: il descendit
  rationale: Le verbe marque un mouvement vers le bas. Le sujet implicite est David, nommé immédiatement auparavant.
- source_word: הַסֶּלַע
  choice: le rocher
  rationale: Le nom désigne une masse ou formation rocheuse, peut-être un lieu notable. « Le rocher » conserve l’image sans préciser indûment sa topographie.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce contexte narratif, le verbe indique que David demeura quelque temps sur place, sans nécessairement suggérer une installation durable.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: dans le désert de Maon
  rationale: « Désert » est ici le terme français courant pour une région sauvage et peu habitée ; il ne suppose pas nécessairement une étendue de sable.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: il poursuivit
  rationale: Le verbe avec אַחֲרֵי forme l’expression naturelle « poursuivre quelqu’un » en français.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: Saül et ses hommes partirent donc
  rationale: La construction fait progresser le récit et découle du contexte précédent. « Partirent donc » est idiomatique et conserve ce lien narratif.
- source_word: וַיִּשְׁמַע שָׁאוּל
  choice: Quand Saül l’apprit
  rationale: Littéralement, Saül « entendit ». Ici, l’emploi absolu signifie qu’il apprit où se trouvait David ; le pronom neutre conserve l’objet implicite.
