revisions:
- from: Saül et ses hommes partirent donc à sa recherche. On en informa David[a] ; il descendit alors vers le rocher et resta dans le désert de Maon. Quand Saül l’apprit, il poursuivit David dans le désert de Maon.
  to: Saül et ses hommes partirent à sa recherche. On informa David ; il descendit au rocher[a] et resta dans le désert de Maon. Lorsque Saül l’apprit, il poursuivit David dans le désert de Maon.
  rationale: La révision évite d’expliciter le contenu du message transmis à David, rend le mouvement vers le rocher avec davantage de précision et replace la note lexicale sur son référent correct. Elle conserve le registre, les noms propres et l’ambiguïté du texte hébreu.
