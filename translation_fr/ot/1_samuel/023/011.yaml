source:
  edition: WLC
  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: fr
  text: '« Les hommes de Qeïla me livreront-ils entre ses mains[a] ? Saül descendra-t-il, comme ton serviteur l’a appris ? Yahweh, Dieu d’Israël, je t’en prie, fais-le savoir à ton serviteur. » Yahweh répondit : « Il descendra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa main », expression qui signifie « en son pouvoir ».'
    reason: La note signale l’image hébraïque sous l’expression française idiomatique « entre ses mains ».
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: me livreront-ils
  rationale: Le hifil de סגר signifie ici remettre quelqu’un au pouvoir d’un autre. « Livrer » exprime naturellement en français ce transfert hostile.
- source_word: בַעֲלֵי קְעִילָה
  choice: les hommes de Qeïla
  rationale: Dans ce contexte civique, בעלי désigne les hommes qui représentent ou composent la communauté de Qeïla, plutôt que des « propriétaires » au sens littéral.
- source_word: בְיָדוֹ
  choice: entre ses mains
  rationale: Cette expression française conserve l’image hébraïque de la main comme symbole de pouvoir et renvoie ici à l’autorité de Saül.
- source_word: יֵרֵד
  choice: descendra / Il descendra
  rationale: ירד signifie littéralement « descendre ». Le même verbe est conservé dans la question et dans la réponse divine.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: comme ton serviteur l’a appris
  rationale: La formulation rend l’appel de David aux nouvelles qu’il a reçues, tout en gardant son humble manière de parler de lui-même.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans une prière adressée à Dieu, עבד est une formule conventionnelle d’humilité ; « serviteur » convient mieux au registre que « esclave ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: הַגֶּד נָא לְעַבְדֶּךָ
  choice: je t’en prie, fais-le savoir à ton serviteur
  rationale: L’impératif de נגד accompagné de נא exprime une demande pressante mais respectueuse. Cette formulation est naturelle et digne en français moderne.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahweh répondit
  rationale: Dans ce dialogue, « répondit » rend naturellement la formule narrative « et Yahweh dit » en explicitant sans ambiguïté sa fonction contextuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel du Dieu d’Israël sans lui substituer un titre.
- issue: Portée de la réponse divine
  choice: « Il descendra » répond seulement à la seconde question
  alternative: Reformuler pour faire répondre Dieu aux deux questions
  rationale: Le texte hébreu ne donne ici qu’une réponse explicite, יֵרֵד, correspondant à la question sur la venue de Saül. La traduction conserve cette tension narrative sans compléter la réponse.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative soutenue convient à une prière sans paraître archaïque. Le nom Qeïla suit une translittération française courante, et la répétition de « descendra » préserve le lien verbal précis entre la question et la réponse.
