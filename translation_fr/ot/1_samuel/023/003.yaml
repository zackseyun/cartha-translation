  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י דָוִד֙ אֵלָ֔י/ו הִנֵּ֨ה אֲנַ֥חְנוּ פֹ֛ה בִּֽ/יהוּדָ֖ה יְרֵאִ֑ים וְ/אַף֙ כִּֽי נֵלֵ֣ךְ קְעִלָ֔ה אֶל מַֽעַרְכ֖וֹת פְּלִשְׁתִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: fr
  text: 'Mais les hommes de David lui dirent : « Vois : même ici, en Juda, nous avons peur. À plus forte raison si nous allons à Qeïla affronter les lignes de bataille des Philistins ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mais ... dirent
  rationale: Le waw fait progresser le récit, tandis que « Mais » rend ici l’opposition entre l’ordre reçu précédemment et la réaction craintive des hommes.
- source_word: אַנְשֵׁי דָוִד
  choice: les hommes de David
  rationale: Cette tournure française naturelle conserve l’idée du groupe attaché à David.
- source_word: הִנֵּה
  choice: Vois
  rationale: L’impératif attire avec insistance l’attention de David sur leur situation présente, sans recourir à l’archaïque « voici » employé isolément.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: même ici, en Juda, nous avons peur
  rationale: 'Le français naturel emploie « avoir peur ». « Même » explicite sobrement la valeur argumentative du lieu : ils ont déjà peur alors qu’ils se trouvent en Juda.'
- source_word: וְאַף כִּי
  choice: À plus forte raison si
  rationale: L’expression hébraïque introduit un raisonnement du moindre au plus grand. Cette locution française en restitue clairement la force.
- source_word: נֵלֵךְ קְעִלָה
  choice: nous allons à Qeïla
  rationale: Le verbe de mouvement suivi du nom de lieu indique la destination.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: affronter les lignes de bataille des Philistins
  rationale: מַעַרְכוֹת désigne les rangs ou lignes disposés pour le combat. « Affronter » rend la confrontation impliquée par le contexte sans élargir le terme au sens général d’« armées ».
