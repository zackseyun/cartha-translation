base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: fr
  text: 'Allez donc, prenez encore des dispositions ; renseignez-vous et repérez l’endroit où il se trouve[a], ainsi que celui qui l’y a vu. Car on m’a dit[b] : « Il agit avec beaucoup de ruse[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son lieu, où sera son pied », expression qui désigne l’endroit où il se trouve ou ses déplacements.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Car il m’a dit » ; le texte hébreu ne précise pas qui est le sujet du verbe « dire ».'
    reason: alternative_reading
  - marker: c
    text: 'L’hébreu associe deux mots de même racine, littéralement quelque chose comme : « rusé, il agit avec ruse », afin de renforcer l’idée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: renseignez-vous encore avec soin
  rationale: Le hiphil de כון exprime ici l’idée de préparer ou d’établir avec certitude; dans le contexte d’une reconnaissance, cette formulation française rend naturellement l’ordre de pousser plus loin les vérifications.
- source_word: וּדְעוּ וּרְאוּ
  choice: repérez … et découvrez
  rationale: Les deux impératifs cumulatifs appellent une enquête attentive. Leur force est conservée au moyen de deux verbes français naturels plutôt que par un calque lourd (« sachez et voyez »).
- source_word: מְקוֹמוֹ אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: l’endroit où il se trouve
  rationale: Littéralement, le texte évoque « son endroit où sera son pied ». L’expression désigne ici les déplacements ou la position de David; le français idiomatique en donne le sens, tandis qu’une note conserve l’image concrète.
- source_word: מִי רָאָהוּ שָׁם
  choice: qui l’y a vu
  rationale: Cette traduction directe préserve la demande d’identifier un témoin ayant effectivement vu David à cet endroit.
- source_word: כִּי אָמַר אֵלַי
  choice: Car on m’a dit
  rationale: Le verbe hébreu est à la troisième personne masculine du singulier, mais son sujet n’est pas exprimé. Le tour impersonnel français évite d’identifier sans preuve celui qui a parlé; l’autre lecture est signalée en note.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: Il agit avec beaucoup de ruse
  rationale: L’adjectif et le verbe apparentés forment une expression intensive. « Avec beaucoup de ruse » transmet cette insistance et convient au jugement méfiant que Saül porte sur David.
theological_decisions:
- issue: Identité du sujet de אָמַר (« a dit »)
  choice: 'Tour impersonnel : « on m’a dit »'
  alternative: « il m’a dit »
  rationale: Le texte hébreu ne nomme pas le sujet. Le choix principal préserve cette indétermination sans attribuer la parole à David ou à un informateur précis.
translation_notes:
  register: Français international moderne, clair et digne. Le discours conserve le ton direct de l’ordre de Saül. Les formulations très hébraïques sont rendues idiomatiquement dans le texte, avec leur image ou leur ambiguïté documentée en notes.
