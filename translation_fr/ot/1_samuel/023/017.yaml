  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: fr
  text: 'Il lui dit : « N’aie pas peur, car la main de Saül, mon père, ne t’atteindra pas[a]. Tu régneras sur Israël, et moi, je serai ton second[b]. Même Saül, mon père, le sait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la main de Saül, mon père, ne te trouvera pas ». La « main » représente ici sa puissance ou son emprise. Autre traduction possible : « le pouvoir de Saül, mon père, ne t’atteindra pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je serai le second après toi » ; c’est-à-dire que Jonathan occuperait le rang immédiatement inférieur à celui de David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Formulation idiomatique et courante en français moderne pour l’impératif négatif du verbe ירא, sans atténuer sa force.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: la main de Saül, mon père, ne t’atteindra pas
  rationale: Conserve l’image hébraïque de la « main », qui représente ici la puissance ou l’emprise, tout en rendant le verbe par une expression naturelle en français. Le sens littéral « ne te trouvera pas » est signalé en note.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: Tu régneras sur Israël
  rationale: Rend directement la forme verbale de מלך et exprime clairement l’exercice futur de la royauté.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: et moi, je serai le second après toi
  rationale: מִשְׁנֶה désigne ici une position de second rang. Cette formulation maintient la hiérarchie relationnelle sans imposer un titre administratif moderne.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: Même Saül, mon père, le sait
  rationale: « Même » rend ici la valeur emphatique de וְגַם, tandis que « le » reprend naturellement en français l’ensemble de l’affirmation précédente.
theological_decisions:
- issue: Degré d’explicitation de la prédiction de la royauté de David et du rôle subordonné de Jonathan
  choice: Présenter les paroles comme l’assurance directe que David régnera et que Jonathan occupera le second rang, sans ajout théologique.
  alternative: Les formuler explicitement comme une prophétie de désignation divine ou comme une déclaration messianique.
  rationale: Dans cette phrase, Jonathan exprime avec assurance l’avenir royal de David, mais le texte ne mentionne pas explicitement l’Éternel ni une alliance. La traduction conserve donc la portée politique et providentielle de ses paroles sans résoudre davantage leur implication théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Les répétitions de « Saül, mon père » sont conservées parce qu’elles structurent les paroles de Jonathan. L’image concrète de la « main » est maintenue, mais le verbe est rendu idiomatiquement par « atteindre ».
