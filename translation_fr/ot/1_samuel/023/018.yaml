  text: וַ/יִּכְרְת֧וּ שְׁנֵי/הֶ֛ם בְּרִ֖ית לִ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/חֹ֔רְשָׁה וִ/יהוֹנָתָ֖ן הָלַ֥ךְ לְ/בֵיתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: fr
  text: Tous deux conclurent une alliance devant Yahweh[a]. Puis David resta dans la région boisée[b], et Jonathan alla chez lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « ils coupèrent une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à Horesh » ; l’hébreu peut être compris soit comme un nom de lieu, soit au sens de « région boisée » ou « forêt ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: conclurent
  rationale: L’expression idiomatique כרת ברית signifie littéralement « couper une alliance »; en français actuel, « conclure une alliance » exprime naturellement l’acte solennel.
- source_word: שְׁנֵיהֶם
  choice: Tous deux
  rationale: Cette formulation concise rend explicitement la dualité et l’action commune de David et Jonathan.
- source_word: בְּרִית
  choice: alliance
  rationale: « Alliance » conserve la portée relationnelle et solennelle du terme hébreu, contrairement à « accord », trop faible, ou « traité », trop politique.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Cette traduction directe préserve l’idée que l’alliance est conclue en présence de Dieu et sous son regard.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend distinctement le nom divin exprimé par le tétragramme.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce contexte, le verbe indique que David demeure sur place plutôt que l’action littérale de s’asseoir.
- source_word: בַּחֹרְשָׁה
  choice: dans la région boisée
  rationale: Le nom חֹרֶשׁ peut désigner un bois ou une zone broussailleuse; cette formulation naturelle conserve le sens commun tout en signalant en note la lecture possible comme nom de lieu.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: rentra chez lui
  rationale: Cette expression française naturelle correspond contextuellement à « alla vers sa maison » sans modifier le sens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
- issue: Nature de l’engagement entre David et Jonathan
  choice: alliance
  alternative: accord
  rationale: « Alliance » maintient la solennité religieuse et relationnelle de בְּרִית sans préciser au-delà du texte le contenu de leur engagement.
translation_notes:
  register: Français international moderne, clair et digne. « Tous deux » et « rentra chez lui » assurent une lecture naturelle; les notes conservent l’idiome hébreu et l’ambiguïté réelle de בַּחֹרְשָׁה.
