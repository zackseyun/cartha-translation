base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: fr
  text: Maintenant donc, ô roi, puisque tu désires tant descendre, descends, oui, descends, et ce sera à nous de le livrer entre les mains du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marque une transition immédiate suivie d'un appel; « donc » rend naturellement la force discursive de la conjonction.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: puisque tel est tout ton désir
  rationale: Rend l'idée que la venue du roi correspond pleinement à son vif désir, sans conserver une tournure hébraïque obscure en français.
- source_word: הַמֶּלֶךְ
  choice: ô roi
  rationale: L'article accompagne ici un vocatif. « Ô roi » signale clairement l'adresse directe dans un registre digne.
- source_word: לָרֶדֶת רֵד
  choice: descends ... oui, descends
  rationale: Conserve l'insistance produite par l'infinitif absolu suivi de l'impératif, tout en restant naturel en français.
- source_word: וְלָנוּ
  choice: ce sera à nous
  rationale: Exprime la responsabilité que les locuteurs s'attribuent pour la suite de l'action.
- source_word: הַסְגִּירוֹ
  choice: de le livrer
  rationale: Le hiphil de סגר désigne ici le fait de remettre quelqu'un au pouvoir d'un autre.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: entre les mains du roi
  rationale: Conserve l'image hébraïque du pouvoir et de la maîtrise; le pluriel est la forme idiomatique courante en français.
