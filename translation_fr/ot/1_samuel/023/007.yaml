base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: fr
  text: 'On informa Saül que David était arrivé à Qeïla. Saül dit : « Dieu l’a livré entre mes mains[a], car il s’est enfermé[b] en entrant dans une ville munie de portes et d’une barre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu l’a remis en mon pouvoir. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il se trouve enfermé » ou « il a été enfermé ». La forme hébraïque permet une compréhension réfléchie ou passive.'
    reason: textual_ambiguity
  - marker: c
    text: Il s’agit des battants de la porte d’une ville fortifiée et de la barre transversale servant à les verrouiller.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On informa
  rationale: Le hophal exprime le fait que l’information fut communiquée à Saül. La tournure française reste naturelle tout en conservant l’absence d’un informateur nommé.
- source_word: בָא דָוִד קְעִילָה
  choice: David était arrivé à Qeïla
  rationale: Le plus-que-parfait situe naturellement l’arrivée de David avant le rapport fait à Saül.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: Dieu l’a livré entre mes mains
  rationale: Le verbe נכר a ici le sens de livrer ou remettre au pouvoir de quelqu’un. « Entre mes mains » conserve l’image et l’idiome de domination du texte hébreu.
- source_word: נִסְגַּר
  choice: il s’est enfermé
  rationale: Le nifal peut être compris de manière réfléchie ou passive. Dans le raisonnement de Saül, David s’est lui-même placé dans une position où il peut être bloqué.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: dans une ville munie de portes et d’une barre
  rationale: דלתים évoque les deux battants d’une porte urbaine, et בריח la barre transversale qui les verrouille. La formulation française restitue concrètement la ville fortifiée sans surcharger le texte.
theological_decisions:
- issue: Saül attribue à Dieu la vulnérabilité de David
  choice: 'Présenter directement les paroles de Saül : « Dieu l’a livré entre mes mains »'
  alternative: 'Ajouter une distance interprétative, par exemple : « Saül pensa que Dieu l’avait livré entre ses mains »'
  rationale: L’hébreu rapporte directement l’affirmation de Saül sans indiquer ici que le narrateur l’approuve. La traduction préserve cette tension au lieu de confirmer ou de réfuter son interprétation.
translation_notes:
  register: Français international moderne, courant et digne. Le discours direct conserve l’affirmation théologique de Saül sans la présenter comme un jugement explicite du narrateur. « Qeïla » suit une translittération française claire du nom hébreu.
