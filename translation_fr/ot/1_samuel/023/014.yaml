source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: fr
  text: David resta dans les places fortes du désert ; il resta aussi dans la région montagneuse, dans le désert de Ziph. Saül le cherchait sans cesse, mais Dieu ne le livra pas entre les mains de Saül.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Dans ce contexte de fuite, יָשַׁב indique que David séjourne ou demeure dans ces lieux. « Resta » est naturel en français moderne et exprime la durée sans suggérer une installation permanente.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région aride et peu habitée, sans impliquer nécessairement une étendue de sable. En français biblique courant, « désert » est la désignation géographique la plus naturelle ici.
- source_word: בַּמְּצָדוֹת
  choice: dans les refuges fortifiés
  rationale: מְצָדוֹת désigne des positions défendables ou des lieux forts. « Refuges fortifiés » conserve à la fois leur fonction protectrice pour David et leur caractère défensif.
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: הַר peut désigner une montagne précise ou une zone de hauteurs. Ici, la présence de la préposition définie et le cadre géographique favorisent le sens collectif d’une région montagneuse plutôt que celui d’un sommet unique.
- source_word: בְּמִדְבַּר זִיף
  choice: du désert de Ziph
  rationale: Le groupe construit identifie la zone désertique rattachée à Ziph. Cette formulation française est claire et géographiquement précise.
- source_word: וַיְבַקְשֵׁהוּ
  choice: le rechercha
  rationale: בקשׁ exprime ici la recherche active d’une personne poursuivie. « Rechercha » convient au récit et garde la force de la poursuite.
- source_word: כָּל הַיָּמִים
  choice: sans relâche
  rationale: L’expression signifie littéralement « tous les jours » et souligne la continuité de la poursuite. « Sans relâche » en rend naturellement la valeur durative en français.
- source_word: וְלֹא נְתָנוֹ ... בְּיָדוֹ
  choice: ne le livra pas entre ses mains
  rationale: Le verbe נתן suivi de « dans sa main » forme un idiome signifiant livrer quelqu’un au pouvoir d’un autre. « Livrer entre les mains » conserve l’image sémitique tout en étant idiomatique en français.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים renvoie ici au Dieu d’Israël et commande le sens singulier.
theological_decisions:
- issue: Attribution de la préservation de David à l’action divine
  choice: Dieu ne le livra pas entre ses mains
  alternative: Dieu ne permit pas qu’il tombe entre les mains de Saül
  rationale: Le texte attribue directement à Dieu le fait que David n’est pas livré à Saül. La traduction retenue maintient cette action directe et l’image de la main, sans développer davantage le mode de la providence divine.
translation_notes:
  register: Français moderne, narratif et digne. La répétition hébraïque de וַיֵּשֶׁב est allégée en coordonnant les deux compléments de lieu, sans perte d’information. « Désert » est employé au sens de région aride et peu habitée. Le pronom possessif de « ses mains » reprend naturellement Saül, comme dans l’hébreu.
