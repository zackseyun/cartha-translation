  text: But a messenger came to Saul, saying, “Hurry and come, for the Philistines have made a raid against the land.”
translation:
  language: fr
  text: 'Mais un messager vint trouver Saül et lui dit : « Dépêche-toi et va, car les Philistins ont fait une incursion dans le pays. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: messager
  rationale: Dans ce contexte militaire, le terme désigne un messager humain venu transmettre une nouvelle urgente.
- source_word: מַהֲרָה וְלֵכָה
  choice: Dépêche-toi de venir
  rationale: Rend naturellement en français l’enchaînement impératif exprimant l’urgence, tout en conservant l’idée de déplacement vers la situation signalée.
- source_word: פָשְׁטוּ
  choice: ont lancé une incursion
  rationale: Le verbe décrit ici une irruption ou un raid militaire; « lancé une incursion » restitue cette action sans la réduire au simple fait d’attaquer.
- source_word: עַל הָאָרֶץ
  choice: contre le pays
  rationale: La préposition עַל a ici une valeur hostile; « le pays » conserve la portée générale de אֶרֶץ sans préciser davantage le territoire.
