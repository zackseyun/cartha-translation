  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּ֣י עָלָ֔י/ו שָׁא֖וּל מַחֲרִ֣ישׁ הָ/רָעָ֑ה וַ/יֹּ֨אמֶר֙ אֶל אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן הַגִּ֖ישָׁ/ה הָ/אֵפֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: fr
  text: 'Lorsque David apprit que Saül projetait secrètement de lui faire du mal[a], il dit au prêtre Abiathar : « Apporte ici l’éphod[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « méditait le mal contre lui ».'
    reason: lexical_alternative
  - marker: b
    text: Dans ce récit, l’éphod est un objet sacerdotal associé à la consultation de Dieu pour recevoir sa direction.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: Lorsque David apprit
  rationale: Dans ce récit, le verbe indique que David prend connaissance de la situation à ce moment-là ; « apprit » est plus naturel ici que le simple « savait ».
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que David apprend.
- source_word: עָלָיו
  choice: de lui faire du mal
  rationale: La préposition prend ici un sens hostile dirigé contre David ; la tournure française exprime naturellement cette visée.
- source_word: מַחֲרִישׁ
  choice: projetait secrètement
  rationale: Le participe hiphil de חרש évoque ici une action hostile en cours de préparation, avec une nuance de dissimulation.
- source_word: הָרָעָה
  choice: du mal
  rationale: « Du mal » conserve l’étendue sémantique de רעה tout en désignant clairement le tort que Saül entend infliger à David.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: au prêtre Abiatar
  rationale: Cette formulation française identifie simplement Abiatar par sa fonction.
- source_word: הַגִּישָׁה
  choice: Apporte ici
  rationale: L’impératif hiphil de נגש signifie faire approcher ou présenter ; « apporte ici » rend naturellement l’ordre dans cette scène.
- source_word: הָאֵפוֹד
  choice: l’éphod
  rationale: Le terme traditionnel « éphod » maintient la désignation précise de l’objet sacerdotal sans la réduire à une catégorie plus générale.
theological_decisions:
- issue: Nature du dessein de Saül dans מַחֲרִישׁ הָרָעָה
  choice: Saül projetait secrètement de faire du mal à David
  alternative: Saül méditait le mal contre David
  rationale: La traduction retenue communique à la fois l’action hostile projetée et la nuance de secret, sans donner au mot « mal » une portée théologique plus étroite que ne l’exige le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative est fluide, tandis que « éphod » conserve le terme biblique précis, expliqué en note.
