  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: fr
  text: Saül convoqua tout le peuple pour la guerre[a], afin de descendre à Qeïla et d’assiéger David et ses hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mobilisa tout le peuple pour le combat ». Le verbe hébreu peut littéralement signifier « faire entendre » et désigne probablement ici l’appel à se rassembler pour une opération militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: convoqua
  rationale: À la forme causative, le verbe peut signifier « faire entendre ». Dans ce contexte militaire, il désigne vraisemblablement l’appel à se rassembler. « Convoqua » exprime naturellement cette mobilisation sans traduire de manière artificiellement littérale.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette traduction conserve l’expression hébraïque, sans la préciser indûment par « toute l’armée » ou « tous les soldats ». Le contexte militaire est indiqué par la suite de la phrase.
- source_word: לַמִּלְחָמָה
  choice: pour la guerre
  rationale: Le groupe prépositionnel exprime le but de la convocation. « Pour la guerre » conserve le sens militaire général du terme hébreu.
- source_word: לָרֶדֶת
  choice: descendre
  rationale: Le verbe signifie couramment « descendre » et peut décrire soit un déplacement vers un lieu moins élevé, soit, plus généralement, le trajet vers une destination dans le récit biblique.
- source_word: קְעִילָה
  choice: Qeïla
  rationale: Transcription française actuelle du nom de lieu hébreu.
- source_word: לָצוּר
  choice: assiéger
  rationale: Dans ce contexte, le verbe désigne l’action militaire consistant à enfermer ou encercler une cible. « Assiéger » convient même si les objets directs sont David et ses hommes, puisqu’ils se trouvent à Qeïla.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: David et ses hommes
  rationale: Avec le verbe « assiéger », les prépositions hébraïques marquent les cibles de l’action et ne doivent pas être reproduites en français. « Ses hommes » reste plus proche du texte que « ses soldats ».
