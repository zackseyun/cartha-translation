  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֵלֵ֣ךְ וְ/הִכֵּ֔יתִי בַּ/פְּלִשְׁתִּ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל דָּוִ֗ד לֵ֚ךְ וְ/הִכִּ֣יתָ בַ/פְּלִשְׁתִּ֔ים וְ/הוֹשַׁעְתָּ֖ אֶת קְעִילָֽהס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: fr
  text: 'Alors David consulta Yahweh en disant : « Dois-je aller attaquer ces Philistins ? » Yahweh lui répondit : « Va attaquer les Philistins et sauve[a] Qeïla. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivre Qeïla ».
    reason: Alternative lexicale pour וְהוֹשַׁעְתָּ dans le contexte d’une libération militaire.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consulta ... Yahweh
  rationale: Dans cette construction, שׁאל avec בְּ désigne une demande de direction adressée à Dieu. « Consulter » exprime cette démarche formelle plus justement qu’une simple question.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa forme personnelle « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: הַאֵלֵךְ
  choice: Dois-je aller
  rationale: Cette formulation française naturelle conserve la valeur délibérative de l’interrogation à l’imparfait hébreu.
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: attaquer
  rationale: Dans ce contexte militaire, « attaquer » rend naturellement נכה sans présumer une victoire déjà acquise. La répétition du verbe est conservée dans la question et la réponse.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: ces Philistins
  rationale: Le démonstratif הָאֵלֶּה est explicitement conservé, car il vise le groupe précis qui menace Qeïla.
- source_word: וְהוֹשַׁעְתָּ
  choice: sauve
  rationale: Le verbe ישׁע signifie sauver ou délivrer. Ici, « sauver » est concis et désigne le secours apporté à la ville face au danger militaire.
- source_word: קְעִילָה
  choice: Qeïla
  rationale: Le nom du lieu est translittéré sous une forme lisible et usuelle en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Portée de וְהוֹשַׁעְתָּ
  choice: sauve
  alternative: délivre
  rationale: Dans ce récit militaire, le verbe évoque le sauvetage concret de Qeïla. Le choix ne lui impose pas un sens exclusivement spirituel.
translation_notes:
  register: Français international moderne, naturel et digne. « Consulter Yahweh » garde la dimension de recherche de la volonté divine, tandis qu’« attaquer » évite le tour peu idiomatique « frapper les Philistins ».
