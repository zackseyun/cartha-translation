  text: וַ/יַּעֲל֤וּ זִפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֣וֹא דָ֠וִד מִסְתַּתֵּ֨ר עִמָּ֤/נוּ בַ/מְּצָדוֹת֙ בַּ/חֹ֔רְשָׁה בְּ/גִבְעַת֙ הַֽ/חֲכִילָ֔ה אֲשֶׁ֖ר מִ/ימִ֥ין הַ/יְשִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: fr
  text: 'Les Ziphites montèrent trouver Saül à Guibéa et lui dirent : « David ne se cache-t-il pas parmi nous, dans les refuges fortifiés de la région boisée[a], sur la colline de Hakila, qui est à droite du Yeshimôn[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Horesh », si le terme est compris comme un nom de lieu plutôt que comme « la région boisée ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « à droite du Yeshimôn » ; dans l’orientation géographique hébraïque, cela signifie probablement « au sud du Yeshimôn ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה exprime la montée; le français « montèrent trouver » conserve cette orientation tout en restant naturel.
- source_word: זִפִים
  choice: les Ziphites
  rationale: Le pluriel gentilé désigne les habitants de Ziph; « Ziphites » est clair et traditionnel en français biblique.
- source_word: הַגִּבְעָתָה
  choice: à Guibéa
  rationale: Le hé directionnel indique un mouvement vers Guibéa; avec « trouver Saül », la préposition « à » situe naturellement la destination.
- source_word: לֵאמֹר
  choice: et lui dirent
  rationale: La tournure française rend naturellement l’introduction du discours direct sans calquer inutilement l’infinitif hébreu.
- source_word: הֲלוֹא
  choice: ne… pas
  rationale: La construction interrogative négative conserve la question rhétorique qui attend une réponse affirmative.
- source_word: מִסְתַּתֵּר
  choice: se cache
  rationale: Le participe hitpael décrit l’action continue de se dissimuler; le présent français convient au discours direct.
- source_word: עִמָּנוּ
  choice: parmi nous
  rationale: Littéralement « avec nous », l’expression indique ici la présence de David dans le territoire des Ziphites.
- source_word: בַמְּצָדוֹת
  choice: dans les refuges fortifiés
  rationale: מְצָדוֹת désigne des lieux défensifs ou retranchés; cette formulation est claire dans le contexte du désert.
- source_word: בַּחֹרְשָׁה
  choice: de la région boisée
  rationale: Le terme peut être un nom commun signifiant région boisée ou être compris comme le toponyme Horesh; le sens commun figure dans le texte et l’autre possibilité en note.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: sur la colline de Hakila
  rationale: La préposition et le nom topographique sont rendus directement et naturellement.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: qui est à droite du Yeshimôn
  rationale: La traduction garde l’expression spatiale littérale de l’hébreu sans imposer dans le texte son interprétation probable comme « au sud ».
theological_decisions: []
