base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: fr
  text: David et ses hommes allèrent à Qeïla et combattirent les Philistins. David emmena leur bétail et leur infligea une lourde défaite[a]. David sauva les habitants de Qeïla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur porta un coup terrible » ; l’expression hébraïque peut aussi évoquer une grande tuerie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשָׁיו קְעִילָה
  choice: David et ses hommes allèrent donc à Qeïla
  rationale: Le wayyiqtol poursuit le récit et se rend naturellement par le passé simple. « Ses hommes » désigne ici la troupe de David. « Donc » exprime la progression narrative sans surcharger la relation logique.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: combattirent les Philistins
  rationale: En français, « combattre » peut prendre directement le nom de l’adversaire; cette formulation est naturelle et ne suggère aucune alliance.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: Il emmena leur bétail
  rationale: נהג évoque le fait de conduire des animaux, vraisemblablement comme prise de guerre. מִקְנֶה est un collectif large que « bétail » rend mieux que le seul « gros bétail ».
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: leur infligea une lourde défaite
  rationale: L’expression idiomatique signifie infliger un coup majeur ou une sévère défaite. Cette traduction française conserve l’intensité sans préciser indûment qu’il s’agissait d’un massacre.
- source_word: וַיּוֹשַׁע
  choice: sauva
  rationale: ישע désigne ici le fait de sauver ou délivrer d’un danger militaire. « Sauva » est direct, courant et fidèle.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: les habitants de Qeïla
  rationale: Le participe désigne ceux qui habitent la ville; « les habitants de Qeïla » est concis et naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique tout en restant clair. La graphie « Qeïla » représente le nom hébreu קְעִילָה selon un usage français courant. Le marqueur [a] figure immédiatement après l’expression concernée.
