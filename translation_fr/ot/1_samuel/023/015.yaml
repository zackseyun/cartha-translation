  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: fr
  text: David vit que Saül était sorti pour attenter à sa vie. David se trouvait alors dans le désert de Ziph, à Horesh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la forêt » ou « dans le lieu boisé ». Le mot hébreu peut être compris comme un nom commun, mais il s’agit probablement ici du nom de lieu Horesh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה signifie d’abord « voir », tout en pouvant exprimer le fait de constater ou d’apprendre. « Vit » conserve la formulation hébraïque et reste naturel dans ce récit.
- source_word: כִּי
  choice: que
  rationale: 'כִּי introduit ici le contenu de ce que David perçoit : Saül était sorti.'
- source_word: יָצָא
  choice: était sorti
  rationale: Le plus-que-parfait situe la sortie de Saül avant le constat de David, tout en reproduisant le sens courant de יצא.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: pour attenter à sa vie
  rationale: L’expression hébraïque signifie littéralement chercher la vie de quelqu’un et, dans ce contexte, désigne l’intention de le faire mourir. « Attenter à sa vie » conserve la référence explicite à la vie sans employer le calque peu naturel « chercher sa vie ».
- source_word: בְּמִדְבַּר זִיף
  choice: dans le désert de Zif
  rationale: מִדְבָּר désigne ici une région désertique ou peu habitée. « Désert » est clair et idiomatique en français moderne.
- source_word: בַּחֹרְשָׁה
  choice: à Horesh[a]
  rationale: Le terme peut être compris comme un nom commun désignant un endroit boisé, mais le contexte favorise ici son emploi comme nom de lieu. La note conserve l’autre analyse possible.
- source_word: וְדָוִד
  choice: David se trouvait alors
  rationale: La coordination hébraïque introduit une indication circonstancielle sur le lieu où se trouvait David. Une nouvelle phrase avec « alors » rend ce lien naturellement en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Attenter à sa vie » est dignifié et explicite sans réduire l’expression à un simple « le chercher ». Le marqueur de note est placé après « Horesh », terme auquel la variante lexicale se rapporte.
