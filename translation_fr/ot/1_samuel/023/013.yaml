base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: fr
  text: David se leva alors avec ses hommes, au nombre d’environ six cents. Ils sortirent de Keïla et allèrent de lieu en lieu, là où ils pouvaient aller[a]. On informa Saül que David s’était échappé de Keïla ; il cessa donc de sortir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils allèrent de lieu en lieu, là où ils allaient ». L’expression hébraïque, qui répète le verbe « aller », souligne leurs déplacements continuels d’un lieu à l’autre.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « il cessa de sortir » signifie probablement que Saül renonça à partir à la poursuite de David après avoir appris que celui-ci avait quitté Keïla.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: David se leva alors avec ses hommes
  rationale: Le qal de קום signifie couramment « se lever ». Cette formulation conserve la transition narrative vers l’action sans préciser plus que le texte.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: au nombre d’environ six cents
  rationale: La préposition כְּ devant le nombre indique une approximation. En français, cette tournure évite la répétition peu naturelle de « hommes » tout en gardant clairement le groupe masculin du contexte militaire.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: Ils sortirent de Keïla
  rationale: Le verbe יצא signifie littéralement « sortir ». La formulation préserve l’image spatiale de l’hébreu et reste naturelle en français.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: et allèrent de lieu en lieu, partout où ils le pouvaient
  rationale: La forme hitpael répétée évoque un déplacement continuel. « De lieu en lieu » rend cette mobilité, tandis que « partout où ils le pouvaient » exprime leur itinérance sous la contrainte sans leur prêter une destination précise.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: On informa Saül
  rationale: Le hophal de נגד est une construction passive impersonnelle. Le pronom indéfini « on » en donne un équivalent français courant sans identifier l’informateur.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: que David s’était échappé de Keïla
  rationale: Le verbe נמלט exprime le fait d’échapper ou de se tirer d’un danger. Le plus-que-parfait situe naturellement la fuite avant le rapport fait à Saül.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: il cessa donc de sortir
  rationale: חדל suivi de l’infinitif signifie « cesser de ». La traduction garde la formulation concise et quelque peu ouverte de l’hébreu au lieu d’expliciter dans le texte l’expédition ou la poursuite.
