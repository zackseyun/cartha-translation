base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: fr
  text: Ils se levèrent et partirent pour Ziph, précédant Saül. David et ses hommes se trouvaient dans le désert de Maôn, dans l’Araba, au sud[a] du Yeshimôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à droite du Yeshimôn ». Dans l’orientation géographique ancienne, la droite peut désigner le sud.'
    reason: lexical_alternative
  - marker: b
    text: « Le Yeshimôn » peut aussi se comprendre comme « la région désolée » ou « le désert » ; ici, le mot fonctionne probablement comme un nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיֵּלְכוּ
  choice: Ils se levèrent et partirent
  rationale: Les deux verbes narratifs successifs sont rendus distinctement. « Se levèrent » conserve l’image de קום, tandis que « partirent » exprime naturellement le déplacement indiqué par הלך.
- source_word: זִיפָה
  choice: pour Ziph
  rationale: Le hé directionnel marque un mouvement vers Ziph ; « pour Ziph » est idiomatique en français dans un récit de déplacement.
- source_word: לִפְנֵי שָׁאוּל
  choice: précédant Saül
  rationale: Cette formulation exprime clairement l’idée spatiale ou temporelle d’aller en avant de Saül, sans réduire לִפְנֵי à la seule présence physique « devant » lui.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: David et ses hommes se trouvaient
  rationale: La proposition nominale hébraïque situe David et ses hommes. « Se trouvaient » fournit en français le verbe nécessaire sans ajouter d’action.
- source_word: בְּמִדְבַּר מָעוֹן
  choice: dans le désert de Maôn
  rationale: מִדְבָּר désigne ici une région inculte ou désertique. « Désert » est naturel en français biblique moderne, sans impliquer nécessairement une étendue de sable.
- source_word: בָּעֲרָבָה
  choice: dans l’Araba
  rationale: Avec l’article et dans cette indication géographique, עֲרָבָה renvoie vraisemblablement à la région appelée l’Araba ; le nom propre est donc conservé.
- source_word: אֶל יְמִין הַיְשִׁימוֹן
  choice: au sud du Yeshimôn
  rationale: יָמִין signifie littéralement « droite », mais peut désigner le sud dans l’orientation géographique sémitique. Le texte principal donne le sens directionnel, et une note préserve l’expression littérale.
- source_word: הַיְשִׁימוֹן
  choice: le Yeshimôn
  rationale: Bien que le terme puisse signifier « région désolée », il paraît fonctionner ici comme une désignation géographique ; la translittération conserve cette possibilité.
