reference: 1 Samuel 23:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: fr
  text: Lorsque Abiathar, fils d’Ahimélek, s’enfuit auprès de David à Qeïla, il descendit[a] avec un éphod à la main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible, suivant la syntaxe hébraïque : « un éphod descendit dans sa main ».'
    reason: La séquence hébraïque place « un éphod » avant le verbe et peut grammaticalement le faire comprendre comme sujet ; le contexte favorise toutefois Abiathar comme sujet.
lexical_decisions:
- source_word: וַיְהִי
  choice: Lorsque
  rationale: La formule narrative est intégrée à la proposition temporelle qui suit. En français moderne, il n’est pas nécessaire d’ajouter « il arriva que » ni un « or » dépourvu d’équivalent temporel explicite.
- source_word: בִּבְרֹחַ
  choice: se réfugia
  rationale: La construction בְּ + infinitif construit exprime ici la circonstance temporelle. « Se réfugia » rend naturellement la fuite vers une personne auprès de qui Abiathar cherche asile.
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: Abiathar, fils d’Ahimélek
  rationale: Les noms sont translittérés selon un usage français courant, et le patronyme est conservé directement.
- source_word: אֶל דָּוִד
  choice: auprès de David
  rationale: אֶל indique le mouvement vers David. Avec « se réfugia », « auprès de David » exprime idiomatiquement cette destination personnelle.
- source_word: קְעִילָה
  choice: à Qeïla
  rationale: Le nom de lieu est compris comme précisant l’endroit où se trouvait David. « À Qeïla » est naturel en français tout en laissant intacte la syntaxe générale du récit.
- source_word: אֵפוֹד
  choice: un éphod
  rationale: Le terme cultuel est translittéré, car aucun équivalent français simple ne rend exactement la nature particulière de cet objet sacerdotal.
- source_word: יָרַד
  choice: il descendit
  rationale: Le verbe signifie « descendre ». Le sujet masculin singulier est compris, selon le sens contextuel habituel, comme renvoyant à Abiathar.
- source_word: בְּיָדוֹ
  choice: avec un éphod à la main
  rationale: L’expression signifie littéralement « dans sa main ». La tournure française « à la main » conserve l’image concrète et indique qu’Abiathar portait l’éphod.
theological_decisions:
- issue: Nature de l’éphod
  choice: Conserver « éphod » sans préciser davantage l’objet.
  alternative: « vêtement sacerdotal » ou « vêtement sacré »
  rationale: Le contexte plus large lui donne une portée sacerdotale et liée à la consultation divine, mais ce verset ne définit pas l’objet. La translittération évite d’imposer une interprétation plus étroite que l’hébreu.
- issue: Sujet de יָרַד dans la dernière proposition
  choice: 'Comprendre Abiathar comme sujet : « il descendit avec un éphod à la main »'
  alternative: 'Prendre « un éphod » comme sujet : « un éphod descendit dans sa main »'
  rationale: La lecture avec Abiathar pour sujet donne le sens contextuel le plus naturel, mais l’ordre des mots hébreux permet formellement de lire « éphod » comme sujet. Cette ambiguïté réelle est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, sobre et narratif. « Se réfugia auprès de » rend la fuite vers David sans lourdeur; « à la main » conserve l’image concrète. Le terme historique « éphod » est maintenu sans explication doctrinale ajoutée.
