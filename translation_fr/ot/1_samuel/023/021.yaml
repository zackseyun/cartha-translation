source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: fr
  text: 'Saül dit : « Que Yahweh vous bénisse, car vous avez eu compassion de moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol narratif de אמר introduit simplement la parole dans le récit; le français naturel n’exprime pas ici le ו initial par « et ».
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: בְּרוּכִים אַתֶּם
  choice: Que Yahweh vous bénisse
  rationale: La construction adjectivale avec pronom indépendant constitue une formule de bénédiction. Cette tournure française en restitue naturellement la valeur performative plutôt qu’un simple constat.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Dans la formule de bénédiction, לַיהוָה indique la relation à celui dont vient la bénédiction. La formulation française choisie explicite cette source sans lourdeur.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de la bénédiction; « car » convient au registre narratif digne tout en restant courant.
- source_word: חֲמַלְתֶּם עָלָי
  choice: vous avez eu compassion de moi
  rationale: חמל avec על exprime ici la pitié ou la compassion envers Saul. Le sens possible d’« épargner » serait moins adapté, puisque les interlocuteurs n’ont pas directement Saul en leur pouvoir.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Nature de la formule בְּרוּכִים אַתֶּם לַיהוָה
  choice: 'une bénédiction souhaitée : « Que Yahweh vous bénisse »'
  alternative: 'un constat : « Vous êtes bénis de Yahweh »'
  rationale: La construction peut formellement se lire comme un prédicat adjectival, mais dans ce contexte elle fonctionne naturellement comme une formule de bénédiction prononcée par Saul.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste concise, conformément au récit hébreu, et « compassion » conserve la nuance relationnelle de חמל.
