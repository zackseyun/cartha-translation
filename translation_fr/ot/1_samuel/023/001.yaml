  text: וַ/יַּגִּ֥דוּ לְ/דָוִ֖ד לֵ/אמֹ֑ר הִנֵּ֤ה פְלִשְׁתִּים֙ נִלְחָמִ֣ים בִּ/קְעִילָ֔ה וְ/הֵ֖מָּה שֹׁסִ֥ים אֶת הַ/גֳּרָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: fr
  text: 'On annonça alors à David : « Voici, les Philistins attaquent Qeïla[a] et pillent les aires de battage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « combattent à Qeïla ». La préposition hébraïque signifie littéralement « dans » ou « à », mais, dans ce contexte militaire, elle indique probablement que les Philistins attaquent la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: On annonça alors à David
  rationale: Le verbe au hifil avec waw narratif fait avancer le récit et introduit une information transmise à David. Le français emploie naturellement le pronom indéfini « on » lorsque les informateurs ne sont pas identifiés ; les deux-points rendent sans lourdeur la fonction introductive de לֵאמֹר.
- source_word: הִנֵּה
  choice: Attention !
  rationale: La particule attire vivement l’attention de David sur une nouvelle urgente. « Attention ! » conserve cette force déictique dans un français moderne et naturel.
- source_word: פְלִשְׁתִּים נִלְחָמִים בִּקְעִילָה
  choice: Les Philistins attaquent Qeïla
  rationale: Le participe niphal de לחם décrit une action militaire en cours. Bien que ב signifie normalement « dans/à », le contexte indique probablement que la ville de Qeïla est la cible de l’action ; « attaquent Qeïla » exprime ce sens probable sans préciser la tactique employée.
- source_word: וְהֵמָּה שֹׁסִים
  choice: et pillent
  rationale: Le pronom indépendant souligne que ce sont bien les Philistins qui commettent aussi ce pillage. En français, le sujet reste clairement celui du premier verbe, et « pillent » rend l’action de dépouiller en contexte de guerre.
- source_word: אֶת הַגֳּרָנוֹת
  choice: les aires de battage
  rationale: גֹּרֶן désigne concrètement l’endroit où l’on bat les céréales. « Aires de battage » conserve cette image agricole plutôt que de remplacer le lieu par le grain qui s’y trouve.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le calque pesant « en disant » tout en gardant l’urgence du rapport et l’aspect en cours des deux actions.
