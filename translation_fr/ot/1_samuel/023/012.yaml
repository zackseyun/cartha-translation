base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: fr
  text: 'David demanda : « Les habitants de Qeïla me livreront-ils, moi et mes hommes, aux mains de Saül[a] ? » Yahweh répondit : « Ils te livreront[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « dans la main de Saül », expression qui signifie : sous son pouvoir.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit simplement « Ils livreront » : le complément d’objet n’est pas exprimé. Le français « te » comprend la réponse comme s’adressant à David, dans le contexte de sa question concernant lui-même et ses hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: me livreront-ils / ils te livreront
  rationale: À la forme causative, סגר signifie ici remettre quelqu’un au pouvoir d’un autre. « Livrer » est naturel en français et conserve l’idée d’une remise à un ennemi; la répétition du verbe hébreu est maintenue.
- source_word: בַּעֲלֵי קְעִילָה
  choice: les habitants de Qeïla
  rationale: Dans ce contexte civique, l’expression désigne les hommes ou les responsables de la ville. « Les habitants de Qeïla » est clair et n’impose pas l’idée plus étroite de propriétaires ou de chefs.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: moi et mes hommes
  rationale: La formulation conserve la distinction explicite entre David et ses hommes sans préciser davantage le statut militaire de ceux-ci.
- source_word: בְּיַד שָׁאוּל
  choice: aux mains de Saül
  rationale: Cette expression française naturelle préserve l’image de la main tout en exprimant le passage sous le pouvoir de Saül.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: יַסְגִּירוּ
  choice: Ils te livreront
  rationale: L’objet hébreu sous-entendu est David au singulier. Le français garde ce singulier, sans ajouter explicitement ses hommes.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette donnée au lieu de lui substituer un titre.
- issue: Portée de la réponse divine au singulier
  choice: « Ils te livreront », adressé à David
  alternative: « Ils vous livreront », incluant explicitement David et ses hommes
  rationale: L’hébreu répond au singulier et laisse les hommes de David implicites. La traduction conserve cette tension grammaticale sans l’expliciter dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et narratif. « Demanda » évite la lourdeur de « dit » devant une question; « aux mains de » conserve l’image hébraïque sous une forme idiomatique. La graphie « Qeïla » rend le nom קְעִילָה de façon lisible en français.
