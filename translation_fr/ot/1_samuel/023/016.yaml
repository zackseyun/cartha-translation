source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: fr
  text: Alors Jonathan, fils de Saül, se leva, alla trouver David à Horesh et le fortifia en Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il fortifia sa main en Dieu ». L’expression « fortifier la main » évoque le courage et la résolution.'
    reason: Préserve l’image idiomatique de l’hébreu et en explique le sens, sans imposer à la préposition « en » une nuance instrumentale.
lexical_decisions:
- source_word: וַיָּקָם
  choice: se mit en route
  rationale: Dans cette suite narrative, קום marque le début d’une action délibérée. « Se mit en route » exprime naturellement cette nuance en français, sans imposer le geste physique de se lever.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: Jonathan, fils de Saül
  rationale: Cette formulation directe conserve la filiation mise en relief par l’hébreu et, avec elle, la tension familiale et politique du récit.
- source_word: וַיֵּלֶךְ אֶל דָּוִד
  choice: alla trouver David
  rationale: הלך אל indique un déplacement jusqu’à David. « Alla trouver » est idiomatique en français et implique ici que Jonathan l’a effectivement rejoint.
- source_word: חֹרְשָׁה
  choice: à Horesh
  rationale: La forme est comprise comme le nom du lieu où David se trouvait, plutôt que comme le nom commun « forêt » ou « lieu boisé ».
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  choice: il l’encouragea
  rationale: L’expression signifie littéralement « il fortifia sa main » et évoque le courage, la résolution ou la capacité d’agir. « Il l’encouragea » en communique naturellement le sens tout en laissant l’image littérale en note.
- source_word: בֵּאלֹהִים
  choice: en Dieu
  rationale: Le maintien de « en » préserve autant que possible la préposition ב, qui peut désigner ici la sphère ou le fondement de l’encouragement, sans la réduire à une simple causalité instrumentale.
theological_decisions:
- issue: Traduction de אֱלֹהִים sans article dans ce contexte
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte porte אֱלֹהִים et non le nom divin YHWH. « Dieu » traduit donc le terme présent sans introduire un autre nom divin.
- issue: Rapport entre l’encouragement de Jonathan et Dieu dans בֵּאלֹהִים
  choice: en Dieu
  alternative: par Dieu
  rationale: « En Dieu » conserve l’ambiguïté entre la sphère, le fondement et le moyen de l’affermissement. « Par Dieu » ferait plus nettement de Dieu l’agent ou le moyen, ce que la préposition ne tranche pas à elle seule.
translation_notes:
  register: Français international moderne, narratif et digne. « Se mit en route » et « alla trouver » rendent la progression de l’action sans archaïsme. L’expression idiomatique difficile est formulée naturellement dans le texte, tandis que son image et son ambiguïté sont conservées en note.
