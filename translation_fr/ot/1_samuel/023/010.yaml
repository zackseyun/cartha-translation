  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: fr
  text: 'Alors David dit : « Yahweh[a], Dieu d’Israël, ton serviteur a bien entendu que Saül cherche à venir à Qeïla pour détruire la ville à cause de moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ».
    reason: Signaler la forme hébraïque et son équivalent traditionnel.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors David dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Cette formulation rend directement et naturellement la construction hébraïque.
- source_word: שָׁמֹעַ שָׁמַע
  choice: a bel et bien appris
  rationale: L’infinitif absolu associé au verbe conjugué renforce l’affirmation. Dans ce contexte, « apprendre » exprime naturellement le fait d’avoir reçu une information, tandis que « bel et bien » en préserve l’insistance.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: David se désigne avec déférence devant Dieu ; « serviteur » convient au sens et au registre de la prière.
- source_word: מְבַקֵּשׁ
  choice: cherche
  rationale: Le participe présente une démarche ou une intention en cours sans en préciser davantage le degré de réalisation.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: à venir à Qeïla
  rationale: « Venir » reste proche de בוא et convient au point de vue de David, qui se trouve à Qeïla.
- source_word: לְשַׁחֵת לָעִיר
  choice: pour détruire la ville
  rationale: Dans ce contexte militaire, « détruire » rend clairement le verbe, et « la ville » reprend la désignation définie de Qeïla.
- source_word: בַּעֲבוּרִי
  choice: à cause de moi
  rationale: L’expression indique ici que la présence de David est la cause de la menace pesant sur la ville.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre, tandis que la note signale le rendu traditionnel français.
translation_notes:
  register: Français international moderne, clair et digne. La troisième personne dans « ton serviteur a… appris » conserve l’autodésignation déférente de David, et « a bel et bien appris » restitue l’insistance hébraïque sans alourdir la phrase.
