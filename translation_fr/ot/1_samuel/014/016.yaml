source:
  edition: WLC
  text: וַ/יִּרְא֤וּ הַ/צֹּפִים֙ לְ/שָׁא֔וּל בְּ/גִבְעַ֖ת בִּנְיָמִ֑ן וְ/הִנֵּ֧ה הֶ/הָמ֛וֹן נָמ֖וֹג וַ/יֵּ֥לֶךְ וַ/הֲלֹֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: fr
  text: 'Les guetteurs de Saül, à Guibéa de Benjamin, regardèrent : voici que la multitude fondait et allait çà et là.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la foule se désagrégeait et allait de tous côtés ». La formulation hébraïque est concise et décrit le désordre visible parmi les Philistins.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: les guetteurs
  rationale: Le participe désigne des hommes postés pour observer. « Guetteurs » est naturel dans ce contexte militaire et exprime leur fonction.
- source_word: לְשָׁאוּל
  choice: de Saül
  rationale: 'La préposition marque ici l’appartenance ou le rattachement : il s’agit des guetteurs affectés à Saül.'
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: à Guibéa de Benjamin
  rationale: « À » convient naturellement en français pour situer les guetteurs dans cette ville, tandis que « de Benjamin » distingue cette Guibéa.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure attire vivement l’attention sur le spectacle soudainement constaté, sans employer l’archaïque « voici » isolé.
- source_word: הֶהָמוֹן
  choice: la multitude
  rationale: Le nom peut désigner une foule nombreuse ou une masse tumultueuse. « Multitude » conserve ce sens collectif sans préciser plus que l’hébreu qu’il s’agit de l’armée philistine.
- source_word: נָמוֹג
  choice: fondait
  rationale: Le verbe évoque littéralement le fait de fondre et, figurativement, la perte de cohésion. « Fondait » maintient cette image tout en pouvant évoquer une troupe qui diminue et se débande.
- source_word: וַיֵּלֶךְ
  choice: allait
  rationale: Le singulier s’accorde avec le nom collectif « multitude ». L’imparfait rend ici le mouvement observé en cours.
- source_word: וַהֲלֹם
  choice: çà et là
  rationale: Dans cette expression concise liée à un verbe de mouvement, l’adverbe suggère des déplacements désordonnés dans diverses directions. « Çà et là » est bref, courant dans un registre narratif digne, et conserve l’indétermination.
theological_decisions: []
