  source_fidelity: 'Le texte rend fidèlement les éléments essentiels de l’hébreu : les guetteurs rattachés à Saül, leur emplacement à Guibéa de Benjamin, l’observation introduite par וְהִנֵּה, et la vision d’une multitude qui « fond » et se déplace de manière désordonnée. « Fondait » conserve avec justesse l’image figurée de נָמוֹג sans la réduire à une interprétation unique telle que « paniquait » ou « se dispersait ».'
