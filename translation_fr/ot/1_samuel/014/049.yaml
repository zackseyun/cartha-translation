  text: וַ/יִּֽהְיוּ֙ בְּנֵ֣י שָׁא֔וּל יוֹנָתָ֥ן וְ/יִשְׁוִ֖י וּ/מַלְכִּי שׁ֑וּעַ וְ/שֵׁם֙ שְׁתֵּ֣י בְנֹתָ֔י/ו שֵׁ֤ם הַ/בְּכִירָה֙ מֵרַ֔ב וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה מִיכַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: fr
  text: Les fils de Saül étaient Jonathan, Yishvi et Malki-Shoua. Ses deux filles s’appelaient Mérab, l’aînée[a], et Mikal, la plus jeune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la première-née ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: Les fils de Saül étaient
  rationale: Rend naturellement la proposition généalogique sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: יוֹנָתָן וְיִשְׁוִי וּמַלְכִּי שׁוּעַ
  choice: Jonathan, Ishvi et Malki-Shoua
  rationale: Translittérations françaises modernes des noms propres; le dernier nom est uni par un trait d’union pour en montrer les deux éléments.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: Ses deux filles s’appelaient
  rationale: L’hébreu dit littéralement « le nom de ses deux filles » au singulier; cette formulation française exprime idiomatiquement l’introduction des deux noms.
- source_word: הַבְּכִירָה
  choice: l’aînée
  rationale: Dans cette comparaison entre deux sœurs, « l’aînée » rend clairement le rang d’âge; « la première-née » reste possible.
- source_word: הַקְּטַנָּה
  choice: la plus jeune
  rationale: Dans le cadre familial, l’adjectif indique l’âge relatif et non la taille physique.
- source_word: מֵרַב ... מִיכַל
  choice: Mérab ... Mikal
  rationale: Formes translittérées adaptées à l’usage et à la phonologie du français.
theological_decisions: []
translation_notes:
  register: Français international actuel, naturel et digne. La structure hébraïque répétitive (« le nom de… et le nom de… ») est légèrement resserrée sans perte d’information. Le marqueur [a] figure dans le texte principal.
