  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: fr
  text: 'Mais le peuple dit à Saül : « Jonathan mourrait-il, lui qui a remporté cette grande victoire en Israël[a] ? Certainement pas[b] ! Aussi vrai que Yahweh est vivant, pas un seul cheveu de sa tête ne tombera à terre, car c’est avec Dieu qu’il a agi aujourd’hui[c]. » Ainsi, le peuple délivra Jonathan[d], et il ne mourut pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette grande délivrance » ou « ce grand salut ». Le mot hébreu peut désigner une délivrance, un salut ou, dans un contexte militaire, une victoire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Loin de là ! » Formule exprimant un rejet catégorique.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « car avec Dieu il a agi aujourd’hui ». Le texte associe son action à celle de Dieu sans préciser davantage la nature de ce rapport.
    reason: theological_ambiguity
  - marker: d
    text: Ou « racheta Jonathan », c’est-à-dire que le peuple le libéra de la sentence qui pesait sur lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: Jonathan mourrait-il
  rationale: La particule interrogative avec l’imparfait introduit une question rhétorique indignée. Le conditionnel français rend naturellement la vive protestation du peuple.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: cette grande victoire
  rationale: יְשׁוּעָה désigne ici une délivrance obtenue dans un contexte militaire. « Victoire » est naturel en français, tandis qu’une note conserve les autres nuances possibles.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition ב est rendue directement et situe la victoire dans la communauté d’Israël sans exclure qu’elle ait été remportée pour elle.
- source_word: חָלִילָה
  choice: Certainement pas !
  rationale: Cette formule exprime un rejet énergique. Cette tournure française actuelle en garde la force sans introduire explicitement le nom de Dieu.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formulation française rend clairement et solennellement la formule de serment hébraïque tout en conservant le nom divin.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: pas un seul cheveu de sa tête ne tombera à terre
  rationale: Après la formule de serment, אִם porte une valeur négative emphatique. L’expression française conserve l’image et signifie qu’il sera entièrement protégé.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: car c’est avec Dieu qu’il a agi
  rationale: La traduction garde le sens premier de עִם, « avec », et la généralité du verbe עשה, sans préciser davantage le rapport entre l’action de Jonathan et celle de Dieu.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: Ainsi, le peuple délivra Jonathan
  rationale: פדה exprime la libération d’une personne soumise à une revendication ou à une sentence. Dans ce contexte, « délivra » est plus naturel que « racheta » en français tout en gardant l’idée de le soustraire à la mort.
- source_word: וְלֹא מֵת
  choice: et il ne mourut pas
  rationale: La proposition hébraïque énonce directement le résultat, sans qu’il soit nécessaire d’expliciter « ne fut pas mis à mort ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nuance de עִם אֱלֹהִים dans l’action de Jonathan
  choice: c’est avec Dieu qu’il a agi
  alternative: il a agi avec l’aide de Dieu ; il a agi pour Dieu
  rationale: 'La traduction littérale de עִם par « avec » préserve la tension du texte : Dieu est associé à l’action de Jonathan, mais la nature précise de cette coopération ou de cette aide n’est pas explicitée.'
translation_notes:
  register: Français international moderne, narratif et digne. La question rhétorique et le serment gardent leur vigueur orale. Le passé simple convient au registre biblique écrit sans archaïsme excessif ; les formulations restent accessibles. Les notes suivent l’ordre de leurs appels dans le texte.
