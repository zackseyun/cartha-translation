id: 1SA.14.10
reference: 1 Samuel 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: fr
  text: 'Mais s’ils nous disent : « Montez jusqu’à nous[a] », alors nous monterons, car Yahweh les a livrés entre nos mains[b]. Ce sera pour nous le signe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Montez contre nous. » L’hébreu souligne peut-être surtout le mouvement vers la position des Philistins; le contexte implique une intention hostile.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans notre main », expression qui signifie « en notre pouvoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Le ו relie cette éventualité au signe précédent tout en marquant le contraste avec la possibilité exposée au verset 9.
- source_word: כֹּה יֹאמְרוּ
  choice: s’ils nous disent
  rationale: כֹּה introduit ici les paroles qui suivent. En français naturel, son sens démonstratif est implicitement porté par la citation directe.
- source_word: עֲלוּ עָלֵינוּ
  choice: Montez jusqu’à nous
  rationale: Le verbe indique la montée vers la position élevée des Philistins; « jusqu’à nous » conserve l’idée d’approche sans rendre explicitement par la préposition seule l’hostilité que le contexte implique.
- source_word: וְעָלִינוּ
  choice: alors nous monterons
  rationale: Dans cette construction conditionnelle, le parfait précédé de ו exprime la conséquence; « alors » rend clairement cet enchaînement.
- source_word: כִּי נְתָנָם
  choice: car … les a livrés
  rationale: כִּי introduit le motif de l’action. Le parfait de נתן présente la victoire comme déjà assurée; « livrer » convient au contexte militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיָדֵנוּ
  choice: entre nos mains
  rationale: Cette expression française naturelle conserve l’image de la main tout en communiquant l’idée d’être placé au pouvoir de quelqu’un.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: Ce sera pour nous le signe
  rationale: Le futur explicite la portée prospective de ce signe; « pour nous » rend לָּנוּ sans surinterprétation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel et n’y substitue pas un titre.
- issue: Valeur temporelle de נְתָנָם
  choice: les a livrés
  alternative: les livrera
  rationale: Le parfait exprime ici la certitude de Jonathan à la suite du signe, comme si l’action divine était déjà accomplie, sans nécessiter une formulation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conditionnelle reste nette; le vocabulaire militaire est compréhensible sans archaïsme. Les deux notes préservent l’ambiguïté de עֲלוּ עָלֵינוּ et l’image idiomatique de בְּיָדֵנוּ.
