  text: אַ֗ף כִּ֡י לוּא֩ אָכֹ֨ל אָכַ֤ל הַ/יּוֹם֙ הָ/עָ֔ם מִ/שְּׁלַ֥ל אֹיְבָ֖י/ו אֲשֶׁ֣ר מָצָ֑א כִּ֥י עַתָּ֛ה לֹֽא רָבְתָ֥ה מַכָּ֖ה בַּ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: fr
  text: Si seulement le peuple avait mangé aujourd’hui du butin de ses ennemis qu’il avait trouvé ! Car alors, le coup porté aux Philistins n’aurait-il pas été bien plus grand ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: Combien plus grande aurait été… si
  rationale: La combinaison introduit avec emphase une situation contraire aux faits et son résultat non réalisé. La restructuration française exprime naturellement ce raisonnement sans en atténuer la force.
- source_word: אָכֹל אָכַל
  choice: avait mangé
  rationale: L’infinitif absolu renforce le verbe, mais le contexte et la tournure exclamative portent déjà l’emphase. « Avait mangé librement » ajouterait une idée qui n’est pas explicitement exprimée.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: du butin pris à ses ennemis
  rationale: שָׁלָל désigne le butin de guerre. Le suffixe singulier est conservé par « ses », rapporté au collectif « le peuple ».
- source_word: אֲשֶׁר מָצָא
  choice: pris
  rationale: Le sens de la relative « qu’il avait trouvé » est rendu idiomatiquement dans le contexte militaire par « pris », sans répéter une construction lourde en français.
- source_word: מַכָּה
  choice: le coup porté
  rationale: מַכָּה peut désigner un coup, une défaite ou un massacre. « Le coup porté » conserve l’image et évite de préciser indûment l’étendue des morts.
- source_word: לֹא רָבְתָה
  choice: aurait été bien plus sévère
  rationale: La question rhétorique négative exprime un résultat contrefactuel nettement supérieur. Cette formulation française en restitue la portée naturelle.
- source_word: בַּפְּלִשְׁתִּים
  choice: aux Philistins
  rationale: La préposition בְּ peut ici marquer la cible ou la sphère du coup. « Aux Philistins » convient naturellement avec « coup porté ».
