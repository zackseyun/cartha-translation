    rationale: לחם signifie littéralement « pain », tout en pouvant désigner la nourriture en général dans ce contexte. Une note lexicale permet de garder cette nuance.
  - severity: low
    issue: « L’un des hommes » est moins précis que « un homme du peuple ».
    rationale: L’hébreu désigne un homme provenant du peuple; la formulation révisée est naturelle et plus proche du texte.
