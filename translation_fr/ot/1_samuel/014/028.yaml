base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: fr
  text: 'Alors, un homme du peuple répondit : « Ton père a fait solennellement prêter serment au peuple en disant : “Maudit soit l’homme qui mangera[a] aujourd’hui !” » Et le peuple était épuisé.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du pain » ; le terme peut désigner la nourriture en général.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le peuple était affaibli » ou « le peuple était exténué ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אִישׁ מֵהָעָם וַיֹּאמֶר
  choice: Alors l’un des hommes répondit
  rationale: La tournure rend naturellement la réponse d’un individu appartenant au peuple, sans alourdir le doublet narratif hébreu « répondit et dit ».
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ ... אֶת הָעָם
  choice: a fait prêter au peuple un serment solennel
  rationale: Le causatif et l’intensification produite par l’infinitif absolu sont exprimés par « fait prêter » et « solennel ».
- source_word: אָבִיךָ
  choice: ton père
  rationale: Le singulier indique que l’homme s’adresse directement à Jonathan.
- source_word: אָרוּר הָאִישׁ
  choice: Maudit soit l’homme
  rationale: Cette formulation française conserve la force solennelle de la formule de malédiction et le masculin singulier du texte.
- source_word: לֶחֶם
  choice: quoi que ce soit
  rationale: Littéralement « pain », le mot désigne ici la nourriture en général; cette expression s’accorde avec l’interdiction absolue illustrée par le miel consommé dans le contexte.
- source_word: וַיָּעַף הָעָם
  choice: Et le peuple était épuisé
  rationale: Le verbe décrit l’affaiblissement ou l’épuisement du peuple; « épuisé » est clair et naturel dans ce contexte de privation.
