  text: וַ/יַּ֣עַל שָׁא֔וּל מֵ/אַחֲרֵ֖י פְּלִשְׁתִּ֑ים וּ/פְלִשְׁתִּ֖ים הָלְכ֥וּ לִ/מְקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/046.yaml
  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: fr
  text: Alors Saül cessa de poursuivre les Philistins[a], et les Philistins s’en allèrent chez eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « monta de derrière les Philistins ». Cette tournure hébraïque signifie ici qu’il cessa de les poursuivre. On peut aussi traduire : « Saül se retira de la poursuite des Philistins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: cessa
  rationale: Le verbe עלה signifie littéralement « monter », mais, associé ici à מֵאַחֲרֵי, il exprime idiomatiquement l’abandon de la poursuite. « Cessa » rend clairement cette valeur contextuelle sans suggérer nécessairement une retraite militaire.
- source_word: מֵאַחֲרֵי
  choice: de poursuivre
  rationale: La locution signifie littéralement « de derrière/après ». Dans ce contexte militaire, elle désigne le fait de poursuivre l’ennemi.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française courante de ce peuple, avec l’article défini naturel en français.
- source_word: הָלְכוּ
  choice: regagnèrent
  rationale: הלך signifie normalement « aller ». Avec le complément « leur territoire », « regagnèrent » exprime naturellement leur mouvement vers leur propre lieu, tout en restant proche du sens contextuel.
- source_word: לִמְקוֹמָם
  choice: leur territoire
  rationale: מָקוֹם signifie « lieu, endroit ». Ici, pour une force ennemie qui se retire, « leur territoire » est plus naturel et informatif que le calque « leur lieu », sans imposer le sens plus précis de « chez eux ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation privilégie le sens idiomatique de l’hébreu dans le récit militaire, tandis que la note conserve son image littérale et signale une autre traduction possible.
