    rationale: Le mouvement de la main vers la bouche implique naturellement qu’il consomme le miel, mais l’hébreu l’exprime indirectement. La note peut décrire l’idiome comme un regain de force ou de vivacité sans présenter l’acte de manger comme une formulation explicite du texte.
