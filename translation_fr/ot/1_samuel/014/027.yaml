base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: fr
  text: Mais Jonathan n’avait pas entendu son père faire prêter serment au peuple. Il tendit le bout du bâton qu’il tenait à la main et le trempa dans un rayon de miel[a]. Puis il ramena sa main à sa bouche, et ses yeux s’éclairèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « dans un fourré de miel »; l’expression hébraïque désigne probablement ici un rayon ou une masse de miel.'
    reason: lexical_alternative
  - marker: b
    text: « Ses yeux s’éclairèrent » est une expression hébraïque qui évoque un regain de force ou de vivacité.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: n’avait pas entendu
  rationale: Dans le contexte, Jonathan ignorait le serment prononcé par Saül; le plus-que-parfait exprime naturellement cette antériorité sans suggérer une désobéissance volontaire.
- source_word: בְּהַשְׁבִּיעַ
  choice: imposer ce serment au peuple
  rationale: Le hifil de שבע signifie faire jurer ou placer sous serment. Cette formulation moderne conserve la force contraignante de l’acte.
- source_word: וַיִּשְׁלַח
  choice: il tendit
  rationale: Avec le bout du bâton comme complément, le verbe décrit le geste d’étendre le bâton.
- source_word: קְצֵה הַמַּטֶּה
  choice: le bout du bâton
  rationale: Expression naturelle en français pour l’extrémité de l’objet tenue et plongée dans le miel.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: dans un rayon de miel
  rationale: L’expression hébraïque inhabituelle évoque littéralement une forêt ou un fourré de miel, mais désigne vraisemblablement ici une masse alvéolée de miel; « rayon de miel » convient au geste décrit tout en signalant l’alternative en note.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: il porta sa main à sa bouche
  rationale: La formulation conserve l’image hébraïque du mouvement de la main vers la bouche sans préciser au-delà du texte la manière exacte dont le miel est consommé.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: ses yeux s’éclairèrent
  rationale: Cette expression française préserve l’image de l’hébreu et suggère le regain de vigueur ou de vivacité produit par la nourriture.
