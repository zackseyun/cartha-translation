  text: וַ/יַּ֣עַשׂ חַ֔יִל וַ/יַּ֖ךְ אֶת עֲמָלֵ֑ק וַ/יַּצֵּ֥ל אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד שֹׁסֵֽ/הוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: fr
  text: Il déploya sa vaillance[a], frappa Amalek[b] et délivra Israël de la main de celui qui le pillait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il fit preuve de force » ou « il accomplit des exploits » ; l’expression peut indiquer la bravoure ou le succès militaire.'
    reason: lexical_alternative
  - marker: b
    text: « Amalek » désigne ici collectivement le peuple amalécite.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « de la main de celui qui le pillait ». Le singulier peut avoir un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: Il déploya sa vaillance
  rationale: L’expression idiomatique signifie agir avec force ou bravoure, voire remporter des succès militaires. Cette formulation conserve l’image hébraïque tout en convenant naturellement au contexte guerrier.
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe נכה peut signifier frapper ou vaincre. « Frappa » préserve la formulation concrète et la portée quelque peu ouverte de l’hébreu.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: L’hébreu emploie le nom collectif singulier « Amalek », qui désigne ici le peuple amalécite. Le conserver respecte la forme du texte source.
- source_word: וַיַּצֵּל
  choice: délivra
  rationale: Au hiphil, נצל signifie arracher, secourir ou délivrer. « Délivra » est clair, digne et n’ajoute aucune précision théologique étrangère au contexte.
- source_word: מִיַּד
  choice: de la main de
  rationale: Cette locution hébraïque exprime le pouvoir ou l’emprise. L’image de la main demeure intelligible en français biblique moderne.
- source_word: שֹׁסֵהוּ
  choice: celui qui le pillait
  rationale: Le participe est morphologiquement singulier et son suffixe masculin singulier renvoie à Israël, envisagé collectivement. Cette traduction conserve cette forme sans exclure une référence collective aux pillards.
