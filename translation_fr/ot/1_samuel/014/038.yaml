  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: fr
  text: 'Alors Saül dit : « Approchez ici, vous tous, chefs du peuple[a]. Cherchez à savoir et examinez comment ce péché s’est produit aujourd’hui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les angles du peuple », expression qui désigne ses chefs ou ses représentants.'
    reason: Préciser l’image hébraïque sous-jacente et le sens idiomatique de l’expression.
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: Approchez
  rationale: L’impératif pluriel accompagné de הֲלֹם appelle le groupe à venir auprès de Saül. « Approchez » exprime naturellement cette convocation en français.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: vous tous, les chefs du peuple
  rationale: Littéralement « tous les angles du peuple », cette expression désigne les principaux responsables ou représentants du peuple. « Chefs » conserve l’idée de personnes occupant une position éminente.
- source_word: וּדְעוּ וּרְאוּ
  choice: Cherchez à savoir et examinez
  rationale: Les deux impératifs appellent à la fois à découvrir les faits et à les examiner. Cette formulation française préserve le mouvement des deux verbes sans produire l’expression peu naturelle « sachez et voyez ».
- source_word: בַּמָּה
  choice: comment
  rationale: Dans ce contexte, ב + מה interroge la manière ou le moyen par lequel la faute s’est produite. « Comment » garde cette portée suffisamment ouverte en français.
- source_word: הָיְתָה
  choice: a été commis
  rationale: Le verbe signifie formellement « a été / est survenu ». Avec « péché » comme sujet, « a été commis » est une formulation française naturelle qui exprime la survenue de la faute dans le contexte de l’enquête.
- source_word: הַחַטָּאת הַזֹּאת
  choice: ce péché
  rationale: חטאת désigne ici la faute qui a provoqué le silence de Dieu. « Péché » en conserve directement la portée morale et religieuse.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent temporel courant et direct de הַיּוֹם.
theological_decisions:
- issue: Sens idiomatique de « tous les angles du peuple »
  choice: vous tous, les chefs du peuple
  alternative: tous les angles du peuple ; tous les responsables du peuple ; tous les représentants du peuple
  rationale: Le sens littéral serait opaque en français. L’expression hébraïque vise les hommes éminents qui représentent le peuple ; « chefs » rend ce sens sans créer une structure institutionnelle plus précise que le texte.
- issue: Portée morale de חטאת
  choice: péché
  alternative: faute ; offense ; culpabilité
  rationale: Le récit concerne une transgression devant Dieu. « Péché » conserve cette dimension théologique sans préciser indûment la nature exacte de l’acte.
- issue: Portée interrogative de בַּמָּה
  choice: comment
  alternative: par quoi ; en quoi
  rationale: L’hébreu peut porter sur la manière ou le moyen. « Comment » préserve cette ouverture plus naturellement que « par quoi », sans identifier d’avance la personne ou l’acte responsable.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde le ton d’une convocation officielle, tandis que « cherchez à savoir et examinez » rend l’insistance des deux impératifs hébreux dans une tournure française naturelle.
