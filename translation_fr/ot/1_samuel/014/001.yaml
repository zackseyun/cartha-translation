base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: fr
  text: 'Un jour, Jonathan, fils de Saül, dit au jeune homme qui portait ses armes : « Viens, passons de l’autre côté, vers le poste des Philistins[a]. » Mais il n’en informa pas son père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement quelque chose comme « qui est de l’autre côté de celui-ci ». Il s’agit probablement du passage décrit dans les versets suivants.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Un jour
  rationale: Cette formule narrative hébraïque introduit naturellement un épisode; « Un jour » en restitue le sens temporel sans calque pesant.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Ici, il remplit une fonction militaire; « jeune homme » convient au contexte sans le réduire explicitement au statut de serviteur.
- source_word: נֹשֵׂא כֵלָיו
  choice: qui portait ses armes
  rationale: L’expression signifie littéralement « portant son équipement/ses objets ». Dans ce contexte militaire, « ses armes » est clair et naturel, tout en conservant la forme descriptive plutôt que le titre traditionnel « porteur d’armes ».
- source_word: לְכָה וְנַעְבְּרָה
  choice: Viens, traversons
  rationale: לְכָה est une invitation ou exhortation, suivie d’un cohortatif. « Viens, traversons » reproduit ce mouvement avec concision.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: le poste des Philistins
  rationale: מַצָּב peut désigner un poste militaire ou la force qui y est stationnée. « Poste » reste naturel et évite de trancher en faveur d’une garnison nombreuse.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: qui se trouve de l’autre côté
  rationale: La formulation déictique hébraïque est difficile à reproduire mot à mot. Le français indique clairement la position opposée sans ajouter explicitement « col » ou « passage », absents du verset.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: Mais il n’en informa pas son père
  rationale: La conjonction prend ici naturellement une valeur contrastive. « En informa » exprime que Jonathan ne fit pas part de son projet à son père.
