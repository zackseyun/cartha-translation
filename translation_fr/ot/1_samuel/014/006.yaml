  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: fr
  text: 'Jonathan dit au jeune homme qui portait ses armes : « Viens, traversons jusqu’au poste de ces incirconcis.[a] Peut-être que Yahweh agira en notre faveur, car rien ne peut empêcher Yahweh de sauver, que ce soit par beaucoup ou par peu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au poste avancé » ou « jusqu’à la garnison ». L’expression « ces incirconcis » est ici une désignation méprisante, chargée d’une portée liée à l’alliance.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: qui portait ses armes
  rationale: La tournure participiale désigne celui qui porte l’équipement ou les armes de Jonathan. Cette formulation française naturelle reste proche de la construction hébraïque sans imposer le titre traditionnel « porteur d’armes ».
- source_word: לְכָה וְנַעְבְּרָה
  choice: Viens, traversons
  rationale: L’impératif suivi du cohortatif exprime à la fois l’invitation et la résolution commune; « traversons » convient au déplacement décrit dans le contexte.
- source_word: מַצַּב
  choice: poste
  rationale: Le nom désigne ici une position militaire philistine. « Poste » conserve une certaine latitude entre un poste avancé et une garnison.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: ces incirconcis
  rationale: L’adjectif substantivé est conservé afin de rendre la désignation méprisante et chargée d’une portée d’alliance, sans lui substituer « Philistins ».
- source_word: אוּלַי
  choice: Peut-être
  rationale: Le terme exprime l’espérance de Jonathan sans transformer celle-ci en certitude.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: Yahweh agira en notre faveur
  rationale: Le verbe « faire » est très large; dans ce contexte, « agir en notre faveur » rend naturellement l’idée d’une intervention divine sans en préciser indûment la forme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: מַעְצוֹר
  choice: rien ne peut empêcher
  rationale: Cette formulation idiomatique exprime l’absence de tout obstacle ou de toute limitation à l’action salvatrice de Yahweh.
- source_word: לְהוֹשִׁיעַ
  choice: de sauver
  rationale: « Sauver » convient à la délivrance militaire immédiate tout en conservant l’amplitude biblique du verbe.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: que ce soit par beaucoup ou par peu
  rationale: La formulation conserve le contraste numérique et la valeur instrumentale de la préposition hébraïque sans ajouter explicitement « hommes ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte hébreu emploie directement le Tétragramme; « Yahweh » préserve sa fonction de nom personnel.
- issue: Degré de certitude attribué à l’intervention divine
  choice: Peut-être que Yahweh agira
  alternative: Yahweh agira certainement
  rationale: אוּלַי marque explicitement la possibilité. Jonathan manifeste sa confiance dans la capacité de Yahweh à sauver, sans présumer qu’il interviendra nécessairement dans cette occasion précise.
- issue: Portée de « ces incirconcis »
  choice: conserver l’expression littérale
  alternative: ces Philistins
  rationale: L’hébreu emploie une désignation liée au signe de l’alliance et porteuse de reproche, non le simple nom ethnique; la conserver maintient cette tension théologique et rhétorique.
translation_notes:
  register: Français international moderne, direct et digne. Le dialogue garde l’élan militaire de l’hébreu. « Par beaucoup ou par peu » conserve la formulation concise et légèrement inhabituelle de l’original.
