  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: fr
  text: Saül se trouvait à l’extrémité de Guibéa[a], sous le grenadier qui se trouve à Migron, et les gens qui étaient avec lui étaient au nombre d’environ six cents hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était assis à l’extrémité de Guibéa ». Le participe hébreu peut désigner le fait d’être assis ou celui de rester dans un lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: se tenait
  rationale: Le participe de ישׁב peut exprimer la position assise ou le fait de demeurer dans un lieu. « Se tenait » convient naturellement à la situation militaire tout en laissant ouverte la posture précise.
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: aux abords de Guibéa
  rationale: קָצֶה désigne l’extrémité ou le bord. « Aux abords de » rend naturellement la situation à la limite de la localité; הַגִּבְעָה est compris ici comme le nom propre Guibéa d’après le contexte.
- source_word: תַּחַת הָרִמּוֹן
  choice: sous le grenadier
  rationale: רִמּוֹן signifie « grenade » et, dans cette expression locative, désigne l’arbre; « grenadier » l’exprime directement et idiomatiquement en français.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: qui se trouve à Migron
  rationale: La proposition relative identifie naturellement le grenadier par son emplacement. Le présent descriptif s’intègre bien dans un récit au passé.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: et les gens qui étaient avec lui
  rationale: עָם est un terme large signifiant « peuple » ou « gens ». Le contexte est militaire, mais « les gens » évite de préciser « soldats » au-delà du texte.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: étaient environ six cents hommes
  rationale: Le préfixe כ־ marque ici l’approximation, rendue par « environ »; אִישׁ après le nombre se traduit naturellement par « hommes ».
theological_decisions: []
