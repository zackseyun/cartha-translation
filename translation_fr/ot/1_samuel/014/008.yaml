  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹנָתָ֔ן הִנֵּ֛ה אֲנַ֥חְנוּ עֹבְרִ֖ים אֶל הָ/אֲנָשִׁ֑ים וְ/נִגְלִ֖ינוּ אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: fr
  text: 'Jonathan dit : « Regarde, nous allons passer vers ces hommes et nous nous montrerons à eux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Formule narrative habituelle introduisant les paroles directes ; le passé simple convient au récit biblique en français moderne soutenu.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: הִנֵּה
  choice: Regarde
  rationale: Interjection attirant l’attention de l’écuyer sur le plan que Jonathan va exposer ; « Regarde » en restitue naturellement la force déictique sans archaïsme.
- source_word: אֲנַחְנוּ עֹבְרִים
  choice: nous allons passer
  rationale: Le pronom explicite et le participe expriment ici une action imminente. La tournure française « nous allons passer » rend naturellement cette valeur prospective.
- source_word: אֶל הָאֲנָשִׁים
  choice: du côté de ces hommes
  rationale: La locution indique le mouvement en direction des hommes du poste philistin. « Ces hommes » identifie naturellement en français les hommes déjà présents dans la scène.
- source_word: וְנִגְלִינוּ
  choice: et nous nous montrerons
  rationale: Le nifal de גלה exprime ici le fait de se rendre volontairement visible. « Se montrer » est précis, idiomatique et plus naturel que « se révéler » dans ce contexte militaire.
- source_word: אֲלֵיהֶם
  choice: à eux
  rationale: Le complément désigne les hommes devant lesquels Jonathan et son écuyer se rendront visibles.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le mouvement tactique et l’exposition volontaire de Jonathan et de son écuyer, sans ajouter d’explication absente de l’hébreu.
