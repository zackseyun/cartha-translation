  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: fr
  text: 'Puis il dit à tout Israël : « Vous serez d’un côté[a], et Jonathan, mon fils, et moi serons de l’autre côté. » Le peuple répondit à Saül : « Fais ce qui te paraît bon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète littéralement « d’un côté » dans les deux membres. Dans ce contexte, l’expression indique que les deux groupes doivent prendre place de part et d’autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: d’un côté / de l’autre côté
  rationale: עֵבֶר désigne un côté ou une région située au-delà. Dans le contexte du tirage au sort, l’expression répartit les participants en deux groupes opposés. La formulation française conserve ce contraste spatial sans préciser davantage le procédé.
- source_word: תִּהְיוּ / נִהְיֶה
  choice: vous serez / nous serons
  rationale: Le verbe היה signifie d’abord « être ». Avec « d’un côté », le futur français exprime naturellement la position que chaque groupe doit prendre, tout en évitant d’ajouter l’idée plus explicite de « se tenir ».
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Désignation collective habituelle de l’ensemble du peuple présent.
- source_word: בְּנִי
  choice: mon fils Jonathan
  rationale: Le lien filial est conservé explicitement dans un ordre naturel en français.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: ce qui te paraît bon
  rationale: L’idiome hébreu signifie ce qui semble bon ou juste à quelqu’un. Cette formulation moderne en transmet le sens sans conserver artificiellement l’image des yeux.
- source_word: עֲשֵׂה
  choice: Fais
  rationale: Impératif simple correspondant directement à l’hébreu.
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: Puis il dit / Le peuple répondit
  rationale: « Puis » marque naturellement la progression narrative. Dans ce dialogue, « répondit » rend idiomatiquement la seconde prise de parole sans modifier son contenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux groupes est conservé, ainsi que la mention explicite de Jonathan comme fils de Saül. L’idiome final est rendu naturellement plutôt que calqué.
