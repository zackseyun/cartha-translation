base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/029.yaml
  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: fr
  text: 'Jonathan dit : « Mon père a jeté le trouble dans le pays. Voyez donc comme mes yeux se sont éclairés[a], parce que j’ai goûté un peu de ce miel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque : « mes yeux se sont éclairés », évoquant le regain de force ou de lucidité produit par la nourriture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: a jeté le trouble dans
  rationale: Le verbe exprime l’idée de troubler ou d’attirer le malheur. Cette tournure française conserve sa force causative sans préciser davantage la nature des conséquences.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce récit, le terme désigne le territoire et, par métonymie possible, sa population. « Le pays » est naturel en français et laisse cette portée ouverte.
- source_word: רְאוּ נָא
  choice: Voyez donc
  rationale: L’impératif pluriel appelle les auditeurs à constater le résultat, tandis que « donc » rend naturellement la nuance d’insistance ou d’appel portée par נָא.
- source_word: אֹרוּ עֵינַי
  choice: mes yeux se sont éclaircis
  rationale: Cette traduction conserve l’image hébraïque des yeux devenus plus lumineux ou clairs, tout en laissant la note expliquer qu’elle évoque ici un regain de vigueur ou de lucidité.
- source_word: טָעַמְתִּי
  choice: j’ai goûté
  rationale: Le verbe signifie précisément « goûter » et convient à la faible quantité consommée.
- source_word: מְעַט
  choice: un peu de
  rationale: Cette expression française rend directement la petite quantité indiquée par l’hébreu.
- source_word: דְּבַשׁ הַזֶּה
  choice: ce miel
  rationale: Le texte dit « miel » avec un démonstratif, sans mentionner explicitement un rayon de miel.
