  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: fr
  text: 'Saül dit[a] : « Que Dieu fasse ainsi et qu’il y ajoute encore, car tu mourras certainement, Jonathan ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formule hébraïque de serment, littéralement : « Que Dieu fasse ainsi et qu’il y ajoute encore. » L’objet du châtiment invoqué n’est pas précisé en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit au passé. En français, l’enchaînement se rend naturellement sans ajouter systématiquement « et ».
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: Que Dieu me traite avec la plus grande sévérité
  rationale: Cette formule fixe de serment appelle sur le locuteur un châtiment divin aggravé. La formulation française restitue sa force imprécatoire de manière naturelle; la note signale que l’hébreu ne précise pas explicitement l’objet de l’action.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le terme désigne ici le Dieu invoqué par Saül dans son serment.
- source_word: כִּי
  choice: si ... ne ... pas
  rationale: Dans le cadre de la formule de serment, כִּי introduit la déclaration solennellement garantie. Une proposition négative après l’imprécation est l’équivalent idiomatique français du serment hébreu.
- source_word: מוֹת תָּמוּת
  choice: tu ne meurs pas
  rationale: L’infinitif absolu joint au verbe conjugué marque la certitude emphatique de la mort; dans cette construction française de serment, l’emphase est portée par « avec la plus grande sévérité si... ne... pas ».
- source_word: יוֹנָתָן
  choice: Jonathan
  rationale: Translittération française standard du nom propre.
theological_decisions:
- issue: Explicitation de l’auto-imprécation dans la formule de serment
  choice: Que Dieu me traite avec la plus grande sévérité
  alternative: Que Dieu fasse ainsi, et qu’il y ajoute encore
  rationale: La formule conventionnelle implique normalement que le locuteur appelle le châtiment sur lui-même, mais l’hébreu laisse l’objet grammatical inexprimé. Le texte principal privilégie une formule française intelligible et fonctionnellement équivalente; la note préserve l’information selon laquelle « me » n’est pas explicite dans la source.
translation_notes:
  register: Français international moderne, naturel et digne. Le serment est rendu idiomatiquement tout en conservant dans la note l’implicite et la formulation littérale de l’hébreu.
