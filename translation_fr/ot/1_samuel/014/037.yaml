source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: fr
  text: 'Saül consulta alors Dieu : « Dois-je descendre à la poursuite des Philistins ? Les livreras-tu entre les mains d’Israël[a] ? » Mais il ne lui répondit pas ce jour-là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les donneras-tu dans la main d’Israël ? »'
    reason: La note signale la formulation littérale de l’idiome hébraïque que le texte rend par « livrer entre les mains ».
lexical_decisions:
- source_word: וַיִּשְׁאַל שָׁאוּל בֵּאלֹהִים
  choice: Saül consulta alors Dieu
  rationale: Avec la préposition ב, le verbe שׁאל désigne ici la recherche d’une réponse ou d’une directive divine. « Consulter Dieu » exprime naturellement cet acte formel en français moderne.
- source_word: הַאֵרֵד
  choice: Dois-je descendre
  rationale: La forme interrogative exprime une demande de direction. « Dois-je » conserve cette nuance délibérative, tandis que « descendre » rend le mouvement indiqué par ירד.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: à la poursuite des Philistins
  rationale: אַחֲרֵי signifie littéralement « après », mais, dans ce contexte militaire, il s’agit de poursuivre les Philistins. Cette formulation est claire et naturelle sans ajouter l’idée plus large d’une nouvelle attaque.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: Les livreras-tu entre les mains d’Israël
  rationale: Dans un contexte de combat, נתן suivi de « dans la main de » signifie remettre l’ennemi au pouvoir de quelqu’un. « Livrer entre les mains » conserve l’image hébraïque dans une tournure française intelligible.
- source_word: וְלֹא עָנָהוּ
  choice: Mais il ne lui répondit pas
  rationale: La conjonction introduit ici un contraste avec les questions de Saül. Le sujet demeure pronominal comme en hébreu, et le contexte désigne clairement Dieu.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Cette expression rend exactement et naturellement l’indication temporelle hébraïque.
theological_decisions:
- issue: Sujet implicite de l’absence de réponse
  choice: Conserver le sujet sous la forme du pronom « il »
  alternative: 'Expliciter : « Mais Dieu ne lui répondit pas »'
  rationale: Le contexte indique fortement que Dieu est le sujet, mais l’hébreu ne le répète pas. Le pronom préserve la concision et la légère implicitation du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste concis. « À la poursuite de » explicite le sens militaire contextuel de אַחֲרֵי, tandis que l’image des « mains » est conservée pour l’idiome de la remise au pouvoir d’Israël.
