base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: fr
  text: 'Alors Saül dit à Jonathan : « Dis-moi ce que tu as fait. » Jonathan lui répondit : « J’ai bel et bien goûté un peu de miel à l’extrémité du bâton que je tenais à la main, et me voici, sur le point de mourir[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « J’ai bien goûté un peu de miel… et me voici : devrais-je mourir ? » En hébreu, le verbe « goûter » est renforcé, et la dernière proposition peut exprimer soit une résignation, soit une protestation sous forme de question rhétorique.'
    reason: Préserver l’intensité de טָעֹם טָעַמְתִּי et l’ambiguïté pragmatique de הִנְנִי אָמוּת, sans introduire une valeur restrictive dans le verbe.
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Dis-moi
  rationale: L’impératif de נגד suivi du pronom datif appelle une demande directe. « Dis-moi » est naturel en français moderne et conserve la vigueur de l’ordre.
- source_word: מֶה עָשִׂיתָה
  choice: ce que tu as fait
  rationale: Le passé composé exprime une action accomplie dont les conséquences sont présentes dans la scène.
- source_word: וַיַּגֶּד לוֹ
  choice: le lui raconta
  rationale: Cette formulation reprend l’idée de נגד sans la répétition peu naturelle de « lui dit » et présente la réponse comme le récit de ce qui s’est passé.
- source_word: טָעֹם טָעַמְתִּי
  choice: J’ai bel et bien goûté
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Bel et bien » rend cette insistance sans introduire explicitement la valeur restrictive de « seulement ».
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: du bout du bâton
  rationale: קצה désigne l’extrémité; dans le contexte, le français instrumental « du bout du bâton » décrit naturellement la manière dont Jonathan a pris et goûté le miel.
- source_word: הַמַּטֶּה
  choice: bâton
  rationale: « Bâton » convient à l’objet tenu par Jonathan et sonne plus naturel ici que « verge » ou « sceptre ».
- source_word: מְעַט דְּבַשׁ
  choice: un peu de miel
  rationale: Rendu quantitatif direct, courant et précis.
- source_word: הִנְנִי
  choice: me voici
  rationale: « Me voici » conserve la valeur déictique et l’immédiateté rhétorique de הִנְנִי dans un registre digne.
- source_word: אָמֽוּת
  choice: sur le point de mourir
  rationale: Dans le contexte du serment et de la condamnation de Saül, cette expression rend l’issue imminente tout en permettant de comprendre la phrase comme résignation ou comme protestation rhétorique.
theological_decisions:
- issue: Valeur de la dernière proposition הִנְנִי אָמוּת
  choice: 'Déclaration résignée : « me voici, sur le point de mourir »'
  alternative: 'Question rhétorique : « et maintenant, il faudrait que je meure ? »'
  rationale: L’hébreu ne porte pas de marque interrogative explicite et permet une déclaration, mais le contexte autorise aussi une protestation rhétorique. Le texte principal garde la syntaxe déclarative, tandis que la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques lourds; la répétition « raconta… dit » est allégée. Le marqueur de note est placé à la fin de la parole concernée.
