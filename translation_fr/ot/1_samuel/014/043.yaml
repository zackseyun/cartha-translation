revisions:
- from: 'Alors Saül dit à Jonathan : « Dis-moi ce que tu as fait. » Jonathan le lui raconta : « J’ai bel et bien goûté un peu de miel du bout du bâton que j’avais à la main, et me voici, sur le point de mourir[a]. »'
  to: 'Alors Saül dit à Jonathan : « Dis-moi ce que tu as fait. » Jonathan lui répondit : « J’ai bel et bien goûté un peu de miel à l’extrémité du bâton que je tenais à la main, et me voici, sur le point de mourir[a]. »'
  rationale: La révision clarifie que le miel se trouvait à l’extrémité du bâton, rend « dans ma main » par « que je tenais à la main », et fluidifie la réplique de Jonathan. La note conserve l’alternative rhétorique sans affaiblir l’intensif verbal hébreu.
