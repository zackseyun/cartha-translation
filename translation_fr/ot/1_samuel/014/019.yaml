  text: וַ/יְהִ֗י עַ֣ד דִּבֶּ֤ר שָׁאוּל֙ אֶל הַ/כֹּהֵ֔ן וְ/הֶ/הָמ֗וֹן אֲשֶׁר֙ בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים וַ/יֵּ֥לֶךְ הָל֖וֹךְ וָ/רָ֑ב וַ/יֹּ֧אמֶר שָׁא֛וּל אֶל הַ/כֹּהֵ֖ן אֱסֹ֥ף יָדֶֽ/ךָ־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: fr
  text: 'Pendant que Saül parlait au prêtre, le tumulte dans le camp des Philistins ne cessait de grandir. Alors Saül dit au prêtre : « Retire ta main[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Rassemble ta main. » Saül ordonne au prêtre d’interrompre l’action qu’il était en train d’accomplir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: Pendant que … parlait
  rationale: La construction introduit une action qui se déroule en même temps que l’agitation croissante du camp. Cette formulation française restitue naturellement la simultanéité sans alourdir le récit par un calque de וַיְהִי.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le nom défini renvoie au prêtre déjà présent dans le contexte immédiat.
- source_word: הֶהָמוֹן
  choice: le tumulte
  rationale: Le terme désigne ici l’agitation bruyante et désordonnée du camp philistin, et non un simple bruit.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: dans le camp des Philistins
  rationale: Traduction claire et proche de la construction hébraïque, naturelle en français moderne.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: ne cessait de grandir
  rationale: La combinaison du verbe et de l’infinitif absolu exprime une progression continue et une intensification. La tournure française rend cet accroissement sans redondance artificielle.
- source_word: אֱסֹף יָדֶךָ
  choice: Retire ta main
  rationale: L’expression signifie littéralement « rassemble ta main » et ordonne au prêtre d’interrompre le geste ou l’action qu’il accomplissait. La traduction conserve l’image concrète tout en restant compréhensible.
theological_decisions:
- issue: Nature précise de l’action sacerdotale interrompue
  choice: Ne pas préciser le rite ou l’objet manipulé
  alternative: Expliciter que le prêtre consultait Dieu au moyen de l’éphod ou de l’Urim et du Thummim
  rationale: Le verset ordonne seulement au prêtre de retirer sa main. Identifier plus précisément le geste dépasserait ce que dit explicitement le texte hébreu et résoudrait une ambiguïté contextuelle.
translation_notes:
  register: Français moderne, narratif et digne. « Tumulte » garde la force de la scène, tandis que « ne cessait de grandir » restitue l’intensification progressive. Le tutoiement convient à l’ordre direct adressé par le roi au prêtre dans ce cadre ancien.
