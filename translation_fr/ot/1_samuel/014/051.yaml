  text: וְ/קִ֧ישׁ אֲבִֽי שָׁא֛וּל וְ/נֵ֥ר אֲבִֽי אַבְנֵ֖ר בֶּן אֲבִיאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: fr
  text: Qish était le père de Saül[a], et Ner était le père d’Abner, fils d’Abiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Qish, père de Saül, et Ner, père d’Abner, fils d’Abiel. » Le français ajoute « était » pour expliciter cette indication généalogique. L’expression « fils d’Abiel » peut aussi se rapporter à Ner.'
    reason: ambiguïté syntaxique et formulation littérale
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: Qish
  rationale: Nom propre translittéré selon une convention française qui distingue la consonne hébraïque qoph par « Q ».
- source_word: אֲבִי
  choice: était le père de
  rationale: Le nom construit « père de » forme ici une proposition généalogique sans verbe; le français naturel demande l’ajout de « était ».
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וְ/נֵר
  choice: et Ner
  rationale: La conjonction est rendue directement par « et »; le nom propre est translittéré.
- source_word: אֲבִי
  choice: était le père de
  rationale: Même construction généalogique que dans le premier membre; la répétition du prédicat rend le parallélisme clair en français.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בֶּן
  choice: fils de
  rationale: Rend littéralement le terme généalogique tout en conservant l’ambiguïté syntaxique du texte hébreu sur le rattachement de « fils d’Abiel ».
- source_word: אֲבִיאֵל
  choice: Abiel
  rationale: Forme française usuelle du nom propre biblique.
theological_decisions:
- issue: Rattachement de « fils d’Abiel »
  choice: Conserver la formulation « Abner, fils d’Abiel » dans le texte principal
  alternative: Comprendre qu’Abiel est le père de Ner, conformément au contexte généalogique du verset 50
  rationale: La syntaxe immédiate place « fils d’Abiel » après Abner, tandis que le contexte peut favoriser son rattachement à Ner. La traduction ne doit pas résoudre silencieusement cette tension textuelle.
translation_notes:
  register: Français moderne, international et digne. La phrase reste simple et naturelle, avec les formes françaises courantes des noms bibliques; « Qish » suit toutefois de près la translittération de l’hébreu.
