  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַפִּ֕ילוּ בֵּינִ֕/י וּ/בֵ֖ין יוֹנָתָ֣ן בְּנִ֑/י וַ/יִּלָּכֵ֖ד יוֹנָתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: fr
  text: 'Alors Saül dit[a] : « Tirez au sort entre moi et mon fils Jonathan. » Et Jonathan fut désigné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Faites tomber entre moi et mon fils Jonathan », c’est-à-dire : faites trancher l’affaire par le sort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  choice: Jetez le sort
  rationale: L’impératif hiphil signifie littéralement « faites tomber ». Dans ce contexte, il désigne l’action de tirer au sort; cette formulation idiomatique explicite naturellement l’objet sous-entendu.
- source_word: בֵּינִי וּבֵין
  choice: entre moi et
  rationale: La préposition composée met en présence les deux personnes entre lesquelles le sort doit trancher.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le nom בֵּן muni du suffixe de première personne désigne explicitement le fils de Saül.
- source_word: וַיִּלָּכֵד
  choice: fut désigné
  rationale: Le niphal de לכד signifie littéralement « être pris ». Dans un tirage au sort, il indique que Jonathan est celui sur qui le sort tombe; « fut désigné » exprime clairement ce sens contextuel sans ajouter de jugement théologique.
- source_word: יוֹנָתָן
  choice: Jonathan
  rationale: Forme française usuelle du nom propre biblique.
- source_word: וַיֹּאמֶר
  choice: Alors Saül dit
  rationale: Le waw consécutif fait progresser le récit; « Alors » rend naturellement la succession narrative.
