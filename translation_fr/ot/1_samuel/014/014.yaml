  text: וַ/תְּהִ֞י הַ/מַּכָּ֣ה הָ/רִאשֹׁנָ֗ה אֲשֶׁ֨ר הִכָּ֧ה יוֹנָתָ֛ן וְ/נֹשֵׂ֥א כֵלָ֖י/ו כְּ/עֶשְׂרִ֣ים אִ֑ישׁ כְּ/בַ/חֲצִ֥י מַעֲנָ֖ה צֶ֥מֶד שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: fr
  text: Lors de ce premier assaut, Jonathan et son porteur d’armes tuèrent environ vingt hommes, dans un espace correspondant à environ la moitié d’un sillon sur une étendue de champ associée à un attelage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « comme la moitié d’un sillon d’un attelage de champ ». Le sens précis de cette ancienne indication de superficie est incertain. Le mot rendu par « attelage » désigne littéralement une paire, notamment une paire de bœufs.'
    reason: ambiguïté textuelle et mesure agraire ancienne
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: ce premier assaut
  rationale: מַכָּה peut désigner le coup porté, l’attaque ou ses victimes. « Assaut » convient au contexte militaire et évite le caractère excessivement massif de « massacre » pour une vingtaine d’hommes.
- source_word: אֲשֶׁר הִכָּה יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: Jonathan et celui qui portait ses armes tuèrent
  rationale: Le singulier verbal coordonné avec les deux acteurs est naturel en hébreu; le pluriel français les réunit. Dans ce contexte, נכה exprime une mise à mort, tandis que « celui qui portait ses armes » rend clairement la fonction sans supposer que כֵּלִים désigne uniquement une armure.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: une vingtaine d’hommes
  rationale: Le préfixe כְּ marque l’approximation; cette formulation est naturelle en français moderne.
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: sur environ la moitié d’un sillon
  rationale: La traduction conserve l’approximation et l’image agricole de מַעֲנָה, dont le sens exact dans cette indication de superficie reste difficile.
- source_word: צֶמֶד שָׂדֶה
  choice: dans une portion de champ qu’une paire de bœufs pouvait labourer en un jour
  rationale: צֶמֶד signifie d’abord « paire, attelage » et peut désigner une mesure agraire fondée sur la surface labourable par un attelage; l’ajout « en un jour » explicite la mesure traditionnelle et est signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase évite « acre », mesure moderne étrangère au texte, tout en maintenant l’image agricole et en signalant l’incertitude de l’expression hébraïque.
