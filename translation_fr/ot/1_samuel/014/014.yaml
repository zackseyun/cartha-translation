  naturalness: « Son porteur d’armes » est l’expression française usuelle et naturelle. La phrase révisée reste narrative et claire, tout en évitant de présenter comme certaine la valeur de l’ancienne mesure.
  terminology: « Premier assaut » convient à הַמַּכָּה dans ce contexte, sans imposer « massacre ». « Porter d’armes » est le terme militaire standard. « Attelage » rend sobrement צֶמֶד sans convertir la mesure en acre ni ajouter une durée absente du texte.
