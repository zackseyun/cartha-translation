  text: וַ/יֹּ֣אמֶר שָׁא֗וּל לָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ פִּקְדוּ נָ֣א וּ/רְא֔וּ מִ֖י הָלַ֣ךְ מֵ/עִמָּ֑/נוּ וַֽ/יִּפְקְד֔וּ וְ/הִנֵּ֛ה אֵ֥ין יוֹנָתָ֖ן וְ/נֹשֵׂ֥א כֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: fr
  text: 'Alors Saül dit au peuple qui était avec lui : « Faites donc l’appel et voyez qui nous a quittés. » Ils firent l’appel, et voici que Jonathan et celui qui portait ses armes n’étaient pas là.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּקְדוּ נָא
  choice: Faites donc l’appel
  rationale: Dans ce contexte, פקד désigne la vérification des hommes présents afin de découvrir qui manque. « Faire l’appel » est naturel en français et « donc » rend ici avec légèreté la particule נָא qui atténue ou presse l’impératif.
- source_word: וּרְאוּ
  choice: et voyez
  rationale: Cette traduction conserve la succession des impératifs et reste idiomatique ; dans le contexte, il s’agit de constater ou de découvrir.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: qui nous a quittés
  rationale: La tournure exprime le départ hors du groupe. « Qui nous a quittés » communique clairement ce sens sans suggérer nécessairement une défection définitive.
- source_word: וַיִּפְקְדוּ
  choice: Ils firent l’appel
  rationale: La répétition de la même expression française maintient le lien lexical avec l’ordre précédent.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette formule garde la force narrative de הִנֵּה, qui attire l’attention sur la découverte, dans un registre français digne et courant.
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: Jonathan et celui qui portait ses armes n’étaient pas là
  rationale: La formulation rend naturellement l’absence exprimée par אֵין et conserve la coordination des deux personnes.
- source_word: נֹשֵׂא כֵלָיו
  choice: celui qui portait ses armes
  rationale: Cette traduction transparente restitue directement la fonction décrite par l’hébreu et évite le terme « écuyer », qui pourrait évoquer un cadre médiéval étranger au récit.
