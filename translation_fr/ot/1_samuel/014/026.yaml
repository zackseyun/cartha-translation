base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: fr
  text: Quand le peuple entra dans la forêt, voici que le miel coulait[a] ; mais personne ne porta la main à sa bouche[b], car le peuple craignait le serment[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un écoulement de miel ». On peut aussi comprendre : « il y avait un flot de miel » ou « un ruisseau de miel ».'
    reason: lexical_alternative
  - marker: b
    text: Cette expression concrète signifie que personne ne mangea de ce miel.
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, « le serment » renvoie aux paroles prononcées plus tôt par Saül, qui avait appelé la malédiction sur quiconque mangerait avant le soir (voir 1 Samuel 14.24).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא הָעָם אֶל הַיַּעַר
  choice: Quand le peuple entra dans la forêt
  rationale: Le verbe בוא exprime ici l’entrée dans un lieu. « Entra dans la forêt » est naturel en français et conserve le sens narratif du wayyiqtol. עם reste rendu par « peuple », terme plus large que « troupes ».
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française actuelle conserve la fonction de הִנֵּה, qui attire vivement l’attention sur ce que le peuple découvre.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: le miel coulait
  rationale: L’expression rare décrit un mouvement ou écoulement de miel. La formulation verbale est plus naturelle en français que le calque nominal « un écoulement de miel », sans préciser indûment qu’il s’agissait d’un ruisseau.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: mais personne ne porta la main à sa bouche
  rationale: Cette formulation préserve l’image concrète de l’hébreu, tout en étant idiomatique en français. Le sens contextuel est que personne ne mangea de ce miel.
- source_word: כִּי יָרֵא הָעָם אֶת הַשְּׁבֻעָה
  choice: car le peuple craignait le serment
  rationale: כִּי introduit la cause, ירא exprime ici la crainte d’enfreindre l’engagement imposé, et שְׁבוּעָה signifie proprement « serment ».
theological_decisions:
- issue: Le rapport entre le serment et la malédiction prononcée par Saül
  choice: Conserver « le serment » dans le texte principal
  alternative: Traduire par « la malédiction »
  rationale: Le nom hébreu שְׁבוּעָה désigne un serment. Le contexte de 1 Samuel 14.24 montre que ce serment comportait une malédiction, mais remplacer le terme par « malédiction » ferait disparaître la distinction lexicale du texte.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » garde la vivacité du récit sans employer l’archaïsant « voici ». La ponctuation française et les répétitions du texte hébreu sont conservées lorsqu’elles restent naturelles.
