base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: fr
  text: Alors le peuple se jeta sur le butin[a]. Ils prirent du petit bétail, du gros bétail et des veaux, les égorgèrent à même le sol, et le peuple mangea la viande avec le sang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « se précipita sur le butin ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’ils mangèrent la viande alors que le sang s’y trouvait encore, sans l’avoir convenablement fait couler.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל־שָׁלָל
  choice: le peuple se jeta sur le butin
  rationale: Cette expression rare décrit ici une ruée énergique vers le butin. « Se jeta sur » restitue le mouvement soudain et incontrôlé suggéré par le contexte, tout en restant naturel en français.
- source_word: שָׁלָל
  choice: butin
  rationale: « Butin » est le terme français courant et précis pour les biens et animaux pris après un combat.
- source_word: צֹאן
  choice: petit bétail
  rationale: Le nom collectif désigne les ovins et peut aussi inclure les caprins. « Petit bétail » préserve cette portée plus large que « moutons ».
- source_word: בָּקָר
  choice: gros bétail
  rationale: Le terme désigne collectivement les bovins. « Gros bétail » s'accorde avec le collectif précédent et évite de limiter indûment le sens à des bœufs mâles.
- source_word: בְּנֵי בָקָר
  choice: veaux
  rationale: Littéralement « petits du gros bétail », cette expression désigne de jeunes bovins. « Veaux » est l'équivalent français naturel.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: les égorgèrent à même le sol
  rationale: La forme directive de « terre » indique que les animaux furent égorgés directement sur le sol. « À même le sol » rend clairement cette circonstance sans incorporer dans le texte principal l'explication du sang non évacué.
- source_word: עַל־הַדָּם
  choice: avec le sang
  rationale: Cette traduction concise conserve la formulation frappante et dense de l'hébreu. Le complément « la viande », implicite dans le contexte, rend la phrase naturelle en français, tandis que la note explicite le sens probable.
theological_decisions:
- issue: Degré d'explicitation de עַל־הַדָּם et de la faute liée au sang
  choice: la viande avec le sang
  alternative: la viande sans en avoir fait couler le sang
  rationale: L'hébreu reste bref et dit littéralement que le peuple mangea « avec le sang ». Le texte principal conserve cette tension et n'insère pas directement l'interprétation juridique; la note explique qu'il s'agit vraisemblablement de viande dont le sang n'avait pas été convenablement évacué.
translation_notes:
  register: Français international moderne, narratif et digne. « Se jeta sur », « à même le sol » et « avec le sang » sont naturels sans effacer la vigueur ni la concision de l’hébreu. Les collectifs « petit bétail » et « gros bétail » préservent la portée des catégories animales.
