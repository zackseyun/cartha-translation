  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: fr
  text: Tous les gens du pays entrèrent dans la forêt[a], et il y avait du miel à la surface du sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout le pays entra dans la forêt ». Le verbe hébreu est au pluriel, ce qui indique probablement que « le pays » désigne collectivement ses habitants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à la surface du champ » ; littéralement : « sur la face du champ »​.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Tous les gens du pays
  rationale: L’hébreu dit littéralement « tout le pays », mais le verbe au pluriel et le contexte indiquent un emploi collectif désignant les personnes présentes. La formulation française explicite cette métonymie sans en restreindre arbitrairement la portée aux seuls soldats.
- source_word: בָּאוּ בַיַּעַר
  choice: entrèrent dans la forêt
  rationale: Avec un complément de lieu introduisant l’intérieur d’un espace boisé, בוא se rend naturellement par « entrer dans ». יַעַר désigne une forêt ou une région boisée.
- source_word: וַיְהִי דְבַשׁ
  choice: et il y avait du miel
  rationale: Ici, היה présente l’existence du miel dans la scène. « Il y avait » est idiomatique en français. Le texte dit simplement « miel », sans préciser explicitement qu’il était sauvage.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: à la surface du sol
  rationale: עַל־פְּנֵי exprime ici la présence sur une surface visible. שָׂדֶה peut désigner un champ, mais, dans ce contexte forestier, « sol » communique plus naturellement le terrain sur lequel se trouvait le miel, tandis qu’une note conserve la traduction plus formelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit. La métonymie de « tout le pays » est explicitée dans le texte, tandis que sa forme littérale est conservée en note ; l’ambiguïté de שָׂדֶה entre « champ » et terrain est également signalée.
