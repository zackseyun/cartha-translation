  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: fr
  text: 'Tous deux se montrèrent au poste des Philistins[a]. Les Philistins dirent : « Regardez ! Les Hébreux[b] sortent des trous où ils s’étaient cachés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la garnison philistine ».
    reason: lexical_alternative
  - marker: b
    text: « Hébreux » est le nom ethnique que les Philistins donnent ici aux Israélites.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: se montrèrent
  rationale: Le nifal de גלה a ici une valeur réfléchie ou passive. Dans le contexte, Jonathan et celui qui porte ses armes se rendent volontairement visibles ; « se montrèrent » exprime naturellement cette action délibérée.
- source_word: שְׁנֵיהֶם
  choice: Tous deux
  rationale: L’expression désigne explicitement Jonathan et celui qui porte ses armes, tout en conservant l’insistance sur les deux hommes.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: poste des Philistins
  rationale: Dans ce contexte militaire, מַצָּב peut désigner soit un poste, soit la troupe qui y est stationnée. « Poste des Philistins » est clair et idiomatique sans trancher excessivement en faveur du seul bâtiment ou de la seule garnison.
- source_word: הִנֵּה
  choice: Regardez !
  rationale: Cette particule attire vivement l’attention. L’impératif au pluriel convient à une parole adressée au groupe des Philistins et garde la force exclamative dans un français actuel.
- source_word: עִבְרִים
  choice: Les Hébreux
  rationale: Le terme ethnique employé par les Philistins est conservé, car il reflète leur manière extérieure de désigner les Israélites.
- source_word: יֹצְאִים
  choice: sortent
  rationale: Le participe présente l’action en cours sous les yeux des Philistins. Le présent français rend cet effet avec naturel.
- source_word: מִן הַחֹרִים
  choice: des trous
  rationale: חֹרִים désigne concrètement des trous ou cavités. « Trous » conserve cette image, peut-être méprisante, sans préciser à tort qu’il s’agit de grottes.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: où ils s’étaient cachés
  rationale: Le plus-que-parfait rend l’action antérieure au moment où les Philistins les voient sortir. Le français pronominal exprime naturellement la valeur réfléchie du hitpael.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La réplique reste vive grâce à « Regardez ! », tandis que « des trous » préserve le caractère concret du propos philistin.
