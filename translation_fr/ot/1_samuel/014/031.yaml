  text: וַ/יַּכּ֞וּ בַּ/יּ֤וֹם הַ/הוּא֙ בַּ/פְּלִשְׁתִּ֔ים מִ/מִּכְמָ֖שׂ אַיָּלֹ֑נָ/ה וַ/יָּ֥עַף הָ/עָ֖ם מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: fr
  text: Ce jour-là, ils frappèrent les Philistins de Mikmas jusqu’à Ayyalôn, et le peuple était très fatigué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: ils frappèrent
  rationale: Le verbe נכה décrit ici l’action militaire menée contre les Philistins. « Frappèrent » en conserve la portée sans préciser davantage que l’hébreu s’il s’agit de tuer ou de mettre en déroute.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Formulation temporelle naturelle en français moderne, correspondant directement à l’expression hébraïque.
- source_word: בַּפְּלִשְׁתִּים
  choice: les Philistins
  rationale: La préposition introduit ici les adversaires visés par l’action militaire; le nom ethnique traditionnel français convient.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: depuis Mikmas jusqu’à Ayyalôn
  rationale: La préposition מִן marque le point de départ, tandis que la terminaison directive de אַיָּלֹנָה indique le mouvement vers Ayyalôn. « Depuis… jusqu’à » rend clairement cette étendue géographique.
- source_word: וַיָּעַף הָעָם מְאֹד
  choice: le peuple était épuisé
  rationale: Le verbe exprime une grande fatigue, renforcée par מְאֹד. « Était épuisé » est idiomatique, vigoureux et adapté au singulier collectif « le peuple ».
