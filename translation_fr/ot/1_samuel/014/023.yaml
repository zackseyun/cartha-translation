id: 1SA.14.23
reference: 1 Samuel 14:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: fr
  text: Ce jour-là, Yahweh sauva Israël, et le combat se poursuivit au-delà de Beth-Aven[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le combat dépassa Beth-Aven » ; autre compréhension possible : « le combat atteignit Beth-Aven ».'
    reason: La construction עבר avec אֶת devant le nom de lieu peut décrire le passage au-delà ou devant ce lieu ; certains comprennent plutôt que l’affrontement s’étendit jusqu’à Beth-Aven.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: sauva
  rationale: Le hiphil de ישׁע exprime ici l’action de délivrer ou sauver. « Sauva » reste concis, attribue clairement l’action à Yahweh et conserve la portée théologique du verbe sans la réduire à une simple victoire militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de représenter directement le tétragramme du texte hébreu.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français moderne, correspondant exactement au repère narratif hébreu.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne collectivement le peuple ou les forces d’Israël, objet direct du salut accompli par Yahweh.
- source_word: וְהַמִּלְחָמָה
  choice: et le combat
  rationale: Dans ce contexte d’affrontement précis, « combat » est plus naturel que « guerre » et peut désigner l’action militaire en cours.
- source_word: עָבְרָה אֶת בֵּית אָוֶן
  choice: se poursuivit au-delà de Beth-Aven
  rationale: Le verbe עבר indique un mouvement qui passe ou va au-delà d’un lieu. « Se poursuivit » rend naturellement en français le déplacement du combat, tandis que « au-delà de » préserve la valeur spatiale probable sans exclure entièrement la nuance de passage devant le lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le nom propre divin. La transcription « Yahweh » préserve cette donnée du texte au lieu de lui substituer un titre.
- issue: Nature de l’intervention divine exprimée par וַיּוֹשַׁע
  choice: sauva
  alternative: donna la victoire à
  rationale: « Sauva » conserve le champ plus large de ישׁע et laisse subsister sa portée théologique, alors que « donna la victoire » limiterait explicitement l’action au résultat militaire.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au récit historique écrit. « Beth-Aven » suit une graphie française transparente, et la formulation évite un calque maladroit tout en signalant l’ambiguïté spatiale dans la note.
