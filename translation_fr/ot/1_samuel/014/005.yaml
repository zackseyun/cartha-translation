  - marker: b
    text: Certaines traductions portent « Guibéa », mais le nom de lieu du texte hébreu est Guéba.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: escarpements
  rationale: Littéralement « dent » ; dans ce contexte topographique, le mot désigne par métaphore une saillie rocheuse abrupte. « Escarpement » exprime naturellement ce relief en français.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: l’un ... et l’autre
  rationale: Cette tournure distributive distingue les deux formations rocheuses ; « l’un… et l’autre » est idiomatique en français.
- source_word: מָצוּק
  choice: se dressait
  rationale: Le terme évoque ici une formation abrupte ou proéminente et sa position. « Se dressait » convient à la description topographique sans imposer un sens technique incertain.
- source_word: מִצָּפוֹן
  choice: du côté nord
  rationale: La préposition et le nom indiquent la position sur le côté nord du passage.
- source_word: מוּל
  choice: en face de
  rationale: Le terme marque une position vis-à-vis d’un lieu ; « en face de » est clair et naturel.
- source_word: מִכְמָשׂ
  choice: Mikmas
  rationale: Translittération française courante du nom de lieu hébreu.
- source_word: מִנֶּגֶב
  choice: du côté sud
  rationale: Le mot désigne ici le côté sud, en parallèle et en contraste avec le nord.
- source_word: גָּבַע
  choice: Guéba
  rationale: Le texte hébreu porte le nom de lieu Guéba, distinct de Guibéa ; cette distinction est géographiquement importante.
