  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: fr
  text: L’un des deux escarpements[a] se dressait du côté nord, en face de Mikmas, et l’autre du côté sud, en face de Guéba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu signifie littéralement « dent » ; il désigne ici, par image, une saillie rocheuse abrupte.
