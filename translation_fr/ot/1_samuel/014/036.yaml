  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: fr
  text: 'Alors Saül dit : « Descendons pendant la nuit à la poursuite des Philistins, pillons-les jusqu’aux premières lueurs du matin et ne laissons aucun homme parmi eux. » Ils répondirent : « Fais tout ce qui te semble bon. » Mais le prêtre dit : « Approchons-nous ici de Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, s’approcher de Dieu peut impliquer de rechercher sa direction avant d’agir, sans que le texte précise la démarche rituelle employée.
    reason: 'Clarification contextuelle : elle signale l’implication possible sans remplacer le verbe général de l’hébreu par « consulter » ou « interroger ».'
lexical_decisions:
- source_word: נֵרְדָה
  choice: Descendons
  rationale: Le cohortatif exprime une proposition pressante de Saül. « Descendons » conserve la nuance directionnelle de ירד, vraisemblablement pertinente dans le relief du récit.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: à la poursuite des Philistins
  rationale: אַחֲרֵי signifie littéralement « derrière, après » ; dans ce contexte militaire, le français naturel explicite l’idée de poursuite sans en faire directement une attaque.
- source_word: לַיְלָה
  choice: pendant la nuit
  rationale: L’expression indique le moment de l’action. Cette formulation évite de préciser « cette nuit », précision que l’hébreu n’énonce pas formellement.
- source_word: וְנָבֹזָה בָהֶם
  choice: pillons-les
  rationale: Le verbe בזז désigne le pillage. Le pronom objet donne ici un français naturel tout en conservant les Philistins comme ceux aux dépens de qui le pillage est mené.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: jusqu’aux premières lueurs du matin
  rationale: Cette expression française naturelle conserve l’image explicite de la lumière matinale, contrairement au plus abstrait « jusqu’au matin ».
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: et n’en laissons pas un seul
  rationale: La formulation garde la portée distributive et totale de אִישׁ sans ajouter explicitement « en vie », qui est fortement impliqué par le contexte mais absent du texte hébreu.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Fais tout ce qui est bon à tes yeux
  rationale: Cette traduction préserve l’image idiomatique hébraïque des « yeux », tout en restant intelligible en français moderne.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: Approchons-nous ici de Dieu
  rationale: Le cohortatif de קרב est rendu comme une invitation collective, et הֲלֹם est conservé par « ici ». La traduction n’introduit pas un verbe plus précis comme « consulter » ou « interroger ».
theological_decisions:
- issue: La démarche proposée par le prêtre avant la poursuite
  choice: Approchons-nous ici de Dieu
  alternative: Consultons Dieu ici
  rationale: Dans le contexte, les paroles du prêtre impliquent probablement que l’on recherche la direction divine avant d’agir. Toutefois, l’hébreu dit littéralement « approchons-nous » et ne nomme pas explicitement un acte de consultation ; le texte principal conserve donc cette retenue.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le discours direct reste énergique et oral. L’expression « bon à tes yeux » est volontairement conservée pour rendre l’image hébraïque, tandis que « aux premières lueurs du matin » et « à la poursuite » assurent une lecture naturelle.
