language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: fr
  text: Ahija, fils d’Ahitoub, frère d’Ikabod, fils de Pinhas, fils d’Éli, prêtre de Yahweh à Silo, portait un éphod[a]. Le peuple ne savait pas que Jonathan était parti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « transportait un éphod ». Le verbe hébreu signifie littéralement « porter »; il peut ici évoquer le port de l’éphod comme vêtement sacerdotal ou son transport.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Ahija
  rationale: Le waw assure la continuité narrative sans exiger un « et » initial en français; le nom est translittéré sous une forme française usuelle.
- source_word: בֶן אֲחִטוּב
  choice: fils d’Ahitoub
  rationale: Rend directement la construction généalogique hébraïque.
- source_word: אֲחִי אִיכָבוֹד
  choice: frère d’Ikabod
  rationale: Le sens ordinaire du construit אֲחִי est « frère de »; le contexte n’impose pas le sens plus large de parent.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: fils de Pinhas, fils d’Éli
  rationale: Conserve explicitement la chaîne généalogique et son ambiguïté syntaxique naturelle.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: prêtre de Yahweh à Silo
  rationale: L’apposition identifie Ahija comme prêtre attaché au service de Yahweh à Silo; « à » convient naturellement au lieu cultuel.
- source_word: נֹשֵׂא אֵפוֹד
  choice: portait un éphod
  rationale: Le verbe נשׂא signifie porter ou transporter. « Portait » préserve en français l’ambiguïté entre le fait d’avoir l’éphod sur soi et celui de le transporter.
- source_word: וְ/הָעָם לֹא יָדַע
  choice: Le peuple ne savait pas
  rationale: Le singulier collectif hébreu se rend naturellement par « le peuple » avec un verbe au singulier; le waw n’a pas besoin d’être reproduit mécaniquement.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: que Jonathan était parti
  rationale: Après le verbe savoir, כִּי introduit le contenu de ce qui était ignoré; le plus-que-parfait marque l’antériorité du départ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Fonction exacte de l’éphod
  choice: portait un éphod
  alternative: était revêtu d’un éphod
  rationale: Le contexte est sacerdotal, mais le verbe ne précise pas à lui seul si Ahija portait l’éphod comme vêtement ou le transportait; la formulation choisie maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent des formes françaises lisibles; la longue apposition généalogique de l’hébreu est conservée. La répétition initiale de « et » n’est pas reproduite lorsque la continuité narrative suffit en français.
