  text: וַ/יַּעֲנוּ֩ אַנְשֵׁ֨י הַ/מַּצָּבָ֜ה אֶת יוֹנָתָ֣ן וְ/אֶת נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּֽאמְרוּ֙ עֲל֣וּ אֵלֵ֔י/נוּ וְ/נוֹדִ֥יעָה אֶתְ/כֶ֖ם דָּבָ֑ר וַ/יֹּ֨אמֶר יוֹנָתָ֜ן אֶל נֹשֵׂ֤א כֵלָי/ו֙ עֲלֵ֣ה אַחֲרַ֔/י כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יַ֥ד יִשְׂרָאֵֽל־׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: fr
  text: 'Les hommes du poste répondirent à Jonathan et à celui qui portait ses armes : « Montez jusqu’à nous, et nous allons vous apprendre quelque chose. » Jonathan dit alors à celui qui portait ses armes : « Monte derrière moi, car Yahweh les a livrés au pouvoir d’Israël[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les a donnés dans la main d’Israël ».'
    reason: La note conserve l’image de l’idiome hébreu rendu dans le texte par « livrés au pouvoir d’Israël ».
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: les hommes du poste
  rationale: Dans ce contexte militaire, מַצָּבָה désigne une position ou un poste occupé par des soldats. « Les hommes du poste » est naturel et n’impose pas l’idée plus large d’une garnison entière.
- source_word: נֹשֵׂא כֵלָיו
  choice: celui qui portait ses armes
  rationale: Cette formulation rend directement l’expression hébraïque, où כֵּלִים désigne ici l’équipement ou les armes, sans recourir au terme français potentiellement trompeur « écuyer ».
- source_word: עֲלוּ אֵלֵינוּ
  choice: Montez jusqu’à nous
  rationale: Le verbe עלה indique un déplacement vers le haut, et אֵלֵינוּ marque l’orientation vers les locuteurs placés en hauteur.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: et nous allons vous apprendre quelque chose
  rationale: Le hiphil de ידע signifie faire savoir ou apprendre quelque chose à quelqu’un. La traduction conserve le caractère volontairement vague de דָּבָר.
- source_word: עֲלֵה אַחֲרַי
  choice: Monte derrière moi
  rationale: L’impératif est au singulier et exprime à la fois l’ascension et la position de celui qui suit Jonathan.
- source_word: כִּי נְתָנָם יְהוָה בְּיַד יִשְׂרָאֵל
  choice: car Yahweh les a livrés au pouvoir d’Israël
  rationale: L’expression נתן ביד est un idiome militaire signifiant livrer quelqu’un au pouvoir d’un autre. La traduction idiomatique en français transmet clairement ce sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » en conserve la fonction de nom propre.
- issue: Valeur de נְתָנָם au parfait
  choice: les a livrés
  alternative: va les livrer
  rationale: Le parfait hébreu présente la victoire comme déjà accordée avec certitude. Le passé composé français conserve cette affirmation sans la réduire à une simple prédiction.
translation_notes:
  register: Français international moderne, narratif et digne. Les répliques restent directes; « celui qui portait ses armes » privilégie la clarté historique, tandis que « poste » maintient la portée militaire sans surtraduction.
