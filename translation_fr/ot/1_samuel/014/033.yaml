base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: fr
  text: 'Alors on informa Saül : « Voici, le peuple pèche contre Yahweh en mangeant de la viande avec son sang[a]. » Il répondit : « Vous avez agi de façon déloyale. Faites rouler vers moi, aujourd’hui, une grande pierre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « en mangeant sur le sang ». Cette expression désigne la consommation de viande dont le sang n’a pas été convenablement évacué ; la nuance précise de la préposition demeure discutée.
    reason: Explication de l’idiome hébreu tout en préservant l’ambiguïté de la préposition עַל.
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: Alors on informa Saül en disant
  rationale: Le wayyiqtol poursuit le récit. La tournure impersonnelle française convient au pluriel indéfini du contexte, tandis que « en disant » conserve la formule hébraïque d’introduction du discours.
- source_word: הִנֵּה
  choice: Regarde !
  rationale: Cette particule attire vivement l’attention sur ce qui est signalé ; « Regarde ! » en restitue la force dans un français moderne.
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom collectif défini désigne ici les hommes rassemblés sous l’autorité de Saül.
- source_word: חֹטִאים לַיהוָה
  choice: pèche contre Yahweh
  rationale: Le verbe חטא construit avec ל exprime ici une faute commise contre Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: en mangeant la viande avec son sang
  rationale: L’expression hébraïque, littéralement « manger sur/avec le sang », désigne dans ce contexte la consommation de viande dont le sang n’a pas été convenablement évacué. L’ajout de « la viande » rend l’idiome intelligible sans en effacer l’image.
- source_word: בְּגַדְתֶּם
  choice: Vous avez agi en traîtres
  rationale: בגד exprime une conduite déloyale ou perfide ; cette formulation conserve la gravité de l’accusation.
- source_word: גֹּלּוּ אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: Roulez aujourd’hui vers moi une grosse pierre
  rationale: L’impératif de גלל signifie concrètement « rouler ». « Aujourd’hui » traduit directement הַיּוֹם sans le transformer en simple marqueur d’urgence.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme ; « Yahweh » préserve le nom propre au lieu de le remplacer par un titre.
- issue: Nature de la faute liée au sang
  choice: manger la viande avec son sang
  alternative: manger au-dessus du sang
  rationale: Le contexte immédiat indique qu’il s’agit de viande consommée sans que son sang ait été correctement évacué. La traduction rend ce sens sans développer davantage la portée rituelle ou théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste vif ; le vocabulaire conserve la sévérité morale du texte sans archaïsme inutile.
