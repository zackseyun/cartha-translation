  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ לַֽ/אֲחִיָּ֔ה הַגִּ֖ישָׁ/ה אֲר֣וֹן הָ/אֱלֹהִ֑ים כִּֽי הָיָ֞ה אֲר֧וֹן הָ/אֱלֹהִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא וּ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: fr
  text: 'Alors Saül dit à Ahija : « Fais approcher l’arche de Dieu[a]. » En effet, ce jour-là, l’arche de Dieu se trouvait avec les Israélites[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certaines traditions textuelles lisent ici : « Fais approcher l’éphod » ; certains interprètes comprennent également ainsi. Le texte hébreu retenu porte : « l’arche de Dieu ».'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « était ce jour-là avec les fils d’Israël ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: לַאֲחִיָּה
  choice: à Ahija
  rationale: Le nom propre est translittéré sous une forme française courante et proche de l’hébreu.
- source_word: הַגִּישָׁה
  choice: Fais approcher
  rationale: L’impératif causatif de נגשׁ signifie faire venir près, présenter ou apporter. Cette formulation conserve la valeur causative sans alourdir l’ordre.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: L’hébreu dit explicitement « l’arche de Dieu », sans ajouter « de l’alliance ».
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit ici une explication du narrateur ; « En effet » rend cette relation avec naturel.
- source_word: הָיָה
  choice: se trouvait
  rationale: Dans cette proposition de localisation, « se trouvait » est un équivalent français idiomatique de « était ».
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Rend directement et naturellement l’expression temporelle hébraïque.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: avec les Israélites
  rationale: « Les Israélites » est l’équivalent collectif naturel de l’expression hébraïque littérale « les fils d’Israël » ; la préposition est conservée par « avec ».
theological_decisions:
- issue: « arche de Dieu » ou variante « éphod »
  choice: l’arche de Dieu
  alternative: l’éphod
  rationale: Le texte hébreu fourni porte deux fois « l’arche de Dieu ». La variante ancienne « l’éphod », cohérente avec certains éléments du contexte, est signalée en note plutôt que substituée au texte source.
- issue: Portée de l’indication de présence à la fin du verset
  choice: se trouvait avec les Israélites
  alternative: était là ce jour-là avec les fils d’Israël
  rationale: La formulation retenue exprime la localisation de manière naturelle sans ajouter un adverbe distinct absent de l’hébreu ; la tournure plus littérale reste indiquée en note.
translation_notes:
  register: Français moderne, clair et digne. Le discours direct demeure bref et impératif. « Israélites » évite une littéralité peu naturelle, tandis que la note conserve la forme hébraïque. Les deux marqueurs de note figurent dans le texte principal.
