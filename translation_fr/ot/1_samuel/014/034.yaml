source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: fr
  text: 'Saül dit : « Répandez-vous parmi le peuple et dites-leur : “Que chacun m’amène son bœuf ou son mouton. Vous les égorgerez ici et vous les mangerez, sans pécher contre Yahweh en mangeant la viande avec son sang[a].” » Cette nuit-là, tous les gens amenèrent leur bœuf, chacun le conduisant de sa propre main[b], et ils les égorgèrent là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en mangeant avec — ou sur — le sang »; il s’agit vraisemblablement de manger la viande avant que le sang ait été convenablement évacué.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chacun son bœuf dans sa main »; l’expression peut signifier que chacun conduisait lui-même son bœuf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: Répandez-vous parmi le peuple
  rationale: L’impératif de פוץ évoque le fait de se disperser dans tout le groupe. « Répandez-vous parmi » garde cette image concrète tout en étant naturel comme ordre adressé à plusieurs personnes.
- source_word: הַגִּישׁוּ אֵלַי
  choice: m’amène
  rationale: Le hiphil de נגשׁ signifie faire approcher ou présenter. « Amener » convient naturellement à des animaux conduits vers Saül.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: Que chacun m’amène son bœuf ou son mouton
  rationale: La répétition de אִישׁ a une valeur distributive. Le français emploie ici « ou » pour indiquer que chacun doit apporter l’animal qu’il possède, sans suggérer que toute personne possède nécessairement les deux. « Mouton » rend שֶׂה de façon courante, bien que le terme hébreu puisse désigner une bête du petit bétail, brebis ou chèvre.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: Vous les égorgerez ici
  rationale: שׁחט désigne l’abattage d’un animal, souvent par égorgement, plutôt qu’une mise à mort quelconque. « Ici » rend simplement la valeur locative de בָּזֶה.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: sans pécher contre Yahweh
  rationale: La tournure française exprime le but préventif de l’ordre. La préposition indique ici que le péché est commis contre Yahweh.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: en mangeant la viande avec son sang
  rationale: La formulation explicite « la viande », implicite dans le contexte, afin que l’expression soit intelligible en français. « Avec son sang » reste proche de l’hébreu et la note précise le sens contextuel.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: chacun le conduisant de sa propre main
  rationale: Littéralement, le texte dit « chacun son bœuf dans sa main ». La traduction communique l’idée vraisemblable que chacun tenait et conduisait personnellement son animal, tout en signalant la formulation littérale en note.
- source_word: הַלַּיְלָה
  choice: Cette nuit-là
  rationale: Le nom fonctionne comme complément circonstanciel de temps et renvoie à la nuit de l’épisode.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: ils les égorgèrent là
  rationale: Le complément d’objet, implicite en hébreu, est repris en français; « égorger » conserve le sens précis de שׁחט.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Nature du péché lié au sang
  choice: manger la viande avec son sang
  alternative: manger sur le sang
  rationale: Le contexte immédiat concerne l’abattage et la consommation d’animaux. La traduction garde l’association étroite entre nourriture et sang sans développer une interprétation rituelle particulière; la note explique seulement le référent contextuel probable.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs restent directs, le vocabulaire de l’abattage est concret, et les formulations hébraïques difficiles sont clarifiées sans effacer leurs possibilités lexicales, conservées dans les notes.
