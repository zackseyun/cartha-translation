  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ חֲזָקָ֣ה עַל פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֣י שָׁא֑וּל וְ/רָאָ֨ה שָׁא֜וּל כָּל אִ֤ישׁ גִּבּוֹר֙ וְ/כָל בֶּן חַ֔יִל וַ/יַּאַסְפֵ֖/הוּ אֵלָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: fr
  text: La guerre contre les Philistins fut acharnée[a] pendant toute la vie de Saül. Chaque fois que Saül voyait un homme vaillant ou un homme de valeur[b], il le prenait à son service[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rude » ou « intense ». L’adjectif hébreu signifie littéralement « forte ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout homme vaillant et tout fils de valeur ».'
    reason: lexical_alternative
  - marker: c
    text: Autrement dit, Saül recrutait ces hommes pour qu’ils servent sous ses ordres.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: La guerre … fut
  rationale: Le syntagme décrit la poursuite de la guerre dans le récit, plutôt qu’une bataille isolée. Le passé simple convient au registre narratif français.
- source_word: חֲזָקָה
  choice: acharnée
  rationale: L’adjectif signifie littéralement « forte ». Appliqué à une guerre, « acharnée » exprime naturellement son intensité durable sans suggérer une victoire particulière.
- source_word: עַל פְּלִשְׁתִּים
  choice: contre les Philistins
  rationale: Avec « guerre », la préposition עַל désigne ici l’adversaire.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: pendant toute la vie de Saül
  rationale: L’expression hébraïque signifie littéralement « tous les jours de Saül » et désigne toute la durée de sa vie ou de son règne; la formulation retenue est claire et naturelle.
- source_word: וְרָאָה
  choice: Chaque fois que Saül voyait
  rationale: Dans ce contexte, cette forme exprime une action habituelle et répétée, liée à celle qui suit.
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: un homme vaillant
  rationale: גִּבּוֹר désigne un homme fort ou valeureux, souvent avec une nuance guerrière. « Homme vaillant » conserve cette portée.
- source_word: וְכָל בֶּן חַיִל
  choice: ou un homme de valeur
  rationale: Littéralement « fils de valeur/vaillance », cet idiome peut évoquer la bravoure, la capacité ou la qualité personnelle. « Homme de valeur » préserve cette largeur de sens et évite de confondre entièrement les deux expressions parallèles.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: il le prenait à son service
  rationale: Littéralement, Saül « le rassemblait vers lui ». Dans ce cadre militaire, l’expression indique qu’il incorporait ces hommes à sa troupe ou à son service.
theological_decisions: []
