  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: fr
  text: 'S’ils nous disent : « Ne bougez pas[a] jusqu’à ce que nous venions à vous », alors nous resterons sur place[b] et nous ne monterons pas vers eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Restez immobiles » ou « Attendez ». Le verbe hébreu peut évoquer le fait de rester immobile ou silencieux à sa place.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nous nous tiendrons sous nous », expression hébraïque signifiant « nous resterons à notre place ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: S’ils nous disent ceci
  rationale: La tournure introduit la première branche de l’alternative proposée par Jonathan. « Ceci » conserve la valeur démonstrative de כֹּה tout en introduisant naturellement le discours direct.
- source_word: דֹּמּוּ
  choice: Ne bougez pas
  rationale: L’impératif de דמם peut exprimer l’immobilité ou le silence. Dans ce contexte militaire, il ordonne surtout à Jonathan et à son porteur d’armes de rester où ils sont; la note préserve les autres nuances possibles.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: jusqu’à ce que nous arrivions jusqu’à vous
  rationale: Cette formulation rend explicitement le déplacement des Philistins vers les deux hommes et respecte la construction avec אֶל.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: alors nous resterons sur place
  rationale: Après la condition, le parfait avec waw exprime la conduite qui en résultera. תַחְתֵּינוּ est une expression idiomatique désignant la position occupée, et non un emplacement littéralement situé sous eux.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: et nous ne monterons pas vers eux
  rationale: « Monter » conserve la dimension topographique de עלה, puisque les Philistins occupent une position élevée, sans transformer explicitement le mouvement en attaque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste naturel, tandis que « monter vers eux » conserve le relief militaire et topographique du récit.
