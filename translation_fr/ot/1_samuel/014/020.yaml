revisions:
- from: Alors Saül et tous ceux qui étaient avec lui furent rassemblés[a], puis ils arrivèrent jusqu’au lieu du combat. Et voici que chacun avait son épée tournée contre son compagnon, dans une confusion extrême[b].
  to: Alors Saül et tout le peuple qui était avec lui furent rassemblés[a], et ils arrivèrent jusqu’au lieu du combat. Et voici que l’épée de chacun était dirigée contre son compagnon, dans une confusion extrême[b].
  rationale: 'Révision limitée à deux améliorations sûres : « tout le peuple » reproduit plus exactement le collectif עָם, et « l’épée de chacun était dirigée » rend plus naturellement en français la construction elliptique « l’épée d’un homme contre son compagnon ». Le passif initial et les deux notes sont maintenus afin de préserver l’ambiguïté lexicale du texte source.'
