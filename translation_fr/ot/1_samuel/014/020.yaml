  text: וַ/יִּזָּעֵ֣ק שָׁא֗וּל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד הַ/מִּלְחָמָ֑ה וְ/הִנֵּ֨ה הָיְתָ֜ה חֶ֤רֶב אִישׁ֙ בְּ/רֵעֵ֔/הוּ מְהוּמָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: fr
  text: Alors Saül et tout le peuple qui était avec lui furent rassemblés[a], et ils arrivèrent jusqu’au lieu du combat. Et voici que l’épée de chacun était dirigée contre son compagnon, dans une confusion extrême[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussèrent un cri » ou « furent convoqués ». Le verbe hébreu peut être compris de plusieurs manières ici.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans une immense panique » ou « dans un tumulte extrême ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: furent rassemblés
  rationale: Le niphal de זעק peut ici exprimer le fait d’être convoqué ou rassemblé. Le passif respecte la forme hébraïque et le mouvement narratif de mobilisation, tout en restant naturel en français.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: tous ceux qui étaient avec lui
  rationale: Dans ce contexte militaire, עָם désigne le groupe accompagnant Saül. Cette formulation conserve la portée collective sans introduire une précision absente du texte.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: ils arrivèrent jusqu’au lieu du combat
  rationale: La construction בוא + עד indique qu’ils atteignent la scène du combat. « Le lieu du combat » rend naturellement en français le sens concret de הַמִּלְחָמָה dans ce contexte.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette expression conserve la vivacité de הִנֵּה, qui attire soudain l’attention sur le spectacle découvert par Saül et les siens.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: chacun avait son épée tournée contre son compagnon
  rationale: La formulation reproduit l’image littérale de l’épée de chacun dirigée contre son prochain ou compagnon, sans expliciter davantage que l’hébreu la violence mutuelle au sein du camp.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: dans une confusion extrême
  rationale: מְהוּמָה peut désigner la confusion, la panique ou le tumulte. « Confusion extrême » garde ce champ sémantique ouvert et rend avec force גְּדוֹלָה מְאֹד.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passif « furent rassemblés » préserve l’ambiguïté du niphal; « Et voici que » maintient l’effet soudain du récit biblique sans archaïsme excessif.
