    issue: Formulation de l’épée
    rationale: « Chacun avait son épée tournée contre son compagnon » emploie « avait » de manière peu idiomatique et atténue la relation prédicative exprimée par « épée de chacun contre son compagnon » en hébreu. Une formulation avec « était dirigée » conserve l’image sans surinterpréter l’action.
  - severity: low
    issue: Rendu de הָעָם
    rationale: « Tous ceux qui étaient avec lui » est acceptable, mais « tout le peuple qui était avec lui » correspond plus directement au nom collectif hébreu et maintient la cohérence du vocabulaire narratif.
