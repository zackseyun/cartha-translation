base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: fr
  text: 'Saül affermit son pouvoir royal sur Israël et combattit, de tous côtés, tous ses ennemis : contre Moab, contre les Ammonites, contre Édom, contre les rois de Tsoba et contre les Philistins. Partout où il se tournait, il les châtiait[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il les déclarait coupables ». Le verbe hébreu peut signifier déclarer quelqu’un coupable et désigne probablement ici le châtiment infligé aux ennemis par leur défaite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה
  choice: affermit son pouvoir royal
  rationale: Le verbe לָכַד signifie littéralement « saisir, prendre », mais, avec « la royauté sur Israël » dans ce contexte, il décrit l’établissement ou la consolidation du règne de Saül. « Affermit son pouvoir royal » exprime cette prise ferme sans suggérer une usurpation illégitime.
- source_word: הַמְּלוּכָה
  choice: pouvoir royal
  rationale: Le terme désigne ici la royauté ou l’exercice de la fonction royale plutôt qu’un territoire. « Pouvoir royal » est naturel en français moderne et convient à la construction avec « sur Israël ».
- source_word: וַיִּלָּחֶם
  choice: combattit
  rationale: Rendu narratif direct du verbe « combattre, faire la guerre », dans un registre actuel et digne.
- source_word: סָבִיב בְּכָל אֹיְבָיו
  choice: tous ses ennemis de tous côtés
  rationale: La préposition introduit les adversaires, tandis que סָבִיב indique qu’ils entouraient Israël ou venaient de toutes les directions. La formulation française conserve cette portée.
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדֹום וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: Moab, les Ammonites, Édom, les rois de Tsoba et les Philistins
  rationale: « Ammonites » est l’équivalent français naturel de « fils d’Ammon ». Le pluriel hébreu « rois de Tsoba » est maintenu, sans l’harmoniser au singulier.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: Partout où il se tournait
  rationale: Cette tournure restitue clairement la valeur distributive de l’expression hébraïque.
- source_word: יַרְשִׁיעַ
  choice: il infligeait un châtiment
  rationale: Le hiphil de רשע est difficile ici. Dans ce contexte militaire, il évoque vraisemblablement le fait de traiter les ennemis en coupables et de leur infliger une défaite punitive. La traduction reste intelligible tout en signalant en note le sens plus littéral.
theological_decisions:
- issue: Valeur judiciaire ou militaire de יַרְשִׁיעַ
  choice: il infligeait un châtiment
  alternative: il les déclarait coupables / il les condamnait
  rationale: Le texte massorétique emploie un verbe à portée judiciaire, mais le contexte raconte les campagnes militaires de Saül. Le texte principal exprime donc le résultat punitif sans réduire le verbe à une simple victoire; la note conserve sa tension judiciaire.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles. La répétition hébraïque de la préposition devant chaque ennemi est allégée dans l’énumération française, tandis que « de tous côtés » en conserve la portée rhétorique.
