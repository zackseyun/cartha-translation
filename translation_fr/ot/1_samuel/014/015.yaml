  text: וַ/תְּהִי֩ חֲרָדָ֨ה בַ/מַּחֲנֶ֤ה בַ/שָּׂדֶה֙ וּ/בְ/כָל הָ/עָ֔ם הַ/מַּצָּב֙ וְ/הַ/מַּשְׁחִ֔ית חָרְד֖וּ גַּם הֵ֑מָּה וַ/תִּרְגַּ֣ז הָ/אָ֔רֶץ וַ/תְּהִ֖י לְ/חֶרְדַּ֥ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: fr
  text: 'Une panique saisit le camp, la campagne et tout le peuple. Même la garnison et le groupe de pillards furent saisis de peur. La terre trembla : ce fut une panique venant de Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une immense panique » ou « une terreur divine ». L’expression hébraïque peut indiquer soit l’origine — « venant de Dieu » — soit une intensité extrême.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חָרְדוּ / חֶרְדַּת
  choice: panique / furent saisis de peur / panique
  rationale: La racine exprime le tremblement provoqué par la peur. « Panique » est naturel dans ce contexte militaire, tandis que la répétition du nom au début et à la fin conserve une partie de l'écho hébreu.
- source_word: בַמַּחֲנֶה
  choice: le camp
  rationale: Le sens locatif est direct; avec « saisir », le complément devient naturellement objet en français.
- source_word: בַשָּׂדֶה
  choice: la campagne
  rationale: Dans ce contexte, שׂדה désigne vraisemblablement l'espace ouvert hors du camp plutôt qu'un champ cultivé précis.
- source_word: וּבְכָל הָעָם
  choice: tout le peuple
  rationale: « Peuple » conserve la portée du terme hébreu, même si le contexte lui donne une nuance militaire.
- source_word: הַמַּצָּב
  choice: la garnison
  rationale: Le terme désigne ici les hommes stationnés à un poste militaire; « garnison » est précis et idiomatique.
- source_word: הַמַּשְׁחִית
  choice: le détachement de pillards
  rationale: Le participe hiphil substantivé désigne collectivement l'unité chargée de dévaster ou de piller; cette formulation rend à la fois sa fonction et sa valeur collective.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: La terre trembla
  rationale: רגז décrit ici l'ébranlement du sol; cette traduction reste sobre et naturelle.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: une panique venant de Dieu
  rationale: Cette lecture comprend le génitif comme indiquant la source, tout en signalant en note les autres analyses possibles.
theological_decisions:
- issue: Sens de לְחֶרְדַּת אֱלֹהִים
  choice: une panique venant de Dieu
  alternative: une immense panique; une terreur divine
  rationale: Le groupe hébreu peut attribuer la panique à Dieu ou employer אֱלֹהִים pour en marquer l'intensité. Le texte principal retient la source divine, cohérente avec le récit, sans supprimer l'ambiguïté, conservée en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe évite une répétition lourde de « tremblement » tout en conservant l'encadrement du verset par « panique ». Le marqueur [a] figure après l'expression ambiguë à laquelle la note se rapporte.
