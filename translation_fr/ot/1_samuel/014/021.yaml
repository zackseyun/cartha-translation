base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: fr
  text: Les Hébreux qui avaient auparavant été du côté des Philistins[a], qui étaient montés avec eux dans le camp alentour[b], se joignirent eux aussi à Israël[c], qui était avec Saül et Jonathan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « comme hier, avant-hier », expression idiomatique signifiant ici « autrefois » ou « auparavant ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « dans le camp alentour » est difficile. Elle peut désigner les Hébreux qui avaient accompagné les Philistins dans leur campement établi dans les environs.
    reason: textual_ambiguity
  - marker: c
    text: 'Littéralement : « furent eux aussi avec Israël ». Le contexte laisse entendre qu’ils changèrent de camp.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: Les Hébreux
  rationale: Le terme « Hébreux » est conservé plutôt que remplacé par « Israélites », car le texte emploie עִבְרִים et peut ainsi désigner ce groupe selon une perspective sociale ou extérieure.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: avaient auparavant été du côté des Philistins
  rationale: La construction signifie littéralement qu’ils « étaient pour/aux Philistins ». « Du côté des Philistins » exprime naturellement l’association ou l’allégeance sans suggérer qu’ils leur appartenaient comme des biens.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: auparavant
  rationale: L’expression idiomatique évoque littéralement « hier, avant-hier » et désigne ici une situation antérieure.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: qui étaient montés avec eux
  rationale: Le verbe עלה garde son sens directionnel de « monter », et le plus-que-parfait situe cette action avant le retournement raconté.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: dans le camp, aux alentours
  rationale: La syntaxe est difficile. Cette formulation conserve à la fois la mention du camp et la valeur spatiale de סביב sans imposer une reconstruction trop précise.
- source_word: וְגַם הֵמָּה
  choice: eux aussi
  rationale: 'La tournure rend l’insistance inclusive de וְגַם הֵמָּה : même ces Hébreux se retrouvèrent avec Israël.'
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: se rangèrent du côté d’Israël
  rationale: L’hébreu dit littéralement « être avec Israël », mais le contraste avec leur situation antérieure implique un changement de camp. La formulation française rend ce mouvement tout en le signalant en note.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: avec ceux qui étaient auprès de Saül et de Jonathan
  rationale: La relative se rapporte collectivement à Israël. « Ceux qui étaient auprès de » évite l’accord français peu naturel avec le nom collectif « Israël » tout en préservant la référence au groupe accompagné de Saül et Jonathan.
