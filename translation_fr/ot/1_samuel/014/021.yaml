revisions:
- from: Les Hébreux qui avaient auparavant été du côté des Philistins[a] et qui étaient montés avec eux dans le camp, aux alentours[b], se rangèrent eux aussi du côté d’Israël[c], avec ceux qui étaient auprès de Saül et de Jonathan.
  to: Les Hébreux qui avaient auparavant été du côté des Philistins[a], qui étaient montés avec eux dans le camp alentour[b], se joignirent eux aussi à Israël[c], qui était avec Saül et Jonathan.
  rationale: La révision rétablit la relation de la proposition finale avec « Israël », comme dans l’hébreu, au lieu d’ajouter « ceux ». Elle améliore aussi légèrement la formulation de la localisation difficile, sans résoudre de manière excessive son ambiguïté. Les notes et leurs ancres restent cohérentes avec le texte révisé.
