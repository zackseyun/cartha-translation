  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: fr
  text: 'Celui qui portait ses armes lui dit : « Fais tout ce que tu as à cœur. Vas-y ! Je suis avec toi, comme ton cœur le désire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: celui qui portait ses armes
  rationale: Rend naturellement la fonction du porteur d’armes sans recourir au terme plus rare « écuyer », qui peut évoquer un cadre médiéval.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: Fais tout ce que tu as dans le cœur
  rationale: Conserve l’image hébraïque du cœur comme siège de l’intention, tout en restant intelligible en français moderne.
- source_word: נְטֵה לָךְ
  choice: Va de l’avant !
  rationale: Dans ce contexte d’encouragement à agir, l’impératif exprime l’idée de se mettre en route ou de poursuivre son dessein; cette formulation naturelle évite le littéral obscur « incline-toi ».
- source_word: הִנְנִי עִמְּךָ
  choice: Me voici avec toi
  rationale: Préserve la tournure emphatique הִנְנִי et l’affirmation de solidarité personnelle.
- source_word: כִּלְבָבֶךָ
  choice: selon ce que ton cœur désire
  rationale: Explicite légèrement une expression hébraïque très condensée, comprise comme un accord avec l’intention de Jonathan, sans supprimer l’image du cœur.
