base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: fr
  text: Tous les hommes d’Israël qui s’étaient cachés dans la région montagneuse d’Éphraïm apprirent que les Philistins avaient pris la fuite. Eux aussi les poursuivirent de près[a], au cours du combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils s’attachèrent eux aussi après eux ». L’expression hébraïque décrit une poursuite serrée des Philistins en fuite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: Tous les hommes d’Israël
  rationale: Le singulier distributif אִישׁ accompagné de כֹל, puis repris par un participe et des verbes au pluriel, se rend naturellement en français par le collectif pluriel « tous les hommes d’Israël ».
- source_word: הַמִּתְחַבְּאִים
  choice: qui s’étaient cachés
  rationale: Le participe désigne les hommes qui se trouvaient cachés; le plus-que-parfait exprime clairement que cette action précède le moment où ils apprennent la fuite des Philistins.
- source_word: בְּהַר אֶפְרַיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: הַר désigne ici la zone de hautes terres d’Éphraïm plutôt qu’un sommet unique. Cette formulation géographique est claire en français international.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: apprirent que les Philistins avaient pris la fuite
  rationale: שׁמע suivi d’une proposition signifie ici « apprendre » une nouvelle; « prendre la fuite » restitue le mouvement de retraite exprimé par נוס, et le plus-que-parfait marque l’antériorité par rapport à « apprirent ».
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: se mirent à les poursuivre de près
  rationale: דבק signifie littéralement « s’attacher, rester collé », mais avec אַחֲרֵי en contexte militaire, l’expression décrit une poursuite serrée. Le français retenu préserve cette intensité sans calque obscur.
- source_word: גַם הֵמָּה
  choice: Eux aussi
  rationale: La tournure met en relief la participation de ces hommes jusque-là cachés, aux côtés des autres combattants.
- source_word: בַּמִּלְחָמָה
  choice: dans le combat
  rationale: Le nom désigne ici l’affrontement en cours, non l’ensemble d’une guerre; « le combat » convient mieux au contexte immédiat.
