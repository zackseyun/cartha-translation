id: 1SA.14.50
reference: 1 Samuel 14:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: fr
  text: La femme de Saül s’appelait Ahinoam, fille d’Ahimaats. Le chef de son armée s’appelait Abner, fils de Ner, l’oncle de Saül[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un proche parent de Saül » ; le mot hébreu peut désigner plus largement un proche parent masculin, mais « oncle » convient le mieux au contexte généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: s’appelait
  rationale: La tournure nominale hébraïque introduit le nom d’une personne. « S’appelait » restitue naturellement la formule en français moderne sans alourdir la phrase.
- source_word: אֵשֶׁת
  choice: la femme de
  rationale: Dans cette construction avec Saül, le terme désigne clairement son épouse. « La femme de Saül » est idiomatique et digne en français courant.
- source_word: בַּת
  choice: fille de
  rationale: Équivalent habituel de la formule généalogique hébraïque.
- source_word: שַׂר צְבָאוֹ
  choice: le chef de son armée
  rationale: שַׂר désigne ici le responsable militaire, et צְבָאוֹ les forces de Saül. « Chef de son armée » est clair et naturel en français moderne.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu français normal de la formule patronymique.
- source_word: דּוֹד
  choice: l’oncle de
  rationale: Dans cette notice généalogique, le sens de parenté « oncle » est le plus probable, même si le mot peut parfois désigner plus largement un proche parent masculin.
theological_decisions:
- issue: Sens de דּוֹד dans la généalogie de Saül
  choice: l’oncle de Saül
  alternative: un proche parent de Saül
  rationale: Le contexte généalogique favorise le sens précis « oncle ». Comme le terme hébreu peut avoir une portée de parenté plus large, cette ambiguïté réelle est signalée en note sans remplacer le sens le plus probable dans le texte.
translation_notes:
  register: 'Français international moderne, simple et digne. La répétition hébraïque de « nom » est rendue par deux occurrences de « s’appelait », ce qui conserve la structure informative tout en restant naturel. Les noms propres suivent les formes françaises usuelles : Saül, Ahinoam, Ahimaats, Abner et Ner.'
