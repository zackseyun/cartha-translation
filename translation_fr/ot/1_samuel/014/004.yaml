source:
  edition: WLC
  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: fr
  text: 'Entre les passages que Jonathan cherchait à franchir pour atteindre le poste des Philistins, il y avait, de chaque côté, un éperon rocheux[a] : l’un s’appelait Botsets, et l’autre Séné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une dent de rocher » de chaque côté, image désignant des saillies rocheuses aiguës.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: les passages
  rationale: Le nom désigne des lieux de passage ou de traversée. Dans ce relief rocheux, « passages » reste naturel sans suggérer à tort le franchissement d’un cours d’eau.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: cherchait à franchir
  rationale: La construction exprime une intention poursuivie ou une tentative. « Cherchait à » en conserve la nuance, tandis que « franchir » convient à des passages resserrés.
- source_word: עַל מַצַּב פְּלִשְׁתִּים
  choice: pour atteindre le poste des Philistins
  rationale: Dans ce contexte militaire, מַצָּב désigne un poste ou un détachement établi. « Poste » est clair et actuel; « pour atteindre » rend naturellement la direction visée dans la construction française.
- source_word: שֵׁן הַסֶּלַע
  choice: un éperon rocheux
  rationale: Littéralement « une dent du rocher », l’expression évoque une saillie rocheuse aiguë. « Éperon rocheux » restitue cette image topographique en français naturel.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: de chaque côté
  rationale: La répétition hébraïque situe les deux formations sur les côtés opposés du passage. La formulation condensée est idiomatique et conserve cette disposition.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: l’un s’appelait ... et l’autre
  rationale: Cette tournure française rend clairement et naturellement la structure de dénomination parallèle.
- source_word: בּוֹצֵץ
  choice: Botsets
  rationale: Nom propre translittéré selon une graphie française qui représente la consonne צ par « ts ».
- source_word: סֶנֶּה
  choice: Séné
  rationale: Nom propre translittéré en français, avec l’accent final indiqué naturellement.
- source_word: וּבֵין
  choice: Entre
  rationale: La conjonction assure le lien narratif, mais le français n’exige pas ici un « et » initial; « Entre » ouvre la description sans ajouter un marqueur temporel absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la topographie bilatérale et la nuance d’effort ou d’intention de Jonathan, tout en évitant un calque lourd de l’hébreu.
