  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: fr
  text: Saül bâtit un autel pour Yahweh ; ce fut le premier autel qu’il bâtit pour Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il commença à bâtir cet autel pour Yahweh ». La tournure hébraïque est généralement comprise comme signifiant qu’il s’agissait du premier autel que Saül bâtit pour Yahweh.'
    reason: Lecture alternative de la tournure hébraïque אֹתוֹ הֵחֵל לִבְנוֹת.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: bâtit
  rationale: Le verbe בנה désigne simplement l’action de bâtir ou de construire. « Bâtit » convient au registre narratif et à la construction d’un autel.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française traditionnelle et courante du nom hébreu שאול.
- source_word: מִזְבֵּחַ
  choice: autel
  rationale: Équivalent français précis et consacré de מזבח, lieu destiné aux sacrifices et aux offrandes.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici la destination ou la consécration de l’autel. « À Yahweh » garde le nom divin explicite et suit naturellement le verbe « bâtir ».
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: ce fut le premier autel qu’il bâtit
  rationale: La tournure hébraïque, littéralement proche de « il commença à le bâtir comme autel », est couramment comprise comme indiquant qu’il s’agissait du premier autel bâti par Saül. La formulation française exprime ce sens idiomatique sans masquer l’autre lecture, signalée en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme. « Yahweh » représente directement le nom divin et évite de le remplacer par un titre.
- issue: Interprétation de אֹתוֹ הֵחֵל לִבְנוֹת
  choice: ce fut le premier autel qu’il bâtit à Yahweh
  alternative: il commença à le bâtir comme autel à Yahweh
  rationale: La lecture principale rend l’interprétation idiomatique généralement retenue, selon laquelle cet autel fut le premier que Saül bâtit à Yahweh. La syntaxe hébraïque permet toutefois une lecture plus littérale, conservée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La répétition de « bâtit » et de « à Yahweh » reflète celle de l’hébreu et maintient la clarté.
