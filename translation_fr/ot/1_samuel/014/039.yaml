source:
  edition: WLC
  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: fr
  text: Car, aussi vrai que Yahweh est vivant, lui qui sauve Israël, même si cela se trouve chez Jonathan, mon fils[a], il mourra certainement. » Mais personne parmi tout le peuple ne lui répondit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « si cela est en Jonathan, mon fils » ; l’objet de « cela » n’est pas précisé. Le contexte renvoie vraisemblablement à la faute ou à l’infraction recherchée.'
    reason: L’objet du verbe est elliptique dans le texte hébreu ; la note préserve cette ambiguïté sans l’imposer dans le texte traduit.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: aussi vrai que Yahweh est vivant
  rationale: Formule hébraïque de serment solennel. Cette tournure française actuelle conserve la force de l’engagement sans l’aplatir en simple affirmation.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: lui qui sauve Israël
  rationale: Le participe défini caractérise Yahweh comme celui qui sauve Israël; le présent garde cette valeur continue.
- source_word: כִּי אִם
  choice: même si
  rationale: Dans ce serment, l’expression introduit le cas extrême envisagé, celui de Jonathan lui-même.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: c’est en Jonathan, mon fils
  rationale: L’hébreu laisse implicite ce qui serait « en » Jonathan, probablement la faute recherchée. La traduction conserve cette ellipse plutôt que d’en préciser silencieusement l’objet.
- source_word: מוֹת יָמוּת
  choice: il mourra certainement
  rationale: L’infinitif absolu suivi de l’imparfait exprime une forte certitude. La formulation conserve la solennité de la déclaration sans ajouter explicitement l’idée d’une exécution.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: Mais personne parmi tout le peuple ne lui répondit
  rationale: « Mais » rend le contraste narratif, tandis que « parmi tout le peuple » exprime naturellement la valeur partitive.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le nom propre est translittéré afin de le distinguer d’un titre et de suivre le choix éditorial du projet.
- issue: Objet implicite dans יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: Conserver l’implicite par « c’est en Jonathan »
  alternative: « la faute se trouve en Jonathan »
  rationale: Le contexte suggère la faute ou la transgression recherchée, mais le texte hébreu ne la nomme pas ici; la traduction préserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le serment garde sa solennité; l’ellipse hébraïque concernant Jonathan est volontairement conservée. La ponctuation suppose que cette phrase clôt une prise de parole déjà ouverte dans le contexte.
