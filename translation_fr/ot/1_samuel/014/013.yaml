base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: fr
  text: Alors Jonathan grimpa en s’aidant de ses mains et de ses pieds, son porteur d’armes le suivant. Ils tombèrent devant Jonathan, et son porteur d’armes les tuait en le suivant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un participe, qui peut présenter l’action comme en cours ou comme répétée.
    reason: ambiguïté aspectuelle du participe hébreu
lexical_decisions:
- source_word: וַיַּעַל
  choice: grimpa
  rationale: Le verbe signifie monter; dans ce contexte escarpé, où Jonathan se sert de ses mains et de ses pieds, « grimpa » exprime naturellement l’action physique sans surinterprétation.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: en s’aidant de ses mains et de ses pieds
  rationale: Cette formulation conserve l’image corporelle précise de l’hébreu tout en évitant le tour peu naturel « sur ses mains et sur ses pieds » et l’interprétation plus marquée « à quatre pattes ».
- source_word: נֹשֵׂא כֵלָיו
  choice: celui qui portait ses armes
  rationale: Le syntagme désigne l’accompagnateur militaire chargé de l’équipement du combattant. Cette traduction est transparente en français moderne et évite « écuyer », aujourd’hui susceptible d’évoquer surtout les chevaux ou une fonction de cour.
- source_word: אַחֲרָיו
  choice: le suivait / derrière lui
  rationale: Selon ses deux occurrences, le terme indique que le porteur d’armes vient à la suite de Jonathan. Les formulations françaises retenues rendent naturellement sa position et la succession des actions.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: Ils tombèrent devant Jonathan
  rationale: La tournure préserve l’expression militaire hébraïque sans préciser indûment si Jonathan les frappa, les fit reculer ou les abattit à cet instant.
- source_word: מְמוֹתֵת
  choice: les mettait à mort
  rationale: Le participe exprime l’action exercée par le porteur d’armes pendant qu’il suit Jonathan. L’imparfait français conserve la valeur durative ou répétée sans imposer explicitement l’une des deux.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La périphrase « celui qui portait ses armes » privilégie la clarté actuelle; l’imparfait de « mettait à mort » maintient la nuance aspectuelle du participe hébreu.
