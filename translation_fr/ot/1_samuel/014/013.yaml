  terminology: « Jonathan », « porteur d’armes », « tombèrent devant Jonathan » et « tuer » conviennent au registre narratif et ne surinterprètent pas l’action. « Tuait » maintient la valeur potentiellement progressive ou itérative du participe sans imposer l’idée, plus interprétative, qu’il les achevait.
