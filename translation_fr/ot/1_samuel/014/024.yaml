base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: fr
  text: 'Les hommes d’Israël étaient durement éprouvés ce jour-là, et Saül imposa ce serment au peuple : « Maudit soit l’homme qui mangera de la nourriture[a] avant le soir, avant que je me sois vengé de mes ennemis ! » Ainsi, personne du peuple ne goûta de nourriture.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pain », ici et à la fin du verset ; le mot désigne probablement la nourriture en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: étaient durement éprouvés
  rationale: Le nifal exprime ici la pression ou la détresse subie par les Israélites, plutôt qu’un mouvement spatial. Cette formulation reste naturelle sans préciser indûment s’il s’agit surtout d’épuisement physique ou de détresse militaire.
- source_word: וַיֹּאֶל ... אֶת הָעָם
  choice: imposa alors ce serment au peuple
  rationale: Dans ce contexte, le verbe désigne l’action de placer le peuple sous une obligation assortie d’une malédiction. « Imposa » rend clairement le caractère contraignant de l’acte de Saül.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme courant est conservé. Dans le contexte, il désigne les hommes engagés dans le combat, mais « peuple » évite de remplacer sans nécessité le mot hébreu par « troupes ».
- source_word: אָרוּר הָאִישׁ
  choice: Maudit soit l’homme
  rationale: Cette formule française rend directement la déclaration de malédiction et conserve le singulier générique masculin du texte.
- source_word: יֹאכַל לֶחֶם
  choice: mangera de la nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner la nourriture en général. L’interdiction porte ici sur le fait de manger, non sur le seul pain.
- source_word: עַד הָעֶרֶב
  choice: avant le soir
  rationale: 'Dans la portée de la malédiction, cette formulation exprime naturellement en français la limite temporelle : personne ne doit manger tant que le soir n’est pas arrivé.'
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: avant que je me sois vengé de mes ennemis
  rationale: La formulation conserve la première personne et le caractère personnel de la vengeance revendiquée par Saül, tout en explicitant naturellement le rapport temporel avec l’interdiction.
- source_word: וְלֹא טָעַם כָּל הָעָם לָחֶם
  choice: Ainsi, personne parmi le peuple ne goûta à aucune nourriture
  rationale: La négation portant sur le collectif est rendue idiomatiquement par « personne parmi le peuple ». Le verbe « goûter » préserve l’image hébraïque, tandis que « nourriture » restitue le sens général de לֶחֶם.
