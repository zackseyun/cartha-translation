  text: וַ/יֹּ֣אמֶר שָׁא֗וּל אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הָ֣בָ/ה תָמִ֑ים וַ/יִּלָּכֵ֧ד יוֹנָתָ֛ן וְ/שָׁא֖וּל וְ/הָ/עָ֥ם יָצָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: fr
  text: 'Alors Saül dit à Yahweh, le Dieu d’Israël : « Donne une décision irréprochable[a]. » Jonathan et Saül furent désignés, tandis que le peuple fut épargné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Donne intègre/irréprochable. » Il s’agit vraisemblablement d’une demande pour que le tirage au sort produise une décision incontestable. Une forme ancienne plus longue, conservée dans la Septante, dit : « Pourquoi n’as-tu pas répondu à ton serviteur aujourd’hui ? Si cette faute est en moi ou en Jonathan, mon fils, Yahweh, Dieu d’Israël, donne l’ourim ; mais si elle est dans ton peuple Israël, donne le toummim. »'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, conformément au texte hébreu, plutôt que substitution par un titre.
- source_word: הָבָה
  choice: Donne
  rationale: Rend directement l’impératif adressé à Dieu dans un français naturel.
- source_word: תָמִים
  choice: une décision irréprochable
  rationale: L’adjectif signifie « entier, intègre, irréprochable ». Dans le contexte du tirage au sort, « décision » explicite sobrement le résultat demandé sans introduire le mot « sort » dans l’hébreu lui-même.
- source_word: וַיִּלָּכֵד
  choice: furent désignés
  rationale: Dans ce contexte judiciaire de tirage au sort, le verbe indique que Saül et Jonathan furent ceux que le procédé identifia; « désignés » évite la fausse idée d’une arrestation.
- source_word: יָצָאוּ
  choice: fut écarté
  rationale: Le peuple sort du champ de la sélection et n’est pas retenu par le sort. Le singulier suit le collectif français « le peuple ».
theological_decisions:
- issue: Forme textuelle de la prière de Saül
  choice: 'Suivre dans le texte principal la forme courte du texte massorétique : « Donne une décision irréprochable. »'
  alternative: Adopter la forme longue ancienne attestée par la Septante, qui mentionne explicitement l’ourim et le toummim.
  rationale: La source fournie est le texte massorétique. Sa formulation difficile doit être conservée dans le corps du texte, tandis que la variante ancienne, susceptible de l’éclairer, est signalée en note sans être substituée silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste concise comme l’hébreu. « Décision irréprochable » conserve l’idée de תָמִים tout en rendant intelligible le contexte; la note expose la difficulté et la variante textuelle.
