  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: fr
  text: Saül consulta Yahweh, mais Yahweh ne lui répondit ni par des rêves, ni par les Ourim, ni par les prophètes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consulta Yahweh
  rationale: Avec la préposition ב et le nom divin, שׁאל désigne ici la recherche d’une direction ou d’un oracle divin, et non une simple question. « Consulter » exprime ce sens naturellement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », ce qui préserve son caractère de nom propre dans le texte hébreu.
- source_word: וְלֹא עָנָהוּ
  choice: ne lui répondit
  rationale: La formulation rend directement le refus d’une réponse à la consultation de Saül, sans en expliquer la cause.
- source_word: גַּם ... גַּם ... גַּם
  choice: ni ... ni ... ni
  rationale: Après une proposition négative, la répétition de « ni » restitue naturellement en français la portée distributive des trois occurrences de גַּם.
- source_word: בַּחֲלֹמוֹת
  choice: par des rêves
  rationale: La préposition indique ici le moyen par lequel une réponse divine aurait pu être communiquée.
- source_word: בָּאוּרִים
  choice: par l’ourim
  rationale: « Ourim » conserve le terme technique désignant le moyen sacerdotal de consultation, sans lui attribuer un fonctionnement plus précis que ne le fait le verset.
- source_word: בַּנְּבִיאִם
  choice: par les prophètes
  rationale: La traduction conserve le parallélisme des trois moyens possibles de révélation.
theological_decisions:
- issue: Le nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme comme nom propre; « Yahweh » le représente sans le remplacer par un titre.
- issue: La raison du silence divin
  choice: Ne pas l’expliciter
  alternative: Ajouter une explication du refus de répondre
  rationale: Le verset affirme que Yahweh ne répondit par aucun des moyens énumérés, mais n’en donne pas ici la raison. La traduction conserve cette tension sans interprétation ajoutée.
- issue: Rapport entre la consultation et les trois moyens énumérés
  choice: Présenter les rêves, l’ourim et les prophètes comme les moyens par lesquels Yahweh ne répondit pas
  alternative: Faire dépendre les trois moyens directement du verbe « consulter »
  rationale: La syntaxe permet de comprendre ces compléments comme les moyens de la réponse attendue; cette lecture s’insère naturellement après « ne lui répondit », tout en conservant le contenu essentiel de l’énumération.
translation_notes:
  register: Français international moderne, sobre et digne. « Consulta » marque une démarche de recherche d’une réponse divine; la triple structure « ni… ni… ni… » maintient le rythme insistant de l’hébreu.
