    rationale: Cette caractérisation convient particulièrement à אֹבוֹת, mais la portée exacte de יִדְּעֹנִים est discutée. La note doit conserver cette incertitude.
  - severity: low
    issue: « Sa propre ville » suraccentue le possessif.
    rationale: Le suffixe signifie simplement « sa ville »; l’apposition française suffit à exprimer le rapport de Rama à Samuel.
