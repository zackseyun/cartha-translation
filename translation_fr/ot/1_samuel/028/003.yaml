    issue: « avait chassé » est trop spécifique pour הֵסִיר.
    rationale: Le verbe hébreu indique que Saül les avait écartés/supprimés du pays, sans préciser une expulsion physique. « Avait fait disparaître du pays » reste suffisamment large.
  - severity: medium
