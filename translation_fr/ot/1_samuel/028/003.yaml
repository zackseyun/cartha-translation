  text: וּ/שְׁמוּאֵ֣ל מֵ֔ת וַ/יִּסְפְּדוּ ל/וֹ֙ כָּל יִשְׂרָאֵ֔ל וַ/יִּקְבְּרֻ֥/הוּ בָ/רָמָ֖ה וּ/בְ/עִיר֑/וֹ וְ/שָׁא֗וּל הֵסִ֛יר הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖ים מֵ/הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: fr
  text: Samuel était mort. Tout Israël l’avait pleuré et l’avait enterré à Rama, sa ville. Saül avait fait disparaître du pays les médiums et les spirites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les deux termes hébreux désignent des catégories de praticiens occultes; leur distinction précise est incertaine. Le premier est souvent associé à la consultation des morts. On peut aussi traduire : « ceux qui évoquent les esprits et les devins » ou « les nécromanciens et les spirites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: était mort
  rationale: Le parfait hébreu présente ici une circonstance déjà établie avant la suite du récit. « Était mort » rend naturellement cet arrière-plan sans ajouter de marqueur temporel absent de l’hébreu.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: l’avait pleuré
  rationale: ספד désigne le deuil public, particulièrement dans un contexte funéraire. « Pleurer quelqu’un » est une formulation française naturelle et digne.
- source_word: כָּל יִשְׂרָאֵל
  choice: Tout Israël
  rationale: Conserve l’expression collective nationale de l’hébreu.
- source_word: וַיִּקְבְּרֻהוּ
  choice: l’avait enterré
  rationale: Rend directement קבר et maintient la valeur d’antériorité de ce résumé contextuel.
- source_word: בָרָמָה וּבְעִירוֹ
  choice: à Rama, sa propre ville
  rationale: L’apposition exprime naturellement que Rama était la ville de Samuel; « propre » explicite en français la valeur possessive sans introduire une seconde localisation.
- source_word: הֵסִיר
  choice: avait chassé
  rationale: Dans ce contexte, le verbe signifie que Saül avait fait retirer ces praticiens du territoire. « Chassé du pays » reste concret sans préciser indûment la méthode employée.
- source_word: הָאֹבוֹת
  choice: les médiums
  rationale: Le terme désigne des praticiens associés à la consultation des morts ou des esprits. « Médiums » est compréhensible en français moderne et évite le vocabulaire folklorique.
- source_word: הַיִּדְּעֹנִים
  choice: les devins
  rationale: Le terme désigne une autre catégorie de praticiens occultes, souvent associée aux אֹבוֹת. « Devins » est clair, tout en laissant à la note la distinction lexicale incertaine.
- source_word: מֵהָאָרֶץ
  choice: du pays
  rationale: Dans ce contexte national, « du pays » est plus idiomatique en français que « de la terre ».
theological_decisions:
- issue: Désignation des praticiens occultes sans importer des catégories postérieures
  choice: les médiums et les devins
  alternative: les nécromanciens et les spirites
  rationale: Les deux mots hébreux désignent des praticiens interdits liés à la consultation occulte, mais leur distinction exacte demeure incertaine. Le texte principal emploie des termes modernes intelligibles, et la note préserve cette incertitude.
translation_notes:
  register: Français international moderne, sobre et narratif. Les plus-que-parfaits et « était mort » signalent les circonstances antérieures à la scène qui suit. Aucun connecteur équivalent à « maintenant » n’est ajouté, puisqu’il n’apparaît pas dans le texte hébreu.
