source:
  edition: WLC
  text: וְ/לָ/אִשָּׁ֤ה עֵֽגֶל מַרְבֵּק֙ בַּ/בַּ֔יִת וַ/תְּמַהֵ֖ר וַ/תִּזְבָּחֵ֑/הוּ וַ/תִּקַּח קֶ֣מַח וַ/תָּ֔לָשׁ וַ/תֹּפֵ֖/הוּ מַצּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: fr
  text: La femme avait chez elle un veau engraissé[a]. Elle s’empressa de l’abattre. Puis elle prit de la farine, la pétrit et en fit cuire des pains sans levain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un veau nourri à l’étable »; traditionnellement, « un veau gras ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: un veau engraissé
  rationale: עֵגֶל désigne un jeune bovin, et מַרְבֵּק un animal engraissé, probablement nourri à l’étable. « Veau engraissé » est précis et naturel en français moderne.
- source_word: בַּבַּיִת
  choice: chez elle
  rationale: La locution est concrètement locative (« dans la maison »), mais « chez elle » exprime ici avec naturel que l’animal se trouvait dans sa propriété ou son foyer, sans suggérer nécessairement l’intérieur de l’habitation.
- source_word: וַתְּמַהֵר
  choice: elle s’empressa
  rationale: Le verbe marque la hâte. « S’empressa » conserve l’urgence narrative dans un registre courant et digne.
- source_word: וַתִּזְבָּחֵהוּ
  choice: de l’abattre
  rationale: Le verbe peut désigner une immolation sacrificielle, mais le contexte immédiat est la préparation d’un repas. « Abattre » rend la mise à mort d’un animal destiné à être mangé sans introduire un rite cultuel.
- source_word: קֶמַח
  choice: de la farine
  rationale: Le nom désigne la farine employée pour préparer le pain.
- source_word: וַתָּלָשׁ
  choice: la pétrit
  rationale: Le verbe désigne précisément l’action de pétrir; le pronom français reprend naturellement la farine envisagée comme préparation.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: en fit cuire des pains sans levain
  rationale: La construction indique qu’elle fit cuire la préparation sous forme de pains sans levain. Cette formulation française restitue le résultat et le lien pronominal sans lourdeur.
theological_decisions:
- issue: Portée cultuelle éventuelle de זבח
  choice: abattre, dans le cadre de la préparation du repas
  alternative: sacrifier / immoler
  rationale: Bien que זבח puisse être sacrificiel ailleurs, rien dans ce verset ne décrit un acte cultuel; choisir « sacrifier » ajouterait ici une portée théologique non exigée par le contexte.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement segmentées pour préserver la rapidité de la scène. « Chez elle » évite l’image potentiellement trompeuse d’un veau gardé à l’intérieur même de l’habitation, tout en rendant la valeur locative de בַּבַּיִת.
