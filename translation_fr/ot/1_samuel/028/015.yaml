  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: fr
  text: 'Alors Samuel dit à Saül : « Pourquoi m’as-tu troublé en me faisant monter ? » Saül répondit : « Je suis dans une très grande détresse. Les Philistins me font la guerre, et Dieu s’est détourné de moi. Il ne me répond plus, ni par l’intermédiaire des prophètes[a] ni par des rêves. Je t’ai donc appelé pour que tu me fasses savoir ce que je dois faire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main des prophètes », expression qui signifie ici « par l’intermédiaire des prophètes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: m’as-tu troublé
  rationale: Le verbe רגז exprime ici le fait de causer du trouble ou de l’agitation. « Troubler » est naturel en français et n’explicite pas davantage le mécanisme évoqué.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: en me faisant monter
  rationale: Cette formulation conserve l’image spatiale du verbe עלה dans ce contexte d’évocation, sans introduire le vocabulaire potentiellement trompeur de la résurrection.
- source_word: צַר לִי מְאֹד
  choice: Je suis dans une très grande détresse
  rationale: Rend clairement l’affliction et la pression extrêmes exprimées par la tournure hébraïque.
- source_word: נִלְחָמִים בִּי
  choice: me font la guerre
  rationale: Expression française idiomatique qui conserve le sens militaire et l’hostilité dirigée contre Saül.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: Dieu s’est détourné de moi
  rationale: Rend le retrait relationnel exprimé par סור מעל sans préciser au-delà du texte la nature de cette absence.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: Il ne me répond plus
  rationale: « Ne… plus » traduit naturellement עוד dans un contexte où une réponse auparavant possible a cessé.
- source_word: גַּם בְּיַד הַנְּבִיאִם
  choice: ni par l’intermédiaire des prophètes
  rationale: « Par l’intermédiaire de » restitue l’emploi instrumental de ביד; l’article défini hébreu est conservé avec « des prophètes ».
- source_word: גַּם בַּחֲלֹמוֹת
  choice: ni par des rêves
  rationale: Le second « ni » forme en français une coordination naturelle après la proposition négative et présente les rêves comme moyen de révélation.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: Je t’ai donc appelé
  rationale: « Appeler » conserve la sobriété de קרא avec ל sans ajouter un terme technique relatif à l’occultisme.
- source_word: לְהוֹדִיעֵנִי
  choice: pour que tu me fasses savoir
  rationale: Cette formulation restitue assez formellement le causatif du hiphil de ידע tout en restant intelligible.
- source_word: מָה אֶעֱשֶׂה
  choice: ce que je dois faire
  rationale: Formulation française naturelle du discours indirect qui conserve la demande de conduite à suivre.
theological_decisions:
- issue: Identité et statut de Samuel dans le récit d’évocation
  choice: Présenter directement Samuel comme celui qui parle à Saül
  alternative: Qualifier le personnage d’apparition, d’esprit imitateur ou de perception de la médium
  rationale: Le texte hébreu affirme simplement que Samuel parle à Saül. La traduction suit cette présentation narrative sans trancher les débats théologiques plus larges sur la nature de l’événement.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve l’image de la montée, le caractère direct du dialogue et la tension théologique du récit, sans ajouter d’explication confessionnelle.
