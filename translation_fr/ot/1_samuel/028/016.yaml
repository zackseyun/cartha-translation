source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: fr
  text: 'Samuel dit : « Pourquoi donc m’interroges-tu, puisque Yahweh s’est détourné de toi et qu’il est devenu ton adversaire[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton ennemi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: Samuel dit
  rationale: Le passé simple rend naturellement la progression narrative du waw consécutif en français, sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: וְלָמָּה
  choice: Pourquoi donc
  rationale: « Donc » restitue la force connective et le caractère incisif de la question.
- source_word: תִּשְׁאָלֵנִי
  choice: m’interroges-tu
  rationale: Le verbe שׁאל signifie demander ou interroger. Ici, « m’interroges-tu » convient à la consultation recherchée par Saül et reste naturel dans ce registre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: סָר מֵעָלֶיךָ
  choice: s’est détourné de toi
  rationale: Cette formulation rend le parfait de סור avec מעל et en préserve la portée relationnelle.
- source_word: וַיְהִי עָרֶךָ
  choice: il est devenu ton adversaire
  rationale: Le nom עָר désigne celui qui s’oppose à quelqu’un. « Adversaire » conserve directement l’idée d’opposition, tandis que « ennemi » demeure une traduction possible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; conserver le nom propre évite de le remplacer par un titre.
- issue: Nature de l’opposition de Yahweh à Saül
  choice: il est devenu ton adversaire
  alternative: il est devenu ton ennemi
  rationale: Le texte affirme une opposition personnelle et grave. « Adversaire » la préserve sans atténuation, tandis que « ennemi » exprime avec plus de force une autre nuance légitime de עָר.
translation_notes:
  register: Français moderne, digne et direct. L’inversion interrogative convient à la gravité de la scène sans produire un style archaïque. Le marqueur de note est placé sur le terme auquel l’alternative lexicale se rapporte.
