  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: fr
  text: 'La femme demanda alors : « Qui dois-je faire monter pour toi[a] ? » Il répondit : « Fais monter Samuel pour moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « évoquer ». Le verbe hébreu signifie littéralement « faire monter »; dans ce contexte de consultation des morts, « évoquer » en exprime le sens contextuel de façon plus interprétative.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: demanda alors
  rationale: Le wayyiqtol fait progresser le récit; « alors » marque naturellement la succession, et « demanda » convient à la question directe sans changer le sens du verbe « dire ».
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Dans le contexte, il s’agit de la femme d’En-Dor; cette désignation simple correspond directement à l’hébreu.
- source_word: אֶת מִי
  choice: qui
  rationale: אֶת marque ici le complément d’objet de l’interrogatif; en français moderne, « qui » est la forme naturelle pour une personne, quelle que soit sa fonction syntaxique.
- source_word: אַעֲלֶה
  choice: dois-je faire monter
  rationale: Le hiphil de עלה signifie « faire monter ». Cette formulation conserve l’image spatiale et l’ambiguïté du texte sans expliquer le mécanisme de l’événement.
- source_word: לָּךְ
  choice: pour toi
  rationale: 'La préposition ל a ici une valeur bénéficiaire: l’action demandée doit être accomplie en faveur de Saül.'
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Le verbe hébreu signifie littéralement « il dit », mais, dans cet échange question-réponse, « il répondit » est naturel et fidèle à la fonction discursive.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: La particule אֶת ne se traduit pas; le nom propre שְׁמוּאֵל est rendu selon sa forme française traditionnelle, Samuel.
- source_word: הַעֲלִי
  choice: Fais monter
  rationale: L’impératif hiphil féminin singulier de עלה reprend exactement le verbe précédent. La traduction maintient cette répétition et l’image hébraïque.
- source_word: לִי
  choice: pour moi
  rationale: Comme plus tôt dans le verset, ל est compris dans son sens bénéficiaire.
theological_decisions:
- issue: Rendu de l’idiome nécromantique fondé sur עלה
  choice: faire monter
  alternative: évoquer / faire apparaître
  rationale: « Faire monter » suit le sens ordinaire du hiphil de עלה et préserve l’image ainsi que la tension théologique du récit. « Évoquer » ou « faire apparaître » préciserait davantage la nature ou le mécanisme de l’acte que ne le fait ce verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct; la répétition de « faire monter » reproduit celle de l’hébreu et évite d’imposer une interprétation du phénomène.
