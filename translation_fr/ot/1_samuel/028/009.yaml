base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: fr
  text: 'Mais la femme lui répondit : « Écoute, tu sais bien toi-même ce que Saül a fait : il a retranché du pays les médiums et les évocateurs d’esprits.[a] Pourquoi donc me tends-tu un piège pour me faire mourir ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les nécromanciens et les devins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֵלָיו
  choice: Mais la femme lui répondit
  rationale: Le waw fait progresser le récit, tandis que « mais » rend l’opposition prudente de la femme à la demande reçue. « Répondit » est naturel dans ce dialogue.
- source_word: הִנֵּה
  choice: Écoute
  rationale: La particule attire avec insistance l’attention de l’interlocuteur. Dans ce dialogue, « Écoute » en restitue naturellement la fonction sans archaïsme.
- source_word: אַתָּה יָדַעְתָּ
  choice: tu sais bien toi-même
  rationale: Le pronom explicite renforce le sujet déjà indiqué par le verbe ; « bien toi-même » conserve cette insistance.
- source_word: אֵת אֲשֶׁר עָשָׂה שָׁאוּל
  choice: ce que Saül a fait
  rationale: Traduction française directe et idiomatique de la proposition objet.
- source_word: הִכְרִית
  choice: a retranché
  rationale: Le verbe exprime une suppression énergique. « Retranché » conserve l’image et la gravité de l’hébreu tout en convenant à l’expulsion de praticiens hors du pays.
- source_word: הָאֹבוֹת
  choice: les médiums
  rationale: Dans ce contexte, le terme désigne des personnes qui prétendent consulter les morts ou des esprits. « Médiums » est le terme moderne le plus immédiatement compréhensible.
- source_word: הַיִּדְּעֹנִי
  choice: les évocateurs d’esprits
  rationale: Le terme désigne des praticiens associés à un savoir occulte ou à la consultation d’esprits. Cette formulation le distingue des médiums sans introduire l’imaginaire moderne du mot « sorciers ».
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Le contexte vise le territoire gouverné par Saül, non la terre entière ; « du pays » est naturel en français.
- source_word: וְלָמָה
  choice: Pourquoi donc
  rationale: « Donc » exprime le lien logique entre la politique connue de Saül et le soupçon de la femme.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי לַהֲמִיתֵנִי
  choice: me tends-tu un piège qui me coûtera la vie ?
  rationale: Cette formulation conserve la métaphore du piège et exprime naturellement la finalité explicite « pour me faire mourir », sans suggérer que l’inconnu la tuerait nécessairement de sa propre main.
theological_decisions:
- issue: Désignation des praticiens occultes sans préciser indûment la réalité ou le fonctionnement de leurs pratiques
  choice: les médiums et les évocateurs d’esprits
  alternative: ceux qui interrogent les morts et les devins ; les nécromanciens et les spirites
  rationale: La traduction désigne clairement les catégories interdites tout en évitant d’affirmer ou de nier l’efficacité spirituelle revendiquée par ces praticiens. La note préserve d’autres possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le tutoiement correspond au singulier hébreu et à la situation de dialogue. La métaphore du piège est conservée, tandis que la clause finale est formulée de manière idiomatique.
