  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: fr
  text: Quand Saül vit le camp des Philistins, il eut peur, et son cœur trembla fortement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son cœur frissonna beaucoup ». L’hébreu présente le cœur comme le siège de la peur intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה désigne ici la perception visuelle ordinaire. « Vit » convient naturellement à la progression du récit.
- source_word: מַחֲנֵה
  choice: camp
  rationale: מַחֲנֶה désigne concrètement un campement, ici militaire. « Camp » conserve cette image sans expliciter davantage par « armée ».
- source_word: פְלִשְׁתִּים
  choice: Philistins
  rationale: Forme française usuelle du nom de ce peuple biblique.
- source_word: וַיִּרָא
  choice: il eut peur
  rationale: Le verbe ירא exprime directement la peur. « Il eut peur » est naturel en français moderne et marque la réaction de Saül à ce qu’il voit.
- source_word: וַיֶּחֱרַד
  choice: trembla
  rationale: חרד évoque le tremblement, le frémissement ou une vive agitation causée par l’effroi. « Trembla » préserve l’image concrète sans la réduire à une simple explication psychologique.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Le texte nomme explicitement le cœur comme siège de la réaction intérieure. Garder « son cœur » respecte l’image hébraïque.
- source_word: מְאֹד
  choice: violemment
  rationale: מְאֹד renforce fortement le verbe. Dans ce contexte, « violemment » rend cette intensité dans un français idiomatique.
