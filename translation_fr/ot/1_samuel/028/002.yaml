source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אָכִ֔ישׁ לָ/כֵן֙ אַתָּ֣ה תֵדַ֔ע אֵ֥ת אֲשֶׁר יַעֲשֶׂ֖ה עַבְדֶּ֑/ךָ וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד לָ/כֵ֗ן שֹׁמֵ֧ר לְ/רֹאשִׁ֛/י אֲשִֽׂימְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: fr
  text: 'David dit à Akish : « Alors, tu sauras toi-même ce que ton serviteur fera[a]. » Akish répondit à David : « Eh bien, je ferai de toi mon garde personnel[b] pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les paroles de David restent volontairement ambiguës : il ne précise pas ce qu’il fera ni contre qui il agira.'
    reason: ambiguity
  - marker: b
    text: 'Littéralement : « gardien pour ma tête », c’est-à-dire chargé de protéger personnellement Akish.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Alors
  rationale: Dans la réponse de David, ce marqueur tire une conséquence des paroles précédentes. « Alors » est naturel en français et conserve cette progression.
- source_word: אַתָּה תֵדַע
  choice: tu sauras toi-même
  rationale: Le pronom explicite אַתָּה renforce le sujet du verbe. « Toi-même » restitue cette insistance sans alourdir excessivement la phrase.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: ce que … fera
  rationale: Cette formulation suit directement le futur hébreu et conserve l’ambiguïté de David quant à l’action qu’il accomplira réellement.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Il s’agit ici d’une formule de déférence employée par David pour parler de lui-même, et non nécessairement d’une indication de statut servile.
- source_word: לָכֵן
  choice: Eh bien
  rationale: Dans la réponse d’Akish, le marqueur exprime son acceptation et la conclusion qu’il tire des paroles de David. « Eh bien » rend naturellement cette valeur responsive.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: mon garde personnel
  rationale: L’expression signifie littéralement « gardien pour ma tête » et désigne celui qui protège la personne du roi. « Garde personnel » en transmet clairement le sens idiomatique.
- source_word: אֲשִׂימְךָ
  choice: je ferai de toi
  rationale: Le verbe שׂים signifie « placer, établir, nommer ». Dans cette construction française, « je ferai de toi » exprime naturellement l’attribution de la fonction.
- source_word: כָּל הַיָּמִים
  choice: pour toujours
  rationale: Littéralement « tous les jours », l’expression indique ici une fonction permanente. « Pour toujours » évite le contresens possible de « tous les jours », qui pourrait suggérer une simple fréquence quotidienne.
theological_decisions:
- issue: Ambiguïté de la promesse de David
  choice: ce que ton serviteur fera
  alternative: ce dont ton serviteur est capable
  rationale: Le futur hébreu désigne ce que David fera sans préciser contre qui il agira. La formulation retenue préserve ce double sens narratif sans transformer ses paroles en simple affirmation de capacité.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue demeure direct, avec la déférence de « ton serviteur ». Le nom אַכִישׁ est transcrit « Akish », forme transparente en français. Les expressions idiomatiques sont rendues clairement, tandis que l’ambiguïté narrative essentielle des paroles de David est conservée.
