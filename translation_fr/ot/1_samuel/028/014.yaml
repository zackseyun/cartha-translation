  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַֽה תָּאֳר֔/וֹ וַ/תֹּ֗אמֶר אִ֤ישׁ זָקֵן֙ עֹלֶ֔ה וְ/ה֥וּא עֹטֶ֖ה מְעִ֑יל וַ/יֵּ֤דַע שָׁאוּל֙ כִּֽי שְׁמוּאֵ֣ל ה֔וּא וַ/יִּקֹּ֥ד אַפַּ֛יִם אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: fr
  text: 'Il lui demanda : « Quelle apparence a-t-il ? » Elle répondit : « C’est un vieil homme qui monte[a], enveloppé dans un manteau[b]. » Saül comprit que c’était Samuel. Alors il s’inclina, le visage contre terre, et se prosterna[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui s’élève » ou « qui est en train de monter ». Le participe hébreu souligne un mouvement ascendant en cours.
    reason: lexical_alternative
  - marker: b
    text: Ou « vêtu d’un manteau ». L’hébreu évoque plus précisément le fait d’en être enveloppé ou couvert.
    reason: lexical_alternative
  - marker: c
    text: Le verbe peut aussi être rendu par « s’inclina » ou, dans certains contextes, « adora ». Ici, il décrit une profonde prosternation devant la figure identifiée comme Samuel.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: Quelle apparence a-t-il ?
  rationale: תֹּאַר désigne la forme ou l’apparence visible. Cette formulation est naturelle en français moderne et exprime clairement la demande d’un signalement permettant l’identification.
- source_word: אִישׁ זָקֵן
  choice: un vieil homme
  rationale: L’expression désigne simplement un homme avancé en âge. « Un vieil homme » est direct, courant et fidèle.
- source_word: עֹלֶה
  choice: qui monte
  rationale: Le participe présente le mouvement ascendant comme en cours. « Qui monte » conserve ce mouvement sans préciser davantage son origine ni interpréter la scène.
- source_word: עֹטֶה מְעִיל
  choice: enveloppé dans un manteau
  rationale: עֹטֶה évoque le fait de se couvrir ou de s’envelopper, plus fortement que le simple port d’un vêtement. מְעִיל désigne ici un manteau ou une longue tunique distinctive.
- source_word: וַיֵּדַע
  choice: Saül comprit
  rationale: ידע signifie fondamentalement « savoir » ou « connaître » ; dans ce contexte, Saül tire une conclusion à partir de la description. « Comprit » rend naturellement cette reconnaissance indirecte sans affirmer qu’il voit lui-même la figure.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: que c’était Samuel
  rationale: Cette tournure identificatrice est idiomatique en français et correspond au pronom hébreu masculin dans le contexte.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: il s’inclina, le visage contre terre
  rationale: La formulation conserve l’image concrète de la face dirigée vers le sol et décrit clairement la posture.
- source_word: וַיִּשְׁתָּחוּ
  choice: et se prosterna
  rationale: Le verbe exprime une profonde inclinaison révérencielle ou une prosternation. Ce choix le distingue du verbe précédent tout en évitant d’imposer le sens plus spécifiquement cultuel d’« adorer ».
theological_decisions:
- issue: La nature de l’hommage rendu par Saül à la figure identifiée comme Samuel
  choice: « se prosterna »
  alternative: « adora » ; « rendit hommage » ; « s’inclina »
  rationale: Le verbe שׁחה peut, selon le contexte, désigner l’adoration ou une prosternation révérencielle. Ici, le texte décrit d’abord un geste corporel envers la figure reconnue comme Samuel. « Se prosterna » préserve l’intensité du geste sans décider qu’il s’agit d’un acte cultuel.
- issue: Le degré de certitude impliqué par l’identification de Samuel
  choice: « Saül comprit que c’était Samuel »
  alternative: « Saül reconnut Samuel » ; « Saül sut que c’était Samuel »
  rationale: Saül semble conclure à l’identité de la figure d’après la description donnée par la femme. « Comprit » respecte le récit sans trancher les questions théologiques ou ontologiques que soulève l’apparition.
translation_notes:
  register: Français international moderne, naturel et digne. Les phrases restent accessibles, tandis que « enveloppé dans un manteau » et « se prosterna » conservent la force descriptive de l’hébreu. La traduction évite de résoudre les ambiguïtés théologiques liées à l’apparition et à la prosternation.
