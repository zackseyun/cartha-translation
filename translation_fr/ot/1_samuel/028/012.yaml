  variant: modern international French
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: fr
  text: 'Quand la femme vit Samuel[a], elle poussa un grand cri. Puis elle dit à Saül : « Pourquoi m’as-tu trompée ? Tu es Saül ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui paraissait être Samuel ». Le texte hébreu dit simplement « Samuel », sans préciser la nature de cette apparition.'
    reason: Lecture interprétative possible; la note préserve l’ambiguïté du récit sans modifier son affirmation directe.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: vit
  rationale: Le verbe ראה désigne ici, dans le fil narratif, le fait de voir directement; « vit » est la formulation française la plus naturelle sans surinterprétation.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le texte emploie le nom ordinaire « femme », et non un titre désignant son activité; la traduction conserve cette formulation.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: L’hébreu présente sans qualification Samuel comme l’objet de la vision. Le texte principal garde cette affirmation directe.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: elle poussa un grand cri
  rationale: Cette expression française actuelle rend à la fois la force du verbe זעק et l’intensification בְּקוֹל גָּדוֹל, plus naturellement que le calque « cria d’une grande voix ».
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: elle dit
  rationale: Le français n’a pas besoin de reproduire la formule hébraïque « dit en disant »; « elle dit » en transmet pleinement la fonction.
- source_word: לָמָּה רִמִּיתָנִי
  choice: Pourquoi m’as-tu trompée ?
  rationale: Le piel de רמה exprime la tromperie. Le passé composé convient à une dissimulation antérieure dont l’identité de Saül révèle maintenant le résultat.
- source_word: וְאַתָּה שָׁאוּל
  choice: Tu es Saül !
  rationale: Le pronom explicite אַתָּה porte une insistance que l’exclamation rend naturellement en français; la conjonction n’a pas besoin d’être traduite mécaniquement.
theological_decisions:
- issue: Faut-il qualifier Samuel d’apparition, d’esprit ou de prétendu Samuel ?
  choice: Conserver dans le texte principal la formulation directe « Samuel »
  alternative: « ce qui paraissait être Samuel », « l’apparition de Samuel » ou « l’esprit de Samuel »
  rationale: L’hébreu dit simplement que la femme vit Samuel, sans définir la nature de ce qu’elle vit. Une qualification dans le texte principal trancherait une question interprétative que le verset laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. « Elle poussa un grand cri » est idiomatique tout en gardant l’intensité du texte. « Puis » assure un enchaînement naturel sans alourdir la coordination narrative hébraïque.
