    issue: Placement non naturel de « non plus »
    rationale: En français actuel, la tournure usuelle est « Il n’avait aucune force non plus », non « Il n’avait non plus aucune force ».
  - severity: low
    issue: Coordination temporelle à lisser
    rationale: Après une négation déjà exprimée, « de toute la journée et de toute la nuit » est plus fluide et couvre sans ambiguïté les deux périodes mentionnées par le texte hébreu.
