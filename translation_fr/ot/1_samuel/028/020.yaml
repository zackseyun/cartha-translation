base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: fr
  text: Saül tomba aussitôt de tout son long à terre. Il eut très peur à cause des paroles de Samuel. Il n’avait aucune force non plus, car il n’avait pas mangé de pain[a] de toute la journée et de toute la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « pain » peut aussi désigner plus largement la nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: aussitôt
  rationale: Le verbe exprime la rapidité. Dans ce contexte, « aussitôt » rend naturellement le caractère soudain de la chute sans suggérer une hâte délibérée.
- source_word: וַיִּפֹּל מְלֹא קוֹמָתוֹ אַרְצָה
  choice: tomba de tout son long à terre
  rationale: Cette formulation française naturelle conserve le verbe simple « tomber », l’idée que le corps s’étend sur toute sa longueur et le mouvement vers le sol.
- source_word: וַיִּרָא מְאֹד
  choice: Il fut saisi d’une grande peur
  rationale: Rend l’intensité de la crainte dans un français narratif actuel et digne.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: à cause des paroles de Samuel
  rationale: La préposition a ici une valeur causale, exprimée clairement sans modifier l’identité attribuée à Samuel dans le récit.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: Il n’avait non plus aucune force
  rationale: « Non plus » restitue la valeur additive de גַּם, tandis que la phrase évite d’ajouter l’idée de force « restante », absente du texte hébreu.
- source_word: לֹא אָכַל לֶחֶם
  choice: il n’avait pas mangé de pain
  rationale: Le plus-que-parfait convient à l’antériorité de la privation de nourriture; « pain » conserve le terme concret de l’hébreu, susceptible de désigner plus largement la nourriture.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: de toute la journée ni de toute la nuit
  rationale: Cette tournure française exprime la totalité des deux périodes; « ni » s’accorde naturellement avec la négation précédente.
theological_decisions:
- issue: Désignation de la figure qui parle
  choice: Samuel
  alternative: celui qui apparaissait comme Samuel / l’apparition
  rationale: Le verset l’appelle explicitement Samuel. La traduction conserve cette désignation narrative sans trancher une interprétation théologique de l’épisode.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tout en suivant de près les relations logiques et l’ordre général du texte hébreu.
