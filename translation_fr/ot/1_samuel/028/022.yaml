base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: fr
  text: Maintenant donc, je t’en prie, écoute ta servante, toi aussi.[a] Laisse-moi déposer devant toi un morceau de pain. Mange, afin que tu aies des forces, car tu vas te mettre en route.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écoute, toi aussi, la voix de ta servante ». En hébreu, « écouter la voix de quelqu’un » signifie ici prêter attention à cette personne ou tenir compte de ce qu’elle dit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marqueur discursif qui introduit une exhortation pressante; « donc » conserve la nuance de transition et de conséquence.
- source_word: שְׁמַע נָא גַם אַתָּה
  choice: écoute-moi, toi aussi, je t’en prie
  rationale: 'נָא atténue l’impératif en prière, tandis que גַם אַתָּה souligne la réciprocité : Saül doit à son tour écouter la femme.'
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: je suis ta servante
  rationale: Dans l’expression idiomatique « écouter la voix de », le sens est « prêter attention/obéir ». La formulation française naturelle conserve l’auto-désignation féminine sans reproduire servilement l’idiome hébreu.
- source_word: וְאָשִׂימָה לְפָנֶיךָ
  choice: Laisse-moi déposer devant toi
  rationale: Le cohortatif de première personne exprime une proposition ou une demande polie.
- source_word: פַּת לֶחֶם
  choice: un morceau de pain
  rationale: פַּת désigne une portion ou un morceau; cette expression est claire et naturelle en français moderne.
- source_word: וֶאֱכֹל
  choice: Mange
  rationale: L’impératif est conservé directement; la coordination hébraïque peut être rendue par une nouvelle phrase en français.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: afin que tu reprennes des forces
  rationale: 'Rend naturellement la proposition de résultat ou de but : littéralement, « afin qu’il y ait en toi de la force ».'
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: car tu dois te remettre en route
  rationale: כִּי introduit le motif. L’imparfait indique ici le départ imminent; « se remettre en route » convient au contexte sans préciser une destination absente de l’hébreu.
