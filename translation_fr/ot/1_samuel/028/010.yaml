source:
  edition: WLC
  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: fr
  text: 'Alors Saül lui jura par Yahweh : « Aussi vrai que Yahweh est vivant, aucun châtiment ne t’atteindra dans cette affaire[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucune culpabilité ne retombera sur toi dans cette affaire ». Le mot hébreu peut désigner la faute, la culpabilité ou le châtiment qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jura
  rationale: Le nifal de שׁבע signifie ici « jurer, prêter serment ». « Jura » est naturel, solennel et précis en français.
- source_word: לָהּ
  choice: lui
  rationale: Le pronom marque la destinataire du serment; « lui » est la formulation française idiomatique.
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: La préposition ב introduit celui qui est invoqué comme garant du serment; le nom divin est conservé sous la forme « Yahweh ».
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formule rend naturellement en français la formule hébraïque de serment tout en gardant son affirmation explicite de la vie de Yahweh.
- source_word: אִם
  choice: aucun… ne
  rationale: Dans une formule de serment, אִם introduit une imprécation elliptique et exprime ici une forte négation, plutôt qu'une condition ordinaire.
- source_word: יִקְּרֵךְ
  choice: ne t’atteindra
  rationale: קרא peut désigner ce qui arrive à quelqu’un. Avec « châtiment », « atteindre » donne une expression française claire et naturelle.
- source_word: עָוֹן
  choice: châtiment
  rationale: עָוֹן peut désigner la faute, la culpabilité ou sa conséquence punitive. Le contexte immédiat favorise la promesse qu'aucune sanction ne frappera la femme, sans déclarer pour autant son acte moralement innocent.
- source_word: בַּדָּבָר הַזֶּה
  choice: dans cette affaire
  rationale: Cette expression française idiomatique renvoie à l'acte dont Saül et la femme sont en train de parler.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre de l'alliance plutôt que de le remplacer par un titre.
- issue: Sens de עָוֹן dans le serment de Saül
  choice: châtiment
  alternative: faute; culpabilité
  rationale: Dans ce contexte juridique et narratif, Saül garantit surtout que la femme ne subira pas les conséquences pénales de cet acte. Une note conserve toutefois l'étendue sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Aussi vrai que… » restitue l'idiome solennel du serment hébreu sans lourdeur archaïque. La note maintient l'ambiguïté réelle de עָוֹן.
