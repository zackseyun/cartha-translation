base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: fr
  text: 'La femme s’approcha de Saül et, voyant qu’il était saisi d’une grande frayeur, elle lui dit : « Voici, ta servante t’a obéi[a]. J’ai risqué ma vie[b] et j’ai écouté les paroles que tu m’as adressées. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta servante a écouté ta voix ». L’expression hébraïque signifie ici qu’elle a prêté attention à sa demande et lui a obéi.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’ai mis ma vie dans ma main », expression hébraïque signifiant « j’ai risqué ma vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל־שָׁאוּל
  choice: La femme s’approcha de Saül
  rationale: « S’approcha de » exprime naturellement en français le mouvement de la femme vers Saül, sans ajouter ici la désignation contextuelle de « médium ».
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: voyant qu’il était saisi d’une grande frayeur
  rationale: נבהל décrit un état de vive alarme ou d’effroi, et מְאֹד en renforce l’intensité. Cette formulation est plus naturelle que « très terrifié » tout en conservant la force de l’hébreu.
- source_word: הִנֵּה
  choice: Voici
  rationale: Marqueur de discours qui attire l’attention sur l’appel de la femme ; « Voici » maintient un registre digne sans être obscur.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: ta servante a écouté ta voix
  rationale: La formule hébraïque signifie qu’elle a prêté attention à Saül et lui a obéi. Le rendu conserve l’image de la « voix », tandis que la note en explicite la portée idiomatique.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: J’ai risqué ma vie
  rationale: L’expression littérale « mettre sa vie dans sa main » est un idiome signifiant exposer sa vie au danger. Le sens est rendu clairement dans le texte, et l’image hébraïque est conservée en note.
- source_word: וָאֶשְׁמַע אֶת־דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: j’ai écouté les paroles que tu m’as adressées
  rationale: Le rendu préserve la répétition de l’idée d’écoute et la référence explicite aux paroles prononcées par Saül, dans un français naturel.
