source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: fr
  text: 'Yahweh a accompli pour lui[a], comme il l’avait dit par mon intermédiaire[b] : Yahweh a arraché le royaume de ta main et l’a donné à ton prochain, à David.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour lui ». Le texte massorétique porte un pronom de la troisième personne. De nombreuses traductions comprennent ici « envers toi » ou « pour toi », en référence à Saül.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « par ma main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin YHWH et le distingue d’un titre tel que « le Seigneur ».
- source_word: וַיַּעַשׂ ... לוֹ
  choice: a agi pour lui-même
  rationale: Reflète le texte massorétique לוֹ, « pour lui », en rapportant naturellement le pronom au sujet Yahweh, sans adopter silencieusement la lecture contextuelle « envers toi ».
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: exactement comme il l’avait annoncé par mon intermédiaire
  rationale: Rend le sens d’agence de בְּיַדִי en français courant. « Annoncé » convient à la parole prophétique et le plus-que-parfait marque son antériorité.
- source_word: וַיִּקְרַע
  choice: a arraché
  rationale: Conserve la force de l’image de קָרַע, littéralement « déchirer », tout en produisant une collocation française naturelle avec un royaume retiré à quelqu’un.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: Désigne ici le domaine et le pouvoir royaux de Saül; « royaume » reste clair et idiomatique.
- source_word: מִיָּדֶךָ
  choice: de ta main
  rationale: Préserve l’image hébraïque de la main comme lieu de possession et de maîtrise.
- source_word: וַיִּתְּנָהּ
  choice: et l’a donné
  rationale: Le pronom reprend « le royaume » et coordonne cette action accomplie avec « a arraché ».
- source_word: לְרֵעֲךָ
  choice: à ton prochain
  rationale: רֵעַ peut désigner un prochain, un compagnon ou un autre proche; l’apposition « à David » identifie ici clairement la personne.
- source_word: לְדָוִד
  choice: à David
  rationale: Transcription française usuelle du nom propre.
theological_decisions:
- issue: Référent de לוֹ dans la première proposition
  choice: « pour lui-même », avec une note signalant le littéral « pour lui »
  alternative: « envers toi » ou « pour toi »
  rationale: Le texte massorétique porte לוֹ, à la troisième personne, et non לְךָ, « pour toi ». Le rattachement à Yahweh est naturel, mais la note conserve la forme exacte et signale l’autre compréhension sans corriger tacitement le texte.
- issue: Médiation de la parole prophétique
  choice: « par mon intermédiaire »
  alternative: « par ma main »
  rationale: L’expression hébraïque décrit Samuel comme intermédiaire de la parole divine; la traduction choisie communique ce rapport sans suggérer une action manuelle.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse singulière à Saül. « A arraché le royaume de ta main » garde l’image vigoureuse du texte hébreu, tandis que « par mon intermédiaire » évite un calque obscur.
