  source_fidelity: 'La traduction respecte bien la structure et les images du texte massorétique : le royaume est arraché « de ta main » puis donné à David, et בְּיָדִי est correctement rendu comme médiation prophétique. Toutefois, « pour lui-même » interprète le pronom לוֹ comme réflexif et comme renvoyant nécessairement à Yahweh, alors que l’hébreu porte simplement un pronom de troisième personne (« pour lui »), dont le référent et le sens exact demeurent difficiles dans ce contexte.'
