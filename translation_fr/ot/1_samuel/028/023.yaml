base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: fr
  text: 'Mais il refusa et dit : « Je ne mangerai pas. » Ses serviteurs, ainsi que la femme, insistèrent vivement auprès de lui[a]. Il les écouta[b]. Alors il se releva de terre et s’assit sur le lit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pressèrent »; l’expression hébraïque traduit une forte insistance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il écouta leur voix ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « lit » peut aussi désigner une couche ou un divan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: il refusa
  rationale: Le verbe מָאֵן exprime nettement le refus ou le manque de volonté; « refusa » est direct et naturel dans ce récit.
- source_word: לֹא אֹכַל
  choice: Je ne mangerai pas
  rationale: L’imparfait אֹכַל précédé de לֹא exprime ici la décision de Saül de ne pas manger, sans qu’il soit nécessaire d’ajouter un complément.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: insistèrent vivement auprès de lui
  rationale: L’expression idiomatique פרץ ב indique une pression insistante, non une action de briser au sens littéral. « Insistèrent vivement auprès de lui » en restitue la force en français courant.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte royal, le terme désigne les hommes au service de Saül; « serviteurs » convient sans préciser un statut juridique que le verset ne met pas en avant.
- source_word: וְגַם הָאִשָּׁה
  choice: ainsi que la femme
  rationale: Cette formulation conserve la valeur additive de וְגַם en associant la femme aux serviteurs.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: Il les écouta
  rationale: L’expression signifie littéralement « il écouta leur voix ». La formulation idiomatique française indique qu’il donna suite à leur insistance sans expliciter davantage la nature de son acquiescement.
- source_word: מֵהָאָרֶץ
  choice: de terre
  rationale: Le mot אֶרֶץ désigne ici le sol sur lequel Saül se trouvait; « se releva de terre » est naturel en français.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: s’assit sur le lit
  rationale: מִטָּה peut désigner un lit ou une couche. « Lit » est la traduction usuelle, tandis qu’une note conserve l’autre possibilité contextuelle.
