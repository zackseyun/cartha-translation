base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: fr
  text: 'En ces jours-là, les Philistins rassemblèrent leurs camps pour la guerre[a], afin de combattre Israël. Akish dit à David : « Tu sais bien que toi et tes hommes, vous devrez partir avec moi au sein de l’armée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs forces pour la guerre ». Le mot hébreu peut désigner les campements eux-mêmes ou, par extension, les troupes qui y sont rassemblées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Cette formule narrative introduit une nouvelle scène. La formulation choisie est proche de l’hébreu, naturelle en français moderne et évite d’ajouter un marqueur temporel absent du texte.
- source_word: וַיִּקְבְּצוּ
  choice: rassemblèrent
  rationale: Le verbe signifie rassembler ou réunir. « Rassemblèrent » conserve son sens général sans expliciter davantage que l’hébreu la mobilisation militaire.
- source_word: מַחֲנֵיהֶם
  choice: leurs camps
  rationale: Le nom désigne d’abord un camp ou un campement, mais peut aussi évoquer les forces qui y sont réunies. « Leurs camps » préserve ici l’image concrète et le pluriel du texte source.
- source_word: לַצָּבָא
  choice: pour la guerre
  rationale: L’expression indique la finalité militaire du rassemblement. « Pour la guerre » est concise et idiomatique.
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: afin de combattre Israël
  rationale: Le français exprime naturellement l’action hostile par « combattre Israël » ; « afin de » rend clairement la valeur finale de l’infinitif.
- source_word: יָדֹעַ תֵּדַע
  choice: Tu sais bien
  rationale: L’infinitif absolu renforce le verbe conjugué. « Tu sais bien » restitue cette insistance de manière courante et ferme.
- source_word: אִתִּי תֵּצֵא
  choice: vous devrez partir avec moi
  rationale: La forme signifie littéralement « tu sortiras avec moi », mais la déclaration d’Akish exprime dans ce contexte une attente contraignante. « Devrez partir » transmet cette portée pragmatique.
- source_word: בַּמַּחֲנֶה
  choice: au sein de l’armée
  rationale: Dans ce contexte de départ en guerre, מַחֲנֶה peut désigner la troupe ou l’armée plutôt que le seul emplacement du camp. Cette formulation rend ce sens militaire en français naturel.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: toi et tes hommes, vous
  rationale: La dislocation française conserve l’insistance de l’hébreu sur David lui-même tout en incluant explicitement ses hommes.
- source_word: אָכִישׁ
  choice: Akish
  rationale: Le nom propre est translittéré selon une forme française courante, qui représente la consonne hébraïque finale שׁ par « sh ».
theological_decisions: []
