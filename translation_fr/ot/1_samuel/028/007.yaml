base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: fr
  text: 'Saül dit alors à ses serviteurs : « Trouvez-moi une femme médium, afin que j’aille la consulter. » Ses serviteurs lui répondirent : « Il y a justement à En-Dor une femme médium. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: une femme qui évoque les esprits
  rationale: L’expression désigne une femme associée à un ʾôb, terme lié à la consultation des morts ou des esprits. Cette formulation française est naturelle et conserve la nature occulte de la pratique sans imposer le vocabulaire moderne de « médium ».
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: que j’aille la consulter
  rationale: Le verbe דרש signifie ici « consulter, interroger », et בָּהּ présente la femme comme l’intermédiaire ou le moyen de la consultation. En français, « la consulter » exprime naturellement l’action sans trancher davantage le mécanisme supposé.
- source_word: הִנֵּה
  choice: Il y a justement
  rationale: Dans cette réponse, הִנֵּה attire l’attention sur l’existence d’une personne disponible. « Il y a justement » rend cette valeur de façon idiomatique.
- source_word: בְּעֵין דּוֹר
  choice: à En-Dor
  rationale: Translittération traditionnelle et intelligible du nom de lieu עֵין דּוֹר.
theological_decisions:
- issue: Nature et efficacité de la pratique occulte
  choice: Décrire la femme comme quelqu’un qui « évoque les esprits » sans affirmer que cette pratique donne réellement accès aux morts
  alternative: « une médium » ou « une nécromancienne »
  rationale: Le verset rapporte la désignation et l’intention de Saül, mais ne tranche pas encore la nature exacte ni l’efficacité du phénomène. La traduction évite donc de résoudre prématurément cette tension narrative et théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit, tandis que les paroles directes restent naturelles. Aucun marqueur de note n’est requis.
