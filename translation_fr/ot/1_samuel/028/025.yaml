  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: fr
  text: Elle plaça le repas devant Saül et ses serviteurs[a], et ils mangèrent. Puis ils se levèrent et partirent cette nuit-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Elle [le] plaça devant Saül et devant ses serviteurs. » L’objet, sous-entendu en hébreu, est le repas préparé dans les versets précédents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: Elle plaça le repas devant
  rationale: Le hiphil de נגשׁ signifie ici « faire approcher », donc « apporter ou placer devant ». L’objet, absent en hébreu mais fourni par le contexte précédent, est explicité par « le repas » pour obtenir un français naturel.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition signifie littéralement « devant, en présence de ». Dans le contexte où l’on sert de la nourriture, « devant » est direct et idiomatique.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עבד peut désigner un serviteur, un esclave ou un homme au service de quelqu’un. Ici, il s’agit des hommes qui accompagnent Saül ; « serviteurs » conserve le terme courant sans préciser indûment leur statut.
- source_word: וַיֹּאכֵלוּ
  choice: et ils mangèrent
  rationale: Le verbe n’exprime aucun objet ; celui-ci reste naturellement sous-entendu en français.
- source_word: וַיָּקֻמוּ
  choice: Puis ils se levèrent
  rationale: « Se levèrent » restitue le sens ordinaire du verbe et la succession narrative, dans un registre digne mais actuel.
- source_word: וַיֵּלְכוּ
  choice: et repartirent
  rationale: הלך signifie « aller, marcher ». Après qu’ils se sont levés, le contexte implique leur départ ; « repartirent » exprime naturellement ce mouvement sans recourir au plus soutenu « s’en allèrent ».
- source_word: בַּלַּיְלָה הַהוּא
  choice: cette nuit-là
  rationale: Cette tournure française idiomatique rend exactement l’expression temporelle hébraïque « durant cette nuit-là ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque de לִפְנֵי (« devant ») est allégée dans le corps du texte pour une formulation naturelle, tout en étant signalée dans la note. « Le repas » explicite seulement l’objet imposé par le contexte immédiat.
