base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: fr
  text: 'Le roi lui dit : « N’aie pas peur. Que vois-tu[a] ? » La femme répondit à Saül : « Je vois un être divin[b] qui monte de la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Qu’as-tu vu ? » Le verbe est à la forme accomplie, mais il peut désigner ici une perception immédiate.'
    reason: lexical_alternative
  - marker: b
    text: 'Le mot hébreu אֱלֹהִים et le participe qui l’accompagne sont de forme plurielle ; on pourrait donc traduire : « des êtres divins qui montent » ou « des dieux qui montent ». Le contexte décrit ensuite une seule figure.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu emploie le nom commun défini, et non le nom propre ; « le roi » conserve le style narratif, tandis que Saül est nommé ensuite.
- source_word: אַל תִּירְאִי
  choice: N’aie pas peur
  rationale: Cette formulation rend naturellement en français moderne l’interdiction exprimée avec ירא.
- source_word: כִּי מָה רָאִית
  choice: Que vois-tu ?
  rationale: Bien que רָאִית soit formellement un accompli, le présent convient à la perception immédiate décrite dans la scène. La valeur passée reste signalée en note.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: L’hébreu dit simplement « la femme ». Cette traduction évite d’introduire ici une désignation interprétative tirée du contexte plus large.
- source_word: אֱלֹהִים
  choice: un être divin
  rationale: Le mot est pluriel dans sa forme, mais le contexte qui suit décrit une figure unique. « Un être divin » exprime la nature surnaturelle de l’apparition sans l’identifier à Dieu ni imposer une lecture polythéiste ; la forme plurielle est conservée en note.
- source_word: עֹלִים
  choice: qui monte
  rationale: Le participe de עלה indique un mouvement ascendant. Le singulier français s’accorde avec « un être divin », tandis que la forme plurielle de l’hébreu est signalée dans la note correspondante.
- source_word: מִן הָאָרֶץ
  choice: de la terre
  rationale: Cette expression reste proche de l’hébreu et préserve l’image d’une apparition montant d’en bas.
theological_decisions:
- issue: Interprétation de אֱלֹהִים dans les paroles de la femme
  choice: un être divin
  alternative: des dieux ; Dieu
  rationale: Le verset rapporte ce que la femme affirme voir, sans transformer ses paroles en déclaration doctrinale du narrateur. La traduction retenue préserve le caractère surnaturel et l’ambiguïté du terme sans identifier l’apparition à Dieu ni affirmer une pluralité de dieux.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond aux formes féminines singulières de l’hébreu. La ponctuation sépare clairement l’encouragement de la question.
