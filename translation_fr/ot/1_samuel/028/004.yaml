base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: fr
  text: Les Philistins se rassemblèrent, vinrent et campèrent à Sunem. Saül rassembla tout Israël, et ils campèrent à Guilboa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « sur le mont Guilboa » ou « à Guilboa », car ce nom désigne la région montagneuse de Guilboa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: se rassemblèrent
  rationale: Le verbe קבץ exprime ici le rassemblement des forces philistines. Le pronominal français est naturel et conserve le sens militaire sans le renforcer indûment.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française courante de ce peuple biblique.
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le verbe בוא est rendu dans son sens simple de mouvement, sans ajouter l'idée plus précise d'une avancée militaire.
- source_word: וַיַּחֲנוּ
  choice: camper / campèrent
  rationale: Le verbe חנה signifie établir son camp. « Camper » est actuel et naturel; la variation de temps répond à la syntaxe française tout en conservant les deux occurrences.
- source_word: בְשׁוּנֵם
  choice: à Shounem
  rationale: La préposition française « à » convient à la localisation d'un camp près d'un lieu nommé. « Shounem » transcrit distinctement la voyelle hébraïque initiale.
- source_word: וַיִּקְבֹּץ
  choice: rassembla
  rationale: Le même radical קבץ est rendu par le même lexème français, ce qui préserve la reprise délibérée entre les deux armées.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette formulation conserve l'expression collective hébraïque sans la réduire explicitement aux hommes ou aux soldats.
- source_word: בַּגִּלְבֹּעַ
  choice: à Guilboa
  rationale: Le texte nomme Guilboa sans employer le mot « mont ». « À Guilboa » reste donc sobre tout en étant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque répétée est légèrement structurée par « tandis que » et un point-virgule afin d'éviter une succession lourde de « et », sans modifier le contraste entre les deux rassemblements. Le marqueur [a] figure dans le texte principal.
