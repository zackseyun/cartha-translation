  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: fr
  text: Parce que tu n’as pas obéi à la voix de Yahweh et que tu n’as pas mis à exécution sa colère ardente contre Amalec[a], c’est pourquoi Yahweh t’a fait cela aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu n’as pas exécuté sa violente colère contre Amalec ».'
    reason: Alternative lexicale pour l’expression hébraïque עָשִׂיתָ חֲרוֹן אַפּוֹ, littéralement « faire l’ardeur de sa colère ».
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Parce que
  rationale: Dans ce contexte judiciaire, la conjonction introduit la cause du jugement prononcé contre Saül.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: tu n’as pas écouté la voix de Yahweh
  rationale: « Écouter la voix » conserve l’image hébraïque tout en exprimant naturellement l’idée d’obéissance en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: tu n’as pas exécuté son ardente colère
  rationale: L’expression littérale « faire l’ardeur de sa colère » désigne ici la mise à exécution du jugement ordonné contre Amalec; « exécuter » rend cette portée active.
- source_word: חֲרוֹן אַפּוֹ
  choice: son ardente colère
  rationale: « Ardente » préserve l’image de chaleur contenue dans חֲרוֹן אַף tout en restant idiomatique et digne en français.
- source_word: בַּעֲמָלֵק
  choice: contre Amalec
  rationale: « Contre » indique naturellement en français la cible de la colère mise à exécution.
- source_word: עַל כֵּן
  choice: '[relation de conséquence exprimée sans connecteur supplémentaire]'
  rationale: En français, la proposition causale initiale suivie directement de la principale exprime clairement la conséquence; ajouter « c’est pourquoi » produirait une construction corrélative plus lourde.
- source_word: הַדָּבָר הַזֶּה
  choice: cela
  rationale: Le pronom démonstratif renvoie naturellement au jugement présent et évite le calque peu idiomatique « cette chose ».
- source_word: עָשָׂה לְךָ יְהוָה
  choice: Yahweh t’a fait cela
  rationale: Le passé composé rend l’acte accompli dont Saül subit maintenant les conséquences; le datif hébreu est naturellement rendu par « t’a fait ».
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Équivalent français moderne et direct de « ce jour ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve sans le remplacer par un titre.
- issue: Nature de la faute de Saül envers Amalec
  choice: exécuter l’ardente colère de Yahweh contre Amalec
  alternative: assouvir sa colère contre Amalec
  rationale: « Exécuter » présente Saül comme chargé de mettre en œuvre le jugement divin et évite de suggérer qu’il devait satisfaire une passion divine; l’expression hébraïque et sa tension judiciaire sont néanmoins conservées.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement suit l’adresse directe à Saül. « Amalec » est la forme française traditionnelle du nom propre. La formulation conserve l’image hébraïque de la colère ardente sans rendre la phrase artificiellement littérale.
