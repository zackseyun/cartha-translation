    reason: Alternative lexicale pour l’expression hébraïque עָשִׂיתָ חֲרוֹן אַפּוֹ, littéralement « faire l’ardeur de sa colère ».
  revision_rationale: 'La révision améliore l’idiomaticité sans modifier le sens: Saül n’a pas obéi à Yahweh ni appliqué son jugement contre Amalec; cette désobéissance explique l’action de Yahweh annoncée pour ce jour. Le choix « colère ardente » préserve l’imagerie du texte, et la note maintient une alternative plus littérale.'
