revisions:
- from: Parce que tu n’as pas écouté la voix de Yahweh et que tu n’as pas exécuté son ardente colère contre Amalec[a], Yahweh t’a fait cela aujourd’hui.
  to: Parce que tu n’as pas obéi à la voix de Yahweh et que tu n’as pas mis à exécution sa colère ardente contre Amalec[a], c’est pourquoi Yahweh t’a fait cela aujourd’hui.
  rationale: 'La révision améliore l’idiomaticité sans modifier le sens: Saül n’a pas obéi à Yahweh ni appliqué son jugement contre Amalec; cette désobéissance explique l’action de Yahweh annoncée pour ce jour. Le choix « colère ardente » préserve l’imagerie du texte, et la note maintient une alternative plus littérale.'
