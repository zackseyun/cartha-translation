source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: fr
  text: Yahweh livrera aussi Israël avec toi au pouvoir des Philistins. Demain, toi et tes fils, vous serez avec moi[a]. Yahweh livrera aussi l’armée d’Israël[b] au pouvoir des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec moi dans la mort » ou « avec moi dans le séjour des morts ». L’hébreu dit simplement : « avec moi ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « le camp d’Israël ». Le terme hébreu peut désigner le camp ou, dans ce contexte, l’armée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre, conformément à la forme personnelle du texte hébreu.
- source_word: וְיִתֵּן / יִתֵּן ... בְּיַד
  choice: livrera ... au pouvoir de
  rationale: Avec בְּיַד, le verbe נתן exprime ici le fait de livrer quelqu’un à la domination d’un adversaire. Cette tournure restitue naturellement en français le sens de l’image hébraïque de la « main ».
- source_word: גַּם
  choice: aussi
  rationale: Conserve la valeur cumulative du terme dans les deux annonces.
- source_word: עִמְּךָ
  choice: avec toi
  rationale: 'Préserve la formulation concise de l’hébreu : Israël partagera le sort de Saül.'
- source_word: פְּלִשְׁתִּים
  choice: Philistins
  rationale: Forme française courante du nom de ce peuple.
- source_word: וּמָחָר
  choice: Demain
  rationale: Le repère temporel est placé en tête de phrase, position naturelle en français, tandis que l’enchaînement solennel de l’annonce demeure clair.
- source_word: וּבָנֶיךָ
  choice: et tes fils
  rationale: בנים désigne ici les fils de Saül, et non ses enfants de manière générale.
- source_word: עִמִּי
  choice: avec moi
  rationale: La traduction conserve l’expression brève et ambiguë du texte, sans préciser explicitement la mort, le séjour des morts ou la tombe.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: l’armée d’Israël
  rationale: מַחֲנֶה peut désigner un camp ou, par métonymie dans un contexte de bataille, l’armée qui y est rassemblée. « Armée » exprime clairement le sens contextuel en français moderne, tandis que l’alternative littérale est signalée en note.
theological_decisions:
- issue: Sens de « demain, toi et tes fils, vous serez avec moi »
  choice: Conserver « avec moi » sans définir davantage l’état ou le lieu évoqué.
  alternative: « avec moi dans la mort », « avec moi au séjour des morts » ou « avec moi dans la tombe »
  rationale: Le contexte annonce la mort prochaine de Saül et de ses fils, mais l’hébreu dit seulement עִמִּי, « avec moi ». La traduction ne tranche donc pas une question métaphysique que ce verset laisse implicite.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est légèrement réorganisée pour être naturelle à l’oral comme à l’écrit. « Au pouvoir des Philistins » rend l’idiome hébreu « dans la main des Philistins » sans conserver une tournure peu idiomatique en français. Les marqueurs [a] et [b] sont placés précisément après les expressions qu’ils expliquent.
