  to: 'Alors Saül se déguisa et revêtit d’autres vêtements. Il partit, accompagné de deux hommes. Ils arrivèrent de nuit chez la femme. Il lui dit : « Je t’en prie, pratique pour moi la divination par l’intermédiaire d’un médium[a], et fais monter pour moi celui que je te désignerai. »'
