  text: וַ/יִּתְחַפֵּ֣שׂ שָׁא֗וּל וַ/יִּלְבַּשׁ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וַ/יֵּ֣לֶךְ ה֗וּא וּ/שְׁנֵ֤י אֲנָשִׁים֙ עִמּ֔/וֹ וַ/יָּבֹ֥אוּ אֶל הָ/אִשָּׁ֖ה לָ֑יְלָה וַ/יֹּ֗אמֶר קסומי נָ֥א לִ/י֙ בָּ/א֔וֹב וְ/הַ֣עֲלִי לִ֔/י אֵ֥ת אֲשֶׁר אֹמַ֖ר אֵלָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: fr
  text: 'Alors Saül se déguisa et revêtit d’autres vêtements. Il partit, accompagné de deux hommes. Ils arrivèrent de nuit chez la femme. Il lui dit : « Je t’en prie, pratique pour moi la divination par l’intermédiaire d’un médium[a], et fais monter pour moi celui que je te désignerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi renvoyer à un esprit associé à la consultation des morts ; « esprit familier » est une traduction traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: se déguisa
  rationale: 'Le hitpael exprime une action réfléchie : Saül modifie son apparence afin de cacher son identité. « Se déguisa » est précis et naturel en français moderne.'
- source_word: בְּגָדִים אֲחֵרִים
  choice: d’autres vêtements
  rationale: L’expression désigne les vêtements différents qu’il met pour compléter son déguisement. Cette formulation reste simple et idiomatique.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: Il partit, accompagné de deux hommes
  rationale: La traduction restitue clairement que Saül part lui-même avec deux hommes, sans reproduire une coordination hébraïque lourde en français.
- source_word: לָיְלָה
  choice: de nuit
  rationale: Formulation française concise qui conserve le cadre nocturne et discret de la démarche.
- source_word: קָסֳמִי נָא לִי
  choice: Je t’en prie, pratique pour moi la divination
  rationale: Le verbe קסם désigne l’exercice de la divination, tandis que נָא marque ici une demande pressante ou polie. La tournure demeure claire sans atténuer la nature de l’acte demandé.
- source_word: בָּאוֹב
  choice: au moyen d’un esprit
  rationale: Le terme אוֹב appartient au vocabulaire de la consultation nécromantique et peut désigner l’esprit consulté ou, par extension, le médium qui le consulte. La traduction retient l’instrumentalité de la construction et signale l’ambiguïté en note.
- source_word: וְהַעֲלִי לִי
  choice: et fais monter pour moi
  rationale: Le hifil de עלה signifie littéralement faire monter. Cette formulation conserve l’image spatiale du récit sans expliquer ni valider le mécanisme supposé de l’évocation.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: celui que je te désignerai
  rationale: La proposition vise la personne que Saül indiquera à la femme. « Désignerai » rend naturellement cette identification future dans le contexte.
theological_decisions:
- issue: Rendre le vocabulaire nécromantique sans se prononcer sur l’efficacité de la pratique
  choice: Rapporter directement la demande de Saül par « pratique… la divination », « au moyen d’un esprit » et « fais monter »
  alternative: Ajouter une réserve sceptique, telle que « prétends faire monter », ou au contraire expliciter que la femme entre réellement en contact avec l’esprit du mort
  rationale: Le verset formule la demande de Saül dans le cadre conceptuel du récit. La traduction conserve ce langage et sa tension théologique sans confirmer ni nier le fonctionnement de la nécromancie.
- issue: Ambiguïté du terme אוֹב
  choice: Employer « esprit » dans le texte et expliquer en note que le mot peut aussi désigner le médium
  alternative: Traduire directement par « médium » ou par « esprit familier »
  rationale: Le terme hébreu est polysémique dans cet environnement nécromantique. La solution choisie s’accorde avec « fais monter » tout en laissant ouverte, par la note, l’autre valeur lexicale attestée.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement restructurées pour la fluidité, tout en conservant la demande polie de Saül, le cadre nocturne et l’image hébraïque de « faire monter ».
