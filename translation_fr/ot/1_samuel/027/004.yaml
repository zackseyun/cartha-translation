  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
translation:
  language: fr
  text: Quand Saül apprit que David s’était enfui à Gath, il cessa de le rechercher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: Saül apprit
  rationale: Le passif hébreu indique que l’information fut communiquée à Saül sans préciser par qui. « Saül apprit » rend naturellement cet événement en français tout en laissant l’agent indéterminé.
- source_word: כִּי בָרַח דָּוִד גַּת
  choice: que David s’était enfui à Gath
  rationale: כִּי introduit le contenu de l’information; le plus-que-parfait situe la fuite avant le moment où Saül l’apprend. « À Gath » exprime naturellement la destination implicite en hébreu.
- source_word: וְלֹא יֹסֶף עוֹד לְבַקְשׁוֹ
  choice: il cessa de le rechercher
  rationale: La construction יסף + עוד sous négation marque la cessation de l’action. « Cessa de » conserve cette valeur aspectuelle sans reproduire lourdement l’idiome « ne continua plus davantage »; « rechercher » convient à la tentative de retrouver David sans imposer explicitement l’idée de poursuite.
