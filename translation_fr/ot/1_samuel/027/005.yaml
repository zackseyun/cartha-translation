  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ יִתְּנוּ לִ֣/י מָק֗וֹם בְּ/אַחַ֛ת עָרֵ֥י הַ/שָּׂדֶ֖ה וְ/אֵ֣שְׁבָה שָּׁ֑ם וְ/לָ֨/מָּה יֵשֵׁ֧ב עַבְדְּ/ךָ֛ בְּ/עִ֥יר הַ/מַּמְלָכָ֖ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: fr
  text: 'David dit à Akish : « Si j’ai trouvé grâce à tes yeux, je te prie, qu’on me donne une place dans l’une des villes de la campagne[a], et j’y habiterai[b]. Pourquoi, en effet, ton serviteur habiterait-il avec toi dans la ville royale[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans l’une des villes de la campagne » ; c’est-à-dire dans une ville de la campagne, par opposition à la ville royale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin que j’y habite ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « la ville du royaume ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: j’ai trouvé grâce à tes yeux
  rationale: Expression française naturelle et digne qui conserve l’image de l’idiome hébreu exprimant l’approbation ou la faveur.
- source_word: נָא
  choice: rendu par le ton courtois de la proposition conditionnelle
  rationale: La particule adoucit ici la requête. Ajouter « maintenant » serait peu naturel en français, tandis que « je te prie » risquerait de surtraduire.
- source_word: יִתְּנוּ לִי
  choice: qu’on me donne
  rationale: Le pronom indéfini « on » rend naturellement le pluriel impersonnel et la valeur jussive de la demande adressée à Akish.
- source_word: מָקוֹם
  choice: une place
  rationale: Terme générique qui correspond au sens large du nom hébreu dans ce contexte.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: dans l’une des villes de la campagne
  rationale: Rendu proche de l’expression hébraïque, tout en faisant clairement ressortir le contraste avec la ville royale.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: et j’y habiterai
  rationale: Préserve la coordination et la forme verbale de l’hébreu sans imposer une relation finale, même si celle-ci est possible dans le contexte.
- source_word: לָמָּה יֵשֵׁב
  choice: Pourquoi, en effet, … habiterait-il
  rationale: Le conditionnel français convient à la question rhétorique et « en effet » explicite sobrement son lien justificatif avec la demande.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Formule de déférence dans un échange de cour, sans accent particulier sur l’asservissement.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: dans la ville royale
  rationale: Expression idiomatique qui conserve le lien avec la royauté sans préciser indûment qu’il s’agit formellement d’une capitale.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: Rend directement la proximité relationnelle et géographique exprimée par la préposition hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement reflète les formes hébraïques singulières et la relation personnelle avec Akish. La requête demeure déférente, tandis que la coordination de וְאֵשְׁבָה est conservée dans le texte principal afin de ne pas imposer sa possible nuance finale.
