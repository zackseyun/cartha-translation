source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: fr
  text: 'David se dit en lui-même[a] : « Un jour, je périrai de la main de Saül. Je n’ai rien de mieux à faire que de m’enfuir[b] au pays des Philistins. Alors Saül renoncera[c] à me chercher encore dans tout le territoire d’Israël, et j’échapperai à sa main. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « David dit à son cœur ».'
    reason: expression_idiomatique
  - marker: b
    text: 'L’hébreu associe ici l’infinitif au verbe conjugué pour renforcer l’idée : « m’enfuir à coup sûr » ou « m’enfuir sans faute ».'
    reason: emphase_grammaticale
  - marker: c
    text: 'Ou : « Alors Saül perdra tout espoir de continuer à me chercher ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: se dit en lui-même
  rationale: L’expression hébraïque signifie littéralement « dit à son cœur » et désigne ici une réflexion intérieure. La formulation retenue est naturelle en français tout en conservant cette idée.
- source_word: אֶסָּפֶה
  choice: je périrai
  rationale: Le niphal de ספה exprime ici le fait de périr ou d’être emporté. « Périr » rend clairement la menace mortelle que David attribue à Saül sans ajouter une image absente du contexte immédiat.
- source_word: יוֹם אֶחָד
  choice: un jour
  rationale: Expression temporelle idiomatique signifiant « un jour » ou « tôt ou tard ». La traduction reste proche de la forme hébraïque.
- source_word: בְּיַד שָׁאוּל
  choice: de la main de Saül
  rationale: L’image de la main désigne l’action et le pouvoir de Saül. Elle demeure intelligible et se retrouve à la fin du verset.
- source_word: אֵין לִי טוֹב כִּי
  choice: Je n’ai rien de mieux à faire que de
  rationale: La construction exprime le choix que David juge le plus avantageux. Cette tournure française est naturelle et conserve le caractère comparatif du propos.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: m’enfuir
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’idée de fuite. Le contexte français « rien de mieux à faire que de » porte déjà une partie de cette force; une note signale explicitement l’emphase hébraïque.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: au pays des Philistins
  rationale: Traduction directe et courante de la désignation géographique hébraïque.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: Alors Saül renoncera
  rationale: Le verbe יאשׁ exprime la perte d’espoir qui conduit à abandonner une entreprise. « Renoncera » s’accorde naturellement avec l’infinitif « à me chercher ».
- source_word: לְבַקְשֵׁנִי עוֹד
  choice: à me chercher encore
  rationale: עוֹד évoque ici la poursuite ou la répétition de la recherche. « Encore » préserve cette nuance.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: dans tout le territoire d’Israël
  rationale: Dans ce contexte, גְּבוּל désigne l’étendue territoriale d’Israël plutôt que la seule ligne frontalière.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: et j’échapperai à sa main
  rationale: La traduction conserve à la fois le motif répété de la fuite et l’image hébraïque de la main comme pouvoir ou emprise.
