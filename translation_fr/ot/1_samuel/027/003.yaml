base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: fr
  text: 'David resta avec Akish à Gath[a], lui et ses hommes, chaque homme avec sa maisonnée : David avec ses deux épouses, Ahinoam de Jizréel et Abigaïl, femme de Nabal, originaire de Carmel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « habita avec Akish à Gath ». Le verbe hébreu peut désigner le fait d’habiter quelque part ou d’y rester pendant un temps.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Le verbe ישב peut signifier habiter, demeurer ou rester. Dans ce contexte narratif, « resta » exprime un séjour d’une certaine durée sans suggérer nécessairement une installation définitive.
- source_word: עִם אָכִישׁ בְּגַת
  choice: auprès d’Akish à Gath
  rationale: עִם marque l’association avec Akish, tandis que בְּ situe la scène à Gath. « Auprès de » est naturel en français et distingue clairement la personne du lieu.
- source_word: הוּא וַאֲנָשָׁיו
  choice: lui et ses hommes
  rationale: La formulation conserve le sens littéral et désigne naturellement les hommes qui accompagnaient David, sans préciser davantage leur statut.
- source_word: אִישׁ וּבֵיתוֹ
  choice: chacun avec sa maisonnée
  rationale: אִישׁ a ici une valeur distributive, et בַּיִת désigne les personnes de la maison plutôt que le bâtiment. « Maisonnée » préserve cette portée plus large que la seule famille proche.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: avec ses deux femmes
  rationale: La tournure explicite le contenu de la maisonnée de David et s’intègre naturellement après les deux-points.
- source_word: הַיִּזְרְעֵאלִית
  choice: de Jizréel
  rationale: Le gentilé féminin indique l’origine d’Ahinoam. « De Jizréel » est plus naturel et immédiatement compréhensible en français moderne qu’un gentilé rare.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: femme de Nabal de Carmel
  rationale: La syntaxe hébraïque identifie Abigaïl comme la femme de Nabal et rattache le qualificatif « de Carmel » à Abigaïl; la formulation française reste concise tout en conservant ces éléments.
