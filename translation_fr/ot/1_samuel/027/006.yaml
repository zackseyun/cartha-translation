base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: fr
  text: Ce jour-là, Akish lui donna Tsiklag. C’est pourquoi Tsiklag a appartenu aux rois de Juda jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: donna
  rationale: Dans ce contexte narratif, נתן signifie naturellement « donner »; le passé simple convient à la narration française.
- source_word: לּוֹ
  choice: lui
  rationale: Le suffixe pronominal masculin singulier renvoie à David dans le contexte immédiat.
- source_word: אָכִישׁ
  choice: Akish
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle idiomatique qui conserve la précision du texte hébreu.
- source_word: צִקְלָג
  choice: Tsiklag
  rationale: Transcription française du nom de lieu, avec « Ts » pour représenter le tsadé initial.
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend clairement et naturellement le lien de conséquence entre le don d’Akish et la possession ultérieure de la ville.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: a appartenu aux rois de Juda
  rationale: La construction avec ל exprime ici l’appartenance; le passé composé associé à « jusqu’à ce jour » traduit la continuité depuis l’événement jusqu’au présent du narrateur.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française naturelle qui conserve le repère rétrospectif du narrateur.
theological_decisions:
- issue: Perspective historique impliquée par « jusqu’à ce jour » et « les rois de Juda »
  choice: Conserver telle quelle la remarque rétrospective du narrateur.
  alternative: Préciser qu’elle reflète un point de vue ultérieur situé sous la monarchie judéenne.
  rationale: L’hébreu énonce simplement ce constat historique; la traduction ne doit imposer aucune théorie concernant la date, l’auteur ou la rédaction du livre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste simple et narrative; « a appartenu » explicite sans surinterprétation la relation possessive exprimée en hébreu.
