  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: fr
  text: La durée du séjour de David dans le territoire des Philistins fut d’un an et quatre mois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « des jours et quatre mois » ; dans cette formule de durée, « des jours » est une manière idiomatique de dire « un an ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: La durée … fut
  rationale: Cette formulation française naturelle rend la tournure hébraïque qui introduit le bilan d’une durée, sans conserver le peu idiomatique « le nombre des jours fut ».
- source_word: אֲשֶׁר יָשַׁב דָּוִד
  choice: du séjour de David
  rationale: Le verbe יָשַׁב désigne ici le fait de résider ou de séjourner, et non l’action littérale de s’asseoir. La nominalisation s’intègre naturellement à la formule française de durée.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: dans le territoire des Philistins
  rationale: שָׂדֶה signifie littéralement « champ », mais désigne ici le pays ou le territoire contrôlé par les Philistins.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: un an et quatre mois
  rationale: Dans cette formule de durée, יָמִים est employé idiomatiquement au sens d’« un an ». La traduction explicite ce sens tout en le signalant dans une note.
theological_decisions: []
