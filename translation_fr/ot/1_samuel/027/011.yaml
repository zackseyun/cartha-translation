source:
  edition: WLC
  text: וְ/אִ֨ישׁ וְ/אִשָּׁ֜ה לֹֽא יְחַיֶּ֣ה דָוִ֗ד לְ/הָבִ֥יא גַת֙ לֵ/אמֹ֔ר פֶּן יַגִּ֥דוּ עָלֵ֖י/נוּ לֵ/אמֹ֑ר כֹּֽה עָשָׂ֤ה דָוִד֙ וְ/כֹ֣ה מִשְׁפָּט֔/וֹ כָּל הַ֨/יָּמִ֔ים אֲשֶׁ֥ר יָשַׁ֖ב בִּ/שְׂדֵ֥ה פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: fr
  text: 'David ne laissait en vie ni homme ni femme qu’on puisse amener à Gath. Il se disait : « Sinon, ils pourraient faire un rapport sur nous et dire : “Voilà ce que David a fait, et telle était sa manière d’agir[a] pendant tout le temps où il séjournait dans le territoire des Philistins[b].” »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « telle était sa coutume » ou « telle était sa pratique ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « dans la campagne des Philistins », expression qui désigne ici leur territoire ou leur région.'
    reason: cultural_note
  - marker: c
    text: La dernière proposition peut aussi se comprendre comme un commentaire du narrateur plutôt que comme la suite des paroles rapportées.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: ni homme ni femme
  rationale: La paire au singulier a une valeur distributive et exprime l’absence totale de survivants humains.
- source_word: לֹא יְחַיֶּה
  choice: ne laissait en vie
  rationale: Le piel de חיה signifie ici épargner ou maintenir en vie. L’imparfait français convient au récit d’une pratique répétée.
- source_word: לְהָבִיא גַת
  choice: pour les amener à Gath
  rationale: L’infinitif exprime le but. Le pronom « les », implicite en hébreu, est nécessaire à la clarté en français.
- source_word: לֵאמֹר ... פֶּן
  choice: 'Il se disait : « Sinon'
  rationale: Le premier לֵאמֹר introduit le raisonnement de David sous forme de discours, tandis que פֶּן marque le résultat indésirable qu’il voulait empêcher.
- source_word: יַגִּדוּ עָלֵינוּ
  choice: ils pourraient parler de nous
  rationale: La tournure rend le sens de divulguer ou rapporter quelque chose au sujet de David et de ses hommes, sans préciser un destinataire absent du texte.
- source_word: כֹּה עָשָׂה דָוִד
  choice: Voilà ce que David a fait
  rationale: « Voilà » conserve la force démonstrative de כֹּה dans une citation naturelle en français.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: et telle était sa manière d’agir
  rationale: מִשְׁפָּט désigne ici vraisemblablement une conduite habituelle plutôt qu’un jugement juridique; « manière d’agir » garde toutefois une certaine largeur sémantique.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: pendant tout le temps où il séjournait
  rationale: La formule indique toute la durée de la résidence de David; « séjournait » est naturel et n’implique pas nécessairement une installation définitive.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: dans le territoire des Philistins
  rationale: שָׂדֶה signifie littéralement « champ » ou « campagne », mais désigne ici plus largement le territoire philistin.
theological_decisions:
- issue: Étendue de la citation rapportant les paroles possibles des survivants
  choice: Inclure « et telle était sa manière d’agir… » dans les paroles qu’ils pourraient rapporter
  alternative: Comprendre cette dernière proposition comme un commentaire du narrateur
  rationale: La suite des deux occurrences de כֹּה après לֵאמֹר favorise une citation continue, mais la ponctuation n’est pas explicitement marquée dans le texte hébreu.
translation_notes:
  register: Français moderne, digne et narratif. L’imparfait présente l’action comme la pratique habituelle de David. La répétition hébraïque de לֵאמֹר est rendue par « Il se disait » puis « dire », sans alourdir la phrase.
