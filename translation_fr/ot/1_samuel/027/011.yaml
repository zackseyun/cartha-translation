    rationale: Dans ce contexte, David ne laisse aucun survivant qui puisse être conduit à Gath et y faire connaître ses opérations ; la formulation française actuelle obscurcit cette relation.
  - severity: low
    issue: La portée de la citation incluant « et telle était sa manière d’agir… » est interprétative sans note.
    rationale: L’hébreu ancien ne fournit pas de guillemets. La proposition peut être comprise soit comme la suite des paroles que les survivants rapporteraient, soit comme un commentaire du narrateur.
