  to: 'David ne laissait en vie ni homme ni femme qu’on puisse amener à Gath. Il se disait : « Sinon, ils pourraient faire un rapport sur nous et dire : “Voilà ce que David a fait, et telle était sa manière d’agir[a] pendant tout le temps où il séjournait dans le territoire des Philistins[b].” »[c]'
