  register: Français international moderne, narratif et digne. L’imparfait présente les raids comme une pratique répétée dans cette période. Les ethnonymes sont translittérés sans moderniser leur identité; la note [a] est placée après « Guirzites », le nom effectivement concerné par la variante.
