  text: וַ/יַּ֤עַל דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו וַֽ/יִּפְשְׁט֛וּ אֶל הַ/גְּשׁוּרִ֥י ו/ה/גרזי וְ/הָ/עֲמָלֵקִ֑י כִּ֣י הֵ֜נָּה יֹשְׁב֤וֹת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר מֵֽ/עוֹלָ֔ם בּוֹאֲ/ךָ֥ שׁ֖וּרָ/ה וְ/עַד אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: fr
  text: David monta avec ses hommes, et ils lancèrent des incursions contre les Gueshourites, les Guirzites[a] et les Amalécites. En effet, ces peuples habitaient le pays depuis les temps anciens, quand on va vers Shour[b], jusqu’au pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Guézrites ». La forme de cet ethnonyme est incertaine.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « quand tu vas vers Shour ».'
    reason: source_idiom
lexical_decisions:
- source_word: וַיַּעַל
  choice: montaient
  rationale: Le verbe עלה signifie normalement « monter ». L’imparfait convient ici à la description d’incursions répétées dans le cadre du séjour de David chez les Philistins.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: faire des incursions contre
  rationale: Dans un contexte militaire, פשט désigne une expédition de raid ou de pillage; avec la cible introduite par אֶל, « contre » est idiomatique en français.
- source_word: הַגְּשׁוּרִי
  choice: les Gueshourites
  rationale: Translittération française claire de l’ethnonyme, rendu comme nom collectif d’un peuple.
- source_word: הגרזי
  choice: les Guirzites
  rationale: Translittération proche de la forme consonantique גרזי; l’incertitude textuelle et les autres formes traditionnelles sont signalées en note.
- source_word: הָעֲמָלֵקִי
  choice: les Amalécites
  rationale: Forme française courante de cet ethnonyme biblique.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: En effet, ces peuples habitaient le pays
  rationale: « Ces peuples » explicite naturellement le référent collectif du pronom et du participe féminins pluriels tout en conservant leur valeur démonstrative.
- source_word: מֵעוֹלָם
  choice: depuis les temps anciens
  rationale: Dans ce contexte, עוֹלָם renvoie à une ancienneté prolongée, non à l’éternité au sens absolu.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: dans la direction de Shour
  rationale: La formule géographique à la deuxième personne a un sens impersonnel, « quand on va vers Shour »; cette formulation française en exprime naturellement l’orientation.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: et jusqu’au pays d’Égypte
  rationale: La préposition עַד marque ici la limite ou l’étendue du territoire.
theological_decisions: []
