source:
  edition: WLC
  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: fr
  text: David frappait le pays et ne laissait en vie ni homme ni femme[a]. Il prenait les moutons, les bovins, les ânes, les chameaux et les vêtements. Puis il revenait auprès d’Akish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne laissait vivre aucun homme ni aucune femme ».'
    reason: Alternative lexicale conservant la valeur causative du hiphil de חיה.
lexical_decisions:
- source_word: וְהִכָּה
  choice: frappait
  rationale: Le hiphil de נכה peut exprimer le fait de frapper ou d’attaquer. Dans cette série d’actions habituelles, l’imparfait « frappait » reste direct sans ajouter de précision absente de l’hébreu.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ désigne ici le territoire visé par les incursions. « Le pays » est naturel en français et ne suggère pas la terre physique.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: ne laissait en vie ni homme ni femme
  rationale: Le hiphil de חיה signifie « laisser vivre » ou « garder en vie ». Cette formulation idiomatique conserve explicitement les deux termes du texte.
- source_word: וְלָקַח
  choice: Il prenait
  rationale: לקח signifie couramment « prendre ». Le contexte indique qu’il s’agit de butin, sans qu’il soit nécessaire de renforcer le verbe.
- source_word: צֹאן
  choice: les moutons
  rationale: צֹאן désigne le petit bétail, souvent les ovins. « Les moutons » garde la liste concrète et accessible, tout en restant distinct des bovins.
- source_word: בָקָר
  choice: les bovins
  rationale: בקר désigne collectivement le gros bétail bovin. « Les bovins » est précis et naturel en français international.
- source_word: חֲמֹרִים
  choice: les ânes
  rationale: Équivalent français moderne et direct.
- source_word: גְמַלִּים
  choice: les chameaux
  rationale: Équivalent lexical direct.
- source_word: בְגָדִים
  choice: les vêtements
  rationale: « Vêtements » est actuel, digne et adapté à une liste de biens emportés.
- source_word: וַיָּשָׁב וַיָּבֹא אֶל אָכִישׁ
  choice: Puis il revenait auprès d’Akish
  rationale: Dans le contexte itératif des raids, l’imparfait français exprime l’action répétée. « Revenait auprès de » rend naturellement les deux verbes successifs sans la lourdeur de « revenait et venait ».
- source_word: אָכִישׁ
  choice: Akish
  rationale: Translittération française usuelle du nom propre hébreu.
theological_decisions:
- issue: Présentation de la violence du raid
  choice: Dire sans détour que David ne laissait en vie ni homme ni femme
  alternative: Atténuer la mise à mort ou, à l’inverse, employer un terme plus chargé comme « massacrait »
  rationale: Le texte décrit sobrement une action violente et létale. La traduction ne doit ni l’euphémiser ni l’amplifier.
- issue: Valeur aspectuelle des verbes dans le contexte narratif
  choice: Employer l’imparfait pour les actions répétées
  alternative: Employer le passé simple comme pour un raid unique
  rationale: Les versets environnants décrivent la pratique habituelle de David lors de ses incursions. L’imparfait français rend cette itération tout en respectant les formes narratives hébraïques.
translation_notes:
  register: Français moderne international, sobre et narratif. L’imparfait situe le verset dans la description d’incursions répétées. Le vocabulaire demeure explicite sans dramatisation ajoutée.
