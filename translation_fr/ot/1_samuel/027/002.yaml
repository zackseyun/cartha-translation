base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/002.yaml
  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: fr
  text: David se leva et passa de l’autre côté avec les six cents hommes qui étaient avec lui, chez Akish, fils de Maok, roi de Gath.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva donc
  rationale: Le qatal narratif de קום introduit ici le passage à l’action. « Se leva » conserve l’idiome hébreu, tandis que « donc » relie naturellement la décision précédente à son exécution.
- source_word: וַיַּעֲבֹר
  choice: passa de l’autre côté
  rationale: עבר exprime un franchissement. Dans le contexte, David passe du territoire israélite au territoire philistin ; cette formulation garde la valeur directionnelle sans préciser une frontière que le texte ne nomme pas.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: avec les six cents hommes
  rationale: Littéralement, « lui et six cents hommes ». En français narratif, « avec » rend naturellement la composition du groupe, et l’article défini signale les hommes déjà connus du récit.
- source_word: אֲשֶׁר עִמּוֹ
  choice: qui étaient avec lui
  rationale: Rendu direct de la proposition relative, sans surinterpréter leur rôle par « qui l’accompagnaient ».
- source_word: אֶל אָכִישׁ
  choice: pour aller auprès d’Akish
  rationale: אֶל marque le mouvement vers une personne. « Auprès de » rend ici la destination personnelle ; « pour aller » complète naturellement en français le verbe de franchissement.
- source_word: אָכִישׁ
  choice: Akish
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בֶּן מָעוֹךְ
  choice: fils de Maok
  rationale: Rend directement la construction patronymique hébraïque et adopte une translittération française claire.
- source_word: מֶלֶךְ גַּת
  choice: roi de Gath
  rationale: La chaîne construite désigne la fonction royale d’Akish ; l’apposition sans article est naturelle en français.
theological_decisions: []
