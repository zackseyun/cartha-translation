  text: וַ/יֹּ֣אמֶר אָכִ֔ישׁ אַל פְּשַׁטְתֶּ֖ם הַ/יּ֑וֹם וַ/יֹּ֣אמֶר דָּוִ֗ד עַל נֶ֤גֶב יְהוּדָה֙ וְ/עַל נֶ֣גֶב הַ/יַּרְחְמְאֵלִ֔י וְ/אֶל נֶ֖גֶב הַ/קֵּינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: fr
  text: 'Alors Akish dit[a] : « Où avez-vous fait une incursion aujourd’hui ? » David répondit : « Contre le Néguev de Juda, contre le Néguev des Yerahméélites[b] et contre le Néguev des Qénites. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu se lit littéralement à peu près : « N’avez-vous pas fait une incursion aujourd’hui ? » Toutefois, dans ce contexte, la question a le sens de : « Où avez-vous fait une incursion aujourd’hui ? »'
    reason: textual_variant
  - marker: b
    text: 'Ou : « le sud de Juda, le sud des Yerahméélites et le sud des Qénites » ; de même pour les trois occurrences de « Néguev » dans ce verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: Où avez-vous fait une incursion aujourd’hui ?
  rationale: Le texte consonantique comporte אַל, normalement « ne… pas », mais le contexte narratif et les versions anciennes indiquent une question portant sur le lieu. « Faire une incursion » rend le sens militaire de פשט sans réduire l’action au seul pillage.
- source_word: נֶגֶב
  choice: Néguev
  rationale: Le terme peut désigner le sud ou la région aride méridionale appelée le Néguev. Sa répétition avec des noms de territoires et de peuples favorise ici la valeur géographique, tout en laissant une variante en note.
- source_word: עַל
  choice: contre
  rationale: Dans le récit trompeur que David fait de ses incursions, עַל présente les territoires comme les cibles d’une action hostile.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom tribal et territorial.
- source_word: הַיַּרְחְמְאֵלִי
  choice: les Yerahméélites
  rationale: Le gentilé hébreu désigne le clan ou peuple issu de Yerahméel. Cette translittération française distingue clairement le nom propre.
- source_word: הַקֵּינִי
  choice: les Qénites
  rationale: Le gentilé désigne le peuple qénite ; « Qénites » est une forme française biblique reconnue.
- source_word: וַיֹּאמֶר
  choice: dit / répondit
  rationale: « Dit » préserve le verbe hébreu pour Akish ; pour David, « répondit » exprime naturellement la fonction du même verbe dans le dialogue sans ajouter de contenu.
theological_decisions: []
translation_notes:
  register: Français international actuel, naturel et digne. « Incursion » conserve la nuance militaire de l’action. Les noms propres suivent des formes françaises lisibles ; la syntaxe répétitive de la réponse de David maintient l’effet de l’hébreu.
