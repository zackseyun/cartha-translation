base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: fr
  text: 'Akish fit confiance à David en disant : « Il s’est bel et bien rendu odieux auprès de son peuple en Israël[a]. Il sera donc mon serviteur[b] pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Il s’est vraiment rendu puant auprès de son peuple », image qui signifie qu’il s’est rendu tout à fait détestable.'
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « serviteur » peut aussi signifier « esclave ». Ici, le contexte paraît surtout évoquer un service permanent et une dépendance envers Akish.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: fit confiance à
  rationale: Le hifil de אמן suivi de ב exprime ici la confiance placée en une personne. « Fit confiance à » convient mieux que le sens plus intellectuel de « crut ».
- source_word: בְּדָוִד
  choice: David
  rationale: Le nom est rendu selon sa forme française usuelle; la préposition ב est naturellement intégrée à la construction « faire confiance à ».
- source_word: לֵאמֹר
  choice: car il se disait
  rationale: L’infinitif quotatif introduit le raisonnement d’Akish. Dans ce contexte, « il se disait » exprime naturellement une parole intérieure, tandis que « car » explicite le lien entre sa confiance et son raisonnement sans en modifier le contenu.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: s’est rendu tout à fait odieux
  rationale: La construction infinitif absolu plus verbe conjugué intensifie באש. En français actuel, « tout à fait odieux » restitue clairement la force idiomatique; une note conserve l’image littérale de la mauvaise odeur.
- source_word: בְּעַמּוֹ
  choice: auprès de son peuple
  rationale: La préposition ב indique ici le groupe aux yeux duquel David serait devenu détestable. « Auprès de son peuple » est naturel et garde cette relation sociale.
- source_word: בְיִשְׂרָאֵל
  choice: en Israël
  rationale: Le complément national et géographique est conservé sans l’assimiler simplement à « son peuple ».
- source_word: וְהָיָה לִי
  choice: Il sera donc mon
  rationale: La proposition exprime la conséquence qu’Akish tire de l’aliénation supposée de David. « Donc » rend cette valeur logique.
- source_word: לְעֶבֶד
  choice: serviteur
  rationale: עבד peut désigner un serviteur ou un esclave. Ici, Akish envisage surtout une dépendance et un service durables, proches d’une relation de vassalité; « serviteur » convient au contexte, tout en signalant l’autre possibilité en note.
- source_word: עוֹלָם
  choice: pour toujours
  rationale: עוֹלָם désigne ici une durée future indéfinie et durable. « Pour toujours » restitue naturellement l’attente d’Akish.
