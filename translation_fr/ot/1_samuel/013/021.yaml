  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: fr
  text: Le prix était d’un pim[a][b] pour les socs de charrue, les pioches, les fourches à trois dents et les haches, ainsi que pour remettre en état les aiguillons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pim était probablement une petite unité de poids, généralement estimée à environ deux tiers de sicle; il désigne ici vraisemblablement le montant exigé.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « L’affûtage coûtait un pim ». Le texte hébreu est difficile : il peut désigner soit le prix demandé, soit le travail d’affûtage lui-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: le prix
  rationale: Ce nom rare peut désigner l’affûtage ou le prix exigé pour ce travail. Comme פִים indique ensuite une quantité, « le prix » convient naturellement au contexte, tandis qu’une note conserve l’autre lecture.
- source_word: פִים
  choice: un pim
  rationale: Le terme désigne une ancienne unité de poids ou de paiement dont la valeur probable est expliquée en note; la translittération évite une conversion trop assurée.
- source_word: מַחֲרֵשֹׁת
  choice: socs de charrue
  rationale: Désigne vraisemblablement les parties métalliques tranchantes des charrues qui avaient besoin d’être affûtées.
- source_word: אֵתִים
  choice: pioches
  rationale: Le mot désigne un outil agricole servant à creuser ou à travailler le sol; « pioches » est clair en français moderne, même si l’identification exacte demeure incertaine.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: fourches à trois dents
  rationale: Rend directement l’image d’un instrument à trois pointes dans une formulation française naturelle.
- source_word: קַּרְדֻּמִּים
  choice: haches
  rationale: Le terme désigne couramment des outils servant à couper, bien qu’il puisse éventuellement couvrir des outils proches de l’herminette.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: pour remettre en état les aiguillons
  rationale: L’infinitif peut exprimer l’action d’ajuster, de réparer ou de rendre de nouveau utilisables les aiguillons. « Remettre en état » préserve cette largeur de sens sans imposer l’idée précise d’affûtage.
