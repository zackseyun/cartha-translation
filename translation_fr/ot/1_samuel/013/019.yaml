  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: fr
  text: 'On ne trouvait aucun forgeron dans tout le pays d’Israël, car les Philistins avaient dit : « Il ne faudrait pas que les Hébreux[a] fabriquent des épées ou des lances. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de peur que les Hébreux ne fabriquent une épée ou une lance ». Le singulier des noms hébreux désigne ici les armes de façon générique.'
    reason: Signale la nuance préventive de פֶּן et le singulier générique de « épée » et « lance ».
lexical_decisions:
- source_word: חָרָשׁ
  choice: forgeron
  rationale: Dans ce contexte militaire et métallurgique, le terme désigne un artisan capable de fabriquer des armes et d’entretenir des outils ; « forgeron » est plus précis que le terme général « artisan ».
- source_word: יִמָּצֵא
  choice: on ne trouvait
  rationale: Le niphal exprime ici le fait qu’aucun forgeron n’était présent ou disponible. Cette tournure est naturelle en français narratif.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: dans tout le pays d’Israël
  rationale: Rendu géographique direct et idiomatique ; « pays » convient au français moderne sans affaiblir le sens territorial.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’absence de forgerons. « Car » relie naturellement les deux propositions dans un registre narratif digne.
- source_word: אמר
  choice: avaient dit
  rationale: Le plus-que-parfait explicite que cette décision des Philistins avait précédé et causé la situation décrite.
- source_word: פֶּן
  choice: Il ne faut pas que
  rationale: Cette formulation exprime clairement la volonté préventive des Philistins en français courant. La construction plus formelle « de peur que » est conservée en note.
- source_word: הָעִבְרִים
  choice: les Hébreux
  rationale: Le texte emploie précisément l’appellation « Hébreux », fréquente dans la bouche d’étrangers ou en contexte interethnique ; elle ne doit pas être harmonisée avec « Israélites ».
- source_word: יַעֲשׂוּ
  choice: fabriquent
  rationale: Dans la proposition introduite par « Il ne faut pas que », le subjonctif français exprime correctement l’action éventuelle que les Philistins cherchent à empêcher.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: des épées ou des lances
  rationale: Les noms hébreux sont au singulier générique. Le pluriel est plus naturel en français pour parler de la fabrication de ces catégories d’armes.
