source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: fr
  text: 'Samuel dit à Saül : « Tu as agi de manière insensée[a]. Tu n’as pas observé le commandement que Yahweh, ton Dieu, t’avait ordonné. Car maintenant, Yahweh aurait établi pour toujours ta royauté sur Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Tu t’es conduit en insensé. »'
    reason: Alternative lexicale pour נִסְכָּלְתָּ, qui peut être formulée comme une qualification de la conduite ou de la personne.
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: Tu as agi de manière insensée
  rationale: Le nifal de סכל qualifie ici la conduite de Saül. Cette formulation française exprime une action moralement irréfléchie sans réduire le terme à un simple état personnel.
- source_word: שָׁמַרְתָּ
  choice: tu n’as pas observé
  rationale: שׁמר appliqué à un commandement signifie le garder ou l’observer. « Observé » conserve la nuance d’alliance et implique l’obéissance sans la paraphraser entièrement.
- source_word: מִצְוַת
  choice: le commandement
  rationale: Le singulier désigne l’ordre précis donné à Saül; « commandement » convient au registre biblique tout en restant courant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel, plutôt que substitution par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement la construction possessive hébraïque.
- source_word: אֲשֶׁר צִוָּךְ
  choice: que … t’avait donné
  rationale: En français, « le commandement que Dieu avait donné » est naturel et évite la répétition lourde « le commandement qu’il t’avait commandé », tout en conservant le sens de צוה.
- source_word: כִּי עַתָּה
  choice: Sinon, … maintenant
  rationale: Dans le contexte, כִּי introduit l’issue désormais perdue du fait de la désobéissance. « Sinon » rend explicitement et naturellement ce rapport contrefactuel en français.
- source_word: הֵכִין
  choice: aurait … établi
  rationale: 'Le contexte impose une conséquence contrefactuelle: l’affermissement promis n’a pas eu lieu. Le conditionnel passé français rend cette force.'
- source_word: מַמְלַכְתְּךָ
  choice: ta royauté
  rationale: ממלכה peut désigner le royaume ou la dignité et le pouvoir royal. Ici, l’établissement durable de la dynastie de Saül est mieux exprimé par « royauté » que par un territoire lui appartenant.
- source_word: אֶל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Dans ce contexte de domination royale, אֶל se rend idiomatiquement par « sur ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Équivalent français courant de la formule de durée indéfinie ou perpétuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction sans lui substituer un titre.
- issue: Force contrefactuelle de כִּי עַתָּה הֵכִין יְהוָה
  choice: Sinon, Yahweh aurait maintenant établi
  alternative: Car maintenant Yahweh avait établi
  rationale: Le discours de Samuel décrit l’avenir dynastique que Saül a perdu par sa faute. Le conditionnel passé rend cette implication contextuelle sans affirmer que sa royauté avait réellement été établie pour toujours.
- issue: Portée de מַמְלַכְתְּךָ
  choice: ta royauté
  alternative: ton royaume
  rationale: La menace concerne la permanence du pouvoir royal de Saül et de sa maison. « Royauté » garde cette portée institutionnelle et dynastique, sans exclure la notion de royaume.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite la répétition non idiomatique du verbe « commander ». « Sinon » clarifie la relation contrefactuelle exigée par le contexte, tandis que « maintenant » conserve עַתָּה. Le marqueur [a] figure immédiatement après l’expression concernée.
