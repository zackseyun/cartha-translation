  text: וְ/עִבְרִ֗ים עָֽבְרוּ֙ אֶת הַ/יַּרְדֵּ֔ן אֶ֥רֶץ גָּ֖ד וְ/גִלְעָ֑ד וְ/שָׁאוּל֙ עוֹדֶ֣/נּוּ בַ/גִּלְגָּ֔ל וְ/כָל הָ/עָ֖ם חָרְד֥וּ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: fr
  text: Des Hébreux traversèrent le Jourdain pour gagner le territoire de Gad et de Galaad[a]. Saül, lui, était encore à Guilgal, et tout le peuple tremblait derrière lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Des Israélites »; le texte hébreu porte « Hébreux », désignation qui peut avoir ici une nuance ethnique particulière.
    reason: lexical_alternative
  - marker: b
    text: Ou « à sa suite » ou « en le suivant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: Hébreux
  rationale: Le terme hébreu désigne littéralement des « Hébreux ». Cette désignation peut avoir ici une nuance ethnique particulière ou renvoyer aux Israélites; conserver « Hébreux » évite de trancher cette ambiguïté.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: traversèrent le Jourdain
  rationale: En français naturel, « traverser le Jourdain » exprime pleinement le passage d'une rive à l'autre sans nécessiter un équivalent distinct pour la nuance directionnelle du verbe.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: pour gagner le territoire de Gad et de Galaad
  rationale: אֶרֶץ peut désigner un pays, une terre ou un territoire. « Territoire » convient à cette indication géographique transjordanienne, et « pour gagner » rend naturellement la destination implicite.
- source_word: עוֹדֶנּוּ
  choice: était encore
  rationale: L'expression marque la continuité de la présence de Saül à Guilgal.
- source_word: בַגִּלְגָּל
  choice: à Guilgal
  rationale: La préposition française « à » est idiomatique devant ce nom de lieu.
- source_word: חָרְדוּ
  choice: tremblait
  rationale: Le verbe décrit une peur qui se manifeste par le tremblement; ce choix conserve l'image vive de l'hébreu.
- source_word: אַחֲרָיו
  choice: en le suivant
  rationale: אַחֲרָיו peut signifier « derrière lui » ou « à sa suite ». Dans ce contexte, « en le suivant » exprime naturellement que le peuple demeure dans la suite de Saül, tout en signalant l'autre lecture en note.
