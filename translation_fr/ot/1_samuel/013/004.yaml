base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: fr
  text: 'Tout Israël apprit la nouvelle : « Saül a frappé le poste militaire des Philistins[a], et Israël est aussi devenu odieux aux Philistins[b]. » Alors le peuple fut convoqué pour suivre Saül à Guilgal[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le gouverneur des Philistins » ou « la garnison des Philistins ». Le terme hébreu peut désigner soit un responsable établi, soit un poste occupé ; le contexte militaire favorise ici « poste militaire ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Israël est aussi devenu une puanteur pour les Philistins », image signifiant qu’Israël était devenu détestable à leurs yeux.'
    reason: lexical_alternative
  - marker: c
    text: Ou « le peuple fut rassemblé derrière Saül à Guilgal ». L’expression hébraïque évoque probablement la mobilisation du peuple pour suivre Saül au combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: apprit la nouvelle
  rationale: La construction introduit une information rapportée. « Apprit la nouvelle » est naturel en français tout en conservant l’idée d’une nouvelle qui circule.
- source_word: הִכָּה
  choice: a frappé
  rationale: Le verbe נכה signifie fondamentalement « frapper » et garde ici sa force militaire sans préciser outre mesure s’il s’agit d’une attaque ou d’une destruction complète.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: le poste militaire des Philistins
  rationale: נְצִיב peut désigner un responsable établi ou un poste occupé. Le contexte militaire favorise le sens de poste ou garnison, mais l’ambiguïté est signalée en note.
- source_word: נִבְאַשׁ
  choice: s’est rendu odieux
  rationale: Le niphal de באש évoque littéralement une odeur infecte et, par métaphore, le fait de devenir détestable. Cette formulation française exprime clairement l’hostilité ainsi suscitée.
- source_word: בַּפְּלִשְׁתִּים
  choice: aux Philistins
  rationale: Avec נִבְאַשׁ, la préposition indique ceux pour qui Israël est devenu odieux.
- source_word: וַיִּצָּעֲקוּ
  choice: fut convoqué
  rationale: Dans ce contexte de mobilisation militaire, la forme renvoie au rassemblement du peuple sur convocation plutôt qu’à un simple cri.
- source_word: אַחֲרֵי שָׁאוּל
  choice: pour suivre Saül
  rationale: Littéralement « derrière/après Saül » ; dans ce contexte, l’expression décrit le ralliement du peuple sous sa conduite.
- source_word: הַגִּלְגָּל
  choice: à Guilgal
  rationale: Le nom de lieu est translittéré selon l’usage français, et la préposition « à » convient au lieu du rassemblement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours rapporté est introduit naturellement par deux-points. « Poste militaire » évite le possible anachronisme institutionnel de « garnison » tout en laissant l’autre analyse en note. La métaphore olfactive de נִבְאַשׁ est explicitée en note plutôt qu’imposée dans le corps du texte.
