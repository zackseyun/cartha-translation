  text: וַ/יָּ֣קָם שְׁמוּאֵ֗ל וַ/יַּ֛עַל מִן הַ/גִּלְגָּ֖ל גִּבְעַ֣ת בִּנְיָמִ֑ן וַ/יִּפְקֹ֣ד שָׁא֗וּל אֶת הָ/עָם֙ הַ/נִּמְצְאִ֣ים עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: fr
  text: 'Alors Samuel se leva et monta de Guilgal à Guibéa de Benjamin[a]. Saül dénombra le peuple qui se trouvait avec lui : environ six cents hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins et certaines traductions ont « Guéba de Benjamin » au lieu de « Guibéa de Benjamin ». Le texte hébreu suivi ici porte « Guibéa de Benjamin ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום signifie couramment « se lever ». Cette formulation conserve la succession des actions sans réduire le verbe au simple départ.
- source_word: וַיַּעַל
  choice: monta
  rationale: עלה exprime ici un déplacement vers le haut. « Monta » restitue naturellement cette nuance directionnelle en français.
- source_word: מִן הַגִּלְגָּל
  choice: de Guilgal
  rationale: Le groupe prépositionnel indique directement le point de départ.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: à Guibéa de Benjamin
  rationale: Le texte massorétique vocalisé porte le nom de lieu Guibéa. La variante « Guéba » est signalée en note plutôt qu’introduite dans le texte principal.
- source_word: וַיִּפְקֹד
  choice: compta
  rationale: Dans ce contexte militaire, פקד peut signifier compter, recenser ou passer en revue. « Compta » reste clair et n’ajoute pas l’idée d’une mobilisation formelle.
- source_word: הָעָם
  choice: les gens
  rationale: עם désigne largement le peuple ou les personnes présentes. Ici, « les gens » est naturel en français et évite de préciser « soldats » au-delà du texte hébreu.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: qui se trouvaient avec lui
  rationale: Le participe niphal de מצא signifie littéralement « qui étaient trouvés », avec le sens idiomatique de personnes présentes auprès de Saül.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: environ six cents hommes
  rationale: Le préfixe כ marque l’approximation, et אִישׁ désigne ici des hommes adultes dans une expression de dénombrement adaptée au contexte militaire.
