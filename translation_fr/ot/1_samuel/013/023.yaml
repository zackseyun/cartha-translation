  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: fr
  text: Une garnison des Philistins sortit vers le passage de Mikmas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un poste des Philistins sortit vers le défilé de Mikmas »; ou « un détachement des Philistins sortit vers le passage de Mikmas ».'
    reason: Alternatives lexicales pour מַצַּב et מַעֲבַר; la note conserve aussi la nuance possible de force stationnée, de poste ou de détachement.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: s’avança
  rationale: Le verbe יצא exprime ici un mouvement vers l’extérieur ou vers l’avant. Dans ce contexte militaire, « s’avança » rend naturellement ce mouvement sans lui attribuer une manœuvre plus précise que ne le fait l’hébreu.
- source_word: מַצַּב
  choice: poste de garde
  rationale: Dans ce contexte militaire, מַצַּב peut désigner soit un poste, soit les hommes qui y sont stationnés. « Poste de garde » est clair en français moderne tout en laissant subsister cette légère ambiguïté.
- source_word: פְּלִשְׁתִּים
  choice: philistin
  rationale: Le rapport construit est rendu naturellement par l’adjectif « philistin », qui qualifie le poste comme appartenant aux Philistins.
- source_word: אֶל
  choice: jusqu’à
  rationale: La préposition indique la direction vers le lieu nommé. Avec « s’avança », « jusqu’à » forme une expression française naturelle, tout en présentant le col comme le point atteint.
- source_word: מַעֲבַר
  choice: col
  rationale: Le nom désigne un lieu de passage ou de traversée. Dans la topographie militaire de Mikmas, « col » exprime de façon concise et naturelle le passage resserré.
- source_word: מִכְמָשׂ
  choice: Mikmas
  rationale: Translittération française moderne du nom de lieu hébreu, avec suppression du h final non prononcé et représentation simple de la consonne initiale.
