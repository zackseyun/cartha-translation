id: 1SA.13.9
reference: 1 Samuel 13:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: fr
  text: 'Alors Saül dit[b] : « Apportez-moi l’holocauste et les sacrifices de paix[a]. » Et il offrit l’holocauste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sacrifices de communion ». Le terme hébreu peut désigner des sacrifices associés à la paix, au bien-être ou à la communion partagée.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition signifie le plus naturellement que Saül offrit lui-même l’holocauste ; certains la comprennent plus indirectement : il le fit offrir.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Saül dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession en français sans ajouter de lien causal fort.
- source_word: הַגִּשׁוּ אֵלַי
  choice: Apportez-moi
  rationale: Le hiphil de נגשׁ signifie faire approcher ou présenter. Dans ce contexte, « apportez-moi » est naturel et conserve l’idée que les offrandes sont amenées auprès de Saül.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: עֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme cultuel établi et précis en français biblique.
- source_word: וְהַשְּׁלָמִים
  choice: et les sacrifices de paix
  rationale: שְׁלָמִים désigne des sacrifices liés à la paix, au bien-être et à la communion. « Sacrifices de paix » reste proche de l’hébreu et demeure intelligible.
- source_word: וַיַּעַל
  choice: Et il offrit
  rationale: Dans le contexte sacrificiel, עלה signifie offrir en sacrifice. Le sujet grammatical le plus naturel demeure Saül.
theological_decisions:
- issue: Sujet et portée de l’action dans la dernière proposition
  choice: Saül offrit lui-même l’holocauste
  alternative: Saül fit offrir ou présenter l’holocauste
  rationale: La lecture directe du verbe au singulier, dont Saül est le sujet antérieur, indique qu’il accomplit l’offrande. Le contexte de la réprimande qui suit appuie cette compréhension, tout en laissant signaler une lecture indirecte possible.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire cultuel traditionnel est conservé lorsqu’il demeure précis et largement reconnaissable ; les ambiguïtés lexicales et la possibilité d’une action indirecte sont indiquées en notes.
