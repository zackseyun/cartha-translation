  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: fr
  text: Dès qu’il eut fini d’offrir l’holocauste, Samuel arriva. Saül sortit à sa rencontre pour le bénir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le saluer ». Le verbe hébreu signifie littéralement « bénir », mais, dans le contexte d’une rencontre, il peut désigner une salutation formelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ
  choice: Au moment même où il finissait
  rationale: La construction narrative avec כְּ et l’infinitif situe l’arrivée de Samuel à l’achèvement immédiat de l’offrande. Cette formulation française rend la simultanéité serrée sans calque lourd.
- source_word: לְהַעֲלוֹת הָעֹלָה
  choice: d’offrir l’holocauste
  rationale: Le hiphil de עלה associé à עֹלָה désigne l’action d’offrir ce sacrifice; « holocauste » est le terme sacrificiel français consacré pour l’offrande entièrement brûlée.
- source_word: וְהִנֵּה שְׁמוּאֵל בָּא
  choice: Samuel arriva
  rationale: הִנֵּה donne vivacité et soudaineté à l’arrivée. En français moderne, la position immédiatement après « Au moment même » et le verbe « arriva » communiquent naturellement cet effet sans employer l’archaïsant « voici que ».
- source_word: וַיֵּצֵא שָׁאוּל לִקְרָאתוֹ
  choice: Saül sortit à sa rencontre
  rationale: La traduction conserve le mouvement vers l’extérieur exprimé par יצא et rend idiomatiquement לִקְרָאתוֹ.
- source_word: לְבָרֲכוֹ
  choice: pour le bénir
  rationale: ברך signifie littéralement « bénir », mais peut servir ici à désigner une salutation formelle. Le texte principal préserve le sens lexical, tandis que la note signale la valeur contextuelle possible.
theological_decisions: []
