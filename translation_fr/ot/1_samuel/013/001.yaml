  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: fr
  text: Saül avait un an lorsqu’il devint roi[a], et il régna deux ans sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu est ici difficile et probablement incomplet. Littéralement, il dit : « Saül avait un an lorsqu’il devint roi, et il régna deux ans sur Israël. » Certains témoins anciens et des propositions ultérieures rétablissent des nombres plus élevés, par exemple « trente ans » pour l’âge de Saül et « quarante-deux ans » pour la durée de son règne.'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: avait un an
  rationale: L’expression hébraïque signifie normalement « âgé d’un an ». Cette traduction idiomatique conserve le texte massorétique, malgré la difficulté historique manifeste, laquelle est signalée en note.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge au moment de l’accession au trône; cette formulation est naturelle en français dans une notice royale.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: et… deux ans
  rationale: Le nombre transmis par le texte massorétique est rendu directement, sans supplément conjectural.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le qal de מלך signifie couramment « régner » ou « être roi »; « régna » convient à la formule royale.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: « Régner sur » est la tournure française normale pour exprimer l’autorité royale.
theological_decisions:
- issue: Formule royale difficile ou déficiente dans le texte massorétique
  choice: Conserver dans le texte principal les nombres transmis par le texte massorétique, sans les compléter par conjecture
  alternative: Introduire des nombres proposés par certains témoins anciens ou par reconstruction, par exemple trente ans pour l’âge de Saül et quarante-deux ans pour la durée de son règne
  rationale: L’hébreu transmis est notoirement difficile et paraît textuellement déficient. Puisque la source donnée est le texte massorétique de la WLC, le texte principal le traduit tel quel; la note expose clairement le problème et les principales propositions sans trancher une incertitude que les témoins ne permettent pas de résoudre avec assurance.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation idiomatique évite un calque pesant tout en préservant dans le texte principal la difficulté réelle du texte massorétique; la note assure la transparence textuelle.
