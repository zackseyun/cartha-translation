  text: וַ/יַּ֣ךְ יוֹנָתָ֗ן אֵ֣ת נְצִ֤יב פְּלִשְׁתִּים֙ אֲשֶׁ֣ר בְּ/גֶ֔בַע וַֽ/יִּשְׁמְע֖וּ פְּלִשְׁתִּ֑ים וְ/שָׁאוּל֩ תָּקַ֨ע בַּ/שּׁוֹפָ֤ר בְּ/כָל הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר יִשְׁמְע֖וּ הָ/עִבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: fr
  text: 'Jonathan frappa le poste[a] des Philistins qui se trouvait à Guéba, et les Philistins l’apprirent. Alors Saül sonna du cor[b] dans tout le pays, en disant : « Que les Hébreux l’entendent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le gouverneur philistin ». Le mot hébreu peut désigner un représentant officiel ou un poste militaire établi.
    reason: lexical_alternative
  - marker: b
    text: Le cor, ou shofar, était fait d’une corne animale, traditionnellement d’une corne de bélier.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe נכה signifie couramment « frapper » et peut, en contexte militaire, impliquer une attaque décisive sans préciser à lui seul si tous les occupants furent tués ou si le poste fut détruit.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: le poste des Philistins
  rationale: נְצִיב peut désigner soit un représentant officiel, soit une position ou garnison établie. « Poste » convient au contexte militaire tout en évitant de présenter comme certaine l’une des deux analyses.
- source_word: בְּגֶבַע
  choice: à Guéba
  rationale: Guéba est le nom du lieu; la préposition française « à » est naturelle avec une localité.
- source_word: וַיִּשְׁמְעוּ פְלִשְׁתִּים
  choice: les Philistins l’apprirent
  rationale: L’hébreu dit littéralement qu’ils « entendirent »; en français, « l’apprirent » exprime naturellement qu’ils reçurent la nouvelle de l’événement.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: sonna du cor
  rationale: Le שׁוֹפָר est un instrument fait d’une corne animale. « Cor » conserve cette réalité culturelle sans préciser que la corne était nécessairement celle d’un bélier.
- source_word: בְּכָל הָאָרֶץ
  choice: dans tout le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire concerné, et non la terre entière.
- source_word: לֵאמֹר
  choice: pour proclamer
  rationale: L’infinitif introduit ici le contenu diffusé publiquement après la sonnerie du cor; « pour proclamer » rend cette fonction de façon idiomatique.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: Que les Hébreux l’entendent !
  rationale: L’imparfait hébreu a ici une valeur jussive. « Hébreux » maintient le terme ethnique du texte au lieu de le remplacer par « Israélites ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’ambiguïté de נְצִיב au moyen d’une note et évite de surinterpréter l’issue précise de l’action de Jonathan.
