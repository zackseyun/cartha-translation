  rationale: La révision rétablit « Parce que », nécessaire pour rendre le כִּי causal qui ouvre l’explication de Saül. Elle remplace aussi « loin de moi » par « d’auprès de moi », plus proche de la relation spatiale et personnelle indiquée par l’hébreu. La virgule finale est conservée, car la phrase se poursuit au verset suivant.
