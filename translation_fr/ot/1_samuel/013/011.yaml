base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: fr
  text: 'Alors Samuel dit : « Qu’as-tu fait ? » Saül répondit : « Parce que j’ai vu que le peuple se dispersait d’auprès de moi, que tu n’étais pas arrivé au temps fixé[b] et que les Philistins se rassemblaient[a] à Mikmas, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient rassemblés ».
    reason: Le participe hébreu peut décrire soit un rassemblement en cours, soit l’état qui en résulte.
  - marker: b
    text: 'Littéralement : « au temps fixé des jours » ; il s’agit probablement de la période convenue auparavant.'
    reason: La formulation hébraïque est inhabituelle et renvoie vraisemblablement au délai mentionné dans le contexte précédent.
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Qu’as-tu fait ?
  rationale: Cette formulation naturelle conserve la vigueur du reproche de Samuel et la portée présente de l’acte accompli.
- source_word: כִּי רָאִיתִי
  choice: J’ai vu que
  rationale: Le premier כִּי introduit l’explication causale de Saül, rendue naturellement par l’enchaînement après « répondit »; רָאִיתִי désigne ici son constat de la situation.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: le peuple se dispersait loin de moi
  rationale: Le verbe décrit la désagrégation et la dispersion des troupes; « loin de moi » maintient Saül comme le point dont elles s’éloignent sans ajouter explicitement l’idée d’abandon.
- source_word: לֹא בָאתָ
  choice: tu n’étais pas arrivé
  rationale: Le plus-que-parfait situe l’absence attendue de Samuel avant le geste que Saül cherche à expliquer.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: au temps fixé
  rationale: Formulation française idiomatique pour le moment convenu, tout en signalant en note la tournure hébraïque plus développée.
- source_word: נֶאֱסָפִים
  choice: se rassemblaient
  rationale: Le participe nifal présente un rassemblement en cours ou une situation en développement, ce que rend l’imparfait.
- source_word: מִכְמָשׂ
  choice: Mikmas
  rationale: Transcription française courante du nom de lieu hébreu.
theological_decisions: []
