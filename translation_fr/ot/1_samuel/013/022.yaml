base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: fr
  text: Lorsque vint le jour du combat, aucun des hommes qui étaient avec Saül et Jonathan n’avait d’épée ni de lance[a] ; seuls Saül et son fils Jonathan en avaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le jour du combat, il ne se trouva ni épée ni lance dans la main de tout le peuple qui était avec Saül et Jonathan ». L’expression hébraïque signifie qu’aucun membre des troupes ne possédait de telles armes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ainsi
  rationale: La formule introduit la situation qui résulte du contexte précédent. « Ainsi » conserve ce lien narratif de manière naturelle en français.
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: le jour du combat
  rationale: La préposition בְּ marque ici le temps. « Le jour du combat » garde l’expression concrète de l’hébreu dans un français courant.
- source_word: לֹא נִמְצָא
  choice: on ne trouva
  rationale: Le nifal de מצא exprime qu’une chose ne se trouvait pas ou n’était pas disponible. La tournure impersonnelle française reste proche de la construction hébraïque sans suggérer une recherche particulière.
- source_word: חֶרֶב וַחֲנִית
  choice: ni épée ni lance
  rationale: Sous la négation, la coordination hébraïque a une portée distributive. « Ni… ni… » rend clairement qu’aucune arme de l’un ou l’autre type n’était disponible.
- source_word: בְּיַד כָּל הָעָם
  choice: entre les mains d’aucun des hommes
  rationale: Littéralement « dans la main de tout le peuple ». Sous la négation, כָּל signifie qu’aucun membre du groupe ne possédait ces armes. « Entre les mains » conserve l’image hébraïque de la possession, tandis que « des hommes » désigne naturellement les combattants dans ce contexte.
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: qui étaient avec Saül et Jonathan
  rationale: אֶת exprime ici l’association. La proposition hébraïque est elliptique ; l’ajout de « étaient » restitue son sens en français naturel.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: seuls Saül et son fils Jonathan en avaient
  rationale: Le verbe féminin singulier reprend collectivement l’équipement mentionné, et לְ indique qu’il était à leur disposition. « Seuls » fait ressortir le contraste implicite sans changer l’identité des deux détenteurs.
