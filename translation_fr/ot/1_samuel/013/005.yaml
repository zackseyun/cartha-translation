source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: fr
  text: Les Philistins se rassemblèrent pour combattre Israël. Ils avaient trente mille chars[a], six mille cavaliers et des troupes aussi nombreuses que le sable au bord de la mer. Ils montèrent et établirent leur camp à Mikmas, à l’est de Beth-Aven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « trente mille chars ». Certains interprètes et témoins anciens ont proposé un nombre inférieur, par exemple « trois mille », car trente mille paraît exceptionnellement élevé dans ce contexte. Le texte principal suit néanmoins l’hébreu massorétique.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: se rassemblèrent
  rationale: Le nifal de אסף désigne ici le rassemblement de forces en vue d’un combat. « Se rassemblèrent » est naturel et conserve cette idée sans ajouter de précision absente de l’hébreu.
- source_word: לְהִלָּחֵם עִם
  choice: pour combattre Israël
  rationale: Dans ce contexte militaire, לחם avec עִם exprime un affrontement hostile. En français, « combattre Israël » rend clairement et sobrement ce sens.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: trente mille chars
  rationale: La traduction suit directement le texte massorétique, malgré la difficulté historique souvent relevée concernant ce nombre. Celle-ci est signalée en note plutôt que corrigée dans le texte.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: six mille cavaliers
  rationale: פָּרָשִׁים désigne des combattants montés. « Cavaliers » est précis, courant et adapté au contexte militaire.
- source_word: וְעָם
  choice: et des troupes
  rationale: Bien que עָם signifie littéralement « peuple », il désigne ici les forces combattantes. « Troupes » transmet ce sens contextuel sans surinterpréter leur organisation.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: aussi nombreuses que le sable au bord de la mer
  rationale: Cette formulation conserve l’image hébraïque d’une multitude immense dans un français actuel et fluide.
- source_word: וַיַּעֲלוּ
  choice: Ils montèrent
  rationale: עלה exprime un mouvement ascendant, fréquent dans les récits géographiques et militaires. « Montèrent » préserve cette indication sans la remplacer par l’interprétation plus générale « avancèrent ».
- source_word: וַיַּחֲנוּ
  choice: établirent leur camp
  rationale: Cette expression française naturelle rend le verbe חנה, « camper », tout en convenant au registre narratif.
- source_word: בְמִכְמָשׂ
  choice: à Mikmas
  rationale: Le nom de lieu est translittéré sous une forme française claire, et la préposition « à » convient au lieu d’un campement.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: à l’est de Beth-Aven
  rationale: קִדְמַת indique ici une position orientale par rapport à Beth-Aven. Cette traduction est géographiquement claire et idiomatique.
theological_decisions: []
