  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: fr
  text: Les hommes d’Israël virent qu’ils étaient en détresse, car le peuple était sous une forte pression; le peuple se cacha dans les grottes, dans les broussailles épineuses[a], parmi les rochers, dans les souterrains[b] et dans les fosses[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les fourrés » ou « parmi les buissons épineux »; le terme hébreu est rare.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les chambres souterraines », « dans les trous » ou « dans les refuges fortifiés »; le terme hébreu est incertain.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans les citernes »; le mot hébreu peut aussi désigner des puits ou d’autres excavations.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le singulier collectif אִישׁ, associé au verbe pluriel רָאוּ, désigne collectivement ou distributivement les hommes d’Israël; cette formulation conserve la valeur masculine du texte.
- source_word: רָאוּ
  choice: virent
  rationale: Le sens perceptif premier est conservé; le contexte fait naturellement comprendre qu’il s’agit aussi d’une prise de conscience.
- source_word: כִּי צַר לוֹ
  choice: qu’ils étaient en détresse
  rationale: Le français met au pluriel le pronom rattaché au sujet collectif, tout en conservant l’idée de détresse exprimée par la tournure hébraïque comprimée.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: car le peuple était acculé
  rationale: Le niphal de נגשׂ exprime ici la pression subie. « Acculé » est naturel dans ce contexte militaire et rend la situation critique sans préciser indûment la nature de l’oppression.
- source_word: וַיִּתְחַבְּאוּ
  choice: se cacha
  rationale: La forme pronominale française rend directement la valeur réfléchie du hitpael; le singulier s’accorde avec le collectif « le peuple ».
- source_word: בַּמְּעָרוֹת
  choice: dans les grottes
  rationale: Équivalent français direct et courant de מְעָרוֹת.
- source_word: וּבַחֲוָחִים
  choice: dans les broussailles épineuses
  rationale: Le terme rare paraît désigner des broussailles ou buissons épineux. La traduction retient ce sens probable tout en signalant l’incertitude en note.
- source_word: וּבַסְּלָעִים
  choice: parmi les rochers
  rationale: La préposition « parmi » donne une description naturelle d’un lieu où l’on se dissimule, tandis que « rochers » rend largement סְלָעִים sans surdéterminer le relief.
- source_word: וּבַצְּרִחִים
  choice: dans les souterrains
  rationale: Ce mot rare et incertain paraît désigner des espaces excavés ou souterrains servant de cachettes. « Souterrains » reste concret sans trancher entre chambres, trous, caves ou refuges fortifiés.
- source_word: וּבַבֹּרוֹת
  choice: dans les fosses
  rationale: « Fosses » conserve le sens large de בּוֹרוֹת; selon le contexte, le terme peut aussi désigner des citernes ou des puits.
theological_decisions: []
