revisions:
- from: Les hommes d’Israël virent qu’ils étaient en détresse, car le peuple était acculé. Alors le peuple se cacha dans les grottes, dans les broussailles épineuses[a], parmi les rochers, dans les souterrains[b] et dans les fosses[c].
  to: Les hommes d’Israël virent qu’ils étaient en détresse, car le peuple était sous une forte pression; le peuple se cacha dans les grottes, dans les broussailles épineuses[a], parmi les rochers, dans les souterrains[b] et dans les fosses[c].
  rationale: La révision limite l’interprétation de la pression subie par le peuple et rend la coordination narrative sans ajout temporel. Les termes rares et leurs notes sont conservés, notamment pour צְרִחִים, dont le sens reste disputé.
