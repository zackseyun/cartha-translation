  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: fr
  text: Saül choisit pour lui-même trois mille hommes parmi les Israélites. Deux mille étaient avec lui à Mikmas et dans la région montagneuse de Béthel[a], et mille étaient avec Jonathan à Guibéa de Benjamin. Quant au reste du peuple, il le renvoya, chacun à sa tente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la montagne de Béthel ». L’expression hébraïque peut désigner soit la région montagneuse autour de Béthel, soit une hauteur précise associée à Béthel.
    reason: lexical_alternative
  - marker: b
    text: L’expression « chacun à sa tente » est une tournure courante qui signifie que chacun retourne chez lui.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ שָׁאוּל
  choice: Saül choisit pour lui-même
  rationale: « Choisir » rend directement בחר, et « pour lui-même » conserve le pronom datif לוֹ, qui indique que Saül sélectionne personnellement les hommes qu’il garde auprès de lui.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: trois mille hommes parmi les Israélites
  rationale: Le nom « hommes » est implicite dans le dénombrement et rendu explicite pour un français naturel. « Parmi les Israélites » exprime clairement le groupe au sein duquel ils sont choisis.
- source_word: בְּמִכְמָשׂ
  choice: à Mikmas
  rationale: La préposition locative ב est naturellement rendue par « à » pour le lieu où les troupes stationnent. « Mikmas » suit une forme française usuelle du toponyme.
- source_word: וּבְהַר בֵּית אֵל
  choice: et dans la région montagneuse de Béthel
  rationale: הַר peut désigner une montagne précise ou une zone montagneuse. Le rendu régional convient au contexte géographique et militaire, tout en signalant l’autre lecture en note.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: à Guibéa de Benjamin
  rationale: La vocalisation massorétique soutient « Guibéa ». Le complément « de Benjamin » distingue ce lieu par son territoire d’appartenance.
- source_word: וְיֶתֶר הָעָם
  choice: Quant au reste du peuple
  rationale: « Le reste du peuple » reste proche du texte hébreu sans remplacer הָעָם par le terme plus interprétatif « armée ». « Quant à » assure une transition naturelle vers le groupe renvoyé.
- source_word: שִׁלַּח
  choice: il le renvoya
  rationale: Dans ce contexte, le verbe signifie que Saül congédie les autres hommes plutôt qu’il ne les envoie accomplir une mission.
- source_word: אִישׁ לְאֹהָלָיו
  choice: chacun à sa tente
  rationale: Ce rendu conserve l’image concrète de la tente et exprime naturellement la distribution individuelle indiquée par אִישׁ.
