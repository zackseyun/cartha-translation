  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: fr
  text: Tous les Israélites descendirent chez les Philistins, chacun pour faire aiguiser son soc, sa houe, sa hache et sa serpe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « son coutre » ou un autre instrument de labour ; le terme hébreu est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: descendaient
  rationale: Le verbe ירד exprime un mouvement vers le bas. L’imparfait français rend ici naturellement l’action répétée ou habituelle décrite par le contexte narratif.
- source_word: כָל יִשְׂרָאֵל
  choice: tous les Israélites
  rationale: Cette formulation française naturelle conserve la portée collective de l’expression hébraïque.
- source_word: הַפְּלִשְׁתִּים
  choice: chez les Philistins
  rationale: L’hébreu désigne le peuple, non explicitement son territoire ni ses forgerons. « Chez » exprime idiomatiquement le déplacement auprès d’eux sans ajouter d’information.
- source_word: לִלְטוֹשׁ
  choice: pour faire aiguiser
  rationale: לטש désigne ici l’action de donner du tranchant aux outils. Le contexte précédent, qui précise l’absence de forgerons en Israël, favorise le causatif français idiomatique « faire aiguiser ».
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif après le sujet collectif est rendu clairement et naturellement par « chacun ».
- source_word: מַחֲרַשְׁתּוֹ
  choice: son soc
  rationale: Le terme désigne vraisemblablement une pièce ou un instrument de labour; « soc » convient à un élément métallique que l’on aiguise.
- source_word: אֵתוֹ
  choice: sa houe
  rationale: אֵת désigne un outil servant à creuser ou à travailler la terre. « Houe » est courant et compréhensible en français moderne.
- source_word: קַרְדֻּמּוֹ
  choice: sa hache
  rationale: Le nom désigne normalement un outil tranchant du type hache; « hache » en est l’équivalent français direct.
- source_word: מַחֲרֵשָׁתוֹ
  choice: sa serpe
  rationale: L’identification précise de ce dernier outil est incertaine. « Serpe » fournit ici un outil agricole tranchant distinct du premier instrument de labour, tout en signalant l’incertitude en note.
