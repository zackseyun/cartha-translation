  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: fr
  text: Un groupe[a] prit la direction de la route de Beth-Horôn, et un autre groupe prit la direction de la frontière qui surplombe la vallée de Tseboïm[b], vers le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une tête »; il s’agit ici probablement d’un groupe, d’une division ou d’un détachement.
    reason: lexical_alternative
  - marker: b
    text: « Tseboïm » est probablement un nom de lieu; le terme hébreu pourrait être apparenté au mot désignant les hyènes.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: un groupe / un autre groupe
  rationale: Dans ce contexte militaire, רֹאשׁ (« tête ») désigne vraisemblablement chacune des unités de pillards mentionnées au verset précédent. « Groupe » est naturel en français et n'impose pas une taille militaire trop précise.
- source_word: יִפְנֶה
  choice: prit la direction de
  rationale: Le verbe פנה exprime le fait de se tourner dans une direction. Dans un récit de déplacement militaire, « prendre la direction de » rend naturellement cette idée.
- source_word: דֶּרֶךְ
  choice: la route
  rationale: דֶּרֶךְ désigne ici une voie ou un itinéraire concret.
- source_word: בֵּית חֹרוֹן
  choice: Beth-Horôn
  rationale: Nom de lieu translittéré selon un usage français clair, avec l'accent circonflexe signalant la voyelle longue finale.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: גְּבוּל peut désigner une limite territoriale ou une frontière. « Frontière » convient à cette indication topographique.
- source_word: הַנִּשְׁקָף
  choice: qui surplombe
  rationale: Le participe nifal de שׁקף décrit ce qui donne sur un lieu depuis une position élevée. « Surplombe » exprime cette relation topographique sans lourdeur.
- source_word: גֵּי הַצְּבֹעִים
  choice: la vallée de Tseboïm
  rationale: L'expression fonctionne vraisemblablement comme un nom de lieu. La translittération préserve cette fonction, tandis qu'une note indique le lien possible avec les hyènes.
- source_word: הַמִּדְבָּרָה
  choice: vers le désert
  rationale: Le suffixe directionnel -ָה indique un mouvement en direction du désert.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de la structure hébraïque est conservée, avec « un autre groupe » pour rendre clairement le second אֶחָד. Les désignations militaires trop techniques sont évitées, car le texte ne précise pas la taille exacte des unités.
