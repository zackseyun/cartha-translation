source:
  edition: WLC
  text: וָ/אֹמַ֗ר עַ֠תָּה יֵרְד֨וּ פְלִשְׁתִּ֤ים אֵלַ/י֙ הַ/גִּלְגָּ֔ל וּ/פְנֵ֥י יְהוָ֖ה לֹ֣א חִלִּ֑יתִי וָֽ/אֶתְאַפַּ֔ק וָ/אַעֲלֶ֖ה הָ/עֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: fr
  text: 'Je me suis donc dit : « Maintenant, les Philistins vont descendre contre moi à Guilgal, et je n’ai pas imploré la faveur de Yahweh[a]. » Alors je me suis fait violence[b] et j’ai offert l’holocauste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je n’ai pas imploré le visage de Yahweh »; cette expression signifie chercher ou implorer sa faveur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je me suis maîtrisé ». Le verbe hébreu peut désigner le fait de se contenir ou de se contraindre; ici, Saül affirme qu’il s’est forcé à agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Je me suis donc dit
  rationale: Le waw consécutif fait progresser l’explication de Saül, tandis que « donc » rend naturellement la logique de son raisonnement en français.
- source_word: עַתָּה יֵרְדוּ פְלִשְׁתִּים אֵלַי
  choice: Maintenant, les Philistins vont descendre contre moi
  rationale: « Descendre » conserve le mouvement exprimé par ירד, et « contre moi » explicite la valeur hostile de אֵלַי dans ce contexte militaire.
- source_word: הַגִּלְגָּל
  choice: à Guilgal
  rationale: Transcription française usuelle du nom de lieu; la préposition situe l’affrontement redouté par Saül.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: et je n’ai pas imploré la faveur de Yahweh
  rationale: L’expression idiomatique, littéralement liée au « visage » de Yahweh, signifie chercher ou implorer sa faveur. Cette formulation reste claire tout en conservant l’idée de supplication.
- source_word: וָאֶתְאַפַּק
  choice: Alors je me suis fait violence
  rationale: Le hitpael de אפק peut évoquer le fait de se maîtriser ou de se contraindre. Dans l’explication de Saül, « se faire violence » exprime qu’il prétend avoir agi malgré sa réticence, sans effacer l’ambiguïté lexicale signalée en note.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: et j’ai offert l’holocauste
  rationale: עלה avec עֹלָה appartient au vocabulaire sacrificiel. « Offrir l’holocauste » est l’expression française naturelle et consacrée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie le nom divin יהוה. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- issue: Sens de l’expression וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: je n’ai pas imploré la faveur de Yahweh
  alternative: je n’ai pas imploré la face de Yahweh
  rationale: Le sens idiomatique est la recherche de la faveur divine. La traduction évite un calque obscur sans transformer la phrase en déclaration doctrinale plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve l’urgence de Saül. « Se faire violence » rend sa tentative de justification tout en laissant une note préserver l’ambivalence du verbe hébreu.
