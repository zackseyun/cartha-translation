id: 1SA.13.8
reference: 1 Samuel 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: fr
  text: Il attendit sept jours, jusqu’au moment fixé par Samuel[a]. Mais Samuel n’arriva pas à Guilgal, et le peuple se dispersait en s’éloignant de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition relative est très condensée en hébreu; elle implique que Samuel avait fixé ce moment.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que le peuple s’éloignait de Saül.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: Il attendit
  rationale: Dans ce contexte, le verbe désigne l’attente pendant une durée déterminée, et non l’espérance au sens abstrait.
- source_word: שִׁבְעַת יָמִים
  choice: sept jours
  rationale: Expression directe de la durée de l’attente de Saül.
- source_word: לַמּוֹעֵד אֲשֶׁר שְׁמוּאֵל
  choice: jusqu’au moment fixé par Samuel
  rationale: Le contexte donne à לַמּוֹעֵד une valeur temporelle de terme attendu. La proposition relative hébraïque est elliptique; « fixé » explicite sobrement l’idée sous-entendue sans préciser davantage la manière dont Samuel avait déterminé ce moment.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: Mais Samuel n’arriva pas à Guilgal
  rationale: « Mais » exprime naturellement le contraste contextuel porté par la conjonction; « Guilgal » est la forme française usuelle du nom de lieu.
- source_word: וַיָּפֶץ הָעָם מֵעָלָיו
  choice: et le peuple se dispersait en s’éloignant de lui
  rationale: L’imparfait présente la dispersion comme un processus en cours. « En s’éloignant de lui » rend explicitement la direction exprimée par מֵעָלָיו tout en conservant le pronom hébreu.
theological_decisions:
- issue: Identité du référent de « lui » dans מֵעָלָיו
  choice: Maintien du pronom dans le texte, avec identification de Saül en note
  alternative: Remplacer directement « lui » par « Saül »
  rationale: Le pronom respecte la formulation hébraïque et son antécédent est clair dans le récit; la note prévient néanmoins toute hésitation sans alourdir le verset.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les événements principaux, tandis que l’imparfait rend la dispersion progressive du peuple. L’ellipse de l’hébreu est explicitée au minimum dans le texte et signalée en note.
