  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: fr
  text: Une troupe de pillards[a] sortit du camp des Philistins en trois groupes[b]. L’un des groupes prit la route d’Ophra, vers le pays de Shoual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « le destructeur » ou « la force de destruction ». Dans ce contexte militaire, il s’agit d’une troupe de pillards.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement « trois têtes », puis « une tête » : une expression désignant des divisions ou des détachements militaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: une troupe de pillards
  rationale: Le nom singulier avec article a ici une valeur collective et désigne une force philistine chargée de ravager le territoire. « Une troupe de pillards » rend naturellement cette valeur dans le contexte militaire.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: se divisa en trois groupes
  rationale: Littéralement « trois têtes » ; dans ce contexte, l’expression décrit les trois divisions de la troupe. La formulation française explicite le rapport syntaxique et le mouvement militaire sans conserver un calque obscur.
- source_word: הָרֹאשׁ אֶחָד
  choice: un groupe
  rationale: La reprise au singulier de רֹאשׁ renvoie à l’une des trois divisions mentionnées juste avant. « Un groupe » maintient cette cohérence.
- source_word: יִפְנֶה
  choice: prit la direction de
  rationale: Le verbe signifie se tourner ou s’orienter. En récit militaire, « prit la direction de » exprime idiomatiquement l’itinéraire suivi.
- source_word: דֶּרֶךְ עָפְרָה
  choice: la route d’Ofra
  rationale: דֶּרֶךְ désigne une route ou un chemin ; le complément toponymique indique ici la route menant vers Ofra.
- source_word: אֶרֶץ שׁוּעָל
  choice: le pays de Shoual
  rationale: אֶרֶץ peut désigner un pays, une région ou un territoire. « Le pays de Shoual » convient à cette désignation régionale.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française courante du nom de ce peuple.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Translittération française moderne du nom de lieu.
- source_word: שׁוּעָל
  choice: Shoual
  rationale: Translittération adaptée aux conventions phonétiques du français.
