  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: fr
  text: Mais maintenant, ta royauté ne se maintiendra pas[a]. Yahweh s’est choisi un homme selon son cœur[b], et Yahweh l’a établi chef de son peuple[c], parce que tu n’as pas gardé ce que Yahweh t’avait commandé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne tiendra pas » ou « ne subsistera pas ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon son cœur ». Dans le contexte, le possessif se comprend comme renvoyant à Yahweh.'
    reason: ambiguity_clarification
  - marker: c
    text: 'Le possessif « son » désigne Yahweh : il s’agit du peuple de Yahweh.'
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Dans le contexte, la formule introduit un contraste marqué entre ce qui aurait pu arriver à Saul et le jugement qui vient d’être prononcé.
- source_word: מַמְלַכְתְּךָ
  choice: ta royauté
  rationale: Le contexte vise moins le territoire gouverné que la continuité du pouvoir royal de Saul et de sa maison. « Royauté » exprime cette portée sans ajouter explicitement « dynastie ».
- source_word: לֹא תָקוּם
  choice: ne se maintiendra pas
  rationale: Le verbe signifie littéralement « ne se lèvera/tiendra pas »; appliqué à la royauté, il indique qu’elle ne restera pas établie.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: Yahweh s’est cherché
  rationale: 'Cette formulation rend l’action accomplie du parfait et conserve la valeur bénéficiaire ou réflexive de לוֹ : Yahweh cherche cet homme pour lui-même.'
- source_word: אִישׁ כִּלְבָבוֹ
  choice: un homme selon son cœur
  rationale: La traduction reste proche de l’expression hébraïque et préserve sa densité sans l’expliciter comme une conformité exhaustive à la volonté divine.
- source_word: וַיְצַוֵּהוּ יְהוָה
  choice: Yahweh l’a établi
  rationale: Avec לְנָגִיד, le verbe porte ici le sens de mandater ou de désigner pour une fonction, plutôt que celui de donner un ordre à la personne.
- source_word: לְנָגִיד
  choice: chef
  rationale: נָגִיד désigne une personne placée à la tête du peuple. « Chef » est actuel, sobre et n’impose ni le titre de roi ni une nuance messianique ultérieure.
- source_word: עַל עַמּוֹ
  choice: de son peuple
  rationale: En français, « chef de son peuple » rend naturellement l’autorité exprimée par עַל. Le possessif renvoie à Yahweh.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: tu n’as pas gardé ce que Yahweh t’avait commandé
  rationale: « Garder » conserve le lexème de l’observance fidèle, tandis que le plus-que-parfait situe naturellement le commandement avant le manquement reproché.
theological_decisions:
- issue: Référent du suffixe dans כִּלְבָבוֹ
  choice: '« son » renvoie à Yahweh : « un homme selon son cœur »'
  alternative: Comprendre le suffixe en rapport avec l’homme recherché, ou expliciter « selon le cœur de Yahweh ».
  rationale: La syntaxe et le contexte favorisent Yahweh comme référent. La formulation française conserve néanmoins l’expression concise de l’hébreu et évite d’ajouter une interprétation telle que « qui accomplira toute sa volonté ».
- issue: Portée de נָגִיד
  choice: chef
  alternative: dirigeant, prince
  rationale: Le terme décrit ici une autorité conférée sur le peuple, sans qu’il soit nécessaire de lui donner une valeur dynastique, technique ou messianique supplémentaire.
- issue: Temporalité de la désignation du successeur
  choice: 'parfaits rendus comme actions accomplies : « s’est cherché » et « l’a établi »'
  alternative: Employer une formulation prospective, comme « se cherchera » ou « établira ».
  rationale: Le texte hébreu présente les actions comme accomplies du point de vue de l’annonce prophétique, même si l’identité et l’entrée en fonction du successeur ne sont pas encore racontées.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Saul. Le nom divin est translittéré « Yahweh » conformément au projet. La formulation conserve les répétitions du nom divin et la tension de l’expression « selon son cœur ».
