base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: fr
  text: Saül, Jonathan, son fils, et le peuple qui se trouvait avec eux[a] demeuraient à Guéba de Benjamin[b], tandis que les Philistins avaient établi leur camp à Mikmas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le peuple qui se trouvait avec eux »; il s’agit probablement de ceux qui étaient encore restés auprès de Saül et de Jonathan après la dispersion des autres.'
    reason: lexical_alternative
  - marker: b
    text: Le nom hébreu est Guéba, et non Guibéa; dans ce contexte, il s’agit de deux localités distinctes aux noms apparentés.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: se tenaient
  rationale: Dans ce récit militaire, le participe de ישׁב indique que Saül et les siens demeuraient à cet endroit. « Se tenaient » exprime naturellement leur présence sur place sans évoquer la simple posture assise.
- source_word: הַנִּמְצָא עִמָּם
  choice: les hommes qui se trouvaient avec eux
  rationale: Le participe niphal de מצא signifie littéralement « qui se trouvait avec eux ». Le pluriel français « les hommes » rend naturellement le collectif hébreu העם dans ce contexte militaire; la note signale qu’il s’agit vraisemblablement de ceux qui étaient encore restés auprès de Saül et Jonathan.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: à Guéba de Benjamin
  rationale: Le texte massorétique désigne Guéba, localité du territoire de Benjamin, et non Guibéa. La préposition « à » convient en français avec un nom de ville.
- source_word: חָנוּ
  choice: avaient établi leur camp
  rationale: חנה est le verbe usuel pour camper, notamment dans un cadre militaire. Le plus-que-parfait marque naturellement que le camp philistin était déjà établi au moment décrit.
- source_word: בְמִכְמָשׂ
  choice: à Mikmas
  rationale: Le toponyme est translittéré « Mikmas »; « à » est idiomatique en français pour situer un camp près d’une localité.
- source_word: וְ
  choice: Saül… tandis que
  rationale: La première conjonction assure la continuité narrative sans nécessiter l’ajout de « Or » ou « Maintenant ». Devant la seconde proposition, « tandis que » rend clairement le contraste entre les positions des deux camps.
