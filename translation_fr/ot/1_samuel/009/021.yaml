  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: fr
  text: 'Saül répondit : « Ne suis-je pas un Benjaminite, issu de l’une des plus petites tribus d’Israël ? Mon clan n’est-il pas le plus petit de tous les clans de la tribu de Benjamin ? Pourquoi donc m’as-tu parlé ainsi[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi donc m’as-tu tenu de tels propos ? »'
    reason: La locution כַּדָּבָר הַזֶּה peut renvoyer au contenu précis des paroles plutôt qu’à leur seule manière.
lexical_decisions:
- source_word: וַיַּעַן שָׁאוּל וַיֹּאמֶר
  choice: Saül répondit
  rationale: La formule hébraïque « répondit et dit » est rendue naturellement en français par « répondit », sans perte de fonction narrative.
- source_word: הֲלוֹא בֶן־יְמִינִי אָנֹכִי
  choice: Ne suis-je pas un Benjaminite
  rationale: La tournure conserve la question rhétorique attendant l’assentiment et le gentilé indiquant l’appartenance à Benjamin.
- source_word: מִקְּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: issu de la plus petite des tribus d’Israël
  rationale: « La plus petite » préserve l’idée de petitesse ou d’insignifiance, tandis que « issu de » exprime naturellement l’appartenance marquée par מִן.
- source_word: וּמִשְׁפַּחְתִּי
  choice: mon clan
  rationale: Dans ce cadre tribal, מִשְׁפָּחָה désigne un groupe de parenté plus large que la famille nucléaire et inférieur à la tribu.
- source_word: הַצְּעִרָה
  choice: le moins important
  rationale: L’expression communique ici vraisemblablement un rang ou un statut modeste plutôt que la seule taille numérique.
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: de tous les clans de la tribu de Benjamin
  rationale: Le pluriel formel de « tribus » est compris contextuellement comme renvoyant aux subdivisions de Benjamin; le singulier français évite de suggérer plusieurs tribus benjaminites.
- source_word: וְלָמָּה
  choice: Pourquoi donc
  rationale: « Donc » restitue le lien logique entre l’humble statut revendiqué par Saül et sa question finale.
- source_word: דִּבַּרְתָּ אֵלַי כַּדָּבָר הַזֶּה
  choice: m’as-tu parlé ainsi
  rationale: Cette formulation française naturelle peut viser à la fois la manière et le contenu des paroles de Samuel; une traduction plus littérale est signalée en note.
