  to: 'Saül répondit : « Ne suis-je pas un Benjaminite, issu de l’une des plus petites tribus d’Israël ? Mon clan n’est-il pas le plus petit de tous les clans de la tribu de Benjamin ? Pourquoi donc m’as-tu parlé ainsi[a] ? »'
