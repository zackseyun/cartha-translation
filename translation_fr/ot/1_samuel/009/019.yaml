base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: fr
  text: 'Samuel répondit à Saül : « Je suis le voyant[a]. Monte devant moi au haut lieu. Vous mangerez[b] avec moi aujourd’hui. Demain matin, je te renverrai, et je te dirai tout ce qui est dans ton cœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prophète ». L’hébreu emploie l’ancien terme « voyant », que 1 Samuel 9.9 présente comme une appellation antérieure du prophète.
    reason: alternative_reading
  - marker: b
    text: 'Le verbe hébreu est au pluriel : Samuel inclut vraisemblablement le serviteur de Saül avec Saül lui-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  choice: le voyant
  rationale: Le terme désigne littéralement « celui qui voit » et constitue ici l’ancienne appellation du prophète, comme l’explique 1 Samuel 9.9. « Voyant » préserve cette distinction historique.
- source_word: הַבָּמָה
  choice: le haut lieu
  rationale: Cette expression désigne un lieu de culte, souvent situé sur une hauteur. « Haut lieu » conserve l’image hébraïque et le vocabulaire biblique courant.
- source_word: עֲלֵה לְפָנַי
  choice: Monte devant moi
  rationale: Cette formulation conserve à la fois le mouvement ascendant et le fait que Saül doit précéder Samuel, sans préciser davantage la disposition spatiale.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: Vous mangerez avec moi aujourd’hui
  rationale: Le verbe est à la deuxième personne du masculin pluriel et inclut vraisemblablement Saül et son serviteur. Le futur français rend naturellement l’annonce ou l’invitation dans ce contexte.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: je te laisserai repartir
  rationale: Le verbe signifie « envoyer » ou « laisser partir ». Dans ce contexte d’hospitalité, cette formulation naturelle évite la nuance de rejet que pourrait suggérer « je te renverrai ».
- source_word: בַבֹּקֶר
  choice: Demain matin
  rationale: L’hébreu dit littéralement « le matin »; après « aujourd’hui », le français naturel précise qu’il s’agit du lendemain matin.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: tout ce qui est dans ton cœur
  rationale: Cette traduction conserve l’expression anthropologique hébraïque, qui englobe pensées, préoccupations et intentions, sans la réduire à une seule dimension.
- source_word: אַגִּיד לָךְ
  choice: je te révélerai
  rationale: Le hiphil de נגד signifie faire connaître ou annoncer. « Révéler » convient au contexte où Samuel fera connaître à Saül ce qu’il porte intérieurement, sans surcharger la formulation.
