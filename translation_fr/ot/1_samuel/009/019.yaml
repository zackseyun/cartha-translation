- from: 'Samuel répondit à Saül : « C’est moi, le voyant[a]. Monte devant moi au haut lieu. Vous mangerez[b] avec moi aujourd’hui. Demain matin, je te laisserai repartir, et je te révélerai tout ce qui est dans ton cœur. »'
  to: 'Samuel répondit à Saül : « Je suis le voyant[a]. Monte devant moi au haut lieu. Vous mangerez[b] avec moi aujourd’hui. Demain matin, je te renverrai, et je te dirai tout ce qui est dans ton cœur. »'
  rationale: Les termes historiques et l’alternance voulue entre le pluriel inclusif et le singulier adressé à Saül sont maintenus. Les deux verbes finaux sont resserrés afin de refléter plus exactement « envoyer » et « faire connaître », sans ajouter de nuance interprétative.
