base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: fr
  text: Samuel prit Saül et son jeune serviteur[a], les fit entrer dans la salle[b] et leur donna une place à la tête des invités. Ils étaient environ trente hommes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son jeune homme » ou « son assistant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la pièce » ou « dans la chambre ». Le terme hébreu peut désigner divers types de locaux ; le contexte suggère ici une salle de banquet.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et eux étaient environ trente hommes » ; le pronom renvoie vraisemblablement aux invités.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: son jeune serviteur
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. Dans le contexte narratif, il accompagne Saül en qualité de subordonné; « jeune serviteur » conserve à la fois l’idée de jeunesse et sa fonction.
- source_word: לִשְׁכָּתָה
  choice: dans la salle
  rationale: לִשְׁכָּה désigne une pièce, une chambre ou une salle. Le repas réunissant une trentaine d’invités favorise ici « salle », terme naturel pour un espace de banquet.
- source_word: מָקוֹם
  choice: une place
  rationale: Le nom signifie littéralement « place »; dans ce repas, il évoque naturellement la place assignée aux convives sans préciser davantage le mobilier.
- source_word: בְּרֹאשׁ
  choice: en tête
  rationale: L’expression indique une position prééminente et honorifique parmi les invités, tout en conservant l’image spatiale de l’hébreu.
- source_word: הַקְּרוּאִים
  choice: des invités
  rationale: Le participe passif de קרא désigne ici ceux qui ont été appelés, c’est-à-dire conviés au repas; « invités » est concis et idiomatique.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: Ceux-ci étaient environ trente hommes
  rationale: Le pronom renvoie le plus naturellement aux invités qui viennent d’être mentionnés. « Ceux-ci » rend ce lien explicite, tandis que la note signale la formulation plus littérale et sa référence grammaticale.
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח a le sens courant de « prendre ». Le verbe suivant précise qu’il s’agit de les conduire à l’intérieur.
- source_word: וַיְבִיאֵם
  choice: les fit entrer
  rationale: La forme causative de בוא signifie « faire venir/entrer » ou « amener ». « Les fit entrer » exprime clairement le mouvement vers l’intérieur de la salle.
