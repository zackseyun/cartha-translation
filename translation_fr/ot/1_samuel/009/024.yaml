base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: fr
  text: 'Le cuisinier prit alors la cuisse avec ce qui était dessus et la plaça devant Saül[a]. Samuel dit : « Voici la portion qui a été gardée. Mets-la devant toi et mange, car elle t’a été réservée jusqu’au moment fixé, lorsque j’ai dit : “J’ai invité le peuple.” »[b] Ce jour-là, Saül mangea donc avec Samuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la patte ». L’hébreu désigne une partie de la patte de l’animal. Ce qui se trouvait dessus n’est pas identifié plus précisément.
    reason: lexical_alternative
  - marker: b
    text: 'La fin de cette déclaration est difficile en hébreu. On peut aussi comprendre : « car elle t’a été réservée pour le moment fixé, depuis que j’ai dit : “J’ai invité le peuple” ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַטַּבָּח
  choice: le cuisinier
  rationale: Dans le contexte du repas sacrificiel, il s’agit de celui qui prépare et sert la viande. « Cuisinier » convient mieux ici que « boucher » en français courant.
- source_word: הַשּׁוֹק
  choice: la cuisse
  rationale: Le terme désigne une partie de la patte de l’animal. « Cuisse » est naturel dans le contexte d’un morceau de viande, sans chercher à préciser davantage la découpe.
- source_word: וְהֶעָלֶיהָ
  choice: et ce qui était dessus
  rationale: La formulation conserve l’imprécision de l’hébreu, qui ne nomme pas explicitement ce qui accompagnait la cuisse.
- source_word: הַנִּשְׁאָר
  choice: la portion qui a été gardée
  rationale: Le participe peut désigner ce qui reste ou ce qui a été conservé. Le contexte indique une portion mise de côté pour Saül, mais la formulation évite de supprimer entièrement l’ambiguïté lexicale.
- source_word: שִׂים לְפָנֶיךָ
  choice: Mets-la devant toi
  rationale: L’impératif hébreu est conservé directement. En français, cette tournure reste claire dans la scène du repas.
- source_word: לַמּוֹעֵד
  choice: pour le moment fixé
  rationale: Cette expression rend l’idée d’un temps ou d’une occasion déterminée à l’avance, sans introduire l’idée plus technique d’une fête religieuse.
- source_word: שָׁמוּר לְךָ
  choice: elle t’a été réservée
  rationale: Le participe passif exprime l’état d’une portion mise de côté à l’intention de Saül. « Réservée » est idiomatique et explicite cette destination.
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: 'depuis que j’ai dit : « J’ai invité le peuple »'
  rationale: Dans le cadre d’un repas, קרא signifie naturellement « inviter ». La relation syntaxique demeure difficile; « depuis que » suit une lecture temporelle possible sans prétendre résoudre définitivement la construction.
- source_word: עִם שְׁמוּאֵל
  choice: avec Samuel
  rationale: La préposition indique simplement que Saül partagea le repas avec Samuel.
