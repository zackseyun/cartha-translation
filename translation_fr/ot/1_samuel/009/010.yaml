  text: וַ/יֹּ֨אמֶר שָׁא֧וּל לְ/נַעֲר֛/וֹ ט֥וֹב דְּבָרְ/ךָ֖ לְכָ֣/ה נֵלֵ֑כָה וַ/יֵּֽלְכוּ֙ אֶל הָ/עִ֔יר אֲשֶׁר שָׁ֖ם אִ֥ישׁ הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: fr
  text: 'Alors Saül dit à son jeune homme[a] : « Ce que tu proposes est bon. Viens, allons-y. » Ils se rendirent donc à la ville où se trouvait l’homme de Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur » ou « assistant ».
    reason: lexical_alternative
  - marker: b
    text: « Homme de Dieu » est un titre hébreu couramment donné à un prophète ou à quelqu’un qui parle de la part de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: jeune homme
  rationale: Le terme désigne ici le jeune subordonné qui accompagne Saül. « Jeune homme » en conserve le sens premier sans préciser davantage sa fonction, bien que le contexte permette aussi « serviteur » ou « assistant ».
- source_word: טוֹב דְּבָרְךָ
  choice: Ce que tu proposes est bon
  rationale: דָּבָר peut désigner une parole, une affaire ou une proposition. Saül approuve ici l’idée avancée au verset précédent ; cette formulation française rend naturellement la fonction de la phrase.
- source_word: לְכָה נֵלֵכָה
  choice: Viens, allons-y
  rationale: La tournure associe une invitation à une forme cohortative. « Viens, allons-y » en conserve l’élan exhortatif dans un français idiomatique.
- source_word: הָעִיר
  choice: la ville
  rationale: עִיר peut désigner une ville ou une localité. « La ville » correspond à la forme définie de l’hébreu et au rendu français courant.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette expression constitue un titre traditionnel appliqué à un prophète ou à un porte-parole de Dieu. Le rendu direct préserve la désignation employée par le texte.
- source_word: אֲשֶׁר שָׁם
  choice: où se trouvait
  rationale: La combinaison du relatif et de l’adverbe de lieu se rend naturellement par « où » ; « se trouvait » évite une construction française lourde tout en conservant le sens locatif.
theological_decisions:
- issue: Traduction du titre אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  alternative: le prophète
  rationale: Même si ce titre désigne couramment un prophète, le traduire directement respecte la formulation théologique propre au récit sans la remplacer par une interprétation fonctionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct ; « Ce que tu proposes est bon » explicite seulement la valeur contextuelle de דָּבָר, tandis que « l’homme de Dieu » conserve le titre hébreu.
