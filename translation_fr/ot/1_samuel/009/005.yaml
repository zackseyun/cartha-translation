base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: fr
  text: 'Quand ils arrivèrent dans le pays de Tsouf, Saül dit au jeune homme qui l’accompagnait : « Viens, retournons, de peur que mon père ne cesse de se préoccuper des ânesses[a] et ne s’inquiète pour nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « cesse à l’égard des ânesses » ; l’expression signifie cesser de s’en préoccuper.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne se fasse du souci à notre sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: arrivèrent dans le pays de Tsouf
  rationale: Avec בוא suivi de ב, l’expression indique l’arrivée dans une région. « Arrivèrent dans » est naturel en français et conserve le nom géographique.
- source_word: נַעֲרוֹ אֲשֶׁר עִמּוֹ
  choice: le jeune homme qui l’accompagnait
  rationale: נַעַר désigne fondamentalement un jeune homme, même s’il peut aussi s’agir d’un serviteur. « Qui l’accompagnait » rend naturellement אֲשֶׁר עִמּוֹ sans préciser davantage son statut.
- source_word: לְכָה וְנָשׁוּבָה
  choice: Viens, retournons
  rationale: L’impératif suivi du cohortatif exprime une invitation pressante à repartir. Cette formulation en conserve la force exhortative.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française exprime naturellement la conséquence redoutée introduite par פֶּן.
- source_word: יֶחְדַּל … מִן הָאֲתֹנוֹת
  choice: ne cesse de s’occuper des ânesses
  rationale: Le sens littéral est « cesser [à propos] des ânesses »; dans le contexte, il s’agit de ne plus leur consacrer son attention. La formulation garde l’idée de cessation sans imposer exclusivement la notion affective de souci.
- source_word: וְדָאַג לָנוּ
  choice: et ne s’inquiète pour nous
  rationale: דאג exprime l’inquiétude ou la préoccupation; avec לָנוּ, « s’inquiéter pour nous » est idiomatique et fidèle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Ânesses » préserve la précision du féminin pluriel hébreu; « Tsouf » suit une translittération française usuelle.
