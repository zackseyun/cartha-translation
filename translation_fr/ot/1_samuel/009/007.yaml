base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: fr
  text: 'Alors Saül dit à son jeune serviteur : « Mais voilà : si nous y allons, qu’apporterons-nous à cet homme ? Il ne reste plus de pain dans nos sacs[a], et nous n’avons aucun présent[b] à apporter à l’homme de Dieu. Qu’avons-nous avec nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pain est épuisé dans nos récipients ». Le mot hébreu traduit par « sacs » désigne plus généralement des objets servant de contenants.'
    reason: lexical_alternative
  - marker: b
    text: Ou « cadeau ». Le terme hébreu désigne ce que l’on apporte en présent à une personne respectée.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: jeune serviteur
  rationale: Le mot peut désigner un jeune homme ou un jeune assistant. Dans ce contexte, il s’agit de celui qui accompagne et sert Saül ; « jeune serviteur » rend à la fois son rôle et la nuance d’âge sans suggérer nécessairement l’esclavage.
- source_word: וְהִנֵּה נֵלֵךְ
  choice: Mais si nous y allons
  rationale: Dans l’échange, Saül envisage la proposition de son serviteur tout en soulevant une objection pratique. Cette formulation française naturelle exprime cette valeur conditionnelle implicite sans archaïsme.
- source_word: נָּבִיא
  choice: qu’apporterons-nous
  rationale: Le hiphil de בוא signifie ici apporter quelque chose à quelqu’un. Le futur français convient à la question pratique de Saül.
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens concret « pain » est conservé plutôt que d’être généralisé en « provisions », même si le terme peut représenter la nourriture de voyage.
- source_word: אָזַל מִכֵּלֵינוּ
  choice: Il ne reste plus de pain dans nos sacs
  rationale: Le verbe indique que la réserve est épuisée. « Sacs » donne dans ce contexte de voyage un équivalent concret et naturel de כְּלִי, terme plus général signifiant récipient ou contenant.
- source_word: תְּשׁוּרָה
  choice: présent
  rationale: Le terme désigne un don apporté à une personne que l’on souhaite honorer. « Présent » convient au contexte social sans introduire les connotations cultuelles possibles d’« offrande ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette expression reconnue est conservée telle quelle, sans la remplacer par « prophète », afin de respecter le titre employé dans le texte hébreu.
- source_word: מָה אִתָּנוּ
  choice: Qu’avons-nous avec nous ?
  rationale: La formulation garde l’idée concrète de ce qui se trouve encore en leur possession tout en restant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve le caractère concret de « pain », le titre « homme de Dieu » et la question finale sur ce qu’ils ont avec eux. « Jeune serviteur » évite la tournure peu naturelle « son jeune homme » tout en maintenant la nuance d’âge et la fonction narrative.
