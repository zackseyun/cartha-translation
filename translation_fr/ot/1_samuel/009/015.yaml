  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: fr
  text: 'Yahweh avait révélé à Samuel, un jour avant l’arrivée de Saül[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avait découvert l’oreille de Samuel », expression hébraïque signifiant que Yahweh lui avait révélé quelque chose.'
    reason: L’image idiomatique de l’hébreu n’est pas reproduite dans le corps du texte afin de conserver un français naturel.
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh ». Le waw narratif n’exige pas ici l’ajout d’un connecteur explicite en français.
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: avait fait cette révélation à Samuel
  rationale: L’expression idiomatique signifie littéralement « découvrir l’oreille de Samuel », c’est-à-dire lui communiquer ou lui révéler quelque chose. La formulation française exprime naturellement ce sens, tandis que la note conserve l’image hébraïque.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: Un jour avant l’arrivée de Saül
  rationale: La tournure temporelle indique que la révélation a eu lieu la veille de l’arrivée de Saül. « Un jour avant » reste proche de la forme hébraïque sans être obscur.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français les paroles directes qui commencent au verset suivant et remplit la fonction de l’hébreu « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme, rendu ici comme nom propre afin de préserver le nom d’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre temporel est placé en tête pour alléger la phrase. « Cette révélation » anticipe les paroles du verset suivant sans préciser davantage leur contenu.
