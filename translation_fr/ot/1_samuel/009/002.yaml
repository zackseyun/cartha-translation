  text: וְ/ל/וֹ הָיָ֨ה בֵ֜ן וּ/שְׁמ֤/וֹ שָׁאוּל֙ בָּח֣וּר וָ/ט֔וֹב וְ/אֵ֥ין אִ֛ישׁ מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל ט֣וֹב מִמֶּ֑/נּוּ מִ/שִּׁכְמ֣/וֹ וָ/מַ֔עְלָ/ה גָּבֹ֖הַּ מִ/כָּל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: fr
  text: 'Il avait un fils nommé Saül. C’était un jeune homme beau[a] : aucun homme parmi les Israélites n’était plus beau que lui. Il dépassait de la tête et des épaules tous les gens du peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi signifier « bon » ou « remarquable »; ici, le contexte paraît décrire son apparence physique.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בֵן
  choice: fils
  rationale: Le contexte familial immédiat désigne le fils de Qish; « fils » est l’équivalent français direct et naturel.
- source_word: וּשְׁמוֹ שָׁאוּל
  choice: nommé Saül
  rationale: Cette formulation française rend naturellement « et son nom était Saül » sans perdre l’identification personnelle.
- source_word: בָּחוּר
  choice: jeune homme
  rationale: Le terme désigne ici un homme jeune, dans la force de l’âge, plutôt qu’un enfant ou simplement quelqu’un de choisi.
- source_word: טוֹב / וָטוֹב
  choice: beau
  rationale: Dans ce portrait physique, renforcé par la comparaison avec les autres hommes et par la mention de sa stature, טוֹב décrit très probablement la beauté ou la belle apparence. Une note conserve toutefois sa gamme sémantique plus large.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: parmi les Israélites
  rationale: « Israélites » rend en français courant l’expression hébraïque littérale « parmi les fils d’Israël ».
- source_word: טוֹב מִמֶּנּוּ
  choice: plus beau que lui
  rationale: Le comparatif français explicite le sens physique de טוֹב dans la continuité de la première description.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה גָּבֹהַּ מִכָּל הָעָם
  choice: Il dépassait de la tête et des épaules tous les gens du peuple
  rationale: Cette expression française idiomatique communique la stature exceptionnelle indiquée littéralement par « depuis son épaule vers le haut » tout en conservant la mention des épaules.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « beau » reproduit l’insistance du texte hébreu; l’expression finale privilégie une tournure française courante tout en gardant l’image de la tête et des épaules.
