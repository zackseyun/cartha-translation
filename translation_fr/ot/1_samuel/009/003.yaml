base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: fr
  text: 'Les ânesses de Qish, père de Saül, s’étaient perdues. Qish dit à son fils Saül : « Prends avec toi, je te prie, l’un des jeunes hommes[a] ; lève-toi, va chercher les ânesses. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’un des serviteurs » ou « l’un des assistants ».
    reason: Le mot hébreu peut désigner de jeunes hommes en général ou des membres subalternes de la maisonnée qui servent d’accompagnateurs.
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: s’étaient perdues
  rationale: Le verbe אבד décrit ici des animaux devenus introuvables, sans suggérer leur mort. Le plus-que-parfait exprime naturellement en français que cette disparition précède l’ordre donné par Qish.
- source_word: הָאֲתֹנוֹת
  choice: les ânesses
  rationale: Le nom hébreu désigne précisément des ânesses. Cette précision se rend naturellement en français et ne nécessite pas de généralisation.
- source_word: לְקִישׁ
  choice: de Qish
  rationale: Le ל marque ici la possession ; la tournure française concise « les ânesses de Qish » l’exprime clairement.
- source_word: אֲבִי שָׁאוּל
  choice: père de Saül
  rationale: Rendu direct de la chaîne construite, sous forme d’apposition naturelle en français.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Formule narrative simple et proche de l’hébreu, sans ajouter un lien logique absent du texte source.
- source_word: בְּנוֹ
  choice: à son fils Saül
  rationale: L’apposition hébraïque est réorganisée selon l’usage français tout en conservant explicitement la relation filiale.
- source_word: קַח נָא אִתְּךָ
  choice: Prends avec toi, je te prie
  rationale: L’impératif « prends » et « avec toi » sont conservés ; « je te prie » rend la particule נָא, qui adoucit la demande.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: l’un des jeunes hommes
  rationale: נְעָרִים peut désigner de jeunes hommes, des serviteurs ou des assistants. Le choix littéral maintient l’indétermination du rôle social, signalée en note.
- source_word: וְקוּם לֵךְ
  choice: lève-toi, va
  rationale: Les deux impératifs sont maintenus afin de restituer l’enchaînement énergique de l’hébreu.
- source_word: בַּקֵּשׁ
  choice: chercher
  rationale: Dans ce contexte concret, « chercher » est le verbe français courant et exact pour une tentative de retrouver les animaux.
