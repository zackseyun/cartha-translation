  text: וַ/יִּגַּ֥שׁ שָׁא֛וּל אֶת שְׁמוּאֵ֖ל בְּ/ת֣וֹךְ הַ/שָּׁ֑עַר וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵי זֶ֖ה בֵּ֥ית הָ/רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: fr
  text: 'Saül s’approcha de Samuel dans le passage de la porte et lui dit : « Je t’en prie, indique-moi où se trouve la maison du voyant[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Voyant » est un ancien terme pour « prophète » ; le récit l’explique lui-même en 1 Samuel 9.9.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’approcha de
  rationale: Le verbe נגשׁ exprime le fait de s’avancer vers quelqu’un ou de s’en approcher. Cette formulation est naturelle en français et conserve le mouvement vers Samuel.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: dans le passage de la porte
  rationale: Dans ce contexte urbain, שַׁעַר peut désigner l’ensemble aménagé de l’entrée plutôt qu’un simple battant. « Dans le passage de la porte » rend la localisation à l’intérieur de cet espace sans suggérer que Saül se trouve matériellement au milieu d’une porte.
- source_word: הַגִּידָה נָּא לִי
  choice: Je t’en prie, indique-moi
  rationale: L’impératif de נגד accompagné de נָא formule une demande courtoise. « Je t’en prie » restitue cette nuance, tandis qu’« indique-moi » convient à une demande de direction.
- source_word: אֵי זֶה
  choice: où se trouve
  rationale: L’expression interrogative porte ici sur la localisation. « Où se trouve » est idiomatique en français moderne.
- source_word: בֵּית הָרֹאֶה
  choice: la maison du voyant
  rationale: Le groupe construit hébreu signifie littéralement « la maison du voyant ». Le terme « voyant » préserve l’appellation ancienne employée dans ce récit, sans la remplacer par « prophète ».
theological_decisions:
- issue: Relation entre « voyant » et « prophète »
  choice: Conserver « voyant » dans le texte et expliquer le terme en note
  alternative: Traduire directement par « prophète »
  rationale: Le récit emploie délibérément רֹאֶה et explique en 1 Samuel 9.9 qu’il s’agit de l’ancienne appellation de celui qu’on appelle ensuite « prophète ». Conserver « voyant » respecte cette distinction narrative et historique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier hébreu et n’implique ici aucune familiarité particulière. La formulation de la porte privilégie la clarté contextuelle tout en conservant l’image concrète de l’entrée urbaine.
