source:
  edition: WLC
  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: fr
  text: 'Autrefois, en Israël, lorsqu’un homme allait consulter Dieu[a], il disait : « Venez, allons chez le voyant ! » En effet, celui qu’on appelle aujourd’hui « prophète » était autrefois appelé « voyant ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chercher Dieu ».
    reason: L’expression לִדְרֹשׁ אֱלֹהִים peut désigner le fait de rechercher Dieu ou, dans ce contexte, de le consulter afin d’obtenir une réponse.
lexical_decisions:
- source_word: לְפָנִים
  choice: Autrefois
  rationale: Cet adverbe temporel signifie « autrefois » ou « dans les temps anciens ». Le même choix est repris dans la dernière proposition afin de conserver l’encadrement temporel du verset.
- source_word: כֹּה אָמַר
  choice: il disait
  rationale: Dans ce contexte décrivant un usage ancien, l’imparfait français exprime naturellement l’action habituelle sous-jacente à la formule hébraïque « ainsi disait ».
- source_word: הָאִישׁ
  choice: un homme
  rationale: Le nom masculin singulier a ici une valeur générique. « Un homme » conserve la forme du texte source tout en restant naturel en français.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: consulter Dieu
  rationale: Dans ce contexte, דָּרַשׁ désigne la recherche d’une réponse ou d’une direction divine, notamment par l’intermédiaire d’un voyant. « Consulter Dieu » rend clairement cette nuance sans préciser davantage le mode de consultation.
- source_word: לְכוּ וְנֵלְכָה
  choice: Venez, allons
  rationale: « Venez » rend l’impératif pluriel et « allons » le cohortatif, en conservant les deux mouvements de l’exhortation dans un français idiomatique.
- source_word: עַד הָרֹאֶה
  choice: chez le voyant
  rationale: Avec un déplacement vers une personne, עַד peut être rendu naturellement par « chez ». « Voyant » est le titre français usuel pour רֹאֶה dans ce contexte prophétique.
- source_word: לַנָּבִיא הַיּוֹם יִקָּרֵא ... הָרֹאֶה
  choice: celui qu’on appelle aujourd’hui « prophète » était autrefois appelé « voyant »
  rationale: 'Cette formulation française explicite le contraste terminologique visé par la syntaxe hébraïque : le titre courant « prophète » avait autrefois pour correspondant « voyant ». Les guillemets signalent qu’il s’agit ici des appellations elles-mêmes.'
theological_decisions:
- issue: Valeur générique du masculin הָאִישׁ
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le texte hébreu emploie explicitement un substantif masculin singulier à valeur générique. Le conserver évite de neutraliser sans nécessité la forme du texte source.
- issue: Sens de דָּרַשׁ אֱלֹהִים dans un contexte prophétique
  choice: consulter Dieu
  alternative: chercher Dieu
  rationale: Le contexte immédiat porte sur le recours à un voyant pour obtenir une réponse divine. « Consulter Dieu » rend cette dimension sans introduire de conception doctrinale supplémentaire sur la prophétie.
- issue: Rapport entre « prophète » et « voyant »
  choice: présenter ces mots comme deux appellations liées par un changement d’usage
  alternative: identifier sans nuance les deux fonctions
  rationale: Le verset explique un usage terminologique ancien et actuel. La traduction préserve cette observation historique sans prétendre régler toutes les distinctions possibles entre les fonctions prophétiques.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait exprime l’usage ancien; le discours direct garde un rythme oral naturel. Les guillemets autour de « prophète » et « voyant » mettent en évidence l’explication terminologique du narrateur.
