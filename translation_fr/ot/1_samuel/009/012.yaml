base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: fr
  text: 'Elles leur répondirent : « Oui, le voici devant toi[a]. Dépêche-toi maintenant, car il est arrivé aujourd’hui en ville : en effet, il y a aujourd’hui un sacrifice pour le peuple au haut lieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Oui, il est là, devant toi. » L’hébreu associe une particule affirmative à une expression qui attire l’attention.'
    reason: lexical_alternative
  - marker: b
    text: Le « haut lieu » était un lieu local de culte, souvent aménagé sur une hauteur.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: Elles leur répondirent
  rationale: Le doublet narratif hébreu « répondirent et dirent » introduit une réponse. En français moderne, « répondirent » exprime naturellement les deux verbes sans lourdeur.
- source_word: יֵשׁ הִנֵּה לְפָנֶיךָ
  choice: Oui, le voici devant toi
  rationale: יֵשׁ fonctionne ici comme une réponse affirmative, tandis que הִנֵּה attire l’attention et que לְפָנֶיךָ indique la position devant l’interlocuteur. La formulation française conserve ces trois éléments sans ajouter une proximité que le texte ne précise pas explicitement.
- source_word: מַהֵר עַתָּה
  choice: Dépêche-toi maintenant
  rationale: L’impératif et l’adverbe expriment ensemble une urgence immédiate. Cette formulation est actuelle et directe.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: car il est arrivé aujourd’hui en ville
  rationale: Le parfait בָּא décrit l’arrivée accomplie de Samuel ce même jour. Le passé composé convient naturellement en français et garde la pertinence présente de son arrivée.
- source_word: זֶבַח הַיּוֹם לָעָם
  choice: il y a aujourd’hui un sacrifice pour le peuple
  rationale: זֶבַח désigne d’abord un sacrifice. La traduction n’explicite pas ici le repas communautaire que le contexte suivant peut impliquer.
- source_word: בַּבָּמָה
  choice: au haut lieu
  rationale: בָּמָה est le terme cultuel désignant un lieu local de culte, souvent situé sur une hauteur. « Haut lieu » en conserve la texture historique et religieuse.
theological_decisions:
- issue: Sens cultuel de בָּמָה avant l’établissement du Temple
  choice: au haut lieu
  alternative: au sanctuaire sur la hauteur
  rationale: « Haut lieu » garde le terme cultuel traditionnel sans introduire dans ce passage un jugement polémique provenant d’autres contextes bibliques.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste vif, tandis que « haut lieu » préserve le vocabulaire cultuel historique; la note en explicite le sens.
