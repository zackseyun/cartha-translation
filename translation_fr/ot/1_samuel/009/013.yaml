  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: fr
  text: Dès que vous entrerez dans la ville, vous le trouverez, avant qu’il ne monte au haut lieu[a] pour manger. Le peuple ne mangera pas avant son arrivée, car c’est lui qui bénit le sacrifice[b] ; ensuite, les invités mangeront. Montez donc maintenant, car vous le trouverez aujourd’hui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « haut lieu » était un site de culte où l’on offrait des sacrifices et prenait des repas sacrificiels.
    reason: cultural_note
  - marker: b
    text: « Bénir le sacrifice » désigne vraisemblablement la bénédiction prononcée à l’occasion du repas sacrificiel, avant que les invités ne mangent.
    reason: cultural_note
  - marker: c
    text: 'Ou : « à cette heure-ci ». L’expression hébraïque כְהַיּוֹם peut souligner l’immédiateté plutôt que le jour civil comme tel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: Dès que vous entrerez dans la ville
  rationale: La construction temporelle כְּ + infinitif construit peut signifier « quand » ou « dès que ». Le contexte immédiat favorise ici « dès que », naturel en français.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: vous le trouverez
  rationale: כֵּן renforce ici la conséquence et la certitude ; la tournure française exprime naturellement le résultat sans ajouter un « alors » lourd.
- source_word: בְּטֶרֶם יַעֲלֶה
  choice: avant qu’il ne monte
  rationale: בְּטֶרֶם marque l’antériorité et עלה le mouvement ascendant. Le ne explétif est idiomatique après « avant que » et ne change pas le sens.
- source_word: הַבָּמָתָה
  choice: au haut lieu
  rationale: במה désigne un site cultuel, souvent situé en hauteur. « Haut lieu » conserve le terme biblique sans le réduire à un simple sanctuaire.
- source_word: יְבָרֵךְ הַזֶּבַח
  choice: c’est lui qui bénit le sacrifice
  rationale: Le pronom explicite הוּא porte une légère emphase, rendue par « c’est lui qui ». Le verbe et son objet restent traduits directement, sans préciser dans le texte la forme exacte de la bénédiction.
- source_word: הַקְּרֻאִים
  choice: les invités
  rationale: Le participe passif de קרא désigne ceux qui ont été conviés. « Les invités » est concis et naturel.
- source_word: וְעַתָּה עֲלוּ
  choice: Montez donc maintenant
  rationale: עלה conserve l’idée de monter vers le site élevé, tandis que « donc » rend la progression logique du discours.
- source_word: כְהַיּוֹם
  choice: aujourd’hui
  rationale: Dans ce contexte, l’expression indique qu’ils le trouveront ce jour même, tout en pouvant aussi porter une nuance d’immédiateté.
