  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: fr
  text: 'Alors Samuel dit au cuisinier : « Apporte la portion que je t’ai donnée, celle au sujet de laquelle je t’ai dit : “Garde-la auprès de toi.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַּבָּח
  choice: cuisinier
  rationale: Dans le contexte du repas sacrificiel, le terme désigne celui qui prépare et sert la viande. « Cuisinier » est naturel en français moderne; « boucher » serait lexicalement possible, mais moins adapté à l’action présente.
- source_word: תְּנָה
  choice: Apporte
  rationale: Le verbe signifie littéralement « donne », mais Samuel demande ici que la portion mise en réserve soit présentée. « Apporte » exprime naturellement cette valeur contextuelle sans ajouter au sens.
- source_word: מָּנָה
  choice: portion
  rationale: Le nom désigne une part attribuée lors d’un repas. « Portion » conserve clairement l’idée d’une part déterminée.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: que je t’ai donnée
  rationale: Cette traduction garde le sens ordinaire de נתן et l’accord féminin exigé en français par « portion ».
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: celle dont je t’avais dit
  rationale: La tournure reprend et précise la portion tout en restant naturelle en français. Le plus-que-parfait rend le caractère antérieur de cette consigne dans le récit.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: Garde-la auprès de toi
  rationale: L’hébreu évoque littéralement le fait de mettre la portion avec soi. Dans ce contexte, il s’agit de la conserver en réserve; « garde-la auprès de toi » préserve à la fois cette implication et l’expression « avec toi ».
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le discours direct conserve la répétition relative de l’hébreu sans produire une syntaxe artificielle. Le tutoiement correspond aux formes hébraïques singulières et à la relation directe entre Samuel et le cuisinier.
