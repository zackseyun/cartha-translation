  source_fidelity: 'Le sens essentiel est bien rendu : Samuel s’adresse au responsable de la préparation du repas et lui demande de présenter une portion qu’il lui avait confiée, en rappelant l’instruction de la garder près de lui. « Apporte », « portion » et « cuisinier » conviennent au contexte. La formulation révisée conserve explicitement la relation de la seconde relative à la portion, comme en hébreu.'
