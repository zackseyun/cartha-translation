base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: fr
  text: 'Le jeune homme répondit encore à Saül : « Regarde, j’ai sur moi un quart de sicle d’argent. Je le donnerai à l’homme de Dieu, et il nous indiquera notre chemin.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chemin que nous devons prendre ». L’hébreu dit littéralement « notre chemin », expression qui peut désigner l’itinéraire à suivre ou la conduite à adopter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף הַנַּעַר לַעֲנוֹת
  choice: Le jeune homme répondit encore
  rationale: La construction יסף + infinitif exprime la répétition ou la poursuite de l’action. « répondit encore » rend naturellement le fait que le jeune homme reprend la parole après l’objection de Saül.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נער peut désigner un garçon, un jeune homme ou un serviteur. Ici, « jeune homme » préserve le sens lexical sans préciser davantage son statut dans cette proposition.
- source_word: הִנֵּה
  choice: Regarde
  rationale: L’interjection attire l’attention sur ce qu’il possède. « Regarde » est naturel en français moderne et conserve la vivacité du dialogue.
- source_word: נִמְצָא בְיָדִי
  choice: j’ai sur moi
  rationale: Littéralement, l’argent « se trouve dans ma main ». L’expression idiomatique française « j’ai sur moi » communique clairement qu’il l’a en sa possession, sans suggérer nécessairement qu’il le tient physiquement dans sa main.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: un quart de sicle d’argent
  rationale: Il s’agit d’un quart de l’unité de poids appelée sicle, sous forme d’argent. Cette formulation est précise et usuelle dans le registre biblique français.
- source_word: וְנָתַתִּי
  choice: Je le donnerai
  rationale: Dans ce contexte, la forme exprime l’action proposée ou projetée par le jeune homme. Le pronom « le » reprend naturellement le quart de sicle.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: à l’homme de Dieu
  rationale: « Homme de Dieu » est le rendu transparent et traditionnel de ce titre hébreu désignant ici une personne investie d’une mission divine.
- source_word: וְהִגִּיד לָנוּ
  choice: et il nous indiquera
  rationale: Le hiphil de נגד signifie faire connaître, annoncer ou indiquer. Avec « chemin », « indiquera » donne en français un sens naturel tout en laissant ouverte la portée concrète ou figurée de l’expression.
- source_word: אֶת דַּרְכֵּנוּ
  choice: notre chemin
  rationale: Le texte hébreu dit littéralement « notre chemin ». Ce choix conserve l’ambiguïté entre l’itinéraire à suivre et la conduite à adopter.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct; « sicle » conserve l’unité ancienne, tandis que « j’ai sur moi » évite un calque peu idiomatique. L’ambiguïté de « notre chemin » est maintenue dans le texte et explicitée en note.
