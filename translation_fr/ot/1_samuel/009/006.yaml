  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: fr
  text: 'Il lui répondit : « Voici donc, il y a dans cette ville un homme de Dieu, un homme tenu en haute estime. Tout ce qu’il dit se réalise à coup sûr. Allons-y maintenant. Peut-être nous indiquera-t-il le chemin que nous devons prendre.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le chemin sur lequel nous sommes allés ». La forme hébraïque est rétrospective, tandis que le contexte suggère qu’ils cherchent la route ou la démarche à suivre.'
    reason: La traduction principale explicite le sens contextuel de la demande d’orientation, sans effacer la formulation accomplie et potentiellement ambiguë de l’hébreu.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Écoute
  rationale: Cette formule attire l’attention de l’interlocuteur. « Écoute » est naturel en français dans ce dialogue, sans imposer le sens visuel littéral de הִנֵּה.
- source_word: אִישׁ אֱלֹהִים
  choice: homme de Dieu
  rationale: Expression consacrée et formellement proche de l’hébreu, désignant ici un homme reconnu comme porte-parole de Dieu.
- source_word: נִכְבָּד
  choice: très respecté
  rationale: Rend l’idée d’un homme tenu en honneur et jouissant d’une grande considération.
- source_word: בּוֹא יָבוֹא
  choice: arrive à coup sûr
  rationale: L’infinitif absolu suivi du verbe conjugué exprime la certitude ou l’insistance.
- source_word: יַגִּיד לָנוּ
  choice: nous indiquera
  rationale: Dans ce contexte de recherche d’un itinéraire ou d’une direction, « indiquer » rend naturellement l’idée de faire connaître.
- source_word: דַּרְכֵּנוּ
  choice: le chemin que nous devons prendre
  rationale: Traduction contextuelle claire, tout en signalant en note que la formulation hébraïque est plus ambiguë.
theological_decisions:
- issue: Fiabilité de la parole de l’homme de Dieu
  choice: Tout ce qu’il annonce arrive à coup sûr
  alternative: Tout ce qu’il dit se réalise certainement
  rationale: La formulation conserve l’affirmation narrative de sa réputation prophétique sans en tirer une doctrine générale sur tous les prophètes.
- issue: Sens de l’expression finale sur le chemin
  choice: le chemin que nous devons prendre, avec note
  alternative: le chemin sur lequel nous sommes partis
  rationale: Le contexte favorise une demande de direction, mais l’hébreu emploie littéralement une forme accomplie (« nous sommes allés »). La note préserve cette difficulté textuelle au lieu de la masquer.
translation_notes:
  register: Français international moderne, oral mais digne. Le dialogue reste direct et naturel; « homme de Dieu » conserve le vocabulaire biblique reconnu. La ponctuation française et l’inversion « nous indiquera-t-il » soutiennent un registre narratif soigné.
