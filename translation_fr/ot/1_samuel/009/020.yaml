base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: fr
  text: Quant aux ânesses qui ont disparu il y a trois jours, ne t’en préoccupe pas, car elles ont été retrouvées. Et à qui revient tout le désir d’Israël[a] ? N’est-ce pas à toi et à toute la maison de ton père[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et à qui appartient tout ce qu’Israël a de précieux ? » L’expression hébraïque peut désigner soit ce qu’Israël désire, soit ce qui est désirable ou précieux en Israël.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « maison de ton père » désigne un groupe familial ou clanique plus large que la seule famille nucléaire.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: ânesses
  rationale: Le nom hébreu désigne précisément des ânesses. Le français courant permet ici de conserver cette précision sans lourdeur.
- source_word: הָאֹבְדוֹת לְךָ
  choice: que tu as perdues
  rationale: Cette formulation naturelle exprime que les animaux appartenant à Saül avaient disparu, tout en évitant une tournure passive maladroite en français.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: il y a trois jours
  rationale: Cette expression temporelle hébraïque indique idiomatiquement que la disparition s’est produite trois jours auparavant.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: ne t’en préoccupe pas
  rationale: Littéralement, il est question de ne pas diriger son cœur vers elles. La formulation retenue communique naturellement en français l’idée de ne plus s’en soucier.
- source_word: נִמְצָאוּ
  choice: elles ont été retrouvées
  rationale: 'Le niphal accompli présente le résultat actuel d’une action passive : les ânesses ont été retrouvées.'
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: Et à qui va tout le désir d’Israël ?
  rationale: Cette formulation resserrée conserve autant que possible l’ambiguïté de חֶמְדַּת, qui peut évoquer soit ce qu’Israël désire, soit ce qui est désirable ou précieux en Israël.
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: à toi et à toute la maison de ton père
  rationale: « Maison de ton père » conserve l’expression sociale et familiale hébraïque, plus large que la seule famille nucléaire.
theological_decisions:
- issue: Sens de la déclaration de Samuel concernant « le désir d’Israël »
  choice: Conserver une déclaration rhétorique élevée et ambiguë qui associe Saül et sa maison au désir d’Israël sans nommer explicitement la royauté.
  alternative: Traduire directement par « tout ce qu’Israël désire » ou par « tout ce qu’Israël a de précieux », voire y expliciter la royauté.
  rationale: Le contexte prépare l’établissement de Saül, mais le verset ne mentionne pas explicitement la royauté. La traduction ne doit donc pas résoudre dans le texte une ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue singulier. La formulation de la seconde question reste volontairement élevée afin de préserver la densité et l’ambiguïté du texte hébreu.
