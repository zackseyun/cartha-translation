  text: וַֽ/יַּעֲל֖וּ הָ/עִ֑יר הֵ֗מָּה בָּאִים֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וְ/הִנֵּ֤ה שְׁמוּאֵל֙ יֹצֵ֣א לִ/קְרָאתָ֔/ם לַ/עֲל֖וֹת הַ/בָּמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: fr
  text: Ils montèrent vers la ville. Comme ils entraient dans la ville[a], voici que Samuel sortait à leur rencontre pour monter au haut lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au milieu de la ville ». L’hébreu dit littéralement : « au milieu de la ville ».'
    reason: 'Alternative lexicale : בְּתוֹךְ signifie littéralement « au milieu de », tout en pouvant désigner idiomatiquement l’intérieur de la ville.'
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ils montèrent
  rationale: Le verbe עלה exprime une montée; « montèrent » est naturel en français et conserve le mouvement vers un lieu situé en hauteur.
- source_word: הָעִיר
  choice: la ville
  rationale: עיר désigne une ville ou une localité; « ville » est ici le terme français usuel.
- source_word: הֵמָּה בָּאִים
  choice: comme ils entraient
  rationale: Le pronom indépendant suivi du participe présente une action en cours, simultanée à la sortie de Samuel.
- source_word: בְּתוֹךְ הָעִיר
  choice: dans la ville
  rationale: L’expression signifie littéralement « au milieu de la ville », mais peut idiomatiquement indiquer qu’ils entraient ou se trouvaient à l’intérieur de la ville; la note conserve la formulation plus littérale.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française actuelle garde la fonction de הִנֵּה, qui attire vivement l’attention sur l’apparition de Samuel.
- source_word: יֹצֵא
  choice: sortait
  rationale: Le participe décrit Samuel en train de sortir; l’imparfait français rend cette action en cours sans préciser excessivement son point de départ.
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: Cette expression rend directement le mouvement vers eux en vue de les rencontrer.
- source_word: לַעֲלוֹת
  choice: pour monter
  rationale: L’infinitif exprime le but de la sortie de Samuel et reprend le sens ascendant de עלה.
- source_word: הַבָּמָה
  choice: le haut lieu
  rationale: « Haut lieu » est le terme français consacré pour במה et préserve la catégorie historique et cultuelle sans la réduire à un simple sanctuaire ou à une colline.
theological_decisions:
- issue: Désignation du site cultuel במה
  choice: le haut lieu
  alternative: le sanctuaire situé sur la hauteur
  rationale: « Haut lieu » conserve le terme cultuel historique sans introduire dans ce verset une évaluation théologique ultérieure ni imposer une localisation topographique plus précise que le texte.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient la vivacité du récit sans l’archaïsme marqué de « voici ». La répétition de « monter » reflète celle du verbe hébreu עלה.
