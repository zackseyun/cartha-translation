  terminology: « Haut lieu » est le rendu français établi de הַבָּמָה et préserve sa valeur cultuelle historique sans interprétation confessionnelle. « Ville » est approprié pour הָעִיר. La note associée à [a] conserve correctement l’alternative spatiale plus littérale de בְּתוֹךְ.
