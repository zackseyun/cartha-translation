base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: fr
  text: Il parcourut la région montagneuse d’Éphraïm, puis le pays de Shalisha, mais ils ne les trouvèrent pas.[a] Ils parcoururent ensuite le pays de Shaalim, mais elles n’y étaient pas.[b] Puis il parcourut le pays de Benjamin, mais ils ne les trouvèrent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’objet sous-entendu en hébreu renvoie aux ânesses perdues mentionnées au verset précédent.
    reason: implicit_object
  - marker: b
    text: 'Littéralement : « mais il n’y avait pas » ou « mais il n’y avait rien » ; cette expression elliptique signifie ici que les ânesses n’étaient pas là.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: il parcourut / ils parcoururent
  rationale: Avec la préposition בְ et des noms de régions, עבר décrit le déplacement à travers des territoires. « Parcourir » convient naturellement à une recherche itinérante et respecte les alternances de nombre du texte hébreu.
- source_word: בְּהַר אֶפְרַיִם
  choice: la région montagneuse d’Éphraïm
  rationale: Dans cette expression géographique, הַר désigne une zone de relief plutôt qu’une montagne isolée. Cette formulation est claire en français international.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: le pays de Shalisha
  rationale: אֶרֶץ désigne ici un territoire nommé. « Pays » conserve la valeur géographique sans préciser indûment son statut politique.
- source_word: וְלֹא מָצָאוּ
  choice: mais ils ne les trouvèrent pas
  rationale: Le verbe pluriel associe Saül et son serviteur. L’objet, sous-entendu en hébreu, renvoie aux ânesses perdues du contexte précédent; le pronom féminin pluriel l’exprime naturellement en français.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: le pays de Shaalim
  rationale: Le nom du territoire est translittéré, tandis que « pays » rend אֶרֶץ sans surinterprétation.
- source_word: וָאַיִן
  choice: mais elles n’y étaient pas
  rationale: L’expression hébraïque est elliptique, littéralement « et il n’y avait pas ». Le féminin pluriel explicite le renvoi contextuel aux ânesses tout en signalant en note la tournure littérale.
- source_word: אֶרֶץ יְמִינִי
  choice: le pays de Benjamin
  rationale: Le gentilé יְמִינִי désigne ici le territoire benjaminite. « Pays de Benjamin » est idiomatique et géographiquement clair.
