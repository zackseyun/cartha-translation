base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: fr
  text: 'Ils se levèrent de bon matin. Au lever de l’aurore, Samuel appela Saül sur le toit et lui dit : « Lève-toi, et je te laisserai partir[a]. » Saül se leva, puis tous deux, lui et Samuel, sortirent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je te renverrai » ou « je te mettrai en route ». Le verbe hébreu peut signifier donner congé à quelqu’un ou l’envoyer poursuivre son chemin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: Ils se levèrent de bon matin
  rationale: Le hiphil de שׁכם exprime couramment le fait de se lever ou de partir tôt. « De bon matin » restitue naturellement cette indication temporelle en français.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: Au lever de l’aurore
  rationale: Cette formulation conserve l’image littérale de l’aurore qui se lève tout en restant naturelle et digne.
- source_word: הַגָּג
  choice: sur le toit
  rationale: Le nom désigne le toit plat de la maison, où Saül avait passé la nuit selon le contexte précédent.
- source_word: קוּמָה
  choice: Lève-toi
  rationale: L’impératif est direct et courant, sans l’archaïsme que pourrait suggérer « Debout ! » dans ce contexte.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: je te laisserai partir
  rationale: Le verbe שׁלח peut ici signifier donner congé à quelqu’un, le renvoyer ou l’accompagner dans son départ. La traduction choisie rend le départ autorisé sans suggérer inutilement un renvoi hostile.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: sortirent
  rationale: Le verbe accompagné de l’adverbe directionnel signifie qu’ils allèrent dehors. « Sortirent » est idiomatique et n’ajoute aucun lieu non précisé.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: tous deux, lui et Samuel
  rationale: Cette tournure conserve l’apposition emphatique de l’hébreu. Le pronom « lui » renvoie naturellement à Saül.
