  text: וּ/שְׁמוּאֵ֖ל רָאָ֣ה אֶת שָׁא֑וּל וַ/יהוָ֣ה עָנָ֔/הוּ הִנֵּ֤ה הָ/אִישׁ֙ אֲשֶׁ֣ר אָמַ֣רְתִּי אֵלֶ֔י/ךָ זֶ֖ה יַעְצֹ֥ר בְּ/עַמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: fr
  text: 'Quand Samuel aperçut Saül, Yahweh lui répondit : « Voici l’homme dont je t’ai parlé. C’est lui qui gouvernera mon peuple[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « retiendra » ou « tiendra sous contrôle mon peuple ». Le verbe hébreu peut exprimer l’idée de retenir, de contenir ou de gouverner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: aperçut
  rationale: Dans cette séquence narrative, « aperçut » exprime naturellement le fait que Samuel vit et reconnut Saül au moment où celui-ci se présenta.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle « Yahweh », conformément au texte source.
- source_word: עָנָהוּ
  choice: lui répondit
  rationale: Le verbe ענה signifie normalement « répondre ». Cette traduction conserve le lien avec la révélation divine antérieure au lieu d’aplanir le texte en « lui dit ».
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » attire l’attention sur l’homme présent et restitue avec naturel la valeur déictique de הִנֵּה.
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: dont je t’ai parlé
  rationale: Cette formulation française courante rend fidèlement la relative qui renvoie à la parole antérieure de Yahweh.
- source_word: זֶה
  choice: C’est lui qui
  rationale: La tournure détachée conserve l’insistance du démonstratif hébreu זֶה tout en restant idiomatique en français.
- source_word: יַעְצֹר
  choice: gouvernera
  rationale: Dans le contexte de la désignation de Saül comme chef royal, le verbe désigne l’exercice d’une autorité de contrôle. « Gouvernera » communique ce sens contextuel, tandis que la nuance plus littérale de retenue est signalée en note.
- source_word: בְּעַמִּי
  choice: mon peuple
  rationale: Avec יַעְצֹר, le préfixe ב marque ici le peuple sur lequel s’exerce l’autorité; en français, cette relation est naturellement incluse dans la construction transitive « gouverner mon peuple ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de יַעְצֹר dans le cadre de la royauté de Saül
  choice: gouvernera mon peuple
  alternative: retiendra mon peuple; tiendra mon peuple sous contrôle
  rationale: Le contexte immédiat concerne l’homme choisi pour exercer l’autorité sur Israël. « Gouvernera » rend cette fonction sans effacer la nuance lexicale de contrôle ou de retenue, conservée dans la note.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici » conserve la force de présentation du texte hébreu; « C’est lui qui » restitue son insistance sans lourdeur. Le tutoiement correspond à l’adresse directe de Yahweh à Samuel.
