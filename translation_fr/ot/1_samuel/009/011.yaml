  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: fr
  text: 'Comme ils gravissaient la montée qui conduisait à la ville, ils rencontrèrent de jeunes femmes qui sortaient puiser de l’eau et leur demandèrent : « Le voyant[a] est-il ici ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prophète ». L’hébreu dit précisément « le voyant », un terme ancien pour désigner celui qu’on appellera plus tard un prophète.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: montaient
  rationale: Le participe, renforcé par le pronom הֵמָּה, présente l’action en cours. « Montaient » rend naturellement cette progression dans le récit.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: par le chemin qui menait à la ville
  rationale: מַעֲלֶה désigne une montée ou une voie ascendante. Cette formulation française conserve l’idée topographique sans la lourdeur de « par la montée de la ville ».
- source_word: מָצְאוּ
  choice: rencontrèrent
  rationale: Le verbe signifie fondamentalement « trouver », mais, dans cette scène de déplacement, il décrit une rencontre fortuite. « Rencontrèrent » est l’équivalent naturel en français.
- source_word: נְעָרוֹת
  choice: de jeunes femmes
  rationale: Le terme désigne des personnes de sexe féminin encore jeunes. « Jeunes femmes » est actuel et évite aussi bien l’ambiguïté d’âge de « filles » que le caractère archaïque de « jeunes filles » dans certains contextes.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: qui sortaient puiser de l’eau
  rationale: Le participe suivi de l’infinitif exprime une action en cours et son but. La construction sans « pour » est idiomatique et fluide en français.
- source_word: הֲיֵשׁ בָּזֶה
  choice: est-il ici ?
  rationale: L’expression demande si la personne est présente en ce lieu. « Ici » en donne l’équivalent français le plus direct.
- source_word: הָרֹאֶה
  choice: le voyant
  rationale: L’hébreu emploie précisément un ancien titre lié au fait de voir, distinct dans sa forme du mot habituellement traduit par « prophète ». « Voyant » préserve cette terminologie historique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et orale dans la question, tandis que « le voyant » conserve le terme historique du texte hébreu. Le marqueur [a] est placé directement après le mot qu’il explique.
