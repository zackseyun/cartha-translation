base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: fr
  text: Il y avait un homme de Benjamin nommé Qish. Il était fils d’Abiel, fils de Tseror, fils de Bekorath, fils d’Afiah, fils d’un Benjamite. C’était un homme puissant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un vaillant guerrier », « un homme influent » ou « un homme riche et puissant » ; l’expression hébraïque peut évoquer la bravoure militaire, le rang social ou la richesse selon le contexte.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיְהִי אִישׁ מִבֶּן־יָמִין
  choice: Il y avait un homme de Benjamin
  rationale: La formule ouvre un nouvel épisode narratif. « Il y avait » est naturel en français et מִבֶּן־יָמִין indique ici l’appartenance ou l’origine tribale.
- source_word: וּשְׁמוֹ קִישׁ
  choice: nommé Qish
  rationale: Cette formulation française fluide rend la formule hébraïque « et son nom était Qish » sans en modifier le contenu.
- source_word: בֶּן ... בֶּן ...
  choice: fils de
  rationale: La répétition conserve la structure généalogique de l’hébreu. Dans ce type de généalogie, « fils de » peut aussi désigner un descendant plus éloigné.
- source_word: קִישׁ / אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: Qish / Abiel / Tseror / Bekorath / Afiah
  rationale: Translittérations françaises claires des noms propres hébreux.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: fils d’un Benjaminite
  rationale: יְמִינִי désigne ici un membre de la tribu de Benjamin; « Benjaminite » est précis et courant.
- source_word: גִּבּוֹר חָיִל
  choice: un homme de grande valeur
  rationale: L’expression peut évoquer la puissance, la bravoure, la richesse ou le rang social. La formulation retenue préserve cette amplitude, explicitée en note.
theological_decisions:
- issue: Portée descriptive de גִּבּוֹר חָיִל
  choice: Ne pas réduire l’expression à la seule bravoure militaire
  alternative: un vaillant guerrier
  rationale: Dans la présentation de la famille de Saül, le contexte ne permet pas de trancher avec certitude entre prouesse militaire, importance sociale et aisance matérielle.
translation_notes:
  register: Français international moderne, naturel et digne. La généalogie est répartie en phrases courtes pour rester intelligible, tandis que la répétition « fils de » préserve sa forme. Le marqueur [a] est placé après l’expression qu’il explique.
