base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: fr
  text: 'Comme ils descendaient vers l’extrémité de la ville, Samuel dit à Saül : « Dis au jeune homme[a] de passer devant nous. » Il passa donc devant eux. Samuel reprit : « Quant à toi, arrête-toi ici maintenant[b], et je te ferai entendre la parole de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au serviteur ». Le mot hébreu peut désigner un jeune homme, un assistant ou un serviteur.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement « tiens-toi debout comme aujourd’hui / en ce jour ». L’expression est difficile; dans ce contexte, elle semble demander à Saül de s’arrêter et de rester sur place pour le moment.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: descendaient
  rationale: Le participe exprime une action en cours dans le récit. « Descendaient » rend naturellement le mouvement vers la limite de la ville.
- source_word: בִּקְצֵה הָעִיר
  choice: vers l’extrémité de la ville
  rationale: קָצֶה désigne l’extrémité ou la limite. Cette formulation reste proche de l’hébreu sans préciser davantage la topographie.
- source_word: אֱמֹר לַנַּעַר
  choice: Dis au jeune homme
  rationale: נַעַר peut désigner un jeune homme, un assistant ou un serviteur. Le texte principal conserve le sens lexical large, tandis qu’une note signale la valeur contextuelle possible de « serviteur ».
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: de passer devant nous
  rationale: Avec לִפְנֵי, le verbe עבר exprime ici le fait de prendre les devants. « Passer devant nous » demeure naturel et proche de la formulation hébraïque.
- source_word: וַיַּעֲבֹר
  choice: Il passa donc devant eux
  rationale: La forme narrative indique que le jeune homme exécute l’ordre. « Devant eux » clarifie qu’il prend de l’avance sur Samuel et Saül.
- source_word: עֲמֹד כַּיּוֹם
  choice: arrête-toi ici maintenant
  rationale: L’expression est difficile à rendre littéralement. Dans le contexte, elle demande à Saül de s’immobiliser et de rester momentanément sur place; « ici » est explicité par le contexte.
- source_word: וְאַשְׁמִיעֲךָ
  choice: je te ferai entendre
  rationale: Le hiphil de שׁמע est causatif. « Faire entendre » conserve directement cette nuance en français.
- source_word: דְּבַר אֱלֹהִים
  choice: la parole de Dieu
  rationale: דָּבָר peut désigner une parole, une affaire ou un message. Dans ce contexte de révélation prophétique, « la parole de Dieu » préserve la portée théologique sans préciser indûment son contenu.
theological_decisions:
- issue: Rendu de la formule révélatoire דְּבַר אֱלֹהִים
  choice: la parole de Dieu
  alternative: le message de Dieu
  rationale: « La parole de Dieu » garde la résonance prophétique de la formule hébraïque et son poids théologique, sans réduire דָּבָר au seul sens de « message ».
translation_notes:
  register: Français international moderne, digne et accessible. Le récit conserve une syntaxe fluide; « Samuel reprit » distingue naturellement la seconde parole après l’exécution de l’ordre. Les notes préservent l’étendue sémantique de נַעַר et l’étrangeté idiomatique de כַּיּוֹם.
