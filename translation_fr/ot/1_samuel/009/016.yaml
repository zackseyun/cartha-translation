source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: fr
  text: Demain, vers cette heure-ci, je t’enverrai un homme du territoire de Benjamin. Tu l’oindras comme chef[a] de mon peuple Israël. Il sauvera mon peuple de la main des Philistins, car j’ai vu mon peuple, puisque son cri est parvenu jusqu’à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dirigeant » ; traditionnellement « prince ». Le mot hébreu désigne ici celui qui est établi pour gouverner.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: Demain, à peu près à la même heure
  rationale: Cette formulation française naturelle conserve à la fois le repère du lendemain et la valeur approximative de כָּעֵת.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: je t’enverrai
  rationale: Le pronom indirect « t’ » rend explicitement la direction marquée par אֵלֶיךָ, sans lourdeur en français.
- source_word: מֵאֶרֶץ בִּנְיָמִן
  choice: du territoire de Benjamin
  rationale: « Territoire » exprime ici le sens géographique de אֶרֶץ plus précisément que la simple appartenance tribale.
- source_word: וּמְשַׁחְתּוֹ
  choice: Tu lui donneras l’onction
  rationale: Le parfait précédé du waw a ici une valeur directive. Cette expression rend clairement le geste d’investiture sans archaïsme excessif.
- source_word: לְנָגִיד
  choice: pour qu’il soit chef
  rationale: נָגִיד désigne une personne établie pour gouverner. « Chef » conserve cette fonction d’autorité sans l’identifier automatiquement au titre plus précis de roi.
- source_word: וְהוֹשִׁיעַ
  choice: Il sauvera
  rationale: Le verbe יָשַׁע exprime le salut ou la délivrance. Le futur présente ici le résultat attendu de l’investiture.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: de la main des Philistins
  rationale: La traduction maintient l’image hébraïque de la main comme pouvoir ou domination, image qui reste intelligible en français.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: car j’ai vu mon peuple
  rationale: La formulation directe préserve le verbe « voir » et sa possible nuance de constat attentif, sans expliciter davantage que le texte.
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: puisque son cri est parvenu jusqu’à moi
  rationale: Le possessif singulier « son » correspond au suffixe hébreu singulier et renvoie naturellement en français au nom collectif « mon peuple ».
theological_decisions:
- issue: Portée du titre נָגִיד appliqué à Saül
  choice: chef
  alternative: dirigeant ; prince
  rationale: « Chef » indique une autorité réelle conférée par Dieu tout en évitant de remplacer le terme hébreu par « roi » ou d’introduire les connotations dynastiques modernes de « prince ».
- issue: Rapport entre l’action divine et le salut accompli par Saül
  choice: Il sauvera mon peuple
  alternative: Il délivrera mon peuple ; afin qu’il sauve mon peuple
  rationale: Le texte attribue directement à l’homme oint l’action de sauver, dans le cadre de l’envoi et de l’investiture voulus par Dieu. La traduction conserve cette articulation sans effacer l’agent humain ni préciser davantage la causalité divine.
- issue: Suffixe singulier de צַעֲקָתוֹ après le collectif עַמִּי
  choice: son cri
  alternative: leur cri
  rationale: Contrairement à l’anglais courant, le français peut reprendre naturellement le collectif singulier « mon peuple » par « son ». Cette solution suit donc de près la morphologie hébraïque sans obscurcir le sens.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse divine singulière à Samuel. L’image « de la main des Philistins » et la répétition de « mon peuple » ont été conservées afin de respecter la force et la structure du texte hébreu.
