translation:
  language: fr
  text: Ils descendirent du haut lieu dans la ville, et Samuel parla avec Saül sur le toit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Ils descendirent
  rationale: Le wayyiqtol fait progresser le récit; le passé simple convient au registre narratif français et conserve le sujet pluriel.
- source_word: מֵהַבָּמָה
  choice: du haut lieu
  rationale: בָּמָה désigne ici le lieu élevé associé au sacrifice; « haut lieu » est la formulation traditionnelle et transparente sans réduire le terme à une simple colline.
- source_word: הָעִיר
  choice: vers la ville
  rationale: Le texte massorétique place « la ville » sans préposition explicite après l’expression de provenance. « Vers la ville » rend naturellement la destination suggérée par le mouvement sans affirmer plus précisément « dans la ville ».
- source_word: וַיְדַבֵּר עִם שָׁאוּל
  choice: Samuel s’entretint avec Saül
  rationale: Le singulier renvoie naturellement à Samuel dans le contexte. « S’entretint avec » restitue la valeur réciproque suggérée par עִם (« avec »), plus précisément que le simple « parla à ».
- source_word: עַל הַגָּג
  choice: sur le toit
  rationale: גָּג désigne le toit plat d’une maison, utilisé comme espace de vie; « sur le toit » est naturel en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom « Samuel », implicite dans le verbe hébreu singulier mais identifié sans ambiguïté par le contexte, est explicité pour éviter en français un pronom dont l’antécédent serait incertain.
