  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: fr
  text: Après qu’Anne eut mangé à Silo et eut bu, elle se leva. Éli, le prêtre, était assis sur le siège, près du montant de la porte du temple de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sanctuaire de Yahweh ».
    reason: Alternative lexicale pour הֵיכָל, particulièrement pertinente pour le lieu sacré de Silo avant la construction du temple de Salomon.
lexical_decisions:
- source_word: וַתָּקָם
  choice: se leva
  rationale: Le wayyiqtol qal de קום exprime ici le fait de se lever pour agir; « se leva » rend naturellement le mouvement narratif.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: Après qu’on eut mangé ... et après qu’on eut bu
  rationale: Les formes hébraïques sont elliptiques et leur sujet n’est pas explicitement exprimé. Le pronom indéfini « on » conserve mieux cette indétermination que « ils » ou « elle », tandis que le passé antérieur marque l’antériorité par rapport au lever d’Anne.
- source_word: בְשִׁלֹה
  choice: à Silo
  rationale: En français, la préposition idiomatique devant un nom de ville est « à ».
- source_word: וְעֵלִי הַכֹּהֵן יֹשֵׁב
  choice: Éli, le prêtre, était assis
  rationale: Le participe יֹשֵׁב fournit l’arrière-plan de la scène; l’imparfait français en rend la valeur durative. La conjonction n’a pas besoin d’être traduite séparément.
- source_word: עַל הַכִּסֵּא
  choice: sur son siège
  rationale: כִּסֵּא désigne ici un siège sans imposer l’idée royale de « trône ». Le possessif est idiomatique dans ce contexte sans ajouter de distinction théologique.
- source_word: עַל מְזוּזַת
  choice: près du montant de la porte
  rationale: מְזוּזָה désigne le montant d’une porte; עַל a ici une valeur locale, rendue naturellement par « près de » plutôt que littéralement par « sur ».
- source_word: הֵיכַל יְהוָה
  choice: temple de Yahweh
  rationale: הֵיכָל peut désigner un temple ou sanctuaire. « Temple » rend le terme avec dignité et clarté, tandis que l’autre possibilité est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sujet des propositions « après avoir mangé » et « après avoir bu »
  choice: Sujet indéfini avec « on »
  alternative: « elle » (Anne) ou « ils » (le groupe familial)
  rationale: L’hébreu est elliptique et les formes consonantiques peuvent susciter des analyses divergentes. « On » évite de trancher silencieusement entre une lecture individuelle et une lecture collective.
- issue: Sens de הֵיכַל à Silo
  choice: temple
  alternative: sanctuaire
  rationale: Le mot peut désigner l’édifice sacré ou le sanctuaire. Le texte principal retient le terme français courant « temple », sans nier le cadre pré-salomonien; « sanctuaire » figure en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source porte un nom propre; « Yahweh » en préserve la fonction sans introduire une interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. « Silo » et « Éli » suivent les formes françaises usuelles. Le passé antérieur s’accorde au registre biblique soutenu tout en restant clair; l’imparfait installe l’arrière-plan de la scène.
