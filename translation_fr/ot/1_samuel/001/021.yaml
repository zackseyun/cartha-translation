  text: וַ/יַּ֛עַל הָ/אִ֥ישׁ אֶלְקָנָ֖ה וְ/כָל בֵּית֑/וֹ לִ/זְבֹּ֧חַ לַֽ/יהוָ֛ה אֶת זֶ֥בַח הַ/יָּמִ֖ים וְ/אֶת נִדְרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: fr
  text: Puis Elqana monta avec toute sa maisonnée pour offrir à Yahweh le sacrifice annuel et accomplir son vœu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et son vœu » ; la construction hébraïque est elliptique et indique qu’il monta aussi pour s’acquitter de son vœu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie couramment « monter ». Dans le contexte d’un pèlerinage au sanctuaire de Silo, « monta » conserve l’expression hébraïque et sa portée géographique.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: Elqana
  rationale: En français, reprendre simplement le nom est plus naturel que « l’homme Elqana » tout en identifiant sans ambiguïté le sujet. La forme « Elqana » suit une translittération française usuelle.
- source_word: וְכָל בֵּיתוֹ
  choice: avec toute sa maisonnée
  rationale: בַּיִת désigne ici les membres du foyer plutôt que le bâtiment. « Maisonnée » conserve la dimension collective du terme hébreu.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: pour offrir à Yahweh
  rationale: Dans ce contexte cultuel, זבח exprime l’action d’offrir un sacrifice. Le complément est intégré à l’expression française naturelle, tandis que le nom divin יהוה est rendu par « Yahweh ».
- source_word: זֶבַח הַיָּמִים
  choice: le sacrifice annuel
  rationale: Littéralement lié aux « jours », le syntagme désigne le sacrifice périodique accompli chaque année, comme l’indique le contexte.
- source_word: וְאֶת נִדְרוֹ
  choice: et accomplir son vœu
  rationale: L’hébreu coordonne « son vœu » au sacrifice par une construction elliptique. En français, « accomplir son vœu » explicite sobrement l’action implicite et évite l’idée impropre de sacrifier le vœu lui-même.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère propre du nom divin plutôt que de le remplacer par un titre.
- issue: Sens de וְאֶת נִדְרוֹ dans la construction elliptique
  choice: accomplir son vœu
  alternative: et son vœu
  rationale: Le texte hébreu laisse l’action régissant « son vœu » implicite. Le français exige une formulation plus nette; « accomplir » transmet l’idée de s’acquitter de ce qui a été voué sans déterminer davantage la nature du vœu.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement de pèlerinage exprimé par « monta » et emploie un vocabulaire cultuel accessible sans lourdeur archaïque.
