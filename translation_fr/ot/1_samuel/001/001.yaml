  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: fr
  text: Il y avait un certain homme de Ramataïm-Tsofim, de la région montagneuse d’Éphraïm. Il s’appelait Elkana, fils de Yéroham, fils d’Élihou, fils de Tohou, fils de Tsouf ; c’était un Éphrathien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « un Éphraïmite ». L’hébreu porte « Éphrathien », terme qui peut avoir ici une valeur régionale liée à Éphraïm.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Il y avait
  rationale: Cette formule ouvre le récit. « Il y avait » en rend naturellement la fonction sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: אִישׁ אֶחָד
  choice: un homme
  rationale: Dans ce contexte narratif, l’indéfini français introduit naturellement un personnage particulier encore non nommé ; « un certain homme » serait plus lourd.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: de Ramataïm-Tsofim
  rationale: L’expression est traitée comme un nom de lieu composé, sans imposer une analyse incertaine de ses éléments.
- source_word: מֵהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: Dans cette expression territoriale, הַר désigne la région montagneuse plutôt qu’une montagne isolée. « Dans » explicite en français la localisation de Ramataïm-Tsofim à l’intérieur de cette région, tout en respectant la double indication d’origine.
- source_word: וּשְׁמוֹ
  choice: Il s’appelait
  rationale: Formulation française naturelle correspondant à « et son nom était », avec une nouvelle phrase pour éviter une coordination pesante.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Le nom propre est translittéré plutôt que traduit.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: fils de… fils de… fils de… fils de
  rationale: La répétition conserve la forme généalogique du texte, sans remplacer « fils » par le terme plus général « descendant ».
- source_word: אֶפְרָתִי
  choice: un Éphrathien
  rationale: La traduction principale conserve la forme lexicale hébraïque, tandis que l’interprétation régionale « Éphraïmite » est signalée en note.
theological_decisions:
- issue: Désignation ethnique ou géographique אֶפְרָתִי
  choice: un Éphrathien
  alternative: un Éphraïmite
  rationale: La forme hébraïque correspond directement à « Éphrathien », mais le contexte éphraïmite permet de comprendre le mot comme une désignation régionale. L’ambiguïté est conservée au moyen d’une note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international actuel, narratif et digne. La syntaxe hébraïque est légèrement réorganisée en deux phrases pour rester claire et naturelle, tout en conservant la généalogie répétitive et l’ambiguïté de la désignation finale.
