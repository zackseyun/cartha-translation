  text: אַל תִּתֵּן֙ אֶת אֲמָ֣תְ/ךָ֔ לִ/פְנֵ֖י בַּת בְּלִיָּ֑עַל כִּֽי מֵ/רֹ֥ב שִׂיחִ֛/י וְ/כַעְסִ֖/י דִּבַּ֥רְתִּי עַד הֵֽנָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: fr
  text: Ne considère pas ta servante comme une femme indigne[a], car c’est à cause de l’intensité de ma plainte et de mon dépit[b] que j’ai parlé jusqu’à présent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu littéralement : « une fille d’indignité », expression désignant une femme moralement méprisable ou mal famée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de mon irritation » ; le terme peut aussi évoquer une vive peine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: Ne considère pas ... comme
  rationale: Dans cette construction, נתן avec לִפְנֵי et un attribut exprime l’idée de tenir ou considérer quelqu’un pour tel, plutôt qu’une action de donner ou une position spatiale.
- source_word: אֲמָתְךָ
  choice: ta servante
  rationale: Le nom désigne explicitement une servante et constitue ici la manière humble dont Anne parle d’elle-même à Éli.
- source_word: בַּת בְּלִיָּעַל
  choice: une femme indigne
  rationale: Littéralement « fille d’indignité », cette locution désigne une femme moralement méprisable ou déshonorante. « Femme indigne » en restitue naturellement la portée sans transformer l’expression en jugement métaphysique sur sa valeur personnelle.
- source_word: כִּי מֵרֹב
  choice: car c’est dans l’excès de
  rationale: כִּי introduit l’explication d’Anne, et מֵרֹב indique que ses paroles viennent de la grande intensité ou abondance de sa détresse.
- source_word: שִׂיחִי
  choice: ma plainte
  rationale: Dans ce contexte de prière douloureuse, le terme évoque une plainte ou une méditation affligée; « plainte » conserve le caractère verbal et l’orientation vers Dieu.
- source_word: וְכַעְסִי
  choice: et de mon chagrin
  rationale: כעס peut exprimer l’irritation, le dépit ou une vive peine. Ici, « chagrin » rend le trouble intérieur d’Anne sans suggérer qu’elle provoque autrui.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: j’ai parlé jusqu’à présent
  rationale: Le parfait récapitule son acte de parole prolongé jusqu’au moment présent, et עַד הֵנָּה a ici une valeur temporelle.
theological_decisions:
- issue: Portée morale de בְּלִיָּעַל
  choice: femme indigne
  alternative: femme perverse; fille de Bélial
  rationale: Le mot fonctionne ici comme un qualificatif d’indignité morale et non comme le nom propre d’un être démoniaque. La traduction évite donc une lecture théologique anachronique tout en conservant la sévérité de l’expression.
translation_notes:
  register: Français moderne, naturel et digne. Le tutoiement correspond à l’adresse directe d’Anne à Éli dans un cadre narratif ancien. La phrase conserve l’intensité de sa détresse ainsi que l’ambiguïté de כעס entre chagrin, dépit et irritation.
