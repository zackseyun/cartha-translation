id: 1SA.1.26
reference: 1 Samuel 1:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ בִּ֣י אֲדֹנִ֔/י חֵ֥י נַפְשְׁ/ךָ֖ אֲדֹנִ֑/י אֲנִ֣י הָ/אִשָּׁ֗ה הַ/נִּצֶּ֤בֶת עִמְּ/כָה֙ בָּ/זֶ֔ה לְ/הִתְפַּלֵּ֖ל אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: fr
  text: 'Elle dit : « Je vous en prie, mon seigneur ! Aussi vrai que vous êtes vivant, mon seigneur, je suis la femme qui se tenait ici près de vous pour prier Yahweh. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי
  choice: Je vous en prie
  rationale: Dans cette adresse directe, la particule introduit une supplication respectueuse ; cette expression en restitue naturellement la déférence.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’un titre respectueux adressé à Éli, et non d’un titre divin. La formulation conserve la déférence sociale de l’hébreu.
- source_word: חֵי נַפְשְׁךָ
  choice: Aussi vrai que vous êtes vivant
  rationale: Cette formule de serment invoque la vie de l’interlocuteur. La traduction en communique la force idiomatique sans imposer le littéralisme peu naturel « votre âme vit ».
- source_word: הָאִשָּׁה הַנִּצֶּבֶת
  choice: la femme qui se tenait
  rationale: L’article défini identifie la femme déjà vue par Éli, tandis que le participe décrit sa position lors de la scène antérieure.
- source_word: עִמְּכָה בָּזֶה
  choice: ici près de vous
  rationale: Dans ce contexte, עִם exprime la proximité plutôt que l’accompagnement, et בָּזֶה désigne le lieu présent.
- source_word: לְהִתְפַּלֵּל
  choice: pour prier
  rationale: L’infinitif exprime ici le but de sa présence ; « pour prier » suit directement la construction hébraïque et reste naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin, le tétragramme ; sa translittération préserve le nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Force de חֵי נַפְשְׁךָ
  choice: Aussi vrai que vous êtes vivant
  alternative: Par votre vie ; aussi vrai que votre âme vit
  rationale: La formulation est conservée comme serment solennel adressé à Éli, sans transformer נֶפֶשׁ en affirmation doctrinale sur la nature de l’âme.
translation_notes:
  register: Français moderne, international et digne. Le vouvoiement convient à l’adresse respectueuse faite à Éli. La répétition de « mon seigneur », présente dans l’hébreu, est conservée. Aucun marqueur de note n’est nécessaire, puisque la formule de serment est rendue directement et naturellement dans le texte.
