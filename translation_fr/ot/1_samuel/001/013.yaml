base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: fr
  text: Anne parlait dans son cœur ; seules ses lèvres remuaient[a], mais on n’entendait pas sa voix. Éli pensa donc qu’elle était ivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « se parlait à elle-même » ou « priait intérieurement ». L’hébreu dit littéralement : « parlait dans son cœur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: parlait dans son cœur
  rationale: Cette formulation conserve l’image hébraïque d’une parole intérieure et reste intelligible en français. Le contexte indique qu’Anne s’exprime sans faire entendre sa voix.
- source_word: רַק
  choice: seules
  rationale: 'Le terme marque une restriction : ses lèvres sont le seul signe extérieur perceptible. L’accord avec « lèvres » donne une tournure française naturelle.'
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: ses lèvres remuaient
  rationale: Le verbe désigne ici le mouvement visible des lèvres. « Remuaient » est idiomatique et rend l’aspect continu de la scène.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: mais on n’entendait pas sa voix
  rationale: La construction passive hébraïque indique que sa voix n’était pas audible. La tournure impersonnelle est naturelle en français, et « mais » explicite le contraste porté par le contexte.
- source_word: וַיַּחְשְׁבֶהָ
  choice: Éli pensa donc qu’elle était
  rationale: Le verbe exprime le jugement qu’Éli porte sur Anne. « Pensa qu’elle était » est clair et naturel ; « donc » fait ressortir l’inférence narrative sans ajouter de contenu substantiel.
- source_word: לְשִׁכֹּרָה
  choice: ivre
  rationale: L’adjectif féminin désigne une femme en état d’ivresse. « Ivre » est le prédicat français direct et digne qui convient ici.
- source_word: וְחַנָּה הִיא
  choice: Anne
  rationale: Le nom est rendu directement, sans ajouter un marqueur temporel absent de l’hébreu. Le pronom hébreu contribue à la mise en relief du sujet, que le contexte français permet de laisser implicite.
