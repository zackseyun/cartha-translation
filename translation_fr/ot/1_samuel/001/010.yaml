  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: fr
  text: Elle avait l’âme amère[a]. Elle pria Yahweh et pleura abondamment[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « amère d’âme »; expression désignant une profonde détresse intérieure.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une tournure intensive, littéralement : « pleurant, elle pleura »; on peut aussi comprendre : « elle ne cessait de pleurer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: l’âme remplie d’amertume
  rationale: Cette formulation conserve l’image hébraïque de l’amertume intérieure tout en étant naturelle en français moderne; elle exprime une profonde détresse sans réduire la métaphore à une simple explication.
- source_word: וַתִּתְפַּלֵּל
  choice: elle pria
  rationale: Le hitpael de פלל signifie ici simplement « prier »; l’intensité ressort déjà de l’amertume et des pleurs qui entourent le verbe.
- source_word: עַל יְהוָה
  choice: elle pria Yahweh
  rationale: Avec le verbe « prier », la préposition עַל indique ici que la prière est adressée à Yahweh. En français, le complément direct après « prier » est idiomatique et clair.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription « Yahweh » préserve le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: וּבָכֹה תִבְכֶּה
  choice: pleura abondamment
  rationale: La construction associant l’infinitif absolu au verbe conjugué intensifie l’action. « Pleura abondamment » rend cette insistance sans importer dans le verbe lui-même la notion d’amertume déjà présente au début du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » maintient le nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La division en deux phrases évite une accumulation de coordinations tout en conservant la progression du texte. « Âme » maintient l’image anthropologique hébraïque, et « abondamment » préserve l’intensification sans répéter artificiellement « amertume ».
