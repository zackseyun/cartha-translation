  text: וַ/יַּ֧עַן עֵלִ֛י וַ/יֹּ֖אמֶר לְכִ֣י לְ/שָׁל֑וֹם וֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל יִתֵּן֙ אֶת שֵׁ֣לָתֵ֔/ךְ אֲשֶׁ֥ר שָׁאַ֖לְתְּ מֵ/עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: fr
  text: 'Alors Éli répondit : « Va en paix, et que le Dieu d’Israël t’accorde la demande que tu lui as faite[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que tu lui as demandé ».
    reason: Alternative lexicale naturelle pour l’expression hébraïque désignant l’objet de la prière.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: La combinaison hébraïque « répondit et dit » introduit une réplique. En français actuel, « répondit » rend naturellement les deux verbes sans lourdeur.
- source_word: לְכִי לְשָׁלוֹם
  choice: Va en paix
  rationale: Cette formule idiomatique exprime à la fois le départ et un souhait de bien-être; « Va en paix » en conserve la forme brève et solennelle.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement le groupe construit hébreu désignant le Dieu d’Israël.
- source_word: יִתֵּן
  choice: que ... t’accorde
  rationale: Dans cette bénédiction, le verbe « donner » a une valeur de souhait. « Accorder » convient naturellement à une demande adressée à Dieu.
- source_word: שֵׁלָתֵךְ אֲשֶׁר שָׁאַלְתְּ
  choice: la demande que tu lui as faite
  rationale: Cette formulation conserve le nom « demande » et le verbe apparenté de l’hébreu tout en restant idiomatique en français.
- source_word: מֵעִמּוֹ
  choice: lui
  rationale: Le pronom masculin singulier renvoie naturellement au Dieu d’Israël dans le contexte. La construction française « faire une demande à quelqu’un » exige ici le pronom indirect « lui ».
theological_decisions:
- issue: Référent du pronom dans מֵעִמּוֹ
  choice: Le pronom renvoie à Dieu.
  alternative: Laisser le référent formellement indéterminé.
  rationale: Le contexte immédiat présente la requête d’Anne comme adressée à Dieu, et « le Dieu d’Israël » est l’antécédent explicite dans la phrase. Le pronom français « lui » préserve la référence pronominale sans ajouter de nom.
- issue: Valeur modale de יִתֵּן
  choice: 'Un souhait ou une bénédiction : « que ... t’accorde ».'
  alternative: 'Une affirmation prédictive : « le Dieu d’Israël t’accordera ».'
  rationale: Après « Va en paix », la forme verbale exprime le plus naturellement le souhait d’Éli plutôt qu’une promesse catégorique; la traduction conserve ainsi la nuance modale sans transformer Éli en garant du résultat.
translation_notes:
  register: Français international moderne, simple et digne. Le discours direct garde la brièveté de la bénédiction hébraïque; la redondance narrative « répondit et dit » est allégée selon l’usage naturel du français.
