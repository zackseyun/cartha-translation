source:
  edition: WLC
  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: fr
  text: Mais à Anne, il donnait une double part[a], car il aimait Anne, et Yahweh avait fermé son sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « une part, deux visages/narines ». L’expression est difficile et peut désigner une double part ou une part de choix.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/חַנָּה
  choice: Mais à Anne
  rationale: La conjonction et la préposition signifient littéralement « et à Anne »; « mais » rend naturellement le contraste avec les parts données à Peninna et à ses enfants au verset précédent.
- source_word: יִתֵּן
  choice: il donnait
  rationale: Dans ce contexte narratif au passé, l’inaccompli décrit vraisemblablement une habitude d’Elqana lors du sacrifice annuel.
- source_word: מָנָה
  choice: part
  rationale: Le nom désigne la part attribuée à quelqu’un dans le repas sacrificiel; « part » est courant, clair et précis en français.
- source_word: אַחַת אַפָּיִם
  choice: une double part
  rationale: L’expression, littéralement difficile, est généralement comprise comme une part double ou particulièrement avantageuse. La traduction principale retient le sens probable, tandis que la note conserve l’incertitude lexicale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison pour laquelle Elqana accordait cette part à Anne.
- source_word: אֶת חַנָּה אָהֵב
  choice: il aimait Anne
  rationale: Cette formulation directe reproduit simplement l’affirmation de l’amour d’Elqana pour Anne.
- source_word: וַֽ/יהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le nom divin יהוה; sa translittération préserve le nom propre plutôt que de le remplacer par un titre.
- source_word: סָגַר רַחְמָהּ
  choice: l’avait empêchée d’avoir des enfants
  rationale: Littéralement, Yahweh « avait fermé son sein ». La formulation choisie exprime clairement en français actuel l’effet de cette image tout en maintenant l’attribution directe de la stérilité à Yahweh.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie le tétragramme comme nom propre. « Yahweh » le conserve explicitement sans le remplacer par un titre.
- issue: Rapport entre l’amour d’Elqana et la stérilité d’Anne
  choice: alors même que Yahweh l’avait empêchée d’avoir des enfants
  alternative: et Yahweh l’avait empêchée d’avoir des enfants
  rationale: 'Le waw hébreu est formellement coordonnant, mais la juxtaposition crée probablement un contraste: Elqana aimait Anne malgré sa stérilité. « Alors même que » rend ce rapport sans atténuer l’affirmation selon laquelle Yahweh avait causé sa condition.'
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait exprime l’action habituelle. « Double part » privilégie le sens le plus probable, avec la difficulté de l’hébreu signalée en note. La formulation concernant la stérilité évite l’expression peu naturelle « fermer son sein » tout en conservant l’action explicite de Yahweh.
