revisions:
- from: Sa rivale ne cessait de la provoquer cruellement pour la tourmenter[a], parce que Yahweh l’avait rendue stérile.
  to: Sa rivale[a] la provoquait sans cesse afin de la tourmenter[b], car Yahweh avait fermé son sein.
  rationale: La révision conserve l’action habituelle et hostile de la rivale, ainsi que le but de susciter la détresse. Elle restitue l’image hébraïque de Yahweh qui « ferme le sein », plutôt que de la remplacer par « rendre stérile ». Les deux difficultés lexicales pertinentes—la rivale/coépouse et le verbe rare désignant l’agitation ou le trouble—sont documentées par des notes distinctes.
