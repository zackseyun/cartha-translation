  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: fr
  text: Sa rivale[a] la provoquait sans cesse afin de la tourmenter[b], car Yahweh avait fermé son sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sa coépouse » : le terme hébreu désigne ici une femme dans une relation de rivalité conjugale au sein du foyer.'
    reason: alternative_lexicale
  - marker: b
    text: Littéralement « pour l’agiter » ou « pour la troubler ». Le verbe hébreu est rare et son sens précis est incertain.
    reason: ambiguïté lexicale du verbe הַרְּעִמָהּ
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: ne cessait de la provoquer
  rationale: Le piel de כעס exprime ici l’action de provoquer ou d’exaspérer. Dans ce contexte narratif, l’imparfait français rend naturellement l’action habituelle et répétée.
- source_word: צָרָתָהּ
  choice: sa rivale
  rationale: Le nom désigne ici Peninna dans sa relation de rivalité conjugale avec Anne. « Sa rivale » est naturel en français et laisse la note préciser qu’il s’agit de l’autre épouse.
- source_word: גַּם כַּעַס
  choice: cruellement
  rationale: La construction intensive renforce l’idée de provocation pénible. « Cruellement » exprime la violence relationnelle sans reproduire lourdement la racine de la colère.
- source_word: בַּעֲבוּר הַרְּעִמָהּ
  choice: pour la tourmenter
  rationale: בַּעֲבוּר introduit le but. Le verbe rare רעם, sous cette forme, indique vraisemblablement qu’on cause agitation ou détresse; « tourmenter » restitue cette portée sans imposer le sens littéral incertain de « tonner ».
- source_word: כִּי
  choice: parce que
  rationale: 'La conjonction introduit la cause ou la circonstance exploitée par la rivale: Anne ne pouvait pas concevoir.'
- source_word: סָגַר ... בְּעַד רַחְמָהּ
  choice: l’avait rendue stérile
  rationale: L’expression hébraïque signifie littéralement que Yahweh avait « fermé son sein ». La formulation française choisie communique clairement l’absence de conception, tandis que la tournure littérale est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre.
theological_decisions:
- issue: Action de Yahweh sur la fécondité d’Anne
  choice: parce que Yahweh l’avait rendue stérile
  alternative: parce que Yahweh avait fermé son sein
  rationale: Le texte attribue explicitement à Yahweh la fermeture du sein d’Anne. La traduction conserve cette attribution directe sans l’atténuer, tout en exprimant idiomatiquement son effet en français.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin; « Yahweh » en préserve la fonction de nom plutôt que de lui substituer un titre.
translation_notes:
  register: Français international actuel, digne et accessible. L’imparfait marque l’action répétée. La formulation évite un calque lourd tout en conservant la dureté de la rivalité et l’attribution explicite à Yahweh.
