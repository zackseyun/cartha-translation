base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: fr
  text: 'Mais Anne répondit : « Non, mon seigneur. Je suis une femme profondément troublée[a]. Je n’ai bu ni vin ni boisson enivrante[b] ; j’ai répandu mon âme devant Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme à l’esprit dur » ; dans ce contexte, l’expression désigne une femme profondément affligée ou troublée.'
    reason: lexical_alternative
  - marker: b
    text: Ou « boisson alcoolisée » ; le terme hébreu désigne une boisson enivrante autre que le vin.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: Mais Anne répondit
  rationale: Le français naturel n’a pas besoin de conserver la formule hébraïque redondante « répondit et dit ». « Mais » rend la valeur adversative de la réponse d’Anne à l’accusation d’Éli.
- source_word: לֹא אֲדֹנִי
  choice: Non, mon seigneur
  rationale: אֲדֹנִי est ici une formule de déférence adressée à Éli, et non un titre divin. « Mon seigneur » conserve cette nuance sociale et la forme possessive.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: une femme profondément troublée
  rationale: L’expression décrit une détresse intérieure. Cette formulation française rend clairement l’intensité de קְשַׁת רוּחַ sans suggérer à tort un caractère dur ou obstiné ; la métaphore de l’esprit est signalée en note.
- source_word: וְיַיִן וְשֵׁכָר לֹא שָׁתִיתִי
  choice: Je n’ai bu ni vin ni boisson enivrante
  rationale: La construction « ni… ni… » rend naturellement la négation portant sur les deux boissons. שֵׁכָר désigne une boisson alcoolisée autre que le vin sans en préciser exactement la nature.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: j’ai répandu mon âme
  rationale: Cette traduction conserve l’image hébraïque forte d’une prière dans laquelle Anne expose tout son être, plutôt que de la remplacer par l’expression plus interprétative « ouvrir mon cœur ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend לִפְנֵי et présente la prière comme accomplie en présence de Dieu. Le nom propre Yahweh représente directement le tétragramme.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme, nom d’alliance de Dieu. « Yahweh » le distingue du titre אֲדֹנִי, employé dans le même verset pour Éli.
- issue: Sens de נֶפֶשׁ dans l’expression de la prière
  choice: âme
  alternative: cœur / être
  rationale: « Âme » préserve l’image du texte sans imposer une définition technique ou dualiste de la personne ; dans ce contexte, le terme désigne la vie intérieure et la personne elle-même.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe hébraïque redondante est allégée, tandis que les images essentielles (« répandu mon âme », « devant Yahweh ») sont conservées. Les appels de note sont placés sur les expressions auxquelles leurs notes se rapportent.
