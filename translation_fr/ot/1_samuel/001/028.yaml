base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: fr
  text: « Moi aussi, je le remets à Yahweh[a] ; pour tous les jours de sa vie, il est remis à Yahweh. » Et il se prosterna là devant Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu reprend la même racine que celle traduite plus tôt par « demander », créant un jeu de mots : Anne remet à Yahweh l’enfant qu’elle lui avait demandé. On peut aussi traduire : « je le donne à Yahweh » ou « je le consacre à Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction traditionnelle : « Et ils se prosternèrent là devant Yahweh. » Le sujet n’est pas explicitement nommé dans le texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: je le cède
  rationale: Le hiphil de שׁאל reprend le vocabulaire de la demande employé plus tôt dans le récit. En français, « céder » exprime naturellement qu’Anne remet durablement l’enfant à Yahweh, tandis qu’une note signale le jeu de mots hébreu que la traduction ne peut reproduire entièrement.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le datif indique le destinataire de la remise et de la consécration de Samuel. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: tant qu’il vivra
  rationale: Cette tournure française idiomatique rend l’expression hébraïque désignant toute la durée de sa vie.
- source_word: שָׁאוּל
  choice: consacré
  rationale: Le participe passif appartient à la même racine שׁאל que הִשְׁאִלְתִּהוּ. « Consacré » explicite ici la portée durable de la remise à Yahweh, sans employer l’image française trompeuse d’un prêt temporaire.
- source_word: וַיִּשְׁתַּחוּ
  choice: il se prosterna
  rationale: Le verbe décrit une prosternation accomplie devant Dieu. La vocalisation massorétique favorise le singulier, mais l’identité du sujet demeure implicite et une autre tradition de traduction comprend le pluriel.
- source_word: שָׁם
  choice: là
  rationale: Équivalent français direct et naturel de l’adverbe de lieu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération préserve le nom propre d’alliance présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- issue: Sens de la remise de Samuel à Yahweh
  choice: je le cède… il sera consacré
  alternative: je le prête… il est prêté
  rationale: Le contexte présente une remise à vie, non un prêt temporaire. La formulation choisie en exprime la portée cultuelle, tandis que la note conserve le lien lexical avec la demande d’Anne.
- issue: Sujet de וַיִּשְׁתַּחוּ
  choice: il se prosterna
  alternative: ils se prosternèrent
  rationale: La forme massorétique se lit naturellement au singulier, mais le sujet précis n’est pas nommé et une lecture plurielle existe dans la tradition de traduction; l’alternative est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Céder » évite l’idée française d’un prêt provisoire, tandis que « consacré » rend explicite la remise de Samuel pour toute sa vie. La répétition de « Yahweh » suit celle du texte source.
