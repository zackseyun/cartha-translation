  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: fr
  text: Puis ils égorgèrent[a] le taureau et amenèrent le garçon[b] à Éli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tuèrent ». Le verbe hébreu peut avoir un sens plus général, mais « égorgèrent » correspond mieux au contexte sacrificiel.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’enfant ». Le terme hébreu naʿar peut désigner un garçon, un enfant ou un jeune homme selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Puis ils égorgèrent
  rationale: Le wayyiqtol fait progresser le récit. « Égorgèrent » exprime naturellement la mise à mort de l’animal dans ce contexte sacrificiel, tandis que « Puis » restitue la succession narrative.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne couramment un taureau, notamment dans les contextes sacrificiels. Le verset emploie ici le nom singulier défini sans préciser son âge.
- source_word: וַיָּבִיאוּ
  choice: et amenèrent
  rationale: Le second wayyiqtol poursuit la séquence. Avec une personne comme complément, « amener » est plus idiomatique en français que « apporter ».
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un enfant, un garçon ou un jeune homme. Dans ce contexte, Samuel est encore très jeune; « garçon » conserve toutefois la nuance masculine du terme.
- source_word: אֶל עֵלִי
  choice: à Éli
  rationale: אֶל indique ici un mouvement en direction d’une personne; « à Éli » en est le rendu français direct et naturel après « amenèrent ».
theological_decisions:
- issue: Nuance sacrificielle de la mise à mort
  choice: Employer « égorgèrent » afin de conserver la résonance sacrificielle probable sans ajouter d’explication au texte.
  alternative: Employer le terme plus général « tuèrent ».
  rationale: Le contexte immédiat concerne le culte et les offrandes à Silo. « Égorgèrent » rend précisément le geste associé au sacrifice tout en restant dans le champ sémantique du verbe hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression narrative hébraïque, le vocabulaire sacrificiel et l’étendue de sens de נַעַר au moyen d’une note.
