source:
  edition: WLC
  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: fr
  text: 'Elle fit un vœu en disant : « Yahweh des armées, si tu veux bien voir la détresse de ta servante, si tu te souviens de moi sans oublier ta servante, et si tu donnes à ta servante un fils[a], alors je le donnerai à Yahweh tous les jours de sa vie, et aucun rasoir ne passera sur sa tête[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une descendance d’hommes », expression qui désigne ici un enfant de sexe masculin.'
    reason: lexical_alternative
  - marker: b
    text: L’interdiction du rasoir rappelle le langage d’une consécration particulière associée au vœu de naziréat ; le verset énonce cette restriction sans employer le terme « nazir ».
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: Elle fit un vœu
  rationale: Le français naturel rend ainsi le complément interne hébreu, littéralement « elle voua un vœu », tout en conservant le caractère solennel de l’engagement.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » représente directement le nom divin, tandis que « des armées » conserve le titre צְבָאוֹת sans le paraphraser.
- source_word: אִם רָאֹה תִרְאֶה
  choice: si vraiment tu regardes
  rationale: L’adverbe « vraiment » restitue l’intensification produite par l’infinitif absolu associé au verbe fini.
- source_word: בָּעֳנִי
  choice: la détresse
  rationale: Le terme peut désigner l’affliction, la misère ou l’humiliation. « Détresse » exprime naturellement la souffrance d’Anne sans en préciser excessivement la nature.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: ta servante
  rationale: Cette expression française naturelle conserve explicitement le genre féminin du terme hébreu et convient au langage humble de la prière.
- source_word: וּזְכַרְתַּנִי
  choice: tu te souviens de moi
  rationale: Rend directement le vocabulaire biblique du souvenir dans une requête adressée à Dieu.
- source_word: וְלֹא תִשְׁכַּח אֶת אֲמָתֶךָ
  choice: n’oublies pas ta servante
  rationale: Préserve le parallélisme avec « tu te souviens de moi » et la progression insistante de la demande.
- source_word: וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים
  choice: que tu lui donnes un fils
  rationale: L’expression hébraïque, littéralement « descendance d’hommes », désigne ici un enfant de sexe masculin. « Un fils » est la formulation française la plus naturelle, avec une note conservant l’image littérale.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: alors je le donnerai à Yahweh
  rationale: Le verbe signifie simplement « donner ». Cette formulation évite d’ajouter dans le texte le terme interprétatif « consacrer ».
- source_word: כָּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: Traduction formellement proche qui maintient l’idée de totalité et la durée viagère du vœu.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: aucun rasoir ne passera sur sa tête
  rationale: Conserve l’image concrète de l’hébreu dans un français intelligible, sans remplacer la restriction explicite par une interprétation générale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » représente le nom propre divin au lieu de le remplacer par un titre.
- issue: Portée nazaréenne possible de l’interdiction du rasoir
  choice: Conserver la formulation concrète sans qualifier Samuel de nazir dans le texte principal
  alternative: Rendre explicitement le vœu comme un vœu de naziréat
  rationale: La formulation rappelle la consécration du nazir, mais ce verset ne donne pas lui-même ce titre et n’énonce explicitement que le don à vie et l’interdiction du rasoir.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « ta servante » est maintenue parce qu’elle structure l’insistance humble de la prière. La syntaxe cumulative conserve le mouvement du texte hébreu tout en restant naturelle en français.
