source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ עֵלִ֔י עַד מָתַ֖י תִּשְׁתַּכָּרִ֑י/ן הָסִ֥ירִי אֶת יֵינֵ֖/ךְ מֵ/עָלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/014.yaml
  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
translation:
  language: fr
  text: 'Éli lui dit : « Jusqu’à quand seras-tu ivre[a] ? Éloigne de toi ton vin[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jusqu’à quand continueras-tu à t’enivrer ? » Le verbe hébreu peut désigner le fait de devenir ivre ou celui de se trouver en état d’ivresse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « retire ton vin de sur toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: Éli lui dit
  rationale: Tour narratif naturel en français, qui rend directement le wayyiqtol et le complément « à elle » sans alourdir la phrase.
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Expression française naturelle qui conserve la forme temporelle et la vigueur du reproche hébreu.
- source_word: תִּשְׁתַּכָּרִין
  choice: seras-tu ivre
  rationale: Le hitpael imperfectif peut évoquer l’entrée dans l’ivresse ou l’état d’ivresse. Dans ce reproche, cette formulation française reste naturelle sans préciser indûment si Éli vise le processus ou l’état.
- source_word: הָסִירִי
  choice: Éloigne
  rationale: L’impératif exprime l’action d’ôter ou d’écarter quelque chose de soi; « éloigne » s’accorde naturellement avec מֵעָלָיִךְ.
- source_word: אֶת יֵינֵךְ מֵעָלָיִךְ
  choice: de toi ton vin
  rationale: Cette formulation conserve l’image hébraïque selon laquelle le vin doit être retiré de dessus ou loin de la personne, tout en restant intelligible en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le reproche d’Éli demeure accusateur, tandis que l’ambiguïté lexicale du verbe relatif à l’ivresse est signalée en note.
