source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: fr
  text: 'Mais Anne ne monta pas, car elle dit à son mari : « Je ne l’emmènerai que lorsque le garçon sera sevré. Alors il se présentera devant Yahweh[a] et restera là pour toujours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre analyse ou tradition textuelle : « Alors je paraîtrai devant Yahweh, et il restera là pour toujours. »'
    reason: alternative_reading
  - marker: b
    text: Ici, « pour toujours » désigne la consécration permanente de Samuel au service de Yahweh, c’est-à-dire pour le reste de sa vie.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: ne monta pas
  rationale: Le verbe עלה signifie couramment « monter » et désigne ici la montée au sanctuaire de Silo. Le rendu conserve l’expression hébraïque, naturelle aussi en français dans ce contexte.
- source_word: כִּי אָמְרָה לְאִישָׁהּ
  choice: car elle dit à son mari
  rationale: כִּי introduit la raison de l’absence d’Anne, et אִישׁ avec le suffixe désigne ici clairement son mari.
- source_word: עַד יִגָּמֵל הַנַּעַר וַהֲבִאֹתִיו
  choice: Je ne l’emmènerai que lorsque le garçon sera sevré
  rationale: 'Cette formulation française exprime naturellement la limite temporelle marquée par עַד : Anne attendra le sevrage avant d’emmener Samuel. « Emmener » convient au déplacement d’un enfant vers le sanctuaire.'
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un enfant ou un garçon. Ici, « le garçon » reste proche du lexique hébreu tout en étant clair en français moderne.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: Alors il se présentera devant Yahweh
  rationale: Le nifal de ראה dans cette formule cultuelle signifie « paraître/se présenter devant ». « Se présentera » est idiomatique et le sujet masculin est compris comme Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver son caractère de nom propre.
- source_word: וְיָשַׁב שָׁם
  choice: et restera là
  rationale: ישב exprime ici la résidence durable de Samuel au sanctuaire. « Restera là » est actuel, clair et digne.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: L’expression désigne une durée permanente dans le cadre du vœu, comprise contextuellement comme la consécration de Samuel pour toute sa vie.
theological_decisions:
- issue: Sujet de « se présentera devant Yahweh » et de « restera là »
  choice: Samuel est le sujet des deux verbes.
  alternative: 'Selon une autre analyse ou tradition textuelle : « je paraîtrai devant Yahweh, et il restera là pour toujours ».'
  rationale: Dans le texte massorétique vocalisé, la suite après « je l’emmènerai » se comprend naturellement comme ayant Samuel pour sujet. L’autre lecture est toutefois ancienne et significative; elle est donc signalée en note sans effacer l’ambiguïté textuelle.
- issue: Portée de « pour toujours »
  choice: Conserver l’expression « pour toujours » dans le texte.
  alternative: Expliciter « toute sa vie ».
  rationale: Le rendu littéral préserve la force de עַד עוֹלָם, tandis qu’une note précise qu’il s’agit ici de la consécration permanente de Samuel au service de Yahweh, c’est-à-dire pour le reste de sa vie.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « ne… que lorsque » restitue la valeur temporelle de עַד sans calquer lourdement l’hébreu. « Se présentera devant » conserve la portée cultuelle de l’expression, et « restera là » évite un registre archaïque.
