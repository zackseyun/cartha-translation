base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: fr
  text: 'Elqana, son mari, lui dit : « Fais ce qui te paraît bon. Reste jusqu’à ce que tu l’aies sevré. Seulement, que Yahweh accomplisse sa parole[a] ! » La femme resta et allaita son fils jusqu’à ce qu’elle l’ait sevré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confirme » ou « réalise sa parole ». L’hébreu peut renvoyer à la promesse de Yahweh ou à l’affaire dont il vient d’être question.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: son mari
  rationale: Dans ce contexte, אִישׁ avec le suffixe possessif désigne la relation conjugale d’Anne avec Elqana ; « son mari » est naturel et précis en français.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: Fais ce qui te paraît bon
  rationale: Cette formulation française naturelle conserve l’idée de ce qui est bon aux yeux d’Anne, c’est-à-dire selon son propre jugement.
- source_word: שְׁבִי
  choice: Reste ici
  rationale: Le verbe signifie ici demeurer sur place plutôt que s’asseoir. « Ici » explicite naturellement la valeur contextuelle sans modifier le sens.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: jusqu’à ce que tu l’aies sevré / jusqu’à ce qu’elle l’ait sevré
  rationale: Dans le contexte des soins donnés à un jeune enfant, גמל désigne clairement le sevrage.
- source_word: אַךְ
  choice: Seulement
  rationale: Le terme introduit une réserve ou une condition à la permission qui précède.
- source_word: יָקֵם
  choice: que … accomplisse
  rationale: Le jussif exprime un souhait ou une prière. « Accomplisse » rend naturellement le causatif de קום appliqué à une parole, tout en laissant à la note les nuances possibles de confirmation et de réalisation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le distinguer d’un titre tel que « le Seigneur ».
- source_word: דְּבָרוֹ
  choice: sa parole
  rationale: דבר peut désigner une parole, une promesse ou une affaire. « Sa parole » suit directement l’hébreu et préserve l’ambiguïté du référent.
- source_word: וַתֵּינֶק
  choice: allaita
  rationale: Le verbe désigne le fait de nourrir un enfant au sein. « Allaita » est clair, actuel et précis en français.
- source_word: הָאִשָּׁה
  choice: La femme
  rationale: L’hébreu emploie ici le nom commun défini plutôt que le nom propre Anne ; la traduction en conserve la forme.
theological_decisions:
- issue: Référent et portée de « sa parole »
  choice: Conserver « sa parole » sans préciser davantage
  alternative: « sa promesse », « la parole concernant l’enfant » ou « qu’il confirme ton engagement »
  rationale: Le texte hébreu dit littéralement « sa parole » et peut évoquer une promesse de Yahweh ou l’affaire qui vient d’être exprimée. La traduction ne tranche pas cette ambiguïté interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste légèrement marqué par l’idiome hébreu sans devenir artificiel ; les temps verbaux français distinguent naturellement l’ordre, le souhait et le récit.
