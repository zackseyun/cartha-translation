id: 1SA.1.3
reference: 1 Samuel 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: fr
  text: Cet homme montait chaque année de sa ville à Silo pour se prosterner devant Yahweh des armées et lui offrir des sacrifices. Là, les deux fils d’Éli, Hophni et Pinhas, étaient prêtres de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: montait
  rationale: Dans ce contexte narratif, la forme décrit une action habituelle dans le passé. L’imparfait français exprime naturellement cette répétition tout en conservant le sens de « monter ».
- source_word: הָאִישׁ הַהוּא
  choice: Cet homme
  rationale: Le démonstratif renvoie précisément à Elkana, déjà présenté. « Cet homme » est naturel en français et maintient cette référence anaphorique.
- source_word: מֵעִירוֹ
  choice: de sa ville
  rationale: עִיר désigne une ville ou une localité. « Ville » constitue ici un équivalent direct sans précision contextuelle imposant un autre terme.
- source_word: מִיָּמִים יָמִימָה
  choice: chaque année
  rationale: L’expression idiomatique indique une récurrence annuelle. « Chaque année » est clair et naturel en français moderne.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: pour se prosterner devant
  rationale: Le verbe désigne concrètement l’action de se courber ou de se prosterner, ici comme acte d’adoration. Cette formulation conserve le geste exprimé par l’hébreu sans réduire celui-ci à une notion abstraite.
- source_word: וְלִזְבֹּחַ
  choice: et lui offrir des sacrifices
  rationale: Le verbe renvoie à l’immolation ou à l’offrande sacrificielle. La formulation française explicite naturellement que les sacrifices sont offerts à Yahweh.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » le distingue d’un titre tel que « le Seigneur » et préserve sa fonction de nom propre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Le pluriel צְבָאוֹת signifie « armées » ou « troupes ». « Yahweh des armées » rend le titre de manière transparente sans recourir au traditionnel mais moins immédiatement intelligible « des armées célestes » ou « des puissances ».
- source_word: בְּשִׁלֹה
  choice: à Silo
  rationale: La préposition « à » convient naturellement en français pour une ville envisagée comme destination et lieu du sanctuaire.
- source_word: וְשָׁם
  choice: Là
  rationale: L’adverbe locatif introduit directement et naturellement la situation des prêtres à Silo.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: les deux fils d’Éli
  rationale: Cette formulation suit l’ordre et la précision numérique de l’hébreu.
- source_word: חָפְנִי וּפִנְחָס
  choice: Hofni et Pinhas
  rationale: Ces formes correspondent à des translittérations françaises usuelles des noms hébreux.
- source_word: כֹּהֲנִים לַיהוָה
  choice: prêtres de Yahweh
  rationale: La construction indique leur fonction sacerdotale au service de Yahweh. « Prêtres de Yahweh » est concise, naturelle et garde le lien exprimé par לְ.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: L’hébreu emploie le tétragramme comme nom propre. « Yahweh » préserve cette donnée textuelle sans le remplacer par un titre ni adopter la forme hybride « Jéhovah ».
- issue: Rendu du titre יהוה צבאות
  choice: Yahweh des armées
  alternative: le Seigneur des armées / Yahweh des puissances
  rationale: « Des armées » rend directement צבאות et laisse ouverte la portée exacte du titre — armées célestes, armées d’Israël ou ensemble des puissances sous le commandement divin — plutôt que de trancher cette ambiguïté.
- issue: Nature de l’acte exprimé par השתחוה
  choice: se prosterner devant
  alternative: adorer
  rationale: Le contexte est cultuel, mais le verbe décrit aussi un geste corporel. Le choix retenu préserve ce sens concret tout en laissant clairement percevoir sa fonction d’adoration.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait marque la coutume passée; la phrase est légèrement restructurée pour une syntaxe française fluide. Les noms propres suivent des formes françaises courantes, et aucun vocabulaire confessionnel particulier n’est introduit.
