  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: fr
  text: 'Et cela se passait ainsi[a], année après année : chaque fois qu’elle montait à la maison de Yahweh[b], Peninna la provoquait de la même manière ; alors elle pleurait et ne mangeait pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il agissait ainsi, année après année. » Le verbe hébreu est au masculin singulier (« il faisait ») et peut désigner Elqana ; la proposition peut aussi résumer de façon idiomatique la situation qui se répétait.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « dans la maison de Yahweh ». La préposition hébraïque signifie littéralement « dans » ou « à » ; avec le verbe « monter », le français emploie naturellement « à » pour indiquer la destination.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: Et cela se passait ainsi
  rationale: Cette formulation française naturelle résume une situation habituelle. Le masculin singulier littéral du verbe peut aussi avoir Elqana pour sujet ; cette possibilité est conservée en note.
- source_word: שָׁנָה בְשָׁנָה
  choice: année après année
  rationale: Rend directement la valeur distributive et répétitive de l’expression hébraïque.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: chaque fois qu’elle montait
  rationale: מִדֵּי suivi de l’infinitif exprime ici la répétition ; le suffixe féminin renvoie à Anne.
- source_word: בְּבֵית יְהוָה
  choice: à la maison de Yahweh
  rationale: Avec « monter », la préposition française « à » exprime naturellement la destination, bien que ב signifie littéralement « dans » ou « à ».
- source_word: כֵּן תַּכְעִסֶנָּה
  choice: Peninna la provoquait de la même manière
  rationale: Le second כֵּן reprend la manière habituelle décrite au début, et le hifil de כעס exprime une provocation qui cause irritation ou chagrin. Le nom Peninna est repris du contexte pour lever une ambiguïté pronominale propre au français.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: alors elle pleurait et ne mangeait pas
  rationale: Dans ce résumé itératif, les formes verbales décrivent la réaction habituelle d’Anne plutôt qu’un seul événement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Sujet de יַעֲשֶׂה
  choice: 'tournure situationnelle : « cela se passait ainsi »'
  alternative: « il agissait ainsi », avec Elqana pour sujet
  rationale: Le verbe est formellement au masculin singulier et peut renvoyer à Elqana, mais la proposition peut aussi résumer idiomatiquement toute la situation répétée. La traduction principale suit cette seconde lecture tout en conservant la première en note.
translation_notes:
  register: Français international actuel, clair et digne. L’imparfait marque le caractère habituel de la scène. « Maison de Yahweh » conserve l’expression cultuelle et le nom divin ; « de la même manière » rend la reprise du second כֵּן sans alourdir la phrase.
