  text: וַ/יְהִי֙ לִ/תְקֻפ֣וֹת הַ/יָּמִ֔ים וַ/תַּ֥הַר חַנָּ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תִּקְרָ֤א אֶת שְׁמ/וֹ֙ שְׁמוּאֵ֔ל כִּ֥י מֵ/יְהוָ֖ה שְׁאִלְתִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: fr
  text: 'Quand le temps fut venu, Anne devint enceinte et mit au monde un fils[a]. Elle l’appela Samuel, car elle dit[b] : « Je l’ai demandé à Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « au cycle (ou au retour) des jours », expression indiquant que le moment attendu était arrivé.'
    reason: lexical_alternative
  - marker: b
    text: 'Le nom « Samuel » est ici rapproché par un jeu de mots du verbe hébreu שׁאל (sha’al), « demander » : « Je l’ai demandé à Yahweh. » Ce rapprochement n’établit pas nécessairement l’étymologie exacte du nom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: Quand le temps fut venu
  rationale: L’expression évoque littéralement le cycle ou le retour des jours, mais fonctionne ici comme une indication idiomatique de l’arrivée du moment attendu. Cette formulation est naturelle en français et conserve le sens temporel.
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Rendu courant et clair du verbe הרה dans un récit de naissance.
- source_word: וַתֵּלֶד בֵּן
  choice: mit au monde un fils
  rationale: Formulation française naturelle et digne pour exprimer la naissance d’un fils.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Elle l’appela
  rationale: Cette tournure restitue naturellement en français la formule hébraïque d’attribution du nom sans calquer maladroitement « elle appela son nom ».
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française traditionnelle et standard de ce nom propre.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: 'car elle dit : « Je l’ai demandé à Yahweh. »'
  rationale: Le discours direct explicite l’explication du nom sous-entendue par l’hébreu. « Je l’ai demandé à » conserve le lien avec le verbe שאל, tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à la forme du texte source et à la convention du projet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Explication du nom Samuel par le verbe שאל
  choice: Conserver dans le texte la déclaration « Je l’ai demandé » et expliquer le jeu de mots en note
  alternative: Présenter cette phrase comme une étymologie certaine du nom Samuel
  rationale: Le verset rapproche explicitement שְׁמוּאֵל du verbe שאל, « demander », mais l’étymologie exacte du nom demeure discutée. La note signale donc le jeu de mots sans transformer ce rapprochement narratif en affirmation étymologique incontestable.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple structure le récit, tandis que le passé composé dans la citation rend naturellement la parole d’Anne. Les deux appels de note figurent dans le texte principal.
