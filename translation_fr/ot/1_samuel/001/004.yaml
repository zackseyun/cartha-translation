  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: fr
  text: Quand venait le jour où Elqana offrait un sacrifice[a], il donnait des portions à Peninna, sa femme, ainsi qu’à tous ses fils et à toutes ses filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les formes verbales hébraïques peuvent aussi se comprendre comme une suite d’actions ponctuelles : « Quand vint le jour où Elqana offrit un sacrifice, il donna des portions… » Le contexte favorise toutefois la description d’une pratique répétée lors du sacrifice annuel.'
    reason: ambiguïté aspectuelle et temporelle
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Chaque fois que venait le jour
  rationale: La formule narrative introduit le moment du sacrifice. Dans le contexte d’une pratique annuelle répétée, « chaque fois » rend naturellement la valeur habituelle, sans réduire הַיּוֹם à une date précise.
- source_word: וַיִּזְבַּח
  choice: offrait un sacrifice
  rationale: Le verbe זבח désigne l’action sacrificielle, y compris l’abattage de la victime. Cette formulation française est naturelle et conserve le cadre cultuel sans insister sur le geste matériel.
- source_word: וְנָתַן
  choice: il donnait
  rationale: L’imparfait exprime l’action coutumière d’Elqana lors du repas sacrificiel. La forme hébraïque peut toutefois se lire comme un simple passé narratif, possibilité signalée en note.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: à Peninna, sa femme
  rationale: Cette formulation suit l’ordre hébreu tout en restant idiomatique en français.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: ainsi qu’à tous ses fils et à toutes ses filles
  rationale: La traduction conserve la mention explicite des fils et des filles ainsi que la portée de כָּל.
- source_word: מָנוֹת
  choice: des portions
  rationale: מָנוֹת désigne des parts attribuées, ici celles du repas sacrificiel. « Portions » est précis et naturel dans ce contexte.
