base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: fr
  text: 'Elle dit : « Que ta servante trouve grâce à tes yeux ! » Puis la femme s’en alla, mangea, et son visage ne fut plus abattu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : littéralement, « son visage ne fut plus pour elle », c’est-à-dire que son expression ne fut plus comme auparavant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא שִׁפְחָתְךָ חֵן בְּעֵינֶיךָ
  choice: Que ta servante trouve grâce à tes yeux !
  rationale: La forme verbale exprime ici un souhait respectueux. « Ta servante » conserve le féminin explicite de l’hébreu, tandis que « trouver grâce aux yeux de quelqu’un » restitue l’image idiomatique de l’accueil favorable.
- source_word: לְדַרְכָּהּ
  choice: s’en alla
  rationale: L’expression indique qu’Anne part et poursuit son chemin ; « s’en alla » est idiomatique et naturel en français.
- source_word: וַתֹּאכַל
  choice: mangea
  rationale: Le verbe narratif décrit simplement l’action suivante, en contraste avec l’incapacité d’Anne à manger au verset 7.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: son visage ne fut plus abattu
  rationale: La formulation hébraïque est elliptique, littéralement proche de « son visage ne fut plus pour elle ». Le contexte indique que son expression ne manifestait plus la même tristesse ; « abattu » rend ce changement visible sans préciser davantage sa disposition intérieure.
