  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: fr
  text: Lorsqu’elle l’eut sevré, elle l’emmena avec elle, avec trois taureaux[a], un épha de farine et une outre de vin, et le conduisit à la maison de Yahweh, à Silo. Le garçon était encore tout jeune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu massorétique porte « trois taureaux » ; certains témoins anciens et interprètes comprennent « un taureau de trois ans ».
    reason: Variante textuelle et interprétative notable, notamment en lien avec le singulier du verset suivant.
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: elle l’emmena avec elle
  rationale: Le verbe עלה évoque littéralement une montée, notamment celle d’un pèlerin vers le sanctuaire. Dans ce contexte, « elle l’emmena avec elle » exprime naturellement le déplacement en français, sans confondre ce verbe avec וַתְּבִאֵהוּ, rendu ensuite par « le conduisit ».
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: Lorsqu’elle l’eut sevré
  rationale: Dans ce contexte, גמל désigne le sevrage de l’enfant. Le passé antérieur marque clairement que celui-ci était achevé avant le départ.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: avec trois taureaux
  rationale: Le texte massorétique porte clairement le pluriel « trois taureaux ». La variante ancienne « un taureau de trois ans » est signalée en note sans remplacer le texte hébreu reçu.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: un épha de farine
  rationale: « Épha » conserve le nom de l’ancienne mesure de capacité, tandis que קֶמַח désigne ici de la farine.
- source_word: וְנֵבֶל יַיִן
  choice: une outre de vin
  rationale: נֵבֶל désigne ici un récipient destiné au vin ; « outre » est précis, courant et adapté au contexte ancien.
- source_word: וַתְּבִאֵהוּ
  choice: le conduisit
  rationale: La forme causative de בוא signifie « faire venir, amener ». « Le conduisit » exprime clairement l’arrivée de l’enfant au sanctuaire et évite une répétition lourde avec « emmena ».
- source_word: בֵית יְהוָה שִׁלוֹ
  choice: la maison de Yahweh, à Silo
  rationale: « Maison de Yahweh » désigne le sanctuaire. La virgule rend clairement Silo comme le lieu où se trouve cette maison.
- source_word: וְהַנַּעַר נָעַר
  choice: Le garçon était encore tout jeune
  rationale: La répétition hébraïque de נַעַר souligne le très jeune âge de Samuel. « Encore tout jeune » en restitue l’insistance dans un français naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel / Jéhovah
  rationale: Le texte emploie le nom divin personnel. « Yahweh » le représente directement au lieu de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « lorsqu’elle l’eut sevré » garde une légère solennité narrative ; « encore tout jeune » restitue sans littéralisme maladroit l’insistance de la répétition hébraïque.
