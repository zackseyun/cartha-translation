  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: fr
  text: Comme elle priait longuement devant Yahweh[a], Éli observait sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Et il arriva, comme elle prolongeait sa prière devant Yahweh, qu’Éli observait sa bouche. »'
    reason: Signaler la forme plus littérale de la formule narrative וְהָיָה כִּי et de l’expression הִרְבְּתָה לְהִתְפַּלֵּל.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Comme
  rationale: La formule narrative introduit ici la circonstance temporelle de l’action suivante. « Comme » restitue naturellement ce rapport en français sans reproduire lourdement l’hébreu par « Et il arriva que, lorsque ».
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: elle priait longuement
  rationale: Le hiphil de רבה suivi de l’infinitif exprime l’abondance ou la prolongation de l’action. « Priait longuement » conserve cette durée tout en restant naturel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend l’idée d’une prière offerte en présence de Dieu, tandis que « Yahweh » représente directement le nom divin.
- source_word: שֹׁמֵר
  choice: observait
  rationale: Le participe qal décrit une action en cours. « Observait » exprime l’attention soutenue d’Éli sans ajouter l’idée de surveillance hostile.
- source_word: אֶת פִּיהָ
  choice: sa bouche
  rationale: Le nom hébreu signifie littéralement « bouche ». Cette formulation reste distincte de la mention précise des lèvres au verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait rend les deux actions en cours; « priait longuement » évite une tournure hébraïsante tout en conservant l’idée de durée.
