base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: fr
  text: Ils se levèrent de bon matin et se prosternèrent devant Yahweh. Puis ils repartirent et rentrèrent chez eux, à Rama. Elqana s’unit à Anne, sa femme[a], et Yahweh se souvint d’elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « connut Anne, sa femme ». En hébreu, « connaître » est ici un euphémisme courant pour les relations conjugales.'
    reason: lexical_alternative
  - marker: b
    text: 'En hébreu, « se souvenir » signifie souvent davantage qu’un simple rappel mental : l’expression peut indiquer que Dieu porte sur quelqu’un une attention fidèle qui conduit à l’action.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Ils se levèrent de bon matin
  rationale: La combinaison du verbe שׁכם au hifil et de בַבֹּקֶר souligne qu’ils se levèrent tôt. « De bon matin » est naturel en français moderne et conserve cette précision temporelle.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: et se prosternèrent devant Yahweh
  rationale: השתחוה décrit concrètement le fait de s’incliner ou de se prosterner. « Se prosternèrent » conserve le geste corporel et sa portée cultuelle sans le remplacer par le terme plus général « adorèrent ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que par un titre.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: Puis ils repartirent et rentrèrent chez eux, à Rama
  rationale: La formulation conserve les deux verbes successifs de déplacement tout en restant idiomatique en français. La finale directionnelle situe leur maison à Rama.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: Elqana s’unit à Anne, sa femme
  rationale: ידע est ici l’euphémisme hébreu habituel pour les relations conjugales. « S’unit à » garde un registre digne et discret, tandis que la note signale l’expression littérale. Les noms suivent leurs formes françaises courantes.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: Yahweh se souvint d’elle
  rationale: « Se souvint » traduit directement זכר et préserve l’idiome biblique, qui évoque ici une attention effective de Dieu sans expliciter par anticipation l’issue racontée ensuite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Degré d’explicitation de l’euphémisme sexuel ידע
  choice: s’unit à
  alternative: connut
  rationale: « Conn connut sa femme » reproduirait formellement l’hébreu, mais son sens est opaque ou archaïque pour beaucoup de lecteurs modernes. « S’unit à » transmet discrètement le sens conjugal sans adopter une formulation clinique ni crue; la note conserve l’accès à l’image source.
- issue: Portée de la mémoire divine
  choice: Yahweh se souvint d’elle
  alternative: Yahweh intervint en sa faveur
  rationale: L’hébreu suggère davantage qu’un simple rappel mental, mais ne décrit pas encore explicitement l’action qui en découle. Le rendu littéral préserve cette tension, précisée sans être résolue dans la note.
translation_notes:
  register: Français international moderne, narratif et digne. Les gestes et les idiomes théologiquement significatifs sont conservés lorsque leur sens demeure accessible; l’euphémisme conjugal est rendu de façon naturelle et expliqué en note. Les marqueurs [a] et [b] sont placés après les expressions auxquelles leurs notes se rapportent.
