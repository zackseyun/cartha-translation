  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: fr
  text: Il avait deux épouses. L’une s’appelait Anne, et la seconde s’appelait Peninna. Peninna avait des enfants, mais Anne n’en avait pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹו
  choice: Il avait
  rationale: La construction possessive hébraïque, littéralement « et à lui », se rend naturellement en français par « il avait »; la conjonction est intégrée à l’enchaînement du récit.
- source_word: שְׁתֵּי נָשִׁים
  choice: deux femmes
  rationale: Dans ce contexte, « femmes » désigne clairement les épouses d’Elqana et exprime naturellement en français la situation conjugale polygynique.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: L’une s’appelait… et la seconde…
  rationale: Cette formulation française courante conserve la distinction inhabituelle entre « l’une » et « la seconde », sans reproduire lourdement la répétition hébraïque du mot « nom ».
- source_word: חַנָּה
  choice: Anne
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu חַנָּה.
- source_word: פְּנִנָּה
  choice: Peninna
  rationale: Translittération française claire du nom hébreu, sans h final non prononcé.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: Peninna avait des enfants
  rationale: La tournure existentielle et possessive est rendue idiomatiquement; יְלָדִים est le terme général « enfants ».
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: mais Anne n’en avait pas
  rationale: « Mais » explicite le contraste marqué par la juxtaposition, tandis que le pronom « en » évite une répétition peu naturelle sans modifier le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation privilégie la fluidité narrative tout en conservant le contraste central entre les deux femmes et leur situation quant aux enfants.
