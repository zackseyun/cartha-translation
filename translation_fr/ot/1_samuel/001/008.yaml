  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: fr
  text: 'Alors Elkana, son mari, lui dit : « Anne, pourquoi pleures-tu ? Pourquoi ne manges-tu pas ? Pourquoi ton cœur est-il affligé[a] ? Ne suis-je pas meilleur pour toi que dix fils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pourquoi ton cœur est-il mauvais ? » L’expression peut aussi signifier : « pourquoi ton cœur est-il triste ? »'
    reason: L’hébreu emploie une expression idiomatique dont le sens contextuel est le chagrin ou la détresse intérieure.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » exprime naturellement cette progression en français.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: Elkana, son mari
  rationale: Cette formulation conserve l’identification appositive tout en respectant l’ordre naturel du français.
- source_word: לָמֶה
  choice: pourquoi
  rationale: L’interrogatif est rendu de la même manière dans chacune des trois questions afin de préserver la répétition rhétorique.
- source_word: תִבְכִּי
  choice: pleures-tu
  rationale: Le présent français convient à l’action en cours constatée par Elkana.
- source_word: לֹא תֹאכְלִי
  choice: ne manges-tu pas
  rationale: Cette traduction décrit le refus ou l’absence actuelle de nourriture sans ajouter une nuance de volonté absente du texte.
- source_word: יֵרַע לְבָבֵךְ
  choice: ton cœur est-il affligé
  rationale: L’expression signifie littéralement que le cœur « va mal » ou « est mauvais » ; dans ce contexte, elle désigne le chagrin intérieur. « Affligé » garde l’image du cœur et exprime clairement la détresse.
- source_word: הֲלוֹא אָֽנֹכִי
  choice: Ne suis-je pas
  rationale: La question négative attend une réponse affirmative, comme en hébreu.
- source_word: טוֹב לָךְ
  choice: meilleur pour toi
  rationale: Le comparatif est conservé sans reformuler la déclaration d’Elkana ni en atténuer la portée.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: que dix fils
  rationale: Le texte parle précisément de fils ; le nombre dix, possiblement expressif d’abondance, est laissé sans explicitation interprétative.
theological_decisions:
- issue: Sens genré de בָּנִים
  choice: fils
  alternative: enfants
  rationale: Le nom hébreu est explicitement masculin et le contexte met en jeu la valeur culturellement attachée à la naissance de fils ; une généralisation en « enfants » effacerait cette précision.
- issue: Portée de la comparaison d’Elkana
  choice: Ne suis-je pas meilleur pour toi que dix fils ?
  alternative: Est-ce que je ne compte pas plus pour toi que dix fils ?
  rationale: La formulation retenue préserve directement le langage comparatif du texte et la tension de la prétention d’Elkana, sans l’expliquer ni la valider.
translation_notes:
  register: Français international moderne, naturel et digne. Les trois questions en « pourquoi » sont maintenues, ainsi que l’image hébraïque du cœur. Le tutoiement correspond à l’échange entre époux dans ce récit.
