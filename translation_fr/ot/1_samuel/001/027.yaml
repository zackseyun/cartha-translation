  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: fr
  text: C’est pour ce garçon que j’ai prié[a], et Yahweh m’a accordé la demande que je lui avais faite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est au sujet de ce garçon que j’ai prié. » La préposition hébraïque peut introduire ce sur quoi portait la prière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: C’est pour ce garçon
  rationale: Avec הִתְפַּלֵּל, אֶל peut désigner ce au sujet de quoi porte la prière. La tournure emphatique française est naturelle dans la déclaration d’Anne et « garçon » conserve la précision masculine de נַעַר.
- source_word: הִתְפַּלָּלְתִּי
  choice: j’ai prié
  rationale: Le passé composé convient au discours direct et présente la prière passée en rapport avec son accomplissement actuel.
- source_word: וַיִּתֵּן
  choice: m’a accordé
  rationale: Dans ce contexte de prière exaucée, « accorder une demande » rend idiomatiquement le don de Yahweh, tout en maintenant l’idée du verbe נָתַן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: שְׁאֵלָתִי
  choice: la demande
  rationale: שְׁאֵלָה désigne ici une demande adressée à Dieu. L’objet indirect « m’ » dans « m’a accordé » exprime naturellement en français que cette demande est celle d’Anne.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: que je lui avais faite
  rationale: Cette formulation française naturelle conserve le lien lexical entre la demande et l’acte de demander; le plus-que-parfait situe clairement la demande avant son accomplissement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » en préserve la fonction de nom personnel sans lui substituer un titre.
- issue: Rapport entre la prière et le garçon
  choice: pour ce garçon
  alternative: au sujet de ce garçon
  rationale: La préposition אֶל peut marquer ce qui concerne la prière. « Pour » exprime naturellement qu’Anne priait afin de recevoir cet enfant, tandis que la note préserve la lecture plus strictement thématique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase emphatique « C’est pour ce garçon que… » restitue la mise en avant initiale du groupe hébreu. « Demande » est plus courant que « requête » ou « supplication » et s’associe naturellement à « accorder ».
