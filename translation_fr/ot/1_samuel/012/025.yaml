source:
  edition: WLC
  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: fr
  text: Mais si vous persistez à faire le mal[a], vous et votre roi serez emportés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si vous faites le mal », « si vous faites assurément le mal » ou « si vous agissez avec méchanceté » ; en hébreu, l’infinitif absolu renforce le verbe.
    reason: lexical_alternative
  - marker: b
    text: Ou « périrez », « serez détruits » ou « disparaîtrez ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction introduit ici une condition qui contraste avec la promesse du contexte précédent ; « Mais si » rend naturellement cette valeur discursive.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: vous persistez à faire le mal
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Persistez à faire le mal » exprime cette intensification en français courant, tout en laissant en note les rendus plus formels.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: vous et votre roi
  rationale: Le double גַּם inclut expressément les deux parties dans le même avertissement. La coordination française, renforcée par la reprise après le verbe, conserve cette portée collective.
- source_word: תִּסָּפוּ
  choice: vous disparaîtrez
  rationale: Le niphal de ספה peut signifier périr, être supprimé ou être emporté dans le jugement. « Disparaîtrez » reste grave et naturel sans préciser indûment la forme du châtiment.
theological_decisions:
- issue: Nature du jugement annoncé au peuple et au roi
  choice: Un avertissement collectif de disparition sous le jugement, visant le peuple comme son roi
  alternative: Une défaite militaire seulement, ou une ruine spirituelle seulement
  rationale: Le verset ne précise pas la modalité du jugement. La formulation choisie en préserve la gravité et l’étendue sans la réduire à une seule forme.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre « vous disparaîtrez, vous et votre roi » reproduit l’accent final mis sur l’inclusion du peuple et du roi, sans alourdir la phrase.
