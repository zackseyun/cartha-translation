  text: כַּֽ/אֲשֶׁר בָּ֥א יַעֲקֹ֖ב מִצְרָ֑יִם וַ/יִּזְעֲק֤וּ אֲבֽוֹתֵי/כֶם֙ אֶל יְהוָ֔ה וַ/יִּשְׁלַ֨ח יְהוָ֜ה אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֗ן וַ/יּוֹצִ֤יאוּ אֶת אֲבֹֽתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/יֹּשִׁב֖וּ/ם בַּ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: fr
  text: Lorsque Jacob entra en Égypte, vos ancêtres[a] crièrent vers Yahvé. Yahvé envoya Moïse et Aaron, qui firent sortir vos ancêtres d’Égypte et les établirent en ce lieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vos pères ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les firent habiter en ce lieu »; plus simplement : « les installèrent ici ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא
  choice: Lorsque … fut arrivé
  rationale: La conjonction introduit ici une circonstance temporelle. Le passé antérieur situe naturellement l’arrivée de Jacob avant le cri des ancêtres dans un récit historique soutenu.
- source_word: וַיִּזְעֲקוּ
  choice: crièrent vers
  rationale: Le verbe exprime un appel pressant au secours; « crier vers » conserve à la fois la détresse et l’orientation de l’appel vers Dieu.
- source_word: אֲבוֹתֵיכֶם
  choice: vos ancêtres
  rationale: Dans ce rappel de l’histoire collective d’Israël, « ancêtres » est naturel et inclusif en français moderne, tandis que le sens littéral « vos pères » est signalé en note.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin YHWH, qui conserve ici le nom propre de l’alliance plutôt que de le remplacer par un titre.
- source_word: וַיּוֹצִיאוּ
  choice: firent sortir
  rationale: Le hifil de יצא exprime la causalité; le pluriel renvoie naturellement à Moïse et Aaron comme agents de la sortie d’Égypte.
- source_word: וַיֹּשִׁבוּם
  choice: les établirent
  rationale: Le hifil de ישׁב signifie « faire habiter, installer ». « Les établirent » exprime clairement l’installation durable dans le pays sans alourdir la phrase.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Rendu direct et digne de l’expression déictique hébraïque, qui désigne le pays où se trouvent Samuel et ses auditeurs.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » en conserve la fonction de nom propre dans une forme française bien établie.
- issue: Agents de la sortie et de l’établissement
  choice: Moïse et Aaron sont les sujets grammaticaux de « firent sortir » et « établirent »
  alternative: Yahvé serait présenté comme le sujet direct implicite
  rationale: Les deux verbes hébreux sont au pluriel et leur antécédent immédiat est « Moïse et Aaron ». La traduction préserve cette syntaxe sans nier que Yahvé agit par leur intermédiaire.
translation_notes:
  register: Français international moderne, clair et digne. La coordination hébraïque a été légèrement structurée en deux phrases; la proposition relative « qui firent sortir » évite une succession pesante de « et » tout en maintenant Moïse et Aaron comme sujets. Les appels de note sont placés sur les expressions auxquelles ils se rapportent.
