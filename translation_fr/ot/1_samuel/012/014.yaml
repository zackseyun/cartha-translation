source:
  edition: WLC
  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: fr
  text: Si vous craignez Yahvé, si vous le servez, si vous écoutez sa voix[a] et si vous ne vous révoltez pas contre ce que commande Yahvé, alors vous et le roi qui règne sur vous suivrez Yahvé votre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « écouter sa voix » peut aussi se comprendre comme « obéir à sa voix », car il s’agit souvent d’une écoute qui conduit à l’obéissance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement en hébreu : « et vous serez, vous comme le roi qui règne sur vous, après Yahvé votre Dieu ». La formulation est elliptique; elle peut indiquer que le peuple et son roi continueront à suivre Yahvé et à lui rester fidèles.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit clairement la condition qui régit l’ensemble du verset.
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: vous craignez Yahvé
  rationale: « Craindre » conserve le poids religieux et relationnel de ירא, qui englobe ici respect, révérence et fidélité envers Dieu. « Yahvé » rend le nom divin יהוה sous sa forme française courante.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: si vous le servez
  rationale: עבד désigne le service rendu à Dieu, y compris sa dimension cultuelle, sans se limiter au seul acte d’adoration.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: si vous écoutez sa voix
  rationale: Conserve l’image hébraïque de l’écoute tout en laissant entendre, dans ce contexte, qu’il s’agit d’une écoute obéissante.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: si vous ne vous révoltez pas contre ce que commande Yahvé
  rationale: מרה exprime la rébellion, et l’expression littérale « la bouche de Yahvé » désigne ici ce qu’il ordonne. Cette formulation française restitue l’idiome sans en affaiblir la force.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: vous comme le roi
  rationale: Rend naturellement la construction corrélative גַּם… וְגַם, qui associe le peuple et son roi dans la même condition et la même fidélité.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: qui règne sur vous
  rationale: Le parfait hébreu identifie le roi établi dans sa fonction; le présent français exprime naturellement son règne en cours.
- source_word: וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: alors vous suivrez Yahvé votre Dieu
  rationale: La tournure hébraïque est elliptique et littéralement difficile. « Suivre » exprime naturellement l’idée d’être après Yahvé, c’est-à-dire de demeurer dans son obéissance et son allégeance, sans ajouter une promesse de prospérité absente du texte massorétique.
theological_decisions:
- issue: Sens de la proposition finale וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: 'La proposition est comprise positivement: le peuple et le roi suivront Yahvé leur Dieu.'
  alternative: 'Conserver la formulation très littérale et elliptique: « vous serez, vous comme le roi…, après Yahvé votre Dieu »; certaines versions anciennes ou traductions explicitent autrement le résultat de la condition.'
  rationale: Dans ce contexte d’allégeance à l’alliance, אַחַר appliqué à une personne peut exprimer le fait de la suivre. Une note conserve toutefois la difficulté syntaxique réelle du texte hébreu.
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh
  rationale: La translittération française « Yahvé » présente le nom personnel dans une forme reconnue et naturelle en français moderne, plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « si vous » clarifie la série des conditions sans modifier leur portée. La phrase principale demeure fluide, tandis que les notes signalent le sens obéissant de « écouter » et l’ambiguïté syntaxique de la proposition finale.
