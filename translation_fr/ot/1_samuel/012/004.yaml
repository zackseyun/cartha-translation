source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לֹ֥א עֲשַׁקְתָּ֖/נוּ וְ/לֹ֣א רַצּוֹתָ֑/נוּ וְ/לֹֽא לָקַ֥חְתָּ מִ/יַּד אִ֖ישׁ מְאֽוּמָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: fr
  text: 'Ils dirent : « Tu ne nous as pas opprimés, tu ne nous as pas maltraités et tu n’as rien pris de la main de qui que ce soit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main de qui que ce soit ». Cette expression désigne probablement le fait de recevoir de quelqu’un un paiement, un cadeau ou un pot-de-vin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol poursuit simplement le récit. « Ils dirent » conserve cette progression sans ajouter explicitement l’idée de réponse.
- source_word: עֲשַׁקְתָּנוּ
  choice: tu ne nous as pas opprimés
  rationale: Le verbe עשׁק peut désigner l’oppression, l’exploitation ou la spoliation par abus de pouvoir. « Opprimés » garde ici une portée assez large.
- source_word: רַצּוֹתָנוּ
  choice: tu ne nous as pas maltraités
  rationale: Dans ce contexte, רצץ évoque un tort grave ou un traitement abusif. « Maltraités » exprime naturellement le sens métaphorique sans suggérer nécessairement un écrasement physique.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: tu n’as rien pris de la main de qui que ce soit
  rationale: Cette formulation conserve l’image concrète de l’hébreu, tout en restant intelligible en français. Le contexte peut viser un paiement, un cadeau ou un pot-de-vin, sans que le texte précise lequel.
- source_word: אִישׁ
  choice: qui que ce soit
  rationale: Sous la négation, cette tournure française rend naturellement la valeur indéfinie de אִישׁ sans restreindre artificiellement le groupe visé aux seuls hommes.
- source_word: מְאוּמָה
  choice: rien
  rationale: Dans une proposition négative, « rien » est l’équivalent français naturel de l’indéfini מְאוּמָה, « quoi que ce soit ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe au singulier visant Samuel. La répétition des trois négations est maintenue, et l’image de la « main » est conservée afin de ne pas préciser au-delà de l’hébreu la nature de ce qui aurait pu être pris.
