source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: fr
  text: Mais si vous n’écoutez pas la voix de Yahweh et que vous vous révoltez contre l’ordre de Yahweh, la main de Yahweh sera contre vous et contre vos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « vos pères ». Quelques versions anciennes et de nombreux interprètes lisent « votre roi », ce qui correspond bien au contexte immédiat, où l’avertissement de Samuel concerne à la fois le peuple et son roi.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition qui contraste avec la promesse du verset précédent.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: vous n’écoutez pas la voix de Yahweh
  rationale: Conserve l’image hébraïque de l’écoute tout en laissant entendre l’obéissance qu’elle implique dans ce contexte.
- source_word: וּמְרִיתֶם
  choice: et si vous vous révoltez
  rationale: Le verbe מרה exprime la rébellion ou la défiance, et non une simple désobéissance involontaire.
- source_word: אֶת פִּי יְהוָה
  choice: contre l’ordre de Yahweh
  rationale: Littéralement « la bouche de Yahweh » ; l’expression désigne ici ce que Yahweh a ordonné. « L’ordre » rend naturellement cet idiome en français.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: la main de Yahweh sera
  rationale: Maintient la métaphore biblique de la main, qui représente ici la puissance active de Yahweh dans le jugement.
- source_word: בָּכֶם
  choice: contre vous
  rationale: Dans ce contexte de jugement, la préposition indique une action hostile.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: et contre vos pères
  rationale: Suit le texte massorétique fourni, qui porte littéralement « vos pères », tout en signalant en note l’autre leçon ancienne et contextuellement plausible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel de manière cohérente et reconnaissable en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel ; Jéhovah
  rationale: « Yahweh » représente directement le nom divin sans le remplacer par un titre.
- issue: Leçon finale וּבַאֲבֹתֵיכֶם
  choice: contre vos pères
  alternative: contre votre roi
  rationale: Le texte massorétique fourni lit « vos pères ». L’autre leçon correspond mieux, selon certains, au contexte immédiat qui associe le peuple et son roi ; elle est donc conservée en note sans modifier le texte de base.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conditionnelle est explicite sans alourdir la phrase ; les métaphores hébraïques intelligibles (« voix », « main ») sont conservées.
