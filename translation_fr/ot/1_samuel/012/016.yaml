  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: fr
  text: Maintenant donc, tenez-vous là et voyez cette grande chose que Yahvé[a] accomplit sous vos yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Maintenant donc
  rationale: Cette locution sert de transition solennelle vers l’appel qui suit. « Maintenant donc » en conserve la force discursive dans un français naturel.
- source_word: הִתְיַצְּבוּ
  choice: tenez-vous là
  rationale: L’impératif hitpael de יצב demande aux auditeurs de prendre position et de rester attentifs. « Tenez-vous là » exprime cette posture sans ajouter explicitement l’idée d’immobilité.
- source_word: וּרְאוּ
  choice: voyez
  rationale: L’impératif invite le peuple à constater directement le signe; « voyez » garde la valeur d’observation et de témoignage.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: la grande chose
  rationale: דבר peut désigner une chose, une affaire ou un événement. « La grande chose » préserve cette ampleur sémantique sans préciser indûment qu’il s’agit d’un acte ou d’un signe.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: que Yahvé accomplit
  rationale: Le participe עֹשֶׂה présente l’action comme actuelle ou imminente avec vivacité. Le présent français « accomplit » conserve cette perspective.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante du tétragramme est employée comme nom propre, plutôt que de lui substituer le titre traditionnel « le Seigneur ».
- source_word: לְעֵינֵיכֶם
  choice: sous vos yeux
  rationale: Cette expression française idiomatique conserve l’image de ce qui se déroule publiquement devant les témoins.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte le nom divin lui-même. « Yahvé » le rend comme nom propre, tandis que « le Seigneur » représente la substitution traditionnelle; celle-ci est signalée en note.
- issue: Temporalité de עֹשֶׂה
  choice: accomplit
  alternative: va accomplir
  rationale: Le participe hébreu peut viser une action en cours ou imminente. Le présent maintient cette tension et la vivacité du texte sans la résoudre en futur explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’appel solennel hébreu tout en restant naturelle; le nom divin est francisé sous la forme « Yahvé ».
