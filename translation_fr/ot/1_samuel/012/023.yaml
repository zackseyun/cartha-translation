reference: 1 Samuel 12:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: fr
  text: Quant à moi, loin de moi l’idée de pécher contre Yahweh en cessant de prier pour vous ! Je vous enseignerai[a] la voie bonne et droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous indiquerai ». Le verbe hébreu peut exprimer à la fois l’enseignement et la direction donnée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Quant à moi
  rationale: La tournure met en relief Samuel et marque le contraste avec les obligations du peuple dans le contexte.
- source_word: חָלִילָה לִּי
  choice: loin de moi l’idée de
  rationale: Cet idiome exprime un rejet énergique. Cette formulation française en conserve la force sans donner au mot חָלִילָה un sens littéral inadapté ici.
- source_word: מֵחֲטֹא לַיהוָה
  choice: de pécher contre Yahweh
  rationale: Le texte présente explicitement l’éventuelle faute de Samuel comme un péché commis contre Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: en cessant de prier pour vous
  rationale: La formulation exprime clairement que le péché consisterait à interrompre l’intercession en faveur du peuple.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: Je vous enseignerai
  rationale: Le hiphil de ירה peut désigner l’enseignement ou la direction donnée. « Enseigner » convient au rôle prophétique de Samuel tout en restant naturel.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: la voie bonne et droite
  rationale: « Voie » conserve la métaphore de la conduite, tandis que les deux adjectifs gardent les qualités morales distinctes exprimées en hébreu.
theological_decisions:
- issue: La nature du manquement que constituerait l’arrêt de l’intercession
  choice: Le présenter explicitement comme un péché contre Yahweh
  alternative: Le présenter seulement comme une négligence du devoir de dirigeant
  rationale: L’hébreu dit directement מֵחֲטֹא לַיהוָה, « pécher contre Yahweh » ; il ne faut donc pas atténuer la portée théologique de l’affirmation.
- issue: La représentation du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le nom propre divin. Sa transcription préserve cette donnée au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. L’idiome « loin de moi l’idée de » restitue le rejet énergique de Samuel, et l’exclamation rend sa force affective. La métaphore morale de la « voie » est conservée.
