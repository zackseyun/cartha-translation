source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: fr
  text: Et maintenant, voici le roi que vous avez choisi, que vous avez demandé ; et voici, Yahweh a établi un roi sur vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Yahweh a donné un roi sur vous. »'
    reason: Signale le sens lexical de נתן et conserve explicitement la préposition על (« sur vous »), tandis que « a établi » rend l’idée contextuelle d’installation en autorité.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et la valeur temporelle du marqueur discursif.
- source_word: הִנֵּה
  choice: voici
  rationale: Attire naturellement l’attention sur le roi présent devant l’assemblée, sans recourir à l’archaïque « voici que » ou « behold ».
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: que vous avez choisi
  rationale: Rend directement le verbe בחר et l’action accomplie du peuple.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: celui que vous avez demandé
  rationale: Exprime en français courant la demande d’un roi et maintient la seconde proposition relative sans laisser entendre que le peuple lui a posé une question.
- source_word: וְהִנֵּה
  choice: et voyez
  rationale: Préserve la seconde invitation à prêter attention tout en évitant la répétition maladroite de « voici ».
- source_word: נָתַן
  choice: a établi
  rationale: Avec עַל et « roi », le verbe « donner » exprime ici la mise en autorité. « Établir sur » communique clairement ce sens, tandis que la traduction littérale est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: Marque naturellement l’autorité royale exercée sur le peuple.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: L’absence d’article dans la seconde occurrence se rend naturellement par l’indéfini, même si le référent demeure le roi déjà présenté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; sa transcription préserve le nom personnel sans lui substituer un titre.
- issue: Portée de נָתַן avec עַל
  choice: a établi un roi sur vous
  alternative: vous a donné un roi
  rationale: Le choix principal explicite la mise du roi en position d’autorité, sans effacer le sens lexical « donner », conservé dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition rhétorique des deux הִנֵּה est conservée par deux formulations naturelles distinctes (« voici », « voyez »), et les deux actions imputées au peuple restent explicitement juxtaposées.
