id: 1SA.12.21
reference: 1 Samuel 12:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: fr
  text: Ne vous détournez pas pour suivre des choses vaines[a], qui ne peuvent ni vous être utiles ni vous délivrer[b], car elles ne sont que vanité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses vides », « futiles » ou « des idoles ». Le mot hébreu désigne ce qui est vide, vain ou inconsistant.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous sauver » ou « vous arracher au danger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: vous détournez
  rationale: Le verbe סור exprime l’action de s’écarter ou de se détourner. Cette formulation conserve l’image d’un abandon de la voie et de l’allégeance justes.
- source_word: אַחֲרֵי
  choice: pour suivre
  rationale: אַחֲרֵי signifie littéralement « après, derrière » et, avec le verbe, exprime ici le fait de se mettre à la suite de faux objets de confiance. « Pour suivre » est naturel en français.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: des choses vaines / vanité
  rationale: תֹהוּ désigne ce qui est vide, inconsistant ou futile. « Choses vaines » préserve l’indétermination du référent, tandis que « vanité » dans la reprise conserve l’insistance et la tension lexicales de l’hébreu.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: qui ne peuvent […] vous être utiles
  rationale: La proposition décrit ces choses comme incapables de procurer un quelconque avantage. L’ajout de « vous », implicite dans le contexte, produit une formulation française claire sans modifier le sens.
- source_word: וְלֹא יַצִּילוּ
  choice: ni vous délivrer
  rationale: Au hiphil, נצל signifie couramment « délivrer, arracher, sauver ». « Délivrer » convient au contexte biblique tout en évitant de surcharger le terme d’une portée théologique plus précise que le verset.
- source_word: הֵמָּה
  choice: elles
  rationale: Le pronom renvoie aux réalités désignées par « choses », féminin pluriel en français.
theological_decisions:
- issue: Référent de תֹהוּ (« choses vaines »)
  choice: Maintenir une désignation générale de réalités vaines et impuissantes, probablement des idoles ou d’autres objets de confiance mal placée.
  alternative: Traduire explicitement par « idoles ».
  rationale: Le contexte suggère fortement les idoles, mais le texte emploie un terme plus large signifiant vide, futilité ou inconsistance. La traduction ne réduit donc pas l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel est conservé. La répétition de תֹהוּ est rendue par les termes apparentés « vaines » et « vanité », afin de garder l’écho rhétorique sans produire une phrase artificielle.
