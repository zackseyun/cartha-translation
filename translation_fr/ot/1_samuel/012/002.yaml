source:
  edition: WLC
  text: וְ/עַתָּ֞ה הִנֵּ֥ה הַ/מֶּ֣לֶךְ מִתְהַלֵּ֣ךְ לִ/פְנֵי/כֶ֗ם וַ/אֲנִי֙ זָקַ֣נְתִּי וָ/שַׂ֔בְתִּי וּ/בָנַ֖/י הִנָּ֣/ם אִתְּ/כֶ֑ם וַ/אֲנִי֙ הִתְהַלַּ֣כְתִּי לִ/פְנֵי/כֶ֔ם מִ/נְּעֻרַ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: fr
  text: 'Et maintenant, voici : le roi marche devant vous[a]. Moi, j’ai vieilli et mes cheveux ont blanchi[b], et voici mes fils avec vous. J’ai marché devant vous[c] depuis ma jeunesse jusqu’à ce jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « marche devant vous » peut aussi signifier « va devant vous » ou « vous dirige »; elle peut évoquer la conduite publique du peuple.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, on peut aussi comprendre : « je suis devenu vieux et grisonnant ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « je suis allé devant vous » ou « je vous ai dirigés ». Samuel reprend la même expression que celle employée pour le roi, établissant ainsi un parallèle entre leurs rôles publics.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque la transition vers l’appel présent de Samuel, tout en conservant la valeur connective de וְ.
- source_word: הִנֵּה
  choice: voici
  rationale: Attire l’attention sur la situation présente dans un français actuel et digne, sans recourir à l’archaïque « voici que » ou « voyez ».
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: marche devant vous
  rationale: Conserve l’image et l’aspect duratif du participe, ainsi que l’ambiguïté de l’expression, qui peut aussi évoquer la conduite publique du peuple.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: j’ai vieilli et mes cheveux ont blanchi
  rationale: Rend l’état acquis exprimé par les parfaits et explicite naturellement en français l’image du blanchissement liée à l’âge.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: et voici mes fils avec vous
  rationale: « Voici » restitue la force présentative de הִנָּם, tandis que « avec vous » suit directement le texte hébreu.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: J’ai marché devant vous
  rationale: Reprend la même expression que pour le roi afin de préserver le parallèle rhétorique entre leurs rôles publics.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: depuis ma jeunesse jusqu’à ce jour
  rationale: Expression temporelle naturelle qui conserve les deux limites explicites de la durée.
theological_decisions:
- issue: Portée de l’expression « marcher devant »
  choice: Conserver l’image « marcher devant » dans les deux propositions
  alternative: Traduire « vous diriger » ou « être à votre tête »
  rationale: Le contexte permet une nuance de direction publique, mais le rendu imagé préserve l’ambiguïté et le parallèle délibéré entre le roi et Samuel sans imposer une interprétation institutionnelle.
translation_notes:
  register: 'Français international moderne, clair et digne. La répétition de « marcher devant vous » est volontaire : elle reproduit le parallèle hébreu plutôt que de varier élégamment le vocabulaire. « Voici » conserve la force démonstrative sans tonalité excessivement archaïque.'
