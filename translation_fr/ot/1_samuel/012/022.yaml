id: 1SA.12.22
reference: 1 Samuel 12:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: fr
  text: Car Yahweh n’abandonnera pas son peuple[a], à cause de son grand nom, puisque Yahweh a bien voulu faire de vous son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne délaissera pas » ou « ne rejettera pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « faire de vous un peuple qui lui appartienne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: n’abandonnera pas
  rationale: Le verbe נטש exprime ici le fait de délaisser ou d’abandonner un peuple. « N’abandonnera pas » est naturel en français moderne et conserve la portée relationnelle et communautaire du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne ici Israël dans son identité collective et son lien particulier avec Yahweh ; « son peuple » rend directement cette relation.
- source_word: בַּעֲבוּר
  choice: à cause de
  rationale: La préposition indique le motif de l’action de Yahweh. « À cause de son grand nom » est une formulation française claire qui conserve cette relation causale.
- source_word: שְׁמוֹ הַגָּדוֹל
  choice: son grand nom
  rationale: Cette traduction directe conserve l’expression hébraïque, où le « nom » renvoie à l’identité, à la réputation et à l’honneur révélés de Dieu.
- source_word: הוֹאִיל
  choice: a bien voulu
  rationale: הוֹאִיל exprime ici une volonté résolue et favorable. « A bien voulu » restitue cette nuance sans transformer le verbe en affirmation technique sur l’élection.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: faire de vous son peuple
  rationale: La construction décrit l’acte par lequel Yahweh constitue les destinataires comme le peuple qui lui appartient. La formulation retenue est concise et naturelle, tout en intégrant la valeur de לוֹ.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Nuance de la volonté divine dans הוֹאִיל
  choice: a bien voulu
  alternative: a choisi ; a décidé
  rationale: Le choix retenu maintient l’idée d’une volonté favorable et délibérée, sans imposer au passage une formulation doctrinale plus technique que l’hébreu.
- issue: Fondement du maintien d’Israël comme peuple de Yahweh
  choice: à cause de son grand nom
  alternative: pour l’honneur de son grand nom
  rationale: La traduction conserve l’affirmation selon laquelle l’action de Yahweh est motivée par son propre nom, sans expliciter davantage la relation entre ce nom, son honneur et sa fidélité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit la progression causale de l’hébreu tout en restant naturelle. « A bien voulu » conserve la nuance favorable de הוֹאִיל ; « son peuple » exprime sobrement l’appartenance indiquée par לוֹ.
