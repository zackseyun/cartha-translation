base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: fr
  text: 'Alors ils crièrent vers l’Éternel et dirent : « Nous avons péché, car nous avons abandonné l’Éternel et servi les Baals et les Astartés. Mais maintenant, délivre-nous de la main de nos ennemis, et nous te servirons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et intelligible du tétragramme, distingué du titre אֲדֹנָי.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel désigne les diverses manifestations ou divinités locales portant le nom de Baal; le pluriel français conserve cette donnée.
- source_word: הָעַשְׁתָּרוֹת
  choice: les Astartés
  rationale: Transcription française usuelle du pluriel hébreu désignant les divinités féminines associées à Astarté.
- source_word: מִיַּד
  choice: de la main de
  rationale: Conserve l’image hébraïque courante de la main comme pouvoir ou domination.
- source_word: כִּי
  choice: car
  rationale: Exprime naturellement le rapport causal entre la confession du péché et l’abandon de l’Éternel.
theological_decisions:
- issue: Nature de l’engagement final
  choice: « et nous te servirons »
  alternative: « afin que nous te servions »
  rationale: La coordination hébraïque permet de comprendre ces mots comme une promesse consécutive à la délivrance; le futur coordonné préserve cette lecture sans ajouter une nuance de but explicite.
- issue: Désignation du nom divin
  choice: « l’Éternel »
  alternative: « Yahvé »
  rationale: « l’Éternel » reste une convention française digne et largement comprise; elle ne dépend pas d’une reconstruction confessionnelle particulière de la prononciation.
translation_notes:
  register: Français moderne, soutenu mais accessible. Le récit demeure au passé simple, adapté à une narration biblique digne. Les noms cultuels sont conservés au pluriel, et l’image « de la main de » est maintenue pour sa force et sa clarté.
