base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: fr
  text: N’est-ce pas aujourd’hui la moisson du blé ? J’invoquerai Yahweh, et il enverra[a] du tonnerre[b] et de la pluie. Sachez donc et voyez que le mal que vous avez commis aux yeux de Yahweh en demandant un roi pour vous-mêmes est grand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il donnera ». En français, on dit plus naturellement que Dieu « envoie » le tonnerre et la pluie.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des voix ». Dans ce contexte météorologique, le mot hébreu désigne le tonnerre, ou les coups de tonnerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא קְצִיר חִטִּים הַיּוֹם
  choice: N’est-ce pas aujourd’hui la moisson des blés ?
  rationale: La question rhétorique et son ancrage temporel sont conservés. « La moisson des blés » est une formulation française naturelle pour la période de la récolte du blé.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: Je vais appeler Yahweh
  rationale: Le futur proche convient à l’action immédiate annoncée par Samuel. « Appeler » restitue simplement קרא אל, et le nom divin est transcrit « Yahweh ».
- source_word: וְיִתֵּן
  choice: il enverra
  rationale: Le verbe נתן signifie littéralement « donner », mais, avec des phénomènes météorologiques, « envoyer » exprime naturellement en français l’action divine sans en modifier le sens.
- source_word: קֹלוֹת
  choice: le tonnerre
  rationale: Le pluriel littéral « voix » désigne ici les grondements ou coups de tonnerre dans un contexte d’orage.
- source_word: וּדְעוּ וּרְאוּ
  choice: Sachez donc et voyez
  rationale: Les deux impératifs hébreux sont maintenus. « Donc » explicite sobrement le rapport entre le signe annoncé et la prise de conscience demandée.
- source_word: כִּי רָעַתְכֶם רַבָּה
  choice: combien est grand le mal que vous avez commis
  rationale: Cette formulation conserve l’intensité de רַבָּה et la qualification morale de רָעָה, sans réduire celle-ci à une simple erreur.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La locution française garde l’image hébraïque et sa portée évaluative.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: en demandant un roi pour vous-mêmes
  rationale: L’infinitif précise en quoi consistait le mal reproché. « Pour vous-mêmes » conserve le pronom réfléchi emphatique לָכֶם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Qualification morale de la demande d’un roi
  choice: le mal que vous avez commis … en demandant un roi
  alternative: votre faute / votre méchanceté
  rationale: Le texte présente cette demande comme רָעָה devant Yahweh. « Le mal » conserve cette appréciation morale tout en évitant d’ajouter une caractérisation psychologique des demandeurs.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque, tout en évitant les calques peu naturels. Les impératifs « Sachez » et « voyez » préservent la force directe de l’exhortation.
