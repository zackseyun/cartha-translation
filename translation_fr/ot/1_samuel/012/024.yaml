  terminology: « Yahweh », « craignez », « servez-le fidèlement » et « de tout votre cœur » sont cohérents avec le texte hébreu, le registre biblique moderne et les choix terminologiques établis. La note sur « avec vous » est bien ancrée et conserve l’alternative contextuelle « pour vous ».
