  source_fidelity: 'Le projet rend correctement les principaux éléments : la crainte de Yahweh, le service loyal, la totalité du cœur et l’appel à reconnaître ses grandes actions. « Avec vous » conserve de façon utile la formulation et l’ambiguïté de עִמָּכֶם, que la note explicite sans la résoudre.'
