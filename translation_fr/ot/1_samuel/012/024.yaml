source:
  edition: WLC
  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: fr
  text: Craignez seulement Yahweh et servez-le fidèlement de tout votre cœur, car voyez les grandes choses qu’il a faites avec vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vous »; littéralement « avec vous ».
    reason: La préposition hébraïque peut, dans ce contexte, évoquer ce que Yahweh a accompli en faveur du peuple, mais sa formulation directe est « avec vous ».
lexical_decisions:
- source_word: אַךְ
  choice: Seulement
  rationale: 'La particule a ici une force restrictive et exhortative : elle recentre le peuple sur la seule réponse qui convient.'
- source_word: יְרָאוּ
  choice: craignez
  rationale: Le verbe exprime à la fois la crainte, le respect profond et l’obéissance; « craignez » conserve l’idiome et sa portée théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel, plutôt que remplacement par un titre.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: et servez-le
  rationale: « Servir » rend directement עבד et garde le sens large de loyauté et d’obéissance, qui inclut le culte sans s’y limiter.
- source_word: בֶּאֱמֶת
  choice: fidèlement
  rationale: Dans cette exhortation, אֱמֶת qualifie un service vrai, intègre et constant; « fidèlement » l’exprime naturellement en français.
- source_word: בְּכָל לְבַבְכֶם
  choice: de tout votre cœur
  rationale: Expression française naturelle correspondant à l’idiome hébreu de l’engagement intérieur total.
- source_word: רְאוּ
  choice: considérez
  rationale: L’impératif appelle ici non seulement à voir, mais à reconnaître avec réflexion les actes de Dieu.
- source_word: אֵת אֲשֶׁר הִגְדִּל
  choice: les grandes choses qu’il a faites
  rationale: Le hiphil de גדל désigne idiomatiquement l’accomplissement de grandes choses.
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: « Avec vous » préserve le sens direct de la préposition עם et l’ambiguïté entre les actes accomplis envers, parmi et en faveur d’Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin personnel; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de la crainte de Dieu
  choice: craignez
  alternative: révérez
  rationale: « Craignez » préserve la tension biblique entre crainte, révérence et obéissance sans réduire le terme à une déférence atténuée.
- issue: Relation exprimée par עִמָּכֶם
  choice: avec vous
  alternative: pour vous
  rationale: Le rendu littéral maintient l’ambiguïté réelle de l’hébreu au lieu de limiter les actes de Yahweh à la seule idée de bienfaits accomplis en faveur du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel s’adresse collectivement au peuple. La tournure « car considérez » conserve la relation explicative de כִּי tout en donnant à רְאוּ sa valeur réfléchie.
