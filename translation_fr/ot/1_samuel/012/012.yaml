source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: fr
  text: 'Quand vous avez vu Nahash, roi des Ammonites, marcher contre vous, vous m’avez dit : « Non ! Un roi régnera sur nous ! » alors que le SEIGNEUR, votre Dieu, était votre roi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le SEIGNEUR, votre Dieu, est votre roi ». La proposition hébraïque ne comporte aucun verbe explicite ; le contexte permet de suppléer soit le passé, soit le présent.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  choice: Quand vous avez vu
  rationale: Le waw consécutif avec ראה introduit ici la circonstance temporelle qui a provoqué la demande du peuple, et כִּי introduit le contenu de leur perception.
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: Nahash, roi des Ammonites
  rationale: Le nom propre est translittéré, et la chaîne construite désignant le groupe ethnique est rendue par la formulation française usuelle « les Ammonites ».
- source_word: בָּא עֲלֵיכֶם
  choice: marcher contre vous
  rationale: Dans ce contexte militaire, בוא avec עַל décrit une avancée hostile. « Marcher contre » exprime naturellement en français cette attaque en cours ou imminente.
- source_word: וַתֹּאמְרוּ לִי
  choice: vous m’avez dit
  rationale: Rend directement les paroles adressées à Samuel dans le cadre narratif passé.
- source_word: לֹא כִּי
  choice: Non ! C’est… qui
  rationale: L’expression marque un refus énergique suivi d’une affirmation contraire. La construction française clivée restitue cette insistance sans archaïsme.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: C’est un roi qui régnera sur nous
  rationale: L’association du nom מֶלֶךְ et du verbe de même racine יִמְלֹךְ souligne avec force l’exigence d’un roi humain. La tournure clivée conserve cette emphase en français courant.
- source_word: יהוה אֱלֹהֵיכֶם
  choice: le SEIGNEUR, votre Dieu
  rationale: 'Le tétragramme est rendu selon la convention biblique française courante par « le SEIGNEUR », tandis que אֱלֹהֵיכֶם garde sa valeur relationnelle directe : « votre Dieu ».'
- source_word: מַלְכְּכֶם
  choice: était votre roi
  rationale: La proposition nominale hébraïque ne contient aucun verbe exprimant le temps. Le passé convient au récit rétrospectif, tandis que le présent possible est signalé en note.
theological_decisions:
- issue: Temps implicite dans וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: le SEIGNEUR, votre Dieu, était votre roi
  alternative: le SEIGNEUR, votre Dieu, est votre roi
  rationale: L’hébreu présente une proposition nominale sans copule explicite. Le passé s’accorde avec le rappel par Samuel de la situation au moment de la demande d’un roi, mais le présent demeure grammaticalement et théologiquement possible ; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’opposition accusatrice du discours de Samuel et l’insistance de la demande populaire, sans surinterpréter la proposition nominale finale.
