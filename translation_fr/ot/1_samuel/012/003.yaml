  to: '« Me voici. Témoignez contre moi devant Yahweh et devant celui qu’il a oint : à qui ai-je pris un bœuf ? À qui ai-je pris un âne ? Qui ai-je opprimé ? Qui ai-je maltraité[a] ? De la main de qui ai-je accepté un pot-de-vin[b] pour fermer les yeux à l’égard de quelqu’un ? Je vous le rendrai. »'
  rationale: La révision restitue l’action que le texte attribue à Samuel (« fermer les yeux ») sans introduire de conditionnel ni faire du pot-de-vin l’agent de cette action. Elle améliore aussi l’idiome des deux premières questions tout en gardant leur parallélisme. Les notes existantes restent pertinentes et leurs ancrages sont conservés.
