source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: fr
  text: '« Me voici. Témoignez contre moi devant Yahweh et devant celui qu’il a oint : à qui ai-je pris un bœuf ? À qui ai-je pris un âne ? Qui ai-je opprimé ? Qui ai-je maltraité[a] ? De la main de qui ai-je accepté un pot-de-vin[b] pour fermer les yeux à l’égard de quelqu’un ? Je vous le rendrai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est difficile. Il peut évoquer le fait de traiter quelqu’un durement, de lui faire violence ou de l’écraser.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner une « rançon » ou un « paiement ». Ici, le fait de « fermer les yeux » indique probablement un paiement corrupteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Me voici
  rationale: Formule française naturelle de présentation publique, qui conserve l’idée de disponibilité à répondre des accusations.
- source_word: עֲנוּ בִי
  choice: Témoignez contre moi
  rationale: Le cadre public et judiciaire, devant Yahweh et le roi oint, donne ici au verbe la valeur d’un appel à déposer comme témoins.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: מְשִׁיחוֹ
  choice: celui qu’il a oint
  rationale: Désigne ici le roi ayant reçu l’onction. Cette formulation conserve le lien lexical avec l’onction sans importer directement le titre messianique ultérieur.
- source_word: עָשַׁקְתִּי
  choice: ai-je opprimé
  rationale: Rend la portée sociale, économique et juridique du verbe, qui évoque l’exploitation ou l’oppression.
- source_word: רַצּוֹתִי
  choice: ai-je maltraité
  rationale: Le verbe est difficile. « Maltraité » exprime une conduite dure ou abusive sans imposer l’image peut-être trop littérale d’un écrasement physique.
- source_word: כֹפֶר
  choice: pot-de-vin
  rationale: Le mot peut désigner une rançon ou un paiement, mais l’expression relative au fait de fermer les yeux indique ici un paiement corrupteur.
- source_word: וְאַעְלִים עֵינַי בּוֹ
  choice: qui m’aurait fait fermer les yeux
  rationale: Conserve l’image des yeux tout en exprimant naturellement en français l’effet corrupteur du paiement dans ce contexte judiciaire.
- source_word: וְאָשִׁיב לָכֶם
  choice: Je vous le rendrai
  rationale: Exprime la promesse de restitution à l’assemblée, le pronom reprenant ce qui aurait été indûment reçu ou pris.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription le distingue d’un simple titre.
- issue: Sens de מְשִׁיחוֹ dans le cadre historique royal
  choice: celui qu’il a oint
  alternative: son Messie
  rationale: Le référent immédiat est le roi consacré par l’onction. « Messie » risquerait de faire entendre ici une référence christologique directe que le contexte n’exige pas.
- issue: Portée de כֹפֶר
  choice: pot-de-vin
  alternative: rançon ou indemnité
  rationale: L’association avec le fait de fermer les yeux favorise le sens d’un paiement destiné à corrompre la justice, tout en signalant en note la gamme lexicale du terme.
translation_notes:
  register: Français international actuel, clair et digne. Les questions brèves et répétées gardent le caractère solennel de l’interpellation publique. « Celui qu’il a oint » reste compréhensible tout en préservant la portée historique et théologique du terme hébreu.
