  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: fr
  text: 'Samuel dit au peuple : « N’ayez pas peur. Vous avez commis tout ce mal. Cependant, ne vous détournez pas de Yahweh, mais servez Yahweh de tout votre cœur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: Samuel dit au peuple
  rationale: Le passé simple convient au récit en français soutenu et naturel. הָעָם désigne ici l’ensemble des Israélites auxquels Samuel s’adresse.
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: Cette formulation actuelle et idiomatique rend directement l’interdiction exprimée par ירא sans en atténuer la force.
- source_word: אַתֶּם עֲשִׂיתֶם אֵת כָּל הָרָעָה הַזֹּאת
  choice: Vous avez commis tout ce mal
  rationale: Le pronom indépendant אַתֶּם souligne la responsabilité des destinataires. « Commettre le mal » est naturel en français et רָעָה conserve ici toute sa portée morale.
- source_word: אַךְ
  choice: Cependant
  rationale: 'Dans ce contexte, la particule introduit une forte réserve après la reconnaissance de la faute : malgré le mal commis, le peuple ne doit pas abandonner Yahweh.'
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: ne cessez pas de suivre Yahweh
  rationale: L’expression hébraïque signifie littéralement ne pas se détourner de derrière Yahweh. La formulation choisie restitue clairement l’image relationnelle du fait de marcher à sa suite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: mais servez Yahweh
  rationale: עבד exprime ici le service loyal rendu à Yahweh et ne se limite pas au culte. « Mais » rend naturellement le contraste entre l’interdiction précédente et l’ordre positif.
- source_word: בְּכָל לְבַבְכֶם
  choice: de tout votre cœur
  rationale: Cette expression française usuelle rend l’idiome hébreu de la fidélité et de l’engagement sans partage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom d’alliance sans introduire un titre absent de l’hébreu.
- issue: Portée morale de רָעָה
  choice: tout ce mal
  alternative: toute cette faute
  rationale: Le contexte présente la conduite du peuple comme moralement mauvaise, et non comme une simple erreur. « Mal » maintient cette gravité sans ajouter une qualification confessionnelle.
- issue: Rapport entre la faute passée et l’appel présent
  choice: Cependant
  alternative: Seulement
  rationale: 'אַךְ peut avoir une valeur restrictive ou adversative. Ici, « Cependant » conserve la tension : la faute est pleinement reconnue, mais elle ne doit pas conduire le peuple à cesser de suivre Yahweh.'
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. Le tutoiement collectif est rendu par « vous », conformément au pluriel hébreu. La syntaxe reste concise et adaptée à une lecture publique.
