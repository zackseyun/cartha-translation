  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: fr
  text: Et maintenant, prenez position. Je vais vous citer en justice[a] devant Yahweh au sujet de tous les actes justes[b] que Yahweh a accomplis en votre faveur et en faveur de vos ancêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se rendre par « plaider contre vous », « vous juger » ou « raisonner avec vous ». L’hébreu évoque l’ouverture d’une cause judiciaire devant Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Les « actes justes » sont les interventions justes et fidèles de Yahweh en faveur de son peuple, conformément à son alliance.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque la transition et la conséquence dans le discours de Samuel, sans alourdir la phrase française.
- source_word: הִתְיַצְּבוּ
  choice: prenez position
  rationale: L’impératif appelle les auditeurs à se tenir à leur place dans un cadre formel; cette tournure conserve cette nuance mieux qu’un simple « tenez-vous debout ».
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: Je vais plaider avec vous
  rationale: 'Le verbe et sa construction ont ici une portée judiciaire: Samuel engage une cause ou une contestation devant Yahweh, plutôt qu’il ne prononce simplement une condamnation.'
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend directement l’expression de présence judiciaire ou solennelle et conserve le nom divin.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: au sujet de tous les actes de justice de Yahweh
  rationale: Le pluriel désigne des actions concrètes manifestant la justice et la fidélité de Yahweh; « actes de justice » garde l’étendue du terme sans le réduire aux seuls actes de salut.
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: que Yahweh a accomplis en votre faveur et en faveur de vos ancêtres
  rationale: Dans ce contexte, la préposition exprime l’action bénéfique envers Israël. « Ancêtres » communique naturellement le sens collectif de « pères » en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens de צִדְקוֹת יְהוָה
  choice: actes de justice de Yahweh
  alternative: actes sauveurs de Yahweh / œuvres justes de Yahweh
  rationale: L’expression évoque les interventions justes et fidèles de Yahweh dans l’histoire d’Israël. Le choix retenu préserve le lien lexical avec la justice et ne limite pas d’avance ces actes au salut.
- issue: Portée judiciaire de וְאִשָּׁפְטָה אִתְּכֶם
  choice: je vais plaider avec vous
  alternative: je vais vous juger / je vais raisonner avec vous / laissez-moi défendre ma cause contre vous
  rationale: La construction peut évoquer le jugement, la contestation ou l’exposé d’une cause. Le texte principal conserve la dimension judiciaire tout en laissant la note signaler l’ambiguïté.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Prenez position » et « plaider » maintiennent le cadre quasi judiciaire; « ancêtres » évite l’ambiguïté moderne de « pères » tout en gardant le sens historique.
