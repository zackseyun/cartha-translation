  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: fr
  text: Mais ils oublièrent Yahweh, leur Dieu, et il les vendit[a] aux mains de Sisera, chef de l’armée de Hatsor, aux mains des Philistins et aux mains du roi de Moab. Ils leur firent la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les livra ». L’hébreu dit littéralement « il les vendit », image exprimant le fait de livrer un peuple au pouvoir de ses ennemis en guise de jugement.'
    reason: Alternative lexicale et explication de l’image hébraïque.
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: ils oublièrent
  rationale: Le verbe שׁכח signifie littéralement « oublier ». Dans ce contexte d’alliance, il implique une négligence infidèle, mais la traduction littérale préserve cette portée sans l’expliciter abusivement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le construit avec suffixe pronominal exprime directement « leur Dieu » et souligne la relation d’alliance.
- source_word: וַיִּמְכֹּר
  choice: il les vendit
  rationale: מכר signifie littéralement « vendre ». Ici, le verbe décrit métaphoriquement le fait de livrer Israël au pouvoir de ses ennemis comme jugement; « vendit » conserve cette image forte.
- source_word: בְּיַד
  choice: aux mains de
  rationale: Cette tournure française conserve l’image hébraïque de la main comme symbole de pouvoir ou de domination, tout en restant naturelle.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Translittération française usuelle du nom propre.
- source_word: שַׂר צְבָא חָצוֹר
  choice: chef de l’armée de Hatsor
  rationale: שַׂר צְבָא désigne le responsable militaire; « chef de l’armée » est clair, actuel et fidèle à la relation syntaxique avec Hatsor.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Ethnonyme français standard.
- source_word: מֶלֶךְ מוֹאָב
  choice: le roi de Moab
  rationale: Traduction directe de la chaîne construite hébraïque.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: Ceux-ci leur firent la guerre
  rationale: Le verbe pluriel renvoie le plus naturellement aux puissances ennemies précédemment énumérées, tandis que le suffixe désigne les Israélites. « Faire la guerre à » rend naturellement לחם avec ב en français.
theological_decisions:
- issue: Sujet de « il les vendit »
  choice: Le sujet singulier implicite est Yahweh.
  alternative: Une formulation impersonnelle telle que « ils furent livrés » aurait pu masquer l’agent.
  rationale: Le groupe nominal « Yahweh, leur Dieu » précède immédiatement le verbe singulier et en constitue naturellement le sujet. La traduction maintient donc l’affirmation textuelle selon laquelle Yahweh livre judiciairement Israël à ses ennemis.
- issue: Portée de « oublièrent Yahweh »
  choice: Conserver « oublièrent », avec sa portée contextuelle d’infidélité à l’alliance.
  alternative: « abandonnèrent » ou « délaissèrent » expliciterait davantage l’idée d’infidélité.
  rationale: Le texte emploie le verbe ordinaire « oublier ». La traduction littérale laisse le contexte communiquer sa force théologique sans imposer une interprétation plus précise que l’hébreu.
- issue: Référent du pluriel dans la dernière proposition
  choice: « Ceux-ci » renvoie collectivement aux ennemis nommés.
  alternative: Conserver le simple pronom « ils », plus ambigu en français.
  rationale: Le verbe hébreu est pluriel et son référent le plus naturel est l’ensemble des puissances ennemies énumérées. « Ceux-ci » clarifie seulement le lien grammatical, sans identifier un acteur absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique soutenu. La répétition de « aux mains de » conserve l’anaphore et l’image du texte hébreu; la métaphore « vendit » est maintenue dans le corps du texte et expliquée en note.
