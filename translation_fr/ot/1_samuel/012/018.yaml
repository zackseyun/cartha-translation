  terminology: « Yahweh » rend correctement le tétragramme et sa répétition suit l’hébreu. « Coups de tonnerre » est un bon rendu contextuel de קֹלוֹת ; la note explique utilement le sens littéral sans introduire d’ambiguïté artificielle.
