  text: וַ/יִּקְרָ֤א שְׁמוּאֵל֙ אֶל יְהוָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה קֹלֹ֥ת וּ/מָטָ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּירָ֨א כָל הָ/עָ֥ם מְאֹ֛ד אֶת יְהוָ֖ה וְ/אֶת שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: fr
  text: Alors Samuel fit appel à Yahweh, et ce jour-là Yahweh envoya des coups de tonnerre[a] et de la pluie. Tout le peuple eut très peur de Yahweh et de Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu signifie littéralement « voix » ; dans ce contexte d’orage, il désigne des coups de tonnerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: fit appel à
  rationale: Avec אֶל יְהוָה, le verbe קרא décrit l’appel adressé à Yahweh dans la prière. « Fit appel à » est naturel en français et n’ajoute pas l’intensité qu’impliquerait « cria vers ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: וַיִּתֵּן
  choice: envoya
  rationale: Le sens littéral est « donna », mais, à propos d’un phénomène météorologique causé par Dieu, « envoya » exprime naturellement l’idiome hébreu.
- source_word: קֹלֹת
  choice: coups de tonnerre
  rationale: Le nom signifie littéralement « voix » ou « sons », mais au pluriel, dans ce contexte d’orage et avec la pluie, il désigne le tonnerre. « Coups de tonnerre » restitue aussi la pluralité.
- source_word: וּמָטָר
  choice: de la pluie
  rationale: Rendu direct de מָטָר, sans ajouter l’intensité d’une averse ou d’un déluge.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression française idiomatique qui conserve la précision temporelle de l’hébreu.
- source_word: וַיִּירָא כָל הָעָם מְאֹד
  choice: Tout le peuple fut saisi d’une très grande crainte
  rationale: Cette formulation naturelle conserve la force de ירא et l’intensification marquée par מְאֹד, sans réduire la réaction à un simple respect.
- source_word: אֶת יְהוָה וְאֶת שְׁמוּאֵל
  choice: envers Yahweh et Samuel
  rationale: Les deux compléments dépendent du même terme exprimant la crainte. La coordination est maintenue sans définir différemment la nature de cette crainte pour chacun.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Crainte éprouvée envers Yahweh et Samuel
  choice: une très grande crainte envers Yahweh et Samuel
  alternative: la crainte de Yahweh et du respect pour Samuel
  rationale: L’hébreu emploie un seul verbe pour les deux objets. Le texte français conserve cette tension et n’impose pas deux attitudes distinctes, tout en n’affirmant aucune égalité de statut entre Yahweh et Samuel.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « fut saisi d’une très grande crainte » exprime fortement la réaction collective tout en évitant un archaïsme. La répétition du nom Yahweh suit celle du texte hébreu.
