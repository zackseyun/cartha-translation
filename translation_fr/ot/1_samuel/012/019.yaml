  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: fr
  text: 'Alors tout le peuple dit à Samuel : « Prie[a] Yahweh, ton Dieu, en faveur de tes serviteurs, afin que nous ne mourions pas, car nous avons ajouté à tous nos péchés ce mal : demander un roi pour nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Intercède auprès de Yahweh, ton Dieu, en faveur de tes serviteurs ».
    reason: Alternative lexicale explicitant la valeur intercessrice de la prière indiquée par בְּעַד.
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: Alors tout le peuple dit
  rationale: Le waw narratif fait progresser le récit ; « Alors » rend naturellement cette succession. Le singulier « dit » s’accorde avec le collectif « tout le peuple » en français.
- source_word: הִתְפַּלֵּל
  choice: Prie
  rationale: L’impératif désigne l’acte de prier. Le complément בְּעַד explicite sa fonction d’intercession, sans qu’il soit nécessaire de remplacer le verbe par une interprétation plus précise dans le texte principal.
- source_word: בְּעַד עֲבָדֶיךָ
  choice: en faveur de tes serviteurs
  rationale: בְּעַד signifie ici « pour, en faveur de ». « Tes serviteurs » conserve la manière déférente dont le peuple s’adresse à Samuel.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré, et le suffixe de deuxième personne du singulier est conservé. La virgule rend l’apposition naturelle en français.
- source_word: וְאַל נָמוּת
  choice: afin que nous ne mourions pas
  rationale: Dans le prolongement de la demande de prière, la tournure exprime le résultat négatif souhaité. Cette formulation française évite de faire de Samuel celui qui aurait directement le pouvoir de les laisser mourir.
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ
  choice: car nous avons ajouté à tous nos péchés
  rationale: יסף avec עַל présente ce nouvel acte comme venant s’ajouter à un ensemble de péchés déjà commis ; la formulation garde cette force cumulative.
- source_word: רָעָה
  choice: ce mal
  rationale: Le terme désigne ici un mal moral reconnu par le peuple. « Ce mal » en conserve la gravité sans amplification.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: demander un roi pour nous-mêmes
  rationale: L’infinitif précise en quoi consiste le mal confessé. « Pour nous-mêmes » fait ressortir לָנוּ et la dimension intéressée de la demande sans la surinterpréter.
theological_decisions:
- issue: Portée relationnelle de « Yahweh, ton Dieu »
  choice: 'Conserver la deuxième personne : « Yahweh, ton Dieu »'
  alternative: « Yahweh, notre Dieu »
  rationale: Le peuple sollicite Samuel comme intercesseur et s’adresse expressément à lui à la deuxième personne. Modifier le pronom effacerait la tension rhétorique du passage, sans que le texte nie pour autant l’appartenance d’Israël à Yahweh.
- issue: Qualification morale de la demande d’un roi
  choice: 'Conserver la confession explicite : « ce mal »'
  alternative: Atténuer en « cette faute » ou « ce tort »
  rationale: רָעָה qualifie nettement la demande comme un mal dans ce contexte. La traduction ne doit ni atténuer ce jugement ni l’étendre en une condamnation générale de toute royauté au-delà de l’énoncé.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond aux formes hébraïques de deuxième personne du singulier adressées à Samuel. La structure de confession cumulative et l’expression « ton Dieu » sont maintenues sans résoudre leur tension théologique.
