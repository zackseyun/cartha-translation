  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: fr
  text: 'Il leur dit : « Yahweh est témoin contre vous[a], et son oint[b] est témoin aujourd’hui : vous n’avez rien trouvé en ma possession. » Ils répondirent[c] : « Il en est témoin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement, « témoin parmi vous » ou « témoin avec vous ». Dans ce contexte, l’expression a une portée judiciaire : Yahweh se tient comme témoin dans l’affaire qui les concerne.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son oint ». Il s’agit ici du roi Saül, consacré par l’onction, et non directement du titre messianique ultérieur.
    reason: cultural_note
  - marker: c
    text: Le verbe hébreu est au singulier (« il dit »), mais il exprime ici la réponse collective du peuple ; d’où le pluriel en français.
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: témoin
  rationale: Le nom désigne ici un témoin dans un cadre judiciaire ou d’alliance. « Témoin » conserve la force personnelle et juridique du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בָּכֶם
  choice: contre vous
  rationale: 'Avec עֵד dans ce contexte de justification publique, la préposition reçoit naturellement un sens judiciaire : Yahweh est témoin dans l’affaire qui concerne le peuple, avec une portée potentiellement défavorable.'
- source_word: מְשִׁיחוֹ
  choice: celui qu’il a consacré par l’onction
  rationale: Cette formulation naturelle en français exprime le sens royal concret du terme sans employer « Messie », qui importerait ici des associations postérieures, ni le peu courant « son oint ».
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: « Aujourd’hui » rend naturellement l’expression temporelle hébraïque tout en convenant à cette déclaration publique solennelle.
- source_word: מְצָאתֶם
  choice: vous n’avez rien trouvé
  rationale: Le passé composé exprime l’examen achevé dont le résultat est proclamé au moment présent.
- source_word: בְּיָדִי
  choice: entre mes mains
  rationale: Cette expression française conserve l’image hébraïque de la main comme lieu de possession ou de contrôle, sans rendre la phrase obscure.
- source_word: מְאוּמָה
  choice: rien
  rationale: Sous la négation, le mot signifie « quoi que ce soit » ; « rien » est son équivalent idiomatique en français.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Il leur dit ... Ils répondirent
  rationale: Le premier singulier renvoie à Samuel. Le dernier verbe est morphologiquement singulier, mais le contexte indique la réponse collective du peuple ; le pluriel français rend cette fonction contextuelle, signalée en note.
theological_decisions:
- issue: Sens de מְשִׁיחוֹ dans ce contexte royal
  choice: celui qu’il a consacré par l’onction
  alternative: son Messie / son oint
  rationale: Le référent immédiat est Saül, le roi récemment établi. La traduction conserve l’idée d’onction et de consécration divine sans transformer ce passage en désignation messianique directe.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère public et judiciaire de la scène. « Celui qu’il a consacré par l’onction » évite à la fois l’archaïsme de « son oint » et l’anachronisme possible de « son Messie ».
