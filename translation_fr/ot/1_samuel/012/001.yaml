  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל כָּל יִשְׂרָאֵ֔ל הִנֵּה֙ שָׁמַ֣עְתִּי בְ/קֹֽלְ/כֶ֔ם לְ/כֹ֥ל אֲשֶׁר אֲמַרְתֶּ֖ם לִ֑/י וָ/אַמְלִ֥יךְ עֲלֵי/כֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: fr
  text: 'Samuel dit à tout Israël : « Voici, j’ai écouté tout ce que vous m’avez dit et j’ai fait régner un roi sur vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voyez
  rationale: Marque ici une invitation solennelle à constater ce qui suit ; « Voyez » est naturel en français moderne tout en gardant la force déictique de l’hébreu.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: j’ai écouté tout ce que vous m’avez dit
  rationale: L’expression idiomatique signifie que Samuel a prêté attention à leur voix et accédé à leur demande. La formulation française reste proche du contexte immédiat sans reproduire maladroitement « écouter votre voix ».
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: j’ai établi un roi sur vous
  rationale: La forme causative de מלך indique que Samuel a fait accéder le roi à la royauté. « Établi » exprime naturellement cette intronisation, tandis que « sur vous » conserve l’idée d’autorité présente dans עֲלֵיכֶם.
theological_decisions:
- issue: Rôle de Samuel dans l’établissement du roi
  choice: j’ai établi un roi sur vous
  alternative: j’ai fait régner un roi sur vous
  rationale: La traduction conserve l’attribution explicite de l’acte à Samuel sans préciser davantage le rapport entre son action et celle de Dieu ; elle évite ainsi de résoudre une tension que le verset laisse intacte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde l’adresse solennelle à l’ensemble d’Israël, tout en rendant idiomatiquement l’expression hébraïque relative à l’écoute de leur demande.
