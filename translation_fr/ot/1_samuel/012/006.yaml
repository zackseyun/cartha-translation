  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: fr
  text: 'Samuel dit alors au peuple : « C’est Yahweh qui a établi Moïse et Aaron[a], et qui a fait monter vos pères[b] du pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui a fait Moïse et Aaron ». Ici, le verbe hébreu évoque probablement l’action par laquelle Yahweh les a établis dans leur fonction.'
    reason: lexical_alternative
  - marker: b
    text: « Vos pères » peut aussi se comprendre au sens plus large de « vos ancêtres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: Samuel dit alors au peuple
  rationale: Le waw narratif fait progresser le récit. « Alors » exprime naturellement cette succession en français, tandis que « dit au peuple » rend directement l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: qui a établi Moïse et Aaron
  rationale: Le sens premier de עשה est « faire », mais cette formulation serait trompeuse en français, comme s’il était question de leur création. Dans ce rappel des actes de Yahweh, « établir » exprime naturellement son action par laquelle Moïse et Aaron ont reçu leur fonction, sans préciser davantage le mode de cette désignation.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: et qui a fait monter
  rationale: Le hifil de עלה signifie « faire monter » ou « amener en haut ». Cette traduction conserve l’image hébraïque traditionnelle de la montée hors d’Égypte.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: vos pères
  rationale: Cette formulation reproduit le masculin explicite de l’hébreu. Dans le contexte, elle désigne les générations antérieures et peut donc aussi se comprendre comme « vos ancêtres ».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Rendu direct et naturel de la formule hébraïque, qui conserve la mention du « pays ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Sens de עָשָׂה appliqué à Moïse et Aaron
  choice: a établi Moïse et Aaron
  alternative: a fait Moïse et Aaron
  rationale: Le propos concerne l’action souveraine de Yahweh à l’égard des dirigeants d’Israël, non leur création comme personnes. « Établi » communique ce sens fonctionnel, tandis qu’une note conserve le sens plus littéral et l’ambiguïté lexicale.
- issue: Identification emphatique de Yahweh comme agent
  choice: C’est Yahweh qui
  alternative: Yahweh, qui a établi…
  rationale: La tournure clivée française rend naturellement la proposition nominale hébraïque qui identifie Yahweh comme l’auteur des actes rappelés.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « C’est Yahweh qui » rend clairement l’identification emphatique de l’agent. « A fait monter » conserve l’image de l’hébreu, tandis que « a établi » évite le contresens que produirait en français un calque de « a fait ».
