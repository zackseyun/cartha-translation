id: 1SA.12.11
reference: 1 Samuel 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: fr
  text: Yahvé a envoyé Yeroubbaal[a], Bedân[b], Jephté et Samuel. Il vous a délivrés de la main de vos ennemis qui vous entouraient, et vous avez vécu en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeroubbaal est un autre nom de Gédéon (voir Juges 6.32; 7.1).
    reason: cross_reference
  - marker: b
    text: 'Hébreu : « Bedân ». Son identité est incertaine; certains comprennent « Barak » et, plus rarement, « Abdôn ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom divin, plutôt qu’un titre de substitution.
- source_word: וַיִּשְׁלַח
  choice: a envoyé
  rationale: Rend directement le verbe שׁלח dans un français moderne et naturel.
- source_word: יְרֻבַּעַל
  choice: Yeroubbaal
  rationale: Conserve le nom présent dans le texte hébreu; son identification à Gédéon est indiquée en note.
- source_word: בְּדָן
  choice: Bedân
  rationale: Conserve la leçon du texte massorétique sans l’harmoniser avec une autre tradition.
- source_word: יִפְתָּח
  choice: Jephté
  rationale: Forme française usuelle de ce nom biblique.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forme française usuelle de ce nom biblique.
- source_word: וַיַּצֵּל
  choice: a délivrés
  rationale: Exprime le sauvetage hors d’un danger et s’accorde naturellement avec l’image suivante de la main des ennemis.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: de la main de vos ennemis
  rationale: Préserve l’image hébraïque de la main comme pouvoir ou domination, tout en restant claire en français.
- source_word: מִסָּבִיב
  choice: qui vous entouraient
  rationale: Intègre naturellement en français l’idée spatiale d’ennemis présents de tous côtés.
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: vous avez vécu en sécurité
  rationale: Rend l’établissement durable et sûr exprimé par ישׁב et בּטח dans un français courant.
theological_decisions:
- issue: Identité de בְּדָן
  choice: Maintenir « Bedân » dans le texte principal comme le nom propre attesté par le texte massorétique.
  alternative: Barak; plus rarement Abdôn.
  rationale: L’identité du personnage demeure incertaine. La traduction ne corrige donc pas silencieusement le texte hébreu et signale les principales identifications proposées en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé évite un registre littéraire vieilli, tandis que l’expression « de la main de » conserve une image importante du texte hébreu. Les noms difficiles sont maintenus dans le texte et expliqués en notes.
