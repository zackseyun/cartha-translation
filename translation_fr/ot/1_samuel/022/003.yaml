source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: fr
  text: 'David partit de là pour Mitspé de Moab. Il dit au roi de Moab : « Je vous prie de permettre à mon père et à ma mère de venir demeurer avec vous[a], jusqu’à ce que je sache ce que Dieu fera pour moi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que mon père et ma mère sortent ». Dans ce contexte, la demande concerne leur départ auprès du roi de Moab afin qu’ils demeurent sous sa protection.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce que Dieu me fera » ou « ce que Dieu fera de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד מִשָּׁם
  choice: David partit de là
  rationale: Le verbe הלך fait avancer le récit en exprimant un déplacement. « Partit de là » est naturel en français et marque clairement le point de départ.
- source_word: מִצְפֵּה מוֹאָב
  choice: Mitspé de Moab
  rationale: Translittération du nom de lieu selon la vocalisation מִצְפֵּה (Miṣpê), avec une graphie française lisible.
- source_word: מֶלֶךְ מוֹאָב
  choice: le roi de Moab
  rationale: Rend directement le syntagme construit désignant le souverain auquel David s’adresse.
- source_word: יֵצֵא נָא
  choice: Permettez, je vous prie, … de venir demeurer
  rationale: Le jussif de יצא signifie littéralement « qu’il sorte / qu’elle sorte », et נָא exprime une demande polie. Dans le contexte, David demande que ses parents quittent leur situation présente pour demeurer sous la protection du roi. La formulation française exprime naturellement ce mouvement et le séjour demandé, tandis que la note conserve le sens littéral.
- source_word: אָבִי וְאִמִּי
  choice: mon père et ma mère
  rationale: La traduction conserve les deux termes explicitement employés en hébreu plutôt que de les résumer par « mes parents ».
- source_word: אִתְּכֶם
  choice: auprès de vous
  rationale: « Auprès de vous » exprime une présence durable et convient à une adresse respectueuse au roi. L’hébreu emploie une forme plurielle, qui peut englober le roi et les siens.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: jusqu’à ce que je sache
  rationale: Cette formulation reproduit clairement la limite temporelle indiquée par la proposition hébraïque.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: ce que Dieu fera pour moi
  rationale: La préposition ל peut ici se comprendre comme « pour », « à » ou « de » David. « Pour moi » est idiomatique et convient à l’attente de l’action divine, sans supprimer les autres possibilités signalées en note.
theological_decisions:
- issue: Sens de אֱלֹהִים dans les paroles de David
  choice: Dieu
  alternative: un dieu / des dieux
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים régit ici un verbe au singulier et désigne le Dieu d’Israël dans le contexte narratif.
- issue: Orientation de l’action divine dans מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: ce que Dieu fera pour moi
  alternative: ce que Dieu me fera / ce que Dieu fera de moi
  rationale: La préposition לִי laisse ouverte la manière précise dont l’action de Dieu concernera David. Le texte principal adopte une tournure française naturelle, et la note préserve l’ambiguïté théologique et grammaticale.
translation_notes:
  register: Français international moderne, narratif et digne. Le vouvoiement convient à l’adresse au roi et permet aussi de laisser entendre la forme plurielle de אִתְּכֶם, qui peut inclure sa maison ou sa cour. Les notes maintiennent les ambiguïtés lexicales réelles sans alourdir le texte principal.
