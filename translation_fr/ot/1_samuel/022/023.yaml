source:
  edition: WLC
  text: שְׁבָ֤/ה אִתִּ/י֙ אַל תִּירָ֔א כִּ֛י אֲשֶׁר יְבַקֵּ֥שׁ אֶת נַפְשִׁ֖/י יְבַקֵּ֣שׁ אֶת נַפְשֶׁ֑/ךָ כִּֽי מִשְׁמֶ֥רֶת אַתָּ֖ה עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: fr
  text: Reste avec moi et n’aie pas peur, car celui qui en veut à ma vie en veut aussi à la tienne. Auprès de moi, tu es en sécurité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car tu es sous bonne garde auprès de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: Reste avec moi
  rationale: Dans ce contexte, l’impératif de ישׁב invite Abiathar à demeurer auprès de David, non à s’asseoir. « Reste avec moi » est naturel et fidèle à la situation.
- source_word: אַל תִּירָא
  choice: n’aie pas peur
  rationale: Expression prohibitive courante, rendue en français moderne et direct.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: celui qui en veut à ma vie
  rationale: « En vouloir à la vie de quelqu’un » exprime naturellement l’intention de le tuer. Le singulier de la construction hébraïque est conservé par « celui qui ».
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans l’expression « chercher la נֶפֶשׁ », le mot désigne la vie menacée, et non une âme immatérielle.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: en veut aussi à la tienne
  rationale: La répétition hébraïque est rendue par une reprise pronominale naturelle. « Aussi » explicite le parallélisme, sans modifier son sens.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: Auprès de moi, tu es en sécurité
  rationale: Le nom מִשְׁמֶרֶת évoque ici la garde ou la protection. Cette formulation française transmet clairement l’assurance donnée tout en maintenant la proximité exprimée par עִמָּדִי; une note signale la tournure hébraïque inhabituelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse singulière. L’expression idiomatique « en vouloir à la vie de quelqu’un » évite le contresens possible de « chercher l’âme »; la dernière proposition reste une assurance de protection humaine dans le contexte, sans lui attribuer une portée doctrinale supplémentaire.
