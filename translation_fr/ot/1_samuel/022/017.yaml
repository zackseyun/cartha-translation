  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: fr
  text: 'Puis le roi dit aux coureurs qui se tenaient autour de lui[a] : « Tournez-vous et mettez à mort les prêtres de Yahweh, car eux aussi soutiennent David[b], et ils savaient qu’il était en fuite sans m’en informer[c]. » Cependant, les serviteurs du roi refusèrent de lever la main contre les prêtres de Yahweh pour les frapper.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu signifie littéralement « coureurs ». Dans une cour royale, il peut désigner des hommes attachés au roi comme gardes ou messagers.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « leur main est aussi avec David », expression qui signifie qu’ils le soutiennent ou prennent son parti.'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « ils n’ont pas découvert son oreille », c’est-à-dire qu’ils n’ont pas informé le roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרָצִים
  choice: aux coureurs
  rationale: Le participe de רוץ signifie littéralement « coureurs » et peut désigner, dans un cadre royal, des hommes servant comme gardes ou messagers. Le terme source est conservé, avec une note explicative pour éviter un contresens moderne.
- source_word: הַנִּצָּבִים עָלָיו
  choice: qui se tenaient autour de lui
  rationale: נצב avec על désigne ici des serviteurs présents auprès du roi. Cette formulation restitue naturellement la scène de cour.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: Tournez-vous et mettez à mort
  rationale: L’impératif סֹבּוּ commande aux hommes de se tourner vers les prêtres, et le hiphil de מות signifie les faire mourir. « Mettez à mort » reste direct sans ajouter la nuance juridique d’une exécution légitime.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: car eux aussi soutiennent David
  rationale: L’expression littérale « leur main est aussi avec David » est un idiome de soutien ou de parti pris. Le sens est donné dans le texte et l’image hébraïque dans une note.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: Ils savaient qu’il était en fuite
  rationale: Le participe בֹרֵחַ présente David dans la situation continue d’un homme en fuite, sans imposer l’idée d’une action déjà achevée.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: mais ils ne m’en ont pas informé
  rationale: L’idiome « découvrir l’oreille » signifie révéler ou informer. Le pronom de première personne convient au discours direct du roi.
- source_word: וְלֹא אָבוּ
  choice: refusèrent
  rationale: אבה exprime ici l’absence de consentement. « Refusèrent » rend clairement leur volonté de ne pas obéir.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: de porter la main sur … pour les frapper
  rationale: La formulation conserve l’image de la main tendue en vue d’une action hostile, tandis que « frapper » rend פגע sans atténuer la violence.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Qualification morale de l’ordre de Saül
  choice: Aucune qualification ajoutée dans le texte
  alternative: Présenter explicitement l’ordre comme une exécution injuste
  rationale: Le récit expose l’ordre meurtrier et le refus des serviteurs, mais ce verset ne formule pas lui-même un jugement explicite. La traduction laisse subsister cette tension narrative sans ajouter de commentaire doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures opaques sont rendues clairement dans le texte tout en étant conservées dans les notes. « Coureurs » est maintenu comme terme de cour biblique, accompagné d’une explication.
