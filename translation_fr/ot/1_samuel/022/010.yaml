  text: וַ/יִּשְׁאַל ל/וֹ֙ בַּֽ/יהוָ֔ה וְ/צֵידָ֖ה נָ֣תַן ל֑/וֹ וְ/אֵ֗ת חֶ֛רֶב גָּלְיָ֥ת הַ/פְּלִשְׁתִּ֖י נָ֥תַן לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: fr
  text: Il consulta Yahweh pour lui[a], lui donna des provisions et lui donna l’épée de Goliath le Philistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il interrogea Yahweh pour lui. »'
    reason: Alternative lexicale permettant de conserver plus directement le sens de demande associé à שׁאל, tandis que « consulta » exprime naturellement la construction cultuelle en français.
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: Il consulta Yahweh pour lui
  rationale: Dans cette construction, שׁאל avec ב suivi du nom divin exprime le fait de consulter la divinité ou de l’interroger. « Pour lui » conserve לּוֹ et indique que la démarche est faite en sa faveur.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Le tétragramme יהוה est rendu par le nom propre « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: צֵידָה
  choice: des provisions
  rationale: צֵידָה désigne des vivres ou ressources destinés notamment au voyage ; « provisions » est naturel et suffisamment large en français.
- source_word: נָתַן לוֹ
  choice: lui donna
  rationale: Cette formulation rend directement le verbe נתן et son complément indirect. Sa répétition préserve la cadence accusatrice du texte hébreu.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: et l’épée de Goliath le Philistin
  rationale: Cette tournure reproduit clairement la chaîne construite hébraïque et conserve l’apposition « le Philistin ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve ici le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de לּוֹ dans la consultation de Yahweh
  choice: pour lui
  alternative: en sa faveur
  rationale: Le pronom indique naturellement que la consultation est faite pour David, sans préciser davantage la nature ou le résultat de l’oracle.
translation_notes:
  register: Français moderne, courant et digne. La répétition de « lui donna » est maintenue pour refléter la structure hébraïque ; « le Philistin » est conservé comme désignation appositive traditionnelle.
