base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: fr
  text: David partit de là et s’échappa vers la grotte d’Adoullam. Lorsque ses frères et toute la famille de son père l’apprirent, ils descendirent là-bas auprès de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Dans cette séquence narrative, « partit » exprime naturellement le départ de David depuis le lieu précédent, sans ajouter l’idée d’une destination particulière.
- source_word: מִשָּׁם
  choice: de là
  rationale: Rendu idiomatique et direct de l’adverbe déictique indiquant le lieu quitté.
- source_word: וַיִּמָּלֵט
  choice: s’échappa
  rationale: Le nifal de מלט exprime ici le fait de se soustraire avec succès au danger; « s’échappa » en conserve la valeur résultative sans réduire le verbe à un simple déplacement.
- source_word: מְעָרַת עֲדֻלָּם
  choice: la grotte d’Adoullam
  rationale: Le syntagme construit désigne la grotte associée au lieu nommé Adoullam; cette formulation est claire et traditionnelle en français.
- source_word: וַיִּשְׁמְעוּ
  choice: l’apprirent
  rationale: Le verbe שמע signifie littéralement « entendirent », mais, sans complément explicite en hébreu, « l’apprirent » rend plus naturellement en français le fait qu’ils eurent connaissance de la situation ou du lieu où se trouvait David.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le masculin pluriel désigne ici les frères de David.
- source_word: כָל בֵּית אָבִיו
  choice: toute la famille de son père
  rationale: L’expression idiomatique « maison de son père » renvoie au groupe familial paternel plutôt qu’au bâtiment; « famille » est courant et compréhensible en français moderne.
- source_word: וַיֵּרְדוּ
  choice: ils descendirent
  rationale: « Descendirent » préserve explicitement l’orientation topographique exprimée par ירד tout en convenant au registre narratif.
- source_word: אֵלָיו שָׁמָּה
  choice: là auprès de lui
  rationale: Cette formulation conserve à la fois l’indication du lieu (« là ») et le mouvement vers David (« auprès de lui »), dans un ordre naturel en français.
