  text: וַ/יִּשְׁלַ֣ח הַ/מֶּ֡לֶךְ לִ/קְרֹא֩ אֶת אֲחִימֶ֨לֶךְ בֶּן אֲחִיט֜וּב הַ/כֹּהֵ֗ן וְ/אֵ֨ת כָּל בֵּ֥ית אָבִ֛י/ו הַ/כֹּהֲנִ֖ים אֲשֶׁ֣ר בְּ/נֹ֑ב וַ/יָּבֹ֥אוּ כֻלָּ֖/ם אֶל הַ/מֶּֽלֶךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: fr
  text: Alors le roi envoya appeler Ahimélek, fils d’Ahitoub, le prêtre, ainsi que toute sa famille paternelle[a], les prêtres qui se trouvaient à Nob. Ils vinrent tous auprès du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne ici la maisonnée paternelle au sens large, voire le clan, et non seulement la famille proche d’Ahimélek.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: envoya appeler
  rationale: Cette tournure française naturelle conserve à la fois l’action d’envoyer et l’ordre de faire venir quelqu’un, exprimé par שׁלח suivi de l’infinitif קרא.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  choice: Ahimélek, fils d’Ahitoub
  rationale: Les noms propres sont translittérés, et la filiation indiquée par בֶּן est rendue directement par « fils de ».
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le nom en apposition précise la fonction d’Ahimélek sans ajouter de nuance absente de l’hébreu.
- source_word: כָּל בֵּית אָבִיו
  choice: toute sa famille paternelle
  rationale: L’expression hébraïque désigne la maisonnée ou le groupe familial rattaché au père. « Famille paternelle » est plus naturel en français moderne que le calque « maison de son père », tout en gardant la portée collective de l’expression.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: les prêtres qui se trouvaient à Nob
  rationale: La proposition identifie la famille paternelle comme le groupe de prêtres établi à Nob. « Se trouvaient à » exprime naturellement la localisation.
- source_word: וַיָּבֹאוּ כֻלָּם
  choice: Ils vinrent tous
  rationale: La position de « tous » préserve l’insistance de כֻּלָּם sur la totalité des personnes convoquées.
- source_word: אֶל הַמֶּלֶךְ
  choice: auprès du roi
  rationale: La préposition אֶל marque le mouvement en direction du roi. « Auprès du roi » convient à une comparution sans imposer le sens plus précis de « devant le roi ».
