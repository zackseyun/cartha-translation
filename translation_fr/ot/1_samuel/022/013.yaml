  text: וַ/יֹּ֤אמֶר אל/ו שָׁא֔וּל לָ֚/מָּה קְשַׁרְתֶּ֣ם עָלַ֔/י אַתָּ֖ה וּ/בֶן יִשָׁ֑י בְּ/תִתְּ/ךָ֨ ל֜/וֹ לֶ֣חֶם וְ/חֶ֗רֶב וְ/שָׁא֥וֹל ל/וֹ֙ בֵּֽ/אלֹהִ֔ים לָ/ק֥וּם אֵלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: fr
  text: 'Saül lui dit : « Pourquoi toi et le fils de Jessé avez-vous conspiré contre moi, en lui donnant du pain et une épée et en consultant Dieu pour lui[a], pour qu’il se soulève contre moi et me tende une embuscade, comme c’est le cas aujourd’hui[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en interrogeant Dieu pour lui ».
    reason: Variante lexicale possible pour le contexte de consultation divine.
  - marker: b
    text: Ou « si bien qu’il s’est soulevé contre moi pour me tendre une embuscade, comme aujourd’hui ».
    reason: La construction hébraïque peut aussi être comprise comme exprimant le résultat déjà manifeste plutôt que le but.
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: avez-vous conspiré
  rationale: Dans ce contexte royal et hostile, קשר désigne une conspiration contre le souverain, et non une simple association.
- source_word: בֶן יִשָׁי
  choice: le fils de Jessé
  rationale: Le patronyme est conservé, car Saül évite ostensiblement le nom de David et exprime ainsi sa distance ou son mépris.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: en lui donnant du pain et une épée
  rationale: La construction infinitive avec בְּ présente ces actes comme les moyens ou circonstances de la conspiration alléguée.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: et en consultant Dieu pour lui
  rationale: Dans ce contexte sacerdotal, שׁאל בֵּאלֹהִים signifie rechercher auprès de Dieu une orientation ou une réponse; « consulter Dieu » est naturel et précis en français.
- source_word: בֵּאלֹהִים
  choice: Dieu
  rationale: Le texte hébreu porte אֱלֹהִים et non le nom divin YHWH; « Dieu » respecte donc la forme lexicale du texte source.
- source_word: לָקוּם אֵלַי
  choice: afin qu’il se dresse contre moi
  rationale: L’infinitif peut exprimer le but ou le résultat selon l’accusation de Saül. Le subjonctif français conserve cette nuance sans présenter nécessairement l’accusation comme un fait objectif.
- source_word: לְאֹרֵב
  choice: et me tende une embuscade
  rationale: L’infinitif de ארב évoque l’action de guetter en embuscade. Cette formulation est idiomatique et conserve l’image hostile.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme il le fait aujourd’hui
  rationale: L’expression renvoie à la situation présente telle que Saül la perçoit. Cette formulation restitue naturellement en français l’accent sur l’état actuel des choses.
theological_decisions:
- issue: Désignation de la divinité dans בֵּאלֹהִים
  choice: Dieu
  alternative: le SEIGNEUR
  rationale: Le texte source emploie אֱלֹהִים, non YHWH. La traduction ne remplace donc pas le terme par le nom d’alliance.
- issue: Statut de l’accusation de Saül exprimée par לָקוּם
  choice: afin qu’il se dresse contre moi
  alternative: si bien qu’il s’est dressé contre moi
  rationale: La construction hébraïque permet une nuance de but ou de résultat. Le choix retenu préserve la formulation accusatrice de Saül sans trancher narrativement la culpabilité de David.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement correspond à l’adresse directe de Saül à Ahimélek, tandis que le pluriel de « avez-vous » inclut Ahimélek et le fils de Jessé. La syntaxe conserve la longue accusation de Saül tout en restant intelligible.
