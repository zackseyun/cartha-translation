base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: fr
  text: 'David dit à Abiathar : « Ce jour-là, quand Doëg l’Édomite se trouvait là[a], je savais qu’il ne manquerait pas d’informer Saül[b]. C’est moi qui suis responsable de la mort de tous les membres de la famille de ton père[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que Doëg l’Édomite se trouvait là ». La conjonction hébraïque peut introduire le contenu de ce que David savait plutôt qu’une circonstance temporelle.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici une construction emphatique, littéralement : « informer, il informerait »; elle marque la certitude qu’il informerait Saül.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « J’ai causé la mort de tous les membres de la famille de ton père » ou « Je suis la cause de la mort de tous les membres de la famille de ton père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: je savais
  rationale: Le parfait de ידע exprime ici le savoir que David avait déjà ce jour-là; « je savais » est direct et naturel.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Rend naturellement la référence définie à un jour précis du passé.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: quand Doëg l’Édomite était présent
  rationale: Cette lecture donne à la proposition une valeur circonstancielle et temporelle naturelle, tout en signalant en note que כִּי peut aussi introduire le contenu de ce que David savait.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: qu’il ne manquerait pas d’informer Saül
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de l’action; cette tournure française restitue l’emphase sans ajouter de complément explicite.
- source_word: אָנֹכִי
  choice: C’est moi qui
  rationale: La construction clivée rend l’insistance portée par le pronom indépendant אָנֹכִי.
- source_word: סַבֹּתִי
  choice: suis responsable de la mort de
  rationale: Dans ce contexte de massacre, le verbe exprime la responsabilité causale reconnue par David. La mention de la mort explicite en français le résultat contextuellement certain, tout en conservant en note les traductions plus formelles.
- source_word: בְּכָל נֶפֶשׁ
  choice: de tous les membres
  rationale: נֶפֶשׁ désigne ici les personnes dont la vie a été prise; « tous les membres » s’accorde naturellement avec la famille et évite le sens spiritualisé de « âme ».
- source_word: בֵּית אָבִיךָ
  choice: de la famille de ton père
  rationale: L’expression désigne la maisonnée ou famille paternelle; cette formulation est plus courante en français moderne que le calque « maison de ton père ».
theological_decisions:
- issue: Portée de la confession de responsabilité de David
  choice: « C’est moi qui suis responsable de la mort de… »
  alternative: « J’ai causé la mort de… » / « Je suis la cause de la mort de… »
  rationale: La traduction présente clairement l’aveu de responsabilité sans préciser au-delà de l’hébreu si David revendique une causalité directe ou indirecte.
translation_notes:
  register: Français international moderne, digne et accessible. « Doëg » conserve le tréma usuel pour guider la prononciation. La formulation évite le calque « maison de ton père » et restitue l’emphase de l’hébreu par des tournures françaises naturelles.
