  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ ל/דויג סֹ֣ב אַתָּ֔ה וּ/פְגַ֖ע בַּ/כֹּהֲנִ֑ים וַ/יִּסֹּ֞ב דויג הָ/אֲדֹמִ֗י וַ/יִּפְגַּע הוּא֙ בַּ/כֹּ֣הֲנִ֔ים וַ/יָּ֣מֶת בַּ/יּ֣וֹם הַ/ה֗וּא שְׁמֹנִ֤ים וַ/חֲמִשָּׁה֙ אִ֔ישׁ נֹשֵׂ֖א אֵפ֥וֹד בָּֽד־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: fr
  text: 'Alors le roi dit à Doëg : « Tourne-toi et frappe les prêtres[a]. » Doëg l’Édomite se tourna donc et frappa les prêtres. Ce jour-là, il mit à mort quatre-vingt-cinq hommes qui portaient un éphod de lin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « attaque les prêtres » ou « jette-toi sur les prêtres ». Le verbe hébreu peut désigner plus largement une attaque violente ; « frappe » convient au contexte de l’exécution tout en laissant la mise à mort être explicitée dans la suite du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: Tourne-toi
  rationale: L’impératif de סב commande à Doëg de se tourner vers la tâche ou vers ceux qu’il doit frapper. « Tourne-toi » conserve la brièveté et la rudesse de l’ordre.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: frappe / frappa
  rationale: פגע peut désigner une rencontre hostile, une attaque ou le fait de frapper. « Frapper » exprime ici la violence de l’action sans la confondre d’emblée avec son résultat, formulé ensuite par « mit à mort ».
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Traduction directe du nom défini au pluriel.
- source_word: הָאֲדֹמִי
  choice: l’Édomite
  rationale: Le gentilé identifie l’origine de Doëg et se rend naturellement par « l’Édomite ».
- source_word: וַיָּמֶת
  choice: il mit à mort
  rationale: La forme causative de מות indique que Doëg causa leur mort. « Mit à mort » distingue le résultat de l’action exprimée auparavant par « frappa ».
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: quatre-vingt-cinq hommes
  rationale: איש après le nombre désigne ici les hommes qui exerçaient la fonction de prêtres.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: qui portaient un éphod de lin
  rationale: נשא peut s’employer pour un vêtement porté sur soi. L’éphod étant un vêtement sacerdotal, « portaient » est naturel, et בָּד précise qu’il était en lin.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Alors le roi dit
  rationale: Le waw narratif fait progresser le récit ; « Alors » marque naturellement cette succession en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La syntaxe conserve le caractère abrupt de l’ordre royal, tandis que la répétition « frappe / frappa » reproduit celle du verbe hébreu. « Éphod » est maintenu comme terme usuel du vocabulaire biblique sacerdotal.
