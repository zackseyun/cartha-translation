base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: fr
  text: 'Alors Saül dit à ses serviteurs qui se tenaient autour de lui : « Écoutez, je vous prie, fils de Benjamin ! Le fils de Jessé donnera-t-il, lui aussi, à vous tous des champs et des vignes ? Fera-t-il de vous tous des chefs de milliers et des chefs de centaines ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme désigne ici les hommes au service du roi; « serviteurs » conserve la relation hiérarchique sans préciser indûment leur fonction.
- source_word: הַנִּצָּבִים עָלָיו
  choice: qui se tenaient autour de lui
  rationale: Dans ce contexte de cour royale, l’expression décrit les serviteurs présents auprès de Saül. « Autour de lui » est naturel en français et correspond à leur position immédiate.
- source_word: שִׁמְעוּ נָא
  choice: Écoutez, je vous prie
  rationale: נָא apporte une nuance de sollicitation ou d’insistance polie; « je vous prie » la conserve sans transformer l’appel en simple marqueur temporel.
- source_word: בְּנֵי יְמִינִי
  choice: fils de Benjamin
  rationale: Traduction formelle de l’expression tribale, qui souligne l’appel de Saül à ses compatriotes benjaminites.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: chefs de milliers et chefs de centaines
  rationale: Conserve les titres d’organisation militaire ou administrative du texte hébreu ainsi que leur parallélisme.
theological_decisions:
- issue: Portée rhétorique des deux questions de Saül
  choice: Maintenir les questions sans expliciter la réponse implicite
  alternative: Ajouter une formulation telle que « Pensez-vous que… ? » ou rendre les questions négatives
  rationale: L’hébreu formule deux interrogations rhétoriques, mais n’énonce pas leur réponse. La traduction préserve ainsi l’ironie accusatrice et la tension du discours.
translation_notes:
  register: Français moderne, digne et directement compréhensible. La répétition « vous tous » est maintenue dans les deux questions pour refléter לְכֻלְּכֶם et l’insistance de Saül sur les avantages collectifs accordés à ses hommes.
