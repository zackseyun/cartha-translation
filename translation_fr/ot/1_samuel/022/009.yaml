source:
  edition: WLC
  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: fr
  text: 'Alors Doëg l’Édomite, qui se tenait parmi les serviteurs de Saül,[a] répondit : « J’ai vu le fils de Jessé venir à Nob, auprès d’Ahimélek, fils d’Ahitoub. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui était posté à la tête des serviteurs de Saül ». L’expression hébraïque peut indiquer soit la place de Doëg parmi les serviteurs de Saül, soit une fonction d’autorité sur eux.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: répondit
  rationale: En français actuel, le verbe introducteur unique « répondit » restitue naturellement la formule narrative hébraïque « répondit et dit », dont la répétition serait lourde.
- source_word: הָאֲדֹמִי
  choice: l’Édomite
  rationale: L’article hébreu et l’apposition au nom Doëg indiquent une désignation ethnique définie.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: qui se tenait parmi les serviteurs de Saül
  rationale: נִצָּב exprime le fait de se tenir debout ou d’être posté. Ici, עַל permet soit une relation spatiale avec le groupe, soit une autorité sur lui; le texte principal retient la lecture contextuelle la moins interprétative et la note conserve l’autre possibilité.
- source_word: עַבְדֵי שָׁאוּל
  choice: les serviteurs de Saül
  rationale: עֲבָדִים peut désigner des serviteurs, des gens de cour ou des fonctionnaires. « Serviteurs » reste direct sans préciser indûment leur statut.
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le parfait rapporte une observation passée. Le passé composé est naturel dans le discours direct en français moderne.
- source_word: בֶּן יִשַׁי
  choice: le fils de Jessé
  rationale: La traduction maintient la désignation relationnelle choisie par l’hébreu au lieu de la remplacer par le nom David.
- source_word: בָּא
  choice: venir
  rationale: Après « j’ai vu », l’infinitif français rend naturellement l’action observée exprimée par le participe hébreu.
- source_word: נֹבֶה
  choice: à Nob
  rationale: Le hé directionnel indique un mouvement vers Nob; « à Nob » convient naturellement avec « venir ».
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: auprès d’Ahimélek, fils d’Ahitoub
  rationale: אֶל indique la personne vers laquelle David est venu. « Auprès de » évite la répétition maladroite de « à » tout en conservant l’idée de destination personnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent des graphies françaises usuelles. La formule hébraïque redondante « répondit et dit » est idiomatiquement condensée, tandis que l’ambiguïté de la position ou de la fonction de Doëg est explicitement préservée en note.
