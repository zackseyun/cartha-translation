base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: fr
  text: 'Le prophète Gad dit à David : « Ne reste pas dans la place forte. Pars et rends-toi[a] dans le territoire de Juda. » David partit et se rendit dans la forêt de Héreth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se traduire : « entre dans le territoire de Juda ». Le verbe signifie « venir » ou « entrer » et peut, selon le point de vue adopté, exprimer plus généralement le fait d’aller vers un lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: נָבִיא est le terme hébreu courant désignant un prophète; « voyant » correspondrait normalement à un autre terme.
- source_word: לֹא תֵשֵׁב
  choice: Ne reste pas
  rationale: Dans ce contexte, יָשַׁב indique le fait de demeurer à un endroit; « rester » exprime naturellement l’ordre pratique donné à David.
- source_word: בַּמְּצוּדָה
  choice: dans le refuge fortifié
  rationale: מְצוּדָה désigne ici un lieu difficile d’accès servant à la fois de protection et de refuge; cette formulation conserve ces deux aspects sans imposer l’image d’une forteresse construite.
- source_word: לֵךְ וּבָאתָ לְּךָ
  choice: Pars et rends-toi
  rationale: La traduction exprime idiomatiquement le mouvement ordonné par les deux verbes hébreux. Le datif לְּךָ apporte une nuance personnelle ou emphatique qui ne demande pas nécessairement un pronom distinct en français.
- source_word: אֶרֶץ יְהוּדָה
  choice: le territoire de Juda
  rationale: אֶרֶץ suivi du nom tribal désigne la région appartenant à Juda; « territoire » est précis et naturel en français moderne.
- source_word: וַיֵּלֶךְ דָּוִד וַיָּבֹא
  choice: David partit donc et se rendit
  rationale: La reprise des deux mouvements de l’ordre est conservée en français naturel; « donc » rend la progression narrative du וַ consécutif sans surcharger la phrase.
- source_word: יַעַר חָרֶת
  choice: la forêt de Héreth
  rationale: יַעַר signifie « forêt » ou « région boisée »; Héreth est conservé comme nom de lieu translittéré.
