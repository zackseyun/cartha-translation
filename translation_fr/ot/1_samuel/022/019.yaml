source:
  edition: WLC
  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: fr
  text: Il frappa aussi Nob, la ville des prêtres, du tranchant de l’épée[a], de l’homme à la femme et de l’enfant au nourrisson, ainsi que le bœuf, l’âne et le petit bétail, du tranchant de l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « à la bouche de l’épée », expression hébraïque signifiant mettre à mort par l’épée.
    reason: Précision sur l’image littérale et le sens idiomatique de לְפִי חֶרֶב.
lexical_decisions:
- source_word: נֹב
  choice: Nob
  rationale: Nom propre de lieu, conservé sous sa forme française traditionnelle.
- source_word: עִיר הַכֹּהֲנִים
  choice: la ville des prêtres
  rationale: Rend directement le groupe construit qui caractérise Nob par son association avec les prêtres.
- source_word: הִכָּה
  choice: il frappa
  rationale: Le verbe נכה a le sens large de « frapper ». Le complément « du tranchant de l’épée » indique ici sans ambiguïté une mise à mort, sans qu’il soit nécessaire de renforcer le verbe lui-même.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: du tranchant de l’épée
  rationale: Équivalent français concret et intelligible de l’expression idiomatique littéralement liée à la « bouche » de l’épée; la répétition hébraïque est conservée.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: de l’homme à la femme
  rationale: Conserve les termes sexués et la formule de totalité allant d’un groupe à l’autre, sans la neutraliser.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: de l’enfant au nourrisson
  rationale: עוֹלֵל désigne un jeune enfant et יוֹנֵק un enfant encore allaité; « nourrisson » exprime naturellement cette dernière nuance.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: ainsi que le bœuf, l’âne et le petit bétail
  rationale: שׁוֹר et חֲמוֹר sont rendus par leurs équivalents usuels. שֶׂה peut désigner une bête du petit bétail, mouton ou chèvre; « petit bétail » préserve cette étendue sémantique.
theological_decisions:
- issue: Termes humains sexués dans une formule de totalité
  choice: de l’homme à la femme
  alternative: hommes et femmes; toute personne
  rationale: Le texte nomme explicitement l’homme et la femme. La traduction conserve ce mérisme, qui exprime l’exhaustivité du massacre plutôt qu’une affirmation doctrinale sur les sexes.
- issue: Maintien de la rhétorique de la formule de massacre
  choice: Conserver les deux occurrences de « du tranchant de l’épée » et les deux formules « de… à… »
  alternative: Résumer par « il passa tout le monde au fil de l’épée »
  rationale: La répétition et l’ordre des victimes renforcent dans l’hébreu le caractère total de la destruction. Les conserver respecte la gravité et la tension du texte sans les atténuer.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la répétition solennelle de l’hébreu tout en restant compréhensible. « Petit bétail » évite de trancher entre mouton et chèvre.
