revisions:
- from: Tous ceux qui étaient dans la détresse, tous ceux qui avaient un créancier[a] et tous ceux qui avaient l’âme amère se rassemblèrent auprès de lui. Il devint leur chef. Environ quatre cents hommes étaient avec lui.
  to: Tous ceux qui étaient dans la détresse, tous ceux qui étaient endettés[a] et tous ceux qui avaient l’âme amère se rassemblèrent auprès de lui. Il devint leur chef. Environ quatre cents hommes étaient avec lui.
  rationale: La révision remplace un calque français peu naturel par le sens contextuel normal de l’expression hébraïque, tout en maintenant dans la note son caractère elliptique et l’idée d’un créancier exigeant paiement. Elle retire la connotation fiscale injustifiée de « percepteur » sans modifier le sens du passage.
