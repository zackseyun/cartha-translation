  - severity: low
    issue: « Percepteur » dans la note
    rationale: Le mot français suggère normalement un fonctionnaire chargé de percevoir des impôts. Le participe hébreu peut évoquer un créancier qui exige paiement, mais ne requiert pas cette connotation fiscale.
