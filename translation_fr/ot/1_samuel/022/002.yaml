base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: fr
  text: Tous ceux qui étaient dans la détresse, tous ceux qui étaient endettés[a] et tous ceux qui avaient l’âme amère se rassemblèrent auprès de lui. Il devint leur chef. Environ quatre cents hommes étaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tous ceux qui avaient un créancier », ou « quelqu’un qui réclamait une dette »; « qui étaient endettés » en exprime le sens dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: se rassemblèrent auprès de lui
  rationale: Le verbe exprime le rassemblement collectif, et אֵלָיו un mouvement vers David. « Auprès de lui » rend naturellement en français à la fois l’approche et le regroupement sans surinterpréter par « autour de lui ».
- source_word: כָּל אִישׁ מָצוֹק
  choice: tous ceux qui étaient dans la détresse
  rationale: מָצוֹק désigne une situation de détresse ou d’oppression. Cette formulation reste assez large pour inclure des difficultés sociales, matérielles ou personnelles.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: ceux qui avaient un créancier
  rationale: La formulation française conserve l’image concrète et l’ellipse de l’hébreu, où נֹשֶׁא désigne ici vraisemblablement un créancier ou percepteur exerçant une réclamation. « Endettés » serait plus fluide, mais plus interprétatif.
- source_word: מַר נֶפֶשׁ
  choice: ceux qui avaient l’âme amère
  rationale: Cette expression garde l’image anthropologique hébraïque et son amplitude, qui peut évoquer l’amertume, l’angoisse ou une profonde affliction intérieure.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: Il devint leur chef
  rationale: שַׂר peut désigner un chef, un dirigeant ou un commandant. « Chef » conserve cette latitude et convient au groupe armé naissant sans imposer un grade militaire précis.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: Environ quatre cents hommes
  rationale: Le préfixe כְּ marque ici l’approximation. « Hommes » convient puisqu’il s’agit du dénombrement des adultes masculins constituant la troupe de David.
theological_decisions:
- issue: Nature exacte de l’autorité de David exprimée par שַׂר
  choice: chef
  alternative: commandant
  rationale: Le contexte permet une fonction militaire, mais le terme hébreu a un champ plus large. « Chef » préserve cette ambiguïté sans minimiser l’autorité de David.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tous ceux » reproduit la structure cumulative du texte hébreu. « Avaient l’âme amère » conserve l’image originale tout en restant intelligible dans un registre biblique naturel.
