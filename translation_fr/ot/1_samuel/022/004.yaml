source:
  edition: WLC
  text: וַ/יַּנְחֵ֕/ם אֶת פְּנֵ֖י מֶ֣לֶךְ מוֹאָ֑ב וַ/יֵּשְׁב֣וּ עִמּ֔/וֹ כָּל יְמֵ֥י הֱיוֹת דָּוִ֖ד בַּ/מְּצוּדָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/004.yaml
  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: fr
  text: Il les amena devant le roi de Moab[a], et ils restèrent auprès de lui pendant tout le temps où David fut dans la forteresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il les conduisit devant le roi de Moab. » Le verbe hébreu peut exprimer l’idée de conduire ou d’amener quelqu’un en présence d’une autre personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Il les amena
  rationale: Dans ce contexte, la forme verbale avec le suffixe de troisième personne du pluriel exprime le fait de conduire ou d’amener les parents de David dans la présence du roi. « Il les amena » est naturel en français et convient à la construction qui suit.
- source_word: אֶת פְּנֵי
  choice: devant
  rationale: Cette expression idiomatique signifie ici « devant » ou « en présence de ». « Devant » conserve la tournure concise de l’hébreu.
- source_word: מֶלֶךְ מוֹאָב
  choice: le roi de Moab
  rationale: Traduction directe de la chaîne construite, avec le titre et le nom géographique usuels en français.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: ils restèrent auprès de lui
  rationale: Le verbe יָשַׁב peut signifier habiter, demeurer ou rester. Ici, « restèrent auprès de lui » exprime clairement un séjour prolongé sous la protection du roi.
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד
  choice: pendant tout le temps où David fut
  rationale: La construction temporelle désigne toute la durée du séjour de David. Cette formulation est naturelle en français tout en conservant l’idée d’intégralité.
- source_word: בַּמְּצוּדָה
  choice: dans la forteresse
  rationale: מְצוּדָה désigne un lieu fortifié servant de refuge. « Forteresse » convient au contexte narratif et évite de réduire le terme à la seule idée abstraite de refuge.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique littéraire sans être archaïque; « auprès de lui » précise naturellement la durée du séjour.
