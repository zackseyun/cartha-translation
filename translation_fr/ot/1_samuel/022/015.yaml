  text: הַ/יּ֧וֹם הַחִלֹּ֛תִי ל/שאול ל֥/וֹ בֵ/אלֹהִ֖ים חָלִ֣ילָ/ה לִּ֑/י אַל יָשֵׂם֩ הַ/מֶּ֨לֶךְ בְּ/עַבְדּ֤/וֹ דָבָר֙ בְּ/כָל בֵּ֣ית אָבִ֔/י כִּ֠י לֹֽא יָדַ֤ע עַבְדְּ/ךָ֙ בְּ/כָל זֹ֔את דָּבָ֥ר קָטֹ֖ן א֥וֹ גָדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: fr
  text: Était-ce aujourd’hui la première fois que je consultais Dieu pour lui ?[a] Loin de moi une telle pensée ! Que le roi ne mette rien à la charge de son serviteur ni de toute la maison de mon père, car ton serviteur ne savait absolument rien de toute cette affaire, ni petite chose ni grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Est-ce aujourd’hui que j’ai commencé à consulter Dieu pour lui ? » La question rhétorique implique que ce n’était pas la première fois qu’Ahimélek le faisait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: Était-ce aujourd’hui la première fois que je… ?
  rationale: 'Le texte dit formellement : « Est-ce aujourd’hui que j’ai commencé… ? » Dans ce contexte, la question rhétorique nie qu’il s’agisse d’une pratique nouvelle. La formulation française rend naturellement cette implication sans transformer la question en affirmation.'
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: je consultais Dieu pour lui
  rationale: שׁאל בֵאלֹהִים désigne la recherche d’une réponse ou d’une direction divine. « Pour lui » conserve le bénéficiaire indiqué par לוֹ.
- source_word: חָלִילָה לִּי
  choice: Loin de moi une telle pensée !
  rationale: Formule énergique de répudiation. Cette tournure française actuelle conserve l’intensité de l’expression hébraïque.
- source_word: אַל יָשֵׂם … בְּעַבְדּוֹ דָבָר
  choice: Que le roi ne mette rien à la charge de son serviteur
  rationale: La construction évoque ici le fait d’imputer une affaire ou une faute à quelqu’un. « Mettre à la charge de » garde la nuance accusatoire et le registre déférent.
- source_word: בְּכָל בֵּית אָבִי
  choice: ni de toute la maison de mon père
  rationale: « Maison de mon père » conserve l’expression hébraïque désignant la famille étendue ou le clan, sans la réduire au seul foyer domestique.
- source_word: כִּי לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: car ton serviteur ne savait absolument rien de toute cette affaire
  rationale: La formulation exprime une ignorance complète de l’affaire évoquée, tout en conservant l’auto-désignation respectueuse « ton serviteur ».
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: ni petite chose ni grande
  rationale: 'Ce mérisme exprime la totalité : Ahimélek affirme n’avoir eu connaissance d’aucun élément, quelle qu’en soit l’importance. La formulation conserve les deux pôles de l’hébreu.'
