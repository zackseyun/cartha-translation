  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: fr
  text: 'Alors Saül dit : « Écoute, je te prie, fils d’Ahitoub. » Il répondit : « Me voici, mon seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Écoute, je te prie
  rationale: שְׁמַע est un impératif singulier, et נָא marque ici une demande pressante ou polie. « Je te prie » conserve cette nuance dans un registre digne et naturel.
- source_word: בֶּן אֲחִיטוּב
  choice: fils d’Ahitoub
  rationale: Rend directement la filiation et translittère le nom propre selon l’usage français.
- source_word: הִנְנִי
  choice: Me voici
  rationale: Formule française consacrée qui exprime la présence et la disponibilité signalées par l’hébreu.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une adresse respectueuse à Saül, non du nom divin ; la minuscule préserve cette distinction.
theological_decisions:
- issue: Sens de אֲדֹנִי dans l’adresse finale
  choice: mon seigneur
  alternative: mon maître
  rationale: Le contexte indique un titre humain de respect adressé au roi. « Mon seigneur » maintient la forme de l’hébreu sans lui donner une référence divine.
translation_notes:
  register: Français moderne, international et digne. La syntaxe dialoguée reste proche de l’hébreu tout en étant naturelle ; « je te prie » évite de durcir נָא en simple marqueur temporel comme « maintenant ».
