  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מ֥וֹת תָּמ֖וּת אֲחִימֶ֑לֶךְ אַתָּ֖ה וְ/כָל בֵּ֥ית אָבִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: fr
  text: 'Mais le roi dit : « Tu mourras certainement[a], Ahimélek, toi et toute la maison de ton père[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tu vas bel et bien mourir » ou « Tu dois mourir ». L’hébreu associe un infinitif absolu au verbe conjugué pour exprimer une forte insistance.
    reason: lexical_alternative
  - marker: b
    text: La « maison de ton père » désigne ici la maisonnée paternelle ou la lignée familiale.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative ordinaire pour introduire une parole ; « dit » est naturel et fidèle en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne directement le locuteur.
- source_word: מוֹת תָּמוּת
  choice: Tu mourras certainement
  rationale: L’infinitif absolu suivi du verbe de même racine renforce fortement l’annonce de la mort. « Certainement » en restitue l’insistance tout en conservant l’ambiguïté entre prédiction certaine et sentence royale.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimélek
  rationale: Le nom propre est translittéré sous une forme adaptée à la lecture française.
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom explicite est emphatique ; placé en apposition après le nom, « toi » conserve cette mise en relief.
- source_word: וְכָל בֵּית אָבִיךָ
  choice: et toute la maison de ton père
  rationale: La traduction garde l’image hébraïque de la « maison du père », qui désigne ici la maisonnée paternelle ou la lignée familiale.
theological_decisions:
- issue: Valeur de la formule מוֹת תָּמוּת
  choice: Tu mourras certainement
  alternative: Tu dois mourir / Tu seras mis à mort
  rationale: Le contexte royal et judiciaire permet de comprendre une condamnation, mais la construction hébraïque marque d’abord l’intensité et la certitude. La formulation retenue évite de préciser plus que le texte le mode ou l’agent de la mort.
translation_notes:
  register: Français moderne, digne et direct. La répétition emphatique de l’hébreu est rendue par « certainement », tandis que « maison de ton père » conserve l’expression familiale et sociale du texte source.
