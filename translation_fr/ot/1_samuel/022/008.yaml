source:
  edition: WLC
  text: כִּי֩ קְשַׁרְתֶּ֨ם כֻּלְּ/כֶ֜ם עָלַ֗/י וְ/אֵין גֹּלֶ֤ה אֶת אָזְנִ/י֙ בִּ/כְרָת בְּנִ֣/י עִם בֶּן יִשַׁ֔י וְ/אֵין חֹלֶ֥ה מִ/כֶּ֛ם עָלַ֖/י וְ/גֹלֶ֣ה אֶת אָזְנִ֑/י כִּ֣י הֵקִים֩ בְּנִ֨/י אֶת עַבְדִּ֥/י עָלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: fr
  text: Car vous avez tous conspiré contre moi, et personne ne m’informe[a] lorsque mon fils conclut une alliance avec le fils de Jessé. Aucun de vous ne se soucie de moi[b] ni ne m’informe que mon fils a dressé mon serviteur contre moi pour me tendre une embuscade[c], comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « découvre mon oreille », expression qui signifie « m’informe » ou « me révèle la chose ».
    reason: lexical_alternative
  - marker: b
    text: Ou « n’éprouve de peine pour moi »; l’expression marque la compassion ou la sollicitude envers Saül.
    reason: lexical_alternative
  - marker: c
    text: Ou « a suscité mon serviteur contre moi comme homme aux aguets ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: avez conspiré
  rationale: Dans ce contexte, le verbe désigne un complot hostile ou une conspiration contre Saül, et non une simple entente.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: m’informe
  rationale: L’expression signifie littéralement « découvre mon oreille » et fonctionne comme un idiome exprimant la communication d’une information.
- source_word: בִּכְרָת
  choice: lorsque ... conclut
  rationale: La préposition avec l’infinitif situe la circonstance dans le temps; en français, on « conclut une alliance ».
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: mon fils conclut une alliance avec le fils de Jessé
  rationale: 'La formulation conserve les désignations relationnelles de Saül: Jonathan est « mon fils » et David reste « le fils de Jessé », sans que son nom soit ajouté.'
- source_word: חֹלֶה ... עָלַי
  choice: se soucie de moi
  rationale: Ici, חלה exprime la compassion, la peine ou l’inquiétude éprouvée en faveur de Saül, et non une maladie physique. Cette formulation française est naturelle tout en gardant l’idée de sollicitude.
- source_word: הֵקִים
  choice: a dressé
  rationale: Dans l’accusation de Saül, le verbe présente Jonathan comme ayant suscité ou poussé David à agir contre lui; « dresser quelqu’un contre » rend cette nuance hostile.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Le terme décrit ici David comme subordonné royal de Saül, sans imposer le sens plus étroit d’esclave.
- source_word: לְאֹרֵב
  choice: pour me tendre une embuscade
  rationale: La forme évoque l’action de guetter en vue d’une attaque; cette expression idiomatique française convient au contexte.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme c’est le cas aujourd’hui
  rationale: L’expression renvoie à la situation présente plutôt qu’à une simple date.
