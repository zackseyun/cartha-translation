  register: Français international moderne, narratif et digne. « Guibéa » et « Rama » suivent les formes françaises bibliques usuelles. Les phrases ont été légèrement segmentées pour la clarté, tout en conservant le tableau de cour et les ambiguïtés lexicales pertinentes.
