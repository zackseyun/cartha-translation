  text: וַ/יִּשְׁמַ֣ע שָׁא֔וּל כִּ֚י נוֹדַ֣ע דָּוִ֔ד וַ/אֲנָשִׁ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וְ/שָׁאוּל֩ יוֹשֵׁ֨ב בַּ/גִּבְעָ֜ה תַּֽחַת הָ/אֶ֤שֶׁל בָּֽ/רָמָה֙ וַ/חֲנִית֣/וֹ בְ/יָד֔/וֹ וְ/כָל עֲבָדָ֖י/ו נִצָּבִ֥ים עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: fr
  text: Saül apprit que David et les hommes qui l’accompagnaient avaient été repérés[a]. Saül était alors assis à Guibéa, sous le tamaris, sur la hauteur[b], sa lance à la main, et tous ses serviteurs se tenaient autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient devenus connus » ou « avaient été découverts ». Le verbe hébreu peut indiquer que l’endroit où se trouvaient David et ses hommes avait été révélé.
    reason: lexical_alternative
  - marker: b
    text: Ou peut-être « à Rama », si le mot hébreu est compris comme le nom de lieu Rama plutôt que comme le nom commun « hauteur ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Dans ce contexte, שׁמע désigne le fait de recevoir une information. « Apprit » est plus naturel en français narratif que « entendit ».
- source_word: כִּי נוֹדַע דָּוִד וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: que David et les hommes qui l’accompagnaient avaient été repérés
  rationale: Le nifal de ידע peut signifier « être connu » ou « être découvert ». « Avaient été repérés » exprime naturellement que David et son groupe ne se cachaient plus avec succès, sans préciser davantage comment leur présence fut révélée.
- source_word: יוֹשֵׁב
  choice: se tenait alors
  rationale: Le participe installe l’arrière-plan de la scène. Avec la suite décrivant les serviteurs debout autour de Saül, « se tenait » reste naturel et évite une répétition lourde de « était assis » puis « se tenaient ».
- source_word: בַּגִּבְעָה
  choice: à Guibéa
  rationale: Le nom propre désigne ici la ville de Guibéa; la préposition française « à » convient à un lieu urbain.
- source_word: תַּחַת הָאֶשֶׁל
  choice: sous le tamaris
  rationale: אֵשֶׁל est couramment identifié au tamaris. Le nom français de l’arbre est clair et évite une translittération obscure.
- source_word: בָּרָמָה
  choice: sur la hauteur
  rationale: La présence de l’article et la syntaxe favorisent le nom commun « hauteur », bien que la lecture comme nom de lieu, Rama, reste possible et soit signalée en note.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: Il avait sa lance à la main
  rationale: Cette proposition nominale décrit la posture de Saül. La formulation française restitue directement l’image martiale sans ajouter de verbe d’action.
- source_word: וְכָל עֲבָדָיו
  choice: tous ses serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs, des officiers ou des membres de l’entourage royal. « Serviteurs » conserve l’étendue du terme hébreu.
- source_word: נִצָּבִים עָלָיו
  choice: se tenaient autour de lui
  rationale: Le participe décrit les serviteurs placés auprès de Saül. « Autour de lui » rend naturellement leur position sans suggérer qu’ils le dominaient physiquement.
theological_decisions: []
