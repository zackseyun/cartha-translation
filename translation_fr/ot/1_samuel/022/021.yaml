source:
  edition: WLC
  text: וַ/יַּגֵּ֥ד אֶבְיָתָ֖ר לְ/דָוִ֑ד כִּ֚י הָרַ֣ג שָׁא֔וּל אֵ֖ת כֹּהֲנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: fr
  text: Abiathar informa David que Saül avait tué les prêtres de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: informa
  rationale: Le hifil de נגד signifie ici « faire savoir, informer ». « Informa » convient naturellement à la construction avec destinataire et proposition complétive, tout en gardant un registre narratif digne.
- source_word: אֶבְיָתָר
  choice: Abiathar
  rationale: Translittération française conventionnelle du nom propre.
- source_word: לְדָוִד
  choice: David
  rationale: Le préfixe ל marque le destinataire; en français, celui-ci est exprimé comme complément direct du verbe « informer ».
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de l'information transmise par Abiathar.
- source_word: הָרַג
  choice: avait tué
  rationale: Le plus-que-parfait rend clairement l'antériorité de la mise à mort par rapport au moment où Abiathar en informe David.
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française conventionnelle du nom propre, avec tréma pour marquer la séparation des voyelles.
- source_word: כֹּהֲנֵי יְהוָה
  choice: les prêtres de Yahweh
  rationale: Cette formulation conserve simplement le rapport construit hébreu entre les prêtres et le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération courante du tétragramme, qui préserve ici le nom propre divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans introduire une substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit la sobriété du récit hébreu. « Informa » évite la tournure plus lourde « fit savoir à », tandis que le plus-que-parfait explicite naturellement la chronologie en français.
