source:
  edition: WLC
  text: וַ/יִּמָּלֵ֣ט בֵּן אֶחָ֗ד לַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֲחִט֔וּב וּ/שְׁמ֖/וֹ אֶבְיָתָ֑ר וַ/יִּבְרַ֖ח אַחֲרֵ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: fr
  text: Mais un fils d’Ahimélec, fils d’Ahitub, réussit à s’échapper. Il s’appelait Abiathar et s’enfuit à la suite de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’enfuit pour rejoindre David ». L’hébreu dit littéralement « s’enfuit après David », expression qui peut désigner le fait de partir à sa suite afin de se joindre à lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: réussit à s’échapper
  rationale: Le nifal de מלט exprime ici une fuite menée à bien. Cette tournure française distingue clairement ce premier verbe de וַיִּבְרַח, rendu ensuite par « s’enfuit ».
- source_word: בֵּן אֶחָד
  choice: un fils
  rationale: Le texte désigne littéralement « un fils ». Dans ce contexte généalogique, בֵּן indique bien la filiation et non simplement un jeune homme.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  choice: d’Ahimélek, fils d’Ahitoub
  rationale: Le ל préfixé marque ici la relation d’appartenance ou de filiation. La virgule permet d’identifier naturellement Ahimélek comme fils d’Ahitoub.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: Il s’appelait Abiatar
  rationale: Cette formulation moderne et naturelle restitue fidèlement la proposition hébraïque « son nom était Abiatar ».
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: Le verbe ברח signifie « fuir ». Ce choix préserve la distinction avec מלט, qui décrit d’abord le fait de réussir à s’échapper.
- source_word: אַחֲרֵי דָוִד
  choice: à la suite de David
  rationale: אַחֲרֵי signifie littéralement « après, derrière ». « À la suite de David » conserve cette image tout en permettant le sens contextuel d’aller le rejoindre.
- source_word: וַ
  choice: Mais
  rationale: 'Le waw initial relie le verset au massacre précédent avec une valeur contrastive : malgré celui-ci, un fils échappe. « Mais » rend naturellement ce contraste narratif.'
theological_decisions: []
translation_notes:
  register: 'Français international moderne, sobre et narratif. Les noms propres suivent les formes françaises bibliques usuelles : Ahimélek, Ahitoub et Abiatar. La division en deux phrases évite une coordination lourde sans modifier la succession narrative.'
