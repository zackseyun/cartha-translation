base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: fr
  text: 'Ahimélek répondit au roi : « Parmi tous tes serviteurs, qui est aussi fidèle que David, le gendre du roi, lui qui répond à tes ordres[a] et qui est honoré dans ta maison[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque peut aussi se comprendre : « qui se tient à ta disposition » ou « qui a accès auprès de toi ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, la « maison » peut désigner plus précisément la maisonnée ou la cour du roi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: 'Ahimélek répondit au roi :'
  rationale: La formule narrative hébraïque associe « répondit » et « dit ». En français actuel, les fondre en une seule introduction évite une lourdeur sans perdre le sens.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: Parmi tous tes serviteurs, qui
  rationale: Cette tournure française rend naturellement la construction partitive et conserve « serviteurs » sans préciser indûment leur rang.
- source_word: כְּדָוִד נֶאֱמָן
  choice: aussi fidèle que David
  rationale: נֶאֱמָן exprime ici la loyauté et la fiabilité de David envers le roi ; « fidèle » garde ces deux nuances.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: le gendre du roi
  rationale: Traduction directe de la relation familiale entre David et Saül.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: lui qui répond à tes ordres
  rationale: L’expression évoque le fait de se tourner vers ce qui est entendu ou commandé, donc une disponibilité obéissante. Cette formulation reste naturelle tout en évitant de transformer avec certitude l’expression en titre de fonction.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: et qui est honoré dans ta maison
  rationale: « Honoré » rend le sens de נכבד, tandis que « maison » conserve l’image hébraïque et son possible sens élargi de maisonnée ou de cour.
theological_decisions:
- issue: Portée de וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: qui répond à tes ordres
  alternative: qui a accès à ton conseil / qui commande ta garde
  rationale: Le sens précis de l’expression est discuté. Le texte peut évoquer l’obéissance empressée, l’accès auprès du roi ou une charge officielle. Le choix retenu suit le sens lexical le plus transparent sans imposer une fonction de cour particulière ; une note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement correspond au discours direct adressé au roi dans le cadre du système pronominal biblique français. La question rhétorique et l’accumulation des qualités de David sont conservées.
