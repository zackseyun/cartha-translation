  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תִּקְרְא֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ אֶל תַּ֥חַת גֶּ֖פֶן וְ/אֶל תַּ֥חַת תְּאֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/010.yaml
  text: On that day[a], declares Yahweh of Armies[d][c][b], each of you will invite his neighbor under the vine and under the fig tree.
translation:
  language: fr
  text: En ce jour-là, déclare Yahweh, le Seigneur des armées, chacun de vous invitera son prochain sous la vigne et sous le figuier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement le verbe « appeler » : « vous appellerez, chacun, son prochain », puis indique « sous la vigne et sous le figuier ». Dans ce contexte, « appeler » a probablement le sens d’« inviter ». La vigne et le figuier évoquent la paix, la sécurité et la prospérité ; voir 1 Rois 4.25 et Michée 4.4. Certains traduisent « sous sa vigne et sous son figuier » d’après ces passages parallèles, mais le possessif n’est pas exprimé ici.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique temporelle naturelle en français, qui désigne un temps futur d’intervention divine.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahweh des armées
  rationale: נְאֻם introduit solennellement une déclaration divine. Le nom propre יהוה est rendu par « Yahweh », et צְבָאוֹת par « des armées », formulation transparente qui conserve la portée militaire et céleste du titre.
- source_word: תִּקְרְאוּ
  choice: invitera
  rationale: Le sens premier est « appeler », mais la construction avec une personne et le lieu où elle est appelée exprime ici vraisemblablement une invitation.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: chacun de vous … son prochain
  rationale: אִישׁ a une valeur distributive, tandis que le verbe à la deuxième personne du pluriel justifie « de vous ». רֵעַ désigne ici un prochain ou un voisin; « prochain » préserve la portée communautaire sans réduire le lien à l’amitié.
- source_word: אֶל תַּחַת גֶּפֶן וְאֶל תַּחַת תְּאֵנָה
  choice: sous la vigne et sous le figuier
  rationale: La répétition de אֶל תַּחַת oriente vers un lieu de repos ou d’abri. Le français permet cette construction après « inviter ». Aucun possessif n’est ajouté, puisqu’il n’est pas exprimé dans ce verset.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Traduction du titre צְבָאוֹת
  choice: des armées
  alternative: des puissances / de l’univers
  rationale: « Des armées » rend directement le terme hébreu et préserve son évocation des forces célestes et terrestres sans imposer une interprétation plus étroite.
- issue: Portée de l’image de la vigne et du figuier
  choice: Conserver l’image sans l’expliciter dans le texte
  alternative: Ajouter une mention de paix et de sécurité
  rationale: L’image biblique évoque la paix, la sécurité et la prospérité, mais ces notions restent implicites dans l’hébreu et ne doivent pas remplacer la métaphore.
translation_notes:
  register: Français moderne, international et digne. La syntaxe prophétique est conservée sans archaïsme. « Chacun de vous » rend clairement la combinaison du verbe pluriel et de l’expression distributive; « son prochain » reste idiomatique et inclusif dans ce contexte.
