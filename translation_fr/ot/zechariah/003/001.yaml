id: ZEC.3.1
reference: Zechariah 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּרְאֵ֗/נִי אֶת יְהוֹשֻׁ֨עַ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל עֹמֵ֕ד לִ/פְנֵ֖י מַלְאַ֣ךְ יְהוָ֑ה וְ/הַ/שָּׂטָ֛ן עֹמֵ֥ד עַל יְמִינ֖/וֹ לְ/שִׂטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/001.yaml
  text: Then he showed me Joshua the high priest standing before the angel of Yahweh[a], and the Accuser standing at his right hand to accuse him.
translation:
  language: fr
  text: Puis il me fit voir Josué, le grand prêtre, qui se tenait devant l’ange de Yahweh, tandis que l’Accusateur[a] se tenait à sa droite pour l’accuser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Satan […] pour s’opposer à lui ». L’hébreu porte « l’accusateur » ou « l’adversaire », avec l’article défini; le terme peut désigner ici un titre ou une fonction.
    reason: Lecture alternative préservant la possibilité de comprendre le terme comme le nom traditionnel « Satan » ou dans le sens plus large d’« adversaire ».
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: Puis il me fit voir
  rationale: Le hiphil de ראה avec le suffixe de première personne signifie « il me fit voir », c’est-à-dire qu’il introduisit la vision. « Puis » rend naturellement la progression narrative portée par le waw.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Il s’agit de la forme française usuelle correspondant directement au nom hébreu יְהוֹשֻׁעַ.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: « Grand prêtre » est le titre français établi et précis pour le principal prêtre d’Israël.
- source_word: עֹמֵד
  choice: qui se tenait / se tenait
  rationale: Le participe décrit la position des personnages dans la vision. « Se tenir » convient mieux que le simple « être debout » au cadre solennel et potentiellement judiciaire.
- source_word: לִפְנֵי
  choice: devant
  rationale: Ce terme garde à la fois la valeur spatiale et la possible nuance de comparution, sans imposer une interprétation judiciaire trop explicite.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: Dans cette vision prophétique, מַלְאָךְ se rend naturellement par « ange »; le nom divin יהוה est translittéré « Yahweh ».
- source_word: הַשָּׂטָן
  choice: l’Accusateur
  rationale: L’article défini indique ici vraisemblablement un titre ou une fonction. Dans ce contexte, « l’Accusateur » exprime la valeur judiciaire du terme tout en évitant d’en faire sans explication un nom propre.
- source_word: עַל יְמִינוֹ
  choice: à sa droite
  rationale: Cette expression française rend clairement la position indiquée par l’hébreu et laisse subsister son éventuelle portée judiciaire.
- source_word: לְשִׂטְנוֹ
  choice: pour l’accuser
  rationale: L’infinitif, formé sur la même racine que שׂטן, désigne ici l’action d’accuser ou de s’opposer. « Accuser » convient particulièrement à la scène et restitue le jeu lexical avec « l’Accusateur ».
theological_decisions:
- issue: Faut-il comprendre הַשָּׂטָן comme un nom propre ou comme un titre indiquant une fonction ?
  choice: l’Accusateur
  alternative: Satan ; l’Adversaire
  rationale: L’article défini hébreu et l’infinitif apparenté לְשִׂטְנוֹ favorisent ici le sens fonctionnel d’« accusateur ». La traduction principale conserve cette nuance judiciaire, tandis que la note signale les autres lectures possibles sans trancher l’identification théologique au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme des deux personnages qui « se tenaient » et la répétition étymologique entre « l’Accusateur » et « l’accuser », tout en restant naturelle.
