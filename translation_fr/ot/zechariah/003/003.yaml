  text: Joshua was clothed with filthy garments and was standing before the angel[a][b][c].
translation:
  language: fr
  text: Josué était revêtu de vêtements souillés[a] et se tenait devant l’ange[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu évoque des vêtements dans un état de saleté particulièrement abject; il peut même faire penser à des vêtements souillés d’excréments. Ou « sales », mais cette traduction est plus faible.
    reason: lexical_alternative
  - marker: b
    text: Ou « le messager ». Dans le contexte de cette vision, « l’ange » est la traduction la plus naturelle.
    reason: alternative_reading
lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ
  choice: Josué
  rationale: Le waw fait progresser le récit de la vision; en français, l’enchaînement peut rester implicite sans ajouter « maintenant ». La forme française traditionnelle du nom est naturelle et largement comprise.
- source_word: הָיָה לָבֻשׁ
  choice: était revêtu
  rationale: La construction décrit l’état de Josué, non un changement d’état. « Était revêtu » conserve la valeur stative et le registre digne du passage.
- source_word: בְּגָדִים
  choice: vêtements
  rationale: Terme français général et naturel, sans préciser indûment qu’il s’agit de robes ou d’habits sacerdotaux.
- source_word: צוֹאִים
  choice: sales
  rationale: Le mot évoque une saleté intense et répugnante. « Sales » est clair en français moderne; une note signale la vigueur particulière du terme hébreu.
- source_word: וְ/עֹמֵד
  choice: et se tenait
  rationale: Le participe exprime une posture continue, simultanée à l’état décrit. « Se tenait » est idiomatique et convient au contexte de comparution.
- source_word: לִ/פְנֵי
  choice: devant
  rationale: Rend directement la présence spatiale et personnelle, avec une possible nuance de comparution qui demeure non explicitée.
- source_word: הַ/מַּלְאָךְ
  choice: l’ange
  rationale: Dans cette vision céleste, « ange » est le sens contextuel le plus naturel, tout en maintenant l’article défini et sans préciser davantage l’identité du personnage.
theological_decisions:
- issue: Identité de הַמַּלְאָךְ
  choice: l’ange
  alternative: le messager; l’ange de l’Éternel compris comme figure théophanique d’après le contexte plus large
  rationale: Le verset dit seulement « l’ange » et ne l’identifie pas plus précisément. La traduction n’importe donc aucune identification théologique supplémentaire; la note conserve le sens lexical alternatif de « messager ».
translation_notes:
  register: Français international moderne, clair et digne. Le tour « était revêtu » garde une légère solennité appropriée à la vision sans devenir archaïque. Aucun marqueur discursif tel que « or » ou « maintenant » n’a été ajouté au début, puisque le waw hébreu peut être rendu par le simple enchaînement du récit.
