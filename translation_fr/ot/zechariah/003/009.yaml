  to: 'Car voici la pierre que j’ai placée devant Josué : sur une seule pierre, il y a sept yeux. Voici, je vais moi-même y graver une inscription[a] — déclaration de Yahweh des armées[b] — et j’enlèverai la faute de ce pays-là en un seul jour.'
  rationale: 'La révision remplace une reproduction française maladroite de la figure étymologique par « y graver une inscription », qui exprime clairement l’action sur la pierre. La note conserve intégralement l’information philologique : le verbe et son complément sont de même racine en hébreu. « Je vais moi-même » rend à la fois l’emphase de הִנְנִי et la valeur prospective du participe, sans modifier le sens ni interpréter l’imagerie.'
