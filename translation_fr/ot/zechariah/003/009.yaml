source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה הָ/אֶ֗בֶן אֲשֶׁ֤ר נָתַ֨תִּי֙ לִ/פְנֵ֣י יְהוֹשֻׁ֔עַ עַל אֶ֥בֶן אַחַ֖ת שִׁבְעָ֣ה עֵינָ֑יִם הִנְ/נִ֧י מְפַתֵּ֣חַ פִּתֻּחָ֗/הּ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/מַשְׁתִּ֛י אֶת עֲוֺ֥ן הָ/אָֽרֶץ הַ/הִ֖יא בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/009.yaml
  text: For behold[a], the stone that I have set before Joshua—on one stone are seven eyes. Behold, I myself will engrave its engraving, declares Yahweh of Armies[b], and I will remove the iniquity of that land in a single day.
translation:
  language: fr
  text: 'Car voici la pierre que j’ai placée devant Josué : sur une seule pierre, il y a sept yeux. Voici, je vais moi-même y graver une inscription[a] — déclaration de Yahweh des armées[b] — et j’enlèverai la faute de ce pays-là en un seul jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, avec une répétition de mots de même racine : « je graverai sa gravure ».'
    reason: lexical_alternative
  - marker: b
    text: 'Rendu traditionnel : « le SEIGNEUR des armées » ou « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: כִּי introduit ici une explication ou une insistance, tandis que הִנֵּה attire solennellement l’attention. « Car voici » conserve ces deux fonctions dans un français prophétique naturel.
- source_word: הָאֶבֶן אֲשֶׁר נָתַתִּי לִפְנֵי יְהוֹשֻׁעַ
  choice: la pierre que j’ai placée devant Josué
  rationale: נתן peut signifier « donner », « mettre » ou « placer » ; avec « devant Josué », « placée » est le choix français le plus idiomatique sans interpréter la pierre.
- source_word: עַל אֶבֶן אַחַת שִׁבְעָה עֵינָיִם
  choice: sur une seule pierre, il y a sept yeux
  rationale: La formulation garde le sens ordinaire de עַל, אֶבֶן et עֵינָיִם, ainsi que l’étrangeté de l’image. « Une seule pierre » rend explicitement אַחַת sans identifier symboliquement les yeux.
- source_word: הִנְנִי
  choice: Voici, moi-même
  rationale: La construction est emphatique. « Moi-même » fait ressortir l’implication personnelle du locuteur, et « voici » maintient la force d’annonce prophétique.
- source_word: מְפַתֵּחַ פִּתֻּחָהּ
  choice: j’en graverai la gravure
  rationale: Le participe après הִנְנִי a ici une valeur imminente ou future. La tournure française conserve volontairement la figure étymologique de l’hébreu ; une formulation plus fluide est donnée en note.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclaration de Yahweh des armées
  rationale: נְאֻם est une formule prophétique d’attestation. Le nom divin est translittéré « Yahweh », et צְבָאוֹת est traduit de manière transparente par « des armées ».
- source_word: וּמַשְׁתִּי
  choice: et j’enlèverai
  rationale: Dans ce contexte, le verbe exprime l’action d’ôter ou de faire disparaître. « Enlèverai » est courant et convient à l’objet abstrait qui suit.
- source_word: עֲוֺן
  choice: la faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute. « Faute » garde une portée morale réelle sans réduire le terme à un sentiment subjectif de culpabilité.
- source_word: הָאָרֶץ הַהִיא
  choice: ce pays-là
  rationale: « Pays » convient ici à אֶרֶץ dans son sens territorial, et « -là » représente le démonstratif הַהִיא au lieu de l’effacer.
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: Cette formulation naturelle conserve l’unité et la soudaineté temporelles exprimées par l’hébreu.
theological_decisions:
- issue: Identification symbolique de la pierre et des sept yeux
  choice: Conserver littéralement l’image sans en identifier les éléments dans le texte principal.
  alternative: Identifier la pierre au Messie ou expliquer les sept yeux comme l’omniscience de Dieu.
  rationale: Le verset présente une image symbolique dense sans fournir ici son interprétation explicite. La traduction ne doit pas transformer une lecture théologique possible en sens lexical imposé.
- issue: Valeur de עֲוֺן
  choice: Employer « faute », qui laisse ouverte la relation entre péché, culpabilité et conséquences.
  alternative: Employer exclusivement « péché », « culpabilité » ou « châtiment ».
  rationale: Le terme hébreu possède cette amplitude sémantique. Le contexte affirme son enlèvement, mais ne contraint pas la traduction à une seule de ces nuances.
- issue: Rendu de יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées / l’Éternel des armées
  rationale: Le texte porte le nom divin יהוה et le titre צְבָאוֹת. La translittération du nom et la traduction directe du titre les rendent visibles sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible, avec une légère solennité prophétique. La syntaxe imagée reste volontairement abrupte là où l’hébreu l’est. Les répétitions de « voici » et la figure étymologique autour de « graver » sont conservées pour refléter l’insistance et la texture du texte source.
