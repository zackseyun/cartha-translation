  terminology: « Yahweh des armées » est cohérent avec la politique fournie et avec יהוה צבאות. « Josué », « pierre », « yeux » et « faute » conviennent au registre biblique français moderne. Le terme « inscription » est une expression française claire du résultat de la gravure, sans interpréter le symbole de la pierre.
