  text: וַ/יָּ֨עַד֙ מַלְאַ֣ךְ יְהוָ֔ה בִּ/יהוֹשֻׁ֖עַ לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/006.yaml
  text: Then the angel of Yahweh solemnly charged Joshua[a], saying,
translation:
  language: fr
  text: 'Puis l’ange[a] de Yahweh adressa solennellement cette exhortation à Josué, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ». Le mot hébreu peut signifier « ange » ou « messager » ; « ange » convient le mieux à cette vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: Puis … avertit solennellement
  rationale: Le verbe exprime ici une mise en garde ou une exhortation formelle et appuyée. « Avertit solennellement » en restitue le poids, tandis que « Puis » marque la progression du récit portée par le waw consécutif.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager humain ou céleste ; dans le cadre de cette vision, « ange » est le choix le plus naturel, sans effacer l’autre possibilité, signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa fonction de nom divin dans le texte hébreu.
- source_word: בִּיהוֹשֻׁעַ
  choice: Josué
  rationale: Avec יעד, la préposition ב introduit ici la personne à qui s’adresse l’avertissement. Le français construit naturellement « avertir quelqu’un » sans préposition.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette tournure française introduit naturellement les paroles directes du verset suivant tout en conservant la fonction de la formule hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre sans lui substituer un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte visionnaire favorise « ange », mais le mot hébreu garde son sens général de « messager » ; la variante lexicale est donc conservée en note sans trancher davantage la question théologique.
translation_notes:
  register: Français international moderne, sobre et digne. « Avertit solennellement » rend le caractère officiel et appuyé de la parole sans lourdeur archaïque ; « en ces termes » assure la liaison avec le discours du verset suivant.
