id: ZEC.3.5
reference: Zechariah 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֹמַ֕ר יָשִׂ֛ימוּ צָנִ֥יף טָה֖וֹר עַל רֹאשׁ֑/וֹ וַ/יָּשִׂימוּ֩ הַ/צָּנִ֨יף הַ/טָּה֜וֹר עַל רֹאשׁ֗/וֹ וַ/יַּלְבִּשֻׁ֨/הוּ֙ בְּגָדִ֔ים וּ/מַלְאַ֥ךְ יְהוָ֖ה עֹמֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/005.yaml
  text: Then I said[a], “Let them put a clean turban on his head.” So they put the clean turban on his head and clothed him with garments[c][b], while the angel of Yahweh was standing by.
translation:
  language: fr
  text: 'Alors je dis[a] : « Qu’on lui mette sur la tête un turban pur[b] ! » Ils lui mirent donc le turban pur sur la tête et le revêtirent d’habits, tandis que l’ange de Yahweh[c] se tenait là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et je dis. » La conjonction hébraïque peut se traduire simplement par « et »; « alors » fait ressortir la progression du récit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « propre ». Ici, « pur » peut souligner la pureté rituelle.'
    reason: lexical_alternative
  - marker: c
    text: L’expression « l’ange de Yahweh » ne précise pas si elle désigne un messager angélique créé ou une manifestation de Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors je dis
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession, tout en conservant la parole à la première personne.
- source_word: יָשִׂימוּ
  choice: Qu’on lui mette
  rationale: Le jussif à la troisième personne du pluriel exprime ici une demande ou un souhait. La tournure française avec « qu’on » est naturelle et ne nécessite pas d’identifier les exécutants.
- source_word: צָנִיף
  choice: turban
  rationale: Le terme désigne une coiffure faite d’une étoffe enroulée, adaptée ici au contexte sacerdotal sans le préciser davantage.
- source_word: טָהוֹר
  choice: pur
  rationale: « Pur » conserve la portée rituelle possible du terme hébreu, là où « propre » pourrait être compris comme une simple absence de saleté.
- source_word: עַל רֹאשׁוֹ
  choice: sur la tête
  rationale: La relation locative est rendue directement; le pronom indirect « lui » indique déjà le possesseur en français naturel.
- source_word: וַיָּשִׂימוּ
  choice: Ils lui mirent donc
  rationale: « Donc » marque que l’action accomplit la demande précédente, tandis que le passé simple convient au déroulement narratif.
- source_word: הַצָּנִיף הַטָּהוֹר
  choice: le turban pur
  rationale: Les articles définis et la répétition de l’expression précédente sont conservés.
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  choice: et le revêtirent d’habits
  rationale: Cette formulation rend le causatif « vêtir quelqu’un » dans un registre digne, sans préciser que ces habits seraient des vêtements sacerdotaux, ce que le nom seul n’impose pas.
- source_word: וּמַלְאַךְ יְהוָה
  choice: tandis que l’ange de Yahweh
  rationale: La conjonction est comprise de manière circonstancielle avec le participe suivant, signalant une présence simultanée. Le nom divin est translittéré « Yahweh ».
- source_word: עֹמֵד
  choice: se tenait là
  rationale: Le participe décrit une posture ou présence continue. « Se tenait là » est idiomatique et conserve l’image sans ajouter une action.
theological_decisions:
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: Comprendre ce personnage soit comme un messager angélique créé, soit comme une manifestation de Yahweh.
  rationale: La traduction directe préserve l’ambiguïté du texte et ne tranche pas une question théologique que ce verset ne résout pas à lui seul.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le registre narratif biblique sans archaïsmes; le discours direct reste immédiatement compréhensible.
