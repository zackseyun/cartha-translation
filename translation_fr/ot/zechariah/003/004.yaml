- from: 'Il répondit à ceux qui se tenaient devant lui[a] : « Enlevez-lui ses vêtements souillés. » Puis il lui dit : « Vois, j’ai enlevé ta faute de dessus toi, et je vais te revêtir d’habits somptueux[b]. »'
  to: 'Il répondit à ceux qui se tenaient devant lui[a] : « Enlevez-lui ses vêtements souillés. » Puis il lui dit : « Regarde, j’ai ôté de toi ta faute, et je te revêtirai de vêtements d’apparat[b]. »'
  rationale: La révision améliore l’idiomaticité française et évite une nuance temporelle non exigée par l’hébreu. Elle conserve la sobriété descriptive du texte, son ambiguïté quant aux personnes présentes, et sa portée symbolique sans ajout doctrinal.
