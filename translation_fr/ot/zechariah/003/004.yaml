    issue: Nuance d’imminence dans « je vais te revêtir »
    rationale: Le texte hébreu annonce le revêtement comme suite de l’acte, mais ne marque pas spécialement une action imminente. « Je te revêtirai » est plus neutre et plus fidèle.
  - severity: low
    issue: Calque « de dessus toi »
    rationale: Cette formulation cherche à reproduire la préposition concrète, mais elle n’est pas idiomatique en français international actuel. « Ôter de toi » exprime naturellement le retrait tout en préservant le parallélisme symbolique.
  - severity: low
    issue: « Habits somptueux » légèrement surintensif
    rationale: Le terme hébreu désigne des vêtements de qualité, distingués ou d’apparat. « Vêtements d’apparat » rend cette dignité sans suggérer nécessairement un luxe excessif.
