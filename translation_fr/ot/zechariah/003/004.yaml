base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/004.yaml
  text: And he answered and said to those standing before him[a], “Remove the filthy garments from upon him.” Then he said to him, “See, I have taken your iniquity away from upon you[b], and I will clothe you with fine garments.”
translation:
  language: fr
  text: 'Il répondit à ceux qui se tenaient devant lui[a] : « Enlevez-lui ses vêtements souillés. » Puis il lui dit : « Regarde, j’ai ôté de toi ta faute, et je te revêtirai de vêtements d’apparat[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne probablement des assistants célestes, mais l’hébreu dit simplement « ceux qui se tenaient devant lui ».
    reason: alternative_reading
  - marker: b
    text: Ou « beaux vêtements » ou « habits somptueux ». Le mot hébreu désigne une tenue riche, distinguée ou d’apparat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: Il répondit
  rationale: En français narratif, « il répondit » restitue naturellement la valeur de ענה suivi de אמר sans le pléonasme peu idiomatique « répondit et dit ».
- source_word: הָעֹמְדִים לְפָנָיו
  choice: ceux qui se tenaient devant lui
  rationale: La formulation reste descriptive comme l’hébreu et n’identifie pas explicitement ces personnages à des anges ou à des serviteurs.
- source_word: הָסִירוּ הַבְּגָדִים הַצֹּאִים מֵעָלָיו
  choice: Enlevez-lui ses vêtements souillés
  rationale: « Souillés » exprime la saleté fortement dégradante de צֹאִים ainsi que sa portée symbolique, tandis que la construction française évite le calque lourd « de dessus lui » dans l’ordre donné.
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif attire l’attention sur la signification de l’acte symbolique et conserve la forme directe de l’hébreu.
- source_word: הֶעֱבַרְתִּי מֵעָלֶיךָ עֲוֺנֶךָ
  choice: j’ai enlevé ta faute de dessus toi
  rationale: « Faute » préserve ici la polysémie de עָוֹן entre faute, culpabilité et conséquence de la faute. « De dessus toi » garde le parallélisme concret avec les vêtements retirés.
- source_word: וְהַלְבֵּשׁ אֹתְךָ
  choice: et je vais te revêtir
  rationale: La construction est comprise comme la continuation de la déclaration du locuteur. « Je vais » rend naturellement en français l’action annoncée comme imminente, sans la présenter comme déjà accomplie.
- source_word: מַחֲלָצוֹת
  choice: habits somptueux
  rationale: Le terme désigne des vêtements distingués, riches ou d’apparat, plutôt que simplement des vêtements propres. « Habits somptueux » transmet la dignité et la valeur de cette tenue.
theological_decisions:
- issue: Sens symbolique du changement de vêtements
  choice: Conserver côte à côte l’enlèvement des vêtements souillés et celui de la faute, sans ajouter d’explication doctrinale.
  alternative: Expliciter l’acte comme justification, purification ou rétablissement sacerdotal.
  rationale: Le verset établit lui-même le lien symbolique, mais ne le formule pas selon une catégorie doctrinale systématique.
- issue: Identité de ceux qui se tiennent devant le locuteur
  choice: Employer la description « ceux qui se tenaient devant lui ».
  alternative: Les identifier comme des anges ou comme ses serviteurs.
  rationale: Le contexte peut évoquer des assistants célestes, mais l’expression hébraïque demeure descriptive.
- issue: Valeur de עֲוֺנֶךָ
  choice: Traduire par « ta faute » et signaler en note les valeurs possibles de culpabilité ou d’iniquité.
  alternative: Choisir exclusivement « ton péché », « ta culpabilité » ou « ton iniquité ».
  rationale: עָוֹן peut désigner l’acte fautif, la culpabilité qui en résulte ou sa conséquence. Le contexte de retrait autorise plusieurs nuances qu’il ne faut pas réduire silencieusement.
translation_notes:
  register: 'Français international actuel, digne et accessible. La syntaxe est rendue idiomatique sans effacer les répétitions porteuses de sens : le retrait concret des vêtements est repris par la faute enlevée « de dessus » Josué. Les pronoms conservent l’ambiguïté référentielle du texte hébreu et du contexte immédiat.'
