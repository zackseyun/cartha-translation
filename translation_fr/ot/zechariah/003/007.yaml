  text: כֹּה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אִם בִּ/דְרָכַ֤/י תֵּלֵךְ֙ וְ/אִ֣ם אֶת מִשְׁמַרְתִּ֣/י תִשְׁמֹ֔ר וְ/גַם אַתָּה֙ תָּדִ֣ין אֶת בֵּיתִ֔/י וְ/גַ֖ם תִּשְׁמֹ֣ר אֶת חֲצֵרָ֑/י וְ/נָתַתִּ֤י לְ/ךָ֙ מַהְלְכִ֔ים בֵּ֥ין הָ/עֹמְדִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/007.yaml
  text: 'Thus says Yahweh of hosts: If you walk in my ways and if you keep my charge[a], then you also shall govern my house and also keep my courts, and I will give you free access among these who are standing here.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : Si tu marches dans mes voies et si tu veilles sur ce que je t’ai confié, alors toi aussi, tu gouverneras ma maison et tu veilleras aussi sur mes cours. Je te donnerai libre accès parmi ceux qui se tiennent ici.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « je te donnerai le droit de circuler parmi ceux qui se tiennent ici ». L’hébreu peut aussi être compris ainsi : « je te donnerai ceux qui circulent parmi ceux qui se tiennent ici » ou « des lieux où circuler parmi ceux qui se tiennent ici ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est transcrit « Yahweh » plutôt que remplacé par un titre. « des armées » rend צְבָאוֹת de façon naturelle en français tout en conservant la portée du titre divin.
- source_word: בִּדְרָכַי תֵּלֵךְ
  choice: tu marches dans mes voies
  rationale: Cette formulation conserve la métaphore hébraïque de la marche comme conduite et demeure intelligible en français biblique moderne.
- source_word: מִשְׁמַרְתִּי תִשְׁמֹר
  choice: tu veilles sur ce que je t’ai confié
  rationale: מִשְׁמֶרֶת désigne ici une responsabilité ou une fonction confiée, dans un contexte sacerdotal. Cette expression restitue ce sens mieux que le seul mot « commandement ».
- source_word: תָּדִין אֶת בֵּיתִי
  choice: tu gouverneras ma maison
  rationale: דִּין peut signifier juger, administrer ou gouverner. Dans le contexte du temple et du sacerdoce, « gouverner » exprime l’autorité administrative sans la limiter à l’activité judiciaire.
- source_word: תִּשְׁמֹר אֶת חֲצֵרָי
  choice: tu veilleras sur mes cours
  rationale: Le verbe reprend l’idée de garde et de responsabilité, tandis que « cours » est le terme usuel pour les espaces du temple.
- source_word: מַהְלְכִים
  choice: libre accès
  rationale: Ce terme rare et discuté semble désigner ici une possibilité ou un droit de circuler. « libre accès » exprime naturellement le privilège accordé dans la cour céleste, sans masquer les autres analyses possibles signalées en note.
- source_word: בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: parmi ceux qui se tiennent ici
  rationale: Dans la scène visionnaire, les personnes qui se tiennent là sont vraisemblablement les assistants célestes. « Parmi » rend בֵּין idiomatiquement sans imposer une représentation trop étroitement spatiale.
- source_word: וְגַם ... וְגַם
  choice: alors toi aussi ... et ... aussi
  rationale: La répétition de « aussi » conserve l’insistance et la progression de la promesse conditionnelle.
theological_decisions:
- issue: Sens de la promesse וְנָתַתִּי לְךָ מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: Une promesse de libre accès parmi les assistants célestes présents devant Dieu.
  alternative: Le texte peut aussi promettre des personnes qui circulent, ou des passages ou lieux où marcher, parmi ceux qui se tiennent là.
  rationale: מַהְלְכִים est rare et son analyse reste débattue. Le contexte visionnaire favorise l’idée d’un privilège de circulation ou d’admission auprès de la cour céleste, mais l’ambiguïté réelle est conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle et les répétitions du texte hébreu sont maintenues sans lourdeur excessive. Le tutoiement correspond à l’adresse directe et singulière à Josué.
