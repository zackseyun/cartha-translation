  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן יִגְעַ֨ר יְהוָ֤ה בְּ/ךָ֙ הַ/שָּׂטָ֔ן וְ/יִגְעַ֤ר יְהוָה֙ בְּ/ךָ֔ הַ/בֹּחֵ֖ר בִּ/ירֽוּשָׁלִָ֑ם הֲ/ל֧וֹא זֶ֦ה א֖וּד מֻצָּ֥ל מֵ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/002.yaml
  text: And Yahweh said to the Accuser[a], “Yahweh rebuke you, O Accuser! Indeed, Yahweh, who has chosen Jerusalem[b], rebuke you! Is not this a brand snatched from the fire?”
translation:
  language: fr
  text: 'Et Yahweh dit à l’Accusateur[a] : « Que Yahweh te réprimande, Accusateur ! Que Yahweh, lui qui a choisi Jérusalem, te réprimande ! N’est-ce pas là un tison arraché au feu[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « Satan ». L’hébreu porte ici le titre « l’accusateur ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « un morceau de bois sauvé du feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: הַשָּׂטָן
  choice: l’Accusateur / Accusateur
  rationale: Avec l’article défini, le nom hébreu désigne ici naturellement une fonction ou un titre. « Accusateur » convient au cadre judiciaire de la vision, tandis que la forme traditionnelle « Satan » est signalée en note.
- source_word: יִגְעַר
  choice: réprimande
  rationale: Le verbe exprime une réprimande ferme et autoritaire. Cette formulation française conserve la force judiciaire de l’énoncé sans ajouter l’idée d’une condamnation ou d’une expulsion.
- source_word: הַבֹּחֵר בִּירוּשָׁלִָם
  choice: lui qui a choisi Jérusalem
  rationale: La proposition relative rend naturellement le participe hébreu et présente Yahweh par son choix de Jérusalem, compris comme établi, sans alourdir la phrase.
- source_word: הֲלוֹא
  choice: N’est-ce pas là
  rationale: Cette tournure conserve la question rhétorique qui appelle une réponse affirmative.
- source_word: אוּד
  choice: tison
  rationale: « Tison » désigne avec concision un morceau de bois brûlant ou à demi consumé et restitue l’image hébraïque.
- source_word: מֻצָּל מֵאֵשׁ
  choice: arraché au feu
  rationale: Cette expression vive rend le participe passif au sens de « délivré, sauvé » tout en évoquant un sauvetage de justesse.
theological_decisions:
- issue: 'הַשָּׂטָן : nom propre ou titre'
  choice: Le texte principal porte « l’Accusateur » comme titre.
  alternative: « Satan » ou « l’adversaire »
  rationale: L’article hébreu et le contexte judiciaire favorisent la lecture fonctionnelle « l’Accusateur ». La lecture traditionnelle comme nom propre reste indiquée en note afin de ne pas effacer son ancienneté ni l’identification possible du personnage.
- issue: Répétition de la formule de réprimande prononcée par Yahweh
  choice: Les deux appels à la réprimande sont conservés.
  alternative: Fondre les deux propositions en une seule réprimande.
  rationale: La répétition appartient au texte hébreu et porte son insistance rhétorique et judiciaire ; la réduire affaiblirait cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition hébraïque est maintenue, tandis que « Oui » articule naturellement le second membre emphatique. « Tison arraché au feu » conserve l’image concrète et vigoureuse de l’original.
