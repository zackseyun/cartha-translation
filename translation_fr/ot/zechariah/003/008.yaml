  text: שְֽׁמַֽע נָ֞א יְהוֹשֻׁ֣עַ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל אַתָּה֙ וְ/רֵעֶ֨י/ךָ֙ הַ/יֹּשְׁבִ֣ים לְ/פָנֶ֔י/ךָ כִּֽי אַנְשֵׁ֥י מוֹפֵ֖ת הֵ֑מָּה כִּֽי הִנְ/נִ֥י מֵבִ֛יא אֶת עַבְדִּ֖/י צֶֽמַח־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/008.yaml
  text: Hear now[a], Joshua the high priest, you and your companions who sit before you, for they are men of a sign; for behold, I am bringing my servant, the Branch.
translation:
  language: fr
  text: « Écoute donc, Josué, grand prêtre, toi et tes compagnons qui siègent devant toi, car ce sont des hommes qui servent de signe[a]. En effet, voici que je vais faire venir mon serviteur, le Germe. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes qui sont un signe » ou « des hommes de présage ».
    reason: Alternative lexicale préservant les nuances possibles de מוֹפֵת.
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Écoute donc
  rationale: L’impératif accompagné de נָא exprime ici une invitation pressante à prêter attention. « Écoute donc » garde la force de l’appel dans un français naturel et digne.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: grand prêtre
  rationale: Titre français établi pour le principal titulaire de la fonction sacerdotale.
- source_word: וְרֵעֶיךָ
  choice: tes compagnons
  rationale: רֵעַ peut désigner des compagnons ou associés; dans cette scène sacerdotale, « compagnons » convient mieux que « amis », qui suggérerait une intimité non précisée.
- source_word: הַיֹּשְׁבִים לְפָנֶיךָ
  choice: qui siègent devant toi
  rationale: « Siègent » rend la posture tout en convenant à des personnes réunies auprès de Josué; « devant toi » conserve la formulation spatiale et relationnelle de l’hébreu.
- source_word: אַנְשֵׁי מוֹפֵת
  choice: des hommes qui servent de signe
  rationale: מוֹפֵת peut désigner un signe, un prodige ou un présage. Cette formulation française explicite le rapport de construction sans déterminer entièrement de quelle manière ces hommes sont symboliques.
- source_word: הִנְנִי מֵבִיא
  choice: voici que je vais faire venir
  rationale: הִנְנִי introduit une annonce divine solennelle, tandis que le participe présente l’action comme imminente ou assurée. « Je vais faire venir » rend aussi la valeur causative naturelle de « amener » dans ce contexte.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: « Serviteur » exprime ici une personne au service et sous la mission de Dieu, sans introduire la nuance sociale plus restrictive d’« esclave ».
- source_word: צֶמַח
  choice: le Germe
  rationale: Le nom signifie ce qui pousse, germe ou rejeton. Avec « mon serviteur », il fonctionne comme une désignation particulière de la figure annoncée; la majuscule signale cet emploi quasi titulaire sans expliciter davantage son identité.
theological_decisions:
- issue: 'Statut de צֶמַח : titre prophétique ou nom commun'
  choice: « le Germe » avec majuscule
  alternative: « le rejeton », « une pousse » ou « un germe »
  rationale: Dans Zacharie, notamment en 6.12, צֶמַח désigne une figure attendue et s’emploie ici avec « mon serviteur ». La traduction conserve l’image végétale et son caractère titulaire, sans ajouter une identification doctrinale absente du verset.
- issue: Portée symbolique de אַנְשֵׁי מוֹפֵת
  choice: « des hommes qui servent de signe » avec une note
  alternative: « des hommes de présage » ou « des hommes qui sont un signe »
  rationale: L’expression attribue aux compagnons une fonction symbolique, mais מוֹפֵת permet plusieurs nuances. Le texte principal reste intelligible tout en préservant cette ouverture dans la note.
translation_notes:
  register: Français international moderne, au registre prophétique digne mais accessible. « Voici que » maintient la solennité de l’annonce sans recourir à l’archaïque « voici, je… ». La répétition de כִּי est rendue par « car » puis « en effet », afin de conserver le lien explicatif sans alourdir la phrase.
