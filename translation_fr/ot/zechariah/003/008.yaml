  source_fidelity: 'Le texte rend fidèlement les éléments essentiels de l’hébreu : l’appel adressé à Josué, son titre de grand prêtre, ses compagnons assis devant lui, leur valeur de signe, ainsi que l’annonce divine de la venue du serviteur appelé « le Germe ». « Voici que je vais faire venir » exprime convenablement la force d’annonce solennelle et l’imminence/certitude du participe לאחר הִנְנִי.'
