  terminology: « Josué », « grand prêtre », « mon serviteur » et « le Germe » sont des choix justes et cohérents. La majuscule à « Germe » signale l’emploi désignatif sans imposer d’identification doctrinale. « Des hommes qui servent de signe » transmet de façon intelligible la portée symbolique de אַנְשֵׁי מוֹפֵת, tandis que la note préserve les possibilités plus littérales ou plus nuancées.
