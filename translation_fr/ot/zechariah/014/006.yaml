  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא לֹֽא יִהְיֶ֣ה א֔וֹר יְקָר֖וֹת יקפאו/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/006.yaml
  text: 'And it will happen on that day: there will be no light[a]; the glorious ones will congeal.'
translation:
  language: fr
  text: En ce jour-là, il arrivera qu’il n’y aura pas de lumière[a] ; les choses précieuses se figeront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, selon une autre analyse traditionnelle : « il n’y aura ni lumière, ni froid, ni gel ». La fin du verset est difficile en hébreu et a été comprise de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: il arrivera
  rationale: Rend naturellement en français moderne la formule prophétique annonçant un événement futur.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Expression prophétique consacrée, claire et idiomatique en français.
- source_word: לֹא יִהְיֶה אוֹר
  choice: il n’y aura plus de lumière
  rationale: Rend la proposition existentielle négative ; « plus » convient au contexte de bouleversement cosmique, sans préciser la durée.
- source_word: יְקָרוֹת
  choice: les astres resplendissants
  rationale: Le terme désigne littéralement des réalités précieuses ou splendides ; dans ce contexte de lumière et de phénomènes cosmiques, « astres resplendissants » explicite sobrement le référent probable tout en conservant l’éclat du mot.
- source_word: יקפאון
  choice: se figeront
  rationale: Conserve l’image concrète d’un gel ou d’une coagulation tout en offrant une formulation française naturelle et sans imposer « s’obscurciront ».
theological_decisions:
- issue: Interprétation de la proposition difficile יְקָרוֹת יקפאון
  choice: les astres resplendissants se figeront
  alternative: il n’y aura ni froid ni gel
  rationale: Le texte massorétique est lexicalement et syntaxiquement difficile. Le texte principal en suit les termes de façon relativement formelle sans les réduire à une simple obscurité ; la note signale l’autre analyse traditionnelle importante.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure conserve le caractère étrange de l’image hébraïque ; le point-virgule marque les deux propositions étroitement liées.
