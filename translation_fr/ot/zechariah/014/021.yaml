source:
  edition: WLC
  text: וְ֠/הָיָה כָּל סִ֨יר בִּ/ירוּשָׁלִַ֜ם וּ/בִֽ/יהוּדָ֗ה קֹ֚דֶשׁ לַ/יהוָ֣ה צְבָא֔וֹת וּ/בָ֨אוּ֙ כָּל הַ/זֹּ֣בְחִ֔ים וְ/לָקְח֥וּ מֵ/הֶ֖ם וּ/בִשְּׁל֣וּ בָ/הֶ֑ם וְ/לֹא יִהְיֶ֨ה כְנַעֲנִ֥י ע֛וֹד בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/021.yaml
  text: And every pot in Jerusalem and in Judah will be holy to Yahweh of hosts[a], and all who sacrifice will come and take from them and boil in them. And there will no longer be a Canaanite in the house of Yahweh of hosts on that day.
translation:
  language: fr
  text: Chaque marmite, à Jérusalem et en Juda, sera consacrée à YHWH, le maître des armées. Tous ceux qui offriront des sacrifices viendront, en prendront et y feront bouillir. Ce jour-là, il n’y aura plus aucun Cananéen[a] dans la maison de YHWH, le maître des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « marchand » ou « commerçant » ; le mot hébreu peut avoir ce sens dans certains contextes.
    reason: Lecture alternative de כְנַעֲנִי.
lexical_decisions:
- source_word: סִיר
  choice: marmite
  rationale: Désigne un récipient servant à cuire ou à faire bouillir. « Marmite » est naturel en français et convient au contexte sacrificiel.
- source_word: קֹדֶשׁ
  choice: consacrée
  rationale: Dans cette construction prédicative, le mot indique que chaque marmite est mise à part pour YHWH. « Consacrée » exprime clairement cette appartenance cultuelle.
- source_word: יְהוָה צְבָאוֹת
  choice: YHWH, le maître des armées
  rationale: Conserve le nom divin du texte hébreu et rend le titre צְבָאוֹת sans le réduire à une affirmation générale de toute-puissance.
- source_word: הַזֹּבְחִים
  choice: ceux qui offriront des sacrifices
  rationale: Le participe substantivé désigne les personnes qui accomplissent des sacrifices; cette formulation est idiomatique et explicite en français moderne.
- source_word: מֵהֶם
  choice: en prendre
  rationale: Le pronom renvoie aux marmites; le pronom français « en » garde ce lien sans lourdeur.
- source_word: וּבִשְּׁלוּ בָהֶם
  choice: y feront cuire leurs offrandes
  rationale: Le verbe peut désigner la cuisson ou l’ébullition. Le complément implicite est rendu par « leurs offrandes », clairement fourni par le contexte sacrificiel, afin d’éviter l’expression française incomplète « cuire dedans ».
- source_word: כְנַעֲנִי
  choice: Cananéen
  rationale: Le sens premier du terme est ethnique. Il est maintenu dans le texte pour préserver l’image prophétique et sa tension, tandis que le sens commercial possible figure en note.
- source_word: בְּבֵית יְהוָה צְבָאוֹת
  choice: dans la maison de YHWH, le maître des armées
  rationale: « Maison » correspond directement à l’hébreu et conserve son emploi cultuel pour le temple.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Formulation française naturelle de la formule temporelle prophétique.
theological_decisions:
- issue: Sens de כְנַעֲנִי dans la dernière proposition
  choice: Cananéen
  alternative: marchand ou commerçant
  rationale: Le mot désigne normalement un Cananéen, mais peut aussi prendre le sens de marchand dans certains contextes. Le texte principal conserve la lecture ethnique et sa forte résonance canonique; la note maintient ouverte la lecture commerciale, particulièrement plausible dans le contexte du temple.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’imagerie cultuelle et prophétique tout en évitant une syntaxe artificiellement calquée sur l’hébreu.
