source:
  edition: WLC
  text: וְ/נַסְתֶּ֣ם גֵּֽיא הָרַ֗/י כִּֽי יַגִּ֣יעַ גֵּי הָרִים֮ אֶל אָצַל֒ וְ/נַסְתֶּ֗ם כַּ/אֲשֶׁ֤ר נַסְתֶּם֙ מִ/פְּנֵ֣י הָ/רַ֔עַשׁ בִּ/ימֵ֖י עֻזִּיָּ֣ה מֶֽלֶךְ יְהוּדָ֑ה וּ/בָא֙ יְהוָ֣ה אֱלֹהַ֔/י כָּל קְדֹשִׁ֖ים עִמָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/005.yaml
  text: And you will flee by the valley of my mountains[a], for the valley of the mountains will reach to Azal. Yes, you will flee as you fled from before the earthquake in the days of Uzziah king of Judah. Then Yahweh my God will come[b], and all the holy ones with him.
translation:
  language: fr
  text: Vous fuirez par la vallée de mes montagnes, car la vallée des montagnes s’étendra jusqu’à Atsal. Vous fuirez comme vous avez fui devant le tremblement de terre, à l’époque d’Ozias, roi de Juda. Alors Yahweh, mon Dieu, viendra, et tous les êtres saints[a] seront avec toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner des êtres célestes ; d’autres la comprennent comme « les saints » ou « les anges saints ».
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte ici « avec toi » au singulier ; une autre tradition textuelle lit « avec lui ».
    reason: textual_variant
lexical_decisions:
- source_word: וְנַסְתֶּם
  choice: vous fuirez
  rationale: Le verbe נוּס signifie normalement « fuir »; sa répétition dans la comparaison avec la fuite provoquée par le tremblement de terre confirme ce sens.
- source_word: גֵּיא הָרַי
  choice: la vallée de mes montagnes
  rationale: « Vallée » rend naturellement גֵּיא, et le suffixe de première personne dans הָרַי est conservé par « mes ».
- source_word: גֵּי הָרִים
  choice: la vallée entre les montagnes
  rationale: Dans ce contexte topographique, « entre les montagnes » exprime naturellement la relation tout en distinguant cette expression de « mes montagnes » dans la proposition précédente.
- source_word: יַגִּיעַ
  choice: s’étendra jusqu’à
  rationale: Le verbe décrit ici l’extension spatiale de la vallée jusqu’au lieu nommé Atsal.
- source_word: אָצַל
  choice: Atsal
  rationale: Le nom de lieu est translittéré en suivant une graphie naturelle en français.
- source_word: מִפְּנֵי הָרַעַשׁ
  choice: devant le tremblement de terre
  rationale: Cette formulation conserve l’image hébraïque d’une fuite « de devant » le séisme tout en restant compréhensible en français.
- source_word: וּבָא
  choice: Alors … viendra
  rationale: « Alors » fait ressortir la progression du récit, de la fuite à la venue de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne est explicitement conservé.
- source_word: כָּל קְדֹשִׁים
  choice: tous les êtres saints
  rationale: Cette expression demeure assez large pour désigner des êtres célestes ou des humains consacrés sans préciser ce que l’hébreu ne précise pas.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: Le texte massorétique porte un pronom masculin singulier de deuxième personne. Le passage soudain du « vous » pluriel à « toi » est maintenu et signalé en note.
theological_decisions:
- issue: Identité des êtres saints accompagnant la venue de Yahweh
  choice: tous les êtres saints
  alternative: tous les saints / tous les anges saints
  rationale: Le terme hébreu ne permet pas de décider à lui seul s’il s’agit d’êtres célestes, d’anges ou d’humains consacrés; la traduction préserve cette ambiguïté.
- issue: Pronom final et relation des êtres saints à Yahweh
  choice: avec toi
  alternative: avec lui
  rationale: Le texte hébreu reçu dit littéralement « avec toi ». La leçon « avec lui », attestée par une autre tradition textuelle et largement adoptée, clarifie l’accompagnement de Yahweh, mais elle n’est pas substituée silencieusement au texte source.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération préserve le nom propre présent dans le texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique et les répétitions du texte hébreu sont conservés. Le changement abrupt du pluriel « vous » au singulier « toi » n’est pas harmonisé, afin de préserver la difficulté textuelle.
