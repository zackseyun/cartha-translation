revisions:
- from: Vous fuirez par la vallée de mes montagnes, car la vallée entre les montagnes s’étendra jusqu’à Atsal. Vous fuirez comme vous avez fui devant le tremblement de terre, à l’époque d’Ozias, roi de Juda. Alors Yahweh, mon Dieu, viendra, et tous les êtres saints[a] seront avec toi[b].
  to: Vous fuirez par la vallée de mes montagnes, car la vallée des montagnes s’étendra jusqu’à Atsal. Vous fuirez comme vous avez fui devant le tremblement de terre, à l’époque d’Ozias, roi de Juda. Alors Yahweh, mon Dieu, viendra, et tous les êtres saints[a] seront avec toi[b].
  rationale: La seule correction apportée remplace « la vallée entre les montagnes » par « la vallée des montagnes », afin de conserver plus exactement le rapport exprimé par le construct hébreu גֵּי הָרִים sans ajouter d’interprétation topographique. Le pluriel initial et le singulier final, ainsi que l’ambiguïté de « êtres saints », sont maintenus.
