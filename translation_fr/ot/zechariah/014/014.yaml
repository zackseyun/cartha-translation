id: ZEC.14.14
reference: Zechariah 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַ֨ם יְהוּדָ֔ה תִּלָּחֵ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/אֻסַּף֩ חֵ֨יל כָּל הַ/גּוֹיִ֜ם סָבִ֗יב זָהָ֥ב וָ/כֶ֛סֶף וּ/בְגָדִ֖ים לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/014.yaml
  text: 'And Judah also will fight at Jerusalem[a], and the wealth of all the surrounding nations will be gathered: gold and silver and garments, in very great abundance.'
translation:
  language: fr
  text: 'Juda aussi combattra à Jérusalem[a], et les richesses de toutes les nations environnantes seront rassemblées : de l’or, de l’argent et des vêtements en très grande quantité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Juda aussi combattra contre Jérusalem. » La préposition hébraïque signifie normalement « dans, à », mais certains comprennent ici, à la lumière du contexte, qu’elle exprime une opposition.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: L’adverbe restitue naturellement la valeur additive et légèrement emphatique de la conjonction suivie de גַּם.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom du peuple et du territoire.
- source_word: תִּלָּחֵם
  choice: combattra
  rationale: Le nifal de לחם désigne ici l’action de prendre part au combat; « combattra » est clair, digne et n’en précise pas indûment les modalités.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition ב est normalement locative (« dans/à »). Le contexte permet toutefois à certains de comprendre une opposition; cette possibilité est conservée en note.
- source_word: וְאֻסַּף
  choice: seront rassemblées
  rationale: Le passif, intégré à la séquence prophétique, reçoit une valeur future. L’accord au pluriel avec « les richesses » produit un français naturel.
- source_word: חֵיל
  choice: les richesses
  rationale: Bien que חֵיל puisse désigner la force ou une armée, l’énumération de l’or, de l’argent et des vêtements impose ici le sens matériel de biens ou richesses.
- source_word: כָּל הַגּוֹיִם סָבִיב
  choice: de toutes les nations environnantes
  rationale: Cette formulation française actuelle conserve à la fois la totalité et la valeur spatiale de סָבִיב.
- source_word: זָהָב וָכֶסֶף וּבְגָדִים
  choice: de l’or, de l’argent et des vêtements
  rationale: Traduction directe de l’inventaire des biens; les articles partitifs conviennent naturellement après les deux-points en français.
- source_word: לָרֹב מְאֹד
  choice: en très grande quantité
  rationale: La formulation rend l’idée d’abondance ainsi que l’intensification exprimée par מְאֹד, sans lourdeur.
theological_decisions:
- issue: Juda combat-il à Jérusalem ou contre Jérusalem ?
  choice: Juda aussi combattra à Jérusalem
  alternative: Juda aussi combattra contre Jérusalem
  rationale: Le sens le plus direct de la préposition ב est locatif. Comme le contexte plus large peut conduire à comprendre la relation comme hostile, l’autre lecture est signalée en note plutôt qu’écartée ou imposée.
translation_notes:
  register: Français international moderne, naturel et digne. « Combattra » et « vêtements » maintiennent un registre soutenu mais accessible; la ponctuation met clairement en relief l’inventaire des richesses.
