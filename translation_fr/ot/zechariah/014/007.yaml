source:
  edition: WLC
  text: וְ/הָיָ֣ה יוֹם אֶחָ֗ד ה֛וּא יִוָּדַ֥ע לַֽ/יהוָ֖ה לֹא י֣וֹם וְ/לֹא לָ֑יְלָה וְ/הָיָ֥ה לְ/עֵֽת עֶ֖רֶב יִֽהְיֶה אֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/007.yaml
  text: And it will be one day[a], known to Yahweh, neither day nor night[c][b]; but at evening time there will be light.
translation:
  language: fr
  text: 'Ce sera un jour[a], connu de Yahvé[b] : ce ne sera ni jour ni nuit[c]. Mais le soir venu, il y aura de la lumière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi souligner le caractère singulier ou sans pareil de ce jour.
    reason: lexical_alternative
  - marker: b
    text: 'Autre formulation possible : « que Yahvé connaît ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit de manière abrupte : « pas jour et pas nuit ».'
    reason: source_form
lexical_decisions:
- source_word: וְהָיָה
  choice: Ce sera
  rationale: Dans ce discours prophétique, la construction introduit naturellement un état ou un événement futur. « Ce sera » est concis et idiomatique en français.
- source_word: יוֹם אֶחָד
  choice: un jour unique
  rationale: L’expression signifie littéralement « un jour ». Dans ce contexte, אֶחָד peut souligner le caractère singulier de ce jour. « Unique » exprime cette portée tout en signalant en note la traduction strictement littérale.
- source_word: יִוָּדַע לַיהוָה
  choice: connu de Yahvé
  rationale: Le niphal de ידע exprime ici le fait d’être connu, et ל marque la relation avec Yahvé. La formulation française conserve la brièveté et une part de l’ambiguïté de l’hébreu.
- source_word: לֹא יוֹם וְלֹא לָיְלָה
  choice: ce ne sera ni jour ni nuit
  rationale: Cette formulation française naturelle maintient la négation paradoxale des deux catégories, sans chercher à expliquer le phénomène.
- source_word: לְעֵת עֶרֶב
  choice: au temps du soir
  rationale: La traduction reste proche de l’expression hébraïque tout en étant compréhensible et digne en français courant.
- source_word: יִהְיֶה אוֹר
  choice: il y aura de la lumière
  rationale: Cette tournure existentielle rend naturellement l’hébreu et conserve le renversement surprenant qui se produit au soir.
theological_decisions:
- issue: Nature du jour extraordinaire
  choice: Présenter un jour singulier, connu de Yahvé, sans définir le calendrier ni le mécanisme prophétique.
  alternative: Y voir explicitement un phénomène astronomique littéral, une image purement symbolique du salut ou une chronologie eschatologique particulière.
  rationale: Le verset décrit clairement un jour exceptionnel et paradoxal, mais ne précise pas à lui seul son mécanisme ni son cadre chronologique. La traduction préserve cette tension.
- issue: Portée de « connu de Yahvé »
  choice: Conserver la formulation relationnelle « connu de Yahvé ».
  alternative: Préciser « connu de Yahvé seul » ou « choisi par Yahvé ».
  rationale: Le mot « seul » et l’idée de choix ne sont pas exprimés explicitement dans l’hébreu. Les ajouter résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu, tandis que les notes signalent les formulations plus littérales et les ambiguïtés réelles.
