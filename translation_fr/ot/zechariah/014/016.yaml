source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ מִ/כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרֽוּשָׁלִָ֑ם וְ/עָל֞וּ מִ/דֵּ֧י שָׁנָ֣ה בְ/שָׁנָ֗ה לְ/הִֽשְׁתַּחֲוֺת֙ לְ/מֶ֨לֶךְ֙ יְהוָ֣ה צְבָא֔וֹת וְ/לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/016.yaml
  text: Then all who remain from all the nations that came against Jerusalem shall go up year after year to worship the King[a], Yahweh of Armies[b], and to celebrate the Feast of Booths.
translation:
  language: fr
  text: Alors, tous ceux qui resteront de toutes les nations venues contre Jérusalem monteront, année après année, pour se prosterner devant le Roi, Yahvé des armées[a], et pour célébrer la fête des Cabanes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On trouve aussi traditionnellement : « l’Éternel des armées ».'
    reason: lexical_alternative
  - marker: b
    text: Appelée aussi traditionnellement « fête des Tabernacles »; en hébreu, Soukkot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors, ... monteront
  rationale: La formule introduit la conséquence future de la séquence prophétique. « Alors » marque naturellement cette progression en français, tandis que le futur du verbe principal en conserve la portée.
- source_word: כָּל הַנּוֹתָר
  choice: tous ceux qui resteront
  rationale: Le participe désigne l’ensemble des personnes demeurées en vie ou laissées après les événements précédents. Cette formulation conserve l’idée ouverte de reste sans expliciter davantage la manière dont elles ont survécu.
- source_word: מִכָּל הַגּוֹיִם
  choice: de toutes les nations
  rationale: Traduction directe et naturelle de l’expression désignant ici les peuples étrangers dans leur ensemble.
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: venues contre Jérusalem
  rationale: Dans ce contexte, עַל exprime une marche hostile. « Venues contre » conserve l’image et l’ambiguïté du texte sans préciser indûment le stade ou la forme de l’attaque.
- source_word: וְעָלוּ
  choice: monteront
  rationale: עלה est le verbe habituel pour la montée vers Jérusalem; « monteront » garde à la fois sa dimension géographique et sa résonance de pèlerinage.
- source_word: מִדֵּי שָׁנָה בְשָׁנָה
  choice: année après année
  rationale: L’expression distributive indique une répétition annuelle régulière, que cette tournure française rend clairement.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: pour se prosterner devant
  rationale: Le verbe désigne littéralement le fait de s’incliner ou de se prosterner et, dans ce cadre cultuel, un acte d’adoration. La traduction conserve le geste concret sans perdre sa portée religieuse.
- source_word: לְמֶלֶךְ
  choice: devant le Roi
  rationale: La préposition française « devant » s’accorde naturellement avec « se prosterner »; le titre royal est maintenu, car il est explicite et significatif dans le contexte.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Le nom divin est rendu par « Yahvé », et צְבָאוֹת par « des armées », formulation transparente qui conserve la force du titre hébreu.
- source_word: וְלָחֹג
  choice: et pour célébrer
  rationale: חגג désigne la célébration ou l’observance d’une fête de pèlerinage. « Célébrer » exprime naturellement son caractère festif et cultuel.
- source_word: חַג הַסֻּכּוֹת
  choice: la fête des Cabanes
  rationale: סֻכּוֹת désigne les abris temporaires associés à cette fête. « Cabanes » est une traduction française claire du terme, tandis que l’appellation traditionnelle est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; l’Éternel
  rationale: Le texte emploie directement le tétragramme. « Yahvé » le présente comme un nom propre plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
- issue: Rendu de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: de l’univers; des armées célestes
  rationale: « Des armées » traduit le terme sans décider si les forces visées sont terrestres, célestes ou les deux, et préserve ainsi l’étendue potentielle du titre.
- issue: Portée eschatologique du pèlerinage des nations
  choice: Conserver sans l’expliquer l’image prophétique d’une montée annuelle des nations survivantes
  alternative: Y voir explicitement soit un pèlerinage futur littéral, soit une représentation symbolique de l’adoration universelle
  rationale: Le verset décrit ce pèlerinage et cette fête, mais ne tranche pas lui-même entre les différentes lectures eschatologiques possibles. La traduction ne résout donc pas cette tension.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste fluide tout en conservant les images de la montée à Jérusalem, de la prosternation et des cabanes. Les deux appels de note [a] et [b] figurent dans le texte principal à l’endroit correspondant.
