  naturalness: Le français est actuel, clair et d’un registre biblique sobre. La phrase est bien articulée; « année après année » et « pour se prosterner devant le Roi » sont naturels. « Fête des Cabanes » est une traduction transparente et recevable en français international, avec l’appellation plus traditionnelle signalée en note.
