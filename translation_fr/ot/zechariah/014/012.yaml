  source_fidelity: 'Le sens fondamental est fidèlement rendu : Yahweh inflige un fléau aux peuples ayant fait la guerre contre Jérusalem, et la décomposition corporelle est conservée dans toute sa force. La formulation révisée maintient la portée distributive des singuliers hébreux sans expliciter un mécanisme du fléau.'
  naturalness: « Le fléau dont Yahweh frappera » est compréhensible, mais « le fléau par lequel Yahweh frappera » est plus idiomatique et explicite en français moderne. « Alors qu’il se tiendra encore debout » rend naturellement la concomitance du participe hébreu.
  terminology: « Fléau », « frappera », « peuples », « chair », « orbites » et « Yahweh » sont appropriés. Une note facultative mais utile conserve l’alternative contextuelle « nations » pour עַמִּים, avec un ancrage placé sur « peuples ».
