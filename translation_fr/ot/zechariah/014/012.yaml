source:
  edition: WLC
  text: וְ/זֹ֣את תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֥ר צָבְא֖וּ עַל יְרוּשָׁלִָ֑ם הָמֵ֣ק בְּשָׂר֗/וֹ וְ/הוּא֙ עֹמֵ֣ד עַל רַגְלָ֔י/ו וְ/עֵינָי/ו֙ תִּמַּ֣קְנָה בְ/חֹֽרֵי/הֶ֔ן וּ/לְשׁוֹנ֖/וֹ תִּמַּ֥ק בְּ/פִי/הֶֽם׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/012.yaml
  text: 'And this will be the plague with which Yahweh will strike all the peoples that wage war against Jerusalem: while he is standing on his feet[a], his flesh will rot away, his eyes will rot away in their sockets, and his tongue will rot away in his mouth.'
translation:
  language: fr
  text: 'Voici le fléau par lequel Yahweh frappera tous les peuples[a] qui auront fait la guerre contre Jérusalem : la chair de chacun se décomposera alors qu’il se tiendra encore debout ; ses yeux se décomposeront dans leurs orbites, et sa langue se décomposera dans sa bouche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les nations ». Le terme hébreu peut désigner des peuples ou des nations selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגֵּפָה
  choice: le fléau
  rationale: מַגֵּפָה désigne un coup ou un fléau infligé, souvent sous la forme d’une plaie. « Fléau » convient au jugement divin décrit ici sans en préciser indûment le mécanisme.
- source_word: יִגֹּף
  choice: frappera
  rationale: Le verbe נגף signifie frapper ou infliger un coup. « Frappera » conserve l’action directe de Yahweh sans confondre le verbe avec le nom « fléau ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כָּל־הָעַמִּים
  choice: tous les peuples
  rationale: Le pluriel עַמִּים peut désigner des peuples ou des nations. « Tous les peuples » en restitue directement le pluriel collectif et convient au contexte.
- source_word: צָבְאוּ עַל
  choice: qui auront combattu contre
  rationale: Dans ce contexte, צבא exprime une action militaire dirigée contre Jérusalem. Le futur antérieur situe naturellement en français cette attaque avant le fléau annoncé.
- source_word: הָמֵק / תִּמַּקְנָה / תִּמַּק
  choice: se décomposera / se décomposeront
  rationale: מקק décrit la dégradation ou la dissolution des chairs. « Se décomposer » préserve l’image corporelle saisissante et permet une répétition lexicale naturelle en français.
- source_word: בְּשָׂרוֹ
  choice: la chair de chacun
  rationale: « Chair » rend précisément בָּשָׂר. L’ajout distributif « de chacun » clarifie que le singulier hébreu décrit individuellement les membres de tous les peuples mentionnés.
- source_word: וְהוּא עֹמֵד עַל־רַגְלָיו
  choice: tandis qu’il sera encore debout
  rationale: Cette formulation rend la simultanéité du participe עֹמֵד et l’effet saisissant d’une décomposition survenant alors que la personne se tient toujours sur ses pieds. « Debout » est l’expression française naturelle.
- source_word: וְעֵינָיו תִּמַּקְנָה בְחֹרֵיהֶן
  choice: ses yeux se décomposeront dans leurs orbites
  rationale: Dans ce contexte anatomique, חֹרִים désigne les cavités des yeux, naturellement appelées « orbites » en français.
- source_word: וּלְשׁוֹנוֹ תִּמַּק בְּפִיהֶם
  choice: et sa langue se décomposera dans sa bouche
  rationale: Le texte consonantique présente un suffixe pluriel à « bouche », mais le sens est distributif après les singuliers « sa langue » et « chacun ». Le singulier français exprime clairement cette distribution.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature des images du jugement
  choice: Conserver explicitement la décomposition de la chair, des yeux et de la langue
  alternative: Atténuer l’image ou l’interpréter comme une défaite métaphorique ou une maladie déterminée
  rationale: L’hébreu décrit concrètement une dissolution corporelle, mais ne précise pas si son mécanisme est miraculeux, militaire ou épidémiologique. La traduction conserve cette force et cette indétermination.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « se décomposer » reproduit l’insistance lexicale du texte hébreu. « Tandis qu’il sera encore debout » évite le calque peu naturel « sur ses pieds » tout en conservant la simultanéité et l’horreur de la scène.
