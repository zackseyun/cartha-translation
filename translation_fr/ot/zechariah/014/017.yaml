source:
  edition: WLC
  text: וְ֠/הָיָה אֲשֶׁ֨ר לֹֽא יַעֲלֶ֜ה מֵ/אֵ֨ת מִשְׁפְּח֤וֹת הָ/אָ֨רֶץ֙ אֶל יְר֣וּשָׁלִַ֔ם לְ/הִֽשְׁתַּחֲוֺ֔ת לְ/מֶ֖לֶךְ יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֥א עֲלֵי/הֶ֖ם יִהְיֶ֥ה הַ/גָּֽשֶׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/017.yaml
  text: And if any of the families of the earth does not go up to Jerusalem to worship the King[a], Yahweh of Armies[b], there will be no rain on them.
translation:
  language: fr
  text: Et si l’une des familles de la terre ne monte pas à Jérusalem pour adorer[a] le Roi, Yahweh des armées[b], aucune pluie ne tombera sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se prosterner ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲשֶׁר
  choice: Et si l’une
  rationale: Cette tournure hébraïque introduit ici une condition suivie de sa conséquence. « Et si l’une » l’exprime naturellement en français tout en reliant le verset au contexte précédent.
- source_word: לֹא יַעֲלֶה
  choice: ne monte pas
  rationale: Le verbe עלה évoque la montée vers Jérusalem, à la fois géographique et liée au pèlerinage. Le présent convient naturellement dans une proposition conditionnelle française.
- source_word: מֵאֵת מִשְׁפְּחוֹת הָאָרֶץ
  choice: des familles de la terre
  rationale: מִשְׁפְּחוֹת désigne des familles ou des clans. Dans ce contexte où toutes les nations sont concernées, הָאָרֶץ a une portée universelle et se traduit par « la terre ».
- source_word: אֶל יְרוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition directionnelle et le nom propre sont rendus selon l’usage français courant.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: pour adorer
  rationale: Le verbe décrit littéralement le fait de se prosterner, mais, devant Yahweh dans ce contexte cultuel, il exprime l’adoration. Le sens gestuel plus littéral est conservé en note.
- source_word: לְמֶלֶךְ
  choice: le Roi
  rationale: Le titre renvoie directement à Yahweh. La majuscule signale cette valeur titulaire sans ajouter de contenu au texte.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré « Yahweh ». צְבָאוֹת est rendu de façon transparente par « armées », sans limiter explicitement celles-ci aux armées terrestres ou célestes.
- source_word: וְלֹא עֲלֵיהֶם יִהְיֶה הַגָּשֶׁם
  choice: aucune pluie ne tombera sur elle
  rationale: Cette formulation française naturelle conserve l’image de la pluie qui ne vient pas sur la famille concernée. Le singulier « elle » reprend « l’une des familles », là où l’hébreu revient à un pronom pluriel collectif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » préserve le caractère de nom propre plutôt que de le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte de Zacharie 14 vise les familles issues des nations. « La terre » maintient cette portée universelle, tandis que « le pays » risquerait de limiter le propos au territoire d’Israël.
- issue: Nature des צְבָאוֹת
  choice: armées
  alternative: puissances célestes
  rationale: Le terme peut évoquer des armées terrestres, célestes ou l’ensemble des puissances sous l’autorité divine. La traduction générale « armées » conserve cette amplitude sans la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conditionnelle est fluide sans reproduire artificiellement l’ordre hébreu. « Adorer » convient au contexte cultuel, tandis que la note conserve le geste concret de prosternation. Les deux appels de note [a] et [b] figurent dans le texte principal.
