source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא תִּֽהְיֶ֧ה מְהֽוּמַת יְהוָ֛ה רַבָּ֖ה בָּ/הֶ֑ם וְ/הֶחֱזִ֗יקוּ אִ֚ישׁ יַ֣ד רֵעֵ֔/הוּ וְ/עָלְתָ֥ה יָד֖/וֹ עַל יַ֥ד רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/013.yaml
  text: And on that day a great panic from Yahweh will be among them[a], and each man will seize the hand of his neighbor[b], and his hand will rise against the hand of his neighbor.
translation:
  language: fr
  text: En ce jour-là, il y aura parmi eux une grande panique venant de Yahvé[a]. Chacun saisira la main de son prochain, et sa main se lèvera contre la main de son prochain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande confusion » ou « un grand tumulte venant de Yahvé ». Le terme hébreu peut désigner une terreur chaotique envoyée par Yahvé.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « sa main se lèvera contre la main de son prochain » : image frappante de personnes qui se retournent violemment les unes contre les autres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוּמַת
  choice: panique
  rationale: Le nom désigne ici un état de terreur et de désordre, provoqué par Dieu. « Panique » est naturel en français moderne et convient au contexte de violence collective.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante rend distinctement le nom divin dans le texte hébreu.
- source_word: רַבָּה
  choice: grande
  rationale: L’adjectif intensifie la panique sans préciser davantage sa nature.
- source_word: בָּהֶם
  choice: parmi eux
  rationale: La préposition situe le désordre au sein du groupe, ce que confirme la violence réciproque décrite ensuite.
- source_word: וְהֶחֱזִיקוּ
  choice: saisira
  rationale: Le hifil de חזק exprime ici une prise ferme et énergique ; « saisir » conserve cette force.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif est rendu naturellement en français par « chacun », sans effacer la portée individuelle de l’hébreu.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: Le terme désigne l’autre membre du groupe, celui qui se trouve à ses côtés ; « prochain » conserve cette relation sans supposer l’amitié.
- source_word: וְעָלְתָה יָדוֹ עַל יַד רֵעֵהוּ
  choice: sa main se lèvera contre la main de son prochain
  rationale: La formulation conserve la répétition concrète de « main » et l’image saisissante d’une agression mutuelle.
theological_decisions:
- issue: Nature du désordre causé par Dieu
  choice: La panique vient de Yahvé et se répand au sein du groupe.
  alternative: Le syntagme peut aussi désigner plus largement une confusion ou un tumulte associé à l’intervention de Yahvé.
  rationale: מְהוּמַת יְהוָה présente naturellement le désordre comme venant de Yahvé. La suite montre qu’il aboutit à une violence interne, sans qu’il soit nécessaire d’expliciter davantage le mode de l’action divine.
- issue: Valeur distributive du masculin אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: « Chacun » exprime clairement la distribution individu par individu en français courant. Le contexte militaire ou collectif permet de comprendre les personnes visées sans alourdir la phrase.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « main » est volontairement conservée afin de préserver l’image concrète et l’ambiguïté expressive de l’hébreu.
