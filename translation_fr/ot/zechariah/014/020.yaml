  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ עַל מְצִלּ֣וֹת הַ/סּ֔וּס קֹ֖דֶשׁ לַֽ/יהוָ֑ה וְ/הָיָ֤ה הַ/סִּירוֹת֙ בְּ/בֵ֣ית יְהוָ֔ה כַּ/מִּזְרָקִ֖ים לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/020.yaml
  text: On that day[a], there will be on the bells of the horses[c][b], “Holy to Yahweh,” and the pots in the house of Yahweh will be like the bowls before the altar.
translation:
  language: fr
  text: 'En ce jour-là, il y aura sur les clochettes des chevaux[a] : « Sainteté au SEIGNEUR »[b]. Les marmites dans la maison du SEIGNEUR seront comme les coupes[c] devant l’autel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner de petites pièces métalliques tintant sur le harnachement des chevaux ; « clochettes » est le sens le plus probable.
    reason: Note culturelle et lexicale.
  - marker: b
    text: 'Ou : « Consacré au SEIGNEUR ». Littéralement : « Sainteté au SEIGNEUR ». La formule fait écho à l’inscription de la plaque d’or du grand prêtre en Exode 28.36.'
    reason: Alternative lexicale et écho intertextuel.
  - marker: c
    text: 'Ou : « bassins ». Il s’agit de récipients sacrés employés dans le service du temple.'
    reason: Alternative lexicale et note culturelle.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique temporelle naturelle en français, qui conserve la portée déictique et eschatologique de l’hébreu.
- source_word: עַל מְצִלּוֹת הַסּוּס
  choice: sur les clochettes des chevaux
  rationale: מְצִלּוֹת désigne vraisemblablement de petites pièces métalliques sonores fixées au harnachement. Le singulier הַסּוּס est compris collectivement.
- source_word: קֹדֶשׁ לַיהוָה
  choice: « Consacré au SEIGNEUR »
  rationale: Formulation brève et naturelle pour une inscription cultuelle, exprimant l’appartenance sacrée à YHWH et rappelant Exode 28.36. Une note conserve le rendu plus formel du substantif קֹדֶשׁ.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention révérencielle française, les petites capitales signalant qu’il s’agit du nom divin plutôt que du titre ordinaire « Seigneur ».
- source_word: הַסִּירוֹת
  choice: les marmites
  rationale: Le terme désigne des récipients servant notamment à cuire ou à faire bouillir; « marmites » est précis, courant et approprié au contexte du temple.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison du SEIGNEUR
  rationale: Conserve l’image hébraïque de la « maison » tout en laissant clairement entendre le temple dans ce contexte.
- source_word: כַּמִּזְרָקִים
  choice: comme les coupes
  rationale: מִזְרָקִים désigne des récipients cultuels employés devant l’autel; « coupes » est accessible, tandis que « bassins » reste possible.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: placées devant l’autel
  rationale: « Devant l’autel » rend directement l’expression spatiale; « placées » explicite seulement la relation syntaxique nécessaire à une phrase française fluide.
theological_decisions:
- issue: Extension de la sainteté cultuelle aux objets ordinaires
  choice: Le texte présente les accessoires des chevaux et les marmites du temple comme consacrés à YHWH au même titre que les récipients rituels de l’autel.
  alternative: Comprendre l’image comme une simple bénédiction générale, sans rapprochement précis entre objets ordinaires et objets cultuels.
  rationale: L’expression קֹדֶשׁ לַיהוָה et la comparaison explicite avec les coupes devant l’autel indiquent une extension concrète de la sainteté; la traduction garde cette tension sans l’expliquer dans le corps du verset.
- issue: Nature de la présence de la formule sur les clochettes
  choice: « cette inscription » indique que les mots figurent sur les clochettes.
  alternative: Employer seulement « il y aura sur les clochettes », en conservant strictement l’ellipse hébraïque.
  rationale: Le contexte et la formule citationnelle rendent l’idée d’une inscription très probable. L’ajout est adopté pour obtenir un français intelligible, sans préciser le procédé matériel de gravure ou d’écriture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une tournure française obscure. « SEIGNEUR » en petites capitales distingue le nom divin YHWH du titre courant.
