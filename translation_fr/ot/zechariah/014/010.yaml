source:
  edition: WLC
  text: יִסּ֨וֹב כָּל הָ/אָ֤רֶץ כָּ/עֲרָבָה֙ מִ/גֶּ֣בַע לְ/רִמּ֔וֹן נֶ֖גֶב יְרֽוּשָׁלִָ֑ם וְֽ/רָאֲמָה֩ וְ/יָשְׁבָ֨ה תַחְתֶּ֜י/הָ לְ/מִ/שַּׁ֣עַר בִּנְיָמִ֗ן עַד מְק֞וֹם שַׁ֤עַר הָֽ/רִאשׁוֹן֙ עַד שַׁ֣עַר הַ/פִּנִּ֔ים וּ/מִגְדַּ֣ל חֲנַנְאֵ֔ל עַ֖ד יִקְבֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/010.yaml
  text: All the land will be turned into a plain[a], from Geba to Rimmon south of Jerusalem. But Jerusalem will be raised up and will remain in its place, from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
translation:
  language: fr
  text: Tout le pays deviendra comme l’Araba[a], de Guéba à Rimmôn, au sud de Jérusalem. Mais Jérusalem sera élevée et restera à sa place, depuis la porte de Benjamin jusqu’à l’emplacement de la Première Porte, puis jusqu’à la porte de l’Angle, et depuis la tour de Hananel jusqu’aux pressoirs du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deviendra comme une plaine ». Le mot hébreu peut désigner l’Araba, vallée aride qui s’étend notamment au sud de la mer Morte, ou plus généralement une plaine aride.
    reason: Alternative lexicale et géographique de כָּעֲרָבָה.
lexical_decisions:
- source_word: יִסּוֹב כָּל הָאָרֶץ כָּעֲרָבָה
  choice: Tout le pays deviendra comme la Araba
  rationale: Le contexte délimité par Guéba, Rimmôn et les repères de Jérusalem favorise « pays » plutôt que « terre » au sens mondial. Le verbe exprime ici une transformation topographique. La comparaison marquée par כ est conservée, et « Araba » maintient la possible référence à la région géographique sans réduire le terme à une simple plaine.
- source_word: מִגֶּבַע לְרִמּוֹן נֶגֶב יְרוּשָׁלִָם
  choice: de Guéba à Rimmôn, au sud de Jérusalem
  rationale: Les toponymes indiquent l’étendue de la transformation. La ponctuation française rattache naturellement « au sud de Jérusalem » à Rimmôn.
- source_word: וְרָאֲמָה
  choice: sera élevée
  rationale: Le contexte oppose l’élévation de Jérusalem à l’aplanissement du pays environnant. Cette formulation rend clairement la valeur résultative du verbe.
- source_word: וְיָשְׁבָה תַחְתֶּיהָ
  choice: restera à sa place
  rationale: L’expression signifie que la ville demeurera établie à son emplacement. Cette traduction française est naturelle tout en gardant l’idée de stabilité.
- source_word: לְמִשַּׁעַר בִּנְיָמִן
  choice: depuis la porte de Benjamin
  rationale: Dans l’énumération des limites urbaines, la préposition introduit le point de départ du tracé.
- source_word: מְקוֹם שַׁעַר הָרִאשׁוֹן
  choice: l’emplacement de la Première Porte
  rationale: « Emplacement » préserve la nuance de מְקוֹם, qui peut signaler le site d’une porte qui n’existait plus.
- source_word: שַׁעַר הַפִּנִּים
  choice: la porte de l’Angle
  rationale: Le nom désigne une porte associée à l’angle ou au coin de l’enceinte; « porte de l’Angle » est clair et digne en français.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: la tour de Hananel
  rationale: Traduction directe du nom commun suivie de la translittération usuelle du nom propre.
- source_word: יִקְבֵי הַמֶּלֶךְ
  choice: les pressoirs du roi
  rationale: יֶקֶב désigne un pressoir ou une installation de pressurage; « pressoirs » est le terme français courant adapté au contexte.
theological_decisions:
- issue: Étendue de la transformation géographique
  choice: Une transformation du pays autour de Jérusalem
  alternative: La transformation de toute la terre au sens mondial
  rationale: Les limites géographiques précises données dans le verset favorisent une portée régionale. « Pays » évite d’imposer une lecture mondiale sans exclure la dimension eschatologique du passage.
- issue: Sens de כָּעֲרָבָה
  choice: Conserver la comparaison avec la Araba dans le texte
  alternative: Traduire le résultat par « deviendra une plaine »
  rationale: La préposition comparative et le sens potentiellement géographique de עֲרָבָה créent une ambiguïté réelle. La traduction principale la préserve, tandis que la note donne le sens générique possible.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. Les noms propres suivent des formes françaises usuelles. La structure des limites est légèrement explicitée par « puis » afin de rendre l’énumération naturelle, sans modifier son contenu.
