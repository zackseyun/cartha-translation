  text: וְ/יָ֣שְׁבוּ בָ֔/הּ וְ/חֵ֖רֶם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/יָשְׁבָ֥ה יְרוּשָׁלִַ֖ם לָ/בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/011.yaml
  text: And they will dwell in it[a], and there will no longer be anything devoted to destruction, and Jerusalem will dwell securely.
translation:
  language: fr
  text: Ils y habiteront[a] ; il n’y aura plus rien qui soit voué à la destruction, et Jérusalem habitera en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « On y habitera ».'
    reason: Le sujet du verbe pluriel n’est pas exprimé en hébreu ; il peut renvoyer à des personnes déjà évoquées ou être rendu de manière indéfinie.
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: Ils y habiteront
  rationale: Le verbe ישׁב exprime ici le fait d’habiter ou de demeurer. Le pronom « ils » respecte le sujet pluriel implicite sans préciser davantage l’identité des habitants, tandis que « y » reprend naturellement le lieu en français.
- source_word: חֵרֶם
  choice: rien voué à la destruction
  rationale: חֵרֶם peut désigner ce qui est frappé d’interdit et voué à la destruction. Cette formulation demeure compréhensible en français moderne et conserve la dimension de jugement portée par le terme.
- source_word: לֹא יִהְיֶה עוֹד
  choice: Il n’y aura plus
  rationale: Cette tournure rend naturellement la cessation future et définitive de la situation évoquée.
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם
  choice: et Jérusalem habitera
  rationale: Le verbe au féminin singulier a Jérusalem pour sujet. Garder la ville comme sujet préserve sa personnification ainsi que le parallèle avec le premier verbe du verset.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: La locution exprime un état de sûreté et d’absence de menace. « En sécurité » est naturel, clair et digne en français contemporain.
theological_decisions:
- issue: Sens de חֵרֶם dans le contexte de la restauration de Jérusalem
  choice: rien voué à la destruction
  alternative: plus aucune malédiction ; plus aucun interdit
  rationale: Le mot peut être compris comme une malédiction, un interdit ou ce qui est voué à la destruction. Le texte promet ici la fin d’un état de condamnation destructrice. La traduction retenue préserve cette portée sans réduire le terme à la notion plus générale de « malédiction ».
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La personnification de Jérusalem et le parallélisme verbal de l’hébreu sont conservés.
