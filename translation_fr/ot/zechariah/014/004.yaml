  text: וְ/עָמְד֣וּ רַגְלָ֣י/ו בַּ/יּוֹם הַ֠/הוּא עַל הַ֨ר הַ/זֵּתִ֜ים אֲשֶׁ֨ר עַל פְּנֵ֥י יְרוּשָׁלִַם֮ מִ/קֶּדֶם֒ וְ/נִבְקַע֩ הַ֨ר הַ/זֵּיתִ֤ים מֵֽ/חֶצְי/וֹ֙ מִזְרָ֣חָ/ה וָ/יָ֔מָּ/ה גֵּ֖יא גְּדוֹלָ֣ה מְאֹ֑ד וּ/מָ֨שׁ חֲצִ֥י הָ/הָ֛ר צָפ֖וֹנָ/ה וְ/חֶצְי/וֹ נֶֽגְבָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/004.yaml
  text: On that day his feet will stand on the Mount of Olives[a], which is before Jerusalem on the east; and the Mount of Olives will be split in two from east to west into a very great valley[b], with half of the mountain moving northward and half of it southward.
translation:
  language: fr
  text: Ce jour-là, ses pieds se tiendront sur le mont des Oliviers[a], qui est en face de Jérusalem, à l’est. Le mont des Oliviers se fendra depuis son milieu vers l’est et vers l’ouest, formant une très grande vallée[b] ; une moitié de la montagne se déplacera vers le nord, et l’autre moitié vers le sud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui est à l’est de Jérusalem ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « se fendra » ; l’hébreu décrit la montagne comme se divisant, ses deux moitiés s’écartant ensuite vers le nord et vers le sud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ רַגְלָיו
  choice: ses pieds se poseront
  rationale: Le concret de l’expression hébraïque est conservé. En français, « se poseront sur » exprime naturellement le fait de prendre position sur un lieu, sans réduire l’image à une simple présence.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Formule prophétique courante, rendue de façon naturelle et solennelle en français moderne.
- source_word: הַר הַזֵּתִים
  choice: le mont des Oliviers
  rationale: Nom géographique français consacré et fidèle à la construction hébraïque.
- source_word: אֲשֶׁר עַל פְּנֵי יְרוּשָׁלִַם מִקֶּדֶם
  choice: qui fait face à Jérusalem, à l’est
  rationale: « Fait face à » rend la position vis-à-vis de Jérusalem, tandis que « à l’est » préserve l’orientation donnée par מִקֶּדֶם.
- source_word: וְנִבְקַע
  choice: se fendra
  rationale: Le niphal de בקע décrit une ouverture ou une division par fendage. Le futur convient à la séquence prophétique.
- source_word: מֵחֶצְיוֹ מִזְרָחָה וָיָמָּה
  choice: par le milieu, d’est en ouest
  rationale: La traduction conserve explicitement מֵחֶצְיוֹ, « depuis son milieu », tout en formulant clairement en français l’axe est-ouest de la fente.
- source_word: גֵּיא גְּדוֹלָה מְאֹד
  choice: une très grande vallée
  rationale: Rendu direct de גֵּיא et de l’intensification גְּדוֹלָה מְאֹד, dans un français courant et digne.
- source_word: וּמָשׁ
  choice: se déplacera
  rationale: Le verbe indique que chaque moitié s’écarte ou se déplace. « Se déplacera » reste sobre et ne précise pas davantage le mécanisme.
- source_word: צָפוֹנָה / נֶגְבָּה
  choice: vers le nord / vers le sud
  rationale: Ces expressions rendent naturellement en français les formes directionnelles hébraïques.
theological_decisions:
- issue: Description anthropomorphique de la figure divine dans le contexte
  choice: Conserver « ses pieds se poseront »
  alternative: « sa présence reposera » ou « il apparaîtra »
  rationale: L’hébreu emploie une image corporelle concrète. La traduction la maintient sans en atténuer ni en expliquer les implications théologiques.
translation_notes:
  register: Français international moderne, lisible et digne. La ponctuation répartit la longue phrase hébraïque en deux phrases sans modifier sa progression. L’image corporelle et les indications géographiques sont conservées.
