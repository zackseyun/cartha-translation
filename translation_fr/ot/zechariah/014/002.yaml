  terminology: « Nations », « ville sera prise », « pillées », « violées », « exil » et « reste du peuple » sont appropriés. « Violées » rend correctement le ketiv cru תשגלנה sans euphémisme. La note textuelle doit distinguer précisément le ketiv et le qeré sans prétendre que ce dernier atténue nécessairement le sens.
