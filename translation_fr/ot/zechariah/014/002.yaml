  text: וְ/אָסַפְתִּ֨י אֶת כָּל הַ/גּוֹיִ֥ם אֶֽל יְרוּשָׁלִַם֮ לַ/מִּלְחָמָה֒ וְ/נִלְכְּדָ֣ה הָ/עִ֗יר וְ/נָשַׁ֨סּוּ֙ הַ/בָּ֣תִּ֔ים וְ/הַ/נָּשִׁ֖ים תשגלנה וְ/יָצָ֞א חֲצִ֤י הָ/עִיר֙ בַּ/גּוֹלָ֔ה וְ/יֶ֣תֶר הָ/עָ֔ם לֹ֥א יִכָּרֵ֖ת מִן הָ/עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/002.yaml
  text: And I will gather all the nations against Jerusalem for battle[a], and the city will be captured, and the houses plundered, and the women raped, and half of the city will go out into exile[b]; but the rest of the people will not be cut off from the city.
translation:
  language: fr
  text: Je rassemblerai toutes les nations contre Jérusalem pour l’attaquer. La ville sera prise, les maisons seront pillées et les femmes seront violées[a]. La moitié de la ville partira en exil, mais le reste du peuple ne sera pas supprimé de la ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte écrit hébreu emploie ici un terme cru désignant le viol. La lecture traditionnelle (qeré) porte « coucher avec », expression qui, dans ce contexte de conquête, désigne également une violence sexuelle.
    reason: textual_and_lexical_note
  - marker: b
    text: Ou « ne sera pas chassé de la ville ». Le verbe peut aussi avoir le sens plus fort de « ne sera pas exterminé ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָסַפְתִּי
  choice: Je rassemblerai
  rationale: Le parfait qal à la première personne, dans ce discours prophétique où Dieu parle, a une valeur future. « Rassembler » exprime clairement l’action divine.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici les nations dans un cadre international et militaire.
- source_word: אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: contre Jérusalem pour le combat
  rationale: Bien que אֶל signifie formellement « vers », le contexte militaire hostile appelle naturellement « contre » en français. « Pour le combat » conserve le sens de לַמִּלְחָמָה.
- source_word: וְנִלְכְּדָה הָעִיר
  choice: La ville sera prise
  rationale: Le nifal de לכד décrit la prise d’une ville lors d’une guerre. « Sera prise » est naturel et précis en français.
- source_word: וְנָשַׁסּוּ הַבָּתִּים
  choice: les maisons seront pillées
  rationale: Le verbe évoque le pillage violent lié à la conquête.
- source_word: וְהַנָּשִׁים תשגלנה
  choice: les femmes seront violées
  rationale: Le terme écrit est cru et désigne une agression sexuelle. « Violées » en rend directement le sens sans atténuer l’atrocité.
- source_word: וְיָצָא חֲצִי הָעִיר בַּגּוֹלָה
  choice: La moitié de la ville partira en exil
  rationale: בַּגּוֹלָה exprime l’exil ou la déportation. La formulation française garde l’image collective de la moitié de la ville qui part.
- source_word: וְיֶתֶר הָעָם
  choice: mais le reste du peuple
  rationale: יֶתֶר signifie « reste » ou « ce qui demeure ». « Reste » est idiomatique et évite les connotations théologiques que pourrait suggérer « reste fidèle » ou un emploi marqué de « résidu ».
- source_word: לֹא יִכָּרֵת מִן הָעִיר
  choice: ne sera pas retranché de la ville
  rationale: Le nifal de כרת peut évoquer le fait d’être retranché, supprimé ou détruit. Cette traduction conserve l’image et l’ambiguïté du texte hébreu.
theological_decisions:
- issue: Description de la violence sexuelle
  choice: Traduction explicite par « les femmes seront violées »
  alternative: « les femmes subiront des violences » ou, selon la lecture orale traditionnelle, une formulation plus indirecte
  rationale: Le texte consonantique emploie un terme brutal. Une traduction directe ne minimise pas l’atrocité de la conquête et n’ajoute aucune interprétation doctrinale.
- issue: Sens de לֹא יִכָּרֵת מִן הָעִיר
  choice: Le reste du peuple ne sera pas « retranché de la ville »
  alternative: Le reste du peuple ne sera pas exterminé, ou ne sera pas chassé de la ville
  rationale: L’expression peut viser soit la destruction, soit l’exclusion ou l’éloignement. Le texte principal maintient cette tension, et la note présente les principales possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. Les phrases sont légèrement segmentées pour la clarté, sans affaiblir l’enchaînement prophétique. La violence du texte est nommée directement, tandis que l’ambiguïté finale entre éloignement et destruction est conservée.
