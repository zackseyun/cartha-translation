source:
  edition: WLC
  text: וְ/יָצָ֣א יְהוָ֔ה וְ/נִלְחַ֖ם בַּ/גּוֹיִ֣ם הָ/הֵ֑ם כְּ/י֥וֹם הִֽלָּחֲמ֖/ו בְּ/י֥וֹם קְרָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/003.yaml
  text: Then Yahweh will go out and fight against those nations[a], as when he fights in a day of battle.
translation:
  language: fr
  text: Alors Yahweh sortira et combattra ces nations, comme il combat au jour de la bataille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme au jour où il combattit, au jour de la bataille ». L’infinitif hébreu ne précise pas à lui seul le temps de « combattre » et répète le mot « jour ».'
    reason: ambiguïté grammaticale et variante plus formelle
lexical_decisions:
- source_word: וְיָצָא
  choice: Alors … sortira
  rationale: Dans cette séquence prophétique, la forme verbale présente une action future qui fait suite au contexte précédent. « Alors » exprime naturellement cette progression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, au lieu de le remplacer par un titre.
- source_word: וְנִלְחַם
  choice: et combattra
  rationale: Le niphal de לחם signifie ici prendre part au combat. « Combattra » est direct, naturel et adapté au contexte guerrier.
- source_word: בַּגּוֹיִם הָהֵם
  choice: ces nations
  rationale: Avec לחם, la préposition ב marque l’adversaire. En français, le verbe « combattre » peut prendre directement cet objet; הָהֵם est rendu par le démonstratif « ces ».
- source_word: כְּיוֹם הִלָּחֲמוֹ
  choice: comme lorsqu’il combat
  rationale: Cette formulation rend naturellement la comparaison introduite par כ et l’infinitif construit muni du suffixe, sans imposer un antécédent historique déterminé.
- source_word: בְּיוֹם קְרָב
  choice: au jour de la bataille
  rationale: La tournure garde l’image hébraïque du « jour de bataille » dans un registre prophétique digne et intelligible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte nomme personnellement YHWH comme celui qui intervient. « Yahweh » préserve ce nom sans ajouter d’interprétation théologique.
- issue: Valeur temporelle de הִלָּחֲמוֹ dans la comparaison
  choice: lorsqu’il combat
  alternative: au jour où il combattit
  rationale: L’infinitif hébreu ne marque pas à lui seul le temps. Le présent français permet une comparaison caractéristique, tandis qu’une lecture renvoyant à un combat passé demeure possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition hébraïque de « jour » est allégée dans le texte principal, mais conservée dans la variante en note.
