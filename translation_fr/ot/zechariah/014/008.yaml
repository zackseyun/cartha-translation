source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֤וּ מַֽיִם חַיִּים֙ מִ/יר֣וּשָׁלִַ֔ם חֶצְיָ֗/ם אֶל הַ/יָּם֙ הַ/קַּדְמוֹנִ֔י וְ/חֶצְיָ֖/ם אֶל הַ/יָּ֣ם הָ/אַחֲר֑וֹן בַּ/קַּ֥יִץ וּ/בָ/חֹ֖רֶף יִֽהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/008.yaml
  text: And on that day living waters will flow out from Jerusalem[a], half of them to the eastern sea and half of them to the western sea[c][b]; it will be so in summer as well as in winter.
translation:
  language: fr
  text: 'En ce jour-là, des eaux vives sortiront de Jérusalem[a] : la moitié coulera vers la mer orientale[b], et l’autre moitié vers la mer occidentale[c]. Il en sera ainsi en été comme en hiver.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des eaux courantes » ou « des eaux vivifiantes ». L’hébreu dit littéralement « des eaux vives ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire la mer située à l’est de Jérusalem, traditionnellement identifiée à la mer Morte.
    reason: cultural_note
  - marker: c
    text: C’est-à-dire la mer située à l’ouest de Jérusalem, traditionnellement identifiée à la mer Méditerranée.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette formulation naturelle en français conserve la formule temporelle prophétique et sa portée future, sans reproduire lourdement l’hébreu « et il arrivera ».
- source_word: יֵצְאוּ
  choice: sortiront / coulera
  rationale: « Sortiront » rend directement le verbe hébreu dans la proposition principale. « Coulera » dans les deux branches explicite naturellement en français le mouvement des eaux vers les deux mers.
- source_word: מַיִם חַיִּים
  choice: des eaux vives
  rationale: L’expression française biblique « eaux vives » préserve l’image hébraïque, qui peut désigner une eau courante, fraîche ou vivifiante, ainsi que sa possible résonance théologique.
- source_word: מִירוּשָׁלַם
  choice: de Jérusalem
  rationale: Rend simplement l’origine indiquée par la préposition hébraïque.
- source_word: חֶצְיָם ... וְחֶצְיָם
  choice: la moitié ... et l’autre moitié
  rationale: Le suffixe renvoie aux eaux. La tournure française exprime clairement leur répartition en deux directions.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: la mer orientale
  rationale: Conserve la désignation directionnelle du texte sans imposer dans le corps du verset l’identification traditionnelle à la mer Morte.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: la mer occidentale
  rationale: Dans l’opposition géographique avec la mer orientale, l’expression désigne la mer située à l’ouest, traditionnellement identifiée à la Méditerranée.
- source_word: בַּקַּיִץ וּבָחֹרֶף יִהְיֶה
  choice: Il en sera ainsi en été comme en hiver
  rationale: Cette formulation idiomatique conserve le singulier hébreu et fait ressortir la continuité du phénomène tout au long de l’année.
theological_decisions:
- issue: Résonance possible de מַיִם חַיִּים (« eaux vives »)
  choice: Conserver « eaux vives » dans le texte principal sans réduire l’expression à un sens uniquement physique ou uniquement symbolique.
  alternative: Traduire « eau courante », « eau fraîche » ou expliciter une eau spirituellement vivifiante.
  rationale: L’expression hébraïque désigne naturellement une eau vive ou courante, mais son contexte prophétique peut aussi porter une résonance théologique. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La structure prophétique demeure perceptible, tandis que la répartition des eaux est formulée avec fluidité. Les identifications géographiques traditionnelles sont réservées aux notes afin de ne pas surinterpréter le texte principal.
