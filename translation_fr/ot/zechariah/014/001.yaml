  source_fidelity: La tournure « un jour vient pour le SEIGNEUR » rend correctement le participe à valeur future et la relation exprimée par לַיהוָה, sans imposer « jour du SEIGNEUR ». En revanche, « le butin pris chez toi » ajoute l’idée que le butin a été pris à Jérusalem. Le suffixe de שְׁלָלֵךְ signifie simplement « ton butin » et ne précise pas, à lui seul, ce rapport de provenance.
  naturalness: Le français est globalement naturel et conserve un registre prophétique sobre. « Ton butin » est à la fois plus direct, plus idiomatique et plus proche de l’ambiguïté du texte source que « le butin pris chez toi ».
  terminology: « SEIGNEUR » convient pour יהוה dans le système fourni. « Voici » et « au milieu de toi » conservent le ton d’annonce et la localisation interne. La note préserve adéquatement la lecture traditionnelle « un jour du SEIGNEUR ».
