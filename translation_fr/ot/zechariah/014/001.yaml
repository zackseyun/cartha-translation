  text: הִנֵּ֥ה יֽוֹם בָּ֖א לַֽ/יהוָ֑ה וְ/חֻלַּ֥ק שְׁלָלֵ֖/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/001.yaml
  text: Behold[a], a day is coming for Yahweh, when your plunder will be divided in your midst.
translation:
  language: fr
  text: Voici qu’un jour vient pour le SEIGNEUR[a], et ton butin sera partagé au milieu de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Voici que vient un jour du SEIGNEUR. » Littéralement, l’hébreu dit : « un jour vient pour le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marqueur solennel qui attire l’attention et convient au registre prophétique en français moderne.
- source_word: יוֹם בָּא
  choice: un jour vient
  rationale: L’indéfini respecte l’absence d’article, et le présent rend naturellement la valeur future et imminente du participe hébreu.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: La préposition ל est rendue au plus près sans la réduire d’emblée à la formule traditionnelle « jour du SEIGNEUR ».
- source_word: וְחֻלַּק
  choice: sera partagé
  rationale: Le futur passif restitue le poual dans ce contexte prophétique; « partagé » exprime la répartition du butin.
- source_word: שְׁלָלֵךְ
  choice: le butin pris chez toi
  rationale: Le suffixe féminin singulier désigne Jérusalem; cette formulation évite l’ambiguïté française de « ton butin », qui pourrait suggérer un butin possédé ou pris par la ville.
- source_word: בְּקִרְבֵּךְ
  choice: au milieu de toi
  rationale: Expression locative proche de l’hébreu, qui situe le partage à l’intérieur même de Jérusalem.
theological_decisions:
- issue: Rapport de לַיהוָה avec la formule prophétique du « jour »
  choice: pour le SEIGNEUR
  alternative: un jour du SEIGNEUR
  rationale: L’hébreu emploie la préposition ל plutôt qu’une construction génitivale explicite. Le texte principal conserve cette nuance, tandis que la formulation traditionnelle figure en note.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « SEIGNEUR » représente le nom divin יהוה. L’adresse féminine singulière implicite vise Jérusalem; la tournure « pris chez toi » la rend compréhensible sans l’alourdir.
