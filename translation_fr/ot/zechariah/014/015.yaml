source:
  edition: WLC
  text: וְ/כֵ֨ן תִּֽהְיֶ֜ה מַגֵּפַ֣ת הַ/סּ֗וּס הַ/פֶּ֨רֶד֙ הַ/גָּמָ֣ל וְ/הַ/חֲמ֔וֹר וְ/כָ֨ל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/מַּחֲנ֣וֹת הָ/הֵ֑מָּה כַּ/מַּגֵּפָ֖ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/015.yaml
  text: And so the plague will be on the horse[a], the mule, the camel, the donkey, and every animal that is in those camps—the same plague as this.
translation:
  language: fr
  text: Un fléau semblable à celui-ci s’abattra aussi sur les chevaux, les mulets, les chameaux, les ânes et tous les animaux qui se trouveront dans ces camps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֵן
  choice: aussi
  rationale: Marque la correspondance avec le jugement décrit au verset précédent. Placé avec le verbe, « aussi » est naturel en français et conserve le lien logique.
- source_word: תִּהְיֶה מַגֵּפַת
  choice: un fléau … s’abattra
  rationale: מַגֵּפָה désigne ici un fléau, une atteinte destructrice envoyée en jugement. La tournure idiomatique « s’abattra sur » exprime naturellement en français le fait que ce fléau touchera les animaux, sans en préciser davantage le mécanisme.
- source_word: הַסּוּס הַפֶּרֶד הַגָּמָל וְהַחֲמוֹר
  choice: les chevaux, les mulets, les chameaux, les ânes
  rationale: Les noms singuliers hébreux ont une valeur collective dans cette énumération. Le pluriel est plus naturel en français moderne.
- source_word: וְכָל הַבְּהֵמָה
  choice: et tous les animaux
  rationale: בְּהֵמָה englobe ici les autres bêtes présentes dans les camps. « Animaux » conserve cette portée large, tandis que « bétail » pourrait être trop restrictif.
- source_word: אֲשֶׁר יִהְיֶה בַּמַּחֲנוֹת הָהֵמָּה
  choice: qui se trouveront dans ces camps
  rationale: La proposition situe les animaux dans les campements hostiles. « Se trouveront » garde le cadre futur et « camps » rend directement מַחֲנוֹת sans l’interpréter comme « armées ».
- source_word: כַּמַּגֵּפָה הַזֹּאת
  choice: semblable à celui-ci
  rationale: La préposition כְּ exprime une comparaison avec le fléau qui vient d’être décrit. Cette formulation française rattache clairement le jugement des animaux au jugement précédent sans imposer une identité de détail au-delà de la comparaison hébraïque.
theological_decisions:
- issue: Nature du jugement qui atteint les animaux des camps ennemis
  choice: Présenter un fléau réel qui s’abat aussi sur les animaux
  alternative: Employer un terme plus général comme « malheur » ou comprendre l’énoncé de manière purement figurée
  rationale: La répétition de מַגֵּפָה et le contexte immédiat décrivent un jugement concret. Le texte étend ce jugement aux animaux associés aux camps hostiles, tout en comparant leur sort au fléau déjà annoncé.
translation_notes:
  register: Français moderne, courant et digne. La phrase est légèrement restructurée pour éviter la lourdeur de « la plaie des chevaux » et rendre explicitement la relation grammaticale implicite en hébreu. Aucun vocabulaire confessionnel particulier n’est introduit.
