reference: Zechariah 14:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֥את תִּהְיֶ֖ה חַטַּ֣את מִצְרָ֑יִם וְ/חַטַּאת֙ כָּל הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/019.yaml
  text: This will be the punishment of Egypt[b][a], and the punishment of all the nations that do not go up to celebrate the Festival of Booths.
translation:
  language: fr
  text: Tel sera le châtiment[a] de l’Égypte et le châtiment de toutes les nations qui ne monteront pas pour célébrer la fête des Cabanes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peine ». Le mot hébreu peut aussi signifier « péché » dans d’autres contextes, mais il désigne ici le jugement encouru.
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement appelée « fête des Tabernacles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Tel sera
  rationale: Le démonstratif féminin et le verbe à l’inaccompli renvoient à la conséquence annoncée juste avant. « Tel sera » exprime naturellement ce bilan prospectif en français.
- source_word: חַטַּאת
  choice: châtiment
  rationale: Bien que le nom désigne souvent le péché ou, selon le contexte, un sacrifice pour le péché, il désigne ici la conséquence judiciaire encourue par le refus de monter à la fête.
- source_word: מִצְרָיִם
  choice: l’Égypte
  rationale: Forme française usuelle du nom de pays.
- source_word: וְחַטַּאת כָּל הַגּוֹיִם
  choice: ainsi que celui de toutes les nations
  rationale: Le pronom « celui » reprend « châtiment » sans lourdeur, tandis que « toutes les nations » rend directement l’expression hébraïque.
- source_word: אֲשֶׁר לֹא יַעֲלוּ
  choice: qui ne monteront pas
  rationale: Le futur convient au cadre prospectif et « monter » conserve l’expression du pèlerinage vers Jérusalem.
- source_word: לָחֹג
  choice: pour célébrer
  rationale: L’infinitif de חגג indique la célébration d’une fête de pèlerinage.
- source_word: אֶת חַג הַסֻּכּוֹת
  choice: la fête des Cabanes
  rationale: « Cabanes » rend de manière concrète et intelligible les abris temporaires désignés par סֻכּוֹת; le titre traditionnel est signalé en note.
theological_decisions:
- issue: Sens de חַטַּאת dans ce contexte de jugement
  choice: châtiment
  alternative: péché; peine
  rationale: Le verset récapitule la conséquence imposée à l’Égypte et aux autres nations qui refusent le pèlerinage. « Châtiment » communique cette valeur contextuelle sans introduire ici un sens sacrificiel.
- issue: Désignation de חַג הַסֻּכּוֹת
  choice: fête des Cabanes
  alternative: fête des Huttes; fête des Tabernacles
  rationale: La traduction retenue garde l’image hébraïque tout en restant immédiatement compréhensible; la forme ecclésiastique traditionnelle est conservée en note.
translation_notes:
  register: Français international actuel, clair et digne. La tournure « Tel sera » conserve le caractère récapitulatif du verset; « monter » maintient l’idiome biblique du pèlerinage à Jérusalem.
