  text: וְ/אִם מִשְׁפַּ֨חַת מִצְרַ֧יִם לֹֽא תַעֲלֶ֛ה וְ/לֹ֥א בָאָ֖ה וְ/לֹ֣א עֲלֵי/הֶ֑ם תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/018.yaml
  text: And if the family of Egypt does not go up and does not come[c][b][a], then the plague will not be upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the Feast of Booths.
translation:
  language: fr
  text: Si la famille d’Égypte ne monte pas et ne vient pas[a], le fléau ne sera pas sur elle[b] — le fléau dont Yahweh frappera les nations qui ne monteront pas pour célébrer la fête des Cabanes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie à la fois « monter » et « venir », ce qui renforce probablement l’idée du pèlerinage à Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte hébreu porte littéralement : « le fléau ne sera pas sur eux — le fléau dont Yahweh frappera les nations ». Cette formulation est difficile dans le contexte, puisque le verset précédent parle de l’absence de pluie. Beaucoup comprennent que l’Égypte, moins dépendante des pluies, recevrait plutôt un fléau ; d’autres comprennent ici une allusion elliptique à l’absence de pluie. Le texte principal conserve la formulation du texte hébreu.'
    reason: alternative_reading
  - marker: c
    text: 'Appellation traditionnelle : « fête des Tabernacles » ; aussi appelée « fête des Tentes » ou Souccot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת מִצְרַיִם
  choice: la famille d’Égypte
  rationale: Conserve l’expression collective singulière de l’hébreu, où מִשְׁפָּחָה désigne une famille, un clan ou un groupe apparenté.
- source_word: תַעֲלֶה
  choice: monte
  rationale: עלה est le verbe habituel pour la montée vers Jérusalem et convient au contexte d’un pèlerinage.
- source_word: וְלֹא בָאָה
  choice: et ne vient pas
  rationale: Maintient les deux verbes distincts de l’hébreu, « monter » et « venir », sans réduire la formulation à une seule action.
- source_word: וְלֹא עֲלֵיהֶם
  choice: et que [la pluie] ne tombe pas sur elle
  rationale: 'La proposition est elliptique : elle signifie littéralement « et pas sur eux ». Le complément « la pluie » est repris du verset précédent et signalé par des crochets plutôt que présenté comme explicitement exprimé ici.'
- source_word: הַמַּגֵּפָה
  choice: le fléau
  rationale: מַגֵּפָה désigne une calamité qui frappe. « Fléau » garde le lien avec le verbe נָגַף et convient mieux que « épidémie », trop spécifique.
- source_word: יִגֹּף
  choice: frappera
  rationale: נָגַף signifie frapper ou infliger un coup destructeur; « frappera » conserve ce rapport lexical avec le fléau.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce contexte prophétique, גּוֹיִם désigne les nations en général.
- source_word: לָחֹג
  choice: célébrer
  rationale: Le verbe חגג exprime l’observance joyeuse d’une fête de pèlerinage; « célébrer » est naturel en français actuel.
- source_word: חַג הַסֻּכּוֹת
  choice: la fête des Cabanes
  rationale: « Cabanes » rend concrètement סֻכּוֹת et correspond à une appellation française courante de cette fête, tandis que l’appellation traditionnelle est indiquée en note.
theological_decisions:
- issue: Ellipse et difficulté textuelle après la mention de l’Égypte
  choice: Comprendre « et pas sur eux » comme une reprise elliptique de la pluie mentionnée au verset 17, tout en signalant l’ajout et l’ambiguïté
  alternative: 'Rattacher la négation au fléau : « le fléau ne sera pas sur eux », lecture qui rend toutefois la suite hébraïque particulièrement difficile'
  rationale: Le texte massorétique place une pause majeure après « et pas sur eux », puis commence « il y aura le fléau ». La reprise elliptique de la pluie explique la syntaxe et maintient ensuite la mention explicite du fléau, sans corriger le texte hébreu ni masquer sa difficulté.
- issue: Traduction de יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin יהוה; « Yahweh » le représente comme nom propre au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide malgré l’ellipse hébraïque; les crochets et la note rendent visible l’élément suppléé. Le collectif « famille d’Égypte » est repris au singulier en français pour éviter une discordance grammaticale.
