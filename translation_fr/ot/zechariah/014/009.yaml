id: ZEC.14.9
reference: Zechariah 14:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֧ה יְהוָ֛ה לְ/מֶ֖לֶךְ עַל כָּל הָ/אָ֑רֶץ בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֧ה יְהוָ֛ה אֶחָ֖ד וּ/שְׁמ֥/וֹ אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/009.yaml
  text: And Yahweh will be king over all the earth[a]. On that day Yahweh will be one[b], and his name one.
translation:
  language: fr
  text: Yahweh sera roi de toute la terre. En ce jour-là, Yahweh sera un[a], et son nom sera un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh sera le seul » ou « Yahweh sera unique ». Le mot hébreu signifie littéralement « un » et peut aussi exprimer l’exclusivité ou l’unicité.
    reason: lexical_alternative
  - marker: b
    text: Ou « son nom sera le seul » ou « son nom sera unique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction a une valeur future. « Sera » l’exprime naturellement en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu, plutôt que de lui substituer un titre.
- source_word: לְמֶלֶךְ
  choice: roi
  rationale: 'La préposition לְ marque ici la fonction ou le statut : Yahweh sera roi.'
- source_word: עַל כָּל הָאָרֶץ
  choice: de toute la terre
  rationale: Avec « roi », le français exprime naturellement la souveraineté par « roi de ». Dans ce contexte, הָאָרֶץ désigne la terre entière plutôt qu’un territoire particulier.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette formulation française naturelle conserve la formule temporelle caractéristique du discours prophétique.
- source_word: יִהְיֶה יְהוָה אֶחָד
  choice: Yahweh sera un
  rationale: « Un » rend directement אֶחָד et préserve la formulation dense ainsi que son ouverture possible à l’unité, à l’unicité ou à l’exclusivité.
- source_word: וּשְׁמוֹ אֶחָד
  choice: et son nom sera un
  rationale: La répétition de « un » maintient le parallélisme hébreu. L’ajout de « sera », implicite dans la proposition nominale, donne une phrase claire en français sans en préciser davantage le sens.
theological_decisions:
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme יהוה. « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Sens de אֶחָד appliqué à Yahweh
  choice: Conserver « un » dans le texte principal
  alternative: Yahweh sera le seul ; Yahweh sera unique
  rationale: L’hébreu est concis et peut évoquer l’unité, l’unicité ou l’exclusivité. Le texte principal ne tranche pas cette tension théologique.
- issue: Sens de אֶחָד appliqué au nom de Yahweh
  choice: Conserver « un » dans le texte principal
  alternative: son nom sera le seul ; son nom sera unique
  rationale: La répétition du même mot hébreu invite à préserver le parallélisme, sans réduire d’avance sa portée à une seule interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la formulation hébraïque, notamment par la répétition de « un », tandis que « sera » est repris dans la dernière proposition pour assurer une lecture naturelle.
