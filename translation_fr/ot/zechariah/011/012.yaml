source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֲלֵי/הֶ֗ם אִם ט֧וֹב בְּ/עֵינֵי/כֶ֛ם הָב֥וּ שְׂכָרִ֖/י וְ/אִם לֹ֣א חֲדָ֑לוּ וַ/יִּשְׁקְל֥וּ אֶת שְׂכָרִ֖/י שְׁלֹשִׁ֥ים כָּֽסֶף־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/012.yaml
  text: 'Then I said to them[a], “If it is good in your eyes, give me my wages; but if not, refrain.” So they weighed out my wages: thirty pieces of silver.'
translation:
  language: fr
  text: 'Puis je leur dis : « Si cela vous paraît bon, donnez-moi mon salaire ; sinon, abstenez-vous. » Alors ils pesèrent mon salaire : trente pièces d’argent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trente d’argent » ; peut-être « trente sicles d’argent ».'
    reason: 'Précision lexicale : l’unité monétaire n’est pas exprimée dans l’hébreu.'
lexical_decisions:
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: Puis je leur dis
  rationale: Le waw consécutif fait progresser le récit. « Puis » marque naturellement la succession, tandis que « je leur dis » rend directement le verbe et ses destinataires.
- source_word: אִם טוֹב בְּעֵינֵיכֶם
  choice: Si cela vous paraît bon
  rationale: Cette formulation française naturelle restitue l’idiome hébreu « si [cela est] bon à vos yeux » sans en obscurcir le sens.
- source_word: הָבוּ שְׂכָרִי
  choice: donnez-moi mon salaire
  rationale: « Donnez » traduit l’impératif הָבוּ, et « mon salaire » exprime la rémunération due pour le service accompli.
- source_word: וְאִם לֹא חֲדָלוּ
  choice: sinon, abstenez-vous
  rationale: Le verbe חדל signifie cesser ou s’abstenir. Ici, l’ordre porte implicitement sur le versement du salaire ; cette traduction conserve cette ellipse sans ajouter d’objet.
- source_word: וַיִּשְׁקְלוּ
  choice: ils pesèrent
  rationale: Le verbe שקל désigne concrètement l’action de peser le métal servant au paiement, pratique ancienne que la traduction conserve.
- source_word: שְׁלֹשִׁים כָּסֶף
  choice: trente pièces d’argent
  rationale: L’hébreu dit littéralement « trente argent », sans nommer explicitement l’unité. « Pièces d’argent » fournit en français le nom nécessaire tout en évitant de préciser indûment « sicles » dans le texte principal.
theological_decisions:
- issue: Unité monétaire du paiement
  choice: trente pièces d’argent
  alternative: trente sicles d’argent
  rationale: Le passage est repris en Matthieu 26.15 et 27.9-10, mais la formulation hébraïque de Zacharie ne donne pas explicitement l’unité. Le texte principal conserve donc l’expression générale, et la note signale l’interprétation possible sans harmonisation forcée.
translation_notes:
  register: Français international actuel, clair et digne. La tournure idiomatique « vous paraît bon » évite un calque peu naturel de « bon à vos yeux ». « Abstenez-vous » conserve l’ellipse et le ton ferme de l’impératif. Le marqueur de note est placé après l’expression qu’il explique.
