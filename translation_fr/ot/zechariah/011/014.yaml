source:
  edition: WLC
  text: וָֽ/אֶגְדַּע֙ אֶת מַקְלִ֣/י הַ/שֵּׁנִ֔י אֵ֖ת הַ/חֹֽבְלִ֑ים לְ/הָפֵר֙ אֶת הָֽ/אַחֲוָ֔ה בֵּ֥ין יְהוּדָ֖ה וּ/בֵ֥ין יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/014.yaml
  text: Then I cut in pieces my second staff[a], Union, to break the brotherhood between Judah and Israel.
translation:
  language: fr
  text: Puis je mis en pièces mon second bâton, « Liens »[a], afin de rompre la fraternité entre Juda et Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Attaches » ou « Union » ; le nom hébreu du second bâton évoque ce qui lie des éléments ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶגְדַּע
  choice: Puis je mis en pièces
  rationale: Le verbe גדע évoque l’action de couper ou de retrancher. Dans ce geste symbolique appliqué à un bâton, « mis en pièces » conserve l’idée d’une rupture physique délibérée sans la réduire au simple verbe « casser ».
- source_word: מַקְלִי הַשֵּׁנִי
  choice: mon second bâton
  rationale: מַקֵּל désigne un bâton ou une baguette, et הַשֵּׁנִי signifie naturellement « le second » dans la séquence des deux bâtons du contexte.
- source_word: הַחֹבְלִים
  choice: « Liens »
  rationale: Le terme sert ici de nom symbolique au second bâton. « Liens » garde l’image de ce qui attache et unit, tout en convenant à la fraternité entre Juda et Israël mentionnée ensuite.
- source_word: לְהָפֵר
  choice: afin de rompre
  rationale: הפר peut signifier rompre, annuler ou rendre sans effet. « Rompre » convient à la relation fraternelle visée et fait écho au geste accompli sur le bâton.
- source_word: הָאַחֲוָה
  choice: la fraternité
  rationale: אַחֲוָה exprime une relation ou solidarité fraternelle. « Fraternité » préserve en français la métaphore familiale et sa dimension collective et politique.
- source_word: בֵּין יְהוּדָה וּבֵין יִשְׂרָאֵל
  choice: entre Juda et Israël
  rationale: Cette formulation directe maintient sans ajout interprétatif la distinction historique et politique exprimée dans l’hébreu.
theological_decisions:
- issue: Traduction du nom symbolique הַחֹבְלִים
  choice: « Liens »
  alternative: « Union » ou « Attaches »
  rationale: « Liens » reste proche de l’image hébraïque de choses qui attachent ensemble et laisse le contexte expliciter la fonction symbolique du bâton, sans réduire le nom à une interprétation abstraite.
- issue: Traduction de אַחֲוָה
  choice: la fraternité
  alternative: l’unité ou les liens fraternels
  rationale: « Fraternité » conserve la métaphore explicitement familiale du texte et la tension entre parenté commune et division politique, plutôt que de l’aplanir en simple « unité ».
translation_notes:
  register: Français international moderne, sobre et digne. Les guillemets signalent clairement que « Liens » est le nom symbolique du bâton. « Puis » marque la progression narrative, et « afin de » rend explicitement la finalité exprimée par l’infinitif hébreu.
