  text: אֲשֶׁ֨ר קֹנֵי/הֶ֤ן יַֽהֲרְגֻ/ן֙ וְ/לֹ֣א יֶאְשָׁ֔מוּ וּ/מֹכְרֵי/הֶ֣ן יֹאמַ֔ר בָּר֥וּךְ יְהוָ֖ה וַ/אעְשִׁ֑ר וְ/רֹ֣עֵי/הֶ֔ם לֹ֥א יַחְמ֖וֹל עֲלֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/005.yaml
  text: whose buyers slaughter them and are not held guilty[a], and whose sellers say, “Blessed be Yahweh[b], for I have become rich,” and their shepherds have no compassion on them.
translation:
  language: fr
  text: 'dont les acheteurs les égorgent sans être tenus pour coupables[a], et ceux qui les vendent disent : « Béni soit Yahweh, car je me suis enrichi ! » Leurs bergers n’ont aucune compassion pour elles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans se rendre coupables »; le verbe peut aussi évoquer le fait de ne subir aucune conséquence pour sa faute.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne les épargnent pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: dont
  rationale: Le relatif renvoie au troupeau du contexte précédent et introduit les rapports de possession exprimés par « les acheteurs » et « ceux qui les vendent ».
- source_word: קֹנֵיהֶן
  choice: les acheteurs
  rationale: Le participe de קנה désigne ici ceux qui achètent les brebis; ce choix maintient l’image d’une exploitation commerciale, en parallèle avec les vendeurs.
- source_word: יַהֲרְגֻן
  choice: les égorgent
  rationale: Le verbe signifie « tuer ». Dans l’image d’un troupeau destiné à l’abattage, « égorger » rend naturellement la mise à mort brutale sans ajouter une interprétation étrangère au contexte.
- source_word: וְלֹא יֶאְשָׁמוּ
  choice: sans être tenus pour coupables
  rationale: אשם peut exprimer le fait de devenir coupable ou d’être reconnu coupable. La formulation française conserve ici l’idée d’absence d’imputation de culpabilité, tout en signalant l’autre lecture en note.
- source_word: וּמֹכְרֵיהֶן יֹאמַר
  choice: tandis que ceux qui les vendent disent
  rationale: Cette formulation rend le contraste et le participe « vendeurs ». Le verbe hébreu est formellement au singulier, probablement distributif ou collectif; le pluriel français est naturel, et la citation au singulier conserve la parole typique de chacun.
- source_word: בָּרוּךְ יְהוָה
  choice: Béni soit Yahweh
  rationale: La formule française garde la forme exclamative de bénédiction et transcrit directement le nom divin.
- source_word: וָאֶעְשִׁר
  choice: car je me suis enrichi
  rationale: Le hifil de עשר exprime ici l’accès à la richesse. Le passé composé restitue le résultat dont le vendeur se félicite.
- source_word: וְרֹעֵיהֶם
  choice: Leurs bergers
  rationale: « Bergers » préserve la métaphore prophétique des responsables du troupeau, sans l’interpréter comme un office ecclésial ultérieur.
- source_word: לֹא יַחְמֹל עֲלֵיהֶן
  choice: n’ont aucune compassion pour elles
  rationale: חמל peut signifier éprouver de la pitié ou épargner. Le texte principal exprime le défaut de compassion; l’autre nuance est conservée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé / le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Métaphore des רֹעִים
  choice: bergers
  alternative: dirigeants / pasteurs
  rationale: Le maintien de l’image du berger respecte le langage prophétique et évite d’imposer une identification institutionnelle ou ecclésiale.
- issue: Culpabilité exprimée par אשם
  choice: être tenus pour coupables
  alternative: se rendre coupables / rester impunis
  rationale: La formulation principale préserve la dimension judiciaire possible du verbe sans réduire le propos à la seule sanction; la note maintient l’ambiguïté entre culpabilité encourue et culpabilité imputée.
translation_notes:
  register: Français international moderne, clair et digne. « Égorgent » convient à l’image du troupeau tout en exprimant la violence. La construction au pluriel est idiomatique en français; le « je » de la citation représente la déclaration de chaque vendeur. Les marqueurs de note sont placés immédiatement après les expressions concernées.
