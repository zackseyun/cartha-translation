    rationale: Ici, עוֹד indique que Zacharie doit accomplir une nouvelle action symbolique. En français, « prends encore » peut suggérer une quantité supplémentaire; « prends de nouveau » rend plus précisément la répétition.
  - severity: low
    issue: Alternatives de la note formulées au pluriel
    rationale: La note actuelle propose « les objets » et « les instruments », alors que כְּלִי est formellement singulier, même s’il peut avoir une valeur collective. Des alternatives au singulier ou une explicitation de cette valeur sont plus exactes.
