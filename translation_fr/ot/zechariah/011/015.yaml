  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י ע֣וֹד קַח לְ/ךָ֔ כְּלִ֖י רֹעֶ֥ה אֱוִלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/015.yaml
  text: Then Yahweh said to me[a], “Take again for yourself the equipment of a foolish shepherd.”
translation:
  language: fr
  text: 'Alors Yahweh me dit : « Prends de nouveau pour toi l’équipement[a] d’un berger insensé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet », « un instrument » ou « du matériel ». Le terme hébreu est large et peut désigner un article ou, collectivement, l’équipement associé à un berger.
    reason: Alternative lexicale
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Dans la tournure française « me dit », le pronom indirect rend naturellement la préposition suivie du suffixe de première personne.
- source_word: עוֹד
  choice: encore
  rationale: Dans ce commandement, le terme indique une action supplémentaire ou répétée, ici une nouvelle action symbolique.
- source_word: קַח לְךָ
  choice: Prends … pour toi
  rationale: « Prends » rend l’impératif, tandis que « pour toi » conserve la nuance personnelle du datif לְךָ sans l’effacer.
- source_word: כְּלִי
  choice: équipement
  rationale: 'Le nom a un sens large : objet, ustensile, instrument ou matériel. Dans ce contexte, « équipement » fonctionne comme terme collectif naturel.'
- source_word: רֹעֶה
  choice: berger
  rationale: Le participe désigne ici celui qui garde le troupeau et caractérise l’équipement qui lui est associé.
- source_word: אֱוִלִי
  choice: insensé
  rationale: L’adjectif exprime la sottise, notamment dans sa dimension morale. « Insensé » conserve cette portée sans introduire l’idée plus forte de « bon à rien ».
theological_decisions:
- issue: Identité symbolique du berger
  choice: 'La formule reste descriptive : « un berger insensé ».'
  alternative: Identifier ce berger à un dirigeant historique précis, aux mauvais chefs d’Israël en général ou à une figure eschatologique.
  rationale: Ce verset ne précise pas lui-même l’identité de la figure symbolique. La traduction conserve donc l’indétermination du texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation légèrement marquée « pour toi » est conservée afin de représenter le datif hébreu; « équipement » est pris collectivement, comme le permet le singulier hébreu.
