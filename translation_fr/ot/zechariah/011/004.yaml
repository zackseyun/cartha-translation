  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה אֱלֹהָ֑/י רְעֵ֖ה אֶת צֹ֥אן הַ/הֲרֵגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/004.yaml
  text: 'Thus says Yahweh my God: Shepherd the flock for slaughter[a].'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, mon Dieu : « Fais paître le troupeau destiné à l’abattage[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le troupeau de l’abattage », c’est-à-dire le troupeau destiné à être abattu.'
    reason: La construction hébraïque est très condensée; la note conserve sa forme tout en expliquant le sens retenu dans le texte.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée en français, à la fois concise, solennelle et fidèle à l’introduction du discours divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Conserve explicitement le suffixe hébreu de première personne du singulier.
- source_word: רְעֵה
  choice: Prends soin
  rationale: L’impératif désigne ici l’activité du berger. Cette formulation verbale est naturelle en français et maintient l’image pastorale grâce au complément « troupeau ».
- source_word: צֹאן
  choice: troupeau
  rationale: Rend naturellement le nom collectif hébreu désignant le petit bétail envisagé comme un ensemble.
- source_word: הַהֲרֵגָה
  choice: destiné à l’abattage
  rationale: Exprime en français idiomatique la relation condensée « troupeau d’abattage », sans préciser qui l’abattra ni affirmer qu’il est déjà marqué.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre יהוה. Sa transcription préserve sa fonction de nom personnel sans le remplacer par un titre.
- issue: Rapport personnel exprimé par אֱלֹהָי
  choice: mon Dieu
  alternative: Dieu
  rationale: Le suffixe de première personne fait partie du texte et présente Yahweh comme le Dieu du locuteur; il ne faut pas le généraliser.
- issue: Ambiguïté de l’expression צֹאן הַהֲרֵגָה
  choice: le troupeau destiné à l’abattage
  alternative: le troupeau de l’abattage
  rationale: Le français explicite la destination probable du troupeau tout en évitant d’ajouter l’idée plus précise de condamnation, de marquage ou d’un agent déterminé.
translation_notes:
  register: Français international moderne, digne et accessible. Les guillemets signalent clairement le commandement divin après la formule du messager. « Abattage » convient au bétail et évite le registre humain de « massacre ».
