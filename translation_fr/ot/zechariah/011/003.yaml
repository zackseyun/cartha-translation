source:
  edition: WLC
  text: ק֚וֹל יִֽלְלַ֣ת הָ/רֹעִ֔ים כִּ֥י שֻׁדְּדָ֖ה אַדַּרְתָּ֑/ם ק֚וֹל שַׁאֲגַ֣ת כְּפִירִ֔ים כִּ֥י שֻׁדַּ֖ד גְּא֥וֹן הַ/יַּרְדֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/003.yaml
  text: The sound of the shepherds’ wailing[a], for their splendor is ruined; the sound of the young lions’ roaring[b], for the majesty of the Jordan is ruined.
translation:
  language: fr
  text: On entend les bergers se lamenter, car leur splendeur est dévastée[a] ; on entend les jeunes lions rugir, car la majesté du Jourdain est dévastée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur magnifique parure ». Le terme hébreu peut désigner la splendeur, mais aussi ce qui sert de parure, notamment un manteau imposant.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’orgueil du Jourdain ». L’expression peut désigner plus précisément les fourrés luxuriants qui bordaient le Jourdain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל
  choice: On entend
  rationale: קוֹל introduit ici les cris audibles dans deux membres parallèles. « On entend » restitue naturellement cet effet en français moderne sans alourdir le vers par « le bruit de ».
- source_word: יִלְלַת הָרֹעִים
  choice: les bergers se lamenter
  rationale: יִלְלַת désigne un cri de plainte ou une lamentation. La tournure verbale française est naturelle et conserve l’image littérale des bergers, sans expliciter d’éventuels dirigeants.
- source_word: שֻׁדְּדָה / שֻׁדַּד
  choice: est dévastée
  rationale: Le verbe שׁדד exprime la dévastation, la destruction ou le pillage. « Dévastée » convient aux réalités poétiques visées et permet de conserver la répétition du verbe hébreu.
- source_word: אַדַּרְתָּם
  choice: leur splendeur
  rationale: אַדֶּרֶת peut désigner une parure ou un manteau magnifique, puis, par extension, la splendeur. Ce choix préserve le sens élevé tout en laissant ouverte une éventuelle allusion concrète à ce qui faisait leur parure.
- source_word: שַׁאֲגַת כְּפִירִים
  choice: les jeunes lions rugir
  rationale: שְׁאָגָה est le rugissement du lion et כְּפִיר désigne un jeune lion vigoureux. La formulation conserve l’image et le parallélisme sonore avec les bergers qui se lamentent.
- source_word: גְּאוֹן הַיַּרְדֵּן
  choice: la majesté du Jourdain
  rationale: גָּאוֹן peut signifier majesté, élévation ou orgueil. Dans cette expression, il peut évoquer la végétation luxuriante des rives du Jourdain. « Majesté » conserve l’expression poétique sans lui imposer une nuance morale négative.
theological_decisions:
- issue: Identification symbolique des bergers et des jeunes lions
  choice: Conserver les images de bergers et de jeunes lions
  alternative: Les rendre explicitement par « dirigeants », « chefs » ou « oppresseurs »
  rationale: Le texte hébreu n’identifie pas directement les référents symboliques. Les expliciter dans la traduction résoudrait une métaphore que le vers laisse ouverte.
- issue: Sens de גְּאוֹן הַיַּרְדֵּן
  choice: la majesté du Jourdain
  alternative: « l’orgueil du Jourdain » ou « les fourrés du Jourdain »
  rationale: « Majesté » reflète directement la valeur abstraite du nom, tandis que « fourrés » explicite un référent concret probable mais non formulé comme tel. « Orgueil » risquerait d’introduire en français une connotation morale indue.
translation_notes:
  register: Français international moderne, poétique et digne. Le double « On entend » rend le parallélisme de קוֹל tout en restant idiomatique. La répétition de « est dévastée » reproduit celle du verbe שׁדד. Les images prophétiques demeurent non explicitées.
