  text: פְּתַ֥ח לְבָנ֖וֹן דְּלָתֶ֑י/ךָ וְ/תֹאכַ֥ל אֵ֖שׁ בַּ/אֲרָזֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/001.yaml
  text: Open your doors[a], Lebanon, so that fire may consume your cedars.
translation:
  language: fr
  text: Ouvre tes portes, Liban, et le feu dévorera tes cèdres[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ouvre tes portes, Liban, et que le feu dévore tes cèdres ! »'
    reason: La forme verbale hébraïque coordonnée à l’impératif peut aussi être comprise avec une nuance jussive ou volitive, plutôt que comme l’annonce d’une conséquence.
lexical_decisions:
- source_word: פְּתַח
  choice: Ouvre
  rationale: Impératif masculin singulier de פתח, adressé au Liban personnifié. « Ouvre » rend directement l’ordre sans ajouter l’intensité de « ouvre toutes grandes ».
- source_word: לְבָנוֹן
  choice: Liban
  rationale: Nom propre désignant ici le Liban, directement interpellé et personnifié.
- source_word: דְּלָתֶיךָ
  choice: tes portes
  rationale: דֶּלֶת désigne normalement une porte ou un battant. « Portes » conserve l’image concrète; « portes d’accès » ou « portails » préciserait indûment le référent.
- source_word: וְתֹאכַל
  choice: et que … dévore
  rationale: L’imparfait qal féminin singulier de אכל, précédé de וְ après l’impératif, peut exprimer une conséquence ou une visée. La tournure française « et que » préserve cette relation sans trancher strictement entre souhait, conséquence et finalité.
- source_word: אֵשׁ
  choice: le feu
  rationale: Sens lexical direct. L’article défini est naturel en français dans cette image de jugement destructeur.
- source_word: בַּאֲרָזֶיךָ
  choice: tes cèdres
  rationale: Le בְּ peut marquer le domaine atteint, mais avec אכל le français formule naturellement les cèdres comme objet de « dévorer ». Le suffixe possessif est conservé.
theological_decisions:
- issue: Personnification et image prophétique
  choice: Le Liban est directement interpellé comme une réalité personnifiée dont les portes s’ouvrent au feu destructeur.
  alternative: Comprendre les portes comme les passages réels du Liban, ou faire du Liban le symbole explicite de dirigeants ou de puissances politiques.
  rationale: Le texte poétique n’identifie pas explicitement le référent symbolique. La traduction conserve donc l’image et son indétermination.
- issue: Rapport entre l’impératif et l’imparfait coordonné
  choice: « et que le feu dévore »
  alternative: « pour que le feu dévore » ou « et le feu dévorera »
  rationale: L’hébreu permet une nuance de conséquence ou de finalité après l’impératif. La formulation retenue garde la vigueur prophétique tout en évitant de fixer exclusivement l’une de ces valeurs.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le tutoiement convient à l’apostrophe poétique d’un territoire personnifié. « Dévore » conserve la force imagée usuelle du verbe אכל appliqué au feu.
