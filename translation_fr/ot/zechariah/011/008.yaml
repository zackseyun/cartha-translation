source:
  edition: WLC
  text: וָ/אַכְחִ֛ד אֶת שְׁלֹ֥שֶׁת הָ/רֹעִ֖ים בְּ/יֶ֣רַח אֶחָ֑ד וַ/תִּקְצַ֤ר נַפְשִׁ/י֙ בָּ/הֶ֔ם וְ/גַם נַפְשָׁ֖/ם בָּחֲלָ֥ה בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/008.yaml
  text: So I removed the three shepherds in one month[a], and my soul grew impatient with them[c][b], and their soul also loathed me.
translation:
  language: fr
  text: Je fis disparaître les trois bergers en un seul mois[a]. Puis je perdis patience avec eux[b], et eux aussi me prirent en aversion[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’éliminai » ou « Je supprimai les trois bergers en un seul mois » ; le verbe hébreu peut désigner le fait de les faire disparaître ou de les éliminer.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « je perdis patience » évoque une profonde impatience ou une vive exaspération.
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu exprime une forte aversion et peut aussi se traduire par « me détestèrent » ou « furent dégoûtés de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַכְחִד
  choice: je fis disparaître
  rationale: Le hiphil de כחד peut exprimer le fait de faire disparaître, d’éliminer ou de détruire. « Fis disparaître » conserve le caractère décisif de l’action sans préciser si les bergers furent tués, destitués ou éliminés d’une autre manière.
- source_word: שְׁלֹשֶׁת הָרֹעִים
  choice: les trois bergers
  rationale: Cette traduction directe préserve la métaphore structurante du chapitre sans identifier les bergers à des personnages ou à des catégories de dirigeants.
- source_word: בְּיֶרַח אֶחָד
  choice: en un seul mois
  rationale: L’expression désigne un mois unique. « Un seul » fait naturellement ressortir en français la brièveté frappante de la période.
- source_word: וַתִּקְצַר נַפְשִׁי בָּהֶם
  choice: je perdis patience avec eux
  rationale: L’idiome קצר נפש exprime l’impatience, l’exaspération ou l’épuisement de la tolérance. Une traduction idiomatique est ici plus naturelle que le calque « mon âme se raccourcit ».
- source_word: וְגַם נַפְשָׁם בָּחֲלָה בִי
  choice: et eux aussi me prirent en aversion
  rationale: Le verbe בחל exprime une forte aversion, allant jusqu’au dégoût. La tournure française conserve cette intensité tout en rendant naturellement l’emploi idiomatique de נֶפֶשׁ.
theological_decisions:
- issue: Identité des « trois bergers »
  choice: Conserver « les trois bergers » sans les identifier.
  alternative: Les identifier à trois chefs historiques, à trois catégories de dirigeants ou à une représentation symbolique des mauvais dirigeants.
  rationale: Le texte hébreu ne précise pas leur identité. La traduction maintient donc l’ambiguïté du texte et la portée de sa métaphore.
translation_notes:
  register: Français international moderne, naturel et digne. Les idiomes construits avec נֶפֶשׁ sont rendus par des formulations françaises courantes, tandis que la métaphore des bergers et l’ambiguïté entourant leur identité sont préservées.
