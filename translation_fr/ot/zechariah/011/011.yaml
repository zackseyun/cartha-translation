    issue: « les malheureux du troupeau »
    rationale: « Malheureux » évoque surtout des personnes infortunées ou tristes et rend moins exactement עֲנִיֵּי, terme susceptible de désigner les pauvres, les opprimés ou les affligés. « Les pauvres » est plus précis tout en laissant les autres nuances à la note.
  - severity: low
    issue: « une parole de Yahweh »
    rationale: Bien que le nom hébreu soit en construction sans article, l’expression דְבַר־יְהוָה fonctionne comme une formule définie. En français moderne, « la parole de Yahweh » est plus naturel et représente mieux cette fonction.
  - severity: low
    issue: « donc » dans la première proposition
    rationale: Le connecteur explicatif est mieux rendu avec la reconnaissance qui suit; « donc » après « Elle fut » alourdit légèrement la progression sans correspondance nécessaire à cet emplacement.
