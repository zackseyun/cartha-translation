  text: וַ/תֻּפַ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֵּדְע֨וּ כֵ֜ן עֲנִיֵּ֤י הַ/צֹּאן֙ הַ/שֹּׁמְרִ֣ים אֹתִ֔/י כִּ֥י דְבַר יְהוָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/011.yaml
  text: So it was broken on that day[b][a], and thus the afflicted of the flock who were watching me knew that it was the word of Yahweh.
translation:
  language: fr
  text: Elle fut rompue ce jour-là[b], et les pauvres du troupeau[a], qui m’observaient, comprirent alors que c’était la parole de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les affligés du troupeau » ou « les humbles du troupeau ».
    reason: lexical_alternative
  - marker: b
    text: Ou « annulée » ou « révoquée », ce qui souligne la portée de l’image d’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּפַר
  choice: Elle fut donc rompue
  rationale: Le passif de פרר renvoie à la « Grâce », la houlette brisée au verset précédent. « Rompue » conserve l’image concrète tout en laissant entendre l’annulation de l’alliance symbolisée.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle prophétique rendue de manière idiomatique en français moderne.
- source_word: וַיֵּדְעוּ כֵן
  choice: Alors … reconnurent
  rationale: כֵן établit ici le lien entre la rupture de la houlette et la prise de conscience. « Reconnurent » exprime une compréhension fondée sur le signe observé.
- source_word: עֲנִיֵּי הַצֹּאן
  choice: les malheureux du troupeau
  rationale: עֲנִיֵּי peut désigner les pauvres, les opprimés ou les humbles. « Malheureux » garde une portée assez large sans réduire le terme à la pauvreté économique.
- source_word: הַשֹּׁמְרִים אֹתִי
  choice: qui m’observaient
  rationale: Le participe de שׁמר avec le pronom objet indique ici une observation attentive du locuteur; « observaient » est naturel et ne suggère pas qu’ils le protégeaient.
- source_word: כִּי דְבַר יְהוָה הוּא
  choice: que c’était une parole de Yahweh
  rationale: L’hébreu ne marque pas la détermination de דְבַר; « une parole » préserve cette forme tout en présentant l’acte prophétique comme venant de Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre et évite de le remplacer par un titre.
- issue: Détermination de דְבַר יְהוָה
  choice: une parole de Yahweh
  alternative: la parole de Yahweh
  rationale: La construction hébraïque est sans article. « Une parole » conserve cette indétermination grammaticale, sans exclure que l’expression désigne le message divin manifesté par l’action symbolique.
translation_notes:
  register: Français international moderne, sobre et digne. Le féminin « elle » reprend la houlette appelée « Grâce » au verset précédent. L’ordre des appels de notes suit leur emplacement naturel dans le texte.
