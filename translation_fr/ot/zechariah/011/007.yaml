  text: וָֽ/אֶרְעֶה֙ אֶת צֹ֣אן הַֽ/הֲרֵגָ֔ה לָ/כֵ֖ן עֲנִיֵּ֣י הַ/צֹּ֑אן וָ/אֶקַּֽח לִ֞/י שְׁנֵ֣י מַקְל֗וֹת לְ/אַחַ֞ד קָרָ֤אתִי נֹ֨עַם֙ וּ/לְ/אַחַד֙ קָרָ֣אתִי חֹֽבְלִ֔ים וָ/אֶרְעֶ֖ה אֶת הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/007.yaml
  text: So I shepherded the flock doomed to slaughter, namely the afflicted of the flock. Then I took for myself two staffs; one I named Favor, and the other I named Union, and I shepherded the flock.
translation:
  language: fr
  text: 'Je fis donc paître le troupeau destiné à l’abattage, c’est-à-dire les malheureux du troupeau.[a] Je pris deux bâtons : j’appelai l’un « Faveur » et l’autre « Liens ».[b] Et je fis paître le troupeau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de cette expression est difficile. Littéralement, il se lit approximativement : « donc les malheureux du troupeau ». D’autres proposent, à partir d’une autre lecture, « pour les marchands de brebis ».'
    reason: Signaler une difficulté textuelle et syntaxique réelle sans remplacer silencieusement le texte massorétique par une conjecture.
  - marker: b
    text: Les noms des deux bâtons peuvent aussi être rendus par « Bienveillance » et « Cordes »; le second évoque ici ce qui attache ou unit.
    reason: Préserver l’étendue sémantique des deux noms symboliques, particulièrement celle du pluriel חֹבְלִים.
lexical_decisions:
- source_word: צֹאן הַהֲרֵגָה
  choice: le troupeau destiné à l’abattage
  rationale: Rend naturellement l’expression hébraïque désignant un troupeau voué à être tué, sans atténuer son caractère funeste.
- source_word: עֲנִיֵּי הַצֹּאן
  choice: les malheureux du troupeau
  rationale: עֲנִיֵּי peut désigner les pauvres, les affligés ou les opprimés. « Malheureux » garde cette amplitude mieux qu’un terme limité à la pauvreté matérielle.
- source_word: מַקְלוֹת
  choice: bâtons
  rationale: Le mot désigne ici les bâtons du berger; « bâtons » est courant et concret en français.
- source_word: נֹעַם
  choice: Faveur
  rationale: Le nom évoque l’agrément, la bienveillance ou la faveur. « Faveur » convient au nom symbolique tout en restant proche du champ lexical hébreu.
- source_word: חֹבְלִים
  choice: Liens
  rationale: Le pluriel peut désigner des cordes ou des liens. « Liens » conserve l’image concrète et prépare naturellement le thème de l’union fraternelle au verset 14, sans traduire directement par une interprétation abstraite comme « Union ».
theological_decisions:
- issue: Rapport syntaxique de לָכֵן עֲנִיֵּי הַצֹּאן avec « le troupeau destiné à l’abattage »
  choice: c’est-à-dire les malheureux du troupeau
  alternative: donc, les malheureux du troupeau; ou, selon une autre lecture ancienne/conjecturale, pour les marchands de brebis
  rationale: Le texte massorétique est syntaxiquement difficile. « C’est-à-dire » suit la compréhension retenue dans la couche anglaise tout en identifiant les malheureux au troupeau voué à l’abattage; une note signale honnêtement l’incertitude.
- issue: Portée symbolique du nom חֹבְלִים
  choice: Liens
  alternative: Union
  rationale: « Liens » traduit l’image hébraïque sans imposer d’emblée sa portée théologique. Le contexte ultérieur peut faire comprendre que ces liens représentent la fraternité ou l’union.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition finale de « fis paître le troupeau » est conservée parce qu’elle structure le verset hébreu. Les noms symboliques portent des majuscules et sont placés entre guillemets français.
