source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י הַשְׁלִיכֵ֨/הוּ֙ אֶל הַ/יּוֹצֵ֔ר אֶ֣דֶר הַ/יְקָ֔ר אֲשֶׁ֥ר יָקַ֖רְתִּי מֵֽ/עֲלֵי/הֶ֑ם וָֽ/אֶקְחָ/ה֙ שְׁלֹשִׁ֣ים הַ/כֶּ֔סֶף וָ/אַשְׁלִ֥יךְ אֹת֛/וֹ בֵּ֥ית יְהוָ֖ה אֶל הַ/יּוֹצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/013.yaml
  text: Then Yahweh said to me[a], “Throw it to the potter—the magnificent price at which I was valued by them.” So I took the thirty pieces of silver and threw it into the house of Yahweh[b], to the potter.
translation:
  language: fr
  text: 'Alors Yahweh me dit : « Jette cela au potier — ce magnifique prix auquel ils m’ont évalué ! » Je pris donc les trente pièces d’argent et les jetai dans la maison de Yahweh, au potier.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « au potier ». Certains proposent « au trésor » ou « à la trésorerie » en raison du contexte difficile, mais le texte massorétique porte « potier » aux deux endroits. L’expression « ce magnifique prix » est probablement ironique : elle souligne le caractère insultant de l’estimation à trente pièces d’argent.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et le distingue d’un titre comme « le Seigneur ».
- source_word: הַשְׁלִיכֵהוּ
  choice: Jette cela
  rationale: L’impératif avec suffixe masculin singulier renvoie ici naturellement à l’argent ou au prix mentionné dans le contexte.
- source_word: הַיּוֹצֵר
  choice: le potier
  rationale: Le participe substantivé de יצר désigne normalement le potier ou celui qui façonne. Malgré la difficulté du contexte, le texte massorétique porte ce même mot aux deux endroits.
- source_word: אֶדֶר הַיְקָר
  choice: ce prix magnifique
  rationale: L’expression évoque splendeur et valeur; dans le contexte des trente pièces d’argent, sa grandeur rhétorique produit vraisemblablement une ironie mordante.
- source_word: יָקַרְתִּי מֵעֲלֵיהֶם
  choice: auquel ils m’ont estimé
  rationale: Cette formulation française naturelle conserve le locuteur comme objet de l’évaluation et rend clairement la provenance de cette estimation.
- source_word: שְׁלֹשִׁים הַכֶּסֶף
  choice: les trente pièces d’argent
  rationale: Rend l’expression monétaire sans préciser « sicles », unité qui n’est pas explicitement nommée dans le verset.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Suit formellement « maison » plutôt que d’expliciter par « temple ».
- source_word: אֶל הַיּוֹצֵר
  choice: au potier
  rationale: Préserve la répétition difficile du texte hébreu sans la remplacer par une conjecture telle que « trésor ».
theological_decisions:
- issue: Le sens du mot répété הַיּוֹצֵר dans ce contexte difficile
  choice: Conserver « potier » dans les deux occurrences
  alternative: « trésor » ou « trésorerie » par conjecture textuelle ou sens proposé
  rationale: La leçon massorétique est « potier » aux deux endroits. La difficulté ne justifie pas de résoudre silencieusement le texte par émendation, et aucun motif doctrinal ne doit dicter cette décision.
- issue: La portée de l’expression אֶדֶר הַיְקָר
  choice: « ce prix magnifique » avec une ponctuation qui laisse entendre l’ironie
  alternative: « ce beau prix » ou une formulation non ironique
  rationale: Le langage élevé contraste avec la faible somme et conserve ainsi la tension sarcastique probable sans l’expliquer directement dans le corps du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le point d’exclamation fait ressortir l’ironie probable tout en laissant intacte l’ambiguïté lexicale expliquée en note.
