source:
  edition: WLC
  text: כִּ֠י לֹ֣א אֶחְמ֥וֹל ע֛וֹד עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָ֑ה וְ/הִנֵּ֨ה אָנֹכִ֜י מַמְצִ֣יא אֶת הָ/אָדָ֗ם אִ֤ישׁ בְּ/יַד רֵעֵ֨/הוּ֙ וּ/בְ/יַ֣ד מַלְכּ֔/וֹ וְ/כִתְּתוּ֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א אַצִּ֖יל מִ/יָּדָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/006.yaml
  text: For I will no longer have compassion on the inhabitants of the land[a], declares Yahweh. Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king, and they will crush the land[c][b], and I will not deliver it from their hand.
translation:
  language: fr
  text: Car je n’aurai plus compassion des habitants du pays[a] — déclaration de Yahweh. Voici que je livre les gens, chacun au pouvoir de son prochain et au pouvoir de son roi[b]. Ils écraseront le pays, et je ne délivrerai pas de leur pouvoir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui habitent la terre », si הָאָרֶץ est compris dans un sens universel plutôt que local.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « chacun dans la main de son prochain et dans la main de son roi » ; la « main » représente ici le pouvoir exercé sur quelqu’un.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu ne précise pas l’objet de « délivrer ». On peut comprendre « je ne délivrerai pas le pays de leur pouvoir » ou « je ne les délivrerai pas de leur pouvoir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחְמוֹל
  choice: j’aurai compassion
  rationale: Le verbe חמל peut exprimer la compassion ou le fait d’épargner. « Avoir compassion » conserve ici sa dimension affective et judiciaire.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Le participe substantivé désigne ceux qui habitent un territoire. Dans le contexte immédiat, « pays » convient mieux que « terre », sans exclure l’autre possibilité.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale solennelle introduit un oracle prophétique et conserve le nom divin.
- source_word: מַמְצִיא
  choice: je livre
  rationale: Le hiphil de מצא signifie ici faire tomber quelqu’un sous le pouvoir d’un autre; « livrer » exprime naturellement ce sens causatif.
- source_word: הָאָדָם אִישׁ
  choice: les humains, chacun
  rationale: הָאָדָם a ici une valeur collective, tandis que אִישׁ distribue l’action individu par individu. Cette formulation française garde les deux aspects.
- source_word: בְיַד
  choice: au pouvoir de
  rationale: Littéralement « dans la main de », l’expression désigne l’assujettissement au pouvoir d’autrui. La formulation retenue est naturelle en français et répétée pour préserver le parallélisme.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner le prochain, le compagnon ou l’ami. Dans ce contexte de désagrégation sociale, « prochain » est assez large et n’implique pas une relation amicale.
- source_word: מַלְכּוֹ
  choice: son roi
  rationale: La traduction directe garde la précision politique du texte hébreu.
- source_word: וְכִתְּתוּ
  choice: ils écraseront
  rationale: כתת évoque le fait de broyer, fracasser ou écraser; « écraser » convient à la violence du jugement annoncé.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le même choix que dans la première proposition assure la cohérence lexicale et correspond au cadre territorial du passage.
- source_word: אַצִּיל מִיָּדָם
  choice: je ne délivrerai pas ses habitants de leur pouvoir
  rationale: Le verbe signifie délivrer ou arracher. L’objet n’étant pas exprimé en hébreu, « ses habitants » est fourni d’après le contexte tout en étant signalé en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Étendue de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat favorise un jugement visant un territoire et ses habitants, mais le terme hébreu peut avoir une portée plus universelle; l’ambiguïté est indiquée en note.
- issue: Valeur de הָאָדָם אִישׁ
  choice: les humains, chacun
  alternative: chaque homme
  rationale: La formulation rend à la fois la portée collective de הָאָדָם et la distribution individuelle marquée par אִישׁ, sans restreindre indûment le groupe aux seuls hommes de sexe masculin.
- issue: Objet non exprimé de אַצִּיל
  choice: ses habitants
  alternative: le pays / les humains
  rationale: Le suffixe objet manque dans l’hébreu. Le contexte humain du jugement favorise « ses habitants », mais la reprise possible du « pays » demeure grammaticalement et contextuellement envisageable.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour prophétique « déclaration de Yahweh » maintient la solennité, tandis que « au pouvoir de » rend clairement l’idiome hébreu de la main. Les ambiguïtés portant sur la portée de « pays/terre » et sur l’objet final non exprimé sont conservées dans les notes.
