  text: וָ/אֶקַּ֤ח אֶת מַקְלִ/י֙ אֶת נֹ֔עַם וָ/אֶגְדַּ֖ע אֹת֑/וֹ לְ/הָפֵיר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/010.yaml
  text: Then I took my staff Favor and cut it in two[a], to break my covenant that I had made with all the peoples.
translation:
  language: fr
  text: Puis je pris mon bâton appelé « Faveur » et le coupai en deux, afin de rompre l’alliance que j’avais conclue avec tous les peuples[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toutes les nations » : le mot hébreu peut désigner des peuples ou des nations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלִי
  choice: mon bâton
  rationale: מַקֵּל désigne couramment un bâton ou une verge. « Bâton » est naturel en français dans ce contexte pastoral et convient à l’objet symbolique nommé.
- source_word: נֹעַם
  choice: « Faveur »
  rationale: Comme nom symbolique du bâton, נֹעַם est traduit selon son sens. « Faveur » exprime ici l’idée de bienveillance et d’agrément sans imposer une interprétation confessionnelle.
- source_word: וָאֶגְדַּע אֹתוֹ
  choice: et le coupai en deux
  rationale: גדע signifie couper, retrancher ou abattre. Dans le contexte du geste symbolique accompli sur le bâton, « couper en deux » rend clairement l’action physique.
- source_word: לְהָפֵיר
  choice: afin de rompre
  rationale: Dans un contexte d’alliance, הפר signifie rompre, invalider ou annuler. « Rompre » est idiomatique en français avec « alliance » et conserve la force du terme.
- source_word: בְּרִיתִי
  choice: l’alliance
  rationale: Le possessif hébreu est représenté par la proposition relative « que j’avais conclue », dont le sujet à la première personne indique sans ambiguïté qu’il s’agit de l’alliance du locuteur. « Alliance » est le terme français usuel pour בְּרִית.
- source_word: כָּרַתִּי
  choice: que j’avais conclue
  rationale: כרת ברית est l’expression hébraïque consacrée pour conclure une alliance. Le plus-que-parfait indique naturellement que l’alliance existait avant sa rupture symbolique.
- source_word: כָּל הָעַמִּים
  choice: tous les peuples
  rationale: Le pluriel עַמִּים est maintenu. « Peuples » reflète directement le sens lexical tout en évitant de réduire le terme à une catégorie strictement politique.
theological_decisions:
- issue: Portée de l’alliance conclue « avec tous les peuples »
  choice: Conserver la formulation large « tous les peuples » sans en préciser davantage les référents.
  alternative: « toutes les nations » ou une formulation limitée à Israël ou aux peuples environnants
  rationale: L’hébreu dit explicitement כָּל הָעַמִּים et ne restreint pas lui-même la portée de l’expression dans ce verset. La traduction préserve cette tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. « Appelé “Faveur” » indique clairement que Faveur est le nom symbolique du bâton. Le marqueur de note est placé après l’expression à laquelle la variante se rapporte.
