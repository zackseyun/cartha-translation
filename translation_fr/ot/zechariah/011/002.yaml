source:
  edition: WLC
  text: הֵילֵ֤ל בְּרוֹשׁ֙ כִּֽי נָ֣פַל אֶ֔רֶז אֲשֶׁ֥ר אַדִּרִ֖ים שֻׁדָּ֑דוּ הֵילִ֨ילוּ֙ אַלּוֹנֵ֣י בָשָׁ֔ן כִּ֥י יָרַ֖ד יַ֥עַר ה/בצור־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/002.yaml
  text: Wail[a], cypress, for the cedar has fallen, for the majestic ones have been destroyed. Wail, oaks of Bashan[c][b], for the thick forest has come down.
translation:
  language: fr
  text: Lamente-toi, cyprès[a], car le cèdre est tombé, car les grands ont été dévastés[b]. Lamentez-vous, chênes du Bashân, car la forêt impénétrable[c] est tombée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sapin » ; l’identification exacte de cet arbre est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « les puissants ont été ravagés ».
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque peut aussi se comprendre comme « la forêt dense » ou « la forêt fortifiée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילֵל / הֵילִילוּ
  choice: Lamente-toi / Lamentez-vous
  rationale: Ces impératifs appellent à exprimer bruyamment le deuil ou l’alarme. « Se lamenter » garde le ton prophétique et convient naturellement à l’apostrophe poétique adressée aux arbres.
- source_word: בְּרוֹשׁ
  choice: cyprès
  rationale: Le terme désigne vraisemblablement un conifère, souvent compris comme le cyprès, bien que l’identification exacte demeure incertaine; « sapin » est conservé en note comme autre possibilité.
- source_word: כִּי
  choice: car
  rationale: Dans ses deux occurrences, la conjonction introduit la raison de la lamentation. « Car » maintient clairement ce lien causal et la cadence poétique.
- source_word: נָפַל
  choice: est tombé
  rationale: La traduction suit le sens direct du verbe sans préciser si le cèdre a été abattu, ce que l’image peut suggérer sans l’énoncer explicitement.
- source_word: אֶרֶז
  choice: cèdre
  rationale: Équivalent français habituel de ce terme, associé dans la poésie prophétique à la grandeur et à la force.
- source_word: אַדִּרִים
  choice: les majestueux
  rationale: Le substantif adjectival peut désigner ceux qui sont majestueux, imposants ou puissants. Cette formulation élevée conserve l’ambiguïté entre les arbres imposants de l’image et les puissants qu’ils pourraient représenter.
- source_word: שֻׁדָּדוּ
  choice: ont été dévastés
  rationale: La forme passive exprime une ruine violente. « Dévastés » convient à la fois à l’image forestière et à son éventuelle portée humaine, sans réduire le sens au pillage.
- source_word: אַלּוֹנֵי בָשָׁן
  choice: chênes du Bashân
  rationale: Traduction traditionnelle et reconnaissable de ces arbres renommés pour leur robustesse; le terme botanique pourrait aussi désigner des térébinthes.
- source_word: יָרַד
  choice: est tombée
  rationale: Le verbe signifie littéralement descendre. Appliqué à une forêt, « est tombée » exprime naturellement son abaissement ou son effondrement sans rendre explicitement l’agent de sa destruction.
- source_word: יַעַר הַבָּצוּר
  choice: la forêt impénétrable
  rationale: L’expression finale est difficile. « Impénétrable » rend probablement l’idée d’un massif inaccessible ou fermé, tout en signalant en note les autres analyses possibles.
theological_decisions:
- issue: Faut-il expliciter que les arbres représentent des dirigeants ou d’autres puissances humaines ?
  choice: Conserver sans explication l’image des arbres et le substantif ambigu « les majestueux »
  alternative: Remplacer l’image ou le substantif par « dirigeants », « chefs » ou « puissants »
  rationale: Même si les arbres peuvent représenter des dirigeants ou des puissances, l’hébreu présente directement l’image forestière. La traduction la maintient afin de ne pas imposer une identification interprétative.
translation_notes:
  register: Français international moderne, poétique et digne. L’alternance entre le singulier « Lamente-toi » adressé au cyprès et le pluriel « Lamentez-vous » adressé aux chênes reproduit celle de l’hébreu. Le parallélisme et la répétition de « car » sont conservés.
