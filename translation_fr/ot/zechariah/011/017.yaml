review_pass:
  verdict: revise
  source_fidelity: La première et la troisième proposition sont globalement fidèles, et les deux infinitifs absolus intensifs sont rendus. Toutefois, « Que l’épée frappe » transforme la déclaration nominale hébraïque en imprécation explicite, alors que le texte laisse la valeur exacte de cette annonce de jugement ouverte. De plus, « perdra toute sa vue » affirme une cécité totale que כָּהֹה (« devenir sombre/faible, s’obscurcir »), même intensifié, n’exige pas.
  naturalness: « Berger sans valeur » est plus concis, naturel et soutenu que « berger qui ne vaut rien ». La formulation nominale « Une épée contre son bras et contre son œil droit ! » conserve volontairement le style oraculaire abrupt du texte source sans imposer un mode verbal. « S’obscurcira entièrement » est idiomatique et garde l’image visuelle.
  terminology: « Malheur » rend bien הוֹי. « Berger sans valeur » restitue la portée dépréciative de רֹעִי הָאֱלִיל, tandis que la note conserve l’alternative liée à « idole ». « Bras », « œil droit », « troupeau » et « épée » sont maintenus littéralement.
  issues:
  - severity: medium
    issue: L’optatif « Que l’épée frappe » explicite indûment la syntaxe nominale.
    rationale: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ ne contient pas de verbe ni de marque optative. Une formulation nominale française préserve mieux l’ambiguïté oraculaire entre constat et déclaration de jugement.
  - severity: medium
    issue: '« Perd ra toute sa vue » (corrigé : « perdra toute sa vue ») surinterprète l’atteinte de l’œil.'
    rationale: כָּהֹה תִכְהֶה exprime un obscurcissement ou un affaiblissement intense; il ne requiert pas explicitement une perte totale de la vision.
  - severity: low
    issue: « Berger qui ne vaut rien » est plus lourd que nécessaire.
    rationale: « Berger sans valeur » est une équivalence française plus directe de l’adjectif hébreu péjoratif, sans modifier sa nuance.
  revised_text: Malheur au berger sans valeur[a], qui abandonne le troupeau ! Une épée contre son bras et contre son œil droit ! Son bras se desséchera entièrement, et son œil droit s’obscurcira entièrement.
  revised_footnotes:
