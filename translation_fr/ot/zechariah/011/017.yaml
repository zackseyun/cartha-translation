source:
  edition: WLC
  text: ה֣וֹי רֹעִ֤י הָֽ/אֱלִיל֙ עֹזְבִ֣י הַ/צֹּ֔אן חֶ֥רֶב עַל זְרוֹע֖/וֹ וְ/עַל עֵ֣ין יְמִינ֑/וֹ זְרֹע/וֹ֙ יָב֣וֹשׁ תִּיבָ֔שׁ וְ/עֵ֥ין יְמִינ֖/וֹ כָּהֹ֥ה תִכְהֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/017.yaml
  text: Woe to the worthless shepherd[a], who abandons the flock! A sword is against his arm and against his right eye. His arm will completely wither, and his right eye will be utterly dimmed.
translation:
  language: fr
  text: Malheur au berger sans valeur[a], qui abandonne le troupeau ! Une épée contre son bras et contre son œil droit ! Son bras se desséchera entièrement, et son œil droit s’obscurcira entièrement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au berger-idole ». Le terme hébreu peut évoquer ce qui est sans valeur, vide ou idolâtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur
  rationale: Cette interjection rend naturellement en français le ton de dénonciation et de jugement prophétique.
- source_word: רֹעִי הָאֱלִיל
  choice: au berger qui ne vaut rien
  rationale: אֱלִיל peut désigner ce qui est sans valeur, vain ou idolâtre. La formulation choisie exprime clairement l’inutilité coupable du berger, tandis que la nuance possible d’idole est signalée en note.
- source_word: עֹזְבִי הַצֹּאן
  choice: et qui abandonne le troupeau
  rationale: Le participe caractérise le berger par son abandon du troupeau. La coordination est naturelle après la formulation française « qui ne vaut rien ».
- source_word: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ
  choice: Que l’épée frappe son bras et son œil droit !
  rationale: La proposition hébraïque sans verbe annonce un jugement. Le tour français optatif rend clairement cette imprécation, sans affaiblir l’image littérale du bras et de l’œil droit.
- source_word: זְרֹעוֹ יָבוֹשׁ תִּיבָשׁ
  choice: Son bras se desséchera complètement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action ; « complètement » transmet cette insistance avec naturel.
- source_word: וְעֵין יְמִינוֹ כָּהֹה תִכְהֶה
  choice: et son œil droit perdra toute sa vue
  rationale: כהה exprime l’obscurcissement ou la perte de capacité visuelle. Cette formulation française rend l’intensification sans employer le peu naturel « sera complètement obscurci ».
theological_decisions:
- issue: Sens de אֱלִיל dans la métaphore du berger
  choice: berger qui ne vaut rien
  alternative: berger-idole / berger sans valeur
  rationale: Le contexte dénonce surtout l’incapacité et l’infidélité du dirigeant qui abandonne le troupeau. La note conserve la possible résonance idolâtre du terme.
- issue: Portée de la perte de vision
  choice: perdra toute sa vue
  alternative: son œil droit s’obscurcira complètement
  rationale: L’intensification hébraïque indique une atteinte extrême de la vision. La traduction exprime ce résultat dans un français courant, sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve le parallélisme du bras et de l’œil droit ainsi que les deux intensifications hébraïques.
