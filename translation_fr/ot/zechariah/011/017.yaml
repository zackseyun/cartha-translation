revisions:
- from: Malheur au berger qui ne vaut rien[a] et qui abandonne le troupeau ! Que l’épée frappe son bras et son œil droit ! Son bras se desséchera complètement, et son œil droit perdra toute sa vue.
  to: Malheur au berger sans valeur[a], qui abandonne le troupeau ! Une épée contre son bras et contre son œil droit ! Son bras se desséchera entièrement, et son œil droit s’obscurcira entièrement.
  rationale: La révision élimine l’optatif ajouté et l’affirmation d’une cécité totale, afin de conserver la syntaxe oraculaire et la portée lexicale du texte hébreu. Elle garde les répétitions intensives et la note sur l’ambivalence de אֱלִיל.
