  source_fidelity: 'La suppression de « plus » est nécessaire : לֹא אֶרְעֶה signifie « je ne vous ferai pas paître / je ne vous garderai pas comme berger », sans marque explicite de reprise ou de cessation. « Celle qui doit mourir » surinterprète le participe : le texte désigne celle qui est mourante. La répétition mourir/meure et périr/périsse préserve bien l''intensification hébraïque.'
  naturalness: Le français proposé reste sobre et naturel. « Je ne vous ferai pas paître » rend le verbe verbalement, tout en maintenant le cadre du troupeau. « Que chacune dévore la chair de sa compagne » est plus net en français que « la chair de l’autre » et conserve la relation distributive exprimée par l'hébreu.
  terminology: « Paître » est le terme approprié dans l'image pastorale; « berger » est conservé dans la note comme autre possibilité. Les formes féminines françaises rendent de manière recevable les formes féminines du texte, en cohérence avec l'imagerie des brebis, sans prétendre que le référent est littéralement un groupe de femmes.
