  text: וָ/אֹמַ֕ר לֹ֥א אֶרְעֶ֖ה אֶתְ/כֶ֑ם הַ/מֵּתָ֣ה תָמ֗וּת וְ/הַ/נִּכְחֶ֨דֶת֙ תִּכָּחֵ֔ד וְ/הַ֨/נִּשְׁאָר֔וֹת תֹּאכַ֕לְנָה אִשָּׁ֖ה אֶת בְּשַׂ֥ר רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/009.yaml
  text: So I said[a], “I will not shepherd you. Let the dying die, and let the perishing perish[b]. And let those who remain each devour the flesh of the other.”
translation:
  language: fr
  text: 'Alors j’ai dit : « Je ne vous ferai pas paître[a]. Que celle qui se meurt meure, et que celle qui périt périsse. Quant à celles qui restent, que chacune dévore la chair de sa compagne[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je ne serai pas votre berger ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une [femelle], la chair de sa compagne » ; la tournure est distributive. Les formes féminines correspondent à l’image des brebis du troupeau.
    reason: cultural_note
lexical_decisions:
- source_word: אֶרְעֶה
  choice: Je ne serai plus votre berger
  rationale: Le verbe רעה signifie ici exercer la fonction de berger. Cette formulation française naturelle maintient la métaphore directrice du chapitre; « plus » rend le refus de poursuivre cette fonction dans le contexte.
- source_word: הַמֵּתָה תָמוּת
  choice: Que celle qui doit mourir meure
  rationale: La reprise de la racine hébraïque est conservée par « mourir/meure ». Le féminin singulier correspond à la brebis envisagée individuellement dans l’image du troupeau.
- source_word: הַנִּכְחֶדֶת תִּכָּחֵד
  choice: que celle qui doit périr périsse
  rationale: « Périr » exprime la destruction ou la disparition portée par כחד, tout en reproduisant sobrement la répétition du participe et du verbe hébreux.
- source_word: הַנִּשְׁאָרוֹת
  choice: celles qui restent
  rationale: Cette traduction transparente garde la valeur participiale de שׁאר et le féminin pluriel lié aux brebis du troupeau, sans imposer le sens plus interprétatif de « survivantes ».
- source_word: תֹּאכַלְנָה
  choice: dévorent
  rationale: Le sens premier est « manger », mais la mention de la chair et la violence de la scène justifient « dévorer », idiomatique en français et fidèle à la force de l’image.
- source_word: אִשָּׁה אֶת בְּשַׂר רְעוּתָהּ
  choice: chacune la chair de l’autre
  rationale: Littéralement, la construction féminine dit « une femme/la femelle, la chair de sa compagne ». Elle fonctionne ici distributivement à propos des brebis restantes; « chacune… l’autre » évite de faire croire que le texte introduit soudain des femmes tout en gardant l’image de violence réciproque.
theological_decisions:
- issue: Maintien explicite de la métaphore du berger dans la déclaration de refus
  choice: Je ne serai plus votre berger
  alternative: Je ne vous ferai plus paître
  rationale: L’action prophétique du chapitre repose sur la relation entre berger et troupeau. La formulation choisie conserve cette relation sans réduire רעה à la seule alimentation.
- issue: Degré de littéralité de l’image finale
  choice: qu’elles dévorent chacune la chair de l’autre
  alternative: qu’elles se dévorent entre elles
  rationale: Le texte décrit une destruction mutuelle sous une forme volontairement choquante. Garder « la chair » préserve cette tension et évite d’atténuer l’image.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le rythme tranchant de la sentence hébraïque, tandis que les féminins rendent visible l’image du troupeau sans lourdeur excessive.
