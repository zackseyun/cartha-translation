id: ZEC.11.16
reference: Zechariah 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י הִנֵּֽה אָנֹכִי֩ מֵקִ֨ים רֹעֶ֜ה בָּ/אָ֗רֶץ הַ/נִּכְחָד֤וֹת לֹֽא יִפְקֹד֙ הַ/נַּ֣עַר לֹֽא יְבַקֵּ֔שׁ וְ/הַ/נִּשְׁבֶּ֖רֶת לֹ֣א יְרַפֵּ֑א הַ/נִּצָּבָה֙ לֹ֣א יְכַלְכֵּ֔ל וּ/בְשַׂ֤ר הַ/בְּרִיאָה֙ יֹאכַ֔ל וּ/פַרְסֵי/הֶ֖ן יְפָרֵֽק־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
translation:
  language: fr
  text: 'Car voici : je vais susciter dans le pays un berger qui ne s’occupera pas de celles qui disparaissent[a], ne cherchera pas la jeune bête[b], ne soignera pas celle qui est blessée, ne nourrira pas celle qui tient encore debout[c] ; mais il mangera la chair des bêtes grasses et leur arrachera les sabots.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de celles qui vont à leur perte » ou « de celles qui sont détruites ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « le jeune » ; dans cette image du troupeau, certains comprennent « celle qui s’égare » ou une bête vulnérable.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « celle qui se tient debout » ; il peut s’agir de la bête encore valide ou en bonne santé.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: je vais susciter
  rationale: Le hiphil de קום exprime ici l’action de faire surgir ou d’établir. « Susciter » conserve l’initiative divine sans préciser indûment une nomination officielle.
- source_word: רֹעֶה
  choice: un berger
  rationale: Terme courant pour le gardien du troupeau, qui conserve aussi la portée figurée de dirigeant propre au contexte prophétique.
- source_word: הַנִּכְחָדוֹת
  choice: celles qui disparaissent
  rationale: Le participe féminin pluriel évoque les bêtes qui disparaissent ou vont à leur perte. Cette formulation garde ouverte la nuance entre disparition, perte et destruction.
- source_word: יִפְקֹד
  choice: s’occupera de
  rationale: 'פקד possède un champ sémantique large : visiter, prendre en charge, veiller sur. Dans l’image pastorale, « s’occuper de » est naturel et suffisamment large.'
- source_word: הַנַּעַר
  choice: la jeune bête
  rationale: Le texte massorétique porte le terme usuel pour un jeune être. L’ajout de « bête » explicite seulement son référent dans le troupeau, sans adopter comme texte principal l’interprétation conjecturale « celle qui s’égare ».
- source_word: יְבַקֵּשׁ
  choice: cherchera
  rationale: Équivalent direct et naturel de בקש, particulièrement adapté à l’action d’un berger.
- source_word: הַנִּשְׁבֶּרֶת
  choice: celle qui est blessée
  rationale: Littéralement « celle qui est brisée ». Pour un animal, « blessée » rend naturellement l’état physique tout en laissant subsister la force métaphorique du passage.
- source_word: יְרַפֵּא
  choice: soignera
  rationale: רפא signifie guérir ou soigner. « Soigner » convient à l’action attendue du berger sans introduire l’image absente de bander une plaie.
- source_word: הַנִּצָּבָה
  choice: celle qui tient encore debout
  rationale: Le participe de נצב désigne littéralement celle qui se tient debout. Cette formulation française demeure intelligible et évite de réduire le sens à « saine ».
- source_word: יְכַלְכֵּל
  choice: nourrira
  rationale: כלכל peut signifier entretenir, soutenir ou pourvoir aux besoins. Dans le contexte concret du troupeau, « nourrir » exprime naturellement le soin matériel attendu, sans exclure l’idée plus large d’entretien.
- source_word: הַבְּרִיאָה
  choice: les bêtes grasses
  rationale: בריא peut désigner ce qui est gras, robuste ou bien nourri. L’image prédatrice favorise « grasses ». Le pluriel français harmonise naturellement ce collectif avec le suffixe pluriel de « leurs sabots » en hébreu.
- source_word: פַרְסֵיהֶן יְפָרֵק
  choice: leur arrachera les sabots
  rationale: פרסה désigne le sabot, et פרק exprime ici une action violente de séparation ou d’arrachement. La traduction conserve la brutalité de l’image.
theological_decisions:
- issue: Identification du berger
  choice: Le désigner simplement comme « un berger ».
  alternative: L’identifier dans le texte comme un mauvais berger, un berger indigne ou une figure historique ou eschatologique précise.
  rationale: Le verset décrit sa conduite destructrice, mais ne lui donne pas ici d’identité explicite. La traduction préserve donc l’image prophétique sans imposer une interprétation confessionnelle.
- issue: Portée de l’action divine
  choice: Conserver « je vais susciter », qui attribue explicitement l’action à Dieu sans en expliquer le rapport moral avec la conduite du berger.
  alternative: Employer une formulation qui ferait du berger soit un envoyé approuvé, soit un acteur entièrement indépendant.
  rationale: Le texte place l’apparition du berger sous l’initiative divine tout en condamnant sa conduite par la description. Cette tension doit rester intacte.
translation_notes:
  register: Français international actuel, digne et lisible. La série de propositions conserve le rythme accusateur du texte hébreu. Les féminins (« celles », « la jeune bête ») maintiennent l’image des bêtes du troupeau. « Car voici » rend כי הנה avec une solennité prophétique naturelle, tandis que les notes signalent les principales ambiguïtés lexicales sans surcharger le verset.
