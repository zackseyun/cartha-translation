  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יַּעַן הַ/מַּלְאָ֞ךְ הַ/דֹּבֵ֥ר בִּ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י הֲ/ל֥וֹא יָדַ֖עְתָּ מָה הֵ֣מָּה אֵ֑לֶּה וָ/אֹמַ֖ר לֹ֥א אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/005.yaml
  text: Then the angel who was speaking with me answered and said to me[a], “Do you not know what these are?” And I said, “No[b], my lord.”
translation:
  language: fr
  text: 'Alors l’ange qui me parlait me répondit : « Ne sais-tu pas ce que c’est ? » Je dis : « Non, mon seigneur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « monsieur ». L’hébreu dit « mon seigneur » : c’est ici une formule de respect adressée à l’ange, et non une désignation du SEIGNEUR.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: me répondit
  rationale: Le verbe ענה introduit ici la réponse de l’ange. En français, « me répondit » rend naturellement la formule hébraïque sans devoir conserver le redondant « répondit et me dit ».
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: Dans le récit visionnaire, מַלְאָךְ désigne l’interprète céleste plutôt qu’un messager humain.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: Le participe exprime l’échange en cours. Avec דבר, le ב pronominal a ici une valeur relationnelle que le français rend naturellement par « parler à quelqu’un ».
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Ne sais-tu pas
  rationale: Cette formulation conserve la question négative du texte hébreu et son caractère rhétorique sans en préciser excessivement le ton.
- source_word: מָה הֵמָּה אֵלֶּה
  choice: ce que c’est
  rationale: Le pluriel hébreu renvoie aux éléments de la vision pris ensemble. Le singulier neutre idiomatique « ce que c’est » convient en français et conserve la demande d’identification ou de signification.
- source_word: לֹא
  choice: Non
  rationale: La réponse hébraïque est une simple négation; « Non » en préserve la brièveté, le verbe étant compris d’après la question.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Le terme est une adresse respectueuse à l’ange. « Mon seigneur » maintient la nuance honorifique du mot source; la minuscule évite de l’identifier au titre divin.
theological_decisions:
- issue: Référent et portée de אֲדֹנִי
  choice: 'Adresse respectueuse à l’ange interprète : « mon seigneur »'
  alternative: « monsieur » ou « maître »
  rationale: Le contexte fait de l’ange l’interlocuteur de Zacharie; le terme ne désigne pas ici YHWH. La minuscule et une note explicative préservent à la fois l’honneur exprimé et la distinction théologique.
translation_notes:
  register: Français moderne, naturel et digne. La formulation évite la répétition peu idiomatique « répondit et me dit », tout en conservant la progression du dialogue et la question négative de l’hébreu.
