base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/002.yaml
  text: And he said to me, “What do you see?” And I said, “I see, and behold, a lampstand all of gold, with its bowl on top of it, and seven lamps on it, with seven and seven spouts for the lamps that are on top of it.”
translation:
  language: fr
  text: 'Il me dit : « Que vois-tu ? » Je répondis : « J’ai vu, et voici : un porte-lampes tout en or, avec un bol à son sommet et sept lampes sur lui, ainsi que sept et sept conduits pour les lampes qui sont à son sommet[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « sept et sept conduits ». Cette expression inhabituelle est souvent comprise au sens de sept conduits pour chacune des sept lampes.
    reason: Préserve dans le texte l’ambiguïté de la construction hébraïque tout en indiquant son interprétation distributive fréquente.
lexical_decisions:
- source_word: מְנוֹרַת
  choice: porte-lampes
  rationale: Désigne ici un support muni de plusieurs lampes; « porte-lampes » évite d’identifier à tort l’objet à une simple lampe ou à un chandelier à bougies.
- source_word: גֻלָּהּ
  choice: réservoir
  rationale: Dans le contexte de l’alimentation des lampes en huile, le récipient placé au sommet fonctionne comme un réservoir; ce terme naturel rend mieux l’objet que le calque « coupe ».
- source_word: מוּצָקוֹת
  choice: conduits
  rationale: Le nom rare désigne vraisemblablement des canaux ou tubes acheminant l’huile vers les lampes. « Conduits » conserve cette idée sans préciser indûment leur forme.
- source_word: רָאִיתִי וְהִנֵּה
  choice: Je regarde, et voici
  rationale: Cette tournure rend la vivacité de la vision et le présent hébreu de perception, tout en conservant le marqueur déictique וְהִנֵּה.
theological_decisions:
- issue: Nombre de conduits associé aux sept lampes
  choice: sept conduits pour chacune des lampes
  alternative: sept et sept conduits pour les lampes
  rationale: La répétition distributive שִׁבְעָה וְשִׁבְעָה est comprise comme sept conduits par lampe, soit quarante-neuf au total. Une note signale l’ambiguïté syntaxique réelle sans la masquer.
translation_notes:
  register: Français moderne, international et digne. La description technique reste claire sans transformer les éléments de la vision en objets modernes trop précisément définis.
