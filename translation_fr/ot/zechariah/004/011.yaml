  - severity: low
    issue: « Porte-lampes » est moins naturel que « chandelier » dans ce contexte biblique français.
    rationale: Le français biblique et courant désigne normalement une מְנוֹרָה par « chandelier ». Ce terme conserve le référent d’un support à lampes.
