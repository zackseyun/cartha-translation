  source_fidelity: La question et les deux repères spatiaux sont fidèlement rendus. Toutefois, « repris la parole et lui demandai » atténue la double formule narrative וָאַעַן וָאֹמַר (« je répondis et dis ») et remplace le verbe générique « dire » par « demander ».
  naturalness: « Je répondis et lui dis » reste naturel dans un registre biblique moderne et rend la formule source sans lourdeur excessive. « Chandelier » est le terme français usuel et clair pour la מְנוֹרָה dans ce contexte; « porte-lampes » est compréhensible, mais moins idiomatique.
  terminology: « Oliviers » est exact, puisqu’il ne s’agit pas des branches du verset suivant. « Chandelier » rend adéquatement מְנוֹרָה sans imposer une interprétation religieuse particulière. La formulation « Que sont » préserve la question ouverte sur leur nature ou leur rôle.
