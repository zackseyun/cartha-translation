base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/011.yaml
  text: Then I answered and said to him[a], “What are these two olive trees on the right of the lampstand and on its left?”
translation:
  language: fr
  text: 'Alors je répondis et lui dis : « Que sont ces deux oliviers, à droite du chandelier et à sa gauche ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר אֵלָיו
  choice: Je repris la parole et lui demandai
  rationale: La formule hébraïque, littéralement « je répondis et lui dis », introduit ici une nouvelle question dans le dialogue. « Reprendre la parole » rend naturellement l’enchaînement, tandis que « demander » explicite la valeur interrogative sans modifier le contenu.
- source_word: מַה
  choice: Que sont
  rationale: Le pronom interrogatif porte sur les deux oliviers. « Que sont » conserve une question sur leur nature ou leur signification, sans la réduire à leur identité.
- source_word: שְׁנֵי הַזֵּיתִים הָאֵלֶּה
  choice: ces deux oliviers
  rationale: זֵיתִים désigne ici des oliviers entiers, non des branches, lesquelles sont évoquées au verset suivant par un autre terme.
- source_word: עַל יְמִין הַמְּנוֹרָה
  choice: à droite du porte-lampes
  rationale: Dans cette relation spatiale, עַל indique la position par rapport au porte-lampes plutôt qu’un contact au-dessus de lui. « À droite de » est idiomatique en français.
- source_word: הַמְּנוֹרָה
  choice: le porte-lampes
  rationale: מְנוֹרָה désigne le support portant les lampes. « Porte-lampes » traduit le nom commun sans recourir à une translittération.
- source_word: וְעַל שְׂמֹאולָהּ
  choice: et à sa gauche
  rationale: Le suffixe féminin renvoie au porte-lampes. Cette formulation conserve le parallélisme spatial de l’hébreu dans un français naturel.
theological_decisions:
- issue: Nature ou signification symbolique des deux oliviers
  choice: Que sont ces deux oliviers
  alternative: Que représentent ces deux oliviers
  rationale: Le texte demande littéralement ce qu’ils sont. Il ne faut pas imposer dès la question une lecture symbolique que la suite du dialogue précisera.
translation_notes:
  register: Français moderne, international et digne. La formule hébraïque redondante « répondis et dis » est rendue idiomatiquement, sans ajouter l’antécédent du pronom « lui » ni interpréter les oliviers.
