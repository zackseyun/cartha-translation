id: ZEC.4.9
reference: Zechariah 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְדֵ֣י זְרֻבָּבֶ֗ל יִסְּד֛וּ הַ/בַּ֥יִת הַ/זֶּ֖ה וְ/יָדָ֣י/ו תְּבַצַּ֑עְנָה וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/009.yaml
  text: The hands of Zerubbabel laid the foundation of this house[a], and his hands will complete it[b]. Then you will know that Yahweh of Armies has sent me to you.
translation:
  language: fr
  text: Les mains de Zorobabel ont posé les fondations de cette maison[a], et ses mains l’achèveront. Alors tu sauras que Yahweh des armées m’a envoyé vers vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Cette maison » désigne le Temple.
    reason: cultural_note
  - marker: b
    text: L’hébreu passe ici du singulier (« tu sauras ») au pluriel (« vers vous »).
    reason: grammatical_note
lexical_decisions:
- source_word: יְדֵי זְרֻבָּבֶל
  choice: Les mains de Zorobabel
  rationale: Conserve l’image répétée des « mains », qui souligne que Zorobabel commencera et achèvera personnellement l’ouvrage.
- source_word: יִסְּדוּ
  choice: ont posé les fondations de
  rationale: Dans ce contexte de construction, le verbe יסד désigne précisément la pose des fondations; cette tournure est naturelle en français moderne.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Traduit littéralement בַּיִת tout en conservant sa résonance théologique; le contexte indique qu’il s’agit du Temple.
- source_word: וְיָדָיו תְּבַצַּעְנָה
  choice: et ses mains l’achèveront
  rationale: Maintient la reprise emphatique des « mains » et rend le verbe par l’idée de mener la construction à son terme. Le pronom « l’ » reprend naturellement « cette maison ».
- source_word: וְיָדַעְתָּ
  choice: Alors tu sauras
  rationale: « Alors » exprime la conséquence annoncée dans le discours prophétique; le tutoiement marque le singulier de la forme hébraïque.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Rend directement le nom divin יהוה par « Yahweh » et traduit צְבָאוֹת selon son sens courant plutôt que par le traditionnel « armées célestes » ou « puissances ».
- source_word: שְׁלָחַנִי
  choice: m’a envoyé
  rationale: Le passé composé exprime un envoi accompli dont la validité demeure au moment où le signe sera reconnu.
- source_word: אֲלֵיכֶם
  choice: vers vous
  rationale: La préposition אֶל exprime la direction de l’envoi. « Vous » rend le pluriel hébreu et fait ressortir le passage du destinataire singulier à un groupe.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Traduction du titre צְבָאוֹת
  choice: des armées
  alternative: des puissances
  rationale: « Des armées » traduit directement le pluriel hébreu et conserve la dimension souveraine et guerrière du titre sans en restreindre arbitrairement la référence.
- issue: Identification de « cette maison »
  choice: Conserver « maison » dans le texte et préciser en note qu’il s’agit du Temple
  alternative: traduire directement par « ce Temple »
  rationale: Le contexte vise bien le Temple, mais le maintien de « maison » respecte le lexème hébreu et sa portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme des « mains » et le changement de nombre dans les destinataires. Le nom « Zorobabel » suit l’usage biblique français courant.
