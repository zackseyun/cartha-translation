lexical_decisions:
- source_word: וַיְהִי
  choice: Puis … me fut adressée
  rationale: La construction narrative marque ici une nouvelle étape. En français actuel, « Puis » exprime naturellement la succession, tandis que « me fut adressée » rend idiomatiquement la formule prophétique sans recourir à « il arriva que ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans l’expression construite דְבַר יְהוָה, « la parole » conserve la formule prophétique récurrente et son lien formel avec le texte source.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de rendre explicitement le tétragramme du texte hébreu.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la préposition אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le contenu de la parole divine. « En ces termes » remplit cette fonction avec naturel avant les paroles qui suivent.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin YHWH. La translittération « Yahweh » préserve le nom personnel tout en signalant en note la convention française traditionnelle.
translation_notes:
  register: Français moderne, sobre et digne. La tournure prophétique est rendue idiomatiquement, et les deux-points annoncent directement le contenu de la parole au verset suivant.
