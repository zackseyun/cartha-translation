base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/012.yaml
  text: Then I answered a second time and said to him[a], “What are these two olive branches that are beside the two golden pipes[c][b], which pour out the gold from themselves?”
translation:
  language: fr
  text: 'Je répondis une seconde fois et lui dis : « Que sont ces deux rameaux d’olivier[a] qui, à côté des deux conduits d’or[b], déversent d’eux-mêmes l’or[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces deux grappes [ou panicules] des oliviers ». Le terme hébreu est inhabituel ici et peut désigner des pousses d’olivier portant leurs fruits plutôt que de grands rameaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « les deux tubes d’or » ou « les deux tuyaux d’or ». Le mot hébreu est rare.
    reason: lexical_alternative
  - marker: c
    text: Il s’agit probablement de l’huile dorée ; l’hébreu dit littéralement « l’or ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן שֵׁנִית
  choice: Je repris la parole une seconde fois
  rationale: Le wayyiqtol poursuit le récit et שֵׁנִית marque explicitement une seconde intervention. « Repris la parole » rend naturellement ענה dans ce dialogue sans transformer le verbe en « demander ».
- source_word: וָאֹמַר אֵלָיו
  choice: et lui dis
  rationale: Conserve le sens direct de « dire à lui » tout en employant une tournure française naturelle et digne.
- source_word: שְׁתֵּי שִׁבֲּלֵי הַזֵּיתִים
  choice: ces deux rameaux d’olivier
  rationale: שִׁבֲּלֵי est inhabituel pour l’olivier et désigne normalement des épis ou panicules. « Rameaux » donne une image botanique intelligible sans exclure l’idée de pousses fructifères, signalée en note.
- source_word: אֲשֶׁר בְּיַד
  choice: à côté de
  rationale: Littéralement « à la main de »; dans cette description spatiale, l’expression signifie naturellement « auprès de » ou « à côté de ».
- source_word: שְׁנֵי צַנְתְּרוֹת הַזָּהָב
  choice: les deux conduits d’or
  rationale: Le terme rare צַנְתְּרוֹת désigne vraisemblablement des tubes ou canaux assurant l’écoulement. « Conduits » reste assez général pour ne pas préciser à tort la forme exacte, tandis que « d’or » conserve la construction hébraïque.
- source_word: הַמְרִיקִים
  choice: qui déversent
  rationale: Le participe exprime l’action de vider ou de faire couler. « Déversent » convient au mouvement du liquide dans la vision.
- source_word: מֵעֲלֵיהֶם
  choice: d’eux-mêmes
  rationale: La tournure difficile signifie littéralement quelque chose comme « de dessus eux » ou « depuis eux ». « D’eux-mêmes » maintient l’idée que les rameaux sont la source, sans reconstruire le mécanisme de façon trop précise.
- source_word: הַזָּהָב
  choice: l’or
  rationale: Le texte hébreu dit littéralement « l’or ». La traduction garde cette image surprenante plutôt que d’introduire directement l’interprétation probable « l’huile dorée ».
theological_decisions:
- issue: Identification de « l’or » dans la vision du chandelier
  choice: Maintenir « l’or » dans le texte principal
  alternative: Traduire « l’huile dorée » ou « l’huile couleur d’or »
  rationale: Le référent est probablement l’huile, mais le langage visionnaire emploie explicitement « l’or ». Conserver ce terme respecte l’image et son ambiguïté sans imposer l’explication dans le texte.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Le texte conserve le caractère énigmatique de la vision, notamment « l’or », et place les explications lexicales dans les notes.
