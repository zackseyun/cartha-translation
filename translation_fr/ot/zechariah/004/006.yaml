  text: וַ/יַּ֜עַן וַ/יֹּ֤אמֶר אֵלַ/י֙ לֵ/אמֹ֔ר זֶ֚ה דְּבַר יְהוָ֔ה אֶל זְרֻבָּבֶ֖ל לֵ/אמֹ֑ר לֹ֤א בְ/חַ֨יִל֙ וְ/לֹ֣א בְ/כֹ֔חַ כִּ֣י אִם בְּ/רוּחִ֔/י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/006.yaml
  text: 'Then he answered and said to me[a], “This is the word of Yahweh to Zerubbabel: ‘Not by might, nor by power[b], but by my Spirit,’ says Yahweh of Armies.”'
translation:
  language: fr
  text: 'Alors il me répondit : « Voici la parole de Yahweh adressée à Zorobabel : Ce n’est ni par la force[a] ni par la puissance, mais par mon Esprit, dit Yahweh des armées[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner une armée ou une force militaire.
    reason: lexical_alternative
  - marker: b
    text: 'Formulation traditionnelle : « le SEIGNEUR des armées » ; le titre hébreu peut évoquer des armées terrestres ou célestes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: Alors il me répondit
  rationale: La succession des verbes introduit la réponse. Cette formulation française restitue naturellement la progression narrative sans reproduire lourdement « répondit, dit… en disant ».
- source_word: זֶה דְּבַר יְהוָה
  choice: Voici la parole de Yahweh
  rationale: « Parole » conserve la formule prophétique et ses résonances, tandis que « voici » introduit naturellement le message en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֶל זְרֻבָּבֶל
  choice: adressée à Zorobabel
  rationale: La préposition אֶל désigne ici le destinataire de la parole prophétique.
- source_word: לֹא בְחַיִל
  choice: Ce n’est ni par la force
  rationale: חַיִל couvre la force, les ressources et notamment la force militaire. « Force » garde une portée assez large, tandis qu’une note signale la nuance militaire.
- source_word: וְלֹא בְכֹחַ
  choice: ni par la puissance
  rationale: כֹּחַ désigne la force ou la puissance. « Puissance » forme en français un parallélisme clair sans effacer la proximité sémantique des deux termes hébreux.
- source_word: כִּי אִם בְּרוּחִי
  choice: mais par mon Esprit
  rationale: La construction כִּי אִם marque le contraste. Le contexte et le suffixe divin favorisent « mon Esprit »; « par » conserve la valeur instrumentale commune aux trois membres.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: dit Yahweh des armées
  rationale: « Dit » rend simplement la formule prophétique. « Des armées » traduit צְבָאוֹת de façon intelligible tout en conservant les connotations militaires et célestes du titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme comme nom propre; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de רוּחִי
  choice: mon Esprit
  alternative: mon souffle
  rationale: « Souffle » reste lexicalement possible pour רוּחַ, mais le contraste entre les capacités humaines et l’action propre de Yahweh favorise ici « mon Esprit ». La majuscule relève de l’usage typographique français et ne tranche pas davantage que le contexte.
- issue: Rendu du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh des puissances célestes
  rationale: La traduction retenue préserve l’image concrète et la possible portée à la fois terrestre et céleste, sans réduire explicitement le titre aux seuls êtres célestes.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme bref et solennel de l’oracle est conservé; les guillemets imbriqués distinguent la parole adressée à Zorobabel du récit-cadre.
