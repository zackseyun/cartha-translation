  text: וַ/יֹּ֤אמֶר אֵלַ/י֙ לֵ/אמֹ֔ר הֲ/ל֥וֹא יָדַ֖עְתָּ מָה אֵ֑לֶּה וָ/אֹמַ֖ר לֹ֥א אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/013.yaml
  text: Then he said to me[a], “Do you not know what these are?” And I said, “No, my lord.”
translation:
  language: fr
  text: 'Il me dit alors : « Ne sais-tu pas ce que sont ces choses ? » Je répondis : « Non, mon seigneur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monsieur ». L’hébreu אֲדֹנִי est ici une formule de respect signifiant « mon seigneur » ; elle s’adresse à l’interlocuteur de la vision et ne correspond pas au nom divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: Il me dit alors
  rationale: Le wayyiqtol fait progresser le récit; « alors » restitue naturellement la succession. L’infinitif quotatif לֵאמֹר n’est pas exprimé séparément en français devant un discours direct.
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Ne sais-tu pas
  rationale: La question négative attend normalement une réponse affirmative; cette formulation en conserve la forme et la force rhétorique.
- source_word: מָה אֵלֶּה
  choice: ce que c’est
  rationale: Dans ce contexte, אֵלֶּה renvoie collectivement aux éléments de la vision; le singulier neutre français « ce » est idiomatique sans préciser davantage leur identité.
- source_word: וָאֹמַר לֹא
  choice: 'Je répondis : « Non »'
  rationale: « Répondis » rend naturellement la prise de parole en réponse à une question, tandis que « Non » conserve l’ellipse de l’hébreu.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit ici d’une formule respectueuse adressée à l’interlocuteur de la vision, et non du nom divin. La minuscule évite cette confusion tout en gardant la dignité du terme.
theological_decisions:
- issue: Valeur de אֲדֹנִי dans l’adresse finale
  choice: mon seigneur
  alternative: monsieur
  rationale: Le contexte indique une adresse respectueuse à l’interprète de la vision, sans identifier le terme au nom divin. « Mon seigneur » préserve plus directement le sens honorifique de אֲדֹנִי; une note signale l’équivalent français plus courant.
translation_notes:
  register: Français moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque; le dialogue reste direct et concis.
