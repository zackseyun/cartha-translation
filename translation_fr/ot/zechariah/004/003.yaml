  text: And two olive trees were beside it[b][a], one on the right of the bowl and one on its left.
translation:
  language: fr
  text: 'Et il y avait deux oliviers près du chandelier[a] : l’un à droite de la coupe[b], l’autre à sa gauche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur lui » ou « au-dessus de lui » ; la préposition hébraïque a un sens spatial plus large. Les précisions qui suivent, « à droite de la coupe » et « à sa gauche », favorisent ici l’idée de proximité latérale.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la coupe, ou du réservoir, placée au sommet du chandelier dans la vision.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁנַיִם
  choice: Et deux
  rationale: Le waw poursuit naturellement la description de la vision, et le nombre cardinal est conservé explicitement.
- source_word: זֵיתִים
  choice: oliviers
  rationale: Dans ce cadre spatial de la vision, le nom désigne des arbres, non des olives.
- source_word: עָלֶיהָ
  choice: à côté d’elle
  rationale: La préposition עַל possède une gamme spatiale plus large que le strict « sur ». Les indications « à droite » et « à gauche » favorisent ici la proximité latérale, tout en justifiant une note signalant les autres possibilités.
- source_word: אֶחָד ... וְ/אֶחָד
  choice: l’un ... et l’autre
  rationale: Cette tournure française rend naturellement la distribution équilibrée des deux oliviers.
- source_word: מִ/ימִין הַ/גֻּלָּה
  choice: à droite de la vasque
  rationale: גֻּלָּה désigne ici le récipient arrondi associé au chandelier. « Vasque » évoque clairement sa forme et convient au registre de la vision.
- source_word: עַל שְׂמֹאלָהּ
  choice: à sa gauche
  rationale: La formulation concise conserve le parallélisme spatial avec « à droite de la vasque ».
