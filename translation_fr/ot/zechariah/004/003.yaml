  - severity: low
    issue: « Vasque » est un terme français moins approprié
    rationale: En français moderne, « vasque » évoque volontiers un bassin large ou décoratif. « Coupe » convient mieux à un récipient associé à un chandelier et reste compatible avec le sens de גֻלָּה.
