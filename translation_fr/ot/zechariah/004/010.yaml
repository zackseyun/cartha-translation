  text: כִּ֣י מִ֣י בַז֮ לְ/י֣וֹם קְטַנּוֹת֒ וְ/שָׂמְח֗וּ וְ/רָא֞וּ אֶת הָ/אֶ֧בֶן הַ/בְּדִ֛יל בְּ/יַ֥ד זְרֻבָּבֶ֖ל שִׁבְעָה אֵ֑לֶּה עֵינֵ֣י יְהוָ֔ה הֵ֥מָּה מְשׁוֹטְטִ֖ים בְּ/כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/010.yaml
  text: For who has despised the day of small things? For these seven will rejoice and will see the plumb stone in the hand of Zerubbabel—these are the eyes of Yahweh[a], ranging through all the earth.
translation:
  language: fr
  text: 'Car qui a méprisé le jour des petites choses ? Ces sept se réjouiront et verront le poids du fil à plomb[a] dans la main de Zorobabel : ce sont les yeux de Yahweh, qui parcourent toute la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la pierre d’étain » ; traditionnellement « le fil à plomb ». Dans ce contexte de construction, l’expression désigne probablement le poids d’un fil à plomb ou une pierre servant à mesurer.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַז
  choice: a méprisé
  rationale: Le verbe exprime le fait de tenir quelque chose pour insignifiant ou digne de mépris. « A méprisé » conserve la force de la question rhétorique.
- source_word: לְיוֹם קְטַנּוֹת
  choice: le jour des petites choses
  rationale: Cette formulation reste proche de l’expression hébraïque, littéralement « jour des petites choses/petitetés », sans la limiter implicitement aux seuls débuts.
- source_word: וְשָׂמְחוּ וְרָאוּ
  choice: Ils se réjouiront et verront
  rationale: Les deux verbes coordonnés sont rendus explicitement et comme des futurs contextuels. Le pronom anticipe « ces sept-là », conformément à l’ordre inhabituel mais intelligible de l’hébreu.
- source_word: הָאֶבֶן הַבְּדִיל
  choice: le poids du fil à plomb
  rationale: בְּדִיל peut désigner l’étain, mais, dans ce contexte de construction, l’expression évoque vraisemblablement le poids d’un fil à plomb. La traduction rend la fonction de l’objet, tandis que la note conserve l’autre possibilité lexicale.
- source_word: בְּיַד זְרֻבָּבֶל
  choice: dans la main de Zorobabel
  rationale: Traduction directe qui souligne le rôle actif de Zorobabel et conserve l’image hébraïque.
- source_word: שִׁבְעָה אֵלֶּה
  choice: ces sept-là
  rationale: Le démonstratif renvoie aux sept éléments déjà présents dans la vision. La tournure française permet leur identification appositionnelle avec les yeux de Yahweh.
- source_word: עֵינֵי יְהוָה
  choice: les yeux de Yahweh
  rationale: La traduction conserve l’image théologiquement importante et rend le tétragramme par le nom personnel « Yahweh ».
- source_word: מְשׁוֹטְטִים בְּכָל הָאָרֶץ
  choice: qui parcourent toute la terre
  rationale: Le participe décrit un mouvement continu et étendu à l’ensemble de la terre. « Parcourent » est naturel en français actuel.
theological_decisions:
- issue: Identité de « ces sept-là »
  choice: La traduction présente « ces sept-là » comme identifiés appositionnellement aux yeux de Yahweh.
  alternative: Comprendre d’abord les sept comme les sept lampes, ensuite symboliquement associées aux yeux de Yahweh.
  rationale: La syntaxe place « ces sept » immédiatement devant « les yeux de Yahweh ». La formulation conserve ce lien symbolique sans préciser davantage l’identité des sept que ne le fait le verset.
- issue: Antécédent des verbes « se réjouiront et verront »
  choice: Le pronom « ils » anticipe « ces sept-là », identifiés ensuite aux yeux de Yahweh.
  alternative: Comprendre comme sujet implicite les personnes qui avaient méprisé le jour des petites choses.
  rationale: L’accord masculin pluriel et la proximité de שִׁבְעָה אֵלֶּה favorisent les sept comme sujet, mais l’ordre de la phrase hébraïque demeure difficile. La traduction suit cette lecture sans ajouter une catégorie humaine absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure légèrement anticipative « Ils… — ces sept-là » conserve l’ordre et la tension syntaxique de l’hébreu tout en restant compréhensible. Le nom « Yahweh » est maintenu comme nom personnel divin.
