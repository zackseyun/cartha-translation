  source_fidelity: La structure oraculaire, l’adresse à la « grande montagne », sa transformation en terrain plat, les acclamations et la répétition emphatique de חֵן sont fidèlement rendues. Cependant, « pierre de faîte » tranche en faveur d’une pierre placée au sommet, alors que הָאֶבֶן הָרֹאשָׁה signifie littéralement « la pierre de tête » et que sa fonction architecturale précise demeure discutée.
  naturalness: Le français est globalement naturel et concis. « Il fera sortir » est possible, mais « fera paraître » est plus idiomatique en français pour la production solennelle d’une pierre dans ce contexte, sans préciser indûment son mode de pose. « Grâce, grâce sur elle ! » conserve la concision acclamative et rend plus naturellement l’invocation de faveur que « pour elle ».
  terminology: « Zorobabel » est la forme française usuelle. « Pierre principale » rend le caractère éminent de la pierre sans imposer l’interprétation de « pierre de faîte »; la note maintient le littéral et l’alternative architecturale. « Grâce » conserve la portée de חֵן, avec « faveur » et « beauté/charme » signalés en note.
