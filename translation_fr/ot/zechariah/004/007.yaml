base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/007.yaml
  text: Who are you[a], O great mountain? Before Zerubbabel you will become a plain. And he will bring out the top stone amid shouts of, ‘Grace[b], grace to it!’
translation:
  language: fr
  text: 'Qui es-tu, grande montagne ? Devant Zorobabel, tu deviendras une plaine. Il fera paraître la pierre principale[a] au milieu des acclamations : « Grâce, grâce sur elle ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la pierre de tête ». Autre traduction possible : « la pierre de faîte » ou « la pierre sommitale ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Faveur, faveur sur elle ! » Le mot hébreu peut aussi évoquer le charme ou la beauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר הַגָּדוֹל
  choice: grande montagne
  rationale: Conserve l’image métaphorique de l’obstacle et l’adresse directe, sans ajouter de particule vocative absente de l’hébreu.
- source_word: לְמִישֹׁר
  choice: tu deviendras une plaine
  rationale: מִישׁוֹר désigne un terrain plat ou une plaine. Cette formulation préserve l’image d’une transformation.
- source_word: וְהוֹצִיא
  choice: il fera sortir
  rationale: Le sujet implicite est vraisemblablement Zorobabel dans le contexte. Le factitif rend la forme hiphil du verbe יצא sans préciser davantage la manière dont la pierre sera mise en place.
- source_word: הָאֶבֶן הָרֹאשָׁה
  choice: la pierre de faîte
  rationale: L’expression signifie littéralement « la pierre de tête ». « Pierre de faîte » communique clairement sa fonction architecturale probable tout en évitant de l’identifier à une pierre de fondation.
- source_word: תְּשֻׁאוֹת
  choice: au milieu des acclamations
  rationale: Le nom évoque des cris retentissants. « Acclamations » exprime naturellement leur caractère public et célébratif.
- source_word: חֵן חֵן לָהּ
  choice: « Grâce, grâce pour elle ! »
  rationale: חֵן peut signifier grâce, faveur, charme ou beauté. La répétition emphatique est conservée, et le pronom féminin renvoie naturellement à la pierre.
theological_decisions:
- issue: Sens de חֵן dans l’acclamation
  choice: La grâce ou faveur est invoquée ou célébrée en faveur de la pierre.
  alternative: L’acclamation attribue beauté ou charme à la pierre.
  rationale: Le contexte prophétique de l’achèvement du Temple favorise l’idée de faveur, mais le champ sémantique du terme reste assez large; une note préserve donc l’autre possibilité sans imposer une lecture doctrinale étroite.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse directe faite à la montagne. La syntaxe brève et la répétition de l’acclamation conservent la force oraculaire du texte hébreu.
