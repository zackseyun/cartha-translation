  - severity: low
    issue: « Grâce, grâce pour elle ! » est moins idiomatique en français dans une acclamation.
    rationale: « Grâce, grâce sur elle ! » exprime plus naturellement l’idée de faveur invoquée ou proclamée à l’égard de la pierre, tout en restant concis.
