source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֵ֖לֶּה שְׁנֵ֣י בְנֵֽי הַ/יִּצְהָ֑ר הָ/עֹמְדִ֖ים עַל אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/014.yaml
  text: And he said[a], “These are the two sons of oil[b], who stand by the Lord of all the earth.”
translation:
  language: fr
  text: 'Il dit : « Ce sont les deux fils de l’huile[a], qui se tiennent auprès[b] du Seigneur de toute la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les deux consacrés par l’onction ». L’expression hébraïque signifie littéralement « les deux fils de l’huile ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qui se tiennent devant le Seigneur de toute la terre ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol de אמר poursuit simplement le récit. En français, « Il dit » rend naturellement cette introduction sans alourdir la séquence par un connecteur inutile.
- source_word: אֵלֶּה שְׁנֵי
  choice: Ce sont les deux
  rationale: Le démonstratif pluriel est employé comme prédicat avec une copule sous-entendue, que le français exprime par « Ce sont ». L’article défini renvoie aux deux figures déjà présentes dans la vision.
- source_word: בְּנֵי הַיִּצְהָר
  choice: fils de l’huile
  rationale: Cette formulation conserve la métaphore hébraïque inhabituelle. יִצְהָר désigne l’huile, notamment l’huile d’olive; traduire directement par « consacrés par l’onction » lèverait une ambiguïté que le texte maintient.
- source_word: הָעֹמְדִים
  choice: qui se tiennent
  rationale: Le participe décrit leur position ou leur fonction continue. « Se tenir » convient mieux que le simple « être debout » dans ce contexte de présence auprès d’un souverain.
- source_word: עַל
  choice: auprès
  rationale: Avec le verbe « se tenir », la préposition exprime ici la présence ou le service auprès d’un supérieur. « Auprès » est naturel en français, tandis que « devant » demeure une possibilité signalée en note.
- source_word: אֲדוֹן
  choice: Seigneur
  rationale: Le titre exprime l’autorité souveraine. « Seigneur » est la formulation française appropriée dans ce contexte exalté.
- source_word: כָּל הָאָרֶץ
  choice: de toute la terre
  rationale: La tournure exprime une souveraineté universelle et se rend directement et naturellement ainsi en français.
theological_decisions:
- issue: Interprétation de בְּנֵי הַיִּצְהָר
  choice: Conserver dans le texte l’image « les deux fils de l’huile ».
  alternative: « les deux consacrés par l’onction » ou « les deux oints »
  rationale: L’expression hébraïque n’est pas le terme ordinaire signifiant « oints ». La métaphore est donc maintenue afin de ne pas imposer une identification théologique plus précise que celle du texte; l’interprétation courante est donnée en note.
- issue: Nuance de עַל avec הָעֹמְדִים
  choice: « se tiennent auprès du Seigneur »
  alternative: « se tiennent devant le Seigneur »
  rationale: « Auprès » exprime clairement la proximité et le service, tandis que « devant » peut mieux faire ressortir la présence à la cour du souverain. La note préserve cette seconde nuance possible.
translation_notes:
  register: Français international moderne, clair et digne. L’étrangeté volontaire de « fils de l’huile » reflète celle de l’hébreu; les notes offrent les interprétations usuelles sans les imposer au texte principal.
