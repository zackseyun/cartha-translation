  yaml_path: translation/ot/zechariah/004/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: fr
  text: 'Alors je répondis et dis à l’ange qui parlait avec moi[a] : « Que sont ces choses, mon seigneur ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui s’entretenait avec moi ». Cette expression hébraïque revient dans Zacharie pour désigner l’ange qui accompagne le prophète et lui parle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן
  choice: Alors je pris la parole
  rationale: Le wayyiqtol de ענה introduit ici la réaction du prophète. « Alors » rend la progression narrative, et « je pris la parole » restitue naturellement en français l’idée de répondre sans supposer nécessairement une question préalable.
- source_word: וָאֹמַר
  choice: et dis
  rationale: אמר est le verbe courant pour « dire ». Conserver un second verbe après וָאַעַן reflète le doublet hébreu tout en restant idiomatique en français.
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: מלאך peut désigner un messager, mais le contexte visionnaire de Zacharie présente ici un être céleste qui interprète la vision.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: Dans cette formule récurrente de Zacharie, le participe avec בְּ décrit l’ange en train de communiquer avec le prophète. « Me parlait » est naturel et évite le littéralisme trompeur « parlait en moi ».
- source_word: לֵאמֹר
  choice: non rendu séparément
  rationale: L’infinitif introduit les paroles qui suivent. En français, les deux-points et la citation directe après « dis » remplissent déjà cette fonction.
- source_word: מָה אֵלֶּה
  choice: Que sont ces choses
  rationale: Le démonstratif pluriel renvoie aux éléments de la vision. L’ajout explicite de « choses », implicite en hébreu, produit une interrogation française claire et naturelle.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une formule de respect adressée à l’ange, et non du nom divin. La minuscule distingue cet emploi relationnel d’un titre réservé à Dieu.
theological_decisions:
- issue: Référent de אֲדֹנִי
  choice: Adresse respectueuse à l’ange, rendue par « mon seigneur » avec une minuscule.
  alternative: Comprendre ou présenter le terme comme un titre divin, « Seigneur ».
  rationale: L’interlocuteur immédiat est explicitement l’ange qui parle au prophète. La minuscule préserve la déférence du terme sans identifier l’ange à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le doublet hébreu « répondis/dis » est rendu par l’expression naturelle « pris la parole et dis ». « Mon seigneur » conserve le registre respectueux sans en faire un titre divin.
