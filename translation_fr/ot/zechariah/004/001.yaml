  yaml_path: translation/ot/zechariah/004/001.yaml
  text: Then the angel who was speaking with me returned and woke me[a], like a man who is awakened from his sleep.
translation:
  language: fr
  text: Alors l’ange qui me parlait revint et me réveilla, comme un homme que l’on réveille de son sommeil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un homme qui se réveille de son sommeil ». Le verbe hébreu peut se comprendre au sens passif (« que l’on réveille ») ou au sens réfléchi/intransitif (« qui se réveille »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime ici le retour de l’ange auprès du prophète ou la reprise de son interaction avec lui; « revint » est naturel et conserve cette idée sans imposer le sens plus spatial de « se retourna ».
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: Dans ce contexte de vision prophétique, מלאך désigne naturellement l’intermédiaire céleste; « ange » est plus clair que le terme général « messager ».
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: L’imparfait français rend naturellement le participe hébreu qui caractérise l’ange comme celui qui s’entretient avec Zacharie.
- source_word: וַיְעִירֵנִי
  choice: me réveilla
  rationale: Le hifil de עור est causatif, « réveiller »; le passé simple convient au registre narratif biblique moderne et soutenu.
- source_word: כְּאִישׁ
  choice: comme un homme
  rationale: Cette formulation conserve le substantif masculin singulier et introduit directement la comparaison.
- source_word: אֲשֶׁר יֵעוֹר מִשְּׁנָתוֹ
  choice: que l’on réveille de son sommeil
  rationale: Le nifal peut avoir une valeur passive ou réflexive. Cette formulation française préserve la valeur passive et le parallélisme avec « me réveilla ».
