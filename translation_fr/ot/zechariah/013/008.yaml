source:
  edition: WLC
  text: וְ/הָיָ֤ה בְ/כָל הָ/אָ֨רֶץ֙ נְאֻם יְהוָ֔ה פִּֽי שְׁנַ֣יִם בָּ֔/הּ יִכָּרְת֖וּ יִגְוָ֑עוּ וְ/הַ/שְּׁלִשִׁ֖ית יִוָּ֥תֶר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/008.yaml
  text: And it will happen in all the land, declares the LORD, that two-thirds in it will be cut off and die, but one-third will be left in it.
translation:
  language: fr
  text: 'Dans tout le pays, voici ce qui arrivera — déclaration de l’Éternel : les deux tiers seront retranchés et mourront, mais un tiers y restera.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְכָל־הָאָרֶץ
  choice: dans tout le pays
  rationale: Dans ce contexte prophétique, הָאָרֶץ désigne probablement le pays plutôt que la terre entière; la formulation conserve néanmoins la portée territoriale sans la préciser davantage.
- source_word: פִּי שְׁנַיִם
  choice: les deux tiers
  rationale: L’expression idiomatique signifie littéralement « une part de deux » et, en contraste avec הַשְּׁלִשִׁית, désigne clairement deux tiers.
- source_word: יִכָּרְתוּ
  choice: seront retranchés
  rationale: Le verbe כרת exprime ici une suppression violente ou un retranchement; ce choix garde la force de l’image sans ajouter le moyen de la mort.
- source_word: יִגְוָעוּ
  choice: mourront
  rationale: גוע signifie expirer ou mourir; « mourront » est direct, naturel et distinct du retranchement précédent.
- source_word: יִוָּתֶר
  choice: subsistera
  rationale: Le niphal de יתר indique ce qui demeure après le jugement; « subsistera » exprime à la fois la survie et le fait de rester.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat de Zacharie 12–14 concerne principalement le territoire et le peuple de Juda; la traduction évite toutefois d’identifier explicitement une région non nommée dans ce verset.
- issue: Relation entre « retranchés » et « mourront »
  choice: deux verbes coordonnés
  alternative: fusionner en « seront retranchés par la mort »
  rationale: Le texte hébreu emploie deux verbes successifs. Les conserver respecte l’intensification et n’impose pas une relation interprétative plus précise.
- issue: Identité du tiers restant
  choice: non explicitée
  alternative: le reste fidèle sera sauvé
  rationale: Le verset parle d’un tiers qui demeure, sans qualifier ici sa fidélité ni employer un vocabulaire explicite de salut; ces thèmes se développent au verset suivant.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Déclaration de l’Éternel » rend la formule prophétique נְאֻם־יְהוָה. La dislocation « voici ce qui arrivera » évite une ouverture lourde tout en conservant la valeur prospective de וְהָיָה.
