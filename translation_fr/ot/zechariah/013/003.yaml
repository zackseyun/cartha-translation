source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
translation:
  language: fr
  text: 'Et il arrivera que, si un homme prophétise encore[a], son père et sa mère, qui l’ont engendré, lui diront : « Tu ne vivras pas, car tu as proféré des mensonges au nom de Yahweh. » Alors son père et sa mère, qui l’ont engendré, le transperceront[b] pendant qu’il prophétise.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prophétise de nouveau ». Le mot hébreu עוֹד peut indiquer la continuation ou la reprise d’une action.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le perceront » ou « le poignarderont ». Le verbe hébreu désigne le fait de percer avec une arme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Et si
  rationale: Cette tournure introduit naturellement en français une éventualité future. Le contexte donne à כִּי une valeur circonstancielle ou conditionnelle, sans qu’il soit nécessaire de traduire lourdement וְהָיָה par « il arrivera que ».
- source_word: יִנָּבֵא אִישׁ עוֹד
  choice: un homme prophétise encore
  rationale: « Prophétiser » rend directement le niphal de נבא sans introduire d’emblée la fausseté, explicitée ensuite. אִישׁ reste masculin singulier, et עוֹד indique ici la continuation ou la reprise de l’activité.
- source_word: יֹלְדָיו
  choice: qui lui ont donné la vie
  rationale: Le participe désigne littéralement ceux qui l’ont engendré ou mis au monde. Cette formulation française convient aux deux parents, reste concrète et évite l’inexactitude que produirait « qui l’ont enfanté » appliqué au père.
- source_word: לֹא תִחְיֶה
  choice: Tu ne vivras pas
  rationale: Le futur français exprime avec force la sentence déclarée. Il conserve la gravité judiciaire sans ajouter un modal absent de l’hébreu.
- source_word: שֶׁקֶר דִּבַּרְתָּ
  choice: tu as proféré des mensonges
  rationale: שֶׁקֶר peut désigner le mensonge ou la fausseté. « Proférer des mensonges » rend l’accusation solennelle portée contre une parole prononcée au nom divin.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: « Au nom de » conserve la portée représentative de l’expression. Le tétragramme est translittéré « Yahweh », conformément à la décision fournie et sans le remplacer par un titre.
- source_word: וּדְקָרֻהוּ
  choice: le transperceront
  rationale: דקר désigne l’action de percer avec une arme. « Transpercer » préserve la violence explicite de l’acte sans l’atténuer.
- source_word: בְּהִנָּבְאוֹ
  choice: pendant qu’il prophétise
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle. Cette traduction maintient le lien immédiat entre l’acte de prophétiser et l’intervention des parents.
theological_decisions:
- issue: Sévérité de l’action des parents envers le faux prophète
  choice: Conserver explicitement la sentence de mort et l’acte de transpercer.
  alternative: Atténuer le passage en parlant de rejet, d’exclusion ou d’une simple blessure.
  rationale: Le texte hébreu associe sans détour « Tu ne vivras pas » à דקר, verbe de perforation violente. La traduction ne doit ni adoucir cette scène, ni ajouter une explication doctrinale qui en réduirait la tension.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme. « Yahweh » préserve ici le nom personnel conformément aux données de consultation fournies.
- issue: Qualification de la prophétie
  choice: Traduire simplement « prophétise » et laisser l’accusation ultérieure établir sa fausseté.
  alternative: Traduire dès le début « prophétise faussement ».
  rationale: 'Le verbe יִנָּבֵא ne contient pas à lui seul l’idée de fausseté. Celle-ci est formulée explicitement par les parents : « tu as proféré des mensonges ».'
translation_notes:
  register: Français international moderne, digne et direct. La phrase évite les archaïsmes tout en conservant la répétition solennelle de « son père et sa mère, qui lui ont donné la vie ». « Et si » allège l’idiome introductif hébreu sans perdre sa valeur future et conditionnelle. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
