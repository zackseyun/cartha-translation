language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵבֹ֧שׁוּ הַ/נְּבִיאִ֛ים אִ֥ישׁ מֵ/חֶזְיֹנ֖/וֹ בְּ/הִנָּֽבְאֹת֑/וֹ וְ/לֹ֧א יִלְבְּשׁ֛וּ אַדֶּ֥רֶת שֵׂעָ֖ר לְמַ֥עַן כַּחֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/004.yaml
  text: And on that day the prophets will each be ashamed of his vision when he prophesies[b][a], and they will not put on a hairy cloak in order to deceive.
translation:
  language: fr
  text: En ce jour-là, chaque prophète aura honte de sa vision lorsqu’il prophétisera. Ils ne revêtiront pas de manteau de poil[a] pour tromper[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un manteau de poils » : un vêtement rugueux associé à l’apparence des prophètes.'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour mentir ». Le verbe hébreu peut désigner le mensonge ou la tromperie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Rend naturellement la formule temporelle prophétique. Le verbe introductif וְהָיָה est intégré à la construction française sans le calque lourd « il arrivera ».
- source_word: יֵבֹשׁוּ הַנְּבִיאִים אִישׁ
  choice: chaque prophète aura honte
  rationale: La reformulation au singulier exprime clairement la valeur distributive de אִישׁ tout en conservant le terme non qualifié « prophète ».
- source_word: מֵחֶזְיֹנוֹ
  choice: de sa vision
  rationale: Avec le verbe de honte, מִן introduit ici ce dont chacun aura honte. « Vision » conserve le vocabulaire explicite du texte.
- source_word: בְּהִנָּבְאֹתוֹ
  choice: lorsqu’il prophétisera
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle; cette formulation est naturelle et respecte la référence singulière distributive.
- source_word: וְלֹא יִלְבְּשׁוּ
  choice: Ils ne revêtiront pas
  rationale: « Revêtir » rend l’action délibérée de mettre un vêtement et maintient le retour au pluriel du texte hébreu.
- source_word: אַדֶּרֶת שֵׂעָר
  choice: manteau de poil
  rationale: Désigne un vêtement extérieur rugueux ou velu associé à l’apparence prophétique. La note signale une autre formulation possible.
- source_word: לְמַעַן כַּחֵשׁ
  choice: pour tromper
  rationale: La construction exprime le but. כחש peut renvoyer au mensonge ou à la tromperie; dans ce contexte, le vêtement sert à induire autrui en erreur.
theological_decisions:
- issue: Faut-il identifier explicitement ces personnages comme de « faux prophètes » ?
  choice: Conserver « prophète » sans ajouter « faux »
  alternative: les faux prophètes
  rationale: Le contexte condamne une prophétie mensongère, mais le nom hébreu signifie simplement « prophètes ». La traduction laisse le contexte porter le jugement sans l’insérer dans le terme lui-même.
- issue: Sens de כחש dans l’expression finale
  choice: pour tromper
  alternative: pour mentir
  rationale: « Tromper » met en relief l’usage mensonger de l’apparence prophétique, tandis que la note conserve l’ambiguïté lexicale entre tromperie et mensonge.
translation_notes:
  register: Français international moderne, sobre et digne. La structure distributive hébraïque est rendue par « chaque prophète », puis le pluriel reprend avec « Ils ». Aucun qualificatif interprétatif comme « faux » n’est ajouté au texte principal.
