base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/009.yaml
  text: And I will bring the third part through the fire[a], and I will refine them as silver is refined, and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’ and he will say, ‘Yahweh is my God.’
translation:
  language: fr
  text: 'Je ferai entrer le tiers dans le feu ; je les affinerai comme on affine l’argent et je les éprouverai comme on éprouve l’or. Il invoquera mon nom, et moi, je lui répondrai. Je dirai : « Il est mon peuple »[a], et il dira : « Yahweh est mon Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici le singulier pour représenter collectivement le reste du peuple. En français plus fluide : « Ils sont mon peuple. »'
    reason: Clarifier le singulier collectif sans le supprimer du texte principal.
lexical_decisions:
- source_word: הַשְּׁלִשִׁית
  choice: le tiers
  rationale: L’ordinal féminin substantivé renvoie au tiers survivant mentionné au verset précédent. « Le tiers » exprime clairement cette part du peuple.
- source_word: בָּאֵשׁ
  choice: dans le feu
  rationale: Avec le verbe « faire entrer », la préposition situe le reste au sein du feu purificateur sans ajouter explicitement l’idée, possible mais non exprimée, d’une traversée complète.
- source_word: וּצְרַפְתִּים
  choice: je les affinerai
  rationale: Le verbe צרף désigne l’affinage des métaux. « Affiner » conserve précisément l’image métallurgique, confirmée par la comparaison avec l’argent.
- source_word: וּבְחַנְתִּים
  choice: je les éprouverai
  rationale: בחן exprime la mise à l’épreuve destinée à révéler la qualité ou l’authenticité. « Éprouver » convient au registre prophétique et au parallèle avec l’or.
- source_word: הוּא יִקְרָא בִשְׁמִי
  choice: Il invoquera mon nom
  rationale: L’expression קרא בשם désigne ici l’appel adressé à Dieu dans la prière ou le culte. « Invoquer mon nom » est naturel et précis en français.
- source_word: עַמִּי הוּא
  choice: Il est mon peuple
  rationale: La formulation conserve le pronom singulier hébreu associé au nom collectif « mon peuple », malgré son caractère marqué en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Cette traduction directe préserve la confession personnelle qui répond à la déclaration d’alliance.
theological_decisions:
- issue: Passage du pluriel au singulier pour désigner le reste
  choice: 'Conserver le singulier représentatif : « Il invoquera… je lui répondrai… Il est mon peuple… Yahweh est mon Dieu. »'
  alternative: 'Uniformiser au pluriel : « Ils invoqueront… Ils sont mon peuple… Yahweh est notre Dieu. »'
  rationale: L’hébreu passe délibérément des suffixes pluriels aux pronoms singuliers et présente ainsi le reste collectif comme une unité représentative. La traduction maintient cette tension au lieu de l’aplanir.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom propre et sa fonction dans la formule d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Les parallèles sur l’argent et l’or sont conservés, de même que le passage marqué du pluriel (« les ») au singulier (« il »), porteur de la représentation collective du reste.
