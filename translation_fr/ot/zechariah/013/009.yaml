revisions:
- from: 'Je ferai entrer le tiers dans le feu ; je les affinerai comme on affine l’argent et je les éprouverai comme on éprouve l’or. Il invoquera mon nom, et moi, je lui répondrai. Je dirai : « Il est mon peuple »[a], et lui dira : « Yahweh est mon Dieu. »'
  to: 'Je ferai entrer le tiers dans le feu ; je les affinerai comme on affine l’argent et je les éprouverai comme on éprouve l’or. Il invoquera mon nom, et moi, je lui répondrai. Je dirai : « Il est mon peuple »[a], et il dira : « Yahweh est mon Dieu. »'
  rationale: La seule révision nécessaire remplace « et lui dira » par « et il dira », afin de rendre sans ambiguïté le sujet singulier hébreu. Le reste du texte et la note conservent fidèlement l’opposition entre le pluriel initial et le singulier collectif final.
