revisions:
- from: 'Il dira : « Je ne suis pas prophète. Je suis un homme qui travaille la terre, car un homme m’a acquis dès ma jeunesse[a]. »'
  to: 'Il dira : « Je ne suis pas prophète, je suis un homme qui travaille la terre, car quelqu’un m’a acquis dès ma jeunesse[a]. »'
  rationale: La révision limitée de « un homme » en « quelqu’un » reflète mieux la valeur indéfinie de אָדָם et produit un français plus naturel. Elle maintient l’opacité historique et sociale de la proposition finale ainsi que les alternatives lexicales signalées en note.
