source:
  edition: WLC
  text: וְ/אָמַ֕ר לֹ֥א נָבִ֖יא אָנֹ֑כִי אִישׁ עֹבֵ֤ד אֲדָמָה֙ אָנֹ֔כִי כִּ֥י אָדָ֖ם הִקְנַ֥/נִי מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/005.yaml
  text: And he will say[a], ‘I am not a prophet; I am a man who works the ground, for the land has been my possession from my youth.’
translation:
  language: fr
  text: 'Il dira : « Je ne suis pas prophète, je suis un homme qui travaille la terre, car quelqu’un m’a acquis dès ma jeunesse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’a acheté dès ma jeunesse » ou « me possède depuis ma jeunesse ». Le verbe hébreu peut exprimer l’acquisition, l’achat ou la possession.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Il dira
  rationale: Dans ce discours prophétique orienté vers « ce jour-là », le waw suivi de l’accompli prend naturellement une valeur future. Le français n’a pas besoin d’ajouter systématiquement « et » en tête de phrase.
- source_word: נָבִיא
  choice: prophète
  rationale: Équivalent français courant et précis de נָבִיא dans ce contexte de rejet de la prophétie.
- source_word: אִישׁ עֹבֵד אֲדָמָה
  choice: un homme qui travaille la terre
  rationale: Cette formulation conserve אִישׁ et la valeur durative du participe עֹבֵד, tout en rendant אֲדָמָה par le terme agricole naturel « terre ».
- source_word: כִּי
  choice: car
  rationale: Introduit de façon concise l’explication donnée par le locuteur.
- source_word: אָדָם
  choice: un homme
  rationale: Le nom masculin singulier est rendu directement, sans le confondre avec אֲדָמָה, « la terre », présent plus tôt dans le verset.
- source_word: הִקְנַנִי
  choice: m’a acquis
  rationale: Le hiphil de קנה exprime ici l’acquisition et peut évoquer le fait d’acheter ou de prendre possession. « M’a acquis » préserve cette latitude, malgré le caractère volontairement inhabituel de l’expression appliquée à une personne.
- source_word: מִנְּעוּרָי
  choice: dès ma jeunesse
  rationale: Rend naturellement le point de départ temporel indiqué par מִן et évite de préciser un âge que l’hébreu ne précise pas.
theological_decisions:
- issue: Sincérité de l’identité professionnelle revendiquée
  choice: Le locuteur nie être prophète et affirme travailler la terre, sans que la traduction juge sa déclaration sincère ou mensongère.
  alternative: Préciser qu’il s’agit d’un faux prophète qui dissimule son passé, ou d’un ancien prophète qui renonce sincèrement à son activité.
  rationale: Le contexte permet plusieurs reconstructions, mais le verset lui-même ne tranche pas entre elles.
- issue: Rapport social exprimé par הִקְנַנִי
  choice: Conserver l’idée générale d’acquisition par « m’a acquis ».
  alternative: « m’a acheté », « m’a pris à son service » ou « a fait de moi son serviteur ».
  rationale: Les autres formulations fixeraient plus nettement un achat, un emploi ou une servitude, alors que le verbe hébreu et la construction demeurent ouverts.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu lorsque cette proximité est nécessaire pour conserver l’opacité réelle de la dernière proposition.
