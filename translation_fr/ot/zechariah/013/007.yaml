source:
  edition: WLC
  text: חֶ֗רֶב עוּרִ֤י עַל רֹעִ/י֙ וְ/עַל גֶּ֣בֶר עֲמִיתִ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת הַ֤ךְ אֶת הָֽ/רֹעֶה֙ וּ/תְפוּצֶ֣יןָ הַ/צֹּ֔אן וַ/הֲשִׁבֹתִ֥י יָדִ֖/י עַל הַ/צֹּעֲרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/007.yaml
  text: Awake[a], O sword, against my shepherd, against the man who is my companion, declares Yahweh of Armies. Strike the shepherd, and the sheep will be scattered[c][b]; and I will turn my hand against the little ones.
translation:
  language: fr
  text: '« Épée, réveille-toi contre mon berger,

    contre l’homme qui est mon compagnon[a] !

    — déclaration de Yahvé, le Seigneur des armées[b].


    Frappe le berger,

    et les brebis seront dispersées !

    Je tournerai ma main contre les petits[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon associé », « mon proche » ; peut-être : « mon égal ». Le terme hébreu désigne une personne étroitement liée à une autre.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « le SEIGNEUR des armées » ; on trouve aussi « le SEIGNEUR de l’univers ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Je tournerai ma main vers les petits » ou « sur les petits ». L’expression peut indiquer une action dirigée contre eux ou, plus généralement, une nouvelle intervention à leur égard.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב עוּרִי
  choice: Épée, réveille-toi
  rationale: Conserve l’apostrophe et la personnification saisissantes de l’épée. L’impératif féminin singulier correspond au genre de חֶרֶב.
- source_word: רֹעִי
  choice: mon berger
  rationale: Rend directement le participe substantivé avec suffixe de première personne et maintient la relation possessive du texte.
- source_word: גֶּבֶר עֲמִיתִי
  choice: l’homme qui est mon compagnon
  rationale: « Homme » convient à l’apposition avec « mon berger ». « Compagnon » exprime une relation étroite sans imposer l’idée plus forte d’égalité; les autres nuances possibles sont signalées en note.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclaration de Yahvé des armées
  rationale: « Déclaration » restitue la formule prophétique נְאֻם. « Yahvé » représente le nom divin יהוה, et « des armées » traduit צְבָאוֹת de manière transparente.
- source_word: הַךְ
  choice: Frappe
  rationale: Impératif direct et énergique de נכה, exprimé dans un français actuel sans archaïsme.
- source_word: וּתְפוּצֶיןָ הַצֹּאן
  choice: et que les brebis soient dispersées
  rationale: Le tour volitif français conserve la coordination avec l’impératif précédent et la forme passive du verbe. « Brebis » maintient l’image pastorale, là où « troupeau » serait également possible.
- source_word: וַהֲשִׁבֹתִי יָדִי עַל
  choice: Je tournerai ma main contre
  rationale: Rend l’idiome hébreu dans son sens défavorable le plus naturel au sein de cette scène de frappe et de dispersion, tout en en signalant l’ambiguïté dans une note.
- source_word: הַצֹּעֲרִים
  choice: les petits
  rationale: Préserve la latitude du terme, qui peut évoquer la petitesse, la jeunesse ou une condition subalterne, sans choisir arbitrairement entre ces nuances.
theological_decisions:
- issue: Portée de עֲמִיתִי dans la relation entre Yahvé et le berger
  choice: mon compagnon
  alternative: mon associé; mon proche; éventuellement mon égal
  rationale: Le texte exprime une proximité remarquable, mais le mot ne suffit pas à imposer sans ambiguïté une affirmation métaphysique précise. La traduction maintient cette tension et la note présente les principales possibilités lexicales.
- issue: Sens de l’action divine envers les petits
  choice: Je tournerai ma main contre les petits
  alternative: Je tournerai ma main vers/sur les petits
  rationale: Le contexte immédiat de frappe et de dispersion favorise une action défavorable ou disciplinaire. Toutefois, l’idiome peut aussi désigner plus largement une nouvelle intervention envers eux; la note conserve donc cette ouverture.
translation_notes:
  register: Français international moderne, solennel sans être archaïque. Les lignes brèves gardent le rythme de l’oracle et son parallélisme. Les images concrètes du berger, des brebis, de l’épée et de la main sont conservées. Les trois marqueurs [a], [b] et [c] figurent tous dans le texte principal.
