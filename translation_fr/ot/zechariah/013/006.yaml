source:
  edition: WLC
  text: וְ/אָמַ֣ר אֵלָ֔י/ו מָ֧ה הַ/מַּכּ֛וֹת הָ/אֵ֖לֶּה בֵּ֣ין יָדֶ֑י/ךָ וְ/אָמַ֕ר אֲשֶׁ֥ר הֻכֵּ֖יתִי בֵּ֥ית מְאַהֲבָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/006.yaml
  text: And if one says to him[a], “What are these wounds between your hands?” he will say[c][b], “Those with which I was wounded in the house of those who love me.”
translation:
  language: fr
  text: 'Si quelqu’un lui demande : « Que sont ces blessures entre tes mains[a] ? », il répondra : « Celles que j’ai reçues dans la maison de ceux qui m’aiment[b]. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre tes mains ». L’expression peut désigner la région située entre les bras, probablement la poitrine ou le torse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chez mes proches »; littéralement : « dans la maison de ceux qui m’aiment ». Le terme peut désigner des êtres aimés, des proches ou des compagnons intimes.'
    reason: lexical_alternative
  - marker: c
    text: Certains interprètes chrétiens comprennent ces blessures dans un sens messianique et les mettent en rapport avec les souffrances du Messie; le verset ne l’affirme pas explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַר אֵלָיו
  choice: Si quelqu’un lui demande
  rationale: La forme verbale ouvre ici une interrogation dans une séquence prophétique. Le sujet indéfini est implicite; « quelqu’un » le rend explicite en français naturel, tandis que « si » exprime le cadre éventuel suggéré par le contexte. « Demande » convient mieux que le générique « dit » devant une question directe.
- source_word: הַמַּכּוֹת הָאֵלֶּה
  choice: ces blessures
  rationale: מַכּוֹת peut désigner des coups ou les blessures qui en résultent. Puisqu’il s’agit de marques visibles sur lesquelles porte la question, « blessures » convient au contexte.
- source_word: בֵּין יָדֶיךָ
  choice: entre tes mains
  rationale: Cette traduction conserve la formulation concrète et inhabituelle de l’hébreu. יָד peut aussi désigner le bras selon le contexte; l’expression paraît donc viser la région située entre les bras, probablement la poitrine ou le torse, possibilité signalée en note.
- source_word: וְאָמַר
  choice: il répondra
  rationale: Le verbe signifie littéralement « il dira », mais il introduit ici la réponse à la question. Le futur rend la valeur prospective de la séquence prophétique.
- source_word: אֲשֶׁר הֻכֵּיתִי
  choice: Celles que j’ai reçues
  rationale: Le relatif renvoie aux blessures. Le hophal de נכה signifie que le locuteur a été frappé; en français, « blessures que j’ai reçues » exprime naturellement le résultat sans devoir répéter « blessé ».
- source_word: בֵּית מְאַהֲבָי
  choice: dans la maison de ceux qui m’aiment
  rationale: « Maison » conserve le sens direct de בֵּית, qui peut aussi évoquer le foyer ou l’entourage. מְאַהֲבָי signifie littéralement « ceux qui m’aiment » ou « mes amants »; le choix retenu préserve la relation affective sans imposer une connotation sexuelle.
theological_decisions:
- issue: Identification éventuelle du locuteur et interprétation des blessures
  choice: Le texte principal ne désigne pas explicitement le locuteur comme le Messie et ne précise pas la nature des blessures.
  alternative: Une lecture chrétienne traditionnelle met ces blessures en rapport avec les souffrances du Messie; une autre lecture y voit les blessures d’un faux prophète, notamment dans le contexte immédiat.
  rationale: Le verset hébreu présente une question et une réponse sans nommer le Messie, la crucifixion ni la cause exacte des blessures. La traduction préserve donc cette tension interprétative, tandis qu’une note mentionne la lecture messianique sans l’introduire dans le texte.
translation_notes:
  register: Français international moderne, courant et digne. Le dialogue reste direct et naturel. La formulation inhabituelle « entre tes mains » est maintenue pour préserver l’ambiguïté de l’hébreu, avec clarification en note.
