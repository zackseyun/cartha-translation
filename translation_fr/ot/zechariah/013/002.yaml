source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת שְׁמ֤וֹת הָֽ/עֲצַבִּים֙ מִן הָ/אָ֔רֶץ וְ/לֹ֥א יִזָּכְר֖וּ ע֑וֹד וְ/גַ֧ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת ר֥וּחַ הַ/טֻּמְאָ֖ה אַעֲבִ֥יר מִן הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/002.yaml
  text: And it shall happen in that day[a], declares Yahweh of hosts, that I will cut off the names of the idols from the land, and they shall be remembered no more[b]. And also I will remove from the land the prophets and the unclean spirit.
translation:
  language: fr
  text: 'En ce jour-là, voici ce qui arrivera — déclaration de Yahweh des armées : je retrancherai du pays les noms des idoles, et l’on ne se souviendra plus de ces noms. Je ferai aussi disparaître du pays les prophètes[a] et l’esprit d’impureté[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « les prophètes » désigne les prophètes illégitimes associés à l’idolâtrie et à l’impureté.
    reason: cultural_note
  - marker: b
    text: 'Ou : « l’esprit impur ». L’hébreu peut aussi se comprendre comme désignant un esprit ou une influence caractérisés par l’impureté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: voici ce qui arrivera
  rationale: Rend naturellement en français moderne la formule prophétique annonçant un événement futur, sans archaïsme.
- source_word: בַיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Conserve la formule temporelle prophétique et sa portée particulière.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclaration de Yahweh des armées
  rationale: « Déclaration » reflète la formule solennelle נְאֻם; le nom divin est rendu par « Yahweh » et צְבָאוֹת par l’expression française traditionnelle « des armées ».
- source_word: אַכְרִית
  choice: je retrancherai
  rationale: Exprime la suppression décisive portée par le hiphil de כרת tout en conservant la force de l’image hébraïque.
- source_word: שְׁמוֹת הָעֲצַבִּים
  choice: les noms des idoles
  rationale: Maintient explicitement « les noms » et rend עֲצַבִּים par le terme courant et contextuellement exact « idoles ».
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Le contexte de purification de la communauté et du territoire favorise le sens territorial de אֶרֶץ plutôt que « terre » au sens universel.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: et l’on ne se souviendra plus d’elles
  rationale: Rend avec naturel la tournure passive impersonnelle hébraïque; le pronom féminin reprend clairement les idoles en français.
- source_word: וְגַם
  choice: Je ferai aussi
  rationale: Préserve la valeur additive de וְגַם dans un ordre des mots naturel en français.
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: N’ajoute pas l’adjectif « faux », absent de l’hébreu, tout en laissant le contexte négatif déterminer le référent.
- source_word: רוּחַ הַטֻּמְאָה
  choice: l’esprit d’impureté
  rationale: Reproduit la construction hébraïque sans trancher inutilement entre une réalité spirituelle personnelle et une influence ou disposition impure.
- source_word: אַעֲבִיר
  choice: je ferai disparaître
  rationale: Rend le hiphil de עבר comme une action causative de suppression, en français idiomatique, et convient aux deux compléments coordonnés.
theological_decisions:
- issue: Faut-il préciser que les prophètes sont de faux prophètes ?
  choice: Conserver « les prophètes » dans le texte et expliquer le contexte en note.
  alternative: les faux prophètes
  rationale: Le contexte d’idolâtrie et d’impureté indique qu’il s’agit de prophètes illégitimes, mais l’hébreu ne contient aucun adjectif équivalent à « faux ». La traduction préserve donc la tension du texte.
- issue: רוּחַ הַטֻּמְאָה désigne-t-il un être spirituel personnel ou une influence impure ?
  choice: l’esprit d’impureté
  alternative: l’esprit impur
  rationale: La construction avec un nom abstrait peut désigner un esprit caractérisé par l’impureté sans obliger le traducteur à préciser sa nature personnelle. La formulation choisie conserve cette ambiguïté réelle.
- issue: Portée géographique de הָאָרֶץ
  choice: du pays
  alternative: de la terre
  rationale: Dans le contexte immédiat de Zacharie, la purification vise vraisemblablement le territoire de la communauté; « pays » exprime ce sens sans étendre explicitement la portée au monde entier.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure prophétique est conservée sans recourir à « il adviendra », jugé plus archaïque. Le tiret met clairement en relief la formule d’oracle. Les deux notes sont placées sur les expressions auxquelles elles se rapportent, contrairement au positionnement incohérent des marqueurs dans la couche anglaise fournie.
