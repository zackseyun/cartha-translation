review_pass:
  verdict: revise
  source_fidelity: La proposition « une source jaillira » ne rend pas le participe passif נִפְתָּח (« ouverte ») et substitue l’apparition jaillissante de l’eau à l’ouverture ou à la mise à disposition de la source. Le reste rend correctement la formule temporelle, les destinataires et les deux réalités associées à la purification.
  naturalness: « Une source sera ouverte » est naturel en français biblique moderne et conserve l’image concrète sans l’expliciter davantage. La formulation « afin de les purifier » introduisait un pronom et une finalité verbale absents de l’hébreu ; « pour le péché et l’impureté » maintient la concision et l’ouverture syntaxique du texte source.
  terminology: « Maison de David », « habitants de Jérusalem », « péché » et « impureté » sont appropriés. « Source » est un bon choix pour מָקוֹר. La note sur חַטָּאת préserve correctement l’alternative « sacrifice pour le péché » ; celle sur נִדָּה signale sans sur-spécifier sa possible référence menstruelle.
  issues:
  - severity: medium
    issue: « jaillira » remplace l’idée d’une source « ouverte ».
    rationale: נִפְתָּח est un participe passif de פתח, « être ouvert ». Le verbe « jaillir » décrit un autre aspect possible d’une source, mais n’est pas exprimé par le texte hébreu.
  - severity: low
    issue: « afin de les purifier » explicite et personnalise la relation finale.
    rationale: L’hébreu dit littéralement « pour le péché et pour l’impureté », sans verbe de purification ni pronom objet. L’idée purificatrice est fortement suggérée par l’image, mais la formulation plus littérale préserve mieux la densité et l’ambiguïté du texte.
  revised_text: En ce jour-là, une source sera ouverte pour la maison de David et pour les habitants de Jérusalem, pour le péché[a] et l’impureté[b].
