revisions:
- from: En ce jour-là, une source jaillira pour la maison de David et pour les habitants de Jérusalem, afin de les purifier du péché[a] et de l’impureté[b].
  to: En ce jour-là, une source sera ouverte pour la maison de David et pour les habitants de Jérusalem, pour le péché[a] et l’impureté[b].
  rationale: La révision restitue explicitement le passif « sera ouverte », élément central de נִפְתָּח, et retire l’explicitation verbale non présente dans l’hébreu. Elle conserve la terminologie, le registre moderne international et les notes lexicales utiles, sans imposer d’interprétation doctrinale.
