source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ מָק֣וֹר נִפְתָּ֔ח לְ/בֵ֥ית דָּוִ֖יד וּ/לְ/יֹשְׁבֵ֣י יְרֽוּשָׁלִָ֑ם לְ/חַטַּ֖את וּ/לְ/נִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/001.yaml
  text: On that day a fountain will be opened for the house of David and for the inhabitants of Jerusalem[c][b][a], for sin and for impurity.
translation:
  language: fr
  text: En ce jour-là, une source sera ouverte pour la maison de David et pour les habitants de Jérusalem, pour le péché[a] et l’impureté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner un « sacrifice pour le péché », mais l’image de purification favorise ici le sens de « péché ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner précisément l’impureté menstruelle ou, plus largement, l’impureté rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique temporelle courante, naturelle en français et fidèle à la valeur déictique de l’hébreu.
- source_word: יִהְיֶה מָקוֹר נִפְתָּח
  choice: une source jaillira
  rationale: מָקוֹר désigne une source d’eau, tandis que נִפְתָּח exprime son ouverture ou sa mise à disposition. « Jaillira » restitue naturellement en français l’image dynamique sans suggérer une fontaine construite.
- source_word: לְבֵית דָּוִיד
  choice: pour la maison de David
  rationale: La préposition ל indique ici que la source est mise à la disposition et au bénéfice de la dynastie ou maisonnée de David.
- source_word: וּלְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: et pour les habitants de Jérusalem
  rationale: Traduction collective, claire et naturelle du participe substantivé « ceux qui habitent ».
- source_word: לְחַטָּאת
  choice: afin de les purifier du péché
  rationale: חַטָּאת peut signifier « péché » ou « sacrifice pour le péché ». Associé à une source et à נִדָּה, le contexte favorise ici la purification du péché; l’ajout explicite de « purifier » rend en français la fonction des deux compléments introduits par ל.
- source_word: וּלְנִדָּה
  choice: et de l’impureté
  rationale: נִדָּה peut désigner une impureté menstruelle précise ou, plus largement, l’impureté rituelle. Le terme général « impureté » préserve cette amplitude.
theological_decisions:
- issue: Portée de l’image de purification
  choice: Conserver l’image d’une source qui purifie du péché et de l’impureté sans préciser son mécanisme théologique.
  alternative: Identifier explicitement la source à l’expiation, au sang messianique ou à un rite particulier.
  rationale: Le verset annonce un moyen divinement offert de purification, mais n’en donne pas lui-même une interprétation doctrinale détaillée.
- issue: Sens de חַטָּאת
  choice: « péché » dans le texte principal
  alternative: « sacrifice pour le péché »
  rationale: Le parallélisme avec « impureté » et l’image de l’eau favorisent le mal dont on est purifié plutôt qu’un objet sacrificiel, tout en justifiant une note sur l’autre sens lexical possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Source » évite l’ambiguïté moderne de « fontaine » et convient à une eau jaillissante. La formulation explicite la finalité purificatrice implicite dans les compléments hébreux, sans ajouter d’interprétation confessionnelle.
