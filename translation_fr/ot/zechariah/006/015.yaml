review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les personnes « éloignées » restent non identifiées, la séquence future est conservée, le titre divin est rendu sans atténuation, et la condition finale avec son intensification est maintenue. Toutefois, « bâtiront dans le temple » est une reproduction trop littérale de la préposition qui, en français, suggère surtout qu’ils construiront quelque chose à l’intérieur d’un temple déjà bâti. « bâtiront au temple » rend naturellement l’activité de construction liée au temple sans préciser davantage la relation que le texte hébreu.'
  naturalness: Le registre est moderne et digne. La suppression de « Alors », qui n’est pas exigé par la conjonction hébraïque, évite d’accentuer artificiellement une relation temporelle ou déductive. « Bâtiront au temple » est plus idiomatique que « bâtiront dans le temple » dans ce contexte.
  terminology: « Yahvé », « Yahvé des armées », « la voix de Yahvé, votre Dieu » et « obéissez vraiment » sont des choix appropriés. Ils préservent respectivement le nom divin, la portée du titre צבאות, l’image de la voix autoritative et l’intensification de l’infinitif absolu עם le verbe שמע.
  issues:
  - severity: medium
    issue: « bâtiront dans le temple »
    rationale: Cette formulation française laisse entendre une construction à l’intérieur du sanctuaire. Le בְ hébreu exprime ici le cadre ou le rapport de l’activité de bâtir au temple; « bâtiront au temple » le rend plus naturellement, sans ajouter « reconstruire » ni identifier les bâtisseurs.
  - severity: low
    issue: « Alors vous saurez »
    rationale: « Alors » peut être recevable, mais la conjonction וְ n’impose pas ce repère. « Vous saurez » préserve plus exactement la simple coordination et n’anticipe pas la portée précise de la condition finale.
  revised_text: Ceux qui sont au loin[a] viendront et bâtiront au temple de Yahvé. Vous saurez que Yahvé des armées[b] m’a envoyé vers vous. Cela arrivera si vous obéissez vraiment à la voix de Yahvé, votre Dieu.
