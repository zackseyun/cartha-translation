revisions:
- from: Ceux qui sont au loin[a] viendront et bâtiront dans le temple de Yahvé. Alors vous saurez que Yahvé des armées[b] m’a envoyé vers vous. Cela arrivera si vous obéissez vraiment à la voix de Yahvé, votre Dieu.
  to: Ceux qui sont au loin[a] viendront et bâtiront au temple de Yahvé. Vous saurez que Yahvé des armées[b] m’a envoyé vers vous. Cela arrivera si vous obéissez vraiment à la voix de Yahvé, votre Dieu.
  rationale: La révision corrige l’unique calque français susceptible de fausser l’image de construction, en conservant l’ambiguïté syntaxique de l’hébreu quant au rapport exact entre les bâtisseurs et le temple. Elle retire aussi un connecteur interprétatif non nécessaire. Les ancres et le contenu des notes demeurent appropriés et complets.
