  text: וּ/רְחוֹקִ֣ים יָבֹ֗אוּ וּ/בָנוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה וִ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/הָיָה֙ אִם שָׁמ֣וֹעַ תִּשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/015.yaml
  text: And those who are far off will come and build in the temple of Yahweh[a], and you will know that Yahweh of Armies has sent me to you[b]. And this will happen if you diligently obey the voice of Yahweh your God.
translation:
  language: fr
  text: Ceux qui sont au loin[a] viendront et bâtiront au temple de Yahvé. Vous saurez que Yahvé des armées[b] m’a envoyé vers vous. Cela arrivera si vous obéissez vraiment à la voix de Yahvé, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut notamment désigner des exilés vivant dans des pays lointains, mais l’hébreu ne précise pas de quel groupe il s’agit.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « Yahvé des armées »; le titre est aussi traditionnellement rendu par « le SEIGNEUR des armées » ou « le SEIGNEUR de l’univers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְחוֹקִים
  choice: ceux qui sont au loin
  rationale: L’adjectif substantivé désigne des personnes éloignées, sans préciser s’il s’agit d’exilés, d’étrangers ou d’un autre groupe.
- source_word: יָבֹאוּ וּבָנוּ
  choice: viendront et bâtiront
  rationale: Les deux verbes forment une même séquence prophétique orientée vers l’avenir.
- source_word: בְּהֵיכַל יְהוָה
  choice: dans le temple de Yahvé
  rationale: הֵיכָל désigne ici le sanctuaire, et la préposition בְ est conservée par « dans », sans transformer le complément en objet direct.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est rendu par sa forme française usuelle plutôt que remplacé par un titre.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: « Alors » exprime naturellement en français le résultat annoncé par la coordination hébraïque.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Cette formulation conserve l’image concrète et la force du titre hébreu sans recourir à l’expression traditionnelle, aujourd’hui moins transparente, « des armées célestes » ou « des puissances ».
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: m’a envoyé vers vous
  rationale: Le passé composé rend l’action accomplie dont la portée demeure actuelle; « vers vous » reflète אֲלֵיכֶם.
- source_word: וְהָיָה
  choice: Cela arrivera
  rationale: Cette tournure française actuelle rend clairement l’introduction du résultat soumis à la condition qui suit.
- source_word: אִם שָׁמוֹעַ תִּשְׁמְעוּן
  choice: si vous obéissez vraiment
  rationale: Dans ce contexte d’alliance, שמע implique une écoute qui se traduit par l’obéissance; « vraiment » exprime l’intensification produite par l’infinitif absolu.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיכֶם
  choice: à la voix de Yahvé, votre Dieu
  rationale: « Voix » conserve l’image hébraïque de la parole divine faisant autorité, tandis que l’apposition est ponctuée naturellement en français.
theological_decisions:
- issue: Identité et portée de « ceux qui sont au loin »
  choice: La traduction demeure générale et ne précise pas l’identité de ces personnes.
  alternative: Les exilés judéens, les membres de la diaspora ou les non-Israélites venus de loin.
  rationale: L’expression hébraïque indique l’éloignement mais ne nomme aucun groupe; la formulation retenue préserve cette ouverture.
- issue: Rapport entre la condition finale et la promesse
  choice: « Cela arrivera » rattache naturellement la condition à ce qui précède sans en définir plus précisément la portée.
  alternative: Comprendre la condition comme une exhortation indépendante, ou comme portant uniquement sur la reconnaissance de l’envoyé.
  rationale: La syntaxe présente une véritable condition après la promesse, mais ne tranche pas explicitement toutes les questions relatives à son champ d’application.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve la répétition du nom divin, l’image de la voix et l’ambiguïté concernant les personnes éloignées. « Bâtiront dans le temple » est volontairement proche de la construction hébraïque, malgré son caractère légèrement inhabituel en français.
