source:
  edition: WLC
  text: וּ/בַ/מֶּרְכָּבָ֥ה הַ/שְּׁלִשִׁ֖ית סוּסִ֣ים לְבָנִ֑ים וּ/בַ/מֶּרְכָּבָה֙ הָ/רְבִעִ֔ית סוּסִ֥ים בְּרֻדִּ֖ים אֲמֻצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/003.yaml
  text: and in the third chariot[a], white horses; and in the fourth chariot, dappled horses, strong ones.
translation:
  language: fr
  text: et dans le troisième char[a], des chevaux blancs ; et dans le quatrième char, des chevaux tachetés, vigoureux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, peut-être : « des chevaux tachetés — et des chevaux vigoureux », si « vigoureux » désigne un groupe distinct plutôt qu’une seconde caractéristique des chevaux du quatrième char.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַמֶּרְכָּבָה
  choice: et dans le … char
  rationale: La préposition ב peut signifier « dans » ou « sur ». Ici, « dans le … char » exprime naturellement en français le rattachement des chevaux à chaque attelage.
- source_word: הַשְּׁלִשִׁית
  choice: troisième
  rationale: Adjectif ordinal féminin accordé avec « char » en hébreu ; en français, « char » est masculin.
- source_word: סוּסִים
  choice: chevaux
  rationale: Équivalent courant du nom pluriel, rendu de façon constante dans les deux propositions.
- source_word: לְבָנִים
  choice: blancs
  rationale: Adjectif de couleur usuel, sans motif contextuel de choisir un autre terme.
- source_word: הָרְבִעִית
  choice: quatrième
  rationale: Adjectif ordinal modifiant « char ».
- source_word: בְּרֻדִּים
  choice: tachetés
  rationale: Le terme décrit une robe bigarrée ou marquée de taches. « Tachetés » est clair et naturel en français moderne.
- source_word: אֲמֻצִּים
  choice: vigoureux
  rationale: Issu de la racine אמץ, ce mot évoque la force et la robustesse. « Vigoureux » convient bien à des chevaux et reste distinct d'un terme de couleur.
theological_decisions:
- issue: Déterminer si אֲמֻצִּים qualifie les chevaux tachetés ou désigne un groupe supplémentaire
  choice: 'Le mot qualifie les chevaux du quatrième char : « des chevaux tachetés, vigoureux ».'
  alternative: 'Il peut être compris comme désignant séparément des chevaux vigoureux : « des chevaux tachetés — et des vigoureux » ou « des chevaux tachetés, et des chevaux vigoureux » (voir la note).'
  rationale: Après סוּסִים, l'hébreu enchaîne בְּרֻדִּים et אֲמֻצִּים sans répéter le nom. La lecture la plus naturelle y voit deux qualificatifs des mêmes chevaux, mais la syntaxe permet éventuellement de distinguer un autre groupe ; cette ambiguïté est donc signalée.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle et l'ordre des qualificatifs hébreux sont conservés. « Char » est préféré à « chariot » dans ce contexte de vision et d'attelages.
