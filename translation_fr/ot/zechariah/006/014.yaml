  rationale: La révision conserve tous les référents du texte hébreu et son pluriel, mais clarifie en français que les couronnes ont une fonction commémorative dans le temple à l’égard des personnes nommées. La note reste ancrée à Hélem et signale sans harmonisation la forme Heldaï de 6.10.
