review_pass:
  verdict: revise
  source_fidelity: Le pluriel « les couronnes », les noms Hélem, Tobiya, Yedaya et Hen, ainsi que « temple de Yahvé », reflètent fidèlement le texte massorétique. Toutefois, « seront destinées à » peut suggérer que les couronnes seront remises aux personnes nommées, alors que la suite « comme mémorial dans le temple » indique leur fonction commémorative. Une formulation qui fait des couronnes un mémorial pour ces personnes rend mieux l’ensemble de la syntaxe.
  naturalness: La formulation proposée est compréhensible, mais « comme mémorial dans le temple » après « seront destinées à » est légèrement lourde et laisse incertaine la relation entre les personnes et le mémorial. « serviront de mémorial ... pour » est plus idiomatique en français moderne.
  terminology: « Yahvé » est approprié pour יהוה. Les translittérations Hélem, Tobiya, Yedaya et Hen sont cohérentes avec la priorité donnée à la forme du texte hébreu de ce verset. « Sophonie » est la forme française établie. La note sur Heldaï préserve utilement la variation avec 6.10.
  issues:
  - severity: medium
    issue: Portée imprécise de « seront destinées à »
    rationale: Cette expression présente les personnes comme bénéficiaires ou destinataires des couronnes. Le texte situe plutôt les couronnes dans le temple comme mémorial les concernant; « serviront de mémorial ... pour » rend cette fonction sans introduire l’idée d’une remise.
  revised_text: Les couronnes serviront de mémorial dans le temple de Yahvé pour Hélem[a], Tobiya, Yedaya et Hen, fils de Sophonie.
  revised_footnotes:
  - marker: a
    text: Hélem est appelé Heldaï en Zacharie 6.10 ; il peut s’agir d’une autre forme du même nom.
    reason: alternative_reading
