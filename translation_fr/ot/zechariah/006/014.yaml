source:
  edition: WLC
  text: וְ/הָ/עֲטָרֹ֗ת תִּֽהְיֶה֙ לְ/חֵ֨לֶם֙ וּ/לְ/טוֹבִיָּ֣ה וְ/לִ/ידַֽעְיָ֔ה וּ/לְ/חֵ֖ן בֶּן צְפַנְיָ֑ה לְ/זִכָּר֖וֹן בְּ/הֵיכַ֥ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/014.yaml
  text: And the crowns shall be for Helem[a], Tobijah, Jedaiah, and Hen son of Zephaniah, as a memorial in the temple of Yahweh.
translation:
  language: fr
  text: Les couronnes serviront de mémorial dans le temple de Yahvé pour Hélem[a], Tobiya, Yedaya et Hen, fils de Sophonie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hélem est appelé Heldaï en Zacharie 6.10 ; il peut s’agir d’une autre forme du même nom.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲטָרֹת
  choice: les couronnes
  rationale: Le nom hébreu est morphologiquement au pluriel; le français conserve cette forme sans l'harmoniser avec l'éventualité d'une seule couronne dans le contexte.
- source_word: תִּהְיֶה
  choice: seront destinées à
  rationale: L'imparfait de היה exprime ici le résultat ou la destination future. Cette tournure française est naturelle et rend clairement les לְ qui introduisent les bénéficiaires.
- source_word: לְחֵלֶם
  choice: à Hélem
  rationale: Le nom propre est translittéré d'après la forme massorétique de ce verset, sans harmonisation avec Heldaï en Zacharie 6.10.
- source_word: וּלְטוֹבִיָּה
  choice: à Tobiya
  rationale: Translittération française proche de la forme hébraïque טוֹבִיָּה.
- source_word: וְלִידַעְיָה
  choice: à Yedaya
  rationale: Le nom propre est translittéré selon une forme lisible en français qui reflète l'hébreu.
- source_word: וּלְחֵן
  choice: à Hen
  rationale: Le contexte, notamment « fils de Sophonie », indique qu'il s'agit ici d'un nom propre plutôt que du nom commun « grâce » ou « faveur ».
- source_word: בֶּן צְפַנְיָה
  choice: fils de Sophonie
  rationale: La construction filiale est rendue directement; Sophonie est la forme française traditionnelle et intelligible du nom.
- source_word: לְזִכָּרוֹן
  choice: comme mémorial
  rationale: La formule exprime la fonction commémorative durable des couronnes dans le temple.
- source_word: בְּהֵיכַל
  choice: dans le temple
  rationale: Associé à Yahvé, הֵיכָל désigne ici son temple, non un palais royal.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme nom propre divin, sous sa forme française courante, plutôt que remplacé par un titre.
theological_decisions:
- issue: Variation des noms propres entre Zacharie 6.10 et 6.14
  choice: Conserver « Hélem » et « Hen » selon le texte massorétique de ce verset.
  alternative: Harmoniser « Hélem » avec « Heldaï » en 6.10, ou comprendre « Hen » comme le nom commun « grâce » ou « faveur ».
  rationale: La traduction suit la lecture hébraïque propre au verset et préserve les différences textuelles ou onomastiques au lieu de les résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « seront destinées à » évite le calque peu naturel « seront pour » tout en conservant la destination exprimée par les prépositions hébraïques. Les noms sont translittérés ou, pour Sophonie, donnés sous leur forme française établie.
