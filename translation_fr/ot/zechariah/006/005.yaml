base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/005.yaml
  text: Then the angel answered and said to me[a], “These are the four winds of heaven, going out from standing before the Lord of all the earth.”
translation:
  language: fr
  text: 'Alors l’ange me répondit : « Ce sont les quatre vents[a] du ciel qui sortent après s’être tenus devant le Seigneur de toute la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les quatre esprits du ciel ». Le mot hébreu peut signifier « vents » ou « esprits ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן הַמַּלְאָךְ וַיֹּאמֶר אֵלַי
  choice: Alors l’ange me répondit
  rationale: La formule hébraïque littérale « répondit et dit » est une tournure narrative. « Me répondit » en restitue naturellement le sens en français moderne sans lourdeur.
- source_word: אַרְבַּע רֻחוֹת
  choice: les quatre vents
  rationale: רוּחוֹת peut désigner les vents ou les esprits. Dans la vision des chars envoyés à travers le monde, « vents » exprime bien l’image cosmique, tandis que l’autre sens demeure signalé en note.
- source_word: הַשָּׁמַיִם
  choice: du ciel
  rationale: Le singulier collectif « ciel » est la formulation française la plus naturelle dans ce contexte visionnaire.
- source_word: יוֹצְאוֹת
  choice: qui sortent
  rationale: Le participe décrit les quatre vents en train de partir; la relative donne une syntaxe française claire et proche du texte.
- source_word: מֵהִתְיַצֵּב עַל
  choice: après s’être tenus devant
  rationale: Le hitpael de יצב évoque le fait de prendre position ou de se tenir en présence d’un supérieur. La préposition מִן peut ici marquer le point de départ temporel ou situationnel; « après » évite l’expression française peu naturelle « depuis s’être tenus ».
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: le Seigneur de toute la terre
  rationale: Le titre souligne la souveraineté divine universelle; « terre » convient mieux que « pays » à la portée cosmique de la vision.
theological_decisions:
- issue: Sens de רֻחוֹת dans la vision
  choice: vents
  alternative: esprits
  rationale: Le mot hébreu porte réellement les deux sens. « Vents » est retenu dans le corps du texte en raison de l’imagerie cosmique et du mouvement des chars, sans exclure l’interprétation comme puissances célestes, conservée dans la note.
- issue: Rapport des quatre vents à la présence divine
  choice: après s’être tenus devant le Seigneur
  alternative: sortant de devant le Seigneur
  rationale: La traduction conserve l’idée qu’ils étaient en position devant le souverain avant leur départ, sans préciser davantage la nature de leur service ou de leur mission.
translation_notes:
  register: Français international moderne, digne et accessible. La formule narrative hébraïque est allégée en français, tandis que l’ambiguïté essentielle de רוּחוֹת est explicitement préservée en note.
