base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/001.yaml
  text: Then I turned and lifted up my eyes and saw[a], and behold[b], four chariots were coming out from between two mountains—and the mountains were mountains of bronze.
translation:
  language: fr
  text: 'Puis je me retournai[a], je levai les yeux et je vis : voici, quatre chars sortaient d’entre les deux montagnes, et les montagnes étaient des montagnes de bronze[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puis je levai de nouveau les yeux et je vis. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « cuivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשֻׁב
  choice: Puis je me retournai
  rationale: שׁוב peut exprimer le fait de se retourner ou de faire de nouveau une action. Ici, « je me retournai » conserve le mouvement distinct suggéré par la succession des verbes, tandis que l’autre analyse possible est signalée en note.
- source_word: וָאֶשָּׂא עֵינַי
  choice: levai les yeux
  rationale: Cette expression idiomatique hébraïque désigne le fait de diriger son regard. « Levai les yeux » reste naturel en français tout en conservant l’image du texte source.
- source_word: וָאֶרְאֶה
  choice: et regardai
  rationale: Dans un récit de vision, « regardai » rend naturellement l’acte volontaire de voir qui précède la présentation introduite par הִנֵּה.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » restitue la fonction de présentation vive et soudaine de הִנֵּה dans un registre prophétique actuel et digne.
- source_word: אַרְבַּע מַרְכָּבוֹת
  choice: quatre chars
  rationale: מַרְכָּבוֹת désigne clairement des chars dans cette vision.
- source_word: יֹצְאוֹת
  choice: sortaient
  rationale: Le participe féminin pluriel présente l’action comme en cours au moment où le prophète la voit; l’imparfait français en rend bien l’aspect progressif.
- source_word: מִבֵּין שְׁנֵי הֶהָרִים
  choice: d’entre les deux montagnes
  rationale: La traduction conserve l’article défini de l’hébreu et exprime directement l’émergence depuis l’espace situé entre les deux montagnes.
- source_word: וְהֶהָרִים הָרֵי נְחֹשֶׁת
  choice: et ces montagnes étaient des montagnes de bronze
  rationale: « Ces montagnes » assure une reprise naturelle en français, tandis que la répétition de « montagnes » préserve l’insistance de l’hébreu. נְחֹשֶׁת peut désigner le bronze ou le cuivre; « bronze » convient bien à cette image monumentale.
theological_decisions:
- issue: Sens du matériau נְחֹשֶׁת
  choice: bronze
  alternative: cuivre
  rationale: Il s’agit surtout d’une ambiguïté lexicale, sans nécessité de lui imposer une portée doctrinale. « Bronze » est retenu dans le texte, et « cuivre » est conservé en note.
- issue: Portée de וָאָשֻׁב dans la formule de vision
  choice: 'action distincte : « je me retournai »'
  alternative: 'valeur adverbiale : « je levai de nouveau les yeux »'
  rationale: La construction peut être comprise comme un mouvement distinct du prophète ou comme la reprise de son observation. Le texte principal suit la première analyse sans supprimer la seconde, indiquée en note.
translation_notes:
  register: Français international moderne, clair et digne. La succession des actions et l’effet de présentation de la vision sont conservés, de même que la répétition emphatique du mot « montagnes ».
