translation:
  language: fr
  text: Au premier char, il y avait des chevaux rouges, et au deuxième, des chevaux noirs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמֶּרְכָּבָה
  choice: au char
  rationale: מֶרְכָּבָה désigne un char. Dans ce tableau visionnaire, « au char » exprime naturellement en français l’association des chevaux à chaque char, sans suggérer qu’ils se trouvent physiquement à l’intérieur.
- source_word: הָרִאשֹׁנָה
  choice: premier
  rationale: L’adjectif ordinal indique le premier char dans la séquence de la vision.
- source_word: סוּסִים
  choice: chevaux
  rationale: Traduction courante et directe du nom pluriel.
- source_word: אֲדֻמִּים
  choice: rouges
  rationale: L’adjectif de couleur signifie « rouges » et conserve le contraste visuel de la vision.
- source_word: וּבַמֶּרְכָּבָה
  choice: et au deuxième
  rationale: La conjonction et la construction parallèle sont conservées, tandis que la répétition de « char » est élidée conformément à l’usage naturel du français.
- source_word: הַשֵּׁנִית
  choice: deuxième
  rationale: L’ordinal marque le char suivant dans une série qui en compte plus de deux; « deuxième » convient donc bien en français moderne.
- source_word: שְׁחֹרִים
  choice: noirs
  rationale: Le sens ordinaire de l’adjectif est « noirs », ce qui maintient le contraste des couleurs.
