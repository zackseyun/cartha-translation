source:
  edition: WLC
  text: אֲשֶׁר בָּ֞/הּ הַ/סּוּסִ֣ים הַ/שְּׁחֹרִ֗ים יֹֽצְאִים֙ אֶל אֶ֣רֶץ צָפ֔וֹן וְ/הַ/לְּבָנִ֔ים יָצְא֖וּ אֶל אַֽחֲרֵי/הֶ֑ם וְ/הַ֨/בְּרֻדִּ֔ים יָצְא֖וּ אֶל אֶ֥רֶץ הַ/תֵּימָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/006.yaml
  text: The black horses in it are going out to the land of the north[a], and the white ones have gone out after them, and the dappled ones have gone out to the land of the south.
translation:
  language: fr
  text: Les chevaux noirs qui s’y trouvent partent vers le pays du nord ; les blancs sont partis derrière eux, et les tachetés sont partis vers le pays du sud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le pays de Témân », si תֵּימָן est ici le nom propre Témân plutôt que le terme désignant le sud.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר בָּהּ
  choice: qui s’y trouvent
  rationale: La proposition relative renvoie au char mentionné dans le contexte précédent. Cette formulation conserve le sens locatif sans alourdir la phrase.
- source_word: הַסּוּסִים הַשְּׁחֹרִים
  choice: les chevaux noirs
  rationale: Rendu direct et naturel du nom accompagné de l’adjectif de couleur.
- source_word: יֹצְאִים
  choice: partent
  rationale: Le participe présente vivement le mouvement en cours. « Partent » est naturel en français dans le récit de la vision.
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: vers le pays du nord
  rationale: Conserve l’expression hébraïque et son parallélisme avec « le pays du sud ».
- source_word: וְהַלְּבָנִים
  choice: les blancs
  rationale: L’hébreu sous-entend « chevaux » ; le français permet ici la même ellipse.
- source_word: יָצְאוּ אֶל אַחֲרֵיהֶם
  choice: sont partis derrière eux
  rationale: Le passé composé rend l’action présentée comme accomplie, tandis que « derrière eux » exprime à la fois la position et le mouvement à leur suite.
- source_word: וְהַבְּרֻדִּים
  choice: les tachetés
  rationale: Ce terme désigne une robe mêlée ou marquée de taches. « Tachetés » est clair pour le lectorat moderne et convient à des chevaux.
- source_word: אֶל אֶרֶץ הַתֵּימָן
  choice: vers le pays du sud
  rationale: Le sens directionnel « sud » forme un parallèle net avec « pays du nord » ; la possibilité du nom propre Témân est conservée en note.
theological_decisions:
- issue: Sens de הַתֵּימָן dans la vision
  choice: sud
  alternative: Témân
  rationale: Le parallélisme avec « le pays du nord » favorise ici la désignation d’une région méridionale. Comme le mot peut aussi être compris comme le nom propre Témân, cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La structure garde les chevaux comme sujets, respecte l’ellipse de « chevaux » après les adjectifs de couleur et distingue le participe initial des deux formes verbales accomplies.
