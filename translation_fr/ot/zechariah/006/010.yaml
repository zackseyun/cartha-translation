base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/010.yaml
  text: Take from the exiles—from Heldai[a], from Tobijah, and from Jedaiah—and you yourself shall go on that day and enter the house of Josiah the son of Zephaniah[d][c][b], who have come from Babylon.
translation:
  language: fr
  text: Prends de la part des exilés[a] — de Heldaï, de Tobiya et de Yedaya. Toi-même, va ce jour-là et rends-toi chez Josias, fils de Sophonie. Ce sont eux qui sont venus de Babylone[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la communauté des exilés ». Le terme hébreu désigne ici le groupe des exilés, et non l’exil comme réalité abstraite.
    reason: lexical_alternative
  - marker: c
    text: En hébreu, « sont venus » est au pluriel et renvoie le plus naturellement à Heldaï, Tobiya et Yedaya, plutôt qu’au seul Josias.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקוֹחַ
  choice: Prends
  rationale: L’infinitif absolu qal a ici une valeur impérative. « Prends » conserve la formulation concise et laisse, comme l’hébreu, l’objet à prendre implicite.
- source_word: מֵאֵת הַגּוֹלָה
  choice: auprès des exilés
  rationale: הַגּוֹלָה désigne ici les personnes formant la communauté exilée plutôt que l’exil comme situation abstraite. « Auprès de » exprime naturellement la provenance après « prends ».
- source_word: חֶלְדַּי / טוֹבִיָּה / יְדַעְיָה
  choice: Heldaï / Tobiya / Yedaya
  rationale: Translittérations françaises lisibles qui rendent les noms hébreux sans passer par leurs formes anglaises.
- source_word: וּבָאתָ אַתָּה
  choice: Toi-même, va
  rationale: Le verbe בוא peut décrire le fait de venir ou d’aller selon le point de vue. « Va » convient au déplacement demandé à Zacharie, tandis que « toi-même » conserve l’insistance du pronom explicite אַתָּה.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Rendu direct de l’expression temporelle hébraïque, sans ajouter l’idée de « ce même jour ».
- source_word: בֵּית יֹאשִׁיָּה בֶן צְפַנְיָה
  choice: dans la maison de Josias, fils de Sophonie
  rationale: Rendu naturel de la destination et du patronyme, avec les formes françaises usuelles de Josias et Sophonie.
- source_word: אֲשֶׁר בָּאוּ מִבָּבֶל
  choice: ce sont eux qui sont venus de Babylone
  rationale: Le verbe pluriel בָּאוּ renvoie le plus naturellement aux trois hommes nommés. La reprise « eux » rend ce rattachement intelligible en français malgré la distance syntaxique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’ordre « Toi-même, va » garde l’emphase hébraïque sans lourdeur excessive. La ponctuation sépare les étapes de l’instruction et la proposition finale explicite son antécédent pluriel.
