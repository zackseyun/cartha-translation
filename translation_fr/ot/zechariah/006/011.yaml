  text: וְ/לָקַחְתָּ֥ כֶֽסֶף וְ/זָהָ֖ב וְ/עָשִׂ֣יתָ עֲטָר֑וֹת וְ/שַׂמְתָּ֗ בְּ/רֹ֛אשׁ יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֥ן הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/011.yaml
  text: Take silver and gold[a], make crowns, and set them on the head of Joshua son of Jehozadak, the high priest.
translation:
  language: fr
  text: Prends de l’argent et de l’or, fais-en des couronnes[a] et place-les sur la tête de Josué, fils de Jotsadak, le grand prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « couronnes » au pluriel. Certains comprennent qu’il s’agit d’une seule couronne composite et traduisent donc « une couronne ».
    reason: Préserver l’autre compréhension possible du pluriel hébreu dans cet acte symbolique.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Prends
  rationale: Le qatal qal à la 2e personne du masculin singulier, précédé de la conjonction, exprime ici une instruction prophétique; l’impératif français est naturel.
- source_word: כֶסֶף וְזָהָב
  choice: de l’argent et de l’or
  rationale: Les deux noms désignent directement les métaux employés; « argent » et « or » en conservent la précision.
- source_word: וְעָשִׂיתָ עֲטָרוֹת
  choice: fais-en des couronnes
  rationale: Le pronom « en » indique naturellement que les couronnes sont faites avec l’argent et l’or. Le pluriel traduit la forme morphologiquement plurielle עֲטָרוֹת.
- source_word: וְשַׂמְתָּ בְּרֹאשׁ
  choice: place-les sur la tête de
  rationale: « Place-les sur la tête » exprime clairement le geste matériel et reprend le pluriel « couronnes ».
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Josué, fils de Jotsadak
  rationale: « Josué » est la forme française traditionnelle et intelligible de יְהוֹשֻׁעַ; « Jotsadak » rend le nom hébreu selon l’usage biblique français courant.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: C’est le titre idiomatique français usuel de la fonction sacerdotale suprême.
theological_decisions:
- issue: Le pluriel עֲטָרוֹת associé à leur placement sur la tête d’un seul homme
  choice: Conserver « couronnes » au pluriel dans le texte principal
  alternative: Employer « couronne » au singulier en comprenant une couronne composite
  rationale: Le texte hébreu porte explicitement un nom pluriel. Comme ce détail peut compter dans l’interprétation de l’acte symbolique, la traduction le préserve sans trancher silencieusement en faveur d’une couronne unique.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs « Prends », « fais » et « place » rendent directement la suite d’instructions prophétiques. Le marqueur [a] figure immédiatement après le terme concerné.
