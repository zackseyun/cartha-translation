  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/009.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] me fut adressée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, la forme narrative de היה s’exprime naturellement en français avec « la parole… fut adressée », sans calquer le tour hébreu « et il arriva ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans la formule דְבַר יְהוָה, « la parole » conserve l’expression prophétique traditionnelle et les échos intertextuels mieux que « un message ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé dans le texte par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » traduit avec naturel la direction vers le prophète exprimée par la préposition et le suffixe hébreux.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Puisque les paroles annoncées suivent au verset suivant, les deux-points rendent idiomatiquement la fonction introductive de לֵאמֹר en français, là où « en disant » serait plus lourd.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le nom divin. « Yahvé » le conserve, tandis que la note signale le remplacement traditionnel par le titre « le SEIGNEUR ».
translation_notes:
  register: Français moderne, digne et fluide. La formule passive « me fut adressée » est courante dans le registre prophétique sans être archaïque ; les deux-points annoncent directement le contenu du discours au verset suivant.
