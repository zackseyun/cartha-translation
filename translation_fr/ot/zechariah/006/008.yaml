  source_fidelity: 'Le sens global est bien rendu : le cri/appel, le départ vers le nord, la répétition géographique et l’action achevée de « donner du repos » sont conservés. Toutefois, la majuscule à « Esprit » identifie plus explicitement le référent au Saint-Esprit, alors que רוּחִי peut aussi désigner l’esprit, la disposition ou l’activité divine. La minuscule préserve mieux l’ambiguïté du texte source.'
