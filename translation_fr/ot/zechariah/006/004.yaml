  - severity: low
    issue: La note de bas de page attribue au participe une idée de parole régulière.
    rationale: Le participe caractérise l’ange comme celui qui parle avec le prophète, possiblement dans le déroulement de la vision ; il n’impose pas l’idée qu’il le fait régulièrement.
