base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: fr
  text: 'Alors je pris la parole et je dis à l’ange qui parlait avec moi[a] : « Que sont ceux-ci, mon seigneur ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui s’entretenait avec moi ». Le participe hébreu présente l’ange comme celui qui parle avec le prophète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: Alors je pris la parole et je dis
  rationale: La succession de deux wayyiqtol fait avancer le récit. La tournure française « prendre la parole et dire » conserve les deux verbes sans produire l’expression peu naturelle « répondre et dire ».
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: מַלְאָךְ peut désigner un messager, mais, dans le cadre visionnaire de Zacharie, il s’agit de l’être céleste qui explique la vision.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: Le participe présente l’ange dans son rôle continu ou caractéristique d’interlocuteur du prophète. En français moderne, « parler à quelqu’un » rend naturellement cette relation.
- source_word: מָה אֵלֶּה
  choice: Que sont ceux-ci
  rationale: Le démonstratif pluriel renvoie aux éléments masculins de la vision, ici les chars. « Ceux-ci » préserve cette référence sans ajouter un nom absent de l’hébreu.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une formule respectueuse adressée à l’ange, et non du nom divin. La minuscule évite de suggérer une identification avec Dieu tout en conservant la valeur honorifique.
theological_decisions:
- issue: Référent et portée de אֲדֹנִי
  choice: 'Une adresse respectueuse à l’ange : « mon seigneur »'
  alternative: « Seigneur », compris comme un titre divin
  rationale: L’interlocuteur immédiat est explicitement l’ange qui parle au prophète. Le possessif et la minuscule préservent l’honneur exprimé sans diviniser l’ange.
translation_notes:
  register: Français international actuel, digne et accessible. « Alors » marque la progression narrative; « prit la parole » évite un calque hébraïque maladroit. Le démonstratif masculin pluriel renvoie naturellement aux chars du contexte immédiat.
