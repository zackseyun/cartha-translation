  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֵלָי/ו֙ לֵ/אמֹ֔ר כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הִנֵּה אִ֞ישׁ צֶ֤מַח שְׁמ/וֹ֙ וּ/מִ/תַּחְתָּ֣י/ו יִצְמָ֔ח וּ/בָנָ֖ה אֶת הֵיכַ֥ל יְהוָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/012.yaml
  text: 'And say to him[a], ‘Thus says Yahweh of Armies: Behold, a man—Branch is his name—and he will branch out from his place and build the temple of Yahweh.’'
translation:
  language: fr
  text: 'Et tu lui diras : « Ainsi parle Yahweh des armées : Voici un homme — Germe est son nom. Il germera de l’endroit où il se trouve[a] et construira le temple de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « de dessous lui, il germera ».'
    reason: La tournure hébraïque est condensée et peut être rendue plus littéralement ainsi, bien que cette formulation soit moins naturelle et potentiellement ambiguë en français.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette expression rend le sens concret du pluriel hébreu dans un français moderne et immédiatement compréhensible.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » conserve la force présentative et solennelle de l’interjection dans une proclamation prophétique.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom masculin singulier désigne ici une figure masculine précise.
- source_word: צֶמַח
  choice: Germe
  rationale: Le mot est traité comme une désignation prenant valeur de nom, conformément à la formule « Germe est son nom ». « Germe » permet aussi de conserver le lien lexical et l’image végétale avec le verbe suivant.
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: Cette formulation rend directement la construction hébraïque de dénomination sans préciser davantage s’il s’agit d’un nom ou d’un titre.
- source_word: וּמִתַּחְתָּיו
  choice: de l’endroit où il se trouve
  rationale: L’hébreu est condensé et signifie littéralement « de dessous lui ». La formulation retenue exprime naturellement en français l’idée d’une croissance issue de son propre lieu, tandis que la lecture plus littérale est signalée en note.
- source_word: יִצְמָח
  choice: il germera
  rationale: Le verbe « germer » maintient le jeu de mots hébreu avec le nom « Germe » et conserve l’image végétale.
- source_word: וּבָנָה
  choice: et construira
  rationale: Le futur convient à la portée prédictive du contexte et le sujet reste la figure précédemment désignée.
- source_word: הֵיכַל
  choice: le temple
  rationale: Dans ce contexte, le terme désigne clairement le temple de Yahweh ; « temple » est l’équivalent français usuel et précis.
theological_decisions:
- issue: Portée messianique de צֶמַח
  choice: Rendre le terme par la désignation « Germe », avec une majuscule, sans expliciter davantage son identité.
  alternative: Employer le nom commun « germe » ou « rejeton », ou ajouter explicitement « le Messie ».
  rationale: La syntaxe « Germe est son nom » soutient une valeur de désignation. Le contexte prophétique lui donne une résonance messianique, mais la traduction ne doit pas insérer une identification que le verset ne formule pas explicitement.
- issue: Identité de celui qui construit le temple
  choice: Conserver la référence à « un homme » puis au sujet implicite « il », sans identifier cette figure.
  alternative: Identifier explicitement cet homme à Josué ou au Messie.
  rationale: Le texte nomme seulement un homme appelé « Germe ». Maintenir cette formulation préserve l’ambiguïté interprétative du passage.
translation_notes:
  register: Français international moderne, sobre et solennel. La structure de proclamation prophétique est conservée, de même que le jeu de mots entre « Germe » et « germera ». Le tiret met en relief la formule de dénomination sans ajouter d’explication interprétative.
