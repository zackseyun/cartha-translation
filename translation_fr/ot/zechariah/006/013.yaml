  variant: modern international French
source:
  edition: WLC
  text: וְ֠/הוּא יִבְנֶ֞ה אֶת הֵיכַ֤ל יְהוָה֙ וְ/הֽוּא יִשָּׂ֣א ה֔וֹד וְ/יָשַׁ֥ב וּ/מָשַׁ֖ל עַל כִּסְא֑/וֹ וְ/הָיָ֤ה כֹהֵן֙ עַל כִּסְא֔/וֹ וַ/עֲצַ֣ת שָׁל֔וֹם תִּהְיֶ֖ה בֵּ֥ין שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/013.yaml
  text: Yes[a], he will build the temple of Yahweh, and he will bear majesty, and he will sit and rule on his throne. And he will be a priest on his throne[c][b], and the counsel of peace will be between the two of them.
translation:
  language: fr
  text: C’est lui qui bâtira le temple de Yahweh. Il portera la majesté[c], siégera et régnera sur son trône. Il sera prêtre sur son trône[a], et il y aura entre eux deux un conseil de paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et il y aura un prêtre sur son trône ». L’hébreu peut être compris comme distinguant le prêtre du souverain assis sur le trône.'
    reason: alternative_reading
  - marker: b
    text: « Eux deux » peut désigner les fonctions royale et sacerdotale, ou deux personnages distincts, par exemple le souverain et le prêtre.
    reason: alternative_reading
  - marker: c
    text: Ou « l’honneur » ou « la splendeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: C’est lui qui
  rationale: La construction avec le pronom explicite met le sujet en relief. « C’est lui qui » rend cette insistance naturellement en français, sans ajouter le « oui » absent du texte hébreu.
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: Dans ce contexte, הֵיכָל désigne clairement le sanctuaire de Yahweh. Le nom divin est translittéré afin de conserver le nom personnel du texte source.
- source_word: יִשָּׂא הוֹד
  choice: Il portera la majesté
  rationale: La traduction conserve l’image concrète de נשׂא, « porter », ainsi que la dignité royale exprimée par הוֹד. Une note signale les principales nuances lexicales possibles.
- source_word: וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ
  choice: siégera et régnera sur son trône
  rationale: « Siégera » exprime idiomatiquement le fait de prendre place comme souverain, tandis que « régnera » conserve le sens royal de משׁל et la mention explicite du trône.
- source_word: וְהָיָה כֹהֵן עַל כִּסְאוֹ
  choice: Il sera prêtre sur son trône
  rationale: La lecture la plus directe maintient le même sujet masculin singulier. La formulation frappante « sur son trône » est conservée, sans expliquer ni harmoniser les fonctions royale et sacerdotale.
- source_word: וַעֲצַת שָׁלוֹם
  choice: un conseil de paix
  rationale: « Conseil » garde les sens possibles de délibération, projet ou dessein portés par עֵצָה, tandis que « de paix » reproduit la construction compacte de l’hébreu.
- source_word: בֵּין שְׁנֵיהֶם
  choice: entre eux deux
  rationale: La traduction conserve la référence énigmatique aux « deux » sans préciser s’il s’agit de deux personnes ou de deux fonctions.
theological_decisions:
- issue: Identité du prêtre et référent de « eux deux »
  choice: Maintenir le même sujet dans « Il sera prêtre sur son trône », tout en laissant « entre eux deux » sans référent explicité.
  alternative: Comprendre qu’un prêtre distinct se tient auprès du souverain et que la paix règne entre ces deux personnes; ou comprendre « les deux » comme les fonctions royale et sacerdotale réunies en une seule personne.
  rationale: L’enchaînement grammatical favorise le maintien du sujet singulier, mais la mention finale de « deux » crée une tension réelle. Le texte principal et les notes la préservent sans imposer une synthèse théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique est conservé par des propositions brèves. « C’est lui qui » rend l’emphase initiale; « siégera » évite le calque peu naturel « s’assiéra » tout en maintenant l’image royale. Les ambiguïtés relatives au prêtre et aux « deux » restent ouvertes.
