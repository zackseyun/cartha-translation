  text: וְ/הָ/אֲמֻצִּ֣ים יָצְא֗וּ וַ/יְבַקְשׁוּ֙ לָ/לֶ֨כֶת֙ לְ/הִתְהַלֵּ֣ך בָּ/אָ֔רֶץ וַ/יֹּ֕אמֶר לְכ֖וּ הִתְהַלְּכ֣וּ בָ/אָ֑רֶץ וַ/תִּתְהַלַּ֖כְנָה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/007.yaml
  text: And the strong ones came out and sought to go[a], to walk throughout the earth. And he said, “Go[b], walk throughout the earth,” and they walked throughout the earth.
translation:
  language: fr
  text: 'Les puissants[a] sortirent et cherchèrent à partir pour parcourir la terre. Il leur dit : « Allez, parcourez la terre[b]. » Et ils parcoururent la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les tachetés » (traditionnellement, une désignation de couleur pour les chevaux ou les attelages) ; selon la vocalisation du texte massorétique, l’hébreu se lit plus naturellement « les puissants ».
    reason: alternative_reading
  - marker: b
    text: Ou « parcourez le pays » ; le mot hébreu peut désigner soit la terre, soit un pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲמֻצִּים
  choice: les puissants
  rationale: Le terme, tel qu’il est vocalisé dans le texte massorétique, dérive de la notion de force. « Les puissants » est naturel en français et conserve la valeur substantivée de l’adjectif.
- source_word: יָצְאוּ
  choice: sortirent
  rationale: Le verbe יצא signifie couramment « sortir ». Le passé simple convient au registre narratif soutenu sans être archaïque.
- source_word: וַיְבַקְשׁוּ לָלֶכֶת
  choice: cherchèrent à partir
  rationale: בקש suivi de l’infinitif exprime ici une volonté ou une tentative. « Cherchèrent à » en préserve la force, tandis que « partir » rend naturellement הלך après « sortirent ».
- source_word: לְהִתְהַלֵּךְ / הִתְהַלְּכוּ / וַתִּתְהַלַּכְנָה
  choice: parcourir / parcourez / parcoururent
  rationale: Le hitpael de הלך évoque un déplacement répété ou étendu dans une région. « Parcourir » restitue cette idée plus naturellement que la répétition littérale de « marcher çà et là », tout en conservant les trois reprises du même verbe.
- source_word: בָּאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un pays. Dans cette vision d’agents envoyés dans plusieurs directions, « la terre » convient au cadre mondial, sans exclure l’autre sens lexical signalé en note.
- source_word: וַיֹּאמֶר
  choice: Il leur dit
  rationale: Le sujet masculin singulier est implicite et renvoie naturellement au personnage qui donne l’ordre dans la vision. Le complément « leur » est explicité en français d’après les destinataires pluriels de l’impératif.
- source_word: לְכוּ
  choice: Allez
  rationale: Traduction directe et idiomatique de l’impératif masculin pluriel de הלך.
theological_decisions:
- issue: Portée de אֶרֶץ dans la vision
  choice: terre
  alternative: pays
  rationale: Le mouvement des agents divins vers plusieurs directions favorise une portée universelle. La polysémie du terme hébreu est néanmoins conservée en note.
- issue: Identité de הָאֲמֻצִּים
  choice: les puissants
  alternative: les chevaux tachetés
  rationale: La vocalisation massorétique indique un adjectif lié à la force. Le contexte des attelages distingués par la couleur explique cependant la lecture traditionnelle fondée sur une couleur, qui mérite d’être signalée sans remplacer le texte massorétique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple assure la cohésion du récit visionnaire. « Parcourir » rend de façon idiomatique le mouvement étendu du hitpael hébreu, et sa répétition maintient l’insistance du texte source.
