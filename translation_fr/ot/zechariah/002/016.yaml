id: ZEC.2.16
reference: Zechariah 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָחַ֨ל יְהוָ֤ה אֶת יְהוּדָה֙ חֶלְק֔/וֹ עַ֖ל אַדְמַ֣ת הַ/קֹּ֑דֶשׁ וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/016.yaml
  text: And Yahweh will inherit Judah as his portion in the holy land[b][a], and he will again choose Jerusalem.
translation:
  language: fr
  text: Yahweh recevra Juda comme sa part d’héritage[a], sur la terre sainte[b], et il choisira de nouveau Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prendra possession de Juda comme de sa part d’héritage ». L’hébreu conserve ici le vocabulaire de l’héritage.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur le sol de sainteté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחַל
  choice: recevra en héritage
  rationale: Le qal de נחל exprime ici le fait de recevoir ou de posséder en héritage. Cette formulation française garde l’image de l’héritage tout en évitant l’ambiguïté de « héritera de Juda », qui pourrait signifier que Juda est le donateur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans l’hébreu plutôt que de le remplacer par un titre.
- source_word: אֶת יְהוּדָה
  choice: Juda
  rationale: Le nom propre, marqué comme complément d’objet direct, est rendu selon sa forme française usuelle.
- source_word: חֶלְקוֹ
  choice: comme sa part
  rationale: חֵלֶק désigne une part ou un lot attribué. « Comme sa part » conserve l’image de la répartition et précise le rapport de Juda à Yahweh.
- source_word: עַל אַדְמַת הַקֹּדֶשׁ
  choice: sur la terre sainte
  rationale: La formulation naturelle garde à la fois le sens territorial de אֲדָמָה et son caractère consacré, tout en conservant la préposition « sur ».
- source_word: וּבָחַר
  choice: et il choisira
  rationale: בחר signifie choisir ou sélectionner. Le pronom reprend naturellement Yahweh, sujet de la proposition précédente.
- source_word: עוֹד
  choice: de nouveau
  rationale: Dans ce contexte de restauration, עוֹד indique un choix renouvelé de Jérusalem.
- source_word: בִּירוּשָׁלָם
  choice: Jérusalem
  rationale: Le nom propre est rendu selon sa forme française conventionnelle.
theological_decisions:
- issue: L’image de Juda comme héritage de Yahweh
  choice: Conserver la formulation « Yahweh recevra Juda en héritage, comme sa part »
  alternative: Yahweh prendra possession de Juda comme de son domaine
  rationale: L’hébreu applique à Yahweh le vocabulaire de l’héritage et du lot, alors qu’il sert souvent à parler de l’héritage d’Israël. Maintenir cette tension exprime l’appartenance réciproque liée à l’alliance sans la réduire à une possession générique.
- issue: Le sens de אַדְמַת הַקֹּדֶשׁ
  choice: la terre sainte
  alternative: le sol de sainteté
  rationale: L’expression qualifie la terre par sa consécration. « La terre sainte » communique clairement sa portée géographique et sacrée sans ajouter de précision doctrinale absente de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image inhabituelle de l’héritage, tandis que « recevra Juda en héritage » évite le contresens possible de « héritera de Juda ». Le nom divin est rendu par « Yahweh ».
