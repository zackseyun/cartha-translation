  text: וַ/יֹּ֣אמֶר אֵלָ֔/ו רֻ֗ץ דַּבֵּ֛ר אֶל הַ/נַּ֥עַר הַלָּ֖ז לֵ/אמֹ֑ר פְּרָזוֹת֙ תֵּשֵׁ֣ב יְרוּשָׁלִַ֔ם מֵ/רֹ֥ב אָדָ֛ם וּ/בְהֵמָ֖ה בְּ/תוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/008.yaml
  text: And he said to him[a], “Run, speak to that young man, saying[b], ‘Jerusalem will dwell as open country because of the multitude of man and livestock within her.’”
translation:
  language: fr
  text: 'Il lui dit : « Cours, parle à ce jeune homme et dis-lui : “Jérusalem sera habitée comme des villages sans murailles[a], à cause du grand nombre d’êtres humains[b] et de bétail en son sein.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jérusalem s’étendra en pleine campagne. »'
    reason: Le pluriel פְּרָזוֹת peut décrire des villages non fortifiés ou, plus largement, un habitat ouvert qui dépasse les murailles.
  - marker: b
    text: L’hébreu emploie ici le singulier collectif אָדָם, qui désigne la population humaine.
    reason: La note signale la forme collective du terme et explique le choix d’une expression plurielle naturelle en français.
lexical_decisions:
- source_word: רֻץ
  choice: Cours
  rationale: L’impératif exprime directement et vivement l’urgence du déplacement.
- source_word: דַּבֵּר
  choice: parle
  rationale: Le piel impératif désigne l’acte de prendre la parole; « parle » en conserve la forme sans le réduire à une simple transmission d’information.
- source_word: הַנַּעַר הַלָּז
  choice: ce jeune homme
  rationale: נַעַר peut désigner un garçon ou un jeune homme; dans cette scène prophétique, « jeune homme » convient au contexte, tandis que « ce » rend naturellement le démonstratif.
- source_word: פְּרָזוֹת
  choice: comme des villages sans murailles
  rationale: Le pluriel évoque des lieux habités ouverts, dépourvus de fortifications. Cette formulation conserve à la fois le pluriel et l’idée d’une Jérusalem dont l’habitat déborde toute enceinte.
- source_word: תֵּשֵׁב
  choice: sera habitée
  rationale: Le qal imparfait de ישב exprime ici l’établissement durable d’une population. Le passif français est plus naturel que la personnification « Jérusalem habitera », tout en gardant le sens contextuel.
- source_word: מֵרֹב
  choice: à cause du grand nombre de
  rationale: 'La préposition מִן avec רֹב indique ici la cause: l’ouverture de la ville résulte de l’abondance de sa population et de ses animaux.'
- source_word: אָדָם
  choice: êtres humains
  rationale: Le singulier collectif désigne ici la population humaine, mise en parallèle avec les animaux; « êtres humains » transmet clairement ce sens collectif en français moderne.
- source_word: וּבְהֵמָה
  choice: et de bêtes
  rationale: בְּהֵמָה est un collectif désignant les animaux domestiques. « Bêtes » reste large et naturel dans le binôme biblique humains–animaux, sans limiter le terme aux bovins.
- source_word: בְּתוֹכָהּ
  choice: en son sein
  rationale: La formule rend le suffixe féminin renvoyant à Jérusalem et conserve la représentation de la ville comme une entité féminine.
theological_decisions:
- issue: Sens collectif de אָדָם
  choice: êtres humains
  alternative: hommes; humanité
  rationale: Le contexte oppose collectivement la population humaine aux animaux. « Êtres humains » préserve cette portée générique sans laisser entendre qu’il ne s’agit que des personnes de sexe masculin.
- issue: Image de Jérusalem en פְּרָזוֹת
  choice: sera habitée comme des villages sans murailles
  alternative: s’étendra en pleine campagne
  rationale: Le texte peut évoquer soit le mode d’habitation de villages non fortifiés, soit l’étendue ouverte dépassant les remparts. Le texte principal conserve plus directement le pluriel hébreu, et la note maintient l’autre nuance spatiale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la succession urgente des impératifs. La formulation principale reste proche de l’image hébraïque tout en évitant une expression française obscure; les deux ambiguïtés lexicales significatives sont conservées en notes.
