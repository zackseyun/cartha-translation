  text: וָ/אֹמַ֗ר אֶל הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י מָה אֵ֑לֶּה וַ/יֹּ֣אמֶר אֵלַ֔/י אֵ֤לֶּה הַ/קְּרָנוֹת֙ אֲשֶׁ֣ר זֵר֣וּ אֶת יְהוּדָ֔ה אֶת יִשְׂרָאֵ֖ל וִ/ירוּשָׁלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/002.yaml
  text: And I said to the angel who was speaking with me[a], “What are these?” And he said to me, “These are the horns that scattered Judah, Israel, and Jerusalem.”
translation:
  language: fr
  text: 'Je demandai à l’ange qui me parlait : « Que sont celles-ci ? » Il me répondit : « Ce sont les cornes[a] qui ont dispersé Juda, Israël et Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les puissances » ou « les royaumes » ; l’hébreu dit « les cornes », image prophétique courante de la force ou du pouvoir souverain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: מַלְאָךְ peut désigner un messager ou un ange. Dans cette vision, il s’agit du personnage céleste qui dialogue avec le prophète ; « ange » exprime donc naturellement le référent.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: Dans Zacharie, le participe דֹּבֵר suivi de בְּ et d’un suffixe désigne l’ange interprète en conversation avec le prophète. « Qui me parlait » rend cet idiome naturellement, sans retenir le calque peu probable « qui parlait en moi ».
- source_word: מָה אֵלֶּה
  choice: Que sont celles-ci ?
  rationale: L’interrogatif et le démonstratif pluriel sont conservés. Le féminin « celles-ci » reprend naturellement en français les cornes vues dans la vision, sans ajouter une interprétation du symbole.
- source_word: הַקְּרָנוֹת
  choice: les cornes
  rationale: קֶרֶן signifie littéralement « corne » et sert ici d’image prophétique de la force ou du pouvoir. La traduction garde l’image donnée par le texte plutôt que de la remplacer par son interprétation.
- source_word: זֵרוּ
  choice: ont dispersé
  rationale: זרה exprime l’action de disperser, parfois avec la nuance de vanner. Ici, « disperser » convient au sort infligé aux peuples et reste clair en français moderne.
- source_word: יְהוּדָה ... יִשְׂרָאֵל ... וִירוּשָׁלָם
  choice: Juda, Israël et Jérusalem
  rationale: Les trois noms propres sont rendus sous leurs formes françaises usuelles, dans l’ordre et la coordination du texte hébreu.
theological_decisions:
- issue: Portée symbolique des « cornes »
  choice: Conserver l’image littérale « cornes » dans le texte principal.
  alternative: Traduire par « puissances » ou « royaumes ».
  rationale: Le passage nomme les objets de la vision comme des cornes. Remplacer directement cette image par une interprétation résoudrait indûment le symbole ; une note peut en signaler la portée habituelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. Le dialogue demeure direct et concis ; l’image prophétique est préservée.
