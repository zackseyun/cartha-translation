  text: ה֣וֹי ה֗וֹי וְ/נֻ֛סוּ מֵ/אֶ֥רֶץ צָפ֖וֹן נְאֻם יְהוָ֑ה כִּ֠י כְּ/אַרְבַּ֞ע רוּח֧וֹת הַ/שָּׁמַ֛יִם פֵּרַ֥שְׂתִּי אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/010.yaml
  text: Up! Up! Flee from the land of the north[a], declares Yahweh, for I have spread you abroad to the four winds of the heavens[b], declares Yahweh.
translation:
  language: fr
  text: « Debout ! Debout ![a] Fuyez loin du pays du nord, déclare Yahweh, car je vous ai répandus comme les quatre vents du ciel[b], déclare Yahweh. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire l’interjection par « Hé ! Hé ! » La répétition exprime ici un appel pressant, d’où « Debout ! Debout ! ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je vous ai répandus aux quatre vents du ciel ». L’hébreu peut se comprendre soit comme une comparaison (« comme les quatre vents »), soit comme une expression directionnelle (« aux quatre vents »).'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי הוֹי
  choice: Debout ! Debout !
  rationale: Dans ce contexte, l’interjection répétée lance un appel pressant à agir plutôt qu’une lamentation. « Debout ! » exprime naturellement cette urgence en français moderne.
- source_word: וְנֻסוּ
  choice: Fuyez
  rationale: L’impératif pluriel de נוּס ordonne une fuite immédiate ; « Fuyez » en conserve la force directe.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: le pays du Nord
  rationale: Cette formulation naturelle garde la construction géographique de l’hébreu et sa possible résonance liée au lieu d’exil.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue de manière solennelle et intelligible, tandis que le nom divin est conservé sous la forme « Yahweh ».
- source_word: כִּי
  choice: car
  rationale: « Car » introduit naturellement le motif donné à l’ordre de fuir.
- source_word: כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: comme les quatre vents du ciel
  rationale: Le כ préfixé favorise formellement une comparaison. Cette traduction conserve cette lecture sans effacer la possibilité d’un idiome directionnel.
- source_word: פֵּרַשְׂתִּי אֶתְכֶם
  choice: je vous ai dispersés
  rationale: Le verbe évoque l’action d’étendre ou de répandre. Dans ce contexte d’exil à travers les directions du monde, « dispersés » rend clairement l’image sans en préciser indûment les modalités.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Nature de la dispersion aux quatre vents
  choice: 'comparaison : « comme les quatre vents du ciel »'
  alternative: 'direction : « aux quatre vents du ciel »'
  rationale: La préposition כ soutient la lecture comparative, mais la tournure peut aussi être comprise comme une dispersion dans toutes les directions. L’ambiguïté est donc signalée plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif et la répétition préservent l’urgence prophétique ; la légère étrangeté de la comparaison est maintenue dans le texte afin de respecter la formulation hébraïque, avec l’autre lecture en note.
