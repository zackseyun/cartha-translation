  text: Up[a], Zion! Escape, you who dwell with Daughter Babylon.
translation:
  language: fr
  text: Debout[a], Sion ! Échappe-toi, toi qui habites dans la Fille de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Holà, Sion ! Sauve-toi, toi qui habites dans la Fille de Babylone. »'
    reason: « Holà ! » est une autre manière de rendre l’interjection d’appel ; « Sauve-toi » rend de façon plus idiomatique l’impératif « Échappe-toi ».
lexical_decisions:
- source_word: הוֹי
  choice: Debout !
  rationale: Dans ce contexte, l’interjection introduit un appel pressant à agir, non une lamentation. « Debout ! » restitue cette vive sommation en français actuel ; « Holà ! » serait plus littéral mais moins naturel.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Le nom propre reçoit sa forme française biblique habituelle. Il désigne ici Sion personnifiée et interpellée au féminin.
- source_word: הִמָּלְטִי
  choice: Échappe-toi
  rationale: L’impératif nifal féminin singulier de מלט appelle la destinataire à se mettre hors de danger. « Échappe-toi » conserve à la fois l’urgence et la nuance de délivrance, sans préciser indûment le moyen.
- source_word: יוֹשֶׁבֶת
  choice: toi qui habites
  rationale: Le participe féminin singulier qualifie la destinataire dans une tournure vocative. « Toi qui habites » en conserve la valeur tout en restant naturel en français.
- source_word: בַּת בָּבֶל
  choice: la fille de Babylone
  rationale: Cette traduction proche de la construction hébraïque préserve la personnification prophétique. En français, « la fille de Babylone » est plus intelligible et idiomatique que « Fille Babylone ».
theological_decisions:
- issue: Référent de l’interpellation au féminin singulier
  choice: Le texte interpelle Sion, personnifiée comme une femme et présentée comme habitant chez la fille de Babylone.
  alternative: On peut comprendre l’expression comme visant symboliquement une femme particulière habitant Babylone, ou collectivement les exilés liés à Sion.
  rationale: Les formes féminines et la structure vocative permettent de prendre Sion comme destinataire personnifiée. La formulation française conserve cette image et ne remplace pas le singulier du texte par une explicitation collective.
- issue: Rapport exprimé par ב dans בַּת בָּבֶל
  choice: chez la fille de Babylone
  alternative: dans la fille de Babylone
  rationale: La préposition peut être rendue littéralement par « dans », mais appliquée à une ville personnifiée, « chez » exprime naturellement la résidence auprès d’elle sans supprimer la métaphore.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’adresse directe, le féminin singulier et la personnification prophétique sont maintenus.
