  text: וַ/אֲנִ֤י אֶֽהְיֶה לָּ/הּ֙ נְאֻם יְהוָ֔ה ח֥וֹמַת אֵ֖שׁ סָבִ֑יב וּ/לְ/כָב֖וֹד אֶֽהְיֶ֥ה בְ/תוֹכָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/009.yaml
  text: And I myself will be for her a wall of fire all around[a], declares Yahweh, and I will be glory in her midst.
translation:
  language: fr
  text: Et moi, je serai pour elle une muraille de feu tout autour — déclare Yahweh —, et je serai gloire en son sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je serai gloire en son sein ». On peut aussi traduire : « je serai une gloire en son sein ». L’hébreu n’emploie ici ni article ni possessif explicite.'
    reason: Préserver l’ambiguïté du prédicat לְכָבוֹד et expliquer la tournure française littérale.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant אָנִי renforce le sujet déjà exprimé par le verbe. « Quant à moi » restitue cette mise en relief en français naturel, tandis que וַ relie la déclaration à son contexte.
- source_word: אֶהְיֶה לָהּ
  choice: je serai pour elle
  rationale: L’imparfait hébreu a ici une valeur future. La préposition לְ marque la relation et la fonction exercée en faveur de la ville personnifiée.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique solennelle est rendue de façon claire et actuelle, et le tétragramme est transcrit par le nom personnel « Yahweh ».
- source_word: חוֹמַת אֵשׁ סָבִיב
  choice: une muraille de feu tout autour
  rationale: La traduction conserve la chaîne construite « muraille de feu » ainsi que l’image d’une protection divine encerclant entièrement la ville.
- source_word: וּלְכָבוֹד אֶהְיֶה
  choice: et je serai sa gloire
  rationale: La tournure française exprime naturellement que Yahweh lui-même constituera la gloire de la ville. Le possessif explicite la relation suggérée par le contexte et par לְ, sans réduire « gloire » à un simple adjectif.
- source_word: בְתוֹכָהּ
  choice: en son sein
  rationale: Cette expression indique une présence à l’intérieur, au cœur de la ville, tout en maintenant sa personnification féminine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Personnification féminine de Jérusalem/Sion
  choice: elle / son sein / sa gloire
  alternative: neutraliser par « la ville » ou répéter « Jérusalem »
  rationale: Les suffixes hébreux sont au féminin singulier. Les conserver respecte la personnification littéraire sans ajouter un nom absent de ce verset.
- issue: Valeur du prédicat לְכָבוֹד
  choice: sa gloire
  alternative: une gloire / gloire
  rationale: L’hébreu permet de comprendre « gloire » comme ce que Yahweh sera pour la ville, mais ne comporte pas de possessif explicite. Le texte principal privilégie un français naturel et la note maintient l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Muraille » convient à l’image d’une enceinte urbaine ; « en son sein » garde une tonalité prophétique soutenue sans archaïsme marqué. Les tirets encadrent naturellement la formule d’oracle.
