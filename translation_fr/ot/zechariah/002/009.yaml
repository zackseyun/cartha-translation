    rationale: Le syntagme וּלְכָבוֹד ne contient pas de suffixe possessif. Le contexte permet de comprendre que cette gloire est celle de la ville, mais le texte ne l’explicite pas; l’ajout réduit l’ambiguïté que la note cherche à préserver.
  - severity: low
    issue: « Quant à moi » peut suggérer un contraste plus marqué que ne l’exige le waw initial.
    rationale: L’hébreu coordonne et met le sujet en relief. « Et moi » préserve ces deux éléments de manière plus directe.
