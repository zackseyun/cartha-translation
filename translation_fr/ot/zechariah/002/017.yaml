id: ZEC.2.17
reference: Zechariah 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ֥ס כָּל בָּשָׂ֖ר מִ/פְּנֵ֣י יְהוָ֑ה כִּ֥י נֵע֖וֹר מִ/מְּע֥וֹן קָדְשֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/017.yaml
  text: Be silent[a], all flesh, before Yahweh[b], for he has roused himself from his holy dwelling.
translation:
  language: fr
  text: Silence devant Yahweh, toute chair[a] ! Car, de sa demeure sainte, il s’est éveillé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’humanité ». L’hébreu dit littéralement « toute chair », expression prophétique qui souligne la condition de créature des humains devant Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « il s’est levé » ou « il s’est mis en mouvement ». Le verbe hébreu représente Yahweh sortant du repos pour agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַס
  choice: Silence
  rationale: L’interjection appelle solennellement au silence. « Silence » est direct, naturel en français et plus précis que « Tenez-vous tranquilles ».
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: La formulation littérale conserve l’expression prophétique et souligne la condition de créature de l’humanité devant Dieu, tout en restant compréhensible en français biblique courant.
- source_word: מִפְּנֵי
  choice: devant
  rationale: Dans cette expression liée à la face ou à la présence, « devant » rend de manière concise et idiomatique l’idée d’être en présence de quelqu’un.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le motif de l’appel au silence.
- source_word: נֵעוֹר
  choice: il s’est éveillé
  rationale: Le verbe évoque quelqu’un qui sort du repos pour agir. « S’est éveillé » préserve cette image sans expliciter davantage l’action divine.
- source_word: מִמְּעוֹן קָדְשׁוֹ
  choice: de sa demeure sainte
  rationale: « Demeure » rend clairement le lieu d’habitation, tandis que l’antéposition du complément évite que « depuis » soit compris au sens temporel en français.
theological_decisions:
- issue: Portée anthropologique de « toute chair »
  choice: Conserver « toute chair »
  alternative: toute l’humanité
  rationale: L’expression désigne largement les êtres humains, mais sa forme concrète met aussi en relief leur fragilité et leur condition de créatures devant Yahweh. La traduction conserve cette tension.
- issue: Sens de l’éveil attribué à Dieu
  choice: il s’est éveillé
  alternative: il s’est levé / il s’est mis en mouvement
  rationale: Le texte représente Yahweh sortant du repos pour intervenir. La formulation imagée est conservée sans la réduire à un simple déplacement ni définir la nature de son action.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le nom personnel est conservé par translittération plutôt que remplacé par un titre.
translation_notes:
  register: Français international moderne, solennel et accessible. L’impératif nominal « Silence » garde la force de l’interjection hébraïque. L’ordre « de sa demeure sainte, il s’est éveillé » préserve la valeur spatiale de la préposition sans susciter l’ambiguïté temporelle de « depuis ».
