  text: וָ/אֹמַ֕ר מָ֛ה אֵ֥לֶּה בָאִ֖ים לַֽ/עֲשׂ֑וֹת וַ/יֹּ֣אמֶר לֵ/אמֹ֗ר אֵ֣לֶּה הַ/קְּרָנ֞וֹת אֲשֶׁר זֵ֣רוּ אֶת יְהוּדָ֗ה כְּ/פִי אִישׁ֙ לֹא נָשָׂ֣א רֹאשׁ֔/וֹ וַ/יָּבֹ֤אוּ אֵ֨לֶּה֙ לְ/הַחֲרִ֣יד אֹתָ֔/ם לְ/יַדּ֞וֹת אֶת קַרְנ֣וֹת הַ/גּוֹיִ֗ם הַ/נֹּשְׂאִ֥ים קֶ֛רֶן אֶל אֶ֥רֶץ יְהוּדָ֖ה לְ/זָרוֹתָֽ/הּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/004.yaml
  text: Then I said[a], “What are these coming to do?” And he said, “These are the horns that scattered Judah, so that no one lifted up his head; and these have come to terrify them[c][b], to cast down the horns of the nations that lifted up a horn against the land of Judah to scatter her.”
translation:
  language: fr
  text: 'Je demandai : « Que viennent-ils faire ? » Il répondit : « Voici les cornes[b] qui ont dispersé Juda, au point que personne ne relevait la tête[a]. Ceux-ci sont venus les épouvanter et abattre[c] les cornes des nations qui ont dressé leur corne contre le pays de Juda pour disperser Juda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche d’un homme, il ne relevait pas sa tête ». Cette expression évoque l’humiliation ou l’impuissance.'
    reason: lexical_alternative
  - marker: b
    text: Les « cornes » symbolisent la puissance ou la force agressive ; l’image est conservée plutôt qu’interprétée dans le texte principal.
    reason: cultural_note
  - marker: c
    text: 'Ou : « jeter à terre ». Le verbe hébreu est rare et peut évoquer l’action de jeter ou de renverser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּרָנוֹת / קֶרֶן
  choice: les cornes / leur corne
  rationale: Conserve l’image prophétique de la corne comme symbole de puissance agressive, sans la remplacer dans le texte par une interprétation abstraite.
- source_word: זֵרוּ / לְזָרוֹתָהּ
  choice: ont dispersé / pour le disperser
  rationale: Le verbe exprime ici la dispersion de Juda. « Disperser » est naturel en français et convient au contexte d’exil et de jugement.
- source_word: כְּפִי אִישׁ לֹא נָשָׂא רֹאשׁוֹ
  choice: au point que personne ne relevait la tête
  rationale: Rend naturellement l’idiome hébreu décrivant l’humiliation et l’impuissance, tout en conservant l’image de la tête qu’on ne peut relever.
- source_word: לְהַחֲרִיד
  choice: les faire trembler
  rationale: Reproduit concrètement l’idée de provoquer l’effroi ou le tremblement et maintient l’intensité du verbe.
- source_word: לְיַדּוֹת
  choice: jeter à terre
  rationale: Ce verbe rare désigne ici l’abaissement violent des cornes hostiles. « Jeter à terre » reste proche de l’image et évite de préciser indûment le moyen de leur défaite.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Désigne les puissances nationales étrangères hostiles à Juda ; « les nations » est précis et courant dans ce contexte prophétique.
- source_word: הַנֹּשְׂאִים קֶרֶן
  choice: qui ont dressé leur corne
  rationale: Conserve la métaphore hébraïque de l’affirmation orgueilleuse ou agressive de la puissance. Le possessif français rend naturellement la construction.
- source_word: אֵלֶּה בָאִים לַעֲשׂוֹת
  choice: Que viennent-ils faire ?
  rationale: Formulation française directe et naturelle qui préserve l’immédiateté de la scène visionnaire.
- source_word: וַיָּבֹאוּ אֵלֶּה
  choice: Ceux-ci sont venus
  rationale: Distingue les personnages nouvellement apparus des cornes et relie leur venue au but qui suit.
theological_decisions:
- issue: Maintien de l’image symbolique des cornes
  choice: Conserver « cornes » dans le texte principal.
  alternative: Traduire par « puissances » ou « royaumes ».
  rationale: La vision repose sur l’enchaînement symbolique des cornes et des artisans. Interpréter directement les cornes comme des puissances ou des royaumes réduirait l’ouverture de l’image.
- issue: Sens de la formule sur la tête non relevée
  choice: Employer « personne ne relevait la tête ».
  alternative: Employer « aucun homme ne relevait la tête » ou « personne ne pouvait relever la tête ».
  rationale: אִישׁ a ici une valeur représentative. « Personne » exprime cette portée générale en français actuel, tandis que l’ajout de « pouvait » expliciterait une incapacité qui demeure implicite.
- issue: Référent du pronom dans « les faire trembler »
  choice: Conserver le pronom « les », renvoyant naturellement aux cornes dans le contexte immédiat.
  alternative: Expliciter « faire trembler ces cornes » ou comprendre les nations comme référent.
  rationale: Le texte hébreu emploie un pronom masculin pluriel dont le référent contextuel est vraisemblablement les cornes ; le maintien du pronom évite une explicitation plus forte que la source.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible tout en préservant les images concrètes et les ambiguïtés du texte hébreu. « Juda » est traité comme le territoire collectif dispersé ; dans la dernière proposition, « le » reprend explicitement « le pays de Juda ».
