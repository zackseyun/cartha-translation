  naturalness: Le français est globalement moderne et naturel. « Voici les cornes » et « ceux-ci sont venus » rendent plus directement la présentation visionnaire que « Ce sont là » et évitent une tournure légèrement démonstrative. « Les épouvanter » exprime nettement la force de לְהַחֲרִיד, sans interprétation doctrinale.
  terminology: « Juda », « cornes » et « nations » sont appropriés et cohérents avec le registre prophétique. Les notes préservent utilement la valeur symbolique de « cornes » et l’incertitude du verbe rare traduit par « abattre ».
