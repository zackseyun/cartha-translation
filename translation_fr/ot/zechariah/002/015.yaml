source:
  edition: WLC
  text: וְ/נִלְווּ֩ גוֹיִ֨ם רַבִּ֤ים אֶל יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וְ/שָׁכַנְתִּ֣י בְ/תוֹכֵ֔/ךְ וְ/יָדַ֕עַתְּ כִּי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/015.yaml
  text: And many nations will join themselves to Yahweh in that day[a], and they will be my people. And I will dwell in your midst[b], and you will know that Yahweh of Armies has sent me to you.
translation:
  language: fr
  text: En ce jour-là, de nombreuses nations s’attacheront à Yahvé et deviendront mon peuple. J’habiterai au milieu de toi, et tu sauras que Yahvé, le maître des armées[a], m’a envoyé vers toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le SEIGNEUR des armées »; autrefois : « l’Éternel des armées » ou « le SEIGNEUR des puissances » selon les traditions françaises.'
    reason: lexical_alternative
  - marker: b
    text: Le locuteur affirme que Yahvé l’a envoyé vers la destinataire féminine, Sion ou Jérusalem dans le contexte. Le texte n’identifie pas explicitement ce « moi ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִלְווּ
  choice: s’attacheront
  rationale: Le nifal de לוה exprime ici le fait de se joindre à quelqu’un ou de s’attacher à lui. La forme pronominale française rend naturellement cette adhésion volontaire sans effacer sa portée d’allégeance.
- source_word: גוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: גּוֹיִם désigne ici les nations dans leur diversité internationale, plutôt que les « païens » envisagés sous un angle religieux.
- source_word: אֶל יְהוָה
  choice: à Yahvé
  rationale: La préposition marque la personne à laquelle les nations s’attachent. « Yahvé » représente le nom divin יהוה plutôt que de le remplacer silencieusement par un titre.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique courante, rendue dans un français naturel et soutenu.
- source_word: וְהָיוּ לִי לְעָם
  choice: et deviendront mon peuple
  rationale: La tournure hébraïque signifie qu’elles entreront dans la relation exprimée par la formule d’alliance « mon peuple ». Le singulier collectif עָם est conservé.
- source_word: וְשָׁכַנְתִּי בְתוֹכֵךְ
  choice: J’habiterai au milieu de toi
  rationale: שׁכן signifie demeurer ou habiter. « Au milieu de toi » préserve le suffixe féminin singulier, qui renvoie dans le contexte à Sion ou Jérusalem.
- source_word: וְיָדַעַתְּ
  choice: et tu sauras
  rationale: Le verbe est à la deuxième personne du féminin singulier et appartient à une formule prophétique de reconnaissance.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le maître des armées
  rationale: Cette formulation rend le nom divin et donne à צְבָאוֹת son sens transparent d’« armées », tout en produisant une expression française naturelle. La traduction traditionnelle est signalée en note.
- source_word: שְׁלָחַנִי
  choice: m’a envoyé
  rationale: L’accompli hébreu désigne un envoi déjà effectué dont l’identité de l’auteur sera reconnue; le passé composé convient naturellement en français.
- source_word: אֵלַיִךְ
  choice: vers toi
  rationale: Le suffixe est féminin singulier. « Vers toi » conserve le mouvement exprimé par אֶל sans ajouter explicitement Sion ou Jérusalem, noms absents de ce verset.
theological_decisions:
- issue: 'Identité de celui qui dit : « Yahvé, le maître des armées, m’a envoyé »'
  choice: Conserver le pronom « m’ » sans identifier le locuteur
  alternative: Identifier le locuteur comme le messager angélique, le prophète ou une figure divine ou messianique
  rationale: L’hébreu présente délibérément cette formulation saisissante sans préciser ici l’identité du « moi ». La traduction maintient cette tension au lieu de la résoudre par une expansion interprétative.
- issue: Rapport entre les nombreuses nations et le singulier « peuple »
  choice: deviendront mon peuple
  alternative: deviendront mes peuples
  rationale: Malgré le sujet pluriel, עָם reste au singulier et exprime une identité collective dans la formule d’alliance. Le singulier doit donc être préservé.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme prophétique est conservé sans archaïsmes. Le tutoiement singulier maintient l’adresse féminine à Sion ou Jérusalem. Le nom divin est transcrit « Yahvé », et l’appellation צְבָאוֹת est explicitée par « le maître des armées ».
