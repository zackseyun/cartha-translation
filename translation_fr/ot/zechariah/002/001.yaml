  text: And I lifted up my eyes and saw[a], and behold, four horns.
translation:
  language: fr
  text: 'Je levai les yeux et je vis : voici quatre cornes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quatre puissances ». En hébreu, le texte dit « cornes », image biblique courante de la force ou du pouvoir souverain; l’image concrète est conservée dans le texte principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: Je levai les yeux
  rationale: Cette formulation conserve l’expression hébraïque qui signifie diriger son regard, tout en restant naturelle en français.
- source_word: וָאֵרֶא
  choice: et je vis
  rationale: Le verbe ראה décrit simplement la perception visuelle dans la succession du récit.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » garde la force de présentation vive de הִנֵּה et attire l’attention sur ce qui apparaît dans la vision.
- source_word: אַרְבַּע
  choice: quatre
  rationale: Traduction directe du nombre cardinal.
- source_word: קְרָנוֹת
  choice: cornes
  rationale: Le sens concret est conservé, car les cornes constituent l’image symbolique de la vision; traduire directement par « puissances » expliquerait trop tôt le symbole.
theological_decisions:
- issue: Valeur symbolique des quatre cornes dans la vision prophétique
  choice: Conserver « quatre cornes » dans le texte principal.
  alternative: quatre puissances
  rationale: Le verset présente d’abord un symbole dont le contexte suivant précise la portée. Garder l’image évite d’intégrer son interprétation au texte et préserve sa tension symbolique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit visionnaire bref; les deux « je » rendent la phrase naturelle. Les deux-points permettent à « voici » de conserver sa fonction présentative sans alourdir la syntaxe.
