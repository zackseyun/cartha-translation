id: ZEC.2.14
reference: Zechariah 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָנִּ֥י וְ/שִׂמְחִ֖י בַּת צִיּ֑וֹן כִּ֧י הִנְ/נִי בָ֛א וְ/שָׁכַנְתִּ֥י בְ/תוֹכֵ֖/ךְ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/014.yaml
  text: Sing for joy and rejoice[a], daughter Zion, for behold, I am coming, and I will dwell in your midst[c][b], declares Yahweh.
translation:
  language: fr
  text: 'Pousse des cris de joie et réjouis-toi[a], fille de Sion[b], car me voici : je viens, et j’habiterai au milieu de toi, déclare Yahvé[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Chante de joie et réjouis-toi ».
    reason: lexical_alternative
  - marker: b
    text: « Fille de Sion » est une personnification poétique de Sion, c’est-à-dire de Jérusalem.
    reason: cultural_note
  - marker: c
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: רָנִּי
  choice: Pousse des cris de joie
  rationale: L’impératif féminin singulier de רנן exprime une acclamation éclatante et joyeuse. Cette formulation restitue clairement cette force en français courant.
- source_word: וְשִׂמְחִי
  choice: et réjouis-toi
  rationale: L’impératif féminin singulier de שמח appelle directement Sion à la joie et conserve le parallélisme verbal de l’hébreu.
- source_word: בַּת צִיּוֹן
  choice: fille de Sion
  rationale: Cette tournure poétique personnifie Sion, c’est-à-dire Jérusalem. « Fille de Sion » est la formulation française naturelle et consacrée, sans effacer l’image hébraïque.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appel à la joie. « Car » convient au registre prophétique tout en restant clair.
- source_word: הִנְנִי בָא
  choice: 'me voici : je viens'
  rationale: הִנְנִי attire solennellement l’attention sur le locuteur, tandis que le participe בָא présente sa venue comme vive ou imminente. Les deux éléments sont conservés sans les fusionner.
- source_word: וְשָׁכַנְתִּי
  choice: et j’habiterai
  rationale: Le verbe שכן évoque une présence établie. « Habiter » est naturel en français et préserve le thème de la présence divine sans ajouter d’interprétation doctrinale.
- source_word: בְתוֹכֵךְ
  choice: au milieu de toi
  rationale: Le suffixe féminin singulier renvoie à Sion personnifiée. Cette traduction garde cette adresse au singulier ainsi que la dimension spatiale et communautaire de l’expression.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: נְאֻם introduit une formule prophétique solennelle. « Déclare » en rend la portée, et « Yahvé » représente directement le nom divin יהוה dans un français international courant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » conserve dans le texte principal le caractère de nom propre, tandis que la note signale le rendu traditionnel français.
- issue: Langage de la présence divine en Sion
  choice: j’habiterai au milieu de toi
  alternative: je demeurerai en ton sein / je vivrai parmi les tiens
  rationale: La traduction maintient à la fois l’image d’une présence durable et l’adresse féminine singulière à Sion, sans identifier davantage cette venue ni résoudre sa portée théologique.
translation_notes:
  register: Français moderne, international et digne, avec une formulation prophétique claire. Le tutoiement singulier respecte la personnification féminine de Sion. La ponctuation après « me voici » distingue l’interjection de la venue annoncée tout en conservant leur lien étroit.
