source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ אַחַ֣ר כָּב֔וֹד שְׁלָחַ֕/נִי אֶל הַ/גּוֹיִ֖ם הַ/שֹּׁלְלִ֣ים אֶתְ/כֶ֑ם כִּ֚י הַ/נֹּגֵ֣עַ בָּ/כֶ֔ם נֹגֵ֖עַ בְּ/בָבַ֥ת עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/012.yaml
  text: 'For thus says Yahweh of hosts: After glory he has sent me against the nations that plunder you[b][a], for whoever touches you touches the pupil of his eye.'
translation:
  language: fr
  text: 'Car ainsi parle Yahweh des armées : « Après la gloire[a], il m’a envoyé vers les nations qui vous dépouillent, car celui qui vous touche touche la prunelle de son œil[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « Après la gloire » est difficile. Elle peut aussi se comprendre comme « Pour la gloire » et peut exprimer le but, la succession ou un rapport avec la gloire ou l’honneur.
    reason: alternative_reading
  - marker: b
    text: Littéralement, une expression désignant la partie la plus sensible et la mieux protégée de l’œil; on peut aussi traduire par « la pupille de son œil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel sous une translittération française courante, au lieu de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend directement le titre divin et reste naturel et intelligible en français moderne.
- source_word: אַחַר כָּבוֹד
  choice: Après la gloire
  rationale: Traduction formelle d’une expression hébraïque difficile et elliptique, afin de ne pas trancher entre une relation temporelle, finale ou liée à l’honneur.
- source_word: שְׁלָחַנִי
  choice: il m’a envoyé
  rationale: Le passé composé rend naturellement en français l’accompli hébreu avec sa pertinence dans le discours présent.
- source_word: אֶל הַגּוֹיִם
  choice: vers les nations
  rationale: Respecte le sens directionnel ordinaire de אֶל sans exclure l’idée contextuelle d’une mission hostile à ces nations.
- source_word: הַשֹּׁלְלִים אֶתְכֶם
  choice: qui vous dépouillent
  rationale: Exprime en français actuel l’action de prendre le butin ou de spolier, sans employer un terme inutilement archaïque.
- source_word: הַנֹּגֵעַ בָּכֶם
  choice: celui qui vous touche
  rationale: Reproduit naturellement le participe substantivé singulier et sa portée générale.
- source_word: נֹגֵעַ
  choice: touche
  rationale: Conserve la répétition du même verbe, importante pour la force rhétorique de la phrase.
- source_word: בְּבָבַת עֵינוֹ
  choice: la prunelle de son œil
  rationale: Expression française claire qui désigne la partie sensible et précieusement protégée de l’œil, tout en conservant le singulier du texte hébreu.
theological_decisions:
- issue: Identité du locuteur désigné par « m’ » et référent de « son œil »
  choice: Les pronoms sont conservés sans identifier explicitement leurs référents.
  alternative: Identifier le locuteur comme le prophète, le messager angélique ou une figure divine envoyée par Yahweh.
  rationale: Le passage passe de la parole de Yahweh à un envoyé parlant à la première personne. L’hébreu ne résout pas explicitement cette tension, que la traduction doit préserver.
- issue: Valeur de l’expression אַחַר כָּבוֹד
  choice: Après la gloire
  alternative: Pour la gloire ; après l’honneur ; en vue de la gloire
  rationale: La syntaxe hébraïque est difficile et permet plusieurs relations possibles. Le texte principal reste proche de la forme source, tandis que la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique « Car ainsi parle » conserve la solennité du texte sans archaïsme excessif. Les ambiguïtés syntaxiques et référentielles de l’hébreu sont maintenues.
