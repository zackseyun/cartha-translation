  text: וַ/יַּרְאֵ֣/נִי יְהוָ֔ה אַרְבָּעָ֖ה חָרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/003.yaml
  text: Then Yahweh showed me four craftsmen[a].
translation:
  language: fr
  text: Puis Yahweh me montra quatre artisans[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ouvriers qualifiés »; le terme hébreu peut désigner plus précisément des travailleurs tels que des forgerons, mais aussi, plus largement, des artisans.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: Puis ... me montra
  rationale: Le hiphil wayyiqtol de ראה avec suffixe de première personne signifie littéralement « il me fit voir » et, de façon idiomatique, « il me montra ». « Puis » restitue naturellement la progression de la vision.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אַרְבָּעָה
  choice: quatre
  rationale: Traduction directe du nombre cardinal qualifiant le nom masculin pluriel qui suit.
- source_word: חָרָשִׁים
  choice: artisans
  rationale: Le terme peut désigner différents ouvriers qualifiés, travaillant notamment le bois, la pierre ou le métal. « Artisans » conserve cette portée générale sans préciser indûment leur métier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin et correspond à la translittération moderne courante.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque; « artisans » reste clair tout en préservant l'indétermination du métier.
