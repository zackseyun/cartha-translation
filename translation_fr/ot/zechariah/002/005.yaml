base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/005.yaml
  text: And I lifted up my eyes and saw[a], and behold, a man, and in his hand a measuring line.
translation:
  language: fr
  text: 'Je levai les yeux et je vis : voici un homme, un cordeau à mesurer à la main[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une corde à mesurer ». Le terme hébreu peut désigner concrètement une corde ou un cordage servant à prendre des mesures.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Je levai les yeux
  rationale: Conserve l’expression hébraïque qui introduit l’acte de regarder dans le cadre d’une vision, tout en restant naturelle en français.
- source_word: וָאֵרֶא
  choice: et je vis
  rationale: Rend directement le verbe ראה et maintient la succession narrative marquée par la conjonction.
- source_word: וְהִנֵּה
  choice: il y avait là
  rationale: Restitue dans un français naturel la fonction présentative de הִנֵּה, qui attire l’attention sur l’apparition soudaine de la figure dans la vision.
- source_word: אִישׁ
  choice: un homme
  rationale: Respecte le sens masculin singulier du nom hébreu sans le neutraliser.
- source_word: וּבְיָדוֹ
  choice: avec à la main
  rationale: Préserve le détail visuel de l’objet placé dans la main de l’homme, avec une tournure française fluide.
- source_word: חֶבֶל מִדָּה
  choice: un cordeau à mesurer
  rationale: Désigne clairement une corde ou un cordeau servant à prendre des mesures; «cordeau» convient particulièrement à cet instrument tout en restant proche de l’image hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve l’enchaînement visuel du récit et l’image concrète de l’instrument de mesure, sans reproduire une syntaxe hébraïque qui serait maladroite en français.
