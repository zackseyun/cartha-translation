  rationale: La révision remplace la périphrase temporelle « ceux qui les servaient » par « leurs propres serviteurs ». Elle évite ainsi un ajout non exprimé par l’hébreu tout en préservant la force du renversement et la lisibilité française. Les ancres de notes et leur contenu restent cohérents avec le texte révisé.
