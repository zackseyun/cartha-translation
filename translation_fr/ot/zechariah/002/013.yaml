  verdict: revise
  source_fidelity: 'Le texte rend fidèlement la progression du verset : annonce solennelle, geste hostile, renversement social, puis reconnaissance de l’envoi par Yahvé des armées. « Brandir ma main contre eux » est une traduction naturelle et contextuellement juste de מֵנִיף אֶת־יָדִי עֲלֵיהֶם. Toutefois, « ceux qui les servaient » introduit un imparfait rétrospectif (« servaient ») qui n’est pas exprimé en hébreu et transforme inutilement le groupe nominal « leurs serviteurs ».'
  naturalness: Le français est moderne, clair et d’un registre prophétique sobre. « Le butin de leurs propres serviteurs » est idiomatique et rend explicitement, sans ajout temporel, le renversement implicite dans l’hébreu.
  terminology: « Yahvé des armées », « butin » et « serviteurs » conviennent. La note conserve à juste titre l’alternative « esclaves » sans imposer ce choix dans le texte principal. L’identité du locuteur demeure correctement non résolue.
