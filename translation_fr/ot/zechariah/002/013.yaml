    rationale: לְעַבְדֵיהֶם signifie littéralement « à/pour/de leurs serviteurs » selon la construction française retenue. Le verbe français à l’imparfait suggère que ce service appartenait au passé, nuance absente du texte source. « Leurs propres serviteurs » conserve plus directement le possessif et le renversement.
