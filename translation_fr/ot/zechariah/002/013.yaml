source:
  edition: WLC
  text: כִּ֠י הִנְ/נִ֨י מֵנִ֤יף אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/הָי֥וּ שָׁלָ֖ל לְ/עַבְדֵי/הֶ֑ם וִֽ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחָֽ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/013.yaml
  text: For behold[a], I am about to wave my hand over them, and they will become plunder for their own servants[c][b]. Then you will know that Yahweh of Armies has sent me.
translation:
  language: fr
  text: 'Car voici : je vais brandir ma main contre eux, et ils deviendront le butin de leurs propres serviteurs[a]. Alors vous saurez que Yahvé des armées m’a envoyé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de leurs serviteurs ». Le mot hébreu peut aussi désigner des esclaves; l’expression souligne un renversement de domination.'
    reason: lexical_alternative
  - marker: b
    text: Le locuteur dit que Yahvé des armées l’a envoyé sans s’identifier explicitement; le contexte laisse son identité ouverte.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici le fondement de l’exhortation précédente et conserve clairement le lien logique.
- source_word: הִנְנִי
  choice: 'voici : je vais'
  rationale: « Voici » attire l’attention, tandis que « je vais » exprime naturellement en français l’imminence de l’action prophétique.
- source_word: מֵנִיף אֶת־יָדִי עֲלֵיהֶם
  choice: brandir ma main contre eux
  rationale: « Brandir » préserve le geste énergique de הניף; « contre eux » rend explicite l’orientation hostile indiquée par le contexte sans réduire l’image à une simple action abstraite.
- source_word: וְהָיוּ
  choice: et ils deviendront
  rationale: Le verbe décrit l’entrée dans un nouvel état; « deviendront » exprime bien ce résultat.
- source_word: שָׁלָל
  choice: le butin
  rationale: Équivalent français courant et précis pour les biens saisis à la suite d’une défaite.
- source_word: לְעַבְדֵיהֶם
  choice: de ceux qui les servaient
  rationale: Le pronom hébreu renvoie littéralement à « leurs serviteurs/esclaves ». Cette formulation française conserve le renversement des rapports de pouvoir tout en évitant l’ambiguïté possible de « leurs serviteurs », qui pourrait suggérer que les vaincus les possèdent encore au moment du pillage.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: « Alors » rend la conséquence de l’action annoncée et le futur convient à la portée de la forme verbale.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Transcrit le nom divin et traduit צְבָאוֹת par son sens concret, dans un français digne et intelligible.
- source_word: שְׁלָחָנִי
  choice: m’a envoyé
  rationale: Le passé composé exprime une mission déjà confiée dont la validité demeure présente.
theological_decisions:
- issue: Identité du locuteur qui déclare que Yahvé des armées l’a envoyé
  choice: Maintenir la première personne sans identifier le locuteur dans le corps du texte.
  alternative: Identifier le locuteur comme le prophète, le messager angélique ou une figure divine/messianique.
  rationale: L’hébreu ne précise pas explicitement cette identité dans le verset. La traduction conserve donc la tension narrative et théologique au lieu de trancher, et une note signale l’ouverture interprétative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Car voici » conserve à la fois le lien discursif et l’appel solennel à l’attention. « Brandir ma main » maintient l’image prophétique concrète; la formulation de la proposition sur les serviteurs reste claire tout en signalant en note la littéralité et la polysémie de עבד.
