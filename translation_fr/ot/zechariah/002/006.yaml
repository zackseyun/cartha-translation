base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/006.yaml
  text: And I said[a], “Where are you going?” And he said to me, “To measure Jerusalem[b], to see how wide it is and how long it is.”
translation:
  language: fr
  text: 'Je demandai : « Où vas-tu ? » Il me répondit : « Je vais mesurer Jérusalem, pour voir quelle est sa largeur et quelle est sa longueur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָנָה
  choice: Où
  rationale: L’adverbe interrogatif porte sur la destination. En français actuel, « Où vas-tu ? » exprime naturellement ce sens directionnel.
- source_word: הֹלֵךְ
  choice: vas-tu
  rationale: Le participe de הלך, accompagné du pronom, décrit ici un déplacement en cours ou projeté. « Vas-tu » convient à une question portant sur la destination.
- source_word: לָמֹד
  choice: mesurer
  rationale: L’infinitif de מדד signifie directement « mesurer ». « Relever les dimensions » serait possible, mais moins proche de l’image concrète du texte.
- source_word: אֶת יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Le marqueur d’objet direct introduit le nom propre de la ville, rendu selon sa forme française usuelle.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: ראה signifie littéralement « voir ». La construction exprime ici le but de la mesure; « pour voir » conserve l’idiome hébreu sans l’expliciter excessivement.
- source_word: כַּמָּה רָחְבָּהּ
  choice: quelle est sa largeur
  rationale: Littéralement, la tournure demande « combien [est] sa largeur ». « Quelle est sa largeur » est idiomatique en français et garde le nom concret « largeur ».
- source_word: וְכַמָּה אָרְכָּהּ
  choice: et quelle est sa longueur
  rationale: La formulation reproduit le parallélisme de la première dimension et rend clairement le suffixe féminin renvoyant à Jérusalem.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passage au passé simple dans le cadre narratif (« Je demandai », « il me répondit ») convient au registre biblique littéraire sans archaïsme marqué. La réponse explicite « Je vais » en français ce que l’infinitif hébreu exprime elliptiquement.
