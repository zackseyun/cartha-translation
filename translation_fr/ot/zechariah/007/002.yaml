source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ בֵּֽית אֵ֔ל שַׂר אֶ֕צֶר וְ/רֶ֥גֶם מֶ֖לֶךְ וַֽ/אֲנָשָׁ֑י/ו לְ/חַלּ֖וֹת אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/002.yaml
  text: Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
translation:
  language: fr
  text: Béthel envoya Sharezer, Réguem-Mélek et ses hommes pour implorer la faveur de Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour rechercher la faveur de Yahweh ». L’expression hébraïque évoque littéralement le fait d’implorer ou d’adoucir sa face.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Béthel ». Il s’agit très probablement ici du nom de la ville, bien que ce nom signifie « maison de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol poursuit le récit et se rend naturellement par un passé simple en français écrit.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: La forme désigne très probablement ici la ville ou sa communauté; la graphie française usuelle est « Béthel ».
- source_word: שַׂר אֶצֶר
  choice: Sharezer
  rationale: Nom propre translittéré; cette forme reste proche de l’hébreu tout en étant lisible en français.
- source_word: וְרֶגֶם מֶלֶךְ
  choice: Réguem-Mélek
  rationale: Nom propre composé translittéré et muni d’un trait d’union, plutôt que compris comme un titre.
- source_word: וַאֲנָשָׁיו
  choice: et ses hommes
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au dernier personnage nommé, même si son antécédent demeure légèrement ambigu.
- source_word: לְחַלּוֹת אֶת־פְּנֵי
  choice: pour implorer la faveur de
  rationale: Cette expression rend idiomatiquement la demande pressante impliquée par la locution hébraïque, littéralement liée au fait d’adoucir ou de solliciter la face de quelqu’un.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que remplacement par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; le translittérer préserve la distinction entre ce nom et un titre.
- issue: Identification de בֵּית אֵל
  choice: Béthel, la ville ou sa communauté, comme sujet
  alternative: la maison de Dieu
  rationale: Dans ce contexte, la lecture comme toponyme est syntaxiquement et contextuellement la plus probable, sans exclure que le nom signifie étymologiquement « maison de Dieu ».
- issue: Antécédent du suffixe dans וַאֲנָשָׁיו
  choice: les hommes de Réguem-Mélek
  alternative: les hommes de Béthel ou les hommes accompagnant la délégation
  rationale: Le masculin singulier se rattache naturellement au nom masculin singulier immédiatement précédent, mais la brièveté de la construction permet une certaine ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. Les noms propres sont francisés avec des accents facilitant leur prononciation; « Yahweh » suit la politique de translittération du nom divin.
