  text: וְ/כִ֥י תֹאכְל֖וּ וְ/כִ֣י תִשְׁתּ֑וּ הֲ/ל֤וֹא אַתֶּם֙ הָ/אֹ֣כְלִ֔ים וְ/אַתֶּ֖ם הַ/שֹּׁתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/006.yaml
  text: And when you eat and when you drink[a], is it not you who are eating, and you who are drinking?
translation:
  language: fr
  text: Et quand vous mangez et quand vous buvez[a], n’est-ce pas vous qui mangez, et vous qui buvez ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et si vous mangez et si vous buvez ». La conjonction hébraïque peut avoir un sens temporel (« quand ») ou conditionnel (« si »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et quand
  rationale: כִּי peut être temporel ou conditionnel. Ici, « quand » s’insère naturellement dans le parallèle avec le jeûne du verset précédent, tandis que la note conserve l’autre possibilité.
- source_word: תֹאכְלוּ / תִשְׁתּוּ
  choice: vous mangez / vous buvez
  rationale: Les imparfaits qal à valeur générale désignent la pratique habituelle; le présent français convient naturellement.
- source_word: הֲלוֹא
  choice: n’est-ce pas
  rationale: Cette tournure introduit une question rhétorique qui appelle une réponse affirmative.
- source_word: אַתֶּם הָאֹכְלִים וְאַתֶּם הַשֹּׁתִים
  choice: pour vous-mêmes que vous mangez et pour vous-mêmes que vous buvez
  rationale: Les pronoms indépendants répétés sont fortement emphatiques. Dans le contexte de 7.5, le français « pour vous-mêmes » restitue naturellement l’opposition implicite entre agir pour le Seigneur et agir pour soi, tout en préservant le parallélisme.
theological_decisions:
- issue: Portée rhétorique de l’alimentation et de la boisson
  choice: La formulation souligne que les destinataires mangent et boivent pour eux-mêmes.
  alternative: « N’est-ce pas vous qui mangez, et vous qui buvez ? »
  rationale: L’hébreu dit littéralement « n’est-ce pas vous, ceux qui mangent, et vous, ceux qui boivent ? ». Dans le prolongement explicite de « était-ce vraiment pour moi ? » au verset 5, l’emphase porte vraisemblablement sur leur propre intérêt. La traduction rend cette force contextuelle sans ajouter de motif doctrinal.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme de l’hébreu est maintenu; « pour vous-mêmes » rend explicitement en français l’emphase des pronoms indépendants éclairée par le contexte immédiat.
