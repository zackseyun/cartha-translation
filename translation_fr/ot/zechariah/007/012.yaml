reference: Zechariah 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לִבָּ֞/ם שָׂ֣מוּ שָׁמִ֗יר מִ֠/שְּׁמוֹעַ אֶת הַ/תּוֹרָ֤ה וְ/אֶת הַ/דְּבָרִים֙ אֲשֶׁ֨ר שָׁלַ֜ח יְהוָ֤ה צְבָאוֹת֙ בְּ/רוּח֔/וֹ בְּ/יַ֖ד הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֑ים וַֽ/יְהִי֙ קֶ֣צֶף גָּד֔וֹל מֵ/אֵ֖ת יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/012.yaml
  text: They made their hearts like diamond-hard stone[a], so as not to hear the law and the words that Yahweh of Armies had sent by his Spirit through the former prophets[c][b]. So great wrath came from Yahweh of Armies.
translation:
  language: fr
  text: Ils rendirent leur cœur aussi dur qu’une pierre extrêmement dure[a], afin de ne pas écouter la loi[b] ni les paroles que Yahweh des armées[c] avait envoyées par son Esprit, par l’intermédiaire des prophètes d’autrefois. Alors, une grande colère vint de la part de Yahweh des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne une matière extrêmement dure, traditionnellement appelée « adamant » et parfois identifiée au silex.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’instruction ».'
    reason: lexical_alternative
  - marker: c
    text: 'Traduction traditionnelle : « le SEIGNEUR des armées » ou « le SEIGNEUR de l’univers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבָּם
  choice: leur cœur
  rationale: Le singulier hébreu présente collectivement la disposition intérieure du peuple. Le français naturel peut conserver ce singulier distributif après « ils ».
- source_word: שָׂמוּ שָׁמִיר
  choice: rendirent leur cœur dur comme le diamant
  rationale: שׂום avec לֵב et un attribut exprime ici le fait de rendre le cœur insensible. שָׁמִיר désigne une matière d’une dureté extrême, dont l’identification précise reste incertaine; « diamant » rend clairement l’image, avec une note.
- source_word: מִשְּׁמוֹעַ
  choice: afin de ne pas écouter
  rationale: La construction avec מִן et l’infinitif exprime l’empêchement ou l’intention de refuser d’écouter. « Écouter » inclut ici l’attention et l’obéissance, sans les expliciter davantage.
- source_word: הַתּוֹרָה
  choice: la loi
  rationale: תּוֹרָה désigne l’enseignement normatif de Dieu. « Loi » conserve sa portée d’alliance; « instruction » est signalé en note.
- source_word: הַדְּבָרִים
  choice: les paroles
  rationale: Le terme désigne les paroles ou messages divins transmis par les prophètes; « paroles » maintient le parallélisme avec la loi.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est rendu comme nom propre, et צְבָאוֹת est traduit de façon transparente plutôt que par l’archaïque « armées célestes » ou « légions ». La formulation traditionnelle est indiquée en note.
- source_word: בְּרוּחוֹ
  choice: par son Esprit
  rationale: Dans ce contexte, le souffle ou Esprit de Dieu est le moyen par lequel ses paroles sont envoyées. La majuscule indique le référent divin sans développer une formulation doctrinale absente du verset.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: par l’intermédiaire des prophètes d’autrefois
  rationale: L’expression idiomatique « par la main de » marque la médiation. הָרִאשֹׁנִים renvoie aux prophètes antérieurs dans l’histoire, sans nécessairement désigner une division canonique technique.
- source_word: וַיְהִי קֶצֶף גָּדוֹל
  choice: Alors, une grande colère vint
  rationale: La formulation garde le caractère événementiel de וַיְהִי et laisse la conjonction exprimer une conséquence contextuelle sans renforcer celle-ci par « c’est pourquoi ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahweh » le rend comme le nom d’alliance plutôt que de le remplacer par un titre; la tradition française emploie aussi « Yahvé ».
- issue: Référent de רוּחוֹ
  choice: son Esprit
  alternative: son esprit; son souffle
  rationale: Le contexte présente l’Esprit de Dieu comme l’agent par lequel Dieu communique ses paroles aux prophètes. La traduction conserve cette agence tout en reconnaissant l’amplitude lexicale de רוּחַ.
- issue: Force causale de וַיְהִי
  choice: Alors
  alternative: Et; C’est pourquoi
  rationale: La colère suit le refus d’écouter et fonctionne comme sa conséquence, mais la simple conjonction hébraïque ne justifie pas d’imposer un connecteur causal plus fort.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore de l’endurcissement, la médiation prophétique et le mouvement narratif du texte hébreu, tout en évitant le terme technique « premiers prophètes », qui pourrait être pris pour le nom d’une division canonique.
