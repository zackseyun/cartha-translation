  text: וְ/אֵ֣סָעֲרֵ֗/ם עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/הָ/אָ֨רֶץ֙ נָשַׁ֣מָּה אַֽחֲרֵי/הֶ֔ם מֵֽ/עֹבֵ֖ר וּ/מִ/שָּׁ֑ב וַ/יָּשִׂ֥ימוּ אֶֽרֶץ חֶמְדָּ֖ה לְ/שַׁמָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/014.yaml
  text: And I scattered them with a storm wind among all the nations that they had not known[a], and the land was left desolate behind them, with no one passing through or returning[b]; thus they made the pleasant land a desolation.
translation:
  language: fr
  text: Je les ai dispersés comme par une tempête[a] parmi toutes les nations qu’ils ne connaissaient pas. Derrière eux, le pays est resté dévasté, sans que personne y passe ni y revienne. Ainsi, ils ont fait du pays de délices[b] un lieu dévasté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je les ai emportés dans un tourbillon parmi toutes les nations ». Le verbe hébreu évoque une tempête, et non une simple dispersion.
    reason: lexical_alternative
  - marker: b
    text: Ou « du pays désirable » ou « du pays délicieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵסָעֲרֵם
  choice: Je les ai dispersés comme par une tempête
  rationale: Le piel de סער évoque une dispersion violente, comparable à l’action d’une tempête. Cette formulation conserve l’image météorologique sans donner à entendre que le vent est explicitement mentionné dans l’hébreu.
- source_word: עַל כָּל הַגּוֹיִם
  choice: parmi toutes les nations
  rationale: Avec un verbe de dispersion, עַל exprime ici la répartition des exilés au milieu des nations plutôt qu’un mouvement hostile contre elles.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: qu’ils ne connaissaient pas
  rationale: La relative qualifie les nations comme étrangères et inconnues des personnes dispersées.
- source_word: וְהָאָרֶץ נָשַׁמָּה
  choice: le pays est resté dévasté
  rationale: נשׁם décrit l’état de désolation résultant du départ des habitants. « Est resté dévasté » exprime naturellement ce résultat en français.
- source_word: אַחֲרֵיהֶם
  choice: Derrière eux
  rationale: L’expression présente le pays laissé dans leur sillage après leur dispersion.
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: sans personne pour le traverser ni en revenir
  rationale: Les deux participes désignent l’absence de circulation dans un sens comme dans l’autre. L’ajout de « personne » rend explicite en français la valeur privative de la construction.
- source_word: וַיָּשִׂימוּ
  choice: Ainsi, ils ont fait
  rationale: Le waw narratif introduit ici le résultat des actes précédemment dénoncés et maintient la responsabilité du peuple.
- source_word: אֶרֶץ חֶמְדָּה
  choice: le pays de délices
  rationale: חמדה désigne ce qui est désirable, précieux ou source de plaisir. « Pays de délices » conserve la force positive et le relief poétique de l’expression, avec une note signalant des équivalents plus courants.
- source_word: לְשַׁמָּה
  choice: un lieu dévasté
  rationale: Le substantif שׁמה désigne un état ou un lieu de désolation. Cette tournure française garde le contraste nominal avec « pays de délices » sans raideur excessive.
theological_decisions:
- issue: Responsabilité dans le jugement et l’exil
  choice: Dieu demeure le sujet explicite de la dispersion, tandis que le peuple est le sujet de la transformation du pays en lieu dévasté.
  alternative: Employer une tournure impersonnelle pour la dispersion ou attribuer toute la dévastation directement à Dieu.
  rationale: La première personne de וְאֵסָעֲרֵם attribue clairement la dispersion à Dieu, alors que le pluriel וַיָּשִׂימוּ attribue aux membres du peuple la responsabilité exprimée dans la dernière proposition. La traduction maintient cette double affirmation sans atténuer l’une ou l’autre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient au récit rétrospectif, tandis que « comme par une tempête » conserve l’image hébraïque sans ajouter explicitement un vent absent du texte. Les marqueurs [a] et [b] figurent au point précis auquel se rapportent les notes.
