  text: And the word of Yahweh came to Zechariah[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé fut adressée à Zacharie :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה אל, cette tournure française rend naturellement la venue de la parole à son destinataire, sans conserver le littéralisme maladroit « et il arriva ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans l’expression prophétique דְּבַר יְהוָה, « la parole » est la formulation française traditionnelle et formellement proche de l’hébreu; elle désigne ici la communication divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un remplacement par le titre « le Seigneur ».
- source_word: אֶל
  choice: à
  rationale: La préposition indique le destinataire auquel la parole divine est adressée.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française conventionnelle du nom propre hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Puisque le discours direct commence au verset suivant, les deux-points rendent idiomatiquement la fonction introductive de לֵאמֹר sans le calque pesant « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. Sa forme française « Yahvé » préserve le caractère personnel du nom plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la tournure prophétique récurrente tout en évitant un calque hébraïque; les deux-points ouvrent naturellement la déclaration du verset suivant.
