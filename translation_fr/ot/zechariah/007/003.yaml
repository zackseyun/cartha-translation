base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/003.yaml
  text: to say to the priests of the house of Yahweh of Armies[a], and to the prophets, saying, “Should I weep in the fifth month[b], abstaining as I have done for these many years?”
translation:
  language: fr
  text: 'pour dire aux prêtres de la maison de Yahweh des armées[a] et aux prophètes : « Dois-je pleurer au cinquième mois et m’abstenir[b], comme je le fais depuis tant d’années ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « l’Éternel des armées ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « me tenir à l’écart » ; le terme hébreu peut désigner une abstinence rituelle plus large que le seul jeûne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: pour dire
  rationale: L’infinitif introduit le but ou le contenu de la démarche commencée au verset précédent. « Pour dire » conserve ce lien syntaxique, tandis que les deux occurrences hébraïques sont rendues naturellement en français par une seule introduction suivie des deux-points.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Rendu direct du titre cultuel, sans paraphrase interprétative.
- source_word: אֲשֶׁר לְבֵית יְהוָה צְבָאוֹת
  choice: les prêtres de la maison de Yahweh des armées
  rationale: Cette formulation rattache les prêtres au temple de Yahweh sans réduire la relation à une simple localisation momentanée.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est rendu par « Yahweh », et צְבָאוֹת par « armées », ce qui conserve la force concrète du titre tout en restant compréhensible en français moderne.
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: Rendu usuel et précis des personnes exerçant la fonction prophétique.
- source_word: הַאֶבְכֶּה
  choice: Dois-je pleurer
  rationale: La forme verbale à la première personne exprime ici une question délibérative portant sur la poursuite du deuil rituel.
- source_word: בַּחֹדֶשׁ הַחֲמִשִׁי
  choice: au cinquième mois
  rationale: Le texte donne un numéro de mois et non son nom ; le rendu direct évite d’ajouter une identification absente de l’hébreu.
- source_word: הִנָּזֵר
  choice: m’abstenir
  rationale: Le verbe désigne le fait de se séparer ou de s’imposer une abstinence rituelle. « M’abstenir » préserve une portée plus large que le seul jeûne.
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: comme je le fais
  rationale: Le présent français, associé à « depuis », exprime naturellement une pratique commencée dans le passé et encore suivie au moment de la question.
- source_word: זֶה כַּמֶּה שָׁנִים
  choice: depuis tant d’années
  rationale: Cette tournure idiomatique française rend la durée prolongée et la continuité impliquées par l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de הִנָּזֵר dans le deuil rituel
  choice: m’abstenir
  alternative: jeûner / me tenir à l’écart
  rationale: Le contexte peut inclure le jeûne, mais le verbe hébreu a une portée plus large de séparation ou d’abstinence. Le texte principal ne réduit donc pas son sens au seul jeûne.
translation_notes:
  register: Français international moderne, digne et accessible. La question est formulée simplement, sans expliciter davantage la nature du rite. Les deux occurrences de לֵאמֹר sont allégées pour éviter la répétition peu naturelle « pour dire… en disant » tout en conservant la fonction introductive de la construction hébraïque.
