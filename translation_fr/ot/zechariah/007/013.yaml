review_pass:
  verdict: revise
  source_fidelity: La comparaison rétributive est bien rendue, ainsi que le parallélisme entre « appeler » et « écouter ». Toutefois, « sans que » présente l'absence d'écoute comme une circonstance plutôt que comme la négation explicite et coordonnée du texte hébreu (וְלֹא). Une formulation affirmative avec négation directe reflète plus exactement le contraste.
  naturalness: La phrase est fluide, mais « sans qu’ils écoutent ... sans que j’écoute » est légèrement moins idiomatique et moins direct dans une déclaration de jugement. La répétition de « et ... n’ont/n’écouterai pas » est naturelle et conserve la symétrie vigoureuse du verset.
  terminology: « Yahweh des armées » rend fidèlement יהוה צבאות en français moderne. La note d’alternative traditionnelle doit employer la graphie conventionnelle « le SEIGNEUR des armées », où les petites capitales signalent la substitution traditionnelle du Tétragramme.
  issues:
  - severity: medium
    issue: Les deux négations sont rendues par « sans que ».
    rationale: וְלֹא שָׁמֵעוּ et וְלֹא אֶשְׁמָע sont des propositions coordonnées négatives explicites. « Et ils n’ont pas écouté ... et je n’écouterai pas » respecte plus directement la syntaxe et le parallélisme du texte source.
  - severity: low
    issue: Graphie de l’alternative traditionnelle dans la note.
    rationale: « le SEIGNEUR des armées » est la convention française habituelle pour indiquer que « SEIGNEUR » représente le nom divin יהוה, plutôt qu’un simple titre.
  revised_text: Et de même qu’il a appelé et qu’ils n’ont pas écouté, de même ils appelleront et je n’écouterai pas, dit Yahweh des armées[a].
  revised_footnotes:
  - marker: a
    text: 'Traditionnellement : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
  revision_rationale: La révision maintient la structure comparative et la répétition lexicale du texte hébreu, tout en exprimant explicitement les deux négations et en normalisant la note relative au rendu traditionnel du nom divin.
