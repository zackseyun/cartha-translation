source:
  edition: WLC
  text: וַ/יְהִ֥י כַ/אֲשֶׁר קָרָ֖א וְ/לֹ֣א שָׁמֵ֑עוּ כֵּ֤ן יִקְרְאוּ֙ וְ/לֹ֣א אֶשְׁמָ֔ע אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/013.yaml
  text: And just as he called and they would not listen[a], so they will call and I will not listen, says Yahweh of Armies.
translation:
  language: fr
  text: Et de même qu’il a appelé et qu’ils n’ont pas écouté, de même ils appelleront et je n’écouterai pas, dit Yahweh des armées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר ... כֵּן
  choice: Et de même que… de même
  rationale: Cette tournure française restitue clairement la construction comparative et la correspondance entre le refus du peuple et la réponse divine.
- source_word: קָרָא / יִקְרְאוּ
  choice: a appelé / appelleront
  rationale: La répétition du même verbe préserve le parallélisme rhétorique de l’hébreu.
- source_word: וְלֹא שָׁמֵעוּ / וְלֹא אֶשְׁמָע
  choice: sans qu’ils écoutent / sans que j’écoute
  rationale: « Écouter » exprime ici l’attention accordée et la réponse à un appel, plutôt que la simple perception auditive. La formulation parallèle souligne la réciprocité du jugement.
- source_word: אָמַר
  choice: dit
  rationale: Le présent français convient à la formule prophétique qui introduit une déclaration divine faisant autorité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel au lieu de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette traduction actuelle communique le sens du titre hébreu plus clairement que le traditionnel « des armées célestes » ou l’archaïque « des armées/hosts » selon les langues, sans préciser indûment la nature de ces armées.
theological_decisions:
- issue: Traduction du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le Seigneur des armées
  rationale: Le texte porte explicitement le nom divin יהוה. « Yahweh » le conserve, tandis que « des armées » traduit צבאות sans imposer une identification plus précise de celles-ci.
translation_notes:
  register: Français moderne, clair et digne. Le double « de même » conserve la structure comparative, tandis que la répétition d’« appeler » et d’« écouter » maintient la force du parallélisme hébreu.
