source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר מִשְׁפַּ֤ט אֱמֶת֙ שְׁפֹ֔טוּ וְ/חֶ֣סֶד וְ/רַֽחֲמִ֔ים עֲשׂ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/009.yaml
  text: 'Thus says Yahweh of hosts[a], saying: Render true judgments, and show steadfast love and compassion[b], each man to his brother.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « Rendez des jugements conformes à la vérité[a], et que chacun fasse preuve de bonté fidèle et de compassion envers son frère[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Jugez un jugement de vérité. » L’expression hébraïque demande des décisions judiciaires caractérisées par la vérité et l’intégrité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un homme envers son frère ». Cette expression masculine distributive décrit la conduite mutuelle au sein de la communauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle et digne en français, qui exprime l’autorité actuelle de la parole divine.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par son sens courant d’armées, sans déterminer s’il s’agit ici des armées célestes ou terrestres.
- source_word: לֵאמֹר
  choice: deux-points et guillemets
  rationale: L’infinitif introduit le contenu de la déclaration; la ponctuation française le rend naturellement sans l’expression pesante « en disant ».
- source_word: מִשְׁפַּט אֱמֶת שְׁפֹטוּ
  choice: Rendez des jugements conformes à la vérité
  rationale: Préserve le champ judiciaire de מִשְׁפָּט, la qualification par אֱמֶת et la force de l’impératif pluriel, dans une formulation française intelligible.
- source_word: חֶסֶד
  choice: bonté fidèle
  rationale: Réunit les dimensions de bonté relationnelle et de fidélité durable portées par חֶסֶד, sans imposer exclusivement une lecture technique d’alliance.
- source_word: רַחֲמִים
  choice: compassion
  rationale: Rend naturellement le pluriel abstrait hébreu qui évoque une profonde miséricorde.
- source_word: עֲשׂוּ אִישׁ אֶת אָחִיו
  choice: agissez chacun envers son frère avec
  rationale: Le verbe עשה gouverne les qualités précédentes; cette restructuration est idiomatique en français et conserve la formulation distributive ainsi que le terme de parenté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Portée de אִישׁ ... אָחִיו
  choice: chacun envers son frère
  alternative: les uns envers les autres
  rationale: La traduction conserve l’image de fraternité et la construction distributive du texte; la note indique que le masculin fonctionne ici de manière représentative dans la communauté.
- issue: Nature de חֶסֶד
  choice: bonté fidèle
  alternative: amour inébranlable
  rationale: « Bonté fidèle » maintient conjointement la bienveillance et la constance relationnelle du terme sans résoudre la question de savoir si le contexte exige un sens strictement lié à l’alliance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formule prophétique garde sa solennité; la syntaxe est légèrement restructurée pour éviter un calque maladroit tout en conservant les termes judiciaires et relationnels du texte hébreu.
