  source_fidelity: 'Le sens du texte hébreu est bien rendu : formule prophétique, titre divin, impératif judiciaire, puis exhortation à pratiquer le ḥésed et la compassion dans une relation fraternelle distributive. « Des jugements conformes à la vérité » exprime correctement מִשְׁפַּט אֱמֶת, sans réduire l’expression à une simple sincérité subjective.'
