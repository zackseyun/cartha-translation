id: ZEC.7.4
reference: Zechariah 7:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/004.yaml
  text: Then the word of Yahweh of hosts came to me[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh des armées me fut adressée[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la parole de Yahweh des armées vint à moi, disant » ou « pour dire ».'
    reason: La traduction idiomatique intègre le destinataire dans « me fut adressée » et rend לֵאמֹר par la ponctuation.
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors … fut adressée
  rationale: Dans cette formule prophétique, le wayyiqtol de היה marque la progression du récit. La tournure française « la parole … fut adressée » exprime naturellement la venue de la communication divine.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans les formules prophétiques, דְּבַר désigne une communication divine. « La parole » conserve l’expression biblique établie sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Le pluriel צְבָאוֹת évoque des armées ou troupes. « Des armées » est intelligible en français moderne et conserve l’imagerie du titre divin.
- source_word: אֵלַי
  choice: me fut adressée
  rationale: Le pronom de première personne est intégré à une tournure française idiomatique qui indique clairement que le prophète reçoit la parole.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles qui suivent. En français, les deux-points remplissent cette fonction plus naturellement que le calque « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. « Yahweh » en préserve le caractère de nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
- issue: Sens du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh de l’univers
  rationale: « Des armées » reste proche du sens lexical et préserve l’imagerie potentiellement céleste ou terrestre sans la résoudre. « De l’univers » est plus interprétatif.
translation_notes:
  register: Français moderne, courant et digne. La formule prophétique est rendue idiomatiquement, tout en conservant « la parole » et le nom divin « Yahweh ». Le titre « des armées » maintient l’ambiguïté du référent des armées.
