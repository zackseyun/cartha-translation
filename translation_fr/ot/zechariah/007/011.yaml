  text: וַ/יְמָאֲנ֣וּ לְ/הַקְשִׁ֔יב וַ/יִּתְּנ֥וּ כָתֵ֖ף סֹרָ֑רֶת וְ/אָזְנֵי/הֶ֖ם הִכְבִּ֥ידוּ מִ/שְּׁמֽוֹעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/011.yaml
  text: But they refused to pay attention[a], turned a stubborn shoulder[b], and made their ears heavy so as not to hear.
translation:
  language: fr
  text: Mais ils refusèrent de prêter attention, opposèrent une épaule rebelle[a] et appesantirent leurs oreilles pour ne pas entendre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnèrent une épaule rebelle », expression qui évoque une résistance obstinée.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « appesantirent leurs oreilles » ; autrement : « rendirent leurs oreilles insensibles » ou « se bouchèrent les oreilles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לְהַקְשִׁיב
  choice: ils refusèrent de prêter attention
  rationale: Le verbe מאן exprime un refus volontaire, tandis que קשב au hiphil désigne une écoute attentive. Cette formulation naturelle conserve les deux nuances.
- source_word: וַיִּתְּנוּ כָתֵף סֹרָרֶת
  choice: présentèrent une épaule rebelle
  rationale: La traduction garde l’image corporelle hébraïque d’une résistance obstinée. « Rebelle » rend la portée morale de סֹרָרֶת sans réduire l’expression à une simple posture physique.
- source_word: וְאָזְנֵיהֶם הִכְבִּידוּ
  choice: rendirent leurs oreilles pesantes
  rationale: Cette formulation préserve la métaphore hébraïque de la lourdeur volontaire des oreilles, plutôt que de la remplacer entièrement par « se bouchèrent les oreilles ».
- source_word: מִשְּׁמוֹעַ
  choice: pour ne pas entendre
  rationale: 'L’infinitif précédé de מִן exprime ici l’empêchement ou le but recherché : ils se rendent volontairement incapables d’entendre.'
theological_decisions:
- issue: Images corporelles de la rébellion et de la surdité volontaire
  choice: Conserver les images de l’épaule rebelle et des oreilles rendues pesantes.
  alternative: Ils résistèrent obstinément et refusèrent d’écouter.
  rationale: Les images concrètes soulignent le caractère délibéré de la rébellion. Les préserver maintient la force rhétorique du texte sans transformer celui-ci en paraphrase abstraite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au registre narratif biblique. Les métaphores corporelles de l’hébreu sont conservées, avec des notes pour en éclairer le caractère idiomatique.
