  text: וְ/אַלְמָנָ֧ה וְ/יָת֛וֹם גֵּ֥ר וְ/עָנִ֖י אַֽל תַּעֲשֹׁ֑קוּ וְ/רָעַת֙ אִ֣ישׁ אָחִ֔י/ו אַֽל תַּחְשְׁב֖וּ בִּ/לְבַבְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/010.yaml
  text: Do not oppress the widow[a], the fatherless, the sojourner, or the poor[c][b], and do not devise evil in your hearts against one another.
translation:
  language: fr
  text: N’opprimez pas la veuve, l’orphelin[a], l’étranger résident[b] ni le pauvre. Ne nourrissez pas dans vos cœurs de mauvais desseins les uns contre les autres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner plus précisément un enfant privé de père.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’un étranger établi parmi les Israélites et bénéficiant d’un statut protégé.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « chacun le mal de son frère », c’est-à-dire le mal conçu contre son frère ; ou « un homme contre son frère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: veuve
  rationale: Équivalent français précis et usuel dans cette liste de personnes vulnérables.
- source_word: יָתוֹם
  choice: orphelin
  rationale: Terme français naturel pour l’enfant privé de soutien parental; une note précise la nuance sociale du terme hébreu.
- source_word: גֵּר
  choice: étranger résident
  rationale: Rend le statut d’un non-Israélite établi au sein de la communauté, plutôt que celui d’un simple voyageur.
- source_word: עָנִי
  choice: pauvre
  rationale: Dans cette énumération sociale, le sens économique et la vulnérabilité qui en découle sont au premier plan.
- source_word: תַּעֲשֹׁקוּ
  choice: opprimez
  rationale: Exprime largement l’abus économique, social ou judiciaire exercé contre les personnes vulnérables.
- source_word: רָעַת
  choice: faire du mal
  rationale: Formulation française naturelle qui conserve la portée morale de רָעָה dans le contexte d’un projet dirigé contre autrui.
- source_word: תַּחְשְׁבוּ
  choice: projetez
  rationale: Le contexte indique une intention délibérée et non une simple pensée.
- source_word: אִישׁ אָחִיו
  choice: les uns aux autres
  rationale: Restitue naturellement la valeur distributive et réciproque de l’expression hébraïque; sa forme plus littérale est signalée en note.
- source_word: בִּלְבַבְכֶם
  choice: dans vos cœurs
  rationale: Conserve l’image hébraïque du cœur comme siège des intentions ainsi que l’adresse au pluriel.
theological_decisions:
- issue: Portée de l’expression masculine distributive אִישׁ אָחִיו
  choice: les uns aux autres
  alternative: chacun contre son frère
  rationale: L’expression vise les rapports réciproques au sein de la communauté et ne limite pas nécessairement l’interdiction aux hommes. La traduction courante en donne le sens, tandis que la note conserve la forme littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La première phrase conserve la série emphatique des quatre groupes vulnérables; la seconde privilégie une formulation idiomatique sans effacer l’image des cœurs ni la réciprocité de l’hébreu.
