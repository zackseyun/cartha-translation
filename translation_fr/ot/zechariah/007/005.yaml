source:
  edition: WLC
  text: אֱמֹר֙ אֶל כָּל עַ֣ם הָ/אָ֔רֶץ וְ/אֶל הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר כִּֽי צַמְתֶּ֨ם וְ/סָפ֜וֹד בַּ/חֲמִישִׁ֣י וּ/בַ/שְּׁבִיעִ֗י וְ/זֶה֙ שִׁבְעִ֣ים שָׁנָ֔ה הֲ/צ֥וֹם צַמְתֻּ֖/נִי אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/005.yaml
  text: 'Speak to all the people of the land and to the priests[a], saying: When you fasted and mourned in the fifth month and in the seventh, for these seventy years, was it really for me that you fasted?'
translation:
  language: fr
  text: '« Dis à tout le peuple du pays et aux prêtres : Quand vous avez jeûné et pris le deuil au cinquième et au septième mois, et cela pendant soixante-dix ans, est-ce bien pour moi que vous avez jeûné — pour moi ?[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu insiste fortement : « Est-ce pour moi — vraiment pour moi — que vous avez jeûné ? »'
    reason: L’infinitif absolu associé au verbe conjugué, puis le pronom indépendant final, renforcent la question et mettent particulièrement en relief « pour moi ».
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: L’expression désigne ici largement les habitants du pays. « Tout » rend כָּל, et « peuple du pays » conserve l’expression hébraïque sans la réduire à une classe sociale.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis de כֹּהֵן au pluriel.
- source_word: צַמְתֶּם
  choice: vous avez jeûné
  rationale: Rend directement le verbe צום au qal accompli, qui évoque la pratique passée du jeûne.
- source_word: וְסָפוֹד
  choice: et pris le deuil
  rationale: ספד exprime les manifestations de deuil ou la lamentation. « Prendre le deuil » convient au contexte rituel et évite de préciser indûment la forme des lamentations.
- source_word: בַּחֲמִישִׁי וּבַשְּׁבִיעִי
  choice: au cinquième et au septième mois
  rationale: Le mot « mois », sous-entendu en hébreu avec les ordinaux, est explicité une seule fois en français pour une formulation naturelle et claire.
- source_word: וְזֶה שִׁבְעִים שָׁנָה
  choice: et cela pendant soixante-dix ans
  rationale: Cette formulation rend la durée qui s’étend jusqu’à la situation présente ainsi que la valeur démonstrative de זֶה.
- source_word: הֲצוֹם צַמְתֻּנִי אָֽנִי
  choice: est-ce bien pour moi que vous avez jeûné — pour moi ?
  rationale: « Bien » et la reprise finale de « pour moi » rendent ensemble l’insistance de l’infinitif absolu et du pronom indépendant אָֽנִי, tout en conservant la question rhétorique.
- source_word: אֱמֹר ... לֵאמֹר
  choice: 'Dis ... :'
  rationale: En français moderne, les deux formes de אמר sont naturellement représentées par un verbe introducteur suivi de deux-points, plutôt que par le calque lourd « Dis… en disant ».
theological_decisions:
- issue: Portée de la question rhétorique sur le jeûne
  choice: La formulation met en cause l’orientation réelle du jeûne vers Dieu, sans nier que le peuple ait effectivement jeûné.
  alternative: Comprendre la question comme une déclaration selon laquelle ces jeûnes étaient entièrement invalides.
  rationale: L’hébreu insiste sur « pour moi » dans une question rhétorique. La traduction conserve cette mise en cause sans ajouter un verdict doctrinal qui dépasse le verset.
translation_notes:
  register: Français international moderne, clair et digne. « Prendre le deuil » garde la dimension rituelle de ספד; le tiret avant la reprise finale restitue l’accent hébreu sans rendre la phrase artificielle.
