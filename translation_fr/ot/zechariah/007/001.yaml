source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/דָרְיָ֖וֶשׁ הַ/מֶּ֑לֶךְ הָיָ֨ה דְבַר יְהוָ֜ה אֶל זְכַרְיָ֗ה בְּ/אַרְבָּעָ֛ה לַ/חֹ֥דֶשׁ הַ/תְּשִׁעִ֖י בְּ/כִסְלֵֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/001.yaml
  text: And in the fourth year of King Darius[a], the word of Yahweh came to Zechariah on the fourth day of the ninth month, in Kislev.
translation:
  language: fr
  text: La quatrième année du roi Darius, la parole de Yahweh fut adressée à Zacharie le quatrième jour du neuvième mois, au mois de Kislev[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kislev est le nom du neuvième mois du calendrier hébreu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: La quatrième année…
  rationale: La formule narrative introduit ici le cadre temporel. En français moderne, elle peut être intégrée directement à la proposition sans recourir à l’archaïsme « il arriva que ».
- source_word: בִּשְׁנַת אַרְבַּע לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: La quatrième année du roi Darius
  rationale: Cette tournure française naturelle conserve la formule de datation selon l’année de règne.
- source_word: הָיָה דְבַר יְהוָה אֶל זְכַרְיָה
  choice: la parole de Yahweh fut adressée à Zacharie
  rationale: Cette formulation rend la valeur événementielle de היה et la formule prophétique, tout en restant naturelle et digne en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בְּאַרְבָּעָה לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: le quatrième jour du neuvième mois
  rationale: Le mot « jour », implicite dans la formule calendaire hébraïque, est explicité pour la clarté.
- source_word: בְּכִסְלֵו
  choice: au mois de Kislev[a]
  rationale: Le nom du mois est translittéré sous sa forme française courante; « au mois de » clarifie son rapport avec « neuvième mois ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme; la translittération préserve le nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe évite l’archaïsme « il arriva que » tout en conservant la solennité de la formule prophétique et la précision de la datation.
