  text: הֲ/ל֣וֹא אֶת הַ/דְּבָרִ֗ים אֲשֶׁ֨ר קָרָ֤א יְהוָה֙ בְּ/יַד֙ הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֔ים בִּ/הְי֤וֹת יְרוּשָׁלִַ֨ם֙ יֹשֶׁ֣בֶת וּ/שְׁלֵוָ֔ה וְ/עָרֶ֖י/הָ סְבִיבֹתֶ֑י/הָ וְ/הַ/נֶּ֥גֶב וְ/הַ/שְּׁפֵלָ֖ה יֹשֵֽׁב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/007.yaml
  text: Are these not the words that Yahweh proclaimed by the former prophets[a], when Jerusalem was inhabited and at ease, with her surrounding cities[c][b], and the Negev and the Shephelah were inhabited?
translation:
  language: fr
  text: Ne sont-ce pas là les paroles que Yahweh a proclamées par l’intermédiaire des prophètes d’autrefois[a], lorsque Jérusalem et les villes qui l’entouraient étaient habitées et tranquilles[b], et que le Néguev et la Shéphéla[c] étaient habités ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main des prophètes d’autrefois » ; cette expression hébraïque indique qu’ils servaient d’intermédiaires.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en sécurité ». Le terme hébreu peut évoquer à la fois la tranquillité, la sécurité et une prospérité sans trouble.'
    reason: lexical_alternative
  - marker: c
    text: La Shéphéla est la région des basses terres et des contreforts située à l’ouest de Juda.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלוֹא אֶת הַדְּבָרִים
  choice: Ne sont-ce pas là les paroles
  rationale: La tournure rend la question rhétorique qui appelle une réponse affirmative. « Là » restitue naturellement en français le caractère défini et contextuel des paroles, sans transformer celles-ci en simple contenu abstrait.
- source_word: קָרָא
  choice: avait proclamées
  rationale: Dans le contexte de la parole transmise par les prophètes, « proclamer » exprime une déclaration publique et autorisée. Le plus-que-parfait situe cette proclamation antérieure par rapport à la situation passée décrite ensuite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin du texte hébreu plutôt que de le remplacer par un titre.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: par les prophètes d’autrefois
  rationale: L’expression idiomatique « par la main de » indique l’intermédiaire ou l’agent. « D’autrefois » signifie ici antérieurs, sans suggérer nécessairement la section canonique appelée « Prophètes antérieurs ».
- source_word: בִּהְיוֹת
  choice: lorsque
  rationale: La préposition ב avec l’infinitif construit de היה introduit la circonstance temporelle.
- source_word: יְרוּשָׁלִַם יֹשֶׁבֶת
  choice: Jérusalem était habitée
  rationale: Appliqué à une ville, le participe de ישׁב indique qu’elle était peuplée ou occupée par des habitants.
- source_word: וּשְׁלֵוָה
  choice: et tranquille
  rationale: Le terme évoque le calme, l’aisance et la sécurité. « Tranquille » conserve cette amplitude sans limiter le sens à la prospérité matérielle.
- source_word: וְעָרֶיהָ סְבִיבֹתֶיהָ
  choice: ainsi que les villes qui l’entouraient
  rationale: Cette formulation française naturelle maintient le rapport entre Jérusalem et les villes environnantes.
- source_word: וְהַנֶּגֶב
  choice: le Néguev
  rationale: Le mot désigne ici vraisemblablement la région géographique au sud de Juda, et non la seule direction du sud.
- source_word: וְהַשְּׁפֵלָה
  choice: la Shéphéla
  rationale: La translittération conserve le nom de la région des basses terres et des contreforts occidentaux de Juda.
- source_word: יֹשֵׁב
  choice: étaient habités
  rationale: Le participe singulier hébreu a une valeur collective pour les deux régions nommées. Le pluriel français s’accorde naturellement avec les deux sujets.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel dans une forme française courante en études bibliques, sans le remplacer par un titre.
- issue: Portée de « prophètes d’autrefois »
  choice: Des prophètes antérieurs à la génération de Zacharie
  alternative: La division canonique des « Prophètes antérieurs »
  rationale: Dans ce contexte, l’expression est temporelle. La traduction évite les majuscules et une terminologie susceptible d’imposer une référence à une section précise du canon.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, de même que les noms géographiques traditionnels « Néguev » et « Shéphéla ». « Prophètes d’autrefois » évite l’ambiguïté canonique que pourrait créer « premiers prophètes » ou « Prophètes antérieurs ». Tous les appels de note figurent immédiatement après l’élément concerné.
