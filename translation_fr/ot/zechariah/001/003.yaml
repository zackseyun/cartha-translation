id: ZEC.1.3
reference: Zechariah 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֗ם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֣וּבוּ אֵלַ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/אָשׁ֣וּב אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/003.yaml
  text: 'Therefore say to them[a], ‘Thus says Yahweh of hosts: Return to me,’ declares Yahweh of hosts, ‘and I will return to you,’ says Yahweh of hosts.'
translation:
  language: fr
  text: 'Dis-leur donc : « Voici ce que dit Yahweh des armées : Revenez à moi[a], déclare Yahweh des armées, et je reviendrai à vous, dit Yahweh des armées. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tournez-vous vers moi… et je me tournerai vers vous. » L’hébreu emploie le même verbe dans les deux propositions, soulignant la réciprocité du rétablissement.'
    reason: Alternative lexicale préservant l’ambiguïté de שׁוב entre l’idée de se tourner et celle de revenir.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Dis-leur donc
  rationale: Le waw relie l’ordre au constat du verset précédent. « Donc » explicite naturellement ce lien logique en français, tandis que « dis-leur » rend directement le verbe et son complément.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle rend la formule du messager prophétique sans archaïsme, tout en conservant son caractère solennel.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » représente le nom divin יהוה plutôt que de lui substituer un titre. « Des armées » rend le pluriel צבאות sans préciser s’il s’agit des armées célestes ou terrestres.
- source_word: שׁוּבוּ אֵלַי
  choice: Revenez à moi
  rationale: שׁוב exprime ici le retour vers Dieu, avec ses dimensions relationnelle et pénitentielle. « Revenez » permet aussi de reprendre le même verbe dans la promesse qui suit.
- source_word: נְאֻם
  choice: déclare
  rationale: Dans cette formule prophétique, « déclare » communique une parole divine solennelle et autorisée dans un français naturel.
- source_word: וְאָשׁוּב אֲלֵיכֶם
  choice: et je reviendrai à vous
  rationale: La reprise de « revenir » préserve la répétition intentionnelle de שׁוב et la réciprocité entre le retour du peuple et celui de Dieu.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: dit Yahweh des armées
  rationale: « Dit » distingue simplement אָמַר du terme נְאֻם rendu juste avant par « déclare », tout en respectant la répétition emphatique du titre divin.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. Sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Réciprocité exprimée par שׁוב
  choice: Revenez à moi… et je reviendrai à vous
  alternative: Tournez-vous vers moi… et je me tournerai vers vous
  rationale: Le même verbe hébreu décrit l’action du peuple et celle de Dieu. Répéter « revenir » conserve cette symétrie et l’idée de restauration, sans préciser davantage la nature du retour divin.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste solennelle sans recourir à une syntaxe archaïque. La triple répétition de « Yahweh des armées » est conservée comme dans l’hébreu.
