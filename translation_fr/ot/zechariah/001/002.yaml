  text: Yahweh was very angry with your fathers[a].
translation:
  language: fr
  text: Yahweh s’est vivement irrité contre vos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos ancêtres » ; littéralement « vos pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף ... קָצֶף
  choice: s’est vivement irrité
  rationale: Le verbe suivi du nom apparenté forme une construction intensive, littéralement « s’est irrité d’une irritation ». « S’est vivement irrité » en restitue l’emphase dans un français naturel sans répétition maladroite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: עַל
  choice: contre
  rationale: Avec un verbe exprimant la colère, la préposition introduit ceux vers qui celle-ci est dirigée ; « contre » convient naturellement ici.
- source_word: אֲבֹתֵיכֶם
  choice: vos pères
  rationale: Le terme signifie littéralement « vos pères » et désigne ici les générations antérieures. La formulation concrète du texte est conservée, tandis que le sens plus général est signalé en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le nom divin. Le translittérer préserve le nom propre sans lui substituer un titre.
- issue: Portée de « vos pères »
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le sens contextuel englobe les générations précédentes, mais la traduction principale conserve l’image et la forme masculine explicites de l’hébreu ; la portée plus large figure en note.
translation_notes:
  register: Français moderne, clair et digne. « S’est vivement irrité » conserve l’intensité de la construction hébraïque tout en évitant un calque peu naturel.
