source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ אֶת מַלְאַ֣ךְ יְהוָ֗ה הָֽ/עֹמֵד֙ בֵּ֣ין הַ/הֲדַסִּ֔ים וַ/יֹּאמְר֖וּ הִתְהַלַּ֣כְנוּ בָ/אָ֑רֶץ וְ/הִנֵּ֥ה כָל הָ/אָ֖רֶץ יֹשֶׁ֥בֶת וְ/שֹׁקָֽטֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/011.yaml
  text: And they answered the angel of Yahweh who was standing among the myrtle trees and said[a], “We have gone throughout the earth, and behold[b], all the earth is at rest and quiet.”
translation:
  language: fr
  text: 'Ils répondirent à l’ange de Yahweh, qui se tenait parmi les myrtes, et lui dirent : « Nous avons parcouru la terre en tous sens[a], et voici que toute la terre demeure au repos et tranquille[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons circulé sur la terre » ; le verbe peut évoquer des déplacements en divers sens, voire une patrouille.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « est assise et tranquille » ; l’expression décrit une situation stable et sans agitation.
    reason: hebrew_idiom
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת
  choice: Ils répondirent à
  rationale: Dans ce dialogue, ענה signifie « répondre ». Le français demande la préposition « à » devant la personne à laquelle on répond, même si l’hébreu emploie ici le marqueur du complément direct.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager ou un ange ; dans cette vision, « ange » est le terme français le plus naturel, sans déterminer davantage l’identité du personnage. Le nom divin est translittéré « Yahweh ».
- source_word: הָעֹמֵד
  choice: qui se tenait
  rationale: Le participe présente la position continue de l’ange dans la scène. « Se tenait » est naturel et digne en français narratif.
- source_word: בֵּין הַהֲדַסִּים
  choice: parmi les myrtes
  rationale: בֵּין signifie littéralement « entre », mais, au milieu d’un groupe d’arbustes, « parmi » exprime naturellement la relation spatiale. הֲדַסִּים désigne les myrtes.
- source_word: הִתְהַלַּכְנוּ
  choice: avons parcouru … en tous sens
  rationale: La forme hitpael de הלך évoque ici un déplacement à travers un territoire, possiblement dans plusieurs directions. Cette formulation conserve l’idée de circulation sans imposer explicitement la notion militaire de patrouille.
- source_word: בָאָרֶץ / כָל־הָאָרֶץ
  choice: la terre / toute la terre
  rationale: La portée du rapport visionnaire paraît générale. « Terre » convient mieux que « pays », tout en laissant au contexte le soin de préciser l’étendue exacte.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure française rend le marqueur hébreu qui attire l’attention sur le constat rapporté, tout en gardant le ton prophétique.
- source_word: יֹשֶׁבֶת וְשֹׁקָטֶת
  choice: demeure au repos et tranquille
  rationale: יֹשֶׁבֶת décrit littéralement la terre comme étant assise ou établie, tandis que שֹׁקָטֶת exprime le calme et l’absence de trouble. La formulation française restitue l’état durable et les deux aspects sans produire une image maladroite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Sens de מַלְאַךְ dans l’expression מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Dans le cadre visionnaire, « ange » est idiomatique en français. La traduction ne précise pas la nature exacte ni l’identité théologique de cet ange, préservant ainsi la tension du texte.
- issue: Portée du calme de toute la terre
  choice: demeure au repos et tranquille
  alternative: reste immobile et paisible
  rationale: Le rapport constate un calme général sans dire s’il est moralement bon, approuvé par Dieu ou seulement politique. La traduction évite de transformer ce calme en bénédiction explicite.
translation_notes:
  register: Français international actuel, narratif et digne. Le passé simple convient au récit prophétique écrit ; « voici que » conserve la solennité sans archaïsme excessif. La répétition « répondirent… dirent » reflète délibérément la structure hébraïque, avec « lui » ajouté pour rendre la syntaxe naturelle en français.
