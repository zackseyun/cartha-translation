source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה שַׁ֤בְתִּי לִ/ירוּשָׁלִַ֨ם֙ בְּֽ/רַחֲמִ֔ים בֵּיתִ/י֙ יִבָּ֣נֶה בָּ֔/הּ נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת ו/קוה יִנָּטֶ֖ה עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/016.yaml
  text: 'Therefore, thus says the LORD: I have returned to Jerusalem with compassion; my house will be built in her, declares the LORD of hosts, and a measuring line will be stretched out over Jerusalem.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit l’Éternel : Je suis revenu à Jérusalem avec compassion. Ma maison y sera reconstruite — déclaration de l’Éternel des armées — et le cordeau sera tendu sur Jérusalem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְתִּי
  choice: Je suis revenu
  rationale: Le qatal de שׁוב est rendu comme un accompli, conformément à la forme hébraïque, sans le convertir en simple futur.
- source_word: בְּרַחֲמִים
  choice: avec compassion
  rationale: רַחֲמִים exprime ici la compassion ou la miséricorde; « avec compassion » est naturel et conserve la nuance affective.
- source_word: בֵּיתִי יִבָּנֶה
  choice: Ma maison y sera reconstruite
  rationale: Le nifal imparfait de בנה indique que le temple sera bâti; dans le contexte postexilique, « reconstruite » explicite naturellement le rétablissement de la maison détruite sans ajouter une doctrine.
- source_word: קוה
  choice: le cordeau
  rationale: Le qere probable קָו désigne un cordeau de mesure ou d’arpentage; « le cordeau » conserve l’image concrète de la planification de la ville.
- source_word: יְהוָה צְבָאוֹת
  choice: l’Éternel des armées
  rationale: Formulation française biblique, digne et largement intelligible, qui distingue le nom divin du titre צְבָאוֹת.
theological_decisions:
- issue: Temporalité du retour divin
  choice: Je suis revenu
  alternative: Je reviendrai
  rationale: Le texte consonantique vocalisé porte un qatal à la première personne; la traduction conserve cet accompli et la tension entre retour déclaré et restauration encore à venir.
- issue: Référent de la reconstruction
  choice: Ma maison y sera reconstruite
  alternative: Ma maison sera bâtie en elle
  rationale: « Ma maison » désigne naturellement le temple, mais le texte ne l’explicite pas; le pronom locatif français évite de personnifier artificiellement Jérusalem tout en gardant le référent implicite.
translation_notes:
  register: Français international moderne, solennel sans archaïsme syntaxique. « Voici ce que dit » rend naturellement la formule prophétique כֹּה אָמַר. Les tirets encadrent la formule de déclaration sans rompre la progression de la promesse.
