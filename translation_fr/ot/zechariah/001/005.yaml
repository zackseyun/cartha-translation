  text: אֲבֽוֹתֵי/כֶ֖ם אַיֵּה הֵ֑ם וְ/הַ֨/נְּבִאִ֔ים הַ/לְ/עוֹלָ֖ם יִֽחְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/005.yaml
  text: Your fathers—where are they? And the prophets[a], do they live forever?
translation:
  language: fr
  text: Vos pères, où sont-ils ? Et les prophètes[a], vivent-ils éternellement ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos ancêtres ». L’hébreu dit littéralement « vos pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵיכֶם
  choice: vos pères
  rationale: Le nom masculin pluriel avec suffixe de 2e personne du pluriel désigne les générations antérieures des destinataires. « Vos pères » conserve la formulation familiale et la force directe de l’hébreu ; « vos ancêtres » est une possibilité plus explicite.
- source_word: אַיֵּה הֵם
  choice: où sont-ils ?
  rationale: L’adverbe interrogatif « où ? » est suivi du pronom indépendant de 3e personne du pluriel, qui renforce la question. Le français fournit naturellement le verbe « être ».
- source_word: וְהַנְּבִאִים
  choice: Et les prophètes
  rationale: La conjonction simple et le nom défini sont rendus directement, en maintenant le parallélisme entre les deux questions.
- source_word: הַלְעוֹלָם
  choice: éternellement
  rationale: Dans cette interrogation rhétorique, l’expression signifie « pour toujours ». « Éternellement » est naturel et digne dans ce contexte.
- source_word: יִחְיוּ
  choice: vivront-ils
  rationale: L’imparfait qal à la 3e personne du pluriel peut exprimer ici la continuation à venir de la vie. Le futur français forme une question naturelle sur une éventuelle vie sans fin, sans nier que les prophètes puissent encore être vivants au moment évoqué.
theological_decisions:
- issue: Référent et portée rhétorique des « prophètes »
  choice: Le verset souligne que les prophètes, comme les générations précédentes, ne vivent pas éternellement.
  alternative: On peut entendre la seconde question comme une simple interrogation sur la durée de vie des prophètes, le contraste explicite entre leur mortalité et la permanence de la parole divine n’apparaissant qu’au verset suivant.
  rationale: La question hébraïque porte directement sur la mortalité des messagers. La traduction ne développe pas encore la conclusion théologique du verset 6 et préserve ainsi la progression du passage.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme rhétorique est conservé. Le futur « vivront-ils » rend naturellement l’imparfait hébreu dans une question portant sur une durée indéfinie.
