language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֗עַן הָ/אִ֛ישׁ הָ/עֹמֵ֥ד בֵּין הַ/הַדַסִּ֖ים וַ/יֹּאמַ֑ר אֵ֚לֶּה אֲשֶׁ֣ר שָׁלַ֣ח יְהוָ֔ה לְ/הִתְהַלֵּ֖ךְ בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/010.yaml
  text: Then the man who was standing among the myrtle trees answered and said[b][a], “These are the ones whom Yahweh has sent to walk throughout the earth.”
translation:
  language: fr
  text: 'Alors l’homme qui se tenait parmi les myrtes répondit : « Ce sont ceux que Yahweh a envoyés parcourir[a] la terre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « patrouiller sur la terre » ou « aller çà et là sur la terre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le pays », selon que la vision concerne le monde entier ou un territoire plus limité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: répondit
  rationale: La formule hébraïque associe « répondre » et « dire ». En français actuel, « répondit » exprime naturellement l’introduction de la réplique sans le pléonasme peu idiomatique « répondit et dit ».
- source_word: הָאִישׁ
  choice: l’homme
  rationale: אִישׁ désigne ici une figure masculine précise de la vision.
- source_word: הָעֹמֵד
  choice: qui se tenait
  rationale: Le participe décrit la position continue de l’homme. « Se tenait » est naturel et dignifié dans un récit visionnaire.
- source_word: בֵּין הַהַדַסִּים
  choice: parmi les myrtes
  rationale: בֵּין peut signifier « entre » ou, avec un ensemble d’arbres, « parmi ». הֲדַסִּים désigne des myrtes.
- source_word: אֵלֶּה אֲשֶׁר
  choice: Ce sont ceux que
  rationale: Le démonstratif renvoie aux êtres déjà aperçus dans la vision; cette tournure explicite naturellement en français le référent personnel sous-entendu.
- source_word: שָׁלַח
  choice: a envoyés
  rationale: Le passé composé présente l’envoi accompli dont la mission se poursuit dans la scène. L’accord masculin pluriel correspond aux envoyés évoqués.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: לְהִתְהַלֵּךְ
  choice: parcourir
  rationale: La forme hitpael de הלך évoque le fait de circuler, d’aller çà et là. « Parcourir » conserve l’idée de déplacement étendu sans imposer explicitement la nuance militaire de « patrouiller ».
- source_word: בָּאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner soit la terre au sens large, soit un territoire particulier. Le contexte visionnaire favorise ici « la terre », tout en maintenant l’autre possibilité en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme, nom personnel divin. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Étendue géographique de בָּאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: La mission des cavaliers paraît avoir une portée générale dans la vision, mais le nom hébreu permet aussi une référence territoriale plus locale; l’ambiguïté est donc signalée.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite le calque « répondit et dit », tout en conservant la fonction dialogique de la formule hébraïque. Les notes maintiennent les ambiguïtés réelles concernant le type de déplacement et la portée de אֶרֶץ.
