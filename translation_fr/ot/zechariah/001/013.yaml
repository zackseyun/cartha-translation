  text: וַ/יַּ֣עַן יְהוָ֗ה אֶת הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י דְּבָרִ֣ים טוֹבִ֑ים דְּבָרִ֖ים נִחֻמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/013.yaml
  text: And Yahweh answered the angel who was speaking with me with good words[b][a], comforting words.
translation:
  language: fr
  text: Et Yahweh répondit à l’ange qui me parlait par de bonnes paroles, des paroles réconfortantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans ce récit, le wayyiqtol du verbe ענה exprime naturellement une réponse et maintient le cadre dialogué.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: מלאך peut désigner un messager, mais le contexte visionnaire de Zacharie indique ici un être céleste.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: L’imparfait français rend naturellement la valeur durative du participe et la conversation en cours avec le prophète.
- source_word: דְּבָרִים טוֹבִים
  choice: des paroles bonnes
  rationale: Cette formulation directe conserve le terme répété « paroles » et la portée large de טוֹבִים, sans préciser indûment s’il s’agit de bonté, de faveur ou d’une heureuse annonce.
- source_word: דְּבָרִים נִחֻמִים
  choice: des paroles réconfortantes
  rationale: Cette expression actuelle rend le champ sémantique de la consolation et préserve le parallélisme hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel tout en évitant de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « paroles… paroles » reproduit le parallélisme de l’hébreu. La tournure « par des paroles » rend la fonction adverbiale de l’expression hébraïque, bien que « en lui adressant de bonnes paroles » soit plus explicite.
