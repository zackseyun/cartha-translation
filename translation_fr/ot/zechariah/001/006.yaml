  text: אַ֣ךְ דְּבָרַ֣/י וְ/חֻקַּ֗/י אֲשֶׁ֤ר צִוִּ֨יתִי֙ אֶת עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הֲ/ל֥וֹא הִשִּׂ֖יגוּ אֲבֹתֵי/כֶ֑ם וַ/יָּשׁ֣וּבוּ וַ/יֹּאמְר֗וּ כַּ/אֲשֶׁ֨ר זָמַ֜ם יְהוָ֤ה צְבָאוֹת֙ לַ/עֲשׂ֣וֹת לָ֔/נוּ כִּ/דְרָכֵ֨י/נוּ֙ וּ/כְ/מַ֣עֲלָלֵ֔י/נוּ כֵּ֖ן עָשָׂ֥ה אִתָּֽ/נוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/006.yaml
  text: But did not my words and my statutes[a], which I commanded my servants the prophets, overtake your fathers? Then they turned back and said, ‘As Yahweh of Armies planned to do to us, according to our ways and according to our deeds[c][b], so he has dealt with us.’
translation:
  language: fr
  text: 'Mais mes paroles et mes prescriptions, dont j’avais chargé mes serviteurs, les prophètes, n’ont-elles pas rattrapé vos ancêtres ? Alors ils se sont retournés[a] et ont dit : « Yahweh des armées avait projeté de nous traiter selon notre conduite et selon nos actes ; ainsi il nous a traités. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils se sont repentis ». Le verbe hébreu peut signifier revenir, se retourner ou, dans ce contexte, se repentir.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: Introduit le contraste avec la mortalité des ancêtres et des prophètes mentionnée juste avant.
- source_word: דְּבָרַי וְחֻקַּי
  choice: mes paroles et mes prescriptions
  rationale: « Paroles » conserve la référence aux déclarations divines, tandis que « prescriptions » exprime naturellement en français moderne les exigences établies par Dieu.
- source_word: צִוִּיתִי אֶת־עֲבָדַי הַנְּבִיאִים
  choice: que j’avais données à mes serviteurs les prophètes
  rationale: Le verbe « donner » prend naturellement pour objets les paroles et prescriptions en français, tout en laissant les prophètes comme destinataires de la mission. L’antériorité est rendue par le plus-que-parfait.
- source_word: הִשִּׂיגוּ
  choice: ont-elles pas rattrapé
  rationale: Préserve l’image de paroles divines qui poursuivent les ancêtres et finissent par les atteindre dans l’accomplissement du jugement annoncé.
- source_word: וַיָּשׁוּבוּ
  choice: Alors ils sont revenus
  rationale: Conserve le sens concret et potentiellement spirituel de שׁוב sans imposer explicitement l’idée d’une repentance intérieure.
- source_word: זָמַם
  choice: avait projeté
  rationale: Exprime une intention arrêtée et antérieure à son exécution.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et traduit צְבָאוֹת de manière transparente, en conservant la force militaire et cosmique du titre.
- source_word: כִדְרָכֵינוּ וּכְמַעֲלָלֵינוּ
  choice: selon notre conduite et selon nos actes
  rationale: « Conduite » communique clairement le sens moral de « voies » en français courant, tandis qu’« actes » rend distinctement les actions accomplies.
- source_word: כֵּן עָשָׂה אִתָּנוּ
  choice: c’est bien ainsi qu’il nous a traités
  rationale: Formulation française naturelle qui garde l’idée de correspondance exacte entre le projet annoncé et son accomplissement.
theological_decisions:
- issue: Faut-il rendre וַיָּשׁוּבוּ par une repentance explicite ?
  choice: ils sont revenus
  alternative: ils se sont repentis
  rationale: שׁוב peut désigner un retour ou une repentance. Leur confession peut suggérer la repentance, mais le texte ne précise pas leur disposition intérieure ; la traduction principale préserve donc cette ambiguïté.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin ; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée du jugement annoncé
  choice: les paroles et prescriptions « rattrapent » les ancêtres
  alternative: elles « atteignent » les ancêtres
  rationale: Le choix maintient la métaphore selon laquelle les annonces divines finissent par rejoindre ceux auxquels elles s’appliquent, sans réduire les « paroles » aux seules sanctions.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image forte de paroles qui « rattrapent » les ancêtres, tout en remplaçant l’idiome peu transparent « nos voies » par « notre conduite ». Le discours direct reste solennel sans archaïsmes.
