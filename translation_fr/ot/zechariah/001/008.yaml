id: ZEC.1.8
reference: Zechariah 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָאִ֣יתִי הַ/לַּ֗יְלָה וְ/הִנֵּה אִישׁ֙ רֹכֵב֙ עַל ס֣וּס אָדֹ֔ם וְ/ה֣וּא עֹמֵ֔ד בֵּ֥ין הַ/הֲדַסִּ֖ים אֲשֶׁ֣ר בַּ/מְּצֻלָ֑ה וְ/אַחֲרָי/ו֙ סוּסִ֣ים אֲדֻמִּ֔ים שְׂרֻקִּ֖ים וּ/לְבָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/008.yaml
  text: I saw in the night[a], and behold, a man riding on a red horse! He was standing among the myrtle trees that were in the ravine, and behind him were red, sorrel[b], and white horses.
translation:
  language: fr
  text: 'Pendant la nuit, j’ai vu ceci : voici qu’un homme montait un cheval rouge. Il se tenait parmi les myrtes, dans un bas-fond[a]. Derrière lui se trouvaient des chevaux rouges, alezans[b] et blancs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu profond », « dans le creux » ou « dans le ravin »; le terme hébreu désigne probablement un endroit encaissé ou en contrebas.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est incertain; il peut désigner des chevaux roux ou brun rougeâtre, peut-être tachetés ou bigarrés.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי הַלַּיְלָה
  choice: Pendant la nuit, j’ai vu ceci
  rationale: Le parfait de ראה signifie simplement « voir », sans qu’il soit nécessaire d’expliciter « avoir une vision ». Le complément situe la scène pendant la nuit; « ceci » introduit naturellement en français ce qui est vu.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Ce marqueur attire vivement l’attention sur l’apparition et conserve la soudaineté de la scène dans un français actuel et digne.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom désigne ordinairement un homme; la traduction n’ajoute aucune identification théologique.
- source_word: רֹכֵב עַל סוּס אָדֹם
  choice: montait un cheval rouge
  rationale: Le participe décrit l’homme à cheval. « Monter un cheval » est idiomatique et reste proche de la construction hébraïque.
- source_word: וְהוּא עֹמֵד
  choice: Il se tenait
  rationale: Le pronom suivi du participe décrit une position continue dans la scène. Le français conserve l’ambiguïté référentielle du pronom sans préciser artificiellement s’il s’agit de l’homme seul ou de l’ensemble formé avec sa monture.
- source_word: בֵּין הַהֲדַסִּים
  choice: parmi les myrtes
  rationale: הֲדַסִּים désigne les myrtes; « parmi » convient naturellement à un groupe d’arbustes ou d’arbres.
- source_word: בַּמְּצֻלָה
  choice: dans un bas-fond
  rationale: Le mot évoque ici un lieu profond ou encaissé. « Bas-fond » exprime le relief sans imposer la forme plus précise d’un ravin; l’incertitude lexicale est signalée en note.
- source_word: וְאַחֲרָיו
  choice: Derrière lui
  rationale: Dans cette disposition visuelle, la valeur spatiale de l’expression est la plus naturelle.
- source_word: אֲדֻמִּים
  choice: rouges
  rationale: L’adjectif désigne clairement la couleur rouge et s’accorde avec le pluriel « chevaux ».
- source_word: שְׂרֻקִּים
  choice: alezans
  rationale: Le terme de couleur est rare et incertain. « Alezans » désigne naturellement en français une robe équine rousse à brun rougeâtre, tandis que d’autres possibilités sont conservées en note.
- source_word: וּלְבָנִים
  choice: et blancs
  rationale: L’adjectif désigne sans ambiguïté des chevaux de couleur blanche.
theological_decisions:
- issue: Identité de l’homme monté sur le cheval rouge
  choice: Le désigner simplement comme « un homme »
  alternative: L’identifier à l’ange de l’Éternel, à un cavalier symbolique ou à une apparition du Christ avant son incarnation
  rationale: Ce verset le présente uniquement comme אִישׁ, « un homme ». Une identification plus précise importerait dans la traduction une conclusion tirée du contexte ou d’une interprétation théologique.
- issue: Référent de « il se tenait »
  choice: Conserver le pronom sans explicitation
  alternative: Préciser que le cheval se tenait là, ou que l’homme et sa monture y étaient arrêtés
  rationale: Le masculin singulier hébreu renvoie grammaticalement à l’homme, mais la scène peut envisager le cavalier avec sa monture. La formulation française préserve cette légère tension sans corriger le texte.
translation_notes:
  register: Français international moderne, clair et digne. La construction « voici que » maintient la vivacité visionnaire sans archaïsme excessif. « Myrtes », « bas-fond » et « alezans » offrent une précision concrète, les incertitudes réelles étant conservées dans les notes.
