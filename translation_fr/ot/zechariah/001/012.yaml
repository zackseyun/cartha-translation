reference: Zechariah 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֣עַן מַלְאַךְ יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֣ה צְבָא֔וֹת עַד מָתַ֗י אַתָּה֙ לֹֽא תְרַחֵ֣ם אֶת יְרוּשָׁלִַ֔ם וְ/אֵ֖ת עָרֵ֣י יְהוּדָ֑ה אֲשֶׁ֣ר זָעַ֔מְתָּה זֶ֖ה שִׁבְעִ֥ים שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/012.yaml
  text: Then the angel of Yahweh answered and said[a], “O Yahweh of hosts, how long will you have no compassion on Jerusalem and on the cities of Judah[c][b], against which you have been angry these seventy years?”
translation:
  language: fr
  text: 'Alors l’ange de Yahweh répondit et dit : « Yahweh des armées, jusqu’à quand ne montreras-tu pas de compassion à Jérusalem et aux villes de Juda, contre lesquelles tu es en colère depuis soixante-dix ans ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans cette vision prophétique, « ange » est le terme français le plus naturel, sans préciser davantage l’identité de ce personnage.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: prit la parole et dit
  rationale: La combinaison hébraïque signifie littéralement « répondit et dit ». En français narratif, « prit la parole et dit » évite une lourdeur tout en conservant l’idée d’une intervention en réponse à la situation.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: צְבָאוֹת désigne des armées ou des multitudes organisées. « Des armées » garde le sens concret du titre hébreu et reste intelligible en français moderne.
- source_word: עַד מָתַי
  choice: jusqu’à quand
  rationale: Équivalent idiomatique direct de la formule d’intercession et de lamentation.
- source_word: לֹא תְרַחֵם
  choice: refuseras-tu d’avoir compassion
  rationale: Le verbe רחם exprime la compassion ou la miséricorde. Cette formulation rend naturellement en français la négation hébraïque dans une question portant sur la durée, sans atténuer sa force.
- source_word: אֲשֶׁר זָעַמְתָּה
  choice: contre lesquelles tu es indigné
  rationale: זעם exprime une forte indignation. Le français « être indigné contre » conserve cette nuance et le relatif est rattaché à Jérusalem et aux villes de Juda prises ensemble.
- source_word: זֶה שִׁבְעִים שָׁנָה
  choice: depuis soixante-dix ans
  rationale: L’expression indique une durée qui se prolonge jusqu’au moment présent. « Depuis soixante-dix ans » est naturel en français et rend cette valeur temporelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre divin est translittéré afin de préserver sa fonction de nom d’alliance dans le texte source.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le texte désigne la figure sans en donner ici une identification théologique plus précise. La traduction conserve cette réserve.
- issue: Portée de l’antécédent de אֲשֶׁר
  choice: Jérusalem et les villes de Juda
  alternative: les seules villes de Juda
  rationale: En hébreu, le relatif peut formellement sembler proche des villes de Juda, mais le contexte de l’indignation divine englobe naturellement Jérusalem et les villes. Le féminin pluriel français explicite cette lecture contextuelle sans ajouter de note inutile.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocatif est rendu sans « ô », jugé inutilement archaïsant. « Yahweh des armées » conserve l’image du titre hébreu, tandis que la syntaxe demeure fluide à l’oral comme à l’écrit.
