base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/009.yaml
  text: Then I said[a], “What are these, my lord?” And the angel who was speaking with me said to me[b], “I will show you what these are.”
translation:
  language: fr
  text: 'Alors je dis : « Que sont ceux-ci, mon seigneur[a] ? » L’ange qui me parlait[b] me dit : « Je te montrerai ce qu’ils sont. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « monsieur » ou « mon maître ». L’hébreu אֲדֹנִי est ici une formule d’adresse respectueuse, et non le nom divin.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui parlait en moi » ; dans ce contexte de vision, l’expression hébraïque décrit la communication de l’ange avec le prophète : il lui parlait ou s’adressait à lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors je demandai
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, et « demandai » convient au discours interrogatif qui suit.
- source_word: מָה אֵלֶּה
  choice: Que sont ceux-ci
  rationale: מָה demande ici l’identité des êtres vus, tandis que אֵלֶּה est employé substantivement. « Ceux-ci » conserve cette indétermination sans ajouter « choses ».
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une adresse respectueuse à l’interlocuteur angélique, et non du nom divin. « Mon seigneur » garde le ton élevé et le lien lexical avec אדון.
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: Dans cette vision, le מַלְאָךְ est un messager céleste qui interprète ce que voit le prophète ; « ange » est donc le terme français naturel.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: Littéralement, la préposition ב peut être rendue par « en », mais l’expression récurrente dans Zacharie décrit la communication de l’ange avec le prophète. « Me parlait » exprime clairement cette relation en français.
- source_word: אֲנִי אַרְאֶךָּ
  choice: Je vais te montrer
  rationale: Le hifil de ראה signifie « faire voir, montrer ». Le pronom explicite אֲנִי donne une légère insistance, naturellement portée en français par le sujet exprimé et le contexte.
- source_word: מָה הֵמָּה אֵלֶּה
  choice: ce qu’ils sont
  rationale: La formulation hébraïque reprend la question avec le pronom הֵמָּה. Le français emploie naturellement « ce qu’ils sont », en conservant le référent encore non identifié.
theological_decisions:
- issue: Référent et valeur de אֲדֹנִי
  choice: Adresse respectueuse rendue par « mon seigneur », visant l’ange interprète plutôt qu’un titre divin.
  alternative: « monsieur » ou « mon maître »
  rationale: Le contexte présente un dialogue avec l’ange qui accompagne le prophète. Cette traduction maintient l’honneur exprimé sans identifier implicitement cet ange à YHWH.
- issue: Sens de בִּי dans הַדֹּבֵר בִּי
  choice: 'Sens relationnel idiomatique : « qui me parlait ».'
  alternative: « qui parlait en moi »
  rationale: Bien que ב signifie ordinairement « dans, en », l’expression zacharienne décrit ici l’échange entre l’ange et le prophète. Une traduction littérale pourrait suggérer à tort une parole intérieure.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit ; le tutoiement reflète la deuxième personne masculine singulière. « Ceux-ci » préserve l’indétermination du groupe aperçu dans la vision.
