  variant: modern international French
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁמִינִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔ה בֶּן עִדּ֥וֹ הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/001.yaml
  text: In the eighth month[a], in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet, saying,
translation:
  language: fr
  text: 'Au huitième mois de la deuxième année de Darius, la parole de Yahweh[a] fut adressée à Zacharie, fils de Bérékia, fils d’Iddo, le prophète, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin YHWH, rendu ici par « Yahweh ».
    reason: Préciser que la traduction conserve le nom propre divin plutôt que de lui substituer le titre « le Seigneur ».
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: Au huitième mois
  rationale: La préposition, le nom et l’ordinal forment une indication temporelle. Cette formulation est naturelle en français et conserve la structure de datation du texte hébreu.
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: de la deuxième année de Darius
  rationale: Il s’agit de la formule habituelle pour une année de règne. Avec « au huitième mois », le complément introduit par « de » donne une datation française fluide et précise.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: la parole de Yahweh fut adressée à
  rationale: Dans cette formule prophétique, היה דבר יהוה annonce qu’une révélation divine est communiquée à son destinataire. « Fut adressée à » rend naturellement l’expression sans suggérer un simple déplacement matériel de la parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le translittère au lieu de le remplacer par un titre tel que « le Seigneur ».
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָה בֶּן עִדּוֹ
  choice: Zacharie, fils de Bérékia, fils d’Iddo
  rationale: Les formes françaises usuelles des noms sont employées, et la répétition de « fils de » conserve explicitement la chaîne généalogique.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le nom défini est rendu directement. Sa position après la chaîne généalogique laisse ouverte la question de savoir s’il qualifie Iddo ou Zacharie.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif introduit les paroles divines qui suivent. La formule française annonce clairement la citation continuée au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin YHWH. Le conserver sous la forme « Yahweh » distingue ce nom du titre אֲדֹנָי et évite de substituer silencieusement un titre au nom.
- issue: Référent de l’apposition « le prophète »
  choice: Conserver une construction française pouvant qualifier Iddo ou Zacharie
  alternative: Expliciter soit « Iddo, qui était prophète », soit « Zacharie, le prophète »
  rationale: La position de הַנָּבִיא à la fin de la chaîne patronymique permet une hésitation sur son rattachement. Le texte principal ne tranche donc pas ce que l’hébreu ne rend pas entièrement explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la formule prophétique sans employer le calque peu naturel « disant ». Les deux-points indiquent que le message commence au verset suivant.
