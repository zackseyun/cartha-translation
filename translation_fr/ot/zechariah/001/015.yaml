  text: וְ/קֶ֤צֶף גָּדוֹל֙ אֲנִ֣י קֹצֵ֔ף עַל הַ/גּוֹיִ֖ם הַ/שַּֽׁאֲנַנִּ֑ים אֲשֶׁ֤ר אֲנִי֙ קָצַ֣פְתִּי מְּעָ֔ט וְ/הֵ֖מָּה עָזְר֥וּ לְ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/015.yaml
  text: And I am exceedingly angry with the nations that are at ease[a]; for I was only a little angry[d][c][b], but they helped forward the disaster.
translation:
  language: fr
  text: Je suis très en colère contre les nations qui vivent tranquilles[a]. Car je n’étais qu’un peu en colère[b], mais elles ont aggravé le malheur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui sont à l’aise » ou « qui vivent en sécurité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je n’ai été en colère que peu de temps ». L’hébreu peut indiquer une durée limitée plutôt qu’un faible degré de colère.'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « elles ont aidé en vue du mal », c’est-à-dire qu’elles ont contribué à intensifier la calamité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֶצֶף גָּדוֹל אֲנִי קֹצֵף
  choice: Je suis saisi d’une grande colère
  rationale: La construction associe le nom « grande colère » au participe « être en colère ». Cette formulation française naturelle conserve l’intensité et l’état présent exprimé par l’hébreu.
- source_word: עַל הַגּוֹיִם
  choice: contre les nations
  rationale: Dans ce contexte, גּוֹיִם désigne les peuples étrangers qui ont opprimé Juda; « nations » reste direct et n’introduit pas la connotation ultérieure de « païens ».
- source_word: הַשַּׁאֲנַנִּים
  choice: qui vivent dans l’insouciance
  rationale: Le terme évoque une sécurité tranquille pouvant aller jusqu’à la suffisance. « Vivent dans l’insouciance » est idiomatique et garde l’image sans imposer entièrement l’interprétation « suffisantes ».
- source_word: אֲשֶׁר
  choice: Car
  rationale: La particule relative prend ici une valeur explicative ou causale, introduisant le motif de la colère divine.
- source_word: אֲנִי קָצַפְתִּי מְּעָט
  choice: moi, je n’étais que peu en colère
  rationale: מְעָט est compris principalement comme une limitation de degré, en contraste avec l’aggravation causée par les nations. Le pronom disjoint « moi » restitue l’emphase de אֲנִי.
- source_word: וְהֵמָּה
  choice: mais elles
  rationale: La coordination est rendue de manière adversative pour faire ressortir le contraste, et le pronom « elles » reprend les nations avec l’emphase de l’hébreu.
- source_word: עָזְרוּ לְרָעָה
  choice: ont aggravé le malheur
  rationale: Littéralement, elles ont « aidé en vue du mal ». Dans ce contexte, l’expression signifie qu’elles ont contribué à rendre la calamité plus grave.
theological_decisions:
- issue: Rapport entre la colère de Dieu et la responsabilité des nations
  choice: Le texte distingue la colère limitée de Dieu envers son peuple de l’action des nations, qui ont aggravé le malheur.
  alternative: Les nations n’auraient fait qu’exécuter le jugement divin sans le dépasser.
  rationale: La structure contrastive entre « moi » et « elles », renforcée par מְעָט et וְהֵמָּה, présente leur conduite comme excessive, sans nier que la calamité s’inscrit dans le contexte de la colère divine.
- issue: Portée de מְעָט
  choice: « peu » limite principalement le degré de la colère.
  alternative: « peu de temps » limiterait sa durée.
  rationale: Le contraste avec l’aggravation du malheur favorise la lecture quantitative, mais l’autre possibilité grammaticale demeure réelle et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’emphase des pronoms hébreux et le contraste entre l’action divine et celle des nations, tout en signalant l’ambiguïté de מְעָט.
