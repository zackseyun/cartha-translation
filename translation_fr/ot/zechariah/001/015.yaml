  naturalness: « Je suis très en colère » est plus idiomatique en français international moderne. « Je n’étais qu’un peu en colère » est également plus naturel que « je n’étais que peu en colère ».
  terminology: « Nations » convient pour הַגּוֹיִם. « Vivent tranquilles » rend de façon sobre leur sécurité satisfaite sans imputer nécessairement une insouciance morale. « Malheur » convient à לְרָעָה dans ce contexte de calamité aggravée.
