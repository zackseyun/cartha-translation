  to: Je suis très en colère contre les nations qui vivent tranquilles[a]. Car je n’étais qu’un peu en colère[b], mais elles ont aggravé le malheur[c].
  rationale: La révision élimine une tournure passive et moins fidèle pour la colère divine, améliore la fluidité française et rend le repos sécurisant des nations sans surinterprétation psychologique. Elle maintient le contraste du texte hébreu ainsi que l’ambiguïté légitime de מְעָט en note.
