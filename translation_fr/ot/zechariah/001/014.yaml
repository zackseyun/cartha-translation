  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י קְרָ֣א לֵ/אמֹ֔ר כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת קִנֵּ֧אתִי לִ/ירוּשָׁלִַ֛ם וּ/לְ/צִיּ֖וֹן קִנְאָ֥ה גְדוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/014.yaml
  text: 'Then the angel who was speaking with me said to me[a], “Proclaim, saying, ‘Thus says Yahweh of hosts: I am exceedingly jealous for Jerusalem and for Zion.’”'
translation:
  language: fr
  text: 'Alors l’ange qui me parlait me dit : « Proclame : “Ainsi parle Yahweh des armées : J’éprouve une très grande jalousie[a] pour Jérusalem et pour Sion.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Je suis plein d’un grand zèle pour Jérusalem et pour Sion. » L’hébreu emploie deux mots de la même racine pour renforcer l’idée.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  choice: l’ange qui me parlait
  rationale: Dans Zacharie, דֹּבֵר בִּי est un idiome signifiant que l’ange parle avec le prophète, et non qu’il parle littéralement en lui. L’imparfait français rend naturellement le participe dans ce contexte narratif.
- source_word: קְרָא לֵאמֹר
  choice: Proclame
  rationale: Dans ce contexte prophétique, קרא désigne une proclamation publique. Le français n’a pas besoin de reproduire le pléonasme hébreu « proclame en disant ».
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule consacrée conserve le registre solennel du discours prophétique tout en étant idiomatique en français.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » transcrit le nom divin, tandis que « des armées » préserve l’imagerie militaire et céleste de צְבָאוֹת sans l’interpréter par « Tout-Puissant ».
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: J’éprouve une très grande jalousie
  rationale: Le verbe et le nom de même racine expriment une forte intensité. Cette formulation française conserve explicitement la notion de jalousie et la force de l’expression sans reproduire maladroitement « je suis jaloux d’une grande jalousie ».
- source_word: לִירוּשָׁלִַם וּלְצִיּוֹן
  choice: pour Jérusalem et pour Sion
  rationale: La répétition de « pour » reflète celle des prépositions hébraïques et souligne chacun des deux noms.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription « Yahweh » rend visible le nom propre présent dans l’hébreu et suit la convention fournie pour le projet.
- issue: Sens de קנא / קנאה appliqué à Dieu
  choice: jalousie
  alternative: zèle
  rationale: « Jalousie » maintient le vocabulaire explicite de l’hébreu ainsi que sa tension théologique et son arrière-plan d’attachement d’alliance. « Zèle » est possible, mais atténuerait cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation distingue la parole de l’ange de la proclamation divine enchâssée. Le présent « j’éprouve » rend la portée actuelle de l’accompli hébreu dans la déclaration prophétique.
