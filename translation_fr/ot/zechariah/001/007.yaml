  variant: modern international French
source:
  edition: WLC
  text: בְּ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לְ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֨דֶשׁ֙ הוּא חֹ֣דֶשׁ שְׁבָ֔ט בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔הוּ בֶּן עִדּ֥וֹא הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
translation:
  language: fr
  text: 'Le vingt-quatrième jour du onzième mois, c’est-à-dire le mois de Shebat, la deuxième année de Darius, la parole de Yahweh fut adressée à Zacharie, fils de Bérékia, fils d’Iddo, le prophète[a], en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « le prophète » peut désigner Zacharie ou, en raison de sa place dans la phrase, Iddo.
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: Le vingt-quatrième jour
  rationale: La formule française de datation emploie naturellement un ordinal et rend fidèlement la valeur temporelle de la préposition בְּ.
- source_word: לְעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: du onzième mois
  rationale: Cette formulation française courante conserve directement la désignation numérotée du mois.
- source_word: הוּא חֹדֶשׁ שְׁבָט
  choice: c’est-à-dire le mois de Shebat
  rationale: הוּא introduit ici l’identification explicative du onzième mois; « c’est-à-dire » en restitue naturellement la fonction.
- source_word: שְׁבָט
  choice: Shebat
  rationale: Le nom du mois est translittéré plutôt que traduit; « Shebat » reflète la consonne בּ comme b.
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: la deuxième année de Darius
  rationale: Cette tournure concise correspond à la formule de datation par année de règne sans ajouter au texte le mot « règne ».
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: la parole de Yahweh fut adressée à
  rationale: Dans cette formule prophétique, היה avec דְבַר יְהוָה indique que la parole divine parvient au prophète; « fut adressée à » est idiomatique en français tout en conservant le sens révélatoire.
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָהוּ בֶּן עִדּוֹא
  choice: Zacharie, fils de Bérékia, fils d’Iddo
  rationale: Les formes françaises usuelles des noms sont employées, et la chaîne généalogique est conservée dans l’ordre de l’hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction au discours, l’infinitif « disant » serait peu naturel en français; « en ces termes » en rend clairement la fonction.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin יהוה. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Référent de הַנָּבִיא (« le prophète »)
  choice: Maintien de l’ordre syntaxique hébreu avec une note signalant l’ambiguïté
  alternative: Zacharie le prophète, fils de Bérékia, fils d’Iddo
  rationale: Placé après Iddo, le titre peut grammaticalement être rattaché à Iddo, mais il peut aussi qualifier Zacharie, tête de toute la chaîne généalogique. Le texte principal ne tranche donc pas silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la formule prophétique hébraïque sans lourdeur littérale. Le nom divin est translittéré « Yahweh » et l’ambiguïté d’apposition concernant « le prophète » est explicitement préservée.
