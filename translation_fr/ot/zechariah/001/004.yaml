language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּהְי֣וּ כַ/אֲבֹֽתֵי/כֶ֡ם אֲשֶׁ֣ר קָרְאֽוּ אֲלֵי/הֶם֩ הַ/נְּבִיאִ֨ים הָ/רִֽאשֹׁנִ֜ים לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֤וּבוּ נָא֙ מִ/דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים ו/מעלילי/כם הָֽ/רָעִ֑ים וְ/לֹ֥א שָׁמְע֛וּ וְ/לֹֽא הִקְשִׁ֥יבוּ אֵלַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/004.yaml
  text: 'Do not be like your fathers[a], to whom the former prophets proclaimed, saying, “Thus says Yahweh of hosts: Turn back, please, from your evil ways and your evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
translation:
  language: fr
  text: 'Ne soyez pas comme vos pères[a], à qui les prophètes d’autrefois proclamaient : « Ainsi parle Yahweh des armées : Détournez-vous, je vous en prie, de vos mauvaises voies et de vos mauvaises actions. » Mais ils ne m’ont pas écouté et ne m’ont prêté aucune attention — déclaration de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtres ». Littéralement « pères » en hébreu; le terme désigne ici les générations antérieures.
    reason: alternative lexicale et clarification référentielle
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Ne soyez pas
  rationale: La négation אַל avec l’inaccompli de היה exprime ici une défense; cette formulation française est directe et naturelle.
- source_word: כַאֲבֹתֵיכֶם
  choice: comme vos pères
  rationale: Le choix conserve la forme masculine concrète de l’hébreu, tout en renvoyant dans le contexte aux générations antérieures; une note donne le sens plus large possible.
- source_word: קָרְאוּ אֲלֵיהֶם
  choice: à qui ... proclamaient
  rationale: קרא introduit le message prophétique cité; « proclamer » restitue mieux l’annonce publique et autorisée que le simple fait d’appeler.
- source_word: הַנְּבִיאִים הָרִאשֹׁנִים
  choice: les premiers prophètes
  rationale: הָרִאשֹׁנִים désigne les prophètes antérieurs dans le temps. « Premiers » reste proche de l’hébreu sans imposer ici un titre canonique technique.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: Ainsi parle Yahweh des armées
  rationale: Cette tournure conserve la formule du messager prophétique. « Armées » exprime le sens concret de צְבָאוֹת tout en laissant ouverte l’étendue exacte des forces visées.
- source_word: שׁוּבוּ נָא
  choice: Revenez donc
  rationale: שוב appelle à un retour qui est à la fois directionnel et moral. נָא donne à l’appel une nuance d’exhortation ou d’insistance; « donc » est naturel ici sans lui attribuer strictement un sens temporel.
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: de vos mauvaises voies
  rationale: דֶּרֶךְ désigne fréquemment la conduite ou le cours de la vie; « voies » préserve cette image biblique intelligible.
- source_word: וּמַעֲלִילֵיכֶם הָרָעִים
  choice: et de vos mauvaises actions
  rationale: מַעֲלָלִים renvoie aux actes ou aux pratiques. « Actions » est actuel, clair et concret.
- source_word: וְלֹא שָׁמְעוּ
  choice: Mais ils ne m’ont pas écouté
  rationale: שמע peut aller d’entendre à obéir. « Écouter » garde cette amplitude mieux qu’une traduction explicitement centrée sur l’obéissance; le pronom « m’ » est partagé naturellement avec le second verbe en français.
- source_word: וְלֹא הִקְשִׁיבוּ אֵלַי
  choice: et ne m’ont prêté aucune attention
  rationale: הקשיב exprime une attention soutenue ou le fait de prêter l’oreille. La formulation distingue ce membre du précédent tout en conservant l’objet personnel אֵלַי.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule solennelle d’affirmation prophétique. « Déclaration de Yahweh » la distingue de la formule כֹּה אָמַר qui précède.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre et évite de le remplacer par un titre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’univers; des puissances
  rationale: La traduction concrète conserve l’imagerie militaire et céleste du terme sans trancher quelles armées ou forces sont précisément visées.
- issue: Traduction de אָבוֹת
  choice: pères
  alternative: ancêtres
  rationale: « Pères » conserve la forme lexicale et grammaticale de l’hébreu; la note précise que le mot vise ici plus largement les générations antérieures.
- issue: Force de שׁוּבוּ dans l’appel prophétique
  choice: Revenez
  alternative: Détournez-vous; repentez-vous
  rationale: « Revenez » maintient l’image fondamentale du retour et sa portée morale sans expliciter davantage le concept théologique de repentance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique reste solennelle sans archaïsmes. Le parallélisme entre les « voies » et les « actions » est conservé, ainsi que la différence entre la formule d’introduction du discours et la formule finale d’affirmation.
