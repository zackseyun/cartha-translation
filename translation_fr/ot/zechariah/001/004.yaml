revisions:
- from: 'Ne soyez pas comme vos pères[a], à qui les premiers prophètes proclamaient : « Ainsi parle Yahweh des armées : Revenez donc de vos mauvaises voies et de vos mauvaises actions. » Mais ils ne m’ont pas écouté et ne m’ont prêté aucune attention — déclaration de Yahweh.'
  to: 'Ne soyez pas comme vos pères[a], à qui les prophètes d’autrefois proclamaient : « Ainsi parle Yahweh des armées : Détournez-vous, je vous en prie, de vos mauvaises voies et de vos mauvaises actions. » Mais ils ne m’ont pas écouté et ne m’ont prêté aucune attention — déclaration de Yahweh.'
  rationale: 'La révision corrige deux points de précision et d’idiomaticité sans modifier le sens : l’antériorité des prophètes est explicitée, et l’exhortation à abandonner les voies mauvaises est rendue par une construction française normale qui conserve la valeur de supplication de נָא. La note existante est exacte et son ancrage est maintenu.'
  reviewer_model: gpt-5.6-terra
