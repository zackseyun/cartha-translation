review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’appel à se détourner d’une conduite mauvaise, le double refus d’écouter/prêter attention, et les deux formules prophétiques avec le nom Yahweh. Toutefois, « les premiers prophètes » peut suggérer les prophètes chronologiquement initiaux plutôt que ceux d’autrefois, et « Revenez donc de » ne rend pas idiomatiquement en français l’impératif שׁוּבוּ suivi de מִן (« détournez-vous de »).
  naturalness: Le registre est globalement digne et accessible. « Les prophètes d’autrefois » est plus naturel et précis en français moderne dans ce contexte. « Détournez-vous, je vous en prie, de… » rend naturellement l’exhortation et la nuance suppliante de נָא, sans conférer à « donc » une fonction absente du texte.
  terminology: « Yahweh », « pères », « mauvaises voies » et « mauvaises actions » conviennent. La note sur « pères » préserve correctement l’alternative référentielle sans effacer le lexique hébreu. « Yahweh des armées » conserve l’imagerie de צְבָאוֹת sans interprétation doctrinale additionnelle.
  issues:
  - severity: medium
    issue: « les premiers prophètes »
    rationale: הַנְּבִיאִים הָרִאשֹׁנִים qualifie ici les prophètes antérieurs, non les premiers prophètes dans une séquence fondatrice. En français, « les prophètes d’autrefois » exprime clairement l’antériorité temporelle et évite une lecture technique ou chronologique inexacte.
  - severity: medium
    issue: « Revenez donc de vos mauvaises voies »
    rationale: La construction française « revenir de » ne convient pas pour l’abandon d’une conduite. Le verbe hébreu שוב, avec la préposition מן, appelle à se détourner de ces voies; נָא porte une nuance d’appel pressant ou de prière, mieux rendue par « je vous en prie ».
  revised_text: 'Ne soyez pas comme vos pères[a], à qui les prophètes d’autrefois proclamaient : « Ainsi parle Yahweh des armées : Détournez-vous, je vous en prie, de vos mauvaises voies et de vos mauvaises actions. » Mais ils ne m’ont pas écouté et ne m’ont prêté aucune attention — déclaration de Yahweh.'
  revised_footnotes:
