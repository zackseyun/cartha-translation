id: ZEC.1.17
reference: Zechariah 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ע֣וֹד קְרָ֣א לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֛וֹד תְּפוּצֶ֥ינָה עָרַ֖/י מִ/טּ֑וֹב וְ/נִחַ֨ם יְהוָ֥ה עוֹד֙ אֶת צִיּ֔וֹן וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/017.yaml
  text: 'Call out again[a], saying, ‘Thus says Yahweh of hosts: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem.’'
translation:
  language: fr
  text: 'Proclame encore : « Voici ce que dit Yahweh des armées : Mes villes regorgeront de nouveau de prospérité[a] ; Yahweh consolera encore Sion et choisira de nouveau Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’étendront de nouveau grâce aux biens reçus », ou « abonderont de nouveau en biens ».
    reason: Le sens de תְּפוּצֶינָה avec מִטּוֹב peut évoquer soit l’expansion des villes sous l’effet de la prospérité, soit leur abondance en biens.
lexical_decisions:
- source_word: עוֹד
  choice: encore / de nouveau
  rationale: L’adverbe répété marque le renouvellement de la proclamation, de la prospérité et de l’action divine après le jugement. La variation française évite une répétition pesante tout en conservant ce motif.
- source_word: קְרָא לֵאמֹר
  choice: 'Proclame encore :'
  rationale: L’impératif appelle à une annonce publique. Les deux-points rendent naturellement en français la formule hébraïque d’introduction au discours sans reproduire inutilement le littéral « en disant ».
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique claire et naturelle en français moderne, équivalente au tour hébraïque « Ainsi a dit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Dans le titre divin, le terme évoque les forces placées sous le commandement de Yahweh. « Des armées » est intelligible en français moderne.
- source_word: תְּפוּצֶינָה
  choice: regorgeront
  rationale: Avec מִטּוֹב, le verbe décrit ici des villes qui se répandent ou abondent sous l’effet des biens reçus. « Regorgeront » exprime naturellement cette abondance dans le contexte de restauration, tandis qu’une note conserve l’image possible de l’expansion.
- source_word: עָרַי
  choice: Mes villes
  rationale: 'Le suffixe de première personne est explicitement conservé : les villes sont présentées comme appartenant à Yahweh.'
- source_word: מִטּוֹב
  choice: de prospérité
  rationale: טוֹב désigne ici les biens et le bien-être accordés dans la restauration, plutôt que la seule bonté morale abstraite.
- source_word: וְנִחַם
  choice: consolera
  rationale: Dans ce contexte postérieur au jugement, נחם exprime la consolation et le réconfort apportés à Sion.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וּבָחַר
  choice: choisira
  rationale: Rend directement le choix renouvelé de Jérusalem sans préciser davantage la portée théologique de ce choix.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom propre ; sa translittération préserve cette donnée du texte source.
- issue: Le nouveau choix de Jérusalem
  choice: choisira de nouveau Jérusalem
  alternative: accordera de nouveau sa faveur à Jérusalem
  rationale: « Choisira » conserve le langage explicite de בחר et sa tension d’alliance sans le réduire à un simple sentiment favorable ni lui imposer un système doctrinal.
- issue: Image de l’abondance des villes
  choice: regorgeront de nouveau de prospérité
  alternative: s’étendront de nouveau grâce à la prospérité
  rationale: Le contexte permet de comprendre le verbe soit comme abondance, soit comme expansion. Le texte principal privilégie une formulation française naturelle, et la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation prophétique reste solennelle sans archaïsme ; les répétitions significatives de עוֹד sont préservées, avec une légère variation idiomatique entre « encore » et « de nouveau ».
