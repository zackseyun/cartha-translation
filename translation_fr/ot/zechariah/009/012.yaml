id: ZEC.9.12
reference: Zechariah 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שׁ֚וּבוּ לְ/בִצָּר֔וֹן אֲסִירֵ֖י הַ/תִּקְוָ֑ה גַּם הַ/יּ֕וֹם מַגִּ֥יד מִשְׁנֶ֖ה אָשִׁ֥יב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/012.yaml
  text: Return to the stronghold[a], prisoners of hope[b]; even today I declare that I will restore double to you.
translation:
  language: fr
  text: 'Revenez à la forteresse, prisonniers de l’espérance[a] ! Aujourd’hui encore, je l’annonce : je te rendrai le double[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « captifs de l’espérance ». L’expression hébraïque est métaphorique : elle peut évoquer des personnes encore retenues, mais liées à l’espérance et soutenues par elle.'
    reason: lexical_alternative
  - marker: b
    text: Ou « je te rendrai une double part » ou « je te dédommagerai au double ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Revenez
  rationale: L’impératif pluriel de שוב peut évoquer à la fois un retour concret et un retour à Dieu, sans qu’il soit nécessaire de trancher entre ces nuances.
- source_word: לְבִצָּרוֹן
  choice: à la forteresse
  rationale: בצרון désigne un lieu fortifié. « Forteresse » conserve l’image concrète tout en laissant ouverte sa portée prophétique.
- source_word: אֲסִירֵי הַתִּקְוָה
  choice: prisonniers de l’espérance
  rationale: Cette construction signifie littéralement « prisonniers de l’espérance ». La formulation française préserve la métaphore saisissante, sans la réduire à de simples prisonniers pleins d’espoir.
- source_word: גַּם הַיּוֹם
  choice: Aujourd’hui encore
  rationale: Cette expression rend naturellement l’insistance et l’immédiateté de l’hébreu.
- source_word: מַגִּיד
  choice: je l’annonce
  rationale: Le participe employé dans cette déclaration est rendu par un présent français. Le pronom « l’ » renvoie à la promesse énoncée ensuite sans lui ajouter de contenu.
- source_word: מִשְׁנֶה
  choice: le double
  rationale: מִשְׁנֶה peut désigner le double ou une double part. « Le double » reste concis et conserve l’absence d’objet explicite dans l’hébreu.
- source_word: אָשִׁיב לָךְ
  choice: je te rendrai
  rationale: Le hifil de שוב exprime ici une restitution. « Te » maintient le singulier féminin de l’adresse hébraïque, probablement dirigée vers Sion ou Jérusalem personnifiée, sans l’expliciter dans le texte.
theological_decisions:
- issue: Référent du pronom singulier féminin לָךְ
  choice: Maintenir l’adresse au singulier par « te » sans nommer son destinataire.
  alternative: Employer « vous » en comprenant que la promesse s’adresse directement aux prisonniers mentionnés au pluriel.
  rationale: Le suffixe hébreu est féminin singulier et renvoie vraisemblablement à Sion ou Jérusalem personnifiée dans le contexte. Le singulier préserve cette donnée grammaticale et le changement d’adresse du texte, sans imposer explicitement le référent.
- issue: Nature du « double » promis
  choice: Conserver « le double » sans préciser s’il s’agit d’une restitution, d’une compensation ou d’une double part.
  alternative: Traduire « une double part » ou « je te dédommagerai au double ».
  rationale: Le contexte annonce un renversement favorable, mais l’hébreu ne précise pas l’objet ni la nature exacte du double. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Revenez » et l’exclamation gardent la force de l’appel prophétique. Le passage du pluriel « prisonniers » au singulier « te » reproduit délibérément la grammaire hébraïque et son adresse probablement personnifiée.
