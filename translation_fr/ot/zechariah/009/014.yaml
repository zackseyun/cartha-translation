id: ZEC.9.14
reference: Zechariah 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יהוָה֙ עֲלֵי/הֶ֣ם יֵֽרָאֶ֔ה וְ/יָצָ֥א כַ/בָּרָ֖ק חִצּ֑/וֹ וַֽ/אדֹנָ֤/י יְהֹוִה֙ בַּ/שּׁוֹפָ֣ר יִתְקָ֔ע וְ/הָלַ֖ךְ בְּ/סַעֲר֥וֹת תֵּימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/014.yaml
  text: Then Yahweh will appear over them[a], and his arrow will go out like lightning[b]; and the Lord GOD will sound the trumpet and march in the whirlwinds of the south.
translation:
  language: fr
  text: Alors Yahweh apparaîtra au-dessus d’eux, et sa flèche jaillira comme l’éclair. Le Seigneur Yahweh sonnera du cor[a] et s’avancera dans les tourbillons du sud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne le shofar, un cor généralement fait d’une corne de bélier et utilisé notamment comme signal militaire ou cérémoniel.
    reason: cultural_note
  - marker: b
    text: 'Ou : « dans les tourbillons de Témân ». Le terme hébreu peut désigner le sud ou le lieu appelé Témân.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: עֲלֵיהֶם יֵרָאֶה
  choice: apparaîtra au-dessus d’eux
  rationale: Le nifal de ראה signifie naturellement « apparaître »; « au-dessus d’eux » conserve la valeur spatiale de עַל sans déterminer explicitement le référent de « eux ».
- source_word: וְיָצָא כַבָּרָק חִצּוֹ
  choice: sa flèche jaillira comme l’éclair
  rationale: « Jaillira » rend avec naturel le mouvement de sortie de la flèche et la soudaineté de l’image, tandis que la comparaison avec l’éclair reste explicite.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend les deux éléments du texte hébreu, le titre אֲדֹנָי et le nom divin יְהוָה, sans employer une graphie typographique qui ferait disparaître le second.
- source_word: בַּשּׁוֹפָר יִתְקָע
  choice: sonnera du cor
  rationale: Le שׁוֹפָר est un cor, généralement de bélier, servant notamment de signal militaire ou cérémoniel; « sonner du cor » est idiomatique en français.
- source_word: וְהָלַךְ
  choice: s’avancera
  rationale: Dans cette scène guerrière, le verbe « aller » évoque une progression; « s’avancera » exprime ce mouvement sans ajouter l’idée plus précise d’une marche au pas.
- source_word: בְּסַעֲרוֹת תֵימָן
  choice: dans les tourbillons du sud
  rationale: סְעָרוֹת désigne des tempêtes ou vents tourbillonnants. תֵימָן peut signifier « sud » ou être le nom propre Témân; le sens directionnel convient au texte principal, et l’autre lecture est signalée en note.
theological_decisions:
- issue: Forme française des noms divins יְהוָה et אֲדֹנָי יְהוִה
  choice: Yahweh… le Seigneur Yahweh
  alternative: le SEIGNEUR… le Seigneur DIEU
  rationale: Cette formulation distingue le nom personnel du titre et représente les deux termes de l’expression אֲדֹנָי יְהוִה.
- issue: Référent du pronom dans עֲלֵיהֶם
  choice: Conserver simplement « eux »
  alternative: Préciser « son peuple » ou « ses ennemis »
  rationale: Le contexte favorise le peuple de Dieu, mais la phrase hébraïque ne nomme pas son référent; la traduction préserve donc cette ouverture.
- issue: Interprétation de תֵימָן
  choice: le sud dans le texte principal
  alternative: Témân
  rationale: Le mot peut désigner soit le point cardinal, soit la région ou le lieu nommé Témân. L’imagerie météorologique soutient « sud », sans exclure le nom propre.
translation_notes:
  register: Français international moderne, digne et imagé. La syntaxe reste proche de la progression hébraïque, avec des verbes naturels en français. Les marqueurs [a] et [b] sont placés exactement sur les expressions qu’ils éclairent.
