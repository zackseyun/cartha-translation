  text: וְֽ/הוֹשִׁיעָ֞/ם יְהוָ֧ה אֱלֹהֵי/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/צֹ֣אן עַמּ֑/וֹ כִּ֚י אַבְנֵי נֵ֔זֶר מִֽתְנוֹסְס֖וֹת עַל אַדְמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/016.yaml
  text: And Yahweh their God will save them on that day as the flock of his people[b][a], for they will sparkle like the stones of a crown over his land.
translation:
  language: fr
  text: Et Yahvé, leur Dieu, les sauvera en ce jour-là, comme le troupeau de son peuple, car ils resplendiront[b] comme les pierres d’une couronne[a] sur sa terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les pierres d’une couronne ». Le mot hébreu traduit par « couronne » peut aussi évoquer un diadème ou la consécration.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « seront élevés comme les pierres d’une couronne ». Le verbe hébreu peut évoquer ce qui est levé ou déployé bien en vue, et pas seulement le scintillement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיעָם
  choice: Et … les sauvera
  rationale: Le hiphil de ישׁע exprime ici le salut ou la délivrance. « Sauvera » conserve toute l’ampleur du terme sans le limiter à une victoire militaire.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Rend directement le construit accompagné du suffixe pronominal et préserve la relation d’alliance.
- source_word: בַּיּוֹם הַהוּא
  choice: en ce jour-là
  rationale: Formulation française naturelle et consacrée dans le discours prophétique.
- source_word: כְּצֹאן עַמּוֹ
  choice: comme le troupeau de son peuple
  rationale: Préserve la construction hébraïque et l’image pastorale collective, sans décider si la comparaison porte principalement sur le peuple ou sur la manière dont Dieu le sauve.
- source_word: כִּי
  choice: car
  rationale: Marque naturellement en français le lien explicatif avec la proposition précédente.
- source_word: אַבְנֵי נֵזֶר
  choice: les joyaux d’une couronne
  rationale: Dans cette image poétique, les pierres d’un diadème sont naturellement comprises comme ses joyaux. La traduction littérale et la nuance possible de consécration sont signalées en note.
- source_word: מִתְנוֹסְסוֹת
  choice: seront mis en évidence
  rationale: Le participe de נסס évoque vraisemblablement ce qui est élevé, déployé ou exposé de manière visible. Cette formulation conserve cette idée plus sûrement qu’un simple verbe de scintillement, tout en laissant la splendeur être portée par l’image des joyaux.
- source_word: עַל אַדְמָתוֹ
  choice: sur sa terre
  rationale: אדמה désigne le sol ou la terre. « Sa terre » convient au contexte de restauration et conserve le suffixe masculin singulier, dont le référent le plus proche est Yahvé.
theological_decisions:
- issue: Portée de la comparaison « comme le troupeau de son peuple »
  choice: Conserver une formulation qui permet de comprendre les personnes sauvées comme le troupeau appartenant à Dieu.
  alternative: 'Comprendre l’expression adverbialement : Dieu les sauvera comme on sauve un troupeau.'
  rationale: La syntaxe poétique autorise une certaine souplesse. La formulation retenue ne transforme pas explicitement l’une des lectures en interprétation exclusive.
- issue: Image des pierres de couronne
  choice: Comprendre le peuple sauvé comme des joyaux de couronne exposés avec éclat sur la terre de Dieu.
  alternative: Y voir des pierres élevées comme un étendard, des pierres commémoratives ou des pierres consacrées.
  rationale: Le contexte de splendeur favorise l’image des joyaux, mais נֵזֶר peut être associé à la consécration et מִתְנוֹסְסוֹת à l’élévation ou au déploiement. Les notes conservent ces possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. Le vers conserve le parallélisme poétique et les images du troupeau et de la couronne. Les marqueurs de note sont placés à la fin de la proposition concernée afin de ne pas interrompre la lecture.
