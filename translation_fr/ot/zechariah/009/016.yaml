  to: Et Yahvé, leur Dieu, les sauvera en ce jour-là, comme le troupeau de son peuple, car ils resplendiront[b] comme les pierres d’une couronne[a] sur sa terre.
  rationale: La révision restaure l’image concrète des « pierres » et choisit « resplendiront », qui convient au contexte poétique tout en laissant la nuance d’élévation/exposition explicitement accessible en note. Les ancres sont déplacées auprès des mots qu’elles éclairent.
