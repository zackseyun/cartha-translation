    rationale: Le verbe peut effectivement évoquer une élévation ou une exposition visible, mais, dans ce contexte, une traduction comme « resplendiront » rend plus directement la valeur poétique dominante sans supprimer l’alternative dans une note.
  - severity: low
    issue: « Joyaux d’une couronne » explicite « pierres d’une couronne ».
    rationale: L’explicitation est plausible, mais le texte hébreu laisse ouverte la possibilité de pierres de diadème ou, plus marginalement, de pierres consacrées. La formulation littérale préserve mieux cette amplitude.
