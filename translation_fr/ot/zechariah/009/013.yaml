    et je l’ai rempli d’Éphraïm.

    Je soulèverai tes fils, Sion,

    contre tes fils, Grèce[a],

    et je ferai de toi une épée de guerrier.'
  rationale: 'La révision conserve la structure poétique, les temps verbaux et l’ambiguïté de l’image de Juda et d’Éphraïm. Elle remplace deux choix français moins précis ou moins naturels : « soulever » restitue mieux l’idée de susciter les fils de Sion pour l’affrontement, et « remplir » évite de définir au-delà du texte la fonction exacte d’Éphraïm dans la métaphore. La note et son ancre sont conservées.'
