  text: כִּֽי דָרַ֨כְתִּי לִ֜/י יְהוּדָ֗ה קֶ֚שֶׁת מִלֵּ֣אתִי אֶפְרַ֔יִם וְ/עוֹרַרְתִּ֤י בָנַ֨יִ/ךְ֙ צִיּ֔וֹן עַל בָּנַ֖יִ/ךְ יָוָ֑ן וְ/שַׂמְתִּ֖י/ךְ כְּ/חֶ֥רֶב גִּבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/013.yaml
  text: For I have bent Judah as my bow; I have filled it with Ephraim. I will stir up your sons[a], Zion, against your sons, Greece, and make you like a warrior’s sword.
translation:
  language: fr
  text: 'Car j’ai bandé Juda comme mon arc,

    et je l’ai rempli d’Éphraïm.

    Je soulèverai tes fils, Sion,

    contre tes fils, Grèce[a],

    et je ferai de toi une épée de guerrier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yavân », nom traditionnel désignant les peuples et le monde grecs.'
    reason: La note conserve le nom propre hébreu derrière la traduction moderne « Grèce ».
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de la promesse précédente et marque naturellement ce lien en français.
- source_word: דָרַכְתִּי לִי יְהוּדָה קֶשֶׁת
  choice: j’ai bandé Juda comme mon arc
  rationale: Avec קֶשֶׁת, le verbe דָרַךְ désigne l’action de bander un arc. Le possessif « mon » rend naturellement le datif לִי et l’image fait de Juda l’arc de Dieu.
- source_word: מִלֵּאתִי אֶפְרַיִם
  choice: je l’ai garni d’Éphraïm
  rationale: Le pronom renvoie à l’arc évoqué juste avant. « Garni » conserve l’image de l’arc préparé pour le combat sans préciser au-delà de l’hébreu si Éphraïm représente strictement la flèche.
- source_word: וְעוֹרַרְתִּי
  choice: Je dresserai
  rationale: Le verbe exprime ici la mise en mouvement en vue du combat. Le futur rend la progression prophétique après les actes préparatoires présentés comme accomplis.
- source_word: בָנַיִךְ צִיּוֹן
  choice: tes fils, Sion
  rationale: Le suffixe féminin singulier s’adresse à Sion personnifiée comme une mère. « Fils » préserve le parallélisme et la dimension guerrière.
- source_word: עַל בָּנַיִךְ יָוָן
  choice: contre tes fils, Grèce[a]
  rationale: יָוָן désigne Yavân, puis le monde grec. « Grèce » rend clairement le référent historique moderne, tandis que la note conserve le nom hébreu traditionnel.
- source_word: וְשַׂמְתִּיךְ
  choice: et je ferai de toi
  rationale: Cette formulation française rend naturellement le résultat exprimé par שׂוּם sans introduire une identité métaphysique dans la comparaison.
- source_word: כְּחֶרֶב גִּבּוֹר
  choice: l’épée d’un guerrier
  rationale: גִּבּוֹר désigne ici un homme vaillant, particulièrement un guerrier. La tournure conserve la vigueur de l’image martiale.
theological_decisions:
- issue: Référent et traduction de יָוָן
  choice: Grèce
  alternative: Yavân
  rationale: Dans ce contexte, le nom désigne le monde grec. « Grèce » est immédiatement intelligible, tandis qu’une note signale la forme traditionnelle « Yavân » afin de ne pas effacer la donnée onomastique hébraïque.
- issue: Valeur temporelle des formes verbales dans le discours prophétique
  choice: Passé composé pour la préparation (« j’ai bandé », « j’ai garni »), puis futur pour la mobilisation (« je dresserai », « je ferai »)
  alternative: Tout traduire au futur, ou tout présenter comme déjà accompli
  rationale: Ce choix maintient le mouvement rhétorique entre la préparation divine présentée comme accomplie et l’action guerrière annoncée, sans rigidifier la valeur des parfaits prophétiques.
- issue: Identification précise d’Éphraïm dans l’image de l’arc
  choice: Conserver l’image générale avec « je l’ai garni d’Éphraïm »
  alternative: Expliciter qu’Éphraïm est la flèche
  rationale: Le contexte suggère qu’Éphraïm complète ou arme l’arc formé par Juda, mais le texte hébreu ne nomme pas explicitement une flèche. La traduction évite donc de résoudre cette image plus précisément que la source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique et les images guerrières sont conservés. Les apostrophes à Sion et à la Grèce restent explicites, sans ajout d’une interprétation confessionnelle.
