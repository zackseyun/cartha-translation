review_pass:
  verdict: revise
  source_fidelity: Le texte français rend correctement la séquence et les images du texte hébreu. Toutefois, le parfait français « aura été déçu » introduit inutilement une antériorité par rapport aux futurs qui l’entourent; le yiqtol hifil הֹבִישׁ se rend plus directement par un futur passif (« sera couvert de honte » / « sera déçu »).
  naturalness: 'La formulation est globalement naturelle et de registre prophétique. « Se tordra de douleur » est vivant et juste pour חול/חיל. « Prendra peur » est acceptable, mais « sera saisie de peur » restitue avec davantage de dignité la cadence du verset. La note actuelle est grammaticalement ambiguë: « ce qu’elle attendait l’a couverte de honte » fait de l’attente le sujet causatif, tandis que l’hébreu dit que l’objet de l’attente a été honteux/déçu.'
  terminology: Les noms Ashkelon, Gaza et Éqrôn sont recevables en français; « Éqrôn » est une translittération cohérente. « Un roi » respecte l’absence d’article en hébreu. « Disparaîtra » est possible pour אָבַד, mais « périra » est plus direct dans ce contexte d’oracle de jugement, sans excéder le sens du verbe.
  issues:
  - severity: medium
    issue: Temps verbal de « aura été déçu »
    rationale: Le parfait français marque une action achevée antérieure à un repère futur implicite. L’imparfait hébreu הֹבִישׁ s’inscrit dans la série des annonces au futur; « sera déçu » ou « sera couvert de honte » préserve mieux cette cohérence.
  - severity: medium
    issue: Sens et syntaxe de la note a
    rationale: 'La note actuelle inverse ou brouille le rapport syntaxique: מַבָּטָהּ (« son attente / ce vers quoi elle regardait ») est le sujet de הֹבִישׁ, et la construction exprime que cette attente est honteuse, mise à honte ou déçue. Une note doit refléter cette relation sans faire de l’attente l’agent qui couvre Éqrôn de honte.'
  revised_text: Ashkelon le verra et sera saisie de peur ; Gaza se tordra de douleur, et Éqrôn aussi, car son espoir sera couvert de honte.[a] Un roi périra de Gaza, et Ashkelon ne sera plus habitée.
  revised_footnotes:
