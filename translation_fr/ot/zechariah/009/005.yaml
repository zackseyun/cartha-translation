base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/005.yaml
  text: Ashkelon will see and fear[a]; Gaza also will writhe greatly, and Ekron, because her hope has been put to shame. A king will perish from Gaza[b], and Ashkelon will not be inhabited.
translation:
  language: fr
  text: Ashkelon le verra et sera saisie de peur ; Gaza se tordra de douleur, et Éqrôn aussi, car son espoir sera couvert de honte.[a] Un roi périra de Gaza, et Ashkelon ne sera plus habitée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car son attente sera déçue » ; littéralement, « car ce vers quoi elle regardait sera couvert de honte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרֶא אַשְׁקְלוֹן וְתִירָא
  choice: Ashkelon le verra et prendra peur
  rationale: Le qal imparfait de ראה a Ashkelon pour sujet féminin singulier. Le pronom « le » explicite en français l’objet sous-entendu par le contexte, tandis que « prendra peur » rend naturellement la réaction exprimée par ירא.
- source_word: וְעַזָּה וְתָחִיל מְאֹד
  choice: Gaza se tordra de douleur
  rationale: חיל peut évoquer le tremblement, les douleurs de l’accouchement ou une vive angoisse. Cette formulation conserve la force physique du verbe et rattache naturellement Gaza à celui-ci.
- source_word: וְעֶקְרוֹן כִּי הֹבִישׁ מֶבָּטָהּ
  choice: et Éqrôn aussi, car son espoir aura été déçu
  rationale: מבט désigne ici ce vers quoi l’on regarde avec attente, donc l’espoir. Le hiphil de בוש exprime l’échec honteux ou la déception de cette attente ; « aura été déçu » est idiomatique et préserve ce sens.
- source_word: וְאָבַד מֶלֶךְ מֵעַזָּה
  choice: Un roi disparaîtra de Gaza
  rationale: Le nom מֶלֶךְ est sans article. אבד peut signifier périr ou disparaître ; avec מִן, la tournure annonce la disparition de la royauté à Gaza sans imposer que le roi meure nécessairement.
- source_word: וְאַשְׁקְלוֹן לֹא תֵשֵׁב
  choice: Ashkelon ne sera plus habitée
  rationale: Avec une ville pour sujet, ישב signifie couramment « être habitée ». « Ne sera plus habitée » exprime naturellement la cessation annoncée.
- source_word: אַשְׁקְלוֹן / עַזָּה / עֶקְרוֹן
  choice: Ashkelon / Gaza / Éqrôn
  rationale: Les toponymes sont translittérés selon des formes françaises reconnaissables ; « Éqrôn » rend plus directement les consonnes hébraïques tout en restant lisible.
