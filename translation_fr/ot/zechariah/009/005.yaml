revisions:
- from: Ashkelon le verra et prendra peur ; Gaza se tordra de douleur, et Éqrôn aussi, car son espoir aura été déçu.[a] Un roi disparaîtra de Gaza, et Ashkelon ne sera plus habitée.
  to: Ashkelon le verra et sera saisie de peur ; Gaza se tordra de douleur, et Éqrôn aussi, car son espoir sera couvert de honte.[a] Un roi périra de Gaza, et Ashkelon ne sera plus habitée.
  rationale: La révision maintient l’objet implicite de « le verra », l’angoisse physique de Gaza et l’indétermination de l’objet de l’espoir d’Éqrôn. Elle aligne les temps français sur la série prophétique hébraïque et corrige la note afin qu’elle exprime fidèlement la relation entre « attente » et « être couvert de honte ».
