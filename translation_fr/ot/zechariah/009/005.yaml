    text: 'Ou : « car son attente sera déçue » ; littéralement, « car ce vers quoi elle regardait sera couvert de honte ».'
    reason: lexical_alternative
  revision_rationale: La révision maintient l’objet implicite de « le verra », l’angoisse physique de Gaza et l’indétermination de l’objet de l’espoir d’Éqrôn. Elle aligne les temps français sur la série prophétique hébraïque et corrige la note afin qu’elle exprime fidèlement la relation entre « attente » et « être couvert de honte ».
