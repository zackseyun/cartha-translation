- from: 'Proclamation : la parole de Yahweh est dirigée contre le pays de Hadrak[a], et elle repose sur Damas[b]. Car les regards de l’humanité et de toutes les tribus d’Israël se tournent vers Yahweh[c].'
  to: 'Oracle : la parole de Yahweh est dirigée contre le pays de Hadrach[a], et Damas est son lieu de repos[b]. Car le regard de l’humanité et de toutes les tribus d’Israël est tourné vers Yahweh[c].'
  rationale: La révision rétablit la structure nominale de la clause relative à Damas, maintient explicitement l’ambiguïté du suffixe par « son », conserve le singulier collectif de « œil/regard », et adopte la graphie française usuelle « Hadrach ». Les notes préservent les lectures alternatives attestées sans les présenter comme certaines.
