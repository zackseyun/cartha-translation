source:
  edition: WLC
  text: מַשָּׂ֤א דְבַר יְהוָה֙ בְּ/אֶ֣רֶץ חַדְרָ֔ךְ וְ/דַמֶּ֖שֶׂק מְנֻחָת֑/וֹ כִּ֤י לַֽ/יהוָה֙ עֵ֣ין אָדָ֔ם וְ/כֹ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/001.yaml
  text: 'An oracle: the word of Yahweh is against the land of Hadrach[a], and Damascus is its resting place[d][c][b]; for the eye of man and of all the tribes of Israel is toward Yahweh.'
translation:
  language: fr
  text: 'Oracle : la parole de Yahweh est dirigée contre le pays de Hadrach[a], et Damas est son lieu de repos[b]. Car le regard de l’humanité et de toutes les tribus d’Israël est tourné vers Yahweh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « concernant le pays de Hadrach » ou, plus littéralement, « dans le pays de Hadrach ».'
    reason: La préposition hébraïque signifie ordinairement « dans », mais elle peut introduire ici la cible ou le sujet de l’oracle.
  - marker: b
    text: 'Littéralement : « Damas est son lieu de repos ». Le suffixe masculin singulier peut renvoyer à la parole ou à Yahweh ; le texte hébreu ne précise pas clairement son antécédent.'
    reason: La référence du suffixe est ambiguë en hébreu et doit rester ouverte dans la traduction.
  - marker: c
    text: 'Autre compréhension possible : « car Yahweh porte son regard sur l’humanité et sur toutes les tribus d’Israël ». L’hébreu est elliptique.'
    reason: La syntaxe condensée permet soit de comprendre que le regard humain est tourné vers Yahweh, soit que le regard de Yahweh est posé sur les humains et Israël.
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans un titre prophétique, le terme désigne une déclaration solennelle, souvent menaçante. « Proclamation » est naturel en français actuel sans imposer le sens étymologique discuté de « fardeau ».
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Rend directement la formule prophétique et conserve le nom divin exprimé dans le texte hébreu.
- source_word: בְּאֶרֶץ חַדְרָךְ
  choice: est dirigée contre le pays de Hadrak
  rationale: La préposition ב signifie normalement « dans », mais peut désigner ici la cible de la proclamation. « Est dirigée contre » restitue naturellement cette valeur dans le contexte d’un jugement, tandis que la note conserve la lecture plus littérale.
- source_word: מְנֻחָתוֹ
  choice: elle repose sur
  rationale: Le nom מְנוּחָה évoque le repos ou le lieu où quelque chose vient se poser. Le pronom « elle » renvoie ici à « la parole », antécédent féminin naturel en français, sans transformer la métaphore en simple localisation.
- source_word: לַיהוָה עֵין אָדָם
  choice: les regards de l’humanité se tournent vers Yahweh
  rationale: La formulation hébraïque est elliptique. Cette traduction comprend ל comme indiquant l’orientation et rend idiomatiquement le singulier collectif « œil de l’être humain ».
- source_word: וְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: et de toutes les tribus d’Israël
  rationale: Le complément est coordonné à « l’humanité » sous le même terme « regards », ce qui étend explicitement l’orientation vers Yahweh à toutes les tribus d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; « Yahweh » le distingue d’un simple titre et suit la couche de consultation fournie.
- issue: Sens générique de אָדָם
  choice: l’humanité
  alternative: l’être humain / l’homme
  rationale: Dans ce contexte, אָדָם paraît désigner collectivement les humains. « L’humanité » exprime clairement ce sens générique en français moderne sans le limiter aux hommes de sexe masculin.
- issue: Orientation des regards ou regard de Yahweh
  choice: les regards … se tournent vers Yahweh
  alternative: Yahweh porte son regard sur l’humanité et sur toutes les tribus d’Israël
  rationale: L’hébreu est fortement condensé et admet les deux analyses. Le texte principal retient l’œil humain orienté vers Yahweh, lecture compatible avec l’ordre des mots; la note préserve l’autre interprétation sans trancher silencieusement.
translation_notes:
  register: Français international actuel, digne et accessible. La métaphore du repos est maintenue, les noms Hadrak et Damas suivent les formes françaises usuelles, et les ambiguïtés syntaxiques majeures sont signalées en notes.
