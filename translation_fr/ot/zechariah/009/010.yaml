source:
  edition: WLC
  text: וְ/הִכְרַתִּי רֶ֣כֶב מֵ/אֶפְרַ֗יִם וְ/סוּס֙ מִ/יר֣וּשָׁלִַ֔ם וְ/נִכְרְתָה֙ קֶ֣שֶׁת מִלְחָמָ֔ה וְ/דִבֶּ֥ר שָׁל֖וֹם לַ/גּוֹיִ֑ם וּ/מָשְׁל/וֹ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/נָּהָ֖ר עַד אַפְסֵי אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/010.yaml
  text: And I will cut off the chariot from Ephraim and the horse from Jerusalem[a], and the battle bow will be cut off; and he will speak peace to the nations, and his dominion will be from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: fr
  text: Je retrancherai d’Éphraïm les chars et de Jérusalem les chevaux, et l’arc de guerre sera retranché. Il annoncera la paix aux nations, et sa domination s’étendra d’une mer à l’autre, et du Fleuve[a] jusqu’aux extrémités de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Fleuve » désigne probablement l’Euphrate.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Je retrancherai
  rationale: Le hiphil de כרת signifie ici supprimer ou éliminer. « Retrancher » conserve la force concrète du verbe ainsi que sa reprise dans la proposition suivante.
- source_word: רֶכֶב
  choice: les chars
  rationale: Le singulier hébreu a une valeur collective et désigne les forces de chars; le pluriel est naturel et clair en français.
- source_word: מֵאֶפְרַיִם
  choice: d’Éphraïm
  rationale: Éphraïm représente ici le territoire ou le royaume du Nord; la formulation reste directe et préserve la référence géopolitique.
- source_word: וְסוּס מִירוּשָׁלִַם
  choice: et de Jérusalem les chevaux
  rationale: Le singulier collectif désigne vraisemblablement la cavalerie ou les chevaux de guerre. Le pluriel français rend naturellement cette valeur collective sans ajouter « de guerre », implicite dans le contexte.
- source_word: וְנִכְרְתָה
  choice: sera retranché
  rationale: Le passif reprend la même racine que « Je retrancherai »; maintenir « retranché » préserve cette répétition intentionnelle.
- source_word: קֶשֶׁת מִלְחָמָה
  choice: l’arc de guerre
  rationale: Cette traduction reproduit simplement la construction hébraïque et conserve l’image de l’arme militaire.
- source_word: וְדִבֶּר שָׁלוֹם
  choice: Il annoncera la paix
  rationale: Dans ce contexte royal, le piel de דבר peut signifier déclarer ou proclamer. « Annoncera la paix » est idiomatique en français tout en conservant la paix comme contenu de la parole.
- source_word: לַגּוֹיִם
  choice: aux nations
  rationale: גוים désigne largement les peuples ou nations; « nations » convient à la portée universelle du passage sans introduire le sens technique ultérieur de « païens ».
- source_word: וּמָשְׁלוֹ
  choice: sa domination s’étendra
  rationale: Le mot est un nom avec suffixe possessif, « sa domination ». Le verbe « s’étendra » rend naturellement en français l’étendue géographique exprimée par les compléments suivants.
- source_word: מִיָּם עַד יָם
  choice: d’une mer à l’autre
  rationale: Cette tournure française naturelle conserve l’idiome hébreu exprimant une domination très étendue.
- source_word: וּמִנָּהָר
  choice: et du Fleuve
  rationale: « Le Fleuve » est une désignation géographique conventionnelle qui renvoie probablement à l’Euphrate; la majuscule préserve ce raccourci biblique sans l’expliciter dans le texte.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: jusqu’aux extrémités de la terre
  rationale: La formule française rend fidèlement l’expression hébraïque et son horizon universel.
theological_decisions:
- issue: Référent de la troisième personne dans « Il annoncera » et « sa domination »
  choice: La troisième personne renvoie au roi annoncé au verset précédent.
  alternative: Employer une formulation impersonnelle, telle que « la paix sera annoncée » ou « la domination s’étendra ».
  rationale: Le passage du discours divin à la première personne (« Je retrancherai ») à la troisième personne du singulier renvoie naturellement au roi de Zacharie 9.9. Les pronoms personnels maintiennent ce portrait royal sans y importer de précision doctrinale ultérieure.
- issue: Étendue du règne du roi
  choice: Conserver la portée universelle des deux expressions géographiques.
  alternative: Comprendre ces expressions comme l’hyperbole d’un règne seulement régional.
  rationale: Le parallélisme « d’une mer à l’autre » et « du Fleuve jusqu’aux extrémités de la terre » présente délibérément une domination d’une très grande ampleur. La traduction préserve cette tension sans préciser le mode de son accomplissement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme militaire est conservé, de même que le changement de sujet entre Dieu (« Je ») et le roi (« Il »). Le pluriel « chars » et « chevaux » explicite en français la valeur collective des singuliers hébreux.
