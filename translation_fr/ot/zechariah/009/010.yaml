  source_fidelity: 'Le texte rend fidèlement la succession des sujets et des actions : YHWH parle à la première personne (« Je retrancherai »), puis le roi est désigné à la troisième personne (« Il », « sa domination »). Les collectifs hébreux sont naturellement rendus par les pluriels français « les chars » et « les chevaux ». La répétition de la racine כרַת est bien conservée par « retrancherai / sera retranché », et les deux formules géographiques gardent leur ampleur universelle.'
  naturalness: Le français est moderne, clair et soutenu sans être excessivement archaïsant. « D’une mer à l’autre » et « jusqu’aux extrémités de la terre » sont idiomatiques dans ce registre. La construction « de Jérusalem les chevaux » suit le parallélisme du verset et reste intelligible.
  terminology: « Arc de guerre », « paix », « nations » et « domination » sont appropriés au contexte royal et prophétique. « Le Fleuve », avec majuscule et note explicative prudente, préserve la désignation géographique conventionnelle sans imposer l’identification dans le corps du texte.
