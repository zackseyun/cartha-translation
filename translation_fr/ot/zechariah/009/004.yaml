id: ZEC.9.4
reference: Zechariah 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֤ה אֲדֹנָ/י֙ יֽוֹרִשֶׁ֔/נָּה וְ/הִכָּ֥ה בַ/יָּ֖ם חֵילָ֑/הּ וְ/הִ֖יא בָּ/אֵ֥שׁ תֵּאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/004.yaml
  text: Behold[a], the Lord will dispossess her and strike her wealth into the sea, and she will be consumed by fire.
translation:
  language: fr
  text: Voici, le Seigneur la dépossédera ; il précipitera ses richesses[a] dans la mer, et elle sera dévorée par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa force », « son armée » ou « sa puissance » ; le terme hébreu peut désigner les richesses, les ressources ou la puissance militaire. Ici, « richesses » correspond au contexte immédiat, qui évoque les trésors de Tyr au verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force déictique et solennelle de l’annonce prophétique dans un français actuel et digne.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rend le titre divin Adonaï sans le confondre avec le tétragramme.
- source_word: יוֹרִשֶׁנָּה
  choice: la dépossédera
  rationale: Le hiphil de ירש exprime ici l’idée de priver Tyr de ce qu’elle possède ou de prendre possession d’elle, sans préciser excessivement le mode du jugement.
- source_word: וְהִכָּה בַיָּם
  choice: il précipitera … dans la mer
  rationale: Formulation française naturelle qui communique l’abattement violent et le mouvement vers la mer suggérés par le verbe et le contexte, plutôt qu’un calque obscur de « frapper dans la mer ».
- source_word: חֵילָהּ
  choice: ses richesses
  rationale: חַיִל peut désigner les richesses, les ressources, la force ou l’armée. La mention de l’argent et de l’or de Tyr au verset précédent favorise ici « richesses », tout en signalant les autres sens possibles en note.
- source_word: וְהִיא
  choice: elle
  rationale: Le pronom féminin renvoie à la ville de Tyr personnifiée et préserve l’image littéraire de l’hébreu.
- source_word: בָּאֵשׁ תֵּאָכֵל
  choice: sera dévorée par le feu
  rationale: Préserve la métaphore du verbe אכל, littéralement « manger, dévorer », couramment employé pour l’action destructrice du feu.
theological_decisions:
- issue: Référent des suffixes et du pronom féminins
  choice: Les formes féminines renvoient à la ville de Tyr, personnifiée par « la » et « elle ».
  alternative: Employer des formulations impersonnelles ou répéter « Tyr ».
  rationale: L’hébreu présente la ville comme une figure féminine. Maintenir cette personnification conserve la force poétique et prophétique sans ajouter d’interprétation doctrinale.
- issue: Portée de חֵילָהּ
  choice: « ses richesses », avec les autres possibilités indiquées en note
  alternative: « sa force », « son armée » ou « sa puissance »
  rationale: Le contexte immédiat met en avant les biens accumulés par Tyr, mais le terme hébreu reste polysémique ; la note préserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et soutenu. « Voici » maintient la solennité prophétique ; « dévorée par le feu » conserve l’image vive de l’hébreu. La ponctuation met en relief les deux volets du jugement.
