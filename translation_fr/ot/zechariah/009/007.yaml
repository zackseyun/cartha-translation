  naturalness: « Ses choses abominables » est compréhensible, mais peu idiomatique en français biblique moderne ; « ses abominations » est à la fois plus naturel et plus proche de la valeur usuelle de שִׁקּוּצִים. « Ékron » est la graphie française courante. « Un Jébusien » reflète plus directement le gentilice hébreu non déterminé.
  terminology: « Abominations » conserve la forte portée cultuelle et d’impureté du terme sans réduire son sens à des aliments. « Chef de clan » rend de manière claire et non surinterprétée אַלּוּף. La note historique sur les Jébusiens doit rester explicitement hypothétique, car la portée précise de la comparaison demeure discutée.
