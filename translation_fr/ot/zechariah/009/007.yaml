base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/007.yaml
  text: I will remove his blood from his mouth and his detestable things from between his teeth[a]. Then he too will be a remnant for our God; he will be like a clan leader in Judah[c][b], and Ekron will be like the Jebusite.
translation:
  language: fr
  text: J’ôterai de sa bouche son sang et d’entre ses dents ses abominations[a]. Lui aussi restera pour notre Dieu[b] ; il sera comme un chef de clan en Juda, et Ékron sera comme un Jébusien[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « abominations » désignent probablement des réalités idolâtres ou rituellement impures, peut-être des aliments liés au culte païen.
    reason: cultural_note
  - marker: b
    text: 'Autres traductions possibles : « lui aussi sera laissé pour notre Dieu » ou « lui aussi fera partie du reste appartenant à notre Dieu ». Le verbe hébreu peut simplement signifier « rester », tout en évoquant le thème prophétique du reste.'
    reason: lexical_alternative
  - marker: c
    text: La comparaison avec un Jébusien peut évoquer une intégration à Juda plutôt que le maintien d’une puissance ennemie distincte. Cette interprétation est souvent rapprochée du lien des Jébusiens avec Jérusalem.
    reason: cross_reference
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: J’ôterai
  rationale: Le hifil de סור exprime ici l’action causative de retirer. « Ôter » est naturel en français et convient aux deux compléments qui suivent.
- source_word: דָמָיו
  choice: son sang
  rationale: La formulation concrète de l’hébreu est conservée sans préciser s’il s’agit de sang consommé dans un rite païen ou d’une autre image de souillure.
- source_word: שִׁקֻּצָיו
  choice: ses choses abominables
  rationale: שִׁקּוּץ désigne ce qui est abominable, souvent dans un cadre idolâtre ou rituel. Cette traduction garde la force du terme sans en restreindre le sens.
- source_word: מִבֵּין שִׁנָּיו
  choice: d’entre ses dents
  rationale: La traduction préserve l’image corporelle frappante du texte hébreu.
- source_word: וְנִשְׁאַר גַּם הוּא
  choice: Lui aussi restera
  rationale: Le nifal de שׁאר peut signifier « rester », « être laissé » ou, selon le contexte prophétique, « subsister comme un reste ». « Restera » conserve cette amplitude sémantique, tandis que la note signale la nuance possible de « reste ».
- source_word: לֵאלֹהֵינוּ
  choice: pour notre Dieu
  rationale: La préposition ל exprime ici une relation d’appartenance ou de destination. La formulation suggère l’intégration au peuple de Dieu sans l’expliciter au-delà du texte.
- source_word: כְּאַלֻּף בִּיהוּדָה
  choice: comme un chef de clan en Juda
  rationale: אַלּוּף désigne vraisemblablement un chef de groupe ou de clan. « Chef de clan » communique clairement ce rang social.
- source_word: וְעֶקְרוֹן כִּיבוּסִי
  choice: et Éqrôn sera comme le Jébusite
  rationale: La comparaison est maintenue sans préciser dans le corps du texte la nature exacte de cette ressemblance.
theological_decisions:
- issue: Statut du Philistin transformé
  choice: Conserver le singulier et le langage de purification suivi d’une relation nouvelle avec « notre Dieu ».
  alternative: Interpréter explicitement le passage comme une simple soumission politique, ou transformer le singulier en collectif désignant toute la Philistie.
  rationale: Le retrait du sang et des choses abominables, puis l’expression « lui aussi » et la relation à Dieu, évoquent une purification et une inclusion. Le singulier hébreu peut avoir une portée représentative, mais il convient de ne pas trancher cette question dans la traduction.
- issue: Nuance de « reste » dans וְנִשְׁאַר
  choice: Employer « restera » dans le texte et signaler en note la nuance prophétique possible de « reste ».
  alternative: Traduire directement « fera partie du reste » ou « sera un reste ».
  rationale: Le verbe signifie d’abord rester ou être laissé, tout en pouvant évoquer le thème prophétique du reste. La formulation retenue préserve cette tension sans imposer une lecture spécialisée.
translation_notes:
  register: Français international moderne, sobre et digne. Les images concrètes de la bouche et des dents sont conservées. Le vocabulaire reste accessible, tandis que les notes rendent compte des ambiguïtés lexicales et historiques.
