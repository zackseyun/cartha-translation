reference: Zechariah 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם אַ֣תְּ בְּ/דַם בְּרִיתֵ֗/ךְ שִׁלַּ֤חְתִּי אֲסִירַ֨יִ/ךְ֙ מִ/בּ֔וֹר אֵ֥ין מַ֖יִם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/011.yaml
  text: As for you also[a], because of the blood of your covenant[b], I have sent out your prisoners from the pit in which there is no water.
translation:
  language: fr
  text: Quant à toi aussi, à cause du sang de ton alliance[a], j’ai fait sortir tes prisonniers de la fosse[b] où il n’y a pas d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le sang de ton alliance ». La préposition hébraïque peut exprimer le moyen aussi bien que la cause.
    reason: lexical_alternative
  - marker: b
    text: La « fosse » peut aussi désigner une citerne ou un cachot, ici un lieu de détention sans eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: Quant à toi aussi
  rationale: Rend l’adresse féminine singulière à Sion/Jérusalem et la valeur additive de גַּם, tout en restant naturel en français.
- source_word: בְּדַם בְּרִיתֵךְ
  choice: à cause du sang de ton alliance
  rationale: Conserve le langage d’alliance et exprime la valeur causale probable de la préposition בְּ, sans exclure sa possible nuance instrumentale.
- source_word: שִׁלַּחְתִּי
  choice: j’ai fait sortir
  rationale: Le parfait à la première personne est rendu par le passé composé; «faire sortir» convient au mouvement hors de la fosse tout en gardant l’idée de libération.
- source_word: אֲסִירַיִךְ
  choice: tes prisonniers
  rationale: Désigne directement des personnes détenues ou liées et correspond à l’image de la fosse servant de lieu de détention.
- source_word: מִבּוֹר
  choice: de la fosse
  rationale: «Fosse» préserve l’étendue métaphorique de בּוֹר; selon le contexte, le terme peut aussi désigner une citerne ou un cachot.
- source_word: אֵין מַיִם בּוֹ
  choice: où il n’y a pas d’eau
  rationale: Rend clairement et naturellement la proposition existentielle hébraïque qui caractérise la fosse.
theological_decisions:
- issue: Sens du «sang de ton alliance»
  choice: Maintenir l’expression d’alliance sans identifier explicitement une alliance précise.
  alternative: Y voir exclusivement une allusion à l’alliance du Sinaï, ou une anticipation typologique de la nouvelle alliance.
  rationale: Le texte évoque le sang qui ratifie une alliance, mais ne précise pas lui-même quel moment d’alliance est visé; la formulation conserve donc la portée et la tension théologiques.
- issue: Valeur de la préposition בְּ devant «sang»
  choice: 'Lecture causale: «à cause du sang».'
  alternative: 'Lecture instrumentale: «par le sang».'
  rationale: La valeur causale présente le sang de l’alliance comme fondement de la délivrance; la valeur instrumentale demeure grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’adresse emphatique du début et l’image concrète de la fosse, sans préciser au-delà de l’hébreu l’identité de l’alliance.
