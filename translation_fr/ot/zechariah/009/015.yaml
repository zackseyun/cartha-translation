source:
  edition: WLC
  text: יְהוָ֣ה צְבָאוֹת֮ יָגֵ֣ן עֲלֵי/הֶם֒ וְ/אָכְל֗וּ וְ/כָֽבְשׁוּ֙ אַבְנֵי קֶ֔לַע וְ/שָׁת֥וּ הָמ֖וּ כְּמוֹ יָ֑יִן וּ/מָֽלְאוּ֙ כַּ/מִּזְרָ֔ק כְּ/זָוִיּ֖וֹת מִזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/015.yaml
  text: The LORD of Armies will shield them, and they will devour and trample the sling stones; they will drink and roar as if with wine, and they will be filled like a bowl, like the corners of the altar.
translation:
  language: fr
  text: Le SEIGNEUR des armées les protégera. Ils dévoreront et piétineront les pierres de fronde ; ils boiront et feront du tumulte comme sous l’effet du vin. Ils seront remplis comme une coupe d’aspersion, comme les angles de l’autel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: le SEIGNEUR des armées
  rationale: Rend le nom divin selon la convention française en petites capitales et conserve le sens militaire de צְבָאוֹת.
- source_word: יָגֵן עֲלֵיהֶם
  choice: les protégera
  rationale: Le verbe גנן évoque l’action de couvrir ou de défendre comme avec un bouclier ; « protéger » est naturel et précis en français.
- source_word: וְכָבְשׁוּ אַבְנֵי קֶלַע
  choice: ils piétineront les pierres de fronde
  rationale: כבש peut signifier soumettre ou fouler ; dans ce contexte guerrier, « piétineront » préserve l’image concrète sans préciser abusivement si les pierres représentent des projectiles ou des ennemis.
- source_word: הָמוּ
  choice: feront du tumulte
  rationale: Le verbe הום indique un grondement, une agitation bruyante ou un tumulte. Cette formulation conserve sa largeur sémantique mieux que « rugiront ».
- source_word: כַמִּזְרָק
  choice: comme une coupe d’aspersion
  rationale: מִזְרָק désigne un récipient cultuel, notamment une coupe utilisée pour recueillir ou répandre le sang sacrificiel ; la précision distingue cet objet d’une coupe ordinaire.
- source_word: כְּזָוִיּוֹת מִזְבֵּחַ
  choice: comme les angles de l’autel
  rationale: Traduction directe de זָוִיּוֹת, probablement les angles ou coins de l’autel, aspergés de sang sacrificiel.
theological_decisions:
- issue: Nature de l’image « pierres de fronde »
  choice: Conserver l’expression littérale sans identifier explicitement les pierres à des ennemis ou à des projectiles neutralisés.
  alternative: « ils vaincront les frondeurs » ou « ils maîtriseront les pierres lancées par la fronde »
  rationale: L’hébreu autorise plusieurs compréhensions de l’image ; la traduction ne doit pas résoudre une ambiguïté que le texte maintient.
- issue: Imagerie du vin et du sang sacrificiel
  choice: Maintenir la transition frappante entre l’ivresse guerrière et les récipients ou angles de l’autel.
  alternative: Expliciter qu’ils seront « pleins de sang »
  rationale: Le sang est fortement suggéré par le contexte cultuel, mais il n’est pas nommé dans ce verset ; l’ajouter au texte principal dépasserait la formulation hébraïque.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est légèrement segmentée pour la lisibilité, tout en conservant la succession énergique des images guerrières et cultuelles du texte hébreu.
