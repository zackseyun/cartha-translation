source:
  edition: WLC
  text: גִּילִ֨י מְאֹ֜ד בַּת צִיּ֗וֹן הָרִ֨יעִי֙ בַּ֣ת יְרוּשָׁלִַ֔ם הִנֵּ֤ה מַלְכֵּ/ךְ֙ יָ֣בוֹא לָ֔/ךְ צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא עָנִי֙ וְ/רֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/009.yaml
  text: Rejoice greatly[a], daughter Zion! Shout in triumph, daughter Jerusalem! Look, your king is coming to you—righteous and victorious is he, humble and riding on a donkey, on a colt[c][b], the foal of a she-donkey.
translation:
  language: fr
  text: 'Réjouis-toi vivement, fille de Sion ! Pousse des cris de triomphe, fille de Jérusalem ! Voici que ton roi vient à toi : il est juste et victorieux[a], humble[b] et monté sur un âne, sur un ânon[c], le petit d’une ânesse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sauvé », « délivré » ou « ayant le salut ». Le terme hébreu peut désigner quelqu’un que Dieu a délivré et qui vient donc en vainqueur.
    reason: alternative_reading
  - marker: b
    text: Ou « pauvre », « affligé » ou « de condition modeste ». Le mot hébreu peut évoquer aussi bien la situation humble d’une personne que son attitude.
    reason: lexical_alternative
  - marker: c
    text: L’expression « sur un âne, sur un ânon, le petit d’une ânesse » relève probablement du parallélisme poétique et décrit un seul animal sous deux angles.
    reason: cultural_note
lexical_decisions:
- source_word: גִּילִי מְאֹד
  choice: Réjouis-toi de toutes tes forces
  rationale: L’impératif féminin singulier s’adresse à la « fille de Sion », et מְאֹד intensifie fortement l’appel à la joie. Cette formulation est naturelle en français moderne et plus expressive que « réjouis-toi beaucoup ».
- source_word: בַּת צִיּוֹן / בַּת יְרוּשָׁלִַם
  choice: fille de Sion / fille de Jérusalem
  rationale: Conserve la personnification poétique de la ville et de son peuple sans l’expliciter.
- source_word: הָרִיעִי
  choice: Pousse des cris de triomphe
  rationale: Le verbe désigne un grand cri, notamment une acclamation joyeuse ou guerrière. Le contexte de l’arrivée royale donne ici à ce cri une valeur triomphale.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Attire vivement l’attention sur l’arrivée du roi tout en gardant un registre actuel et digne.
- source_word: מַלְכֵּךְ יָבוֹא לָךְ
  choice: ton roi vient à toi
  rationale: Le présent français rend l’imminence et la vivacité prophétique de l’imparfait hébreu, tout en conservant le complément directionnel.
- source_word: צַדִּיק
  choice: juste
  rationale: « Juste » exprime en français la rectitude morale et judiciaire du roi et conserve la portée théologique du terme.
- source_word: וְנוֹשָׁע
  choice: victorieux
  rationale: Le participe niphal peut désigner celui qui est sauvé ou délivré par Dieu et qui, par conséquent, remporte la victoire. « Victorieux » convient au contexte royal, tandis que la valeur passive et les autres lectures sont signalées en note.
- source_word: עָנִי
  choice: humble
  rationale: Dans ce contraste avec l’apparat royal, « humble » rend naturellement la condition modeste du roi, sans exclure les sens « pauvre » ou « affligé », indiqués en note.
- source_word: וְרֹכֵב עַל חֲמוֹר
  choice: et monté sur un âne
  rationale: Rend directement le participe et l’image concrète du mode d’arrivée du roi.
- source_word: עַיִר בֶּן אֲתֹנוֹת
  choice: un ânon, le petit d’une ânesse
  rationale: « Ânon » rend le jeune animal, et « le petit d’une ânesse » restitue l’expression hébraïque idiomatique en français naturel.
theological_decisions:
- issue: Sens de וְנוֹשָׁע dans cette annonce royale à portée messianique
  choice: victorieux
  alternative: sauvé, délivré, ou ayant le salut
  rationale: La forme hébraïque est passive et peut présenter le roi comme bénéficiaire du salut ou de la délivrance de Dieu. Dans le contexte royal, « victorieux » en exprime naturellement le résultat, mais la note préserve la passivité grammaticale et l’ambiguïté théologique au lieu de les effacer.
- issue: Caractérisation du roi par עָנִי
  choice: humble
  alternative: pauvre, affligé, ou de condition modeste
  rationale: « Humble » fait ressortir son arrivée sans faste impérial, mais le champ sémantique du mot comprend également la pauvreté et l’affliction; ces possibilités sont donc conservées en note.
- issue: Rapport entre l’âne et l’ânon
  choice: une description poétique d’un même animal
  alternative: deux animaux distincts
  rationale: La structure parallèle hébraïque décrit très probablement un même animal de deux façons. La traduction garde néanmoins les deux membres du parallélisme et réserve l’explication à une note.
translation_notes:
  register: Français international moderne, clair et digne, avec une cadence poétique adaptée à une proclamation prophétique. Les personnifications « fille de Sion » et « fille de Jérusalem » sont maintenues. Les ambiguïtés lexicales importantes sont conservées dans les notes plutôt que résolues silencieusement.
