  text: and also Hamath[a], which borders on it; Tyre and Sidon, because they are very wise.
translation:
  language: fr
  text: Et aussi Hamath[a], qui y est limitrophe, Tyr et Sidon, car elles sont très sages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Hamath aussi, qui y est limitrophe, Tyr et Sidon, car elle est très sage. » L’hébreu emploie un prédicat féminin singulier après les noms coordonnés de Tyr et Sidon.'
    reason: Signaler l’ambiguïté syntaxique et le décalage entre le prédicat féminin singulier hébreu et les deux villes coordonnées.
lexical_decisions:
- source_word: וְגַם
  choice: et aussi
  rationale: Conserve à la fois la coordination avec le verset précédent et la valeur additive de גַּם.
- source_word: חֲמָת
  choice: Hamath
  rationale: Forme française usuelle de ce nom de lieu biblique.
- source_word: תִּגְבָּל בָּהּ
  choice: qui a une frontière commune avec elle
  rationale: Exprime naturellement en français l’idée de גבול, « être limitrophe, avoir une frontière commune », tout en maintenant le pronom féminin dont l’antécédent se trouve dans le contexte précédent.
- source_word: צֹר וְצִידוֹן
  choice: Tyr et Sidon
  rationale: Formes françaises usuelles de ces noms de villes.
- source_word: כִּי
  choice: car
  rationale: Maintient la valeur explicative ou causale de la conjonction sans développer davantage la relation logique.
- source_word: חָכְמָה מְאֹד
  choice: elles sont très sages
  rationale: Le parfait statif décrit ici une qualité présente. Le pluriel français rapporte clairement la sagesse aux deux villes coordonnées, tout en signalant en note le singulier grammatical de l’hébreu.
theological_decisions:
- issue: Portée syntaxique de la proposition concernant Tyr et Sidon
  choice: 'Conserver la valeur explicative de כִּי : « car elles sont très sages »'
  alternative: Comprendre la remarque comme une parenthèse descriptive, ou donner à כִּי une nuance concessive
  rationale: Le texte hébreu est condensé, mais la valeur explicative de כִּי peut être gardée sans introduire une interprétation théologique supplémentaire.
- issue: Décalage de nombre entre חָכְמָה et « Tyr et Sidon »
  choice: Employer le pluriel français « elles sont très sages »
  alternative: 'Employer le singulier : « car elle est très sage », en visant Sidon ou l’ensemble pris collectivement'
  rationale: La forme hébraïque est au féminin singulier, mais les deux villes coordonnées semblent être en vue. Le pluriel est plus intelligible en français, tandis que la note préserve l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le caractère coordonné du fragment hébreu et évite de préciser l’antécédent du pronom féminin au-delà de ce que permet le texte.
