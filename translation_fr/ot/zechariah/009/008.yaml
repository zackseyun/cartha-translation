base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/008.yaml
  text: And I will encamp at my house as a guard[a], so that none may pass to and fro, and no oppressor will pass over them again[c][b]; for now I have seen with my own eyes.
translation:
  language: fr
  text: Je camperai auprès de ma maison, en poste de garde[a], contre celui qui passe et celui qui revient[b]. Aucun oppresseur[c] ne passera plus sur eux, car maintenant j’ai vu de mes propres yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une garde » ou « comme une garnison ». Le terme hébreu évoque un poste de défense occupé par une force stationnée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de celui qui passe et de celui qui revient », probablement une évocation des déplacements hostiles dans les deux sens.
    reason: lexical_alternative
  - marker: c
    text: Ou « percepteur » ou « chef de corvée »; le terme désigne quelqu’un qui contraint, exige un tribut ou opprime.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: Je camperai
  rationale: Le verbe חנה signifie « camper, établir son camp ». Le futur français convient à la promesse et conserve l’image militaire et protectrice.
- source_word: לְבֵיתִי
  choice: autour de ma maison
  rationale: La préposition לְ peut marquer ici l’orientation ou l’intérêt. Avec « camper » et la fonction défensive du contexte, « autour de » exprime naturellement la protection, bien qu’il s’agisse d’une explicitation contextuelle de « pour/près de ma maison ».
- source_word: מִצָּבָה
  choice: pour la protéger
  rationale: Le nom désigne un poste, une garde ou une garnison établie. Une formulation fonctionnelle est plus naturelle en français moderne que « comme une garde » et maintient l’image d’une défense stationnée.
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: de ceux qui vont et viennent
  rationale: Littéralement « de celui qui passe et de celui qui revient ». L’expression française rend le mouvement dans les deux sens sans préciser indûment l’identité des personnes concernées.
- source_word: נֹגֵשׂ
  choice: oppresseur
  rationale: Le participe désigne celui qui exerce une contrainte, impose un tribut ou opprime. « Oppresseur » est clair et assez large pour le contexte prophétique.
- source_word: וְלֹא יַעֲבֹר עֲלֵיהֶם עוֹד
  choice: Aucun oppresseur ne passera plus sur eux
  rationale: Le sujet est donné par נֹגֵשׂ. « Passer sur eux » préserve l’image de l’envahisseur qui traverse ou submerge le peuple, sans la réduire à un simple passage à proximité.
- source_word: כִּי עַתָּה רָאִיתִי בְעֵינָי
  choice: car maintenant, j’ai vu de mes propres yeux
  rationale: כִּי introduit le motif de la promesse; עַתָּה marque le moment décisif. « De mes propres yeux » restitue l’insistance de l’expression hébraïque.
theological_decisions:
- issue: Référent de « ma maison »
  choice: Conserver « ma maison » sans identifier explicitement le temple ou l’ensemble du peuple.
  alternative: Traduire ou expliquer dans le corps du texte comme « mon temple », « mon peuple » ou « mon pays ».
  rationale: La formule peut évoquer particulièrement le temple, mais le pronom pluriel « eux » et le contexte de défense permettent une portée plus large. La traduction maintient cette tension.
- issue: Portée de la protection contre ceux qui vont et viennent
  choice: Présenter cette circulation comme ce contre quoi la maison est protégée, sans qualifier explicitement tous les passants d’ennemis.
  alternative: « contre les armées qui vont et viennent » ou « afin que personne n’aille et ne vienne ».
  rationale: Le contexte est militaire, mais l’hébreu nomme seulement celui qui passe et celui qui revient. La note conserve la forme littérale sans ajouter une identification absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique est conservé en trois propositions. Les images militaires restent perceptibles sans vocabulaire inutilement technique; les ambiguïtés concernant « ma maison » et les mouvements de passage sont maintenues.
