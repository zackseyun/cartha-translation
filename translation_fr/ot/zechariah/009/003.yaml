id: ZEC.9.3
reference: Zechariah 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תִּ֥בֶן צֹ֛ר מָצ֖וֹר לָ֑/הּ וַ/תִּצְבָּר כֶּ֨סֶף֙ כֶּֽ/עָפָ֔ר וְ/חָר֖וּץ כְּ/טִ֥יט חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/003.yaml
  text: Tyre built herself a fortress[a], and piled up silver like dust[b], and gold like the mud of the streets.
translation:
  language: fr
  text: Tyr s’est bâti une forteresse[a] ; elle a amassé l’argent comme la poussière, et l’or[b] comme la boue des rues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une place forte ». Le mot hébreu מָצוֹר peut désigner un lieu fortifié ou des ouvrages défensifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’or fin ». Le mot hébreu חָרוּץ peut, selon le contexte, désigner plus précisément de l’or raffiné.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: Tyr
  rationale: Nom traditionnel et courant en français de la ville phénicienne.
- source_word: וַתִּבֶן
  choice: s’est bâti
  rationale: Le passé composé rend naturellement en français moderne l’action passée du wayyiqtol ; la tournure pronominale, avec le datif לָהּ, exprime que la ville a construit cette défense pour elle-même.
- source_word: מָצוֹר
  choice: forteresse
  rationale: Dans ce contexte, le terme désigne vraisemblablement un ouvrage ou lieu fortifié ; « forteresse » est clair et naturel, tout en laissant « place forte » comme possibilité.
- source_word: וַתִּצְבָּר
  choice: a amassé
  rationale: Le verbe évoque l’accumulation en grande quantité ; « amassé » convient aux métaux précieux sans effacer l’image d’abondance.
- source_word: כֶּסֶף
  choice: l’argent
  rationale: Il s’agit ici du métal précieux, en parallèle avec l’or, plutôt que de la monnaie au sens abstrait.
- source_word: כֶּעָפָר
  choice: comme la poussière
  rationale: Cette comparaison directe conserve l’image hébraïque d’une quantité innombrable.
- source_word: חָרוּץ
  choice: l’or
  rationale: Dans ce contexte, le nom désigne le métal précieux ; il peut parfois préciser un or fin ou raffiné, possibilité signalée en note.
- source_word: כְּטִיט חוּצוֹת
  choice: comme la boue des rues
  rationale: La formulation préserve l’image concrète d’une matière abondante dans les rues et reste idiomatique en français.
