  text: כִּ֥י מַה טּוּב֖/וֹ וּ/מַה יָפְי֑/וֹ דָּגָן֙ בַּֽחוּרִ֔ים וְ/תִיר֖וֹשׁ יְנוֹבֵ֥ב בְּתֻלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
translation:
  language: fr
  text: Car combien grande est sa bonté[a], combien grande est sa beauté ! Le grain fera prospérer les jeunes hommes, et le vin nouveau, les jeunes femmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « combien il est bon et combien il est beau ! » L’hébreu emploie les noms « bonté » et « beauté ». Le pronom « sa » renvoie probablement à l’Éternel dans ce contexte, mais certains le rapportent à Israël restauré, à sa prospérité ou au roi.'
    reason: Alternative lexicale et ambiguïté du référent.
  - marker: b
    text: 'Ou : « les vierges ». Le terme hébreu peut désigner plus précisément de jeunes femmes vierges et non mariées ; il constitue ici le pendant féminin de « jeunes hommes ».'
    reason: Alternative lexicale.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve le lien explicatif avec le verset précédent tout en introduisant naturellement l’exclamation.
- source_word: מַה טּוּבוֹ
  choice: combien grande est sa bonté
  rationale: Préserve la tournure exclamative, le nom abstrait טוּב et le suffixe masculin singulier, sans imposer l’identité de son référent.
- source_word: וּמַה יָפְיוֹ
  choice: combien grande est sa beauté
  rationale: Maintient le parallélisme nominal avec « sa bonté » et rend יֹפִי par son sens direct de beauté.
- source_word: דָּגָן
  choice: le blé
  rationale: Dans ce contexte de prospérité agricole, « le blé » est une formulation française naturelle pour les céréales vivrières désignées par דָּגָן.
- source_word: בַּחוּרִים
  choice: les jeunes hommes
  rationale: Désigne ici les jeunes hommes, en parallèle avec le groupe féminin du second membre.
- source_word: יְנוֹבֵב
  choice: fera prospérer
  rationale: Rend le sens causatif rare du verbe, qui évoque la vigueur et l’épanouissement produits par l’abondance.
- source_word: וְתִירוֹשׁ
  choice: et le vin nouveau
  rationale: תִּירוֹשׁ désigne couramment le vin nouveau ou frais et forme un parallèle poétique avec le blé.
- source_word: בְּתֻלוֹת
  choice: les jeunes femmes
  rationale: Dans le parallélisme, le terme désigne le pendant féminin des jeunes hommes; son sens plus précis est signalé en note.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans « sa bonté » et « sa beauté »
  choice: Ne pas identifier explicitement le référent dans le texte; le contexte favorise l’Éternel.
  alternative: Les suffixes peuvent renvoyer à Israël ou Sion restauré, à son état de prospérité, ou au roi évoqué plus tôt.
  rationale: L’action salvatrice de l’Éternel au verset précédent favorise une référence à Dieu, mais l’hébreu ne nomme pas l’antécédent. La note préserve donc l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé; l’ellipse verbale du second membre (« et le vin nouveau, les jeunes femmes ») reproduit la concision de la poésie source.
