source:
  edition: WLC
  text: וְ/יָשַׁ֥ב מַמְזֵ֖ר בְּ/אַשְׁדּ֑וֹד וְ/הִכְרַתִּ֖י גְּא֥וֹן פְּלִשְׁתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/006.yaml
  text: A mixed people will dwell in Ashdod[a], and I will cut off the pride of the Philistines.
translation:
  language: fr
  text: Une population mêlée habitera Ashdod[a], et je retrancherai l’orgueil des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une personne de naissance illégitime habitera Ashdod. » Le terme hébreu מַמְזֵר est difficile et peut désigner une personne de naissance illégitime ou de statut mêlé ou exclu ; il est rendu ici collectivement d’après le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: habitera
  rationale: Le verbe signifie couramment « s’asseoir », « demeurer » ou « habiter ». Ici, dans le contexte d’un changement de population à Ashdod, « habitera » exprime naturellement l’installation dans la ville.
- source_word: מַמְזֵר
  choice: une population mêlée
  rationale: Ce nom rare est difficile. Il peut désigner une personne de naissance illégitime ou de statut exclu, mais le contexte paraît évoquer collectivement une population mêlée ou non autochtone qui occupera Ashdod. Cette formulation préserve cette portée sociale sans employer un terme français inutilement injurieux.
- source_word: בְּאַשְׁדּוֹד
  choice: Ashdod
  rationale: La préposition ב indique le lieu. En français, le verbe « habiter » se construit naturellement sans préposition devant le nom d’une ville.
- source_word: הִכְרַתִּי
  choice: je retrancherai
  rationale: Le hiphil de כרת signifie « couper », « retrancher », « éliminer ». « Retrancher » conserve la vigueur de l’image prophétique et judiciaire.
- source_word: גְּאוֹן
  choice: l’orgueil
  rationale: Le mot peut désigner l’élévation, la majesté ou l’orgueil. Dans cet oracle de jugement, le sens négatif « orgueil » convient au contexte.
- source_word: פְּלִשְׁתִּים
  choice: des Philistins
  rationale: La forme hébraïque désigne le peuple philistin plutôt que son territoire.
theological_decisions:
- issue: Référent et nuance de מַמְזֵר dans l’oracle de jugement
  choice: Traduction collective par « une population mêlée »
  alternative: « un enfant illégitime » ou « une personne de naissance illégitime »
  rationale: Le contexte annonce l’humiliation de l’identité et de la puissance philistines. La lecture individuelle demeure lexicalement possible, mais la formulation collective rend mieux le probable changement social ou démographique sans résoudre définitivement l’ambiguïté, laquelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Retrancherai » maintient le relief prophétique du texte, tandis que la note conserve l’ambiguïté réelle du terme מַמְזֵר.
