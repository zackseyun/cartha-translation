  source_fidelity: 'Le texte rend fidèlement la structure et les images de l’hébreu : le repère prophétique (« En ce jour-là »), l’action divine (« je ferai de Jérusalem »), la pierre lourde, les personnes qui tentent de la soulever et subissent une grave blessure, puis le rassemblement hostile de toutes les nations. La distinction בין עַמִּים (« peuples ») et גּוֹיִם (« nations ») est utilement conservée. « Se rassembleront contre elle » exprime correctement la portée hostile de עָלֶיהָ dans ce contexte.'
