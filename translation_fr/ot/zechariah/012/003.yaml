id: ZEC.12.3
reference: Zechariah 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/יּוֹם הַ֠/הוּא אָשִׂ֨ים אֶת יְרוּשָׁלִַ֜ם אֶ֤בֶן מַֽעֲמָסָה֙ לְ/כָל הָ֣/עַמִּ֔ים כָּל עֹמְסֶ֖י/הָ שָׂר֣וֹט יִשָּׂרֵ֑טוּ וְ/נֶאֶסְפ֣וּ עָלֶ֔י/הָ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/003.yaml
  text: And on that day I will make Jerusalem a heavy stone for all the peoples[a]. All who lift it will surely injure themselves[c][b], and all the nations of the earth will gather against her.
translation:
  language: fr
  text: En ce jour-là, je ferai de Jérusalem une pierre pesante pour tous les peuples[a]. Tous ceux qui la soulèveront se blesseront grièvement[b], et toutes les nations de la terre[c] se rassembleront contre elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une pierre qui sera un lourd fardeau pour tous les peuples ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « seront bel et bien lacérés » ; la tournure hébraïque intensifie l’idée d’une grave blessure.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « toutes les nations du pays », si le mot hébreu désigne ici le territoire plutôt que la terre entière.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique naturelle en français, qui conserve le repère temporel et l’enchaînement du discours sans alourdir par « il arrivera ».
- source_word: אָשִׂים אֶת יְרוּשָׁלִַם
  choice: je ferai de Jérusalem
  rationale: Avec le complément « pierre pesante », שׂים exprime ici l’établissement de Jérusalem dans cet état ou ce rôle.
- source_word: אֶבֶן מַעֲמָסָה
  choice: une pierre pesante
  rationale: Le syntagme évoque une pierre constituant une lourde charge, dangereuse pour ceux qui tentent de la soulever. « Pesante » garde l’image concrète dans un registre digne.
- source_word: לְכָל הָעַמִּים
  choice: pour tous les peuples
  rationale: « Peuples » rend עַמִּים et maintient sa distinction lexicale avec גּוֹיִם, rendu plus loin par « nations ».
- source_word: כָּל עֹמְסֶיהָ
  choice: Tous ceux qui la soulèveront
  rationale: Le participe de עמס désigne ceux qui chargent ou soulèvent un fardeau; dans l’image de la pierre, « soulever » est concret et naturel.
- source_word: שָׂרוֹט יִשָּׂרֵטוּ
  choice: se blesseront grièvement
  rationale: L’infinitif absolu suivi du verbe intensifie l’action. Le radical évoque une coupure ou une lacération; la formulation française exprime une grave blessure tout en laissant la note préciser l’image littérale.
- source_word: וְנֶאֶסְפוּ עָלֶיהָ
  choice: se rassembleront contre elle
  rationale: Dans ce contexte prophétique et hostile, עַל marque un rassemblement dirigé contre Jérusalem.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: toutes les nations de la terre
  rationale: Dans ce cadre international, הָאָרֶץ a vraisemblablement une portée mondiale, mais le sens plus local « pays » demeure possible et est signalé en note.
theological_decisions:
- issue: Portée de la coalition hostile contre Jérusalem
  choice: toutes les nations de la terre
  alternative: toutes les nations du pays
  rationale: Le contexte international de l’oracle favorise la portée mondiale de הָאָרֶץ, sans exclure lexicalement le sens plus local de « pays »; l’ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’image concrète de la pierre est maintenue, de même que la distinction entre « peuples » et « nations ». Les ambiguïtés lexicales importantes sont indiquées en notes.
