  - severity: medium
    issue: L’ordre des mots de la dernière proposition est peu idiomatique.
    rationale: « façonne au-dedans de l’être humain son souffle » retarde anormalement le complément d’objet et rend la relation entre le souffle et l’être humain moins immédiate.
  - severity: low
