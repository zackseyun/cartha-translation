source:
  edition: WLC
  text: מַשָּׂ֥א דְבַר יְהוָ֖ה עַל יִשְׂרָאֵ֑ל נְאֻם יְהוָ֗ה נֹטֶ֤ה שָׁמַ֨יִם֙ וְ/יֹסֵ֣ד אָ֔רֶץ וְ/יֹצֵ֥ר רֽוּחַ אָדָ֖ם בְּ/קִרְבּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/001.yaml
  text: 'An oracle[a], the word of Yahweh concerning Israel: the declaration of Yahweh, who stretches out the heavens, lays the foundation of the earth[b], and forms the spirit of man within him.'
translation:
  language: fr
  text: 'Oracle[a] : parole de Yahweh au sujet d’Israël. Déclaration de Yahweh, lui qui déploie les cieux, pose les fondations de la terre et façonne l’esprit de l’être humain en lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Oracle : parole de Yahweh contre Israël ». La préposition hébraïque peut signifier « au sujet de » ou, selon le contexte, « contre ».'
    reason: alternative_reading
  - marker: b
    text: Ou « le souffle de l’être humain en lui ». Le mot hébreu peut signifier « esprit » ou « souffle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans un en-tête prophétique, le terme désigne une parole solennelle et lourde de portée. « Proclamation » est naturel en français moderne et évite le sens concret trompeur de « fardeau ».
- source_word: דְבַר יְהוָה
  choice: parole de Yahweh
  rationale: La formulation conserve le lien formel avec la parole prophétique plutôt que de l’interpréter simplement comme un « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: עַל
  choice: au sujet d’
  rationale: La préposition introduit ici de façon vraisemblable le thème de la proclamation. Cette traduction reste assez large pour le contexte, qui annonce à la fois jugement et salut.
- source_word: נְאֻם יְהוָה
  choice: Déclaration de Yahweh
  rationale: Le syntagme nominal hébreu est maintenu au lieu d’être transformé en incise verbale, ce qui préserve la solennité de la formule prophétique.
- source_word: נֹטֶה שָׁמַיִם
  choice: lui qui déploie les cieux
  rationale: Le participe décrit Yahweh comme créateur. « Déploie » restitue naturellement l’image d’une étendue mise en place.
- source_word: וְיֹסֵד אָרֶץ
  choice: pose les fondations de la terre
  rationale: Cette expression rend l’image architecturale du verbe יסד et s’accorde avec le tableau de la création.
- source_word: וְיֹצֵר רוּחַ אָדָם
  choice: et façonne au-dedans de l’être humain son souffle
  rationale: « Façonne » préserve l’image du modelage. « Souffle » maintient ici l’étendue sémantique de רוּחַ, qui peut désigner le souffle, l’esprit ou le principe intérieur de vie.
- source_word: אָדָם
  choice: l’être humain
  rationale: Dans ce contexte générique, le mot désigne une personne humaine représentative plutôt qu’un homme de sexe masculin. Le singulier est conservé.
- source_word: בְּקִרְבּוֹ
  choice: au-dedans de l’être humain son souffle
  rationale: Le suffixe masculin singulier renvoie naturellement à אָדָם. La reprise par « son » produit une formulation française claire tout en conservant le rapport interne exprimé par l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Sens générique de אָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le terme est singulier et représentatif, mais il vise ici l’humain en général. « L’être humain » le rend sans suggérer indûment le seul sexe masculin.
- issue: Sens de רוּחַ dans l’être humain
  choice: souffle
  alternative: esprit
  rationale: Le mot hébreu garde une polysémie réelle entre souffle, esprit et principe de vie. Le choix de « souffle » s’accorde avec l’imagerie créatrice, tandis que la note préserve « esprit » comme autre traduction légitime.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure solennelle de l’en-tête prophétique est conservée. Les deux ambiguïtés principales, עַל (« au sujet de » ou « contre ») et רוּחַ (« souffle » ou « esprit »), sont explicitement maintenues par les notes.
