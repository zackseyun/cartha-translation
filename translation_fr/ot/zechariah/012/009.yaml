base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/009.yaml
  text: And on that day I will seek to destroy all the nations that come against Jerusalem[a].
translation:
  language: fr
  text: Ce jour-là, je chercherai à détruire toutes les nations qui viendront attaquer Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je m’emploierai à détruire ». Le verbe hébreu peut exprimer une intention résolue, et non une simple recherche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ce jour-là
  rationale: La formule hébraïque introduit un événement futur dans le discours prophétique. En français naturel, sa valeur est portée par l’expression temporelle sans calquer lourdement « il arrivera ».
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression prophétique temporelle courante, conservée sans préciser le calendrier de son accomplissement.
- source_word: אֲבַקֵּשׁ
  choice: je chercherai
  rationale: Le piel de בקש signifie ici « chercher à » et peut exprimer une intention résolue. La traduction conserve son noyau lexical et la note signale cette nuance.
- source_word: לְהַשְׁמִיד
  choice: à détruire
  rationale: L’infinitif hiphil de שׁמד désigne l’action de causer la destruction. « Détruire » est fort, naturel et n’en précise pas excessivement le degré.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: Le collectif כָּל appelle « toutes », tandis que גּוֹיִם désigne ici les nations étrangères sans qu’il soit nécessaire d’introduire la notion plus tardive de « païens ».
- source_word: הַבָּאִים
  choice: qui viendront
  rationale: Le participe attributif décrit les nations par leur venue hostile. Le futur français s’accorde naturellement avec l’annonce prophétique.
- source_word: עַל יְרוּשָׁלִָם
  choice: attaquer Jérusalem
  rationale: Avec le mouvement hostile du contexte, עַל a une valeur adversative. « Attaquer » rend clairement et naturellement cette venue contre Jérusalem.
theological_decisions:
- issue: Locuteur divin et action du jugement
  choice: 'Maintien du discours divin à la première personne : « je chercherai à détruire »'
  alternative: Formulation impersonnelle du jugement
  rationale: Le verbe hébreu à la première personne du singulier présente directement Dieu comme celui qui agit. La traduction ne réduit ni ne détourne cette responsabilité.
- issue: Portée de la formule prophétique
  choice: « Ce jour-là » sans explication chronologique
  alternative: Préciser explicitement un scénario eschatologique particulier
  rationale: L’expression a une portée prophétique, mais ce verset ne définit ni calendrier ni système d’accomplissement. Son ouverture est donc préservée.
- issue: Nuance de אֲבַקֵּשׁ
  choice: « je chercherai à détruire » avec note sur l’intention résolue
  alternative: « je me disposerai à détruire »
  rationale: La traduction principale maintient la valeur lexicale de « chercher », tandis que la note empêche de comprendre une simple tentative incertaine et conserve la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite le calque archaïque « il arrivera en ce jour-là ». « Attaquer Jérusalem » explicite naturellement la valeur hostile de la préposition dans ce contexte, sans ajouter de cadre doctrinal.
