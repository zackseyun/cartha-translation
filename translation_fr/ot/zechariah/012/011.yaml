id: ZEC.12.11
reference: Zechariah 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִגְדַּ֤ל הַ/מִּסְפֵּד֙ בִּ/יר֣וּשָׁלִַ֔ם כְּ/מִסְפַּ֥ד הֲדַדְ רִמּ֖וֹן בְּ/בִקְעַ֥ת מְגִדּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/011.yaml
  text: On that day the mourning in Jerusalem will become great[a], like the mourning of Hadad-rimmon in the plain of Megiddo.
translation:
  language: fr
  text: En ce jour-là, le deuil deviendra intense à Jérusalem, comme le deuil d’Hadad-Rimmôn dans la plaine de Meguiddo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hadad-Rimmôn peut désigner un lieu proche de Meguiddo, peut-être associé au deuil pour Josias (voir 2 Ch 35.22-25), ou renvoyer à une autre tradition de lamentation bien connue.
    reason: Identification incertaine du nom propre et de la lamentation évoquée.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique courante, rendue dans un français naturel tout en conservant sa portée déictique.
- source_word: יִגְדַּל
  choice: deviendra intense
  rationale: Le verbe גדל exprime ici l’accroissement ou la grandeur du deuil. « Deviendra intense » conserve l’idée de développement dans un français idiomatique.
- source_word: הַמִּסְפֵּד
  choice: le deuil
  rationale: מִסְפֵּד désigne les manifestations de deuil ou la lamentation publique, souvent à la suite d’un décès. « Deuil » convient au contexte collectif.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Rendu locatif naturel en français.
- source_word: כְּמִסְפַּד
  choice: comme le deuil de
  rationale: La préposition comparative כ introduit le terme de comparaison, tandis que la construction nominale reste volontairement ouverte quant à la relation exacte avec Hadad-Rimmôn.
- source_word: הֲדַד רִמּוֹן
  choice: Hadad-Rimmôn
  rationale: Le nom propre est translittéré sans en préciser l’identité débattue. Le trait d’union reflète ses deux éléments.
- source_word: בְּבִקְעַת מְגִדּוֹן
  choice: dans la plaine de Meguiddo
  rationale: בִּקְעָה désigne une large vallée ou plaine. « Plaine » rend bien le relief évoqué; « Meguiddo » suit une translittération française usuelle.
theological_decisions:
- issue: Identification d’Hadad-Rimmôn
  choice: Conserver Hadad-Rimmôn comme nom propre inexpliqué dans le texte principal.
  alternative: Y voir le lieu du deuil pour le roi Josias près de Meguiddo, ou une autre tradition de lamentation connue, éventuellement cultuelle.
  rationale: L’hébreu nomme Hadad-Rimmôn sans identifier explicitement la personne, le lieu ou la tradition en cause. Le texte principal préserve donc cette ambiguïté, et la note présente les principales possibilités sans en imposer une.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’image d’un deuil collectif dont l’intensité augmente, sans résoudre l’identité incertaine d’Hadad-Rimmôn.
