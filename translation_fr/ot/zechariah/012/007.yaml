  to: Yahweh sauvera d’abord les tentes de Juda[a], afin que la gloire de la maison de David et la gloire des habitants de Jérusalem ne s’élèvent pas au-dessus de Juda[b].
  rationale: La révision remplace le passif « soient exaltées » par « s’élèvent », qui correspond plus directement au qal hébreu tout en conservant la relation de supériorité indiquée par עַל. Elle rétablit explicitement les deux occurrences parallèles de « gloire » et ajuste la note b pour ne pas transformer la relation « au-dessus de Juda » en comparaison adjectivale maladroite.
