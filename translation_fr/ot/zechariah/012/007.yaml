  naturalness: Le français est moderne, clair et de registre approprié. « S’élèvent au-dessus de Juda » est à la fois plus proche du verbe hébreu et naturel dans ce contexte. La répétition de « la gloire » maintient aussi plus visiblement le parallélisme de l’original.
  terminology: « Yahweh », « tentes de Juda », « maison de David », « habitants de Jérusalem » et « gloire » sont des choix justes et cohérents. Le pluriel « habitants » rend naturellement le singulier collectif hébreu. « Juda » convient pour יהודה.
