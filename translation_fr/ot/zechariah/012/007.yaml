  text: וְ/הוֹשִׁ֧יעַ יְהוָ֛ה אֶת אָהֳלֵ֥י יְהוּדָ֖ה בָּ/רִֽאשֹׁנָ֑ה לְמַ֨עַן לֹֽא תִגְדַּ֜ל תִּפְאֶ֣רֶת בֵּית דָּוִ֗יד וְ/תִפְאֶ֛רֶת יֹשֵׁ֥ב יְרוּשָׁלִַ֖ם עַל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/007.yaml
  text: And Yahweh will save the tents of Judah first[b][a], so that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be magnified over Judah.
translation:
  language: fr
  text: Yahweh sauvera d’abord les tentes de Juda[a], afin que la gloire de la maison de David et la gloire des habitants de Jérusalem ne s’élèvent pas au-dessus de Juda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les demeures de Juda ». L’hébreu dit littéralement « les tentes de Juda », probablement en contraste avec Jérusalem et la maison de David.
    reason: lexical_alternative
  - marker: b
    text: Litt. « ne deviennent pas grandes au-dessus de Juda » ; ou « ne soient pas exaltées au-dessus de Juda ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוֹשִׁיעַ
  choice: sauvera
  rationale: Le hifil de ישׁע exprime ici l’action de sauver ou de délivrer. « Sauvera » est naturel en français et conserve la portée du secours divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אָהֳלֵי יְהוּדָה
  choice: les tentes de Juda
  rationale: La traduction conserve l’image concrète des « tentes », probablement mise en contraste avec Jérusalem et la maison royale.
- source_word: בָּרִאשֹׁנָה
  choice: d’abord
  rationale: L’adverbe marque une priorité dans l’ordre de l’intervention divine; « d’abord » est idiomatique en français moderne.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution rend clairement la valeur finale de la proposition.
- source_word: תִגְדַּל
  choice: ne soient pas exaltées
  rationale: Avec « gloire » comme sujet et עַל comme terme de comparaison ou de supériorité, cette formulation exprime l’idée de ne pas être élevée au-dessus de Juda sans réduire le sens à la seule vantardise.
- source_word: תִּפְאֶרֶת
  choice: gloire
  rationale: Le mot peut désigner la gloire, la splendeur ou l’honneur. « Gloire » convient au parallélisme et maintient l’ampleur sémantique du terme.
- source_word: בֵּית דָּוִיד
  choice: la maison de David
  rationale: Cette expression française conserve à la fois l’image de la maison et son sens dynastique.
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Le participe singulier hébreu a une valeur collective; le pluriel est la formulation naturelle en français.
- source_word: עַל יְהוּדָה
  choice: au-dessus de Juda
  rationale: עַל indique ici une supériorité relative. « Au-dessus de Juda » conserve explicitement cette relation.
theological_decisions:
- issue: Contraste social et politique au sein du peuple
  choice: Le texte donne la priorité aux tentes de Juda et empêche que la maison de David et Jérusalem soient exaltées au-dessus de Juda.
  alternative: Le verset indiquerait seulement un ordre chronologique, sans portée d’équilibrage entre Juda, la dynastie et Jérusalem.
  rationale: Le rapprochement entre « les tentes de Juda », « la maison de David » et « les habitants de Jérusalem », suivi de la proposition de but, suggère que l’ordre du salut empêche l’exaltation disproportionnée des centres royal et urbain. La traduction laisse toutefois le texte exprimer lui-même cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche de l’hébreu, tandis que le singulier collectif « habitant » est rendu naturellement par le pluriel. Les deux occurrences de « gloire » sont allégées par « celle », sans modifier le parallélisme.
