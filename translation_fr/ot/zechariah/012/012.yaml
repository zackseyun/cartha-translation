source:
  edition: WLC
  text: וְ/סָפְדָ֣ה הָ/אָ֔רֶץ מִשְׁפָּח֥וֹת מִשְׁפָּח֖וֹת לְ/בָ֑ד מִשְׁפַּ֨חַת בֵּית דָּוִ֤יד לְ/בָד֙ וּ/נְשֵׁי/הֶ֣ם לְ/בָ֔ד מִשְׁפַּ֤חַת בֵּית נָתָן֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/012.yaml
  text: 'And the land will mourn[a], each family by itself: the family of the house of David by itself, and their wives by themselves; the family of the house of Nathan by itself[b], and their wives by themselves.'
translation:
  language: fr
  text: 'Le pays[a] se lamentera, famille par famille[b] : la famille de la maison de David à part, et leurs femmes à part ; la famille de la maison de Nathan à part, et leurs femmes à part.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre ».
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu répète « familles, familles » pour exprimer l’idée distributive : chaque famille séparément.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדָה
  choice: se lamentera
  rationale: Le verbe ספד exprime le deuil et la lamentation, souvent dans un cadre funèbre ou collectif. « Se lamentera » conserve cette idée tout en s’appliquant naturellement au pays personnifié.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ peut désigner le pays ou la terre. Le contexte énumère des familles de Juda et de Jérusalem ; « le pays » rend donc au mieux la portée territoriale et nationale, sans exclure l’autre sens possible signalé en note.
- source_word: מִשְׁפָּחוֹת מִשְׁפָּחוֹת
  choice: famille par famille
  rationale: La répétition hébraïque a ici une valeur distributive. « Famille par famille » la restitue de manière idiomatique et souligne que chaque groupe se lamente séparément.
- source_word: לְבָד
  choice: à part
  rationale: לְבָד marque la séparation. La répétition de « à part » préserve l’insistance du texte sur le caractère distinct de chaque groupe en deuil.
- source_word: מִשְׁפַּחַת בֵּית דָּוִיד
  choice: la famille de la maison de David
  rationale: Cette formulation conserve la chaîne de dépendance hébraïque et la nuance dynastique de « maison de David ».
- source_word: וּנְשֵׁיהֶם
  choice: et leurs femmes
  rationale: אִשָּׁה peut signifier « femme » ou « épouse ». Avec le possessif pluriel dans ce cadre familial, « leurs femmes » désigne naturellement les épouses tout en restant proche de la formulation hébraïque.
- source_word: מִשְׁפַּחַת בֵּית נָתָן
  choice: la famille de la maison de Nathan
  rationale: La formulation présente Nathan comme l’ancêtre ou le représentant d’une lignée familiale et maintient le parallélisme avec la maison de David.
theological_decisions:
- issue: Portée de הָאָרֶץ dans le contexte prophétique
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat concerne des lignées particulières de Juda et de Jérusalem. La lamentation paraît donc envisagée dans l’ensemble du pays plutôt qu’à l’échelle du globe ; l’ambiguïté lexicale demeure néanmoins indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition de « à part » sont conservés afin de reproduire l’insistance structurante de l’hébreu.
