id: ZEC.12.2
reference: Zechariah 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֣ה אָ֠נֹכִי שָׂ֣ם אֶת יְרוּשָׁלִַ֧ם סַף רַ֛עַל לְ/כָל הָ/עַמִּ֖ים סָבִ֑יב וְ/גַ֧ם עַל יְהוּדָ֛ה יִֽהְיֶ֥ה בַ/מָּצ֖וֹר עַל יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/002.yaml
  text: Behold[a], I am about to make Jerusalem a cup of staggering to all the surrounding peoples[b]; and it will also be against Judah in the siege against Jerusalem.
translation:
  language: fr
  text: Voici, je vais faire de Jérusalem une coupe qui fera chanceler[a] tous les peuples d’alentour ; et ce sera aussi contre Juda, lors du siège contre Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une coupe qui fera tituber ». Le mot hébreu traduit par « coupe » peut aussi désigner, plus littéralement, une vasque ou un seuil ; dans ce contexte, l’image d’un récipient qui provoque une démarche chancelante paraît la plus probable.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de cette dernière proposition est difficile. On peut aussi comprendre : « Juda aussi sera assiégé avec Jérusalem » ou « cela atteindra aussi Juda lors du siège de Jérusalem ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit avec solennité une annonce prophétique tout en restant naturel en français moderne.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant hébreu est emphatique, mais la première personne explicite suffit ici en français ; « moi-même » alourdirait inutilement la déclaration.
- source_word: שָׂם
  choice: je vais faire de
  rationale: Avec הִנֵּה, le participe exprime ici une action imminente ou annoncée avec vivacité. « Je vais faire de » rend naturellement cette valeur.
- source_word: סַף רַעַל
  choice: une coupe qui fera chanceler
  rationale: סַף peut désigner un seuil ou un récipient ; dans cette image de jugement, un récipient provoquant une démarche d’ivrogne convient le mieux. La proposition relative exprime clairement l’effet de רַעַל.
- source_word: לְכָל הָעַמִּים סָבִיב
  choice: tous les peuples d’alentour
  rationale: « Peuples » correspond au pluriel עַמִּים, et « d’alentour » conserve l’idée des populations environnantes dans un registre digne.
- source_word: וְגַם עַל יְהוּדָה יִהְיֶה
  choice: et ce sera aussi contre Juda
  rationale: Cette formulation suit de près la construction hébraïque difficile, maintient la valeur hostile possible de עַל et évite de préciser abusivement le rôle de Juda.
- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  choice: lors du siège contre Jérusalem
  rationale: מָצוֹר désigne un siège, tandis que עַל indique ici l’action militaire dirigée contre la ville.
theological_decisions:
- issue: Sens de la proposition difficile וְגַם עַל־יְהוּדָה יִהְיֶה בַמָּצוֹר עַל־יְרוּשָׁלִָם
  choice: « et ce sera aussi contre Juda, lors du siège contre Jérusalem »
  alternative: « Juda aussi sera assiégé avec Jérusalem » ou « cela atteindra aussi Juda quand Jérusalem sera assiégée »
  rationale: La syntaxe hébraïque est condensée et ambiguë. Le texte principal conserve la tension selon laquelle Juda est touché ou impliqué de manière défavorable dans le siège contre Jérusalem, sans déterminer plus précisément comment.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » garde la solennité prophétique ; « d’alentour » apporte une légère élévation de registre sans archaïsme marqué. La formulation volontairement resserrée de la seconde proposition préserve l’ambiguïté de l’hébreu.
