source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אַכֶּ֤ה כָל סוּס֙ בַּ/תִּמָּה֔וֹן וְ/רֹכְב֖/וֹ בַּ/שִּׁגָּע֑וֹן וְ/עַל בֵּ֤ית יְהוּדָה֙ אֶפְקַ֣ח אֶת עֵינַ֔/י וְ/כֹל֙ ס֣וּס הָֽ/עַמִּ֔ים אַכֶּ֖ה בַּֽ/עִוָּרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/004.yaml
  text: On that day[a], declares Yahweh, I will strike every horse with panic, and its rider with madness. But over the house of Judah I will keep my eyes open[b], and I will strike every horse of the peoples with blindness.
translation:
  language: fr
  text: En ce jour-là, déclare Yahvé, je frapperai de panique tous les chevaux et de folie leurs cavaliers. Mais j’ouvrirai les yeux sur la maison de Juda[a], et je frapperai d’aveuglement tous les chevaux des peuples[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je porterai mon regard sur la maison de Juda ». L’expression hébraïque dit littéralement « j’ouvrirai mes yeux sur » et évoque, dans ce contexte, une attention favorable, probablement protectrice.
    reason: lexical_alternative
  - marker: b
    text: Ou « des nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה
  choice: déclare Yahvé
  rationale: La formule prophétique est rendue dans un français actuel et direct; le nom divin est translittéré « Yahvé ».
- source_word: אַכֶּה כָל סוּס בַּתִּמָּהוֹן
  choice: je frapperai de panique tous les chevaux
  rationale: « Frapper de » restitue naturellement le hiphil de נכה avec l’état imposé; « panique » convient au contexte militaire de désarroi.
- source_word: וְרֹכְבוֹ בַּשִּׁגָּעוֹן
  choice: et de folie ceux qui les montent
  rationale: Le singulier distributif hébreu est rendu par un pluriel français accordé à « tous les chevaux », sans perdre la relation entre monture et cavalier.
- source_word: וְעַל בֵּית יְהוּדָה אֶפְקַח אֶת עֵינַי
  choice: Mais je garderai les yeux ouverts sur la maison de Juda
  rationale: La traduction conserve l’image hébraïque de l’œil ouvert et fait ressortir le contraste contextuel avec les jugements précédents, sans expliciter davantage la faveur protectrice.
- source_word: כֹל סוּס הָעַמִּים
  choice: tous les chevaux des peuples
  rationale: Le pluriel עַמִּים est rendu au plus près par « peuples »; « nations » reste possible.
- source_word: בַּעִוָּרוֹן
  choice: d’aveuglement
  rationale: Rendu direct du nom désignant la cécité infligée, en parallèle avec la panique et la folie.
theological_decisions:
- issue: Le regard de Yahvé sur la maison de Juda
  choice: 'Conserver l’image d’une vigilance attentive: « je garderai les yeux ouverts sur »'
  alternative: « j’ouvrirai les yeux sur » ou, de façon plus interprétative, « je veillerai sur »
  rationale: Dans le contexte, l’expression suggère un regard favorable, probablement protecteur, mais la formulation retenue n’en fait pas une affirmation plus précise que l’hébreu.
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur; Jéhovah
  rationale: « Yahvé » représente directement le tétragramme et correspond à la couche de consultation anglaise là où celle-ci emploie explicitement « Yahweh ».
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des trois jugements est maintenu, tandis que le contraste concernant Juda est marqué par « Mais ». Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondants.
