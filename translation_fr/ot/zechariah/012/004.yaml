  naturalness: Le français est moderne, clair et d’un registre approprié. « Ceux qui les montent » est naturel, bien que « leurs cavaliers » soit plus concis et conserve sans difficulté le sens distributif du singulier hébreu.
  terminology: « Yahvé », « maison de Juda », « panique », « folie » et « aveuglement » conviennent. La note sur le regard divin doit présenter la valeur favorable/protectrice comme contextuelle et non comme une explicitation certaine du texte.
