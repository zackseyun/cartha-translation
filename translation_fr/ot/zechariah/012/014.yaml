  text: כֹּ֗ל הַ/מִּשְׁפָּחוֹת֙ הַ/נִּשְׁאָר֔וֹת מִשְׁפָּחֹ֥ת מִשְׁפָּחֹ֖ת לְ/בָ֑ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/014.yaml
  text: all the families that remain[a], family by family by themselves, and their wives by themselves.
translation:
  language: fr
  text: toutes les familles qui restent, chaque famille à part, et leurs femmes à part.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs épouses à part ». L’hébreu répète « familles » dans un sens distributif et répète « à part » pour insister sur la séparation.
    reason: Ambiguïté lexicale de נָשִׁים et forme distributive emphatique de l’hébreu.
lexical_decisions:
- source_word: כֹּל הַמִּשְׁפָּחוֹת הַנִּשְׁאָרוֹת
  choice: toutes les familles qui restent
  rationale: Cette formulation rend le sens collectif de כֹּל et la notion de reste exprimée par שׁאר, sans préciser indûment s’il s’agit seulement de personnes encore présentes ou de survivants.
- source_word: מִשְׁפָּחֹת מִשְׁפָּחֹת
  choice: chaque famille
  rationale: La répétition hébraïque a une valeur distributive. « Chaque famille » l’exprime naturellement en français moderne.
- source_word: לְבָד
  choice: à part
  rationale: « À part » rend clairement la séparation des groupes et permet de conserver la répétition emphatique du terme hébreu.
- source_word: וּנְשֵׁיהֶם
  choice: et leurs femmes
  rationale: Dans ce contexte familial, נָשִׁים peut désigner les épouses, mais « leurs femmes » conserve en français la possibilité contextuelle d’entendre les femmes appartenant à ces groupes sans imposer exclusivement le lien conjugal.
theological_decisions:
- issue: Séparation entre les groupes familiaux et les femmes dans le deuil
  choice: Conserver explicitement « leurs femmes à part »
  alternative: Neutraliser la distinction en parlant seulement de groupes séparés
  rationale: L’hébreu distingue expressément les familles de leurs femmes et répète לְבָד. La traduction maintient cette tension et cette participation séparée sans en fournir une explication doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. La construction « chaque famille à part » évite le calque peu naturel « famille par famille à part », tandis que la répétition de « à part » préserve l’insistance du texte source.
