  text: בַּ/יּ֣וֹם הַ/ה֡וּא אָשִׂים֩ אֶת אַלֻּפֵ֨י יְהוּדָ֜ה כְּֽ/כִיּ֧וֹר אֵ֣שׁ בְּ/עֵצִ֗ים וּ/כְ/לַפִּ֥יד אֵשׁ֙ בְּ/עָמִ֔יר וְ/אָ֨כְל֜וּ עַל יָמִ֧ין וְ/עַל שְׂמֹ֛אול אֶת כָּל הָ/עַמִּ֖ים סָבִ֑יב וְ/יָשְׁבָ֨ה יְרוּשָׁלִַ֥ם ע֛וֹד תַּחְתֶּ֖י/הָ בִּ/ירוּשָׁלִָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
translation:
  language: fr
  text: En ce jour-là, je ferai des chefs de Juda[a] comme un brasero ardent au milieu du bois et comme une torche enflammée au milieu des gerbes. Ils dévoreront tous les peuples environnants, à droite et à gauche. Jérusalem habitera de nouveau à sa place[b], à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des clans de Juda » ou « des chefs de clan de Juda ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sous elle-même », expression qui signifie ici « à sa propre place ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלֻּפֵי יְהוּדָה
  choice: des chefs de Juda
  rationale: אַלּוּף désigne souvent un chef de clan ou un dirigeant. Dans le contexte, le masculin pluriel repris par וְאָכְלוּ s’exprime naturellement par « chefs », sans exclure leur fonction représentative au sein de Juda. Le sens collectif « clans » reste possible et est signalé en note.
- source_word: כְּכִיּוֹר אֵשׁ בְּעֵצִים
  choice: comme un brasero ardent au milieu du bois
  rationale: כִּיּוֹר désigne un récipient ou bassin ; qualifié par « feu » dans cette comparaison, « brasero ardent » rend clairement l’image d’un récipient contenant un feu qui embrase le bois alentour.
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  choice: et comme une torche enflammée au milieu des gerbes
  rationale: לַפִּיד אֵשׁ évoque une torche en feu, tandis que עָמִיר peut désigner des gerbes ou un amas de tiges. « Gerbes » conserve l’image agricole concrète.
- source_word: וְאָכְלוּ
  choice: ils dévoreront
  rationale: Le verbe « manger » est ici métaphorique. « Dévoreront » exprime la destruction tout en prolongeant naturellement les images du feu.
- source_word: עַל יָמִין וְעַל שְׂמֹאול
  choice: à droite et à gauche
  rationale: Cette formulation française naturelle conserve les deux directions explicites de l’hébreu plutôt que de les généraliser en « de tous côtés ».
- source_word: אֶת כָּל הָעַמִּים סָבִיב
  choice: tous les peuples environnants
  rationale: עַמִּים désigne ici des peuples, et סָבִיב indique qu’ils se trouvent autour de Juda et de Jérusalem.
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם עוֹד
  choice: Jérusalem habitera de nouveau
  rationale: Le verbe יָשַׁב signifie habiter, demeurer ou s’établir. Cette traduction garde la personnification prophétique de la ville et la valeur de répétition ou de restauration portée par עוֹד.
- source_word: תַּחְתֶּיהָ
  choice: à sa place
  rationale: L’expression signifie littéralement « sous elle-même » et fonctionne ici comme un idiome indiquant que Jérusalem demeurera ou sera rétablie à son propre emplacement.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La répétition du nom de la ville est conservée, malgré son caractère inhabituel en français, afin de respecter l’insistance rhétorique de l’hébreu.
theological_decisions:
- issue: Identité des אַלֻּפֵי יְהוּדָה
  choice: les chefs de Juda, compris comme représentants des groupes de Juda
  alternative: les clans de Juda
  rationale: Le terme peut désigner des chefs ou, par extension, des unités claniques. « Chefs » correspond à son sens personnel fréquent et à la reprise verbale masculine, tandis qu’une note préserve la lecture collective sans limiter la portée de l’action divine aux seuls dirigeants.
translation_notes:
  register: Français international moderne, clair et digne. Les images concrètes du feu, du bois et des gerbes sont maintenues. La personnification de Jérusalem ainsi que la répétition finale « à Jérusalem » sont conservées pour refléter la forme et l’insistance du texte hébreu.
