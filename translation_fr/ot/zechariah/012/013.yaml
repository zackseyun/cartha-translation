source:
  edition: WLC
  text: מִשְׁפַּ֤חַת בֵּית לֵוִי֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָ֑ד מִשְׁפַּ֤חַת הַ/שִּׁמְעִי֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/013.yaml
  text: the family of the house of Levi by itself[a], and their wives by themselves; the family of the Shimeites by itself, and their wives by themselves.
translation:
  language: fr
  text: la famille de la maison de Lévi à part, et leurs femmes à part ; la famille des Shiméites[a] à part, et leurs femmes à part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la famille de Shiméi ». L’hébreu désigne probablement le clan des descendants de Shiméi.'
    reason: Alternative lexicale pour le gentilé הַשִּׁמְעִי.
lexical_decisions:
- source_word: מִשְׁפַּחַת
  choice: la famille de / des
  rationale: Le nom à l’état construit introduit chacun des groupes nommés. « Famille » reste naturel en français et peut désigner ici un groupe de parenté étendu, sans imposer le terme plus précis « clan ».
- source_word: בֵּית לֵוִי
  choice: la maison de Lévi
  rationale: בֵּית suivi du nom propre exprime une maison ou une lignée. La traduction explicite conserve cette dimension généalogique.
- source_word: לְבָד
  choice: à part
  rationale: La répétition souligne que chaque groupe mène son deuil séparément. « À part » est idiomatique et permet de préserver la cadence insistante de l’hébreu.
- source_word: וּנְשֵׁיהֶם
  choice: et leurs femmes
  rationale: נָשִׁים peut signifier « femmes » ou « épouses ». Dans ce cadre familial, le français « leurs femmes » garde une légère ouverture lexicale tout en évoquant naturellement les épouses.
- source_word: הַשִּׁמְעִי
  choice: les Shiméites
  rationale: La forme avec article est un gentilé collectif désignant le groupe issu de Shiméi ou associé à lui. « Shiméites » rend directement cette valeur collective.
theological_decisions:
- issue: Séparation entre les groupes familiaux et leurs femmes dans le deuil
  choice: Conserver explicitement « la famille… à part, et leurs femmes à part »
  alternative: Chaque famille à part, les hommes et les femmes séparément
  rationale: L’hébreu distingue expressément les groupes familiaux de leurs femmes. La formulation retenue préserve cette distinction et la répétition sans ajouter le mot « hommes », absent du texte.
translation_notes:
  register: 'Français international moderne, sobre et digne. La répétition de « à part » est volontaire : elle reproduit la structure insistante du texte hébreu et le motif du deuil séparé.'
