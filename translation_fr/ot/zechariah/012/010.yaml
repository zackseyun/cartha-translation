source:
  edition: WLC
  text: וְ/שָׁפַכְתִּי֩ עַל בֵּ֨ית דָּוִ֜יד וְ/עַ֣ל יוֹשֵׁ֣ב יְרוּשָׁלִַ֗ם ר֤וּחַ חֵן֙ וְ/תַ֣חֲנוּנִ֔ים וְ/הִבִּ֥יטוּ אֵלַ֖/י אֵ֣ת אֲשֶׁר דָּקָ֑רוּ וְ/סָפְד֣וּ עָלָ֗י/ו כְּ/מִסְפֵּד֙ עַל הַ/יָּחִ֔יד וְ/הָמֵ֥ר עָלָ֖י/ו כְּ/הָמֵ֥ר עַֽל הַ/בְּכֽוֹר־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/010.yaml
  text: And I will pour out on the house of David and on the inhabitants of Jerusalem a spirit of grace and pleas for mercy[a], and they will look to me, the one whom they pierced, and they will mourn for him as one mourns for an only son[c][b], and weep bitterly for him as one weeps bitterly for a firstborn.
translation:
  language: fr
  text: Je répandrai sur la maison de David et sur les habitants de Jérusalem un esprit de grâce et de supplications[a]. Ils regarderont vers moi[b], celui qu’ils ont transpercé, et ils se lamenteront sur lui comme on se lamente sur un fils unique[c] ; ils pleureront amèrement sur lui comme on pleure amèrement sur un premier-né.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit de faveur et de prières pour obtenir grâce ».'
    reason: Alternative lexicale permettant d’entendre חֵן comme faveur et תַחֲנוּנִים comme appels à la grâce ou à la compassion.
  - marker: b
    text: 'Ou : « ils me regarderont ».'
    reason: Alternative française plus directe pour וְהִבִּיטוּ אֵלַי ; « vers moi » met davantage en relief l’orientation exprimée par la préposition hébraïque.
  - marker: c
    text: 'Ou : « un enfant unique ».'
    reason: יָחִיד peut désigner l’enfant unique sans préciser lexicalement son sexe, même si le contexte emploie ici une image masculine.
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Je répandrai
  rationale: « Répandre » conserve la métaphore d’un don divin abondant et convient naturellement avec « esprit ».
- source_word: עַל בֵּית דָּוִיד וְעַל יוֹשֵׁב יְרוּשָׁלִַם
  choice: sur la maison de David et sur les habitants de Jérusalem
  rationale: Le participe morphologiquement singulier יוֹשֵׁב a ici une valeur collective, rendue naturellement au pluriel en français.
- source_word: רוּחַ חֵן וְתַחֲנוּנִים
  choice: un esprit de grâce et de supplications
  rationale: La minuscule préserve l’ambiguïté entre une disposition suscitée par Dieu et une référence plus précise à l’Esprit. Le pluriel « supplications » reflète celui de l’hébreu et exprime des appels pressants à la faveur divine.
- source_word: וְהִבִּיטוּ אֵלַי
  choice: Ils tourneront les regards vers moi
  rationale: Cette formulation naturelle exprime l’attention dirigée vers le locuteur que marque la préposition אֶל, sans réduire le verbe à une simple perception visuelle.
- source_word: אֵת אֲשֶׁר דָּקָרוּ
  choice: celui qu’ils ont transpercé
  rationale: « Celui que » explicite en français le référent personnel introduit comme objet de la relative, tandis que « transpercé » rend le sens fort de דקר.
- source_word: וְסָפְדוּ עָלָיו
  choice: ils se lamenteront sur lui
  rationale: Le verbe désigne le deuil et la lamentation, souvent à propos d’un mort. « Sur lui » conserve aussi la préposition et rend visible le passage à la troisième personne.
- source_word: הַיָּחִיד
  choice: un fils unique
  rationale: Dans ce contexte de deuil, le terme désigne un enfant unique ; le masculin du contexte et le parallélisme justifient « fils unique ».
- source_word: וְהָמֵר עָלָיו
  choice: ils pleureront amèrement sur lui
  rationale: La tournure exprime clairement l’intensité de la douleur et s’accorde avec le parallélisme funèbre.
- source_word: הַבְּכוֹר
  choice: un fils premier-né
  rationale: Cette expression conserve la notion précise de premier-né et le parallélisme masculin avec « fils unique ».
theological_decisions:
- issue: Passage de la première personne (« moi ») à la troisième personne (« lui »)
  choice: 'Conserver : « vers moi, celui qu’ils ont transpercé […] sur lui »'
  alternative: Harmoniser les pronoms en mettant partout « moi » ou partout « lui »
  rationale: Le texte massorétique présente ce changement frappant de personne. La traduction le maintient afin de préserver la tension réelle du texte sans la résoudre par une harmonisation interprétative.
- issue: Identification de רוּחַ avec le Saint-Esprit
  choice: Écrire « un esprit » avec une minuscule
  alternative: Écrire « l’Esprit » ou « un Esprit » avec une majuscule
  rationale: Le contexte permet une action spirituelle divine, mais la forme hébraïque ne contraint pas à identifier explicitement le référent au Saint-Esprit. La minuscule conserve cette ouverture.
- issue: Lecture christologique ultérieure
  choice: Traduire directement le texte hébreu sans ajouter d’identification messianique explicite
  alternative: Introduire dans le verset une désignation explicite du Messie
  rationale: La formulation reste compatible avec son emploi christologique ultérieur, tout en évitant d’ajouter au texte source une précision interprétative absente de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Les termes « supplications », « transpercé » et « premier-né » gardent la gravité poétique du passage sans archaïsmes syntaxiques. La ponctuation sépare les deux mouvements du deuil tout en conservant leur parallélisme.
