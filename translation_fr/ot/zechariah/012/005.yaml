id: ZEC.12.5
reference: Zechariah 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָֽמְר֛וּ אַלֻּפֵ֥י יְהוּדָ֖ה בְּ/לִבָּ֑/ם אַמְצָ֥ה לִ/י֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם בַּ/יהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/005.yaml
  text: Then the clans of Judah will say in their hearts[a], ‘The inhabitants of Jerusalem are my strength in Yahweh of Armies[b], their God.’
translation:
  language: fr
  text: 'Alors les chefs de Juda[a] se diront en eux-mêmes : « Les habitants de Jérusalem sont pour moi une force en Yahweh des armées, leur Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les clans de Juda ». Le mot hébreu peut désigner les chefs de clan ou, par extension, les clans eux-mêmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « sont pour moi une force grâce à Yahweh des armées, leur Dieu ». La préposition hébraïque peut exprimer la sphère (« en ») ou le moyen et le fondement (« grâce à », « par »).
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Alors … se diront
  rationale: Dans cette annonce prophétique, la conjonction introduit l’étape suivante. Le verbe associé à בְּלִבָּם désigne ici une parole intérieure ; « se diront » l’exprime naturellement.
- source_word: אַלֻּפֵי יְהוּדָה
  choice: les chefs de Juda
  rationale: אַלּוּף désigne couramment un chef de clan. Le contexte de Zacharie 12 favorise les personnes dirigeantes, tout en laissant possible une référence aux clans comme unités sociales.
- source_word: בְּלִבָּם
  choice: en eux-mêmes
  rationale: Littéralement « dans leur cœur » ; l’expression hébraïque décrit ici ce qu’ils se disent intérieurement. La formulation française évite de suggérer un seul cœur collectif.
- source_word: אַמְצָה לִי
  choice: sont pour moi une force
  rationale: La tournure conserve le singulier distributif לִי, chaque chef parlant pour lui-même, ainsi que le sens de force ou d’appui de אַמְצָה.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Rendu français usuel de la construction participiale désignant les personnes qui résident dans la ville.
- source_word: בַּיהוָה צְבָאוֹת
  choice: en Yahweh des armées
  rationale: « En » préserve la valeur possible de sphère ou de fondement de la préposition בְּ. « Yahweh » rend le nom divin, et « des armées » garde la force concrète de צְבָאוֹת.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le possessif pluriel renvoie naturellement aux habitants de Jérusalem.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le distingue du titre אֲדֹנָי sans ajouter d’interprétation confessionnelle.
- issue: Portée de בְּ dans בַּיהוָה צְבָאוֹת
  choice: en Yahweh des armées
  alternative: grâce à Yahweh des armées / par Yahweh des armées
  rationale: La préposition peut indiquer la sphère, le fondement ou le moyen. Le texte principal retient le rendu formel « en », tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et lisible. Le discours intérieur est rendu idiomatiquement, tandis que le singulier « pour moi » et l’ambiguïté de la préposition hébraïque sont conservés.
