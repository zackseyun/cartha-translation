source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יָגֵ֤ן יְהוָה֙ בְּעַד֙ יוֹשֵׁ֣ב יְרוּשָׁלִַ֔ם וְ/הָיָ֞ה הַ/נִּכְשָׁ֥ל בָּ/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/דָוִ֑יד וּ/בֵ֤ית דָּוִיד֙ כֵּֽ/אלֹהִ֔ים כְּ/מַלְאַ֥ךְ יְהוָ֖ה לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/008.yaml
  text: On that day Yahweh will shield the inhabitants of Jerusalem[a], and the one who stumbles among them on that day will be like David, and the house of David like God, like the angel of Yahweh before them.
translation:
  language: fr
  text: En ce jour-là, Yahweh protégera les habitants de Jérusalem. En ce jour-là, celui qui chancelle parmi eux sera comme David, et la maison de David sera comme Dieu[a], comme l’ange de Yahweh devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des dieux » ou « comme des êtres divins ». Le mot hébreu אֱלֹהִים peut avoir ces sens dans certains contextes, bien qu’ici la comparaison au singulier soit probablement visée.
    reason: alternative_reading
lexical_decisions:
- source_word: יָגֵן
  choice: protégera
  rationale: Le verbe évoque l’action de couvrir ou de défendre comme avec un bouclier. « Protégera » exprime naturellement cette défense en français sans surcharger la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: בְּעַד
  choice: les habitants de Jérusalem comme complément de « protégera »
  rationale: Avec יָגֵן, la préposition indique les personnes au bénéfice desquelles s’exerce la protection; cette relation est directement exprimée par la construction française.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Le participe singulier a ici une valeur collective. Le pluriel français en restitue naturellement le sens.
- source_word: הַנִּכְשָׁל
  choice: celui qui chancelle
  rationale: Le participe peut décrire celui qui trébuche, faiblit ou vacille. « Chancelle » conserve l’image concrète tout en laissant entendre la faiblesse.
- source_word: בָּהֶם
  choice: parmi eux
  rationale: La préposition situe cette personne au sein de la population de Jérusalem.
- source_word: כְּדָוִיד
  choice: comme David
  rationale: Cette formulation française rend directement la comparaison avec David.
- source_word: בֵּית דָּוִיד
  choice: la maison de David
  rationale: L’expression consacrée conserve à la fois les dimensions familiale et dynastique de l’hébreu.
- source_word: כֵּאלֹהִים
  choice: comme Dieu
  rationale: Dans ce contexte, le parallèle avec « l’ange de Yahweh » favorise une comparaison singulière, tout en laissant subsister l’ambiguïté lexicale signalée en note.
- source_word: כְּמַלְאַךְ יְהוָה
  choice: comme l’ange de Yahweh
  rationale: Dans cette expression biblique récurrente, « ange » rend le sens surnaturel probable de מַלְאָךְ et préserve les échos intertextuels.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: 'La traduction formellement proche maintient ouverte la nuance précise: position en tête, conduite ou présence qui précède.'
theological_decisions:
- issue: Sens de אֱלֹהִים dans la comparaison concernant la maison de David
  choice: « Dieu » au singulier
  alternative: « des dieux » ou « des êtres divins »
  rationale: Le parallèle immédiat avec « l’ange de Yahweh devant eux » rend probable une comparaison singulière et exaltée. La note conserve néanmoins les autres sens possibles du terme hébreu et ne neutralise pas la hardiesse théologique de l’image.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « En ce jour-là » est conservée pour refléter l’insistance du texte hébreu. « Devant eux » reste volontairement sobre afin de ne pas préciser indûment s’il s’agit de les conduire, de marcher en tête ou de se tenir en leur présence.
