  naturalness: Le français est globalement fluide et d’un registre visionnaire moderne approprié. « Et c’était une femme, assise dans l’épha » est plus direct et plus fidèle que « il y avait là une femme assise au milieu de l’épha », sans alourdir la phrase.
  terminology: « Épha » est le terme culturel adéquat; la note explique utilement la mesure et le récipient. « Disque de plomb » conserve la valeur concrète de כִּכָּר sans imposer « couvercle » dans le texte. Les alternatives de la note sont acceptables; « poids rond de plomb » est légèrement plus idiomatique que « poids rond en plomb ».
