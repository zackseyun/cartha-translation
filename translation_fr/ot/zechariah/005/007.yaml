  text: And behold[a], a lead disk was lifted up[b], and this was one woman sitting inside the ephah.
translation:
  language: fr
  text: Et voici qu’un disque de plomb[a] fut soulevé, et c’était une femme assise dans l’épha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une masse ronde de plomb », « un poids rond de plomb » ou, plus littéralement, « un talent de plomb ». L’expression hébraïque peut désigner une lourde masse arrondie; ici, elle semble servir de couvercle à l’épha.
    reason: lexical_alternative
  - marker: b
    text: L’épha était une mesure de capacité pour les matières sèches et, par extension, le récipient utilisé pour cette mesure; on peut donc aussi traduire par « panier » ou « corbeille ».
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve l’effet déictique vif qui introduit soudain un nouvel élément de la vision, dans un français narratif digne et naturel.
- source_word: כִּכַּר עֹפֶרֶת
  choice: un disque de plomb
  rationale: כִּכָּר désigne ici une masse arrondie de plomb, vraisemblablement employée comme couvercle de l’épha. « Disque » préserve mieux l’image concrète sans réduire le terme à sa fonction contextuelle.
- source_word: נִשֵּׂאת
  choice: fut soulevé
  rationale: Rend la valeur passive du participe niphal et le mouvement visible de l’objet dans la scène.
- source_word: וְזֹאת אִשָּׁה אַחַת
  choice: et il y avait là une femme
  rationale: Formulation française naturelle pour la proposition nominale qui révèle la femme. Le numéral אַחַת individualise ici la femme; le français idiomatique « une femme » conserve cette valeur sans la suraccentuer.
- source_word: יוֹשֶׁבֶת
  choice: assise
  rationale: Décrit directement la posture de la femme dans le récipient.
- source_word: בְּתוֹךְ הָאֵיפָה
  choice: au milieu de l’épha
  rationale: Rend explicitement בְּתוֹךְ tout en conservant le terme culturel précis אֵיפָה, mesure de capacité et, par extension, récipient correspondant.
