  yaml_path: translation/ot/zechariah/005/010.yaml
  text: Then I said to the angel who was speaking with me[a], “Where are they taking the ephah?”
translation:
  language: fr
  text: 'Alors je dis à l’ange qui me parlait : « Où emmènent-elles l’épha[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le panier » ou « le panier de mesure ». L’hébreu dit « l’épha », une mesure de capacité pour les matières sèches ; ici, le mot désigne le récipient vu dans la vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors je demandai
  rationale: Le wayyiqtol fait progresser le récit. En contexte, le discours direct est une question ; « je demandai » est donc naturel en français et explicite sans modifier le contenu.
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: מַלְאָךְ peut désigner un messager, mais, dans cette vision de Zacharie, il s’agit du messager céleste qui interprète la vision ; « ange » est le terme français le plus clair.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: Cette formule récurrente dans Zacharie signifie idiomatiquement « parler avec/à quelqu’un ». L’imparfait rend l’action continue exprimée par le participe.
- source_word: אָנָה
  choice: Où
  rationale: L’adverbe interroge sur la destination. En français moderne, « où » exprime naturellement « vers quel endroit ».
- source_word: הֵמָּה
  choice: elles
  rationale: Le pronom féminin pluriel renvoie aux deux femmes du verset précédent. Le français exige ici « elles ».
- source_word: מוֹלִכוֹת
  choice: emportent-elles
  rationale: Le participe hiphil féminin pluriel de הלך décrit le transport de l’épha vers une destination. « Emporter » convient à un objet déplacé au loin et s’intègre naturellement à la question.
- source_word: אֶת הָאֵיפָה
  choice: l’épha
  rationale: אֵיפָה désigne d’abord une mesure de capacité pour les matières sèches et, par métonymie dans la vision, le récipient correspondant. Conserver « épha » maintient le terme concret et la continuité du passage ; une note l’explique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’inversion « emportent-elles » convient au discours direct écrit sans être archaïque. Le terme technique « épha » est conservé et expliqué en note.
