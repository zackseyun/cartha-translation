base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/005.yaml
  text: Then the angel who was speaking with me went out and said to me[c][b][a], “Please lift up your eyes and see what this is that is coming out.”
translation:
  language: fr
  text: 'Puis l’ange qui me parlait[b] sortit[a] et me dit : « Je t’en prie, lève les yeux et regarde ce qui est en train de sortir[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’avança » ou « apparut » ; le verbe hébreu est le verbe courant signifiant « sortir », sans indiquer à lui seul la direction par rapport à l’observateur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui parlait en moi » ; dans cette tournure propre aux visions de Zacharie, le sens est « qui me parlait » ou « qui parlait avec moi ».'
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction possible : « et vois ce qui sort » ou « et vois : qu’est-ce donc que cette chose qui sort ? » La construction hébraïque peut mettre davantage l’accent sur l’identification de ce qui apparaît.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יָצָא exprime fondamentalement le fait de sortir. « Sortit » conserve ce mouvement sans préciser, au-delà du contexte, s’il s’agit de s’éloigner ou d’apparaître.
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste ; dans ce récit de vision, il s’agit de l’être céleste qui dialogue avec le prophète.
- source_word: הַדֹּבֵר בִּי
  choice: qui me parlait
  rationale: Bien que la préposition בְּ signifie littéralement « en », la tournure récurrente de Zacharie désigne ici l’ange qui parle avec le prophète. L’imparfait rend naturellement la valeur durative du participe.
- source_word: וַיֹּאמֶר אֵלַי
  choice: et me dit
  rationale: Formulation narrative française naturelle correspondant à « et il dit à moi ».
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Lève donc les yeux
  rationale: Cette formulation conserve l’image hébraïque. « Donc » rend avec discrétion la particule נָא, qui adoucit ou sollicite l’exécution de l’ordre, sans imposer le registre plus appuyé de « s’il te plaît ».
- source_word: וּרְאֵה
  choice: et regarde
  rationale: Dans ce contexte visionnaire, « regarde » exprime l’attention visuelle demandée au prophète.
- source_word: מָה הַיּוֹצֵאת הַזֹּאת
  choice: ce qui est en train de sortir
  rationale: Cette tournure française naturelle présente l’objet encore non identifié tout en rendant l’action en cours exprimée par le participe féminin.
