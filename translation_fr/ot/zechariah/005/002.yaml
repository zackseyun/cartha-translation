base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/002.yaml
  text: And he said to me[a], “What do you see?” And I said, “I see a flying scroll. Its length is twenty cubits, and its width is ten cubits.”
translation:
  language: fr
  text: 'Il me dit : « Que vois-tu ? » Je répondis : « Je vois un rouleau qui vole. Sa longueur est de vingt coudées[a], et sa largeur de dix coudées. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une unité de longueur courante dans l’Antiquité, correspondant approximativement à la distance entre le coude et le bout des doigts.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Il me dit
  rationale: Le waw consécutif fait avancer le récit. Le français peut rendre naturellement cette succession sans ajouter un connecteur temporel explicite.
- source_word: מָה אַתָּה רֹאֶה
  choice: Que vois-tu ?
  rationale: Le participe רֹאֶה exprime ici une perception présente ; cette formulation est à la fois directe et naturelle en français.
- source_word: וָאֹמַר אֲנִי רֹאֶה
  choice: 'Je répondis : « Je vois'
  rationale: Dans ce dialogue, « répondis » rend naturellement l’acte de parole introduisant la réponse, tandis que « je vois » conserve la valeur présente du participe.
- source_word: מְגִלָּה
  choice: rouleau
  rationale: מְגִלָּה désigne un document enroulé. « Rouleau » est le terme français courant et précis dans ce contexte ancien.
- source_word: עָפָה
  choice: qui vole
  rationale: Le participe féminin qualifie le rouleau et décrit son mouvement. La proposition relative est plus naturelle en français que « un rouleau volant ».
- source_word: אָרְכָּהּ
  choice: Sa longueur
  rationale: Le terme désigne explicitement la dimension longitudinale du rouleau.
- source_word: עֶשְׂרִים בָּאַמָּה
  choice: vingt coudées
  rationale: La coudée est conservée comme unité ancienne afin de respecter le cadre culturel et la précision du texte source.
- source_word: וְרָחְבָּהּ
  choice: et sa largeur
  rationale: « Largeur » rend directement le contraste dimensionnel avec « longueur ».
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dix coudées
  rationale: L’unité originale est conservée de manière cohérente, sans conversion moderne approximative dans le corps du texte.
