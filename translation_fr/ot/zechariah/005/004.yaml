  text: הוֹצֵאתִ֗י/הָ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/בָ֨אָה֙ אֶל בֵּ֣ית הַ/גַּנָּ֔ב וְ/אֶל בֵּ֛ית הַ/נִּשְׁבָּ֥ע בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/לָ֨נֶה֙ בְּ/ת֣וֹךְ בֵּית֔/וֹ וְ/כִלַּ֖תּ/וּ וְ/אֶת עֵצָ֥י/ו וְ/אֶת אֲבָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/004.yaml
  text: I have sent it out[a], declares Yahweh of hosts, and it will enter the house of the thief and the house of the one who swears falsely by my name, and it will remain within his house and consume it[b], both its timber and its stones.
translation:
  language: fr
  text: « Je l’ai fait sortir[a], déclare Yahweh des armées. Elle entrera dans la maison du voleur et dans la maison de celui qui jure faussement par mon nom. Elle demeurera[b] à l’intérieur de sa maison et la consumera, avec son bois et ses pierres. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je l’ai fait paraître ». Le verbe hébreu signifie littéralement « faire sortir »; ici, il présente la malédiction comme envoyée pour accomplir son œuvre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Elle y logera » ou « Elle y passera la nuit ». Le verbe hébreu souligne qu’elle ne fera pas qu’entrer dans la maison, mais qu’elle y restera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִיהָ
  choice: Je l’ai fait sortir
  rationale: Le hifil de יצא exprime l’action de faire sortir ou de mettre en mouvement. Le pronom féminin renvoie vraisemblablement à la malédiction mentionnée au verset précédent.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahweh des armées
  rationale: « Déclare » rend naturellement la formule prophétique נְאֻם. « Yahweh » transcrit le nom divin, et « des armées » rend concrètement צְבָאוֹת.
- source_word: וּבָאָה
  choice: Elle entrera
  rationale: Avec אֶל suivi de « maison », le verbe de mouvement indique ici l’entrée dans le bâtiment. Le féminin hébreu est conservé en référence à la malédiction.
- source_word: בֵּית הַגַּנָּב
  choice: la maison du voleur
  rationale: גַּנָּב désigne directement celui qui vole; « voleur » est le terme français courant et précis.
- source_word: הַנִּשְׁבָּע בִּשְׁמִי לַשָּׁקֶר
  choice: l’homme qui prête un faux serment en mon nom
  rationale: Cette formulation rend le participe et l’usage mensonger du nom divin sans réduire l’expression au seul cadre judiciaire du parjure.
- source_word: וְלָנֶה
  choice: Elle demeurera
  rationale: לון peut évoquer le fait de loger ou de passer la nuit; dans ce contexte, « demeurera » exprime la présence persistante de la malédiction dans la maison.
- source_word: בְּתוֹךְ בֵּיתוֹ
  choice: à l’intérieur de sa maison
  rationale: בְּתוֹךְ marque nettement la localisation interne, rendue ici en français courant.
- source_word: וְכִלַּתּוּ
  choice: et la consumera
  rationale: Le piel de כלה exprime l’achèvement, l’épuisement ou la destruction complète. « Consumera » conserve l’image saisissante d’une malédiction qui détruit toute la maison.
- source_word: עֵצָיו
  choice: sa charpente
  rationale: Dans le contexte d’une maison, le pluriel désigne ses éléments de bois; « charpente » est naturel sans limiter nécessairement le sens à de simples poutres.
- source_word: אֲבָנָיו
  choice: ses pierres
  rationale: La traduction concrète du pluriel souligne que la destruction atteint jusqu’aux matériaux de la maison.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel de Dieu sans le remplacer par un titre.
- issue: Référent des formes féminines הוֹצֵאתִיהָ et וּבָאָה
  choice: la malédiction, reprise par « l’ » puis « elle »
  alternative: le rouleau volant
  rationale: La proximité de הָאָלָה, « la malédiction », au verset précédent et le genre féminin des formes verbales et pronominales favorisent ce référent, tout en laissant le rouleau comme support visible de cette malédiction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression solennelle de l’oracle. Le féminin « elle » reprend la malédiction du contexte immédiat; « celle de l’homme » évite une répétition lourde de « maison » tout en gardant le parallélisme.
