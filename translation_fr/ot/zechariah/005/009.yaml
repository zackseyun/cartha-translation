  text: וָ/אֶשָּׂ֨א עֵינַ֜/י וָ/אֵ֗רֶא וְ/הִנֵּה֩ שְׁתַּ֨יִם נָשִׁ֤ים יֽוֹצְאוֹת֙ וְ/ר֣וּחַ בְּ/כַנְפֵי/הֶ֔ם וְ/לָ/הֵ֥נָּה כְנָפַ֖יִם כְּ/כַנְפֵ֣י הַ/חֲסִידָ֑ה וַ/תִּשֶּׂ֨אנָה֙ אֶת הָ֣/אֵיפָ֔ה בֵּ֥ין הָ/אָ֖רֶץ וּ/בֵ֥ין הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/009.yaml
  text: Then I lifted up my eyes and saw[a], and behold, two women were coming out, and the wind was in their wings. They had wings like the wings of a stork[b], and they lifted up the ephah between the earth and the heavens.
translation:
  language: fr
  text: 'Puis, je levai les yeux et je vis : voici, deux femmes sortaient, et le vent[a] était dans leurs ailes. Elles avaient des ailes semblables à celles de la cigogne, et elles soulevèrent l’épha[b] entre la terre et les cieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : un esprit était dans leurs ailes.'
    reason: ambiguïté lexicale de רוּחַ
  - marker: b
    text: L’épha était une unité de mesure pour les matières sèches ; ici, le mot désigne le récipient vu dans la vision.
    reason: clarification d’un terme ancien
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Puis je levai les yeux
  rationale: Conserve l’image hébraïque propre au récit de vision, tout en employant une tournure française claire; « Puis » rend la progression narrative.
- source_word: וָאֵרֶא וְהִנֵּה
  choice: et regardai. Et voici
  rationale: « Regarder » convient ici à l’acte volontaire d’observer la vision; « voici » maintient la force présentative et vive de הִנֵּה.
- source_word: שְׁתַּיִם נָשִׁים יֹצְאוֹת
  choice: deux femmes sortaient
  rationale: Le participe décrit une action en cours dans la scène; le genre féminin et le nombre sont explicitement conservés.
- source_word: וְרוּחַ בְּכַנְפֵיהֶם
  choice: et le vent était dans leurs ailes
  rationale: Dans ce contexte d’ailes et de transport aérien, רוּחַ désigne très probablement le vent. La formulation reste proche de l’image inhabituelle de l’hébreu plutôt que de l’expliquer par « soufflait ».
- source_word: וְלָהֵנָּה כְנָפַיִם כְּכַנְפֵי הַחֲסִידָה
  choice: Elles avaient des ailes semblables à celles de la cigogne
  rationale: La construction possessive est rendue idiomatiquement en français, et la comparaison concrète avec la cigogne est maintenue.
- source_word: וַתִּשֶּׂאנָה אֶת־הָאֵיפָה
  choice: elles soulevèrent l’épha
  rationale: נשׂא exprime ici le soulèvement de l’objet en vue de son transport. Le terme technique אֵיפָה est translittéré afin de préserver l’image récurrente du passage, avec explication en note.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמָיִם
  choice: entre la terre et les cieux
  rationale: La formulation conserve le contraste cosmique ainsi que la forme plurielle traditionnelle de שָׁמַיִם, tout en signalant en note l’expression française plus courante.
theological_decisions:
- issue: Sens de רוּחַ dans la scène de transport visionnaire
  choice: le vent
  alternative: l’esprit / l’Esprit
  rationale: Les ailes, la comparaison avec la cigogne et le soulèvement de l’épha favorisent le sens physique de « vent ». Une note préserve néanmoins l’ambiguïté lexicale sans imposer une interprétation théologique.
- issue: Désignation de l’objet par אֵיפָה
  choice: l’épha
  alternative: le panier de mesure
  rationale: Le mot désigne d’abord une unité de mesure de matières sèches et, dans cette vision, le récipient correspondant. La translittération préserve la continuité lexicale du symbole; la note donne l’information nécessaire au lecteur.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve les traits visuels saillants et certaines formulations concrètes de l’hébreu, sans archaïsmes inutiles. Les notes sont placées exactement sur les termes qu’elles expliquent; elles corrigent ainsi le décalage apparent des marqueurs dans la couche anglaise fournie.
