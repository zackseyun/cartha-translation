  text: וָ/אֹמַ֖ר מַה הִ֑יא וַ/יֹּ֗אמֶר זֹ֤את הָֽ/אֵיפָה֙ הַ/יּוֹצֵ֔את וַ/יֹּ֕אמֶר זֹ֥את עֵינָ֖/ם בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/006.yaml
  text: And I said[a], “What is it?” And he said, “This is the basket that is going out.” And he said[b], “This is their appearance in all the land.”
translation:
  language: fr
  text: 'Je demandai : « Qu’est-ce que c’est ? » Il répondit : « C’est l’épha[a] qui sort. » Puis il ajouta : « C’est leur aspect dans tout le pays[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha était une mesure de capacité pour les matières sèches; le mot peut aussi désigner le récipient servant à mesurer, autrement dit une corbeille de mesure.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur œil dans tout le pays ». On comprend souvent : « leur aspect » ou « ce qu’on voit d’eux ». Selon une autre lecture ou interprétation : « leur iniquité dans tout le pays ». Le mot traduit par « pays » peut aussi signifier « terre » : « sur toute la terre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיפָה
  choice: épha
  rationale: Le mot désigne d’abord une mesure de capacité pour les matières sèches et, par métonymie, le récipient correspondant. « Épha » conserve ici le caractère singulier et mesuré de l’objet de la vision; la note en explicite le sens concret.
- source_word: הַיּוֹצֵאת
  choice: qui sort
  rationale: Le participe défini qualifie l’épha en mouvement. « Qui sort » est naturel en français et conserve l’aspect verbal sans préciser indûment le point de départ ou la destination.
- source_word: עֵינָם
  choice: leur aspect
  rationale: Le texte massorétique porte littéralement « leur œil ». Le sens figuré « aspect », c’est-à-dire ce qui se donne à voir, respecte cette donnée lexicale sans adopter dans le texte principal la lecture alternative « leur faute » ou « leur iniquité ».
- source_word: בְּכָל הָאָרֶץ
  choice: dans tout le pays
  rationale: אֶרֶץ peut désigner le pays ou la terre entière. « Pays » convient au cadre vraisemblable de la vision tout en laissant la note signaler la portée plus large possible.
- source_word: מַה הִיא
  choice: Qu’est-ce que c’est ?
  rationale: Le pronom féminin anticipe le nom féminin אֵיפָה. Le français courant emploie naturellement la tournure neutre « Qu’est-ce que c’est ? » pour interroger sur un objet.
theological_decisions:
- issue: Interprétation de עֵינָם dans la dernière proposition
  choice: « leur aspect » dans le texte principal
  alternative: « leur œil » littéralement; selon une autre lecture ou interprétation, « leur iniquité » ou « leur faute »
  rationale: « Leur aspect » peut dériver du sens du texte massorétique sans correction consonantique. La formulation difficile et l’interprétation moralement chargée « leur iniquité » sont néanmoins conservées en note afin de ne pas effacer l’ambiguïté textuelle et théologique.
- issue: Portée de הָאָרֶץ
  choice: « le pays »
  alternative: « toute la terre »
  rationale: Le terme hébreu permet les deux portées. Le contexte peut viser le pays, mais la possibilité d’une portée universelle est signalée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à la narration prophétique écrite sans archaïsme excessif. La répétition des prises de parole hébraïques est conservée par « Il répondit » puis « il ajouta », avec une légère variation idiomatique. Le terme technique « épha » est maintenu et immédiatement expliqué en note.
