  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֹ֚את הָֽ/אָלָ֔ה הַ/יּוֹצֵ֖את עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ כִּ֣י כָל הַ/גֹּנֵ֗ב מִ/זֶּה֙ כָּמ֣וֹ/הָ נִקָּ֔ה וְ/כָל הַ/נִּ֨שְׁבָּ֔ע מִ/זֶּ֖ה כָּמ֥וֹ/הָ נִקָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/003.yaml
  text: Then he said to me[a], “This is the curse that goes out over the face of the whole land, for everyone who steals will be purged away according to what is written on this side of it[c][b], and everyone who swears falsely will be purged away according to what is written on that side of it.”
translation:
  language: fr
  text: 'Puis il me dit : « Voici la malédiction qui sort sur toute l’étendue du pays[a]. En effet, quiconque vole sera éliminé[c] selon ce qui est écrit sur un côté du rouleau[b], et quiconque prête serment sera éliminé selon ce qui est écrit sur l’autre côté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur toute l’étendue de la terre ». Le mot hébreu peut désigner soit un pays, soit la terre.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement, l’hébreu dit approximativement : « de ce côté, conformément à elle … de cet autre côté, conformément à elle ». Il s’agit probablement des inscriptions figurant sur les deux côtés du rouleau volant.'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu peut aussi être compris comme « être acquitté », « être déclaré innocent » ou « être libéré ». Dans ce contexte de malédiction, il désigne vraisemblablement l’élimination du coupable.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: la malédiction
  rationale: Dans cette vision de jugement, אָלָה désigne la malédiction liée à la violation d’un engagement, plutôt qu’un simple serment.
- source_word: הַיּוֹצֵאת
  choice: qui se répand
  rationale: Le participe exprime une action en cours. « Se répand » rend naturellement en français le mouvement de la malédiction qui sort et parcourt le pays.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: sur toute l’étendue du pays
  rationale: L’expression idiomatique עַל־פְּנֵי signifie « sur toute la surface de ». « Pays » convient au cadre immédiat, tout en signalant en note la possibilité de « terre ».
- source_word: הַגֹּנֵב
  choice: quiconque vole
  rationale: Le participe substantivé a une portée générale, rendue clairement par « quiconque vole ».
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: selon ce qui est écrit sur un côté du rouleau
  rationale: L’hébreu est elliptique, littéralement proche de « de ce côté, conformément à elle ». Le contexte du rouleau permet d’expliciter prudemment l’inscription sur ses côtés; cette difficulté est conservée en note.
- source_word: נִקָּה
  choice: sera retranché
  rationale: Bien que נקה puisse évoquer l’innocence ou le fait d’être dégagé, le contexte d’une malédiction punitive appelle ici une élimination judiciaire. « Sera retranché » exprime cette force sans suggérer un acquittement.
- source_word: הַנִּשְׁבָּע
  choice: quiconque prête serment
  rationale: Le texte hébreu dit simplement « celui qui jure ». La traduction n’ajoute pas « faussement », même si le contexte de condamnation implique un serment coupable.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre entière
  rationale: Le jugement vise vraisemblablement la communauté habitant le pays dans le contexte postexilique. La portée plus universelle permise par אֶרֶץ reste indiquée en note.
- issue: Valeur de נִקָּה dans ce contexte de jugement
  choice: sera retranché
  alternative: sera déclaré innocent / sera exempté
  rationale: Une lecture d’acquittement s’accorde mal avec la malédiction dirigée contre les transgresseurs. La traduction retient donc la valeur punitive, tout en signalant la difficulté lexicale.
- issue: Nature du serment condamné
  choice: quiconque prête serment
  alternative: quiconque prête un faux serment
  rationale: Le caractère condamnable du serment ressort du contexte, mais « faussement » n’est pas exprimé dans le participe hébreu de ce verset; il n’est donc pas introduit dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure accessible; « voici » conserve la force présentative de זֹאת. La traduction explicite avec prudence les deux côtés du rouleau, tout en documentant l’ellipse hébraïque et en évitant d’ajouter « faussement » au texte principal.
