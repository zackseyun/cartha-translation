revisions:
- from: 'Puis il me dit : « Voici la malédiction qui se répand sur toute l’étendue du pays[a]. En effet, quiconque vole sera retranché selon ce qui est écrit sur un côté du rouleau[b][c], et quiconque prête serment sera retranché selon ce qui est écrit sur l’autre côté. »'
  to: 'Puis il me dit : « Voici la malédiction qui sort sur toute l’étendue du pays[a]. En effet, quiconque vole sera éliminé[c] selon ce qui est écrit sur un côté du rouleau[b], et quiconque prête serment sera éliminé selon ce qui est écrit sur l’autre côté. »'
  rationale: La révision restitue l’image de la malédiction qui « sort », emploie « sera éliminé » pour conserver la force punitive probable de נִקָּה tout en évitant une connotation excessive, et replace l’appel de note lexicale auprès du terme concerné. Elle conserve l’ambiguïté de הָאָרֶץ en note, ne rajoute pas « faussement » au serment, et maintient l’explicitation prudente des deux côtés du rouleau.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:38:14Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la malédiction en mouvement, la portée possiblement locale de הָאָרֶץ, les deux catégories de transgresseurs et l’ellipse renvoyant vraisemblablement aux deux faces du rouleau. « Prête serment » respecte le fait que le participe hébreu ne porte pas lui-même l’adverbe « faussement ». Toutefois, « se répand » est moins précis que le mouvement de sortie exprimé par הַיּוֹצֵאת, et « retranché » est plus chargé et plus définitif que ne l’exige le Niphal difficile de נקה.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Qui sort » est plus direct et plus proche de l’image visionnaire. « Sera éliminé » rend plus idiomatiquement l’effet judiciaire et punitif sans importer les connotations théologiques particulières de « retranché ».
  terminology: « Malédiction », « pays », « rouleau » et « prêter serment » conviennent. L’explicitation de « ce qui est écrit » et des côtés du rouleau est acceptable à condition d’être clairement signalée par une note comme interprétation probable de l’ellipse. La note sur נקה doit présenter les sens possibles sans suggérer que « être débarrassé » serait une équivalence française appropriée au sujet humain.
  issues:
  - severity: low
    issue: « qui se répand » pour הַיּוֹצֵאת
    rationale: Le participe signifie littéralement « qui sort / qui va sortir ». La malédiction peut ensuite se déployer sur le pays, mais « se répand » déplace légèrement l’image du texte.
  - severity: medium
    issue: « sera retranché » pour נִקָּה
    rationale: Dans ce contexte, le verbe a vraisemblablement une valeur d’élimination judiciaire, mais son sens exact demeure débattu. « Retranché » peut évoquer une sanction technique ou définitive qui n’est pas explicitement formulée; « sera éliminé » est plus sobre.
  - severity: low
    issue: Placement de l’appel de note c
    rationale: La note c concerne la valeur de « sera retranché », mais son appel est actuellement placé après « rouleau ». Il devrait suivre le verbe auquel elle se rapporte.
