  text: וַ/יֹּ֨אמֶר֙ זֹ֣את הָ/רִשְׁעָ֔ה וַ/יַּשְׁלֵ֥ךְ אֹתָ֖/הּ אֶל תּ֣וֹךְ הָֽ/אֵיפָ֑ה וַ/יַּשְׁלֵ֛ךְ אֶת אֶ֥בֶן הָ/עֹפֶ֖רֶת אֶל פִּֽי/הָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/008.yaml
  text: And he said[a], “This is Wickedness,” and he threw her into the middle of the ephah basket[c][b], and he threw the lead weight onto its opening.
translation:
  language: fr
  text: 'Il dit : « C’est la Méchanceté », puis il la jeta au milieu de l’épha[a] et jeta la masse de plomb[b] sur son ouverture[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha était une mesure de capacité pour les matières sèches ; ici, le mot désigne le récipient de la vision.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « la pierre de plomb ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « sur sa bouche », c’est-à-dire sur l’ouverture de l’épha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִשְׁעָה
  choice: la Méchanceté
  rationale: Le nom abstrait féminin défini désigne ici, par personnification, la femme de la vision. La majuscule signale cette personnification sans transformer le terme en « femme méchante ».
- source_word: וַיַּשְׁלֵךְ אֹתָהּ
  choice: il la rejeta
  rationale: Le verbe שׁלך exprime l’action de jeter. Le pronom féminin renvoie à la femme identifiée à la Méchanceté ; « rejeta » convient au mouvement vers l’intérieur du récipient.
- source_word: אֶל תּוֹךְ הָאֵיפָה
  choice: au milieu de l’épha
  rationale: תּוֹךְ garde l’idée de l’intérieur ou du milieu. « Épha » conserve le nom de la mesure-récipient hébraïque, expliqué en note.
- source_word: אֶבֶן הָעֹפֶרֶת
  choice: la masse de plomb
  rationale: Littéralement « pierre de plomb ». Dans cette scène, l’objet est une lourde pièce de plomb ; « masse » rend naturellement sa réalité concrète sans l’identifier explicitement à un couvercle.
- source_word: אֶל פִּיהָ
  choice: sur son ouverture
  rationale: פֶּה signifie littéralement « bouche » ; pour un récipient, « ouverture » est l’équivalent français naturel. Le suffixe féminin renvoie à l’épha.
theological_decisions:
- issue: Personnification du mal dans la vision
  choice: Employer « la Méchanceté » avec une majuscule et reprendre la figure par le pronom féminin « la ».
  alternative: « Voilà la méchanceté » sans majuscule, ou « Voici la femme méchante ».
  rationale: L’hébreu identifie la femme au nom abstrait רִשְׁעָה. Il convient de préserver cette personnification sans réduire l’expression à une simple qualité morale ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure « Voici la Méchanceté » conserve la force d’identification et la personnification. « Épha » évite de préciser arbitrairement la forme du récipient ; la note en explique la fonction.
