    issue: « rejeta » pour וַיַּשְׁלֵךְ אֹתָהּ
    rationale: Le verbe hébreu signifie « jeter/lancer ». En français, « rejeter » peut ajouter l’idée de repousser ou d’expulser, absente du texte, et est moins naturel avec un complément indiquant un mouvement vers l’intérieur. « Jeta » est à la fois plus neutre, plus direct et plus fidèle.
