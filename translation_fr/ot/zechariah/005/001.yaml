translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit visionnaire écrit ; « voici » conserve la vivacité de la présentation hébraïque. La répétition de « je » maintient la netteté de la chaîne verbale sans rendre la phrase artificiellement solennelle.
