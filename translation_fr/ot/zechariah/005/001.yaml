  text: Then I turned and lifted my eyes and saw[a], and behold[b], a flying scroll.
translation:
  language: fr
  text: 'Puis je me retournai[a], je levai les yeux et je vis : voici un rouleau qui volait[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je me retournai de nouveau » ; le verbe hébreu peut aussi signaler le passage à la vision suivante.'
