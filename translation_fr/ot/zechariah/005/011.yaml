    rationale: « Elles vont lui bâtir » explicite les deux femmes du verset précédent, mais לִבְנוֹת est un infinitif de but sans sujet exprimé dans ce verset. « Pour lui bâtir » préserve cette absence de sujet.
  - severity: low
    issue: « répondit » est plus interprétatif que nécessaire
    rationale: Le verbe אמר signifie d’abord « dire ». Même si le contexte peut justifier « répondre », « Il me dit » est plus fidèle et fluide.
  - severity: medium
    issue: La voix passive finale est neutralisée
    rationale: וְהֻנִּיחָה est une forme passive féminine singulière. « Elle y sera déposée » maintient la voix, l’indétermination de l’agent et l’image d’installation.
