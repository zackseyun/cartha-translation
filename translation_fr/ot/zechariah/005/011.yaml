  verdict: revise
  source_fidelity: 'Le projet s’écarte du texte hébreu en transformant l’infinitif de but לִבְנוֹת (« pour bâtir ») en proposition finie avec un sujet explicite (« Elles vont bâtir »). Ce sujet pluriel, bien que suggéré par le contexte précédent, n’est pas exprimé ici. « Il me répondit » est possible contextuellement, mais וַיֹּאמֶר אֵלַי se rend plus directement par « Il me dit ». La passive finale doit être conservée : « elle y sera déposée/placée » rend mieux וְהֻנִּיחָה que le français impersonnel « on la déposera ».'
  naturalness: La révision proposée est naturelle en français international moderne. « Une fois celle-ci préparée » clarifie sans surcharge que le féminin de « préparée » renvoie à la maison, tandis que le second féminin renvoie à la figure personnifiée. « Socle » est idiomatique et concret.
  terminology: « Shinéar » préserve le toponyme hébreu. « Maison », « socle » et « la Méchanceté » conviennent au registre visionnaire et ne forcent pas une lecture cultuelle ou confessionnelle. La note conserve avec prudence l’incertitude du référent féminin dans la clause finale.
  issues:
