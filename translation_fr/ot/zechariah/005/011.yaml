  rationale: La révision rétablit l’infinitif de but sans introduire le sujet pluriel du contexte, rend directement le verbe de parole et conserve la voix passive du texte source. Le démonstratif « celle-ci » distingue clairement la maison, préparée, de la figure féminine ensuite déposée, tout en maintenant dans la note l’ambiguïté reconnue du référent final.
