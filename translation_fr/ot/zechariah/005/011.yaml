base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/011.yaml
  text: And he said to me[a], “To build a house for her in the land of Shinar; and when it is prepared[b], she will be set there on her base.”
translation:
  language: fr
  text: 'Il me dit : « pour lui bâtir une maison au pays de Shinéar ; et, une fois celle-ci préparée, elle y sera déposée sur son socle[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les formes féminines hébraïques peuvent renvoyer à la femme appelée « la Méchanceté » ou, plus abstraitement, à l’épha ou à son contenu : « il y sera déposé sur son socle ». Shinéar est l’ancien nom biblique d’un territoire associé à la Babylonie.'
    reason: alternative_reading_and_historical_context
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Il me répondit
  rationale: Le verbe introduit ici la réponse de l’ange à la question du verset précédent. « Répondit » rend naturellement cette relation dans le contexte, sans perdre la progression narrative.
- source_word: לִבְנוֹת לָהּ בַּיִת
  choice: Elles vont lui bâtir une maison
  rationale: L’infinitif exprime le but du transport accompli par les deux femmes du verset 9. L’explicitation du sujet « elles » est nécessaire en français pour former une phrase complète et le récupère directement du contexte immédiat.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: au pays de Shinéar
  rationale: Le toponyme ancien est conservé plutôt que remplacé par « Babylonie », afin de maintenir ses résonances bibliques. « Au pays de » est idiomatique en français.
- source_word: וְהוּכַן
  choice: Quand elle sera prête
  rationale: Le hophal de כון indique que la maison sera préparée ou rendue prête. En français, « maison » est féminin, d’où « elle », qui renvoie ici à la maison et non à la femme.
- source_word: וְהֻנִּיחָה שָּׁם
  choice: on la déposera là
  rationale: La forme verbale féminine singulière prolonge naturellement la figure féminine personnifiant la Méchanceté. Le sujet agent n’étant pas exprimé, le pronom indéfini « on » évite de l’inventer.
- source_word: עַל מְכֻנָתָהּ
  choice: sur son socle
  rationale: מְכוּנָה désigne une base fixe, un support ou un socle. « Socle » convient à l’image d’une installation tout en restant plus direct et moins interprétatif que « piédestal ».
theological_decisions:
- issue: Référent des formes féminines dans la dernière proposition
  choice: « on la déposera là, sur son socle » renvoie à la femme qui personnifie la Méchanceté
  alternative: 'Les formes féminines peuvent être rapportées plus abstraitement à l’épha ou à son contenu : « on le déposera là, sur son socle »'
  rationale: La femme identifiée à la Méchanceté en 5.8 constitue le référent littéraire le plus naturel. Une note conserve néanmoins l’ambiguïté grammaticale et symbolique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le caractère visionnaire du passage. « Shinéar » conserve le nom biblique ancien; « socle » rend concrètement la base fixe sans imposer une interprétation cultuelle.
