  variant: modern international French
source:
  edition: WLC
  text: כֹּ֥ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֲשֶׁ֤ר יַחֲזִ֨יקוּ֙ עֲשָׂרָ֣ה אֲנָשִׁ֔ים מִ/כֹּ֖ל לְשֹׁנ֣וֹת הַ/גּוֹיִ֑ם וְֽ/הֶחֱזִ֡יקוּ בִּ/כְנַף֩ אִ֨ישׁ יְהוּדִ֜י לֵ/אמֹ֗ר נֵֽלְכָה֙ עִמָּ/כֶ֔ם כִּ֥י שָׁמַ֖עְנוּ אֱלֹהִ֥ים עִמָּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/023.yaml
  text: 'Thus says Yahweh of Armies: In those days ten men from every language of the nations will take hold—yes[a], they will take hold of the garment edge of a Jewish man, saying, ‘Let us go with you[c][b], for we have heard that God is with you.’'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : En ces jours-là, dix hommes de toutes les langues des nations saisiront, oui, ils saisiront le pan du vêtement d’un homme juif[a] et diront : « Nous voulons aller avec vous, car nous avons appris que Dieu est avec vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un homme judéen ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par son sens concret, dans une formulation française intelligible.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: En ces jours-là
  rationale: Expression prophétique française naturelle qui reste proche de l’idiome hébreu.
- source_word: יַחֲזִיקוּ ... וְהֶחֱזִיקוּ
  choice: saisiront, oui, ils saisiront
  rationale: Maintient la répétition emphatique du même verbe hébreu sans alourdir excessivement la phrase.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dix hommes
  rationale: Reproduit le masculin explicite du texte source.
- source_word: מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
  choice: de toutes les langues des nations
  rationale: Conserve le pluriel « langues » et l’étendue multinationale de l’expression.
- source_word: בִּכְנַף
  choice: le pan du vêtement
  rationale: Dans ce contexte vestimentaire, « pan » exprime naturellement l’extrémité ou le bord saisi, sans préciser indûment le type de vêtement.
- source_word: אִישׁ יְהוּדִי
  choice: un homme juif
  rationale: Rend à la fois אִישׁ et יְהוּדִי; « Judéen » demeure une possibilité sémantique signalée en note.
- source_word: נֵלְכָה עִמָּכֶם
  choice: Nous voulons aller avec vous
  rationale: Exprime la valeur volitive du cohortatif tout en étant plus naturelle en français que « Allons avec vous » dans cette demande adressée au groupe.
- source_word: אֱלֹהִים עִמָּכֶם
  choice: Dieu est avec vous
  rationale: Rendu direct de la présence divine auprès du groupe destinataire.
theological_decisions:
- issue: Rendu de יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées / le SEIGNEUR de l’univers
  rationale: Le texte porte directement le nom divin; sa translittération préserve cette donnée, tandis que « des armées » garde l’image concrète de צְבָאוֹת.
- issue: Portée de יְהוּדִי
  choice: homme juif
  alternative: homme judéen
  rationale: Le contexte prophétique autorise un sens identitaire plus large que la seule provenance géographique, mais l’autre possibilité n’est pas supprimée et figure en note.
- issue: Nombre du pronom עִמָּכֶם
  choice: avec vous
  alternative: avec toi
  rationale: 'Le suffixe hébreu est pluriel : les nations s’adressent, à travers cet homme, au groupe auquel il appartient. Le français conserve cette tension entre le singulier « un homme » et le pluriel « vous ».'
translation_notes:
  register: Français international moderne, digne et accessible. La répétition emphatique est conservée; le pluriel « avec vous » est maintenu malgré l’antécédent singulier, conformément à l’hébreu.
