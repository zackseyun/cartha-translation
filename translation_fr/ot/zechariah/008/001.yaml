lexical_decisions:
- source_word: וַיְהִי
  choice: Et … arriva
  rationale: La forme narrative introduit un nouvel événement dans la séquence. En français, « Et … arriva » conserve ce lien tout en rattachant naturellement le verbe à « la parole ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans cette formule prophétique, le terme désigne la parole ou le message divin. « La parole » préserve la formulation biblique établie sans réduire le terme à une simple information.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Ce choix rend directement le pluriel hébreu et conserve l’imagerie militaire et cosmique du titre, sans adopter l’interprétation plus générale « Tout-Puissant ».
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le discours divin qui suit. « En ces termes » remplit naturellement cette fonction en français moderne, là où « disant » serait raide.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. Le conserver comme nom respecte directement la donnée hébraïque et évite de lui substituer silencieusement un titre.
- issue: Traduction du titre יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: Yahvé, le Tout-Puissant
  rationale: « Des armées » représente formellement צְבָאוֹת et maintient l’image du commandement exercé sur les forces célestes et terrestres; « Tout-Puissant » exprime une interprétation théologique plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure principale allège la formule prophétique sans omettre sa progression narrative; la note conserve une représentation plus formelle de l’hébreu.
