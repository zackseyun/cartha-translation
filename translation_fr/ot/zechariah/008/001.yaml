  text: And the word of Yahweh of hosts came[a], saying[b],
translation:
  language: fr
  text: Et la parole de Yahvé des armées[a] fut adressée en ces termes :[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahvé des puissances ». Le titre évoque son autorité sur les forces célestes et terrestres.
