id: ZEC.8.18
reference: Zechariah 8:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/018.yaml
  text: 'And the word of Yahweh of hosts came to me[a], saying:'
translation:
  language: fr
  text: 'La parole de Yahweh des armées me parvint en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: parvint
  rationale: Dans cette formule narrative prophétique, le waw consécutif avec היה introduit naturellement la venue de la parole divine ; le français n’a pas besoin de reproduire littéralement « et il arriva ».
- source_word: דְּבַר
  choice: La parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » désigne une communication divine précise et conserve l’expression biblique traditionnelle sans la réduire au terme plus interprétatif « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette traduction conserve l’image concrète des troupes ou armées associée au titre divin, sans l’interpréter comme « Tout-Puissant ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me parvint » rend directement le destinataire indiqué par אֵלַי dans un français naturel.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule française introduit naturellement les paroles qui suivent et exprime la fonction de l’infinitif hébreu לאמר.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin ; « Yahweh » en maintient la fonction et évite de le remplacer silencieusement par un titre.
- issue: Sens de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: Tout-Puissant
  rationale: « Des armées » préserve l’imagerie du terme hébreu et sa portée potentiellement céleste ou militaire, tandis que « Tout-Puissant » impose une interprétation théologique plus générale.
translation_notes:
  register: Français moderne, digne et fluide. La tournure prophétique « La parole de… me parvint » reste reconnaissable sans calquer inutilement l’idiome existentiel hébreu. La note de l’anglais de consultation n’a pas été reprise, car son appel après « me » ne correspond pas à son contenu et le texte hébreu ne présente ici aucune variante exigeant une note.
