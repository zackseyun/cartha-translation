    issue: Ajout de « donc » avant l’impératif final.
    rationale: Le texte hébreu porte directement « la vérité et la paix, aimez[-les] », sans conjonction ni adverbe inférentiel. L’ajout est interprétatif, même s’il est possible dans l’audit anglais.
  - severity: medium
    issue: « d’heureuses fêtes aux dates fixées » est syntaxiquement et stylistiquement maladroit.
    rationale: La formule française ne rend pas naturellement la fonction de מועדים comme fêtes ou temps désignés. Une formulation plus directe préserve mieux le sens calendaire et la fluidité.
