  to: 'Ainsi parle Yahweh des armées : « Le jeûne du quatrième mois[a], le jeûne du cinquième, le jeûne du septième et le jeûne du dixième deviendront[b], pour la maison de Juda, des occasions d’allégresse et de joie, ainsi que de joyeuses fêtes fixées[c]. Aimez la vérité et la paix. »'
  rationale: La révision supprime le connecteur inférentiel non exprimé dans le texte source et remplace une expression française pesante par « de joyeuses fêtes fixées », qui rend plus naturellement les « fêtes/temps fixés » qualifiés de bons. Les autres choix, y compris la translittération Yahweh et « deviendront », sont conservés.
