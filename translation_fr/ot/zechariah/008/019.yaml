  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת צ֣וֹם הָ/רְבִיעִ֡י וְ/צ֣וֹם הַ/חֲמִישִׁי֩ וְ/צ֨וֹם הַ/שְּׁבִיעִ֜י וְ/צ֣וֹם הָ/עֲשִׂירִ֗י יִהְיֶ֤ה לְ/בֵית יְהוּדָה֙ לְ/שָׂשׂ֣וֹן וּ/לְ/שִׂמְחָ֔ה וּֽ/לְ/מֹעֲדִ֖ים טוֹבִ֑ים וְ/הָ/אֱמֶ֥ת וְ/הַ/שָּׁל֖וֹם אֱהָֽבוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/019.yaml
  text: 'Thus says Yahweh of hosts: The fast of the fourth month[a], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall become for the house of Judah joy and gladness and good appointed feasts[c][b]. Therefore love truth and peace.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « Le jeûne du quatrième mois[a], le jeûne du cinquième, le jeûne du septième et le jeûne du dixième deviendront[b], pour la maison de Juda, des occasions d’allégresse et de joie, ainsi que de joyeuses fêtes fixées[c]. Aimez la vérité et la paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le quatrième jeûne, le cinquième jeûne, le septième jeûne et le dixième jeûne. » En hébreu, les jeûnes sont désignés par des nombres ordinaux qui renvoient vraisemblablement aux mois.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « seront ». Dans ce contexte, « deviendront » fait ressortir la transformation des jours de jeûne en occasions de fête.'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu désigne un temps fixé ou une fête établie, notamment une célébration religieuse inscrite au calendrier.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré « Yahweh ». « Des armées » rend צְבָאוֹת de manière claire et actuelle, sans limiter ces armées aux seules forces terrestres ou célestes.
- source_word: צ֣וֹם ... הָרְבִיעִי / הַחֲמִישִׁי / הַשְּׁבִיעִי / הָעֲשִׂירִי
  choice: Le jeûne du quatrième mois, le jeûne du cinquième, le jeûne du septième et le jeûne du dixième
  rationale: L’hébreu répète « jeûne » devant chaque ordinal. Le mot « mois », sous-entendu par l’usage calendaire, est explicité une seule fois en français afin de rendre l’expression compréhensible sans alourdir la liste.
- source_word: יִהְיֶה
  choice: deviendront
  rationale: Le verbe signifie littéralement « sera », au singulier en hébreu. Le pluriel est requis par la syntaxe française, et « deviendront » exprime le changement de fonction suggéré par le contexte, tout en signalant en note la traduction plus formelle.
- source_word: לְבֵית יְהוּדָה
  choice: pour la maison de Juda
  rationale: « Maison de Juda » conserve la dimension collective et historique de l’expression hébraïque ; « pour » rend ici la valeur bénéficiaire de לְ.
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחָה
  choice: des occasions d’allégresse et de joie
  rationale: Les deux noms hébreux proches sont maintenus par un doublet français naturel. « Des occasions de » permet de relier idiomatiquement les jeûnes à l’allégresse et à la joie.
- source_word: וּלְמֹעֲדִים טוֹבִים
  choice: d’heureuses fêtes aux dates fixées
  rationale: מוֹעֵד désigne un temps déterminé et souvent une fête religieuse fixée au calendrier. Cette formulation conserve à la fois la dimension festive, la notion de temps fixé et la qualification positive טוֹבִים.
- source_word: וְהָאֱמֶת וְהַשָּׁלוֹם אֱהָבוּ
  choice: Aimez donc la vérité et la paix
  rationale: L’impératif est rendu directement. « Donc » marque naturellement le passage de la promesse à l’exhortation sans transformer le lien en déduction théologique rigide.
theological_decisions:
- issue: Transformation des jeûnes commémoratifs
  choice: Les jeûnes deviendront pour Juda des occasions de célébration.
  alternative: Les jeûnes « seront » allégresse, joie et fêtes, ou seront abolis et remplacés par des fêtes.
  rationale: Le contexte suggère une transformation de leur caractère, mais le texte ne précise ni le mécanisme historique ni une abolition formelle. La traduction ne tranche donc pas au-delà de l’énoncé.
- issue: Lien logique de l’impératif final
  choice: « Aimez donc la vérité et la paix. »
  alternative: « Et aimez la vérité et la paix » ou « Mais aimez la vérité et la paix ».
  rationale: La conjonction hébraïque permet plusieurs nuances discursives. « Donc » exprime en français l’exhortation qui découle de la promesse, sans lui imposer une lecture confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « jeûne » et l’expression collective « maison de Juda » préservent la structure et la portée du texte hébreu, tandis que la syntaxe reste naturelle en français.
