  text: וְ/הֵבֵאתִ֣י אֹתָ֔/ם וְ/שָׁכְנ֖וּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָיוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים בֶּ/אֱמֶ֖ת וּ/בִ/צְדָקָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/008.yaml
  text: I will bring them[a], and they will dwell in the midst of Jerusalem; and they will be my people, and I will be their God[c][b], in truth and in righteousness.
translation:
  language: fr
  text: Je les ferai venir, et ils habiteront au milieu de Jérusalem[a]. Ils seront mon peuple, et moi, je serai leur Dieu, en vérité[b] et en justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’intérieur de Jérusalem ». L’hébreu dit plus littéralement « au milieu de Jérusalem ».
    reason: lexical_alternative
  - marker: b
    text: « Vérité » peut aussi exprimer ici la fidélité ou la fiabilité.
    reason: lexical_alternative
  - marker: c
    text: Ou « droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Je les ferai venir
  rationale: Le hiphil de בוא signifie « faire venir » ou « amener ». Cette formulation rend explicitement la valeur causative sans ajouter l’idée de retour, qui appartient au contexte mais n’est pas exprimée par le verbe lui-même.
- source_word: וְשָׁכְנוּ
  choice: ils habiteront
  rationale: שכן désigne le fait d’habiter ou de résider. « Habiteront » est naturel en français et conserve la nuance d’établissement durable.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: au milieu de Jérusalem
  rationale: Cette traduction conserve la force spatiale de בְּתוֹךְ, plus précise qu’un simple « à Jérusalem », tout en gardant le ton solennel du passage.
- source_word: וְהָיוּ לִי לְעָם
  choice: Ils seront mon peuple
  rationale: Il s’agit d’une formule d’alliance bien établie. Cette tournure française, naturelle et fidèle, en préserve les liens avec ses autres emplois bibliques.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: et moi, je serai leur Dieu
  rationale: Cette seconde partie de la formule d’alliance est rendue directement. Le pronom tonique « moi » fait entendre l’insistance portée par וַאֲנִי.
- source_word: בֶּאֱמֶת
  choice: dans la vérité
  rationale: אֱמֶת peut évoquer la vérité, la fidélité ou la fiabilité. « Dans la vérité » préserve la forme nominale et laisse ouverte la richesse sémantique du terme.
- source_word: וּבִצְדָקָה
  choice: et dans la justice
  rationale: צְדָקָה peut désigner la justice ou la droiture. « Justice » est idiomatique ici et convient à la relation d’alliance, tandis qu’une note signale l’autre nuance possible.
theological_decisions:
- issue: Formule d’alliance
  choice: Conserver « Ils seront mon peuple, et moi, je serai leur Dieu ».
  alternative: 'Paraphraser la relation, par exemple : « ils m’appartiendront et je prendrai soin d’eux comme leur Dieu ».'
  rationale: L’hébreu emploie une formule d’alliance reconnue. La conserver maintient les liens intertextuels et évite d’ajouter une explication absente du texte.
- issue: Portée de בֶּאֱמֶת וּבִצְדָקָה
  choice: Conserver le groupe prépositionnel « dans la vérité et dans la justice » sans préciser davantage son rattachement.
  alternative: Rendre le groupe adverbialement par « avec fidélité et justice » et l’appliquer exclusivement à la manière dont Dieu sera leur Dieu.
  rationale: La syntaxe hébraïque laisse une certaine ouverture quant à la portée exacte de l’expression. La formulation retenue préserve cette ambiguïté et sa tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et la répétition de la formule d’alliance sont maintenues. Le groupe final reste formellement parallèle afin de ne pas réduire sa portée possible.
