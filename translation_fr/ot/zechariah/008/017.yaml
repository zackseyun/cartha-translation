  text: וְ/אִ֣ישׁ אֶת רָעַ֣ת רֵעֵ֗/הוּ אַֽל תַּחְשְׁבוּ֙ בִּ/לְבַבְ/כֶ֔ם וּ/שְׁבֻ֥עַת שֶׁ֖קֶר אַֽל תֶּאֱהָ֑בוּ כִּ֧י אֶת כָּל אֵ֛לֶּה אֲשֶׁ֥ר שָׂנֵ֖אתִי נְאֻם יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/017.yaml
  text: And let no man devise evil against his neighbor in his heart[a], and do not love a false oath, for all these are what I hate, declares Yahweh.
translation:
  language: fr
  text: Ne projetez pas, chacun dans son cœur, le mal contre son prochain[a], et n’aimez pas le serment mensonger, car je déteste toutes ces choses — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Ne projetez pas dans vos cœurs le mal contre votre prochain. » L’hébreu emploie un sujet distributif au singulier (« chacun »), tout en s’adressant à la communauté au pluriel.'
    reason: La construction hébraïque associe אִישׁ, « chacun / un homme », à des formes verbales et à un possessif de deuxième personne du pluriel.
lexical_decisions:
- source_word: וְאִישׁ
  choice: Que personne
  rationale: 'Dans cette interdiction, אִישׁ a une valeur distributive : chaque membre de la communauté est visé. « Que personne » rend naturellement cette portée en français sans exclure les femmes de l’application.'
- source_word: רָעַת רֵעֵהוּ
  choice: de faire du mal à son prochain
  rationale: רָעָה désigne ici le mal ou le tort projeté contre autrui, et רֵעַ un prochain, compagnon ou associé. Cette formulation est claire et idiomatique en français.
- source_word: תַּחְשְׁבוּ בִּלְבַבְכֶם
  choice: ne projette dans son cœur
  rationale: חשב peut exprimer le fait de penser, calculer ou former un projet. Dans ce contexte éthique, « projeter » rend l’intention délibérée, tandis que « dans son cœur » conserve le siège intérieur de la réflexion et de la volonté.
- source_word: שְׁבֻעַת שֶׁקֶר
  choice: les serments mensongers
  rationale: L’expression signifie littéralement « serment de mensonge ». Le pluriel générique est naturel en français et conserve la portée juridique et morale sans la réduire au seul délit formel de parjure.
- source_word: תֶּאֱהָבוּ
  choice: n’aimez pas
  rationale: אהב signifie directement « aimer ». Le conserver maintient la force morale du texte, qui condamne non seulement l’acte, mais aussi l’attachement intérieur à celui-ci.
- source_word: כִּי אֶת כָּל־אֵלֶּה אֲשֶׁר שָׂנֵאתִי
  choice: car toutes ces choses, je les déteste
  rationale: La dislocation met naturellement en relief en français la totalité des conduites visées, comme le fait l’antéposition de l’objet en hébreu.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule prophétique solennelle, et le nom divin יהוה est rendu par « Yahweh » plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le préserve comme nom propre, sans lui substituer un titre.
- issue: Passage du singulier distributif au pluriel communautaire
  choice: Conserver « Que personne… son prochain », puis le pluriel « n’aimez pas »
  alternative: Harmoniser toute la phrase au singulier ou au pluriel
  rationale: L’hébreu évoque chaque individu tout en adressant collectivement la communauté. Le léger changement de nombre préserve cette tension grammaticale et rhétorique plutôt que de l’effacer.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le vocabulaire affectif fort (« aimez », « déteste »), l’intériorité du « cœur » et le changement de nombre propre à l’hébreu. Le tiret avant la formule prophétique évite une ponctuation lourde tout en gardant sa solennité.
