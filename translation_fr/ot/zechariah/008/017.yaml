  to: Ne projetez pas, chacun dans son cœur, le mal contre son prochain[a], et n’aimez pas le serment mensonger, car je déteste toutes ces choses — déclaration de Yahweh.
  rationale: La révision remplace la juxtaposition française peu naturelle d'une interdiction impersonnelle singulière et d'un impératif pluriel par une interdiction au pluriel qualifiée de « chacun dans son cœur ». Elle garde ainsi la portée individuelle de אִישׁ et l'adresse communautaire des formes hébraïques. Elle restitue aussi le singulier générique de « serment mensonger » et ajuste la note afin qu'elle explique précisément cette construction.
