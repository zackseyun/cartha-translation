revisions:
- from: 'Car voici ce que dit Yahweh des armées : « De même que j’avais décidé de vous faire du mal lorsque vos pères[a] ont provoqué ma colère, déclare Yahweh des armées, et que je n’ai pas renoncé[b],'
  to: 'Car voici ce que dit Yahweh des armées : « De même que j’ai résolu de faire venir le malheur sur vous lorsque vos pères[a] ont provoqué ma colère, déclare Yahweh des armées, et que je ne me suis pas ravisé[b],'
  rationale: La révision remplace deux formulations françaises susceptibles d’être imprécises. Elle rend le jugement/calamité impliqué par לְהָרַע et l’idée de ne pas revenir sur une décision portée par נחם, tout en maintenant la comparaison inachevée qui se poursuit au verset 15.
