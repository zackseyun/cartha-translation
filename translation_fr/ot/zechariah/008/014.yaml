source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ כַּ/אֲשֶׁ֨ר זָמַמְ֜תִּי לְ/הָרַ֣ע לָ/כֶ֗ם בְּ/הַקְצִ֤יף אֲבֹֽתֵי/כֶם֙ אֹתִ֔/י אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֖א נִחָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/014.yaml
  text: 'For thus says Yahweh of Armies: Just as I purposed to do harm to you when your fathers provoked me to wrath[a], says Yahweh of Armies, and I did not relent[c][b],'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh des armées : « De même que j’ai résolu de faire venir le malheur sur vous lorsque vos pères[a] ont provoqué ma colère, déclare Yahweh des armées, et que je ne me suis pas ravisé[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos ancêtres ». L’hébreu dit littéralement « vos pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je n’ai pas changé d’avis » ; selon un autre sens possible du verbe, « je ne me suis pas repenti ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette expression transparente en français moderne conserve la dimension militaire et céleste du titre.
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que dit
  rationale: Cette formulation naturelle conserve à la fois le lien explicatif de כִּי et la solennité de la formule prophétique.
- source_word: כַּאֲשֶׁר
  choice: De même que
  rationale: La locution introduit clairement la comparaison avec la promesse formulée au verset suivant.
- source_word: זָמַמְתִּי
  choice: j’avais décidé
  rationale: Le verbe exprime un dessein arrêté; le plus-que-parfait situe naturellement cette décision par rapport à la provocation des pères.
- source_word: לְהָרַע לָכֶם
  choice: de vous faire du mal
  rationale: La formulation reste proche de l’hébreu et exprime le malheur infligé comme jugement, sans attribuer à Dieu une faute morale.
- source_word: בְּהַקְצִיף ... אֹתִי
  choice: lorsque ... ont provoqué ma colère
  rationale: Le tour rend la valeur circonstancielle de בְּ et le sens causatif intense du verbe.
- source_word: אֲבֹתֵיכֶם
  choice: vos pères
  rationale: Le texte hébreu emploie explicitement le masculin pluriel; une note donne l’équivalent contextuel plus large « ancêtres ».
- source_word: וְלֹא נִחָמְתִּי
  choice: et que je n’ai pas renoncé
  rationale: Dans ce contexte de jugement, נחם désigne le fait de revenir sur une décision ou d’y renoncer; cette traduction évite le sens moral trompeur de « se repentir ».
theological_decisions:
- issue: Langage du jugement divin dans לְהָרַע
  choice: de vous faire du mal
  alternative: de faire venir le malheur sur vous
  rationale: Le contexte parle d’un jugement infligé, non d’un mal moral commis par Dieu. La traduction garde néanmoins la vigueur et la tension de l’expression hébraïque.
- issue: Langage anthropopathique dans וְלֹא נִחָמְתִּי
  choice: je n’ai pas renoncé
  alternative: je n’ai pas changé d’avis / je ne me suis pas repenti
  rationale: « Renoncer » exprime ici le fait de ne pas revenir sur le jugement décidé, sans imposer une explication doctrinale de la manière dont le texte parle de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par une virgule, conformément au texte source fourni et à la comparaison qui se poursuit au verset 15. Le discours direct est ouvert sans guillemet fermant puisque la citation se poursuit.
