    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’ai envoyé tous les hommes, chacun contre son prochain ». L’expression décrit une hostilité mutuelle.'
    reason: literal_rendering
  revision_rationale: La révision maintient le sens du brouillon, mais rétablit le parallélisme explicite des salaires, la double référence aux déplacements, et surtout la formulation complète du dernier membre. Elle évite de faire de « dresser » une interprétation principale, tout en expliquant dans la note l’effet contextuel d’hostilité mutuelle.
