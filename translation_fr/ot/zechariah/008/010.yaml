  text: כִּ֗י לִ/פְנֵי֙ הַ/יָּמִ֣ים הָ/הֵ֔ם שְׂכַ֤ר הָֽ/אָדָם֙ לֹ֣א נִֽהְיָ֔ה וּ/שְׂכַ֥ר הַ/בְּהֵמָ֖ה אֵינֶ֑/נָּה וְ/לַ/יּוֹצֵ֨א וְ/לַ/בָּ֤א אֵין שָׁלוֹם֙ מִן הַ/צָּ֔ר וַ/אֲשַׁלַּ֥ח אֶת כָּל הָ/אָדָ֖ם אִ֥ישׁ בְּ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/010.yaml
  text: For before those days there was no wage for man[a], and no wage for beast; and for the one going out and the one coming in there was no peace because of the adversary[c][b], and I set every man against his neighbor.
translation:
  language: fr
  text: Car, avant ces jours-là, il n’y avait ni salaire pour l’homme ni salaire pour la bête. Pour celui qui sortait et pour celui qui entrait, il n’y avait pas de paix à cause de l’adversaire[a], et j’ai envoyé tous les hommes, chacun contre son prochain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de l’ennemi » ou « de l’ennemi ». Le terme hébreu désigne un adversaire ou un ennemi; « paix » peut aussi évoquer la sécurité ou le bien-être.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’ai envoyé tous les hommes, chacun contre son prochain ». L’expression décrit une hostilité mutuelle.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du contraste avec la situation nouvelle annoncée dans le contexte.
- source_word: לִפְנֵי הַיָּמִים הָהֵם
  choice: avant ces jours-là
  rationale: Rend directement l’expression temporelle hébraïque tout en restant naturel en français.
- source_word: שְׂכַר הָאָדָם לֹא נִהְיָה וּשְׂכַר הַבְּהֵמָה אֵינֶנָּה
  choice: il n’y avait de salaire ni pour l’homme ni pour la bête
  rationale: Conserve le parallélisme entre le travail humain et celui des animaux; « l’homme » a ici une valeur générique et contraste avec « la bête ».
- source_word: וְלַיּוֹצֵא וְלַבָּא
  choice: Pour celui qui sortait comme pour celui qui entrait
  rationale: Préserve les participes substantivés au singulier et l’idée générale des déplacements ordinaires.
- source_word: אֵין שָׁלוֹם
  choice: il n’y avait aucune paix
  rationale: « Paix » est le sens central de שָׁלוֹם dans ce contexte d’insécurité, sans exclure ses nuances de sécurité et de bien-être.
- source_word: מִן הַצָּר
  choice: à cause de l’adversaire
  rationale: Comprend מִן comme indiquant la cause ou la source de l’absence de paix, et צַר comme un adversaire hostile.
- source_word: וַאֲשַׁלַּח אֶת כָּל הָאָדָם אִישׁ בְּרֵעֵהוּ
  choice: et j’ai dressé chacun contre son prochain
  rationale: Rend idiomatiquement l’action divine qui livre les personnes à une hostilité mutuelle, sans en atténuer l’attribution explicite à Dieu.
theological_decisions:
- issue: Valeur générique de הָאָדָם
  choice: l’homme
  alternative: les humains / les gens
  rationale: Dans le premier membre, le contraste entre l’être humain et l’animal justifie « l’homme » au sens collectif et représentatif; dans le dernier, « chacun » exprime plus naturellement la distribution individuelle.
- issue: Action divine dans les conflits sociaux
  choice: j’ai dressé chacun contre son prochain
  alternative: j’ai envoyé chacun contre son prochain
  rationale: Le texte attribue explicitement à Dieu l’hostilité mutuelle. La formulation choisie conserve cette tension théologique tout en exprimant le sens contextuel du verbe.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme et la progression du verset sont conservés; les formulations trop archaïques sont évitées.
