revisions:
- from: Car avant ces jours-là, il n’y avait de salaire ni pour l’homme ni pour la bête. Pour celui qui sortait comme pour celui qui entrait, il n’y avait aucune paix à cause de l’adversaire[a], et j’ai dressé chacun contre son prochain.[b]
  to: Car, avant ces jours-là, il n’y avait ni salaire pour l’homme ni salaire pour la bête. Pour celui qui sortait et pour celui qui entrait, il n’y avait pas de paix à cause de l’adversaire[a], et j’ai envoyé tous les hommes, chacun contre son prochain.[b]
  rationale: La révision maintient le sens du brouillon, mais rétablit le parallélisme explicite des salaires, la double référence aux déplacements, et surtout la formulation complète du dernier membre. Elle évite de faire de « dresser » une interprétation principale, tout en expliquant dans la note l’effet contextuel d’hostilité mutuelle.
