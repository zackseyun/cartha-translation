source:
  edition: WLC
  text: אֵ֥לֶּה הַ/דְּבָרִ֖ים אֲשֶׁ֣ר תַּֽעֲשׂ֑וּ דַּבְּר֤וּ אֱמֶת֙ אִ֣ישׁ אֶת רֵעֵ֔/הוּ אֱמֶת֙ וּ/מִשְׁפַּ֣ט שָׁל֔וֹם שִׁפְט֖וּ בְּ/שַׁעֲרֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/016.yaml
  text: 'These are the things that you must do: speak truth to one another[c][b][a]; judge with truth and a judgment of peace in your gates.'
translation:
  language: fr
  text: 'Voici ce que vous devez faire : dites la vérité les uns aux autres[a] ; dans vos portes[b], rendez des jugements conformes à la vérité et favorables à la paix[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dites la vérité, chacun à son prochain ». L’hébreu emploie un singulier masculin représentatif.'
    reason: lexical_alternative
  - marker: b
    text: Les portes des villes étaient habituellement le lieu où l’on entendait les affaires judiciaires et rendait les jugements.
    reason: cultural_note
  - marker: c
    text: 'Autre traduction possible : « rendez dans vos portes des jugements de vérité et de paix ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Voici ce que
  rationale: Cette tournure française introduit naturellement les actes prescrits, tout en reflétant le sens contextuel de דְּבָרִים (« choses », « actes », « paroles » selon le contexte).
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: vous devez faire
  rationale: L’imparfait hébreu a ici une valeur prescriptive ; « devez faire » exprime clairement l’obligation en français courant.
- source_word: דַּבְּרוּ אֱמֶת
  choice: dites-vous la vérité
  rationale: Cette formulation idiomatique conserve l’impératif et l’exigence de véracité, sans réduire אֱמֶת à la seule sincérité subjective.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: les uns aux autres
  rationale: L’expression hébraïque emploie un singulier masculin représentatif (« chacun à son prochain ») pour exprimer une obligation réciproque ; le français naturel rend cette réciprocité par « les uns aux autres ».
- source_word: אֱמֶת וּמִשְׁפַּט שָׁלוֹם
  choice: des jugements vrais et favorables à la paix
  rationale: La construction nominale compacte associe la vérité au jugement et à la paix. Cette formulation française conserve ces deux qualités sans imposer une analyse syntaxique unique.
- source_word: שִׁפְטוּ
  choice: rendez des jugements
  rationale: Dans le cadre judiciaire des portes de la ville, cette expression est plus précise et naturelle que le simple verbe « jugez ».
- source_word: בְּשַׁעֲרֵיכֶם
  choice: dans vos portes
  rationale: La traduction garde l’image hébraïque des portes, lieu public où étaient traitées les affaires judiciaires ; une note en explicite le contexte culturel.
theological_decisions:
- issue: Singulier masculin représentatif dans l’instruction éthique
  choice: les uns aux autres
  alternative: chacun à son prochain
  rationale: Le français réciproque exprime naturellement la portée collective de אִישׁ אֶת־רֵעֵהוּ. La note conserve la forme plus littérale et le singulier représentatif de l’hébreu.
- issue: Sens de שָׁלוֹם dans la formule judiciaire
  choice: favorables à la paix
  alternative: des jugements de paix
  rationale: שָׁלוֹם peut caractériser des décisions qui préservent ou produisent la paix. La traduction maintient le lien entre vérité judiciaire et paix communautaire sans introduire de cadre doctrinal ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image culturelle des portes tout en explicitant le registre judiciaire par « rendez des jugements ». Les notes sont placées au point précis auquel elles se rapportent.
