  source_fidelity: Le sens des impératifs est bien rendu. Toutefois, « dites-vous la vérité les uns aux autres » cumule une tournure pronominale réciproque et « les uns aux autres », ce qui est lourd et ambigu en français. Pour la formule judiciaire, le texte hébreu associe explicitement vérité et paix au jugement ; « conformes à la vérité et favorables à la paix » le rend plus nettement.
