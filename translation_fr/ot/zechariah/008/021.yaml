  to: 'Les habitants d’une ville iront vers ceux d’une autre en disant : « Allons donc implorer la faveur de l’Éternel et rechercher l’Éternel des armées. » « Moi aussi, j’irai. »'
  rationale: La révision conserve l’ambiguïté normale de « ville » sous-entendue par les féminins hébreux et l’intensité exhortative de נֵלְכָה הָלוֹךְ dans un français plus naturel. Elle rend le cohortatif final comme une résolution future, distingue les deux prises de parole et adopte un rendu plus directement fidèle de יְהוָה צְבָאוֹת.
