base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/021.yaml
  text: And the inhabitants of one city will go to another, saying, ‘Let us surely go to entreat the favor of the LORD and to seek the LORD of hosts.’ ‘I myself am going too.’
translation:
  language: fr
  text: 'Les habitants d’une ville iront vers ceux d’une autre en disant : « Allons donc implorer la faveur de l’Éternel et rechercher l’Éternel des armées. » « Moi aussi, j’irai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי אַחַת אֶל אַחַת
  choice: Les habitants d’une ville iront vers ceux d’une autre
  rationale: Le féminin « une… une » sous-entend « ville », explicité en français; « ceux » évite l’expression peu naturelle « d’une ville à une autre » tout en gardant les habitants comme acteurs.
- source_word: נֵלְכָה הָלוֹךְ
  choice: Allons, oui, allons
  rationale: L’infinitif absolu après le cohortatif intensifie l’exhortation; la répétition française restitue cette insistance sans la réduire à une simple indication de hâte.
- source_word: לְחַלּוֹת אֶת־פְּנֵי
  choice: implorer la faveur de
  rationale: L’expression idiomatique signifie chercher à apaiser ou à obtenir la faveur d’une personne; ce rendu reste clair et digne.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et reconnaissable du tétragramme, distingué du titre « Seigneur ».
- source_word: יְהוָה צְבָאוֹת
  choice: l’Éternel, le maître des armées
  rationale: « Armées » conserve l’image de צְבָאוֹת, tandis que « maître » exprime naturellement l’autorité impliquée dans le titre.
- source_word: אֵלְכָה גַּם־אָנִי
  choice: Moi aussi, j’y vais
  rationale: Le cohortatif peut exprimer une résolution présente; la tournure directe et emphatique conserve גַּם־אָנִי et le mouvement sous-entendu vers l’Éternel.
theological_decisions:
- issue: Sens du titre יְהוָה צְבָאוֹת
  choice: l’Éternel, le maître des armées
  alternative: l’Éternel des armées
  rationale: Le choix rend explicite la souveraineté sans préciser s’il s’agit exclusivement des armées célestes ou terrestres, préservant ainsi l’étendue du titre hébreu.
- issue: Valeur de לְחַלּוֹת אֶת־פְּנֵי יְהוָה
  choice: implorer la faveur de l’Éternel
  alternative: supplier l’Éternel
  rationale: Le rendu conserve l’idée biblique de rechercher la face favorable de Dieu, sans introduire une doctrine particulière sur les moyens d’obtenir cette faveur.
translation_notes:
  register: Français international moderne, oral mais digne dans le discours cité. L’insistance hébraïque est conservée par « Allons, oui, allons », et la dernière réplique reste vive et résolue.
