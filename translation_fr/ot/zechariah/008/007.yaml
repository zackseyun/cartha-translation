  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י מוֹשִׁ֛יעַ אֶת עַמִּ֖/י מֵ/אֶ֣רֶץ מִזְרָ֑ח וּ/מֵ/אֶ֖רֶץ מְב֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/007.yaml
  text: 'Thus says Yahweh of hosts: Behold[b][a], I will save my people from the land of the east and from the land of the setting of the sun.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh des armées : « Voici, je vais sauver mon peuple du pays de l’est et du pays où le soleil se couche.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « du pays de l’est et du pays de l’entrée du soleil » ; les deux expressions peuvent désigner ensemble les régions lointaines de l’est et de l’ouest.
    reason: Note littérale et culturelle sur l’image géographique et sa possible valeur de mérisme.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend naturellement en français moderne la formule solennelle du messager prophétique, avec un présent de déclaration.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת par un terme français actuel qui évoque les forces placées sous son commandement.
- source_word: הִנְנִי מוֹשִׁיעַ
  choice: 'Me voici : je vais sauver'
  rationale: « Me voici » garde l’emphase de הִנְנִי, tandis que « je vais sauver » exprime l’action annoncée comme imminente et certaine par le participe.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Rend directement la désignation relationnelle et collective de l’hébreu.
- source_word: מֵאֶרֶץ מִזְרָח
  choice: du pays de l’orient
  rationale: Préserve le singulier « pays » et l’image directionnelle de l’est dans un registre digne.
- source_word: וּמֵאֶרֶץ מְבוֹא הַשָּׁמֶשׁ
  choice: et du pays où le soleil se couche
  rationale: Conserve l’image concrète et poétique de l’hébreu plutôt que de la réduire au simple terme « ouest ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve ici le nom propre sans lui substituer un titre.
- issue: Valeur temporelle du participe מוֹשִׁיעַ après הִנְנִי
  choice: je vais sauver
  alternative: je sauve / je sauverai
  rationale: La construction peut présenter une action imminente ou certaine. « Je vais sauver » maintient cette proximité sans prétendre que l’action est déjà en cours.
- issue: Portée de l’orient et du couchant
  choice: conserver les deux images géographiques
  alternative: de l’est et de l’ouest / de partout
  rationale: Le couple peut fonctionner comme un mérisme indiquant des régions très éloignées, mais le texte nomme concrètement les deux extrêmes ; la traduction ne réduit donc pas l’image à son interprétation.
translation_notes:
  register: Français international moderne, solennel sans archaïsme excessif. La ponctuation fait de « Me voici » l’annonce emphatique de l’intervention divine. L’image du soleil couchant est maintenue pour préserver la poésie du texte.
