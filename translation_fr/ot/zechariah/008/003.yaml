source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁ֚בְתִּי אֶל צִיּ֔וֹן וְ/שָׁכַנְתִּ֖י בְּ/ת֣וֹךְ יְרֽוּשָׁלִָ֑ם וְ/נִקְרְאָ֤ה יְרוּשָׁלִַ֨ם֙ עִ֣יר הָֽ/אֱמֶ֔ת וְ/הַר יְהוָ֥ה צְבָא֖וֹת הַ֥ר הַ/קֹּֽדֶשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/003.yaml
  text: 'Thus says Yahweh: I have returned to Zion and will dwell in the midst of Jerusalem[a], and Jerusalem will be called the City of Truth, and the mountain of Yahweh of Armies[b], the Holy Mountain.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Je suis revenu à Sion et j’habiterai au milieu de Jérusalem ; Jérusalem sera appelée « Ville de vérité »[a], et la montagne de Yahweh des armées[b] sera appelée « Montagne sainte ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Ville de fidélité », car le mot hébreu אֱמֶת peut exprimer la vérité, la fiabilité ou la fidélité.'
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement, ce titre est souvent rendu par « le Seigneur des armées » ou « le Seigneur des puissances ». Le terme hébreu צְבָאוֹת signifie littéralement « armées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation française, naturelle et digne, conserve la formule prophétique solennelle. Le nom divin יהוה est rendu par « Yahweh ».
- source_word: שַׁבְתִּי
  choice: Je suis revenu
  rationale: Le parfait qal à la première personne présente le retour comme accompli et pertinent pour la situation présente.
- source_word: אֶל צִיּוֹן
  choice: à Sion
  rationale: La préposition exprime la direction, et « Sion » est la forme française consacrée du nom de lieu.
- source_word: וְשָׁכַנְתִּי
  choice: et j’habiterai
  rationale: Dans ce contexte de restauration, le second parfait est compris prospectivement comme le résultat durable du retour de Yahweh. « Habiter » rend simplement la présence divine sans ajouter l’image technique du tabernacle.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: au milieu de Jérusalem
  rationale: Cette expression préserve la valeur plus précise de בְּתוֹךְ, qui indique une présence au sein même de la ville.
- source_word: וְנִקְרְאָה יְרוּשָׁלִַם
  choice: Jérusalem sera appelée
  rationale: Le niphal imparfait se rend naturellement par un passif au futur.
- source_word: עִיר הָאֱמֶת
  choice: Ville de vérité
  rationale: אֱמֶת peut désigner la vérité, la fiabilité ou la fidélité. « Vérité » est le correspondant lexical le plus direct, tandis qu’une note conserve l’autre nuance importante.
- source_word: הַר יְהוָה צְבָאוֹת
  choice: la montagne de Yahweh des armées
  rationale: Le titre צְבָאוֹת est traduit de façon transparente par « des armées », et le nom divin est conservé sous la forme « Yahweh ».
- source_word: הַר הַקֹּדֶשׁ
  choice: Montagne sainte
  rationale: Cette désignation concise et traditionnelle rend directement la sainteté de la montagne consacrée à Yahweh.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Valeur temporelle de שַׁבְתִּי ... וְשָׁכַנְתִּי
  choice: Je suis revenu ... et j’habiterai
  alternative: Je reviens ... et j’habite ; Je suis revenu ... et j’ai habité
  rationale: Le premier verbe présente le retour comme accompli, tandis que le second exprime ici la demeure qui en résulte. Ce choix maintient la tension temporelle du discours prophétique plutôt que d’uniformiser les deux parfaits.
- issue: Portée de וְנִקְרְאָה sur les deux désignations
  choice: Employer explicitement « sera appelée » pour Jérusalem et le laisser sous-entendu pour la montagne
  alternative: Répéter « sera appelée » devant « la montagne »
  rationale: L’hébreu ne répète pas le verbe devant la montagne. L’ellipse française conserve cette structure tout en restant intelligible.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Les guillemets signalent des appellations honorifiques. Les majuscules à « Ville » et « Montagne » mettent en valeur ces désignations sans ajouter de contenu doctrinal.
