source:
  edition: WLC
  text: כִּֽי זֶ֣רַע הַ/שָּׁל֗וֹם הַ/גֶּ֜פֶן תִּתֵּ֤ן פִּרְיָ/הּ֙ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן אֶת יְבוּלָ֔/הּ וְ/הַ/שָּׁמַ֖יִם יִתְּנ֣וּ טַלָּ֑/ם וְ/הִנְחַלְתִּ֗י אֶת שְׁאֵרִ֛ית הָ/עָ֥ם הַ/זֶּ֖ה אֶת כָּל אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/012.yaml
  text: 'For there will be the seed of peace: the vine will give its fruit[a], the land will give its produce, and the heavens will give their dew; and I will cause the remnant of this people to inherit all these things.'
translation:
  language: fr
  text: 'Car il y aura une semence de paix[a] : la vigne donnera son fruit, la terre donnera ses produits et le ciel donnera sa rosée. Je donnerai en héritage toutes ces choses au reste de ce peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une semence prospère », « des semailles paisibles » ou « une semence de bien-être ». L’expression hébraïque est concise et peut résumer toute cette scène de bénédiction agricole retrouvée.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע הַשָּׁלוֹם
  choice: une semence de paix
  rationale: La formule hébraïque, compacte, associe le vocabulaire agricole à שָׁלוֹם, qui peut évoquer la paix, le bien-être et la prospérité. « Une semence de paix » conserve l’image et son ampleur sémantique sans la réduire à la seule prospérité.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication ou le fondement de la promesse précédente.
- source_word: הַגֶּפֶן תִּתֵּן פִּרְיָהּ
  choice: la vigne donnera son fruit
  rationale: Cette formulation naturelle conserve le verbe répété « donner » et l’image agricole concrète.
- source_word: יְבוּל
  choice: produits
  rationale: Le terme désigne ce que la terre fait pousser ou rapporte. Le pluriel français « produits » exprime naturellement l’ensemble de son rendement agricole.
- source_word: הַשָּׁמַיִם יִתְּנוּ טַלָּם
  choice: le ciel donnera sa rosée
  rationale: En français courant, le singulier collectif « le ciel » rend naturellement le pluriel hébreu tout en conservant l’image et la répétition du verbe « donner ».
- source_word: וְהִנְחַלְתִּי
  choice: Je donnerai en héritage
  rationale: Le hiphil de נחל a une valeur causative. Cette tournure française garde explicitement la notion d’héritage et de don sans devenir pesante.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: au reste de ce peuple
  rationale: « Le reste » est le terme prophétique consacré et rend directement l’idée de ceux qui subsistent.
- source_word: אֶת כָּל אֵלֶּה
  choice: toutes ces choses
  rationale: L’expression renvoie à l’ensemble des bénédictions agricoles qui viennent d’être énumérées.
theological_decisions:
- issue: Étendue sémantique de שָׁלוֹם dans une promesse de fécondité agricole
  choice: La formule principale conserve « paix » dans « une semence de paix ».
  alternative: « une semence prospère », « des semailles paisibles » ou « une semence de bien-être »
  rationale: Dans ce contexte, שָׁלוֹם inclut vraisemblablement le bien-être et la prospérité, mais « paix » préserve la richesse théologique du mot et l’ambiguïté de la formule hébraïque.
- issue: Valeur d’héritage de וְהִנְחַלְתִּי
  choice: 'Maintien explicite du langage d’héritage : « Je donnerai en héritage ».'
  alternative: « Je donnerai toutes ces choses au reste » ou « Je ferai posséder toutes ces choses au reste »
  rationale: Le verbe causatif évoque à la fois le don et l’entrée en possession. La formulation retenue garde cette résonance d’héritage sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme ternaire et la répétition de « donnera » reproduisent la structure poétique du texte. La dernière proposition est reformulée selon l’ordre naturel du français tout en maintenant la notion d’héritage.
