  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּ֣י יִפָּלֵ֗א בְּ/עֵינֵי֙ שְׁאֵרִית֙ הָ/עָ֣ם הַ/זֶּ֔ה בַּ/יָּמִ֖ים הָ/הֵ֑ם גַּם בְּ/עֵינַ/י֙ יִפָּלֵ֔א נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/006.yaml
  text: 'Thus says Yahweh of hosts: If it is marvelous in the eyes of the remnant of this people in those days[a], should it also be marvelous in my eyes? declares Yahweh of hosts.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : « Si cela paraît extraordinaire[a] aux yeux du reste de ce peuple en ces jours-là, cela paraît-il aussi extraordinaire à mes yeux ? » — déclaration de Yahweh des armées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trop difficile » ou « impossible ». Le verbe hébreu peut désigner quelque chose d’extraordinaire ou qui dépasse les capacités humaines.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française consacrée et naturelle pour introduire solennellement un message prophétique.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et rend צְבָאוֹת par son sens concret, sans limiter explicitement la nature des armées évoquées.
- source_word: כִּי
  choice: Si
  rationale: Introduit ici la protase d'une comparaison formulée comme une question rhétorique.
- source_word: יִפָּלֵא
  choice: paraît extraordinaire
  rationale: Préserve le champ sémantique de פלא, qui peut évoquer ce qui est étonnant, merveilleux ou hors de portée, sans retenir d'emblée le sens plus fort d'« impossible ».
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Conserve l'image hébraïque et le parallélisme entre le peuple et Yahweh, tout en restant idiomatique en français.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: le reste de ce peuple
  rationale: « Le reste » est le terme prophétique usuel et reproduit la construction collective du texte.
- source_word: בַּיָּמִים הָהֵם
  choice: en ces jours-là
  rationale: Expression prophétique naturelle qui conserve le pluriel et la référence temporelle déictique.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclaration de Yahweh des armées
  rationale: Distingue la formule solennelle נְאֻם de la formule introductive אָמַר et en conserve la valeur d'attestation divine.
theological_decisions:
- issue: Portée de la seconde occurrence de יִפָּלֵא concernant Yahweh
  choice: 'Question rhétorique : « cela paraîtrait-il aussi extraordinaire à mes yeux ? »'
  alternative: 'Affirmation : « cela sera aussi extraordinaire à mes yeux »'
  rationale: Le parallélisme et le contexte favorisent une question appelant une réponse négative. La traduction conserve toutefois le même terme dans les deux membres au lieu d'expliciter directement une doctrine de la toute-puissance.
- issue: Valeur de פלא
  choice: extraordinaire
  alternative: trop difficile / impossible
  rationale: Le mot peut désigner aussi bien ce qui émerveille que ce qui dépasse les capacités humaines. Le texte principal garde cette amplitude, et la note signale les sens plus forts.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le parallélisme « aux yeux de… à mes yeux » est maintenu, de même que l'ambiguïté lexicale centrale de פלא.
