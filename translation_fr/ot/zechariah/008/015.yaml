  verdict: revise
  source_fidelity: La formulation « je suis revenu sur ma décision » interprète שַׁבְתִּי comme l’abandon explicite d’une décision antérieure. Dans le contexte, le verbe marque bien un retournement par rapport au dessein de jugement du v. 14, mais l’hébreu l’unit à « j’ai projeté » et ne dit pas littéralement « revenir sur une décision ». « J’ai de nouveau formé le projet » rend le mouvement de reprise/retournement sans ajouter cette explicitation.
  naturalness: « Ainsi, en ces jours-ci, j’ai de nouveau formé le projet de faire du bien… » est naturel, clair et de registre biblique moderne. « N’ayez pas peur » convient très bien à l’impératif pluriel.
  terminology: « Jérusalem », « la maison de Juda » et « faire du bien » sont fidèles et appropriés. « Maison de Juda » conserve utilement l’expression collective du texte.
