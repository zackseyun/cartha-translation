    issue: « je suis revenu sur ma décision »
    rationale: Cette expression française affirme un changement de décision et présente « revenu » comme gouvernant « sur ma décision ». Le texte dit plutôt que Dieu s’est de nouveau tourné/proposé de faire du bien; le contexte suggère le contraste, sans imposer cette paraphrase.
