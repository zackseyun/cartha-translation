  text: And the streets of the city will be filled with boys and girls playing in its streets[a].
translation:
  language: fr
  text: Les rues de la ville seront remplies de garçons et de filles qui joueront dans ses rues[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les places de la ville seront remplies de garçons et de filles qui joueront dans ses places. » Le terme hébreu peut désigner de larges rues ou des places publiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְחֹבוֹת
  choice: Les rues
  rationale: רְחֹבוֹת désigne de larges espaces publics, qu’il s’agisse de rues larges ou de places. « Les rues » est naturel en français moderne et permet de conserver la répétition du terme hébreu.
- source_word: הָ/עִיר
  choice: de la ville
  rationale: עִיר est le terme courant pour une ville ou une cité; « ville » est ici la traduction française la plus directe.
- source_word: יִמָּלְאוּ
  choice: seront remplies
  rationale: 'Le nifal inaccompli de מלא exprime ici, dans ce contexte prophétique, un état futur résultant: les rues seront remplies.'
- source_word: יְלָדִים וִֽ/ילָדוֹת
  choice: de garçons et de filles
  rationale: Le couple masculin-féminin désigne précisément garçons et filles; cette formulation préserve la paire explicite de l’hébreu.
- source_word: מְשַׂחֲקִים
  choice: qui joueront
  rationale: Le participe de שׂחק décrit ici l’activité joyeuse des enfants. La proposition relative au futur est plus naturelle en français que le calque « jouant » après « seront remplies ».
- source_word: בִּ/רְחֹבֹתֶי/הָ
  choice: dans ses rues
  rationale: Le suffixe féminin singulier renvoie à la ville. « Ses rues » est idiomatique en français et la répétition de « rues » garde l’insistance de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « rues », présente dans l’hébreu, est conservée malgré sa légère redondance. Le futur de « joueront » harmonise naturellement la proposition avec l’annonce prophétique.
