  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ הֱיִיתֶ֨ם קְלָלָ֜ה בַּ/גּוֹיִ֗ם בֵּ֤ית יְהוּדָה֙ וּ/בֵ֣ית יִשְׂרָאֵ֔ל כֵּ֚ן אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וִ/הְיִיתֶ֖ם בְּרָכָ֑ה אַל תִּירָ֖אוּ תֶּחֱזַ֥קְנָה יְדֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/013.yaml
  text: And it shall happen that just as you were a curse among the nations[a], O house of Judah and house of Israel, so I will save you, and you shall be a blessing. Do not fear[c][b]; let your hands be strong.
translation:
  language: fr
  text: Et il arrivera que, de même que vous avez été une malédiction parmi les nations[a], maison de Juda et maison d’Israël, ainsi je vous sauverai[b], et vous serez une bénédiction. N’ayez pas peur ; que vos mains soient fortes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un objet de malédiction » : le terme peut désigner un peuple dont le nom sert dans des formules de malédiction.'
    reason: lexical_alternative
  - marker: b
    text: Ou « je vous délivrerai ». Le verbe hébreu peut désigner largement le salut ou la délivrance.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « que vos mains soient fortes », image hébraïque exprimant le courage et la détermination à agir.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Tout comme
  rationale: Le français exprime naturellement la comparaison entre la situation passée et son renversement futur sans reproduire lourdement la formule introductive hébraïque.
- source_word: קְלָלָה
  choice: un objet de malédiction
  rationale: Cette formulation indique que Juda et Israël étaient regardés comme maudits et que leur nom pouvait servir dans des formules de malédiction ; elle évite l’idée possible qu’ils auraient eux-mêmes activement maudit les nations.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: « Nations » convient au contexte prophétique et n’importe pas une opposition néotestamentaire entre Juifs et non-Juifs.
- source_word: בֵּית יְהוּדָה וּבֵית יִשְׂרָאֵל
  choice: maison de Juda et maison d’Israël
  rationale: Le maintien de « maison » préserve la désignation collective et historique des deux communautés.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: je vous sauverai
  rationale: Le verbe hiphil de ישׁע désigne largement l’action de sauver ou de délivrer ; « sauver » conserve cette amplitude.
- source_word: וִהְיִיתֶם בְּרָכָה
  choice: et vous serez une bénédiction
  rationale: La formulation garde l’image biblique d’un peuple qui devient une source ou une manifestation de bénédiction.
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: Formulation directe, naturelle et digne en français moderne pour l’interdiction hébraïque.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: que vos mains soient fortes
  rationale: La traduction conserve l’image hébraïque des mains rendues fortes, qui évoque le courage et la détermination à agir.
theological_decisions:
- issue: Portée du salut exprimé par אוֹשִׁיעַ
  choice: je vous sauverai
  alternative: je vous délivrerai
  rationale: « Sauver » garde la portée large de l’intervention divine en faveur de Juda et d’Israël sans la limiter à une libération politique ou militaire, ni lui imposer des précisions sotériologiques étrangères au verset.
- issue: Identité collective de Juda et d’Israël
  choice: maison de Juda et maison d’Israël
  alternative: Juda et Israël
  rationale: La conservation de « maison » respecte la désignation collective et l’identité historique des groupes auxquels la promesse s’adresse.
- issue: Valeur de קְלָלָה
  choice: un objet de malédiction
  alternative: une malédiction
  rationale: Le choix principal explicite prudemment le statut subi par le peuple parmi les nations, tout en signalant en note la traduction plus littérale et plus concise.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « Tout comme… de même… » rend le renversement annoncé. L’image des mains fortes est conservée dans le texte et expliquée en note.
