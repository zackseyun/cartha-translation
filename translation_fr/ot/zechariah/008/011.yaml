source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹ֣א כַ/יָּמִ֤ים הָ/רִֽאשֹׁנִים֙ אֲנִ֔י לִ/שְׁאֵרִ֖ית הָ/עָ֣ם הַ/זֶּ֑ה נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/011.yaml
  text: But now I will not be to the remnant of this people as in the former days[b][a], declares Yahweh of Armies.
translation:
  language: fr
  text: Mais maintenant, je n’agirai pas envers le reste de ce peuple comme aux jours d’autrefois[a], déclare le SEIGNEUR des armées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : littéralement, « je ne serai pas pour le reste de ce peuple comme aux jours d’autrefois ». Il laisse au contexte le soin de préciser la nuance.'
    reason: alternative_reading
  - marker: b
    text: 'Traduction traditionnelle : « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Dans le contexte, la conjonction marque le contraste entre les difficultés passées et le changement annoncé; « Mais maintenant » rend clairement cette valeur adversative.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: comme aux jours d’autrefois
  rationale: Le préfixe כ indique une comparaison. Cette formulation française est naturelle tout en conservant la référence à la période antérieure.
- source_word: לִשְׁאֵרִית הָעָם הַזֶּה
  choice: pour le reste de ce peuple
  rationale: La préposition ל avec l’idée implicite d’« être » peut se rendre par « pour ». « Le reste » garde ici le sens collectif et prophétique de שְׁאֵרִית sans le réduire aux simples survivants.
- source_word: נְאֻם
  choice: déclare
  rationale: Ce terme introduit solennellement un oracle divin; « déclare » convient au registre prophétique.
- source_word: יְהוָה צְבָאוֹת
  choice: le SEIGNEUR des armées
  rationale: « SEIGNEUR » suit la convention française qui signale le nom divin יהוה, tandis que « des armées » traduit directement צְבָאוֹת et en conserve la portée militaire et céleste.
theological_decisions:
- issue: Prédicat implicite après אֲנִי (« je »)
  choice: 'Conserver la formulation elliptique : « je ne serai pas pour le reste de ce peuple comme aux jours d’autrefois »'
  alternative: « je n’agirai pas envers le reste de ce peuple comme aux jours d’autrefois »
  rationale: L’hébreu ne fournit pas de prédicat explicite après le pronom. Le contexte suggère un changement dans la manière dont Dieu traite le peuple, mais le texte principal ne précise pas davantage ce que l’original laisse ouvert.
- issue: Traduction du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH; l’Éternel
  rationale: La graphie en petites capitales reproduite ici par des capitales distingue le nom divin du titre ordinaire « Seigneur », sans imposer une vocalisation incertaine du tétragramme.
translation_notes:
  register: 'Français international moderne, sobre et solennel. La syntaxe légèrement marquée de « je ne serai pas pour » est volontaire : elle préserve l’ellipse de l’hébreu, tandis que la note fournit une formulation française plus explicite.'
