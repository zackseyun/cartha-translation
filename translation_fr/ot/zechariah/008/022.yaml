  text: וּ/בָ֨אוּ עַמִּ֤ים רַבִּים֙ וְ/גוֹיִ֣ם עֲצוּמִ֔ים לְ/בַקֵּ֛שׁ אֶת יְהוָ֥ה צְבָא֖וֹת בִּ/ירוּשָׁלִָ֑ם וּ/לְ/חַלּ֖וֹת אֶת פְּנֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/022.yaml
  text: And many peoples and mighty nations will come to seek Yahweh of hosts in Jerusalem and to entreat the favor of Yahweh[a].
translation:
  language: fr
  text: De nombreux peuples et des nations puissantes viendront chercher Yahweh des armées à Jérusalem et implorer la faveur de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rechercher la faveur de Yahweh ». L’expression hébraïque dit littéralement « la face de Yahweh »; c’est un idiome qui signifie implorer ou rechercher sa faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: viendront
  rationale: Dans ce discours prophétique, la forme verbale coordonnée a une valeur future. « Viendront » exprime naturellement cette perspective en français.
- source_word: עַמִּים רַבִּים
  choice: des peuples nombreux
  rationale: « Peuples » préserve la distinction avec גּוֹיִם, rendu ensuite par « nations »; l’ordre adjectival donne un français soutenu et naturel.
- source_word: וְגוֹיִם עֲצוּמִים
  choice: et des nations puissantes
  rationale: גּוֹיִם désigne ici des nations, tandis que עֲצוּמִים évoque leur force ou leur puissance collective.
- source_word: לְבַקֵּשׁ אֶת יְהוָה צְבָאוֹת
  choice: chercher Yahweh des armées
  rationale: « Chercher » garde le sens direct de בקשׁ. « Yahweh » transcrit le nom divin, et « des armées » conserve l’image concrète du titre צְבָאוֹת.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, « à Jérusalem » est la formulation locative idiomatique dans ce contexte de pèlerinage.
- source_word: וּלְחַלּוֹת אֶת פְּנֵי יְהוָה
  choice: et implorer la faveur de Yahweh
  rationale: L’expression idiomatique signifie supplier quelqu’un afin d’obtenir sa faveur. « Implorer la faveur » rend clairement la supplication sans traduire mécaniquement « la face ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Rendu de צְבָאוֹת
  choice: des armées
  alternative: tout-puissant; de l’univers
  rationale: « Des armées » conserve l’imagerie des troupes ou armées célestes associée au titre hébreu, sans la remplacer par un attribut plus général.
- issue: Sens de חלה את־פני
  choice: implorer la faveur de Yahweh
  alternative: chercher la faveur de Yahweh; implorer la présence de Yahweh
  rationale: L’idiome peut évoquer le fait d’apaiser, de supplier ou de rechercher la faveur d’une personne. Le texte principal exprime la supplication, tandis que la note maintient visible l’image hébraïque de la « face » et la nuance possible de présence.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre « peuples » et « nations » est conservé, ainsi que le titre imagé « Yahweh des armées ». La tournure reste accessible sans effacer l’idiome hébreu, expliqué en note.
