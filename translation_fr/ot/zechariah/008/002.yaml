source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת קִנֵּ֥אתִי לְ/צִיּ֖וֹן קִנְאָ֣ה גְדוֹלָ֑ה וְ/חֵמָ֥ה גְדוֹלָ֖ה קִנֵּ֥אתִי לָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/002.yaml
  text: 'Thus says Yahweh of hosts: I am jealous for Zion with great jealousy[b][a], and with great wrath I am jealous for her.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, le maître des armées : « Je suis animé d’une grande jalousie pour Sion, et c’est avec une grande fureur que je suis animé de jalousie pour elle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre, conformément à sa fonction de nom propre dans le texte hébreu.
- source_word: צְבָאוֹת
  choice: le maître des armées
  rationale: Dans le titre יְהוָה צְבָאוֹת, cette formulation française naturelle exprime l’autorité de Yahweh sur les armées sans limiter celles-ci aux seules forces terrestres.
- source_word: קִנֵּאתִי … קִנְאָה גְדוֹלָה
  choice: Je brûle … d’une jalousie ardente
  rationale: La tournure restitue en français actuel l’intensification produite par le verbe et le nom de même racine, tout en conservant explicitement la jalousie d’alliance.
- source_word: לְצִיּוֹן
  choice: pour Sion
  rationale: La préposition indique ici l’objet vers lequel se porte la jalousie passionnée de Yahweh.
- source_word: וְחֵמָה גְדוֹלָה
  choice: d’une grande fureur
  rationale: חֵמָה désigne une colère brûlante et intense; « fureur » en préserve la force, tandis que « grande » représente explicitement l’adjectif.
- source_word: לָהּ
  choice: pour elle
  rationale: Le pronom féminin renvoie à Sion et maintient sa personnification naturelle en français.
theological_decisions:
- issue: La jalousie divine
  choice: Conserver le mot « jalousie » et l’idée d’une passion ardente de Yahweh pour Sion.
  alternative: Rendre uniquement par « zèle » ou atténuer en « profond attachement ».
  rationale: La racine קנא peut exprimer jalousie et zèle; le contexte et la répétition intensive invitent à préserver la tension théologique d’une jalousie d’alliance plutôt qu’à l’effacer.
- issue: Rapport entre la fureur et Sion
  choice: Conserver la formulation « pour elle », sans préciser contre qui la fureur est dirigée.
  alternative: Expliciter « contre ses ennemis » ou comprendre la fureur comme dirigée contre Sion.
  rationale: Le texte affirme que Yahweh brûle pour Sion avec une grande fureur, mais n’en nomme pas ici la cible; l’expliciter résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, digne et oralement fluide. « Je brûle » rend l’intensité affective et permet de conserver la reprise hébraïque; « jalousie ardente » évite la lourdeur de « jaloux d’une grande jalousie ». Le nom Yahweh est maintenu, et « le maître des armées » rend le titre divin dans une formulation intelligible.
