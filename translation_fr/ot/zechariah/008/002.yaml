  rationale: La correction rétablit explicitement la jalousie dans les deux occurrences de la racine קנא, conserve l’intensif « grande » pour les deux substantifs, et ne précise pas contre qui la fureur est dirigée. Elle évite aussi l’ambiguïté affective de « brûler pour » tout en restant lisible en français moderne.
