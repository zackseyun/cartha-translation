review_pass:
  verdict: revise
  source_fidelity: La formulation « je brûle pour » ne rend pas de façon suffisamment explicite la racine קנא (« être jaloux / être zélé »), répétée dans les deux membres. En outre, l’adjectif « ardente » interprète « grande » et l’image du feu déjà présente dans « fureur » tend à homogénéiser deux termes distincts. La révision conserve la répétition, « grande », et l’ambiguïté quant à la cible de la fureur.
  naturalness: « Je suis animé d’une grande jalousie pour Sion » est un français moderne et digne, plus transparent que « je brûle pour Sion », qui peut évoquer une passion amoureuse et ne porte pas nécessairement le sens de jalousie. La reprise au second membre demeure volontairement proche pour refléter l’insistance hébraïque.
  terminology: « Yahweh » respecte le choix de translittération du nom divin. « Le maître des armées » est intelligible pour יהוה צבאות. « Jalousie » préserve le terme théologiquement chargé sans le réduire à « zèle »; la note propose légitimement cette autre possibilité lexicale.
  issues:
  - severity: medium
    issue: « Je brûle pour » remplace la jalousie/zèle explicite par une métaphore française ambiguë.
    rationale: קנא et son nom apparenté sont répétés dans le texte hébreu. « Brûler pour » peut se comprendre comme une passion amoureuse ou un vif enthousiasme et ne maintient pas explicitement le champ lexical de la jalousie.
  - severity: low
    issue: « Ardente » ne traduit pas explicitement « grande ».
    rationale: גדולה marque la grandeur ou l’intensité; « grande jalousie » la rend sans introduire l’imagerie du feu.
