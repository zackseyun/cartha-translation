language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֹ֤ד יֵֽשְׁבוּ֙ זְקֵנִ֣ים וּ/זְקֵנ֔וֹת בִּ/רְחֹב֖וֹת יְרוּשָׁלִָ֑ם וְ/אִ֧ישׁ מִשְׁעַנְתּ֛/וֹ בְּ/יָד֖/וֹ מֵ/רֹ֥ב יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/004.yaml
  text: 'Thus says Yahweh of hosts: Old men and old women will yet sit in the streets of Jerusalem[a], each with his staff in his hand because of great age.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh des armées : des hommes âgés et des femmes âgées s’assiéront encore sur les places de Jérusalem[a], chacun ayant son bâton à la main, à cause de son grand âge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les rues » ; le terme hébreu peut désigner des places publiques ou de larges rues.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule classique du messager prophétique, naturelle et digne en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin dans la source, plutôt que son remplacement par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Dans le titre divin, ce rendu concret conserve l’image de puissances organisées sous l’autorité de Yahweh.
- source_word: עֹד
  choice: encore
  rationale: Exprime ici le retour futur d’une vie paisible et normale à Jérusalem.
- source_word: יֵשְׁבוּ
  choice: s’assiéront
  rationale: Le sens concret de « s’asseoir » convient à la scène de personnes âgées présentes dans les lieux publics.
- source_word: זְקֵנִים וּזְקֵנוֹת
  choice: des hommes âgés et des femmes âgées
  rationale: Les deux formes désignent explicitement les personnes âgées des deux sexes, sans évoquer une fonction officielle d’anciens.
- source_word: בִּרְחֹבוֹת
  choice: sur les places
  rationale: Le terme peut désigner les larges espaces publics d’une ville; « places » rend bien cette image, tandis que « rues » demeure possible et figure en note.
- source_word: וְאִישׁ
  choice: chacun
  rationale: 'Le singulier masculin a ici une valeur distributive : chaque personne de la scène possède son propre bâton.'
- source_word: מִשְׁעַנְתּוֹ בְּיָדוֹ
  choice: son bâton à la main
  rationale: Rendu français idiomatique qui conserve le bâton comme appui concret ainsi que les suffixes possessifs distributifs.
- source_word: מֵרֹב יָמִים
  choice: à cause de son grand âge
  rationale: L’expression littérale « en raison de l’abondance des jours » est un idiome désignant un âge très avancé; le singulier s’accorde avec « chacun ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; le translittérer préserve cette donnée sans le remplacer par un titre.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » garde l’imagerie du terme hébreu sans préciser s’il s’agit exclusivement d’armées célestes ou terrestres.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « hommes âgés et femmes âgées » rend explicite le parallélisme masculin-féminin de l’hébreu. « Chacun son bâton à la main » conserve la tournure distributive et les possessifs masculins singuliers de la source.
