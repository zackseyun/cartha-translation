revisions:
- from: 'Ainsi parle Yahweh des armées : Des hommes âgés et des femmes âgées s’assiéront encore sur les places de Jérusalem[a], chacun son bâton à la main à cause de son grand âge.'
  to: 'Ainsi parle Yahweh des armées : des hommes âgés et des femmes âgées s’assiéront encore sur les places de Jérusalem[a], chacun ayant son bâton à la main, à cause de son grand âge.'
  rationale: 'Révision limitée à la syntaxe et à la ponctuation : « chacun ayant son bâton à la main » exprime plus clairement la relation distributive de וְאִישׁ מִשְׁעַנְתּוֹ בְּיָדוֹ, tout en conservant le bâton, la main et la causalité du grand âge. La note conserve l’ambiguïté lexicale de רְחֹבוֹת.'
  reviewer_model: gpt-5.6-terra
