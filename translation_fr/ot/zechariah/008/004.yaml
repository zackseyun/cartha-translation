review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est bien rendu : la formule prophétique, Yahweh, le titre « des armées », le rétablissement futur exprimé par « encore », les hommes et femmes âgés, les espaces publics de Jérusalem, le bâton et le grand âge sont tous préservés. La note rend correctement l’alternative sémantique de רְחֹבוֹת.'
  naturalness: La formulation est globalement naturelle en français moderne. Toutefois, « chacun son bâton à la main » est une ellipse un peu heurtée dans une traduction suivie, et peut se lire comme une simple juxtaposition plutôt que comme la proposition descriptive du texte. « Chacun ayant son bâton à la main » est plus fluide et explicite.
  terminology: « Yahweh des armées » est un rendu fidèle et usuel du titre יְהוָה צְבָאוֹת. « Hommes âgés et femmes âgées » évite à juste titre le faux sens institutionnel d’« anciens ». « Places » est défendable pour רְחֹבוֹת, avec l’alternative « rues » conservée en note.
  issues:
  - severity: low
    issue: Ellipse distributive dans « chacun son bâton à la main »
    rationale: La tournure française est possible, mais elle est moins nette que le lien verbal présent dans l’hébreu entre les personnes et leur bâton. L’ajout de « ayant » maintient le sens distributif sans introduire d’interprétation.
  - severity: low
    issue: Majuscule après les deux-points
    rationale: Dans cette phrase française, la majuscule à « Des hommes » n’est pas nécessaire. La minuscule suit la ponctuation française courante.
  revised_text: 'Ainsi parle Yahweh des armées : des hommes âgés et des femmes âgées s’assiéront encore sur les places de Jérusalem[a], chacun ayant son bâton à la main, à cause de son grand âge.'
  revised_footnotes:
