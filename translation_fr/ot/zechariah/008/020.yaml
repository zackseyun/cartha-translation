lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée et naturelle en français moderne ; le présent rend la valeur déclarative de la formule hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend directement le pluriel hébreu dans le titre divin sans limiter ces armées à une seule sphère.
- source_word: עֹד אֲשֶׁר יָבֹאוּ
  choice: viendront encore
  rationale: Exprime naturellement l'idée qu'un événement supplémentaire reste à venir dans la promesse prophétique.
- source_word: עַמִּים
  choice: des peuples
  rationale: Conserve le sens collectif pluriel sans le restreindre aux États politiques ; « nations » demeure possible.
- source_word: וְיֹשְׁבֵי
  choice: ainsi que les habitants de
  rationale: Rend le participe construit et coordonne naturellement les deux groupes en français.
- source_word: עָרִים רַבּוֹת
  choice: nombreuses villes
  rationale: רַבּוֹת indique ici le grand nombre plutôt que la grandeur des villes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l'univers ; des puissances
  rationale: « Des armées » garde l'image source et son ampleur potentielle sans préciser s'il s'agit d'armées célestes, terrestres ou des deux.
translation_notes:
  register: Français international moderne, digne et lisible. La formule « Ainsi parle » conserve le registre prophétique. La phrase est ponctuée comme une déclaration complète, bien que le verset suivant poursuive le propos.
