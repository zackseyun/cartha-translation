source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ תֶּחֱזַ֣קְנָה יְדֵי/כֶ֔ם הַ/שֹּֽׁמְעִים֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה אֵ֖ת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה מִ/פִּי֙ הַ/נְּבִיאִ֔ים אֲ֠שֶׁר בְּ/י֞וֹם יֻסַּ֨ד בֵּית יְהוָ֧ה צְבָא֛וֹת הַ/הֵיכָ֖ל לְ/הִבָּנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/009.yaml
  text: 'Thus says Yahweh of Armies: Let your hands be strong[c][b][a], you who in these days are hearing these words from the mouth of the prophets who were present on the day the house of Yahweh of Armies was founded for the temple to be built.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé des armées[a] : « Que vos mains soient fortes[b], vous qui, en ces jours-ci, entendez ces paroles de la bouche des prophètes qui étaient présents[c] le jour où furent posées les fondations de la maison de Yahvé des armées, pour que le temple soit construit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
  - marker: b
    text: Cette expression hébraïque est un appel à prendre courage et à agir avec détermination.
    reason: idiom_explanation
  - marker: c
    text: 'L’hébreu est condensé. Autre compréhension possible : « les prophètes qui ont parlé le jour où furent posées les fondations de la maison de Yahvé des armées, pour que le temple soit construit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule française naturelle conserve la solennité de la formule hébraïque du messager prophétique.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » représente directement le nom divin, et « des armées » rend le sens concret de צְבָאוֹת sans recourir au terme vieilli « légions » ni atténuer l’image.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: Que vos mains soient fortes
  rationale: La traduction garde l’image hébraïque des mains fortifiées, qui appelle au courage et à la détermination dans l’action.
- source_word: הַשֹּׁמְעִים ... אֵת הַדְּבָרִים הָאֵלֶּה
  choice: vous qui ... entendez ces paroles
  rationale: Le participe désigne ceux qui reçoivent actuellement le message; « paroles » convient au contexte d’une proclamation prophétique.
- source_word: מִפִּי הַנְּבִיאִים
  choice: de la bouche des prophètes
  rationale: Cette expression reste intelligible en français et préserve l’image concrète de l’hébreu plutôt que de la réduire à « de la part des prophètes ».
- source_word: אֲשֶׁר בְּיוֹם יֻסַּד
  choice: qui étaient présents le jour où furent posées les fondations
  rationale: Le relatif hébreu est très condensé. Cette formulation explicite prudemment le lien temporel retenu tout en signalant en note une autre construction possible.
- source_word: בֵּית יְהוָה צְבָאוֹת הַהֵיכָל
  choice: la maison de Yahvé des armées ... le temple
  rationale: « Maison » conserve la désignation hébraïque, tandis que « temple » précise la nature de l’édifice.
- source_word: לְהִבָּנוֹת
  choice: pour que le temple soit construit
  rationale: La tournure exprime la visée de la fondation et conserve la forme passive de l’infinitif hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahvé » le représente comme nom d’alliance plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » maintient l’imagerie militaire et céleste du titre; « de l’univers », bien que courant dans certaines traditions françaises, interprète plus largement le terme.
- issue: Référent et contenu implicite de אֲשֶׁר
  choice: les prophètes qui étaient présents
  alternative: les prophètes qui ont parlé
  rationale: La proposition relative est elliptique et permet plusieurs explicitations. Le texte principal retient la présence des prophètes au moment indiqué, tandis que la note conserve l’autre lecture plausible sans trancher abusivement.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La cadence prophétique et les images concrètes de l’hébreu sont conservées; les explicitations nécessaires restent minimales, et l’ambiguïté de la proposition relative est documentée en note.
