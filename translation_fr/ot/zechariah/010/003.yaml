revisions:
- from: Ma colère s’enflamme contre les bergers[a], et j’interviendrai contre les boucs pour les punir. Car Yahvé, le maître des armées, est intervenu en faveur de son troupeau, la maison de Juda, et il fera d’eux son cheval majestueux au combat.
  to: Ma colère s’enflamme contre les bergers et je punirai les boucs[a], car Yahvé des armées est intervenu en faveur de son troupeau, la maison de Juda; il les rendra semblables à son cheval majestueux au combat.
  rationale: La révision privilégie les équivalents français directs des expressions hébraïques, maintient l’imagerie pastorale et animale, et préserve le contraste entre l’intervention punitive contre les boucs et l’intervention favorable envers le troupeau. La note est reformulée de manière non péremptoire afin de ne pas imposer l’interprétation métaphorique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:38:27Z'
review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour un rendu plus direct de יְהוָה צְבָאוֹת (« Yahvé des armées ») et pour éviter le développement explicatif « j’interviendrai… pour les punir », là où l’hébreu emploie directement le verbe de sanction. La comparaison finale est conservée sans introduire « cheval de guerre », absent du texte.
  naturalness: Le français révisé est fluide et actuel. « Il les rendra semblables à son cheval majestueux au combat » exprime clairement la comparaison sans la tournure un peu abrupte « il fera d’eux son cheval ».
  terminology: « Bergers », « boucs », « troupeau », « maison de Juda » et « Yahvé des armées » conservent les images et termes déterminants du texte. La note décrit la valeur métaphorique possible sans l’imposer.
  issues:
  - severity: medium
    issue: « Yahvé, le maître des armées » ajoute un titre explicatif qui ne correspond pas aussi directement à la construction hébraïque.
    rationale: יְהוָה צְבָאוֹת se rend fidèlement et naturellement par « Yahvé des armées ». « Le maître » explicite une relation de domination qui n’est pas formulée par le texte.
  - severity: low
    issue: « J’interviendrai contre les boucs pour les punir » est plus développé que le verbe hébreu.
    rationale: אֶפְקֹד a ici un sens punitif; « je punirai » le rend directement, sans ajouter une étape d’« intervention » et sa finalité.
  - severity: low
    issue: La note portant sur les deux figures animales est ancrée seulement après « bergers ».
    rationale: Placer l’appel de note après « boucs » permet de couvrir naturellement l’ensemble du binôme « bergers / boucs » auquel la note se rapporte.
  revised_text: Ma colère s’enflamme contre les bergers et je punirai les boucs[a], car Yahvé des armées est intervenu en faveur de son troupeau, la maison de Juda; il les rendra semblables à son cheval majestueux au combat.
