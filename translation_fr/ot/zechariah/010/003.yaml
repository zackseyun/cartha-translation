source:
  edition: WLC
  text: עַל הָֽ/רֹעִים֙ חָרָ֣ה אַפִּ֔/י וְ/עַל הָ/עַתּוּדִ֖ים אֶפְק֑וֹד כִּֽי פָקַד֩ יְהוָ֨ה צְבָא֤וֹת אֶת עֶדְר/וֹ֙ אֶת בֵּ֣ית יְהוּדָ֔ה וְ/שָׂ֣ם אוֹתָ֔/ם כְּ/ס֥וּס הוֹד֖/וֹ בַּ/מִּלְחָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/003.yaml
  text: My anger burns against the shepherds[a], and I will punish the male goats; for Yahweh of Armies has attended to his flock, the house of Judah[b], and will make them like his majestic horse in battle.
translation:
  language: fr
  text: Ma colère s’enflamme contre les bergers et je punirai les boucs[a], car Yahvé des armées est intervenu en faveur de son troupeau, la maison de Juda; il les rendra semblables à son cheval majestueux au combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « bergers » et les « boucs » peuvent représenter ici les dirigeants et les personnages importants du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: les bergers
  rationale: Le sens concret préserve l’image pastorale employée pour les dirigeants du peuple; la note en explicite la portée métaphorique.
- source_word: חָרָה אַפִּי
  choice: Ma colère s’enflamme
  rationale: Cette formulation française naturelle conserve l’intensité de l’idiome hébreu exprimant une colère ardente.
- source_word: הָעַתּוּדִים
  choice: les boucs
  rationale: Le terme désigne littéralement des boucs et, par métaphore, des personnages éminents. Garder l’animal maintient la cohérence de l’image.
- source_word: אֶפְקֹד
  choice: j’interviendrai contre … pour les punir
  rationale: Dans ce premier contexte, פקד désigne une intervention punitive. La formulation garde l’idée d’intervention tout en rendant explicite sa finalité judiciaire.
- source_word: פָקַד
  choice: est intervenu en faveur de
  rationale: La seconde occurrence de פקד est favorable. Cette traduction maintient le lien lexical avec la première occurrence sans confondre leurs effets opposés.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le maître des armées
  rationale: Yahvé rend directement le nom divin; «le maître des armées» exprime naturellement l’autorité impliquée par צְבָאוֹת et convient au contexte militaire.
- source_word: עֶדְרוֹ
  choice: son troupeau
  rationale: Ce choix est naturel en français et prolonge l’image des bergers.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: La formulation traditionnelle reste claire et conserve explicitement le groupe familial et dynastique désigné par l’hébreu.
- source_word: וְשָׂם אוֹתָם
  choice: il fera d’eux
  rationale: Le parfait avec waw présente ici le résultat futur de l’intervention divine; «fera d’eux» introduit naturellement la comparaison suivante.
- source_word: כְּסוּס הוֹדוֹ
  choice: son cheval majestueux
  rationale: הוֹד exprime la majesté ou la splendeur. Le contexte militaire est déjà fourni par «au combat», sans qu’il soit nécessaire d’ajouter «de guerre».
- source_word: בַּמִּלְחָמָה
  choice: au combat
  rationale: Équivalent français idiomatique qui rend précisément le cadre martial.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin. «Yahvé» le représente directement en français moderne sans le remplacer par un titre.
- issue: Interprétation de עַתּוּדִים
  choice: Conserver «les boucs» dans le texte
  alternative: les chefs / les dirigeants
  rationale: Le terme peut représenter métaphoriquement les notables ou dirigeants, mais conserver l’image animale évite de supprimer la métaphore pastorale et laisse ouverte sa portée exacte.
- issue: Rapport entre les deux occurrences de פקד
  choice: Employer deux formulations apparentées d’intervention, l’une punitive et l’autre favorable
  alternative: traduire séparément par «punir» et «prendre soin de»
  rationale: Le contraste contextuel est explicité sans effacer la répétition délibérée du même verbe hébreu.
translation_notes:
  register: Français international actuel, digne et accessible. L’image pastorale et animale est conservée, ainsi que le contraste entre les deux interventions exprimées par פקד. La syntaxe est légèrement déployée pour rendre ce contraste clairement en français.
