source:
  edition: WLC
  text: וְ/אֶזְרָעֵ/ם֙ בָּֽ/עַמִּ֔ים וּ/בַ/מֶּרְחַקִּ֖ים יִזְכְּר֑וּ/נִי וְ/חָי֥וּ אֶת בְּנֵי/הֶ֖ם וָ/שָֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/009.yaml
  text: I will sow them among the peoples[a], and in distant places they will remember me[b]; they and their children will live, and they will return.
translation:
  language: fr
  text: Je les sèmerai parmi les peuples[a] et, dans les contrées lointaines, ils se souviendront de moi ; ils vivront avec leurs enfants et reviendront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les disperserai parmi les nations ». Le verbe hébreu signifie littéralement « semer » ; l’image peut évoquer à la fois la dispersion et une implantation voulue en vue d’un accroissement futur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶזְרָעֵם
  choice: Je les sèmerai
  rationale: Le verbe זרע signifie littéralement « semer ». Dans ce contexte, l’image peut évoquer à la fois la dispersion et une implantation voulue en vue d’un avenir fécond ; « sèmerai » préserve cette double portée.
- source_word: בָּעַמִּים
  choice: parmi les peuples
  rationale: Le pluriel עַמִּים désigne des peuples ou des nations. « Peuples » rend naturellement les groupes humains sans suggérer nécessairement des États modernes.
- source_word: וּבַמֶּרְחַקִּים
  choice: dans les contrées lointaines
  rationale: מֶרְחַקִּים désigne des lieux éloignés. « Contrées lointaines » conserve la valeur locative dans un registre actuel et digne.
- source_word: יִזְכְּרוּנִי
  choice: ils se souviendront de moi
  rationale: Le verbe זכר avec le suffixe de première personne signifie directement « se souvenir de moi », sans qu’il soit nécessaire d’ajouter « là-bas ».
- source_word: וְחָיוּ
  choice: vivront
  rationale: חיה exprime ici la vie, éventuellement maintenue ou renouvelée. « Vivront » préserve cette amplitude sans imposer « survivront » ou « revivront ».
- source_word: אֶת־בְּנֵיהֶם
  choice: eux et leurs enfants
  rationale: 'אֶת est compris ici dans un sens comitatif : les parents vivent avec leurs enfants. La formulation française en fait des co-sujets et exprime clairement que les uns comme les autres vivront.'
- source_word: וָשָׁבוּ
  choice: ils reviendront
  rationale: שוב signifie « revenir » ou « retourner ». Dans ce contexte de restauration, « reviendront » conserve une possible résonance à la fois géographique et relationnelle sans réduire le terme au seul repentir.
theological_decisions:
- issue: Portée de la métaphore des semailles dans un contexte de restauration
  choice: Conserver l’image de semailles, qui peut réunir dispersion et dessein fécond en vue du retour.
  alternative: Traduire uniquement par « disperser » pour souligner le jugement, ou uniquement par « planter » pour souligner l’accroissement.
  rationale: Le contexte de restauration n’efface pas la dispersion. Le verbe « semer » maintient la tension du texte entre éloignement parmi les peuples, souvenir de Dieu, vie et retour.
- issue: Portée du retour
  choice: Employer « revenir » sans préciser s’il s’agit uniquement d’un retour géographique ou aussi d’un retour à Dieu.
  alternative: Expliciter « revenir dans leur pays » ou « revenir à Dieu ».
  rationale: Le verbe hébreu peut porter plusieurs résonances dans ce contexte ; ne pas ajouter de complément préserve cette ambiguïté théologique.
translation_notes:
  register: 'Français international moderne, clair et digne. « Contrées lointaines » garde une légère élévation poétique adaptée au registre prophétique sans être archaïque. La ponctuation fait ressortir la progression : dispersion, souvenir, vie et retour.'
