  source_fidelity: 'Le texte rend fidèlement la progression de l’hébreu : semer parmi les peuples, souvenir dans les lieux éloignés, vie, puis retour. « Je les sèmerai » conserve à juste titre la métaphore de זרע. Pour וְחָיוּ אֶת־בְּנֵיהֶם, l’emploi comitatif de אֶת est le rendu le plus direct : « ils vivront avec leurs enfants ».'
