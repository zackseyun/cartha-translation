source:
  edition: WLC
  text: מִמֶּ֤/נּוּ פִנָּה֙ מִמֶּ֣/נּוּ יָתֵ֔ד מִמֶּ֖/נּוּ קֶ֣שֶׁת מִלְחָמָ֑ה מִמֶּ֛/נּוּ יֵצֵ֥א כָל נוֹגֵ֖שׂ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/004.yaml
  text: From him will come the cornerstone[a], from him the tent peg, from him the battle bow[b]; from him every ruler will go out together.
translation:
  language: fr
  text: De lui viendra la pierre angulaire, de lui le piquet de tente, de lui l’arc de guerre[a] ; de lui sortiront ensemble tous ceux qui exercent l’autorité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « pierre angulaire », le « piquet de tente » et l’« arc de guerre » sont des images de stabilité, de soutien et de puissance militaire provenant de Juda.
    reason: cultural_note
  - marker: b
    text: Ou « tout oppresseur », « tout chef de corvée » ou « tout exacteur ». Le terme hébreu désigne souvent celui qui contraint, impose du travail ou exige un tribut ; dans ce contexte, il peut toutefois désigner plus largement une personne qui exerce l’autorité.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: La forme hébraïque porte un suffixe masculin singulier. Dans le contexte, elle renvoie à Juda, envisagé collectivement ; « de lui » conserve cette forme et la répétition emphatique.
- source_word: פִנָּה
  choice: la pierre angulaire
  rationale: Le nom peut désigner l’angle ou la pierre d’angle. Ici, au sein d’une série d’images de stabilité, d’appui et de puissance, « pierre angulaire » rend naturellement la valeur métaphorique.
- source_word: יָתֵד
  choice: le piquet de tente
  rationale: Le terme désigne un piquet, souvent celui qui fixe une tente. Cette formulation conserve l’image concrète de fermeté et de soutien.
- source_word: קֶשֶׁת מִלְחָמָה
  choice: l’arc de guerre
  rationale: Le groupe construit désigne un arc destiné au combat. « Arc de guerre » est précis, digne et proche de la structure hébraïque.
- source_word: יֵצֵא
  choice: sortiront
  rationale: Le verbe יָצָא signifie fondamentalement sortir. Le pluriel français s’accorde avec « tous ceux », tandis que l’hébreu emploie un singulier distributif après כָּל.
- source_word: כָל נוֹגֵשׂ
  choice: tous ceux qui exercent l’autorité
  rationale: נוֹגֵשׂ désigne habituellement quelqu’un qui presse, impose une charge ou exige un tribut, mais peut ici évoquer plus largement une autorité dirigeante. Cette traduction garde une certaine neutralité sans effacer l’ambiguïté, signalée en note.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe exprime l’action collective. « Ensemble » en conserve simplement la portée sans préciser davantage le rapport entre les figures évoquées.
theological_decisions:
- issue: Valeur positive, neutre ou négative de כָל נוֹגֵשׂ
  choice: « tous ceux qui exercent l’autorité », lecture neutre adaptée au contexte
  alternative: « tout oppresseur », « tout chef de corvée » ou « tout exacteur »
  rationale: Les images précédentes présentent des forces de stabilité, de soutien et de combat issues de Juda. Une désignation neutre de l’autorité s’intègre à cette progression, mais le sens souvent coercitif du mot hébreu demeure réel et est donc conservé en note.
- issue: Référent du suffixe masculin singulier dans מִמֶּנּוּ
  choice: « de lui », renvoyant à Juda comme réalité collective
  alternative: « d’elle » si l’on explicite la communauté de Juda, ou « d’eux » si l’on privilégie ses membres
  rationale: Le texte hébreu répète une forme masculine singulière. La traduction la maintient afin de ne pas résoudre silencieusement la tension entre Juda comme entité singulière et le peuple qui en fait partie.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « de lui » reproduit l’anaphore hébraïque. Les métaphores concrètes sont maintenues, et l’ambiguïté du dernier titre est explicitée sans imposer une lecture confessionnelle.
