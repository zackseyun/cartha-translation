id: ZEC.10.6
reference: Zechariah 10:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גִבַּרְתִּ֣י אֶת בֵּ֣ית יְהוּדָ֗ה וְ/אֶת בֵּ֤ית יוֹסֵף֙ אוֹשִׁ֔יעַ וְ/הֽוֹשְׁבוֹתִי/ם֙ כִּ֣י רִֽחַמְתִּ֔י/ם וְ/הָי֖וּ כַּ/אֲשֶׁ֣ר לֹֽא זְנַחְתִּ֑י/ם כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/אֶעֱנֵֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/006.yaml
  text: I will strengthen the house of Judah[a], and I will save the house of Joseph. I will restore them, because I have had compassion on them, and they will be as though I had not rejected them; for I am Yahweh their God[b], and I will answer them.
translation:
  language: fr
  text: Je fortifierai la maison de Juda et je sauverai la maison de Joseph[a]. Je les ramènerai[b], car j’ai eu compassion d’eux. Ils seront comme si je ne les avais pas rejetés, car je suis Yahweh, leur Dieu, et je leur répondrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Joseph » désigne collectivement les descendants de Joseph et, souvent, plus particulièrement les tribus du Nord.
    reason: cultural_note
  - marker: b
    text: 'Ou : « Je les rétablirai. » Le verbe hébreu peut exprimer le retour ou le rétablissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּי
  choice: Je fortifierai
  rationale: Le piel de גבר exprime ici l’action de rendre fort. « Fortifier » restitue clairement cette valeur causative dans un français naturel et digne.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Conserve l’expression collective et tribale de l’hébreu plutôt que de la réduire au seul nom « Juda ».
- source_word: בֵּית יוֹסֵף
  choice: la maison de Joseph
  rationale: Maintient la désignation collective littérale. Dans le contexte prophétique, elle peut viser les descendants de Joseph, notamment les tribus du Nord, ce qu’explicite la note.
- source_word: אוֹשִׁיעַ
  choice: je sauverai
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. « Sauver » est direct et conserve toute l’étendue du terme.
- source_word: וְהוֹשְׁבוֹתִים
  choice: Je les rétablirai
  rationale: La forme hiphil de שוב peut signifier ramener ou rétablir. « Rétablir » convient au contexte global de restauration sans effacer la nuance spatiale, signalée en note.
- source_word: כִּי רִחַמְתִּים
  choice: car j’ai eu compassion d’eux
  rationale: רחם exprime la compassion ou la miséricorde. Cette formulation respecte le parfait hébreu et présente la compassion divine comme le fondement de la promesse.
- source_word: וְהָיוּ כַּאֲשֶׁר לֹא זְנַחְתִּים
  choice: Ils seront comme si je ne les avais pas rejetés
  rationale: « Rejeter » traduit sobrement זנח, tandis que « comme si » préserve la comparaison contrefactuelle sans nier le rejet antérieur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin personnel est translittéré plutôt que remplacé par un titre.
- source_word: וְאֶעֱנֵם
  choice: et je leur répondrai
  rationale: Le qal de ענה signifie directement répondre. La formulation française conserve ce sens sans l’interpréter simplement comme « entendre ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de « la maison de Joseph »
  choice: Conserver la désignation collective dans le texte et l’expliquer en note
  alternative: Remplacer directement par « les tribus du Nord » ou « Éphraïm »
  rationale: L’hébreu nomme Joseph. La traduction ne doit pas résoudre silencieusement la portée historique de cette expression.
- issue: Rapport entre rejet passé et restauration promise
  choice: comme si je ne les avais pas rejetés
  alternative: comme si je ne les avais jamais rejetés
  rationale: L’ajout de « jamais » renforcerait inutilement la formulation et pourrait brouiller la tension entre le rejet antérieur et la restauration annoncée.
translation_notes:
  register: Français international moderne, clair et solennel. Les expressions collectives « maison de Juda » et « maison de Joseph » sont conservées, tandis que la syntaxe reste fluide et accessible.
