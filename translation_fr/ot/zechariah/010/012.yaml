source:
  edition: WLC
  text: וְ/גִבַּרְתִּי/ם֙ בַּֽ/יהוָ֔ה וּ/בִ/שְׁמ֖/וֹ יִתְהַלָּ֑כוּ נְאֻ֖ם יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/012.yaml
  text: I will strengthen them in Yahweh[b][a], and in his name they will walk,” declares Yahweh.
translation:
  language: fr
  text: Je les fortifierai en Yahweh[a], et ils marcheront en son nom[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je les rendrai puissants en Yahweh ». La préposition peut aussi être comprise au sens de « par » ou « grâce à ».'
    reason: lexical_alternative
  - marker: b
    text: « En son nom » peut aussi évoquer son autorité ou son caractère révélé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּים
  choice: Je les rendrai forts
  rationale: Le verbe גבר à la forme intensive ou causative, avec un sujet à la première personne du singulier et un complément à la troisième personne du masculin pluriel, exprime l’action de rendre fort. Cette formulation française conserve clairement cette valeur causative.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב peut ici indiquer la sphère ou le fondement de leur force. « En Yahweh » préserve cette formulation et son ambiguïté plutôt que de la réduire à un simple moyen.
- source_word: וּבִשְׁמוֹ
  choice: et en son nom
  rationale: « Nom » peut évoquer à la fois le nom lui-même, l’autorité, la réputation et le caractère révélé. La traduction littérale conserve cette richesse.
- source_word: יִתְהַלָּכוּ
  choice: ils marcheront
  rationale: Le hitpael de הלך peut désigner le fait de marcher, d’aller et venir ou de se conduire. « Marcher » maintient la métaphore biblique sans la limiter à la seule conduite morale.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique française est claire et actuelle, tout en gardant la force solennelle de la déclaration divine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » rend le nom d’alliance comme un nom propre, conformément à l’orientation fournie.
- issue: Portée de l’expression « marcher en son nom »
  choice: Conserver la métaphore « marcher »
  alternative: vivre en son nom ; se conduire en son nom
  rationale: La métaphore peut inclure la conduite, l’allégeance et une vie placée sous l’autorité de Yahweh. La conserver évite de trancher entre ces nuances.
- issue: Valeur de ב dans בַּיהוָה
  choice: en Yahweh
  alternative: par Yahweh ; grâce à Yahweh
  rationale: L’hébreu peut exprimer la sphère, le fondement ou le moyen. Le choix principal suit formellement le texte et une note signale les autres valeurs possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que « Je les rendrai forts » est plus naturel que « Je les fortifierai » dans ce contexte. Les répétitions du nom Yahweh et la métaphore de la marche sont conservées.
