source:
  edition: WLC
  text: וְ/עָבַ֨ר בַּ/יָּ֜ם צָרָ֗ה וְ/הִכָּ֤ה בַ/יָּם֙ גַּלִּ֔ים וְ/הֹבִ֕ישׁוּ כֹּ֖ל מְצוּל֣וֹת יְאֹ֑ר וְ/הוּרַד֙ גְּא֣וֹן אַשּׁ֔וּר וְ/שֵׁ֥בֶט מִצְרַ֖יִם יָסֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/011.yaml
  text: He will pass through the sea of distress and strike the waves of the sea[a], and all the depths of the Nile will dry up. The pride of Assyria will be brought down[c][b], and the scepter of Egypt will depart.
translation:
  language: fr
  text: Il traversera la mer de la détresse[a] et frappera les vagues de la mer. Toutes les profondeurs du Nil[b] seront asséchées. L’orgueil de l’Assyrie sera abaissé, et le sceptre de l’Égypte[c] disparaîtra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une mer de détresse » ou « la mer agitée ». L’expression hébraïque est compacte et peut évoquer la délivrance lors de l’Exode plutôt que désigner seulement une étendue d’eau littérale.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut signifier « fleuve », mais, dans un contexte égyptien, il désigne couramment le Nil.
    reason: lexical_alternative
  - marker: c
    text: Ou « le bâton de l’Égypte ». « Sceptre » fait ressortir le sens probable d’autorité souveraine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Il traversera
  rationale: Dans la suite de ce discours prophétique, le parfait précédé de וְ reçoit naturellement une valeur future. « Traversera » conserve l’image du passage et s’accorde avec le sujet divin implicite.
- source_word: בַּיָּם צָרָה
  choice: la mer de la détresse
  rationale: La formulation nominale compacte est conservée plutôt que transformée sans nécessité en adjectif. Elle peut évoquer à la fois une mer réelle et l’imagerie de la délivrance hors de la détresse.
- source_word: וְהִכָּה בַיָּם גַּלִּים
  choice: et frappera les vagues de la mer
  rationale: « Frapper » rend le sens courant de נכה. La syntaxe est légèrement réorganisée pour produire un français naturel tout en maintenant l’image des vagues frappées.
- source_word: וְהֹבִישׁוּ
  choice: seront asséchées
  rationale: Dans ce contexte aquatique, la racine יבש exprime l’assèchement. Le passif français restitue clairement le résultat de l’action causative.
- source_word: כֹּל מְצוּלוֹת יְאֹר
  choice: Toutes les profondeurs du Nil
  rationale: מְצוּלוֹת désigne les profondeurs ou lieux profonds. Dans le contexte égyptien, יְאֹר renvoie normalement au Nil, tout en pouvant avoir le sens plus général de « fleuve ».
- source_word: וְהוּרַד גְּאוֹן אַשּׁוּר
  choice: L’orgueil de l’Assyrie sera abaissé
  rationale: Dans ce contexte de jugement, גְּאוֹן évoque l’orgueil ou l’élévation. Le passif « sera abaissé » rend la forme hophal de ירד sans préciser un agent que l’hébreu laisse implicite.
- source_word: וְשֵׁבֶט מִצְרַיִם יָסוּר
  choice: et le sceptre de l’Égypte disparaîtra
  rationale: שֵׁבֶט peut désigner un bâton ou un sceptre ; en parallèle avec la puissance assyrienne, « sceptre » exprime vraisemblablement l’autorité souveraine. « Disparaîtra » rend ici la cessation ou le retrait exprimé par סור.
theological_decisions:
- issue: Continuité du sujet et agent implicite
  choice: Le pronom singulier « Il » renvoie à Dieu, sujet implicite dans le contexte, tandis que les passifs suivants ne répètent pas explicitement l’agent.
  alternative: Comprendre certains verbes comme ayant pour sujet collectif le peuple restauré.
  rationale: La suite verbale au singulier et le contexte des promesses de délivrance favorisent Dieu comme sujet de la traversée et de l’action contre la mer. La formulation française évite toutefois d’ajouter son nom là où ce verset ne le donne pas.
- issue: Portée de l’image maritime
  choice: Conserver « la mer de la détresse » comme expression imagée ouverte, susceptible d’évoquer l’Exode.
  alternative: Réduire l’expression à une mer agitée ou à une étendue d’eau strictement littérale.
  rationale: L’hébreu est compact et laisse coexister une scène maritime et une image de détresse. La traduction ne tranche pas au-delà de ce que permet le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide sans effacer la densité de l’image hébraïque. « Détresse », « orgueil », « abaissé » et « sceptre » maintiennent le registre prophétique sans archaïsmes marqués.
