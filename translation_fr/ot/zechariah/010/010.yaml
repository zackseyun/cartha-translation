source:
  edition: WLC
  text: וַ/הֲשִֽׁיבוֹתִי/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מֵֽ/אַשּׁ֖וּר אֲקַבְּצֵ֑/ם וְ/אֶל אֶ֨רֶץ גִּלְעָ֤ד וּ/לְבָנוֹן֙ אֲבִיאֵ֔/ם וְ/לֹ֥א יִמָּצֵ֖א לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/010.yaml
  text: I will bring them back from the land of Egypt[a], and gather them from Assyria; I will bring them into the land of Gilead and Lebanon, and no room will be found for them.
translation:
  language: fr
  text: Je les ramènerai du pays d’Égypte et je les rassemblerai d’Assyrie. Je les ferai venir au pays de Galaad et au Liban, et il ne s’y trouvera pas assez de place pour eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il ne sera pas trouvé pour eux »; le texte hébreu ne précise pas ce qui ne sera pas trouvé.'
    reason: Signaler l’objet implicite et préserver l’ambiguïté de la formulation hébraïque.
lexical_decisions:
- source_word: וַהֲשִׁיבוֹתִים
  choice: Je les ramènerai
  rationale: Le hiphil de שוב exprime ici l’action de faire revenir. « Ramener » est naturel en français et conserve clairement le mouvement spatial du retour.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette formulation rend explicitement אֶרֶץ et préserve la portée géographique ainsi que l’écho possible à l’Exode.
- source_word: וּמֵאַשּׁוּר אֲקַבְּצֵם
  choice: et je les rassemblerai depuis l’Assyrie
  rationale: קבץ désigne couramment le rassemblement de personnes dispersées. « Depuis » marque la provenance, même si « d’Assyrie » serait plus idiomatique.
- source_word: וְאֶל אֶרֶץ גִּלְעָד וּלְבָנוֹן
  choice: au pays de Galaad et au Liban
  rationale: אֶל indique le mouvement vers ces territoires. La syntaxe française exige de répéter la préposition devant « Liban »; « pays » rend explicitement אֶרֶץ associé à Galaad.
- source_word: אֲבִיאֵם
  choice: Je les ferai venir
  rationale: Le hiphil de בוא signifie « faire venir, amener ». « Ferai venir » évite une répétition lourde de « ramènerai » tout en conservant l’action causative.
- source_word: וְלֹא יִמָּצֵא לָהֶם
  choice: et il ne s’y trouvera pas assez de place pour eux
  rationale: L’hébreu dit littéralement « et il ne sera pas trouvé pour eux », sans nommer l’objet. Le contexte territorial permet d’expliciter « assez de place »; « s’y » rattache naturellement la proposition à Galaad et au Liban.
theological_decisions:
- issue: Objet implicite dans וְלֹא יִמָּצֵא לָהֶם
  choice: 'Expliciter l’idée d’un espace insuffisant : « il ne s’y trouvera pas assez de place pour eux »'
  alternative: « et il ne s’y trouvera pas de place pour eux » ou, plus littéralement, « et il ne s’en trouvera pas pour eux »
  rationale: Le texte omet ce qui ne sera pas trouvé. Le contexte suggère la place disponible pour la population ramenée, mais l’explicitation reste interprétative; elle est donc signalée en note afin de préserver l’ambiguïté formelle de l’hébreu.
- issue: Valeur de la conjonction וְ devant la dernière proposition
  choice: et
  alternative: jusqu’à ce que / si bien que
  rationale: La simple coordination reflète directement la conjonction hébraïque et évite d’imposer une relation finale ou résultative plus précise que celle qu’exprime le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les futurs rendent la suite des actions divines annoncées. La ponctuation en deux phrases allège la longue coordination hébraïque sans modifier sa progression.
