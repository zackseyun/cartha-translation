source:
  edition: WLC
  text: וְ/הָי֨וּ כְ/גִבֹּרִ֜ים בּוֹסִ֨ים בְּ/טִ֤יט חוּצוֹת֙ בַּ/מִּלְחָמָ֔ה וְ/נִ֨לְחֲמ֔וּ כִּ֥י יְהוָ֖ה עִמָּ֑/ם וְ/הֹבִ֖ישׁוּ רֹכְבֵ֥י סוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/005.yaml
  text: They will be like mighty men[a], trampling the mire of the streets in battle; they will fight, because Yahweh is with them, and they will put horsemen to shame.
translation:
  language: fr
  text: Ils seront comme des hommes vaillants[a], foulant aux pieds la boue des rues au combat ; ils combattront, car Yahvé est avec eux, et ils couvriront de honte les cavaliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des guerriers ». Le terme hébreu est au masculin pluriel et évoque ici des combattants forts et courageux.
    reason: alternative lexicale et précision sur l’image masculine du texte source
lexical_decisions:
- source_word: וְהָיוּ
  choice: Ils seront
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction a une valeur future. Le « et » initial n’est pas exprimé, pour une formulation française naturelle.
- source_word: כְגִבֹּרִים
  choice: comme des hommes vaillants
  rationale: גִּבּוֹרִים désigne ici des hommes forts et courageux dans un contexte militaire. Cette formulation conserve l’image masculine du texte hébreu sans employer un archaïsme.
- source_word: בּוֹסִים
  choice: qui piétinent
  rationale: Le participe de בוס évoque l’action de fouler ou de piétiner. La relative relie naturellement ce participe à « des hommes vaillants » en français.
- source_word: בְּטִיט חוּצוֹת
  choice: la boue des rues
  rationale: L’expression désigne la boue ou la fange présente dans les rues. « La boue des rues » garde l’image concrète dans un français courant et digne.
- source_word: בַּמִּלְחָמָה
  choice: au combat
  rationale: Dans cette scène militaire précise, « au combat » rend mieux le cadre immédiat que le terme plus général « à la guerre ».
- source_word: וְנִלְחֲמוּ
  choice: Ils combattront
  rationale: Le niphal de לחם signifie ici prendre part au combat. Le futur convient au contexte prophétique.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de leur capacité à combattre. « Car » exprime clairement ce rapport causal dans un registre biblique moderne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française usuelle du nom divin représenté par le tétragramme, ici conservé comme nom propre plutôt que remplacé par un titre.
- source_word: עִמָּם
  choice: est avec eux
  rationale: Le présent de la copule, sous-entendue en hébreu, exprime naturellement en français la présence de Yahvé qui fonde leur victoire.
- source_word: וְהֹבִישׁוּ
  choice: ils couvriront de honte
  rationale: Le hiphil exprime ici le fait de causer honte et humiliation. « Couvrir de honte » en restitue la valeur causative de manière idiomatique.
- source_word: רֹכְבֵי סוּסִים
  choice: les cavaliers
  rationale: Ce terme français désigne de façon concise les combattants montés à cheval et convient au contraste militaire du verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte directement le tétragramme. La traduction retient donc le nom propre dans sa forme française courante, sans lui substituer un titre.
- issue: Image masculine de גִּבֹּרִים
  choice: des hommes vaillants
  alternative: des guerriers
  rationale: Le nom hébreu est masculin pluriel et présente ces combattants comme des hommes forts et courageux. La traduction préserve cette donnée explicite, tandis que la note signale l’équivalent contextuel plus compact.
- issue: Objet de l’action de piétiner
  choice: qui piétinent la boue des rues
  alternative: qui piétinent leurs ennemis dans la boue des rues
  rationale: L’hébreu nomme la boue des rues mais n’exprime pas explicitement « leurs ennemis » comme objet. La traduction évite d’ajouter cet objet, tout en conservant la tension de l’image militaire.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme en deux phrases évite une période trop lourde. « Boue » est préféré à « fange », plus littéraire, et « cavaliers » à une périphrase comme « ceux qui montent des chevaux ».
