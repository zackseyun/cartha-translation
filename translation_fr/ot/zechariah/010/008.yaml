  text: אֶשְׁרְקָ֥ה לָ/הֶ֛ם וַ/אֲקַבְּצֵ֖/ם כִּ֣י פְדִיתִ֑י/ם וְ/רָב֖וּ כְּמ֥וֹ רָבֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/008.yaml
  text: I will whistle for them and gather them[a], for I have redeemed them[b], and they will be as many as they were before.
translation:
  language: fr
  text: Je les appellerai d’un sifflement et je les rassemblerai, car je les ai rachetés ; ils seront aussi nombreux qu’autrefois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « ils se multiplieront comme ils se sont multipliés ». L’hébreu répète le verbe traduit par « devenir nombreux » ou « se multiplier »; dans le contexte, la comparaison peut évoquer le retour à leur nombre d’autrefois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁרְקָה לָהֶם
  choice: Je les appellerai d’un sifflement
  rationale: שׁרק désigne ici un sifflement servant de signal ou d’appel. Cette formulation naturelle en français conserve l’image concrète sans les connotations négatives que pourrait avoir « siffler quelqu’un ».
- source_word: וַאֲקַבְּצֵם
  choice: et je les rassemblerai
  rationale: קבץ exprime le rassemblement de personnes dispersées, avec ici une portée de restauration que « rassembler » préserve sobrement.
- source_word: כִּי
  choice: car
  rationale: 'La conjonction introduit le motif du rassemblement : le rachat accompli par Dieu.'
- source_word: פְדִיתִים
  choice: je les ai rachetés
  rationale: פדה signifie délivrer moyennant rachat ou arracher à la servitude et à la détresse. « Racheter » conserve sa résonance biblique sans préciser un mécanisme absent du verset.
- source_word: וְרָבוּ כְּמוֹ רָבוּ
  choice: ils se multiplieront comme ils se sont multipliés autrefois
  rationale: Cette traduction suit de près la répétition du verbe רבה et préserve l’ambiguïté entre une multiplication renouvelée et le retour à une abondance passée.
theological_decisions:
- issue: Portée du rassemblement et du rachat
  choice: Conserver le langage de rassemblement, de rachat et d’accroissement sans définir davantage son accomplissement.
  alternative: Préciser qu’il s’agit exclusivement d’un rétablissement national futur ou, à l’inverse, d’un rassemblement purement spirituel.
  rationale: Le texte affirme ces actes divins, mais ne fixe pas dans ce verset seul un cadre doctrinal plus étroit.
- issue: Valeur du dernier membre de phrase
  choice: 'Rendre la répétition verbale : « ils se multiplieront comme ils se sont multipliés autrefois ».'
  alternative: « ils seront aussi nombreux qu’autrefois »
  rationale: L’alternative exprime clairement une restauration numérique, mais la formulation retenue respecte davantage la répétition hébraïque et laisse subsister la nuance dynamique de multiplication.
translation_notes:
  register: Français international moderne, naturel et digne. « Appellerai d’un sifflement » rend intelligible le signal sans effacer l’image hébraïque. Le point-virgule distingue la conséquence annoncée tout en maintenant l’unité du verset.
