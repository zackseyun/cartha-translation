base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/007.yaml
  text: Ephraim will be like a mighty warrior[a], and their heart will rejoice as with wine; their children will see and rejoice[b]; their heart will exult in Yahweh.
translation:
  language: fr
  text: Éphraïm sera comme un vaillant guerrier, et leur cœur se réjouira comme sous l’effet du vin. Leurs enfants verront et se réjouiront ; leur cœur exultera en Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ כְגִבּוֹר אֶפְרַיִם
  choice: Éphraïm sera comme un vaillant guerrier
  rationale: Le nom collectif Éphraïm gouverne une forme verbale plurielle en hébreu. Le singulier collectif est naturel en français, et « vaillant guerrier » conserve la force et la dimension martiale de גִּבּוֹר.
- source_word: וְשָׂמַח לִבָּם
  choice: leur cœur se réjouira
  rationale: La tournure conserve le singulier collectif hébreu « leur cœur » tout en restant intelligible en français.
- source_word: כְּמוֹ יָיִן
  choice: comme sous l’effet du vin
  rationale: L’expression vise vraisemblablement la joie produite par le vin plutôt qu’une identité avec le vin ; cette formulation explicite seulement le rapport implicite de la comparaison.
- source_word: וּבְנֵיהֶם
  choice: leurs enfants
  rationale: בנים peut désigner les fils ou, collectivement, les enfants et descendants ; « enfants » convient au contexte familial sans imposer une restriction masculine.
- source_word: יִרְאוּ וְשָׂמֵחוּ
  choice: le verront et se réjouiront
  rationale: Le complément de « voir » est implicite en hébreu. Le pronom « le » renvoie naturellement au rétablissement joyeux décrit et évite une tournure française abrupte.
- source_word: יָגֵל לִבָּם
  choice: leur cœur exultera
  rationale: גיל exprime une joie vive et débordante ; « exultera » la distingue de שמח rendu par « se réjouira ».
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב marque ici la sphère ou le fondement de la joie, rendue naturellement par « en » ; le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère personnel du nom d’alliance sans remplacer celui-ci par un titre.
- issue: Référent collectif d’Éphraïm
  choice: conserver « Éphraïm » comme singulier collectif
  alternative: les Éphraïmites seront
  rationale: Le nom propre est maintenu comme dans le texte, sans expliciter davantage si la référence vise la tribu, le royaume du Nord ou le peuple restauré.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et les singuliers collectifs sont conservés lorsque le français les tolère ; la ponctuation répartit les trois mouvements de la promesse avec clarté.
