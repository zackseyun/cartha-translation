  text: כִּ֧י הַ/תְּרָפִ֣ים דִּבְּרוּ אָ֗וֶן וְ/הַ/קּֽוֹסְמִים֙ חָ֣זוּ שֶׁ֔קֶר וַֽ/חֲלֹמוֹת֙ הַ/שָּׁ֣וא יְדַבֵּ֔רוּ הֶ֖בֶל יְנַֽחֵמ֑וּ/ן עַל כֵּן֙ נָסְע֣וּ כְמוֹ צֹ֔אן יַעֲנ֖וּ כִּֽי אֵ֥ין רֹעֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/002.yaml
  text: For the household idols speak wickedness[a], and the diviners see lies; they speak empty dreams and give vain comfort. Therefore they wander like sheep[b]; they are afflicted because there is no shepherd.
translation:
  language: fr
  text: Car les idoles domestiques[a] disent des paroles trompeuses, les devins voient des visions mensongères ; ils racontent des rêves vains et prodiguent de vaines consolations. C’est pourquoi le peuple erre comme un troupeau ; il souffre, faute de berger.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les téraphim », terme hébreu désignant des objets cultuels ou des idoles liés à la maisonnée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils sont affligés, car il n’y a pas de berger » ; le verbe peut aussi se traduire par « sont opprimés » ou « souffrent ».'
    reason: lexical_and_formal_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: les idoles domestiques
  rationale: Le terme désigne des objets cultuels ou des divinités liés à la maisonnée. « Idoles domestiques » en communique le référent probable sans imposer au lecteur le terme technique « téraphim ».
- source_word: דִּבְּרוּ אָוֶן
  choice: disent des paroles trompeuses
  rationale: Dans le parallélisme avec les visions mensongères et les rêves illusoires, אָוֶן désigne ici une parole fausse, néfaste et moralement condamnable. Cette formulation française conserve ces dimensions sans la réduire à la seule « méchanceté ».
- source_word: הַקּוֹסְמִים
  choice: les devins
  rationale: Terme français courant et précis pour les praticiens de la divination.
- source_word: חָזוּ שֶׁקֶר
  choice: ont des visions mensongères
  rationale: La formulation conserve le registre visionnaire du verbe חזה et exprime naturellement en français le caractère faux de ce qui est vu.
- source_word: חֲלֹמוֹת הַשָּׁוְא יְדַבֵּרוּ
  choice: l’on raconte des rêves illusoires
  rationale: Le texte massorétique passe grammaticalement à un sujet indéfini, littéralement « les rêves de vanité, ils racontent ». « L’on » préserve cette indétermination, tandis que « illusoires » rend la vacuité et la fausseté de שָׁוְא.
- source_word: הֶבֶל יְנַחֵמוּן
  choice: ils consolent en vain
  rationale: Cette expression naturelle conserve le lien verbal avec « consoler » et rend הֶבֶל comme une consolation inefficace, vide de substance.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Marque clairement le rapport de conséquence avec les fausses sources de direction qui précèdent.
- source_word: נָסְעוּ כְמוֹ צֹאן
  choice: le peuple erre comme un troupeau
  rationale: Le verbe peut signifier partir, lever le camp ou se déplacer. Dans l’image pastorale d’un groupe sans berger, « erre » exprime naturellement l’absence de direction. Le singulier collectif « le peuple » explicite le référent humain implicite sans attribuer l’action aux rêves ou aux devins.
- source_word: יַעֲנוּ
  choice: il souffre
  rationale: Le verbe peut exprimer l’affliction, l’oppression ou l’humiliation. « Souffre » garde une portée suffisamment large et convient au français actuel.
- source_word: כִּי אֵין רֹעֶה
  choice: faute de berger
  rationale: Formulation concise et idiomatique qui conserve le lien causal et l’image pastorale; la note donne la construction plus formelle.
theological_decisions:
- issue: Nature des objets et pratiques condamnés
  choice: Le verset condamne des idoles domestiques, la divination et les rêves trompeurs comme sources de direction mensongères.
  alternative: Lire les téraphim comme de simples objets ancestraux neutres, ou réduire tout le verset à une critique politique.
  rationale: Le parallélisme immédiat porte sur de fausses révélations et leurs conséquences. La traduction conserve les réalités cultuelles concrètes sans introduire de catégories doctrinales ultérieures.
- issue: Référent du groupe comparé au troupeau
  choice: Rendre le sujet humain implicite par « le peuple ».
  alternative: Employer seulement « ils », au risque qu’en français le pronom renvoie grammaticalement aux devins ou aux rêves.
  rationale: Le passage des faux guides au troupeau égaré implique la communauté qui les consulte. L’explicitation clarifie la syntaxe française tout en maintenant l’image collective et la critique du défaut de direction.
- issue: Portée de l’image du berger
  choice: Conserver « berger » sans préciser s’il représente un chef politique, religieux ou divin.
  alternative: Traduire explicitement par « dirigeant » ou identifier le berger à une figure particulière.
  rationale: Le texte laisse à l’image pastorale une portée ouverte liée à la direction du peuple; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est maintenu par une succession de propositions brèves. « L’on raconte » respecte le changement de sujet grammatical du texte hébreu, tandis que « le peuple » évite une ambiguïté référentielle artificielle en français. Les deux appels de note [a] et [b] figurent dans le texte.
