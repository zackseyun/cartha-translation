  text: שַׁאֲל֨וּ מֵ/יְהוָ֤ה מָטָר֙ בְּ/עֵ֣ת מַלְק֔וֹשׁ יְהוָ֖ה עֹשֶׂ֣ה חֲזִיזִ֑ים וּ/מְטַר גֶּ֨שֶׁם֙ יִתֵּ֣ן לָ/הֶ֔ם לְ/אִ֖ישׁ עֵ֥שֶׂב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/001.yaml
  text: Ask Yahweh for rain in the time of the latter rain[a]; Yahweh makes storm clouds, and he will give them showers of rain[b], to each man vegetation in the field.
translation:
  language: fr
  text: Demandez à Yahweh de la pluie au temps de la pluie tardive[a]. Yahweh forme les nuages d’orage[b] ; il leur donnera des averses de pluie, et à chaque homme de la verdure dans les champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la saison de la pluie tardive » ou « de la pluie de l’arrière-saison ».
    reason: lexical_alternative
  - marker: b
    text: Ou « produit les éclairs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ מֵיְהוָה מָטָר
  choice: Demandez à Yahweh la pluie
  rationale: L’impératif pluriel s’adresse au peuple. En français, « demander à quelqu’un quelque chose » exprime naturellement la source marquée par מִן.
- source_word: בְּעֵת מַלְקוֹשׁ
  choice: au temps des pluies tardives
  rationale: מַלְקוֹשׁ désigne les pluies de fin de saison agricole, qui tombent au printemps dans le contexte géographique du texte. « Pluies tardives » reste proche du terme hébreu sans imposer au texte le calendrier du lecteur.
- source_word: עֹשֶׂה חֲזִיזִים
  choice: forme les nuages d’orage
  rationale: Dans ce contexte de pluie, חֲזִיזִים peut désigner des phénomènes orageux, notamment les nuages d’orage. L’autre sens possible, « éclairs », est conservé en note.
- source_word: וּמְטַר גֶּשֶׁם
  choice: des averses de pluie
  rationale: La combinaison des deux termes de pluie est rendue par une expression française concrète qui préserve l’idée de pluies abondantes sans préciser indûment qu’il s’agit d’un déluge.
- source_word: יִתֵּן לָהֶם
  choice: il leur donnera
  rationale: L’imparfait hébreu est compris ici comme l’annonce de ce que Yahweh accordera en réponse à la demande.
- source_word: לְאִישׁ
  choice: à chaque homme
  rationale: אִישׁ est un singulier masculin employé distributivement. « Chaque homme » en conserve à la fois la forme masculine et la portée distributive.
- source_word: עֵשֶׂב בַּשָּׂדֶה
  choice: de la verdure dans les champs
  rationale: עֵשֶׂב couvre l’herbe et les plantes vertes. Le pluriel français « les champs » exprime naturellement le cadre agricole collectif sans ajouter un possesseur absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie deux fois le nom divin. « Yahweh » le représente comme un nom propre plutôt que de le remplacer par un titre.
- issue: Portée de לְאִישׁ
  choice: à chaque homme
  alternative: à chacun
  rationale: Le masculin singulier אִישׁ a ici une valeur distributive. La traduction retenue préserve cette forme tout en explicitant sa portée.
- issue: Lien entre la pluie et la végétation
  choice: il leur donnera des averses de pluie, et à chaque homme de la verdure dans les champs
  alternative: il donnera à chacun une averse qui fera pousser la verdure dans les champs
  rationale: La syntaxe hébraïque juxtapose le don de la pluie au groupe et celui de la verdure à chaque homme. La traduction ne transforme pas explicitement cette relation en proposition causale, bien que le contexte agricole la suggère.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure poétique hébraïque tout en employant un vocabulaire courant. Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
