base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: fr
  text: Une personne de naissance illégitime[a] ne pourra entrer dans l’assemblée de Yahweh ; même jusqu’à la dixième génération, aucun de ses descendants ne pourra entrer dans l’assemblée de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens exact du mot hébreu מַמְזֵר (mamzēr) est incertain. On le traduit aussi, plus traditionnellement, par « enfant illégitime » ou « bâtard ». Il désigne vraisemblablement une personne dont le statut de naissance entraînait une exclusion ; il pourrait notamment concerner une naissance issue d’une union interdite.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: une personne née d’une union interdite
  rationale: Le terme désigne une personne dont la naissance relève d’un statut exclu, probablement en raison d’une union interdite. Cette formulation évite le caractère injurieux de « bâtard » et l’imprécision moderne de « naissance illégitime », tout en signalant la difficulté lexicale dans une note.
- source_word: יָבֹא
  choice: ne pourra pas entrer
  rationale: Le verbe signifie littéralement « venir, entrer ». Dans cette disposition juridique, le futur négatif français exprime naturellement l’interdiction d’être admis ou de prendre part à l’assemblée.
- source_word: קְהַל יְהוָה
  choice: l’assemblée de Yahweh
  rationale: « Assemblée » rend קהל dans son sens de communauté convoquée ou constituée, tandis que le nom divin est translittéré « Yahweh ».
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: même à la dixième génération
  rationale: Cette formulation française conserve la portée emphatique et générationnelle de l’expression hébraïque.
- source_word: לֹא יָבֹא לוֹ
  choice: aucun de ses descendants ne pourra entrer
  rationale: Dans le contexte explicite de la dixième génération, le pronom לוֹ renvoie à ceux qui appartiennent à sa lignée. « Aucun de ses descendants » explicite naturellement cet idiome sans modifier la portée de l’interdiction.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Nature de l’accès à « l’assemblée de Yahweh »
  choice: Conserver la formule sans préciser s’il s’agit du culte, de la citoyenneté ou d’une fonction publique
  alternative: Expliciter l’assemblée comme communauté cultuelle ou politique
  rationale: Le verset ne définit pas ici la portée exacte de l’expression. La traduction préserve donc cette ambiguïté historique et théologique.
translation_notes:
  register: Français international moderne, sobre et juridique. « Personne » évite une désignation déshumanisante ; « ne pourra pas entrer » reste clair pour le lecteur courant. Le parallélisme et la répétition de « l’assemblée de Yahweh » sont conservés pour refléter la structure solennelle de l’hébreu.
