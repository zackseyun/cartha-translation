  text: וְ/יָד֙ תִּהְיֶ֣ה לְ/ךָ֔ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/יָצָ֥אתָ שָׁ֖מָּ/ה חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: fr
  text: Tu auras un endroit à l’extérieur du camp[a], et tu iras là-bas, à l’extérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une main ». Le mot hébreu désigne probablement ici, par emploi idiomatique, un endroit ou un emplacement assigné. Certains comprennent plutôt un outil ou un piquet, en lien avec le verset suivant.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: endroit
  rationale: Le sens courant est « main », mais ici le mot désigne vraisemblablement, par emploi idiomatique, un emplacement assigné. « Endroit » convient au mouvement vers ce lieu exprimé dans la suite.
- source_word: תִּהְיֶה לְךָ
  choice: tu auras
  rationale: La construction existentielle היה avec לְ exprime ici la possession ou la mise à disposition; « tu auras » restitue naturellement sa valeur directive.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: à l’extérieur du camp
  rationale: Cette formulation indique directement un emplacement situé hors du périmètre du camp.
- source_word: וְיָצָאתָ
  choice: et tu sortiras
  rationale: Le qal de יצא signifie couramment « sortir ». Le futur français garde ici la force prescriptive du contexte légal.
- source_word: שָׁמָּה
  choice: là
  rationale: L’adverbe directionnel renvoie à l’endroit qui vient d’être désigné.
- source_word: חוּץ
  choice: dehors
  rationale: Le dernier mot réaffirme que l’action doit avoir lieu hors du camp. « Dehors » conserve cette insistance sans répéter exactement « à l’extérieur ».
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La légère répétition spatiale (« à l’extérieur… dehors ») est maintenue afin de préserver l’insistance de l’hébreu.
