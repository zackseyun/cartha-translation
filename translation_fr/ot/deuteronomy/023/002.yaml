  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: fr
  text: Aucun homme aux testicules écrasés ou au pénis sectionné ne pourra entrer dans l’assemblée de Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Aucun homme aux testicules écrasés ou à l’organe masculin coupé n’entrera dans l’assemblée de Yahweh. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression « assemblée de Yahweh » peut désigner la participation officielle à la communauté d’Israël liée à l’alliance ; la portée précise de cette exclusion fait débat.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: ne pourra entrer
  rationale: Le verbe בוא signifie « venir, entrer ». Avec לֹא dans ce contexte juridique, « ne pourra entrer » exprime naturellement l’interdiction sans préciser davantage la nature de l’accès.
- source_word: פְצוּעַ דַּכָּא
  choice: dont les testicules ont été écrasés
  rationale: La locution désigne une lésion par écrasement des organes sexuels masculins, vraisemblablement des testicules. Cette formulation anatomiquement explicite évite les anciens euphémismes opaques.
- source_word: וּכְרוּת שָׁפְכָה
  choice: ou dont le pénis a été sectionné
  rationale: La locution désigne l’organe masculin coupé. « Pénis » est précis et actuel, tandis que « sectionné » rend כרת sans imposer que l’ablation ait nécessairement été totale.
- source_word: בִּקְהַל
  choice: dans l’assemblée
  rationale: קהל désigne une communauté réunie ou constituée. « Assemblée » convient au contexte juridique et communautaire sans introduire une terminologie ecclésiale ultérieure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre de substitution.
- source_word: לֹא
  choice: Aucun… ne pourra
  rationale: Cette tournure française exprime clairement la prohibition juridique et maintient la négation en tête de l’énoncé.
- source_word: référent masculin implicite des expressions participiales
  choice: homme
  rationale: Les lésions décrites sont spécifiquement celles des organes sexuels masculins ; « homme » explicite donc fidèlement le référent.
theological_decisions:
- issue: Nature de l’exclusion de « l’assemblée de Yahweh »
  choice: Conserver l’expression sans définir la portée exacte de l’exclusion.
  alternative: Préciser qu’il s’agit de la participation cultuelle, de l’appartenance civique ou matrimoniale, ou d’une exclusion plus générale de la communauté de l’alliance.
  rationale: Le texte hébreu interdit l’entrée dans « l’assemblée de Yahweh », mais ce verset ne détermine pas à lui seul toutes les implications juridiques, cultuelles ou théologiques de cette formule.
translation_notes:
  register: Français international moderne, direct et digne. Le vocabulaire anatomique est explicite afin de rendre clairement l’hébreu, sans euphémisme archaïque. La formulation juridique reste accessible et ne tranche pas la portée institutionnelle ou théologique de « l’assemblée de Yahweh ».
