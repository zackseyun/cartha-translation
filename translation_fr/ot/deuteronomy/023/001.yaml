  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: fr
  text: Un homme ne prendra pas la femme de son père[a] et ne découvrira pas le pan du vêtement de son père[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’épousera pas la femme de son père ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne découvrira pas le pan de son père »; le terme peut désigner l’extrémité d’un vêtement. L’expression est un euphémisme sexuel et peut évoquer une atteinte à l’union conjugale ou aux droits conjugaux du père.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: prendra
  rationale: Avec « femme », le verbe לָקַח peut signifier prendre une femme, notamment en mariage. « Prendra » conserve la formulation hébraïque et son degré d’ambiguïté; le sens plus explicite « épousera » est signalé en note.
- source_word: אִישׁ
  choice: Un homme
  rationale: Le nom masculin singulier désigne ici l’homme auquel s’adresse cette interdiction sexuelle. Cette formulation suit de près la structure hébraïque tout en restant claire en français.
- source_word: אֵשֶׁת אָבִיו
  choice: la femme de son père
  rationale: La construction signifie littéralement « la femme de son père ». Elle évite « belle-mère », qui serait plus étroit et pourrait suggérer à tort un lien familial déterminé.
- source_word: יְגַלֶּה
  choice: soulèvera
  rationale: Le sens de base est « découvrir, mettre à nu ». Devant « le pan du vêtement », « soulever » rend naturellement en français le geste figuré évoqué par l’expression, sans expliciter entièrement son sens sexuel.
- source_word: כְּנַף
  choice: le pan du vêtement
  rationale: כָּנָף désigne une aile, une extrémité ou le pan d’un vêtement. « Le pan du vêtement » conserve l’image concrète sans employer « jupe », potentiellement trompeur en français moderne, ni remplacer la métaphore par « nudité ».
theological_decisions:
- issue: Faut-il expliciter dans le texte l’euphémisme sexuel de la seconde proposition?
  choice: Conserver l’image du pan du vêtement dans le texte principal.
  alternative: « porter atteinte à l’union conjugale de son père » ou « découvrir la nudité de son père »
  rationale: L’hébreu emploie ici כְּנַף, « pan, extrémité », et non le terme habituel pour « nudité ». Garder cette image respecte la formulation particulière du texte et ne tranche pas abusivement entre ses nuances sexuelle, conjugale et juridique; la note en explique la portée.
translation_notes:
  register: Français international moderne, sobre et juridique. La tournure « Un homme ne… pas » conserve la forme singulière de l’interdiction. « Soulever le pan du vêtement » rend l’image de façon intelligible tout en maintenant son caractère euphémique.
