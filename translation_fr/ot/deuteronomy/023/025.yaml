  text: כִּ֤י תָבֹא֙ בְּ/כֶ֣רֶם רֵעֶ֔/ךָ וְ/אָכַלְתָּ֧ עֲנָבִ֛ים כְּ/נַפְשְׁ/ךָ֖ שָׂבְעֶ֑/ךָ וְ/אֶֽל כֶּלְיְ/ךָ֖ לֹ֥א תִתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: fr
  text: Quand tu entreras dans la vigne de ton prochain[a], tu pourras manger des raisins autant que tu le désires, jusqu’à être rassasié[b], mais tu n’en mettras pas dans ton récipient[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Si tu entres dans la vigne de ton prochain ». La particule hébraïque peut introduire une proposition temporelle ou conditionnelle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « selon ton âme, à ton rassasiement ». Cette expression signifie que l’on peut manger selon son désir ou son appétit, jusqu’à être rassasié.
    reason: lexical_alternative
  - marker: c
    text: Ou « contenant » ou « vase ». Le terme hébreu est général et ne précise pas le type de récipient.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: La particule introduit ici une situation envisagée par la loi. « Quand » convient au style juridique casuistique, tout en laissant en note l’autre valeur possible, « si ».
- source_word: תָבֹא בְּכֶרֶם
  choice: tu entreras dans la vigne
  rationale: Le verbe בוא avec la préposition ב exprime l’entrée dans un lieu. Le futur français est naturel après « quand » dans cette formulation légale.
- source_word: רֵעֶךָ
  choice: de ton prochain
  rationale: רֵעַ désigne ici autrui dans la communauté. « Ton prochain » est digne, courant dans le registre biblique français et n’implique pas nécessairement une proximité résidentielle.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: tu pourras manger des raisins
  rationale: Dans ce contexte légal, la forme exprime une permission plutôt qu’un ordre; « tu pourras » rend clairement cette faculté.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: selon ton appétit, jusqu’à satiété
  rationale: נֶפֶשׁ renvoie ici au désir ou à l’appétit, non à « l’âme » au sens théologique; שֹׂבַע indique le rassasiement. La formulation conserve les deux éléments de l’expression hébraïque.
- source_word: כֶּלְיְךָ
  choice: ton récipient
  rationale: כְּלִי est un terme général pour un objet servant à contenir ou transporter quelque chose. « Récipient » évite de préciser sans fondement un panier ou un sac.
- source_word: לֹא תִתֵּן
  choice: tu n’en mettras pas
  rationale: נתן peut signifier « mettre » dans une construction locative. Le pronom « en » reprend naturellement les raisins sous-entendus.
