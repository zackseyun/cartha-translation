    issue: Ajout interprétatif dans « pour l’accomplissement d’un vœu quelconque ».
    rationale: לְכָל נֶדֶר indique la relation avec tout vœu, mais ne dit pas explicitement qu’il s’agit de son accomplissement. Une formulation plus sobre préserve la portée du texte source.
  - severity: low
    issue: La note traduit l’alternative par « le paiement d’un prostitué ».
    rationale: L’alternative signalée par l’audit anglais concerne plus précisément « le prix d’un prostitué » (ou d’un homme prostitué), en compréhension figurée de « chien ». « Paiement » peut déplacer légèrement la relation exprimée par מְחִיר.
  revised_text: Tu n’apporteras pas dans la maison de Yahweh ton Dieu le salaire d’une prostituée ni le prix d’un chien[a], pour quelque vœu que ce soit, car l’un et l’autre sont une abomination pour Yahweh ton Dieu.
