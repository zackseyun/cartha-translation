  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: fr
  text: Tu n’apporteras pas dans la maison de Yahweh ton Dieu le salaire d’une prostituée ni le prix d’un chien[a], pour quelque vœu que ce soit, car l’un et l’autre sont une abomination pour Yahweh ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « le prix d’un prostitué », si « chien » est ici un terme méprisant désignant un prostitué, éventuellement lié à un culte.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: tu n’apporteras pas
  rationale: Le hiphil de בוא exprime ici le fait de faire entrer ou d’apporter quelque chose dans un lieu. « Apporter » rend naturellement la force concrète de l’interdiction.
- source_word: אֶתְנַן זוֹנָה
  choice: le salaire d’une prostituée
  rationale: אֶתְנַן désigne la rémunération reçue, et זוֹנָה une prostituée. « Salaire » est clair en français moderne et conserve l’idée de paiement.
- source_word: מְחִיר כֶּלֶב
  choice: le prix d’un chien
  rationale: מְחִיר signifie normalement « prix » et כֶּלֶב signifie littéralement « chien ». Le sens éventuellement figuré étant discuté, la formulation lexicale est maintenue dans le texte et l’autre interprétation signalée en note.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: la maison de Yahweh ton Dieu
  rationale: בֵּית signifie littéralement « maison ». Ce choix évite le terme plus spécifique « temple » et rend le nom divin יְהוָה par « Yahweh ».
- source_word: לְכָל נֶדֶר
  choice: pour l’accomplissement d’un vœu quelconque
  rationale: La préposition לְ indique ici la destination ou le motif du versement. L’ajout explicatif « accomplissement » rend en français le lien naturel entre le paiement et le vœu sans en préciser indûment la forme.
- source_word: תוֹעֲבַת
  choice: une abomination
  rationale: Le terme désigne quelque chose de profondément odieux ou réprouvé devant Dieu. « Abomination » en conserve la forte valeur dans ce contexte juridique et cultuel.
- source_word: גַּם שְׁנֵיהֶם
  choice: l’un et l’autre
  rationale: Cette tournure française indique clairement que les deux éléments mentionnés sont également visés, tout en restant naturelle et concise.
theological_decisions:
- issue: Sens de כֶּלֶב dans l’expression מְחִיר כֶּלֶב
  choice: Traduire littéralement par « chien » dans le texte principal.
  alternative: Comprendre « chien » comme un terme méprisant désignant un prostitué, éventuellement lié à un culte.
  rationale: Le sens lexical certain est « chien », tandis que l’interprétation figurée demeure débattue. La traduction principale préserve donc l’ambiguïté du texte et la note informe le lecteur de l’autre possibilité.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » représente ici le nom divin plutôt qu’un titre de substitution.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reproduit l’adresse hébraïque à Israël. La formulation conserve « maison » et « chien » afin de ne pas résoudre silencieusement les questions historiques ou interprétatives du texte.
