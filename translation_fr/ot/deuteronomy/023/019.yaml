  verdict: revise
  source_fidelity: 'Le texte principal rend fidèlement les termes essentiels : « maison », « Yahweh », « salaire d’une prostituée », « prix d’un chien » et l’emphase inclusive « l’un et l’autre ». Toutefois, « pour l’accomplissement d’un vœu quelconque » explicite l’idée d’accomplissement, qui n’est pas exprimée par לְכָל־נֶדֶר (« pour tout vœu / à l’occasion de tout vœu »).'
  naturalness: Le français est globalement naturel, direct et d’un registre approprié. « Pour quelque vœu que ce soit » est plus idiomatique et plus proche du degré de précision de l’hébreu que « pour l’accomplissement d’un vœu quelconque ».
  terminology: « Yahweh » correspond à la décision éditoriale pour יהוה. « Abomination » restitue adéquatement la force de תוֹעֵבָה. La note doit conserver le caractère disputé de « chien » sans transformer de façon trop affirmée « prix » en « paiement ».
  issues:
