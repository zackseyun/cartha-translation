  text: לֹא תַסְגִּ֥יר עֶ֖בֶד אֶל אֲדֹנָ֑י/ו אֲשֶׁר יִנָּצֵ֥ל אֵלֶ֖י/ךָ מֵ/עִ֥ם אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: fr
  text: Tu ne livreras pas à son maître un esclave[a] qui s’est échappé de chez son maître pour venir auprès de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le terme hébreu peut désigner un serviteur ou un esclave ; ici, « esclave » est retenu parce que la soumission de cette personne à un maître est au cœur de la loi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: livreras
  rationale: Le hifil de סגר signifie ici remettre une personne au pouvoir d’une autre. « Livrer » conserve la portée juridique de l’interdiction et reste naturel en français.
- source_word: עֶבֶד
  choice: esclave
  rationale: Dans cette loi, la dépendance de la personne envers un maître et sa fuite sont au premier plan. « Esclave » exprime plus clairement cette condition que « serviteur », tout en signalant l’autre possibilité en note.
- source_word: אֶל אֲדֹנָיו
  choice: à son maître
  rationale: Dans ce contexte social et juridique, אָדוֹן désigne le maître de l’esclave, et non un titre divin.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: qui se sera échappé
  rationale: Le nifal de נצל peut évoquer le fait d’être délivré ou d’échapper à quelqu’un. Ici, la fuite hors de l’autorité du maître favorise « se sera échappé », sans préciser comment elle a eu lieu.
- source_word: אֵלֶיךָ
  choice: pour venir auprès de toi
  rationale: אֶל marque un mouvement en direction du destinataire. Cette formulation rend ce mouvement de façon idiomatique en français.
- source_word: מֵעִם אֲדֹנָיו
  choice: de chez son maître
  rationale: מֵעִם exprime l’éloignement à partir de la présence ou de l’entourage du maître. « De chez son maître » rend cette nuance relationnelle et spatiale naturellement.
theological_decisions:
- issue: Statut social exprimé par עֶבֶד
  choice: esclave
  alternative: serviteur
  rationale: Le texte concerne une personne soumise à un maître qui s’est enfuie et ne doit pas lui être remise. Le rapport de dépendance étant essentiel à la loi, « esclave » est retenu, sans effacer l’étendue sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le futur à valeur impérative convient au style législatif. La proposition relative et la répétition de « son maître » préservent la structure et l’insistance du texte hébreu.
