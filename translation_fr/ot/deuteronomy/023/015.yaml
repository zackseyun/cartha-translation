  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: fr
  text: Car Yahvé, ton Dieu, marche au milieu de ton camp pour te délivrer et livrer tes ennemis en ton pouvoir. Ton camp doit donc être saint, afin qu’il ne voie chez toi rien d’indécent[a] et ne se détourne de toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la nudité d’une chose » ; l’expression hébraïque peut désigner toute chose honteuse, inconvenante ou impure.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne revienne de derrière toi », image de Yahvé qui cesse d’accompagner le camp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui préserve son caractère de nom propre plutôt que de le remplacer par un titre.
- source_word: מִתְהַלֵּךְ
  choice: marche
  rationale: Conserve l’image concrète et anthropomorphique de la présence active de Dieu dans le camp.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: au milieu de ton camp
  rationale: Rend directement l’idée d’une présence au sein du camp d’Israël.
- source_word: לְהַצִּילְךָ
  choice: pour te délivrer
  rationale: Convient au contexte militaire et traduit le but de la présence divine sans ajouter de portée théologique étrangère au passage.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: livrer tes ennemis en ton pouvoir
  rationale: Exprime naturellement en français le sens de l’idiome hébreu, selon lequel les ennemis sont remis à la merci d’Israël.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: Ton camp doit donc être saint
  rationale: 'Le contexte donne à la proposition une force prescriptive et consécutive : la présence de Yahvé exige la sainteté du camp.'
- source_word: עֶרְוַת דָּבָר
  choice: rien d’indécent
  rationale: Rend la portée large de l’expression, qui désigne une chose honteuse ou inconvenante et ne se limite pas nécessairement à la nudité.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: ne se détourne de toi
  rationale: Formulation française naturelle qui préserve l’idée du retrait de Yahvé sans préciser abusivement la manière de ce retrait.
theological_decisions:
- issue: Description anthropomorphique de la présence de Yahvé
  choice: Conserver l’image de Yahvé qui « marche » dans le camp
  alternative: Paraphraser par « est présent dans ton camp »
  rationale: Le texte hébreu emploie délibérément une image concrète pour relier la proximité divine à l’exigence de sainteté, sans qu’il soit nécessaire d’en tirer une affirmation sur la corporéité divine.
- issue: Force de la proposition sur la sainteté du camp
  choice: « Ton camp doit donc être saint »
  alternative: « Ton camp sera saint »
  rationale: Dans ce contexte législatif, la proposition exprime une obligation découlant de la présence protectrice de Yahvé, et non une simple prédiction.
- issue: Conséquence de l’impureté dans le camp
  choice: « ne se détourne de toi »
  alternative: « ne cesse de marcher derrière toi »
  rationale: La traduction conserve la menace réelle du retrait divin tout en laissant ouverte la portée exacte de l’image hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme collectivité. La syntaxe reste proche de l’original tout en employant des expressions naturelles en français.
