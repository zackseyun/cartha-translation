base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: fr
  text: Tu respecteras ce qui est sorti de tes lèvres et tu l’accompliras[a], conformément au vœu que tu as fait à Yahweh, ton Dieu, comme offrande volontaire[b], et que tu as déclaré de ta bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu observeras ce que tes lèvres ont prononcé et tu le mettras en pratique. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « offrande faite de plein gré ». Le terme hébreu désigne une offrande librement consentie, et non imposée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: ce qui est sorti de tes lèvres
  rationale: Cette formulation conserve l’image concrète de l’hébreu, où מוֹצָא désigne ce qui sort ou procède, tout en restant compréhensible en français.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: tu veilleras à tenir… et tu l’accompliras
  rationale: שׁמר exprime ici le soin d’observer un engagement, tandis que עשה en demande l’exécution effective. « Tenir » convient naturellement à une parole donnée, et « accomplir » au vœu.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: conformément au vœu que tu as fait
  rationale: La tournure indique que l’exécution doit correspondre au contenu précis du vœu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: à Yahweh ton Dieu
  rationale: Le nom divin יהוה est translittéré « Yahweh », ce qui maintient le nom propre présent dans le texte hébreu.
- source_word: נְדָבָה
  choice: comme offrande volontaire
  rationale: נְדָבָה désigne une offrande librement consentie. « Offrande volontaire » est clair, naturel et adapté au contexte cultuel.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: à ce que tu as déclaré de ta bouche
  rationale: La formulation préserve la répétition concrète de l’oralité dans le texte source, sans la réduire à une simple référence implicite au vœu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le Tétragramme; « Yahweh » préserve le caractère de nom propre et suit la décision éditoriale fournie.
- issue: Rapport syntaxique de נְדָבָה au vœu
  choice: comme offrande volontaire
  alternative: volontairement
  rationale: Le substantif désigne normalement une offrande volontaire. Le rattacher au vœu comme sa teneur cultuelle respecte la syntaxe et le contexte, tout en laissant la note signaler l’autre rendu lexical possible.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. L’image des lèvres et la mention de la bouche sont conservées malgré leur redondance, car celle-ci souligne le caractère explicite de l’engagement oral.
