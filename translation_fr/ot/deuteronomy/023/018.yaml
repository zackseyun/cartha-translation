source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: fr
  text: Il n’y aura, parmi les filles d’Israël, aucune prostituée cultuelle[a], ni, parmi les fils d’Israël, aucun prostitué cultuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prostituée de temple ». Les termes hébreux, au féminin et au masculin, signifient littéralement « femme consacrée » et « homme consacré ». Ils sont traditionnellement compris, dans ce contexte, comme désignant des personnes associées à une activité sexuelle liée à un culte païen ; la nature exacte de leur fonction est discutée.
    reason: Précise l’alternative lexicale, conserve le parallélisme des deux termes hébreux et ne présente pas comme certaine une reconstruction historique discutée.
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: prostituée sacrée
  rationale: Dans ce contexte légal, le nom féminin désigne vraisemblablement une femme vouée à une pratique sexuelle cultuelle illicite. « Prostituée sacrée » rend à la fois la dimension sexuelle et l’association religieuse, sans limiter nécessairement l’activité à l’enceinte d’un temple.
- source_word: קָדֵשׁ
  choice: prostitué sacré
  rationale: Le masculin parallèle est rendu de façon symétrique afin de conserver l’opposition voulue entre femme et homme. Le masculin explicite évite de neutraliser le texte hébreu.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: Il n’y aura pas… ni…
  rationale: Cette tournure française naturelle conserve la force prohibitive et la cadence juridique de la construction existentielle hébraïque.
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  choice: parmi les filles d’Israël / parmi les fils d’Israël
  rationale: « Parmi » exprime idiomatiquement en français l’exclusion d’un membre du groupe, tandis que « filles/fils d’Israël » préserve le parallélisme familial et national du texte.
theological_decisions:
- issue: Sens de קְדֵשָׁה / קָדֵשׁ dans cette interdiction
  choice: Des personnes, femme et homme, associées à une prostitution de caractère cultuel
  alternative: Des personnes consacrées exerçant une fonction cultuelle non précisée, ou simplement des personnes sexuellement immorales
  rationale: Le contexte et l’usage traditionnel de ces termes favorisent le sens cultuel et sexuel. Toutefois, puisque l’étymologie évoque la consécration et que la nature exacte de la fonction fait débat, une note signale le sens plus littéral au lieu de présenter l’interprétation comme dépourvue d’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme féminin-masculin de l’hébreu. « Sacrée » est employé au sens technique de « liée à un culte », non comme une approbation morale ou religieuse.
