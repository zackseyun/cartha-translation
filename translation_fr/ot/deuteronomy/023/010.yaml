  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: fr
  text: Quand tu partiras en campagne contre tes ennemis, garde-toi de toute chose mauvaise[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute chose impure » ou « de tout ce qui est inconvenant ». L’expression hébraïque est large et, dans ce contexte, peut inclure l’impureté rituelle sans s’y limiter.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: La conjonction introduit ici la situation dans laquelle l’instruction suivante s’applique. « Quand » convient au cadre légal et exhortatif sans donner à la phrase un caractère purement hypothétique.
- source_word: תֵצֵא מַחֲנֶה
  choice: tu partiras en campagne
  rationale: Littéralement, la tournure évoque la sortie du camp ou de la troupe. En contexte militaire, « partir en campagne » exprime naturellement en français le départ de la force armée sans alourdir la phrase.
- source_word: עַל אֹיְבֶיךָ
  choice: contre tes ennemis
  rationale: Dans ce contexte militaire, עַל a une valeur adversative, rendue clairement par « contre ».
- source_word: וְנִשְׁמַרְתָּ
  choice: garde-toi
  rationale: 'La forme verbale a ici une nuance réflexive et exhortative : le destinataire doit veiller sur sa propre conduite. « Garde-toi » conserve cette force directe.'
- source_word: מִכֹּל דָּבָר רָע
  choice: de tout ce qui est mal
  rationale: דָּבָר רָע est une expression large. Cette formulation française naturelle préserve sa portée générale sans la limiter d’emblée à l’impureté rituelle.
theological_decisions:
- issue: Portée de דָּבָר רָע dans les règles de sainteté du camp
  choice: de tout ce qui est mal
  alternative: de toute chose impure ; de tout ce qui est inconvenant
  rationale: Le contexte immédiat aborde notamment l’impureté rituelle, mais l’expression hébraïque est plus large. La traduction principale maintient cette amplitude et la note signale les nuances possibles sans imposer une interprétation exclusivement morale ou rituelle.
translation_notes:
  register: Français international moderne, direct et digne. Le singulier « tu » reproduit l’adresse individuelle à Israël caractéristique de cette instruction. « Partir en campagne » rend idiomatiquement le contexte militaire, tandis que « tout ce qui est mal » conserve l’ampleur et l’ambiguïté de l’hébreu.
