  verdict: revise
  source_fidelity: La condition contrastive (« Mais si »), l’idée de s’abstenir de prononcer un vœu et la négation de toute faute correspondent au texte hébreu. Toutefois, « tu ne commettras aucun péché » transforme la tournure existentielle « il n’y aura pas de péché en/à ton égard » en prédiction d’une action que la personne ne commettra pas. La formulation révisée conserve mieux le résultat juridique et moral exprimé par לֹא יִהְיֶה בְּךָ חֵטְא.
  naturalness: « Il n’y aura pas de péché à ta charge » est une formulation moderne, claire et digne. Elle rend naturellement en français l’expression hébraïque qui concerne une faute imputable, sans suggérer que l’abstention de faire un vœu garantit l’absence de tout autre péché futur.
  terminology: « Vœu » et « péché » conviennent au registre et au contexte. La note conserve prudemment la possibilité de rendre חֵטְא par « culpabilité », sans imposer une interprétation confessionnelle.
  issues:
  - severity: medium
    issue: La proposition « tu ne commettras aucun péché » ne rend pas exactement la construction hébraïque.
    rationale: לֹא יִהְיֶה בְּךָ חֵטְא signifie littéralement qu’aucun péché/faute ne sera en la personne ou ne lui sera imputable. Le texte ne prédit pas directement qu’elle ne commettra aucun péché.
  revised_text: Mais si tu t’abstiens de faire un vœu, il n’y aura pas de péché à ta charge[a].
