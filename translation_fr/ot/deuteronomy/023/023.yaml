  text: וְ/כִ֥י תֶחְדַּ֖ל לִ/נְדֹּ֑ר לֹֽא יִהְיֶ֥ה בְ/ךָ֖ חֵֽטְא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: fr
  text: Mais si tu t’abstiens de faire un vœu, il n’y aura pas de péché à ta charge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne seras pas coupable ». Le terme hébreu peut désigner le péché ou la culpabilité qui en résulte.'
    reason: 'Alternative lexicale : חֵטְא peut exprimer le péché ou la culpabilité, et la tournure « en toi » peut, dans ce contexte, indiquer une faute imputable à la personne.'
lexical_decisions:
- source_word: וְ/כִי
  choice: Mais si
  rationale: La combinaison introduit une condition qui contraste avec l’obligation d’accomplir un vœu déjà prononcé au verset précédent.
- source_word: תֶחְדַּל
  choice: tu t’abstiens
  rationale: Le verbe חדל exprime ici le fait de renoncer à entreprendre l’action, et non de cesser une pratique déjà en cours.
- source_word: לִ/נְדֹּר
  choice: de faire un vœu
  rationale: L’infinitif de נדר signifie « faire un vœu » ; cette formulation est naturelle en français et conserve le caractère concret de l’acte.
- source_word: לֹא יִהְיֶה בְ/ךָ
  choice: tu ne commettras aucun
  rationale: La tournure hébraïque signifie littéralement qu’il n’y aura pas de péché « en toi ». En français courant, la formulation choisie exprime naturellement l’absence de faute imputable à la personne, tout en maintenant la portée prospective.
- source_word: חֵטְא
  choice: péché
  rationale: חֵטְא peut désigner le péché ou la culpabilité qui en découle. « Péché » rend clairement le contraste moral et juridique du contexte ; la nuance de culpabilité est signalée en note.
theological_decisions:
- issue: Statut moral du fait de ne pas prononcer de vœu
  choice: S’abstenir de faire un vœu ne constitue pas un péché.
  alternative: Le verset pourrait être formulé en termes d’absence de culpabilité ou de faute imputée.
  rationale: Le contexte oppose le refus légitime de faire un vœu à la culpabilité encourue lorsqu’un vœu prononcé n’est pas accompli. La traduction ne présente donc pas le vœu comme une obligation, tout en conservant en note la nuance juridique possible de חֵטְא.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier correspond à l’adresse hébraïque au membre individuel du peuple. « Faire un vœu » est plus naturel que « vouer » dans ce contexte.
