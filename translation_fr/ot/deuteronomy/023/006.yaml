  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: fr
  text: Mais Yahweh, ton Dieu, n’a pas voulu écouter Balaam, et Yahweh, ton Dieu, a changé pour toi la malédiction en bénédiction, parce que Yahweh, ton Dieu, t’a aimé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: n’a pas voulu
  rationale: Le verbe exprime ici le refus ou l’absence de volonté, et non une incapacité. Cette formulation est directe et naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: La forme porte un suffixe masculin singulier. Le tutoiement correspond à l’adresse d’alliance faite collectivement à Israël sous la forme du singulier.
- source_word: לִשְׁמֹעַ אֶל
  choice: écouter
  rationale: La construction signifie écouter quelqu’un ou donner suite à sa parole. « Écouter » conserve cette latitude sans préciser excessivement la manière dont Balaam aurait été exaucé.
- source_word: בִּלְעָם
  choice: Balaam
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַיַּהֲפֹךְ
  choice: a changé
  rationale: Le verbe décrit une transformation ou un renversement. « Changer la malédiction en bénédiction » est idiomatique en français et exprime clairement le résultat.
- source_word: הַקְּלָלָה
  choice: la malédiction
  rationale: Le nom désigne la malédiction destinée à Israël.
- source_word: לִבְרָכָה
  choice: en bénédiction
  rationale: La préposition marque ici le résultat de la transformation; après « changer », le français emploie naturellement « en ».
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la raison de l’intervention divine.
- source_word: אֲהֵבְךָ
  choice: t’aimait
  rationale: L’imparfait s’accorde naturellement en français avec le cadre narratif passé et présente l’amour de Yahweh comme le motif de son action, sans en réduire la portée à un instant isolé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » préserve le nom personnel de Dieu plutôt que de le remplacer par un titre.
- issue: Valeur de l’amour divin exprimé par אֲהֵבְךָ
  choice: t’aimait
  alternative: t’a aimé
  rationale: L’hébreu exprime simplement l’amour de Yahweh comme cause de son intervention. L’imparfait est naturel dans le récit français et évite de suggérer que cet amour serait seulement ponctuel, sans ajouter de précision doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, simple et digne. Le singulier « ton/te » conserve l’adresse hébraïque à Israël envisagé collectivement. Les deux phrases rendent la coordination hébraïque sans produire une période trop lourde.
