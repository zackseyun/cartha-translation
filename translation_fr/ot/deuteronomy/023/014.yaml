  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: fr
  text: Tu auras un piquet parmi ton équipement[a]. Quand tu iras t’asseoir dehors[b], tu creuseras avec lui, puis tu te retourneras et tu couvriras tes excréments.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sur ton oreille ». L’expression désigne probablement ici l’équipement ou les effets que l’on porte; le sens exact de l’idiome est incertain.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « quand tu t’assiéras dehors »; c’est un euphémisme pour faire ses besoins.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: piquet
  rationale: Le nom désigne habituellement un piquet ou une cheville. « Piquet » conserve l’image lexicale, tandis que la suite indique qu’il sert ici à creuser.
- source_word: עַל אֲזֵנֶךָ
  choice: parmi ton équipement
  rationale: Littéralement « sur ton oreille », mais l’expression désigne vraisemblablement ici l’équipement porté par le soldat. Une traduction littérale serait incompréhensible en français.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: quand tu t’accroupiras à l’extérieur
  rationale: La formulation hébraïque signifie littéralement « quand tu t’assiéras dehors » et sert d’euphémisme. « T’accroupiras » rend naturellement la posture impliquée tout en préservant la discrétion de l’expression.
- source_word: וְחָפַרְתָּה בָהּ
  choice: tu creuseras avec lui
  rationale: Le pronom renvoie au piquet. Le complément « un trou » reste implicite, comme en hébreu.
- source_word: וְשַׁבְתָּ
  choice: tu te retourneras
  rationale: Dans la succession des gestes, le verbe indique vraisemblablement que la personne se retourne après avoir creusé afin de recouvrir ses déjections.
- source_word: צֵאָתֶךָ
  choice: tes excréments
  rationale: Le terme désigne les déjections humaines. « Excréments » est précis, actuel et d’un registre adapté à un texte juridique.
