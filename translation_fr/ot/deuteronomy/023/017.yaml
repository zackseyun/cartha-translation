  text: עִמְּ/ךָ֞ יֵשֵׁ֣ב בְּ/קִרְבְּ/ךָ֗ בַּ/מָּק֧וֹם אֲשֶׁר יִבְחַ֛ר בְּ/אַחַ֥ד שְׁעָרֶ֖י/ךָ בַּ/טּ֣וֹב ל֑/וֹ לֹ֖א תּוֹנֶֽ/נּוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: fr
  text: Il habitera avec toi, au milieu de toi, dans le lieu qu’il choisira, dans l’une de tes villes[a], là où bon lui semblera[b]. Tu ne l’opprimeras pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans l’une de tes portes ». Les « portes » peuvent désigner ici les villes ou les communautés d’Israël.
    reason: cultural_note
  - marker: b
    text: Ou « là où cela lui semblera le meilleur »; litt. « dans ce qui est bon pour lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: habitera
  rationale: Le verbe ישב peut signifier « s’asseoir », « rester » ou « habiter ». Dans cette disposition juridique relative au lieu de résidence, « habitera » exprime naturellement une installation durable.
- source_word: עִמְּךָ
  choice: avec toi
  rationale: La préposition עם avec suffixe signifie littéralement « avec toi »; cette formulation est conservée, tandis que « au milieu de toi » précise l’intégration à la communauté.
- source_word: בְּקִרְבְּךָ
  choice: au milieu de toi
  rationale: Cette expression situe l’homme au sein même de la communauté. La traduction garde l’image concrète et la deuxième personne du singulier collectif de l’hébreu.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: dans le lieu qu’il choisira
  rationale: בחר signifie « choisir ». Le sujet est ici l’homme dont parle le verset précédent; la traduction préserve explicitement sa liberté de choisir son lieu de résidence.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: dans l’une de tes villes
  rationale: Littéralement « dans l’une de tes portes ». En hébreu biblique, les « portes » désignent souvent par métonymie les villes ou communautés auxquelles elles donnent accès. « Villes » rend clairement cet idiome en français moderne.
- source_word: בַּטּוֹב לוֹ
  choice: là où il se trouvera bien
  rationale: L’expression signifie littéralement « dans ce qui est bon pour lui ». Le choix retenu conserve son point de vue et peut évoquer aussi bien son bien-être que ce qui lui convient, sans réduire le sens au seul plaisir.
- source_word: לֹא תּוֹנֶנּוּ
  choice: Tu ne l’opprimeras pas
  rationale: Dans un contexte juridique, le hifil de ינה exprime l’oppression, l’exploitation ou le mauvais traitement d’une personne vulnérable. « Opprimer » en restitue la force sociale et morale.
theological_decisions:
- issue: Référent des formes masculines singulières
  choice: Le texte désigne au masculin singulier l’esclave ou serviteur fugitif mentionné au verset précédent, avec « il » et « le/l’ » en français.
  alternative: Employer une formulation épicène ou plurielle pour désigner une personne non spécifiée.
  rationale: Toutes les formes hébraïques pertinentes sont au masculin singulier. La traduction conserve cette donnée grammaticale sans élargir ni restreindre davantage le référent.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple convient à la formulation juridique du passage. Le singulier « toi » est maintenu parce que l’hébreu s’adresse à Israël comme à une collectivité unifiée. L’idiome des « portes » est rendu dans le texte par « villes » et expliqué en note.
