revisions:
- from: Tu ne considéreras pas l’Édomite comme quelqu’un de détestable[a], car il est ton frère[b]. Tu ne considéreras pas l’Égyptien comme quelqu’un de détestable, car tu as été immigré[c] dans son pays.
  to: Tu n’auras pas l’Édomite en horreur[a], car il est ton frère[b]. Tu n’auras pas l’Égyptien en horreur, car tu as été un étranger résidant[c] dans son pays.
  rationale: La révision remplace une périphrase lourde par l’expression idiomatique « avoir en horreur », qui rend la force de תעב et maintient exactement le parallélisme. Elle remplace « immigré » par « étranger résidant » afin de mieux refléter la nuance de gér, tout en conservant une formulation moderne et accessible. Aucun changement n’est apporté aux singuliers représentatifs ni au langage littéral de parenté.
