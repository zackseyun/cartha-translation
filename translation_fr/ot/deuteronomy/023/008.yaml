  timestamp: '2026-07-14T13:02:21Z'
review_pass:
  verdict: revise
  source_fidelity: Le parallélisme, les gentilés au singulier représentatif, le motif de fraternité et le suffixe singulier de « dans son pays » sont bien conservés. Toutefois, « immigré » ne rend pas assez précisément גֵר, qui désigne ici une personne vivant comme étrangère résidente hors de son pays d’origine.
  naturalness: « Considérer comme quelqu’un de détestable » est grammatical, mais lourd et moins idiomatique que « avoir en horreur », qui conserve la force du verbe et le ton juridique solennel du passage. « Étranger résidant » est clair en français international moderne.
  terminology: « Avoir en horreur » rend adéquatement תְתַעֵב sans imposer une interprétation supplémentaire. « Étranger résidant » préserve mieux la nuance sociale de גֵר que « immigré ». Les termes « Édomite », « Égyptien » et « frère » sont appropriés.
  issues:
  - severity: medium
    issue: « immigré » pour גֵר
    rationale: Le mot moderne peut évoquer principalement un statut migratoire contemporain et ne communique pas nécessairement la condition durable d’étranger vivant au sein d’un autre pays que porte גֵר. « Étranger résidant » est plus précis sans être archaïque.
  - severity: low
    issue: Périphrase « considérer comme quelqu’un de détestable »
    rationale: Cette formulation alourdit les deux membres parallèles. « Avoir en horreur » est plus naturel et garde la vigueur prohibitive du verbe hébreu.
