  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: fr
  text: Tu n’auras pas l’Édomite en horreur[a], car il est ton frère[b]. Tu n’auras pas l’Égyptien en horreur, car tu as été un étranger résidant[c] dans son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne détesteras pas l’Édomite ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « ton frère » renvoie à la parenté entre Israël et Édom par Ésaü.
    reason: cross_reference
  - marker: c
    text: 'Ou : « immigré » ou « résident étranger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: considérer comme quelqu’un de détestable
  rationale: Le piel de תעב exprime ici le fait de tenir une personne pour abominable ou détestable et, par conséquent, de la traiter comme telle. Cette formulation conserve la force du verbe tout en restant naturelle en français; la répétition parallèle est maintenue.
- source_word: אֲדֹמִי
  choice: l’Édomite
  rationale: Gentilé singulier employé de façon représentative, conformément à la formulation juridique de l’hébreu.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le terme familial est rendu littéralement afin de préserver le motif de parenté entre Israël et Édom, sans le réduire à la paraphrase « ton parent ».
- source_word: מִצְרִי
  choice: l’Égyptien
  rationale: Rendu standard du gentilé singulier, conservé dans sa fonction représentative.
- source_word: גֵר
  choice: immigré
  rationale: גֵר désigne une personne établie hors de son groupe et de son territoire d’origine, sous la protection d’une autre société. « Immigré » est actuel et intelligible, tandis que la note signale une autre formulation possible correspondant à la dimension résidentielle et juridique.
- source_word: בְאַרְצוֹ
  choice: dans son pays
  rationale: Le suffixe singulier est conservé et renvoie à l’Égyptien pris comme représentant de l’Égypte; « pays » est plus naturel ici en français moderne que « terre ».
- source_word: כִּי
  choice: car
  rationale: Introduit dans les deux propositions le motif de l’interdiction, avec une valeur explicative claire et naturelle en français.
theological_decisions:
- issue: Singuliers représentatifs désignant des peuples
  choice: Conserver les singuliers « l’Édomite », « l’Égyptien », « il » et « son pays »
  alternative: 'Employer des pluriels : « les Édomites », « les Égyptiens », « leur pays »'
  rationale: L’hébreu emploie des gentilés singuliers représentatifs dans un cadre juridique. Les conserver respecte la forme de la source et donne au commandement une portée personnelle sans en modifier le sens collectif.
- issue: Langage de parenté concernant Édom
  choice: Traduire אָחִיךָ par « ton frère »
  alternative: Interpréter par « ton parent » ou « ton proche parent »
  rationale: La formulation littérale maintient la tension et la portée historico-théologique de la parenté entre Israël et Édom, traditionnellement rattachée à Ésaü, sans intégrer cette explication au corps du texte.
translation_notes:
  register: Français international moderne, digne et direct. La tournure « considérer comme quelqu’un de détestable » explicite la construction causative du piel sans atténuer sa force. Les singuliers représentatifs et le parallélisme des deux interdictions sont préservés.
