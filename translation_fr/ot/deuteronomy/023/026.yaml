base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: fr
  text: Quand tu entreras dans les blés sur pied de ton prochain, tu pourras cueillir des épis à la main, mais tu ne passeras pas la faucille sur les blés sur pied de ton prochain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « tu ne feras pas mouvoir la faucille sur les blés sur pied de ton prochain ». Le verbe hébreu évoque le fait d’agiter, de brandir ou d’appliquer un outil.'
    reason: La note conserve l’image concrète du verbe hébreu נוּף sans présenter une interprétation particulière comme une traduction strictement littérale.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Quand tu entreras
  rationale: Dans cette loi casuistique, כִּי introduit la situation dans laquelle la règle s’applique. Le futur français exprime naturellement cette éventualité.
- source_word: בְּקָמַת
  choice: dans les blés sur pied
  rationale: קָמָה désigne les céréales encore debout, non moissonnées. « Blés sur pied » est une expression agricole française naturelle qui conserve cette précision.
- source_word: רֵעֶךָ
  choice: de ton prochain
  rationale: Dans ce contexte juridique, רֵעַ désigne un autre membre de la communauté. « Prochain » est à la fois établi, digne et suffisamment large.
- source_word: וְקָטַפְתָּ
  choice: tu pourras cueillir
  rationale: La forme verbale indique ici l’action permise, en contraste avec l’usage interdit de la faucille. « Tu pourras » rend explicitement cette valeur permissive.
- source_word: מְלִילֹת
  choice: des épis
  rationale: מְלִילֹת désigne les épis, c’est-à-dire les parties porteuses des grains que l’on peut détacher à la main.
- source_word: בְּיָדֶךָ
  choice: à la main
  rationale: Cette formulation idiomatique indique que seule une cueillette manuelle est autorisée.
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף עַל
  choice: mais tu ne passeras pas la faucille sur
  rationale: La conjonction marque le contraste entre la cueillette manuelle permise et la moisson interdite. « Passer la faucille sur » rend naturellement en français l’application de l’outil aux céréales, tandis que la note conserve l’image plus littérale du mouvement de la faucille.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse juridique individuelle de l’hébreu. La répétition de « les blés sur pied de ton prochain » est maintenue pour refléter la structure et l’insistance du texte source.
