base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: fr
  text: S’il y a parmi vous un homme qui n’est pas rituellement pur à cause d’une émission nocturne[a], il sortira du camp et n’y rentrera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un événement de la nuit » ; expression désignant ici une émission nocturne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: S’il
  rationale: Dans ce cas juridique, כִּי introduit une situation conditionnelle; « s’il » rend naturellement cette valeur.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: y a parmi vous un homme
  rationale: Cette formulation rend l’emploi existentiel de היה avec בך et איש, tout en conservant le cadre communautaire et la référence masculine précise.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: qui n’est pas pur
  rationale: « Pur » exprime ici un statut rituel, sans suggérer une faute morale; la négation de l’hébreu est conservée.
- source_word: מִקְּרֵה לָיְלָה
  choice: à cause d’une émission nocturne
  rationale: L’expression littérale « événement de la nuit » désigne idiomatiquement une émission corporelle nocturne; ce choix est clair, exact et non inutilement clinique.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: il sortira du camp
  rationale: Le futur français a ici une valeur prescriptive et rend avec naturel l’instruction juridique de sortir au-delà des limites du camp.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: il n’entrera pas à l’intérieur du camp
  rationale: « À l’intérieur » conserve la nuance de תּוֹךְ, qui vise l’espace interne du camp plutôt que sa seule limite.
theological_decisions:
- issue: Nature de l’impureté dans ce verset
  choice: Présenter l’état comme une impureté rituelle, sans connotation de faute morale.
  alternative: Employer une formulation pouvant laisser entendre une souillure morale.
  rationale: Le contexte porte sur la sainteté du camp et sur un état corporel temporaire. Le texte n’attribue ici aucune culpabilité morale à l’homme concerné.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure conditionnelle de la loi, la référence explicite à un homme et la nuance rituelle de la pureté. Le futur est employé avec sa valeur normative habituelle dans les textes juridiques.
