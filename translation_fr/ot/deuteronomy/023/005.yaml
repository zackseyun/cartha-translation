source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: fr
  text: parce qu’ils ne sont pas venus à votre rencontre avec du pain et de l’eau sur le chemin, lorsque vous êtes sortis d’Égypte, et parce qu’il a engagé contre toi Balaam, fils de Béor, de Petor en Aram-Naharaïm[a], pour te maudire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram-Naharaïm est traditionnellement identifié à la Mésopotamie ; le nom signifie littéralement « Aram des deux fleuves ».
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: parce que
  rationale: Cette locution introduit les motifs de l’interdiction précédente ; « parce que » en exprime naturellement la valeur causale.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: ne sont pas venus à votre rencontre
  rationale: Le verbe désigne ici le fait d’aller au-devant de quelqu’un, avec les provisions précisées ensuite, sans ajouter l’idée plus forte d’un accueil complet.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: avec du pain et de l’eau
  rationale: La traduction conserve les deux noms concrets de l’hébreu tout en employant une tournure française naturelle.
- source_word: בַּדֶּרֶךְ
  choice: sur le chemin
  rationale: Rendu locatif simple et idiomatique, qui convient au déplacement d’Israël.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: lorsque vous êtes sortis d’Égypte
  rationale: L’infinitif construit marque le temps ; la formulation française préserve explicitement la sortie d’Égypte.
- source_word: וַאֲשֶׁר
  choice: et parce que
  rationale: La conjonction introduit un second motif parallèle au premier.
- source_word: שָׂכַר עָלֶיךָ
  choice: il a fait venir contre toi, à prix d’argent
  rationale: שׂכר exprime l’engagement contre rémunération. Cette formulation évite le français moderne potentiellement ambigu « louer quelqu’un » et conserve l’orientation hostile de עַל.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam, fils de Béor
  rationale: Les noms propres sont translittérés selon l’usage biblique français courant, et le patronyme hébreu est conservé.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: de Petor en Aram-Naharaïm
  rationale: Les deux toponymes sont conservés sous forme translittérée ; « en » exprime naturellement la localisation de Petor dans cette région sans remplacer le nom hébreu par « Mésopotamie ».
- source_word: לְקַלְלֶךָּ
  choice: pour te maudire
  rationale: L’infinitif indique directement le but de l’engagement de Balaam.
theological_decisions:
- issue: Alternance entre le pluriel et le singulier dans l’adresse à Israël
  choice: Conserver « votre/vous » puis « toi/te »
  alternative: Uniformiser toute l’adresse au pluriel ou au singulier
  rationale: Le texte hébreu passe réellement du pluriel dans le premier motif au singulier dans le second. Cette alternance propre au style juridique du Deutéronome est préservée plutôt que lissée.
- issue: Identité du sujet singulier de שָׂכַר (« il a fait venir »)
  choice: Conserver le pronom « il » sans identifier davantage le sujet
  alternative: Expliciter « Moab » ou « le roi de Moab »
  rationale: Le verset emploie un sujet singulier implicite dans un contexte où les groupes précédemment nommés sont pluriels. L’explicitation résoudrait une tension grammaticale que le texte laisse présente.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe causale dépend du verset précédent, comme dans l’hébreu. Les noms propres suivent des formes françaises transparentes, tandis que le toponyme régional hébreu est conservé et expliqué en note.
