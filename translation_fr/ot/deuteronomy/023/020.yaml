source:
  edition: WLC
  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: fr
  text: 'Tu ne réclameras pas à ton frère d’intérêt : intérêt sur de l’argent[b], intérêt sur de la nourriture, ou intérêt sur toute chose prêtée à intérêt[c].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton compatriote israélite » ou « un membre de ton peuple » ; littéralement « ton frère ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « argent » au sens du métal ; le mot est employé ici au sens de monnaie.
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction : « sur toute chose sur laquelle un intérêt est exigé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: tu ne feras pas payer d’intérêt
  rationale: Le hifil de נשׁך exprime ici le fait d’imposer ou d’exiger un intérêt. Cette formulation française désigne clairement l’action du prêteur visée par l’interdiction.
- source_word: לְאָחִיךָ
  choice: à ton frère
  rationale: Le texte dit littéralement « ton frère ». Ce choix conserve l’image familiale et l’appartenance à la communauté de l’alliance, tandis qu’une note explicite sa portée contextuelle.
- source_word: נֶשֶׁךְ
  choice: intérêt
  rationale: Le terme désigne l’intérêt exigé sur un prêt. « Usure » pourrait laisser entendre seulement un taux excessif et serait donc trop restrictif.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le sens premier est « argent » au sens du métal, mais, dans ce contexte économique et juridique, le mot désigne naturellement la monnaie.
- source_word: אֹכֶל
  choice: nourriture
  rationale: Le terme désigne de façon générale ce qui se mange; « nourriture » est clair, naturel et suffisamment large.
- source_word: כָּל דָּבָר
  choice: quoi que ce soit
  rationale: Cette expression rend la portée exhaustive de la formule hébraïque et étend l’interdiction au-delà de l’argent et de la nourriture.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: qui puisse produire un intérêt
  rationale: La proposition relative désigne toute chose susceptible de donner lieu à la perception d’un intérêt. La formulation conserve l’expression quelque peu générale du texte sans la limiter explicitement à un type précis de prêt.
theological_decisions:
- issue: Portée de « ton frère »
  choice: Conserver « ton frère » dans le texte
  alternative: « ton compatriote israélite » ou « un membre de ton peuple »
  rationale: Le contexte de l’alliance donne au terme une portée communautaire, mais la traduction littérale préserve la métaphore familiale sans imposer dans le corps du texte une explicitation interprétative.
translation_notes:
  register: Français international moderne, juridique mais accessible. La répétition d’« intérêt » reproduit l’insistance et la structure énumérative de l’hébreu. Le tutoiement singulier correspond à l’adresse légale au membre individuel d’Israël.
