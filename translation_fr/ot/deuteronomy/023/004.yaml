  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: fr
  text: Aucun Ammonite ni Moabite ne pourra entrer dans l’assemblée de Yahvé[a] ; même jusqu’à la dixième génération[b], aucun d’entre eux ne pourra entrer dans l’assemblée de Yahvé, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la communauté de Yahvé » pour « l’assemblée de Yahvé ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit à la fois « jusqu’à la dixième génération » et « pour toujours » ; la traduction conserve ces deux formulations, qui soulignent le caractère durable de l’exclusion.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: ne pourra entrer
  rationale: Avec לֹא, l’imparfait exprime ici une interdiction ou une exclusion juridique. « Ne pourra entrer » indique naturellement l’absence de droit d’admission.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: Ammonite ni Moabite
  rationale: Les gentilés français usuels rendent directement les deux termes ethniques ; après « aucun », « ni » coordonne naturellement les groupes exclus.
- source_word: קְהַל
  choice: assemblée
  rationale: « Assemblée » convient au rassemblement officiel de la communauté de l’alliance sans la coloration ecclésiastique plus marquée de « congrégation ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » translittère le nom divin plutôt que de lui substituer un titre.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: même à la dixième génération
  rationale: Cette formulation conserve l’intensification et la référence générationnelle explicites de l’hébreu.
- source_word: לָהֶם
  choice: aucun des leurs
  rationale: Dans la reprise de l’interdiction, le pronom renvoie aux personnes issues de ces peuples. « Aucun des leurs » l’exprime clairement et idiomatiquement.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: Dans une proposition négative, « ne pourra jamais entrer » rend naturellement la portée durable de עַד עוֹלָם, tout en laissant subsister la mention distincte de la dixième génération.
theological_decisions:
- issue: Rapport entre « dixième génération » et « pour toujours »
  choice: Conserver les deux expressions dans le texte, sous les formes « à la dixième génération » et « jamais ».
  alternative: Réduire « dixième génération » à une simple manière de dire « jamais », ou atténuer la portée de עַד עוֹלָם.
  rationale: Le texte hébreu juxtapose les deux expressions temporelles. La traduction maintient cette tension au lieu de les fondre ou de les harmoniser.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe juridique reste ferme sans archaïsme. « Yahvé » est employé comme forme française du nom divin, et les deux indications temporelles de l’hébreu sont maintenues.
