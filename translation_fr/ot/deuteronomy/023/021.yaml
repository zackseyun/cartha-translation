base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: fr
  text: Tu pourras exiger un intérêt de l’étranger[a], mais tu n’en exigeras pas de ton frère[b], afin que Yahweh, ton Dieu, te bénisse dans tout ce à quoi tu mettras la main, dans le pays où tu entres pour en prendre possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « prêter à intérêt à l’étranger » ou « lui faire payer un intérêt ». Le mot « usure », fréquent dans des traductions anciennes, peut aujourd’hui suggérer à tort un intérêt nécessairement excessif.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « ton frère » désigne un autre membre du peuple d’Israël, et non seulement un frère biologique.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: de l’étranger
  rationale: נָכְרִי désigne ici une personne étrangère au peuple d’Israël. « L’étranger » exprime clairement le contraste juridique avec « ton frère », sans confondre ce terme avec d’autres catégories d’étrangers résidant en Israël.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: exiger un intérêt / ne pas en exiger
  rationale: Dans ce contexte de prêt, le hiphil de נשׁך indique l’imposition ou la perception d’un intérêt. « Exiger un intérêt » est naturel en français moderne et évite « usure », qui suggérerait nécessairement un taux abusif.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: La traduction conserve le terme familial masculin de l’hébreu. Dans cette loi d’alliance, il désigne un autre membre du peuple d’Israël.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution conserve la valeur de but, avec sa nuance possible de résultat, dans un registre naturel et digne.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu, te bénisse
  rationale: Le nom d’alliance יְהוָה est translittéré « Yahweh ». Le subjonctif après « afin que » rend naturellement la forme verbale dans cette proposition de but.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: dans tout ce à quoi tu mettras la main
  rationale: Cette formulation française idiomatique garde l’image hébraïque de la main tout en exprimant l’ensemble des travaux et entreprises de la personne.
- source_word: עַל הָאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le pays promis, et la préposition française « dans » exprime naturellement le lieu où la bénédiction accompagnera les activités.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: où tu entres pour en prendre possession
  rationale: La formulation rend le mouvement vers le pays ainsi que l’infinitif de but, sans alourdir la phrase par un « là » redondant en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de « ton frère » dans la loi sur l’intérêt
  choice: conserver « ton frère » et préciser son sens en note
  alternative: ton compatriote israélite
  rationale: Le terme familial appartient à la formulation théologique et sociale de l’alliance. Le conserver préserve l’image du texte, tandis que la note évite de faire croire qu’il s’agit seulement d’un frère biologique.
translation_notes:
  register: Français international moderne, au tutoiement singulier comme dans l’hébreu. Le style demeure digne et direct. L’expression « tout ce à quoi tu mettras la main » conserve l’image concrète de l’original sans produire un calque peu naturel.
