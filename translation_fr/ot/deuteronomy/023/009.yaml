  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: fr
  text: Les enfants qui leur naîtront pourront entrer dans l’assemblée de Yahweh à la troisième génération[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils » ; dans ce contexte juridique et généalogique, le mot désigne plus largement les enfants ou les descendants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « une troisième génération pourra entrer ». La formulation peut aussi être comprise comme une admission permise à partir de la troisième génération.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: Les enfants
  rationale: Le nom masculin pluriel signifie littéralement « fils », mais peut désigner plus largement la descendance dans un contexte juridique et généalogique. « Enfants » conserve l’image familiale sans limiter indûment le référent aux seuls hommes.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: qui leur naîtront
  rationale: Le passif de ילד suivi de ל et du pronom signifie naturellement « qui leur seront nés ». Le futur français « naîtront » rend ici clairement et dignement cette relation de descendance.
- source_word: דּוֹר שְׁלִישִׁי
  choice: à la troisième génération
  rationale: Cette expression indique le degré générationnel à partir duquel l’admission devient possible. La formulation française est naturelle tout en restant proche de la structure hébraïque.
- source_word: יָבֹא
  choice: pourront entrer
  rationale: Le verbe signifie littéralement « viendra/entrera ». Dans cette disposition juridique, le futur hébreu exprime l’admission autorisée; « pourront entrer » évite de le faire passer pour une simple prédiction.
- source_word: בִּקְהַל
  choice: dans l’assemblée
  rationale: קהל désigne la communauté réunie, notamment dans un cadre d’alliance ou de droit. « Assemblée » restitue ce sens collectif et institutionnel en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel exprimé directement par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre et évite de le remplacer par un titre.
- issue: Portée de בָּנִים dans ce contexte juridico-généalogique
  choice: Les enfants
  alternative: Les fils; Les descendants
  rationale: La forme hébraïque est masculine, mais elle désigne ici les membres issus d’une lignée. « Enfants » maintient le lien familial et la portée représentative du pluriel sans effacer le sens littéral, signalé en note.
- issue: Valeur modale de יָבֹא
  choice: pourront entrer
  alternative: entreront
  rationale: Dans cette règle d’admission, le verbe indique qu’à partir de la troisième génération l’entrée est permise. La traduction formelle « entreront » demeure possible et est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur « naîtront » et la tournure « pourront entrer » expriment clairement la règle généalogique et juridique. Les notes conservent le genre lexical de בָּנִים et la formulation plus stricte du verbe hébreu.
