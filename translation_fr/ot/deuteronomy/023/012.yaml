  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: fr
  text: À l’approche du soir, il se lavera dans l’eau et, une fois le soleil couché[a], il pourra rentrer à l’intérieur du camp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quand le soleil entre » ; c’est une expression hébraïque désignant le coucher du soleil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au milieu du camp ». L’hébreu souligne l’entrée à l’intérieur du camp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: À l’approche du soir
  rationale: La tournure וְהָיָה introduit ici la suite de l’instruction légale. En français, il n’est pas nécessaire de la traduire séparément par « et il arrivera » ; la continuité est naturellement portée par la proposition temporelle.
- source_word: לִפְנוֹת עֶרֶב
  choice: À l’approche du soir
  rationale: L’infinitif de פנה avec עֶרֶב décrit le moment où le jour tourne vers le soir. Cette formulation française en restitue naturellement le mouvement temporel.
- source_word: יִרְחַץ בַּמָּיִם
  choice: il se lavera dans l’eau
  rationale: Dans ce contexte de pureté rituelle, רחץ désigne le lavage du corps. Le pronom réfléchi explicite en français le sens contextuel sans ajouter une idée étrangère.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: une fois le soleil couché
  rationale: L’expression hébraïque signifie littéralement que le soleil « entre », idiome désignant son coucher. La traduction donne le sens courant tout en signalant l’image littérale en note.
- source_word: יָבֹא
  choice: il pourra rentrer
  rationale: Dans cette prescription, l’imparfait hébreu marque la réadmission permise après le lavage et le coucher du soleil. « Pourra » exprime cette autorisation, et « rentrer » convient puisqu’il revient dans le camp après en avoir été exclu.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: à l’intérieur du camp
  rationale: תּוֹךְ précise l’entrée dans l’espace intérieur du camp. La formulation retenue préserve cette nuance avec un français naturel.
