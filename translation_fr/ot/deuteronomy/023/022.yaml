  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: fr
  text: Mais si tu fais un vœu à Yahweh, ton Dieu, ne tarde pas à l’accomplir, car Yahweh, ton Dieu, te le réclamera certainement, et tu te rendras coupable d’un péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il y aura en toi un péché »; on peut aussi comprendre : « et cela sera pour toi un péché ».'
    reason: La construction hébraïque est concise et peut désigner le péché attaché à la personne ou la culpabilité qui en résulte.
lexical_decisions:
- source_word: כִּי
  choice: Mais si
  rationale: Dans le contexte, la particule introduit une condition tout en marquant un léger contraste avec le verset précédent.
- source_word: תִדֹּר נֶדֶר
  choice: tu fais un vœu
  rationale: Cette tournure française rend naturellement la construction hébraïque formée du verbe et de son complément de même racine.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: à Yahweh, ton Dieu
  rationale: La préposition désigne le destinataire du vœu, et le nom divin est transcrit « Yahweh » afin de préserver le nom propre présent dans le texte.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: ne tarde pas à l’accomplir
  rationale: Dans le contexte d’un vœu, שׁלם désigne l’exécution de l’engagement pris. « Accomplir » convient à différents types de vœux sans les réduire à un paiement monétaire.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: te le réclamera certainement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Certainement » en restitue l’intensité, tandis que « réclamera » exprime l’exigence divine.
- source_word: מֵעִמָּךְ
  choice: te
  rationale: Le pronom français intégré à « te le réclamera » exprime naturellement que Dieu exigera du déclarant ce qu’il a voué.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: et tu te rendras coupable d’un péché
  rationale: Cette formulation française exprime clairement la culpabilité encourue, tandis qu’une note conserve la formulation hébraïque plus compacte et son image.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme comme nom propre; « Yahweh » le préserve sans le remplacer par un titre.
- issue: Portée de l’expression וְהָיָה בְךָ חֵטְא
  choice: tu te rendras coupable d’un péché
  alternative: il y aura en toi un péché
  rationale: Le texte associe le péché au déclarant sans expliciter davantage la nature de cette relation. Le corps du texte rend idiomatiquement l’idée de culpabilité, et la note signale la formulation littérale afin de ne pas effacer son ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque à l’individu. « Accomplir un vœu » a été préféré à « payer un vœu », plus étroit et moins naturel dans ce contexte.
