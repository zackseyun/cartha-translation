source:
  edition: WLC
  text: לֹא תִדְרֹ֥שׁ שְׁלֹמָ֖/ם וְ/טֹבָתָ֑/ם כָּל יָמֶ֖י/ךָ לְ/עוֹלָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: fr
  text: Tu ne rechercheras ni leur paix ni leur prospérité, aucun jour de ta vie, à jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur bien-être et leur bien ». Les termes hébreux ont un sens plus large que la seule paix politique ou la prospérité économique.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: rechercheras
  rationale: Le verbe דרש signifie couramment « chercher » ou « s’enquérir de ». Avec des réalités abstraites comme la paix et la prospérité, « rechercher » exprime naturellement une démarche visant à les favoriser.
- source_word: שְׁלֹמָם
  choice: leur paix
  rationale: שָׁלוֹם peut désigner la paix, le bien-être ou la sécurité. « Leur paix » conserve le terme français le plus directement correspondant tout en laissant percevoir son sens large.
- source_word: טֹבָתָם
  choice: leur prospérité
  rationale: טוֹבָה désigne ici ce qui est bon ou avantageux pour eux, leur bien ou leur prospérité. « Prospérité » distingue ce terme de שָׁלוֹם et convient à l’idée de favoriser leur épanouissement.
- source_word: כָּל יָמֶיךָ
  choice: aucun jour de ta vie
  rationale: Dans une phrase négative, cette formulation française idiomatique rend la totalité de « tous tes jours » et maintient l’adresse au singulier.
- source_word: לְעוֹלָם
  choice: à jamais
  rationale: Cette expression rend la durée persistante et emphatique de עוֹלָם dans un français naturel et digne.
theological_decisions:
- issue: Cumul apparemment redondant entre כָּל יָמֶיךָ et לְעוֹלָם
  choice: 'Conserver distinctement les deux expressions : « aucun jour de ta vie, à jamais »'
  alternative: Réduire l’ensemble à « tant que tu vivras »
  rationale: L’hébreu accumule les deux indications de durée pour renforcer l’interdiction. Les conserver évite d’atténuer cette insistance.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur injonctive convient au registre légal du Deutéronome. La coordination négative « ni… ni… » est naturelle en français; la virgule avant « à jamais » aide à faire entendre séparément les deux indications de durée conservées de l’hébreu.
