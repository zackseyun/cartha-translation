base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: fr
  text: Car quiconque fait de telles choses, quiconque commet l’injustice[a], est une abomination pour Yahweh, ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quiconque agit mal ». Le mot hébreu peut désigner le tort, l’injustice ou l’iniquité ; ici, il vise particulièrement les pratiques commerciales malhonnêtes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’interdiction précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: תוֹעֲבַת
  choice: est abominable aux yeux de
  rationale: Exprime avec force le caractère moralement odieux de l’auteur de tels actes devant Dieu, tout en donnant une tournure française naturelle à la construction nominale hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel porté par le tétragramme, au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement le suffixe masculin singulier et préserve la formule d’alliance.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: quiconque agit ainsi
  rationale: Rend la portée générale du participe et renvoie naturellement, en français, aux pratiques frauduleuses énumérées dans le contexte précédent.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: quiconque commet une injustice
  rationale: Reproduit le parallélisme avec la première proposition et conserve le sens éthique et social de עָוֶל dans le contexte des poids et mesures malhonnêtes.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin; sa transcription préserve le nom personnel et la portée de la formule « Yahweh, ton Dieu ».
- issue: Portée de עָוֶל
  choice: une injustice
  alternative: le mal
  rationale: Le terme peut désigner le tort, l’injustice ou l’iniquité. « Injustice » maintient cette largeur morale tout en convenant particulièrement au contexte de fraude commerciale, sans réduire l’expression au seul délit économique.
translation_notes:
  register: Français international moderne, digne et accessible. « Quiconque » soutient le parallélisme sentencieux du texte; « agit ainsi » évite le calque peu naturel « fait ces choses ». La formule « abominable aux yeux de » conserve la forte réprobation divine sans suggérer que le terme ne qualifie que l’acte.
