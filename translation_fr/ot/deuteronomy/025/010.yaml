  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: fr
  text: Et on l’appellera en Israël « la maison de celui à qui on a retiré la sandale ».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « la maison de la sandale retirée ». L’hébreu condense en une expression très brève le nom infamant lié au rituel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא שְׁמוֹ
  choice: on l’appellera
  rationale: La formule hébraïque signifie littéralement « son nom sera appelé ». En français actuel, « on l’appellera » rend naturellement la désignation publique tout en conservant sa portée officielle.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition indique le cadre social dans lequel ce nom sera employé ; « en Israël » est la formulation française la plus naturelle.
- source_word: בֵּית
  choice: la maison de
  rationale: Le terme désigne ici la maison au sens de famille ou lignée, et fait partie du titre infamant prononcé publiquement.
- source_word: חֲלוּץ הַנָּעַל
  choice: celui à qui on a retiré la sandale
  rationale: L’expression compacte associe un participe passif à « la sandale ». Cette formulation explicite le geste rituel sans ajouter l’idée d’un agent précis ni remplacer la sandale par une chaussure générique.
