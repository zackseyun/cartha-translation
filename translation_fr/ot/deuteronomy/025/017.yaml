  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: fr
  text: Souviens-toi de ce qu’Amalec t’a fait en chemin, lorsque vous êtes sortis d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: Souviens-toi
  rationale: L’impératif qal masculin singulier adresse directement Israël comme une personne collective. « Souviens-toi » est naturel en français et conserve la force solennelle du commandement.
- source_word: אֵת אֲשֶׁר
  choice: de ce que
  rationale: La particule d’objet suivie du relatif introduit le contenu du souvenir. Après « se souvenir », « de ce que » est la tournure française naturelle.
- source_word: עָשָׂה לְךָ
  choice: t’a fait
  rationale: Le verbe avec ל et le suffixe singulier désigne ici ce qu’Amalec a fait à Israël. La formulation française conserve l’adresse collective au singulier et laisse le contexte préciser le caractère hostile de l’action.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: Cette expression rend naturellement le cadre du voyage indiqué par בְּדֶּרֶךְ, sans suggérer nécessairement une route particulière.
- source_word: בְּצֵאתְכֶם
  choice: lorsque vous êtes sortis
  rationale: L’infinitif construit avec ב exprime la circonstance temporelle. Le suffixe pluriel impose ici « vous », malgré l’adresse collective au singulier dans « Souviens-toi » et « t’a fait ».
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: La préposition מִן marque la provenance. Avec « sortir », « sortir d’Égypte » est la formulation française idiomatique et précise.
theological_decisions:
- issue: Alternance entre le singulier et le pluriel dans l’adresse à Israël
  choice: Maintenir « Souviens-toi… t’a fait » au singulier, puis « vous êtes sortis » au pluriel
  alternative: Uniformiser toute la phrase au singulier ou au pluriel
  rationale: L’hébreu passe réellement du singulier זָכוֹר et לְךָ au pluriel בְּצֵאתְכֶם. Cette variation présente Israël à la fois comme unité collective et comme ensemble de personnes; elle ne doit pas être effacée.
translation_notes:
  register: Français international moderne, sobre et digne. La variation intentionnelle entre « tu » et « vous » reproduit celle du texte hébreu. Aucun deux-points n’est ajouté, puisque le verset hébreu se clôt ici sans ponctuation syntaxique imposant la suite.
