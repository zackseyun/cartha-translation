  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: fr
  text: Tu n’auras pas dans ta maison deux mesures d’épha[a], l’une grande et l’autre petite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha était une ancienne unité hébraïque de mesure pour les matières sèches.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Tu n’auras pas
  rationale: La construction hébraïque, littéralement « il n’y aura pas pour toi », exprime ici l’interdiction de posséder. Le futur français conserve la force juridique de la formulation.
- source_word: בְּבֵיתְךָ
  choice: dans ta maison
  rationale: Le terme בַּיִת désigne ici la maison comme lieu où sont conservées les mesures; « maison » reste concret et proche de l’hébreu.
- source_word: אֵיפָה וְאֵיפָה
  choice: deux mesures différentes d’épha
  rationale: La répétition idiomatique désigne deux étalons de même nom mais de contenances différentes. Cette formulation naturelle en français explicite le contraste immédiatement précisé par « une grande et une petite », tout en conservant le nom de l’unité ancienne.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: une grande et une petite
  rationale: Les adjectifs féminins qualifient les deux mesures d’épha et rendent avec concision leur différence de contenance.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement singulier conforme à l’adresse hébraïque. La formulation évite l’étrange répétition littérale « un épha et un épha » tout en préservant l’idée de deux mesures inégales utilisées comme doubles étalons.
