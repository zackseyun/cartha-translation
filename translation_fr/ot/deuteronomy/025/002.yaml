review_pass:
  verdict: revise
  source_fidelity: 'Le sens judiciaire est bien rendu : le condamné est passible de coups, le juge supervise la procédure, et le nombre des coups est proportionné à la faute. Toutefois, « le fera étendre et frapper » peut faire du condamné le sujet de « frapper », comme s’il devait frapper quelqu’un. Le second verbe doit donc être formulé au passif causatif afin de conserver l’objet hébreu « le frapper ».'
  naturalness: « Le fera étendre et le fera frapper devant lui » est clair, naturel dans un registre juridique soutenu et ne laisse pas d’ambiguïté sur l’auteur subi de la seconde action.
  terminology: « Le coupable », « le juge », « faute » et « coups » conviennent au contexte. « Fera frapper » rend adéquatement l’action punitive ordonnée sous l’autorité du juge, sans imposer indûment l’identité de l’exécutant.
  issues:
  - severity: medium
    issue: Ambiguïté grammaticale dans « le fera étendre et frapper »
    rationale: 'Après « fera », les deux infinitifs peuvent naturellement avoir « le » (le coupable) pour sujet : il serait alors fait étendre et frapperait lui-même. Le texte hébreu désigne au contraire le coupable comme objet de l’action de frapper. La répétition de « le fera » supprime l’ambiguïté.'
  revised_text: Alors, si le coupable mérite d’être battu, le juge le fera étendre et le fera frapper devant lui, d’un nombre de coups proportionné à sa faute.[a]
  revised_footnotes:
