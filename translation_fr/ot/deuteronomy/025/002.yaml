    text: 'Ou : « selon sa faute, en nombre » ; l’hébreu exprime avec concision un nombre de coups déterminé en proportion de la faute.'
    reason: La syntaxe concise de כְּדֵי רִשְׁעָתוֹ בְּמִסְפָּר associe la proportion à la faute et un nombre de coups compté.
  revision_rationale: La révision corrige uniquement l’ambiguïté syntaxique qui inversait potentiellement les rôles dans l’acte de frapper. Elle conserve le sens juridique, la surveillance du juge, la proportionnalité de la peine et l’ancrage de note portant sur l’expression finale.
