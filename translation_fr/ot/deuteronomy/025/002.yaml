  yaml_path: translation/ot/deuteronomy/025/002.yaml
  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: fr
  text: Alors, si le coupable mérite d’être battu, le juge le fera étendre et le fera frapper devant lui, d’un nombre de coups proportionné à sa faute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon sa faute, en nombre » ; l’hébreu exprime avec concision un nombre de coups déterminé en proportion de la faute.'
    reason: La syntaxe concise de כְּדֵי רִשְׁעָתוֹ בְּמִסְפָּר associe la proportion à la faute et un nombre de coups compté.
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: mérite d’être battu
  rationale: L’expression idiomatique, littéralement « fils de coups », désigne quelqu’un qui encourt légitimement un châtiment corporel; cette formulation rend naturellement sa portée juridique.
- source_word: הָרָשָׁע
  choice: le coupable
  rationale: Dans ce contexte judiciaire, le substantif masculin désigne la partie reconnue coupable. « Le coupable » préserve mieux ici la valeur juridique que « le méchant ».
- source_word: וְהִפִּילוֹ
  choice: le fera étendre
  rationale: Le hiphil de נפל exprime ici le fait de faire coucher ou étendre le condamné en vue du châtiment.
- source_word: הַשֹּׁפֵט
  choice: le juge
  rationale: Équivalent français direct et usuel du titre judiciaire.
- source_word: וְהִכָּהוּ
  choice: et frapper
  rationale: La construction française après « fera » permet de rendre l’action ordonnée ou administrée sous l’autorité du juge sans préciser inutilement l’identité de l’exécutant.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Rend littéralement la présence et la surveillance du juge pendant l’exécution de la peine.
- source_word: כְּדֵי רִשְׁעָתוֹ בְּמִסְפָּר
  choice: d’un nombre de coups proportionné à sa faute
  rationale: La formulation rend conjointement l’idée de proportion à la faute et celle d’un nombre compté, que le français doit expliciter pour rester clair.
theological_decisions: []
translation_notes:
  register: Français international moderne, juridique et digne. « Coupable » convient au cadre judiciaire; « fera étendre et frapper » conserve la procédure et l’autorité du juge sans lourdeur excessive.
