  to: Alors, si le coupable mérite d’être battu, le juge le fera étendre et le fera frapper devant lui, d’un nombre de coups proportionné à sa faute.[a]
  rationale: La révision corrige uniquement l’ambiguïté syntaxique qui inversait potentiellement les rôles dans l’acte de frapper. Elle conserve le sens juridique, la surveillance du juge, la proportionnalité de la peine et l’ancrage de note portant sur l’expression finale.
