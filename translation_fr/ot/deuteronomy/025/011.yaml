  register: Français international moderne, clair et digne, avec une syntaxe de loi casuistique. La phrase reste ouverte par une virgule parce que la conséquence juridique vient au verset suivant. Le texte conserve l’image de « la main » et l’expression « son frère », tout en éclairant leurs implications par des notes.
