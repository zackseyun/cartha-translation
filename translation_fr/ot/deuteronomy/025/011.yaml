base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: fr
  text: Si deux hommes se battent l’un contre l’autre — un homme et son frère[a] —, et que la femme de l’un d’eux s’approche pour délivrer son mari de la main de celui qui le frappe[b], et qu’elle tend la main et saisit ses parties génitales[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frère » peut désigner un compatriote ou un membre du même peuple, et non nécessairement un frère biologique.
    reason: cultural_note
  - marker: b
    text: 'Ou : « de la main de son agresseur ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie une expression pudique désignant les organes sexuels masculins.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit ici le cas envisagé par une loi casuistique. « Si » exprime naturellement cette valeur conditionnelle en français.
- source_word: יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: des hommes se battent l’un contre l’autre
  rationale: Le verbe décrit une lutte physique. La tournure réciproque rend clairement יַחְדָּו dans un français naturel sans laisser entendre qu’ils combattent côte à côte.
- source_word: אִישׁ וְאָחִיו
  choice: un homme et son frère
  rationale: Conserve l’expression hébraïque concrète et sa possible portée sociale ou communautaire; une note signale que « frère » ne désigne pas nécessairement un frère biologique.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: et que la femme de l’un d’eux s’approche
  rationale: « S’approche » rend le mouvement exprimé par קרב, tandis que « de l’un d’eux » explicite sans ambiguïté que la femme est celle de l’un des deux hommes.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: pour délivrer son mari
  rationale: Le verbe נצל désigne l’action d’arracher quelqu’un à un danger. « Délivrer » convient au registre juridique et reste immédiatement compréhensible.
- source_word: מִיַּד מַכֵּהוּ
  choice: de la main de celui qui le frappe
  rationale: Préserve l’image concrète de la « main » ainsi que la forme participiale de l’agresseur en train de frapper.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: si elle tend la main
  rationale: Rend directement l’idiome hébreu. La reprise de « si » clarifie en français que cette action fait toujours partie de la condition juridique, sans modifier sa portée.
- source_word: וְהֶחֱזִיקָה
  choice: saisit
  rationale: Exprime une prise ferme et volontaire, conformément à la valeur factitive/intensive de la forme verbale.
- source_word: בִּמְבֻשָׁיו
  choice: ses parties génitales
  rationale: Le terme hébreu est une désignation pudique des organes sexuels masculins. « Parties génitales » est précis, digne et courant.
theological_decisions: []
