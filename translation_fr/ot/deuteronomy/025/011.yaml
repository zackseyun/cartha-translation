  source_fidelity: 'Le sens du texte hébreu est globalement bien rendu : scénario casuistique, lutte entre deux hommes, intervention de l’épouse pour secourir son mari, extension de la main et saisie des parties génitales. La traduction conserve à juste titre l’image de « la main de celui qui le frappe » et le caractère euphémistique du dernier terme.'
  naturalness: 'La phrase française actuelle est compréhensible, mais « Si des hommes se battent l’un contre l’autre, un homme et son frère » est syntaxiquement heurté. De plus, le second « si elle tend » crée une subordination conditionnelle inutile : les deux derniers verbes sont simplement coordonnés dans la protase hébraïque. Une reformulation légère rend la construction juridique plus naturelle sans modifier le sens.'
  terminology: « Frère », expliqué en note, est recevable pour conserver l’expression hébraïque et son éventuelle portée sociale. « Parties génitales » est moderne, précis et d’un registre approprié. La note b doit toutefois proposer une véritable alternative à l’expression traduite « de la main de celui qui le frappe » ; sa formulation actuelle modifie également le verbe « délivrer ».
