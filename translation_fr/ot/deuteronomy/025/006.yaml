  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: fr
  text: Le premier-né qu’elle mettra au monde perpétuera le nom de son frère décédé[a], afin que le nom de celui-ci ne soit pas effacé d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « se lèvera sur le nom de son frère décédé » ; autrement dit, il assurera la continuité de sa lignée et de sa place au sein d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: le premier-né
  rationale: Le terme désigne ici le premier enfant mâle; « premier-né » conserve la portée familiale et juridique du contexte.
- source_word: תֵּלֵד
  choice: qu’elle mettra au monde
  rationale: Le verbe féminin renvoie à la veuve; cette formulation est naturelle en français et maintient explicitement son rôle maternel.
- source_word: יָקוּם עַל שֵׁם
  choice: perpétuera le nom
  rationale: Dans cette disposition juridique, l’expression indique que l’enfant assurera la continuité du nom et de la lignée du défunt, sans nécessairement recevoir son nom personnel.
- source_word: אָחִיו הַמֵּת
  choice: son frère mort
  rationale: Traduction directe et claire de l’expression hébraïque; le possessif se rapporte au premier-né.
- source_word: יִמָּחֶה
  choice: ne soit pas effacé
  rationale: Le niphal de מחה exprime ici la disparition du nom ou de la mémoire; « effacé » restitue naturellement cette image en français.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition marque le retrait hors du peuple ou de la communauté d’Israël; « effacé d’Israël » est concis et idiomatique.
theological_decisions:
- issue: Sens de la formule léviratique יָקוּם עַל שֵׁם אָחִיו הַמֵּת
  choice: L’enfant perpétue le nom, la lignée et la place du frère décédé au sein d’Israël.
  alternative: L’enfant reçoit littéralement le nom personnel du frère décédé.
  rationale: Dans ce cadre juridique, l’expression concerne surtout la continuité familiale et sociale du défunt. La traduction évite donc de réduire le texte à l’attribution d’un prénom précis, tout en signalant en note la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur rend la prescription juridique hébraïque. « Perpétuera le nom » privilégie la clarté tout en conservant en note l’image littérale et l’ambiguïté de l’expression source.
