  source_fidelity: 'Le sens juridique de יָקוּם עַל־שֵׁם est correctement rendu par « perpétuera le nom » : il s’agit de maintenir le nom et la continuité du frère décédé, non d’imposer nécessairement au nouveau-né le prénom du défunt. « Effacé d’Israël » rend fidèlement l’image de יִמָּחֶה מִיִּשְׂרָאֵל.'
