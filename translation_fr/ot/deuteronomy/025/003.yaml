  text: אַרְבָּעִ֥ים יַכֶּ֖/נּוּ לֹ֣א יֹסִ֑יף פֶּן יֹסִ֨יף לְ/הַכֹּת֤/וֹ עַל אֵ֨לֶּה֙ מַכָּ֣ה רַבָּ֔ה וְ/נִקְלָ֥ה אָחִ֖י/ךָ לְ/עֵינֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: fr
  text: Il pourra lui donner quarante coups[a], sans aller au-delà, de peur qu’en continuant à le frapper il ne lui inflige beaucoup plus de coups que ceux-là et que ton frère ne soit ainsi avili sous tes yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quarante frappes ». L’hébreu fixe le nombre à quarante, sans préciser ici l’instrument ni la forme exacte de chaque coup.
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « ton frère » désigne un membre de la communauté de l’alliance : même puni, il ne doit pas être traité comme un être méprisable.'
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Il pourra lui donner quarante coups
  rationale: Le nombre quarante fixe la limite de la peine corporelle. « Donner des coups » est naturel en français et n’introduit aucun instrument que l’hébreu ne précise pas.
- source_word: לֹא יֹסִיף
  choice: sans aller au-delà
  rationale: Le verbe יסף exprime ici l’ajout ou le dépassement. Cette formulation rend clairement l’interdiction de dépasser quarante coups.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: de peur qu’en continuant à le frapper
  rationale: La construction exprime le risque de poursuivre ou d’ajouter des coups; « de peur que » conserve la force préventive de פֶּן.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: beaucoup plus de coups que ceux-là
  rationale: Le singulier מַכָּה peut avoir ici un sens collectif, celui d’une sévère série de coups. La formulation relie explicitement l’excès aux quarante coups déjà mentionnés.
- source_word: וְנִקְלָה
  choice: ne soit ainsi avili
  rationale: Le niphal de קלה évoque le fait d’être abaissé, déshonoré ou rendu méprisable. « Avili » exprime fortement l’atteinte à la dignité sans la réduire au seul sentiment de honte.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: La traduction littérale maintient le lien fraternel par lequel le texte désigne un membre de la communauté de l’alliance, même lorsqu’il est puni.
- source_word: לְעֵינֶיךָ
  choice: sous tes yeux
  rationale: Expression française idiomatique qui conserve l’image hébraïque et souligne que l’avilissement se produirait ouvertement devant le destinataire.
theological_decisions:
- issue: Sens du terme de parenté dans ce cadre juridique
  choice: ton frère
  alternative: ton compatriote israélite
  rationale: Le texte continue de présenter le coupable comme un frère au sein de la communauté, ce qui fonde la limite imposée au châtiment. Le terme familial préserve mieux cette force éthique qu’une désignation sociale explicative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe juridique reste claire; le tutoiement singulier et le terme familial « frère » conservent l’adresse et l’image du texte hébreu.
