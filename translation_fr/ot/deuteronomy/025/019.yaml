base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: fr
  text: Quand Yahweh, ton Dieu, t’aura accordé du repos, à l’abri de tous tes ennemis d’alentour, dans le pays que Yahweh, ton Dieu, te donne en héritage afin que tu en prennes possession, tu effaceras le souvenir[a] d’Amalec de sous le ciel. N’oublie pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la mémoire d’Amalec ».'
    reason: Variante lexicale possible pour זֵכֶר.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: Quand … t’aura accordé le repos
  rationale: La construction introduit une circonstance future préalable au commandement. Le futur antérieur rend naturellement en français cette relation temporelle, tandis que « accorder le repos » conserve la valeur causative du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: loin de tous les ennemis qui t’entourent
  rationale: Cette formulation exprime le repos obtenu par rapport aux ennemis et conserve à la fois la totalité et l’idée spatiale de leur présence alentour.
- source_word: נַחֲלָה לְרִשְׁתָּהּ
  choice: en héritage pour que tu en prennes possession
  rationale: « Héritage » maintient le vocabulaire de la terre donnée, et « prendre possession » rend explicitement le sens de ירשׁ avec son objet suffixé.
- source_word: תִּמְחֶה
  choice: tu effaceras
  rationale: « Effacer » traduit directement l’image de מחה et garde la force solennelle de l’ordre sans expliciter son moyen d’exécution.
- source_word: זֵכֶר
  choice: le souvenir
  rationale: Le nom peut désigner le souvenir ou la mémoire laissée par Amalec. « Souvenir » est naturel en français tout en préservant l’expression abstraite du texte.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de dessous le ciel
  rationale: La formulation conserve l’image et l’étendue de l’expression hébraïque au lieu de l’aplanir en « de la terre ».
- source_word: לֹא תִּשְׁכָּח
  choice: N’oublie pas
  rationale: L’interdiction brève et sans complément explicite reproduit la force directe ainsi que la tension rhétorique de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre; sa translittération préserve cette distinction sans lui substituer un titre.
- issue: Portée de « effacer le souvenir d’Amalec »
  choice: Conserver l’expression abstraite sans préciser le mode d’accomplissement
  alternative: Expliciter l’anéantissement d’Amalec ou de ses descendants
  rationale: Le verset parle littéralement du זֵכֶר d’Amalec. Une explicitation résoudrait une ambiguïté que cette formulation laisse ouverte et importerait des éléments du contexte dans les mots mêmes du verset.
- issue: Tension entre effacer le souvenir et ne pas oublier
  choice: Maintenir « N’oublie pas » sans complément ajouté
  alternative: N’oublie pas de le faire
  rationale: L’hébreu ne donne aucun complément à l’interdiction finale. Le conserver ainsi respecte sa concision et sa tension avec l’ordre précédent.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier suit les formes hébraïques adressées à Israël comme unité collective. La syntaxe demeure soutenue sans archaïsmes, et la dernière phrase conserve volontairement sa brièveté frappante.
