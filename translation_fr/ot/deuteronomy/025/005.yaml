base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: fr
  text: Si des frères habitent ensemble et que l’un d’eux meure sans avoir de fils[a], la femme du défunt ne doit pas épouser un homme extérieur à la famille[b]. Le frère de son mari s’unira à elle[c], la prendra pour femme et s’acquittera envers elle de son devoir de beau-frère[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit précisément « fils » ; certains comprennent ici, selon la portée juridique de la prescription, « enfant ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la femme du défunt ne sera pas au-dehors pour un homme étranger ». Il s’agit d’un homme extérieur à la famille tenue par cette obligation, non nécessairement d’un étranger par son origine.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ira vers elle », euphémisme hébreu désignant ici l’union sexuelle conjugale.'
    reason: lexical_alternative
  - marker: d
    text: 'Ce devoir est traditionnellement appelé le lévirat : l’obligation du frère du défunt de prendre sa veuve pour femme.'
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: des frères habitent ensemble
  rationale: Le nom désigne ordinairement des frères de sexe masculin, et l’adverbe indique une habitation commune ou une étroite association domestique sans en préciser davantage la forme.
- source_word: וּבֵן אֵין לוֹ
  choice: sans avoir de fils
  rationale: Le texte hébreu dit expressément « fils »; la traduction conserve cette formulation plutôt que de l’élargir silencieusement à « enfant ».
- source_word: אֵשֶׁת הַמֵּת
  choice: la femme du défunt
  rationale: Cette formulation reste proche de la construction hébraïque tout en étant naturelle et digne en français moderne.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: au-dehors avec un homme étranger à la famille
  rationale: « Au-dehors » conserve l’image spatiale du texte, tandis que « étranger à la famille » précise que זָר désigne ici un homme extérieur à l’obligation familiale, non nécessairement un étranger ethnique.
- source_word: יְבָמָהּ
  choice: le frère de son mari
  rationale: Le terme désigne précisément le frère du mari défunt dans cette institution; cette expression évite l’ambiguïté de « beau-frère » en français.
- source_word: יָבֹא עָלֶיהָ
  choice: s’unira à elle
  rationale: L’expression hébraïque est un euphémisme désignant l’union sexuelle; le français choisi en communique le sens avec retenue et dans le cadre matrimonial immédiat.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: la prendra pour femme
  rationale: La tournure est proche de l’hébreu, idiomatique en français et conserve la solennité juridique.
- source_word: וְיִבְּמָהּ
  choice: accomplira envers elle son devoir de beau-frère
  rationale: Le verbe spécialisé exprime l’accomplissement de l’obligation matrimoniale du frère du défunt; une formulation courante évite d’imposer le terme technique « lévirat » dans le texte.
theological_decisions:
- issue: Portée de la condition « sans avoir de fils »
  choice: Conserver « fils » dans le texte principal.
  alternative: Traduire « sans avoir d’enfant » pour exprimer une portée juridique possiblement plus large.
  rationale: בֵּן signifie explicitement « fils ». Le maintien de ce mot préserve l’ambiguïté concernant la portée exacte de la loi au lieu de trancher la question dans la traduction.
- issue: Expression de l’institution du lévirat
  choice: Employer des termes relationnels ordinaires dans le texte principal.
  alternative: Employer « lévir » et « mariage léviratique » ou « lévirat ».
  rationale: Le langage courant rend la prescription compréhensible sans ajouter un jargon technique ni importer une interprétation confessionnelle.
- issue: Sens de « l’homme étranger »
  choice: Comprendre l’altérité comme extérieure à la famille concernée par l’obligation.
  alternative: Traduire comme s’il s’agissait d’un homme d’origine étrangère.
  rationale: Dans ce contexte juridique, le contraste porte sur l’homme extérieur au cercle familial auquel incombe le devoir, et non sur son appartenance ethnique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le caractère juridique de la prescription, tandis que les expressions spécialisées sont rendues en langage courant. « Au-dehors » maintient l’image hébraïque, complétée par une précision contextuelle nécessaire à la compréhension.
