  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: fr
  text: 'S’il y a un litige entre des hommes et qu’ils se présentent devant le tribunal[a], les juges trancheront leur affaire : ils déclareront innocent celui qui est dans son droit et coupable celui qui est en tort[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils s’approchent du jugement », c’est-à-dire qu’ils se présentent pour qu’une décision judiciaire soit rendue.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils déclareront juste le juste et déclareront méchant le méchant ». Dans ce contexte judiciaire, il s’agit de reconnaître que l’un est dans son droit et de déclarer l’autre coupable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: S’il y a
  rationale: Introduit le cas juridique envisagé par la loi. « S’il y a » rend naturellement en français la valeur conditionnelle de la formule casuistique.
- source_word: רִיב
  choice: litige
  rationale: Dans ce cadre judiciaire, le mot désigne un différend porté en justice. « Litige » est précis sans être excessivement technique.
- source_word: בֵּין אֲנָשִׁים
  choice: entre des hommes
  rationale: L’hébreu emploie un pluriel masculin désignant ici les parties au litige; cette formulation conserve cette donnée du texte source.
- source_word: וְנִגְּשׁוּ אֶל הַמִּשְׁפָּט
  choice: et qu’ils se présentent devant le tribunal
  rationale: Le sens contextuel est celui de comparaître dans le cadre d’une procédure judiciaire. « Devant le tribunal » est naturel en français moderne.
- source_word: וּשְׁפָטוּם
  choice: les juges trancheront leur affaire
  rationale: L’hébreu dit littéralement « ils les jugeront » sans exprimer le sujet. Le contexte fournit les juges; « trancher leur affaire » exprime clairement l’adjudication du litige.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: ils déclareront innocent celui qui est dans son droit
  rationale: 'Le hiphil de צדק possède ici une valeur judiciaire: reconnaître ou déclarer qu’une partie a gain de cause, et non lui conférer une qualité morale.'
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: et coupable celui qui est en tort
  rationale: Le hiphil de רשע signifie ici prononcer la culpabilité. La formulation maintient le parallélisme judiciaire avec la partie reconnue dans son droit.
theological_decisions:
- issue: Valeur judiciaire ou morale de צדק et רשע
  choice: 'Des verdicts judiciaires: déclarer innocent celui qui est dans son droit et coupable celui qui est en tort'
  alternative: Décrire simplement l’un comme juste et l’autre comme méchant
  rationale: Le contexte immédiat est celui d’un litige soumis au jugement. Les termes portent donc sur la situation des parties dans l’affaire jugée, sans nier ni présupposer une appréciation globale de leur caractère moral.
translation_notes:
  register: Français international moderne, clair et digne. Le registre juridique reste accessible. La répétition hébraïque fondée sur « juste/méchant » est explicitée dans la note afin de préserver à la fois le sens judiciaire en contexte et la forme lexicale du texte source.
