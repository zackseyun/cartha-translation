  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: fr
  text: souviens-toi comment il t’a rencontré sur la route et a attaqué par-derrière tous ceux qui faiblissaient derrière toi, alors que tu étais fatigué et épuisé; il ne craignait pas Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: t’a surpris
  rationale: Le verbe peut évoquer le fait de rencontrer ou de survenir. Dans ce contexte hostile, « surpris » exprime naturellement l’idée d’une rencontre soudaine, sans surdéterminer le mode précis de l’attaque.
- source_word: וַיְזַנֵּב
  choice: a attaqué par-derrière
  rationale: Le verbe, dérivé de l’idée de « queue », décrit une action dirigée contre l’arrière du groupe. Cette formulation conserve l’image tactique sans affirmer explicitement que tous furent abattus.
- source_word: הַנֶּחֱשָׁלִים
  choice: ceux qui, épuisés, restaient à la traîne
  rationale: Le terme désigne ceux qui faiblissaient ou étaient affaiblis. La proposition relative rend ce sens clairement et s’accorde avec « fatigué et épuisé » appliqué collectivement à Israël.
- source_word: עָיֵף וְיָגֵעַ
  choice: épuisés
  rationale: Le doublet exprime une fatigue extrême. Un seul terme français fort évite une lourdeur tout en maintenant l’intensité; le pluriel explicite la valeur collective du singulier hébreu.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: sans craindre Dieu
  rationale: Rend directement l’absence de crainte de Dieu et rattache naturellement cette caractérisation au sujet amalécite.
theological_decisions:
- issue: Sujet de « ne craignait pas Dieu »
  choice: La proposition « sans craindre Dieu » se rapporte à Amalec.
  alternative: La comprendre comme une description d’Israël.
  rationale: Le sujet grammatical implicite demeure celui des verbes précédents, c’est-à-dire Amalec; aucune marque explicite n’impose un changement de sujet.
- issue: Portée de l’attaque
  choice: « a attaqué par-derrière »
  alternative: « a abattu » ou « a exterminé »
  rationale: Le verbe indique une attaque contre l’arrière-garde, mais le verset ne précise pas à lui seul que toutes les victimes ont été tuées.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase poursuit l’impératif « souviens-toi » du verset 17 afin que ce fragment soit lisible dans son contexte immédiat. Le singulier collectif hébreu « tu étais fatigué et épuisé » est intégré à la description plurielle des retardataires, conformément au sens contextuel, sans ajouter de précision doctrinale.
