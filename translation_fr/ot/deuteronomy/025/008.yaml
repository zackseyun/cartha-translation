  source_fidelity: 'Le texte rend fidèlement la séquence juridique hébraïque : les anciens de sa ville convoquent l’homme, lui parlent, puis son maintien du refus est exprimé avant sa déclaration. « Convoquer » convient à l’appel officiel de וְקָרְאוּ לוֹ. « S’il persiste » rend de manière idiomatique et contextuellement justifiée וְעָמַד, sans faire de la posture physique le sens principal. « Prendre pour femme » transmet correctement l’idiome matrimonial de לְקַחְתָּהּ.'
