  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: fr
  text: 'Alors les anciens de sa ville le convoqueront et lui parleront. S’il persiste et dit : « Je ne veux pas la prendre pour femme »,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָרְאוּ לוֹ
  choice: le convoqueront
  rationale: Dans cette procédure juridique, le verbe désigne un appel officiel à comparaître; « convoquer » exprime naturellement cette valeur en français moderne.
- source_word: זִקְנֵי עִירוֹ
  choice: les anciens de sa ville
  rationale: « Anciens » désigne les responsables civiques reconnus, et « ville » rend directement עִיר dans ce contexte.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: et lui parleront
  rationale: La construction indique une parole directement adressée à l’homme, sans préciser davantage le contenu de l’entretien.
- source_word: וְעָמַד
  choice: S’il persiste
  rationale: Littéralement « et il se tient »; dans cette procédure, l’expression indique vraisemblablement qu’il maintient sa position après l’intervention des anciens. « Persiste » rend ce sens contextuel sans reproduire une image obscure en français.
- source_word: לֹא חָפַצְתִּי
  choice: Je ne veux pas
  rationale: חפץ exprime ici le désir ou la volonté. « Je ne veux pas » est naturel, direct et adapté à une déclaration juridique orale.
- source_word: לְקַחְתָּהּ
  choice: la prendre pour femme
  rationale: Lorsqu’il a une femme pour objet, לקח est un idiome courant signifiant la prendre en mariage. « Prendre pour femme » conserve l’image hébraïque tout en explicitant son sens matrimonial.
theological_decisions:
- issue: Portée de וְעָמַד dans la procédure
  choice: S’il persiste
  alternative: et s’il reste là / et il se tient debout
  rationale: Le contexte suggère le maintien du refus plutôt qu’une simple posture physique; cette formulation conserve toutefois la séquence conditionnelle sans ajouter de motif à son refus.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur rend la prescription légale. La ponctuation sépare clairement la convocation et la réponse persistante; aucune note n’est nécessaire puisque « prendre pour femme » communique directement l’idiome matrimonial.
