  yaml_path: translation/ot/deuteronomy/025/012.yaml
  text: you shall cut off her hand[b][a]; your eye shall not pity.
translation:
  language: fr
  text: Tu lui couperas la main[a]. Tu ne la regarderas pas avec pitié[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la paume ». Le mot hébreu peut désigner précisément la paume, mais « la main » est plus naturel ici en français.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ton œil ne sera pas compatissant » ou « ton œil ne l’épargnera pas ». L’hébreu emploie l’œil pour exprimer l’absence de pitié ou de compassion.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: tu lui couperas
  rationale: Le verbe קצץ exprime ici l’action de trancher ou couper. Avec « la main », cette formulation française rend directement la sanction sans l’atténuer.
- source_word: אֶת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: Le marqueur hébreu de l’objet direct n’a pas d’équivalent lexical en français.
- source_word: כַּפָּהּ
  choice: la main
  rationale: כַּף peut désigner la paume ou, par extension, la main. « La main » est ici l’expression française la plus naturelle avec le verbe « couper ».
- source_word: לֹא
  choice: sans
  rationale: La négation est rendue idiomatiquement dans la proposition nominale française « sera sans pitié ».
- source_word: תָחוֹס
  choice: sera sans pitié
  rationale: חוס signifie éprouver de la pitié, épargner ou avoir compassion. Cette tournure conserve la notion de pitié tout en formant avec « ton œil » une phrase française naturelle et solennelle.
- source_word: עֵינֶךָ
  choice: ton œil
  rationale: Le maintien de l’image littérale de l’œil préserve la formule juridique frappante et récurrente du Deutéronome.
theological_decisions:
- issue: Littéralité de la formule pénale
  choice: Conserver la sanction concrète « tu lui couperas la main » et l’image « ton œil sera sans pitié ».
  alternative: 'Traduire plus librement : « coupe-lui la main sans lui faire grâce » ou « tu ne lui témoigneras aucune compassion ».'
  rationale: Le texte formule directement une sanction relevant du droit d’Israël. La traduction conserve sa sévérité ainsi que son image juridique, sans l’atténuer ni l’interpréter selon une doctrine particulière.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu et à l’adresse juridique au membre du peuple. L’ordre des notes suit l’emplacement de leurs marqueurs dans le texte.
