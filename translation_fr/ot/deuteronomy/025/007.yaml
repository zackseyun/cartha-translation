  text: וְ/אִם לֹ֤א יַחְפֹּץ֙ הָ/אִ֔ישׁ לָ/קַ֖חַת אֶת יְבִמְתּ֑/וֹ וְ/עָלְתָה֩ יְבִמְתּ֨/וֹ הַ/שַּׁ֜עְרָ/ה אֶל הַ/זְּקֵנִ֗ים וְ/אָֽמְרָה֙ מֵאֵ֨ין יְבָמִ֜/י לְ/הָקִ֨ים לְ/אָחִ֥י/ו שֵׁם֙ בְּ/יִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: fr
  text: 'Mais si l’homme ne veut pas épouser la veuve de son frère, celle-ci montera à la porte, auprès des anciens, et dira : « Mon beau-frère refuse de faire subsister le nom de son frère en Israël[a] ; il ne veut pas remplir envers moi son devoir de beau-frère[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « relever un nom pour son frère en Israël ». L’expression évoque la préservation de la lignée, de la mémoire et de la place familiale du frère décédé.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici un verbe technique formé sur le mot « beau-frère » : il désigne l’accomplissement du devoir consistant à épouser la veuve d’un frère décédé.'
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: ne veut pas
  rationale: Le verbe exprime ici le désir ou la volonté. « Ne veut pas » est naturel en français moderne et conserve la force volontaire de la décision.
- source_word: לָקַחַת אֶת יְבִמְתּוֹ
  choice: épouser la veuve de son frère
  rationale: Pris isolément, לָקַחַת signifie « prendre », mais avec יְבִמְתּוֹ dans ce cadre juridique, il s’agit de prendre pour femme la veuve de son frère. « Épouser » rend clairement ce sens matrimonial sans employer un calque peu naturel.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: montera à la porte
  rationale: La traduction conserve le mouvement exprimé par « monter » et la porte comme lieu public où les anciens rendent leurs décisions, sans ajouter « de la ville », absent du texte hébreu.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Terme courant pour les autorités locales reconnues qui siègent à la porte.
- source_word: מֵאֵין
  choice: refuse
  rationale: Dans cette plainte officielle, le terme exprime un refus ou une absence de volonté ; « refuse » en restitue nettement la force.
- source_word: לְהָקִים ... שֵׁם
  choice: faire subsister le nom
  rationale: Cette formulation française conserve l’image du nom que l’on maintient ou fait subsister, tout en restant intelligible. Elle évite de réduire explicitement l’expression à la seule descendance.
- source_word: לֹא אָבָה
  choice: il ne veut pas
  rationale: Le verbe אָבָה porte sur le consentement ou la volonté. La formulation distingue naturellement cette déclaration du premier « refuse » tout en maintenant le parallélisme de la plainte.
- source_word: יַבְּמִי
  choice: remplir envers moi son devoir de beau-frère
  rationale: Ce verbe technique désigne l’accomplissement du devoir matrimonial du frère du défunt. La périphrase rend ce sens accessible sans introduire le jargon spécialisé « lévirat » dans le corps du texte.
theological_decisions:
- issue: Expression de l’obligation liée au mariage avec la veuve du frère
  choice: 'Employer des termes relationnels explicites : « veuve de son frère », « beau-frère » et « devoir de beau-frère ».'
  alternative: Employer directement les termes techniques « lévirat » ou « mariage léviratique ».
  rationale: Le passage formule une règle juridique et familiale. Le choix retenu communique l’institution sans supposer que le lecteur connaît le vocabulaire spécialisé et sans ajouter une interprétation confessionnelle.
- issue: Portée de l’expression « faire subsister le nom »
  choice: Conserver l’image du nom dans le texte et en expliquer la portée en note.
  alternative: Traduire directement par « assurer une descendance à son frère » ou « perpétuer sa lignée ».
  rationale: L’hébreu parle du « nom », notion qui peut inclure la lignée, la mémoire et la place familiale du défunt. Une formulation plus explicative dans le corps du texte risquerait d’en réduire la portée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique demeure solennelle sans archaïsme. « Épouser » clarifie le sens contextuel de « prendre », tandis que « faire subsister le nom » préserve l’image et l’étendue sémantique de l’hébreu.
