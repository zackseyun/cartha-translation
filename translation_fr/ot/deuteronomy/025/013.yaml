lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Tu n’auras pas
  rationale: La tournure hébraïque signifie littéralement « il n’y aura pas pour toi »; en français juridique naturel, « tu n’auras pas » conserve clairement la force de l’interdiction.
- source_word: בְּכִיסְךָ
  choice: dans ton sac
  rationale: כִּיס désigne ici le sac ou la bourse où un marchand gardait ses poids. « Sac » est simple, actuel et adapté au contexte.
- source_word: אֶבֶן וָאָבֶן
  choice: deux poids différents
  rationale: Littéralement « une pierre et une pierre »; les pierres servaient de poids commerciaux. La formulation explicite le référent tout en conservant l’idée d’une paire non équivalente.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: un lourd et un léger
  rationale: Dans le contexte de poids de balance, le contraste porte sur leur masse plutôt que sur leur taille physique. Cette formulation française rend naturellement la fraude visée.
