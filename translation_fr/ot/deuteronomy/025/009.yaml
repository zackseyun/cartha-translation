  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: fr
  text: 'Alors la veuve de son frère s’approchera de lui sous les yeux des anciens, lui retirera sa sandale, lui crachera au visage[a], puis prendra la parole et dira : « Voilà ce qu’on fera à l’homme qui ne bâtira pas la maison de son frère[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « crachera devant lui ». Certains comprennent l’hébreu comme indiquant qu’elle crache devant l’homme plutôt que directement sur son visage.'
    reason: lexical_alternative
  - marker: b
    text: « Bâtir la maison de son frère » signifie ici assurer la continuité de sa lignée et de sa famille par le mariage léviratique.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: la veuve de son frère
  rationale: Dans ce contexte de lévirat, le terme désigne précisément la veuve du frère décédé. Cette formulation est plus explicite que « sa belle-sœur ».
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: sous les yeux des anciens
  rationale: Cette expression rend l’image hébraïque et souligne que l’acte est public et attesté par les anciens.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: lui retirera sa sandale
  rationale: Le verbe חָלַץ désigne ici le retrait d’une chaussure. Le singulier « sandale » correspond au texte hébreu; la mention du pied, évidente en français, n’a pas besoin d’être répétée.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: lui crachera au visage
  rationale: C’est le sens direct et naturel de l’expression hébraïque dans ce rite public d’humiliation. L’autre lecture possible est signalée en note.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: prendra la parole et dira
  rationale: Cette tournure française naturelle rend les deux verbes de la formule hébraïque sans produire le calque peu idiomatique « répondra et dira ».
- source_word: כָּכָה יֵעָשֶׂה
  choice: Voilà ce qu’on fera
  rationale: La formulation conserve la force démonstrative et déclarative de la formule tout en étant actuelle et naturelle en français.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: qui ne bâtit pas la maison de son frère
  rationale: La traduction garde la métaphore hébraïque de la construction de la maison; une note en explique la portée familiale dans le contexte du lévirat.
theological_decisions:
- issue: Faut-il atténuer l’expression בְּפָנָיו décrivant le crachat ?
  choice: lui crachera au visage
  alternative: crachera devant lui
  rationale: Le texte principal suit le sens le plus direct de l’hébreu, sans atténuer le caractère humiliant du rite. La variante interprétative est conservée en note afin de ne pas masquer l’ambiguïté reconnue.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme juridique du passage est conservé, tandis que les hébraïsmes inutilement raides sont rendus de façon idiomatique.
