source:
  edition: WLC
  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: fr
  text: Tu auras un poids[a] complet et juste, et un épha[b] complet et juste, afin que tes jours se prolongent sur la terre que Yahweh, ton Dieu, te donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pierre »; il s’agit d’une pierre utilisée comme poids dans le commerce.'
    reason: Précision lexicale et conservation de l’image concrète hébraïque.
  - marker: b
    text: L’épha était une ancienne unité de capacité utilisée pour mesurer les matières sèches.
    reason: Explication d’une unité de mesure ancienne peu familière au lecteur moderne.
lexical_decisions:
- source_word: אֶבֶן
  choice: poids
  rationale: Le mot signifie littéralement « pierre », mais désigne ici une pierre servant de poids dans les échanges commerciaux. « Poids » exprime clairement sa fonction, tandis qu’une note conserve l’image concrète.
- source_word: שְׁלֵמָה
  choice: complet
  rationale: L’adjectif exprime l’intégrité ou la totalité. Appliqué à un poids ou à une mesure, « complet » indique qu’il n’est ni réduit ni falsifié, sans confondre ce terme avec צֶדֶק.
- source_word: וָצֶדֶק
  choice: et juste
  rationale: Dans ce contexte commercial, צֶדֶק qualifie ce qui est conforme au droit et à l’équité. « Juste » garde la portée morale du terme.
- source_word: יִהְיֶה לָּךְ
  choice: tu auras
  rationale: La tournure littérale « sera pour toi » fonctionne ici comme une prescription légale. « Tu auras » en restitue naturellement la force.
- source_word: אֵיפָה
  choice: épha
  rationale: L’épha est une unité précise de capacité pour les matières sèches. La translittération préserve la référence à cette unité ancienne; une note en donne le sens.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette conjonction introduit ici le but ou le résultat associé à l’obéissance.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: tes jours se prolongent
  rationale: Cette formulation conserve l’image hébraïque des jours qui s’allongent tout en restant claire en français moderne.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: Dans le Deutéronome, אֲדָמָה renvoie ici à la terre accordée par Dieu. « Sur la terre » respecte la préposition עַל et le cadre territorial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu.
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le participe présente le don de la terre comme une action actuelle ou caractéristique. Le présent français convient à cette valeur sans imposer un futur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le distingue du titre אֲדֹנָי et évite de remplacer le nom par un titre.
- issue: Lien entre l’obéissance et la longévité dans le pays
  choice: afin que tes jours se prolongent
  alternative: et tu vivras longtemps
  rationale: La formulation retenue préserve le rapport de but ou de résultat introduit par לְמַעַן sans préciser davantage que le texte la nature théologique de ce rapport.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme interlocuteur collectif. La répétition « complet et juste » conserve le parallélisme et distingue l’intégrité de la mesure de sa conformité à la justice.
