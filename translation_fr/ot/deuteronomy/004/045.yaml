base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: fr
  text: Voici les prescriptions, les décrets et les règles que Moïse exposa aux Israélites à leur sortie d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français la série de catégories juridiques et rend la valeur déictique de l’hébreu.
- source_word: הָעֵדֹת
  choice: les prescriptions
  rationale: Dans ce contexte d’alliance et de législation, עֵדֹת désigne des stipulations normatives. « Prescriptions » est intelligible et évite le sens surtout testimonial que « témoignages » aurait en français courant.
- source_word: הַחֻקִּים
  choice: les décrets
  rationale: Rend la notion de dispositions fixées ou établies et maintient une distinction avec les deux autres catégories juridiques.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles
  rationale: Exprime ici des normes ou décisions de droit. « Règles » est naturel en français moderne, tout en conservant la portée juridique du terme.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: que Moïse exposa
  rationale: Le verbe דבר signifie littéralement « parler »; avec des lois comme complément, « exposer » donne en français une formulation naturelle sans ajouter l’idée plus forte d’une promulgation.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Équivalent collectif idiomatique de l’expression littérale « fils d’Israël »; il désigne ici l’ensemble du peuple et n’exclut pas les femmes.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: à leur sortie d’Égypte
  rationale: Rend avec concision la construction temporelle formée par la préposition ב, l’infinitif construit et le suffixe pluriel.
