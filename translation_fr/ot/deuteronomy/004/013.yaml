  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: fr
  text: 'Il vous a fait connaître son alliance, qu’il vous a ordonné de mettre en pratique : les Dix Paroles[a]. Et il les a écrites sur deux tables de pierre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « les Dix Commandements ».'
    reason: Signaler l’appellation française traditionnelle tout en maintenant dans le texte principal le sens littéral de l’hébreu.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Il vous a fait connaître
  rationale: Le hifil de נגד signifie « faire connaître, annoncer, déclarer ». « Faire connaître » restitue directement cette valeur causative dans un français naturel et digne.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: « Alliance » est le terme français établi pour בְּרִית et en conserve la portée relationnelle et contraignante.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: qu’il vous a ordonné de mettre en pratique
  rationale: לַעֲשׂוֹת signifie littéralement « faire ». En français, « mettre en pratique » exprime naturellement l’exécution requise sans réduire l’alliance à une simple observance extérieure.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: les Dix Paroles
  rationale: L’expression hébraïque signifie littéralement « les dix paroles ». Cette formulation conserve la désignation propre au texte plutôt que de lui substituer l’appellation traditionnelle « les Dix Commandements ».
- source_word: וַיִּכְתְּבֵם
  choice: Et il les a écrites
  rationale: כתב est le verbe courant « écrire ». Le pronom féminin pluriel reprend naturellement « les Dix Paroles » en français.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: deux tables de pierre
  rationale: La construction désigne deux plaques faites de pierre. « Tables de pierre » est clair, digne et traditionnel en français, sans ajouter l’idée plus spécialisée de gravure.
theological_decisions:
- issue: Rendu de עֲשֶׂרֶת הַדְּבָרִים
  choice: les Dix Paroles
  alternative: les Dix Commandements
  rationale: Le texte source appelle ces stipulations « les Dix Paroles ». Le choix principal suit donc l’hébreu, tandis que l’appellation traditionnelle et familière est signalée en note.
- issue: Relation entre « son alliance » et « les Dix Paroles »
  choice: deux-points marquant l’apposition explicative
  alternative: simple virgule
  rationale: L’hébreu place « les Dix Paroles » en apposition à ce que Dieu ordonne de mettre en pratique. Les deux-points rendent cette relation clairement en français sans décider au-delà de la syntaxe du texte.
translation_notes:
  register: Français international moderne, naturel et soutenu. « Faire connaître », « mettre en pratique » et « tables de pierre » évitent à la fois l’archaïsme et la banalité. La majuscule à « Dix Paroles » présente l’expression comme la désignation reconnue de cet ensemble précis.
