source:
  edition: WLC
  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: fr
  text: 'Car Yahvé, ton Dieu, est un Dieu compatissant[a] : il ne t’abandonnera pas[b], ne te détruira pas et n’oubliera pas l’alliance de tes pères[c], qu’il leur a jurée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un Dieu miséricordieux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il ne te délaissera pas ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’alliance de tes ancêtres ». L’hébreu dit « tes pères » et renvoie aux pères d’Israël liés à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’exhortation précédente et conserve clairement la valeur explicative de la conjonction.
- source_word: אֵל רַחוּם
  choice: un Dieu compatissant
  rationale: רַחוּם exprime la compassion et la miséricorde. « Compatissant » est naturel en français moderne et maintient l’idée de tendresse divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre. « Yahvé » est la forme française courante du tétragramme.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Conserve l’adresse personnelle au singulier et la relation d’alliance exprimée par le suffixe hébreu.
- source_word: לֹא יַרְפְּךָ
  choice: il ne t’abandonnera pas
  rationale: Le hiphil de רפה peut signifier laisser aller, délaisser ou abandonner. « Abandonner » rend clairement la promesse dans un français actuel.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: ne te détruira pas
  rationale: Le hiphil de שׁחת exprime ici directement la destruction; ce choix convient au contexte des avertissements liés à l’alliance.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: n’oubliera pas l’alliance
  rationale: Préserve l’image théologiquement importante de Dieu qui n’oublie pas son alliance, sans l’atténuer en « négliger ».
- source_word: אֲבֹתֶיךָ
  choice: de tes pères
  rationale: Maintient la formulation masculine et la référence historique aux pères d’Israël liés à l’alliance, tout en laissant une note signaler l’équivalent plus général.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: qu’il leur a jurée
  rationale: Conserve le vocabulaire solennel du serment. Le pronom relatif reprend naturellement « l’alliance » en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte le nom personnel divin. Sa transcription française préserve ce nom au lieu de lui substituer un titre.
- issue: Portée de אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: « Tes pères » conserve la forme masculine et la spécificité historique des pères de l’alliance; « tes ancêtres » demeure une possibilité idiomatique, indiquée en note.
- issue: Relation entre l’alliance, les pères et le serment
  choice: l’alliance de tes pères, qu’il leur a jurée
  alternative: l’alliance conclue avec tes ancêtres
  rationale: La formulation retenue suit de près la syntaxe hébraïque et préserve son expression condensée sans ajouter explicitement le verbe « conclure ».
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à Israël. La coordination a été légèrement allégée après le premier verbe pour produire une phrase française fluide sans modifier la triple négation.
