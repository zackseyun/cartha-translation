revisions:
- from: Du ciel, il t’a fait entendre sa voix pour te former[a] ; sur la terre, il t’a montré son grand feu, et tu as entendu ses paroles du milieu du feu.
  to: Du ciel, il t’a fait entendre sa voix pour te discipliner[a] ; et sur la terre, il t’a montré son grand feu, et tu as entendu ses paroles du milieu du feu.
  rationale: La révision remplace « former » par « discipliner » afin de mieux refléter la portée corrective et formative de יסר, tout en conservant les autres nuances dans la note. Elle rétablit aussi la coordination explicite entre la révélation depuis le ciel et celle sur la terre. Le reste de la formulation est fidèle et naturel.
