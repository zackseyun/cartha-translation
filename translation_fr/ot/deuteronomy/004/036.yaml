source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: fr
  text: Du ciel, il t’a fait entendre sa voix pour te discipliner[a] ; et sur la terre, il t’a montré son grand feu, et tu as entendu ses paroles du milieu du feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour te former », « pour t’instruire » ou « pour te corriger » ; le verbe hébreu peut désigner une discipline qui comporte instruction et correction.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: Du ciel
  rationale: Cette tournure naturelle rend l’origine céleste de la voix et conserve le contraste spatial avec « sur la terre ».
- source_word: הִשְׁמִיעֲךָ
  choice: il t’a fait entendre
  rationale: Le factitif hébreu est conservé explicitement dans un français courant.
- source_word: קֹלוֹ
  choice: sa voix
  rationale: Dans ce contexte de parole divine audible, « voix » est l’équivalent naturel de קוֹל.
- source_word: לְיַסְּרֶךָּ
  choice: pour te former
  rationale: Le verbe יסר associe instruction, correction et discipline. « Former » exprime clairement la visée pédagogique sans réduire le sens à un châtiment, tandis que la note maintient l’éventail sémantique.
- source_word: וְעַל הָאָרֶץ
  choice: sur la terre
  rationale: La formulation conserve le contraste cosmique entre le ciel et la terre plutôt que de comprendre ici « le pays ».
- source_word: הֶרְאֲךָ
  choice: il t’a montré
  rationale: « Montrer » rend idiomatiquement en français la forme causative du verbe voir.
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: son grand feu
  rationale: La traduction directe préserve l’image concrète et l’adjectif du texte hébreu.
- source_word: וּדְבָרָיו
  choice: ses paroles
  rationale: « Paroles » conserve le pluriel hébreu et convient au discours articulé entendu par Israël.
- source_word: שָׁמַעְתָּ
  choice: tu as entendu
  rationale: Le verbe désigne ici l’audition effective des paroles, sans qu’il soit nécessaire d’ajouter l’idée d’obéissance.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: Cette expression restitue la valeur de מִתּוֹךְ et garde la solennité de l’image tout en restant naturelle en français.
theological_decisions:
- issue: Portée pédagogique de לְיַסְּרֶךָּ
  choice: pour te former
  alternative: pour te discipliner ; pour t’instruire ; pour te corriger
  rationale: Le contexte présente la révélation divine comme formatrice. Le choix français évite de limiter le verbe soit à l’enseignement intellectuel, soit à la punition, et la note explicite sa tension entre instruction et correction.
- issue: Maintien du langage concret de la révélation divine
  choice: sa voix… son grand feu… ses paroles
  alternative: une reformulation abstraite de la manifestation divine
  rationale: Le texte hébreu décrit la révélation par des termes concrets. Les conserver évite d’atténuer ou d’interpréter davantage son affirmation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme unité collective. Le parallélisme « Du ciel… sur la terre » et la répétition de « feu » sont conservés.
