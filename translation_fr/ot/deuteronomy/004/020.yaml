  rationale: La révision conserve l’image théologique et lexicale de l’héritage tout en allégeant la syntaxe française. Elle corrige surtout la note afin que son énoncé littéral reflète tous les éléments pertinents de l’hébreu, notamment לו (« pour lui »).
