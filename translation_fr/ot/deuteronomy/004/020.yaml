  text: וְ/אֶתְ/כֶם֙ לָקַ֣ח יְהוָ֔ה וַ/יּוֹצִ֥א אֶתְ/כֶ֛ם מִ/כּ֥וּר הַ/בַּרְזֶ֖ל מִ/מִּצְרָ֑יִם לִ/הְי֥וֹת ל֛/וֹ לְ/עַ֥ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: fr
  text: Mais vous, Yahweh vous a pris et vous a fait sortir de la fournaise où l’on fond le fer, de l’Égypte, afin que vous soyez pour lui son peuple en héritage[a], comme vous l’êtes aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un peuple qui lui appartienne en propre ». L’hébreu dit littéralement « pour lui, un peuple d’héritage ».
    reason: Précise l’expression hébraïque dense, y compris « pour lui », et signale une autre traduction naturelle qui explicite l’idée d’appartenance.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et préserve sa portée d’alliance, conformément à l’usage du projet.
- source_word: לָקַח
  choice: a pris
  rationale: Conserve le sens verbal direct de « prendre »; le contexte suggère aussi le choix et l’appropriation d’Israël sans qu’il soit nécessaire de les expliciter dans le texte.
- source_word: וַיּוֹצִא
  choice: a fait sortir
  rationale: Rend naturellement en français la forme causative du verbe dans le contexte de l’exode.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: de la fournaise où l’on fond le fer
  rationale: Préserve l’image de la fournaise tout en évitant que « fournaise de fer » soit comprise comme une fournaise fabriquée en fer.
- source_word: מִמִּצְרָיִם
  choice: de l’Égypte
  rationale: La répétition de « de » maintient l’apposition explicative qui identifie l’Égypte à la fournaise.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: afin que vous soyez pour lui un peuple qui soit son héritage
  rationale: Conserve à la fois « pour lui » et l’image forte de l’héritage, dans une syntaxe française compréhensible.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme vous l’êtes aujourd’hui
  rationale: Exprime naturellement que la condition décrite demeure une réalité observable au moment du discours.
theological_decisions:
- issue: Le rapport d’alliance et d’appartenance exprimé par לְעַם נַחֲלָה
  choice: un peuple qui soit son héritage
  alternative: un peuple qui lui appartienne en propre
  rationale: 'Le choix principal garde l’image biblique de l’héritage et sa tension: le peuple est présenté comme l’héritage de Yahweh. L’alternative explicite davantage l’idée de possession, mais efface cette métaphore.'
translation_notes:
  register: Français international moderne, digne et accessible. La mise en relief initiale « Mais vous » reproduit l’accent porté sur les destinataires. Le redoublement « vous, Yahweh vous » est idiomatique en français et conserve cette emphase.
