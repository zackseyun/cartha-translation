    reason: Précise l’expression hébraïque dense, y compris « pour lui », et signale une autre traduction naturelle qui explicite l’idée d’appartenance.
  revision_rationale: La révision conserve l’image théologique et lexicale de l’héritage tout en allégeant la syntaxe française. Elle corrige surtout la note afin que son énoncé littéral reflète tous les éléments pertinents de l’hébreu, notamment לו (« pour lui »).
