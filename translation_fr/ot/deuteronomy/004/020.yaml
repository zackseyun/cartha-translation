review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’ensemble est fidèlement rendu : Yahweh prend Israël, le fait sortir d’Égypte, image de la fournaise pour fondre le fer, afin qu’il soit son peuple d’héritage. La note, toutefois, donne comme littérale une expression incomplète : elle doit aussi rendre לו (« pour lui »).'
  naturalness: Le français est globalement clair et de registre biblique moderne. « Un peuple qui soit son héritage » est recevable, mais « son peuple en héritage » exprime plus directement et plus naturellement la relation dense du texte sans la réduire à la seule idée de propriété.
  terminology: « Yahweh » est cohérent avec le choix du projet. « Fournaise où l’on fond le fer » évite utilement l’ambiguïté de « fournaise de fer ». Le vocabulaire d’« héritage » est conservé dans le texte et explicité par une alternative dans la note.
  issues:
  - severity: low
    issue: La formulation littérale de la note omet « pour lui ».
    rationale: L’hébreu לִהְיוֹת לוֹ לְעַם נַחֲלָה comprend explicitement לו, « pour lui ». Une note qui se présente comme littérale doit conserver cet élément.
  - severity: low
    issue: « Un peuple qui soit son héritage » est un peu lourd.
    rationale: La formulation « son peuple en héritage » maintient l’image d’héritage et produit une construction française plus directe, sans imposer une interprétation confessionnelle.
  revised_text: Mais vous, Yahweh vous a pris et vous a fait sortir de la fournaise où l’on fond le fer, de l’Égypte, afin que vous soyez pour lui son peuple en héritage[a], comme vous l’êtes aujourd’hui.
  revised_footnotes:
