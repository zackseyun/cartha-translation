source:
  edition: WLC
  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: fr
  text: Vous n’ajouterez rien à la parole que je vous prescris et vous n’en retrancherez rien, afin de garder les commandements de Yahweh[a], votre Dieu, que je vous prescris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre forme : « Yahvé ».'
    reason: Signaler le tétragramme hébreu et les principales conventions françaises de rendu du nom divin.
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: ajouterez à
  rationale: Le hifil de יסף avec עַל signifie ici « ajouter à ». La tournure française est naturelle et conserve l’idée d’un ajout au contenu prescrit.
- source_word: הַדָּבָר
  choice: la parole
  rationale: דבר peut désigner une parole, une chose ou une affaire. Ici, « la parole » préserve le singulier hébreu et présente l’enseignement prescrit comme un tout.
- source_word: מְצַוֶּה
  choice: prescris
  rationale: Le participe situe l’acte de prescrire dans la prise de parole présente. « Je vous prescris » convient au contexte légal et reste idiomatique en français.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: vous n’en retrancherez rien
  rationale: גרע signifie diminuer ou retrancher. Cette formulation française forme un parallèle clair avec « n’ajouterez rien » et explicite naturellement le complément implicite.
- source_word: לִשְׁמֹר
  choice: afin de garder
  rationale: L’infinitif précédé de ל exprime ici le but, éventuellement avec une nuance de résultat. « Afin de garder » maintient ce lien sans le préciser excessivement.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: « Commandements » est le terme français courant et solennel pour מצות dans un contexte d’alliance et de loi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » rend le nom divin personnel indiqué par le tétragramme, tandis qu’une note signale la convention traditionnelle.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans la formule d’alliance associée à YHWH, אֱלֹהִים a un référent singulier ; « votre Dieu » le rend correctement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin YHWH. « Yahweh » le représente comme nom propre sans substituer un titre ; la note informe le lecteur de l’usage traditionnel.
- issue: Portée de לִשְׁמֹר
  choice: afin de garder
  alternative: pour que vous gardiez / en gardant
  rationale: La construction peut exprimer le but ou le résultat. « Afin de garder » conserve la relation finale la plus probable sans introduire une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient au discours légal. Le parallélisme « n’ajouterez rien / n’en retrancherez rien » reproduit nettement l’opposition hébraïque, et la répétition de « je vous prescris » est conservée.
