  - severity: low
    issue: « Oui » pour רַק est possible mais moins naturel dans cette exclamation solennelle.
    rationale: Dans ce contexte, « Assurément » rend plus naturellement la force emphatique probable de רַק, tout en laissant la lecture restrictive « seulement » dans la note.
