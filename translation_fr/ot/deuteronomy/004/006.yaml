  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: fr
  text: 'Vous les observerez et les mettrez en pratique, car ce sera là votre sagesse et votre intelligence aux yeux des peuples. Lorsqu’ils entendront tous ces décrets[b], ils diront : « Assurément[a], cette grande nation est un peuple sage et intelligent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Seule cette grande nation est un peuple sage et intelligent. » Le mot hébreu רַק signifie souvent « seulement », mais il peut avoir ici une valeur emphatique : « assurément », « vraiment ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « décrets » peut aussi être rendu par « prescriptions » ou « ordonnances ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  choice: Vous les observerez donc et vous les mettrez en pratique
  rationale: Dans ce contexte juridique et d’alliance, שׁמר exprime l’observance fidèle, tandis que עשה souligne l’exécution concrète. La paire française maintient cette distinction avec naturel.
- source_word: כִּי הִוא
  choice: car ce sera là
  rationale: Le pronom féminin singulier reprend collectivement l’observance et la mise en pratique évoquées. « Ce sera là » rend ce renvoi global dans un français idiomatique.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: votre sagesse et votre intelligence
  rationale: « Sagesse » et « intelligence » conservent les deux notions apparentées mais distinctes, ainsi que leur reprise adjectivale en fin de verset.
- source_word: לְעֵינֵי הָעַמִּים
  choice: aux yeux des peuples
  rationale: Cette formulation proche de l’hébreu est naturelle en français et souligne le caractère public et observable de cette sagesse.
- source_word: אֲשֶׁר יִשְׁמְעוּן
  choice: Lorsqu’ils entendront parler de
  rationale: Le relatif hébreu peut être rendu naturellement par une proposition temporelle. « Entendre parler de » convient à des prescriptions portées à la connaissance des peuples sans suggérer nécessairement leur proclamation directe.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: tous ces décrets
  rationale: חֻקִּים est un terme juridique désignant des prescriptions établies. « Décrets » en conserve la force légale, tandis qu’une note signale d’autres équivalents possibles.
- source_word: רַק
  choice: Oui
  rationale: Dans cette exclamation, רַק a vraisemblablement une valeur emphatique plutôt que restrictive. « Oui » exprime cette affirmation avec naturel tout en laissant l’alternative littérale en note.
- source_word: עַם חָכָם וְנָבוֹן
  choice: un peuple sage et intelligent
  rationale: Cette formulation fait écho à « sagesse » et « intelligence » plus haut et préserve la caractérisation collective du peuple.
- source_word: הַגּוֹי הַגָּדוֹל הַזֶּה
  choice: cette grande nation
  rationale: « Nation » distingue גוי de עמים, rendu plus haut par « peuples », et respecte l’ordre emphatique de l’exclamation.
theological_decisions:
- issue: Rapport entre obéissance et sagesse
  choice: L’observance et la mise en pratique des prescriptions constituent la manifestation publique de la sagesse et de l’intelligence d’Israël.
  alternative: Les prescriptions elles-mêmes seraient seules identifiées à la sagesse et à l’intelligence, indépendamment de leur mise en pratique.
  rationale: La syntaxe relie l’ordre d’observer et de pratiquer à « ce sera là votre sagesse ». La traduction garde le lien sans ajouter de conclusion sur le mérite ni sur une supériorité intrinsèque d’Israël.
- issue: Portée de l’éloge des peuples
  choice: L’éloge porte sur le peuple tel que son rapport aux décrets devient visible aux autres peuples.
  alternative: Le verset affirmerait une supériorité nationale absolue et indépendante de l’obéissance.
  rationale: Le contexte immédiat fonde la réaction des peuples sur ce qu’ils entendent des décrets et sur leur mise en pratique; la traduction ne transforme donc pas l’exclamation rapportée en affirmation générale détachée de ce cadre.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur injonctif « vous les observerez » convient au registre du discours légal biblique sans archaïsme marqué. Les termes « peuples » et « nation » préservent la distinction lexicale de l’hébreu. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
