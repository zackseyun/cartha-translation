  source_fidelity: 'La traduction rend bien l’injonction, le lien entre l’observance et la sagesse, ainsi que la distinction entre « peuples » (עַמִּים) et « nation » (גּוֹי). Toutefois, « entendront parler de » affaiblit et modifie le complément direct hébreu : les peuples « entendront tous ces décrets », non seulement parler d’eux.'
  naturalness: Le français est globalement moderne, clair et de registre biblique accessible. « Assurément » est plus idiomatique et plus nettement exclamatif que « Oui » à l’ouverture du discours rapporté.
  terminology: « Observer », « mettre en pratique », « décrets », « sagesse », « intelligence », « peuples » et « nation » sont cohérents avec le contexte juridique et avec les termes hébreux. La note sur רַק préserve utilement l’alternative restrictive.
