  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: fr
  text: Prenez garde à vous-mêmes, de peur d’oublier l’alliance que Yahweh, votre Dieu, a conclue avec vous, et de vous fabriquer une image sculptée représentant quoi que ce soit — acte que Yahweh, votre Dieu, vous a ordonné de ne pas faire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que Yahweh, ton Dieu, t’a ordonné ». La négation est sous-entendue d’après le contexte (voir Deutéronome 4.16). Dans cette dernière proposition, l’hébreu passe aussi du pluriel au singulier.'
    reason: Préciser la négation implicite et le changement de nombre grammatical dans le texte hébreu.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Prenez bien garde à vous-mêmes
  rationale: L’impératif nifal avec לָכֶם est une mise en garde réflexive. Cette formulation française est naturelle, solennelle et conserve l’idée de vigilance personnelle.
- source_word: פֶּן
  choice: de peur de
  rationale: פֶּן introduit les actes contre lesquels porte l’avertissement. « De peur de » permet de coordonner naturellement « oublier » et « vous fabriquer ».
- source_word: בְּרִית
  choice: alliance
  rationale: « Alliance » est le terme français usuel pour בְּרִית dans la relation entre Dieu et Israël et en préserve la portée biblique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: que … a conclue avec vous
  rationale: כרת ברית est une locution signifiant conclure une alliance ; une traduction littérale par « couper » serait obscure en français.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: et de vous fabriquer
  rationale: La tournure pronominale conserve la nuance réflexive-bénéfactive de לָכֶם tout en restant idiomatique.
- source_word: פֶּסֶל
  choice: une image sculptée
  rationale: Le choix garde le sens concret d’une représentation façonnée, sans employer le terme plus interprétatif « idole » ni l’expression vieillie « image taillée ».
- source_word: תְּמוּנַת כֹּל
  choice: représentant quoi que ce soit
  rationale: Cette formulation exprime naturellement en français l’idée de forme ou de ressemblance de toute chose.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: ce que Yahweh, votre Dieu, vous a ordonné de ne pas faire
  rationale: La négation, absente formellement du texte hébreu transmis, est explicitée parce que l’interdiction ressort clairement du contexte immédiat ; cet ajout interprétatif est signalé en note.
theological_decisions:
- issue: Négation implicite dans la proposition relative finale
  choice: 'Expliciter l’interdiction : « vous a ordonné de ne pas faire »'
  alternative: 'Traduire formellement : « ce que Yahweh, ton Dieu, t’a ordonné »'
  rationale: Sans négation, le français laisserait entendre que Dieu a commandé de fabriquer l’image, contrairement au développement immédiat, notamment en Deutéronome 4.16. La note rend transparente l’ellipse du texte hébreu.
- issue: Passage du pluriel au singulier dans la proposition finale
  choice: Maintenir le pluriel français pour la cohérence de l’adresse collective
  alternative: 'Reproduire le changement hébreu : « Yahweh, ton Dieu, t’a ordonné »'
  rationale: L’hébreu passe soudain des suffixes pluriels au singulier. En français, ce changement paraît désigner un autre interlocuteur et obscurcit l’adresse à Israël ; le pluriel communique donc plus clairement la continuité référentielle, tandis que la note signale la forme source.
translation_notes:
  register: Français international moderne, digne et accessible. La structure d’avertissement est conservée sans archaïsmes ; « Yahweh » maintient le nom propre divin. Le marqueur de note est placé sur la proposition qu’il explique.
