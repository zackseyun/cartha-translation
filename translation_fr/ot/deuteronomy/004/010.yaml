    text: Ou « sur le sol » ou « dans le pays ». Le mot hébreu אֲדָמָה peut désigner la terre ou le sol en général, mais aussi un territoire particulier.
    reason: alternative lexicale authentique
  revision_rationale: La révision corrige la dernière proposition afin que « leurs enfants » demeure l’objet du verbe, comme en hébreu, sans imposer un complément implicite précis. La ponctuation autour de l’apposition « ton Dieu » améliore également la lisibilité sans modifier le sens.
