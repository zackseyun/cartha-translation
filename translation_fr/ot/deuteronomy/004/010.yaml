source:
  edition: WLC
  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: fr
  text: 'Le jour où tu t’es tenu devant Yahweh, ton Dieu, à Horeb, lorsque Yahweh m’a dit : « Rassemble le peuple auprès de moi, et je leur ferai entendre mes paroles, afin qu’ils apprennent à me craindre tous les jours qu’ils vivront sur la terre[a], et qu’ils instruisent leurs enfants. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le sol » ou « dans le pays ». Le mot hébreu אֲדָמָה peut désigner la terre ou le sol en général, mais aussi un territoire particulier.
    reason: alternative lexicale authentique
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: le jour où
  rationale: Cette tournure restitue naturellement la construction temporelle relative et rattache le verset au souvenir évoqué dans le contexte.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: tu t’es tenu devant
  rationale: Conserve l’image concrète et solennelle de la comparution du peuple devant Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: Formulation française naturelle pour situer l’événement à ce lieu; l’article est idiomatique avec ce nom biblique.
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: Rassemble le peuple auprès de moi
  rationale: Rend l’impératif causatif de קהל et conserve la relation exprimée par לִי sans suggérer uniquement l’idée de bénéfice.
- source_word: וְאַשְׁמִעֵם
  choice: et je leur ferai entendre
  rationale: Exprime directement la valeur causative du hifil de שמע.
- source_word: דְּבָרָי
  choice: mes paroles
  rationale: Maintient le pluriel et le caractère oral des déclarations divines.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: afin qu’ils apprennent à me craindre
  rationale: Rend la finalité et préserve la force de ירא, qui associe crainte, respect et obéissance sans réduire le terme à la seule révérence.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: tous les jours qu’ils vivront
  rationale: Expression française claire qui conserve l’idée hébraïque d’une durée couvrant toute la vie.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: אֲדָמָה peut désigner le sol, la terre en général ou un territoire particulier; le choix principal reste général et l’autre possibilité est signalée en note.
- source_word: בְּנֵיהֶם
  choice: leurs enfants
  rationale: Dans ce contexte de transmission entre générations, le masculin pluriel désigne la descendance sans restriction nécessaire aux seuls fils.
- source_word: יְלַמֵּדוּן
  choice: qu’ils l’enseignent
  rationale: Le pronom reprend naturellement l’apprentissage de la crainte de Yahweh; cette formulation évite une lourde répétition tout en conservant l’objet implicite du verbe hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le tétragramme comme nom personnel; sa transcription préserve cette fonction plutôt que de la remplacer par un titre.
- issue: Sens de ירא dans le cadre de l’alliance
  choice: me craindre
  alternative: me révérer
  rationale: « Craindre » maintient la tension du terme hébreu, qui peut englober crainte, respect profond et obéissance, sans en atténuer la force.
- issue: Objet implicite de יְלַמֵּדוּן
  choice: qu’ils l’enseignent à leurs enfants
  alternative: qu’ils enseignent leurs enfants; qu’ils apprennent cela à leurs enfants
  rationale: L’hébreu laisse l’objet de « enseigner » implicite. Le pronom « l’ » le rattache à l’apprentissage de la crainte de Yahweh, tout en préservant une certaine concision.
- issue: Portée de בְּנֵיהֶם
  choice: leurs enfants
  alternative: leurs fils
  rationale: Le contexte vise la transmission générationnelle; « enfants » exprime naturellement la portée collective du masculin hébreu.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La syntaxe garde le caractère solennel du souvenir de l’Horeb. « Se tenir devant », « faire entendre » et « craindre » maintiennent les images et tensions du texte hébreu sans archaïsme excessif.
