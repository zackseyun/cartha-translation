base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: fr
  text: Vois, je vous ai enseigné des prescriptions et des règles, comme Yahweh, mon Dieu, me l’a ordonné, afin que vous les mettiez en pratique dans le pays où vous allez entrer pour en prendre possession.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Voyez
  rationale: L’impératif singulier hébreu sert à attirer l’attention de l’ensemble d’Israël envisagé collectivement. Le pluriel français est naturel dans l’adresse au peuple et conserve la force de l’appel.
- source_word: לִמַּדְתִּי
  choice: je vous ai enseigné
  rationale: Le passé composé exprime une action accomplie dont les effets demeurent pertinents dans l’exhortation présente.
- source_word: חֻקִּים
  choice: prescriptions
  rationale: Ce terme garde un registre juridique tout en restant compréhensible en français moderne; il désigne des dispositions fixées.
- source_word: מִשְׁפָּטִים
  choice: règles
  rationale: Dans ce binôme juridique, « règles » rend naturellement les normes ou décisions de droit sans employer le peu idiomatique « jugements ».
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Le mot marque la conformité de l’enseignement de Moïse au commandement divin.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, mon Dieu
  rationale: Le nom propre divin est translittéré, tandis que le suffixe possessif d’אֱלֹהָי est explicitement rendu.
- source_word: לַעֲשׂוֹת כֵּן
  choice: afin que vous les mettiez en pratique
  rationale: L’infinitif exprime ici la finalité de l’enseignement. Le pronom « les » reprend naturellement les prescriptions et les règles, et « mettre en pratique » exprime l’obéissance effective.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte géographique, l’expression idiomatique signifie « à l’intérieur du pays »; « dans le pays » évite le calque peu naturel « au milieu du pays » sans changer le sens.
- source_word: בָּאִים שָׁמָּה
  choice: où vous allez entrer
  rationale: Le participe indique l’entrée imminente et שָׁמָּה la destination. La relative avec « où » rend les deux éléments naturellement.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: ירשׁ peut évoquer l’héritage ou la prise de possession. Cette formulation conserve le sens foncier immédiat sans trancher davantage le mode d’acquisition.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre. « Yahweh » le rend directement et le distingue du titre אֲדֹנָי, sans ajouter une interprétation confessionnelle.
- issue: Portée de l’ordre « afin de faire ainsi »
  choice: afin que vous les mettiez en pratique
  alternative: pour agir ainsi
  rationale: Le sujet implicite est le peuple auquel Moïse s’adresse, et l’expression renvoie aux prescriptions et aux règles enseignées. La traduction maintient donc la finalité pratique sans attribuer l’action à Moïse.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique reste perceptible sans calques lourds. La syntaxe conserve l’enchaînement de l’hébreu tout en évitant les redondances non idiomatiques (« entrer là pour la posséder »).
