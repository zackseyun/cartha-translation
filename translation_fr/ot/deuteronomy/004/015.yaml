revisions:
- from: Prenez donc bien garde à vous-mêmes[a], car vous n’avez vu aucune forme[b] le jour où Yahweh vous a parlé à l’Horeb, du milieu du feu.
  to: Prenez bien garde à vous[a], car vous n’avez vu aucune forme[b] le jour où Yahweh vous a parlé à Horeb, du milieu du feu.
  rationale: La révision supprime l’inférence ajoutée par « donc », adopte des tournures françaises plus idiomatiques pour l’avertissement et le toponyme, et clarifie la note sur l’expression hébraïque. Elle maintient l’ambiguïté lexicale de תְּמוּנָה ainsi que le sens réflexif non technique de נפשותיכם.
