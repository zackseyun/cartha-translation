source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: fr
  text: Prenez bien garde à vous[a], car vous n’avez vu aucune forme[b] le jour où Yahweh vous a parlé à Horeb, du milieu du feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « gardez très soigneusement vos vies/personnes ». Cette expression hébraïque signifie qu’il faut être extrêmement vigilant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aucune ressemblance » ou « aucune image ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: Prenez donc bien garde à vous-mêmes
  rationale: La tournure française idiomatique exprime l’idée réflexive de שׁמר et la forte insistance de מְאֹד. Elle comprend לְנַפְשֹׁתֵיכֶם comme une manière hébraïque de désigner les personnes elles-mêmes, sans introduire ici une distinction entre l’âme et le corps.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’avertissement et « car » rend clairement ce rapport causal dans un registre digne et naturel.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: vous n’avez vu aucune forme
  rationale: תְּמוּנָה peut désigner une forme, une ressemblance ou une représentation visible. « Forme » conserve l’étendue du terme et convient au contraste contextuel entre la parole entendue et l’absence de manifestation visible.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Cette formulation conserve l’expression temporelle hébraïque tout en assurant un enchaînement naturel en français.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: Yahweh vous a parlé
  rationale: Le verbe et la préposition indiquent que Yahweh s’est adressé au peuple. Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: C’est la formulation géographique usuelle et naturelle en français pour le lieu de la théophanie.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: La traduction garde la précision spatiale de מִתּוֹךְ et l’image frappante de la voix venant du cœur du feu.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ dans לְנַפְשֹׁתֵיכֶם
  choice: à vous-mêmes
  alternative: à vos âmes
  rationale: Dans cette construction, le pluriel de נֶפֶשׁ participe à une exhortation idiomatique à se garder soi-même. La traduction réflexive évite d’imposer au verset une anthropologie technique qu’il ne formule pas.
- issue: Sens de תְּמוּנָה dans le récit de la révélation à l’Horeb
  choice: forme
  alternative: ressemblance ; image
  rationale: « Forme » souligne l’absence de représentation visible de Yahweh sans réduire d’avance le terme à une idole fabriquée. Les autres nuances réelles sont conservées en note.
translation_notes:
  register: Français international moderne, clair et digne. « Prenez bien garde » conserve la force de l’avertissement dans une expression courante, tandis que « du milieu du feu » maintient la vivacité de l’image hébraïque.
