source:
  edition: WLC
  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: fr
  text: 'Interroge donc les temps anciens qui t’ont précédé, depuis le jour où Dieu a créé l’être humain[a] sur la terre et d’une extrémité des cieux à l’autre : est-il jamais arrivé un si grand événement, ou a-t-on jamais entendu parler de quelque chose de semblable ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme » ; l’hébreu אָדָם peut désigner ici l’humanité dans son ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: Interroge donc
  rationale: L’impératif est conservé, tandis que « donc » rend naturellement la particule נָא et son appel insistant sans introduire une politesse absente du contexte.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: les temps anciens
  rationale: Cette expression désigne le passé le plus reculé. « Les temps anciens » est naturel en français moderne et garde la solennité du passage.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: qui t’ont précédé
  rationale: Cette formulation exprime clairement l’antériorité par rapport au destinataire sans alourdir la phrase.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: depuis le jour où … a créé
  rationale: « Depuis » marque le point de départ de la période examinée. Le passé composé convient au français international actuel.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le terme désigne le Dieu unique en tant que Créateur.
- source_word: אָדָם
  choice: l’être humain
  rationale: Dans ce contexte de création et de vaste rétrospective historique, le nom singulier a une portée représentative et peut désigner l’humanité. « L’être humain » conserve le singulier tout en rendant ce sens générique.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Traduction locative directe et naturelle.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: d’une extrémité du ciel à l’autre
  rationale: Cette tournure rend le mérisme qui embrasse toute l’étendue du monde. La reprise de « Interroge » explicite en français le lien syntaxique avec l’impératif initial.
- source_word: הֲנִהְיָה
  choice: s’est-il jamais produit
  rationale: La forme interrogative de היה demande si un tel fait est jamais arrivé. « Jamais » fait ressortir naturellement la portée rhétorique de la question.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: un événement aussi grand
  rationale: דבר désigne ici une chose, une affaire ou un fait. « Événement » convient au contexte, et « aussi grand » exprime la comparaison portée par le préfixe כַּ־.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: a-t-on jamais entendu parler de quelque chose de semblable ?
  rationale: Le niphal de שׁמע renvoie ici à ce dont on a entendu parler, donc à ce qui est connu ou rapporté. La formulation française garde la force de la question rhétorique.
theological_decisions:
- issue: Portée de אָדָם dans le récit de création
  choice: l’être humain
  alternative: l’homme ; Adam
  rationale: Le passage remonte au commencement de l’histoire humaine et le singulier אָדָם peut représenter l’humanité entière. « Adam » personnaliserait davantage le référent, tandis que « l’homme » reste possible mais peut être compris comme désignant seulement le sexe masculin. Une note conserve l’alternative lexicale la plus proche.
translation_notes:
  register: Français moderne, international et dignifié. La phrase a été divisée en deux après « sur la terre » et l’impératif a été repris afin de rendre clairement la portée de l’interrogation géographique sans modifier le sens. Les deux questions finales conservent le caractère absolu et rhétorique de l’hébreu.
