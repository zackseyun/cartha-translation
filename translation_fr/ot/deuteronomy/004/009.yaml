source:
  edition: WLC
  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: fr
  text: Seulement, prends bien garde à toi et veille très attentivement sur toi-même, de peur que tu n’oublies les choses que tes yeux ont vues et de peur qu’elles ne s’éloignent de ton cœur[a] tous les jours de ta vie. Fais-les connaître à tes enfants et aux enfants de tes enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la pensée hébraïque, le « cœur » désigne largement la personne intérieure, notamment la mémoire, l’intelligence et la volonté.
    reason: cultural_note
  - marker: b
    text: Ou « à tes fils et aux fils de tes fils ». Les termes hébreux sont au masculin pluriel, mais peuvent désigner plus largement les enfants ou les descendants dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Seulement
  rationale: Marque avec concision la forte restriction ou insistance de l’hébreu, sans ajouter une nuance adversative qui n’est pas nécessaire.
- source_word: הִשָּׁמֶר לְךָ
  choice: prends bien garde à toi
  rationale: Rend l’expression idiomatique de vigilance personnelle tout en conservant sa forme réflexive et son ton solennel.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: et veille très attentivement sur toi-même
  rationale: נֶפֶשׁ désigne ici la personne elle-même plutôt qu’une âme immatérielle prise au sens étroit. La formulation préserve aussi la répétition emphatique de שׁמר.
- source_word: פֶּן תִּשְׁכַּח
  choice: de peur que tu n’oublies
  rationale: Expression française naturelle et digne pour la mise en garde introduite par פֶּן.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: les choses que tes yeux ont vues
  rationale: Le contexte visuel favorise « choses » pour דְּבָרִים; conserver « tes yeux ont vues » maintient l’accent hébreu sur l’expérience directe.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: et qu’elles ne s’éloignent de ton cœur
  rationale: Préserve le mouvement exprimé par סור et la métaphore anthropologique du cœur, sans la réduire à la seule mémoire intellectuelle.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: tous les jours de ta vie
  rationale: Reproduction naturelle et transparente de l’idiome hébreu.
- source_word: וְהוֹדַעְתָּם
  choice: Fais-les connaître
  rationale: Rend précisément le factitif du verbe ידע, sans le préciser davantage par « enseigne ».
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: à tes enfants et aux enfants de tes enfants
  rationale: Dans ce contexte de transmission entre générations, בָּנִים peut désigner l’ensemble des enfants ou descendants; la structure répétée de l’hébreu est conservée.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: « sur toi-même »
  alternative: « sur ton âme »
  rationale: Dans cette exhortation, נֶפֶשׁ renvoie à la personne entière. « Âme » pourrait suggérer une dichotomie anthropologique plus étroite que ne l’exige le texte.
- issue: Portée du masculin בָנֶיךָ
  choice: « tes enfants »
  alternative: « tes fils »
  rationale: Le masculin pluriel peut désigner ici la descendance de façon représentative; le commandement porte sur la transmission de la mémoire de l’alliance entre générations, sans restriction explicite aux garçons.
- issue: Métaphore du cœur
  choice: conserver « ton cœur »
  alternative: « ta mémoire » ou « ton esprit »
  rationale: Le cœur hébreu comprend notamment mémoire, intelligence et volonté. Conserver la métaphore évite de réduire cette ampleur sémantique.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme unité collective. La répétition des deux appels à la vigilance et les métaphores du texte source sont conservées sans lourdeur excessive.
