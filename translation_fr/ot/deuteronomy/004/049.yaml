  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: fr
  text: et toute l’Araba située de l’autre côté du Jourdain, à l’est, jusqu’à la mer de l’Araba[a], au-dessous des pentes du Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’étendue d’eau généralement appelée la mer Morte.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: l’Araba
  rationale: Le contexte désigne une région géographique précise de la vallée du rift jordanien; le nom propre préserve cette référence mieux que « plaine ».
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Expression géographique française naturelle qui conserve le caractère relationnel de l’hébreu sans fixer un point de vue autre que celui du contexte.
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: Rend clairement et naturellement l’adverbe directionnel dans cette description territoriale.
- source_word: יָם הָעֲרָבָה
  choice: la mer de l’Araba
  rationale: Traduction proche de la désignation hébraïque, sans lui substituer directement le nom conventionnel plus tardif « mer Morte »; l’identification est donnée en note.
- source_word: תַּחַת
  choice: au-dessous de
  rationale: Exprime naturellement la relation topographique indiquée par l’hébreu.
- source_word: אַשְׁדֹּת
  choice: les pentes de
  rationale: Dans cet emploi géographique, le terme désigne les déclivités ou versants associés au Pisga.
- source_word: הַפִּסְגָּה
  choice: le Pisga
  rationale: Translittération française usuelle du nom géographique, avec l’article présent en hébreu.
- source_word: וְכָל
  choice: et toute
  rationale: Conserve à la fois la coordination avec le contexte précédent et la portée exhaustive de l’expression.
