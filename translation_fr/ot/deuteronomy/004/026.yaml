  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: fr
  text: 'Je prends aujourd’hui le ciel et la terre à témoin contre vous : vous disparaîtrez rapidement du pays dont vous allez prendre possession en traversant le Jourdain. Vous n’y vivrez pas longtemps, car vous serez assurément détruits.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: J’en prends ... à témoin contre vous
  rationale: 'Le hiphil de עוּד avec בָכֶם relève ici du langage juridique de l’alliance : Moïse invoque des témoins contre Israël. Cette tournure française est naturelle et conserve cette force judiciaire.'
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: le ciel et la terre
  rationale: « Le ciel et la terre » est la formulation française usuelle de cette formule de témoignage cosmique, tout en reflétant fidèlement l’expression hébraïque.
- source_word: אָבֹד תֹּאבֵדוּן מַהֵר
  choice: vous disparaîtrez rapidement
  rationale: L’infinitif absolu renforce la certitude de la disparition. En contexte, אָבד décrit la disparition du peuple hors du pays; « disparaîtrez » évite de préciser indûment le mécanisme du jugement, tandis que « rapidement » rend מַהֵר.
- source_word: מֵעַל הָאָרֶץ
  choice: du pays
  rationale: Le contexte territorial appelle « pays » plutôt que « terre »; la préposition exprime ici la disparition ou l’expulsion hors de ce territoire.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: dont vous allez prendre possession en traversant le Jourdain
  rationale: La formulation rend le pays comme destination de la traversée et traduit ירשׁ par l’expression française naturelle « prendre possession », sans ajouter l’idée spécifique d’héritage.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: Vous n’y vivrez pas longtemps
  rationale: Littéralement, l’hébreu dit qu’ils ne prolongeront pas leurs jours sur le pays. Cette formulation idiomatique française en préserve clairement le sens.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: vous serez bel et bien détruits
  rationale: La construction avec infinitif absolu souligne fortement la certitude. « Bel et bien » transmet cette insistance en français actuel sans imposer l’idée plus absolue d’anéantissement total.
theological_decisions:
- issue: Formule d’alliance invoquant le ciel et la terre comme témoins
  choice: Conserver la scène juridique en présentant le ciel et la terre comme témoins contre Israël
  alternative: Rendre plus librement par « je vous avertis aujourd’hui devant le ciel et la terre »
  rationale: Le vocabulaire appartient au registre du procès d’alliance. La traduction maintient cette portée sans développer une théologie étrangère au verset.
- issue: Portée des deux verbes de destruction
  choice: Distinguer la disparition rapide du pays et la destruction certaine sans préciser davantage leur étendue
  alternative: Employer « périr » puis « être anéantis »
  rationale: Les formulations intensives annoncent un jugement certain, mais le verset ne tranche pas à lui seul toutes les questions sur sa modalité ou son caractère absolu. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe garde le ton judiciaire et l’insistance des deux constructions hébraïques intensives, sans littéralisme artificiel.
