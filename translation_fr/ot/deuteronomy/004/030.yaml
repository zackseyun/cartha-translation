source:
  edition: WLC
  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: fr
  text: Quand tu seras dans la détresse et que toutes ces choses t’auront atteint, dans les derniers jours[a], tu reviendras à Yahweh, ton Dieu, et tu écouteras sa voix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les temps à venir ». L’expression hébraïque peut désigner largement une époque future et ne renvoie pas nécessairement à un scénario précis de la fin des temps.
    reason: alternative_reading
  - marker: b
    text: 'On peut aussi traduire : « tu obéiras à sa voix », car l’expression hébraïque implique souvent une écoute qui se traduit par l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: quand tu seras dans la détresse
  rationale: La construction exprime la situation dans laquelle se trouvera le destinataire. « Dans la détresse » rend צַר avec naturel, tandis que « quand tu seras » explicite en français la valeur temporelle de la proposition nominale.
- source_word: וּמְצָאוּךָ
  choice: et que … t’auront atteint
  rationale: מצא signifie littéralement « trouver », mais, avec des événements éprouvants pour sujet, « atteindre » est idiomatique en français et conserve l’idée que ces choses parviennent jusqu’au destinataire.
- source_word: כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces choses
  rationale: דְּבָרִים peut désigner des paroles, des faits ou des événements. Ici, l’expression renvoie aux événements annoncés dans le contexte ; « toutes ces choses » préserve cette largeur de sens.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans les derniers jours
  rationale: Cette formulation garde l’image temporelle de l’hébreu et sa résonance biblique, sans déterminer à elle seule s’il s’agit simplement d’un temps futur ou d’une période eschatologique précise.
- source_word: וְשַׁבְתָּ עַד
  choice: tu reviendras à
  rationale: שׁוב avec עַד exprime le retour vers quelqu’un. « Revenir à » conserve la dimension relationnelle et alliancielle sans introduire explicitement le terme théologique « se repentir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui préserve son caractère de nom personnel dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Cette traduction directe de la construction avec suffixe de deuxième personne du singulier conserve l’adresse personnelle et alliancielle.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: et tu écouteras sa voix
  rationale: La traduction maintient la métaphore auditive de l’hébreu. Dans cette expression, écouter implique souvent prêter attention et obéir, nuance signalée en note.
theological_decisions:
- issue: Portée temporelle de בְּאַחֲרִית הַיָּמִים
  choice: dans les derniers jours
  alternative: dans les temps à venir
  rationale: Le choix conserve l’idiome biblique et sa tension théologique, tandis que la note empêche de l’enfermer dans un scénario précis de la fin des temps.
- issue: Sens allianciel de וְשַׁבְתָּ עַד יְהוָה
  choice: tu reviendras à Yahweh, ton Dieu
  alternative: tu te repentiras et tu te tourneras vers Yahweh, ton Dieu
  rationale: « Reviendras » exprime le mouvement relationnel vers Dieu sans ajouter une formulation doctrinale plus développée que le verbe hébreu lui-même.
- issue: Dimension d’obéissance dans וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: tu écouteras sa voix
  alternative: tu obéiras à sa voix
  rationale: Le texte principal préserve l’image concrète de l’écoute ; la note rend explicite la nuance fréquente d’obéissance sans réduire le champ sémantique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme interlocuteur collectif. La syntaxe reste fluide tout en conservant l’enchaînement temporel, le nom divin et les principales images du texte source.
