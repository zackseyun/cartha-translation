source:
  edition: WLC
  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: fr
  text: Là, vous servirez des dieux, ouvrages de mains humaines, faits de bois et de pierre, qui ne voient pas, n’entendent pas, ne mangent pas et ne sentent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: vous servirez
  rationale: Le verbe עבד signifie ici servir au sens cultuel. Dans la suite de l’avertissement prophétique de Moïse, le futur français exprime naturellement la valeur prédictive.
- source_word: שָׁם
  choice: Là
  rationale: Cet adverbe de lieu renvoie aux pays étrangers évoqués dans le contexte immédiat.
- source_word: אֱלֹהִים
  choice: des dieux
  rationale: Le pluriel lexical désigne ici de fausses divinités. « Des dieux » conserve la formulation hébraïque, tandis que la suite précise qu’il s’agit d’objets fabriqués.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: ouvrages de mains humaines
  rationale: Cette formulation conserve l’image concrète des mains et rend אָדָם dans son sens générique, sans référence particulière au sexe masculin.
- source_word: עֵץ וָאֶבֶן
  choice: faits de bois et de pierre
  rationale: Dans ce contexte, עֵץ et אֶבֶן désignent les matériaux dont les représentations cultuelles sont faites. L’ajout explicatif « faits de » rend naturelle en français l’apposition hébraïque.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: qui ne voient pas, n’entendent pas, ne mangent pas et ne sentent pas
  rationale: La répétition de la négation est conservée sans transformer explicitement l’énoncé en incapacité, ce qui respecte plus directement la forme hébraïque et maintient son rythme polémique.
- source_word: יְרִיחֻן
  choice: sentent
  rationale: Le verbe signifie ici percevoir par l’odorat. « Sentir » est le terme français courant et naturel dans cette énumération sensorielle.
theological_decisions:
- issue: Sens d’אֱלֹהִים dans la polémique contre les objets fabriqués
  choice: des dieux
  alternative: des idoles
  rationale: « Des dieux » préserve le terme employé par le texte et laisse à l’apposition « ouvrages de mains humaines » le soin d’en dévoiler la nature, sans remplacer le lexème par une interprétation.
- issue: Portée générique d’אָדָם
  choice: mains humaines
  alternative: mains d’hommes
  rationale: אָדָם désigne ici l’être humain en général. « Humaines » exprime exactement cette portée et évite une lecture inutilement masculine.
- issue: Négation factuelle ou expression explicite de l’incapacité des dieux
  choice: qui ne voient pas, n’entendent pas, ne mangent pas et ne sentent pas
  alternative: qui ne peuvent ni voir, ni entendre, ni manger, ni sentir
  rationale: Le contexte implique clairement leur incapacité, mais l’hébreu formule quatre négations simples. Le texte principal en conserve donc la forme sans résoudre davantage la nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la vigueur de l’avertissement ainsi que l’énumération sensorielle de l’hébreu. Aucun appel de note n’est nécessaire, puisque les principales nuances peuvent être conservées directement dans le texte.
