  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: fr
  text: Car Yahvé, ton Dieu, est un feu dévorant, un Dieu jaloux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un Dieu qui exige un attachement exclusif ». L’hébreu souligne que Yahvé revendique pour lui seul la fidélité de son peuple dans le cadre de l’alliance, particulièrement face à l’idolâtrie.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’avertissement précédent et en conserve naturellement la valeur explicative.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français le nom divin révélé à Israël, au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend le suffixe possessif masculin singulier et maintient l’adresse personnelle à Israël au singulier.
- source_word: אֵשׁ אֹכְלָה
  choice: un feu dévorant
  rationale: Expression française naturelle et proche de l’image hébraïque d’un feu qui consume.
- source_word: הוּא
  choice: est
  rationale: Intègre le pronom emphatique hébreu à la structure prédicative naturelle du français, sans répétition lourde.
- source_word: אֵל
  choice: Dieu
  rationale: Rend le titre divin commun placé en apposition dans la seconde proposition.
- source_word: קַנָּא
  choice: jaloux
  rationale: Préserve l’exclusivité de l’engagement d’alliance de Dieu et son refus de tout culte rival, sans atténuer la tension du terme.
theological_decisions:
- issue: Traduction de la jalousie divine
  choice: un Dieu jaloux
  alternative: un Dieu qui exige un attachement exclusif
  rationale: « Jaloux » conserve la force relationnelle et la tension théologique de l’hébreu dans le contexte de l’idolâtrie. La paraphrase explicative serait plus claire, mais résoudrait trop directement l’ambiguïté du terme.
translation_notes:
  register: Français international moderne, digne et direct. « Feu dévorant » conserve l’image vive du texte; « Dieu jaloux » maintient volontairement la tension du vocabulaire d’alliance.
