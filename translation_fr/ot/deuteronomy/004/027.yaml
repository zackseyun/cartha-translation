  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: fr
  text: Yahweh vous dispersera parmi les peuples, et vous ne serez plus qu’un petit nombre parmi les nations où Yahweh vous conduira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où Yahweh vous chassera ». Le verbe hébreu peut signifier « conduire » ou, selon le contexte, « pousser/chasser »; le contexte de jugement et d’exil peut évoquer une conduite contrainte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: vous dispersera
  rationale: Le hifil de פוץ exprime une dispersion causée. « Dispersera » est naturel en français et convient au contexte de jugement et d’exil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: בָּעַמִּים
  choice: parmi les peuples
  rationale: « Peuples » rend עַמִּים et maintient une distinction lexicale avec גּוֹיִם, rendu ensuite par « nations ».
- source_word: וְנִשְׁאַרְתֶּם מְתֵי מִסְפָּר
  choice: vous ne resterez qu’un petit nombre
  rationale: Cette formulation française naturelle exprime le résultat du jugement ainsi que l’idée idiomatique d’un groupe fortement réduit et aisément dénombrable.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Dans ce contexte, גּוֹיִם désigne les nations étrangères en général; « nations » évite d’importer le sens religieux plus tardif de « païens ».
- source_word: אֲשֶׁר יְנַהֵג ... שָׁמָּה
  choice: où Yahweh vous conduira de force
  rationale: נהג peut signifier « conduire » ou « pousser/chasser ». « Conduira de force » rend à la fois le mouvement dirigé et la contrainte propre au contexte d’exil, tandis que « où » reprend naturellement שָׁמָּה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin lui-même. Le conserver sous la forme « Yahweh » distingue ce nom personnel d’un simple titre.
- issue: Degré de contrainte exprimé par יְנַהֵג
  choice: conduira de force
  alternative: conduira
  rationale: Le verbe peut désigner le fait de mener ou de conduire, sans toujours préciser la contrainte. Ici, le contexte de jugement et de dispersion favorise une conduite forcée, mais l’autre nuance reste signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prophétique est conservé; la distinction entre « peuples » et « nations » est maintenue. La tournure « ne resterez qu’un petit nombre » évite un calque tout en préservant l’image d’un reste fortement réduit.
