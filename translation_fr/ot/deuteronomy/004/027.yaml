    text: Ou « où Yahweh vous chassera ». Le verbe hébreu peut signifier « conduire » ou, selon le contexte, « pousser/chasser »; le contexte de jugement et d’exil peut évoquer une conduite contrainte.
    reason: lexical_alternative
