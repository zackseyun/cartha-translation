review_pass:
  verdict: revise
  source_fidelity: La dispersion, la distinction entre « peuples » (עמים) et « nations » (גויים), ainsi que le petit nombre restant, sont bien rendus. Toutefois, « conduira de force » fixe dans le texte principal une nuance coercitive que נהג peut suggérer dans ce contexte, mais n’exprime pas nécessairement par lui-même. Le rendu principal doit conserver l’ambiguïté entre « conduire/mener » et une conduite contrainte.
  naturalness: Le français est clair et de registre approprié. « Vous ne serez plus qu’un petit nombre » est plus idiomatique et exprime naturellement le résultat passif de « vous serez laissés peu nombreux ».
  terminology: « Yahweh », « peuples » et « nations » sont cohérents avec le texte source et les choix terminologiques du projet. La note doit présenter l’alternative lexicale sans faire de la contrainte le sens imposé du verbe.
  issues:
  - severity: medium
    issue: « Yahweh vous conduira de force » surinterprète נהג dans le texte principal.
    rationale: נהג signifie couramment « conduire, mener »; le contexte de jugement permet une conduite forcée, mais celle-ci relève d’une inférence contextuelle. La traduction principale doit préserver cette latitude, la note pouvant signaler l’alternative plus forte.
  - severity: low
    issue: « Vous ne resterez qu’un petit nombre » atténue légèrement la formulation passive/résultative du niphal ונשארתם.
    rationale: La phrase est compréhensible, mais « vous ne serez plus qu’un petit nombre » rend plus directement l’état de survivants/restants après le jugement, sans alourdir le français.
  revised_text: Yahweh vous dispersera parmi les peuples, et vous ne serez plus qu’un petit nombre parmi les nations où Yahweh vous conduira.[a]
