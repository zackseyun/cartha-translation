revisions:
- from: Tu observeras donc ses prescriptions et ses commandements que je te donne aujourd’hui, afin que tout aille bien pour toi et pour tes enfants après toi, et afin que tu vives longtemps sur la terre que Yahweh, ton Dieu, te donne pour toujours.[a]
  to: Tu observeras donc ses prescriptions et ses commandements que je t’ordonne aujourd’hui, afin que tout aille bien pour toi et pour tes enfants qui viendront après toi, et afin que tu prolonges tes jours sur la terre que Yahweh, ton Dieu, te donne pour toujours.[a]
  rationale: La révision restitue explicitement le verbe « ordonner », élément sémantique important de la proposition relative. Elle améliore aussi légèrement l’idiomaticité de l’expression intergénérationnelle et conserve la note qui signale la portée temporelle discutée de כָּל־הַיָּמִים.
