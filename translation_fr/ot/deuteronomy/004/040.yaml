  text: וְ/שָׁמַרְתָּ֞ אֶת חֻקָּ֣י/ו וְ/אֶת מִצְוֺתָ֗י/ו אֲשֶׁ֨ר אָנֹכִ֤י מְצַוְּ/ךָ֙ הַ/יּ֔וֹם אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וּ/לְ/בָנֶ֖י/ךָ אַחֲרֶ֑י/ךָ וּ/לְמַ֨עַן תַּאֲרִ֤יךְ יָמִים֙ עַל הַ֣/אֲדָמָ֔ה אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: fr
  text: Tu observeras donc ses prescriptions et ses commandements que je t’ordonne aujourd’hui, afin que tout aille bien pour toi et pour tes enfants qui viendront après toi, et afin que tu prolonges tes jours sur la terre que Yahweh, ton Dieu, te donne pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les jours de ta vie ». L’expression hébraïque peut souligner soit la permanence du don de la terre, soit la durée de la vie du destinataire.'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Tu observeras donc
  rationale: Dans ce contexte d’exhortation d’alliance, שׁמר signifie mettre fidèlement en pratique. Le futur français exprime ici une injonction solennelle, tandis que « donc » marque le lien avec l’argument précédent.
- source_word: חֻקָּיו וְאֶת מִצְוֺתָיו
  choice: ses prescriptions et ses commandements
  rationale: « Prescriptions » rend חֻקִּים de façon naturelle tout en le distinguant de מִצְוֹת, rendu par « commandements ».
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: En français courant, « donner des commandements » évite la répétition lourde de « commandements que je te commande », tout en conservant l’acte d’autorité exprimé par צוה.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: afin que tout aille bien pour toi
  rationale: Cette formulation rend naturellement l’idiome hébreu ייטב לְ, qui exprime le bien-être ou une situation favorable.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: et pour tes enfants après toi
  rationale: בָּנִים peut désigner les fils, les enfants ou la postérité. Ici, « enfants » convient au contexte intergénérationnel sans limiter indûment la référence aux hommes.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: et afin que tu vives longtemps
  rationale: Cette tournure française idiomatique exprime clairement l’image hébraïque littérale consistant à « prolonger les jours ».
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: « Sur la terre » suit la préposition עַל et présente אֲדָמָה comme le territoire donné par Dieu; « dans le pays » serait également possible selon le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: נֹתֵן לְךָ
  choice: te donne
  rationale: Le présent français rend naturellement le participe hébreu et l’actualité du don promis.
- source_word: כָּל הַיָּמִים
  choice: pour toujours
  rationale: Dans cette construction appliquée à la possession de la terre, l’expression peut indiquer une durée continue; une note conserve l’autre lecture possible, « tous les jours de ta vie ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération évite de le remplacer par un titre.
- issue: Portée temporelle de כָּל הַיָּמִים
  choice: pour toujours
  alternative: tous les jours de ta vie
  rationale: La syntaxe permet de rattacher l’expression au don de la terre et d’en souligner la continuité. L’hébreu reste toutefois susceptible d’être compris comme visant la durée de vie du destinataire; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse individuelle à Israël représenté comme un interlocuteur unique. Le futur à valeur injonctive convient au registre solennel de l’exhortation.
