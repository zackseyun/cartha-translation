  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: fr
  text: Ou bien, un dieu a-t-il jamais entrepris d’aller prendre pour lui une nation du milieu d’une autre nation, au moyen d’épreuves, de signes, de prodiges, de la guerre, d’une main puissante, d’un bras étendu et de grands actes terrifiants[a], tout comme Yahvé, votre Dieu, a fait pour vous en Égypte, sous tes yeux ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de grandes terreurs » ou « de grands actes redoutables ». L’expression hébraïque désigne des actes ou des réalités qui inspirent la crainte et l’effroi.
    reason: Alternative lexicale préservant l’étendue sémantique de מוֹרָאִים.
lexical_decisions:
- source_word: הֲנִסָּה
  choice: a-t-il jamais entrepris
  rationale: Le verbe נסה exprime ici le fait d’essayer ou d’entreprendre une action. « Entrepris » convient à la question rhétorique et n’insinue pas que l’action aurait pu échouer.
- source_word: אֱלֹהִים
  choice: un dieu
  rationale: Dans cette comparaison rhétorique, le nom désigne une divinité quelconque, mise en contraste avec Yahvé.
- source_word: לָבוֹא לָקַחַת
  choice: d’aller prendre
  rationale: La suite d’infinitifs exprime un déplacement intentionnel suivi de l’action de prendre; « aller prendre » est naturel en français sans imposer un point de vue déictique étranger au texte.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: une nation du milieu d’une autre nation
  rationale: Cette formulation conserve la répétition frappante de גוי et l’image d’un peuple retiré de l’intérieur d’un autre.
- source_word: בְּמַסֹּת
  choice: au moyen d’épreuves
  rationale: Le terme renvoie ici à des événements qui mettent à l’épreuve et manifestent le jugement divin; « épreuves » garde cette largeur de sens.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: de signes, de prodiges
  rationale: « Signes et prodiges » rend la paire hébraïque traditionnelle tout en distinguant leur fonction signifiante de leur caractère extraordinaire.
- source_word: וּבְמִלְחָמָה
  choice: de la guerre
  rationale: Le singulier hébreu conserve la dimension guerrière de la délivrance hors d’Égypte.
- source_word: וּבְיָד חֲזָקָה
  choice: d’une main puissante
  rationale: Expression caractéristique du récit de l’Exode; « main puissante » communique naturellement la force souveraine de Dieu.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: d’un bras étendu
  rationale: Rend directement l’image hébraïque traditionnelle de la puissance divine déployée pour agir.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: de grands actes terrifiants
  rationale: Le pluriel désigne des réalités ou des actes qui inspirent crainte et effroi. Cette formulation explicite leur caractère actif sans réduire le mot aux sentiments qu’ils provoquent; l’ambiguïté est signalée en note.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: comme tout ce que ... a fait
  rationale: Cette tournure française naturelle conserve à la fois la comparaison et la totalité exprimée par כֹל.
- source_word: לָכֶם ... לְעֵינֶיךָ
  choice: pour vous ... sous tes yeux
  rationale: 'Le passage du pluriel au singulier dans l’hébreu est préservé: Moïse s’adresse au peuple collectivement, puis à Israël comme à un interlocuteur singulier.'
theological_decisions:
- issue: Référence à אֱלֹהִים dans la question rhétorique
  choice: un dieu
  alternative: Dieu
  rationale: Le contexte compare l’action unique de Yahvé à celle de toute autre divinité possible. La minuscule et l’indéfini préservent cette force polémique sans identifier le premier sujet au Dieu d’Israël.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: « Yahvé » représente explicitement le nom propre divin dans un français moderne et permet de maintenir la distinction entre le nom personnel et les titres.
- issue: Alternance entre l’adresse plurielle et singulière
  choice: votre Dieu ... pour vous ... sous tes yeux
  alternative: votre Dieu ... pour vous ... sous vos yeux
  rationale: Le maintien de l’alternance préserve la manière dont le texte s’adresse d’abord aux membres du peuple au pluriel, puis à Israël collectivement au singulier, sans harmonisation interprétative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue question rhétorique et l’accumulation instrumentale sont conservées. « Au moyen de » introduit la série sans répéter lourdement « par » devant chaque élément. L’alternance intentionnelle entre « vous » et « tes » reproduit celle de l’hébreu.
