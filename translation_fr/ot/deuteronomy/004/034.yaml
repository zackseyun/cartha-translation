  terminology: « Yahvé », « signes », « prodiges », « main puissante » et « bras étendu » sont appropriés. « Grands actes terrifiants » est un choix défendable pour מוֹרָאִים גְּדֹלִים, à condition que la note conserve explicitement les autres possibilités, ce qu’elle fait.
  issues:
