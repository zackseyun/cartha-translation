id: DEU.4.14
reference: Deuteronomy 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: fr
  text: Quant à moi, Yahweh m’a ordonné, à cette époque-là, de vous enseigner des prescriptions et des règles[a], afin que vous les mettiez en pratique dans le pays où vous allez entrer pour en prendre possession[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des décrets et des ordonnances ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour en hériter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: Quant à moi
  rationale: L’objet placé en tête de phrase marque un léger contraste avec ce qui précède. « Quant à moi » rend cette mise en relief de manière naturelle en français.
- source_word: צִוָּה
  choice: m’a ordonné
  rationale: Le verbe exprime un ordre faisant autorité, et non une simple demande.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לְלַמֵּד
  choice: de vous enseigner
  rationale: L’infinitif indique la mission confiée à Moïse de transmettre ces dispositions à Israël.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: des prescriptions et des règles
  rationale: Cette formulation conserve les deux catégories juridiques distinctes tout en restant claire et naturelle en français moderne.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: afin que vous les mettiez en pratique
  rationale: La construction exprime le but. « Mettre en pratique » rend idiomatiquement l’idée hébraïque de « faire » les prescriptions.
- source_word: בָּאָרֶץ אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: dans le pays où vous allez entrer
  rationale: Le français idiomatique exprime ainsi le déplacement imminent d’Israël vers le pays, sans ajouter explicitement le Jourdain, qui n’est pas nommé dans ce verset.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: Le verbe peut exprimer la prise de possession ou l’héritage. Le choix principal convient au contexte immédiat de l’entrée dans le pays, tandis que l’autre nuance est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: « Yahweh » conserve le nom personnel révélé dans le texte hébreu sans le remplacer par le titre « le Seigneur ».
- issue: Nuance de לְרִשְׁתָּהּ
  choice: prendre possession
  alternative: hériter
  rationale: Le contexte immédiat met en avant l’entrée dans le pays et sa possession, mais le verbe peut aussi porter la nuance d’héritage; cette ambiguïté est préservée par une note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le léger contraste portant sur Moïse, tandis que « mettre en pratique » et « entrer » évitent des calques hébraïques peu naturels.
