  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: fr
  text: Mais de là, tu chercheras[a] Yahweh, ton Dieu, et tu le trouveras[b], si tu le recherches de tout ton cœur et de toute ton âme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu met le premier verbe (« vous chercherez ») au pluriel, puis passe au singulier à partir de « ton Dieu ».
    reason: grammatical_ambiguity
  - marker: b
    text: 'Littéralement : « et tu trouveras »; le complément « le » est sous-entendu en hébreu et repris du membre de phrase précédent.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu traduit par « âme » peut aussi désigner la vie ou l’être tout entier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: Mais de là, tu chercheras
  rationale: Le contexte précédent donne à la conjonction une nuance de contraste, tandis que מִשָּׁם indique le point de départ de la recherche. Le singulier français suit l’adresse au singulier qui domine le reste du verset; le changement de nombre de l’hébreu est signalé en note.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré « Yahweh », et le suffixe singulier de אֱלֹהֶיךָ est rendu par « ton ».
- source_word: וּמָצָאתָ
  choice: et tu le trouveras
  rationale: Le verbe signifie ici parvenir à trouver Dieu. Le pronom « le », nécessaire en français courant, reprend Yahweh bien que l’objet ne soit pas répété dans l’hébreu.
- source_word: כִּי
  choice: si
  rationale: Dans ce contexte, כִּי introduit la condition de la découverte; « si » conserve cette valeur sans transformer la proposition en certitude temporelle.
- source_word: תִדְרְשֶׁנּוּ
  choice: tu le recherches
  rationale: דרש exprime une recherche résolue de Dieu. « Rechercher » distingue légèrement ce second verbe de בקש tout en gardant leur proximité sémantique.
- source_word: בְּכָל לְבָבְךָ
  choice: de tout ton cœur
  rationale: Cette expression française naturelle rend la totalité de l’engagement intérieur — volonté, pensée et affection — portée par לֵבָב.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: et de toute ton âme
  rationale: « Âme » préserve l’expression deutéronomique traditionnelle, tandis qu’une note rappelle que נֶפֶשׁ peut désigner plus largement la vie ou l’être tout entier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme, rendu par le nom personnel « Yahweh » afin de préserver sa fonction d’alliance.
- issue: Changement du pluriel au singulier dans l’adresse à Israël
  choice: Singulier dans le texte, avec note sur le pluriel initial
  alternative: Commencer par « vous chercherez », puis passer au singulier
  rationale: L’hébreu commence par un verbe au pluriel, puis emploie des formes au singulier dès « ton Dieu » et jusqu’à la fin. Un brusque passage de « vous » à « tu » serait plus heurté en français qu’en hébreu; la note conserve néanmoins cette particularité réelle du texte.
- issue: Portée anthropologique de נֶפֶשׁ
  choice: âme
  alternative: vie; être tout entier
  rationale: Dans la formule d’engagement total associée au cœur, « âme » garde la résonance littéraire et théologique sans exclure le sens plus global du soi vivant, explicité en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse collective à Israël qui domine le verset; la variation de nombre de l’hébreu est documentée plutôt que masquée. La répétition « chercher/rechercher » conserve les deux verbes hébreux apparentés dans un style naturel.
