source:
  edition: WLC
  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: fr
  text: Car quelle grande nation a des dieux aussi proches d’elle que Yahvé, notre Dieu, l’est de nous chaque fois que nous l’invoquons ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des dieux ». Le pluriel, confirmé par l’adjectif hébreu pluriel « proches », désigne les divinités des autres nations dans cette comparaison rhétorique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chaque fois que nous faisons appel à lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification de l’exhortation précédente et conserve la valeur argumentative de la conjonction.
- source_word: מִי גוֹי גָּדוֹל
  choice: quelle grande nation
  rationale: Rend naturellement en français la question rhétorique hébraïque.
- source_word: אֲשֶׁר לוֹ
  choice: a
  rationale: Expression française idiomatique de la relation de possession ou d’association indiquée par la construction hébraïque.
- source_word: אֱלֹהִים קְרֹבִים
  choice: des dieux aussi proches
  rationale: L’adjectif pluriel קְרֹבִים favorise ici le sens pluriel « dieux »; « aussi » exprime la comparaison introduite ensuite par כַּ.
- source_word: אֵלָיו
  choice: d’elle
  rationale: Le pronom renvoie à גּוֹי, « nation », féminin en français.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: que Yahvé, notre Dieu
  rationale: La construction comparative est rendue par « aussi… que »; le nom divin est translittéré « Yahvé » et אֱלֹהֵינוּ est singulier dans son sens.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: chaque fois que nous l’invoquons
  rationale: La construction exprime toute occasion répétée; « invoquer » convient naturellement à l’appel adressé à Dieu dans la prière.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur; YHWH
  rationale: Le texte porte le nom propre divin; « Yahvé » est sa forme française traditionnelle et intelligible, sans le remplacer par un titre.
- issue: Sens de אֱלֹהִים dans la première proposition
  choice: pluriel générique « dieux »
  alternative: « Dieu » ou « êtres divins »
  rationale: L’accord pluriel de קְרֹבִים et la comparaison avec Yahvé, Dieu d’Israël, soutiennent la référence aux divinités des autres nations, sans affirmer ici leur statut ontologique.
- issue: Portée de la comparaison
  choice: conserver la comparaison rhétorique entre les dieux des nations et Yahvé
  alternative: reformuler comme une négation explicite de l’existence des autres dieux
  rationale: Le verset souligne la proximité incomparable de Yahvé; il ne convient pas de résoudre ou d’élargir la formulation rhétorique au-delà de ce que dit le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la question rhétorique, la comparaison et l’ambiguïté théologique du texte, sans tournure confessionnelle ajoutée.
