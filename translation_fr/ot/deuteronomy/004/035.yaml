  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: fr
  text: 'Tu as été rendu témoin de ces choses, afin que tu saches que Yahweh, c’est lui qui est Dieu[a] : il n’y en a pas d’autre que lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh, lui, est Dieu » ; le pronom hébreu renforce l’affirmation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: il a été donné de voir
  rationale: 'Le hophal de ראה exprime un causatif passif : Israël n’a pas simplement vu, mais a été rendu témoin de ces choses. Cette tournure française conserve cette nuance sans lourdeur excessive.'
- source_word: לָדַעַת
  choice: afin que tu saches
  rationale: L’infinitif construit avec ל indique ici le but ou le résultat recherché.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce qu’Israël doit savoir, et non une cause.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: הוּא
  choice: c’est lui qui
  rationale: La construction disloquée française restitue naturellement l’insistance portée par le pronom indépendant הוּא.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: En fonction d’attribut, « Dieu » est la formulation française naturelle; l’article hébreu identifie Yahweh comme Dieu sans exiger l’expression peu idiomatique « le Dieu ».
- source_word: אֵין עוֹד
  choice: il n’y en a pas d’autre
  rationale: Cette formulation française actuelle exprime clairement l’absence de toute autre divinité.
- source_word: מִלְבַדּוֹ
  choice: que lui
  rationale: Après la négation, « pas d’autre que lui » rend directement la valeur exclusive de l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le nom propre divin. « Yahweh » le préserve sans lui substituer un titre.
- issue: Force de l’affirmation exclusive
  choice: il n’y en a pas d’autre que lui
  alternative: nul autre n’existe en dehors de lui
  rationale: Le choix maintient pleinement l’exclusivité affirmée par l’hébreu sans ajouter une formulation philosophique allant au-delà du verset.
- issue: Insistance du pronom הוּא
  choice: c’est lui qui est Dieu
  alternative: Yahweh est Dieu
  rationale: La tournure retenue conserve l’emphase explicite du pronom hébreu sans ajouter « seul », idée exprimée par la proposition suivante.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse collective à Israël sous la forme grammaticale masculine singulière. La première proposition explicite le sujet divin implicite du passif hébreu, tout en conservant l’idée qu’Israël a été rendu témoin.
