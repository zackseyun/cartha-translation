lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui fait progresser le récit; « Alors » rend naturellement la succession de l’action.
- source_word: יַבְדִּיל
  choice: mit à part
  rationale: Le hiphil de בדל exprime l’action de séparer ou de réserver en vue d’un usage; « mit à part » conserve cette nuance sans préciser plus que le texte.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: שָׁלֹשׁ עָרִים
  choice: trois villes
  rationale: Rendu direct du numéral et du nom.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Cette expression française rend l’idiome géographique hébreu tout en laissant la perspective narrative dépendre du contexte.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: vers le soleil levant
  rationale: Rend l’image concrète de l’hébreu, littéralement orientée vers le lever du soleil, dans une formulation française digne et compréhensible.
