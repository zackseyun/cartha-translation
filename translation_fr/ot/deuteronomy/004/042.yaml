  text: לָ/נֻ֨ס שָׁ֜מָּ/ה רוֹצֵ֗חַ אֲשֶׁ֨ר יִרְצַ֤ח אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמ֣וֹל שִׁלְשׁ֑וֹם וְ/נָ֗ס אֶל אַחַ֛ת מִן הֶ/עָרִ֥ים הָ/אֵ֖ל וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: fr
  text: afin que l’auteur d’un homicide qui aura tué son prochain sans le savoir[a], et qui ne le haïssait pas auparavant[b], puisse s’enfuir là, dans l’une de ces villes, et rester en vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans connaissance »; dans ce contexte juridique, il s’agit d’un acte commis sans le savoir ou sans intention.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis hier ou avant-hier », expression idiomatique signifiant « auparavant » ou « précédemment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: afin que … puisse s’enfuir là
  rationale: L’infinitif construit avec ל exprime ici le but, en lien avec la mise à part des villes au verset précédent. La proposition finale est naturelle en français.
- source_word: רוֹצֵחַ
  choice: l’auteur d’un homicide
  rationale: Dans le contexte des villes de refuge, le mot désigne celui qui a causé la mort sans préjuger ici d’une culpabilité meurtrière. « Meurtrier » impliquerait trop facilement un homicide volontaire.
- source_word: אֲשֶׁר יִרְצַח אֶת־רֵעֵהוּ
  choice: qui aura tué son prochain
  rationale: Le futur antérieur convient à la portée prospective de la disposition légale. « Son prochain » rend רֵעֵהוּ dans un registre biblique encore intelligible et non archaïque.
- source_word: בִּבְלִי דַעַת
  choice: sans le savoir
  rationale: Littéralement « sans connaissance »; en contexte juridique, l’expression indique que l’acte mortel n’était pas commis sciemment. Cette formulation française conserve l’image de la connaissance sans ajouter un vocabulaire technique.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: alors qu’il ne le haïssait pas
  rationale: Le participe exprime une disposition durable. L’imparfait français rend naturellement cet état antérieur et continu.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: auparavant
  rationale: L’expression idiomatique signifie « précédemment, depuis quelque temps »; son image littérale est signalée en note.
- source_word: וְנָס אֶל־אַחַת מִן־הֶעָרִים הָאֵל
  choice: puisse s’enfuir là, dans l’une de ces villes
  rationale: Le subjonctif après « afin que » exprime le but et la possibilité prévue par la loi. « Ces villes » respecte le démonstratif hébreu.
- source_word: וָחָי
  choice: et rester en vie
  rationale: La formule exprime ici la préservation de la vie après la fuite. « Rester en vie » est plus explicite et naturel que le simple « vivre » dans ce contexte juridique.
theological_decisions:
- issue: Qualification morale de l’auteur de l’homicide
  choice: l’auteur d’un homicide
  alternative: le meurtrier
  rationale: Le verset traite précisément d’un homicide commis sans connaissance et sans haine préalable. La traduction ne doit donc pas attribuer d’emblée l’intention coupable que « meurtrier » suggère couramment.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation juridique reste claire sans employer de termes archaïques. Les notes préservent les expressions hébraïques littérales dont une traduction mot à mot serait peu naturelle.
