base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: fr
  text: 'Vous avez vu de vos propres yeux ce que Yahweh a fait à Baal-Péor[a] : Yahweh, votre Dieu, a exterminé du milieu de vous tout homme qui a suivi Baal-Péor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui est allé après Baal-Péor ».'
    reason: L’hébreu emploie littéralement l’expression « aller après », un idiome rendu naturellement par « suivre ».
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Vous avez vu de vos propres yeux
  rationale: Cette tournure française naturelle conserve l’insistance de l’hébreu sur le témoignage direct des destinataires.
- source_word: עָשָׂה
  choice: a fait
  rationale: Le verbe désigne ici l’action accomplie par Yahweh lors de l’épisode de Baal-Péor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּבַעַל פְּעוֹר
  choice: à Baal-Péor
  rationale: La préposition situe l’action dans l’épisode associé à Baal-Péor sans préciser davantage le rapport exact.
- source_word: כָּל הָאִישׁ
  choice: tout homme
  rationale: Le masculin singulier distributif de l’hébreu est conservé.
- source_word: הָלַךְ אַחֲרֵי
  choice: s’est mis à la suite de
  rationale: Cette expression rend l’image du déplacement à la suite de quelqu’un tout en exprimant l’adhésion idolâtre.
- source_word: הִשְׁמִידוֹ
  choice: il a exterminé
  rationale: Le hiphil exprime une destruction complète; la construction française place directement le complément « tout homme » après le verbe.
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de vous
  rationale: Cette formulation conserve l’idée d’une élimination opérée au sein même de la communauté.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction.
- issue: Référence de Baal-Péor
  choice: Baal-Péor
  alternative: le Baal de Péor
  rationale: La forme traditionnelle concise laisse intacte l’ambiguïté entre la désignation cultuelle et le nom associé à l’épisode.
- issue: Masculin distributif כָּל הָאִישׁ
  choice: tout homme
  alternative: quiconque
  rationale: Le choix retenu reflète explicitement la forme masculine singulière du texte source.
translation_notes:
  register: Français international moderne, clair et digne. L’ouverture privilégie l’idiome français tout en gardant l’accent sur le témoignage oculaire. La reprise « lui, Yahweh votre Dieu » conserve l’apposition emphatique du texte hébreu sans alourdir excessivement la phrase.
