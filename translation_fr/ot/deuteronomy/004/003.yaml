  source_fidelity: 'Le sens central est bien rendu : témoignage direct, action de Yahweh dans l’épisode de Baal-Péor, destruction de chaque homme ayant suivi Baal-Péor, et retrait du sein du peuple. Toutefois, la reprise « lui, Yahweh votre Dieu » déplace inutilement l’apposition hébraïque et rend la syntaxe française moins nette. La note actuelle ajoute l’explication « s’est attaché à son culte », plausible dans le contexte mais plus interprétative que nécessaire.'
