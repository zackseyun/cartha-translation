  text: מֵ/עֲרֹעֵ֞ר אֲשֶׁ֨ר עַל שְׂפַת נַ֧חַל אַרְנֹ֛ן וְ/עַד הַ֥ר שִׂיאֹ֖ן ה֥וּא חֶרְמֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: fr
  text: depuis Aroër, qui se trouve au bord du ravin de l’Arnon[a], jusqu’au mont Sion — c’est-à-dire l’Hermon[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du torrent de l’Arnon » ou « de la vallée de l’Arnon ». Le mot hébreu נַחַל désigne souvent un lit de torrent ou un ravin, et non nécessairement une rivière permanente.
    reason: lexical_alternative
  - marker: b
    text: Hébreu « Sion ». Comparer Deutéronome 3.9, où cette montagne est aussi appelée Sirion par les Sidoniens. Ici, le texte identifie explicitement Sion à l’Hermon.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: depuis Aroër
  rationale: La préposition מִן indique le point de départ de l’étendue territoriale; le nom de lieu est translittéré.
- source_word: אֲשֶׁר
  choice: qui se trouve
  rationale: Introduit une proposition relative décrivant la situation géographique d’Aroër; cette formulation est naturelle en français.
- source_word: עַל שְׂפַת
  choice: sur la rive de
  rationale: שָׂפָה signifie littéralement «lèvre» ou «bord»; dans ce contexte géographique, «rive» rend idiomatiquement le bord du ravin ou du cours d’eau.
- source_word: נַחַל אַרְנֹן
  choice: le ravin de l’Arnon
  rationale: נַחַל peut désigner un ravin, un lit de torrent ou une vallée parcourue par un cours d’eau, pas nécessairement une rivière permanente. «Ravin» conserve ici la réalité topographique sans imposer un débit permanent.
- source_word: וְ/עַד
  choice: jusqu’au
  rationale: Marque le terme de l’étendue territoriale.
- source_word: הַר שִׂיאֹן
  choice: mont Sion
  rationale: הַר suivi d’un nom propre se rend naturellement par «mont». Sion translittère שִׂיאֹן, forme distincte du nom habituellement rendu par «Sion/Zion» dans d’autres contextes.
- source_word: הוּא
  choice: c’est-à-dire
  rationale: Le pronom a ici une valeur explicative et identifie le mont Sion à l’Hermon.
- source_word: חֶרְמוֹן
  choice: l’Hermon
  rationale: Nom propre de la montagne, rendu selon l’usage français établi avec l’article défini.
