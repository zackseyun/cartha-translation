  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: fr
  text: pour chasser de devant toi des nations plus grandes et plus puissantes que toi[a], afin de te faire entrer dans leur pays et de te le donner en héritage, comme on le voit aujourd’hui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les déposséder de leur territoire ». Le verbe hébreu évoque l’expulsion des occupants antérieurs afin que d’autres reçoivent leur territoire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme en ce jour ». Cette expression signifie ici « comme on le constate aujourd’hui » ou « comme c’est le cas aujourd’hui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: pour chasser
  rationale: Au hiphil, ירשׁ exprime ici l’expulsion des occupants antérieurs; puisque l’objet est « des nations », « chasser » est naturel et clair en français.
- source_word: גּוֹיִם
  choice: des nations
  rationale: « Nations » convient au contexte collectif et territorial du Deutéronome, sans ajouter la connotation particulière de « païens ».
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: plus grandes et plus puissantes que toi
  rationale: La construction avec מִן est comparative. « Puissantes » rend la force politique et militaire de עָצוּם dans un français actuel.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Cette expression spatiale indique que les nations sont écartées de la présence et de l’avancée d’Israël; le tour français conserve l’image hébraïque.
- source_word: לַהֲבִיאֲךָ
  choice: afin de te faire entrer dans leur pays
  rationale: Le hiphil de בוא signifie faire entrer. Le complément « dans leur pays » est explicité à partir de la proposition immédiatement suivante pour produire une phrase française naturelle.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: et de te le donner
  rationale: Le pronom « le » reprend « leur pays » et préserve l’idée centrale du don divin sans lourde répétition.
- source_word: נַחֲלָה
  choice: en héritage
  rationale: « Héritage » conserve la portée foncière et l’importance covenantale du terme, plutôt que de l’aplatir en simple « possession ».
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Cette formulation rend en français moderne l’idiome deutéronomique qui renvoie à une réalité présente et manifeste, tout en signalant en note la forme plus littérale.
theological_decisions:
- issue: Terminologie de la terre d’alliance dans נַחֲלָה
  choice: en héritage
  alternative: comme possession
  rationale: « Héritage » maintient la présentation de la terre comme un don transmis par Dieu, thème majeur du Deutéronome, sans développer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste syntaxiquement liée au contexte précédent, conformément aux infinitifs hébreux. Le singulier « toi » est maintenu parce que Moïse s’adresse collectivement à Israël au singulier.
