  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: fr
  text: Quand tu auras des enfants et des petits-enfants[a], et que vous aurez longtemps vécu dans le pays[b], si vous vous corrompez en fabriquant une image sculptée à la ressemblance de quoi que ce soit[c], et si vous faites ce qui est mal aux yeux de Yahweh, ton Dieu, pour provoquer sa colère—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils et des fils de fils ». Les termes masculins peuvent désigner ici la descendance de manière générale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que vous aurez vieilli dans le pays » ou « que vous y serez établis depuis longtemps ». Le verbe peut évoquer le vieillissement ou une longue installation.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une image sculptée à la ressemblance de quoi que ce soit » ; ou « une forme quelconque ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans cet avertissement tourné vers l’avenir, la conjonction ouvre une proposition temporelle ou éventuelle dont la conséquence apparaît au verset suivant.
- source_word: תוֹלִיד
  choice: tu auras
  rationale: Le verbe hébreu évoque littéralement le fait d’engendrer, mais « tu auras des enfants » est naturel en français et conserve l’adresse masculine singulière sans lourdeur.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: des enfants et des petits-enfants
  rationale: Les termes sont morphologiquement masculins, mais désignent ici la descendance sur plusieurs générations.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: que vous aurez vieilli dans le pays
  rationale: Cette formulation conserve l’image du vieillissement tout en exprimant une longue installation dans le pays; le pluriel hébreu est maintenu.
- source_word: וְהִשְׁחַתֶּם
  choice: si vous vous corrompez
  rationale: Le verbe décrit ici la corruption morale et cultuelle du peuple; le pronominal français rend naturellement cette dégradation sans limiter le sens aux seules conséquences personnelles.
- source_word: פֶּסֶל
  choice: une image sculptée
  rationale: Ce choix désigne concrètement un objet façonné, sans remplacer le terme descriptif par le terme théologique plus large « idole ».
- source_word: תְּמוּנַת כֹּל
  choice: représentant quoi que ce soit
  rationale: La formulation exprime naturellement en français l’idée d’une image ayant la forme ou la ressemblance d’un être ou objet quelconque.
- source_word: הָרַע בְּעֵינֵי
  choice: ce qui est mal aux yeux de
  rationale: Cette traduction conserve l’expression évaluative imagée de l’hébreu tout en restant idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par un titre.
- source_word: לְהַכְעִיסוֹ
  choice: provoquant ainsi sa colère
  rationale: Le participe français rend le lien de résultat ou de visée avec les actes précédents, tout en conservant la force causative du verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel dans la traduction.
- issue: Portée des termes masculins בָּנִים וּבְנֵי בָנִים
  choice: enfants et petits-enfants
  alternative: fils et petits-fils
  rationale: Dans cet avertissement collectif, les termes généalogiques masculins désignent vraisemblablement la descendance de manière générale; une note conserve toutefois la lecture formelle.
- issue: Alternance entre singulier et pluriel dans l’adresse
  choice: tu auras… vous aurez… ton Dieu
  alternative: uniformiser toute l’adresse au pluriel
  rationale: La traduction maintient la tension grammaticale du texte hébreu, qui passe du singulier au pluriel puis revient au singulier, plutôt que de la gommer.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par un tiret, puisque la conséquence de la proposition conditionnelle vient au verset suivant. L’alternance singulier-pluriel de l’hébreu est volontairement conservée.
