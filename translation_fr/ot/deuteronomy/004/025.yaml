revisions:
- from: Quand tu auras des enfants et des petits-enfants[a], que vous aurez vieilli dans le pays[b], si vous vous corrompez en fabriquant une image sculptée représentant quoi que ce soit[c], et si vous faites ce qui est mal aux yeux de Yahweh, ton Dieu, provoquant ainsi sa colère—
  to: Quand tu auras des enfants et des petits-enfants[a], et que vous aurez longtemps vécu dans le pays[b], si vous vous corrompez en fabriquant une image sculptée à la ressemblance de quoi que ce soit[c], et si vous faites ce qui est mal aux yeux de Yahweh, ton Dieu, pour provoquer sa colère—
  rationale: La révision conserve l’alternance singulier-pluriel du texte source, le tiret final et toutes les ancres de notes. Elle améliore seulement l’idiomaticité française de l’expression temporelle et des notes, tout en maintenant l’ambiguïté lexicale concernant le vieillissement ou l’ancienneté de l’installation.
