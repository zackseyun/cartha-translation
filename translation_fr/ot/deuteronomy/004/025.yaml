review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la séquence d’avertissement, l’image sculptée et le nom divin. L’alternance singulier (« tu auras », « ton Dieu ») et pluriel (« vous aurez », « vous vous corrompez », « vous ferez ») reflète bien la morphologie reçue. « Vieilli dans le pays » est possible, mais « longtemps vécu dans le pays » exprime plus naturellement en français la durée d’établissement que le verbe hébreu peut évoquer.
  naturalness: La phrase française est globalement claire et conserve à juste titre son ouverture sur le verset suivant. Une légère révision améliore l’enchaînement de la condition et évite la formulation peu idiomatique de la note b (« que vous serez depuis longtemps »).
  terminology: « Yahweh », « image sculptée », « aux yeux de » et « provoquer sa colère » sont appropriés, modernes et fidèles. La note sur les descendants conserve utilement l’alternative formelle sans imposer une lecture masculine exclusive.
  issues:
  - severity: low
    issue: Note b grammaticalement et idiomatiquement déficiente
    rationale: « Que vous serez depuis longtemps dans le pays » ne se dit pas naturellement en français. « Que vous y vivrez depuis longtemps » ou « que vous y serez établis depuis longtemps » rend l’alternative sans altérer le sens.
  - severity: low
    issue: La formulation principale de la durée peut être plus naturelle
    rationale: « Vous aurez vieilli dans le pays » est littérale mais peut suggérer seulement l’âge des personnes. « Vous y aurez longtemps vécu » conserve la possibilité d’une longue présence dans le pays, que la note explicite davantage.
  - severity: low
    issue: Note c peu naturelle
    rationale: « Ayant la ressemblance de quoi que ce soit » est grammaticalement possible mais lourd. « À la ressemblance de quoi que ce soit » est plus idiomatique et correspond directement à l’expression hébraïque.
