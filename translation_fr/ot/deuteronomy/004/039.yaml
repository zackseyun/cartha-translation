  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם וַ/הֲשֵׁבֹתָ֮ אֶל לְבָבֶ/ךָ֒ כִּ֤י יְהוָה֙ ה֣וּא הָֽ/אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת אֵ֖ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: fr
  text: 'Reconnais aujourd’hui et prends à cœur que Yahweh, lui, est Dieu dans les cieux là-haut et sur la terre ici-bas : il n’y en a pas d’autre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Reconnais donc aujourd’hui
  rationale: Le qal parfait à valeur exhortative appelle ici non seulement à savoir, mais à reconnaître comme vraie la conclusion tirée par Moïse. « Aujourd’hui » conserve l’immédiateté de l’exhortation; « donc » rend naturellement le lien avec l’argument précédent.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: et prends à cœur
  rationale: L’expression hébraïque signifie littéralement ramener ou faire revenir vers son cœur, c’est-à-dire intérioriser pleinement une vérité. « Prends à cœur » est une locution française naturelle qui conserve l’image du cœur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: הוּא הָאֱלֹהִים
  choice: lui, est Dieu
  rationale: Le pronom הוּא est conservé sous la forme emphatique « lui » afin de rendre l’insistance identificatrice et exclusive de l’hébreu.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: dans les cieux, là-haut, et sur la terre, ici-bas
  rationale: Cette formulation garde le mérisme cosmique et traduit explicitement les deux indications spatiales opposées, tout en restant idiomatique en français moderne.
- source_word: אֵין עוֹד
  choice: il n’y en a pas d’autre
  rationale: Cette tournure française exprime sans ajout l’exclusivité absolue de l’énoncé hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Portée de אֵין עוֹד
  choice: il n’y en a pas d’autre
  alternative: il n’y en a point d’autre; nul autre n’existe
  rationale: La traduction maintient l’affirmation exclusive de l’unicité divine, sans l’élargir en une formulation doctrinale postérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’insistance de l’hébreu (« Yahweh, lui ») et le parallélisme spatial, tout en évitant les tournures archaïques.
