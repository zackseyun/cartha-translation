source:
  edition: WLC
  text: אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בְּ/אֶ֥רֶץ הַ/מִּישֹׁ֖ר לָ/רֻֽאוּבֵנִ֑י וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ לַ/גָּדִ֔י וְ/אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן לַֽ/מְנַשִּֽׁי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: fr
  text: Bétser, dans le désert[a], au pays du plateau, pour les Rubénites ; Ramoth, en Galaad, pour les Gadites ; et Golan, en Basan, pour les Manassites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la steppe ». Le terme hébreu désigne une région sauvage, ouverte et peu habitée, pas nécessairement un désert de sable.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bétser
  rationale: Nom de lieu transcrit selon sa forme hébraïque, avec une graphie française claire.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne ici une région aride ou de steppe peu habitée ; « désert » est naturel en français biblique moderne sans nécessairement évoquer une étendue de sable.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: au pays du plateau
  rationale: מִישֹׁר désigne un terrain plat, ici le haut plateau à l’est du Jourdain ; « plateau » rend mieux la géographie que « plaine ».
- source_word: לָרֻאוּבֵנִי
  choice: pour les Rubénites
  rationale: Le gentilé hébreu est au singulier collectif ; le pluriel français exprime naturellement l’appartenance tribale.
- source_word: רָאמֹת
  choice: Ramoth
  rationale: Nom de lieu conservé sous sa forme française biblique usuelle.
- source_word: בַּגִּלְעָד
  choice: en Galaad
  rationale: Forme française traditionnelle et largement reconnue du nom régional גִּלְעָד.
- source_word: לַגָּדִי
  choice: pour les Gadites
  rationale: Le singulier collectif hébreu est rendu par un pluriel naturel en français, parallèlement aux deux autres tribus.
- source_word: גּוֹלָן
  choice: Golan
  rationale: Transcription française courante du nom de lieu.
- source_word: בַּבָּשָׁן
  choice: en Basan
  rationale: Forme française biblique usuelle du nom régional בָּשָׁן.
- source_word: לַמְנַשִּׁי
  choice: pour les Manassites
  rationale: Le gentilé singulier hébreu a une valeur collective ; le pluriel français préserve clairement la structure tribale.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: énumération ponctuée avec « et » devant le dernier élément
  rationale: La marque de l’objet direct אֶת n’a pas d’équivalent lexical en français ; la coordination des trois villes est rendue par la ponctuation et la conjonction finale.
