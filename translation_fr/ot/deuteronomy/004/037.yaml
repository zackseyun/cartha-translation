source:
  edition: WLC
  text: וְ/תַ֗חַת כִּ֤י אָהַב֙ אֶת אֲבֹתֶ֔י/ךָ וַ/יִּבְחַ֥ר בְּ/זַרְע֖/וֹ אַחֲרָ֑י/ו וַ/יּוֹצִֽאֲ/ךָ֧ בְּ/פָנָ֛י/ו בְּ/כֹח֥/וֹ הַ/גָּדֹ֖ל מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: fr
  text: Et parce qu’il aimait tes pères et qu’il a choisi leur descendance après eux[a], il t’a fait sortir d’Égypte par sa présence[b], par sa grande puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa descendance après lui ». L’hébreu emploie des suffixes au singulier, probablement parce qu’il considère « tes pères » comme un ensemble.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par sa face »; on peut aussi comprendre : « devant lui ». Ici, l’expression évoque la présence même de Dieu lorsqu’il a fait sortir Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: Et parce que
  rationale: L’expression introduit la raison de ce qui précède. « Et parce que » conserve à la fois le lien avec le contexte et la valeur causale.
- source_word: אָהַב
  choice: aimait
  rationale: L’imparfait français exprime naturellement l’amour déjà établi qui motive les actes ensuite rapportés au passé composé.
- source_word: אֲבֹתֶיךָ
  choice: tes pères
  rationale: Ce choix conserve la formulation masculine et l’allusion précise aux pères ancestraux de l’alliance; « tes ancêtres » serait possible, mais moins formellement proche.
- source_word: וַיִּבְחַר
  choice: a choisi
  rationale: « Choisir » rend directement בחר sans lui imposer un sens théologique technique supplémentaire.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: leur descendance après eux
  rationale: Le texte porte des suffixes singuliers, mais ceux-ci renvoient vraisemblablement collectivement à « tes pères ». « Descendance » garde la valeur collective de זרע et le pluriel français rend le référent naturel.
- source_word: וַיּוֹצִאֲךָ
  choice: il t’a fait sortir
  rationale: La forme causative de יצא signifie faire sortir. Cette tournure française conserve explicitement cette valeur et la formule de l’Exode.
- source_word: בְּפָנָיו
  choice: par sa présence
  rationale: Littéralement « par/avec sa face » ou éventuellement « devant lui ». Dans ce contexte, l’expression évoque la présence personnelle de Dieu; la note préserve les possibilités plus littérales.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: par sa grande puissance
  rationale: « Puissance » rend clairement כח, tandis que « par » marque ici le moyen, en parallèle avec « par sa présence ».
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Avec « faire sortir », le complément introduit par « de » exprime naturellement en français la sortie hors d’Égypte.
theological_decisions:
- issue: Les suffixes singuliers collectifs dans « sa descendance après lui »
  choice: leur descendance après eux
  alternative: sa descendance après lui
  rationale: Bien que les suffixes hébreux soient singuliers, leur antécédent est vraisemblablement le collectif « tes pères ». Le pluriel français évite de donner l’impression qu’un seul père est visé, tandis qu’une note conserve la forme du texte source.
- issue: Le sens de בְּפָנָיו
  choice: par sa présence
  alternative: devant lui / par sa face
  rationale: La traduction retenue communique naturellement l’idée que Dieu était lui-même présent dans la délivrance, sans effacer l’expression concrète et ambiguë de l’hébreu, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse hébraïque à Israël. Les temps français distinguent l’amour durable qui motive l’action (« aimait ») des actes accomplis (« a choisi », « a fait sortir »).
