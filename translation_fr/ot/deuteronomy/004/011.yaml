base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: fr
  text: Vous vous êtes approchés et vous vous êtes tenus au pied de la montagne, tandis que la montagne brûlait de feu jusqu’au cœur des cieux[a] — ténèbres, nuée et obscurité profonde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au milieu du ciel ». L’hébreu dit littéralement « jusqu’au cœur des cieux », expression pouvant désigner le milieu ou les hauteurs du ciel.
    reason: lexical_alternative
  - marker: b
    text: Ou « épaisse obscurité » ou « profondes ténèbres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: vous vous êtes approchés
  rationale: Le qal de קרב exprime le mouvement par lequel le peuple s’avance et vient près de la montagne. Cette formulation est naturelle en français et conserve ce mouvement.
- source_word: וַתַּעַמְדוּן
  choice: vous vous êtes tenus
  rationale: Le qal de עמד signifie se tenir debout ou prendre position. « Vous vous êtes tenus » convient au contexte sans suggérer qu’ils se trouvaient simplement là par hasard.
- source_word: תַּחַת הָהָר
  choice: au pied de la montagne
  rationale: תַּחַת signifie littéralement « sous » ou « au-dessous de », mais, dans ce contexte topographique, désigne naturellement le bas ou le pied de la montagne.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: était embrasée de feu
  rationale: Le participe בֹּעֵר décrit un état continu. « Était embrasée de feu » garde l’image concrète et l’insistance explicite sur le feu tout en restant idiomatique.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: jusqu’au cœur des cieux
  rationale: La traduction conserve l’image hébraïque de לֵב, « cœur », et le pluriel שָׁמַיִם. L’expression évoque le milieu ou les hauteurs des cieux sans trancher plus précisément.
- source_word: חֹשֶׁךְ עָנָן וַעֲרָפֶל
  choice: ténèbres, nuée et obscurité profonde
  rationale: Les trois termes sont maintenus séparément afin de préserver l’accumulation solennelle. « Nuée » convient au registre théophanique, tandis qu’« obscurité profonde » distingue עֲרָפֶל des premières « ténèbres ».
theological_decisions:
- issue: Imagerie de la manifestation divine au Sinaï
  choice: Conserver l’accumulation concrète du feu, des ténèbres, de la nuée et de l’obscurité profonde.
  alternative: Réduire ces éléments à une description générale de phénomènes atmosphériques.
  rationale: Le texte présente une manifestation redoutable au moyen d’images distinctes et superposées. La traduction en maintient la force sans expliquer leur nature ni ajouter une interprétation doctrinale.
- issue: Portée de l’expression « cœur des cieux »
  choice: Conserver l’expression imagée et son ambiguïté spatiale.
  alternative: Préciser « jusqu’au milieu du ciel » ou « jusqu’au plus haut du ciel ».
  rationale: L’hébreu peut évoquer le milieu ou la hauteur des cieux. La formulation retenue ne choisit pas arbitrairement entre ces nuances.
translation_notes:
  register: Français moderne, international et digne. Le rythme bref de la seconde phrase et le tiret préservent l’accumulation saisissante de l’hébreu. « Nuée » maintient un registre biblique intelligible sans rendre la phrase archaïque.
