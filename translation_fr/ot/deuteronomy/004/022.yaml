  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: fr
  text: Car moi, je vais mourir dans ce pays-ci[a] ; je ne traverserai pas le Jourdain, mais vous, vous le traverserez et prendrez possession[b] de ce bon pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis sur le point de mourir dans ce pays-ci ». Le participe hébreu peut exprimer une action imminente.
    reason: lexical_alternative
  - marker: b
    text: Ou « posséderez » ou « recevrez en héritage ». Le verbe hébreu peut désigner la prise de possession d’un pays reçu en héritage.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’avertissement ou de l’exhortation qui précède, en conservant sa valeur explicative.
- source_word: אָנֹכִי
  choice: moi, je
  rationale: Le pronom indépendant est emphatique. La dislocation « moi, je » rend cette insistance en français naturel et prépare le contraste avec « vous ».
- source_word: מֵת
  choice: vais mourir
  rationale: Le participe désigne ici la mort prochaine de Moïse. « Je vais mourir » exprime clairement cette imminence sans la réduire à une simple prédiction future.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays-ci
  rationale: Dans ce contexte géographique, אֶרֶץ désigne le territoire situé à l’est du Jourdain. « Pays » est idiomatique en français, et « -ci » souligne le contraste implicite avec le bon pays situé au-delà.
- source_word: אֵינֶנִּי עֹבֵר
  choice: je ne traverserai pas
  rationale: La construction négative avec participe exprime une non-réalisation imminente. Le futur est la formulation française la plus naturelle dans ce contexte.
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: La forme française usuelle du nom du fleuve ne requiert pas l’ajout du mot « fleuve ».
- source_word: וְאַתֶּם עֹבְרִים
  choice: mais vous, vous le traverserez
  rationale: La conjonction marque ici un contraste net entre le sort de Moïse et celui d’Israël. La reprise pronominale rend l’emphase de אַתֶּם et « le » reprend naturellement le Jourdain.
- source_word: וִירִשְׁתֶּם
  choice: prendrez possession de
  rationale: Dans le contexte de la promesse du pays, ירשׁ évoque l’entrée en possession d’un territoire accordé en héritage. Cette formulation conserve l’idée d’acquisition effective.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ce bon pays
  rationale: Conserve sans la préciser excessivement l’évaluation générale exprimée par טוֹבָה, fréquente dans le Deutéronome.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les formes disloquées « moi, je » et « vous, vous » préservent l’emphase et le contraste de l’hébreu sans alourdir excessivement la phrase. Le futur français rend naturellement les participes à valeur imminente dans leur contexte.
