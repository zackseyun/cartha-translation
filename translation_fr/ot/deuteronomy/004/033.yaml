  text: הֲ/שָׁ֣מַֽע עָם֩ ק֨וֹל אֱלֹהִ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כַּ/אֲשֶׁר שָׁמַ֥עְתָּ אַתָּ֖ה וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: fr
  text: Un peuple a-t-il jamais entendu la voix de Dieu parler du milieu du feu, comme toi, tu l’as entendue et es resté en vie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et as-tu survécu ? » Le verbe hébreu signifie simplement « vivre », mais le contexte souligne qu’Israël est demeuré vivant après avoir entendu Dieu parler du milieu du feu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: a-t-il jamais entendu
  rationale: La particule interrogative avec l’accompli introduit une question rhétorique portant sur l’expérience. « A-t-il jamais entendu » est naturel en français et fait ressortir le caractère sans précédent de l’événement sans changer la force de la question.
- source_word: עָם
  choice: un peuple
  rationale: Le nom désigne ici un groupe humain collectif mis en comparaison avec Israël. « Un peuple » est plus précis que « une nation » et convient au contexte.
- source_word: קוֹל אֱלֹהִים
  choice: la voix de Dieu
  rationale: Avec le participe « parler », קוֹל désigne naturellement la voix plutôt qu’un simple son. Le participe singulier et le contexte imposent le sens singulier « Dieu ».
- source_word: מְדַבֵּר
  choice: parler
  rationale: 'L’infinitif français après « entendre » rend naturellement la perception d’une action en cours : la voix de Dieu qui parle.'
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: du milieu du feu
  rationale: Cette formulation conserve l’image spatiale précise de מִתּוֹךְ tout en restant claire et digne en français moderne.
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: comme tu l’as entendue, toi
  rationale: Le pronom objet « l’ » reprend naturellement « la voix » en français. Le pronom tonique « toi » restitue l’insistance apportée par le pronom indépendant hébreu אַתָּה.
- source_word: וַ/יֶּחִי
  choice: et est-il resté en vie
  rationale: Le verbe signifie littéralement « vivre ». Dans cette question coordonnée, « rester en vie » exprime clairement la continuation de la vie après l’écoute, sans aller jusqu’à l’interprétation plus forte « survivre ».
theological_decisions:
- issue: Sens de אֱלֹהִים dans le récit de la révélation divine
  choice: Dieu
  alternative: un dieu / des dieux
  rationale: Le participe singulier et le contexte de l’alliance à l’Horeb désignent le Dieu d’Israël. Le singulier « Dieu » traduit ces indices sans ajouter d’explication doctrinale.
- issue: Contraste implicite entre entendre Dieu et demeurer vivant
  choice: et est-il resté en vie
  alternative: et a-t-il survécu / et pourtant est-il resté en vie
  rationale: L’hébreu coordonne simplement les actions et emploie le verbe « vivre ». La traduction retenue rend l’issue extraordinaire sans ajouter un adversatif absent du texte ni renforcer le sens par « survivre ».
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée; « jamais » en explicite la portée expérientielle. Le tutoiement singulier suit l’adresse hébraïque à Israël, et « toi » en maintient l’emphase.
