id: DEU.4.1
reference: Deuteronomy 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: fr
  text: Et maintenant, Israël, écoute les prescriptions et les règles que je vous enseigne à mettre en pratique, afin que vous viviez, que vous entriez dans le pays et que vous en preniez possession[a], ce pays que Yahweh[b], le Dieu de vos pères[c], vous donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que vous en héritiez ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: c
    text: Ou « le Dieu de vos ancêtres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve explicitement la transition du discours et son lien avec ce qui précède.
- source_word: שְׁמַע אֶל
  choice: écoute
  rationale: Exprime l'écoute attentive sans réduire le verbe à « obéis »; la mise en pratique est formulée ensuite.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: Terme juridique clair en français moderne, gardé distinct de מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles
  rationale: Rend la portée normative et juridique du terme dans une langue accessible, tout en le distinguant de « prescriptions ».
- source_word: מְלַמֵּד אֶתְכֶם לַעֲשׂוֹת
  choice: que je vous enseigne à mettre en pratique
  rationale: Reproduit l'action présente de l'enseignement et le caractère concret de לַעֲשׂוֹת dans un français naturel.
- source_word: לְמַעַן תִּחְיוּ
  choice: afin que vous viviez
  rationale: Préserve clairement la relation de but ou de conséquence visée.
- source_word: וּבָאתֶם
  choice: que vous entriez dans le pays
  rationale: Explicite en français la direction vers le pays, donnée par le contexte immédiat.
- source_word: וִירִשְׁתֶּם
  choice: que vous en preniez possession
  rationale: Rend le sens concret de la prise de possession sans effacer la possibilité de la nuance d'héritage, signalée en note.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: « Pays » est naturel ici pour le territoire promis; la répétition évite une coordination ambiguë en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Préserve la formule ancestrale et patriarcale précise de l'hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom d'alliance plutôt que de lui substituer un titre.
- issue: Portée de שְׁמַע
  choice: écoute
  alternative: obéis
  rationale: Le verbe appelle une écoute attentive qui implique l'obéissance, mais traduire directement par « obéis » résoudrait excessivement cette tension; la suite précise la mise en pratique.
- issue: Sens de ירשׁ dans la promesse du pays
  choice: prendre possession
  alternative: hériter
  rationale: Le contexte vise l'entrée concrète et la possession du territoire, tout en laissant subsister une nuance d'héritage indiquée en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le singulier « écoute » respecte l'adresse collective à Israël, tandis que les pluriels suivants correspondent aux formes hébraïques. La reprise « ce pays » clarifie la syntaxe sans ajouter de contenu.
