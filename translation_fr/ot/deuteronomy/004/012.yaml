  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: fr
  text: Alors Yahweh vous a parlé du milieu du feu[a]. Vous avez entendu des paroles[b], mais vous n’avez vu aucune forme[c] — seulement une voix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’intérieur du feu ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le son de paroles » ; ou « le son d’un discours ».
    reason: lexical_alternative
  - marker: c
    text: Ou « apparence », « figure » ou « représentation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom d’alliance sous une forme française établie et conforme à la convention du projet.
- source_word: וַיְדַבֵּר
  choice: a parlé
  rationale: Le verbe דבר signifie couramment « parler » ; le passé composé rend naturellement en français moderne la progression narrative du wayyiqtol.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: Cette formulation préserve l’image précise d’une parole provenant de l’intérieur même du feu, sans l’affaiblir en un simple « du feu ».
- source_word: קוֹל דְּבָרִים
  choice: le son de paroles
  rationale: Rend de près la construction hébraïque, qui met l’accent sur une parole articulée et audible. La tournure légèrement marquée conserve aussi l’ambiguïté de קוֹל entre « son » et « voix ».
- source_word: שֹׁמְעִים
  choice: vous entendiez
  rationale: Le participe décrit ici l’expérience auditive en cours ; l’imparfait français maintient cet aspect et forme un parallèle avec « vous ne voyiez ».
- source_word: תְמוּנָה
  choice: forme
  rationale: Désigne une forme, apparence ou représentation visible. « Forme » est concis et n’ajoute aucune interprétation doctrinale.
- source_word: אֵינְכֶם רֹאִים
  choice: vous ne voyiez aucune
  rationale: L’imparfait rend naturellement la construction avec participe et souligne l’absence de perception visuelle pendant que le peuple entendait.
- source_word: זוּלָתִי קוֹל
  choice: seulement une voix
  rationale: זוּלָתִי introduit l’unique exception. « Une voix » convient au second emploi de קוֹל et exprime clairement le contraste entre révélation audible et absence de forme visible.
theological_decisions:
- issue: Langage de manifestation et absence de représentation visible de Dieu
  choice: Maintenir le contraste entre des paroles réellement entendues et l’absence de toute forme visible.
  alternative: « Vous entendiez sa voix, mais vous ne voyiez aucune représentation visible. »
  rationale: Le texte affirme une révélation divine audible tout en refusant d’en décrire une manifestation visuelle. La traduction conserve cette tension sans développer une doctrine des images ni préciser davantage l’identité de la « forme ».
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait dans les deux propositions participiales conserve leur simultanéité et leur aspect descriptif. Le tiret met en relief le contraste final sans ajouter de contenu.
