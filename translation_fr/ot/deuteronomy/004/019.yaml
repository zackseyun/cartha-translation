  source_fidelity: 'Le sens fondamental est bien rendu : la mise en garde, les corps célestes, le fait d’être entraîné vers la prosternation et le service, ainsi que l’attribution aux peuples sont conservés. La révision clarifie la portée de « toute l’armée du ciel », qui désigne l’ensemble du soleil, de la lune et des étoiles, et non les étoiles seules.'
  naturalness: La phrase proposée est globalement compréhensible, mais l’enchaînement de deux infinitifs dépendant de « Veille à ne pas » est lourd. Une formulation conditionnelle après « Prends garde » est plus naturelle en français moderne tout en conservant la valeur d’avertissement.
  terminology: « Yahweh », « ton Dieu », « te prosterner » et « les servir » conviennent. « Armée du ciel » est fidèle à l’image du texte ; son déplacement dans la liste rend son référent collectif plus net. Les notes préservent correctement l’ambiguïté de l’attribution, sans y lire une approbation du culte.
