  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: fr
  text: 'Prends garde : si tu lèves les yeux vers le ciel et que tu vois le soleil, la lune et les étoiles — toute l’armée du ciel —, tu pourrais te laisser entraîner à te prosterner devant eux et à les servir, eux que Yahweh, ton Dieu, a attribués[a] à tous les peuples sous tous les cieux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « répartis » ou « assignés ». L’hébreu dit que Yahweh les a attribués à tous les peuples, sans dire par là qu’il approuve le culte qui leur serait rendu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sous tous les cieux » ; le sens idiomatique est « sous le ciel tout entier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: Veille à ne pas
  rationale: La conjonction avec פן introduit une mise en garde contre une issue possible. Cette formulation restitue naturellement la force d’avertissement en français.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: lever les yeux vers le ciel
  rationale: Conserve l’image hébraïque tout en employant une expression française courante.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: toute l’armée du ciel
  rationale: צָבָא désigne une armée ou une multitude organisée. Ici, l’expression englobe les astres qui viennent d’être nommés sans la réduire aux êtres angéliques.
- source_word: וְנִדַּחְתָּ
  choice: te laisser entraîner
  rationale: Le niphal de נדח exprime ici le fait d’être détourné ou égaré. La tournure choisie garde la nuance passive sans suggérer une contrainte irrésistible.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: te prosterner devant eux
  rationale: Rend le geste concret d’inclination ou de prosternation; associé à « les servir », il exprime clairement le culte idolâtre.
- source_word: וַעֲבַדְתָּם
  choice: les servir
  rationale: עבד peut désigner le service cultuel. « Servir » préserve le lexème distinct après l’acte de prosternation.
- source_word: אֲשֶׁר חָלַק
  choice: eux que ... a attribués
  rationale: חלק signifie partager, répartir ou attribuer. « Attribués » rend le sens distributif sans expliciter si cette attribution concerne leur usage, leur domaine ou un jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel porté par le tétragramme plutôt que de lui substituer un titre.
- source_word: לְכֹל הָעַמִּים
  choice: à tous les peuples
  rationale: Rend le pluriel עַמִּים et son orientation distributive sans introduire la notion moderne d’État-nation.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: sous tous les cieux
  rationale: Reproduit au plus près le pluriel et la portée universelle de l’expression hébraïque.
theological_decisions:
- issue: Sens de l’attribution des astres à tous les peuples
  choice: Maintenir l’énoncé selon lequel Yahweh les a « attribués » aux peuples, sans préciser qu’il aurait approuvé leur culte.
  alternative: Comprendre que Dieu a donné les astres aux peuples pour leur usage, ou qu’il a livré les peuples à leur culte comme jugement.
  rationale: Le verbe חלק autorise l’idée d’attribution ou de répartition, mais la formulation ne définit pas explicitement la nature de cette attribution. Le contexte interdit précisément le culte des astres; la traduction conserve donc cette tension sans ajouter une interprétation.
- issue: Référent de « toute l’armée du ciel »
  choice: Comprendre l’expression, dans ce contexte immédiat, comme l’ensemble des corps célestes.
  alternative: Y inclure ou y voir principalement des êtres célestes personnels.
  rationale: Le soleil, la lune et les étoiles précèdent immédiatement l’expression en apposition. Il ne convient toutefois pas de remplacer l’image militaire du texte par une paraphrase interprétative.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond à l’adresse hébraïque à Israël. La phrase conserve l’accumulation solennelle du texte, tandis que les tirets rendent lisible l’apposition. Les pronoms masculins pluriels renvoient collectivement au soleil, à la lune et aux étoiles.
