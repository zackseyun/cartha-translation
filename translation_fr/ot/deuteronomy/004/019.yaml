revisions:
- from: Veille à ne pas lever les yeux vers le ciel et, en voyant le soleil, la lune et les étoiles — toute l’armée du ciel —, à ne pas te laisser entraîner à te prosterner devant eux et à les servir, eux que Yahweh ton Dieu a attribués[a] à tous les peuples sous tous les cieux[b].
  to: 'Prends garde : si tu lèves les yeux vers le ciel et que tu vois le soleil, la lune et les étoiles — toute l’armée du ciel —, tu pourrais te laisser entraîner à te prosterner devant eux et à les servir, eux que Yahweh, ton Dieu, a attribués[a] à tous les peuples sous tous les cieux[b].'
  rationale: La reformulation « si ... tu pourrais ... » rend naturellement la séquence éventuelle exprimée par la mise en garde hébraïque, sans la transformer en affirmation. L’apposition est maintenue après la série complète des astres afin d’en signaler le référent collectif. Les virgules autour de « ton Dieu » correspondent à l’apostrophe explicative française et ne modifient pas le sens. La ponctuation de la seconde note est normalisée.
