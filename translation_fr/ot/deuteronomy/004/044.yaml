  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: fr
  text: 'Et voici la loi que Moïse présenta aux fils d’Israël[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites », « le peuple d’Israël » ou, selon la formulation traditionnelle, « les enfants d’Israël ».
    reason: Alternative lexicale pour la désignation collective בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וְזֹאת
  choice: Et voici
  rationale: Cette tournure conserve le lien marqué par וְ et rend naturellement en français la valeur présentative du démonstratif זֹאת.
- source_word: הַתּוֹרָה
  choice: la loi
  rationale: תּוֹרָה peut désigner l’instruction, mais introduit ici l’ensemble législatif et covenantiel transmis par Moïse. « La loi » est clair, usuel et adapté au contexte.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif français introduit naturellement la proposition qui précise quelle loi est en vue.
- source_word: שָׂם ... לִפְנֵי
  choice: présenta aux
  rationale: L’expression hébraïque signifie littéralement « plaça devant ». Dans ce contexte, « présenta aux » en restitue clairement l’idée sans produire une formulation française pesante.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et standard du nom.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Ce choix conserve la forme masculine et la métaphore généalogique de l’expression hébraïque, tout en restant intelligible en français. Une note signale les équivalents collectifs plus idiomatiques.
theological_decisions:
- issue: Désignation nationale genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; le peuple d’Israël ; traditionnellement, les enfants d’Israël
  rationale: L’expression fonctionne comme désignation collective de la nation, mais sa forme hébraïque est masculine et généalogique. Le texte la conserve sans exclure les équivalents collectifs, indiqués en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Et voici » garde la transition hébraïque ; « présenta aux » privilégie une expression française naturelle tout en conservant l’acte formel de mise à disposition de la loi. Le deux-points marque que cette phrase introduit la section qui suit.
