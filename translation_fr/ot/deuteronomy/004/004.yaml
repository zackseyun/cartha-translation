source:
  edition: WLC
  text: וְ/אַתֶּם֙ הַ/דְּבֵקִ֔ים בַּ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם חַיִּ֥ים כֻּלְּ/כֶ֖ם הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: fr
  text: Mais vous qui restez attachés[a] à Yahweh, votre Dieu, vous êtes tous vivants aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « qui vous attachez à » ou « qui vous cramponnez à » : l’expression évoque un attachement étroit et fidèle à Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mais vous
  rationale: La conjonction et le pronom indépendant établissent un contraste avec ceux qui ont péri à cause de Baal-Péor au verset précédent.
- source_word: הַ/דְּבֵקִים
  choice: qui restez attachés
  rationale: Le participe de דבק décrit une adhésion étroite et durable. Cette formulation française naturelle conserve à la fois l’état présent et l’idée de fidélité sans réduire le terme à une notion purement mentale.
- source_word: בַּ/יהוָה
  choice: à Yahweh
  rationale: La préposition marque l’attachement à la personne désignée par le nom divin; Yahweh transcrit le tétragramme יהוה.
- source_word: אֱלֹהֵי/כֶם
  choice: votre Dieu
  rationale: L’apposition hébraïque identifie explicitement Yahweh comme le Dieu des Israélites auxquels Moïse s’adresse.
- source_word: חַיִּים
  choice: vivants
  rationale: L’adjectif prédicatif désigne leur état présent, par contraste avec ceux qui ont péri.
- source_word: כֻּלְּ/כֶם
  choice: tous
  rationale: Le terme souligne que l’ensemble de ceux qui sont restés attachés à Yahweh sont en vie.
- source_word: הַ/יּוֹם
  choice: aujourd’hui
  rationale: Rend directement et naturellement la référence temporelle au jour où Moïse parle.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom propre de l’Alliance; sa transcription préserve cette identification sans le remplacer par un titre.
- issue: Portée de l’attachement exprimé par דבק
  choice: restez attachés
  alternative: vous attachez fermement
  rationale: Le participe permet de décrire une relation durable et actuelle. La traduction conserve l’idée d’adhésion fidèle sans préciser davantage que le texte la causalité entre cette fidélité et leur survie.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « vous » respecte l’accent contrastif de l’hébreu, tandis que « restez attachés » rend le participe par une expression idiomatique indiquant la continuité.
