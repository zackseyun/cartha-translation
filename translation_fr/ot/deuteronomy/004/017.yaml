lexical_decisions:
- source_word: תַּבְנִית
  choice: forme
  rationale: Dans le contexte des représentations interdites, le terme désigne la forme visible reproduite; « forme » reste naturel et conserve la répétition hébraïque.
- source_word: כָּל
  choice: tout / toute
  rationale: Avec des noms singuliers représentant une catégorie, « tout » exprime naturellement en français l'ensemble sans effacer la structure distributive.
- source_word: בְּהֵמָה
  choice: bête
  rationale: Le terme désigne ici les animaux terrestres en général. « Bête » convient au registre biblique actuel et évite de limiter le sens au bétail domestique.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: qui vit sur la terre
  rationale: « Sur la terre » maintient le contraste spatial avec le ciel et les eaux; « vit » explicite idiomatiquement la présence exprimée par la proposition nominale hébraïque.
- source_word: צִפּוֹר כָּנָף
  choice: oiseau ailé
  rationale: Cette formulation reproduit la caractérisation explicite de l'hébreu tout en restant claire en français.
- source_word: תָּעוּף
  choice: qui vole
  rationale: Le présent exprime naturellement une caractéristique générale de la catégorie.
- source_word: בַּשָּׁמָיִם
  choice: dans le ciel
  rationale: Bien que le nom hébreu soit morphologiquement pluriel, il désigne ici le ciel visible où volent les oiseaux; le singulier est l'expression française courante.
