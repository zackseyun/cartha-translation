base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: fr
  text: Et Yahweh s’est irrité contre moi à cause de vos paroles[a], et il a juré que je ne traverserais pas le Jourdain et que je n’entrerais pas dans la bonne terre que Yahweh, ton Dieu, te donne en héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à cause de vous». Littéralement, l’hébreu dit «à cause de vos paroles».
    reason: Signaler la compréhension contextuelle qui élargit «vos paroles» à la responsabilité des destinataires, tout en conservant dans le texte principal l’élément lexical explicite de l’hébreu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre, conformément à la valeur propre du tétragramme dans le texte hébreu.
- source_word: הִתְאַנֶּף בִּי
  choice: s’est irrité contre moi
  rationale: Le verbe exprime une vive colère; «s’est irrité contre moi» est naturel, digne et respecte la construction avec בִּי.
- source_word: עַל דִּבְרֵיכֶם
  choice: à cause de vous
  rationale: Dans ce contexte, l’expression peut désigner la faute ou l’affaire imputable aux Israélites. Une note conserve le sens littéral «à cause de vos paroles» sans réduire l’ambiguïté.
- source_word: וַיִּשָּׁבַע
  choice: il a juré
  rationale: Rend directement et naturellement le verbe hébreu du serment.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: que je ne traverserais pas le Jourdain
  rationale: La construction infinitive négative énonce ici le contenu du serment concernant Moïse.
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: et que je n’entrerais pas dans le pays
  rationale: «Entrer dans» exprime idiomatiquement le mouvement indiqué par בוא אֶל et maintient le parallélisme.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: le bon pays
  rationale: Traduction directe de l’adjectif טוֹבָה, qui conserve l’évaluation positive du pays sans préciser indûment s’il est agréable ou fertile.
- source_word: נֹתֵן לְךָ
  choice: te donne
  rationale: Le participe hébreu présente le don divin comme actuel ou en cours; le présent français convient naturellement.
- source_word: נַחֲלָה
  choice: en héritage
  rationale: Expression française idiomatique qui préserve l’idée d’un bien attribué et transmis comme possession.
theological_decisions:
- issue: Le rapport entre l’exclusion de Moïse et la conduite d’Israël
  choice: à cause de vous
  alternative: à cause de vos paroles
  rationale: La formulation principale est idiomatique dans le contexte, tandis que la note signale la forme littérale du texte hébreu. Cela préserve la tension sur la responsabilité sans l’expliquer ni la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier dans «ton Dieu» et «te donne» reproduit les formes hébraïques singulières adressées collectivement à Israël.
