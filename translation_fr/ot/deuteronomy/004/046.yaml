base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: fr
  text: de l’autre côté du Jourdain, dans la vallée en face de Beth-Péor, au pays de Sihôn, roi des Amorites, qui habitait à Heshbôn et que Moïse et les fils d’Israël[a] battirent à leur sortie d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Cette expression rend naturellement la région située au-delà du Jourdain selon le point de vue du discours, sans préciser davantage la rive.
- source_word: בַּגַּיְא
  choice: dans la vallée
  rationale: גַּיְא désigne une vallée ou un ravin ; « vallée » convient au contexte topographique et reste naturel en français.
- source_word: מוּל בֵּית פְּעוֹר
  choice: en face de Beth-Péor
  rationale: מוּל indique une position vis-à-vis d’un lieu ; « en face de » est ici une formulation géographique claire.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: au pays de Sihôn
  rationale: אֶרֶץ peut désigner un pays ou un territoire ; « au pays de » conserve la tournure historique et géographique.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: roi des Amorites
  rationale: Le syntagme construit identifie naturellement Sihôn comme roi du peuple amorite.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: qui habitait à Heshbôn
  rationale: Le participe יוֹשֵׁב exprime ici la résidence ; « habitait » est moderne et précis.
- source_word: אֲשֶׁר הִכָּה
  choice: que … battirent
  rationale: Dans ce contexte militaire, נכה désigne l’action de frapper ou de vaincre. « Battirent » exprime idiomatiquement la défaite infligée sans ajouter explicitement la mise à mort.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: et les fils d’Israël
  rationale: La formulation conserve le masculin pluriel explicite et l’expression hébraïque traditionnelle, tout en signalant en note son sens collectif possible.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: à leur sortie d’Égypte
  rationale: L’infinitif construit précédé de בְּ exprime la circonstance temporelle ; cette formulation française est concise et naturelle.
theological_decisions:
- issue: Désignation collective genrée dans וּבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: L’hébreu emploie explicitement « fils de » au masculin pluriel, tout en fonctionnant comme désignation collective du peuple. Le texte conserve la forme et la note donne l’équivalent collectif idiomatique.
translation_notes:
  register: 'Français international moderne, digne et fluide. Les noms propres suivent des translittérations françaises usuelles avec accents : Beth-Péor, Sihôn, Heshbôn. Le verset étant syntaxiquement la suite du verset précédent, il commence par une minuscule.'
