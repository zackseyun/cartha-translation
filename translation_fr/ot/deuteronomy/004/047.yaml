source:
  edition: WLC
  text: וַ/יִּֽירְשׁ֨וּ אֶת אַרְצ֜/וֹ וְ/אֶת אֶ֣רֶץ ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן שְׁנֵי֙ מַלְכֵ֣י הָֽ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִזְרַ֖ח שָֽׁמֶשׁ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: fr
  text: Ils prirent possession de son pays et du pays d’Og, roi du Bashân — les deux rois amoréens qui se trouvaient de l’autre côté du Jourdain[a], du côté du soleil levant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà du Jourdain ». L’expression hébraïque est une formule géographique courante dont le point de vue précis dépend de la perspective du récit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « du côté du lever du soleil », c’est-à-dire vers l’est.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: Ils prirent possession de
  rationale: Dans ce contexte de conquête, ירשׁ désigne la prise de possession d’un territoire, avec parfois l’idée implicite d’en déposséder les occupants. Cette formulation est naturelle en français et évite le sens successoral que pourrait suggérer « hériter ».
- source_word: אַרְצוֹ
  choice: son pays
  rationale: Le suffixe masculin singulier renvoie à Sihôn, mentionné dans le contexte précédent. « Pays » convient ici à un domaine gouverné par un roi et s’accorde avec la reprise parallèle concernant Og.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: le pays d’Og, roi du Bashân
  rationale: La chaîne construite est rendue directement. « Pays » exprime ici le territoire politique d’Og, tandis que « roi du Bashân » conserve son titre.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: les deux rois amoréens
  rationale: Cette formulation française concise identifie Sihôn et Og comme les deux rois appartenant au groupe amoréen, sans alourdir la phrase.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Il s’agit d’une expression géographique conventionnelle dont le point de vue dépend du cadre narratif. La traduction conserve cette relative indétermination.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: du côté du soleil levant
  rationale: Cette expression préserve l’image concrète du soleil levant tout en indiquant clairement la direction de l’est.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le tiret marque l’apposition explicative concernant Sihôn et Og sans ajouter un verbe absent de l’hébreu. Les noms « Bashân » et « Amoréens » suivent des formes françaises bibliques largement reconnues.
