source:
  edition: WLC
  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: fr
  text: de peur que vous ne vous corrompiez et ne vous fassiez une image sculptée[a], une représentation de quelque figure que ce soit, sous la forme d’un mâle ou d’une femelle—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur que vous n’agissiez de manière corrompue et ne vous fassiez une image sculptée, une forme de quelque figure que ce soit, à la ressemblance d’un mâle ou d’une femelle ».'
    reason: Signale une traduction plus formelle des termes hébreux superposés et l’autre valeur possible de תַּשְׁחִתוּן.
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Introduit naturellement en français un avertissement contre une conséquence redoutée, sans affaiblir la portée préventive de l’hébreu.
- source_word: תַּשְׁחִתוּן
  choice: vous ne vous corrompiez
  rationale: Le hiphil de שׁחת exprime ici une conduite qui corrompt et mène à la ruine; la tournure pronominale française conserve à la fois l’implication active des destinataires et l’effet sur eux-mêmes.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: en vous faisant
  rationale: Rend le lien circonstanciel avec l’acte corrupteur ainsi que la nuance réfléchie-bénéfactive de לָכֶם.
- source_word: פֶּסֶל
  choice: une statue sculptée
  rationale: Désigne une représentation façonnée, notamment par taille ou sculpture. Cette expression est concrète et actuelle, sans employer d’emblée le terme interprétatif « idole ».
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: représentant une forme quelconque
  rationale: La combinaison accumule les notions de représentation et de forme. Cette formulation française évite une répétition lourde tout en laissant סמל désigner une figure ou forme représentée, sans en réduire ici le sens à « idole ».
- source_word: תַּבְנִית
  choice: celle d’un être
  rationale: Le pronom reprend « forme » et rend la notion de modèle ou de ressemblance; l’ajout d’« être » permet de rattacher naturellement les catégories mâle et femelle sans les limiter aux humains.
- source_word: זָכָר אֹו נְקֵבָה
  choice: mâle ou femelle
  rationale: Conserve les termes sexuels généraux de l’hébreu, qui ne signifient pas spécifiquement « homme ou femme ».
theological_decisions:
- issue: Portée du vocabulaire relatif aux représentations interdites
  choice: « statue sculptée » pour פֶּסֶל et « forme quelconque » pour תְּמוּנַת כָּל סָמֶל
  alternative: « image taillée » et « n’importe quelle idole »
  rationale: Le contexte concerne bien l’idolâtrie, mais les termes hébreux décrivent aussi concrètement la fabrication et la configuration d’une représentation. Le choix retenu préserve l’accumulation lexicale et évite de résoudre par avance l’étendue de סמל.
- issue: Référent de « mâle ou femelle »
  choice: Employer « être mâle ou femelle »
  alternative: Employer « homme ou femme »
  rationale: Les mots hébreux sont des désignations sexuelles générales; le contexte qui se poursuit avec les animaux invite à ne pas restreindre arbitrairement le verset aux figures humaines.
translation_notes:
  register: Français international moderne, digne et accessible. « De peur que… ne » convient au registre biblique sans être archaïque. Le tiret final maintient la continuité syntaxique avec les versets suivants.
