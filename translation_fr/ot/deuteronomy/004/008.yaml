source:
  edition: WLC
  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: fr
  text: Et quelle grande nation possède des prescriptions et des règles aussi justes que toute cette loi que je place aujourd’hui devant vous ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « instruction » au lieu de « loi » (hébreu : torah), bien que le contexte soit ici expressément juridique : « prescriptions et règles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: Et quelle … ?
  rationale: La question rhétorique hébraïque signifie littéralement « Et qui ? », mais, devant גּוֹי, « Et quelle nation ? » est naturel en français et conserve la comparaison avec le verset précédent.
- source_word: גּוֹי גָּדוֹל
  choice: grande nation
  rationale: Cette expression désigne ici un peuple envisagé comme collectivité nationale; « grande nation » rend directement le sens politique et collectif.
- source_word: חֻקִּים
  choice: prescriptions
  rationale: Le terme désigne des dispositions établies. « Prescriptions » conserve la nuance juridique sans employer le mot « lois », réservé ici à תּוֹרָה.
- source_word: וּמִשְׁפָּטִים
  choice: et des règles
  rationale: Dans ce contexte juridique, מִשְׁפָּטִים désigne des règles ou décisions de droit. « Règles » est clair en français moderne et reste distinct de « prescriptions ».
- source_word: צַדִּיקִם
  choice: aussi justes
  rationale: L’adjectif qualifie les prescriptions et les règles comme conformes à la justice et au droit; « justes » exprime naturellement cette dimension morale et juridique.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: que toute cette loi
  rationale: La préposition comparative est rendue par la construction française « aussi… que ». Ici, תּוֹרָה vise l’ensemble légal présenté, ce qui justifie « loi », tandis que son sens plus large est signalé en note.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם
  choice: que je place … devant vous
  rationale: « Placer devant » restitue naturellement l’expression hébraïque consistant à donner ou présenter quelque chose devant quelqu’un.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français moderne et direct, qui maintient l’insistance temporelle.
theological_decisions:
- issue: Sens de תּוֹרָה
  choice: loi
  alternative: instruction
  rationale: Le champ sémantique de תּוֹרָה inclut « instruction », mais le contexte immédiat évoque expressément des prescriptions et des règles. « Loi » convient donc le mieux ici, sans effacer le sens plus large, conservé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et la comparaison avec les autres nations sont conservées; le vocabulaire juridique évite l’archaïsme tout en distinguant les deux termes hébreux.
