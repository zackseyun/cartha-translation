  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: fr
  text: la forme[a] de toute créature qui rampe sur le sol, la forme de tout poisson qui est dans les eaux sous la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ressemblance » ou « image » ; le mot hébreu תַּבְנִית désigne ici une forme visible ou représentée.
    reason: lexical_alternative
  - marker: b
    text: L’expression « sous la terre » reprend une formule biblique désignant les eaux situées au-dessous de la terre ferme ; voir la formulation de l’interdiction des images en Exode 20.4.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: forme
  rationale: Dans ce contexte d’interdiction des représentations idolâtres, le terme désigne la forme visible ou représentée d’un être. « Forme » conserve l’étendue du mot sans préciser indûment le support ou la fabrication.
- source_word: כָּל
  choice: toute / tout
  rationale: Avec les noms singuliers « créature » et « poisson », cette formulation exprime naturellement en français la portée distributive de l’hébreu.
- source_word: רֹמֵשׂ
  choice: créature qui rampe
  rationale: Le participe désigne une créature se déplaçant au ras du sol. Cette expression est claire en français moderne et évite le sens péjoratif que pourrait prendre « chose rampante ».
- source_word: בָּאֲדָמָה
  choice: sur le sol
  rationale: אֲדָמָה désigne ici la surface terrestre sur laquelle ces créatures se déplacent; « sur le sol » est précis et idiomatique.
- source_word: דָּגָה
  choice: poisson
  rationale: Le nom fonctionne collectivement en hébreu; le singulier français convient après « tout » et conserve la catégorie zoologique du texte.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: qui vit dans les eaux
  rationale: « Qui vit » rend explicitement et naturellement la relation elliptique exprimée par « qui [est] dans les eaux », sans en modifier le sens. Le pluriel « eaux » reflète מַיִם.
- source_word: מִתַּחַת לָאָרֶץ
  choice: sous la terre
  rationale: La traduction littérale préserve l’expression biblique traditionnelle et son écho avec l’interdiction des images en Exode 20.4, sans moderniser silencieusement la cosmologie du texte.
theological_decisions:
- issue: Vocabulaire des représentations dans le contexte de l’idolâtrie
  choice: la forme de toute…
  alternative: la ressemblance de toute… / l’image de toute…
  rationale: « Forme » rend תַּבְנִית sans réduire le référent à une statue ou à un type précis d’idole. La portée anti-idolâtre découle du contexte et n’est pas ajoutée au lexique du verset.
- issue: Expression cosmologique מִתַּחַת לָאָרֶץ
  choice: sous la terre
  alternative: au-dessous du pays / sous le sol
  rationale: La formulation conserve l’ambiguïté et l’imagerie ancienne du texte ainsi que son lien intertextuel avec Exode 20.4, plutôt que de les résoudre par une paraphrase moderne.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « la forme » reproduit la structure hébraïque. « Créature qui rampe » reste accessible sans être familier; « eaux sous la terre » conserve volontairement l’expression cosmologique et intertextuelle.
