  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: fr
  text: 'J’ai donc prié Yahweh en disant : « Seigneur Yahweh, ne détruis pas ton peuple ni ton héritage, que tu as rachetés par ta grandeur[a], que tu as fait sortir d’Égypte d’une main forte[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par ta grande puissance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’une main puissante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל יְהוָה וָאֹמַר
  choice: J’ai donc prié Yahweh en disant
  rationale: Le waw consécutif fait progresser le récit. « Donc » exprime naturellement le lien avec le contexte, et « en disant » réunit sans lourdeur les deux verbes hébreux.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Cette formulation conserve les deux éléments du titre hébreu et rend explicitement le nom divin, sans créer en français la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: אַל תַּשְׁחֵת
  choice: ne détruis pas
  rationale: Le jussif négatif exprime une supplication pressante. « Détruire » garde la force du verbe שׁחת sans préciser indûment la manière.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: ton peuple ni ton héritage
  rationale: Après une négation, « ni » est idiomatique en français. « Héritage » préserve l’image d’Israël comme part appartenant à Yahweh.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: que tu as rachetés
  rationale: « Racheter » convient au sens libérateur de פדה dans le contexte de l’exode. L’accord pluriel rattache le relatif aux deux désignations coordonnées du même peuple.
- source_word: בְּגָדְלֶךָ
  choice: par ta grandeur
  rationale: Cette traduction conserve le nom abstrait גֹּדֶל et évite de réduire implicitement la grandeur divine à la seule puissance.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: que tu as fait sortir d’Égypte
  rationale: Formulation française directe qui préserve l’expression historique et théologique courante de l’exode.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main forte
  rationale: Rendu proche de l’image hébraïque. « Forte » traduit directement חֲזָקָה, tandis que « puissante » constitue une autre formulation naturelle possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération garde visible le nom propre d’alliance employé dans le texte hébreu.
- issue: Rapport entre « peuple » et « héritage »
  choice: Deux désignations coordonnées du même peuple
  alternative: Deux objets distincts de la supplication
  rationale: Dans ce contexte, « ton héritage » décrit vraisemblablement le peuple comme possession attribuée à Yahweh. La traduction conserve néanmoins les deux substantifs et leur tension métaphorique.
- issue: Portée de בְּגָדְלֶךָ
  choice: par ta grandeur
  alternative: par ta grande puissance
  rationale: Le texte nomme la « grandeur » de Yahweh sans en limiter explicitement le sens à sa puissance; la formulation retenue préserve cette amplitude théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les images bibliques de l’héritage et de la main forte, tout en évitant les tournures excessivement archaïques.
