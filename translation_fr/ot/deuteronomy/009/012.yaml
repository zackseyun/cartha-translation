    issue: Le tétragramme יהוה est rendu par « L’Éternel ».
    rationale: « L’Éternel » est un titre interprétatif traditionnel plutôt qu’une représentation du nom propre. La source emploie יהוה et l’audit anglais adopte « Yahweh » ; « Yahvé » préserve donc mieux le nom divin en français.
  - severity: low
    issue: '« Statue » spécifie davantage la forme de l’objet que le terme hébreu. '
    rationale: מַסֵּכָה désigne une image fabriquée par moulage/coulée, sans imposer qu’il s’agisse précisément d’une statue. « Image » maintient cette neutralité.
