  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: fr
  text: 'Yahvé me dit : « Lève-toi, descends vite d’ici, car ton peuple, que tu as fait sortir d’Égypte, s’est corrompu. Ils se sont vite détournés de la voie que je leur avais prescrite ; ils se sont fait une image en métal coulé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une image de métal fondu ». Le terme hébreu désigne une image fabriquée en coulant du métal.
    reason: Précision lexicale sur le procédé de fabrication indiqué par מַסֵּכָה.
lexical_decisions:
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rend le nom divin selon l’usage français biblique largement intelligible, tout en le distinguant du titre courant « Seigneur ».
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Lève-toi, descends vite d’ici
  rationale: Conserve la suite abrupte des impératifs, le mouvement vers le bas et l’urgence exprimée par מַהֵר.
- source_word: שִׁחֵת
  choice: s’est corrompu
  rationale: Le singulier s’accorde avec le collectif « peuple » et exprime la dégradation morale indiquée par le piel, sans réduire le sens à une seule action précise.
- source_word: עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: ton peuple, que tu as fait sortir d’Égypte
  rationale: Préserve l’attribution rhétorique du peuple à Moïse et le causatif du verbe « sortir ».
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Ils se sont vite détournés de la voie
  rationale: Reproduit la répétition de l’urgence et l’image d’un écart hors de la voie prescrite.
- source_word: אֲשֶׁר צִוִּיתִם
  choice: que je leur avais prescrite
  rationale: Formulation française naturelle qui rattache le commandement à la « voie » sans laisser entendre que la voie elle-même est l’objet personnel du verbe.
- source_word: מַסֵּכָה
  choice: une statue en métal fondu
  rationale: Exprime concrètement une représentation fabriquée par coulée de métal, plutôt que de généraliser immédiatement par « idole ».
theological_decisions:
- issue: Mise à distance rhétorique dans « ton peuple »
  choice: Conserver « ton peuple, que tu as fait sortir d’Égypte »
  alternative: Harmoniser avec « mon peuple, que j’ai fait sortir d’Égypte »
  rationale: La formulation hébraïque attribue volontairement le peuple et sa sortie à Moïse dans le cadre de la réprimande divine ; cette tension ne doit pas être atténuée.
- issue: Nature de מַסֵּכָה
  choice: une statue en métal fondu
  alternative: une idole
  rationale: Le terme décrit le mode de fabrication de l’objet. La traduction conserve ce détail concret sans ajouter comme sens lexical premier une qualification théologique générique.
- issue: Aspect de שִׁחֵת
  choice: s’est corrompu
  alternative: a agi de manière corrompue
  rationale: Le contexte d’apostasie permet d’exprimer l’entrée du peuple dans la corruption, tout en conservant le caractère collectif du sujet.
translation_notes:
  register: Français international actuel, digne et direct. Les impératifs restent brefs et pressants. « L’Éternel » suit une convention française claire pour le tétragramme ; « statue en métal fondu » évite l’archaïsme de « image de fonte » tout en conservant le sens matériel.
