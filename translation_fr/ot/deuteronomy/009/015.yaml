translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’enchaînement hébraïque, tandis que « je tenais des deux mains » évite une tournure littérale peu naturelle. Le point-virgule clarifie les actions coordonnées sans effacer leur continuité narrative.
