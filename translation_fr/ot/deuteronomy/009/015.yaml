- from: Je me suis donc retourné et je suis descendu de la montagne, et la montagne était embrasée par le feu[a] ; je tenais des deux mains les deux tablettes de l’alliance[b].
  to: Puis je me suis retourné et je suis descendu de la montagne, et la montagne était en feu[a], et je portais dans mes deux mains les deux tablettes de l’alliance[b].
