  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: fr
  text: Puis je me suis retourné et je suis descendu de la montagne, et la montagne était en feu[a], et je portais dans mes deux mains les deux tablettes de l’alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « tandis que la montagne était en feu ». La conjonction hébraïque exprime une coordination simple, mais le contexte permet de comprendre que la montagne brûlait pendant la descente de Moïse.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « sur mes deux mains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Je me suis donc retourné
  rationale: Le verbe פנה au wayyiqtol exprime ici l’action successive de se retourner. « Donc » rend naturellement la progression du récit sans alourdir la coordination.
- source_word: וָאֵרֵד מִן הָהָר
  choice: je suis descendu de la montagne
  rationale: ירד signifie « descendre », et הָהָר désigne la montagne précise où se trouvait Moïse. Cette formulation est directe et idiomatique en français.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: et la montagne était embrasée par le feu
  rationale: La traduction conserve la coordination explicite וְ tout en rendant naturellement בֹּעֵר בָּאֵשׁ, littéralement « brûlant dans/par le feu ». « Embrasée par le feu » maintient l’intensité de l’expression hébraïque.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: les deux tablettes de l’alliance
  rationale: לֻחֹת désigne ici les tablettes de pierre, et הַבְּרִית signifie « l’alliance ». L’expression est précise et bien établie en français biblique courant.
- source_word: עַל שְׁתֵּי יָדָי
  choice: je tenais des deux mains
  rationale: La préposition עַל signifie littéralement « sur », mais l’expression décrit la manière dont Moïse portait les tablettes. « Je tenais des deux mains » communique clairement ce sens tout en conservant la mention explicite des deux mains.
