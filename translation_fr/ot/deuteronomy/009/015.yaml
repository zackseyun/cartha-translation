  - severity: low
    issue: « embrasée par le feu »
    rationale: Cette tournure est compréhensible, mais elle est moins idiomatique que « la montagne était en feu » et présente le feu comme agent, alors que l’hébreu décrit directement l’état de la montagne.
  - severity: low
    issue: « je tenais des deux mains les deux tablettes »
    rationale: La phrase est possible, mais l’expression peut surtout décrire la prise à deux mains. « Je portais dans mes deux mains les deux tablettes » exprime plus directement la localisation/portage indiquée par עַל שְׁתֵּי יָדָי.
