base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: fr
  text: Au terme de quarante jours et de quarante nuits, Yahweh me donna les deux tablettes de pierre, les tablettes de l’alliance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[intégré à la transition temporelle]'
  rationale: Dans cette construction narrative, וַיְהִי introduit l’événement qui suit. Le français naturel n’exige pas la formule lourde « et il arriva ».
- source_word: מִקֵּץ
  choice: au terme de
  rationale: Cette expression marque le point où la période indiquée arrive à son terme, avec plus de précision que le simple « après ».
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: quarante jours et quarante nuits
  rationale: La formulation française reproduit directement l’expression temporelle hébraïque.
- source_word: נָתַן
  choice: donna
  rationale: Le verbe courant « donner » restitue le sens simple de נָתַן sans ajouter l’idée de remise officielle ou de livraison.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Avec « donner », le pronom indirect antéposé est la tournure française naturelle correspondant à אֵלַי.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: les deux tablettes de pierre
  rationale: « Les deux » exprime la paire définie par le contexte; « tablettes de pierre » indique clairement le matériau dans un français actuel.
- source_word: לֻחוֹת הַבְּרִית
  choice: les tablettes de l’alliance
  rationale: La répétition de « tablettes » est conservée comme dans l’apposition hébraïque, au lieu d’être fondue dans la proposition précédente.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
translation_notes:
  register: 'Français international moderne, clair et digne. Le passé simple convient au récit écrit. « Au terme de » préserve la limite temporelle exprimée par מִקֵּץ. Aucune note n’est retenue: la variante signalée dans la couche anglaise ne correspond pas à une différence de sens identifiable dans le texte hébreu fourni.'
