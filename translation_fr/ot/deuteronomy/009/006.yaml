  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: fr
  text: Sache donc que ce n’est pas à cause de ta justice que Yahweh ton Dieu te donne ce bon pays pour que tu en prennes possession[a], car tu es un peuple à la nuque raide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour que tu en hérites ». Le verbe hébreu peut désigner le fait de recevoir un héritage, mais, dans le Deutéronome, il comporte souvent l’idée de prendre possession du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Sache donc
  rationale: Le qal accompli à la 2e personne du masculin singulier a ici une valeur exhortative. « Donc » rend naturellement le lien déductif avec ce qui précède.
- source_word: לֹא בְצִדְקָתְךָ
  choice: ce n’est pas à cause de ta justice
  rationale: La préposition ב indique ici le fondement ou le motif. Cette formulation nie clairement que la justice d’Israël soit la raison du don du pays.
- source_word: צִדְקָה
  choice: justice
  rationale: Dans ce contexte moral et relationnel, « justice » désigne la conformité à ce qui est droit. Le terme français conserve le vocabulaire biblique sans ajouter l’idée plus interprétative de mérite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel, conformément à l’orientation du projet.
- source_word: נֹתֵן לְךָ
  choice: te donne
  rationale: Le participe exprime une action présente ou imminente. Le présent français convient au moment où Israël s’apprête à entrer dans le pays.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: ce bon pays
  rationale: « Pays » est naturel en français pour un territoire habitable et promis; le démonstratif et l’évaluation positive sont conservés.
- source_word: לְרִשְׁתָּהּ
  choice: pour que tu en prennes possession
  rationale: ירשׁ désigne fréquemment, dans le Deutéronome, l’entrée en possession effective du pays. La tournure explicite aussi naturellement le suffixe féminin renvoyant au pays.
- source_word: כִּי
  choice: car
  rationale: La seconde occurrence introduit l’explication qui appuie l’affirmation précédente.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: un peuple à la nuque raide
  rationale: Cette traduction conserve l’image hébraïque de l’obstination et de la rébellion, plutôt que de la remplacer par le seul terme interprétatif « obstiné ».
theological_decisions:
- issue: Raison pour laquelle Israël reçoit le pays
  choice: Le verset nie que la justice propre d’Israël soit le fondement du don accordé par Yahweh.
  alternative: Réduire le propos à une exhortation générale à l’humilité.
  rationale: L’hébreu oppose explicitement la prétendue justice d’Israël à l’acte divin de donner le pays, puis rappelle l’obstination du peuple. La traduction maintient cette tension sans développer une doctrine au-delà du verset.
- issue: Adresse collective au singulier
  choice: Employer « tu » tout en désignant Israël comme « un peuple ».
  alternative: Passer au pluriel avec « vous » ou « vous tous ».
  rationale: L’hébreu s’adresse à Israël collectivement au masculin singulier; le français peut préserver cette personnification collective.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’adresse collective au singulier ainsi que la métaphore hébraïque de la nuque raide. « Pays » est préféré à « terre » pour la fluidité, tout en gardant le sens territorial du contexte.
