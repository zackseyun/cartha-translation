  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: fr
  text: 'Souviens-toi, ne l’oublie pas : dans le désert, tu as provoqué la colère de Yahweh, ton Dieu[a]. Depuis le jour où tu es sorti du pays d’Égypte jusqu’à votre arrivée en ce lieu, vous avez été rebelles envers Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as irrité Yahweh, ton Dieu, dans le désert ».'
    reason: Alternative lexicale pour la forme causative de קצף.
  - marker: b
    text: 'Littéralement : « vous avez été rebelles avec Yahweh »; dans ce contexte, l’expression a un sens hostile : « envers » ou « contre Yahweh ».'
    reason: Préserve le sens ordinaire de עִם (« avec ») tout en indiquant sa valeur contextuelle adversative.
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Souviens-toi, ne l’oublie pas
  rationale: Conserve les deux injonctions hébraïques et leur effet d’insistance, dans une formulation française naturelle.
- source_word: אֵת אֲשֶׁר הִקְצַפְתָּ
  choice: tu as provoqué la colère de
  rationale: Rend la valeur causative du hiphil de קצף sans affaiblir l’intensité de l’expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour l’espace aride et inhabité du récit de l’Exode, sans imposer l’idée exclusive d’une étendue de sable.
- source_word: לְמִן הַיּוֹם אֲשֶׁר
  choice: Depuis le jour où
  rationale: Exprime naturellement le point de départ de la période qui se prolonge jusqu’au lieu présent.
- source_word: יָצָאתָ מֵאֶרֶץ מִצְרַיִם
  choice: tu es sorti du pays d’Égypte
  rationale: Reproduit la formule de la sortie d’Égypte et le singulier de l’adresse hébraïque.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: jusqu’à votre arrivée en ce lieu
  rationale: Conserve le passage du singulier au pluriel dans le texte source tout en restant idiomatique en français.
- source_word: מַמְרִים הֱיִיתֶם
  choice: vous avez été rebelles
  rationale: Rend l’état ou la conduite persistante décrite par le participe, sur toute la période qui vient d’être évoquée.
- source_word: עִם יְהוָה
  choice: envers Yahweh
  rationale: Dans ce contexte de rébellion, « envers » transmet la relation hostile sans effacer complètement la formulation inhabituelle de l’hébreu, littéralement « avec ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le Tétragramme comme nom personnel; sa transcription préserve cette donnée sans substituer un titre.
- issue: Relation exprimée par עִם après le verbe de rébellion
  choice: rebelles envers Yahweh
  alternative: rebelles avec Yahweh / en rébellion contre Yahweh
  rationale: Le sens contextuel est adversatif, mais une note conserve le sens lexical ordinaire « avec » afin de ne pas masquer la tension de l’expression hébraïque.
- issue: Alternance entre l’adresse au singulier et au pluriel
  choice: tu es sorti… votre arrivée… vous avez été rebelles
  alternative: uniformiser toute l’adresse au pluriel ou au singulier
  rationale: L’hébreu passe explicitement du masculin singulier au masculin pluriel; la traduction maintient ce changement, qui peut faire entendre Israël à la fois comme unité collective et comme communauté.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief la double injonction initiale. Le passage du singulier au pluriel est volontairement conservé d’après l’hébreu; « en ce lieu » maintient un registre biblique sobre sans archaïsme marqué.
