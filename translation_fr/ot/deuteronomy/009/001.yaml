source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: fr
  text: 'Écoute, Israël : aujourd’hui, tu vas traverser le Jourdain pour entrer et déposséder des nations plus grandes et plus puissantes que toi, avec de grandes villes fortifiées jusqu’au ciel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « jusqu’au ciel » est une hyperbole qui évoque des fortifications d’une hauteur impressionnante.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif singulier s’adresse à Israël comme à une entité collective. « Écoute » rend naturellement l’appel solennel caractéristique du Deutéronome.
- source_word: עֹבֵר הַיּוֹם
  choice: aujourd’hui, tu vas traverser
  rationale: Le participe accompagné de « aujourd’hui » exprime une action imminente. Cette tournure est idiomatique en français et maintient l’accent temporel.
- source_word: אֶת־הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme française consacrée du nom géographique, sans ajout de « fleuve », absent de l’hébreu.
- source_word: לָבֹא
  choice: pour entrer dans le pays
  rationale: L’infinitif désigne l’entrée après la traversée du Jourdain. « dans le pays » explicite en français la destination immédiatement présupposée par le contexte, sans identifier davantage le territoire.
- source_word: לָרֶשֶׁת
  choice: déposséder
  rationale: Dans ce contexte de conquête, ירשׁ désigne la prise de possession aux dépens des occupants antérieurs. Avec « nations » pour objet, « déposséder » convient mieux que « hériter ».
- source_word: גּוֹיִם
  choice: des nations
  rationale: Rendu courant des groupes nationaux distincts dans le Deutéronome.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: plus grandes et plus puissantes que toi
  rationale: Conserve les deux comparatifs, portant respectivement sur la grandeur et la puissance, ainsi que l’adresse collective au singulier.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: des villes grandes et fortifiées
  rationale: La relative « qui ont » clarifie le rapport entre les nations et leurs villes, tandis que les deux qualificatifs restent proches de l’ordre hébreu.
- source_word: בַּשָּׁמָיִם
  choice: jusqu’au ciel
  rationale: Expression française naturelle qui préserve l’image hyperbolique de fortifications extrêmement hautes.
theological_decisions:
- issue: Portée de ירשׁ dans le contexte de la conquête
  choice: déposséder des nations
  alternative: prendre possession de nations / hériter
  rationale: Le choix conserve la dimension concrète du remplacement des occupants sans atténuer la tension morale et théologique du récit. Une note n’est pas nécessaire, car le sens contextuel est intelligible en français.
- issue: Description hyperbolique des fortifications
  choice: fortifiées jusqu’au ciel
  alternative: très fortement fortifiées / fortifiées jusqu’aux cieux
  rationale: La formulation garde l’image rhétorique du texte au lieu de la réduire à une explication en prose.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme peuple collectif. La syntaxe a été légèrement explicitée par « qui ont » afin de relier clairement les villes aux nations.
