source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: fr
  text: Yahweh me donna les deux tables de pierre, écrites du doigt de Dieu, et sur elles figuraient toutes les paroles que Yahweh vous avait dites sur la montagne, du milieu du feu, le jour de l’assemblée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן exprime ici simplement l’action de donner; « donna » est naturel et fidèle dans ce récit au passé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription « Yahweh » préserve le nom divin personnel présent dans le texte hébreu.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: les deux tables de pierre
  rationale: Cette formulation française courante conserve précisément le nombre, l’objet et sa matière.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: écrites du doigt de Dieu
  rationale: « Écrites » rend le participe passif, tandis que « du doigt de Dieu » conserve l’image anthropomorphique et la valeur instrumentale de la préposition בְּ.
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: et sur elles figuraient toutes les paroles
  rationale: « Figuraient » restitue naturellement en français la proposition nominale hébraïque tout en maintenant l’idée que les paroles se trouvaient sur les tables.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: que Yahweh vous avait dites
  rationale: Le plus-que-parfait situe ces paroles avant le don des tables. En français, « vous avait dites » exprime naturellement l’acte de parler adressé au peuple, là où une reproduction littérale de עִם par « avec » serait maladroite.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: Cette traduction conserve la précision spatiale et la solennité de l’expression hébraïque.
- source_word: בְּיוֹם הַקָּהָל
  choice: le jour de l’assemblée
  rationale: « Assemblée » rend le rassemblement collectif d’Israël sans introduire un vocabulaire confessionnel plus tardif.
theological_decisions:
- issue: Expression anthropomorphique de l’action divine
  choice: écrites du doigt de Dieu
  alternative: écrites par la puissance de Dieu
  rationale: Le texte évoque explicitement le doigt de Dieu. L’image est donc conservée plutôt que remplacée par une explication abstraite.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie le nom personnel divin; sa transcription préserve cette distinction au lieu de le remplacer par un titre.
- issue: Portée de דִּבֶּר ... עִמָּכֶם
  choice: que Yahweh vous avait dites
  alternative: que Yahweh avait prononcées avec vous
  rationale: La tournure française choisie rend idiomatiquement une parole adressée au peuple. Elle n’implique ni dialogue détaillé ni parole réciproque que le contexte n’explicite pas.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure cumulative et solennelle de l’hébreu sans archaïsmes; aucune note n’est nécessaire, car les principales nuances peuvent être rendues directement dans le texte.
