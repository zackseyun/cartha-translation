source:
  edition: WLC
  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: fr
  text: Souviens-toi de tes serviteurs, Abraham, Isaac et Jacob. Ne prête pas attention à l’obstination de ce peuple[a], ni à sa méchanceté, ni à son péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la dureté de ce peuple » ; le terme désigne ici son obstination.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: L’impératif de זכר, adressé à Dieu dans l’intercession de Moïse, se rend naturellement par « Souviens-toi » dans le contexte d’une prière liée à l’alliance.
- source_word: לַעֲבָדֶיךָ
  choice: tes serviteurs
  rationale: עבד peut désigner un serviteur ou un esclave. Ici, le mot qualifie honorifiquement les patriarches dans leur relation avec Dieu ; « serviteurs » convient au contexte sans mettre indûment l’accent sur leur statut social.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaac et Jacob
  rationale: Les noms propres suivent leur forme française biblique usuelle.
- source_word: אַל תֵּפֶן אֶל
  choice: Ne prête pas attention à
  rationale: פנה avec אֶל signifie littéralement « se tourner vers », mais exprime ici le fait de considérer ou de prendre en compte. « Ne prête pas attention à » communique clairement ce sens dans une prière d’intercession.
- source_word: קְשִׁי
  choice: l’obstination
  rationale: Le nom désigne la dureté ou l’obstination. « Obstination » exprime clairement la résistance morale sans importer l’image distincte du « cou raide » employée ailleurs.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: עם signifie couramment « peuple » et le démonstratif est conservé.
- source_word: רִשְׁעוֹ
  choice: sa méchanceté
  rationale: רשע désigne ici la conduite moralement mauvaise. Le suffixe singulier s’accorde naturellement en français avec le collectif singulier « peuple ».
- source_word: חַטָּאתוֹ
  choice: son péché
  rationale: חטאת désigne ici le péché du peuple. Le singulier hébreu et son suffixe collectif sont conservés naturellement par « son péché ».
theological_decisions:
- issue: Sens de עבד appliqué aux patriarches
  choice: tes serviteurs
  alternative: tes esclaves
  rationale: Dans cette prière, le terme sert de désignation honorifique et relationnelle d’Abraham, d’Isaac et de Jacob devant Dieu. « Serviteurs » respecte ce contexte sans effacer le rapport d’appartenance et d’obéissance exprimé par le terme.
- issue: Interprétation de אַל תֵּפֶן אֶל dans l’intercession
  choice: Ne prête pas attention à
  alternative: Ne regarde pas / Ne considère pas
  rationale: La formulation demande à Dieu de ne pas prendre en compte les fautes du peuple. Elle conserve la portée de l’expression sans trancher au-delà de ce que dit le texte sur la manière dont Dieu « se souvient » ou « considère ».
- issue: Suffixes singuliers renvoyant au peuple collectif
  choice: sa méchanceté… son péché
  alternative: leur méchanceté… leur péché
  rationale: Le français emploie normalement le singulier avec « ce peuple ». Ce choix grammatical maintient la référence collective sans modifier la portée morale du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « ni à » reproduit la structure insistante de l’hébreu. Le tutoiement correspond à l’adresse directe à Dieu, habituelle dans la traduction biblique française contemporaine.
