  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: fr
  text: Alors j’ai saisi les deux tablettes, je les ai jetées de mes deux mains et je les ai brisées sous vos yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: j’ai saisi
  rationale: Le verbe תפשׂ exprime le fait de prendre ou de tenir fermement. « J’ai saisi » rend naturellement l’action physique sans lui ajouter une violence excessive.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: les deux tablettes
  rationale: לֻחוֹת désigne les tablettes de l’alliance déjà connues par le contexte. Le matériau n’étant pas précisé dans ce verset, « de pierre » n’est pas ajouté.
- source_word: וָאַשְׁלִכֵם
  choice: je les ai jetées
  rationale: Le verbe שלך signifie jeter ou lancer. « Jeter » est direct, courant et fidèle au mouvement décrit.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: de mes deux mains
  rationale: Cette formulation conserve l’insistance hébraïque sur les deux mains, tout en restant idiomatique en français.
- source_word: וָאֲשַׁבְּרֵם
  choice: je les ai brisées
  rationale: שׁבר signifie briser ou casser. « Brisées » est précis et naturel pour des tablettes, sans préciser au-delà du texte qu’elles auraient été entièrement réduites en éclats.
- source_word: לְעֵינֵיכֶם
  choice: sous vos yeux
  rationale: L’expression idiomatique signifie en présence et à la vue des destinataires. « Sous vos yeux » en restitue la force visuelle dans un français actuel.
theological_decisions: []
