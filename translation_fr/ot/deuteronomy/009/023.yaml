source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: fr
  text: 'Quand Yahweh vous a envoyés de Qadesh-Barnéa en disant : « Montez et prenez possession du pays que je vous ai donné », vous vous êtes rebellés contre l’ordre de Yahweh votre Dieu[a] : vous ne lui avez pas fait confiance[b] et vous n’avez pas écouté sa voix[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « contre la bouche de Yahweh votre Dieu », expression qui désigne ici son ordre ou sa parole.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous ne l’avez pas cru ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vous n’avez pas obéi à sa voix », c’est-à-dire « vous ne lui avez pas obéi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: Quand ... a envoyés
  rationale: L’infinitif construit précédé de ב introduit une circonstance temporelle. « Quand » est naturel en français; le waw n’exige pas ici un « et » initial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin יהוה, plutôt que substitution par un titre.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Qadesh-Barnéa
  rationale: Transcription française moderne du toponyme composé.
- source_word: עֲלוּ וּרְשׁוּ
  choice: Montez et prenez possession
  rationale: « Montez » conserve le mouvement exprimé par עלה; « prenez possession » rend clairement ירש dans le contexte de l’entrée dans le pays.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « pays » est plus idiomatique en français que « terre », tout en conservant la référence au territoire promis.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: que je vous ai donné
  rationale: Le parfait présente le don comme accordé et certain; le passé composé en exprime naturellement la portée actuelle.
- source_word: וַתַּמְרוּ אֶת־פִּי
  choice: vous vous êtes rebellés contre l’ordre
  rationale: מרה exprime la rébellion, tandis que « la bouche de » est ici un idiome hébreu désignant la parole autoritative ou l’ordre.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: vous ne lui avez pas fait confiance
  rationale: Le hiphil de אמן avec ל peut exprimer le fait de croire quelqu’un ou de lui faire confiance. Dans ce contexte de refus d’avancer sur sa parole, « faire confiance » rend bien la nuance sans la réduire à un assentiment intellectuel.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: vous n’avez pas écouté sa voix
  rationale: La formulation conserve l’image auditive de שׁמע בקול tout en laissant perceptible son implication d’obéissance.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. Sa transcription préserve cette donnée sans le remplacer par un titre.
- issue: Nuance de הֶאֱמַנְתֶּם לוֹ
  choice: vous ne lui avez pas fait confiance
  alternative: vous ne l’avez pas cru
  rationale: Les deux sens sont possibles. « Faire confiance » convient au contexte de la promesse et du commandement divins, tandis qu’une note signale l’autre rendu.
- issue: Portée de שְׁמַעְתֶּם בְּקֹלוֹ
  choice: vous n’avez pas écouté sa voix
  alternative: vous ne lui avez pas obéi
  rationale: Le texte principal préserve l’expression hébraïque intelligible en français; la note explicite sa valeur idiomatique d’obéissance.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct est conservé; les idiomes hébreux sont rendus clairement dans le texte et documentés en notes lorsque leur forme ou leur nuance mérite d’être signalée.
