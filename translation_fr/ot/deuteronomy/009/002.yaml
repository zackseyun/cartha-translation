  text: עַֽם גָּד֥וֹל וָ/רָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֨עְתָּ֙ וְ/אַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִ/פְנֵ֖י בְּנֵ֥י עֲנָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: fr
  text: 'un peuple nombreux et de haute stature[a], les fils d’Anak, que tu connais et dont tu as entendu dire : « Qui peut résister aux fils d’Anak ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Anakites ». L’hébreu dit littéralement « les fils d’Anak ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: peuple
  rationale: עַם désigne couramment un groupe humain; « peuple » est naturel en français et convient à la description collective.
- source_word: גָּדוֹל
  choice: nombreux
  rationale: Dans la formule עַם גָּדוֹל וָרָם, גָּדוֹל peut évoquer l’importance ou la taille du peuple. « nombreux », associé à « de haute stature », produit une description française claire sans suggérer une grandeur morale.
- source_word: וָרָם
  choice: de haute stature
  rationale: רָם signifie littéralement « haut »; appliqué à ce peuple, il décrit vraisemblablement la taille physique. « De haute stature » est naturel, digne et précis.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: les fils d’Anak
  rationale: La formulation conserve l’expression filiale littérale de l’hébreu et le nom propre Anak, sans la réduire silencieusement à une simple désignation ethnique.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: que tu connais
  rationale: Le parfait hébreu exprime ici une connaissance acquise et actuelle; le présent français rend directement cette idée.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: et dont tu as entendu dire
  rationale: Cette tournure française introduit naturellement la parole rapportée qui suit, tout en conservant l’idée d’une réputation déjà entendue.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Qui peut tenir devant
  rationale: L’expression évoque le fait de rester en position face à un adversaire, donc de lui résister. « Tenir devant » préserve l’image hébraïque et la force rhétorique.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le tutoiement singulier reflète les formes אַתָּה adressées collectivement à Israël. La répétition « les fils d’Anak » est conservée pour respecter l’insistance du texte.
