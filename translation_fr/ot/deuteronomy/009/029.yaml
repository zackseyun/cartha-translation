  text: וְ/הֵ֥ם עַמְּ/ךָ֖ וְ/נַחֲלָתֶ֑/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּדֹ֔ל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: fr
  text: Mais ils sont ton peuple et ton héritage[a], que tu as fait sortir par ta grande puissance et par ton bras étendu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ils sont ton peuple et ton héritage. » La conjonction hébraïque peut simplement signifier « et » ; « mais » fait ressortir le contraste probable dans la supplication de Moïse.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « bras étendu » est une formule caractéristique de la délivrance lors de la sortie d’Égypte ; elle évoque la puissance de Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: Mais ils sont
  rationale: 'La conjonction ו peut simplement signifier « et », mais le contexte de l’intercession de Moïse lui donne vraisemblablement une valeur adversative : malgré leur faute, ils demeurent le peuple de Dieu.'
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: עַם désigne ici Israël comme peuple appartenant à Dieu; « ton peuple » est précis, naturel et conforme au contexte d’alliance.
- source_word: וְנַחֲלָתֶךָ
  choice: et ton héritage
  rationale: נַחֲלָה évoque un bien attribué ou possédé. « Héritage » conserve la portée relationnelle et biblique de l’expression sans la réduire à une simple propriété.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: eux que tu as fait sortir
  rationale: Le pronom relatif renvoie au peuple, et le hiphil de יצא exprime le fait de faire sortir; cette formulation maintient clairement le motif de l’Exode.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: par ta grande puissance
  rationale: La préposition ב est instrumentale, כֹּחַ signifie « puissance, force », et גָּדוֹל est rendu directement par « grande ».
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: et par ton bras étendu
  rationale: La traduction littérale préserve l’image anthropomorphique traditionnelle de la puissance divine à l’œuvre dans la délivrance de l’Exode.
theological_decisions:
- issue: Valeur de la conjonction initiale dans l’intercession de Moïse
  choice: « Mais ils sont »
  alternative: « Et ils sont »
  rationale: « Mais » rend naturellement le contraste implicite avec la possibilité de détruire Israël, tout en signalant en note que l’hébreu permet aussi une simple coordination.
- issue: Langage de possession lié à נַחֲלָה
  choice: « ton héritage »
  alternative: « ton patrimoine » ou « ton bien »
  rationale: « Héritage » conserve le langage biblique de l’appartenance d’Israël à Dieu et sa tension théologique, sans expliciter davantage que le texte.
- issue: Image anthropomorphique de l’action divine
  choice: Conserver « ton bras étendu »
  alternative: Paraphraser par « tes actes puissants »
  rationale: L’hébreu emploie intentionnellement une image corporelle caractéristique du récit de l’Exode; la conserver maintient sa force littéraire et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. La syntaxe « eux que » évite une ambiguïté d’antécédent et reste naturelle à l’oral comme à l’écrit. Les métaphores bibliques « héritage » et « bras étendu » sont conservées.
