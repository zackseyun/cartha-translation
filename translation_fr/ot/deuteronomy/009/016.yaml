language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: fr
  text: 'J’ai regardé, et voici : vous aviez péché contre Yahweh, votre Dieu. Vous vous étiez fait un veau en métal fondu[a]. Vous vous étiez vite détournés de la voie que Yahweh vous avait prescrite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un veau en métal coulé ». L’expression hébraïque désigne un veau fabriqué par fonte et moulage du métal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: J’ai regardé
  rationale: Le verbe ראה signifie couramment « voir »; ici, « j’ai regardé » rend naturellement le mouvement narratif qui mène à וְהִנֵּה, sans en absorber la fonction d’attirer l’attention.
- source_word: וְהִנֵּה
  choice: et voici
  rationale: « Et voici » conserve la fonction déictique et emphatique de הִנֵּה dans un registre français digne mais compréhensible.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: vous aviez péché contre Yahweh, votre Dieu
  rationale: Le plus-que-parfait convient au récit rétrospectif de Moïse; « pécher contre » rend idiomatiquement la construction avec ל.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: vous vous étiez fait
  rationale: Cette tournure française exprime le bénéficiaire indiqué par לָכֶם et garde la valeur rétrospective du contexte.
- source_word: עֵגֶל מַסֵּכָה
  choice: un veau en métal fondu
  rationale: מַסֵּכָה désigne un objet métallique produit par fonte ou moulage. La formulation indique clairement la matière et le procédé sans réduire l’expression à une simple image.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: Vous vous étiez vite détournés de la voie
  rationale: « Se détourner de la voie » préserve la métaphore morale et covenantale de סור et דרך; « vite » rend מַהֵר de façon naturelle.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: que Yahweh vous avait prescrite
  rationale: Puisque « la voie » est l’objet sémantique du commandement, « prescrite » est naturel en français et évite la tournure plus lourde « qu’il vous avait commandé de suivre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de « la voie que Yahweh vous avait prescrite »
  choice: Conserver la métaphore de la voie sans expliciter l’obéissance attendue
  alternative: la voie que Yahweh vous avait commandé de suivre
  rationale: L’hébreu formule littéralement la voie que Yahweh avait commandée. La traduction retenue garde cette concision et ne résout pas par ajout la relation implicite entre commandement et conduite.
translation_notes:
  register: Français international moderne, sobre et solennel. Le plus-que-parfait marque le regard rétrospectif de Moïse. « Et voici » conserve l’effet d’attention du récit biblique sans employer l’archaïsme « voici que ».
