  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: fr
  text: Quant à votre péché, le veau que vous aviez fait, je l’ai pris et brûlé au feu. Puis je l’ai pilé, en le broyant soigneusement, jusqu’à ce qu’il soit aussi fin que de la poussière. J’ai alors jeté sa poussière dans le torrent[a] qui descend de la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cours d’eau » ; le mot hébreu peut désigner un torrent, un cours d’eau, un lit de torrent ou un oued.
    reason: Alternative lexicale reflétant l’étendue sémantique de נחל.
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: votre péché
  rationale: En apposition avec « le veau », le terme identifie avec force l’idole elle-même au péché d’Israël; « sacrifice pour le péché » ne convient pas au contexte.
- source_word: הָעֵגֶל
  choice: le veau
  rationale: Sens courant du terme et désignation naturelle de l’idole dans cet épisode.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: je l’ai pris et brûlé au feu
  rationale: « Brûlé au feu » conserve la formulation concrète et emphatique de l’hébreu tout en restant idiomatique en français.
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: je l’ai réduit en morceaux et l’ai soigneusement broyé
  rationale: Le verbe נכה exprime ici l’action de frapper ou mettre en pièces, tandis que טחון précise le broyage; la traduction maintient les deux étapes et l’intensification portée par הֵיטֵב.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: jusqu’à ce qu’il soit aussi fin que de la poussière
  rationale: Cette formulation restitue naturellement le degré extrême de pulvérisation exprimé par דק לְעָפָר.
- source_word: עֲפָרוֹ
  choice: sa poussière
  rationale: Désigne les restes pulvérisés du veau et reprend le mot « poussière » de la proposition précédente sans les réduire aux seules cendres.
- source_word: הַנַּחַל
  choice: le torrent
  rationale: נחל peut désigner un cours d’eau, un torrent ou son lit; dans un cadre montagneux, « torrent » est précis et naturel, tout en laissant une note signaler l’étendue sémantique.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: qui descend de la montagne
  rationale: Le présent rend la valeur descriptive du participe hébreu et convient naturellement à un cours d’eau.
theological_decisions:
- issue: Identification du veau comme « votre péché »
  choice: votre péché, le veau que vous aviez fait
  alternative: la chose coupable que vous aviez faite, le veau
  rationale: L’apposition hébraïque assimile directement et sévèrement l’idole au péché du peuple. La traduction conserve cette tension théologique au lieu de l’atténuer.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination répétée de l’hébreu est légèrement structurée en phrases pour la lisibilité, sans perdre la succession énergique des actes. Le marqueur [a] figure dans le texte principal.
