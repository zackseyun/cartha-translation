source:
  edition: WLC
  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: fr
  text: Yahweh fut très en colère contre Aaron[a], au point de vouloir le détruire. À ce moment-là, j’ai aussi prié pour Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « envers Aaron » ; dans ce contexte, la préposition hébraïque peut exprimer soit la personne contre laquelle la colère est dirigée, soit celle envers qui elle est éprouvée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: contre Aaron
  rationale: Avec un verbe de colère, בְ peut marquer la personne visée. « Contre Aaron » est naturel en français et conserve cette nuance, tandis que « envers Aaron » reste possible.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: fut aussi très en colère
  rationale: Le hitpael de אנף exprime une vive colère, intensifiée par מְאֹד. Cette formulation française reste claire et directe sans affaiblir l’intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom divin plutôt que de lui substituer un titre.
- source_word: לְהַשְׁמִידוֹ
  choice: au point de vouloir le détruire
  rationale: L’infinitif avec לְ indique ici l’orientation ou l’aboutissement de la colère. Cette tournure naturelle conserve l’intention menaçante sans préciser un mode de destruction.
- source_word: וָאֶתְפַּלֵּל
  choice: j’ai ... prié
  rationale: Le hitpael de פלל signifie couramment « prier ». Le contexte et בְּעַד donnent à cette prière sa portée d’intercession.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: également prié pour Aaron
  rationale: גַּם ajoute Aaron aux bénéficiaires de l’intercession de Moïse, et בְּעַד signifie ici « pour, en faveur de ».
- source_word: בָּעֵת הַהִוא
  choice: À ce moment-là
  rationale: Expression temporelle naturelle qui renvoie à l’épisode dont Moïse vient de parler.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le représente directement, sans le remplacer par un titre.
- issue: Portée de la préposition בְ devant Aaron
  choice: contre Aaron
  alternative: envers Aaron
  rationale: Les deux rendus peuvent convenir avec un verbe de colère. Le texte principal retient « contre » pour désigner clairement la personne visée, et la note préserve l’autre nuance possible.
- issue: Sens de לְהַשְׁמִידוֹ
  choice: au point de vouloir le détruire
  alternative: pour le détruire
  rationale: La formulation choisie exprime naturellement en français que la colère de Yahweh allait jusqu’à la destruction envisagée, sans trancher davantage la relation exacte entre colère, intention et résultat.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour une lecture naturelle, tout en conservant l’intensité de la colère, la menace de destruction et l’intercession de Moïse.
