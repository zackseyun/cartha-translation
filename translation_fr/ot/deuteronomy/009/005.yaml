source:
  edition: WLC
  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: fr
  text: Ce n’est pas à cause de ta justice ni de la droiture de ton cœur que tu entres pour prendre possession de leur terre. C’est à cause de la méchanceté de ces nations que Yahweh, ton Dieu, les chasse devant toi[a], et afin de confirmer la parole que Yahweh a donnée sous serment à tes pères[c], à Abraham, à Isaac et à Jacob[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dépossède devant toi ». Le verbe hébreu peut souligner soit l’expulsion de ces nations, soit le fait que Dieu leur fait perdre la possession de la terre.
    reason: lexical_alternative
  - marker: b
    text: Ou « la promesse ». Littéralement « la parole » ; dans ce contexte de serment, il s’agit d’une parole donnée.
    reason: lexical_alternative
  - marker: c
    text: 'Ici, « tes pères » désigne précisément les patriarches nommés ensuite : Abraham, Isaac et Jacob.'
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: à cause de ta justice
  rationale: Dans cette proposition négative, la préposition בְּ exprime naturellement la cause. צְדָקָה désigne ici la justice morale d’Israël, présentée comme n’étant pas le fondement de son entrée dans le pays.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: ni de la droiture de ton cœur
  rationale: יֹשֶׁר évoque la rectitude, et לֵבָב la disposition intérieure. « La droiture de ton cœur » conserve l’image hébraïque dans un français naturel et digne.
- source_word: בָא לָרֶשֶׁת
  choice: tu entres pour prendre possession
  rationale: 'בוא exprime l’entrée dans le territoire, tandis que l’infinitif לָרֶשֶׁת en indique le but : en prendre possession.'
- source_word: אַרְצָם
  choice: leur terre
  rationale: אֶרֶץ désigne ici le territoire possédé par les nations. « Leur terre » reste proche de l’hébreu et convient au contexte.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: à cause de la méchanceté de ces nations
  rationale: רִשְׁעָה désigne la méchanceté ou la culpabilité. La préposition בְּ est causale, en contraste direct avec la justice d’Israël niée au début du verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération française usuelle « Yahweh », plutôt que remplacé par un titre.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: les dépossède devant toi
  rationale: La forme causative de ירשׁ peut signifier faire perdre une possession ou chasser. « Dépossède » met en relief la perte de la terre, tandis que la note signale l’autre nuance possible.
- source_word: וּלְמַעַן הָקִים
  choice: et afin de confirmer
  rationale: לְמַעַן introduit un but. Dans le contexte d’une parole jurée, הֵקִים exprime le fait d’établir fermement, confirmer ou accomplir cette parole.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: la parole que Yahweh a jurée
  rationale: דָּבָר signifie littéralement « parole » ou « chose » et prend ici, avec le serment, le sens d’une parole promise. La formulation conserve le terme concret de l’hébreu.
- source_word: לַאֲבֹתֶיךָ
  choice: à tes pères
  rationale: 'Le nom masculin pluriel renvoie ici précisément aux trois patriarches immédiatement nommés : Abraham, Isaac et Jacob.'
theological_decisions:
- issue: Les raisons de la prise de possession de la terre
  choice: Maintenir ensemble la méchanceté des nations et la fidélité de Yahweh à sa parole jurée comme les deux raisons affirmées dans le verset.
  alternative: Mettre exclusivement l’accent soit sur la méchanceté des nations, soit sur la promesse faite aux patriarches.
  rationale: L’hébreu énonce explicitement les deux motifs au moyen de כִּי et de וּלְמַעַן. La traduction ne subordonne ni n’efface l’un des deux.
- issue: Le nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le nom propre de l’alliance. Sa translittération préserve la distinction entre le nom divin et un titre.
- issue: La justice d’Israël
  choice: Présenter explicitement la justice et la droiture intérieure d’Israël comme n’étant pas la cause de son acquisition de la terre.
  alternative: Atténuer la négation ou faire de la conduite d’Israël une cause secondaire implicite.
  rationale: La construction לֹא בְצִדְקָתְךָ וּבְיֹשֶׁר לְבָבְךָ nie directement ce fondement, sans toutefois développer ici une doctrine générale de la justice humaine.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse à Israël comme entité collective. La structure causale et la coordination finale préservent le contraste et les deux motifs du texte hébreu sans les harmoniser.
