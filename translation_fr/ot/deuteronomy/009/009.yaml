  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: fr
  text: Lorsque je suis monté sur la montagne pour recevoir les tablettes de pierre[a], les tablettes de l’alliance que Yahweh a conclue avec vous[b], je suis resté sur la montagne quarante jours et quarante nuits ; je n’ai pas mangé de pain et je n’ai pas bu d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prendre ». Ici, il s’agit de recevoir les tablettes remises à Moïse.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « couper avec vous », tournure hébraïque habituelle signifiant « conclure une alliance avec vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי הָהָרָה
  choice: Lorsque je suis monté sur la montagne
  rationale: La préposition ב avec l’infinitif construit exprime ici le temps, et le ה directionnel indique le mouvement vers la montagne. Cette formulation est naturelle en français et conserve ces deux éléments.
- source_word: לָקַחַת
  choice: pour recevoir
  rationale: Le sens premier est « prendre », mais le contexte montre que Moïse monte afin de se voir remettre les tablettes. « Recevoir » exprime clairement ce rapport sans modifier la scène.
- source_word: לוּחֹת הָאֲבָנִים
  choice: les tablettes de pierre
  rationale: Cette formulation rend directement la construction hébraïque et désigne clairement la matière des tablettes.
- source_word: לוּחֹת הַבְּרִית
  choice: les tablettes de l’alliance
  rationale: La répétition en apposition est conservée, car elle identifie les tablettes de pierre comme celles de l’alliance et reprend l’accent du texte hébreu.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: que Yahweh avait conclue avec vous
  rationale: כרת, littéralement « couper », appartient à l’expression hébraïque usuelle pour conclure une alliance. Le plus-que-parfait situe naturellement cette alliance avant le séjour de Moïse sur la montagne.
- source_word: וָאֵשֵׁב
  choice: je suis resté
  rationale: ישב peut signifier « s’asseoir », « habiter » ou « rester ». Ici, la durée de la présence de Moïse sur la montagne est au premier plan.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: quarante jours et quarante nuits
  rationale: Traduction directe de l’expression hébraïque habituelle indiquant une durée.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: je n’ai pas mangé de pain et je n’ai pas bu d’eau
  rationale: La traduction conserve les termes concrets « pain » et « eau », ainsi que le parallélisme des deux propositions négatives.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le rend par translittération plutôt que de lui substituer un titre.
- issue: L’expression כרת ברית
  choice: conclure une alliance
  alternative: couper une alliance
  rationale: « Couper une alliance » reproduirait littéralement l’idiome hébreu, mais serait trompeur en français moderne. « Conclure une alliance » en transmet le sens reconnu sans effacer l’image source, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide tout en conservant la répétition appositionnelle du texte hébreu. Le nom divin est translittéré « Yahweh ».
