source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: fr
  text: 'De peur que le pays d’où tu nous as fait sortir ne dise[a] : « C’est parce que Yahweh n’a pas pu les faire entrer dans le pays dont il leur avait parlé[b], et parce qu’il les détestait, qu’il les a fait sortir pour les faire mourir dans le désert. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays d’où tu nous as fait sortir » ; ici, le pays représente ses habitants.'
    reason: cultural_note
  - marker: b
    text: 'On peut aussi comprendre : « dans le pays qu’il leur avait promis ». Littéralement : « dans le pays dont il leur avait parlé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Autrement
  rationale: Introduit naturellement en français la conséquence redoutée dans l’intercession de Moïse, tout en conservant la valeur préventive de l’hébreu.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: le pays d’où tu nous as fait sortir
  rationale: Conserve la formulation hébraïque, où « le pays » désigne par métonymie ses habitants, sans expliciter cette figure dans le corps du texte.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: parce que Yahweh était incapable
  rationale: Exprime directement l’incapacité que les Égyptiens attribueraient calomnieusement à Yahweh; le tour français est naturel et n’affirme pas que cette incapacité est réelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: לַהֲבִיאָם
  choice: de les faire entrer
  rationale: Le causatif français convient au sens de faire parvenir Israël à l’intérieur du pays visé.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: dans le pays dont il leur avait parlé
  rationale: Rend formellement דִּבֶּר, « parler », et préserve l’implicite quant au contenu précis de la parole, que le contexte permet de comprendre comme une promesse.
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: et parce qu’il les détestait
  rationale: Restitue la valeur causale de la préposition et l’accusation de haine prêtée aux habitants du pays quitté.
- source_word: הוֹצִיאָם
  choice: il les a fait sortir
  rationale: Maintient le lien lexical avec la première occurrence du verbe יצא et l’écho à l’exode.
- source_word: לַהֲמִתָם
  choice: pour les faire mourir
  rationale: Reproduit la valeur causative du hiphil de מות dans une expression française claire et digne.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme courant et contextuellement approprié en français pour le milieu aride des errances d’Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Sens de אֲשֶׁר דִּבֶּר לָהֶם
  choice: dont il leur avait parlé
  alternative: qu’il leur avait promis
  rationale: Le verbe signifie littéralement « parler ». La formulation retenue préserve l’ambiguïté grammaticale et laisse le contexte covenantal suggérer la promesse sans l’inscrire explicitement dans le verbe.
- issue: Nature de l’affirmation concernant l’incapacité et la haine de Yahweh
  choice: discours attribué aux habitants du pays quitté
  alternative: affirmation directe du narrateur
  rationale: Les propositions se trouvent dans le discours que Moïse redoute d’entendre; les guillemets et la construction causale maintiennent clairement ce statut rhétorique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse directe de Moïse à Dieu. La phrase conserve la longue articulation causale du texte hébreu tout en restant lisible; les notes signalent la métonymie et l’ambiguïté de דִּבֶּר לָהֶם.
