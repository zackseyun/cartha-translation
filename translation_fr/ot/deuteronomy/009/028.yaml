    issue: פֶּן est rendu par « Autrement »
    rationale: « Autrement » peut transmettre une conséquence, mais « de peur que » restitue plus directement la valeur de crainte ou de prévention de פֶּן dans l’intercession de Moïse. La construction exige alors le subjonctif.
  - severity: low
    issue: « était incapable » est moins idiomatique dans cette explication rétrospective
    rationale: Le discours prêté aux habitants explique une action passée. « n’a pas pu » est plus naturel tout en conservant l’accusation d’incapacité attribuée à Yahweh.
