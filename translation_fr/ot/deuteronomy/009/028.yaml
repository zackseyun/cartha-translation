  rationale: La révision corrige la valeur de פֶּן par « De peur que », avec le subjonctif français correspondant, et améliore légèrement l’expression de l’incapacité alléguée. Elle maintient la métonymie, l’ambiguïté de « dont il leur avait parlé », le nom divin et l’ensemble du sens du passage.
