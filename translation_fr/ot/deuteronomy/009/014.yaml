  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: fr
  text: Laisse-moi, afin que je les détruise et que j’efface leur nom de sous les cieux[a] ; et je ferai de toi une nation plus puissante et plus nombreuse qu’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Laisse-moi : je les détruirai et j’effacerai leur nom de sous les cieux. » Littéralement : « de dessous les cieux » ; cette expression évoque leur disparition de la terre, de l’existence et de la mémoire humaines.'
    reason: La note préserve l’autre façon possible de comprendre le lien entre l’impératif et les verbes suivants, et explique l’image spatiale hébraïque sans la supprimer du texte.
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Laisse-moi faire
  rationale: L’impératif de רפה avec מן demande à Moïse de cesser d’intervenir ou de ne pas faire obstacle. « Laisse-moi faire » est idiomatique en français moderne et convient au contexte, sans préciser indûment la nature de l’intervention de Moïse.
- source_word: וְאַשְׁמִידֵם
  choice: je les détruirai
  rationale: שׁמד exprime ici une destruction complète. Après l’impératif, le waw peut introduire la conséquence ou le dessein envisagé. Les deux rapports possibles sont signalés par la note [a].
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: et j’effacerai leur nom
  rationale: מחה signifie effacer ou faire disparaître. En français, « effacer leur nom » conserve naturellement l’image de la suppression de leur existence et de leur souvenir.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: de dessous les cieux
  rationale: Cette formulation conserve le pluriel hébreu et l’image spatiale de la locution tout en restant intelligible en français.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: je ferai de toi une nation
  rationale: La construction עשה + objet + ל indique la transformation ou l’établissement dans un nouvel état. « Faire de toi une nation » est la tournure française naturelle correspondante.
- source_word: עָצוּם וָרָב מִמֶּנּוּ
  choice: plus puissante et plus nombreuse qu’eux
  rationale: Les adjectifs עָצוּם et רָב sont compris comparativement en raison de מִמֶּנּוּ. Le suffixe singulier renvoie collectivement au peuple d’Israël ; le pluriel « qu’eux » est naturel en français.
theological_decisions:
- issue: Déclaration divine de jugement et promesse de faire de Moïse une nation plus grande
  choice: Présenter directement la destruction annoncée et la promesse faite à Moïse, sans en atténuer la force.
  alternative: Signaler dans la traduction qu’il s’agit avant tout d’une mise à l’épreuve de Moïse ou d’une déclaration purement rhétorique.
  rationale: L’hébreu rapporte une parole divine directe. La traduction doit préserver la tension narrative et théologique sans imposer une explication absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Laisse-moi faire » rend l’idiome hébreu sans lourdeur ; « de dessous les cieux » maintient l’image et le pluriel du texte source. La ponctuation distingue l’ordre initial, le jugement annoncé et la promesse qui suit.
