revisions:
- from: Depuis le jour où je vous connais, vous vous êtes rebellés contre Yahweh.[a]
  to: Vous avez été rebelles contre Yahweh depuis le jour où je vous ai connus[a].
  rationale: 'La révision rend plus précisément la construction hébraïque : « avez été rebelles » exprime la disposition persistante récapitulée par le parfait de היה et le participe de מרה; « depuis le jour où je vous ai connus » conserve le point de départ exprimé par מִיּוֹם דַּעְתִּי. Le nom divin et l’explication de la préposition sont maintenus.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:53:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : Israël est caractérisé par la rébellion envers Yahweh depuis le commencement de la relation de Moïse avec lui. Toutefois, « vous vous êtes rebellés » décrit plus volontiers des actes ponctuels qu’un état ou une disposition durable; le participe מַמְרִים avec היה appelle plus directement « vous avez été rebelles ».'
  naturalness: La formulation révisée est plus idiomatique et plus nette en français international moderne. « Depuis le jour où je vous ai connus » rend le parfait hébreu sans introduire le présent français « je vous connais », qui infléchit légèrement le repère passé du texte source.
  terminology: « Yahweh » respecte le rendu établi du tétragramme. « Rebelles contre Yahweh » rend naturellement l’opposition exprimée par מרה עם. La note conserve utilement la valeur littérale inhabituelle de la préposition.
  issues:
  - severity: medium
    issue: « vous vous êtes rebellés » ne rend pas au plus près la prédication durable de מַמְרִים הֱיִיתֶם.
    rationale: L’hébreu présente les destinataires comme ayant été « rebelles », plutôt que de viser principalement des épisodes où ils « se sont rebellés ». « Vous avez été rebelles » préserve mieux l’aspect caractérisant et rétrospectif.
  - severity: low
    issue: « le jour où je vous connais » emploie un présent là où le texte hébreu a un parfait.
    rationale: Après « depuis », le présent est possible en français pour une relation toujours en cours, mais « je vous ai connus » suit plus directement le repère passé (« le jour de ma connaissance de vous ») et évite cette légère réinterprétation.
  - severity: low
    issue: L’appel de note est placé après le point.
    rationale: Le placer avant la ponctuation finale rattache sans ambiguïté la note à « contre Yahweh », conformément à la pratique éditoriale française courante.
  revised_text: Vous avez été rebelles contre Yahweh depuis le jour où je vous ai connus[a].
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « avec Yahweh » ; dans cette expression, « avec » marque l’opposition, d’où « contre Yahweh ».'
    reason: lexical_alternative
  revision_rationale: 'La révision rend plus précisément la construction hébraïque : « avez été rebelles » exprime la disposition persistante récapitulée par le parfait de היה et le participe de מרה; « depuis le jour où je vous ai connus » conserve le point de départ exprimé par מִיּוֹם דַּעְתִּי. Le nom divin et l’explication de la préposition sont maintenus.'
