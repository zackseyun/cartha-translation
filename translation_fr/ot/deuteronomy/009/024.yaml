  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: fr
  text: Vous avez été rebelles contre Yahweh depuis le jour où je vous ai connus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec Yahweh » ; dans cette expression, « avec » marque l’opposition, d’où « contre Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: vous vous êtes rebellés
  rationale: Le terme issu de מרה exprime la rébellion et la résistance à l’autorité. Avec הֱיִיתֶם, cette formulation française rend naturellement l’attitude persistante reprochée à Israël.
- source_word: הֱיִיתֶם
  choice: vous vous êtes
  rationale: Le parfait qal à la 2e personne du pluriel, associé à מַמְרִים, résume rétrospectivement la conduite d’Israël jusqu’au moment du discours.
- source_word: עִם
  choice: contre
  rationale: Bien que la préposition signifie ordinairement « avec », son association avec מרה exprime ici l’opposition; « contre » rend clairement cet emploi adversatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִיּוֹם
  choice: Depuis le jour
  rationale: Cette expression temporelle marque le point de départ d’une conduite qui se prolonge jusqu’au présent du discours.
- source_word: דַּעְתִּי אֶתְכֶם
  choice: où je vous connais
  rationale: ידע désigne ici la relation de connaissance de Moïse avec Israël. Le présent français après « depuis » exprime naturellement une situation commencée dans le passé et toujours actuelle, sans réduire le verbe à une simple prise de connaissance intellectuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; la translittération conserve le nom d’alliance sans le remplacer par un titre.
- issue: Valeur de עִם après מרה
  choice: contre Yahweh
  alternative: avec Yahweh
  rationale: Le sens contextuel est celui de l’opposition à Yahweh. La note conserve toutefois la forme littérale inhabituelle de l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le passé composé rend la rébellion rétrospective, tandis que « depuis le jour où je vous connais » suit l’usage français naturel avec « depuis » et maintient le lien jusqu’au présent du discours.
