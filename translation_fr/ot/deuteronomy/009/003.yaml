reference: Deuteronomy 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: fr
  text: 'Sache donc aujourd’hui que Yahweh ton Dieu est celui qui traverse devant toi[a] : il est un feu dévorant[b]. C’est lui qui les détruira et les soumettra devant toi. Tu les déposséderas[c] et tu les feras rapidement disparaître, comme Yahweh te l’a dit[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui va devant toi ». Le participe hébreu présente littéralement Yahweh comme celui qui traverse en avant d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « un feu qui consume ».
    reason: lexical_alternative
  - marker: c
    text: Ou « tu les chasseras ».
    reason: lexical_alternative
  - marker: d
    text: Ou « selon ce que Yahweh t’a dit ». Il s’agit de l’accomplissement de la parole que Yahweh avait précédemment adressée à Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Sache donc aujourd’hui
  rationale: L’impératif français exprime naturellement la valeur exhortative du parfait hébreu en contexte, tandis que « donc » marque le lien logique avec ce qui précède.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Cette formulation directe conserve l’adresse au singulier et l’expression d’alliance.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: est celui qui traverse devant toi
  rationale: « Traverse » garde l’image concrète du passage et son lien contextuel avec l’entrée d’Israël dans le pays; le participe est rendu par une tournure française actuelle.
- source_word: אֵשׁ אֹכְלָה
  choice: un feu dévorant
  rationale: Cette expression idiomatique préserve la métaphore forte d’un feu qui consume, sans l’atténuer.
- source_word: יַשְׁמִידֵם
  choice: les détruira
  rationale: Le verbe rend directement la valeur causative et destructive du hifil de שׁמד.
- source_word: יַכְנִיעֵם
  choice: les soumettra
  rationale: Dans ce contexte militaire, « soumettre » exprime le fait de les abaisser et de les placer sous domination.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: La traduction conserve le sens spatial et militaire de l’expression.
- source_word: וְהוֹרַשְׁתָּם
  choice: tu les déposséderas
  rationale: « Déposséder » garde la dimension territoriale du hifil de ירשׁ, au-delà de la seule expulsion.
- source_word: וְהַאֲבַדְתָּם
  choice: tu les feras disparaître
  rationale: La tournure causative distingue אבד du précédent שׁמד tout en exprimant leur perte ou disparition.
- source_word: מַהֵר
  choice: rapidement
  rationale: L’adverbe exprime sans atténuation la rapidité annoncée par le texte.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: comme Yahweh te l’a dit
  rationale: Cette formulation naturelle renvoie à une parole divine antérieure sans préciser davantage qu’il s’agit formellement d’une promesse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme; la translittération préserve le nom personnel révélé à Israël.
- issue: Image divine de אֵשׁ אֹכְלָה
  choice: il est un feu dévorant
  alternative: comme un feu dévorant
  rationale: L’hébreu pose directement « un feu dévorant » en apposition à Yahweh. La formulation retenue maintient cette identification métaphorique forte plutôt que de la réduire à une simple comparaison.
- issue: Rapport entre l’action divine et l’action d’Israël
  choice: C’est lui qui les détruira… Tu les déposséderas…
  alternative: Il les détruira pour que tu les dépossèdes
  rationale: La juxtaposition est conservée afin de ne pas résoudre artificiellement la tension entre l’action souveraine de Yahweh et l’action confiée à Israël.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme entité collective. Les verbes violents et l’image du feu sont conservés sans euphémisme; la syntaxe reste fluide pour une lecture publique.
