  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: fr
  text: 'Ne dis pas dans ton cœur[a], lorsque Yahweh, ton Dieu, les chassera de devant toi : « C’est à cause de ma justice que Yahweh m’a fait entrer dans ce pays pour en prendre possession, mais c’est à cause de la méchanceté de ces nations que Yahweh les expulse de devant toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en toi-même ». Littéralement : « dans ton cœur », expression hébraïque qui désigne ici la pensée intérieure.'
    reason: clarification_de_l_idiome
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: אַל suivi de l’inaccompli exprime ici une interdiction ; cette formulation est directe et naturelle en français.
- source_word: בִּלְבָבְךָ
  choice: dans ton cœur
  rationale: L’expression désigne la pensée intérieure. Le maintien de l’image hébraïque reste clair et digne en français moderne.
- source_word: בַּהֲדֹף
  choice: lorsque ... chassera
  rationale: L’infinitif construit précédé de בְּ indique la circonstance temporelle ; נדף évoque le fait de repousser ou chasser.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּצִדְקָתִי
  choice: C’est à cause de ma justice
  rationale: צְדָקָה désigne ici la droiture dont Israël pourrait prétendre qu’elle lui vaut le pays. « Justice » conserve la portée morale et théologique du terme.
- source_word: הֱבִיאַנִי
  choice: m’a fait entrer
  rationale: 'Le hifil de בוא exprime la causation : Yahweh fait entrer Israël dans le pays.'
- source_word: לָרֶשֶׁת
  choice: pour en prendre possession
  rationale: ירשׁ désigne ici l’entrée en possession du pays ; cette tournure est naturelle et préserve le sens contextuel.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: C’est plutôt à cause de la méchanceté de ces nations
  rationale: Le waw introduit un contraste avec la prétention précédente. « Plutôt » explicite sobrement ce rapport sans modifier la cause affirmée.
- source_word: מוֹרִישָׁם
  choice: les dépossède
  rationale: Le hifil de ירשׁ signifie ici faire perdre leur possession aux nations, en contraste lexical avec la prise de possession d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme ; « Yahweh » préserve le nom personnel présent dans la source.
- issue: Prétention selon laquelle Israël mériterait le pays
  choice: à cause de ma justice
  alternative: en raison de ma droiture
  rationale: La formulation conserve explicitement la notion de justice revendiquée, sans atténuer la tension théologique que Moïse réfute.
- issue: Rapport entre la justice supposée d’Israël et la méchanceté des nations
  choice: C’est plutôt à cause de la méchanceté de ces nations
  alternative: mais c’est à cause de la méchanceté de ces nations
  rationale: Le contraste est rendu clairement, sans laisser entendre que le verset énonce à lui seul toutes les raisons du don du pays.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier suit l’adresse hébraïque à Israël comme personne collective. La répétition de « devant toi » et le contraste entre « prendre possession » et « dépossède » conservent les traits structurants de l’hébreu.
