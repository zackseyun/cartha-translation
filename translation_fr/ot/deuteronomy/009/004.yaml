- from: 'Ne dis pas dans ton cœur[a], lorsque Yahweh ton Dieu les chassera devant toi : « C’est à cause de ma justice que Yahweh m’a fait entrer dans ce pays pour en prendre possession. » C’est plutôt à cause de la méchanceté de ces nations que Yahweh les dépossède devant toi.'
  to: 'Ne dis pas dans ton cœur[a], lorsque Yahweh, ton Dieu, les chassera de devant toi : « C’est à cause de ma justice que Yahweh m’a fait entrer dans ce pays pour en prendre possession, mais c’est à cause de la méchanceté de ces nations que Yahweh les expulse de devant toi. »'
  rationale: La révision rétablit le sens de retrait exprimé par « de devant toi », maintient l’ensemble du discours intérieur dans une seule citation et rend le contraste du waw par « mais », sans ajouter l’accent comparatif de « plutôt ».
