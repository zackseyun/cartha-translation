reference: Deuteronomy 9:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: fr
  text: 'Puis Yahweh me dit : « J’ai vu ce peuple : c’est vraiment un peuple à la nuque raide[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « à la nuque raide » signifie « obstiné, rétif ».
    reason: Explication de l’expression idiomatique hébraïque sans supprimer sa métaphore dans le texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le wayyiqtol fait progresser le récit; « Puis » exprime naturellement la succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֵלַי לֵאמֹר
  choice: me dit
  rationale: La formule hébraïque littérale « me dit en disant » est rendue par la tournure française naturelle « me dit », sans perte de contenu.
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le parfait hébreu présente l’observation comme accomplie et fonde le constat qui suit.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Cette formulation conserve le nom collectif singulier et le démonstratif de l’hébreu.
- source_word: וְהִנֵּה
  choice: c’est vraiment
  rationale: « Vraiment » restitue ici la valeur d’insistance et de constat de הִנֵּה dans un français actuel, sans l’archaïsme de « voici » au milieu de la proposition.
- source_word: עַם קְשֵׁה עֹרֶף הוּא
  choice: c’est un peuple à la nuque raide
  rationale: Le singulier collectif est maintenu, et l’image hébraïque de la nuque raide est conservée plutôt que réduite au seul adjectif « obstiné ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Portée de l’expression « à la nuque raide »
  choice: Conserver la métaphore
  alternative: obstiné / rebelle
  rationale: L’expression évoque l’obstination et la résistance, mais la traduction garde l’image sans préciser davantage que ne le fait le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative est naturelle; la métaphore biblique centrale est conservée et brièvement expliquée en note.
