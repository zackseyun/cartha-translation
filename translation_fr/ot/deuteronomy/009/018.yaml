  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: fr
  text: Je me suis alors prosterné devant Yahweh, comme la première fois[a], pendant quarante jours et quarante nuits. Je n’ai mangé de pain ni bu d’eau, à cause de tout le péché que vous aviez commis en faisant ce qui est mal aux yeux de Yahweh, au point de provoquer sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme auparavant ». L’expression hébraïque renvoie à la première période de quarante jours que Moïse avait passée devant Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Je me suis alors prosterné
  rationale: La forme hitpael de נפל décrit ici Moïse se jetant à terre devant Dieu. « Se prosterner » exprime naturellement en français cette posture d’humiliation et d’intercession, tandis que « alors » rend la progression narrative.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la position ou la présence face à quelqu’un. « Devant » est direct et idiomatique; le nom divin est translittéré « Yahweh ».
- source_word: כָּרִאשֹׁנָה
  choice: comme la première fois
  rationale: L’expression renvoie à la première période de quarante jours passée par Moïse devant Yahweh. Cette formulation française préserve clairement le renvoi rétrospectif.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: pendant quarante jours et quarante nuits
  rationale: Traduction directe de la durée; « pendant » rend explicite et naturel en français le rapport temporel.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: Je n’ai mangé aucun pain
  rationale: Le texte hébreu nomme explicitement le pain plutôt que la nourriture en général. « Aucun pain » conserve ce détail sans généralisation.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: et je n’ai bu aucune eau
  rationale: Traduction directe, coordonnée à la proposition précédente et fidèle à la mention explicite de l’eau.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: à cause de tout le péché que vous aviez commis
  rationale: עַל indique ici le motif de la prosternation et du jeûne. Le singulier חַטַּאת est conservé comme collectif, et le français relie naturellement le nom à « commettre ».
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: en faisant ce qui est mal aux yeux de Yahweh
  rationale: La formulation rend le contenu ou la manière de leur péché et conserve l’image hébraïque de l’évaluation « aux yeux de » Yahweh.
- source_word: לְהַכְעִיסוֹ
  choice: au point de provoquer sa colère
  rationale: Le hiphil de כעס porte l’idée causative de provoquer à la colère. « Au point de » garde ouverte la nuance de résultat ou de conséquence dans le contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre de l’alliance sans le remplacer par un titre.
- issue: Rapport exprimé par לְהַכְעִיסוֹ
  choice: au point de provoquer sa colère
  alternative: pour provoquer sa colère
  rationale: L’infinitif peut être entendu comme but ou comme résultat. Dans ce reproche rétrospectif, « au point de » évite d’affirmer sans nécessité que provoquer Dieu était leur intention consciente, tout en préservant la gravité théologique de leur acte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour alléger la longue coordination hébraïque. « Se prosterner » rend la posture physique et religieuse sans ajouter explicitement la notion d’intercession. Les images « pain », « eau » et « aux yeux de » sont conservées.
