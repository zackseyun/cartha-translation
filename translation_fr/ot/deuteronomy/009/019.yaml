  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: fr
  text: Car j’avais peur à cause de la colère et de la fureur que Yahweh avait manifestées contre vous, car il s’était irrité contre vous pour vous détruire. Mais, cette fois encore, Yahweh m’a écouté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: j’avais peur
  rationale: Le qal parfait exprime ici la crainte éprouvée par Moïse. « J’avais peur » est naturel en français moderne et conserve la force personnelle du propos.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans cet emploi idiomatique, la préposition indique la cause de la crainte plutôt qu’une position spatiale.
- source_word: הָאַף וְהַחֵמָה
  choice: la colère et la fureur
  rationale: Les deux termes hébreux intensifient l’expression du courroux. Cette paire française garde la répétition emphatique tout en distinguant les nuances.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: de Yahweh contre vous
  rationale: La tournure française condense la proposition relative hébraïque sans atténuer la colère dirigée contre Israël; l’intensité de קצף est portée par « fureur ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: il voulait vous détruire
  rationale: L’infinitif précédé de ל exprime ici le dessein ou l’issue envisagée de la colère divine. La proposition explicite évite en français une ambiguïté de rattachement peu naturelle.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Mais … Yahweh m’a écouté
  rationale: שמע avec אל signifie écouter quelqu’un, avec ici l’implication contextuelle d’une réponse favorable à l’intercession. « Mais » marque le retournement narratif.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: cette fois encore
  rationale: Cette expression idiomatique rend à la fois l’instance désignée et la valeur additive de גַּם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le Tétragramme comme nom propre; « Yahweh » le conserve explicitement.
- issue: Intensité de la colère divine
  choice: la colère et la fureur de Yahweh contre vous
  alternative: la colère et la fureur dont Yahweh s’était irrité contre vous
  rationale: Le choix maintient l’accumulation de termes de colère sans produire une répétition française lourde ni adoucir la menace.
- issue: Portée de לְהַשְׁמִיד אֶתְכֶם
  choice: il voulait vous détruire
  alternative: au point de vous détruire
  rationale: Le contexte présente la destruction comme le dessein menaçant associé à la colère de Yahweh. La formulation ne précise pas davantage la relation logique que ne l’exige le contexte.
- issue: Sens favorable de l’écoute divine
  choice: Yahweh m’a écouté
  alternative: Yahweh m’a entendu
  rationale: « Écouté » conserve le sens verbal tout en laissant le contexte indiquer que l’intercession a été favorablement accueillie, sans l’expliciter doctrinalement.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le rythme oral de Moïse est préservé; « cette fois encore » est plus idiomatique que « aussi en cette occasion-là ». Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
