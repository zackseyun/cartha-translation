  text: וּ/בְ/תַבְעֵרָה֙ וּ/בְ/מַסָּ֔ה וּ/בְ/קִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: fr
  text: À Tabeéra, à Massa et à Qibroth-Hattaava[a], vous avez continué à mettre Yahweh en colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Qibroth-Hattaava est le nom d’un lieu ; littéralement : « tombes du désir » ou « tombes de la convoitise ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְתַבְעֵרָה
  choice: À Tabéra
  rationale: La préposition בְּ situe l’action en ce lieu. Le nom géographique est translittéré selon son usage français courant.
- source_word: וּבְמַסָּה
  choice: à Massa
  rationale: La préposition indique ici le lieu; le toponyme est conservé sous une forme française usuelle.
- source_word: וּבְקִבְרֹת הַתַּאֲוָה
  choice: et à Qibroth-Hattaava[a]
  rationale: L’expression fonctionne comme un nom de lieu. La translittération permet de le reconnaître comme tel, tandis que la note en donne le sens littéral.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: vous avez aussi continué à mettre … en colère
  rationale: La construction de היה avec le participe exprime une action passée continue ou répétée. « Avez continué à » en restitue l’aspect, et « mettre en colère » rend naturellement en français la valeur causative du hifil de קצף.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par « Yahweh », tandis que אֶת marque grammaticalement le complément d’objet direct.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le représente comme nom propre sans le remplacer par un titre.
- issue: Nature de la réaction divine
  choice: mettre Yahweh en colère
  alternative: provoquer la colère de Yahweh
  rationale: Cette formulation conserve la valeur causative du verbe et présente Yahweh, conformément au marqueur d’objet אֶת, comme l’objet direct de l’action, sans atténuer la tension théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque des conjonctions et prépositions est légèrement allégée pour la fluidité, tandis que « aussi » conserve la valeur cumulative de la liste. La graphie « Qibroth-Hattaava » signale clairement un toponyme et la note en explicite le sens.
