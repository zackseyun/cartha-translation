  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: fr
  text: Je me suis donc prosterné devant Yahweh pendant quarante jours et quarante nuits[a], parce que Yahweh avait dit qu’il allait vous détruire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je suis resté étendu à terre devant Yahweh pendant quarante jours et quarante nuits ». Le verbe hébreu peut souligner la position prosternée adoptée dans l’intercession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Je me suis donc prosterné
  rationale: Le hitpael de נפל décrit ici l’action volontaire de se jeter à terre devant Dieu, dans un contexte d’intercession. « Se prosterner » exprime naturellement cette posture en français; « donc » rend la valeur contextuelle, à la fois consécutive et résomptive, du waw.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי indique la présence ou la position devant quelqu’un. Le nom divin יהוה est translittéré « Yahweh », conformément à la couche doctrinale fournie.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: pendant quarante jours et quarante nuits
  rationale: Les groupes accusatifs indiquent la durée. La proposition relative hébraïque reprend cette même durée; en français, la répétition littérale serait pesante et n’ajouterait aucune information, de sorte que la durée est rendue une seule fois de manière idiomatique.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici le motif de la prosternation et de l’intercession de Moïse.
- source_word: אָמַר יְהוָה
  choice: Yahweh avait dit
  rationale: Le plus-que-parfait français explicite que la déclaration divine précède la prosternation racontée.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: qu’il allait vous détruire
  rationale: Après « avait dit », cette formulation rend naturellement l’infinitif exprimant l’action projetée. « Détruire » conserve la force de השמיד sans imposer le sens plus absolu d’« anéantir ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance et suit la décision doctrinale fournie, sans le remplacer par un titre.
- issue: Nature de l’action de Moïse
  choice: se prosterner devant Yahweh
  alternative: tomber devant Yahweh
  rationale: Le hitpael de נפל peut décrire le fait de se jeter à terre. Dans ce contexte d’intercession prolongée, « se prosterner » fait entendre la posture volontaire sans ajouter une doctrine particulière sur l’efficacité de l’intercession.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant la reprise relative redondante, peu naturelle en français. Le tutoiement collectif est conservé par « vous ».
