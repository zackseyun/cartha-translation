  source_fidelity: 'Le rendu suit fidèlement la construction essentielle de l’hébreu : la prosternation volontaire de Moïse devant Yahweh, sa durée de quarante jours et quarante nuits, et le motif introduit par כִּי, à savoir la déclaration préalable de Yahweh qu’il détruirait le peuple. « Je me suis donc prosterné » est une traduction contextuellement juste du hitpael de נפל. L’omission de la reprise relative redondante (« que je me suis prosterné ») est acceptable en français : elle ne crée pas de sens distinct et sa reproduction littérale serait artificielle.'
