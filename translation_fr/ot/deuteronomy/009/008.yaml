  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: fr
  text: Même à Horeb[a], vous avez provoqué la colère de Yahweh, et Yahweh s’est irrité contre vous au point de vouloir vous détruire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À Horeb » ou « Et à Horeb » ; la conjonction hébraïque peut simplement poursuivre le discours, bien qu’elle semble ici avoir une valeur emphatique.
    reason: lexical_alternative
  - marker: b
    text: Ou « Yahweh s’est irrité contre vous pour vous détruire ». L’hébreu relie directement la colère de Yahweh à la destruction qui vous menaçait.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Même à l’Horeb
  rationale: La conjonction ו peut simplement poursuivre le discours (« Et à l’Horeb »), mais le contexte récapitulatif permet une valeur emphatique bien rendue en français par « Même ». Le nom traditionnel « Horeb » prend normalement l’article en français.
- source_word: הִקְצַפְתֶּם אֶת־יְהוָה
  choice: vous avez provoqué la colère de Yahweh
  rationale: Le hiphil de קצף exprime le fait de susciter la colère. Cette formulation française conserve la valeur causative et la gravité de l’offense sans lourdeur archaïque.
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  choice: Yahweh s’est tellement irrité contre vous
  rationale: אנף désigne une vive colère. « S’irriter contre » convient à la construction avec ב et « tellement… que » relie naturellement cette colère à la destruction envisagée, sans faire de l’intensité une nuance indépendante du complément infinitif.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: qu’il voulait vous détruire
  rationale: Le hiphil de שׁמד signifie détruire ou exterminer. Dans cette construction, לְ avec l’infinitif peut exprimer le but ou l’issue visée; « voulait vous détruire » rend idiomatiquement l’intention menaçante sans affirmer que la destruction a eu lieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre de Dieu. « Yahweh » le représente directement et évite de le remplacer par un titre.
- issue: Rapport entre la colère divine et la destruction
  choice: s’est tellement irrité contre vous qu’il voulait vous détruire
  alternative: s’est irrité contre vous pour vous détruire
  rationale: L’infinitif précédé de לְ lie étroitement la colère à la destruction visée, mais peut être compris en termes de but ou de conséquence. La traduction principale est naturelle en français et la note conserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient au rappel direct d’événements passés; « s’irriter » garde un registre soutenu sans archaïsme. L’ambiguïté de la conjonction initiale et celle du rapport entre colère et destruction sont signalées en notes.
