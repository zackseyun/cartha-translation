source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: fr
  text: Veille à ne pas oublier Yahweh[a], ton Dieu, en n’observant pas ses commandements, ses règles et ses prescriptions, que je te prescris aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin יהוה (YHWH), rendu ici par « Yahweh »; selon l’usage traditionnel, on peut aussi traduire « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Veille à
  rationale: La formule d’avertissement appelle à une vigilance personnelle. « Veille à » est naturel en français moderne tout en gardant la force de l’impératif.
- source_word: פֶּן תִּשְׁכַּח
  choice: ne pas oublier
  rationale: Après l’expression de vigilance, l’infinitif négatif français rend naturellement le danger introduit par פֶּן.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré, et le suffixe singulier est rendu par « ton », conformément à l’adresse individuelle du texte hébreu.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: en négligeant d’observer
  rationale: Cette formulation exprime naturellement que l’oubli de Dieu se manifeste concrètement par le défaut d’obéissance, sans réduire l’oubli à une simple défaillance de mémoire.
- source_word: מִצְוֺתָיו
  choice: ses commandements
  rationale: Terme courant et précis pour les prescriptions explicites de l’alliance.
- source_word: מִשְׁפָּטָיו
  choice: ses règles
  rationale: « Règles » conserve ici la portée juridique de מִשְׁפָּטִים dans une langue plus actuelle que « ordonnances » ou « jugements ».
- source_word: חֻקֹּתָיו
  choice: ses prescriptions
  rationale: Le mot désigne des dispositions établies. « Prescriptions » garde la nuance juridique et se distingue convenablement de « commandements » et « règles ».
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: Cette tournure française naturelle exprime l’acte présent de transmettre des commandements, tout en conservant l’insistance deutéronomique sur « aujourd’hui ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin. « Yahweh » le représente directement plutôt que de lui substituer un titre, tout en signalant l’usage traditionnel dans une note.
- issue: Rapport entre l’oubli de Dieu et la désobéissance
  choice: L’oubli se manifeste « en négligeant d’observer » les prescriptions
  alternative: « de peur que tu n’oublies… au point de ne pas observer… »
  rationale: La construction לְבִלְתִּי שְׁמֹר peut exprimer la manière ou le résultat concret de l’oubli. Le texte principal retient la relation de manière, tandis que la note préserve une traduction plus formelle.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier reflète les formes hébraïques de deuxième personne du singulier. La série juridique est conservée en trois termes distincts sans archaïsmes inutiles.
