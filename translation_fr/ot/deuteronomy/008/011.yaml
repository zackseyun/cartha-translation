revisions:
- from: Veille à ne pas oublier Yahweh[a], ton Dieu, en négligeant[b] d’observer ses commandements, ses règles et ses prescriptions, que je te donne aujourd’hui.
  to: Veille à ne pas oublier Yahweh[a], ton Dieu, en n’observant pas ses commandements, ses règles et ses prescriptions, que je te prescris aujourd’hui.
  rationale: La révision remplace « donne » par « prescris » afin de conserver la force de מְצַוְּךָ, et emploie « en n’observant pas » pour refléter sans surinterprétation la négation de l’infinitif hébreu. La note b préserve l’interprétation plus idiomatique de la relation entre oubli et désobéissance. L’ancre b doit être placée après « n’observant pas » dans la mise en page finale si les notes lexicales sont affichées.
