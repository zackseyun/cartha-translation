  text: אֶ֗רֶץ אֲשֶׁ֨ר לֹ֤א בְ/מִסְכֵּנֻת֙ תֹּֽאכַל בָּ֣/הּ לֶ֔חֶם לֹֽא תֶחְסַ֥ר כֹּ֖ל בָּ֑/הּ אֶ֚רֶץ אֲשֶׁ֣ר אֲבָנֶ֣י/הָ בַרְזֶ֔ל וּ/מֵ/הֲרָרֶ֖י/הָ תַּחְצֹ֥ב נְחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: fr
  text: un pays où tu ne mangeras pas ton pain dans la pauvreté[a] et où tu ne manqueras de rien ; un pays dont les pierres sont du fer et des collines duquel tu extrairas du cuivre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le dénuement » ou « dans la pénurie ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner le cuivre ou le bronze ; « cuivre » convient mieux ici, puisque le verset parle d’une matière extraite des collines.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: dans la pauvreté
  rationale: Le nom désigne la pauvreté, le dénuement ou la pénurie. « Dans la pauvreté » conserve les conditions de privation évoquées sans faire double emploi avec la proposition suivante.
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens concret de base est « pain ». Le contexte lui donne une portée alimentaire plus large, mais il n'est pas nécessaire de l'expliciter dans le texte.
- source_word: תֶחְסַר כֹּל
  choice: tu ne manqueras de rien
  rationale: Cette formulation française naturelle rend la négation et la totalité exprimée par כֹּל.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: dont les pierres sont du fer
  rationale: Cette tournure préserve l'image appositionnelle concise de l'hébreu, probablement évocatrice de pierres riches en minerai de fer, sans l'expliciter dans le texte.
- source_word: תַּחְצֹב
  choice: tu extrairas
  rationale: Le verbe signifie tailler ou extraire en creusant. « Extraire » convient naturellement à une ressource minérale tirée des collines et évite l'idée peu idiomatique de « carrier du cuivre ».
- source_word: נְחֹשֶׁת
  choice: cuivre
  rationale: Le mot peut désigner le cuivre ou le bronze. Puisqu'il s'agit ici d'une matière extraite du sol, « cuivre » est préférable, le bronze étant un alliage.
