source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: fr
  text: Vous veillerez à mettre en pratique tout le commandement[a] que je vous prescris aujourd’hui, afin que vous viviez, deveniez nombreux, entriez et preniez possession[b] du pays que Yahweh a juré de donner à vos pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tous les commandements ». L’hébreu emploie un singulier collectif : « tout le commandement ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « en héritiez ». Le verbe hébreu peut désigner le fait d’hériter ou de prendre possession.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire les pères ancestraux d’Israël, notamment les patriarches.
    reason: referent_clarification
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: tout le commandement
  rationale: Le singulier collectif hébreu est conservé en français naturel. Il présente l’ensemble de ce qui est commandé comme un tout; «tous les commandements» reste une possibilité de sens.
- source_word: מְצַוְּךָ הַיּוֹם
  choice: que je vous donne aujourd’hui
  rationale: Dans le contexte d’un commandement, «donner» est idiomatique en français et rend l’acte présent de prescrire. Le français ne peut reproduire la variation hébraïque entre le suffixe singulier adressé à Israël collectivement et les formes verbales plurielles sans alourdir le texte.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: vous veillerez à mettre en pratique
  rationale: Cette formulation rend conjointement l’attention exprimée par שׁמר et l’exécution concrète exprimée par עשה, sans le calque peu naturel «garder pour faire».
- source_word: לְמַעַן
  choice: afin que
  rationale: Marque clairement le rapport de finalité, avec un registre biblique actuel et digne.
- source_word: תִּחְיוּן
  choice: vous viviez
  rationale: Rendu direct du verbe «vivre», dans la proposition finale introduite par «afin que».
- source_word: וּרְבִיתֶם
  choice: deveniez nombreux
  rationale: Le verbe signifie ici croître en nombre. Cette expression est plus transparente en français moderne que «vous multipliiez» employé absolument.
- source_word: וּבָאתֶם
  choice: entriez dans le pays
  rationale: Le complément implicite est naturellement explicité en français à partir de la suite immédiate de la phrase.
- source_word: וִירִשְׁתֶּם
  choice: en preniez possession
  rationale: ירשׁ peut évoquer l’héritage ou la prise de possession. Dans ce contexte d’entrée dans le pays, cette traduction exprime clairement l’acquisition effective sans effacer l’autre nuance, signalée en note.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: «Le pays» est naturel en français pour le territoire promis à Israël et évite l’ambiguïté moderne de «la terre», tout en gardant la référence territoriale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: נִשְׁבַּע
  choice: a juré de donner
  rationale: '«A juré» conserve la force du serment. «De donner» explicite en français l’objet implicite du serment: le pays destiné aux pères et à leur descendance.'
- source_word: לַאֲבֹתֵיכֶם
  choice: à vos pères
  rationale: Le terme masculin concret est conservé; il désigne ici les pères ancestraux d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. La translittération le distingue d’un titre et préserve sa fonction d’alliance.
- issue: Portée de כָּל הַמִּצְוָה
  choice: tout le commandement
  alternative: tous les commandements
  rationale: Le singulier collectif est maintenu afin de ne pas décider silencieusement si Moïse envisage ici l’instruction comme une unité ou chaque prescription distributivement.
- issue: Nuance de וִירִשְׁתֶּם
  choice: en preniez possession
  alternative: en héritiez
  rationale: La prise de possession convient au mouvement d’entrée dans le pays, tandis que la nuance possible d’héritage est conservée en note.
- issue: Référent de אֲבֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le masculin lexical de l’hébreu est conservé. Une note précise qu’il s’agit des pères ancestraux d’Israël sans neutraliser le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la longue progression du verset hébreu tout en employant l’expression idiomatique «veiller à mettre en pratique». Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
