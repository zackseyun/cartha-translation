  text: פֶּן תֹּאכַ֖ל וְ/שָׂבָ֑עְתָּ וּ/בָתִּ֥ים טוֹבִ֛ים תִּבְנֶ֖ה וְ/יָשָֽׁבְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/012.yaml
  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: fr
  text: de peur que, lorsque vous aurez mangé à satiété[a], que vous aurez construit de belles maisons et que vous vous y serez installés,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque vous aurez mangé et serez rassasiés ». Le verbe hébreu peut évoquer le fait d’être repu ou pleinement satisfait.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que
  rationale: Introduit, en dépendance du contexte précédent, la situation redoutée dans cet avertissement. Cette tournure conserve la force admonitrice de l’hébreu.
- source_word: תֹּאכַל וְשָׂבָעְתָּ
  choice: après avoir mangé et être rassasié
  rationale: La séquence décrit des actes envisagés comme accomplis dans la situation future contre laquelle Moïse met en garde. « Rassasié » exprime directement l’idée d’avoir mangé à satiété.
- source_word: וּבָתִּים טוֹבִים
  choice: de belles maisons
  rationale: Dans ce contexte de prospérité, טוֹבִים qualifie la valeur ou la qualité des maisons. « Belles maisons » est naturel en français sans accentuer indûment leur luxe.
- source_word: תִּבְנֶה
  choice: après avoir construit
  rationale: L’infinitif passé coordonné rend naturellement en français l’action accomplie envisagée par la mise en garde.
- source_word: וְיָשָׁבְתָּ
  choice: et vous y être installé
  rationale: Le verbe ישׁב peut signifier habiter, demeurer ou s’installer. « Vous y être installé » convient à des maisons nouvellement construites; « y » reprend explicitement les maisons, comme l’exige le français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement collectif représente le singulier hébreu adressé à Israël. La phrase reste ouverte par une virgule, puisque le verset constitue une proposition subordonnée qui se poursuit dans le contexte.
