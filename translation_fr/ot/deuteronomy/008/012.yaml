  source_fidelity: 'Le sens de la séquence d’avertissement est bien rendu : manger jusqu’à satiété, bâtir des maisons de qualité et y habiter. La formulation révisée conserve la valeur prospective des verbes hébreux et le caractère suspendu de la proposition, qui se poursuit au verset suivant.'
  naturalness: Le texte actuel présente une coordination maladroite (« après avoir… après avoir… ») et une incohérence d’accord avec le vouvoiement collectif (« vous y être installé » au singulier). Une structure temporelle explicite avec des futurs antérieurs est plus naturelle et claire en français moderne.
