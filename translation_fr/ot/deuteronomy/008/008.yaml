lexical_decisions:
- source_word: אֶרֶץ
  choice: un pays de
  rationale: Dans le contexte, אֶרֶץ reprend la description du pays promis. « Un pays de » est naturel en français et conserve la structure descriptive ainsi que la répétition rhétorique de l’hébreu.
- source_word: חִטָּה
  choice: blé
  rationale: Équivalent français courant et précis de la céréale désignée.
- source_word: שְׂעֹרָה
  choice: orge
  rationale: Équivalent français courant; le binôme « blé et orge » rend naturellement l’association hébraïque.
- source_word: גֶּפֶן
  choice: vignes
  rationale: Le singulier hébreu a ici une valeur collective. Le pluriel français convient à l’énumération des cultures du pays sans expliciter inutilement « vignes à raisin ».
- source_word: תְּאֵנָה
  choice: figuiers
  rationale: Le nom hébreu désigne normalement le figuier plutôt que seulement son fruit; « figuiers » préserve cette valeur lexicale.
- source_word: רִמּוֹן
  choice: grenadiers
  rationale: Dans cette série de végétaux cultivés, « grenadiers » rend naturellement le référent arboricole possible du terme, en parallèle avec « vignes » et « figuiers ».
- source_word: זֵית שֶׁמֶן
  choice: huile d’olive
  rationale: L’expression construite associe l’olive et l’huile. « Huile d’olive » en transmet clairement et idiomatiquement le sens en français, sans la tournure peu naturelle « olives à huile ».
- source_word: דְּבָשׁ
  choice: miel
  rationale: « Miel » est le sens courant et traditionnel du terme. Dans une liste des produits du pays, celui-ci peut toutefois désigner plus largement un sirop sucré, notamment de dattes; cette possibilité est conservée en note.
