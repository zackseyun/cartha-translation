translation_notes:
  register: Français international moderne, clair et digne. La répétition de « un pays de » reproduit l’insistance de l’hébreu. La ponctuation finale maintient la continuité syntaxique avec le contexte. Le marqueur de note est placé après « miel », le terme auquel la variante se rapporte.
