  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: fr
  text: Tu observeras donc[a] les commandements de Yahweh, ton Dieu, en marchant dans ses voies et en le craignant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et tu observeras ». La conjonction hébraïque peut marquer une simple coordination, bien qu’elle ait probablement ici une valeur déductive en raison du contexte précédent.
    reason: lexical_alternative
  - marker: b
    text: '« Le craindre » désigne ici une crainte révérencielle devant Dieu ; autre traduction possible : « le révérer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Ainsi, tu observeras
  rationale: Dans le contexte de l’alliance, שׁמר signifie garder ou observer les commandements. « Observer » est idiomatique en français pour l’obéissance à des prescriptions. La conjonction וְ reçoit ici une valeur probablement déductive, exprimée par « Ainsi ».
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Le pluriel construit de מִצְוָה désigne les obligations prescrites par Dieu. « Commandements » conserve la portée juridique et liée à l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier de deuxième personne est rendu directement par le possessif « ton ».
- source_word: לָלֶכֶת
  choice: en marchant
  rationale: L’infinitif précise la manière dont les commandements sont observés. « En marchant » rend clairement ce rapport tout en conservant la métaphore hébraïque.
- source_word: בִּדְרָכָיו
  choice: dans ses voies
  rationale: דֶּרֶךְ désigne ici métaphoriquement la conduite prescrite par Dieu. « Marcher dans ses voies » garde l’image et demeure compréhensible en français biblique moderne.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: et en le craignant
  rationale: Le verbe ירא appliqué à Dieu comporte l’idée d’une crainte révérencielle. « Craindre » en maintient la force lexicale et la tension théologique, sans l’atténuer en simple respect.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ou le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Sens de la crainte envers Dieu
  choice: en le craignant
  alternative: en le révérant
  rationale: Dans ce contexte d’alliance, la crainte est révérencielle, mais le verbe hébreu conserve une notion réelle de crainte. Le texte principal garde donc cette formulation forte, avec une note explicative.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme interlocuteur collectif. La métaphore « marcher dans ses voies » est conservée en raison de sa clarté et de son importance biblique.
