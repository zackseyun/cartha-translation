source:
  edition: WLC
  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: fr
  text: Reconnais donc dans ton cœur que, tout comme un homme corrige[a] son fils, Yahweh ton Dieu te corrige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « discipline » ou « reprend »; le verbe hébreu peut désigner à la fois une correction et une formation éducative.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Reconnais donc
  rationale: Le qal parfait 2e personne masculine singulière, relié au contexte par וְ, a ici une valeur résultative et exhortative. « Reconnais donc » exprime naturellement cette invitation à tirer une conclusion intérieure.
- source_word: עִם לְבָבֶךָ
  choice: dans ton cœur
  rationale: L’expression hébraïque désigne une conviction ou une prise de conscience intérieure. « Dans ton cœur » conserve l’image biblique sans calquer artificiellement la préposition.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’Israël doit reconnaître.
- source_word: כַּאֲשֶׁר
  choice: tout comme
  rationale: Cette tournure marque clairement la comparaison entre la correction d’un fils par un homme et celle qu’exerce Yahweh.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: corrige / te corrige
  rationale: La racine יסר peut évoquer la correction, la réprimande et la formation par la discipline. « Corriger » est naturel en français et garde une force corrective; la répétition du même verbe reproduit celle de l’hébreu.
- source_word: אִישׁ
  choice: un homme
  rationale: Le texte dit explicitement « un homme » plutôt que « un père »; le rapport paternel ressort déjà de « son fils ».
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom hébreu désigne précisément un fils, et non un enfant de manière générale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Traduction directe de la désignation relationnelle et covenantale avec suffixe de deuxième personne du singulier.
theological_decisions:
- issue: Nature de la correction divine
  choice: corrige
  alternative: discipline; reprend; forme
  rationale: « Corrige » maintient la dimension potentiellement pénible et corrective de יסר sans réduire l’action divine à un châtiment punitif. La note signale aussi sa dimension éducative.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le Tétragramme comme nom personnel; « Yahweh » le représente directement en français.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme à une seule personne. « Dans ton cœur » conserve l’anthropologie imagée du texte, tandis que « tout comme » rend explicite et fluide la comparaison.
