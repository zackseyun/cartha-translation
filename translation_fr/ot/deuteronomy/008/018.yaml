revisions:
- from: Mais souviens-toi de Yahweh, ton Dieu, car c’est lui qui te donne la force d’acquérir des richesses[a], afin d’établir son alliance, celle qu’il a jurée à tes pères[b], comme on le voit aujourd’hui[c].
  to: Mais souviens-toi de Yahweh, ton Dieu, car c’est lui qui te donne la force d’acquérir des richesses[a], afin d’établir son alliance, qu’il a promise sous serment à tes pères[b], comme on le voit aujourd’hui[c].
  rationale: La révision se limite à remplacer l’expression française peu naturelle « l’alliance qu’il a jurée » par « l’alliance qu’il a promise sous serment ». Le sens de l’hébreu — l’alliance que Dieu a jurée aux pères — est ainsi conservé sans imposer une interprétation théologique supplémentaire. La note b précise également, sans neutraliser le texte, que les « pères » sont les patriarches de l’alliance.
