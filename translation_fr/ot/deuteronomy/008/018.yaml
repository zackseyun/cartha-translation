base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: fr
  text: Mais souviens-toi de Yahweh, ton Dieu, car c’est lui qui te donne la force d’acquérir des richesses[a], afin d’établir son alliance, qu’il a promise sous serment à tes pères[b], comme on le voit aujourd’hui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « produire des richesses », « faire fortune » ou, plus largement, « réussir dans ses entreprises ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tes pères » : il s’agit ici des pères patriarches auxquels l’alliance a été promise.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement « comme en ce jour » : expression signifiant « comme cela est manifeste aujourd’hui » ou « comme c’est le cas à présent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Mais souviens-toi
  rationale: Dans ce discours d’exhortation, la forme verbale a valeur impérative. « Mais » rend le contraste avec l’attribution des richesses à sa propre force au verset précédent.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré, tandis que le suffixe de la deuxième personne du singulier est rendu par « ton », ce qui conserve l’adresse personnelle et l’expression d’alliance.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: car c’est lui qui te donne
  rationale: « Car » introduit la raison de se souvenir, et « c’est lui » restitue l’insistance portée par le pronom הוּא.
- source_word: כֹּחַ לַעֲשׂוֹת חָיִל
  choice: la force d’acquérir des richesses
  rationale: כֹּחַ désigne ici la force ou la capacité donnée par Dieu. Dans le contexte économique immédiat de Deutéronome 8.17-18, חָיִל renvoie principalement aux richesses, même si l’expression peut avoir un sens plus large.
- source_word: לְמַעַן הָקִים אֶת בְּרִיתוֹ
  choice: afin d’établir son alliance
  rationale: לְמַעַן marque le but. Le hiphil de קום peut exprimer l’établissement, la confirmation ou la mise en œuvre de l’alliance ; « établir » conserve cette portée sans réduire le sens à une simple répétition de la promesse.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: celle qu’il a jurée à tes pères
  rationale: La reprise par « celle » clarifie en français que le relatif se rapporte à l’alliance. « Tes pères » conserve le masculin pluriel et la référence particulière aux ancêtres de l’alliance.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Cette expression deutéronomique indique que l’accomplissement ou la confirmation est manifeste dans la situation présente. La formulation française en explicite légèrement la valeur idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom personnel divin ; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée de חָיִל dans ce contexte
  choice: des richesses
  alternative: la réussite
  rationale: Le verset 17 parle explicitement des biens qu’Israël pourrait attribuer à sa propre force. « Richesses » maintient ce lien discursif, tandis qu’une note signale la portée possible plus large.
- issue: Sens de הָקִים appliqué à l’alliance
  choice: établir
  alternative: confirmer
  rationale: Le verbe peut évoquer le fait de faire tenir, de confirmer ou de mettre en œuvre l’alliance. « Établir » garde ouverte cette tension entre confirmation et réalisation historique.
- issue: Référent de אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Dans ce cadre d’alliance, le terme vise particulièrement les pères auxquels la promesse a été jurée ; la traduction conserve cette spécificité.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque à Israël considéré collectivement. La syntaxe reste proche de l’original tout en explicitant naturellement l’idiome final.
