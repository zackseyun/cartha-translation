source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: fr
  text: Et si tu oublies bel et bien[a] Yahweh, ton Dieu, si tu suis d’autres dieux, les sers et te prosternes devant eux, je témoigne aujourd’hui contre vous que vous périrez à coup sûr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « oubliant, tu oublies » ; cette tournure hébraïque renforce le verbe.'
    reason: Préciser la valeur emphatique de l’infinitif absolu hébreu.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Et si
  rationale: Introduit naturellement en français une mise en garde conditionnelle tout en maintenant le lien avec le discours précédent.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: tu oublies bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Bel et bien » exprime cette insistance sans lui donner le sens plus précis d’un oubli total.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu et en préserve la valeur d’alliance.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Conserve la deuxième personne du singulier et la relation d’alliance exprimée par le suffixe possessif.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: si tu suis
  rationale: « Suivre » rend naturellement l’expression hébraïque d’allégeance. La répétition de « si » clarifie en français que les actes suivants prolongent la condition initiale.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Rend directement l’adjectif « autres » sans introduire l’idée plus interprétative de dieux étrangers.
- source_word: וַעֲבַדְתָּם
  choice: les sers
  rationale: Préserve le sens propre de « servir » et le distingue de la prosternation mentionnée juste après.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: te prosternes devant eux
  rationale: Conserve à la fois le geste concret de prosternation et sa portée cultuelle.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: je témoigne aujourd’hui contre vous
  rationale: Maintient la force juridique du verbe et de la préposition, ainsi que le passage significatif du singulier au pluriel.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: que vous périrez à coup sûr
  rationale: L’infinitif absolu renforce ici la certitude de l’issue. « Périr » conserve la formulation résultative sans imposer explicitement un agent destructeur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom d’alliance sans le remplacer par un titre.
- issue: Alternance entre le singulier et le pluriel dans l’adresse
  choice: « tu » dans la condition, puis « vous » dans le témoignage et la conséquence
  alternative: Uniformiser tout le verset au singulier ou au pluriel
  rationale: L’hébreu passe intentionnellement des formes masculines singulières aux formes plurielles. La traduction conserve cette tension collective et individuelle au lieu de la lisser.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement puis le vouvoiement reflètent l’alternance de nombre du texte hébreu; « bel et bien » reste courant tout en portant nettement l’emphase.
