base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: fr
  text: qui t’a conduit à travers le vaste et redoutable désert, où il y avait des serpents brûlants[a], des scorpions et une terre aride[b] où il n’y avait pas d’eau, qui a fait jaillir pour toi de l’eau du rocher de silex,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serpents venimeux ». L’expression hébraïque traditionnellement rendue par « serpents brûlants » peut désigner des serpents dont la morsure provoquait une sensation de brûlure.
    reason: lexical_alternative
  - marker: b
    text: Ou « soif » ou « sécheresse ». Le terme hébreu évoque l’aridité extrême d’un lieu dépourvu d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: qui t’a conduit
  rationale: Le participe hiphil avec suffixe de deuxième personne du masculin singulier qualifie le SEIGNEUR dans la phrase plus large. Le passé composé exprime naturellement en français son action passée sans effacer la valeur descriptive de la proposition relative.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: à travers le vaste et redoutable désert
  rationale: « À travers » rend le parcours guidé; « désert » désigne ici une région sauvage et aride. « Vaste et redoutable » restitue les deux adjectifs dans un français actuel et digne.
- source_word: נָחָשׁ שָׂרָף
  choice: serpents brûlants
  rationale: L’expression associe le serpent à ce qui brûle, probablement en raison de l’effet de sa morsure. La formulation traditionnelle conserve l’image et la note signale l’interprétation lexicale possible.
- source_word: וְעַקְרָב
  choice: et de scorpions
  rationale: Équivalent lexical direct; le pluriel français convient à la valeur collective de l’énumération.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: terre aride où il n’y avait pas d’eau
  rationale: צִמָּאוֹן évoque la soif ou une sécheresse extrême. « Terre aride » donne un référent naturel à la relative et maintient l’image concrète d’un lieu sans eau.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: qui, pour toi, a fait jaillir de l’eau
  rationale: Le hiphil de יצא exprime le fait de faire sortir l’eau. « Faire jaillir » est idiomatique en français et garde la force concrète du miracle; « pour toi » rend explicitement לְךָ.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: du rocher de silex
  rationale: צוּר désigne un rocher et חַלָּמִישׁ le silex ou une pierre extrêmement dure. Le complément « de silex » préserve les deux éléments hébreux.
theological_decisions:
- issue: Nature des dangers du désert
  choice: Présenter les serpents, les scorpions et l’absence d’eau comme des réalités concrètes du parcours d’Israël.
  alternative: Interpréter les serpents brûlants de manière métaphorique ou généraliser toute la liste en « dangers du désert ».
  rationale: Le texte rappelle la conduite et la provision de Dieu dans l’expérience historique du désert; rien dans ce verset n’impose une lecture allégorique.
- issue: Sens de « serpents brûlants »
  choice: Conserver l’expression imagée dans le texte et indiquer en note qu’elle peut désigner des serpents venimeux dont la morsure produit une brûlure.
  alternative: Traduire directement par « serpents venimeux ».
  rationale: L’hébreu maintient l’idée de brûlure sans préciser explicitement s’il s’agit de l’espèce, de l’apparence ou de l’effet de la morsure. La traduction et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et soutenu. Le tutoiement singulier correspond au suffixe masculin singulier adressé collectivement à Israël. La ponctuation finale maintient le caractère de fragment intégré à la phrase environnante. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
