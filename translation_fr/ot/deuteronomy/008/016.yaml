base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: fr
  text: lui qui t’a nourri de manne dans le désert, une nourriture que tes pères[a] n’avaient pas connue, afin de t’humilier et de te mettre à l’épreuve, pour te faire du bien par la suite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes ancêtres ». L’hébreu dit littéralement « tes pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’avenir » ou « à la fin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: lui qui t’a nourri
  rationale: Le participe hiphil avec suffixe de deuxième personne poursuit la description de Dieu commencée au verset précédent. Cette tournure française conserve la valeur causative dans une formulation naturelle.
- source_word: מָן
  choice: manne
  rationale: « Manne » est la forme française traditionnelle et courante du nom hébreu désignant la nourriture du désert.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région aride et inhabitée. « Désert » est ici naturel en français et correspond au cadre de l’Exode.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: une nourriture que tes pères n’avaient pas connue
  rationale: L’explicitation « une nourriture » rend sans ambiguïté l’antécédent de la relative. Le plus-que-parfait convient au regard rétrospectif du passage et « connue » exprime le fait que la manne leur était inconnue.
- source_word: אֲבֹתֶיךָ
  choice: tes pères
  rationale: Le texte hébreu porte explicitement le pluriel masculin « pères ». Le texte principal le conserve, tandis qu’une note signale le sens collectif possible « ancêtres ».
- source_word: לְמַעַן עַנֹּתְךָ
  choice: afin de t’humilier
  rationale: לְמַעַן marque le but, et le piel de ענה peut signifier humilier ou affliger. Dans le contexte de Deutéronome 8, « humilier » exprime la visée pédagogique sans effacer l’épreuve pénible.
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: et de te mettre à l’épreuve
  rationale: נסה signifie éprouver ou tester. « Mettre à l’épreuve » est idiomatique en français et conserve la dimension intentionnelle du second but.
- source_word: לְהֵיטִבְךָ
  choice: pour te faire du bien
  rationale: Le hiphil de יטב signifie faire du bien à quelqu’un ou lui procurer un bienfait. La formulation garde le complément personnel exprimé par le suffixe hébreu.
- source_word: בְּאַחֲרִיתֶךָ
  choice: par la suite
  rationale: אַחֲרִית peut désigner la suite, l’avenir ou l’issue finale. « Par la suite » exprime naturellement le bienfait ultérieur sans imposer l’idée de la mort ou de la fin absolue.
theological_decisions:
- issue: Finalité des privations et de l’épreuve au désert
  choice: L’humiliation et la mise à l’épreuve sont présentées comme intentionnelles et orientées vers le bien ultérieur d’Israël.
  alternative: Comprendre l’humiliation et l’épreuve comme une punition purement rétributive.
  rationale: Les deux propositions de but en לְמַעַן aboutissent à לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ. La traduction conserve donc à la fois la dureté de l’expérience et l’intention bienveillante qui lui est attribuée, sans supprimer cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à Israël considéré collectivement. La répétition hébraïque de לְמַעַן est légèrement resserrée en français, tout en maintenant les deux finalités coordonnées.
