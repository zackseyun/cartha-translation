source:
  edition: WLC
  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: fr
  text: Il t’a humilié et t’a fait souffrir de la faim; ensuite, il t’a nourri de la manne, que ni toi ni tes ancêtres ne connaissiez, afin de te faire comprendre que l’être humain ne vit pas seulement de pain, mais que l’être humain vit de tout ce qui sort de la bouche de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « de toute parole qui sort de la bouche de Yahweh ». Littéralement, l’hébreu dit : « de tout ce qui sort de la bouche de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Il t’a humilié
  rationale: Le piel de ענה peut exprimer l’humiliation ou l’abaissement imposé. « Humilié » conserve ici la portée disciplinaire du contexte sans réduire le terme à la seule souffrance physique.
- source_word: וַיַּרְעִבֶךָ
  choice: t’a fait souffrir de la faim
  rationale: Le hiphil de רעב est causatif. Cette formulation française exprime clairement l’action divine et l’expérience réelle de la faim.
- source_word: וַיַּאֲכִלְךָ אֶת הַמָּן
  choice: il t’a nourri de la manne
  rationale: « Nourrir de » rend naturellement le causatif de אכל et conserve le nom traditionnel de cette nourriture du désert.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: que ni toi ni tes ancêtres ne connaissiez
  rationale: La tournure coordonnée est rendue par une construction française naturelle. « Connaître » désigne ici le fait d’avoir eu connaissance ou expérience de la manne.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: afin de te faire comprendre
  rationale: Le hiphil de ידע a une valeur causative. « Faire comprendre » restitue naturellement en français la visée pédagogique du geste divin.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Dans cette maxime, אָדָם a une portée générique et désigne l’humanité, non les hommes de sexe masculin. « L’être humain » est précis, naturel et inclusif sans élargir le sens.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: seulement de pain
  rationale: Cette formulation idiomatique conserve l’idée que le pain, pris isolément, ne suffit pas à faire vivre.
- source_word: כָּל מוֹצָא פִי יְהוָה
  choice: tout ce qui sort de la bouche de Yahweh
  rationale: מוֹצָא désigne littéralement ce qui sort ou procède. Cette traduction conserve l’étendue de l’expression hébraïque au lieu de la limiter silencieusement à « parole ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: l’être humain ne vit pas ... mais l’être humain vit
  rationale: La répétition explicite de « l’être humain » maintient le parallélisme et l’insistance rhétorique du texte hébreu.
theological_decisions:
- issue: Portée générique de אָדָם dans l’affirmation sur la vie humaine
  choice: l’être humain
  alternative: l’homme
  rationale: Le contexte formule une vérité concernant toute personne humaine. « L’être humain » rend cette portée générique sans laisser entendre une restriction masculine, tout en conservant le singulier représentatif.
- issue: Sens de מוֹצָא פִי יְהוָה
  choice: tout ce qui sort de la bouche de Yahweh
  alternative: toute parole qui sort de la bouche de Yahweh
  rationale: L’hébreu est plus large que le seul nom « parole ». La traduction retenue préserve cette largeur et laisse ouverte la relation contextuelle entre commandement, parole et provision divine.
- issue: Degré d’agentivité divine dans וַיַּרְעִבֶךָ
  choice: t’a fait souffrir de la faim
  alternative: t’a laissé avoir faim
  rationale: La forme causative attribue directement l’action à Dieu. La traduction ne l’atténue pas en simple permission, tout en évitant d’ajouter une explication théologique sur ses modalités.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse de Moïse à Israël envisagé collectivement. La répétition de « l’être humain » est volontaire afin de conserver le parallélisme hébreu.
