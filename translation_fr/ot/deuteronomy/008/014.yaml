  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: fr
  text: alors ton cœur s’élèvera, et tu oublieras Yahweh, ton Dieu, qui t’a fait sortir du pays d’Égypte, de la maison des esclaves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la maison de l’esclavage » ou « de la maison de servitude ». L’hébreu dit littéralement « de la maison des esclaves ».
    reason: Alternative lexicale et précision sur la formulation littérale de מִבֵּית עֲבָדִים.
lexical_decisions:
- source_word: וְרָם
  choice: alors ton cœur s’élèvera
  rationale: Le verbe רום exprime ici l’élévation du cœur dans l’orgueil. « S’élèvera » conserve l’image hébraïque, tandis que le contexte d’avertissement en indique la valeur négative.
- source_word: לְבָבֶךָ
  choice: ton cœur
  rationale: לֵבָב désigne ici l’être intérieur, notamment la volonté et les dispositions. « Ton cœur » est naturel et maintient l’image du texte source.
- source_word: וְשָׁכַחְתָּ
  choice: tu oublieras
  rationale: La forme verbale poursuit la séquence de conséquence commencée dans le contexte précédent. Le futur français rend clairement cet avertissement sans lui donner un sens passé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: 'Le suffixe de deuxième personne du singulier exprime directement la relation possessive et d’alliance : « ton Dieu ».'
- source_word: הַמּוֹצִיאֲךָ
  choice: qui t’a fait sortir
  rationale: Le participe avec article identifie Yahweh par son acte de délivrance. La proposition relative au passé composé est naturelle en français et conserve explicitement l’idée de sortie.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette formulation reflète l’expression hébraïque complète et convient à la formule solennelle de l’exode.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: Le pluriel concret עֲבָדִים signifie « esclaves ». Cette traduction conserve l’image de la maison et la réalité sociale concrète, plutôt que de les remplacer par une expression abstraite.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu et évite de le remplacer par un titre.
- issue: Traduction de מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  alternative: de la maison de l’esclavage ; de la maison de servitude
  rationale: Le choix retenu reproduit le pluriel concret « esclaves » et ne réduit pas la formule à la seule notion abstraite d’esclavage, tout en signalant en note les formulations françaises plus idiomatiques.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore de l’élévation du cœur et la cadence de la formule de l’exode. Le futur s’accorde avec le caractère conditionnel et avertisseur du contexte. Le marqueur de note est placé après l’expression qu’il explique.
