base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: fr
  text: Tu mangeras et tu seras rassasié, puis tu béniras[a] Yahweh, ton Dieu, pour le bon pays qu’il t’a donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remercieras » ou « loueras » Yahweh, ton Dieu ; l’hébreu dit littéralement « béniras », idiome biblique qui exprime la reconnaissance en disant du bien de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Tu mangeras
  rationale: Le parfait qal à la 2e personne masculine singulière, précédé de la conjonction, s’inscrit ici dans une séquence à valeur future et exhortative. Le futur français rend naturellement cette portée.
- source_word: וְשָׂבָעְתָּ
  choice: tu seras rassasié
  rationale: Le verbe שׂבע exprime le fait d’avoir mangé à satiété. « Être rassasié » conserve cette idée concrète dans un registre digne et courant.
- source_word: וּבֵרַכְתָּ
  choice: tu béniras
  rationale: Lorsque Dieu est l’objet de ברך, le verbe signifie le bénir, c’est-à-dire dire du bien de lui avec reconnaissance et louange. « Bénir » préserve l’idiome biblique sans en réduire la portée à « remercier » ou « louer ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: La forme avec suffixe de deuxième personne masculine singulière exprime directement la relation possessive et d’alliance.
- source_word: עַל
  choice: pour
  rationale: 'Avec ברך, la préposition introduit ici le motif de la bénédiction : le don du bon pays.'
- source_word: הָאָרֶץ הַטֹּבָה
  choice: le bon pays
  rationale: Dans ce contexte deutéronomique, אֶרֶץ désigne le pays donné à Israël. « Le bon pays » est naturel en français et conserve le motif de sa bonté sans le préciser indûment.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: qu’il t’a donné
  rationale: La proposition relative présente le pays comme le don accompli de Dieu. Le passé composé en exprime naturellement la pertinence présente.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le Tétragramme comme nom personnel. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de ברך lorsque Dieu en est l’objet
  choice: béniras
  alternative: remercieras ou louerais
  rationale: « Bénir » garde l’idiome hébreu et sa richesse sémantique, qui englobe reconnaissance et louange sans se limiter à l’une d’elles.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier suit les formes hébraïques à la deuxième personne masculine singulière. « Puis » explicite légèrement la succession naturelle des verbes coordonnés sans transformer la relation en condition temporelle.
