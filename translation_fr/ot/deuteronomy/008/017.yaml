source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ בִּ/לְבָבֶ֑/ךָ כֹּחִ/י֙ וְ/עֹ֣צֶם יָדִ֔/י עָ֥שָׂה לִ֖/י אֶת הַ/חַ֥יִל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: fr
  text: 'et que tu te dises en toi-même : « C’est ma puissance et la force de ma main qui m’ont procuré cette richesse[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette prospérité ». Le mot hébreu חַיִל peut désigner, selon le contexte, la richesse, les ressources, la force ou la capacité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ בִּלְבָבֶךָ
  choice: et que tu te dises en toi-même
  rationale: Dans cette mise en garde, le parfait avec waw exprime une éventualité liée au contexte précédent. « Se dire en soi-même » rend naturellement en français l’idée d’une parole intérieure portée par l’expression hébraïque « dans ton cœur ».
- source_word: כֹּחִי
  choice: ma puissance
  rationale: כֹּחַ désigne ici la capacité ou la puissance personnelle que le peuple pourrait considérer comme la source de sa réussite.
- source_word: וְעֹצֶם יָדִי
  choice: et la force de ma main
  rationale: Cette formulation conserve l’image concrète de la main comme symbole de l’action et des capacités humaines, ainsi que la nuance de vigueur exprimée par עֹצֶם.
- source_word: עָשָׂה לִי
  choice: m’ont procuré
  rationale: Le sens littéral « ont fait pour moi » serait peu naturel. Avec חַיִל comme objet, l’expression évoque ici l’obtention ou la production de richesse. Le pluriel français s’accorde avec les deux éléments du sujet coordonné.
- source_word: הַחַיִל הַזֶּה
  choice: cette richesse
  rationale: Dans le contexte immédiat de l’abondance matérielle en Deutéronome 8, חַיִל désigne le plus naturellement la richesse ou les ressources acquises; הַזֶּה est rendu par le démonstratif singulier « cette ».
theological_decisions:
- issue: Sens de חַיִל dans l’avertissement lié à l’alliance
  choice: richesse
  alternative: prospérité, ressources ou puissance
  rationale: Le contexte porte sur les biens, l’abondance et le risque d’attribuer sa réussite à ses propres capacités. « Richesse » exprime clairement cet enjeu sans réduire le terme à la seule puissance militaire; une note maintient toutefois l’étendue sémantique de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le subjonctif « que tu te dises » rattache le verset à la séquence d’avertissement qui précède. La métaphore hébraïque de la main est conservée, tandis que l’idiome du cœur est rendu par une expression française courante de parole intérieure.
