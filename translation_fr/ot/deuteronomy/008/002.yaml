source:
  edition: WLC
  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: fr
  text: 'Souviens-toi de tout le chemin que Yahweh ton Dieu t’a fait parcourir pendant ces quarante années dans le désert, afin de t’humilier, de te mettre à l’épreuve et de savoir ce qu’il y avait dans ton cœur[a] : allais-tu garder ses commandements ou non ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de révéler ce qu’il y avait dans ton cœur ». L’hébreu dit littéralement « de savoir ce qu’il y avait dans ton cœur », expression conservée dans le texte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Souviens-toi
  rationale: Dans ce discours d’instruction, la forme verbale coordonnée a une valeur d’exhortation. L’impératif français est naturel et conserve cette force.
- source_word: כָּל הַדֶּרֶךְ
  choice: tout le chemin
  rationale: L’expression évoque à la fois le parcours et l’ensemble de l’expérience vécue par Israël; cette formulation française garde l’image hébraïque sans être obscure.
- source_word: הֹלִיכֲךָ
  choice: t’a fait parcourir
  rationale: Le hiphil de הלך est causatif. Cette traduction conserve cette nuance tout en exprimant naturellement la conduite divine au long du parcours.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel, plutôt que remplacement par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement le possessif et préserve le langage de la relation d’alliance.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: pendant ces quarante années
  rationale: Formulation idiomatique en français qui indique clairement la durée de la marche conduite par Dieu.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français biblique courant, « désert » désigne naturellement l’espace aride et inhabité de la marche d’Israël.
- source_word: לְמַעַן
  choice: afin de
  rationale: Marque explicitement le but en français naturel et soutenu.
- source_word: עַנֹּתְךָ
  choice: t’humilier
  rationale: Dans ce contexte, ענה décrit l’abaissement produit par l’épreuve et la dépendance; « humilier » maintient le lien lexical avec le verset suivant.
- source_word: לְנַסֹּתְךָ
  choice: te mettre à l’épreuve
  rationale: Rend le sens évaluatif de נסה dans un français moderne, sans suggérer nécessairement une incitation au mal.
- source_word: לָדַעַת
  choice: de savoir
  rationale: Traduction directe de ידע, qui préserve le langage anthropomorphique et sa tension théologique.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: ce qu’il y avait dans ton cœur
  rationale: « Cœur » conserve l’image hébraïque de l’être intérieur, notamment de la volonté et de la pensée.
- source_word: הֲתִשְׁמֹר מצותו אִם־לֹא
  choice: allais-tu garder ses commandements ou non ?
  rationale: La question indirecte hébraïque est rendue comme une interrogation explicative après les deux-points, ce qui reste fidèle et naturel en français.
theological_decisions:
- issue: Langage anthropomorphique dans « savoir ce qu’il y avait dans ton cœur »
  choice: Conserver « savoir » dans le texte principal
  alternative: « révéler ce qu’il y avait dans ton cœur » ou « faire apparaître ce qu’il y avait dans ton cœur »
  rationale: L’hébreu emploie directement le verbe « savoir/connaître ». La traduction ne résout donc pas implicitement la tension avec l’omniscience divine; une autre compréhension possible est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque à Israël envisagé collectivement. La structure ample du verset est conservée, avec deux-points et interrogation pour clarifier la dernière proposition.
