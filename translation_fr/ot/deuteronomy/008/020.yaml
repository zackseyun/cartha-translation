  text: כַּ/גּוֹיִ֗ם אֲשֶׁ֤ר יְהוָה֙ מַאֲבִ֣יד מִ/פְּנֵי/כֶ֔ם כֵּ֖ן תֹאבֵד֑וּ/ן עֵ֚קֶב לֹ֣א תִשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: fr
  text: Comme les nations que Yahweh détruit devant vous, ainsi vous périrez, parce que vous n’écouterez pas la voix de Yahweh, votre Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « écouter la voix de Yahweh, votre Dieu ». Cette expression peut aussi signifier « obéir à Yahweh, votre Dieu ».
    reason: alternative lexicale
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Comme les nations
  rationale: La préposition כְּ introduit une comparaison, et גּוֹיִם désigne ici les nations établies dans le pays. « Comme les nations » restitue naturellement la construction comparative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin afin de préserver son caractère personnel plutôt que de lui substituer un titre.
- source_word: מַאֲבִיד
  choice: fait disparaître
  rationale: Le participe hiphil de אבד exprime une action causative en cours. « Fait disparaître » conserve cette valeur et s’accorde avec l’image des nations ôtées du chemin d’Israël.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: L’expression signifie littéralement « de devant vous » et évoque ici l’élimination des nations à mesure qu’Israël avance. « Devant vous » est idiomatique en français.
- source_word: כֵּן תֹאבֵדוּן
  choice: vous périrez vous aussi
  rationale: כֵּן répond à la comparaison initiale et תֹאבֵדוּן, qal inaccompli pluriel de אבד, annonce la perte d’Israël. « Vous aussi » rend clairement la corrélation sans alourdir la phrase.
- source_word: עֵקֶב
  choice: parce que
  rationale: Le terme introduit la cause ou le fondement du jugement annoncé. « Parce que » est son équivalent français le plus direct dans ce contexte.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: vous n’aurez pas écouté la voix de
  rationale: L’expression idiomatique associe l’écoute à l’obéissance. Le futur antérieur français présente naturellement le refus d’écouter comme la cause préalable du jugement futur, tout en conservant l’image explicite de la voix.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Avec Yahweh comme référent et le suffixe de deuxième personne du pluriel, le syntagme désigne sans ambiguïté le Dieu d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: 'Valeur de שׁמע בקול : écoute ou obéissance'
  choice: écouté la voix de
  alternative: obéi à
  rationale: L’idiome comporte à la fois l’idée d’entendre et celle d’obéir. Le texte principal maintient l’image hébraïque et sa portée relationnelle; la note signale le sens idiomatique possible sans résoudre silencieusement cette nuance.
- issue: Valeur temporelle de לֹא תִשְׁמְעוּן après עֵקֶב
  choice: vous n’aurez pas écouté
  alternative: vous n’écouterez pas / vous n’avez pas écouté
  rationale: L’inaccompli s’inscrit dans un avertissement prospectif. Le futur antérieur exprime en français que la non-écoute sera la cause du fait de périr, sans transformer l’énoncé en constat purement passé.
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative « Comme… vous… aussi » conserve le parallélisme hébreu, tandis que « écouter la voix » maintient la texture de l’expression d’alliance.
