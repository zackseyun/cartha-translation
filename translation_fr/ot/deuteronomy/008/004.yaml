  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: fr
  text: Ton vêtement ne s’est pas usé alors que tu le portais[a], et ton pied n’a pas enflé[b] pendant ces quarante années.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes vêtements ne se sont pas usés sur toi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ton pied n’est pas devenu enflé » ; certains comprennent le verbe plus précisément comme signifiant qu’il n’a pas eu d’ampoules.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: ton vêtement
  rationale: Le nom שִׂמְלָה désigne un vêtement, souvent un vêtement extérieur. Le singulier « ton vêtement » respecte la forme hébraïque et reste clair en français.
- source_word: בָלְתָה
  choice: ne s’est pas usé
  rationale: Le verbe בלה exprime l’idée de s’user ou de devenir vétuste. « Ne s’est pas usé » est naturel et précis dans ce contexte.
- source_word: מֵעָלֶיךָ
  choice: sur toi
  rationale: L’expression signifie littéralement « de dessus toi ». Avec un vêtement, « sur toi » rend de façon concise l’idée qu’il ne s’est pas usé tandis qu’il était porté.
- source_word: וְרַגְלְךָ
  choice: et ton pied
  rationale: Le texte hébreu emploie le singulier. Le français peut le conserver naturellement dans cette formulation.
- source_word: בָצֵקָה
  choice: n’a pas enflé
  rationale: Le verbe est traditionnellement compris comme désignant le fait d’enfler. Cette traduction préserve le sens principal sans adopter l’interprétation plus précise, mais moins certaine, de la formation d’ampoules.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: pendant ces quarante années
  rationale: La formulation hébraïque associe le démonstratif à une durée. « Pendant ces quarante années » est idiomatique en français tout en conservant l’accent porté sur la période entière.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier reflète l’adresse à Israël comme entité collective. Le singulier hébreu « vêtement » et « pied » est conservé dans le texte principal, tandis que la lecture collective de « vêtement » est signalée en note.
