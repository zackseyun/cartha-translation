  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: fr
  text: ton gros bétail[a] et ton petit bétail se multiplient, ton argent et ton or augmentent, et tout ce qui t’appartient[b] se multiplie —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes troupeaux de bovins ». Le terme hébreu désigne collectivement le gros bétail.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tout ce que tu possèdes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: ton gros bétail
  rationale: בקר désigne collectivement les bovins. « Gros bétail » est une expression française précise qui maintient le contraste avec le petit bétail.
- source_word: וְצֹאנְךָ
  choice: et ton petit bétail
  rationale: צאן désigne collectivement les ovins et les caprins. « Petit bétail » restitue ce sens sans limiter le terme aux seuls moutons.
- source_word: יִרְבְּיוּן
  choice: se multiplient
  rationale: Le verbe רבה exprime ici l’accroissement numérique du bétail; le pluriel français correspond aux deux sujets coordonnés.
- source_word: וְכֶסֶף וְזָהָב
  choice: l’argent et l’or
  rationale: L’hébreu nomme directement ces deux formes de richesse sans possessif explicite; leur rapport au destinataire est exprimé par לָךְ.
- source_word: יִרְבֶּה לָךְ
  choice: se multiplient pour toi
  rationale: Cette formulation conserve la valeur de רבה ainsi que le datif לָךְ, malgré l’accord au pluriel exigé par le français avec « l’argent et l’or ».
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: et tout ce qui t’appartient
  rationale: La formulation rend clairement et naturellement la construction possessive hébraïque sans en restreindre la portée.
- source_word: יִרְבֶּה
  choice: se multiplie
  rationale: La répétition de « se multiplier » reflète la triple occurrence de רבה et souligne l’accumulation qui structure le verset.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le singulier collectif « gros bétail » / « petit bétail » est idiomatique; le verbe au pluriel suit les deux groupes coordonnés. La répétition de « se multiplier » conserve l’effet rhétorique de l’hébreu.
