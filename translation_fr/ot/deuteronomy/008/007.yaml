  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: fr
  text: Car Yahvé, ton Dieu, te fait entrer dans un bon pays, un pays de cours d’eau[a], de sources et d’eaux profondes[b] qui jaillissent dans la vallée et dans la région montagneuse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de torrents » ou « d’oueds »; le terme hébreu peut désigner différents cours d’eau, permanents ou saisonniers.
    reason: lexical_alternative
  - marker: b
    text: Ou « de profondeurs »; l’hébreu peut évoquer les eaux souterraines ou les eaux des profondeurs.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans la plaine et dans les montagnes »; les termes topographiques hébreux peuvent avoir ici une valeur collective.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui motive l’exhortation précédente et conserve naturellement le lien logique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement l’expression d’alliance avec le suffixe masculin singulier de deuxième personne.
- source_word: מְבִיאֲךָ
  choice: te fait entrer
  rationale: Le participe présente l’action comme en cours ou imminente; cette tournure française exprime aussi le mouvement vers l’intérieur du pays.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: dans un bon pays
  rationale: Rend simplement la qualité du pays et s’accorde idiomatiquement avec « te fait entrer ».
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: un pays de cours d’eau
  rationale: נַחֲלֵי peut désigner des ruisseaux, des torrents ou des oueds; « cours d’eau » reste clair et suffisamment large sans imposer un régime hydrologique précis.
- source_word: עֲיָנֹת
  choice: sources
  rationale: Désigne des points naturels où l’eau jaillit; « sources » est le terme français courant.
- source_word: וּתְהֹמֹת
  choice: et d’eaux profondes
  rationale: Préserve l’image des eaux des profondeurs tout en évitant le peu naturel « abîmes » dans cette description géographique.
- source_word: יֹצְאִים
  choice: qui jaillissent
  rationale: Décrit naturellement des eaux qui sortent de terre; le pluriel peut se rapporter aux sources et aux eaux profondes.
- source_word: בַּבִּקְעָה וּבָהָר
  choice: dans la vallée et dans la montagne
  rationale: Conserve les deux singuliers topographiques et leur contraste, tout en laissant ouverte leur possible valeur collective.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le nom divin; « Yahvé » le conserve sous sa forme française usuelle au lieu de le remplacer par un titre.
- issue: Portée de יֹצְאִים
  choice: Le relatif « qui jaillissent » peut se rapporter aux sources et aux eaux profondes.
  alternative: Le rattacher uniquement aux eaux profondes.
  rationale: L’accord pluriel et la coordination hébraïque permettent une portée commune; la formulation française maintient cette relation sans préciser artificiellement l’origine exacte de chaque eau.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme interlocuteur collectif. La répétition de « pays » et la structure accumulative conservent le rythme descriptif du verset.
