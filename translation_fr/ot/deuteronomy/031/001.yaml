  yaml_path: translation/ot/deuteronomy/031/001.yaml
  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: fr
  text: Puis Moïse alla adresser ces paroles à tout Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et Moïse alla adresser ces paroles à tout Israël. » La conjonction initiale peut être rendue plus formellement par « et ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Le verbe הלך signifie normalement « aller » ou « marcher ». Malgré l’absence de destination explicite, « alla » conserve son sens ordinaire sans l’interpréter comme un simple auxiliaire de progression discursive.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: וַיְדַבֵּר
  choice: communiquer
  rationale: Le piel de דבר signifie « parler ». Avec pour objet « ces paroles » et un destinataire introduit par אֶל, « communiquer ces paroles à » produit ici une phrase française naturelle tout en gardant l’idée d’une transmission orale.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Le syntagme désigne littéralement « ces paroles ». Ce choix maintient le lien avec le discours précis qui suit, plutôt que de généraliser en « ces choses » ou « ce message ».
- source_word: אֶל
  choice: à
  rationale: La préposition אֶל marque ici les destinataires auxquels Moïse adresse ses paroles.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette formulation française conserve le caractère collectif et national de l’expression hébraïque.
- source_word: וַ
  choice: Puis
  rationale: Le waw narratif fait avancer le récit. « Puis » en rend naturellement la valeur séquentielle en français moderne; « Et » reste possible comme traduction plus formelle.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le déplacement exprimé par וַיֵּלֶךְ et l’expression collective « tout Israël », tout en évitant la tournure peu naturelle « parla ces paroles ».
