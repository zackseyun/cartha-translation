  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Voici, tu vas bientôt reposer auprès de tes pères. Alors ce peuple se lèvera et se prostituera[a] en suivant les dieux étrangers du pays au milieu duquel il va entrer. Il m’abandonnera et rompra l’alliance que j’ai conclue avec lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression hébraïque évoque le fait de « se prostituer à la suite » d’autres dieux. Elle emploie l’infidélité sexuelle comme image de l’infidélité à l’alliance par l’idolâtrie.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de préserver sa fonction de nom propre dans le texte hébreu.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: Voici, tu vas bientôt reposer auprès de tes pères
  rationale: « Voici » conserve la force solennelle de הִנֵּה et « bientôt » exprime l’imminence. « Reposer auprès de tes pères » garde l’image traditionnelle de la mort tout en évitant, en français actuel, l’éventuelle connotation sexuelle de « coucher avec tes pères ».
- source_word: וְקָם
  choice: Alors ce peuple se lèvera
  rationale: Le futur convient à la prédiction qui suit la mort de Moïse. « Se lèvera » conserve le verbe sans préciser abusivement qu’il s’agit déjà d’une révolte.
- source_word: וְזָנָה
  choice: se prostituera
  rationale: Le choix maintient la métaphore sexuelle forte par laquelle l’hébreu décrit l’infidélité idolâtre du peuple.
- source_word: אַחֲרֵי אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: en suivant les dieux étrangers du pays
  rationale: « En suivant » rend naturellement אַחֲרֵי dans ce contexte d’allégeance cultuelle, tandis que « dieux étrangers du pays » conserve le lien entre ces divinités et le territoire où Israël entre.
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: au milieu duquel il va entrer
  rationale: Le pronom singulier est conservé en français parce que son antécédent collectif, « ce peuple », est lui-même singulier; la formulation maintient l’idée d’entrer au cœur du pays.
- source_word: וַעֲזָבַנִי
  choice: Il m’abandonnera
  rationale: « Abandonner » rend clairement la rupture relationnelle et convient au français international actuel.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: et rompra l’alliance
  rationale: « Rompre l’alliance » est une expression française naturelle qui traduit la violation de l’alliance exprimée par הפר.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: que j’ai conclue avec lui
  rationale: « Conclure une alliance » rend idiomatiquement כרת ברית. Le singulier « lui » conserve le collectif singulier hébreu renvoyant au peuple.
theological_decisions:
- issue: Métaphore sexuelle appliquée à l’idolâtrie
  choice: Conserver « se prostituera »
  alternative: « sera infidèle »
  rationale: L’hébreu emploie délibérément une image choquante d’infidélité sexuelle pour caractériser la violation de l’alliance; l’atténuer ferait perdre une part importante de sa force théologique.
- issue: Singulier collectif désignant Israël
  choice: Conserver les pronoms français au singulier avec « ce peuple »
  alternative: 'Employer le pluriel : « ils entreront… avec eux »'
  rationale: Contrairement à l’anglais, le français peut reprendre naturellement « ce peuple » par « il » et « lui ». Ce choix préserve donc la forme collective du texte hébreu sans nuire à la clarté.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le verset conserve le nom divin « Yahweh », le singulier collectif de « ce peuple » et la métaphore vigoureuse de la prostitution. La tournure « reposer auprès de tes pères » garde l’image funéraire dans une formulation française digne et intelligible.
