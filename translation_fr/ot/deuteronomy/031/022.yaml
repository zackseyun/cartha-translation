  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: fr
  text: Moïse écrivit ce chant ce jour-là et l’enseigna aux fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « aux enfants d’Israël ». L’hébreu dit littéralement « aux fils d’Israël », une désignation collective habituelle du peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: écrivit
  rationale: Le qatal narratif avec waw de כתב exprime l’action successive simple « écrire ». Le passé simple convient au registre narratif biblique, tout en restant clair en français écrit.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ce chant
  rationale: שִׁירָה désigne ici le chant poétique et solennel annoncé dans le contexte. « Chant » en préserve la désignation littéraire.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Cette expression temporelle courante est rendue de façon naturelle et précise, sans renforcer indûment le sens en « ce même jour-là ».
- source_word: וַיְלַמְּדָהּ
  choice: l’enseigna
  rationale: Le piel de למד signifie « enseigner », et le suffixe féminin singulier renvoie explicitement à שִׁירָה, « le chant » en français. Le pronom « l’ » conserve cet objet.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme masculine plurielle de l’expression hébraïque et sa portée collective traditionnelle, tout en signalant en note ses équivalents français possibles.
theological_decisions:
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: L’hébreu emploie littéralement « les fils d’Israël » comme désignation collective du peuple de l’alliance. Le texte principal en conserve la forme, tandis que la note précise sa portée collective sans la neutraliser silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient la narration écrite; « ce chant » et « les fils d’Israël » préservent les formulations saillantes de l’hébreu.
