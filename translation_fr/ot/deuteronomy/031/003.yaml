source:
  edition: WLC
  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: fr
  text: Yahvé, ton Dieu, c’est lui qui va passer devant toi[a]. C’est lui qui détruira ces nations de devant toi, et tu les déposséderas[b]. Josué, c’est lui qui va passer devant toi, comme Yahvé l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « passe devant toi » ou « passera devant toi ». Le participe hébreu peut exprimer une action en cours, imminente ou tenue pour certaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu prendras possession d’elles », c’est-à-dire de leur territoire. Dans ce contexte, le verbe hébreu désigne souvent la prise de possession qui dépossède les occupants précédents.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est conservé comme nom propre plutôt que remplacé par un titre. « Yahvé » est la forme française courante de la translittération du tétragramme.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier est rendu par « ton »; le discours s’adresse à Israël comme à une entité collective singulière.
- source_word: הוּא
  choice: c’est lui qui
  rationale: La tournure disloquée française exprime naturellement l’insistance du pronom indépendant, aussi bien pour Yahvé que pour Josué.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: va passer devant toi
  rationale: Cette formulation rend l’action imminente du participe et garde à la fois l’idée de franchir le Jourdain et celle d’aller en avant d’Israël.
- source_word: יַשְׁמִיד
  choice: détruira
  rationale: Le hiphil de שׁמד exprime la mise à destruction; « détruira » conserve sa force sans préciser davantage l’étendue de cette destruction.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ces nations
  rationale: Dans ce contexte, גּוֹיִם désigne les groupes ethniques et politiques de Canaan; « nations » est précis et naturel.
- source_word: מִלְּפָנֶיךָ
  choice: devant toi
  rationale: La formulation française préserve la dimension spatiale de l’élimination des nations sur le chemin d’Israël, sans le calque peu naturel « de devant toi ».
- source_word: וִירִשְׁתָּם
  choice: tu les déposséderas
  rationale: Dans le contexte de la conquête, ירשׁ signifie prendre possession en chassant les occupants; le pronom « les » respecte l’objet masculin pluriel, les nations.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahvé l’a dit
  rationale: Cette tournure rend simplement l’acte de parole accompli; « promis » ajouterait une interprétation absente du verbe.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. Le conserver évite de lui substituer un titre; la forme « Yahvé » suit l’usage français.
- issue: Insistance sur l’action de Yahvé et celle de Josué
  choice: Répéter « c’est lui qui » pour les deux sujets
  alternative: Employer simplement « il »
  rationale: La répétition préserve l’insistance rhétorique de הוּא et maintient côte à côte l’action divine et l’action humaine mandatée, sans les opposer ni les confondre.
- issue: Adresse collective au singulier
  choice: Employer « tu »
  alternative: Employer « vous »
  rationale: Les formes hébraïques sont au masculin singulier et s’adressent collectivement à Israël; le singulier français conserve ce trait du discours.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition « c’est lui qui » est volontaire afin de restituer l’emphase hébraïque. Le tutoiement singulier conserve l’adresse collective à Israël.
