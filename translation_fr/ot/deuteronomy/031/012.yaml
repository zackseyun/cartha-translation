  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: fr
  text: Rassemble le peuple — les hommes, les femmes, les petits enfants et l’étranger[a] qui réside dans tes villes[b] — afin qu’ils écoutent, qu’ils apprennent et qu’ils craignent Yahweh votre Dieu[c], et qu’ils veillent à mettre en pratique toutes les paroles de cette loi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le résident étranger ». Le terme hébreu désigne une personne non autochtone établie au sein de la communauté.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans tes portes », expression qui désigne ici les villes ou les localités du pays.
    reason: cultural_note
  - marker: c
    text: Ou « révèrent Yahweh votre Dieu ». Le verbe hébreu associe la crainte, le profond respect et l’obéissance.
    reason: lexical_alternative
  - marker: d
    text: Ou « de cette instruction ». Le mot hébreu torah peut désigner une instruction aussi bien qu’une loi ; ici, le cadre de l’alliance favorise « loi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: Rassemble
  rationale: L’impératif hiphil de קהל demande de faire venir le peuple en assemblée. « Rassemble » est direct, naturel et conserve la force de la convocation.
- source_word: הָעָם
  choice: le peuple
  rationale: עָם désigne ici l’ensemble de la communauté d’Israël; « le peuple » en est le rendu courant et précis.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: les hommes, les femmes, les petits enfants
  rationale: Le texte énumère explicitement les groupes. טַף vise particulièrement les jeunes enfants ou les petits dépendants; « petits enfants » conserve cette nuance.
- source_word: וְגֵרְךָ
  choice: l’étranger qui réside chez toi
  rationale: גֵר désigne un non-Israélite établi durablement au sein de la communauté, et non un simple voyageur. Cette formulation est plus claire en français moderne que « l’immigré » ou « l’étranger de passage ».
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Dans le Deutéronome, « dans tes portes » est une métonymie courante pour les villes ou les localités. Le sens de l’expression est rendu directement, avec l’image littérale signalée en note.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: afin qu’ils écoutent, qu’ils apprennent
  rationale: שׁמע signifie ici écouter la lecture proclamée, tandis que למד exprime l’apprentissage qui en découle. Les deux verbes demeurent distincts.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: et qu’ils craignent Yahweh votre Dieu
  rationale: ירא exprime une crainte révérencielle qui engage à l’obéissance. « Craindre » conserve la force et l’étendue du terme hébreu; le nom divin יהוה est translittéré « Yahweh ».
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: et qu’ils veillent à mettre en pratique
  rationale: La construction שמר suivie de l’infinitif indique une observance attentive conduisant à l’action. « Veiller à mettre en pratique » est naturel et garde ces deux dimensions.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: toutes les paroles de cette loi
  rationale: דִּבְרֵי signifie précisément « paroles », et תּוֹרָה, bien qu’il puisse signifier « instruction », désigne ici la loi proclamée dans le cadre de l’alliance.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel יהוה. La translittération « Yahweh » le distingue d’un simple titre et préserve sa fonction de nom d’alliance.
- issue: Sens de ירא envers Dieu
  choice: craignent Yahweh
  alternative: révèrent Yahweh
  rationale: « Craindre » conserve la tension biblique entre crainte, respect profond et obéissance, tandis que « révérer » pourrait en atténuer la force.
- issue: Rapport entre apprendre et craindre
  choice: qu’ils apprennent et qu’ils craignent
  alternative: qu’ils apprennent à craindre
  rationale: La syntaxe hébraïque coordonne les verbes « apprendre » et « craindre » sans faire explicitement de la crainte le seul objet de l’apprentissage. Le rendu retenu préserve cette ouverture.
- issue: Énumération des membres de l’assemblée
  choice: les hommes, les femmes, les petits enfants
  alternative: tout le monde, y compris les adultes et les enfants
  rationale: L’hébreu nomme séparément ces groupes; la traduction maintient cette énumération au lieu de la fondre dans une formulation générale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’énumération solennelle et les verbes distincts du texte hébreu. L’alternance entre « tes villes » et « votre Dieu » reflète le passage réel du singulier au pluriel dans l’hébreu, sans l’uniformiser silencieusement.
