source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Voici, le moment de ta mort approche. Appelle Josué et présentez-vous dans la tente de la rencontre, afin que je lui donne mes ordres[a]. » Moïse et Josué allèrent donc se présenter dans la tente de la rencontre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et je lui donnerai mes ordres » ou « afin que je lui confie sa mission ». Le verbe hébreu peut désigner le fait d’ordonner, de donner une charge ou de confier officiellement une mission; ici, il concerne l’établissement de Josué dans sa fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הֵן
  choice: Voici
  rationale: Particule destinée à attirer l’attention, rendue dans un registre digne et courant.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: le moment de ta mort approche
  rationale: Restitue naturellement en français l’idiome hébreu selon lequel les jours de Moïse se sont approchés en vue de sa mort.
- source_word: קְרָא אֶת־יְהוֹשֻׁעַ
  choice: Appelle Josué
  rationale: Conserve la simplicité et la force directe de l’impératif.
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  choice: présentez-vous / se présenter
  rationale: Le hitpael exprime ici le fait de prendre officiellement place ou de comparaître; la même formulation est maintenue dans l’ordre et son exécution.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Rend le terme cultuel et la préposition בְּ de manière intelligible et cohérente.
- source_word: וַאֲצַוֶּנּוּ
  choice: afin que je lui donne mes ordres
  rationale: Reflète directement le sens de צוה tout en laissant la note signaler la nuance possible de charge ou de mandat officiel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme; sa transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de צוה à propos de Josué
  choice: afin que je lui donne mes ordres
  alternative: et je lui donnerai mes ordres / afin que je lui confie sa mission
  rationale: Le rendu conserve le sens lexical principal de commandement sans effacer le contexte de la désignation officielle de Josué; l’ambiguïté est explicitée en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’idiome relatif aux « jours » est rendu par « le moment » pour éviter une tournure artificielle, tandis que « Voici » conserve la solennité de la parole divine. Le terme « tente de la rencontre » reste transparent tout en gardant sa valeur cultuelle.
