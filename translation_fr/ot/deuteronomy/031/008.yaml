  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: fr
  text: Yahweh lui-même marche devant toi[a]. Il sera lui-même avec toi ; il ne te laissera pas tomber et ne t’abandonnera pas. N’aie pas peur et ne te décourage pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « va devant toi ».'
    reason: Le participe hébreu peut être rendu comme une action actuelle ou caractéristique ; « marche devant toi » en conserve l’aspect imagé.
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription usuelle « Yahweh », qui conserve le nom divin présent dans l’hébreu.
- source_word: הוּא הַהֹלֵךְ לְפָנֶיךָ
  choice: lui-même marche devant toi
  rationale: Le pronom indépendant marque l’insistance ; le participe décrit l’action en cours ou caractéristique de Yahweh qui précède Josué.
- source_word: יִהְיֶה עִמָּךְ
  choice: Il sera lui-même avec toi
  rationale: La formulation conserve la promesse directe de présence et l’emphase renouvelée du pronom הוּא.
- source_word: לֹא יַרְפְּךָ
  choice: il ne te laissera pas tomber
  rationale: רפה au hiphil peut évoquer le fait de lâcher ou de laisser défaillir quelqu’un ; cette expression française garde cette image et distingue le verbe du suivant.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: et ne t’abandonnera pas
  rationale: עזב signifie quitter ou abandonner ; « abandonner » convient au registre solennel tout en restant courant.
- source_word: לֹא תִירָא
  choice: N’aie pas peur
  rationale: Dans ce contexte, l’imparfait négatif a une valeur d’exhortation ; cette tournure est directe et naturelle en français moderne.
- source_word: וְלֹא תֵחָת
  choice: et ne sois pas terrifié
  rationale: Le niphal de חתת peut exprimer l’effondrement sous l’intimidation ou la terreur ; « terrifié » reste distinct de la peur ordinaire du membre précédent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme ; « Yahweh » préserve ici le nom propre sans le remplacer par un titre.
- issue: Nature de la promesse exprimée par רפה et עזב
  choice: 'deux assurances distinctes : ne pas laisser tomber et ne pas abandonner'
  alternative: ne pas délaisser ni abandonner
  rationale: Le maintien de deux formulations distinctes préserve la tension lexicale entre le fait de lâcher ou de laisser défaillir et celui de quitter.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse à Josué. La répétition emphatique de הוּא est conservée par « lui-même », et les deux verbes de la promesse restent différenciés.
