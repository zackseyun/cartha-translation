  to: Yahweh lui-même marche devant toi[a]. Il sera lui-même avec toi ; il ne te laissera pas tomber et ne t’abandonnera pas. N’aie pas peur et ne te décourage pas.
  rationale: 'Révision limitée au dernier verbe d’exhortation : « ne te décourage pas » rend de façon plus juste et plus naturelle la nuance de חתת dans ce contexte, tout en conservant la distinction avec l’injonction précédente à ne pas avoir peur. Le reste du texte est maintenu.'
