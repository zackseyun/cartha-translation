    text: 'Ou : « va devant toi ».'
    reason: Le participe hébreu peut être rendu comme une action actuelle ou caractéristique ; « marche devant toi » en conserve l’aspect imagé.
  revision_rationale: 'Révision limitée au dernier verbe d’exhortation : « ne te décourage pas » rend de façon plus juste et plus naturelle la nuance de חתת dans ce contexte, tout en conservant la distinction avec l’injonction précédente à ne pas avoir peur. Le reste du texte est maintenu.'
