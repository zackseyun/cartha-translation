  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת מֹשֶׁ֗ה לִ/כְתֹּ֛ב אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את עַל סֵ֑פֶר עַ֖ד תֻּמָּֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: fr
  text: Quand Moïse eut achevé d’écrire dans un livre[a] les paroles de cette loi, jusqu’à leur terme,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sur un rouleau » : le mot hébreu peut désigner un document écrit ou un rouleau, et pas nécessairement un livre relié au sens moderne.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Quand … eut achevé
  rationale: La construction narrative introduit une proposition temporelle. Le passé antérieur exprime naturellement en français écrit l’achèvement préalable de l’action sans alourdir par « il arriva que ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: לִכְתֹּב
  choice: d’écrire
  rationale: Après « achever », l’infinitif précédé de « de » est la construction française naturelle.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Dans ce contexte de texte consigné par écrit, « paroles » conserve la valeur verbale et littéraire de דְּבָרִים sans la réduire à de simples sujets ou affaires.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: cette loi
  rationale: Dans le cadre juridique et alliance de Deutéronome, « loi » est clair et naturel, tout en conservant le démonstratif.
- source_word: עַל סֵפֶר
  choice: dans un livre
  rationale: « Dans un livre » est idiomatique en français pour un texte consigné dans un document; une note précise que סֵפֶר peut désigner un rouleau plutôt qu’un livre relié moderne.
- source_word: עַד תֻּמָּם
  choice: jusqu’à leur terme
  rationale: Cette formulation conserve l’idée d’extension jusqu’à l’achèvement ainsi que le suffixe pluriel renvoyant aux paroles, sans produire la tournure maladroite « jusqu’à ce qu’elles soient complètes ».
