translation_notes:
  register: Français moderne, digne et lisible. La syntaxe demeure suspendue par la virgule finale, conformément au fait que le verset forme la proposition temporelle poursuivie au verset suivant. Le passé antérieur convient au registre narratif biblique sans être archaïque.
