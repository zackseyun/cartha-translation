source:
  edition: WLC
  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: fr
  text: « Prenez ce livre de la Loi[a] et placez-le à côté de l’arche de l’alliance de Yahweh, votre Dieu. Il restera là comme témoin contre vous[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce rouleau de la Loi ». Le mot hébreu peut désigner un rouleau ou, plus généralement, un document écrit.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’il témoignera contre le peuple s’il rompt l’alliance.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: Prenez
  rationale: L’infinitif qal est employé avec une valeur impérative. Le pluriel correspond à la suite וְשַׂמְתֶּם et s’adresse aux lévites mentionnés au verset précédent.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ce livre de la Loi
  rationale: סֵפֶר désigne ici un document écrit, matériellement sans doute un rouleau; « livre » reste naturel et permet de conserver l’expression reconnue « livre de la Loi ». תּוֹרָה désigne dans ce contexte l’instruction normative de l’alliance.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: et placez-le
  rationale: שׂים exprime l’action concrète de mettre ou placer; « placez-le » est précis et idiomatique.
- source_word: מִצַּד
  choice: à côté de
  rationale: La locution situe le livre sur le côté de l’arche, sans suggérer qu’il se trouve à l’intérieur.
- source_word: אֲרוֹן בְּרִית
  choice: l’arche de l’alliance
  rationale: Cette formulation française établie rend naturellement la chaîne construite hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Traduction directe de la forme avec suffixe de deuxième personne du pluriel.
- source_word: וְהָיָה שָׁם
  choice: Il restera là
  rationale: Littéralement, « il sera là ». Dans la suite de l’ordre de placement, « restera » exprime naturellement l’état durable visé sans en modifier le sens.
- source_word: בְּךָ לְעֵד
  choice: comme témoin contre vous
  rationale: 'עֵד désigne un témoin et, dans ce contexte d’alliance, בְּךָ a une portée adversative: le document pourra témoigner contre Israël. Le singulier hébreu envisage Israël collectivement; le français « vous » conserve l’adresse directe et correspond aussi aux destinataires pluriels de l’ordre.'
theological_decisions:
- issue: Fonction testimoniale du livre
  choice: Le livre sert de témoin contre Israël dans le cadre de l’alliance.
  alternative: Le livre serait seulement un mémorial, ou son témoignage serait neutre.
  rationale: La construction לְעֵד בְּךָ et le contexte immédiat de la désobéissance annoncée donnent au témoignage une portée judiciaire et accusatrice, sans ajouter de développement doctrinal étranger au verset.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel reflète les destinataires du verset 25. La ponctuation sépare l’ordre de placement de la fonction durable du document. Les marqueurs de notes suivent immédiatement les expressions qu’ils expliquent.
