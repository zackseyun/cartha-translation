  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: fr
  text: 'Il leur dit : « J’ai aujourd’hui cent vingt ans. Je ne peux plus sortir et entrer[a], et Yahweh m’a dit : “Tu ne traverseras pas ce Jourdain.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « sortir et entrer » : cette expression peut désigner aussi bien les activités ordinaires que la conduite du peuple, notamment dans un cadre public ou militaire.'
    reason: Préserver l’ambiguïté lexicale et contextuelle de l’idiome hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Il leur dit
  rationale: Le wayyiqtol narratif est rendu simplement et naturellement; le pronom renvoie à Moïse dans le contexte immédiat.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: J’ai aujourd’hui cent vingt ans
  rationale: L’idiome hébreu de l’âge, littéralement « je suis fils de cent vingt ans », appelle en français la tournure naturelle avec « avoir ». « Aujourd’hui » conserve la précision temporelle et l’insistance de אָנֹכִי.
- source_word: לֹא אוּכַל עוֹד
  choice: Je ne peux plus
  rationale: יכל exprime la capacité et עוֹד, sous la négation, signifie « ne… plus ». Cette formulation est concise et courante.
- source_word: לָצֵאת וְלָבוֹא
  choice: sortir et entrer
  rationale: La traduction garde les deux verbes et leur ordre, sans réduire l’expression soit aux déplacements ordinaires, soit à l’exercice de la direction du peuple.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le nom divin יהוה; sa translittération permet de le distinguer du titre « Seigneur ».
- source_word: אָמַר אֵלַי
  choice: m’a dit
  rationale: Le passé composé exprime naturellement en français une parole divine antérieure qui demeure déterminante dans la situation présente.
- source_word: לֹא תַעֲבֹר
  choice: Tu ne traverseras pas
  rationale: Le futur français préserve ici la force d’une déclaration divine contraignante, sans trancher artificiellement entre interdiction et annonce certaine.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ce Jourdain
  rationale: Le démonstratif « ce » rend הַזֶּה, tandis que « Jourdain » suffit en français sans ajouter « fleuve », absent du texte.
theological_decisions:
- issue: Sens de l’incapacité de Moïse à « sortir et entrer »
  choice: Maintenir l’expression concrète « sortir et entrer » et en signaler l’ambiguïté en note
  alternative: Expliciter « aller et venir » ou « conduire le peuple dans ses campagnes »
  rationale: L’expression peut concerner l’activité ordinaire ou la capacité d’exercer une direction publique ou militaire. Le verset associe l’âge de Moïse à la parole de Yahweh; la traduction ne doit pas imposer une seule explication.
- issue: Valeur de לֹא תַעֲבֹר dans la parole divine
  choice: Tu ne traverseras pas
  alternative: Tu ne dois pas traverser / Tu ne pourras pas traverser
  rationale: La formulation retenue conserve la tension entre déclaration certaine et défense divine, au lieu de ramener la phrase à une simple prédiction ou à une permission refusée.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie le nom propre divin; « Yahweh » le représente directement et évite de le confondre avec le titre אֲדֹנָי.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe directe convient à un discours solennel sans archaïsme. Les guillemets français encadrent la parole de Moïse, et les guillemets doubles marquent la parole citée de Yahweh.
