  to: Et maintenant, écrivez pour vous ce chant ; enseignez-le aux fils d’Israël et mettez-le dans leur bouche, afin que ce chant me serve de témoin contre les fils d’Israël[a].
  rationale: La révision corrige l’erreur structurelle de nombre en rétablissant les deux impératifs pluriels. La note erronée sur un prétendu passage au singulier est supprimée. La note lexicale concernant « les Israélites » est conservée comme information utile, mais son ancre doit être placée après la première occurrence de « fils d’Israël » plutôt qu’après la dernière ; afin d’éviter une ambiguïté d’ancrage dans le texte fourni, le jeu de notes complet ci-dessus est à appliquer avec l’ancre b sur « fils d’Israël » dans « aux fils d’Israël » et l’ancre a après la dernière occurrence.
