  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: fr
  text: Et maintenant, écrivez pour vous ce chant ; enseignez-le aux fils d’Israël et mettez-le dans leur bouche, afin que ce chant me serve de témoin contre les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les fils d’Israël ». Dans ce contexte, la préposition hébraïque peut avoir le sens de « contre », mais sa valeur plus littérale est « dans/parmi ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction de liaison וְ et l’adverbe temporel עַתָּה, qui marquent une transition immédiate.
- source_word: כִּתְבוּ לָכֶם
  choice: écrivez pour vous
  rationale: Le pluriel de l’impératif et la nuance bénéficiaire ou réflexive de לָכֶם sont maintenus sans ajouter « par écrit », déjà impliqué par le verbe.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ce chant
  rationale: « Chant » rend directement שִׁירָה et convient à la composition poétique qui suit.
- source_word: וְלַמְּדָהּ
  choice: enseigne-le
  rationale: L’impératif hébreu est au singulier, contrairement à כִּתְבוּ, qui est au pluriel. Le pronom féminin hébreu renvoie à שִׁירָה ; le français emploie naturellement le masculin « le » avec « chant ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque concrète et son langage d’identité collective ; l’équivalent idiomatique « les Israélites » est signalé en note.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: mets-le dans leur bouche
  rationale: Préserve l’image hébraïque de la transmission orale, de la mémorisation et de la récitation sans la réduire à une seule explication.
- source_word: לְמַעַן
  choice: afin que
  rationale: Exprime clairement le but dans un registre français courant et digne.
- source_word: תִּהְיֶה לִּי לְעֵד
  choice: me serve de témoin
  rationale: Formulation française naturelle qui conserve la fonction du chant comme témoin au service de Dieu.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: contre les fils d’Israël
  rationale: Dans ce contexte d’alliance et d’accusation, בְּ avec עֵד peut prendre une valeur adversative ; la lecture plus littérale et spatiale est conservée en note.
theological_decisions:
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël / le peuple d’Israël
  rationale: Le texte hébreu dit littéralement « fils d’Israël » comme désignation collective du peuple. La note évite que le lecteur moderne comprenne à tort que seules les personnes de sexe masculin sont visées.
- issue: Valeur de בִּבְנֵי יִשְׂרָאֵל dans la proposition relative au témoin
  choice: contre les fils d’Israël
  alternative: parmi les fils d’Israël
  rationale: 'Le contexte judiciaire de l’alliance favorise la valeur adversative : le chant témoignera contre Israël. Comme la préposition peut aussi être comprise spatialement, cette possibilité est explicitement maintenue en note.'
- issue: Alternance entre destinataires pluriel et singulier
  choice: écrivez… enseigne… mets
  alternative: écrivez… enseignez… mettez
  rationale: L’hébreu passe réellement du pluriel כִּתְבוּ au singulier לַמְּדָהּ et שִׂימָהּ. La traduction conserve cette variation au lieu de l’harmoniser silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. L’image concrète « dans leur bouche » est conservée. La ponctuation met en évidence le changement de nombre grammatical sans tenter de le corriger.
