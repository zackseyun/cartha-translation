    text: Ou « parmi les fils d’Israël ». Dans ce contexte, la préposition hébraïque peut avoir le sens de « contre », mais sa valeur plus littérale est « dans/parmi ».
    reason: alternative_reading
  - marker: b
    text: Ou « aux Israélites » (également les deux autres occurrences dans ce verset). L’hébreu dit littéralement « les fils d’Israël », expression qui désigne collectivement le peuple.
    reason: lexical_alternative
