  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֗ה בְּ/אָזְנֵי֙ כָּל קְהַ֣ל יִשְׂרָאֵ֔ל אֶת דִּבְרֵ֥י הַ/שִּׁירָ֖ה הַ/זֹּ֑את עַ֖ד תֻּמָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: fr
  text: Alors Moïse prononça aux oreilles de toute l’assemblée d’Israël les paroles de ce chant, jusqu’à ce qu’elles soient achevées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce qu’il ait fini de les prononcer », c’est-à-dire jusqu’à ce que Moïse ait achevé de prononcer les paroles du chant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors Moïse prononça
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la succession, tandis que « prononça » convient à la récitation solennelle des paroles du chant.
- source_word: בְּאָזְנֵי
  choice: devant
  rationale: Littéralement « aux oreilles de », l’expression signifie que Moïse parle de manière à être entendu par l’assemblée. « Devant » rend naturellement cette situation publique en français.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: קהל désigne la communauté réunie. « Assemblée » conserve ce sens collectif sans coloration confessionnelle particulière, et « toute » rend כָּל.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: les paroles de ce chant
  rationale: La formulation conserve explicitement דִּבְרֵי, « les paroles », plutôt que de réduire l’expression à « ce chant ».
- source_word: עַד תֻּמָּם
  choice: jusqu’à ce qu’elles soient achevées
  rationale: Le suffixe masculin pluriel renvoie le plus naturellement aux « paroles ». La tournure passive respecte la forme hébraïque tout en restant intelligible en français; l’autre compréhension possible est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le caractère solennel d’une récitation publique. Le marqueur de note [a] figure dans le texte principal.
