  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: fr
  text: 'Il donna cet ordre à Josué, fils de Noun : « Sois fort et courageux, car c’est toi qui feras entrer les fils d’Israël[a] dans le pays que je leur ai promis par serment, et moi, je serai avec toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « le peuple d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: Alternative lexicale et conservation dans le texte principal de l’expression familiale hébraïque.
lexical_decisions:
- source_word: וַיְצַו
  choice: Il donna cet ordre
  rationale: Le piel de צוה signifie « ordonner, donner une mission ». Cette formulation est naturelle en français et convient au contexte solennel de la mission confiée à Josué.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Forme française traditionnelle des noms bibliques, avec le patronyme rendu de manière naturelle.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sois fort et courageux
  rationale: Cette paire d’exhortations exprime à la fois la force intérieure, la fermeté et le courage; la formulation est claire, digne et familière en français biblique moderne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’exhortation et « car » en conserve succinctement la valeur causale.
- source_word: תָּבִיא
  choice: c’est toi qui feras entrer
  rationale: Le hiphil de בוא est causatif, « faire entrer ». La tournure emphatique rend également le pronom sujet explicite אַתָּה, sans réduire le verbe au seul sens interprétatif de « conduire ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le calque intelligible préserve l’expression familiale et l’imagerie collective de l’hébreu; une formulation collective plus courante est donnée en note.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶל הָאָרֶץ désigne le territoire promis. « Le pays » est idiomatique en français et conserve cette portée territoriale et covenantale.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: que je leur ai promis par serment
  rationale: L’hébreu dit littéralement « que j’ai juré à eux ». La formulation française explicite naturellement la valeur promissoire du serment sans ajouter l’objet non exprimé « de leur donner ».
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: et moi, je serai avec toi
  rationale: Le pronom indépendant אָנֹכִי est emphatique; « moi, je » en garde l’insistance tout en préservant la formule de présence divine.
theological_decisions:
- issue: Sujet implicite de וַיְצַו et וַיֹּאמֶר
  choice: Il donna cet ordre à Josué…
  alternative: Le SEIGNEUR donna cet ordre à Josué…
  rationale: Le texte du verset porte un sujet masculin singulier implicite, identifié par le contexte comme Dieu. La traduction ne substitue pas au pronom un nom divin absent de ce verset.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: La formulation principale conserve la métaphore généalogique et collective de l’hébreu sans décider qu’elle vise uniquement des hommes; la note donne les équivalents collectifs naturels.
- issue: Force de תָּבִיא
  choice: c’est toi qui feras entrer
  alternative: tu conduiras
  rationale: La traduction garde la forme causative du verbe et l’emphase portée par אַתָּה. Elle ne développe pas davantage la nature exacte du rôle de Josué.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est intégré après deux verbes hébreux coordonnés (« il donna cet ordre… et dit ») au moyen des deux-points, ce qui évite une répétition peu naturelle sans en perdre le sens. L’emphase des pronoms hébreux est conservée par « c’est toi qui » et « moi, je ».
