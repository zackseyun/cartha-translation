base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: fr
  text: 'Alors, ce jour-là, ma colère s’enflammera contre eux. Je les abandonnerai et je leur cacherai mon visage. Ils deviendront une proie[a], et de nombreux malheurs et de nombreuses détresses les atteindront. Ce jour-là, Israël dira[b] : « N’est-ce pas parce que mon Dieu n’est pas au milieu de moi que ces malheurs m’ont atteint ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il sera pour être mangé » ou « il sera à dévorer ». L’expression hébraïque condensée présente Israël comme exposé à la destruction.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici le singulier : Israël est personnifié comme un seul locuteur, qui dit ensuite « mon Dieu » et « moi ».'
    reason: collective_singular
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: ma colère s’enflammera
  rationale: Cette formulation française naturelle conserve l’image hébraïque d’une colère qui brûle sans reproduire littéralement l’idiome du « nez ».
- source_word: בּוֹ
  choice: contre eux
  rationale: Le suffixe est grammaticalement singulier, mais il désigne collectivement Israël; le pluriel s’accorde naturellement avec les propositions suivantes, qui emploient des suffixes pluriels.
- source_word: וַעֲזַבְתִּים
  choice: je les abandonnerai
  rationale: « Abandonner » exprime avec gravité le retrait annoncé, tout en restant plus courant en français moderne que « délaisser ».
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: je leur cacherai mon visage
  rationale: La traduction conserve l’image hébraïque importante du visage caché et évite de réduire l’expression à une simple absence ou à un détournement du regard.
- source_word: וְהָיָה לֶאֱכֹל
  choice: ils seront livrés en pâture
  rationale: L’hébreu condensé signifie littéralement qu’Israël sera « destiné à être mangé ». Cette tournure française exprime clairement sa vulnérabilité à la destruction sans préciser un agent absent du texte.
- source_word: וּמְצָאֻהוּ
  choice: les atteindront
  rationale: Le verbe signifie littéralement « trouver », mais, avec des malheurs pour sujet, « atteindre » est idiomatique en français et conserve l’idée que ceux-ci arrivent jusqu’au peuple.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: beaucoup de malheurs et de détresses
  rationale: Dans ce contexte, רָעוֹת désigne des malheurs ou calamités, tandis que צָרוֹת évoque des détresses. La traduction maintient cette nuance sans suggérer principalement des fautes morales.
- source_word: וְאָמַר
  choice: Israël dira
  rationale: Le verbe hébreu est au singulier et personnifie Israël. Nommer explicitement Israël rend cette personnification intelligible en français tout en préparant les pronoms singuliers de la citation.
- source_word: הֲלֹא עַל כִּי
  choice: N’est-ce pas parce que
  rationale: Cette tournure française naturelle préserve la forme et la force causale de la question rhétorique.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: mon Dieu n’est pas au milieu de moi
  rationale: La formulation garde la première personne du singulier et l’image spatiale du texte, malgré leur caractère inhabituel, afin de préserver la personnification collective d’Israël.
- source_word: מְצָאוּנִי
  choice: m’ont atteint
  rationale: Le passé composé rend l’accompli hébreu avec son résultat présent et reprend le même choix verbal que dans la proposition narrative.
theological_decisions:
- issue: Singulier collectif et pluriel pour Israël
  choice: Employer le pluriel dans les actions dirigées contre le peuple, puis nommer Israël et conserver le singulier dans sa parole personnifiée.
  alternative: Employer soit le singulier, soit le pluriel partout.
  rationale: L’hébreu alterne lui-même entre suffixes singuliers et pluriels. Cette solution produit un français compréhensible sans effacer la personnification particulièrement marquée dans la confession finale.
- issue: Sens du visage divin caché
  choice: Conserver l’expression « cacher mon visage ».
  alternative: Traduire par « me détourner d’eux » ou « retirer ma présence ».
  rationale: L’image exprime le jugement et le retrait relationnel de Dieu sans définir complètement leur nature; la conserver maintient la tension théologique du texte.
- issue: Portée de « mon Dieu n’est pas au milieu de moi »
  choice: Préserver la déclaration telle qu’Israël la formule, sans préciser si elle décrit une absence réelle ou l’expérience du jugement.
  alternative: Paraphraser par « Dieu nous a abandonnés » ou « Dieu ne nous protège plus ».
  rationale: La paraphrase trancherait une ambiguïté que le texte laisse ouverte et affaiblirait le lien avec le motif du visage caché.
translation_notes:
  register: Français international moderne, naturel et digne. Les phrases ont été légèrement segmentées pour la lisibilité. Le vocabulaire concret du texte (« colère s’enflammera », « cacherai mon visage ») est conservé, tandis que les alternances de nombre sont rendues intelligibles sans être nivelées.
