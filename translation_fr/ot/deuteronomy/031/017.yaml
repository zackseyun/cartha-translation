  to: 'Alors, ce jour-là, ma colère s’enflammera contre eux. Je les abandonnerai et je leur cacherai mon visage. Ils deviendront une proie[a], et de nombreux malheurs et de nombreuses détresses les atteindront. Ce jour-là, Israël dira[b] : « N’est-ce pas parce que mon Dieu n’est pas au milieu de moi que ces malheurs m’ont atteint ? »'
