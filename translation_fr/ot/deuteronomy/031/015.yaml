reference: Deuteronomy 31:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: fr
  text: Yahweh apparut dans la tente, dans une colonne de nuée, et la colonne de nuée se tint à l’entrée de la tente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה exprime ici une manifestation visible. « Apparut » est naturel en français et préserve la portée théophanique sans préciser davantage le mode de révélation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בָּאֹהֶל
  choice: dans la tente
  rationale: אֹהֶל signifie « tente ». Le contexte désigne vraisemblablement la tente de la rencontre, mais le verset dit simplement « la tente ».
- source_word: בְּעַמּוּד עָנָן
  choice: dans une colonne de nuée
  rationale: La préposition ב décrit ici le cadre ou le moyen de la manifestation. L’expression sans article est rendue naturellement par « une colonne de nuée ».
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: עמד signifie « se tenir, être debout ». « Se tint » conserve l’image concrète tout en convenant au registre narratif.
- source_word: עַמּוּד הֶעָנָן
  choice: la colonne de nuée
  rationale: L’expression définie reprend et identifie la colonne qui vient d’être mentionnée.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: à l’entrée de la tente
  rationale: Dans cette indication spatiale, עַל avec פתח peut naturellement désigner une position à l’entrée. Cette formulation française est claire sans exclure la nuance plus littérale « au-dessus de ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie le nom propre du Dieu d’Israël. « Yahweh » le conserve sans le remplacer par un titre confessionnel traditionnel.
- issue: Description de la théophanie
  choice: Yahweh apparut dans la tente, dans une colonne de nuée
  alternative: Yahweh fut vu dans la tente sous la forme d’une colonne de nuée
  rationale: La traduction maintient la manifestation visible et localisée ainsi que son caractère mystérieux, sans affirmer que Yahweh s’identifie simplement à la colonne ou qu’il en prend la forme.
translation_notes:
  register: 'Français international moderne, sobre et digne. La répétition de « colonne de nuée » et de « tente » est conservée, car elle structure le texte hébreu. Aucune note n’est nécessaire : « dans la tente » suit directement l’hébreu, tandis que « à l’entrée » rend naturellement la relation spatiale.'
