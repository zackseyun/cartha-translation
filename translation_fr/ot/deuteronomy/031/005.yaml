  yaml_path: translation/ot/deuteronomy/031/005.yaml
  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: fr
  text: Le SEIGNEUR les livrera entre vos mains, et vous les traiterez conformément à tout ce que je vous ai ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: Le SEIGNEUR les livrera entre vos mains
  rationale: Littéralement « le SEIGNEUR les donnera devant vous ». Dans ce contexte militaire, l’expression signifie qu’il les remettra au pouvoir d’Israël. « Livrera entre vos mains » exprime naturellement ce sens en français, sans donner à לִפְנֵיכֶם le seul sens spatial de « devant vous ».
- source_word: וַעֲשִׂיתֶם לָהֶם
  choice: vous les traiterez
  rationale: Littéralement « vous ferez à leur égard ». « Vous les traiterez » restitue idiomatiquement l’action exercée envers les peuples mentionnés.
- source_word: כְּכָל הַמִּצְוָה
  choice: conformément à tout ce que je vous ai ordonné
  rationale: Le singulier collectif הַמִּצְוָה désigne ici l’ensemble de la prescription donnée par Moïse. Cette formulation française évite le tour peu naturel « selon tout le commandement » tout en conservant l’étendue totale marquée par כָּל.
theological_decisions:
- issue: Nature de l’action ordonnée envers les peuples
  choice: Ne pas expliciter dans ce verset le contenu de l’ordre
  alternative: Ajouter une formulation telle que « vous les exterminerez »
  rationale: Le texte renvoie à un ordre antérieur sans en répéter ici le contenu. La traduction maintient ce renvoi et ne résout pas implicitement la portée de la prescription.
- issue: Rendu du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: « le SEIGNEUR » est une convention française reconnue pour représenter le tétragramme, tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la succession des deux propositions hébraïques et le futur à valeur de certitude/promesse, avec une formulation idiomatique adaptée au contexte militaire.
