  text: וַ/יְצַ֥ו מֹשֶׁ֖ה אוֹתָ֣/ם לֵ/אמֹ֑ר מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֗ים בְּ/מֹעֵ֛ד שְׁנַ֥ת הַ/שְּׁמִטָּ֖ה בְּ/חַ֥ג הַ/סֻּכּֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: fr
  text: 'Moïse leur donna cet ordre : « À la fin de chaque période de sept ans[a], au moment fixé de l’année de la remise[b], lors de la fête des Cabanes[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la fin de sept ans ». Le contexte de ce cycle sabbatique indique qu’il se répète tous les sept ans.'
    reason: lexical_alternative
  - marker: b
    text: La « remise » désigne l’institution prescrite pour la septième année ; on dit traditionnellement « l’année sabbatique ».
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « fête des Tabernacles » ; on trouve aussi « fête des Tentes » ou « des Huttes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime un ordre ou un commandement. Cette tournure française garde sa force directive tout en introduisant naturellement le discours direct.
- source_word: אוֹתָם
  choice: leur
  rationale: Le pronom objet masculin pluriel renvoie aux personnes mentionnées dans le contexte précédent ; en français, « leur donna cet ordre » est idiomatique.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif quotatif hébreu introduit les paroles qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans le calque pesant « en disant ».
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: À la fin de chaque période de sept ans
  rationale: מִקֵּץ signifie « à la fin de ». L’ajout de « chaque période » explicite le caractère récurrent du cycle légal, indiqué par le contexte, tout en conservant l’idée de son terme.
- source_word: בְּמוֹעֵד
  choice: à l’époque fixée
  rationale: מוֹעֵד désigne un moment déterminé ou fixé, avec ici une nuance calendaire et cultuelle. « Époque fixée » convient à une célébration annuelle.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: l’année de la remise
  rationale: שְׁמִטָּה désigne la remise ou libération prescrite pour la septième année. Cette traduction rend directement le sens du terme plutôt que de recourir uniquement à l’appellation traditionnelle « année sabbatique ».
- source_word: בְּחַג הַסֻּכּוֹת
  choice: lors de la fête des Cabanes
  rationale: חַג désigne une fête, et סֻכּוֹת signifie littéralement des cabanes ou abris temporaires. « Fête des Cabanes » conserve l’image concrète de l’hébreu dans un français clair.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le calque hébraïque « en disant », conserve le caractère formel de l’ordre et maintient la structure suspendue du verset, dont la phrase se poursuit au verset suivant.
