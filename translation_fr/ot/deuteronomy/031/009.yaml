  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: fr
  text: Moïse écrivit cette loi[a] et la remit aux prêtres, fils de Lévi[b], qui portent l’arche de l’alliance de Yahvé[c], ainsi qu’à tous les anciens d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette instruction » ou « cette Torah ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fils de Lévi » ; on peut aussi traduire plus brièvement par « Lévites ».
    reason: lexical_alternative
  - marker: c
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: écrivit
  rationale: Le verbe כתב désigne directement l’action d’écrire; le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: cette loi
  rationale: תּוֹרָה peut signifier « loi » ou « instruction ». Ici, il s’agit du corpus d’alliance que Moïse met par écrit; « cette loi » rend naturellement ce sens tout en laissant les autres possibilités en note.
- source_word: וַיִּתְּנָהּ
  choice: la remit
  rationale: Le suffixe féminin renvoie à תּוֹרָה. « La remit » exprime naturellement la transmission du document aux responsables désignés.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: כֹּהֲנִים est le terme ordinaire désignant les prêtres.
- source_word: בְּנֵי לֵוִי
  choice: fils de Lévi
  rationale: Cette formulation conserve l’expression hébraïque et son rapport d’apposition avec « les prêtres », sans la réduire d’emblée au terme « Lévites ».
- source_word: הַנֹּשְׂאִים
  choice: qui portent
  rationale: Le participe décrit ceux qui portent l’arche; « portent » est direct et idiomatique en français moderne.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahvé
  rationale: Cette formulation reproduit clairement la chaîne construite hébraïque sans transformer explicitement le rapport en possessif.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme YHWH; une note signale le rendu traditionnel.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: tous les anciens d’Israël
  rationale: Rendu direct de l’expression désignant les responsables reconnus d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin YHWH. Employer « Yahvé » le distingue d’un titre, tandis que la note conserve l’information sur la convention traditionnelle française.
- issue: Portée de תּוֹרָה dans ce contexte
  choice: loi
  alternative: instruction; Torah
  rationale: Le contexte concerne le texte d’alliance mis par écrit et confié aux responsables. « Loi » convient ici, mais la note préserve l’étendue sémantique du terme hébreu sans trancher davantage.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif écrit; « remit » évite une formulation pesante. Les notes préservent les principales possibilités lexicales et la convention liée au nom divin.
