id: DEU.31.25
reference: Deuteronomy 31:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת הַ/לְוִיִּ֔ם נֹ֥שְׂאֵ֛י אֲר֥וֹן בְּרִית יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/025.yaml
  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: fr
  text: 'Moïse donna cet ordre aux Lévites qui portaient l’arche de l’alliance de Yahweh[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux Lévites, porteurs de l’arche de l’alliance de Yahweh ». Le participe hébreu peut être rendu plus formellement comme une désignation de fonction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime le fait de donner un ordre. Cette tournure est naturelle en français et permet d’introduire directement les paroles qui suivent.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: « Lévites » est la désignation française établie et exacte des membres de la tribu de Lévi.
- source_word: נֹשְׂאֵי
  choice: qui portaient
  rationale: Le participe נשׂא décrit ici les Lévites par leur fonction à l’égard de l’arche. La proposition relative est claire et naturelle, tout en laissant en note la possibilité d’une désignation plus proche de la forme hébraïque.
- source_word: אֲרוֹן
  choice: l’arche
  rationale: Dans ce contexte cultuel et lié à l’alliance, אֲרוֹן désigne l’arche sacrée, et non un coffre ordinaire.
- source_word: בְּרִית
  choice: de l’alliance
  rationale: L’état construit forme l’expression consacrée « l’arche de l’alliance ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: La formule hébraïque introduit les paroles prononcées au verset suivant. En français actuel, les deux-points remplissent naturellement cette fonction après « donna cet ordre » sans ajouter le lourd « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et le distingue du titre אֲדֹנָי.
translation_notes:
  register: Français international moderne, sobre et digne. « Donna cet ordre » évite la tournure moins idiomatique « commanda aux Lévites, en disant », tandis que les deux-points annoncent clairement le discours du verset suivant.
