  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: fr
  text: Et moi, je cacherai certainement ma face, ce jour-là, à cause de tout le mal qu’il a fait, car il s’est tourné vers d’autres dieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Et moi
  rationale: Le pronom אָנֹכִי est explicite et emphatique; « Et moi » en conserve naturellement la mise en relief, tandis que וְ garde sa valeur connective.
- source_word: הַסְתֵּר אַסְתִּיר
  choice: je cacherai certainement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action. « Certainement » rend cette insistance sans alourdir excessivement la phrase.
- source_word: פָּנַי
  choice: ma face
  rationale: L’expression signifie littéralement « ma face ». La conserver maintient l’image concrète et son ambiguïté quant au retrait de la faveur ou de la présence divine.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Formulation temporelle naturelle en français moderne qui préserve la valeur démonstrative de l’hébreu.
- source_word: עַל כָּל הָרָעָה
  choice: à cause de tout le mal
  rationale: עַל exprime ici la cause, et רָעָה désigne dans ce contexte le mal moral plutôt qu’un simple malheur.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a fait
  rationale: Le verbe hébreu est au masculin singulier et présente collectivement Israël comme une seule personne; le français conserve ce singulier.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication du mal commis. « Car » marque clairement ce rapport sans rendre la répétition causale trop lourde après « à cause de ».
- source_word: פָנָה אֶל
  choice: s’est tourné vers
  rationale: Cette formulation naturelle conserve l’image du mouvement vers d’autres objets d’allégeance sans expliciter davantage l’interprétation cultuelle.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe de l’expression désignant des divinités autres que le Dieu d’Israël.
theological_decisions:
- issue: Expression anthropomorphique du retrait divin
  choice: Conserver « je cacherai certainement ma face » dans le texte principal
  alternative: « je retirerai ma présence » ou « je détournerai mon regard »
  rationale: L’hébreu emploie l’image concrète de la face cachée. La traduction ne tranche pas entre retrait de présence, de faveur ou de protection.
- issue: Référence singulière à Israël
  choice: Employer « il a fait » et « il s’est tourné »
  alternative: « ils ont fait » et « ils se sont tournés »
  rationale: Les verbes hébreux sont au singulier et personnifient collectivement Israël; préserver ce nombre respecte la forme et la tension du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’emphase du pronom et de la construction intensive hébraïque. Aucun marqueur de note n’est ajouté, puisqu’aucune note n’est nécessaire au projet français pour ce verset.
