base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: fr
  text: 'Car je connais ta rébellion et ta nuque raide[a]. Voyez : aujourd’hui, alors que je suis encore vivant parmi vous, vous vous êtes rebellés contre Yahweh[b] ; combien plus encore après ma mort !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta nuque raide », image hébraïque de l’entêtement et de l’obstination.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, la préposition peut se traduire par « avec Yahweh » ; dans ce contexte de rébellion, elle exprime l’opposition, d’où « contre Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: ta rébellion
  rationale: Le nom מֶרִי désigne la rébellion ou l’insoumission, notamment envers Dieu. Le substantif français conserve la forme et la force du texte hébreu.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: ta raideur de nuque
  rationale: Cette formulation conserve l’image hébraïque de la nuque raide tout en étant plus naturelle en français que « ta nuque raide » dans cette coordination nominale.
- source_word: הֵן
  choice: Voyez
  rationale: La particule attire avec insistance l’attention des destinataires. « Voyez » restitue cette fonction dans un registre actuel et digne.
- source_word: בְּעוֹדֶנִּי חַי
  choice: alors que je suis encore vivant
  rationale: La formulation rend directement la valeur temporelle et l’idée de persistance exprimées par l’hébreu.
- source_word: מַמְרִים הֱיִתֶם
  choice: vous vous êtes rebellés
  rationale: La construction avec participe et היה décrit une conduite prolongée ou caractéristique jusqu’au présent de l’énonciation. Le passé composé convient naturellement en français dans ce contexte.
- source_word: עִם יְהוָה
  choice: contre Yahweh
  rationale: Bien que עִם signifie ordinairement « avec », le verbe de rébellion lui donne ici un sens d’opposition, que le français exprime naturellement avec « contre ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: וְאַף כִּי
  choice: combien plus
  rationale: 'L’expression introduit une inférence intensifiée : si le peuple se rebelle déjà en présence de Moïse, il le fera à plus forte raison après sa mort.'
- source_word: אַחֲרֵי מוֹתִי
  choice: après ma mort
  rationale: Cette traduction directe conserve la construction nominale de l’hébreu et son registre solennel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre révélé à Israël sans le remplacer par un titre.
- issue: Sens de עִם avec l’idée de rébellion
  choice: contre Yahweh
  alternative: avec Yahweh
  rationale: La préposition pourrait être rendue formellement par « avec », mais, associée à la rébellion, elle marque ici l’opposition. « Contre » explicite en français la relation syntaxique sans modifier la portée théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passage du singulier (« ta rébellion »), qui vise collectivement Israël, au pluriel (« parmi vous », « vous vous êtes rebellés ») suit les changements de nombre du texte hébreu. L’image de la nuque raide est conservée et expliquée en note. L’ellipse finale de l’hébreu est explicitée par « le ferez-vous », nécessaire à une phrase française naturelle.
