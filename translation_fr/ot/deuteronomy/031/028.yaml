base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: fr
  text: Rassemblez auprès de moi tous les anciens de vos tribus et vos responsables, afin que je prononce à leurs oreilles ces paroles et que je prenne le ciel et la terre[a] à témoin contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cieux et la terre ». Cette expression hébraïque est une formule consacrée du Deutéronome dans laquelle le ciel et la terre sont appelés comme témoins de l’alliance.
    reason: Alternative lexicale et contexte de la formule d’alliance.
lexical_decisions:
- source_word: הַקְהִילוּ אֵלַי
  choice: Rassemblez auprès de moi
  rationale: L’impératif hiphil exprime l’action de réunir des personnes; « auprès de moi » rend naturellement la direction indiquée par אֵלַי sans donner au verbe un ton excessivement administratif.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: les anciens de vos tribus
  rationale: Cette formulation claire conserve le rapport d’appartenance de la chaîne construite hébraïque.
- source_word: שֹׁטְרֵיכֶם
  choice: vos responsables
  rationale: Dans ce contexte administratif, le terme désigne des agents ou dirigeants subalternes. « Responsables » reste volontairement large; « officiers » évoquerait trop facilement le domaine militaire en français moderne, et « scribes » serait trop étroit.
- source_word: וַאֲדַבְּרָה בְאָזְנֵיהֶם אֵת הַדְּבָרִים הָאֵלֶּה
  choice: afin que je leur fasse entendre ces paroles
  rationale: Le cohortatif indique le but recherché, tandis que l’expression idiomatique « dans leurs oreilles » signifie que les paroles seront prononcées de façon audible devant eux. La traduction française restitue ce sens sans calque peu naturel.
- source_word: וְאָעִידָה בָּם אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: et que je prenne le ciel et la terre à témoin contre eux
  rationale: « Prendre à témoin » est une tournure juridique française naturelle qui conserve la fonction de témoins attribuée au ciel et à la terre ainsi que la valeur adversative de בָּם.
theological_decisions:
- issue: Formule des témoins de l’alliance
  choice: je prenne le ciel et la terre à témoin contre eux
  alternative: je fasse témoigner le ciel et la terre contre eux
  rationale: La formulation retenue préserve l’image juridique et cosmique propre au Deutéronome sans préciser au-delà du texte la manière dont ces témoins exerceront leur fonction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de l’ordre et du langage juridique de l’alliance, tout en évitant les calques hébraïques peu naturels et le sens militaire possible d’« officiers ».
