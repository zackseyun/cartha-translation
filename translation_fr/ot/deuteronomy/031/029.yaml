  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: fr
  text: Car je sais qu’après ma mort, vous vous corromprez assurément[a] et vous vous détournerez du chemin que je vous ai commandé de suivre. Dans les jours à venir[b], le malheur vous atteindra[c], parce que vous ferez ce qui est mal aux yeux de Yahweh et provoquerez sa colère par l’œuvre de vos mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous agirez de manière entièrement corrompue ». En hébreu, la répétition du verbe renforce l’affirmation, et celui-ci peut être compris ici dans un sens réflexif ou intransitif.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la fin des jours » ; l’expression peut aussi se traduire par « dans les derniers jours » et peut, selon le contexte, avoir une portée eschatologique.
    reason: lexical_alternative
  - marker: c
    text: Ou « le désastre » ou « la calamité ». Le mot hébreu רָעָה peut désigner aussi bien le mal que les conséquences funestes qui surviennent.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: Car je sais
  rationale: « Car » introduit l’explication donnée par Moïse, et le présent « je sais » exprime naturellement sa certitude.
- source_word: אַחֲרֵי מוֹתִי
  choice: après ma mort
  rationale: Rend directement et naturellement la construction nominale hébraïque.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: vous vous corromprez bel et bien
  rationale: Le redoublement par l’infinitif absolu renforce le verbe. La tournure pronominale conserve ici le sens réflexif ou intransitif probable sans lui donner un objet absent du texte.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: et vous vous détournerez du chemin
  rationale: Conserve l’image hébraïque et son sens d’abandon de la conduite prescrite dans le cadre de l’alliance.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: que je vous ai prescrit
  rationale: « Prescrire un chemin » est une formulation française concise qui garde Moïse comme auteur du commandement.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: le malheur vous atteindra
  rationale: Dans cette construction, רָעָה désigne une réalité néfaste qui survient au peuple. « Malheur » convient mieux en français que le calque ambigu « le mal ».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans les jours à venir
  rationale: Cette expression garde l’orientation future de l’hébreu sans imposer une interprétation eschatologique étroite.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: parce que vous ferez ce qui est mal
  rationale: Formulation française naturelle qui conserve explicitement l’évaluation morale.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Reproduit l’image hébraïque indiquant l’évaluation de Yahweh.
- source_word: לְהַכְעִיסוֹ
  choice: et provoquerez sa colère
  rationale: Exprime clairement la valeur causative du verbe hébreu dans une coordination française naturelle.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: par l’œuvre de vos mains
  rationale: Préserve le singulier collectif et l’expression concrète du texte sans préciser qu’il s’agit d’idoles, ce qui reste implicite.
theological_decisions:
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de בְּאַחֲרִית הַיָּמִים
  choice: dans les jours à venir
  alternative: dans les derniers jours
  rationale: Le choix principal exprime un avenir encore indéterminé et évite d’imposer une lecture exclusivement eschatologique; l’autre sens possible est signalé en note.
- issue: Nature de la corruption annoncée
  choice: vous vous corromprez
  alternative: vous agirez de manière entièrement corrompue
  rationale: La forme hébraïque peut recevoir une nuance réflexive ou intransitive. Le texte principal retient une formulation française qui laisse ouverte la transformation morale du peuple, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de l’hébreu tout en évitant les calques peu naturels. « Bel et bien » marque l’intensification verbale sans lourdeur archaïque; « l’œuvre de vos mains » conserve l’expression biblique et son ambiguïté référentielle.
