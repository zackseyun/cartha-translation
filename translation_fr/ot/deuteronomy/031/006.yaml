  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: fr
  text: Soyez forts et courageux. N’ayez pas peur et ne soyez pas terrifiés devant eux[a], car Yahweh, votre Dieu, c’est lui qui marche avec vous. Il ne vous fera pas défaut[b] et ne vous abandonnera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne les redoutez pas ». Le second verbe est plus fort que le premier et peut évoquer le fait d’être saisi ou brisé par l’effroi.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ne te lâchera pas » ou « il ne te laissera pas tomber » ; l’idée est qu’il ne manquera pas de te soutenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Soyez forts et courageux
  rationale: Les deux impératifs pluriels forment une exhortation consacrée. Cette formulation française naturelle conserve à la fois l’idée de force et celle de résolution courageuse.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: N’ayez pas peur et ne soyez pas terrifiés
  rationale: Le premier verbe exprime la peur en général, tandis que le second intensifie l’idée en évoquant l’effroi. La traduction maintient cette progression.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: Littéralement « de devant eux » ou « à cause de leur présence ». « Devant eux » reste proche de l’image hébraïque tout en étant idiomatique dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: c’est lui qui marche avec vous
  rationale: La construction avec le pronom indépendant et le participe met le sujet en relief. « C’est lui qui » rend cette insistance en français.
- source_word: לֹא יַרְפְּךָ
  choice: Il ne vous laissera pas tomber
  rationale: Le hiphil de רפה évoque le fait de relâcher, de lâcher ou de laisser tomber. Cette expression française actuelle communique le soutien qui ne fera pas défaut et reste distincte du verbe suivant.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: et ne vous abandonnera pas
  rationale: עזב signifie quitter ou abandonner. « Abandonner » conserve la gravité de l’assurance sans employer un mot français devenu peu courant comme « délaisser ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération conserve le nom d’alliance sans le remplacer par un titre.
- issue: Distinction entre יַרְפְּךָ et יַעַזְבֶךָ
  choice: Il ne vous laissera pas tomber et ne vous abandonnera pas
  alternative: Il ne vous fera pas défaut et ne vous délaissera pas
  rationale: 'Le choix retenu préserve les deux assurances parallèles : Dieu ne relâchera pas son soutien et n’abandonnera pas son peuple. Il n’ajoute aucune précision doctrinale absente de l’hébreu.'
- issue: Passage des impératifs pluriels aux suffixes hébreux singuliers
  choice: vous, compris collectivement
  alternative: toi, compris comme désignant Israël collectivement
  rationale: L’hébreu exhorte d’abord plusieurs auditeurs, puis s’adresse à Israël comme à une unité collective. En français, « vous » garde une adresse naturelle au peuple sans effacer la portée collective du singulier hébreu.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier de l’hébreu collectif est rendu par « vous » pour correspondre à l’exhortation adressée au peuple, tandis que « c’est lui qui » conserve l’emphase de la construction hébraïque.
