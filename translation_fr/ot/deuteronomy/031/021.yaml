  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: fr
  text: Quand de nombreux malheurs et détresses l’atteindront[a], ce chant répondra devant lui en témoignage[b], car il ne disparaîtra pas de la bouche de sa descendance. En effet, je connais son penchant[c], ce qu’il fait aujourd’hui, avant même que je le fasse entrer dans le pays que j’ai juré de lui donner[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le trouveront » ou « le surprendront ».
    reason: lexical_alternative
  - marker: b
    text: 'Dans ce contexte judiciaire, « devant lui » peut aussi se comprendre avec une nuance plus accusatrice : « contre lui ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut aussi désigner son intention, sa disposition intérieure ou ce qu’il imagine.
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu dit littéralement : « le pays que j’ai juré ». « De lui donner » est sous-entendu par le contexte de la promesse d’alliance.'
    reason: textual_clarification
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Introduit naturellement en français la situation future exprimée par la tournure hébraïque, sans conserver un calque pesant comme « Et il arrivera que ».
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: l’atteindront
  rationale: Avec « malheurs et détresses » pour sujet, le verbe מצא désigne ici des épreuves qui rencontrent ou saisissent quelqu’un. « Atteindre » reste naturel tout en gardant cette image.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: de nombreux malheurs et détresses
  rationale: רָעוֹת désigne ici des événements funestes plutôt que le mal moral abstrait. « Malheurs » et « détresses » rendent clairement les deux termes sans les confondre.
- source_word: וְעָנְתָה
  choice: répondra
  rationale: Conserve le sens premier de ענה et la personnification du chant. Sa fonction judiciaire est explicitée par « comme témoin ».
- source_word: לְפָנָיו לְעֵד
  choice: devant lui comme témoin
  rationale: « Devant lui » respecte le sens spatial et judiciaire de לְפָנָיו sans décider dans le texte principal si le témoignage est explicitement « contre lui ».
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: il ne sera pas oublié de la bouche de sa descendance
  rationale: La formulation garde l’image hébraïque de la bouche, qui évoque la transmission et la récitation orales, ainsi que le collectif singulier de זרע.
- source_word: יִצְרוֹ
  choice: son penchant
  rationale: יִצֶר peut désigner la disposition, l’intention ou l’élan intérieur. « Penchant » exprime ici l’orientation intérieure sans lui imposer un sens doctrinal technique.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: ce qu’il fait aujourd’hui
  rationale: Cette traduction proche du texte conserve la relation quelque peu tendue entre la disposition intérieure d’Israël et sa conduite présente, sans la réduire uniquement à un projet futur.
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: que j’ai juré de lui donner
  rationale: L’hébreu s’arrête littéralement à « que j’ai juré », mais l’objet implicite du serment est le don du pays. Le complément est nécessaire à une phrase française naturelle et est signalé en note.
theological_decisions:
- issue: Le sens anthropologique de יִצְרוֹ dans le rapport entre connaissance divine et disposition humaine
  choice: son penchant
  alternative: son intention ; son imagination ; sa disposition
  rationale: « Penchant » maintient l’idée d’une orientation intérieure connue de Dieu avant l’entrée dans le pays, sans transformer le verset en formulation technique d’une doctrine ultérieure.
- issue: La fonction accusatrice du chant comme témoin
  choice: devant lui comme témoin
  alternative: contre lui comme témoin
  rationale: Le contexte permet une valeur accusatrice, mais לְפָנָיו signifie formellement « devant lui » ou « en sa présence ». Le texte principal conserve cette ambiguïté, et la note mentionne la lecture plus forte.
- issue: Le contenu elliptique du serment divin
  choice: que j’ai juré de lui donner
  alternative: au sujet duquel j’ai prêté serment
  rationale: Le don du pays est implicite dans la formule d’alliance. L’ajout rend la phrase française intelligible sans introduire un contenu étranger au contexte, et il est explicitement indiqué en note.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe demeure proche de l’hébreu lorsque cette proximité porte une image importante, notamment le chant qui « répond » et la parole conservée « de la bouche » de la descendance. Les pronoms au singulier reproduisent la personnification collective d’Israël dans le texte source.
