revisions:
- from: Quand de nombreux malheurs et détresses l’atteindront[a], ce chant répondra devant lui comme témoin[b], car il ne sera pas oublié de la bouche de sa descendance. En effet, je connais son penchant[c], ce qu’il fait aujourd’hui, avant même que je le fasse entrer dans le pays que j’ai juré de lui donner[d].
  to: Quand de nombreux malheurs et détresses l’atteindront[a], ce chant répondra devant lui en témoignage[b], car il ne disparaîtra pas de la bouche de sa descendance. En effet, je connais son penchant[c], ce qu’il fait aujourd’hui, avant même que je le fasse entrer dans le pays que j’ai juré de lui donner[d].
  rationale: La révision améliore deux tournures françaises sans modifier le sens ni résoudre l'ambiguïté judiciaire de l'hébreu. « Ne disparaîtra pas de la bouche » préserve l'image de récitation et de transmission orale ; « en témoignage » rend naturellement la fonction du chant comme témoin. Les notes et l'explicitation contextuelle du don du pays sont conservées.
