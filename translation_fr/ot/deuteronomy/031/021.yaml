  source_fidelity: 'Le texte rend fidèlement la structure du verset : les malheurs qui atteignent Israël, le chant qui répond en qualité de témoin, la connaissance divine de son penchant et de sa conduite présente, puis l''entrée dans le pays promis. L''explicitation « de lui donner » correspond au contexte d''alliance et est correctement signalée en note.'
  naturalness: « Il ne sera pas oublié de la bouche de sa descendance » est un calque peu naturel en français. « Ne disparaîtra pas de la bouche de sa descendance » conserve l'image orale du texte hébreu tout en étant idiomatique. « Répondra devant lui comme témoin » est compréhensible, mais « répondra devant lui en témoignage » est plus fluide et exprime mieux la fonction introduite par לְעֵד sans transformer le verbe en « témoignera ».
