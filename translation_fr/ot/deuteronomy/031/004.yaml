  text: וְ/עָשָׂ֤ה יְהוָה֙ לָ/הֶ֔ם כַּ/אֲשֶׁ֣ר עָשָׂ֗ה לְ/סִיח֥וֹן וּ/לְ/ע֛וֹג מַלְכֵ֥י הָ/אֱמֹרִ֖י וּ/לְ/אַרְצָ֑/ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: fr
  text: L’Éternel leur fera comme il a fait à Sihôn et à Og, les rois des Amorites, ainsi qu’à leur pays, lorsqu’il les a détruits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rend le tétragramme selon une convention française largement reconnue, tout en le distinguant du titre ordinaire « Seigneur ».
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Exprime directement la comparaison entre le sort futur des peuples et celui de Sihôn et d’Og.
- source_word: הִשְׁמִיד
  choice: a détruits
  rationale: Le verbe hiphil exprime ici l’anéantissement ou la destruction; « détruire » est naturel et fidèle dans ce contexte.
theological_decisions:
- issue: Référent du pronom dans אֲשֶׁר הִשְׁמִיד אֹתָם
  choice: « lorsqu’il les a détruits », où « les » renvoie à Sihôn et Og, et éventuellement à leurs forces ou peuples représentés par eux
  alternative: « qu’il a détruit », en faisant de « leur pays » l’antécédent
  rationale: Le suffixe אֹתָם est masculin pluriel, ce qui favorise un référent humain pluriel plutôt que le singulier « pays ». La valeur temporelle « lorsque » conserve naturellement le lien avec l’action antérieure de Dieu sans forcer un relatif adjectival.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « ainsi qu’à leur pays » clarifie que l’action divine concerne à la fois les deux rois et leur territoire, tandis que « lorsqu’il les a détruits » respecte le pluriel hébreu.
