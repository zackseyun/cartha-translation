base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: fr
  text: Car lorsque je l’aurai fait entrer dans le pays que j’ai promis par serment à ses pères, pays ruisselant de lait et de miel, il mangera, se rassasiera et deviendra gras. Il se tournera alors vers d’autres dieux ; ils les serviront et me mépriseront, puis il rompra mon alliance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu parle d’abord d’Israël au singulier (« le… il »), passe au pluriel pour « ils les serviront et me mépriseront », puis revient au singulier pour « il rompra ». Il présente ainsi Israël à la fois comme un seul peuple et comme une multitude de personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car lorsque
  rationale: Réunit la valeur explicative de la conjonction et la valeur temporelle de la proposition qui suit.
- source_word: אֲבִיאֶנּוּ
  choice: je l’aurai fait entrer
  rationale: Le suffixe masculin singulier désigne collectivement Israël. Le futur antérieur convient en français après « lorsque » et exprime l’antériorité par rapport aux actions suivantes.
- source_word: הָאֲדָמָה
  choice: le pays
  rationale: Dans ce contexte géographique et lié à l’alliance, le terme désigne le pays promis plutôt que le sol matériel.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: que j’ai promis par serment à ses pères
  rationale: Cette formulation rend explicitement la notion de serment tout en conservant le masculin singulier collectif dans « ses pères ».
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: pays ruisselant de lait et de miel
  rationale: Expression française naturelle qui conserve l’image concrète d’une abondance débordante.
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: il mangera, se rassasiera et engraissera
  rationale: La séquence future est rendue sans atténuer la métaphore physique de l’embonpoint produit par l’abondance.
- source_word: וּפָנָה אֶל
  choice: Il se tournera alors vers
  rationale: Rend le mouvement de réorientation vers d’autres dieux sans ajouter un terme doctrinal comme « apostasier ».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe qui évite l’interprétation plus étroite « dieux étrangers ».
- source_word: וַעֲבָדוּם
  choice: ils les serviront
  rationale: Le pluriel hébreu est conservé. « Servir » maintient le langage d’allégeance religieuse sans le réduire au seul acte cultuel.
- source_word: וְנִאֲצוּנִי
  choice: me mépriseront
  rationale: Le verbe exprime le mépris et le rejet insultant. Le pluriel de l’hébreu est préservé.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: puis il rompra mon alliance
  rationale: Le texte revient au singulier pour le sujet et emploie le vocabulaire établi de la rupture d’une alliance.
theological_decisions:
- issue: Alternance entre le singulier collectif et le pluriel pour Israël
  choice: Conserver « le… il », puis « ils », puis le retour à « il »
  alternative: Uniformiser tous les pronoms au pluriel ou tous au singulier
  rationale: Les formes verbales hébraïques passent réellement du singulier au pluriel pour « servir » et « mépriser », puis reviennent au singulier pour « rompre ». Cette alternance présente Israël à la fois comme un peuple unique et comme une pluralité de personnes ; la lisser supprimerait une tension authentique du texte.
- issue: Description de l’infidélité à l’alliance
  choice: « se tournera vers d’autres dieux ; ils les serviront »
  alternative: « se livrera à l’idolâtrie » ou « apostasiera »
  rationale: La traduction conserve les actes précis nommés dans le texte sans leur substituer une qualification théologique plus générale.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation rend lisible l’alternance inhabituelle des sujets sans la corriger. « Ses pères » conserve l’expression traditionnelle et la référence masculine du texte source ; « ancêtres » serait plus courant mais moins formellement précis.
