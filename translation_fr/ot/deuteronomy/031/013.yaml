base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: fr
  text: Et leurs enfants[a], qui ne savent pas encore, écouteront et apprendront à craindre Yahweh[b], votre Dieu, tous les jours de votre vie dans le pays dont vous allez prendre possession en traversant le Jourdain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils ». Le terme hébreu peut désigner les fils en particulier ou les enfants et descendants plus largement.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « que vous traversez le Jourdain vers là pour en prendre possession ». Le verbe peut aussi évoquer le fait d’en hériter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: Et leurs enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants et la génération suivante. Dans ce contexte d’instruction communautaire, « enfants » évite de restreindre indûment le sens aux garçons.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: qui ne connaissent pas encore
  rationale: Le parfait négatif exprime l’absence de connaissance ou d’expérience antérieure. « Pas encore » rend naturellement en français l’idée de la génération qui n’a pas encore reçu cette instruction, sans préciser abusivement l’objet implicite de la connaissance.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: écouteront et apprendront
  rationale: שמע signifie ici entendre avec attention dans le cadre de la lecture de la Loi; « écouteront » convient mieux que le simple « entendront ». Les futurs expriment le résultat attendu.
- source_word: לְיִרְאָה
  choice: à craindre
  rationale: « Craindre » conserve la force théologique de ירא, qui englobe ici crainte respectueuse, révérence et fidélité, sans réduire le terme à la seule vénération.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: tous les jours où vous vivrez
  rationale: Cette formulation française naturelle maintient l’idée de durée continue pendant toute la vie.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: אדמה désigne ici le territoire où Israël vivra. « Sur la terre » respecte la préposition hébraïque et demeure idiomatique dans ce registre.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: que vous allez posséder après avoir traversé le Jourdain
  rationale: La restructuration rend clairement en français le mouvement vers le pays situé au-delà du Jourdain et le but exprimé par לְרִשְׁתָּהּ. « Posséder » garde les nuances de prise de possession et d’héritage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre. « Yahweh » le conserve explicitement, tandis que « le SEIGNEUR » représente la substitution liturgique traditionnelle.
- issue: Portée de בנים dans l’instruction de l’alliance
  choice: enfants
  alternative: fils
  rationale: Le contexte vise la génération suivante appelée à entendre la Loi; « enfants » rend cette portée collective sans exclure la possibilité lexicale plus étroite de « fils ».
- issue: Nature de la crainte exprimée par ירא
  choice: craindre
  alternative: révérer
  rationale: « Craindre » préserve la tension du terme biblique entre crainte, respect et obéissance, tandis que « révérer » en atténuerait une partie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement restructurée pour rendre clairement la destination et le but de la traversée, tout en conservant les répétitions importantes, le futur et le vocabulaire théologique du texte hébreu.
