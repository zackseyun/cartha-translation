  to: Et leurs enfants[a], qui ne savent pas encore, écouteront et apprendront à craindre Yahweh[b], votre Dieu, tous les jours de votre vie dans le pays dont vous allez prendre possession en traversant le Jourdain[c].
  rationale: La révision corrige l’ellipse maladroite de « connaître » et restitue plus nettement le lien entre le franchissement du Jourdain et la prise de possession du pays. Elle conserve l’objet implicite de « savoir », l’ambiguïté lexicale de בנים et de ירשׁ, ainsi que les trois ancres de notes existantes.
