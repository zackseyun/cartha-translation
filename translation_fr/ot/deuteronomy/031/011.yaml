source:
  edition: WLC
  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: fr
  text: Quand tout Israël viendra paraître devant Yahweh ton Dieu[a], au lieu qu’il choisira, tu liras cette loi devant tout Israël, de manière qu’ils l’entendent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « voir la face de Yahweh ton Dieu » ; dans ce contexte, cette expression signifie se présenter en sa présence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל־יִשְׂרָאֵל
  choice: Quand tout Israël viendra
  rationale: La préposition ב avec l’infinitif construit introduit une proposition temporelle. Le futur « viendra » convient au contexte des prescriptions données en vue de l’avenir.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: paraître devant
  rationale: Dans ce contexte cultuel, l’expression littérale « voir la face de » signifie se présenter dans la présence de Dieu. « Paraître devant » rend naturellement cet idiome sans suggérer une vision physique du visage divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle « Yahweh », plutôt que remplacé par un titre.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: au lieu qu’il choisira
  rationale: Cette formulation conserve le thème deutéronomique du lieu de culte choisi par Dieu et rend l’inaccompli hébreu selon sa valeur future dans ce contexte.
- source_word: תִּקְרָא אֶת־הַתּוֹרָה הַזֹּאת
  choice: tu liras cette loi
  rationale: Avec « cette loi » comme complément, קרא désigne ici la lecture publique. « Loi » rend תורה de façon accessible dans le contexte du corpus d’alliance du Deutéronome.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: devant tout Israël
  rationale: נגד indique que la lecture est faite publiquement en présence de l’assemblée d’Israël.
- source_word: בְּאָזְנֵיהֶם
  choice: de manière qu’ils l’entendent
  rationale: 'Cette tournure française naturelle exprime la portée de l’idiome hébreu littéral « à leurs oreilles » : la loi doit être lue audiblement à tout le peuple.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom personnel du Dieu d’Israël. La translittération le distingue du titre אֲדֹנָי et préserve cette donnée du texte source.
- issue: Sens de « voir la face » de Dieu
  choice: paraître devant Yahweh
  alternative: voir la face de Yahweh
  rationale: Le contexte de rassemblement cultuel favorise le sens idiomatique de se présenter dans la présence de Dieu. Une note conserve toutefois l’image hébraïque afin de ne pas la masquer.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier de « ton Dieu » et « tu liras » conserve l’adresse collective à Israël au singulier, tandis que « ils l’entendent » reprend les membres du peuple, conformément au suffixe pluriel hébreu.
