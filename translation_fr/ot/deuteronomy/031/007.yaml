base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: fr
  text: 'Moïse appela Josué et lui dit devant tout Israël : « Sois fort et courageux, car tu entreras avec ce peuple[a] dans le pays que Yahweh a juré à leurs pères de leur donner, et c’est toi qui le leur donneras en héritage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu feras entrer ce peuple dans le pays ». L’hébreu peut présenter Josué soit comme entrant avec le peuple, soit comme le conduisant à l’intérieur.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא מֹשֶׁה לִיהוֹשֻׁעַ
  choice: Moïse appela Josué
  rationale: Dans ce contexte narratif, קרא signifie naturellement « appeler ». Les noms propres suivent leur forme française usuelle.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: devant tout Israël
  rationale: Rend naturellement l’expression littérale « aux yeux de tout Israël » et souligne le caractère public de la déclaration.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sois fort et courageux
  rationale: Formule française claire et consacrée qui restitue l’exhortation hébraïque à la force et à la détermination.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: tu entreras avec ce peuple
  rationale: La construction de בוא avec אֶת peut présenter Josué comme entrant avec le peuple. Cette traduction conserve la nuance sans l’harmoniser avec les formulations voisines où il est explicitement question de faire entrer le peuple.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: « Pays » est naturel en français pour le territoire promis, tout en conservant ici la continuité du thème de la terre promise.
- source_word: נִשְׁבַּע יְהוָה
  choice: Yahweh a juré
  rationale: Le nifal de שׁבע exprime un serment, et le tétragramme est rendu par le nom divin « Yahweh ».
- source_word: לַאֲבֹתָם
  choice: à leurs pères
  rationale: Conserve le terme masculin de parenté explicitement employé par l’hébreu, avec sa référence aux patriarches.
- source_word: תַּנְחִילֶנָּה אוֹתָם
  choice: c’est toi qui le leur donneras en héritage
  rationale: Le hifil de נחל signifie faire hériter ou attribuer en héritage. La tournure française exprime clairement le rôle actif confié à Josué; « c’est toi » rend l’emphase du pronom וְאַתָּה.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de תָּבוֹא אֶת הָעָם
  choice: tu entreras avec ce peuple
  alternative: tu feras entrer ce peuple
  rationale: La syntaxe permet de comprendre que Josué entrera avec le peuple, tandis que la proposition suivante lui attribue explicitement le rôle actif de lui donner le pays en héritage. L’autre lecture demeure possible et est signalée en note.
- issue: Traduction de אֲבֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: « Leurs pères » maintient le terme de parenté masculin du texte et sa portée patriarcale, sans le neutraliser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’emphase sur Josué et l’ambiguïté réelle de la proposition centrale.
