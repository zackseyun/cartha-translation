base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: fr
  text: Ils sont allés servir d’autres dieux et se sont prosternés devant eux, des dieux qu’ils n’avaient pas connus et qu’il ne leur avait pas attribués[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et qui ne leur avaient pas été attribués ». En hébreu, le verbe est au singulier et son sujet n’est pas exprimé ; il renvoie vraisemblablement à Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: ils sont allés
  rationale: Le verbe הלך signifie littéralement « aller, marcher ». La formulation conserve la succession hébraïque « aller et servir » sans réduire d’emblée l’expression à un sens purement figuré.
- source_word: וַיַּעַבְדוּ
  choice: servir
  rationale: עבד signifie couramment « servir ». Ce choix maintient la distinction avec le verbe suivant, qui décrit explicitement la prosternation cultuelle.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Cette expression rend directement le sens ordinaire de אֲחֵרִים et correspond à l’usage du Deutéronome, sans préciser indûment qu’il s’agirait de dieux « étrangers ».
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: se sont prosternés devant eux
  rationale: שׁחה évoque l’acte physique de se courber ou de se prosterner. La traduction préserve cette image et évite de confondre ce geste avec le sens plus général de « servir ».
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: des dieux qu’ils n’avaient pas connus
  rationale: ידע peut ici exprimer une connaissance relationnelle et vécue, et non une simple connaissance intellectuelle. Le plus-que-parfait convient au contexte narratif français.
- source_word: וְלֹא חָלַק לָהֶם
  choice: et qu’il ne leur avait pas attribués
  rationale: חלק signifie « partager, répartir, attribuer ». Le verbe hébreu est au masculin singulier avec un sujet non exprimé, vraisemblablement Dieu ; « attribués » garde l’idée d’une part assignée tout en restant naturel en français.
theological_decisions:
- issue: Sujet implicite du verbe singulier חָלַק
  choice: 'Le pronom « il » renvoie implicitement à Dieu : « qu’il ne leur avait pas attribués » encodes this reading.'
  alternative: « et qui ne leur avaient pas été attribués », formulation passive qui laisse l’agent inexprimé.
  rationale: L’hébreu emploie un verbe à la troisième personne du masculin singulier sans nommer son sujet. Le contexte permet naturellement de comprendre Dieu comme l’auteur de l’attribution, mais la note conserve l’autre manière possible de représenter cette syntaxe implicite.
translation_notes:
  register: Français international moderne, clair et digne. « Se prosterner devant » conserve l’image concrète du texte hébreu, tandis que « attribuer » exprime naturellement l’idée de répartition sans vocabulaire confessionnel spécialisé.
