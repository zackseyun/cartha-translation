    rationale: Le relatif singulier אֲשֶׁר suit « son serment », tandis que l’idiome « couper/conclure » est particulièrement lié à l’alliance. Le texte français ne devrait pas imposer sans nécessité que le relatif reprenne exclusivement « alliance ».
  - severity: low
