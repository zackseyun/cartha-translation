  text: לְ/עָבְרְ/ךָ֗ בִּ/בְרִ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/בְ/אָלָת֑/וֹ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כֹּרֵ֥ת עִמְּ/ךָ֖ הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: fr
  text: afin que tu entres dans l’alliance de Yahweh, ton Dieu, et dans son serment, que Yahweh, ton Dieu, conclut avec toi aujourd’hui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupe avec toi aujourd’hui » ; « couper une alliance » est une expression hébraïque signifiant « conclure une alliance ». Le mot rendu par « serment » peut aussi désigner une malédiction, ou un serment assorti de malédictions.'
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: afin que tu entres
  rationale: L’infinitif construit précédé de ל exprime ici le but. Avec בְּרִית, le verbe עבר évoque l’entrée dans les obligations de l’alliance, non un déplacement matériel.
- source_word: בִּבְרִית
  choice: dans l’alliance
  rationale: En français, « entrer dans une alliance » rend naturellement la préposition ב et l’expression hébraïque dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom personnel employé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier de deuxième personne est rendu directement par le possessif « ton ».
- source_word: וּבְאָלָתוֹ
  choice: ainsi que dans le serment qu’elle comporte
  rationale: אָלָה désigne un serment pouvant inclure des sanctions ou des malédictions. « Serment » convient au texte principal, tandis que la note conserve la nuance de malédiction. Le rattachement à l’alliance donne une formulation française fluide.
- source_word: כֹּרֵת עִמְּךָ
  choice: conclut avec toi
  rationale: 'Littéralement « coupe avec toi » : כרת ברית est l’expression hébraïque consacrée pour conclure une alliance. Le présent rend la valeur actuelle du participe dans la cérémonie décrite.'
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne et direct de l’adverbe temporel hébreu.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh ton Dieu
  alternative: le SEIGNEUR ton Dieu
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom propre dans la formule d’alliance.
- issue: Portée de אָלָה
  choice: le serment qu’elle comporte
  alternative: la malédiction qui l’accompagne
  rationale: Le mot peut désigner un serment assorti de sanctions. Le texte principal retient le sens plus large de « serment », sans effacer la dimension de malédiction, signalée en note.
- issue: Portée du relatif אֲשֶׁר
  choice: alliance que Yahweh ton Dieu conclut
  alternative: serment que Yahweh ton Dieu établit
  rationale: L’idiome כרת est particulièrement associé à בְּרִית (« conclure une alliance »). La reprise de « alliance » produit un français clair sans nier que le serment fasse partie intégrante de l’acte d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le tutoiement singulier du texte hébreu et le caractère solennel de la formule d’alliance, tout en évitant le calque opaque « couper une alliance » dans le texte principal.
