  naturalness: Le français est globalement naturel et le registre convient. « Entrer dans l’alliance » et « conclure une alliance » sont clairs et dignes. La phrase révisée évite l’enchaînement quelque peu lourd « serment qu’elle comporte, alliance que ».
  terminology: « Yahweh », « alliance », « serment » et « aujourd’hui » conviennent. La note doit présenter la valeur de אָלָה comme une possibilité lexicale (« malédiction » ou serment comportant des malédictions), sans développer comme si les sanctions étaient explicitement détaillées dans ce verset.
