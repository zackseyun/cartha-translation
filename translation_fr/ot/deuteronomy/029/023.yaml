  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: fr
  text: 'Et toutes les nations diront : « Pourquoi Yahweh a-t-il agi ainsi envers ce pays ? Pourquoi cette grande colère ardente ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Et toutes les nations demanderont
  rationale: Dans ce contexte prophétique lié à l’alliance, le parfait précédé de וְ se rend naturellement au futur. Le verbe « demanderont » exprime en français idiomatique la prise de parole interrogative introduite par « Pourquoi ».
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici les peuples étrangers qui constateront le sort du pays ; « nations » conserve la portée collective et géopolitique du terme.
- source_word: עַל מֶה
  choice: Pourquoi
  rationale: L’expression demande la cause ou le motif. « Pourquoi » est son équivalent français direct et naturel.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh a-t-il traité ainsi
  rationale: כָּכָה signifie « ainsi ». Avec le pays comme objet indirect, « traiter ainsi ce pays » restitue naturellement l’idée de ce que Yahweh lui a fait, sans préciser davantage l’action.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé sous la forme « Yahweh », qui représente le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: לָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: אָרֶץ désigne ici le territoire placé sous le jugement de l’alliance. « Pays » convient à la perspective des nations qui observent sa dévastation.
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: Pourquoi cette grande colère ardente ?
  rationale: La seconde question garde la forme elliptique de l’hébreu. « Ardente » préserve l’image de chaleur portée par חֳרִי, tandis que « colère » rend le sens idiomatique de אַף.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Métaphore de la colère brûlante
  choice: grande colère ardente
  alternative: grande violence de sa colère
  rationale: Le choix retenu conserve l’image thermique de חֳרִי et l’intensification de גָּדוֹל, sans réduire l’expression à une abstraction.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation principale privilégie une syntaxe française naturelle tout en maintenant l’ellipse de la seconde question et la vive métaphore de la colère ardente.
