source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: fr
  text: Yahweh ne consentira pas à lui pardonner, car alors la colère de Yahweh et sa jalousie s’enflammeront contre cet homme. Toute la malédiction[a] écrite dans ce livre reposera sur lui, et Yahweh effacera son nom de dessous le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toute la malédiction prononcée sous serment » : le terme hébreu peut désigner une malédiction invoquée dans le cadre d’un serment d’alliance, et non une simple imprécation.'
    reason: Alternative lexicale préservant la nuance d’alliance de אָלָה.
lexical_decisions:
- source_word: יֹאבֶה
  choice: ne consentira pas
  rationale: Le verbe exprime la volonté ou le consentement, et non l’incapacité. « Ne consentira pas » conserve cette valeur volitive dans un français naturel et solennel.
- source_word: סְלֹחַ לוֹ
  choice: à lui pardonner
  rationale: סלח désigne couramment le pardon dans un cadre d’alliance. Cette formulation s’enchaîne naturellement avec « consentira ».
- source_word: כִּי אָז
  choice: car alors
  rationale: Cette expression garde à la fois la valeur explicative de כִּי et la valeur temporelle de אָז.
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: la colère de Yahweh … s’enflammeront
  rationale: L’hébreu évoque littéralement une colère qui fume. « S’enflammer » restitue en français actuel l’image vive d’une colère ardente sans employer la tournure peu naturelle « fumera contre ».
- source_word: קִנְאָתוֹ
  choice: sa jalousie
  rationale: Dans ce contexte de jugement lié à l’alliance, קנאה exprime la jalousie ou le zèle jaloux de Yahweh. « Jalousie » est l’équivalent direct et laisse intacte la tension théologique.
- source_word: בָּאִישׁ הַהוּא
  choice: contre cet homme
  rationale: La préposition ב prend ici une valeur hostile rendue naturellement par « contre ». Le masculin singulier de l’hébreu est conservé.
- source_word: וְרָבְצָה בוֹ
  choice: reposera sur lui
  rationale: רבץ signifie littéralement se coucher ou s’accroupir. Appliqué à la malédiction, « reposera sur lui » conserve l’idée d’une réalité qui vient demeurer sur quelqu’un.
- source_word: כָּל הָאָלָה
  choice: toute la malédiction
  rationale: Le singulier avec כָּל se comprend naturellement comme la totalité de la malédiction écrite. Une note précise la nuance de malédiction liée au serment d’alliance.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: écrite dans ce livre
  rationale: ספר peut désigner un livre ou un rouleau. « Livre » est clair, actuel et conforme à l’usage deutéronomique courant.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: effacera son nom
  rationale: מחה avec « nom » évoque l’effacement de la mémoire ou de la postérité. « Effacer son nom » conserve directement cet idiome biblique.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de dessous le ciel
  rationale: Cette expression hébraïque désigne la disparition de la terre des vivants. La formulation retenue conserve l’image spatiale du texte source.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Image anthropomorphique du jugement
  choice: Rendre l’image par « la colère … et sa jalousie s’enflammeront »
  alternative: « la colère … et sa jalousie fumeront » ou « la fureur … brûlera »
  rationale: Le rendu conserve l’image d’une colère ardente tout en évitant une collocation française obscure. Il n’ajoute aucune théorie sur les passions divines.
- issue: Référence masculine singulière
  choice: « cet homme »
  alternative: « cette personne »
  rationale: Le texte hébreu emploie explicitement le masculin singulier pour l’individu qui rompt l’alliance; la traduction ne neutralise pas cette forme.
- issue: Terminologie de la malédiction d’alliance
  choice: « toute la malédiction » avec une note sur sa valeur de malédiction prononcée sous serment
  alternative: « toute la malédiction liée au serment »
  rationale: Le texte principal demeure lisible, tandis que la note préserve la nuance juridique et cultuelle de אָלָה sans la transformer en interprétation exclusive.
- issue: Portée de כָּל הָאָלָה
  choice: « toute la malédiction »
  alternative: « chaque malédiction »
  rationale: Le nom hébreu est singulier et peut désigner collectivement l’ensemble de la malédiction consignée dans le livre. Le français « toute la malédiction » respecte ce nombre et cette portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste ferme et solennelle. Le nom « Yahweh » est conservé; l’image hébraïque de la colère ardente est rendue idiomatiquement, et le vocabulaire d’alliance est explicité seulement en note.
