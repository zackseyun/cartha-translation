source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: fr
  text: 'Alors ils diront : « Parce qu’ils ont abandonné l’alliance de Yahweh, le Dieu de leurs pères, qu’il a conclue avec eux lorsqu’il les a fait sortir du pays d’Égypte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Alors on dira
  rationale: Le verbe poursuit la réaction évoquée dans le contexte. Le singulier indéfini français « on dira » rend naturellement le pluriel hébreu à valeur générale, tandis que « alors » marque la progression du discours.
- source_word: עַל אֲשֶׁר
  choice: C’est parce que
  rationale: La locution introduit la cause du désastre. La tournure française répond naturellement à la question du verset précédent.
- source_word: עָזְבוּ
  choice: ont abandonné
  rationale: Le verbe exprime ici la désertion volontaire de l’alliance, et non un simple départ. « Abandonner » est actuel, clair et suffisamment fort.
- source_word: בְּרִית
  choice: alliance
  rationale: « Alliance » est le terme français consacré pour la relation engageante établie par Dieu et conserve la portée biblique du mot.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: le Dieu de leurs pères
  rationale: Cette formulation respecte la chaîne construite hébraïque et la référence masculine explicite à la lignée ancestrale.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: qu’il avait conclue avec eux
  rationale: L’hébreu dit littéralement « couper une alliance ». En français, on « conclut une alliance »; le plus-que-parfait situe clairement cet acte avant l’abandon évoqué.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: lorsqu’il les a fait sortir
  rationale: Le beth avec l’infinitif construit a ici une valeur temporelle. « Faire sortir » reflète précisément la valeur causative de הוציא.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette traduction conserve la mention complète du « pays » et sa résonance liée à l’Exode.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Expression patriarcale אֱלֹהֵי אֲבֹתָם
  choice: le Dieu de leurs pères
  alternative: le Dieu de leurs ancêtres
  rationale: « Pères » conserve la forme masculine et la formulation généalogique du texte hébreu, sans la neutraliser.
- issue: Rapport temporel de אֲשֶׁר כָּרַת עִמָּם
  choice: qu’il avait conclue avec eux
  alternative: qu’il a conclue avec eux
  rationale: Le relatif qualifie l’alliance abandonnée et renvoie à sa conclusion antérieure; le plus-que-parfait exprime ce rapport temporel naturellement en français sans modifier le contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale emphatique « C’est parce que… » prolonge naturellement la question précédente. Aucun archaïsme n’est employé; « alliance », « Yahweh » et « pères » préservent néanmoins la précision biblique et théologique.
