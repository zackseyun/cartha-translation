revisions:
- from: 'Alors on dira : « C’est parce qu’ils ont abandonné l’alliance de Yahweh, le Dieu de leurs pères, qu’il avait conclue avec eux lorsqu’il les a fait sortir du pays d’Égypte. »'
  to: 'Alors ils diront : « Parce qu’ils ont abandonné l’alliance de Yahweh, le Dieu de leurs pères, qu’il a conclue avec eux lorsqu’il les a fait sortir du pays d’Égypte. »'
  rationale: La révision conserve tous les choix lexicaux solides du projet, tout en employant « ils diront » pour préserver le pluriel référentiel et « a conclue » pour ne pas créer une antériorité non exprimée entre la conclusion de l’alliance et la sortie d’Égypte.
