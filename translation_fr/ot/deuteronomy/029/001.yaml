  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה אֶל כָּל יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כָּל אֲשֶׁר֩ עָשָׂ֨ה יְהוָ֤ה לְ/עֵֽינֵי/כֶם֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: fr
  text: 'Moïse convoqua tout Israël et leur dit[a] : « Vous avez vu tout ce que Yahweh a fait sous vos yeux, en Égypte, au pharaon, à tous ses serviteurs et à tout son pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre le pharaon, contre tous ses serviteurs et contre tout son pays ». Dans ce contexte, la préposition hébraïque peut être rendue de manière plus interprétative pour indiquer que les actes de Yahweh en Égypte étaient des jugements qui les frappaient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Dans ce contexte d’assemblée, קרא signifie appeler ou convoquer. « Convoqua » exprime clairement que Moïse rassemble Israël pour lui parler.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette expression collective désigne l’ensemble du peuple de l’alliance et se rend naturellement ainsi en français.
- source_word: רְאִיתֶם
  choice: vous avez vu
  rationale: L’accompli renvoie à ce dont les auditeurs ont été témoins et qui reste pertinent au moment du discours.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לְעֵינֵיכֶם
  choice: sous vos yeux
  rationale: Cette locution française naturelle préserve l’idée d’événements directement et publiquement constatés par les auditeurs.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: en Égypte
  rationale: En français moderne, « en Égypte » rend naturellement le lieu désigné par l’expression hébraïque « dans le pays d’Égypte », sans perte de sens.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: au pharaon, à tous ses serviteurs et à tout son pays
  rationale: La répétition de לְ désigne ceux que les actes de Yahweh ont touchés. La préposition « à » reste proche de la forme hébraïque et préserve l’ambiguïté quant à la nature exacte de ces actes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel du Dieu d’Israël sans le remplacer par un titre.
- issue: Valeur de la préposition לְ devant le pharaon, ses serviteurs et son pays
  choice: à
  alternative: contre
  rationale: Le contexte permet de comprendre ces actes comme des jugements dirigés contre l’Égypte, mais la préposition hébraïque elle-même est plus large. Le texte principal maintient cette ouverture, tandis que la note indique l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit-cadre, tandis que le passé composé dans le discours direct exprime l’expérience vécue encore pertinente. « Pharaon » prend l’article en français courant. La coordination conserve l’ampleur rhétorique de l’hébreu.
