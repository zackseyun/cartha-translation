source:
  edition: WLC
  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: fr
  text: de peur qu’il n’y ait parmi vous un homme ou une femme, un clan ou une tribu, dont le cœur se détourne aujourd’hui de Yahweh notre Dieu pour aller servir les dieux de ces nations ; de peur qu’il n’y ait parmi vous une racine produisant du poison et de l’absinthe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une racine produisant du fiel et de l’absinthe ». Le terme hébreu רֹאשׁ peut être rendu par « fiel » ou désigner plus largement une substance toxique ; son sens précis est discuté.'
    reason: Signaler l’alternative lexicale traditionnelle pour רֹאשׁ tout en préservant l’incertitude de son référent.
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure conserve la valeur d’avertissement et l’éventualité redoutée exprimées par la particule hébraïque, tout en restant naturelle dans un registre français digne.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: un homme ou une femme
  rationale: La traduction maintient la paire explicitement sexuée du texte hébreu.
- source_word: מִשְׁפָּחָה
  choice: clan
  rationale: Dans ce contexte social et tribal, le mot désigne un groupe de parenté plus large que la famille nucléaire moderne.
- source_word: שֵׁבֶט
  choice: tribu
  rationale: Le terme désigne ici sans ambiguïté une unité tribale d’Israël.
- source_word: לְבָבוֹ פֹנֶה
  choice: dont le cœur se détourne
  rationale: Le présent français rend naturellement le participe hébreu et conserve l’image du cœur qui abandonne son allégeance.
- source_word: מֵעִם יְהוָה אֱלֹהֵינוּ
  choice: de Yahweh notre Dieu
  rationale: La préposition marque l’éloignement de Yahweh, déjà exprimé en français par « se détourne de ».
- source_word: לָלֶכֶת לַעֲבֹד
  choice: pour aller servir
  rationale: Cette formulation exprime le mouvement et son but sans reproduire maladroitement la syntaxe hébraïque.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: les dieux de ces nations
  rationale: « Nations » rend directement גּוֹיִם, tandis que « ces » renvoie aux peuples évoqués dans le contexte immédiat.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: une racine produisant du poison et de l’absinthe
  rationale: La traduction conserve la métaphore de la racine et rend les deux termes nocifs sans ajouter explicitement le mot « fruit », absent de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de la métaphore de la racine
  choice: une racine produisant du poison et de l’absinthe
  alternative: une racine donnant un fruit empoisonné et amer
  rationale: La formulation retenue maintient l’image ouverte et inquiétante du texte sans préciser doctrinalement ce que représente la racine ni ajouter « fruit » au corps du verset.
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. La répétition de « de peur qu’il n’y ait » reproduit la structure d’avertissement du texte hébreu. Le point-virgule relie les deux dangers étroitement associés dans le verset.
