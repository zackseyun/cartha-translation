source:
  edition: WLC
  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: fr
  text: mais avec celui qui se tient ici avec nous aujourd’hui devant Yahweh notre Dieu, et avec celui qui n’est pas ici avec nous aujourd’hui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner des Israélites absents de l’assemblée, les générations futures, ou les deux.
    reason: Précision sur une ambiguïté référentielle volontairement préservée dans le texte.
lexical_decisions:
- source_word: כִּי
  choice: mais
  rationale: Dans la continuité du verset précédent (« ce n’est pas avec vous seuls »), la particule introduit ici l’élargissement contrastif des personnes concernées par l’alliance.
- source_word: אֶת אֲשֶׁר
  choice: avec celui qui
  rationale: La préposition « avec » est reprise implicitement de la formule d’alliance du verset précédent. Le singulier distributif hébreu est conservé naturellement en français.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: qui se tient ici avec nous
  rationale: La présence exprimée par יֶשְׁנוֹ est intégrée à la proposition avec le participe עֹמֵד; la formulation française reste concrète et fluide.
- source_word: עֹמֵד
  choice: se tient
  rationale: Rend le sens concret de « se tenir debout » dans l’assemblée, avec une tournure française digne et naturelle.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne et direct, répété dans les deux propositions comme dans l’hébreu.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend de manière concise la présence spatiale et cultuelle devant Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération courante du nom divin personnel, qui le distingue du titre « Seigneur ».
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Traduction directe de la forme avec suffixe possessif.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ
  choice: et avec celui qui n’est pas ici avec nous
  rationale: Le parallélisme avec la première proposition est préservé sans remplacer l’expression existentielle par une interprétation telle que « absent ».
theological_decisions:
- issue: Identité de celui qui « n’est pas ici avec nous aujourd’hui »
  choice: Ne pas préciser le référent dans le corps du texte.
  alternative: Les Israélites absents, les générations futures, ou les deux.
  rationale: L’hébreu laisse le référent ouvert; la traduction conserve cette ambiguïté plutôt que de trancher une question théologique ou historique.
translation_notes:
  register: Français international moderne, clair et digne. Le singulier distributif « celui qui » reflète la forme hébraïque, tandis que « se tient » conserve l’image concrète de la personne présente devant Dieu.
