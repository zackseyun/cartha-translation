translation_notes:
  register: Français international moderne, clair et digne. « En Égypte » est préféré au tour plus marqué « au pays d’Égypte ». La répétition hébraïque de עבר est partiellement variée par « sommes passés / avez traversées » pour préserver le sens avec une syntaxe française naturelle.
