  text: כִּֽי אַתֶּ֣ם יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יָשַׁ֖בְנוּ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֵ֧ת אֲשֶׁר עָבַ֛רְנוּ בְּ/קֶ֥רֶב הַ/גּוֹיִ֖ם אֲשֶׁ֥ר עֲבַרְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: fr
  text: Car vous savez comment nous avons vécu en Égypte et comment nous sommes passés au milieu des nations que vous avez traversées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que nous avons vécu en Égypte et ce que nous avons traversé au milieu des nations que vous avez traversées ». La construction hébraïque peut désigner soit la manière dont ces événements se sont déroulés, soit ce qui a été vécu.'
    reason: ambiguïté syntaxique et alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison explicative de l’affirmation précédente et conserve naturellement la valeur causale de l’hébreu.
- source_word: יְדַעְתֶּם
  choice: vous savez
  rationale: Le parfait renvoie ici à un savoir présent fondé sur l’expérience passée; le présent français l’exprime naturellement.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: comment nous avons vécu
  rationale: Rend idiomatiquement la circonstance connue des destinataires sans calquer l’hébreu de façon obscure.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: en Égypte
  rationale: Expression naturelle en français moderne; le mot אֶרֶץ n’exige pas ici le calque « au pays d’Égypte ».
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: et comment nous sommes passés
  rationale: Conserve le sens de déplacement de עבר tout en faisant écho à la première proposition circonstancielle.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: au milieu des nations
  rationale: Reflète directement בקרב sans transformer le passage en épreuve ou en souffrance.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Terme approprié au contexte de Deutéronome; « païens » introduirait une connotation religieuse non nécessaire.
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: que vous avez traversées
  rationale: Le verbe « traverser » exprime clairement le déplacement à travers ces nations et évite en français une répétition trop lourde de « passer ».
