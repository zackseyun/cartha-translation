  text: הַ֨/נִּסְתָּרֹ֔ת לַ/יהוָ֖ה אֱלֹהֵ֑י/נוּ וְ/הַ/נִּגְלֹ֞ת לָ֤ׄ/נׄוּׄ וּׄ/לְׄ/בָׄנֵׄ֨יׄ/נׄוּׄ֙ עַד עוֹלָ֔ם לַ/עֲשׂ֕וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: fr
  text: Les choses cachées appartiennent à Yahweh notre Dieu, mais les choses révélées nous appartiennent, à nous et à nos enfants[a], pour toujours, afin que nous mettions en pratique toutes les paroles de cette loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte des points extraordinaires au-dessus des mots rendus par « à nous et à nos enfants ». Leur portée exacte est incertaine; ils signalent une ancienne remarque scribale sans autoriser à supprimer ces mots du texte.
    reason: textual_note
  - marker: b
    text: Ou « de cette instruction ». Dans le Deutéronome, le terme désigne l’enseignement de l’alliance que Moïse présente à Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: les choses cachées
  rationale: Le participe passif substantivé de סתר désigne ce qui est caché ou soustrait à la connaissance humaine. « Les choses cachées » reste naturel et n’ajoute pas l’idée de mystères ésotériques.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: appartiennent à Yahweh notre Dieu
  rationale: La préposition ל marque ici l’appartenance. La forme française explicite le verbe sous-entendu et conserve le nom divin יהוה sous la forme « Yahweh ».
- source_word: וְהַנִּגְלֹת
  choice: mais les choses révélées
  rationale: Le participe passif de גלה répond à « les choses cachées ». « Mais » exprime naturellement le contraste porté par la conjonction dans ce contexte.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: nous appartiennent, à nous et à nos enfants
  rationale: Le verbe d’appartenance, sous-entendu en hébreu, est repris en français. בנים désigne ici les enfants ou descendants de l’ensemble d’Israël, et non exclusivement les fils.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée permanente; « pour toujours » est clair et courant en français moderne.
- source_word: לַעֲשׂוֹת
  choice: afin que nous mettions en pratique
  rationale: L’infinitif précédé de ל exprime le but. « Mettre en pratique » rend idiomatiquement l’obéissance demandée sans réduire le texte à une simple connaissance.
- source_word: אֵת כָּל דִּבְרֵי
  choice: toutes les paroles de
  rationale: La traduction conserve « paroles », correspondant à דִּבְרֵי et soulignant les prescriptions formulées de l’alliance.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: cette loi
  rationale: תורה peut désigner une instruction, mais, dans ce cadre deutéronomique, « loi » est une traduction naturelle et reconnue de l’enseignement d’alliance présenté par Moïse.
theological_decisions:
- issue: Portée des « choses cachées » et des « choses révélées »
  choice: Maintenir le contraste général entre ce qui appartient à Dieu et la révélation confiée à Israël en vue de l’obéissance.
  alternative: Limiter l’énoncé aux bénédictions et malédictions immédiates, ou en faire une définition exhaustive de tous les mystères divins.
  rationale: L’hébreu ne précise pas davantage le contenu de ces deux catégories. La traduction préserve donc l’ouverture et la tension du texte.
- issue: Fonction de la révélation
  choice: Rendre לַעֲשׂוֹת par « afin que nous mettions en pratique » afin de marquer le but de l’instruction révélée.
  alternative: Traduire plus littéralement par « pour faire », formulation moins naturelle et potentiellement obscure en français.
  rationale: Le verset associe explicitement ce qui est révélé à l’obéissance aux paroles de la Torah, sans affirmer que tout ce qui est caché serait nécessaire à cette obéissance.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « choses cachées » et « choses révélées » est conservé; « mettre en pratique » rend l’expression hébraïque de façon idiomatique tout en maintenant l’accent sur l’obéissance concrète.
