base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: fr
  text: Toute sa terre ne sera que soufre, sel et incendie[a] ; elle ne sera pas semée, rien n’y germera et aucune plante n’y poussera, comme après le bouleversement de Sodome et Gomorrhe, d’Adma et de Tseboïm, que Yahweh a bouleversées dans sa colère et sa fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soufre et sel, un embrasement » ; l’hébreu présente une proposition sans verbe dont la construction est abrupte.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: soufre, sel
  rationale: Ces noms désignent concrètement le soufre et le sel, associés ici à la dévastation et à la stérilité du pays.
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: Toute sa terre ne sera que … terre brûlée
  rationale: שְׂרֵפָה évoque l’action ou le résultat de brûler. « Terre brûlée » exprime naturellement en français l’état dévasté du territoire, tandis que « ne sera que » restitue la prédication nominale hébraïque dans son contexte prospectif.
- source_word: לֹא תִזָּרַע וְלֹא תַצְמִחַ
  choice: elle ne sera pas semée, rien n’y germera
  rationale: Le premier verbe est passif ; le second indique que la terre ne fait rien pousser. La formulation française évite l’artificialité de « elle ne fera pas germer » tout en conservant la progression.
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: aucune plante n’y poussera
  rationale: עֵשֶׂב peut désigner l’herbe ou, plus largement, la végétation. « Aucune plante » convient à l’image générale de stérilité.
- source_word: כְּמַהְפֵּכַת … אֲשֶׁר הָפַךְ
  choice: comme lors du bouleversement … que … a bouleversées
  rationale: La répétition de « bouleversement/bouleverser » conserve le lien lexical entre le nom et le verbe hébreux et l’image d’un renversement catastrophique.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: dans sa colère et sa fureur
  rationale: Les deux termes apparentés intensifient l’expression de la colère divine sans devoir reproduire littéralement l’image corporelle de אַף.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel. « Yahweh » le transmet directement au lieu de lui substituer un titre.
- issue: Valeur temporelle des verbes décrivant la terre
  choice: 'futur : « ne sera… ne germera… ne poussera »'
  alternative: présent descriptif
  rationale: Dans le cadre prophétique du passage, les imparfaits décrivent ce que les générations futures constateront. Le futur français garde cette orientation sans transformer les formes en impossibilité absolue.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La phrase conserve l’accumulation solennelle du texte hébreu, tout en allégeant les coordinations répétitives qui seraient lourdes en français. Les noms propres suivent les formes françaises usuelles : Sodome, Gomorrhe, Adma et Seboïm.'
