revisions:
- from: Toute sa terre ne sera que soufre, sel et terre brûlée[a] ; elle ne sera pas semée, rien n’y germera et aucune plante n’y poussera. Elle sera comme lors du bouleversement de Sodome et Gomorrhe, d’Adma et de Seboïm, que Yahweh a bouleversées dans sa colère et sa fureur.
  to: Toute sa terre ne sera que soufre, sel et incendie[a] ; elle ne sera pas semée, rien n’y germera et aucune plante n’y poussera, comme après le bouleversement de Sodome et Gomorrhe, d’Adma et de Tseboïm, que Yahweh a bouleversées dans sa colère et sa fureur.
  rationale: La révision rend la comparaison de dévastation de manière plus fidèle en français, évite l’idiome potentiellement interprétatif « terre brûlée », et adopte une forme française plus proche de l’hébreu pour Tseboïm. Elle conserve le futur contextuel, la répétition « bouleversement / bouleversées », le nom Yahweh et l’intensification « colère et fureur ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:04:56Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la liste « soufre, sel, brûlure », la stérilité du sol, les quatre villes et la double expression de la colère divine. Le futur convient au cadre discursif. Toutefois, « comme lors du bouleversement » transforme la comparaison avec le bouleversement en simple repère temporel, et « terre brûlée » est une explicitation plus étroite et idiomatiquement chargée de שְׂרֵפָה.
  naturalness: La formulation est globalement claire et d’un registre moderne soutenu. « Toute sa terre ne sera que soufre, sel et terre brûlée » reste cependant heurté, notamment par la répétition sémantique de « terre » et par l’absence d’article dans une phrase française courante.
  terminology: « Yahweh », « soufre », « sel », « colère » et « fureur » sont appropriés. Pour צְבֹיִים, « Tseboïm » est une translittération française plus proche de l’hébreu et plus usuelle dans les traductions françaises modernes que « Seboïm ».
  issues:
