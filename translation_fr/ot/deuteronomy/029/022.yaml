    issue: « comme lors du bouleversement »
    rationale: 'La préposition temporelle « lors de » ne reproduit pas exactement כְּמַהְפֵּכַת (« comme le bouleversement / comme lors du renversement ») : elle fait surtout de la catastrophe un moment de référence. « comme après le bouleversement » exprime en français l’état dévasté qui est comparé, sans modifier le sens.'
  - severity: low
    issue: « terre brûlée » pour שְׂרֵפָה
    rationale: L’expression est possible, mais elle répète « terre » et peut évoquer l’idiome politico-militaire moderne. « incendie » conserve sobrement le nom hébreu de brûlement et son caractère appositionnel.
  - severity: low
    issue: « Seboïm »
    rationale: « Tseboïm » reflète mieux l’initiale hébraïque צ et correspond à un usage français biblique moderne répandu.
