  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: fr
  text: 'Et lorsqu’il entendra les paroles de ce serment[a], il se bénira lui-même dans son cœur en disant : « Je serai en paix, même si je marche dans l’obstination de mon cœur », afin de balayer ce qui est abreuvé avec ce qui est assoiffé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette malédiction ». Le terme hébreu peut désigner un serment assorti d’une malédiction.
    reason: alternative_reading
  - marker: b
    text: Ou peut-être « afin de balayer la terre arrosée avec la terre desséchée », c’est-à-dire de tout détruire indistinctement. L’expression hébraïque est obscure.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: ce serment
  rationale: Le nom אָלָה désigne ici un serment assorti de sanctions. « Serment » convient à la formulation « les paroles de ce serment », tandis qu’une note conserve le sens possible de « malédiction ».
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: il se bénira lui-même dans son cœur
  rationale: La tournure conserve la valeur réflexive du hitpael de ברך ainsi que l’ironie de cette assurance intérieure, sans la réduire à une simple satisfaction personnelle.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: Je serai en paix
  rationale: שָׁלוֹם englobe la paix, le bien-être et la sécurité. Cette formulation française naturelle maintient l’étendue du terme et l’assurance présomptueuse du locuteur.
- source_word: שְׁרִרוּת לִבִּי
  choice: l’obstination de mon cœur
  rationale: שְׁרִרוּת exprime une volonté endurcie ou obstinée. « Obstination » restitue ce sens dans un registre actuel et digne.
- source_word: לְמַעַן
  choice: afin de
  rationale: La locution garde la nuance de but ou de résultat visé, sans trancher davantage la relation logique.
- source_word: סְפוֹת
  choice: emporter
  rationale: Dans ce contexte de sanction d’alliance, le verbe évoque le fait de faire disparaître ou de détruire. « Emporter » conserve cette force sans imposer l’image plus précise d’un balayage.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: ce qui est abreuvé avec ce qui est assoiffé
  rationale: Cette formulation reproduit autant que possible les adjectifs substantivés et l’opposition imagée de l’hébreu, sans décider s’il s’agit de personnes, de terres ou d’une expression proverbiale.
theological_decisions:
- issue: Portée de הָאָלָה dans le langage des sanctions de l’alliance
  choice: « serment » dans le texte principal
  alternative: « malédiction »
  rationale: Le mot peut désigner un serment comportant une malédiction. Le texte principal privilégie la forme de l’engagement entendu, tandis que la note rend explicite sa dimension punitive.
- issue: Interprétation de l’expression difficile הָרָוָה אֶת־הַצְּמֵאָה
  choice: 'Conserver la métaphore : « ce qui est abreuvé avec ce qui est assoiffé »'
  alternative: « la terre arrosée avec la terre desséchée », c’est-à-dire tout détruire indistinctement
  rationale: L’expression hébraïque est obscure et probablement proverbiale. La traduction principale en maintient l’ambiguïté réelle; la note présente une interprétation courante sans l’ériger en seule lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le mouvement conditionnel du verset et la voix intérieure du personnage. Les formulations légèrement inhabituelles « se bénira lui-même dans son cœur » et « ce qui est abreuvé avec ce qui est assoiffé » sont maintenues pour respecter la réflexivité et l’ambiguïté authentiques de l’hébreu; les notes facilitent la compréhension sans imposer une interprétation.
