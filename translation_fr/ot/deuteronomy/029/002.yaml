  text: הַ/מַּסּוֹת֙ הַ/גְּדֹלֹ֔ת אֲשֶׁ֥ר רָא֖וּ עֵינֶ֑י/ךָ הָ/אֹתֹ֧ת וְ/הַ/מֹּפְתִ֛ים הַ/גְּדֹלִ֖ים הָ/הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/002.yaml
  text: the great trials that your eyes saw[a], those great signs and wonders.
translation:
  language: fr
  text: les grandes épreuves que tes yeux ont vues[a], ces grands signes et prodiges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les grandes mises à l’épreuve ». Le sens est celui d’une épreuve qui teste ou révèle, et non d’une incitation au péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת
  choice: les grandes épreuves
  rationale: מַסּוֹת désigne ici des événements qui mettent à l’épreuve ou manifestent la puissance divine. « Épreuves » est naturel en français et n’évoque pas, comme pourrait le faire « tentations », une incitation au péché.
- source_word: הַגְּדֹלֹת
  choice: grandes
  rationale: L’adjectif souligne l’ampleur et l’importance des épreuves.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: que tes yeux ont vues
  rationale: Cette formulation conserve l’idiome hébreu et son insistance sur l’expérience directe du destinataire.
- source_word: הָאֹתֹת
  choice: signes
  rationale: « Signes » rend directement אוֹתֹת et convient aux actes divins visibles évoqués dans ce contexte.
- source_word: וְהַמֹּפְתִים
  choice: et ces grands prodiges
  rationale: « Prodiges » rend naturellement מֹפְתִים et préserve l’association biblique habituelle « signes et prodiges ».
- source_word: הַגְּדֹלִים
  choice: grands
  rationale: L’adjectif conserve l’accent hébreu sur la grandeur des prodiges.
- source_word: הָהֵם
  choice: ces
  rationale: Le démonstratif reprend avec insistance les signes et les prodiges dont il vient d’être question; en français, « ces » restitue naturellement cette valeur dans la proposition.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier conserve le suffixe hébreu de deuxième personne du singulier. L’expression concrète « tes yeux ont vues » est maintenue pour préserver l’insistance du texte source.
