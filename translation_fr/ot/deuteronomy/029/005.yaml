source:
  edition: WLC
  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: fr
  text: Vous n’avez pas mangé de pain et vous n’avez bu ni vin ni boisson forte[a], afin que vous sachiez que je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « boisson enivrante ». Le terme hébreu désigne largement une boisson fermentée et enivrante, sans indiquer nécessairement une boisson précise.
    reason: Alternative lexicale pour שֵׁכָר; la note préserve l’étendue du terme hébreu.
lexical_decisions:
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens premier est « pain ». Cette formulation concrète respecte l’hébreu, même si le mot peut parfois désigner plus largement la nourriture.
- source_word: אֲכַלְתֶּם
  choice: vous n’avez pas mangé
  rationale: Le passé composé rend naturellement en français le parfait hébreu qui récapitule l’expérience passée d’Israël.
- source_word: יַיִן
  choice: vin
  rationale: C’est le sens lexical courant, sans nécessité de généralisation dans ce contexte.
- source_word: שֵׁכָר
  choice: boisson forte
  rationale: Cette expression conserve la distinction avec le vin et désigne largement une boisson fermentée enivrante, sans la réduire à une boisson particulière.
- source_word: שְׁתִיתֶם
  choice: vous n’avez bu
  rationale: Le passé composé convient au regard rétrospectif du discours; la construction « ni… ni… » est idiomatique en français.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution exprime clairement la visée ou le résultat recherché tout en gardant un registre digne et naturel.
- source_word: תֵּדְעוּ
  choice: vous sachiez
  rationale: Le subjonctif exigé après « afin que » rend naturellement la proposition de but.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Cette traduction directe de la construction possessive exprime la relation entre Yahweh et Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Rapport exprimé par לְמַעַן
  choice: afin que vous sachiez
  alternative: de sorte que vous sachiez
  rationale: La formulation retient la valeur de but, tout en reconnaissant que la construction hébraïque peut aussi laisser percevoir un résultat; elle évite d’expliciter davantage la causalité.
translation_notes:
  register: Français international moderne, clair et digne. La coordination a été allégée pour une lecture naturelle. Le marqueur de note est placé après « boisson forte », le terme auquel la variante lexicale se rapporte.
