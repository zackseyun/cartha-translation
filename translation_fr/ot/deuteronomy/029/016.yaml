  text: וַ/תִּרְאוּ֙ אֶת שִׁקּ֣וּצֵי/הֶ֔ם וְ/אֵ֖ת גִּלֻּלֵי/הֶ֑ם עֵ֣ץ וָ/אֶ֔בֶן כֶּ֥סֶף וְ/זָהָ֖ב אֲשֶׁ֥ר עִמָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: fr
  text: et vous avez vu leurs objets abominables et leurs idoles[a] — bois et pierre, argent et or — qui se trouvaient chez eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est fortement méprisant et peut évoquer des « idoles-excréments ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: et vous avez vu
  rationale: Le wayyiqtol qal à la 2e personne du pluriel poursuit le rappel adressé par Moïse au peuple. Le passé composé est naturel en français moderne et le « et » maintient le lien avec le contexte précédent.
- source_word: שִׁקּוּצֵיהֶם
  choice: leurs objets abominables
  rationale: שִׁקּוּץ désigne une chose tenue pour abominable ou répugnante, particulièrement dans un contexte idolâtre. « Objets abominables » conserve la force évaluative et indique qu’il s’agit ici de réalités concrètes.
- source_word: גִּלֻּלֵיהֶם
  choice: leurs idoles[a]
  rationale: גִּלּוּלִים est un terme dépréciatif désignant les idoles. « Idoles » exprime clairement le référent; la nuance méprisante, difficile à rendre naturellement dans le corps du texte, est signalée en note.
- source_word: עֵץ וָאֶבֶן
  choice: bois et pierre
  rationale: Les noms précisent vraisemblablement la matière des objets idolâtres. La construction nominale française préserve la forme concise et appositionnelle de l’hébreu.
- source_word: כֶּסֶף וְזָהָב
  choice: argent et or
  rationale: Ces deux noms poursuivent l’énumération des matières. Les tirets encadrent l’ensemble « bois et pierre, argent et or » afin de rendre clairement son caractère appositionnel sans ajouter « faits de » au texte source.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: qui se trouvaient chez eux
  rationale: Le relatif renvoie naturellement aux objets cultuels présents chez les peuples évoqués au verset précédent. « Chez eux » rend idiomatiquement עִם sans suggérer que les Israélites possédaient ces idoles.
theological_decisions:
- issue: Rendu des deux termes péjoratifs relatifs à l’idolâtrie
  choice: « objets abominables » et « idoles »
  alternative: « abominations » et « idoles méprisables »
  rationale: L’hébreu emploie deux termes distincts et fortement dépréciatifs. Le texte français maintient cette distinction sans fusionner les expressions ni introduire une interprétation doctrinale supplémentaire; la note conserve la nuance particulièrement méprisante de גִּלּוּלִים.
- issue: Portée de la relative אֲשֶׁר עִמָּהֶם
  choice: La rattacher aux objets présents chez les peuples mentionnés précédemment
  alternative: « qui leur appartenaient » ou, plus littéralement, « qui étaient avec eux »
  rationale: Le contexte rattache le pronom aux nations traversées. « Qui se trouvaient chez eux » exprime la présence des objets sans trancher plus précisément la question de leur propriété.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient au rappel d’une expérience vécue; les tirets rendent lisible l’énumération appositionnelle des matières. La phrase conserve son lien syntaxique avec le contexte précédent.
