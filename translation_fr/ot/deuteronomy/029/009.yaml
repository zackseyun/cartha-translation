  variant: modern international French
source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: fr
  text: 'Vous vous tenez aujourd’hui, vous tous, devant Yahweh votre Dieu : vos chefs[a], vos tribus, vos anciens et vos responsables — tous les hommes d’Israël[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « vos têtes ». On peut aussi comprendre les deux termes ensemble : « les chefs de vos tribus ».'
    reason: alternative_reading
  - marker: b
    text: Littéralement « chaque homme d’Israël », expression employée ici dans un sens distributif.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: vous vous tenez
  rationale: Le participe niphal décrit l’assemblée qui se tient actuellement devant Dieu. La tournure pronominale française restitue naturellement cette position sans lui donner la force d’un impératif.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français courant qui conserve l’insistance temporelle du texte.
- source_word: כֻּלְּכֶם
  choice: vous tous
  rationale: Cette formulation rend explicitement la totalité du groupe interpellé et s’intègre naturellement à la phrase.
- source_word: לִפְנֵי
  choice: devant
  rationale: Terme concis et naturel pour exprimer le fait de se tenir en présence de Dieu dans le cadre de l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement le nom avec son suffixe possessif pluriel et préserve la formule d’alliance.
- source_word: רָאשֵׁיכֶם
  choice: vos chefs
  rationale: Le sens métaphorique de « têtes » désigne ici les dirigeants. « Chefs » est clair et digne en français, tandis qu’une note signale la construction alternative avec « tribus ».
- source_word: שִׁבְטֵיכֶם
  choice: vos tribus
  rationale: Le sens lexical ordinaire est conservé dans la liste, sans trancher silencieusement en faveur de la lecture « chefs de vos tribus ».
- source_word: זִקְנֵיכֶם
  choice: vos anciens
  rationale: Désignation française traditionnelle et toujours intelligible des responsables communautaires d’Israël.
- source_word: שֹׁטְרֵיכֶם
  choice: vos responsables
  rationale: Dans ce contexte administratif, le mot désigne des agents investis d’une fonction. « Responsables » évite la connotation exclusivement militaire d’« officiers » sans préciser indûment leur charge.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: Cette expression rend la valeur distributive de כֹּל אִישׁ tout en conservant la formulation masculine explicite de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme, nom personnel du Dieu d’Israël. Le conserver sous la forme « Yahweh » distingue ce nom d’un simple titre.
- issue: Portée genrée de כֹּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  alternative: tout Israël
  rationale: אִישׁ signifie ici littéralement « homme » et est employé distributivement. Le rendu choisi préserve cette donnée, sans nier que les versets suivants mentionnent aussi d’autres membres de l’assemblée.
- issue: Relation entre רָאשֵׁיכֶם et שִׁבְטֵיכֶם
  choice: vos chefs, vos tribus
  alternative: les chefs de vos tribus
  rationale: La suite et l’accentuation massorétique permettent de lire deux éléments coordonnés, mais une relation construite entre les deux mots est aussi défendable. Le texte principal suit la structure de la liste et la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe garde l’effet d’assemblée solennelle et l’énumération hébraïque, tout en évitant les archaïsmes et les termes administratifs trop précis.
