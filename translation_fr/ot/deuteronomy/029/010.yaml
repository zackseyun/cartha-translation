source:
  edition: WLC
  text: טַפְּ/כֶ֣ם נְשֵׁי/כֶ֔ם וְ/גֵ֣רְ/ךָ֔ אֲשֶׁ֖ר בְּ/קֶ֣רֶב מַחֲנֶ֑י/ךָ מֵ/חֹטֵ֣ב עֵצֶ֔י/ךָ עַ֖ד שֹׁאֵ֥ב מֵימֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: fr
  text: vos jeunes enfants[a], vos femmes et l’étranger qui se trouve au milieu de ton camp[b], depuis celui qui coupe ton bois jusqu’à celui qui puise ton eau,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos tout-petits ». Le terme hébreu טַף désigne surtout les enfants en bas âge ou les personnes à charge.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu גֵּר désigne un étranger établi au sein de la communauté, plutôt qu’un simple voyageur. L’hébreu passe ici de la deuxième personne du pluriel (« vos ») à celle du singulier (« ton »), en s’adressant probablement au peuple comme à une collectivité.
    reason: lexical_alternative; source_grammar
lexical_decisions:
- source_word: טַפְּכֶם
  choice: vos jeunes enfants
  rationale: טַף désigne particulièrement les petits enfants ou les personnes à charge. « Jeunes enfants » en conserve le sens concret sans l’ambiguïté française de « petits-enfants », qui peut désigner les descendants de la deuxième génération.
- source_word: נְשֵׁיכֶם
  choice: vos femmes
  rationale: Dans cette énumération de l’assemblée de l’alliance, נָשִׁים avec le suffixe possessif désigne naturellement les épouses. « Vos femmes » est idiomatique et digne en français biblique moderne.
- source_word: וְגֵרְךָ
  choice: et l’étranger qui réside
  rationale: גֵּר désigne un étranger établi au sein de la communauté, et non un simple voyageur. La proposition « qui réside » exprime clairement ce statut sans recourir à un terme administratif moderne.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: qui réside au milieu de ton camp
  rationale: La formulation conserve l’image spatiale de בְּקֶרֶב et représente explicitement la proposition relative introduite par אֲשֶׁר. Le passage de « vos » à « ton » reproduit le changement de nombre présent dans les suffixes hébreux.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: depuis celui qui coupe ton bois
  rationale: La tournure verbale rend le participe חֹטֵב et, avec « depuis… jusqu’à », conserve la construction de portée מִן… עַד.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: jusqu’à celui qui puise ton eau
  rationale: « Puiser » rend précisément le participe שֹׁאֵב et maintient le parallèle avec la coupe du bois.
theological_decisions:
- issue: Étendue sociale de l’assemblée de l’alliance
  choice: L’énumération inclut explicitement les jeunes enfants, les femmes, l’étranger résident et les travailleurs chargés de tâches subalternes.
  alternative: Limiter l’assemblée aux seuls Israélites de naissance ou comprendre les travailleurs comme de simples figures métaphoriques.
  rationale: Le sens direct de l’hébreu présente une assemblée socialement large. La traduction conserve cette portée sans lui ajouter de conclusion doctrinale.
- issue: Alternance entre la deuxième personne du pluriel et du singulier
  choice: Conserver « vos » pour les deux premiers éléments, puis « ton » à partir de « l’étranger » conformément aux suffixes hébreux.
  alternative: Uniformiser toute l’énumération au pluriel pour obtenir un français plus régulier.
  rationale: L’alternance est bien attestée dans le texte source et peut refléter le passage de l’assemblée plurielle à Israël envisagé collectivement. La conserver maintient la tension grammaticale sans en imposer l’interprétation.
translation_notes:
  register: Français international actuel, clair et soutenu. « Jeunes enfants » évite l’ambiguïté de « petits-enfants »; « l’étranger qui réside » rend le statut social du גֵּר de manière naturelle. La ponctuation et la virgule finale indiquent que ce fragment poursuit la phrase commencée au verset précédent et continuée au suivant.
