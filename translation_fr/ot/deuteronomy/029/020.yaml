  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: fr
  text: Yahweh le séparera de toutes les tribus d’Israël pour son malheur, conformément à toutes les malédictions[a] de l’alliance écrites dans ce livre de la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les malédictions liées au serment de l’alliance ». Le terme hébreu peut désigner les malédictions invoquées par serment dans le cadre d’une alliance.
    reason: Préserver la nuance de serment attachée à אָלוֹת sans donner à entendre que les malédictions elles-mêmes sont « jurées ».
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: le séparera
  rationale: Le hiphil de בדל avec suffixe masculin singulier exprime le fait de mettre quelqu’un à part ou de le séparer. « Le séparera de » reste naturel en français et conserve l’image d’une exclusion du peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, qui préserve ici le nom divin présent dans le texte hébreu.
- source_word: לְרָעָה
  choice: pour son malheur
  rationale: Dans ce contexte de jugement d’alliance, רָעָה désigne le malheur qui frappe l’homme, non le mal moral. Cette formulation rend clairement la destination funeste sans attribuer à Dieu une intention moralement mauvaise.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: de toutes les tribus d’Israël
  rationale: La préposition מן marque la séparation d’avec l’ensemble auquel l’homme appartenait.
- source_word: כְּכֹל
  choice: conformément à toutes
  rationale: כְּ exprime ici la conformité entre le jugement prononcé et les sanctions consignées dans le livre.
- source_word: אָלות הַבְּרִית
  choice: les malédictions de l’alliance
  rationale: אָלָה désigne ici les malédictions liées aux engagements jurés de l’alliance. « Malédictions » est clair dans le texte principal, tandis qu’une note conserve la nuance de serment.
- source_word: הַכְּתוּבָה
  choice: écrites
  rationale: Le participe passif féminin singulier s’accorde formellement avec le collectif אָלוֹת en hébreu; en français, le pluriel « écrites » s’accorde naturellement avec « malédictions ».
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: dans ce livre de la Loi
  rationale: סֵפֶר peut désigner un livre ou un rouleau. « Livre » est naturel, et « Loi » rend ici la Torah écrite mentionnée dans le contexte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de לְרָעָה dans le jugement divin
  choice: pour son malheur
  alternative: pour le mal ; pour le désastre
  rationale: Le contexte parle du sort funeste produit par les sanctions de l’alliance, et non du mal moral. « Pour son malheur » maintient la force punitive du passage sans résoudre au-delà du texte la question théologique du jugement.
translation_notes:
  register: 'Français international moderne, sobre et digne. La syntaxe suit l’ordre logique de l’hébreu : séparation d’avec les tribus, puis destination funeste. La majuscule à « Loi » signale ici le corpus de la Torah sans ajouter une interprétation confessionnelle.'
