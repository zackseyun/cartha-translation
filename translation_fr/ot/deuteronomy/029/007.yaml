  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: fr
  text: Nous avons pris leur pays et l’avons donné en héritage aux Rubénites, aux Gadites et à la demi-tribu de Manassé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: Nous avons pris
  rationale: Le qal narratif de לקח signifie normalement « prendre ». « Pris » reste naturel dans ce contexte militaire sans renforcer indûment le verbe par « conquis » ou « saisi ».
- source_word: אַרְצָם
  choice: leur pays
  rationale: אֶרֶץ désigne ici le territoire des rois vaincus. « Pays » exprime naturellement en français un territoire habité et gouverné; « terre » demeure possible, mais serait moins idiomatique avec le possessif dans ce contexte.
- source_word: וַנִּתְּנָהּ
  choice: et l’avons donné
  rationale: Le suffixe féminin renvoie à אֶרֶץ. La formulation conserve le sens direct de נתן et évite l’interprétation plus administrative « attribué ».
- source_word: לְנַחֲלָה
  choice: en héritage
  rationale: נַחֲלָה désigne un bien reçu en partage et transmis. « En héritage » est une expression française claire qui garde la portée foncière et historique du terme.
- source_word: לָראוּבֵנִי
  choice: aux descendants de Ruben
  rationale: Le gentilé singulier a un sens collectif. « Descendants de Ruben » rend ce collectif de façon naturelle et non ambiguë en français.
- source_word: וְלַגָּדִי
  choice: aux descendants de Gad
  rationale: Comme pour Ruben, le gentilé singulier représente collectivement le groupe tribal; cette formulation est claire en français courant.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: et à la demi-tribu de Manassé
  rationale: « Demi-tribu » correspond directement à חֲצִי שֵׁבֶט. Le gentilé הַמְנַשִּׁי est rendu idiomatiquement par le nom tribal « Manassé », sans perte de sens en français.
