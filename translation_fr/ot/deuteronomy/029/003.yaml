  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: fr
  text: Mais jusqu’à ce jour, Yahweh ne vous a donné ni un cœur pour connaître, ni des yeux pour voir, ni des oreilles pour entendre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא
  choice: Mais… ne… pas
  rationale: Dans le contexte, la conjonction introduit un contraste avec les actes que le peuple a vus; « mais » exprime naturellement cette valeur adversative en français.
- source_word: נָתַן
  choice: n’a pas donné
  rationale: Le passé composé présente l’absence de ce don comme une réalité qui demeure pertinente jusqu’au jour évoqué.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: לֵב לָדַעַת
  choice: un cœur pour comprendre
  rationale: « Cœur » préserve l’anthropologie hébraïque, où le cœur comprend l’intelligence et la disposition intérieure. Dans ce contexte de perception, « comprendre » rend naturellement la portée de ידע sans réduire le cœur au seul intellect.
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: des yeux pour voir
  rationale: Cette formulation conserve l’image concrète et le parallélisme hébreux.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: ni des oreilles pour entendre
  rationale: « Ni » est idiomatique dans une série régie par la négation et maintient l’image biblique de l’écoute perceptive.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Équivalent français naturel indiquant que la situation s’est prolongée jusqu’au moment présent du discours.
theological_decisions:
- issue: L’action divine dans le manque de compréhension d’Israël
  choice: Le texte affirme directement que Yahweh n’a pas donné au peuple la capacité intérieure de comprendre, de voir et d’entendre jusqu’à ce jour.
  alternative: Comprendre la phrase dans un sens permissif, ou comme une manière de décrire le seul échec humain.
  rationale: L’hébreu attribue explicitement le non-don à Yahweh. La traduction ne l’atténue pas, mais n’ajoute aucune explication systématique sur les rapports entre souveraineté divine et responsabilité humaine.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste naturelle tout en conservant les images hébraïques du cœur, des yeux et des oreilles. Le complément temporel est placé en tête pour éviter qu’il ne semble porter seulement sur « entendre ».
