base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: fr
  text: Alors Yahweh les a arrachés de leur terre dans sa colère[a], sa fureur et son grand courroux, et il les a jetés dans un autre pays, comme on le voit aujourd’hui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec colère » ; l’hébreu accumule ici trois termes exprimant une colère intense.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme en ce jour-ci » ; expression indiquant une situation encore manifeste aujourd’hui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: les a arrachés
  rationale: Le verbe נתשׁ exprime l’action d’arracher, notamment une plante ou un peuple de sa terre. « Arrachés » conserve l’image violente et reste naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מֵעַל אַדְמָתָם
  choice: de leur terre
  rationale: Dans ce contexte d’alliance et d’exil, אַדָמָה désigne naturellement le territoire dont le peuple est expulsé.
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: dans sa colère, sa fureur et son grand courroux
  rationale: Cette formulation maintient l’accumulation de trois termes proches et l’intensification portée par גָּדוֹל, sans les réduire à une seule idée générale.
- source_word: וַיַּשְׁלִכֵם
  choice: et il les a jetés
  rationale: « Jeter » rend directement la force du verbe שלך et convient à l’image du jugement et de la déportation.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: dans un autre pays
  rationale: Le mouvement vers un territoire étranger est exprimé naturellement en français par « dans un autre pays ».
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: 'Cette tournure rend le sens idiomatique de l’expression hébraïque : la situation demeure manifeste au moment où l’on parle.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom propre de l’alliance sans lui substituer un titre.
- issue: Accumulation des termes désignant la colère divine
  choice: sa colère, sa fureur et son grand courroux
  alternative: sa colère et sa grande fureur
  rationale: Le texte hébreu juxtapose intentionnellement trois termes. La traduction en conserve la tension rhétorique et l’intensité au lieu de les fusionner.
translation_notes:
  register: Français international moderne, clair et digne. « Arrachés » conserve l’image concrète de l’hébreu; « courroux », un peu plus soutenu, permet de distinguer les trois termes de colère sans alourdir excessivement la phrase.
