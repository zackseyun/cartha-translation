  text: וַ/תָּבֹ֖אוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ חֶ֠שְׁבּוֹן וְ/ע֨וֹג מֶֽלֶךְ הַ/בָּשָׁ֧ן לִ/קְרָאתֵ֛/נוּ לַ/מִּלְחָמָ֖ה וַ/נַּכֵּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: fr
  text: Quand vous êtes arrivés à cet endroit[a], Sihôn, roi de Heshbôn, et Og, roi du Bashân, sont sortis à notre rencontre pour nous faire la guerre, et nous les avons vaincus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vous êtes arrivés à cet endroit, et… ». La forme narrative hébraïque peut exprimer une simple succession ou recevoir ici une valeur temporelle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « nous les avons frappés » ; dans un contexte militaire, le verbe désigne souvent le fait de vaincre l’adversaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: Quand vous êtes arrivés
  rationale: Le wayyiqtol qal à la 2e personne du pluriel rapporte un événement passé adressé au peuple. « Quand » exprime naturellement le rapport temporel avec l’action suivante, sans exclure la simple coordination signalée en note.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: מָקוֹם signifie « lieu, endroit ». Avec un verbe de mouvement, « arriver en ce lieu » est naturel et garde le caractère déictique de הַזֶּה.
- source_word: וַיֵּצֵא
  choice: sont sortis
  rationale: Le qal de יצא signifie littéralement « sortir ». Le pluriel français s’accorde avec les deux rois constituant le sujet composé.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihôn, roi de Heshbôn
  rationale: Les noms propres sont translittérés selon un usage français clair; le titre en apposition est ponctué naturellement.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: et Og, roi du Bashân
  rationale: La construction parallèle est conservée; l’article hébreu de הַבָּשָׁן est rendu naturellement par « du ».
- source_word: לִקְרָאתֵנוּ
  choice: à notre rencontre
  rationale: Cette expression rend directement l’idée de venir ou sortir à la rencontre de quelqu’un, tandis que la proposition suivante précise l’intention hostile.
- source_word: לַמִּלְחָמָה
  choice: pour nous faire la guerre
  rationale: מִלְחָמָה désigne la guerre ou le combat. Dans ce contexte, cette formulation française exprime clairement le but militaire et inclut naturellement l’objet « nous » fourni par le contexte immédiat.
- source_word: וַנַּכֵּם
  choice: et nous les avons vaincus
  rationale: Le hiphil de נכה avec suffixe de 3e personne du pluriel signifie littéralement « nous les avons frappés » et, en contexte militaire, couramment « nous les avons vaincus ». Ce choix évite l’ambiguïté française de « abattus » quant à leur mise à mort.
