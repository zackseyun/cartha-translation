base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: fr
  text: afin qu’il fasse aujourd’hui de toi son peuple et qu’il soit lui-même ton Dieu, comme il te l’a dit et comme il l’a juré à tes pères, à Abraham, à Isaac et à Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but de l’engagement dans l’alliance et conserve naturellement la valeur finale de l’hébreu.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: qu’il fasse aujourd’hui de toi
  rationale: Le hiphil de קום exprime ici l’établissement d’Israël dans un statut d’alliance. Cette tournure française est naturelle et garde le sens causatif.
- source_word: לוֹ לְעָם
  choice: son peuple
  rationale: Rend avec concision l’appartenance exprimée par « pour lui comme peuple » dans la formule d’alliance.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: et qu’il soit lui-même ton Dieu
  rationale: Conserve l’insistance portée par וְהוּא et rend idiomatiquement la formule d’alliance en français.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: comme il te l’a déclaré
  rationale: Préserve la distinction entre la parole adressée à Israël et le serment mentionné ensuite, sans réduire explicitement דִּבֶּר à « promettre ».
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: et comme il l’a juré
  rationale: נשבע désigne explicitement l’action de jurer; le pronom reprend naturellement l’engagement énoncé.
- source_word: לַאֲבֹתֶיךָ
  choice: à tes pères
  rationale: Les hommes visés sont immédiatement identifiés comme Abraham, Isaac et Jacob; « pères » conserve donc la référence patriarcale précise.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: La répétition de « à » reflète les prépositions hébraïques tout en gardant une cadence française naturelle.
theological_decisions:
- issue: Formule de l’alliance
  choice: son peuple… ton Dieu
  alternative: un peuple pour lui… Dieu pour toi
  rationale: La formulation choisie exprime naturellement en français l’appartenance réciproque propre à l’alliance, sans en atténuer la portée.
- issue: Sens de דִּבֶּר dans la formule
  choice: déclaré
  alternative: promis
  rationale: « Déclaré » évite d’identifier sans nécessité la parole au serment mentionné dans la proposition suivante, tout en permettant qu’elle ait valeur de promesse.
- issue: Référence masculine de לַאֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Les trois patriarches étant nommés immédiatement, la référence est spécifiquement masculine plutôt que générique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier maintient l’adresse collective à Israël au singulier dans l’hébreu. La phrase conserve la solennité de la formule d’alliance sans calque lourd.
