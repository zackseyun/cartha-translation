  text: וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֛ם אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לֹֽא בָל֤וּ שַׂלְמֹֽתֵי/כֶם֙ מֵ/עֲלֵי/כֶ֔ם וְ/נַֽעַלְ/ךָ֥ לֹֽא בָלְתָ֖ה מֵ/עַ֥ל רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: fr
  text: Je vous ai conduits pendant quarante ans dans le désert ; vos vêtements ne se sont pas usés alors que vous les portiez, et ta sandale ne s’est pas usée à ton pied.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici du pluriel au singulier : littéralement, « ta sandale ne s’est pas usée de dessus ton pied ». Le singulier peut désigner Israël comme un tout collectif ou avoir une valeur distributive.'
    reason: Signaler le changement de nombre et la formulation littérale sans imposer une seule interprétation.
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: Je vous ai conduits
  rationale: Le hifil de הלך exprime ici le fait de faire marcher ou d’emmener. « Conduire » rend naturellement l’action de Dieu guidant Israël dans le désert.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inculte ou désertique. « Désert » est courant en français moderne et convient au cadre de l’errance d’Israël.
- source_word: בָּלוּ / בָלְתָה
  choice: ne se sont pas usés / ne s’est pas usée
  rationale: בלה décrit ici l’usure des vêtements et de la chaussure par l’usage. « S’user » est précis et idiomatique.
- source_word: שַׂלְמֹתֵיכֶם
  choice: vos vêtements
  rationale: Le terme désigne les habits de façon générale. « Vêtements » est naturel, digne et suffisamment large.
- source_word: מֵעֲלֵיכֶם
  choice: sur vous
  rationale: Littéralement « de dessus vous » ; avec le verbe « s’user », « sur vous » exprime naturellement que les vêtements ne se sont pas usés tandis qu’ils étaient portés.
- source_word: נַעַלְךָ
  choice: ta sandale
  rationale: Le nom et le suffixe sont au singulier. « Sandale » correspond au type de chaussure évoqué et préserve le changement de nombre du texte hébreu.
- source_word: מֵעַל רַגְלֶךָ
  choice: à ton pied
  rationale: Littéralement « de dessus ton pied ». En français, « à ton pied » conserve l’image de la sandale portée tout en évitant une tournure artificielle.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: La préposition « pendant » explicite naturellement la durée indiquée par l’hébreu.
theological_decisions:
- issue: Passage du pluriel (« vous », « vos vêtements ») au singulier (« ta sandale », « ton pied »)
  choice: Conserver le singulier dans la dernière proposition
  alternative: 'Harmoniser au pluriel : « vos sandales ne se sont pas usées à vos pieds »'
  rationale: L’hébreu passe explicitement des suffixes pluriels aux suffixes masculins singuliers. Ce singulier peut s’adresser à Israël comme à un tout collectif ou avoir une valeur distributive ; le conserver maintient cette ambiguïté sans l’aplanir.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme de la phrase hébraïque est conservé, ainsi que son passage marqué du pluriel au singulier.
