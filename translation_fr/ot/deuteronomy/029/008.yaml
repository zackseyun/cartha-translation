  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: fr
  text: Observez donc les paroles de cette alliance et mettez-les en pratique, afin d’agir avec sagesse dans tout ce que vous ferez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin de réussir dans tout ce que vous ferez » ou « afin de prospérer dans tout ce que vous entreprendrez ».'
    reason: 'Alternative lexicale : תַּשְׂכִּילוּ peut désigner une conduite avisée ou la réussite qui en résulte.'
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous observerez donc
  rationale: Dans un contexte d’alliance, שׁמר désigne l’observation fidèle d’obligations. « Observer » est naturel en français biblique moderne et « donc » rend ici le lien logique avec le contexte précédent.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: les paroles de cette alliance
  rationale: « Paroles » reste proche de דִּבְרֵי sans interpréter d’emblée celles-ci comme de simples « clauses » ou « stipulations ».
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: vous les mettrez en pratique
  rationale: Le pronom pluriel renvoie aux « paroles ». « Mettre en pratique » exprime idiomatiquement l’idée hébraïque de les faire ou de les accomplir.
- source_word: לְמַעַן
  choice: afin de
  rationale: Introduit naturellement en français le but ou le résultat visé.
- source_word: תַּשְׂכִּילוּ
  choice: agir avec sagesse
  rationale: Le hiphil de שׂכל peut évoquer une conduite avisée et, par extension, la réussite qui en découle. Le texte principal conserve directement la nuance de sagesse, tandis que la note signale celle de réussite.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: dans tout ce que vous ferez
  rationale: Rend la portée globale de כָּל אֲשֶׁר et la forme verbale future dans un français naturel.
theological_decisions:
- issue: Portée de la bénédiction d’alliance exprimée par תַּשְׂכִּילוּ
  choice: agir avec sagesse
  alternative: réussir dans tout ce que vous ferez
  rationale: Le terme associe potentiellement conduite avisée et issue favorable. Le texte principal privilégie la valeur directement liée à la sagesse sans supprimer la possibilité d’une réussite concrète, préservée en note, et sans importer une théologie moderne de la prospérité.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur conserve la forme de l’exhortation liée à l’alliance. La formulation « mettre en pratique » évite le calque peu naturel « les faire », tout en gardant le pluriel qui renvoie aux paroles.
