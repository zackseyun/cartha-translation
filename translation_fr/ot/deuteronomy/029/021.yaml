  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: fr
  text: 'La génération à venir — vos enfants qui viendront après vous — et l’étranger venu d’un pays lointain diront, lorsqu’ils verront les fléaux de ce pays et les maladies dont Yahweh l’a frappé[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les maladies que Yahweh a causées en lui »; « lui » désigne le pays. La formulation hébraïque personnifie le pays et emploie un verbe causatif signifiant « rendre malade ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: diront
  rationale: Bien que le verbe hébreu soit morphologiquement au singulier, il précède un sujet composé, « la génération… et l’étranger »; le pluriel est naturel en français.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: la génération à venir
  rationale: L’expression désigne une génération postérieure aux auditeurs, sans impliquer nécessairement la toute dernière génération.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: vos enfants qui viendront après vous
  rationale: בנים peut désigner les enfants ou descendants; cette formulation conserve l’image familiale et exprime naturellement la succession des générations.
- source_word: וְהַנָּכְרִי
  choice: et l’étranger
  rationale: נכרי désigne ici une personne étrangère à Israël, venue d’un autre pays.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: venu d’un pays lointain
  rationale: Rend clairement l’origine géographiquement éloignée de l’étranger.
- source_word: וְרָאוּ
  choice: lorsqu’ils verront
  rationale: La coordination hébraïque exprime ici la circonstance temporelle qui suscite la parole annoncée.
- source_word: מַכּוֹת
  choice: les fléaux
  rationale: Le terme évoque des coups ou calamités punitives; « fléaux » convient au contexte des malédictions de l’alliance.
- source_word: תַּחֲלֻאֶיהָ
  choice: les maladies
  rationale: Le pluriel désigne les maladies du pays et maintient la personnification d’une terre rendue malade.
- source_word: חִלָּה
  choice: a frappé
  rationale: Le piel de חלה signifie littéralement « rendre malade » et, par extension, « affliger »; « frapper » est naturel avec « maladies » tout en gardant la notion d’affliction causée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: בָּהּ
  choice: l’
  rationale: Le pronom renvoie au pays; la construction française « frapper le pays de maladies » rend idiomatiquement l’hébreu littéral « rendre malade en lui ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; la translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de בְּנֵיכֶם
  choice: vos enfants
  alternative: vos fils / vos descendants
  rationale: Le masculin pluriel hébreu peut désigner collectivement la postérité; « enfants » conserve la relation familiale sans limiter indûment le référent aux hommes.
- issue: Métaphore de la maladie appliquée au pays
  choice: les maladies dont Yahweh l’a frappé
  alternative: les maladies par lesquelles Yahweh l’a rendu malade
  rationale: Le choix conserve l’image d’un pays atteint de maladies, mais l’exprime dans un français naturel; la formulation littérale est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la longue progression du texte hébreu, avec des tirets pour identifier la génération à venir à ses descendants. Le deux-points maintient l’attente de la question formulée au verset suivant.
