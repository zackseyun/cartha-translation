  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre ce pays, pour faire venir sur lui toutes les malédictions écrites dans ce livre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère … s’enflamma
  rationale: Cette tournure conserve l’image hébraïque d’une colère qui brûle tout en restant naturelle et digne en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel employé dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בָּאָרֶץ הַהִוא
  choice: contre ce pays
  rationale: Avec l’expression désignant la colère, la préposition marque ici la cible de celle-ci. « Contre » exprime clairement cette orientation hostile.
- source_word: לְהָבִיא עָלֶיהָ
  choice: et il fit venir sur lui
  rationale: L’infinitif peut exprimer le but ou le résultat. La coordination française rend naturellement le résultat de la colère sans préciser plus que ne le fait le contexte; « lui » reprend « pays ».
- source_word: כָּל הַקְּלָלָה
  choice: toutes les malédictions
  rationale: Le singulier hébreu a ici une valeur collective. Le pluriel français restitue naturellement l’idée de totalité.
- source_word: הַכְּתוּבָה
  choice: écrites
  rationale: Le participe passif est rendu directement et conserve la portée écrite et juridique du texte d’alliance.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: dans ce livre
  rationale: « Livre » est le terme français courant et accessible dans ce contexte, sans imposer une forme matérielle particulière comme « rouleau ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance et ne lui substitue pas un titre.
- issue: Rapport entre la colère divine et la venue des malédictions
  choice: et il fit venir
  alternative: afin de faire venir
  rationale: L’infinitif hébreu permet une nuance de but ou de résultat. La coordination exprime le lien étroit sans trancher explicitement entre ces deux nuances.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. L’image vive de la colère qui s’enflamme est conservée; « pays » convient mieux que « terre » pour le territoire visé dans ce contexte.
