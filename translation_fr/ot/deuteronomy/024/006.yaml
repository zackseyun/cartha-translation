source:
  edition: WLC
  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: fr
  text: On ne prendra pas en gage les deux meules d’un moulin, ni même la meule supérieure, car ce serait prendre une vie en gage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car ce serait prendre en gage les moyens de subsistance d’une personne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: prendre… en gage
  rationale: Dans ce contexte juridique, חבל désigne la prise d’un bien comme garantie d’une dette. La répétition de « prendre… en gage » conserve celle du verbe hébreu et reste claire en français moderne.
- source_word: רֵחַיִם
  choice: les deux meules d’un moulin
  rationale: La forme duelle désigne l’ensemble formé par les deux meules. Cette formulation explicite le référent sans employer un terme technique peu courant.
- source_word: וָרָכֶב
  choice: ni même la meule supérieure
  rationale: 'רָכֶב désigne ici la meule mobile placée au-dessus. « Ni même » exprime naturellement la portée juridique : il est interdit de prendre l’ensemble, et même une seule pièce indispensable.'
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction dans un style juridique concis et digne.
- source_word: נֶפֶשׁ
  choice: une vie
  rationale: Ici, נֶפֶשׁ évoque concrètement la vie de la personne, menacée lorsqu’on lui retire un outil indispensable à la préparation de sa nourriture. La note conserve l’autre nuance contextuelle possible, celle des moyens de subsistance.
- source_word: הוּא
  choice: ce serait
  rationale: Le pronom renvoie à l’acte de prendre les meules en gage. La tournure française rend clairement l’idée que cet acte équivaudrait à prendre la vie elle-même en garantie.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans ce contexte juridique et social
  choice: la vie concrète, avec la possibilité contextuelle de désigner les moyens de subsistance
  alternative: l’âme ou la personne
  rationale: Le texte vise un gage qui priverait le débiteur d’un moyen essentiel de préparer sa nourriture. Traduire par « vie » préserve la force de l’hébreu sans introduire une affirmation doctrinale sur la nature de l’être humain; la note signale la nuance économique possible.
translation_notes:
  register: Français international moderne, clair et digne. La tournure impersonnelle « On ne prendra pas » convient à une prescription juridique. « Les deux meules d’un moulin » est plus immédiatement compréhensible que le seul pluriel « meules », tandis que « meule supérieure » conserve la précision matérielle du texte.
