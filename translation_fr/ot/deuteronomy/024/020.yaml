base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: fr
  text: Quand tu gauleras ton olivier, tu ne repasseras pas derrière toi[a] ; ce qui restera sera pour l’immigré[b], pour l’orphelin[c] et pour la veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Autrement dit, tu ne feras pas un second passage pour récolter les olives restées après le gaulage.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne ici un non-Israélite établi parmi les Israélites ; on peut aussi traduire par « résident étranger ».
    reason: cultural_note
  - marker: c
    text: Le terme peut désigner plus précisément un enfant privé de père.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans cette loi casuistique, כִּי introduit la situation dans laquelle la prescription s’applique ; « Quand » est naturel et conserve cette valeur.
- source_word: תַחְבֹּט זֵיתְךָ
  choice: tu gauleras ton olivier
  rationale: חבט désigne ici l’action de frapper les branches pour en faire tomber les olives. « Gauler un olivier » exprime précisément cette pratique agricole en français.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: tu ne repasseras pas derrière toi
  rationale: Dans ce contexte de récolte, le piel de פאר avec אַחֲרֶיךָ interdit un second passage destiné à recueillir ce qui est resté. La formulation conserve l’image idiomatique tout en restant compréhensible grâce à la note.
- source_word: לַגֵּר
  choice: pour l’immigré
  rationale: גֵּר désigne un non-Israélite établi durablement au sein de la communauté, juridiquement et socialement vulnérable. « Immigré » est actuel et plus précis ici que « étranger », qui peut désigner un simple visiteur.
- source_word: לַיָּתוֹם
  choice: pour l’orphelin
  rationale: יָתוֹם désigne l’enfant privé de protection parentale, souvent plus précisément de père dans la société ancienne. « Orphelin » est le terme français naturel, avec une note signalant la nuance possible.
- source_word: וְלָאַלְמָנָה
  choice: et pour la veuve
  rationale: « Veuve » est l’équivalent français direct de אַלְמָנָה dans ces lois de protection sociale.
- source_word: יִהְיֶה
  choice: ce qui restera sera
  rationale: Le sujet implicite renvoie aux olives laissées après le premier passage. L’explicitation minimale « ce qui restera » rend claire l’attribution juridique sans modifier son sens.
theological_decisions: []
