  text: לֹ֣א תַטֶּ֔ה מִשְׁפַּ֖ט גֵּ֣ר יָת֑וֹם וְ/לֹ֣א תַחֲבֹ֔ל בֶּ֖גֶד אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: fr
  text: Tu ne fausseras pas le droit de l’étranger résident ni de l’orphelin[a], et tu ne prendras pas en gage le vêtement d’une veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu traduit par « étranger résident » désigne ici un non-Israélite établi au sein d’Israël et bénéficiant de protections sociales et juridiques. Autres traductions possibles : « résident étranger » ou « étranger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: fausseras
  rationale: Dans ce contexte juridique, le hifil de נטה signifie faire dévier ou infléchir le droit. « Fausser le droit » exprime naturellement en français l’idée de porter atteinte à une décision ou à un droit juste.
- source_word: מִשְׁפַּט
  choice: le droit
  rationale: מִשְׁפַּט peut désigner la justice, le jugement ou le droit reconnu à quelqu’un. Ici, « le droit de » rend avec concision la protection juridique due aux personnes vulnérables.
- source_word: גֵּר
  choice: immigré
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté, et non un simple voyageur. « Immigré » est actuel et compréhensible, tandis que la note précise son statut de résident protégé.
- source_word: יָתוֹם
  choice: orphelin
  rationale: Le terme désigne une personne privée de la protection paternelle. « Orphelin » est la formulation française moderne la plus naturelle.
- source_word: תַחֲבֹל
  choice: prendras pas en gage
  rationale: Dans ce cadre légal, חבל signifie prendre un bien comme garantie d’une dette. « Prendre en gage » est précis et idiomatique.
- source_word: בֶּגֶד
  choice: vêtement
  rationale: בֶּגֶד est un terme général pour une pièce d’habillement. « Vêtement » évite de préciser sans preuve qu’il s’agit d’un manteau.
- source_word: אַלְמָנָה
  choice: d’une veuve
  rationale: Cette formulation naturelle en français conserve explicitement la protection légale accordée à la veuve.
theological_decisions:
- issue: Rendu de la catégorie sociale protégée גֵּר
  choice: immigré
  alternative: étranger résident ; résident étranger ; étranger
  rationale: Le mot vise un non-autochtone qui réside durablement parmi Israël et bénéficie d’une place reconnue dans son ordre social et juridique. « Immigré » communique ce statut en français courant sans le réduire à un étranger de passage ; la note conserve la nuance historique.
translation_notes:
  register: Français international moderne, direct et digne. Le futur à valeur injonctive (« Tu ne… pas ») conserve la forme législative du discours. La coordination « ni… et… » suit la structure hébraïque tout en restant naturelle en français.
