  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: fr
  text: Souviens-toi de ce que Yahweh, ton Dieu, a fait à Myriam en chemin, en sortant d’Égypte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir Nombres 12.1-15.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: Souviens-toi
  rationale: Impératif qal masculin singulier de זכר. « Souviens-toi » rend directement l’ordre adressé à chaque Israélite et conserve sa force d’exhortation.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: de ce que … a fait
  rationale: La construction introduit le contenu à garder en mémoire. Cette formulation est naturelle en français et reste proche de la syntaxe hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne masculine singulière est conservé, en accord avec l’impératif singulier.
- source_word: לְמִרְיָם
  choice: à Miriam
  rationale: Avec עשה, la préposition ל désigne ici la personne touchée par l’action. « A fait à Miriam » préserve cette relative indétermination sans préciser davantage la nature de l’acte.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: Expression française idiomatique correspondant à « sur le chemin », dans le contexte du voyage d’Israël.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: lorsque vous êtes sortis d’Égypte
  rationale: L’infinitif construit avec suffixe pluriel a une valeur temporelle. Le passé composé exprime naturellement en français la sortie d’Égypte envisagée comme événement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin personnel. Le translittérer préserve la distinction entre le nom propre et un titre.
- issue: Nature de ce que Dieu a fait à Miriam
  choice: a fait à Miriam
  alternative: a infligé à Miriam
  rationale: Le verset renvoie à Nombres 12, mais son expression reste générale. La traduction ne précise donc pas dans le corps du texte qu’il s’agit de son atteinte cutanée ou de son exclusion temporaire.
translation_notes:
  register: Français international moderne, sobre et digne. Le passage du singulier « Souviens-toi / ton Dieu » au pluriel « vous êtes sortis » reproduit le changement de nombre du texte hébreu.
