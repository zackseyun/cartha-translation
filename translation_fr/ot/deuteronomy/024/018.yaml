source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: fr
  text: Souviens-toi que tu as été esclave en Égypte et que Yahweh, ton Dieu, t’a racheté de là ; c’est pourquoi je t’ordonne de faire cela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Souviens-toi
  rationale: Le parfait qal à la deuxième personne du masculin singulier, précédé de la conjonction, a ici une valeur injonctive. En français, l’impératif rend naturellement cette force sans qu’un « et » initial soit nécessaire.
- source_word: כִּי
  choice: que
  rationale: 'La conjonction introduit le contenu du souvenir demandé : Israël doit se souvenir de sa condition passée.'
- source_word: עֶבֶד
  choice: esclave
  rationale: Le contexte égyptien met en avant l’asservissement d’Israël ; « serviteur » atténuerait cette réalité.
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: Rendu direct de l’expression hébraïque, sans ajout tel que « au pays d’Égypte ».
- source_word: וַיִּפְדְּךָ
  choice: t’a racheté
  rationale: Le verbe פדה exprime la délivrance obtenue par rachat et conserve ici sa portée théologique ; « t’a libéré » serait plus immédiatement explicite mais moins précis lexicalement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Traduction directe et idiomatique de la construction avec suffixe de deuxième personne du masculin singulier.
- source_word: מִשָּׁם
  choice: de là
  rationale: Cette expression renvoie simplement à l’Égypte et se rend naturellement ainsi en français.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: L’expression marque la conséquence éthique tirée du rachat d’Israël. « C’est pourquoi » est clair et naturel en français moderne.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: je t’ordonne
  rationale: Le pronom explicite et le participe présentent l’ordre avec insistance. Le présent français exprime naturellement sa force actuelle, sans lourdeur progressive.
- source_word: לַעֲשׂוֹת אֶת הַדָּבָר הַזֶּה
  choice: d’agir ainsi
  rationale: L’expression renvoie à la prescription précédente. « Agir ainsi » en restitue le sens de manière naturelle, tandis que « faire cette chose » serait maladroit en français contemporain.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie directement le tétragramme comme nom propre. « Yahweh » préserve cette fonction sans substituer un titre.
- issue: Rendu de עֶבֶד pour la condition d’Israël en Égypte
  choice: esclave
  alternative: serviteur
  rationale: La servitude imposée en Égypte constitue le fondement de l’exhortation éthique ; « esclave » en garde toute la force historique et sociale.
- issue: Portée de פדה
  choice: racheté
  alternative: libéré
  rationale: « Racheté » conserve l’image propre au verbe hébreu et sa résonance théologique, sans préciser un mécanisme que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste concise ; la répétition des deux propositions introduites par « que » clarifie le contenu du souvenir. « Agir ainsi » renvoie naturellement aux prescriptions des versets précédents.
