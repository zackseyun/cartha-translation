base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: fr
  text: Prenez garde, en cas d’affection de la peau[a], à observer très attentivement et à mettre en pratique tout ce que les prêtres lévites vous enseigneront. Comme je le leur ai ordonné, veillez à le mettre en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « lèpre ». Le terme hébreu désigne dans la Torah diverses affections ou anomalies, et non spécifiquement la maladie de Hansen moderne.'
    reason: 'Précision lexicale : éviter l’équivalence médicale trompeuse entre צָרַעַת et la lèpre moderne.'
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Prenez garde
  rationale: L’impératif nifal de שׁמר exprime ici une mise en garde solennelle. « Prenez garde » en conserve la force tout en restant naturel et digne en français.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: en cas d’affection de la peau
  rationale: נֶגַע désigne une atteinte, une marque ou une affection, tandis que צָרַעַת recouvre dans la Torah diverses affections rituelles et ne correspond pas précisément à la maladie de Hansen. Cette formulation évite une identification médicale anachronique.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: à observer très attentivement et à faire
  rationale: La traduction maintient les deux infinitifs hébreux, l’attention rigoureuse puis la mise en pratique, et rend explicitement l’intensif מְאֹד.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: tout ce que … vous enseigneront
  rationale: Le hifil de ירה signifie enseigner, instruire ou donner des directives. « Enseigneront » convient à l’instruction juridique sacerdotale sans en réduire la portée.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  rationale: Cette expression deutéronomique désigne les prêtres appartenant à Lévi. « Les prêtres lévites » est concis et naturel en français.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: Comme je le leur ai ordonné
  rationale: Le verbe à la première personne avec suffixe masculin pluriel renvoie à l’ordre donné par Moïse aux prêtres. Le pronom « le » reprend l’ensemble de l’instruction.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: veillez à le faire
  rationale: Cette formulation restitue la répétition de שׁמר et l’exhortation à mettre scrupuleusement en pratique les directives, sans produire une tournure française lourde.
theological_decisions:
- issue: Sens de צָרַעַת
  choice: affection de la peau
  alternative: lèpre
  rationale: Le terme hébreu englobe dans la Torah un ensemble plus vaste de phénomènes que la lèpre au sens médical moderne. Le choix retenu préserve la portée rituelle et légale sans imposer un diagnostic anachronique.
- issue: Identification de הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  alternative: les prêtres, les Lévites
  rationale: La construction est comprise comme la désignation deutéronomique des prêtres issus de Lévi, plutôt que comme la mention de deux groupes distincts.
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque de l’idée de vigilance est conservée par « Prenez garde » puis « veillez », tandis que la syntaxe est légèrement réorganisée pour rester naturelle. Le futur « enseigneront » exprime les directives applicables à chaque cas.
