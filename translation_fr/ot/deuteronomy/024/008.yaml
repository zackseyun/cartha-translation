  source_fidelity: 'Le sens global est fidèlement rendu : mise en garde au sujet de la צָרַעַת, observation attentive des prescriptions sacerdotales et mise en pratique. Cependant, la conclusion « veillez à le faire » affaiblit le pluriel implicite des directives et rend moins nettement la construction comparative « comme je le leur ai ordonné, ainsi... ».'
