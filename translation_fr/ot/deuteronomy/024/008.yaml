  terminology: « Affection de la peau » et la note sur « lèpre » évitent à juste titre l’anachronisme consistant à identifier צָרַעַת à la maladie de Hansen. « Prêtres lévites » est une désignation française claire et fidèle à l’expression deutéronomique.
