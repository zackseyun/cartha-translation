  rationale: La révision conserve les choix lexicaux fondés du projet, mais remplace deux formulations légèrement calquées par « mettre en pratique », expression française naturelle qui garde l’enchaînement hébreu entre observer scrupuleusement et agir. La reprise finale au singulier (« le ») vise l’ensemble de ce qui a été ordonné, tout en préservant la relation comparative introduite par « Comme ».
