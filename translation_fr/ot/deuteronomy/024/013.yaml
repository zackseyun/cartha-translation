reference: Deuteronomy 24:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: fr
  text: Tu devras absolument lui rendre le gage au coucher du soleil[a], afin qu’il puisse se coucher dans son manteau et te bénir. Cela sera pour toi justice devant Yahvé ton Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la garantie », ou « ce qui a été pris en gage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Cela te sera compté comme justice », ou « Ce sera pour toi un acte juste devant Yahvé ton Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: Tu devras absolument lui rendre
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’obligation. « devras absolument » en restitue l’emphase dans un français naturel.
- source_word: הַעֲבוֹט
  choice: le gage
  rationale: Le terme désigne un bien remis ou saisi comme garantie d’une dette. « gage » convient au contexte juridique et reste accessible.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: au coucher du soleil
  rationale: Cette expression idiomatique désigne le moment où le soleil se couche.
- source_word: וְשָׁכַב
  choice: afin qu’il puisse se coucher
  rationale: Dans ce contexte, la proposition indique le résultat visé par la restitution du vêtement avant la nuit.
- source_word: בְּשַׂלְמָתוֹ
  choice: dans son manteau
  rationale: שַׂלְמָה désigne ici un vêtement extérieur servant aussi de couverture pendant la nuit.
- source_word: וּבֵרֲכֶךָּ
  choice: et te bénir
  rationale: Le sujet implicite demeure l’emprunteur pauvre, qui bénit celui qui lui restitue son vêtement.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: Cela sera pour toi justice
  rationale: 'Cette formulation garde la concision et l’ambiguïté du texte hébreu : il peut s’agir d’une conduite juste ou de ce qui est reconnu comme justice pour la personne.'
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: devant Yahvé ton Dieu
  rationale: « devant » restitue la relation exprimée par לִפְנֵי, tandis que « Yahvé » représente directement le nom divin יהוה.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » transmet le nom propre dans une forme française reconnue, plutôt que de le remplacer par un titre.
- issue: Sens de צְדָקָה
  choice: Cela sera pour toi justice
  alternative: Cela te sera compté comme un acte juste
  rationale: Le rendu retenu préserve la tension entre la qualité morale de l’acte et son éventuelle reconnaissance comme justice devant Dieu, sans imposer une lecture comptable.
translation_notes:
  register: Français moderne, digne et accessible, avec tutoiement singulier conforme à l’adresse juridique hébraïque. La formulation conserve l’emphase du commandement et la portée ouverte de צְדָקָה.
