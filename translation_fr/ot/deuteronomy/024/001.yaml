source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: fr
  text: Si un homme prend une femme et l’épouse, et qu’elle ne trouve pas grâce à ses yeux parce qu’il a découvert chez elle quelque chose d’indécent[a], et qu’il rédige pour elle un acte de divorce, le lui remette en main et la renvoie de chez lui,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un fait indécent » ou « quelque chose de honteux ». L’expression hébraïque est ambiguë et a reçu plusieurs interprétations.
    reason: Préserver l’indétermination lexicale de עֶרְוַת דָּבָר sans imposer un motif précis de divorce.
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: כִּי introduit ici le cas hypothétique d’une loi casuistique. « Si » fait clairement entendre que la proposition conditionnelle se poursuit au-delà de ce verset.
- source_word: יִקַּח אִישׁ אִשָּׁה וּבְעָלָהּ
  choice: un homme prend une femme et l’épouse
  rationale: « Prend une femme » conserve l’idiome hébreu, tandis que « l’épouse » exprime naturellement l’entrée dans la relation conjugale sans suggérer une idée trompeuse de possession.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: elle ne trouve pas grâce à ses yeux
  rationale: Cette formulation conserve l’image hébraïque tout en restant claire dans un registre biblique moderne.
- source_word: כִּי מָצָא בָהּ
  choice: parce qu’il a découvert chez elle
  rationale: כִּי donne ici le motif invoqué dans le scénario juridique. « Découvert chez elle » rend le parfait מָצָא et la préposition בְּ sans surinterpréter la nature du fait.
- source_word: עֶרְוַת דָּבָר
  choice: quelque chose d’indécent
  rationale: L’expression est difficile et indéterminée. Cette traduction demeure compréhensible sans préciser indûment la nature exacte de l’indécence.
- source_word: סֵפֶר כְּרִיתֻת
  choice: un acte de divorce
  rationale: Il s’agit d’un document juridique attestant la rupture du mariage. « Acte de divorce » est concis et naturel en français contemporain.
- source_word: וְנָתַן בְּיָדָהּ
  choice: le lui remet en main
  rationale: La traduction conserve le geste concret et procédural exprimé par l’hébreu.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: la renvoie de chez lui
  rationale: « Renvoie » exprime l’éloignement légal, et « de chez lui » restitue la dimension spatiale de מִבֵּיתוֹ dans un français naturel.
theological_decisions:
- issue: Le verset commande-t-il le divorce ou ouvre-t-il le cas conditionnel d’une loi ?
  choice: Le rendre comme le début d’un scénario juridique conditionnel, dont la proposition principale vient plus loin.
  alternative: Le formuler comme une permission ou une prescription de divorcer dans les circonstances décrites.
  rationale: La syntaxe de Deutéronome 24.1-4 présente une longue protase casuistique. Le verset 1 ne commande donc pas à l’homme de divorcer. La formulation conditionnelle et la virgule finale préservent cette structure sans anticiper sa résolution.
- issue: Nature précise de עֶרְוַת דָּבָר
  choice: 'Conserver une formulation générale et ambiguë : « quelque chose d’indécent ».'
  alternative: Préciser une faute sexuelle déterminée, l’adultère ou un autre motif particulier.
  rationale: L’hébreu ne désigne pas sans équivoque une faute précise. Une traduction plus spécifique trancherait une question interprétative que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle est maintenue, avec une virgule finale, afin de signaler que la phrase juridique se poursuit dans les versets suivants. Le marqueur de note est placé immédiatement après l’expression ambiguë qu’il explique.
