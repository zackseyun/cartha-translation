  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: fr
  text: Tu te tiendras dehors, et l’homme à qui tu fais un prêt[a] t’apportera le gage à l’extérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui a une dette envers toi ». L’expression hébraïque peut mettre l’accent soit sur l’acte du créancier qui prête, soit sur l’état d’endettement du débiteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: dehors
  rationale: Le terme désigne l’extérieur de la maison. « Dehors » est naturel en français moderne et convient à l’interdiction implicite faite au créancier d’entrer chez le débiteur.
- source_word: תַּעֲמֹד
  choice: tu resteras
  rationale: Le verbe עמד signifie littéralement « se tenir debout » ou « rester ». Ici, le commandement porte surtout sur le fait de demeurer dehors pendant que le débiteur va chercher le gage.
- source_word: וְהָאִישׁ
  choice: et l’homme
  rationale: איש désigne ici un homme dans la formulation particulière de cette loi; le rendu conserve le genre du texte hébreu.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: à qui tu fais un prêt
  rationale: L’expression décrit la relation entre créancier et débiteur et peut mettre l’accent soit sur l’acte de prêter, soit sur l’endettement. Le texte principal adopte une formulation naturelle centrée sur le prêt, tandis que la note conserve l’autre lecture.
- source_word: יוֹצִיא
  choice: t’apportera
  rationale: Le hifil de יצא signifie « faire sortir ». Avec הַחוּצָה, « t’apportera … dehors » exprime naturellement le déplacement de l’intérieur vers le créancier.
- source_word: אֵלֶיךָ
  choice: t’
  rationale: La préposition indique un mouvement en direction du créancier; elle est rendue idiomatiquement par le pronom complément dans « t’apportera ».
- source_word: הָעֲבוֹט
  choice: le gage
  rationale: עבוט désigne un bien remis en garantie d’une dette. « Gage » est concis, courant dans le registre juridique biblique et moins technique que « bien donné en garantie ».
- source_word: הַחוּצָה
  choice: dehors
  rationale: La forme directionnelle signifie « vers l’extérieur ». « Dehors » conserve explicitement le mouvement hors de la maison, malgré la répétition voulue avec le début du verset.
theological_decisions:
- issue: Ambiguïté de נֹשֶׁה בוֹ entre l’activité du créancier et l’état du débiteur
  choice: à qui tu fais un prêt
  alternative: qui a une dette envers toi
  rationale: Les deux nuances sont possibles. Le texte principal suit le contexte immédiat du prêt et du gage, sans effacer l’autre valeur, signalée en note.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement législatif au singulier conforme à l’adresse hébraïque. « Tu resteras dehors » rend la force pratique de עמד sans imposer l’idée que le créancier doive nécessairement rester debout. La répétition de « dehors » préserve la structure spatiale du verset.
