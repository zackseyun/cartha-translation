  verdict: revise
  source_fidelity: 'Le sens juridique de l’hébreu est globalement bien rendu : l’homme suivant éprouve de la haine envers la femme, rédige le document de divorce, le lui remet, la renvoie de sa maison, ou meurt. Toutefois, « le dernier homme » peut en français suggérer le dernier homme au sens absolu, alors que הָאַחֲרוֹן désigne ici l’homme ultérieur dans la séquence matrimoniale.'
  naturalness: « L’autre homme » est plus idiomatique et plus clair dans ce contexte. « La déteste » rend directement le qatal de שׂנא sans introduire l’idée aspectuelle supplémentaire d’un commencement que comporte « la prend en haine ». « Le remet entre ses mains » conserve concrètement l’image hébraïque et évite la nuance administrative moderne de « en main propre ».
  terminology: « Acte de divorce » est un bon équivalent moderne de סֵפֶר כְּרִיתֻת. « Prise pour femme » conserve convenablement l’idiome matrimonial hébreu. Les notes sont ajustées pour ne pas présenter « avec lui » comme une composante à traduire littéralement de façon nécessaire.
