base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: fr
  text: et que l’autre homme la déteste[a], rédige pour elle un acte de divorce[b], le remet entre ses mains et la renvoie de chez lui, ou si l’autre homme qui l’a prise pour femme[c] vient à mourir —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « se met à la haïr ». La forme verbale hébraïque peut être rendue comme une étape de la succession juridique ; selon le contexte, elle peut aussi évoquer une hostilité qui se développe.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un document de rupture ». Il s’agit d’un écrit officiel qui met fin au mariage.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « qui l’a prise pour lui comme femme », c’est-à-dire qui l’a épousée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: la prend en haine
  rationale: Cette tournure conserve la force de שׂנא (« haïr, prendre en haine ») tout en exprimant naturellement, dans la séquence juridique, l’hostilité du second homme envers elle.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: le dernier homme
  rationale: אַחֲרוֹן signifie « dernier » ou « celui qui vient après ». « Le dernier homme » reprend le contraste juridique avec le premier mari sans remplacer le nom hébreu « homme » par « mari ».
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: rédige pour elle un acte de divorce
  rationale: סֵפֶר désigne ici un document écrit et כְּרִיתֻת la rupture officielle du lien matrimonial. « Acte de divorce » est une formulation juridique claire et actuelle.
- source_word: וְנָתַן בְּיָדָהּ
  choice: le lui remet en main propre
  rationale: La formulation rend l’action procédurale concrète de placer le document dans sa main, dans un français naturel, sans supprimer l’idée de remise personnelle.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: la renvoie de chez lui
  rationale: שׁלח exprime ici le renvoi lié au divorce, tandis que מִבֵּיתוֹ indique explicitement qu’elle quitte la maison de l’homme.
- source_word: אוֹ כִי יָמוּת
  choice: ou si … vient à mourir
  rationale: La proposition introduit l’autre éventualité du cas juridique. « Si … vient à mourir » garde sa valeur conditionnelle et s’intègre naturellement à la longue phrase.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: qui l’a prise pour femme
  rationale: La traduction conserve l’idiome hébreu לקח + אשה, qui désigne le fait de prendre une femme en mariage, au lieu de le réduire au seul verbe « épouser ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par un tiret, car le verset fait partie d’une longue formulation juridique commencée auparavant et achevée au verset suivant. Les termes concrets de la procédure sont conservés sans archaïsme.
