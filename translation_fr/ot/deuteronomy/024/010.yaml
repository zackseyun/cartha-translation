  text: כִּֽי תַשֶּׁ֥ה בְ/רֵֽעֲ/ךָ מַשַּׁ֣את מְא֑וּמָה לֹא תָבֹ֥א אֶל בֵּית֖/וֹ לַ/עֲבֹ֥ט עֲבֹטֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: fr
  text: Si[a] tu prêtes quoi que ce soit à ton prochain, tu n’entreras pas dans sa maison pour prendre son gage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand tu prêtes quoi que ce soit à ton prochain ».'
    reason: כִּי peut introduire cette règle comme une éventualité (« si ») ou comme un cas attendu (« quand »).
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cette loi casuistique, כִּי introduit une situation envisagée. « Si » est naturel en français juridique, tandis que « quand » reste possible.
- source_word: תַשֶּׁה ... מַשַּׁאת מְאוּמָה
  choice: tu accordes un prêt quelconque
  rationale: Le hiphil de נשה et le nom apparenté מַשַּׁאת expriment l’octroi d’un prêt ou d’un crédit; מְאוּמָה en étend la portée à toute sorte de bien.
- source_word: בְרֵעֲךָ
  choice: à ton prochain
  rationale: רֵעַ désigne ici un autre membre de la communauté. « Prochain » conserve la dimension relationnelle du terme et appartient à un français biblique encore intelligible.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: tu n’entreras pas dans sa maison
  rationale: Dans ce contexte légal, l’inaccompli précédé de לֹא a une valeur prohibitive. La formulation française garde explicitement la référence à la maison.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: pour prendre son gage
  rationale: Le verbe עבט et le nom apparenté désignent la prise du bien remis en garantie. « Prendre son gage » reste précis sans suggérer une saisie violente.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement législatif cohérent. « Prêt quelconque » conserve la portée générale de l’hébreu; « gage » maintient le vocabulaire juridique sans technicité excessive.
