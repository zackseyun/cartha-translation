  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: fr
  text: Souviens-toi que tu as été esclave au pays d’Égypte ; c’est pourquoi je t’ordonne de faire cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « de faire cette chose ». Ou « d’accomplir cette instruction » ou « d’observer ce commandement ». L’expression hébraïque renvoie à l’instruction précédente concernant ce qu’il faut laisser aux personnes vulnérables.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Souviens-toi
  rationale: Dans ce contexte juridique, le parfait qal avec conjonction a une valeur d’exhortation ou d’ordre. L’impératif français exprime naturellement cette force ; l’enchaînement avec la loi précédente demeure clair dans le contexte.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce dont Israël doit se souvenir.
- source_word: עֶבֶד
  choice: esclave
  rationale: Dans le contexte égyptien, le mot désigne une condition d’asservissement et non un service ordinaire.
- source_word: הָיִיתָ
  choice: tu as été
  rationale: Le passé composé convient au français moderne pour évoquer une condition passée dont les conséquences motivent l’ordre présent.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: au pays d’Égypte
  rationale: Cette formulation conserve l’expression concrète de l’hébreu tout en étant idiomatique en français.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: L’expression marque la conséquence logique entre l’ancien asservissement d’Israël et le devoir présent.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: je t’ordonne
  rationale: Le pronom indépendant souligne le locuteur, tandis que le participe exprime l’acte présent de commander. La formulation française est directe, naturelle et suffisamment solennelle.
- source_word: לַעֲשׂוֹת
  choice: de mettre … en pratique
  rationale: Dans ce contexte légal, עשה signifie accomplir concrètement ce qui vient d’être prescrit ; cette tournure est plus naturelle que « faire cette chose ».
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: cette prescription
  rationale: דבר renvoie à l’instruction précédente concernant les produits laissés aux personnes vulnérables. « Prescription » conserve la portée normative sans réduire le terme à une simple parole ou à un objet indéfini.
