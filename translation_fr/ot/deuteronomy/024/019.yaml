  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: fr
  text: Quand tu moissonneras ton champ et que tu y oublieras une gerbe, tu ne retourneras pas la prendre. Elle sera pour l’étranger résidant[a], pour l’orphelin[b] et pour la veuve, afin que Yahweh, ton Dieu, te bénisse dans tout le travail de tes mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’immigré », « le résident étranger » ou « l’étranger ». Le terme hébreu désigne une personne d’origine étrangère qui réside au sein d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « celui qui n’a plus de père ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: Quand tu moissonneras
  rationale: כִּי introduit ici un cas juridique concret. « Quand » convient à cette formulation, tandis que « moissonner » conserve précisément l’image de la coupe des céréales. La répétition hébraïque du verbe et du nom de même racine est rendue avec naturel en français.
- source_word: בְשָׂדֶךָ
  choice: ton champ
  rationale: Le complément est intégré directement à « moissonner » pour produire une phrase française naturelle sans perdre le cadre agricole.
- source_word: וְשָׁכַחְתָּ עֹמֶר בַּשָּׂדֶה
  choice: et que tu y oublieras une gerbe
  rationale: עֹמֶר désigne ici une gerbe de céréales coupées, non une unité de mesure. Le pronom « y » reprend clairement le champ sans répétition pesante.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: tu ne retourneras pas la prendre
  rationale: La formulation conserve à la fois l’idée de revenir et celle de récupérer la gerbe, dans un registre juridique clair.
- source_word: לַגֵּר
  choice: pour l’étranger qui réside parmi vous
  rationale: גֵּר désigne un non-Israélite installé au sein de la communauté. Cette formulation explicite le statut résident sans employer un terme administratif moderne ni réduire le sens à celui d’un simple inconnu.
- source_word: לַיָּתוֹם
  choice: pour l’orphelin
  rationale: « Orphelin » est le terme français courant et digne pour cette catégorie sociale vulnérable; l’alternative plus littérale liée à l’absence du père est signalée en note.
- source_word: וְלָאַלְמָנָה
  choice: et pour la veuve
  rationale: Traduction directe de la troisième catégorie vulnérable de la triade juridique.
- source_word: יִהְיֶה
  choice: Elle sera pour
  rationale: Le féminin reprend « une gerbe ». La construction indique que celle-ci est destinée aux personnes mentionnées sans imposer une notion technique de transfert de propriété.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution conserve la valeur de but ou de résultat de לְמַעַן et convient au registre de la phrase.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶיךָ
  choice: dans tout le travail de tes mains
  rationale: La traduction préserve l’image concrète des mains tout en restant idiomatique et compréhensible en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Statut social exprimé par גֵּר
  choice: l’étranger qui réside parmi vous
  alternative: l’immigré; le résident étranger; l’étranger
  rationale: Le choix maintient la dimension sociale et juridique d’une personne d’origine étrangère établie dans la communauté, tout en évitant de faire de גֵּר un simple étranger de passage.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques adressées à chaque membre d’Israël. La formulation conserve le caractère concret de la loi agricole et la triade des personnes socialement vulnérables.
