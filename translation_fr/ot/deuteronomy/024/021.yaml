  text: כִּ֤י תִבְצֹר֙ כַּרְמְ/ךָ֔ לֹ֥א תְעוֹלֵ֖ל אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: fr
  text: Quand tu vendangeras ta vigne, tu ne repasseras pas derrière toi pour ramasser ce qui reste[a] ; ce sera pour l’étranger résident[b], l’orphelin[c] et la veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « tu ne grappilleras pas après ton passage » ou « tu ne repasseras pas pour cueillir les grappes qui restent ». Le verbe hébreu désigne ici un second passage destiné à recueillir ce qui a été laissé.'
    reason: lexical_alternative
  - marker: b
    text: L’« étranger résident » est une personne d’origine étrangère établie parmi les Israélites ; on pourrait aussi traduire par « immigré » ou « résident étranger ».
    reason: cultural_note
  - marker: c
    text: Ou « l’enfant sans père ». Le terme hébreu désigne souvent une personne privée de père, qui assurait normalement sa protection et sa subsistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans cette loi, כִּי introduit une situation envisagée comme normale. « Quand » convient mieux que le conditionnel « si ».
- source_word: תִבְצֹר כַּרְמְךָ
  choice: tu vendangeras ta vigne
  rationale: Le verbe בָּצַר désigne précisément la récolte des raisins. « Vendanger sa vigne » est une formulation française naturelle et concise.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: tu ne repasseras pas derrière toi pour ramasser ce qui reste
  rationale: Dans ce contexte viticole, עולל évoque le ramassage des grappes restées après un premier passage, tandis que אַחֲרֶיךָ signifie littéralement « derrière toi » ou « après toi ». La formulation exprime clairement l’interdiction d’effectuer un second passage sans attribuer au propriétaire le rôle social du glaneur.
- source_word: לַגֵּר
  choice: pour l’étranger résident
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté, et non simplement un étranger de passage. « Étranger résident » conserve cette nuance juridique et sociale.
- source_word: לַיָּתוֹם
  choice: l’orphelin
  rationale: יָתוֹם désigne un enfant privé de père et, plus largement dans l’usage français, un orphelin. « Orphelin » est naturel et immédiatement compréhensible.
- source_word: וְלָאַלְמָנָה
  choice: et la veuve
  rationale: אַלְמָנָה signifie directement « veuve ».
- source_word: יִהְיֶה
  choice: ce sera
  rationale: Le singulier hébreu renvoie collectivement à ce qui reste de la vendange. « Ce sera » préserve la formulation simple de la prescription.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Vendanger » rend précisément l’action propre à la vigne. La tournure « repasser derrière toi » conserve l’image hébraïque tout en explicitant dans la suite le ramassage des restes. Les désignations des personnes vulnérables restent sobres et juridiquement intelligibles.
