- from: Lorsqu’un homme vient de se marier, il ne partira pas avec l’armée et aucune obligation ne lui sera imposée. Il sera libre de rester auprès des siens pendant un an[a] et il réjouira la femme qu’il a épousée.
  to: Lorsqu’un homme vient d’épouser une femme, il ne partira pas avec l’armée et aucune obligation ne lui sera imposée. Il sera libre de toute obligation pour son foyer pendant un an[a] et il réjouira la femme qu’il a épousée.
