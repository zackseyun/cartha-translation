  verdict: revise
  source_fidelity: La première partie rend fidèlement l’exemption de mobilisation militaire et de toute autre charge. Toutefois, « libre de rester auprès des siens » interprète לְבֵיתוֹ comme une obligation de demeurer physiquement auprès de sa famille, alors que l’hébreu exprime plus largement une exemption « pour son foyer / sa maison ».
  naturalness: Le français est globalement naturel et de registre juridique approprié. « Libre de toute obligation pour son foyer » est plus proche du texte tout en restant idiomatique en français international moderne.
  terminology: « Vient d’épouser une femme » rend naturellement le caractère récent de la nouvelle épouse. « Armée », « obligation », « foyer » et « réjouira » conviennent au contexte et préservent la portée non exclusivement militaire de la seconde exemption.
  issues:
  - severity: medium
    issue: « Il sera libre de rester auprès des siens » restreint le sens de l’exemption.
    rationale: Le verbe « rester » introduit une idée locative ou de présence continue qui n’est pas explicitement formulée par נָקִי יִהְיֶה לְבֵיתוֹ. La construction peut plutôt indiquer qu’il est exempté en faveur de son foyer. La note reconnaît cette ambiguïté, mais le texte principal ne devrait pas trancher aussi fortement.
