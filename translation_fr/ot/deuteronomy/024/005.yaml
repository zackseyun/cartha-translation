base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: fr
  text: Lorsqu’un homme vient d’épouser une femme, il ne partira pas avec l’armée et aucune obligation ne lui sera imposée. Il sera libre de toute obligation pour son foyer pendant un an[a] et il réjouira la femme qu’il a épousée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il sera exempt de toute charge chez lui pendant un an. » L’hébreu peut souligner soit son exemption en faveur de son foyer, soit le fait qu’il reste auprès des siens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: Lorsqu’un homme vient de se marier
  rationale: La construction introduit un cas juridique attendu. L’expression française rend naturellement l’idiome hébreu « prendre une femme » et comprend חֲדָשָׁה comme indiquant un mariage récent.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: il ne partira pas avec l’armée
  rationale: Cette formulation conserve l’image hébraïque et n’en restreint pas le sens au combat direct, צָבָא pouvant désigner l’armée ou le service militaire.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: et aucune obligation ne lui sera imposée
  rationale: La tournure exprime l’imposition d’une charge sans limiter celle-ci aux seules tâches militaires.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ
  choice: Il sera libre de rester auprès des siens
  rationale: נָקִי indique ici l’exemption de charges; לְבֵיתוֹ oriente cette liberté vers son foyer ou sa maisonnée. La formulation française exprime les deux aspects sans réduire בַּיִת au bâtiment.
- source_word: שָׁנָה אֶחָת
  choice: pendant un an
  rationale: Rend directement la durée prescrite.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: et il réjouira la femme
  rationale: 'Le piel de שׂמח est causatif: l’homme doit rendre sa femme joyeuse, et non simplement être heureux avec elle.'
- source_word: אֲשֶׁר לָקָח
  choice: qu’il a épousée
  rationale: Le français idiomatique exige ici « épouser » plutôt que le calque « prendre », tout en renvoyant clairement au mariage mentionné au début.
