  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: fr
  text: Tu lui paieras son salaire le jour même, avant le coucher du soleil, car il est pauvre et il en dépend pour vivre[a], de peur qu’il ne crie contre toi auprès de Yahweh et que tu ne te rendes coupable d’un péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers lui, il porte (ou lève) sa vie ». L’expression indique que le travailleur dépend vitalement de ce salaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: le jour même
  rationale: Littéralement « en son jour »; en français actuel, « le jour même » exprime naturellement l’exigence d’un paiement le jour où le salaire est dû.
- source_word: שְׂכָרוֹ
  choice: son salaire
  rationale: Désigne la rémunération gagnée par le travailleur; « salaire » est précis et courant.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: avant le coucher du soleil
  rationale: L’expression hébraïque interdit que le soleil se couche sur le salaire impayé. La formulation française explicite naturellement cette échéance sans modifier le sens.
- source_word: כִּי עָנִי הוּא
  choice: car il est pauvre
  rationale: עָנִי désigne ici une personne économiquement vulnérable; « pauvre » convient directement au contexte.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: sa vie en dépend
  rationale: Littéralement, il « porte/lève sa vie vers lui ». L’idiome exprime une dépendance vitale à l’égard du salaire; une note conserve l’image hébraïque.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Ainsi, il ne criera pas contre toi vers Yahweh
  rationale: La coordination peut présenter le résultat à éviter. « Crier contre toi vers Yahweh » conserve l’idée d’un appel adressé à Dieu contre l’oppresseur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, conformément à la politique de traduction fournie.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: tu ne te chargeras pas d’un péché
  rationale: Rend idiomatiquement l’idée qu’un péché se trouverait imputable à la personne, sans réduire חֵטְא à une notion seulement juridique de culpabilité.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: Portée de וְלֹא devant « il criera »
  choice: 'résultat à éviter : « Ainsi, il ne criera pas »'
  alternative: 'avertissement : « de peur qu’il ne crie »'
  rationale: La coordination hébraïque permet une nuance consécutive ou préventive. Le texte principal suit la coordination négative, sans transformer explicitement celle-ci en proposition de crainte.
- issue: Nature du péché final
  choice: « tu ne te chargeras pas d’un péché »
  alternative: « il y aurait du péché en toi »
  rationale: La formulation française exprime la responsabilité morale créée par l’acte tout en évitant une précision confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. Le tour juridique « Tu lui donneras » conserve la force prescriptive. La métaphore hébraïque difficile est rendue idiomatiquement dans le texte et signalée en note.
