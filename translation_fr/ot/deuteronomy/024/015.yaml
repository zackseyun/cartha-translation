    issue: Valeur de la clause « il ne criera pas »
    rationale: La formulation indicative « Ainsi, il ne criera pas » affaiblit l’avertissement juridique du texte. « De peur qu’il ne crie » exprime en français la conséquence redoutée et évitée, sans ajouter de doctrine.
  - severity: medium
    issue: Rendu de la proposition finale
    rationale: '« Tu ne te chargeras pas d’un péché » inverse la formulation: l’hébreu avertit que le péché serait en/à la charge du destinataire si le travailleur criait. « Tu te rendrais coupable d’un péché » maintient cette conséquence conditionnelle.'
  - severity: low
    issue: Préposition avec l’appel à Yahweh
    rationale: Dans ce contexte d’appel ou de plainte portée devant Dieu, « auprès de Yahweh » est plus idiomatique que « vers Yahweh ».
