  to: Tu lui paieras son salaire le jour même, avant le coucher du soleil, car il est pauvre et il en dépend pour vivre[a], de peur qu’il ne crie contre toi auprès de Yahweh et que tu ne te rendes coupable d’un péché.
  rationale: La révision conserve le paiement le jour même et l’échéance du coucher du soleil dans un français direct. Elle rend l’idiome de dépendance vitale de façon intelligible, tout en conservant l’image hébraïque en note. Elle restitue ensuite la force préventive de l’avertissement et la conséquence morale finale.
