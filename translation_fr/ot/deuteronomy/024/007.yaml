  revised_text: Si l’on trouve un homme qui a enlevé l’un de ses frères parmi les Israélites[a], l’a réduit en esclavage et l’a vendu, cet homme qui a commis l’enlèvement devra mourir. Tu feras ainsi disparaître le mal du milieu de toi.
