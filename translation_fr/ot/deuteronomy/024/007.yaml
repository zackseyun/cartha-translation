  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: fr
  text: Si l’on trouve un homme qui a enlevé l’un de ses frères parmi les Israélites[a], l’a réduit en esclavage et l’a vendu, cet homme qui a commis l’enlèvement devra mourir. Tu feras ainsi disparaître le mal du milieu de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne les autres membres du peuple d’Israël, et non pas seulement les frères biologiques.
    reason: cultural_note
lexical_decisions:
- source_word: יִמָּצֵא
  choice: l’on découvre
  rationale: Le nifal de מצא exprime ici la découverte judiciaire d’un délit; cette tournure est naturelle en français juridique.
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier de l’hébreu est conservé dans cette formulation légale.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: a enlevé
  rationale: L’expression signifie littéralement « voler une personne » et désigne ici un enlèvement; le passé composé s’intègre naturellement à la condition française.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: l’un de ses frères, parmi les Israélites
  rationale: « Frères » conserve le langage d’appartenance communautaire, tandis que « parmi les Israélites » en précise la portée.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: qu’il l’a réduit en esclavage
  rationale: Dans ce contexte, le hitpael de עמר indique que la victime est traitée comme un bien ou un esclave; cette formulation rend explicitement la réduction à l’état servile.
- source_word: וּמְכָרוֹ
  choice: et l’a vendu
  rationale: Rendu direct du verbe מכר avec son complément pronominal.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: cet homme qui a commis l’enlèvement devra mourir
  rationale: La formulation identifie clairement le « voleur » comme l’auteur de l’enlèvement et rend la prescription pénale sans suggérer une simple prédiction.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Tu élimineras ainsi le mal du milieu de toi
  rationale: Cette traduction conserve la formule judiciaire récurrente du Deutéronome ainsi que l’adresse collective au singulier.
theological_decisions:
- issue: Langage de parenté au sein d’Israël
  choice: Conserver « l’un de ses frères » et préciser « parmi les Israélites »
  alternative: « l’un de ses compatriotes israélites »
  rationale: Le choix maintient la métaphore familiale et communautaire du texte sans limiter « frères » aux frères biologiques.
- issue: Portée du verbe וְהִתְעַמֶּר
  choice: « réduit en esclavage »
  alternative: « exploité » ou « traité comme un esclave »
  rationale: Le contexte de l’enlèvement suivi de la vente favorise nettement l’idée d’asservissement, sans atténuer la gravité de l’acte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle est naturelle, le vocabulaire juridique demeure clair, et l’adresse collective au singulier est conservée dans la formule finale.
