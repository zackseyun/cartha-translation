  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: fr
  text: Et si cet homme est pauvre, tu ne te coucheras pas en gardant son gage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu ne te coucheras pas avec son gage » ; autrement dit, tu ne dois pas garder pendant la nuit l’objet remis en garantie d’un prêt.'
    reason: La formulation hébraïque est concise et peut sembler obscure en français sans préciser son sens juridique contextuel.
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: Introduit une condition qui prolonge directement la règle du verset précédent, tout en conservant la valeur connective de וְ.
- source_word: אִישׁ עָנִי הוּא
  choice: cet homme est pauvre
  rationale: Conserve le masculin singulier du texte hébreu et rend l’accent porté par הוּא de façon naturelle dans le contexte français.
- source_word: לֹא תִשְׁכַּב
  choice: tu ne te coucheras pas
  rationale: Rend le sens concret de שׁכב, « se coucher », et maintient l’idée de garder le gage pendant la nuit.
- source_word: בַּעֲבֹטוֹ
  choice: en gardant son gage
  rationale: 'עֲבוֹט désigne un objet remis ou pris comme garantie. Le complément « en gardant » explicite sobrement la valeur contextuelle de בְּ : il ne faut pas passer la nuit en possession du gage.'
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la deuxième personne du singulier propre à cette section légale et évite le terme plus technique « garantie » dans le corps du texte.
