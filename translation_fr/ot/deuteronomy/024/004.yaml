  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: fr
  text: Son premier mari, qui l’a renvoyée, ne doit pas la reprendre pour qu’elle redevienne sa femme après avoir été souillée[a], car ce serait une abomination devant Yahweh. Tu ne feras pas peser le péché sur le pays que Yahweh, ton Dieu, te donne en héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après qu’elle est devenue impure » ou « après qu’elle a été rendue impure ». L’hébreu dit « après avoir été souillée », sans préciser la nature exacte de cette souillure.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: son premier mari
  rationale: Dans ce contexte matrimonial, בַּעַל désigne le mari; « premier » maintient le contraste juridique avec le mari ultérieur.
- source_word: שִׁלְּחָהּ
  choice: qui l’a renvoyée
  rationale: Le verbe שׁלח signifie littéralement « envoyer, renvoyer ». Le contexte précédent établit qu’il s’agit d’un divorce, tandis que « renvoyée » conserve la formulation hébraïque.
- source_word: לָשׁוּב לְקַחְתָּהּ
  choice: la reprendre
  rationale: La construction exprime l’idée de la prendre de nouveau; « reprendre » est naturel en français et indique ici le remariage.
- source_word: לִהְיוֹת לוֹ לְאִשָּׁה
  choice: pour qu’elle redevienne sa femme
  rationale: Cette formulation française restitue l’idiome matrimonial et, avec « reprendre », rend explicite la reprise de la relation conjugale sans ajouter de motif.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: après qu’elle a été souillée
  rationale: Le passif de טמא exprime le fait d’être rendue impure ou souillée. « Souillée » préserve la force du terme ainsi que l’ambiguïté sur la nature exacte de cette souillure.
- source_word: תוֹעֵבָה
  choice: une abomination
  rationale: « Abomination » conserve la forte portée morale et cultuelle du terme תוֹעֵבָה.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » correspond directement à לִפְנֵי, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: Tu ne chargeras pas de péché le pays
  rationale: Le hiphil de חטא peut signifier faire pécher ou faire venir la culpabilité. Cette tournure garde le péché comme charge pesant sur le pays sans personnification maladroite.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: te donne en héritage
  rationale: « En héritage » rend naturellement נַחֲלָה et conserve la dimension d’attribution du pays dans l’alliance.
theological_decisions:
- issue: Sens de la souillure dans l’interdiction du remariage
  choice: Conserver « après qu’elle a été souillée » sans préciser le mécanisme de la souillure.
  alternative: « après qu’elle est devenue impure », « après avoir été sexuellement souillée » ou « après que le second mariage l’a rendue juridiquement inadmissible »
  rationale: Le passif hébreu de טמא ne précise pas ici si la souillure est rituelle, sexuelle, juridique ou relationnelle. La traduction maintient donc la tension du texte.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ou Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom d’alliance sans le remplacer par un titre.
- issue: Référent de « car c’est une abomination »
  choice: « car ce serait une abomination », rattaché à l’acte interdit de la reprendre
  alternative: Faire de la femme elle-même le sujet explicite de l’abomination
  rationale: Le pronom hébreu féminin peut grammaticalement reprendre la situation ou la chose décrite; le français neutre « ce » évite d’affirmer que la femme elle-même est qualifiée d’abomination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste ferme. Le tutoiement singulier correspond aux formes hébraïques adressées à Israël comme interlocuteur collectif.
