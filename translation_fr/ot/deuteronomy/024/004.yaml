    issue: Modalité de l’interdiction
    rationale: « Ne pourra pas » peut se lire comme une impossibilité factuelle ou une prédiction. Dans le contexte législatif, לֹא יוּכַל énonce une interdiction ; « ne doit pas » la restitue plus nettement.
  - severity: low
    issue: Tour temporel après la souillure
    rationale: « Après qu’elle a été souillée » est grammaticalement possible, mais « après avoir été souillée » est plus idiomatique et exprime clairement l’antériorité sans modifier l’ambiguïté du passif hébreu.
  - severity: low
    issue: Expression de la culpabilité du pays
    rationale: « Charger de péché le pays » est une tournure un peu raide. « Faire peser le péché sur le pays » est plus naturel et rend l’idée causative de culpabilité portée par le pays.
