  source_fidelity: 'La structure et les termes essentiels sont fidèlement rendus : « premier mari », le renvoi, l’interdiction de la reprendre, la souillure non définie, l’abomination devant Yahweh et la culpabilité du pays. Toutefois, le futur « ne pourra pas » affaiblit légèrement la valeur prescriptive de לֹא יוּכַל dans cette loi ; « ne doit pas » rend plus directement l’interdiction légale. La forme « après qu’elle a été souillée » est moins idiomatique pour un état antérieur accompli ; « après avoir été souillée » est à la fois naturel et fidèle.'
  naturalness: Le français est globalement clair et moderne. « Ne doit pas » convient mieux au registre juridique que « ne pourra pas », et « après avoir été souillée » fluidifie la phrase. « Charger de péché le pays » est compréhensible, mais « faire peser le péché sur le pays » est plus naturel tout en conservant l’image de culpabilité attachée au pays.
  terminology: « Yahweh », « abomination », « souillée » et « héritage » sont appropriés. La note conserve correctement l’ambiguïté de הֻטַּמָּאָה et ne réduit pas celle-ci à une interprétation sexuelle, rituelle ou juridique déterminée.
  issues:
