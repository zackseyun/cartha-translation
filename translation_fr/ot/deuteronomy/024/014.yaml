source:
  edition: WLC
  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: fr
  text: Tu n’opprimeras pas un salarié pauvre et démuni[a], qu’il soit l’un de tes frères ou un étranger qui réside dans ton pays, dans l’une de tes villes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tu n’exploiteras pas » ou « tu ne léseras pas » : le verbe hébreu englobe l’oppression économique.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans tes portes » : en hébreu, cette expression désigne les villes ou le territoire relevant de la communauté.'
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: opprimeras
  rationale: Le verbe עָשַׁק désigne une oppression ou une exploitation, souvent économique. « Opprimer » conserve toute la force et l’étendue de l’interdiction sans la limiter à une fraude précise.
- source_word: שָׂכִיר
  choice: travailleur salarié
  rationale: Le nom désigne une personne engagée contre rémunération. Cette formulation est claire en français moderne et évite les termes archaïques ou serviles.
- source_word: עָנִי וְאֶבְיוֹן
  choice: pauvre et démuni
  rationale: Les deux adjectifs soulignent ensemble la vulnérabilité économique du salarié. « Démuni » rend naturellement אֶבְיוֹן sans effacer le doublet hébreu.
- source_word: מֵאַחֶיךָ
  choice: l’un de tes frères
  rationale: La traduction garde l’image de parenté employée dans le cadre de l’alliance, plutôt que de l’expliciter par « Israélites ».
- source_word: מִגֵּרְךָ
  choice: un étranger établi chez toi
  rationale: גֵּר désigne un non-autochtone résidant durablement au sein de la communauté. Cette formulation rend la catégorie sociale ancienne sans importer une catégorie juridique moderne.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: dans ton pays
  rationale: La proposition situe l’étranger résident sur le territoire d’Israël; la formulation française reste concise et naturelle.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans l’une de tes villes
  rationale: L’expression signifie littéralement « dans tes portes », les portes représentant par métonymie les villes placées sous l’autorité de la communauté. Le sens idiomatique est donné dans le texte et l’image hébraïque en note.
theological_decisions:
- issue: Portée du terme de parenté אַחֶיךָ dans la loi de l’alliance
  choice: l’un de tes frères
  alternative: l’un de tes compatriotes israélites
  rationale: Le texte conserve le langage masculin de parenté du singulier hébreu et sa résonance d’alliance, sans ajouter dans le corps du verset une identification ethnique seulement implicite.
- issue: Statut social exprimé par גֵּר
  choice: un étranger établi chez toi
  alternative: un résident étranger
  rationale: Le choix présente cette personne comme un étranger intégré à la vie locale et protégé par la loi, sans l’assimiler à une catégorie contemporaine d’immigration.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse légale hébraïque à Israël. La syntaxe distingue sans les opposer le membre de la communauté d’alliance et l’étranger qui y réside.
