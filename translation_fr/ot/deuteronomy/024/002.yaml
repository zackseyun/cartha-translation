    issue: Ambiguïté de « sa maison »
    rationale: Le possessif français peut renvoyer au sujet féminin. Le suffixe hébreu de מִבֵּיתוֹ renvoie à l’homme (« de chez lui »).
  - severity: low
    issue: Formulation imprécise de la note littérale
    rationale: '« Littéralement : devient à un autre homme » omet la conjonction et présente une tournure française artificielle sans indiquer clairement qu’il s’agit du calque de la construction hébraïque « et elle devient/est à un autre homme ».'
