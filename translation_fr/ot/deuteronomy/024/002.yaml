lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: elle quitte sa maison
  rationale: Cette formulation française naturelle rend explicitement la sortie hors de la maison indiquée par יצא מן, tout en maintenant la succession des faits dans le cas juridique.
- source_word: וְהָלְכָה
  choice: s’en va
  rationale: Dans la séquence, הלך marque son départ après la sortie de la maison. « S’en va » évite la répétition peu naturelle de « va » et ne précise pas indûment la manière du déplacement.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: et devient la femme d’un autre homme
  rationale: La construction היה ל exprime ici l’entrée dans une nouvelle relation; le contexte juridique du divorce et du remariage permet d’expliciter idiomatiquement le statut d’épouse, sans ajouter de notion étrangère au passage.
