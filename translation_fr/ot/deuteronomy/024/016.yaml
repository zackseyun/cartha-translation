id: DEU.24.16
reference: Deuteronomy 24:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: fr
  text: On ne fera pas mourir les pères à cause de leurs fils[a], et l’on ne fera pas mourir les fils à cause de leurs pères. Chacun sera mis à mort pour son propre péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants »; l’hébreu dit littéralement « fils » dans les deux propositions.
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause de sa propre faute ». Le mot hébreu peut désigner un péché ou une faute constituant ici le motif de la peine.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: on ne fera pas mourir / sera mis à mort
  rationale: Le hofal de מות exprime une mise à mort subie, ici dans un cadre judiciaire. Ces formulations françaises conservent cette valeur causative et passive sans réduire le sens à une mort quelconque.
- source_word: אָבוֹת
  choice: pères
  rationale: Le nom hébreu désigne précisément les pères; ce choix préserve aussi le parallélisme familial du texte.
- source_word: בָּנִים
  choice: fils
  rationale: Le terme signifie littéralement « fils », même s’il peut parfois englober les descendants ou les enfants selon le contexte. La traduction garde ici la formulation masculine du texte source.
- source_word: עַל
  choice: à cause de
  rationale: Dans cette disposition juridique, עַל indique le motif imputé ou la responsabilité au titre de laquelle une personne serait punie.
- source_word: אִישׁ
  choice: chacun
  rationale: אִישׁ a ici une force distributive. « Chacun » rend naturellement en français la responsabilité individuelle sans alourdir la phrase.
- source_word: בְּחֶטְאוֹ
  choice: pour son propre péché
  rationale: La préposition ב marque ici le motif de la peine, et le suffixe possessif renvoie au péché de l’individu lui-même. « Propre » explicite le contraste avec la responsabilité transférée entre générations.
theological_decisions:
- issue: Responsabilité individuelle dans l’application de la peine capitale
  choice: Le verset interdit de mettre judiciairement à mort un père pour le péché de son fils, ou un fils pour celui de son père; chacun répond de son propre péché.
  alternative: Une affirmation générale concernant toutes les conséquences intergénérationnelles du péché.
  rationale: La forme causative passive répétée de מות vise plus précisément la mise à mort. La traduction conserve donc la portée judiciaire immédiate sans étendre explicitement l’énoncé à toutes les conséquences du péché.
translation_notes:
  register: Français international moderne, clair et digne. La tournure impersonnelle « on ne fera pas mourir » exprime naturellement l’interdiction juridique, tandis que « sera mis à mort » maintient dans la dernière proposition la valeur passive du texte hébreu. Le parallélisme entre pères et fils est conservé.
