  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: fr
  text: 'Yahweh me dit : « Vois, j’ai commencé à te livrer Sihôn et son pays[a]. Commence à prendre possession de son pays[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant toi ». Dans ce contexte, l’expression indique que Yahweh remet Sihôn et son pays au pouvoir de Moïse et d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'La formulation hébraïque est plus répétitive : « Commence, prends possession, à prendre possession de son pays. » Elle emploie deux fois la racine verbale « prendre possession » pour renforcer l’ordre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif sert à attirer l’attention; « Vois » en conserve la force directe dans un registre digne.
- source_word: הַחִלֹּתִי תֵּת
  choice: j’ai commencé à livrer
  rationale: Le parfait suivi de l’infinitif exprime une action déjà amorcée; dans ce contexte militaire, « livrer » rend naturellement le transfert au pouvoir d’Israël.
- source_word: לְפָנֶיךָ
  choice: en ton pouvoir
  rationale: Littéralement « devant toi »; ici, l’expression indique que Sihôn et son pays sont placés à la merci ou sous le pouvoir d’Israël.
- source_word: הָחֵל
  choice: Commence
  rationale: Reproduit le parallèle délibéré entre ce que Yahweh a commencé et ce qu’Israël doit maintenant commencer.
- source_word: רָשׁ לָרֶשֶׁת
  choice: à prendre possession
  rationale: La répétition de la racine ירש intensifie l’ordre. Une formulation française non redondante est retenue dans le texte, avec une note signalant la répétition.
- source_word: אַרְצוֹ
  choice: son pays
  rationale: אֶרֶץ désigne ici le territoire gouverné par Sihôn; « pays » est naturel en français et évite la répétition immédiate de « terre » au sens matériel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël; sa transcription préserve cette distinction sans lui substituer un titre.
- issue: Rôle de l’action divine et de l’action d’Israël
  choice: Conserver le parallèle « j’ai commencé… Commence… »
  alternative: Fondre les deux actions en une seule formulation
  rationale: L’hébreu maintient la tension entre le don déjà amorcé par Yahweh et l’ordre adressé à Israël d’en prendre possession.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond à l’adresse faite à Moïse. « Sihôn » suit une translittération française usuelle; le parallèle verbal et la nuance de conquête sont conservés sans lourdeur.
