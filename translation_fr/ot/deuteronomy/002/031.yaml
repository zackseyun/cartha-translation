revisions:
- from: 'Yahweh me dit : « Vois, j’ai commencé à livrer Sihôn et son pays en ton pouvoir[a]. Commence à prendre possession de son pays[b]. »'
  to: 'Yahweh me dit : « Vois, j’ai commencé à te livrer Sihôn et son pays[a]. Commence à prendre possession de son pays[b]. »'
  rationale: La révision remplace une expression calquée et peu naturelle par « te livrer », qui transmet fidèlement la remise de Sihôn et de son territoire. Elle corrige également la note sur la répétition de ירש, sans forcer l’infinitif final à exprimer un but. Les ancres demeurent placées auprès des segments qu’elles éclairent.
