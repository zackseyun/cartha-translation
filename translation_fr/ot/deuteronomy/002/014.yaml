source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: fr
  text: Le temps écoulé depuis notre départ de Qadesh-Barnéa jusqu’à notre traversée de l’oued de Zéred[a] fut de trente-huit ans, jusqu’à ce que toute la génération des hommes de guerre ait disparu du milieu du camp, comme Yahweh le leur avait juré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torrent de Zéred ». Le terme hébreu peut désigner un oued, le lit d’un cours d’eau saisonnier ou un torrent.
    reason: Alternative lexicale et précision géographique.
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר הָלַכְנוּ
  choice: Le temps écoulé depuis notre départ
  rationale: Littéralement, « les jours pendant lesquels nous sommes allés ». En français, cette formulation exprime naturellement la durée du déplacement sans réduire הָלַכְנוּ à la marche à pied.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Qadesh-Barnéa
  rationale: Transcription française usuelle du nom de lieu composé.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: jusqu’à notre traversée
  rationale: Le verbe עבר désigne ici le franchissement d’un cours d’eau ou de son lit; la tournure nominale s’intègre clairement à l’indication de durée.
- source_word: נַחַל זֶרֶד
  choice: l’oued de Zéred
  rationale: נַחַל peut désigner un cours d’eau, mais aussi le lit souvent saisonnier d’un cours d’eau. « Oued » convient bien à la géographie de la région et demeure intelligible en français moderne.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: trente-huit ans
  rationale: Formulation numérique française courante.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: jusqu’à ce que toute la génération ... ait disparu
  rationale: תֹּם exprime l’achèvement complet. Dans ce contexte de jugement et de mortalité, « ait disparu » rend clairement la disparition progressive de cette génération sans ajouter explicitement un verbe « mourir » absent de l’hébreu.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: des hommes de guerre
  rationale: L’expression est explicitement masculine et désigne les hommes aptes au combat de la génération condamnée. Cette traduction conserve la formulation et la portée de l’hébreu.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: du milieu du camp
  rationale: Rend directement l’idée de disparition hors du sein de la communauté campée.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: comme Yahweh le leur avait juré
  rationale: Le plus-que-parfait situe le serment avant son accomplissement. Le pronom « le » explicite en français le contenu sous-entendu du serment sans en modifier le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre de l’alliance sans lui substituer un titre.
- issue: Portée masculine de אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes de guerre
  alternative: les combattants
  rationale: L’hébreu vise explicitement les hommes de cette génération soumis au jugement; une formulation masculine conserve cette précision historique et grammaticale.
- issue: Sens de la disparition de la génération
  choice: ait disparu du milieu du camp
  alternative: soit morte dans le camp
  rationale: Le contexte implique leur mort, mais l’hébreu emploie une expression d’achèvement plutôt que le verbe « mourir ». La traduction garde cette nuance tout en restant claire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le double repère temporel de l’hébreu et le vocabulaire militaire masculin, tout en évitant une construction littérale peu naturelle autour de « les jours ».
