  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: fr
  text: D’Aroër, qui est au bord de la vallée de l’Arnon, et de la ville qui se trouve dans la vallée, jusqu’au Galaad, aucune ville ne nous était trop haute[a] ; Yahweh notre Dieu nous a tout livré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucune ville n’était trop forte pour nous » ou « aucune ville ne nous était inaccessible ». Littéralement, l’hébreu dit qu’aucune ville « ne nous était trop haute » ; la hauteur évoque ici la puissance défensive ou l’inaccessibilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: Depuis Aroër
  rationale: La préposition מִן marque ici le point de départ de l’étendue géographique ; « depuis » l’exprime naturellement en français.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: au bord de la vallée de l’Arnon
  rationale: שָׂפָה désigne le bord ou la rive ; נַחַל peut désigner un torrent, un ravin ou sa vallée. « Vallée » rend clairement la référence topographique sans technicisme.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: et la ville qui se trouve dans la vallée
  rationale: La coordination simple est conservée, sans ajouter un second « depuis » absent de l’hébreu ni préciser l’identité de la ville.
- source_word: וְעַד הַגִּלְעָד
  choice: jusqu’au Galaad
  rationale: עַד indique le terme de l’étendue territoriale.
- source_word: קִרְיָה
  choice: ville
  rationale: Le terme désigne une ville ou une cité, vraisemblablement fortifiée dans ce contexte ; « ville » est courant et de portée suffisamment large.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: était trop haute pour nous
  rationale: Cette formulation préserve la métaphore hébraïque de la hauteur, qui évoque une position défensive forte ou inaccessible, sans réduire le sens à une seule interprétation.
- source_word: אֶת הַכֹּל
  choice: les a toutes
  rationale: Le collectif « tout » renvoie naturellement en contexte à l’ensemble des villes mentionnées ; le pronom féminin pluriel rend ce référent explicite en français.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh notre Dieu
  rationale: Le nom divin personnel est translittéré « Yahweh », tandis que אֱלֹהֵינוּ est rendu directement par « notre Dieu ».
- source_word: לְפָנֵינוּ
  choice: livrées en notre pouvoir
  rationale: Dans un contexte de conquête, l’expression « donner devant » signifie remettre à la disposition ou au pouvoir de quelqu’un. La formulation française explicite cet idiome sans ajouter l’idée d’une cause militaire particulière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve ici le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Portée de l’affirmation sur l’inaccessibilité des villes
  choice: Conserver la métaphore « trop haute pour nous »
  alternative: « trop forte pour nous » ou « hors de notre portée »
  rationale: L’hébreu associe littéralement la hauteur à la sécurité ou à l’inaccessibilité. Le texte principal maintient cette tension imagée et la note présente les principaux sens contextuels possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe géographique suit étroitement l’hébreu tout en restant lisible. Le point-virgule sépare l’étendue de la conquête de son attribution à Yahweh.
