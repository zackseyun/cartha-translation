  text: וַ/נֵּ֜פֶן וַ/נִּסַּ֤ע הַ/מִּדְבָּ֨רָ/ה֙ דֶּ֣רֶךְ יַם ס֔וּף כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/נָּ֥סָב אֶת הַר שֵׂעִ֖יר יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: fr
  text: Puis nous nous sommes tournés vers le désert et sommes partis par la route de la mer Rouge[a], comme Yahweh me l’avait dit, et nous avons contourné le mont Séir pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mer des roseaux ». Le nom hébreu Yam Souf peut être traduit plus littéralement ainsi.
    reason: Préserver l’autre analyse lexicale possible du nom יַם סוּף tout en maintenant dans le texte le nom géographique français traditionnel.
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Puis nous avons fait demi-tour
  rationale: Le qal wayyiqtol de פנה exprime un changement de direction dans la suite du récit. Dans ce contexte de reprise de route après Qadesh, « faire demi-tour » rend naturellement le mouvement sans ajouter l’idée d’un retour jusqu’à un lieu précis.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: et sommes partis en direction du désert
  rationale: נסע désigne couramment la levée du camp et le départ; le hé directionnel de מִדְבָּרָה indique un mouvement vers le désert. La formulation française conserve ces deux nuances.
- source_word: דֶּרֶךְ יַם סוּף
  choice: par la route de la mer Rouge[a]
  rationale: דֶּרֶךְ introduit ici l’itinéraire suivi. « Mer Rouge » est le nom géographique français traditionnel de יַם סוּף, tandis que la traduction plus littérale est signalée en note.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: comme Yahweh me l’avait dit
  rationale: כַּאֲשֶׁר marque la conformité. Le plus-que-parfait convient au regard rétrospectif du récit, et « me l’avait dit » est une expression française naturelle pour דִּבֶּר ... אֵלָי dans ce contexte.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: et nous avons contourné le mont Séir
  rationale: סבב exprime le déplacement autour d’un lieu. « Contourner » rend ce sens avec concision; הַר שֵׂעִיר est rendu par le toponyme usuel « mont Séir ».
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: L’accusatif de durée est explicitement rendu par « pendant ». « De nombreux jours » reste proche de l’hébreu, sans le généraliser en « longtemps ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente directement et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination narrative hébraïque est allégée sans perdre la succession des actions. Les noms propres suivent les formes françaises usuelles, avec accents pour Séir.
