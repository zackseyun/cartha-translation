  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: fr
  text: Maintenant, levez-vous et traversez le ouadi de Zéred[a]. Nous avons donc traversé le ouadi de Zéred.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torrent de Zéred » ou « vallée de Zéred ». Le mot hébreu נחל peut désigner, selon le contexte, un ouadi, un ravin ou le lit d’un cours d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marqueur temporel qui introduit l’action ordonnée suivante et conserve l’immédiateté de l’hébreu.
- source_word: קֻמוּ
  choice: levez-vous
  rationale: Impératif pluriel de קום ; formulation naturelle et digne en français moderne.
- source_word: וְעִבְרוּ
  choice: traversez
  rationale: Dans ce contexte de déplacement, עבר désigne le passage d’un côté à l’autre ; « traversez » exprime clairement ce mouvement.
- source_word: לָכֶם
  choice: —
  rationale: Le datif éthique renforce idiomatiquement l’impératif, mais une traduction explicite comme « pour vous-mêmes » serait peu naturelle en français ; sa nuance est intégrée à l’ordre.
- source_word: נַחַל
  choice: ouadi
  rationale: נחל peut désigner un ravin ou le lit d’un cours d’eau saisonnier. « Ouadi » convient au cadre désertique tout en préservant l’étendue sémantique au moyen d’une note.
- source_word: זָרֶד
  choice: Zéred
  rationale: Nom géographique translittéré selon une forme française usuelle.
- source_word: וַנַּעֲבֹר
  choice: Nous avons donc traversé
  rationale: Le wayyiqtol à la première personne du pluriel raconte l’accomplissement consécutif de l’ordre ; « donc » rend naturellement cette progression.
