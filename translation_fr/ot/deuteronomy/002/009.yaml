  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: fr
  text: 'Yahweh me dit : « Ne harcèle pas Moab et ne lui fais pas la guerre[a], car je ne te donnerai aucune part de son territoire comme possession[b] ; en effet, j’ai donné Ar comme possession aux fils de Loth. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne traite pas Moab en ennemi et ne lui livre pas bataille. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme héritage », pour les deux occurrences de « comme possession ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אַל תָּצַר אֶת מוֹאָב
  choice: Ne harcèle pas Moab
  rationale: Dans cette interdiction, צרר exprime une pression hostile dirigée contre Moab, distincte de la guerre ouverte mentionnée ensuite. « Harceler » rend cette nuance dans un français actuel.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: et ne lui fais pas la guerre
  rationale: La construction avec גרה et מִלְחָמָה désigne l’engagement dans les hostilités. Le singulier français reprend naturellement Moab comme entité collective, là où l’hébreu emploie un pronom pluriel visant ses membres.
- source_word: מֵאַרְצוֹ
  choice: rien de son territoire
  rationale: 'La préposition מִן a ici une valeur partitive : aucune portion du territoire de Moab ne sera donnée à Israël. « Territoire » convient au contexte géopolitique.'
- source_word: יְרֻשָּׁה
  choice: en possession
  rationale: Le terme désigne un bien territorial reçu et détenu, souvent comme part attribuée. « Possession » garde cette idée sans imposer exclusivement la nuance successorale d’« héritage ».
- source_word: לִבְנֵי לוֹט
  choice: aux fils de Loth
  rationale: Cette traduction conserve la formulation généalogique explicite de l’hébreu ; dans le contexte, elle désigne les descendants de Loth.
- source_word: עָר
  choice: Ar
  rationale: Le nom propre est translittéré selon sa forme traditionnelle française.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le nom divin. La translittération « Yahweh » en préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Sens de יְרֻשָּׁה
  choice: possession
  alternative: héritage
  rationale: Le contexte affirme l’attribution souveraine d’un territoire aux descendants de Loth. « Possession » préserve cette idée tout en laissant ouverte la nuance d’héritage attachée au mot hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en employant des tours naturels. « Moab » est traité comme une entité collective au singulier en français ; « fils de Loth » conserve le cadre généalogique du texte source.
