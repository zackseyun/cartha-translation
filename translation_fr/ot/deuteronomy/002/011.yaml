  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: fr
  text: Eux aussi étaient considérés comme des Rephaïm[a], tout comme les Anakim ; mais les Moabites les appellent Emim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « géants » pour « Rephaïm » ; toutefois, l’hébreu emploie ici plus naturellement le nom d’un ancien peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: Rephaïm
  rationale: Translittération d’un nom de peuple ancien plutôt que traduction interprétative par « géants ». La forme française avec tréma facilite la lecture et maintient la catégorie du monde source.
- source_word: יֵחָשְׁבוּ
  choice: étaient considérés comme
  rationale: Le niphal exprime ici le classement dans une catégorie. Cette tournure française naturelle conserve le sens passif.
- source_word: אַף הֵם
  choice: eux aussi
  rationale: 'Rend l’idée emphatique d’inclusion : ce peuple appartenait lui aussi à la catégorie mentionnée.'
- source_word: כָּעֲנָקִים
  choice: tout comme les Anakim
  rationale: Le préfixe כ marque une comparaison. « Tout comme » exprime clairement que les Anakim étaient eux aussi considérés comme des Rephaïm, sans identifier simplement les deux groupes.
- source_word: וְהַמֹּאָבִים
  choice: mais les Moabites
  rationale: Le waw introduit ici le contraste entre la classification générale et le nom employé par les Moabites ; « mais » rend naturellement cette fonction discursive.
- source_word: יִקְרְאוּ לָהֶם
  choice: les appellent
  rationale: La construction קרא ל signifie « appeler, donner un nom à ». Le présent français convient à l’énoncé de l’usage moabite tel que le rapporte le texte.
- source_word: אֵמִים
  choice: Emim
  rationale: Translittération du nom donné à ce peuple par les Moabites. L’absence d’article en hébreu est respectée par l’emploi sans article.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les ethnonymes anciens sont translittérés ; le point-virgule met en relief le contraste entre classification et appellation locale. « Tout comme » évite l’ambiguïté possible de « comme les Anakim » en indiquant que les Anakim aussi relevaient de la catégorie des Rephaïm.
