  variant: modern international French
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: fr
  text: 'comme il l’a fait pour les descendants d’Ésaü qui habitent en Séïr : il a détruit les Horiens devant eux[a], puis ceux-ci les ont dépossédés[b] et se sont établis à leur place jusqu’à ce jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie ici que Dieu a écarté les Horiens de leur présence et de leur territoire.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « ont pris possession de leur territoire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: comme il l’a fait
  rationale: Rend naturellement la comparaison et conserve l’allusion elliptique à l’action de Dieu décrite dans le contexte précédent.
- source_word: לִבְנֵי עֵשָׂו
  choice: pour les descendants d’Ésaü
  rationale: Dans ce contexte ethnique et historique, « descendants » exprime clairement la portée collective de l’hébreu בְּנֵי en français moderne.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: qui habitent en Séïr
  rationale: « Habitent » est actuel et naturel, tout en rendant fidèlement le participe hébreu.
- source_word: אֲשֶׁר הִשְׁמִיד
  choice: il a détruit
  rationale: La proposition est reprise après deux-points pour restituer clairement le déroulement de l’action sans imposer une valeur exclusivement temporelle au relatif hébreu.
- source_word: הַחֹרִי
  choice: les Horites
  rationale: Translittération française usuelle du nom de ce peuple.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: Conserve l’image idiomatique hébraïque tout en restant intelligible; la note en explicite le sens territorial.
- source_word: וַיִּירָשֻׁם
  choice: puis ceux-ci les ont dépossédés
  rationale: Le verbe ירשׁ désigne ici la prise de possession aux dépens des habitants antérieurs. « Ceux-ci » désambiguïse le changement de sujet en français.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: et se sont établis à leur place
  rationale: Exprime l’installation durable des descendants d’Ésaü sur le territoire auparavant occupé par les Horites.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française naturelle et digne correspondant à l’expression temporelle hébraïque.
theological_decisions:
- issue: Sujet des verbes au singulier décrivant l’action de destruction
  choice: 'Le sujet implicite est Dieu : « il l’a fait… il a détruit ».'
  alternative: Laisser le sujet moins explicite et entièrement dépendant du contexte.
  rationale: Les formes hébraïques sont au masculin singulier et le contexte immédiat les rapporte à l’action de l’Éternel en faveur d’Édom. Le pronom français clarifie la continuité sans ajouter une affirmation étrangère au texte.
- issue: Changement de sujet dans וַיִּירָשֻׁם
  choice: « ceux-ci » renvoie aux descendants d’Ésaü, qui dépossèdent les Horites.
  alternative: Employer simplement « ils », au risque d’une ambiguïté de référent en français.
  rationale: Le passage du singulier divin au pluriel humain est grammaticalement marqué en hébreu. Le démonstratif français rend ce changement explicite sans modifier le contenu.
translation_notes:
  register: Français international moderne, clair et digne. Le texte évite les archaïsmes tels que « demeurer » dans ce contexte, tout en conservant l’image hébraïque « devant eux » accompagnée d’une note explicative.
