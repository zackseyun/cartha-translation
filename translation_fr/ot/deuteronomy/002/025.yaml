base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: fr
  text: Aujourd’hui, je commencerai à faire peser sur les peuples qui sont sous tous les cieux la terreur et la crainte que tu inspires. Ils entendront parler de toi[a], trembleront et se tordront de douleur[b] à cause de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entendront ta renommée » ou « apprendront des nouvelles à ton sujet ». L’expression hébraïque peut désigner des nouvelles qui fondent une réputation.
    reason: lexical_alternative
  - marker: b
    text: Ou « seront saisis d’angoisse » ou « se tordront comme une femme en travail ». Le verbe hébreu évoque une détresse physique intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה אָחֵל תֵּת
  choice: Aujourd’hui même, je commencerai à répandre
  rationale: La tournure אָחֵל תֵּת signifie « commencer à donner/mettre ». « Répandre » est une formulation française naturelle avec la terreur et la crainte, tandis que « aujourd’hui même » rend l’insistance de הַיּוֹם הַזֶּה.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: la terreur et la crainte que tu inspires
  rationale: 'Les deux noms parallèles sont maintenus. La relative précise leur valeur objective : il s’agit de la terreur que suscite Israël, non de sa propre peur.'
- source_word: עַל פְּנֵי הָעַמִּים
  choice: parmi les peuples
  rationale: Littéralement « sur la face des peuples » ; cette expression idiomatique signifie ici que la terreur gagnera les peuples. « Parmi » évite un calque obscur en français.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: sous tous les cieux
  rationale: Conserve le pluriel hébreu et l’expression biblique de portée universelle.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Ils entendront parler de toi
  rationale: שֵׁמַע peut évoquer ce que l’on apprend d’une personne, les nouvelles qui circulent à son sujet ou sa renommée. La formulation retenue reste large et naturelle.
- source_word: וְרָגְזוּ
  choice: trembleront
  rationale: Le verbe exprime le tremblement ou l’agitation provoqués par la peur.
- source_word: וְחָלוּ
  choice: se tordront de douleur
  rationale: Le verbe évoque une détresse physique intense, parfois comparée aux douleurs de l’accouchement. Cette traduction conserve l’image corporelle sans expliciter cette comparaison.
- source_word: מִפָּנֶיךָ
  choice: à cause de toi
  rationale: Littéralement « de devant ta face/présence » ; dans le contexte, la préposition indique que la présence et la réputation d’Israël causent leur effroi.
