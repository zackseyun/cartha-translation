source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: fr
  text: Ne les provoquez pas[a], car je ne vous donnerai rien de leur pays, pas même un endroit où poser la plante du pied[b], puisque j’ai donné le mont Séir[c] à Ésaü comme possession[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne leur cherchez pas querelle » ou « N’engagez pas le combat contre eux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’au lieu où la plante du pied se pose » ; autrement dit, pas même la plus petite parcelle de terre.'
    reason: idiom_explanation
  - marker: c
    text: « Le mont Séir » peut aussi désigner la région montagneuse de Séir.
    reason: cultural_note
  - marker: d
    text: 'Ou : « comme héritage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: Ne les provoquez pas
  rationale: Le hitpael de גרה avec ב exprime l’idée de provoquer quelqu’un ou d’entrer dans un affrontement hostile avec lui. « Provoquez » reste concis et conserve la portée hostile sans limiter l’interdiction à une bataille déjà engagée.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: je ne vous donnerai rien de leur pays
  rationale: 'La préposition מן a ici une valeur partitive : aucune portion du pays d’Édom ne sera donnée à Israël. Cette formulation est naturelle en français et rend explicitement ce sens.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: pas même de quoi poser la plante d’un pied
  rationale: L’expression désigne une étendue de terre infime, correspondant à l’espace foulé par la plante du pied. La traduction conserve l’image concrète tout en rendant l’idiome intelligible.
- source_word: יְרֻשָּׁה
  choice: comme possession
  rationale: Le nom peut désigner une possession ou un héritage. Dans ce contexte territorial, « possession » souligne clairement le pays accordé par Dieu, sans exclure la nuance possible d’héritage.
- source_word: לְעֵשָׂו
  choice: à Ésaü
  rationale: Le nom propre est rendu selon sa forme française traditionnelle, et la préposition marque le bénéficiaire du don.
- source_word: הַר שֵׂעִיר
  choice: le mont Séir
  rationale: La traduction traditionnelle « mont Séir » conserve la forme du texte hébreu, tout en pouvant désigner plus largement la région montagneuse de Séir.
theological_decisions:
- issue: Le don divin du territoire d’Édom
  choice: L’interdiction d’attaquer Édom est fondée sur le fait que Dieu a lui-même donné Séir à Ésaü.
  alternative: Comprendre le verset comme une simple interdiction politique, sans accent sur la répartition divine des territoires.
  rationale: 'Les deux propositions introduites par כִּי donnent les motifs de l’interdiction : Dieu ne cédera aucune terre édomite à Israël, parce qu’il a accordé Séir à Ésaü. La traduction maintient ce lien sans ajouter d’explication doctrinale.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde les deux motifs introduits en hébreu par כִּי au moyen de « car » et « puisque ». L’image de la plante du pied est conservée sous une forme idiomatique naturelle.
