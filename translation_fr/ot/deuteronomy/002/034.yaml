    issue: Lien syntaxique potentiellement ambigu entre la destruction des villes et celle de leurs habitants
    rationale: Dans « nous avons voué à la destruction chacune d’elles, avec les hommes, les femmes et les petits enfants », « avec » peut être lu comme un simple accompagnement. L’hébreu inclut explicitement les hommes, les femmes et les petits enfants dans l’objet de l’action de חרם.
  - severity: low
    issue: Formulation de l’alternative en note
    rationale: « Voué à l’interdit » correspond plus directement et plus clairement à l’expression technique que « frappé d’interdit », tout en restant une alternative formelle à la traduction principale.
