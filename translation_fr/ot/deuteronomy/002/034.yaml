source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: fr
  text: En ce temps-là, nous nous sommes emparés de toutes ses villes, et nous avons voué à la destruction[a] chaque ville et ses hommes, ses femmes et ses petits enfants. Nous n’avons laissé aucun survivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « voué à l’interdit ». Le verbe hébreu renvoie au ḥerem, par lequel des personnes ou des biens étaient voués à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: nous nous sommes emparés
  rationale: Le verbe לכד désigne couramment la prise militaire d’une ville. « Nous nous sommes emparés » est naturel en français et conserve clairement le contexte de conquête.
- source_word: כָּל עָרָיו
  choice: toutes ses villes
  rationale: עִיר peut désigner une ville ou une localité ; « villes » convient au contexte militaire, tandis que כָּל exprime la totalité.
- source_word: בָּעֵת הַהִוא
  choice: En ce temps-là
  rationale: Cette formule temporelle est claire, digne et idiomatique en français biblique moderne.
- source_word: וַנַּחֲרֵם
  choice: nous avons voué à la destruction
  rationale: Le hifil de חרם exprime ici la mise sous ḥerem, avec pour conséquence la destruction. Cette formulation garde la dimension technique et sacrale du terme sans recourir dans le texte principal à l’expression moins accessible « frapper d’interdit ».
- source_word: כָּל עִיר מְתִם
  choice: chacune d’elles, avec les hommes
  rationale: La construction hébraïque est condensée. מְתִם renvoie aux hommes, distingués ensuite des femmes et des petits enfants. La formulation française rattache explicitement les habitants à chaque ville sans neutraliser cette distinction.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Traduction directe du pluriel féminin.
- source_word: הַטָּף
  choice: les petits enfants
  rationale: טַף désigne les jeunes enfants ou les petits dépendants. « Petits enfants » en restitue ici l’âge et la vulnérabilité.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Nous n’avons laissé aucun survivant
  rationale: שָׂרִיד désigne ce qui reste ou une personne survivante. Dans ce contexte guerrier, « survivant » est le terme français le plus précis et naturel.
theological_decisions:
- issue: Traduction du vocabulaire de חרם dans un récit de conquête
  choice: nous avons voué à la destruction
  alternative: nous avons entièrement détruit ; nous avons frappé d’interdit
  rationale: La traduction retenue préserve la portée technique et sacrale de חרם ainsi que son résultat destructeur, sans atténuer la violence du passage ni lui ajouter une justification théologique.
- issue: Spécificité de מְתִם dans l’énumération des victimes
  choice: les hommes, les femmes et les petits enfants
  alternative: tous les habitants, y compris les femmes et les enfants
  rationale: L’hébreu distingue les hommes des femmes et des petits enfants. Le français conserve cette distinction plutôt que de la fondre dans un collectif générique.
translation_notes:
  register: Français international moderne, naturel et digne. « En ce temps-là » garde une tonalité narrative biblique sans archaïsme marqué. La formulation explicite les liens syntaxiques de l’hébreu condensé tout en maintenant la dureté et la tension théologique du texte.
