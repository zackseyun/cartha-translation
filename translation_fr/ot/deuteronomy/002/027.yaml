base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: fr
  text: Laisse-moi traverser ton pays. Je suivrai strictement la route[a], sans m’écarter ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la route, par la route ». Cette répétition souligne qu’Israël resterait strictement sur l’itinéraire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Laisse-moi traverser
  rationale: Le cohortatif qal à la première personne exprime ici une demande diplomatique. Cette formulation française rend naturellement la requête plutôt qu’un simple futur.
- source_word: בְאַרְצֶךָ
  choice: ton pays
  rationale: Après le verbe « traverser », le complément direct est idiomatique en français et exprime le passage à travers le territoire du destinataire.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: strictement la route
  rationale: 'La répétition hébraïque a une valeur emphatique : Israël promet de rester rigoureusement sur l’itinéraire. « Strictement » en conserve la force sans répétition peu naturelle en français.'
- source_word: אֵלֵךְ
  choice: Je suivrai
  rationale: Dans ce contexte de déplacement sur une route, « suivre » exprime naturellement l’idée d’aller par l’itinéraire indiqué et s’articule bien avec « la route ».
- source_word: לֹא אָסוּר
  choice: sans m’écarter
  rationale: Le verbe סור signifie se détourner ou s’écarter. La tournure française relie clairement cette promesse à l’engagement de rester sur la route.
- source_word: יָמִין וּשְׂמֹאול
  choice: ni à droite ni à gauche
  rationale: Cette expression directionnelle traditionnelle conserve exactement l’image d’une absence de déviation dans un sens comme dans l’autre.
