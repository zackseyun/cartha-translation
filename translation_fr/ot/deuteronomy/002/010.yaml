  text: הָ/אֵמִ֥ים לְ/פָנִ֖ים יָ֣שְׁבוּ בָ֑/הּ עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: fr
  text: Les Émim habitaient autrefois dans ce pays[a]. C’était un peuple grand, nombreux et de haute stature, comme les Anakim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auparavant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵמִים
  choice: les Émim
  rationale: L’ethnonyme est translittéré plutôt que traduit; « Émim » convient à la phonologie et à l’usage biblique français.
- source_word: לְפָנִים
  choice: autrefois
  rationale: Dans cet emploi, l’expression a un sens temporel. « Autrefois » est naturel, précis et digne en français contemporain.
- source_word: יָשְׁבוּ בָהּ
  choice: habitaient dans ce pays
  rationale: Le verbe avec la préposition ב exprime la résidence. Le pronom féminin renvoie au territoire mentionné dans le contexte; « ce pays » explicite naturellement ce référent sans changer le sens.
- source_word: עַם
  choice: un peuple
  rationale: Le terme désigne ici un groupe ethnique pris collectivement; « un peuple » en conserve le nombre singulier.
- source_word: גָּדוֹל
  choice: grand
  rationale: « Grand » préserve l’ampleur et le caractère imposant suggérés par l’adjectif dans cette série descriptive.
- source_word: וְרַב
  choice: nombreux
  rationale: L’adjectif qualifie l’importance numérique du peuple; « nombreux » est idiomatique en français.
- source_word: וָרָם
  choice: de haute stature
  rationale: Dans la comparaison avec les Anakim, l’adjectif décrit la taille physique. « De haute stature » est clair et naturel pour un peuple collectif.
- source_word: כָּעֲנָקִים
  choice: comme les Anakim
  rationale: La préposition comparative כ marque la ressemblance; l’ethnonyme est conservé sous sa forme translittérée habituelle.
