  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: fr
  text: Nous sommes donc passés loin de nos frères, les descendants d’Ésaü qui habitent en Séïr, loin de la route de l’Araba, d’Élath et d’Étsion-Guéber. Puis nous avons bifurqué et sommes passés par la route du désert de Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: nous avons poursuivi notre route en nous éloignant de
  rationale: Avec un complément de personne, עבר מן־את décrit ici la poursuite du voyage en passant loin de ceux qui viennent d’être contournés, non la traversée d’un obstacle.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: nos frères, les descendants d’Ésaü
  rationale: « Frères » conserve la parenté explicitement affirmée avec Édom; « descendants » rend naturellement le sens collectif de « fils d’Ésaü » en français moderne.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: qui habitent en Séïr
  rationale: Le participe de ישב exprime ici une résidence établie; « habitent » est courant et précis.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: de la route de l’Araba
  rationale: דֶּרֶךְ désigne la route ou l’itinéraire, tandis qu’Araba est conservé comme nom géographique plutôt que réduit à une simple plaine désertique.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: d’Élath et d’Étsion-Guéber
  rationale: Translittérations françaises usuelles des deux noms de lieux; la préposition répétée marque le point ou secteur dont le groupe s’éloigne.
- source_word: וַנֵּפֶן
  choice: nous avons changé de direction
  rationale: פנה signale un changement d’orientation; cette formulation explicite naturellement le mouvement sans ajouter de destination.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: pris la route du désert de Moab
  rationale: Dans ce second emploi, עבר avec דֶּרֶךְ décrit le déplacement par cet itinéraire. « Prendre la route » est idiomatique en français tout en conservant la mention du désert de Moab.
theological_decisions:
- issue: Langage de parenté concernant Édom
  choice: nos frères, les descendants d’Ésaü
  alternative: nos proches, les fils d’Ésaü
  rationale: Le choix maintient le terme fort de parenté אַחֵינוּ sans en faire une simple proximité ethnique, tout en rendant le collectif בְנֵי de façon naturelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes bibliques françaises largement reconnues. La formulation évite l’archaïsme « fils d’Ésaü » dans le corps du texte tout en préservant explicitement la fraternité entre Israël et Édom.
