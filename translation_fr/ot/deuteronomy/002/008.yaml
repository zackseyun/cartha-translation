revisions:
- from: Nous avons donc poursuivi notre route en nous éloignant de nos frères, les descendants d’Ésaü, qui habitent en Séïr, et de la route de l’Araba, d’Élath et d’Étsion-Guéber[a]. Puis nous avons changé de direction et pris la route du désert de Moab.
  to: Nous sommes donc passés loin de nos frères, les descendants d’Ésaü qui habitent en Séïr, loin de la route de l’Araba, d’Élath et d’Étsion-Guéber. Puis nous avons bifurqué et sommes passés par la route du désert de Moab.
  rationale: La révision rend les deux emplois de עבר par « sommes passés », conserve sans affaiblissement le langage de parenté et maintient les toponymes. La répétition de « loin de » clarifie que les compléments introduits par מן indiquent les lieux ou le groupe dont les Israélites se sont écartés. La note est retirée, car elle n’est pas exigée par une ambiguïté textuelle suffisamment établie et risquait d’orienter indûment la lecture.
