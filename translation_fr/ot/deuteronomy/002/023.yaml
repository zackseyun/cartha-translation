  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: fr
  text: Quant aux Avvites[a], qui habitaient dans des villages jusqu’à Gaza, les Caphtorites, venus de Caphtor, les exterminèrent et s’installèrent à leur place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Avvim ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: les Avvites
  rationale: Nom de peuple rendu par la forme française traditionnelle et immédiatement intelligible, plutôt que par une translittération brute.
- source_word: הַיֹּשְׁבִים
  choice: qui habitaient
  rationale: ישב exprime ici la résidence; « habitaient » est naturel et conserve l’idée d’implantation.
- source_word: בַּחֲצֵרִים
  choice: dans des villages
  rationale: חֲצֵרִים désigne ici des lieux d’habitation non fortifiés, tels que villages ou hameaux; « villages » convient au contexte tout en restant courant.
- source_word: עַד עַזָּה
  choice: jusqu’à Gaza
  rationale: Rend simplement la limite géographique marquée par עַד.
- source_word: כַּפְתֹּרִים
  choice: les Caphtorites
  rationale: Forme française d’un nom de peuple, construite de manière cohérente avec « Avvites ».
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: venus de Caphtor
  rationale: Rend idiomatiquement le mouvement exprimé par יצא sans donner en français une tournure artificielle comme « sortis de Caphtor ».
- source_word: הִשְׁמִידֻם
  choice: les exterminèrent
  rationale: Le hifil de שׁמד exprime une destruction complète; « exterminèrent » en conserve la force dans ce contexte de disparition d’un peuple.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: et s’installèrent à leur place
  rationale: La formulation communique à la fois l’établissement des Caphtorites et leur remplacement des anciens habitants.
