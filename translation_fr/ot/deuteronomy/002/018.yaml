source:
  edition: WLC
  text: אַתָּ֨ה עֹבֵ֥ר הַ/יּ֛וֹם אֶת גְּב֥וּל מוֹאָ֖ב אֶת עָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: fr
  text: Aujourd’hui, tu franchis la frontière de Moab à Ar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la frontière de Moab, c’est-à-dire Ar ». En hébreu, la marque de l’objet est répétée devant « Ar », qui peut désigner par apposition la région frontalière ou la ville moabite.'
    reason: Alternative lexicale et syntaxique
lexical_decisions:
- source_word: אַתָּה
  choice: tu
  rationale: Le pronom hébreu est à la deuxième personne du masculin singulier et s’adresse collectivement à Israël. Le singulier français préserve directement cette forme et sa force rhétorique.
- source_word: עֹבֵר
  choice: franchis
  rationale: Le participe qal employé comme prédicat avec אַתָּה présente l’action comme immédiate dans le contexte. Le présent français « tu franchis » rend naturellement cette valeur; « franchir » convient particulièrement à une frontière.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Adverbe temporel courant signifiant « aujourd’hui » ou « ce jour ». Placé en tête, il conserve l’accent temporel de l’hébreu tout en restant naturel en français.
- source_word: גְּבוּל
  choice: frontière
  rationale: Dans ce contexte territorial, le terme désigne la limite du pays de Moab. « Frontière » est plus idiomatique que « limite » lorsqu’on la franchit.
- source_word: מוֹאָב
  choice: Moab
  rationale: Translittération française traditionnelle du nom propre.
- source_word: עָר
  choice: Ar
  rationale: Nom propre de lieu, translittéré plutôt que traduit.
- source_word: אֶת ... אֶת
  choice: la frontière de Moab à Ar
  rationale: La répétition de la marque de l’objet introduit d’abord « la frontière de Moab », puis « Ar », avec une relation probablement appositionnelle. « à Ar » exprime sobrement la relation géographique sans supprimer l’ambiguïté, laquelle est signalée en note.
theological_decisions:
- issue: Adresse au singulier à Israël
  choice: Maintenir « tu » sans ajouter « Israël »
  alternative: « Vous franchissez aujourd’hui… » ou « Aujourd’hui, toi, Israël, tu franchis… »
  rationale: Le singulier hébreu présente Israël comme une entité collective. Le français « tu » en conserve la forme et la tension rhétorique sans explicitation interprétative.
- issue: Relation syntaxique entre la frontière de Moab et Ar
  choice: « à Ar » dans le texte, avec l’apposition possible en note
  alternative: « la frontière de Moab, c’est-à-dire Ar »
  rationale: Le second אֶת peut introduire une apposition, mais la relation exacte demeure légèrement ambiguë. La formulation principale est naturelle, tandis que la note préserve explicitement l’autre analyse.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre « Aujourd’hui » en tête met en relief l’indication temporelle. « Tu » conserve l’adresse collective au singulier; « franchis la frontière » est idiomatique et précis.
