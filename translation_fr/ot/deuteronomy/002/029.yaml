source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: fr
  text: comme l’ont fait pour moi les fils d’Ésaü qui habitent en Séïr et les Moabites qui habitent à Ar[a], jusqu’à ce que je traverse le Jourdain pour entrer dans le pays que Yahweh notre Dieu nous donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont agi envers moi ». L’hébreu dit littéralement « ont fait pour moi »; dans le contexte, cela peut renvoyer au passage et à l’achat de vivres.
    reason: Signaler l’étendue sémantique de עָשׂוּ לִי sans imposer une précision absente de la formulation hébraïque.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit simplement et naturellement la comparaison avec la conduite des Édomites et des Moabites.
- source_word: עָשׂוּ לִי
  choice: l’ont fait pour moi
  rationale: Conserve la formulation générale de l’hébreu sans préciser indûment si elle vise le passage, l’achat de vivres ou, plus largement, la manière d’agir envers Moïse.
- source_word: בְּנֵי עֵשָׂו
  choice: les fils d’Ésaü
  rationale: Reproduit l’expression familiale de l’hébreu, qui désigne collectivement les descendants d’Ésaü.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: qui habitent en Séïr
  rationale: Le participe de ישׁב exprime ici la résidence; « habitent » est courant et digne en français moderne.
- source_word: וְהַמּוֹאָבִים
  choice: et les Moabites
  rationale: Rend directement le gentilé pluriel hébreu.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: qui habitent à Ar
  rationale: Rend parallèlement la même construction participiale; Ar est conservé comme nom de lieu.
- source_word: עַד אֲשֶׁר אֶעֱבֹר אֶת הַיַּרְדֵּן
  choice: jusqu’à ce que je traverse le Jourdain
  rationale: « Traverser » est le verbe français naturel avec un cours d’eau et rend clairement עבר.
- source_word: אֶל הָאָרֶץ
  choice: pour entrer dans le pays
  rationale: Dans le contexte du franchissement du Jourdain, cette formulation exprime naturellement le mouvement vers l’intérieur du pays.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement la désignation relationnelle et collective de l’hébreu.
- source_word: נֹתֵן לָנוּ
  choice: nous donne
  rationale: Le présent français traduit naturellement le participe hébreu, qui présente le don comme actuel et assuré.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel יהוה; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de עָשׂוּ לִי dans le contexte des relations avec Édom et Moab
  choice: formulation générale « l’ont fait pour moi »
  alternative: « ont agi envers moi » ou explicitation « m’ont laissé passer »
  rationale: L’hébreu reste général. La traduction n’harmonise pas implicitement les récits ni ne limite l’action à une permission de passage; la note signale l’autre compréhension possible.
translation_notes:
  register: Français international moderne, clair et digne. Les parallélismes géographiques sont conservés, ainsi que l’expression familiale « fils d’Ésaü ». La syntaxe reste fluide tout en préservant la généralité potentiellement significative de « l’ont fait pour moi ».
