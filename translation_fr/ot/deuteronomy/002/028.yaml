base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: fr
  text: Vous me vendrez de la nourriture contre de l’argent, afin que je mange, et vous me donnerez de l’eau contre de l’argent, afin que je boive. Laissez-moi seulement passer à pied—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: nourriture
  rationale: Terme général désignant ce qui se mange; « nourriture » conserve cette portée sans préciser à tort le pain ou les céréales.
- source_word: בַּכֶּסֶף
  choice: contre de l’argent
  rationale: Le syntagme indique le moyen ou le prix du paiement. En français moderne, « contre de l’argent » exprime naturellement l’échange tout en conservant l’idée concrète de paiement.
- source_word: תַּשְׁבִּרֵנִי
  choice: tu me vendras
  rationale: Le hiphil de שׁבר signifie ici vendre ou fournir des vivres en échange d’un paiement. Le futur français convient à la formulation de la demande dans son contexte.
- source_word: וְאָכַלְתִּי
  choice: afin que je mange
  rationale: Le waw suivi du parfait exprime ici le résultat visé par la demande; « afin que » rend clairement cette valeur.
- source_word: וּמַיִם
  choice: de l’eau
  rationale: Équivalent direct et naturel en français dans la construction avec « donner ».
- source_word: תִּתֶּן לִי
  choice: tu me donneras
  rationale: Rend directement נתן avec le complément indirect; le futur garde le parallélisme avec « tu me vendras ».
- source_word: וְשָׁתִיתִי
  choice: afin que je boive
  rationale: Comme וְאָכַלְתִּי, la forme exprime le résultat ou le but recherché.
- source_word: רַק
  choice: seulement
  rationale: Marque la limitation essentielle de la requête; sa position après le verbe est naturelle en français.
- source_word: אֶעְבְּרָה
  choice: laisse-moi passer
  rationale: Le cohortatif a ici une nuance de requête ou de permission, bien rendue par « laisse-moi ».
- source_word: בְרַגְלָי
  choice: à pied
  rationale: Littéralement « sur/avec mes pieds »; l’expression idiomatique française « à pied » en conserve exactement le sens sans étrangeté artificielle.
theological_decisions: []
