language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: fr
  text: 'Quand tu arriveras en face des Ammonites[a], ne les attaque pas[b] et ne leur cherche pas querelle, car je ne te donnerai aucune part du pays des Ammonites en propriété[c] : je l’ai donné en propriété[c] aux descendants de Loth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Ammon » ; de même dans la suite du verset.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne les harcèle pas ». Le verbe peut aussi être compris plus précisément au sens de « ne les assiège pas » ; il interdit de façon large une action hostile.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « en héritage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Quand tu arriveras en face de
  rationale: Cette formulation rend naturellement l’approche exprimée par קרב et la relation spatiale de מול, sans suggérer nécessairement une entrée sur le territoire.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Dans cette désignation nationale, « les Ammonites » est le français moderne et idiomatique correspondant aux « fils d’Ammon », tout en conservant le nom ancestral.
- source_word: אַל תְּצֻרֵם
  choice: ne les attaque pas
  rationale: Dans ce contexte militaire, צור peut désigner une action hostile contre ce peuple. « Attaquer » reste suffisamment large; la note signale l’interprétation plus précise « assiéger ».
- source_word: וְאַל תִּתְגָּר בָּם
  choice: ne leur cherche pas querelle
  rationale: Le hitpael de גרה exprime le fait de susciter ou d’engager un conflit. Cette tournure française préserve la portée hostile sans ajouter explicitement « la guerre ».
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: aucune part du pays des Ammonites
  rationale: « Aucune part » explicite naturellement la valeur partitive de מן sous la négation.
- source_word: יְרֻשָּׁה
  choice: en possession
  rationale: Le terme désigne ici un territoire accordé pour être possédé. « Possession » convient au contexte de répartition territoriale, tandis que « héritage » demeure une possibilité lexicale signalée en note.
- source_word: לִבְנֵי לוֹט
  choice: aux descendants de Loth
  rationale: Ici, « fils de Loth » désigne collectivement sa postérité. « Descendants » communique clairement cette valeur généalogique en français actuel.
- source_word: נְתַתִּיהָ
  choice: je l’ai donné
  rationale: Le passé composé exprime un don accompli dont l’effet territorial demeure en vigueur.
theological_decisions:
- issue: Expression des liens de descendance dans les désignations collectives
  choice: les Ammonites / les descendants de Loth
  alternative: les fils d’Ammon / les fils de Loth
  rationale: Le français idiomatique distingue utilement le nom du peuple et la référence à sa lignée. Ce choix conserve l’affirmation centrale selon laquelle Dieu a attribué ce territoire à la postérité de Loth, sans donner à « fils » un sens limité aux enfants immédiats.
- issue: Valeur de יְרֻשָּׁה dans l’attribution du territoire
  choice: possession
  alternative: héritage
  rationale: « Possession » préserve l’idée d’un territoire accordé sans imposer exclusivement la nuance successorale que peut évoquer « héritage »; l’alternative est maintenue en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse collective à Israël au singulier. La syntaxe conserve la progression de l’hébreu tout en évitant des calques peu naturels.
