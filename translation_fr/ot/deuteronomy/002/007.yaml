  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: fr
  text: 'Car Yahweh, ton Dieu, t’a béni dans tout le travail de tes mains. Il a connu ton parcours à travers ce grand désert[a]. Pendant ces quarante années, Yahweh, ton Dieu, a été avec toi : tu n’as manqué de rien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il a veillé sur ton cheminement à travers ce grand désert ». Le verbe hébreu signifie littéralement « connaître » et peut, dans ce contexte, impliquer une attention bienveillante.
    reason: Alternative lexicale préservant la nuance possible de sollicitude divine.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בֵּרַכְךָ
  choice: t’a béni
  rationale: Le passé composé convient au regard rétrospectif de Moïse et conserve la portée religieuse et relationnelle du verbe « bénir ».
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: dans tout le travail de tes mains
  rationale: Cette formulation française naturelle rend l’expression hébraïque concrète désignant l’ensemble du travail ou des entreprises d’une personne.
- source_word: יָדַע
  choice: a connu
  rationale: Le sens premier du verbe est « connaître ». Cette traduction maintient l’ambiguïté entre connaissance et attention bienveillante, explicitée en note.
- source_word: לֶכְתְּךָ
  choice: ta marche
  rationale: Le substantif verbal désigne le fait d’aller ou de cheminer; « ta marche » reste proche de la forme hébraïque tout en étant compréhensible dans ce contexte.
- source_word: אֶת־הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: à travers ce grand désert
  rationale: « À travers » exprime naturellement en français le parcours effectué dans le désert, que la construction hébraïque rattache à la marche.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: Pendant ces quarante années
  rationale: Cette tournure rend clairement et naturellement la durée rétrospective exprimée par l’hébreu.
- source_word: עִמָּךְ
  choice: a été avec toi
  rationale: Le français exige un verbe; le passé composé exprime une présence continue sur la période évoquée.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: tu n’as manqué de rien
  rationale: Cette expression idiomatique française rend exactement l’idée d’une absence totale de manque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre ni adopter la forme traditionnelle plus tardive « Jéhovah ».
- issue: Portée de יָדַע appliqué à la marche d’Israël
  choice: Il a connu ta marche
  alternative: Il a veillé sur ton cheminement
  rationale: Le choix principal conserve le sens lexical et la tension du texte; la possibilité d’une connaissance impliquant une attention protectrice est donnée en note plutôt qu’intégrée d’office dans la traduction.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse collective à Israël sous une forme grammaticale singulière. « Il a connu ta marche » est volontairement plus proche de l’hébreu que le français courant afin de préserver l’ambiguïté, tandis que la note fournit la lecture contextuelle plus idiomatique.
