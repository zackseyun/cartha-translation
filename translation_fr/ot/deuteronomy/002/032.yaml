  register: Français moderne, international et digne. La formulation reste proche de l’hébreu tout en évitant la lourdeur de « lui et tout son peuple ». Aucun appel de note n’est nécessaire, puisque le contexte de bataille désambiguïse naturellement « à notre rencontre ».
