  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: fr
  text: Alors Sihôn sortit à notre rencontre, avec tout son peuple, pour livrer bataille à Yahats.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא décrit la sortie de Sihôn en vue de l’affrontement; « sortit » est direct et naturel dans un récit militaire.
- source_word: סִיחֹן
  choice: Sihôn
  rationale: Translittération française usuelle du nom propre, avec accent circonflexe indiquant la voyelle longue.
- source_word: לִקְרָאתֵנוּ
  choice: à notre rencontre
  rationale: Cette expression conserve le sens formel de « venir à la rencontre de », tandis que le contexte hostile est rendu explicite par « pour livrer bataille ».
- source_word: הוּא וְכָל עַמּוֹ
  choice: avec tout son peuple
  rationale: La construction associe Sihôn à l’ensemble de son peuple. « Avec » produit une phrase française naturelle sans réduire עַם à une armée professionnelle.
- source_word: לַמִּלְחָמָה
  choice: pour livrer bataille
  rationale: La préposition exprime ici le but; cette tournure française claire rend explicitement l’intention militaire.
- source_word: יָהְצָה
  choice: à Yahats
  rationale: Le hé locale indique la direction ou le lieu visé; dans ce contexte, le français idiomatique emploie « à ». « Yahats » est une translittération française transparente du toponyme.
