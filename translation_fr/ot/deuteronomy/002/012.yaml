revisions:
- from: À Séir, les Horites habitaient autrefois. Mais les descendants d’Ésaü les dépossédèrent[a], les exterminèrent en les faisant disparaître de devant eux[b] et s’installèrent à leur place, comme Israël l’a fait pour le pays qui était sa possession[c], celui que Yahweh leur a donné.
  to: À Séir, les Horites habitaient autrefois. Mais les descendants d’Ésaü les dépossédèrent[a], les anéantirent, les éliminant ainsi de leur présence[b], et s’établirent à leur place, comme Israël l’a fait à l’égard du pays de son héritage[c], celui que Yahweh leur a donné.
  rationale: La révision maintient les informations et les ambiguïtés du texte source, mais remplace une construction française redondante par une coordination plus fidèle au texte hébreu. Elle rend également la comparaison finale et le terme d’héritage de façon plus idiomatique et plus proche du sens lexical.
