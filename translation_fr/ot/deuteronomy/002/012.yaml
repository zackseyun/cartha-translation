  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: fr
  text: À Séir, les Horites habitaient autrefois. Mais les descendants d’Ésaü les dépossédèrent[a], les anéantirent, les éliminant ainsi de leur présence[b], et s’établirent à leur place, comme Israël l’a fait à l’égard du pays de son héritage[c], celui que Yahweh leur a donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prirent possession de leur territoire en les chassant ».'
    reason: Le verbe hébreu peut désigner la prise de possession obtenue par l’éviction des habitants précédents.
  - marker: b
    text: 'Littéralement : « les détruisirent de devant eux ».'
    reason: L’expression idiomatique hébraïque évoque leur élimination hors de la présence des descendants d’Ésaü.
  - marker: c
    text: 'Ou : « le pays de sa possession » ; le terme hébreu peut désigner un héritage attribué ou la possession qui en résulte.'
    reason: Le nom hébreu exprime à la fois la notion d’héritage reçu et celle de possession.
lexical_decisions:
- source_word: הַחֹרִים
  choice: les Horites
  rationale: « Horites » est le nom conventionnel en français de ce peuple qui habitait Séir.
- source_word: לְפָנִים
  choice: autrefois
  rationale: L’expression a ici un sens temporel et renvoie à une époque antérieure.
- source_word: יִירָשׁוּם
  choice: les dépossédèrent
  rationale: Dans ce contexte territorial, ירשׁ désigne la prise de possession qui évince les occupants précédents. « Dépossédèrent » maintient ensemble les idées d’expulsion et d’appropriation.
- source_word: וַיַּשְׁמִידוּם
  choice: les exterminèrent
  rationale: שׁמד exprime une destruction violente. « Exterminèrent » en conserve la force dans ce contexte de disparition d’un peuple du territoire.
- source_word: מִפְּנֵיהֶם
  choice: en les faisant disparaître de devant eux
  rationale: Cette formulation rend l’image hébraïque de l’élimination hors de leur présence sans donner au français « devant eux » le simple sens spatial de « sous leurs yeux ».
- source_word: תַּחְתָּם
  choice: à leur place
  rationale: Le contexte indique que les descendants d’Ésaü remplacèrent les anciens habitants sur leur territoire.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: comme Israël l’a fait
  rationale: Le passé composé rend naturellement en français la comparaison historique formulée par le texte.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: pour le pays qui était sa possession
  rationale: יְרֻשָּׁה peut désigner un bien reçu en héritage et possédé. La formulation conserve le singulier collectif lié à « Israël » tout en restant intelligible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לָהֶם
  choice: leur
  rationale: 'Le pluriel hébreu est conservé : après le singulier collectif « Israël », le pronom renvoie aux membres du peuple.'
theological_decisions:
- issue: Point de référence de la comparaison avec ce qu’Israël a fait au pays de sa possession
  choice: Conserver la comparaison comme un énoncé historique, sans en résoudre les questions chronologiques ou rédactionnelles.
  alternative: Reformuler pour éviter de laisser entendre qu’Israël avait déjà pris possession du pays, ou traiter la proposition comme une glose ultérieure.
  rationale: Le texte hébreu reçu présente explicitement cette comparaison. La traduction la maintient sans harmonisation ni hypothèse critique ajoutée.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: L’Éternel ou le Seigneur
  rationale: La translittération préserve le caractère personnel du nom divin présent dans le texte source.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement explicitée pour éviter que « devant eux » soit compris comme « sous leurs yeux ». Le passage du singulier collectif « Israël/sa » au pluriel « leur » est conservé conformément à l’hébreu.
