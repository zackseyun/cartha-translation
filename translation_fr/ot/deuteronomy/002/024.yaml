source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: fr
  text: Levez-vous, partez et franchissez le torrent de l’Arnon[a]. Vois, j’ai livré entre tes mains Sihôn, roi de Heshbon, l’Amorite, ainsi que son pays. Commence à en prendre possession[b] et engage le combat contre lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le ouadi de l’Arnon », « le ravin de l’Arnon » ou « la vallée de l’Arnon »; le mot hébreu peut désigner un cours d’eau, son lit ou la vallée qu’il traverse.
    reason: lexical_alternative
  - marker: b
    text: Ou « Commence à le déposséder ». Le verbe hébreu peut signifier « prendre possession » ou « déposséder »; ici, le pays de Sihôn vient d’être mentionné.
    reason: lexical_alternative
  - marker: c
    text: Ou « provoque-le à la guerre » ou « entre en guerre contre lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: Levez-vous, partez
  rationale: Les deux impératifs pluriels lancent le peuple en mouvement. « Levez-vous » conserve le premier appel, tandis que « partez » rend naturellement נסע dans ce contexte de déplacement.
- source_word: וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן
  choice: et franchissez le torrent de l’Arnon
  rationale: עבר avec un lieu géographique exprime le franchissement. נחל peut désigner le cours d’eau, son lit ou la vallée encaissée; « torrent » est une désignation française traditionnelle et intelligible, avec l’ambiguïté précisée en note.
- source_word: רְאֵ֣ה
  choice: Vois
  rationale: L’impératif est au singulier, conformément au discours adressé à Israël comme entité collective. « Vois » conserve ce changement de nombre.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: j’ai livré entre tes mains
  rationale: Le parfait présente le don comme accompli, et l’expression française « livrer entre les mains » restitue l’idée de mise sous pouvoir sans être opaque.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: Sihôn, roi de Heshbon, l’Amorite
  rationale: Cette formulation suit l’ordre appositionnel de l’hébreu et conserve à la fois le titre royal et l’identification ethnique.
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: ainsi que son pays
  rationale: אֶרֶץ désigne ici le domaine soumis au roi. « Pays » est naturel en français et évite de confondre le territoire entier avec le sol au sens matériel.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: Commence à en prendre possession
  rationale: החל marque le commencement, tandis que ירש peut signifier prendre possession ou déposséder. Le pronom « en » renvoie au pays immédiatement mentionné.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: et engage le combat contre lui
  rationale: La construction exprime l’entrée dans les hostilités. « Engager le combat » est idiomatique et garde la portée militaire sans réduire le sens à une simple provocation.
theological_decisions:
- issue: Don divin accompli et action humaine dans la conquête
  choice: Conserver à la fois l’accompli « j’ai livré » et les impératifs « commence » et « engage »
  alternative: Transformer le parfait en promesse future (« je livrerai ») ou faire de ירש principalement « déposséder » dans le texte
  rationale: L’hébreu juxtapose le don souverain présenté comme accompli et l’action encore exigée d’Israël. La traduction préserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs pluriels du début puis les formes singulières adressées à Israël collectivement sont maintenus. Les notes conservent les ambiguïtés géographique et verbale réelles de l’hébreu.
