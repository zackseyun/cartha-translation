  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: fr
  text: Vous avez assez longtemps tourné autour de cette région montagneuse[a] ; prenez la direction du nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette montagne ». Le mot hébreu peut désigner une montagne ou une région montagneuse ; ici, le contexte du voyage favorise ce dernier sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם סֹב
  choice: Vous avez assez longtemps tourné
  rationale: 'L’expression רַב לָכֶם marque ici la suffisance : le déplacement circulaire a duré assez longtemps. Cette formulation française l’unit naturellement à סֹב, de סבב, « tourner autour ».'
- source_word: אֶת הָהָר הַזֶּה
  choice: autour de cette région montagneuse
  rationale: הַר peut désigner une montagne précise ou une zone montagneuse. Dans cet itinéraire, le sens régional convient bien, tout en signalant en note l’autre possibilité.
- source_word: פְּנוּ לָכֶם
  choice: prenez la direction
  rationale: L’impératif de פנה commande un changement d’orientation. « Prenez la direction » est idiomatique en français de voyage ; le datif לָכֶם n’appelle pas ici de traduction distincte naturelle.
- source_word: צָפֹנָה
  choice: du nord
  rationale: La terminaison directionnelle indique un mouvement vers le nord ; avec « prendre la direction », « du nord » en exprime clairement la portée.
