source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: fr
  text: Seulement, tu ne t’es approché ni du pays des fils d’Ammon[a], ni d’aucune partie de la rive du torrent du Yabboq[b], ni des villes de la région montagneuse, ni de quoi que ce soit que Yahweh notre Dieu nous avait ordonné de ne pas approcher[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « du pays des Ammonites ». Littéralement : « du pays des fils d’Ammon ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de toute main du torrent du Yabboq » ; cette expression désigne son côté, sa rive ou les lieux situés le long de son cours.'
    reason: cultural_note
  - marker: c
    text: 'L’hébreu dit littéralement : « et tout ce que Yahweh notre Dieu nous avait commandé », sans préciser l’objet du commandement. La formulation « de ne pas approcher » explicite le sens spatial suggéré par le contexte et par le verbe précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Seulement
  rationale: Introduit l’exception qui limite le résumé précédent des conquêtes d’Israël, tout en restant proche de la formulation hébraïque.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: du pays des fils d’Ammon
  rationale: Conserve la tournure hébraïque et le nom ancestral Ammon; « pays des Ammonites » est indiqué comme formulation plus idiomatique.
- source_word: לֹא קָרַבְתָּ
  choice: tu ne t’es pas approché
  rationale: Rend le sens spatial de קרב sans préciser indûment qu’il s’agissait nécessairement d’une attaque militaire.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: d’aucun endroit le long du torrent du Yabboq
  rationale: Exprime naturellement, dans la portée de la négation, l’ensemble des lieux situés sur le côté ou le long du cours d’eau; « torrent » convient ici à נחל.
- source_word: וְעָרֵי הָהָר
  choice: ni des villes de la région montagneuse
  rationale: Dans ce contexte, הָהָר désigne une zone de relief ou de hautes terres plutôt qu’une montagne isolée.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: ni de rien de ce au sujet de quoi … nous avait donné un ordre
  rationale: Préserve l’ellipse de l’hébreu, qui ne précise pas explicitement l’objet ou la teneur de l’ordre, et évite de transformer sans note « commander » en « interdire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement la désignation relationnelle et possessive de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël; « Yahweh » le représente directement.
- issue: Sens contextuel de צִוָּה dans la proposition finale
  choice: nous avait donné un ordre
  alternative: nous avait interdit d’approcher
  rationale: Le contexte suggère un ordre restrictif, mais l’hébreu dit simplement « avait commandé » et laisse son complément implicite; le texte principal conserve cette ellipse sans résoudre entièrement sa portée.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement singulier reflète l’adresse collective à Israël. La série négative est explicitée par « d’aucun » et « ni » afin de produire une syntaxe française naturelle, tandis que la dernière proposition garde l’ellipse et l’ambiguïté de l’hébreu.
