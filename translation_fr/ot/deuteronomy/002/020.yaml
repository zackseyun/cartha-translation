  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: fr
  text: Ce pays est lui aussi considéré comme un pays des Rephaïm[a]. Les Rephaïm y habitaient autrefois[b], mais les Ammonites les appellent Zamzoummim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pays des Rephaïm ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom « Rephaïm » peut désigner un peuple ancien que la tradition associait à une très grande taille ; certaines traductions rendent ici ce nom par « géants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: un pays des Rephaïm
  rationale: Le nom אֶרֶץ désigne un pays ou un territoire. La tournure indéfinie convient au contexte explicatif et « Rephaïm » est conservé comme nom de peuple plutôt qu’interprété par « géants ».
- source_word: תֵּחָשֵׁב
  choice: est considéré comme
  rationale: Le nifal de חשׁב exprime ici le fait d’être tenu ou compté pour quelque chose; cette formulation française garde le passif et reste naturelle.
- source_word: אַף הִוא
  choice: lui aussi
  rationale: L’expression rattache ce territoire à ceux qui viennent d’être évoqués et marque l’ajout de façon idiomatique.
- source_word: רְפָאִים
  choice: les Rephaïm
  rationale: Dans ce contexte, le terme fonctionne comme un ethnonyme mis en parallèle avec le nom employé par les Ammonites; la translittération préserve cette fonction sans imposer l’interprétation « géants ».
- source_word: יָשְׁבוּ בָהּ
  choice: y habitaient
  rationale: Le verbe ישׁב signifie ici habiter ou vivre dans le pays; l’imparfait français convient à la situation passée et durative.
- source_word: לְפָנִים
  choice: autrefois
  rationale: L’adverbe renvoie à une époque antérieure; « autrefois » est clair et courant.
- source_word: וְהָעַמֹּנִים
  choice: mais les Ammonites
  rationale: La conjonction introduit ici un contraste entre l’appellation narrative « Rephaïm » et l’appellation ammonite; « mais » rend naturellement cette relation discursive.
- source_word: יִקְרְאוּ לָהֶם
  choice: les appellent
  rationale: L’imparfait hébreu peut exprimer une désignation usuelle; le présent français restitue cette valeur de dénomination.
- source_word: זַמְזֻמִּים
  choice: les Zamzoummim
  rationale: Il s’agit d’un nom de peuple, transcrit en français plutôt que traduit.
theological_decisions:
- issue: Identification des Rephaïm
  choice: Conserver l’ethnonyme « Rephaïm » dans le texte
  alternative: Traduire par « géants »
  rationale: Le passage présente d’abord un nom de peuple, puis indique le nom que lui donnent les Ammonites. Traduire directement par « géants » trancherait une question interprétative que l’hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit la structure explicative de l’hébreu tout en évitant les archaïsmes. Les ethnonymes sont translittérés selon un usage francophone transparent.
