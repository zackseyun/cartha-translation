  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: fr
  text: Nous n’avons pris pour nous que le bétail et le butin des villes que nous avions prises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: seulement
  rationale: Marque la restriction par rapport à la destruction totale mentionnée au verset précédent, tout en conservant une formulation française naturelle.
- source_word: הַבְּהֵמָה
  choice: le bétail
  rationale: Le terme désigne ici les animaux domestiques emportés comme butin de guerre.
- source_word: בָּזַזְנוּ לָנוּ
  choice: nous avons pris pour nous-mêmes
  rationale: « Pris » exprime naturellement en français l’appropriation du butin, tandis que « pour nous-mêmes » conserve la valeur bénéficiaire de לָנוּ. L’idée de pillage reste explicite grâce au contexte et au nom « butin » qui suit.
- source_word: וּשְׁלַל
  choice: et le butin
  rationale: שָׁלָל désigne les biens saisis à la guerre; « butin » est le terme français courant et précis.
- source_word: הֶעָרִים
  choice: des villes
  rationale: « Villes » est le sens ordinaire de עִיר dans ce récit de conquête.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: dont nous nous étions emparés
  rationale: Cette expression rend le sens militaire de לכד et l’antériorité logique de la prise des villes par rapport au partage de leur butin.
