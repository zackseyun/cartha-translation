  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: fr
  text: De plus, la main de Yahweh fut contre eux, pour les jeter dans la confusion[a] et les faire disparaître du milieu du camp, jusqu’à ce qu’ils aient tous disparu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frapper de panique » ou « les mettre en déroute » ; le verbe hébreu peut désigner la panique ou la confusion provoquée comme jugement divin.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à leur disparition complète » ou « jusqu’à ce qu’ils aient péri ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Rend la valeur à la fois additive et emphatique de l’expression, tout en assurant un enchaînement naturel avec le verset précédent.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: Conserve l’image hébraïque de la « main » comme expression de la puissance agissante de Dieu et rend explicitement le nom divin.
- source_word: בָם
  choice: contre eux
  rationale: Dans ce contexte de jugement, la préposition marque une action hostile dirigée contre le groupe concerné.
- source_word: לְהֻמָּם
  choice: pour les jeter dans la confusion
  rationale: Le verbe המם peut exprimer la panique, la confusion ou la déroute provoquée par une intervention divine; cette formulation préserve ce champ de sens sans le réduire d’emblée à la destruction.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: au milieu du camp
  rationale: Formulation française naturelle qui situe l’action au sein du camp; la disparition progressive du groupe est ensuite exprimée par la proposition finale.
- source_word: עַד תֻּמָּם
  choice: jusqu’à ce qu’ils aient tous disparu
  rationale: Exprime l’achèvement complet du groupe sous le jugement, tout en évitant le ton familier qu’aurait une traduction comme « jusqu’à ce qu’ils soient liquidés ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Nature de l’action divine exprimée par המם
  choice: les jeter dans la confusion
  alternative: les détruire
  rationale: Le choix principal garde la nuance de panique ou de désorganisation attachée au verbe et distingue cette action de son résultat final, leur disparition complète.
translation_notes:
  register: Français international moderne, sobre et digne. L’idiome concret « la main de Yahweh » est conservé; les formulations familières ou inutilement techniques sont évitées.
