base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: fr
  text: Yahweh, notre Dieu, le livra en notre pouvoir[a], et nous le frappâmes, ainsi que ses fils[b] et tout son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le donna devant nous » ; dans ce contexte, l’expression signifie que Yahweh le remit au pouvoir d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: Le texte consonantique porte « son fils » ; le qeré, la lecture traditionnelle, lit « ses fils ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: le livra en notre pouvoir
  rationale: Dans ce contexte de guerre, נתן suivi de לְפָנֵינוּ, littéralement « le donna devant nous », exprime la remise de l’ennemi au pouvoir d’Israël. Cette formulation française rend clairement l’idiome sans en affaiblir la portée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le nom avec suffixe de première personne du pluriel signifie directement « notre Dieu ».
- source_word: וַנַּךְ אֹתוֹ
  choice: nous le frappâmes
  rationale: Le verbe נכה désigne ici l’action militaire menée contre Sihôn. « Frappâmes » en conserve le sens verbal direct, tandis que le contexte immédiat indique une défaite mortelle.
- source_word: בנו
  choice: ses fils
  rationale: Le texte consonantique permet la lecture singulière « son fils », mais la tradition de lecture massorétique comprend ici un pluriel, adapté au compte rendu collectif de la bataille.
- source_word: כָּל עַמּוֹ
  choice: tout son peuple
  rationale: עַם signifie normalement « peuple ». La traduction directe préserve l’étendue de l’expression sans la restreindre explicitement à l’armée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de le remplacer par un titre traditionnel.
- issue: Portée de בנו
  choice: ses fils
  alternative: son fils
  rationale: La vocalisation massorétique et le contexte soutiennent le pluriel, mais la forme consonantique peut être comprise au singulier; l’ambiguïté textuelle est donc signalée en note.
- issue: Force de וַנַּךְ
  choice: nous le frappâmes
  alternative: nous l’abattîmes / nous le vainquîmes
  rationale: La formulation retenue reste proche du verbe hébreu et évite de choisir inutilement entre l’acte de tuer et l’idée plus générale de vaincre, même si le contexte implique une issue décisive.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit. La reprise « lui, ses fils et tout son peuple » coordonne clairement tous les compléments du verbe sans alourdir la phrase.
