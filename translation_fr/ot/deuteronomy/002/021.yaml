  text: עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִ֑ים וַ/יַּשְׁמִידֵ֤/ם יְהוָה֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּירָשֻׁ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: fr
  text: un peuple grand, nombreux et de haute taille, comme les Anakim[a]. Yahweh les détruisit devant eux, puis ceux-ci les dépossédèrent et s’installèrent à leur place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Anakites ».'
    reason: Variante française du nom de peuple translittéré עֲנָקִים.
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: un peuple grand et nombreux
  rationale: Le singulier collectif « peuple » est conservé. « Grand » et « nombreux » distinguent les deux adjectifs hébreux tout en restant naturels en français.
- source_word: רָם
  choice: de haute taille
  rationale: Dans la comparaison avec les Anakim, l’adjectif désigne vraisemblablement la stature physique. « De haute taille » est idiomatique et digne.
- source_word: כָּעֲנָקִים
  choice: comme les Anakim
  rationale: La préposition marque une comparaison. Le nom du peuple est translittéré, tandis qu’une forme française alternative est signalée en note.
- source_word: וַיַּשְׁמִידֵם
  choice: les détruisit
  rationale: Le hifil de שׁמד exprime leur destruction ou élimination. « Détruisit » garde la force du verbe sans préciser davantage que l’hébreu la manière ou l’étendue.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: Cette formulation française conserve l’image spatiale de l’expression hébraïque tout en indiquant que Yahweh a écarté le peuple face aux descendants d’Ésaü.
- source_word: וַיִּירָשֻׁם
  choice: ceux-ci les dépossédèrent
  rationale: Dans ce contexte, ירשׁ désigne la prise de possession aux dépens des habitants antérieurs. « Ceux-ci » clarifie naturellement le changement de référent entre les deux pronoms pluriels.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: s’installèrent à leur place
  rationale: La traduction exprime clairement l’occupation de remplacement indiquée par תַחְתָּם, dans un français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. La proposition demeure un fragment syntaxique puisqu’elle poursuit la description commencée au verset précédent. Le marqueur [a] est placé immédiatement après le terme qu’il explique.
