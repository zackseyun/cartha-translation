  - marker: a
    text: 'Littéralement : « Et Yahweh me dit, en disant ». Le dernier terme hébreu introduit les paroles rapportées au verset suivant ; en français, cette fonction est exprimée naturellement par les deux-points.'
    reason: Précision sur la forme littérale et sur la valeur introductive de לֵאמֹר.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français, et le passé simple « dit » convient au registre narratif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa fonction dans le texte hébreu, plutôt que remplacé par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément indirect « me » rend naturellement en français la préposition אֶל accompagnée du suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Cet infinitif introduit les paroles qui suivent au verset suivant. En français naturel, les deux-points en expriment la fonction sans ajouter le tour redondant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. « Yahweh » en préserve le caractère de nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple maintient un registre narratif biblique naturel sans archaïsme ; les deux-points annoncent explicitement le discours du verset suivant.
