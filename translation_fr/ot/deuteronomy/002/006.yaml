  text: אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וַ/אֲכַלְתֶּ֑ם וְ/גַם מַ֜יִם תִּכְר֧וּ מֵ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וּ/שְׁתִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: fr
  text: Vous leur achèterez de la nourriture contre de l’argent, afin de manger ; vous leur achèterez aussi de l’eau contre de l’argent, afin de boire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « et vous mangerez […] et vous boirez ». La coordination hébraïque peut également exprimer ici le résultat visé par l’achat des provisions.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: אֹכֶל
  choice: nourriture
  rationale: Terme général désignant ce qui se mange ou les provisions, sans le limiter aux céréales.
- source_word: תִּשְׁבְּרוּ
  choice: vous achèterez
  rationale: Dans ce contexte commercial, le verbe désigne l’achat de nourriture.
- source_word: מֵאִתָּם
  choice: leur
  rationale: Le pronom complément avec « acheter » exprime naturellement en français la source auprès de laquelle l’achat se fait.
- source_word: בַּכֶּסֶף
  choice: contre de l’argent
  rationale: Cette formulation française exprime clairement le paiement, tout en reflétant כֶּסֶף, qui peut désigner l’argent métal ou la monnaie.
- source_word: וַאֲכַלְתֶּם
  choice: afin de pouvoir manger
  rationale: Dans cette suite d’instructions, la coordination hébraïque peut indiquer le résultat visé de l’achat; la note conserve la formulation plus littérale.
- source_word: וְגַם
  choice: aussi
  rationale: Rend l’ajout de l’instruction parallèle concernant l’eau.
- source_word: מַיִם
  choice: de l’eau
  rationale: Équivalent français direct et idiomatique dans une construction partitive.
- source_word: תִּכְרוּ
  choice: vous achèterez
  rationale: Malgré le sens possible de « creuser » dans d’autres contextes, le parallélisme avec l’achat de nourriture et la mention du paiement imposent ici le sens d’acquérir par achat.
- source_word: וּשְׁתִיתֶם
  choice: afin de pouvoir boire
  rationale: Comme pour le verbe « manger », cette formulation exprime naturellement le résultat visé tout en signalant en note l’alternative formelle.
theological_decisions:
- issue: Portée éthique du commandement concernant les ressources d’Édom
  choice: Israël doit payer la nourriture et l’eau qu’il reçoit, plutôt que de s’en emparer sans compensation.
  alternative: 'Une traduction strictement coordonnée dirait : « et vous mangerez… et vous boirez » sans expliciter le rapport de but ou de résultat.'
  rationale: Le contexte commande une acquisition légitime des provisions. La traduction explicite le résultat visé sans ajouter d’obligation étrangère au texte, tandis que la note préserve l’ambiguïté syntaxique de la coordination hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le futur a valeur d’injonction dans le contexte. « Contre de l’argent » est plus naturel que « avec de l’argent » pour exprimer l’échange commercial; la note préserve la tension entre coordination formelle et valeur de but ou de résultat.
