  rationale: La translittération rend le nom divin personnel יהוה plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Avec le verbe « parler », le pronom complément indirect « me » rend naturellement l’hébreu « à moi » en français.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'La formule hébraïque introduit le discours direct. « En ces termes : » est une tournure française naturelle qui évite le calque pesant « disant » tout en conservant sa fonction.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la progression narrative et introduit naturellement la parole directe annoncée au verset suivant.
