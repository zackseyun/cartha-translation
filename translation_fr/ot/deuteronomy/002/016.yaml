  source_fidelity: Le texte hébreu exprime l’achèvement de la mort de tous les « hommes de guerre » et leur disparition du milieu du peuple. La formulation proposée rend globalement ces deux éléments, mais « ainsi » ajoute une liaison explicative absente du texte source.
  naturalness: « Eurent achevé de mourir » est soutenu et quelque peu marqué, mais il est intelligible et rend utilement l’idée d’un processus arrivé à son terme. La coordination avec « eurent ainsi disparu » alourdit légèrement la phrase; retirer « ainsi » améliore la sobriété tout en conservant le sens.
