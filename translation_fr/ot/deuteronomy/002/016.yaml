  text: And when all the men of war had finished dying from among the people,[a]
translation:
  language: fr
  text: Lorsque tous les hommes de guerre[a] eurent achevé de mourir et eurent disparu du milieu du peuple,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les combattants ». L’hébreu dit littéralement « les hommes de guerre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Lorsque
  rationale: La tournure narrative avec כַאֲשֶׁר introduit ici une proposition temporelle qui se poursuit au verset suivant. « Lorsque » l’exprime naturellement en français sans alourdir la phrase par un littéral « il arriva que ».
- source_word: תַּמּוּ ... לָמוּת
  choice: eurent achevé de mourir
  rationale: תמם suivi de l’infinitif « mourir » présente la mort de ce groupe comme un processus arrivé à son terme. La formulation, légèrement inhabituelle en français, conserve cette nuance explicite plutôt que de la réduire au simple « furent morts ».
- source_word: כָּל אַנְשֵׁי הַמִּלְחָמָה
  choice: tous les hommes de guerre
  rationale: Cette expression garde le sens masculin et militaire de l’hébreu. « Hommes de guerre » reste intelligible dans un registre biblique digne; « combattants » est signalé en note comme équivalent plus courant.
- source_word: מִקֶּרֶב הָעָם
  choice: et eurent ainsi disparu du peuple
  rationale: מִקֶּרֶב marque l’élimination hors du groupe, et non seulement le lieu où ces hommes moururent. L’explicitation « disparu du peuple » rend cette valeur en français naturel, tandis que « ainsi » relie leur disparition à leur mort sans ajouter une seconde action indépendante.
