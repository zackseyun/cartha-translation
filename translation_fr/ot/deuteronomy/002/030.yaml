  rationale: La révision élimine l’ajout interprétatif « on le voit » dans la formule finale et affine la note lexicale. Elle conserve « affermi son cœur » dans le texte afin de distinguer אמץ de « endurcir », tout en signalant explicitement son effet contextuel d’obstination.
