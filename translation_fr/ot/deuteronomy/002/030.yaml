  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: fr
  text: Mais Sihôn, roi de Heshbôn, ne voulut pas nous laisser traverser son territoire, car Yahweh, ton Dieu, avait endurci son esprit et affermi son cœur[a], afin de le livrer entre tes mains, comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendu son cœur obstiné ». Le verbe hébreu peut signifier « rendre fort » ou « affermir », mais, dans ce contexte, cette fermeté exprime l’obstination de Sihôn.'
    reason: Alternative lexicale et nuance contextuelle de וְאִמֵּץ.
lexical_decisions:
- source_word: אָבָה
  choice: ne voulut pas
  rationale: Exprime naturellement en français le refus de consentir, tout en conservant la nuance de volonté interne.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: nous laisser traverser son territoire
  rationale: Le hiphil de עבר exprime ici la permission de passer, et le pronom dans בּוֹ renvoie contextuellement au domaine de Sihôn; « territoire » explicite ce référent sans suggérer sa personne.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: avait endurci son esprit
  rationale: Conserve le verbe concret « endurcir » et le terme anthropologique רוּחַ, ainsi que leur portée théologique.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: et affermi son cœur
  rationale: אמץ signifie fondamentalement rendre fort ou ferme. « Affermi » préserve ce sens lexical et le parallélisme avec l’endurcissement de l’esprit; une note signale la valeur contextuelle possible d’obstination.
- source_word: לְמַעַן
  choice: afin de
  rationale: Marque clairement la finalité exprimée par la construction hébraïque.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: le livrer entre tes mains
  rationale: Rend idiomatiquement נתן ביד, qui signifie placer quelqu’un au pouvoir d’un autre, tout en conservant l’image des mains.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Rend en français actuel l’idée deutéronomique d’un état de fait présent et manifeste, sans calque opaque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Endurcissement divin et refus humain
  choice: Conserver à la fois le refus volontaire de Sihôn et l’action de Yahweh qui endurcit son esprit et affermit son cœur.
  alternative: Présenter l’endurcissement comme une simple permission divine, ou n’évoquer que l’obstination propre de Sihôn.
  rationale: L’hébreu affirme explicitement les deux réalités sans expliquer leur articulation; la traduction ne doit ni atténuer l’action divine ni supprimer la responsabilité volitive de Sihôn.
- issue: Valeur de וְאִמֵּץ אֶת־לְבָבוֹ
  choice: « affermi son cœur », avec une note indiquant la nuance contextuelle d’obstination.
  alternative: « rendu son cœur obstiné »
  rationale: Le sens lexical de אמץ est « rendre fort, affermir ». Dans ce contexte, cette fermeté se manifeste comme de l’obstination, mais le texte emploie un verbe distinct de « endurcir »; la formulation et la note préservent ensemble la distinction et la portée contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Sihôn » et « Heshbôn » suivent des translittérations françaises usuelles. Le passé antérieur implicite de l’action divine est rendu par le plus-que-parfait. L’image « entre tes mains » est conservée, tandis que l’idiome final est formulé naturellement.
