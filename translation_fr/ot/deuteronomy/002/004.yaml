source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: fr
  text: 'Et donne cet ordre au peuple : « Vous allez traverser[a] le territoire[b] de vos frères, les fils d’Ésaü, qui habitent en Séir. Ils auront peur de vous ; prenez donc bien garde à vous[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous traversez » ou « vous traverserez ». Le participe hébreu peut désigner ici une action imminente.
    reason: lexical_alternative
  - marker: b
    text: Ou « la frontière ». Le terme hébreu peut désigner une ligne frontalière ou le territoire qu’elle délimite.
    reason: lexical_alternative
  - marker: c
    text: Ou « et prenez bien garde à vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: donne cet ordre
  rationale: L’impératif de צוה exprime une directive investie d’autorité. « Donne cet ordre » en conserve la force dans un français naturel.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne ici collectivement le peuple d’Israël ; « le peuple » est le terme français courant et précis.
- source_word: אַתֶּם עֹבְרִים
  choice: vous allez traverser
  rationale: Le participe accompagné du pronom indépendant exprime ici une action imminente. « Vous allez traverser » rend naturellement cette valeur sans transformer inutilement la forme en futur catégorique.
- source_word: בִּגְבוּל
  choice: le territoire
  rationale: גְּבוּל peut désigner soit une frontière, soit l’étendue qu’elle délimite. Dans ce contexte de déplacement, « territoire » convient mieux au domaine géographique traversé.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: vos frères, les fils d’Ésaü
  rationale: Cette formulation conserve à la fois le langage explicite de parenté et l’expression généalogique de l’hébreu.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: qui habitent en Séir
  rationale: Le participe de ישב indique une résidence établie. « Habitent » est actuel, clair et digne.
- source_word: וְיִירְאוּ מִכֶּם
  choice: ils auront peur de vous
  rationale: ירא construit avec מן exprime ici la peur éprouvée devant Israël. Cette tournure française est directe et idiomatique.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: prenez donc bien garde à vous
  rationale: 'Le niphal de שמר a ici une valeur réfléchie : se garder, veiller sur sa conduite. « Bien » rend l’intensité de מְאֹד, tandis que « donc » fait ressortir le lien contextuel avec la crainte des Édomites.'
theological_decisions:
- issue: Langage de parenté appliqué aux Édomites
  choice: vos frères, les fils d’Ésaü
  alternative: vos proches, les descendants d’Ésaü
  rationale: Le texte fonde implicitement la conduite d’Israël envers Édom sur une parenté généalogique. « Frères » préserve cette affirmation forte sans la réduire à une simple proximité ethnique.
- issue: Lien entre la peur des Édomites et la vigilance d’Israël
  choice: prenez donc bien garde à vous
  alternative: et prenez bien garde à vous
  rationale: Le contexte permet de comprendre le waw comme introduisant la conséquence pratique de la peur annoncée. La note conserve toutefois la possibilité d’une simple coordination, sans imposer une relation logique plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde l’ouverture coordonnée par « Et », le discours direct, le langage familial « frères » et l’expression généalogique « fils d’Ésaü ». Les notes signalent les ambiguïtés réelles du participe, de גְּבוּל et de la valeur du waw final.
