source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: fr
  text: 'J’envoyai alors, depuis le désert de Qedémoth, des messagers à Sihôn, roi de Heshbôn, avec des paroles de paix[a], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une proposition de paix ». L’hébreu dit littéralement « des paroles de paix », expression qui peut désigner une démarche diplomatique pacifique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: J’envoyai donc
  rationale: Le waw consécutif fait progresser le récit. « Donc » rend ici l’enchaînement logique et narratif, tandis que le passé simple convient au registre narratif biblique soutenu.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte diplomatique humain, le terme désigne des représentants envoyés, et non des êtres célestes. « Messagers » reste clair et moins interprétatif qu’« émissaires ».
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: depuis le désert de Qedémoth
  rationale: מִדְבָּר désigne une région aride ou peu habitée. « Désert » est naturel en français et conserve la relation avec le nom de lieu Qedémoth.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: à Sihôn, roi de Heshbôn
  rationale: La préposition marque le destinataire de la mission. Le titre royal est rendu comme une apposition naturelle en français.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: avec des paroles de paix
  rationale: Cette formulation conserve de près l’expression hébraïque, littéralement « paroles de paix », sans trancher entre des propos pacifiques et une proposition diplomatique de paix.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: Formule hébraïque usuelle introduisant le discours direct qui commence au verset suivant. Le deux-points signale clairement cette continuation.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. Le passé simple maintient un ton narratif soutenu sans archaïsme marqué. Les noms propres suivent une translittération proche de l’hébreu : Qedémoth, Sihôn, Heshbôn.'
