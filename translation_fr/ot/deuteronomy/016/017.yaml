source:
  edition: WLC
  text: אִ֖ישׁ כְּ/מַתְּנַ֣ת יָד֑/וֹ כְּ/בִרְכַּ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: fr
  text: Chacun donnera selon les moyens dont il dispose[a], selon la bénédiction que Yahweh, ton Dieu, t’a accordée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon le don de sa main », expression désignant ce que chacun a à sa disposition pour donner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Chacun
  rationale: Le singulier אִישׁ a ici une valeur distributive. « Chacun » l’exprime naturellement en français sans introduire une opposition de genre absente de la portée pratique du commandement.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: selon ce que sa main peut offrir
  rationale: La préposition כְּ marque la proportion, tandis que l’expression littérale « le don de sa main » désigne ce que chacun a à sa disposition pour donner. La formulation retenue conserve l’image de la main tout en rendant l’idiome intelligible.
- source_word: כְּבִרְכַּת
  choice: selon la bénédiction
  rationale: 'Le second כְּ exprime de nouveau la proportion : le don doit correspondre à la bénédiction reçue.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne masculine singulière est rendu par « ton », conformément à l’adresse directe caractéristique du Deutéronome.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: que … t’a accordée
  rationale: La proposition relative se rapporte à « la bénédiction ». « Accorder » exprime naturellement en français une bénédiction donnée par Dieu, sans modifier le sens du verbe נָתַן.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom divin et évite de le remplacer par un titre.
- issue: Nature de la bénédiction
  choice: Conserver le terme général « bénédiction »
  alternative: Expliciter par « biens » ou « prospérité »
  rationale: Le contexte implique les ressources reçues de Dieu, mais le mot hébreu demeure plus large. La traduction préserve cette amplitude théologique et sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme unité collective. L’image de la main est maintenue sous une forme idiomatiquement claire.
