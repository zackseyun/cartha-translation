revisions:
- from: Tu célébreras alors la fête des Semaines en l’honneur de Yahvé, ton Dieu, en apportant une offrande volontaire selon tes moyens[a], à la mesure de la bénédiction que Yahvé, ton Dieu, t’aura accordée.
  to: Tu célébreras alors la fête des Semaines pour Yahvé, ton Dieu, en lui offrant un don volontaire de ta main, selon la bénédiction que Yahvé, ton Dieu, t’aura accordée[a].
  rationale: 'La révision supprime la redondance introduite par « selon tes moyens » tout en conservant les éléments du texte hébreu : la fête célébrée pour Yahvé, le don volontaire donné de la main du fidèle et sa proportion à la bénédiction divine. La note formule l’alternative littérale sans qualifier indûment le texte d’incertain.'
