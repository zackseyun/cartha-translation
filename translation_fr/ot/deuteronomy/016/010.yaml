review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’injonction de célébrer la fête, sa consécration à Yahvé et le principe selon lequel le don est proportionné à la bénédiction reçue. Toutefois, « selon tes moyens » anticipe et reformule l’idée ensuite exprimée par « à la mesure de la bénédiction », ce qui crée une redondance et atténue la construction hébraïque liant explicitement le don volontaire à l’action personnelle du donateur.
  naturalness: Le français est globalement clair et de registre approprié. Une formulation plus directe évite la double expression de proportion et rend plus naturellement la relation entre l’offrande et la bénédiction.
  terminology: « Yahvé, ton Dieu » est cohérent avec le tétragramme et avec le français biblique moderne. « Fête des Semaines » et « offrande volontaire » conviennent. « Don volontaire de ta main » conserve, sans lourdeur excessive, l’image hébraïque d’un don personnellement présenté.
  issues:
  - severity: medium
    issue: Redondance et léger déplacement de la structure de מִסַּת נִדְבַת יָדְךָ … כַּאֲשֶׁר יְבָרֶכְךָ
    rationale: « Selon tes moyens » interprète déjà la proportion, tandis que « à la mesure de la bénédiction » exprime de nouveau le même rapport. Le texte hébreu présente plutôt un don/offrande volontaire personnel, dont la mesure est déterminée par la bénédiction de Yahvé.
  - severity: low
    issue: Note décrivant la formulation comme « incertaine »
    rationale: La syntaxe de l’expression est compacte et admet plusieurs rendus idiomatiques, mais elle n’est pas textuellement incertaine. La note devrait présenter une traduction littérale ou alternative sans suggérer une incertitude du texte.
