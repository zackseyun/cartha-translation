  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: fr
  text: Tu célébreras alors la fête des Semaines pour Yahvé, ton Dieu, en lui offrant un don volontaire de ta main, selon la bénédiction que Yahvé, ton Dieu, t’aura accordée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la mesure de l’offrande volontaire de ta main que tu donneras ». L’expression souligne que le don est volontaire et proportionné à la bénédiction reçue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu célébreras alors
  rationale: Avec חַג, עשה signifie ici célébrer ou observer une fête. « Alors » rend naturellement l’enchaînement avec les prescriptions précédentes.
- source_word: חַג שָׁבֻעוֹת
  choice: la fête des Semaines
  rationale: Désignation traditionnelle et transparente de cette fête de pèlerinage, liée au décompte des semaines.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: en l’honneur de Yahvé, ton Dieu
  rationale: La préposition ל marque ici l’orientation et la consécration de la fête à Yahvé ; cette tournure est naturelle en français.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: en apportant une offrande volontaire selon tes moyens
  rationale: L’expression difficile associe l’idée de mesure ou de proportion à une offrande volontaire provenant de la main du donateur. La formulation française conserve le caractère volontaire et proportionné sans reproduire littéralement un idiome obscur.
- source_word: אֲשֶׁר תִּתֵּן
  choice: en apportant
  rationale: Le don explicitement mentionné par le relatif hébreu est intégré dans une construction participiale française plus fluide, sans perte de contenu.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: à la mesure de la bénédiction que … t’aura accordée
  rationale: La locution exprime la proportion entre le don et la bénédiction divine. Le futur antérieur convient à une instruction portant sur ce que Dieu aura donné au moment de la fête.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahvé, ton Dieu
  rationale: Le nom divin est translittéré sous sa forme française courante, et la formule d’alliance est conservée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » préserve le caractère de nom propre plutôt que de le remplacer par un titre.
- issue: Rapport entre l’offrande volontaire et la bénédiction divine
  choice: selon tes moyens, à la mesure de la bénédiction
  alternative: un tribut constitué d’une offrande volontaire
  rationale: Le texte lie le montant librement offert à ce que Dieu a accordé, sans fixer de somme ni transformer la contribution en prélèvement obligatoire.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque au membre du peuple. « Selon tes moyens » explicite avec retenue l’idée de mesure, tandis que la note conserve la tournure hébraïque et son incertitude.
