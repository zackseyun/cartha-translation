translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque au peuple considéré collectivement. La tournure impersonnelle « l’on commence » rend l’idiome agricole sans introduire un acteur non précisé par le texte.
