  text: שִׁבְעָ֥ה שָׁבֻעֹ֖ת תִּסְפָּר לָ֑/ךְ מֵ/הָחֵ֤ל חֶרְמֵשׁ֙ בַּ/קָּמָ֔ה תָּחֵ֣ל לִ/סְפֹּ֔ר שִׁבְעָ֖ה שָׁבֻעֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: fr
  text: Tu compteras sept semaines[a]. À partir du moment où l’on commence à mettre la faucille dans les blés sur pied, tu commenceras à compter sept semaines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sept septaines ». Dans ce contexte, cette expression hébraïque désigne sept semaines.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת / שִׁבְעָה שָׁבֻעוֹת
  choice: sept semaines
  rationale: שָׁבֻעוֹת est le terme hébreu courant pour les semaines. Dans ce contexte calendaire, « sept semaines » rend naturellement l’expression, tout en conservant sa répétition dans le verset.
- source_word: תִּסְפָּר לָךְ
  choice: Tu compteras pour toi-même
  rationale: L’imparfait qal de ספר exprime ici une instruction. « Pour toi-même » maintient la référence personnelle explicite portée par לָךְ, malgré une légère insistance inhabituelle en français.
- source_word: מֵהָחֵל
  choice: À partir du moment où l’on commence
  rationale: La préposition מִן suivie de l’infinitif construit marque le point de départ du décompte. Cette formulation en restitue clairement la valeur temporelle.
- source_word: חֶרְמֵשׁ
  choice: la faucille
  rationale: חֶרְמֵשׁ désigne la faucille employée pour la moisson ; l’article défini convient à cet emploi générique en français.
- source_word: בַּקָּמָה
  choice: dans les blés sur pied
  rationale: קָמָה désigne collectivement les céréales encore sur pied. « Mettre la faucille dans les blés sur pied » exprime en français naturel le commencement de la moisson sans préciser une céréale absente de l’hébreu.
- source_word: תָּחֵל לִסְפֹּר
  choice: tu commenceras à compter
  rationale: La construction du hiphil de חלל avec l’infinitif de ספר indique explicitement le commencement de l’action de compter.
