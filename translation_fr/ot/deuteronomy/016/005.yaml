  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: fr
  text: Tu ne pourras pas sacrifier la Pâque[a] dans aucune des villes[b] que Yahweh ton Dieu te donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le sacrifice de la Pâque ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans l’une de tes portes » ; en hébreu, les « portes » peuvent désigner par métonymie une ville ou une localité.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Tu ne pourras pas
  rationale: La tournure avec יכל suivi de l’infinitif a ici une force prohibitive dans un contexte juridique. Le futur français conserve la forme d’incapacité normative de l’hébreu tout en exprimant naturellement l’interdiction.
- source_word: לִזְבֹּחַ
  choice: sacrifier
  rationale: Dans ce contexte cultuel, זבח désigne l’action d’immoler ou d’offrir en sacrifice; « sacrifier » est concis et naturel.
- source_word: הַפָּסַח
  choice: la Pâque
  rationale: פסח peut désigner la fête, la victime ou le sacrifice pascal. Avec « sacrifier », « la Pâque » conserve cette densité sémantique sans préciser indûment l’animal.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: dans l’une des villes
  rationale: Dans le Deutéronome, « portes » fonctionne fréquemment par métonymie pour les villes ou localités. La traduction explicite le référent pour un lecteur moderne, tandis qu’une note conserve l’image hébraïque.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: que Yahweh ton Dieu te donne
  rationale: Le participe נֹתֵן exprime ici l’action en cours ou caractéristique du don. Le présent français convient à la formule deutéronomique. Le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » rend le nom propre de l’alliance sans le remplacer par un titre.
- issue: Référent de הַפָּסַח
  choice: la Pâque
  alternative: le sacrifice de la Pâque; l’agneau pascal
  rationale: Le terme peut désigner la célébration, l’offrande ou la victime. Le contexte sacrificiel oriente le sens, mais la formulation retenue préserve l’ambiguïté lexicale au lieu de préciser qu’il s’agit nécessairement d’un agneau.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse collective au singulier d’Israël. La syntaxe reste proche de l’hébreu, mais « villes » explicite une métonymie qui serait obscure ou trompeuse en français courant.
