source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: fr
  text: 'Trois fois par an, tous les hommes parmi vous se présenteront[a] devant Yahweh votre Dieu, au lieu qu’il choisira : à la fête des Pains sans levain, à la fête des Semaines et à la fête des Cabanes[b]. On ne se présentera pas devant Yahweh les mains vides[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut se traduire littéralement par « être vu » devant Yahweh ; dans ce contexte, il désigne le fait de paraître ou de se présenter devant lui.
    reason: lexical_alternative
  - marker: b
    text: La « fête des Cabanes » est traditionnellement appelée « fête des Tabernacles ».
    reason: alternative_reading
  - marker: c
    text: Venir « les mains vides » signifie venir sans le don ou l’offrande requis.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: se présenteront
  rationale: Le niphal de ראה est littéralement passif ou réfléchi (« seront vus »), mais il fonctionne ici comme une expression cultuelle désignant le fait de paraître ou de se présenter devant Dieu. « Se présenter » est naturel en français et explicite sobrement cette valeur idiomatique.
- source_word: כָל זְכוּרְךָ
  choice: tous les hommes parmi vous
  rationale: Le terme hébreu vise explicitement les personnes de sexe masculin soumises à l’obligation de pèlerinage. Cette formulation préserve la portée masculine sans la tournure peu naturelle « tous vos mâles ».
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: devant Yahweh votre Dieu
  rationale: L’expression hébraïque « la face de » signifie ici la présence de Dieu. « Devant » rend naturellement l’idiome tout en conservant Yahweh comme nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: au lieu qu’il choisira
  rationale: Le futur rend la valeur prospective de l’imparfait hébreu et maintient le thème deutéronomique du lieu choisi par Dieu.
- source_word: חַג הַמַּצּוֹת
  choice: la fête des Pains sans levain
  rationale: Cette désignation transparente rend directement le nom hébreu de la fête et emploie le vocabulaire biblique français courant.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: la fête des Semaines
  rationale: La traduction littérale du nom hébreu évite d’introduire dans ce contexte le nom grec plus tardif « Pentecôte ».
- source_word: חַג הַסֻּכּוֹת
  choice: la fête des Cabanes
  rationale: « Cabanes » exprime concrètement סֻכּוֹת en français moderne; la désignation traditionnelle « fête des Tabernacles » est signalée en note.
- source_word: וְלֹא יֵרָאֶה אֶת־פְּנֵי יְהוָה רֵיקָם
  choice: On ne se présentera pas devant Yahweh les mains vides
  rationale: '« Les mains vides » rend l’idiome cultuel רֵיקָם : venir sans le don ou l’offrande requis. Le pronom indéfini conserve la portée générale de l’interdiction.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée masculine de כָל זְכוּרְךָ
  choice: tous les hommes parmi vous
  alternative: tous vos mâles; chacun de vous
  rationale: La loi désigne explicitement les hommes. La traduction ne neutralise pas cette précision, tout en utilisant une formulation française digne et naturelle.
- issue: Valeur de יֵרָאֶה devant Dieu
  choice: se présenter devant Yahweh
  alternative: être vu devant Yahweh; paraître devant Yahweh
  rationale: La forme hébraïque permet de percevoir une valeur passive ou réfléchie, mais l’usage cultuel exprime ici la comparution devant Dieu. La note conserve l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, clair et digne. Les noms des trois fêtes suivent une structure parallèle. « Tous les hommes parmi vous » conserve la précision juridique masculine sans employer « mâles », trop zoologique en français courant. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
