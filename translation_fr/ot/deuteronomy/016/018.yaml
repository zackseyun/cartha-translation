source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: fr
  text: Tu établiras des juges et des responsables dans toutes tes villes[a] que Yahweh, ton Dieu, te donne, selon tes tribus[b]. Ils jugeront le peuple avec justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans toutes tes portes ». Les portes des villes étaient des lieux d’affaires civiques et judiciaires.
    reason: cultural_note
  - marker: b
    text: Ou « pour tes tribus ». L’expression peut indiquer que ces responsables sont répartis suivant l’organisation tribale.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: juges
  rationale: Le nom désigne ceux qui rendent des décisions judiciaires; « juges » est l’équivalent français direct et naturel.
- source_word: שֹׁטְרִים
  choice: responsables
  rationale: Le terme désigne des agents chargés de fonctions administratives ou exécutives auprès des juges. « Responsables » conserve une certaine généralité sans leur attribuer une fonction moderne trop précise.
- source_word: תִּתֶּן
  choice: tu établiras
  rationale: Le verbe signifie littéralement « donner, placer »; appliqué à des titulaires de charge, « établir » en exprime naturellement la valeur institutionnelle.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: dans toutes les portes des villes
  rationale: L’hébreu dit littéralement « dans toutes tes portes ». L’ajout explicatif « des villes » rend intelligible le lieu civique et judiciaire visé tout en conservant l’image des portes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לִשְׁבָטֶיךָ
  choice: selon tes tribus
  rationale: Cette formulation préserve la valeur distributive ou organisationnelle de la préposition sans décider plus précisément si chaque ville ou chaque nomination relève d’une tribu.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Ils jugeront le peuple
  rationale: Dans ce contexte institutionnel, le verbe garde son sens judiciaire direct.
- source_word: מִשְׁפַּט צֶדֶק
  choice: avec justice
  rationale: Cette expression française naturelle rend la qualité juste et droite que doit avoir le jugement, sans la lourdeur de « d’un jugement de justice ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et respecte directement la donnée hébraïque.
- issue: Portée de לִשְׁבָטֶיךָ
  choice: selon tes tribus
  alternative: pour tes tribus
  rationale: « Selon » maintient l’ambiguïté entre répartition territoriale et organisation tribale, tandis que « pour » pourrait suggérer plus nettement les bénéficiaires.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reflète l’adresse collective à Israël sous la forme grammaticale du singulier. L’image historique des portes urbaines, lieux de la vie civique et judiciaire, est conservée et explicitée sobrement.
