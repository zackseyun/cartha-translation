- from: Tu établiras des juges et des responsables dans toutes les portes des villes que Yahweh ton Dieu te donne, selon tes tribus[a]. Ils jugeront le peuple avec justice.
  to: Tu établiras des juges et des responsables dans toutes tes villes[a] que Yahweh, ton Dieu, te donne, selon tes tribus[b]. Ils jugeront le peuple avec justice.
  rationale: La révision remplace une expression française maladroite par « dans toutes tes villes », qui transmet la référence géographique de l’hébreu, et ajoute une note qui préserve l’image littérale des portes ainsi que son contexte historique. La note sur « selon tes tribus » est conservée et reçoit son propre repère. Aucun changement de sens théologique ou institutionnel n’est introduit.
