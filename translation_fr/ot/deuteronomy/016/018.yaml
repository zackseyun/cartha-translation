review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle. Toutefois, « dans toutes les portes des villes » est une formulation française impropre : les « portes » hébraïques désignent métonymiquement les villes et, plus précisément, leurs espaces de porte où se tenaient les affaires civiques et judiciaires. Le rendu principal « dans toutes tes villes » avec une note littérale restitue le sens sans perdre la donnée historique. « Selon tes tribus » préserve correctement la portée distributive de לִשְׁבָטֶיךָ.'
  naturalness: « Tu établiras » et « Ils jugeront le peuple avec justice » sont naturels et de registre approprié. La révision rend le complément de lieu idiomatique en français moderne.
  terminology: « Juges » est exact. « Responsables » demeure une solution volontairement générale et acceptable pour שֹׁטְרִים, dont la fonction administrative exacte ne doit pas être surdéfinie. « Yahweh » reproduit de manière cohérente le nom divin. « Avec justice » rend naturellement מִשְׁפַּט צֶדֶק.
  issues:
  - severity: medium
    issue: Formulation « dans toutes les portes des villes »
    rationale: En français, on n’établit pas des personnes « dans les portes » ; l’ajout « des villes » ne résout pas cette difficulté et alourdit l’image. Le texte hébreu emploie « portes » pour les localités et leurs lieux d’administration. Une traduction fonctionnelle dans le texte, accompagnée d’une note littérale, est plus claire et fidèle.
  - severity: low
    issue: Absence de note sur « portes »
    rationale: La note actuelle traite seulement de la relation aux tribus. Une note est utile pour signaler le sens littéral et la fonction civique des portes, sans imposer une interprétation institutionnelle plus précise.
