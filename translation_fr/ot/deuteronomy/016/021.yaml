  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: fr
  text: Tu ne planteras pas pour toi une ashéra — un arbre de quelque espèce que ce soit — à côté de l’autel de Yahweh, ton Dieu, que tu te feras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un poteau sacré d’Ashéra ». Le mot hébreu אֲשֵׁרָה peut désigner un objet cultuel associé à la déesse Ashéra, et non seulement la déesse elle-même.
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: planteras
  rationale: Le verbe נטע signifie normalement « planter ». Ce choix conserve l’image végétale du texte au lieu de la remplacer par « ériger » ou « installer ».
- source_word: אֲשֵׁרָה
  choice: ashéra
  rationale: La translittération préserve l’ambiguïté entre la déesse Ashéra et l’objet cultuel associé à son culte. La minuscule convient ici à l’emploi avec l’article indéfini, sans imposer une identification exclusive.
- source_word: כָּל עֵץ
  choice: de quelque arbre que ce soit
  rationale: Cette formulation rend la portée générale de כָּל et maintient le lien concret avec l’arbre, sans réduire explicitement l’ashéra à un simple poteau de bois.
- source_word: אֵצֶל
  choice: à côté de
  rationale: Rend concrètement la proximité spatiale exprimée par אֵצֶל.
- source_word: מִזְבַּח
  choice: autel
  rationale: Équivalent français courant et précis de מִזְבַּח.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement le nom avec le suffixe masculin singulier de deuxième personne.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: que tu te feras
  rationale: Conserve le sens large de עשה ainsi que la valeur réfléchie ou bénéficiaire de לְךָ, sans préciser davantage la manière de réaliser l’autel.
theological_decisions:
- issue: אֲשֵׁרָה désigne-t-il la déesse ou un objet cultuel ?
  choice: Conserver « ashéra » dans le texte principal.
  alternative: « poteau sacré d’Ashéra » ou « objet cultuel en bois »
  rationale: Le terme hébreu peut renvoyer à la déesse, à son symbole ou à un objet cultuel lié à son culte. La translittération et la note préservent cette tension au lieu de trancher silencieusement.
translation_notes:
  register: Tutoiement singulier conforme à l’adresse juridique hébraïque. Style actuel et digne, avec une syntaxe proche de la formulation source. Le terme rare « ashéra » est conservé pour éviter une précision interprétative injustifiée et expliqué en note.
