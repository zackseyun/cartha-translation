  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: fr
  text: Souviens-toi que tu as été esclave en Égypte, et observe et mets en pratique ces prescriptions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Souviens-toi
  rationale: Dans ce contexte d’instruction, la forme verbale avec conjonction a la valeur d’une exhortation ou d’un commandement. L’impératif français en restitue naturellement la force.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu dont Israël doit se souvenir.
- source_word: עֶבֶד
  choice: esclave
  rationale: Le terme peut désigner un serviteur ou un esclave, mais le contexte de l’asservissement contraint d’Israël en Égypte appelle ici « esclave ».
- source_word: הָיִיתָ
  choice: tu as été
  rationale: Le passé composé convient au rappel d’une situation passée qui demeure déterminante pour l’obéissance présente.
- source_word: בְּמִצְרָיִם
  choice: en Égypte
  rationale: Rendu direct et idiomatique de la préposition et du nom géographique.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ
  choice: veille à mettre en pratique
  rationale: Dans un contexte légal, שׁמר exprime l’observation attentive, tandis que עשׂה souligne l’exécution concrète. Cette formulation française naturelle conserve ensemble ces deux aspects sans la lourdeur de « garde et fais ».
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ces prescriptions
  rationale: חֻקִּים désigne des dispositions prescrites. « Prescriptions » est précis, actuel et adapté au registre légal du passage.
theological_decisions:
- issue: Sens de עֶבֶד dans le souvenir de l’Égypte
  choice: esclave
  alternative: serviteur
  rationale: Bien que le mot hébreu couvre les deux sens, le contexte évoque la condition imposée et oppressive d’Israël en Égypte. « Esclave » communique donc mieux la réalité historique sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier conserve l’adresse hébraïque à Israël considéré collectivement. La coordination hébraïque est rendue de manière idiomatique tout en maintenant l’idée d’une observation attentive conduisant à l’action.
