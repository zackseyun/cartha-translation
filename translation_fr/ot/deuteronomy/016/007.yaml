  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: fr
  text: Tu le feras cuire et tu le mangeras dans le lieu que l’Éternel, ton Dieu, choisira. Le matin, tu te mettras en route vers tes tentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: Tu le feras cuire
  rationale: Le verbe בשׁל désigne ici la préparation par cuisson de l’offrande pascale; «faire cuire» est naturel en français et ne précise pas indûment le mode de cuisson.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: au lieu que l’Éternel ton Dieu choisira pour cela
  rationale: Le suffixe de בּוֹ est maintenu par «pour cela», conformément à sa présence dans le texte massorétique, tout en laissant ouverte sa relation exacte au lieu ou à la célébration.
- source_word: וּפָנִיתָ
  choice: tu repartiras
  rationale: Le sens contextuel est celui de se détourner du sanctuaire pour prendre le chemin du retour; «repartir» l’exprime idiomatiquement.
- source_word: לְאֹהָלֶיךָ
  choice: à tes tentes
  rationale: Traduction concrète et formellement fidèle du pluriel אֹהָלֶיךָ, sans le généraliser en «chez toi».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: «L’Éternel» est une convention française digne et largement intelligible; elle représente le nom divin sans imposer une vocalisation reconstruite.
- issue: Référent de בּוֹ
  choice: pour cela
  alternative: omettre le suffixe ou traduire «où»
  rationale: Le suffixe est explicitement présent dans le WLC. Le conserver évite d’aplanir une difficulté syntaxique réelle, sans trancher artificiellement son référent.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement singulier suit l’adresse hébraïque. La seconde proposition évite le littéralisme lourd «tu te tourneras» tout en conservant les deux mouvements exprimés par וּפָנִיתָ et וְהָלַכְתָּ.
