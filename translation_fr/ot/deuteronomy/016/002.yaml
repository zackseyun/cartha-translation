- from: Tu sacrifieras la Pâque à Yahweh ton Dieu[a], en prenant des bêtes du petit et du gros bétail, au lieu que Yahweh choisira pour y faire demeurer son nom.
  to: Tu sacrifieras la Pâque à Yahweh, ton Dieu, avec du petit et du gros bétail[a], dans le lieu que Yahweh choisira pour y faire demeurer son nom.
