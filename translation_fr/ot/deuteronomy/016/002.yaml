base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: fr
  text: Tu sacrifieras la Pâque à Yahweh, ton Dieu, avec du petit et du gros bétail[a], dans le lieu que Yahweh choisira pour y faire demeurer son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « la Pâque » est mise en rapport avec le petit et le gros bétail. Certains comprennent que l’expression inclut non seulement la victime pascale elle-même, mais aussi les sacrifices de fête associés à la Pâque et à la fête des Pains sans levain.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Tu sacrifieras
  rationale: Le verbe זבח désigne ici un abattage sacrificiel. Le futur français conserve naturellement la valeur prescriptive de la formulation juridique hébraïque.
- source_word: פֶּסַח
  choice: la Pâque
  rationale: פֶּסַח peut désigner la fête, le rite ou la victime pascale. Comme le verbe exprime déjà l'action sacrificielle, « la Pâque » garde la concision et l'ambiguïté du texte hébreu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: à Yahweh ton Dieu
  rationale: La préposition ל marque la destination ou la consécration du sacrifice. Le nom divin יהוה est rendu par « Yahweh ».
- source_word: צֹאן וּבָקָר
  choice: en prenant des bêtes du petit et du gros bétail
  rationale: Les deux noms collectifs désignent respectivement le petit et le gros bétail. Cette formulation explicite en français la relation de provenance implicite, sans limiter le premier terme aux seuls moutons.
- source_word: בַּמָּקוֹם
  choice: au lieu
  rationale: La formulation désigne l'emplacement cultuel déterminé par Dieu; « au lieu » est naturel et précis dans ce contexte.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh choisira
  rationale: L'inaccompli hébreu présente ce choix comme futur par rapport au discours de Moïse.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  rationale: La forme causative de שכן est conservée par « faire demeurer ». Cette traduction maintient l'expression théologique hébraïque du nom divin sans la paraphraser.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l'Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom d'alliance plutôt que de le remplacer par un titre.
- issue: Portée de « la Pâque » avec le petit et le gros bétail
  choice: Conserver ensemble « la Pâque » et la référence aux deux catégories de bétail
  alternative: Expliciter « le sacrifice pascal et les autres sacrifices de la fête »
  rationale: La mention du gros bétail peut englober les sacrifices associés à la fête, alors que la victime pascale proprement dite venait du petit bétail. Le texte principal ne tranche pas cette question et la note signale l'interprétation possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l'adresse hébraïque à Israël envisagé collectivement. La syntaxe reste proche de l'original tout en explicitant naturellement la provenance des animaux.
