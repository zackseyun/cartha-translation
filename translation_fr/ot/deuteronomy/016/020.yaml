base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: fr
  text: La justice[a], la justice, tu la poursuivras, afin que tu vives et que tu prennes possession[b] du pays que Yahweh, ton Dieu, te donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La droiture, la droiture, tu la poursuivras. » Le mot hébreu צֶדֶק peut désigner à la fois la justice et la droiture ; ici, le contexte judiciaire favorise « justice ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que tu hérites du pays ». Le verbe hébreu peut exprimer aussi bien l’idée d’hériter que celle de prendre possession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: La justice, la justice
  rationale: Le nom répété exprime une forte insistance. Dans le contexte immédiat des juges, de l’impartialité et des pots-de-vin, « justice » rend au mieux la dimension judiciaire et publique de צֶדֶק. La répétition hébraïque est conservée.
- source_word: תִּרְדֹּף
  choice: tu la poursuivras
  rationale: Le verbe רדף signifie littéralement poursuivre ou courir après. Cette formulation conserve l’image énergique et la valeur prescriptive de l’imparfait hébreu, tout en restant naturelle en français.
- source_word: לְמַעַן תִּחְיֶה
  choice: afin que tu vives
  rationale: « Afin que » exprime clairement le but ou le résultat introduit par לְמַעַן, et « tu vives » traduit directement חיה sans préciser indûment s’il s’agit seulement de survie ou plus largement d’une vie sous la bénédiction de l’alliance.
- source_word: וְיָרַשְׁתָּ
  choice: et que tu prennes possession
  rationale: ירשׁ peut désigner l’action d’hériter, de posséder ou de prendre possession. Ici, « prendre possession » convient au don du pays et garde la dimension active du verbe.
- source_word: הָאָרֶץ
  choice: du pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire promis à Israël. « Le pays » est naturel en français et conserve cette référence territoriale particulière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: La deuxième personne masculine singulière est maintenue, conformément à l’adresse collective à Israël sous la forme du singulier.
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le présent français rend naturellement le participe hébreu, qui présente le don du pays comme l’action actuelle ou caractéristique de Yahweh.
theological_decisions:
- issue: Sens de צֶדֶק dans le contexte judiciaire
  choice: justice
  alternative: droiture
  rationale: Le contexte immédiat porte sur l’administration impartiale du droit. « Justice » privilégie donc le sens judiciaire sans exclure la portée morale plus large du terme, signalée en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre de Dieu. Sa translittération préserve cette donnée du texte source au lieu de lui substituer un titre.
- issue: Portée de ירשׁ concernant le pays
  choice: prendre possession
  alternative: hériter
  rationale: Le verbe peut associer l’idée d’héritage à celle de l’entrée en possession. Le texte principal retient l’expression la plus claire dans ce contexte territorial, tandis que l’autre possibilité est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier conserve l’adresse hébraïque à Israël comme unité collective. L’ordre emphatique et la répétition de « la justice » sont maintenus sans rendre la phrase artificielle.
