  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: fr
  text: On ne verra chez toi aucun levain dans tout ton territoire pendant sept jours. Il ne restera rien jusqu’au matin de la viande[a] que tu sacrifieras le soir du premier jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chair », terme courant dans le vocabulaire des sacrifices.'
    reason: lexical_alternative
  - marker: b
    text: « Le premier jour » peut désigner plus précisément le sacrifice de la Pâque offert à l’ouverture de la fête, mais l’hébreu ne dit pas explicitement « agneau pascal » ici.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: on ne verra
  rationale: Le niphal de ראה a ici un sens passif (« être vu »). La tournure impersonnelle française conserve l’idée de visibilité et la force de l’interdiction avec naturel.
- source_word: שְׂאֹר
  choice: levain
  rationale: « Levain » est le terme rituel précis et courant dans le contexte de la Pâque; il est plus large et mieux adapté que « levure ».
- source_word: בְּכָל גְּבֻלְךָ
  choice: dans tout ton territoire
  rationale: גְּבוּל désigne ici l’étendue territoriale plutôt que la seule frontière; cette formulation rend clairement la portée de l’interdiction.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: La préposition « pendant » exprime naturellement en français la durée indiquée par l’hébreu.
- source_word: יָלִין
  choice: rester pendant la nuit
  rationale: Le verbe לין signifie passer ou demeurer pendant la nuit. Cette formulation exprime directement l’interdiction de conserver la viande jusqu’au matin.
- source_word: מִן הַבָּשָׂר
  choice: aucune partie de la viande
  rationale: La construction partitive מִן appelle « aucune partie de ». בָּשָׂר signifie littéralement « chair », mais « viande » est plus naturel en français pour ce qui provient d’un animal sacrifié; la nuance littérale est signalée en note.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: que tu sacrifieras
  rationale: Dans ce contexte cultuel, זבח désigne l’abattage sacrificiel; « sacrifier » en communique clairement la portée rituelle.
- source_word: בָּעֶרֶב
  choice: le soir
  rationale: Équivalent temporel direct et idiomatique de בָּעֶרֶב.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: du premier jour
  rationale: L’hébreu dit simplement « le premier jour ». La traduction n’ajoute pas « de la fête » ni « de la Pâque », afin de ne pas trancher le référent.
- source_word: לַבֹּקֶר
  choice: jusqu’au matin
  rationale: Dans cette interdiction, לַבֹּקֶר indique la limite temporelle au-delà de laquelle la viande ne doit pas être conservée.
theological_decisions:
- issue: Référent de la viande sacrifiée le premier jour
  choice: Conserver une désignation générale de la viande sacrificielle sans préciser « agneau pascal » dans le texte principal.
  alternative: Comprendre l’expression comme visant précisément le sacrifice ou l’agneau de la Pâque, ou plus largement les sacrifices de fête liés au premier jour.
  rationale: Le texte hébreu parle seulement de la viande sacrifiée le soir du premier jour. La traduction préserve cette formulation et l’ambiguïté réelle quant à l’étendue exacte du référent.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme interlocuteur collectif. La syntaxe reste proche de la structure source tout en évitant des calques peu naturels.
