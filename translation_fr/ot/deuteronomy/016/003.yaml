source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: fr
  text: Tu ne mangeras pas avec lui de pain levé. Pendant sept jours, tu mangeras avec lui du pain sans levain[a], le pain de l’affliction, car tu es sorti à la hâte du pays d’Égypte, afin que tu te souviennes du jour où tu es sorti du pays d’Égypte tous les jours de ta vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pain de la pauvreté » ou « le pain de la misère ». L’expression hébraïque peut souligner la détresse, la privation ou l’affliction associées à la sortie d’Égypte.
    reason: Alternative lexicale destinée à préserver l’étendue sémantique de לֶחֶם עֹנִי.
lexical_decisions:
- source_word: עָלָיו
  choice: avec lui
  rationale: Dans le contexte du repas pascal, la préposition indique que le pain est mangé en accompagnement du sacrifice évoqué au verset précédent. « Avec lui » conserve aussi le référent masculin implicite.
- source_word: חָמֵץ
  choice: pain levé
  rationale: Dans ce contexte alimentaire, le terme désigne naturellement du pain contenant du levain plutôt que le levain comme ingrédient.
- source_word: מַצּוֹת
  choice: pain sans levain
  rationale: Formulation française courante et claire pour les pains non fermentés de la Pâque.
- source_word: לֶחֶם עֹנִי
  choice: le pain de l’affliction
  rationale: Cette traduction conserve la portée large de עֹנִי, qui peut évoquer la détresse, la misère ou la pauvreté, sans réduire le sens à la seule privation économique.
- source_word: בְחִפָּזוֹן
  choice: à la hâte
  rationale: Rend directement l’idée d’un départ précipité sans ajouter la notion interprétative de fuite ou d’effroi.
- source_word: לְמַעַן תִּזְכֹּר
  choice: afin que tu te souviennes
  rationale: Préserve clairement la valeur de but de לְמַעַן suivi de l’imparfait.
- source_word: יוֹם צֵאתְךָ
  choice: le jour où tu es sorti
  rationale: Expression française naturelle qui rend la construction hébraïque infinitive tout en maintenant le motif répété de la sortie d’Égypte.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: tous les jours de ta vie
  rationale: Formule idiomatique qui conserve l’idée d’un souvenir entretenu durant toute la vie.
theological_decisions:
- issue: Sens mémoriel de לֶחֶם עֹנִי
  choice: le pain de l’affliction
  alternative: le pain de la pauvreté ; le pain de la misère
  rationale: La formulation retenue maintient le lien entre le rite, la détresse vécue et la délivrance, tout en laissant ouverte l’étendue sémantique du terme hébreu.
- issue: Référent de עָלָיו
  choice: avec lui
  alternative: avec cela
  rationale: Le pronom renvoie vraisemblablement au sacrifice pascal mentionné dans le contexte immédiat. Le masculin « lui » évite d’expliciter dans le texte ce que l’hébreu laisse pronominal.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël. La répétition de « du pays d’Égypte » est conservée, ainsi que le lien pronominal avec le sacrifice du contexte précédent.
