  text: חַ֧ג הַ/סֻּכֹּ֛ת תַּעֲשֶׂ֥ה לְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים בְּ/אָ֨סְפְּ/ךָ֔ מִֽ/גָּרְנְ/ךָ֖ וּ/מִ/יִּקְבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: fr
  text: Tu célébreras la fête des Cabanes[a] pendant sept jours, lorsque tu recueilleras les produits de ton aire de battage et de ton pressoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On dit aussi « fête des Tentes ». Le mot hébreu désigne des cabanes ou des abris temporaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: la fête des Cabanes
  rationale: חַג désigne ici une fête de pèlerinage, et סֻכּוֹת des abris temporaires. « Fête des Cabanes » est l’appellation française courante et conserve l’image concrète du terme hébreu.
- source_word: תַּעֲשֶׂה לְךָ
  choice: tu célébreras
  rationale: Avec חַג, le verbe עשה signifie idiomatiquement célébrer ou observer une fête. Le futur français à valeur prescriptive rend naturellement la force de l’instruction.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Cette formulation française exprime clairement et directement la durée indiquée par l’hébreu.
- source_word: בְּאָסְפְּךָ
  choice: lorsque tu rentreras les produits
  rationale: La préposition ב devant l’infinitif construit marque le temps sans imposer que l’action soit entièrement achevée. « Rentrer les produits » exprime naturellement l’engrangement de la récolte.
- source_word: מִגָּרְנְךָ
  choice: de ton aire de battage
  rationale: גֹּרֶן désigne concrètement l’aire où l’on bat les céréales; l’image agricole du texte est ainsi préservée.
- source_word: וּמִיִּקְבֶךָ
  choice: et de ton pressoir
  rationale: יֶקֶב désigne le pressoir ou la cuve liés à la production du vin. « Pressoir » est clair dans ce contexte agricole.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne du singulier. « Cabanes » maintient l’image concrète sans employer le traditionnel « Tabernacles », qui est moins transparent aujourd’hui.
