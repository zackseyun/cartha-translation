source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: fr
  text: Observe le mois d’Abib[a] et célèbre la Pâque en l’honneur de Yahweh ton Dieu, car c’est au mois d’Abib que Yahweh ton Dieu t’a fait sortir d’Égypte, de nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Abib désigne le mois associé aux premiers épis mûrs; autre traduction possible : « le mois du printemps ».'
    reason: alternative lexicale et explication du nom calendaire
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Observe
  rationale: L’impératif demande de respecter avec soin une prescription du calendrier cultuel. « Observe » garde la force juridique du commandement dans un français naturel.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: le mois d’Abib
  rationale: Dans ce contexte de calendrier liturgique, l’expression désigne le mois associé aux premiers épis mûrs. Garder « Abib » préserve cette valeur calendaire plutôt que de la réduire à la saison du printemps.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: et célèbre la Pâque
  rationale: 'Littéralement « faire la Pâque » : en français actuel, « célébrer la Pâque » exprime naturellement l’accomplissement prescrit de cette observance rituelle.'
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition ל marque ici l’orientation ou la dédicace de la célébration à Yahweh. « En l’honneur de » rend cette relation clairement et sans suggérer que la fête est destinée à Dieu comme un objet remis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הוֹצִיאֲךָ
  choice: t’a fait sortir
  rationale: 'Le hiphil de יצא exprime la causation : Dieu a fait sortir Israël. Cette formulation est précise, idiomatique et traditionnelle dans le récit de l’Exode.'
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Avec « faire sortir », la préposition française « de » rend naturellement le point de départ indiqué par מִן.
- source_word: לָיְלָה
  choice: de nuit
  rationale: L’accusatif adverbial précise le moment ou les circonstances de la sortie. « De nuit » est concis et conserve l’accent temporel de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: 'Valeur de אָבִיב : nom calendaire ou saison'
  choice: Abib comme désignation du mois
  alternative: le mois du printemps
  rationale: Dans cette loi sur la Pâque, l’expression identifie le mois liturgique lié à la sortie d’Égypte. La translittération préserve cette précision, tandis que la note indique le sens lexical sous-jacent.
- issue: Portée temporelle de לָיְלָה
  choice: de nuit, rattaché à la sortie d’Égypte
  alternative: pendant la nuit de la Pâque
  rationale: La syntaxe rattache directement « de nuit » au verbe « t’a fait sortir ». La traduction ne tente pas d’harmoniser ou de préciser davantage la chronologie à partir d’autres passages.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques adressées collectivement à Israël. « Célèbre » est idiomatique dans le contexte cultuel; « Observe » maintient le ton prescriptif. La répétition de « Yahweh ton Dieu » est conservée.
