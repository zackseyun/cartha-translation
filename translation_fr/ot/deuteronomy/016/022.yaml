  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: fr
  text: Tu ne dresseras pas pour toi une stèle[a] que Yahweh, ton Dieu, déteste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierre levée » ou « pilier cultuel ». Le terme hébreu désigne une pierre érigée, souvent associée au culte.
    reason: alternative lexicale et précision du contexte cultuel
lexical_decisions:
- source_word: תָקִים
  choice: dresseras
  rationale: Le hifil de קום signifie ici faire tenir debout, donc ériger. « Dresser » convient naturellement à une pierre cultuelle.
- source_word: לְךָ
  choice: pour toi
  rationale: Le datif marque l’implication personnelle ou la destination; « pour toi » conserve cette nuance sans la surinterpréter.
- source_word: מַצֵּבָה
  choice: pierre dressée
  rationale: Le terme désigne un monument de pierre érigé, souvent lié au culte. « Pierre dressée » décrit l’objet sans ajouter explicitement « sacrée », nuance fournie en note.
- source_word: אֲשֶׁר
  choice: car ... cela
  rationale: La proposition relative hébraïque qualifie la pierre comme objet de la haine divine. En français, une reprise causale par « car ... cela » évite l’ambiguïté et la lourdeur de « une pierre que Yahweh déteste », tout en conservant le rapport logique immédiat.
- source_word: שָׂנֵא
  choice: déteste
  rationale: « Détester » rend directement la forte aversion exprimée par le verbe, dans un français courant et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Cette formulation conserve le suffixe possessif et la portée relationnelle de l’expression d’alliance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée cultuelle de מַצֵּבָה
  choice: pierre dressée avec note explicative
  alternative: stèle sacrée; pilier cultuel; stèle
  rationale: Le mot désigne une pierre érigée et peut avoir une fonction cultuelle dans ce contexte. Le texte principal garde le référent concret sans rendre explicite une nuance seulement contextuelle; la note signale les équivalents possibles.
- issue: Portée de la proposition אֲשֶׁר שָׂנֵא
  choice: « car Yahweh ton Dieu déteste cela »
  alternative: « que Yahweh ton Dieu déteste »
  rationale: La reformulation française rapporte clairement l’aversion divine à l’érection d’une telle pierre ou à l’objet ainsi érigé, sans préciser davantage ce que l’hébreu laisse compact.
translation_notes:
  register: Français international moderne, direct et solennel. Le futur à valeur d’interdiction correspond à la formulation juridique du verset. « Pierre dressée » reste accessible tout en évitant le technicisme.
