source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: fr
  text: mais seulement au lieu que Yahweh, ton Dieu, choisira pour y faire demeurer son nom[a]. C’est là que tu sacrifieras la Pâque[b], le soir, au coucher du soleil, au temps fixé de ta sortie d’Égypte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour que son nom y demeure » ou « pour y placer son nom ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tu immoleras la Pâque »; ici, « la Pâque » désigne l’offrande pascale.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « de ton sortir d’Égypte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: mais seulement
  rationale: Cette locution introduit une restriction forte qui contraste avec l’interdiction du verset précédent; « mais seulement » en rend naturellement la valeur exclusive.
- source_word: הַמָּקוֹם
  choice: le lieu
  rationale: Équivalent français courant de מָקוֹם; dans ce contexte, il désigne le lieu de culte que Dieu choisira.
- source_word: יִבְחַר
  choice: choisira
  rationale: L’inaccompli a ici une valeur prospective dans cette prescription légale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel au lieu de le remplacer par un titre.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  rationale: Le causatif de שכן est rendu explicitement, tandis que l’expression théologique du « nom » demeure intacte sans être assimilée directement à une localisation de Dieu lui-même.
- source_word: תִּזְבַּח
  choice: tu sacrifieras
  rationale: זבח désigne ici une mise à mort sacrificielle dans un cadre cultuel; « sacrifier » exprime clairement cette dimension rituelle.
- source_word: הַפֶּסַח
  choice: la Pâque
  rationale: Le nom peut désigner la fête ou l’offrande pascale. Comme complément de « sacrifier », il renvoie ici à l’offrande, tout en conservant la formulation concise du texte.
- source_word: בָּעָרֶב
  choice: le soir
  rationale: Formulation temporelle naturelle en français moderne.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: au coucher du soleil
  rationale: L’expression hébraïque désigne idiomatiquement le moment où le soleil se couche.
- source_word: מוֹעֵד
  choice: au temps fixé
  rationale: מוֹעֵד désigne un moment déterminé ou assigné; « temps fixé » conserve sa précision temporelle.
- source_word: צֵאתְךָ מִמִּצְרַיִם
  choice: de ta sortie d’Égypte
  rationale: La formulation reste proche du groupe nominal hébreu et rappelle directement l’événement historique sans employer le titre « Exode ».
theological_decisions:
- issue: La formule du nom divin dans la théologie deutéronomique du lieu choisi
  choice: pour y faire demeurer son nom
  alternative: pour que son nom y demeure; pour y placer son nom
  rationale: La traduction conserve à la fois la forme causative de l’hébreu et l’idiome du nom de Dieu. Elle évite de résoudre la tension entre la transcendance divine et la présence que Dieu attache au lieu choisi.
- issue: Le sens sacrificiel de la Pâque
  choice: tu sacrifieras la Pâque
  alternative: tu immoleras la Pâque; tu sacrifieras l’offrande de la Pâque
  rationale: La formulation concise maintient l’ambivalence du nom פֶּסַח entre célébration et victime, tandis que le verbe indique nettement l’acte rituel.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit les formes hébraïques adressées à Israël comme à une personne collective. La phrase est divisée après la formule du nom afin d’éviter une structure trop lourde, sans modifier le rapport logique du verset.
