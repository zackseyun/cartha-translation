source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: fr
  text: Tu ne fausseras pas la justice ; tu ne feras pas preuve de partialité[a] et tu n’accepteras pas de pot-de-vin, car le pot-de-vin aveugle les yeux des sages et déforme les paroles de ceux qui sont dans leur droit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu ne reconnaîtras pas les visages », expression hébraïque signifiant favoriser certaines personnes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dénature la cause de ceux qui sont dans leur droit ». Dans ce contexte juridique, le terme hébreu peut désigner leurs paroles ou leur cause.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: fausseras pas la justice
  rationale: Le hiphil de נטה avec מִשְׁפָּט exprime l’action de détourner le jugement de ce qui est juste. « Fausser la justice » est naturel en français moderne et conserve la portée judiciaire.
- source_word: תַכִּיר פָּנִים
  choice: feras pas preuve de partialité
  rationale: L’expression signifie littéralement « reconnaître les visages », idiome hébreu désignant le favoritisme dans l’exercice du jugement. La formulation retenue en communique clairement le sens.
- source_word: שֹׁחַד
  choice: pot-de-vin
  rationale: Dans ce contexte juridique, le terme désigne un don corruptif destiné à influencer une décision. « Pot-de-vin » en rend explicitement la force morale et légale.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: aveugle les yeux des sages
  rationale: La traduction conserve l’image concrète et intelligible de l’hébreu ainsi que la valeur générique de חֲכָמִים.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: déforme les paroles de ceux qui sont dans leur droit
  rationale: סלף signifie tordre ou déformer. דִּבְרֵי désigne littéralement les paroles, mais peut évoquer une affaire en contexte judiciaire. Le texte garde « paroles », tandis que la note signale l’autre possibilité.
- source_word: צַדִּיקִם
  choice: ceux qui sont dans leur droit
  rationale: Dans ce cadre judiciaire, צַדִּיקִים désigne les personnes dont la cause est juste ou qui sont juridiquement dans leur droit. Cette formulation évite de réduire le terme aux seuls « innocents » et sonne plus naturellement ici que « les justes ».
theological_decisions:
- issue: Portée de דִּבְרֵי צַדִּיקִם
  choice: les paroles de ceux qui sont dans leur droit
  alternative: la cause de ceux qui sont dans leur droit
  rationale: L’hébreu permet de comprendre דְּבָרִים comme des paroles ou, dans un cadre juridique, comme une affaire ou une cause. La traduction principale reste proche du sens lexical direct, et la note préserve l’ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque. Le parallélisme des trois interdictions et l’image de l’aveuglement sont conservés.
