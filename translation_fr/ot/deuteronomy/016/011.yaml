  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: fr
  text: Tu te réjouiras devant Yahweh ton Dieu, toi, ton fils, ta fille, ton esclave et ta femme esclave, le Lévite qui réside dans tes villes[a], ainsi que l’immigré[b], l’orphelin et la veuve qui vivent au milieu de toi, dans le lieu que Yahweh ton Dieu choisira pour y faire demeurer son nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans tes portes »; cette expression désigne les villes ou les communautés locales.'
    reason: idiome_source
  - marker: b
    text: 'Ou : « l’étranger résident ». Il s’agit d’un non-Israélite établi au sein d’Israël et placé sous son ordre social.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « pour faire demeurer son nom là ».'
    reason: source_form
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Tu te réjouiras
  rationale: Le futur à valeur prescriptive rend naturellement l’instruction hébraïque, tandis que « se réjouir » conserve sa tonalité festive et cultuelle.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement l’expression idiomatique signifiant « devant, en présence de », sans l’alourdir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: ton esclave et ta servante
  rationale: « Esclave » exprime le statut social de עבד. Pour אמה, « servante » est naturel en français et peut désigner une femme en condition servile; la note explicite ce sens afin d’éviter de masquer l’asymétrie lexicale française.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Littéralement « dans tes portes »; dans le langage juridique du Deutéronome, les portes représentent les localités où habite la communauté.
- source_word: וְהַגֵּר
  choice: l’immigré
  rationale: Désigne ici un étranger établi durablement au sein d’Israël et relevant de son ordre social, plutôt qu’un simple voyageur.
- source_word: וְהַיָּתוֹם
  choice: l’orphelin
  rationale: Terme français actuel et inclusif pour une personne privée de soutien parental; le mot hébreu peut viser plus particulièrement celui qui est privé de père.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  rationale: Conserve la valeur causative de שׁכן et la formulation théologique propre au Deutéronome, sans la paraphraser par « établir son sanctuaire ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte un nom propre; sa transcription préserve sa fonction d’alliance sans lui substituer un titre.
- issue: Statut de עבד et אמה
  choice: ton esclave et ta servante
  alternative: ton serviteur et ta servante / ton esclave et ta femme esclave
  rationale: Le contexte domestique et juridique rend saillant le statut de dépendance. « Femme esclave » serait plus symétrique mais nettement moins idiomatique; une note précise donc la portée de « servante ».
- issue: Formule du sanctuaire לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  alternative: pour que son nom y demeure / pour y placer son nom
  rationale: Le choix maintient à la fois la causativité verbale et la tension entre la transcendance de Dieu et la présence de son nom au lieu choisi.
translation_notes:
  register: Français international moderne, digne et lisible. La longue énumération juridique est conservée, mais structurée par « ainsi que ». Le singulier de chaque membre du foyer suit l’hébreu et garde la portée représentative de l’instruction.
