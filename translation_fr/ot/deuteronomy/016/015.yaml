  source_fidelity: 'Le sens central est bien rendu : la célébration de sept jours, le lieu choisi par Yahweh, la bénédiction portant sur la production et le travail, et l’injonction finale à la joie sont tous présents. Toutefois, « Alors » introduit un lien consécutif plus marqué que la simple coordination hébraïque, et « les produits de ton sol » explicite « sol » là où תְּבוּאָה désigne plus largement la production agricole.'
  naturalness: « Célébrer une fête en l’honneur de » est plus idiomatique en français moderne que « célébrer une fête pour ». La conclusion « tu seras tout entier dans la joie » est plus fluide et conserve l’intensité sans imposer exclusivement une lecture restrictive.
  terminology: « Yahweh » rend systématiquement le tétragramme. « Toute ta production » garde la portée agricole de תְּבוּאָה sans ajouter un référent non exprimé. La note conserve les possibilités restrictive et intensive de אַךְ.
