  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: fr
  text: Pendant sept jours, tu célébreras une fête en l’honneur de Yahweh, ton Dieu, dans le lieu que Yahweh choisira. Car Yahweh, ton Dieu, te bénira dans toute ta production et dans tout le travail de tes mains, et tu seras tout entier dans la joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne connaîtras que la joie » ou « tu te réjouiras certainement ». L’expression hébraïque peut souligner soit l’exclusivité, soit la plénitude de la joie.'
    reason: Alternative lexicale pour אַךְ et nuance de la proposition finale.
lexical_decisions:
- source_word: תָּחֹג
  choice: tu célébreras une fête
  rationale: Le verbe חָגַג désigne la célébration d’une fête de pèlerinage, et non une réjouissance générale.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici l’orientation et la consécration de la fête à Yahweh; « pour » est naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: dans le lieu que Yahweh choisira
  rationale: Cette formulation suit étroitement la construction hébraïque et désigne le lieu de culte choisi par Dieu.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de la célébration; « car » en exprime clairement la valeur causale dans un registre digne.
- source_word: יְבָרֶכְךָ
  choice: te bénira
  rationale: Cette traduction conserve le vocabulaire biblique et théologique courant de la bénédiction divine.
- source_word: תְּבוּאָתְךָ
  choice: les produits de ton sol
  rationale: תְּבוּאָה désigne largement la production ou le rendement agricole; cette expression évite de limiter le sens aux seules céréales.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: le travail de tes mains
  rationale: La traduction conserve l’image hébraïque, immédiatement compréhensible en français moderne.
- source_word: וְהָיִיתָ
  choice: Alors tu seras
  rationale: Dans le contexte, la forme coordonnée présente l’état de joie comme la conséquence attendue de la bénédiction; « alors » rend naturellement ce lien sans en faire une finalité explicite.
- source_word: אַךְ שָׂמֵחַ
  choice: pleinement dans la joie
  rationale: אַךְ peut être restrictif ou intensif; dans ce contexte festif, cette formulation exprime une joie entière tout en laissant la note signaler les autres analyses possibles.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
- issue: Valeur de וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: Alors tu seras pleinement dans la joie
  alternative: tu ne seras que dans la joie; tu te réjouiras certainement
  rationale: אַךְ admet une nuance restrictive ou intensive. Le contexte de fête et de bénédiction favorise l’idée d’une joie entière, mais l’ambiguïté lexicale authentique est conservée dans la note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque à Israël comme interlocuteur collectif. La répétition de « Yahweh, ton Dieu » est conservée; la dernière proposition est légèrement segmentée pour une lecture naturelle.
