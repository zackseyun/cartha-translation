  text: שֵׁ֥שֶׁת יָמִ֖ים תֹּאכַ֣ל מַצּ֑וֹת וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י עֲצֶ֨רֶת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תַעֲשֶׂ֖ה מְלָאכָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: fr
  text: Pendant six jours, tu mangeras des pains sans levain, et le septième jour, il y aura une assemblée solennelle[a] pour Yahweh, ton Dieu ; tu ne feras aucun travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une assemblée sacrée » ou « une assemblée de clôture ». Le terme hébreu désigne un rassemblement festif officiel, probablement avec l’idée d’une assemblée qui clôt la fête.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Pendant six jours
  rationale: La construction exprime une durée. « Pendant six jours » est naturel en français et en rend clairement la valeur temporelle.
- source_word: תֹּאכַל
  choice: tu mangeras
  rationale: Dans ce contexte légal, l’imparfait hébreu a une valeur prescriptive. Le futur français exprime naturellement cette instruction.
- source_word: מַצּוֹת
  choice: des pains sans levain
  rationale: Le pluriel désigne les pains non levés consommés dans le cadre de la Pâque. Cette formulation est claire et courante en français moderne.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: et le septième jour
  rationale: Le waw est rendu simplement par « et », sans lui imposer une valeur adversative que l’hébreu n’exige pas.
- source_word: עֲצֶרֶת
  choice: une assemblée solennelle
  rationale: Le terme désigne un rassemblement festif officiel, vraisemblablement avec l’idée d’une assemblée de clôture. « Assemblée solennelle » conserve sa portée cultuelle sans réduire le sens à la seule clôture.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici la destination ou la consécration de l’assemblée. « Pour Yahweh » est idiomatique et maintient cette relation.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Cette expression d’alliance est rendue directement, en conservant la deuxième personne du singulier.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: tu ne feras aucun travail
  rationale: La formulation exprime clairement l’interdiction de tout travail et reste proche de la construction hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » rend explicitement le nom d’alliance sans le remplacer par un titre.
- issue: Nature de עֲצֶרֶת
  choice: assemblée solennelle
  alternative: assemblée sacrée ; assemblée de clôture
  rationale: Le mot peut évoquer à la fois un rassemblement cultuel formel et la conclusion de la fête. Le texte principal conserve la solennité, tandis que la note signale les autres nuances sans trancher au-delà des données lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme destinataire collectif. Le marqueur de note est placé après « assemblée solennelle », terme auquel la variante lexicale se rapporte.
