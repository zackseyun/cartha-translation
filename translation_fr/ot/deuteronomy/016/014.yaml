  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: fr
  text: Tu te réjouiras pendant ta fête[a], toi, ton fils et ta fille, tes esclaves, hommes et femmes[b], le Lévite, l’étranger établi parmi les tiens[c], l’orphelin et la veuve qui habitent dans tes villes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner la fête elle-même ou la célébration festive qui l’accompagne.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu nomme séparément l’esclave de sexe masculin et l’esclave de sexe féminin.
    reason: lexical_clarification
  - marker: c
    text: 'Il s’agit d’un étranger non israélite résidant au sein de la communauté d’Israël; autre traduction possible : « l’immigré résident ».'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « qui sont dans tes portes ». Les « portes » représentent ici les villes ou les communautés qui relèvent du destinataire.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Tu te réjouiras
  rationale: Le qatal précédé de וְ, dans ce contexte prescriptif, exprime une instruction. Le futur français garde naturellement la force de commandement sans durcir le texte par « tu dois ».
- source_word: בְּחַגֶּךָ
  choice: pendant ta fête
  rationale: חַג désigne ici la fête de pèlerinage et sa célébration. « Pendant ta fête » exprime clairement la participation joyeuse à celle-ci.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: tes esclaves, hommes et femmes
  rationale: עֶבֶד et אָמָה désignent respectivement une personne asservie de sexe masculin et féminin. Cette formulation française naturelle conserve le statut social et la distinction des deux termes, tout en rendant distributivement les singuliers hébreux.
- source_word: וְהַלֵּוִי
  choice: le Lévite
  rationale: Rendu traditionnel et précis du nom désignant un membre du groupe lévitique.
- source_word: וְהַגֵּר
  choice: l’étranger établi parmi vous
  rationale: גֵּר désigne un non-Israélite qui réside durablement au sein de la communauté, et non un étranger simplement de passage.
- source_word: וְהַיָּתוֹם
  choice: l’orphelin
  rationale: « Orphelin » est le terme français courant pour cette catégorie vulnérable, même si l’hébreu peut mettre particulièrement en relief l’absence de père.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: qui habitent dans tes villes
  rationale: Les « portes » sont ici une métonymie habituelle pour les localités placées sous l’autorité du destinataire. « Dans tes villes » transmet le sens idiomatique en français actuel.
theological_decisions:
- issue: Statut social exprimé par עֶבֶד et אָמָה
  choice: tes esclaves, hommes et femmes
  alternative: ton serviteur et ta servante
  rationale: Le contexte énumère les membres dépendants et vulnérables du foyer et de la communauté. « Esclaves » évite d’atténuer leur condition juridique et sociale, tandis que « hommes et femmes » représente les deux termes hébreux sans formulation artificielle.
- issue: Identité sociale du גֵּר
  choice: l’étranger établi parmi vous
  alternative: l’immigré résident
  rationale: Le choix garde à la fois l’origine étrangère et la résidence au sein d’Israël, sans plaquer directement une catégorie administrative contemporaine sur le texte.
- issue: Portée de יָתוֹם
  choice: l’orphelin
  alternative: celui qui est sans père
  rationale: Le français courant emploie « orphelin » pour cette catégorie sociale. Une note conserve la nuance possible d’une vulnérabilité liée plus précisément à l’absence du père.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète l’adresse hébraïque à chaque Israélite. La liste reste inclusive et rythmée, tandis que les expressions idiomatiques sont rendues de façon immédiatement compréhensible; les notes conservent les nuances lexicales et culturelles.
