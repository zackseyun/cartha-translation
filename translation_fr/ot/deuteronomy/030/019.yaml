  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: fr
  text: 'Je prends aujourd’hui le ciel et la terre à témoin contre toi[a] : j’ai placé devant toi la vie et la mort, la bénédiction et la malédiction. Choisis la vie, afin que toi et ta descendance viviez[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette formule appartient au langage juridique de l’alliance : le ciel et la terre sont appelés comme témoins contre Israël.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « ta semence » ; c’est-à-dire tes descendants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: Je prends … à témoin contre toi
  rationale: 'Le hiphil de עוּד, construit ici avec ב, relève du langage juridique et d’alliance : Moïse invoque des témoins contre Israël. « Prendre à témoin contre » conserve cette valeur mieux qu’un simple « avertir ».'
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’insistance temporelle de l’hébreu dans un français actuel.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: le ciel et la terre
  rationale: Formule française naturelle correspondant à la paire hébraïque qui désigne l’ensemble cosmique appelé comme témoin.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: la vie et la mort
  rationale: Traduction directe de l’opposition entre les deux issues de l’alliance.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: j’ai placé devant toi
  rationale: Dans cette construction, נָתַן signifie présenter ou placer une réalité devant quelqu’un en vue d’un choix.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: la bénédiction et la malédiction
  rationale: Conserve les substantifs singuliers et leur contraste dans le cadre de l’alliance.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: Choisis la vie
  rationale: Le waw introduit ici l’exhortation qui découle des options présentées. En français, l’impératif suffit sans ajouter un connecteur explicatif absent du texte.
- source_word: לְמַעַן תִּחְיֶה
  choice: afin que tu vives
  rationale: « Afin que » exprime clairement la valeur finale de לְמַעַן tout en maintenant le lien verbal entre choisir la vie et vivre.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: toi et ta descendance
  rationale: זֶרַע signifie littéralement « semence » et, dans ce contexte familial, désigne collectivement les descendants. « Descendance » est naturel et garde cette portée collective.
theological_decisions:
- issue: Cadre judiciaire et témoins de l’alliance
  choice: La formulation invoque le ciel et la terre comme témoins contre Israël.
  alternative: « Je t’avertis aujourd’hui » ou « Je témoigne devant toi »
  rationale: Le tour hébreu appartient au langage juridique de l’alliance. Le conserver maintient la gravité de l’appel sans ajouter de développement doctrinal.
- issue: Deuxième personne masculine singulière à valeur représentative
  choice: Emploi de « toi », « choisis » et « tu » pour suivre le singulier hébreu adressé à Israël comme partenaire collectif de l’alliance.
  alternative: Employer le pluriel « vous » ou expliciter « vous, Israélites ».
  rationale: Le singulier est formellement présent tout au long du verset et peut naturellement représenter le peuple dans son ensemble. Le français permet de préserver ce trait.
- issue: Rapport entre l’exhortation et son but
  choice: « Choisis la vie, afin que tu vives » conserve à la fois l’impératif et la proposition finale.
  alternative: Développer en « choisis le chemin de la vie » ou interpréter la vie en un sens doctrinal plus précis.
  rationale: Le texte maintient une formulation dense, susceptible d’englober les dimensions concrètes et relationnelles de la vie dans l’alliance; la traduction ne les réduit pas à une seule interprétation.
translation_notes:
  register: Français international actuel, sobre et solennel. Le tutoiement suit la deuxième personne masculine singulière de l’hébreu, qui s’adresse collectivement à Israël. « Prendre à témoin » préserve la tonalité juridique sans archaïsme excessif.
