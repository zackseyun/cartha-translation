  text: כִּֽי קָר֥וֹב אֵלֶ֛י/ךָ הַ/דָּבָ֖ר מְאֹ֑ד בְּ/פִ֥י/ךָ וּ/בִֽ/לְבָבְ/ךָ֖ לַ/עֲשֹׂתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: fr
  text: 'Car la parole est tout près de toi[a] : elle est dans ta bouche et dans ton cœur, afin que tu la mettes en pratique.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la chose » ou « le commandement ». Le mot hébreu דָּבָר peut désigner une parole, une affaire ou un commandement selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication qui fonde l’affirmation précédente ; « Car » conserve clairement ce lien logique.
- source_word: קָרוֹב אֵלֶיךָ
  choice: est tout près de toi
  rationale: Cette formulation française naturelle exprime la proximité marquée par קָרוֹב et maintient le rapport personnel exprimé par אֵלֶיךָ.
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר peut désigner une parole, une affaire ou un commandement. « La parole » garde la forme lexicale large de l’hébreu sans réduire d’emblée le référent au commandement.
- source_word: מְאֹד
  choice: tout près
  rationale: Dans « tout près », « tout » intensifie idiomatiquement en français la proximité exprimée par מְאֹד, sans produire le tour moins naturel « très près de toi ».
- source_word: בְּפִיךָ
  choice: dans ta bouche
  rationale: La traduction directe conserve l’image corporelle de la parole prononcée.
- source_word: וּבִלְבָבְךָ
  choice: et dans ton cœur
  rationale: « Cœur » préserve le parallélisme bouche-cœur et rend לֵבָב, qui englobe la pensée, la volonté et la vie intérieure.
- source_word: לַעֲשֹׂתוֹ
  choice: afin que tu la mettes en pratique
  rationale: L’infinitif avec ל peut exprimer ici le but ou l’aboutissement. « Mettre la parole en pratique » est naturel en français et communique l’obéissance concrète impliquée par עָשָׂה.
theological_decisions:
- issue: Référent de « la parole »
  choice: Maintenir « la parole » dans le texte principal.
  alternative: « le commandement » ou « la chose »
  rationale: Le contexte immédiat concerne le commandement de Dieu, mais דָּבָר reste lexicalement plus large. La traduction conserve cette amplitude plutôt que de trancher dans le texte principal.
- issue: Valeur de לַעֲשֹׂתוֹ
  choice: « afin que tu la mettes en pratique »
  alternative: « pour la mettre en pratique »
  rationale: La formulation retenue explicite naturellement le rapport de but ou de résultat, sans décider au-delà de ce que permet la construction hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne du singulier. Les images « bouche » et « cœur » sont conservées, tandis que « mettre en pratique » rend l’action attendue de façon idiomatique.
