source:
  edition: WLC
  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: fr
  text: Car ce commandement que je te prescris aujourd’hui n’est pas hors de ta portée[a] ni éloigné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’est pas trop difficile pour toi » ou « ne t’est pas caché ». Le verbe hébreu peut désigner ce qui est extraordinaire, inaccessible ou au-delà de ce que quelqu’un peut saisir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’exhortation précédente ; « Car » rend clairement ce lien logique dans un registre soutenu mais courant.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: ce commandement
  rationale: מִצְוָה désigne un commandement ou un ordre. « Commandement » conserve ici la tonalité juridique et d’alliance propre au Deutéronome.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te prescris aujourd’hui
  rationale: « Prescrire » exprime naturellement l’acte d’ordonner dans ce contexte d’alliance, tandis que « aujourd’hui » maintient l’immédiateté du discours de Moïse.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: n’est pas hors de ta portée
  rationale: Le verbe פלא peut évoquer ce qui est extraordinaire, inaccessible, caché ou au-delà des capacités de quelqu’un. « Hors de ta portée » préserve l’idée générale d’inaccessibilité sans limiter le sens à la seule difficulté d’exécution.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: ni éloigné
  rationale: רָחוֹק exprime la distance, concrète ou figurée. « Éloigné » conserve la métaphore spatiale développée dans les versets suivants et s’accorde avec « commandement ».
theological_decisions:
- issue: Portée de נִפְלֵאת quant à la capacité humaine d’obéir au commandement de l’alliance
  choice: n’est pas hors de ta portée
  alternative: « n’est pas trop difficile pour toi » ou « ne t’est pas caché »
  rationale: La formulation affirme l’accessibilité du commandement dans son contexte immédiat, sans transformer le verset en déclaration générale sur l’autonomie morale ou les capacités humaines sans l’aide de Dieu. Elle maintient ainsi la tension théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme interlocuteur collectif. La phrase conserve la métaphore de l’accessibilité qui se poursuit aux versets 12 à 14.
