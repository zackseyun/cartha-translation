  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: fr
  text: 'Elle n’est pas non plus au-delà de la mer[a]. Tu n’auras pas à dire : « Qui traversera pour nous jusqu’à l’autre côté de la mer, ira nous la chercher[b] et nous la fera entendre[c], afin que nous la mettions en pratique ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’autre côté de la mer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la prenne pour nous » ; dans ce contexte, il s’agit d’aller l’obtenir et de la rendre accessible.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « nous la fasse entendre » ; cette tournure causative peut aussi évoquer le fait de la communiquer ou de l’expliquer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: au-delà de la mer
  rationale: Cette expression situe la chose de l’autre côté de la mer. « Au-delà de la mer » conserve l’image spatiale et reste naturel en français.
- source_word: הִוא
  choice: elle n’est
  rationale: Le pronom féminin renvoie au commandement mentionné dans le contexte précédent; le genre féminin est donc conservé en français.
- source_word: לֵאמֹר
  choice: pour que tu dises
  rationale: Dans cette construction négative, l’expression introduit l’objection hypothétique que l’éloignement pourrait susciter.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: traversera pour nous jusqu’à l’autre côté de la mer
  rationale: La formulation garde à la fois le mouvement de traversée, le bénéficiaire « pour nous » et la destination explicite אֶל עֵבֶר הַיָּם.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: ira nous la chercher
  rationale: Le verbe signifie littéralement « prendre », mais le contexte implique d’obtenir la parole située au loin et de la rendre accessible. « Aller nous la chercher » exprime naturellement ce mouvement en français.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: nous la fera entendre
  rationale: Le hiphil de שׁמע est causatif. Cette traduction en préserve directement la forme et le sens sans imposer « proclamer » ou « expliquer ».
- source_word: וְנַעֲשֶׂנָּה
  choice: afin que nous la mettions en pratique
  rationale: Le verbe עשה signifie « faire ». Pour un commandement, « mettre en pratique » est idiomatique et exprime l’obéissance visée, tandis que « afin que » rend clairement la relation de but.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. Le singulier « tu » suit l’adresse à Israël dans le contexte. La répétition de « la mer » et la destination « jusqu’à l’autre côté » sont maintenues pour refléter la formulation hébraïque. Les pronoms féminins renvoient au commandement du contexte.
