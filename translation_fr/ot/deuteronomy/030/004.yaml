  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: fr
  text: Si tes exilés[a] se trouvent à l’extrémité des cieux[b], de là Yahweh, ton Dieu, te rassemblera, et de là il te prendra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes bannis » ou « ceux des tiens qui ont été dispersés ». Le mot hébreu désigne des personnes chassées ou dispersées.
    reason: lexical_alternative
  - marker: b
    text: « À l’extrémité des cieux » est une expression hébraïque qui désigne le lieu le plus éloigné qui soit.
    reason: cultural_note
  - marker: c
    text: Ou, selon le contexte, « il ira te chercher ». Le verbe hébreu signifie littéralement « prendre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit directement la proposition conditionnelle, sans ajouter la nuance concessive de « même si », possible dans le contexte mais non explicite.
- source_word: נִדַּחֲךָ
  choice: tes exilés
  rationale: Le terme dérivé de נדח désigne ceux qui ont été chassés ou dispersés. « Tes exilés » reste concis, naturel en français et conserve la portée collective sous l’adresse au singulier.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: à l’extrémité des cieux
  rationale: Rend l’image spatiale hébraïque sans la remplacer dans le texte par son interprétation (« au lieu le plus lointain »).
- source_word: מִשָּׁם
  choice: de là
  rationale: La locution est répétée deux fois dans l’hébreu pour insister sur le lieu même d’où Dieu ramènera son peuple; cette répétition est conservée.
- source_word: יְקַבֶּצְךָ
  choice: te rassemblera
  rationale: Le piel de קבץ signifie rassembler ou réunir. Le pronom singulier maintient l’adresse collective faite à Israël.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré, et l’apposition française avec virgules exprime naturellement la désignation d’alliance.
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: et de là il te prendra
  rationale: Conserve le sens large et littéral de לקח ainsi que la seconde occurrence emphatique de « de là », sans anticiper le mouvement plus précisément décrit au verset suivant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte le nom personnel divin. La translittération « Yahweh » le distingue d’un titre et suit directement l’hébreu.
- issue: Adresse collective au singulier
  choice: « tes exilés » puis « te rassemblera… te prendra »
  alternative: Employer une adresse entièrement plurielle ou expliciter « ton peuple »
  rationale: L’hébreu s’adresse à Israël au masculin singulier tout en évoquant ses membres dispersés. Le français au singulier préserve cette tension entre l’unité du peuple et la pluralité des exilés.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image hébraïque des « cieux », la répétition de « de là » et l’adresse collective au singulier. « Tes exilés » est plus idiomatique que « tes dispersés » tout en évitant d’expliciter inutilement l’agent ou les circonstances de leur dispersion.
