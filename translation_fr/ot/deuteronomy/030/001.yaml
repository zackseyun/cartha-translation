  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: fr
  text: Quand toutes ces choses t’arriveront — la bénédiction et la malédiction que j’ai placées devant toi — et que tu y repenseras parmi toutes les nations où Yahweh, ton Dieu, t’aura chassé,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « tu les ramèneras à ton cœur ». L’expression peut désigner le fait de se les rappeler, d’y réfléchir ou de les intérioriser.
    reason: L’hébreu emploie l’image de faire revenir ces choses « au cœur » ; la note préserve cette image et ses nuances sans imposer une seule interprétation française.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La construction introduit une circonstance future; « Quand » en rend naturellement la valeur temporelle en français.
- source_word: יָבֹאוּ עָלֶיךָ
  choice: viendront sur toi
  rationale: Rend directement l’image hébraïque d’événements qui atteignent la personne, tout en restant intelligible en français.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces choses
  rationale: דברים désigne ici l’ensemble des réalités annoncées, explicitées immédiatement par la bénédiction et la malédiction.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: la bénédiction et la malédiction
  rationale: Formulation française courante qui conserve l’opposition des sanctions de l’alliance.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: que j’ai placées devant toi
  rationale: L’expression idiomatique signifie présenter ou placer devant quelqu’un; l’accord féminin renvoie à « la bénédiction et la malédiction ».
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: et que tu les ramèneras à ton cœur
  rationale: Cette traduction garde l’image hébraïque du retour vers le cœur et laisse ouvertes les nuances de souvenir, réflexion et intériorisation.
- source_word: בְּכָל הַגּוֹיִם
  choice: au milieu de toutes les nations
  rationale: Exprime la dispersion du destinataire parmi les peuples étrangers.
- source_word: הִדִּיחֲךָ
  choice: t’aura chassé
  rationale: Le verbe évoque l’action de repousser ou chasser au loin et convient au contexte d’exil.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu et conserve la formule d’alliance.
- source_word: שָׁמָּה
  choice: où
  rationale: En français, le sens locatif de « là » est naturellement intégré au relatif « où » après « les nations ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Portée de וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: tu les ramèneras à ton cœur
  alternative: tu les prendras à cœur / tu te les rappelleras
  rationale: Le calque intelligible préserve la tension entre remémoration, réflexion et intériorisation, sans réduire l’expression à une seule de ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier « toi » conserve l’adresse collective à Israël sous forme grammaticale individuelle. La phrase demeure ouverte, comme dans l’hébreu, car elle se poursuit au verset suivant.
