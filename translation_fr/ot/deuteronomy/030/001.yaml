  source_fidelity: 'Le sens global est fidèlement rendu : la circonstance future, l’ensemble des bénédictions et malédictions, la dispersion parmi les nations et l’action de Yahweh sont conservés. « T’arriveront » rend naturellement l’idiome « viendront sur toi » sans en modifier le sens. Pour וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ, le français « tu les ramèneras à ton cœur » est un calque compréhensible mais peu idiomatique ; « tu y repenseras » exprime bien le rappel réfléchi, tandis que la note conserve l’image du texte hébreu.'
  naturalness: La révision emploie un français international moderne et fluide. « Parmi toutes les nations » est plus direct que « au milieu de toutes les nations » dans ce contexte, et « Yahweh, ton Dieu » est une apposition française naturelle.
