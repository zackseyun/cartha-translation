base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: fr
  text: en aimant Yahvé ton Dieu, en écoutant sa voix[a] et en t’attachant à lui[b] ; car il est ta vie et la durée de tes jours, afin que tu habites dans le pays que Yahvé a juré de donner à tes pères, Abraham, Isaac et Jacob[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en obéissant à sa voix » ; en hébreu, « écouter la voix » implique souvent le fait d’en tenir compte et d’obéir.
    reason: lexical_alternative
  - marker: b
    text: Ou « en restant fermement uni à lui ».
    reason: lexical_alternative
  - marker: c
    text: Ou « à tes ancêtres » ; l’hébreu dit « à tes pères » et nomme aussitôt Abraham, Isaac et Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: en aimant
  rationale: L’infinitif construit avec לְ poursuit l’explication des moyens par lesquels Israël choisit la vie ; le gérondif français restitue naturellement cette valeur.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui en préserve la valeur personnelle et alliancielle.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: en écoutant sa voix
  rationale: La formulation conserve l’image concrète de l’hébreu, tout en laissant entendre dans le contexte la nuance d’attention effective et d’obéissance.
- source_word: וּלְדָבְקָה בוֹ
  choice: et en t’attachant à lui
  rationale: דבק avec ב exprime un attachement étroit et durable. « S’attacher à » est naturel en français moderne et convient à la fidélité d’alliance.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: car il est ta vie
  rationale: Le pronom renvoie le plus naturellement à Yahvé ; la formulation directe préserve la force personnelle de la proposition nominale.
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: et la durée de tes jours
  rationale: Cette traduction assez formelle conserve l’expression hébraïque sans la réduire à la seule idée d’une longue vie.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: afin que tu habites sur la terre
  rationale: L’infinitif peut exprimer ici le but ou le résultat. « Habiter sur la terre » maintient la portée territoriale et alliancielle.
- source_word: לַאֲבֹתֶיךָ
  choice: à tes pères
  rationale: Le terme masculin est conservé, d’autant que le texte nomme immédiatement Abraham, Isaac et Jacob.
- source_word: לָתֵת לָהֶם
  choice: de leur donner
  rationale: La construction française rattache clairement l’infinitif au serment de Yahvé et maintient les patriarches comme bénéficiaires explicitement désignés.
theological_decisions:
- issue: Référent de הוּא dans « car il est ta vie »
  choice: Le pronom renvoie à Yahvé lui-même.
  alternative: Le pronom pourrait résumer la voie d’obéissance décrite juste avant.
  rationale: Yahvé est l’antécédent personnel le plus saillant, et le masculin singulier favorise cette lecture, sans nier que la vie se manifeste dans l’obéissance d’alliance.
- issue: Rapport entre l’écoute et l’obéissance
  choice: Conserver « écouter sa voix » dans le texte.
  alternative: Traduire explicitement par « obéir à sa voix » ou « lui obéir ».
  rationale: L’idiome hébreu implique souvent l’obéissance, mais la formulation concrète préserve mieux l’expression source et sa richesse, avec une note signalant la nuance.
translation_notes:
  register: Français international moderne, naturel et digne. Tutoiement singulier maintenu conformément aux formes hébraïques de deuxième personne masculine singulière. La syntaxe conserve la continuité avec l’exhortation du verset précédent.
