  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: fr
  text: Yahweh, ton Dieu, te fera prospérer[a] dans tout le travail de tes mains, dans le fruit de ton ventre, dans le fruit de ton bétail et dans le fruit de ton sol, pour ton bien. Car Yahweh se réjouira de nouveau à ton sujet, pour ton bien[b], comme il s’est réjoui à l’égard de tes pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te donnera une grande abondance » ; le verbe hébreu exprime le fait de faire abonder ou d’accorder un surplus.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « reviendra à se réjouir à ton sujet, pour le bien ».'
    reason: source_ambiguity
  - marker: c
    text: Ici, « tes pères » désigne les pères des générations précédentes, c’est-à-dire les ancêtres d’Israël.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: te fera prospérer
  rationale: Le hifil de יתר exprime ici le fait de faire abonder ou de donner un surplus. « Te fera prospérer » rend naturellement en français cette action causative, dont les domaines concrets sont précisés dans la suite du verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: dans tout le travail de tes mains
  rationale: Cette formulation conserve l’image hébraïque de la main tout en employant le pluriel idiomatique en français.
- source_word: בִּפְרִי בִטְנְךָ
  choice: dans le fruit de ton ventre
  rationale: La métaphore hébraïque désignant la descendance est conservée; elle reste intelligible dans un registre biblique moderne.
- source_word: בְהֶמְתְּךָ
  choice: ton bétail
  rationale: Le terme désigne globalement les animaux domestiques dans ce contexte agricole.
- source_word: אַדְמָתְךָ
  choice: ton sol
  rationale: « Sol » garde le sens agricole concret de la terre cultivée, plutôt que le sens territorial plus large de « pays ».
- source_word: לְטוֹבָה
  choice: pour ton bien
  rationale: La formule indique un résultat bénéfique; l’ajout de « ton », implicite dans le contexte, produit un français clair.
- source_word: יָשׁוּב
  choice: de nouveau
  rationale: Avec l’infinitif qui suit, le verbe « revenir » marque ici la reprise d’une action.
- source_word: לָשׂוּשׂ עָלֶיךָ לְטוֹב
  choice: prendra de nouveau plaisir à te faire du bien
  rationale: Cette formulation française naturelle réunit la joie de Yahweh à l’égard d’Israël et l’orientation bénéfique exprimée par לְטוֹב, sans réduire שׂוש à une simple décision de bénir.
- source_word: אֲבֹתֶיךָ
  choice: tes pères
  rationale: Le masculin explicite est conservé; dans le contexte, il renvoie aux pères des générations précédentes, notamment aux ancêtres d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme comme nom personnel; la translittération le distingue d’un simple titre.
- issue: Relation entre la joie divine et le bien accordé à Israël
  choice: prendra de nouveau plaisir à te faire du bien
  alternative: se réjouira de nouveau à ton sujet, pour ton bien
  rationale: L’hébreu associe שׂוש על, la joie à l’égard d’Israël, à לְטוֹב, son bien. Le texte principal privilégie une expression française fluide, tandis que la note signale la construction plus littérale afin de ne pas masquer son ambiguïté.
- issue: Portée de אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Le terme est masculin et peut évoquer les patriarches aussi bien que les générations antérieures; le texte conserve cette forme sans exclure la portée ancestrale plus large.
translation_notes:
  register: Français international moderne, clair et digne. Les images agricoles répétées du texte hébreu (« fruit ») sont maintenues, ainsi que le tutoiement singulier adressé à Israël. La formulation évite un calque trop raide tout en signalant en note l’ambiguïté de la seconde proposition.
