source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר מִצְוֺתָי/ו֙ וְ/חֻקֹּתָ֔י/ו הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּ֑ה כִּ֤י תָשׁוּב֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: fr
  text: si tu écoutes la voix de Yahvé, ton Dieu[a], en observant ses commandements et ses prescriptions écrits dans ce livre de la Loi, si tu reviens à Yahvé, ton Dieu[b], de tout ton cœur et de toute ton âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « écouter la voix de » signifie ici prêter attention à ce que Dieu dit et lui obéir.
    reason: lexical_alternative
  - marker: b
    text: Ou « retournes à » ; dans ce contexte, ce retour implique la repentance et le renouvellement de la fidélité envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: si
  rationale: Dans ses deux occurrences, la conjonction introduit ici les conditions liées à la promesse énoncée dans le contexte précédent.
- source_word: תִשְׁמַע בְּקוֹל
  choice: tu écoutes la voix
  rationale: Cette formulation conserve l’image hébraïque tout en évoquant, dans le contexte, une écoute qui se traduit par l’obéissance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin plutôt que de le remplacer par le titre « le Seigneur ».
- source_word: לִשְׁמֹר
  choice: en observant
  rationale: 'L’infinitif précise la manière concrète d’écouter la voix de Dieu : garder et mettre en pratique ses exigences.'
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: ses commandements et ses prescriptions
  rationale: « Commandements » rend מִצְוֹת, tandis que « prescriptions » distingue naturellement חֻקּוֹת dans un contexte juridique et d’alliance.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: dans ce livre de la Loi
  rationale: Cette expression française claire conserve la référence au document de l’enseignement légal de l’alliance.
- source_word: תָשׁוּב אֶל
  choice: tu reviens à
  rationale: « Revenir à » préserve le mouvement métaphorique du verbe שׁוב et sa portée de retour à l’alliance sans le réduire au terme interprétatif « se repentir ».
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: de tout ton cœur et de toute ton âme
  rationale: Cette tournure française établie rend l’engagement total de la personne exprimé par les deux anthropologismes hébreux.
theological_decisions:
- issue: Portée du retour exprimé par שׁוב
  choice: reviens à
  alternative: te repens / retournes à
  rationale: Le verbe désigne fondamentalement un retour et comporte ici une dimension de repentance et de renouvellement de l’alliance. « Reviens à » maintient ensemble l’image et sa portée théologique sans explicitation excessive.
- issue: Représentation du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. Le conserver sous sa forme française traditionnelle évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme à un interlocuteur collectif. « Loi » prend une majuscule pour désigner ici la Torah comme corpus d’alliance.
