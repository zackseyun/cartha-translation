  variant: modern international French
source:
  edition: WLC
  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: fr
  text: Yahweh, ton Dieu, te conduira dans le pays que tes pères possédaient[a], et tu en prendras possession. Il te fera du bien[b] et te rendra plus nombreux que tes pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont tes pères avaient hérité » ou « dont tes pères avaient pris possession ». Le verbe hébreu peut exprimer l’héritage aussi bien que la prise de possession ou la possession.
    reason: lexical_alternative
  - marker: b
    text: Ou « il te fera prospérer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: te conduira dans
  rationale: Le hiphil de בוא signifie faire entrer ou amener. « Te conduira dans » est naturel en français et n’ajoute pas explicitement l’idée de retour, seulement implicite dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le nom avec suffixe de deuxième personne du masculin singulier signifie directement « ton Dieu ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte géographique et national, « pays » est idiomatique en français tout en désignant la terre promise.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: que tes pères possédaient
  rationale: ירשׁ peut exprimer l’héritage, la prise de possession ou la possession. Ici, l’imparfait « possédaient » décrit naturellement le rapport antérieur des pères au pays.
- source_word: וִירִשְׁתָּהּ
  choice: et tu en prendras possession
  rationale: Avec le pays pour objet, ירשׁ exprime couramment l’action d’en prendre possession. Cette formulation française rend mieux l’aspect actif que le simple verbe « posséder ».
- source_word: וְהֵיטִבְךָ
  choice: Il te fera du bien
  rationale: Le hiphil de יטב avec suffixe signifie littéralement faire du bien à quelqu’un. Cette formulation conserve l’étendue du sens sans le limiter à la prospérité matérielle.
- source_word: וְהִרְבְּךָ
  choice: et te rendra plus nombreux
  rationale: Le hiphil de רבה signifie rendre nombreux ou multiplier. « Te rendra plus nombreux » est naturel pour le peuple collectif auquel le singulier s’adresse.
- source_word: מֵאֲבֹתֶיךָ
  choice: que tes pères
  rationale: Le מן est comparatif. « Plus nombreux que tes pères » exprime clairement que la descendance restaurée dépassera les générations antérieures en nombre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; le conserver évite de le remplacer par un titre et maintient sa fonction d’identification dans l’expression « Yahweh, ton Dieu ».
- issue: Sens de יטב dans la promesse
  choice: Il te fera du bien
  alternative: Il te fera prospérer
  rationale: La formulation retenue conserve le sens bénéficiaire général du verbe et n’enferme pas la bénédiction dans la seule prospérité matérielle.
- issue: Terme de parenté אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: « Tes pères » reproduit le terme masculin du texte et son langage traditionnel d’alliance, sans neutraliser le référent.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier conserve l’adresse collective au peuple sous la forme grammaticale de la deuxième personne du singulier. La répétition de « tes pères » et le nom « Yahweh » maintiennent les traits saillants de l’hébreu.
