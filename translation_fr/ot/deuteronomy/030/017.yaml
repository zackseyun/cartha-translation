  text: וְ/אִם יִפְנֶ֥ה לְבָבְ/ךָ֖ וְ/לֹ֣א תִשְׁמָ֑ע וְ/נִדַּחְתָּ֗ וְ/הִֽשְׁתַּחֲוִ֛יתָ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/עֲבַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: fr
  text: Mais si ton cœur se détourne, si tu n’écoutes pas[b], si tu es entraîné[a] et que tu te prosternes devant d’autres dieux et les sers,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu es égaré » ou « tu es chassé ». Le verbe hébreu peut exprimer le fait d’être entraîné, écarté ou chassé de son allégeance.
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte de l’alliance, « écouter » peut aussi se traduire par « obéir », car le verbe hébreu implique souvent que l’on tient compte de ce qui est commandé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction introduit ici l’éventualité contraire à l’exhortation précédente. « Mais si » rend naturellement cette opposition contextuelle.
- source_word: יִפְנֶה לְבָבְךָ
  choice: ton cœur se détourne
  rationale: פנה signifie « tourner » ; avec « cœur », l’expression décrit un changement intérieur d’orientation et de fidélité. Le verbe pronominal français conserve cette image.
- source_word: וְלֹא תִשְׁמָע
  choice: si tu n’écoutes pas
  rationale: שׁמע couvre les idées d’entendre, d’écouter et d’obéir. « Écouter » préserve l’image auditive tout en pouvant impliquer que l’on tient compte de ce qui est dit.
- source_word: וְנִדַּחְתָּ
  choice: si tu es entraîné loin du bon chemin
  rationale: Le nifal de נדח exprime le fait d’être entraîné, écarté ou repoussé hors de la bonne orientation. Cette formulation française maintient la valeur passive et rend intelligible le déplacement moral et religieux sans en préciser l’agent.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: si tu te prosternes
  rationale: Le verbe désigne concrètement l’action de se courber ou de se prosterner. En contexte, ce geste constitue un acte d’adoration, mais la traduction conserve l’image physique.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: devant d’autres dieux
  rationale: Expression deutéronomique courante désignant des divinités rivales. « Devant » convient naturellement au geste de prosternation en français.
- source_word: וַעֲבַדְתָּם
  choice: et les sers
  rationale: עבד désigne le service, ici cultuel, rendu aux divinités. « Servir » maintient le sens lexical sans le réduire au seul acte d’adoration.
theological_decisions:
- issue: Progression de l’infidélité à l’alliance
  choice: 'Conserver la suite des actions et états : détournement du cœur, refus d’écouter, éloignement, prosternation et service d’autres dieux.'
  alternative: Traduire שׁמע par « obéir » et נדח par une tournure plus active, telle que « tu te laisses égarer ».
  rationale: L’hébreu décrit une progression sans identifier l’agent de l’éloignement ni expliquer davantage la responsabilité humaine. La traduction préserve cette tension et n’ajoute aucune conclusion doctrinale.
translation_notes:
  register: Français international actuel, sobre et digne. Le tutoiement singulier correspond à l’adresse hébraïque. La répétition de « si » clarifie en français la série de propositions conditionnelles, tandis que la virgule finale conserve le lien syntaxique avec le verset suivant.
