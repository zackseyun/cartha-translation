  text: אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לָ/לֶ֣כֶת בִּ/דְרָכָ֔י/ו וְ/לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו וּ/מִשְׁפָּטָ֑י/ו וְ/חָיִ֣יתָ וְ/רָבִ֔יתָ וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בָּ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: fr
  text: 'ce que je te commande aujourd’hui : aimer Yahvé, ton Dieu, marcher dans ses voies et observer ses commandements, ses prescriptions et ses règles de droit[a]. Alors tu vivras et tu deviendras nombreux, et Yahvé, ton Dieu, te bénira dans le pays où tu entres pour en prendre possession[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « ses ordonnances » ou « ses décisions de justice » pour מִשְׁפָּטָיו.
    reason: lexical_alternative
  - marker: b
    text: 'La suite des verbes hébreux peut aussi se comprendre comme exprimant le but ou le résultat : « afin que tu vives, que tu deviennes nombreux et que Yahvé, ton Dieu, te bénisse ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou « pour en hériter ». Littéralement, l’hébreu dit : « dans le pays où tu entres là pour le posséder »; « où » intègre naturellement en français l’idée de direction exprimée par « là » en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ce que je te commande aujourd’hui
  rationale: Conserve le lien relatif avec la proposition précédente tout en employant une formulation française claire; le présent rend bien l’adresse immédiate du participe hébreu.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: aimer Yahvé, ton Dieu
  rationale: L’infinitif exprime le contenu du commandement. « Yahvé » est la forme française usuelle du nom divin, plutôt qu’un titre substitutif.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: marcher dans ses voies
  rationale: Préserve la métaphore hébraïque de la conduite de vie dans un français biblique encore intelligible aujourd’hui.
- source_word: לִשְׁמֹר
  choice: observer
  rationale: Dans un contexte d’alliance et de loi, « observer » exprime naturellement l’idée de respecter et mettre en pratique.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: ses commandements, ses prescriptions et ses règles de droit
  rationale: Maintient les trois catégories juridiques distinctes; « règles de droit » rend la portée normative et judiciaire de מִשְׁפָּטִים sans l’ambiguïté moderne de « jugements ».
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: Alors tu vivras et tu deviendras nombreux
  rationale: Rend la séquence comme une conséquence ou promesse, tout en conservant l’adresse au singulier et l’idée de croissance numérique.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: dans le pays où tu entres pour en prendre possession
  rationale: Formulation française naturelle qui restitue le mouvement vers le pays et le suffixe objet; שָׁמָּה est intégré par « où » plutôt que traduit lourdement par « là ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR / YHWH
  rationale: Le texte porte le nom propre divin. « Yahvé » en donne une forme française reconnaissable et évite de le remplacer par un titre.
- issue: Valeur de la séquence וְחָיִיתָ וְרָבִיתָ וּבֵרַכְךָ
  choice: 'conséquence ou promesse: « Alors tu vivras… te bénira »'
  alternative: 'finalité ou résultat souhaité: « afin que tu vives… et que Yahvé… te bénisse »'
  rationale: La suite verbale hébraïque permet les deux relations avec le commandement; le texte principal retient la lecture promissive sans dissimuler l’autre possibilité.
- issue: Portée de לְרִשְׁתָּהּ
  choice: en prendre possession
  alternative: en hériter
  rationale: Le verbe peut exprimer la prise de possession du pays promis ou, selon le contexte théologique, le fait d’en hériter. La traduction principale reste concrète et non confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque à Israël. Les expressions « marcher dans ses voies » et « prendre possession » conservent les images et le registre d’alliance sans produire une syntaxe inutilement littérale.
