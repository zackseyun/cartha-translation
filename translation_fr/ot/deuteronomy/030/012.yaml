translation_notes:
  register: Français international moderne, digne et accessible. Le féminin « elle/la » maintient le lien contextuel avec « le commandement » compris comme « la prescription » ou la réalité féminine désignée en hébreu, tandis que la formulation conserve l’image spatiale et la chaîne d’actions du texte source.
