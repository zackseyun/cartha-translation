base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: fr
  text: 'Elle n’est pas dans le ciel, de sorte que tu doives dire : « Qui montera pour nous au ciel, ira nous la chercher et nous la fera entendre, afin que nous la mettions en pratique ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: dans le ciel
  rationale: Le syntagme désigne ici le domaine céleste présenté comme inaccessible, par contraste avec la proximité affirmée au verset 14. « Dans le ciel » est l’expression française naturelle, malgré la forme morphologiquement plurielle de l’hébreu.
- source_word: הִוא
  choice: elle n’est pas
  rationale: Le pronom féminin singulier renvoie à הַמִּצְוָה, « le commandement », au verset 11. Le féminin français maintient explicitement cette référence.
- source_word: לֵאמֹר
  choice: pour que tu dises
  rationale: L’infinitif introduit ici la parole hypothétique que rendrait nécessaire une inaccessible localisation céleste. Cette tournure conserve le rapport logique sans le surinterpréter.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Qui montera pour nous
  rationale: « Monter » rend directement עלה, tandis que « pour nous » conserve la valeur bénéficiaire de לָנוּ.
- source_word: הַשָּׁמַיְמָה
  choice: au ciel
  rationale: La terminaison directionnelle exprime un mouvement vers le ciel ; « au ciel » est idiomatique en français après « monter ».
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: ira nous la chercher
  rationale: Dans ce contexte, לקח exprime l’idée d’aller prendre le commandement là où il se trouverait pour le rapporter au peuple. « Aller chercher » rend naturellement cette valeur contextuelle, tout en conservant le bénéficiaire « nous ».
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: nous la fera entendre
  rationale: Cette formulation préserve la valeur causative du hiphil de שמע sans réduire nécessairement l’action à une proclamation formelle.
- source_word: וְנַעֲשֶׂנָּה
  choice: afin que nous la mettions en pratique
  rationale: עשה appliqué au commandement signifie l’accomplir ou l’observer. « Mettre en pratique » exprime clairement cette mise en œuvre et la relation de but portée par la séquence.
