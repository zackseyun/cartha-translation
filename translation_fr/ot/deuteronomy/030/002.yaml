  text: וְ/שַׁבְתָּ֞ עַד יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/שָׁמַעְתָּ֣ בְ/קֹל֔/וֹ כְּ/כֹ֛ל אֲשֶׁר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם אַתָּ֣ה וּ/בָנֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: fr
  text: tu reviendras à Yahweh, ton Dieu, et tu obéiras à sa voix[a], conformément à tout ce que je t’ordonne aujourd’hui, toi et tes enfants[b], de tout ton cœur et de toute ton âme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « tu écouteras sa voix ». En hébreu, cette expression signifie souvent écouter en obéissant.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tes fils » ; le terme hébreu peut désigner ici les enfants ou les descendants en général.
    reason: lexical_alternative
  - marker: c
    text: Ou « de toute ta vie » ou « de tout ton être ». Le mot hébreu peut désigner l’âme, la vie, la personne ou l’être tout entier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד
  choice: tu reviendras à
  rationale: שׁוּב exprime d’abord le retour ou le fait de revenir; dans ce contexte d’alliance, il implique un changement d’orientation sans qu’il soit nécessaire d’introduire le terme théologique plus étroit «se repentir».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: et tu écouteras sa voix
  rationale: La formulation conserve l’image hébraïque de l’écoute de la voix; dans cet idiome, écouter signifie aussi prêter attention et obéir, ce que précise la note.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: en faisant tout ce que je t’ordonne
  rationale: Le français naturel explicite que l’écoute se conforme à l’ensemble des commandements, sans réduire la portée de כְּכֹל.
- source_word: אַתָּה וּבָנֶיךָ
  choice: toi et tes enfants
  rationale: בָּנִים peut désigner les fils au sens strict ou, dans ce contexte familial et collectif, les descendants ou enfants de manière générique.
- source_word: בְּכָל לְבָבְךָ
  choice: de tout ton cœur
  rationale: Cette expression française courante restitue naturellement la totalité de l’engagement intérieur exprimée par l’hébreu.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: et de toute ton âme
  rationale: '«Âme» conserve le parallélisme traditionnel avec «cœur», tout en laissant ouverte la gamme de sens de נֶפֶשׁ: vie, personne ou être tout entier.'
theological_decisions:
- issue: Traduction du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; «Yahweh» préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Force de l’expression שׁמע בקול
  choice: écouter sa voix, avec une note indiquant le sens d’obéir
  alternative: obéir à sa voix
  rationale: Le choix principal préserve l’image et l’ambiguïté lexicale de l’hébreu, tandis que le contexte et la note rendent claire sa force d’obéissance.
- issue: Portée de בָנֶיךָ
  choice: tes enfants
  alternative: tes fils
  rationale: Le pluriel masculin peut être générique dans ce cadre d’alliance; «enfants» évite de restreindre sans nécessité la portée aux seuls garçons.
- issue: Portée anthropologique de נֶפֶשׁ
  choice: âme
  alternative: vie; être tout entier
  rationale: «Âme» maintient la formule cœur-âme sans imposer une définition dualiste; une note signale les autres valeurs possibles du mot hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond aux formes hébraïques adressées à Israël comme interlocuteur collectif. La phrase conserve la coordination du passage tout en employant «en faisant» pour exprimer clairement et naturellement la conformité à tous les commandements.
