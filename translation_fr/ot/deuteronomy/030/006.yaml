id: DEU.30.6
reference: Deuteronomy 30:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: fr
  text: Yahweh ton Dieu circoncira ton cœur et le cœur de tes descendants[a], afin que tu aimes Yahweh ton Dieu de tout ton cœur et de toute ton âme[b], afin que tu vives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le cœur de ta descendance »; le nom hébreu est collectif.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « âme » peut aussi désigner la vie ou la personne tout entière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: circoncira
  rationale: Le verbe מול désigne littéralement la circoncision. Avec « cœur » comme complément, l’image est métaphorique, mais son caractère concret et sa portée d’alliance doivent être préservés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier correspond à l’adresse directe à Israël envisagé au singulier; « ton Dieu » est naturel et exact.
- source_word: לְבָבְךָ
  choice: ton cœur
  rationale: לֵבָב désigne ici la personne intérieure, notamment sa volonté et ses affections; « cœur » conserve cette ampleur en français.
- source_word: לְבַב זַרְעֶךָ
  choice: le cœur de tes descendants
  rationale: זֶרַע est un nom collectif pouvant désigner la descendance. « Tes descendants » est plus naturel en français moderne que « ta semence » et explicite correctement le sens collectif.
- source_word: לְאַהֲבָה
  choice: afin que tu aimes
  rationale: L’infinitif avec ל exprime ici le but ou le résultat de l’action divine; « afin que » en conserve la force sans trancher excessivement entre ces nuances.
- source_word: בְּכָל לְבָבְךָ
  choice: de tout ton cœur
  rationale: Formulation française idiomatique qui exprime la totalité de l’attachement demandé.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: et de toute ton âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne entière. « Âme » conserve la formulation traditionnelle de ce commandement, tandis qu’une note signale l’étendue du terme hébreu.
- source_word: לְמַעַן חַיֶּיךָ
  choice: afin que tu vives
  rationale: לְמַעַן introduit le but ou le résultat; cette formulation est naturelle en français et garde ouverte cette nuance syntaxique.
theological_decisions:
- issue: Métaphore d’alliance de la circoncision du cœur
  choice: Maintien de « circoncira ton cœur » dans le texte principal.
  alternative: transformera ton cœur / purifiera ton cœur
  rationale: Le texte attribue à Dieu une transformation intérieure au moyen de l’image du signe de l’alliance. Conserver la métaphore maintient ce lien sans lui imposer une formulation doctrinale ultérieure.
- issue: Sens de נֶפֶשׁ dans la formule du commandement d’aimer
  choice: Traduction par « âme » avec une note lexicale.
  alternative: vie / être tout entier
  rationale: Le mot peut viser la personne vivante dans sa totalité. « Âme » préserve la formule biblique familière sans nier cette ampleur, laquelle est indiquée en note.
- issue: Rapport de but ou de résultat dans les deux propositions finales
  choice: Traduction de ל par « afin que » et de לְמַעַן par « afin que ».
  alternative: pour que / de sorte que
  rationale: Les constructions peuvent articuler étroitement but et résultat. « Afin que » rend leur orientation sans résoudre artificiellement cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël envisagé comme une personne collective. La métaphore concrète de la circoncision du cœur est volontairement conservée; aucune périphrase doctrinale n’est ajoutée.
