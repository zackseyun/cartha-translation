base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: fr
  text: Et toi, tu reviendras[a], tu écouteras la voix de Yahweh[b] et tu mettras en pratique tous ses commandements que je te prescris aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu retourneras » ; dans ce contexte, le verbe peut aussi évoquer un retour à l’alliance, c’est-à-dire une démarche de repentance.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie littéralement « écouter la voix de Yahweh » et implique souvent l’obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה תָשׁוּב
  choice: Et toi, tu reviendras
  rationale: 'Le pronom explicite souligne le sujet. « Reviendras » conserve l’éventail de שׁוב : retour concret, retour à l’alliance et changement d’orientation, sans réduire le terme au seul repentir.'
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: tu écouteras la voix de Yahweh
  rationale: La formulation garde l’image hébraïque « écouter la voix de » tout en laissant le contexte faire entendre sa portée d’obéissance. Le nom divin est translittéré « Yahweh ».
- source_word: וְעָשִׂיתָ אֶת כָּל מִצְוֺתָיו
  choice: tu mettras en pratique tous ses commandements
  rationale: Avec des commandements pour complément, « mettre en pratique » rend naturellement l’action exprimée par עשׂה et évite l’ambiguïté française de « faire des commandements ».
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: « Donner un commandement » est une expression française naturelle pour l’acte de prescrire. « Aujourd’hui » conserve l’insistance deutéronomique sur l’obligation présente.
theological_decisions:
- issue: Portée de שׁוב
  choice: tu reviendras
  alternative: tu te repentiras ; tu retourneras
  rationale: Le verbe peut évoquer le retour géographique aussi bien que le retour à Yahweh et à l’alliance. « Reviendras » maintient cette tension au lieu d’imposer une seule interprétation théologique.
- issue: Portée de שׁמע בקול
  choice: tu écouteras la voix de Yahweh
  alternative: tu obéiras à Yahweh
  rationale: L’idiome implique souvent l’obéissance, mais la proposition suivante précise déjà la mise en pratique des commandements. La traduction retenue préserve donc l’expression source et la progression du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le futur de l’indicatif suit la forme verbale du contexte. La répétition des sujets « toi, tu » conserve l’emphase hébraïque, tandis que l’absence d’un second « et » avant la dernière proposition évite une lourdeur peu naturelle en français.
