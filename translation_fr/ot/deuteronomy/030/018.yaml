    rationale: Le texte hébreu dit littéralement que le destinataire passe/traverse le Jourdain afin d’entrer là-bas et de posséder la terre. « Entrer … en traversant le Jourdain » peut suggérer que l’on entre dans la terre par le fait même de traverser, plutôt que de traverser le Jourdain pour y entrer.
