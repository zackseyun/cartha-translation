  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: fr
  text: Je vous déclare aujourd’hui que vous périrez assurément[a] ; vous ne prolongerez pas vos jours[b] sur la terre où tu passes le Jourdain pour y entrer et en prendre possession[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « vous périrez, oui, vous périrez », tournure emphatique qui exprime la certitude.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous ne vivrez pas longtemps sur cette terre ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie d’abord le pluriel (« vous »), puis passe ici au singulier (« tu »), s’adressant à Israël comme à un seul peuple.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: Je déclare
  rationale: Le hiphil de נגד exprime ici une annonce solennelle. « Déclarer » convient au caractère formel de l’avertissement.
- source_word: לָכֶם
  choice: vous
  rationale: Le pronom hébreu est masculin pluriel et désigne les Israélites auxquels Moïse s’adresse.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’indication temporelle et conserve l’immédiateté de l’avertissement d’alliance.
- source_word: כִּי
  choice: que
  rationale: Introduit le contenu de la déclaration en français naturel.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: vous périrez à coup sûr
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude. « À coup sûr » restitue cette emphase sans reproduire artificiellement la répétition hébraïque.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: vous ne prolongerez pas vos jours
  rationale: Cette formulation conserve l’image hébraïque des jours que l’on prolonge ainsi que sa résonance propre au langage de l’alliance.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: Dans ce contexte, אֲדָמָה désigne le territoire promis situé au-delà du Jourdain. « La terre » garde à la fois l’image concrète et la portée territoriale.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן לָבֹא שָׁמָּה
  choice: où tu vas entrer … en traversant le Jourdain
  rationale: La formulation française rend le mouvement imminent exprimé par le participe עֹבֵר et la destination marquée par שָׁמָּה, tout en évitant une construction relative peu naturelle.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: Dans le contexte de la terre promise, ירש signifie prendre possession d’un territoire. Le pronom « en » rend explicitement le suffixe féminin singulier renvoyant à la terre.
theological_decisions:
- issue: Alternance entre adresse plurielle et adresse singulière à Israël
  choice: Employer d’abord le pluriel « vous », puis le singulier « tu »
  alternative: Uniformiser toute l’adresse au pluriel ou au singulier
  rationale: Le texte hébreu passe réellement du pluriel dans la déclaration et la menace (לָכֶם, תֹּאבֵדוּן, תַאֲרִיכֻן) au singulier dans la proposition relative (אַתָּה עֹבֵר). Conserver cette alternance respecte la manière dont Deutéronome s’adresse tantôt aux Israélites collectivement, tantôt à Israël comme à un seul peuple.
- issue: Sens territorial de אֲדָמָה
  choice: Traduire par « la terre »
  alternative: Traduire par « le sol » ou « le territoire »
  rationale: Le contexte désigne la terre promise au-delà du Jourdain, et non le sol en tant que matière. « La terre » maintient le lien narratif et théologique sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international actuel, digne et accessible. Le texte conserve l’image « prolonger ses jours » et l’alternance significative entre le pluriel et le singulier. La fin de la phrase est légèrement réorganisée pour être idiomatique en français tout en rendant le franchissement du Jourdain, l’entrée dans la terre et la prise de possession.
