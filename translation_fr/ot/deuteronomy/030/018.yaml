  source_fidelity: 'Le sens général est fidèle, y compris l’emphase de אָבֹד תֹּאבֵדוּן, la durée de séjour sur la terre et l’alternance effective du pluriel au singulier. Toutefois, « où tu vas entrer … en traversant le Jourdain » présente le franchissement comme un simple moyen de l’entrée et atténue la syntaxe source : Israël « passe le Jourdain pour entrer là-bas ».'
  naturalness: « Vous périrez à coup sûr » est compréhensible, mais « vous périrez assurément » convient mieux au registre solennel. La relative est rendue plus naturellement et plus précisément par « où tu passes le Jourdain pour y entrer ».
  terminology: « Terre », « prolongerez pas vos jours » et « prendre possession » rendent correctement les termes et l’imagerie de l’hébreu. Le pronom singulier dans la relative est conservé sans imposer d’interprétation doctrinale.
