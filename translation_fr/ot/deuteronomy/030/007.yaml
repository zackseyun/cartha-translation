revisions:
- from: Yahweh, ton Dieu, fera retomber toutes ces malédictions[a] sur tes ennemis et sur ceux qui te haïssent, eux qui t’ont poursuivi.
  to: Yahweh, ton Dieu, infligera toutes ces malédictions[a] à tes ennemis et à ceux qui te haïssent, qui t’ont poursuivi.
  rationale: La révision remplace une image française acceptable mais plus interprétative par « infligera », et retire « eux » afin que la relative demeure naturellement rattachée à son antécédent immédiat, « ceux qui te haïssent ». Le sens, le registre et l’alternative lexicale en note sont préservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:04:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : Yahweh est sujet, les malédictions sont transférées aux ennemis, et רדף est correctement rendu par « poursuivre ». Toutefois, « eux qui » étend explicitement la relative à la fois aux ennemis et à ceux qui haïssent, alors que la relative hébraïque suit immédiatement « ceux qui te haïssent » et se rattache plus naturellement à ce groupe. Il convient de ne pas élargir ce rattachement.'
  naturalness: Le français est globalement fluide et de registre approprié. « Infligera ... à » est cependant plus direct et moins imagé que « fera retomber ... sur », tout en représentant avec naturel l’imposition exprimée par נתן avec על.
  terminology: « Yahweh », « ton Dieu », « malédictions », « ennemis » et « ceux qui te haïssent » sont appropriés au texte et au français international moderne. La note conserve utilement l’alternative lexicale de אָלוֹת sans faire de cette alternative le sens principal.
  issues:
  - severity: medium
    issue: Portée de la relative modifiée par « eux qui »
    rationale: Cette tournure fait reprendre « qui t’ont poursuivi » par l’ensemble coordonné « tes ennemis et ... ceux qui te haïssent ». Dans l’hébreu, אשר רדפוך suit שונאיך et qualifie naturellement « ceux qui te haïssent ». La version révisée conserve ce rattachement sans trancher au-delà de la syntaxe immédiate.
  - severity: low
    issue: « fera retomber » est légèrement plus imagé que le verbe source
    rationale: נתן signifie littéralement « mettre/placer/donner » et, dans ce contexte, exprime l’imposition des malédictions. « Infligera » rend cette fonction de façon plus directe et idiomatique en français.
  revised_text: Yahweh, ton Dieu, infligera toutes ces malédictions[a] à tes ennemis et à ceux qui te haïssent, qui t’ont poursuivi.
  revised_footnotes:
  - marker: a
    text: Ou « tous ces serments imprécatoires » ; dans le Deutéronome, ce terme désigne généralement les malédictions ou sanctions de l’alliance.
    reason: lexical_alternative
