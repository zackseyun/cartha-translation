  text: וְ/נָתַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥ת כָּל הָ/אָל֖וֹת הָ/אֵ֑לֶּה עַל אֹיְבֶ֥י/ךָ וְ/עַל שֹׂנְאֶ֖י/ךָ אֲשֶׁ֥ר רְדָפֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: fr
  text: Yahweh, ton Dieu, infligera toutes ces malédictions[a] à tes ennemis et à ceux qui te haïssent, qui t’ont poursuivi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ces serments imprécatoires » ; dans le Deutéronome, ce terme désigne généralement les malédictions ou sanctions de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: fera retomber
  rationale: Dans cette construction avec les malédictions pour objet et עַל pour introduire leurs destinataires, נתן exprime leur imposition. « Fera retomber … sur » est idiomatique en français et conserve cette image.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé dans le texte hébreu, sans lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: 'Le suffixe masculin singulier de deuxième personne indique simplement la possession : « ton Dieu ».'
- source_word: כָּל הָאָלֹות הָאֵלֶּה
  choice: toutes ces malédictions
  rationale: Dans le contexte de l’alliance en Deutéronome, אָלָה désigne les malédictions ou sanctions annoncées, tout en pouvant lexicalement évoquer des serments imprécatoires.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Équivalent français direct du pluriel avec suffixe de deuxième personne.
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: et sur ceux qui te haïssent
  rationale: Cette formulation naturelle restitue la valeur participiale de שׂנא et maintient le parallélisme avec « tes ennemis ».
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: eux qui t’ont poursuivi
  rationale: Le verbe רדף signifie poursuivre, pourchasser ou persécuter. « Poursuivi » conserve sa portée générale sans préciser indûment la forme de l’hostilité.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Sens de אָלוֹת dans le contexte de l’alliance
  choice: malédictions
  alternative: serments / imprécations
  rationale: Le contexte immédiat renvoie aux sanctions de l’alliance déjà énoncées. La note maintient visible la possibilité lexicale liée aux serments.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au suffixe hébreu masculin singulier adressé à Israël collectivement. « Eux qui » clarifie que la relative peut reprendre l’ensemble des ennemis et de ceux qui haïssent Israël, sans surcharger la phrase.
