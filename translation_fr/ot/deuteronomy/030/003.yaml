base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: fr
  text: alors Yahvé, ton Dieu, rétablira ta situation[a] et aura compassion de toi. Il te rassemblera de nouveau[b] du milieu de tous les peuples[c] parmi lesquels Yahvé, ton Dieu, t’aura dispersé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ramènera ta captivité ». Cette expression hébraïque signifie rétablir quelqu’un après une période de détresse ou d’exil.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Il reviendra et te rassemblera ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « toutes les nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin d’alliance sous sa forme française courante, plutôt que de le remplacer par un titre.
- source_word: שָׁב אֶת שְׁבוּתְךָ
  choice: rétablira ta situation
  rationale: Cette locution hébraïque exprime le renversement d’une situation de détresse ou d’exil. Cette formulation française en restitue le sens sans confondre la restauration avec le rassemblement mentionné ensuite.
- source_word: וְרִחֲמֶךָ
  choice: et aura compassion de toi
  rationale: Le verbe רחם exprime une compassion miséricordieuse; la formulation retenue est naturelle, digne et fidèle à sa force affective.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: Il te rassemblera de nouveau
  rationale: Le second שָׁב peut apporter à קבץ le sens de répétition ou être compris comme un verbe distinct. Le texte principal adopte la première analyse, fluide en français, et la note conserve l’autre possibilité.
- source_word: מִכָּל הָעַמִּים
  choice: du milieu de tous les peuples
  rationale: עַמִּים désigne ici les différents peuples au sein desquels Israël a été dispersé; « peuples » en garde la nuance collective et ethnique.
- source_word: הֱפִיצְךָ
  choice: t’aura dispersé
  rationale: Le hifil de פוץ signifie faire se disperser. « Disperser » convient naturellement au contexte de l’exil et s’accorde avec le rassemblement promis.
- source_word: שָׁמָּה
  choice: parmi lesquels
  rationale: L’adverbe locatif « là » est intégré idiomatiquement à la proposition relative française tout en conservant son sens spatial.
theological_decisions:
- issue: Sens de la locution שׁוּב אֶת־שְׁבוּת
  choice: rétablira ta situation
  alternative: ramènera tes captifs ; mettra fin à ta captivité
  rationale: La locution désigne probablement ici le rétablissement de la condition du peuple. La rendre par un retour de captifs déplacerait l’objet vers un groupe distinct, tandis que le rassemblement concret des dispersés est exprimé dans la proposition suivante.
- issue: Valeur du second וְשָׁב
  choice: Il te rassemblera de nouveau
  alternative: Il reviendra et te rassemblera
  rationale: L’hébreu permet de comprendre שָׁב comme marquant la répétition du rassemblement ou comme un verbe autonome. La traduction principale suit la première possibilité, mais la note maintient l’ambiguïté réelle sans imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme entité collective. La syntaxe reste naturelle tout en conservant le parallélisme entre dispersion et rassemblement.
