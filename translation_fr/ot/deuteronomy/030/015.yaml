  text: רְאֵ֨ה נָתַ֤תִּי לְ/פָנֶ֨י/ךָ֙ הַ/יּ֔וֹם אֶת הַֽ/חַיִּ֖ים וְ/אֶת הַ/טּ֑וֹב וְ/אֶת הַ/מָּ֖וֶת וְ/אֶת הָ/רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: fr
  text: 'Vois : j’ai placé[a] aujourd’hui devant toi la vie et le bien, la mort et le mal[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donné » ou « mis » devant toi.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner ce qui est mauvais, le malheur ou le dommage ; ici, il s’oppose directement au « bien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Vois
  rationale: Impératif singulier de ראה employé pour attirer solennellement l’attention. « Vois » conserve l’appel direct sans recourir à l’archaïsme « voici ».
- source_word: נָתַתִּי
  choice: j’ai placé
  rationale: נתן peut signifier « donner », « mettre » ou « placer ». Avec « devant toi », « j’ai placé » exprime naturellement la présentation de deux voies opposées.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Expression idiomatique qui présente des possibilités soumises au choix du destinataire.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent direct et naturel de l’indication temporelle hébraïque.
- source_word: הַחַיִּים
  choice: la vie
  rationale: Bien que de forme plurielle en hébreu, חַיִּים fonctionne couramment comme un nom abstrait singulier désignant la vie.
- source_word: הַטּוֹב
  choice: le bien
  rationale: « Le bien » préserve le parallélisme lexical et l’opposition directe avec « le mal », sans restreindre le sens à la prospérité ou au bien-être.
- source_word: הַמָּוֶת
  choice: la mort
  rationale: Traduction directe du nom, en antithèse avec « la vie ».
- source_word: הָרָע
  choice: le mal
  rationale: רַע peut désigner le mal moral, ce qui est mauvais, le malheur ou le dommage. « Le mal » maintient en français l’ampleur du terme et son opposition formelle avec « le bien ».
theological_decisions:
- issue: Portée de הָרָע dans l’antithèse de l’alliance
  choice: le mal
  alternative: le malheur ; ce qui est mauvais ; le dommage
  rationale: Le verset oppose globalement la vie et le bien à la mort et au mal. « Le mal » conserve la dimension morale et existentielle de cette opposition sans exclure les conséquences nuisibles ou désastreuses que le mot hébreu peut aussi évoquer.
translation_notes:
  register: Français international moderne, sobre et solennel. La construction parallèle et les quatre termes fondamentaux de l’hébreu sont conservés. Le deux-points après « Vois » rend sa fonction d’appel à l’attention tout en gardant une syntaxe française naturelle.
