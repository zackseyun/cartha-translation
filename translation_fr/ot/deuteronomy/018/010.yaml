  text: לֹֽא יִמָּצֵ֣א בְ/ךָ֔ מַעֲבִ֥יר בְּנֽ/וֹ וּ/בִתּ֖/וֹ בָּ/אֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּ/מְנַחֵ֖שׁ וּ/מְכַשֵּֽׁף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: fr
  text: Il ne se trouvera parmi vous personne qui fasse passer son fils ou sa fille par le feu[a], qui pratique la divination, qui prédise l’avenir[b], qui interprète les présages[c] ou qui pratique la sorcellerie[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui brûle son fils ou sa fille dans le feu » ou « qui offre son fils ou sa fille dans le feu ». L’hébreu dit littéralement : « qui fait passer son fils ou sa fille par le feu ».'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu est difficile. Une traduction traditionnelle, plus littérale, est « qui observe les temps » ; on le rend aussi par « devin » ou « diseur de bonne aventure ».
    reason: lexical_alternative
  - marker: c
    text: Ou « qui pratique l’augure » ou « qui devine d’après des signes ».
    reason: lexical_alternative
  - marker: d
    text: Ou « qui pratique la magie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: Il ne doit se trouver parmi vous
  rationale: Le niphal imparfait précédé de la négation exprime ici une interdiction communautaire. « Parmi vous » rend naturellement בְךָ dans ce contexte juridique.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: qui fasse passer par le feu son fils ou sa fille
  rationale: Le participe hiphil de עבר signifie littéralement « faire passer ». Cette formulation conserve l’expression hébraïque sans préciser au-delà du texte la forme exacte du rite condamné.
- source_word: קֹסֵם קְסָמִים
  choice: qui pratique la divination
  rationale: Le participe accompagné de l’accusatif de même racine désigne l’exercice de la divination. Cette formulation est claire et naturelle en français moderne.
- source_word: מְעוֹנֵן
  choice: qui prédise l’avenir
  rationale: Le terme hébreu est difficile et son sens exact demeure discuté. « Prédire l’avenir » communique en français courant une pratique divinatoire tout en laissant une note signaler d’autres compréhensions possibles.
- source_word: מְנַחֵשׁ
  choice: qui interprète les présages
  rationale: Le verbe est associé à la recherche ou à l’interprétation de signes annonciateurs. Ce choix le distingue de la divination au sens large mentionnée auparavant.
- source_word: מְכַשֵּׁף
  choice: qui pratique la sorcellerie
  rationale: Le participe piel désigne celui qui se livre aux arts magiques. « Pratiquer la sorcellerie » convient au parallélisme verbal de la liste et reste compréhensible en français contemporain.
theological_decisions:
- issue: Nature de l’interdiction concernant l’enfant et le feu
  choice: Conserver dans le texte l’idiome hébreu « faire passer par le feu son fils ou sa fille ».
  alternative: « brûler son fils ou sa fille dans le feu » ou « offrir son fils ou sa fille dans le feu »
  rationale: Le contexte condamne clairement un rite païen impliquant des enfants et le feu, mais cette proposition ne décrit pas explicitement tous les détails du rite. Maintenir l’idiome évite de trancher ce que le verset seul laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétée « qui… » restitue la série de participes hébreux sans lourdeur excessive. Les termes techniques sont rendus de manière accessible, et les incertitudes lexicales réelles sont conservées dans les notes.
