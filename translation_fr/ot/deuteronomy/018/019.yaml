  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: fr
  text: Quant à l’homme qui n’écoutera pas mes paroles, celles que le prophète prononcera en mon nom, c’est moi-même qui lui en demanderai compte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je l’exigerai de lui ». L’expression hébraïque indique ici que Dieu tiendra cet homme personnellement responsable de son refus d’écouter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Et si
  rationale: Dans ce contexte, la formule introduit le cas envisagé et sa conséquence. « Et si » restitue naturellement cette fonction en français sans le calque pesant « et il arrivera que ».
- source_word: הָאִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et possède ici une valeur représentative. « Un homme » conserve la forme du texte source.
- source_word: לֹא יִשְׁמַע אֶל
  choice: n’écoute pas
  rationale: Le verbe avec אֶל implique l’écoute attentive pouvant conduire à l’obéissance. « N’écoute pas » préserve cette amplitude sans expliciter excessivement par « n’obéit pas ».
- source_word: דְּבָרַי
  choice: mes paroles
  rationale: Le pluriel avec suffixe de première personne est rendu directement et conserve la parole divine comme objet du refus.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: celles que le prophète prononcera
  rationale: Le sujet grammatical est implicite mais renvoie au prophète du verset précédent. Le nommer évite en français une ambiguïté pronominale artificielle, tandis que le futur rend la portée prospective de l’imparfait hébreu.
- source_word: בִּשְׁמִי
  choice: en mon nom
  rationale: Cette expression française conserve à la fois la forme de l’idiome et sa portée d’autorisation et de représentation divines.
- source_word: אָנֹכִי
  choice: moi-même
  rationale: Le pronom indépendant est emphatique. « Moi-même » marque que Dieu personnellement demandera compte du refus.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: je lui en demanderai compte
  rationale: Cette tournure française exprime clairement la responsabilité judiciaire impliquée par דרשׁ avec מֵעִם, sans préciser une sanction que le texte ne nomme pas.
theological_decisions:
- issue: Nature de la réponse divine au refus des paroles du prophète
  choice: je lui en demanderai compte
  alternative: j’exigerai cela de lui
  rationale: L’hébreu annonce que Dieu tiendra personnellement le récalcitrant pour responsable, mais ne précise ni la procédure ni le châtiment. La formulation retenue maintient cette réserve.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase reste solennelle sans archaïsme. « Le prophète » explicite le sujet sous-entendu à partir du contexte immédiat, et la note conserve la formulation plus littérale de la clause judiciaire.
