  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: fr
  text: 'selon tout ce que tu as demandé à l’Éternel, ton Dieu, à Horeb, le jour de l’assemblée, lorsque tu as dit : « Que je ne continue pas à entendre la voix de l’Éternel, mon Dieu, et que je ne voie plus ce grand feu, de peur de mourir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: conformément à tout ce que tu as demandé à
  rationale: Rend la comparaison avec ce qui précède et la tournure hébraïque de demande adressée à quelqu’un, sans reproduire le peu naturel « demandé de la part de ».
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Convention française digne et largement intelligible pour le tétragramme, tout en le distinguant du titre אֲדֹנָי.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: Forme française traditionnelle du nom géographique, avec l’article usuel.
- source_word: בְּיוֹם הַקָּהָל
  choice: le jour de l’assemblée
  rationale: Traduction directe de קָהָל désignant le rassemblement collectif à l’Horeb.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: Que je ne continue pas à entendre
  rationale: La construction avec יסף exprime ici la continuation ou la répétition; cette formulation conserve la nuance sans l’aplatir en simple négation.
- source_word: וְאֶת הָאֵשׁ הַגְּדֹלָה הַזֹּאת לֹא אֶרְאֶה עוֹד
  choice: et que je ne voie plus ce grand feu
  rationale: Rend עוֹד par « plus » et conserve l’enchaînement parallèle des deux demandes.
- source_word: וְלֹא אָמוּת
  choice: de peur de mourir
  rationale: Dans ce contexte, le waw introduit le résultat redouté; la formulation française exprime naturellement cette finalité négative.
theological_decisions:
- issue: Valeur de וְלֹא אָמוּת
  choice: de peur de mourir
  alternative: et je ne mourrai pas
  rationale: La parole rapportée motive le refus d’entendre et de voir davantage par la crainte de la mort. Le choix exprime cette relation contextuelle sans transformer la phrase en promesse catégorique.
- issue: Désignation divine par le tétragramme
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: « l’Éternel » suit une convention française reconnue et évite d’imposer une vocalisation discutée du nom divin.
translation_notes:
  register: Français moderne, courant et digne. Tutoiement singulier maintenu, conformément aux formes hébraïques adressées à Israël comme interlocuteur collectif. La phrase reste syntaxiquement liée au verset précédent, comme dans le texte source.
