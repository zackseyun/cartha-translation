  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: fr
  text: Car Yahweh, ton Dieu, l’a choisi parmi toutes tes tribus pour se tenir et servir au nom de Yahweh, lui et ses fils, tous les jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « continuellement ». Littéralement : « tous les jours » ; dans ce contexte, l’expression évoque un service sacerdotal durable et continu.'
    reason: La formule hébraïque כָּל־הַיָּמִים est conservée dans le texte, tandis que la note indique sa portée continue en contexte sans lui attribuer le sens plus fort de « pour toujours ».
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la disposition précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: בּוֹ בָּחַר
  choice: l’a choisi
  rationale: Avec בחר, la préposition ב marque ici la personne choisie; le passé composé exprime en français un choix accompli dont les effets demeurent.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Rend directement le nom divin et le suffixe de deuxième personne du singulier, en accord avec l’adresse à Israël.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: parmi toutes tes tribus
  rationale: « Parmi » exprime clairement qu’il est choisi au sein de l’ensemble des tribus.
- source_word: לַעֲמֹד
  choice: pour se tenir là
  rationale: Conserve l’image concrète de la station sacerdotale; « là » rend la tournure naturelle sans préciser un lieu absent du verset.
- source_word: לְשָׁרֵת
  choice: et servir
  rationale: « Servir » garde la portée cultuelle du verbe dans ce contexte sans ajouter un vocabulaire ecclésiastique plus étroit.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: Expression française naturelle qui préserve l’idée d’un service exercé sous le nom et l’autorité de Yahweh.
- source_word: הוּא וּבָנָיו
  choice: lui et ses fils
  rationale: Respecte le masculin explicite du texte et la succession sacerdotale lévitique.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Reproduit de près l’expression hébraïque tout en laissant ouverte sa portée, continue ou durable.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; sa translittération préserve le nom propre de l’alliance.
- issue: Transmission masculine du service sacerdotal
  choice: lui et ses fils
  alternative: lui et ses enfants
  rationale: Le substantif hébreu désigne précisément les fils; le contexte concerne la lignée sacerdotale et ne justifie pas de neutraliser le genre.
- issue: Durée du service sacerdotal
  choice: tous les jours
  alternative: pour toujours / continuellement
  rationale: La traduction formelle conserve l’expression temporelle hébraïque et son possible sens de continuité durable sans transformer celle-ci en affirmation métaphysique explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque à Israël. La syntaxe conserve l’image sacerdotale de celui qui « se tient » pour servir, sans explicitation doctrinale ajoutée.
