  source_fidelity: 'Le sens fondamental est bien rendu : Yahweh choisit le lévite parmi les tribus pour une fonction de service, et le texte conserve explicitement « lui et ses fils ». Toutefois, « là » dans « se tenir là » ajoute une indication spatiale absente de l’hébreu. La note propose aussi « pour toujours », formulation trop forte pour כָּל־הַיָּמִים, qui exprime plus prudemment une permanence/continuité dans le cadre du service.'
