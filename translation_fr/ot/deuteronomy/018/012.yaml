revisions:
- from: Car quiconque pratique ces choses est en abomination à Yahweh, et c’est à cause de ces pratiques abominables que Yahweh ton Dieu dépossède ces nations devant toi.[a]
  to: Car quiconque pratique ces choses est une abomination pour Yahweh, et c’est à cause de ces abominations que Yahweh ton Dieu les chasse devant toi.[a]
  rationale: La révision remplace un calque français par une tournure naturelle, rétablit la répétition lexicale entre « abomination » et « abominations », et rend le verbe hébreu par « les chasse devant toi », expression contextuellement claire. La note conserve l’ambiguïté lexicale entre expulsion et dépossession sans modifier le sens du passage.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:02:07Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens causal, la portée universelle, le nom divin et l’expulsion des nations sont globalement bien rendus. Toutefois, « dépossède ces nations devant toi » est moins idiomatique en français et la note inverse inutilement le choix principal par rapport au texte anglais audité. « Ces abominations » restitue aussi plus directement le pluriel hébreu et sa continuité lexicale avec « une abomination ».
  naturalness: « Est en abomination à Yahweh » est un calque peu naturel en français moderne. « Est une abomination pour Yahweh » est à la fois idiomatique, soutenu et fidèle. « Yahweh ton Dieu les chasse devant toi » exprime naturellement le contexte d’expulsion sans expliciter au-delà du texte le complément « du pays ».
  terminology: Yahweh est conservé. « Abomination » maintient la force et la cohérence de תועבה / תועבות. « Chasser » rend naturellement le sens contextuel de מוריש, tandis que la note conserve l’alternative « déposséder ».
  issues:
  - severity: medium
    issue: Formulation française peu naturelle de l’expression d’abomination
    rationale: « est en abomination à » est un calque; la construction usuelle est « est une abomination pour ». Le sujet personnel et la force du terme hébreu sont ainsi conservés.
  - severity: low
    issue: Répétition lexicale atténuée dans « pratiques abominables »
    rationale: Le texte hébreu emploie le même lexème au singulier puis au pluriel. « ces abominations » préserve plus exactement ce lien sans nuire à la lisibilité.
  - severity: medium
    issue: Note lexicale et formulation de l’expulsion à corriger
    rationale: '« chasse ... loin de toi » ne correspond pas bien à « devant toi » et la note devrait présenter « dépossède » comme l’alternative au rendu contextuel naturel « chasse ». '
  revised_text: Car quiconque pratique ces choses est une abomination pour Yahweh, et c’est à cause de ces abominations que Yahweh ton Dieu les chasse devant toi.[a]
  revised_footnotes:
  - marker: a
    text: Ou « les dépossède » ; le verbe hébreu peut souligner soit l’expulsion des nations, soit la perte de leur possession du pays.
    reason: lexical_alternative
