  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: fr
  text: Car quiconque pratique ces choses est une abomination pour Yahweh, et c’est à cause de ces abominations que Yahweh ton Dieu les chasse devant toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dépossède » ; le verbe hébreu peut souligner soit l’expulsion des nations, soit la perte de leur possession du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison des interdictions précédentes et conserve naturellement la valeur explicative de la conjonction.
- source_word: תוֹעֲבַת יְהוָה
  choice: est en abomination à Yahweh
  rationale: Rend la force morale et cultuelle de תוֹעֵבָה tout en exprimant clairement qu’une telle personne est odieuse aux yeux de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: quiconque pratique ces choses
  rationale: Le participe avec כָּל a une portée universelle indéfinie; « pratique » convient aux actes habituels énumérés dans le contexte.
- source_word: וּבִגְלַל
  choice: et c’est à cause de
  rationale: Exprime directement le rapport causal entre les pratiques condamnées et l’expulsion des nations.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: ces pratiques abominables
  rationale: Renvoie clairement aux pratiques occultes des versets précédents, tout en maintenant le lien lexical avec « abomination ».
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Conserve l’adresse à la deuxième personne du singulier faite à Israël.
- source_word: מוֹרִישׁ אֹתָם
  choice: dépossède ces nations
  rationale: Le hiphil de ירש met ici l’accent sur le fait de faire perdre aux peuples la possession du pays; « ces nations » explicite le référent contextuel du pronom.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Reproduit l’expression spatiale idiomatique du texte hébreu dans le contexte de l’avancée d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom personnel divin; sa transcription préserve cette distinction sans substituer un titre.
- issue: Objet du jugement divin
  choice: la personne qui pratique ces choses « est en abomination » à Yahweh
  alternative: ces pratiques sont abominables à Yahweh
  rationale: La syntaxe hébraïque fait de « quiconque pratique ces choses » le sujet de l’expression, tandis que la seconde proposition qualifie les actes eux-mêmes d’abominations; cette tension est conservée.
translation_notes:
  register: Français moderne, digne et accessible. « Quiconque » garde la portée générale; « pratiques abominables » évite une répétition lourde tout en conservant le lien lexical avec « abomination ». Le marqueur de note est placé après la proposition concernée.
