  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: fr
  text: Les prêtres lévitiques — toute la tribu de Lévi — n’auront ni part ni héritage avec Israël. Ils mangeront les offrandes offertes par le feu à Yahweh[a] et son héritage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les offrandes par le feu de Yahweh ». Cette expression désigne des offrandes sacrificielles présentées à Yahweh; certaines parts revenaient aux prêtres.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom traduit par « son » est au singulier. Il peut renvoyer à Yahweh (« son héritage ») ou, collectivement, à Lévi ou au Lévite; comparer le verset 2, où Yahweh est appelé leur héritage.
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: Les prêtres lévitiques
  rationale: L’apposition hébraïque identifie les prêtres comme lévitiques. Cette formulation concise et naturelle ne les sépare pas de la tribu de Lévi.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: toute la tribu de Lévi
  rationale: כָּל marque l’étendue complète de la disposition et précise qu’elle concerne toute la tribu, non les seuls prêtres au sens étroit.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ni part ni héritage
  rationale: Les deux termes quasi synonymes désignent la part attribuée et le patrimoine héréditaire. Après la négation, la corrélation française « ni… ni… » restitue naturellement la coordination hébraïque.
- source_word: עִם יִשְׂרָאֵל
  choice: avec Israël
  rationale: La préposition exprime ici l’absence de possession partagée avec les autres tribus d’Israël.
- source_word: אִשֵּׁי יְהוָה
  choice: les offrandes destinées à Yahweh
  rationale: אִשִּׁים désigne les offrandes sacrificielles présentées à Yahweh, étymologiquement associées au feu. La formulation choisie évite de laisser entendre que les prêtres mangent ce qui a été entièrement brûlé; une note conserve le rendu plus littéral.
- source_word: וְנַחֲלָתוֹ
  choice: ainsi que son héritage
  rationale: Le suffixe masculin singulier est conservé sans préciser artificiellement son référent. « Ainsi que » maintient la coordination par וְ sans imposer comme certaine une relation explicative.
- source_word: יֹאכֵלוּן
  choice: Ils mangeront
  rationale: L’imparfait exprime ici la disposition habituelle ou future de la loi; le futur français convient au contexte législatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin du texte hébreu.
theological_decisions:
- issue: Référent et fonction de « son héritage »
  choice: Conserver « son héritage » comme second élément coordonné
  alternative: « c’est-à-dire son héritage » ou « l’héritage de Yahweh »
  rationale: L’hébreu emploie וְ, « et », ainsi qu’un suffixe masculin singulier dont le référent peut être compris de plusieurs façons. Le texte principal ne transforme donc pas la coordination en apposition certaine et la note signale l’ambiguïté, en lien avec le verset suivant.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source porte le nom propre divin; « Yahweh » le distingue d’un titre et suit la décision éditoriale fournie.
translation_notes:
  register: Français international moderne, sobre et législatif. Les tirets mettent en relief l’apposition explicative sans alourdir la phrase. « Héritage » est maintenu dans les deux propositions pour préserver le lien lexical du verset et avec Deutéronome 18.2.
