  text: נָבִ֨יא מִ/קִּרְבְּ/ךָ֤ מֵ/אַחֶ֨י/ךָ֙ כָּמֹ֔/נִי יָקִ֥ים לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֵלָ֖י/ו תִּשְׁמָעֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: fr
  text: Le SEIGNEUR ton Dieu fera surgir pour toi, au sein de ton peuple, d’entre tes frères[a], un prophète comme moi[b] ; vous devrez l’écouter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « d’entre tes frères ». Dans ce contexte, l’expression désigne les autres membres du peuple d’Israël, et non seulement des frères biologiques.
    reason: lexical_alternative
  - marker: b
    text: Dans le Nouveau Testament, ce passage est appliqué à Jésus, le Messie (Actes 3.22 ; 7.37). Toutefois, l’hébreu dit ici simplement « un prophète comme moi ».
    reason: cross_reference
  - marker: c
    text: L’hébreu passe ici du singulier (« ton », « toi », « tes »), qui s’adresse à Israël comme à une unité, au pluriel (« vous devrez »), qui s’adresse aux membres du peuple.
    reason: source_form
lexical_decisions:
- source_word: נָבִיא
  choice: un prophète
  rationale: Le nom hébreu est au singulier et sans article. « Un prophète » en restitue naturellement la forme sans préciser davantage son identité.
- source_word: מִקִּרְבְּךָ
  choice: du milieu de toi
  rationale: Cette formulation assez littérale conserve l’idée que le prophète surgira au sein même d’Israël.
- source_word: מֵאַחֶיךָ
  choice: d’entre tes frères
  rationale: Le terme hébreu est un nom de parenté masculin pluriel qui, dans ce contexte, désigne les autres membres d’Israël. La formulation française garde cette image de fraternité, explicitée en note.
- source_word: כָּמֹנִי
  choice: comme moi
  rationale: La comparaison directe avec Moïse est rendue simplement, sans interprétation supplémentaire.
- source_word: יָקִים לְךָ
  choice: fera surgir pour toi
  rationale: Le hifil de קום exprime ici le fait de susciter ou de faire apparaître quelqu’un. « Fera surgir » conserve l’image verbale et « pour toi » restitue le complément bénéficiaire.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Le SEIGNEUR ton Dieu
  rationale: « Le SEIGNEUR » est la convention française courante pour représenter le nom divin יהוה, tandis que « ton Dieu » conserve la deuxième personne du singulier.
- source_word: אֵלָיו תִּשְׁמָעוּן
  choice: vous devrez l’écouter
  rationale: שׁמע peut signifier écouter ou obéir. « Devrez l’écouter » exprime ici l’obligation de prêter attention au prophète sans imposer dans le texte principal le sens plus fort d’« obéir ».
theological_decisions:
- issue: Identification possible du « prophète comme moi » au Messie
  choice: Maintenir dans le texte principal la formulation indéfinie « un prophète comme moi »
  alternative: Employer une désignation explicitement messianique telle que « le Prophète »
  rationale: L’hébreu ne comporte pas d’article défini devant « prophète » et n’explicite pas ici l’identification messianique. La traduction préserve donc la formulation immédiate tout en signalant en note son application ultérieure dans le Nouveau Testament.
- issue: Portée de « tes frères »
  choice: Conserver l’expression masculine « tes frères » et en expliquer la portée collective
  alternative: Traduire directement par « les autres Israélites » ou « les membres de ton peuple »
  rationale: Le choix retenu garde l’image de parenté et la forme du texte hébreu, tandis que la note empêche de comprendre l’expression comme limitée aux frères biologiques ou aux seuls hommes.
- issue: Passage du singulier au pluriel dans l’adresse
  choice: Conserver « ton/toi/tes », puis « vous devrez »
  alternative: Uniformiser toute la phrase au singulier ou au pluriel
  rationale: Le texte hébreu passe réellement de la deuxième personne masculine singulière à la deuxième personne masculine plurielle. La traduction préserve ce changement plutôt que de l’aplanir.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conserve volontairement la répétition « du milieu de toi, d’entre tes frères » ainsi que le passage du singulier au pluriel. « Fera surgir » est naturel tout en restant proche de l’image hébraïque.
