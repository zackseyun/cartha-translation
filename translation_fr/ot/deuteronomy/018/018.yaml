revisions:
- from: Je ferai surgir pour eux, du milieu de leurs frères[a], un prophète comme toi. Je mettrai mes paroles dans sa bouche, et il leur dira tout ce que je lui ordonnerai.
  to: Je ferai surgir pour eux un prophète comme toi, d’entre leurs frères[a]. Je mettrai mes paroles dans sa bouche, et il leur dira tout ce que je lui ordonnerai.
  rationale: La révision améliore l’idiomaticité française de la locution d’origine sans modifier la portée du texte. La note conserve la traduction littérale et présente des équivalents français plausibles pour le sens collectif contextuel, sans trancher l’identification du prophète ni introduire une lecture confessionnelle.
