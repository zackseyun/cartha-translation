  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: fr
  text: Je ferai surgir pour eux un prophète comme toi, d’entre leurs frères[a]. Je mettrai mes paroles dans sa bouche, et il leur dira tout ce que je lui ordonnerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’entre leurs proches » ou « d’entre leurs compatriotes » ; littéralement, « d’entre leurs frères ».
    reason: 'Alternative lexicale : « frères » traduit le terme hébreu littéral ; dans ce contexte, il peut désigner les membres apparentés du peuple, c’est-à-dire les compatriotes.'
lexical_decisions:
- source_word: נָבִיא
  choice: un prophète
  rationale: Rend directement le terme hébreu courant désignant celui qui parle de la part de Dieu; l’article indéfini convient à cette annonce.
- source_word: אָקִים
  choice: Je ferai surgir
  rationale: Le hiphil de קום exprime ici l’action de faire se lever ou surgir. Cette formulation française conserve l’image tout en indiquant l’initiative divine.
- source_word: לָהֶם
  choice: pour eux
  rationale: La préposition ל exprime ici que Dieu pourvoit à leurs besoins en leur donnant ce prophète.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: du milieu de leurs frères
  rationale: Traduction proche de la formulation hébraïque, qui conserve à la fois l’idée d’origine interne au groupe et le terme de parenté masculin.
- source_word: כָּמוֹךָ
  choice: comme toi
  rationale: Préserve sans développement la comparaison explicite avec Moïse.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: Je mettrai mes paroles dans sa bouche
  rationale: Conserve la métaphore concrète de l’investiture prophétique et reste idiomatique en français.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: il leur dira
  rationale: Le verbe « dire » s’accorde naturellement en français avec le contenu exprimé ensuite et rend l’acte de transmettre les paroles divines.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: tout ce que je lui ordonnerai
  rationale: Rend l’étendue totale de la mission et situe naturellement en français l’ordre divin dans le cadre futur de la promesse.
theological_decisions:
- issue: Identification du prophète promis
  choice: Le texte parle simplement d’« un prophète comme toi », sans en préciser davantage l’identité.
  alternative: Une succession collective de prophètes, ou un prophète eschatologique singulier accompli dans le Messie.
  rationale: Le verset lui-même ne tranche pas explicitement entre ces lectures. La traduction conserve donc la formulation et la tension du texte hébreu.
- issue: Portée de אֲחֵיהֶם
  choice: leurs frères
  alternative: leurs proches; les autres Israélites
  rationale: Le masculin pluriel concret du texte est maintenu, tandis qu’une note explique son sens collectif de parenté ou d’appartenance au peuple.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est claire pour un large public, tandis que les images hébraïques importantes (« surgir », « dans sa bouche ») sont conservées. Le futur « ordonnerai » est idiomatique dans la perspective de la promesse.
