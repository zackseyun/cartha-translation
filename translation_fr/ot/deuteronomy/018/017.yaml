  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י הֵיטִ֖יבוּ אֲשֶׁ֥ר דִּבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: fr
  text: 'Et Yahweh me dit : « Ils ont bien parlé.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils ont bien fait ce qu’ils ont dit. »'
    reason: La note conserve la construction hébraïque הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ, rendue plus naturellement dans le texte par « Ils ont bien parlé ».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et … dit
  rationale: Le wayyiqtol de אמר fait progresser le récit. « Et … dit » conserve cet enchaînement narratif dans un français naturel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: אֵלָי
  choice: me
  rationale: La préposition אֶל avec le suffixe de première personne signifie « à moi » ; avec le verbe dire, le pronom conjoint « me » est la formulation française naturelle.
- source_word: הֵיטִיבוּ
  choice: ont bien parlé
  rationale: Le hifil de יטב signifie « bien faire, agir bien ». Ici, il porte une appréciation positive sur les paroles prononcées ; le français idiomatique l’intègre à « ont bien parlé ».
- source_word: אֲשֶׁר
  choice: intégré à « ont bien parlé »
  rationale: Le relatif relie l’évaluation à ce qu’ils ont dit. En français naturel, cette relation est absorbée dans la tournure « ont bien parlé », tandis qu’une note conserve la structure littérale.
- source_word: דִּבֵּרוּ
  choice: parlé
  rationale: Le piel accompli de דבר signifie « parler ». Le passé composé « ont parlé » présente naturellement l’acte accompli dans ce discours rapporté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin sans lui substituer un titre.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation française du discours direct est employée ; la formulation idiomatique du texte principal est accompagnée d’une note littérale qui préserve la structure de l’hébreu.
