  text: תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהוָ֥ה אֱלֹהֶֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: fr
  text: Tu seras intègre envers Yahvé, ton Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout entier » ou « sans reproche ». Le mot hébreu peut désigner l’intégrité, la totalité ou l’absence de défaut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: intègre
  rationale: Le terme évoque ce qui est entier, complet ou sans défaut. Dans le contexte qui oppose la fidélité à Dieu aux pratiques divinatoires, « intègre » exprime une fidélité morale sans faire nécessairement entendre une perfection absolue.
- source_word: תִּהְיֶה
  choice: tu seras
  rationale: L’imparfait qal à la deuxième personne du masculin singulier a ici une valeur injonctive. « Tu seras » en conserve la forme et la solennité tout en restant naturel en français.
- source_word: עִם
  choice: avec
  rationale: La préposition signifie normalement « avec » et présente ici l’intégrité dans la relation avec Dieu. Cette traduction directe évite de transformer implicitement la relation en simple comparution « devant » Dieu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Dans cette référence d’alliance à Yahvé, le nom accompagné du suffixe de deuxième personne du masculin singulier désigne clairement le Dieu d’Israël au singulier.
theological_decisions:
- issue: Portée de תָּמִים dans l’exhortation d’alliance
  choice: « intègre », au sens d’une fidélité entière envers Dieu
  alternative: « tout entier », « sans reproche » ou « irréprochable »
  rationale: Le contexte de Deutéronome 18.9-14 appelle Israël à une fidélité sans partage, en contraste avec les pratiques occultes des peuples voisins. « Intègre » maintient ensemble les dimensions morale et relationnelle du terme sans imposer l’idée d’une perfection exempte de tout péché.
translation_notes:
  register: Français moderne, sobre et solennel. Le singulier « tu » respecte l’adresse hébraïque individuelle à Israël. La tournure inhabituelle « intègre avec » conserve délibérément la préposition relationnelle du texte source; la note signale les principales nuances lexicales.
