base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: fr
  text: Il n’aura pas d’héritage parmi ses frères[a]. Yahweh est son héritage, comme il le lui a dit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les siens ». L’hébreu dit littéralement « ses frères »; dans ce contexte, il s’agit des autres Israélites, en particulier des autres tribus.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme il lui a parlé ». Le verbe hébreu est le verbe courant signifiant « parler »; traduire « comme il le lui a promis » est possible d’après le contexte, mais serait plus interprétatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: héritage
  rationale: Dans ce contexte de répartition du pays, נַחֲלָה désigne une part reçue en héritage. Répéter « héritage » dans les deux propositions reproduit le lien lexical hébreu et conserve la force métaphorique de l’affirmation selon laquelle Yahweh est lui-même son héritage.
- source_word: בְּקֶרֶב
  choice: parmi
  rationale: Dans בְּקֶרֶב אֶחָיו, « parmi » rend naturellement en français moderne l’idée de présence au sein d’un groupe.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le nom hébreu est au masculin pluriel et signifie littéralement « ses frères ». Dans le contexte, il désigne les autres Israélites, en particulier les autres tribus; une note explicite cette portée sans l’inscrire dans le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: הוּא
  choice: est
  rationale: Le pronom indépendant donne une certaine insistance à l’hébreu. La construction française concise « Yahweh est son héritage » la communique sans lourdeur artificielle.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: comme il le lui a déclaré
  rationale: דִּבֶּר est le verbe courant « parler ». Ici, « déclarer » convient à une parole divine adressée au bénéficiaire sans introduire explicitement la notion plus interprétative de promesse. Le pronom « le » reprend le contenu de la déclaration, tandis que « lui » correspond au destinataire.
theological_decisions:
- issue: Référent des pronoms singuliers (« il », « son », « lui »)
  choice: Conserver le singulier représentatif du texte hébreu, qui renvoie au Lévite ou au prêtre lévitique comme représentant de la tribu.
  alternative: Comprendre les pronoms comme désignant Lévi, l’ancêtre tribal, ou chaque prêtre individuellement.
  rationale: Le contexte immédiat porte sur les prêtres lévitiques et la tribu de Lévi. Le singulier hébreu peut être collectif, représentatif ou distributif; le conserver évite de trancher plus précisément que le texte.
- issue: Sens de « Yahweh est son héritage »
  choice: Maintenir telle quelle l’affirmation métaphorique et relationnelle.
  alternative: Développer en « Yahweh est la part qui lui revient à la place d’un territoire ».
  rationale: L’hébreu affirme directement que Yahweh lui-même est l’héritage. Une explication intégrée au verset réduirait la richesse et la tension théologiques de cette formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste concise et proche de la structure hébraïque. « Héritage » est répété intentionnellement, et « frères » est conservé avec une note contextuelle.
