  terminology: « Médium » pour אוֹב conserve de façon recevable l’analyse métonymique présente dans l’audit anglais, avec note sur le sens d’esprit. « Spirite » pour יִדְּעֹנִי maintient la distinction avec « médium » sans recourir au « sorcier » folklorique. Les notes sont ajustées afin de ne pas présenter comme littérale une paraphrase de חֹבֵר חָבֶר.
