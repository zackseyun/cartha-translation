  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: fr
  text: ou quelqu’un qui pratique des incantations[a], qui consulte un médium[b] ou un spirite[c], ou qui interroge les morts[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « qui lie un lien » ; l’expression hébraïque désigne la pratique d’incantations magiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui interroge l’esprit d’un mort » ; le mot hébreu peut désigner cet esprit ou le médium qui le consulte.
    reason: lexical_alternative
  - marker: c
    text: Ou « un praticien des esprits » ; le terme hébreu désigne une personne associée à un savoir occulte.
    reason: lexical_alternative
  - marker: d
    text: Ou « qui recherche les morts », c’est-à-dire qui cherche à obtenir d’eux une réponse.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: quelqu’un qui prononce des incantations
  rationale: L’expression hébraïque, littéralement « lier un lien/charme », désigne la pratique d’incantations magiques. Cette formulation française est claire et actuelle sans reproduire un idiome hébreu obscur.
- source_word: שֹׁאֵל אוֹב
  choice: qui consulte un médium
  rationale: אוֹב peut désigner l’esprit d’un mort ou le médium associé à sa consultation. Dans cette liste de pratiques interdites, « consulter un médium » exprime naturellement l’acte visé tout en signalant l’autre possibilité en note.
- source_word: יִדְּעֹנִי
  choice: un devin
  rationale: Le terme désigne un praticien détenteur d’un savoir occulte, souvent associé à אוֹב. « Devin » est compréhensible en français moderne et évite les connotations fantastiques de « sorcier ».
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: qui interroge les morts
  rationale: Le verbe דָּרַשׁ exprime ici le fait de rechercher une réponse auprès des morts. « Interroger les morts » rend explicitement et naturellement la consultation nécromantique.
- source_word: וְ
  choice: ou
  rationale: Dans la continuité de la liste légale du verset précédent, la conjonction relie en français les différentes pratiques interdites comme des possibilités distinctes.
theological_decisions:
- issue: Rendre les pratiques occultes sans importer le folklore tardif
  choice: Employer des termes français actuels — « incantations », « médium », « devin » — qui décrivent les pratiques visées.
  alternative: Conserver des termes traditionnels comme « enchanteur », « évocateur d’esprits » ou « sorcier ».
  rationale: Le texte énumère des pratiques divinatoires et nécromantiques interdites. Les choix retenus restent accessibles et sobres, sans assimiler les termes hébreux à des catégories fantastiques ou à un système occulte postérieur.
- issue: Objet ou praticien dans שֹׁאֵל אוֹב
  choice: Traduire selon le sens métonymique de אוֹב comme médium, tout en conservant l’autre analyse en note.
  alternative: Traduire directement « qui interroge un esprit » ou « l’esprit d’un mort ».
  rationale: Le lexème peut renvoyer soit à l’esprit consulté, soit au praticien qui lui sert de médium. Le contexte ne justifie pas d’effacer cette ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et direct. La structure en « ou » poursuit la liste d’interdictions commencée au verset précédent. Les termes techniques sont rendus par des expressions immédiatement intelligibles, tandis que les ambiguïtés hébraïques réelles sont conservées dans les notes.
