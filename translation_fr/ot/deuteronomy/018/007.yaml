source:
  edition: WLC
  text: וְ/שֵׁרֵ֕ת בְּ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו כְּ/כָל אֶחָי/ו֙ הַ/לְוִיִּ֔ם הָ/עֹמְדִ֥ים שָׁ֖ם לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: fr
  text: alors il pourra exercer son ministère[a] au nom de Yahweh[c], son Dieu, comme tous ses frères lévites[b] qui se tiennent là devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il exercera son ministère ». Dans ce contexte juridique, l’imparfait hébreu peut exprimer soit une permission, soit un futur plus direct.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ses frères » : il s’agit des autres Lévites.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: alors il pourra officier
  rationale: Le piel de שׁרת désigne ici le service cultuel. « Officier » exprime naturellement cette fonction en français, tandis que « alors » marque la conséquence de la disposition énoncée au verset précédent et « pourra » conserve la valeur permissive possible de l’imparfait hébreu.
- source_word: בְּשֵׁם
  choice: au nom de
  rationale: Cette tournure rend l’expression idiomatique indiquant que le Lévite agit sous l’autorité et avec l’invocation du nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Rend directement le nom avec son suffixe possessif, sans explicitation supplémentaire.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: comme tous ses frères, les Lévites
  rationale: « Comme tous » conserve la comparaison; « ses frères » traduit le terme de parenté masculin, et l’apposition « les Lévites » en précise immédiatement le référent.
- source_word: הָעֹמְדִים שָׁם
  choice: qui se tiennent là
  rationale: Conserve le sens concret de עמד, « se tenir debout/se tenir », ainsi que l’adverbe locatif renvoyant au sanctuaire central.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend littéralement et naturellement l’expression hébraïque de présence devant Dieu dans un contexte cultuel.
theological_decisions:
- issue: Valeur de l’imparfait וְשֵׁרֵת dans la disposition légale
  choice: il pourra officier
  alternative: il officiera
  rationale: Le contexte accorde au Lévite la possibilité de participer au service; la formulation permissive s’accorde avec cette portée sans exclure que la forme hébraïque puisse être comprise comme un futur plus direct.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; la translittération le préserve au lieu de le remplacer par un titre traditionnel.
- issue: Portée du terme אֶחָיו
  choice: ses frères, les Lévites
  alternative: les autres Lévites
  rationale: Le terme de parenté masculin est maintenu, tandis que l’apposition hébraïque précise qu’il s’agit de ses confrères lévites.
translation_notes:
  register: Français international actuel, sobre et digne. « Officier » garde la nuance de service cultuel sans développer le rôle précis du Lévite. La syntaxe suit étroitement l’hébreu tout en restant naturelle; les ambiguïtés juridique et lexicale sont signalées en notes.
