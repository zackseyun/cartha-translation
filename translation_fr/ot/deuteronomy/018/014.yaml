  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: fr
  text: Car ces nations que tu dépossèdes[a] écoutent les interprètes de présages[b] et les devins. Mais toi, Yahweh, ton Dieu, ne t’a pas donné cela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont tu prends possession ». Le verbe hébreu peut désigner la prise de possession d’un territoire et, dans ce contexte, la dépossession de ses habitants.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne des personnes qui recherchent ou interprètent des présages; la méthode précise évoquée est incertaine.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « mais toi, non ainsi Yahweh, ton Dieu, t’a donné ». L’objet de « donné » reste sous-entendu en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication des interdictions précédentes avec une valeur causale naturelle en français.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ces nations
  rationale: Désigne ici les peuples non israélites du pays; « nations » est clair et traditionnel sans ajouter de connotation étrangère au texte.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אוֹתָם
  choice: que tu dépossèdes
  rationale: Le verbe ירשׁ peut exprimer la prise de possession impliquant la dépossession des habitants; cette formulation garde cette force et la relation directe avec le pronom objet.
- source_word: אֶל מְעֹנְנִים
  choice: les interprètes de présages
  rationale: מְעֹנְנִים désigne des praticiens qui observent ou interprètent des signes; ce choix est compréhensible en français moderne et évite de préciser une technique incertaine.
- source_word: וְאֶל קֹסְמִים
  choice: et les devins
  rationale: קֹסְמִים désigne directement ceux qui pratiquent la divination.
- source_word: יִשְׁמָעוּ
  choice: écoutent
  rationale: Préserve le sens lexical de שׁמע tout en exprimant naturellement l’attention accordée à ces praticiens.
- source_word: וְאַתָּה לֹא כֵן
  choice: Mais à toi, ... pas ... cela
  rationale: La tournure hébraïque est elliptique, littéralement « mais toi, pas ainsi »; le français répartit le contraste et l’élément implicite dans la proposition suivante.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu n’a pas accordé cela
  rationale: « Accorder » conserve l’idée de נתן, « donner », tout en étant idiomatique pour une pratique ou un moyen de guidance; « cela » explicite minimalement l’objet sous-entendu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Objet implicite après נָתַן לְךָ
  choice: n’a pas accordé cela
  alternative: ne t’a pas permis d’agir ainsi
  rationale: L’hébreu ne nomme pas l’objet. « Cela » rend la phrase intelligible sans transformer explicitement « donner » en une formule d’autorisation ni décider si le don refusé désigne les pratiques, les praticiens ou ce moyen de guidance.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse collective à Israël sous la forme grammaticale du singulier. La ponctuation en deux phrases allège la longue coordination hébraïque sans modifier son rapport logique.
