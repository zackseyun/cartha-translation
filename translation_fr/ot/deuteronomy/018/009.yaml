base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: fr
  text: Quand tu entreras dans le pays que Yahweh, ton Dieu, te donne, tu n’apprendras pas à imiter les pratiques abominables de ces nations-là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu n’apprendras pas à pratiquer selon les abominations de ces nations-là ». La préposition hébraïque peut exprimer la comparaison (« comme ») ou la conformité (« selon »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַתָּה בָּא
  choice: Quand tu entreras
  rationale: Dans ce contexte, כִּי introduit la circonstance temporelle de l’interdiction. Le participe בָּא, associé au pronom, a une valeur imminente ou future; le futur français exprime naturellement l’entrée prochaine dans le pays.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: « Le pays » est idiomatique en français pour le territoire promis à Israël et conserve ici la portée géographique et covenantale du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier est rendu directement par le possessif « ton ».
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le présent français convient à l’action envisagée comme en cours et certaine du point de vue du discours, tout en restant naturel après « quand tu entreras ».
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: tu n’apprendras pas à pratiquer
  rationale: L’imparfait hébreu négatif exprime une interdiction. « Pratiquer » rend naturellement l’idée d’apprendre à accomplir de manière suivie les rites ou usages visés, sans réduire leur portée aux seuls actes explicités ensuite.
- source_word: כְּתוֹעֲבֹת
  choice: les abominations
  rationale: « Abominations » conserve la forte réprobation religieuse et morale de תּוֹעֵבָה. La préposition כְּ peut indiquer comparaison ou conformité; en français, cette nuance est portée par la construction « pratiquer les abominations de » et signalée en note.
- source_word: הַגּוֹיִם הָהֵם
  choice: ces nations-là
  rationale: גּוֹיִם désigne ici les nations établies dans le pays; « ces nations-là » restitue la valeur distale et emphatique de הָהֵם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve explicitement au lieu de le remplacer par un titre.
- issue: Force morale et cultuelle de תּוֹעֵבָה
  choice: abominations
  alternative: pratiques abominables
  rationale: Le substantif fort et global est conservé, sans anticiper ni restreindre l’énumération des pratiques dans les versets suivants.
- issue: Valeur de la préposition כְּ devant תוֹעֲבֹת
  choice: conformité aux pratiques des nations, exprimée dans le corps du texte
  alternative: comme les abominations de ces nations-là
  rationale: La préposition autorise une nuance de comparaison ou de conformité. La formulation principale vise un français naturel sans trancher au-delà du contexte; la variante plus formelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme unité collective. Le futur à valeur injonctive maintient le ton juridique sans archaïsme.
