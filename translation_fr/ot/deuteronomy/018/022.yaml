  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: fr
  text: 'Lorsqu’un prophète parle au nom de Yahweh[a], et que ce qu’il annonce ne se produit pas et ne se réalise pas[b], c’est là une parole que Yahweh n’a pas prononcée. Le prophète l’a prononcée avec présomption[c] : tu n’auras pas peur de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yahweh » transcrit le nom divin יהוה (YHWH).
    reason: divine_name
  - marker: b
    text: 'Littéralement, l’hébreu emploie deux verbes : « n’a pas lieu et n’arrive pas ». Le mot traduit ici par « ce qu’il annonce », דָּבָר, peut désigner aussi bien la parole prononcée que la réalité annoncée.'
    reason: lexical_alternative
  - marker: c
    text: « Avec présomption » décrit l’audace arrogante et volontaire de celui qui parle sans autorisation de Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: הַנָּבִיא
  choice: un prophète
  rationale: Dans cette formulation juridique générale, l’article hébreu présente un cas représentatif. En français moderne, « un prophète » exprime naturellement cette portée générique.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: Cette formule indique que le prophète prétend parler sous l’autorité divine. Le nom propre יהוה est rendu par « Yahweh ».
- source_word: הַדָּבָר
  choice: ce qu’il a annoncé / une parole
  rationale: דָּבָר peut désigner à la fois le message prononcé et la réalité annoncée. La formulation française conserve ces deux dimensions sans employer l’expression peu naturelle « la parole ne se produit pas ».
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: ne se produit pas et ne se réalise pas
  rationale: Les deux verbes de non-accomplissement sont conservés dans une expression française actuelle qui souligne l’échec de l’annonce.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: que Yahweh n’a pas prononcée
  rationale: « Prononcer une parole » rend naturellement en français l’acte de parler attribué à Yahweh, sans transformer la proposition en simple interprétation telle que « ne vient pas de Yahweh ».
- source_word: בְּזָדוֹן
  choice: avec présomption
  rationale: 'Le terme exprime une audace volontaire et arrogante : le prophète parle sans y avoir été autorisé.'
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: tu ne dois pas avoir peur de lui
  rationale: Cette formulation claire conserve la force de l’interdiction et le sens de ne pas se laisser intimider par le faux prophète.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie le nom divin personnel; sa translittération le distingue d’un titre.
- issue: Portée du critère prophétique
  choice: Présenter l’absence de réalisation comme preuve que cette parole précise n’a pas été prononcée par Yahweh
  alternative: Élargir le verset en doctrine générale sur toute forme de prophétie
  rationale: Le français reste centré sur le test objectif formulé dans ce cas juridique, sans ajouter de conclusions doctrinales étrangères au verset.
- issue: Ambiguïté de דָּבָר
  choice: Conserver les dimensions de message et d’événement annoncé
  alternative: Réduire le terme soit à la seule parole, soit au seul événement
  rationale: Dans ce contexte, le même mot relie l’annonce à son éventuelle réalisation; la traduction et la note préservent cette tension sémantique.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle est rendue par « Quand… mais que… ». Le tutoiement singulier conserve l’adresse juridique hébraïque à Israël représenté comme un seul interlocuteur.
