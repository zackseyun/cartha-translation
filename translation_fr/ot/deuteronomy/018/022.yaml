revisions:
- from: 'Quand un prophète parle au nom de Yahweh[a], mais que ce qu’il a annoncé ne se produit pas et ne se réalise pas[b], c’est une parole que Yahweh n’a pas prononcée. Le prophète l’a dite avec présomption[c] : tu ne dois pas avoir peur de lui.'
  to: 'Lorsqu’un prophète parle au nom de Yahweh[a], et que ce qu’il annonce ne se produit pas et ne se réalise pas[b], c’est là une parole que Yahweh n’a pas prononcée. Le prophète l’a prononcée avec présomption[c] : tu n’auras pas peur de lui.'
  rationale: La révision élimine l’adversatif non marqué dans l’hébreu, renforce l’identification de la parole en question et harmonise le verbe final avec « parole ». Elle ne modifie ni le critère prophétique du verset ni l’ambiguïté lexicale de דָּבָר, explicitée par la note.
