    issue: « mais que » ajoute une opposition explicite
    rationale: Le texte hébreu coordonne les propositions par waw (« et ») et ne marque pas de contraste adversatif. En français, « et que » suffit et suit plus étroitement la structure conditionnelle.
  - severity: low
