  text: רֵאשִׁ֨ית דְּגָֽנְ/ךָ֜ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ וְ/רֵאשִׁ֛ית גֵּ֥ז צֹאנְ/ךָ֖ תִּתֶּן לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: fr
  text: Tu lui donneras les prémices de tes céréales[a], de ton vin nouveau[b] et de ton huile, ainsi que les prémices de la tonte de ton petit bétail[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ton grain »; le terme hébreu désigne les céréales ou le grain en général.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « vin nouveau » désigne souvent du vin récemment produit.
    reason: cultural_note
  - marker: c
    text: Ou « la première part de la laine tondue de ton petit bétail »; le terme hébreu peut désigner la tonte ou la laine qui en provient.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: les prémices / les premiers produits
  rationale: Le terme désigne la première part ou le commencement. « Prémices » convient naturellement aux produits agricoles, tandis que « premiers produits » évite une expression artificielle pour la laine issue de la tonte.
- source_word: דָּגָן
  choice: blé
  rationale: Le terme hébreu couvre les céréales ou le grain. Dans ce contexte agricole, « blé » est une formulation française courante, bien que « céréales » reste possible et plus générique.
- source_word: תִּירוֹשׁ
  choice: vin nouveau
  rationale: Le terme désigne souvent le vin récemment produit; « vin nouveau » conserve cette nuance sans imposer l'idée précise de jus non fermenté.
- source_word: יִצְהָר
  choice: huile
  rationale: Il s'agit normalement d'huile d'olive dans le contexte israélite, mais le texte dit simplement « huile »; cette traduction évite une précision ajoutée.
- source_word: גֵּז
  choice: produits de la tonte
  rationale: Le mot peut désigner la laine tondue, la toison ou le produit de la tonte. Cette formulation garde ouverte la nuance entre l'acte de tondre et ce qui en résulte.
- source_word: צֹאן
  choice: petit bétail
  rationale: Le terme collectif peut comprendre les moutons et les chèvres. « Petit bétail » est plus précis que « troupeau » et n'en réduit pas le sens aux seuls moutons.
- source_word: תִּתֶּן לוֹ
  choice: Tu lui donneras
  rationale: L'imparfait hébreu exprime ici une prescription légale. Le futur français a une force normative naturelle dans le registre législatif biblique.
theological_decisions:
- issue: Référent du pronom לוֹ (« lui »)
  choice: Conserver le singulier « lui »
  alternative: Expliciter « au prêtre » ou comprendre collectivement la classe sacerdotale
  rationale: Le contexte immédiat identifie le bénéficiaire sacerdotal, mais le verset emploie un pronom masculin singulier. « Lui » préserve la forme grammaticale sans préciser davantage que le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur « tu donneras » conserve le ton prescriptif. Le parallélisme agricole est maintenu, avec une formulation naturelle pour le don provenant de la tonte.
