  variant: modern international French
source:
  edition: WLC
  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: fr
  text: Mais le prophète qui aura la présomption de prononcer en mon nom une parole que je ne lui ai pas ordonné de prononcer[a], ou qui parlera au nom d’autres dieux, ce prophète-là mourra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui agira avec présomption » ou « qui parlera avec arrogance ». Le verbe hébreu évoque une transgression volontaire et présomptueuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « devra mourir » ou « sera mis à mort ». L’hébreu énonce ici la peine de mort sous une forme juridique très concise.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: Marque nettement le contraste avec le prophète légitime évoqué auparavant.
- source_word: יָזִיד
  choice: aura la présomption de
  rationale: Le hiphil de זיד exprime une audace volontaire et coupable, un dépassement arrogant de l’autorité reçue.
- source_word: לְדַבֵּר דָּבָר
  choice: prononcer une parole
  rationale: Conserve la construction hébraïque verbe-nom tout en restant naturelle et digne en français.
- source_word: בִּשְׁמִי
  choice: en mon nom
  rationale: Rend directement l’affirmation d’une autorisation divine et maintient la première personne du discours divin.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: que je ne lui ai pas ordonné de prononcer
  rationale: Préserve explicitement l’absence de commandement divin ainsi que le complément personnel « lui ».
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: ou qui parlera
  rationale: Le contexte présente une seconde infraction possible; « ou » exprime naturellement cette valeur disjonctive.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: au nom d’autres dieux
  rationale: Traduction directe et idiomatique de l’invocation d’autres divinités comme source d’autorité.
- source_word: וּמֵת
  choice: mourra
  rationale: Conserve la formulation brève de la sanction légale sans préciser un mécanisme d’exécution que la forme hébraïque n’énonce pas explicitement.
- source_word: הַנָּבִיא הַהוּא
  choice: ce prophète-là
  rationale: Le démonstratif renforcé restitue l’identification emphatique du prophète visé.
theological_decisions:
- issue: Référence au nom divin dans le discours à la première personne
  choice: « en mon nom »
  alternative: « au nom du Seigneur »
  rationale: L’hébreu rapporte un discours divin direct. Garder la première personne évite d’ajouter un titre absent du verset.
- issue: Formule de la peine capitale
  choice: « mourra »
  alternative: « devra mourir » ou « sera mis à mort »
  rationale: La formulation choisie respecte la brièveté judiciaire de וּמֵת tout en évitant d’ajouter explicitement une tournure causative. Une note signale les autres valeurs juridiques possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le futur antérieur « aura la présomption » s’accorde avec la formulation légale et présente l’acte comme le cas entraînant la sanction; « ce prophète-là » maintient l’emphase du démonstratif hébreu.
