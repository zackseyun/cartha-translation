  text: חֵ֥לֶק כְּ/חֵ֖לֶק יֹאכֵ֑לוּ לְ/בַ֥ד מִמְכָּרָ֖י/ו עַל הָ/אָבֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: fr
  text: Ils mangeront chacun une part égale, en plus de ce qui provient de la vente de ses biens ancestraux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en plus de ce qu’il reçoit de la vente de biens familiaux ». La dernière proposition est difficile en hébreu et peut désigner, plus généralement, des revenus liés à sa maison ancestrale.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: des parts égales
  rationale: La répétition « part comme part » exprime l’égalité de répartition. « Des parts égales » rend naturellement cette valeur distributive en français.
- source_word: יֹאכֵלוּ
  choice: ils mangeront
  rationale: Le verbe signifie concrètement « manger » et évoque ici la consommation des portions attribuées aux prêtres. Le maintien de cette image évite d’abstraire le texte en « recevoir ».
- source_word: לְבַד
  choice: en plus de
  rationale: Le terme marque ce qui est distinct ou additionnel. Dans cette lecture, les ressources patrimoniales s’ajoutent à la part reçue au sanctuaire.
- source_word: מִמְכָּרָיו
  choice: du produit de la vente
  rationale: Le mot peut désigner des ventes ou ce qu’elles rapportent. « Produit de la vente » convient au contexte de ressources personnelles sans préciser indûment la nature juridique de l’opération.
- source_word: עַל הָאָבוֹת
  choice: de son patrimoine familial
  rationale: L’expression littérale, « sur les pères », est elliptique et difficile. Elle renvoie probablement aux biens, droits ou ressources rattachés à la famille ancestrale; « patrimoine familial » exprime ce lien tout en restant assez général.
theological_decisions:
- issue: Interprétation de מִמְכָּרָיו עַל הָאָבוֹת
  choice: Des revenus provenant de la vente d’un patrimoine familial s’ajoutent à la part sacerdotale égale.
  alternative: Ce qu’il reçoit de la vente de biens familiaux; ou, plus généralement, des revenus liés à sa maison ancestrale.
  rationale: La syntaxe hébraïque est fortement elliptique et admet plusieurs analyses. Le texte principal présente la lecture patrimoniale la plus cohérente avec le contexte, tandis que la note conserve explicitement l’incertitude et une compréhension plus générale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le verbe concret « mangeront » et la transition du pluriel au possessif singulier présente dans l’hébreu. La note signale l’incertitude réelle de la dernière proposition sans imposer une interprétation juridique précise.
