review_pass:
  verdict: revise
  source_fidelity: La construction חֵלֶק כְּחֵלֶק exprime que chaque Lévite mange une part équivalente. La proposition finale, לְבַד מִמְכָּרָיו עַל־הָאָבוֹת, est elliptique et incertaine; la lecture patrimoniale est possible, mais doit rester signalée comme telle. La révision conserve cette lecture sans présenter le « produit » comme une précision explicitement formulée par l’hébreu.
  naturalness: « Ils mangeront chacun une part égale » est plus idiomatique et plus nettement distributif que « Ils mangeront des parts égales ». « Ce qui provient de la vente » rend naturellement la relation de provenance sans imposer le terme économique plus spécifique « produit ».
  terminology: « Part » et « mangeront » conservent l’image concrète du partage des portions. « Biens ancestraux » est plus direct et moins juridiquement chargé que « patrimoine familial », tout en gardant la lecture retenue et l’ambiguïté documentée en note.
