    issue: Portée distributive de « des parts égales »
    rationale: La formule française peut se comprendre comme plusieurs portions égales, plutôt que comme la part égale attribuée à chacun. « Chacun une part égale » explicite sobrement la valeur de חֵלֶק כְּחֵלֶק.
  - severity: low
    issue: « Produit de la vente » ajoute une précision économique
    rationale: Le terme hébreu peut renvoyer aux ventes ou à ce qui en provient, mais « produit » est plus étroit. « Ce qui provient de la vente » reste plus près de l’ellipse et de la note d’incertitude.
