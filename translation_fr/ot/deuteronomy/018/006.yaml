source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: fr
  text: Et si le Lévite vient de l’une de tes villes, de partout en Israël[a], où il réside, et se rend, avec tout le désir de son âme[b], au lieu que Yahweh choisira,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’une de tes portes, de tout Israël ». Ici, les « portes » désignent par métonymie les villes ou les localités.'
    reason: cultural_note
  - marker: b
    text: 'Ou, plus idiomatiquement : « avec tout l’élan de son âme » ou « de tout son désir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Introduit un cas conditionnel lié aux prescriptions précédentes, tout en conservant la conjonction hébraïque.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: L’article hébreu est conservé; dans ce cadre juridique, le singulier désigne un cas représentatif.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: de l’une de tes villes
  rationale: Littéralement « de l’une de tes portes »; ici, « portes » désigne par métonymie les villes ou localités. Traduire le sens évite en français l’image trompeuse d’une porte physique.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: de n’importe où en Israël
  rationale: 'Rend naturellement la portée distributive: le Lévite peut venir d’une localité quelconque du territoire d’Israël.'
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: où il réside
  rationale: גור évoque le séjour ou la résidence sans nécessairement faire ici du Lévite un étranger à Israël; « réside » garde cette nuance sans surtraduire.
- source_word: וּבָא
  choice: et qu’il se rende
  rationale: Conserve le second verbe de mouvement tout en évitant en français la répétition peu naturelle de « vient… vient » et en indiquant le déplacement vers le lieu choisi.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: de tout le désir de son âme
  rationale: Reste proche de la formulation hébraïque, qui exprime un désir personnel entier et intense, sans remplacer נפש par « cœur » dans le texte principal.
- source_word: אֶל הַמָּקוֹם
  choice: au lieu
  rationale: Le texte dit simplement « le lieu »; il ne convient pas d’ajouter « sanctuaire » ou « lieu de culte » dans le corps du verset.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh choisira
  rationale: Le futur français convient à l’imparfait hébreu dans la formule deutéronomique; le nom divin est rendu explicitement par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de lui substituer un titre.
- issue: Identification du « lieu »
  choice: au lieu
  alternative: au sanctuaire / au lieu de culte
  rationale: Même si le contexte vise le lieu central choisi par Dieu, le texte hébreu garde le référent implicite; la traduction conserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique conditionnelle est conservée. « Tes villes » exprime la métonymie hébraïque sans produire une image littérale trompeuse; la tournure volontairement soutenue « le désir de son âme » maintient la couleur et l’ambiguïté du texte source.
