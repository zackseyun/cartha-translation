  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: fr
  text: 'Et si tu dis dans ton cœur : « Comment saurons-nous quelle parole Yahweh n’a pas prononcée[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quel message » ou « quelle chose ». Le mot hébreu davar peut désigner une parole, un message ou une chose; dans ce contexte prophétique, « parole » convient le mieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Cette tournure conserve à la fois le lien avec le contexte précédent et la valeur conditionnelle de la proposition.
- source_word: תֹאמַר בִּלְבָבֶךָ
  choice: tu dis dans ton cœur
  rationale: La formulation garde l’image hébraïque du cœur comme siège de la réflexion intérieure, tout en restant compréhensible en français.
- source_word: אֵיכָה נֵדַע
  choice: Comment saurons-nous
  rationale: Le verbe ידע a ici son sens courant de « savoir »; le futur français convient à la question portant sur le moyen d’identifier une parole qui ne vient pas de Dieu.
- source_word: הַדָּבָר
  choice: cette parole
  rationale: Dans ce contexte prophétique, דָּבָר désigne une parole ou un message prétendument divin. Le démonstratif rend la phrase interrogative naturelle en français sans supprimer la portée du terme.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: que Yahweh n’a pas prononcé cette parole
  rationale: La proposition relative hébraïque est restructurée en français sous la forme « savoir que », plus naturelle, tout en conservant exactement la question de l’origine divine de la parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel du Dieu d’Israël et ne remplace pas celui-ci par un titre.
- issue: Nature de הַדָּבָר dans le contexte prophétique
  choice: parole
  alternative: message
  rationale: « Parole » garde la formulation large du texte et son lien direct avec l’acte de parler, sans préciser davantage la forme de la révélation.
translation_notes:
  register: Français international moderne, sobre et digne. L’image sémitique « dans ton cœur » est conservée; la question est légèrement restructurée pour être idiomatique en français sans résoudre la tension du texte.
