source:
  edition: WLC
  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: fr
  text: 'Voici la part due aux prêtres par le peuple, c’est-à-dire par ceux qui offrent un sacrifice[a], qu’il s’agisse d’un bovin ou d’un animal du petit bétail : celui qui l’offre donnera au prêtre l’épaule[b], les deux joues[c] et l’estomac[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ceux qui sacrifient le sacrifice ». L’hébreu répète la même racine pour le verbe et le nom.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le bras »; dans ce contexte, il s’agit de la patte avant ou de la portion de l’épaule.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les mâchoires ». La forme hébraïque est duelle.'
    reason: lexical_alternative
  - marker: d
    text: 'Traditionnellement : « la panse ». Le mot hébreu désigne l’estomac de l’animal sans imposer ici une précision anatomique technique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: la part qui reviendra de droit
  rationale: Dans ce contexte juridique et cultuel, le terme désigne ce qui est prescrit et dû aux prêtres, plutôt qu’un « jugement » abstrait. Cette formulation exprime à la fois la part attribuée et le droit de la recevoir.
- source_word: הַכֹּהֲנִים
  choice: aux prêtres
  rationale: Le pluriel est conservé, et la construction française avec « revenir de droit à » rend naturellement le rapport exprimé par l’hébreu.
- source_word: מֵאֵת הָעָם
  choice: de la part du peuple
  rationale: Cette traduction suit le sens direct du texte sans préciser « les Israélites », désignation absente de l’hébreu.
- source_word: מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: c’est-à-dire de ceux qui offrent un sacrifice
  rationale: La seconde expression précise de quels membres du peuple provient cette part. Une note signale la répétition étymologique de זבח, difficile à reproduire naturellement en français.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: que ce soit un bovin ou une bête du petit bétail
  rationale: « Bovin » convient au terme singulier שׁוֹר dans ce contexte, tandis que שֶׂה peut désigner une bête ovine ou caprine; « bête du petit bétail » préserve cette étendue sémantique.
- source_word: וְנָתַן
  choice: celui qui l’offre donnera
  rationale: Le verbe hébreu est au singulier et renvoie distributivement à chaque personne qui offre un sacrifice. L’explicitation du sujet évite en français un masculin générique ambigu.
- source_word: לַכֹּהֵן
  choice: au prêtre
  rationale: L’article défini de l’hébreu est conservé; il s’agit du prêtre qui reçoit la part prescrite.
- source_word: הַזְּרֹעַ
  choice: la patte avant
  rationale: Le mot signifie littéralement « bras », mais appliqué à un animal il désigne la patte antérieure ou la portion correspondante. « Patte avant » est précis et immédiatement compréhensible.
- source_word: הַלְּחָיַיִם
  choice: les deux mâchoires
  rationale: La forme hébraïque est duelle. « Les deux mâchoires » rend explicitement ce nombre et convient mieux à l’anatomie de l’animal que « joues » dans ce contexte.
- source_word: הַקֵּבָה
  choice: l’estomac
  rationale: Le terme désigne une partie de l’estomac de l’animal. « Estomac » est moderne et clair, contrairement à des équivalents français vieillis ou excessivement techniques.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le style juridique de la prescription est maintenu sans archaïsmes. La formulation conserve la relation entre le peuple, ceux qui offrent le sacrifice et la part due aux prêtres, tout en explicitant sobrement le sujet singulier du verbe final.
