  terminology: « Part due » rend naturellement מִשְׁפָּט dans ce contexte. « Animal du petit bétail » préserve à juste titre l’extension possible aux ovins et aux caprins. « Estomac » est moderne et n’impose pas une identification anatomique discutée.
