  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : il s’agit de la part légalement due aux prêtres, fournie par les personnes qui offrent un sacrifice de gros ou de petit bétail. Toutefois, « les deux mâchoires » est plus étroit et moins directement lexical que לְחָיַיִם, qui désigne d’abord les joues; « l’épaule » rend mieux la portion animale conventionnellement visée par זְרֹעַ que « la patte avant ».'
