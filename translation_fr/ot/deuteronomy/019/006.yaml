source:
  edition: WLC
  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: fr
  text: autrement, le vengeur du sang pourrait poursuivre celui qui a tué, parce que son cœur brûle[a], le rattraper parce que le chemin est long et le frapper à mort, alors que cet homme n’est pas passible de mort, puisqu’il ne le haïssait pas auparavant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce que son cœur devient brûlant ». Cette expression hébraïque décrit une colère qui s’enflamme.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis hier ou avant-hier », expression hébraïque signifiant « auparavant » ou « précédemment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: autrement
  rationale: Introduit la conséquence que l’établissement des villes de refuge doit prévenir. « Autrement » est naturel en français moderne et conserve la force d’avertissement.
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Désigne le proche parent investi du rôle juridique de poursuivre l’auteur de l’homicide. Cette formulation conserve l’expression et sa portée institutionnelle.
- source_word: הָרֹצֵחַ
  choice: celui qui a tué
  rationale: Dans ce contexte, le terme désigne un auteur d’homicide qui n’avait pas de haine préalable et n’est pas passible de mort. « Meurtrier » suggérerait à tort un meurtre volontaire.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: parce que son cœur brûle
  rationale: Conserve l’image hébraïque du cœur qui s’échauffe tout en évoquant clairement une colère intense en français.
- source_word: וְהִשִּׂיגוֹ
  choice: le rattraper
  rationale: Rend naturellement l’idée d’atteindre quelqu’un que l’on poursuit.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: parce que le chemin est long
  rationale: Préserve l’image concrète de la longue route jusqu’à la ville de refuge.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: le frapper à mort
  rationale: Restitue l’expression concrète d’un coup mortel sans la réduire au simple verbe « tuer ».
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: alors que cet homme n’est pas passible de mort
  rationale: Exprime clairement la non-responsabilité juridique à l’égard de la peine capitale, sens de מִשְׁפַּט dans ce contexte.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: puisqu’il ne le haïssait pas
  rationale: 'Maintient le motif juridique explicite : l’absence de haine préalable, qui distingue cet homicide d’un acte prémédité.'
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: auparavant
  rationale: Rend en français courant l’idiome temporel hébreu signifiant « précédemment » ou « depuis quelque temps déjà ».
theological_decisions:
- issue: Portée juridique de וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: n’est pas passible de mort
  alternative: n’a pas mérité la peine de mort
  rationale: La formulation retenue garde l’accent sur le statut juridique de l’auteur de l’homicide plutôt que de transformer la proposition en appréciation morale générale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’enchaînement causal du texte hébreu ainsi que son vocabulaire juridique, tout en évitant « meurtrier », qui impliquerait une culpabilité intentionnelle exclue par le contexte.
