revisions:
- from: Tu ne déplaceras pas la borne qui marque la limite du terrain de ton prochain[a], celle que les générations précédentes ont posée dans l’héritage que tu recevras dans le pays que Yahweh ton Dieu te donne pour que tu en prennes possession.
  to: Tu ne déplaceras pas la borne qui délimite le terrain de ton prochain[a], établie par les générations précédentes, dans le lot que tu recevras en héritage dans le pays que Yahweh, ton Dieu, te donne pour en prendre possession.
  rationale: La révision clarifie que la borne est établie par les prédécesseurs et que l’interdiction concerne le lot foncier que le destinataire recevra. Elle maintient la portée concrète de « borne », la relation de voisinage, la notion d’héritage/allotissement et le nom divin Yahweh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:01:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens juridique est bien rendu : l’interdiction vise le déplacement d’une borne marquant une limite foncière, établie antérieurement, dans le lot attribué à l’Israélite. La révision conserve le caractère concret de גְּבוּל sans imposer l’idée d’enlèvement ou de déplacement vers l’arrière.'
  naturalness: La phrase proposée est compréhensible, mais « celle que les générations précédentes ont posée » est un peu lourd et l’enchaînement avec « dans l’héritage » peut laisser entendre que les générations ont posé la borne dans l’héritage, plutôt que de situer l’interdiction dans le lot reçu. La révision fluidifie la syntaxe tout en maintenant les répétitions conceptuelles de l’hébreu.
  terminology: « Borne » convient dans ce contexte foncier et « ton prochain » rend naturellement רֵעֲךָ. « Lot que tu recevras en héritage » préserve mieux la valeur d’allotissement de נַחֲלָה et le lien avec le verbe נחל. « Yahweh » est maintenu pour יהוה.
  issues:
  - severity: medium
    issue: Ambiguïté syntaxique autour de « celle que les générations précédentes ont posée dans l’héritage »
    rationale: Le complément « dans l’héritage » correspond au cadre du lot que le destinataire recevra (בְּנַחֲלָתְךָ אֲשֶׁר תִּנְחַל), mais sa place actuelle peut le rattacher à l’action de poser la borne. Une restructuration rend ce rapport plus clair.
  - severity: low
    issue: « Les générations précédentes ont posée » est moins idiomatique pour désigner les personnes antérieures
    rationale: רִאשֹׁנִים désigne les prédécesseurs/anciens. Employer « établie par les générations précédentes » reste fidèle tout en étant plus naturel avec une borne.
  revised_text: Tu ne déplaceras pas la borne qui délimite le terrain de ton prochain[a], établie par les générations précédentes, dans le lot que tu recevras en héritage dans le pays que Yahweh, ton Dieu, te donne pour en prendre possession.
  revised_footnotes:
