    reason: lexical_alternative
  revision_rationale: La révision clarifie que la borne est établie par les prédécesseurs et que l’interdiction concerne le lot foncier que le destinataire recevra. Elle maintient la portée concrète de « borne », la relation de voisinage, la notion d’héritage/allotissement et le nom divin Yahweh.
