source:
  edition: WLC
  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: fr
  text: Tu ne déplaceras pas la borne qui délimite le terrain de ton prochain[a], établie par les générations précédentes, dans le lot que tu recevras en héritage dans le pays que Yahweh, ton Dieu, te donne pour en prendre possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la limite du terrain de ton prochain ». L’hébreu désigne la limite de propriété, concrètement matérialisée par une borne.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: déplaceras
  rationale: Le hifil de נסג désigne ici le déplacement frauduleux d’une limite au détriment d’un voisin. « Déplacer » reste naturel et n’impose pas une direction absente de la formulation.
- source_word: גְּבוּל
  choice: la borne qui marque la limite du terrain
  rationale: Dans ce contexte juridique, גְּבוּל désigne la limite de propriété matérialisée par une borne. Cette formulation explicite à la fois l’objet déplacé et sa fonction.
- source_word: רֵעֲךָ
  choice: de ton prochain
  rationale: רֵעַ désigne ici un autre membre de la communauté, plus précisément le propriétaire voisin dans ce contexte foncier. « Prochain » conserve la portée relationnelle et juridique du terme.
- source_word: גָּבְלוּ
  choice: ont posée
  rationale: Le verbe signifie établir ou délimiter. Avec « borne », « poser » est idiomatique en français et exprime concrètement l’établissement de la limite.
- source_word: רִאשֹׁנִים
  choice: les générations précédentes
  rationale: Le pluriel renvoie aux personnes d’autrefois qui ont établi les premiers partages fonciers. « Générations précédentes » rend ce sens plus clairement que « les premiers ».
- source_word: בְּנַחֲלָתְךָ
  choice: dans l’héritage
  rationale: נַחֲלָה désigne le lot reçu en héritage dans le partage du pays. « Héritage » préserve sa dimension juridique et liée à l’allocation de la terre.
- source_word: תִּנְחַל
  choice: que tu recevras
  rationale: Le verbe נחל exprime l’entrée en possession d’un héritage. « Recevras » évite la tournure française peu naturelle « hériteras un héritage », tout en gardant l’orientation future.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: נֹתֵן לְךָ
  choice: te donne
  rationale: Le participe présente le don du pays comme l’action de Yahweh dans ce contexte. Le présent français est naturel et peut exprimer cette action en cours ou caractéristique.
- source_word: לְרִשְׁתָּהּ
  choice: pour que tu en prennes possession
  rationale: L’infinitif de ירשׁ exprime ici la prise de possession du pays. Cette formulation française rend explicitement le pronom féminin renvoyant au pays.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel et l’identité d’alliance exprimés dans l’hébreu.
- issue: Portée de נַחֲלָה dans le contexte du don du pays
  choice: héritage
  alternative: propriété
  rationale: « Héritage » maintient la tension entre le lot reçu par Israël et le fait que Yahweh est celui qui donne le pays; « propriété » réduirait le terme à sa seule dimension foncière.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse individuelle de l’hébreu dans le cadre de l’instruction donnée à Israël. La répétition hébraïque autour de l’héritage est légèrement allégée pour obtenir une phrase française naturelle sans perdre la notion de lot foncier reçu de Yahweh.
