  text: וְ/דָרְשׁ֥וּ הַ/שֹּׁפְטִ֖ים הֵיטֵ֑ב וְ/הִנֵּ֤ה עֵֽד שֶׁ֨קֶר֙ הָ/עֵ֔ד שֶׁ֖קֶר עָנָ֥ה בְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/018.yaml
  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: fr
  text: Les juges feront une enquête approfondie. S’il apparaît que le témoin est un faux témoin et qu’il a porté un faux témoignage contre son frère,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ הַשֹּׁפְטִים הֵיטֵב
  choice: Les juges feront une enquête approfondie
  rationale: Le verbe דרשׁ accompagné de l’adverbe היטב appelle ici l’idée d’un examen diligent et complet; « faire une enquête approfondie » est naturel et précis en français juridique courant.
- source_word: וְהִנֵּה
  choice: S’il apparaît que
  rationale: Dans ce contexte d’enquête, la formule présente le résultat constaté plutôt qu’une exclamation littérale; cette tournure préserve la valeur probatoire sans l’artificiel « voici ».
- source_word: עֵד שֶׁקֶר
  choice: un faux témoin
  rationale: Équivalent direct et idiomatique de l’expression hébraïque désignant un témoin mensonger.
- source_word: שֶׁקֶר עָנָה
  choice: il a porté un faux témoignage
  rationale: La formulation française rend naturellement l’acte judiciaire exprimé par ענה avec שקר, sans se limiter au sens général de « mentir ».
- source_word: בְאָחִיו
  choice: contre son frère
  rationale: « Frère » conserve le langage d’appartenance communautaire de l’hébreu, sans le réduire à la seule parenté biologique.
theological_decisions:
- issue: Valeur de וְהִנֵּה après l’enquête
  choice: S’il apparaît que
  alternative: et voici que
  rationale: Le contexte indique la découverte éventuelle issue de l’enquête. La traduction choisie garde cette condition implicite sans transformer la phrase en affirmation que tout témoin examiné est nécessairement faux.
- issue: Portée de אָחִיו
  choice: son frère
  alternative: son prochain / un autre membre de la communauté
  rationale: La traduction formelle « son frère » maintient la terminologie d’alliance et son éventuelle amplitude, au lieu d’en fixer silencieusement l’interprétation.
translation_notes:
  register: Français moderne, digne et accessible, avec une formulation adaptée au contexte judiciaire. La phrase reste ouverte par une virgule, conformément à sa continuité syntaxique avec le verset suivant.
