  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: fr
  text: Tu aménageras la route et tu partageras en trois le territoire de ton pays[a], que Yahweh, ton Dieu, te donne en héritage, afin que toute personne qui a tué quelqu’un[b] puisse s’y enfuir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu diviseras en trois le territoire de ton pays ».'
    reason: Précise la formulation géographique et évite de suggérer que le pays serait agrandi ou triplé.
  - marker: b
    text: 'Littéralement : « tout auteur d’un homicide ». Le terme hébreu ne désigne pas nécessairement ici un meurtrier coupable d’un acte prémédité.'
    reason: Précision lexicale et juridique concernant le rendu de כָּל רֹצֵחַ.
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: Tu aménageras la route
  rationale: Le hiphil de כון exprime ici la préparation concrète d’une voie d’accès. « Aménager la route » est naturel en français et conserve le singulier et l’article défini de l’hébreu; le datif לְךָ n’a pas besoin d’être rendu lourdement par « pour toi ».
- source_word: וְשִׁלַּשְׁתָּ
  choice: tu partageras en trois
  rationale: Le piel de שלש signifie ici organiser ou répartir en trois. Cette formulation française exprime clairement la division tripartite sans préciser au-delà du texte la forme exacte des trois secteurs.
- source_word: גְּבוּל אַרְצְךָ
  choice: le territoire de ton pays
  rationale: גְּבוּל peut désigner une frontière, mais aussi l’étendue territoriale délimitée. Dans ce contexte géographique, « territoire » convient mieux qu’une simple ligne frontalière.
- source_word: יַנְחִילְךָ
  choice: te donnera en héritage
  rationale: Le hiphil de נחל présente le pays comme un bien transmis en héritage. La tournure retenue conserve à la fois l’idée de don et celle d’héritage.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu
  rationale: Le nom divin יהוה est transcrit « Yahweh », ce qui préserve le nom propre présent dans le texte hébreu.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: afin que … puisse s’y enfuir
  rationale: La construction hébraïque condensée, littéralement « et ce sera pour fuir là », exprime ici le but de l’aménagement.
- source_word: כָּל רֹצֵחַ
  choice: quiconque aura tué quelqu’un
  rationale: Dans la législation sur les villes de refuge, רֹצֵחַ englobe celui qui a causé une mort sans préjuger dans ce verset de son intention ou de sa culpabilité. La périphrase est claire en français moderne et moins restrictive que « meurtrier ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme; la transcription « Yahweh » maintient le caractère de nom propre de l’alliance.
- issue: Portée morale et juridique de רֹצֵחַ
  choice: quiconque aura tué quelqu’un
  alternative: tout meurtrier
  rationale: Le contexte immédiat inclut l’homicide involontaire. « Meurtrier » pourrait attribuer prématurément une intention criminelle que ce verset ne précise pas.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète l’adresse collective à Israël sous la forme grammaticale du singulier. La syntaxe reste proche de l’hébreu tout en évitant les calques peu naturels.
