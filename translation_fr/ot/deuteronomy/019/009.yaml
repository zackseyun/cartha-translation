  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: fr
  text: Si tu veilles à mettre en pratique tout ce commandement[a] que je te prescris aujourd’hui — à aimer Yahweh, ton Dieu, et à marcher dans ses voies tous les jours —, alors tu ajouteras pour toi trois autres villes en plus de ces trois-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le singulier : « tout ce commandement ».'
    reason: Le singulier collectif peut surprendre en français; la note signale que cette formulation reflète volontairement le texte source.
lexical_decisions:
- source_word: כִּי
  choice: si
  rationale: Introduit ici la condition dont dépend l’ajout de nouvelles villes de refuge.
- source_word: תִשְׁמֹר ... לַעֲשֹׂתָהּ
  choice: tu veilles à mettre en pratique
  rationale: Rend l’idée d’observer fidèlement le commandement en l’accomplissant, sans ajouter l’adverbe absent du texte hébreu « soigneusement ».
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: tout ce commandement
  rationale: Conserve le singulier hébreu et la portée globale de כָּל dans une formulation française naturelle.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: « Donner un commandement » est idiomatique en français et exprime l’acte présent de Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: et suivre ses voies
  rationale: Préserve l’image des « voies » tout en employant le verbe français naturel « suivre ».
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Rend littéralement l’idée d’une fidélité durable, tout au long de la vie.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: alors tu ajouteras pour toi trois autres villes
  rationale: Conserve la valeur consécutive, le complément לְךָ et l’idée d’ajout.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: à ces trois-là
  rationale: Rend la valeur additive de עַל et la référence aux trois villes déjà désignées.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Relation entre le commandement, l’amour et la conduite
  choice: Conserver la construction explicative entre tirets
  alternative: Faire de « aimer » et « suivre » de simples verbes coordonnés au commandement précédent
  rationale: La syntaxe hébraïque permet de comprendre les infinitifs comme précisant le contenu ou la visée du commandement; les tirets maintiennent ce lien sans en réduire la portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse directe au peuple envisagé comme une unité. La métaphore des « voies » est maintenue; la phrase reste liée au contexte juridique des villes de refuge.
