  to: Si tu veilles à mettre en pratique tout ce commandement[a] que je te prescris aujourd’hui — à aimer Yahweh, ton Dieu, et à marcher dans ses voies tous les jours —, alors tu ajouteras pour toi trois autres villes en plus de ces trois-là.
  rationale: La révision rétablit la force prescriptive de מְצַוְּךָ et explicite le sens additif de עַל. Elle conserve le singulier de « commandement », le nom Yahweh, l’ambiguïté syntaxique prudente des infinitifs encadrés par des tirets, ainsi que la nuance du datif « pour toi ».
