  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: fr
  text: Si quelqu’un va avec son prochain dans la forêt pour couper du bois et que, au moment où il manie la hache pour abattre un arbre, la tête en fer se détache du manche[a], atteint son prochain et le tue, il pourra s’enfuir dans l’une de ces villes et rester en vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fer se détache du bois ». Ici, « le fer » désigne la tête de la hache, et « le bois », son manche.'
    reason: Précision lexicale sur les métonymies concrètes de l’hébreu.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Si quelqu’un
  rationale: La tournure introduit, dans la continuité de la loi précédente, un cas concret soumis à une condition. « Si quelqu’un » restitue naturellement cette valeur en français.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: Dans ce contexte juridique, le terme désigne un autre membre de la communauté ou un compagnon, sans supposer une amitié intime. « Son prochain » conserve cette portée relationnelle et juridique.
- source_word: בַיַּעַר
  choice: dans la forêt
  rationale: יַעַר désigne un terrain boisé ou une forêt ; cette formulation est claire et convient au registre juridique narratif.
- source_word: לַחְטֹב עֵצִים
  choice: pour couper du bois
  rationale: L’expression désigne de manière générale l’activité de bûcheronnage, sans imposer qu’il s’agisse uniquement d’abattre des arbres.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: au moment où il manie la hache
  rationale: La formulation hébraïque décrit le mouvement de la main avec la hache. Le français idiomatique exprime l’action par « manier la hache », sans modifier le caractère accidentel de la scène.
- source_word: לִכְרֹת הָעֵץ
  choice: pour abattre un arbre
  rationale: כרת désigne ici l’action de couper un arbre au point de le faire tomber. L’article hébreu peut avoir une valeur générique dans cet exemple juridique.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ
  choice: la tête en fer se détache du manche[a]
  rationale: Littéralement, « le fer se détache du bois ». Les noms de matériaux désignent ici naturellement la tête métallique et le manche en bois de la hache ; une note préserve la forme concrète de l’hébreu.
- source_word: וּמָצָא אֶת־רֵעֵהוּ
  choice: atteint son prochain
  rationale: מצא signifie littéralement « trouver » ou « atteindre » ; dans ce contexte de projectile ou d’objet détaché, « atteint » rend précisément l’impact sans ajouter l’idée d’un coup volontaire.
- source_word: וָמֵת
  choice: et le tue
  rationale: Cette formulation indique clairement que le prochain meurt à la suite de l’impact, tout en gardant la chaîne causale du texte.
- source_word: הוּא יָנוּס
  choice: il pourra s’enfuir
  rationale: Dans cette disposition protectrice, le futur exprime la possibilité reconnue au responsable involontaire de chercher refuge, plutôt qu’un ordre absolu.
- source_word: וָחָי
  choice: et rester en vie
  rationale: 'Le verbe חיה exprime ici l’issue recherchée par la fuite vers la ville de refuge : échapper à la mort et continuer à vivre.'
theological_decisions:
- issue: Portée juridique de la fuite vers une ville de refuge
  choice: « il pourra s’enfuir »
  alternative: « il s’enfuira » ou « il devra s’enfuir »
  rationale: Le contexte accorde une protection au responsable d’un homicide involontaire. La traduction évite de transformer cette possibilité juridique en commandement explicite, tout en conservant le lien avec la survie.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la forme conditionnelle du cas juridique, avec un vocabulaire accessible. « Son prochain » maintient la tonalité juridique et communautaire du passage ; la note explicite l’expression hébraïque sans alourdir le texte principal.
