  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: fr
  text: Ceux qui resteront l’apprendront et auront peur ; ils ne recommenceront plus à commettre un acte aussi mauvais au milieu de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu emploie le singulier : « au milieu de toi » ; Israël est interpellé ici comme un tout collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: ceux qui resteront
  rationale: Le participe nifal de שׁאר désigne les autres membres de la communauté qui subsistent après l’exécution du jugement. Le futur français s’accorde naturellement avec la portée prospective de la prescription.
- source_word: יִשְׁמְעוּ
  choice: l’apprendront
  rationale: שמע signifie littéralement « entendre », mais désigne ici le fait d’avoir connaissance du jugement. « L’apprendront » exprime naturellement ce sens en français sans ajouter de contenu interprétatif.
- source_word: וְיִרָאוּ
  choice: et auront peur
  rationale: ירא exprime ici la peur suscitée par la sanction et son effet dissuasif. Cette formulation est claire, actuelle et conserve la force du texte.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: ils ne recommenceront plus à commettre
  rationale: La construction יסף avec l’infinitif et עוֹד signifie ne plus refaire ou ne pas recommencer. « Ne recommenceront plus à commettre » rend explicitement cette valeur itérative en français idiomatique.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: un acte aussi mauvais
  rationale: 'דבר désigne ici l’acte ou l’affaire en question, tandis que le préfixe כ marque la comparaison : un acte de cette sorte. « Un acte aussi mauvais » conserve cette valeur sans le vague de « chose ».'
- source_word: בְּקִרְבֶּךָ
  choice: au milieu de toi
  rationale: La formulation conserve le suffixe masculin singulier par lequel Israël est interpellé collectivement, ainsi que la tonalité communautaire et juridique de l’expression.
theological_decisions:
- issue: Nombre et destinataire dans בְּקִרְבֶּךָ
  choice: conserver le singulier collectif dans « au milieu de toi »
  alternative: rendre au pluriel par « parmi vous »
  rationale: Le suffixe hébreu est à la deuxième personne du masculin singulier et s’adresse à Israël comme à un tout collectif. Le singulier français préserve ce trait sans en tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. « L’apprendront » est préféré au littéral « l’entendront » dans ce contexte judiciaire ; « acte » précise le référent de דבר. Le point-virgule rend la progression entre l’effet dissuasif et son résultat.
