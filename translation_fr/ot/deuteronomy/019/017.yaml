source:
  edition: WLC
  text: וְ/עָמְד֧וּ שְׁנֵֽי הָ/אֲנָשִׁ֛ים אֲשֶׁר לָ/הֶ֥ם הָ/רִ֖יב לִ/פְנֵ֣י יְהוָ֑ה לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ וְ/הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר יִהְי֖וּ בַּ/יָּמִ֥ים הָ/הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: fr
  text: Alors les deux hommes entre lesquels il y a litige[a] se tiendront devant Yahvé, devant les prêtres et les juges qui seront en fonction à cette époque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui ont un différend » ; l’hébreu peut aussi évoquer l’affaire judiciaire qui les oppose.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui seront en ces jours-là » ; ou : « qui exerceront alors leur charge ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: Alors ... se tiendront
  rationale: Le waw avec l’accompli poursuit la procédure juridique. « Alors » exprime naturellement cette succession, et « se tiendront » conserve le caractère formel de la comparution.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: les deux hommes
  rationale: L’hébreu emploie explicitement le masculin pluriel avec le nombre deux. Cette traduction reste formellement proche sans remplacer les personnes par le terme plus interprétatif « parties ».
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: entre lesquels il y a litige
  rationale: רִיב peut désigner un différend, un litige ou une affaire judiciaire. La formulation choisie restitue le rapport entre les deux hommes tout en restant naturelle en français.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: לִפְנֵי marque ici la comparution en présence de Dieu dans un cadre judiciaire. « Yahvé » est la forme française courante du nom divin יהוה.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: devant les prêtres et les juges
  rationale: La répétition de « devant » avant les autorités humaines reflète celle de לִפְנֵי et distingue clairement la comparution devant Yahvé de la présence des responsables sacerdotaux et judiciaires.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: qui seront en fonction à cette époque
  rationale: La proposition désigne les prêtres et juges contemporains de l’affaire. « En fonction » rend explicitement et naturellement leur rôle officiel, tandis que « à cette époque » restitue l’expression temporelle hébraïque.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. Employer « Yahvé » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Nature de la comparution « devant Yahvé »
  choice: conserver la formulation sans préciser le lieu ni le mécanisme de la présence divine
  alternative: devant le sanctuaire de Yahvé
  rationale: Le verset affirme une comparution devant Yahvé, puis devant les prêtres et les juges, mais ne nomme pas explicitement le sanctuaire. La traduction maintient cette tension sans ajouter une localisation.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique reste compréhensible sans devenir excessivement technique. Le futur et la tournure « se tiendront devant » conservent le ton procédural de la loi.
