source:
  edition: WLC
  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: fr
  text: Lorsque Yahweh, ton Dieu, aura retranché[a] les nations dont Yahweh, ton Dieu, te donne le pays, lorsque tu les auras dépossédées et que tu habiteras dans leurs villes et leurs maisons,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aura détruit » ou « aura éliminé » ; littéralement « aura retranché » ou « aura coupé ».
    reason: Signaler l’image du verbe hébreu כרת et ses principaux équivalents contextuels, sans imposer une interprétation plus explicite.
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans ce contexte juridique, la conjonction introduit une situation future tenue pour certaine et qui déclenche les prescriptions suivantes.
- source_word: יַכְרִית
  choice: aura retranché
  rationale: Le hiphil de כרת exprime ici l’action d’écarter ou d’éliminer les nations. « Retrancher » conserve l’image hébraïque et le ton solennel, tandis que la note signale des équivalents plus explicites.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier est rendu directement; le tutoiement convient à l’adresse singulière faite à Israël.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: « Nations » est l’équivalent courant de גּוֹיִם et n’importe pas les connotations plus tardives de « païens » ou « Gentils ».
- source_word: נֹתֵן לְךָ אֶת אַרְצָם
  choice: dont Yahweh ton Dieu te donne le pays
  rationale: Cette formulation française naturelle conserve le participe « donne », qui présente le don comme actuel ou assuré, ainsi que le lien entre les nations et leur pays.
- source_word: וִירִשְׁתָּם
  choice: que tu les auras dépossédées
  rationale: Avec les nations comme objet personnel, ירש signifie ici les priver de leur possession plutôt que les « hériter ». Le futur antérieur s’accorde avec la séquence temporelle française.
- source_word: וְיָשַׁבְתָּ
  choice: et que tu habiteras
  rationale: « Habiter » rend naturellement l’établissement durable dans un lieu sans ajouter une nuance absente du texte.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: dans leurs villes et leurs maisons
  rationale: La préposition et le possessif sont explicités de manière fluide en français, tout en conservant les deux lieux mentionnés.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » préserve ce nom dans le corps du texte sans le remplacer par un titre.
- issue: Portée de ירש avec un objet désignant les nations
  choice: déposséder les nations
  alternative: prendre possession d’elles; en hériter
  rationale: Le contexte concerne la prise de leur pays; rendre le verbe par « déposséder » évite l’idée française trompeuse que les nations elles-mêmes seraient héritées.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël. La phrase reste ouverte par une virgule, puisque le verset introduit la prescription qui suit.
