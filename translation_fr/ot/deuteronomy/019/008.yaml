  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: fr
  text: Et si Yahweh ton Dieu agrandit ton territoire, comme il l’a juré à tes pères[a], et te donne tout le pays qu’il a promis de donner à tes pères,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtres », ici et à la seconde occurrence de « pères ». L’hébreu dit littéralement « pères » et désigne les ancêtres patriarcaux d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: La conjonction et la particule conditionnelle rattachent cette proposition à l’instruction légale précédente.
- source_word: יַרְחִיב
  choice: agrandit
  rationale: Le hifil de רחב signifie ici rendre plus vaste; « agrandit ton territoire » est naturel et précis en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier s’adresse individuellement à l’Israélite, conformément au style de l’hébreu.
- source_word: גְּבֻלְךָ
  choice: ton territoire
  rationale: Dans ce contexte d’expansion territoriale, גְּבוּל désigne l’étendue du territoire plutôt que la seule ligne frontalière.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: comme il l’a juré
  rationale: Le passé composé rappelle naturellement en français le serment déjà prêté; le pronom « l’ » reprend l’idée d’agrandir le territoire.
- source_word: לַאֲבֹתֶיךָ
  choice: à tes pères
  rationale: La formulation littérale conserve l’expression covenantale masculine et sa référence aux pères ancestraux d’Israël.
- source_word: וְנָתַן לְךָ
  choice: et te donne
  rationale: Le parfait avec waw poursuit la condition orientée vers l’avenir; le présent après « si » est idiomatique en français.
- source_word: כָּל הָאָרֶץ
  choice: tout le pays
  rationale: אֶרֶץ désigne ici le pays promis, non la terre entière; « tout le pays » convient au contexte.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: qu’il a promis de donner
  rationale: Bien que דִּבֵּר signifie littéralement « parler », le contexte du serment et du don annoncé justifie « promettre » en français naturel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » en conserve directement la fonction au lieu de lui substituer un titre.
- issue: Sens de אבות
  choice: pères
  alternative: ancêtres
  rationale: « Pères » reproduit le terme masculin du texte et son évocation des pères ancestraux d’Israël; « ancêtres » explicite le sens contextuel sans préserver exactement la forme.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse hébraïque à Israël envisagé comme un interlocuteur individuel. La phrase reste ouverte par une virgule, puisque la condition se poursuit au verset suivant.
