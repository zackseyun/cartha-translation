  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: fr
  text: Ton œil n’aura pas pitié de lui[a]. Tu feras disparaître d’Israël le sang innocent[b], et il t’arrivera du bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ton œil n’aura pas pitié de lui. » On peut aussi traduire : « Tu ne l’épargneras pas. » En hébreu, l’œil est présenté comme le siège de la pitié ou de la compassion.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, il s’agit d’ôter d’Israël la culpabilité liée au meurtre d’un innocent.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: Tu n’auras aucune pitié pour lui
  rationale: L’expression hébraïque mentionne littéralement l’œil comme siège de la compassion. En français moderne, « n’avoir aucune pitié » transmet naturellement la force de l’interdiction, tandis qu’une note conserve l’image originale et la possibilité de comprendre « épargner ».
- source_word: וּבִעַרְתָּ
  choice: Tu feras disparaître
  rationale: Dans les textes juridiques du Deutéronome, בער désigne l’élimination d’un mal ou d’une souillure au sein de la communauté, et non une combustion littérale. « Faire disparaître » est clair et garde la force du commandement.
- source_word: דַם הַנָּקִי
  choice: le sang innocent
  rationale: Cette traduction conserve l’expression juridique et la métonymie hébraïques. Dans le contexte, elle évoque aussi la culpabilité collective résultant du meurtre d’un innocent, sens explicité en note sans être imposé dans le texte.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition מן indique ici l’élimination hors de la communauté d’Israël. Cette formulation est concise et naturelle en français.
- source_word: וְטוֹב לָךְ
  choice: et tout ira bien pour toi
  rationale: Cette formule deutéronomique exprime l’issue favorable attachée à l’obéissance. La formulation retenue est actuelle, intelligible et garde le lien énoncé par la coordination.
theological_decisions:
- issue: Nature de l’ordre concernant le meurtrier
  choice: Le verset ordonne l’application de la justice communautaire exposée dans le contexte immédiat, et non une vengeance privée.
  alternative: Lire cet ordre isolément comme une autorisation de représailles personnelles.
  rationale: Deutéronome 19.11-12 situe l’affaire dans une procédure publique impliquant les anciens de la ville. Aucun ajout explicatif n’est introduit dans le corps du verset.
- issue: Sens de « sang innocent »
  choice: Conserver l’expression hébraïque dans le texte et signaler en note sa portée possible de culpabilité liée au sang versé.
  alternative: Traduire directement par « la culpabilité d’avoir versé le sang innocent ».
  rationale: La formulation directe serait plus explicite, mais elle résoudrait la métonymie du texte source. Le texte principal en préserve la tension, tandis que la note en facilite la compréhension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste directe, conformément au caractère juridique du passage. Les deux phrases courtes évitent une coordination française trop lourde tout en conservant le lien final avec la conséquence favorable.
