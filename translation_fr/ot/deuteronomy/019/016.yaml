  text: כִּֽי יָק֥וּם עֵד חָמָ֖ס בְּ/אִ֑ישׁ לַ/עֲנ֥וֹת בּ֖/וֹ סָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: fr
  text: Si un témoin malveillant se dresse contre un homme pour l’accuser de rébellion[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faute grave », « déviation » ou « apostasie ». Le mot hébreu désigne le fait de s’écarter ou de faire défection, souvent de manière grave.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cette formulation juridique casuistique, כִּי introduit une condition.
- source_word: יָקוּם
  choice: se dresse
  rationale: קום évoque ici le fait de se présenter ou de prendre position comme témoin; « se dresse » conserve cette image concrète.
- source_word: עֵד חָמָס
  choice: un témoin malveillant
  rationale: L’expression signifie littéralement « témoin de violence/de tort » et désigne, dans ce cadre judiciaire, un accusateur animé d’une intention mauvaise.
- source_word: בְּאִישׁ
  choice: contre un homme
  rationale: La préposition marque la personne visée, et אִישׁ est ici un masculin singulier dans une formulation juridique représentative.
- source_word: לַעֲנוֹת בּוֹ
  choice: pour l’accuser
  rationale: Dans ce contexte judiciaire et hostile, ענה avec בּוֹ désigne une déposition à charge; « l’accuser » est naturel en français et évite le lourd « témoigner contre lui ».
- source_word: סָרָה
  choice: rébellion
  rationale: Le nom désigne une déviation ou défection grave. « Rébellion » en préserve la force sans imposer le sens plus spécifiquement religieux d’« apostasie ».
theological_decisions:
- issue: Masculin représentatif dans la formulation juridique
  choice: contre un homme
  alternative: contre quelqu’un
  rationale: Le texte hébreu emploie אִישׁ au masculin singulier; la traduction conserve cette forme plutôt que de la neutraliser.
- issue: Nature de l’accusation exprimée par סָרָה
  choice: rébellion
  alternative: faute grave; apostasie; déviation
  rationale: « Rébellion » conserve l’idée forte de défection ou d’écart volontaire tout en laissant ouverte la nature civile ou religieuse de l’infraction.
translation_notes:
  register: Français international moderne, sobre et juridique. « Se dresse » garde l’image hébraïque sans archaïsme marqué; « l’accuser » rend idiomatiquement la déposition hostile.
