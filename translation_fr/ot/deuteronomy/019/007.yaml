  text: עַל כֵּ֛ן אָנֹכִ֥י מְצַוְּ/ךָ֖ לֵ/אמֹ֑ר שָׁלֹ֥שׁ עָרִ֖ים תַּבְדִּ֥יל לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: fr
  text: 'C’est pourquoi je te donne cet ordre : « Tu mettras à part[a] pour toi trois villes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu désigneras pour toi trois villes. » Le verbe hébreu peut signifier « séparer », « mettre à part » ou, dans ce contexte, « désigner ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque la conséquence de ce qui précède. « C’est pourquoi » est naturel en français et conserve clairement la valeur logique de l’hébreu.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant souligne le sujet, mais le français exprime suffisamment cette insistance par le sujet explicite dans une formulation directe; « moi, je » la renforcerait excessivement ici.
- source_word: מְצַוְּךָ
  choice: je te donne cet ordre
  rationale: Le participe de צוה présente l’ordre comme actuellement formulé. Cette tournure française est plus naturelle que « je suis en train de t’ordonner » tout en gardant la force directive.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif quotatif introduit le contenu de l’ordre. En français moderne, les deux-points remplissent naturellement cette fonction sans l’ajout lourd de « en disant ».
- source_word: שָׁלֹשׁ עָרִים
  choice: trois villes
  rationale: Traduction directe de la construction formée du numéral et du nom.
- source_word: תַּבְדִּיל
  choice: tu mettras à part
  rationale: Le hifil de בדל signifie séparer ou mettre à part. Dans ce contexte légal, « mettre à part » conserve le sens concret de séparation tout en permettant l’idée contextuelle de désignation officielle.
- source_word: לָךְ
  choice: pour toi
  rationale: La préposition avec suffixe masculin singulier indique que ces villes sont mises à part pour l’usage ou le bénéfice du destinataire collectif. « Pour toi » reproduit sobrement cette nuance.
theological_decisions:
- issue: Adresse au masculin singulier dans la loi de l’alliance
  choice: Maintenir le tutoiement singulier (« te », « tu », « toi »).
  alternative: Employer un pluriel collectif (« vous ») ou une formulation impersonnelle.
  rationale: Le texte hébreu s’adresse à Israël au masculin singulier. Le singulier préserve cette forme rhétorique et l’identité collective du destinataire sans explicitation interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste directe; les deux-points rendent naturellement לֵאמֹר. Le futur « tu mettras » porte ici la valeur impérative habituelle des prescriptions légales.
