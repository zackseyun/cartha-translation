review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle et la progression — haine, embuscade, action hostile, coup létal, mort et fuite vers une ville désignée — sont fidèlement conservées. Toutefois, « se jette sur lui » interprète et intensifie וְקָם עָלָיו comme une attaque physique immédiate, alors que l’hébreu dit plus sobrement qu’il « se lève contre lui » / « se dresse contre lui ».
  naturalness: Le français est moderne, clair et convient à la formulation juridique. « Se lève contre lui » reste naturel dans ce registre soutenu et reproduit mieux l’enchaînement du texte source. La répétition sémantique entre le coup mortel et la mort est justifiée par les deux éléments distincts de l’hébreu.
  terminology: « Son prochain », « embuscade », « frappe mortellement » et « ces villes » sont appropriés. Aucun terme théologique ne requiert d’ajustement.
  issues:
  - severity: medium
    issue: « se jette sur lui » est plus spécifique et plus énergique que וְקָם עָלָיו.
    rationale: Le verbe hébreu signifie littéralement « se lever contre » et désigne une action hostile; il ne précise pas nécessairement le mouvement physique exprimé par « se jeter sur ». « Se lève contre lui » conserve l’expression et sa portée.
