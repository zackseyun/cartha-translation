  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: fr
  text: Mais si un homme a de la haine pour son prochain, lui tend une embuscade, se lève contre lui et le frappe mortellement, de sorte qu’il meurt, puis s’enfuit dans l’une de ces villes,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: Introduit, par contraste avec le cas précédent de l’homicide involontaire, une condition décrivant un meurtre prémédité.
- source_word: יִהְיֶה אִישׁ שֹׂנֵא לְרֵעֵהוּ
  choice: un homme a de la haine pour son prochain
  rationale: Rend la formulation masculine du cas juridique et le sens duratif du participe שֹׂנֵא; « prochain » convient au contexte légal sans suggérer une relation amicale.
- source_word: וְאָרַב לוֹ
  choice: lui tend une embuscade
  rationale: Exprime clairement l’action préméditée de guetter quelqu’un afin de l’attaquer.
- source_word: וְקָם עָלָיו
  choice: se jette sur lui
  rationale: Rend naturellement l’idiome hébreu désignant le fait de se dresser contre quelqu’un pour l’attaquer.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: le frappe mortellement, de sorte qu’il meurt
  rationale: La construction avec נֶפֶשׁ décrit un coup porté à la vie, donc mortel; la proposition suivante énonce explicitement la mort comme résultat.
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: puis s’enfuit dans l’une de ces villes
  rationale: « Puis » marque naturellement l’étape suivante du récit juridique; « ces villes » renvoie aux villes de refuge du contexte immédiat.
theological_decisions:
- issue: Description juridique d’un homicide volontaire par opposition à un homicide involontaire
  choice: Conserver la succession haine, embuscade, attaque, coup mortel et fuite
  alternative: Résumer par « assassine son prochain »
  rationale: Le texte établit la préméditation au moyen d’une suite d’actes. La conserver évite de remplacer cette démonstration juridique par une qualification synthétique, même si celle-ci serait juste.
- issue: Rapport entre le coup et la mort
  choice: « le frappe mortellement, de sorte qu’il meurt »
  alternative: « le frappe, et il meurt »
  rationale: Cette formulation rend à la fois l’expression idiomatique וְהִכָּהוּ נֶפֶשׁ et la proposition distincte וָמֵת, sans réduire נֶפֶשׁ au simple sens de « personne » ni effacer le résultat explicitement énoncé.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure celle d’un cas juridique conditionnel; la virgule finale est conservée parce que la phrase se poursuit au verset suivant.
