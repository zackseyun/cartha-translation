  text: וְ/לֹ֤א יִשָּׁפֵךְ֙ דָּ֣ם נָקִ֔י בְּ/קֶ֣רֶב אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וְ/הָיָ֥ה עָלֶ֖י/ךָ דָּמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: fr
  text: afin que du sang innocent ne soit pas versé au milieu de ton pays, que Yahweh, ton Dieu, te donne en héritage, et que tu n'encoures pas de responsabilité pour ce sang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et du sang serait sur toi » ; cette expression hébraïque désigne la responsabilité encourue pour l’effusion de sang innocent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: ne soit pas versé
  rationale: Le nifal de שׁפך exprime ici le passif « être versé ». Avec « sang », « verser du sang » est l’expression française naturelle et conserve la tonalité juridique.
- source_word: דָּם נָקִי
  choice: du sang innocent
  rationale: Cette expression juridique et morale désigne le sang d’une personne qui ne mérite pas la mort. La formulation compacte du français correspond bien à celle de l’hébreu.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: au milieu du pays
  rationale: קֶרֶב signifie littéralement le milieu ou l’intérieur. « Au milieu du pays » préserve cette nuance spatiale dans un registre digne et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: te donne en héritage
  rationale: Le participe נֹתֵן présente le don comme actuel ou en cours, tandis que נַחֲלָה désigne un bien reçu en héritage. Cette formulation conserve le vocabulaire de la terre promise.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: et que tu ne portes pas la responsabilité de ce sang
  rationale: L’expression idiomatique signifie qu’une responsabilité pour le sang versé retomberait sur le destinataire. La négation française prolonge naturellement le but introduit par « afin que », sans changer le rapport logique du verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de וְהָיָה עָלֶיךָ דָּמִים
  choice: tu ne portes pas la responsabilité de ce sang
  alternative: du sang serait sur toi
  rationale: L’expression hébraïque peut être rendue littéralement par « du sang serait sur toi », mais elle désigne en contexte la responsabilité encourue pour l’effusion de sang innocent. La note conserve l’image littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit les formes hébraïques adressées à Israël comme à une unité. « Pays » est retenu pour אֶרֶץ dans ce contexte territorial.
