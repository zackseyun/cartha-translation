  text: וַ/עֲשִׂ֣יתֶם ל֔/וֹ כַּ/אֲשֶׁ֥ר זָמַ֖ם לַ/עֲשׂ֣וֹת לְ/אָחִ֑י/ו וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: fr
  text: Alors, vous lui ferez ce qu’il avait projeté de faire à son frère[a]. Ainsi, tu élimineras le mal de ton milieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son prochain »; l’hébreu dit « à son frère », terme qui, dans ce contexte juridique, désigne un membre de la communauté de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: vous lui ferez
  rationale: Le verbe s’adresse au groupe chargé d’appliquer la décision et porte ici la force d’une prescription juridique. Le futur français convient naturellement à cette formulation légale.
- source_word: כַּאֲשֶׁר זָמַם לַעֲשׂוֹת
  choice: ce qu’il avait projeté de faire
  rationale: זמם désigne un projet délibéré, souvent nuisible dans ce contexte. « Avait projeté » exprime l’antériorité et l’intention sans ajouter une qualification psychologique absente du terme lui-même.
- source_word: לְאָחִיו
  choice: à son frère
  rationale: Le sens premier de אָח est « frère »; dans ce cadre juridique, le mot peut aussi désigner un autre membre de la communauté de l’alliance. Le texte principal conserve la forme concrète de l’hébreu et une note en précise la portée.
- source_word: וּבִעַרְתָּ הָרָע
  choice: Ainsi, tu élimineras le mal
  rationale: Dans la formule juridique du Deutéronome, בער signifie faire disparaître ou ôter le mal, non le brûler littéralement. « Élimineras » restitue clairement cette force judiciaire tout en gardant « le mal » comme objet moral général.
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de toi
  rationale: Cette formulation conserve le singulier collectif de l’hébreu, qui s’adresse à Israël comme à une communauté, ainsi que l’image du mal retiré de son sein.
theological_decisions:
- issue: Portée communautaire du terme masculin אָחִיו
  choice: à son frère
  alternative: à son prochain / à un membre de son peuple
  rationale: L’hébreu emploie le masculin singulier « son frère », mais, dans cette loi, le terme désigne plus largement un membre de la communauté. La traduction maintient la forme source et signale cette portée en note.
- issue: Alternance du pluriel et du singulier dans l’adresse
  choice: « vous lui ferez », puis « tu élimineras »
  alternative: uniformiser toute l’adresse au pluriel ou au singulier
  rationale: Le texte hébreu passe du pluriel וַעֲשִׂיתֶם au singulier וּבִעַרְתָּ et מִקִּרְבֶּךָ. La traduction préserve ce changement, qui peut faire passer des responsables judiciaires à Israël envisagé collectivement.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation juridique reste ferme sans archaïsme. Le passage du « vous » au « tu » reproduit volontairement l’alternance de nombre du texte hébreu.
