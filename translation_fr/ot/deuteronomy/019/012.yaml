  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: fr
  text: Alors les anciens de sa ville enverront le chercher là-bas, le prendront et le livreront au vengeur du sang[a] ; et il mourra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui venge le sang versé ». L’expression hébraïque גֹּאֵל הַדָּם est un terme juridique désignant la personne chargée de venger le sang versé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: enverront quelqu’un
  rationale: Dans cette prescription juridique, le parfait avec waw a une valeur injonctive ou future. Le verbe « envoyer » implique ici naturellement des agents chargés d’aller chercher l’homme.
- source_word: זִקְנֵי עִירוֹ
  choice: les anciens de sa ville
  rationale: « Anciens » désigne les responsables civiques reconnus, et « ville » constitue l’équivalent administratif courant de עִיר.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: le prendront … là-bas
  rationale: לקח signifie largement « prendre ». La formulation reste sobre et n’ajoute pas au texte l’idée explicite d’une arrestation violente.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: le livreront à
  rationale: L’expression idiomatique נתן ביד indique que quelqu’un est remis au pouvoir d’un autre ; « livrer à » rend clairement ce transfert juridique.
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Il s’agit d’une expression juridique technique désignant la personne chargée de venger le sang versé. Cette traduction demeure transparente et proche de la formulation hébraïque.
- source_word: וָמֵת
  choice: et il mourra
  rationale: La proposition énonce avec concision l’issue juridique de la remise de l’homme au vengeur, sans préciser davantage le rapport logique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le futur garde la force prescriptive du texte juridique. La formulation évite l’archaïsme « livrer entre les mains de » tout en conservant le terme technique « vengeur du sang ».
