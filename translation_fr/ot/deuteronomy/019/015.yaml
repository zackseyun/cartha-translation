  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: fr
  text: Un seul témoin ne sera pas recevable contre un homme[a] pour toute faute ou tout péché, pour tout péché qu’il ait commis. C’est sur la déposition de deux témoins ou de trois témoins[b] qu’une affaire sera établie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre quelqu’un » ou « contre une personne ». L’hébreu dit littéralement « contre un homme », au masculin singulier employé dans un sens représentatif en contexte juridique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur la bouche de deux témoins ou sur la bouche de trois témoins ».
    reason: lexical_alternative
  - marker: c
    text: Ou « qu’une affaire sera confirmée ». Le même verbe hébreu est employé au début et à la fin du verset; il signifie littéralement « se tenir » et, dans ce contexte, être recevable ou établi juridiquement.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: ne sera pas recevable ... sera établie
  rationale: Dans ce contexte judiciaire, קום exprime la validité d’un témoignage ou l’établissement d’une affaire. Le français exige des formulations différentes selon le sujet; la note signale la répétition hébraïque.
- source_word: עֵד אֶחָד
  choice: un seul témoin
  rationale: Cette formulation française naturelle souligne qu’un témoignage isolé ne suffit pas.
- source_word: בְּאִישׁ
  choice: contre un homme
  rationale: La préposition a ici un sens adversatif dans un cadre judiciaire. « Homme » conserve le masculin singulier représentatif du texte hébreu, tandis qu’une note indique la portée générale possible.
- source_word: לְכָל עָוֺן
  choice: pour quelque faute ... que ce soit
  rationale: « Faute » rend la portée morale et juridique de עָוֺן dans un français actuel, sans la limiter à une qualification pénale précise.
- source_word: וּלְכָל חַטָּאת
  choice: ou quelque péché que ce soit
  rationale: « Péché » maintient la distinction lexicale avec עָוֺן et la portée morale du terme.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: quel que soit le péché qu’il aura commis
  rationale: La formulation conserve l’insistance cumulative et la répétition de la racine du péché, tout en restant idiomatique en français.
- source_word: עַל פִּי
  choice: sur la déposition de
  rationale: Littéralement « sur la bouche de », l’expression désigne le témoignage servant de fondement judiciaire. « Déposition » est clair et naturel dans ce contexte.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: deux témoins ... trois témoins
  rationale: La formulation reproduit directement l’exigence numérique et le parallélisme.
- source_word: דָּבָר
  choice: une affaire
  rationale: Dans ce cadre judiciaire, דָּבָר désigne largement l’affaire ou le cas examiné; « affaire » préserve cette amplitude.
theological_decisions:
- issue: Masculin représentatif dans אִישׁ
  choice: un homme
  alternative: une personne / quelqu’un
  rationale: Le texte hébreu emploie un masculin singulier représentatif. Le texte principal le conserve sans restreindre explicitement la règle aux hommes; la note présente l’équivalent général.
- issue: Portée judiciaire de קום
  choice: recevable / établie
  alternative: se dresser / tenir
  rationale: Le sens juridique est exprimé clairement sans effacer le parallélisme de l’original, lequel est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible, avec une terminologie juridique compréhensible. La répétition emphatique des termes relatifs à la faute et au péché est conservée, tandis que les idiomes judiciaires hébreux sont rendus naturellement et documentés en notes.
