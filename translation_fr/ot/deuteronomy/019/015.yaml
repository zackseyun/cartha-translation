revisions:
- from: Un seul témoin ne sera pas recevable contre un homme[a] pour quelque faute ou quelque péché que ce soit, quel que soit le péché qu’il aura commis. C’est sur la déposition de deux témoins ou de trois témoins[b] qu’une affaire sera établie[c].
  to: Un seul témoin ne sera pas recevable contre un homme[a] pour toute faute ou tout péché, pour tout péché qu’il ait commis. C’est sur la déposition de deux témoins ou de trois témoins[b] qu’une affaire sera établie[c].
  rationale: La révision retire le futur antérieur non motivé, allège la répétition française tout en préservant l’accumulation des catégories de faute et de péché, et affine la note sur le parallélisme de יָקוּם. Les ancres et les trois notes sont conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:02:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens juridique est globalement fidèle : un témoignage isolé ne suffit pas, et une affaire est établie sur la déposition de deux ou trois témoins. La formulation « qu’il aura commis » introduit toutefois un futur antérieur qui ne correspond pas à l’imparfait hébreu à valeur générale. Une formulation au subjonctif passé rend mieux, en français juridique, le péché allégué sans imposer une temporalité future.'
  naturalness: Le français est clair et de registre approprié. La séquence « quelque faute ou quelque péché que ce soit, quel que soit le péché » est cependant pesante. « Pour toute faute ou tout péché, pour tout péché qu’il ait commis » conserve l’accumulation du texte tout en étant plus idiomatique.
  terminology: « Témoin », « recevable », « déposition » et « affaire » conviennent au contexte judiciaire. « Faute » et « péché » maintiennent utilement la distinction entre les deux premiers termes hébreux, tout en laissant apparaître la répétition du vocabulaire du péché dans la suite.
  issues:
  - severity: medium
    issue: Temporalité de « qu’il aura commis »
    rationale: Le futur antérieur suggère une action future achevée. L’hébreu אֲשֶׁר יֶחֱטָא exprime ici la portée générale de tout péché commis; le subjonctif passé français convient mieux dans l’énoncé d’une règle judiciaire.
  - severity: low
    issue: Répétition française peu fluide
    rationale: La double construction « quelque ... que ce soit, quel que soit ... » alourdit la phrase sans mieux refléter l’insistance cumulative de l’hébreu.
  - severity: low
    issue: 'Note c : alternative imprécise'
    rationale: « Qu’un cas sera reconnu valable » n’est pas une alternative française aussi naturelle ni aussi proche de דָּבָר יָקוּם que « qu’une affaire sera confirmée ». La note doit surtout expliquer le parallélisme du même verbe hébreu.
  revised_text: Un seul témoin ne sera pas recevable contre un homme[a] pour toute faute ou tout péché, pour tout péché qu’il ait commis. C’est sur la déposition de deux témoins ou de trois témoins[b] qu’une affaire sera établie[c].
