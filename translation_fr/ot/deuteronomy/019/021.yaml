id: DEU.19.21
reference: Deuteronomy 19:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: fr
  text: 'Ton œil n’aura pas pitié[a] : vie pour vie[b], œil pour œil, dent pour dent, main pour main, pied pour pied.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’épargnera pas » ou « ne témoignera pas de compassion ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne ici la « vie », et non spécifiquement l’« âme » au sens théologique ultérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: n’aura pas pitié
  rationale: Le verbe חוס exprime ici le fait d’épargner ou de prendre en pitié. « N’aura pas pitié » rend naturellement l’interdiction dans ce contexte judiciaire sans en atténuer la rigueur.
- source_word: עֵינֶךָ
  choice: Ton œil
  rationale: Le sujet concret de la proposition est « ton œil ». Le conserver respecte l’image hébraïque traditionnelle associée à la pitié, plutôt que de la remplacer par le simple pronom « tu ».
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans la formule נֶפֶשׁ בְּנֶפֶשׁ, נֶפֶשׁ désigne la vie mise en jeu, et non spécifiquement une « âme » au sens métaphysique ultérieur.
- source_word: בְּ
  choice: pour
  rationale: La préposition marque ici l’équivalence ou la rétribution. « Pour » restitue avec concision la formule juridique répétée.
- source_word: עַיִן
  choice: œil
  rationale: Terme anatomique littéral dans la formule de rétribution proportionnée.
- source_word: שֵׁן
  choice: dent
  rationale: Terme anatomique littéral, rendu par son équivalent français précis et traditionnel.
- source_word: יָד
  choice: main
  rationale: Le sens anatomique concret convient directement à cette série juridique.
- source_word: רֶגֶל
  choice: pied
  rationale: « Pied » est le sens contextuel et conventionnel dans cette énumération des atteintes corporelles.
theological_decisions:
- issue: Conserver la formule concrète de rétribution juridique ou la généraliser en principe abstrait de proportionnalité
  choice: 'Conserver : « vie pour vie, œil pour œil, dent pour dent, main pour main, pied pour pied »'
  alternative: 'Paraphraser : « la peine devra être proportionnée au tort commis »'
  rationale: L’hébreu emploie une formule juridique concrète et mémorable. La paraphraser ferait disparaître sa force rhétorique, ses correspondances avec d’autres textes de la Torah et la tension théologique propre au passage.
translation_notes:
  register: Français international moderne, sobre et digne. L’expression concrète « Ton œil » est maintenue malgré son caractère moins courant en français afin de préserver l’image hébraïque; la ponctuation met clairement en relation l’interdiction de la pitié judiciaire et la formule qui suit.
