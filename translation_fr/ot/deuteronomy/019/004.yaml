  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: fr
  text: 'Voici la disposition concernant celui qui a causé la mort et qui peut s’y enfuir pour rester en vie : s’il a frappé son prochain sans le savoir[a] et ne le haïssait pas auparavant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans connaissance ». Dans ce contexte, l’expression désigne un acte accompli sans en avoir conscience.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: disposition
  rationale: Dans ce contexte juridique, le terme introduit la règle qui définit le cas donnant droit au refuge.
- source_word: הָרֹצֵחַ
  choice: celui qui a causé la mort
  rationale: Le terme désigne ici une personne ayant causé un décès, sans présumer qu’il s’agit d’un meurtrier coupable. Cette formulation est claire en français moderne et évite la connotation volontaire de « meurtrier ».
- source_word: יָנוּס שָׁמָּה
  choice: pourra s’y enfuir
  rationale: L’imparfait hébreu caractérise la personne autorisée à chercher refuge, plutôt que d’énoncer ici un ordre direct.
- source_word: וָחָי
  choice: pour rester en vie
  rationale: La formulation exprime naturellement en français le résultat ou le but de la fuite tout en conservant le lien étroit entre refuge et survie.
- source_word: יַכֶּה
  choice: aura frappé
  rationale: Le verbe signifie d’abord « frapper »; le contexte du cas d’homicide fournit l’issue mortelle sans qu’il soit nécessaire de remplacer le verbe par « tuer ».
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: « Prochain » conserve la dimension relationnelle et juridique de רֵעַ et appartient au registre biblique français courant sans être obscur.
- source_word: בִּבְלִי דַעַת
  choice: sans le savoir
  rationale: Cette traduction préserve plus directement l’idée hébraïque d’absence de connaissance ou de conscience, sans réduire entièrement l’expression à la seule intention juridique.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: il ne le haïssait pas
  rationale: L’imparfait français rend naturellement la disposition antérieure et durable décrite par le participe hébreu.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: auparavant
  rationale: L’expression est un idiome temporel signifiant que la haine n’existait pas antérieurement; une note conserve sa formulation concrète.
theological_decisions:
- issue: Degré de culpabilité de celui qui a causé la mort
  choice: Ne pas employer « meurtrier » et conserver « sans le savoir »
  alternative: « meurtrier » ou « sans intention »
  rationale: Le cadre des villes de refuge distingue l’homicide sans hostilité préalable du meurtre volontaire. La traduction ne doit ni imputer d’emblée une culpabilité volontaire ni effacer l’ambiguïté concrète de l’absence de connaissance.
translation_notes:
  register: Français international moderne, digne et accessible. « Celui qui a causé la mort » privilégie la clarté juridique sur l’archaïque « homicide » pris comme nom de personne; « disposition » marque le cadre légal. La syntaxe avec deux-points explicite que la suite définit le cas admissible sans ajouter de contenu doctrinal.
