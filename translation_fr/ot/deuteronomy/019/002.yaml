  text: שָׁל֥וֹשׁ עָרִ֖ים תַּבְדִּ֣יל לָ֑/ךְ בְּ/ת֣וֹךְ אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: fr
  text: Tu mettras à part pour toi trois villes dans ton pays, que Yahweh, ton Dieu, te donne pour en prendre possession[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le recevoir en héritage ». Le verbe hébreu peut signifier « prendre possession » ou « recevoir en héritage » lorsqu’il est question du don d’un pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: trois villes
  rationale: עִיר peut désigner une ville ou une localité. « Villes » est naturel et convient au contexte juridique des villes de refuge.
- source_word: תַּבְדִּיל
  choice: tu mettras à part
  rationale: Le hiphil de בדל exprime l’action de séparer ou de réserver. « Mettre à part » conserve à la fois l’idée de séparation et celle de désignation officielle.
- source_word: לָךְ
  choice: pour toi
  rationale: Le complément marque ici l’intérêt ou l’avantage du destinataire. « Pour toi » rend cette nuance sans lourdeur.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: au milieu du pays
  rationale: בְּתוֹךְ a un sens spatial, « au milieu de » ou « à l’intérieur de ». « Au milieu du pays » reste proche de la formulation hébraïque tout en étant idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier correspond à l’adresse directe et à la formule d’alliance habituelle.
- source_word: נֹתֵן לְךָ
  choice: te donne
  rationale: Le participe hébreu peut présenter l’action comme actuelle ou imminente. Le présent français convient naturellement au contexte de la promesse.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: ירשׁ peut signifier posséder, prendre possession ou recevoir en héritage. Cette formulation exprime clairement l’entrée en possession du pays donné par Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Sens de ירשׁ dans le contexte du don du pays
  choice: prendre possession
  alternative: recevoir en héritage
  rationale: Le verbe associe ici don divin et acquisition effective du pays. Le texte ne tranche pas entièrement entre possession et héritage; l’autre possibilité est donc signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe juridique de l’ordre est conservée par le futur à valeur injonctive. Le singulier « tu/ton » reflète l’adresse hébraïque à Israël comme collectif.
