  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: fr
  text: Alors tu prendras le poinçon, tu le passeras à travers son oreille jusque dans la porte, et il sera ton esclave de façon permanente[a]. Tu feras de même pour ton esclave de sexe féminin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toujours » ; dans ce contexte juridique, l’expression hébraïque peut aussi signifier « à vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: le poinçon
  rationale: מַרְצֵעַ désigne un instrument pointu servant à percer. « Poinçon » est le terme français courant et précis dans ce contexte rituel.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: tu le passeras à travers son oreille jusque dans la porte
  rationale: 'La formulation rend explicite le percement indiqué par l’instrument et par le contexte, tout en conservant les deux éléments coordonnés du texte hébreu : l’oreille et la porte.'
- source_word: עֶבֶד
  choice: esclave
  rationale: Le contexte juridique met en avant un statut de dépendance durable. « Esclave » en préserve la force sociale et légale, contrairement au terme plus atténué « serviteur ».
- source_word: עוֹלָם
  choice: de façon permanente
  rationale: Dans ce cadre juridique, עוֹלָם exprime la permanence du statut sans imposer l’idée d’une durée métaphysiquement infinie. Une note conserve les autres possibilités de rendu.
- source_word: אֲמָתְךָ
  choice: ton esclave si c’est une femme
  rationale: אָמָה désigne ici une esclave. Cette tournure naturelle évite le français maladroit « esclave féminin » tout en marquant clairement le sexe et en maintenant la terminologie de l’esclavage.
- source_word: וְאַף
  choice: Tu feras de même
  rationale: La valeur additive de וְאַף est naturellement portée en français par la reprise « de même ».
- source_word: תַּעֲשֶׂה כֵּן
  choice: tu feras de même
  rationale: Cette expression idiomatique signifie agir de la même manière; le rendu est clair, actuel et fidèle.
theological_decisions:
- issue: Terminologie de l’esclavage dans la législation israélite
  choice: Employer « esclave » pour עֶבֶד et אָמָה
  alternative: « serviteur », « servante » ou « personne asservie »
  rationale: Le passage décrit un statut légal de dépendance durable marqué par un rite. « Esclave » en conserve la réalité sociale sans l’adoucir ni lui ajouter une interprétation doctrinale.
- issue: Portée temporelle de עוֹלָם
  choice: « de façon permanente » avec une note
  alternative: « pour toujours » ou « à vie »
  rationale: Le mot exprime une durée indéfinie ou durable dont la portée exacte dépend du contexte. Le texte principal communique la permanence juridique, tandis que la note préserve l’ambiguïté entre la formulation littérale et sa portée pratique.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive convient au style juridique du passage. « Poinçon » est concret sans être technique, et la formulation finale évite une expression genrée artificielle.
