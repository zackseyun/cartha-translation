  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: fr
  text: Tu ne manqueras pas de lui donner[a], et que ton cœur ne soit pas contrarié quand tu lui donneras[b], car, à cause de cette action, Yahvé[c], ton Dieu, te bénira dans tout ton travail et dans tout ce que tu entreprendras[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu insiste fortement sur l’ordre de donner ; on pourrait aussi traduire : « Tu lui donneras assurément. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, l’hébreu dit : « que ton cœur ne soit pas mauvais/affligé quand tu lui donnes ». Selon le contexte, le sens peut être : « ne donne pas à contrecœur » ou « sans ressentiment ».'
    reason: lexical_alternative
  - marker: c
    text: « Yahvé » représente le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR » dans de nombreuses traductions.
    reason: alternative_reading
  - marker: d
    text: 'Littéralement : « dans tout envoi de ta main », c’est-à-dire dans tout ce que ta main entreprend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: Tu ne manqueras pas de lui donner
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’ordre. La tournure française « ne pas manquer de » exprime naturellement cette insistance sans ajouter explicitement l’idée de générosité.
- source_word: לּוֹ
  choice: lui
  rationale: Le suffixe hébreu est au masculin singulier et renvoie au frère nécessiteux du contexte. « Lui » conserve le référent singulier de façon naturelle en français.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: ne sois pas peiné
  rationale: L’expression décrit la réaction intérieure négative suscitée par le don. « Ne sois pas peiné » conserve cette dimension affective sans la réduire exclusivement au ressentiment; l’image littérale du cœur est signalée en note.
- source_word: בְּתִתְּךָ לוֹ
  choice: quand tu lui donnes
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle ou circonstancielle, rendue naturellement par « quand ».
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: car, à cause de cela
  rationale: בגלל marque la cause et הדבר הזה renvoie au geste de donner qui vient d’être commandé. « À cause de cela » reste proche de l’hébreu tout en étant idiomatique.
- source_word: יְבָרֶכְךָ
  choice: te bénira
  rationale: ברך est le verbe courant signifiant « bénir »; le futur français convient à la promesse formulée dans ce contexte.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » translittère le nom divin YHWH au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Cette expression d’alliance est rendue directement, en conservant la deuxième personne du singulier.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: dans tout ton travail
  rationale: מַעֲשֶׂה désigne largement ce que l’on fait ou produit. « Travail » convient au contexte économique et demeure naturel.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: dans tout ce que tu entreprendras
  rationale: L’expression idiomatique, littéralement liée à l’envoi ou à l’activité de la main, désigne tout ce à quoi une personne s’applique. La traduction française en communique clairement le sens, tandis que l’image hébraïque est donnée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. Employer « Yahvé » préserve le nom personnel divin plutôt que de le remplacer par un titre, tout en suivant une forme française reconnue.
- issue: Genre et nombre du bénéficiaire
  choice: lui, au singulier
  alternative: leur
  rationale: Le suffixe hébreu est masculin singulier et renvoie dans le contexte au frère nécessiteux. Le pronom français « lui » conserve le singulier, même s’il ne marque pas à lui seul le genre.
- issue: Disposition intérieure lors du don
  choice: ne sois pas peiné
  alternative: ne donne pas à contrecœur
  rationale: L’hébreu attribue explicitement la réaction négative au cœur. La traduction retenue maintient la tension entre peine, réticence et ressentiment sans limiter le sens à une seule de ces nuances.
translation_notes:
  register: 'Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque. La formulation privilégie une équivalence optimale : elle conserve l’insistance du commandement et la nuance intérieure de la proposition sur le cœur, tout en rendant idiomatiquement l’expression finale concernant la main.'
