  to: Tu ne manqueras pas de lui donner[a], et que ton cœur ne soit pas contrarié quand tu lui donneras[b], car, à cause de cette action, Yahvé[c], ton Dieu, te bénira dans tout ton travail et dans tout ce que tu entreprendras[d].
  rationale: La correction remplace une formulation qui attribuait la peine directement à la personne par une formulation qui garde le « cœur » comme sujet, conformément à l’hébreu, et qui exprime la réticence contextuelle sans imposer une lecture unique telle que le ressentiment. Elle rend également le renvoi causal à « cette action » un peu plus explicite. Les ancres de notes restent chacune attachées à l’élément pertinent.
