source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: fr
  text: S’il y a chez toi un pauvre, l’un de tes frères[a], dans l’une de tes villes[b], dans le pays que Yahweh, ton Dieu, te donne, tu n’endurciras pas ton cœur et tu ne garderas pas ta main fermée devant ton frère pauvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Frères » et « frère » sont ici des termes familiaux désignant les autres membres de la communauté de l’alliance.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « dans l’une de tes portes » ; les portes désignent ici une ville ou une localité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: S’il y a
  rationale: Rend naturellement la condition d’une loi casuistique, sans imposer un sens strictement futur.
- source_word: אֶבְיוֹן
  choice: un pauvre
  rationale: Exprime la personne pauvre ou nécessiteuse tout en conservant le masculin singulier représentatif du texte juridique.
- source_word: מֵאַחַד אַחֶיךָ
  choice: l’un de tes frères
  rationale: Préserve le langage familial qui désigne les membres de la communauté de l’alliance.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: dans l’une de tes villes
  rationale: Les « portes » désignent ici par métonymie les villes ou localités; cette formulation est claire en français moderne, tandis que l’image littérale est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le participe présente le pays comme le don actuel et continu de Yahweh.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: tu n’endurciras pas ton cœur
  rationale: Conserve l’image hébraïque du cœur rendu dur et sa force morale.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: tu ne fermeras pas ta main
  rationale: Préserve l’image concrète de la main qui se ferme au lieu de donner.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: à ton frère pauvre
  rationale: En français, « fermer sa main à quelqu’un » exprime naturellement le refus de générosité envers lui.
theological_decisions:
- issue: Langage de parenté אַחֶיךָ / אָחִיךָ
  choice: frères / frère
  alternative: proches; compatriotes; autres Israélites
  rationale: Le texte formule l’obligation économique dans le langage familial de la communauté de l’alliance. Le conserver évite d’aplatir cette dimension relationnelle; une note précise sa portée communautaire.
- issue: Rendu du tétragramme יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; l’Éternel
  rationale: La translittération maintient le nom personnel présent dans le texte hébreu sans le remplacer par un titre.
- issue: Portée de la forme masculine singulière אֶבְיוֹן
  choice: un pauvre
  alternative: une personne pauvre; quelqu’un dans le besoin
  rationale: Le masculin singulier du texte est conservé sans nier sa fonction représentative dans cette instruction juridique.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur d’ordre (« tu n’endurciras pas », « tu ne fermeras pas ») conserve le ton juridique. Les images du cœur dur et de la main fermée sont maintenues, tandis que la métonymie des « portes » est explicitée dans le texte principal pour une compréhension immédiate.
