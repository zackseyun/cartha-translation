  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, « fermer sa main à ton frère pauvre » ne rend pas avec assez de justesse la construction hébraïque, qui évoque le fait de tenir sa main fermée devant/envers le pauvre, c’est-à-dire de lui refuser l’aide.
  naturalness: Le français est globalement clair et de registre approprié. « Garder la main fermée devant » est plus idiomatique et plus expressif que « fermer sa main à ». L’incise « Yahweh, ton Dieu » est également mieux ponctuée.
  terminology: « Yahweh », « frères/frère », « pauvre », « endurcir ton cœur » et « villes » (avec note sur « portes ») conviennent. La note sur la parenté d’alliance est pertinente et conserve la portée communautaire sans substituer un terme interprétatif au texte.
