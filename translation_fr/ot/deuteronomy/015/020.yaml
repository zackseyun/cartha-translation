  text: לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֤י/ךָ תֹאכֲלֶ֨/נּוּ֙ שָׁנָ֣ה בְ/שָׁנָ֔ה בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה אַתָּ֖ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: fr
  text: Toi et ta maisonnée, vous le mangerez d’année en année devant Yahvé ton Dieu, au lieu que Yahvé choisira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence de Yahvé ton Dieu ».
    reason: Alternative lexicale pour לִפְנֵי, qui peut exprimer la position « devant » aussi bien que la présence.
lexical_decisions:
- source_word: לִפְנֵי
  choice: devant
  rationale: L’expression signifie « devant » ou « en présence de ». « Devant » reste concise, naturelle et conserve la dimension cultuelle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du tétragramme préserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le nom avec suffixe masculin singulier signifie directement « ton Dieu » et forme l’expression d’alliance avec le nom divin.
- source_word: תֹאכֲלֶנּוּ
  choice: vous le mangerez
  rationale: L’imparfait qal à la deuxième personne masculine du singulier, avec objet masculin singulier, exprime ici une prescription. Le pluriel français s’accorde naturellement avec le sujet explicité « toi et ta maisonnée », sans effacer l’adresse individuelle initiale.
- source_word: שָׁנָה בְּשָׁנָה
  choice: d’année en année
  rationale: Cette tournure restitue l’idiome distributif et son rythme, en exprimant la répétition annuelle.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: au lieu que Yahvé choisira
  rationale: Cette formulation rend la langue deutéronomique du lieu choisi et maintient la valeur prospective de l’imparfait.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: toi et ta maisonnée
  rationale: « Maisonnée » désigne l’ensemble du groupe domestique, sens plus large que le seul bâtiment et moins restrictif que « famille ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » conserve le nom personnel dans une forme française établie, au lieu de le remplacer par un titre.
- issue: Portée de לִפְנֵי dans le contexte cultuel
  choice: devant Yahvé ton Dieu
  alternative: en présence de Yahvé ton Dieu
  rationale: Les deux lectures sont lexicalement possibles. Le texte principal conserve la formulation plus formelle « devant », tandis que la note explicite l’autre rendu naturel sans résoudre excessivement la nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple porte la valeur prescriptive sans durcir la phrase en ordre explicite. La légère alternance entre « ton Dieu » et « vous le mangerez » reflète l’adresse hébraïque au singulier suivie du sujet composé « toi et ta maisonnée ».
