base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: fr
  text: 'Car Yahweh ton Dieu t’a béni comme il te l’a promis[a] : tu prêteras à beaucoup de nations, mais tu n’emprunteras pas ; tu domineras beaucoup de nations, mais elles ne te domineront pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme il te l’a dit ». Littéralement, l’hébreu emploie le verbe « parler », mais, dans ce contexte d’alliance, les paroles de Dieu ont valeur de promesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בֵּרַכְךָ
  choice: t’a béni
  rationale: Le parfait hébreu présente la bénédiction comme acquise ; le passé composé est naturel en français et conserve sa portée présente.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: comme il te l’a promis
  rationale: Le verbe signifie littéralement « parler », mais, dans ce contexte d’alliance, les paroles antérieures de Dieu ont valeur de promesse ; une note conserve le sens littéral.
- source_word: וְהַעֲבַטְתָּ
  choice: tu prêteras
  rationale: Le hiphil de עבט désigne ici l’action de prêter ou d’accorder un crédit.
- source_word: גּוֹיִם רַבִּים
  choice: beaucoup de nations
  rationale: Le contexte économique et politique favorise « nations » plutôt que « peuples ».
- source_word: לֹא תַעֲבֹט
  choice: tu n’emprunteras pas
  rationale: 'Le qal de עבט forme ici l’antithèse directe avec le hiphil précédent : prêter, mais ne pas emprunter.'
- source_word: וּמָשַׁלְתָּ
  choice: tu domineras sur
  rationale: משׁל exprime l’exercice d’une autorité sur d’autres nations ; cette formulation préserve la reprise avec la proposition suivante.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: elles ne domineront pas sur toi
  rationale: Le sujet pluriel implicite renvoie naturellement aux nombreuses nations mentionnées juste avant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve sans le remplacer par un titre.
- issue: Valeur de דִּבֶּר dans le contexte de l’alliance
  choice: promis
  alternative: parlé ; dit
  rationale: « Promis » rend la portée contextuelle des paroles divines antérieures, tandis que la note signale la formulation hébraïque plus littérale afin de ne pas masquer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme entité collective. Le parallélisme prêter/emprunter et dominer/ne pas être dominé est conservé.
