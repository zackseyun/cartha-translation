  source_fidelity: 'Le texte rend fidèlement les formes verbales : bénédiction déjà accordée, suivie des conséquences annoncées ; l’opposition prêter/emprunter et l’autorité sur les nations sont maintenues. « Comme il te l’a promis » est une explicitation contextuellement justifiée de « comme il t’a parlé/dit », et la note en signale l’alternative littérale.'
