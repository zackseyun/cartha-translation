source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: fr
  text: 'Car il y aura toujours des pauvres dans le pays. C’est pourquoi je te l’ordonne : « Tu dois ouvrir largement ta main à ton frère[a], au malheureux[b] et au pauvre de ton pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ton compatriote israélite ». L’hébreu dit « à ton frère », selon le langage de parenté propre à l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner une personne pauvre, humble ou affligée; on pourrait aussi traduire « à l’affligé » ou « au pauvre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde le commandement précédent et conserve naturellement la relation explicative.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: il y aura toujours des pauvres
  rationale: Exprime en français courant la permanence indiquée par l’imparfait hébreu nié; le singulier אֶבְיוֹן a ici une valeur générique et collective.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: dans le pays
  rationale: Le contexte du Deutéronome renvoie au pays d’Israël. Cette formulation naturelle conserve ce cadre sans élargir le propos à toute la terre.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence pratique tirée de la première proposition.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: je te donne ce commandement
  rationale: Rend la force présente et directe du participe hébreu dans un français idiomatique et digne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles qui suivent et remplissent la fonction du terme quotatif hébreu.
- source_word: פָּתֹחַ תִּפְתַּח
  choice: Tu dois ouvrir largement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’ordre. « dois » en rend l’obligation et « largement » l’insistance, tout en conservant l’image de la main ouverte.
- source_word: אֶת יָדְךָ
  choice: ta main
  rationale: Conserve la métaphore hébraïque de la générosité plutôt que de l’expliciter dans le corps du texte.
- source_word: לְאָחִיךָ
  choice: à ton frère
  rationale: Préserve le langage masculin singulier de parenté et sa portée d’alliance; le sens représentatif est signalé en note.
- source_word: לַעֲנִיֶּךָ
  choice: au malheureux
  rationale: עָנִי peut désigner celui qui est pauvre, humilié ou affligé. « malheureux » maintient cette nuance de détresse et le distingue dאֶבְיוֹן.
- source_word: וּלְאֶבְיֹנְךָ
  choice: et au pauvre
  rationale: Rend le terme אֶבְיוֹן par son sens socioéconomique principal et maintient la distinction avec עָנִי.
theological_decisions:
- issue: Langage représentatif de parenté
  choice: à ton frère
  alternative: à ton compatriote israélite
  rationale: Le texte emploie le masculin singulier אָח dans un cadre d’alliance. « frère » conserve cette image familiale sans réduire le référent à la parenté biologique; une note en précise la portée.
- issue: Portée de הָאָרֶץ et אַרְצֶךָ
  choice: le pays / ton pays
  alternative: la terre / ta terre
  rationale: Dans le contexte immédiat du Deutéronome, ces termes désignent le pays accordé à Israël. « pays » maintient cet ancrage historique et théologique sans transformer la phrase en affirmation abstraite sur le monde entier.
- issue: Relation entre « frère », « malheureux » et « pauvre »
  choice: maintien des trois désignations en apposition coordonnée
  alternative: fusion en une seule expression telle que « ton frère pauvre et nécessiteux »
  rationale: La formulation française garde les trois éléments du texte hébreu et laisse ouverte leur relation précise, sans imposer une analyse syntaxique ou sociale plus étroite.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël envisagé collectivement. La métaphore de la main ouverte est conservée, tandis que l’intensification hébraïque est rendue par « dois ouvrir largement ». Les marqueurs de note [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
