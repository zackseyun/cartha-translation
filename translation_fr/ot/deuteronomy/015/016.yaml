  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: fr
  text: 'Et s’il te dit : « Je ne partirai pas de chez toi[a] », parce qu’il t’aime, toi et ta maisonnée[b], et parce qu’il est bien auprès de toi,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Je ne sortirai pas d’auprès de toi. » Dans ce contexte, il s’agit de ne pas partir à l’occasion de sa libération.'
    reason: lexical_alternative
  - marker: b
    text: « Maisonnée » traduit ici « maison » au sens de l’ensemble des personnes et de la vie domestique placées sous la responsabilité du maître, et non du seul bâtiment.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Et s’il
  rationale: Cette formule introduit ici un cas éventuel dans un texte juridique. « Et s’il » conserve l’enchaînement avec le contexte tout en étant naturel en français.
- source_word: יֹאמַר אֵלֶיךָ
  choice: te dit
  rationale: L’imparfait hébreu présente une situation possible. Le présent français convient naturellement à la formulation d’un cas juridique.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Je ne partirai pas de chez toi
  rationale: יָצָא signifie littéralement « sortir », mais désigne ici le départ du serviteur lors de sa libération. « Partir de chez toi » conserve l’idée concrète de quitter la maison et l’association avec le maître, sans introduire explicitement « être libéré ».
- source_word: כִּי אֲהֵבְךָ
  choice: parce qu’il t’aime
  rationale: כִּי exprime la raison pour laquelle le serviteur refuse de partir; « parce que » rend clairement ce lien causal.
- source_word: וְאֶת בֵּיתֶךָ
  choice: toi et ta maisonnée
  rationale: בַּיִת désigne ici les personnes et la sphère domestique du maître, et non seulement le bâtiment. « Maisonnée » préserve cette portée collective sans la réduire à la seule famille biologique.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: et parce qu’il est heureux auprès de toi
  rationale: La tournure hébraïque signifie littéralement que la situation est bonne pour lui avec son maître. « Il est heureux auprès de toi » exprime naturellement son bien-être tout en gardant la nuance relationnelle de עִמָּךְ.
