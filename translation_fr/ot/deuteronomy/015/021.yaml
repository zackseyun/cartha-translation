reference: Deuteronomy 15:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: fr
  text: Mais s’il a un défaut — qu’il soit boiteux ou aveugle, ou qu’il présente tout autre défaut grave —, tu ne le sacrifieras pas à Yahweh, ton Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: Introduit une condition en contraste avec l’instruction précédente; « Mais si » restitue naturellement les deux valeurs.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: il a un défaut
  rationale: Le tour hébreu signifie littéralement qu’un défaut se trouve en lui; la possession est plus idiomatique en français.
- source_word: פִּסֵּחַ אוֹ עִוֵּר
  choice: s’il est boiteux ou aveugle
  rationale: Ces équivalents directs désignent deux défauts physiques précis de l’animal.
- source_word: כֹּל מוּם רָע
  choice: quelque défaut grave que ce soit
  rationale: רָע qualifie ici un défaut rédhibitoire ou sérieux, non une faute morale; « grave » conserve cette portée sans produire l’étrange expression « mauvais défaut ».
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: tu ne le sacrifieras pas
  rationale: La négation avec l’inaccompli, dans ce contexte juridique, exprime une interdiction; « sacrifier » rend la portée cultuelle de זבח.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: à Yahweh ton Dieu
  rationale: Conserve le nom divin et l’adresse personnelle au singulier du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » le distingue du titre אֲדֹנָי et préserve ici le nom d’alliance.
- issue: Portée de מוּם רָע
  choice: défaut grave
  alternative: mauvais défaut
  rationale: Dans cette loi sacrificielle, רָע décrit le caractère sérieux ou inacceptable du défaut physique, et non un mal moral. La formulation choisie explicite cette valeur contextuelle sans ajouter de catégorie doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Tutoiement singulier conservé pour refléter l’adresse hébraïque à Israël. La reprise « s’il » et la locution « que ce soit » rendent lisible l’énumération tout en gardant l’extension générale de כֹּל.
