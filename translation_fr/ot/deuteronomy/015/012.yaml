    rationale: « Tu le renverras libre » reflète plus directement תְּשַׁלְּחֶנּוּ חָפְשִׁי (« tu l’enverras/libéreras libre ») que « tu le laisseras partir libre », sans modifier le sens.
  revised_text: Si ton frère, un Hébreu ou une Hébreuse, t’est vendu et te sert pendant six ans, tu le renverras libre d’auprès de toi la septième année.[a]
