  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: fr
  text: Si ton frère, un Hébreu ou une Hébreuse, t’est vendu et te sert pendant six ans, tu le renverras libre d’auprès de toi la septième année.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Après « un Hébreu ou une Hébreuse », l’hébreu emploie une forme masculine singulière pour la personne libérée. La prescription s’applique aussi bien à l’homme qu’à la femme.
    reason: Clarification de la reprise grammaticale masculine et de sa portée inclusive.
lexical_decisions:
- source_word: יִמָּכֵר
  choice: est vendu à toi
  rationale: Le nifal de מכר est rendu passivement, sans préciser de quelle manière la personne est entrée dans cette condition.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Conserve l’image familiale et communautaire du texte hébreu plutôt que de la réduire à « compatriote » ou « parent ».
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: un Hébreu ou une Hébreue
  rationale: Reproduit la distinction masculine et féminine des deux formes hébraïques, qui désignent ici l’appartenance et le sexe sans employer elles-mêmes le mot « esclave ».
- source_word: וַעֲבָדְךָ
  choice: te sert pendant
  rationale: עבד décrit le service accompli pour le destinataire; « pendant » relie naturellement ce service à la durée de six ans.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: la septième année
  rationale: Expression temporelle directe marquant le moment où la libération devient obligatoire.
- source_word: תְּשַׁלְּחֶנּוּ חָפְשִׁי
  choice: tu le laisseras partir libre
  rationale: Rend l’action de שלח dans ce contexte de libération ainsi que le statut libre exprimé par חָפְשִׁי, dans un français naturel.
- source_word: מֵעִמָּךְ
  choice: de chez toi
  rationale: Rend l’expression littérale « d’avec toi » en indiquant naturellement le départ hors de la maison et du service du maître.
theological_decisions:
- issue: Masculin singulier après la mention d’un Hébreu ou d’une Hébreue
  choice: Conserver « le » dans le texte et expliciter sa portée dans une note.
  alternative: Employer « cette personne » ou répéter « l’homme ou la femme » afin de rendre immédiatement l’application aux deux sexes.
  rationale: L’hébreu nomme explicitement l’homme et la femme, puis reprend la personne libérée au masculin singulier. La traduction conserve cette forme grammaticale sans laisser croire que la prescription exclut la femme.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse individuelle de l’hébreu. « Est vendu à toi » garde volontairement la voix passive et l’ambiguïté sur les circonstances de la vente; « de chez toi » restitue idiomatiquement מֵעִמָּךְ.
