revisions:
- from: Si ton frère, un Hébreu ou une Hébreue, est vendu à toi et te sert pendant six ans, la septième année, tu le laisseras partir libre de chez toi.[a]
  to: Si ton frère, un Hébreu ou une Hébreuse, t’est vendu et te sert pendant six ans, tu le renverras libre d’auprès de toi la septième année.[a]
  rationale: La révision supprime un calque syntaxique (« est vendu à toi ») tout en maintenant la voix passive et son ambiguïté quant aux circonstances de la vente. Elle rend plus directement le verbe de libération et l’expression « d’avec toi », sans ajouter d’interprétation institutionnelle ou doctrinale.
