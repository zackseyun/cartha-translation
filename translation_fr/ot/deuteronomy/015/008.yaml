  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: fr
  text: Au contraire[a], tu lui ouvriras grand ta main et tu lui prêteras de quoi répondre à ce qui lui manque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ouvrir, tu ouvriras… prêter, tu lui prêteras ». Cette répétition verbale sert à renforcer le commandement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Au contraire
  rationale: Dans ce contexte, la conjonction introduit l’attitude opposée à l’endurcissement du cœur et au refus évoqués au verset précédent. « Au contraire » exprime naturellement ce contraste.
- source_word: פָתֹחַ תִּפְתַּח
  choice: tu lui ouvriras largement la main
  rationale: La construction formée de l’infinitif absolu et du verbe conjugué renforce l’ordre. « Ouvrir largement la main » conserve l’image hébraïque tout en exprimant son caractère insistant et généreux.
- source_word: יָדְךָ ... לוֹ
  choice: la main ... à lui
  rationale: La formulation française « ouvrir la main à quelqu’un » restitue directement la métaphore concrète de la générosité envers le pauvre.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: et tu lui prêteras
  rationale: Le verbe à la forme causative signifie ici prêter. La répétition emphatique hébraïque renforce l’obligation; elle est signalée dans la note avec celle de la première proposition, sans alourdir le français.
- source_word: דֵּי מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: de quoi pourvoir à tous ses besoins
  rationale: Cette formulation naturelle rend l’idée d’une quantité suffisante pour répondre à ce qui lui manque. « Tous ses besoins » conserve la portée ouverte de la proposition relative sans la répétition peu idiomatique de « manque ».
