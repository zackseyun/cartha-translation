  naturalness: Le français est globalement moderne et clair. « Il n’en exigera pas le paiement de son prochain » est cependant lourd et ambigu dans son enchaînement pronominal. « Il ne réclamera pas paiement à son prochain ni à son frère » est plus idiomatique tout en gardant le parallélisme du texte source.
  terminology: « Remise », « créancier », « prochain », « frère » et « Yahweh » conviennent. « Remise des dettes » peut utilement être réduit à « remise » dans le texte, puisque la créance est explicitée dans la proposition précédente et que le terme hébreu conserve une portée juridique discutée.
