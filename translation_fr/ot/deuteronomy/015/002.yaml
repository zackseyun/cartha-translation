  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: fr
  text: 'Voici la règle concernant la remise : tout créancier abandonnera la créance qu’il détient sur son prochain[a]. Il ne réclamera pas paiement à son prochain ni à son frère[b], car une remise pour Yahweh a été proclamée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu shemittah peut aussi être rendu par « abandon », « annulation » ou « remise ». Il désigne le fait de laisser tomber une créance dans le cadre de l’année sabbatique ; ce verset, à lui seul, ne précise pas entièrement les effets juridiques ni la durée de cette remise.
    reason: lexical_alternative
  - marker: b
    text: Ici, « frère » désigne un autre membre de la communauté de l’alliance ; on pourrait aussi traduire, de façon plus interprétative, « compatriote israélite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: voici en quoi consiste
  rationale: Dans cette formule juridique, le nom introduit la règle qui définit concrètement la remise; cette tournure est naturelle en français tout en conservant sa fonction explicative.
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  choice: remise des dettes
  rationale: Dans le contexte de l’année sabbatique, le terme désigne l’abandon obligatoire des créances. Cette expression française précise le domaine économique sans décider au-delà du contexte si la dette elle-même est juridiquement annulée.
- source_word: שָׁמוֹט
  choice: renoncera
  rationale: L’infinitif absolu placé devant le verbe renforce l’obligation. Le futur à valeur prescriptive rend naturellement cette force juridique en français.
- source_word: בַּעַל מַשֵּׁה יָדוֹ
  choice: tout créancier
  rationale: L’expression idiomatique désigne le détenteur d’une créance née d’un prêt; « créancier » exprime clairement ce rôle juridique.
- source_word: מַשֵּׁה יָדוֹ אֲשֶׁר יַשֶּׁה
  choice: la créance qu’il détient
  rationale: La construction hébraïque associe littéralement le prêt de sa main et l’action de rendre l’autre débiteur. La formulation française restitue naturellement l’objet de la renonciation sans conserver artificiellement l’image de la main.
- source_word: לֹא יִגֹּשׂ
  choice: il n’en exigera pas le paiement
  rationale: Le verbe signifie presser un débiteur ou exiger de lui le règlement. Cette formulation explicite l’action visée dans le cadre légal.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: « Prochain » est une traduction française établie de רֵעַ et convient au contexte des relations au sein de la communauté.
- source_word: אָחִיו
  choice: son frère
  rationale: Le mot hébreu est masculin singulier et signifie littéralement « frère », avec ici une portée communautaire et conventionnelle indiquée en note.
- source_word: כִּי קָרָא
  choice: car ... a été proclamée
  rationale: Le parfait sans sujet exprimé se comprend naturellement comme une proclamation impersonnelle; le passif français en conserve cette indétermination.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition ל marque ici la relation de la remise à Yahweh. « En l’honneur de » rend naturellement sa consécration ou sa proclamation pour Yahweh, tandis que le nom divin est conservé.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée juridique de שְׁמִטָּה
  choice: remise des dettes comprise comme renonciation à faire valoir la créance
  alternative: annulation définitive de la dette; suspension temporaire du recouvrement
  rationale: Le verset ordonne de laisser tomber la créance et de ne pas en exiger le paiement, mais ne tranche pas à lui seul toutes les questions relatives à sa durée ou à son extinction juridique. La traduction conserve cette tension.
- issue: Portée de אָחִיו
  choice: frère
  alternative: compatriote israélite; membre de la communauté de l’alliance
  rationale: Le terme masculin concret du texte est maintenu. Une note signale sa portée sociale et communautaire sans substituer une interprétation au mot source.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton prescriptif du texte juridique, tout en évitant les calques peu naturels comme « le prêt de sa main ». Les deux occurrences sociales, « prochain » et « frère », sont maintenues afin de respecter le parallélisme hébreu.
