revisions:
- from: 'Voici en quoi consiste la remise des dettes : tout créancier renoncera à la créance qu’il détient sur son prochain[a]. Il n’en exigera pas le paiement de son prochain ni de son frère[b], car une remise des dettes en l’honneur de Yahweh a été proclamée.'
  to: 'Voici la règle concernant la remise : tout créancier abandonnera la créance qu’il détient sur son prochain[a]. Il ne réclamera pas paiement à son prochain ni à son frère[b], car une remise pour Yahweh a été proclamée.'
  rationale: La révision améliore la fluidité de l’interdiction de recouvrement, rend plus directement la relation de la remise à Yahweh et reformule la note sur shemittah afin de préserver l’incertitude juridique. Elle maintient le registre juridique, le nom divin, ainsi que le parallélisme « prochain » / « frère ».
