source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: fr
  text: 'Prends garde à ne pas entretenir dans ton cœur une pensée mauvaise[a], en te disant : « La septième année, l’année de la remise[b], approche. » Ne regarde pas d’un œil mauvais[c] ton frère pauvre[d] et ne refuse pas de lui donner. Il criera contre toi à Yahweh, et ce sera un péché pour toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « qu’il y ait dans ton cœur une parole — ou une chose — indigne ». Dans ce contexte, il s’agit d’une pensée ou d’une intention mauvaise.'
    reason: lexical_alternative
  - marker: b
    text: Ou « l’année de l’annulation ». Il s’agit de la remise des dettes prescrite pour la septième année.
    reason: cultural_note
  - marker: c
    text: Littéralement, « ton œil serait mauvais ». Cette expression hébraïque décrit ici une attitude avare ou réticente envers une personne dans le besoin.
    reason: idiom_explanation
  - marker: d
    text: Ici, « frère » désigne un membre de la même communauté d’alliance, pas nécessairement un frère biologique.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Prends garde
  rationale: L’impératif nifal accompagné du pronom datif exprime une mise en garde personnelle. « Prends garde » est naturel, direct et digne en français moderne.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: qu’une pensée mauvaise ne naisse dans ton cœur
  rationale: דָבָר peut désigner une parole, une chose ou une pensée; ici, le cœur et le contenu introduit ensuite indiquent une intention intérieure. בְלִיַּעַל la qualifie moralement comme mauvaise ou indigne, sans fonctionner comme nom propre.
- source_word: קָרְבָה
  choice: approche
  rationale: Le parfait exprime ici la proximité actuelle de la septième année. Le présent français restitue naturellement cette imminence.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: l’année de la remise
  rationale: שְׁמִטָּה désigne la remise ou l’abandon des créances lié à la septième année. « Remise » conserve le lien avec les dettes tout en évitant une paraphrase excessive.
- source_word: וְרָעָה עֵינְךָ
  choice: Tu regarderais alors d’un œil mauvais
  rationale: La formulation conserve l’image hébraïque de l’œil mauvais, tout en l’intégrant dans une phrase française compréhensible. Une note précise qu’elle désigne ici une attitude avare ou réticente.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: ton frère qui est dans le besoin
  rationale: « Frère » préserve le vocabulaire familial de la communauté de l’alliance; « dans le besoin » rend אֶבְיוֹן avec naturel et sans réduire le terme à une seule situation économique.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: tu ne lui donnerais rien
  rationale: Dans le contexte d’une demande d’aide ou de prêt, la négation du verbe « donner » signifie concrètement ne rien accorder à la personne nécessiteuse.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: Il crierait alors à Yahweh contre toi
  rationale: « Crier contre toi à Yahweh » conserve la nuance d’un appel adressé à Dieu contre celui qui refuse son aide. Le conditionnel français suit naturellement la mise en garde hypothétique.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: tu te rendrais coupable
  rationale: L’expression hébraïque signifie littéralement que le péché serait en la personne. « Tu te rendrais coupable » en communique clairement la portée judiciaire et morale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », plutôt que remplacé par un titre.
theological_decisions:
- issue: Sens moral de בְלִיַּעַל
  choice: pensée mauvaise
  alternative: pensée indigne; dessein pervers
  rationale: Dans ce contexte, le terme qualifie une intention intérieure moralement condamnable. Il n’est pas traité comme un nom propre ni associé à une figure personnelle.
- issue: Image de l’« œil mauvais »
  choice: conserver l’image dans le texte principal
  alternative: tu serais avare envers; tu regarderais avec réticence
  rationale: L’image hébraïque est littérairement marquée et porte ici l’idée d’avarice ou de refus mesquin. La conserver avec une note maintient la texture du texte sans sacrifier la compréhension.
- issue: Portée de אָחִיךָ
  choice: ton frère
  alternative: ton compatriote; un membre de ton peuple
  rationale: Le terme masculin singulier appartient au langage familial de la communauté de l’alliance et ne désigne pas nécessairement un frère biologique.
- issue: Nature de la שְׁמִטָּה
  choice: la remise
  alternative: l’annulation; la libération
  rationale: Le contexte immédiat concerne la remise des créances de la septième année. « Remise » garde une certaine largeur lexicale, tandis que la note explicite l’application aux dettes.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le nom propre divin; « Yahweh » le représente explicitement sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe conditionnelle rend la progression de l’avertissement sans lourdeur. L’image sémitique de l’œil mauvais et le terme familial « frère » sont conservés, avec des notes explicatives; les formulations techniques ou confessionnelles sont évitées.
