id: DEU.15.4
reference: Deuteronomy 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: fr
  text: Toutefois[a], il ne devrait y avoir aucun pauvre parmi vous, car Yahweh ne manquera pas de vous bénir dans le pays que Yahweh votre Dieu vous donne en héritage pour que vous en preniez possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Néanmoins » ou « Seulement »; au début du verset, le mot hébreu אֶפֶס apporte une restriction à l’instruction précédente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Toutefois
  rationale: Introduit une restriction ou une nuance par rapport aux dispositions précédentes sur la remise des dettes. « Toutefois » marque naturellement cette articulation sans accentuer excessivement l’opposition.
- source_word: אֶבְיוֹן
  choice: pauvre
  rationale: Désigne une personne pauvre ou dans le besoin matériel. « Pauvre » est ici le terme français le plus naturel et le plus large.
- source_word: כִּי
  choice: car
  rationale: Le second כִּי introduit la raison de l’affirmation précédente, à savoir la bénédiction de Yahweh.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: ne manquera pas de vous bénir
  rationale: La construction associant l’infinitif absolu au verbe conjugué intensifie l’action. Cette tournure française conserve l’assurance emphatique sans ajouter l’idée non exprimée d’une bénédiction matérielle abondante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: נֹתֵן
  choice: vous donne
  rationale: Le participe présente le don du pays comme une action en cours ou certaine dans le cadre de la promesse; le présent français convient naturellement.
- source_word: נַחֲלָה
  choice: en héritage
  rationale: Conserve la portée juridique et théologique du terme désignant la terre attribuée à Israël.
- source_word: לְרִשְׁתָּהּ
  choice: pour que vous en preniez possession
  rationale: Exprime explicitement le pronom féminin renvoyant au pays et le sens de ירשׁ, prendre possession d’un territoire.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » en conserve la fonction de nom personnel sans lui substituer un titre.
- issue: Rapport entre l’absence de pauvres et la bénédiction divine
  choice: Conserver la formulation normative et causale du verset
  alternative: Transformer l’énoncé en promesse absolue qu’il n’existera jamais de pauvre
  rationale: « Il ne devrait y avoir » rend la force contextuelle de l’énoncé tout en maintenant la tension avec les instructions voisines concernant les pauvres, sans résoudre artificiellement cette tension.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que « ne manquera pas de vous bénir » restitue idiomatiquement son intensification verbale. Le vouvoiement pluriel représente l’adresse collective à Israël.
