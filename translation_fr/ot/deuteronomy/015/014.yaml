base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: fr
  text: Tu lui donneras généreusement[a] de ton petit bétail, de ton aire de battage et de ton pressoir. Tu lui donneras de ce dont Yahweh, ton Dieu, t’a béni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une construction emphatique : l’ordre est de le pourvoir abondamment au moment de sa libération. Autre traduction possible : « Tu le pourvoiras largement ».'
    reason: Précision lexicale sur הַעֲנֵיק תַּעֲנִיק et sur la force de l’infinitif absolu.
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: Tu lui donneras largement
  rationale: Le verbe ענק au hiphil désigne ici le fait de pourvoir l’ancien serviteur à son départ, et la construction avec infinitif absolu renforce nettement l’ordre. « Donner largement » exprime en français courant à la fois la provision et l’insistance, sans reproduire artificiellement la forme hébraïque.
- source_word: מִצֹּאנְךָ
  choice: de ton petit bétail
  rationale: צאן est un collectif qui comprend surtout les moutons et les chèvres. « Petit bétail » est précis et convient au cadre agricole.
- source_word: וּמִגָּרְנְךָ
  choice: de ton aire de battage
  rationale: גֹּרֶן désigne concrètement l’aire de battage et, par métonymie, les céréales qui en proviennent. Le maintien de l’image concrète respecte la triade agricole du texte.
- source_word: וּמִיִּקְבֶךָ
  choice: de ton pressoir
  rationale: יֶקֶב désigne le pressoir ou la cuve où l’on recueille le produit pressé. « Pressoir » est clair dans cette énumération agricole.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: de ce dont Yahweh, ton Dieu, t’a béni
  rationale: Cette formulation conserve le lien direct entre le don exigé et la bénédiction préalablement reçue de Dieu, sans préciser davantage si la relation est seulement matérielle ou aussi proportionnelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu.
- source_word: תִּתֶּן לוֹ
  choice: Tu lui donneras
  rationale: La reprise simple du verbe « donner » reproduit la conclusion explicite de l’ordre hébreu et donne à la phrase une clôture ferme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de la bénédiction divine comme mesure du don
  choice: de ce dont Yahweh, ton Dieu, t’a béni
  alternative: selon la bénédiction que Yahweh, ton Dieu, t’a accordée
  rationale: La formulation retenue préserve l’ambiguïté entre la provenance des biens donnés et une éventuelle proportion fondée sur l’abondance de la bénédiction, plutôt que d’imposer uniquement une lecture proportionnelle.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier suit l’adresse hébraïque à chaque membre du peuple. Les images agricoles concrètes sont conservées, tandis que « largement » transmet naturellement la force emphatique du premier ordre.
