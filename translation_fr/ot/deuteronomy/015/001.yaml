  text: At the end of every seven years you shall make a release[a].
translation:
  language: fr
  text: Au terme de chaque période de sept ans, tu feras une remise[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une libération » ou « une annulation » ; le mot hébreu שְׁמִטָּה désigne ici la remise instaurée par la loi sur les dettes de la septième année.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: Au terme de
  rationale: Cette expression rend l’idiome temporel « à la fin de / au terme de » sans trancher plus précisément le moment d’application dans le cycle.
- source_word: שֶׁבַע שָׁנִים
  choice: chaque période de sept ans
  rationale: L’hébreu dit littéralement « sept ans »; le contexte légal indique un cycle récurrent. Cette formulation naturelle en français explicite cette périodicité sans transformer le texte en datation annuelle.
- source_word: תַּעֲשֶׂה
  choice: tu accorderas
  rationale: Le verbe עשה signifie largement « faire ». Avec שְׁמִטָּה, « accorder » exprime naturellement en français l’instauration de la remise, tout en conservant la force prescriptive du futur légal.
- source_word: שְׁמִטָּה
  choice: une remise
  rationale: Le terme désigne l’action de relâcher ou de laisser tomber; dans ce contexte, il s’agit de la remise prévue par la loi de la septième année. « Remise » reste concise et permet aux versets suivants de préciser qu’elle concerne les dettes.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier conserve l’adresse légale hébraïque. « Au terme de » préserve la légère souplesse temporelle de מִקֵּץ, tandis que « remise » évite d’expliciter les dettes avant que le contexte immédiat ne le fasse.
