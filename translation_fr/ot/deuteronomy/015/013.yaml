  text: וְ/כִֽי תְשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ לֹ֥א תְשַׁלְּחֶ֖/נּוּ רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: fr
  text: Quand tu le renverras libre de chez toi[a], tu ne le renverras pas les mains vides.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Si tu le renvoies libre de chez toi ». La conjonction hébraïque peut se comprendre au sens conditionnel (« si ») ou temporel (« quand »).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Quand
  rationale: La combinaison peut être temporelle ou conditionnelle. Dans cette loi prospective, « Quand » exprime naturellement le moment attendu de la libération; l’autre lecture est conservée en note.
- source_word: תְשַׁלְּחֶנּוּ
  choice: tu le renverras
  rationale: Le piel de שלח avec suffixe masculin singulier signifie renvoyer ou laisser partir. La répétition de « renverras » dans les deux propositions reproduit celle de l’hébreu.
- source_word: חָפְשִׁי
  choice: libre
  rationale: L’adjectif désigne ici celui qui est affranchi de sa condition servile. « Libre » reste concis et préserve la formulation de l’hébreu.
- source_word: מֵעִמָּךְ
  choice: de chez toi
  rationale: Littéralement « d’avec toi ». « De chez toi » est naturel en français et évite d’ajouter explicitement « de ton service » ou « de ta maison ».
- source_word: לֹא
  choice: tu ne… pas
  rationale: Avec l’imparfait dans ce contexte juridique, la négation formule une interdiction. Le futur français maintient la force prescriptive du texte.
- source_word: רֵיקָם
  choice: les mains vides
  rationale: L’adverbe signifie « à vide, sans rien ». L’expression française idiomatique « les mains vides » convient au soutien matériel exigé lors de la libération.
