  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: fr
  text: Seulement, tu ne mangeras pas son sang ; tu le répandras sur le sol comme de l’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Seulement
  rationale: L’adverbe marque une restriction à la permission donnée dans le contexte précédent ; « Seulement » en conserve directement la force restrictive.
- source_word: אֶת דָּמוֹ
  choice: son sang
  rationale: Le suffixe renvoie à l’animal mentionné dans le contexte. « Son sang » est la tournure française naturelle et n’ajoute pas la notion interprétative de « sang vital ».
- source_word: לֹא תֹאכֵל
  choice: tu ne mangeras pas
  rationale: Le futur à valeur d’interdiction convient au registre juridique de l’instruction et reste naturel en français biblique moderne.
- source_word: עַל הָאָרֶץ
  choice: sur le sol
  rationale: Dans ce contexte concret, « le sol » désigne naturellement la terre sur laquelle le sang doit être versé, sans l’ambiguïté plus large de « la terre ».
- source_word: תִּשְׁפְּכֶנּוּ
  choice: tu le répandras
  rationale: Le verbe exprime l’action de verser ou répandre un liquide. « Répandre » convient à l’évacuation du sang et s’accorde naturellement avec la comparaison qui suit.
- source_word: כַּמָּיִם
  choice: comme de l’eau
  rationale: Cette formulation française rend directement et naturellement la comparaison hébraïque.
theological_decisions:
- issue: Traitement du sang dans la loi alimentaire
  choice: Formuler simplement l’interdiction de consommer le sang de l’animal et l’ordre de le répandre.
  alternative: Employer « sang vital » afin de mettre en avant le rapport entre le sang et la vie.
  rationale: Le verset énonce un commandement concret sans en donner ici la justification théologique. La traduction ne doit donc pas introduire une explication tirée d’autres passages.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse juridique hébraïque à Israël envisagé collectivement. La formulation conserve le parallélisme des deux propositions.
