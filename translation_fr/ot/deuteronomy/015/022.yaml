  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: fr
  text: Tu le mangeras dans tes villes[a]. La personne rituellement impure et la personne rituellement pure pourront toutes deux en manger[b], comme on mange de la gazelle et du cerf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans tes portes », expression hébraïque qui désigne les villes ou les communautés locales.
    reason: cultural_note
  - marker: b
    text: C’est-à-dire que les personnes rituellement impures comme les personnes rituellement pures peuvent toutes en manger.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Littéralement « dans tes portes »; en hébreu, les portes représentent par métonymie la ville ou la communauté locale. « Dans tes villes » transmet naturellement le sens en français moderne.
- source_word: תֹּאכֲלֶנּוּ
  choice: tu le mangeras
  rationale: La forme verbale à la deuxième personne du masculin singulier porte ici une valeur directive-permissive dans le contexte législatif; le pronom « le » renvoie à l’animal mentionné auparavant.
- source_word: הַטָּמֵא
  choice: la personne rituellement impure
  rationale: Le terme désigne ici un statut rituel, et non une faute morale. L’explicitation évite l’ambiguïté du simple adjectif substantivé « l’impur ».
- source_word: וְהַטָּהוֹר
  choice: la personne pure
  rationale: Le terme est l’opposé rituel de טָמֵא. Dans ce parallélisme, « pure » conserve la formulation concise tout en étant éclairé par « rituellement impure ».
- source_word: יַחְדָּו
  choice: comme
  rationale: Dans la construction « l’impur et le pur ensemble », le mot indique que les deux catégories sont également admises; la tournure française « X comme Y » exprime naturellement cette égalité.
- source_word: כַּצְּבִי
  choice: comme on mange de la gazelle
  rationale: צְבִי désigne couramment la gazelle. L’ajout idiomatique « on mange de » rend explicite que la comparaison porte sur la manière dont cette viande peut être consommée, non sur les personnes.
- source_word: וְכָאַיָּל
  choice: et du cerf
  rationale: אַיָּל désigne un cervidé, souvent le cerf mâle. « Cerf » est précis, courant et convient à l’association avec la gazelle.
theological_decisions:
- issue: Portée des catégories « impur » et « pur »
  choice: Les comprendre comme des statuts rituels de personnes autorisées à manger cette viande.
  alternative: Les rendre simplement par « l’impur et le pur », formulation susceptible d’être comprise moralement ou de désigner les animaux.
  rationale: Le contexte des lois alimentaires oppose des états de pureté rituelle et permet aux deux catégories de personnes de consommer cette viande non sacrificielle.
- issue: Force du verbe תֹּאכֲלֶנּוּ
  choice: Conserver le futur législatif français « tu le mangeras », compris comme une permission contextuelle.
  alternative: « Tu pourras le manger », qui explicite davantage la permission.
  rationale: Le futur préserve plus directement la forme juridique hébraïque, tandis que le contexte et la suite du verset montrent qu’il ne s’agit pas d’une obligation de consommer.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier suit l’adresse collective individualisée de l’hébreu. Les termes de pureté sont formulés de manière à exclure une lecture morale, et la comparaison finale est explicitée juste assez pour éviter que « comme la gazelle et le cerf » ne semble qualifier les personnes.
