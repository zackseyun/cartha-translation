base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: fr
  text: Tout mâle premier-né qui naîtra parmi ton gros bétail et ton petit bétail, tu le consacreras à Yahweh, ton Dieu. Tu ne mettras pas au travail le premier-né de tes bovins et tu ne tondras pas le premier-né de ton petit bétail.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַבְּכוֹר ... הַזָּכָר
  choice: Tout mâle premier-né
  rationale: כָּל devant un nom singulier a ici une valeur distributive. « Tout mâle premier-né » est naturel en français et rattache clairement הַזָּכָר à la prescription.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: qui naîtra
  rationale: Le niphal de ילד décrit l’animal qui vient à naître; le futur français convient à la portée prescriptive de la phrase.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: dans ton gros ou ton petit bétail
  rationale: בקר désigne les bovins ou le gros bétail, tandis que צאן désigne collectivement le petit bétail, notamment ovins et caprins. « ou » rend naturellement en français la distribution entre les deux catégories dans la proposition relative, sans changer la portée inclusive de l’hébreu ו.
- source_word: תַּקְדִּישׁ
  choice: tu le consacreras
  rationale: Le hiphil de קדש signifie mettre à part comme saint. « Consacrer » conserve la portée cultuelle; le pronom explicite est requis par le français.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: à Yahweh ton Dieu
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme nom propre et préserve la formulation d’alliance.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: Tu ne feras pas travailler le premier-né de tes bovins
  rationale: עבד avec ב interdit l’utilisation de l’animal pour le travail. La tournure causative française exprime clairement cet usage sans laisser entendre que le propriétaire travaillerait simplement à côté de lui.
- source_word: שׁוֹרֶךָ
  choice: tes bovins
  rationale: Le singulier collectif avec suffixe renvoie au cheptel bovin du propriétaire. Cette formulation évite l’expression peu naturelle « le premier-né de ton bœuf » et n’impose pas qu’un reproducteur soit un bœuf châtré.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: et tu ne tondras pas le premier-né de ton petit bétail
  rationale: גזז signifie tondre. « Petit bétail » maintient la portée collective de צאן, même si la tonte concerne concrètement surtout les moutons.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; la translittération « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature de la consécration du premier-né
  choice: consacrer
  alternative: mettre à part pour Yahweh
  rationale: Le verbe קדש porte une valeur cultuelle, mais le verset ne détaille pas ici toutes les modalités de cette consécration. « Consacrer » les conserve sans ajout interprétatif.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre l’interdiction du travail pour les bovins et celle de la tonte pour le petit bétail est conservé. Aucun marqueur de note n’est requis, car aucune note n’est ajoutée.
