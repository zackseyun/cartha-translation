revisions:
- from: Tout mâle premier-né qui naîtra dans ton gros ou ton petit bétail, tu le consacreras à Yahweh ton Dieu. Tu ne feras pas travailler le premier-né de tes bovins et tu ne tondras pas le premier-né de ton petit bétail.
  to: Tout mâle premier-né qui naîtra parmi ton gros bétail et ton petit bétail, tu le consacreras à Yahweh, ton Dieu. Tu ne mettras pas au travail le premier-né de tes bovins et tu ne tondras pas le premier-né de ton petit bétail.
  rationale: La révision remplace la coordination disjonctive par une coordination inclusive conforme à l’hébreu et ajuste légèrement la formulation de l’interdiction du travail pour un français moderne naturel. Le sens, le registre et l’absence de notes restent inchangés.
