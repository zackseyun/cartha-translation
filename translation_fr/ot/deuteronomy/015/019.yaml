review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : les mâles premiers-nés sont consacrés à Yahweh et ne doivent être ni employés au travail ni tondus. Toutefois, « ou » ne rend pas la coordination inclusive de וְ (« et ») entre gros et petit bétail.'
  naturalness: Le français est globalement clair et de registre approprié. « Parmi ton gros bétail et ton petit bétail » est plus idiomatique et plus exact que « dans ton gros ou ton petit bétail ». « Mettre au travail » rend naturellement l’interdiction d’utiliser l’animal pour le travail.
  terminology: « Consacrer », « Yahweh », « gros bétail » et « petit bétail » sont appropriés. « Bovins » demeure une désignation naturelle pour שׁוֹר dans cette formulation, sans imposer indûment « bœuf » au sens moderne d’animal castré.
  issues:
  - severity: medium
    issue: La conjonction « ou » dans « dans ton gros ou ton petit bétail »
    rationale: L’hébreu coordonne les deux catégories par וּ (« et »). Même si la portée distributive vise chaque animal de l’une ou l’autre catégorie, le français peut préserver cette inclusion sans ambiguïté par « parmi ton gros bétail et ton petit bétail ».
  revised_text: Tout mâle premier-né qui naîtra parmi ton gros bétail et ton petit bétail, tu le consacreras à Yahweh, ton Dieu. Tu ne mettras pas au travail le premier-né de tes bovins et tu ne tondras pas le premier-né de ton petit bétail.
