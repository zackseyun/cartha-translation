source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: fr
  text: Tu te souviendras que tu as été esclave au pays d’Égypte et que Yahweh, ton Dieu, t’a racheté[a]. C’est pourquoi je te donne aujourd’hui ce commandement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « libéré moyennant rançon ». Le verbe hébreu évoque le rachat ou la délivrance hors de la servitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Tu te souviendras
  rationale: Le parfait qal précédé de la conjonction a ici une valeur injonctive dans le discours légal; le futur français exprime naturellement cette obligation solennelle.
- source_word: עֶבֶד
  choice: esclave
  rationale: Dans le contexte de l’oppression en Égypte, le terme désigne une condition de servitude contrainte; « esclave » en restitue mieux la force que « serviteur ».
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: au pays d’Égypte
  rationale: Cette formulation conserve l’expression concrète et historique de l’hébreu tout en étant idiomatique en français biblique moderne.
- source_word: וַיִּפְדְּךָ
  choice: t’a racheté
  rationale: Le verbe פדה évoque la délivrance d’une servitude par rachat; « racheter » conserve à la fois le sens concret et la portée théologique.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est transcrit « Yahweh », et le suffixe de deuxième personne du singulier est rendu directement par « ton ».
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque clairement la conséquence entre la délivrance passée et le commandement présent.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: je te donne … ce commandement
  rationale: En français naturel, « donner un commandement » rend la force actuelle du participe מְצַוְּךָ sans la lourdeur de « je suis en train de te commander ».
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ce commandement
  rationale: דָּבָר signifie littéralement « parole » ou « chose », mais désigne ici l’instruction légale qui vient d’être formulée; « ce commandement » explicite correctement le référent contextuel.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français direct qui préserve l’immédiateté de l’exhortation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; l’Éternel
  rationale: Le texte hébreu porte explicitement le Tétragramme; sa transcription préserve le nom d’alliance sans le remplacer par un titre.
- issue: Statut social exprimé par עֶבֶד
  choice: esclave
  alternative: serviteur
  rationale: La mémoire de la servitude oppressive en Égypte fonde ici l’obligation envers les personnes asservies; « esclave » conserve cette force historique et morale.
- issue: Portée de פדה
  choice: racheté
  alternative: délivré; libéré moyennant rançon
  rationale: « Racheté » maintient le motif du rachat hors de la servitude sans préciser un paiement que le verset ne décrit pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël. La syntaxe a été légèrement restructurée en deux phrases afin d’éviter une coordination lourde, tout en conservant le lien explicite de cause à conséquence.
