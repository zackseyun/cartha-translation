  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: fr
  text: à la seule condition que tu écoutes attentivement la voix du SEIGNEUR, ton Dieu, en veillant à mettre en pratique l’ensemble de ce commandement que je t’ordonne aujourd’hui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: à condition seulement que
  rationale: Dans le contexte de la promesse conditionnelle commencée au verset précédent, cette expression introduit une condition restrictive plutôt qu’un simple souhait.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: tu écoutes attentivement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’appel à écouter; «attentivement» rend cette emphase en français naturel.
- source_word: בְּקוֹל
  choice: la voix
  rationale: La tournure hébraïque signifie littéralement écouter la voix de quelqu’un et implique ici l’obéissance, sans qu’il soit nécessaire d’effacer l’image source.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française reconnue pour représenter le tétragramme, avec les petites capitales signalées ici par les capitales.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: en veillant à mettre en pratique
  rationale: Le premier infinitif exprime le soin vigilant et le second l’accomplissement concret; cette formulation conserve les deux nuances sans lourdeur.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: tout ce commandement
  rationale: Le singulier collectif est maintenu, car il présente l’ensemble de l’instruction comme un commandement unifié.
- source_word: מְצַוְּךָ
  choice: je te donne
  rationale: Dans le contexte d’un commandement, «donner» est idiomatique en français; l’idée d’ordonner demeure explicite dans «commandement».
theological_decisions:
- issue: Rapport entre écoute et obéissance
  choice: Conserver «écouter la voix» puis expliciter l’action par «mettre en pratique».
  alternative: Traduire directement «obéir au SEIGNEUR».
  rationale: Le texte associe écoute attentive et exécution; conserver les deux éléments respecte son mouvement et évite de réduire l’image hébraïque.
- issue: Valeur conditionnelle de רַק אִם
  choice: «à condition seulement que»
  alternative: «si seulement»
  rationale: Le verset complète la promesse du contexte par une condition restrictive. «Si seulement» pourrait être compris avant tout comme l’expression d’un regret ou d’un souhait.
translation_notes:
  register: Français international moderne, clair et digne. Tutoiement conservé pour l’adresse au peuple envisagé collectivement au singulier. La syntaxe reste proche de l’hébreu tout en évitant une répétition artificielle telle que «écouter en écoutant».
