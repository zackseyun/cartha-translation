revisions:
- from: Que cela ne te paraisse pas pénible de le renvoyer libre de chez toi[a], car il t’a servi pendant six ans pour le double du salaire d’un ouvrier engagé. Yahweh ton Dieu te bénira dans tout ce que tu feras.
  to: Que tu le renvoies libre ne te paraisse pas pénible, car, pendant six ans, il t’a rendu un service équivalant au double du salaire d’un travailleur salarié, et Yahweh, ton Dieu, te bénira dans tout ce que tu feras[a].
  rationale: La révision élimine une lecture française selon laquelle un double salaire aurait été payé, tout en conservant la comparaison économique présente dans le texte hébreu. Elle évite également d’ajouter « chez toi » à la relation plus générale exprimée par מֵעִמָּךְ. La note est déplacée après la proposition finale afin que son ancre suive le segment qu’elle explique.
