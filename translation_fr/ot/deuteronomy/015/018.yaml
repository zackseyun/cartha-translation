base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: fr
  text: Que tu le renvoies libre ne te paraisse pas pénible, car, pendant six ans, il t’a rendu un service équivalant au double du salaire d’un travailleur salarié, et Yahweh, ton Dieu, te bénira dans tout ce que tu feras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « car il t’a servi six ans [pour] le double du salaire d’un travailleur salarié ». L’expression hébraïque condensée compare la valeur de ses six années de service à celle du travail rémunéré; elle peut aussi être rendue : « car il t’a servi six ans pour le double du salaire d’un travailleur salarié ».'
    reason: Le groupe מִשְׁנֶה שְׂכַר שָׂכִיר est syntaxiquement condensé. La note signale la formulation littérale et l’alternative sans présenter une analyse disputée comme certaine.
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: Que cela ne te paraisse pas pénible
  rationale: L’expression signifie littéralement que la libération ne doit pas être « dure à tes yeux », c’est-à-dire ressentie comme pénible ou regrettable. La formulation française conserve ce point de vue évaluatif sans calque maladroit.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: de le renvoyer libre de chez toi
  rationale: Le syntagme exprime la circonstance de la libération. « Libre » garde la portée juridique de חָפְשִׁי, tandis que « de chez toi » rend naturellement la relation spatiale et sociale de מֵעִמָּךְ sans l’expliciter excessivement.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: pour le double du salaire d’un ouvrier engagé
  rationale: מִשְׁנֶה indique une quantité double et שְׂכַר שָׂכִיר le salaire d’un travailleur engagé. La formulation maintient la comparaison économique, tout en signalant en note l’autre manière possible de rattacher cette valeur au service accompli.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: il t’a servi pendant six ans
  rationale: La forme est verbale et met l’accent sur le service rendu. Le statut servile est déjà établi par le contexte légal du passage.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu te bénira
  rationale: Dans ce contexte, la forme verbale exprime une promesse future. Le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: dans tout ce que tu feras
  rationale: Cette traduction naturelle conserve la portée générale de l’expression, qui englobe toutes les activités du destinataire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement plutôt que de le remplacer par un titre.
- issue: Mise au premier plan du statut servile dans עֲבָדְךָ
  choice: il t’a servi
  alternative: ton esclave t’a servi
  rationale: La forme hébraïque est verbale et souligne ici la durée et la valeur du service. Le contexte immédiat identifie déjà la personne comme un serviteur lié; l’ajout explicite d’« esclave » dans cette proposition alourdirait et interpréterait davantage le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement singulier conservé pour correspondre à l’adresse individuelle de l’hébreu. La phrase reste proche de la structure source tout en évitant les calques peu naturels.
