    issue: Ambiguïté de « ce qui est à toi chez ton frère »
    rationale: Cette expression peut désigner un objet appartenant au créancier et détenu physiquement par son frère. Dans le contexte de dette de Deutéronome 15 et de l’idiome hébreu, il s’agit de ce que le frère doit au créancier, c’est-à-dire de la créance à ne plus exiger.
