    issue: Littéralité imprécise dans la note c
    rationale: L’image de תַּשְׁמֵט יָדֶךָ est plus exactement rendue littéralement par « ta main laissera tomber » (ou « lâchera »). « Relâchera » est moins naturel et moins proche de l’image verbale française.
