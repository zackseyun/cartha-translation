  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: fr
  text: Tu pourras exiger d’un étranger ce qu’il te doit[a] ; mais tu renonceras[c] à ce que ton frère te doit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « réclamer à un étranger le remboursement ». Le verbe hébreu désigne ici le fait de presser un débiteur ou d’exiger son paiement.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « ton frère » désigne un autre membre de la communauté d’Israël.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « ta main laissera tomber ». Dans ce contexte, cette image signifie que le créancier renonce à faire valoir sa créance lors de l’année de remise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: un étranger
  rationale: Dans ce contexte juridique, נָכְרִי désigne une personne étrangère à la communauté d’Israël. L’article hébreu a ici une valeur générique, naturellement rendue en français par l’indéfini.
- source_word: תִּגֹּשׂ
  choice: tu pourras exiger … ce qu’il te doit
  rationale: En contexte de dette, נגשׂ signifie presser le débiteur ou exiger le remboursement. Cette formulation française exprime clairement l’action juridique sans employer le plus soutenu « recouvrer ».
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: ce qui est à toi
  rationale: La formulation conserve le caractère général de l’hébreu, qui ne nomme pas explicitement la dette ou la créance.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le terme familial concret est conservé. Dans la législation du Deutéronome, il désigne ici un autre membre de la communauté d’Israël, précision donnée en note.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: tu abandonneras tes droits
  rationale: L’expression idiomatique, littéralement construite avec « ta main », signifie que le créancier relâche ou remet sa créance. La traduction rend l’effet juridique en français naturel, tandis que la note préserve l’image hébraïque.
theological_decisions:
- issue: Portée de « ton frère » dans la législation deutéronomique
  choice: Conserver « ton frère » dans le texte principal
  alternative: ton compatriote israélite
  rationale: Le choix préserve la métaphore familiale et communautaire du texte source sans remplacer celle-ci par une explicitation interprétative. La note indique sa portée juridique probable.
- issue: Nature de la remise prescrite
  choice: Rendre l’idiome par l’abandon des droits du créancier
  alternative: ta main relâchera
  rationale: Le contexte de l’année de remise indique l’abandon de la revendication liée à la dette. La traduction ne tranche pas davantage la question de savoir si la dette est définitivement annulée ou seulement non exigible pendant la période concernée.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. La phrase conserve « étranger » et « frère », qui structurent l’opposition juridique du verset, tout en explicitant sobrement l’idiome de la main.
