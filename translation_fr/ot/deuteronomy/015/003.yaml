revisions:
- from: Tu pourras exiger d’un étranger ce qu’il te doit[a] ; mais tu abandonneras tes droits[c] sur ce qui est à toi chez ton frère[b].
  to: Tu pourras exiger d’un étranger ce qu’il te doit[a] ; mais tu renonceras[c] à ce que ton frère te doit[b].
  rationale: La révision remplace une expression française susceptible de suggérer un dépôt de biens par une formulation qui identifie clairement l’objet de la remise comme ce qui est dû par le frère. Elle maintient la distinction juridique entre l’étranger et le frère, conserve le tutoiement et signale en note l’image hébraïque ainsi que son sens dans le contexte.
