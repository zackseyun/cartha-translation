revisions:
- from: La ville la plus proche de l’homme tué[a] étant ainsi déterminée, les anciens de cette ville prendront dans le gros bétail une jeune vache[b] qui n’a jamais servi au travail et qui n’a jamais tiré sous le joug[c].
  to: Il arrivera que les anciens de la ville la plus proche de l’homme tué prennent dans le gros bétail une génisse qui n’a pas servi au travail et qui n’a pas tiré au joug.
  rationale: La formule introductive est rendue sans ajouter que l’identification de la ville a déjà été effectuée. « Génisse » rétablit la précision de עֶגְלַת בָּקָר. Les critères de non-usage pour le travail et de non-traction au joug sont conservés. Les appels de notes sont à placer respectivement après « homme tué », « génisse » et « joug » dans le texte composé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:01:44Z'
review_pass:
  verdict: revise
  source_fidelity: La restructuration « étant ainsi déterminée » interprète de façon trop explicite וְהָיָה (« et il arrivera/il adviendra que ») et introduit l’idée d’une détermination déjà accomplie. Le reste rend correctement la ville la plus proche de la personne tuée, les anciens, et les deux critères relatifs à la génisse.
  naturalness: Le français est globalement fluide, mais « une jeune vache » est moins précis que « une génisse » et « tirer sous le joug » est compréhensible, quoique « tirer au joug » soit plus idiomatique pour l’usage de traction. Une syntaxe directe conserve mieux la formule juridique sans lourdeur.
  terminology: « Anciens » convient pour זִקְנֵי. « Génisse » est le terme français exact pour עֶגְלַת בָּקָר; l’explication « jeune bovin femelle » dans la note est appropriée. « Gros bétail » rend correctement בָּקָר.
  issues:
  - severity: medium
    issue: « étant ainsi déterminée » ajoute une étape explicitement accomplie.
    rationale: וְהָיָה introduit la conséquence procédurale; le texte ne dit pas que la ville a été « déterminée », même si cela découle du contexte précédent. Une formulation telle que « Lorsqu’on aura établi quelle ville est la plus proche » explicite moins indûment le mécanisme, mais « Il arrivera que la ville... » reste plus proche.
  - severity: medium
    issue: « jeune vache » est imprécis pour le terme zoologique et juridique de l’animal requis.
    rationale: עֶגְלָה désigne une jeune femelle bovine; « génisse » est le terme usuel précis en français biblique moderne et évite de suggérer une vache adulte.
  revised_text: Il arrivera que les anciens de la ville la plus proche de l’homme tué prennent dans le gros bétail une génisse qui n’a pas servi au travail et qui n’a pas tiré au joug.
  revised_footnotes:
  - marker: a
    text: Ou « de la personne tuée » ou « du cadavre ». Le terme hébreu désigne une personne qui a été tuée.
    reason: lexical_alternative
  - marker: b
    text: Ou « une jeune vache ». Il s’agit d’un jeune bovin femelle.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, « qui n’a pas tiré sous un joug » : elle n’a encore jamais été employée comme animal de trait.'
    reason: lexical_alternative
  revision_rationale: La formule introductive est rendue sans ajouter que l’identification de la ville a déjà été effectuée. « Génisse » rétablit la précision de עֶגְלַת בָּקָר. Les critères de non-usage pour le travail et de non-traction au joug sont conservés. Les appels de notes sont à placer respectivement après « homme tué », « génisse » et « joug » dans le texte composé.
