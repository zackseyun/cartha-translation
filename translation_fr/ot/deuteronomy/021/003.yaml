base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: fr
  text: Il arrivera que les anciens de la ville la plus proche de l’homme tué prennent dans le gros bétail une génisse qui n’a pas servi au travail et qui n’a pas tiré au joug.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: étant ainsi déterminée
  rationale: Dans la suite de la procédure juridique commencée au verset précédent, la formule introduit naturellement l’étape qui découle de la mesure des distances. Cette formulation évite un calque peu idiomatique tout en conservant le lien logique.
- source_word: הָעִיר הַקְּרֹבָה אֶל הֶחָלָל
  choice: la ville la plus proche de l’homme tué
  rationale: Le contexte donne à l’adjectif le sens de « la plus proche ». חָלָל désigne ici la personne qui a été tuée, plutôt qu’un cadavre envisagé de manière impersonnelle.
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: les anciens de cette ville prendront
  rationale: Rend directement l’instruction légale confiée aux responsables reconnus de la ville.
- source_word: עֶגְלַת בָּקָר
  choice: dans le gros bétail une jeune vache
  rationale: עֶגְלָה désigne un jeune bovin femelle et בָּקָר précise le cheptel bovin. « Jeune vache » est plus immédiatement compréhensible que le terme technique « génisse ».
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: qui n’a jamais servi au travail
  rationale: Le passif exprime un travail accompli au moyen de l’animal. « Servi au travail » restitue ce sens instrumental en français naturel; « jamais » explicite la négation d’un usage antérieur impliquée par le contexte.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: et qui n’a jamais tiré sous le joug
  rationale: משך signifie « tirer ». « Sous le joug » est l’expression française naturelle pour un animal employé à la traction, sans remplacer le verbe précis par le plus général « porter ».
