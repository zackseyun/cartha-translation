  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: fr
  text: Le jour où il donnera à ses fils, en héritage, les biens qui lui appartiennent, il ne pourra pas traiter comme premier-né le fils de la femme qu’il aime, au détriment du fils de la femme qu’il déteste[a], alors que celui-ci est le premier-né.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la femme qu’il aime moins » ou « de la femme moins aimée ». L’hébreu oppose littéralement la femme « aimée » à la femme « détestée », mais, dans ce contexte familial et juridique, ce dernier terme peut désigner celle qui est comparativement moins favorisée plutôt qu’activement haïe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Le jour où
  rationale: Cette tournure naturelle en français conserve le cadre temporel et juridique de l’hébreu sans reproduire lourdement la formule introductive.
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: il transmettra à ses fils, en héritage, les biens qui lui appartiennent
  rationale: Le hiphil de נחל exprime le fait de faire hériter ou de transmettre un héritage. Cette formulation française rend à la fois l’action envers les fils et l’objet explicite, « ce qui lui appartiendra », sans ambiguïté grammaticale.
- source_word: לֹא יוּכַל
  choice: il ne pourra pas
  rationale: Dans ce contexte légal, la formule indique l’absence de droit ou la prohibition. Le futur français convient au cas juridique introduit par « Le jour où ».
- source_word: לְבַכֵּר
  choice: traiter comme premier-né
  rationale: Le piel signifie ici accorder à quelqu’un le statut ou les prérogatives du premier-né. La formulation reste proche du texte sans expliciter excessivement les droits évoqués au verset suivant.
- source_word: בֶּן הָאֲהוּבָה
  choice: le fils de la femme qu’il aime
  rationale: Le participe passif désigne littéralement « l’aimée ». Le mot « femme » est fourni par le contexte immédiat et la relative donne un français courant et clair.
- source_word: עַל פְּנֵי
  choice: au détriment de
  rationale: Dans cette comparaison juridique, l’expression marque une préférence qui lèse le premier-né véritable. « Au détriment de » exprime naturellement cette préséance indue en français.
- source_word: בֶן הַשְּׂנוּאָה
  choice: le fils de la femme qu’il déteste
  rationale: Le participe de שׂנא porte littéralement le sens fort de « détestée/haïe ». La relative est plus naturelle en français moderne, tandis qu’une note signale la possible valeur comparative dans ce contexte familial.
- source_word: הַבְּכֹר
  choice: alors que celui-ci est le premier-né
  rationale: Cette formulation rattache sans équivoque le dernier terme au fils de la femme détestée et fait ressortir le contraste juridique présent dans l’hébreu.
theological_decisions:
- issue: Force du contraste affectif entre les deux femmes
  choice: Conserver dans le texte « la femme qu’il aime » et « la femme qu’il déteste »
  alternative: « la femme qu’il aime moins » ou « la femme moins aimée »
  rationale: L’hébreu emploie l’opposition forte entre « aimée » et « détestée ». Le texte principal la conserve afin de ne pas atténuer arbitrairement le langage source, tandis que la note préserve la possibilité d’un contraste relatif de préférence dans ce cadre familial et juridique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère juridique du passage tout en évitant les calques peu naturels. Le contraste affectif fort de l’hébreu est maintenu dans le texte principal et nuancé en note.
