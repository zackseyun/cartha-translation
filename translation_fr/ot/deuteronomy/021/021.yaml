  - severity: low
    issue: « l’apprendra » pour יִשְׁמְעוּ
    rationale: Cette formulation interprète correctement le contexte, mais « en entendra parler » conserve plus visiblement le verbe hébreu « entendre » et reste naturel en français.
  - severity: low
    issue: « du milieu de toi »
    rationale: La tournure est intelligible et traditionnelle, mais « de ton sein » est plus fluide dans un registre soutenu moderne tout en préservant l’image hébraïque du milieu de la communauté.
