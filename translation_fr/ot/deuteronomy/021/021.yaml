revisions:
- from: Alors tous les hommes de sa ville le lapideront à coups de pierres[a], et il mourra. Tu extirperas ainsi le mal du milieu de toi. Tout Israël l’apprendra et aura peur.
  to: Alors tous les hommes de sa ville le lapideront à coups de pierres[a], et il mourra. Tu extirperas le mal de ton sein. Tout Israël en entendra parler et craindra.
  rationale: Révision légère pour supprimer une explicitation non indispensable, améliorer la fluidité du français et conserver plus directement les verbes hébreux « entendre » et « craindre ». Le sens juridique, le masculin explicite de « hommes » et la formule deutéronomique d’élimination du mal sont maintenus.
