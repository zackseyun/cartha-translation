  text: וּ֠/רְגָמֻ/הוּ כָּל אַנְשֵׁ֨י עִיר֤/וֹ בָֽ/אֲבָנִים֙ וָ/מֵ֔ת וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּ֑/ךָ וְ/כָל יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְ/יִרָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: fr
  text: Alors tous les hommes de sa ville le lapideront à coups de pierres[a], et il mourra. Tu extirperas le mal de ton sein. Tout Israël en entendra parler et craindra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le lapideront avec des pierres ».'
    reason: La note signale la répétition concrète de l’hébreu, tandis que le texte principal emploie une tournure française naturelle.
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  choice: le lapideront
  rationale: Dans ce contexte judiciaire, רגם désigne précisément la mise à mort par lapidation. Le futur français exprime ici la prescription légale.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: tous les hommes de sa ville
  rationale: אַנְשֵׁי signifie littéralement « hommes de ». Le masculin explicite est conservé sans en tirer de conclusion plus générale sur les rôles sociaux.
- source_word: בָאֲבָנִים
  choice: à coups de pierres
  rationale: Cette expression naturelle en français conserve le moyen concret indiqué par le syntagme hébreu.
- source_word: וָמֵת
  choice: et il mourra
  rationale: La proposition énonce le résultat de la lapidation sans le transformer explicitement en proposition de but.
- source_word: וּבִעַרְתָּ
  choice: tu extirperas
  rationale: Dans la formule juridique récurrente du Deutéronome, בער signifie éliminer radicalement le mal de la communauté, non le brûler littéralement.
- source_word: הָרָע
  choice: le mal
  rationale: Le substantif abstrait singulier désigne la catégorie morale et juridique du mal dans la formule deutéronomique.
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de toi
  rationale: Cette formulation conserve le singulier collectif adressé à Israël et l’image spatiale de קֶרֶב, malgré son caractère légèrement marqué en français.
- source_word: יִשְׁמְעוּ
  choice: l’apprendra
  rationale: En contexte, « entendre » signifie apprendre la nouvelle de ce jugement. Le pronom explicite naturellement en français l’objet implicite sans ajouter un contenu étranger.
- source_word: וְיִרָאוּ
  choice: et aura peur
  rationale: ירא exprime ici la peur produite par l’exemple judiciaire; « avoir peur » est direct, actuel et ne surinterprète pas cette réaction comme une révérence religieuse.
theological_decisions:
- issue: Terme civique masculin dans un contexte juridique
  choice: tous les hommes de sa ville
  alternative: tous les habitants de sa ville
  rationale: L’hébreu emploie explicitement le substantif masculin « hommes ». La traduction le maintient sans affirmer au-delà du texte une doctrine relative aux rôles de genre.
- issue: Formule deutéronomique d’élimination du mal
  choice: tu extirperas ainsi le mal du milieu de toi
  alternative: tu ôteras le mal du milieu de toi
  rationale: « Extirper » rend la force de la formule judiciaire récurrente tout en évitant le sens littéral inadéquat de « brûler ». « Ainsi » explicite le rapport consécutif porté par la coordination dans ce contexte.
- issue: Nature de la crainte finale
  choice: aura peur
  alternative: craindra
  rationale: Le texte présente l’effet dissuasif du jugement. La formulation choisie préserve cette crainte sans préciser indûment qu’il s’agit de crainte révérencielle ou seulement de terreur.
translation_notes:
  register: Français international moderne, digne et juridique. Le singulier collectif de l’adresse à Israël est préservé. Le futur sert de formulation prescriptive dans ce corpus légal; la dernière phrase reste sobre et dissuasive.
