  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: fr
  text: Son cadavre ne passera pas la nuit sur l’arbre. Tu l’enterreras sans faute le jour même, car celui qui est pendu est sous la malédiction de Dieu[a], et tu ne rendras pas impur le pays que Yahweh, ton Dieu, te donne en héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui est pendu est maudit par Dieu » ; autre possibilité : « la pendaison est un affront à Dieu ». L’expression hébraïque est concise et peut être comprise de plusieurs façons.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: ne passera pas la nuit
  rationale: Le verbe לון exprime ici le fait de rester pendant la nuit. Cette formulation française est naturelle et conserve la portée temporelle de l’interdiction.
- source_word: נִבְלָתוֹ
  choice: son cadavre
  rationale: נְבֵלָה désigne le corps mort; « cadavre » est précis et direct.
- source_word: עַל הָעֵץ
  choice: sur l’arbre
  rationale: עֵץ signifie couramment « arbre » ou « bois ». « Sur l’arbre » conserve l’image hébraïque et ses échos bibliques ultérieurs sans préciser indûment la structure utilisée.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: tu l’enterreras impérativement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce le commandement. « Impérativement » restitue cette insistance dans un français actuel.
- source_word: בַּיּוֹם הַהוּא
  choice: le jour même
  rationale: Cette expression rend naturellement l’exigence d’un ensevelissement avant la nuit.
- source_word: קִלְלַת אֱלֹהִים
  choice: sous la malédiction de Dieu
  rationale: La construction hébraïque est concise et ambiguë. Dans le corps du texte, cette formulation exprime le fait que le pendu porte le signe de la malédiction divine, tout en laissant les autres analyses en note.
- source_word: תָּלוּי
  choice: celui qui est pendu
  rationale: Le participe passif désigne la personne pendue ou suspendue. Cette expression reste proche de l’hébreu sans supposer que la pendaison est le mode d’exécution.
- source_word: תְטַמֵּא
  choice: rendre impur
  rationale: טמא comporte ici des connotations de souillure rituelle et morale. « Rendre impur » les conserve mieux que le seul sens écologique de « polluer ».
- source_word: אַדְמָתְךָ
  choice: le pays
  rationale: Dans le contexte du don territorial et de l’héritage, אֲדָמָה désigne le pays plutôt que simplement le sol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: נַחֲלָה
  choice: en héritage
  rationale: נַחֲלָה désigne un bien reçu en possession héréditaire; cette tournure est idiomatique en français et conserve la portée du don de la terre.
theological_decisions:
- issue: Sens de כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: celui qui est pendu est sous la malédiction de Dieu
  alternative: « celui qui est pendu est maudit par Dieu » ou « la pendaison est un affront à Dieu »
  rationale: La syntaxe hébraïque condensée permet plusieurs analyses. Le texte principal retient le sens contextuellement cohérent selon lequel le pendu porte la marque d’une malédiction divine; la note préserve les autres lectures sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques adressées à Israël. Les deux phrases évitent une coordination trop lourde, tandis que « Ainsi » rend explicite le lien pratique avec l’interdiction de rendre le pays impur.
