source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: fr
  text: « Fais expiation pour ton peuple Israël, que tu as racheté, ô Yahvé ; ne laisse pas la culpabilité due au sang innocent peser sur ton peuple Israël. Ainsi, l’expiation sera faite pour eux concernant ce sang.[a] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et le sang sera expié pour eux ». Dans ce contexte juridique, « le sang » peut désigner la responsabilité entraînée par le sang versé.'
    reason: La note conserve la formulation inhabituelle et l’ambiguïté contrôlée de l’hébreu, tout en expliquant son emploi juridique.
lexical_decisions:
- source_word: כַּפֵּר
  choice: Fais l’expiation
  rationale: L’impératif de כפר appartient ici au domaine rituel et juridique. « Fais l’expiation » conserve ce sens mieux que « couvre » et évite de réduire le terme à un simple pardon.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: pour ton peuple Israël
  rationale: La préposition ל indique le bénéficiaire de l’expiation; cette formulation est naturelle en français et conserve la relation d’alliance.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: que tu as racheté
  rationale: פדה évoque le rachat ou la délivrance hors d’une servitude. « Racheté » maintient le vocabulaire biblique du rachat tout en restant compréhensible.
- source_word: יְהוָה
  choice: ô Yahvé
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre; « ô » marque clairement l’adresse directe dans cette prière.
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב עַמְּךָ יִשְׂרָאֵל
  choice: et ne laisse pas la responsabilité du sang innocent peser sur ton peuple Israël
  rationale: L’expression littérale « ne mets pas de sang innocent au milieu de » désigne ici la responsabilité collective découlant d’un meurtre non élucidé. La formulation retenue explicite sobrement cette portée juridique sans assimiler le sang à une substance physique déposée parmi le peuple.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: Ainsi, l’expiation sera faite pour eux concernant ce sang
  rationale: Le niphal de כפר est passif ou résultatif. Cette traduction conserve le lien lexical avec le premier כפר ainsi que la mention explicite du sang, sans trancher davantage que le contexte.
theological_decisions:
- issue: Rendu du tétragramme YHWH
  choice: Yahvé
  alternative: le Seigneur
  rationale: La translittération conserve le nom propre divin dans l’adresse directe, au lieu de lui substituer un titre.
- issue: Portée juridique de דָּם נָקִי
  choice: la responsabilité du sang innocent
  alternative: le sang innocent
  rationale: Le contexte traite de la responsabilité communautaire liée à un homicide non élucidé. Le mot « responsabilité » rend cette valeur juridique, tandis que « sang innocent » préserve l’expression hébraïque.
- issue: Interprétation de la proposition finale הַדָּם
  choice: l’expiation sera faite pour eux concernant ce sang
  alternative: ce sang sera expié pour eux
  rationale: La formulation choisie conserve le passif de כפר et le référent « ce sang », tout en évitant de suggérer en français que le sang matériel lui-même reçoit l’expiation. La note signale la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel « expiation » est conservé parce qu’il structure les deux membres du verset; la syntaxe environnante en facilite la compréhension. Le marqueur [a] est placé après la proposition qu’il explique.
