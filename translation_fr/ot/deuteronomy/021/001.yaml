id: DEU.21.1
reference: Deuteronomy 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: fr
  text: Si l’on trouve, dans le pays que Yahweh ton Dieu te donne pour que tu en prennes possession, un homme tué[a], étendu en pleine campagne, sans que l’on sache qui l’a frappé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne tuée ». L’hébreu est grammaticalement au masculin singulier (« un homme tué »), bien que le principe de cette loi puisse s’appliquer de manière générale à une victime d’homicide dont le meurtrier est inconnu.
    reason: alternative lexicale et précision sur le genre grammatical
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit la condition d’une loi casuistique; « Si » est la formulation juridique française la plus directe.
- source_word: יִמָּצֵא
  choice: l’on trouve
  rationale: Rend naturellement en français le niphal de מצא, de sens passif, tout en évitant la tournure plus lourde « est trouvé ».
- source_word: חָלָל
  choice: un homme tué
  rationale: Désigne ici une victime de mort violente, et non simplement un cadavre. Le masculin singulier de l’hébreu est conservé dans le texte.
- source_word: בָּאֲדָמָה
  choice: dans le pays
  rationale: Le contexte de la prise de possession indique le territoire donné à Israël plutôt que le sol matériel.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: que Yahweh ton Dieu te donne pour que tu en prennes possession
  rationale: Conserve le présent du participe « donne » et exprime clairement la finalité de לְרִשְׁתָּהּ dans un français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme.
- source_word: נֹפֵל
  choice: étendu
  rationale: Décrit l’état du corps gisant sans suggérer nécessairement le mouvement d’une chute récente.
- source_word: בַּשָּׂדֶה
  choice: en pleine campagne
  rationale: Expression française naturelle pour un corps découvert hors d’un lieu habité; elle rend ici le cadre ouvert de שָׂדֶה.
- source_word: לֹא נוֹדַע
  choice: sans que l’on sache
  rationale: Rend avec fluidité la construction impersonnelle négative et rattache clairement cette circonstance à la découverte.
- source_word: מִי הִכָּהוּ
  choice: qui l’a frappé
  rationale: Préserve le sens lexical de נכה, « frapper », tandis que חָלָל établit déjà que le coup a entraîné la mort.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; « Yahweh » le représente comme nom propre sans le remplacer par un titre.
- issue: Référence masculine de חָלָל
  choice: un homme tué
  alternative: une personne tuée
  rationale: Le substantif hébreu est au masculin singulier. Le texte principal conserve cette forme, tandis que la note signale la portée générale possible de la règle.
- issue: Agent inconnu de la mort
  choice: qui l’a frappé
  alternative: qui l’a tué
  rationale: La formulation garde la distinction entre חָלָל, qui indique la victime d’une mort violente, et נכה, qui signifie littéralement frapper, sans nier que le contexte concerne un homicide.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle du texte juridique et reste ouverte, puisque le verset se poursuit. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme collectivité.
