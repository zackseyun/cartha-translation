  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: fr
  text: Si un homme est coupable d’une faute passible de mort[a], s’il est mis à mort, tu le suspendras à un arbre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « méritant la mort » ou « sous le coup d’une sentence de mort ». L’hébreu dit littéralement « une faute, un jugement de mort ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à un poteau ». L’hébreu dit littéralement « à un arbre »; le mot peut aussi désigner du bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Si
  rationale: Introduit naturellement en français un cas juridique conditionnel. La conjonction hébraïque de liaison n’a pas besoin d’être rendue séparément au début de ce verset.
- source_word: יִהְיֶה בְ/אִישׁ חֵטְא
  choice: un homme a commis un péché
  rationale: Rend en français naturel l’idiome existentiel hébreu, littéralement « il y a en un homme un péché », tout en conservant le sujet masculin אִישׁ et la portée morale et juridique de חֵטְא.
- source_word: מִשְׁפַּט מָוֶת
  choice: passible de mort
  rationale: Expression juridique française claire indiquant qu’il s’agit d’un péché entraînant la peine capitale, sans réduire nécessairement la formule hébraïque à la seule sentence déjà prononcée.
- source_word: וְ/הוּמָת
  choice: qu’il est mis à mort
  rationale: Conserve la valeur passive-causative du hophal de מות et le registre judiciaire du contexte.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: et que tu le suspends
  rationale: תלה signifie suspendre ou pendre. « Suspendre » évite de laisser entendre que la pendaison est nécessairement le moyen d’exécution, puisque l’homme est déjà dit mis à mort.
- source_word: עַל עֵץ
  choice: à un arbre
  rationale: Rend directement le sens ordinaire de עֵץ et préserve la formulation biblique ainsi que ses échos ultérieurs, sans préciser indûment la forme du support.
theological_decisions:
- issue: Sujet masculin du cas juridique
  choice: un homme
  alternative: une personne; quelqu’un
  rationale: Le texte hébreu emploie אִישׁ, masculin singulier. Le français conserve cette donnée plutôt que de neutraliser le sujet.
- issue: Rapport entre la mise à mort et la suspension
  choice: mis à mort, puis suspendu
  alternative: exécuté par pendaison
  rationale: La succession des verbes indique que l’homme est mis à mort puis suspendu. La traduction évite donc de présenter la suspension comme le moyen certain de l’exécution.
- issue: Nature du support désigné par עֵץ
  choice: un arbre
  alternative: un poteau; du bois
  rationale: « Arbre » est le rendu le plus direct et laisse ouverte la configuration matérielle précise du support, tout en conservant la portée intertextuelle de l’expression.
translation_notes:
  register: Français international moderne, sobre et digne, avec une syntaxe juridique conditionnelle. « Passible de mort » garde un registre formel mais courant. « Suspendre » est retenu plutôt que « pendre » afin de ne pas suggérer à tort que la suspension constitue le mode d’exécution.
