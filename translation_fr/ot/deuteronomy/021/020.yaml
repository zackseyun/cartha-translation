source:
  edition: WLC
  text: וְ/אָמְר֞וּ אֶל זִקְנֵ֣י עִיר֗/וֹ בְּנֵ֤/נוּ זֶה֙ סוֹרֵ֣ר וּ/מֹרֶ֔ה אֵינֶ֥/נּוּ שֹׁמֵ֖עַ בְּ/קֹלֵ֑/נוּ זוֹלֵ֖ל וְ/סֹבֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: fr
  text: 'Alors ils diront aux anciens de sa ville : « Notre fils que voici est obstiné et rebelle ; il ne nous écoute pas[a] ; c’est un glouton et un ivrogne. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’écoute pas notre voix » ; dans cet idiome hébreu, écouter implique aussi tenir compte de ce qui est dit et obéir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Alors ils diront
  rationale: La forme poursuit la procédure juridique exposée dans le contexte. « Alors » rend naturellement l’enchaînement, et le futur conserve la valeur prescriptive du cas de loi.
- source_word: זִקְנֵי עִירוֹ
  choice: aux anciens de sa ville
  rationale: « Anciens » désigne les responsables locaux, tandis que « ville » convient à l’emploi administratif de עִיר sans exclure une localité de taille modeste.
- source_word: בְּנֵנוּ זֶה
  choice: Notre fils que voici
  rationale: Cette formulation française naturelle conserve l’identification emphatique exprimée par le démonstratif hébreu.
- source_word: סוֹרֵר וּמֹרֶה
  choice: obstiné et rebelle
  rationale: Les deux participes décrivent une résistance persistante puis une rébellion active. Le binôme conserve leur distinction et la force de l’accusation.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: il ne nous écoute pas
  rationale: En français, « écouter quelqu’un » peut signifier tenir compte de ses paroles et lui obéir. Cette tournure reste proche de l’image hébraïque tout en étant plus naturelle que « écouter notre voix ».
- source_word: זוֹלֵל
  choice: un glouton
  rationale: Associé à סֹבֵא, le mot désigne ici quelqu’un qui se livre habituellement aux excès de nourriture plutôt qu’un simple dissipateur.
- source_word: וְסֹבֵא
  choice: un ivrogne
  rationale: Le participe caractérise une personne adonnée à la boisson ; « ivrogne » exprime clairement cette disposition habituelle et forme le binôme traditionnel avec « glouton ».
