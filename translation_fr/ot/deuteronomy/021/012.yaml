  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: fr
  text: Puis tu la feras entrer chez toi, et elle se rasera la tête et se coupera les ongles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et laissera pousser ses ongles ». L’hébreu dit littéralement : « et elle fera ses ongles » ; le sens de cette expression est débattu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: Puis tu la feras entrer
  rationale: Le hifil de בוא exprime ici l’action de faire entrer, et le waw inscrit cette prescription dans la suite des actions exigées. « Puis » rend naturellement cette progression en français.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: chez toi
  rationale: L’expression désigne l’intérieur de la maison du destinataire. Dans ce contexte, « chez toi » est une formulation française naturelle qui conserve l’idée d’entrée dans son foyer sans calquer lourdement « au milieu de ta maison ».
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: et elle se rasera la tête
  rationale: גלח signifie couramment « raser ». La tournure pronominale « se raser la tête » est idiomatique en français et n’ajoute pas l’idée non exprimée de rasage intégral.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: et se coupera les ongles
  rationale: Littéralement, l’hébreu dit qu’elle « fera/s’occupera de ses ongles ». « Se couper les ongles » donne le sens traditionnel d’entretien ou de taille dans un français clair, tout en signalant en note l’autre interprétation importante.
theological_decisions:
- issue: Ambiguïté de וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: Elle se coupe les ongles.
  alternative: Elle laisse pousser ses ongles.
  rationale: L’expression hébraïque, littéralement « elle fera ses ongles », est idiomatique et son sens précis est débattu. Le texte principal retient une formulation naturelle correspondant à l’interprétation de la taille des ongles, tandis que la note préserve explicitement l’autre lecture ancienne et plausible.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement suit l’adresse légale au singulier de l’hébreu. « Chez toi » évite un calque peu naturel de תּוֹךְ tout en exprimant clairement l’entrée dans la maison. La note conserve l’ambiguïté réelle concernant les ongles.
