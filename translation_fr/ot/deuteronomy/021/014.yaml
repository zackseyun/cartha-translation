  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: fr
  text: Mais, s’il arrive qu’elle ne te plaise pas, tu la laisseras partir libre[a]. Tu ne la vendras en aucun cas pour de l’argent et tu ne la traiteras pas comme une marchandise[b], puisque tu l’as humiliée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu la renverras pour elle-même » ; autrement dit, tu la laisseras disposer librement de sa personne.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « tu ne l’exploiteras pas à ton profit ». Le verbe hébreu est rare et semble désigner ici le fait de traiter quelqu’un comme un objet dont on tire un avantage économique.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « puisque tu lui as fait violence ». Le verbe hébreu peut évoquer l’affliction, l’humiliation ou une violence sexuelle, selon le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Mais s’il arrive que
  rationale: Cette tournure introduit naturellement en français l’éventualité qui contraste avec la situation précédente, tout en rendant l’idiome hébreu וְהָיָה.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: tu ne trouves pas ton plaisir en elle
  rationale: חפץ exprime ici le plaisir, l’attrait ou le désir. Cette formulation conserve la dimension affective sans ajouter explicitement « ne… plus », absent de l’hébreu.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: tu la laisseras partir libre
  rationale: L’expression signifie littéralement l’envoyer « pour elle-même » et indique qu’elle retrouve la libre disposition de sa personne.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: Tu ne la vendras en aucun cas pour de l’argent
  rationale: La construction associant l’infinitif absolu au verbe conjugué renforce l’interdiction. « En aucun cas » restitue cette insistance, et « argent » rend clairement בַּכָּסֶף.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: tu ne la traiteras pas comme une marchandise
  rationale: Le verbe rare עמר, dans ce contexte parallèle à l’interdiction de vendre, évoque vraisemblablement une exploitation dominatrice ou économique. La formulation retenue garde cette force sans réduire le sens au seul asservissement.
- source_word: תַּחַת אֲשֶׁר
  choice: puisque
  rationale: La locution introduit le motif de l’interdiction. « Puisque » exprime clairement ce rapport causal.
- source_word: עִנִּיתָהּ
  choice: tu l’as humiliée
  rationale: Au piel, ענה peut signifier affliger, humilier ou violer, notamment dans un contexte sexuel. « Humiliée » conserve l’atteinte grave subie sans imposer dans le texte principal un sens plus étroit que le terme hébreu.
theological_decisions:
- issue: Portée éthique de la loi concernant la captive
  choice: 'Présenter le verset comme une restriction explicite du pouvoir de l’homme : il doit rendre sa liberté à la femme et ne peut ni la vendre ni l’exploiter.'
  alternative: Présenter la situation comme un divorce purement consensuel, ou qualifier explicitement l’acte antérieur de viol dans le texte principal.
  rationale: Le verset interdit la marchandisation de la femme en raison de l’atteinte qu’elle a déjà subie. La traduction conserve la gravité et le contexte coercitif du passage, sans les atténuer ni préciser davantage que l’hébreu la nature exacte de cette atteinte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier suit l’adresse légale hébraïque. La formulation maintient l’insistance des interdictions et la gravité du contexte sans ajouter « désormais » ou « ne… plus », ni imposer une qualification juridique plus précise que l’hébreu.
