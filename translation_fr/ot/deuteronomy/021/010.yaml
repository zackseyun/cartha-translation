  text: כִּֽי תֵצֵ֥א לַ/מִּלְחָמָ֖ה עַל אֹיְבֶ֑י/ךָ וּ/נְתָנ֞/וֹ יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/יָדֶ֖/ךָ וְ/שָׁבִ֥יתָ שִׁבְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: fr
  text: Quand tu partiras en guerre contre tes ennemis et que Yahweh, ton Dieu, les livrera en ton pouvoir[a], tu feras des prisonniers parmi eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le donnera dans ta main ». Le suffixe hébreu est au singulier et désigne probablement l’ennemi comme une force collective.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu prendras des captifs parmi eux ». L’hébreu associe un verbe et un nom de même racine pour exprimer la capture de prisonniers; le suffixe singulier peut renvoyer collectivement à la force ennemie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֵצֵא
  choice: Quand tu partiras
  rationale: כִּי introduit ici le cas envisagé par la loi; « quand » convient à cette formulation casuistique. Le futur français exprime naturellement la situation projetée.
- source_word: לַמִּלְחָמָה עַל אֹיְבֶיךָ
  choice: en guerre contre tes ennemis
  rationale: Cette formulation française naturelle rend le déplacement en vue du combat et la valeur hostile de עַל.
- source_word: וּנְתָנוֹ
  choice: et que … les livrera
  rationale: נתן signifie littéralement « donner », mais, dans ce contexte militaire, « livrer » exprime naturellement la remise au pouvoir du vainqueur. Le suffixe singulier renvoie vraisemblablement à l’ennemi pris collectivement; le pluriel français reprend « tes ennemis ».
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu
  rationale: Le nom divin est translittéré, et le suffixe de deuxième personne du singulier est rendu par « ton ».
- source_word: בְּיָדֶךָ
  choice: en ton pouvoir
  rationale: Littéralement « dans ta main »; l’expression désigne ici le fait de placer l’ennemi sous l’autorité ou la maîtrise d’Israël. « En ton pouvoir » rend clairement l’idiome en français actuel.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: tu feras des prisonniers parmi eux
  rationale: Le verbe et le nom apparentés forment une expression intensive de capture. Cette formulation naturelle conserve l’idée que des captifs sont pris au sein de la force ennemie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et préserve sa fonction de nom d’alliance.
- issue: Référence du suffixe masculin singulier dans וּנְתָנוֹ et שִׁבְיוֹ
  choice: référence collective aux ennemis
  alternative: référence littérale à « lui » ou « son butin humain »
  rationale: Bien que les suffixes soient au singulier, le seul référent explicite est « tes ennemis », pluriel. Le singulier peut viser collectivement la force ennemie; le français reprend donc le pluriel sans imposer un individu absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne du masculin singulier. « Partir en guerre », « livrer en ton pouvoir » et « faire des prisonniers » évitent une littéralité obscure tout en conservant la structure et le sens militaire du verset.
