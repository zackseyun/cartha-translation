  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: fr
  text: et que tu voies parmi les captifs une femme de belle apparence[a], que tu la désires et que tu la prennes pour femme[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une femme belle à voir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que tu la prennes pour toi comme femme » ; expression hébraïque signifiant l’épouser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: et que tu voies parmi les captifs
  rationale: Dans la suite casuistique commencée au verset précédent, les parfaits coordonnés prolongent la proposition éventuelle. Le subjonctif français après « et que » rend naturellement cette dépendance. « Parmi les captifs » désigne le groupe emmené à la guerre sans ajouter la précision interprétative « prisonniers de guerre ».
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: une femme d’une belle apparence
  rationale: La tournure garde la référence explicite à l’aspect extérieur tout en étant plus naturelle en français actuel que le calque « une femme belle de forme ».
- source_word: תֹּאַר
  choice: apparence
  rationale: Le nom désigne la forme ou l’aspect visible. « Apparence » convient au contexte et évite l’ambiguïté de « formes », qui pourrait suggérer plus étroitement la silhouette corporelle.
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: que tu la désires
  rationale: Le verbe exprime un désir ou un attachement marqué. « Désirer » en conserve la force sans l’atténuer en simple attirance.
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: que tu la prennes pour femme
  rationale: Cette expression française correspond naturellement à l’idiome hébreu « prendre pour soi pour femme » et conserve sa formulation concrète plutôt que de la réduire à « l’épouser ».
theological_decisions:
- issue: Rendre un texte légal moralement difficile sans l’euphémiser ni lui ajouter un jugement absent du verset
  choice: Conserver la description directe du désir et du fait de prendre la captive pour femme
  alternative: Adoucir par « que tu choisisses de l’épouser » ou expliciter soit une approbation, soit une coercition
  rationale: L’hébreu formule directement la situation de guerre. La traduction maintient cette tension éthique sans présenter le désir sous un jour plus favorable et sans introduire une évaluation que ce verset n’énonce pas.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe en « et que » suppose la proposition conditionnelle ouverte au verset 10 et respecte ainsi la continuité de la phrase. Les termes directs « désires » et « prennes pour femme » préservent la tension du texte.
