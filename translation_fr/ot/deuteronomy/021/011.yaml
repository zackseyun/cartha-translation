review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle dépendant du verset 10 est bien rendue par « et que tu voies ». « Parmi les captifs », « que tu la désires » et « que tu la prennes pour femme » reflètent fidèlement l’hébreu, sans atténuer ni développer la situation. Pour אֵשֶׁת יְפַת־תֹּאַר, « de belle apparence » rend plus exactement et plus idiomatiquement la qualification de l’apparence extérieure.
  naturalness: 'La formulation « une femme d’une belle apparence » n’est pas idiomatique en français moderne : on dit « une femme de belle apparence ». La note proposée « une femme bien faite » est plus restrictive, centrée sur la silhouette, et d’un registre moins approprié ; elle ne constitue pas une bonne alternative lexicale générale.'
  terminology: « Captifs », « désires » et « prendre pour femme » conviennent au registre légal sobre et au français international moderne. L’expression « prendre pour femme » conserve utilement la concrétude de l’idiome matrimonial hébreu, tandis que la note en explique le sens.
  issues:
  - severity: medium
    issue: Formulation française maladroite pour la beauté extérieure
    rationale: « D’une belle apparence » est une tournure non idiomatique. « De belle apparence » est le syntagme français usuel et conserve le sens de יְפַת־תֹּאַר.
  - severity: medium
    issue: Alternative de note trop étroite et de registre discutable
    rationale: « Bien faite » évoque principalement la constitution corporelle et peut avoir une coloration objectivante ou familière ; le terme hébreu vise plus largement la forme ou l’apparence visible.
