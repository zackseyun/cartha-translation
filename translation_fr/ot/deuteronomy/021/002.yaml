  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: fr
  text: alors tes anciens et tes juges sortiront et mesureront la distance jusqu’aux villes situées autour de l’homme tué[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « mesureront jusqu’aux villes situées autour de la personne tuée ».'
    reason: Alternative lexicale qui conserve la forme non spécifiée de חָלָל et suit plus étroitement la construction hébraïque.
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: alors… sortiront
  rationale: Le waw suivi du qatal poursuit la procédure juridique; « alors » exprime naturellement cette succession en français.
- source_word: זְקֵנֶיךָ
  choice: tes anciens
  rationale: La traduction conserve le suffixe de deuxième personne du singulier et l’adresse collective faite à Israël.
- source_word: וְשֹׁפְטֶיךָ
  choice: et tes juges
  rationale: Le terme désigne ici ceux qui exercent l’autorité judiciaire; « juges » convient directement au contexte légal.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: mesureront la distance jusqu’aux villes
  rationale: Le verbe signifie « mesurer » et אֶל indique les villes comme points d’aboutissement; préciser « la distance » produit un français naturel sans changer le sens.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: situées autour
  rationale: Cette formulation française courante désigne les villes environnant le lieu où se trouve la victime.
- source_word: הֶחָלָל
  choice: l’homme tué
  rationale: חָלָל désigne une personne qui a été tuée. « L’homme tué » conserve ce sens, tandis que « cadavre » serait plus neutre et « homme assassiné » préciserait indûment la qualification juridique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur convient à la prescription juridique. Le tutoiement singulier préserve l’adresse collective hébraïque à Israël.
