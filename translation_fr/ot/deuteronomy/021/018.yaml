  text: כִּֽי יִהְיֶ֣ה לְ/אִ֗ישׁ בֵּ֚ן סוֹרֵ֣ר וּ/מוֹרֶ֔ה אֵינֶ֣/נּוּ שֹׁמֵ֔עַ בְּ/ק֥וֹל אָבִ֖י/ו וּ/בְ/ק֣וֹל אִמּ֑/וֹ וְ/יסְּר֣וּ אֹת֔/וֹ וְ/לֹ֥א יִשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: fr
  text: Si un homme a un fils obstiné et rebelle, qui n’écoute ni son père ni sa mère[a], et que ses parents le corrigent sans qu’il les écoute[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui n’écoute pas la voix de son père ni la voix de sa mère ». Dans cet idiome, « écouter la voix de quelqu’un » signifie prêter attention à ses directives et y obéir.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se rendre plus littéralement : « et ses parents le corrigent, et il ne les écoute pas ». Le contexte peut suggérer « bien qu’ils le corrigent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit ici le cas envisagé par une loi casuistique. « Si » est la formulation juridique française la plus naturelle, bien que « lorsqu’ » soit aussi possible.
- source_word: יִהְיֶה לְאִישׁ
  choice: un homme a
  rationale: La construction hébraïque d’existence avec לְ exprime couramment la possession ; « un homme a » en donne un équivalent français idiomatique.
- source_word: בֵּן
  choice: fils
  rationale: Le nom désigne spécifiquement un fils.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: obstiné et rebelle
  rationale: Le premier terme évoque une résistance persistante, le second une rébellion active. Le binôme français conserve la force cumulative de l’hébreu.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: qui n’écoute
  rationale: שׁמע signifie entendre ou écouter et implique ici l’obéissance. « Écouter » préserve le motif lexical répété tout en laissant le contexte communiquer le refus d’obéir.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: ni son père ni sa mère
  rationale: Sous la négation, « ni… ni… » rend naturellement les deux compléments hébreux. L’expression « écouter la voix de » signifie ici écouter les directives autorisées ; omettre « la voix » évite une tournure moins naturelle en français sans perdre le sens.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: et si ses parents le corrigent
  rationale: יסר désigne une correction éducative ou disciplinaire, sans imposer l’idée de violence. La répétition de « si » rend lisible la succession des faits tout en conservant la conjonction hébraïque.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: mais qu’il ne les écoute pas
  rationale: « Mais » explicite l’opposition contextuelle entre la correction et le refus persistant. La répétition d’« écouter » reflète celle de שׁמע dans l’hébreu.
theological_decisions:
- issue: Nature de la correction parentale
  choice: « le corrigent »
  alternative: « le punissent » ou « le disciplinent »
  rationale: Le terme hébreu peut englober discipline et réprimande, mais ne précise ni la méthode ni la sévérité. « Corriger » conserve cette amplitude sans importer une pratique punitive particulière.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le cadre juridique conditionnel, le parallélisme parental et la répétition du verbe « écouter », tout en rendant idiomatiquement l’expression hébraïque « écouter la voix de ».
