  rationale: La révision corrige le sens de לְשָׁרְתוֹ par « pour le servir » et remplace l’expression peu naturelle « cas d’atteinte » par « blessure », dont la note explicite les sens alternatifs. La structure appositionnelle, le futur prescriptif, le nom Yahweh et l’autorité judiciaire exprimée par « sur leur parole » sont conservés.
