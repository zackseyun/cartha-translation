  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: fr
  text: Les prêtres, fils de Lévi, s’avanceront, car Yahweh, ton Dieu, les a choisis pour le servir et pour bénir au nom de Yahweh ; tout litige et toute blessure[a] seront tranchés sur leur parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coup », « atteinte » ou « affliction ». Le terme hébreu est plus large que « blessure » ; dans ce contexte juridique, il peut désigner une atteinte corporelle, sans que cela soit certain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: s’avanceront
  rationale: Le niphal de נגשׁ introduit ici l’intervention officielle des prêtres dans la procédure; « s’avanceront » exprime naturellement cette approche formelle.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: les prêtres, fils de Lévi
  rationale: Cette formulation conserve l’apposition hébraïque sans transformer explicitement l’expression en catégorie technique.
- source_word: כִּי בָם בָּחַר
  choice: car … les a choisis
  rationale: כִּי donne le motif de leur intervention, et le passé composé rend le choix antérieur dont l’effet demeure.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré, et le singulier « ton » conserve l’adresse hébraïque à Israël.
- source_word: לְשָׁרְתוֹ
  choice: pour assurer son service
  rationale: Dans ce contexte sacerdotal, שרת désigne un service cultuel; cette expression reste digne et compréhensible sans ajouter « sacerdotal », absent du syntagme.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: et pour bénir au nom de Yahweh
  rationale: La traduction directe conserve l’idée d’une bénédiction prononcée sous l’autorité du nom divin.
- source_word: וְעַל פִּיהֶם
  choice: C’est sur leur parole
  rationale: Littéralement « sur leur bouche », l’expression désigne leur déclaration faisant autorité; « sur leur parole » préserve à la fois l’image de la parole et sa portée juridique.
- source_word: יִהְיֶה כָּל רִיב וְכָל נָגַע
  choice: sera tranché tout litige et tout cas d’atteinte
  rationale: Le simple verbe « être » appelle en français un complément implicite dans ce cadre judiciaire. « Sera tranché » explicite sobrement cette fonction, tandis que « cas d’atteinte » maintient la largeur sémantique de נגע.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Portée de l’autorité sacerdotale dans la dernière proposition
  choice: leur parole tranche les cas mentionnés
  alternative: leur parole règle absolument toute controverse et toute affliction
  rationale: La formulation garde la force juridique du verset sans étendre artificiellement cette autorité au-delà des catégories indiquées par רִיב et נֶגַע.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur convient à la prescription légale. La seconde phrase allège une longue coordination tout en conservant le lien logique et l’autorité de la parole sacerdotale.
