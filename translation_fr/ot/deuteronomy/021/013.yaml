base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: fr
  text: Elle enlèvera les vêtements de sa captivité[a], habitera dans ta maison et pleurera son père et sa mère pendant un mois entier. Après cela, tu pourras aller vers elle, tu seras son mari, et elle sera ta femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le vêtement de sa captivité ». Cette expression peut désigner les vêtements associés à sa condition de captive ou ceux qu’elle portait lorsqu’elle a été capturée.'
    reason: Préserve dans le texte et explicite en note l’ambiguïté du génitif hébreu.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: Elle enlèvera
  rationale: Le hiphil de סור exprime ici l’action d’ôter; « enlèvera » est naturel et conserve la portée prescriptive du futur juridique.
- source_word: שִׂמְלַת שִׁבְיָהּ מֵעָלֶיהָ
  choice: les vêtements qu’elle portait lors de sa capture
  rationale: Littéralement « le vêtement de sa captivité, de dessus elle ». La formulation française explicite sobrement le rapport probable avec sa capture sans trancher davantage la fonction de ces vêtements; une traduction plus formelle figure en note.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: puis elle habitera dans ta maison
  rationale: ישב peut signifier s’asseoir, demeurer ou habiter. Ici, « habitera » rend naturellement la résidence prolongée prescrite par la loi.
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: et pleurera son père et sa mère
  rationale: בכה signifie d’abord « pleurer ». Cette traduction conserve le geste concret de deuil ainsi que la construction avec les parents comme objets.
- source_word: יֶרַח יָמִים
  choice: pendant un mois entier
  rationale: L’expression signifie littéralement « un mois de jours » et désigne un mois complet; « un mois entier » en restitue l’emphase en français courant.
- source_word: תָּבֹא אֵלֶיהָ
  choice: tu pourras aller vers elle
  rationale: L’expression constitue dans ce contexte un idiome sexuel. « Aller vers elle » en conserve l’euphémisme, tandis que « pourras » rend la permission juridique après le délai prescrit.
- source_word: וּבְעַלְתָּהּ
  choice: tu deviendras son mari
  rationale: Le verbe בעל désigne ici l’entrée dans le statut ou rôle de mari. Cette formulation évite une connotation moderne de propriété tout en maintenant la distinction avec l’expression précédente.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: elle deviendra ta femme
  rationale: Formule hébraïque ordinaire indiquant l’établissement du statut matrimonial; « deviendra » marque clairement le résultat juridique.
theological_decisions:
- issue: Idiome sexuel et statut matrimonial dans une loi difficile concernant une captive
  choice: Conserver séparément l’approche sexuelle euphémistique (« aller vers elle »), l’entrée de l’homme dans le rôle de mari et le statut de femme qui en résulte.
  alternative: Fusionner les trois expressions en « tu pourras l’épouser », ou expliciter plus crûment « avoir des relations sexuelles avec elle ».
  rationale: L’hébreu enchaîne trois formulations distinctes. Les maintenir évite aussi bien de romantiser le texte que de lui imposer une caractérisation plus explicite que celle qu’il emploie.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur conserve la tonalité juridique. Le tutoiement suit l’adresse hébraïque au singulier. La note maintient l’ambiguïté du génitif sans alourdir le corps du verset.
