  source_fidelity: La formulation « les vêtements qu’elle portait lors de sa capture » choisit une interprétation historique possible de שִׂמְלַת שִׁבְיָהּ, alors que le génitif hébreu demeure ouvert (« vêtement(s) de sa captivité »). Le corps du texte doit conserver cette ambiguïté, comme le fait l’audit anglais. Le reste rend correctement la résidence, le deuil d’un mois et la séquence conjugale et sexuelle.
  naturalness: Le français est globalement fluide. « Les vêtements de sa captivité » est naturel dans ce registre juridique et biblique. « Tu seras son mari, et elle sera ta femme » est plus direct et correspond mieux aux deux formules hébraïques finales que « deviendras ».
  terminology: « Aller vers elle » conserve avec retenue l’euphémisme de l’idiome תבוא אליה. « Mari » et « femme » rendent clairement le statut matrimonial sans ajouter de lecture doctrinale. La note doit signaler les interprétations possibles sans que l’une d’elles soit imposée par le texte principal.
