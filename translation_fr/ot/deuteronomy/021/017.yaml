  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: fr
  text: Mais il reconnaîtra comme premier-né le fils de la femme mal-aimée[a] et lui donnera une double part[b] de tous les biens qu’il possède, car il est le premier fruit de la vigueur de son père[c] ; le droit d’aînesse lui revient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la femme haïe » ou « la femme moins aimée ». Le mot hébreu peut signifier littéralement « haïe », mais il désigne probablement ici l’épouse qui est moins aimée ou défavorisée par rapport à l’autre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une bouche de deux », expression idiomatique qui signifie deux parts d’héritage.
    reason: lexical_alternative
  - marker: c
    text: Ou « le commencement de sa force ». L’expression évoque le premier fils comme la première manifestation de la puissance génératrice de son père.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: il reconnaîtra comme premier-né
  rationale: Le hiphil de נכר exprime ici la reconnaissance juridique du statut réel du premier-né, et non une simple identification.
- source_word: הַבְּכֹר בֶּן הַשְּׂנוּאָה
  choice: le fils de la femme mal-aimée
  rationale: « Premier-né » garde la portée juridique du terme, tandis que « mal-aimée » rend naturellement le contraste relationnel sans imposer l’idée d’une haine active.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: lui donnera une double part
  rationale: L’expression idiomatique, littéralement « une bouche de deux », désigne deux parts d’héritage.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: de tout ce qu’il possède
  rationale: Cette formulation française naturelle exprime les biens trouvés en sa possession, c’est-à-dire son patrimoine, sans alourdir la phrase.
- source_word: רֵאשִׁית אֹנוֹ
  choice: les prémices de sa vigueur
  rationale: La formulation conserve la métaphore hébraïque et l’allusion à la puissance génératrice du père.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: le droit d’aînesse
  rationale: Expression juridique française concise désignant le droit attaché au statut de premier-né.
- source_word: כִּי ... כִּי
  choice: Mais ... car
  rationale: Le premier כִּי marque ici l’opposition avec l’interdiction du verset précédent, et le second introduit la justification.
theological_decisions:
- issue: Sens de שְׂנוּאָה dans le contraste entre les deux épouses
  choice: femme mal-aimée
  alternative: femme haïe ; femme moins aimée
  rationale: Le contexte juridique repose sur une différence d’affection entre les épouses. « Mal-aimée » préserve ce contraste tout en évitant d’affirmer plus précisément que le texte ne l’exige une hostilité active.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation juridique reste nette, tandis que les notes conservent les possibilités lexicales et la métaphore de l’hébreu.
