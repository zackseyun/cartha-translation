revisions:
- from: Les anciens de cette ville feront descendre la génisse jusqu’à un ravin où coule un cours d’eau permanent[a], qui n’est ni cultivé ni ensemencé. Là, dans le ravin, ils briseront la nuque de la génisse.
  to: Les anciens de cette ville feront descendre la génisse jusqu’à un ravin au cours d’eau permanent[a]. Ce ravin n’est ni cultivé ni ensemencé. Là, dans le ravin, ils briseront la nuque de la génisse.
  rationale: La révision corrige l’ambiguïté structurelle qui faisait porter « cultivé » et « ensemencé » sur le cours d’eau plutôt que sur le ravin. Elle maintient la lecture principale, probable mais discutée, d’un נחל associé à une permanence hydrologique, tout en conservant dans la note l’incertitude lexicale d’אֵיתָן sans en faire une affirmation doctrinale ou interprétative.
