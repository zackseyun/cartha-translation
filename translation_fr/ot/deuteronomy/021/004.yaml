  - severity: low
    issue: La note ne donne pas nettement une alternative au rendu principal
    rationale: « Un ravin au cours d’eau permanent » est pratiquement équivalent à « un ravin où coule un cours d’eau permanent ». Une formulation alternative plus directe, telle que « un ravin pérenne », permet de signaler la même lecture lexicale sans doublon.
