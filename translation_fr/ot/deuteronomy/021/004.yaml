base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: fr
  text: Les anciens de cette ville feront descendre la génisse jusqu’à un ravin au cours d’eau permanent[a]. Ce ravin n’est ni cultivé ni ensemencé. Là, dans le ravin, ils briseront la nuque de la génisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à un ravin pérenne ». L’expression hébraïque נַחַל אֵיתָן peut désigner un ravin, un lit de torrent ou un cours d’eau caractérisé par une permanence ou une force durable. Elle a aussi été comprise comme désignant un ravin au sol ferme ou escarpé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: feront descendre
  rationale: Le hifil de ירד exprime ici l’action de faire descendre ou d’amener vers le bas; « feront descendre » conserve clairement cette valeur causative.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: les anciens de cette ville
  rationale: Rendu direct et usuel de la construction hébraïque dans ce cadre juridique.
- source_word: הָעֶגְלָה
  choice: la génisse
  rationale: עגלה désigne une jeune femelle bovine; « génisse » est précis et naturel dans un texte rituel.
- source_word: אֶל נַחַל אֵיתָן
  choice: jusqu’à un ravin où coule un cours d’eau permanent
  rationale: נחל peut désigner un ravin, un lit de torrent ou le cours d’eau qui y coule; איתן évoque ici ce qui est durable ou permanent. Le rendu garde les deux aspects sans réduire le terme à un simple terrain accidenté.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: qui n’est ni cultivé ni ensemencé
  rationale: Les deux verbes passifs décrivent un lieu qui n’est pas travaillé à des fins agricoles et où rien n’est semé; la formulation française est concise et parallèle.
- source_word: וְעָרְפוּ
  choice: ils briseront la nuque
  rationale: Dans ce rite, ערף désigne l’action particulière de rompre la nuque, plutôt qu’un terme général comme « abattre » ou une décapitation explicite.
- source_word: בַּנָּחַל
  choice: dans le ravin
  rationale: La répétition de « ravin » maintient le lien lexical avec נחל et précise le lieu où le rite est accompli.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Ravin » évite l’emprunt moins courant « oued », tandis que la proposition relative explicite la lecture hydrologique probable de נחל איתן. L’ambiguïté lexicale réelle est conservée dans la note.
