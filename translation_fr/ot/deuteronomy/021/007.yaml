  text: וְ/עָנ֖וּ וְ/אָמְר֑וּ יָדֵ֗י/נוּ לֹ֤א שפכה אֶת הַ/דָּ֣ם הַ/זֶּ֔ה וְ/עֵינֵ֖י/נוּ לֹ֥א רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: fr
  text: 'Alors ils prendront la parole et diront : « Nos mains n’ont pas versé ce sang, et nos yeux ne l’ont pas vu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et nous n’en avons pas été témoins ». L’hébreu dit littéralement : « et nos yeux n’ont pas vu » ; cette expression nie qu’ils aient vu le meurtre ou qu’ils en aient une connaissance directe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: Alors ils prendront la parole et diront
  rationale: La coordination hébraïque associe « répondre » et « dire » dans une formule de déclaration publique. « Prendre la parole et dire » restitue naturellement en français les deux verbes et la portée solennelle de la formule, tandis que « alors » marque l’enchaînement de la procédure.
- source_word: יָדֵינוּ
  choice: Nos mains
  rationale: 'L’image concrète des mains est conservée : elles représentent ici l’action directe et donc la responsabilité dans la mort.'
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: n’ont pas versé ce sang
  rationale: « Verser le sang » est une expression française établie qui correspond à l’idiome hébraïque שפך דם. Le démonstratif de « ce sang » est maintenu sans expliciter davantage l’identité de la victime.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: et nos yeux ne l’ont pas vu
  rationale: La formulation conserve l’image corporelle des « yeux » et le verbe concret « voir ». Le pronom « l’ » rend la phrase naturelle en français tout en laissant au contexte le soin de préciser ce qui n’a pas été vu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et solennel. La traduction préserve les images juridiques concrètes des « mains » et des « yeux », sans remplacer la déclaration par une paraphrase abstraite sur la culpabilité ou la connaissance.
