  verdict: revise
  source_fidelity: La structure conditionnelle, les deux épouses, les fils et la maternité du premier-né sont bien rendus. Toutefois, « mais » ne correspond à aucun connecteur adversatif dans l’hébreu et introduit un contraste absent du texte. La formulation révisée conserve la succession circonstancielle de la phrase juridique.
  naturalness: « Mal-aimée » est compréhensible, idiomatique et maintient utilement le contraste avec « aimée ». « Toutes deux lui ont donné des fils » est plus net que « l’une et l’autre lui donnent des fils » et rend bien l’antériorité implicite des parfaits hébreux. La phrase reste volontairement inachevée, comme le cas juridique qui se poursuit au verset suivant.
  terminology: « Femmes » est naturel ici au sens d’épouses. « Fils aîné » rend correctement הַבֵּן הַבְּכוֹר. La note conserve à juste titre « haïe » comme possibilité lexicale sans imposer ce sens dans le texte principal.
