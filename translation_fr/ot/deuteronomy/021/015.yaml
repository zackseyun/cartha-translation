source:
  edition: WLC
  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: fr
  text: Si un homme a deux femmes, l’une aimée et l’autre mal-aimée[a], et que toutes deux lui ont donné des fils, et que le fils aîné est celui de la femme mal-aimée,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « haïe » ; le terme hébreu peut avoir ce sens plus fort, mais il peut ici désigner la femme qui n’a pas la préférence, par opposition à celle qui est aimée.
    reason: Alternative lexicale permettant de conserver l’amplitude sémantique de שְׂנוּאָה.
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit ici un cas juridique hypothétique; « si » convient au style casuistique français.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: un homme a
  rationale: Rend naturellement en français la tournure hébraïque d’existence et de possession.
- source_word: שְׁתֵּי נָשִׁים
  choice: deux femmes
  rationale: Dans ce contexte matrimonial et successoral, « femmes » désigne clairement des épouses; c’est l’usage français naturel.
- source_word: הָאַחַת אֲהוּבָה
  choice: l’une aimée
  rationale: Conserve directement le participe passif et le contraste relationnel du texte.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: l’autre mal-aimée
  rationale: « Mal-aimée » préserve l’opposition avec « aimée » sans imposer nécessairement l’idée plus forte de haine active.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: lui donnent des fils
  rationale: Formulation française naturelle pour exprimer que chacune enfante des fils à cet homme; « fils » conserve la précision masculine de בָנִים.
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: l’une et l’autre
  rationale: Le référent est clair et cette formulation indique sans lourdeur que les deux femmes ont donné naissance à des fils.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: mais que le fils premier-né soit
  rationale: La tournure poursuit la condition juridique et met en relief la circonstance décisive; « mais » explicite le contraste contextuel sans en changer la portée.
- source_word: לַשְּׂנִיאָה
  choice: celui de la femme mal-aimée
  rationale: Rend clairement la relation maternelle exprimée par le lamed dans ce contexte successoral.
theological_decisions:
- issue: Sens de שְׂנוּאָה dans le cadre du droit familial
  choice: mal-aimée
  alternative: haïe
  rationale: Le mot hébreu peut signifier « haïe », mais, dans cette opposition conjugale, il peut aussi désigner la femme moins aimée ou défavorisée. « Mal-aimée » conserve la tension lexicale tout en évitant de transformer implicitement le statut comparatif en hostilité déclarée; la note signale le sens plus fort.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure ouverte du cas juridique, qui se poursuit au verset suivant. « Mal-aimée » est idiomatique et maintient le contraste aimée/non favorisée; la note garde visible la possibilité du sens littéral plus fort.
