source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּבַעֵ֛ר הַ/דָּ֥ם הַ/נָּקִ֖י מִ/קִּרְבֶּ֑/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: fr
  text: Ainsi, tu ôteras du milieu de toi le sang innocent[a], car tu feras ce qui est droit aux yeux de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le sang de l’innocent ». L’expression hébraïque peut aussi évoquer la responsabilité qui pèse sur la communauté à cause d’un meurtre non expié.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ainsi, tu
  rationale: La conjonction suivie du pronom indépendant marque une conclusion emphatique. « Ainsi, tu » rend naturellement cette transition tout en conservant l’adresse directe au singulier.
- source_word: תְּבַעֵר
  choice: ôteras
  rationale: Au piel, בער désigne ici l’élimination de ce qui rend la communauté coupable. « Ôter » exprime clairement l’action requise sans ajouter une idée rituelle absente du verbe lui-même.
- source_word: הַדָּם הַנָּקִי
  choice: le sang innocent
  rationale: La formulation conserve l’image juridique et morale de l’hébreu. Dans le contexte, elle peut aussi évoquer la responsabilité collective liée à un meurtre non expié.
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de toi
  rationale: Cette tournure maintient le singulier collectif d’Israël et l’expression communautaire caractéristique du Deutéronome.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici le fondement de l’affirmation précédente. « Car » préserve le lien causal sans en préciser excessivement la logique.
- source_word: תַעֲשֶׂה
  choice: tu feras
  rationale: L’imparfait prend dans cette instruction légale une valeur prospective et prescriptive, bien rendue par le futur français.
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: L’adjectif substantivé désigne la conduite conforme à la norme divine. Cette formulation est naturelle et garde la nuance éthique d’« intégrité/droiture ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve la métaphore hébraïque de l’évaluation divine et rend directement le nom propre יהוה par « Yahweh ».
theological_decisions:
- issue: Sens de « sang innocent » et responsabilité de la communauté
  choice: Conserver « le sang innocent » dans le texte et signaler en note la possible notion de responsabilité collective
  alternative: Expliciter dans le texte « la culpabilité liée au sang innocent »
  rationale: L’hébreu nomme littéralement le sang innocent, tandis que le contexte juridique implique probablement la culpabilité résultant d’un meurtre non expié. La traduction garde l’image et la note préserve l’implication sans l’imposer comme unique sens.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom divin. « Yahweh » le rend comme nom propre et distingue celui-ci d’un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier « tu/toi » est conservé parce qu’il représente Israël comme une communauté collective. La formulation reste proche de l’image et de la syntaxe hébraïques tout en étant idiomatique en français.
