  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: fr
  text: alors son père et sa mère se saisiront de lui et l’amèneront aux anciens de sa ville, à la porte de sa localité[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La porte de la ville était le lieu public où les anciens de la communauté examinaient les affaires judiciaires.
    reason: cultural_note
  - marker: b
    text: 'Ou : « à la porte de sa ville ». Hébreu : « à la porte de son lieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: se saisiront de lui
  rationale: Le verbe תפשׂ construit avec ב indique ici que les parents empoignent fermement leur fils. « Se saisir de lui » restitue cette contrainte physique dans un français actuel et digne.
- source_word: אָבִיו וְאִמּוֹ
  choice: son père et sa mère
  rationale: Cette formulation conserve la mention explicite des deux parents et souligne qu’ils agissent ensemble.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: l’amèneront
  rationale: Le hifil de יצא exprime le fait de faire sortir ou d’emmener quelqu’un. Dans ce contexte, « l’amèneront » rend naturellement le déplacement jusqu’au lieu public où siègent les anciens.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: devant les anciens de sa ville
  rationale: Les « anciens » sont ici les responsables locaux qui examinent les affaires judiciaires. « Devant » exprime idiomatiquement en français la comparution impliquée par le contexte, sans changer leur identité.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: à la porte de sa localité
  rationale: שׁער désigne la porte de la ville, lieu des délibérations et jugements publics, tandis que מקום signifie littéralement « lieu ». « Localité » garde la distinction lexicale avec « ville » tout en donnant un sens naturel en français.
