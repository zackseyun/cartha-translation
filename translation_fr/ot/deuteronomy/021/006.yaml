base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: fr
  text: Et tous les anciens de cette ville qui sont les plus proches de la personne qui a été tuée[a] devront se laver les mains au-dessus de la génisse dont la nuque aura été brisée dans le ravin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du cadavre ». Le terme hébreu peut désigner une personne tuée ou le cadavre d’une personne tuée ; « la personne qui a été tuée » maintient ici explicitement le contexte d’homicide sans préciser le genre de la victime.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’oued », « dans la vallée » ou « dans le lit d’un torrent ». Le mot hébreu désigne un ravin ou une vallée associés à un cours d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Et tous
  rationale: La conjonction poursuit la procédure, tandis que כֹּל inclut l’ensemble des anciens concernés.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: les anciens de cette ville
  rationale: זִקְנֵי désigne les responsables civiques ou anciens, et le démonstratif est conservé par « cette ville ».
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: qui sont les plus proches de l’homme tué
  rationale: Le pluriel הַקְּרֹבִים se rapporte grammaticalement aux anciens. חָלָל désigne une personne tuée ou son cadavre; « l’homme tué » maintient explicitement le contexte d’homicide sans réduire le terme à un simple corps.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: devront se laver les mains
  rationale: L’imparfait a ici une valeur prescriptive dans une procédure légale. « Devront » exprime naturellement cette obligation en français moderne.
- source_word: עַל
  choice: au-dessus de
  rationale: La préposition indique ici la position des mains par rapport à l’animal pendant le rite.
- source_word: הָעֶגְלָה
  choice: la génisse
  rationale: עֶגְלָה désigne un jeune bovin femelle; « génisse » est l’équivalent français précis et usuel.
- source_word: הָעֲרוּפָה
  choice: dont on aura brisé la nuque
  rationale: Dans ce rite, ערף décrit le brisement de la nuque plutôt qu’un abattage ordinaire. Cette formulation évite de suggérer à tort une décapitation.
- source_word: בַנָּחַל
  choice: dans le ravin
  rationale: נַחַל peut désigner un ravin, un oued ou le lit d’un cours d’eau. « Ravin » est naturel et compréhensible en français international tout en conservant le cadre topographique.
