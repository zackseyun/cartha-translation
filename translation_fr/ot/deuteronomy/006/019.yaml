  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: fr
  text: afin de chasser tous tes ennemis de devant toi[a], comme Yahweh l’a dit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant toi »; expression hébraïque désignant l’éloignement des ennemis hors de son chemin ou de sa présence.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « l’a déclaré ». Le verbe hébreu signifie littéralement « a parlé » et évoque ici une parole divine antérieure qui demeure valable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: afin de chasser
  rationale: L’infinitif construit précédé de ל exprime ici le but ou le résultat dans la continuité du verset précédent. « Chasser » rend naturellement le hiphil de נדף dans ce contexte d’éviction des ennemis.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule grammaticale hébraïque n’a pas d’équivalent direct en français.
- source_word: כָּל
  choice: tous
  rationale: Rend la totalité exprimée par כָּל devant un nom pluriel.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Rend le nom avec son suffixe masculin singulier et conserve l’adresse personnelle à Israël.
- source_word: מִפָּנֶיךָ
  choice: de devant toi
  rationale: Conserve l’image hébraïque de la présence ou du chemin de l’interlocuteur, tout en exprimant l’éloignement marqué par מִן.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit simplement la correspondance entre l’action annoncée et la parole divine antérieure.
- source_word: דִּבֶּר
  choice: l’a déclaré
  rationale: Le passé composé rend une parole prononcée antérieurement et toujours pertinente. « Déclaré » reste proche de l’idée de parler sans expliciter cette parole comme une promesse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de דִּבֶּר dans le contexte de l’alliance
  choice: l’a déclaré
  alternative: l’a promis / l’avait dit
  rationale: Le choix conserve le sens lexical de la parole prononcée tout en laissant entendre sa validité présente, sans imposer le sens plus interprétatif de « promettre ».
translation_notes:
  register: Français international actuel, sobre et digne. Le fragment commence par « afin de » parce que l’infinitif hébreu dépend syntaxiquement du verset précédent. L’expression légèrement marquée « de devant toi » est maintenue pour préserver l’image du texte source, avec une note explicative.
