  source_fidelity: Le fragment rend correctement l’infinitif de but לַהֲדֹף (« afin de chasser »), le totalisant « tous », l’adresse au singulier (« tes ennemis », « toi »), et l’expression מִפָּנֶיךָ (« de devant toi »). « Yahweh » correspond exactement au tétragramme. En revanche, « l’a déclaré » est légèrement plus spécifique et plus solennel que דִּבֶּר (« a dit / a parlé »); « l’a dit » est le rendu français le plus direct et naturel, sans ajouter une nuance de proclamation formelle.
  naturalness: « Afin de chasser tous tes ennemis de devant toi » est une formulation française compréhensible, quoique volontairement marquée par le maintien de l’image hébraïque; la note l’éclaire adéquatement. « Comme Yahweh l’a dit » est plus idiomatique que « comme Yahweh l’a déclaré ».
  terminology: Le nom divin « Yahweh » est cohérent avec les décisions fournies. « Chasser » convient au hiphil de נדף dans ce contexte. La note sur « de devant toi » explique utilement l’idiome sans transformer le texte en interprétation confessionnelle.
