  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: fr
  text: Vous ne suivrez pas d’autres dieux[a], parmi les dieux des peuples qui vous entourent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous n’irez pas après d’autres dieux, parmi les dieux des peuples qui vous entourent » ; l’expression signifie ici leur accorder son allégeance et les suivre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: Vous ne suivrez pas
  rationale: Dans ce contexte prohibitif, לֹא avec l’inaccompli exprime une interdiction. L’expression הלך אחרי signifie idiomatiquement « suivre », avec ici l’idée d’allégeance religieuse, plutôt qu’un simple déplacement physique.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Rend directement les divinités autres que le Dieu d’Israël sans ajouter la nuance de provenance qu’aurait « dieux étrangers ».
- source_word: מֵאֱלֹהֵי
  choice: parmi les dieux de
  rationale: 'Le préfixe מ־ a ici une valeur partitive : les « autres dieux » sont pris parmi ceux des peuples voisins. « Parmi » rend cette relation clairement et naturellement en français.'
- source_word: הָעַמִּים
  choice: les peuples
  rationale: « Peuples » correspond au sens courant de עַמִּים et convient au contexte des populations voisines.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: qui vous entourent
  rationale: Formulation française naturelle qui conserve le sens spatial de la proposition relative et rattache celle-ci aux peuples.
theological_decisions:
- issue: Nature de l’interdiction
  choice: Une interdiction d’accorder son allégeance religieuse à d’autres divinités
  alternative: Une interdiction limitée au fait de se rendre physiquement vers des sanctuaires païens
  rationale: Dans le Deutéronome, l’expression « aller après » désigne régulièrement le fait de suivre des dieux et de leur vouer un culte. « Suivre » conserve cette portée sans réduire explicitement l’expression au seul acte d’adorer.
- issue: Valeur de la préposition מ־ devant אֱלֹהֵי
  choice: 'Lecture partitive : « parmi les dieux des peuples »'
  alternative: 'Apposition explicative : « c’est-à-dire les dieux des peuples »'
  rationale: La préposition hébraïque est réellement présente et se prête à une lecture partitive. Le texte français la conserve sans faire des dieux une catégorie ontologiquement reconnue ni résoudre la tension théologique du langage biblique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient au style des interdictions bibliques. « Suivre » est plus naturel que le calque « aller après », lequel est signalé en note. La formulation conserve explicitement la valeur partitive de מ־.
