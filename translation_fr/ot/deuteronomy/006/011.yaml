source:
  edition: WLC
  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: fr
  text: des maisons remplies de toutes sortes de biens, que tu n’as pas remplies, des citernes creusées dans le roc, que tu n’as pas creusées, des vignes et des oliviers que tu n’as pas plantés. Lorsque tu mangeras et seras rassasié,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָתִּים
  choice: maisons
  rationale: Équivalent concret et courant, adapté à l’énumération des biens matériels.
- source_word: מְלֵאִים כָּל טוּב
  choice: remplies de toutes sortes de biens
  rationale: Exprime naturellement l’abondance de biens et de provisions, sans limiter טוּב à une qualité morale.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: que tu n’as pas amassés
  rationale: En français, « amasser des biens » rend naturellement l’idée d’avoir garni les maisons, tout en conservant le contraste entre ce que le peuple reçoit et ce qu’il n’a pas lui-même accumulé.
- source_word: בֹרֹת חֲצוּבִים
  choice: citernes creusées dans le roc
  rationale: Dans ce contexte, בֹרֹת désigne vraisemblablement des réservoirs d’eau taillés dans la roche; l’explicitation donne en français une image précise et naturelle.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: que tu n’as pas creusées
  rationale: Le français idiomatique dit « creuser une citerne »; le complément « dans le roc » conserve l’idée de taille portée par חצב.
- source_word: כְּרָמִים
  choice: vignes
  rationale: « Vignes » est le terme français usuel pour des plantations viticoles et s’accorde naturellement avec le verbe planter.
- source_word: זֵיתִים
  choice: oliviers
  rationale: Le pluriel désigne ici les arbres ou plantations, non simplement leurs fruits.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: que tu n’as pas plantés
  rationale: Rendu direct qui maintient le motif répété des ressources que le destinataire n’a pas produites.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: Lorsque tu mangeras à satiété
  rationale: Les formes verbales poursuivent la séquence future du passage. « Manger à satiété » exprime avec naturel l’action de manger et son résultat, tandis que « lorsque » prépare l’avertissement du verset suivant sans l’importer dans celui-ci.
theological_decisions:
- issue: Nature de l’abondance promise
  choice: Présenter simplement les biens matériels reçus sans travail préalable d’Israël
  alternative: Ajouter dès ce verset une appréciation morale ou un avertissement explicite
  rationale: Le verset énumère les provisions dont Israël bénéficiera; l’avertissement proprement dit vient au verset suivant et ne doit pas être anticipé.
- issue: Adresse au singulier
  choice: Conserver « tu » dans tout le verset
  alternative: Employer « vous » pour expliciter le caractère collectif d’Israël
  rationale: L’hébreu emploie le masculin singulier dans le style d’alliance caractéristique du Deutéronome; « tu » en préserve la forme et la portée collective implicite.
- issue: Valeur temporelle des deux derniers verbes
  choice: Les rendre au futur dans une proposition temporelle ouverte sur le verset suivant
  alternative: Employer un présent narratif ou traduire « tu mangeras et tu seras rassasié » comme phrase indépendante
  rationale: Le contexte décrit ce qui arrivera lors de l’entrée dans le pays, et la syntaxe se prolonge vers l’avertissement de 6.12. Le rendu conserve cette continuité sans résoudre davantage la relation syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition rhétorique de « que tu n’as pas… » est conservée. Le verset se termine par une virgule afin de refléter sa continuité syntaxique avec Deutéronome 6.12.
