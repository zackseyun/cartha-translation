    rationale: L’hébreu dit littéralement des maisons « que tu n’as pas remplies ». Amasser des biens décrit une action connexe, mais différente, et fait porter la relative sur les biens plutôt que sur les maisons.
  - severity: low
    issue: La finale condense les deux verbes hébreux en une seule expression.
    rationale: « Manger à satiété » est compréhensible, mais « manger et être rassasié » conserve mieux la coordination וְאָכַלְתָּ וְשָׂבָעְתָּ tout en gardant la dépendance temporelle requise par le verset suivant.
