  verdict: revise
  source_fidelity: 'La liste des biens et l’adresse au singulier sont bien rendues. Toutefois, « que tu n’as pas amassés » déplace l’action de remplir les maisons vers l’accumulation des biens et ne traduit pas directement אֲשֶׁר לֹא מִלֵּאתָ. La finale doit conserver plus explicitement les deux verbes coordonnés : manger et être rassasié.'
  naturalness: Le français est moderne et fluide. « Citernes creusées dans le roc » est naturel et transmet adéquatement l’idée de citernes taillées. « Lorsque tu mangeras et seras rassasié » maintient une continuité idiomatique avec le verset suivant.
  terminology: '« Maisons », « citernes », « vignes » et « oliviers » sont appropriés. Aucun terme théologique spécialisé ne demande de modification. Aucune note n’est nécessaire : « citernes » est suffisamment précis dans le texte.'
