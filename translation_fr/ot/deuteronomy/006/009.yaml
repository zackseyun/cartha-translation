  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: fr
  text: Tu les écriras sur les montants des portes de ta maison et sur tes portes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur tes portails », « sur les montants de tes portails » ou « à tes portes ». Le terme hébreu peut désigner les portes d’accès, leur structure ou la zone d’entrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Tu les écriras
  rationale: Le qatal avec waw poursuit ici la série d’instructions et prend une valeur injonctive. Le pronom « les » reprend explicitement les paroles mentionnées dans le contexte précédent.
- source_word: מְזוּזֹת
  choice: les montants des portes
  rationale: Le nom désigne les montants latéraux d’une ouverture. Cette formulation est précise et naturelle en français moderne, sans recourir à la translittération « mezouzot ».
- source_word: בֵּיתֶךָ
  choice: de ta maison
  rationale: « Maison » conserve le sens concret de בַּיִת et le singulier avec suffixe de deuxième personne.
- source_word: וּבִשְׁעָרֶיךָ
  choice: et sur tes portes
  rationale: שַׁעַר désigne couramment une porte d’accès, notamment celle d’une propriété ou d’une ville. « Sur » reprend naturellement la préposition et conserve le parallélisme de l’hébreu, tout en laissant une note signaler l’étendue possible du terme.
