review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : l’avertissement, l’adresse au singulier, le nom divin, la sortie d’Égypte et l’expression finale sont tous conservés. Toutefois, « maison des esclaves » se comprend spontanément en français comme une maison appartenant à des esclaves ou habitée par eux, plutôt que comme la condition ou le lieu d’asservissement que désigne l’idiome hébreu בֵּית עֲבָדִים.'
  naturalness: « Veille à ne pas oublier » est compréhensible, mais « Prends garde de ne pas oublier » exprime plus directement et plus naturellement la mise en garde impérative dans un registre moderne et sobre. « Maison d’esclavage » est une expression française claire qui conserve l’image de la « maison » tout en évitant l’ambiguïté possessive de « maison des esclaves ».
  terminology: « Yahweh » convient pour יהוה. « Esclavage » dans le texte courant désigne sans euphémisme la réalité d’asservissement; la note conserve explicitement le pluriel concret « esclaves » de l’hébreu. Le tutoiement maintient correctement le singulier masculin du texte source.
  issues:
  - severity: medium
    issue: « de la maison des esclaves » est ambigu et peu idiomatique en français moderne.
    rationale: La construction française suggère normalement une maison des/aux esclaves, non l’idiome hébreu désignant l’Égypte comme lieu ou état d’esclavage. « Maison d’esclavage » rend clairement la fonction de l’expression tout en préservant son image concrète.
  - severity: low
    issue: « Veille à ne pas oublier » est moins direct que l’avertissement hébreu.
    rationale: Le nifal impératif הִשָּׁמֶר, renforcé par לְךָ, appelle une vigilance personnelle. « Prends garde de ne pas oublier » est plus usuel et restitue nettement cette force.
  revised_text: Prends garde de ne pas oublier Yahweh, qui t’a fait sortir du pays d’Égypte, de la maison d’esclavage[a].
  revised_footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « de la maison des esclaves ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace une expression française ambiguë par « maison d’esclavage », qui rend naturellement l’idiome hébreu tout en gardant « maison ». La note, correctement ancrée à l’expression concernée, explicite la formulation littérale et le pluriel « esclaves ». « Prends garde » renforce aussi la valeur d’avertissement du verbe initial sans modifier le sens.
