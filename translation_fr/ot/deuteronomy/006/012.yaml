  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: fr
  text: Prends garde de ne pas oublier Yahweh, qui t’a fait sortir du pays d’Égypte, de la maison d’esclavage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « de la maison des esclaves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Veille
  rationale: Le nifal impératif de שׁמר, renforcé par לְךָ, exprime une mise en garde personnelle. « Veille » restitue naturellement cette vigilance en français moderne.
- source_word: פֶּן תִּשְׁכַּח
  choice: à ne pas oublier
  rationale: Après l’impératif, cette tournure française rend clairement le danger à éviter exprimé par פֶּן, sans archaïsme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: הוֹצִיאֲךָ
  choice: t’a fait sortir
  rationale: Le hifil de יצא signifie ici « faire sortir ». Cette formulation conserve la valeur causative et le motif de l’Exode.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette traduction garde le nom אֶרֶץ, « pays », tout en étant idiomatique en français.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: La formulation conserve l’image concrète de la « maison » et le pluriel עֲבָדִים, qui désigne ici des esclaves, plutôt que de remplacer celui-ci dans le texte par le nom abstrait « esclavage ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve explicitement, tandis que « le SEIGNEUR » lui substituerait un titre.
- issue: Portée de la deuxième personne masculine singulière
  choice: t’
  alternative: vous
  rationale: L’hébreu s’adresse à Israël au masculin singulier collectif. Le tutoiement singulier préserve cette forme grammaticale sans exclure sa portée communautaire.
- issue: Traduction de עֲבָדִים dans la formule de l’Exode
  choice: esclaves
  alternative: esclavage
  rationale: Le pluriel concret souligne la condition réelle des personnes asservies. La variante abstraite est plus idiomatique, mais atténue la forme de l’expression hébraïque.
translation_notes:
  register: Français moderne, sobre et solennel. Le tutoiement maintient l’adresse hébraïque au singulier. « Maison des esclaves » conserve volontairement l’image concrète du texte source, avec une formulation plus idiomatique donnée en note.
