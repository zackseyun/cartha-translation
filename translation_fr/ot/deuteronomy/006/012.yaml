  rationale: La révision remplace une expression française ambiguë par « maison d’esclavage », qui rend naturellement l’idiome hébreu tout en gardant « maison ». La note, correctement ancrée à l’expression concernée, explicite la formulation littérale et le pluriel « esclaves ». « Prends garde » renforce aussi la valeur d’avertissement du verbe initial sans modifier le sens.
