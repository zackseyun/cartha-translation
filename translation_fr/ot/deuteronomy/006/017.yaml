id: DEU.6.17
reference: Deuteronomy 6:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁמ֣וֹר תִּשְׁמְר֔וּ/ן אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/עֵדֹתָ֥י/ו וְ/חֻקָּ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: fr
  text: Vous veillerez à observer avec soin[a] les commandements de Yahweh votre Dieu, ses stipulations et ses prescriptions[b], qu’il vous a ordonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe au moyen d’un infinitif absolu : on pourrait aussi traduire « vous aurez grand soin d’observer » ou « vous observerez fidèlement ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « stipulations » peut aussi être rendu par « témoignages » ou « décrets » ; celui traduit par « prescriptions » désigne des règles établies.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: Vous veillerez à observer avec soin
  rationale: La construction associant l’infinitif absolu au verbe conjugué renforce l’exhortation. Cette formulation restitue l’insistance en français naturel tout en conservant la valeur d’obligation du futur.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Le terme désigne les obligations formulées comme des ordres et convient au registre d’alliance et de loi du Deutéronome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Cette traduction directe conserve la formule d’alliance caractéristique du Deutéronome.
- source_word: עֵדֹתָיו
  choice: ses stipulations
  rationale: Dans ce contexte, le mot désigne des dispositions qui attestent et définissent les obligations de l’alliance. « Stipulations » est compréhensible en français juridique courant et maintient sa distinction avec les autres termes législatifs.
- source_word: חֻקָּיו
  choice: ses prescriptions
  rationale: Le terme renvoie à des règles établies ou prescrites. « Prescriptions » garde la nuance normative sans se confondre avec « commandements ».
- source_word: אֲשֶׁר צִוָּךְ
  choice: qu’il vous a ordonnés
  rationale: La relative porte naturellement sur l’ensemble des termes législatifs précédents. Le passé composé exprime un commandement antérieur dont l’autorité demeure présente.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Rapport entre les trois catégories législatives
  choice: commandements, stipulations et prescriptions
  alternative: commandements, témoignages et lois
  rationale: La traduction maintient trois désignations distinctes sans tenter de les fondre en une seule catégorie théologique.
translation_notes:
  register: Français international moderne, clair et soutenu. Le futur conserve la force injonctive du discours légal. Les trois termes juridiques restent distincts, tandis que la tournure intensive hébraïque est rendue idiomatiquement.
