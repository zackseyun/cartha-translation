base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: fr
  text: Tu les inculqueras[a] à tes fils[b] et tu en parleras quand tu seras assis dans ta maison, quand tu marcheras sur le chemin, quand tu te coucheras et quand tu te lèveras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu les enseigneras avec insistance ». Le verbe hébreu signifie littéralement « aiguiser » et évoque ici un enseignement répété et soigneux.
    reason: lexical_alternative
  - marker: b
    text: Ou « à tes enfants ». Le terme hébreu désigne littéralement « tes fils » ; dans un cadre familial, il peut aussi recevoir un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: Tu les inculqueras
  rationale: Le verbe שׁנן évoque littéralement l’action d’aiguiser. Dans ce contexte pédagogique, il désigne un enseignement répété et soigneux. « Inculquer » rend cette idée de transmission insistante sans reproduire une métaphore obscure en français.
- source_word: לְבָנֶיךָ
  choice: à tes fils
  rationale: בנים est un pluriel masculin signifiant littéralement « fils ». Le texte principal conserve cette forme sexuée plutôt que de l’élargir silencieusement à « enfants ».
- source_word: וְדִבַּרְתָּ בָּם
  choice: et tu en parleras
  rationale: Après דבר, la préposition ב avec suffixe se rend naturellement en français par « parler de » ; le pronom adverbial « en » reprend les paroles ou commandements mentionnés dans le contexte.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: quand tu seras assis dans ta maison
  rationale: L’infinitif construit précédé de ב exprime ici une circonstance temporelle habituelle. La formulation reste proche de l’image concrète de l’hébreu.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: quand tu marcheras en chemin
  rationale: הלך désigne le fait d’aller ou de marcher, et דרך le chemin ou la route. « Marcher en chemin » conserve ces deux éléments tout en évoquant les déplacements ordinaires.
- source_word: וּבְשָׁכְבְּךָ
  choice: quand tu te coucheras
  rationale: La tournure désigne le moment où l’on s’allonge, notamment pour dormir. « Se coucher » est l’expression française naturelle dans cette opposition avec le lever.
- source_word: וּבְקוּמֶךָ
  choice: quand tu te lèveras
  rationale: קום désigne l’action de se lever. La formulation française est naturelle et forme un parallèle net avec « quand tu te coucheras ».
theological_decisions:
- issue: Terme filial masculin dans l’instruction de l’alliance
  choice: à tes fils
  alternative: à tes enfants
  rationale: L’hébreu porte explicitement le masculin pluriel « tes fils ». La traduction conserve cette donnée lexicale, tandis qu’une note signale que, dans le cadre familial, l’instruction peut avoir une portée plus large.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple restitue la force prescriptive du discours. Les parallèles temporels et les images concrètes de la vie quotidienne sont conservés.
