source:
  edition: WLC
  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: fr
  text: Voici[a] le commandement — les prescriptions et les règles — que Yahweh[b], votre Dieu, a ordonné de vous enseigner, afin que vous les mettiez en pratique dans le pays où vous allez entrer pour en prendre possession[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et voici ». Le début hébreu relie cette section à ce qui précède. Les termes rendus par « prescriptions » et « règles » peuvent aussi se traduire par « décrets » et « ordonnances » ou « décisions de justice ».
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH; certaines traductions le rendent traditionnellement par « le Seigneur ».
    reason: alternative_reading
  - marker: c
    text: Ou « pour l’hériter ». Le verbe hébreu peut évoquer aussi bien la prise de possession que la réception d’un héritage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Voici
  rationale: La conjonction et le démonstratif introduisent une nouvelle section tout en la reliant à ce qui précède. « Voici » remplit naturellement cette fonction en français moderne; « Et voici » reste possible.
- source_word: הַמִּצְוָה
  choice: le commandement
  rationale: Le singulier est conservé comme intitulé collectif, développé ensuite par les deux catégories au pluriel.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: Le terme désigne des dispositions fixées. « Prescriptions » garde le registre juridique et se distingue de מִשְׁפָּטִים.
- source_word: וְהַמִּשְׁפָּטִים
  choice: et les règles
  rationale: Dans ce contexte légal, le mot désigne des règles ou décisions normatives. « Règles » est clair en français courant sans effacer la catégorie juridique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: de vous enseigner
  rationale: Cette formulation conserve l’infinitif de but ou de contenu après « a ordonné », sans ajouter explicitement le sujet sous-entendu de l’enseignement.
- source_word: לַעֲשׂוֹת
  choice: afin que vous les mettiez en pratique
  rationale: Littéralement « pour faire ». « Mettre en pratique » exprime naturellement l’obéissance demandée; le pronom renvoie aux prescriptions et aux règles.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: où vous allez entrer
  rationale: Le participe accompagné de l’adverbe directionnel décrit le passage imminent vers le pays. « Entrer » rend ce mouvement de façon idiomatique sans ajouter explicitement le Jourdain.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: Le verbe ירשׁ peut exprimer la prise de possession ou l’héritage. Ici, cette formulation conserve l’idée d’entrée et d’occupation du pays.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. Sa translittération préserve le nom d’alliance sans le remplacer par un titre.
- issue: Rapport entre le singulier « commandement » et les pluriels qui suivent
  choice: Conserver « le commandement — les prescriptions et les règles »
  alternative: 'Harmoniser au pluriel: « les commandements, les prescriptions et les règles »'
  rationale: L’hébreu présente expressément un singulier suivi de deux pluriels, vraisemblablement comme un intitulé collectif développé par des catégories. L’harmonisation supprimerait cette tension grammaticale porteuse de sens.
- issue: Sujet implicite de l’enseignement
  choice: Ne pas ajouter « à Moïse » dans le texte
  alternative: « que Yahweh votre Dieu m’a ordonné de vous enseigner »
  rationale: Le contexte désigne Moïse comme enseignant, mais le verset hébreu ne comporte pas ici de pronom objet signifiant explicitement « m’ ». La formulation retenue préserve cette implicitation.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique accessible. Les tirets signalent que les pluriels développent le « commandement » collectif. La syntaxe évite d’ajouter « Moïse » ou « le Jourdain », absents du verset, tout en rendant naturellement le mouvement vers le pays.
