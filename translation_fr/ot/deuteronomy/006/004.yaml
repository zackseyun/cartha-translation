  yaml_path: translation/ot/deuteronomy/006/004.yaml
  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: fr
  text: 'Écoute, Israël : Yahweh notre Dieu, Yahweh est un.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh seul est notre Dieu » ; autre possibilité : « Yahweh notre Dieu est un ». La formulation hébraïque est concise et permet plusieurs analyses syntaxiques plausibles.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: Impératif masculin singulier adressé collectivement à Israël. « Écoute » exprime naturellement en français moderne l’audition attentive et l’appel implicite à tenir compte de ce qui est dit.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre du peuple de l’alliance, conservé sous sa forme française usuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, plutôt que substitution par un titre tel que « le Seigneur ».
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Malgré la morphologie plurielle du nom, l’expression désigne ici au singulier le Dieu d’Israël et porte le suffixe de première personne du pluriel.
- source_word: אֶחָד
  choice: un
  rationale: Rend le sens adjectival et numérique premier du terme sans imposer dans le texte principal les nuances interprétatives possibles « seul » ou « unique ».
theological_decisions:
- issue: Syntaxe et sens de la dernière proposition du Shema
  choice: Yahweh notre Dieu, Yahweh est un
  alternative: 'Yahweh est notre Dieu, Yahweh seul ; ou : Yahweh notre Dieu est un seul Yahweh'
  rationale: L’absence de copule dans la formulation hébraïque compacte autorise plusieurs analyses syntaxiques. Le texte principal conserve l’affirmation traditionnelle avec un minimum d’explicitation, tandis que la note maintient les autres lectures plausibles sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et solennel. « Écoute » est idiomatique sans être familier ; la structure brève préserve le caractère confessionnel et mémorable du verset.
