  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: fr
  text: Yahweh fit survenir en Égypte de grands et terribles signes et prodiges contre le pharaon et toute sa maison, sous nos yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: fit survenir
  rationale: Le verbe נתן signifie littéralement « donner, placer ». Avec « signes et prodiges », « fit survenir » restitue naturellement en français l’action causative sans la réduire au plus interprétatif « accomplit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français moderne du nom divin יהוה, préservé comme nom propre plutôt que remplacé par un titre.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: des signes et des prodiges
  rationale: Cette association traditionnelle et intelligible conserve la distinction entre אות, « signe », et מופת, « prodige, manifestation extraordinaire ».
- source_word: גְּדֹלִים וְרָעִים
  choice: grands et terribles
  rationale: גדולים indique l’ampleur, tandis que רעים décrit ici le caractère funeste et redoutable de ces actes. « Terribles » garde leur gravité sans suggérer que Dieu aurait commis un mal moral.
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: La préposition ב est d’abord locative ici. La suite précise les personnes visées par les signes, ce qui permet de conserver cette différence syntaxique.
- source_word: בְּפַרְעֹה וּבְכָל בֵּיתוֹ
  choice: contre le pharaon et toute sa maison
  rationale: Dans ce contexte de jugement, ב désigne les cibles atteintes. « Maison » conserve l’expression hébraïque, qui peut englober le foyer, l’entourage ou la dynastie du pharaon.
- source_word: לְעֵינֵינוּ
  choice: sous nos yeux
  rationale: Expression française naturelle et vive correspondant à l’idiome hébreu « à nos yeux », c’est-à-dire en notre présence directe.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. Le transcrire préserve cette donnée du texte source sans lui substituer un titre.
- issue: Portée de וְרָעִים appliqué aux actes divins
  choice: terribles
  alternative: mauvais / funestes
  rationale: Dans ce contexte, l’adjectif qualifie leurs effets calamiteux et redoutables sur l’Égypte, non une faute morale attribuée à Dieu.
- issue: Valeur des prépositions ב devant l’Égypte et le pharaon
  choice: en Égypte… contre le pharaon
  alternative: contre l’Égypte… contre le pharaon
  rationale: La formulation française maintient la lecture locative naturelle pour l’Égypte et la valeur de cible imposée par le contexte pour le pharaon et sa maison, sans effacer l’ambiguïté possible de la première occurrence.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre et le parallélisme hébreux sont largement conservés, avec une syntaxe française naturelle. « Le pharaon » suit l’usage français courant; « toute sa maison » maintient l’image sémitique tout en restant compréhensible.
