  to: Tu feras ce qui est droit et bon aux yeux de Yahweh, afin que tout aille bien pour toi et que tu entres dans la bonne terre et en prennes possession[a], cette terre que Yahweh a juré de donner à tes pères.
  rationale: 'La révision remplace « le bon pays » par « la bonne terre », formulation française plus naturelle qui rend adéquatement הארץ dans le cadre de la promesse territoriale. Elle simplifie également la structure finale tout en préservant l’explicitation légitime de l’objet du serment : Yahweh a juré de donner cette terre aux pères d’Israël.'
