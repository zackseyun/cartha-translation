source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: fr
  text: Tu feras ce qui est droit et bon aux yeux de Yahweh, afin que tout aille bien pour toi et que tu entres dans la bonne terre et en prennes possession[a], cette terre que Yahweh a juré de donner à tes pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que tu en hérites ». Le verbe hébreu peut signifier « hériter », « posséder » ou « prendre possession » ; ici, il évoque l’entrée d’Israël dans la terre promise et sa prise de possession.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans ce contexte d’instruction, la forme verbale coordonnée a une valeur directive tournée vers l’avenir. Le futur français conserve le ton solennel du commandement d’alliance.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: ce qui est droit et bon
  rationale: Cette formulation naturelle conserve les deux qualificatifs hébreux, qui expriment la rectitude et la bonté sans les fondre en une seule notion.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: L’expression préserve la métaphore évaluative hébraïque tout en étant idiomatique en français.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: afin que tout aille bien pour toi
  rationale: La tournure rend le but ou le résultat recherché et exprime le bien-être au sens large, sans le limiter à la prospérité matérielle.
- source_word: וּבָאתָ
  choice: que tu entres
  rationale: Le verbe décrit l’entrée dans le pays et s’inscrit naturellement dans la proposition de but introduite par « afin que ».
- source_word: וְיָרַשְׁתָּ
  choice: que tu en prennes possession
  rationale: Le verbe ירשׁ peut signifier hériter, posséder ou prendre possession. Ici, il désigne l’établissement actif d’Israël dans le pays promis.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: le bon pays
  rationale: La traduction directe garde l’évaluation positive du texte sans la réduire à la fertilité ou à l’agrément.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: ce pays que Yahweh a juré à tes pères de leur donner
  rationale: Le français explicite le complément implicite du serment afin d’éviter une construction obscure, tout en conservant la force juridique et solennelle de נשבע.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom personnel divin. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Référent de לַאֲבֹתֶיךָ
  choice: à tes pères
  alternative: à tes ancêtres
  rationale: Le substantif hébreu est masculin pluriel et renvoie ici aux pères liés aux promesses patriarcales. La traduction conserve cette précision historique.
- issue: Complément implicite du serment
  choice: a juré à tes pères de leur donner
  alternative: a promis par serment à tes pères ; au sujet duquel Yahweh a prêté serment à tes pères
  rationale: L’hébreu dit littéralement que Yahweh « a juré » le pays aux pères, sans exprimer le complément attendu en français. L’ajout de « de leur donner » explicite l’objet naturellement sous-entendu sans modifier la teneur de la promesse.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme une unité. La syntaxe reste solennelle sans archaïsme, et le parallélisme du verset est conservé.
