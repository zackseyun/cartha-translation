id: DEU.6.21
reference: Deuteronomy 6:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/בִנְ/ךָ֔ עֲבָדִ֛ים הָיִ֥ינוּ לְ/פַרְעֹ֖ה בְּ/מִצְרָ֑יִם וַ/יּוֹצִיאֵ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: fr
  text: 'Alors[a], tu diras à ton fils : « Nous étions esclaves du pharaon en Égypte, et Yahweh nous a fait sortir d’Égypte d’une main puissante[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et tu diras ». La conjonction hébraïque peut être rendue simplement par « et » ; « alors » met en évidence la suite logique avec la question du verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « d’une main forte ». Cette expression hébraïque évoque l’action puissante par laquelle Yahweh délivre son peuple.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Alors, tu diras
  rationale: La conjonction וְ poursuit ici la séquence d’instructions amorcée par la question du verset précédent. « Alors » rend clairement cet enchaînement en français, tandis que le futur garde la valeur directive de la forme hébraïque.
- source_word: לְבִנְךָ
  choice: à ton fils
  rationale: Le texte hébreu emploie explicitement le masculin singulier בִנְךָ, « ton fils » ; il n’est donc pas neutralisé en « ton enfant ».
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: Nous étions esclaves du pharaon
  rationale: Dans le contexte de l’Exode, עֲבָדִים désigne une condition réelle d’asservissement. « Esclaves » en restitue mieux la force que « serviteurs », et « du pharaon » exprime naturellement la relation de sujétion marquée par לְ.
- source_word: וַיּוֹצִיאֵנוּ
  choice: nous a fait sortir
  rationale: Le hiphil de יצא signifie « faire sortir ». Cette formulation française conserve la valeur causative du verbe et l’action libératrice attribuée à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main puissante
  rationale: L’expression conserve l’image hébraïque de la main tout en employant une collocation française naturelle. « Puissante » communique ici la force irrésistible de l’acte de délivrance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom propre divin. Le rendre par « Yahweh » préserve cette donnée sans lui substituer un titre.
- issue: Nature de la condition exprimée par עֲבָדִים
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte égyptien décrit l’asservissement d’Israël. « Esclaves » maintient le poids historique et théologique de la délivrance sans atténuer cette condition.
- issue: Image de la main dans בְּיָד חֲזָקָה
  choice: d’une main puissante
  alternative: avec puissance
  rationale: Le maintien de l’image corporelle respecte l’expression hébraïque et son motif théologique, sans la réduire à une abstraction.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque. « Du pharaon » traite le terme comme un titre en français courant ; l’image traditionnelle de la main est conservée sous une forme idiomatique.
