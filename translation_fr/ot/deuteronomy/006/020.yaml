    issue: 'Construction finale ambiguë : « que Yahweh notre Dieu vous a commandés »'
    rationale: 'Le relatif « que » renvoie aux trois catégories de prescriptions, tandis que « vous » représente les destinataires pluriels de l’ordre. En français moderne, « commander quelqu’un » signifie aussi donner un ordre à cette personne, ce qui rend la relation entre les lois et les destinataires obscure. « vous a commandé de suivre » conserve le rapport : Yahweh a ordonné à la communauté d’observer ces dispositions.'
