base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: fr
  text: 'Quand, plus tard[a], ton fils te demandera : « Que sont les témoignages, les prescriptions et les règles de droit que Yahweh notre Dieu vous a commandé de suivre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « demain » ; ici, le mot hébreu désigne idiomatiquement un temps futur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִשְׁאָלְךָ
  choice: Quand … te demandera
  rationale: Dans ce cadre d’instruction, כִּי présente une éventualité future attendue. Le futur français rend naturellement l’inaccompli hébreu.
- source_word: בִנְךָ
  choice: ton fils
  rationale: Le terme hébreu est explicitement masculin singulier; la traduction en conserve le genre et le nombre.
- source_word: מָחָר
  choice: plus tard
  rationale: Littéralement « demain », מָחָר désigne ici idiomatiquement un temps futur; « plus tard » est naturel en français et conserve cette portée temporelle.
- source_word: לֵאמֹר
  choice: introduit directement la citation
  rationale: L’infinitif hébreu introduit le contenu de la demande. En français actuel, les deux-points évitent le lourd « en disant » sans perdre sa fonction.
- source_word: מָה
  choice: Que sont
  rationale: Cette formulation reste proche de la question hébraïque et préserve son ouverture, sans expliciter à tort « que signifient ».
- source_word: הָעֵדֹת
  choice: les témoignages
  rationale: « Témoignages » maintient la valeur testimoniale et l’identité propre de ce premier terme de la triade juridique.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: « Prescriptions » désigne des dispositions établies et se distingue clairement des deux termes voisins.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles de droit
  rationale: Le terme renvoie ici aux décisions ou normes juridiques. « Règles de droit » exprime cette nuance en français moderne sans le confondre avec « prescriptions ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La construction possessive est rendue directement et conserve la relation d’alliance.
- source_word: צִוָּה … אֶתְכֶם
  choice: vous a commandés
  rationale: Le complément hébreu est à la deuxième personne du pluriel. Le participe passé s’accorde en français avec les trois noms masculins pluriels placés avant lui.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Genre du terme filial בִנְךָ
  choice: ton fils
  alternative: ton enfant
  rationale: L’hébreu porte explicitement le masculin singulier; il n’est donc pas neutralisé.
- issue: Portée de מָה dans la question
  choice: Que sont
  alternative: Que signifient
  rationale: L’hébreu demande littéralement ce que sont ces dispositions. La formulation retenue préserve l’ambiguïté entre leur définition, leur contenu et leur portée, plutôt que de réduire la question à leur seule signification.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond au père interpellé, tandis que « vous » conserve le pluriel hébreu désignant la communauté à laquelle les commandements ont été donnés. La triade juridique reste différenciée.
