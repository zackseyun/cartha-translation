source:
  edition: WLC
  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: fr
  text: afin que tu craignes Yahweh ton Dieu[a] en observant toutes ses prescriptions et tous ses commandements que je t’ordonne — toi, ton fils et le fils de ton fils[b] — tous les jours de ta vie, et afin que tes jours soient prolongés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu révères Yahweh ton Dieu ». Le verbe hébreu peut désigner la crainte, mais aussi la révérence et le profond respect.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toi, ton fils et le fils de ton fils ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « afin que tes jours soient longs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit un but ou un résultat; « afin que » en conserve clairement la valeur dans un registre naturel et digne.
- source_word: תִּירָא
  choice: tu craignes
  rationale: Le verbe ירא peut exprimer la crainte, la révérence et l’émerveillement respectueux devant Dieu. « Craindre » préserve toute cette tension biblique sans l’atténuer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement la forme avec suffixe de deuxième personne du singulier et conserve le langage de la relation d’alliance.
- source_word: לִשְׁמֹר
  choice: en observant
  rationale: L’infinitif indique ici comment la crainte de Dieu se manifeste. « En observant » exprime naturellement ce rapport et convient aux prescriptions et aux commandements.
- source_word: חֻקֹּתָיו
  choice: ses prescriptions
  rationale: חֻקּוֹת désigne des règles établies ou des dispositions prescrites. « Prescriptions » reste distinct de « commandements » et est plus transparent en français courant que « statuts » dans ce contexte.
- source_word: מִצְוֺתָיו
  choice: ses commandements
  rationale: Terme usuel et précis qui maintient la distinction lexicale avec חֻקֹּתָיו.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: que je t’ordonne
  rationale: Rend le discours direct de Moïse sans ajouter « aujourd’hui », absent de ce verset. Le présent français convient à la valeur actuelle du participe.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: toi, ton fils et le fils de ton fils
  rationale: Conserve l’insistance sur « toi » et la mention explicite de trois générations, sans généraliser en « enfants et petits-enfants ».
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: tous les jours de ta vie
  rationale: Expression française idiomatique qui suit de près l’image et la portée distributive de l’hébreu.
- source_word: וּלְמַעַן
  choice: et afin que
  rationale: Marque le second but ou résultat tout en conservant sa coordination avec le premier.
- source_word: יַאֲרִכֻן יָמֶיךָ
  choice: tes jours se prolongent
  rationale: Préserve l’image hébraïque des jours qui deviennent longs, sans la paraphraser simplement par « tu vives longtemps ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Yahvé
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement au lieu de le remplacer par un titre.
- issue: Sens de ירא devant Dieu
  choice: craignes
  alternative: révères; éprouves une crainte respectueuse envers
  rationale: Dans ce contexte, la crainte est liée à l’obéissance d’alliance et peut inclure peur, respect, révérence et saisissement. Le choix retenu préserve cette ampleur et cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes hébraïques adressées à chaque membre du peuple. Les tirets mettent en relief la succession des trois générations. La syntaxe conserve les deux propositions de but introduites par לְמַעַן.
