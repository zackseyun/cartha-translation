revisions:
- from: L’Éternel nous a ordonné de mettre en pratique toutes ces prescriptions et de craindre l’Éternel, notre Dieu, afin que nous soyons toujours heureux et qu’il nous garde en vie, comme il le fait aujourd’hui.
  to: L’Éternel nous a ordonné de mettre en pratique toutes ces prescriptions et de craindre l’Éternel, notre Dieu, pour notre bien tous les jours et pour nous garder en vie, comme c’est le cas aujourd’hui.
  rationale: La correction remplace une interprétation trop étroite du « bien » par un équivalent direct et moderne. Elle maintient la succession des infinitifs et le lien de finalité souple du texte hébreu, sans expliciter un système causal ou théologique absent du verset.
