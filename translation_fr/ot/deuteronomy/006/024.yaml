  text: וַ/יְצַוֵּ֣/נוּ יְהוָ֗ה לַ/עֲשׂוֹת֙ אֶת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/ט֥וֹב לָ֨/נוּ֙ כָּל הַ/יָּמִ֔ים לְ/חַיֹּתֵ֖/נוּ כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: fr
  text: L’Éternel nous a ordonné de mettre en pratique toutes ces prescriptions et de craindre l’Éternel, notre Dieu, pour notre bien tous les jours et pour nous garder en vie, comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוֵּנוּ
  choice: nous a ordonné
  rationale: Rend directement le verbe צוה dans ce récit rétrospectif.
- source_word: לַעֲשׂוֹת אֶת כָּל־הַחֻקִּים הָאֵלֶּה
  choice: de mettre en pratique toutes ces prescriptions
  rationale: « Mettre en pratique » exprime naturellement l’obéissance effective visée par עשה; « prescriptions » convient à חֻקִּים sans surcharger le terme d’une nuance juridique moderne.
- source_word: לְיִרְאָה
  choice: de craindre
  rationale: Conserve le terme théologiquement dense « craindre », qui inclut ici révérence et obéissance sans en réduire le sens.
- source_word: לְטוֹב לָנוּ כָּל־הַיָּמִים
  choice: afin que nous soyons toujours heureux
  rationale: Exprime idiomatiquement l’idée de bien durable pour le peuple; « toujours » rend כָּל־הַיָּמִים dans ce contexte.
- source_word: לְחַיֹּתֵנוּ
  choice: qu’il nous garde en vie
  rationale: Rend la forme causative et son sujet implicite, l’Éternel, de façon claire en français.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: comme il le fait aujourd’hui
  rationale: Explicite sobrement la comparaison avec la préservation présente du peuple, implicite en hébreu.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé / le Seigneur
  rationale: Suit l’usage biblique français largement reconnu tout en distinguant le nom divin du titre courant « Seigneur ».
- issue: Rapport entre commandements, crainte de Dieu et bienfait
  choice: Conserver la séquence sans préciser davantage le lien causal
  alternative: Faire de la crainte une conséquence exclusive de l’observance, ou du bienfait une récompense méritée
  rationale: L’hébreu enchaîne plusieurs infinitifs avec לְ et laisse une certaine souplesse syntaxique; la traduction évite d’imposer un système théologique plus précis que le texte.
translation_notes:
  register: Français moderne, clair et digne. La phrase garde le mouvement logique de l’hébreu tout en évitant un calque lourd. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
