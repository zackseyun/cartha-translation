  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ וּ/בְ/כָל מְאֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: fr
  text: Tu aimeras Yahweh, ton Dieu, de tout ton cœur, de toute ton âme[a] et de toute ta force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « âme » peut aussi signifier « vie » ou « personne » tout entière.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « force » est apparenté à l’idée de « beaucoup » ou d’« abondance » ; il peut englober la capacité, l’intensité et les ressources.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Tu aimeras
  rationale: Le qatal qal à la 2e personne masculine singulière, précédé de la conjonction, a ici une valeur prescriptive dans le contexte d’exhortation de l’alliance. Le futur français exprime naturellement un commandement solennel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici, avec le suffixe de la 2e personne du singulier, le Dieu d’Israël.
- source_word: בְּכָל
  choice: de tout / de toute
  rationale: Dans cette construction, בְּכָל exprime l’engagement de la personne entière. La répétition de « de tout/de toute » conserve l’insistance du texte hébreu tout en restant idiomatique en français.
- source_word: לְבָבְךָ
  choice: ton cœur
  rationale: לֵבָב désigne l’intériorité humaine, notamment la pensée et la volonté, et non les seuls sentiments. « Cœur » conserve en français biblique courant cette portée large.
- source_word: נַפְשְׁךָ
  choice: ton âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Âme » maintient le terme traditionnel et la formulation holistique, tandis qu’une note signale l’étendue sémantique de l’hébreu.
- source_word: מְאֹדֶךָ
  choice: ta force
  rationale: מְאֹד, habituellement adverbe d’intensité ou de quantité, est substantivé ici et évoque toute la capacité, l’intensité ou les ressources d’une personne. « Force » est naturel et concis, sans prétendre épuiser cet idiome inhabituel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel du Dieu d’Israël plutôt que de le remplacer par un titre.
- issue: Portée anthropologique de « cœur, âme, force »
  choice: Conserver les trois expressions qui se chevauchent
  alternative: Les répartir en facultés modernes distinctes ou expliciter « pensée, vie et biens »
  rationale: Ces termes décrivent ensemble la totalité de l’engagement humain sans établir nécessairement une division technique de la personne. La traduction maintient ce chevauchement et les notes préservent les possibilités lexicales.
translation_notes:
  register: Français moderne, international et digne. Le futur « Tu aimeras » garde la force solennelle du commandement. La structure répétée « de tout… de toute… de toute… » reproduit l’insistance hébraïque sans lourdeur excessive.
