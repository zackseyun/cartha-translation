revisions:
- from: Et il nous a fait sortir de là pour nous faire entrer dans ce pays et nous le donner, comme il l’avait juré à nos pères[a].
  to: Et il nous a fait sortir de là afin de nous faire entrer et de nous donner le pays qu’il avait juré de donner à nos pères[a].
  rationale: La révision conserve le but exprimé par לְמַעַן, le contraste « faire sortir / faire entrer », le don du pays et le caractère assermenté de l’engagement. Elle remplace une formulation française moins précise par une relative naturelle qui explicite l’objet sous-entendu de « jurer » sans ajouter de contenu théologique ou historique.
