base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: fr
  text: Et il nous a fait sortir de là afin de nous faire entrer et de nous donner le pays qu’il avait juré de donner à nos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à nos ancêtres ». Hébreu : « à nos pères ».'
    reason: 'Alternative lexicale : « ancêtres » peut exprimer le sens collectif, tandis que le texte hébreu emploie explicitement « pères ».'
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא
  choice: Et il nous a fait sortir
  rationale: Le complément antéposé est intégré à une tournure française naturelle. « Faire sortir » rend précisément le hiphil de יצא, tandis que « Et » maintient la continuité du discours.
- source_word: מִשָּׁם
  choice: de là
  rationale: Rendu locatif direct, idiomatique et fidèle.
- source_word: לְמַעַן
  choice: pour
  rationale: L’infinitif introduit par « pour » exprime clairement le but en français moderne.
- source_word: הָבִיא אֹתָנוּ
  choice: nous faire entrer
  rationale: Le hiphil de בוא exprime ici l’action de faire entrer. Cette formulation conserve le contraste avec « faire sortir ».
- source_word: לָתֵת לָנוּ אֶת־הָאָרֶץ
  choice: nous donner ce pays
  rationale: « Donner » rend directement נתן. Dans ce contexte, הָאָרֶץ désigne le pays promis; le démonstratif « ce » reprend naturellement la destination implicite de « faire entrer ».
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: comme il l’avait juré
  rationale: « Jurer » conserve la force du serment d’alliance. Le plus-que-parfait situe naturellement ce serment avant la sortie d’Égypte, sans en modifier le contenu.
- source_word: לַאֲבֹתֵינוּ
  choice: à nos pères
  rationale: Le rendu conserve la formulation masculine explicite de l’hébreu et son lien contextuel avec les pères d’Israël; « ancêtres » reste une possibilité lexicale signalée en note.
theological_decisions:
- issue: Référence genrée de לַאֲבֹתֵינוּ
  choice: à nos pères
  alternative: à nos ancêtres
  rationale: L’hébreu emploie le masculin pluriel et renvoie, dans ce contexte d’alliance, aux pères d’Israël. Le texte principal conserve cette précision, tout en donnant l’équivalent plus général en note.
- issue: Valeur du serment dans נִשְׁבַּע
  choice: comme il l’avait juré
  alternative: comme il l’avait promis
  rationale: « Jurer » préserve explicitement le caractère solennel et assermenté de l’engagement divin, que le simple verbe « promettre » atténuerait.
translation_notes:
  register: Français international moderne, fluide et digne. Le parallélisme « fait sortir / faire entrer » est maintenu, ainsi que le vocabulaire du serment. La formulation évite une répétition lourde de « donner » tout en préservant les relations de but et de promesse.
