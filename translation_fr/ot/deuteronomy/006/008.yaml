source:
  edition: WLC
  text: וּ/קְשַׁרְתָּ֥/ם לְ/א֖וֹת עַל יָדֶ֑/ךָ וְ/הָי֥וּ לְ/טֹטָפֹ֖ת בֵּ֥ין עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: fr
  text: Tu les attacheras comme un signe sur ta main, et ils seront comme des bandeaux entre tes yeux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des ornements frontaux ». Le terme hébreu est rare et son sens exact est incertain. Il a aussi été traditionnellement compris comme désignant les « phylactères », petites boîtes portées dans la pratique juive ultérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Tu les attacheras
  rationale: Le verbe concret קָשַׁר signifie « attacher, lier ». Dans cette suite d’instructions, la forme verbale se rend naturellement par le futur à valeur injonctive. Le pronom « les » reprend les paroles mentionnées dans le contexte précédent.
- source_word: לְאוֹת
  choice: comme un signe
  rationale: אוֹת désigne couramment un signe ou une marque. « Comme un signe » exprime ici la fonction symbolique sans préciser davantage la nature de la pratique.
- source_word: עַל יָדֶךָ
  choice: sur ta main
  rationale: יָד signifie d’abord « main », même s’il peut parfois inclure le bras. La traduction retient le sens lexical direct sans introduire cette interprétation possible.
- source_word: וְהָיוּ
  choice: et ils seront
  rationale: Le verbe poursuit la séquence injonctive et maintient le parallélisme avec « tu les attacheras ». Le pluriel renvoie aux paroles du contexte.
- source_word: לְטֹטָפֹת
  choice: comme des bandeaux
  rationale: טֹטָפֹת est un terme rare dont le référent exact demeure incertain, mais qui désigne traditionnellement quelque chose porté sur le devant de la tête. « Bandeaux » conserve l’image d’un objet porté sans importer directement la pratique juive plus tardive des phylactères.
- source_word: בֵּין עֵינֶיךָ
  choice: entre tes yeux
  rationale: La traduction reproduit l’expression hébraïque concrète et imagée. « Sur ton front » serait plus explicatif et réduirait l’ambiguïté du texte.
theological_decisions:
- issue: Le commandement décrit-il une pratique corporelle littérale, une image de la mémoire intérieure, ou les deux ?
  choice: Conserver les images corporelles concrètes sans trancher leur portée
  alternative: Paraphraser comme une invitation au souvenir constant, ou identifier explicitement les objets aux phylactères de la pratique juive ultérieure
  rationale: L’hébreu emploie un langage matériel tout en laissant ouverte sa portée. La traduction préserve donc cette tension et signale seulement en note l’interprétation traditionnelle plus précise.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne du singulier. Le futur conserve la force injonctive de la séquence sans alourdir la phrase.
