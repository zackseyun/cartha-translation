  text: וְ/הָי֞וּ הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם עַל לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: fr
  text: Et ces paroles que je te commande aujourd’hui seront sur ton cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ton cœur ». L’hébreu dit littéralement « sur ton cœur », expression qui évoque le fait de garder continuellement ces paroles dans sa vie intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: seront
  rationale: Le parfait qal précédé de la conjonction prend ici, dans la suite du contexte exhortatif, une valeur prospective et injonctive. « Seront » conserve cette forme sans durcir inutilement en obligation explicite.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: דְּבָרִים désigne ici les paroles que Moïse transmet. « Paroles » préserve mieux la forme lexicale que « commandements », plus interprétatif.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le relatif français « que » relie naturellement « ces paroles » au verbe dont elles sont l’objet.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant peut porter une légère emphase, mais le français n’exige pas ici une tournure comme « moi-même », qui surtraduirait probablement le texte.
- source_word: מְצַוְּךָ
  choice: je te commande
  rationale: Le participe exprime l’acte de commandement en cours dans le discours. Le présent français rend naturellement cette immédiateté.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français moderne qui maintient l’immédiateté déictique de l’adresse de Moïse.
- source_word: עַל לְבָבֶךָ
  choice: sur ton cœur
  rationale: « Sur » correspond directement à עַל et conserve l’image hébraïque, tandis que la note précise le sens idiomatique intérieur.
theological_decisions:
- issue: Portée anthropologique de לְבָב
  choice: cœur
  alternative: esprit ; être intérieur
  rationale: Dans l’anthropologie hébraïque, le cœur englobe la pensée, la volonté et les affections. Garder « cœur » préserve cette ampleur et évite de limiter le sens à l’intellect.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme à un interlocuteur collectif. L’image « sur ton cœur » est volontairement maintenue et éclairée par une note.
