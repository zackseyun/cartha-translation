source:
  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: fr
  text: car Yahweh, ton Dieu, qui est au milieu de toi, est un Dieu jaloux[a] ; de peur que la colère de Yahweh, ton Dieu, ne s’enflamme contre toi et qu’il ne te détruise de la surface de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un Dieu plein de zèle ». L’hébreu souligne que Yahweh revendique l’attachement exclusif de son peuple dans le cadre de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « de dessus la face du sol » : expression hébraïque indiquant une disparition complète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction formulée au verset précédent.
- source_word: אֵל קַנָּא
  choice: un Dieu jaloux
  rationale: Exprime l’exigence d’exclusivité de Yahweh dans l’alliance et son refus de tout culte rival. « Jaloux » préserve la force et la tension du terme hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend le nom avec son suffixe masculin singulier de deuxième personne.
- source_word: בְּקִרְבֶּךָ
  choice: qui est au milieu de toi
  rationale: Exprime la présence de Dieu au sein de son peuple tout en s’intégrant naturellement à la syntaxe française.
- source_word: פֶּן
  choice: sinon
  rationale: Introduit avec naturel en français la conséquence redoutée qui menace si l’interdiction précédente est transgressée.
- source_word: יֶחֱרֶה אַף
  choice: la colère … s’enflammera
  rationale: Conserve la métaphore hébraïque d’une colère qui brûle ou s’embrase.
- source_word: בָּךְ
  choice: contre toi
  rationale: La préposition prend ici un sens adversatif avec le verbe exprimant la colère.
- source_word: וְהִשְׁמִידְךָ
  choice: et il te fera disparaître
  rationale: Le hiphil de שׁמד désigne une destruction ou suppression complète; cette formulation française rend à la fois la causalité et l’idée d’élimination.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface de la terre
  rationale: Rend idiomatiquement l’image hébraïque d’une disparition totale de dessus le sol ou la terre.
theological_decisions:
- issue: La jalousie divine
  choice: un Dieu jaloux
  alternative: un Dieu passionné / plein de zèle
  rationale: Le terme décrit l’exclusivité de la relation d’alliance, non une envie pécheresse. « Jaloux » maintient la catégorie biblique et sa tension théologique sans l’atténuer.
- issue: Le nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel révélé à Israël au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et solennel. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme unité collective. « Sinon » restitue naturellement la valeur d’avertissement de פֶּן, tandis que « s’enflammera » conserve l’image hébraïque.
