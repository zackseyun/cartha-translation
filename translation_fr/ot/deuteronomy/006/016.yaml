  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: fr
  text: Vous ne mettrez pas à l’épreuve Yahweh votre Dieu[a], comme vous l’avez mis à l’épreuve à Massa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous ne tenterez pas Yahweh votre Dieu. » Ici, le verbe signifie mettre Dieu à l’épreuve, exiger qu’il prouve sa présence ou sa fidélité.'
    reason: lexical_alternative
  - marker: b
    text: Massa est le lieu où les Israélites ont mis Yahweh à l’épreuve dans le désert (Exode 17.1-7). Ce nom est apparenté au verbe hébreu signifiant « mettre à l’épreuve ».
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: Vous ne mettrez pas à l’épreuve
  rationale: La négation לֹא avec l’inaccompli à la 2e personne du pluriel exprime ici une interdiction. « Mettre à l’épreuve » rend naturellement le piel de נסה et convient à l’avertissement d’ordre relationnel et religieux.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin, plutôt que par un titre de substitution.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le nom avec suffixe de la 2e personne du pluriel appelle directement cette formulation.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit simplement la comparaison avec l’événement passé.
- source_word: נִסִּיתֶם
  choice: vous l’avez mis à l’épreuve
  rationale: La reprise de la même expression française préserve le lien lexical avec תְנַסּוּ; le pronom « l’ » explicite en français l’objet sous-entendu du verbe dans la seconde proposition.
- source_word: בַּמַּסָּה
  choice: à Massa
  rationale: Massa est conservé comme nom de lieu; son association étymologique avec l’idée d’épreuve est expliquée en note plutôt qu’ajoutée au texte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin; sa transcription préserve cette donnée sans lui substituer un titre.
- issue: Nature de l’épreuve interdite
  choice: mettre à l’épreuve
  alternative: tenter
  rationale: « Mettre à l’épreuve » conserve l’idée de tester Dieu sans réduire le sens à la seule incitation au mal, que « tenter » pourrait suggérer en français moderne.
- issue: Allusion à Exode 17
  choice: Conserver seulement le nom « Massa » dans le texte
  alternative: à Massa, le lieu de l’épreuve
  rationale: L’hébreu donne le toponyme sans développement explicatif; le contexte historique et le jeu de sens relèvent donc d’une note.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative (« Vous ne mettrez pas ») conserve la forme solennelle de l’interdiction; la répétition de « mettre à l’épreuve » reproduit celle du verbe hébreu.
