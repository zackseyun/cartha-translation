  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: fr
  text: Tu craindras Yahweh, ton Dieu[a] ; c’est lui que tu serviras[b], et par son nom tu prêteras serment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu révéreras Yahweh, ton Dieu » ; le verbe hébreu évoque une crainte mêlée de profond respect et de saisissement, et non une simple terreur.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu l’adoreras » ; le verbe hébreu signifie couramment « servir » et inclut ici le service rendu à Dieu dans le culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: La forme avec suffixe masculin singulier appelle naturellement « ton Dieu » dans cette adresse individuelle à Israël.
- source_word: תִּירָא
  choice: tu craindras
  rationale: Le verbe exprime ici une crainte révérencielle mêlant respect, saisissement et conscience de la sainteté divine ; « craindre » en conserve toute la force.
- source_word: וְאֹתוֹ
  choice: c’est lui que
  rationale: La tournure disloquée rend naturelle en français l’insistance portée par le pronom objet hébreu, sans ajouter « seul », qui n’est pas explicite dans ce verset.
- source_word: תַעֲבֹד
  choice: tu serviras
  rationale: « Servir » préserve l’étendue du verbe עבד, qui comprend ici le service cultuel et l’obéissance de l’alliance sans se limiter à l’acte liturgique.
- source_word: וּבִשְׁמוֹ
  choice: et c’est par son nom
  rationale: Dans le contexte d’un serment, ב indique le nom invoqué comme autorité ou garant ; « par son nom » est idiomatique et précis.
- source_word: תִּשָּׁבֵעַ
  choice: tu prêteras serment
  rationale: Cette expression française actuelle rend clairement le niphal de שׁבע et évite l’ambiguïté moderne de « jurer », qui peut aussi désigner l’emploi de jurons.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: La particule signale le complément d’objet direct défini et se reflète dans la syntaxe française sans équivalent lexical autonome.
theological_decisions:
- issue: Faut-il atténuer la crainte de Dieu en la rendant seulement par le respect ou la vénération ?
  choice: Conserver « craindras » dans le texte principal
  alternative: « révéreras » ou « éprouveras un profond respect pour »
  rationale: Le verbe hébreu ne désigne pas une simple terreur, mais « révérer » seul risquerait d’en atténuer le poids. « Craindre » maintient la tension entre respect, saisissement, obéissance et sainteté.
- issue: Faut-il traduire עבד par « servir » ou par « adorer » ?
  choice: Traduire par « serviras »
  alternative: « adoreras »
  rationale: Le commandement porte sur la fidélité concrète à Dieu et comprend une dimension cultuelle. « Servir » conserve cette ampleur, tandis que « adorer » pourrait restreindre le sens au culte.
- issue: Faut-il expliciter l’exclusivité par « lui seul » ?
  choice: Ne pas ajouter « seul »
  alternative: « c’est lui seul que tu serviras »
  rationale: L’exclusivité est fortement suggérée par le contexte et l’insistance du pronom, mais le mot « seul » n’est pas exprimé dans ce verset ; l’ajouter résoudrait implicitement ce que le texte laisse contextuel.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur injonctive convient au style de l’exhortation législative. Les structures « c’est lui que » et « c’est par son nom que » restituent l’insistance hébraïque avec naturel. « Prêter serment » est préféré à « jurer » pour sa précision en français contemporain.
