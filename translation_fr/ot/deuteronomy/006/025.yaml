  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: fr
  text: Ce sera notre justice[a], si nous veillons à mettre en pratique tout ce commandement[b] devant Yahweh, notre Dieu, comme il nous l’a ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « notre droiture » ou « ce qui est juste pour nous ». Le mot hébreu peut désigner la justice, la droiture ou ce qui est reconnu comme juste.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce commandement tout entier ». Le singulier peut présenter l’ensemble de l’instruction comme un tout.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: la justice
  rationale: צְדָקָה désigne ici ce qui est juste ou droit dans le cadre de l’alliance. « La justice » conserve en français la portée morale et relationnelle du terme sans introduire une formulation doctrinale plus tardive.
- source_word: תִּהְיֶה לָּנוּ
  choice: ce sera pour nous
  rationale: 'Cette formulation garde la structure prédicative de l’hébreu : « ce sera pour nous la justice », sans expliciter par « sera compté » un mécanisme que le texte ne précise pas.'
- source_word: כִּי
  choice: si
  rationale: Dans ce contexte, כִּי introduit la condition à laquelle l’affirmation précédente se vérifie. « Si » exprime clairement cette relation en français.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: nous veillons à mettre en pratique
  rationale: שׁמר exprime l’attention vigilante, tandis que עשה indique l’accomplissement concret. L’expression française rend les deux éléments naturellement.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: tout ce commandement
  rationale: Le singulier présente vraisemblablement l’instruction comme un ensemble unifié. La formulation reste proche de l’hébreu, quoique « ce commandement tout entier » soit aussi possible.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » rend directement l’idée d’agir en présence de Dieu et sous son regard.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Traduction directe qui conserve la relation d’alliance exprimée par le suffixe possessif.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: comme il nous l’a ordonné
  rationale: Le passé composé renvoie naturellement en français au commandement déjà donné; le pronom « l’ » reprend l’instruction mentionnée.
theological_decisions:
- issue: Sens de צְדָקָה dans le contexte de l’obéissance à l’alliance
  choice: La mise en pratique fidèle du commandement « sera pour nous la justice », sans préciser davantage le mécanisme théologique.
  alternative: « Cela nous sera compté comme justice » ou « ce sera pour nous un titre de justice ».
  rationale: L’hébreu établit un lien réel entre l’obéissance et la justice dans le cadre de l’alliance, mais ne formule pas explicitement une doctrine technique d’imputation. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Veiller à mettre en pratique » exprime naturellement l’attention et l’action contenues dans les deux verbes hébreux. La tournure volontairement inhabituelle « ce sera pour nous la justice » préserve la structure et l’ambiguïté théologique du texte source.
