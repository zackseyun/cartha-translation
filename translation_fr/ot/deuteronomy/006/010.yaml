  text: וְ/הָיָ֞ה כִּ֥י יְבִיאֲ/ךָ֣ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֜רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ֣/תֶת לָ֑/ךְ עָרִ֛ים גְּדֹלֹ֥ת וְ/טֹבֹ֖ת אֲשֶׁ֥ר לֹא בָנִֽיתָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: fr
  text: Quand Yahweh, ton Dieu, t’aura fait entrer dans le pays qu’il a juré à tes pères[a] — à Abraham, à Isaac et à Jacob — de te donner, avec de grandes et belles villes que tu n’as pas bâties,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tes ancêtres ». L’hébreu dit littéralement « à tes pères » et nomme ici Abraham, Isaac et Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La construction introduit une circonstance future. « Quand » est naturel en français et, avec le futur antérieur, conserve cette orientation sans reproduire lourdement « et il arrivera que ».
- source_word: יְבִיאֲךָ
  choice: t’aura fait entrer
  rationale: Le hifil de בוא exprime ici la causation, « faire entrer ». Le futur antérieur convient à la subordonnée temporelle française et situe l’action avant la suite attendue de la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier marque directement la possession; le tutoiement singulier correspond à l’adresse hébraïque.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire où Israël doit entrer. « Pays » est naturel en français moderne tout en gardant la portée territoriale et promise du terme.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: qu’il a juré
  rationale: Le nifal de שׁבע signifie « jurer, prêter serment ». La formulation maintient explicitement la notion de serment.
- source_word: לַאֲבֹתֶיךָ
  choice: à tes pères
  rationale: Le terme masculin pluriel renvoie ici précisément aux patriarches nommés ensuite. « Pères » en préserve la spécificité, contrairement au terme plus général « ancêtres ».
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: Les noms suivent les formes françaises usuelles; la préposition répétée dans l’hébreu est conservée pour chaque patriarche.
- source_word: לָתֶת לָךְ
  choice: de te donner
  rationale: L’infinitif exprime ce que Yahweh a juré de faire; cette construction est directe et idiomatique en français.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: de grandes et belles villes
  rationale: גְּדֹלֹת exprime la grandeur ou la taille; טֹבֹת indique ici la qualité désirable. « Belles » rend naturellement cette appréciation en français sans imposer l’idée plus précise de prospérité.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: que tu n’as pas bâties
  rationale: La proposition relative négative est rendue directement; « bâtir » convient au complément « villes » et l’accord du participe est requis en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve comme nom plutôt que de le remplacer par un titre.
- issue: Terme de parenté לַאֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Abraham, Isaac et Jacob précisent immédiatement le référent masculin et patriarcal. « Tes pères » préserve cette précision, tandis que « tes ancêtres » reste une possibilité française plus générale signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. La virgule finale est maintenue parce que le verset se prolonge syntaxiquement au verset suivant.
