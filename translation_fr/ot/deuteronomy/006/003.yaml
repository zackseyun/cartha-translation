base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: fr
  text: Écoute, Israël, et veille à mettre cela en pratique, afin que tout aille bien pour toi et que vous deveniez très nombreux dans un pays ruisselant de lait et de miel, comme Yahweh, le Dieu de tes pères[a], te l’a dit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu de tes ancêtres ». L’hébreu dit littéralement « tes pères ».
    reason: lexical_alternative
  - marker: b
    text: 'La formulation hébraïque est condensée. On peut aussi comprendre : « comme Yahweh, le Dieu de tes pères, te l’a promis : un pays ruisselant de lait et de miel ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: Écoute donc
  rationale: Le verbe שׁמע peut signifier entendre, écouter ou obéir. « Écoute » conserve l’image hébraïque, tandis que l’appel à l’obéissance ressort de la proposition suivante. « donc » marque naturellement en français le lien avec les prescriptions précédentes.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: veille à mettre cela en pratique
  rationale: La construction associe l’idée de garder avec celle de faire. Cette formulation française exprime une observance attentive qui conduit à l’action; « cela » reprend collectivement l’instruction donnée dans le contexte.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: afin que tout aille bien pour toi
  rationale: Cette tournure restitue naturellement l’idiome deutéronomique exprimant le bien-être et la faveur qui en résulte.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: et que vous deveniez très nombreux
  rationale: רבה désigne ici l’accroissement numérique du peuple. Le pluriel « vous » respecte le passage du singulier collectif adressé à Israël au pluriel hébreu dans cette proposition.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme … te l’a dit
  rationale: « A dit » conserve le sens verbal de דבר sans l’expliciter systématiquement par « promis », même si le contexte est celui d’une promesse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: le Dieu de tes pères
  rationale: « Pères » correspond directement au pluriel masculin hébreu, tout en laissant « ancêtres » comme possibilité de sens en note.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays ruisselant de lait et de miel
  rationale: Cette expression française naturelle conserve l’image abondante de la formule hébraïque traditionnelle.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Portée de אבותיך
  choice: tes pères
  alternative: tes ancêtres
  rationale: Le choix principal reste formellement proche du terme masculin hébreu, tandis que la note signale sa portée généalogique possible.
- issue: Lien syntaxique de « un pays ruisselant de lait et de miel »
  choice: rattachement au lieu où Israël deviendra très nombreux et connaîtra le bien
  alternative: apposition au contenu de la parole ou de la promesse divine
  rationale: La syntaxe hébraïque est condensée. Le texte principal suit le lien locatif le plus naturel, sans supprimer l’autre analyse, conservée en note.
translation_notes:
  register: Français international actuel, clair et digne. Le verset conserve le passage hébreu du singulier collectif (« toi ») au pluriel (« vous »), qui met en relief Israël à la fois comme unité et comme peuple nombreux. La ponctuation évite de résoudre trop fortement la syntaxe finale, explicitée en note.
