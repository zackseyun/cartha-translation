revisions:
- from: Écoute donc, Israël, et veille à mettre cela en pratique, afin que tout aille bien pour toi et que vous deveniez très nombreux, comme Yahweh, le Dieu de tes pères[a], te l’a dit, dans un pays ruisselant de lait et de miel.[b]
  to: Écoute, Israël, et veille à mettre cela en pratique, afin que tout aille bien pour toi et que vous deveniez très nombreux dans un pays ruisselant de lait et de miel, comme Yahweh, le Dieu de tes pères[a], te l’a dit.[b]
  rationale: Le complément « dans un pays… » est placé auprès de la prospérité et de la multiplication, afin qu’il ne modifie pas artificiellement « te l’a dit » en français. La note maintient explicitement l’analyse selon laquelle le pays est apposé au contenu de la parole ou de la promesse divine. La suppression de « donc » évite un lien discursif non marqué dans l’hébreu.
