  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: fr
  text: Mais quand vous aurez traversé le Jourdain et que vous habiterez dans le pays que Yahvé, votre Dieu, vous donne en héritage, il vous accordera du repos, à l’abri de tous vos ennemis d’alentour, et vous habiterez en sécurité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous vivrez en sûreté ».'
    reason: Variante lexicale possible pour וִישַׁבְתֶּם בֶּטַח ; le texte principal conserve la répétition de « habiter » présente en hébreu.
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: quand vous aurez traversé
  rationale: Dans cette séquence orientée vers l’avenir, le waw introduit naturellement une circonstance temporelle. Le futur antérieur français situe la traversée avant l’installation et le repos.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme française usuelle du nom propre; le mot « fleuve » n’est pas nécessaire.
- source_word: וִישַׁבְתֶּם בָּאָרֶץ
  choice: vous habiterez dans le pays
  rationale: ישׁב exprime ici une résidence durable. « Habiter » conserve ce sens tout en restant courant, et « pays » convient au territoire promis.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahvé, votre Dieu
  rationale: « Yahvé » rend directement le nom divin, tandis que l’apposition avec virgule est idiomatique en français.
- source_word: מַנְחִיל אֶתְכֶם
  choice: vous donne en héritage
  rationale: Le hiphil de נחל exprime le fait de faire recevoir une possession héréditaire. Cette formulation préserve l’initiative divine et le motif de l’héritage sans calque maladroit.
- source_word: וְהֵנִיחַ לָכֶם
  choice: il vous accordera du repos
  rationale: Le hiphil de נוח signifie procurer repos ou répit. « Accorder du repos » rend clairement l’action bienfaisante de Dieu et maintient le motif biblique du repos.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: face à tous les ennemis qui vous entourent
  rationale: La formulation exprime à la fois la délivrance de tous les ennemis et leur présence alentour, dans un français naturel.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: vous habiterez en sécurité
  rationale: בֶּטַח désigne une condition de confiance et d’absence de danger. « Habiter en sécurité » conserve le lien avec le verbe ישׁב répété dans le verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » représente le nom propre et le distingue du titre אֲדֹנָי.
- issue: Portée du repos accordé par Dieu
  choice: il vous accordera du repos face à tous les ennemis qui vous entourent
  alternative: il vous délivrera de tous les ennemis qui vous entourent
  rationale: Le choix retenu préserve le terme et le motif du « repos » sans les réduire à la seule délivrance militaire, tout en indiquant clairement son rapport aux ennemis.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit la progression temporelle de l’hébreu tout en évitant une accumulation pesante de coordinations. La répétition de « habiter » est conservée parce qu’elle structure le verset.
