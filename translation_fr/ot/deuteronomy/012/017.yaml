  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: fr
  text: Tu ne pourras pas manger dans tes villes[a] la dîme de ton grain, de ton vin nouveau ou de ton huile, ni les premiers-nés de ton gros ou de ton petit bétail, ni aucune des offrandes promises par vœu[b], ni tes offrandes volontaires, ni l’offrande apportée de ta main[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans tes portes », expression hébraïque désignant les villes ou localités d’une personne.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous tes vœux que tu feras ». Dans ce contexte, il s’agit vraisemblablement des offrandes promises par ces vœux.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « la contribution de ta main » ; traditionnellement : « l’offrande élevée de ta main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: Tu ne pourras pas manger
  rationale: Dans ce texte juridique, la tournure avec יכל et l’infinitif exprime une interdiction plutôt qu’une simple incapacité. Le futur français conserve la forme hébraïque tout en portant naturellement cette valeur normative.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Littéralement « dans tes portes », expression qui désigne les localités où se trouvent les portes urbaines. Le sens idiomatique est retenu dans le texte, et l’image littérale est signalée en note.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: la dîme de ton grain
  rationale: « Dîme » est le terme cultuel précis pour la dixième part, et דגן désigne les céréales ou le grain plutôt que les produits agricoles en général.
- source_word: תִּירֹשְׁךָ
  choice: ton vin nouveau
  rationale: תירוש désigne couramment le vin nouveau et se distingue ainsi des termes plus généraux pour le vin.
- source_word: יִצְהָרֶךָ
  choice: ton huile
  rationale: Le mot renvoie principalement à l’huile fraîche, généralement d’olive. « Huile » reste exact sans ajouter une précision absente du texte.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: les premiers-nés de ton gros ou de ton petit bétail
  rationale: Cette formulation française distingue naturellement בקר, le gros bétail, de צאן, le petit bétail composé de moutons et de chèvres, tout en conservant la catégorie des premiers-nés.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: aucune des offrandes promises par vœu
  rationale: נדר désigne lexicalement le vœu, mais, dans cette liste de biens consommables et d’offrandes, le référent est ce qui a été voué. La formulation rend explicite ce sens contextuel sans reproduire en français la répétition peu naturelle « les vœux que tu voueras ».
- source_word: נִדְבֹתֶיךָ
  choice: tes offrandes volontaires
  rationale: Le terme désigne les dons cultuels librement consentis, par opposition aux dons dus ou promis par vœu.
- source_word: תְּרוּמַת יָדֶךָ
  choice: ce que ta main aura prélevé
  rationale: תרומה est une part prélevée et mise à part comme contribution. La traduction conserve la mention concrète de la main sans imposer le terme traditionnel mais obscur « offrande élevée ».
theological_decisions:
- issue: Valeur normative de לֹא תוּכַל
  choice: 'Comprendre la formule comme une interdiction cultuelle : « Tu ne pourras pas manger »'
  alternative: 'La rendre comme une incapacité factuelle : « Tu ne peux pas manger »'
  rationale: Le contexte législatif donne à cette construction une force déontique. La traduction française garde toutefois la formulation modale du texte hébreu plutôt que de la remplacer par un impératif catégorique.
- issue: Sens de נְדָרֶיךָ dans une liste de choses mangées
  choice: « les offrandes promises par vœu »
  alternative: « les vœux que tu prononceras »
  rationale: Un vœu verbal ne se mange pas. Le contexte indique donc les biens ou sacrifices promis par vœu, mais une note conserve la formulation plus littérale et son ambiguïté grammaticale.
- issue: Terminologie des catégories cultuelles
  choice: Distinguer les offrandes promises par vœu, les offrandes volontaires et la part prélevée
  alternative: Uniformiser ces catégories sous le terme générique « dons »
  rationale: Le texte énumère des catégories cultuelles distinctes. Les préserver évite d’aplanir la portée juridique et rituelle du passage.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement singulier conforme à l’adresse hébraïque. Le vocabulaire juridique et cultuel reste précis, mais les expressions opaques sont rendues idiomatiquement et accompagnées de notes lorsque l’image ou l’ambiguïté hébraïque mérite d’être conservée.
