review_pass:
  verdict: revise
  source_fidelity: 'L’ensemble rend fidèlement l’énumération cultuelle et la valeur prohibitive de לֹא תוּכַל. « Dans tes villes » explicite correctement l’idiome « dans tes portes », avec une note appropriée. La dernière expression, toutefois, ne contient ni un futur antérieur ni le verbe « prélever » : תְּרוּמַת יָדֶךָ désigne une contribution/offrande apportée de la main du destinataire.'
  naturalness: Le français est globalement clair, moderne et d’un registre juridique-cultuel approprié. « Ce que ta main aura prélevé » est moins naturel dans cette liste nominale et introduit une temporalité absente de l’hébreu.
  terminology: « Dîme », « vin nouveau », « offrandes promises par vœu » et « offrandes volontaires » maintiennent utilement les distinctions cultuelles. « Offrande apportée de ta main » rend plus justement la contribution cultuelle finale sans recourir au terme traditionnel, plus opaque, d’« offrande élevée ».
  issues:
  - severity: medium
    issue: « ce que ta main aura prélevé » ajoute un futur antérieur et présente la תרומה comme un prélèvement personnel.
    rationale: Le syntagme תְּרוּמַת יָדֶךָ est un nom (« contribution/offrande ») qualifié par « ta main » ; aucune forme verbale ni valeur d’antériorité future n’est exprimée. Une formulation nominale préserve mieux la structure et le sens cultuel.
  - severity: low
    issue: La note c ne reflète pas précisément la formulation révisée et ne donne pas l’équivalent littéral le plus direct.
    rationale: La note doit signaler « la contribution de ta main » comme rendu littéral, puis proposer « offrande élevée » comme terme traditionnel.
