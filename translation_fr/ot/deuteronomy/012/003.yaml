base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: fr
  text: Vous démolirez leurs autels, vous briserez leurs pierres dressées, vous brûlerez leurs ashéras[a] au feu et vous abattrez les images sculptées de leurs dieux[b] ; vous ferez disparaître leur nom de ce lieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs poteaux sacrés ». Le terme hébreu désigne des objets cultuels associés à la déesse Ashéra, sans en préciser ici la forme exacte.
    reason: lexical_alternative
  - marker: b
    text: Ou « les idoles de leurs dieux ». L’hébreu souligne qu’il s’agit de représentations façonnées par taille ou sculpture.
    reason: lexical_alternative
  - marker: c
    text: « Faire disparaître leur nom » signifie supprimer de ce lieu leur présence commémorée et leur souvenir cultuel.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: vous démolirez leurs autels
  rationale: נתץ désigne la démolition d’installations construites ; « démolir » est précis, naturel et énergique en français.
- source_word: שִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: vous briserez leurs pierres sacrées
  rationale: מַצֵּבָה désigne ici une pierre dressée à fonction cultuelle. « Pierres sacrées » exprime clairement l’objet et sa fonction sans suggérer nécessairement une colonne architecturale.
- source_word: אֲשֵׁרֵיהֶם
  choice: leurs ashéras
  rationale: Le terme hébreu désigne des objets cultuels associés à Ashéra. La translittération préserve la spécificité culturelle et l’ambiguïté quant à leur forme exacte ; une note l’explicite.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: vous brûlerez
  rationale: En français, le verbe « brûler » exprime déjà l’action du feu ; ajouter « par le feu » serait possible mais plus lourd, sans apport sémantique nécessaire.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: les statues sculptées de leurs dieux
  rationale: פֶּסֶל désigne une représentation façonnée, notamment par sculpture. « Statues sculptées » conserve la matérialité du terme, contrairement au mot plus interprétatif « idoles ».
- source_word: תְּגַדֵּעוּן
  choice: vous abattrez
  rationale: גדע exprime l’action de couper ou d’abattre. « Abattre » convient aux objets cultuels visés tout en gardant la force du verbe.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: vous ferez disparaître leur nom
  rationale: La construction causative exprime la suppression. Cette formulation française conserve l’image hébraïque du « nom » sans la réduire à la seule destruction d’une inscription.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: de ce lieu
  rationale: Dans l’adresse directe, « ce lieu » rend naturellement le démonstratif hébreu et renvoie au site cultuel évoqué.
theological_decisions:
- issue: Identification des אֲשֵׁרֵיהֶם
  choice: leurs ashéras
  alternative: leurs poteaux sacrés associés à Ashéra
  rationale: La translittération évite d’imposer une forme matérielle unique à des objets cultuels dont la nature exacte demeure discutée, tout en maintenant leur lien avec Ashéra dans la note.
- issue: Nature des פְסִילֵי אֱלֹהֵיהֶם
  choice: les statues sculptées de leurs dieux
  alternative: les idoles de leurs dieux
  rationale: Le choix retenu conserve l’accent hébreu sur le caractère fabriqué et visible de ces représentations, sans substituer au terme concret une qualification théologique générale.
- issue: Portée de l’expression « faire disparaître leur nom »
  choice: conserver l’image du nom dans le texte
  alternative: effacer jusqu’au souvenir de ces dieux en ce lieu
  rationale: Le « nom » peut englober la présence commémorée, invoquée ou cultuelle. Garder la métaphore préserve cette densité et évite de fixer une seule explication dans le corps du verset.
translation_notes:
  register: Français international moderne, solennel mais accessible. La série de futurs injonctifs restitue la force prescriptive du passage. Les verbes concrets et parallèles maintiennent son rythme énergique ; les termes culturellement particuliers ou métaphoriques sont expliqués en notes plutôt que développés dans le texte.
