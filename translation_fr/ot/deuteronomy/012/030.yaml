  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּנָּקֵשׁ֙ אַחֲרֵי/הֶ֔ם אַחֲרֵ֖י הִשָּׁמְדָ֣/ם מִ/פָּנֶ֑י/ךָ וּ/פֶן תִּדְרֹ֨שׁ לֵֽ/אלֹהֵי/הֶ֜ם לֵ/אמֹ֨ר אֵיכָ֨ה יַעַבְד֜וּ הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֶת אֱלֹ֣הֵי/הֶ֔ם וְ/אֶעֱשֶׂה כֵּ֖ן גַּם אָֽנִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: fr
  text: 'Prends garde à toi, de peur de tomber dans le piège en les suivant, après qu’elles auront été éliminées de devant toi, et de peur de t’informer au sujet de leurs dieux en disant : « Comment ces nations servaient-elles leurs dieux ? Moi aussi, je ferai de même. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Prends garde à toi
  rationale: Conserve la tournure réflexive et l’avertissement appuyé de l’hébreu dans un français naturel et digne.
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: de peur de tomber dans le piège en les suivant
  rationale: Le nifal de יקש exprime le fait d’être pris au piège; « en les suivant » rend אַחֲרֵיהֶם sans réduire l’idée à une simple chronologie.
- source_word: אַחֲרֵי הִשָּׁמְדָם מִפָּנֶיךָ
  choice: après qu’elles auront été détruites devant toi
  rationale: Respecte l’antériorité de l’action et rend מִפָּנֶיךָ par l’expression française idiomatique « devant toi ».
- source_word: תִּדְרֹשׁ לֵאלֹהֵיהֶם
  choice: t’informer au sujet de leurs dieux
  rationale: דרש signifie ici rechercher ou s’enquérir des pratiques liées aux dieux; cette formulation préserve l’idée d’investigation sans suggérer nécessairement une invocation cultuelle.
- source_word: אֵיכָה יַעַבְדוּ
  choice: Comment ... servaient-elles
  rationale: L’imparfait français convient à la question portant sur la manière habituelle dont ces nations rendaient un culte à leurs dieux.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: Moi aussi, je ferai de même
  rationale: Rend explicitement l’intention d’imiter ces pratiques et conserve l’emphase de גַּם אָנִי.
theological_decisions:
- issue: Nature du danger évoqué par תִּנָּקֵשׁ
  choice: tomber dans le piège en les suivant
  alternative: être pris au piège à cause d’elles
  rationale: La formulation retenue conserve à la fois la métaphore du piège et la possibilité contextuelle d’une imitation religieuse, sans imposer une interprétation confessionnelle plus précise.
- issue: Portée de l’enquête sur les dieux
  choice: t’informer au sujet de leurs dieux
  alternative: consulter leurs dieux
  rationale: Le contexte décrit une recherche sur la manière de les servir; « consulter » pourrait faire croire que le texte désigne directement un oracle adressé aux divinités, ce que la syntaxe ne requiert pas.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier suit l’adresse hébraïque à Israël envisagé collectivement. La répétition « de peur de » maintient la structure parallèle de l’original.
