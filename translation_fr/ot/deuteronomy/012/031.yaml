  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: fr
  text: 'Tu n’agiras pas ainsi envers Yahweh, ton Dieu, car ces peuples ont pratiqué pour leurs dieux toutes les abominations que Yahweh déteste : ils vont jusqu’à brûler au feu leurs fils et leurs filles pour leurs dieux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  choice: Tu n’agiras pas ainsi
  rationale: Le futur à valeur d’interdiction rend naturellement en français le yiqtol négatif. « Ainsi » conserve le renvoi aux pratiques cultuelles décrites dans le contexte précédent.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: envers Yahweh, ton Dieu
  rationale: La préposition ל exprime ici la relation ou l’orientation cultuelle. « Envers » indique qu’Israël ne doit pas rendre à Yahweh un culte de cette manière, tandis que le singulier « ton » conserve l’adresse covenantale hébraïque.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: toutes les abominations que Yahweh déteste
  rationale: תּוֹעֵבָה porte une condamnation religieuse et morale très forte, bien rendue par « abomination ». Cette formulation française rattache naturellement le relatif à l’ensemble des actes abhorrés sans atténuer שָׂנֵא.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: ces peuples ont pratiqué pour leurs dieux
  rationale: Le sujet pluriel implicite est explicité par « ces peuples » d’après le contexte immédiat afin d’éviter une ambiguïté française. « Pratiqué » convient à des rites établis, et « pour leurs dieux » conserve l’orientation cultuelle marquée par ל.
- source_word: כִּי גַם
  choice: ils vont jusqu’à
  rationale: La tournure exprime naturellement en français l’intensification introduite par גַם et met en relief l’exemple extrême qui suit.
- source_word: אֶת בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: La traduction maintient la mention distincte des enfants des deux sexes au lieu de la généraliser.
- source_word: יִשְׂרְפוּ בָאֵשׁ
  choice: brûler au feu
  rationale: Le yiqtol décrit ici une pratique habituelle. « Brûler au feu » conserve explicitement l’élément בָאֵשׁ et la violence concrète de l’acte.
- source_word: לֵאלֹהֵיהֶם
  choice: pour leurs dieux
  rationale: La préposition ל marque l’orientation ou la destination cultuelle de l’acte; « pour » est idiomatique sans ajouter une théorie précise du sacrifice.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre divin et distingue celui-ci du titre אֲדֹנָי.
- issue: Force de תּוֹעֵבָה et שָׂנֵא
  choice: « abominations » et « déteste »
  alternative: « pratiques odieuses » et « réprouve »
  rationale: Ces termes gardent la vigueur de l’évaluation divine exprimée par l’hébreu, sans l’atténuer ni lui ajouter une qualification doctrinale.
- issue: Rapport syntaxique dans תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: « toutes les abominations que Yahweh déteste »
  alternative: « toute abomination de Yahweh qu’il déteste »
  rationale: Le construit hébreu est compact et peut exprimer ce qui est abominable aux yeux de Yahweh. La formulation retenue est intelligible en français et laisse la proposition relative exprimer explicitement son jugement, sans suggérer que les abominations lui appartiennent.
translation_notes:
  register: Français international actuel, digne et direct. Le tutoiement singulier maintient l’adresse d’alliance à Israël sous la forme du représentant individuel. L’explicitation « ces peuples » reprend le référent contextuel du pluriel hébreu et évite un pronom sans antécédent dans un verset présenté isolément.
