  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: fr
  text: Là, vous mangerez devant Yahweh votre Dieu et vous vous réjouirez de tout ce que vous aurez entrepris, vous et vos familles, et que Yahweh, ton Dieu, t’aura béni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tout votre travail » ou « de tout ce à quoi vous aurez mis la main ». L’expression hébraïque signifie littéralement « de tout l’envoi de votre main » ; elle désigne ce que l’on entreprend ou accomplit.
    reason: Alternative lexicale pour l’idiome מִשְׁלַח יָד, dont le sens couvre les activités, les travaux et les entreprises.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם שָׁם
  choice: Là, vous mangerez
  rationale: Le parfait avec waw prend ici une valeur prospective dans le cadre des prescriptions. « Là » maintient le renvoi au lieu que Yahweh choisira.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: devant Yahweh votre Dieu
  rationale: « Devant » exprime naturellement la présence de Dieu dans ce contexte cultuel, tandis que le nom divin est translittéré « Yahweh ».
- source_word: וּשְׂמַחְתֶּם
  choice: vous vous réjouirez
  rationale: Le futur français rend la valeur prospective et prescriptive, en parallèle avec « vous mangerez ».
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: de tout ce que vous aurez entrepris
  rationale: L’expression hébraïque, littéralement liée au déploiement de la main, désigne les activités, travaux ou entreprises. Cette formulation française restitue l’idiome sans limiter indûment le sens au seul travail manuel.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: vous et vos familles
  rationale: Ici, « maisons » désigne les maisonnées plutôt que les bâtiments. « Familles » est clair et naturel en français courant.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: car Yahweh ton Dieu t’aura béni
  rationale: La proposition relative hébraïque rattache la joie et les entreprises à la bénédiction divine. La tournure causale produit un français naturel tout en conservant le passage intentionnel du pluriel au singulier collectif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel de l’alliance plutôt que de lui substituer un titre.
- issue: Alternance entre adresse plurielle et singulière
  choice: Conserver « vous/votre » puis « ton/t’ »
  alternative: Uniformiser tous les pronoms au pluriel ou au singulier
  rationale: L’hébreu passe des formes plurielles à une forme singulière qui s’adresse collectivement à Israël. Le français permet de préserver cette tension rhétorique, même si le changement est marqué.
- issue: Lien de la bénédiction avec les entreprises
  choice: 'Rendre אֲשֶׁר par une proposition causale: « car »'
  alternative: « par lesquelles Yahweh ton Dieu t’aura béni »
  rationale: La syntaxe hébraïque est compacte et peut rattacher la bénédiction aux entreprises ou expliquer la joie. La formulation causale évite en français de laisser entendre que les entreprises seraient elles-mêmes les instruments de la bénédiction, sans préciser davantage la nature de celle-ci.
translation_notes:
  register: Français international moderne, clair et digne. Le futur convient au caractère prospectif de la prescription. Le passage abrupt du pluriel au singulier est conservé afin de refléter l’adresse collective caractéristique du Deutéronome.
