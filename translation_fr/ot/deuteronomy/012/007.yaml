  to: Là, vous mangerez devant Yahweh votre Dieu et vous vous réjouirez de tout ce que vous aurez entrepris, vous et vos familles, et que Yahweh, ton Dieu, t’aura béni[a].
  rationale: La révision supprime l’explicitation causale introduite par « car » et conserve le rattachement de la bénédiction à l’ensemble des entreprises. Elle maintient le futur antérieur, naturel dans ce cadre prospectif, ainsi que le passage rhétorique du pluriel au singulier collectif. La note est ajustée pour distinguer plus clairement le sens littéral de l’idiome et ses rendus français.
