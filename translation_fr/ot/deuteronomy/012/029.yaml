review_pass:
  verdict: revise
  source_fidelity: La structure temporelle prospective est bien rendue, ainsi que la répétition de ירש par « déposséder ». Toutefois, « retranché devant toi » ne rend pas clairement מִפָּנֶיךָ (« de devant toi »), et « les nations que tu vas déposséder là-bas » laisse « là-bas » sans ancrage naturel et atténue le mouvement vers leur territoire exprimé par בָא שָׁמָּה.
  naturalness: Le français est globalement lisible, mais « déposséder là-bas » sonne elliptique et peu idiomatique. « Les nations dans le pays desquelles tu vas entrer » restitue naturellement le déplacement vers le territoire qu'elles occupent. La phrase demeure volontairement inachevée, conformément à sa continuation au verset 30.
  terminology: « Yahweh », « ton Dieu », « nations », « déposséder » et « pays » sont appropriés. « Retrancher » est possible pour הִכְרִית sans imposer le sens plus précis d'« exterminer ».
  issues:
  - severity: medium
    issue: Rendu imprécis de מִפָּנֶיךָ
    rationale: « Devant toi » peut localiser l'action devant Israël, tandis que la préposition מן exprime le retrait « de devant toi ». La formulation doit expliciter ce mouvement d'éloignement.
  - severity: medium
    issue: Ancrage insuffisant de שָׁמָּה dans « que tu vas déposséder là-bas »
    rationale: Le texte décrit l'entrée d'Israël dans le territoire où se trouvent les nations, en vue de les déposséder. En français, « là-bas » après « déposséder » est ambigu et peu naturel; il convient de rattacher le mouvement au pays des nations.
  revised_text: Lorsque Yahweh, ton Dieu, aura retranché de devant toi les nations dans le pays desquelles tu vas entrer pour les déposséder, et que tu les auras dépossédées et que tu habiteras dans leur pays,
  revised_footnotes: []
