  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: fr
  text: Lorsque Yahweh, ton Dieu, aura retranché de devant toi les nations dans le pays desquelles tu vas entrer pour les déposséder, et que tu les auras dépossédées et que tu habiteras dans leur pays,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Lorsque
  rationale: La conjonction introduit ici la circonstance future qui prépare l’avertissement du verset suivant; « Lorsque » rend naturellement cette valeur temporelle.
- source_word: יַכְרִית
  choice: aura retranché
  rationale: Le hiphil de כרת exprime ici l’élimination des nations de devant Israël. « Retrancher » conserve l’image lexicale sans préciser davantage que le texte l’étendue de cette élimination.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier est rendu directement dans l’expression d’alliance « Yahweh ton Dieu ».
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: « Nations » est le terme français direct et contextuellement approprié pour les peuples qui occupent le pays.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: que tu vas déposséder là-bas
  rationale: Cette formulation garde le mouvement vers le lieu indiqué par שָׁמָּה et rend ירש, dont l’objet est ici les nations, par l’idée de les priver de leur possession.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Cette expression rend de façon concise l’idée que les nations sont ôtées du chemin ou de la présence d’Israël.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: que tu les auras dépossédées
  rationale: La répétition de « déposséder » préserve celle de la racine ירש et maintient les nations comme objet grammatical.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: et que tu habiteras dans leur pays
  rationale: « Habiter » rend naturellement ישב, tandis que « leur pays » conserve le suffixe possessif et le cadre territorial.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le Tétragramme comme nom personnel; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée de יַכְרִית à l’égard des nations
  choice: aura retranché
  alternative: aura exterminé
  rationale: Le choix retenu exprime leur élimination de devant Israël sans imposer au verbe, dans ce seul verset, une précision sur l’ampleur physique de leur destruction.
translation_notes:
  register: Français international moderne, digne et lisible. Le futur antérieur après « Lorsque » clarifie l’antériorité des actions par rapport à l’avertissement qui suit. La virgule finale conserve le caractère syntaxiquement inachevé du verset, qui se poursuit au verset 30.
