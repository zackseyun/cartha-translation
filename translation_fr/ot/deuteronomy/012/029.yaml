- from: Lorsque Yahweh ton Dieu aura retranché devant toi les nations que tu vas déposséder là-bas, que tu les auras dépossédées et que tu habiteras dans leur pays,
  to: Lorsque Yahweh, ton Dieu, aura retranché de devant toi les nations dans le pays desquelles tu vas entrer pour les déposséder, et que tu les auras dépossédées et que tu habiteras dans leur pays,
  rationale: La révision corrige la direction exprimée par מִפָּנֶיךָ et rattache explicitement l'entrée « là-bas » au territoire des nations, sans ajouter de précision sur la nature de leur élimination ni modifier la syntaxe inachevée qui appelle le verset suivant.
