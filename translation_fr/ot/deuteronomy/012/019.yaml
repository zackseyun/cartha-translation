source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲזֹ֖ב אֶת הַ/לֵּוִ֑י כָּל יָמֶ֖י/ךָ עַל אַדְמָתֶֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: fr
  text: Garde-toi d’abandonner le Lévite tant que tu vivras sur ta terre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Lévites » ; l’hébreu emploie le singulier « le Lévite », probablement comme terme représentatif de l’ensemble des Lévites.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans ton pays ». L’hébreu dit littéralement « sur ta terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Garde-toi
  rationale: L’impératif nifal de שׁמר avec לְךָ formule une mise en garde personnelle. « Garde-toi de » est naturel en français soutenu courant et conserve la vigueur de l’hébreu.
- source_word: פֶּן
  choice: de
  rationale: Après « Garde-toi », la construction infinitive négative française rend naturellement l’avertissement introduit par פֶּן, sans recourir à l’archaïsant « de peur que ».
- source_word: תַּעֲזֹב
  choice: abandonner
  rationale: עזב signifie laisser ou abandonner. Ici, « abandonner » exprime clairement le manquement grave au devoir envers le Lévite, sans la coloration vieillie que peut avoir « délaisser ».
- source_word: אֶת הַלֵּוִי
  choice: le Lévite
  rationale: Le nom hébreu est au singulier avec l’article et fonctionne vraisemblablement comme singulier représentatif. Le français conserve cette forme.
- source_word: כָּל יָמֶיךָ
  choice: tant que tu vivras
  rationale: Littéralement « tous tes jours », l’expression désigne toute la durée de la vie. « Tant que tu vivras » est une formulation française naturelle qui en transmet pleinement le sens.
- source_word: עַל אַדְמָתֶךָ
  choice: sur ta terre
  rationale: « Terre » convient au sens territorial et agricole de אֲדָמָה, tandis que « sur » conserve la valeur ordinaire de עַל et demeure idiomatique en français.
theological_decisions:
- issue: Singulier représentatif désignant le Lévite
  choice: le Lévite
  alternative: les Lévites
  rationale: Le texte hébreu emploie le singulier défini, probablement pour représenter l’ensemble de la catégorie. Le conserver évite de remplacer sans nécessité la forme du texte source.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Garde-toi » préserve la force de l’avertissement biblique sans être obscur ; le tutoiement correspond aux formes hébraïques singulières. Les deux appels de note figurent dans le texte.
