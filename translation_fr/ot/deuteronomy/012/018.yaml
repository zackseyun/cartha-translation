  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: fr
  text: 'Mais c’est devant Yahweh ton Dieu que tu le mangeras, au lieu que Yahweh ton Dieu choisira : toi, ton fils, ta fille, ton serviteur, ta servante et le Lévite qui réside dans tes villes[a]. Tu te réjouiras devant Yahweh ton Dieu dans tout ce que tu entreprendras[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans tes portes » ; expression hébraïque désignant les personnes qui vivent dans les villes ou communautés locales.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « dans tout envoi de ta main », c’est-à-dire dans tout ce que tu fais ou entreprends.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais c’est… que
  rationale: Dans le contraste restrictif avec l’interdiction du verset précédent, cette tournure exprime l’unique possibilité permise. La construction française « Mais c’est… que » rend naturellement cette restriction.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: devant Yahweh ton Dieu
  rationale: « Devant » reste proche du sens spatial et relationnel de לִפְנֵי, tandis que « Yahweh » conserve le nom divin.
- source_word: תֹּאכְלֶנּוּ
  choice: tu le mangeras
  rationale: Le futur français convient à la valeur prescriptive de l’imparfait hébreu et conserve le complément masculin singulier renvoyant à ce qui précède.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: au lieu que Yahweh ton Dieu choisira
  rationale: Formulation française naturelle qui conserve le motif deutéronomique du lieu choisi par Dieu; le pronom בּוֹ est implicitement repris dans « au lieu ».
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: ton serviteur, ta servante
  rationale: Les deux termes distincts sont conservés dans une formulation moderne et concise.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: le Lévite qui réside dans tes villes
  rationale: Littéralement « dans tes portes », l’expression désigne les localités relevant de la communauté. « Dans tes villes » en communique clairement le sens civique.
- source_word: וְשָׂמַחְתָּ
  choice: Tu te réjouiras
  rationale: Cette expression préserve la force active, festive et cultuelle du verbe hébreu.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: de tout ce que tu entreprendras
  rationale: L’expression hébraïque, littéralement liée à « l’envoi de la main », désigne l’ensemble des activités ou entreprises d’une personne. Cette traduction en donne le sens idiomatique naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, rendu ici comme nom propre afin de préserver le nom d’alliance sans le remplacer par un titre.
- issue: Portée de la réjouissance dans la dernière proposition
  choice: de tout ce que tu entreprendras
  alternative: dans tout le travail de tes mains
  rationale: La formulation retient le sens large des activités et entreprises sans réduire la bénédiction au seul travail manuel, tout en signalant l’image littérale en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à l’Israélite comme membre du peuple. La longue énumération est conservée, mais divisée en deux phrases pour une lecture naturelle.
