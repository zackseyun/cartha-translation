  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: fr
  text: C’est là que vous apporterez vos holocaustes, vos sacrifices, vos dîmes, les contributions que vous aurez prélevées[a], les offrandes promises par vœu[b], vos offrandes volontaires, ainsi que les premiers-nés de votre gros et de votre petit bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la contribution de votre main »; l’expression souligne ce que chacun met personnellement à part et présente.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vos vœux »; dans cette liste d’offrandes, le mot désigne vraisemblablement ce qui est apporté pour accomplir ces vœux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: vous apporterez
  rationale: Le hiphil de בוא exprime ici l’action de faire venir, donc d’apporter, dans une prescription légale. Le futur français convient naturellement à cette instruction.
- source_word: שָׁמָּה
  choice: C’est là
  rationale: L’adverbe renvoie au lieu de culte indiqué dans le contexte précédent. « C’est là » conserve cette valeur déictique tout en introduisant naturellement la phrase.
- source_word: עֹלֹתֵיכֶם
  choice: vos holocaustes
  rationale: עוֹלָה désigne l’offrande entièrement consumée. « Holocauste » est le terme cultuel français traditionnel et précis, sans suggérer une simple offrande partiellement brûlée.
- source_word: זִבְחֵיכֶם
  choice: vos sacrifices
  rationale: זֶבַח désigne ici les sacrifices d’animaux abattus, distincts des holocaustes. Le terme général « sacrifices » préserve l’étendue du mot hébreu.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: vos dîmes
  rationale: Le nom désigne les parts d’un dixième consacrées; « dîmes » est l’équivalent français usuel et clair.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: les contributions que vous aurez prélevées
  rationale: תְּרוּמָה désigne une contribution mise à part. Cette formulation française rend naturellement l’acte personnel suggéré par « votre main », tandis que la note conserve l’image littérale.
- source_word: נִדְרֵיכֶם
  choice: les offrandes promises par vœu
  rationale: Le nom signifie littéralement « vos vœux », mais, dans cette liste de biens apportés au sanctuaire, il vise les offrandes dues en accomplissement de ces vœux. La note signale l’expression plus littérale.
- source_word: נִדְבֹתֵיכֶם
  choice: vos offrandes volontaires
  rationale: נְדָבָה désigne ce qui est offert librement, par opposition à ce qui est dû à la suite d’un vœu. « Offrandes volontaires » exprime clairement cette distinction.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: les premiers-nés de votre gros et de votre petit bétail
  rationale: בָּקָר et צֹאן opposent les bovins aux ovins et caprins. La paire française « gros et petit bétail » conserve cette distinction sans limiter צֹאן aux seuls moutons.
