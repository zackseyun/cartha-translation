  text: Vous ne mangerez toutefois pas le sang ; vous le verserez sur le sol comme de l’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Seulement
  rationale: Marque la restriction apportée à la permission précédente ; « Seulement » en conserve la force restrictive avec concision.
- source_word: הַדָּם
  choice: le sang
  rationale: L’article hébreu est conservé naturellement et renvoie au sang de l’animal abattu.
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez pas
  rationale: L’imparfait nié exprime ici une interdiction juridique ; le futur français garde le ton direct et solennel de la prescription.
- source_word: עַל הָאָרֶץ
  choice: sur le sol
  rationale: Dans ce contexte d’action concrète, אֶרֶץ désigne le sol plutôt que la terre au sens cosmique ou territorial.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: vous le verserez
  rationale: Le verbe décrit le fait de verser ou répandre, et le suffixe masculin renvoie clairement au sang.
- source_word: כַּמָּיִם
  choice: comme de l’eau
  rationale: Cette formulation française naturelle conserve la comparaison simple du texte hébreu.
theological_decisions:
- issue: Traitement du sang dans la loi alimentaire
  choice: Traduire directement l’interdiction de consommer le sang et l’ordre de le verser sur le sol.
  alternative: Développer une signification symbolique ou théologique du sang.
  rationale: Le verset formule une prescription concrète sans expliciter ici sa portée symbolique ; la traduction n’importe donc aucune interprétation théologique ultérieure.
translation_notes:
  register: Français moderne, clair et digne, avec un futur normatif adapté au registre juridique biblique. La ponctuation conserve le lien étroit entre l’interdiction et l’instruction positive.
