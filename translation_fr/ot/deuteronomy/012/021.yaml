source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: fr
  text: Si le lieu que Yahweh ton Dieu choisira pour y placer son nom est trop éloigné de toi, tu pourras abattre du gros ou du petit bétail que Yahweh t’a donné, comme je te l’ai ordonné, et tu pourras en manger dans tes villes[a] autant que tu le désireras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à l’intérieur de tes portes »; cette expression désigne les villes ou les localités.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon tout le désir de ton être »; autre traduction possible : « selon tout ton appétit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: Si … est trop éloigné de toi
  rationale: כִּי introduit ici une éventualité conditionnelle, et רחק exprime l’éloignement qui motive la permission accordée.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: le lieu que … choisira
  rationale: Dans ce discours législatif, l’inaccompli יִבְחַר vise naturellement le choix futur du lieu du sanctuaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: pour y établir son nom
  rationale: « Établir son nom » rend naturellement l’expression avec שׂים tout en conservant la formule deutéronomique liée au sanctuaire.
- source_word: וְזָבַחְתָּ
  choice: tu pourras abattre
  rationale: Dans ce contexte, זבח désigne l’abattage d’animaux destiné à une consommation profane; la tournure permissive exprime la valeur juridique de la disposition sans suggérer un sacrifice local.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: des bêtes de ton gros et de ton petit bétail
  rationale: Cette formulation française distingue les bovins du menu bétail collectif, qui comprend notamment moutons et chèvres.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: comme je te l’ai ordonné
  rationale: La première personne renvoie à Moïse comme locuteur et à une instruction déjà donnée.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Les « portes » sont ici une métonymie hébraïque désignant les villes ou localités; le sens est rendu directement dans un français actuel.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: autant que tu le désireras
  rationale: Cette expression idiomatique transmet le désir ou l’appétit de la personne entière sans imposer au français un calque peu naturel de נֶפֶשׁ.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Nature de l’abattage autorisé
  choice: abattage profane permis
  alternative: sacrifice obligatoire
  rationale: Le contexte immédiat autorise la consommation locale lorsque le sanctuaire choisi est trop éloigné. « Tu pourras abattre » maintient cette distinction sans nier que זבח puisse avoir ailleurs un sens sacrificiel.
- issue: Portée de « comme je te l’ai ordonné »
  choice: conserver la référence sans préciser son contenu
  alternative: l’expliciter comme des règles particulières d’abattage
  rationale: Le verset ne précise pas à quel commandement antérieur il renvoie; la traduction préserve cette indétermination plutôt que d’importer une interprétation traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque à Israël envisagé comme une unité. Les formulations « gros et petit bétail » et « établir son nom » conservent la texture juridique et cultuelle du passage sans lourdeur excessive.
