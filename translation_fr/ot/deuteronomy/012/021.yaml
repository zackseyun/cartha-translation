  source_fidelity: Le sens conditionnel, l’éloignement du lieu choisi, la permission d’abattre localement, la référence au commandement antérieur et la pleine latitude de consommation sont bien rendus. Une légère révision améliore la correspondance directe avec « mettre son nom » et la formulation du bétail.
  naturalness: Le français est globalement moderne et clair. « Abattre des bêtes de ton gros et de ton petit bétail » est cependant un peu lourd; « abattre du gros ou du petit bétail » est plus idiomatique et garde le sens collectif de l’hébreu.
  terminology: « Yahweh », « gros bétail » et « petit bétail » conviennent. « Placer son nom » rend plus directement שׂים (« mettre, placer ») que « établir son nom », sans perdre la formule cultuelle.
