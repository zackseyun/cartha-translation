  source_fidelity: 'Le texte français rend avec fidélité les principaux éléments de l’hébreu : l’introduction déictique, la distinction entre חֻקִּים et מִשְׁפָּטִים, l’idée d’observance attentive suivie de l’exécution, le pays donné pour être possédé, et la durée de l’obligation. L’alternance réelle du pluriel (תִּשְׁמְרוּן) au singulier (« tes pères », « t’a donné », « tu »), puis au pluriel (« vous »), est correctement préservée et utilement signalée. « Sur la terre » est une traduction recevable de עַל־הָאֲדָמָה, sans imposer indûment l’interprétation plus étroite « dans le pays ».'
