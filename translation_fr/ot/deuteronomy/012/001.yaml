  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: fr
  text: Voici les prescriptions et les règles[a] que vous veillerez à mettre en pratique dans le pays que Yahweh, le Dieu de tes pères, t’a donné[b] pour que tu en prennes possession[c], tous les jours où vous vivrez sur la terre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les décisions de justice ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici le singulier (« tes », « t’ »), puis revient au pluriel (« vous ») à la fin du verset.
    reason: source_feature
  - marker: c
    text: Ou « pour que tu en hérites ».
    reason: lexical_alternative
  - marker: d
    text: Ou « sur le sol »; dans ce contexte, certains comprennent plus précisément « dans le pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Introduit directement et naturellement en français l’ensemble de lois qui suit.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: Terme juridique clair et actuel, qui exprime des dispositions établies tout en restant distinct de מִשְׁפָּטִים.
- source_word: וְהַמִּשְׁפָּטִים
  choice: et les règles
  rationale: Rend le sens normatif du terme dans ce contexte légal; « décisions de justice » demeure une possibilité selon la nuance retenue.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: que vous veillerez à mettre en pratique
  rationale: Conserve à la fois l’idée d’attention vigilante portée par שׁמר et celle d’obéissance concrète portée par עשה.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Désigne ici le territoire promis qu’Israël va prendre en possession.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: le Dieu de tes pères
  rationale: Préserve la formule d’alliance et le singulier de l’adresse hébraïque.
- source_word: לְרִשְׁתָּהּ
  choice: pour que tu en prennes possession
  rationale: Exprime le sens actif fréquent de ירשׁ dans les passages deutéronomiques concernant le pays.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: tous les jours où vous vivrez
  rationale: Rend l’étendue temporelle complète de l’expression et son sujet pluriel.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: Évite la répétition de « pays » et rend ici l’horizon général de la durée de vie, tout en signalant l’autre lecture possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël; la transcription le rend visible sans le remplacer par un titre.
- issue: Alternance entre destinataire singulier et pluriel
  choice: Préserver « tes/t’a/tu » puis « vous »
  alternative: Uniformiser toute l’adresse au pluriel
  rationale: L’hébreu passe réellement du singulier au pluriel dans le verset. Maintenir cette tension grammaticale permet de représenter Israël à la fois comme peuple collectif et comme ensemble d’auditeurs, sans effacer la forme du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique reste précis sans archaïsme excessif. L’alternance hébraïque entre singulier et pluriel est volontairement conservée et explicitée en note.
