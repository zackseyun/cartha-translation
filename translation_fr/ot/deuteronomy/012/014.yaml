source:
  edition: WLC
  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: fr
  text: mais seulement au lieu que Yahweh choisira dans l’une de tes tribus. C’est là que tu offriras tes holocaustes[a], et c’est là que tu feras tout ce que je t’ordonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un holocauste est un sacrifice entièrement brûlé sur l’autel.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: mais seulement
  rationale: Après l’interdiction du verset 13, l’expression introduit l’unique exception permise et conserve à la fois le contraste et la restriction.
- source_word: בַּמָּקוֹם
  choice: au lieu
  rationale: Désigne le lieu précis de culte choisi par Dieu; cette formulation est naturelle en français et conserve la détermination du texte.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh choisira
  rationale: Le futur rend la portée prospective du yiqtol dans ce contexte, tandis que le nom divin est translittéré.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: dans l’une de tes tribus
  rationale: La formulation garde le terme social et covenantiel «tribus» ainsi que l’idée que le lieu se trouvera au sein de l’une d’elles.
- source_word: שָׁם
  choice: c’est là
  rationale: La reprise aux deux endroits préserve l’insistance du texte sur l’unique lieu autorisé et produit un français idiomatique.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: tu offriras tes holocaustes
  rationale: Le hiphil de עלה associé à עֹלָה est une expression sacrificielle; «offrir des holocaustes» est précis, naturel et usuel en français biblique moderne.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: tout ce que je t’ordonne
  rationale: Cette tournure rend clairement la formule de commandement sans alourdir le français; le présent convient à la valeur actuelle du participe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte explicitement le Tétragramme; «Yahweh» préserve le nom propre divin sans le remplacer par un titre.
- issue: Portée centralisatrice du lieu choisi
  choice: Conserver «au lieu… dans l’une de tes tribus» sans préciser un sanctuaire ou une ville
  alternative: au sanctuaire central que Yahweh choisira sur le territoire de l’une de tes tribus
  rationale: Le verset exige un lieu choisi par Yahweh, mais ne le nomme pas ici. La traduction évite donc d’identifier ou de définir davantage ce lieu.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reflète les formes hébraïques adressées collectivement à Israël. La répétition «C’est là… c’est là» conserve l’emphase locative de שָׁם.
