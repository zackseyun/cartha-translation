  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: fr
  text: Veille à observer et à écouter toutes ces paroles que je te prescris[a], afin que tout aille bien pour toi comme pour tes enfants après toi, pour toujours[b], car tu feras ce qui est bon et droit aux yeux de Yahweh, ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Garde et écoute toutes ces paroles ». « Observer » rend ici l’idée de garder soigneusement ces paroles ; l’écoute attentive implique leur mise en pratique dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « tes fils » ; le terme désigne ici plus largement les enfants, c’est-à-dire la postérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Veille à écouter
  rationale: Cette formulation française naturelle rend ensemble l’idée de vigilance et d’attention exprimée par les deux verbes hébreux. Le contexte implique la mise en pratique sans réduire שׁמע au seul sens d’« obéir ».
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דברים désigne ici les paroles prescrites par Moïse; « paroles » conserve l’expression concrète de l’hébreu.
- source_word: מְצַוֶּךָּ
  choice: je te prescris
  rationale: Le participe présente le commandement en cours. « Prescrire » convient au registre juridique et exhortatif du Deutéronome sans être archaïque.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: afin que tout aille bien pour toi
  rationale: Cette tournure idiomatique rend la finalité et l’idée de bien-être exprimées par la formule hébraïque.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: et pour tes enfants après toi
  rationale: Dans cette promesse concernant la postérité, בנים englobe naturellement les enfants, sans imposer une restriction aux seuls fils.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: La formule exprime une durée qui se prolonge indéfiniment dans l’avenir.
- source_word: כִּי תַעֲשֶׂה
  choice: car tu feras
  rationale: כִּי est pris dans son sens causal et l’imparfait תעשה dans sa valeur prospective. La formulation conserve le lien explicatif sans transformer celui-ci en condition.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: ce qui est bon et droit
  rationale: Les deux adjectifs substantivés décrivent ce qui répond à l’évaluation morale divine; la paire est conservée sans paraphrase.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction garde la métaphore hébraïque de l’évaluation « aux yeux de » Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre de l’alliance; sa translittération préserve cette donnée du texte source.
- issue: Portée de בָנֶיךָ
  choice: tes enfants
  alternative: tes fils / tes descendants
  rationale: Dans la promesse transgénérationnelle, le masculin pluriel désigne la postérité familiale de manière représentative; « enfants » reste proche de l’image familiale.
- issue: Valeur de כִּי devant תַעֲשֶׂה
  choice: car tu feras
  alternative: quand tu feras / si tu fais
  rationale: Le sens causal est retenu, tout en reconnaissant que la conjonction peut recevoir une nuance temporelle ou conditionnelle dans ce contexte. Aucune de ces nuances ne doit être érigée en conclusion doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme interlocuteur collectif. La syntaxe reste proche du mouvement de la phrase hébraïque tout en évitant un calque peu naturel.
