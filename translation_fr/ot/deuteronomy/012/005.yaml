  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: fr
  text: Mais c’est le lieu que Yahweh votre Dieu choisira parmi toutes vos tribus pour y établir son nom[a], pour sa demeure, que vous rechercherez, et c’est là que tu iras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour y placer son nom ». L’hébreu de cette clause est concis ; les traductions diffèrent sur la question de savoir si « pour sa demeure » précise la présence de Dieu, le lieu comme demeure, ou les deux.
    reason: alternative_reading
  - marker: b
    text: L’hébreu passe ici du pluriel « vous rechercherez » au singulier « tu iras », en s’adressant à Israël à la fois comme communauté et comme unité.
    reason: source_language_shift
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: Dans ce contexte contrastif, l’expression introduit l’alternative positive à la pratique interdite dans les versets précédents.
- source_word: הַמָּקוֹם
  choice: le lieu
  rationale: Rend concrètement le site encore indéterminé que Dieu choisira.
- source_word: יִבְחַר
  choice: choisira
  rationale: L’imparfait hébreu envisage ici le choix futur du lieu de culte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend naturellement le titre d’alliance associé au nom divin.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: parmi toutes vos tribus
  rationale: Le lieu sera choisi au sein de l’ensemble des tribus d’Israël; « parmi » exprime clairement cette sélection interne.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: pour y établir son nom
  rationale: « Établir son nom » reste proche de l’image hébraïque tout en étant plus naturel en français que « mettre son nom »; « y » reprend explicitement le lieu.
- source_word: לְשִׁכְנוֹ
  choice: comme sa demeure
  rationale: Cette expression compacte préserve le motif de la demeure divine sans ajouter un verbe causatif absent du texte.
- source_word: תִדְרְשׁוּ
  choice: vous rechercherez
  rationale: דרש désigne ici la recherche du lieu de culte autorisé; « rechercherez » garde la force délibérée du verbe.
- source_word: וּבָאתָ שָׁמָּה
  choice: et c’est là que tu iras
  rationale: Le français emploie naturellement « aller » vers un lieu indiqué; le singulier « tu » conserve le changement de nombre du texte hébreu.
theological_decisions:
- issue: Nom divin et langage du sanctuaire central
  choice: Yahweh… pour y établir son nom, comme sa demeure
  alternative: Yahweh… pour y placer son nom, afin qu’il y demeure
  rationale: La formulation maintient ensemble les motifs du nom et de la demeure sans préciser davantage leur relation ni importer une théologie ultérieure du Temple.
- issue: Changement du pluriel au singulier dans l’adresse à Israël
  choice: vous rechercherez… tu iras
  alternative: vous rechercherez… vous irez
  rationale: Le texte hébreu passe du pluriel תִדְרְשׁוּ au singulier וּבָאתָ. La traduction conserve cette variation rhétorique, fréquente dans le Deutéronome, au lieu de l’harmoniser.
translation_notes:
  register: Français international actuel, digne et accessible. « Rechercher » convient au contexte cultuel sans technicisme; « c’est là que tu iras » rend l’orientation idiomatique tout en conservant le changement de nombre hébreu.
