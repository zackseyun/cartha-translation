  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: fr
  text: 'Alors, le lieu que Yahweh votre Dieu choisira pour y faire demeurer son nom, c’est là que vous apporterez tout ce que je vous ordonne : vos holocaustes, vos sacrifices, vos dîmes, votre contribution et tout ce qu’il y a de meilleur parmi vos vœux, ceux que vous ferez à Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors
  rationale: Marque naturellement en français la circonstance future qui découle des instructions précédentes.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: au lieu que ... choisira
  rationale: Conserve le lieu précis et l’orientation future de la proposition relative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  rationale: Rend explicitement la valeur causative du hiphil tout en préservant l’image deutéronomique du nom qui demeure au lieu choisi.
- source_word: שָׁמָּה תָבִיאוּ
  choice: vous apporterez
  rationale: Le complément initial « au lieu » fournit déjà la destination; le futur français porte ici la valeur prescriptive du contexte.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: tout ce que je vous ordonne
  rationale: Formulation française actuelle qui rend l’étendue de כָּל et la force continue de l’instruction.
- source_word: עוֹלֹתֵיכֶם
  choice: vos holocaustes
  rationale: Terme français établi pour les offrandes entièrement consumées, précis et encore intelligible dans le registre biblique.
- source_word: זִבְחֵיכֶם
  choice: vos sacrifices
  rationale: Préserve la portée générale du nom sans le limiter à une catégorie sacrificielle particulière.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: vos dîmes
  rationale: Équivalent français usuel des prélèvements du dixième.
- source_word: תְרֻמַת יֶדְכֶם
  choice: les contributions de votre main
  rationale: Conserve l’image concrète de la main et le caractère personnel des contributions.
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם
  choice: tout ce qu’il y a de meilleur parmi les vœux
  rationale: Rend מִבְחַר comme la partie la meilleure ou la plus choisie, sans ajouter le nom « offrandes », absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom personnel; sa translittération évite de le remplacer par un titre.
- issue: Théologie deutéronomique du nom dans לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  alternative: pour que son nom y demeure / pour y placer son nom
  rationale: La formulation retient à la fois la valeur causative de la forme verbale et l’image du nom qui demeure, sans identifier simplement la présence divine à un emplacement matériel.
- issue: Valeur prescriptive de תָבִיאוּ
  choice: vous apporterez
  alternative: vous devrez apporter
  rationale: Dans ce contexte législatif, le futur français peut exprimer l’obligation sans ajouter un auxiliaire modal absent du texte.
translation_notes:
  register: Français international moderne, digne et lisible. « Holocaustes » conserve la précision cultuelle traditionnelle; la syntaxe évite la répétition lourde de « là… là-bas » tout en gardant clairement le lieu choisi comme destination.
