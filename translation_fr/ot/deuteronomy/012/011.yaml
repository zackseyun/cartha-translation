revisions:
- from: 'Alors, au lieu que Yahweh votre Dieu choisira pour y faire demeurer son nom[a], vous apporterez tout ce que je vous ordonne : vos holocaustes, vos sacrifices, vos dîmes, les contributions de votre main et tout ce qu’il y a de meilleur parmi les vœux que vous ferez à Yahweh.'
  to: 'Alors, le lieu que Yahweh votre Dieu choisira pour y faire demeurer son nom, c’est là que vous apporterez tout ce que je vous ordonne : vos holocaustes, vos sacrifices, vos dîmes, votre contribution et tout ce qu’il y a de meilleur parmi vos vœux, ceux que vous ferez à Yahweh.'
  rationale: 'La révision remplace une construction française ambiguë par une relative naturelle et restitue explicitement la destination (« c’est là que »), conformément à שָׁמָּה. Elle ajuste aussi le singulier collectif de « contribution ». La note est conservée dans son contenu, mais l’ancre doit être placée après « nom » dans le texte révisé : « son nom[a] ».'
