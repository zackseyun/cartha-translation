  timestamp: '2026-07-14T12:54:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « au lieu que » n’introduit pas naturellement une proposition relative en français moderne et risque d’être compris au sens de « tandis que/alors que ». Le texte hébreu désigne bien le lieu choisi, puis marque explicitement ce lieu comme destination de l’apport. Le rendu de la causative « faire demeurer son nom » est fidèle.'
  naturalness: La reformulation avec « Le lieu que … choisira … c’est là que » est claire, idiomatique et conserve la progression de la phrase. « Votre contribution » rend plus naturellement le singulier collectif hébreu que « les contributions de votre main ».
  terminology: « Yahweh », « holocaustes », « sacrifices » et « dîmes » sont conservés. « Tout ce qu’il y a de meilleur parmi vos vœux » rend la notion de choix/excellence sans ajouter « offrandes ».
  issues:
  - severity: medium
    issue: « au lieu que Yahweh votre Dieu choisira »
    rationale: En français contemporain, « au lieu que » est normalement une locution conjonctive adversative (« alors que »), non l’équivalent naturel de « le lieu que ». Cette formulation obscurcit le référent et la structure de la phrase.
  - severity: low
    issue: « les contributions de votre main »
    rationale: Le singulier תְרוּמַת (« contribution/prélèvement ») est préférable en français. « Votre contribution » conserve le sens collectif sans une littéralité peu naturelle.
  revised_text: 'Alors, le lieu que Yahweh votre Dieu choisira pour y faire demeurer son nom, c’est là que vous apporterez tout ce que je vous ordonne : vos holocaustes, vos sacrifices, vos dîmes, votre contribution et tout ce qu’il y a de meilleur parmi vos vœux, ceux que vous ferez à Yahweh.'
  revised_footnotes:
  - marker: a
    text: 'Ou : « pour que son nom y demeure ».'
    reason: La forme hébraïque est causative (« faire demeurer »), mais la tournure peut être exprimée plus naturellement en français par une proposition où le nom demeure.
  revision_rationale: 'La révision remplace une construction française ambiguë par une relative naturelle et restitue explicitement la destination (« c’est là que »), conformément à שָׁמָּה. Elle ajuste aussi le singulier collectif de « contribution ». La note est conservée dans son contenu, mais l’ancre doit être placée après « nom » dans le texte révisé : « son nom[a] ».'
