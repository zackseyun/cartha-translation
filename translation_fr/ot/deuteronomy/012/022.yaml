  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: fr
  text: Toutefois, de même que l’on mange la gazelle et le cerf[a], tu peux en manger ; les personnes impures[b] comme les personnes pures peuvent en manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu traduit par « cerf » peut désigner plus généralement un cervidé, souvent mâle.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de personnes rituellement impures ou rituellement pures, et non d’une qualification morale.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule introduit ici une réserve liée à l’instruction précédente. « Toutefois » marque naturellement cette nuance sans lui donner une force exclusivement restrictive.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: comme… ainsi
  rationale: Cette tournure corrélative conserve explicitement la comparaison entre le gibier et l’animal dont il est question dans le contexte.
- source_word: יֵאָכֵל
  choice: on mange
  rationale: Le niphal exprime une action passive ou générale. La tournure française impersonnelle « on mange » rend ici plus naturellement l’usage générique que « sont mangés ».
- source_word: הַצְּבִי
  choice: la gazelle
  rationale: צְבִי désigne couramment un animal sauvage de type gazelle; « gazelle » est l’équivalent moderne le plus clair.
- source_word: הָאַיָּל
  choice: le cerf
  rationale: אַיָּל désigne un cervidé, souvent mâle. « Cerf » convient au singulier masculin du texte sans employer un terme archaïque.
- source_word: תֹּאכְלֶנּוּ
  choice: tu pourras en manger
  rationale: Dans cette instruction juridique, l’imparfait hébreu exprime une permission. Le pronom « en » reprend naturellement en français la viande ou l’animal évoqué au verset précédent.
- source_word: הַטָּמֵא
  choice: la personne impure
  rationale: Le terme désigne ici une personne en état d’impureté rituelle, non une personne moralement mauvaise. L’ajout de « personne » évite de substantiver maladroitement l’adjectif en français.
- source_word: הַטָּהוֹר
  choice: la personne pure
  rationale: Le terme est le pendant rituel de טָמֵא. « La personne pure » maintient le contraste lexical, tandis que la note précise sa portée rituelle.
- source_word: יַחְדָּו
  choice: l’une comme l’autre
  rationale: Dans ce contexte, le mot indique que les deux catégories ont également le droit d’en manger, et non nécessairement qu’elles mangent ensemble.
- source_word: יֹאכְלֶנּוּ
  choice: pourront en manger
  rationale: Comme le premier verbe, cet imparfait a une valeur permissive dans le cadre juridique du passage.
theological_decisions:
- issue: Terminologie du statut rituel
  choice: la personne impure et la personne pure
  alternative: la personne rituellement impure et la personne rituellement pure
  rationale: Le texte oppose des statuts rituels, non des qualités morales. Le corps du verset conserve les termes bibliques concis « impure » et « pure », tandis qu’une note empêche une lecture morale erronée.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier « tu » conserve l’adresse collective à Israël caractéristique du Deutéronome. La construction « comme… ainsi » garde le parallélisme hébreu, et les notes explicitent seulement les données lexicales et culturelles nécessaires.
