  terminology: « Yahweh » rend correctement le tétragramme. « Lévite », « part » et « héritage » sont appropriés. Le remplacement de « serviteurs et servantes » par « esclaves, hommes et femmes » préserve mieux le statut social exprimé par עֲבָדִים et אֲמָהוֹת, sans implication doctrinale supplémentaire.
