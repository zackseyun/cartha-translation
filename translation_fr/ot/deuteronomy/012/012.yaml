base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: fr
  text: 'Vous vous réjouirez devant Yahweh, votre Dieu : vous, vos fils et vos filles, vos esclaves, hommes et femmes, ainsi que le Lévite qui est dans vos villes[a], car il n’a ni part ni héritage avec vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui est dans vos portes ». Les « portes » peuvent désigner, par métonymie, les villes ou les communautés locales.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: vous vous réjouirez
  rationale: Le parfait qal précédé de la conjonction a ici une valeur injonctive ou prospective dans le contexte législatif. « Vous vous réjouirez » conserve la tonalité cultuelle et solennelle.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: devant Yahweh votre Dieu
  rationale: « Devant » rend naturellement לִפְנֵי dans un contexte de présence cultuelle, tandis que « Yahweh » translittère le nom divin.
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: vos fils et vos filles
  rationale: La formulation garde la paire masculine et féminine explicitement présente dans l’hébreu.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: vos serviteurs et vos servantes
  rationale: Les deux termes désignent les dépendants masculins et féminins de la maison. « Serviteurs » et « servantes » restent naturels dans un registre biblique moderne, sans effacer la dépendance sociale; une traduction par « esclaves » serait aussi défendable selon l’accent donné au statut juridique.
- source_word: וְהַלֵּוִי
  choice: le Lévite
  rationale: Désignation française habituelle d’un membre de la tribu de Lévi; le singulier collectif de l’hébreu est conservé.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: qui réside dans vos villes
  rationale: Littéralement « qui est dans vos portes »; « portes » désigne par métonymie les villes ou communautés locales. La formulation explicite le sens en français courant.
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: car il n’a ni part ni héritage avec vous
  rationale: « Car » exprime la relation causale; la construction « ni… ni… » rend idiomatiquement la paire חֵלֶק וְנַחֲלָה tout en maintenant ses deux éléments.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: Statut des עֲבָדִים et des אֲמָהוֹת
  choice: serviteurs et servantes
  alternative: esclaves, hommes et femmes
  rationale: Les mots peuvent désigner des personnes en servitude. « Serviteurs et servantes » convient au registre français et à l’énumération de la maisonnée, mais le statut de dépendance ne doit pas être compris comme un simple emploi salarié.
- issue: Absence de part et d’héritage du Lévite
  choice: ni part ni héritage avec vous
  alternative: ni part ni patrimoine parmi vous
  rationale: La traduction conserve les deux notions du texte sans préciser davantage la nature foncière de l’héritage, que le contexte deutéronomique éclaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’énumération solennelle de l’hébreu, avec une formulation idiomatique pour la présence locale du Lévite.
