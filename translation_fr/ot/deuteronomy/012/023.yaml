source:
  edition: WLC
  text: רַ֣ק חֲזַ֗ק לְ/בִלְתִּי֙ אֲכֹ֣ל הַ/דָּ֔ם כִּ֥י הַ/דָּ֖ם ה֣וּא הַ/נָּ֑פֶשׁ וְ/לֹא תֹאכַ֥ל הַ/נֶּ֖פֶשׁ עִם הַ/בָּשָֽׂר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: fr
  text: Seulement, veille bien à ne pas manger le sang[a], car le sang, c’est la vie, et tu ne mangeras pas la vie avec la chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’âme » pour « la vie » dans les deux occurrences de נֶפֶשׁ; ici, le terme hébreu désigne la vie qui anime la créature, d’où la traduction fréquente par « vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Seulement
  rationale: Introduit une restriction forte à la permission donnée dans le contexte précédent.
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  choice: veille bien à ne pas manger
  rationale: Littéralement lié à l’idée d’« être fort », cet idiome exprime ici une exhortation pressante à s’abstenir; « veille bien » en rend naturellement la force.
- source_word: הַדָּם
  choice: le sang
  rationale: Équivalent direct, maintenu de façon cohérente dans le verset.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction dans un registre actuel et digne.
- source_word: הַדָּם הוּא הַנָּפֶשׁ
  choice: le sang, c’est la vie
  rationale: La tournure disloquée rend l’insistance du pronom copulatif hébreu tout en restant naturelle en français.
- source_word: הַנָּפֶשׁ
  choice: la vie
  rationale: Dans cette loi alimentaire, נֶפֶשׁ désigne la vie qui anime la créature plutôt qu’une âme immatérielle au sens philosophique postérieur.
- source_word: וְלֹא תֹאכַל
  choice: et tu ne mangeras pas
  rationale: Le futur français conserve ici la tonalité juridique du prohibitif hébreu.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: la vie avec la chair
  rationale: Préserve l’image concrète et le lien lexical avec la proposition précédente; « chair » correspond au tissu corporel de l’animal.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le contexte de la loi alimentaire
  choice: vie
  alternative: âme
  rationale: « Vie » exprime la logique du passage, qui associe le sang à la vie de la créature, sans introduire un dualisme corps-âme que l’hébreu n’impose pas ici.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque. « Veille bien » communique l’urgence de l’exhortation sans reproduire littéralement l’idiome « sois fort »; le futur prohibitif maintient le registre légal.
