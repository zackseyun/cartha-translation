source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: fr
  text: Toutefois, chaque fois que tu en auras envie[a], tu pourras abattre des animaux et manger de la viande, selon la bénédiction que Yahweh ton Dieu t’a accordée, dans chacune de tes villes[b]. La personne impure comme la personne pure pourra en manger, comme on mange de la gazelle ou du cerf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans tout le désir de ton être » ; c’est-à-dire chaque fois que tu en as envie.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « dans toutes tes portes », expression qui désigne les villes ou les localités.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Toutefois
  rationale: Introduit la permission comme une restriction ou une nuance par rapport aux prescriptions précédentes, sans donner à « seulement » une portée artificiellement étroite.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: chaque fois que tu en auras envie
  rationale: Rend naturellement l’expression hébraïque littérale « selon tout le désir de ton être » et son sens contextuel de désir ou d’appétit.
- source_word: תִּזְבַּח
  choice: tu pourras abattre des animaux
  rationale: Le contexte exprime une permission. « Abattre » désigne ici la mise à mort d’animaux pour leur viande sans faire nécessairement de cet acte un sacrifice.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: et manger de la viande
  rationale: בָשָׂר désigne ici la chair animale considérée comme nourriture; « viande » est l’équivalent français courant.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: selon la bénédiction que Yahweh ton Dieu t’a accordée
  rationale: Conserve le nom « bénédiction » et le rapport de proportion ou de conformité exprimé par כְּ, tout en indiquant qu’il s’agit des ressources accordées par Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: dans toutes tes villes
  rationale: Les « portes » représentent par métonymie les villes ou localités; le français naturel exprime directement le référent géographique.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: La personne impure comme la personne pure
  rationale: Désigne le statut rituel des personnes plutôt qu’une qualité morale. La tournure « comme » souligne que toutes deux ont la même permission.
- source_word: יֹאכְלֶנּוּ
  choice: pourra en manger
  rationale: Exprime la permission contextuelle et reprend la viande par le pronom « en ».
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: comme on mange de la gazelle ou du cerf
  rationale: 'Explicite sobrement le point de comparaison: cette viande peut être consommée de la même manière que celle du gibier mentionné, sans ajouter de portée sacrificielle.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa transcription préserve sa fonction de nom personnel.
- issue: Sens de « l’impur et le pur »
  choice: statut rituel des personnes autorisées à manger
  alternative: qualification morale des personnes
  rationale: Dans ce contexte alimentaire et cultuel, les termes concernent la pureté rituelle. La traduction évite donc de suggérer une opposition entre personnes moralement mauvaises et bonnes.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier conserve l’adresse hébraïque à Israël. Les formulations techniques inutiles sont évitées, tandis que les notes signalent les deux idiomes hébraïques importants.
