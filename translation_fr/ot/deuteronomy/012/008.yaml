source:
  edition: WLC
  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: fr
  text: 'Vous ne ferez pas comme nous le faisons ici aujourd’hui : chacun[a] fait tout ce qui est droit à ses yeux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « un homme » ; l’expression a ici un sens distributif : chaque personne agit d’après son propre jugement.'
    reason: Précision sur la forme hébraïque et sa valeur distributive.
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Vous ne ferez pas
  rationale: Sous la négation, l’imparfait à la deuxième personne du pluriel exprime ici une interdiction ou une instruction portant sur la conduite future. Le futur français conserve naturellement cette portée prescriptive.
- source_word: כְּכֹל אֲשֶׁר אֲנַחְנוּ עֹשִׂים פֹּה הַיּוֹם
  choice: comme nous le faisons ici aujourd’hui
  rationale: La tournure comparative décrit la manière d’agir, et le participe présente l’activité en cours. Cette formulation française rend clairement les deux éléments.
- source_word: אִישׁ
  choice: chacun
  rationale: 'Le singulier אִישׁ a ici une valeur distributive : chaque membre du peuple agit selon son propre jugement. « Chacun » exprime ce sens avec précision en français moderne.'
- source_word: כָּל הַיָּשָׁר
  choice: tout ce qui est droit
  rationale: יָשָׁר désigne ce qui est droit, juste ou correct. « Droit » préserve le caractère moral et évaluatif du terme sans ajouter explicitement l’idée de simple apparence.
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: L’expression hébraïque désigne le jugement personnel. L’expression française correspondante reste naturelle et conserve l’image de l’original.
theological_decisions:
- issue: Portée de l’expression distributive אִישׁ ... בְּעֵינָיו
  choice: chacun ... à ses yeux
  alternative: chaque homme ... à ses yeux
  rationale: Le masculin singulier hébreu fonctionne de façon distributive dans une parole adressée à l’ensemble d’Israël. « Chacun » conserve l’individualisation sans limiter artificiellement l’application aux seuls hommes.
- issue: Évaluation morale dans כָּל הַיָּשָׁר בְּעֵינָיו
  choice: tout ce qui est droit à ses yeux
  alternative: tout ce qui lui paraît juste
  rationale: 'La traduction retenue préserve l’idiome hébreu et son ambiguïté : le texte rapporte le critère subjectif de chacun sans préciser ici si chaque action était réellement juste ou seulement tenue pour telle.'
translation_notes:
  register: Français international moderne, clair et digne. Le futur négatif garde la force de l’instruction, tandis que « à ses yeux » maintient l’image hébraïque et la tension entre droiture réelle et appréciation personnelle.
