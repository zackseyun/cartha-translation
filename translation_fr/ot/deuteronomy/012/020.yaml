  text: כִּֽי יַרְחִיב֩ יְהוָ֨ה אֱלֹהֶ֥י/ךָ אֶֽת גְּבֽוּלְ/ךָ֮ כַּ/אֲשֶׁ֣ר דִּבֶּר לָ/ךְ֒ וְ/אָמַרְתָּ֙ אֹכְלָ֣ה בָשָׂ֔ר כִּֽי תְאַוֶּ֥ה נַפְשְׁ/ךָ֖ לֶ/אֱכֹ֣ל בָּשָׂ֑ר בְּ/כָל אַוַּ֥ת נַפְשְׁ/ךָ֖ תֹּאכַ֥ל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: fr
  text: 'Quand le SEIGNEUR ton Dieu aura agrandi ton territoire, comme il te l’a promis, et que tu diras : « Je voudrais manger de la viande », parce que tu auras envie de manger de la viande, tu pourras en manger autant que tu le désireras.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
- source_word: יַרְחִיב ... אֶת גְּבוּלְךָ
  choice: aura agrandi ton territoire
  rationale: Le hiphil de רחב exprime l’élargissement, et גְּבוּל désigne ici l’étendue territoriale plutôt qu’une simple frontière-ligne.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: 'et que tu diras : « Je voudrais manger de la viande »'
  rationale: Le cohortatif אֹכְלָה exprime ici le désir ou la volonté de manger; « je voudrais » est naturel en français dans ce contexte.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: tu auras envie
  rationale: נפש peut désigner la personne elle-même ou son appétit; l’expression idiomatique française transmet le désir sans surtraduire par « âme ».
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: autant que tu le désireras
  rationale: Expression française naturelle qui conserve l’ampleur de כָּל et l’idée du désir personnel, sans suggérer nécessairement une prescription de quantité illimitée.
theological_decisions:
- issue: Portée de la permission de manger de la viande
  choice: « tu pourras en manger autant que tu le désireras »
  alternative: « tu pourras manger de la viande selon tout le désir de ton âme »
  rationale: Le verset accorde une permission dans le cadre juridique développé par le contexte. La formulation choisie ne transforme ni le désir en commandement ni la permission en approbation morale générale de tout appétit.
translation_notes:
  register: Français moderne, courant et digne; tutoiement singulier conservé pour correspondre aux formes hébraïques adressées à Israël comme unité collective. La répétition hébraïque de « viande » est légèrement allégée dans la dernière proposition pour une lecture naturelle.
