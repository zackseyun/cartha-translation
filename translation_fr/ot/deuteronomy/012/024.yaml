lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: Négation ordinaire qui introduit ici une interdiction.
- source_word: תֹּאכְלֶנּוּ
  choice: Tu ne le mangeras pas
  rationale: L’imparfait qal à la deuxième personne du masculin singulier, avec suffixe objet masculin singulier, exprime une interdiction dans ce contexte juridique. Le futur français conserve le ton législatif et le pronom « le ».
- source_word: עַל הָאָרֶץ
  choice: à terre
  rationale: Dans cette instruction concrète, אֶרֶץ désigne le sol. « À terre » est une formulation française naturelle pour indiquer où le sang doit être versé.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: tu le verseras
  rationale: Le verbe שׁפך décrit l’action de répandre ou verser le sang. « Verser » convient au geste prescrit et conserve le suffixe objet par « le ».
- source_word: כַּמָּיִם
  choice: comme de l’eau
  rationale: La préposition comparative כְּ introduit une comparaison de manière. « Comme de l’eau » est idiomatique en français et préserve l’image.
theological_decisions:
- issue: Référent des suffixes pronominaux
  choice: Les deux pronoms « le » renvoient au sang mentionné dans le contexte, sans répéter le nom dans le texte principal.
  alternative: Expliciter « le sang » dans le corps du verset.
  rationale: L’hébreu emploie des suffixes pronominaux plutôt que de répéter le nom. Le maintien des pronoms respecte cette structure et la note lève toute ambiguïté pour une lecture isolée.
translation_notes:
  register: Français international moderne, simple et digne. Le futur à valeur injonctive maintient le registre juridique du passage. « À terre » évite le sens plus large de « sur la terre » et sonne naturellement dans cette prescription concrète.
