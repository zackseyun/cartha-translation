  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: fr
  text: Tu ne le mangeras pas[a] ; tu le répandras sur le sol comme de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du sang de l’animal, comme l’indique le contexte immédiat.
