- from: Veille bien à ne pas offrir tes holocaustes dans n’importe quel lieu que tu verras.[a]
  to: Prends garde de ne pas offrir tes holocaustes dans un lieu quelconque que tu verras.[a]
  rationale: La révision conserve la portée précise du verset — les holocaustes et les lieux retenus à l’initiative de l’interlocuteur — sans élargir l’interdiction à tout acte de culte. Elle emploie une formule d’avertissement française plus directe, sans ajouter l’intensif « bien », et clarifie la valeur distributive de בְּכָל מָקוֹם.
