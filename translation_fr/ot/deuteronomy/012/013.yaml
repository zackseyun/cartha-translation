review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : il s’agit d’un avertissement contre l’offrande d’holocaustes dans des lieux que l’interlocuteur choisirait lui-même. Toutefois, « Veille bien à ne pas » ajoute une insistance (« bien ») qui n’est pas exprimée séparément dans l’hébreu, et la tournure est moins directement idiomatique ici que « Prends garde de ne pas ».'
  naturalness: « Prends garde de ne pas offrir » est une mise en garde claire, naturelle et de registre biblique sobre en français moderne. « Dans n’importe quel lieu que tu verras » est compréhensible, mais « dans un lieu quelconque que tu verras » rend plus nettement l’idée d’un lieu arbitrairement retenu sans faire entendre que tous les lieux seraient effectivement concernés collectivement.
  terminology: « Holocaustes » est le terme biblique français établi pour עֹלֹתֶיךָ et convient dans ce contexte cultuel. « Offrir » rend adéquatement le hifil de עלה avec cet objet.
