  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: fr
  text: Prends garde de ne pas offrir tes holocaustes dans un lieu quelconque que tu verras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prends garde de ne pas offrir tes holocaustes en tout lieu que tu verras. »'
    reason: La formule בְּכָל מָקוֹם peut être rendue plus littéralement par « en tout lieu » ; dans cette mise en garde négative, elle vise tout lieu choisi arbitrairement.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Veille bien
  rationale: La formule d’avertissement associe l’impératif nifal de שׁמר au pronom datif. « Veille bien » est naturel en français moderne et conserve la force de la mise en garde.
- source_word: פֶּן
  choice: à ne pas
  rationale: פֶּן introduit ici le contenu négatif de l’avertissement. Après « veille bien », « à ne pas » exprime clairement la prévention sans recourir au plus littéraire « de peur que ».
- source_word: תַּעֲלֶה
  choice: offrir
  rationale: Le hifil de עלה signifie littéralement « faire monter » et désigne idiomatiquement la présentation d’un sacrifice sur l’autel. Avec « holocaustes », « offrir » rend naturellement cet emploi cultuel.
- source_word: עֹלֹתֶיךָ
  choice: tes holocaustes
  rationale: עֹלָה est le terme cultuel usuel pour le sacrifice entièrement consumé. « Holocauste » est le terme biblique français établi et précis dans ce contexte.
- source_word: בְּכָל מָקוֹם
  choice: dans n’importe quel lieu
  rationale: 'Dans cette interdiction, בְּכָל exprime l’indéfinition distributive : il ne faut pas offrir en un lieu quelconque choisi librement. Cette formulation française évite de suggérer que la personne offrirait effectivement dans tous les lieux.'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: que tu verras
  rationale: La traduction conserve le verbe concret « voir » et le caractère non spécifié du lieu, sans ajouter explicitement l’idée d’un choix qui reste implicite dans le contexte.
theological_decisions:
- issue: Centralisation du culte
  choice: Limiter explicitement l’interdiction à l’offrande des holocaustes dans un lieu quelconque que l’on voit.
  alternative: Formuler une interdiction générale de tout culte hors du sanctuaire central.
  rationale: Le contexte porte sur le lieu cultuel choisi par Dieu, mais ce verset nomme précisément les holocaustes et les lieux laissés à l’initiative humaine. La traduction ne doit pas élargir la portée explicite de la phrase.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne du singulier. « Holocauste » est conservé dans son sens sacrificiel biblique établi.
