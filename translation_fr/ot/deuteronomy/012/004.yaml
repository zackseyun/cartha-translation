  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: fr
  text: Vous n’agirez pas ainsi envers Yahvé, votre Dieu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Ainsi » renvoie à ce qui précède, notamment à la manière dont les lieux et les objets de culte des nations doivent être détruits : Israël ne doit pas agir de cette manière envers Yahvé.'
    reason: cross_reference
  - marker: b
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre transcription possible : « Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: Négation standard qui, avec l’inaccompli dans ce contexte légal, exprime une interdiction directe.
- source_word: תַעֲשׂוּן
  choice: vous n’agirez pas
  rationale: L’inaccompli qal à la deuxième personne du pluriel, précédé de לֹא, a ici une valeur prohibitive. « Agir » permet une tournure française naturelle avec le complément « envers ».
- source_word: כֵּן
  choice: ainsi
  rationale: L’adverbe renvoie de façon concise à ce qui précède, sans expliciter dans le corps du texte la portée exacte du renvoi.
- source_word: לַיהוָה
  choice: envers Yahvé
  rationale: La préposition ל exprime ici la relation ou la direction de l’action. « Envers » est idiomatique en français et rend l’idée de ne pas agir de cette manière à l’égard de YHWH.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le suffixe de deuxième personne du pluriel est conservé et marque explicitement la relation d’alliance.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » est la forme française traditionnelle et largement intelligible du nom propre, tandis que « le SEIGNEUR » est signalé comme rendu traditionnel en note.
- issue: Portée de l’interdiction dans son contexte
  choice: Conserver la formulation concise « ainsi »
  alternative: Expliciter dans le texte qu’Israël ne doit pas traiter Yahvé comme les sanctuaires des nations
  rationale: L’hébreu demeure elliptique et dépend du contexte précédent. La traduction préserve cette concision et laisse à la note le soin d’indiquer le principal antécédent contextuel sans éliminer toute tension interprétative.
translation_notes:
  register: Français international moderne, concis et digne. Le futur à valeur d’interdiction convient au registre légal de l’alliance sans recourir à une tournure archaïque. Le pronom « vous » conserve le pluriel hébreu.
