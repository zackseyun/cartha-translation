source:
  edition: WLC
  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: fr
  text: 'Vous détruirez entièrement tous les lieux où les nations que vous dépossédez ont servi leurs dieux[a] : sur les hautes montagnes, sur les collines et sous tout arbre verdoyant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont adoré leurs dieux ». Le verbe hébreu traduit par « servir » peut désigner le culte rendu à une divinité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: Vous détruirez entièrement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce le commandement. Le futur à valeur impérative, accompagné de « entièrement », restitue cette insistance dans un français naturel et solennel.
- source_word: הַמְּקֹמוֹת
  choice: tous les lieux
  rationale: Le nom désigne ici des lieux concrets associés au culte. « Lieux » reste direct sans préciser davantage que l’hébreu.
- source_word: עָבְדוּ שָׁם
  choice: où … ont servi
  rationale: Avec des divinités pour objet, עבד peut signifier servir dans un sens cultuel, donc adorer. « Ont servi leurs dieux » conserve la formulation hébraïque et son sens religieux, explicité en note.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce contexte, le terme désigne les peuples non israélites du pays. « Nations » est précis et évite les connotations ultérieures de « païens » ou « gentils ».
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: que vous dépossédez
  rationale: Dans le contexte de la conquête, ירשׁ exprime la prise de possession entraînant l’éviction des occupants. « Dépossédez » rend cette dimension sans développer la phrase.
- source_word: אֱלֹהֵיהֶם
  choice: leurs dieux
  rationale: Rendu direct du pluriel avec suffixe possessif.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: sur les hautes montagnes
  rationale: Traduction directe du nom et de son adjectif, qui conserve la référence aux lieux de culte élevés.
- source_word: הַגְּבָעוֹת
  choice: les collines
  rationale: Équivalent français courant et précis, sans ajouter l’idée de sommet.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: sous tout arbre verdoyant
  rationale: רַעֲנָן évoque une végétation fraîche, luxuriante et verte. « Verdoyant » restitue cette qualité dans un registre digne et actuel.
theological_decisions:
- issue: Nature de l’action commandée contre les lieux de culte des nations
  choice: Le commandement porte concrètement sur la destruction de tous les lieux où ces nations rendaient un culte à leurs dieux.
  alternative: Paraphraser plus largement comme l’abolition de leurs pratiques cultuelles.
  rationale: L’objet grammatical de la destruction est « tous les lieux ». La traduction garde ce point concret sans élargir explicitement le commandement aux pratiques elles-mêmes.
translation_notes:
  register: Français international moderne, clair et digne. Le futur « vous détruirez » exprime naturellement un commandement juridique, tandis que « entièrement » conserve l’intensification hébraïque. La syntaxe place « où » de manière à rendre naturellement l’adverbe hébreu שָׁם sans ajouter un « là » redondant.
