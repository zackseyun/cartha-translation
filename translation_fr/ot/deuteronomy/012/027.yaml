source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: fr
  text: Tu offriras tes holocaustes — la chair et le sang — sur l’autel de Yahweh, ton Dieu. Le sang de tes sacrifices sera versé sur l’autel de Yahweh, ton Dieu, et tu mangeras la chair.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais tu pourras manger la chair ».'
    reason: La prescription peut être comprise comme autorisant la consommation de la chair, par contraste avec le sang qui doit être versé sur l’autel.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: tu offriras
  rationale: Dans ce contexte sacrificiel, le verbe « faire » signifie accomplir ou présenter le sacrifice. « Offrir » exprime naturellement cet emploi cultuel en français.
- source_word: עֹלֹתֶיךָ
  choice: tes holocaustes
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée sur l’autel.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: la chair et le sang
  rationale: « Chair » conserve le sens concret et cultuel de בָּשָׂר, sans réduire le terme à son seul emploi alimentaire moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וְדַם זְבָחֶיךָ
  choice: le sang de tes sacrifices
  rationale: « Sacrifices » rend clairement le terme général זֶבַח dans un contexte où la chair peut être mangée.
- source_word: יִשָּׁפֵךְ
  choice: sera versé
  rationale: Le passif exprime l’action rituelle accomplie sur le sang; « versé » est l’expression française naturelle dans ce contexte.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: et tu mangeras la chair
  rationale: Cette formulation garde la conjonction hébraïque et la valeur directive du verbe, sans transformer explicitement l’énoncé en simple permission.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans remplacer le nom par un titre.
- issue: Valeur de וְהַבָּשָׂר תֹּאכֵל
  choice: et tu mangeras la chair
  alternative: mais tu pourras manger la chair
  rationale: Dans une prescription légale, l’imparfait hébreu peut fonctionner comme directive tout en impliquant une permission. Le texte principal conserve la forme la plus proche; la note signale la lecture permissive contextuelle.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement singulier reflète l’adresse hébraïque à Israël. Les tirets mettent en apposition « la chair et le sang » et évitent une lecture où ces mots seraient une nouvelle série d’offrandes.
