    issue: Le verbe « tu prendras » ne rend pas assez précisément תִּשָּׂא.
    rationale: Dans ce contexte, le verbe signifie porter ou emporter les biens sacrés vers le lieu choisi. « Emporteras » préserve mieux cette action de transport.
  - severity: medium
    issue: « Ce que tu as voué » réduit l’ambiguïté de נְדָרֶיךָ.
    rationale: Le mot hébreu est littéralement « tes vœux »; il peut aussi désigner concrètement les offrandes destinées à accomplir ces vœux. Employer « tes vœux » dans le texte et expliquer l’autre possibilité en note préserve cette ambiguïté.
  revised_text: Mais les choses saintes qui t’appartiennent et tes vœux[a], tu les emporteras et tu iras au lieu que Yahweh choisira.
