source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: fr
  text: Mais les choses saintes qui t’appartiennent et tes vœux[a], tu les emporteras et tu iras au lieu que Yahweh choisira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes offrandes vouées » ; l’hébreu peut désigner les vœux eux-mêmes ou, dans ce contexte sacrificiel, les offrandes apportées pour les accomplir.
    reason: alternative lexicale
lexical_decisions:
- source_word: רַק
  choice: Mais… seulement
  rationale: Exprime à la fois le contraste avec les permissions précédentes et la restriction propre à רַק.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: les choses saintes qui t’appartiennent
  rationale: Conserve la portée générale de « choses consacrées » et la valeur possessive de la proposition relative, sans réduire le terme à une catégorie précise de sacrifices.
- source_word: וּנְדָרֶיךָ
  choice: et ce que tu as voué
  rationale: Rend naturellement le lien entre les vœux et les biens ou offrandes promis, tout en maintenant l’ambiguïté lexicale au moyen d’une note.
- source_word: תִּשָּׂא
  choice: tu prendras
  rationale: Le verbe signifie littéralement porter ou emporter; « prendre » convient au déplacement vers le sanctuaire sans transformer explicitement l’action en offrande.
- source_word: וּבָאתָ
  choice: et tu viendras
  rationale: Préserve la seconde action distincte et le sens simple de venir ou entrer.
- source_word: הַמָּקוֹם
  choice: le lieu
  rationale: Reproduit l’expression deutéronomique sans préciser davantage la nature du sanctuaire.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh choisira
  rationale: Le futur convient à la perspective du passage, et le nom divin est translittéré comme nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le Tétragramme; « Yahweh » conserve ici le nom d’alliance sous une forme française reconnaissable.
- issue: Référent de נְדָרֶיךָ
  choice: ce que tu as voué
  alternative: tes vœux; tes offrandes promises par vœu
  rationale: Dans ce contexte cultuel, le mot peut désigner les vœux eux-mêmes ou, concrètement, les offrandes destinées à les accomplir. La formulation retenue évite de trancher entièrement.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier suit les formes hébraïques de deuxième personne. La syntaxe garde les deux actions successives — prendre, puis venir — tout en restant naturelle.
