  source_fidelity: La restriction initiale (« Mais… seulement ») et le futur de « Yahweh choisira » sont bien rendus. Toutefois, « tu prendras » affaiblit le sens concret de תִּשָּׂא (« porter / emporter »), et « ce que tu as voué » interprète plus directement le terme נְדָרֶיךָ que ne le fait le texte hébreu, qui dit littéralement « tes vœux » tout en pouvant viser, dans ce contexte, les offrandes vouées.
  naturalness: La formulation révisée reste naturelle en français international moderne. « Tu les emporteras et tu iras » conserve les deux actions coordonnées de l’hébreu tout en évitant l’ambiguïté moins précise de « tu prendras ».
  terminology: « Choses saintes » conserve utilement la portée large de קָדָשֶׁיךָ. « Tes vœux » est le rendu lexical de base de נְדָרֶיךָ; la note conserve sans imposer l’interprétation cultuelle « offrandes vouées ». « Yahweh » est cohérent avec la décision fournie pour le Tétragramme.
