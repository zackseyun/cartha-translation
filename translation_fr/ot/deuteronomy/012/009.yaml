source:
  edition: WLC
  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: fr
  text: Car vous n’êtes pas encore arrivés au lieu de repos[a] et à l’héritage que Yahweh votre Dieu vous donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au repos ». Le mot hébreu peut désigner soit le repos lui-même, soit un lieu où l’on trouve le repos; le contexte de l’entrée dans le pays favorise ici le sens concret.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’instruction précédente et conserve la valeur causale de la conjonction.
- source_word: בָּאתֶם
  choice: vous êtes arrivés
  rationale: Le verbe בוא peut signifier venir, entrer ou arriver. Avec une destination et « pas encore », « arriver » est naturel en français sans restreindre le sens à l’acte d’entrer.
- source_word: עַד עָתָּה
  choice: pas encore
  rationale: Avec la négation, l’expression indique que l’action ne s’est pas produite jusqu’au moment présent; « pas encore » l’exprime idiomatiquement.
- source_word: הַמְּנוּחָה
  choice: le lieu de repos
  rationale: מְנוּחָה peut désigner le repos comme état ou un lieu de repos. Le contexte de l’arrivée dans le pays favorise ici le sens concret, tout en laissant l’autre sens en note.
- source_word: הַנַּחֲלָה
  choice: l’héritage
  rationale: נַחֲלָה désigne fréquemment un bien reçu en partage, notamment le pays donné par Dieu. « Héritage » conserve les notions de don et de possession attribuée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin de l’hébreu au lieu de le remplacer par un titre.
- source_word: נֹתֵן
  choice: vous donne
  rationale: Le participe présente le don comme actuel ou en cours d’accomplissement. Le présent français rend naturellement cet aspect et convient au contexte de la promesse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom divin sans lui substituer un titre.
- issue: Rapport entre le lieu de repos et l’héritage
  choice: 'Maintien de deux groupes coordonnés: « au lieu de repos et à l’héritage »'
  alternative: Fusionner les deux expressions comme si elles désignaient explicitement une seule réalité
  rationale: L’hébreu coordonne les deux noms avec une préposition répétée. La traduction conserve cette distinction sans décider si les deux expressions renvoient exactement au même pays sous deux aspects.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « vous êtes arrivés » reflète l’adresse collective à Israël; le singulier « votre Dieu vous donne » reste naturel en français bien que les suffixes hébreux soient morphologiquement singuliers et collectifs.
