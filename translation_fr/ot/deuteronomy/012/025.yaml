  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: fr
  text: Tu ne le mangeras pas, afin que tout aille bien pour toi et pour tes enfants après toi[a], car tu feras ce qui est droit aux yeux de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes fils après toi » ; ou, plus largement, « tes descendants après toi ».

      '
    reason: 'Alternative lexicale pour בָנֶיךָ : le masculin pluriel peut désigner les fils au sens strict ou, dans ce contexte d’alliance, les enfants et la postérité.'
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: tu ne le mangeras pas
  rationale: Le verbe אָכַל signifie « manger » et le suffixe masculin singulier renvoie au sang dans le contexte immédiat (v. 23-24). Le futur français convient à la formulation prescriptive.
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit ici le but ou le résultat attendu; « afin que » conserve clairement ce rapport.
- source_word: יִיטַב לְךָ
  choice: tout aille bien pour toi
  rationale: Rend naturellement l’expression deutéronomique de bien-être sans la réduire à la prospérité matérielle.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: et pour tes enfants après toi
  rationale: בָּנִים peut désigner les fils ou, plus largement, les enfants et la postérité. Dans ce contexte d’alliance, « enfants » garde l’image familiale tout en englobant la descendance.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction donne le fondement du bien-être promis. « Puisque » exprime ce lien sans faire de l’obéissance une simple indication temporelle.
- source_word: תַעֲשֶׂה
  choice: tu feras
  rationale: L’imparfait hébreu porte ici une perspective future dans le cadre de l’exhortation et de sa conséquence.
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: יָשָׁר désigne ce qui est droit, juste ou conforme. « Ce qui est droit » maintient l’image hébraïque et reste idiomatique en français biblique moderne.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Conserve la métaphore hébraïque de l’évaluation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans lui substituer un titre.
- issue: Portée de בָנֶיךָ
  choice: tes enfants
  alternative: tes fils; tes descendants
  rationale: Le pluriel masculin peut viser les fils au sens strict, mais il sert aussi pour les enfants ou la postérité. Le contexte des conséquences durables de l’alliance favorise « enfants », qui préserve en outre le langage familial.
- issue: Valeur de כִּי תַעֲשֶׂה
  choice: puisque tu feras
  alternative: car tu feras; quand tu feras; parce que tu fais
  rationale: כִּי peut être causal ou temporel. Ici, la lecture causale relie le bien promis à l’accomplissement de ce qui est droit, tout en conservant la perspective future de תַעֲשֶׂה.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes hébraïques adressées à Israël comme interlocuteur collectif. La formulation garde l’idiome « aux yeux de » et évite de réduire le bien-être promis à une prospérité uniquement matérielle.
