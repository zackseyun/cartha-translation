  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: fr
  text: Vous veillerez à mettre en pratique tout ce que je vous commande[a]. Vous n’y ajouterez rien et vous n’en retrancherez rien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute la parole que je vous commande » ; l’hébreu emploie un singulier collectif.'
    reason: lexical_alternative
  - marker: b
    text: Dans certaines traditions de numérotation, ce verset correspond à Deutéronome 12.32.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: tout ce que
  rationale: Cette tournure française naturelle rend la valeur collective du singulier hébreu (« toute la parole / tout l’énoncé ») sans suggérer que seuls des mots isolés sont visés. La note conserve la forme plus littérale.
- source_word: מְצַוֶּה אֶתְכֶם
  choice: je vous commande
  rationale: Le présent français exprime naturellement l’acte de commandement en cours ou actuel porté par le participe hébreu, avec son complément explicite « vous ».
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: Vous veillerez à mettre en pratique
  rationale: « Veiller à » restitue l’attention impliquée par שׁמר, tandis que « mettre en pratique » rend idiomatiquement l’obéissance concrète exprimée par עשׂה.
- source_word: לֹא תֹסֵף עָלָיו
  choice: Vous n’y ajouterez rien
  rationale: La formulation exprime clairement l’interdiction d’ajouter quoi que ce soit à l’ensemble commandé; « y » reprend naturellement l’antécédent collectif.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: vous n’en retrancherez rien
  rationale: « Retrancher » conserve avec précision l’idée juridique de diminuer ou de retirer une partie, et « en » reprend le même ensemble commandé.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom français suffit ici à identifier le locuteur avec autorité; une forme renforcée comme « moi-même » alourdirait le texte et surinterpréterait l’emphase.
theological_decisions:
- issue: Numérotation du verset et lien discursif
  choice: Présenter l’injonction comme une unité complète, sans incorporer de contenu du verset suivant.
  alternative: Dans certaines traditions de versification, cette phrase constitue Deutéronome 12.32 et se rattache plus directement à la section précédente.
  rationale: Le texte massorétique forme ici une injonction complète qui peut aussi servir de transition vers la législation sur les prophètes trompeurs. La traduction ne doit pas trancher ce lien discursif en ajoutant des éléments absents.
- issue: Portée de כָּל הַדָּבָר
  choice: Conserver une portée collective générale par « tout ce que je vous commande ».
  alternative: Traduire littéralement « toute la parole » ou distributivement « chaque parole ».
  rationale: La formulation choisie préserve l’intégralité du commandement sans réduire דָּבָר à des vocables individuels ni lui substituer explicitement une catégorie théologique plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient au registre législatif. « Mettre en pratique » évite le calque peu naturel « garder pour faire », tandis que le parallélisme « ajouter / retrancher » demeure net.
