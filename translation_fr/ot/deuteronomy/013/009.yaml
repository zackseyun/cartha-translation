base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: fr
  text: Tu ne lui céderas pas[a] et tu ne l’écouteras pas. Ton œil n’aura pas pitié de lui[b] ; tu ne l’épargneras pas et tu ne le cacheras pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne consentiras pas à ce qu’il propose ». Le verbe hébreu peut exprimer le fait d’être disposé à accepter, de consentir ou de céder.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ton œil n’aura pas pitié de lui ». Cette expression hébraïque évoque un regard de compassion qui conduirait à retenir l’application du jugement.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « tu ne le couvriras pas ». L’hébreu peut évoquer le fait de cacher la personne ou de dissimuler ce qu’elle a fait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לּוֹ
  choice: tu ne lui céderas pas
  rationale: Le verbe אָבָה désigne ici le fait de consentir, d’être disposé à accepter ou de céder. « Céder » exprime naturellement le refus de se laisser entraîner, tout en laissant en note l’autre nuance possible.
- source_word: תִשְׁמַע אֵלָיו
  choice: tu ne l’écouteras pas
  rationale: Avec אֶל, שׁמע peut signifier écouter ou prêter attention. Dans ce contexte, il ne s’agit pas de la simple perception auditive, mais de l’accueil de la sollicitation ; « écouter » conserve cette portée sans imposer le sens plus fort d’« obéir ».
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: ton œil n’aura pas pitié de lui
  rationale: La formulation conserve l’image hébraïque explicite de l’œil et rend חוּס par « avoir pitié », sans réduire l’expression à une interdiction générale d’épargner.
- source_word: תַחְמֹל
  choice: tu ne l’épargneras pas
  rationale: חמל peut signifier éprouver de la compassion ou épargner. « Épargner » distingue ce verbe du précédent et maintient la progression des interdictions.
- source_word: תְכַסֶּה עָלָיו
  choice: tu ne le couvriras pas
  rationale: Le piel de כסה évoque le fait de couvrir, cacher ou dissimuler. En français, « couvrir quelqu’un » peut aussi signifier le protéger en dissimulant ses actes ; cette formulation préserve donc l’image et l’ambiguïté du texte, explicitées en note.
theological_decisions:
- issue: Maintien de la sévérité judiciaire de l’alliance envers celui qui incite à l’apostasie
  choice: Conserver la série directe et cumulative des interdictions, sans l’atténuer.
  alternative: Reformuler le verset comme un simple appel à la désapprobation ou à la distance émotionnelle.
  rationale: Le contexte juridique exige de ne pas consentir à la sollicitation, de ne pas y prêter attention, de ne pas prendre le coupable en pitié, de ne pas l’épargner et de ne pas le dissimuler. La traduction ne résout ni n’adoucit cette tension.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier suit les formes hébraïques de deuxième personne. La répétition de « tu ne… pas » reproduit l’accumulation juridique du verset, tandis que « ton œil » conserve son image sémitique sans rendre l’ensemble inintelligible.
