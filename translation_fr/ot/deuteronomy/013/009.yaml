revisions:
- from: Tu ne lui céderas pas[a] et tu ne l’écouteras pas. Ton œil n’aura pas pitié de lui[b] ; tu ne l’épargneras pas et tu ne le couvriras pas[c].
  to: Tu ne lui céderas pas[a] et tu ne l’écouteras pas. Ton œil n’aura pas pitié de lui[b] ; tu ne l’épargneras pas et tu ne le cacheras pas[c].
  rationale: 'La révision se limite au dernier verbe : « cacher » est l’équivalent français moderne le plus direct de l’idée de dissimulation exprimée par le texte hébreu. La note conserve l’alternative plus littérale « couvrir » et l’ambiguïté quant à ce qui est dissimulé. Les autres formulations, y compris l’image de l’œil et la force cumulative des interdictions, sont maintenues.'
