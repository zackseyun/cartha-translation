review_pass:
  verdict: revise
  source_fidelity: 'La succession des cinq interdictions est fidèlement rendue : ne pas consentir/céder, ne pas écouter, ne pas avoir pitié, ne pas épargner, ne pas cacher. La distinction entre « avoir pitié » (חוּס) et « épargner » (חמל) est bien conservée. La dernière expression, כִּסָּה עָלָיו, autorise l’idée de cacher ou de couvrir pour lui, sans qu’il soit nécessaire de préciser davantage l’objet de la dissimulation dans le texte principal.'
  naturalness: Le texte est globalement naturel et de registre direct. Toutefois, « tu ne le couvriras pas » est peu idiomatique en français international lorsqu’il s’agit d’une personne et risque d’être compris au sens physique. « Tu ne le cacheras pas » est plus clair et plus naturel, tout en restant proche du verbe hébreu.
  terminology: « Céder », « écouter », « avoir pitié » et « épargner » conviennent au contexte et maintiennent l’accumulation juridique. « Cacher » rend mieux le dernier verbe que « couvrir » dans le texte courant; l’image de « couvrir » et l’ambiguïté possible quant à la personne ou à sa faute peuvent être signalées en note.
  issues:
  - severity: medium
    issue: « Tu ne le couvriras pas » est ambigu et peu naturel dans le français courant.
    rationale: Bien que « couvrir quelqu’un » puisse parfois évoquer le fait de le protéger ou de dissimuler ses actes, cette tournure ne rend pas immédiatement le sens de כִּסָּה dans ce contexte. « Tu ne le cacheras pas » transmet clairement l’interdiction de le dissimuler, sans modifier le sens.
