  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: fr
  text: des dieux des peuples qui vous entourent, qu’ils soient proches ou éloignés de toi, d’une extrémité de la terre à l’autre[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une extrémité du pays à l’autre ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: parmi les dieux de
  rationale: 'Dans cette proposition qui poursuit l’énumération du verset précédent, מִן a une valeur partitive : il s’agit de l’un quelconque des dieux appartenant aux peuples mentionnés. « Parmi les dieux de » rend clairement cette relation en français.'
- source_word: הָעַמִּים
  choice: les peuples
  rationale: Le pluriel עַמִּים désigne ici des groupes humains distincts. « Peuples » conserve mieux cette nuance ethnique et collective que « nations ».
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: qui vous entourent
  rationale: Cette formulation française naturelle conserve le sens spatial de סְבִיבֹת et le pronom pluriel hébreu.
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: qu’ils soient proches ou éloignés de toi
  rationale: La paire « proches ou éloignés » restitue l’opposition spatiale. Le singulier « toi » préserve le passage du pluriel au singulier présent dans l’hébreu.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: d’une extrémité de la terre à l’autre
  rationale: Cette tournure idiomatique exprime l’étendue géographique totale et reste naturelle en français. « Terre » maintient la portée universelle probable, tandis qu’une note signale l’autre sens possible de אֶרֶץ.
theological_decisions:
- issue: Portée de הָאָרֶץ dans la formule finale
  choice: terre
  alternative: pays
  rationale: אֶרֶץ peut désigner la terre entière ou un pays déterminé. Ici, la formule d’une extrémité à l’autre semble viser la plus grande étendue concevable ; « terre » en préserve la force rhétorique sans supprimer l’autre lecture possible, indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste volontairement ouverte au début et se termine par un tiret, puisqu’elle dépend du contexte précédent et se poursuit au verset suivant. L’alternance entre « vous » et « toi » reflète celle du texte hébreu.
