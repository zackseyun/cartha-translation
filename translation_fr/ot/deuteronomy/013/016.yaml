  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: fr
  text: Tu devras assurément frapper les habitants de cette ville du tranchant de l’épée ; tu voueras à la destruction[a] la ville, tout ce qui s’y trouve et son bétail, du tranchant de l’épée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « vouer par interdit ». Le verbe hébreu désigne ici le fait de vouer quelque chose de manière irrévocable à la destruction.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à la bouche de l’épée », expression qui signifie « du tranchant de l’épée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: Tu frapperas sans faute
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’ordre. « Sans faute » en restitue la force en français naturel, tandis que « frapper » conserve le verbe hébreu sans anticiper sur la précision donnée par l’épée.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: les habitants de cette ville
  rationale: Le participe désigne les personnes qui résident dans la ville. « Habitants » est précis, courant et collectif.
- source_word: לְפִי חָרֶב
  choice: par le tranchant de l’épée
  rationale: L’expression signifie littéralement « à la bouche de l’épée ». La formulation choisie garde l’image concrète tout en étant intelligible en français moderne.
- source_word: הַחֲרֵם
  choice: vouant à la destruction
  rationale: Au hiphil, חרם exprime la mise sous ḥerem, c’est-à-dire une consécration irrévocable à la destruction. Cette traduction conserve la dimension particulière du terme sans employer un jargon opaque.
- source_word: אֹתָהּ
  choice: la ville
  rationale: Le pronom féminin singulier renvoie à la ville. La répétition explicite du nom évite en français toute ambiguïté sur le référent.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: tout ce qui s’y trouve
  rationale: Cette tournure naturelle exprime l’extension de la destruction à l’ensemble du contenu de la ville.
- source_word: בְּהֶמְתָּהּ
  choice: son bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques. « Bétail » rend cette portée sans la limiter aux seuls bovins.
- source_word: לְפִי חָרֶב
  choice: par le tranchant de l’épée
  rationale: La seconde occurrence est conservée à l’identique afin de respecter la répétition hébraïque et son effet d’insistance.
theological_decisions:
- issue: Rendu de חרם dans un contexte de guerre et de jugement
  choice: vouant à la destruction
  alternative: détruisant entièrement ; frappant d’interdit
  rationale: 'Le terme indique davantage qu’une simple destruction militaire : il comporte l’idée d’une mise à part irrévocable pour la destruction. Le choix retenu préserve cette tension théologique tout en restant compréhensible.'
- issue: Maintien de la sévérité du commandement
  choice: Conserver sans atténuation la portée totale et violente de l’ordre
  alternative: Employer une formulation atténuée telle que « vaincre »
  rationale: La formulation hébraïque ordonne explicitement de frapper les habitants, la ville, son contenu et son bétail. Une atténuation masquerait la gravité du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier suit l’adresse hébraïque. La répétition de « par le tranchant de l’épée » est maintenue, de même que la force du commandement et la nuance sacrale de חרם.
