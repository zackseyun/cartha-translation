review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’énumération des proches, le caractère secret de la sollicitation, l’invitation cohortative à servir d’autres dieux et la proposition finale sur les dieux non connus. Toutefois, « cherche … à t’entraîner » ajoute une idée de tentative non exprimée explicitement par le hifil de סות; un verbe direct est préférable. « la femme » doit aussi être rendu explicitement comme l’épouse du destinataire.
  naturalness: Le français est globalement moderne et lisible. « Ta femme, que tu serres contre toi » conserve l’image d’intimité dans une formulation naturelle. « Ton ami qui est comme toi-même » est plus idiomatique en français que « comme ta propre vie », tout en gardant l’intensité de כְנַפְשְׁךָ.
  terminology: « Servir d’autres dieux » est fidèle à עבד et conserve utilement son sens cultuel large. « Fils de ta mère », « pères » et « connus » sont appropriés. Les notes sont ajustées afin que l’alternative concernant נפש corresponde au texte principal révisé.
  issues:
  - severity: medium
    issue: « cherche en secret à t’entraîner » introduit « cherche à ».
    rationale: יַסִּיתְךָ est le verbe principal de la protase conditionnelle et signifie directement « t’incite / t’entraîne / te séduit ». L’idée explicite d’essayer ou de chercher à le faire n’est pas requise par la forme verbale.
  - severity: medium
    issue: « la femme que tu serres contre toi » ne désigne pas explicitement l’épouse du destinataire.
    rationale: אֵשֶׁת חֵיקֶךָ signifie littéralement « la femme/épouse de ton sein », c’est-à-dire ta femme dans la plus étroite intimité. Le possessif français évite une possible lecture générique.
  - severity: low
    issue: « comme ta propre vie » est moins naturel dans cette description d’un ami.
    rationale: Dans cette comparaison relationnelle, « comme toi-même » est un rendu français courant de כְנַפְשְׁךָ; la note conserve les sens possibles de « vie » et « âme ».
  revised_text: 'Si ton frère, fils de ta mère, ou ton fils, ou ta fille, ou ta femme, que tu serres contre toi[a], ou ton ami qui est comme toi-même[b], t’incite en secret, en disant : « Allons servir d’autres dieux », des dieux que ni toi ni tes pères n’avez connus—'
