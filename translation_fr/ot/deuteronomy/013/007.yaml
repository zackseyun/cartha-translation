revisions:
- from: 'Si ton frère, fils de ta mère, ou ton fils, ou ta fille, ou la femme que tu serres contre toi[a], ou ton ami qui est comme ta propre vie[b], cherche en secret à t’entraîner en disant : « Allons servir d’autres dieux », des dieux que ni toi ni tes pères n’avez connus—'
  to: 'Si ton frère, fils de ta mère, ou ton fils, ou ta fille, ou ta femme, que tu serres contre toi[a], ou ton ami qui est comme toi-même[b], t’incite en secret, en disant : « Allons servir d’autres dieux », des dieux que ni toi ni tes pères n’avez connus—'
  rationale: La révision retire l’idée ajoutée de tentative, explicite qu’il s’agit de l’épouse du destinataire et adopte une formulation française plus naturelle pour l’ami « comme toi-même ». Elle préserve l’ordre, l’intensité relationnelle, le sens cultuel de « servir », les deux ancres de note et le tiret final qui indique la continuation syntaxique au verset suivant.
