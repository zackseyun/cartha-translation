  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: fr
  text: 'Si ton frère, fils de ta mère, ou ton fils, ou ta fille, ou ta femme, que tu serres contre toi[a], ou ton ami qui est comme toi-même[b], t’incite en secret, en disant : « Allons servir d’autres dieux », des dieux que ni toi ni tes pères n’avez connus—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la femme de ton sein »; image d’une épouse tenue dans la plus étroite intimité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui est comme ta propre vie »; le mot hébreu peut aussi se traduire par « âme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: cherche à t’entraîner
  rationale: Le hifil de סות exprime l’action d’inciter, de séduire ou d’attirer quelqu’un vers une conduite. « Cherche à t’entraîner » rend naturellement cette sollicitation sans lui donner nécessairement une nuance sensuelle; « en secret » traduit séparément בַּסֵּתֶר.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: ton frère, fils de ta mère
  rationale: Cette formulation conserve l’apposition explicite de l’hébreu et souligne la proximité familiale, sans la réduire au terme technique « demi-frère ».
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: la femme que tu serres contre toi
  rationale: חֵיק désigne le sein, le giron ou l’endroit où l’on tient quelqu’un étroitement. La formulation française garde l’image de l’intimité conjugale tout en évitant l’expression vieillie « femme de ton sein ».
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: ton ami qui est comme ta propre vie
  rationale: נֶפֶשׁ peut désigner la vie, la personne ou l’être même. « Comme ta propre vie » conserve l’intensité affective et une part de l’image hébraïque; une note signale les autres nuances possibles.
- source_word: בַּסֵּתֶר
  choice: en secret
  rationale: Rend directement la locution adverbiale hébraïque et indique que la tentative se déroule à l’insu des autres.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Allons servir
  rationale: Les deux cohortatifs constituent une exhortation commune. « Servir » maintient la portée large de עבד, qui comprend le service cultuel sans être limité au seul acte d’adoration.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: אֲחֵרִים signifie simplement « autres »; « étrangers » ajouterait ici une nuance qui n’est pas explicitement portée par ce mot.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: que ni toi ni tes pères n’avez connus
  rationale: La construction « ni… ni… » explicite naturellement en français la coordination hébraïque. « Connaître » conserve la possibilité d’une connaissance religieuse ou relationnelle, sans la remplacer par une interprétation plus précise.
theological_decisions:
- issue: Maintien de l’intensité des liens familiaux et personnels
  choice: Conserver les images de proximité dans « fils de ta mère », « la femme que tu serres contre toi » et « comme ta propre vie ».
  alternative: 'Employer des équivalents plus généraux : « ton propre frère », « ta femme bien-aimée » et « ton meilleur ami ».'
  rationale: L’énumération hébraïque accentue la gravité de la mise à l’épreuve en évoquant les relations humaines les plus proches. Les images sont donc maintenues dans un français naturel plutôt que remplacées par des catégories explicatives.
- issue: Portée religieuse du verbe עבד
  choice: Traduire par « servir ».
  alternative: Traduire par « adorer ».
  rationale: Dans ce contexte, עבד inclut le culte rendu à une divinité, mais son champ sémantique est plus large que l’adoration au sens strict. « Servir » préserve cette amplitude.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque. Les formulations trop archaïques, notamment « femme de ton sein », sont réservées aux notes. Le tiret final est maintenu parce que la phrase se poursuit au verset suivant.
