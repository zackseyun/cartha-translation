  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: fr
  text: Tu n’écouteras pas les paroles de ce prophète ni de celui qui a fait ce rêve[a], car Yahweh, votre Dieu, vous met à l’épreuve pour savoir si vous aimez Yahweh, votre Dieu, de tout votre cœur et de toute votre âme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui rêve ce rêve-là ». L’expression désigne celui qui a fait ou invoque le rêve mentionné au verset précédent.'
    reason: idiome_hébraïque
  - marker: b
    text: Le mot hébreu peut aussi signifier « vie », « personne » ou « être ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: Vous n’écouterez pas
  rationale: שׁמע אֶל signifie écouter quelqu’un ou prêter attention à ses paroles, avec une portée d’obéissance. Le futur français exprime naturellement l’interdiction dans ce contexte légal. Le pluriel harmonise l’adresse avec les formes plurielles qui dominent la suite du verset.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: les paroles de ce prophète
  rationale: דִּבְרֵי désigne ici les paroles prononcées; l’article suivi du démonstratif est rendu naturellement par « ce prophète ».
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: ce rêveur
  rationale: L’expression hébraïque désigne celui qui présente le rêve évoqué dans le contexte. « Ce rêveur » est clair en français, tandis qu’un calque comme « rêveur de ce rêve » serait lourd.
- source_word: מְנַסֶּה
  choice: met à l’épreuve
  rationale: Le piel de נסה exprime l’action de tester ou d’éprouver. « Met à l’épreuve » est idiomatique et conserve la valeur évaluative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לָדַעַת
  choice: pour savoir
  rationale: L’infinitif exprime ici le but. Cette formulation conserve directement l’expression anthropomorphique de l’hébreu.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: si vous aimez
  rationale: La particule interrogative introduit une question indirecte, et le participe décrit l’état ou la disposition durable d’aimer. Le présent français est la tournure naturelle.
- source_word: בְּכָל לְבַבְכֶם
  choice: de tout votre cœur
  rationale: « Cœur » conserve le langage biblique de l’intériorité, comprenant pensée, volonté et affection; la préposition « de » est idiomatique dans l’expression française « aimer de tout son cœur ».
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: et de toute votre âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie, la personne ou l’être. « Âme » maintient la formulation traditionnelle et les liens intertextuels de la formule d’alliance.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le nom propre divin; le conserver évite de le remplacer par un titre.
- issue: Dieu met son peuple à l’épreuve « pour savoir »
  choice: Conserver « pour savoir »
  alternative: pour révéler / pour montrer si vous aimez
  rationale: L’hébreu dit explicitement « pour savoir ». Reformuler en « révéler » ou « montrer » résoudrait une tension théologique que le texte laisse ouverte.
- issue: Passage du singulier au pluriel dans l’adresse
  choice: Employer le pluriel français dans l’ensemble du verset
  alternative: Tu n’écouteras pas… votre Dieu vous met à l’épreuve
  rationale: Le premier verbe hébreu est au singulier, puis le verset passe au pluriel. Le pluriel français rend clairement l’adresse collective sans produire une discordance déroutante; le changement de nombre ne modifie pas l’objet de l’interdiction.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur injonctive convient au registre légal de Deutéronome. La répétition de « Yahweh, votre Dieu » est maintenue pour préserver l’insistance de l’alliance.
