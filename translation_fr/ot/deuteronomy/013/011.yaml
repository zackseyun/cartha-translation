  source_fidelity: 'Le texte rend avec fidélité la séquence juridique hébraïque : l’injonction de lapider, l’issue explicitement formulée (« et il mourra »), le motif causal et la tentative délibérée de détourner l’interlocuteur de Yahweh. « Tu le lapideras à coups de pierres » reflète correctement וּסְקַלְתּוֹ בָאֲבָנִים, et « qui t’a fait sortir du pays d’Égypte, de la maison d’esclavage » conserve la double provenance et l’image formulée par le texte source.'
  naturalness: Le français est moderne, clair et d’un registre juridique solennel approprié. Le futur simple et le tutoiement singulier correspondent bien à l’adresse hébraïque. « À coups de pierres » est idiomatique, même si « lapider » porte déjà cette idée, et maintient utilement l’explicitation présente en hébreu.
  terminology: « Yahweh » correspond au rendu retenu du tétragramme. « Ton Dieu », « te détourner de » et « maison d’esclavage » sont exacts, naturels et théologiquement non surinterprétatifs. Les notes respectent les nuances lexicales de נדח et expliquent sobrement la formule mémorielle liée à l’Égypte.
