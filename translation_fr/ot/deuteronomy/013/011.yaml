source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: fr
  text: Tu le lapideras à coups de pierres, et il mourra, parce qu’il a cherché à te détourner[a] de Yahweh, ton Dieu, qui t’a fait sortir du pays d’Égypte, de la maison d’esclavage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « à t’égarer loin de Yahweh » ou « à t’entraîner loin de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « maison d’esclavage » est une formule de l’alliance qui rappelle la délivrance d’Israël hors d’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  choice: Tu le lapideras à coups de pierres
  rationale: Le parfait avec waw a ici une valeur injonctive dans une prescription juridique. « Lapider » exprime le mode d’exécution, tandis que « à coups de pierres » maintient le complément explicite de l’hébreu sans recourir à la tournure moins naturelle « avec des pierres ».
- source_word: וָמֵת
  choice: et il mourra
  rationale: La proposition énonce explicitement l’issue de la lapidation. Sa conservation respecte la succession et la solennité juridiques du texte hébreu.
- source_word: כִּי בִקֵּשׁ
  choice: parce qu’il a cherché
  rationale: כִּי introduit le motif de la sentence, et בִּקֵּשׁ indique une intention ou tentative délibérée. La formulation reste proche de l’hébreu sans transformer l’intention en réussite effective.
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: à te détourner de
  rationale: Le hifil de נדח exprime le fait d’amener quelqu’un à s’écarter ou à devenir infidèle. « Détourner de » rend naturellement en français la rupture d’allégeance impliquée par מֵעַל, tout en laissant ouvertes les nuances d’égarement, d’éloignement ou d’incitation.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré « Yahweh », et le suffixe singulier est rendu par « ton », conformément à l’adresse individuelle du texte.
- source_word: הַמּוֹצִיאֲךָ
  choice: qui t’a fait sortir
  rationale: Le participe désigne Yahweh par son acte historique de délivrance. Le passé composé est naturel en français moderne et « faire sortir » conserve la valeur causative du verbe.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette expression géographique standard rend directement l’hébreu et s’intègre naturellement à « faire sortir de ».
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison d’esclavage
  rationale: La traduction conserve l’image hébraïque et la formule mémorielle de l’alliance, tout en employant le terme moderne et clair « esclavage ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte directement le tétragramme. La translittération préserve le nom personnel de l’alliance plutôt que de lui substituer un titre.
- issue: Portée de לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: te détourner de Yahweh
  alternative: t’égarer loin de Yahweh / t’entraîner loin de Yahweh
  rationale: Le passage vise une tentative de rupture de fidélité envers Yahweh. « Détourner de » conserve la force causative et relationnelle sans préciser indûment si le moyen employé relève surtout de la séduction, de l’égarement ou de la contrainte.
- issue: Statut de la tentative exprimée par בִקֵּשׁ
  choice: il a cherché à
  alternative: il a tenté de
  rationale: « A cherché à » maintient la nuance volitive du verbe et n’implique pas que la personne visée ait effectivement abandonné Yahweh.
translation_notes:
  register: Français international moderne, digne et direct. Le futur simple garde la tonalité d’une prescription juridique. Le tutoiement singulier suit les formes hébraïques de deuxième personne du singulier. L’image traditionnelle de la « maison d’esclavage » est conservée et expliquée en note.
