  text: כִּֽי תִשְׁמַ֞ע בְּ/אַחַ֣ת עָרֶ֗י/ךָ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֥ן לְ/ךָ֛ לָ/שֶׁ֥בֶת שָׁ֖ם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: fr
  text: Si tu entends dire que, dans l’une des villes que Yahweh, ton Dieu, te donne pour y habiter[a] :[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour que tu t’y établisses ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « en disant »; cette formule introduit le contenu de ce qui a été rapporté au verset suivant.
    reason: source_syntax
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans ce cadre juridique casuistique, la conjonction introduit le cas envisagé; « si » rend naturellement la protase, tout en laissant possible une nuance temporelle signalée en note.
- source_word: תִשְׁמַע ... לֵאמֹר
  choice: 'tu entends dire ... :'
  rationale: Le verbe désigne ici la réception d’une information, et לֵאמֹר introduit son contenu au verset suivant. La tournure française « entendre dire » suivie de deux-points est naturelle et évite le lourd redoublement « entendre dire... disant ».
- source_word: בְּאַחַת עָרֶיךָ
  choice: dans l’une des villes
  rationale: עִיר peut désigner une ville ou une localité. « Villes » conserve le sens collectif du texte et convient au contexte des établissements d’Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: La deuxième personne masculine singulière est conservée dans l’adresse directe et dans la formule d’alliance.
- source_word: נֹתֵן לְךָ
  choice: te donne
  rationale: Le présent français exprime naturellement l’action actuelle ou caractéristique du participe hébreu sans imposer une nuance progressive peu idiomatique.
- source_word: לָשֶׁבֶת שָׁם
  choice: pour que tu y habites
  rationale: La construction infinitive exprime le but de ce don. « Habiter » est actuel, digne et plus proche du sens que « s’installer », qui pourrait le restreindre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Valeur conditionnelle ou temporelle de כִּי
  choice: Si
  alternative: Quand
  rationale: Le contexte légal présente un cas conditionnel dont la suite expose les faits et la procédure; la possible lecture temporelle demeure indiquée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le singulier « tu » reflète l’adresse hébraïque à Israël. Les deux-points rendent la fonction introductive de לֵאמֹר sans produire une répétition artificielle en français.
