  text: וּ/בָ֤א הָ/אוֹת֙ וְ/הַ/מּוֹפֵ֔ת אֲשֶׁר דִּבֶּ֥ר אֵלֶ֖י/ךָ לֵ/אמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא יְדַעְתָּ֖/ם וְ/נָֽעָבְדֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: fr
  text: 'et que le signe ou le prodige[a] dont il t’a parlé en disant : « Suivons d’autres dieux, que tu n’as pas connus, et servons-les[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le signe et le prodige »; les deux termes peuvent former une expression désignant un signe ou un prodige.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rendons-leur un culte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: et que … se réalise
  rationale: Le verbe signifie littéralement « venir », mais, appliqué à un signe annoncé, « se réaliser » exprime naturellement en français l’accomplissement de la prédiction. La tournure « et que » maintient le lien syntaxique avec le contexte précédent.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: le signe ou le prodige
  rationale: « Signe » et « prodige » sont les équivalents usuels. Bien que la coordination hébraïque soit littéralement « et », la paire peut désigner l’une ou l’autre forme de manifestation; « ou » est idiomatique dans ce contexte, tout en signalant l’autre possibilité en note.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: dont il t’a parlé
  rationale: Cette formulation française rend avec naturel la proposition relative et le complément introduit en hébreu par אֶל.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Suivons
  rationale: Le cohortatif invite à une action commune. « Suivre » restitue naturellement l’expression hébraïque « aller après » et son sens d’adhésion religieuse.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: C’est l’expression française standard correspondant à la formule deutéronomique, sans ajouter de jugement ontologique absent de cette proposition.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: que tu n’as pas connus
  rationale: « Connaître » préserve le sens d’expérience, de reconnaissance ou de relation sans préciser davantage. En français, « que » convient aussi bien à des référents personnels que non personnels et ne tranche donc pas leur statut.
- source_word: וְנָעָבְדֵם
  choice: et servons-les
  rationale: Le verbe עבד signifie « servir » et, dans ce contexte, désigne le service religieux. « Servir » conserve le vocabulaire d’allégeance de l’hébreu; « rendre un culte » est explicité en note comme équivalent contextuel.
theological_decisions:
- issue: Statut des « autres dieux »
  choice: d’autres dieux, que tu n’as pas connus
  alternative: d’autres divinités, que tu n’as pas reconnues
  rationale: La formulation traduit directement le discours rapporté sans conférer à ces dieux une légitimité ni nier explicitement leur existence. Elle conserve ainsi la tension du texte.
- issue: Portée religieuse de עבד
  choice: servons-les
  alternative: rendons-leur un culte
  rationale: « Servir » préserve la catégorie plus large de loyauté et de service religieux présente dans l’hébreu, sans réduire le verbe au seul acte cultuel.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme interlocuteur collectif. Les guillemets français et l’impératif inclusif rendent clairement le discours d’incitation.
