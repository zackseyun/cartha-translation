  variant: modern international French
source:
  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: fr
  text: Vous marcherez à la suite de Yahweh, votre Dieu, vous le craindrez, vous garderez ses commandements, vous écouterez sa voix[a], vous le servirez et vous vous attacherez à lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi signifier : « vous obéirez à sa voix » ou « vous lui obéirez ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous resterez fermement attachés à lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: Vous marcherez à la suite de Yahweh, votre Dieu
  rationale: Cette formulation conserve l’image hébraïque de la marche ainsi que l’idée d’allégeance exprimée par « à la suite de », tout en restant naturelle en français.
- source_word: תִירָאוּ
  choice: vous le craindrez
  rationale: « Craindre » préserve la force du terme d’alliance, qui englobe la crainte, le respect et la révérence envers Dieu.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: vous garderez ses commandements
  rationale: « Garder » et « commandements » maintiennent le registre formel de l’alliance et correspondent directement au sens de l’hébreu.
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: vous écouterez sa voix
  rationale: La traduction conserve l’expression concrète du texte hébreu sans rendre explicitement par « obéir » une implication qui demeure contextuelle.
- source_word: תַעֲבֹדוּ
  choice: vous le servirez
  rationale: « Servir » garde l’étendue du verbe hébreu, qui peut inclure le service cultuel sans se limiter au seul acte d’adoration.
- source_word: תִדְבָּקוּן
  choice: vous vous attacherez à lui
  rationale: Cette tournure exprime l’attachement étroit et fidèle évoqué par le verbe hébreu, dans un français courant et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le restitue au lieu de lui substituer un titre.
- issue: Valeur de שׁמע בְּקוֹל
  choice: vous écouterez sa voix
  alternative: vous obéirez à sa voix ; vous lui obéirez
  rationale: L’expression implique souvent l’obéissance, mais sa forme explicite est « écouter la voix ». Le texte principal conserve cette formulation et la note signale l’autre nuance.
- issue: Portée de עבד appliqué à Dieu
  choice: vous le servirez
  alternative: vous l’adorerez
  rationale: Le verbe peut désigner à la fois le service et le culte. « Servir » évite de réduire cette amplitude sémantique.
translation_notes:
  register: Français international moderne, clair et solennel. La série de futurs garde la cadence exhortative du verset, tandis que « marcher à la suite de » préserve l’image hébraïque sans paraître artificiel.
