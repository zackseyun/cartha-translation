  text: וְ/דָרַשְׁתָּ֧ וְ/חָקַרְתָּ֧ וְ/שָׁאַלְתָּ֖ הֵיטֵ֑ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/קִרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: fr
  text: Tu feras des recherches, tu examineras et tu interrogeras avec soin ; et s’il est vrai et établi que cette abomination a été commise au milieu de toi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: tu feras des recherches
  rationale: Dans ce contexte juridique, דרש désigne la recherche méthodique des faits. Cette formulation garde la valeur injonctive et ouvre naturellement la série de vérifications.
- source_word: וְחָקַרְתָּ
  choice: tu mèneras une enquête
  rationale: חקר évoque un examen poussé. « Mener une enquête » est naturel en français juridique courant et distingue ce verbe du précédent.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: tu interrogeras avec soin
  rationale: שאל signifie demander ou interroger, tandis que הֵיטֵב renforce l’action. La traduction conserve l’acte concret d’interroger et l’exigence de minutie.
- source_word: וְהִנֵּה
  choice: S’il est vrai
  rationale: Dans cette formule de vérification, הנה introduit le constat auquel aboutit l’enquête. Une traduction conditionnelle explicite produit un français naturel sans ajouter de certitude absente du contexte.
- source_word: אֱמֶת
  choice: vrai
  rationale: אמת qualifie ici le fait examiné comme conforme à la vérité.
- source_word: נָכוֹן הַדָּבָר
  choice: s’il est établi
  rationale: נכון indique que le fait est confirmé ou solidement établi. La reprise conditionnelle rend clairement la formule judiciaire, tandis que « il » renvoie au fait signalé.
- source_word: נֶעֶשְׂתָה
  choice: a été commise
  rationale: Le niphal de עשה exprime ici l’accomplissement de l’acte. Avec « abomination », le verbe français « commettre » est idiomatique et garde la gravité juridique.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: cette abomination
  rationale: תועבה est un terme fortement réprobateur dans le cadre de l’alliance. « Abomination » en conserve la force et le registre biblique sans préciser davantage la nature de l’acte.
- source_word: בְּקִרְבֶּךָ
  choice: au milieu de toi
  rationale: L’expression situe l’acte au sein de la communauté collective désignée au singulier. « Au milieu de toi » préserve ce singulier et la formulation solennelle du texte.
theological_decisions:
- issue: Formule de vérification judiciaire
  choice: « S’il est vrai, s’il est établi que… »
  alternative: « si le rapport est vrai et si l’affaire est établie »
  rationale: L’hébreu accumule trois actions d’enquête avant une double constatation. La traduction choisie conserve cette progression ainsi que la condition implicite, sans introduire explicitement un « rapport » qui n’apparaît pas dans ce verset.
translation_notes:
  register: Français moderne, digne et accessible, avec une cadence juridique cumulative. Le tutoiement singulier est maintenu parce que l’hébreu s’adresse à Israël comme à une entité collective. La virgule finale est conservée puisque le verset forme la protase de la prescription poursuivie au verset suivant.
