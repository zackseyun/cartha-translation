  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: fr
  text: Si tu écoutes la voix de Yahweh, ton Dieu, en gardant tous ses commandements que je te prescris aujourd’hui et en faisant ce qui est droit aux yeux de Yahweh, ton Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: si
  rationale: Dans ce contexte, la conjonction introduit la condition dont dépend la promesse précédente.
- source_word: תִשְׁמַע בְּקוֹל
  choice: tu écoutes la voix
  rationale: Cette formulation conserve l’image auditive et personnelle de l’hébreu tout en laissant entendre l’obéissance qu’implique l’expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rendu naturel de l’expression d’alliance avec le possessif singulier.
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  choice: en gardant tous ses commandements
  rationale: « Garder » préserve l’idée d’observance attentive, et le gérondif relie naturellement cette observance à l’écoute en français.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: En français courant, « donner un commandement » rend naturellement l’acte présent de prescrire, sans la lourdeur de « que je te commande aujourd’hui ».
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: en faisant ce qui est droit
  rationale: Le gérondif exprime la mise en pratique, tandis que « ce qui est droit » conserve la valeur éthique de יָשָׁר.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette locution française transparente conserve l’image hébraïque de l’évaluation selon le regard de Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée de שׁמע בקול
  choice: écouter la voix
  alternative: obéir
  rationale: « Écouter la voix » maintient à la fois l’image auditive et la nuance d’obéissance, sans réduire l’expression à sa seule conséquence pratique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste subordonnée, comme dans le texte source, puisqu’elle conclut la condition liée au contexte précédent. Les répétitions de « Yahweh, ton Dieu » sont conservées.
