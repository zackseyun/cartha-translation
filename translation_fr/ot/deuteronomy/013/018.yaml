source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: fr
  text: Que rien de ce qui est voué à la destruction ne reste attaché à ta main[a], afin que Yahweh se détourne de son ardente colère[b], qu’il t’accorde sa miséricorde, ait compassion de toi et te rende nombreux, comme il l’a juré à tes pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire plus traditionnellement : « que rien de l’interdit ne reste dans ta main ». Le mot hébreu חֵרֶם désigne ce qui est irrévocablement voué à Dieu, souvent en vue de sa destruction.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « l’embrasement de son nez », expression imagée désignant une colère intense.
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: ne reste attaché à ta main
  rationale: Le verbe דבק évoque ce qui adhère ou demeure attaché. Avec « main », l’expression désigne ici la conservation ou la prise de possession, tout en gardant l’image concrète de l’hébreu.
- source_word: מְאוּמָה מִן הַחֵרֶם
  choice: rien de ce qui est voué à la destruction
  rationale: Sous la négation, מְאוּמָה signifie « rien du tout ». חֵרֶם désigne ici ce qui est irrévocablement consacré à Dieu et, dans ce contexte, destiné à la destruction.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution introduit le but ou le résultat attendu de l’interdiction.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Yahweh se détourne de son ardente colère
  rationale: שׁוב avec מִן exprime le fait de se détourner de quelque chose. חֲרוֹן אַף est une expression imagée désignant une colère intense.
- source_word: וְנָתַן לְךָ רַחֲמִים וְרִחַמְךָ
  choice: qu’il t’accorde sa miséricorde, ait compassion de toi
  rationale: La formulation distingue le nom רַחֲמִים du verbe רחם et conserve ainsi l’intensification presque synonymique de l’hébreu.
- source_word: וְהִרְבֶּךָ
  choice: te rende nombreux
  rationale: Le hifil de רבה signifie rendre nombreux ou multiplier. Cette formulation naturelle en français conserve le sens démographique et l’écho aux promesses patriarcales.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: comme il l’a juré à tes pères
  rationale: « Tes pères » correspond précisément au texte et renvoie à la lignée patriarcale à laquelle la promesse a été faite.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme, rendu par le nom personnel « Yahweh » afin de préserver son caractère d’alliance.
- issue: Sens de חֵרֶם
  choice: ce qui est voué à la destruction
  alternative: l’interdit
  rationale: Le terme désigne ici ce qui est irrévocablement voué à Dieu, avec destruction dans ce contexte. La traduction explicite ce sens sans réduire le mot à une simple interdiction.
- issue: Langage imagé concernant la colère divine
  choice: se détourne de son ardente colère
  alternative: revienne de l’embrasement de son nez
  rationale: La traduction conserve l’intensité et le caractère personnel de la colère divine, tout en rendant naturellement l’idiome corporel hébreu.
- issue: Portée de אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Le choix garde la référence masculine et historiquement précise aux pères patriarcaux, sans généraliser silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël considéré collectivement. La répétition « miséricorde / compassion » est maintenue pour refléter l’intensification du texte source.
