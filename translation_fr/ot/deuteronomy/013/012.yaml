  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: fr
  text: Tout Israël l’apprendra et prendra peur, et l’on ne commettra plus une telle mauvaise action au milieu de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi vous ». L’hébreu emploie le singulier et s’adresse à Israël comme à un peuple formant un tout.
    reason: Préciser l’alternative idiomatique et expliquer le singulier de l’adresse collective.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Alors tout Israël
  rationale: כָּל avec le nom propre יִשְׂרָאֵל désigne collectivement le peuple tout entier. « Tout Israël » est naturel et conserve cette portée collective ; « alors » rend ici l’enchaînement et l’effet attendu de la mesure légale.
- source_word: יִשְׁמְעוּ
  choice: l’apprendra
  rationale: 'Le qal inaccompli de שׁמע a ici une valeur future : la nouvelle de ce jugement parviendra à tout Israël. Le pronom « l’ » reprend naturellement l’événement décrit dans le contexte.'
- source_word: וְיִרָאוּן
  choice: et prendra peur
  rationale: ירא exprime ici une crainte produisant un effet dissuasif. « Prendre peur » est idiomatique en français actuel et ne transforme pas cette crainte en révérence religieuse.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: et l’on ne commettra plus
  rationale: Le hiphil de יסף suivi de l’infinitif signifie « recommencer à faire » ou « faire encore ». La tournure « ne… plus » exprime clairement la cessation attendue ; le « on » collectif évite l’ambiguïté d’un pronom pluriel après « tout Israël ».
- source_word: כַדָּבָר הָרָע הַזֶּה
  choice: une telle mauvaise action
  rationale: דָּבָר désigne ici l’acte qui vient d’être décrit plutôt qu’une parole. Avec כַּ, la formulation peut être comprise comme « une chose mauvaise comme celle-ci » ; « une telle mauvaise action » rend cette valeur comparative et référentielle sans durcir le démonstratif en simple identité.
- source_word: בְּקִרְבֶּךָ
  choice: au milieu de toi
  rationale: L’expression signifie littéralement « en ton sein / au milieu de toi ». Le suffixe masculin singulier s’adresse à Israël comme à un peuple collectif ; la traduction le conserve.
theological_decisions:
- issue: Nombre du suffixe dans l’adresse collective à Israël
  choice: Conserver le singulier dans « au milieu de toi »
  alternative: « parmi vous » ou « au milieu de vous »
  rationale: Le texte hébreu emploie un suffixe masculin singulier et présente Israël comme un tout collectif. Le singulier français préserve cette caractéristique de l’adresse de l’alliance, tandis qu’une note en explicite le sens.
- issue: Nature de la crainte suscitée par le jugement
  choice: « prendra peur »
  alternative: « craindra » ou « éprouvera de la crainte »
  rationale: Dans ce contexte juridique, la crainte a une fonction de dissuasion. La traduction conserve l’idée de peur sans lui attribuer explicitement le sens théologique de révérence envers Dieu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe privilégie une formulation juridique naturelle sans archaïsme. « Au milieu de toi » conserve délibérément l’adresse collective au singulier de l’hébreu, expliquée en note.
