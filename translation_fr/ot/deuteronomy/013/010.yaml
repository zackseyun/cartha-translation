  text: כִּ֤י הָרֹג֙ תַּֽהַרְגֶ֔/נּוּ יָֽדְ/ךָ֛ תִּֽהְיֶה בּ֥/וֹ בָ/רִֽאשׁוֹנָ֖ה לַ/הֲמִית֑/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: fr
  text: 'Car tu devras absolument le mettre à mort : ta main sera la première à agir contre lui pour le mettre à mort[a], puis celle de tout le peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu devras absolument le tuer ». L’hébreu associe un infinitif absolu à un verbe conjugué pour marquer l’insistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison qui fonde l’interdiction précédente et conserve naturellement le lien logique en français.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: tu devras absolument le mettre à mort
  rationale: La construction associant l’infinitif absolu au verbe conjugué renforce l’ordre. « Devras absolument » exprime cette insistance, tandis que « mettre à mort » convient au cadre juridique.
- source_word: יָדְךָ תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: ta main sera la première à se lever contre lui
  rationale: Conserve l’image concrète de la « main » et la priorité imposée à la personne visée par le contexte, tout en produisant une phrase française naturelle.
- source_word: לַהֲמִיתוֹ
  choice: pour le faire mourir
  rationale: Rend la forme causative de מות et évite de répéter exactement « mettre à mort », sans atténuer la portée létale de l’acte.
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: puis viendra la main de tout le peuple
  rationale: Préserve le parallélisme des deux « mains » et exprime clairement la succession entre la première intervention et celle de la communauté.
theological_decisions:
- issue: Rendre le langage de l’exécution judiciaire sans l’atténuer ni le durcir artificiellement
  choice: mettre à mort
  alternative: tuer
  rationale: Le contexte prescrit une peine capitale au sein de l’ordre juridique de l’alliance. « Mettre à mort » en restitue la portée formelle sans constituer un euphémisme ni ajouter une brutalité lexicale absente du contexte.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reflète les formes hébraïques et le contexte immédiat. L’image répétée de la « main » est maintenue pour conserver le caractère concret et communautaire de la procédure.
