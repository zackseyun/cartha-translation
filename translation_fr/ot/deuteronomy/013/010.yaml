revisions:
- from: 'Car tu devras absolument le mettre à mort : ta main sera la première à se lever contre lui pour le faire mourir[a], puis viendra la main de tout le peuple.'
  to: 'Car tu devras absolument le mettre à mort : ta main sera la première à agir contre lui pour le mettre à mort[a], puis celle de tout le peuple.'
  rationale: La révision supprime l’image non exprimée de la main qui « se lève », tout en préservant la main comme agent concret, sa priorité, et la participation ultérieure de tout le peuple. Elle maintient aussi uniformément « mettre à mort » pour rendre le cadre formel de l’exécution.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:01:13Z'
review_pass:
  verdict: revise
  source_fidelity: La construction emphatique « tu devras absolument le mettre à mort » rend correctement l’infinitif absolu suivi du verbe fini. Le maintien de « ta main » et de « la main de tout le peuple » respecte le parallélisme concret du texte hébreu et la succession « d’abord / ensuite ». Toutefois, « à se lever contre lui » ajoute l’idée spécifique de lever la main, qui n’est pas exprimée dans ce verset.
  naturalness: Le français est globalement clair et de registre approprié. « Ta main sera la première contre lui » est un calque un peu abrupt; « ta main sera la première à agir contre lui » est naturel tout en conservant l’image de la main et la priorité prescrite.
  terminology: « Mettre à mort » convient au contexte juridique et évite d’affaiblir la portée du texte. « Faire mourir » est possible, mais « mettre à mort » dans la seconde occurrence maintient plus clairement le registre judiciaire et le lien avec la première proposition.
  issues:
  - severity: medium
    issue: Ajout de « se lever » dans « ta main sera la première à se lever contre lui »
    rationale: Le texte dit littéralement que la main du destinataire sera la première « contre lui » pour le mettre à mort. Il ne mentionne pas le fait de se lever ni de lever la main; cette précision doit donc être évitée.
  - severity: low
    issue: « Pour le faire mourir » affaiblit légèrement la cohérence terminologique
    rationale: Bien que la forme hifil de מות soit causative, « pour le mettre à mort » rend naturellement le sens juridique et correspond à la formulation initiale, sans introduire de nuance supplémentaire.
  revised_text: 'Car tu devras absolument le mettre à mort : ta main sera la première à agir contre lui pour le mettre à mort[a], puis celle de tout le peuple.'
  revised_footnotes:
  - marker: a
    text: 'Ou : « tu devras absolument le tuer ». L’hébreu associe un infinitif absolu à un verbe conjugué pour marquer l’insistance.'
    reason: lexical_alternative
  revision_rationale: La révision supprime l’image non exprimée de la main qui « se lève », tout en préservant la main comme agent concret, sa priorité, et la participation ultérieure de tout le peuple. Elle maintient aussi uniformément « mettre à mort » pour rendre le cadre formel de l’exécution.
