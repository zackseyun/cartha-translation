  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: fr
  text: 'Des hommes pervers[a] sont sortis du milieu de vous et ont égaré les habitants de leur ville en disant : « Allons servir d’autres dieux que vous n’avez pas connus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils de ce qui ne vaut rien »; traditionnellement : « des fils de Bélial ».'
    reason: Signaler la forme idiomatique de l’hébreu et l’ancienne traduction par « Bélial », sans introduire celle-ci dans le texte principal.
lexical_decisions:
- source_word: יָצְאוּ
  choice: sont sortis
  rationale: Le qatal de יצא s’inscrit dans le contenu du signalement introduit par le contexte. Le passé composé est naturel en français et exprime l’apparition de ces hommes au sein de la communauté.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom hébreu est explicitement masculin pluriel.
- source_word: בְּנֵי בְלִיַּעַל
  choice: des hommes pervers
  rationale: Cette expression idiomatique désigne ici des individus moralement corrompus ou malfaisants. « Hommes pervers » en restitue le sens sans faire de Bélial un nom propre dans ce contexte.
- source_word: מִקִּרְבְּךָ
  choice: du milieu de vous
  rationale: Cette formulation conserve l’idée que les instigateurs viennent de l’intérieur même de la communauté.
- source_word: וַיַּדִּיחוּ
  choice: ont égaré
  rationale: Le hifil de נדח exprime le fait de détourner ou de conduire à l’égarement, ici vers l’apostasie. « Égarer » garde ce sens sans ajouter un complément absent de l’hébreu.
- source_word: יֹשְׁבֵי עִירָם
  choice: les habitants de leur ville
  rationale: Le participe substantivé désigne ceux qui habitent la ville; « habitants » est précis et idiomatique.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rendu français courant de l’infinitif qui introduit le discours direct.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Allons servir
  rationale: Les deux cohortatifs expriment une exhortation. « Servir » conserve la portée religieuse et relationnelle de עבד, plus large que le seul acte cultuel.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Rendu direct de la formule deutéronomique, sans la restreindre au sens de « dieux étrangers ».
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: des dieux que vous n’avez pas connus
  rationale: La reprise explicite « des dieux » clarifie naturellement l’antécédent en français. « Connaître » préserve la possible nuance relationnelle de ידע plutôt que de réduire le propos à une simple information.
theological_decisions:
- issue: Interprétation de בְּנֵי בְלִיַּעַל
  choice: des hommes pervers
  alternative: des fils de Bélial
  rationale: Dans ce passage, l’expression fonctionne comme un idiome qualifiant des hommes corrompus; la traiter comme un titre personnel ou démoniaque importerait une association théologique plus tardive que le texte n’impose pas.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste exhortatif. La répétition « des dieux » évite une relative maladroite et maintient clairement le lien avec l’antécédent.
