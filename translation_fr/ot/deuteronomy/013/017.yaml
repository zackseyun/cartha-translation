  text: וְ/אֶת כָּל שְׁלָלָ֗/הּ תִּקְבֹּץ֮ אֶל תּ֣וֹךְ רְחֹבָ/הּ֒ וְ/שָׂרַפְתָּ֨ בָ/אֵ֜שׁ אֶת הָ/עִ֤יר וְ/אֶת כָּל שְׁלָלָ/הּ֙ כָּלִ֔יל לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וְ/הָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: fr
  text: Tu rassembleras tout son butin au milieu de sa place publique, puis tu brûleras au feu la ville et tout son butin, comme une offrande entièrement consumée pour le SEIGNEUR, ton Dieu[a]. Elle deviendra pour toujours un monceau de ruines[b] ; elle ne sera plus rebâtie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entièrement pour le SEIGNEUR ton Dieu ». Le mot hébreu peut indiquer soit que tout doit être consumé, soit que l’ensemble est offert à Dieu et entièrement consumé.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un monceau pour toujours », c’est-à-dire un amas permanent de ruines.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: son butin
  rationale: שָׁלָל désigne les biens pris ou susceptibles d’être pris lors d’une conquête. « Butin » est le terme français naturel dans ce contexte de guerre et de destruction.
- source_word: תִּקְבֹּץ
  choice: tu rassembleras
  rationale: L’imparfait qal à valeur directive est rendu par le futur prescriptif français, courant dans les textes législatifs.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: au milieu de sa place publique
  rationale: רְחוֹב désigne ici un espace urbain large et ouvert, où les biens peuvent être rassemblés, plutôt qu’une rue étroite.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: tu brûleras … par le feu
  rationale: Cette formulation conserve l’expression hébraïque de destruction par le feu tout en restant idiomatique en français.
- source_word: כָּלִיל
  choice: en offrande totale
  rationale: 'כָּלִיל peut signifier « entièrement », mais sa construction avec לַיהוָה permet aussi une nuance cultuelle : ce qui est entièrement consumé et voué à Dieu. « En offrande totale » conserve cette résonance sans assimiler techniquement la ville à un holocauste animal.'
- source_word: לַיהוָה
  choice: au SEIGNEUR
  rationale: Le tétragramme est rendu selon la convention française largement reconnue « le SEIGNEUR »; la préposition ל exprime ici la destination ou la consécration à Dieu.
- source_word: תֵּל עוֹלָם
  choice: pour toujours un monceau de ruines
  rationale: תֵּל évoque un amas ou tertre formé par des ruines, et עוֹלָם souligne son caractère durable. La formulation préserve à la fois l’image concrète et la permanence.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: ne sera plus rebâtie
  rationale: Le nifal exprime la reconstruction subie par la ville, tandis que עוֹד signifie qu’elle ne le sera désormais plus.
theological_decisions:
- issue: Nuance cultuelle de כָּלִיל dans l’ordre de brûler la ville
  choice: « en offrande totale au SEIGNEUR ton Dieu »
  alternative: « entièrement pour le SEIGNEUR ton Dieu »
  rationale: Le contexte permet à la fois une lecture adverbiale, qui insiste sur la destruction complète, et une lecture cultuelle, qui présente l’ensemble comme totalement voué à Dieu. Le texte principal retient la seconde nuance, comme le suggère la construction avec לַיהוָה, tandis que la note maintient explicitement l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et solennel. Le futur garde la force prescriptive du passage. « Place publique » et « monceau de ruines » rendent concrètement le cadre urbain sans archaïsme excessif. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondant aux difficultés lexicales.
