- from: Si un prophète ou un faiseur de rêves surgit parmi vous et vous donne un signe ou un prodige,[a]
  to: Si un prophète ou quelqu’un qui fait des rêves surgit parmi vous et vous donne un signe ou un prodige,[a]
  rationale: La révision remplace une formulation française ambiguë et peu idiomatique par une expression qui rend directement le sens du participe hébreu sans transformer le personnage en interprète, fabricant ou manipulateur de rêves. Le reste du verset est conservé, y compris l’ambiguïté relative au « signe ou prodige ».
