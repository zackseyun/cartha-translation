  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: fr
  text: Si un prophète ou quelqu’un qui fait des rêves surgit parmi vous et vous donne un signe ou un prodige,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un signe ou un présage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cette formulation juridique, כִּי introduit un cas conditionnel qui se poursuit au verset suivant.
- source_word: יָקוּם
  choice: surgit
  rationale: Le verbe décrit l’apparition d’une telle personne au sein de la communauté; « surgit » est naturel et garde l’idée d’émergence.
- source_word: בְּקִרְבְּךָ
  choice: parmi vous
  rationale: Cette expression situe la personne au milieu de la communauté et se rend naturellement ainsi en français moderne.
- source_word: נָבִיא
  choice: un prophète
  rationale: Équivalent français courant et précis de נָבִיא.
- source_word: חֹלֵם חֲלוֹם
  choice: un faiseur de rêves
  rationale: Cette formulation conserve la désignation particulière formée par le participe et son nom apparenté, tout en restant compréhensible en français et sans suggérer simplement une personne qui rêve occasionnellement.
- source_word: וְנָתַן אֵלֶיךָ
  choice: et vous donne
  rationale: Dans la séquence conditionnelle, la forme verbale poursuit le cas envisagé; « vous donne » restitue directement l’idée de présenter ou fournir un signe.
- source_word: אוֹת
  choice: un signe
  rationale: « Signe » exprime la valeur probante ou indicative possible du terme sans en préciser indûment la nature.
- source_word: מוֹפֵת
  choice: un prodige
  rationale: « Prodige » rend le caractère frappant de מוֹפֵת et forme en français biblique courant le couple naturel « signe ou prodige ».
theological_decisions:
- issue: Nature du signe ou du prodige donné par le prophète ou le faiseur de rêves
  choice: un signe ou un prodige
  alternative: un signe miraculeux ou un miracle; un signe ou un présage
  rationale: Le texte ne tranche pas ici si le phénomène est authentiquement miraculeux, trompeur ou seulement revendiqué. La traduction conserve donc cette tension sans ajouter de jugement théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Faiseur de rêves » conserve la texture de l’expression hébraïque tout en distinguant cette figure du prophète. « Signe ou prodige » est idiomatique dans le registre biblique français sans imposer une origine surnaturelle au phénomène.
