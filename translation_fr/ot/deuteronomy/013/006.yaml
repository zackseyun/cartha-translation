source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: fr
  text: Mais ce prophète-là, ou celui qui a fait ce rêve, sera mis à mort, car il a tenu des propos de révolte[a] contre Yahvé votre Dieu, qui vous a fait sortir d’Égypte et qui t’a racheté de la maison des esclaves[b], afin de te détourner du chemin que Yahvé ton Dieu t’a ordonné de suivre. Tu élimineras ainsi le mal au milieu de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « des propos d’apostasie ». Le terme hébreu désigne une défection ou une rébellion contre la fidélité due à Yahvé dans le cadre de l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la maison des esclaves ». L’expression désigne l’Égypte comme lieu d’asservissement. Dans ce verset, l’hébreu passe ici de « vous » au singulier collectif « te », puis maintient ce singulier.'
    reason: source_form
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא
  choice: Mais ce prophète-là
  rationale: « Mais » reprend le cas précédent avec une valeur adversative dans ce contexte juridique; « -là » restitue l’insistance du démonstratif.
- source_word: אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: ou celui qui a fait ce rêve
  rationale: Cette formulation française naturelle conserve la référence au rêve précis mentionné dans le contexte, plutôt que de généraliser en « rêveur ».
- source_word: יוּמָת
  choice: sera mis à mort
  rationale: Le hophal de מות exprime ici une exécution judiciaire, non une simple mort.
- source_word: כִּי דִבֶּר סָרָה
  choice: car il a tenu des propos de révolte
  rationale: סָרָה évoque la rébellion ou la défection envers l’alliance. Cette tournure garde explicitement l’acte de parole sans produire le calque peu naturel « parler rébellion ».
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: contre Yahvé votre Dieu
  rationale: Dans ce contexte hostile, עַל marque l’opposition. « Yahvé » est la forme française usuelle du nom divin YHWH.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: qui vous a fait sortir d’Égypte
  rationale: Formulation française idiomatique de la formule de l’exode; « Égypte » suffit naturellement à rendre le nom de pays précédé de אֶרֶץ.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: et qui t’a racheté de la maison des esclaves
  rationale: « Racheter » rend פדה, tandis que « maison des esclaves » conserve l’image sociale concrète de l’hébreu.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: Il cherchait ainsi à te détourner du chemin
  rationale: Le hiphil de נדח désigne l’action d’écarter ou d’entraîner loin du chemin. Une nouvelle phrase clarifie en français le rapport de but sans identifier Yahvé comme sujet.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: que Yahvé ton Dieu t’a ordonné de suivre
  rationale: « Suivre un chemin » restitue naturellement en français la métaphore hébraïque de marcher dans une voie.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Tu élimineras ainsi le mal du milieu de toi
  rationale: בער exprime dans cette formule juridique l’élimination décisive du mal; « du milieu de toi » maintient l’adresse collective au singulier.
theological_decisions:
- issue: Transcription du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahvé » en conserve le caractère de nom propre dans une forme française courante.
- issue: Sens de סָרָה
  choice: révolte
  alternative: apostasie
  rationale: « Révolte » préserve la dimension d’opposition à Yahvé sans imposer le terme théologique plus spécialisé « apostasie »; la note signale cette nuance possible.
- issue: Image de בֵּית עֲבָדִים
  choice: la maison des esclaves
  alternative: la maison de servitude
  rationale: Le choix conserve l’image concrète de la condition d’esclave au lieu de l’abstraire.
- issue: Alternance entre le pluriel et le singulier dans l’adresse à Israël
  choice: maintien de l’alternance « vous / te / tu »
  alternative: uniformisation au pluriel ou au singulier
  rationale: Le texte hébreu passe réellement du pluriel au singulier collectif. Le conserver respecte sa forme et évite de faire disparaître une particularité du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Le style juridique reste ferme. Les métaphores du chemin et de la maison sont conservées, tandis que les formulations trop calquées sont évitées. L’alternance pronominale inhabituelle du texte hébreu est maintenue et expliquée en note.
