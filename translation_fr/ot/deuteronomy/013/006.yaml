revisions:
- from: Mais ce prophète-là, ou celui qui a fait ce rêve, sera mis à mort, car il a tenu des propos de révolte[a] contre Yahvé votre Dieu, qui vous a fait sortir d’Égypte et qui t’a racheté de la maison des esclaves[b]. Il cherchait ainsi à te détourner du chemin que Yahvé ton Dieu t’a ordonné de suivre. Tu élimineras ainsi le mal du milieu de toi.
  to: Mais ce prophète-là, ou celui qui a fait ce rêve, sera mis à mort, car il a tenu des propos de révolte[a] contre Yahvé votre Dieu, qui vous a fait sortir d’Égypte et qui t’a racheté de la maison des esclaves[b], afin de te détourner du chemin que Yahvé ton Dieu t’a ordonné de suivre. Tu élimineras ainsi le mal au milieu de toi.
  rationale: La révision rétablit une proposition finale (« afin de te détourner ») correspondant au préfixe לְ et au hiphil de נדח, sans attribuer ambiguëment cette action à Yahvé ni introduire l’imparfait narratif. Elle remplace aussi « du milieu de toi » par la formulation française plus naturelle « au milieu de toi ». Les notes conservent leurs ancres et rendent compte de l’alternance pluriel-singulier présente dans le texte massorétique.
