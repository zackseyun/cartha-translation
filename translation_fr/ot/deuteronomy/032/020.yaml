source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: fr
  text: 'Il dit : « Je leur cacherai mon visage ; je verrai quelle sera leur fin, car ils sont une génération perverse[a], des enfants en qui il n’y a aucune fidélité[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une génération de perversités » ou « de déformations » ; autre traduction possible : « une génération tortueuse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aucune fiabilité », « aucune constance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: Je leur cacherai mon visage
  rationale: Conserve l’expression hébraïque du retrait de la faveur ou de la présence divine, ainsi que sa portée relationnelle et théologique.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: je verrai quelle sera leur fin
  rationale: אַחֲרִית peut désigner la fin, l’issue ou le sort final. « Leur fin » préserve ici la concision et la solennité de l’hébreu.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: une génération perverse
  rationale: Cette formulation française naturelle exprime la déformation morale évoquée par תַּהְפֻּכֹת, tout en signalant en note la construction nominale et intensive de l’hébreu.
- source_word: בָּנִים
  choice: des enfants
  rationale: Le mot désigne ici collectivement les membres du peuple comme enfants de Dieu ; « enfants » convient au référent générique sans restriction de sexe.
- source_word: לֹא אֵמֻן בָּם
  choice: en qui il n’y a aucune fidélité
  rationale: אֵמֻן évoque la fidélité, la fiabilité ou la constance. « Fidélité » rend au mieux l’accusation morale et relationnelle dans le contexte de l’alliance.
theological_decisions:
- issue: Expression anthropomorphique du « visage » divin
  choice: Conserver « Je leur cacherai mon visage »
  alternative: « Je me détournerai d’eux » ou « Je les délaisserai »
  rationale: L’image hébraïque porte l’idée du retrait de la faveur ou de la présence divine sans en préciser le mécanisme. La conserver évite d’aplanir sa portée théologique.
- issue: Sens de אֵמֻן
  choice: fidélité
  alternative: fiabilité ou constance
  rationale: Dans ce contexte, le terme vise la qualité morale et relationnelle des enfants, et non la simple croyance intellectuelle. « Fidélité » conserve cette dimension sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu tout en étant naturelle. Les marqueurs de notes sont placés auprès des expressions qu’ils expliquent.
