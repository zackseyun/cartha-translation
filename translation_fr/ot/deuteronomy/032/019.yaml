  source_fidelity: Le texte hébreu dit littéralement que Yahweh « vit » puis les repoussa/rejeta avec mépris, en raison de la provocation causée par ses fils et ses filles. L’objet de « vit » n’est pas exprimé et doit rester non précisé. « Les rejeta » est recevable pour וַיִּנְאָץ, avec une note qui conserve la nuance de mépris. « Mis en colère par » rend plus exactement la force causale de מִכַּעַס que « irrité par ».
  naturalness: La phrase révisée est sobre, fluide et naturelle en français international moderne. L’omission de l’objet après « vit » est idiomatique dans cette coordination et évite d’ajouter « cela », qui spécifiait inutilement l’objet implicite.
  terminology: « Yahweh » correspond au choix du projet pour le tétragramme. « Fils et filles » conserve l’explicitation masculine et féminine du texte source. « Mis en colère » maintient la gravité de la réaction divine sans l’amplifier.
