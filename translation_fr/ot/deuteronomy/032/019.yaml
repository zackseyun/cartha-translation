  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: fr
  text: Yahweh vit et les rejeta[a], mis en colère par ses fils et ses filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les repoussa » ou « les traita avec mépris ».'
    reason: Alternative lexicale pour נאץ, qui peut exprimer un rejet teinté de mépris.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom d’alliance est conservé sous sa forme usuelle « Yahweh », plutôt que remplacé par un titre.
- source_word: וַיַּרְא
  choice: vit cela
  rationale: Le verbe ראה signifie normalement « voir ». Le pronom « cela », implicite en hébreu, renvoie naturellement en français à la conduite décrite dans le contexte.
- source_word: וַיִּנְאָץ
  choice: les rejeta
  rationale: נאץ exprime un rejet marqué de mépris. « Les rejeta » rend clairement la rupture relationnelle sans pousser le sens jusqu’à « les abhorra ».
- source_word: מִכַּעַס
  choice: irrité par
  rationale: כעס désigne ici la contrariété ou la provocation qui suscite la colère, et מִן a une valeur causale. « Irrité par » restitue cette relation avec naturel et concision.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: ses fils et ses filles
  rationale: La formulation garde la mention explicite des deux groupes présente dans l’hébreu, au lieu de la généraliser en « ses enfants ».
theological_decisions:
- issue: Objet implicite de וַיִּנְאָץ
  choice: L’objet est explicité par « les », qui renvoie au peuple d’Israël.
  alternative: 'Laisser l’objet inexprimé : « Yahweh vit et rejeta ».'
  rationale: Le contexte identifie le peuple comme objet du rejet, et le français demande normalement un complément ici. L’explicitation ne résout aucune ambiguïté théologique supplémentaire.
- issue: Nature de la réaction divine
  choice: « les rejeta » et « irrité par »
  alternative: « les méprisa » et « à cause de la provocation de »
  rationale: La formulation retenue maintient la gravité du jugement divin provoqué par l’infidélité du peuple, sans atténuation ni intensification indue.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; « cela » et « les » explicitent des compléments requis ou favorisés par l’usage français.
