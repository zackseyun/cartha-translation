source:
  edition: WLC
  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: fr
  text: Quand le Très-Haut donna aux nations leur héritage, quand il sépara les fils des hommes[b], il fixa les frontières des peuples selon le nombre des fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les manuscrits de la mer Morte et la Septante portent « fils de Dieu » (ou « anges de Dieu ») au lieu de « fils d’Israël ».
    reason: textual_variant
  - marker: b
    text: L’expression hébraïque « fils des hommes » désigne les êtres humains, c’est-à-dire l’humanité.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַנְחֵל
  choice: Quand ... donna ... leur héritage
  rationale: L’infinitif construit au hifil, précédé de בְּ, introduit une proposition temporelle. Cette formulation exprime naturellement l’attribution d’un héritage aux nations tout en conservant l’image hébraïque de l’héritage.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Il s’agit ici d’un titre divin. « Le Très-Haut » est la forme française consacrée, claire et digne.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Le terme désigne les différents peuples du monde, sans porter nécessairement le sens religieux plus tardif de « païens ».
- source_word: בְּהַפְרִידוֹ
  choice: quand il sépara
  rationale: Ce second infinitif construit temporel renvoie au Très-Haut. « Sépara » rend directement le sens de פרד sans préciser un mode de séparation que le texte ne donne pas.
- source_word: בְּנֵי אָדָם
  choice: les fils d’Adam
  rationale: La traduction conserve la forme masculine et l’image généalogique de l’hébreu. En français, « d’Adam » évite l’association involontaire de « fils de l’homme » avec un titre christologique, tandis qu’une note explicite la portée collective de l’expression.
- source_word: יַצֵּב
  choice: il fixa
  rationale: Le hifil de יצב exprime l’action d’établir fermement. « Fixa » convient naturellement à la délimitation de frontières.
- source_word: גְּבֻלֹת עַמִּים
  choice: les frontières des peuples
  rationale: « Frontières » exprime la délimitation territoriale, et « peuples » distingue naturellement עַמִּים de גּוֹיִם sans effacer leur proximité sémantique.
- source_word: לְמִסְפַּר
  choice: selon le nombre
  rationale: La préposition introduit ici une correspondance ou une mesure. « Selon le nombre » reste proche de l’hébreu et idiomatique en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le texte massorétique fourni porte « fils d’Israël ». La traduction le reproduit sans le remplacer par l’interprétation plus générale « Israélites ».
theological_decisions:
- issue: Variante textuelle dans la dernière proposition
  choice: les fils d’Israël
  alternative: les fils de Dieu / les anges de Dieu
  rationale: Le texte hébreu WLC fourni lit בְּנֵי יִשְׂרָאֵל. Cette leçon est donc retenue dans le texte principal. La variante attestée par les manuscrits de la mer Morte et la Septante modifie sensiblement la représentation théologique du partage des nations; elle est signalée en note plutôt que résolue silencieusement.
- issue: Portée anthropologique de בְּנֵי אָדָם
  choice: les fils d’Adam
  alternative: les humains / l’humanité
  rationale: La formulation principale préserve l’expression masculine et généalogique de l’hébreu. La note indique qu’elle désigne collectivement les êtres humains, sans substituer cette explication au texte poétique.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe parallèle de l’hébreu est conservée. Les termes traditionnels compréhensibles (« Très-Haut », « héritage ») sont maintenus, tandis que les notes préservent la variante textuelle et la portée collective de l’expression anthropologique.
