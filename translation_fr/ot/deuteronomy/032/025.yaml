- from: Au-dehors[a], l’épée privera de leurs enfants ; et dans les chambres, ce sera l’épouvante — aussi bien le jeune homme que la jeune fille[b], l’enfant qui tète comme l’homme aux cheveux blancs.
  to: Au-dehors[a], l’épée fera des endeuillés ; dans les chambres, l’effroi — le jeune homme aussi bien que la jeune fille[b], l’enfant qui tète avec l’homme aux cheveux blancs.
  rationale: La correction principale rétablit la valeur additive de עִם par « avec ». La formulation de l’action de l’épée est rendue plus naturelle sans expliciter indûment les personnes privées de leurs enfants. Les notes sont harmonisées avec les choix français et avec l’ambiguïté lexicale de betoulah.
