  text: מִ/חוּץ֙ תְּשַׁכֶּל חֶ֔רֶב וּ/מֵ/חֲדָרִ֖ים אֵימָ֑ה גַּם בָּחוּר֙ גַּם בְּתוּלָ֔ה יוֹנֵ֖ק עִם אִ֥ישׁ שֵׂיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: fr
  text: Au-dehors[a], l’épée fera des endeuillés ; dans les chambres, l’effroi — le jeune homme aussi bien que la jeune fille[b], l’enfant qui tète avec l’homme aux cheveux blancs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « et depuis les chambres, l’effroi » ; l’hébreu oppose le danger au-dehors à la terreur à l’intérieur.
    reason: lexical_alternative
  - marker: b
    text: « Jeune fille » rend l’hébreu betoulah, qui désigne une jeune femme non mariée, souvent avec l’idée de virginité ; « vierge » est aussi possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: Au-dehors
  rationale: Conserve avec concision l’opposition spatiale entre l’extérieur et les chambres intérieures, sans préciser indûment « dans la rue ».
- source_word: תְּשַׁכֶּל
  choice: privera de leurs enfants
  rationale: Le piel de שׁכל exprime le fait de rendre sans enfants ou d’endeuiller. Cette formulation garde cette valeur causative, bien que les victimes implicites ne soient pas nommées dans l’hébreu.
- source_word: חֶרֶב
  choice: l’épée
  rationale: L’image traditionnelle et personnifiée de l’épée représente ici la mort violente liée à la guerre.
- source_word: וּמֵחֲדָרִים
  choice: et dans les chambres
  rationale: La préposition signifie littéralement « depuis les chambres », mais le parallélisme local avec « au-dehors » indique le domaine intérieur où règne l’épouvante.
- source_word: אֵימָה
  choice: l’épouvante
  rationale: Terme fort et soutenu, mais courant, qui rend la peur accablante exprimée par אֵימָה et convient au rythme poétique.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: aussi bien le jeune homme que la jeune fille
  rationale: Rend la paire de jeunes personnes des deux sexes. En français moderne, « jeune fille » désigne naturellement une jeune femme non mariée sans imposer une affirmation physiologique plus explicite que le contexte.
- source_word: יוֹנֵק
  choice: l’enfant qui tète
  rationale: Préserve l’image participiale concrète de celui qui est encore allaité plutôt que de la réduire au terme plus général « nourrisson ».
- source_word: עִם אִישׁ שֵׂיבָה
  choice: comme l’homme aux cheveux blancs
  rationale: Dans cette construction distributive, « comme » relie naturellement les deux extrêmes d’âge ; « aux cheveux blancs » conserve l’image concrète de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. Le vers conserve le contraste abrupt entre le dehors et l’intérieur ainsi que l’énumération englobant les deux sexes et tous les âges.
