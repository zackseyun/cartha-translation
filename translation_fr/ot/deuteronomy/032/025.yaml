  source_fidelity: La liste finale doit conserver עִם (« avec »), non « comme ». « L’épée fera des endeuillés » rend de manière idiomatique l’effet de שׁכל (« priver d’enfants / endeuiller ») sans introduire un complément humain absent de l’hébreu. Le contraste entre le dehors et les pièces intérieures, ainsi que l’énumération de tous âges et des deux sexes, sont préservés.
  naturalness: La révision supprime l’emploi non justifié de « comme » et allège « ce sera l’épouvante » en une formulation nominale poétique naturelle. La phrase demeure compréhensible en français international moderne.
