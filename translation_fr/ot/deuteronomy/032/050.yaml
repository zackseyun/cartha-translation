source:
  edition: WLC
  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: fr
  text: et meurs sur la montagne où tu montes, puis sois réuni aux tiens[a], comme Aaron, ton frère, est mort au mont Hor et a été réuni aux siens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ton peuple ». On peut aussi comprendre : « à tes ancêtres ».'
    reason: Précise la formulation hébraïque sous-jacente et signale une autre traduction possible de l’idiome.
lexical_decisions:
- source_word: וּמֻת
  choice: et meurs
  rationale: L’impératif qal adressé à Moïse est rendu directement, sans transformer l’ordre en simple prédiction.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: sur la montagne où tu montes
  rationale: « Sur la montagne » exprime naturellement la valeur locative; « où tu montes » conserve le mouvement ascendant et intègre שָׁמָּה sans le calque pesant « là ».
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: puis sois réuni aux tiens
  rationale: Le passif « sois réuni » préserve l’image de l’idiome hébreu. « Aux tiens » est naturel en français et garde une portée plus large que le seul mot « ancêtres ».
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit clairement et naturellement la comparaison avec la mort d’Aaron.
- source_word: מֵת אַהֲרֹן אָחִיךָ
  choice: Aaron, ton frère, est mort
  rationale: L’ordre et l’apposition restent proches de l’hébreu tout en étant idiomatiques en français.
- source_word: בְּהֹר הָהָר
  choice: au mont Hor
  rationale: Forme française conventionnelle du nom de lieu; la préposition « au » convient au lieu où Aaron est mort.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: et a été réuni aux siens
  rationale: La répétition de la même formule maintient la cohérence lexicale et le parallèle entre Moïse et Aaron.
theological_decisions:
- issue: Sens de l’idiome אסף אל־עמיו
  choice: Conserver l’image « être réuni aux siens » dans le texte principal
  alternative: être réuni à ses ancêtres; rejoindre les siens dans la mort
  rationale: La formule désigne la mort, mais peut évoquer davantage que l’inhumation ou la seule ascendance. La traduction conserve donc son ouverture et sa tension théologique.
translation_notes:
  register: Français international actuel, digne et accessible. La coordination « puis » évite une succession heurtée de « et » sans affaiblir l’enchaînement. « Aux tiens » rend l’idiome plus naturellement que le calque « à ton peuple », lequel est indiqué en note.
