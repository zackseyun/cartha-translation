  naturalness: Le français est actuel, fluide et d’un registre biblique accessible. « Être réuni aux tiens » est idiomatique sans réduire la formule à une simple indication d’inhumation. La ponctuation autour de « Aaron, ton frère » est naturelle.
  terminology: « Mont Hor » est une forme française recevable. La cohérence entre « réuni aux tiens » et « réuni aux siens » préserve le parallélisme du texte hébreu. La note explique avec justesse le sens littéral et l’alternative « ancêtres », sans trancher indûment la portée de l’expression.
