source:
  edition: WLC
  text: אִם שַׁנּוֹתִי֙ בְּרַ֣ק חַרְבִּ֔/י וְ/תֹאחֵ֥ז בְּ/מִשְׁפָּ֖ט יָדִ֑/י אָשִׁ֤יב נָקָם֙ לְ/צָרָ֔/י וְ/לִ/מְשַׂנְאַ֖/י אֲשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: fr
  text: Si j’aiguise l’éclair de mon épée et que ma main se saisit du jugement, j’exercerai la vengeance contre mes adversaires et je rétribuerai ceux qui me haïssent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Quand
  rationale: Dans cette déclaration solennelle, la particule introduit une éventualité présentée comme devant conduire à l’action annoncée; « quand » rend naturellement cette valeur contextuelle sans faire de l’acte une simple hypothèse incertaine.
- source_word: שַׁנּוֹתִי בְּרַק חַרְבִּי
  choice: j’aiguiserai l’éclair de mon épée
  rationale: Conserve l’image poétique saisissante de l’hébreu, où l’éclat fulgurant de l’épée est directement associé à son aiguisage.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: et que ma main saisira le jugement
  rationale: Maintient la personnification concrète et la formulation judiciaire du texte source, sans réduire מִשְׁפָּט à la seule idée de punition.
- source_word: אָשִׁיב נָקָם לְצָרָי
  choice: j’exercerai la vengeance contre mes adversaires
  rationale: « Exercer la vengeance » exprime idiomatiquement l’action rétributive de אָשִׁיב נָקָם; « adversaires » rend צָרַי sans affaiblir l’opposition.
- source_word: וְלִמְשַׂנְאַי אֲשַׁלֵּם
  choice: et je rendrai à ceux qui me haïssent ce qu’ils méritent
  rationale: Rend le verbe de rétribution אֲשַׁלֵּם en français courant et digne, avec l’idée de rendre selon les actes, sans suggérer un simple paiement commercial.
theological_decisions:
- issue: Nature de la vengeance divine
  choice: Conserver explicitement « la vengeance » et le cadre du jugement
  alternative: Adoucir en « justice » ou « châtiment »
  rationale: Le verset attribue sans détour à Dieu une rétribution judiciaire contre ses adversaires; la traduction ne doit ni l’atténuer ni la détacher du jugement mentionné dans le même membre de phrase.
- issue: Valeur de אִם au début du verset
  choice: « Quand »
  alternative: « Si »
  rationale: Le contexte du cantique présente l’intervention comme une déclaration de ce que Dieu accomplira. « Quand » reflète cette portée, tout en reconnaissant que la particule hébraïque a fondamentalement une valeur conditionnelle.
translation_notes:
  register: Français international moderne, solennel et poétique. La syntaxe parallèle et les images anthropomorphiques de la main, de l’épée et du jugement sont conservées; aucune terminologie confessionnelle particulière n’est ajoutée.
