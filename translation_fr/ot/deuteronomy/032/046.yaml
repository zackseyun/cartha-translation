  verdict: revise
  source_fidelity: Le texte rend bien l’injonction « prenez à cœur », la répétition de « paroles », « vos fils », ainsi que le double mouvement « observer et mettre en pratique ». Le futur « Vous ordonnerez » convient à l’imparfait hébreu dans la relative et demeure compréhensible comme prescription. « Je vous atteste » conserve de façon acceptable le témoignage solennel de מֵעִיד בָּכֶם sans imposer « contre vous ».
  naturalness: Le français du texte principal est moderne, digne et naturel. La division en deux phrases est fluide, même si elle rend un peu moins visible la dépendance syntaxique des deux relatives hébraïques.
  terminology: '« Prenez à cœur », « paroles », « observer », « mettre en pratique » et « loi » sont appropriés au registre deutéronomique. La note a doit toutefois être corrigée : « invoque … comme témoignage contre vous » attribue de manière imprécise aux paroles la fonction d’un témoignage invoqué, alors que le verbe décrit le témoignage/avertissement solennel du locuteur envers (éventuellement contre) les destinataires.'
  issues:
