  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ שִׂ֣ימוּ לְבַבְ/כֶ֔ם לְ/כָל הַ/דְּבָרִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י מֵעִ֥יד בָּ/כֶ֖ם הַ/יּ֑וֹם אֲשֶׁ֤ר תְּצַוֻּ/ם֙ אֶת בְּנֵי/כֶ֔ם לִ/שְׁמֹ֣ר לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: fr
  text: 'Il leur dit : « Prenez à cœur toutes les paroles que je vous atteste aujourd’hui[a]. Vous ordonnerez à vos fils[b] d’observer et de mettre en pratique toutes les paroles de cette loi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont je vous avertis aujourd’hui » ou « dont je témoigne aujourd’hui contre vous ». Le verbe hébreu peut exprimer le témoignage solennel, l’avertissement et, dans le cadre de l’alliance, une nuance judiciaire.
    reason: alternative_reading
  - marker: b
    text: Littéralement « vos fils »; ce terme peut représenter plus largement la génération suivante.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Prenez à cœur
  rationale: Cette locution française naturelle rend l’image hébraïque du cœur comme siège de l’attention, de la volonté et de la résolution, sans la limiter au sentiment.
- source_word: הַדְּבָרִים
  choice: les paroles
  rationale: Dans ce contexte d’énoncé solennel de l’alliance, דְּבָרִים désigne des paroles ou prescriptions prononcées; « paroles » conserve aussi la répétition du verset.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: que je vous atteste aujourd’hui
  rationale: « Attester » maintient l’idée de témoignage solennel et accepte les paroles comme objet direct. Le pronom « vous » rend la relation marquée par בָּכֶם sans imposer la nuance plus forte de témoignage à charge.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: Vous ordonnerez
  rationale: Le futur français exprime ici l’injonction qui découle de l’appel à prendre ces paroles à cœur. Une nouvelle phrase évite une relative lourde tout en conservant le lien logique et l’autorité du verbe צוה.
- source_word: בְּנֵיכֶם
  choice: vos fils
  rationale: Le texte hébreu emploie explicitement le masculin pluriel « fils »; la traduction le conserve, tandis qu’une note signale sa portée générationnelle possible.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: d’observer et de mettre en pratique
  rationale: 'Les deux infinitifs sont maintenus : le premier évoque l’observance attentive, le second l’accomplissement concret.'
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: les paroles de cette loi
  rationale: « Loi » convient au cadre d’alliance du Deutéronome, tout en reconnaissant que תּוֹרָה peut plus largement signifier « instruction ». « Paroles » reproduit la formulation hébraïque.
theological_decisions:
- issue: Nuance testimoniale, admonitrice ou judiciaire de מֵעִיד בָּכֶם
  choice: que je vous atteste aujourd’hui
  alternative: dont je vous avertis aujourd’hui ; que j’invoque aujourd’hui comme témoignage contre vous
  rationale: Le texte principal garde le sens de témoignage solennel sans décider si l’accent porte surtout sur l’avertissement ou sur une fonction judiciaire à charge. Ces nuances authentiques sont conservées en note.
- issue: Référence genrée de בְּנֵיכֶם
  choice: vos fils
  alternative: vos enfants
  rationale: Le masculin lexical du texte source est conservé. La note indique que, selon l’usage collectif et le contexte de transmission, les fils peuvent représenter plus largement la génération suivante.
- issue: Valeur de תּוֹרָה
  choice: loi
  alternative: instruction
  rationale: Dans le contexte deutéronomique, « loi » est clair, traditionnel et approprié à l’alliance, sans nier le champ sémantique plus large d’« instruction ».
translation_notes:
  register: Français international moderne, digne et accessible. « Prenez à cœur » est idiomatique sans effacer l’image du texte source. La seconde phrase allège la syntaxe française, tandis que le futur à valeur injonctive conserve la force du discours. Les répétitions de « paroles » et la double idée d’observer puis d’accomplir sont volontairement maintenues.
