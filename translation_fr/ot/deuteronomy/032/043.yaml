base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: fr
  text: Réjouissez-vous[a], nations, avec son peuple[c], car il vengera le sang de ses serviteurs[b] ; il fera retomber sur ses adversaires la vengeance, et il fera expiation pour sa terre et son peuple[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Poussez des cris de joie » ou « Chantez de joie ». Le verbe hébreu peut évoquer une joie exprimée à haute voix. La construction très condensée peut aussi se comprendre : « Acclamez son peuple, nations. »'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: L’hébreu dit « le sang de ses serviteurs » ; selon le contexte, le nom peut aussi signifier « esclaves ».
    reason: lexical_alternative
  - marker: c
    text: La Septante grecque et un manuscrit de la mer Morte conservent une forme plus longue de ce verset, qui appelle aussi les cieux et les êtres divins à se réjouir et les nations à se prosterner devant Dieu. Le texte principal suit ici l’hébreu massorétique.
    reason: textual_variant
  - marker: d
    text: 'Ou : « il purifiera sa terre et son peuple », ou « il ôtera la souillure de sa terre et de son peuple ». Le verbe hébreu peut mettre l’accent sur l’expiation ou sur la purification qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Réjouissez-vous
  rationale: L’impératif pluriel de רנן exprime une exultation joyeuse, souvent manifestée par des cris ou des chants. « Réjouissez-vous » est naturel et digne ; la nuance sonore est signalée en note.
- source_word: גוֹיִם
  choice: nations
  rationale: Dans ce cadre international et collectif, « nations » rend directement גוים sans la coloration néotestamentaire que pourrait avoir « païens ».
- source_word: עַמּוֹ
  choice: avec son peuple
  rationale: La formulation massorétique est très condensée et ne comporte pas de préposition explicite. « Avec » exprime la relation syntaxique la plus probable tout en signalant en note l’ambiguïté réelle.
- source_word: כִּי
  choice: car
  rationale: Introduit le motif de l’appel à la joie dans un registre poétique naturel.
- source_word: דַם עֲבָדָיו
  choice: le sang de ses serviteurs
  rationale: עבדים peut désigner des serviteurs ou des esclaves. Ici, l’appartenance à Dieu et leur sang versé sont au premier plan ; « serviteurs » convient mieux au contexte.
- source_word: יִקּוֹם
  choice: il vengera
  rationale: Dans la construction avec « le sang », le verbe נקם signifie que Dieu fera justice pour le sang versé.
- source_word: וְנָקָם יָשִׁיב
  choice: il fera retomber la vengeance
  rationale: Cette formulation conserve à la fois l’objet « vengeance » et l’idée littérale de retour portée par ישיב, dans un français idiomatique.
- source_word: לְצָרָיו
  choice: sur ses adversaires
  rationale: צרים désigne des opposants hostiles. « Adversaires » garde le registre solennel du poème.
- source_word: וְכִפֶּר
  choice: il fera l’expiation pour
  rationale: כפר porte ici une force expiatoire, avec une possible nuance de purification. La traduction retient le poids théologique du terme sans préciser par quel moyen l’expiation s’accomplit.
- source_word: אַדְמָתוֹ
  choice: sa terre
  rationale: אדמה désigne le sol ou la terre ; « sa terre » convient au cadre national et à l’alliance.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: La désignation finale est conservée directement. La coordination française avec « sa terre » rend naturellement la paire finale condensée de l’hébreu.
theological_decisions:
- issue: Relation entre les nations et « son peuple » dans le premier membre
  choice: Les nations sont appelées à se réjouir avec le peuple de Dieu.
  alternative: Les nations sont appelées à acclamer ou à célébrer son peuple ; l’hébreu massorétique peut aussi être lu de façon plus abrupte sans relation explicitée.
  rationale: Le texte massorétique juxtapose « nations » et « son peuple » sans préposition. L’ajout minimal de « avec » donne en français la relation la plus probable, mais la note préserve l’ambiguïté syntaxique.
- issue: Sens de כפר dans la dernière proposition
  choice: Dieu fait l’expiation pour sa terre et pour son peuple.
  alternative: Dieu purifie sa terre et son peuple, ou en ôte la souillure.
  rationale: « Faire l’expiation » conserve la portée expiatoire du verbe sans exclure sa nuance purificatrice ni imposer une explication doctrinale ultérieure.
- issue: Objet et mouvement de la vengeance dans וְנָקָם יָשִׁיב לְצָרָיו
  choice: Dieu fait retomber la vengeance sur ses adversaires.
  alternative: Dieu rend la vengeance à ses adversaires, ou rétribue ses adversaires.
  rationale: Le choix maintient « vengeance » comme élément explicite et rend le mouvement de retour exprimé par ישיב, sans réduire la proposition à une simple répétition de « vengera ».
translation_notes:
  register: 'Français international moderne, poétique et solennel sans archaïsmes. La ponctuation conserve les trois mouvements du verset : appel à la joie, justice exercée contre les adversaires, puis expiation en faveur de la terre et du peuple. Les ajouts nécessaires à l’idiome français (« avec », « et », répétition de « pour ») restent minimaux, tandis que les ambiguïtés syntaxiques, lexicales et textuelles sont documentées.'
