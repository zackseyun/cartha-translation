  text: אַסְפֶּ֥ה עָלֵ֖י/מוֹ רָע֑וֹת חִצַּ֖/י אֲכַלֶּה בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: fr
  text: 'J’accumulerai sur eux les malheurs[a] ;

    je tirerai contre eux toutes mes flèches[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les calamités » ; littéralement « les maux », au sens de coups funestes et non du mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou « je lancerai contre eux toutes mes flèches ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: J’accumulerai
  rationale: Le verbe exprime ici l’idée de faire s’amasser les coups du jugement. « Accumuler » restitue cette force sans alourdir le vers poétique.
- source_word: עָלֵימוֹ
  choice: sur eux
  rationale: La préposition עַל présente les malheurs comme s’abattant sur leurs destinataires ; « sur eux » conserve cette image.
- source_word: רָעוֹת
  choice: les malheurs
  rationale: Dans ce contexte, le pluriel désigne des événements funestes ou des calamités, et non le mal moral. « Malheurs » est naturel, grave et suffisamment large.
- source_word: חִצַּי
  choice: mes flèches
  rationale: Traduction littérale qui maintient intacte la métaphore guerrière.
- source_word: אֲכַלֶּה
  choice: j’épuiserai
  rationale: Le piel de כלה exprime l’emploi jusqu’à épuisement. Avec « mes flèches », « épuiser » évoque clairement le fait de vider ses réserves de projectiles.
- source_word: בָּם
  choice: contre eux
  rationale: La préposition בְּ marque ici les personnes prises pour cible ; « contre eux » rend naturellement cette orientation hostile.
theological_decisions:
- issue: Sens de רָעוֹת dans un contexte de jugement divin
  choice: les malheurs
  alternative: les maux ; les calamités
  rationale: Le terme hébreu peut désigner largement ce qui est mauvais ou funeste. Ici, le parallélisme avec les flèches indique des coups judiciaires. « Malheurs » en préserve la gravité sans suggérer que Dieu commet le mal moral.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme des deux propositions et la métaphore guerrière sont conservés ; « j’épuiserai contre eux mes flèches » garde volontairement une légère hauteur de style adaptée au cantique.
