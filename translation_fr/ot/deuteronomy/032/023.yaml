review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend fidèlement אַסְפֶּה ... רָעוֹת : Dieu annonce qu’il fera s’accumuler sur eux des événements funestes. La seconde vise correctement l’idée de כלה, employer ses flèches jusqu’à épuisement contre eux. Toutefois, « j’épuiserai contre eux mes flèches » attribue de façon peu idiomatique l’épuisement aux flèches elles-mêmes et obscurcit l’action de les tirer.'
  naturalness: « J’accumulerai sur eux les malheurs » est naturel dans un registre poétique soutenu. Pour la seconde ligne, « je tirerai contre eux toutes mes flèches » est idiomatique en français moderne et exprime clairement l’épuisement total impliqué par le verbe hébreu.
  terminology: « Malheurs » convient à רָעוֹת dans ce contexte de jugement et ne désigne pas nécessairement le mal moral. La métaphore militaire de « mes flèches » est maintenue. La note a peut conserver l’alternative « calamités » et l’explication du sens non moral.
  issues:
  - severity: medium
    issue: Formulation française peu idiomatique de la seconde proposition
    rationale: En français courant, on n’« épuise » pas naturellement des flèches « contre » quelqu’un. Le sens visé est de les tirer toutes contre la cible. Une formulation explicite conserve l’intensité du piel de כלה sans calque.
  - severity: low
    issue: Note b également peu naturelle
    rationale: « Dépenser mes flèches » est un calque lexical peu usuel en français. Une note proposant « lancer toutes mes flèches contre eux » offre une alternative naturelle et fidèle.
