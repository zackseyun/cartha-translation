source:
  edition: WLC
  text: ל֥וּ חָכְמ֖וּ יַשְׂכִּ֣ילוּ זֹ֑את יָבִ֖ינוּ לְ/אַחֲרִיתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: fr
  text: Si seulement ils étaient sages, ils comprendraient cela ; ils discerneraient leur fin[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur avenir », « ce qui les attend ». Le mot hébreu peut désigner la fin, l’issue d’une situation ou ce qui vient par la suite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: Si seulement
  rationale: La particule introduit ici un souhait chargé de regret plutôt qu’une simple condition ; « Si seulement » en restitue naturellement la valeur optative.
- source_word: חָכְמ֖וּ
  choice: ils étaient sages
  rationale: Le verbe חכם exprime ici le fait de posséder ou d’exercer la sagesse. L’imparfait convient après « Si seulement » en français moderne.
- source_word: יַשְׂכִּ֣ילוּ
  choice: ils comprendraient
  rationale: Le hiphil de שׂכל peut signifier comprendre, acquérir du discernement ou agir avec sagesse. Dans ce parallélisme, « comprendraient » met justement en avant la perception intellectuelle.
- source_word: זֹ֑את
  choice: cela
  rationale: Le démonstratif singulier renvoie à la réalité ou à l’enseignement évoqué dans le contexte précédent ; « cela » est idiomatique et conserve le singulier.
- source_word: יָבִ֖ינוּ
  choice: ils discerneraient
  rationale: Le verbe בין signifie percevoir avec intelligence ou discerner. Ce choix le distingue de יַשְׂכִּילוּ et préserve la progression poétique.
- source_word: לְאַחֲרִיתָֽם
  choice: leur fin
  rationale: אַחֲרִית peut désigner la fin, l’issue ou l’avenir de quelqu’un. « Leur fin » est concis et maintient la portée d’avertissement du contexte sans exclure les autres nuances.
theological_decisions:
- issue: Sens de אַחֲרִיתָם dans le contexte
  choice: leur fin
  alternative: leur avenir ; ce qui les attend ; leur issue finale
  rationale: Le cantique invite les personnes visées à percevoir l’issue qui les attend. « Leur fin » conserve la force morale et judiciaire du passage, tandis que la note signale l’étendue sémantique du terme hébreu.
- issue: Rapport entre le souhait initial et les verbes suivants
  choice: 'une construction conditionnelle à valeur de regret : « Si seulement… ils… »'
  alternative: 'trois souhaits coordonnés : « Ah ! s’ils étaient sages, s’ils comprenaient… »'
  rationale: La particule לו porte clairement une nuance optative. La formulation retenue exprime naturellement en français le regret et sa conséquence envisagée, tout en laissant perceptible la tension entre souhait et condition.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule conserve le parallélisme des deux verbes de perception. Le point d’exclamation rend la force du souhait empreint de regret sans ajouter d’interprétation confessionnelle.
