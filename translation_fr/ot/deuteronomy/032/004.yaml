- from: Le Rocher, son œuvre est parfaite, car toutes ses voies sont justice[a]. C’est un Dieu fidèle[b], sans injustice[c] ; il est juste et droit.
  to: 'Le Rocher : son œuvre est parfaite, car toutes ses voies sont justice[a]. C’est un Dieu fidèle[b], et il n’y a en lui aucune injustice[c] ; il est juste et droit.'
  rationale: La révision conserve les choix lexicaux solides du projet, mais rend explicitement la négation existentielle hébraïque et améliore une alternative de note qui était trop calquée sur l’anglais. Aucun changement doctrinal ou interprétatif n’est introduit.
