  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: fr
  text: 'Le Rocher : son œuvre est parfaite, car toutes ses voies sont justice[a]. C’est un Dieu fidèle[b], et il n’y a en lui aucune injustice[c] ; il est juste et droit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ses voies sont justes » ou « toutes ses voies relèvent du juste jugement ». Le mot hébreu מִשְׁפָּט peut désigner la justice, le jugement ou ce qui est juridiquement juste.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un Dieu de fidélité ». On peut aussi comprendre « un Dieu de vérité », mais ce sens est moins probable ici.
    reason: lexical_alternative
  - marker: c
    text: Ou « il n’y a en lui aucun tort » ou « sans iniquité ». Le mot hébreu עָוֶל peut désigner le tort moral, l’injustice ou l’iniquité.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: Le Rocher
  rationale: Le nom commun désigne ici Dieu par une métaphore qui fonctionne comme un titre dans le Cantique de Moïse. La majuscule en signale la portée titulaire sans effacer l’image.
- source_word: תָּמִים
  choice: parfaite
  rationale: Le terme exprime l’intégrité, la plénitude et le caractère irréprochable de l’œuvre de Dieu. « Parfaite » est naturel et convient au registre poétique.
- source_word: פָּעֳלוֹ
  choice: son œuvre
  rationale: Le singulier désigne collectivement ce que Dieu accomplit. « Son œuvre » conserve la forme nominale et la concision de l’hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison qui fonde l’affirmation précédente.
- source_word: כָל־דְּרָכָיו
  choice: toutes ses voies
  rationale: Cette expression idiomatique évoque l’ensemble de la conduite et des actes de Dieu tout en conservant la métaphore des chemins.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Employé comme prédicat, le nom caractérise toutes les voies de Dieu comme conformes à ce qui est juste. Le substantif « justice » préserve la formulation dense et poétique.
- source_word: אֵל אֱמוּנָה
  choice: un Dieu fidèle
  rationale: Dans ce contexte, אֱמוּנָה exprime avant tout la fiabilité et la fidélité. La tournure adjectivale est la plus naturelle en français courant, tandis qu’une note conserve la possibilité plus formelle « un Dieu de fidélité ».
- source_word: וְאֵין עָוֶל
  choice: sans injustice
  rationale: La formule nie en Dieu toute faute morale ou déviation de la justice. « Sans injustice » est concise et maintient le parallélisme des attributs.
- source_word: צַדִּיק
  choice: juste
  rationale: Le mot affirme la parfaite conformité morale de Dieu à la justice.
- source_word: וְיָשָׁר
  choice: droit
  rationale: Le terme exprime la rectitude morale. « Droit » forme en français une paire naturelle avec « juste ».
- source_word: הוּא
  choice: il est
  rationale: Le pronom final hébreu met le sujet en relief. En français, « il est juste et droit » restitue clairement l’affirmation sans produire une inversion artificielle.
theological_decisions:
- issue: Portée métaphorique et titulaire de הַצּוּר
  choice: « Le Rocher » avec une majuscule
  alternative: « le rocher » sans majuscule
  rationale: Dans ce poème, le terme sert de désignation métaphorique au Dieu d’Israël. La majuscule rend cette fonction visible sans ajouter de contenu doctrinal.
- issue: Sens de אֱמוּנָה comme attribut divin
  choice: « fidèle »
  alternative: « de fidélité » ou « de vérité »
  rationale: Le contexte oppose la fiabilité et la rectitude de Dieu à toute injustice. « Fidèle » exprime naturellement cette qualité en français, sans réduire le terme à la seule vérité propositionnelle.
- issue: Relation entre מִשְׁפָּט, צַדִּיק et יָשָׁר
  choice: Conserver les termes distincts « justice », « juste » et « droit »
  alternative: Harmoniser les trois expressions autour d’un seul terme
  rationale: La répétition avec variation fait partie de la densité théologique et poétique du verset. La traduction garde les nuances judiciaire, morale et rectiligne sans les fusionner.
translation_notes:
  register: Français international actuel, digne et poétique. La syntaxe reste simple et mémorable. Les métaphores et le parallélisme hébraïques sont conservés, tandis que les propositions nominales sont rendues par des tournures françaises naturelles.
