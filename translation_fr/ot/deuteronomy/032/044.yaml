source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: fr
  text: Puis Moïse vint et prononça devant le peuple toutes les paroles de ce chant, lui et Hoshéa, fils de Noun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici « Hoshéa » ; ce personnage est généralement appelé Josué ailleurs (voir Nombres 13.16).
    reason: La note explique la forme inhabituelle du nom et son rapport avec le nom plus connu de Josué.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint
  rationale: Le verbe בוא au wayyiqtol marque ici l’arrivée ou l’entrée en scène de Moïse. « Vint » conserve sobrement ce mouvement narratif sans en préciser davantage la direction.
- source_word: וַיְדַבֵּר
  choice: prononça
  rationale: Dans ce contexte de récitation publique d’un chant, « prononça » rend naturellement l’acte de dire à haute voix, sans ajouter la force rhétorique que suggérerait « proclama ».
- source_word: אֶת כָּל דִּבְרֵי
  choice: toutes les paroles
  rationale: Cette formulation garde à la fois la totalité exprimée par כָּל et le sens concret de דִּבְרֵי, plutôt que de réduire l’expression à « tout le message ».
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ce chant
  rationale: שִׁירָה désigne ici le chant de Moïse dans le contexte immédiat. « Chant » est plus directement ancré dans le texte que « poème ».
- source_word: בְּאָזְנֵי הָעָם
  choice: devant le peuple
  rationale: Littéralement « aux oreilles du peuple », l’expression désigne une récitation publique à portée de voix. « Devant le peuple » est naturel en français moderne et préserve la scène orale.
- source_word: הוּא וְהוֹשֵׁעַ
  choice: lui-même avec Hoshéa
  rationale: La tournure conserve la mention explicite et appositive de Moïse avec son compagnon, tout en restant intelligible après le verbe singulier du texte hébreu.
- source_word: הוֹשֵׁעַ
  choice: Hoshéa
  rationale: Le texte porte la forme הוֹשֵׁעַ, et non יְהוֹשֻׁעַ. La translittération « Hoshéa » suit cette forme et évite de l’harmoniser silencieusement avec le nom plus connu de Josué.
- source_word: בִּן נוּן
  choice: fils de Noun
  rationale: Cette formulation française usuelle rend directement le patronyme hébreu à l’état construit.
theological_decisions:
- issue: 'Nom du compagnon de Moïse : Hoshéa ou Josué'
  choice: Hoshéa
  alternative: Josué
  rationale: Le texte hébreu de ce verset emploie explicitement הוֹשֵׁעַ. La traduction conserve donc cette forme au lieu de l’harmoniser avec le nom ultérieur et plus familier de Josué. La note informe le lecteur de l’identité du personnage sans modifier le texte source.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve l’apposition emphatique de l’hébreu (« lui-même avec Hoshéa »), tandis que l’idiome littéral « aux oreilles du peuple » est rendu par une expression française naturelle indiquant une récitation publique.
