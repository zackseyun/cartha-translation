  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: fr
  text: Mais Yeshouroun s’est engraissé et a rué ; tu t’es engraissé[a], épaissi, alourdi. Il a alors abandonné Dieu qui l’a fait et méprisé le Rocher de son salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être, pour le dernier terme : « tu t’es couvert de graisse » ou « tu es devenu bouffi ». Le terme hébreu est rare et sa nuance exacte est incertaine, mais l’image générale est celle d’un excès dû à la surabondance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: Yeshouroun
  rationale: Ce nom-titre poétique d’Israël est translittéré afin de ne pas réduire prématurément sa portée à « Israël » ou « le juste ». La graphie française rend approximativement la prononciation hébraïque.
- source_word: וַיִּשְׁמַן / שָׁמַנְתָּ
  choice: s’est engraissé / tu t’es engraissé
  rationale: Le sens concret d’acquisition de graisse est maintenu, avec sa valeur imagée de prospérité menant à la suffisance. Le changement de la troisième à la deuxième personne est conservé.
- source_word: וַיִּבְעָט
  choice: a rué
  rationale: Le verbe évoque littéralement la ruade d’un animal repu et rétif. « Ruer » conserve cette image plus nettement qu’un terme explicatif comme « se révolter ».
- source_word: עָבִיתָ
  choice: épaissi
  rationale: Ce choix prolonge l’image corporelle de l’excès et correspond au sens d’être devenu épais ou corpulent.
- source_word: כָּשִׂיתָ
  choice: alourdi
  rationale: La forme est rare et son sens précis demeure incertain. « Alourdi » s’insère naturellement dans la progression poétique de l’embonpoint excessif sans prétendre trancher toutes les possibilités lexicales.
- source_word: וַיִּטֹּשׁ
  choice: a abandonné
  rationale: « Abandonner » exprime clairement, en français moderne, la déloyauté envers Dieu sans recourir à un archaïsme.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: le Dieu qui l’avait fait
  rationale: La proposition relative hébraïque est maintenue. Le plus-que-parfait français marque naturellement l’antériorité de l’acte créateur par rapport à l’abandon.
- source_word: וַיְנַבֵּל
  choice: méprisé
  rationale: Le verbe exprime ici le fait de traiter comme vil ou indigne. « Mépriser » en donne une formulation concise et active.
- source_word: צוּר
  choice: le Rocher
  rationale: Dans le cantique, ce terme fonctionne comme une métaphore récurrente et une désignation de Dieu. La majuscule en signale la valeur titulaire sans supprimer l’image.
- source_word: יְשׁוּעָתוֹ
  choice: de son salut
  rationale: « Salut » conserve à la fois l’idée de délivrance divine et la portée théologique du substantif.
theological_decisions:
- issue: Passage de la troisième personne à la deuxième personne, puis retour à la troisième
  choice: 'Conserver : « Yeshouroun s’est… ; tu t’es… Il a… »'
  alternative: Uniformiser tout le verset à la troisième personne
  rationale: Ces changements de personne sont présents dans l’hébreu et donnent à l’accusation sa vigueur rhétorique ; les lisser ferait disparaître un trait significatif du poème.
- issue: Métaphore divine צוּר
  choice: « le Rocher » avec une majuscule
  alternative: « le rocher » sans majuscule
  rationale: Dans Deutéronome 32, « Rocher » est une désignation poétique récurrente du Dieu d’Israël. La majuscule aide à reconnaître ce rôle tout en préservant la métaphore.
- issue: Identité de Yeshouroun
  choice: Conserver le nom-titre translittéré
  alternative: Traduire par « Israël » ou « le Juste »
  rationale: La translittération préserve l’ambivalence entre nom poétique et épithète, tandis que le contexte permet d’identifier Israël comme référent.
translation_notes:
  register: Français international moderne, poétique et digne. Les images concrètes de l’animal repu et de l’embonpoint sont conservées. « Yeshouroun » évite une francisation archaïsante tout en restant lisible ; « a rué » est idiomatique dans le cadre de la métaphore animale. Le marqueur [a] figure bien dans le texte principal.
