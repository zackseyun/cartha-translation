  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: fr
  text: Il l’a trouvé dans une terre désertique, dans la désolation hurlante du désert. Il l’a entouré, il a pris soin de lui[a], il l’a gardé comme la pupille de son œil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « il lui a donné de l’intelligence » ou « il lui a accordé toute son attention ».
    reason: alternative_reading
  - marker: b
    text: Ou, selon l’expression française traditionnelle, « comme la prunelle de son œil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: Il l’a trouvé
  rationale: Le qal de מצא signifie normalement « trouver ». Le passé composé convient à une narration poétique en français moderne sans ajouter l’idée d’une rencontre fortuite.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: dans une terre désertique
  rationale: Cette formulation naturelle conserve à la fois אֶרֶץ, « terre », et מִדְבָּר, « désert, région sauvage ».
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: dans la désolation d’un désert plein de hurlements
  rationale: תֹהוּ évoque ici un lieu vide et désolé, יְלֵל les hurlements, et יְשִׁמֹן une étendue désertique. La formulation française restitue les trois éléments sans donner à תֹהוּ un sens cosmologique trop précis.
- source_word: יְסֹבְבֶנְהוּ
  choice: il l’a entouré
  rationale: סבב exprime concrètement l’action d’entourer. Le contexte suggère la protection, mais la traduction ne l’explicite pas à la place de l’image.
- source_word: יְבֹונְנֵהוּ
  choice: il a pris soin de lui
  rationale: Le verbe peut exprimer l’intelligence, le discernement ou une attention soutenue. Dans cette suite d’actions protectrices, « prendre soin de » rend naturellement l’attention active, tandis qu’une note conserve les autres possibilités.
- source_word: יִצְּרֶנְהוּ
  choice: il l’a gardé
  rationale: נצר signifie garder, protéger ou préserver. « Garder » reste proche du verbe hébreu et prépare l’image de l’œil.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: comme la pupille de son œil
  rationale: אִישׁוֹן désigne la pupille de l’œil, probablement avec l’image du « petit homme » qu’on y voit. « Pupille » est précis et transparent; l’expression française traditionnelle est signalée en note.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Conserver le singulier « le/lui », qui présente collectivement Israël ou Jacob comme une seule personne.
  alternative: Employer le pluriel « les/eux » pour expliciter qu’il s’agit du peuple.
  rationale: Le contexte du cantique désigne collectivement le peuple au singulier. Maintenir ce singulier préserve la personnification poétique et la grammaire du texte source.
- issue: Nuance de יְבֹונְנֵהוּ
  choice: Rendre le verbe par « il a pris soin de lui », au sens d’une attention active et bienveillante.
  alternative: « il lui a donné de l’intelligence », « il l’a instruit » ou « il a veillé attentivement sur lui »
  rationale: Le verbe demeure polysémique. Le contexte immédiat d’encerclement et de garde favorise l’attention protectrice, mais la note maintient la possibilité d’un sens lié à l’intelligence ou au discernement.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé assure une narration accessible; la répétition de « il l’a » conserve le rythme des verbes hébreux. Le singulier collectif et les images concrètes du désert, de l’encerclement et de l’œil sont maintenus.
