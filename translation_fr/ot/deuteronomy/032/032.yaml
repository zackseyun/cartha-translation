base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: fr
  text: 'Car leur vigne provient de la vigne de Sodome,

    et des champs de Gomorrhe ;

    leurs raisins sont des raisins empoisonnés,

    et ils ont des grappes amères.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹאשׁ
  choice: empoisonnés
  rationale: Dans ce contexte, le terme désigne une substance toxique ou un poison, non la « tête ». L’adjectif rend naturellement en français la qualité nocive des raisins.
- source_word: מְרֹרֹת
  choice: amères
  rationale: Traduction directe du pluriel féminin, accordée avec « grappes ».
- source_word: לָמוֹ
  choice: pour eux
  rationale: Le pronom prépositionnel est explicitement conservé afin de ne pas effacer une nuance présente dans le texte hébreu.
- source_word: שַׁדְמֹת
  choice: champs
  rationale: Terme agricole désignant des terres cultivées ou des champs ; « champs » est précis et naturel.
theological_decisions:
- issue: Portée de l’image de la vigne de Sodome et Gomorrhe
  choice: Conserver littéralement la métaphore sans identifier explicitement son référent dans ce verset
  alternative: Paraphraser l’image comme une description directe de la corruption du peuple ou de ses ennemis
  rationale: Le texte poétique exprime son jugement au moyen de l’origine et du fruit de la vigne ; préciser davantage le référent résoudrait une tension que le verset laisse au contexte.
- issue: Valeur de לָמוֹ
  choice: « pour eux »
  alternative: Omettre le pronom comme le font certaines traductions pour alléger la ligne
  rationale: Sa présence dans le texte massorétique justifie son maintien, même si sa relation exacte avec l’amertume demeure légèrement ouverte.
translation_notes:
  register: Français moderne, soutenu mais accessible. Le parallélisme poétique est présenté en quatre lignes. « Provient de » exprime clairement l’origine figurée, tandis que « empoisonnés » évite l’ambiguïté française de « raisins de poison ».
