  source_fidelity: 'Le parallélisme et les images du texte hébreu sont bien conservés : la vigne est associée à Sodome et aux terres de Gomorrhe, et les raisins sont caractérisés par רֹאשׁ, une substance végétale toxique/venimeuse. « Empoisonnés » est une restitution idiomatique défendable. Toutefois, « amères pour eux » donne en français l''impression que les grappes ont un goût amer pour leurs consommateurs. Dans ce contexte poétique, לָמוֹ fonctionne plus naturellement comme un datif de possession (« ils ont » / « à eux »), sans imposer cette lecture gustative.'
