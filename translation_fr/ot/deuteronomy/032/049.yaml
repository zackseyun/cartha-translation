source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: fr
  text: Monte sur cette montagne des Abarim, le mont Nébo, dans le pays de Moab, en face de Jéricho[a], et regarde le pays de Canaan, que je donne aux fils d’Israël[b] en propriété[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vis-à-vis de Jéricho ». L’expression hébraïque indique une position géographique en face de la ville.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « aux Israélites ». Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « comme possession ». Le terme hébreu désigne notamment un bien ou un domaine détenu durablement.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Monte
  rationale: Impératif qal masculin singulier de עלה. « Monte » exprime directement le déplacement vers le haut dans un français naturel.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: cette montagne des Abarim
  rationale: Le démonstratif est conservé, et Abarim est traité comme un nom géographique plutôt que traduit d’après son étymologie.
- source_word: הַר נְבוֹ
  choice: le mont Nébo
  rationale: L’apposition hébraïque est rendue selon l’usage géographique français courant, avec la forme traditionnelle « Nébo ».
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: dans le pays de Moab
  rationale: La localisation est exprimée avec concision; la répétition d’un pronom relatif serait lourde en français sans ajouter de contenu.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: en face de Jéricho
  rationale: Dans ce contexte géographique, l’expression idiomatique עַל־פְּנֵי indique une position vis-à-vis de Jéricho. « En face de » reste naturel tout en préservant la valeur spatiale.
- source_word: וּרְאֵה
  choice: et regarde
  rationale: L’impératif de ראה commande ici de porter le regard sur le pays. « Regarde » rend mieux cette action délibérée que le simple « vois », sans la solennité ajoutée de « contemple ».
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: le pays de Canaan
  rationale: « Pays de Canaan » est une désignation géographique française courante et fidèle à אֶרֶץ.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que je donne
  rationale: Le participe נֹתֵן accompagné du pronom אֲנִי présente le don divin comme actuel ou engagé. Le présent français conserve cette portée sans imposer explicitement une valeur progressive ou future.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: La formule hébraïque traditionnelle est conservée de près. Une note signale la formulation française plus idiomatique « aux Israélites ».
- source_word: לַאֲחֻזָּה
  choice: comme propriété
  rationale: אֲחֻזָּה désigne une possession durable, souvent foncière. « Comme propriété » est clair en français moderne et évite d’introduire automatiquement la nuance d’héritage.
theological_decisions:
- issue: Portée temporelle du don exprimé par אֲנִי נֹתֵן
  choice: que je donne
  alternative: que je vais donner
  rationale: Le participe peut viser une action présente ou imminente. Le présent français maintient cette tension et n’explicite pas davantage le moment du don.
- issue: Rendu de la désignation collective בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  alternative: aux Israélites
  rationale: Le texte principal préserve la forme masculine et filiale de l’expression hébraïque consacrée, sans prétendre qu’elle exclut les femmes du peuple; la note fournit l’équivalent collectif idiomatique.
- issue: Nature du bien désigné par אֲחֻזָּה
  choice: comme propriété
  alternative: comme héritage
  rationale: Le nom met directement l’accent sur la possession ou le domaine détenu. « Héritage » est possible dans le contexte théologique plus large, mais ajouterait ici une nuance qui n’est pas nécessairement portée par ce terme seul.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe allège les relatives hébraïques successives tout en conservant toutes les données géographiques. Les noms propres suivent les formes françaises usuelles, et les ambiguïtés concernant le don et la possession ne sont pas résolues de manière doctrinale.
