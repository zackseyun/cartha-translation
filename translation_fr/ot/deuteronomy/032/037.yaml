  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: fr
  text: 'Et il dira : « Où sont leurs dieux, le rocher en qui ils avaient cherché refuge[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le singulier « le rocher » est en apposition à « leurs dieux » ; l’hébreu dit littéralement : « le rocher en lui ils avaient cherché refuge ».'
    reason: La construction passe du pluriel « leurs dieux » au singulier métaphorique « le rocher », repris par un pronom masculin singulier.
lexical_decisions:
- source_word: וְאָמַר
  choice: Et il dira
  rationale: Le qatal qal à la 3e personne masculine singulière, précédé de la conjonction, reçoit ici une valeur future déterminée par le discours poétique environnant. « Et » conserve simplement la coordination hébraïque.
- source_word: אֵי
  choice: Où sont
  rationale: La particule interrogative signifie « où ? ». Le pluriel français s’accorde avec « leurs dieux ».
- source_word: אֱלֹהֵימוֹ
  choice: leurs dieux
  rationale: La forme construite plurielle munie du suffixe de 3e personne masculine plurielle désigne ici les divinités auxquelles ils se sont fiés.
- source_word: צוּר
  choice: le rocher
  rationale: Le nom signifie littéralement « rocher » et est placé en apposition à « leurs dieux ». La minuscule évite de l’identifier au titre divin appliqué au SEIGNEUR ailleurs dans le cantique.
- source_word: חָסָיוּ
  choice: ils cherchaient refuge
  rationale: Le verbe חסה exprime l’action de chercher ou de trouver refuge. L’imparfait français présente naturellement cette confiance passée comme une attitude habituelle.
- source_word: בּוֹ
  choice: en qui
  rationale: Le suffixe masculin singulier renvoie à « le rocher ». « En qui » conserve à la fois le singulier et l’apposition personnelle aux dieux, sans réduire la construction à un simple lieu matériel.
theological_decisions:
- issue: Identité du locuteur et valeur temporelle
  choice: 'La phrase est comprise comme la parole future du SEIGNEUR : « Et il dira »'
  alternative: « Et il dit » ou « Alors on dira »
  rationale: Dans Deutéronome 32.36-38, le sujet le plus naturel est le SEIGNEUR, dont la parole à venir dévoile l’impuissance des faux dieux. La poésie hébraïque permet cette valeur contextuelle du qatal.
- issue: Valeur de « rocher »
  choice: « le rocher » avec une minuscule, en apposition à « leurs dieux »
  alternative: « le Rocher » comme titre divin
  rationale: Le référent immédiat est constitué par les dieux en qui refuge était cherché. La minuscule maintient le contraste avec le SEIGNEUR, appelé « le Rocher » ailleurs dans le cantique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image concrète du refuge ainsi que la tension grammaticale entre le pluriel « leurs dieux » et le singulier « le rocher ».
