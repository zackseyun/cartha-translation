  naturalness: La formulation est globalement claire et poétique. « Il l’a fait monter sur les hauteurs du pays » est plus idiomatique en français moderne que « Il l’a fait chevaucher sur les hauteurs du pays », tout en préservant la valeur causative et le mouvement figuré.
  terminology: « Hauteurs du pays », « produits du champ », « miel du rocher », « huile » et « roc de silex » conviennent au registre poétique et aux termes hébreux. Les notes gardent à bon droit l’alternative « terre » et le sens littéral du second causatif.
