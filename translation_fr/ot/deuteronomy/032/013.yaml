  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: fr
  text: 'Il l’a fait monter sur les hauteurs du pays[a],

    et il a mangé les produits du champ[b] ;

    il lui a fait sucer le miel du rocher[c],

    et l’huile du roc de silex.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les hauteurs de la terre ». L’expression désigne probablement ici des terrains élevés et fertiles, plutôt que des « hauts lieux » cultuels.
    reason: lexical_alternative
  - marker: b
    text: Ou « le rendement du champ ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il l’a nourri de miel tiré du rocher ». Le verbe hébreu signifie littéralement « faire sucer » ou « faire téter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: Il l’a fait chevaucher
  rationale: Le hiphil de רכב exprime la causation (« faire monter/chevaucher »). Cette formulation conserve cette valeur et l’image poétique du déplacement victorieux.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: sur les hauteurs du pays
  rationale: במות désigne ici des hauteurs topographiques. « Hauteurs du pays » évite de suggérer sans raison les hauts lieux cultuels et אָרֶץ peut, dans ce contexte, désigner le pays.
- source_word: וַיֹּאכַל
  choice: et il a mangé
  rationale: Le verbe אכל a ici son sens concret et ordinaire, « manger ».
- source_word: תְּנוּבֹת שָׂדָי
  choice: les produits des champs
  rationale: תנובות désigne les produits ou le rendement du sol. Le pluriel français « des champs » rend naturellement le singulier collectif et poétique שדי.
- source_word: וַיֵּנִקֵהוּ
  choice: il lui a fait sucer
  rationale: Le hiphil de ינק signifie littéralement « faire sucer/téter ». La formulation maintient l’image vive d’une nourriture reçue directement d’une source improbable.
- source_word: דְבַשׁ מִסֶּלַע
  choice: le miel du rocher
  rationale: דבש signifie « miel » et סלע « rocher » ou « escarpement ». La formulation française conserve l’image concise de l’hébreu.
- source_word: וְשֶׁמֶן
  choice: et l’huile
  rationale: שמן signifie simplement « huile ». Bien qu’il s’agisse vraisemblablement d’huile d’olive, l’hébreu ne précise pas l’olive.
- source_word: מֵחַלְמִישׁ צוּר
  choice: du roc de silex
  rationale: חלמיש évoque le silex ou une pierre extrêmement dure, et צור le roc. « Roc de silex » garde l’intensification poétique d’une abondance provenant d’une roche stérile et dure.
theological_decisions:
- issue: Référents des pronoms masculins singuliers
  choice: Conserver « il », « l’ » et « lui » sans remplacer les pronoms par « le Seigneur », « Jacob » ou « Israël »
  alternative: Nommer explicitement le Seigneur comme sujet et Jacob ou Israël comme objet
  rationale: Le contexte immédiat permet d’identifier les référents, mais le verset hébreu lui-même emploie des pronoms. Leur maintien respecte l’enchaînement poétique et préserve la formulation du texte source.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme a été conservé sur quatre lignes. « Chevaucher », « rocher » et « roc de silex » maintiennent les images concrètes de l’hébreu, tandis que les notes signalent les principales possibilités lexicales sans imposer une interprétation cultuelle ou théologique.
