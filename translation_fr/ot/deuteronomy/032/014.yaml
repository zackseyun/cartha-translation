base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/014.yaml
  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: fr
  text: 'du lait caillé de vache et du lait du petit bétail,


    avec la graisse des agneaux,


    des béliers issus du Bashân et des boucs,


    avec le meilleur du froment[a] ;


    et tu buvais le vin écumant[b],


    le sang du raisin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la graisse des rognons du froment », expression désignant le froment le plus riche ou le plus beau.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le vin rouge » ; le terme hébreu peut évoquer un vin richement fermenté ou écumant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: du lait caillé de vache
  rationale: חֶמְאָה désigne ici un produit laitier épais, probablement du lait caillé ou fermenté plutôt que le beurre moderne. « De vache » rend naturellement le collectif בָּקָר.
- source_word: חֲלֵב צֹאן
  choice: du lait de brebis
  rationale: צֹאן désigne collectivement le petit bétail. Dans ce contexte pastoral, « lait de brebis » est naturel en français et les boucs sont nommés séparément plus loin.
- source_word: חֵלֶב כָּרִים
  choice: la graisse des agneaux
  rationale: La traduction concrète de חֵלֶב préserve l’image d’abondance, tandis que כָּרִים désigne de jeunes ovins, vraisemblablement des agneaux engraissés.
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: des béliers nés au Bashân
  rationale: 'Littéralement « des béliers, fils du Bashân » : la formulation française conserve l’idée d’animaux issus de cette région réputée fertile sans obscurcir le sens.'
- source_word: עַתּוּדִים
  choice: des boucs
  rationale: Le nom désigne des caprins mâles; « boucs » en conserve la précision.
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: le meilleur du froment
  rationale: L’expression littérale, « la graisse des rognons du froment », est un idiome poétique désignant la partie la plus riche ou les grains les plus beaux. « Le meilleur du froment » préserve le sens superlatif et le registre poétique.
- source_word: תִּשְׁתֶּה
  choice: tu buvais
  rationale: L’imparfait français convient à l’imparfait hébreu dans cette évocation rétrospective d’une abondance durable, sans transformer l’action en événement ponctuel.
- source_word: חָמֶר
  choice: vin écumant
  rationale: Le terme désigne le vin et peut évoquer sa fermentation ou son écume; « vin écumant » garde cette image, tandis qu’une note signale l’autre compréhension possible.
- source_word: דַם עֵנָב
  choice: le sang du raisin
  rationale: La métaphore hébraïque vive est conservée, en apposition au vin.
theological_decisions:
- issue: Rendu des images d’abondance agricole et pastorale
  choice: Conserver les aliments et la boisson comme des réalités concrètes et poétiques.
  alternative: Les reformuler abstraitement comme des signes de luxe ou de bénédiction de l’alliance.
  rationale: Le verset décrit directement les dons reçus au moyen d’une accumulation de produits du troupeau, du blé et du vin; il ne faut pas importer une interprétation abstraite dans le texte.
translation_notes:
  register: Français international moderne, poétique et digne. Les lignes suivent l’accumulation rythmique du chant. « Froment » maintient un registre légèrement élevé mais reste intelligible; « Bashân » conserve le nom géographique traditionnel.
