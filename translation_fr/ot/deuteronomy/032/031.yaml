  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: fr
  text: Car leur rocher n’est pas comme notre Rocher ; et nos ennemis sont juges[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et nos ennemis sont juges ». Le nom hébreu פְּלִילִים désigne des juges ou des arbitres et donne à la phrase une portée judiciaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente dans le déroulement argumentatif du cantique.
- source_word: כְצוּרֵנוּ
  choice: comme notre Rocher
  rationale: Conserve la métaphore divine et sa valeur de titre pour le Dieu d’Israël, sans la réduire à une seule notion telle que « protecteur » ou « refuge ».
- source_word: צוּרָם
  choice: leur rocher
  rationale: Reprend le même nom hébreu afin de préserver le contraste délibéré entre le Dieu d’Israël et ce en quoi les ennemis placent leur confiance.
- source_word: וְאֹיְבֵינוּ
  choice: nos ennemis eux-mêmes
  rationale: « Eux-mêmes » rend la force rhétorique du recours aux adversaires comme témoins particulièrement probants, sans changer leur rôle dans la proposition.
- source_word: פְּלִילִים
  choice: en sont juges
  rationale: Le nom pluriel désigne des juges ou arbitres. Cette tournure française naturelle conserve le registre judiciaire et exprime qu’ils sont aptes à rendre un verdict sur la comparaison.
theological_decisions:
- issue: Faut-il remplacer la métaphore צוּר par un titre explicatif ?
  choice: Conserver « Rocher » pour le Dieu d’Israël
  alternative: protecteur, refuge ou force
  rationale: Le texte emploie volontairement le même mot pour le Dieu d’Israël et le « rocher » des nations. Garder la métaphore préserve le jeu littéraire et la tension théologique sans imposer une interprétation plus étroite.
- issue: Sens de la proposition « nos ennemis [sont] juges »
  choice: La présenter comme l’appel au jugement des ennemis eux-mêmes
  alternative: La laisser sous la forme strictement nominale « et nos ennemis sont juges »
  rationale: Le contexte comparatif permet naturellement de comprendre que les ennemis arbitrent la question évoquée. La note conserve toutefois la forme plus littérale et son caractère abrupt.
translation_notes:
  register: Français international moderne, sobre et digne. La majuscule à « Rocher » signale la référence au Dieu d’Israël, tandis que la minuscule à « rocher » maintient le contraste avec l’objet de confiance des ennemis. Le point-virgule met en relief les deux membres du vers sans expliciter davantage leur rapport.
