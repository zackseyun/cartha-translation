source:
  edition: WLC
  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: fr
  text: Ils ont agi de façon corrompue envers lui ; ils ne sont pas ses enfants, à cause de leur défaut[a]. Ils sont une génération perverse et tortueuse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile et très condensé. On peut aussi comprendre : « Ils se sont corrompus » ; la suite peut également se traduire : « ils ne sont pas ses enfants ; tel est leur défaut » ou « leur tare ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « une génération dévoyée et retorse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: ont agi de manière corrompue
  rationale: Le piel exprime ici une conduite corruptrice ou corrompue. Cette formulation conserve la valeur verbale sans imposer le sens réfléchi « se sont corrompus », qui demeure possible mais n’est pas explicite dans le texte consonantique.
- source_word: לוֹ
  choice: envers lui
  rationale: La préposition ל avec suffixe exprime ici un rapport difficile à préciser. « Envers lui » maintient la référence à Dieu sans trancher entre une nuance simplement relationnelle et une nuance hostile.
- source_word: לֹא בָּנָיו
  choice: ils ne sont pas ses enfants
  rationale: La proposition nominale est rendue naturellement en français par l’ajout de « ils sont ». Aucun marqueur temporel ne justifie « ils ne sont plus ses enfants ».
- source_word: מוּמָם
  choice: à cause de leur tare
  rationale: מוּם désigne un défaut ou une tare, ici dans un sens moral. « À cause de » explicite avec prudence le lien syntaxique, très condensé en hébreu.
- source_word: דּוֹר
  choice: génération
  rationale: « Génération » est le terme français usuel et précis dans ce contexte poétique et collectif.
- source_word: עִקֵּשׁ
  choice: perverse
  rationale: Le mot évoque ce qui est tordu, dévié ou pervers. « Perverse » exprime clairement la portée morale dans un français actuel et digne.
- source_word: וּפְתַלְתֹּל
  choice: tortueuse
  rationale: Cet adjectif rare renforce l’image d’une déformation morale. « Tortueuse » reste distinct de « perverse » tout en conservant l’image de ce qui est tordu.
theological_decisions:
- issue: 'La portée de לֹא בָּנָיו : perte d’un statut d’enfants ou négation de leur caractère filial'
  choice: ils ne sont pas ses enfants
  alternative: ils ne sont plus ses enfants
  rationale: L’hébreu formule une négation sévère, mais sans indication temporelle. La traduction préserve cette tension sans introduire une conclusion doctrinale sur la perte d’un statut d’alliance.
- issue: La construction syntaxique du premier membre, très condensé
  choice: Ils ont agi de manière corrompue envers lui ; ils ne sont pas ses enfants, à cause de leur tare.
  alternative: Ils se sont corrompus ; ils ne sont pas ses enfants ; telle est leur tare.
  rationale: La formulation retenue donne un français cohérent tout en suivant la vocalisation massorétique sans émendation. La note signale les autres constructions possibles, car l’ambiguïté est réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, avec un vocabulaire accessible. Les termes « perverse » et « tortueuse » maintiennent deux nuances distinctes de la métaphore hébraïque de ce qui est moralement tordu.
