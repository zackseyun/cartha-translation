    rationale: L’hébreu emploie une unique expression conditionnelle restrictive qui gouverne les deux verbes coordonnés. Une seule tournure française (« à moins que ») rend plus directement cette structure et évite de présenter les deux propositions comme deux conditions indépendamment introduites.
