source:
  edition: WLC
  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: fr
  text: 'Comment un seul pourrait-il en poursuivre mille,

    et deux en mettre dix mille en fuite,

    à moins que leur Rocher ne les ait vendus[a]

    et que Yahweh ne les ait livrés ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les ait livrés ».'
    reason: Le verbe מכר signifie littéralement « vendre », mais peut évoquer dans ce contexte la remise de quelqu’un au pouvoir de ses ennemis.
lexical_decisions:
- source_word: אֵיכָה
  choice: Comment ... pourrait-il
  rationale: Introduit une question rhétorique exprimant l’étonnement devant un renversement humainement inexplicable.
- source_word: יִרְדֹּף
  choice: poursuivre
  rationale: Le verbe רדף désigne couramment l’action de poursuivre, notamment dans un contexte militaire.
- source_word: אֶחָד אֶלֶף
  choice: un seul ... en poursuivre mille
  rationale: Conserve le contraste numérique saisissant de l’hébreu tout en employant une tournure française naturelle.
- source_word: וּשְׁנַיִם יָנִיסוּ רְבָבָה
  choice: et deux en mettre dix mille en fuite
  rationale: Rend la forme causative de נוּס et maintient le parallélisme entre un/mille et deux/dix mille.
- source_word: אִם לֹא כִּי
  choice: si ... ne ... et si ... ne
  rationale: Dans la question rhétorique, cette construction française exprime naturellement la condition explicative exclusive portée par l’expression hébraïque.
- source_word: צוּרָם
  choice: leur Rocher
  rationale: Dans le cantique de Moïse, צוּר sert de métaphore et de titre divins; la majuscule en signale ici la valeur titulaire.
- source_word: מְכָרָם
  choice: les avait vendus
  rationale: Conserve directement la métaphore forte de מכר, qui décrit le fait de remettre le peuple au pouvoir de ses ennemis.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel יהוה présent dans le texte hébreu.
- source_word: הִסְגִּירָם
  choice: les avait livrés
  rationale: Le hiphil de סגר signifie ici remettre des personnes au pouvoir d’un autre; « livrer » est idiomatique dans ce contexte de jugement militaire.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Valeur divine de צוּר
  choice: leur Rocher
  alternative: leur rocher
  rationale: Dans le contexte du cantique, « Rocher » désigne le Dieu d’Israël. La majuscule rend cette fonction titulaire sans supprimer la métaphore.
- issue: Agent du renversement militaire
  choice: Leur Rocher les a vendus et Yahweh les a livrés
  alternative: Paraphraser comme une simple défaite militaire
  rationale: 'La traduction maintient l’affirmation théologique explicite du verset: la défaite résulte du jugement de Dieu, non de la seule supériorité de l’ennemi.'
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La disposition en quatre lignes met en valeur le parallélisme poétique. Le pronom « en » évite d’ajouter un nom absent de l’hébreu tout en rendant les objets numériques naturels en français.
