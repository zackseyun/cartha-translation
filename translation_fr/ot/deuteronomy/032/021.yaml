  text: הֵ֚ם קִנְא֣וּ/נִי בְ/לֹא אֵ֔ל כִּעֲס֖וּ/נִי בְּ/הַבְלֵי/הֶ֑ם וַ/אֲנִי֙ אַקְנִיאֵ֣/ם בְּ/לֹא עָ֔ם בְּ/ג֥וֹי נָבָ֖ל אַכְעִיסֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: fr
  text: Ils ont éveillé ma jalousie par ce qui n’est pas un dieu ; ils ont provoqué ma colère par leurs idoles[a]. Moi, à mon tour, j’éveillerai leur jalousie par ceux qui ne sont pas un peuple[b] ; je provoquerai leur colère par une nation insensée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par leurs vanités » ou « par leurs choses sans valeur » ; le mot hébreu peut évoquer le souffle, le vide ou la futilité et désigne ici les idoles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par un non-peuple ». L’hébreu établit un parallèle volontaire avec « ce qui n’est pas un dieu ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, « insensée » décrit surtout un égarement moral et spirituel, et non un simple manque d’intelligence.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי / אַקְנִיאֵם
  choice: ont éveillé ma jalousie / j’éveillerai leur jalousie
  rationale: Cette formulation naturelle conserve le sens causatif ainsi que la réciprocité délibérée entre la faute d’Israël et la réponse divine.
- source_word: בְּלֹא אֵל
  choice: par ce qui n’est pas un dieu
  rationale: La traduction préserve la négation polémique du texte hébreu sans identifier abusivement le référent à une divinité précise.
- source_word: כִּעֲסוּנִי / אַכְעִיסֵם
  choice: ont provoqué ma colère / je provoquerai leur colère
  rationale: Le tour causatif rend clairement le hiphil et maintient le parallélisme de rétribution entre les deux moitiés du verset.
- source_word: בְּהַבְלֵיהֶם
  choice: par leurs idoles
  rationale: Dans ce contexte, le terme désigne les objets de l’idolâtrie, tout en les qualifiant implicitement de vains et sans valeur ; cette nuance est signalée en note.
- source_word: בְּלֹא עָם
  choice: par ceux qui ne sont pas un peuple
  rationale: Cette formulation intelligible conserve le parallèle intentionnel avec « ce qui n’est pas un dieu » et n’identifie pas le groupe à une nation historique déterminée.
- source_word: בְּגוֹי נָבָל
  choice: par une nation insensée
  rationale: « Insensée » exprime une déficience morale et spirituelle plutôt qu’un simple manque d’intelligence.
theological_decisions:
- issue: Référent de « ceux qui ne sont pas un peuple » et de « nation insensée »
  choice: Le rendre de manière générique, sans nommer une nation ou un ensemble historique.
  alternative: Une nation païenne précise ; l’ensemble des non-Juifs ; une nation méprisable.
  rationale: L’hébreu n’identifie pas le référent. La traduction conserve donc l’ouverture et la tension théologique du texte, sans y importer une identification interprétative ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme verbal et la réciprocité judiciaire de l’hébreu sont maintenus. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
