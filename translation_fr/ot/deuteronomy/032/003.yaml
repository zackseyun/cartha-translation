  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: fr
  text: Car je proclamerai le nom de Yahweh[a] ; reconnaissez la grandeur de notre Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », le tétragramme, nom divin. Il est souvent rendu par « le SEIGNEUR » ; « Yahweh » et « Jéhovah » sont des formes de transcription ou de vocalisation employées en français.'
    reason: Signaler le tétragramme hébreu et distinguer la traduction conventionnelle des formes de transcription ou de vocalisation.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur causale ou explicative du connecteur dans le contexte du chant.
- source_word: שֵׁם
  choice: le nom
  rationale: Rend directement le terme hébreu, qui évoque ici l’identité révélée et la réputation de Dieu sans les paraphraser.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶקְרָא
  choice: je proclamerai
  rationale: Dans le cadre du chant, le verbe désigne l’annonce publique du nom de Yahweh ; le futur français convient à la forme inaccomplie hébraïque.
- source_word: הָבוּ
  choice: reconnaissez
  rationale: L’impératif pluriel appelle les auditeurs à reconnaître la grandeur qui appartient déjà à Dieu ; cette formulation est plus naturelle en français moderne que « attribuez » et n’implique pas qu’ils la lui confèrent.
- source_word: גֹדֶל
  choice: la grandeur
  rationale: Équivalent direct du nom hébreu, sans le préciser indûment comme majesté ou gloire.
- source_word: לֵאלֹהֵינוּ
  choice: de notre Dieu
  rationale: Avec « reconnaître la grandeur de », la relation exprimée par ל est rendue idiomatiquement en français tout en conservant le suffixe de première personne du pluriel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel et la note signale la convention traditionnelle sans imposer une vocalisation comme absolument certaine.
- issue: Portée de l’exhortation הָבוּ גֹדֶל
  choice: reconnaissez la grandeur
  alternative: attribuez la grandeur ; rendez gloire
  rationale: La traduction garde l’appel à confesser la grandeur de Dieu sans laisser entendre que les humains la lui donnent réellement ni remplacer « grandeur » par le concept voisin de « gloire ».
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule maintient le parallélisme poétique ; le point d’exclamation marque la force de l’impératif pluriel sans surcharger le vers.
