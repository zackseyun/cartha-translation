source:
  edition: WLC
  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: fr
  text: Voyez maintenant que c’est moi, moi qui suis Dieu[a], et qu’il n’y a pas de dieu à mes côtés[b]. C’est moi qui fais mourir et qui fais vivre ; j’ai blessé, et c’est moi qui guérirai[c]. Personne ne peut délivrer de ma main[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « moi, moi, lui »; cette expression idiomatique souligne avec force l’identité du locuteur.'
    reason: L’hébreu redouble le pronom personnel à des fins d’emphase. La traduction française rend l’identification divine implicite dans l’expression et confirmée par la proposition suivante.
  - marker: b
    text: 'Ou, plus littéralement : « il n’y a pas de Dieu avec moi ».'
    reason: La préposition hébraïque signifie littéralement « avec », mais peut ici exprimer l’absence de toute divinité aux côtés du locuteur.
  - marker: c
    text: 'Ou : « j’ai écrasé, et c’est moi qui guérirai ».'
    reason: Le verbe traduit par « blessé » peut exprimer une atteinte plus violente, comme écraser ou fracasser.
  - marker: d
    text: '« De ma main » signifie ici : de mon pouvoir ou de mon autorité.'
    reason: La main est une image hébraïque courante de la puissance et de la maîtrise.
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: Voyez maintenant
  rationale: L’impératif pluriel appelle directement les auditeurs à reconnaître la réalité proclamée ; « maintenant » conserve la valeur temporelle de עַתָּה.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: que c’est moi, moi qui suis lui
  rationale: Cette formulation française conserve le redoublement emphatique de אֲנִי sans le réduire à un simple « je suis lui » ni ajouter explicitement « seul ».
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: et qu’il n’y a pas de dieu à mes côtés
  rationale: « À mes côtés » rend naturellement עִמָּדִי dans cette affirmation d’exclusivité, tout en laissant une note signaler le sens plus littéral « avec moi ».
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: C’est moi qui fais mourir et qui fais vivre
  rationale: Les deux formes causatives sont rendues parallèlement. La tournure clivée reproduit aussi l’insistance renouvelée sur אֲנִי.
- source_word: מָחַצְתִּי
  choice: j’ai blessé
  rationale: Le verbe peut évoquer une atteinte violente, voire l’écrasement ; « blessé » forme ici une antithèse claire et naturelle avec « guérirai » sans imposer la nuance la plus forte.
- source_word: וַאֲנִי אֶרְפָּא
  choice: et c’est moi qui guérirai
  rationale: Le futur convient à l’imparfait hébreu dans la séquence, tandis que « c’est moi qui » maintient l’emphase du pronom exprimé.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: Personne ne peut délivrer de ma main
  rationale: La formulation exprime l’absence de tout sauveur capable d’arracher quelqu’un au pouvoir divin, tout en conservant l’image hébraïque de la main.
theological_decisions:
- issue: Exclusivité divine par rapport aux autres dieux
  choice: « il n’y a pas de dieu à mes côtés »
  alternative: « il n’y a pas de Dieu avec moi »
  rationale: Le contexte soutient une déclaration forte d’exclusivité divine. La traduction ne réduit pas la phrase à l’absence d’un simple associé, mais la note préserve la valeur littérale possible de la préposition.
- issue: Portée de l’expression emphatique אֲנִי אֲנִי הוּא
  choice: « c’est moi, moi qui suis lui »
  alternative: « moi, moi, je suis » ou « moi seul, je le suis »
  rationale: La répétition et la formulation sobre sont conservées sans transformer l’expression en formule doctrinale développée ni introduire « seul », absent de la proposition elle-même.
- issue: Souveraineté sur la mort, la vie, la blessure et la guérison
  choice: Conserver les quatre actions comme des affirmations directes de l’action divine
  alternative: Atténuer les premières comme de simples permissions divines
  rationale: Les verbes hébreux attribuent grammaticalement ces actions au locuteur. La traduction ne remplace donc pas l’action affirmée par une formulation théologique interprétative telle que « je permets ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique repose sur l’emphase répétée de « c’est moi », les couples antithétiques « mourir/vivre » et « blessé/guérir », et une conclusion concise sur l’impossibilité d’échapper au pouvoir divin.
