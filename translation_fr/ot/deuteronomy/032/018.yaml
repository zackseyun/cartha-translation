  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: fr
  text: 'Tu as délaissé[a] le Rocher qui t’a engendré,

    et tu as oublié le Dieu qui t’a mis au monde[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est difficile ; on peut aussi traduire « tu as oublié », « tu as négligé » ou « tu n’as pas tenu compte de ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie l’image de l’enfantement ; on pourrait aussi traduire « qui t’a enfanté » ou « qui t’a fait naître ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: le Rocher
  rationale: Le nom signifie littéralement « rocher » et sert ici de titre divin chargé de sens dans le Deutéronome. La majuscule conserve à la fois l’image concrète et sa fonction de désignation de Dieu.
- source_word: יְלָדְךָ
  choice: qui t’a engendré
  rationale: Le qal de ילד peut exprimer l’action d’engendrer. « Engendré » conserve nettement l’image paternelle et convient au registre poétique et solennel du passage.
- source_word: תֶּשִׁי
  choice: tu as délaissé
  rationale: La forme est difficile. Dans son parallélisme avec « tu as oublié », elle évoque l’abandon, la négligence ou le manque d’attention. « Délaissé » exprime une mise à l’écart coupable sans répéter exactement le second verbe.
- source_word: וַתִּשְׁכַּח
  choice: et tu as oublié
  rationale: Le verbe שכח signifie normalement « oublier »; cette traduction directe préserve le parallélisme accusateur.
- source_word: אֵל
  choice: le Dieu
  rationale: אל désigne ici Dieu, en parallèle avec « le Rocher ». L’article français est naturel devant la relative déterminative.
- source_word: מְחֹלְלֶךָ
  choice: qui t’a mis au monde
  rationale: La forme issue de חול évoque les douleurs de l’enfantement et l’action de faire naître. « Mis au monde » restitue naturellement en français l’imagerie de la naissance tout en gardant sa juxtaposition frappante avec « engendré ».
theological_decisions:
- issue: Imagerie parentale appliquée à Dieu
  choice: Conserver dans le texte les images complémentaires de l’engendrement et de la mise au monde.
  alternative: Employer un langage plus général, comme « qui t’a créé » ou « qui t’a formé ».
  rationale: L’hébreu juxtapose volontairement l’engendrement et l’enfantement. Une formulation générique atténuerait cette tension poétique et théologique au lieu de la transmettre.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël personnifié. La disposition en deux lignes met en valeur le parallélisme.
