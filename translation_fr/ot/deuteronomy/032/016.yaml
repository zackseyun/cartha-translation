    issue: « par des étrangers » dans le texte principal
    rationale: En français contemporain, cette expression évoque spontanément des personnes étrangères. Elle ne rend pas de façon suffisamment intelligible le référent cultuel implicite de זָרִים tout en préservant sa non-spécification.
  - severity: low
    issue: Formulation de note redondante et imprécise
    rationale: La note donne « par des étrangers » et « par des êtres étrangers » comme deux littéralités, alors que la seconde est déjà une clarification française. Il vaut mieux distinguer le littéral de l’explicitation contextuelle.
