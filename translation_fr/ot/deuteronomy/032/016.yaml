  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: fr
  text: Ils ont éveillé sa jalousie par des êtres étrangers[a] ; par des abominations, ils l’ont irrité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par des étrangers » ou « par des êtres étrangers ». Dans ce contexte, on peut aussi comprendre : « par des dieux étrangers » ou « par des dieux venus d’ailleurs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: ils ont provoqué sa jalousie
  rationale: Le hiphil de קנא exprime le fait de susciter la jalousie ou le zèle chez quelqu’un. Cette formulation française conserve le langage relationnel fort du texte tout en restant naturelle.
- source_word: בְּזָרִים
  choice: par des étrangers
  rationale: זָרִים signifie littéralement « étrangers » ou « êtres étrangers ». Le texte hébreu ne précise pas ici « dieux » ; le choix principal préserve cette indétermination, tandis que la note donne le sens explicité par le contexte idolâtre.
- source_word: בְּתוֹעֵבֹת
  choice: par des abominations
  rationale: תּוֹעֵבָה désigne ce qui est abominable ou profondément détestable, souvent en rapport avec l’idolâtrie. « Abominations » garde la force dénonciatrice du terme.
- source_word: יַכְעִיסֻהוּ
  choice: ils ont provoqué sa colère
  rationale: Le hiphil de כעס signifie susciter ou provoquer la colère. La tournure choisie rend la valeur causative et maintient le parallélisme avec le premier membre.
theological_decisions:
- issue: Faut-il expliciter que זָרִים désigne des divinités étrangères ?
  choice: Conserver « des étrangers » dans le texte principal.
  alternative: « des dieux étrangers » ou « des dieux venus d’ailleurs »
  rationale: Le contexte évoque clairement l’idolâtrie, mais le mot « dieux » n’apparaît pas dans ce verset hébreu. Le texte principal conserve donc l’ambiguïté lexicale, et la note fournit l’interprétation contextuelle probable sans l’imposer.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique est conservé par la répétition de « ils ont provoqué ». « Sa jalousie » et « sa colère » rendent naturellement en français les deux verbes causatifs hébreux sans atténuer le langage anthropopathique.
