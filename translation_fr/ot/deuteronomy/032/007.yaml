  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: fr
  text: 'Souviens-toi des jours d’autrefois ;

    considère les années, de génération en génération.


    Demande à ton père : il te le fera savoir ;

    à tes anciens : ils te le diront.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif direct de זכר. « Souviens-toi » est naturel en français et conserve l’appel à faire mémoire.
- source_word: יְמוֹת עוֹלָם
  choice: des jours d’autrefois
  rationale: L’expression désigne les temps anciens. « Les jours d’autrefois » restitue l’idiome hébreu dans un français courant et digne.
- source_word: בִּינוּ
  choice: réfléchis
  rationale: L’impératif de בין invite ici à porter une attention réfléchie à l’histoire. « Réfléchis » rend cette démarche sans présumer que la compréhension est déjà acquise.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: aux années, de génération en génération
  rationale: La formule littérale « génération et génération » a une valeur distributive. Cette tournure française préserve l’image des années et la succession des générations.
- source_word: שְׁאַל
  choice: Interroge
  rationale: L’impératif signifie demander ou s’enquérir auprès de quelqu’un. « Interroge » convient au contexte de transmission mémorielle.
- source_word: אָבִיךָ
  choice: ton père
  rationale: Le sens lexical immédiat est « ton père ». Le contexte peut lui donner une portée représentative, mais il n’est pas nécessaire d’élargir explicitement le terme.
- source_word: וְיַגֵּדְךָ
  choice: et il te racontera
  rationale: Le hiphil de נגד signifie faire connaître ou rapporter. « Il te racontera » est naturel pour la transmission des événements anciens et se distingue du verbe suivant.
- source_word: זְקֵנֶיךָ
  choice: tes anciens
  rationale: Le terme désigne les membres âgés et reconnus de la communauté. « Tes anciens » conserve cette dimension sociale plutôt que de ne signaler que l’âge.
- source_word: וְיֹאמְרוּ לָךְ
  choice: et ils te diront
  rationale: אמר est le verbe courant « dire ». La traduction garde la légère variation lexicale du parallélisme hébreu.
