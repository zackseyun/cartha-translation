base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: fr
  text: Car tu verras le pays à distance[a], mais tu n’iras pas là-bas, dans le pays que je donne aux fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’endroit d’en face » ou « de loin ». L’expression hébraïque indique que Moïse verra le pays sans y entrer.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aux fils d’Israël », désignation collective du peuple d’Israël.
    reason: clarification
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la déclaration précédente; « car » conserve clairement ce lien discursif.
- source_word: מִנֶּגֶד
  choice: à distance
  rationale: L’expression désigne une vue depuis un lieu situé en face ou à l’écart, sans accès au pays; « à distance » en rend naturellement le sens en français.
- source_word: תִּרְאֶה
  choice: tu verras
  rationale: L’imparfait hébreu a ici une valeur prédictive dans une déclaration divine solennelle.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire promis à Israël; « pays » est naturel en français et convient à un territoire habité.
- source_word: וְשָׁמָּה לֹא תָבֹא
  choice: mais tu n’entreras pas là-bas
  rationale: בוא peut signifier venir, aller ou entrer. Avec אֶל הָאָרֶץ, « entrer » exprime le franchissement refusé à Moïse, tandis que « là-bas » représente explicitement שָׁמָּה.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que je donne
  rationale: Le participe נֹתֵן présente le don comme l’action divine en cours ou imminente; le présent français conserve cette portée.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette traduction garde la forme de la désignation collective hébraïque tout en laissant le contexte montrer qu’elle vise le peuple d’Israël.
theological_decisions:
- issue: Portée de la désignation collective בְנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites; enfants d’Israël; peuple d’Israël
  rationale: La forme masculine plurielle est conservée comme désignation traditionnelle du peuple issu d’Israël, sans suggérer que la promesse ne concernerait que les hommes.
- issue: Don actuel ou futur du pays
  choice: que je donne
  alternative: que je vais donner; que je donnerai
  rationale: Le participe hébreu maintient une tension entre l’action présente de Dieu et son accomplissement imminent; le présent français évite de la réduire à un futur simple.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement convient à l’adresse divine individuelle faite à Moïse. La syntaxe conserve l’insistance du texte hébreu sur le contraste entre voir le pays et y entrer.
