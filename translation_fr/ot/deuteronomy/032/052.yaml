revisions:
- from: Car tu verras le pays à distance[a], mais tu n’entreras pas là-bas, dans le pays que je donne aux fils d’Israël[b].
  to: Car tu verras le pays à distance[a], mais tu n’iras pas là-bas, dans le pays que je donne aux fils d’Israël[b].
  rationale: 'La révision remplace une construction française redondante par une formulation naturelle qui conserve les deux éléments hébreux : « là-bas » (שָׁמָּה) et la destination « dans le pays » (אֶל הָאָרֶץ). La note a est complétée afin de refléter les principales possibilités de sens de מִנֶּגֶד. Aucun changement théologique ou interprétatif n’est introduit.'
