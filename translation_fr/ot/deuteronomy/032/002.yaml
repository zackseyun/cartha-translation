  text: יַעֲרֹ֤ף כַּ/מָּטָר֙ לִקְחִ֔/י תִּזַּ֥ל כַּ/טַּ֖ל אִמְרָתִ֑/י כִּ/שְׂעִירִ֣ם עֲלֵי דֶ֔שֶׁא וְ/כִ/רְבִיבִ֖ים עֲלֵי עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: fr
  text: Que mon enseignement tombe en gouttes comme la pluie[a] ; que ma parole se répande comme la rosée, comme des ondées sur la jeune herbe[b], comme des pluies abondantes sur les plantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se distille » ou « tombe » ; le verbe hébreu représente l’enseignement descendant comme la pluie.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu rendu par « ondées » est rare et peut désigner une pluie légère ou des gouttes de pluie.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: tombe en gouttes
  rationale: Le verbe évoque ici une descente en gouttes, à la manière de la pluie. Cette formulation conserve l’image concrète sans recourir au plus littéraire « distiller ».
- source_word: לִקְחִי
  choice: mon enseignement
  rationale: לֶקַח désigne ce qui est enseigné ou transmis ; « enseignement » convient au discours de Moïse et reste naturel en français moderne.
- source_word: תִּזַּל
  choice: coule
  rationale: Le verbe נזל exprime l’écoulement ou le fait de goutter. « Coule » préserve la douceur de l’image associée à la rosée.
- source_word: אִמְרָתִי
  choice: ma parole
  rationale: אִמְרָה désigne une parole ou une expression verbale. Le singulier collectif « ma parole » forme un parallèle poétique naturel avec « mon enseignement ».
- source_word: שְׂעִירִם
  choice: ondées
  rationale: Ce terme rare semble désigner une pluie légère ou des gouttes de pluie. « Ondées » rend l’image météorologique tout en évitant une précision excessive.
- source_word: דֶשֶׁא
  choice: jeune herbe
  rationale: דֶשֶׁא évoque l’herbe fraîche ou la végétation qui vient de pousser ; « jeune herbe » exprime cette nuance sans lourdeur.
- source_word: רְבִיבִים
  choice: pluies abondantes
  rationale: רְבִיבִים désigne des pluies copieuses ou de fortes ondées. « Pluies abondantes » garde l’intensification par rapport aux ondées du membre précédent.
- source_word: עֵשֶׂב
  choice: plantes
  rationale: עֵשֶׂב couvre plus largement les plantes et la végétation, et ne se limite pas à l’herbe ; « plantes » distingue donc ce terme de דֶשֶׁא.
