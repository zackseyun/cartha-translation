  text: אָמַ֖רְתִּי אַפְאֵי/הֶ֑ם אַשְׁבִּ֥יתָה מֵ/אֱנ֖וֹשׁ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: fr
  text: 'J’ai dit : « Je les disperserais[a], je ferais disparaître leur souvenir du milieu des humains[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les soufflerais au loin » ou « je les chasserais dans les coins ». Le verbe hébreu est rare et son sens exact est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « des mortels ». L’hébreu emploie un terme collectif au singulier pour désigner les êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: J’ai dit
  rationale: Le qal accompli à la première personne du singulier introduit directement l’intention exprimée par le Seigneur dans le poème.
- source_word: אַפְאֵיהֶם
  choice: Je les disperserais
  rationale: La forme hébraïque est rare et difficile. « Disperser » exprime clairement le jugement envisagé sans imposer une image incertaine telle que les chasser dans les coins ou les souffler au loin.
- source_word: אַשְׁבִּיתָה
  choice: je ferais disparaître
  rationale: Le hiphil de שבת indique ici que le Seigneur ferait cesser quelque chose. Avec « leur souvenir » comme complément, « faire disparaître » est naturel en français tout en conservant la valeur causative.
- source_word: מֵאֱנוֹשׁ
  choice: du milieu des humains
  rationale: אֱנוֹשׁ est un singulier collectif désignant les êtres humains, avec parfois une nuance de mortalité. Cette formulation rend le sens collectif et la préposition מן de manière idiomatique.
- source_word: זִכְרָם
  choice: leur souvenir
  rationale: זֵכֶר désigne ici le souvenir ou la mémoire laissée par eux. « Leur souvenir » est concis, naturel et fidèle.
theological_decisions:
- issue: Parole divine et jugement envisagé dans le cadre poétique
  choice: 'Employer le conditionnel : « je les disperserais… je ferais disparaître »'
  alternative: 'Employer le futur simple : « je les disperserai… je ferai disparaître »'
  rationale: Dans le déroulement du cantique, ces formes expriment une intention déclarée dont le verset suivant précise la mise en œuvre. Le conditionnel maintient ce rapport contextuel sans atténuer la gravité du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique demeure concise. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
