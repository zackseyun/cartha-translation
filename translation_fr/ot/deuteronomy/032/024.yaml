  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: fr
  text: Émaciés par la famine, dévorés par le fléau[a] et par une destruction cruelle, j’enverrai contre eux les crocs des bêtes[b], avec le venin des êtres qui rampent dans la poussière[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fièvre ardente ». Le mot hébreu רֶשֶׁף peut aussi faire écho à Resheph, nom d’une divinité associée aux épidémies dans le Proche-Orient ancien.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les dents des bêtes ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « les serpents de la poussière » ; l’expression hébraïque est toutefois plus large et désigne les créatures qui rampent sur le sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: Décharnés par la famine
  rationale: מְזֵי décrit des êtres amaigris, épuisés ou consumés. « Décharnés » rend concrètement les ravages physiques de la famine, tandis que « famine » convient ici mieux que la simple sensation de faim.
- source_word: לְחֻמֵי רֶשֶׁף
  choice: dévorés par le fléau
  rationale: La forme rare לְחֻמֵי évoque le fait d’être mangé ou dévoré. רֶשֶׁף peut désigner un fléau ardent, une maladie dévastatrice ou, en arrière-plan culturel, Resheph. « Fléau » conserve une portée assez large sans transformer le terme en nom propre.
- source_word: קֶטֶב מְרִירִי
  choice: une destruction amère
  rationale: קֶטֶב désigne une puissance destructrice ou un fléau mortel, et מְרִירִי en souligne littéralement l’amertume. La formulation conserve l’image poétique et distingue cette calamité de רֶשֶׁף.
- source_word: שֶׁן בְּהֵמוֹת
  choice: les crocs des bêtes
  rationale: שֶׁן signifie littéralement « dent », avec une valeur collective dans ce contexte. « Crocs » exprime naturellement en français la menace d’animaux qui attaquent, sans ajouter explicitement qu’ils sont sauvages.
- source_word: אֲשַׁלַּח בָּם
  choice: je lancerai contre eux
  rationale: La construction décrit l’envoi hostile de ces dangers contre le peuple. « Lancerai contre eux » est naturel, énergique et adapté au registre poétique du jugement.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: le venin des êtres qui rampent dans la poussière
  rationale: חֲמַת peut signifier chaleur, fureur ou poison; associé aux créatures rampantes, « venin » est le sens contextuel. La périphrase rend l’expression hébraïque sans la limiter arbitrairement aux serpents.
theological_decisions:
- issue: Possible arrière-plan mythologique de רֶשֶׁף
  choice: Traduire comme un nom commun, « fléau »
  alternative: Transcrire « Resheph » comme nom propre, ou traduire par « fièvre ardente »
  rationale: Le contexte immédiat énumère des calamités relevant du jugement. Le nom commun rend cette fonction littéraire sans imposer une référence mythologique, tandis qu’une note signale l’ambiguïté historique et lexicale réelle.
translation_notes:
  register: Français international actuel, poétique et digne. Les participes initiaux conservent la forme condensée de l’énumération hébraïque; le futur à la première personne maintient ensuite la déclaration directe de jugement. Les termes concrets « décharnés », « dévorés », « crocs » et « venin » préservent la vigueur des images sans technicisme.
