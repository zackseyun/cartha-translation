  text: Quand Moïse eut fini de dire toutes ces paroles à tout Israël,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: eut fini
  rationale: Le verbe כלה au wayyiqtol marque l’achèvement de l’action. Avec l’infinitif suivant, « eut fini de » rend naturellement en français cette valeur d’antériorité et de complétude.
- source_word: לְדַבֵּר
  choice: de dire
  rationale: Après « finir », l’infinitif français « de dire » forme l’expression idiomatique correspondant à la construction hébraïque. « Dire » convient ici à des paroles adressées à Israël.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דברים désigne ici les paroles prononcées précédemment. « Paroles » conserve la texture du texte et convient mieux au contexte que le terme plus général « choses ».
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: à tout Israël
  rationale: Cette formulation préserve la désignation collective et conventionnelle d’Israël sans l’expliciter par « tous les Israélites ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
