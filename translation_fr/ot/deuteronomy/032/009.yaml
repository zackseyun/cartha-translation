  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: fr
  text: 'Car la part de Yahweh, c’est son peuple,

    Jacob, le lot de son héritage[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jacob, le cordeau de son héritage » ou « Jacob, la part de son héritage ». Le mot hébreu חֶבֶל peut désigner littéralement une corde servant à mesurer et, par extension, une parcelle ou une part attribuée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Le terme relie ce verset à ce qui précède en introduisant une explication ou un fondement.
- source_word: חֵלֶק
  choice: part
  rationale: « Part » exprime naturellement en français ce qui revient à quelqu’un dans un partage et convient au parallélisme avec l’héritage.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: La traduction conserve le nom divin explicite du texte hébreu.
- source_word: עַמּוֹ
  choice: le peuple de Yahweh
  rationale: Cette formulation rend le suffixe possessif sans créer en français l’ambiguïté de « sa part est son peuple » quant à l’antécédent du possessif.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom patriarcal est conservé tel quel afin de préserver la formulation et le parallélisme poétiques.
- source_word: חֶבֶל
  choice: lot
  rationale: Dans ce contexte de répartition, חֶבֶל désigne par extension une part attribuée; « lot » conserve cette image tout en restant concis.
- source_word: נַחֲלָתוֹ
  choice: qui lui revient en héritage
  rationale: Cette tournure française rend l’idée d’une possession reçue ou attribuée en héritage et explicite naturellement le rapport entre חֶבֶל et נַחֲלָה.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme; « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Identification poétique du peuple comme Jacob
  choice: Jacob
  alternative: Israël
  rationale: Le texte dit « Jacob ». Le maintien de ce nom préserve le parallélisme et évite d’introduire une explicitation interprétative.
- issue: Sens métaphorique de חֶבֶל
  choice: le lot qui lui revient
  alternative: le cordeau de son héritage
  rationale: Le mot peut désigner littéralement une corde de mesure, puis une parcelle ou une part attribuée. Le texte principal retient le sens contextuel sans effacer le sens concret, signalé en note.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme en deux membres est conservé; la seconde ligne reste nominale, comme en hébreu, tandis que « qui lui revient » clarifie idiomatiquement le rapport d’héritage.
