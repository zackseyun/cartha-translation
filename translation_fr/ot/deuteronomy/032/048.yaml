  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait progresser le récit. « Parla » rend naturellement l'acte de parole et convient à la formule introductive לֵאמֹר.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du tétragramme, qui conserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: Rend directement le destinataire introduit par אֶל et emploie la forme française usuelle du nom.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: En ce même jour
  rationale: Cette locution souligne que l'événement eut lieu précisément ce jour-là. « En ce même jour » est naturel dans un récit biblique français sans rendre littéralement עֶצֶם par « substance » ou « os ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'La formule hébraïque introduit les paroles directes qui suivent. En français, « en ces termes : » évite le calque lourd « en disant » tout en signalant clairement l''ouverture du discours.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Yahweh ; Jéhovah
  rationale: Le texte hébreu porte le tétragramme comme nom propre. « Yahvé » est sa transcription française traditionnelle et largement intelligible ; elle préserve le nom personnel sans le remplacer par le titre « le SEIGNEUR ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit l'ordre naturel du français tout en conservant l'insistance temporelle de l'hébreu et la fonction introductive de לֵאמֹר.
