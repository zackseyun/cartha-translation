  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: fr
  text: 'Car je lève ma main vers le ciel et je dis[a] : « Aussi vrai que je vis pour toujours, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « je lève ma main vers le ciel et je dis : “Moi, je vis pour toujours.” » La formulation du texte principal fait ressortir la valeur de serment de l’expression hébraïque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement solennel de la déclaration précédente et conserve le lien logique du cantique.
- source_word: אֶשָּׂא אֶל שָׁמַיִם יָדִי
  choice: je lève ma main vers le ciel
  rationale: Conserve le geste concret de la main levée lors d’un serment. « Vers le ciel » rend naturellement la direction exprimée par אֶל.
- source_word: וְאָמַרְתִּי
  choice: et je déclare
  rationale: Le présent français s’accorde avec la valeur performative du serment; « déclare » en fait entendre la solennité sans ajouter le verbe « jurer » absent du texte.
- source_word: חַי אָנֹכִי
  choice: Aussi vrai que je vis
  rationale: Rend la valeur idiomatique de la formule de serment tout en conservant la référence explicite à la vie de celui qui parle.
- source_word: לְעֹלָם
  choice: pour toujours
  rationale: Exprime la durée sans fin dans une langue moderne et accessible, sans surcharger la formulation.
theological_decisions:
- issue: Rendre l’auto-serment divin sans le réduire à une simple affirmation d’existence
  choice: Aussi vrai que je vis pour toujours
  alternative: Moi, je vis pour toujours
  rationale: Le contexte et le geste de la main levée donnent à חַי אָנֹכִי une valeur de serment. La formulation retenue communique cette force tout en évitant d’ajouter une affirmation doctrinale absente de l’hébreu; la note préserve la forme plus littérale.
translation_notes:
  register: Français international moderne, solennel mais compréhensible. Le possessif de « ma main » est maintenu afin de conserver l’image hébraïque précise. La virgule finale signale que la déclaration se poursuit au verset suivant.
