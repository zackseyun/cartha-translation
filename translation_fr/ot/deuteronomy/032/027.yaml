  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: fr
  text: 'si je ne redoutais la provocation de l’ennemi[a], de peur que les adversaires d’Israël ne se méprennent[b], de peur qu’ils ne disent : « Notre main est la plus forte[c] ; Yahweh n’a pas fait tout cela. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la colère de l’ennemi » ou « l’insolence de l’ennemi ».'
    reason: Le sens de כַּעַס dans cette construction peut viser la colère de l’ennemi ou la provocation insolente qu’il ferait subir.
  - marker: b
    text: Le verbe hébreu est difficile ; il peut aussi signifier « ne jugent mal » ou « ne discernent pas » la véritable cause de la défaite d’Israël.
    reason: La nuance exacte du piel de נכר est incertaine dans ce contexte.
  - marker: c
    text: 'Littéralement : « Notre main est haute. »'
    reason: La traduction principale explicite l’image hébraïque d’une main élevée, symbole de supériorité et de victoire.
lexical_decisions:
- source_word: לוּלֵי
  choice: si je ne
  rationale: Cette tournure conserve la valeur conditionnelle et exceptive de l’hébreu tout en reliant naturellement le verset à la proposition précédente.
- source_word: כַּעַס אוֹיֵב
  choice: la provocation de l’ennemi
  rationale: Le syntagme peut évoquer la réaction hostile, insolente ou irritée de l’ennemi. « Provocation » maintient cette latitude sans la réduire à une simple colère.
- source_word: אָגוּר
  choice: je redoutais
  rationale: Le verbe exprime directement la crainte ou l’appréhension. « Redouter » garde la force de l’anthropopathisme sans suggérer nécessairement une faiblesse.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: La construction française exprime naturellement les deux propositions préventives introduites par la répétition de פֶּן.
- source_word: יְנַכְּרוּ
  choice: ne se méprennent
  rationale: Dans ce contexte, le piel difficile de נכר désigne probablement une interprétation erronée de la cause de la défaite d’Israël. La note conserve l’incertitude lexicale.
- source_word: צָרֵימוֹ
  choice: leurs adversaires
  rationale: Le possessif pluriel suit la forme massorétique et renvoie aux ennemis d’Israël.
- source_word: יָדֵינוּ רָמָה
  choice: Notre main est la plus forte
  rationale: Cette formulation française conserve l’image de la main comme symbole de puissance tout en rendant clairement la prétention à la victoire exprimée par « haute ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: פָּעַל כָּל זֹאת
  choice: n’a pas fait tout cela
  rationale: Rendu direct et idiomatique du déni selon lequel Yahweh serait l’auteur des événements.
theological_decisions:
- issue: Anthropopathisme dans אָגוּר
  choice: Conserver « je redoutais »
  alternative: « je me préoccupais de »
  rationale: Le texte attribue explicitement à Yahweh une crainte ou une appréhension. La traduction ne l’atténue pas, tandis que le contexte indique que l’enjeu est l’interprétation arrogante de l’ennemi, non une incapacité divine.
- issue: Nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu.
- issue: Cause de la retenue divine
  choice: Conserver l’idée que Yahweh tient compte de la réaction ennemie
  alternative: Reformuler comme une simple protection de sa réputation
  rationale: Le verset met en tension le jugement d’Israël et la conclusion mensongère qu’en tireraient ses adversaires. La traduction laisse cette logique s’exprimer sans l’expliquer doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase commence par une subordonnée conditionnelle parce que le verset poursuit la pensée du verset précédent. Les répétitions françaises sont légèrement allégées sans supprimer les deux craintes successives exprimées en hébreu.
