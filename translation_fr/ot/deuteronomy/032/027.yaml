  naturalness: Le français est globalement moderne et digne. « De peur que ... et ... » atténue la double construction préventive hébraïque; deux propositions coordonnées avec « de peur que » sont plus naturelles et plus transparentes. « Les adversaires d’Israël » évite aussi l’ambiguïté grammaticale de « leurs adversaires ».
  terminology: « Yahweh » respecte le traitement du tétragramme. « La provocation de l’ennemi » demeure une option recevable pour כַּעַס, avec une note qui conserve les sens alternatifs. « Notre main est la plus forte » rend adéquatement l’image idiomatique de la main élevée; la note littérale est utile.
  issues:
