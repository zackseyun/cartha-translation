    rationale: צָרֵימוֹ renvoie, dans le contexte, aux adversaires d’Israël. L’expliciter supprime une ambiguïté française involontaire.
  - severity: low
    issue: La seconde occurrence de פֶּן n’est pas reflétée distinctement.
    rationale: La coordination « ne se méprennent et ne disent » relie les deux verbes, mais l’hébreu répète la proposition préventive. La répétition française conserve mieux la structure et l’insistance.
