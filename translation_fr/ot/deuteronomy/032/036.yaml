base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: fr
  text: Car Yahweh fera justice à son peuple[a] et aura compassion de ses serviteurs[b], quand il verra que leur force est épuisée[c] et qu’il ne reste plus personne, esclave ou libre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jugera son peuple ». Ici, « fera justice à » indique que Yahweh intervient en faveur de son peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « changera d’attitude à l’égard de ses serviteurs ». Le verbe hébreu peut exprimer le fait de changer d’attitude ou d’être ému de compassion.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « la main s’en est allée » : expression signifiant que la force ou la puissance est épuisée.'
    reason: idiom_explanation
  - marker: d
    text: Hébreu « retenu et abandonné », expression difficile qui désigne probablement toutes les catégories de personnes, « esclave ou libre », ou simplement le fait qu’il ne reste absolument personne.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: fera justice à
  rationale: Le verbe peut signifier juger, gouverner ou rendre justice. Dans ce contexte, l’action est en faveur du peuple; « faire justice à » conserve la dimension judiciaire sans suggérer une condamnation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Rend directement la désignation collective et relationnelle du texte.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: et aura compassion de ses serviteurs
  rationale: Le verbe exprime ici le fait de revenir sur une action ou d’être ému de compassion. Le contexte d’extrême faiblesse favorise « aura compassion », tandis que « serviteurs » convient à la relation d’alliance.
- source_word: כִּי יִרְאֶה
  choice: quand il verra
  rationale: כִּי introduit ici une circonstance à la fois temporelle et causale; cette formulation française préserve naturellement ce chevauchement.
- source_word: אָזְלַת יָד
  choice: leur force est épuisée
  rationale: L’expression signifie littéralement que la « main » a disparu, mais « main » désigne idiomatiquement la force ou la puissance devenue défaillante.
- source_word: וְאֶפֶס
  choice: et qu’il ne reste plus personne
  rationale: אפס exprime l’absence ou la cessation; « personne » anticipe clairement les catégories humaines qui suivent.
- source_word: עָצוּר וְעָזוּב
  choice: esclave ou libre
  rationale: Cette paire difficile est probablement une expression englobante désignant toutes les catégories de personnes. « Esclave ou libre » en communique clairement le sens probable tout en signalant en note le caractère incertain de l’hébreu.
theological_decisions:
- issue: Sens de l’action divine envers Israël dans יָדִין ... וְעַל עֲבָדָיו יִתְנֶחָם
  choice: Yahweh agit en faveur de son peuple en lui faisant justice et en ayant compassion de ses serviteurs.
  alternative: Yahweh juge son peuple, éventuellement dans un sens défavorable, puis revient sur son action envers ses serviteurs.
  rationale: Le parallélisme avec la compassion et la mention de l’impuissance totale du peuple favorisent une intervention restauratrice. La note conserve néanmoins le sens judiciaire plus général de יָדִין et l’autre nuance possible de יִתְנֶחָם.
translation_notes:
  register: Français international moderne, digne et accessible. « Car » maintient le lien argumentatif avec le contexte. « Faire justice à » est idiomatique en français et conserve la portée judiciaire favorable. Les notes rendent visibles les principales ambiguïtés lexicales et l’obscurité de la paire finale.
