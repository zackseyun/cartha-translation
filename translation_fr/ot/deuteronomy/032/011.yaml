base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: fr
  text: Comme un aigle[a] qui réveille sa nichée et plane[b] au-dessus de ses petits, il déploie ses ailes, le prend et le porte sur ses rémiges[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « vautour » : le mot hébreu נֶשֶׁר peut désigner un grand rapace, notamment un aigle ou un vautour.'
    reason: lexical_alternative
  - marker: b
    text: Ou « voltige » ou « bat des ailes ».
    reason: lexical_alternative
  - marker: c
    text: Les rémiges sont les grandes plumes des ailes ; on peut aussi traduire plus généralement par « ailes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: Comme un aigle
  rationale: נֶשֶׁר désigne un grand rapace et est traditionnellement rendu par « aigle ». Cette désignation convient à l’image de force protectrice, tandis que la possibilité zoologique « vautour » est signalée en note.
- source_word: יָעִיר קִנּוֹ
  choice: qui remue son nid
  rationale: Le hifil de עור exprime l’action d’éveiller ou de mettre en mouvement. « Remue son nid » conserve la métonymie poétique de l’hébreu sans préciser que l’oiseau pousserait nécessairement ses petits à s’envoler.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: plane au-dessus de ses petits
  rationale: רחף évoque un mouvement de vol stationnaire, de flottement ou de battement au-dessus de quelque chose. « Plane » est naturel en français et maintient l’image de sollicitude protectrice.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: il déploie ses ailes
  rationale: פרש signifie étendre ou déployer. La formulation française est directe et conserve le masculin singulier de l’image.
- source_word: יִקָּחֵהוּ
  choice: le prend
  rationale: לקח signifie couramment « prendre ». Le pronom masculin singulier est conservé sans expliciter s’il individualise l’un des petits ou s’il renvoie, dans l’application de la comparaison, à Israël.
- source_word: יִשָּׂאֵהוּ
  choice: le porte
  rationale: נשא désigne ici l’action physique de porter. « Porte » est courant, clair et poétique.
- source_word: עַל אֶבְרָתוֹ
  choice: sur ses rémiges
  rationale: אֶבְרָה désigne le plumage ou les grandes plumes de l’aile. « Rémiges » préserve la distinction avec כָּנָף, rendu auparavant par « ailes », tout en restant un terme français précis.
theological_decisions:
- issue: Passage possible de l’image de l’aigle à son référent divin
  choice: Conserver « il / ses » sans ajouter le nom de Dieu ni employer de majuscule interprétative
  alternative: Maintenir explicitement toute la scène au seul niveau de l’oiseau, ou rendre explicite le passage au Seigneur
  rationale: Les formes hébraïques sont masculines singulières tout au long du verset, et le français emploie naturellement le masculin pour « aigle ». Le contexte applique l’image au Seigneur et à Israël, mais le verset ne marque pas grammaticalement un changement net. La traduction préserve donc cette superposition poétique sans la résoudre.
- issue: Référent du suffixe masculin singulier dans יִקָּחֵהוּ et יִשָּׂאֵהוּ
  choice: Employer « le » sans nommer le référent
  alternative: Écrire « prend l’un de ses petits » ou expliciter « prend Israël »
  rationale: Le singulier peut individualiser un petit dans la comparaison ou renvoyer à Israël dans son application. Expliciter l’un ou l’autre supprimerait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste fluide tout en conservant la métonymie du nid, le singulier énigmatique de l’objet et la distinction lexicale entre « ailes » et « rémiges ».
