  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: fr
  text: À moi la vengeance et la rétribution[a], au moment où leur pied glissera[b] ; car le jour de leur désastre est proche, et ce qui les attend arrive rapidement[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la récompense », « le paiement en retour ».
    reason: lexical_alternative
  - marker: b
    text: Ou « cédera », « chancellera ». Le singulier « leur pied » a ici une valeur collective.
    reason: lexical_alternative
  - marker: c
    text: Ou « les choses qui leur sont destinées arrivent rapidement » ; l’hébreu est condensé.
    reason: lexical_alternative
  - marker: d
    text: Le début de ce verset est cité en Romains 12.19 et repris en écho en Hébreux 10.30.
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: À moi la vengeance et la rétribution
  rationale: La tournure « À moi » conserve la construction hébraïque marquant la prérogative divine. « Vengeance » exprime la juste rétribution sans la réduire à la simple justice, tandis que « rétribution » rend le second terme nominal coordonné.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: pour le temps où leur pied chancellera
  rationale: « Pour le temps où » préserve la relation temporelle et la nuance d'un moment fixé. Le singulier collectif « leur pied » est maintenu, et « chancellera » rend l'image d'une stabilité qui cède.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: car le jour de leur désastre est proche
  rationale: « Car » exprime la valeur explicative ou causale de כִּי. « Désastre » traduit אֵיד sans préciser indûment la forme de la calamité.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: et ce qui leur est réservé se hâte
  rationale: 'La formulation conserve la compression poétique de l''hébreu : עֲתִדֹת désigne ce qui est prêt, destiné ou réservé, et וְחָשׁ en souligne l''approche rapide.'
theological_decisions:
- issue: Nature de la vengeance divine
  choice: Conserver « À moi la vengeance » comme affirmation de la prérogative divine en matière de jugement.
  alternative: « À moi la justice » ou « Je me vengerai »
  rationale: « Justice » atténuerait le terme hébreu, tandis que « Je me vengerai » transformerait la formulation nominale et pourrait suggérer une vindicte personnelle. Le choix retenu garde le poids judiciaire et l'écho intertextuel.
- issue: Sens de עֲתִדֹת לָמוֹ
  choice: « ce qui leur est réservé »
  alternative: « leur perte » ou « les choses qui leur sont destinées »
  rationale: Cette traduction garde indéterminé le contenu exact de ce qui les attend et évite de développer le texte en une notion abstraite de destin ou de condamnation.
translation_notes:
  register: Français international actuel, solennel et poétique sans archaïsme excessif. La syntaxe nominale « À moi… » et le singulier collectif ont été conservés pour refléter la forme hébraïque, tandis que les notes signalent les principales ambiguïtés lexicales.
