  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: fr
  text: 'Car ce n’est pas pour vous une parole sans valeur[a] : elle est votre vie[b]. Par cette parole, vous prolongerez vos jours sur la terre dont vous allez prendre possession en traversant le Jourdain[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une affaire sans importance » ou « une chose vaine ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vos vies » ; en hébreu, la forme plurielle peut désigner la vie comme une réalité collective ou abstraite.
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « sur la terre vers laquelle vous traversez le Jourdain, là-bas, pour en prendre possession ». Le verbe peut aussi être rendu par « en hériter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: une parole sans valeur
  rationale: דָבָר désigne ici la parole ou l’instruction d’alliance qui vient d’être prononcée, tandis que רֵק évoque ce qui est vide, vain ou dépourvu de valeur. « Une parole sans valeur » exprime naturellement en français que cette parole n’est ni vaine ni insignifiante, sans la réduire à une simple information dénuée de sens.
- source_word: מִכֶּם
  choice: pour vous
  rationale: Dans cette construction, מִן exprime la relation avec les destinataires plutôt qu’une séparation littérale. « Pour vous » rend l’idée que cette parole n’est pas sans valeur en ce qui concerne Israël.
- source_word: חַיֵּיכֶם
  choice: votre vie
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, חַיִּים fonctionne couramment comme un nom abstrait singulier. « Votre vie » est idiomatique et conserve la force collective de l’affirmation adressée à Israël.
- source_word: וּבַדָּבָר הַזֶּה
  choice: Par cette parole
  rationale: 'La préposition ב est ici instrumentale : cette parole est le moyen par lequel les jours d’Israël seront prolongés. La répétition de « parole » maintient le lien lexical avec דָבָר dans la première proposition.'
- source_word: תַּאֲרִיכוּ יָמִים
  choice: vous prolongerez vos jours
  rationale: Le hiphil de ארך avec יָמִים signifie littéralement rendre les jours longs, donc vivre longtemps. La formulation française conserve cette image biblique tout en restant claire.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: Dans le Deutéronome, אֲדָמָה renvoie ici au territoire promis où Israël vivra. « Sur la terre » préserve la préposition עַל et la portée territoriale de l’expression.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: après avoir traversé le Jourdain
  rationale: Le participe présente la traversée comme imminente du point de vue de Moïse. La tournure française replace naturellement cette traversée avant la prise de possession, sans modifier la séquence logique.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: dont vous allez prendre possession
  rationale: ירשׁ peut signifier posséder, prendre possession ou recevoir en héritage. « Prendre possession » convient au contexte territorial et rend explicite le pronom féminin qui renvoie à la terre.
theological_decisions:
- issue: Rapport entre la parole d’alliance, la vie et la durée dans le pays
  choice: Le texte présente la parole donnée à Israël comme sa vie et comme le moyen par lequel ses jours seront prolongés sur la terre.
  alternative: Comprendre le verset comme une simple affirmation rhétorique de l’importance de la Loi, sans conséquence liée à l’alliance.
  rationale: Le parallélisme entre « elle est votre vie » et « par cette parole, vous prolongerez vos jours » exprime un lien réel entre l’écoute de la parole et la vie d’Israël sur la terre. La traduction conserve ce lien sans préciser au-delà du texte la manière dont il s’accomplit.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour exprimer naturellement la traversée préalable du Jourdain et la prise de possession, tout en conservant les images de « vie », de jours prolongés et de terre. « Parole sans valeur » garde la tension entre le sens concret de « parole » et l’idée de vacuité ou de vanité.
