  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: fr
  text: Yahweh seul l’a conduit[a] ; aucun dieu étranger n’était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’a guidé ». Le verbe hébreu peut exprimer l’idée de conduire ou de guider.
    reason: Alternative lexicale.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré « Yahweh » afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בָּדָד
  choice: seul
  rationale: Employé adverbialement, le terme indique que Yahweh a agi sans aide ni accompagnement ; « seul » est naturel et concis en français.
- source_word: יַנְחֶנּוּ
  choice: l’a conduit
  rationale: La forme hiphil de נחה exprime ici l’action de conduire ou de guider. Le pronom masculin singulier est conservé et renvoie collectivement à Israël/Jacob dans le contexte.
- source_word: וְאֵין עִמּוֹ
  choice: aucun … n’était avec lui
  rationale: Cette tournure rend naturellement en français la négation existentielle et l’idée d’accompagnement, tout en conservant le pronom masculin singulier.
- source_word: אֵל נֵכָר
  choice: dieu étranger
  rationale: L’expression désigne une divinité étrangère à Israël. « Dieu étranger » est clair en français moderne et garde la portée polémique du texte contre l’idolâtrie.
theological_decisions:
- issue: Référent des pronoms masculins singuliers dans « l’a conduit » et « avec lui »
  choice: Conserver le singulier, qui renvoie collectivement à Israël/Jacob.
  alternative: Employer le pluriel (« les a conduits », « avec eux ») pour expliciter qu’il s’agit du peuple.
  rationale: L’hébreu emploie des suffixes masculins singuliers, conformément à la personnification d’Israël/Jacob comme une entité collective dans le contexte. Le français permet de conserver cette forme sans résoudre ou aplanir le trait grammatical du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé rend l’action narrative avec fluidité ; le point-virgule fait ressortir le parallélisme des deux propositions. Le nom « Yahweh » et le singulier collectif sont conservés.
