base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: fr
  text: 'J’enivrerai mes flèches de sang,

    et mon épée dévorera la chair,

    du sang des tués et des captifs,

    de la tête chevelue de l’ennemi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le dernier membre de phrase est difficile en hébreu, surtout le mot rare פַּרְעוֹת, ici rendu par « chevelue ». On peut aussi comprendre : « de la tête des chefs de l’ennemi » ou « des têtes des ennemis aux cheveux dénoués ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: J’enivrerai
  rationale: Le hifil de שׁכר signifie littéralement « rendre ivre ». Cette métaphore saisissante convient au langage poétique du chant et ne doit pas être affadie en « abreuverai » ou « tremperai ».
- source_word: חִצַּי
  choice: mes flèches
  rationale: Équivalent français courant et précis du pluriel de חֵץ avec suffixe de première personne.
- source_word: מִדָּם
  choice: de sang
  rationale: Après « enivrer », מן indique ce dont les flèches sont enivrées. « De sang » est l’expression française naturelle tout en restant proche de l’image hébraïque.
- source_word: וְחַרְבִּי
  choice: et mon épée
  rationale: Traduction directe de la construction possessive.
- source_word: תֹּאכַל בָּשָׂר
  choice: dévorera la chair
  rationale: « Dévorer » conserve la personnification violente de l’épée qui « mange » la chair, dans un français poétique naturel.
- source_word: מִדַּם חָלָל
  choice: du sang des tués
  rationale: חָלָל désigne normalement ceux qui ont été tués, notamment au combat. « Tués » est plus direct et actuel que « transpercés » ou « morts au combat ».
- source_word: וְשִׁבְיָה
  choice: et des captifs
  rationale: Le nom peut désigner la captivité ou l’ensemble des captifs. Le parallélisme avec « les tués » favorise ici une référence personnelle aux captifs.
- source_word: מֵרֹאשׁ
  choice: de la tête
  rationale: Le singulier hébreu רֹאשׁ est conservé. La relation exacte avec ce qui précède demeure difficile, d’où une formulation proche du texte source.
- source_word: פַּרְעוֹת
  choice: des guerriers aux cheveux dénoués
  rationale: Le terme rare פַּרְעוֹת est lié à l’idée de chevelure libre ou dénouée et peut, dans ce contexte guerrier, désigner des combattants ainsi caractérisés. Cette traduction garde l’image concrète et son incertitude mieux que l’interprétation plus abstraite « chefs ».
- source_word: אוֹיֵב
  choice: de l’ennemi
  rationale: Le singulier collectif est rendu naturellement en français par « l’ennemi ».
theological_decisions:
- issue: Sens de מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: de la tête des guerriers aux cheveux dénoués de l’ennemi
  alternative: du chef des dirigeants de l’ennemi ; de la tête chevelue de l’ennemi
  rationale: La difficulté est lexicale et syntaxique plutôt que doctrinale. Le texte principal conserve l’image probable de la chevelure dénouée ainsi que la référence guerrière suggérée par le contexte, sans transformer silencieusement le mot rare en « dirigeants ». Les autres analyses possibles sont signalées en note.
translation_notes:
  register: Français international moderne, poétique et solennel. Le parallélisme et les métaphores guerrières du texte hébreu sont maintenus. La ponctuation met en relief les deux propositions principales puis les compléments qui explicitent le carnage. Le marqueur [a] figure dans le texte principal.
