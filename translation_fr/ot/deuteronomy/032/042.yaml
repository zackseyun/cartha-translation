    issue: « guerriers » est ajouté dans le rendu de פַּרְעוֹת.
    rationale: Le mot rare renvoie vraisemblablement à la chevelure dénouée/libre et peut, selon l’analyse, avoir une extension vers des combattants ou des chefs, mais « guerriers » n’est pas lexicalement explicite. Il vaut mieux ne pas fixer cette interprétation dans le texte courant.
  - severity: medium
    issue: La construction « de la tête des guerriers aux cheveux dénoués de l’ennemi » est maladroite et ne reflète pas clairement le singulier רֹאשׁ.
    rationale: Elle peut faire comprendre une tête unique appartenant à plusieurs guerriers. Une construction avec « tête chevelue » conserve l’image singulière et la note peut signaler les analyses concurrentes.
