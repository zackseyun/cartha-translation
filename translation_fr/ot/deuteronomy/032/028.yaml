  language: fr
  text: 'Car ils sont une nation dépourvue de conseil,

    et il n’y a chez eux aucun discernement.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve clairement le lien logique.
- source_word: גּוֹי
  choice: nation
  rationale: Rend le nom collectif désignant ici un peuple constitué.
- source_word: אֹבַד עֵצוֹת
  choice: dépourvue de conseil
  rationale: Exprime l’idée d’être privé de conseil ou de capacité à former des desseins avisés, sans imposer une interprétation plus précise que l’hébreu.
- source_word: הֵמָּה
  choice: ils sont
  rationale: Le pronom indépendant est rendu par un sujet explicite et la copule nécessaire en français; le pluriel reprend collectivement les membres de la nation.
- source_word: וְאֵין
  choice: et il n’y a… aucun
  rationale: Reproduit naturellement en français la négation existentielle hébraïque et la coordination.
- source_word: בָּהֶם
  choice: chez eux
  rationale: Formulation française idiomatique indiquant que cette qualité fait défaut au sein de ce peuple.
- source_word: תְּבוּנָה
  choice: discernement
  rationale: Conserve le vocabulaire sapientiel et désigne la faculté de comprendre et de juger avec justesse.
