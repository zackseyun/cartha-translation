id: DEU.32.1
reference: Deuteronomy 32:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַאֲזִ֥ינוּ הַ/שָּׁמַ֖יִם וַ/אֲדַבֵּ֑רָה וְ/תִשְׁמַ֥ע הָ/אָ֖רֶץ אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: fr
  text: Cieux, prêtez l’oreille[a], et je parlerai ; que la terre écoute les paroles de ma bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « écoutez attentivement ». L’hébreu emploie ici des formes poétiques élevées de commandement et d’appel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: prêtez l’oreille
  rationale: L’impératif hiphil appelle une écoute attentive. « Prêtez l’oreille » conserve le ton élevé de l’invocation poétique tout en restant clair en français moderne.
- source_word: הַשָּׁמַיִם
  choice: Cieux
  rationale: Le pluriel « cieux » rend naturellement שָׁמַיִם dans cette adresse poétique directe, sans qu’il soit nécessaire d’ajouter un vocatif archaïsant.
- source_word: וַאֲדַבֵּרָה
  choice: et je parlerai
  rationale: La forme cohortative exprime ici l’intention ou la résolution du locuteur. Le futur français restitue naturellement cet élan sans imposer une valeur finale.
- source_word: וְתִשְׁמַע
  choice: que la terre écoute
  rationale: L’imparfait à valeur jussive forme un appel volitif parallèle à l’impératif initial. « Que… écoute » en maintient la nuance d’exhortation.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le couple cosmique cieux-terre, « terre » convient mieux que « pays » et préserve l’ampleur de l’adresse.
- source_word: אִמְרֵי
  choice: les paroles
  rationale: « Paroles » rend les énoncés prononcés avec une dignité poétique naturelle, sans la technicité de « énoncés ».
- source_word: פִי
  choice: de ma bouche
  rationale: Le complément concret est conservé afin de respecter l’image et la cadence poétiques de l’hébreu.
theological_decisions:
- issue: Portée de l’adresse aux cieux et à la terre
  choice: Une convocation poétique du cosmos comme témoin
  alternative: Un simple appel rhétorique adressé à tous les auditeurs
  rationale: Le parallélisme solennel entre les cieux et la terre évoque une formule de témoignage cosmique. La traduction en préserve la force sans expliciter cette interprétation dans le texte.
translation_notes:
  register: Français international moderne, digne et poétique. L’inversion ou le vocatif « ô » sont évités, tandis que « prêtez l’oreille » maintient la solennité. Le parallélisme entre l’impératif adressé aux cieux et l’appel jussif adressé à la terre est conservé.
