  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: fr
  text: 'eux qui mangent la graisse de leurs sacrifices

    et boivent le vin de leurs libations !

    Qu’ils se lèvent et vous aident ;

    qu’il soit pour vous un abri !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: la graisse de leurs sacrifices
  rationale: Rend directement l’expression cultuelle hébraïque, où חֵלֶב désigne la graisse des victimes sacrifiées.
- source_word: יֵין נְסִיכָם
  choice: le vin de leurs libations
  rationale: « Libations » est le terme français courant et précis pour le vin versé en offrande.
- source_word: סִתְרָה
  choice: un abri
  rationale: Le nom dérivé de סתר évoque un lieu où l’on est caché et protégé ; « abri » conserve cette image sans renforcer indûment le sens en « refuge ».
theological_decisions:
- issue: Référent des verbes « mangeaient » et « buvaient »
  choice: Conserver le pluriel et l’allusion implicite aux faux dieux mentionnés dans le contexte
  alternative: Expliciter « les dieux qui mangeaient… »
  rationale: Le verset hébreu commence par un relatif sans répéter son antécédent. La traduction maintient ce lien contextuel et évite une explicitation absente du texte.
- issue: Force des impératifs יָקוּמוּ, יַעְזְרֻכֶם et יְהִי
  choice: 'Les rendre comme un défi ironique : « Qu’ils se lèvent… qu’ils soient… »'
  alternative: Les rendre comme une simple demande ou prédiction
  rationale: Dans le discours divin du contexte, ces formes lancent un défi aux divinités impuissantes, tout en conservant grammaticalement leur valeur jussive.
translation_notes:
  register: Versification poétique en quatre lignes, avec un français moderne, digne et accessible. Le démonstratif « eux » reprend naturellement l’antécédent contextuel tout en préservant la syntaxe relative de l’hébreu. Aucun marqueur de note n’est requis.
