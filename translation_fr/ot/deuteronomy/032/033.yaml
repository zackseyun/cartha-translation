  text: חֲמַ֥ת תַּנִּינִ֖ם יֵינָ֑/ם וְ/רֹ֥אשׁ פְּתָנִ֖ים אַכְזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/033.yaml
  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: fr
  text: 'Leur vin est le venin des serpents[b],

    le poison cruel des aspics.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poison des vipères » ; l’hébreu désigne un serpent venimeux traditionnellement rendu par « aspic » ou « vipère ».
    reason: lexical_alternative
  - marker: b
    text: Dans d’autres contextes, le mot traduit par « serpents » peut désigner de grands reptiles ou des monstres marins ; ici, le parallélisme avec des serpents venimeux favorise ce sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: venin
  rationale: Dans cette construction associée aux serpents, le nom désigne leur substance toxique plutôt que la colère ou la chaleur. « Venin » est le terme français naturel et précis.
- source_word: תַּנִּינִם
  choice: serpents
  rationale: Le mot peut désigner ailleurs de grands reptiles ou des monstres marins, mais le parallélisme avec un autre serpent venimeux favorise ici le sens de « serpents ».
- source_word: יֵינָם
  choice: leur vin
  rationale: Le possessif hébreu est rendu directement. La formulation conserve l’identification métaphorique du vin avec un venin mortel.
- source_word: וְרֹאשׁ
  choice: poison
  rationale: Dans ce contexte, le terme désigne une substance toxique ou amère, non la « tête ». « Poison » est clair et évite de répéter « venin ».
- source_word: פְּתָנִים
  choice: cobras
  rationale: Le terme désigne un serpent venimeux dont l’identification zoologique exacte reste incertaine. « Cobras » offre une image moderne plausible, tandis qu’une note conserve l’alternative lexicale.
- source_word: אַכְזָר
  choice: cruel
  rationale: L’adjectif personnifie le poison comme impitoyable et meurtrier. « Cruel » reproduit avec concision la force poétique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La tournure détachée « c’est » rend naturellement la métaphore nominale hébraïque. Les deux lignes préservent le parallélisme et la distinction entre « venin » et « poison ».
