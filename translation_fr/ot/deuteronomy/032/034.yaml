  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: fr
  text: Cela n’est-il pas mis en réserve auprès de moi[a], scellé dans mes dépôts[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « caché auprès de moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans mes trésoreries » ou « dans mes réserves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Cela n’est-il pas
  rationale: La tournure conserve la question rhétorique qui appelle une réponse affirmative, dans un français naturel.
- source_word: הוּא
  choice: cela
  rationale: Le pronom hébreu est masculin singulier, mais son antécédent précis reste implicite. « Cela » reprend de manière neutre ce qui précède sans imposer un référent personnel.
- source_word: כָּמֻס
  choice: mis en réserve
  rationale: Le participe passif peut évoquer ce qui est caché ou conservé en réserve. Cette formulation s’accorde avec l’image des dépôts tout en gardant l’idée d’une chose retenue pour plus tard.
- source_word: עִמָּדִי
  choice: auprès de moi
  rationale: Cette traduction rend directement l’idée de présence et de garde attachée à עִם avec le suffixe de première personne, sans expliciter davantage le mode de conservation.
- source_word: חָתֻם
  choice: scellé
  rationale: Le participe passif désigne ce qui est fermé ou garanti par un sceau. « Scellé » en est l’équivalent français direct et idiomatique.
- source_word: בְּאוֹצְרֹתָי
  choice: dans mes dépôts
  rationale: Le nom peut désigner des lieux où l’on conserve des biens, notamment des magasins ou des trésoreries. « Dépôts » maintient l’image concrète du stockage sans la limiter à des richesses monétaires.
theological_decisions:
- issue: Référent de ce qui est mis en réserve et scellé
  choice: Le démonstratif neutre « cela », qui résume sans le préciser ce qui vient d’être évoqué
  alternative: Un référent personnel rendu par « lui », ou une explicitation telle que « ce jugement » ou « cette faute »
  rationale: Même si הוּא est grammaticalement masculin singulier, le contexte permet un renvoi global à la réalité précédemment décrite, possiblement la faute consignée ou le jugement réservé. « Cela » préserve l’indétermination du référent et évite de trancher la tension théologique.
translation_notes:
  register: Français international actuel, digne et accessible. La question rhétorique et les deux participes passifs de l’hébreu sont conservés. « Mis en réserve » et « dépôts » rendent cohérente l’image de conservation, tandis que les notes signalent les principales possibilités lexicales.
