  source_fidelity: 'Le sens global est fidèle : la rupture de fidélité envers Dieu, le lieu des eaux de Meriba de Qadesh dans le désert de Tsin, et le défaut de le tenir pour saint parmi les Israélites sont tous rendus. Toutefois, « manifester ma sainteté » déplace légèrement l’objet direct hébreu (« moi ») vers une abstraction ; « ne m’avez pas reconnu comme saint » rend plus directement l’expression sans perdre sa portée publique.'
