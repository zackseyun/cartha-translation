base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: fr
  text: parce que vous avez agi de manière infidèle envers moi parmi les Israélites, aux eaux de Meriba de Qadesh[a], dans le désert de Tsin, parce que vous ne m’avez pas reconnu comme saint[b] parmi les Israélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Meriba » signifie « contestation » ou « querelle » ; on peut aussi traduire : « aux eaux de la Contestation de Qadesh » ou « aux eaux de Meriba, à Qadesh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « vous n’avez pas manifesté ma sainteté » ou, plus littéralement, « vous ne m’avez pas sanctifié ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: vous avez agi de manière infidèle envers moi
  rationale: Le verbe מעל exprime une rupture de fidélité, souvent avec une portée religieuse ou liée à l’alliance. « Envers moi » désigne naturellement en français la personne lésée.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: au milieu des Israélites
  rationale: בְּתוֹךְ signifie « au milieu de » ou « parmi ». Dans cette expression ethnique consacrée, « les Israélites » rend naturellement בְּנֵי יִשְׂרָאֵל sans limiter la référence aux seuls hommes et permet de conserver la répétition hébraïque.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: aux eaux de Meriba de Qadesh
  rationale: L’expression désigne le lieu associé à l’épisode de la contestation. La translittération conserve sa valeur de nom propre, tandis qu’une note signale le sens du nom et une autre analyse possible de la construction.
- source_word: מִדְבַּר צִן
  choice: dans le désert de Tsin
  rationale: « Désert » est le terme géographique français courant pour מִדְבָּר dans ce contexte; « Tsin » transcrit le nom propre צִן.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: vous n’avez pas manifesté ma sainteté
  rationale: Le piel de קדשׁ indique ici que Moïse et Aaron n’ont pas publiquement fait apparaître Dieu comme saint. Cette formulation française est claire et n’implique aucune déficience de la sainteté intrinsèque de Dieu.
theological_decisions:
- issue: Sens public de קִדַּשְׁתֶּם אֹתִי
  choice: vous n’avez pas manifesté ma sainteté
  alternative: vous ne m’avez pas reconnu comme saint; vous ne m’avez pas sanctifié
  rationale: La faute porte sur la manière dont Moïse et Aaron ont représenté Dieu devant Israël. La traduction retenue exprime cette dimension publique tout en laissant en note les formulations plus littérales possibles.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël; les enfants d’Israël
  rationale: La locution fonctionne ici comme un ethnonyme désignant collectivement le peuple. « Israélites » en restitue la portée dans un français moderne sans introduire de restriction masculine.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « au milieu des Israélites » est conservée pour refléter l’insistance du texte hébreu. Les noms géographiques suivent des translittérations françaises usuelles et cohérentes.
