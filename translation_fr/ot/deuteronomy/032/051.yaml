  terminology: « Israélites », « Meriba », « Qadesh » et « Tsin » sont recevables en français international. « Désert » convient à מִדְבָּר. La note sur Meriba est utile ; celle sur « sanctifié » doit conserver son caractère plus littéral sans présenter cette formulation comme la plus naturelle.
