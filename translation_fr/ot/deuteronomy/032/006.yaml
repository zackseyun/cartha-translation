  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: fr
  text: Est-ce ainsi que vous traitez Yahweh, peuple insensé et dépourvu de sagesse ? N’est-il pas ton Père, celui qui t’a acquis[a] ? C’est lui qui t’a fait et qui t’a établi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui t’a créé » ou « qui t’a acheté ». Le verbe hébreu peut signifier acquérir, posséder, acheter ou, dans certains contextes, créer.
    reason: alternative lexicale
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: vous traitez
  rationale: Dans cette question de reproche, גמל décrit la manière dont Israël agit en retour envers Yahweh. « Traiter » est naturel en français dans la tournure « Est-ce ainsi que vous traitez… ? » et évite l’idée trop étroite d’un remboursement.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: peuple insensé et dépourvu de sagesse
  rationale: נָבָל exprime une folie morale et coupable, bien rendue par « insensé ». « Dépourvu de sagesse » restitue explicitement la négation de חָכָם sans la tournure peu naturelle « non sage ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אָבִיךָ
  choice: ton Père
  rationale: Le singulier hébreu s’adresse collectivement à Israël. La majuscule signale naturellement en français qu’il s’agit de Dieu.
- source_word: קָּנֶךָ
  choice: celui qui t’a acquis
  rationale: קנה peut signifier acquérir, posséder, acheter ou, dans certains contextes, créer. « Acquis » maintient ici la distinction lexicale avec עשה, « faire », dans la proposition suivante, tout en laissant les autres sens en note.
- source_word: עָשְׂךָ
  choice: t’a fait
  rationale: Rendu direct de עשה dans le contexte de l’action constitutive de Dieu envers Israël.
- source_word: וַיְכֹנְנֶךָ
  choice: t’a établi
  rationale: כון exprime ici l’idée d’établir, d’affermir ou de constituer solidement. « Établi » est précis, digne et distinct de « fait ».
theological_decisions:
- issue: Sens de קנה appliqué à la relation entre Dieu et Israël
  choice: celui qui t’a acquis
  alternative: celui qui t’a créé ; celui qui t’a acheté
  rationale: Le verbe admet plusieurs sens authentiques. « Acquis » préserve sa distinction par rapport aux verbes suivants, qui évoquent le fait de faire et d’établir, tandis qu’une note conserve l’ambiguïté lexicale.
- issue: Passage du pluriel au singulier dans l’adresse à Israël
  choice: « vous » dans le reproche, puis « ton/t’ » selon le texte hébreu
  alternative: uniformiser entièrement au pluriel ou au singulier
  rationale: L’hébreu passe du pluriel תִּגְמְלוּ au singulier collectif dans אָבִיךָ, קָּנֶךָ, עָשְׂךָ et וַיְכֹנְנֶךָ. La traduction conserve cette variation rhétorique plutôt que de la lisser.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la question rhétorique ainsi que le passage marqué du pluriel au singulier collectif. « Ô » a été évité afin de ne pas donner au reproche un ton inutilement archaïque.
