source:
  edition: WLC
  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: fr
  text: Car un feu s’est allumé dans ma colère ; il brûle jusqu’aux profondeurs du séjour des morts[a], dévore la terre et ses produits, et embrase les fondements des montagnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’au Shéol le plus bas » ou « jusqu’au Shéol le plus profond ». L’hébreu porte : « jusqu’au Shéol, le plus bas/profond ».'
    reason: Signale que « séjour des morts » traduit שְׁאוֹל et préserve l’ambiguïté de תַּחְתִּית, qui peut désigner ce qui est le plus bas ou le plus profond.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du jugement annoncé dans le contexte précédent et conserve naturellement la valeur logique de la conjonction.
- source_word: אֵשׁ קָדְחָה
  choice: un feu s’est allumé
  rationale: Rend l’entrée en combustion exprimée par le parfait, dans un français courant et imagé.
- source_word: בְאַפִּי
  choice: dans ma colère
  rationale: Traduit le sens idiomatique de אַף, plutôt que son sens concret de « nez » ou « narine ».
- source_word: וַתִּיקַד
  choice: il brûle
  rationale: Prolonge simplement l’image du feu, tandis que le complément suivant en indique l’étendue.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: jusqu’aux profondeurs du séjour des morts
  rationale: « Séjour des morts » communique le sens de שְׁאוֹל sans l’identifier à l’enfer au sens doctrinal ultérieur ; « profondeurs » rend תַּחְתִּית de façon naturelle.
- source_word: וַתֹּאכַל
  choice: dévore
  rationale: Conserve la métaphore vive du verbe « manger », appliquée au feu.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le cadre cosmique associant le Shéol et les fondements des montagnes favorise la portée large de « terre » plutôt que « pays ».
- source_word: וִיבֻלָהּ
  choice: ses produits
  rationale: Désigne largement ce que la terre produit, sans limiter le terme aux seules récoltes cultivées.
- source_word: וַתְּלַהֵט
  choice: embrase
  rationale: Rend avec vigueur et concision l’intensification de l’image du feu.
- source_word: מוֹסְדֵי הָרִים
  choice: les fondements des montagnes
  rationale: Préserve l’image concrète des parties structurelles les plus profondes des montagnes.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol ; la tombe ; le monde souterrain ; l’enfer
  rationale: « Séjour des morts » reste compréhensible pour un lectorat francophone général tout en préservant la notion hébraïque du domaine des morts. « Enfer » importerait une identification doctrinale ultérieure que le texte n’impose pas.
translation_notes:
  register: Français international moderne, digne et poétique. La ponctuation maintient le mouvement cumulatif du vers. « Séjour des morts » est privilégié dans le texte pour son intelligibilité, tandis que la note conserve explicitement « Shéol » et la formulation hébraïque plus littérale.
