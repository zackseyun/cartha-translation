  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: fr
  text: 'Tournez-vous, mettez-vous en route et allez vers la région montagneuse des Amorites ainsi que vers toutes les contrées voisines : dans l’Araba, dans la région montagneuse, dans les basses terres[a], dans le Néguev et sur le littoral, au pays des Cananéens et au Liban, jusqu’au grand fleuve, l’Euphrate.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la Shéphéla », nom de la région de collines et de piémont située à l’ouest des montagnes de Juda.
    reason: Alternative lexicale pour שְׁפֵלָה et identification du nom géographique traditionnel.
lexical_decisions:
- source_word: פְּנוּ
  choice: Tournez-vous
  rationale: L’impératif de פנה indique ici un changement de direction. « Tournez-vous » conserve la brièveté et la force du commandement sans préciser une direction absente de l’hébreu.
- source_word: וּסְעוּ לָכֶם
  choice: mettez-vous en route
  rationale: Dans un contexte de déplacement, נסע désigne le fait de lever le camp et de partir. La tournure pronominale française rend naturellement l’expression idiomatique לָכֶם sans lui donner une emphase réflexive excessive.
- source_word: וּבֹאוּ
  choice: et allez vers
  rationale: בוא peut signifier « venir », « aller » ou « entrer ». Dans cette suite d’ordres orientant Israël vers une destination, « allez vers » est naturel et maintient la valeur directionnelle.
- source_word: הַר הָאֱמֹרִי
  choice: la région montagneuse des Amorites
  rationale: הַר désigne ici un territoire de montagnes plutôt qu’un sommet isolé; le gentilé singulier a une valeur collective, rendue naturellement par « des Amorites ».
- source_word: שְׁכֵנָיו
  choice: toutes les régions qui l’entourent
  rationale: Le mot signifie littéralement « ses voisins ». Son antécédent territorial singulier permet de comprendre les territoires adjacents; cette formulation garde ce rapport spatial sans suggérer à tort uniquement des personnes.
- source_word: בָּעֲרָבָה
  choice: dans l’Araba
  rationale: עֲרָבָה est ici le nom géographique de la dépression du Jourdain et de l’Araba. La translittération préserve cette référence régionale précise.
- source_word: בָהָר
  choice: dans la région montagneuse
  rationale: Dans cette liste géographique, הַר désigne les hautes terres ou la région montagneuse, non une montagne particulière.
- source_word: וּבַשְּׁפֵלָה
  choice: dans le Bas-Pays
  rationale: שְׁפֵלָה désigne la région basse et vallonnée située à l’ouest des montagnes de Juda. « Bas-Pays » reste compréhensible, tandis que le nom technique « Shéphéla » est signalé en note.
- source_word: וּבַנֶּגֶב
  choice: dans le Néguev
  rationale: Dans cette série de zones géographiques, נֶגֶב renvoie à la région méridionale précise plutôt qu’au simple point cardinal « sud ».
- source_word: וּבְחוֹף הַיָּם
  choice: et sur le littoral
  rationale: חוֹף désigne le rivage ou la côte. « Sur le littoral » exprime naturellement en français la zone côtière visée par l’hébreu.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: au pays des Cananéens
  rationale: Le gentilé hébreu singulier est collectif. Le pluriel français désigne clairement le peuple associé au territoire.
- source_word: וְהַלְּבָנוֹן
  choice: et au Liban
  rationale: Bien que l’hébreu emploie l’article, le français moderne dit naturellement « au Liban ».
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: jusqu’au grand fleuve, l’Euphrate
  rationale: La seconde expression identifie explicitement le « grand fleuve ». L’apposition française conserve cette structure et emploie le nom usuel « Euphrate ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’enchaînement impératif et l’ample énumération géographique de l’hébreu. Les noms régionaux établis « Araba » et « Néguev » sont maintenus; le terme moins connu « Shéphéla » est donné en note. Le marqueur de note est placé sur le terme auquel il se rapporte.
