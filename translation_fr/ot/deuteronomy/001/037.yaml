  text: גַּם בִּ/י֙ הִתְאַנַּ֣ף יְהוָ֔ה בִּ/גְלַלְ/כֶ֖ם לֵ/אמֹ֑ר גַּם אַתָּ֖ה לֹא תָבֹ֥א שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: fr
  text: 'Yahweh s’est aussi irrité contre moi à cause de vous[a], en disant[b] : « Toi non plus, tu n’entreras pas là-bas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Yahweh s’est aussi mis en colère contre moi à cause de vous. »'
    reason: lexical_alternative
  - marker: b
    text: Comparer Nombres 20.12, où l’interdiction faite à Moïse d’entrer dans le pays est liée à sa propre faute à Mériba. Ici, le Deutéronome souligne le rôle du peuple dans cette affaire.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: aussi / non plus
  rationale: La particule marque l’addition dans ses deux emplois. « Aussi » convient au premier, tandis que « non plus », avec la négation, rend naturellement le second en français.
- source_word: בִּי
  choice: contre moi
  rationale: Avec הִתְאַנַּף, la préposition בְּ désigne l’objet de la colère. « Contre moi » est idiomatique et conserve l’orientation de cette colère.
- source_word: הִתְאַנַּף
  choice: s’est irrité
  rationale: Le hitpael exprime ici le fait de se mettre en colère ou d’être courroucé. « S’est irrité » rend l’aspect verbal sans exagérer l’intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בִּגְלַלְכֶם
  choice: à cause de vous
  rationale: Cette locution exprime directement la cause ou le motif occasionnel; la formulation française est claire et naturelle.
- source_word: לֵאמֹר
  choice: Il a dit
  rationale: L’infinitif introduit le contenu de la parole divine. Une nouvelle proposition est plus naturelle en français que le calque participial « disant ».
- source_word: גַּם אַתָּה
  choice: toi non plus
  rationale: Le pronom explicite אַתָּה porte une emphase sur Moïse; « toi » la conserve, et « non plus » associe naturellement גַּם à la négation.
- source_word: לֹא תָבֹא
  choice: tu n’entreras pas
  rationale: Dans ce contexte, בוא désigne l’entrée dans le pays évoqué. Le futur français exprime clairement l’annonce divine.
- source_word: שָׁם
  choice: là-bas
  rationale: L’adverbe renvoie au pays dont il est question. « Là-bas » préserve sa valeur déictique et sonne naturellement en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Cause de l’exclusion de Moïse
  choice: Le verset affirme que Yahweh s’est irrité contre Moïse à cause du peuple, sans résoudre ici la relation avec la faute personnelle de Moïse.
  alternative: Attribuer toute la responsabilité au peuple, ou intégrer explicitement dans le texte la faute de Moïse rapportée en Nombres 20.
  rationale: La traduction suit la formulation propre à Deutéronome 1.37 et maintient la tension avec les autres récits bibliques au lieu de l’harmoniser silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée en deux phrases pour éviter le calque peu naturel « disant ». « Toi non plus » conserve l’emphase du pronom hébreu et la force cumulative du second גַּם.
