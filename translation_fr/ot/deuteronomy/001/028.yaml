source:
  edition: WLC
  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: fr
  text: 'Où montons-nous ? Nos frères nous ont fait perdre courage[a] en disant : « Ce peuple est plus grand et de plus haute taille que nous ; les villes sont grandes et fortifiées jusqu’au ciel[b] ; nous y avons même vu des descendants d’Anak[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont fait fondre notre cœur », c’est-à-dire qu’ils nous ont découragés.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fortifiées dans le ciel » ; expression hyperbolique désignant des fortifications extrêmement élevées.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « des fils d’Anak » ; on peut aussi traduire : « des Anakites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Où montons-nous ?
  rationale: L’interrogatif porte sur la destination, et le participe de עלה exprime le mouvement en cours. « Monter » conserve l’image géographique du texte tout en restant naturel.
- source_word: אַחֵינוּ
  choice: Nos frères
  rationale: Rend directement le masculin pluriel avec suffixe de première personne et préserve la rhétorique fraternelle appliquée aux autres Israélites.
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: nous ont fait perdre courage
  rationale: Littéralement, l’expression signifie « ont fait fondre notre cœur ». Le français idiomatique exprime ici la démoralisation ; la métaphore hébraïque est signalée en note.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: Ce peuple est plus grand et de plus haute taille que nous
  rationale: גָּדוֹל indique ici la grandeur ou l’importance numérique, tandis que רָם évoque la haute stature. La formulation conserve les deux aspects sans les confondre.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: les villes sont grandes et fortifiées jusqu’au ciel
  rationale: « Fortifiées » traduit le caractère défensif des villes, et « jusqu’au ciel » maintient l’hyperbole hébraïque de fortifications extrêmement élevées.
- source_word: וְגַם
  choice: même
  rationale: Dans cette accumulation d’éléments alarmants, « même » introduit naturellement le dernier détail qui renforce la peur.
- source_word: בְּנֵי עֲנָקִים
  choice: des descendants d’Anak
  rationale: Cette traduction rend le sens généalogique de בְּנֵי et identifie clairement le groupe pour un lectorat moderne, tout en conservant le nom propre.
- source_word: רָאִינוּ שָׁם
  choice: nous y avons vu
  rationale: Le passé composé convient au témoignage rapporté et « y » rend naturellement l’adverbe שָׁם.
theological_decisions: []
