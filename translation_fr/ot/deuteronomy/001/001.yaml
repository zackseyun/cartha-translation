  text: אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל כָּל יִשְׂרָאֵ֔ל בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן בַּ/מִּדְבָּ֡ר בָּֽ/עֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין פָּארָ֧ן וּ/בֵֽין תֹּ֛פֶל וְ/לָבָ֥ן וַ/חֲצֵרֹ֖ת וְ/דִ֥י זָהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: fr
  text: Voici les paroles que Moïse adressa à tout Israël de l’autre côté du Jourdain[a], dans le désert, dans l’Araba[b], en face de Souf[c], entre Paran, Tofel, Laban, Hatséroth et Di-Zahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « au-delà du Jourdain » ou « sur l’autre rive du Jourdain ». L’expression hébraïque varie selon le point de vue géographique adopté.'
    reason: lexical_alternative
  - marker: b
    text: L’« Araba » est la région de plaine et de dépression qui prolonge la vallée du Jourdain; le terme est parfois traduit simplement par « plaine ».
    reason: cultural_note
  - marker: c
    text: 'Hébreu : « Souf ». Certains y voient un nom de lieu; d’autres rapprochent ce terme de la « mer des Roseaux », mais le mot « mer » ne figure pas ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Voici les paroles
  rationale: La tournure présentative « Voici » rend naturellement אֵלֶּה dans cette ouverture, tandis que « les paroles » convient au discours de Moïse et conserve la portée de דְּבָרִים.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: que Moïse adressa
  rationale: Dans ce contexte, « adresser des paroles à » rend le discours formel exprimé par דִּבֶּר et produit une phrase française naturelle sans ajouter l’idée d’un écrit.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: à tout Israël
  rationale: Cette formulation désigne l’ensemble du peuple d’Israël et correspond directement à כָּל.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Cette expression française conserve la relation géographique sans imposer un point de vue précis; une note signale l’ambiguïté déictique.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français biblique courant, « désert » désigne naturellement une région aride et peu habitée, sans nécessairement évoquer seulement des dunes de sable.
- source_word: בָּעֲרָבָה
  choice: dans l’Araba
  rationale: Le terme fonctionne ici comme une désignation géographique de la région de la grande dépression; sa translittération évite de le réduire au sens générique de « plaine ».
- source_word: מוֹל סוּף
  choice: en face de Souf
  rationale: מוֹל signifie « en face de » ou « vis-à-vis de ». Le texte porte seulement סוּף, sans le mot « mer »; « Souf » préserve donc l’incertitude entre toponyme et association possible avec la mer des Roseaux.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: entre Paran, Tofel, Laban, Hatséroth et Di-Zahab
  rationale: Une énumération avec virgules et une dernière coordination est idiomatique en français tout en conservant chaque nom de lieu du texte hébreu.
- source_word: דִי זָהָב
  choice: Di-Zahab
  rationale: Le groupe est traité comme un nom de lieu et translittéré plutôt que traduit selon son sens littéral possible lié à l’or.
