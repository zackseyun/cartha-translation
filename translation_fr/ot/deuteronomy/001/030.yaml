base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: fr
  text: Yahweh, votre Dieu, qui marche devant vous, combattra lui-même pour vous, tout comme il l’a fait pour vous[a] en Égypte, sous vos yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il a fait avec vous ». Dans ce contexte, l’expression désigne ce que Yahweh a accompli en faveur d’Israël en Égypte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Le nom divin est translittéré « Yahweh », tandis que אֱלֹהֵיכֶם, malgré sa forme morphologiquement plurielle, désigne ici au singulier le Dieu d’Israël.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: qui marche devant vous
  rationale: Le participe exprime l’action continue de Yahweh qui conduit son peuple; « marche devant vous » est naturel en français et conserve l’image spatiale.
- source_word: הוּא יִלָּחֵם לָכֶם
  choice: combattra lui-même pour vous
  rationale: Le pronom indépendant הוּא porte une insistance rendue par « lui-même »; le nifal de לחם avec לָכֶם indique que Yahweh combat en faveur d’Israël.
- source_word: כְּכֹל אֲשֶׁר
  choice: tout comme
  rationale: Cette tournure rend clairement la comparaison avec l’action passée de Yahweh sans alourdir la phrase.
- source_word: עָשָׂה אִתְּכֶם
  choice: il l’a fait pour vous
  rationale: Littéralement, l’hébreu dit « il a fait avec vous », mais, dans ce contexte, la locution renvoie naturellement à l’intervention de Yahweh en faveur d’Israël; une note conserve la formulation source.
- source_word: בְּמִצְרַיִם לְעֵינֵיכֶם
  choice: en Égypte, sous vos yeux
  rationale: « En Égypte » exprime le lieu, et l’expression idiomatique « sous vos yeux » souligne que les Israélites ont été témoins directs des actes évoqués.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le nom propre divin; sa translittération préserve cette fonction sans le remplacer par un titre.
- issue: Agent emphatique du combat
  choice: combattra lui-même pour vous
  alternative: combattra pour vous
  rationale: Le pronom explicite הוּא met l’accent sur Yahweh comme celui qui interviendra personnellement; « lui-même » maintient cette insistance.
- issue: Sens contextuel de עָשָׂה אִתְּכֶם
  choice: il l’a fait pour vous
  alternative: il a agi avec vous
  rationale: La formulation française choisie exprime l’action salvatrice en faveur d’Israël tout en signalant en note la tournure hébraïque plus ambiguë, afin de ne pas masquer la donnée source.
translation_notes:
  register: Français international moderne, digne et accessible. « Marche devant vous » conserve l’image biblique de la conduite divine; « sous vos yeux » est une tournure française courante et expressive. Le marqueur de note est placé immédiatement après la proposition concernée.
