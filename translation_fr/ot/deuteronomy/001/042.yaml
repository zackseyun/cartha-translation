source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: fr
  text: 'Yahweh m’a dit : « Dis-leur : Ne montez pas et ne combattez pas, car je ne suis pas au milieu de vous[a], de peur que vous ne soyez battus[b] devant vos ennemis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi vous ».'
    reason: Alternative naturelle pour בְּקִרְבְּכֶם, littéralement « au milieu de vous ».
  - marker: b
    text: 'Ou : « mis en déroute ».'
    reason: נגף peut désigner le fait d’être frappé ou défait au combat.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin de l’hébreu sous une translittération largement reconnaissable, plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר … אֵלַי
  choice: me dit
  rationale: Rend naturellement en français le verbe narratif אמר et son complément indiquant Moïse comme destinataire.
- source_word: אֱמֹר לָהֶם
  choice: Dis-leur
  rationale: Formulation impérative directe, naturelle et fidèle au singulier hébreu adressé à Moïse.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Ne montez pas et ne combattez pas
  rationale: Préserve les deux interdictions coordonnées et le sens géographique et militaire des verbes.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: car je ne suis pas au milieu de vous
  rationale: Reproduit l’image spatiale de בקרבכם tout en exprimant clairement l’absence de la présence divine avec le peuple.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: de peur que vous ne soyez battus
  rationale: Dans ce contexte d’avertissement, la coordination hébraïque exprime la conséquence à éviter. Cette tournure française évite le contresens d’une promesse selon laquelle ils ne seraient pas vaincus.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: devant vos ennemis
  rationale: Conserve l’idiome militaire hébreu, clair et digne en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte emploie explicitement le tétragramme. La translittération préserve le nom propre sans le remplacer par un titre confessionnel.
- issue: Valeur de וְלֹא תִּנָּגְפוּ
  choice: 'avertissement : « de peur que vous ne soyez battus »'
  alternative: 'coordination formelle : « et vous ne serez pas battus »'
  rationale: Le contexte présente la défaite comme la conséquence redoutée de leur montée sans la présence de Yahweh. Une négation future littérale produirait en français le sens inverse.
translation_notes:
  register: Français international moderne, direct et solennel. Le discours conserve les deux impératifs négatifs et l’image de la présence divine « au milieu » du peuple. La tournure « de peur que… ne » est soutenue mais courante dans un registre biblique digne; le « ne » y est explétif et n’inverse pas le sens.
