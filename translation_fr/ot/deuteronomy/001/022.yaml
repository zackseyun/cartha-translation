  to: 'Alors vous vous êtes tous approchés de moi et vous avez dit : « Envoyons des hommes devant nous pour qu’ils explorent le pays pour nous[a] et nous fassent un rapport sur le chemin par lequel nous monterons dans le pays[b], ainsi que sur les villes où nous entrerons. »'
  rationale: La révision supprime la nuance de nécessité ajoutée par « devons », clarifie le rapport attendu et rend plus précisément le mouvement vers les villes. Les deux notes sont conservées avec leurs ancrages, et la note b est reformulée pour être exacte et idiomatique.
