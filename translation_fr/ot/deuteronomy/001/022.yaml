base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: fr
  text: 'Alors vous vous êtes tous approchés de moi et vous avez dit : « Envoyons des hommes devant nous pour qu’ils explorent le pays pour nous[a] et nous fassent un rapport sur le chemin par lequel nous monterons dans le pays[b], ainsi que sur les villes où nous entrerons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « examinent le pays pour nous » ou « reconnaissent le pays pour nous ». Le verbe hébreu peut désigner le fait de rechercher ou d’examiner attentivement.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le chemin par lequel nous monterons en lui », le pronom renvoyant au pays. « Monter » conserve l’expression biblique courante pour entrer dans le pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: vous vous êtes tous approchés de moi
  rationale: « S’approcher » rend directement קָרַב, et « tous » préserve l’insistance de כֻּלְּכֶם dans un français naturel.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: Envoyons des hommes
  rationale: Le cohortatif est naturellement rendu par « Envoyons ». Dans ce contexte, אֲנָשִׁים désigne les hommes choisis pour la reconnaissance.
- source_word: לְפָנֵינוּ
  choice: devant nous
  rationale: Cette expression française idiomatique conserve l’image spatiale de l’hébreu et indique qu’ils partiront en avant du groupe.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: pour qu’ils explorent le pays pour nous
  rationale: Dans ce contexte de reconnaissance, חָפַר signifie examiner ou rechercher avec soin. « Explorer » reste clair sans imposer l’idée plus précise d’espionnage clandestin.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: et nous rapportent des informations
  rationale: La tournure exprime le retour d’un compte rendu. « Rapporter des informations » est naturel en français et prépare les deux compléments qui suivent.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: sur le chemin par lequel nous devons y monter
  rationale: « Chemin » correspond à דֶּרֶךְ; « monter » conserve l’idiome biblique de עָלָה, tandis que « y » renvoie sans ambiguïté au pays.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: ainsi que sur les villes où nous arriverons
  rationale: Cette formulation rend le second objet du rapport dans un français fluide. « Arriverons » conserve l’orientation vers les villes sans surinterpréter le verbe comme une conquête.
