  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: fr
  text: 'Yahweh notre Dieu nous a parlé à Horeb[a] : « Vous êtes restés assez longtemps dans cette montagne[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Horeb, nom donné ici à la montagne également associée au Sinaï.'
    reason: cross_reference
  - marker: b
    text: 'Ou : « sur cette montagne ». Littéralement : « Assez pour vous de demeurer dans cette montagne. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Malgré la forme morphologique אֱלֹהִים, la référence au Dieu d’Israël est singulière; le suffixe de première personne du pluriel donne naturellement « notre Dieu ».
- source_word: דִּבֶּר אֵלֵינוּ
  choice: nous a parlé
  rationale: דבר signifie couramment « parler », et אֶל indique ici le destinataire. Cette tournure française est naturelle et fidèle.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: La préposition est locative. L’article devant ce nom traditionnel de montagne est idiomatique en français, et « Horeb » est conservé sans harmonisation avec « Sinaï ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: La formule hébraïque introduit le discours direct. En français actuel, les deux-points rendent cette fonction plus naturellement qu’un littéral « en disant ».
- source_word: רַב לָכֶם שֶׁבֶת
  choice: Vous êtes restés assez longtemps
  rationale: L’expression associe l’idée de suffisance ou d’excès à l’action de demeurer. Cette formulation française restitue clairement l’idée contextuelle sans surtraduire.
- source_word: בָּהָר הַזֶּה
  choice: près de cette montagne
  rationale: ב marque le lieu du séjour. « Près de cette montagne » convient au campement aux abords de l’Horeb, tout en signalant en note l’alternative plus formelle « sur cette montagne ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel au lieu de le remplacer par un titre.
- issue: Rapport entre Horeb et Sinaï
  choice: Conserver « Horeb » dans le texte
  alternative: Harmoniser avec « Sinaï »
  rationale: Le texte hébreu dit חֹרֵב. La note informe le lecteur de l’association avec le Sinaï sans effacer la désignation propre à ce passage.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient à un discours narratif adressé directement au peuple. Les deux-points évitent le calque pesant de la formule hébraïque לֵאמֹר. Les marqueurs [a] et [b] figurent tous deux dans le texte.
