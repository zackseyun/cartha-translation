  terminology: « Yahweh » préserve adéquatement le tétragramme, et « Horeb » doit être maintenu sans harmonisation dans le texte avec « Sinaï ». La note peut signaler l’association traditionnelle avec le Sinaï sans identifier les deux noms de manière excessive.
