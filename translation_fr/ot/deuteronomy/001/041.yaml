base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: fr
  text: 'Alors vous m’avez répondu : « Nous avons péché contre Yahweh. Nous monterons nous-mêmes combattre, exactement comme Yahweh notre Dieu nous l’a ordonné. » Puis chacun de vous s’est équipé de ses armes de guerre, et vous avez eu la présomption[a] de monter vers la montagne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est rare et son sens exact est discuté. Il peut aussi être compris ainsi : « vous vous êtes empressés de monter » ou « vous avez témérairement entrepris de monter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: vous m’avez répondu
  rationale: La formule hébraïque « répondre et dire » introduit une réplique. En français naturel, « répondre » suffit sans perdre le sens.
- source_word: חָטָאנוּ לַיהוָה
  choice: Nous avons péché contre Yahweh
  rationale: Avec חטא, la préposition ל désigne ici la personne offensée ; « pécher contre » est l’expression française idiomatique.
- source_word: אֲנַחְנוּ נַעֲלֶה וְנִלְחַמְנוּ
  choice: Nous monterons nous-mêmes combattre
  rationale: Le pronom explicite אֲנַחְנוּ est rendu par « nous-mêmes » afin d’en conserver l’insistance, tandis que « monter combattre » reste fluide et garde le mouvement ascendant.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: exactement comme … nous l’a ordonné
  rationale: Cette formulation exprime la prétention du peuple à se conformer pleinement à l’ordre reçu et restitue la totalité marquée par כֹּל.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: Chacun de vous a donc attaché ses armes de guerre
  rationale: אִישׁ a une valeur distributive après le verbe pluriel. « Armes de guerre » conserve la portée générale de כְּלֵי מִלְחָמָה sans préciser indûment l’équipement.
- source_word: וַתָּהִינוּ
  choice: vous avez eu la présomption
  rationale: Ce verbe rare semble décrire, dans le contexte immédiat, une initiative téméraire et trop assurée. La traduction garde cette nuance négative tout en signalant en note l’incertitude lexicale.
- source_word: לַעֲלֹת הָהָרָה
  choice: de monter dans la région montagneuse
  rationale: הָהָר peut désigner ici non une montagne isolée, mais la zone montagneuse du pays ; la terminaison directive indique le mouvement vers cette région.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle présente dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Portée morale du verbe rare וַתָּהִינוּ
  choice: vous avez eu la présomption de monter
  alternative: vous vous êtes empressés de monter ; vous avez témérairement entrepris de monter ; vous avez décidé de monter
  rationale: Le contexte du verset suivant présente la montée comme une désobéissance obstinée. « Présomption » conserve cette appréciation négative, tandis que la note reconnaît que le sens exact du verbe rare demeure discuté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours direct reste naturel ; « région montagneuse » rend la portée géographique probable de הָהָר, et la note préserve l’incertitude attachée au verbe rare וַתָּהִינוּ.
