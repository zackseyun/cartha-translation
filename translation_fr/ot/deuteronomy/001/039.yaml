source:
  edition: WLC
  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: fr
  text: Quant à vos petits enfants, dont vous aviez dit qu’ils deviendraient un butin[a], et à vos enfants, qui aujourd’hui ne savent pas discerner le bien du mal[b], ce sont eux qui y entreront. C’est à eux que je donnerai ce pays, et ils en prendront possession[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils deviendraient une proie ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque décrit l’absence de discernement mûr.
    reason: cultural_note
  - marker: c
    text: 'Ou : « ils en hériteront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: vos petits enfants
  rationale: Le nom טַף désigne ici les jeunes enfants, considérés dans leur vulnérabilité, plutôt que l’ensemble des descendants ou des personnes à charge.
- source_word: לָבַז יִהְיֶה
  choice: deviendraient une proie
  rationale: בַּז désigne ce qui est capturé ou pillé par l’ennemi. « Une proie » est naturel en français dans cette expression de crainte; « butin » demeure une possibilité plus concrète.
- source_word: בְנֵיכֶם
  choice: vos enfants
  rationale: Bien que בָּנִים soit morphologiquement masculin, le contexte vise la génération suivante dans son ensemble. En français courant, « enfants » rend naturellement cette portée sans exclure les filles.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: qui aujourd’hui ne savent pas discerner le bien du mal
  rationale: La formulation explicite avec naturel l’idiome hébreu, qui évoque l’absence de discernement mûr, sans en tirer une doctrine sur l’innocence ou la responsabilité.
- source_word: שָׁמָּה
  choice: y entreront
  rationale: L’adverbe directionnel renvoie au pays déjà mentionné. Le pronom « y » associé à « entrer » exprime idiomatiquement en français le mouvement vers ce pays.
- source_word: אֶתְּנֶנָּה
  choice: je donnerai ce pays
  rationale: Le suffixe féminin renvoie au pays. Le nommer rend le référent clair et fluide en français, tandis que לָהֶם est rendu par « à eux ».
- source_word: יִירָשׁוּהָ
  choice: ils en prendront possession
  rationale: ירשׁ exprime ici l’acquisition et l’occupation du pays promis. « Prendre possession » conserve cette nuance sans imposer exclusivement celle d’un héritage juridique.
theological_decisions:
- issue: Portée de « ne savent pas discerner le bien du mal »
  choice: Conserver l’idée d’un discernement encore immature sans définir un statut doctrinal d’innocence ou de non-responsabilité.
  alternative: Comprendre l’expression comme une affirmation explicite de non-responsabilité dans l’alliance ou comme une simple ignorance enfantine.
  rationale: L’hébreu caractérise les enfants par leur absence actuelle de discernement mûr, mais ne tranche pas à lui seul les débats théologiques ultérieurs sur l’âge de responsabilité.
- issue: Nuance de ירשׁ concernant le pays
  choice: ils en prendront possession
  alternative: ils en hériteront
  rationale: Le contexte associe don divin et entrée effective dans le pays. La formulation retenue préserve cet aspect concret, tandis qu’une note signale la nuance possible d’héritage.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe met en relief « ce sont eux » pour reproduire l’insistance du pronom hébreu הֵמָּה. « Ce pays » explicite le référent féminin des suffixes hébreux sans ajouter de contenu étranger au contexte.
