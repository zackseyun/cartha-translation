base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: fr
  text: qui marchait devant vous sur le chemin pour repérer pour vous un lieu où camper[a], dans le feu pendant la nuit, pour vous montrer le chemin que vous deviez suivre[b], et dans la nuée pendant le jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour reconnaître un lieu où camper ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour vous montrer le chemin par lequel vous iriez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: qui marchait
  rationale: Le participe qal décrit l’action continue de l’Éternel dans le récit passé et prolonge la proposition du verset précédent.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: Expression spatiale naturelle indiquant que Dieu précédait le peuple pour le guider.
- source_word: בַּדֶּרֶךְ
  choice: sur le chemin
  rationale: דֶּרֶךְ désigne ici le trajet suivi pendant la marche au désert.
- source_word: לָתוּר
  choice: chercher
  rationale: Le verbe exprime l’exploration visant à repérer un lieu convenable; « chercher » est clair et naturel, tandis que « reconnaître » demeure une possibilité plus technique.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: un endroit où établir votre camp
  rationale: Cette formulation rend naturellement le lieu destiné au campement tout en conservant la valeur finale de l’infinitif.
- source_word: בָּאֵשׁ לַיְלָה
  choice: dans le feu la nuit
  rationale: La formulation suit de près l’hébreu et maintient le parallélisme avec « dans la nuée le jour ».
- source_word: לַרְאֹתְכֶם
  choice: pour vous montrer
  rationale: 'L’infinitif hiphil de ראה a ici un sens causatif: faire voir, donc montrer.'
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: le chemin que vous deviez prendre
  rationale: Cette tournure française rend la route indiquée par Dieu sans réduire la phrase à une obligation morale.
- source_word: וּבֶעָנָן יוֹמָם
  choice: et dans la nuée le jour
  rationale: « La nuée » renvoie au signe divin connu du contexte de l’Exode; « le jour » forme le pendant naturel de « la nuit ».
theological_decisions:
- issue: Identification du sujet à partir du verset précédent
  choice: Conserver l’ouverture relative « qui marchait » sans répéter le nom de Dieu
  alternative: Ajouter « l’Éternel, qui marchait » pour rendre le sujet explicite
  rationale: L’hébreu dépend syntaxiquement de la mention de l’Éternel au verset précédent. La traduction conserve ce lien sans ajout explicatif.
- issue: Valeur de אֲשֶׁר תֵּלְכוּ בָהּ dans la direction indiquée
  choice: « que vous deviez prendre »
  alternative: « par lequel vous iriez » ou « que vous prendriez »
  rationale: L’imparfait hébreu peut exprimer le trajet à suivre. « Deviez prendre » communique la direction indiquée, sans présenter nécessairement un commandement moral.
translation_notes:
  register: Français international moderne, courant et digne. La phrase demeure liée au verset précédent, conformément à la syntaxe hébraïque. Le parallélisme « dans le feu la nuit / dans la nuée le jour » est volontairement conservé.
