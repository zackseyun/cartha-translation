source:
  edition: WLC
  text: אַחֲרֵ֣י הַכֹּת֗/וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן וְ/אֵ֗ת ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן אֲשֶׁר יוֹשֵׁ֥ב בְּ/עַשְׁתָּרֹ֖ת בְּ/אֶדְרֶֽעִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: fr
  text: après qu’il eut abattu Sihon, roi des Amoréens, qui résidait à Heshbon, et Og, roi du Bashan, qui résidait à Ashtaroth, à Édréi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « qui résidait à Ashtaroth et à Édréi ». L’hébreu introduit chacun des deux lieux par « à », sans préciser pleinement le rapport entre eux.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  choice: après qu’il eut abattu
  rationale: La construction temporelle marque une action antérieure à celle de la proposition principale du verset 3. Le passé antérieur convient après « après que » dans un registre narratif digne, et « abattre » conserve davantage la force de נכה qu’un simple « vaincre ».
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihon, roi des Amoréens
  rationale: Le nom propre est translittéré, tandis que la chaîne construite est rendue naturellement en français et maintient l’appartenance ethnique explicite.
- source_word: אֲשֶׁר יוֹשֵׁב
  choice: qui résidait
  rationale: Dans ce contexte géographique, יָשַׁב désigne le fait d’habiter ou d’avoir sa résidence. « Résidait » est actuel, clair et légèrement soutenu sans être archaïque.
- source_word: בְּחֶשְׁבּוֹן
  choice: à Heshbon
  rationale: La préposition française « à » est idiomatique avec un nom de ville.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, roi du Bashan
  rationale: La construction hébraïque désigne Og comme roi de la région du Bashan; la formulation française est directe et naturelle.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: qui résidait à Ashtaroth, à Édréi
  rationale: La répétition de « à » reflète les deux prépositions בְּ sans définir plus précisément le rapport entre les deux lieux. La note signale l’autre compréhension possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant l’ambiguïté géographique de la dernière proposition. Les noms propres suivent une translittération française sobre; l’accent d’« Édréi » guide la prononciation.
