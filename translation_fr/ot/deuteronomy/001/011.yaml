  text: יְהוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵ/כֶ֗ם יֹסֵ֧ף עֲלֵי/כֶ֛ם כָּ/כֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִ/יבָרֵ֣ךְ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: fr
  text: Que Yahweh, le Dieu de vos pères, vous rende mille fois aussi nombreux que vous l’êtes et qu’il vous bénisse, comme il vous l’a dit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Reproduit l’expression hébraïque et son lien historique avec les patriarches; « vos ancêtres » reste possible, mais serait moins formellement précis.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: vous rende mille fois plus nombreux
  rationale: Exprime naturellement en français le souhait d’un accroissement numérique au millième multiple, sans calquer l’idiome « ajouter sur vous ».
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: et qu’il vous bénisse
  rationale: Maintient explicitement la valeur optative de la bénédiction.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: comme il vous l’a dit
  rationale: Conserve le sens large de « parler/dire » sans le préciser en « promettre », interprétation possible mais plus étroite.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Désignation des générations antérieures par אֲבֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le masculin explicite et la résonance patriarcale sont conservés sans exclure la portée ancestrale de l’expression.
- issue: Portée de דִּבֶּר
  choice: il vous l’a dit
  alternative: il vous l’a promis
  rationale: Le verbe hébreu signifie littéralement « parler/dire ». Le contexte peut suggérer une promesse, mais le texte ne l’explicite pas lexicalement.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure optative « Que… » convient à une bénédiction solennelle; le point d’exclamation en marque l’élan sans surcharger le registre.
