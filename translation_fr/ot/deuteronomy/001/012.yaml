  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: fr
  text: Comment pourrais-je, à moi seul, porter vos difficultés, vos charges et vos différends[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos querelles » ou « vos procès ».
    reason: 'Alternative lexicale : רִיב peut désigner aussi bien un conflit qu’une affaire portée en justice.'
lexical_decisions:
- source_word: אֵיכָה
  choice: Comment pourrais-je
  rationale: Introduit une question rhétorique exprimant l’incapacité pratique de Moïse ; le conditionnel rend naturellement cette nuance en français.
- source_word: אֶשָּׂא
  choice: porter
  rationale: Le verbe נשׂא signifie ici assumer ou prendre en charge ; « porter » conserve l’image du poids liée aux noms qui suivent.
- source_word: לְבַדִּי
  choice: à moi seul
  rationale: Expression française naturelle qui souligne que Moïse ne peut assumer seul cette responsabilité.
- source_word: טָרְחֲכֶם
  choice: la peine que vous me causez
  rationale: טֹרַח désigne une peine, une charge pénible ou un labeur accablant. Cette formulation distingue le terme de מַשָּׂא tout en exprimant le poids que la communauté impose à Moïse.
- source_word: מַשַּׂאֲכֶם
  choice: votre fardeau
  rationale: מַשָּׂא désigne une charge ou un fardeau ; « fardeau » convient au sens abstrait et maintient la métaphore de ce que Moïse doit porter.
- source_word: רִיבְכֶם
  choice: vos différends
  rationale: רִיב peut désigner des querelles, des contestations ou des affaires judiciaires. « Différends » préserve à la fois la dimension relationnelle et la possible dimension juridique.
