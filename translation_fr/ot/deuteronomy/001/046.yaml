  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: fr
  text: Vous êtes donc restés à Qadesh de nombreux jours[a], comme les jours pendant lesquels vous y êtes restés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de nombreux jours, comme les jours pendant lesquels vous êtes restés ». La dernière expression est elliptique et difficile; elle peut indiquer une durée comparable, sans que le point de comparaison soit précisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: Vous êtes donc restés
  rationale: Le verbe ישׁב désigne ici le fait de demeurer ou de séjourner. Le passé composé convient au récit en français moderne, et « donc » marque l’enchaînement avec ce qui précède.
- source_word: בְקָדֵשׁ
  choice: à Qadesh
  rationale: Le nom de lieu est translittéré; « à » est la préposition française naturelle pour indiquer le lieu du séjour.
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: Cette formulation conserve l’image concrète de l’hébreu tout en exprimant naturellement la durée en français.
- source_word: כַיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: aussi longtemps que vous y êtes restés
  rationale: La tournure hébraïque est elliptique, littéralement « comme les jours où vous êtes restés ». La formulation française rend la comparaison de durée sans préciser davantage son référent implicite.
