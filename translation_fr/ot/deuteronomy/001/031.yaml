reference: Deuteronomy 1:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: fr
  text: et dans le désert[a], où tu as vu que Yahweh, ton Dieu, t’a porté comme un homme porte son fils[b], tout au long du chemin que vous avez parcouru jusqu’à votre arrivée en ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la région désertique ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme un homme porte son fils »; on pourrait rendre plus généralement « comme quelqu’un porte un enfant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: et dans le désert
  rationale: מִדְבָּר désigne une région inhabitée ou désertique. « Le désert » est l’expression naturelle et consacrée en français dans le récit du parcours d’Israël.
- source_word: אֲשֶׁר רָאִיתָ
  choice: où tu as vu que
  rationale: Le relatif est rattaché naturellement au désert, tandis que « que » introduit directement ce dont l’interlocuteur a été témoin.
- source_word: נְשָׂאֲךָ
  choice: t’a porté
  rationale: נשא signifie ici « porter » et prépare la comparaison explicite avec l’homme qui porte son fils.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: La deuxième personne du singulier est conservée dans l’appellation d’alliance adressée à Israël comme interlocuteur collectif.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: comme un homme porte son fils
  rationale: La formulation conserve les termes masculins explicites אִישׁ et בְּנוֹ sans renforcer « homme » en « père ».
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: tout au long du chemin
  rationale: Cette tournure française exprime naturellement la continuité de l’action pendant l’ensemble du trajet.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: que vous avez parcouru
  rationale: Le pluriel hébreu est maintenu; « parcourir un chemin » rend idiomatiquement הלך dans le contexte du voyage.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: jusqu’à votre arrivée en ce lieu
  rationale: La construction infinitive est rendue par un groupe nominal naturel, et la répétition hébraïque de עַד est exprimée sans lourdeur en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » le préserve sans lui substituer un titre.
- issue: Image familiale genrée
  choice: comme un homme porte son fils
  alternative: comme quelqu’un porte un enfant
  rationale: L’hébreu emploie explicitement « homme » et « son fils ». La traduction conserve cette image sans préciser « père », ce que le texte ne dit pas formellement.
- issue: Alternance entre le singulier et le pluriel de la deuxième personne
  choice: tu… t’a porté… vous avez parcouru… votre arrivée
  alternative: uniformiser toute l’adresse au singulier ou au pluriel
  rationale: Cette alternance reproduit le passage réel du singulier au pluriel dans l’hébreu et garde la tension entre Israël envisagé collectivement et les membres du peuple.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase commence par « et » et reste un fragment syntaxiquement lié au verset précédent, conformément à l’hébreu. L’alternance singulier-pluriel de l’adresse est volontairement conservée.
