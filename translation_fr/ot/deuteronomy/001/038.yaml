id: DEU.1.38
reference: Deuteronomy 1:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: fr
  text: Josué, fils de Noun, qui se tient devant toi, c’est lui qui y entrera. Fortifie-le, car c’est lui qui donnera ce pays en héritage à Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en fera hériter Israël » ou « le répartira entre les Israélites comme héritage ».'
    reason: Alternative lexicale pour le hiphil de נחל, qui peut exprimer le fait de faire hériter, de donner en héritage ou de répartir un héritage.
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Les formes françaises traditionnelles et largement reconnues des noms sont employées; la construction patronymique hébraïque est rendue naturellement par « fils de Noun ».
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: qui se tient devant toi
  rationale: Cette formulation conserve l’image concrète de l’hébreu sans imposer l’interprétation plus explicite « qui est à ton service ».
- source_word: הוּא יָבֹא שָׁמָּה
  choice: c’est lui qui y entrera
  rationale: Le présentatif met en relief le pronom hébreu הוּא, tandis que « y entrera » exprime le mouvement vers l’intérieur du pays déjà mentionné.
- source_word: אֹתוֹ חַזֵּק
  choice: Fortifie-le
  rationale: Le verbe חזק peut inclure l’idée de rendre fort et celle d’encourager. « Fortifie-le » garde cette amplitude dans un registre digne et intelligible.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’ordre donné à Moïse.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: c’est lui qui donnera ce pays en héritage à Israël
  rationale: Le hiphil de נחל exprime le fait de faire hériter ou de donner en héritage. « Ce pays » explicite le référent contextuel du suffixe féminin, et la tournure française demeure naturelle.
theological_decisions:
- issue: Référent du suffixe féminin dans יַנְחִלֶנָּה
  choice: Le suffixe est explicité par « ce pays », c’est-à-dire le pays promis à Israël.
  alternative: Laisser le complément pronominal implicite ou traduire « il en fera hériter Israël ».
  rationale: Le contexte immédiat porte sur l’entrée dans le pays et sa possession. L’explicitation clarifie le pronom hébreu sans ajouter d’affirmation théologique étrangère au texte.
- issue: Portée du rôle de Josué dans l’héritage du pays
  choice: « donnera ce pays en héritage à Israël »
  alternative: « en fera hériter Israël » ou « le répartira entre les Israélites »
  rationale: La formulation principale préserve la valeur causative du verbe sans préciser indûment si l’action désigne surtout la conquête, la prise de possession ou la répartition du territoire.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement est conservé puisque Dieu s’adresse personnellement à Moïse. La répétition de « c’est lui qui » reflète l’insistance des deux emplois du pronom הוּא.
