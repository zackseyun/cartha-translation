  text: וְ/אַתֶּ֖ם פְּנ֣וּ לָ/כֶ֑ם וּ/סְע֥וּ הַ/מִּדְבָּ֖רָ/ה דֶּ֥רֶךְ יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: fr
  text: Mais vous, faites demi-tour et partez vers le désert par la route de la mer Rouge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « mer des Roseaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mais vous
  rationale: La conjonction suivie du pronom indépendant met les destinataires en relief et marque le contraste avec le jugement énoncé précédemment.
- source_word: פְּנוּ לָכֶם
  choice: faites demi-tour
  rationale: L’impératif exprime ici un changement concret de direction; לָכֶם renforce l’ordre adressé aux destinataires. « Faites demi-tour » rend naturellement l’ensemble en français.
- source_word: וּ/סְעוּ
  choice: partez
  rationale: Le verbe נסע désigne couramment le fait de lever le camp et de se mettre en route. « Partez » est naturel et convient à l’impératif de déplacement.
- source_word: הַמִּדְבָּרָה
  choice: vers le désert
  rationale: Le ה directionnel indique un mouvement en direction du désert sans imposer plus précisément l’idée d’y entrer.
- source_word: דֶּרֶךְ
  choice: par la route de
  rationale: דֶּרֶךְ introduit ici l’itinéraire à suivre; « par la route de » conserve clairement cette valeur.
- source_word: יַם סוּף
  choice: la mer Rouge
  rationale: « Mer Rouge » est l’appellation géographique traditionnelle et immédiatement compréhensible en français; la traduction plus littérale est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « faites demi-tour » restitue le changement de direction de façon idiomatique, tandis que « par la route de » préserve la notion d’itinéraire.
