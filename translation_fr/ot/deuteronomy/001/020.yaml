id: DEU.1.20
reference: Deuteronomy 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: fr
  text: 'Alors je vous ai dit : « Vous êtes arrivés dans la région montagneuse[a] des Amorites, que Yahweh notre Dieu nous donne. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la montagne des Amorites ». Le mot hébreu peut désigner une montagne particulière ou, plus largement, une région montagneuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: Alors je vous ai dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » rend naturellement cet enchaînement, et « vous » correspond au pronom masculin pluriel.
- source_word: בָּאתֶם עַד
  choice: Vous êtes arrivés dans
  rationale: Le parfait de בוא présente l’arrivée comme accomplie, avec une pertinence immédiate. Avec une région, « arriver dans » est plus idiomatique en français que « venir jusqu’à », sans perdre l’idée du point atteint.
- source_word: הַר הָאֱמֹרִי
  choice: la région montagneuse des Amorites
  rationale: הַר peut désigner un massif ou, plus largement, une zone de relief. Dans ce contexte géographique, « région montagneuse » est clair et naturel. Le gentilé singulier avec article a une valeur collective, rendue par « des Amorites ».
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif introduit la proposition qui qualifie la région montagneuse.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh notre Dieu
  rationale: Le nom divin est translittéré « Yahweh », tandis que le suffixe de première personne du pluriel est rendu directement par « notre ».
- source_word: נֹתֵן לָנוּ
  choice: nous donne
  rationale: Le participe exprime ici une action en cours ou imminente. Le présent français garde cette actualité et convient naturellement à la promesse du territoire en train d’être accordé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Aspect de נֹתֵן dans le don du territoire
  choice: nous donne
  alternative: va nous donner
  rationale: Le présent français préserve la tension du participe hébreu entre don actuel et réalisation imminente, sans réduire le propos à un futur seulement.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient au discours rétrospectif de Moïse; le présent « nous donne » maintient l’actualité du don. La note conserve l’étendue sémantique de הַר sans alourdir le texte principal.
