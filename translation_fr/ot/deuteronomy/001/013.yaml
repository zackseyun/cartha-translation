base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: fr
  text: Choisissez pour vous, dans vos tribus, des hommes sages, intelligents et reconnus, et je les établirai à votre tête[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme vos chefs ». Littéralement, l’hébreu emploie l’image des « têtes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Choisissez parmi vous
  rationale: Dans ce contexte, l’impératif demande au peuple de désigner lui-même des candidats. « Parmi vous » exprime naturellement à la fois l’implication du peuple et le milieu dont ils sont issus.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom hébreu est explicitement masculin pluriel et désigne ici les futurs responsables de la structure tribale d’Israël.
- source_word: חֲכָמִים
  choice: sages
  rationale: Dans un contexte de gouvernement et de jugement, le terme évoque la sagesse pratique et la justesse de décision.
- source_word: וּנְבֹנִים
  choice: perspicaces
  rationale: Le mot désigne la capacité de comprendre, de discerner et de porter un jugement avisé.
- source_word: וִידֻעִים
  choice: reconnus
  rationale: Le participe passif de ידע indique vraisemblablement des hommes connus et agréés par leur communauté, c’est-à-dire jouissant d’une réputation établie.
- source_word: לְשִׁבְטֵיכֶם
  choice: dans vos tribus
  rationale: La préposition peut marquer ici la sphère tribale dans laquelle ces hommes sont connus et parmi laquelle ils sont choisis; cette formulation française laisse subsister cette relation sans la réduire à la seule provenance.
- source_word: וַאֲשִׂימֵם
  choice: je les établirai
  rationale: Dans cette suite conditionnelle implicite, Moïse annonce l’acte officiel qu’il accomplira après la sélection du peuple.
- source_word: בְּרָאשֵׁיכֶם
  choice: à votre tête
  rationale: Cette expression française naturelle conserve l’image hébraïque de la « tête » tout en indiquant clairement une fonction de direction.
theological_decisions:
- issue: Terme masculin אֲנָשִׁים pour les responsables tribaux
  choice: des hommes
  alternative: des personnes
  rationale: Le texte hébreu emploie un nom masculin pluriel dans le cadre historique des responsables tribaux; le rendre au masculin préserve cette donnée sans ajouter de conclusion doctrinale.
- issue: Participation du peuple et nomination par Moïse
  choice: Le peuple choisit les candidats, puis Moïse les établit
  alternative: Moïse choisit et nomme seul les responsables
  rationale: La succession des verbes distingue l’action demandée au peuple de l’installation officielle accomplie par Moïse.
translation_notes:
  register: Français international moderne, clair et digne. « Perspicaces » distingue la compréhension judicieuse de la sagesse; « reconnus » rend la réputation établie. La métaphore de la tête est conservée sous une forme idiomatique française.
