source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: fr
  text: Je vous ai donc parlé, mais vous n’avez pas écouté. Vous vous êtes rebellés contre l’ordre de Yahweh[a], vous avez agi avec présomption et vous êtes montés dans la région montagneuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « contre la bouche de Yahweh », c’est-à-dire contre ce que Yahweh avait ordonné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Je vous ai donc parlé
  rationale: Le verbe piel de דבר signifie « parler ». « Donc » restitue naturellement l’enchaînement consécutif avec le verset précédent, tandis que « vous » désigne le groupe sans qu’il soit nécessaire d’expliciter le pluriel.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mais vous n’avez pas écouté
  rationale: שׁמע peut exprimer l’écoute ou l’obéissance. Ici, « écouté » maintient cette amplitude sémantique sans anticiper la rébellion explicitement nommée dans la proposition suivante.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: Vous vous êtes rebellés contre l’ordre de Yahweh
  rationale: מרה indique la rébellion ou la défiance envers une autorité. L’expression littérale « la bouche de Yahweh » désigne idiomatiquement ce qu’il a ordonné ; « l’ordre » rend ce sens clairement en français moderne.
- source_word: וַתָּזִדוּ
  choice: vous avez agi avec présomption
  rationale: זיד décrit une conduite présomptueuse, arrogante ou insolente. Cette formulation conserve la nuance morale sans fusionner le verbe avec l’action de monter qui suit.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: vous êtes montés dans la région montagneuse
  rationale: עלה exprime le mouvement ascendant, et la finale directive de הָהָרָה marque le déplacement vers la zone montagneuse. « Région montagneuse » convient mieux ici qu’une montagne isolée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin personnel. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de l’expression אֶת־פִּי יְהוָה
  choice: contre l’ordre de Yahweh
  alternative: contre la bouche de Yahweh
  rationale: Littéralement « la bouche de Yahweh », l’expression renvoie ici à ce que Yahweh avait commandé. Le texte principal donne le sens idiomatique, tandis que la note préserve l’image hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient au récit adressé directement au peuple. La répétition de « vous » maintient la progression accusatrice du texte hébreu sans alourdir excessivement la phrase.
