  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: fr
  text: Il y a onze jours de marche depuis l’Horeb jusqu’à Qadesh-Barnéa, par la route du mont Séïr[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « onze jours ». L’expression hébraïque indique la durée du trajet entre l’Horeb et Qadesh-Barnéa par cet itinéraire.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu emploie ici le nom Horeb, souvent associé au Sinaï.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: onze jours de marche
  rationale: L’expression hébraïque, littéralement « onze jours », indique ici la durée du trajet. « Onze jours de marche » en restitue naturellement le sens sans transformer la durée en distance précise.
- source_word: מֵחֹרֵב
  choice: depuis l’Horeb
  rationale: חֹרֵב est le nom propre Horeb. Le conserver respecte le texte hébreu, plutôt que de lui substituer Sinaï.
- source_word: דֶּרֶךְ
  choice: par la route de
  rationale: דֶּרֶךְ désigne le chemin ou l’itinéraire emprunté. « Par la route de » convient au contexte géographique et reste clair en français courant.
- source_word: הַר שֵׂעִיר
  choice: du mont Séïr
  rationale: הַר peut désigner une montagne ou une région montagneuse. « Mont Séïr » est une désignation concise et traditionnelle qui convient ici comme nom d’itinéraire.
- source_word: עַד
  choice: jusqu’à
  rationale: Dans ce contexte géographique, עַד marque le point d’arrivée. « Jusqu’à » conserve plus explicitement cette valeur que le simple « à ».
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Qadesh-Barnéa
  rationale: Le nom de lieu composé est translittéré sous une forme française courante et lisible, avec un trait d’union.
