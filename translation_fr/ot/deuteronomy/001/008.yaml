  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: fr
  text: 'Regarde[a] : j’ai placé le pays devant vous. Entrez-y et prenez possession[b] du pays que Yahweh a juré à vos pères[c] — à Abraham, à Isaac et à Jacob — de leur donner, à eux et à leur descendance[d] après eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici un impératif au singulier : « Vois » ou « Regarde », alors que les verbes suivants s’adressent au peuple au pluriel.'
    reason: grammatical_clarification
  - marker: b
    text: Ou « possédez »; le verbe hébreu peut aussi évoquer l’entrée en possession d’un héritage.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « vos pères »; il s’agit ici d’Abraham, d’Isaac et de Jacob.
    reason: referent_clarification
  - marker: d
    text: Littéralement « leur semence », terme collectif qui désigne leur descendance.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Regarde
  rationale: L’impératif hébreu est au singulier et appelle fortement l’attention. « Regarde » en conserve le nombre et la force dans un français actuel.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: j’ai placé le pays devant vous
  rationale: Dans cette construction avec לִפְנֵי, נתן exprime la mise à disposition ou le fait de placer quelque chose devant quelqu’un. Le passé composé rend l’accompli dont le résultat demeure présent.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Ici, אֶרֶץ désigne le territoire promis. « Le pays » est idiomatique en français et convient à un territoire où le peuple doit entrer.
- source_word: בֹּאוּ
  choice: Entrez-y
  rationale: L’impératif pluriel appelle le peuple à pénétrer dans le pays. Le pronom « y » explicite naturellement en français la direction déjà donnée par le contexte.
- source_word: וּרְשׁוּ
  choice: prenez possession
  rationale: Dans ce contexte, ירשׁ désigne l’action d’entrer en possession du territoire promis; le verbe peut aussi évoquer le fait de posséder ou de recevoir en héritage.
- source_word: נִשְׁבַּע יְהוָה
  choice: Yahweh a juré
  rationale: Le texte emploie directement le nom divin יהוה. « A juré » rend simplement le verbe d’engagement solennel.
- source_word: לַאֲבֹתֵיכֶם
  choice: à vos pères
  rationale: Le terme masculin pluriel renvoie ici précisément à Abraham, Isaac et Jacob, nommés aussitôt après.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: La répétition de « à » reproduit le rythme et l’insistance de l’hébreu tout en restant naturelle en français.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: de leur donner, à eux et à leur descendance après eux
  rationale: 'Cette formulation maintient les deux bénéficiaires explicitement distingués en hébreu: les pères eux-mêmes et leur descendance. « Descendance » rend le collectif זרע sans l’ambiguïté courante de « semence ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le rend directement, sans le remplacer par un titre.
- issue: Portée de אֲבֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le verset identifie explicitement ces « pères » comme Abraham, Isaac et Jacob; le masculin précis du texte n’est donc pas neutralisé.
- issue: Bénéficiaires de la promesse
  choice: à eux et à leur descendance après eux
  alternative: à leurs descendants
  rationale: L’hébreu distingue les patriarches (« à eux ») de leur descendance. La traduction conserve cette tension entre la promesse faite aux pères et son prolongement après eux.
translation_notes:
  register: Français international actuel, digne et accessible. Le singulier initial « Regarde » est volontairement conservé malgré le passage immédiat au pluriel « vous », afin de respecter l’alternance grammaticale du texte hébreu. Les tirets mettent en valeur l’identification des pères sans alourdir la phrase.
