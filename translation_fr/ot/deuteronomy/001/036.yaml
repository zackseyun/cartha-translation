source:
  edition: WLC
  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: fr
  text: sauf Caleb, fils de Jephunné. Lui, il le verra, et je lui donnerai, ainsi qu’à ses fils[a], le pays où il a posé le pied, parce qu’il a suivi Yahweh sans réserve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ses enfants » ou « à ses descendants » ; littéralement « à ses fils ».
    reason: Précise le sens littéral du terme hébreu et sa portée collective possible dans un contexte d’héritage.
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: sauf
  rationale: Introduit directement l’exception au jugement énoncé dans le contexte précédent; « sauf » est naturel et concis en français moderne.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: Caleb, fils de Yefounné
  rationale: Emploie les formes françaises usuelles des noms propres et explicite naturellement la filiation.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: Lui, il le verra
  rationale: Le pronom indépendant הוּא met Caleb en relief. Le pronom français masculin « le » reprend « le pays » dans le contexte.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: et je lui donnerai
  rationale: Conserve la promesse à la première personne et le bénéficiaire mis en avant par la construction hébraïque.
- source_word: אֶת הָאָ֛רֶץ
  choice: le pays
  rationale: « Pays » désigne naturellement ici le territoire promis, sans ajouter une interprétation absente du texte.
- source_word: אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: où il a posé le pied
  rationale: Rend l’image concrète du verbe דרך, « fouler, marcher », par une expression française actuelle et idiomatique.
- source_word: וּלְבָנָ֑יו
  choice: ainsi qu’à ses fils
  rationale: Préserve le masculin pluriel explicite de l’hébreu, tout en signalant en note la portée collective possible dans un contexte d’héritage.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: parce que
  rationale: Exprime clairement et simplement le motif de la promesse.
- source_word: מִלֵּ֖א אַחֲרֵ֥י
  choice: a suivi … sans réserve
  rationale: Rend le sens idiomatique de l’expression hébraïque, qui évoque une adhésion entière, sans reproduire littéralement l’image opaque de « remplir derrière ».
- source_word: יְהוָֽה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé directement par le tétragramme.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Portée de בָּנָיו
  choice: ses fils
  alternative: ses enfants; ses descendants
  rationale: Le terme hébreu est morphologiquement masculin pluriel. La traduction principale le conserve, tandis que la note reconnaît qu’il peut viser plus largement la descendance dans ce contexte d’héritage.
- issue: Force de מִלֵּא אַחֲרֵי יהוה
  choice: il a suivi Yahweh sans réserve
  alternative: il a pleinement suivi Yahweh; il a suivi Yahweh de tout son cœur
  rationale: « Sans réserve » communique l’idée d’un engagement entier sans ajouter la notion de « cœur », absente de ce verset.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure détachée « Lui, il le verra » conserve l’insistance hébraïque sur Caleb. L’expression « poser le pied » maintient l’image concrète tout en restant naturelle.
