  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: fr
  text: La quarantième année, le premier jour du onzième mois, Moïse parla aux fils d’Israël conformément à tout ce que Yahweh lui avait ordonné à leur intention.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu porte : « lui avait ordonné à eux »; la construction peut aussi se comprendre : « lui avait ordonné à leur sujet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La quarantième année…
  rationale: Dans cette formule narrative et chronologique, le français naturel peut intégrer וַיְהִי à la proposition datée sans recourir au calque lourd « il arriva que ».
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: La quarantième année
  rationale: Le cardinal hébreu sert ici à désigner l’année numéro quarante; l’ordinal est l’équivalent idiomatique français.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du onzième mois
  rationale: Rend clairement et naturellement la formule calendaire hébraïque, tout en conservant l’ordre des deux indications internes à la date.
- source_word: דִּבֶּר
  choice: parla
  rationale: Traduction simple et non interprétative de דבר dans ce contexte.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Conserve l’expression familiale masculine du texte hébreu; « aux Israélites » serait une formulation française plus générale.
- source_word: כְּכֹל אֲשֶׁר
  choice: conformément à tout ce que
  rationale: Exprime la conformité marquée par כְּ tout en restant idiomatique en français.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique naturellement que l’ordre de Yahweh précède la prise de parole de Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte source au lieu de le remplacer par un titre.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: lui avait ordonné à leur intention
  rationale: La construction hébraïque est condensée. Cette formulation garde Moïse comme destinataire de l’ordre et Israël comme destinataire visé, sans produire le français obscur « lui avait ordonné à eux ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: Rapport syntaxique de אֹתוֹ אֲלֵהֶם
  choice: lui avait ordonné à leur intention
  alternative: lui avait ordonné à leur sujet
  rationale: L’hébreu permet une nuance de destination ou de référence. Le texte principal exprime la destination vers Israël, tandis que la note conserve l’autre possibilité sans trancher excessivement.
translation_notes:
  register: Français international moderne, sobre et digne. La date est formulée selon l’usage français, sans le calque narratif « et il arriva ». « Fils d’Israël » conserve la forme hébraïque; la note porte uniquement sur la construction finale réellement ambiguë.
