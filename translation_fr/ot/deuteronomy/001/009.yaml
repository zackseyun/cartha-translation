  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: fr
  text: 'En ce temps-là, je vous ai dit : « Je ne peux pas, à moi seul, vous porter. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: En ce temps-là
  rationale: Rend naturellement l’expression temporelle hébraïque tout en conservant sa valeur de rappel narratif.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Après un verbe de parole, l’infinitif hébreu introduit ici le discours direct. En français moderne, les deux-points remplissent naturellement cette fonction; traduire par « en disant » serait lourd et redondant.
- source_word: לֹא אוּכַל
  choice: Je ne peux pas
  rationale: Conserve l’affirmation d’incapacité exprimée par le verbe hébreu à l’imparfait, dans un français direct.
- source_word: לְבַדִּי
  choice: à moi seul
  rationale: Exprime avec netteté l’idée que Moïse ne peut assumer seul cette charge.
- source_word: שְׂאֵת אֶתְכֶם
  choice: vous porter
  rationale: Préserve la métaphore hébraïque du port d’un peuple, laquelle désigne ici la responsabilité de le conduire et d’en supporter la charge.
theological_decisions:
- issue: Portée de la métaphore « porter »
  choice: Conserver « vous porter »
  alternative: « assumer votre charge » ou « m’occuper de vous »
  rationale: Le sens administratif et pastoral ressort du contexte, mais le verbe source reste métaphorique. Le conserver évite de réduire sa richesse ou de préciser excessivement la nature de la responsabilité.
translation_notes:
  register: Français moderne, sobre et digne. L’ordre de la phrase est légèrement naturalisé. Le discours direct est introduit par deux-points plutôt que par le calque « en disant », sans perte de contenu propositionnel.
