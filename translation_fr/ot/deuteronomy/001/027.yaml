source:
  edition: WLC
  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: fr
  text: 'Vous avez maugréé dans vos tentes et vous avez dit : « C’est parce que Yahweh nous hait qu’il nous a fait sortir du pays d’Égypte, afin de nous livrer aux Amorites[a] et de nous détruire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour nous donner dans la main de l’Amorite »; « l’Amorite » désigne ici collectivement les Amorites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: vous avez maugréé
  rationale: Le verbe רגן évoque des plaintes exprimées à voix basse avec mécontentement. « Maugréer » conserve cette nuance mieux que le terme plus général « se plaindre ».
- source_word: בְאָהֳלֵיכֶם
  choice: dans vos tentes
  rationale: Traduction locative directe qui maintient le cadre concret du séjour au désert.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: C’est parce que Yahweh nous hait
  rationale: La préposition בְּ avec le nom abstrait « haine » a ici une valeur causale. Cette formulation française naturelle présente bien l’accusation formulée par le peuple, sans l’endosser comme vraie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: il nous a fait sortir du pays d’Égypte
  rationale: « Faire sortir » reflète la forme causative du verbe, tandis que « du pays d’Égypte » rend explicitement אֶרֶץ מִצְרָיִם.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: afin de nous livrer aux Amorites
  rationale: L’expression littérale « donner dans la main de » signifie remettre au pouvoir d’un adversaire. « Livrer aux Amorites » en restitue clairement le sens en français moderne.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier morphologique fonctionne collectivement et désigne ici le peuple amorite.
- source_word: לְהַשְׁמִידֵנוּ
  choice: et de nous détruire
  rationale: Le hifil de שׁמד exprime la destruction. « Détruire » est fort et exact sans ajouter une précision absente du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le Tétragramme; « Yahweh » préserve sa fonction de nom propre.
- issue: Statut de l’affirmation selon laquelle Yahweh hait Israël
  choice: conserver l’accusation dans le discours direct
  alternative: reformuler pour atténuer ou corriger l’accusation
  rationale: Le verset rapporte les paroles du peuple. La traduction doit préserver leur accusation théologiquement tendue sans la présenter comme une affirmation du narrateur ni la corriger silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Maugréé » garde la nuance de plainte mécontente et à demi-voix; « livrer aux Amorites » évite un calque peu naturel tout en documentant l’image hébraïque en note.
