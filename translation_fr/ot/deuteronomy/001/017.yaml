  variant: modern international French
source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: fr
  text: Vous ne ferez pas preuve de partialité dans le jugement[a] ; vous entendrez le petit comme le grand. Vous ne vous laisserez intimider par personne[b], car le jugement appartient à Dieu. L’affaire qui sera trop difficile pour vous, vous me la soumettrez, et je l’entendrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Vous ne reconnaîtrez pas les visages dans le jugement », expression hébraïque qui signifie favoriser quelqu’un ou faire preuve de partialité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Vous n’aurez peur de personne. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: faire preuve de partialité
  rationale: L’expression signifie littéralement « reconnaître des visages », mais désigne ici le favoritisme dans l’exercice de la justice. La formulation française est claire et conserve la portée judiciaire et morale.
- source_word: בַּמִּשְׁפָּט
  choice: dans le jugement
  rationale: מִשְׁפָּט désigne ici l’activité judiciaire et la décision rendue, non la seule notion abstraite de justice.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: le petit comme le grand
  rationale: La paire oppose les personnes de condition modeste aux personnes importantes. Cette tournure concise conserve l’image et le contraste social de l’hébreu.
- source_word: תִּשְׁמָעוּן
  choice: vous écouterez
  rationale: Dans ce contexte judiciaire, שׁמע signifie entendre les parties ou leur cause. « Écouter » est naturel en français et garde le lien avec l’audition d’une affaire.
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  choice: vous ne vous laisserez intimider par personne
  rationale: Le verbe exprime ici le fait de reculer par crainte devant quelqu’un. « Se laisser intimider » rend bien cette pression dans un cadre judiciaire, tandis que « personne » restitue naturellement la portée générique de אִישׁ.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: car le jugement appartient à Dieu
  rationale: La formulation préserve directement l’affirmation selon laquelle l’autorité judiciaire relève de Dieu, sans préciser davantage le mécanisme de cette appartenance.
- source_word: הַדָּבָר
  choice: l’affaire
  rationale: Dans le contexte, דָּבָר désigne une affaire portée devant les juges. « Affaire » est idiomatique en français juridique sans surtraduire.
- source_word: אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: qui sera trop difficile pour vous
  rationale: L’expression indique une affaire dépassant la capacité des juges à la résoudre. Le futur respecte la forme verbale et la portée prospective de l’instruction.
- source_word: תַּקְרִבוּן אֵלַי
  choice: vous me la soumettrez
  rationale: Le hiphil de קרב signifie faire approcher ou présenter. Dans un contexte judiciaire, « soumettre une affaire » est naturel et précis.
- source_word: וּשְׁמַעְתִּיו
  choice: et je l’examinerai
  rationale: Le suffixe renvoie très probablement à l’affaire. Ici, שׁמע désigne le fait d’entendre et d’examiner la cause ; « examiner » évite en français l’expression moins naturelle « écouter une affaire » sans aller jusqu’à « trancher », qui surtraduirait.
theological_decisions:
- issue: Fondement de l’autorité judiciaire dans « le jugement appartient à Dieu »
  choice: Conserver l’affirmation directe que le jugement appartient à Dieu.
  alternative: Expliciter que Dieu jugera les juges ou que ceux-ci appliquent exclusivement la loi divine.
  rationale: L’hébreu affirme l’appartenance du jugement à Dieu, mais ne développe pas ici toutes les implications doctrinales. La traduction préserve cette densité et cette tension.
- issue: Portée générique de אִישׁ
  choice: Rendre par « personne » dans la locution française « intimider par personne ».
  alternative: « par aucun homme » ou « devant un homme »
  rationale: Dans ce contexte, אִישׁ a une portée générique. « Personne » transmet exactement l’interdiction universelle en français moderne, sans faire croire que seules les pressions exercées par des hommes de sexe masculin sont visées.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme injonctif du discours juridique est conservé. « Le petit comme le grand » maintient l’image sociale de l’hébreu ; les formulations « soumettre une affaire » et « l’examiner » assurent un français judiciaire naturel sans rendre explicite une décision finale que le texte ne formule pas.
