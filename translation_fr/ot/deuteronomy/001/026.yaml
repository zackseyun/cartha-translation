  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: fr
  text: Mais vous n’avez pas voulu monter et vous vous êtes rebellés contre l’ordre de Yahweh, votre Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « vous vous êtes rebellés contre la bouche de Yahweh, votre Dieu », expression qui signifie résister à son ordre ou le défier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: Mais vous n’avez pas voulu
  rationale: La conjonction prend ici naturellement une valeur adversative, tandis que la tournure négative d’אבה conserve la nuance de volonté plutôt que de se réduire au seul fait d’un refus.
- source_word: לַעֲלֹת
  choice: monter
  rationale: Le verbe עלה exprime un mouvement ascendant; « monter » est naturel en français et garde cette orientation.
- source_word: וַתַּמְרוּ
  choice: vous vous êtes rebellés
  rationale: מרה désigne la rébellion ou la défiance envers une autorité; la forme pronominale est idiomatique en français.
- source_word: אֶת־פִּי
  choice: contre l’ordre
  rationale: Littéralement « contre la bouche », cette expression hébraïque désigne la parole autoritative ou l’ordre donné; « l’ordre » en transmet clairement le sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Associé à Yahweh et au suffixe de deuxième personne du pluriel, אֱלֹהִים a ici un sens singulier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; sa translittération conserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens de la rébellion « contre la bouche » de Dieu
  choice: contre l’ordre de Yahweh
  alternative: contre la bouche de Yahweh
  rationale: La formulation littérale est un idiome hébreu portant sur l’insoumission à une parole autoritative. Le rendu choisi transmet ce sens sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. « Monter » conserve l’image spatiale; « vous n’avez pas voulu » maintient la nuance volitive du texte. Le marqueur de note est placé après la proposition qu’il explique.
