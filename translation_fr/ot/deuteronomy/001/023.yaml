  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: fr
  text: La proposition me parut bonne[a]. Je pris donc parmi vous douze hommes, un homme par tribu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La chose fut bonne à mes yeux. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: me parut bonne
  rationale: Cette tournure française naturelle rend l’évaluation personnelle exprimée par l’idiome hébreu « fut bon à mes yeux », sans alourdir le texte.
- source_word: הַדָּבָר
  choice: la proposition
  rationale: Dans le contexte immédiat, דָּבָר désigne l’idée qui vient d’être avancée. « Proposition » précise naturellement le référent sans en modifier le sens.
- source_word: וָאֶקַּח
  choice: je pris
  rationale: « Prendre » correspond au sens direct de לקח et reste clair ici pour désigner le choix des hommes au sein du peuple.
- source_word: מִכֶּם
  choice: parmi vous
  rationale: Cette expression rend naturellement l’idée d’une sélection effectuée au sein du groupe auquel Moïse s’adresse.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: douze hommes
  rationale: Le syntagme hébreu désigne explicitement douze hommes adultes.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: un homme par tribu
  rationale: 'La formulation concise « par tribu » exprime clairement la valeur distributive de l’hébreu : un représentant pour chacune des tribus.'
