  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: fr
  text: Yahweh, votre Dieu, vous a rendus nombreux. Et vous voici aujourd’hui aussi nombreux que les étoiles du ciel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans ce contexte d’alliance, אֱלֹהִים désigne le Dieu d’Israël au singulier, et le suffixe de deuxième personne du pluriel est rendu par « votre ».
- source_word: הִרְבָּה אֶתְכֶם
  choice: vous a rendus nombreux
  rationale: Le hiphil de רבה exprime l’action de rendre nombreux ou de multiplier. Cette formulation est naturelle en français et conserve la valeur causative.
- source_word: וְהִנְכֶם
  choice: Et vous voici
  rationale: « Voici » restitue la valeur déictique de הִנֵּה avec le suffixe, qui attire l’attention sur la situation présente.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français direct et actuel de l’adverbe temporel.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: aussi nombreux que les étoiles du ciel
  rationale: Rend idiomatiquement la comparaison et la notion de multitude portée par לָרֹב, sans reproduire une tournure hébraïque lourde en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La division en deux phrases conserve l’accent rhétorique de וְהִנְכֶם. Aucun appel de note n’est nécessaire, car la relation entre לָרֹב et la comparaison est rendue clairement et sans effacer d’ambiguïté substantielle.
