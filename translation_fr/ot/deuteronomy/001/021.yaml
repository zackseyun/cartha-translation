source:
  edition: WLC
  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: fr
  text: 'Vois : Yahweh ton Dieu a placé le pays devant toi. Monte, prends-en possession, comme Yahweh, le Dieu de tes pères, te l’a dit. N’aie pas peur et ne te laisse pas abattre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne sois pas terrifié » ou « ne sois pas découragé ». Le verbe hébreu peut évoquer le fait d’être brisé, démoralisé ou saisi de terreur.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Vois
  rationale: Impératif singulier servant à attirer l’attention. « Vois » conserve la force directe de l’hébreu dans un registre digne, sans l’archaïsme de « Voici ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier correspond à l’adresse collective à Israël personnifié au singulier.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: a placé ... devant toi
  rationale: Rend l’image de ce que Dieu met à la portée d’Israël, tout en conservant explicitement « devant toi ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le mot désigne le territoire promis à Israël. « Pays » est naturel en français et évite que « terre » soit compris comme le sol ou la planète.
- source_word: עֲלֵה
  choice: Monte
  rationale: Conserve le mouvement ascendant vers la région montagneuse et fonctionne naturellement comme ordre dans le contexte.
- source_word: רֵשׁ
  choice: prends-en possession
  rationale: L’impératif de ירשׁ exprime ici l’entrée active en possession du pays accordé par Dieu. Le pronom « en » reprend naturellement « le pays ».
- source_word: כַּאֲשֶׁר דִּבֶּר ... לָךְ
  choice: comme ... te l’a dit
  rationale: Rend simplement le verbe « parler/dire » sans expliciter en « promettre » ce qui reste implicite dans le contexte.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: le Dieu de tes pères
  rationale: Préserve la formulation d’alliance explicitement masculine de l’hébreu.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Équivalent français actuel et direct de l’interdiction exprimée par ירא.
- source_word: וְאַל תֵּחָת
  choice: et ne te laisse pas abattre
  rationale: חתת évoque le fait d’être brisé intérieurement, démoralisé ou terrifié. Cette tournure française distingue cette idée de la peur déjà mentionnée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le nom personnel de Dieu. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Formule אֱלֹהֵי אֲבֹתֶיךָ
  choice: le Dieu de tes pères
  alternative: le Dieu de tes ancêtres
  rationale: L’hébreu dit littéralement « tes pères » dans une formule d’alliance. Le texte principal conserve cette forme, tandis qu’une note indique l’élargissement sémantique possible.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël considéré collectivement. La coordination finale conserve les deux interdictions distinctes du texte source.
