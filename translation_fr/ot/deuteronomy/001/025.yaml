  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: fr
  text: 'Ils prirent avec eux[a] quelques fruits du pays et nous les apportèrent d’en haut. Puis ils nous firent leur rapport et dirent : « Le pays que Yahweh notre Dieu nous donne est bon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans leurs mains ».
    reason: Préserve l’image concrète de l’expression hébraïque, rendue de façon idiomatique par « avec eux ».
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: Ils prirent dans leurs mains
  rationale: Conserve l’image concrète de l’hébreu tout en restant intelligible en français.
- source_word: מִפְּרִי הָאָרֶץ
  choice: quelques fruits du pays
  rationale: 'Exprime la valeur partitive de מִן : il s’agit d’un échantillon des produits du pays.'
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: nous les rapportèrent
  rationale: Le hiphil de ירד signifie littéralement « faire descendre ». En français, « rapportèrent » rend naturellement le mouvement vers le groupe, tandis qu’une note conserve la nuance directionnelle.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: ils nous firent un rapport
  rationale: Rend naturellement l’expression idiomatique désignant le fait de revenir avec une information et de la communiquer.
- source_word: טוֹבָה הָאָרֶץ
  choice: Le pays … est bon
  rationale: « Bon » conserve l’évaluation positive, large et non spécialisée de טוֹבָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement la formule relationnelle et covenantale de l’hébreu.
- source_word: נֹתֵן לָנוּ
  choice: nous donne
  rationale: Le présent français rend bien le participe hébreu, qui présente le don comme actuel ou en cours.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Temporalité du don du pays
  choice: nous donne
  alternative: va nous donner
  rationale: Le présent maintient la force du participe נֹתֵן et présente le don divin comme une réalité actuelle, sans le réduire à un futur seulement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement allégée pour éviter un calque hébraïque maladroit, tout en conservant l’image des fruits pris « dans leurs mains » et le présent du don divin.
