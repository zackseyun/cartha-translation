    rationale: « Nous les rapportèrent » indique le retour vers le destinataire, mais non le « faire descendre » du hiphil de ירד. « Nous les apportèrent d’en haut » conserve naturellement cette composante.
  - severity: low
    issue: L’expression « prirent dans leurs mains quelques fruits » est maladroite en français moderne.
    rationale: La construction est un calque peu naturel. « Prirent avec eux » est idiomatique, tandis qu’une note peut préserver le libellé concret de l’hébreu.
  - severity: low
    issue: La note directionnelle annoncée dans la décision lexicale est absente.
    rationale: Une note sur « avec eux » documente ici l’idiome littéral retenu de façon non calquée; la direction descendante est désormais intégrée au texte.
