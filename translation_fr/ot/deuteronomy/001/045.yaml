base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: fr
  text: Puis vous êtes revenus et vous avez pleuré devant Yahweh, mais Yahweh n’a pas écouté votre voix et ne vous a pas prêté attention.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’a pas entendu votre voix et ne vous a pas prêté l’oreille ». L’hébreu emploie deux verbes presque parallèles liés à l’écoute, soulignant que Yahweh n’a pas répondu à leur supplication.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Puis vous êtes revenus
  rationale: שׁוּב signifie « revenir, retourner ». Ici, le verbe décrit le retour qui suit l’attaque manquée, tandis que « puis » rend la progression narrative du waw consécutif.
- source_word: וַתִּבְכּוּ
  choice: et vous avez pleuré
  rationale: בכה signifie « pleurer ». Cette formulation garde le ton solennel sans ajouter une intensité absente de l’hébreu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la position ou l’action « devant, en présence de ». « Devant Yahweh » est naturel en français et conserve le cadre relationnel du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui préserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: mais Yahweh n’a pas écouté votre voix
  rationale: שׁמע avec בְּקוֹל peut signifier écouter la voix de quelqu’un, avec l’idée possible d’y répondre ou d’en tenir compte. La traduction conserve l’image hébraïque de la « voix ».
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: et ne vous a pas prêté attention
  rationale: האזין signifie « prêter l’oreille, écouter attentivement ». Cette formulation rend le second membre parallèle sans répéter exactement « écouter ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: L’hébreu emploie directement le tétragramme. « Yahweh » conserve le nom d’alliance et évite de le remplacer par un titre.
- issue: Portée du refus d’entendre
  choice: n’a pas écouté… et ne vous a pas prêté attention
  alternative: n’a pas entendu… et ne vous a pas prêté l’oreille
  rationale: Le parallélisme ne suggère pas une incapacité auditive, mais l’absence de réponse favorable à leur plainte. La traduction garde toutefois les deux verbes distincts et n’explicite pas davantage le motif théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé assure une narration naturelle; « votre voix » conserve l’image concrète de l’hébreu, et la structure parallèle de la fin du verset reste perceptible.
