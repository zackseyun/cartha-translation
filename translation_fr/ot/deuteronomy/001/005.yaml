source:
  edition: WLC
  text: בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן בְּ/אֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֖את לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: fr
  text: 'De l’autre côté du Jourdain[a], dans le pays de Moab, Moïse entreprit d’expliquer cette loi[b], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà du Jourdain ». L’expression hébraïque dépend du point de vue géographique adopté et peut se traduire naturellement de plusieurs façons.
    reason: lexical_alternative
  - marker: b
    text: Ou « cet enseignement » ou « cette instruction ». Le mot hébreu torah peut désigner la loi ou, plus largement, un enseignement.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: De l’autre côté du Jourdain
  rationale: L’expression situe Moab par rapport au Jourdain, selon un point de vue géographique qui n’est pas explicité dans la formule elle-même. Cette tournure française est naturelle tout en conservant cette relativité.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: dans le pays de Moab
  rationale: אֶרֶץ désigne ici le pays ou territoire de Moab. « Pays de Moab » est clair, courant et fidèle au cadre géographique et politique.
- source_word: הוֹאִיל
  choice: entreprit
  rationale: Avec le verbe qui suit, הוֹאִיל marque ici l’engagement délibéré dans l’action. « Entreprit d’expliquer » restitue naturellement l’idée de commencement et d’entreprise sans suggérer que l’explication elle-même commence nécessairement dans ce seul verset.
- source_word: בֵּאֵר
  choice: d’expliquer
  rationale: Le verbe באר exprime l’action de rendre clair ou d’exposer. « Expliquer » est moderne, accessible et suffisamment ample dans ce contexte.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: cette loi
  rationale: תּוֹרָה peut désigner une instruction, mais le contexte d’alliance et de prescriptions de Deutéronome donne ici une forte dimension juridique. « Loi » la préserve, tandis qu’une note signale le sens plus large possible.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: 'Cette formule introduit les paroles qui suivent. « En disant : » maintient explicitement le lien syntaxique avec le discours à venir.'
theological_decisions:
- issue: Traduction de תּוֹרָה dans le contexte de l’alliance
  choice: cette loi
  alternative: cet enseignement / cette instruction
  rationale: « Loi » rend la dimension juridique et conventionnelle du passage, sans exclure que תּוֹרָה désigne aussi plus largement l’enseignement transmis par Moïse. La note conserve cette amplitude sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. « Entreprit d’expliquer » conserve la nuance volontaire de הוֹאִיל et évite une formulation archaïque. Les notes préservent l’ambiguïté géographique et l’étendue sémantique de תּוֹרָה.
