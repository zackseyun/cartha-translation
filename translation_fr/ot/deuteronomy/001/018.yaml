  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: fr
  text: À ce moment-là, je vous ai ordonné tout ce que vous deviez faire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les paroles » ou « toutes les affaires » ; le mot hébreu דְּבָרִים peut désigner des instructions formulées ou des choses à accomplir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: je vous ai ordonné
  rationale: Le verbe צוה exprime un ordre ou une instruction faisant autorité. « Ordonner » en conserve clairement la force.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le suffixe est à la deuxième personne du pluriel. En français, « vous » convient naturellement dans ce contexte collectif.
- source_word: בָּעֵת הַהִוא
  choice: à ce moment-là
  rationale: Rend naturellement l’expression temporelle hébraïque et son renvoi à la période évoquée.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: tout ce que
  rationale: דְּבָרִים peut désigner des paroles, des choses ou des affaires. Dans cette proposition relative orientée vers l’action, « tout ce que » exprime naturellement l’ensemble des prescriptions sans effacer l’étendue du terme.
- source_word: אֲשֶׁר
  choice: ce que
  rationale: Introduit ici la proposition relative qui précise le contenu des ordres.
- source_word: תַּעֲשׂוּן
  choice: vous deviez faire
  rationale: L’imparfait hébreu à la deuxième personne du pluriel, après « ordonner », désigne ce que les destinataires avaient l’obligation d’accomplir. « Deviez faire » garde cette force directive sans la durcir excessivement.
