source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: fr
  text: 'J’ai donc pris les chefs de vos tribus, des hommes sages et reconnus[a], et je les ai établis à votre tête : chefs de milliers, chefs de centaines, chefs de cinquantaines, chefs de dizaines, et responsables pour vos tribus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « instruits »; le terme hébreu signifie littéralement « connus » et peut désigner des hommes reconnus, notamment pour leur savoir ou leur discernement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: J’ai donc pris
  rationale: Le waw consécutif fait avancer le récit; « donc » exprime naturellement la suite et le résultat des instructions précédentes.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: les chefs de vos tribus
  rationale: Dans ce contexte administratif, רֹאשׁ désigne ceux qui sont à la tête d’un groupe. « Chefs » est naturel en français et maintient le lien avec רָאשִׁים plus loin.
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: des hommes sages et reconnus
  rationale: « Hommes » conserve la référence masculine explicite; « sages » rend la compétence pratique. Le passif וִידֻעִים signifie le plus directement « connus/reconnus », probablement au sens d’hommes dont la valeur ou la compétence est attestée.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: et je les ai établis à votre tête
  rationale: נתן avec un complément de fonction exprime ici une nomination. « À votre tête » restitue naturellement en français la métaphore répétée de רֹאשׁ.
- source_word: שָׂרֵי
  choice: chefs de
  rationale: שַׂר désigne des détenteurs d’autorité sur des unités organisées. « Chefs » convient à la fois aux dimensions administrative et potentiellement militaire sans trancher davantage que l’hébreu.
- source_word: אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: milliers ... centaines ... cinquantaines ... dizaines
  rationale: Ces termes décrivent des échelons d’organisation. La formulation littérale préserve leur structure graduée; « cinquantaines » désigne clairement des groupes de cinquante.
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: et responsables pour vos tribus
  rationale: שֹׁטְרִים désigne des agents subalternes chargés de fonctions administratives ou d’exécution. « Responsables » reste intelligible et suffisamment large; לְ indique ici leur affectation aux tribus.
theological_decisions: []
