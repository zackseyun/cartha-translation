    issue: « les affaires qui opposent vos frères » est une explicitation lourde.
    rationale: Le contexte est judiciaire, mais l'hébreu demande littéralement d'entendre entre les frères. « litiges » conserve le cadre juridique sans cette périphrase.
  - severity: medium
    issue: La coordination finale par « ou » est plus interprétative que la coordination hébraïque.
    rationale: Le texte porte deux conjonctions וְ et peut être rendu de manière plus transparente par « et entre », tout en laissant au lecteur la portée exacte de la relation entre les parties.
  - severity: low
    issue: La note sur גֵּר affirme « non-Israélite » de façon trop catégorique.
    rationale: Le terme caractérise un résident étranger; l'explication doit conserver cette valeur fondamentale sans surdéfinir son identité.
