source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: fr
  text: 'En ce temps-là, j’ai donné cet ordre à vos juges : « Entendez les litiges entre vos frères[a] et jugez avec justice[b] entre un homme et son frère, et entre lui et l’étranger résident auprès de lui[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Écoutez les différends entre vos frères. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jugez avec droiture » ou « jugez selon ce qui est juste ». Le nom hébreu צֶדֶק (tsédeq) peut exprimer à la fois la justice et la rectitude, notamment dans un cadre judiciaire.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’étranger qui réside auprès de lui ». Le terme hébreu גֵּר (gēr) désigne un étranger établi comme résident au sein de la communauté, et non un simple étranger de passage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: j’ai donné cet ordre
  rationale: Le verbe צוה exprime un commandement ou une charge. Cette tournure est naturelle en français et conserve l’autorité de l’instruction de Moïse.
- source_word: שֹׁפְטֵיכֶם
  choice: vos juges
  rationale: Le nom désigne ici les personnes établies pour trancher les affaires judiciaires; « juges » est l’équivalent français le plus direct.
- source_word: בָּעֵת הַהִוא
  choice: En ce temps-là
  rationale: Cette expression temporelle renvoie à la période dont Moïse vient de parler et se rend naturellement ainsi en français narratif.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le contenu de l’ordre. En français actuel, les deux-points rendent cette fonction plus naturellement qu’un participe tel que « en disant ».
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: Écoutez les affaires qui opposent vos frères
  rationale: 'שׁמע a ici une valeur impérative et judiciaire: il s’agit d’entendre les parties ou leurs affaires. L’explicitation « les affaires qui opposent » communique clairement ce cadre sans déterminer la nature exacte du différend.'
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: et jugez avec justice
  rationale: צֶדֶק, employé adverbialement dans ce contexte judiciaire, associe rectitude morale et justice. « Avec justice » est idiomatique et conserve cette portée juridico-morale.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: entre un homme et son frère
  rationale: La formulation garde le singulier concret et le vocabulaire de parenté du texte hébreu, qui présente les membres d’Israël comme des frères.
- source_word: גֵּרוֹ
  choice: l’étranger qui réside auprès de lui
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté, et non un simple voyageur. « Qui réside auprès de lui » rend également le suffixe pronominal sans suggérer une possession.
theological_decisions:
- issue: Langage communautaire masculin dans אֲחֵיכֶם et אָחִיו
  choice: vos frères / son frère
  alternative: vos compatriotes / son prochain
  rationale: Le texte emploie explicitement le vocabulaire masculin de la fraternité avec une portée communautaire représentative. Le conserver maintient l’image d’Israël comme famille sans limiter nécessairement l’application judiciaire aux seuls hommes.
- issue: Portée de צֶדֶק dans un contexte judiciaire
  choice: avec justice
  alternative: avec droiture / selon ce qui est juste
  rationale: Le terme peut évoquer à la fois la justice légale et la rectitude morale. « Avec justice » convient au cadre judiciaire tout en laissant subsister cette dimension éthique.
- issue: Statut du גֵּר
  choice: l’étranger qui réside auprès de lui
  alternative: l’immigré établi auprès de lui / l’étranger résident
  rationale: Le mot désigne un étranger durablement installé et placé sous la protection juridique de la communauté. La traduction évite de le confondre avec un étranger de passage et souligne son inclusion dans l’administration impartiale de la justice.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe judiciaire reste claire sans devenir technique. Les termes de parenté du texte hébreu sont conservés, tandis que « étranger qui réside » explicite le statut durable exprimé par גֵּר.
