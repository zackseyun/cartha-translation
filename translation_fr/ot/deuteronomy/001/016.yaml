  to: 'En ce temps-là, j’ai donné cet ordre à vos juges : « Entendez les litiges entre vos frères[a] et jugez avec justice[b] entre un homme et son frère, et entre lui et l’étranger résident auprès de lui[c]. »'
  rationale: La révision emploie une expression judiciaire française plus directe pour l'audition des différends. Elle rend la coordination hébraïque finale par « et entre », avec répétition de la préposition, plutôt que d'imposer l'alternative par « ou ». La note sur גֵּר est resserrée afin de décrire le statut de résident étranger sans en faire une catégorie ethnique définie de manière excessive.
