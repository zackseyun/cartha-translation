review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l'ordre donné aux juges, l'audition judiciaire, le jugement conforme à la justice et le statut du גֵּר comme résident étranger. Toutefois, « les affaires qui opposent » explicite le conflit plus lourdement que nécessaire. « ou » dans la dernière coordination est une interprétation défendable en français juridique, mais l'hébreu coordonne les personnes par וְ; une formulation avec « et entre » reflète plus directement la structure sans imposer l'alternative.
  naturalness: Le français est globalement moderne et clair. « Entendez les litiges » est plus idiomatique dans un contexte judiciaire que « Écoutez les affaires qui opposent ». La répétition de « entre » rend la dernière partie de la phrase plus lisible.
  terminology: '« Juges », « justice », « frères » et « étranger résident » sont appropriés. « Étranger résident » rend bien גֵּר sans recourir à un terme administratif contemporain. La note doit éviter de définir le terme de façon trop absolue comme nécessairement « non-Israélite » : il désigne avant tout un étranger installé comme résident.'
  issues:
