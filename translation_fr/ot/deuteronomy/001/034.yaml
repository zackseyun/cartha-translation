  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: fr
  text: 'Yahweh entendit vos paroles[a]. Il se mit en colère et jura en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la voix de vos paroles ».'
    reason: L’expression hébraïque associe קוֹל (« voix, son ») à דִּבְרֵיכֶם (« vos paroles ») ; la note en conserve la forme imagée, moins naturelle dans le corps du texte français.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Dans cette séquence narrative, שׁמע indique simplement que Yahweh a entendu les paroles prononcées, sans impliquer nécessairement une écoute favorable.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: vos paroles
  rationale: Cette formulation française naturelle communique le sens de l’expression hébraïque. Sa forme littérale, « la voix de vos paroles », est conservée en note afin de rendre visible l’image du texte source.
- source_word: וַיִּקְצֹף
  choice: se mit en colère
  rationale: Le verbe קצף exprime une colère vive. « Se mit en colère » rend clairement son apparition dans la progression narrative sans ajouter de nuance étrangère.
- source_word: וַיִּשָּׁבַע לֵאמֹר
  choice: jura en ces termes
  rationale: Cette tournure française actuelle et digne restitue à la fois l’acte de jurer et la formule hébraïque introduisant les paroles du serment au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. La transcription « Yahweh » le préserve comme nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste concise ; « en ces termes » prépare naturellement la citation du verset suivant.
