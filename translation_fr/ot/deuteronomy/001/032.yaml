  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: fr
  text: Pourtant, dans cette affaire, vous n’avez pas mis votre confiance en Yahvé, votre Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « vous n’avez pas cru en Yahvé, votre Dieu » ; on peut aussi comprendre : « vous n’avez pas cru Yahvé, votre Dieu » — c’est-à-dire que vous n’avez pas tenu sa parole pour vraie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַדָּבָר הַזֶּה
  choice: Pourtant, dans cette affaire
  rationale: דָּבָר désigne ici la situation qui vient d’être racontée plutôt qu’une parole précise. וּ prend en contexte une valeur légèrement adversative, rendue naturellement par « Pourtant ».
- source_word: אֵינְכֶם מַאֲמִינִם
  choice: vous n’avez pas mis votre confiance
  rationale: La négation avec le participe hiphil de אמן décrit l’attitude persistante d’Israël dans la situation racontée. Le passé composé convient au récit français, tandis que « mettre sa confiance » exprime la dimension relationnelle du verbe sans exclure le sens de croire.
- source_word: בַּיהוָה
  choice: en Yahvé
  rationale: La préposition ב marque la personne en qui la confiance aurait dû être placée. « En » s’accorde naturellement avec « mettre sa confiance ». Le nom divin est rendu par « Yahvé », forme française courante qui le distingue du titre « Seigneur ».
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le construit avec le suffixe de deuxième personne du pluriel est rendu directement et conserve l’accent sur la relation entre Dieu et le peuple.
theological_decisions:
- issue: Sens de אמן suivi de ב à propos de Yahvé
  choice: mettre sa confiance en Yahvé
  alternative: croire en Yahvé ; croire Yahvé
  rationale: La construction peut exprimer la foi ou la confiance placée en une personne. Le contexte concerne aussi le refus d’accueillir la promesse divine ; la note maintient donc les lectures possibles sans réduire l’accusation à une simple croyance en l’existence de Dieu.
- issue: Représentation du tétragramme יהוה
  choice: Yahvé
  alternative: le SEIGNEUR ; l’Éternel
  rationale: Employer le nom propre préserve la distinction présente dans l’hébreu entre יהוה et les titres divins, sans introduire une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, simple et digne. « Dans cette affaire » reste proche de l’hébreu tout en renvoyant clairement aux événements précédents ; « mettre sa confiance » est naturel dans un contexte de reproche solennel.
