  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: fr
  text: Alors les Amorites qui habitaient cette région montagneuse sortirent à votre rencontre et vous poursuivirent comme le font les abeilles. Ils vous écrasèrent en Séïr jusqu’à Horma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortirent
  rationale: 'Le verbe יצא signifie ici « sortir » : les habitants quittent leur territoire ou leurs positions pour affronter Israël. L’accord au pluriel rend le sujet collectif.'
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le nom hébreu est morphologiquement singulier, mais il a un sens collectif, confirmé par les verbes pluriels qui suivent.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: qui habitaient cette région montagneuse
  rationale: Le participe exprime une résidence établie. הַר désigne ici vraisemblablement le relief montagneux pris comme région plutôt qu’une seule montagne.
- source_word: לִקְרַאתְכֶם
  choice: à votre rencontre
  rationale: Cette formulation conserve le sens premier de לקראת, tandis que le contexte rend manifeste le caractère hostile de la rencontre.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: vous poursuivirent
  rationale: רדף est le verbe courant pour une poursuite, notamment militaire.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: comme le font les abeilles
  rationale: La comparaison vive de l’hébreu est conservée dans une tournure française naturelle.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: ils vous battirent
  rationale: Le hiphil de כתת évoque une attaque violente qui met l’adversaire en pièces ou le défait. « Battirent » exprime ici la défaite militaire sans préciser au-delà du texte son ampleur exacte.
- source_word: בְּשֵׂעִיר
  choice: en Séïr
  rationale: La préposition ב indique naturellement le lieu ou la région où se déroule la défaite.
- source_word: עַד חָרְמָה
  choice: jusqu’à Horma
  rationale: עד indique la limite géographique atteinte par la poursuite ou la défaite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « les Amorites » rend naturellement le singulier collectif hébreu. « Région montagneuse » restitue le sens régional de הַר dans ce contexte. La métaphore des abeilles est maintenue sans explicitation.
