source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: fr
  text: Puis nous avons quitté l’Horeb et traversé tout ce grand et redoutable désert[a] que vous avez vu en direction de la région montagneuse des Amorites, comme Yahweh notre Dieu nous l’avait ordonné, et nous sommes arrivés jusqu’à Qadesh-Barnéa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « grand et terrible désert ». L’adjectif hébreu peut désigner ce qui inspire la peur, la crainte ou l’effroi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסַּע מֵחֹרֵב
  choice: nous avons quitté l’Horeb
  rationale: Le verbe נסע désigne ici le fait de lever le camp et de se mettre en route. « Quitter » exprime naturellement le départ depuis l’Horeb sans alourdir la phrase.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: et traversé tout … désert
  rationale: Avec אֵת et l’ensemble du désert comme objet, הלך évoque la traversée de cette région. « Traverser » rend cette relation de façon idiomatique en français.
- source_word: הַמִּדְבָּר
  choice: désert
  rationale: Dans ce récit de voyage, מִדְבָּר désigne une région aride et peu habitée. « Désert » est clair et courant en français moderne, sans imposer l’idée exclusive de dunes.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: grand et redoutable
  rationale: גָּדוֹל exprime la grandeur ou l’étendue, tandis que נוֹרָא qualifie ce qui inspire la peur, la crainte ou l’effroi. « Redoutable » conserve cette force sans suggérer nécessairement une valeur morale.
- source_word: אֲשֶׁר רְאִיתֶם
  choice: que vous avez vu
  rationale: La relative garde l’appel direct à l’expérience des auditeurs.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: sur le chemin de la région montagneuse des Amorites
  rationale: דֶּרֶךְ indique le chemin ou l’itinéraire, et הַר a ici un sens collectif désignant la zone montagneuse plutôt qu’un sommet isolé.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme … nous l’avait ordonné
  rationale: La tournure exprime la conformité du voyage à l’ordre divin; le plus-que-parfait situe naturellement cet ordre avant le départ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: וַנָּבֹא עַד קָדֵשׁ בַּרְנֵעַ
  choice: nous sommes arrivés jusqu’à Qadesh-Barnéa
  rationale: עַד marque le point atteint. « Jusqu’à » conserve explicitement cette nuance, et le nom du lieu est translittéré.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie directement le Tétragramme. La translittération « Yahweh » préserve le nom propre tout en évitant de le remplacer silencieusement par un titre.
- issue: Portée de נוֹרָא dans la description du désert
  choice: redoutable
  alternative: terrible
  rationale: Le terme peut évoquer la peur, l’effroi ou la crainte respectueuse selon le contexte. Ici, « redoutable » maintient cette amplitude sans moraliser le désert ni atténuer le danger ressenti.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé composé favorise une lecture naturelle à voix haute. « Région montagneuse » évite de réduire הַר à une montagne unique. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
