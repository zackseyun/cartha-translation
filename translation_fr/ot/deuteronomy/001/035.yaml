  verdict: revise
  source_fidelity: 'La formule de serment négative est correctement rendue par une négation catégorique, et les éléments essentiels sont conservés : les hommes visés, la génération moralement mauvaise, le bon pays, le serment et les pères. La révision proposée maintient l’apposition présente en hébreu sans la redondance peu idiomatique « un seul homme parmi ces hommes ».'
  naturalness: « Pas un seul homme parmi ces hommes de cette génération mauvaise » est lourd et peu naturel en français moderne. « Pas un seul de ces hommes, de cette mauvaise génération » conserve le sens distributif et l’apposition tout en étant fluide. Le point d’exclamation n’est pas nécessaire pour exprimer la force de la formule et n’est pas marqué dans le texte source.
  terminology: « Le bon pays », « j’ai juré de donner » et « à vos pères » sont appropriés. La note « à vos ancêtres » fournit utilement l’équivalent généalogique plus large sans remplacer le masculin explicite du texte hébreu.
