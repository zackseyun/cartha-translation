  text: אִם יִרְאֶ֥ה אִישׁ֙ בָּ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה הַ/דּ֥וֹר הָ/רָ֖ע הַ/זֶּ֑ה אֵ֚ת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֣ר נִשְׁבַּ֔עְתִּי לָ/תֵ֖ת לַ/אֲבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: fr
  text: Pas un seul de ces hommes, de cette mauvaise génération, ne verra le bon pays que j’ai juré de donner à vos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à vos ancêtres ». Hébreu : « à vos pères ».'
    reason: Alternative lexicale permettant d’expliciter la portée généalogique du terme hébreu sans neutraliser le texte principal.
lexical_decisions:
- source_word: אִם
  choice: Pas un seul… ne
  rationale: Dans cette formule de serment à valeur négative, אִם n’introduit pas une simple condition, mais une négation solennelle et catégorique.
- source_word: יִרְאֶה
  choice: ne verra
  rationale: Le verbe ראה signifie normalement « voir » ; ici, voir le pays implique y parvenir et en faire l’expérience, sans qu’il soit nécessaire d’expliciter cette implication.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: un seul homme parmi ces hommes
  rationale: Le singulier אִישׁ a une valeur distributive sous la négation, et בָּאֲנָשִׁים est partitif. La formulation conserve les termes masculins explicites de l’hébreu.
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: cette génération mauvaise
  rationale: דּוֹר désigne une génération et רַע porte ici un jugement moral. « Mauvaise » est naturel en français tout en gardant la portée morale du texte.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: le bon pays
  rationale: « Le bon pays » rend directement l’expression hébraïque et évoque à la fois la qualité du territoire et la bénédiction promise.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: que j’ai juré de donner
  rationale: Cette formulation rend directement le serment exprimé par נשׁבע et l’action ordinaire de donner exprimée par נתן.
- source_word: לַאֲבֹתֵיכֶם
  choice: à vos pères
  rationale: L’hébreu emploie explicitement le pluriel masculin « vos pères » ; le sens plus large « vos ancêtres » est signalé en note.
theological_decisions:
- issue: Portée de לַאֲבֹתֵיכֶם
  choice: à vos pères
  alternative: à vos ancêtres
  rationale: La traduction principale conserve le masculin pluriel explicite de l’hébreu et son lien avec les pères d’Israël, tandis que la note indique le sens généalogique plus large possible.
- issue: Force de la formule אִם יִרְאֶה
  choice: Pas un seul… ne verra
  alternative: Si un homme… voit
  rationale: Dans le contexte du serment divin de jugement, la construction est une formule négative solennelle. Une condition littérale en français masquerait sa force pragmatique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en exprimant clairement la force solennelle du serment. Le point d’exclamation restitue cette vigueur sans ajouter de contenu.
