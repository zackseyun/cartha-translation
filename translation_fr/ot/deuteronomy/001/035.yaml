revisions:
- from: Pas un seul homme parmi ces hommes de cette génération mauvaise ne verra le bon pays que j’ai juré de donner à vos pères[a] !
  to: Pas un seul de ces hommes, de cette mauvaise génération, ne verra le bon pays que j’ai juré de donner à vos pères[a].
  rationale: La révision améliore l’idiomaticité française et la ponctuation tout en préservant la formule négative de serment, l’apposition « ces hommes / cette mauvaise génération », ainsi que la distinction entre « pères » dans le texte et « ancêtres » en note.
