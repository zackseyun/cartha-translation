  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: fr
  text: Ils se dirigèrent vers la région montagneuse et y montèrent. Ils arrivèrent jusqu’à la vallée d’Eshkol[a] et l’explorèrent en éclaireurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oued d’Eshkol » ou « le ravin d’Eshkol » ; le terme hébreu peut désigner une vallée parcourue par un cours d’eau saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: Ils se dirigèrent alors
  rationale: Le verbe פנה décrit ici un changement ou une prise de direction. « Se dirigèrent » rend naturellement le mouvement dans le récit sans imposer l’idée d’un détour.
- source_word: וַיַּעֲלוּ הָהָרָה
  choice: vers la région montagneuse et y montèrent
  rationale: עלה exprime une montée, tandis que la finale directive de הָהָרָה marque le mouvement vers la région montagneuse. Cette formulation française conserve les deux éléments sans lourdeur.
- source_word: וַיָּבֹאוּ עַד
  choice: Ils arrivèrent jusqu’à
  rationale: La combinaison de בוא et עַד indique qu’ils parvinrent jusqu’à un point précis; « jusqu’à » préserve cette nuance de limite atteinte.
- source_word: נַחַל אֶשְׁכֹּל
  choice: la vallée d’Eshkol
  rationale: נחל peut désigner une vallée encaissée ou un oued parcouru par un cours d’eau, souvent saisonnier. « Vallée » est clair dans le corps du texte, et la note conserve les autres nuances possibles.
- source_word: וַיְרַגְּלוּ אֹתָהּ
  choice: explorèrent le pays
  rationale: Le piel de רגל désigne une exploration à des fins de reconnaissance. Le pronom féminin renvoie au pays mentionné dans le contexte; expliciter « le pays » évite en français un pronom ambigu, tout en gardant le sens du référent.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la progression hébraïque tout en évitant des tours artificiels; « région montagneuse » rend le relief sans suggérer nécessairement de hautes montagnes.
