  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: fr
  text: 'Alors tu diras devant Yahweh ton Dieu : « J’ai retiré de la maison la part consacrée[a] et je l’ai aussi donnée au lévite, à l’étranger[b], à l’orphelin et à la veuve, conformément à tout ce que tu m’as ordonné. Je n’ai transgressé aucun de tes commandements et je ne les ai pas oubliés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la chose sainte » ; il s’agit ici de la part consacrée, mise à part pour être distribuée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au résident étranger ». Le terme hébreu désigne un étranger établi au sein d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Alors tu diras
  rationale: Le waw avec le parfait poursuit la séquence rituelle; « Alors » exprime naturellement cette progression en français.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: devant Yahweh ton Dieu
  rationale: « Devant » rend directement לִפְנֵי, tandis que le nom divin est translittéré « Yahweh ».
- source_word: בִּעַרְתִּי הַקֹּדֶשׁ מִן הַבַּיִת
  choice: J’ai retiré de la maison la part consacrée
  rationale: Dans ce contexte, בער désigne l’enlèvement, non l’action de brûler. « Part consacrée » explicite avec mesure le bien mis à part, et l’ordre français évite une formulation pesante.
- source_word: וְגַם נְתַתִּיו
  choice: et je l’ai donnée
  rationale: Le pronom renvoie à la part consacrée. Le français n’a pas besoin de rendre גם par « aussi », car la coordination exprime suffisamment l’étape supplémentaire.
- source_word: לַגֵּר
  choice: à l’immigré
  rationale: גֵּר désigne un étranger établi au sein de la communauté; « immigré » est actuel et plus précis que « étranger » seul.
- source_word: לַיָּתוֹם
  choice: à l’orphelin
  rationale: « Orphelin » est le terme français naturel pour cette catégorie de personne vulnérable, sans devoir préciser l’absence du père.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: conformément à tout ce que tu m’as ordonné
  rationale: Cette formulation naturelle rend le sens collectif du singulier מִצְוָה et l’idée du commandement, sans reproduire artificiellement la répétition lexicale hébraïque.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: Je n’ai transgressé aucun de tes commandements
  rationale: עבר מן signifie ici enfreindre ou transgresser. « Aucun » rend idiomatiquement la négation portant sur le pluriel.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: et je ne les ai pas oubliés
  rationale: Le complément implicite renvoie aux commandements; le pronom les restitue clairement en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel de l’alliance présent dans le texte hébreu, sans le remplacer par un titre.
- issue: Nature de הַקֹּדֶשׁ
  choice: la part consacrée
  alternative: la chose sainte
  rationale: Dans le contexte de la dîme distribuée, il s’agit de ce qui a été mis à part comme sacré. « Part consacrée » clarifie le référent sans identifier plus précisément que ne le fait le verset lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse directe à Dieu. La déclaration rituelle reste solennelle sans calquer les répétitions peu naturelles de l’hébreu.
