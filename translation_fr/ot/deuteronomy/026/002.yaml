  - severity: low
    issue: Note a imprécise dans son alternative « que tu retireras de ta terre »
    rationale: « Retireras » déplace l’accent vers la récolte/extraction, tandis que le verbe hébreu conserve l’idée d’apporter. La note est remplacée par une alternative qui éclaire directement « prémices ».
