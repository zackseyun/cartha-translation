source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: fr
  text: Tu prendras une part des prémices de tous les produits du sol que tu apporteras de la terre que Yahweh, ton Dieu, te donne[a]. Tu les mettras dans un panier, puis tu iras au lieu que Yahweh, ton Dieu, choisira pour y faire demeurer son nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une part de ce qui vient en premier de tous les produits du sol ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour faire demeurer son nom là ». Cette formule caractéristique du Deutéronome désigne le lieu que Yahweh choisit pour son culte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: tu prendras
  rationale: Le parfait qal avec waw, dans cette suite d’instructions légales, a une valeur injonctive. Le futur français exprime naturellement cette prescription.
- source_word: מֵרֵאשִׁית
  choice: une part des prémices
  rationale: La préposition מִן indique un prélèvement sur la première part de la récolte, sans suggérer que la totalité des premiers produits doit être prise. « Prémices » conserve ici la portée cultuelle du contexte.
- source_word: כָּל פְּרִי הָאֲדָמָה
  choice: tous les produits du sol
  rationale: פְּרִי désigne ici l’ensemble de la production agricole, et non seulement les fruits des arbres. « Produits du sol » est clair et naturel en français moderne.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: que tu auras fait venir de ton pays
  rationale: Le hifil de בוא exprime littéralement l’action de faire venir ou d’apporter. Cette formulation conserve le mouvement indiqué par l’hébreu sans le réduire explicitement à la seule récolte.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: celui que Yahweh ton Dieu te donne
  rationale: Le participe נֹתֵן présente le pays comme le don actuel et caractéristique de Dieu. Le présent français conserve cette nuance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel employé par le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: Tu la mettras dans une corbeille
  rationale: טֶנֶא désigne un panier ou une corbeille servant au transport des produits agricoles. Le pronom singulier reprend naturellement « une part ».
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: puis tu iras au lieu
  rationale: Le futur français poursuit naturellement la suite injonctive. « Le lieu » préserve la formulation caractéristique du Deutéronome.
- source_word: אֲשֶׁר יִבְחַר
  choice: que ... choisira
  rationale: L’imparfait hébreu envisage le choix du lieu comme futur par rapport au discours de Moïse.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  rationale: La construction causative est conservée, de même que l’expression théologique propre au Deutéronome. Le pronom « y » rend le locatif שָׁם sans lourdeur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Formule du sanctuaire לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  alternative: pour y établir son nom
  rationale: Le choix retenu garde l’image hébraïque du nom qui demeure dans le lieu choisi et n’identifie pas sans nuance ce langage à une présence divine spatialement contenue.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond à l’adresse hébraïque à chaque membre d’Israël. La répétition de « Yahweh ton Dieu » et la formule du nom qui demeure sont maintenues en raison de leur importance littéraire et théologique.
