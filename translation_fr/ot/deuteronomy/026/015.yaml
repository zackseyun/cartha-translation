base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: fr
  text: 'Regarde de ta demeure sainte, du haut des cieux, et bénis ton peuple Israël, ainsi que la terre que tu nous as donnée, comme tu l’avais juré à nos pères[a] : un pays où coulent le lait et le miel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à nos ancêtres ». L’hébreu dit « à nos pères » et renvoie ici aux patriarches.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: regarde
  rationale: L’impératif demande à Dieu de porter son regard vers ceux qui prient. « Du haut des cieux » exprime naturellement en français le point de vue élevé impliqué par le contexte.
- source_word: מִמְּעוֹן קָדְשְׁךָ מִן הַשָּׁמַיִם
  choice: Du haut des cieux, regarde depuis ta demeure sainte
  rationale: Cette formulation conserve les deux indications du texte hébreu — la demeure sainte et les cieux — tout en évitant une succession pesante de compléments en français.
- source_word: וּבָרֵךְ
  choice: et bénis
  rationale: « Bénis » est l’équivalent direct, courant et transparent de l’impératif hébreu.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: ton peuple, Israël
  rationale: La virgule fait apparaître l’apposition par laquelle Israël est identifié comme le peuple de Dieu.
- source_word: הָאֲדָמָה
  choice: la terre
  rationale: Dans le contexte des prémices et du territoire donné à Israël, « la terre » est naturel et suffisamment concret. Le mot final אֶרֶץ est rendu par « pays » afin de préserver la variation lexicale du texte.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: que tu nous as donnée
  rationale: Le passé composé exprime naturellement l’acte accompli dont le don demeure pertinent au moment de la prière.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: comme tu l’as juré à nos pères
  rationale: Le pronom « l’ » rend explicite en français l’objet implicite du serment. « Nos pères » conserve le masculin du texte et la formule d’alliance visant les patriarches.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays où coulent le lait et le miel
  rationale: Cette tournure française claire conserve l’image hébraïque traditionnelle d’une abondance qui s’écoule.
theological_decisions:
- issue: Sens de לַאֲבֹתֵינוּ dans la formule d’alliance
  choice: à nos pères
  alternative: à nos ancêtres
  rationale: Le terme hébreu est masculin et, dans cette formule, renvoie notamment aux patriarches. La variante en note indique le sens collectif plus large sans effacer la forme du texte source.
- issue: Rapport entre le serment et le pays promis
  choice: 'comme tu l’as juré à nos pères : un pays…'
  alternative: comme tu l’as juré à nos pères, une terre…
  rationale: Les deux-points présentent « un pays où coulent… » comme l’explicitation du don promis, sans ajouter un verbe absent de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. « Terre » puis « pays » préservent autant que possible la distinction entre אֲדָמָה et אֶרֶץ sans produire une formulation artificielle.
