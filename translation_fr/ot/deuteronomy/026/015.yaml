  to: 'Regarde de ta demeure sainte, du haut des cieux, et bénis ton peuple Israël, ainsi que la terre que tu nous as donnée, comme tu l’avais juré à nos pères[a] : un pays où coulent le lait et le miel.'
  rationale: La révision rétablit une expression française plus naturelle des deux compléments « depuis ta demeure sainte » et « depuis les cieux », sans supprimer leur distinction. Elle rend également explicite, par le plus-que-parfait, le rapport temporel entre le serment ancestral et le don actuel, tout en préservant l’apposition finale qui caractérise le pays promis.
