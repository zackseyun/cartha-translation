  naturalness: La formulation révisée est plus fluide en français moderne et conserve un registre de prière digne et accessible.
  terminology: « Demeure sainte », « bénis », « ton peuple Israël », « terre », « pères » et « pays où coulent le lait et le miel » sont appropriés. La note maintient utilement l’alternative inclusive sans modifier le terme source dans le texte.
