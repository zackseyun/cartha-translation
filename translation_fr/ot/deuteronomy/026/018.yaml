  text: וַֽ/יהוָ֞ה הֶאֱמִֽירְ/ךָ֣ הַ/יּ֗וֹם לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/לִ/שְׁמֹ֖ר כָּל מִצְוֺתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: fr
  text: Et aujourd’hui, Yahvé a déclaré que tu serais pour lui un peuple lui appartenant en propre[a], comme il te l’a dit[b], et que tu observerais tous ses commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « son peuple précieux » ; hébreu : « un peuple, une possession précieuse ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « comme il te l’a promis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par « Yahvé », forme française courante qui représente le nom divin plutôt qu’un titre.
- source_word: הֶאֱמִירְךָ
  choice: a déclaré que tu serais
  rationale: Le rare hiphil de אמר exprime ici une déclaration solennelle dans le cadre de l’alliance. Cette formulation en restitue la force performative sans introduire explicitement l’idée de choix.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent naturel qui conserve l’immédiateté de la déclaration d’alliance.
- source_word: לִהְיוֹת לוֹ
  choice: que tu serais pour lui
  rationale: La tournure rend l’infinitif exprimant le statut conféré par la déclaration, tout en gardant la relation d’appartenance indiquée par לוֹ.
- source_word: לְעַם סְגֻלָּה
  choice: un peuple précieux
  rationale: סְגֻלָּה désigne un bien particulièrement précieux ou réservé, tandis que עַם désigne explicitement un peuple. La note conserve l’autre formulation naturelle.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: comme il te l’a dit
  rationale: Cette traduction reste proche du sens de דבר, « parler/dire », sans transformer implicitement la parole antérieure en promesse.
- source_word: וְלִשְׁמֹר
  choice: et que tu observerais
  rationale: Avec des commandements, שׁמר signifie les garder ou les observer. « Observer » est idiomatique en français juridique et religieux et s’intègre à la construction dépendant de « a déclaré ».
- source_word: כָּל מִצְוֺתָיו
  choice: tous ses commandements
  rationale: Rend directement le terme courant de la loi d’alliance et le suffixe possessif.
theological_decisions:
- issue: Portée d’alliance du verbe rare הֶאֱמִיר
  choice: une déclaration divine solennelle concernant le statut d’Israël
  alternative: une formulation explicite de choix ou d’élection
  rationale: Le texte affirme formellement la relation d’alliance, mais le verbe lui-même ne requiert pas que la traduction ajoute le vocabulaire théologique plus précis de l’élection.
- issue: Valeur de כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: « comme il te l’a dit »
  alternative: « comme il te l’a promis »
  rationale: Le contexte peut impliquer une promesse, mais le verbe signifie littéralement qu’il a parlé. Le texte principal préserve cette latitude, et la note signale l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse collective à Israël sous la forme grammaticale masculine singulière. La phrase conserve le parallélisme des deux infinitifs hébreux en les rattachant à la déclaration divine.
