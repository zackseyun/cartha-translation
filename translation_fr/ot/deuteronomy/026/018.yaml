    issue: La traduction principale de לְעַם סְגֻלָּה par « un peuple précieux » n’exprime pas explicitement la notion de possession ou d’appartenance particulière.
    rationale: סְגֻלָּה désigne un bien précieux, une possession particulière. La valeur d’estime est présente, mais ne suffit pas à elle seule à rendre le rapport d’appartenance marqué dans le terme.
  - severity: low
    issue: La note a qualifie de littérale une formulation française qui ne rend pas exactement la relation entre « peuple » et « possession précieuse ».
    rationale: La note est clarifiée pour présenter l’alternative et indiquer plus exactement la formulation hébraïque, sans surinterpréter le mot.
  revised_text: Et aujourd’hui, Yahvé a déclaré que tu serais pour lui un peuple lui appartenant en propre[a], comme il te l’a dit[b], et que tu observerais tous ses commandements.
