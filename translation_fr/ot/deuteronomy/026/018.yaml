- from: Et aujourd’hui, Yahvé a déclaré que tu serais pour lui un peuple précieux[a], comme il te l’a dit[b], et que tu observerais tous ses commandements.
  to: Et aujourd’hui, Yahvé a déclaré que tu serais pour lui un peuple lui appartenant en propre[a], comme il te l’a dit[b], et que tu observerais tous ses commandements.
  rationale: La révision conserve la déclaration solennelle, l’immédiateté de « aujourd’hui », l’adresse collective au singulier et le parallélisme des deux propositions dépendant de « a déclaré ». Elle rend plus complètement la nuance de possession particulière de סְגֻלָּה. Les notes demeurent ancrées aux mêmes emplacements et signalent les alternatives lexicales pertinentes.
