  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: fr
  text: 'Et maintenant, voici : j’ai apporté les prémices des produits du sol que tu m’as donnés, ô Yahweh. Tu les déposeras devant Yahweh ton Dieu et tu te prosterneras devant Yahweh ton Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu t’inclineras profondément ». Le verbe hébreu désigne précisément le fait de se courber ou de se prosterner ; « adorer » serait une traduction plus générale et interprétative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque naturellement la transition entre la confession récitée et la présentation actuelle de l’offrande, tout en conservant la liaison du discours.
- source_word: הִנֵּה
  choice: voici
  rationale: Particule déictique qui attire l’attention sur l’offrande; « voici » est courant, digne et moins archaïque que « voici que » ou « regardez » dans cette déclaration rituelle.
- source_word: הֵבֵאתִי
  choice: j’ai apporté
  rationale: Le parfait à la première personne présente l’acte d’apporter comme accompli; le passé composé convient au contexte rituel.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: les prémices des produits du sol
  rationale: « Prémices » exprime la première part offerte, tandis que « produits du sol » rend naturellement le rapport entre פְּרִי et אֲדָמָה sans réduire le sens aux seuls fruits au sens moderne.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: que tu m’as donné
  rationale: Conserve la proposition relative et la reconnaissance directe que la récolte est un don de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: וְהִנַּחְתּוֹ
  choice: Tu les déposeras
  rationale: Dans cette instruction rituelle, la forme verbale a une valeur directive. Le pronom hébreu singulier renvoie collectivement à l’offrande; le français reprend naturellement le pluriel « prémices ».
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend simplement la présentation dans la présence de Dieu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Conserve l’adresse individuelle au masculin singulier et la désignation d’alliance.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: tu te prosterneras
  rationale: Rend précisément l’action corporelle de s’incliner jusqu’à terre sans l’élargir silencieusement au terme général « adorer ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée de וְהִשְׁתַּחֲוִיתָ
  choice: tu te prosterneras
  alternative: tu adoreras
  rationale: Le verbe désigne directement un geste de prosternation. Le contexte est cultuel, mais traduire par « adorer » rendrait l’interprétation générale plutôt que l’image concrète du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La déclaration adressée à Yahweh est suivie des instructions données à l’offrant. « Prémices des produits du sol » évite l’ambiguïté moderne de « fruits » et garde le caractère agricole de l’expression.
