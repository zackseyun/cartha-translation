source:
  edition: WLC
  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: fr
  text: Quand tu auras fini de prélever toute la dîme de tes récoltes, la troisième année, l’année de la dîme, tu la donneras au Lévite, au résident étranger, à l’orphelin et à la veuve. Ils mangeront dans tes villes[a] et seront rassasiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à l’intérieur de tes portes ».'
    reason: L’hébreu emploie les portes de la ville pour désigner la localité elle-même.
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: La conjonction introduit ici la circonstance temporelle qui précède l’instruction principale.
- source_word: תְכַלֶּה לַעְשֵׂר
  choice: tu auras fini de prélever
  rationale: Le piel de כלה exprime l’achèvement, tandis que עשר désigne l’action de prélever la part du dixième. Cette formulation française évite la lourdeur de « donner la dîme de toute la dîme » tout en conservant le substantif « dîme » qui suit.
- source_word: מַעְשַׂר
  choice: la dîme
  rationale: Terme français précis et traditionnel pour la part du dixième.
- source_word: תְּבוּאָתְךָ
  choice: tes récoltes
  rationale: תְּבוּאָה désigne le produit ou le rendement agricole; « récoltes » est naturel et immédiatement compréhensible.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: l’année de la dîme
  rationale: Le calque clair du groupe construit conserve la désignation particulière donnée à cette troisième année.
- source_word: לַגֵּר
  choice: au résident étranger
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté, et non un simple visiteur; cette formulation garde la précision sociale du terme.
- source_word: לַיָּתוֹם
  choice: à l’orphelin
  rationale: « Orphelin » est l’équivalent français courant de la catégorie vulnérable désignée par יָתוֹם.
- source_word: בִשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: L’expression littérale « dans tes portes » désigne idiomatiquement les localités placées sous l’autorité de leurs portes; le sens est rendu dans le texte et la forme hébraïque signalée en note.
- source_word: וְשָׂבֵעוּ
  choice: et seront rassasiés
  rationale: Le verbe שׂבע signifie manger à satiété ou être rassasié; le futur coordonné respecte la suite de l’instruction.
theological_decisions:
- issue: Désignation des bénéficiaires vulnérables de la dîme
  choice: Conserver séparément « le Lévite, le résident étranger, l’orphelin et la veuve »
  alternative: Paraphraser collectivement par « les personnes dans le besoin »
  rationale: Le texte juridique et théologique nomme quatre catégories précises. Les maintenir évite de remplacer les dispositions de l’alliance par une généralisation moderne.
- issue: Sens local de בִשְׁעָרֶיךָ
  choice: Rendre l’idiome par « dans tes villes » et donner le sens littéral en note
  alternative: Employer « à l’intérieur de tes portes » dans le texte principal
  rationale: En hébreu, les portes représentent la localité. Le français littéral risquerait d’évoquer les portes d’une maison ou d’une enceinte plutôt que l’ensemble de la communauté; la note préserve toutefois l’image source.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement singulier respecte l’adresse hébraïque. La répétition intentionnelle de « dîme » dans « la troisième année, l’année de la dîme » est conservée, tandis que la phrase est divisée en deux pour une lecture naturelle.
