  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: fr
  text: Tu te réjouiras de tous les biens que Yahweh, ton Dieu, t’a donnés, à toi et à ta maisonnée, toi, le Lévite et l’étranger résidant parmi toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résident étranger ». Le mot hébreu גֵּר désigne une personne étrangère établie au sein de la communauté et placée sous sa protection.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Tu te réjouiras
  rationale: Dans ce contexte d’instruction, le parfait précédé de la conjonction a une valeur injonctive. Le futur français exprime naturellement l’ordre tout en gardant le sens de joie festive.
- source_word: בְכָל הַטּוֹב
  choice: de tous les biens
  rationale: Le français « se réjouir de » rend idiomatiquement la relation exprimée par בְּ. Le pluriel « biens » désigne concrètement l’ensemble des bienfaits reçus sans limiter le terme aux possessions matérielles.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: que ... t’a donnés
  rationale: Le passé composé convient à un don accompli dont le résultat demeure présent. L’accord au pluriel suit « biens ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Cette formulation rend directement l’expression d’alliance et conserve le suffixe possessif de deuxième personne.
- source_word: וּלְבֵיתֶךָ
  choice: et à ta maisonnée
  rationale: Ici, בַּיִת désigne le groupe familial et domestique plutôt que le bâtiment. « Maisonnée » conserve cette portée sociale.
- source_word: אַתָּה
  choice: à toi
  rationale: Le pronom explicite et emphatique est conservé. En français, son rattachement à « donnés » évite une reprise disloquée et peu naturelle.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: Terme précis et traditionnel pour un membre de la tribu de Lévi dans ce contexte cultuel et social.
- source_word: הַגֵּר
  choice: l’immigré
  rationale: גֵּר désigne ici un non-Israélite établi au sein de la communauté sous sa protection. « Immigré » est actuel et plus précis que « étranger », qui peut suggérer un simple visiteur.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: qui vit au milieu de toi
  rationale: L’ajout idiomatique de « vit » explicite la résidence impliquée par le contexte sans changer le référent; « au milieu de toi » conserve l’adresse communautaire au singulier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente directement et évite de le remplacer par un titre.
- issue: Portée communautaire de la réjouissance
  choice: avec le Lévite et l’immigré
  alternative: toi, le Lévite et l’immigré
  rationale: La syntaxe hébraïque énumère ceux qui prennent part à la joie. « Avec » rend naturellement en français cette participation commune, sans absorber le Lévite et l’immigré dans la maisonnée du destinataire.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à chaque Israélite. La phrase reste proche de la structure source tout en évitant une coordination maladroite en français.
