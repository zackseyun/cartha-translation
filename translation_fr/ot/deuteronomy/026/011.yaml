revisions:
- from: Tu te réjouiras de tous les biens que Yahweh ton Dieu t’a donnés, à toi et à ta maisonnée, avec le Lévite et l’immigré[a] qui vit au milieu de toi.
  to: Tu te réjouiras de tous les biens que Yahweh, ton Dieu, t’a donnés, à toi et à ta maisonnée, toi, le Lévite et l’étranger résidant parmi toi[a].
  rationale: La révision rétablit l’énumération emphatique des participants à la réjouissance, évite d’ajouter le verbe « vivre » à la relative, et choisit pour גֵּר un terme français actuel mais moins chargé de connotations administratives modernes. Le sens du don fait à l’intéressé et à sa maisonnée est maintenu.
