base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: fr
  text: Je n’en ai rien mangé pendant mon deuil[a], je n’en ai rien retiré en état d’impureté[b], et je n’en ai rien donné pour un mort[c]. J’ai obéi à la voix de Yahweh, mon Dieu ; j’ai agi conformément à tout ce que tu m’as commandé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma peine » ou « dans mon affliction ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fait disparaître », « consumé » ou « brûlé ». Le verbe hébreu peut désigner le fait d’enlever ou de consumer.
    reason: lexical_alternative
  - marker: c
    text: Ou « à un mort » ou « en rapport avec les morts » ; l’usage interdit exact n’est pas précisé.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: pendant mon deuil
  rationale: Le nom אֹנִי peut évoquer le deuil, la peine ou l’affliction. Dans ce contexte rituel, « pendant mon deuil » exprime naturellement la situation du déclarant tout en laissant les autres nuances en note.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: je n’en ai rien retiré
  rationale: Au piel, בער peut signifier enlever, faire disparaître, consumer ou brûler. « Retiré » conserve ici une portée assez large sans imposer l’idée précise d’une combustion.
- source_word: בְּטָמֵא
  choice: alors que j’étais impur
  rationale: La formule désigne l’état d’impureté rituelle dans lequel le locuteur aurait pu manipuler la part consacrée. Cette tournure est claire en français moderne.
- source_word: לְמֵת
  choice: pour un mort
  rationale: L’expression hébraïque ne précise ni le rite ni l’usage concernés. « Pour un mort » en préserve la concision et l’indétermination.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: J’ai obéi à la voix
  rationale: L’idiome signifie écouter avec obéissance. La formulation retenue communique ce sens d’obéissance tout en conservant l’image de la voix présente dans l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter le tétragramme du texte source.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: conformément à tout ce que tu m’as commandé
  rationale: Cette formulation rend l’idée d’une conformité entière au commandement divin dans un français naturel et digne.
theological_decisions:
- issue: Nature de l’usage interdit « pour un mort »
  choice: Conserver la formulation générale « pour un mort »
  alternative: pour des rites funéraires ; à un mort ; au contact d’un cadavre
  rationale: L’hébreu ne définit pas la pratique visée. Une expression générale évite de transformer en certitude une interprétation particulière liée aux funérailles ou à l’impureté causée par un cadavre.
translation_notes:
  register: Français international moderne, clair et digne. La déclaration garde un ton solennel sans archaïsmes. Les ambiguïtés relatives au deuil, au verbe בער et à l’usage « pour un mort » sont conservées ou signalées en note.
