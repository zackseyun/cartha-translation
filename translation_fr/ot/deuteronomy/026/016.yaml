  text: הַ/יּ֣וֹם הַ/זֶּ֗ה יְהוָ֨ה אֱלֹהֶ֜י/ךָ מְצַוְּ/ךָ֧ לַ/עֲשׂ֛וֹת אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה וְ/אֶת הַ/מִּשְׁפָּטִ֑ים וְ/שָׁמַרְתָּ֤ וְ/עָשִׂ֨יתָ֙ אוֹתָ֔/ם בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: fr
  text: Aujourd’hui, Yahweh ton Dieu t’ordonne de mettre en pratique ces prescriptions et ces règles[a] ; tu les observeras et les mettras en pratique de tout ton cœur et de toute ton âme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « règles » peut aussi désigner des ordonnances, des décisions judiciaires ou des règles de droit.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « âme » peut également désigner la vie, la personne ou l’être tout entier.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: Aujourd’hui
  rationale: L’expression déictique signifie littéralement « ce jour-ci ». « Aujourd’hui » en restitue naturellement l’immédiateté en français, sans affaiblir la solennité de l’adresse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe hébreu est à la deuxième personne du masculin singulier. Le tutoiement conserve l’adresse directe faite à Israël comme à une unité collective.
- source_word: מְצַוְּךָ
  choice: t’ordonne
  rationale: Le participe exprime ici un commandement présent et immédiat. Le présent français le rend de manière naturelle et ferme.
- source_word: לַעֲשׂוֹת
  choice: de mettre en pratique
  rationale: Dans ce contexte juridique, cette tournure française exprime clairement qu’il faut exécuter les prescriptions, tout en permettant de conserver la reprise du même verbe dans la seconde proposition.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: « Prescriptions » convient au cadre légal et conventionnel et demeure distinct de מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles
  rationale: Le terme désigne des décisions, normes ou règles de droit. « Règles » est clair en français moderne et maintient la distinction avec « prescriptions ».
- source_word: וְשָׁמַרְתָּ
  choice: tu les observeras
  rationale: Dans le langage de l’alliance, שׁמר signifie garder au sens d’observer fidèlement. Le futur français porte ici une valeur injonctive adaptée.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: et les mettras en pratique
  rationale: La reprise conserve l’insistance hébraïque sur l’observation suivie de l’exécution concrète.
- source_word: בְּכָל לְבָבְךָ
  choice: de tout ton cœur
  rationale: Formulation française consacrée et naturelle ; le « cœur » hébreu englobe la volonté, la pensée et les dispositions intérieures.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: et de toute ton âme
  rationale: « Âme » conserve la formulation solennelle, tandis qu’une note signale le champ sémantique plus large de נֶפֶשׁ.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le présente comme un nom personnel et évite de le remplacer par un titre.
- issue: Adresse d’Israël à la deuxième personne du singulier
  choice: tu / ton
  alternative: vous / votre
  rationale: L’hébreu s’adresse à Israël au singulier, ce qui souligne son unité et la portée directe de l’engagement d’alliance. Le français permet de rendre cette distinction explicitement.
- issue: Rapport entre l’ordre divin et l’exhortation qui suit
  choice: coordination sans lien causal ajouté
  alternative: « c’est pourquoi » ou « donc »
  rationale: Le simple ו hébreu coordonne les propositions. Ajouter une conséquence logique explicite résoudrait plus fortement que le texte leur relation.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse collective singulière de l’hébreu. La répétition « mettre en pratique » conserve l’insistance du texte source, et le point-virgule maintient l’enchaînement étroit des deux propositions sans introduire une relation causale absente de l’hébreu.
