  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: fr
  text: Lorsque tu seras entré dans le pays que Yahweh, ton Dieu, te donne en héritage, que tu en auras pris possession et que tu y habiteras,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette formule introduit une circonstance future. En français moderne, « Quand » en exprime naturellement la valeur temporelle sans reproduire lourdement l’hébraïsme « Et il arrivera que ».
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: tu entreras dans le pays
  rationale: Avec אֶל, le verbe בוא décrit ici l’entrée dans le pays. Le futur convient à la circonstance envisagée, et le singulier maintient l’adresse hébraïque à Israël.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, et le suffixe singulier est conservé par « ton ».
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: te donne en héritage
  rationale: Le présent « donne » reflète le participe hébreu et présente le don comme assuré ou en cours, tandis que « en héritage » conserve la portée de נַחֲלָה comme bien attribué.
- source_word: וִירִשְׁתָּהּ
  choice: que tu en auras pris possession
  rationale: Dans ce contexte territorial, ירשׁ désigne la prise de possession. Le futur antérieur français marque naturellement cette étape accomplie avant l’action principale du verset suivant.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: et que tu y habiteras
  rationale: ישׁב exprime ici le fait de résider dans le pays. « Habiter » est actuel, digne et moins étroit que « s’installer ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve sous forme translittérée sans lui substituer un titre.
- issue: Rapport entre le don du pays et sa prise de possession
  choice: Distinguer le pays donné par Dieu de la prise de possession par Israël
  alternative: Fondre le don et la possession en une seule idée de réception
  rationale: 'La formulation maintient la séquence du texte : entrée dans le pays, don divin, prise de possession, puis résidence. Elle préserve ainsi sans les opposer l’initiative divine et l’action d’Israël.'
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte par une virgule, conformément à la syntaxe qui se poursuit au verset suivant. Aucun appel de note n’est requis, car les variantes lexicales n’apportent ici aucune ambiguïté substantielle que le texte français ne puisse porter.
