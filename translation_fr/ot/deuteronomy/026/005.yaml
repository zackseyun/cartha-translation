  text: וְ/עָנִ֨יתָ וְ/אָמַרְתָּ֜ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔/י וַ/יֵּ֣רֶד מִצְרַ֔יְמָ/ה וַ/יָּ֥גָר שָׁ֖ם בִּ/מְתֵ֣י מְעָ֑ט וַֽ/יְהִי שָׁ֕ם לְ/ג֥וֹי גָּד֖וֹל עָצ֥וּם וָ/רָֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: fr
  text: 'Tu répondras et tu diras devant Yahweh ton Dieu : « Mon père était un Araméen errant[a]. Il descendit en Égypte et y séjourna comme étranger, avec peu de personnes. Là, il devint une nation grande, puissante et nombreuse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon père était un Araméen près de périr. » Le participe hébreu peut exprimer aussi bien l’errance que le fait de périr ou d’être sur le point de périr.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: Tu répondras et tu diras
  rationale: Conserve la formule liturgique hébraïque redoublée tout en restant claire en français moderne.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: devant Yahweh ton Dieu
  rationale: « Devant » rend directement לִפְנֵי, et « Yahweh » représente le nom divin יהוה conformément à l’usage du projet.
- source_word: אֲרַמִּי אֹבֵד
  choice: un Araméen errant
  rationale: « Araméen » est la désignation ethnique précise. Le participe אֹבֵד peut évoquer l’errance, la perdition ou le fait d’être près de périr ; « errant » convient au mouvement ancestral décrit, tandis que l’autre sens principal est signalé en note.
- source_word: אָבִי
  choice: Mon père
  rationale: Maintient le singulier concret et représentatif du texte hébreu, sans le remplacer par l’interprétation plus générale « mon ancêtre ».
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Il descendit en Égypte
  rationale: Préserve l’expression directionnelle hébraïque traditionnelle et naturelle dans ce contexte géographique.
- source_word: וַיָּגָר שָׁם
  choice: y séjourna en étranger
  rationale: גור désigne le séjour d’une personne qui réside comme étrangère, et non une simple installation permanente.
- source_word: בִּמְתֵי מְעָט
  choice: avec un petit nombre de personnes
  rationale: Rend l’idée d’un groupe humain peu nombreux sans limiter indûment l’expression aux seuls hommes adultes.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: Là, il devint une nation
  rationale: 'Conserve le singulier représentatif : le père devient une nation à travers sa descendance.'
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: grande, puissante et nombreuse
  rationale: Restitue l’accumulation des trois qualificatifs, qui souligne à la fois l’ampleur, la force et le nombre.
theological_decisions:
- issue: Sens de אֲרַמִּי אֹבֵד אָבִי
  choice: Mon père était un Araméen errant
  alternative: Mon père était un Araméen près de périr
  rationale: 'La vocalisation massorétique favorise la lecture où « mon père » est le sujet. Le participe אֹבֵד reste toutefois polysémique : il peut décrire l’errance ou une situation de perdition imminente. Le texte principal retient une lecture ancienne et contextuellement cohérente, sans supprimer l’autre possibilité, donnée en note. La lecture « Un Araméen cherchait à faire périr mon père » est plus interprétative et n’est pas exigée par la syntaxe hébraïque.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à l’Israélite individuel. La formule cérémonielle « répondras et diras » ainsi que le singulier représentatif ont été conservés malgré leur caractère légèrement marqué.
