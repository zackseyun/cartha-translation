  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: fr
  text: Yahweh nous a fait sortir d’Égypte à main forte et à bras étendu, au milieu d’une grande terreur[a], par des signes et des prodiges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une grande crainte » ou « par des actes qui inspiraient une profonde crainte ». Le terme hébreu peut désigner la peur ou la terreur, mais aussi ce qui les suscite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: nous a fait sortir
  rationale: Le hiphil de יצא exprime l’action de faire sortir. Cette formulation française, naturelle et précise, conserve le motif central de l’exode.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin יהוה, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Avec « faire sortir », la préposition française « de » rend naturellement l’origine ou le lieu quitté.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main forte
  rationale: Rend directement l’image hébraïque de la puissance mise en action, tout en conservant l’expression traditionnelle et intelligible en français.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: et le bras étendu
  rationale: Le second ב instrumental est compris dans la coordination française avec « d’une main forte »; l’image de l’intervention puissante de Dieu est conservée.
- source_word: וּבְמֹרָא גָּדֹל
  choice: en inspirant une grande terreur
  rationale: מוֹרָא peut désigner la terreur, la crainte ou ce qui les suscite. La tournure causative naturelle en français évite de suggérer que Yahweh aurait lui-même agi sous l’effet de la terreur.
- source_word: וּבְאֹתוֹת
  choice: par des signes
  rationale: « Signes » rend sobrement אֹתוֹת; leur caractère extraordinaire ressort déjà du contexte sans ajout explicatif.
- source_word: וּבְמֹפְתִים
  choice: et des prodiges
  rationale: « Signes et prodiges » est une collocation française établie qui rend fidèlement le couple hébreu אֹתוֹת וּמֹפְתִים.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Nuance de מוֹרָא dans la formule de l’exode
  choice: en inspirant une grande terreur
  alternative: avec une grande crainte; par des actes redoutables
  rationale: Le nom peut renvoyer à la terreur éprouvée ou à une manifestation qui inspire la crainte. Le texte ne précise pas entièrement la relation; la traduction principale privilégie l’effet redoutable des interventions, tandis que la note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébraïque est maintenu sans lourdeur excessive; la répétition des moyens d’action est rendue par « d’une… et… en… par… ». Le marqueur [a] figure immédiatement après l’expression concernée.
