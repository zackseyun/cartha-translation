base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: fr
  text: 'Alors nous avons crié vers Yahweh[a], le Dieu de nos pères[b], et Yahweh a entendu notre voix[c]. Il a vu notre misère, notre peine[d] et l’oppression que nous subissions.


    [a] Yahweh représente le nom divin יהוה (YHWH), traditionnellement rendu par « le Seigneur ».

    [b] Ou « le Dieu de nos ancêtres ».

    [c] Ou « a entendu notre cri » ; littéralement, « a entendu notre voix ».

    [d] Ou « notre dur labeur » ou « nos souffrances ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh représente le nom divin יהוה (YHWH), traditionnellement rendu par « le Seigneur ».
    reason: divine_name
  - marker: b
    text: Ou « le Dieu de nos ancêtres ».
    reason: lexical_alternative
  - marker: c
    text: Ou « a entendu notre cri » ; littéralement, « a entendu notre voix ».
    reason: idiom
  - marker: d
    text: Ou « notre dur labeur » ou « nos souffrances ».
    reason: lexical_range
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: nous avons crié vers
  rationale: Le verbe צעק exprime ici un appel pressant au secours. « Crier vers » conserve à la fois l’intensité du cri et son orientation vers Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה, plutôt que de lui substituer le titre traditionnel « le Seigneur ».
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: le Dieu de nos pères
  rationale: Cette formulation conserve l’expression d’alliance qui désigne le Dieu des pères d’Israël. « Ancêtres » demeure une possibilité naturelle, signalée en note.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: a entendu notre voix
  rationale: Cette traduction préserve l’image hébraïque tout en restant intelligible en français. Dans le contexte, elle signifie que Dieu a entendu leur appel.
- source_word: עָנְיֵנוּ
  choice: notre misère
  rationale: עֳנִי désigne l’état d’affliction, d’humiliation et de misère d’Israël sous l’esclavage.
- source_word: עֲמָלֵנוּ
  choice: notre peine
  rationale: עָמָל peut évoquer le labeur pénible, la souffrance ou les difficultés. « Peine » garde cette amplitude et se distingue de la misère et de l’oppression.
- source_word: לַחֲצֵנוּ
  choice: l’oppression que nous subissions
  rationale: לַחַץ évoque une pression oppressive. Cette formulation évite l’ambiguïté possible de « notre oppression », qui pourrait désigner en français une oppression exercée par les Israélites.
theological_decisions:
- issue: Rendu du nom d’alliance יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel, tandis qu’une note mentionne le rendu traditionnel.
- issue: Portée de « Dieu de nos pères »
  choice: le Dieu de nos pères
  alternative: le Dieu de nos ancêtres
  rationale: « Pères » reflète formellement אֲבֹתֵינוּ et maintient la formule d’alliance, sans exclure la traduction plus inclusive et sémantiquement possible « ancêtres ».
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve les trois termes distincts décrivant la condition d’Israël — misère, peine et oppression — et évite de les fondre en une seule idée.
