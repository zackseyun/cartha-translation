  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: fr
  text: Aujourd’hui, tu as déclaré[a] que Yahweh est ton Dieu et que tu marcheras dans ses voies, que tu garderas ses prescriptions, ses commandements et ses règles, et que tu écouteras sa voix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est inhabituel dans cette forme. Il peut aussi se rendre par « tu as affirmé »; une traduction plus littérale, mais moins naturelle, serait « tu as fait déclarer Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « écouter sa voix » comporte aussi l’idée de lui obéir.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הֶאֱמַרְתָּ
  choice: tu as solennellement reconnu
  rationale: Le hiphil inhabituel de אמר exprime ici une reconnaissance ou déclaration formelle dans un cadre d’alliance. Cette formulation française reste claire tout en marquant la solennité.
- source_word: הַיּוֹם
  choice: Aujourd’hui
  rationale: Rend directement et naturellement l’accent temporel de l’hébreu.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: comme ton Dieu
  rationale: Expression française idiomatique de la relation d’alliance signifiée littéralement par « être pour toi comme Dieu ».
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: tu t’es engagé à suivre ses voies
  rationale: « Suivre ses voies » communique naturellement l’image hébraïque de la marche, tandis que « tu t’es engagé » explicite le lien syntaxique avec la reconnaissance formelle sans ajouter une obligation étrangère au contexte.
- source_word: חֻקָּיו
  choice: ses prescriptions
  rationale: Terme juridique actuel qui distingue les prescriptions établies des commandements et des règles judiciaires.
- source_word: מִצְוֺתָיו
  choice: ses commandements
  rationale: Équivalent traditionnel, précis et intelligible du terme hébreu dans son registre d’alliance.
- source_word: מִשְׁפָּטָיו
  choice: ses règles
  rationale: Le terme hébreu peut désigner des décisions ou normes juridiques. « Règles » est naturel en français moderne et maintient la série légale sans suggérer seulement des actes de jugement.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: à écouter sa voix
  rationale: Préserve l’expression concrète de l’hébreu. Dans ce contexte d’alliance, écouter implique aussi obéir, nuance signalée en note plutôt que remplacée dans le texte.
theological_decisions:
- issue: Formule de déclaration d’alliance et engagement d’Israël
  choice: Présenter le verset comme la reconnaissance formelle de Yahweh par Israël, accompagnée de l’engagement à vivre selon ses exigences.
  alternative: 'Conserver une suite plus littérale d’infinitifs : « pour qu’il soit ton Dieu, pour marcher dans ses voies… »'
  rationale: Le verbe déclaratif inhabituel et les infinitifs coordonnés expriment ensemble une reconnaissance d’alliance et ses engagements. La formulation française clarifie leur relation sans préciser davantage que l’hébreu la nature théologique de cette déclaration.
- issue: Portée de שׁמע בקול
  choice: « écouter sa voix », avec la nuance d’obéissance en note
  alternative: « obéir à sa voix » ou « lui obéir »
  rationale: Le contexte favorise nettement l’obéissance, mais l’expression hébraïque conserve l’image de l’écoute. Le texte traduit cette image et la note en indique la portée.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse collective au peuple envisagé comme une unité. Le rythme de l’énumération juridique est conservé, sans archaïsmes.
