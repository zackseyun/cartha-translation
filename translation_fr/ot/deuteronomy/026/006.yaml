  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: fr
  text: Les Égyptiens nous ont maltraités[a], nous ont opprimés[b] et nous ont imposé un travail pénible[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous ont traités durement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous ont affligés ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une dure servitude ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: nous ont maltraités
  rationale: Le hiphil de רעע exprime ici le fait de faire du mal à quelqu’un ou de le traiter durement. « Nous ont maltraités » est naturel en français moderne et conserve la portée générale du verbe.
- source_word: הַמִּצְרִים
  choice: Les Égyptiens
  rationale: Désignation définie du peuple d’Égypte présenté comme l’auteur des mauvais traitements.
- source_word: וַיְעַנּוּנוּ
  choice: nous ont opprimés
  rationale: Le piel de ענה peut signifier affliger, humilier ou opprimer. Dans ce contexte d’asservissement collectif, « opprimer » exprime clairement la souffrance imposée tout en restant distinct de « maltraiter ».
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: nous ont imposé
  rationale: L’expression נתן על signifie littéralement mettre sur et, avec un travail comme complément, se rend naturellement par « imposer » en français.
- source_word: עֲבֹדָה קָשָׁה
  choice: un dur travail
  rationale: עֲבֹדָה désigne le travail ou le service, et קָשָׁה ce qui est dur ou pénible. « Un dur travail » conserve une formulation sobre sans ajouter explicitement la notion de travail forcé.
theological_decisions:
- issue: Maintien de la progression des trois expressions décrivant l’oppression
  choice: Distinguer « maltraités », « opprimés » et « imposé un dur travail »
  alternative: Fusionner les deux premiers verbes sous une seule notion d’oppression, ou expliciter partout l’esclavage
  rationale: L’hébreu enchaîne trois formulations apparentées mais non identiques. Les conserver séparément respecte la progression rhétorique et évite d’ajouter des précisions absentes de ce verset.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme narratif est conservé par la répétition de « nous ont ». Les accords au masculin pluriel suivent l’usage générique traditionnel pour le peuple d’Israël.
