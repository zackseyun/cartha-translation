  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: fr
  text: et pour qu’il te place au-dessus de toutes les nations qu’il a faites, pour la louange, la renommée[a] et la splendeur[b], et pour que tu sois un peuple saint appartenant au SEIGNEUR, ton Dieu, comme il l’a dit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le nom » ; en hébreu, le nom peut désigner la réputation ou le renom.
    reason: lexical_alternative
  - marker: b
    text: Ou « la gloire » ou « la beauté » ; le mot hébreu peut exprimer la beauté, la splendeur ou la gloire.
    reason: lexical_alternative
  - marker: c
    text: Ou « comme il l’a promis » ; littéralement « comme il a parlé » ou « comme il l’a dit ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: et pour qu’il te place bien au-dessus de toutes les nations
  rationale: La tournure finale rend naturellement en français l’infinitif hébreu qui poursuit l’énoncé précédent. « Bien au-dessus » exprime la valeur superlative de עֶלְיוֹן sans employer un titre divin.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a faites
  rationale: Le relatif reste rattaché aux nations et le verbe courant « faire » ne surtraduit pas עשה par « créer ».
- source_word: לִתְהִלָּה
  choice: pour la louange
  rationale: Conserve le substantif et la relation de but ou de résultat marquée par ל.
- source_word: וּלְשֵׁם
  choice: la renommée
  rationale: Dans cette série, שֵׁם désigne naturellement le nom au sens de réputation ou de renom. « Renommée » communique cet idiome en français courant.
- source_word: וּלְתִפְאָרֶת
  choice: la splendeur
  rationale: תִפְאָרֶת peut évoquer beauté, éclat ou gloire. « Splendeur » garde cette amplitude esthétique et honorifique sans réduire le terme à une seule nuance.
- source_word: וְלִהְיֹתְךָ עַם קָדוֹשׁ
  choice: et pour que tu sois un peuple saint
  rationale: Cette proposition finale française rend clairement le second infinitif de but et conserve le vocabulaire d’alliance « peuple saint ».
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: pour le SEIGNEUR, ton Dieu
  rationale: « Pour » conserve la relation d’appartenance ou de consécration portée par ל sans l’expliciter excessivement. « Le SEIGNEUR » suit la convention française de représentation du tétragramme.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: comme il l’a dit
  rationale: Rend directement le verbe « parler/dire » dans un français naturel, sans introduire dans le texte principal la notion plus interprétative de promesse.
theological_decisions:
- issue: Valeur promissoire de la dernière proposition
  choice: comme il l’a dit
  alternative: comme il l’a promis
  rationale: Le contexte d’alliance permet de comprendre une promesse, mais le verbe hébreu signifie simplement « parler » ou « dire ». Le texte principal conserve cette retenue.
- issue: Représentation de יהוה
  choice: le SEIGNEUR
  alternative: Yahvé
  rationale: La forme en petites capitales représente traditionnellement le nom divin en français tout en le distinguant du titre ordinaire « Seigneur ».
- issue: Relation du peuple saint avec יהוה
  choice: un peuple saint pour le SEIGNEUR
  alternative: un peuple saint appartenant au SEIGNEUR
  rationale: La formulation retenue préserve la concision et une certaine ouverture de la préposition hébraïque, qui peut exprimer destination, relation ou appartenance.
translation_notes:
  register: Français international actuel, digne et accessible. La structure de but répétée est conservée, mais transformée en propositions avec « pour que » afin d’éviter une construction infinitive lourde. La triade nominale reste compacte et son parallélisme est maintenu.
