  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: fr
  text: Alors le prêtre prendra la corbeille de ta main et la déposera devant l’autel de Yahweh, ton Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Alors … prendra
  rationale: Dans cette suite d’instructions rituelles, le parfait précédé de וְ exprime naturellement l’étape suivante; le futur français convient au caractère prescriptif du passage.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Nom défini au singulier désignant le prêtre qui officie.
- source_word: הַטֶּנֶא
  choice: la corbeille
  rationale: טֶנֶא désigne ici le récipient contenant les prémices; « corbeille » est précis et naturel en français.
- source_word: מִיָּדֶךָ
  choice: de ta main
  rationale: Cette formulation conserve l’image concrète du transfert direct depuis la main de l’offrant.
- source_word: וְהִנִּיחוֹ
  choice: et la déposera
  rationale: Le hifil de נוח signifie ici placer ou déposer; le pronom féminin renvoie naturellement à « la corbeille ».
- source_word: לִפְנֵי
  choice: devant
  rationale: Préposition spatiale et cultuelle indiquant la position par rapport à l’autel.
- source_word: מִזְבַּח
  choice: l’autel
  rationale: Équivalent français courant du terme désignant l’autel sacrificiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin YHWH, qui préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier est conservé, conformément à l’adresse directe et personnelle du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme YHWH. « Yahweh » en donne une transcription usuelle, tandis que « le SEIGNEUR » correspond au rendu traditionnel signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier maintient l’adresse hébraïque à la deuxième personne du singulier. « Alors » marque la progression rituelle sans alourdir la phrase.
