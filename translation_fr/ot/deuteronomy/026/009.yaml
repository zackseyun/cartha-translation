base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: fr
  text: Il nous a conduits jusqu’ici et nous a donné ce pays, un pays où coulent le lait et le miel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un pays qui regorge de lait et de miel » ; l’expression hébraïque évoque la fertilité et l’abondance.'
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes, le mot traduit par « miel » peut aussi désigner un sirop de fruits, par exemple de dattes, et pas seulement le miel d’abeilles.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: Il nous a conduits
  rationale: La forme hiphil de בוא exprime ici un mouvement causé vers une destination. « Nous a conduits » rend naturellement ce sens en français sans lourdeur littérale.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: jusqu’ici
  rationale: Littéralement « vers ce lieu ». Dans cette confession prononcée sur place, « jusqu’ici » est naturel et conserve la valeur déictique de l’expression.
- source_word: וַיִּתֶּן לָנוּ
  choice: et nous a donné
  rationale: נתן avec ל désigne simplement le don fait à un bénéficiaire. Cette formulation directe évite le sens plus interprétatif de « accordé ».
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: אֶרֶץ désigne ici le territoire habité donné à Israël. « Pays » est idiomatique en français dans ce contexte, tout en maintenant le lien avec « ce lieu ».
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays où coulent le lait et le miel
  rationale: Cette formulation conserve l’image concrète du participe זָבַת et l’expression hébraïque de fertilité et d’abondance, dans un français courant et digne.
- source_word: דְבָשׁ
  choice: miel
  rationale: דְבָשׁ désigne couramment le miel, mais peut parfois comprendre un sirop de fruits, notamment de dattes. Le terme traditionnel et immédiatement intelligible est maintenu dans le texte, avec une note sur son extension possible.
theological_decisions:
- issue: Référence au sujet divin dans la confession historique
  choice: Conserver le pronom « Il »
  alternative: Expliciter « Le SEIGNEUR »
  rationale: L’hébreu emploie des verbes à la troisième personne du singulier sans nommer à nouveau le sujet dans ce verset. Le pronom préserve la continuité du discours et n’ajoute pas ici le nom divin absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Jusqu’ici » rend naturellement la deixis de « ce lieu ». L’image traditionnelle du lait et du miel est conservée sans expliciter son sens dans le corps du verset.
