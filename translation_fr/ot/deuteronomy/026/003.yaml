  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: fr
  text: 'Tu iras auprès du prêtre qui sera en fonction en ce temps-là[a] et tu lui diras : « Je déclare aujourd’hui[b] à Yahvé, ton Dieu, que je suis entré dans le pays que Yahvé a juré à nos pères[c] qu’il nous donnerait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le prêtre qui sera en ces jours-là », c’est-à-dire celui qui exercera alors son ministère.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « J’ai déclaré aujourd’hui. » La forme hébraïque a probablement une valeur performative : la personne fait cette déclaration en prononçant ces paroles.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « nos ancêtres ». L’hébreu dit « nos pères » et peut désigner ici plus précisément les patriarches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Tu iras
  rationale: Dans cette suite d’instructions, le parfait avec waw a une valeur directive et future. Le verbe בוא peut signifier « venir », « aller » ou « entrer » selon le point de vue; « aller vers le prêtre » est naturel en français.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: qui sera en fonction en ce temps-là
  rationale: Littéralement « qui sera en ces jours-là ». Dans ce cadre rituel, l’expression désigne le prêtre alors en service; « en fonction » explicite sobrement ce sens contextuel.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Je déclare aujourd’hui
  rationale: 'Le parfait hébreu peut avoir ici une valeur performative : la déclaration s’accomplit par ces paroles. Le présent français rend clairement cette fonction tout en signalant en note l’autre lecture possible.'
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le tétragramme est rendu par le nom divin « Yahvé », forme française usuelle qui conserve le caractère personnel du nom d’alliance.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier vise le prêtre auquel le déclarant s’adresse. La formulation inhabituelle « ton Dieu » est donc conservée plutôt que lissée en « notre Dieu ».
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: que je suis entré dans le pays
  rationale: Après un verbe de déclaration, כִּי introduit naturellement le contenu par « que ». Avec בוא et אֶל, « entrer dans le pays » exprime clairement l’arrivée à l’intérieur du territoire promis.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: que Yahvé a juré
  rationale: Cette formulation préserve directement le langage solennel du serment d’alliance.
- source_word: לַאֲבֹתֵינוּ
  choice: à nos pères
  rationale: Le masculin pluriel est conservé, car dans ce contexte deutéronomique il peut viser spécifiquement les pères patriarcaux, sans exclure en note la traduction plus générale « ancêtres ».
- source_word: לָתֶת לָנוּ
  choice: de nous donner
  rationale: Le complément de « jurer » se rend naturellement en français par « jurer de donner »; le pronom « nous » maintient les bénéficiaires collectifs de la promesse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » est une forme française établie du nom divin et évite de le remplacer par un titre.
- issue: Référence de לַאֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: Dans le contexte de la promesse du pays, l’expression peut désigner particulièrement les patriarches. Le texte principal garde donc le masculin précis, tandis que la note présente l’équivalent généalogique plus large.
- issue: Valeur de הִגַּדְתִּי
  choice: 'présent performatif : « Je déclare »'
  alternative: 'passé composé : « J’ai déclaré »'
  rationale: La personne accomplit vraisemblablement la déclaration en prononçant la formule. La note préserve néanmoins l’ambiguïté aspectuelle du parfait hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse légale à chaque Israélite. La syntaxe garde le ton prescriptif du passage, tandis que « en ce temps-là » évite l’archaïsme de « en ces jours-là ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
