base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: fr
  text: 'Yahweh me dit : « Lève-toi, mets-toi en route devant le peuple[a], afin qu’ils entrent dans le pays et en prennent possession, le pays que j’ai juré à leurs pères[b] de leur donner. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la tête du peuple ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire leurs ancêtres.
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: קוּם לֵךְ לְמַסַּע
  choice: Lève-toi, mets-toi en route
  rationale: Cette formulation française naturelle conserve les deux impératifs et rend la notion de départ portée par מַסַּע sans lourdeur littérale.
- source_word: לִפְנֵי הָעָם
  choice: à la tête du peuple
  rationale: Dans ce contexte, la locution indique vraisemblablement que Moïse doit avancer devant le peuple et le conduire; une note conserve la lecture spatiale plus littérale.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: afin qu’ils entrent dans le pays et en prennent possession
  rationale: La subordination exprime ici le but ou le résultat. « Prendre possession » rend le caractère actif de ירשׁ sans le réduire à la seule idée d’héritage.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: « Le pays » désigne naturellement en français le territoire promis; sa reprise par « ce pays » clarifie l’antécédent de la proposition relative.
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré
  rationale: Cette expression directe conserve le langage solennel du serment divin.
- source_word: לַאֲבֹתָם
  choice: à leurs pères
  rationale: Le terme masculin historiquement précis est maintenu dans le texte, avec une note indiquant son sens collectif d’ancêtres.
- source_word: לָתֵת לָהֶם
  choice: de leur donner
  rationale: La construction française exprime fidèlement le contenu du serment tout en évitant la tournure moins naturelle « donner à eux ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération respecte la présence du nom propre dans la source et évite de le remplacer silencieusement par un titre.
- issue: Portée de לִפְנֵי הָעָם
  choice: à la tête du peuple
  alternative: devant le peuple
  rationale: Le contexte favorise la nuance de conduite du peuple, mais la note préserve la valeur spatiale possible de l’expression.
- issue: Rendu de לַאֲבֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: « Pères » conserve la forme masculine et la référence historique du texte; « ancêtres » en explicite la portée sans la substituer dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde son élan impératif; la syntaxe a été légèrement réorganisée pour être naturelle en français tout en conservant le but exprimé par les verbes hébreux.
