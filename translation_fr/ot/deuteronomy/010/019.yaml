  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: fr
  text: Aimez donc l’étranger[a], car vous avez été étrangers dans le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « séjourneur », « résident étranger » ou « étranger résidant ». Le mot hébreu gēr désigne une personne non israélite qui réside au sein d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: Aimez donc
  rationale: Le verbe אהב exprime l’amour, et la forme porte ici une valeur d’exhortation. « donc » rend le lien logique avec le verset précédent, où Dieu aime lui-même l’étranger.
- source_word: הַ/גֵּר
  choice: l’étranger
  rationale: גֵּר désigne un non-Israélite établi parmi Israël, souvent en situation sociale vulnérable, et non un simple voyageur. « l’étranger » est clair et naturel en français moderne, tandis que la note précise la notion de résidence.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif du commandement. « car » conserve avec naturel la relation causale et le registre digne du passage.
- source_word: גֵרִים
  choice: étrangers
  rationale: Le pluriel est rendu par le même terme que le singulier afin de préserver la reprise lexicale qui relie l’expérience d’Israël au commandement.
- source_word: הֱיִיתֶם
  choice: vous avez été
  rationale: La forme de היה évoque ici la condition passée d’Israël en Égypte. Le passé composé est naturel en français et souligne une expérience historique encore pertinente pour l’exhortation.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Cette formulation conserve אֶרֶץ, « pays », ainsi que la tournure historique du texte hébreu, sans lourdeur en français.
theological_decisions:
- issue: Portée sociale du terme גֵּר dans la législation de l’alliance
  choice: étranger
  alternative: immigré, résident étranger, hôte étranger
  rationale: Le terme vise un non-autochtone vivant au sein de la communauté et potentiellement vulnérable. « étranger » maintient le lien explicite entre cette personne et l’ancienne condition d’Israël, sans imposer une catégorie juridique moderne; la note évite toutefois de le faire comprendre comme un simple inconnu ou voyageur.
translation_notes:
  register: Français international moderne, simple et digne. L’impératif « Aimez donc » rend à la fois l’exhortation et son lien avec le contexte. La répétition « l’étranger / étrangers » préserve la force rhétorique et éthique de l’hébreu.
