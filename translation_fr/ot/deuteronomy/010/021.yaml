  source_fidelity: 'Le sens central est fidèlement rendu : Dieu est la louange et le Dieu d’Israël, et il a agi en sa faveur par des réalités grandes et redoutables, vues de ses propres yeux. La relative hébraïque אֲשֶׁר עָשָׂה se rattache directement à « ton Dieu » ; il est préférable de conserver cette continuité syntaxique sans introduire une nouvelle phrase emphatique.'
