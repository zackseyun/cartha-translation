    issue: « Ces choses grandes » et « a accompli ... ces choses » sont légèrement moins naturels en français moderne.
    rationale: « Ces grandes choses et ces choses redoutables » reflète les deux substantifs adjectivaux coordonnés, tandis que « a fait pour toi » convient naturellement à l’objet générique « choses ».
