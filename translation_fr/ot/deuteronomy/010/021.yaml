  rationale: La révision rétablit une seule phrase avec la relative rattachée à « ton Dieu », comme dans l’hébreu. Elle améliore aussi l’idiomaticité française et rend explicitement la coordination des deux expressions substantivées (« les grandes [choses] » et « les redoutables [choses] »), sans modifier le sens ni les ancrages de notes.
