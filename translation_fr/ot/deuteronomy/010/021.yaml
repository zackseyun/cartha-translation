base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: fr
  text: Il est ta louange[a], il est ton Dieu, qui a fait pour toi ces grandes choses et ces choses redoutables[b] que tes yeux ont vues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « celui que tu loues » ou « ton sujet de fierté ». L’hébreu dit littéralement : « Il est ta louange ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « qui inspirent la crainte ». Le terme hébreu désigne ce qui suscite à la fois la crainte et l’émerveillement.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: ta louange
  rationale: 'Le rendu littéral conserve la formulation prédicative, concise et forte : Dieu est à la fois l’objet et le fondement de la louange d’Israël.'
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rendu naturel de la relation d’alliance, avec le singulier qui s’adresse à Israël comme interlocuteur collectif.
- source_word: עָשָׂה אִתְּךָ
  choice: a accompli pour toi
  rationale: Dans ce contexte, la construction exprime les actes accomplis en faveur d’Israël ; « pour toi » restitue ce sens bénéficiaire en français naturel.
- source_word: הַגְּדֹלֹת
  choice: ces choses grandes
  rationale: L’adjectif substantivé désigne de grands actes ou événements ; « choses grandes » reste proche de l’expression hébraïque sans limiter le sens à la seule puissance.
- source_word: הַנּוֹרָאוֹת
  choice: redoutables
  rationale: Le terme désigne ce qui suscite la crainte et l’émerveillement. « Redoutables » maintient cette gravité, tandis que la note signale la nuance d’admiration mêlée de crainte.
- source_word: רָאוּ עֵינֶיךָ
  choice: que tes yeux ont vues
  rationale: Cette formulation conserve l’idiome hébraïque et son insistance sur l’expérience directe du peuple.
- source_word: הוּא ... וְהוּא
  choice: Il est ... et il est ... C’est lui
  rationale: La répétition et la reprise pronominale rendent l’emphase de l’hébreu sans ajouter une exclusivité qui n’est pas explicitement exprimée.
theological_decisions:
- issue: Sens de הוּא תְהִלָּתְךָ
  choice: Il est ta louange
  alternative: Il est celui que tu loues ; il est ton sujet de fierté
  rationale: 'Le choix conserve l’ambiguïté féconde de l’hébreu : Dieu peut être compris comme l’objet, le motif et le fondement de la louange d’Israël.'
- issue: Nuance de הַנּוֹרָאוֹת
  choice: redoutables
  alternative: impressionnantes ; terrifiantes ; qui inspirent la crainte
  rationale: « Redoutables » préserve à la fois la crainte et la grandeur saisissante des actes divins, sans réduire le terme à une terreur uniquement négative.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme interlocuteur collectif. La syntaxe garde la densité poétique de l’original tout en restant naturelle.
