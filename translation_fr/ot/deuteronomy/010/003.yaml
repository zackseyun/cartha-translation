base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: fr
  text: Je fis une arche en bois d’acacia, je taillai deux tablettes de pierre semblables aux premières, puis je montai sur la montagne, les deux tablettes à la main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן
  choice: arche
  rationale: Dans ce contexte d’alliance, « arche » est le terme français consacré pour le coffre sacré destiné aux tablettes, tout en restant fidèle au sens concret du mot hébreu.
- source_word: עֲצֵי שִׁטִּים
  choice: bois d’acacia
  rationale: Cette formulation naturelle en français moderne conserve l’identification traditionnelle et probable du bois.
- source_word: וָאֶפְסֹל
  choice: je taillai
  rationale: Le verbe désigne ici l’action de façonner les pierres en les taillant. « Tailler » est précis, courant et mieux adapté à la pierre que le plus général « couper ».
- source_word: לֻחֹת אֲבָנִים
  choice: tablettes de pierre
  rationale: « Tablettes » exprime des plaques destinées à porter une inscription et correspond au contexte, tandis que « de pierre » rend directement la matière.
- source_word: כָּרִאשֹׁנִים
  choice: semblables aux premières
  rationale: La formule préserve la comparaison avec les tablettes antérieures sans préciser au-delà du texte en quoi consistait cette ressemblance.
- source_word: וָאַעַל הָהָרָה
  choice: je montai sur la montagne
  rationale: Le verbe et la forme directionnelle indiquent une montée sur la montagne, et non un simple déplacement vers elle.
- source_word: בְּיָדִי
  choice: à la main
  rationale: Cette expression idiomatique française rend naturellement l’hébreu singulier « dans ma main » sans transformer explicitement le singulier en pluriel.
- source_word: וָאַעַשׂ
  choice: je fis
  rationale: Le verbe hébreu général signifie « faire » ou « fabriquer ». « Je fis » convient au récit au passé simple et évite d’ajouter une nuance technique absente du texte.
theological_decisions:
- issue: Désignation du contenant sacré des tablettes de l’alliance
  choice: arche
  alternative: coffre
  rationale: « Arche » conserve la portée cultuelle et relationnelle reconnue dans ce contexte biblique, sans ajouter de précision doctrinale étrangère au texte. « Coffre » serait concret mais atténuerait cette référence contextuelle établie.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le registre narratif biblique sans archaïsme lexical marqué. La dernière proposition est rendue idiomatiquement par « les deux tablettes à la main ».
