  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: fr
  text: Oui, à Yahweh ton Dieu appartiennent les cieux, et même les cieux les plus élevés[a], la terre et tout ce qui s’y trouve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les cieux des cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Cette particule attire l’attention et renforce solennellement l’affirmation. « Oui » conserve ici sa valeur emphatique sans employer l’archaïsme « voici » ni transformer la particule en impératif.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: à Yahweh ton Dieu appartiennent
  rationale: La préposition ל exprime ici la possession. La tournure française avec « appartiennent » rend explicitement cette relation tout en conservant l’adresse covenantale au singulier.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Le pluriel français correspond à la forme hébraïque et convient à la portée cosmique du verset.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: jusqu’aux cieux les plus élevés
  rationale: La construction littérale « les cieux des cieux » intensifie l’expression. « Jusqu’aux cieux les plus élevés » en communique naturellement le sens tout en maintenant l’idée d’extension contenue dans la coordination.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallélisme avec les cieux et la mention de tout ce qu’elle contient indiquent la terre au sens cosmique, non un territoire particulier.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: et tout ce qui s’y trouve
  rationale: Cette formulation française naturelle rend la totalité exprimée par כָל et la relation locative de בָּהּ sans préciser indûment « sur » ou « dans ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance sans le remplacer par un titre ni adopter la forme tardive « Jéhovah ».
- issue: Sens de שְׁמֵי הַשָּׁמָיִם
  choice: les cieux les plus élevés
  alternative: les cieux des cieux
  rationale: La construction peut fonctionner comme une intensification superlative. Le texte principal en donne le sens idiomatique, tandis que la note conserve la forme hébraïque afin de ne pas masquer l’expression originale.
translation_notes:
  register: Français international actuel, solennel mais accessible. L’ordre marqué « à Yahweh ton Dieu appartiennent » garde l’accent hébreu sur le propriétaire. La virgule entre « Yahweh » et « ton Dieu » est évitée pour que l’apposition reste fluide dans une phrase déjà fortement énumérative.
