  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: fr
  text: 'C’est pourquoi Lévi n’a ni part ni héritage avec ses frères[a] : Yahweh est son héritage[b], comme Yahweh, ton Dieu, le lui a déclaré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « avec ses frères ». Le nom singulier « Lévi » représente ici la tribu de Lévi, par contraste avec les autres tribus d’Israël.
    reason: cultural_note
  - marker: b
    text: Ou « Yahweh est sa part ». L’hébreu reprend le mot traduit par « héritage » pour souligner que la part de Lévi n’est pas un territoire, mais Yahweh lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conclusion tirée du contexte précédent.
- source_word: לְלֵוִי
  choice: Lévi
  rationale: Conserve le nom singulier hébreu, employé ici pour représenter la tribu de Lévi.
- source_word: חֵלֶק וְנַחֲלָה
  choice: part ni héritage
  rationale: « Part » rend חֵלֶק et « héritage » rend נַחֲלָה, en maintenant les deux termes liés à l’attribution du territoire. La tournure française « n’a ni… ni… » restitue idiomatiquement la négation portant sur les deux noms.
- source_word: עִם אֶחָיו
  choice: avec ses frères
  rationale: Suit la formulation masculine plurielle de l’hébreu tout en laissant la note expliciter la portée tribale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: הוּא נַחֲלָתוֹ
  choice: est son héritage
  rationale: Répète « héritage » afin de préserver le lien lexical et le contraste entre l’absence de territoire et Yahweh lui-même.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme … l’a déclaré
  rationale: Rend le verbe « parler » sans ajouter explicitement la notion de promesse; « déclarer » est naturel dans cette construction française.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Préserve l’adresse à la deuxième personne du singulier.
- source_word: לוֹ
  choice: le lui
  rationale: Rend le pronom singulier renvoyant à Lévi; dans « le lui a déclaré », « le » reprend le contenu de la déclaration et « lui » son destinataire.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël; sa transcription évite de le remplacer par un titre.
- issue: Lévi comme représentant singulier de sa tribu
  choice: Lévi
  alternative: la tribu de Lévi
  rationale: Le singulier du texte source est conservé, tandis qu’une note explique sa valeur collective.
- issue: Répétition de נַחֲלָה
  choice: héritage … héritage
  alternative: héritage … part
  rationale: 'La répétition souligne que l’héritage de Lévi n’est pas une terre : c’est Yahweh lui-même.'
- issue: Terme de parenté אֶחָיו
  choice: ses frères
  alternative: les autres Israélites
  rationale: La formulation concrète et genrée du texte hébreu est maintenue sans en réduire la portée au moyen d’une interprétation intégrée au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief le contraste central. Le présent « n’a » exprime l’état qui résulte de l’absence d’attribution territoriale; « a déclaré » conserve la valeur accomplie du discours divin.
