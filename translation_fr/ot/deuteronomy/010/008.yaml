  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: fr
  text: En ce temps-là, Yahweh mit à part la tribu de Lévi pour porter l’arche de l’alliance de Yahweh, pour se tenir devant Yahweh afin de le servir et pour bénir en son nom, jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדִּיל
  choice: mit à part
  rationale: Le verbe exprime une séparation en vue d’une fonction particulière; « mettre à part » rend naturellement cette désignation sans ajouter explicitement l’idée de consécration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: la tribu de Lévi
  rationale: Cette formulation française directe préserve Lévi comme nom de la tribu.
- source_word: לָשֵׂאת
  choice: porter
  rationale: Dans le contexte du déplacement de l’arche, « porter » est précis, courant et fidèle.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: La chaîne construite est conservée, avec une mention explicite de l’alliance et du nom divin.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: se tenir devant Yahweh
  rationale: La traduction maintient l’image hébraïque et son sens institutionnel possible sans la réduire à une simple présence physique.
- source_word: לְשָׁרְתוֹ
  choice: assurer son service
  rationale: Cette expression rend le service cultuel exercé pour Yahweh tout en restant naturelle en français moderne et sans importer une structure confessionnelle ultérieure.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: et pour bénir en son nom
  rationale: La formulation conserve l’idée d’une bénédiction prononcée sous l’autorité du nom de Yahweh, sans préciser dans le texte un objet que l’hébreu ne donne pas.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: comme elle le fait encore aujourd’hui
  rationale: L’idiome indique que la fonction assignée à la tribu de Lévi demeure en vigueur au moment où parle le narrateur; le féminin renvoie clairement à « la tribu ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le Tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Nature du service lévitique dans לַעֲמֹד ... לְשָׁרְתוֹ
  choice: se tenir devant Yahweh afin d’assurer son service
  alternative: se tenir devant Yahweh pour le servir; officier devant Yahweh
  rationale: Le choix conserve la dimension cultuelle de la charge sans introduire des catégories sacerdotales ou confessionnelles plus précises que le texte.
- issue: Objet implicite de וּלְבָרֵךְ בִּשְׁמוֹ
  choice: bénir en son nom
  alternative: prononcer la bénédiction en son nom; bénir le peuple en son nom
  rationale: L’hébreu ne précise pas ici qui reçoit la bénédiction. La traduction garde cette indétermination plutôt que d’ajouter « le peuple ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la série des fonctions introduites en hébreu par des infinitifs. « Assurer son service » marque le cadre sacré sans employer un vocabulaire ecclésiastique anachronique.
