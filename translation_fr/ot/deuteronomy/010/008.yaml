revisions:
- from: En ce temps-là, Yahweh mit à part la tribu de Lévi pour porter l’arche de l’alliance de Yahweh, pour se tenir devant Yahweh afin d’assurer son service et pour bénir en son nom, comme elle le fait encore aujourd’hui.[a]
  to: En ce temps-là, Yahweh mit à part la tribu de Lévi pour porter l’arche de l’alliance de Yahweh, pour se tenir devant Yahweh afin de le servir et pour bénir en son nom, jusqu’à ce jour.
  rationale: La révision restitue explicitement la relation personnelle envers Yahweh dans « le servir » et préserve la concision ainsi que la portée narrative de l’idiome hébreu « jusqu’à ce jour », sans ajouter d’explication au texte courant. Aucune note n’est nécessaire, car le rendu demeure suffisamment transparent.
