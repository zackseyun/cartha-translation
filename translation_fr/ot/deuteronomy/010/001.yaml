  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: fr
  text: 'À ce moment-là, Yahweh m’a dit : « Taille pour toi deux tablettes de pierre comme les premières, monte vers moi sur la montagne et fabrique-toi une arche en bois. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: À ce moment-là
  rationale: Cette expression temporelle situe naturellement l’épisode par rapport au récit précédent tout en conservant la valeur déictique de הַהִוא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom propre divin employé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: פְּסָל
  choice: Taille
  rationale: Dans le contexte de tablettes de pierre, « tailler » exprime clairement l’action de façonner la pierre et convient au registre moderne.
- source_word: שְׁנֵי לֻוחֹת אֲבָנִים
  choice: deux tablettes de pierre
  rationale: Cette formulation française usuelle conserve la construction et le sens concret de l’hébreu.
- source_word: כָּרִאשֹׁנִים
  choice: comme les premières
  rationale: Le comparatif renvoie aux premières tablettes mentionnées dans le récit; la formulation française garde ce renvoi explicite.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: monte vers moi sur la montagne
  rationale: Cette traduction rend à la fois le mouvement ascendant, l’orientation vers Dieu et la montagne comme destination, sans alourdir la phrase.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: et fabrique-toi une arche en bois
  rationale: « Arche » conserve la désignation traditionnelle du coffre sacré destiné aux tablettes; « fabrique-toi » rend la nuance bénéficiaire de לְךָ dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement sans le remplacer par un titre ni adopter la forme tardive « Jéhovah ».
- issue: Sens de אֲרוֹן dans le contexte de l’alliance
  choice: arche
  alternative: coffre
  rationale: Le mot désigne concrètement un coffre, mais le contexte des tablettes de l’alliance justifie « arche », terme qui conserve sa fonction sacrée sans ajouter de précision absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la succession des impératifs hébreux, avec un vocabulaire courant. Aucun marqueur de note n’est nécessaire, car les variantes lexicales proposées ne modifient pas substantiellement le sens.
