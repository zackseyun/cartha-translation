source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: fr
  text: Pourtant, Yahweh s’est attaché à tes pères[a], pour les aimer, et il a choisi leur descendance après eux — vous — d’entre tous les peuples, comme c’est le cas aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est seulement à tes pères que Yahweh s’est attaché, pour les aimer. »'
    reason: רַק peut être compris comme restrictif (« seulement ») plutôt que principalement adversatif (« pourtant »).
lexical_decisions:
- source_word: רַק
  choice: Pourtant
  rationale: Dans le contexte, רַק souligne le contraste entre la souveraineté universelle de Yahweh et son attachement particulier aux pères d’Israël. « Pourtant » rend naturellement cette valeur adversative, tandis que la lecture restrictive est signalée en note.
- source_word: בַּאֲבֹתֶיךָ
  choice: à tes pères
  rationale: Avec חָשַׁק, la préposition בְּ introduit l’objet de l’attachement. « Tes pères » conserve le lien historique et collectif avec les ancêtres d’Israël.
- source_word: חָשַׁק
  choice: s’est attaché
  rationale: Le verbe exprime un attachement volontaire et affectueux. « S’est attaché » en restitue la force relationnelle sans ajouter une formulation doctrinale.
- source_word: לְאַהֲבָה אֹתָם
  choice: pour les aimer
  rationale: L’infinitif peut exprimer le but ou le résultat lié à חָשַׁק. La traduction directe conserve cette relation sans la préciser davantage.
- source_word: וַיִּבְחַר
  choice: et il a choisi
  rationale: « Choisir » est l’équivalent courant et transparent de בחר et maintient explicitement le langage de l’élection divine.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: après eux leur descendance
  rationale: זֶרַע a ici un sens collectif. « Leur descendance » est naturel en français moderne, et « après eux » préserve la succession générationnelle.
- source_word: בָּכֶם
  choice: vous
  rationale: Le pronom identifie en apposition la descendance avec les auditeurs présents. Les tirets rendent clairement cette apposition.
- source_word: מִכָּל הָעַמִּים
  choice: parmi tous les peuples
  rationale: עַמִּים désigne des peuples, et la préposition מִן marque ici une sélection au sein de leur ensemble. « Parmi » l’exprime naturellement en français.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme c’est le cas aujourd’hui
  rationale: Cette expression renvoie à la situation présente qui confirme le propos. La formulation choisie transmet clairement cet idiome en français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Le langage de l’élection divine
  choice: Conserver explicitement l’attachement, l’amour et le choix de Yahweh.
  alternative: Réduire le propos à une simple préférence historique, ou l’élargir pour soutenir un système doctrinal ultérieur.
  rationale: Le verset affirme conjointement l’attachement de Yahweh aux pères, son amour pour eux et son choix de leur descendance. La traduction maintient cette tension et cette particularité sans les atténuer ni les systématiser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu lorsque cela préserve une nuance réelle, notamment dans « pour les aimer » et dans l’apposition « — vous — ».
