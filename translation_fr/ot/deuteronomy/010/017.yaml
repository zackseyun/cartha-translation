  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: fr
  text: Car Yahweh, votre Dieu, est le Dieu des dieux et le Seigneur des seigneurs, le Dieu grand, puissant et redoutable[a], qui ne fait preuve d’aucune partialité et n’accepte aucun pot-de-vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « digne d’être craint » ou « qui inspire la crainte » ; l’hébreu évoque celui qui suscite une crainte révérencielle.'
    reason: Précise l’étendue sémantique de וְהַנּוֹרָא et évite que « redoutable » soit compris dans un sens exclusivement négatif.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et conserve naturellement la valeur causale en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: le Dieu des dieux
  rationale: Conserve la construction hébraïque et sa forte affirmation de suprématie sans préciser la nature des autres « dieux ».
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: et le Seigneur des seigneurs
  rationale: Reproduit le parallélisme du texte source dans une formulation française traditionnelle et intelligible.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: le Dieu grand, puissant et redoutable
  rationale: Préserve la succession solennelle des épithètes. « Redoutable » exprime le fait d’inspirer la crainte, y compris la crainte révérencielle, sans réduire le terme à la simple admiration.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: qui ne fait preuve d’aucune partialité
  rationale: Rend clairement l’idiome hébreu, littéralement « ne relève pas les visages », qui désigne l’absence de favoritisme.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: et n’accepte aucun pot-de-vin
  rationale: Formulation française directe qui conserve la portée judiciaire et morale de l’hébreu.
theological_decisions:
- issue: La formule « Dieu des dieux et Seigneur des seigneurs »
  choice: Maintenir littéralement la formule de suprématie
  alternative: Le Dieu suprême et le Seigneur souverain
  rationale: La formulation hébraïque affirme l’incomparabilité et la souveraineté de Yahweh sans expliquer explicitement le statut ontologique des autres dieux ou seigneurs; la traduction conserve cette tension.
- issue: Le sens de וְהַנּוֹרָא
  choice: redoutable
  alternative: impressionnant; digne d’être craint; qui inspire la crainte
  rationale: Le mot désigne celui qui suscite la crainte ou l’effroi révérenciel. « Redoutable » garde cette force, tandis que la note prévient une lecture uniquement négative.
- issue: La représentation du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: La transcription préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La cadence élevée de la série de titres est conservée, tandis que les idiomes juridiques sont rendus en français naturel.
