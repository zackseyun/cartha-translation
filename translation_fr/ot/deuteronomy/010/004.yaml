source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: fr
  text: Il écrivit sur les tables, comme la première inscription, les Dix Paroles[a] que Yahweh vous avait dites sur la montagne, du milieu du feu, le jour de l’assemblée. Puis Yahweh me les donna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « les Dix Commandements ». En hébreu : « les dix paroles » (ou « les dix mots »).'
    reason: La note conserve l’appellation française traditionnelle tout en explicitant la formulation littérale de l’hébreu.
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Il écrivit
  rationale: Le wayyiqtol à la 3e personne du masculin singulier rapporte une action passée. « Écrivit » est naturel et maintient le lien lexical avec מִכְתָּב, « inscription ».
- source_word: הַלֻּחֹת
  choice: les tables
  rationale: Dans le contexte biblique de l’alliance, « tables » est la désignation française habituelle et exacte; la pierre, bien que connue par le contexte, n’est pas précisée dans ce verset.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: comme dans la première inscription
  rationale: Le כ comparatif est rendu par « comme ». « Inscription » convient à un texte gravé sur des tables et évite la tournure peu naturelle « comme la première écriture ».
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: les Dix Paroles
  rationale: L’hébreu signifie littéralement « les dix paroles » ou « les dix mots ». La majuscule signale qu’il s’agit d’une désignation reconnue de cet ensemble lié à l’alliance.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: que Yahweh vous avait dites
  rationale: Le plus-que-parfait indique clairement que la parole divine précède sa mise par écrit. L’accord au féminin pluriel reprend naturellement « Paroles ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter directement le tétragramme du texte source.
- source_word: בָּהָר
  choice: sur la montagne
  rationale: Cette formulation française rend naturellement le lieu de la révélation au Sinaï/Horeb sans ajouter le nom de la montagne.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: Cette expression conserve l’image hébraïque de la voix provenant de l’intérieur du feu.
- source_word: בְּיוֹם הַקָּהָל
  choice: le jour de l’assemblée
  rationale: « Assemblée » rend קָהָל comme le rassemblement d’Israël et demeure clair en français moderne.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: Puis Yahweh me les donna
  rationale: « Puis » marque la progression narrative du wayyiqtol. Le pronom « les » conserve l’ambiguïté grammaticale entre le contenu écrit et les tables qui le portent.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le nom divin. « Yahweh » le représente sans lui substituer un titre et sans adopter la forme traditionnelle tardive « Jéhovah ».
- issue: Rendu de עֲשֶׂרֶת הַדְּבָרִים
  choice: les Dix Paroles
  alternative: les Dix Commandements
  rationale: Le sens lexical est « les dix paroles ». Le rendu traditionnel reste utile au lecteur et figure donc en note, sans remplacer dans le texte principal la formulation hébraïque.
- issue: Référent du pronom dans « me les donna »
  choice: Maintien du pronom sans explicitation
  alternative: Yahweh me donna les tables
  rationale: Le suffixe masculin pluriel peut renvoyer aux éléments immédiatement évoqués dans leur réalité inscrite. Expliciter « les tables » résoudrait une référence que l’hébreu laisse pronominale.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. « Tables », « inscription » et « assemblée » sont usuels et précis; la structure a été légèrement fluidifiée en deux phrases pour éviter une accumulation lourde.
