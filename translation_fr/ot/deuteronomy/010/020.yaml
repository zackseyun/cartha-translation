id: DEU.10.20
reference: Deuteronomy 10:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: fr
  text: Tu craindras Yahweh, ton Dieu[a] ; c’est lui que tu serviras, c’est à lui que tu t’attacheras[b], et c’est par son nom que tu prêteras serment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu révéreras Yahweh, ton Dieu » ; dans le contexte de l’alliance, le verbe hébreu traduit par « craindre » désigne souvent une crainte empreinte de profond respect.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu resteras fermement attaché à lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend le construit avec suffixe masculin singulier et conserve l’adresse personnelle de l’alliance.
- source_word: תִּירָא
  choice: tu craindras
  rationale: Préserve le sens direct de ירא et sa gravité, tout en laissant au contexte la nuance de respect révérenciel.
- source_word: אֹתוֹ תַעֲבֹד
  choice: c’est lui que tu serviras
  rationale: La tournure clivée restitue l’accent porté par le pronom objet antéposé ; « servir » conserve le sens lexical de עבד sans réduire sa portée cultuelle.
- source_word: וּבוֹ תִדְבָּק
  choice: c’est à lui que tu t’attacheras
  rationale: Rend idiomatiquement דבק avec ב comme un attachement étroit et fidèle à une personne, tout en maintenant l’emphase.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: c’est par son nom que tu prêteras serment
  rationale: « Par son nom » rend l’expression régie par le verbe jurer ; « prêter serment » exprime clairement sa portée juridique et cultuelle en français moderne.
theological_decisions:
- issue: Valeur des imparfaits hébreux dans une exhortation d’alliance
  choice: 'Employer le futur français : « tu craindras… tu serviras… tu t’attacheras… tu prêteras serment »'
  alternative: 'Employer une suite d’impératifs : « Crains… sers… attache-toi… prête serment »'
  rationale: Dans ce contexte légal et exhortatif, les imparfaits ont force prescriptive. Le futur français conserve naturellement à la fois la forme d’injonction et la cadence solennelle.
- issue: Portée de la crainte de Dieu
  choice: Conserver « craindras » dans le texte
  alternative: Traduire « révéreras »
  rationale: Le verbe ירא peut inclure la révérence dans le cadre de l’alliance, mais « craindre » préserve mieux l’ambivalence et la force théologique du terme sans l’adoucir.
translation_notes:
  register: Français international moderne, digne et accessible. Les tournures clivées « c’est lui… c’est à lui… c’est par son nom… » reproduisent l’insistance de l’hébreu sans raideur excessive. Le futur garde la force prescriptive propre au style de l’alliance.
