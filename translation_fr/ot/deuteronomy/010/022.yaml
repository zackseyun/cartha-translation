  variant: modern international French
source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: fr
  text: Tes pères[a] sont descendus en Égypte au nombre de soixante-dix personnes[b] ; et maintenant, Yahweh, ton Dieu, t’a rendu aussi nombreux que les étoiles du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes ancêtres ». L’hébreu dit littéralement « tes pères ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec soixante-dix âmes » ; ici, le mot hébreu rendu par « personnes » sert à compter des êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: au nombre de soixante-dix personnes
  rationale: La construction hébraïque compte les membres du groupe au moyen de נֶפֶשׁ. « Au nombre de soixante-dix personnes » restitue naturellement en français le sens collectif sans donner à « âme » son sens moderne habituel.
- source_word: יָרְדוּ
  choice: sont descendus
  rationale: Le verbe ירד désigne ici le déplacement vers l’Égypte selon l’expression géographique conventionnelle « descendre en Égypte ».
- source_word: אֲבֹתֶיךָ
  choice: tes pères
  rationale: Le terme hébreu est explicitement masculin pluriel. « Tes pères » en garde la forme, tandis qu’une note signale le sens référentiel possible « tes ancêtres ».
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: La terminaison directionnelle exprime un mouvement vers l’Égypte. En français, « descendre en Égypte » est la tournure naturelle.
- source_word: וְעַתָּה
  choice: et maintenant
  rationale: Cette traduction conserve à la fois la coordination hébraïque et le contraste temporel entre le petit groupe initial et la multitude présente.
- source_word: שָׂמְךָ
  choice: t’a rendu
  rationale: Bien que שׂים signifie fondamentalement « placer, établir », il décrit ici l’état résultant du peuple devenu très nombreux ; « t’a rendu » exprime cet emploi idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: La forme porte un suffixe masculin singulier de deuxième personne, rendu directement par « ton Dieu ».
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: aussi nombreux que les étoiles du ciel
  rationale: La comparaison porte sur l’abondance numérique. Cette formulation française rend conjointement l’image des étoiles et la valeur de לָרֹב.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » préserve le caractère personnel du nom sans lui substituer un titre.
- issue: Terme ancestral masculin אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Le texte hébreu emploie le masculin « pères ». Le texte principal le conserve, sans masquer que le terme désigne les ascendants d’Israël.
- issue: Adresse collective au singulier
  choice: t’a rendu aussi nombreux
  alternative: vous a rendus aussi nombreux
  rationale: Les suffixes hébreux s’adressent à Israël au masculin singulier collectif. Le français maintient ce singulier afin de préserver la représentation du peuple comme une unité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’adresse collective à Israël au singulier et le contraste entre les soixante-dix personnes d’origine et la multitude présente.
