source:
  edition: WLC
  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: fr
  text: pour observer[a] les commandements de Yahweh et ses prescriptions que je te commande aujourd’hui, pour ton bien ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « garder » ; le verbe peut évoquer à la fois l’obéissance et la vigilance avec laquelle on veille sur les commandements.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: pour observer
  rationale: L’infinitif construit précédé de לְ prolonge l’énoncé de ce que Yahweh demande au verset précédent. « Observer » exprime naturellement l’obéissance concrète aux commandements, tout en conservant la nuance de vigilance attachée au verbe שׁמר.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Le pluriel construit de מִצְוָה désigne les obligations ordonnées par Yahweh. « Commandements » maintient le registre juridique et d’alliance propre au Deutéronome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin, plutôt que par la substitution d’un titre.
- source_word: חֻקֹּתָיו
  choice: ses prescriptions
  rationale: חֻקִּים désigne ici des dispositions établies. « Prescriptions » est clair en français moderne, garde le registre juridique et se distingue convenablement de « commandements ».
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: Dans ce contexte, « donner » sous-entend naturellement « donner comme commandement » et évite la répétition lourde de « commandements que je te commande ». Le singulier « te » suit l’adresse hébraïque à Israël comme interlocuteur collectif, et « aujourd’hui » conserve l’immédiateté de l’alliance.
- source_word: לְטוֹב לָךְ
  choice: pour ton bien
  rationale: Cette expression indique que les prescriptions visent le bien ou le bénéfice d’Israël. « Pour ton bien » est concis, idiomatique et fidèle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom propre de Dieu. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Lien de לְטוֹב לָךְ avec l’ordre divin
  choice: pour ton bien
  alternative: pour ton bonheur
  rationale: La formulation conserve la finalité bénéfique des commandements sans réduire טוֹב au seul bonheur affectif ni préciser excessivement la nature de ce bien.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste syntaxiquement liée au verset précédent et conserve donc le point d’interrogation. « Prescriptions » maintient le registre d’alliance sans archaïsme marqué.
