source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: fr
  text: Et maintenant, Israël, qu’est-ce que Yahweh ton Dieu te demande, sinon de craindre Yahweh ton Dieu, de marcher dans toutes ses voies, de l’aimer et de servir Yahweh ton Dieu de tout ton cœur et de toute ton âme[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute ta vie » ou « de tout ton être ». Le mot hébreu peut désigner l’âme, la vie ou la personne elle-même selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec le discours précédent et la transition vers l’exhortation présente.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: qu’est-ce que ... te demande
  rationale: Formulation française naturelle qui maintient la question rhétorique; le contexte donne à la demande une portée obligatoire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé dans le texte hébreu au lieu de lui substituer un titre.
- source_word: כִּי אִם
  choice: sinon
  rationale: Introduit naturellement en français le contenu exclusif de ce que Dieu demande.
- source_word: לְיִרְאָה
  choice: craindre
  rationale: Préserve la force du verbe hébreu et sa tension entre crainte, respect profond et fidélité obéissante.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: marcher dans toutes ses voies
  rationale: Conserve la métaphore éthique hébraïque, compréhensible dans un registre biblique français digne.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: l’aimer
  rationale: Rend directement l’amour envers Yahweh, sans ajouter d’interprétation.
- source_word: וְלַעֲבֹד
  choice: servir
  rationale: Couvre l’obéissance et le service cultuel sans réduire le sens au seul culte.
- source_word: בְּכָל לְבָבְךָ
  choice: de tout ton cœur
  rationale: Expression française établie qui désigne l’intériorité, la volonté et la pensée dans leur totalité.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: de toute ton âme
  rationale: Conserve l’expression traditionnelle tout en signalant en note que נֶפֶשׁ peut aussi désigner la vie ou l’être entier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le nom propre divin; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Portée de ירא dans l’exhortation d’alliance
  choice: craindre
  alternative: révérer; respecter profondément
  rationale: « Craindre » maintient ensemble la crainte, la révérence et l’obéissance dévouée, sans atténuer la tension du texte.
- issue: Sens anthropologique de נֶפֶשׁ
  choice: âme
  alternative: vie; être entier
  rationale: « Âme » convient à la paire traditionnelle « cœur et âme », mais ne doit pas être compris comme imposant une conception dualiste étrangère à la gamme de sens du terme hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme entité collective. La métaphore « marcher dans ses voies » et le verbe « craindre » sont maintenus afin de préserver la texture et la tension théologique du texte source.
