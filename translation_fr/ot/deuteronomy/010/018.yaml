source:
  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: fr
  text: Il rend justice à l’orphelin[a] et à la veuve, et il aime l’étranger résident[b], en lui donnant de la nourriture et des vêtements[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne plus précisément une personne privée de père ; on pourrait aussi traduire « celui qui est sans père ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’immigré » ou « l’étranger qui réside dans la communauté ». Le terme hébreu désigne une personne venue d’ailleurs et établie parmi la population, non un simple voyageur de passage.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « du pain et un vêtement ». Ici, le pain représente la nourriture ou la subsistance en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: rend justice
  rationale: L’expression hébraïque désigne l’exercice concret de la justice. « Rend justice » est idiomatique en français moderne et conserve sa force judiciaire.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: Le mot hébreu désigne plus précisément une personne privée de père, mais « orphelin » est le terme français courant pour cette catégorie sociale vulnérable; la nuance est signalée en note.
- source_word: אַלְמָנָה
  choice: la veuve
  rationale: Équivalent français direct et précis de la catégorie sociale mentionnée.
- source_word: אֹהֵב
  choice: aime
  rationale: Cette traduction directe conserve la force relationnelle du participe hébreu sans la réduire à une émotion ni à une simple bienveillance juridique.
- source_word: גֵּר
  choice: l’étranger qui réside parmi eux
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté, et non un voyageur de passage. Cette formulation naturelle explicite cette dimension résidentielle.
- source_word: לָתֶת לוֹ
  choice: en lui donnant
  rationale: L’infinitif précise concrètement comment cet amour se manifeste; le gérondif établit clairement ce lien en français.
- source_word: לֶחֶם
  choice: de la nourriture
  rationale: Bien que le sens littéral soit « pain », le mot désigne ici par extension la subsistance, en parallèle avec les vêtements.
- source_word: שִׂמְלָה
  choice: des vêtements
  rationale: Le pluriel collectif français exprime naturellement le sens général de vêtement ou d’habit.
theological_decisions:
- issue: La sollicitude divine envers les personnes vulnérables
  choice: Présenter à la fois l’action judiciaire de Dieu, son amour et le secours matériel qui en découle.
  alternative: Réduire le verset soit à la défense juridique, soit à la compassion affective.
  rationale: L’hébreu associe explicitement la justice rendue, l’amour et la fourniture des besoins essentiels; la traduction maintient ensemble ces dimensions sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « L’étranger qui réside parmi eux » évite le caractère archaïque de « l’étranger en séjour » tout en conservant le statut résidentiel de גֵּר. Le pronom « eux » renvoie au peuple d’Israël dans le contexte immédiat.
