source:
  edition: WLC
  text: וּ/מַלְתֶּ֕ם אֵ֖ת עָרְלַ֣ת לְבַבְ/כֶ֑ם וְ/עָ֨רְפְּ/כֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: fr
  text: Circoncisez donc le prépuce de votre cœur[a][b], et ne raidissez plus votre cou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et circoncisez le prépuce de votre cœur. » La conjonction peut être simplement connective, bien que le contexte permette aussi le sens déductif rendu par « donc ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu conserve littéralement la métaphore du « prépuce de votre cœur », image qui évoque le retrait de la résistance intérieure à Dieu.
    reason: cultural_note
  - marker: c
    text: 'Ou : « n’endurcissez plus votre cou » ; autre traduction possible : « ne soyez plus obstinés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Circoncisez donc
  rationale: Le qatal qal à la 2e personne du pluriel, précédé de la conjonction, prend ici une valeur exhortative. « donc » exprime naturellement la portée déductive du contexte, tout en laissant en note la simple valeur connective.
- source_word: עָרְלַת לְבַבְכֶם
  choice: le prépuce de votre cœur
  rationale: La construction concrète de l’hébreu est conservée afin de maintenir l’image d’alliance et sa force morale, sans la réduire à une paraphrase interprétative.
- source_word: לְבַבְכֶם
  choice: votre cœur
  rationale: En hébreu, le cœur désigne largement l’être intérieur, notamment la volonté et l’intelligence. « cœur » demeure en français l’équivalent naturel et préserve la métaphore.
- source_word: וְעָרְפְּכֶם
  choice: votre cou
  rationale: עֹרֶף désigne le cou ou la nuque. « cou » permet de conserver directement l’image hébraïque de la résistance obstinée.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: ne raidissez plus
  rationale: Le hifil de קשׁה signifie rendre dur ou raide. Avec « cou » comme complément, « ne raidissez plus » restitue l’image et rend naturellement עוֹד dans cette interdiction.
theological_decisions:
- issue: Langage métaphorique de la circoncision intérieure dans le cadre de l’alliance
  choice: Conserver explicitement « le prépuce de votre cœur »
  alternative: « Purifiez votre cœur » ou « débarrassez votre cœur de son obstination »
  rationale: Le texte applique l’image de la circoncision à la disposition intérieure. La conserver évite d’imposer une interprétation doctrinale plus étroite et maintient la tension entre signe extérieur et obéissance intérieure.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore concrète de l’hébreu est maintenue malgré son caractère inhabituel en français ; la syntaxe reste directe et accessible.
