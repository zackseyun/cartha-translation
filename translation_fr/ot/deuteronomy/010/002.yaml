id: DEU.10.2
reference: Deuteronomy 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: fr
  text: Et j’écrirai sur les tablettes les paroles[a] qui se trouvaient sur les premières tablettes, celles que tu as brisées, et tu les placeras dans l’arche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les commandements » ; hébreu : « les paroles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: Et j’écrirai
  rationale: Le qal inaccompli à la première personne du singulier, précédé de la conjonction, exprime ici l’action future promise par Dieu.
- source_word: הַלֻּחֹת
  choice: les tablettes
  rationale: « Tablettes » rend naturellement לֻחֹת. La pierre est précisée dans le verset précédent, mais non répétée ici.
- source_word: הַדְּבָרִים
  choice: les paroles
  rationale: דְּבָרִים désigne ici les paroles de l’alliance inscrites sur les tablettes. « Paroles » reste proche de l’hébreu sans réduire explicitement le terme à « commandements ».
- source_word: אֲשֶׁר הָיוּ עַל
  choice: qui se trouvaient sur
  rationale: Cette formulation française naturelle conserve l’idée littérale des paroles qui étaient sur les premières tablettes.
- source_word: הָרִאשֹׁנִים
  choice: les premières
  rationale: L’adjectif distingue le premier jeu de tablettes de celui qui doit le remplacer.
- source_word: שִׁבַּרְתָּ
  choice: tu as brisées
  rationale: Le piel accompli de שׁבר indique que Moïse a cassé les tablettes ; « brisées » est précis sans accentuer excessivement la manière.
- source_word: וְשַׂמְתָּם
  choice: et tu les placeras
  rationale: Le verbe שׂים signifie mettre ou placer. Le futur convient à l’instruction, et le pronom pluriel renvoie naturellement aux tablettes dans ce contexte.
- source_word: בָּאָרוֹן
  choice: dans l’arche
  rationale: אָרוֹן désigne ici le coffre sacré que Moïse doit fabriquer. « Arche » est le terme français traditionnel et immédiatement reconnaissable dans ce contexte.
theological_decisions:
- issue: Référent du suffixe pronominal dans וְשַׂמְתָּם (« tu les placeras »)
  choice: Le pronom est compris comme renvoyant aux tablettes.
  alternative: Le pronom pourrait grammaticalement renvoyer aux paroles ou commandements inscrits sur les tablettes.
  rationale: Les deux antécédents sont masculins pluriels en hébreu, mais l’action matérielle de placer quelque chose dans l’arche et le contexte de Deutéronome 10.1-5 indiquent que les tablettes sont le référent attendu. Le français conserve néanmoins un pronom qui ne sur-explicite pas le texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit étroitement l’enchaînement hébreu tout en restant naturelle ; « arche » préserve le vocabulaire biblique établi.
