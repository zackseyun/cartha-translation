source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: fr
  text: Puis je me suis retourné et je suis descendu de la montagne. J’ai placé les tablettes dans le coffre que j’avais fabriqué, et elles y étaient[a], comme Yahweh me l’avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elles furent là » ou « elles étaient là » ; la formulation peut aussi indiquer qu’elles y demeuraient encore au moment où Moïse parlait.'
    reason: La tournure hébraïque וַיִּהְיוּ שָׁם peut décrire leur présence dans le passé ou suggérer qu’elle se prolongeait jusqu’au temps du discours.
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Puis je me suis retourné
  rationale: Le verbe פנה signifie « se tourner, se retourner ». « Puis » rend naturellement la progression du récit marquée par le waw consécutif.
- source_word: וָאֵרֵד מִן הָהָר
  choice: je suis descendu de la montagne
  rationale: ירד exprime un mouvement vers le bas, et l’article défini de הָהָר est conservé par « la montagne ».
- source_word: וָאָשִׂם
  choice: j’ai placé
  rationale: שׂים signifie couramment « mettre, placer ». « Placer » convient au registre digne tout en restant naturel.
- source_word: הַלֻּחֹת
  choice: les tablettes
  rationale: לֻחוֹת désigne ici les tablettes déjà identifiées par le contexte. Il n’est pas nécessaire d’ajouter « de pierre », absent de cette proposition.
- source_word: בָּאָרוֹן
  choice: dans le coffre
  rationale: אָרוֹן désigne un coffre ou une arche. « Coffre » transmet directement le sens concret du terme en français moderne sans dépendre d’un vocabulaire religieux spécialisé.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que j’avais fabriqué
  rationale: Le plus-que-parfait français indique naturellement que la fabrication du coffre précède le dépôt des tablettes, sans modifier le rapport temporel du texte.
- source_word: וַיִּהְיוּ שָׁם
  choice: et elles y sont restées
  rationale: La tournure exprime leur présence à cet endroit et peut suggérer qu’elle s’est prolongée jusqu’au moment où Moïse parle. « Sont restées » garde cette portée sans imposer lourdement « encore ».
- source_word: כַּאֲשֶׁר צִוַּנִי יְהוָה
  choice: comme Yahweh me l’avait ordonné
  rationale: כַּאֲשֶׁר marque la conformité, rendue par « comme ». Le pronom « l’ » reprend naturellement en français l’action commandée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel du Dieu d’Israël sans lui substituer un titre.
- issue: Durée de la présence des tablettes dans le coffre
  choice: elles y sont restées
  alternative: elles y étaient / elles furent là
  rationale: La formulation choisie laisse entendre une présence prolongée, possible dans le contexte, tout en signalant en note que l’hébreu peut être rendu de façon plus strictement stative.
translation_notes:
  register: Français international actuel, clair et digne. Le passé composé maintient une narration accessible ; « coffre » rend concrètement אָרוֹן, tandis que « Yahweh » conserve le nom divin.
