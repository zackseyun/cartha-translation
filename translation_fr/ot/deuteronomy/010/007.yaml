    issue: La relative verbale « où coulaient des cours d’eau » ajoute un aspect passé et verbal absent du syntagme nominal hébreu.
    rationale: אֶרֶץ נַחֲלֵי מָיִם décrit Yotbata comme une terre/région caractérisée par des cours d’eau. Une construction nominale française préserve mieux cette formulation.
  - severity: low
    issue: La note propose « des oueds remplis d’eau ».
    rationale: « Remplis d’eau » explicite un état de plénitude qui n’est pas formulé dans le texte. « Oueds » ou « lits de torrent » peut être proposé comme possibilité lexicale sans cet ajout.
