base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: fr
  text: De là, ils partirent pour Goudgoda, et de Goudgoda pour Yotbata, une région aux cours d’eau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une région de torrents » ou « une région avec des oueds ». L’expression hébraïque peut désigner des cours d’eau, des torrents ou des lits de cours d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: De là
  rationale: La préposition jointe à l’adverbe indique le point de départ depuis le lieu précédent. « De là » rend naturellement la continuité géographique de l’itinéraire.
- source_word: נָסְעוּ
  choice: ils partirent
  rationale: Dans les récits de déplacement au désert, נסע désigne souvent le fait de lever le camp et de se mettre en route. « Ils partirent » conserve cette idée dans un français courant et concis.
- source_word: הַגֻּדְגֹּדָה
  choice: Goudgoda
  rationale: Le nom de lieu est translittéré selon une forme adaptée à la phonétique et aux conventions graphiques françaises.
- source_word: וּמִן
  choice: et de
  rationale: La conjonction et la préposition poursuivent simplement l’énumération des étapes, sans qu’il soit nécessaire d’ajouter une nuance temporelle.
- source_word: יָטְבָתָה
  choice: Yotbata
  rationale: Le nom propre est translittéré en français ; « Y » représente ici naturellement la consonne initiale hébraïque.
- source_word: אֶרֶץ
  choice: une région
  rationale: Dans cette apposition descriptive, « région » est plus naturel que « terre » et n’introduit pas la connotation politique que pourrait avoir « pays ».
- source_word: נַחֲלֵי מָיִם
  choice: où coulaient des cours d’eau
  rationale: נַחַל peut désigner un torrent, un oued ou son chenal. « Cours d’eau » reste accessible et préserve l’idée de canaux naturels contenant de l’eau ; la tournure verbale produit un français idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Les noms de lieux suivent une translittération francisée, et l’apposition finale est rendue idiomatiquement sans accentuer artificiellement l’idée d’abondance.
