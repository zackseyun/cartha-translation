source:
  edition: WLC
  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: fr
  text: Quant à moi, je restai sur la montagne comme la première fois, quarante jours et quarante nuits. Cette fois encore, Yahweh m’écouta[a] ; Yahweh ne voulut pas te détruire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’entendit ». Le verbe hébreu peut désigner le fait d’entendre aussi bien que celui d’écouter favorablement et de donner suite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Quant à moi
  rationale: La conjonction suivie du pronom indépendant marque une légère mise en relief et reprend le récit centré sur Moïse.
- source_word: עָמַדְתִּי
  choice: je restai
  rationale: Le verbe signifie littéralement « se tenir », mais décrit ici la présence prolongée de Moïse sur la montagne ; « rester » exprime naturellement ce sens contextuel en français.
- source_word: בָהָר
  choice: sur la montagne
  rationale: Cette préposition désigne ici la présence de Moïse sur le mont ; « sur la montagne » est l’expression française courante.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: comme la première fois
  rationale: L’expression compare ce séjour à la première période de quarante jours. Cette formulation naturelle restitue le renvoi à l’occasion antérieure sans laisser croire qu’il ne s’agit que des tout premiers jours.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: quarante jours et quarante nuits
  rationale: Traduction directe et consacrée de la formule de durée.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh m’écouta
  rationale: Avec la préposition אֶל, שׁמע peut exprimer une écoute favorable. « M’écouta » conserve à la fois l’acte d’entendre et l’idée d’une réponse favorable, sans expliciter davantage que l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: Cette fois encore
  rationale: La formulation rend clairement la répétition de l’accueil favorable de l’intercession lors de cette occasion.
- source_word: לֹא אָבָה
  choice: ne voulut pas
  rationale: Le verbe exprime le refus ou l’absence de volonté ; « ne voulut pas » en préserve la nuance volitive.
- source_word: הַשְׁחִיתֶךָ
  choice: te détruire
  rationale: Le causatif exprime ici la destruction menacée d’Israël. Le pronom singulier « te » respecte l’adresse collective au peuple sous une forme grammaticale singulière.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme ; « Yahweh » conserve le nom propre de l’alliance sans lui substituer un titre.
- issue: Portée de וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh m’écouta
  alternative: Yahweh m’entendit
  rationale: Dans le contexte de l’intercession de Moïse, le verbe peut désigner une écoute favorable. La traduction retenue maintient cette nuance tout en évitant d’ajouter une description précise de la réponse divine.
- issue: Destinataire singulier de הַשְׁחִיתֶךָ
  choice: te détruire
  alternative: vous détruire
  rationale: L’hébreu s’adresse grammaticalement au peuple d’Israël au singulier. Le français « te » préserve cette personnification collective et la tension entre l’individu grammatical et la communauté visée.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation en deux phrases allège une longue coordination hébraïque tout en maintenant l’enchaînement logique. Le tutoiement singulier conserve l’adresse collective de l’hébreu à Israël.
