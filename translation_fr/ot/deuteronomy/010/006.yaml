  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: fr
  text: Les fils d’Israël partirent de Beéroth-Bené-Jaakan pour Moséra[a]. Là, Aaron mourut et y fut enterré[b] ; son fils Éléazar exerça la fonction de prêtre à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Beéroth-Bené-Jaakan peut se comprendre littéralement comme « les puits des fils de Jaakan » ; il est rendu ici comme un nom de lieu, par translittération.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Son fils Éléazar exerça la fonction de prêtre après lui. » L’hébreu dit littéralement « à sa place », ce qui indique la succession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël
  rationale: Cette formulation conserve l’expression généalogique et nationale de l’hébreu. La conjonction initiale n’est pas rendue séparément, car le français peut marquer naturellement la transition narrative sans ajouter « alors » ou « maintenant ».
- source_word: נָסְעוּ
  choice: partirent
  rationale: Dans les récits d’itinéraire, נסע désigne le fait de lever le camp et de se mettre en route. « Partirent » est naturel et convient à la construction indiquant le point de départ et la destination.
- source_word: מִבְּאֵרֹת בְּנֵי יַעֲקָן
  choice: de Beéroth-Bené-Jaakan
  rationale: L’expression est traitée comme un toponyme et translittérée plutôt que traduite littéralement. Le préfixe מִן est rendu par « de ».
- source_word: מוֹסֵרָה
  choice: pour Moséra
  rationale: Même sans préposition explicite devant le nom, la formule d’itinéraire implique une destination. « Pour » l’exprime idiomatiquement en français.
- source_word: שָׁם מֵת אַהֲרֹן וַיִּקָּבֵר שָׁם
  choice: C’est là qu’Aaron mourut et fut enterré
  rationale: '« C’est là que » préserve l’insistance locative du premier שָׁם. La seconde occurrence est intégrée à la même construction en français afin d’éviter une répétition pesante, tout en rapportant les deux événements au même lieu. Le niphal וַיִּקָּבֵר reste passif : « fut enterré ».'
- source_word: וַיְכַהֵן
  choice: exerça la fonction de prêtre
  rationale: Le verbe signifie agir ou servir comme prêtre. Cette expression française claire décrit l’exercice effectif de la fonction, et non simplement l’accession au titre.
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: Son fils Éléazar exerça la fonction de prêtre à sa place
  rationale: תַּחְתָּיו indique qu’Éléazar succède à Aaron et prend sa place. « À sa place » conserve directement cette idée sans langage archaïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent une translittération francisée. Le passé simple convient au registre narratif biblique sans être archaïque. Aucun marqueur de note n’est ajouté sur la succession d’Éléazar, car « à sa place » traduit directement תַּחְתָּיו et la variante « après lui » n’est pas nécessaire à la compréhension.
