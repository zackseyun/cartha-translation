  terminology: Les noms et les termes sacerdotaux sont cohérents. « À sa place » traduit directement תַּחְתָּיו et conserve l’idée de succession sans surinterprétation. La note anglaise relative à cette expression devrait être conservée avec son ancre, puisqu’elle documente une alternative lexicale pertinente.
