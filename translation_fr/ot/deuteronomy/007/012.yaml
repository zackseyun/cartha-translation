source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: fr
  text: Si vous écoutez ces prescriptions[a], si vous les gardez et les mettez en pratique, Yahweh, votre Dieu, gardera pour vous l’alliance et l’amour fidèle[b] qu’il a promis par serment à vos pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces règles », « ces ordonnances » ou « ces décisions de justice ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ḥésed désigne ici un amour loyal et durable, lié à l’alliance; on pourrait aussi traduire par « fidélité à l’alliance » ou « bienveillance fidèle ».
    reason: lexical_alternative
  - marker: c
    text: Ou « à vos ancêtres »; l’hébreu dit littéralement « à vos pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: Si
  rationale: Dans ce contexte, l’expression introduit la conséquence liée à la condition qui suit. La tournure conditionnelle française restitue naturellement ce rapport sans l’alourdir par un calque comme « Et il arrivera, parce que ».
- source_word: תִּשְׁמְעוּן
  choice: vous écoutez
  rationale: שׁמע associe souvent l’écoute à une réponse obéissante. « Écoutez » conserve cette nuance auditive, tandis que les verbes suivants explicitent la mise en œuvre.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: ces prescriptions
  rationale: מִשְׁפָּטִים désigne ici des dispositions normatives. « Prescriptions » est naturel en français juridique et religieux, tout en restant distinct d’autres termes législatifs du Deutéronome.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: si vous les gardez et les mettez en pratique
  rationale: 'Les deux verbes hébreux sont maintenus : « garder » exprime l’observance vigilante, et « mettre en pratique » rend idiomatiquement l’action de les faire.'
- source_word: וְשָׁמַר
  choice: gardera
  rationale: La répétition de שׁמר est conservée afin de faire entendre le lien entre l’observance d’Israël et la fidélité de Dieu envers son alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le singulier hébreu est conservé, malgré le pluriel des verbes précédents, afin de respecter le changement de nombre du discours adressé à Israël.
- source_word: לְךָ
  choice: envers toi
  rationale: La tournure exprime naturellement en français le bénéficiaire de la fidélité de Yahweh et s’accorde avec « garder l’alliance envers quelqu’un ».
- source_word: הַבְּרִית
  choice: l’alliance
  rationale: « Alliance » est le terme français établi pour בְּרִית et conserve sa portée relationnelle et juridique.
- source_word: הַחֶסֶד
  choice: l’amour fidèle
  rationale: חֶסֶד associe amour, loyauté et engagement durable. « Amour fidèle » préserve ces dimensions sans réduire le terme à la seule compassion ou à une obligation juridique.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: qu’il a juré
  rationale: Le verbe désigne un engagement confirmé par serment. La formulation concise garde la force solennelle de l’hébreu.
- source_word: לַאֲבֹתֶיךָ
  choice: à tes pères
  rationale: Le texte hébreu désigne explicitement les pères, c’est-à-dire les ancêtres patriarcaux; cette référence masculine est conservée.
theological_decisions:
- issue: Sens de חֶסֶד dans le cadre de l’alliance
  choice: l’amour fidèle
  alternative: la fidélité à l’alliance ; la bonté ; la bienveillance
  rationale: « Amour fidèle » maintient ensemble la faveur aimante et la loyauté durable propres au terme, sans trancher en faveur d’une lecture seulement affective ou seulement juridique.
- issue: Changement du pluriel au singulier dans l’adresse à Israël
  choice: « vous » puis « ton Dieu… envers toi »
  alternative: 'uniformiser au pluriel : « votre Dieu… envers vous »'
  rationale: Le passage de formes verbales au pluriel à des suffixes au singulier figure dans le texte hébreu. Le conserver fait entendre Israël à la fois comme communauté et comme interlocuteur collectif.
- issue: Référence masculine de לַאֲבֹתֶיךָ
  choice: à tes pères
  alternative: à tes ancêtres
  rationale: Le contexte renvoie aux pères patriarcaux. La traduction ne neutralise donc pas cette référence explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle évite un calque lourd de l’idiome hébreu. Le passage intentionnel de « vous » à « ton/toi » conserve le changement de nombre du texte source, même s’il est inhabituel en français.
