  source_fidelity: Le rapport condition-conséquence, la triple séquence écouter–garder–faire, la répétition de « garder », ainsi que « alliance », ḥésed et « pères » sont globalement bien rendus. Toutefois, le passage direct de « vous » à « ton/toi/tes » est grammaticalement heurté en français. Les suffixes singuliers hébreux peuvent désigner Israël collectivement; le pluriel français permet de rendre l’adresse de façon idiomatique sans modifier le sens collectif.
  naturalness: La répétition de « si » est lourde, et « Yahweh ton Dieu » après « vous » n’est pas naturel en français moderne. « Promis par serment » rend clairement le verbe « jurer » sans la construction française maladroite « l’amour ... qu’il a juré ».
  terminology: « Prescriptions », « alliance » et « amour fidèle » conviennent. Le nom Yahweh est conservé. La note sur ḥésed est utile; « pères » maintient la référence masculine explicite du texte.
