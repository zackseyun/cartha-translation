    issue: Incohérence d’adresse entre « vous » et « ton/toi/tes ».
    rationale: Les verbes hébreux sont au pluriel tandis que les suffixes sont au singulier, probablement collectif. Reproduire ce changement tel quel produit en français une discordance d’adresse inutilement déroutante. Le pluriel français rend l’interlocuteur collectif de manière naturelle.
  - severity: low
    issue: Double emploi de « si » et formulation du serment peu idiomatique.
    rationale: « Si vous écoutez..., si vous les gardez » alourdit une seule protase. « Qu’il a juré » avec deux compléments coordonnés est ambigu et maladroit; « qu’il a promis par serment » exprime fidèlement l’engagement juré.
