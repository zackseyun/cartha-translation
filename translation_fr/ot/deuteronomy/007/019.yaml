  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: fr
  text: les grandes épreuves que tes yeux ont vues[a], les signes, les prodiges, la main forte et le bras étendu par lesquels Yahweh ton Dieu t’a fait sortir. Ainsi Yahweh ton Dieu agira envers tous les peuples dont tu as peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les grandes mises à l’épreuve ». Le terme hébreu peut désigner des épreuves sévères ou des mises à l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: les grandes épreuves
  rationale: Le terme מַסּוֹת peut désigner des épreuves ou des mises à l’épreuve. « Épreuves » convient au contexte des actes redoutables accomplis en Égypte sans suggérer une incitation au mal.
- source_word: רָאוּ עֵינֶיךָ
  choice: que tes yeux ont vues
  rationale: Cette formulation conserve l’expression hébraïque emphatique et son évocation directe de l’expérience du témoin.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: les signes, les prodiges
  rationale: « Signes » rend naturellement אוֹתֹת, tandis que « prodiges » préserve la nuance d’actes extraordinaires suscitant l’étonnement et l’association traditionnelle des deux termes.
- source_word: הַיָּד הַחֲזָקָה
  choice: la main forte
  rationale: Cette traduction directe préserve la métaphore hébraïque de la puissance divine et demeure naturelle en français biblique moderne.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: le bras étendu
  rationale: L’expression conserve l’image hébraïque consacrée de la puissance divine activement déployée pour délivrer et juger.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: par lesquels ... t’a fait sortir
  rationale: Le relatif pluriel reprend naturellement en français la main et le bras comme moyens imagés de la délivrance. La forme causative de יצא est rendue par « faire sortir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כֵּן יַעֲשֶׂה
  choice: Ainsi fera
  rationale: Cette tournure concise exprime la comparaison entre les actes accomplis lors de la sortie d’Égypte et ceux que Dieu accomplira encore.
- source_word: לְכָל הָעַמִּים
  choice: à tous les peuples
  rationale: « Peuples » correspond directement au pluriel עַמִּים, et « à » laisse ouverte la valeur contextuelle de la préposition ל.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: dont tu as peur
  rationale: Cette formulation française naturelle rend l’idiome hébreu exprimant la crainte éprouvée devant ces peuples.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Portée du relatif אֲשֶׁר après les images de la main et du bras
  choice: par lesquels
  alternative: par lequel
  rationale: Le français peut faire reprendre par le relatif les deux images coordonnées, sans trancher artificiellement en faveur du seul « bras étendu ».
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque à Israël. Les images concrètes de la main forte et du bras étendu sont conservées, de même que la répétition du nom divin.
