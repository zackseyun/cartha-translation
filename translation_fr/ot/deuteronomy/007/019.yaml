    issue: Tournure « Ainsi fera ... à tous les peuples »
    rationale: Bien qu’elle soit calquée sur le verbe hébreu avec ל, cette construction est maladroite en français contemporain. « Agira envers » exprime naturellement l’action annoncée contre/à l’égard des peuples concernés, sans en préciser indûment la nature.
  revised_text: les grandes épreuves que tes yeux ont vues[a], les signes, les prodiges, la main forte et le bras étendu par lesquels Yahweh ton Dieu t’a fait sortir. Ainsi Yahweh ton Dieu agira envers tous les peuples dont tu as peur.
