  text: לֹ֥א תִירָ֖א מֵ/הֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר עָשָׂה֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/פַרְעֹ֖ה וּ/לְ/כָל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: fr
  text: Tu ne les craindras pas ; souviens-toi bien[a] de ce que Yahweh, ton Dieu, a fait à Pharaon et à toute l’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « te souvenir, tu te souviendras », tournure emphatique qui signifie « souviens-toi bien » ou « souviens-toi certainement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: Tu ne les craindras pas
  rationale: Dans ce contexte d’exhortation, l’imparfait précédé de לֹא exprime une interdiction solennelle. Le complément introduit par מִן désigne ici l’objet de la crainte ; « les craindre » est naturel et précis en français.
- source_word: זָכֹר תִּזְכֹּר
  choice: souviens-toi bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Souviens-toi bien » restitue cette insistance dans un français naturel, sans ajouter l’idée de diligence absente du texte.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: de ce que ... a fait
  rationale: Cette tournure rend naturellement l’objet de « se souvenir ». Le passé composé présente les actes accomplis de Dieu comme des faits historiques pertinents pour l’exhortation présente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe est à la deuxième personne masculine du singulier, conformément à l’adresse collective à Israël au singulier.
- source_word: לְפַרְעֹה
  choice: au pharaon
  rationale: Avec עשה, la préposition לְ indique la personne touchée par l’action. « Ce qu’il a fait au pharaon » est idiomatique en français.
- source_word: וּלְכָל מִצְרָיִם
  choice: et à toute l’Égypte
  rationale: L’hébreu désigne collectivement l’Égypte, et non explicitement les Égyptiens. « Toute l’Égypte » préserve cette portée nationale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom d’alliance sous une forme largement reconnue, sans le remplacer par un titre.
- issue: Force de l’exhortation זָכֹר תִּזְכֹּר
  choice: souviens-toi bien
  alternative: tu te souviendras certainement
  rationale: La construction est emphatique, mais elle ne doit pas être transformée en simple prédiction. Le français impératif renforcé conserve à la fois l’exhortation et l’insistance.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement singulier reproduit l’adresse d’alliance à Israël au masculin singulier. Le point-virgule conserve le lien étroit entre l’interdiction de craindre et l’appel à se rappeler les actes passés de Dieu.
