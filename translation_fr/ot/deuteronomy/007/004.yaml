  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: fr
  text: Car il détournera ton fils de me suivre[a], et ils serviront d’autres dieux[b]. Alors la colère de Yahweh s’enflammera contre vous, et il te détruira rapidement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de derrière moi »; cette expression signifie ici cesser de suivre Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe du singulier (« ton fils ») au pluriel (« ils serviront »), ce qui peut élargir l’avertissement à la famille ou à la communauté qui en résultera.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’interdiction formulée au verset précédent.
- source_word: יָסִיר
  choice: il détournera
  rationale: 'Le hiphil de סור exprime ici la causalité : la personne visée amènera le fils à se détourner.'
- source_word: בִּנְךָ
  choice: ton fils
  rationale: Conserve le masculin singulier de l’hébreu et le lien précis avec le contexte immédiat.
- source_word: מֵאַחֲרַי
  choice: de moi
  rationale: Dans la construction « détourner quelqu’un de derrière moi », l’expression signifie l’écarter de la fidélité à Yahweh; « de moi » est naturel en français, tandis qu’une note préserve l’image hébraïque.
- source_word: וְעָבְדוּ
  choice: et ils serviront
  rationale: Conserve le pluriel du verbe hébreu malgré le passage du singulier « ton fils » au pluriel.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Rend directement la désignation hébraïque sans préciser davantage leur caractère étranger.
- source_word: וְחָרָה אַף יְהוָה
  choice: Alors la colère de Yahweh s’enflammera
  rationale: Préserve l’image vive d’une colère qui brûle et exprime naturellement la conséquence en français.
- source_word: בָּכֶם
  choice: contre vous
  rationale: Le pluriel hébreu désigne la collectivité contre laquelle se dirige la colère divine.
- source_word: וְהִשְׁמִידְךָ
  choice: et il te détruira
  rationale: Conserve à la fois la force du hiphil de שׁמד et le singulier collectif du pronom.
- source_word: מַהֵר
  choice: rapidement
  rationale: Exprime la rapidité du jugement sans transformer nécessairement celle-ci en proximité temporelle.
theological_decisions:
- issue: Passage du singulier au pluriel dans l’avertissement
  choice: Conserver « ton fils » puis « ils serviront »
  alternative: 'Harmoniser au singulier : « il servira d’autres dieux »'
  rationale: Le texte hébreu passe réellement du singulier au pluriel. Le maintien de ce changement préserve l’ambiguïté entre le fils particulier et les conséquences familiales ou communautaires plus larges.
- issue: Nombre des destinataires dans le jugement
  choice: Conserver « contre vous » puis « il te détruira »
  alternative: Harmoniser les deux pronoms au pluriel ou au singulier
  rationale: L’hébreu passe du pluriel בָּכֶם au singulier collectif וְהִשְׁמִידְךָ. La traduction garde cette tension grammaticale et rhétorique.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les changements de nombre du texte hébreu ainsi que la métaphore de la colère qui s’enflamme.
