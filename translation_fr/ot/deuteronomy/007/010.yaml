  text: וּ/מְשַׁלֵּ֧ם לְ/שֹׂנְאָ֛י/ו אֶל פָּנָ֖י/ו לְ/הַאֲבִיד֑/וֹ לֹ֤א יְאַחֵר֙ לְ/שֹׂ֣נְא֔/וֹ אֶל פָּנָ֖י/ו יְשַׁלֶּם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: fr
  text: 'Il rétribue ceux qui le haïssent, en face d’eux[a], pour les faire périr. Il ne tarde pas envers celui qui le hait : il le rétribue en face de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers leur face / sa face ». L’expression peut aussi se comprendre comme « devant eux / lui » ou « en leur / sa présence »; elle souligne ici le caractère direct de la rétribution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: Il rend … ce qu’ils méritent
  rationale: Le piel de שׁלם exprime ici la rétribution. Cette formulation française est naturelle et conserve l’idée judiciaire de rendre à chacun selon son attitude.
- source_word: לְשֹׂנְאָיו
  choice: à ceux qui le haïssent
  rationale: Le participe désigne les personnes caractérisées par leur haine envers Dieu. La traduction conserve explicitement le verbe « haïr », plus précis que « ennemis ».
- source_word: אֶל־פָּנָיו
  choice: en face
  rationale: L’expression, répétée dans le verset, évoque une rétribution directe, en présence même de l’intéressé. La formulation concise « en face » préserve l’image hébraïque et son ambiguïté idiomatique, explicitée en note.
- source_word: לְהַאֲבִידוֹ
  choice: pour les faire périr
  rationale: L’infinitif hiphil de אבד indique ici le but ou l’aboutissement de la rétribution. « Faire périr » rend la valeur causative sans atténuer la gravité du jugement.
- source_word: לֹא יְאַחֵר
  choice: Il ne tarde pas
  rationale: Le piel de אחר signifie tarder ou différer. Le présent convient à cette affirmation générale sur l’action de Dieu.
- source_word: לְשֹׂנְאוֹ
  choice: envers celui qui le hait
  rationale: La préposition ל marque ici la personne à l’égard de laquelle Dieu ne diffère pas son action. « Envers » est idiomatique en français et maintient le singulier hébreu.
- source_word: יְשַׁלֶּם לוֹ
  choice: il lui rend … ce qu’il mérite
  rationale: Cette formulation reprend le même vocabulaire de rétribution que dans la première proposition et conserve le resserrement du pluriel vers le singulier.
theological_decisions:
- issue: Langage du jugement divin
  choice: Dieu rétribue directement ceux qui le haïssent et les fait périr
  alternative: Présenter leur perte comme une conséquence générale ou impersonnelle
  rationale: L’hébreu attribue directement à Dieu l’action de rétribuer et de faire périr. La traduction préserve cette responsabilité personnelle sans adoucir la tension théologique.
- issue: Valeur de אֶל־פָּנָיו
  choice: Conserver l’image d’une rétribution « en face »
  alternative: Interpréter exclusivement l’expression comme « sans délai » ou « de son vivant »
  rationale: Le texte répète l’expression faciale, tandis que la proposition centrale formule déjà explicitement l’absence de délai. La traduction ne transforme donc pas une possibilité interprétative en sens unique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de la rétribution et de l’expression « en face » est maintenue afin de refléter l’insistance de l’hébreu; le passage du pluriel au singulier est également conservé.
