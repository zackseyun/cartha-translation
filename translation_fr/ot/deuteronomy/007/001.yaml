  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: fr
  text: Lorsque Yahweh, ton Dieu, te fera entrer dans le pays où tu vas entrer pour en prendre possession[a], et qu’il chassera devant toi de nombreuses nations — les Hittites, les Guirgashites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites, sept nations plus nombreuses et plus puissantes que toi[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour en hériter ».
    reason: lexical_alternative
  - marker: b
    text: Ou « plus grandes et plus fortes que toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Lorsque
  rationale: La conjonction introduit ici la circonstance temporelle dans laquelle s’appliqueront les commandements suivants; « lorsque » convient mieux que le causal « car » ou le conditionnel « si ».
- source_word: יְבִיאֲךָ
  choice: t’aura fait entrer
  rationale: Le hiphil de בוא exprime la causalité. Le futur antérieur s’accorde naturellement en français avec la perspective temporelle ouverte par « lorsque ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa forme personnelle dans le texte hébreu.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial précis, « pays » est naturel en français moderne tout en désignant le territoire promis.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: où tu vas entrer
  rationale: Cette formulation restitue le mouvement imminent vers le territoire sans reproduire lourdement l’adverbe hébreu שָׁמָּה, déjà impliqué par « où ».
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: ירשׁ désigne ici l’action d’acquérir et d’occuper le pays; « prendre possession » conserve cette valeur active, tandis que « hériter » reste une possibilité signalée en note.
- source_word: וְנָשַׁל
  choice: et qu’il aura chassé
  rationale: Le verbe décrit l’expulsion ou la dépossession des peuples. « Chasser devant toi » est idiomatique et conserve l’image spatiale de מִפָּנֶיךָ.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: Les groupes nommés sont présentés comme des collectivités distinctes; « nations » convient ici, et רַבִּים indique leur grand nombre.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: les Hittites, les Guirgashites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites
  rationale: Les gentilés hébreux singuliers à valeur collective sont rendus par les noms pluriels usuels en français.
- source_word: שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: sept nations plus nombreuses et plus puissantes que toi
  rationale: Le rappel de רַבִּים après « de nombreuses nations » favorise le sens comparatif « plus nombreuses »; עֲצוּמִים exprime leur force ou puissance supérieure.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme, nom personnel du Dieu d’Israël. Le conserver sous la forme « Yahweh » évite de le remplacer silencieusement par un titre.
- issue: Valeur de ירשׁ dans le contexte de l’entrée au pays
  choice: prendre possession
  alternative: hériter
  rationale: Le contexte associe l’entrée d’Israël à l’expulsion des nations, ce qui donne au verbe une portée active. La nuance d’héritage demeure possible et est conservée en note sans atténuer la tension du passage.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement singulier reproduit l’adresse collective à Israël au masculin singulier. La phrase reste ouverte par une virgule finale, puisque la construction commencée au verset 1 se poursuit au verset 2.
