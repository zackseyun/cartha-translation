    issue: Le verbe « donne » ne rend pas explicitement l’acte de commander/prescrire.
    rationale: מְצַוְּךָ signifie littéralement « je te commande / prescris ». En français, « je te prescris » est naturel dans ce registre légal et conserve mieux la valeur du verbe.
  - severity: low
    issue: La construction finale est rendue comme une seconde proposition coordonnée, et les appels de note sont placés en fin de verset.
    rationale: 'L’infinitif לַעֲשׂוֹתָם est mieux rendu par « pour les mettre en pratique ». Les marqueurs doivent être placés auprès des éléments qu’ils expliquent : « donc » et « règles ».'
  revised_text: Tu observeras donc[a] le commandement, les prescriptions et les règles[b] que je te prescris aujourd’hui, pour les mettre en pratique.
