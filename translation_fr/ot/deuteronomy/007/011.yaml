  text: וְ/שָׁמַרְתָּ֨ אֶת הַ/מִּצְוָ֜ה וְ/אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לַ/עֲשׂוֹתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: fr
  text: Tu observeras donc[a] le commandement, les prescriptions et les règles[b] que je te prescris aujourd’hui, pour les mettre en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Et tu observeras » ou « C’est pourquoi tu observeras » : la conjonction hébraïque peut exprimer une simple coordination ou tirer une conséquence des versets précédents.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « règles » peut aussi désigner des « ordonnances » ou des « décisions de justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Tu observeras donc
  rationale: Dans ce contexte d’alliance et de loi, שׁמר signifie « observer, respecter ». « Donc » rend la valeur inférentielle probable de וְ tout en signalant en note que la conjonction peut être comprise plus simplement.
- source_word: הַמִּצְוָה
  choice: le commandement
  rationale: Le singulier hébreu est conservé et distingué des deux catégories juridiques plurielles qui suivent.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: « Prescriptions » exprime des dispositions fixées et convient au registre juridique moderne, sans se confondre avec מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles
  rationale: Le terme peut désigner des décisions judiciaires, des ordonnances ou des règles de droit. « Règles » est naturel en français moderne et maintient une catégorie distincte des prescriptions.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: En français, « donner un commandement/des prescriptions » rend naturellement l’acte exprimé par צוה; « aujourd’hui » conserve l’accent deutéronomique sur le moment présent de l’alliance.
- source_word: לַעֲשׂוֹתָם
  choice: et tu les mettras en pratique
  rationale: Cette formulation rend concrètement עשה, « faire », avec son suffixe pluriel, tout en évitant le tour peu idiomatique « pour les faire ».
theological_decisions:
- issue: Maintien de la triade des termes de la loi de l’alliance
  choice: le commandement, les prescriptions et les règles
  alternative: les commandements, les décrets et les ordonnances
  rationale: Le texte juxtapose trois termes partiellement recouvrants pour produire un effet juridique et rhétorique. Le singulier du premier est maintenu et les trois catégories ne sont pas fondues en une désignation générique.
- issue: Valeur de la conjonction initiale
  choice: donc
  alternative: et / c’est pourquoi
  rationale: Le contexte permet une inférence à partir des versets précédents, mais l’hébreu peut aussi marquer une simple coordination; cette ambiguïté est conservée par une note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient au discours légal. La répétition littérale de « et » entre chaque élément n’est pas reproduite, conformément à l’usage naturel du français, mais la triade juridique est préservée.
