revisions:
- from: Tu observeras donc le commandement, les prescriptions et les règles que je te donne aujourd’hui, et tu les mettras en pratique.[a][b]
  to: Tu observeras donc[a] le commandement, les prescriptions et les règles[b] que je te prescris aujourd’hui, pour les mettre en pratique.
  rationale: La révision remplace « donne » par « prescris » afin de rendre directement le verbe hébreu « commander », et remplace la coordination finale par une proposition de but correspondant à l’infinitif hébreu. Les notes sont conservées, mais leurs ancres sont déplacées vers les mots concernés.
