  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: fr
  text: 'Mais voici ce que vous leur ferez : vous démolirez leurs autels, vous briserez leurs stèles sacrées[a], vous abattrez leurs objets cultuels d’Ashéra[b] et vous brûlerez dans le feu leurs images sculptées[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs pierres dressées » ; il s’agit de stèles ayant une fonction cultuelle.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu ashérim : objets cultuels, probablement en bois, associés à la déesse Ashéra ; leur forme exacte est incertaine.'
    reason: cultural_note
  - marker: c
    text: Ou « leurs idoles » ; l’hébreu désigne plus précisément des représentations façonnées ou sculptées.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה
  choice: Mais voici ce que
  rationale: La locution marque un contraste fort avec l’interdiction précédente, tandis que כֹּה annonce les actions qui suivent. Cette formulation est naturelle en français moderne et conserve ces deux fonctions.
- source_word: תַעֲשׂוּ לָהֶם
  choice: vous leur ferez
  rationale: Dans ce contexte prescriptif, l’inaccompli hébreu a une valeur directive. Le futur français garde le ton solennel et impératif de l’instruction.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: vous démolirez leurs autels
  rationale: Le verbe נתץ désigne la destruction ou la démolition d’une construction. « Démolir » convient précisément aux autels et reste courant.
- source_word: מַצֵּבֹתָם
  choice: leurs stèles sacrées
  rationale: מַצֵּבָה désigne ici des pierres dressées ayant une fonction cultuelle. « Stèles sacrées » rend cette réalité plus clairement que le simple mot « colonnes ».
- source_word: תְּשַׁבֵּרוּ
  choice: vous briserez
  rationale: Le piel exprime une action énergique. « Briser » restitue cette force sans recourir à un terme familier.
- source_word: אֲשֵׁירֵיהֶם
  choice: leurs objets cultuels d’Ashéra
  rationale: Le pluriel אֲשֵׁרִים désigne des objets cultuels liés à Ashéra, probablement en bois, mais leur forme exacte demeure incertaine. Cette traduction conserve le référent historique sans imposer la forme précise de « poteaux ».
- source_word: תְּגַדֵּעוּן
  choice: vous abattrez
  rationale: גדע signifie couper ou abattre, notamment un objet en bois ou un arbre. « Abattre » convient au référent probable et exprime une destruction complète.
- source_word: פְסִילֵיהֶם
  choice: leurs images sculptées
  rationale: פֶּסֶל désigne une représentation façonnée, notamment par sculpture. « Images sculptées » préserve ce sens concret sans le réduire au terme plus interprétatif « idoles ».
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: vous brûlerez dans le feu
  rationale: La formulation conserve la mention explicite du feu présente en hébreu, tout en restant intelligible et solennelle en français.
theological_decisions:
- issue: Identification des אֲשֵׁרִים comme objets cultuels précis plutôt que comme idoles génériques
  choice: objets cultuels d’Ashéra
  alternative: poteaux sacrés d’Ashéra ; ashéras ; idoles
  rationale: Le texte distingue plusieurs catégories d’installations et d’objets cultuels. La traduction maintient le lien particulier avec Ashéra et l’incertitude sur la forme exacte de ces objets, au lieu de les confondre avec les images sculptées mentionnées ensuite.
- issue: Force du commandement de détruire les lieux et objets cultuels
  choice: futurs directifs accompagnés de verbes concrets et énergiques
  alternative: impératifs directs ; formulation atténuée comme « vous les supprimerez »
  rationale: L’hébreu formule une prescription nette et décrit précisément les actes exigés. Le français conserve cette vigueur sans ajouter de justification théologique étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « vous » maintient la cadence prescriptive de l’hébreu. Les verbes « démolir », « briser », « abattre » et « brûler » conservent la progression concrète et énergique du texte source.
