  text: בָּר֥וּךְ תִּֽהְיֶ֖ה מִ/כָּל הָ/עַמִּ֑ים לֹא יִהְיֶ֥ה בְ/ךָ֛ עָקָ֥ר וַֽ/עֲקָרָ֖ה וּ/בִ/בְהֶמְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: fr
  text: Tu seras plus béni que tous les peuples[a]. Il n’y aura chez toi ni homme stérile ni femme stérile[b], ni aucun animal stérile parmi ton bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « béni au-dessus de tous les peuples ». La préposition hébraïque exprime ici une comparaison.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie explicitement une forme masculine et une forme féminine : « homme stérile » et « femme stérile ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: Tu seras béni
  rationale: Le participe passif בָּרוּךְ avec l’imparfait de היה exprime l’état futur de celui qui reçoit la bénédiction. Cette formulation est naturelle en français et conserve la portée de la bénédiction d’alliance.
- source_word: מִכָּל הָעַמִּים
  choice: plus que tous les peuples
  rationale: La préposition מִן a ici une valeur comparative. « Plus que » rend cette comparaison clairement, sans transformer la bénédiction en domination politique.
- source_word: לֹא יִהְיֶה בְךָ
  choice: Il n’y aura chez toi
  rationale: La construction existentielle avec בְּ décrit l’absence au sein de la communauté. « Chez toi » conserve l’adresse au singulier collectif faite à Israël.
- source_word: עָקָר וַעֲקָרָה
  choice: ni homme ni femme stérile
  rationale: L’hébreu emploie explicitement les formes masculine et féminine. Le français les distingue naturellement tout en conservant le sens d’incapacité à avoir une descendance.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: ni bête stérile parmi ton bétail
  rationale: בְּהֵמָה désigne collectivement les animaux domestiques. Le français explicite l’ellipse hébraïque de « stérile » afin que la phrase soit immédiatement compréhensible.
theological_decisions:
- issue: Adresse collective d’Israël au masculin singulier
  choice: Conserver « tu » et « ton »
  alternative: Employer « vous » et « votre »
  rationale: Le texte hébreu s’adresse à Israël comme à un peuple unique au moyen du masculin singulier. Le singulier français préserve cette forme sans ajouter d’interprétation.
- issue: Mention des deux sexes dans la bénédiction concernant la fécondité
  choice: Rendre explicitement « homme » et « femme »
  alternative: Employer une formulation générique comme « personne stérile »
  rationale: Le texte source juxtapose volontairement un terme masculin et son correspondant féminin. Les conserver évite d’effacer cette précision.
- issue: Portée comparative de la bénédiction
  choice: « plus que tous les peuples »
  alternative: « au-dessus de tous les peuples »
  rationale: La valeur comparative de מִן est préservée sans préciser davantage en quoi consiste cette supériorité de bénédiction, ce que le verset lui-même ne fait pas.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe reste directe; « chez toi » porte naturellement le sens communautaire du singulier collectif. Dans la dernière proposition, l’ellipse hébraïque est légèrement explicitée par « bête stérile » pour éviter une formulation française obscure.
