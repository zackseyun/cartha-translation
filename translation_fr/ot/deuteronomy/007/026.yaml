source:
  edition: WLC
  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: fr
  text: Tu ne feras entrer dans ta maison aucune chose abominable, sinon tu deviendras, comme elle, voué à la destruction[a]. Tu la considéreras comme absolument répugnante, tu l’auras absolument en horreur, car elle est vouée à la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « placé sous l’interdit » ; traditionnellement, « maudit ». Le terme hébreu désigne ici ce qui est voué à la destruction sous le jugement divin.
    reason: Préciser le champ de sens de חֵרֶם et signaler deux traductions traditionnelles possibles.
lexical_decisions:
- source_word: תָבִיא
  choice: feras entrer
  rationale: Le hifil de בוא exprime ici le fait de faire entrer quelque chose dans la maison. « Faire entrer » rend explicitement ce causatif en français naturel.
- source_word: תּוֹעֵבָה
  choice: chose abominable
  rationale: Dans ce contexte deutéronomique, le terme désigne concrètement un objet idolâtre tenu pour abominable. « Chose abominable » conserve à la fois la force théologique du mot et son emploi concret.
- source_word: בֵּיתֶךָ
  choice: ta maison
  rationale: Le sens concret de « maison » convient au contexte domestique et évite d’élargir sans nécessité le terme à toute la maisonnée.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: sinon tu deviendras, comme elle, voué à la destruction
  rationale: Le waw introduit ici la conséquence redoutée de la désobéissance. « Sinon » l’exprime naturellement, tandis que « tu deviendras » préserve le changement de statut indiqué par והיית.
- source_word: חֵרֶם
  choice: voué à la destruction
  rationale: חֵרֶם désigne ici ce qui est mis à part sous le jugement divin en vue de sa destruction. Cette formulation est plus claire aujourd’hui que « sous l’interdit » et plus complète que « maudit ».
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ וְתַעֵב תְּתַעֲבֶנּוּ
  choice: Tu la tiendras pour tout à fait répugnante et abominable
  rationale: Les deux couples infinitif absolu-verbe conjugué renforcent le commandement. « Tout à fait » marque cette insistance, et les deux adjectifs maintiennent les notions étroitement parallèles de répugnance et d’abomination sans produire une tournure artificielle.
- source_word: כִּי חֵרֶם הוּא
  choice: car elle est vouée à la destruction
  rationale: La proposition causale donne le fondement du commandement. La répétition de « vouée à la destruction » maintient le lien lexical avec la menace précédente.
theological_decisions:
- issue: Sens de חֵרֶם dans un contexte de jugement lié à l’alliance
  choice: voué à la destruction
  alternative: sous l’interdit ; maudit
  rationale: 'Le terme ne décrit pas une simple aversion ni seulement une malédiction : il indique un statut de mise à part en vue de la destruction sous le jugement divin. La traduction retenue conserve ce lien entre l’objet idolâtre et la personne qui l’introduirait chez elle.'
- issue: Portée de la conséquence introduite par וְהָיִיתָ
  choice: sinon tu deviendras
  alternative: et tu deviendras ; de peur que tu ne deviennes
  rationale: Le contexte présente une conséquence réelle attachée à la transgression. « Sinon » garde cette force d’avertissement sans transformer le texte en simple expression de crainte.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier conserve l’adresse hébraïque. La formulation évite un vocabulaire confessionnel spécialisé, tandis que la note explique le terme technique חֵרֶם.
