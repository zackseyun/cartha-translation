  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: fr
  text: Vous brûlerez au feu les images taillées de leurs dieux. Tu ne convoiteras pas l’argent et l’or qui se trouvent sur elles, et tu ne les prendras pas pour toi, de peur que cela ne te prenne au piège[a], car c’est une abomination pour Yahweh, ton Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur que tu ne sois pris au piège par cela ». Le verbe hébreu évoque une capture au moyen d’un piège.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom peut renvoyer aux métaux provenant de l’image, à l’image elle-même ou, plus largement, à toute l’entreprise consistant à s’approprier ce qui est lié au culte idolâtre.
    reason: referential_ambiguity
lexical_decisions:
- source_word: פְּסִילֵי
  choice: images taillées
  rationale: Le nom désigne des représentations façonnées par taille ou sculpture. « Images taillées » garde ce sens concret sans employer l’archaïque « images gravées » ni réduire d’emblée le terme à « idoles ».
- source_word: אֱלֹהֵיהֶם
  choice: leurs dieux
  rationale: Le pluriel construit avec suffixe de troisième personne du pluriel se rend directement et naturellement ainsi.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: vous brûlerez au feu
  rationale: Cette formulation conserve à la fois l’action de brûler et la mention explicite du feu. Le pluriel du verbe hébreu est également maintenu.
- source_word: לֹא תַחְמֹד
  choice: tu ne convoiteras pas
  rationale: « Convoiter » exprime le désir porté sur un bien attirant dans un contexte d’interdiction et conserve la force éthique du verbe hébreu.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: l’argent et l’or qui se trouvent sur elles
  rationale: La conjonction hébraïque est rendue littéralement par « et ». « Qui se trouvent sur elles » garde ouverte la manière exacte dont les métaux sont fixés aux images, sans imposer l’idée d’un placage intégral.
- source_word: וְלָקַחְתָּ לָךְ
  choice: et tu ne les prendras pas pour toi
  rationale: Dans la portée de la négation, la phrase interdit non seulement de convoiter les métaux, mais aussi de se les approprier. Le pluriel français renvoie naturellement à l’argent et à l’or.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: de peur que cela ne te prenne au piège
  rationale: Le verbe évoque le fait d’être capturé par un piège. La tournure active est naturelle en français, tandis que « cela » évite de fixer trop étroitement le référent du pronom hébreu singulier.
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Le terme exprime quelque chose de profondément odieux à Dieu. « Abomination » en conserve la gravité et le registre biblique tout en restant compréhensible aujourd’hui.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au choix éditorial de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Référent du pronom singulier dans בּוֹ et de הוּא
  choice: Employer « cela » puis « c’est », sans préciser davantage le référent.
  alternative: Rapporter explicitement les pronoms soit aux métaux précieux, soit à l’image taillée, soit à l’acte de s’approprier ces objets.
  rationale: Le contexte immédiat vise l’argent et l’or pris sur les images, mais l’ensemble idolâtrique demeure en vue. Une formulation neutre conserve l’ambiguïté du texte et sa tension théologique.
- issue: Alternance entre adresse plurielle et singulière
  choice: Conserver « vous brûlerez », puis « tu ne convoiteras pas » et les formes singulières qui suivent.
  alternative: Uniformiser tout le verset au singulier ou au pluriel pour lisser le français.
  rationale: L’hébreu passe réellement du pluriel au singulier. Cette alternance fréquente dans le Deutéronome peut avoir une portée collective et individuelle; la conserver évite de supprimer une caractéristique du discours.
translation_notes:
  register: Français international actuel, digne et accessible. Le passage du pluriel au singulier est volontairement conservé d’après l’hébreu. « Images taillées », « convoiter » et « abomination » maintiennent un registre biblique clair sans archaïsmes inutiles.
