  naturalness: Le français est moderne, digne et généralement fluide. « Amour fidèle » est un rendu recevable de חֶסֶד dans ce contexte. « Pour mille générations » est plus idiomatique et moins susceptible d’être compris comme une limite que « jusqu’à mille générations ».
  terminology: « Yahweh », « Dieu », « alliance », « amour fidèle » et « commandements » sont cohérents avec le registre biblique et avec les données lexicales. Aucun ajout doctrinal n’est introduit.
