source:
  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: fr
  text: Sache donc que Yahweh, ton Dieu, est Dieu, le Dieu fidèle, qui garde l’alliance et l’amour fidèle[a] envers ceux qui l’aiment et qui gardent ses commandements, pour mille générations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu חֶסֶד peut aussi évoquer la loyauté dans l’alliance, la bonté constante ou la miséricorde.
    reason: lexical_alternative
  - marker: b
    text: L’expression évoque une fidélité durable sur une immense étendue de générations.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Sache donc
  rationale: Le parfait qal à la 2e personne du masculin singulier a ici une force directive. « Donc » rend la valeur inférentielle possible de la conjonction dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel et sa portée d’alliance.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier est rendu directement; le français emploie naturellement le singulier pour l’interlocuteur collectif Israël.
- source_word: הוּא הָאֱלֹהִים
  choice: est Dieu
  rationale: La formulation française exprime naturellement l’affirmation emphatique et exclusive, sans le tour pesant « est le Dieu ».
- source_word: הָאֵל הַנֶּאֱמָן
  choice: le Dieu fidèle
  rationale: L’apposition reprend le titre divin et נֶאֱמָן décrit sa fiabilité constante, particulièrement dans le cadre de l’alliance.
- source_word: שֹׁמֵר הַבְּרִית
  choice: qui garde l’alliance
  rationale: Le participe présente une action caractéristique et continue. « Garder l’alliance » demeure naturel et fait écho au même verbe appliqué ensuite aux commandements.
- source_word: וְהַחֶסֶד
  choice: et l’amour fidèle
  rationale: חֶסֶד associe ici amour, loyauté et constance dans l’alliance. « Amour fidèle » conserve ces dimensions sans imposer exclusivement l’idée de miséricorde.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: envers ceux qui l’aiment et qui gardent ses commandements
  rationale: « Envers » rend les bénéficiaires ou destinataires de la fidélité divine; la coordination française allégée préserve le parallélisme entre amour et obéissance.
- source_word: לְאֶלֶף דּוֹר
  choice: jusqu’à mille générations
  rationale: L’expression indique l’immense durée de la fidélité à l’alliance. « Jusqu’à » distingue clairement cette valeur temporelle de la relation exprimée par « envers ».
theological_decisions:
- issue: Rapport entre la fidélité de Dieu à l’alliance et l’amour ainsi que l’obéissance humaines
  choice: Dieu garde l’alliance et l’amour fidèle envers ceux qui l’aiment et gardent ses commandements.
  alternative: Dieu fait miséricorde à ceux qui l’aiment, sans conserver explicitement la notion de loyauté d’alliance.
  rationale: Le texte unit explicitement l’alliance, le חֶסֶד, l’amour pour Dieu et l’observance des commandements. La traduction maintient cette tension covenantale sans l’expliquer au moyen d’un système doctrinal ultérieur.
- issue: Portée de « mille générations »
  choice: Rattacher l’expression à la durée pendant laquelle Dieu garde l’alliance et l’amour fidèle.
  alternative: La rattacher plus étroitement à « ceux qui l’aiment et gardent ses commandements », comme une description de ces personnes à travers mille générations.
  rationale: La portée temporelle sur l’action divine est la lecture française la plus naturelle, mais la syntaxe hébraïque permet une autre association; celle-ci est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme interlocuteur collectif. La répétition de « Dieu » conserve l’emphase de l’original; « amour fidèle » maintient la richesse covenantale de חֶסֶד.
