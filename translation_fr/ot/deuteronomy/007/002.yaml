base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: fr
  text: Quand Yahweh ton Dieu les aura livrés devant toi et que tu les auras frappés, tu les voueras entièrement à la destruction[a]. Tu ne concluras pas d’alliance avec eux et tu ne leur accorderas aucune faveur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu les détruiras complètement » ou « tu les mettras entièrement sous l’interdit ». L’hébreu emploie une construction intensive avec le verbe חרם, qui exprime ici une mise à part totale en vue de la destruction.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu ne leur feras pas grâce » ; selon le contexte : « tu n’auras aucune pitié pour eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: les aura livrés devant toi
  rationale: Dans ce contexte militaire, נתן signifie remettre ou livrer quelqu’un au pouvoir d’un autre. « Livrés devant toi » conserve aussi l’expression לְפָנֶיךָ sans ajouter l’image de la main, absente de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְהִכִּיתָם
  choice: tu les auras frappés
  rationale: נכה désigne ici l’action de frapper dans un contexte guerrier. Cette formulation conserve la force concrète du verbe, sans l’archaïsme de « terrasser » ni l’atténuation possible de « vaincre ».
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: tu les voueras entièrement à la destruction
  rationale: L’infinitif absolu suivi du verbe conjugué renforce חרם. La traduction exprime à la fois la totalité et la mise à part irrévocable en vue de la destruction, au lieu de réduire le terme à une simple victoire militaire.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Tu ne concluras pas d’alliance avec eux
  rationale: « Conclure une alliance » est l’équivalent français naturel de l’idiome כרת ברית et conserve la portée relationnelle et solennelle de בְּרִית.
- source_word: וְלֹא תְחָנֵּם
  choice: tu ne leur accorderas aucune faveur
  rationale: חנן exprime l’octroi de grâce ou de faveur. « Accorder une faveur » reste proche de ce champ lexical; « ne leur feras pas grâce » demeure une possibilité contextuelle signalée en note.
theological_decisions:
- issue: Sens de חרם dans le contexte de la guerre sacrée
  choice: tu les voueras entièrement à la destruction
  alternative: tu les détruiras complètement ; tu les mettras entièrement sous l’interdit
  rationale: La formulation maintient ensemble la consécration irrévocable et la destruction impliquées par חרם, ainsi que l’intensité de la construction hébraïque, sans aplanir le terme en simple anéantissement militaire.
- issue: Portée de תְחָנֵּם
  choice: tu ne leur accorderas aucune faveur
  alternative: tu ne leur feras pas grâce ; tu n’auras aucune pitié pour eux
  rationale: Le choix principal suit le sens lexical de חנן. Les autres formulations rendent bien certaines nuances possibles dans ce contexte, mais « pitié » peut introduire une coloration émotionnelle plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. Le futur antérieur rend naturellement la succession des actions introduites par les formes hébraïques, tandis que le futur simple exprime les interdictions. Le vocabulaire garde la dureté du contexte sans archaïsme ni atténuation.
