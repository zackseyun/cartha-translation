  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: fr
  text: Car tu es un peuple saint pour Yahweh, ton Dieu. Yahweh, ton Dieu, t’a choisi parmi tous les peuples qui sont à la surface de la terre afin que tu sois pour lui un peuple qui lui appartienne en propre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un peuple, sa possession précieuse ». L’hébreu dit littéralement « un peuple de possession précieuse » et associe l’idée d’un peuple à celle d’un bien particulièrement précieux.
    reason: Alternative lexicale signalant la nuance de possession spéciale portée par סְגֻלָּה.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de l’instruction précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: עַם קָדוֹשׁ
  choice: un peuple saint
  rationale: Rend l’expression nominale de manière idiomatique tout en conservant son poids théologique et l’idée d’un peuple mis à part.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: pour Yahweh ton Dieu
  rationale: Le ל marque ici la relation et l’appartenance; « pour » reste naturel en français et évite la tournure peu idiomatique « saint à ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בְּךָ בָּחַר
  choice: t’a choisi
  rationale: Exprime directement l’élection divine; le passé composé convient à un choix passé dont le résultat demeure.
- source_word: לִהְיוֹת לוֹ
  choice: pour que tu sois pour lui
  rationale: Conserve à la fois la valeur finale de l’infinitif et la relation de possession exprimée par לוֹ.
- source_word: לְעַם סְגֻלָּה
  choice: un peuple précieux
  rationale: Maintient le nom explicite עַם et rend סְגֻלָּה comme ce qui possède une valeur particulière; la note signale l’autre formulation possible.
- source_word: מִכֹּל הָעַמִּים
  choice: parmi tous les peuples
  rationale: Exprime une sélection au sein de l’ensemble des peuples sans introduire une idée de supériorité absente de la préposition.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: qui sont à la surface de la terre
  rationale: Rend clairement l’image hébraïque désignant le monde habité dans un français moderne et digne.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; sa transcription préserve le nom d’alliance plutôt que de lui substituer un titre.
- issue: Portée de l’élection dans מִכֹּל הָעַמִּים
  choice: parmi tous les peuples
  alternative: au-dessus de tous les peuples
  rationale: La préposition indique ici le choix au sein d’un ensemble. La traduction n’ajoute donc pas une affirmation de supériorité intrinsèque.
- issue: Sens de סְגֻלָּה appliqué au peuple
  choice: un peuple précieux
  alternative: un bien précieux
  rationale: Le texte associe explicitement « peuple » et « possession de grande valeur ». Le texte principal préserve עַם, tandis que la note conserve la nuance possessive de סְגֻלָּה.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse hébraïque au singulier, qui personnifie Israël comme un peuple collectif. La syntaxe conserve la répétition de « Yahweh ton Dieu » et l’enchaînement théologique du texte source.
