    reason: Alternative lexicale signalant la nuance de possession spéciale portée par סְגֻלָּה.
  revision_rationale: La révision remplace « un peuple précieux » par une expression française usuelle qui conserve à la fois l’appartenance particulière et la valeur attachée à סְגֻלָּה. Elle conserve le nom divin, le singulier collectif et le choix parmi les peuples, tout en améliorant légèrement la ponctuation française.
