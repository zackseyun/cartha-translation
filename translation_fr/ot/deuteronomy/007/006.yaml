- from: Car tu es un peuple saint pour Yahweh ton Dieu. Yahweh ton Dieu t’a choisi pour que tu sois pour lui un peuple précieux[a], parmi tous les peuples qui sont à la surface de la terre.
  to: Car tu es un peuple saint pour Yahweh, ton Dieu. Yahweh, ton Dieu, t’a choisi parmi tous les peuples qui sont à la surface de la terre afin que tu sois pour lui un peuple qui lui appartienne en propre[a].
  rationale: La révision remplace « un peuple précieux » par une expression française usuelle qui conserve à la fois l’appartenance particulière et la valeur attachée à סְגֻלָּה. Elle conserve le nom divin, le singulier collectif et le choix parmi les peuples, tout en améliorant légèrement la ponctuation française.
