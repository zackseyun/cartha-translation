base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: fr
  text: Il livrera leurs rois dans ta main, et tu feras disparaître leur nom de dessous le ciel. Personne[a] ne tiendra devant toi, jusqu’à ce que tu les aies exterminés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Aucun homme ». Le singulier hébreu אִישׁ a ici un sens représentatif : personne ne pourra te résister.'
    reason: Préciser la forme littérale et la portée générique du terme hébreu.
lexical_decisions:
- source_word: וְנָתַן
  choice: Il livrera
  rationale: Dans cette suite de promesses, le parfait avec waw a une valeur prédictive. « Livrer » exprime naturellement l’idée de remettre au pouvoir de quelqu’un.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: leurs rois entre tes mains
  rationale: Cette formulation conserve l’image hébraïque de la main tout en rendant clairement l’idée de mise au pouvoir d’Israël.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: tu feras disparaître leur nom
  rationale: Le hiphil de אבד est causatif, et son objet est ici le « nom » collectif. La formulation garde à la fois la causalité et le singulier hébreu.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de dessous le ciel
  rationale: Expression hébraïque évoquant une disparition totale du monde des vivants; la traduction en préserve l’image.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: Personne ne tiendra devant toi
  rationale: Le verbe désigne le fait de prendre position ou de tenir bon face à quelqu’un. « Personne » rend en français moderne la portée représentative de אִישׁ, tandis qu’une note conserve sa forme littérale.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: jusqu’à ce que tu les aies exterminés
  rationale: La construction avec עַד indique le terme de l’action, et שׁמד exprime ici une destruction complète. Le subjonctif passé convient naturellement après « jusqu’à ce que ».
theological_decisions:
- issue: Portée du masculin singulier אִישׁ
  choice: Personne ne tiendra devant toi
  alternative: Aucun homme ne tiendra devant toi
  rationale: אִישׁ est morphologiquement masculin singulier, mais il a ici une portée indéfinie et représentative. « Personne » communique cette portée sans limiter artificiellement l’énoncé aux hommes; la note signale la forme littérale.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète les formes de deuxième personne masculine singulière adressées à Israël comme collectivité. L’image « entre tes mains » et le singulier collectif « leur nom » sont conservés.
