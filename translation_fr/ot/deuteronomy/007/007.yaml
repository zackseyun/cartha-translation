  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: fr
  text: Ce n’est pas parce que vous étiez plus nombreux que tous les autres peuples que Yahweh s’est attaché à vous et vous a choisis[a], car vous êtes le moins nombreux de tous les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a porté son amour sur vous ». Le verbe hébreu exprime un attachement ou une affection profonde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: parce que vous étiez plus nombreux que tous les autres peuples
  rationale: La construction avec מִן exprime ici une comparaison numérique. Cette formulation restitue naturellement en français le motif nié par לֹא, tandis que « autres » clarifie la comparaison sans changer le référent.
- source_word: חָשַׁק
  choice: s’est attaché à
  rationale: Le verbe exprime un attachement fort et volontaire, avec une dimension affective. « S’est attaché à » reste naturel en français et évite de préciser excessivement la nature de cet amour.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte hébreu.
- source_word: וַיִּבְחַר
  choice: et vous a choisis
  rationale: « Choisir » est l’équivalent direct et usuel de בחר dans ce contexte; il conserve le langage de l’élection sans lui ajouter de développement doctrinal.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici l’explication de l’affirmation précédente. « Car » marque clairement ce rapport dans un registre digne et courant.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: le moins nombreux de tous les peuples
  rationale: L’expression décrit la petitesse numérique d’Israël par rapport aux autres peuples. Le singulier « le moins nombreux » convient à Israël envisagé collectivement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie le nom propre divin. La translittération « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Portée du choix divin
  choice: vous a choisis
  alternative: vous a sélectionnés
  rationale: Le français conserve l’affirmation sobre du choix d’Israël et sa négation d’un fondement numérique, sans importer de catégories doctrinales ultérieures.
- issue: Nuance affective de חָשַׁק
  choice: s’est attaché à vous
  alternative: a porté son amour sur vous
  rationale: Le choix principal préserve l’idée d’un attachement fort tout en maintenant l’ouverture sémantique du verbe hébreu; l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le contraste rhétorique entre l’absence de supériorité numérique d’Israël et le choix de Yahweh.
