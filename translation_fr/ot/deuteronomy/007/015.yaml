  source_fidelity: 'Le texte rend correctement la succession des propositions hébraïques : Yahweh ôte toute maladie, ne met pas sur Israël les maladies d’Égypte connues de lui, et les inflige à ceux qui le haïssent. « Éloignera de toi » exprime bien le hiphil de סור et la séparation marquée par מן. « Aucune des ... maladies » restitue correctement la négation portant sur l’ensemble du groupe.'
