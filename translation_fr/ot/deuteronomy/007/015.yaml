id: DEU.7.15
reference: Deuteronomy 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: fr
  text: Yahweh éloignera de toi toute maladie. Il ne t’infligera aucune des graves maladies d’Égypte[a] que tu as connues[b], mais il les infligera à tous ceux qui te haïssent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des maladies mauvaises, nuisibles ou douloureuses d’Égypte ». L’adjectif hébreu peut désigner ce qui est mauvais, nuisible, pénible ou grave.
    reason: lexical_alternative
  - marker: b
    text: Ou « que tu as subies ». En hébreu, « connaître » peut ici désigner une connaissance acquise par l’expérience.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: éloignera
  rationale: Le hiphil de סור exprime le fait de faire partir ou d’écarter quelque chose. « Éloignera de toi » restitue naturellement en français l’idée de séparation marquée aussi par מִמְּךָ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: כָּל חֹלִי
  choice: toute maladie
  rationale: חֹלִי désigne la maladie ou l’état de maladie. Le singulier collectif français « toute maladie » correspond directement à l’expression hébraïque.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: les graves maladies d’Égypte
  rationale: מַדְוֵי est un pluriel construit signifiant « maladies de », et הָרָעִים qualifie ces maladies de mauvaises, nuisibles ou pénibles. Dans ce contexte physique, « graves » est naturel et évite de suggérer que les maladies seraient moralement mauvaises; une note conserve l’éventail lexical.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: que tu as connues
  rationale: יָדַע signifie « connaître » et peut ici inclure une connaissance vécue. La formulation française préserve cette latitude sans expliciter d’emblée « subir » ou « éprouver ».
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: Il ne t’infligera aucune
  rationale: שׂים avec ב exprime ici le fait de placer une maladie sur quelqu’un. « Infliger à » rend cette relation idiomatiquement en français, tandis que « aucune » restitue la négation portant sur l’ensemble des maladies mentionnées.
- source_word: וּנְתָנָם
  choice: mais il les infligera
  rationale: נתן signifie littéralement « donner » ou « mettre ». Dans le contexte de maladies imposées à des personnes, « infliger » est idiomatique. « Mais » marque le contraste entre Israël et ceux qui le haïssent sans l’amplifier.
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: à tous ceux qui te haïssent
  rationale: Le participe substantivé שֹׂנְאֶיךָ désigne précisément « ceux qui te haïssent », plutôt que plus largement des ennemis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ou le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. La translittération « Yahweh » préserve ce nom personnel sans le remplacer par un titre.
- issue: Portée de la promesse relative aux maladies d’Égypte
  choice: Une promesse concrète de protection dans le cadre de l’alliance exprimé par le passage
  alternative: Une garantie universelle et inconditionnelle d’absence de maladie pour chaque croyant, ou une lecture purement métaphorique
  rationale: Le verset parle réellement de maladie et des maladies d’Égypte, mais il ne formule pas à lui seul une doctrine générale d’immunité individuelle valable en toute circonstance.
- issue: Destination des maladies
  choice: Conserver l’affirmation selon laquelle elles seront infligées à ceux qui haïssent Israël
  alternative: Atténuer la phrase en simple retrait de protection
  rationale: Les verbes hébreux שׂים et נתן attribuent explicitement l’action à Yahweh. La traduction maintient cette tension théologique au lieu de la reformuler comme une conséquence seulement passive.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse collective à Israël au masculin singulier. « Infliger » évite le calque peu naturel « mettre une maladie sur quelqu’un » tout en conservant l’action divine explicitement affirmée par les deux propositions.
