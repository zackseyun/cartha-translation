  terminology: « Yahweh » respecte la décision de rendre le tétragramme par son nom. « Toute maladie », « ceux qui te haïssent » et « que tu as connues » sont fidèles et naturels. « Graves maladies » sélectionne une nuance contextuellement recevable de הָרָעִים, et la note préserve de façon adéquate les autres nuances possibles sans imposer une lecture doctrinale.
