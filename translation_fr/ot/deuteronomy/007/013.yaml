base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: fr
  text: Il t’aimera, te bénira et te multipliera. Il bénira le fruit de ton sein et le fruit de ton sol — ton blé, ton vin nouveau et ton huile, les petits de tes bovins et les jeunes de ton petit bétail — dans le pays qu’il a juré à tes pères[a] de te donner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tes ancêtres ». L’hébreu dit « à tes pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Il t’aimera
  rationale: Le contexte donne à la forme avec waw une valeur future dans la suite des bénédictions de l’alliance; « aimer » conserve directement l’affection exprimée par le verbe.
- source_word: וְהִרְבֶּךָ
  choice: te rendra nombreux
  rationale: Cette formulation française naturelle conserve le complément direct singulier collectif et exprime l’accroissement du peuple.
- source_word: פְּרִי בִטְנְךָ
  choice: le fruit de ton sein
  rationale: Conserve l’image concrète et le parallélisme avec « le fruit de ton sol », tout en restant intelligible en français biblique moderne.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: le fruit de ton sol
  rationale: Maintient la répétition de פְּרִי et rend אֲדָמָה par un terme agricole naturel.
- source_word: דְּגָנְךָ
  choice: ton blé
  rationale: Dans la triade agricole traditionnelle, « blé » est une désignation française claire des céréales, sans suggérer le maïs moderne.
- source_word: תִירֹשְׁךָ
  choice: ton vin nouveau
  rationale: Préserve la nuance de production vinicole fraîche associée à תירוש plutôt que de rendre simplement « vin ».
- source_word: יִצְהָרֶךָ
  choice: ton huile
  rationale: Le mot désigne l’huile, habituellement d’olive; le français n’a pas besoin d’expliciter l’olive dans le texte principal.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: les petits de tes bovins
  rationale: Rend la progéniture des grands animaux domestiques et respecte le pluriel du terme désignant les bovins.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: les jeunes de ton petit bétail
  rationale: Dans cette collocation, l’expression inhabituelle désigne la progéniture des ovins et caprins; « petit bétail » traduit צאן sans la réduire aux seuls moutons.
- source_word: עַל הָאֲדָמָה
  choice: dans le pays
  rationale: La proposition situe les bénédictions dans le territoire promis; « pays » est ici plus naturel que « sol ».
- source_word: לַאֲבֹתֶיךָ
  choice: à tes pères
  rationale: Conserve la forme masculine plurielle explicite de l’hébreu et la formule de la promesse patriarcale.
theological_decisions:
- issue: Rendu de לַאֲבֹתֶיךָ
  choice: à tes pères
  alternative: à tes ancêtres
  rationale: « Pères » reproduit plus formellement le masculin pluriel hébreu et son association avec les patriarches; « ancêtres » est une possibilité idiomatique plus inclusive, signalée en note sans remplacer le sens explicite du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse collective à Israël. Le parallélisme et les images agricoles de l’hébreu sont maintenus, avec quelques équivalents idiomatiques pour assurer la clarté.
