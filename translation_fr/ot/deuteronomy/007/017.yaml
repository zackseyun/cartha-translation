  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: fr
  text: 'Si tu te dis dans ton cœur : « Ces nations sont plus nombreuses que moi ; comment pourrai-je les déposséder[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chasser ». Le verbe hébreu évoque le fait de leur faire perdre la possession du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans ce contexte, כִּי introduit l’éventualité à laquelle répond l’exhortation du verset suivant ; « Si » rend clairement cette valeur conditionnelle.
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: tu te dis dans ton cœur
  rationale: Le verbe signifie littéralement « dire », tandis que « dans ton cœur » situe cette parole intérieure. La tournure française conserve l’image hébraïque tout en exprimant naturellement le fait de se parler à soi-même.
- source_word: רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי
  choice: Ces nations sont plus nombreuses que moi
  rationale: מִמֶּנִּי marque ici la comparaison. « Plus nombreuses que moi » est clair en français et respecte l’adresse individuelle au masculin singulier sans introduire un « nous » absent du texte.
- source_word: אֵיכָה אוּכַל
  choice: comment pourrai-je
  rationale: אֵיכָה introduit une question portant sur la possibilité, et אוּכַל est l’imparfait de יכל, « pouvoir ». Le futur français convient à la perspective de l’action envisagée.
- source_word: לְהוֹרִישָׁם
  choice: les déposséder
  rationale: Le hiphil de ירש, dans ce contexte territorial, signifie faire perdre à ces nations la possession du pays. « Déposséder » conserve cette nuance plus précisément que le seul fait de les chasser.
