  source_fidelity: 'Le texte rend fidèlement les deux actions coordonnées : Yahweh livre les ennemis au pouvoir du destinataire (וּנְתָנָם ... לְפָנֶיךָ), puis les plonge dans une grande confusion/panique (וְהָמָם מְהוּמָה גְדֹלָה), jusqu’à leur destruction. « Jusqu’à ce qu’ils soient détruits » restitue correctement l’aboutissement exprimé par עַד הִשָּׁמְדָם.'
