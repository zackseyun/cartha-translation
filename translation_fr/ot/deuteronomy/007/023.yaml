source:
  edition: WLC
  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: fr
  text: Mais Yahweh ton Dieu les livrera en ton pouvoir[a] et les jettera dans un grand désarroi[b], jusqu’à ce qu’ils soient détruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant toi ». Ici, l’expression signifie que Yahweh livrera ces ennemis au pouvoir d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans une grande panique » ou « dans un grand tumulte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: les livrera
  rationale: Avec un objet direct et לְפָנֶיךָ, נָתַן exprime ici le fait de livrer des ennemis au pouvoir d’Israël; « les livrera » est naturel et conserve le sens militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier de deuxième personne est rendu directement; le contexte s’adresse individuellement à Israël.
- source_word: לְפָנֶיךָ
  choice: en ton pouvoir
  rationale: Littéralement « devant toi », cette expression associée à נָתַן signifie dans ce contexte militaire que les ennemis sont livrés au pouvoir du destinataire.
- source_word: וְהָמָם
  choice: les jettera
  rationale: Le verbe הָמַם décrit l’action de provoquer la panique, la confusion ou la déroute; avec le complément « dans un grand désarroi », « les jettera » en exprime clairement la valeur causative.
- source_word: מְהוּמָה גְדֹלָה
  choice: dans un grand désarroi
  rationale: מְהוּמָה peut désigner la confusion, la panique ou le tumulte, notamment au combat. « Grand désarroi » garde cette amplitude sans limiter le terme à une seule réaction émotionnelle.
- source_word: עַד הִשָּׁמְדָם
  choice: jusqu’à ce qu’ils soient détruits
  rationale: La construction avec עַד marque l’aboutissement de l’action, et la formulation passive conserve la valeur résultative du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme יְהוָה. « Yahweh » en conserve la fonction de nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël. « Désarroi » préserve la portée militaire de la confusion, de la panique et de la déroute sans archaïsme.
