  source_fidelity: 'Le rendu suit fidèlement le texte hébreu : Yahweh est conservé, נשל est bien rendu par « chassera », מעט מעט par « peu à peu », et la restriction temporelle portant sur l’élimination rapide des nations est maintenue. La formulation proposée pour עליך doit toutefois être adaptée en français : « devenir trop nombreux contre toi » est un calque peu naturel. « Trop nombreux pour toi » exprime la conséquence redoutée pour Israël sans introduire d’interprétation confessionnelle.'
  naturalness: Le français est globalement moderne et digne. L’apposition « Yahweh, ton Dieu » appelle des virgules, et « contre toi » après « devenir trop nombreux » n’est pas idiomatique en français contemporain.
  terminology: « Yahweh », « nations », « éliminer » et « animaux sauvages » conviennent au registre et au contexte. Les notes conservent utilement les formulations plus littérales.
