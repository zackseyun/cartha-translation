  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: fr
  text: Yahweh, ton Dieu, chassera peu à peu ces nations devant toi[a]. Tu ne pourras pas les éliminer rapidement, de peur que les animaux sauvages[b] ne deviennent trop nombreux pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dépossédera peu à peu ces nations devant toi » ou « les délogera peu à peu de devant toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les animaux de la campagne » ou « les bêtes des champs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: chassera
  rationale: Dans ce contexte territorial, le verbe désigne l’action de faire partir les nations du pays. « Chassera » est naturel en français et conserve l’idée d’une expulsion, tandis que « dépossédera » met davantage l’accent sur la perte du territoire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: הַגּוֹיִם הָאֵל
  choice: ces nations
  rationale: Cette expression désigne ici les peuples cananéens comme entités collectives et territoriales; « ces nations » conserve aussi la valeur du démonstratif.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: L’expression spatiale indique que les nations seront écartées du chemin et de la présence d’Israël. « Devant toi » en conserve l’image sans alourdir la phrase.
- source_word: מְעַט מְעָט
  choice: peu à peu
  rationale: La locution française reproduit naturellement la répétition hébraïque et l’idée d’une progression graduelle.
- source_word: לֹא תוּכַל
  choice: Tu ne pourras pas
  rationale: Le futur exprime l’incapacité dans la situation annoncée.
- source_word: כַּלֹּתָם
  choice: les éliminer
  rationale: Le verbe signifie ici les mener à leur fin ou les faire disparaître entièrement. « Éliminer » exprime directement cette idée dans un registre digne, sans la tournure familière « en finir avec eux ».
- source_word: מַהֵר
  choice: rapidement
  rationale: Cet adverbe rend simplement la rapidité envisagée et refusée.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française rend la nuance préventive de l’hébreu et introduit la conséquence redoutée.
- source_word: תִּרְבֶּה
  choice: ne deviennent trop nombreux
  rationale: Le verbe signifie devenir nombreux ou se multiplier. Le contexte indique que leur nombre constituerait un danger; « trop nombreux » rend cette implication sans changer le référent.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Littéralement, l’expression parle des « animaux de la campagne » ou « des champs »; elle désigne ici les animaux non domestiqués. « Animaux sauvages » est clair en français moderne.
- source_word: עָלֶיךָ
  choice: contre toi
  rationale: La préposition marque ici l’effet menaçant dirigé vers Israël. « Contre toi » préserve cette force hostile, même si « ne deviennent trop nombreux pour toi » serait plus idiomatique mais plus neutre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Portée de כַּלֹּתָם
  choice: les éliminer
  alternative: les faire entièrement disparaître
  rationale: Le texte envisage la disparition complète des nations visées, mais le verbe lui-même peut exprimer l’achèvement ou la suppression. « Éliminer » conserve cette portée sans ajouter une formulation doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes hébraïques adressées collectivement à Israël. La répétition « peu à peu » et l’image spatiale « devant toi » ont été conservées; les tournures trop familières ont été évitées.
