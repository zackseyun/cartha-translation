source:
  edition: WLC
  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: fr
  text: 'Ne sois pas terrifié devant eux[a], car Yahweh ton Dieu est au milieu de toi[b] : c’est un Dieu grand et redoutable[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne tremble pas devant eux. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parmi vous ». Le singulier « toi » désigne ici collectivement Israël.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui inspire la crainte ». Le mot hébreu évoque une crainte mêlée de révérence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ
  choice: sois terrifié
  rationale: Le verbe ערץ exprime une peur intense, l’effroi. « Ne sois pas terrifié » en restitue la force en français naturel.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: L’expression signifie littéralement « de devant eux » et décrit la peur éprouvée face à ces adversaires. « Devant eux » conserve cette image sans lourdeur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le singulier français respecte l’adresse collective faite à Israël et maintient explicitement la relation d’alliance exprimée par le suffixe possessif.
- source_word: בְּקִרְבְּךָ
  choice: au milieu de toi
  rationale: Cette formulation rend la présence de Dieu au sein du peuple, tout en évitant le sens individualiste que pourrait suggérer « en toi ».
- source_word: אֵל גָּדוֹל
  choice: un Dieu grand
  rationale: אֵל désigne ici Dieu en apposition, et גָּדוֹל signifie directement « grand ». La formulation française conserve les deux éléments.
- source_word: וְנוֹרָא
  choice: et redoutable
  rationale: Le terme décrit celui qui inspire crainte et révérence. « Redoutable » garde cette force sans réduire le mot à une terreur purement négative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le Tétragramme. La translittération préserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Portée de בְּקִרְבְּךָ
  choice: au milieu de toi
  alternative: parmi vous
  rationale: Le pronom hébreu est au singulier collectif et s’adresse à Israël comme peuple. « Au milieu de toi » préserve cette forme et exprime une présence communautaire, non une habitation intérieure individuelle.
- issue: Nuance de נוֹרָא appliqué à Dieu
  choice: redoutable
  alternative: digne de crainte révérencielle
  rationale: « Redoutable » maintient la tension entre la crainte suscitée par la puissance divine et la révérence, sans imposer une explication théologique dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse collective de l’hébreu à Israël. « Terrifié » rend l’intensité du verbe, tandis que « redoutable » conserve la gravité de l’attribut divin.
