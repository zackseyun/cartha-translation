revisions:
- from: Tu dévoreras tous les peuples que Yahweh ton Dieu te donne[a]. Tu ne les épargneras pas[b] et tu ne serviras pas leurs dieux, car ce serait pour toi un piège[c].
  to: Tu détruiras[a] tous les peuples que Yahweh, ton Dieu, te donne. Tu ne les épargneras pas[b] et tu ne serviras pas leurs dieux, car cela serait pour toi un piège[c].
  rationale: La révision remplace un calque français potentiellement littéral par « détruiras », qui correspond à l’usage idiomatique de אכל dans ce contexte, tout en conservant le sens lexical premier dans une note correctement ancrée. Elle ajoute les virgules appositives autour de « ton Dieu » et maintient l’ambiguïté du pronom final au moyen de « cela » et de la note.
