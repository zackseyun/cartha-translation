base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: fr
  text: Tu détruiras[a] tous les peuples que Yahweh, ton Dieu, te donne. Tu ne les épargneras pas[b] et tu ne serviras pas leurs dieux, car cela serait pour toi un piège[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « tu mangeras » ou « tu consumeras ». Dans ce contexte, le verbe est employé au sens figuré de détruire entièrement.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu n’auras pas pitié d’eux ». Littéralement, « ton œil ne les épargnera pas ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « car il est pour toi un piège ». Le pronom hébreu peut renvoyer au fait de servir leurs dieux, aux dieux eux-mêmes ou, plus largement, à la situation idolâtre.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Tu dévoreras
  rationale: Le verbe אכל signifie littéralement « manger » et exprime ici, dans un contexte de guerre, l’idée de défaire ou détruire entièrement. « Dévoreras » conserve l’image hébraïque tout en restant intelligible en français.
- source_word: כָּל הָעַמִּים
  choice: tous les peuples
  rationale: Le pluriel עַמִּים désigne ici les différents peuples concernés. « Peuples » est plus proche du lexème que « nations ».
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: que Yahweh ton Dieu te donne
  rationale: Le participe נֹתֵן présente l’action divine comme actuelle ou imminente. Le présent français convient naturellement dans cette proposition relative. Le nom divin est translittéré « Yahweh ».
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: Tu ne les épargneras pas
  rationale: L’expression hébraïque, littéralement « que ton œil ne les épargne pas », est un idiome signifiant ne pas prendre en pitié ou ne pas épargner. La formulation française communique naturellement son sens, tandis que l’image littérale est signalée en note.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: tu ne serviras pas leurs dieux
  rationale: עבד signifie « servir » et, avec des divinités comme objet, inclut le culte et l’allégeance. « Servir » préserve cette portée plus large sans la réduire au seul acte cultuel.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: car ce serait pour toi un piège
  rationale: מוֹקֵשׁ désigne un piège ou un lacet. « Ce » renvoie naturellement au fait de servir leurs dieux, tout en laissant une certaine souplesse référentielle, et le conditionnel exprime en français la conséquence redoutée de l’acte interdit.
theological_decisions:
- issue: Référent de הוּא dans כִּי מוֹקֵשׁ הוּא לָךְ
  choice: « car ce serait pour toi un piège », avec un renvoi probable au fait de servir leurs dieux
  alternative: Le pronom peut renvoyer aux dieux eux-mêmes ou, plus largement, à la situation idolâtre liée aux peuples mentionnés.
  rationale: L’interdiction de servir leurs dieux est l’antécédent immédiat, mais le pronom hébreu n’explicite pas entièrement son référent. La traduction française et la note conservent cette tension sans imposer une précision absente du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme entité collective. Le futur garde la force prescriptive du discours, tandis que « dévoreras » préserve l’image vigoureuse de l’original.
