  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: fr
  text: De plus, Yahweh, ton Dieu, enverra contre eux des frelons[a], jusqu’à ce que périssent ceux qui resteront et ceux qui se cacheront loin de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « la terreur » ou « la panique ». Certains comprennent les frelons comme une image de l’effroi envoyé par Dieu plutôt que comme des insectes réels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Exprime naturellement en français la valeur additive et emphatique de la locution, en lien avec les promesses précédentes.
- source_word: הַצִּרְעָה
  choice: les frelons
  rationale: Le nom singulier défini a ici une valeur collective; le pluriel français exprime naturellement l’ensemble des insectes sans écarter la possibilité figurée signalée en note.
- source_word: יְשַׁלַּח
  choice: enverra
  rationale: Rend l’action future par laquelle Yahweh dépêche cet agent contre les ennemis d’Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Reproduit l’adresse personnelle au singulier et la relation exprimée par le suffixe possessif.
- source_word: בָּם
  choice: contre eux
  rationale: Dans ce contexte hostile, la préposition désigne les peuples visés par l’agent envoyé; « contre eux » est idiomatique en français.
- source_word: עַד אֲבֹד
  choice: jusqu’à ce que périssent
  rationale: Marque le terme de l’action sans préciser indûment le moyen de leur disparition.
- source_word: הַנִּשְׁאָרִים
  choice: ceux qui auront survécu
  rationale: Désigne ceux qui resteront après les actions précédentes; le futur antérieur clarifie leur antériorité relative dans un français naturel.
- source_word: וְהַנִּסְתָּרִים
  choice: ceux qui se seront cachés
  rationale: Rend le sens contextuel de personnes qui se dissimulent, tout en conservant le parallélisme avec les survivants.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Conserve l’image hébraïque de la présence ou de la face d’Israël, avec le sens de se dérober à son avance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme; sa transcription préserve le nom personnel de Dieu.
- issue: Sens littéral ou figuré de הַצִּרְעָה
  choice: les frelons dans le texte principal
  alternative: la terreur ou la panique envoyée par Dieu
  rationale: Le sens lexical concret désigne l’insecte. La lecture figurée étant possible mais non certaine, elle est conservée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël. « De plus » évite la lourdeur d’un cumul de connecteurs; « frelons » au pluriel rend naturellement le singulier collectif hébreu.
