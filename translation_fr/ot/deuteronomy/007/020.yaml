    rationale: L’hébreu porte וְגַם au début (« De plus / Et aussi »), mais ne comporte pas d’adverbe équivalent à « même » devant « ceux qui auront survécu ». Le retirer évite d’ajouter une emphase localisée absente du texte.
  - severity: low
    issue: Futurs antérieurs pour les participes
    rationale: הַנִּשְׁאָרִים et הַנִּסְתָּרִים sont des participes désignant les personnes restantes et cachées. Dans une phrase française introduite par « jusqu’à ce que », le futur simple exprime suffisamment l’horizon futur sans imposer une antériorité.
  - severity: low
    issue: « devant toi » avec « se cacher »
    rationale: מִפָּנֶיךָ signifie littéralement « de devant toi / loin de toi » et évoque la fuite hors de portée ou de présence. « Se cacher loin de toi » rend ce sens plus clairement en français.
