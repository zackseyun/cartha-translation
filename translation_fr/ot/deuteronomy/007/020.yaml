  source_fidelity: 'Le sens central est bien rendu : Yahweh agit contre les adversaires d’Israël par les frelons, jusqu’à la disparition des survivants et de ceux qui se dissimulent. Toutefois, « même » n’a pas de correspondant explicite dans l’hébreu, et les futurs antérieurs donnent aux participes hébreux une antériorité inutile.'
  naturalness: La formulation est globalement naturelle et digne. « Ceux qui resteront » et « ceux qui se cacheront loin de toi » sont plus fluides dans cette perspective future que les futurs antérieurs, tout en évitant l’image ambiguë de personnes qui se cacheraient physiquement « devant toi ».
  terminology: « Yahweh », « ton Dieu » et « frelons » conviennent au registre et aux choix du projet. La note maintient correctement, sans la privilégier, l’interprétation figurée possible de הַצִּרְעָה.
