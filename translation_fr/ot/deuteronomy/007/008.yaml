source:
  edition: WLC
  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: fr
  text: mais parce que Yahweh vous aime et qu’il tient le serment qu’il a juré à vos pères, Yahweh vous a fait sortir par sa main puissante[a] et vous a rachetés de la maison des esclaves[b], de la main du pharaon, roi d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec une main forte ». Cette expression évoque la puissance avec laquelle Yahweh a délivré Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon une formulation française plus traditionnelle : « de la maison d’esclavage ». L’hébreu dit littéralement : « de la maison des esclaves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: mais parce que
  rationale: Dans la continuité du verset 7, la conjonction introduit à la fois un contraste et la véritable cause du choix d’Israël.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: parce que Yahweh vous aime
  rationale: Le tour hébreu exprime la cause. Cette formulation française naturelle conserve la force verbale de l’amour de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: et qu’il tient le serment
  rationale: « Tenir un serment » exprime naturellement en français l’observance fidèle et active indiquée par la construction hébraïque.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: qu’il a fait à vos pères
  rationale: En français, on « fait » ou « prête » un serment. « Vos pères » conserve la référence masculine et historique aux patriarches.
- source_word: הוֹצִיא
  choice: a fait sortir
  rationale: Cette tournure causative rend fidèlement le verbe hébreu et le langage caractéristique de l’exode.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main puissante
  rationale: L’expression conserve l’image de la main tout en rendant clairement l’idée de l’intervention souveraine et puissante de Yahweh.
- source_word: וַיִּפְדְּךָ
  choice: vous a rachetés
  rationale: « Racheter » préserve le sens de libération hors de la servitude ainsi que la portée théologique du motif de l’exode.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: Cette traduction garde l’image concrète et littérale de l’hébreu; l’alternative idiomatique « maison d’esclavage » est donnée en note.
- source_word: מִיַּד פַּרְעֹה
  choice: de la main du pharaon
  rationale: Le maintien de l’image hébraïque de la main fait écho à la « main puissante » de Yahweh et désigne ici le pouvoir du pharaon.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: roi d’Égypte
  rationale: Traduction directe du titre en apposition.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin propre. « Yahweh » le préserve sans le remplacer par un titre.
- issue: Désignation des ancêtres par אֲבֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le masculin du texte et la référence covenantale aux patriarches sont conservés, sans généralisation silencieuse.
- issue: Langage de la servitude dans עֲבָדִים
  choice: esclaves
  alternative: serviteurs; esclavage
  rationale: Le contexte égyptien exige de rendre explicitement la condition de servitude contrainte; « serviteurs » l’atténuerait.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les images répétées de la « main » ainsi que le langage concret du rachat et de l’esclavage. Le pluriel « rachetés » s’accorde avec le peuple d’Israël auquel Moïse s’adresse collectivement.
