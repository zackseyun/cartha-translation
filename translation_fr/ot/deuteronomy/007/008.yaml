  to: mais parce que Yahweh vous aime et qu’il tient le serment qu’il a juré à vos pères, Yahweh vous a fait sortir par sa main puissante[a] et vous a rachetés de la maison des esclaves[b], de la main du pharaon, roi d’Égypte.
  rationale: La révision corrige la préposition régissant « main puissante » afin de rendre le moyen de l’action divine, puis remplace « qu’il a fait » par « qu’il a juré » pour refléter explicitement le verbe hébreu « jurer ». Les notes sont conservées, car elles sont exactes et les ancres sont structurellement cohérentes.
