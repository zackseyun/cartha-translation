source:
  edition: WLC
  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: fr
  text: 'Tu ne contracteras pas mariage avec eux : tu ne donneras pas ta fille à leur fils[a], et tu ne prendras pas leur fille pour ton fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « à son fils » ; de même ensuite : « sa fille ». Le singulier a ici une valeur distributive et renvoie à chacun des peuples concernés.'
    reason: Précision grammaticale sur les suffixes hébreux singuliers dont l’antécédent contextuel est pluriel.
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: contracteras pas de mariage
  rationale: Le hitpael de חתן exprime ici le fait de nouer des alliances matrimoniales avec les peuples mentionnés. « Contracter mariage avec » garde cette dimension relationnelle dans un français naturel et digne.
- source_word: בָּם
  choice: avec eux
  rationale: La préposition avec le suffixe masculin pluriel renvoie aux peuples nommés dans le contexte précédent.
- source_word: בִּתְּךָ
  choice: ta fille
  rationale: Rendu direct du nom singulier muni du suffixe de deuxième personne du masculin singulier.
- source_word: תִתֵּן
  choice: donneras
  rationale: Le verbe signifie simplement « donner »; le contexte matrimonial en précise suffisamment le sens sans ajouter « en mariage ».
- source_word: לִבְנוֹ
  choice: à leur fils
  rationale: Le texte massorétique porte littéralement un suffixe masculin singulier (« à son fils »), mais celui-ci distribue individuellement le pluriel collectif « eux »; « leur fils » rend clairement ce lien en français.
- source_word: וּבִתּוֹ
  choice: leur fille
  rationale: Comme pour « leur fils », le suffixe hébreu est singulier et distributif par rapport aux peuples visés; « leur fille » est idiomatique en français.
- source_word: תִקַּח
  choice: prendras
  rationale: Le verbe hébreu est « prendre ». Le contexte indique qu'il s'agit de prendre une épouse, sans qu'une explicitation soit indispensable dans le corps du texte.
- source_word: לִבְנֶךָ
  choice: pour ton fils
  rationale: « Pour ton fils » rend naturellement en français la relation exprimée par la préposition ל dans cette formule matrimoniale.
theological_decisions:
- issue: Portée de l’interdiction
  choice: L’interdiction vise les alliances matrimoniales avec les peuples précédemment désignés, sans ajouter dans ce verset le motif donné ensuite.
  alternative: Comprendre le verset comme une interdiction générale de tout mariage avec des étrangers, ou comme une interdiction purement ethnique détachée du contexte d’alliance.
  rationale: Le pronom « eux » conserve le référent contextuel précis. La traduction n’élargit ni ne restreint la portée au-delà de ce que dit le verset.
- issue: Termes familiaux genrés
  choice: Conserver « fille » et « fils » au singulier.
  alternative: Employer un collectif neutre tel que « enfants ».
  rationale: L’hébreu emploie des termes de parenté genrés au singulier dans une formulation juridique représentative; les neutraliser effacerait une caractéristique explicite du texte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure juridique au futur conserve la force prescriptive de l’imparfait hébreu négatif. « Contracter mariage » évite le peu idiomatique « se marier entre eux » tout en gardant l’idée d’alliance matrimoniale.
