  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: fr
  text: Prenez garde à vous-mêmes, pour que votre cœur ne se laisse pas séduire et que vous ne vous détourniez pas, ne serviez pas d’autres dieux et ne vous prosterniez pas devant eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que votre cœur ne se laisse pas tromper ». Le verbe hébreu peut exprimer l’idée d’être persuadé, séduit ou trompé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Prenez garde à vous-mêmes
  rationale: La formule d’avertissement au nifal, accompagnée du pronom réfléchi, appelle chacun à veiller sur lui-même. Cette tournure française est naturelle, solennelle et conserve explicitement la valeur réflexive.
- source_word: פֶּן
  choice: que… ne
  rationale: פֶּן introduit les conséquences redoutées contre lesquelles porte l’avertissement. Après « Prenez garde », la construction française « que… ne » exprime naturellement cette mise en garde sans recourir à l’archaïsme « de peur que ».
- source_word: יִפְתֶּה
  choice: se laisse séduire
  rationale: Le verbe פתה peut évoquer la persuasion, la séduction ou la tromperie. « Se laisse séduire » rend bien la forme et le risque d’un attrait conduisant à l’infidélité, tout en laissant l’autre nuance en note.
- source_word: לְבַבְכֶם
  choice: votre cœur
  rationale: לֵבָב désigne ici le centre intérieur de la volonté, de la pensée et des choix. « Cœur » demeure l’équivalent français courant et conserve la portée biblique du terme.
- source_word: וְסַרְתֶּם
  choice: que vous ne vous détourniez
  rationale: סור décrit l’abandon de la voie ou de l’allégeance juste. « Se détourner » restitue naturellement cette image dans le contexte de l’alliance.
- source_word: וַעֲבַדְתֶּם
  choice: ne serviez
  rationale: עבד appliqué à des divinités signifie leur rendre un service cultuel et leur vouer son allégeance. « Servir » préserve ce sens distinct de l’acte concret de prosternation mentionné ensuite.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Cette expression signifie directement « d’autres dieux » ; « des dieux étrangers » ajouterait une nuance qui n’est pas nécessairement exprimée ici.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: ne vous prosterniez devant eux
  rationale: השתחוה désigne concrètement le fait de se courber ou de se prosterner, souvent comme acte cultuel. « Se prosterner devant » conserve à la fois le geste et son sens religieux.
theological_decisions:
- issue: Nature de l’avertissement contre l’apostasie
  choice: 'Conserver la progression du texte : séduction intérieure, détournement, service d’autres dieux, puis prosternation devant eux.'
  alternative: Résumer plus librement l’ensemble comme une mise en garde contre l’idolâtrie.
  rationale: La formulation hébraïque distingue l’origine intérieure de l’infidélité et ses manifestations successives. La traduction maintient cette tension et cette progression sans les réduire à une catégorie doctrinale abstraite.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief l’avertissement initial, tandis que la série de subjonctifs négatifs restitue naturellement la chaîne de conséquences introduite par פֶּן.
