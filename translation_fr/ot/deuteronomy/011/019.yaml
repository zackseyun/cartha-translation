  to: Vous les enseignerez à vos enfants[a], en parlant d’eux lorsque tu seras assis dans ta maison, lorsque tu marcheras sur la route, lorsque tu te coucheras et lorsque tu te lèveras.
  rationale: La révision maintient « enfants », le pronom non spécifié « les », et la répétition circonstancielle. Elle restitue l’alternance du pluriel initial et du singulier qui suit dans l’hébreu, sans lui imposer une interprétation doctrinale. La note est précisée sur le plan grammatical.
