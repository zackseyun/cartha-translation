base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: fr
  text: Vous les enseignerez à vos enfants[a], en parlant d’eux lorsque tu seras assis dans ta maison, lorsque tu marcheras sur la route, lorsque tu te coucheras et lorsque tu te lèveras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à vos fils ». Le nom hébreu est au masculin pluriel et peut désigner les enfants de manière représentative.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Vous les enseignerez
  rationale: Le piel de למד signifie couramment « enseigner ». Le futur français exprime ici naturellement l’injonction, tandis que la conjonction initiale se rattache au contexte sans devoir être rendue par « et » en tête de phrase.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux paroles ou commandements du contexte. Le pronom français préserve ce renvoi sans expliciter davantage l’antécédent.
- source_word: אֶת־בְּנֵיכֶם
  choice: à vos enfants
  rationale: בנים peut désigner les fils au sens strict ou les enfants, la descendance, dans un emploi représentatif. Dans ce contexte d’instruction familiale, « enfants » rend naturellement la portée générale.
- source_word: לְדַבֵּר בָּם
  choice: en parlant d’eux
  rationale: L’infinitif avec ל décrit l’activité qui accompagne l’enseignement. « Parler d’eux » conserve le pronom renvoyant aux commandements et évite le calque obscur « parler en eux ».
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: quand vous serez assis dans votre maison
  rationale: La préposition ב avec l’infinitif construit exprime une circonstance temporelle. La formulation reste proche de l’image hébraïque tout en étant claire en français moderne.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: quand vous marcherez sur la route
  rationale: הלך signifie ordinairement « marcher, aller ». « Sur la route » rend directement בַדֶּרֶךְ sans l’ambiguïté idiomatique que pourrait avoir une tournure comme « en chemin ».
- source_word: וּבְשָׁכְבְּךָ
  choice: quand vous vous coucherez
  rationale: Le verbe שכב signifie « se coucher, être couché ». Le verbe pronominal français exprime naturellement ici le fait de se coucher pour le repos.
- source_word: וּבְקוּמֶךָ
  choice: quand vous vous lèverez
  rationale: קום désigne le fait de se lever. « Vous vous lèverez » forme en français une paire naturelle avec « vous vous coucherez » et conserve le rythme du texte.
theological_decisions:
- issue: Portée du masculin pluriel בְּנֵיכֶם
  choice: vos enfants
  alternative: vos fils
  rationale: Le nom masculin pluriel peut fonctionner de manière représentative pour la descendance. Dans ce contexte d’enseignement de l’alliance au sein des familles, « enfants » communique cette portée sans exclure artificiellement les filles, tandis qu’une note conserve la traduction plus formelle possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement pluriel reflète l’adresse collective à Israël, tandis que les expressions circonstancielles hébraïques restent au singulier distributif en français (« votre maison », « vous serez assis »). La cadence répétitive de la vie quotidienne est conservée sans alourdir chaque membre par une conjonction.
