  text: אֶֽת הַ/בְּרָכָ֑ה אֲשֶׁ֣ר תִּשְׁמְע֗וּ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: fr
  text: la bénédiction, si vous écoutez[a] les commandements de Yahweh, votre Dieu, que je vous prescris aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Écoutez » peut aussi être rendu par « obéissez aux ». En hébreu, ce verbe désigne souvent une écoute qui se traduit par l’obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: la bénédiction
  rationale: Le groupe nominal poursuit la construction elliptique du verset précédent, où Moïse place devant Israël une bénédiction et une malédiction.
- source_word: אֲשֶׁר
  choice: si
  rationale: 'Bien qu’il s’agisse formellement d’un relatif, il prend ici une valeur conditionnelle : la bénédiction est liée à l’écoute des commandements.'
- source_word: תִּשְׁמְעוּ אֶל
  choice: vous écoutez
  rationale: Le verbe שׁמע avec אֶל désigne une écoute attentive qui implique, dans ce contexte d’alliance, une réponse obéissante; « écoutez » conserve cette richesse sans la réduire au seul terme « obéir ».
- source_word: מִצְוֺת
  choice: les commandements
  rationale: « Commandements » rend avec précision le poids juridique et religieux de מִצְוֹת dans le cadre de l’alliance.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Le nom divin est translittéré, tandis que le suffixe de la deuxième personne du pluriel est rendu par le possessif « votre ».
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ceux que je vous donne aujourd’hui
  rationale: Le relatif reprend naturellement « les commandements ». En français courant, « donner des commandements » exprime clairement l’acte présent de Moïse sans la lourdeur de « que je vous commande ».
theological_decisions:
- issue: Valeur de l’écoute dans le langage de l’alliance
  choice: écoutez
  alternative: obéissez à
  rationale: L’hébreu associe l’audition attentive à l’obéissance. Le choix « écoutez » préserve le sens lexical premier et laisse subsister cette implication théologique.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et préserve sa fonction de nom d’alliance.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste étroitement liée au verset précédent. « Ceux que » évite une relative ambiguë et renvoie clairement aux commandements.
