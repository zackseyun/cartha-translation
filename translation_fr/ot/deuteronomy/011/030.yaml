  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: fr
  text: Ne sont-elles pas au-delà du Jourdain[a], derrière le chemin du soleil couchant[b], dans le pays des Cananéens qui habitent dans l’Araba, en face de Guilgal, près des chênes de Moré[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’autre côté du Jourdain ». L’expression hébraïque est une indication géographique dont le sens précis dépend du point de vue adopté.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « derrière le chemin du coucher du soleil » ; c’est-à-dire en direction de l’ouest.
    reason: lexical_alternative
  - marker: c
    text: Ou « des térébinthes de Moré ». Le terme hébreu peut désigner l’un ou l’autre de ces grands arbres.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Ne sont-elles pas
  rationale: La question rhétorique appelle une réponse affirmative. Le féminin pluriel renvoie naturellement en français aux deux montagnes mentionnées au verset précédent.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: au-delà du Jourdain
  rationale: Cette expression géographique conserve l’indétermination relative au point de vue; « de l’autre côté du Jourdain » serait également possible.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: derrière le chemin du soleil couchant
  rationale: Rendu proche de la formulation hébraïque, sans réduire silencieusement l’expression à une simple indication cardinale comme « à l’ouest ».
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: dans le pays des Cananéens
  rationale: Le gentilé hébreu au singulier a ici un sens collectif, naturellement rendu au pluriel en français.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: qui habitent dans l’Araba
  rationale: Le participe singulier s’accorde collectivement avec le peuple; « Araba » est conservé comme nom géographique plutôt que généralisé en « plaine ».
- source_word: מוּל הַגִּלְגָּל
  choice: en face de Guilgal
  rationale: « En face de » exprime clairement la relation spatiale; le nom du lieu suit une translittération française courante.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: près des chênes de Moré
  rationale: « Près de » rend la proximité. אֵלוֹן peut désigner un chêne ou un térébinthe; le texte retient le terme français le plus familier et signale l’autre possibilité en note.
