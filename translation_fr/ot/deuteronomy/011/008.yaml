revisions:
- from: Vous observerez donc tout le commandement que je vous donne aujourd’hui[a], afin que vous deveniez forts[b], que vous entriez et preniez possession du pays vers lequel vous passez pour en prendre possession[c].
  to: Observez donc tout le commandement que je vous prescris aujourd’hui[a], afin que vous deveniez forts[b], que vous entriez et preniez possession du pays où vous allez passer pour en prendre possession[c].
  rationale: La révision restaure le sens prescriptif de מְצַוֶּה et remplace une expression française maladroite par une formulation qui rend le déplacement vers le pays sans expliciter le Jourdain. La répétition de ירשׁ, le singulier collectif de « commandement », l’adresse collective et les possibilités lexicales signalées dans les notes sont conservés.
