base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: fr
  text: Observez donc tout le commandement que je vous prescris aujourd’hui[a], afin que vous deveniez forts[b], que vous entriez et preniez possession du pays où vous allez passer pour en prendre possession[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout le commandement ». Le singulier a ici une valeur collective et désigne l’ensemble des commandements.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que vous soyez forts » ou « que vous soyez rendus forts ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « héritiez du pays […] pour en hériter ». Le verbe hébreu peut signifier « hériter », « posséder » ou « prendre possession de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous observerez donc
  rationale: Dans un contexte d’alliance et de loi, שׁמר signifie « observer » ou « respecter ». « Donc » rend ici la continuité logique avec ce qui précède.
- source_word: כָּל הַמִּצְוָה
  choice: tout le commandement
  rationale: Le singulier hébreu est collectif et désigne l’ensemble de ce qui est commandé. Cette formulation conserve cette particularité sans devenir obscure.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je vous donne aujourd’hui
  rationale: En français biblique courant, « donner un commandement » exprime naturellement l’action de commander. « Vous » permet de conserver sans lourdeur l’adresse collective à Israël malgré l’alternance hébraïque du singulier et du pluriel.
- source_word: לְמַעַן
  choice: afin que
  rationale: Marque clairement le but ou le résultat visé.
- source_word: תֶּחֶזְקוּ
  choice: vous deveniez forts
  rationale: Le qal de חזק peut exprimer le fait de devenir fort. Cette traduction préserve la nuance dynamique sans préciser indûment s’il s’agit de courage militaire ou d’une force reçue.
- source_word: וּבָאתֶם
  choice: que vous entriez
  rationale: בוא désigne ici l’entrée dans le pays; « entrer » est plus naturel en français que le calque « venir dans ».
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: preniez possession ... pour en prendre possession
  rationale: ירשׁ peut signifier hériter, posséder ou prendre possession. Le contexte d’entrée dans le pays favorise « prendre possession », et la répétition conserve l’insistance de l’hébreu.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: vers lequel vous passez
  rationale: La formulation conserve le mouvement vers le pays indiqué par שָׁמָּה, sans ajouter explicitement le Jourdain, qui n’est pas nommé dans ce verset.
theological_decisions:
- issue: Alternance entre adresse singulière et plurielle à Israël
  choice: Employer partout le pronom français « vous »
  alternative: Expliciter les changements de nombre ou paraphraser par « Israël »
  rationale: Le français « vous » laisse subsister l’adresse collective sans effacer le texte dans une paraphrase ni introduire une distinction artificielle.
- issue: Sens de ירשׁ appliqué au pays
  choice: prendre possession
  alternative: hériter
  rationale: « Prendre possession » convient au mouvement d’entrée décrit par le verset, tandis que « hériter » pourrait atténuer cet aspect actif. La note conserve néanmoins l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure finale conserve la répétition intentionnelle de ירשׁ et le mouvement vers le pays, tout en évitant d’ajouter explicitement le Jourdain.
