  - severity: medium
    issue: « le pays vers lequel vous passez » est imprécis et peu idiomatique.
    rationale: עֹבְרִים שָׁמָּה décrit le franchissement en direction du pays. « Passer vers » n’est pas une tournure française naturelle dans ce contexte. « Le pays où vous allez passer » conserve l’ellipse du référent franchi, sans ajouter « le Jourdain ».
