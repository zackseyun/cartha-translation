source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: fr
  text: Tu aimeras donc Yahweh, ton Dieu, et tu observeras ses exigences[a], ses prescriptions, ses jugements[b] et ses commandements, tous les jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et tu aimeras Yahweh, ton Dieu. » La conjonction hébraïque peut simplement signifier « et » ; ici, elle est comprise comme introduisant une conséquence de ce qui précède.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ses ordonnances ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: Tu aimeras donc
  rationale: Le verbe אָהַב signifie « aimer ». La conjonction וְ peut simplement signifier « et », mais le contexte donne ici à la phrase une valeur de conclusion et d’application; « donc » rend naturellement cette nuance sans effacer l’autre possibilité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, ce qui préserve le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: 'La forme construite avec suffixe de deuxième personne masculine du singulier exprime directement la relation personnelle et d’alliance : « ton Dieu ».'
- source_word: וְ/שָׁמַרְתָּ
  choice: et tu observeras
  rationale: שׁמר peut signifier garder, veiller sur ou observer. Devant une série de termes juridiques et cultuels, « observer » exprime clairement l’obéissance demandée.
- source_word: מִשְׁמַרְתּוֹ
  choice: ce qu’il te confie
  rationale: מִשְׁמֶרֶת désigne ce qui doit être gardé, une charge ou une responsabilité confiée. Cette formulation est naturelle en français moderne tout en conservant l’idée de dépôt à garder.
- source_word: חֻקֹּתָיו
  choice: ses prescriptions
  rationale: חֻקּוֹת désigne des dispositions établies ou prescrites. « Prescriptions » maintient le registre normatif et la distingue des décisions et des commandements.
- source_word: וּמִשְׁפָּטָיו
  choice: ses décisions
  rationale: מִשְׁפָּט peut désigner un jugement, une décision juridique ou une règle de droit. « Décisions » convient au contexte légal et préserve la distinction avec les autres termes.
- source_word: וּמִצְוֺתָיו
  choice: ses commandements
  rationale: מִצְוָה est le terme courant pour un commandement; cette traduction conserve le registre juridique et biblique sans archaïsme excessif.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: La locution signifie littéralement « tous les jours ». En contexte, elle exprime une obéissance constante durant toute la vie, sans qu’il soit nécessaire d’ajouter un possessif absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre et évite de remplacer silencieusement celui-ci par un titre.
- issue: Valeur de la conjonction initiale וְ
  choice: donc
  alternative: et
  rationale: Le verset tire une conséquence du développement précédent, ce que « donc » rend clairement. Comme וְ peut aussi être simplement coordonnant, cette possibilité est signalée en note.
- issue: Nuance de מִשְׁפָּטָיו
  choice: ses décisions
  alternative: ses règles; ses ordonnances; ses jugements
  rationale: Le mot appartient au vocabulaire juridique et peut couvrir plusieurs nuances. « Décisions » maintient cette coloration sans confondre le terme avec « prescriptions » ou « commandements ».
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes hébraïques à la deuxième personne masculine du singulier. La série de termes normatifs reste différenciée, tandis que « ce qu’il te confie » évite le caractère peu naturel de « sa charge » en français courant.
