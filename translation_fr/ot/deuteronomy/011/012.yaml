base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: fr
  text: un pays dont Yahweh ton Dieu prend soin[a] ; les yeux de Yahweh ton Dieu sont constamment sur lui, du début de l’année jusqu’à la fin de l’année.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le recherche » ou « veille sur lui ». Le verbe hébreu peut signifier chercher, s’enquérir de ou prendre soin ; ici, il exprime l’attention active de Yahweh envers le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: pays
  rationale: Dans ce contexte, le mot désigne le territoire promis à Israël. « Pays » est naturel en français et évite le sens global possible de « terre ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, sans lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend la forme avec suffixe masculin singulier, conformément à l’adresse directe à Israël.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: prend soin
  rationale: Le verbe דרש peut signifier chercher, s’enquérir de ou veiller sur. Avec le pays pour objet, il exprime ici l’attention active de Dieu.
- source_word: תָּמִיד
  choice: constamment
  rationale: Exprime la continuité de l’attention divine dans un français actuel et digne.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: les yeux de Yahweh ton Dieu sont constamment sur lui
  rationale: Conserve l’image anthropomorphique hébraïque et rend בָּהּ par la tournure française naturelle « sur lui ».
- source_word: מֵרֵשִׁית הַשָּׁנָה
  choice: du début de l’année
  rationale: Rend clairement le premier terme de l’étendue temporelle.
- source_word: וְעַד אַחֲרִית שָׁנָה
  choice: jusqu’à la fin de l’année
  rationale: Exprime naturellement en français la limite finale de la période.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le préserve plutôt que de le remplacer par un titre, sans adopter la forme française traditionnelle « Jéhovah ».
- issue: Nature de l’attention divine envers le pays
  choice: prend soin
  alternative: cherche / s’enquiert de / veille sur
  rationale: « Prend soin » communique l’attention providentielle active suggérée par le contexte, tandis que la note conserve l’étendue lexicale du verbe.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse collective à Israël sous la forme grammaticale masculine singulière. L’image des yeux de Dieu est conservée.
