  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת אֵ֥ת כָּל הַֽ/חֻקִּ֖ים וְ/אֶת הַ/מִּשְׁפָּטִ֑ים אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: fr
  text: Vous veillerez à mettre en pratique toutes les prescriptions et toutes les règles que je place aujourd’hui devant vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « que je donne aujourd’hui devant vous » ; l’expression hébraïque signifie ici « que je place aujourd’hui devant vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם לַ/עֲשׂוֹת
  choice: Vous veillerez à mettre en pratique
  rationale: Avec l’infinitif לַעֲשׂוֹת, שׁמר exprime l’attention vigilante à accomplir ce qui est commandé. « Veiller à mettre en pratique » rend naturellement en français la force directive et l’idée d’exécution concrète.
- source_word: כָּל
  choice: toutes
  rationale: Le terme marque la totalité. Sa répétition en français devant les deux catégories rend clairement l’exigence exhaustive.
- source_word: הַֽ/חֻקִּים
  choice: les prescriptions
  rationale: חֻקִּים désigne des dispositions établies. « Prescriptions » conserve le registre juridique et se distingue de מִשְׁפָּטִים sans employer un terme vieilli.
- source_word: וְ/אֶת הַ/מִּשְׁפָּטִים
  choice: et toutes les règles
  rationale: מִשְׁפָּטִים peut désigner des décisions judiciaires, des règles de droit ou des ordonnances. « Règles » convient ici à l’ensemble législatif et reste accessible en français moderne, tout en demeurant distinct de « prescriptions ».
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִ/פְנֵי/כֶם
  choice: que je place […] devant vous
  rationale: נתן signifie littéralement « donner », mais associé à לִפְנֵי il forme ici l’expression « placer devant ». Le présent « je place » préserve la valeur du participe נֹתֵן et l’immédiateté du discours.
- source_word: הַ/יּוֹם
  choice: aujourd’hui
  rationale: Équivalent français direct et actuel, qui conserve l’immédiateté temporelle de l’adresse d’alliance.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le futur « vous veillerez » garde la force prescriptive du discours juridique d’alliance. Le couple « prescriptions et règles » maintient une distinction lexicale entre חֻקִּים et מִשְׁפָּטִים sans archaïsme excessif.
