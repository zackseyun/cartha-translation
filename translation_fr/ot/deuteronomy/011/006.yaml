base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: fr
  text: 'et ce qu’il a fait à Datan et à Abiram, fils d’Éliab, fils de Ruben : la terre a ouvert sa bouche et les a engloutis, ainsi que leurs maisons[a], leurs tentes et tout ce qui était à leurs pieds[b], au milieu de tout Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs maisons ». Le terme peut désigner les habitations elles-mêmes ou, plus largement, les membres de leur foyer, leur maisonnée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout le yĕqûm qui était à leurs pieds ». L’expression peut désigner les personnes, les êtres vivants et les biens qui dépendaient d’eux ou les accompagnaient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: a fait
  rationale: Rend simplement le verbe courant « faire » dans cette rétrospective des actes de Dieu.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: fils d’Éliab, fils de Ruben
  rationale: Conserve la formulation généalogique et son enchaînement, sans la remplacer par « le Rubénite ».
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: la terre ouvrit sa bouche
  rationale: Préserve l’image vive et personnifiée de l’hébreu.
- source_word: וַתִּבְלָעֵם
  choice: les engloutit
  rationale: « Engloutir » exprime naturellement en français l’image concrète du fait d’avaler entièrement.
- source_word: בָּתֵּיהֶם
  choice: leurs maisonnées
  rationale: Le terme signifie littéralement « leurs maisons », mais peut désigner ici les personnes constituant leurs foyers; « maisonnées » évite aussi de faire double emploi avec les tentes.
- source_word: אָהֳלֵיהֶם
  choice: leurs tentes
  rationale: Traduction directe et naturelle, adaptée au cadre du désert.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: tout ce qui était à leurs pieds
  rationale: Conserve la formulation concrète et l’ambiguïté du syntagme hébreu, qui peut englober les êtres et les biens dépendant d’eux ou les accompagnant.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: au milieu de tout Israël
  rationale: Maintient la dimension spatiale et publique de l’événement, conformément à l’hébreu.
theological_decisions:
- issue: Étendue de ce qui fut englouti avec Dathan et Abiram
  choice: Ne pas préciser au-delà de « leurs maisonnées » et « tout ce qui était à leurs pieds »
  alternative: Limiter explicitement le référent aux personnes, aux êtres vivants ou aux biens matériels
  rationale: Les expressions hébraïques permettent plusieurs nuances; la traduction garde cette latitude sans imposer une reconstruction théologique ou narrative.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore « la terre ouvrit sa bouche » est volontairement conservée. Le verset reste syntaxiquement lié au contexte précédent par « et ce qu’il a fait ».
