source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: fr
  text: 'afin que vous viviez longtemps dans le pays que Yahweh a juré à vos pères[a] de leur donner, à eux et à leur descendance[b] : un pays où coulent le lait et le miel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à vos ancêtres ». L’hébreu dit littéralement « à vos pères ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à leur semence »; le terme hébreu peut désigner collectivement les enfants ou, plus largement, les descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: afin que
  rationale: Introduit naturellement en français le but ou le résultat visé, tout en conservant la force de la construction hébraïque.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: vous viviez longtemps
  rationale: Rend idiomatiquement l’expression hébraïque « prolonger les jours », qui désigne la longévité.
- source_word: עַל הָאֲדָמָה
  choice: dans le pays
  rationale: Dans ce contexte du Deutéronome, אֲדָמָה désigne le territoire promis plutôt que le sol matériel; « dans le pays » est naturel en français.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: que Yahweh a juré
  rationale: Conserve explicitement le serment et rend le nom divin par « Yahweh ».
- source_word: לַאֲבֹתֵיכֶם
  choice: à vos pères
  rationale: Reproduit le terme hébreu masculin אָבוֹת; une note indique l’équivalent contextuel plus général.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: de leur donner, à eux et à leur descendance
  rationale: Conserve les deux bénéficiaires explicitement mentionnés. « Descendance » rend naturellement le singulier collectif זֶרַע.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays où coulent le lait et le miel
  rationale: Expression française établie qui restitue l’image hébraïque d’abondance et de fécondité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Portée de זֶרַע
  choice: descendance
  alternative: semence
  rationale: Le mot est un singulier collectif pouvant viser l’ensemble des descendants. « Descendance » garde cette valeur collective sans imposer ici une lecture individualisée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant le calque peu naturel « prolonger vos jours ». Les marqueurs de notes [a] et [b] figurent immédiatement après les termes concernés.
