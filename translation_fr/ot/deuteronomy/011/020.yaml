  text: וּ/כְתַבְתָּ֛/ם עַל מְזוּז֥וֹת בֵּיתֶ֖/ךָ וּ/בִ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: fr
  text: Tu les écriras sur les montants des portes de ta maison et sur tes portes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tes portes ». Le terme hébreu peut désigner les portes elles-mêmes aussi bien que l’espace où elles se trouvent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Tu les écriras
  rationale: Le parfait qal avec waw poursuit ici la série d’instructions de l’alliance et prend une valeur prescriptive. Le pronom « les » renvoie aux paroles mentionnées précédemment.
- source_word: עַל
  choice: sur
  rationale: La préposition exprime directement l’emplacement sur une surface.
- source_word: מְזוּזוֹת
  choice: les montants des portes
  rationale: Le nom désigne les montants latéraux d’une entrée. Cette formulation française est plus précise que « encadrements » et évite d’importer le sens rituel postérieur de « mezouzot ».
- source_word: בֵּיתֶךָ
  choice: de ta maison
  rationale: Le singulier concret « maison » rend naturellement בַּיִת et conserve l’adresse individuelle du texte hébreu.
- source_word: וּבִשְׁעָרֶיךָ
  choice: et sur tes portes
  rationale: שַׁעַר désigne ordinairement une porte monumentale ou l’entrée correspondante. « Tes portes » reste direct tout en conservant le pluriel et le possessif de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le futur prescriptif « Tu les écriras » correspond à la valeur injonctive du contexte. Le tutoiement singulier conserve l’adresse grammaticale de l’hébreu.
