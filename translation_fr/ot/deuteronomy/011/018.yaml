  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: fr
  text: Vous mettrez donc mes paroles que voici sur votre cœur et sur votre âme[a] ; vous les attacherez comme un signe sur votre main, et elles seront comme des bandeaux entre vos yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur votre vie » ou « sur votre être intérieur ». Le mot hébreu peut désigner la personne, la vie ou l’être intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme des phylactères », c’est-à-dire de petits étuis contenant des passages de l’Écriture, portés plus tard dans la pratique juive. Le terme hébreu est rare et son sens exact reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: Vous mettrez donc
  rationale: שׂים signifie couramment « mettre, placer ». Le futur français convient à la valeur injonctive de la séquence, tandis que « donc » marque la continuité avec le contexte précédent.
- source_word: דְּבָרַי אֵלֶּה
  choice: mes paroles que voici
  rationale: Cette formulation naturelle conserve le possessif de première personne et la valeur démonstrative de אֵלֶּה.
- source_word: עַל לְבַבְכֶם
  choice: sur votre cœur
  rationale: Le choix maintient la préposition et l’image concrète de l’hébreu, sans paraphraser par « prendre à cœur ».
- source_word: וְעַל נַפְשְׁכֶם
  choice: et sur votre être
  rationale: נֶפֶשׁ peut désigner la vie, la personne ou l’être intérieur. « Être » évite de réduire le terme à une âme désincarnée tout en restant naturel dans ce parallélisme.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: vous les attacherez
  rationale: קשׁר signifie attacher ou lier. « Attacher » convient naturellement à des objets portés sur le corps et laisse ouverte la portée littérale ou symbolique.
- source_word: לְאוֹת
  choice: comme un signe
  rationale: אוֹת désigne un signe, une marque ou un symbole. « Comme un signe » préserve cette amplitude.
- source_word: עַל יֶדְכֶם
  choice: sur votre main
  rationale: יָד signifie normalement « main », même s’il peut parfois inclure le bras. Le sens premier est conservé.
- source_word: וְהָיוּ
  choice: elles seront
  rationale: Le futur poursuit naturellement en français la séquence prescriptive du verset.
- source_word: לְטוֹטָפֹת
  choice: comme des bandeaux
  rationale: טוֹטָפֹת est un terme rare désignant vraisemblablement un objet ou ornement porté sur le front. « Bandeaux » garde l’image concrète sans introduire directement la pratique juive ultérieure des phylactères.
- source_word: בֵּין עֵינֵיכֶם
  choice: entre vos yeux
  rationale: Traduction directe de l’expression hébraïque, préférable à l’explicitation interprétative « sur votre front ».
theological_decisions:
- issue: Portée littérale ou métaphorique de l’attache sur la main et entre les yeux
  choice: Conserver les formulations corporelles concrètes sans trancher entre lecture littérale, symbolique ou conjointe.
  alternative: Paraphraser comme une exhortation à garder constamment les commandements dans les pensées et les actes, ou identifier explicitement les objets aux phylactères.
  rationale: Le texte hébreu emploie des images physiques précises, mais ne résout pas à lui seul la relation entre symbole et pratique matérielle. La traduction doit préserver cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel « vous » reflète l’adresse collective. Les images hébraïques « sur votre cœur », « sur votre main » et « entre vos yeux » sont maintenues. Les notes signalent les principales incertitudes lexicales sans imposer une anthropologie particulière ni rétroprojeter sans réserve une pratique ultérieure.
