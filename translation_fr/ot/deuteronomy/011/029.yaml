  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: fr
  text: Lorsque Yahweh, ton Dieu, t’aura fait entrer dans le pays où tu entreras pour en prendre possession, tu mettras la bénédiction sur le mont Garizim et la malédiction sur le mont Ébal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu prononceras la bénédiction sur le mont Garizim et la malédiction sur le mont Ébal ». L’hébreu dit littéralement « mettre » ou « donner » ; le contexte précise la forme de cette cérémonie.
    reason: Alternative lexicale reflétant l’ambiguïté du verbe נתן dans ce cadre rituel.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette formule introduit ici une circonstance future. « Quand » en rend naturellement la valeur temporelle en français.
- source_word: יְבִיאֲךָ
  choice: t’aura fait entrer
  rationale: Le hifil de בוא est causatif. Le futur antérieur convient à l’antériorité de l’entrée dans le pays par rapport à l’action prescrite.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu
  rationale: Le nom divin est translittéré, tandis que le suffixe de deuxième personne du singulier est conservé par « ton ».
- source_word: אֶל הָאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le pays promis. « Pays » est naturel en français pour un territoire déterminé.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: où tu vas entrer
  rationale: Le participe avec שָׁמָּה exprime l’entrée imminente vers ce lieu. La formulation française garde ce mouvement sans reproduire lourdement l’adverbe directionnel.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: ירשׁ désigne ici la prise de possession du pays; le pronom « en » reprend clairement « le pays ».
- source_word: וְנָתַתָּה
  choice: tu placeras
  rationale: נתן signifie littéralement donner, mettre ou placer. « Placer » préserve l’image concrète sans préciser indûment la forme exacte du rite.
- source_word: הַבְּרָכָה
  choice: la bénédiction
  rationale: Le nom défini désigne la bénédiction de l’alliance évoquée dans le contexte.
- source_word: עַל הַר גְּרִזִים
  choice: sur le mont Garizim
  rationale: « Sur » rend directement עַל; « mont Garizim » est la forme géographique française usuelle.
- source_word: הַקְּלָלָה
  choice: la malédiction
  rationale: Ce nom défini forme l’opposé parallèle de « la bénédiction ».
- source_word: עַל הַר עֵיבָל
  choice: sur le mont Ébal
  rationale: La formulation reste strictement parallèle à celle du mont Garizim.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu porte le nom propre divin. Sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Nature de l’action concernant la bénédiction et la malédiction
  choice: tu placeras la bénédiction… et la malédiction…
  alternative: tu prononceras la bénédiction… et la malédiction…
  rationale: Le verbe נתן signifie littéralement « donner, mettre, placer ». Le rendu choisi conserve cette formulation concrète et laisse le contexte préciser la mise en œuvre cérémonielle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse collective à Israël sous la forme grammaticale de la deuxième personne du singulier. Les noms géographiques suivent les formes françaises courantes.
