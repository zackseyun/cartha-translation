  text: כִּי֩ אִם שָׁמֹ֨ר תִּשְׁמְר֜וּ/ן אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם לַ/עֲשֹׂתָ֑/הּ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לָ/לֶ֥כֶת בְּ/כָל דְּרָכָ֖י/ו וּ/לְ/דָבְקָה בֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: fr
  text: Car si vous observez avec soin tout ce commandement que je vous ordonne de mettre en pratique[a] — à aimer Yahweh, votre Dieu, à marcher dans toutes ses voies et à vous attacher à lui[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un infinitif absolu suivi d’un verbe conjugué, construction qui souligne l’idée d’observer soigneusement. « Tout ce commandement » est au singulier et peut désigner collectivement l’ensemble de l’exigence de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à vous attacher fermement à lui » ; le verbe hébreu exprime une adhésion ou un attachement étroit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: Cette expression introduit ici une condition tout en reliant le verset à ce qui précède; « Car si » conserve ces deux fonctions.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: vous veillez avec soin à mettre en pratique
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’exhortation. Cette formulation exprime à la fois l’attention soutenue et l’obéissance concrète.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: tout ce commandement[a]
  rationale: Le singulier hébreu est conservé et peut désigner collectivement l’ensemble de l’exigence d’alliance.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: que je vous donne
  rationale: Dans le contexte d’un commandement, « donner » est une formulation française naturelle pour l’acte présent de prescrire, sans ajouter « aujourd’hui », absent de ce verset.
- source_word: לַעֲשֹׂתָהּ
  choice: mettre en pratique
  rationale: Le verbe עשה demande ici l’exécution concrète du commandement; « mettre en pratique » évite le tour français maladroit « faire le commandement ».
- source_word: לְאַהֲבָה
  choice: aimer
  rationale: L’infinitif précise le contenu de l’obéissance et s’enchaîne naturellement avec les deux infinitifs suivants.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Le nom divin est translittéré et l’expression relationnelle de l’alliance est conservée.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: marcher dans toutes ses voies
  rationale: La métaphore biblique de la marche est gardée, ainsi que la totalité exprimée par כָּל.
- source_word: וּלְדָבְקָה בוֹ
  choice: vous attacher à lui[b]
  rationale: דבק évoque une adhésion étroite et durable. « S’attacher à » est naturel en français et préserve la dimension relationnelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée sans le remplacer par un titre.
- issue: Métaphores d’alliance « marcher » et « s’attacher »
  choice: Conserver les métaphores
  alternative: vivre selon toutes ses volontés et lui rester fidèle
  rationale: Les images hébraïques ont une portée relationnelle et exhortative propre; les expliciter dans le corps du texte réduirait leur richesse.
- issue: Rapport entre le commandement et les trois infinitifs
  choice: Employer un tiret pour présenter « aimer, marcher, s’attacher » comme le contenu ou la mise en œuvre du commandement
  alternative: Les comprendre exclusivement comme le but du commandement
  rationale: La construction hébraïque autorise une relation de contenu ou de finalité. La ponctuation conserve cette souplesse sans trancher plus que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset demeure une proposition conditionnelle inachevée, comme dans l’hébreu, puisque sa conséquence apparaît dans la suite. Les métaphores bibliques sont conservées sans archaïsme.
