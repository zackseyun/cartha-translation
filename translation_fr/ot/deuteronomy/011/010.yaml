  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: fr
  text: Car le pays où tu vas entrer pour en prendre possession n’est pas comme le pays d’Égypte, d’où vous êtes sortis, où tu semais ta semence et l’arrosais avec ton pied[a], comme un jardin potager.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « avec ton pied » peut évoquer un dispositif d’irrigation actionné au pied ou le fait de diriger l’eau dans de petits canaux avec le pied.
    reason: Note culturelle expliquant une expression dont la pratique précise demeure incertaine.
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication qui motive l’exhortation précédente et convient naturellement à l’enchaînement du discours.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: En français, « pays » désigne naturellement le territoire où Israël va entrer, tout en conservant la portée géographique du terme.
- source_word: בָא שָׁמָּה
  choice: où tu vas entrer
  rationale: Rend le participe et l’idée d’un déplacement imminent vers le pays.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: Exprime clairement la possession territoriale portée par ירשׁ sans imposer la nuance filiale que pourrait suggérer « hériter ».
- source_word: לֹא כְאֶרֶץ מִצְרַיִם
  choice: n’est pas comme l’Égypte
  rationale: Comparaison idiomatique en français; le nom du pays suffit sans répéter lourdement « le pays d’Égypte ».
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: d’où vous êtes sortis
  rationale: Conserve le verbe « sortir », caractéristique du langage de l’Exode, ainsi que le passage soudain du singulier au pluriel dans l’hébreu.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: là-bas, tu semais ta semence
  rationale: L’imparfait français rend naturellement une pratique habituelle passée; « semence » maintient l’image concrète de l’hébreu.
- source_word: וְהִשְׁקִיתָ בְרַגְלְךָ
  choice: et tu l’arrosais avec ton pied
  rationale: La traduction concrète préserve l’expression culturellement obscure sans trancher entre les différentes méthodes d’irrigation possibles.
- source_word: כְּגַן הַיָּרָק
  choice: comme un jardin potager
  rationale: Désigne clairement une petite parcelle de légumes nécessitant un arrosage régulier.
theological_decisions:
- issue: Formule de la sortie d’Égypte
  choice: d’où vous êtes sortis
  alternative: que vous avez quittée
  rationale: « Être sorti » maintient l’écho narratif et théologique de l’Exode sans ajouter d’interprétation.
- issue: Alternance du singulier et du pluriel
  choice: tu vas entrer… vous êtes sortis… tu semais
  alternative: uniformiser entièrement au pluriel ou au singulier
  rationale: Le texte hébreu passe intentionnellement du singulier au pluriel puis revient au singulier; cette tension collective et individuelle est conservée.
- issue: Nature précise de l’irrigation égyptienne
  choice: avec ton pied
  alternative: au moyen d’un dispositif actionné au pied
  rationale: Le mécanisme exact n’est pas certain; le texte principal conserve donc l’image hébraïque et la note présente les principales possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait décrit les pratiques agricoles habituelles en Égypte. L’alternance hébraïque entre « tu » et « vous » est volontairement conservée.
