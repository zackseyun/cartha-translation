  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: fr
  text: et la malédiction, si vous n’écoutez pas[a] les commandements de Yahweh votre Dieu, si vous vous détournez du chemin que je vous prescris aujourd’hui pour suivre d’autres dieux, que vous n’avez pas connus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si vous n’obéissez pas aux commandements de Yahweh votre Dieu ». En contexte d’alliance, le verbe hébreu traduit par « écouter » implique souvent une écoute qui mène à l’obéissance.'
    reason: Alternative lexicale et explicitation de la portée contextuelle de שׁמע.
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: et la malédiction
  rationale: Le nom défini fait pendant à « la bénédiction » du verset précédent; « malédiction » est le terme naturel dans ce cadre d’alliance.
- source_word: אִם לֹא תִשְׁמְעוּ אֶל
  choice: si vous n’écoutez pas
  rationale: La construction conditionnelle est conservée, ainsi que le sens premier d’« écouter »; dans ce contexte, l’écoute implique l’obéissance.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Terme courant, digne et précis pour les prescriptions de l’alliance.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Le nom divin est translittéré afin de représenter directement le tétragramme, suivi de la relation d’alliance « votre Dieu ».
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: si vous vous détournez du chemin
  rationale: « Se détourner du chemin » préserve l’image hébraïque d’une déviation hors de la conduite prescrite. La répétition de « si » rend clairement en français les deux actes placés sous la même condition.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: que je vous prescris aujourd’hui
  rationale: « Prescrire un chemin » est naturel en français et communique l’autorité de מְצַוֶּה sans répétition lourde de « commandements/commande ».
- source_word: לָלֶכֶת אַחֲרֵי
  choice: pour suivre
  rationale: Dans ce contexte, « suivre » rend naturellement l’idée d’aller derrière d’autres dieux tout en gardant l’image du chemin.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Équivalent direct de la formule deutéronomique, sans préciser indûment qu’ils seraient étrangers.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: que vous n’avez pas connus
  rationale: Le passé composé garde la portée actuelle de l’accompli hébreu; l’accord au masculin pluriel traite les dieux comme référents personnels sans modifier le relatif invariant « que ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération représente le nom d’alliance présent dans le texte hébreu au lieu de le remplacer par un titre.
- issue: Valeur de שׁמע dans le contexte de l’alliance
  choice: écoutez
  alternative: obéissez à
  rationale: « Écouter » conserve le lexème et l’image de l’audition attentive, tandis qu’une note explicite sa nuance d’obéissance sans l’imposer dans le texte principal.
- issue: Lien syntaxique de לָלֶכֶת אַחֲרֵי
  choice: pour suivre d’autres dieux
  alternative: en allant à la suite d’autres dieux
  rationale: L’infinitif peut exprimer l’orientation ou le résultat du détournement. « Pour suivre » laisse ouverte la nuance exacte tout en produisant un français naturel.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme avec le verset précédent et la métaphore du chemin sont préservés. La seconde occurrence de « si » clarifie la coordination conditionnelle en français sans changer la relation logique de l’hébreu.
