  variant: modern international French
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: fr
  text: 'Sachez-le aujourd’hui : je ne m’adresse pas à vos enfants[a], eux qui n’ont ni connu ni vu la discipline de Yahweh votre Dieu, sa grandeur, sa main forte[b] et son bras étendu—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : littéralement, « car non pas vos enfants, qui n’ont pas connu et qui n’ont pas vu… ». Moïse oppose ses auditeurs, témoins des actes de Yahweh, à leurs enfants.'
    reason: alternative_reading
  - marker: b
    text: Ou « sa main puissante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: Sachez-le aujourd’hui
  rationale: Le parfait qal avec waw fonctionne ici comme une invitation solennelle à reconnaître un fait. « Sachez-le » garde l’adresse directe et l’immédiateté de הַיּוֹם.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: je ne m’adresse pas à vos enfants
  rationale: L’hébreu est elliptique après « car non pas vos enfants ». Le verbe explicité en français rend intelligible le contraste entre les auditeurs de Moïse et leurs enfants sans modifier son sens discursif.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: eux qui n’ont ni connu ni vu
  rationale: La tournure coordonnée exprime l’absence de connaissance vécue et de témoignage visuel. « Ni… ni… » restitue naturellement le parallélisme en français.
- source_word: מוּסַר
  choice: discipline
  rationale: Le terme englobe l’éducation, la correction et la formation par l’épreuve. « Discipline » conserve cette amplitude sans le réduire au seul châtiment.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, et l’expression d’alliance אֱלֹהֵיכֶם est rendue directement.
- source_word: גָּדְלוֹ
  choice: sa grandeur
  rationale: Traduction directe du nom désignant la grandeur de Dieu manifestée dans ses actes.
- source_word: יָדוֹ הַחֲזָקָה
  choice: sa main forte
  rationale: Cette formulation rend directement חֲזָקָה tout en conservant l’image hébraïque de la puissance divine agissante.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: son bras étendu
  rationale: La traduction préserve l’image traditionnelle du bras tendu, symbole de la puissance divine mise en œuvre.
theological_decisions:
- issue: Ellipse dans le contraste avec « vos enfants »
  choice: Explicitation par « je ne m’adresse pas à vos enfants »
  alternative: « car ce ne sont pas vos enfants qui… »
  rationale: Le texte hébreu omet le verbe directeur et dépend du contexte. L’explicitation choisie identifie l’auditoire visé par Moïse tout en signalant en note que la formulation source demeure elliptique.
translation_notes:
  register: Français international actuel, digne et accessible. L’impératif solennel « Sachez-le » maintient la force de l’adresse. Les images concrètes de la main et du bras sont conservées, ainsi que le tiret final indiquant que la phrase se poursuit au verset suivant.
