base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: fr
  text: Personne ne pourra vous résister[a]. Yahweh, votre Dieu, fera régner la peur et la crainte que vous inspirerez sur tout le pays que vous foulerez[b], comme il vous l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Aucun homme ne se tiendra devant vous. » L’expression hébraïque peut signifier que personne ne pourra vous résister ni s’opposer à vous avec succès.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur la face de tout le pays que vous foulerez ». Le mot hébreu peut aussi désigner la terre, mais le contexte immédiat vise ici le territoire qu’Israël foulera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Personne ne pourra tenir devant vous
  rationale: La tournure hébraïque évoque littéralement quelqu’un qui se tient devant Israël, mais signifie ici résister ou s’opposer avec succès. « Personne » rend naturellement en français la valeur négative et représentative de אִישׁ, tandis que « tenir devant vous » conserve l’image source.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: la peur et la terreur que vous inspirez
  rationale: Les deux noms expriment des notions proches et forment une intensification. La relative précise naturellement en français qu’Israël est la source de cette peur, sans suggérer qu’il s’agit de la peur ressentie par Israël.
- source_word: יִתֵּן
  choice: répandra
  rationale: נתן signifie fondamentalement « donner, mettre ». Avec la peur placée sur tout un territoire, « répandra » exprime idiomatiquement en français l’action causative et son extension géographique.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, votre Dieu
  rationale: Le nom divin est translittéré afin de préserver le nom d’alliance présent dans le texte hébreu; l’apposition « votre Dieu » est conservée.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: sur toute l’étendue du pays
  rationale: Littéralement « sur la face de tout le pays ». « Toute l’étendue » garde l’idée spatiale de פְּנֵי dans un français naturel, et « pays » convient au territoire que les Israélites fouleront dans le contexte immédiat.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: où vous poserez le pied
  rationale: דרך désigne le fait de fouler ou marcher sur. Cette expression française conserve l’image concrète tout en étant plus naturelle que « que vous foulerez ».
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: comme il vous l’a dit
  rationale: דבר signifie « parler, dire ». Ce choix évite de préciser « promis », notion possible dans le contexte mais non explicitement encodée par le verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom propre d’alliance du texte source plutôt que de le remplacer par un titre.
- issue: Valeur représentative de אִישׁ
  choice: Personne
  alternative: Aucun homme
  rationale: Sous la négation, אִישׁ a ici le sens idiomatique de « personne, qui que ce soit ». « Personne » est exact et naturel en français sans limiter artificiellement la portée aux adultes de sexe masculin.
- issue: Force modale de la première proposition
  choice: ne pourra tenir
  alternative: ne tiendra
  rationale: Le contexte exprime l’impossibilité de résister à Israël. L’ajout de « pourra » explicite cette valeur idiomatique sans transformer la déclaration en une affirmation étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les images essentielles de la résistance et du pied posé sur le territoire, tout en évitant les calques peu naturels. Les deux termes hébreux de peur sont distingués par « peur » et « terreur ».
