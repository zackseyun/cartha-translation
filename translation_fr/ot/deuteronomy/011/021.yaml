  naturalness: 'Le français est moderne et soutenu. « Yahweh a juré à vos pères de leur donner » est cependant syntaxiquement moins net : il peut laisser entendre que les pères sont l’objet du serment plutôt que les bénéficiaires du don. « a juré de donner à vos pères » est plus idiomatique et précis.'
