  variant: modern international French
source:
  edition: WLC
  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: fr
  text: afin que vos jours et ceux de vos fils[a] se multiplient sur la terre que Yahweh a juré de donner à vos pères, aussi longtemps que les cieux seront au-dessus de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de vos enfants ». L’hébreu dit littéralement « de vos fils ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme les jours des cieux au-dessus de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat des commandements précédents et conserve naturellement la valeur finale de l’hébreu.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: vos jours se multiplient
  rationale: Conserve l’image hébraïque de jours qui deviennent nombreux, sans la réduire à une simple paraphrase telle que « vous viviez longtemps ».
- source_word: וִימֵי בְנֵיכֶם
  choice: et ceux de vos fils
  rationale: « Ceux » évite la répétition pesante de « jours », tandis que « fils » rend directement le masculin pluriel בנים; une note signale le sens représentatif possible.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: Dans ce contexte d’alliance, אֲדָמָה désigne le territoire promis; « sur la terre » reste proche de la préposition עַל et convient au français.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: que Yahweh a juré
  rationale: Rend directement la proposition relative et le langage de serment associé à l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme plutôt que de le remplacer par un titre.
- source_word: לַאֲבֹתֵיכֶם
  choice: à vos pères
  rationale: Préserve le langage familial et historique de l’alliance; « ancêtres » demeure une possibilité sémantique plus générale.
- source_word: לָתֵת לָהֶם
  choice: de leur donner
  rationale: Le pronom « leur » reprend naturellement « vos pères » et respecte l’absence d’un objet direct pronominal explicite dans l’hébreu.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: aussi longtemps que les cieux seront au-dessus de la terre
  rationale: Exprime clairement en français la durée durable suggérée par la comparaison, tout en conservant les images des cieux et de la terre; la formulation plus littérale est donnée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom de l’alliance; « Yahweh » le représente sans le remplacer par un titre.
- issue: Portée de בְנֵיכֶם
  choice: vos fils
  alternative: vos enfants
  rationale: Le nom hébreu est au masculin pluriel et signifie littéralement « fils », mais il peut représenter plus largement la descendance; cette possibilité est conservée en note.
- issue: Valeur de la comparaison finale
  choice: aussi longtemps que les cieux seront au-dessus de la terre
  alternative: comme les jours des cieux au-dessus de la terre
  rationale: La formulation principale transmet l’idée de durée sans effacer l’imagerie cosmique. La note préserve la structure inhabituelle et l’ambiguïté poétique de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en gardant le vocabulaire concret de l’alliance, l’image des jours multipliés et la permanence des cieux au-dessus de la terre.
