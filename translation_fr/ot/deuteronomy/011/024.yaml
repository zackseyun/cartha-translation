  - severity: low
    issue: « la plante de votre pied » est inutilement singulier en français
    rationale: Bien que le nom « pied » soit au singulier construit en hébreu, son complément possessif est pluriel. « La plante de vos pieds » est l’expression française naturelle et conserve l’image concrète.
