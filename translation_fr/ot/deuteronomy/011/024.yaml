base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: fr
  text: Tout lieu que foulera la plante de vos pieds sera à vous ; du désert et du Liban, depuis le Fleuve, l’Euphrate, jusqu’à la mer occidentale[a], telle sera votre frontière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la mer de derrière » ou « la dernière mer » ; expression traditionnellement comprise comme désignant la mer Méditerranée, située à l’ouest.
    reason: Signaler le sens littéral de l’expression hébraïque et son interprétation géographique habituelle.
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Tout lieu
  rationale: 'Rend naturellement l’expression distributive : chaque lieu où le peuple posera le pied.'
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: que foulera la plante de votre pied
  rationale: Conserve l’image concrète de la plante du pied et le singulier collectif de l’hébreu.
- source_word: לָכֶם יִהְיֶה
  choice: sera à vous
  rationale: Formulation concise et idiomatique de la promesse de possession.
- source_word: מִן הַמִּדְבָּר וְהַלְּבָנוֹן
  choice: du désert et du Liban
  rationale: Préserve l’enchaînement inhabituel des deux repères géographiques sans préciser artificiellement leur relation.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: depuis le Fleuve, le fleuve Euphrate
  rationale: Maintient le titre générique « le Fleuve », puis son identification en apposition comme l’Euphrate.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: jusqu’à la mer occidentale
  rationale: Dans l’orientation géographique hébraïque, la « mer de derrière » désigne la mer située à l’ouest ; cette formulation en communique clairement le sens.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: telle sera votre frontière
  rationale: Rend גְּבוּל par « frontière » et emploie une tournure française naturelle pour conclure l’énumération des limites.
theological_decisions:
- issue: Portée de la promesse territoriale
  choice: Présenter simplement la promesse et ses limites géographiques
  alternative: Préciser qu’il s’agit de frontières idéales, d’une possession perpétuelle ou d’un accomplissement typologique
  rationale: Le verset énonce une promesse territoriale dans son cadre d’alliance, mais ne tranche pas à lui seul les débats relatifs à son accomplissement ou à sa portée ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule distingue la promesse générale de la description des limites. L’enchaînement géographique quelque peu abrupt de l’hébreu est volontairement conservé plutôt que réorganisé de manière interprétative.
