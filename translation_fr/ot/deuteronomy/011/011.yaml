  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: fr
  text: Mais le pays où vous allez entrer pour en prendre possession[a] est un pays de montagnes et de vallées ; il boit l’eau de la pluie du ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour en hériter ». Dans ce contexte, le verbe hébreu peut évoquer à la fois la prise de possession et la réception d’un héritage.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici le mot habituellement rendu, selon le contexte, par « ciel » ou « cieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Mais le pays
  rationale: La conjonction introduit ici un contraste avec l’Égypte décrite au verset précédent ; « Mais » rend naturellement cette fonction discursive.
- source_word: עֹבְרִים שָׁמָּה
  choice: où vous allez passer
  rationale: Le participe exprime le déplacement imminent vers le pays. Cette formulation française conserve l’idée de passage sans expliciter le Jourdain, qui n’est pas nommé dans ce verset.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: Le verbe ירשׁ désigne ici l’action d’entrer en possession du pays, tout en pouvant comporter une nuance d’héritage dans le cadre de l’alliance.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: un pays de montagnes et de vallées
  rationale: Cette traduction directe et naturelle rend le contraste topographique entre les hauteurs et les dépressions.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: de la pluie du ciel
  rationale: « Du ciel » est l’expression idiomatique française pour la provenance de la pluie, tout en conservant l’image hébraïque.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: il boit l’eau
  rationale: La personnification du pays est conservée plutôt que remplacée par la formulation plus abstraite « il est arrosé ».
theological_decisions:
- issue: Nuance de possession ou d’héritage dans ירשׁ
  choice: prendre possession
  alternative: recevoir en héritage
  rationale: Le contexte souligne l’entrée active d’Israël dans le pays. Une note conserve toutefois la nuance d’héritage liée à l’alliance sans l’imposer dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La structure contrastive et la personnification vive du pays qui « boit » l’eau sont préservées. Les notes sont placées immédiatement après les expressions auxquelles elles se rapportent.
