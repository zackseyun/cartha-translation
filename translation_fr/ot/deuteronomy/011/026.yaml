  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: fr
  text: 'Vois : aujourd’hui, je place devant vous une bénédiction et une malédiction.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Vois : aujourd’hui, je mets devant vous une bénédiction et une malédiction. » Le verbe hébreu peut signifier « donner », « mettre » ou « placer » ; dans cette construction, « placer devant vous » est plus naturel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Vois
  rationale: Impératif masculin singulier employé pour attirer l’attention de l’ensemble d’Israël. « Vois » conserve le changement de nombre du singulier au pluriel et reste digne en français moderne.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant souligne le locuteur, mais « moi, je » alourdirait ici la phrase et risquerait de suraccentuer cet élément.
- source_word: נֹתֵן
  choice: place
  rationale: נתן peut signifier « donner », « mettre » ou « placer ». Avec « devant vous », « je place » rend naturellement l’image d’alternatives présentées aux auditeurs.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: Expression idiomatique signifiant « devant » ou « en présence de » ; le suffixe est au pluriel.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent temporel direct et naturel de הַיּוֹם en français moderne.
- source_word: בְּרָכָה
  choice: une bénédiction
  rationale: Nom singulier indéfini, mis en opposition avec « une malédiction ».
- source_word: וּקְלָלָה
  choice: et une malédiction
  rationale: Préserve le parallélisme antithétique des deux réalités présentées à Israël.
theological_decisions:
- issue: Nature de la bénédiction et de la malédiction
  choice: Présenter simplement les deux réalités de l’alliance placées devant Israël.
  alternative: En faire une maxime générale sur la récompense morale et le châtiment.
  rationale: Le verset introduit les bénédictions et les malédictions dans le cadre de l’alliance deutéronomique sans expliquer davantage leur portée doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le singulier « Vois » suivi du pluriel « vous » est conservé, car il reflète la manière dont Moïse interpelle collectivement Israël. Les deux-points rendent la fonction d’appel à l’attention de l’impératif initial.
