  text: וְ/אֶת אֹֽתֹתָי/ו֙ וְ/אֶֽת מַעֲשָׂ֔י/ו אֲשֶׁ֥ר עָשָׂ֖ה בְּ/ת֣וֹךְ מִצְרָ֑יִם לְ/פַרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם וּ/לְ/כָל אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: fr
  text: ainsi que ses signes et ses actes qu’il a accomplis au milieu de l’Égypte[a], à l’égard du pharaon, roi d’Égypte, et de tout son pays[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en Égypte ». L’hébreu dit plus littéralement : « au milieu de l’Égypte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « contre le pharaon ... et contre tout son pays ». La préposition hébraïque signifie littéralement « à / envers », mais le contexte évoque des actes de jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: ses signes
  rationale: « Signe » rend directement אוֹת et conserve sa portée de signe ou de prodige sans expliciter davantage le caractère miraculeux.
- source_word: מַעֲשָׂיו
  choice: ses actes
  rationale: מַעֲשֶׂה désigne ce qui est fait. « Actes » est naturel en français moderne et convient aux interventions divines évoquées ici.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a accomplis
  rationale: Le relatif porte sur « signes » et « actes ». « Accomplir » évite la répétition peu élégante « actes qu’il a faits » tout en gardant le sens de עָשָׂה.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: au cœur de l’Égypte
  rationale: Cette expression restitue naturellement l’idée spatiale de בְּתוֹךְ, littéralement « au milieu de », plutôt que de la réduire à « en Égypte ».
- source_word: לְפַרְעֹה
  choice: contre le pharaon
  rationale: Bien que לְ signifie formellement « à/pour », il marque ici la cible d’actes de jugement. En français, « à l’égard du pharaon » serait plus ambigu mais moins naturel, tandis que « au pharaon » ne convient pas à la construction.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: roi d’Égypte
  rationale: Rendu direct et idiomatique de la construction hébraïque.
- source_word: וּלְכָל אַרְצוֹ
  choice: et contre tout son pays
  rationale: Le même לְ coordonné désigne la seconde cible. Ici אֶרֶץ renvoie à l’Égypte comme territoire politique; « pays » est plus naturel que « terre » avec le possessif renvoyant au pharaon.
- source_word: וְאֶת ... וְאֶת
  choice: ainsi que ... et
  rationale: Les marqueurs d’objet relient ce fragment à la phrase du verset précédent. « Ainsi que » signale cette continuité syntaxique en français sans traduire artificiellement אֵת.
theological_decisions:
- issue: Valeur de la préposition לְ devant le pharaon et son pays
  choice: contre le pharaon ... et contre tout son pays
  alternative: au pharaon ... et à tout son pays
  rationale: Le contexte de l’Exode présente les signes et les actes comme des jugements dirigés contre le pharaon et l’Égypte. Ce choix explicite la relation visée sans introduire de particularité doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le fragment conserve son rattachement au contexte précédent par « ainsi que » et reste ouvert par un tiret final, conformément à la continuité de la phrase.
