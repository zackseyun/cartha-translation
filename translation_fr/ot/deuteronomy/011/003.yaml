  verdict: revise
  source_fidelity: La traduction actuelle rend correctement les deux objets (« ses signes » et « ses actes ») et la localisation. Toutefois, « contre » explicite comme hostile la valeur de לְ, dont le sens formel est plus large (« à / envers »). Le contexte permet cette lecture, mais le texte français devrait préserver l’ambiguïté par une formulation non polémique, avec note pour l’alternative contextuelle.
  naturalness: « Au milieu de l’Égypte » est à la fois direct, idiomatique et moins métaphorique que « au cœur de l’Égypte ». « À l’égard du pharaon ... et de tout son pays » est naturel dans ce fragment dépendant de la phrase précédente et permet de conserver le parallélisme des deux compléments.
  terminology: « Signes », « actes », « pharaon, roi d’Égypte » et « pays » conviennent au français international moderne. Le titre « pharaon » reste en minuscule, conformément à l’usage français lorsqu’il est employé comme titre.
