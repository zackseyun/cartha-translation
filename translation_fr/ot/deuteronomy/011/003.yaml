    rationale: Le contexte des plaies et des jugements soutient « contre », mais לְ signifie littéralement « à / envers » et ne porte pas à elle seule cette nuance hostile. Une traduction principale plus neutre, accompagnée d’une note, préserve mieux l’ambiguïté du texte source.
  - severity: low
