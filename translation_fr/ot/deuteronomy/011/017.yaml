  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: fr
  text: 'Alors la colère de Yahweh s’enflammera contre vous[a] : il fermera le ciel, et il n’y aura pas de pluie ; le sol ne donnera pas ses produits, et vous disparaîtrez rapidement du bon pays que Yahweh vous donne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le nez de Yahweh brûlera contre vous », expression hébraïque qui décrit une colère intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Alors la colère de Yahweh s’enflammera contre vous
  rationale: L’expression חרה אף est un idiome hébreu décrivant une colère qui s’embrase. « Alors » marque naturellement la conséquence annoncée par rapport à l’avertissement précédent, tandis que « s’enflammera » conserve l’image sans reproduire littéralement « le nez ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que par un titre, afin de préserver le nom divin présent dans le texte hébreu.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: il fermera le ciel
  rationale: Le verbe עצר évoque ici la fermeture ou la retenue du ciel qui empêche la pluie. Le singulier collectif « le ciel » est idiomatique en français moderne et maintient l’image.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: et il n’y aura pas de pluie
  rationale: La coordination hébraïque est conservée. Le lien de conséquence avec la fermeture du ciel demeure clair sans devoir l’expliciter davantage.
- source_word: וְהָאֲדָמָה לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: le sol ne donnera pas ses produits
  rationale: « Le sol » rend אֲדָמָה et le distingue de הָאָרֶץ, rendu ensuite par « pays ». « Ses produits » exprime le rendement agricole désigné par יְבוּל.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: vous disparaîtrez rapidement
  rationale: אבד peut désigner le fait de périr ou de disparaître. Dans la construction avec מֵעַל et le pays, « disparaître du pays » préserve la possibilité d’une mort, d’une destruction ou d’une éviction, sans préciser indûment le mécanisme.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: du bon pays
  rationale: מֵעַל exprime littéralement l’éloignement de dessus la terre, mais « disparaître du bon pays » transmet naturellement en français l’idée d’en être ôté. « Pays » convient ici au territoire promis et maintient la distinction avec « le sol ».
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: que Yahweh vous donne
  rationale: Le présent français rend naturellement le participe נֹתֵן et présente le don du pays comme actuel dans le cadre du discours.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le caractère de nom propre sans lui substituer un titre.
- issue: Image anthropomorphique de la colère
  choice: la colère de Yahweh s’enflammera contre vous
  alternative: Yahweh se mettra en colère contre vous; littéralement, le nez de Yahweh brûlera contre vous
  rationale: Ce rendu conserve la métaphore de la colère qui brûle tout en évitant le calque obscur du « nez », élément idiomatique en hébreu.
- issue: Portée de וַאֲבַדְתֶּם
  choice: vous disparaîtrez rapidement du bon pays
  alternative: vous périrez rapidement loin du bon pays; vous serez rapidement exterminés du bon pays
  rationale: Le verbe peut englober la mort, la destruction ou la disparition du territoire. La formulation retenue maintient cette latitude dans un contexte de jugement lié au pays.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la menace est conservé par une succession de propositions coordonnées. « Le ciel » et « le sol » sont courants sans être familiers; « le bon pays » reprend le vocabulaire caractéristique du Deutéronome.
