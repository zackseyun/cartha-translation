  text: וְ/נָתַתִּ֧י מְטַֽר אַרְצְ/כֶ֛ם בְּ/עִתּ֖/וֹ יוֹרֶ֣ה וּ/מַלְק֑וֹשׁ וְ/אָסַפְתָּ֣ דְגָנֶ֔/ךָ וְ/תִֽירֹשְׁ/ךָ֖ וְ/יִצְהָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: fr
  text: Alors, j’enverrai sur votre terre la pluie en son temps[a], la pluie d’automne et la pluie de printemps, et tu récolteras ton grain, ton vin nouveau[b] et ton huile[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au moment voulu » ; les pluies mentionnées ensuite sont aussi appelées « la première pluie et la dernière pluie ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire du vin nouvellement produit ; on peut aussi traduire simplement par « vin ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire de l’huile d’olive.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: alors je donnerai
  rationale: Dans la séquence conditionnelle commencée au verset précédent, le parfait avec waw exprime ici la conséquence promise. « Alors » rend naturellement ce lien tout en conservant la parole divine à la première personne.
- source_word: מְטַר אַרְצְכֶם
  choice: à votre terre la pluie
  rationale: מָטָר désigne la pluie nécessaire aux cultures, et אֶרֶץ la terre des Israélites. « Terre » convient mieux que « pays » au contexte agricole et territorial.
- source_word: בְּעִתּוֹ
  choice: en son temps
  rationale: La formule désigne le moment approprié ou fixé pour la pluie. Cette traduction reste proche de l’hébreu sans préciser plus que le texte.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: la pluie d’automne et la pluie de printemps
  rationale: Ces termes désignent respectivement les premières pluies de la saison agricole, en automne, et les pluies tardives, au printemps. Les saisons sont plus transparentes en français moderne que « première pluie » et « dernière pluie ».
- source_word: וְאָסַפְתָּ
  choice: et tu récolteras
  rationale: Dans ce contexte agricole, le verbe « rassembler, recueillir » désigne la rentrée des produits de la terre. « Récolteras » est naturel et ne modifie pas le sens.
- source_word: דְגָנֶךָ
  choice: ton grain
  rationale: דָּגָן est un terme collectif pour les céréales ou leur produit. « Grain » en garde l’étendue sans désigner une céréale particulière.
- source_word: וְתִירֹשְׁךָ
  choice: ton vin nouveau
  rationale: תִּירוֹשׁ désigne couramment le produit récent de la vigne, souvent du vin nouvellement produit. « Vin nouveau » maintient cette nuance agricole sans trancher toutes les questions sur son degré de fermentation.
- source_word: וְיִצְהָרֶךָ
  choice: ton huile
  rationale: Dans la triade agricole traditionnelle, יִצְהָר renvoie à l’huile d’olive. Le texte principal conserve le terme bref « huile », avec une note culturelle explicative.
- source_word: אַרְצְכֶם / וְאָסַפְתָּ ... דְגָנֶךָ
  choice: votre terre / tu récolteras ... ton grain
  rationale: L’hébreu passe du pluriel « votre » au singulier « tu/ton ». La traduction conserve ce changement de nombre au lieu de l’harmoniser silencieusement.
theological_decisions:
- issue: La bénédiction agricole dans le cadre de l’alliance
  choice: Présenter une promesse concrète de pluies saisonnières et de récoltes accordées à Israël dans sa terre.
  alternative: Interpréter principalement la pluie et les produits comme des symboles spirituels, sacramentels, eschatologiques ou comme une promesse générale de prospérité.
  rationale: Le texte hébreu parle directement des conditions agricoles de la terre. La traduction ne doit ni spiritualiser cette promesse ni lui importer une application doctrinale ultérieure.
- issue: Alternance entre destinataire collectif et individuel
  choice: Conserver « votre terre », puis « tu récolteras » et « ton ».
  alternative: Uniformiser tout le verset au pluriel ou au singulier.
  rationale: Cette alternance est présente dans l’hébreu massorétique et reflète la manière dont le Deutéronome s’adresse à Israël à la fois comme collectivité et comme interlocuteur singulier. La préserver évite d’effacer une tension grammaticale réelle.
translation_notes:
  register: Français international moderne, simple et digne. La phrase garde la cadence agricole de l’hébreu. L’alternance inhabituelle entre « votre » et « tu/ton » est volontaire, car elle reproduit le passage du pluriel au singulier dans le texte source.
