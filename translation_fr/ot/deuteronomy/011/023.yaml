source:
  edition: WLC
  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: fr
  text: alors Yahweh chassera devant vous toutes ces nations, et vous déposséderez des nations plus grandes et plus puissantes que vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: chassera
  rationale: Le hiphil de ירשׁ exprime ici l’action causative de retirer la possession à quelqu’un. « Chassera » est naturel dans ce contexte et distingue l’action de Yahweh du verbe suivant appliqué à Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: toutes ces nations
  rationale: « Nations » convient au cadre ethnopolitique de la conquête et reproduit naturellement la portée de כָּל et du démonstratif.
- source_word: מִלִּפְנֵיכֶם
  choice: devant vous
  rationale: Expression idiomatique française correspondant à l’hébreu « de devant votre face/présence » après un verbe d’expulsion.
- source_word: וִירִשְׁתֶּם
  choice: vous déposséderez
  rationale: Le qal de ירשׁ peut signifier posséder, hériter ou déposséder. Puisque son complément direct est constitué de nations et non du pays, « déposséderez » exprime précisément leur perte de possession.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Maintient la cohérence lexicale avec la première occurrence et le sens collectif et politique du terme.
- source_word: גְּדֹלִים
  choice: plus grandes
  rationale: Le comparatif est rendu explicitement en français en raison de מִכֶּם, « que vous ».
- source_word: וַעֲצֻמִים
  choice: plus puissantes
  rationale: עָצוּם désigne la force ou la puissance. « Puissantes » est actuel, digne et convient mieux à des nations que « fortes » dans ce contexte.
- source_word: מִכֶּם
  choice: que vous
  rationale: Rend l’emploi comparatif standard de מִן avec le suffixe de la deuxième personne du pluriel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel tout en employant une translittération reconnue en français.
- issue: Sens de וִירִשְׁתֶּם avec des nations comme complément
  choice: vous déposséderez
  alternative: vous prendrez possession de ; vous hériterez de
  rationale: 'Le choix conserve la tension concrète du texte : Israël ne reçoit pas simplement un territoire, mais retire à ces nations leur possession. Il évite aussi l’expression française ambiguë « prendre possession de nations ».'
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition de « nations » et distingue « chassera », action attribuée à Yahweh, de « déposséderez », action attribuée à Israël. Aucun marqueur de note n’est requis.
