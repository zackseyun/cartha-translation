id: DEU.11.15
reference: Deuteronomy 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: fr
  text: Et je donnerai de l’herbe[a] dans ton champ pour ton bétail ; tu mangeras et tu seras rassasié[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la végétation » ou « des plantes herbacées » ; le terme hébreu peut désigner largement ce qui pousse, mais il s’agit probablement ici de fourrage pour le bétail.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu mangeras à satiété ». Le verbe hébreu désigne le fait d’avoir suffisamment mangé, d’être pleinement rassasié.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Et je donnerai
  rationale: Le parfait qal à la première personne du singulier, relié par la conjonction, exprime ici la suite de la promesse. Le futur français et la conjonction « Et » en rendent naturellement la valeur.
- source_word: עֵשֶׂב
  choice: de l’herbe
  rationale: Le terme peut désigner plus largement la végétation ou les plantes herbacées, mais la précision « pour ton bétail » indique ici du fourrage ; « herbe » est naturel et précis dans ce contexte.
- source_word: בְּשָׂדְךָ
  choice: dans ton champ
  rationale: Cette formulation conserve le nom concret « champ » ainsi que le singulier de l’adresse hébraïque.
- source_word: לִבְהֶמְתֶּךָ
  choice: pour ton bétail
  rationale: Le nom collectif désigne ici les animaux domestiques d’un milieu agricole. « Bétail » rend clairement cette valeur collective sans la limiter aux bovins.
- source_word: וְאָכַלְתָּ
  choice: tu mangeras
  rationale: Le futur convient à la suite de la promesse, et le tutoiement singulier préserve l’adresse collective à Israël sous la forme d’un singulier représentatif.
- source_word: וְשָׂבָעְתָּ
  choice: tu seras rassasié
  rationale: Le verbe évoque le fait d’avoir mangé à satiété. « Être rassasié » en donne le sens physique et positif dans un registre français courant et digne.
theological_decisions:
- issue: Adresse à Israël au singulier représentatif
  choice: 'Conserver la deuxième personne du singulier : « ton champ », « ton bétail », « tu mangeras »'
  alternative: 'Employer le pluriel : « vos champs », « votre bétail », « vous mangerez »'
  rationale: L’hébreu emploie constamment la deuxième personne masculine du singulier dans cette adresse d’alliance à Israël. Le singulier français en préserve la forme et la force rhétorique.
- issue: Nature de la bénédiction promise
  choice: Présenter sobrement une provision agricole accordée par Dieu
  alternative: Développer le verset en promesse générale de prospérité ou d’abondance
  rationale: Le texte promet directement de l’herbe pour le bétail et de la nourriture jusqu’au rassasiement. La traduction n’ajoute aucune portée doctrinale qui ne soit pas exprimée dans le verset.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier maintient l’adresse hébraïque à Israël comme unité collective. La ponctuation évite une accumulation lourde de « et » tout en conservant la progression de la promesse.
