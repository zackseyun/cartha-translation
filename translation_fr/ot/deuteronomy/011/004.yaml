  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: fr
  text: 'et ce qu’il a fait à l’armée égyptienne, à ses chevaux et à ses chars : tandis qu’ils vous poursuivaient, il a fait déferler sur eux les eaux de la mer Rouge[a], et Yahweh les a anéantis jusqu’à ce jour ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « mer des Roseaux ». Traduction traditionnelle : « mer Rouge ».'
    reason: Alternative lexicale et transparence sur le nom hébreu יַם סוּף.
lexical_decisions:
- source_word: חֵיל
  choice: armée
  rationale: Dans ce contexte militaire, avec les chevaux et les chars, le terme désigne l’armée ou les forces militaires de l’Égypte.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: à ses chevaux et à ses chars
  rationale: Les suffixes renvoient collectivement à l’Égypte. « Chars » est naturel en français moderne et convient au contexte militaire.
- source_word: הֵצִיף
  choice: a fait déferler
  rationale: La forme causative indique que Dieu a fait venir les eaux sur les poursuivants. « Faire déferler » conserve cette causalité dans un français fluide.
- source_word: מֵי יַם סוּף
  choice: les eaux de la mer Rouge
  rationale: « Mer Rouge » est la désignation française traditionnelle et largement reconnue ; le sens littéral possible du nom hébreu est signalé en note.
- source_word: עַל־פְּנֵיהֶם
  choice: sur eux
  rationale: Dans ce contexte, l’expression indique que les eaux ont recouvert les Égyptiens ; une traduction littérale par « sur leur face » serait peu naturelle.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: tandis qu’ils vous poursuivaient
  rationale: La construction exprime une action simultanée. Cette formulation rend clairement le rapport temporel.
- source_word: וַיְאַבְּדֵם
  choice: les a anéantis
  rationale: Le verbe causatif exprime ici la destruction des poursuivants. « Anéantir » rend avec naturel et force l’issue définitive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Cette expression hébraïque courante présente le résultat comme valable jusqu’au moment où parle le narrateur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve sa fonction de nom propre sans lui substituer un titre.
- issue: Rendu de יַם סוּף
  choice: mer Rouge
  alternative: mer des Roseaux
  rationale: « Mer Rouge » conserve l’appellation géographique traditionnelle en français, tandis que la note rend visible le sens lexical possible de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe maintient le lien avec la phrase plus large du contexte ; le deux-points clarifie l’explication qui suit sans transformer le fragment en phrase autonome.
