  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: fr
  text: et ce qu’il a fait pour vous dans le désert jusqu’à votre arrivée en ce lieu —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: et ce que
  rationale: La conjonction et le relatif poursuivent l’énumération des actes dont Israël a été témoin. « Et ce que » conserve naturellement cette fonction en français.
- source_word: עָשָׂה
  choice: il a fait
  rationale: Le verbe courant עשה signifie ici « faire » et renvoie aux actes de Dieu évoqués dans le contexte.
- source_word: לָכֶם
  choice: pour vous
  rationale: Avec עשה, la préposition ל indique ici que ces actes concernaient Israël et étaient accomplis en sa faveur; « pour vous » est direct et idiomatique.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans ce contexte géographique, מִדְבָּר désigne la région désertique parcourue par Israël. « Désert » est le terme biblique courant et naturel en français international.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: jusqu’à votre arrivée en ce lieu
  rationale: Le premier עַד exprime l’aboutissement temporel et le second la destination spatiale. Cette formulation française rend les deux dimensions sans lourdeur.
theological_decisions:
- issue: Sujet implicite de « il a fait »
  choice: Le pronom « il » renvoie au SEIGNEUR dans le contexte immédiat.
  alternative: Répéter « le SEIGNEUR »
  rationale: L’hébreu poursuit une phrase dont le sujet est déjà établi. Le pronom préserve cette continuité sans ajouter une répétition absente du texte.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve le caractère fragmentaire du verset, qui poursuit l’énumération précédente, ainsi que le tiret indiquant que la phrase continue.
