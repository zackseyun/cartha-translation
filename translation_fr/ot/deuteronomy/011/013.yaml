  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: fr
  text: Si vous écoutez attentivement mes commandements, ceux que je vous ordonne aujourd’hui[a], pour aimer Yahweh votre Dieu[b] et pour le servir de tout votre cœur et de tout votre être[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « les commandements que je vous ordonne aujourd’hui ». Le verbe a ici une valeur actuelle : « que je vous ordonne aujourd’hui ».'
    reason: Précision sur la syntaxe source et la valeur actuelle du participe.
  - marker: b
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: Indication de la forme hébraïque et de l’autre convention de traduction courante.
  - marker: c
    text: Ou « de toute votre âme » ou « de toute votre vie ».
    reason: נֶפֶשׁ possède une gamme de sens comprenant l’être, la vie et l’âme.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Si
  rationale: La tournure ouvre la condition qui se prolonge au verset suivant. En français naturel, « Si » en exprime clairement la fonction sans conserver artificiellement « il arrivera que ».
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: vous écoutez vraiment
  rationale: L’infinitif absolu suivi du verbe conjugué renforce שׁמע. « Écoutez vraiment » conserve à la fois l’emphase et la nuance d’écoute, tout en laissant entendre l’obéissance qu’implique le contexte.
- source_word: אֶל מִצְוֺתַי
  choice: mes commandements
  rationale: « Commandements » convient au cadre de l’alliance et rend les obligations prescrites sans affaiblir leur portée.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ceux que je vous donne aujourd’hui
  rationale: Cette formulation française naturelle exprime l’acte présent de prescrire. « Donner » des commandements évite la lourdeur de « que je vous commande » tout en conservant le sens.
- source_word: לְאַהֲבָה
  choice: en aimant
  rationale: Le participe français relie naturellement l’amour et le service au contenu concret de l’écoute obéissante, sans trancher excessivement entre but et explicitation.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Le nom divin est translittéré, et אֱלֹהֵיכֶם est rendu par la désignation relationnelle et alliancielle « votre Dieu ».
- source_word: וּלְעָבְדוֹ
  choice: et en le servant
  rationale: « Servir » garde l’étendue de עבד, qui englobe ici le culte, la fidélité et l’obéissance, sans le réduire au seul acte cultuel.
- source_word: בְּכָל לְבַבְכֶם
  choice: de tout votre cœur
  rationale: Cette expression française établie rend le cœur comme centre de la pensée, de la volonté et des affections.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: et de tout votre être
  rationale: נפש désigne ici la personne vivante dans sa totalité. « Être » communique ce sens plus directement au lecteur moderne que « âme », qui pourrait suggérer seulement une composante immatérielle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin. « Yahweh » le représente directement, tandis que le rendu traditionnel par un titre est signalé en note.
- issue: Portée de שָׁמֹעַ תִּשְׁמְעוּ
  choice: vous écoutez vraiment
  alternative: vous obéissez fidèlement
  rationale: L’hébreu associe écoute attentive et réponse obéissante. Le texte principal préserve l’image auditive et l’intensification; la note explicite la nuance d’obéissance.
- issue: Sens anthropologique de נֶפֶשׁ
  choice: tout votre être
  alternative: toute votre âme
  rationale: Le terme peut désigner la vie, la personne ou l’être entier. « Être » évite d’imposer une conception strictement dualiste, tandis que le rendu traditionnel reste indiqué en note.
- issue: Rapport syntaxique de לְאַהֲבָה וּלְעָבְדוֹ
  choice: en aimant… et en le servant
  alternative: pour aimer… et pour le servir
  rationale: Les infinitifs peuvent exprimer le but ou préciser la réponse commandée. « En aimant… et en servant » maintient un lien ouvert avec l’écoute obéissante sans supprimer cette tension syntaxique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte par une virgule, puisque la proposition conditionnelle se poursuit au verset 14. Le vouvoiement pluriel reflète les formes hébraïques adressées collectivement à Israël.
