  naturalness: « Écoutez attentivement » est plus idiomatique et plus précis que « écoutez vraiment » pour l’intensif hébreu. La coordination « pour aimer … et pour le servir » rend plus clairement les infinitifs à lamed, sans transformer leur relation avec l’écoute en une simple circonstance de manière.
