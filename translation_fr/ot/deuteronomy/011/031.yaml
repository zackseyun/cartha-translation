source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: fr
  text: Car vous allez traverser le Jourdain pour entrer dans le pays que Yahweh, votre Dieu, vous donne et en prendre possession ; vous en prendrez possession et vous y habiterez[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; souvent rendu traditionnellement par « le SEIGNEUR ».'
    reason: Signale la forme hébraïque du nom divin et un rendu traditionnel, sans laisser entendre qu’il s’agit du seul usage français.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui soutient l’exhortation précédente et conserve naturellement le lien logique.
- source_word: עֹבְרִים
  choice: vous allez traverser
  rationale: Le participe décrit ici une action imminente; cette formulation idiomatique en français en exprime clairement la proximité.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme française usuelle du nom propre; il n’est pas nécessaire d’ajouter « fleuve ».
- source_word: לָבֹא
  choice: pour entrer
  rationale: L’infinitif exprime l’entrée dans le pays après la traversée; « entrer » est naturel et précis.
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם אֹתָהּ
  choice: en prendre possession / Vous en prendrez possession
  rationale: ירשׁ désigne ici l’acquisition et la possession du pays. La répétition préserve celle de l’hébreu sans introduire la nuance plus particulière d’un héritage.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire où Israël va entrer; « pays » est le terme français le plus naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement la construction avec le suffixe de deuxième personne du pluriel.
- source_word: נֹתֵן לָכֶם
  choice: vous donne
  rationale: Le présent français conserve la valeur actuelle et certaine du participe hébreu.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: vous y habiterez
  rationale: ישׁב signifie ici habiter le pays; le futur convient à la séquence et « habiter » garde un registre moderne et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le conserve, tandis que « le SEIGNEUR » est une substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été légèrement restructurée par reprise de « ce pays » afin d’éviter l’enchaînement lourd « le pays que… » après un pronom, tout en conservant la répétition de ירשׁ et la progression du texte hébreu.
