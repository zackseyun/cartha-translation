  revision_rationale: La révision replace la relative « que Yahweh, votre Dieu, vous donne » immédiatement après « le pays », tout en conservant les deux occurrences de « prendre possession » et la séquence future du texte source. Le point-virgule rend lisible la transition vers les deux verbes consécutifs sans changer le sens. La note est nuancée pour refléter l’usage français.
