revisions:
- from: Car vous allez traverser le Jourdain pour entrer dans le pays et en prendre possession, ce pays que Yahweh votre Dieu vous donne[a]. Vous en prendrez possession et vous y habiterez.
  to: Car vous allez traverser le Jourdain pour entrer dans le pays que Yahweh, votre Dieu, vous donne et en prendre possession ; vous en prendrez possession et vous y habiterez[a].
  rationale: La révision replace la relative « que Yahweh, votre Dieu, vous donne » immédiatement après « le pays », tout en conservant les deux occurrences de « prendre possession » et la séquence future du texte source. Le point-virgule rend lisible la transition vers les deux verbes consécutifs sans changer le sens. La note est nuancée pour refléter l’usage français.
