source:
  edition: WLC
  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: fr
  text: Car ce sont vos propres yeux qui ont vu toute la grande œuvre que Yahweh a accomplie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vos yeux, ceux qui voient » ; tournure emphatique qui présente les destinataires comme des témoins oculaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui fonde l’exhortation précédente et conserve naturellement la valeur causale du texte hébreu.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: ce sont vos propres yeux qui ont vu
  rationale: Cette tournure française souligne le témoignage oculaire tout en reflétant la construction hébraïque emphatique, littéralement « vos yeux, ceux qui voient ».
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: toute l’œuvre
  rationale: Le singulier collectif מַעֲשֵׂה avec כָּל présente comme un tout l’ensemble de ce que Yahweh a fait.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte plutôt que de lui substituer un titre.
- source_word: הַגָּדֹל
  choice: grande
  rationale: Rend directement l’adjectif qui qualifie l’œuvre et en souligne l’ampleur.
- source_word: אֲשֶׁר עָשָׂה
  choice: que Yahweh a accomplie
  rationale: Le passé composé convient au parfait hébreu dans ce rappel d’événements observés; la répétition du nom évite en français une ambiguïté de référent, et « accomplir une œuvre » est plus naturel que « faire une œuvre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La construction clivée « ce sont vos propres yeux » conserve l’accent emphatique de l’hébreu sans reproduire maladroitement son participe.
