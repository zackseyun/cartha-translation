base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: fr
  text: 'Puis les officiers parleront au peuple et diront : « Quel homme a bâti une maison neuve et ne l’a pas encore inaugurée[a] ? Qu’il parte et retourne chez lui, de peur qu’il ne meure au combat et qu’un autre homme ne l’inaugure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faire la dédicace ». Le verbe hébreu désigne le commencement officiel de l’usage de la maison, souvent dans un contexte de dédicace.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: les officiers
  rationale: Dans ce contexte militaire et administratif, le terme désigne des responsables officiellement chargés de transmettre et d’appliquer les consignes; « officiers » convient au cadre sans les réduire à des scribes.
- source_word: הָעָם
  choice: le peuple
  rationale: Cette traduction conserve le sens ordinaire de l’hébreu, même si le contexte vise ici les hommes rassemblés pour combattre.
- source_word: מִי הָאִישׁ
  choice: Quel homme
  rationale: La formulation garde le singulier masculin explicite, approprié puisque le passage concerne les hommes mobilisables.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: a bâti une maison neuve
  rationale: « Bâtir » et « maison » correspondent directement aux termes hébreux; « neuve » est idiomatique en français pour une construction récente.
- source_word: וְלֹא חֲנָכוֹ
  choice: sans encore l’inaugurer
  rationale: Le verbe חנך désigne ici l’entrée officielle dans l’usage d’une maison, avec une possible nuance de dédicace. « Inaugurer » rend naturellement ce sens en français sans préciser indûment un rite.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Qu’il parte et retourne chez lui
  rationale: Les imparfaits ont ici une valeur directive. Cette formulation française en exprime clairement la force tout en conservant les deux verbes.
- source_word: פֶּן
  choice: de peur que
  rationale: Cette locution rend la valeur préventive de la conjonction hébraïque et s’intègre naturellement à la phrase.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: il ne meure au combat
  rationale: « Au combat » exprime avec naturel la situation militaire concrète visée par l’expression hébraïque définie.
- source_word: וְאִישׁ אַחֵר
  choice: un autre homme
  rationale: Cette traduction conserve le singulier masculin explicite du texte source.
- source_word: יַחְנְכֶנּוּ
  choice: ne l’inaugure
  rationale: La reprise d’« inaugurer » préserve la répétition du même verbe hébreu dans les deux parties du verset.
