revisions:
- from: Lorsque tu assiégeras une ville pendant de nombreux jours, en combattant contre elle pour t’en emparer, tu ne détruiras pas ses arbres en portant la hache contre eux, car tu peux manger de leurs fruits ; tu ne les couperas pas. En effet, l’arbre des champs est-il un homme pour se trouver devant toi lors du siège ?[a]
  to: Lorsque tu assiégeras une ville pendant de nombreux jours, en combattant contre elle pour t’en emparer, tu ne détruiras pas ses arbres en les attaquant à la hache, car tu peux en manger ; tu ne les abattras pas. En effet, l’arbre des champs est-il un homme pour venir devant toi lors du siège ?[a]
  rationale: La révision améliore la précision de l’action d’abattre les arbres et l’idiomaticité française, tout en conservant la question rhétorique adoptée dans la piste d’audit anglaise. La note reste ancrée à la clause finale disputée et préserve les principales lectures alternatives.
