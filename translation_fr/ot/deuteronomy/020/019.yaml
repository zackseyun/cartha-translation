base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: fr
  text: Lorsque tu assiégeras une ville pendant de nombreux jours, en combattant contre elle pour t’en emparer, tu ne détruiras pas ses arbres en les attaquant à la hache, car tu peux en manger ; tu ne les abattras pas. En effet, l’arbre des champs est-il un homme pour venir devant toi lors du siège ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car l’homme est l’arbre des champs », ou : « car l’arbre des champs sert de nourriture à l’homme ». La fin du verset est difficile en hébreu ; le texte principal la comprend comme une question rhétorique qui distingue l’arbre d’un ennemi humain.'
    reason: Lecture alternative d’une proposition hébraïque syntaxiquement ambiguë.
lexical_decisions:
- source_word: תָצוּר אֶל־עִיר
  choice: tu assiégeras une ville
  rationale: Le verbe צור désigne ici l’action militaire d’assiéger. Cette formulation est directe et naturelle en français.
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: Rend explicitement et sans paraphrase la durée prolongée exprimée en hébreu.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: en combattant contre elle pour t’en emparer
  rationale: Préserve à la fois l’action militaire et son but, la prise de la ville.
- source_word: לֹא תַשְׁחִית אֶת־עֵצָהּ
  choice: tu ne détruiras pas ses arbres
  rationale: Le hiphil de שׁחת exprime ici la destruction ou la dévastation ; « détruire » convient à la force de l’interdiction.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: en portant la hache contre eux
  rationale: Cette tournure française rend l’usage hostile de la hache tout en conservant l’image et la préposition de l’hébreu. Le pluriel reprend naturellement « arbres », bien que l’hébreu passe au singulier collectif.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: car tu peux manger de leurs fruits
  rationale: Le complément « fruits » est implicite dans le fait de manger d’un arbre et rend la phrase immédiatement intelligible en français ; « peux » exprime leur utilité alimentaire dans ce contexte.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: tu ne les couperas pas
  rationale: כרת est le verbe ordinaire pour couper ou abattre un arbre. Le pluriel est idiomatique après « ses arbres ».
- source_word: עֵץ הַשָּׂדֶה
  choice: l’arbre des champs
  rationale: Conserve la construction hébraïque et sa tonalité proverbiale sans la réduire explicitement à un arbre fruitier.
- source_word: הָאָדָם
  choice: un homme
  rationale: Dans la question rhétorique, אדם désigne un être humain opposé à l’arbre ; le singulier « un homme » maintient ce contraste.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: pour se trouver devant toi lors du siège
  rationale: Rendu volontairement proche d’une proposition hébraïque difficile. Il présente l’arbre comme n’étant pas un adversaire humain placé devant l’assiégeant, sans préciser davantage que le texte.
theological_decisions:
- issue: Interprétation de כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: 'Question rhétorique opposant l’arbre à un adversaire humain : « l’arbre des champs est-il un homme pour se trouver devant toi lors du siège ? »'
  alternative: 'Déclaration : « car l’homme est l’arbre des champs » ; ou explication alimentaire : « car l’arbre des champs sert de nourriture à l’homme »'
  rationale: La syntaxe hébraïque est difficile et permet plusieurs analyses. La question rhétorique s’accorde au contexte militaire et explique pourquoi l’arbre ne doit pas être traité comme un ennemi, mais les autres lectures demeurent assez plausibles pour être signalées.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le futur à valeur prescriptive convient à la formulation légale. La question finale reste délibérément proche de l’hébreu afin de ne pas effacer son ambiguïté ; la note présente les principales autres lectures.
