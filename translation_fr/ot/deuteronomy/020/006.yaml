  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: fr
  text: Et quel homme a planté une vigne sans en avoir encore profité ? Qu’il s’en aille et retourne chez lui[a], de peur qu’il ne meure au combat et qu’un autre homme n’en profite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement : « sans en avoir encore fait usage » ou « sans avoir encore commencé à en faire usage ». Le verbe hébreu désigne ici le premier usage ordinaire de la vigne, probablement après les premières années où sa production était soumise à des restrictions (voir Lévitique 19.23-25).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Et quel homme
  rationale: Conserve la formule interrogative qui introduit un cas d’exemption et maintient le masculin, puisqu’il s’agit ici des hommes appelés au combat.
- source_word: נָטַע כֶּרֶם
  choice: a planté une vigne
  rationale: Rend directement l’action accomplie dont les effets demeurent présents.
- source_word: וְלֹא חִלְּלוֹ
  choice: sans encore en avoir goûté les fruits
  rationale: Dans ce contexte, le verbe חלל désigne le fait de commencer à tirer un usage ordinaire de la vigne, vraisemblablement en consommant sa production après les années de restriction. Cette formulation française exprime naturellement ce bénéfice concret sans donner au verbe un sens de profanation.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Qu’il parte et retourne chez lui
  rationale: Le yiqtol a ici une valeur directive; le subjonctif injonctif convient au contexte légal et reste naturel en français.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: de peur qu’il ne meure au combat
  rationale: « De peur que » rend la valeur préventive de פן; le ne explétif appartient au français soutenu naturel et ne constitue pas une négation.
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: et qu’un autre homme n’en goûte les fruits
  rationale: Maintient l’homme explicitement mentionné et rend le second emploi de חלל de manière cohérente avec le premier.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « goûter les fruits » explicite l’usage concret de la vigne tout en signalant en note le sens plus formel du verbe hébreu. Le masculin est conservé en raison du contexte militaire précis.
