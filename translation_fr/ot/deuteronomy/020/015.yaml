  text: כֵּ֤ן תַּעֲשֶׂה֙ לְ/כָל הֶ֣/עָרִ֔ים הָ/רְחֹקֹ֥ת מִמְּ/ךָ֖ מְאֹ֑ד אֲשֶׁ֛ר לֹא מֵ/עָרֵ֥י הַ/גּֽוֹיִם הָ/אֵ֖לֶּה הֵֽנָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: fr
  text: Tu agiras de cette manière envers toutes les villes qui sont très éloignées de toi et qui ne font pas partie des villes de ces nations-ci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: de cette manière
  rationale: Renvoie à la manière d’agir décrite dans le contexte précédent; cette formulation est naturelle en français tout en conservant la valeur anaphorique de l’hébreu.
- source_word: תַּעֲשֶׂה
  choice: tu agiras
  rationale: L’imparfait hébreu à valeur injonctive exprime ici une prescription. Le futur français garde le ton juridique sans lourdeur.
- source_word: לְכָל הֶעָרִים
  choice: envers toutes les villes
  rationale: La préposition ל marque ici les villes visées par l’action; «envers» donne une formulation française claire et idiomatique.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: qui sont très éloignées de toi
  rationale: Rend l’idée spatiale de רחק, la comparaison introduite par מן et l’intensité de מְאֹד.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: qui ne font pas partie des villes de
  rationale: Explicite naturellement en français la valeur partitive de מן sans modifier la distinction juridique du texte.
- source_word: הַגּוֹיִם הָאֵלֶּה הֵנָּה
  choice: ces nations-ci
  rationale: «Nations» convient au cadre géopolitique; «-ci» restitue la force démonstrative renforcée de הָאֵלֶּה הֵנָּה.
theological_decisions:
- issue: Distinction entre les villes éloignées et celles des nations visées dans le contexte immédiat
  choice: Présenter sans atténuation la règle comme applicable aux villes éloignées qui n’appartiennent pas aux nations désignées.
  alternative: Développer dans ce verset les modalités du siège énoncées auparavant, ou généraliser la phrase à toutes les villes étrangères.
  rationale: Le verset délimite la portée des prescriptions précédentes. La traduction conserve cette fonction sans ajouter d’explication interprétative ni atténuer la dimension militaire et juridique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure «de cette manière» établit clairement le lien avec le contexte précédent; «ces nations-ci» conserve l’insistance démonstrative de l’hébreu.
