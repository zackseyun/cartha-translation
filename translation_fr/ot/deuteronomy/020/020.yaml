  naturalness: Le français révisé demeure moderne, clair et d’un registre approprié à une instruction légale. « Ouvrages de siège » est naturel et suffisamment large; « jusqu’à ce qu’elle tombe » est idiomatique.
  terminology: « Arbres ... ne servent pas à la nourriture », « abattre », « ouvrages de siège » et « faire la guerre » rendent correctement les termes et le contexte sans surinterpréter מָצוֹר ni רדתה. Les ancres de notes sont placées sur les expressions qu’elles éclairent.
