base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: fr
  text: Seuls les arbres dont tu sais qu’ils ne servent pas à la nourriture, tu pourras les détruire et les abattre, et construire des ouvrages de siège[a] contre la ville qui te fait la guerre, jusqu’à ce qu’elle tombe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une rampe de siège ». Le terme hébreu מָצוֹר peut désigner de manière générale des fortifications ou des ouvrages de siège plutôt qu’un ouvrage précis.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « jusqu’à sa descente ». Ou « jusqu’à sa chute ». Cette expression évoque la défaite de la ville sans préciser explicitement l’agent de sa chute.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Seuls
  rationale: Rend la restriction qui introduit l’exception à l’interdiction précédente, dans une formulation française concise.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: les arbres ... [qui] servent ... à la nourriture
  rationale: עֵץ désigne ici des arbres vivants, et עֵץ מַאֲכָל les arbres qui fournissent de la nourriture. Cette formulation évite de suggérer que le bois lui-même est comestible.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: dont tu sais qu’ils ne servent pas
  rationale: Conserve l’idée que leur caractère non alimentaire est connu ou établi, tout en suivant l’accord collectif naturel en français.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: tu pourras les détruire et les abattre
  rationale: Le singulier hébreu est distributif. « Pourras » exprime ici l’autorisation légale, tandis qu’« abattre » est le verbe précis et courant pour couper un arbre.
- source_word: וּבָנִיתָ מָצוֹר
  choice: afin de construire des ouvrages de siège
  rationale: מָצוֹר peut désigner divers aménagements ou fortifications de siège. Le lien final rend naturellement l’emploi des arbres abattus dans le contexte, sans limiter le terme à une seule sorte de structure.
- source_word: עַל הָעִיר
  choice: contre la ville
  rationale: Dans ce contexte militaire, « contre » exprime la destination hostile des ouvrages de siège.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: qui te fait la guerre
  rationale: Rend directement et naturellement l’expression hébraïque et son aspect continu.
- source_word: עַד רִדְתָּהּ
  choice: jusqu’à ce que tu l’aies fait tomber
  rationale: Préserve la tournure active adressée à la deuxième personne ainsi que l’image de la descente ou de la chute de la ville.
