  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: fr
  text: Mais si elle ne fait pas la paix avec toi et te fait la guerre, tu l’assiégeras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Mais si… ne… pas
  rationale: La conjonction introduit l’issue opposée à l’offre de paix du verset précédent; « Mais si » exprime naturellement ce contraste.
- source_word: תַשְׁלִים עִמָּךְ
  choice: elle ne fait pas la paix avec toi
  rationale: Le hiphil de שׁלם désigne ici l’établissement de relations pacifiques ou la conclusion de la paix. « Faire la paix avec » est clair, courant et proche de l’expression hébraïque.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: et te fait la guerre
  rationale: L’expression עשה מלחמה signifie « faire/mener la guerre ». En français, « faire la guerre à quelqu’un » rend naturellement l’idiome et עִם dans son sens hostile contextuel.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: tu l’assiégeras
  rationale: Le verbe צור signifie ici assiéger une ville. Le futur français convient à la suite d’instructions formulée dans ce contexte juridique, et le pronom féminin reprend la ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le pronom féminin « elle » reprend la ville mentionnée dans le contexte. Aucun ajout explicatif n’est nécessaire dans ce verset.
