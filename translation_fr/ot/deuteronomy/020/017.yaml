  text: כִּֽי הַחֲרֵ֣ם תַּחֲרִימֵ֗/ם הַ/חִתִּ֤י וְ/הָ/אֱמֹרִי֙ הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: fr
  text: 'Au contraire, tu les voueras entièrement à la destruction[a] : les Hittites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites, comme Yahweh, ton Dieu, te l’a ordonné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu les voueras sans réserve à l’interdit ». Le verbe hébreu désigne ici le fait de les livrer entièrement à la destruction.'
    reason: Préciser la portée particulière et l’intensité de la construction hébraïque חרם.
lexical_decisions:
- source_word: כִּי
  choice: Au contraire
  rationale: Dans le contexte, la conjonction oppose le sort de ces peuples à celui des villes lointaines mentionnées au verset précédent. « Au contraire » exprime naturellement cette valeur adversative en français.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: tu les voueras entièrement à la destruction
  rationale: L’infinitif absolu associé au verbe conjugué renforce le commandement. Le verbe חרם désigne ici la mise totale à l’interdit, impliquant la destruction; cette formulation conserve à la fois l’idée de consécration irrévocable et celle de destruction complète.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: les Hittites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites
  rationale: Les gentilés hébreux au singulier collectif sont rendus par les noms usuels de ces peuples au pluriel en français.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: comme … te l’a ordonné
  rationale: « Comme » rend simplement la relation indiquée par כַּאֲשֶׁר; le passé composé exprime un ordre antérieur qui demeure applicable. Le pronom singulier respecte l’adresse hébraïque.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, et le possessif singulier correspond exactement à l’hébreu.
theological_decisions:
- issue: Sens de חרם dans un commandement de guerre
  choice: voueras entièrement à la destruction
  alternative: extermineras complètement; frapperas d’interdit
  rationale: Le terme ne décrit pas seulement l’acte de tuer, mais la mise totale et irrévocable à l’interdit sous commandement divin. La traduction retenue préserve cette dimension tout en explicitant son issue destructrice, sans atténuer la violence du texte.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération maintient le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement singulier (« tu », « ton », « te ») reproduit l’adresse grammaticale de l’hébreu. Les deux-points introduisent clairement la liste des peuples visés.
