  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: fr
  text: Quand les officiers auront fini de parler au peuple, on placera[a] des chefs d’armées à la tête du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « on désignera des chefs d’armées à la tête du peuple » ou « on rassemblera/recensera les chefs d’armées ». Le verbe hébreu peut, selon le contexte, signifier établir, désigner, recenser ou mettre à la tête.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: Quand ... auront fini
  rationale: La formule וְהָיָה suivie de כְּ et de l’infinitif construit introduit ici une proposition temporelle. Le futur antérieur exprime naturellement en français l’achèvement préalable de la prise de parole.
- source_word: הַשֹּׁטְרִים
  choice: les officiers
  rationale: Dans le Deutéronome, le terme désigne des responsables administratifs chargés notamment de parler au peuple et de l’organiser; « officiers » convient au contexte civico-militaire sans les réduire à des scribes.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: parler au peuple
  rationale: Traduction directe qui conserve עָם, « peuple », sans le préciser indûment par « troupes ».
- source_word: וּפָקְדוּ
  choice: on placera
  rationale: פקד possède ici un éventail de sens comprenant établir, désigner, passer en revue ou mettre à la tête. « Placer » s’accorde avec בְּרֹאשׁ et maintient une part de cette amplitude lexicale; le sujet implicite de la forme plurielle n’étant pas explicitement nommé, le français « on » évite de l’identifier automatiquement aux officiers.
- source_word: שָׂרֵי צְבָאוֹת
  choice: des chefs d’armée
  rationale: שָׂרֵי désigne des chefs ou commandants et צְבָאוֹת des forces organisées pour la guerre. « Chefs d’armée » est clair, actuel et naturel en français.
- source_word: בְּרֹאשׁ הָעָם
  choice: à la tête du peuple
  rationale: Cette formulation conserve l’image hébraïque de la tête tout en exprimant naturellement une position de direction.
