translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure hébraïque, mais emploie un futur antérieur idiomatique. Le pronom indéfini « on » préserve l’absence de sujet explicitement nommé pour וּפָקְדוּ.
