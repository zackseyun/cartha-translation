  source_fidelity: 'Le texte rend fidèlement la séquence hébraïque : Yahweh est le sujet de la remise de la ville, « la » renvoie correctement à la ville (suffixe féminin singulier), et le commandement vise explicitement « tous ses mâles ». « Au fil de l’épée » exprime de façon établie l’idiome לְפִי חָרֶב sans en diminuer la portée létale.'
  naturalness: Le français est clair, moderne et d’un registre biblique sobre. « La livrera entre tes mains » est une tournure française usuelle pour la remise au pouvoir de quelqu’un ; le pluriel de « mains » relève de l’idiome français et ne crée pas d’ambiguïté. « Tu abattras » et « au fil de l’épée » sont naturels dans ce contexte militaire.
  terminology: '« Yahweh » respecte la politique de translittération du nom divin. « Ton Dieu » rend exactement la relation exprimée par le suffixe de deuxième personne singulier. Le choix de « mâles », bien que volontairement marqué en français, est justifié : il conserve la spécification sexuelle du terme hébreu plutôt que de la neutraliser par « hommes ». La note est exacte et utile.'
