source:
  edition: WLC
  text: וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וְ/הִכִּיתָ֥ אֶת כָּל זְכוּרָ֖/הּ לְ/פִי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: fr
  text: Yahweh, ton Dieu, la livrera entre tes mains, et tu abattras tous ses mâles[a] au fil de l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit précisément « ses mâles » : il désigne les individus de sexe masculin, plutôt que d’employer un terme plus général comme « hommes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: la livrera
  rationale: Le verbe נתן avec suffixe objet féminin singulier renvoie à la ville. « Livrer entre les mains » exprime naturellement la remise au pouvoir de quelqu’un, tout en conservant l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne masculine singulière est rendu directement dans la formule d’alliance.
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Cette expression française naturelle conserve l’image de la main et signifie que la ville est remise au pouvoir du destinataire.
- source_word: וְהִכִּיתָ
  choice: tu abattras
  rationale: Dans ce contexte militaire, le hifil de נכה désigne une action létale. « Abattre » en garde la force sans ajouter d’explication.
- source_word: כָּל
  choice: tous
  rationale: Le terme est maintenu afin de préserver la portée totale du commandement.
- source_word: זְכוּרָהּ
  choice: tous ses mâles
  rationale: Le nom désigne explicitement les individus de sexe masculin, avec un suffixe féminin singulier renvoyant à la ville. « Mâles » est plus précis que « hommes ».
- source_word: לְפִי חָרֶב
  choice: au fil de l’épée
  rationale: Équivalent français traditionnel et intelligible de l’expression hébraïque littérale « à la bouche de l’épée », il en conserve l’image tranchante.
theological_decisions:
- issue: Rendre sans atténuation ni amplification un commandement de guerre attribué à Dieu
  choice: Présenter directement la remise de la ville par Yahweh et l’ordre létal visant tous ses mâles.
  alternative: Employer un euphémisme comme « vaincre », omettre la référence aux mâles, ou ajouter une explication sur le jugement divin ou la guerre sainte.
  rationale: L’hébreu attribue explicitement à Yahweh la remise de la ville et ordonne une action létale contre tous ses mâles. La traduction en conserve la gravité sans l’adoucir ni lui ajouter une interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur maintient la succession énoncée par les verbes hébreux; « au fil de l’épée » conserve l’image sémitique sous une forme française établie.
