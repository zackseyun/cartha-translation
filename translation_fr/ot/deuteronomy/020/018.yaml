source:
  edition: WLC
  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: fr
  text: afin qu’ils ne vous apprennent pas à commettre toutes les abominations qu’ils ont commises pour leurs dieux[a], et vous pécheriez contre Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à leurs dieux » ou « en l’honneur de leurs dieux ».'
    reason: La préposition hébraïque ל peut exprimer la destination, l’orientation ou le bénéficiaire d’un acte cultuel.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: afin que
  rationale: Introduit le but préventif de la prescription; « afin que » exprime clairement cette valeur en français courant et soutenu.
- source_word: לֹא יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: ils ne vous apprennent pas à pratiquer
  rationale: Le piel de למד signifie « apprendre, enseigner » et l’infinitif עשה désigne ici l’accomplissement de pratiques cultuelles; « pratiquer » est plus naturel que « faire selon » en français.
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: toutes les abominations
  rationale: תועבה est un terme moral et religieux fort. La tournure française évite le calque pesant « selon toutes » tout en conservant l’idée d’imiter l’ensemble de ces pratiques.
- source_word: אֲשֶׁר עָשׂוּ
  choice: qu’ils commettent
  rationale: Avec « abominations », « commettre » est idiomatique en français. Le présent exprime ces pratiques caractéristiques sans imposer une distance temporelle absente du propos.
- source_word: לֵאלֹהֵיהֶם
  choice: pour leurs dieux
  rationale: La préposition ל marque ici l’orientation ou la destination cultuelle des actes. « Pour » reste proche de l’hébreu; « en l’honneur de » est explicité en note comme autre possibilité.
- source_word: וַחֲטָאתֶם
  choice: ce qui vous ferait pécher
  rationale: Le waw suivi du qatal présente la conséquence redoutée. Cette formulation française rend le résultat sans transformer artificiellement la proposition en second but négatif.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: contre Yahweh, votre Dieu
  rationale: Avec חטא, ל désigne la personne offensée et se rend naturellement par « contre ». Le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Relation entre l’imitation des pratiques et le péché
  choice: ce qui vous ferait pécher
  alternative: et vous pécheriez
  rationale: La proposition finale décrit la conséquence redoutée de l’enseignement reçu. Le conditionnel français préserve cette relation logique sans suggérer que Dieu voudrait leur péché.
translation_notes:
  register: Français international moderne, digne et accessible. « Abominations » maintient la force religieuse et morale du terme hébreu, tandis que « pratiquer » et « ce qui vous ferait pécher » évitent des calques peu naturels.
