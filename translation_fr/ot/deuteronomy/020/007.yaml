  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: fr
  text: Et quel est l’homme qui s’est fiancé[a] à une femme et ne l’a pas encore épousée[b] ? Qu’il parte et retourne chez lui, de peur qu’il ne meure au combat et qu’un autre homme ne l’épouse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « a pris une femme en fiançailles ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne l’a pas prise ». Il s’agit ici d’achever le mariage en la prenant pour épouse.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « ne la prenne pour femme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Et quel est l’homme
  rationale: Conserve la coordination avec les catégories précédentes et la forme masculine singulière propre au contexte militaire, tout en formulant naturellement la question en français.
- source_word: אֵרַשׂ אִשָּׁה
  choice: s’est fiancé à une femme
  rationale: אֵרַשׂ désigne l’engagement matrimonial formel qui précède l’entrée effective dans le mariage. « S’est fiancé à » est actuel et compréhensible, tandis que « une femme » maintient la distinction avec l’épouse déjà prise en mariage.
- source_word: וְלֹא לְקָחָהּ
  choice: et ne l’a pas encore épousée
  rationale: Avec une femme pour complément, לקח a ici le sens matrimonial de la prendre pour épouse. « Épousée » rend ce sens sans reproduire une tournure française potentiellement équivoque; « encore » explicite la valeur temporelle impliquée par la succession fiançailles-mariage.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Qu’il parte et retourne chez lui
  rationale: Le subjonctif à valeur injonctive rend la directive du contexte. « Chez lui » est l’équivalent français naturel de « à sa maison ».
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: de peur qu’il ne meure au combat
  rationale: « De peur que » restitue l’avertissement négatif introduit par פֶּן. « Au combat » convient à la campagne militaire immédiate et reste idiomatique.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: et qu’un autre homme ne l’épouse
  rationale: Le second emploi de לקח garde le même sens matrimonial. « Épouse » le rend clairement, tandis qu’une note signale la formulation plus proche de l’image hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La traduction privilégie la clarté du sens matrimonial de לקח, tout en conservant dans les notes l’expression plus formelle ou plus littérale. La répétition du même verbe hébreu dans les deux propositions est reflétée par la répétition d’« épouser ».
