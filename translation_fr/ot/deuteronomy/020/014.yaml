  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: fr
  text: Seulement, les femmes, les petits enfants, le bétail et tout ce qui se trouve dans la ville — tout son butin —, tu pourras les prendre pour toi comme butin. Tu mangeras[a] le butin de tes ennemis, que Yahweh ton Dieu t’a donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « manger ». Appliqué au butin, le verbe peut aussi évoquer le fait d’utiliser ou de jouir des biens pris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Mais
  rationale: Après l’ordre du verset précédent, la particule introduit ici une exception; « Mais » rend naturellement cette opposition en français.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Le nom pluriel désigne explicitement les femmes.
- source_word: הַטַּף
  choice: les petits enfants
  rationale: Le terme vise couramment les jeunes enfants ou les personnes à charge; « petits enfants » conserve ici l’accent sur leur jeune âge.
- source_word: הַבְּהֵמָה
  choice: le bétail
  rationale: Dans le contexte du butin de guerre, il s’agit des animaux domestiques considérés comme biens.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: et tout ce qui se trouvera dans la ville
  rationale: Cette formulation garde la portée exhaustive et la valeur prospective du verbe.
- source_word: כָּל שְׁלָלָהּ
  choice: tout son butin
  rationale: שָׁלָל désigne les biens pris à la guerre; « butin » est le terme français courant et précis.
- source_word: תָּבֹז לָךְ
  choice: tu pourras les prendre comme butin pour toi
  rationale: Le verbe signifie piller ou prendre comme butin. Le futur à valeur permissive rend l’autorisation donnée dans cette instruction juridique.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: Tu pourras profiter du butin de tes ennemis
  rationale: אָכַל signifie littéralement « manger », mais peut exprimer ici l’usage ou la jouissance des biens saisis. « Profiter de » communique ce sens idiomatique sans limiter le butin à des denrées.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La forme conserve le nom divin représenté par le tétragramme.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement la formule d’alliance avec le suffixe de deuxième personne du singulier.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: que Yahweh ton Dieu t’aura donné
  rationale: Le futur antérieur situe le don divin comme accompli au moment où Israël disposera du butin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur des verbes à la deuxième personne dans l’instruction juridique
  choice: tu pourras
  alternative: tu prendras / tu mangeras
  rationale: Dans ce contexte, les formes verbales autorisent la prise et l’usage du butin plutôt qu’elles n’imposent nécessairement ces actes.
- issue: Sens figuré possible de אָכַל appliqué au butin
  choice: profiter du butin
  alternative: manger le butin
  rationale: Le sens littéral reste « manger », mais l’objet collectif « butin » permet une extension à l’usage ou à la consommation des biens; la note conserve cette tension lexicale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël envisagé collectivement. La répétition de « butin » est maintenue pour refléter celle du texte source.
