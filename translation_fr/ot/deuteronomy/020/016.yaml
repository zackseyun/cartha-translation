reference: Deuteronomy 20:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: fr
  text: Mais dans les villes de ces peuples que Yahweh ton Dieu te donne en héritage, tu ne laisseras en vie aucun être qui respire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout souffle » ou « tout être qui respire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Mais
  rationale: Dans ce contexte, רַק introduit une exception contrastant avec les règles précédentes concernant les villes éloignées ; « Mais » exprime naturellement ce contraste.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: dans les villes de ces peuples
  rationale: Le français idiomatique emploie ici « dans » pour désigner les villes au sein desquelles l'ordre s'applique. « Peuples » rend עַמִּים sans évoquer les États-nations modernes.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה
  choice: que Yahweh ton Dieu te donne en héritage
  rationale: Le présent « donne » convient à la valeur actuelle du participe נֹתֵן, tandis que « en héritage » conserve la portée foncière et covenantale de נַחֲלָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֹא תְחַיֶּה
  choice: tu ne laisseras en vie
  rationale: 'Cette formulation française rend directement la valeur causative du piel de חיה : ne pas laisser vivre ou maintenir en vie.'
- source_word: כָּל נְשָׁמָה
  choice: aucun être qui respire
  rationale: La tournure conserve l'image concrète du souffle portée par נְשָׁמָה, tout en étant naturelle et intelligible en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin ; « Yahweh » le préserve sans le remplacer par un titre.
- issue: Terminologie de נַחֲלָה pour le don du pays
  choice: en héritage
  alternative: comme possession
  rationale: « Héritage » conserve la portée théologique et foncière du don sans réduire celui-ci à une simple possession.
- issue: Étendue de כָּל נְשָׁמָה
  choice: aucun être qui respire
  alternative: personne / aucun être vivant
  rationale: Le choix maintient l'expression concrète et l'étendue potentiellement large de l'hébreu, sans la limiter silencieusement aux seuls humains ni l'élargir par une paraphrase.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier reflète les formes hébraïques adressées à Israël collectivement. La formulation évite aussi bien l'euphémisme que l'explicitation au-delà du texte.
