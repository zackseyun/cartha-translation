  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם הַ/הֹלֵ֖ךְ עִמָּ/כֶ֑ם לְ/הִלָּחֵ֥ם לָ/כֶ֛ם עִם אֹיְבֵי/כֶ֖ם לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: fr
  text: Car Yahweh, votre Dieu, est celui qui va avec vous pour combattre pour vous contre vos ennemis et vous sauver.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous délivrer » ou « vous donner la victoire ». Le verbe hébreu peut désigner le salut ou la délivrance ; ici, il est employé dans un contexte de combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et conserve naturellement sa valeur explicative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend fidèlement la forme construite avec le suffixe de deuxième personne du pluriel.
- source_word: הַהֹלֵךְ
  choice: est celui qui marche
  rationale: Le participe décrit l’action caractéristique et continue de Yahweh; « marche » conserve aussi l’image hébraïque tout en restant naturel dans ce contexte.
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: Exprime directement l’accompagnement divin.
- source_word: לְהִלָּחֵם
  choice: pour combattre
  rationale: Rend l’infinitif de but de façon claire dans le contexte militaire.
- source_word: לָכֶם
  choice: pour vous
  rationale: 'Exprime le datif d’avantage: Yahweh combat en faveur d’Israël.'
- source_word: עִם אֹיְבֵיכֶם
  choice: contre vos ennemis
  rationale: Dans une construction liée au combat, עִם indique ici l’opposition; le français exige naturellement « contre ».
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: et vous sauver
  rationale: Conserve le sens large de salut et de délivrance du verbe ישׁע, sans le réduire à la seule victoire militaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom personnel divin; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Portée de לְהוֹשִׁיעַ dans le contexte militaire
  choice: vous sauver
  alternative: vous délivrer; vous donner la victoire
  rationale: « Sauver » maintient la portée générale et théologique du verbe, tandis que la note signale ses nuances militaires immédiates.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement pluriel rend l’adresse collective à Israël. La répétition « pour combattre pour vous » reflète les deux constructions hébraïques de but et d’avantage sans les confondre.
