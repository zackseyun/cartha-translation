  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: fr
  text: Quand tu t’approcheras d’une ville pour lui faire la guerre, tu lui proposeras la paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu appelleras la ville pour la paix » ; ou, plus idiomatiquement : « tu lui offriras la paix » ou « tu lui proposeras des conditions de paix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans cette instruction juridique, כִּי introduit la situation où la procédure doit être suivie. « Quand » convient mieux qu’un « si » hypothétique.
- source_word: תִקְרַב אֶל עִיר
  choice: tu t’approcheras d’une ville
  rationale: Le qal de קרב exprime le fait de s’approcher. Le futur français convient naturellement à une prescription introduite par « quand ».
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: pour lui faire la guerre
  rationale: L’expression rend clairement le sens militaire de לחם et la valeur hostile de עַל. Le pronom « lui » reprend naturellement « une ville » en français.
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: tu lui proposeras la paix
  rationale: Littéralement, la tournure évoque le fait de lancer un appel à la ville en vue de la paix. En français actuel, « proposer la paix » exprime naturellement cet appel sans préciser davantage que l’hébreu les modalités ou les conditions.
