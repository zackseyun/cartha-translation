  text: כִּֽי תֵצֵ֨א לַ/מִּלְחָמָ֜ה עַל אֹיְבֶ֗י/ךָ וְֽ/רָאִ֜יתָ ס֤וּס וָ/רֶ֨כֶב֙ עַ֚ם רַ֣ב מִמְּ/ךָ֔ לֹ֥א תִירָ֖א מֵ/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ הַ/מַּֽעַלְ/ךָ֖ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: fr
  text: Quand tu partiras au combat contre tes ennemis et que tu verras des chevaux et des chars[a], un peuple plus nombreux que toi[b], n’aie pas peur d’eux, car Yahweh, ton Dieu, est avec toi, lui qui t’a fait monter du pays d’Égypte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cheval et un char » ; les singuliers hébreux ont probablement ici un sens collectif et désignent les forces montées et les chars.
    reason: lexical_alternative
  - marker: b
    text: Ou « un peuple plus grand que toi ». Dans ce contexte, l’expression souligne probablement que l’ennemi est supérieur en nombre.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « qui te fait monter du pays d’Égypte ». Le participe hébreu présente l’exode comme l’acte caractéristique de Yahweh et comme le fondement de la confiance d’Israël.
    reason: source_clarification
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: Quand tu partiras au combat
  rationale: כִּי introduit ici une situation envisagée, et l’expression יצא למלחמה désigne le départ pour un engagement militaire. Le futur français convient au cadre législatif et « au combat » est naturel sans élargir nécessairement le sens à toute une guerre.
- source_word: עַל אֹיְבֶיךָ
  choice: contre tes ennemis
  rationale: Avec une action hostile, עַל se rend naturellement par « contre » ; le pluriel et le suffixe de deuxième personne du singulier sont conservés.
- source_word: וְרָאִיתָ
  choice: et que tu verras
  rationale: Dans cette séquence prospective, la forme poursuit la situation introduite par « quand » ; la coordination française exige naturellement la reprise de « que ».
- source_word: סוּס וָרֶכֶב
  choice: des chevaux et des chars
  rationale: Les singuliers hébreux ont vraisemblablement une valeur collective et désignent les moyens militaires de l’ennemi ; le pluriel français communique clairement ce sens.
- source_word: עַם רַב מִמְּךָ
  choice: un peuple plus nombreux que toi
  rationale: רַב suivi de la comparaison en מִן exprime ici vraisemblablement la supériorité numérique. « Peuple » préserve עַם sans le réduire à la seule armée.
- source_word: לֹא תִירָא מֵהֶם
  choice: n’aie pas peur d’eux
  rationale: L’imparfait hébreu a une valeur prohibitive. Cette formulation est actuelle, directe et fidèle, tandis que « ne les crains pas » serait plus soutenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: ton Dieu est avec toi
  rationale: La formulation rend directement la présence de Dieu exprimée par עִמָּךְ, sans ajouter « à tes côtés » ou « de ton côté ».
- source_word: הַמַּעַלְךָ
  choice: lui qui t’a fait monter
  rationale: Le participe substantivé identifie Yahweh comme celui qui a conduit Israël hors d’Égypte. « Fait monter » préserve l’image directionnelle du verbe עלה, que « fait sortir » effacerait.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: « Pays d’Égypte » est une formulation française naturelle et fidèle à אֶרֶץ מִצְרַיִם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre traditionnel.
- issue: Lien entre la présence divine et l’exode
  choice: « car Yahweh ton Dieu est avec toi, lui qui t’a fait monter… »
  alternative: « car Yahweh ton Dieu, qui t’a fait sortir…, est avec toi »
  rationale: 'L’apposition « lui qui » maintient la structure du texte : la confiance repose sur la présence actuelle de Yahweh, identifié comme celui qui a conduit Israël hors d’Égypte, sans déplacer la proposition relative ni effacer l’image de la montée.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques adressées collectivement à Israël. La syntaxe reste proche de l’hébreu tout en évitant une tournure artificielle ; « n’aie pas peur » privilégie la clarté courante, et « lui qui » conserve l’apposition théologique finale.
