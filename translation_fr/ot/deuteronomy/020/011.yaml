source:
  edition: WLC
  text: וְ/הָיָה֙ אִם שָׁל֣וֹם תַּֽעַנְ/ךָ֔ וּ/פָתְחָ֖ה לָ֑/ךְ וְ/הָיָ֞ה כָּל הָ/עָ֣ם הַ/נִּמְצָא בָ֗/הּ יִהְי֥וּ לְ/ךָ֛ לָ/מַ֖ס וַ/עֲבָדֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: fr
  text: Si elle te répond en paix[a] et s’ouvre à toi, tout le peuple qui s’y trouve sera astreint à la corvée pour toi[b] et te servira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te répond par des conditions de paix ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner un prélèvement, un tribut ou une corvée ; ici, le contexte favorise le travail forcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: en paix
  rationale: Le nom désigne la paix ou le bien-être. Dans ce contexte militaire, il qualifie la réponse favorable de la ville à l’offre de paix, tout en laissant visible le terme hébreu.
- source_word: תַּעַנְךָ
  choice: elle te répond
  rationale: Le verbe ענה signifie « répondre ». Le pronom féminin reprend la ville, grammaticalement féminine en hébreu comme en français.
- source_word: וּפָתְחָה לָךְ
  choice: s’ouvre à toi
  rationale: L’hébreu dit simplement « ouvrir » sans mentionner explicitement les portes. Cette formulation naturelle conserve cette absence de complément explicite.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: tout le peuple qui s’y trouve
  rationale: Cette formulation rend naturellement en français le participe « trouvé, présent » sans modifier son étendue collective.
- source_word: לָמַס
  choice: sera astreint à la corvée pour toi
  rationale: מַס peut désigner un prélèvement, un tribut ou une corvée. Avec la proposition suivante, « te servira », le contexte favorise ici une obligation de travail imposée.
- source_word: וַעֲבָדוּךָ
  choice: te servira
  rationale: עבד signifie « servir, travailler ». « Te servira » exprime directement la relation de sujétion sans préciser davantage l’institution en cause.
theological_decisions:
- issue: Langage de sujétion dans une loi de guerre
  choice: 'Conserver explicitement l’idée de travail imposé : « sera astreint à la corvée pour toi et te servira »'
  alternative: « te paiera un tribut et te servira »
  rationale: Le texte décrit sans l’atténuer le sort coercitif réservé à une ville qui accepte la paix, mais le terme hébreu ne doit pas non plus être chargé d’une institution plus précise que ce qu’il peut désigner.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la personnification de la ville et évite d’ajouter explicitement « ses portes », absent de l’hébreu.
