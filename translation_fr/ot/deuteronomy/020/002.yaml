  text: וְ/הָיָ֕ה כְּ/קָֽרָבְ/כֶ֖ם אֶל הַ/מִּלְחָמָ֑ה וְ/נִגַּ֥שׁ הַ/כֹּהֵ֖ן וְ/דִבֶּ֥ר אֶל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: fr
  text: Quand vous approcherez du combat[a], le prêtre s’avancera et parlera au peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la guerre ». Le mot hébreu מִלְחָמָה peut désigner la guerre en général ou un combat précis; ici, l’approche immédiate de l’affrontement favorise « combat ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « le peuple » désigne les Israélites rassemblés pour combattre, mais l’hébreu conserve le terme général « peuple » plutôt qu’un terme militaire plus précis comme « troupes ».
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: Quand vous approcherez
  rationale: La construction וְהָיָה suivie de l’infinitif temporel כְּקָרָבְכֶם introduit une circonstance future. Le futur français exprime naturellement ce sens sans reproduire littéralement « il arrivera ».
- source_word: אֶל הַמִּלְחָמָה
  choice: du combat
  rationale: מִלְחָמָה peut désigner la guerre en général ou un affrontement précis. Dans ce contexte d’approche immédiate, « combat » convient, tandis que la note conserve l’autre possibilité.
- source_word: וְנִגַּשׁ
  choice: s’avancera
  rationale: Le verbe נגשׁ signifie s’approcher. Ici, « s’avancera » rend naturellement le geste du prêtre qui vient devant l’assemblée pour lui parler.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le nom hébreu est défini et au singulier; aucune précision supplémentaire n’est nécessaire.
- source_word: וְדִבֶּר
  choice: et parlera
  rationale: Le piel de דבר signifie couramment « parler ». Le futur coordonné reproduit naturellement la succession des deux actions en français.
- source_word: אֶל הָעָם
  choice: au peuple
  rationale: הָעָם signifie littéralement « le peuple ». Même s’il s’agit ici des Israélites rassemblés pour combattre, le terme plus large du texte hébreu est conservé.
