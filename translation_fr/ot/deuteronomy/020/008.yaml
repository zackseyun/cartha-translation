  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: fr
  text: 'Puis les responsables continueront à parler au peuple et diront : « Quel homme a peur et manque de courage[a] ? Qu’il parte et retourne chez lui, de peur qu’il ne fasse fondre le cœur de ses frères[b] comme le sien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a peur et a le cœur tendre » ou « le cœur faible ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne les autres Israélites, en particulier ses compagnons d’armes.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: continueront
  rationale: 'Avec un infinitif, יסף exprime ici la poursuite d’une action : les responsables continuent ou reprennent leur discours.'
- source_word: הַשֹּׁטְרִים
  choice: les responsables
  rationale: Le terme désigne des agents chargés de fonctions administratives et militaires. « Responsables » évite le sens policier moderne et ne suppose pas nécessairement le grade militaire évoqué aujourd’hui par « officiers ».
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: a peur et manque de courage
  rationale: Cette formulation naturelle rend à la fois la peur et l’image hébraïque d’un cœur tendre ou faible, sans réduire les deux expressions à un seul trait.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Qu’il parte et retourne chez lui
  rationale: Les formes verbales ont ici une valeur directive. « Chez lui » exprime naturellement en français le retour à sa maison.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו
  choice: de peur qu’il ne fasse fondre le cœur de ses frères
  rationale: La traduction conserve la métaphore de la fonte du cœur, qui évoque la perte de courage, tout en rendant explicitement en français l’effet exercé sur les autres.
- source_word: כִּלְבָבוֹ
  choice: comme le sien
  rationale: Le pronom reprend « cœur » et maintient la comparaison concise entre le découragement de l’homme et celui qu’il pourrait communiquer aux autres.
theological_decisions:
- issue: Langage masculin dans le cadre militaire
  choice: Conserver « homme » et « frères » dans le texte principal
  alternative: « personne » et « compagnons d’armes »
  rationale: L’hébreu emploie un masculin singulier et un terme de parenté masculin pluriel. Leur maintien préserve la forme et la texture sociale du texte, tandis qu’une note précise la portée contextuelle de « frères ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la métaphore biblique du cœur qui fond, tout en évitant les tournures trop littérales ou archaïques.
