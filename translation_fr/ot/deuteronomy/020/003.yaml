  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: fr
  text: 'Il leur dira : « Écoute, Israël ! Aujourd’hui, vous vous approchez du combat contre vos ennemis. Que votre cœur ne faiblisse pas[a] ! N’ayez pas peur, ne cédez pas à la panique et ne soyez pas terrifiés devant eux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne perdez pas courage ». L’expression hébraïque évoque littéralement un cœur qui faiblit ou s’amollit, c’est-à-dire un effondrement du courage.
    reason: lexical_alternative
  - marker: b
    text: Les trois interdictions successives — avoir peur, céder à la panique et être terrifié — renforcent progressivement l’appel à ne pas redouter l’ennemi.
    reason: literary_clarification
lexical_decisions:
- source_word: וְאָמַר אֲלֵהֶם
  choice: Il leur dira
  rationale: Dans cette instruction rituelle, le parfait précédé de waw poursuit la séquence prescrite. Le futur français exprime naturellement ce que le prêtre devra faire.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Écoute, Israël !
  rationale: Cette formule d’appel caractéristique du Deutéronome invite non seulement à entendre, mais aussi à prêter attention et à obéir.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: Aujourd’hui, vous vous approchez du combat
  rationale: Le participe קְרֵבִים présente l’approche comme imminente. Cette formulation conserve l’image de proximité sans réduire le sens à une simple préparation.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Que votre cœur ne faiblisse pas
  rationale: La traduction conserve l’image hébraïque du cœur qui perd sa fermeté tout en exprimant clairement l’effondrement du courage.
- source_word: וְאַל תַּחְפְּזוּ
  choice: ne cédez pas à la panique
  rationale: Dans ce contexte militaire, le verbe désigne une réaction d’affolement ou de désarroi plutôt qu’une simple précipitation.
- source_word: וְאַל תַּעַרְצוּ מִפְּנֵיהֶם
  choice: ne soyez pas terrifiés devant eux
  rationale: La formulation rend l’intensité de la terreur inspirée par l’ennemi et conserve la relation spatiale exprimée par מִפְּנֵיהֶם.
theological_decisions: []
