  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: fr
  text: 'et porte contre elle des accusations infamantes[a] et la diffame[b], en disant : « J’ai pris cette femme pour épouse et, quand je me suis approché d’elle[c], je n’ai trouvé chez elle aucune preuve de virginité[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est idiomatique. Elle peut aussi se traduire par « des accusations de conduite honteuse » ou « des allégations diffamatoires ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fait sortir contre elle un mauvais nom »; autrement dit, il la diffame.'
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, « s’approcher d’elle » est un euphémisme hébreu désignant les relations sexuelles.
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « je n’ai pas trouvé pour elle de virginité ». Dans ce contexte, il s’agit des signes ou preuves de virginité mentionnés dans les versets suivants.'
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: porte contre elle des accusations infamantes
  rationale: La tournure hébraïque est idiomatique et désigne des allégations préjudiciables. « Porte contre elle » convient au contexte juridique, tandis qu’« infamantes » exprime leur caractère diffamatoire sans ajouter explicitement qu’elles sont fausses, élément que l’expression seule ne tranche pas.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: lui faisant une mauvaise réputation
  rationale: Cette formulation française naturelle conserve l’image hébraïque du mauvais « nom » tout en exprimant clairement l’atteinte à la réputation.
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: J’ai pris cette femme pour épouse
  rationale: « Prendre pour épouse » rend le sens matrimonial de לקח tout en conservant la formulation démonstrative et distante « cette femme ».
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: quand je me suis approché d’elle
  rationale: La traduction préserve l’euphémisme discret de l’hébreu; une note en explicite le sens sexuel dans ce contexte.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: je n’ai trouvé chez elle aucune preuve de virginité
  rationale: Le pluriel בְּתוּלִים désigne ici, dans le cadre de la procédure exposée aux versets suivants, les signes ou preuves invoqués pour attester la virginité. La formulation française rend ce sens juridique sans présenter l’accusation du mari comme un fait établi.
theological_decisions:
- issue: Statut de l’accusation du mari
  choice: Conserver ses paroles comme une allégation rapportée sans confirmer leur véracité
  alternative: Qualifier directement les accusations de « fausses » dans le texte principal
  rationale: Le cadre narratif et juridique envisage la possibilité d’une calomnie, mais les mots du verset rapportent d’abord l’accusation. La traduction évite donc de résoudre à l’avance la question que la procédure suivante doit examiner.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde le ton accusateur et quelque peu distant du mari, tandis que les euphémismes et les images de l’hébreu sont conservés lorsqu’ils restent compréhensibles.
