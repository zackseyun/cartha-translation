  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: fr
  text: Si un homme trouve une jeune femme vierge qui n’est pas fiancée[a], s’empare d’elle[b] et couche avec elle, et qu’ils sont découverts,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui n’est pas promise en mariage ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut signifier « saisir », « empoigner » ou « s’emparer de ». Certains comprennent que la proposition décrit ici un viol ; d’autres estiment que la qualification juridique de l’acte doit être déduite du contexte plus large plutôt que de ce seul verbe.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit le cas envisagé par une loi casuistique ; « si » convient naturellement au style juridique français.
- source_word: יִמְצָא
  choice: trouve
  rationale: Rend directement le sens courant du verbe, sans ajouter l’idée d’une rencontre fortuite.
- source_word: אִישׁ
  choice: un homme
  rationale: Respecte le nom masculin singulier du texte source.
- source_word: נער בְתוּלָה
  choice: une jeune femme vierge
  rationale: Conserve à la fois l’idée de jeunesse et celle de virginité, dans une formulation moderne qui évite l’archaïsme de « jeune fille vierge » pris comme expression figée.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: qui n’est pas fiancée
  rationale: Exprime en français courant qu’elle n’a pas été juridiquement promise en mariage ; la précision historique « promise en mariage » est donnée en note.
- source_word: וּתְפָשָׂהּ
  choice: s’empare d’elle
  rationale: Préserve la force physique du verbe, qui peut signifier saisir, empoigner ou s’emparer de quelqu’un, sans remplacer le libellé hébreu par une qualification juridique plus précise.
- source_word: וְשָׁכַב עִמָּהּ
  choice: et couche avec elle
  rationale: Rend clairement et naturellement l’idiome hébreu désignant une relation sexuelle.
- source_word: וְנִמְצָאוּ
  choice: et qu’ils soient découverts
  rationale: Conserve le passif et le pluriel hébreux, selon lesquels tous deux ou leur acte sont découverts.
theological_decisions:
- issue: Faut-il désigner explicitement l’acte comme un viol dans le texte principal ?
  choice: Conserver la formulation lexicale « s’empare d’elle et couche avec elle ».
  alternative: « la viole » ou, dans un sens plus faible, « la prend »
  rationale: Le verbe תפשׂ indique une saisie ou une prise physique, mais la portée juridique exacte du cas reste discutée en relation avec les lois voisines. La traduction maintient donc la force du geste sans réduire d’avance toute la proposition à une qualification interprétative unique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la forme conditionnelle d’une loi casuistique et la virgule finale, puisque la conséquence juridique vient au verset suivant. Les marqueurs de note sont placés immédiatement après les expressions qu’ils expliquent.
