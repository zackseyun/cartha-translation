  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: fr
  text: 'Alors vous les ferez sortir tous les deux à la porte de cette ville[a], et vous les lapiderez à coups de pierres, et ils mourront : la jeune femme, parce qu’elle n’a pas crié dans la ville, et l’homme, parce qu’il a violé la femme de son prochain[b]. Tu élimineras ainsi le mal qui est au milieu de toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La porte de la ville était habituellement le lieu public où se tenaient les procédures judiciaires et où les jugements étaient rendus.
    reason: cultural_note
  - marker: b
    text: Ou « humilié » ou « déshonoré ». Dans ce contexte sexuel, le verbe hébreu peut désigner une atteinte sexuelle accompagnée d’humiliation; « violé » en exprime le plus clairement la gravité en français moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: vous les ferez sortir
  rationale: 'Le hiphil de יצא est causatif : il s’agit de faire sortir les deux personnes vers le lieu public du jugement.'
- source_word: שְׁנֵיהֶם
  choice: tous les deux
  rationale: Cette expression désigne explicitement les deux personnes concernées et se rend naturellement ainsi en français.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: la porte de cette ville
  rationale: Traduction formelle et naturelle de l’expression hébraïque; la fonction judiciaire de la porte est précisée en note.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: vous les lapiderez à coups de pierres
  rationale: « Lapider » exprime précisément l’action, tandis que « à coups de pierres » conserve la mention explicite des pierres dans l’hébreu.
- source_word: וָמֵתוּ
  choice: et ils mourront
  rationale: Cette formulation suit directement la coordination hébraïque et laisse ouverte la nuance de conséquence sans la reformuler comme un but.
- source_word: הנער
  choice: la jeune femme
  rationale: La graphie consonantique est ambiguë isolément, mais le verbe féminin צָעֲקָה établit qu’il s’agit ici d’une personne de sexe féminin; « jeune femme » évite une précision d’âge excessive.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: parce qu’elle n’a pas crié dans la ville
  rationale: עַל דְּבַר introduit le motif du jugement; « parce que » en rend clairement la valeur causale sans ajouter une interprétation.
- source_word: עִנָּה
  choice: a déshonoré
  rationale: Dans ce contexte sexuel et juridique, ענה peut exprimer le fait d’humilier, de déshonorer ou de violer. « Déshonorer » préserve la composante d’humiliation sans imposer un terme juridique moderne plus précis que le lexème.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: la femme de son prochain
  rationale: Cette tournure conserve le sens social et relationnel de רֵעַ et rend naturellement la chaîne construite.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Tu élimineras ainsi le mal du milieu de toi
  rationale: Formule juridique récurrente du Deutéronome. « Éliminer » rend l’idée d’ôter radicalement le mal, et le passage au singulier reflète le texte hébreu.
theological_decisions:
- issue: Motif juridique concernant la jeune femme
  choice: parce qu’elle n’a pas crié dans la ville
  alternative: parce qu’elle n’a pas appelé au secours dans la ville
  rationale: La traduction conserve le critère explicitement formulé dans le verset. Elle n’ajoute ni conclusion générale sur le consentement ni appréciation éthique extérieure au texte.
- issue: Sens de עִנָּה dans ce contexte sexuel
  choice: a déshonoré
  alternative: a violé / a humilié
  rationale: Le verbe porte une notion d’affliction et d’humiliation dans un contexte sexuel. « Déshonoré » maintient cette largeur sémantique; « violé » serait plus précis juridiquement que le mot hébreu seul, tandis que « humilié » risquerait d’affaiblir la gravité de l’acte.
- issue: Alternance entre pluriel et singulier dans les injonctions
  choice: vous les ferez sortir… vous les lapiderez… Tu élimineras
  alternative: uniformiser tout le verset au pluriel
  rationale: L’hébreu passe du pluriel dans les prescriptions adressées aux exécutants au singulier dans la formule finale adressée collectivement à Israël. La traduction préserve cette variation significative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique demeure solennelle sans archaïsmes. La répétition liée aux pierres est conservée sous une forme française idiomatique. Le changement du pluriel au singulier reflète délibérément l’hébreu.
