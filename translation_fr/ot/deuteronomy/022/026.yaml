  naturalness: La révision proposée reste naturelle en français moderne tout en suivant plus clairement la structure comparative de l’hébreu.
  terminology: « Jeune femme » convient au contexte. « Faute passible de mort » exprime mieux en français juridique moderne la portée de חֵטְא מָוֶת que « péché qui mérite la mort », sans effacer le sens de culpabilité. « Assassine » rend adéquatement רצח dans l’analogie.
