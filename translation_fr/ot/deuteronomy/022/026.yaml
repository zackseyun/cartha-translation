source:
  edition: WLC
  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: fr
  text: 'Mais tu ne feras rien à la jeune femme : elle n’a commis aucune faute passible de mort[a]. En effet, de même qu’un homme se lève contre son prochain et l’assassine, ainsi en est-il de cette affaire[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle n’est coupable d’aucun délit passible de mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ainsi est cette affaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: Mais… à la jeune femme
  rationale: Le waw marque ici le contraste avec le châtiment de l’homme au verset précédent. Dans ce contexte juridique, נַעַר désigne la jeune femme fiancée dont il vient d’être question.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: tu ne feras rien
  rationale: Cette formulation conserve l’adresse juridique à la deuxième personne du singulier et interdit toute mesure punitive contre elle.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: elle n’a commis aucun péché qui mérite la mort
  rationale: L’expression signifie littéralement qu’il n’y a pour elle aucun « péché de mort »; la formulation française exprime sa portée judiciaire sans élargir l’affirmation au-delà du cas traité.
- source_word: כִּי
  choice: En effet
  rationale: Introduit naturellement en français le motif qui justifie la décision juridique.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: à celui d’un homme qui se jette sur son prochain
  rationale: La formulation garde la comparaison et l’image d’une agression soudaine; « prochain » rend רֵעַ dans ce contexte interpersonnel.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: et l’assassine
  rationale: רצח désigne un homicide illégitime; le pronom renvoie au prochain agressé, tandis que נֶפֶשׁ est intégré idiomatiquement au verbe en français.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: ce cas est semblable
  rationale: Cette formulation française naturelle rend la conclusion de l’analogie juridique, littéralement « ainsi est cette affaire ».
theological_decisions:
- issue: Nature de l’innocence de la jeune femme dans l’analogie juridique
  choice: Le verset affirme qu’elle n’a commis aucun péché méritant la mort et qu’aucune peine ne doit lui être infligée dans ce cas.
  alternative: Comprendre l’énoncé comme une affirmation générale d’innocence morale absolue.
  rationale: L’expression hébraïque a une portée judiciaire dans cette loi. La traduction maintient cette précision sans importer une affirmation morale plus vaste que le texte.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement conserve la deuxième personne du singulier de l’adresse légale hébraïque. Le vocabulaire demeure accessible tout en maintenant le caractère judiciaire et la force de l’analogie.
