revisions:
- from: 'Mais tu ne feras rien à la jeune femme : elle n’a commis aucun péché qui mérite la mort[a]. En effet, ce cas est semblable à celui d’un homme qui se jette sur son prochain et l’assassine[b].'
  to: 'Mais tu ne feras rien à la jeune femme : elle n’a commis aucune faute passible de mort[a]. En effet, de même qu’un homme se lève contre son prochain et l’assassine, ainsi en est-il de cette affaire[b].'
  rationale: La révision remplace une image plus interprétative par « se lève contre », qui reproduit la comparaison hébraïque, et rétablit explicitement sa conclusion. Elle emploie « faute passible de mort » pour rendre la force judiciaire de l’expression sans élargir le propos au-delà du cas légal.
