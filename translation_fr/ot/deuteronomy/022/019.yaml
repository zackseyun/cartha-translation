base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: fr
  text: Ils lui imposeront une amende de cent sicles d’argent et les donneront au père de la jeune femme, parce qu’il a diffamé une vierge d’Israël. Elle sera sa femme, et il ne pourra pas la renvoyer tous les jours de sa vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « divorcer d’elle ». L’hébreu dit littéralement « la renvoyer », une expression employée dans un contexte juridique pour désigner la dissolution d’un mariage.
    reason: Alternative lexicale et clarification de l’idiome juridique.
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: ils lui imposeront une amende
  rationale: Dans ce contexte juridique, le verbe désigne l’imposition d’une sanction pécuniaire, et non une punition indéterminée.
- source_word: מֵאָה כֶסֶף
  choice: cent sicles d’argent
  rationale: L’hébreu dit elliptiquement « cent d’argent »; dans ce contexte économique, il s’agit d’un poids d’argent exprimé en sicles.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: au père de la jeune femme
  rationale: נַעֲרָה désigne ici une jeune femme en âge d’être mariée; cette formulation est actuelle et précise.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: parce qu’il a porté atteinte à la réputation
  rationale: L’expression hébraïque évoque littéralement le fait de faire sortir un mauvais nom. La formulation française rend naturellement l’idée de diffamation sans en atténuer la portée juridique.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: d’une vierge d’Israël
  rationale: בְּתוּלָה désigne une vierge dans le cadre de l’accusation examinée, et « d’Israël » conserve l’appartenance à la communauté d’alliance.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Elle restera sa femme
  rationale: Dans le contexte immédiat, les deux personnes sont déjà mariées. « Restera » explicite la continuité du statut conjugal impliquée par la sanction, plutôt qu’un nouveau mariage.
- source_word: לֹא יוּכַל
  choice: il ne pourra
  rationale: La construction exprime ici une incapacité juridique, c’est-à-dire une interdiction, plutôt qu’une impossibilité physique.
- source_word: לְשַׁלְּחָהּ
  choice: la renvoyer
  rationale: Le verbe signifie littéralement « envoyer au loin, renvoyer » et sert, dans ce contexte matrimonial, d’expression juridique pouvant désigner le divorce.
- source_word: כָּל יָמָיו
  choice: jamais
  rationale: Littéralement « tous ses jours », l’expression signifie ici qu’il lui est interdit de la renvoyer pendant toute sa vie; « jamais » le rend naturellement en français.
theological_decisions:
- issue: Expression juridique de la dissolution du mariage
  choice: la renvoyer
  alternative: divorcer d’elle
  rationale: Le texte principal conserve l’image verbale hébraïque tout en restant idiomatique en français. La note indique explicitement sa portée juridique possible sans réduire l’expression à une seule glose.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique accessible. Le texte évite l’archaïsme « jeune fille » là où il pourrait suggérer à tort l’enfance, et conserve en note l’ambiguïté relative de l’expression matrimoniale hébraïque.
