revisions:
- from: Ils lui imposeront une amende de cent sicles d’argent et les donneront au père de la jeune femme, parce qu’il a porté atteinte à la réputation d’une vierge d’Israël. Elle restera sa femme, et il ne pourra jamais la renvoyer.[a]
  to: Ils lui imposeront une amende de cent sicles d’argent et les donneront au père de la jeune femme, parce qu’il a diffamé une vierge d’Israël. Elle sera sa femme, et il ne pourra pas la renvoyer tous les jours de sa vie.[a]
  rationale: La révision supprime l’inférence ajoutée par « restera », rend plus directement l’idiome de la diffamation et remplace « jamais » par une expression qui reflète explicitement « tous les jours de sa vie ». Elle maintient le sens juridique de « renvoyer » et son alternative interprétative en note.
