  text: שַׁלֵּ֤חַ תְּשַׁלַּח֙ אֶת הָ/אֵ֔ם וְ/אֶת הַ/בָּנִ֖ים תִּֽקַּֽח לָ֑/ךְ לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וְ/הַאֲרַכְתָּ֖ יָמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: fr
  text: Tu laisseras partir la mère[a], mais tu pourras prendre les petits pour toi[b], afin que tout aille bien pour toi et que tu prolonges tes jours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu laisseras certainement partir la mère »; l’hébreu renforce ici le commandement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils »; dans le contexte d’un nid, il s’agit des petits.'
    reason: lexical_alternative
  - marker: c
    text: 'C’est-à-dire : « que tu vives longtemps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: tu laisseras partir
  rationale: La construction infinitif absolu + verbe conjugué renforce le commandement. En français, le futur à valeur impérative exprime naturellement une prescription ferme; la note signale l’intensification littérale.
- source_word: הָאֵם
  choice: la mère
  rationale: Le contexte immédiat indique qu’il s’agit de l’oiseau femelle; il n’est donc pas nécessaire d’ajouter « oiseau » dans le texte.
- source_word: הַבָּנִים
  choice: les petits
  rationale: Littéralement « les fils », mais le mot désigne ici la progéniture de l’oiseau. « Les petits » est naturel et reste assez large dans le contexte du nid évoqué au verset précédent.
- source_word: תִּקַּח לָךְ
  choice: tu pourras prendre ... pour toi
  rationale: Après l’ordre de relâcher la mère, la forme verbale a ici une valeur permissive. « Pour toi » conserve explicitement לָךְ.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: afin que tout aille bien pour toi
  rationale: Cette formulation moderne et naturelle rend la tournure hébraïque de but ou de résultat sans transformer la bénédiction en garantie mécanique.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: et que tu prolonges tes jours
  rationale: Cette formulation suit de près l’expression hébraïque littérale tout en restant intelligible en français; dans ce contexte, elle signifie vivre longtemps.
theological_decisions:
- issue: Nature du résultat promis
  choice: Présenter le bien-être et la longueur des jours comme la bénédiction ou le résultat associé à l’obéissance.
  alternative: Formuler une garantie absolue de longévité pour chaque individu.
  rationale: La construction introduite par לְמַעַן énonce le but ou le résultat promis, sans autoriser la traduction à préciser un mécanisme ni à éliminer la tension théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative convient au registre législatif biblique. La formulation conserve la distinction entre l’obligation de relâcher la mère et la permission de prendre les petits.
