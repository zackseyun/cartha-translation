source:
  edition: WLC
  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: fr
  text: Si une jeune femme vierge est promise en mariage[a] à un homme, et qu’un autre homme la trouve dans la ville et couche avec elle,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne des fiançailles officielles et juridiquement contraignantes.
    reason: Préciser la force institutionnelle de מְאֹרָשָׂה, que l’expression française « promise en mariage » pourrait ne pas pleinement communiquer.
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Si ... est
  rationale: Cette tournure introduit naturellement en français un cas juridique hypothétique.
- source_word: נער בְתוּלָה
  choice: une jeune femme vierge
  rationale: « Jeune femme » convient à une personne en âge de se marier, tandis que « vierge » conserve la précision juridique explicite du texte.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: promise en mariage à un homme
  rationale: Cette formulation française courante exprime des fiançailles formelles et juridiquement contraignantes, plus fortes que les fiançailles modernes ordinaires.
- source_word: וּמְצָאָהּ אִישׁ
  choice: et qu’un autre homme la rencontre
  rationale: Le verbe peut signifier trouver ou rencontrer. « Rencontre » est naturel ici; « autre » explicite seulement que cet homme n’est pas celui auquel elle est promise.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Rendu direct qui préserve un élément déterminant du cas juridique développé au verset suivant.
- source_word: וְשָׁכַב עִמָּהּ
  choice: et couche avec elle
  rationale: Cette expression française claire conserve l’euphémisme sexuel de l’hébreu sans introduire ici l’idée de contrainte.
theological_decisions:
- issue: Faut-il présenter explicitement l’acte sexuel comme contraint dans ce verset ?
  choice: « couche avec elle », formulation neutre quant à la contrainte
  alternative: « la viole » ou « la force à coucher avec lui »
  rationale: Les mots de ce verset ne précisent pas à eux seuls si l’acte est contraint. Une formulation neutre préserve l’ambiguïté du texte et laisse la distinction juridique se développer dans le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la forme casuistique de la loi. « Couche avec elle » reste euphémique sans être archaïque.
