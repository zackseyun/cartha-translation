revisions:
- from: 'Tu ne sèmeras pas dans ta vigne deux espèces de semences, sinon toute la récolte sera soustraite à ton usage[a] : aussi bien ce qui provient de la semence que tu auras semée que le produit de la vigne.'
  to: 'Tu ne sèmeras pas dans ta vigne deux espèces de semences, de peur que la totalité de la production ne soit mise à part[a] : la semence que tu auras semée et le produit de la vigne.'
  rationale: La révision rétablit la « semence que tu auras semée », conservant ainsi le référent du texte hébreu, et rend תִּקְדַּשׁ par « soit mise à part », ce qui maintient la conséquence défavorable sans préciser indûment l’autorité ou le bénéficiaire de cette mise à part. La note conserve l’ambiguïté du verbe et son sens littéral.
