  timestamp: '2026-07-14T13:02:30Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition rend bien l’interdiction de semer et la conséquence juridique. Toutefois, « ce qui provient de la semence » remplace la « semence que tu sèmes » explicitement mentionnée dans l’hébreu. « Soustraite à ton usage » explicite de façon plausible la conséquence de תִּקְדַּשׁ, mais ajoute le possessif et fixe davantage le mécanisme que ne le fait le texte; une formulation de mise à part préserve mieux l’ambiguïté lexicale.
  naturalness: Le français est globalement naturel et le registre juridique sobre convient. « De peur que » rend plus directement la valeur préventive de פֶּן que « sinon ». « La totalité de la production » permet une énumération finale claire sans transformer la semence en son produit.
  terminology: « Vigne », « semences », « produit de la vigne » et le futur prescriptif sont appropriés. « Mise à part » traduit prudemment la portée de קדש sans imposer une destination cultuelle ou une confiscation déterminée; la note conserve les possibilités littérales « sainte » et « consacrée ».
  issues:
  - severity: medium
    issue: La semence est remplacée par son produit.
    rationale: הַזֶּרַע אֲשֶׁר תִּזְרָע signifie littéralement « la semence que tu sèmeras ». « Ce qui provient de la semence » interprète et modifie le référent explicite.
  - severity: low
    issue: La conséquence est formulée comme une privation personnelle.
    rationale: « Sera soustraite à ton usage » explique utilement la conséquence pratique, mais « ton » n’est pas exprimé dans l’hébreu et la formulation réduit l’ambiguïté de תִּקְדַּשׁ. Une mise à part dans le texte, expliquée en note, est plus fidèle.
  revised_text: 'Tu ne sèmeras pas dans ta vigne deux espèces de semences, de peur que la totalité de la production ne soit mise à part[a] : la semence que tu auras semée et le produit de la vigne.'
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « devienne sainte » ou « soit consacrée », c’est-à-dire mise à part et retirée de l’usage ordinaire.'
    reason: lexical_alternative
  revision_rationale: La révision rétablit la « semence que tu auras semée », conservant ainsi le référent du texte hébreu, et rend תִּקְדַּשׁ par « soit mise à part », ce qui maintient la conséquence défavorable sans préciser indûment l’autorité ou le bénéficiaire de cette mise à part. La note conserve l’ambiguïté du verbe et son sens littéral.
