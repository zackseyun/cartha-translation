source:
  edition: WLC
  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: fr
  text: 'Tu ne sèmeras pas dans ta vigne deux espèces de semences, de peur que la totalité de la production ne soit mise à part[a] : la semence que tu auras semée et le produit de la vigne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devienne sainte » ou « soit consacrée », c’est-à-dire mise à part et retirée de l’usage ordinaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: tu ne sèmeras pas
  rationale: Le verbe זרע désigne précisément l’action de semer; le futur à valeur prescriptive convient au style juridique français.
- source_word: כַּרְמְךָ
  choice: dans ta vigne
  rationale: כרם désigne un vignoble ou une vigne cultivée. « Dans ta vigne » est naturel en français et rend la construction locative du contexte.
- source_word: כִּלְאָיִם
  choice: deux espèces de semences
  rationale: כלאים désigne un mélange interdit d’espèces. Cette formulation exprime clairement la pluralité des espèces dans le contexte des semailles sans introduire un terme technique obscur.
- source_word: פֶּן
  choice: sinon
  rationale: פן introduit ici la conséquence négative dont l’interdiction vise à préserver; « sinon » est clair et actuel dans une prescription juridique.
- source_word: תִּקְדַּשׁ
  choice: sera soustraite à ton usage
  rationale: Le sens littéral est « deviendra sainte/consacrée », mais, dans cet avertissement légal, il implique que la récolte sera mise à part et ne pourra plus servir à l’usage ordinaire du propriétaire. La note conserve le sens lexical littéral.
- source_word: הַמְלֵאָה
  choice: toute la récolte
  rationale: Le terme désigne ici la pleine production, c’est-à-dire l’ensemble du rendement concerné.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: ce qui provient de la semence que tu auras semée
  rationale: Dans l’énumération de la récolte perdue, la formulation explicite naturellement en français le produit issu de la semence plutôt que la semence avant sa croissance.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: et le produit de la vigne
  rationale: תבואה désigne le produit ou rendement agricole; « produit de la vigne » reste précis et naturel.
theological_decisions:
- issue: Sens de תִּקְדַּשׁ dans cette loi sur les mélanges
  choice: sera soustraite à ton usage
  alternative: deviendra sainte / sera consacrée
  rationale: 'Le verbe קדש exprime littéralement la mise à part comme sainte ou consacrée. Dans ce contexte, il s’agit toutefois d’une conséquence défavorable: la production n’est plus disponible pour l’usage ordinaire. Le texte principal communique cette portée juridique, tandis que la note préserve l’ambiguïté et la formulation littérale.'
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse individuelle de la loi. La formulation évite le mot « confisquée », qui préciserait une autorité bénéficiaire non nommée dans le texte hébreu.
