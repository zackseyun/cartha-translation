  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: fr
  text: Mais si, dans un champ, un homme trouve une jeune femme fiancée, la saisit[a] et couche avec elle, seul l’homme qui a couché avec elle mourra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’empare d’elle », « la maîtrise » ou « lui fait violence » ; l’hébreu dit « la saisit », et le contexte de cette loi montre que l’acte lui est imposé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit le cas conditionnel opposé à celui des versets précédents et rend naturellement la valeur contrastive de la conjonction.
- source_word: בַּשָּׂדֶה
  choice: dans un champ
  rationale: Rend directement שָׂדֶה. La construction « c’est dans un champ que » met en relief le lieu, décisif dans le raisonnement juridique du contexte, sans ajouter explicitement « isolé » ou « en rase campagne ».
- source_word: יִמְצָא הָאִישׁ
  choice: un homme trouve
  rationale: מצא signifie couramment « trouver ». En français juridique narratif, l’indéfini introduit plus naturellement le protagoniste d’un cas hypothétique, malgré l’article hébreu.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: la jeune femme fiancée
  rationale: « Jeune femme » est moderne et digne. « Fiancée » désigne ici une femme juridiquement promise en mariage; le français courant ne dispose pas d’un équivalent bref exprimant toute la portée juridique ancienne.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: qu’il la saisit
  rationale: Le hiphil de חזק avec ב exprime une prise exercée avec force. « Saisit » reste proche du lexème tout en laissant le contexte légal établir le caractère non consenti.
- source_word: וְשָׁכַב עִמָּהּ
  choice: couche avec elle
  rationale: Rend naturellement et dignement l’idiome hébreu désignant une relation sexuelle.
- source_word: וּמֵת
  choice: mourra
  rationale: Dans ce texte de loi, la forme exprime la conséquence judiciaire prescrite. Le futur français convient au style casuistique.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: 'Marque clairement l’exclusivité de la peine: elle frappe l’homme, et non la jeune femme.'
theological_decisions:
- issue: Faut-il expliciter le viol dans le corps du verset au-delà du sens lexical de חזק ?
  choice: Conserver « la saisit » dans le texte et préciser en note que le contexte décrit un acte imposé.
  alternative: « lui fait violence », « la maîtrise » ou « la viole »
  rationale: Le contexte, notamment l’innocence déclarée de la jeune femme dans la suite, établit la contrainte. Toutefois, חזק signifie ici saisir ou maîtriser plutôt que « violer » de manière lexicalement spécifique; la traduction préserve cette distinction sans atténuer la violence.
translation_notes:
  register: Français international moderne, sobre et juridique. La phrase met le lieu en relief, évite l’archaïsme « promise en mariage » dans le corps du texte et conserve la formulation concrète de l’hébreu. Le marqueur [a] figure immédiatement après le terme annoté.
