  naturalness: « En abomination à Yahvé » n’est pas une tournure française naturelle dans cette construction. « Est une abomination pour Yahvé » est idiomatique, direct et conserve la force du substantif. « Équipement d’homme » est compréhensible, mais son emploi au singulier sans déterminant est moins naturel ici que « objet d’homme ».
  terminology: « Yahvé » est une forme française internationale établie pour le tétragramme dans ce type de traduction. « Abomination » convient à תּוֹעֵבָה et ne surinterprète pas la nature précise de ce jugement.
