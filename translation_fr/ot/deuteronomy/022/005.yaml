  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: fr
  text: Une femme ne portera pas d’objet d’homme[a], et un homme ne revêtira pas un vêtement de femme, car quiconque fait ces choses est une abomination pour Yahvé, ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne portera pas de vêtement d’homme ». Dans la première proposition, le terme hébreu est plus large que le mot précis traduit par « vêtement » dans la seconde.'
    reason: Préserve l’alternative lexicale et la distinction entre כְּלִי, terme large, et שִׂמְלָה, terme spécifique pour un vêtement.
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: équipement d’homme
  rationale: כְלִי peut désigner un objet, un instrument ou un équipement, et son sens est plus large que celui de שִׂמְלָה dans la seconde proposition. « Équipement » conserve cette différence sans limiter arbitrairement l’interdiction aux seuls vêtements.
- source_word: עַל אִשָּׁה
  choice: portera
  rationale: L’expression littérale « être sur une femme » désigne naturellement ce qu’elle porte sur elle. « Portera » rend clairement cet idiome en français.
- source_word: יִלְבַּשׁ
  choice: revêtira
  rationale: Le verbe signifie se vêtir ou mettre un vêtement. « Revêtira » est naturel dans le registre législatif et maintient une légère distinction avec le verbe de la première proposition.
- source_word: שִׂמְלַת אִשָּׁה
  choice: un vêtement de femme
  rationale: שִׂמְלָה désigne couramment un vêtement, souvent un vêtement extérieur, sans permettre ici de préciser davantage sa forme.
- source_word: גֶּבֶר
  choice: homme
  rationale: Le mot désigne ici un homme par contraste explicite avec une femme; la traduction conserve cette opposition sexuée.
- source_word: אִשָּׁה
  choice: femme
  rationale: Le terme désigne ici une femme et s’oppose directement à גֶּבֶר.
- source_word: תוֹעֲבַת יְהוָה
  choice: en abomination à Yahvé
  rationale: תוֹעֵבָה exprime ce qui est profondément odieux ou abominable devant Dieu. La tournure française conserve la force du terme et le nom divin יהוה est rendu par « Yahvé ».
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: quiconque fait ces choses
  rationale: Cette formulation rend naturellement la portée générale de כָּל avec le participe et conserve le pluriel démonstratif אֵלֶּה.
theological_decisions:
- issue: Portée de כְלִי גֶבֶר dans la première interdiction
  choice: Traduire au sens large par « équipement d’homme » et signaler « vêtement d’homme » en note.
  alternative: « vêtement d’homme » ou, plus étroitement, « arme d’homme »
  rationale: Le premier membre emploie כְלִי, terme plus large, tandis que le second utilise שִׂמְלָה, terme précis pour un vêtement. La traduction préserve cette différence et ne tranche pas silencieusement entre habillement, équipement et autres objets associés aux hommes.
- issue: Langage sexué
  choice: Employer « femme » et « homme ».
  alternative: Employer des termes neutres comme « personne ».
  rationale: L’hébreu oppose explicitement אִשָּׁה et גֶּבֶר; cette opposition doit rester visible.
- issue: Force de תוֹעֵבָה
  choice: Conserver le substantif fort « abomination ».
  alternative: « est détestable » ou « est odieux »
  rationale: « Abomination » maintient la gravité cultuelle et morale du terme sans en préciser davantage la nature théologique.
translation_notes:
  register: Français international moderne, digne et direct, avec un registre adapté à une prescription législative. « Équipement d’homme » est volontairement plus large que « vêtement », tandis que la note explicite l’autre lecture naturelle.
