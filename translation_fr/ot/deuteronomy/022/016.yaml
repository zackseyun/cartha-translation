  text: וְ/אָמַ֛ר אֲבִ֥י ה/נער אֶל הַ/זְּקֵנִ֑ים אֶת בִּתִּ֗/י נָתַ֜תִּי לָ/אִ֥ישׁ הַ/זֶּ֛ה לְ/אִשָּׁ֖ה וַ/יִּשְׂנָאֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: fr
  text: 'Le père de la jeune femme dira aux anciens : « J’ai donné ma fille pour femme à cet homme, et il la déteste[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il s’est mis à la détester ». Le verbe hébreu signifie simplement « détester, haïr » ; le contexte permet aussi de comprendre qu’une telle attitude s’est développée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: dira
  rationale: Dans cette formulation juridique décrivant la procédure à suivre, le parfait avec waw a une valeur séquentielle et prescriptive ; le futur français convient naturellement.
- source_word: אֲבִי הַנַּעַר
  choice: le père de la jeune femme
  rationale: Dans ce contexte matrimonial, le terme désigne une jeune femme en âge de se marier. Cette expression est actuelle et digne, contrairement à « jeune fille », potentiellement ambigu, ou « jeune fille vierge », qui expliciterait plus que ce syntagme.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Il s’agit des responsables reconnus qui exercent ici une fonction civique et judiciaire, et non simplement d’hommes âgés.
- source_word: אֶת בִּתִּי
  choice: ma fille
  rationale: Le marqueur d’objet direct אֶת n’est pas rendu ; בִּתִּי signifie directement « ma fille ».
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Dans le cadre des arrangements matrimoniaux, נָתַן exprime le fait de donner sa fille en mariage. Le passé composé est naturel dans le discours direct français.
- source_word: לָאִישׁ הַזֶּה
  choice: à cet homme
  rationale: La traduction conserve le sens ordinaire de אִישׁ ; le rôle marital de l’homme ressort déjà de « pour femme ».
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Cette expression française rend de façon concise la formule matrimoniale hébraïque, sans ajouter de précision absente du texte.
- source_word: וַיִּשְׂנָאֶהָ
  choice: et il la déteste
  rationale: שׂנא signifie directement « détester, haïr ». « Détester » est ici naturel en français moderne et le présent décrit l’attitude actuelle du mari ; la possibilité d’une attitude apparue ensuite est signalée en note.
