base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: fr
  text: Mais si ton frère[a] n’est pas près de chez toi, ou si tu ne le connais pas[b], tu le recueilleras chez toi. Il restera avec toi jusqu’à ce que ton frère vienne le rechercher ; alors tu le lui rendras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frère » désigne probablement, au sens large, un membre du peuple d’Israël, et non seulement un frère biologique.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « ou si tu ne sais pas à qui il appartient » ; littéralement : « ou si tu ne le connais pas ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tu le lui restitueras ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le terme hébreu de parenté est conservé. Dans le droit deutéronomique, il peut désigner plus largement un membre du peuple d’Israël, ce que précise la note.
- source_word: קָרוֹב אֵלֶיךָ
  choice: près de chez toi
  rationale: Cette formulation française naturelle exprime la proximité physique indiquée par l’hébreu, sans imposer qu’il s’agisse nécessairement d’un lien affectif.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: ou si tu ne le connais pas
  rationale: 'Le suffixe masculin singulier renvoie grammaticalement au frère, c’est-à-dire au propriétaire. « Ou » rend ici la valeur contextuelle de la coordination hébraïque : le propriétaire peut être éloigné ou inconnu.'
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: tu recueilleras l’animal chez toi
  rationale: « Recueillir chez soi » rend naturellement l’action de prendre l’animal perdu et de le mettre à l’abri dans sa maison. « L’animal » explicite le référent immédiat du verset précédent.
- source_word: וְהָיָה עִמְּךָ
  choice: Il restera avec toi
  rationale: Le verbe « être » prend ici une valeur durable en raison de la proposition temporelle qui suit ; « restera » l’exprime clairement en français.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: jusqu’à ce que ton frère vienne le rechercher
  rationale: דרש peut signifier chercher, s’enquérir de ou réclamer. « Vienne le rechercher » convient à un propriétaire qui se manifeste pour retrouver son bien, sans réduire le sens à une procédure juridique formelle.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: alors tu le lui rendras
  rationale: Le hiphil de שוב signifie ici faire revenir, donc rendre au propriétaire. « Alors » explicite en français la succession logique portée par la construction hébraïque.
