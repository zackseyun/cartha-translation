  text: וְ/לָֽקְח֛וּ זִקְנֵ֥י הָֽ/עִיר הַ/הִ֖וא אֶת הָ/אִ֑ישׁ וְ/יִסְּר֖וּ אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/018.yaml
  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: fr
  text: Alors les anciens de cette ville prendront l’homme et le puniront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le corrigeront », « lui infligeront un châtiment » ou, peut-être, « le fouetteront ». Le verbe hébreu désigne de manière générale une correction punitive; il ne précise pas à lui seul la forme exacte de la peine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: prendront
  rationale: Le qal de לקח signifie couramment « prendre ». Dans ce cadre juridique, « prendront » reste naturel et formel sans préciser une saisie violente que le texte n’exprime pas.
- source_word: זִקְנֵי
  choice: les anciens
  rationale: Dans ce contexte civique et juridique, זִקְנֵי désigne les responsables reconnus de la communauté, et non simplement des hommes âgés.
- source_word: הָעִיר הַהִוא
  choice: de cette ville
  rationale: Cette formulation rend le lieu ou ressort local désigné par עִיר et conserve la valeur démonstrative de הַהִוא, exprimée naturellement en français par « cette ».
- source_word: הָאִישׁ
  choice: l’homme
  rationale: אִישׁ signifie ici « l’homme », lequel est, d’après le contexte précédent, le mari accusateur. La traduction conserve le terme explicite sans remplacer celui-ci par une interprétation contextuelle.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: et le puniront
  rationale: Le verbe יסר peut désigner une correction disciplinaire ou un châtiment. Dans une décision judiciaire, « punir » est plus idiomatique en français que « discipliner », tout en évitant de préciser à tort qu’il s’agit nécessairement d’une peine corporelle.
theological_decisions:
- issue: Nature exacte de la sanction exprimée par יסר
  choice: 'Formulation générale : « le puniront »'
  alternative: « le corrigeront », « lui infligeront un châtiment » ou « le fouetteront »
  rationale: Le verbe hébreu désigne largement une correction punitive sans en préciser ici la forme. Le verset suivant mentionne une amende, mais le présent verset ne permet pas à lui seul de limiter ou d’identifier davantage la sanction.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la brièveté du texte juridique hébreu. « Punir » a été préféré à « discipliner », qui évoque plus facilement en français moderne une formation éducative ou un anglicisme, tout en maintenant l’indétermination du moyen de correction.
