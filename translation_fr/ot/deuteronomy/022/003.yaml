revisions:
- from: 'Tu feras de même pour son âne, tu feras de même pour son manteau, et tu feras de même pour tout objet appartenant à ton frère qui lui aura échappé et que tu trouveras : tu ne devras pas l’ignorer[a].'
  to: 'Tu feras de même pour son âne, tu feras de même pour son manteau, et tu feras de même pour tout objet de ton frère qui se sera perdu et que tu trouveras : tu ne pourras pas l’ignorer[a].'
  rationale: La révision remplace une expression française équivoque par une formulation qui désigne explicitement l’objet comme perdu tout en évitant d’attribuer sa perte à une action précise du frère. Elle emploie aussi « tu ne pourras pas » afin de reproduire plus étroitement la forme modale prohibitive de l’hébreu, sans perdre la clarté juridique moderne.
