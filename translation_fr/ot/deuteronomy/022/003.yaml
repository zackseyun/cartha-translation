  text: וְ/כֵ֧ן תַּעֲשֶׂ֣ה לַ/חֲמֹר֗/וֹ וְ/כֵ֣ן תַּעֲשֶׂה֮ לְ/שִׂמְלָת/וֹ֒ וְ/כֵ֣ן תַּעֲשֶׂ֜ה לְ/כָל אֲבֵדַ֥ת אָחִ֛י/ךָ אֲשֶׁר תֹּאבַ֥ד מִמֶּ֖/נּוּ וּ/מְצָאתָ֑/הּ לֹ֥א תוּכַ֖ל לְ/הִתְעַלֵּֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: fr
  text: 'Tu feras de même pour son âne, tu feras de même pour son manteau, et tu feras de même pour tout objet de ton frère qui se sera perdu et que tu trouveras : tu ne pourras pas l’ignorer[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu ne pourras pas te cacher » ou « tu ne pourras pas faire comme si tu ne l’avais pas vu ».'
    reason: La forme hébraïque évoque le fait de se dissimuler ou de se dérober, image qui sous-tend ici l’interdiction d’ignorer l’objet trouvé.
lexical_decisions:
- source_word: וְכֵן
  choice: Tu feras de même
  rationale: La formule répétée marque la continuité avec le verset précédent et conserve le rythme juridique insistant de l’hébreu.
- source_word: לַחֲמֹרוֹ
  choice: pour son âne
  rationale: La préposition introduit ici le cas auquel il faut appliquer la même conduite; « pour » est naturel en français.
- source_word: לְשִׂמְלָתוֹ
  choice: pour son manteau
  rationale: שִׂמְלָה désigne couramment un vêtement extérieur; « manteau » donne un référent concret sans généraliser en « vêtement ».
- source_word: לְכָל אֲבֵדַת אָחִיךָ
  choice: pour tout objet appartenant à ton frère
  rationale: La formulation française exprime naturellement le lien de possession tout en préparant la proposition indiquant que l’objet lui a échappé.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: qui lui aura échappé
  rationale: Cette tournure préserve l’idée qu’une chose s’est trouvée séparée de son propriétaire sans transformer explicitement la construction en action volontaire ou directe de sa part.
- source_word: וּמְצָאתָהּ
  choice: et que tu trouveras
  rationale: Rend directement la découverte ultérieure de l’objet par le destinataire de la loi.
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  choice: tu ne devras pas l’ignorer
  rationale: Dans ce contexte légal, l’expression interdit de se soustraire à sa responsabilité. « Ne devras pas » communique clairement cette force normative, tandis que la note conserve l’image plus littérale.
theological_decisions:
- issue: Sens communautaire de אָחִיךָ
  choice: ton frère
  alternative: ton compatriote israélite
  rationale: Le terme masculin singulier de parenté est conservé afin de respecter la formulation sociale et communautaire du texte, sans expliciter davantage son champ d’application.
- issue: Force de לֹא תוּכַל לְהִתְעַלֵּם
  choice: tu ne devras pas l’ignorer
  alternative: tu ne pourras pas te cacher
  rationale: Dans une disposition légale, la construction exprime une interdiction plutôt qu’une incapacité physique. La traduction principale en donne la portée pratique, et la note signale l’image hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tu feras de même » est maintenue pour reproduire l’insistance du style juridique hébreu; le tutoiement singulier correspond à l’adresse masculine singulière du texte source.
