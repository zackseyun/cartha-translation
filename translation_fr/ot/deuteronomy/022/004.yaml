  source_fidelity: Le texte rend correctement les animaux, leur état (« tombés »), le chemin, l’interdiction de les délaisser et l’intensification de l’ordre. La formulation révisée conserve le rapport explicite d’action conjointe dans « avec lui », où « lui » désigne le propriétaire, conformément à עִמּוֹ.
