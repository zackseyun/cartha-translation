  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: fr
  text: Si tu vois l’âne de ton frère ou son bœuf tombés sur le chemin, ne les ignore pas ; tu dois absolument les relever avec lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: de ton frère
  rationale: Conserve l’image familiale de l’hébreu tout en laissant entendre, dans ce cadre juridique, le membre de la communauté d’alliance.
- source_word: חֲמוֹר
  choice: l’âne
  rationale: Terme français moderne, courant et précis.
- source_word: שׁוֹרוֹ
  choice: son bœuf
  rationale: Rendu conventionnel et adapté au contexte d’un animal de travail.
- source_word: נֹפְלִים
  choice: tombés
  rationale: Décrit directement les animaux à terre sans préciser une cause que le texte ne donne pas.
- source_word: בַּדֶּרֶךְ
  choice: sur le chemin
  rationale: Expression naturelle qui rend clairement le lieu de la rencontre.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: et les ignorer
  rationale: Le hitpael de עלם exprime ici le fait de détourner délibérément son attention; le pronom pluriel renvoie aux animaux.
- source_word: הָקֵם תָּקִים
  choice: tu dois absolument les relever
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’ordre; « absolument » en restitue la force, tandis que « relever » convient à des animaux tombés.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Préserve explicitement l’action conjointe indiquée par l’hébreu, sans transformer la formule en simple assistance unilatérale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation impérative « tu ne dois pas » évite la possible lecture purement prédictive de « tu ne verras pas », et le parallélisme avec « tu dois absolument » restitue la force juridique du verset.
