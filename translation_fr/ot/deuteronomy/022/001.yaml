  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: fr
  text: Tu ne dois pas voir le bœuf ou le mouton de ton frère égarés et les ignorer ; tu dois absolument les lui ramener.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Conserve le terme de parenté et de solidarité communautaire du texte hébreu, sans le remplacer par une formulation explicative.
- source_word: שֵׂיוֹ
  choice: le mouton
  rationale: Le nom שֶׂה peut désigner une bête du petit bétail, mouton ou chèvre. « Le mouton » est naturel ici, tout en laissant cette portée lexicale à signaler en note.
- source_word: נִדָּחִים
  choice: égaré
  rationale: Le participe peut évoquer des bêtes dispersées, égarées ou chassées de leur chemin. Dans ce contexte de restitution d’un animal perdu, « égaré » exprime naturellement leur éloignement sans supposer nécessairement qu’un agent les a chassées.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: faire comme si tu ne l’avais pas vu
  rationale: La tournure signifie se dérober à ce que l’on voit, fermer les yeux ou ignorer délibérément. Cette formulation française rend le caractère volontaire de l’omission.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: tu dois absolument le ramener
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’obligation. « Absolument » restitue cette insistance ; le singulier collectif français reprend naturellement l’animal aperçu.
theological_decisions:
- issue: Portée de « ton frère »
  choice: Maintien littéral de « ton frère »
  alternative: « ton compatriote » ou « ton prochain »
  rationale: Le texte emploie explicitement le vocabulaire de la fraternité. Le conserver évite d’imposer dans le verset une délimitation interprétative de la communauté visée.
- issue: Nature de l’éloignement des animaux
  choice: « égaré »
  alternative: « chassé » ou « emporté au loin »
  rationale: Le contexte porte sur un animal trouvé loin de son propriétaire, tandis que le participe hébreu n’identifie pas clairement la cause. La traduction préserve donc l’absence d’agent explicite.
translation_notes:
  register: Français moderne, direct et digne. La deuxième personne du singulier suit l’adresse législative hébraïque. La répétition « voir… vu » est idiomatique dans « faire comme si tu ne l’avais pas vu » et souligne le refus délibéré d’intervenir.
