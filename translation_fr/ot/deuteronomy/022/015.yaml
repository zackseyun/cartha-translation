  text: וְ/לָקַ֛ח אֲבִ֥י ה/נער וְ/אִמָּ֑/הּ וְ/הוֹצִ֜יאוּ אֶת בְּתוּלֵ֧י ה/נער אֶל זִקְנֵ֥י הָ/עִ֖יר הַ/שָּֽׁעְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/015.yaml
  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: fr
  text: alors le père et la mère de la jeune femme prendront les preuves de sa virginité et les présenteront aux anciens de la ville, à la porte de la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les virginités de la jeune femme », expression qui désigne les signes matériels présentés comme preuves de sa virginité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: prendront
  rationale: Dans cette suite juridique, le qatal précédé de la conjonction a une valeur procédurale; le futur français exprime naturellement ce qui doit être fait.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: le père et la mère de la jeune femme
  rationale: נַעֲרָה désigne ici une jeune femme en âge de se marier. Cette formulation est moderne et évite aussi bien le sens enfantin possible de « fille » que l’archaïsme de « jeune fille » dans certains contextes.
- source_word: וְהוֹצִיאוּ
  choice: les présenteront
  rationale: Le hiphil de יצא signifie ici faire sortir ou produire quelque chose devant les autorités; « présenteront » rend clairement l’acte officiel impliqué par le contexte.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: les preuves de sa virginité
  rationale: L’expression littérale « les virginités de la jeune femme » est idiomatique et désigne les signes matériels produits comme preuves dans cette procédure.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: aux anciens de la ville
  rationale: אֶל indique le mouvement vers le corps d’autorité; cette traduction reste directe et laisse le contexte établir leur fonction judiciaire.
- source_word: הַשַּׁעְרָה
  choice: à la porte de la ville
  rationale: La finale directive peut signifier « vers la porte », mais la porte constitue ici le lieu public où siègent les anciens. La répétition de « la ville » explicite naturellement le référent en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve le ton procédural de la loi; « jeune femme » et « présenter » évitent respectivement une nuance enfantine et une tournure trop littérale.
