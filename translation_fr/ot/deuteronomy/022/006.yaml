base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: fr
  text: Si, en chemin, tu tombes sur un nid d’oiseau[a], dans n’importe quel arbre ou sur le sol, contenant des oisillons ou des œufs, et que la mère est posée sur les oisillons ou sur les œufs, tu ne prendras pas la mère avec les petits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si un nid d’oiseau se rencontre devant toi ». Le verbe hébreu évoque une découverte fortuite plutôt qu’une recherche délibérée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la mère sur les petits » ; dans ce contexte, l’expression signifie que la mère ne doit pas être prise avec sa progéniture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא ... לְפָנֶיךָ
  choice: Si ... tu tombes sur
  rationale: Cette tournure française naturelle introduit le cas juridique tout en exprimant la rencontre fortuite suggérée par le nifal de קרא.
- source_word: קַן צִפּוֹר
  choice: un nid d’oiseau
  rationale: Rend naturellement la construction hébraïque sans préciser indûment l’espèce.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: Désigne le trajet de manière plus générale qu’une route aménagée.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: dans un arbre quelconque ou à terre
  rationale: « À terre » exprime ici concrètement le lieu où se trouve le nid; « quelconque » conserve la portée de כָּל.
- source_word: אֶפְרֹחִים
  choice: oisillons
  rationale: Terme français courant pour les petits oiseaux encore au nid, sans désigner une espèce particulière.
- source_word: רֹבֶצֶת
  choice: se tienne sur
  rationale: Formulation naturelle et suffisamment générale pour décrire la mère placée sur les oisillons ou les œufs, sans imposer l’idée plus étroite de couvaison.
- source_word: לֹא תִקַּח
  choice: tu ne prendras pas
  rationale: Conserve la forme prescriptive caractéristique de la législation biblique.
- source_word: הָאֵם עַל הַבָּנִים
  choice: la mère avec les petits
  rationale: Dans ce contexte, עַל exprime que la mère serait prise avec sa progéniture; « petits » convient au contexte animal sans rendre littéralement « fils ».
