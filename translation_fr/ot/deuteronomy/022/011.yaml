lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: Tu ne porteras pas
  rationale: Dans ce contexte juridique, la négation suivie de l’imparfait qal à la deuxième personne du masculin singulier exprime naturellement une interdiction en français.
- source_word: שַׁעַטְנֵז
  choice: un tissu mélangé
  rationale: Ce terme rare désigne une matière textile composite interdite ici; la suite du verset en précise les composants. Cette formulation claire évite une translittération obscure sans effacer la particularité du terme, signalée en note.
- source_word: צֶמֶר
  choice: laine
  rationale: Sens courant du nom dans un contexte textile.
- source_word: וּפִשְׁתִּים
  choice: et de lin
  rationale: Le nom peut désigner le lin comme plante ou fibre; dans le contexte d’un vêtement, « lin » est le terme français naturel.
- source_word: יַחְדָּו
  choice: mélangé
  rationale: L’adverbe signifie « ensemble »; intégré à « tissu mélangé », il exprime naturellement l’association des deux matières dans un même textile.
