  text: גְּדִלִ֖ים תַּעֲשֶׂה לָּ֑/ךְ עַל אַרְבַּ֛ע כַּנְפ֥וֹת כְּסוּתְ/ךָ֖ אֲשֶׁ֥ר תְּכַסֶּה בָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: fr
  text: Tu te feras des franges[a] aux quatre coins du vêtement[b] dont tu te couvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cordons torsadés » ou « glands ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ce qui te couvre » ; autre traduction possible : « manteau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: franges
  rationale: Le terme désigne des éléments pendants fixés au vêtement, probablement faits de fils torsadés. « Franges » est naturel en français et convient au contexte vestimentaire, tout en laissant en note les nuances « cordons torsadés » et « glands ».
- source_word: תַּעֲשֶׂה לָּךְ
  choice: tu te feras
  rationale: Cette formulation rend à la fois l'injonction exprimée par l'imparfait en contexte légal et la nuance d'intérêt personnel portée par לָּךְ.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: aux quatre coins
  rationale: Dans le contexte d'une pièce d'étoffe, כָּנָף désigne ses extrémités ou ses coins plutôt que des « ailes » au sens propre.
- source_word: כְּסוּתְךָ
  choice: du vêtement
  rationale: Le nom désigne ce qui sert à couvrir, souvent un vêtement ou un manteau. « Vêtement » est plus naturel en français courant que « couverture » dans ce contexte, sans préciser indûment le type d'habit.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: dont tu te couvres
  rationale: La relative exprime la fonction du vêtement et conserve le lien lexical avec l'idée de couvrir, sans ajouter la nuance plus spécifique de s'envelopper.
