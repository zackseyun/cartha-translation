  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: fr
  text: Alors on fera sortir la jeune femme à l’entrée de la maison de son père, et les hommes de sa ville la lapideront à coups de pierres, et elle mourra, parce qu’elle a commis une infamie en Israël en se prostituant dans la maison de son père.[a] Tu feras ainsi disparaître le mal du milieu de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en se livrant à une conduite sexuelle illicite dans la maison de son père ». Le verbe hébreu évoque littéralement la prostitution, mais peut désigner plus largement une conduite sexuelle illicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: la jeune femme
  rationale: Dans ce contexte juridique, le terme désigne une jeune personne de sexe féminin. « La jeune femme » est naturel et digne en français moderne, tout en conservant l’indication d’âge suggérée par le contexte.
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: à l’entrée de la maison de son père
  rationale: « Entrée » rend naturellement l’ouverture ou le seuil désigné par פֶּתַח, tandis que « maison de son père » conserve à la fois le sens concret et la possible dimension familiale du syntagme hébreu.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: la lapideront à coups de pierres
  rationale: Cette formulation garde l’explicitation hébraïque des pierres sans produire la redondance peu naturelle « lapideront avec des pierres ».
- source_word: אַנְשֵׁי עִירָהּ
  choice: les hommes de sa ville
  rationale: Le texte emploie explicitement le pluriel masculin אַנְשֵׁי. La traduction le conserve au lieu de le neutraliser en « habitants ».
- source_word: נְבָלָה
  choice: une infamie
  rationale: Dans ce contexte moral et juridique, נְבָלָה désigne un acte scandaleux et honteux. « Infamie » en restitue avec concision la forte réprobation.
- source_word: לִזְנוֹת
  choice: en se prostituant
  rationale: Ce choix préserve l’image forte du verbe זנה, qui évoque la prostitution tout en pouvant désigner plus largement une conduite sexuelle illicite; une note signale cette amplitude.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Tu élimineras ainsi le mal du milieu de toi
  rationale: Cette formule française claire conserve la deuxième personne du singulier, le caractère prescriptif et la formule juridique récurrente du Deutéronome.
theological_decisions:
- issue: Portée du vocabulaire sexuel et moral
  choice: Conserver la formulation forte « une infamie… en se prostituant »
  alternative: Employer « en commettant une faute sexuelle » ou « en se livrant à l’immoralité sexuelle »
  rationale: Le texte doit garder la gravité morale et juridique de l’hébreu sans lui imposer une catégorie doctrinale postérieure. La note maintient la possibilité d’un emploi plus large du verbe.
- issue: Identification des exécutants
  choice: « les hommes de sa ville »
  alternative: « les habitants de sa ville »
  rationale: Le syntagme hébreu est explicitement masculin; le rendre ainsi évite de neutraliser une donnée du texte source.
- issue: Valeur de בֵּית אָבִיהָ dans la seconde occurrence
  choice: « dans la maison de son père »
  alternative: « au sein de la famille de son père »
  rationale: La traduction conserve la valeur locative immédiate et la répétition de « maison », sans exclure la portée sociale ou familiale que le syntagme peut aussi suggérer.
translation_notes:
  register: Français international moderne, juridique et solennel sans archaïsmes. La syntaxe reste proche de l’enchaînement hébreu, mais « à coups de pierres » évite une redondance maladroite. Le tutoiement singulier de la formule finale reflète l’adresse collective à Israël sous la forme grammaticale du singulier.
