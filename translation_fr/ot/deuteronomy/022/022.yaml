base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: fr
  text: 'Si l’on trouve un homme couché avec une femme mariée[a], tous deux mourront : l’homme qui a couché avec la femme, et la femme[b]. Ainsi, tu élimineras le mal du milieu d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme mariée à un mari ».'
    reason: lexical_alternative
  - marker: b
    text: 'Dans ce contexte juridique, « mourront » énonce la peine de mort ; on peut aussi traduire : « seront mis à mort ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: l’on trouve
  rationale: Le niphal de מצא exprime ici la découverte du fait. « Si l’on trouve » convient au style juridique français sans préciser indûment s’il s’agit d’une découverte ou d’un flagrant délit.
- source_word: שֹׁכֵב עִם
  choice: couché avec
  rationale: L’expression désigne une relation sexuelle. « Couché avec » conserve l’image hébraïque tout en restant claire et digne en français moderne.
- source_word: אִשָּׁה בְעֻלַת בַּעַל
  choice: une femme mariée
  rationale: La locution indique qu’elle est liée à un mari par le mariage. « Femme mariée » rend naturellement ce statut en français sans introduire une notion trompeuse de propriété.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: tous deux mourront
  rationale: Dans ce contexte légal, la forme verbale énonce la peine prescrite. Cette traduction reste proche du libellé hébreu, qui dit littéralement qu’ils mourront, sans expliciter dans le texte principal le passif judiciaire « seront mis à mort ».
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה
  choice: l’homme qui a couché avec la femme
  rationale: La proposition relative française restitue clairement la précision participiale hébraïque et identifie l’homme concerné.
- source_word: וְהָאִשָּׁה
  choice: et la femme
  rationale: La répétition hébraïque est conservée afin de maintenir la clarté et l’insistance de la formulation juridique.
- source_word: וּבִעַרְתָּ הָרָע
  choice: Ainsi, tu élimineras le mal
  rationale: Dans la formule juridique récurrente du Deutéronome, בער signifie faire disparaître ou éliminer le mal de la communauté. « Éliminer » est naturel et conserve la force de l’injonction.
- source_word: מִיִּשְׂרָאֵל
  choice: du milieu d’Israël
  rationale: Cette formulation explicite idiomatiquement en français l’idée d’un mal retiré de la communauté d’Israël, sans modifier le référent collectif.
theological_decisions:
- issue: Traduction du statut matrimonial בְעֻלַת בַּעַל
  choice: une femme mariée
  alternative: une femme liée à un mari
  rationale: L’hébreu souligne le lien matrimonial avec un mari. La formulation principale exprime ce statut naturellement; la note signale la forme plus littérale sans importer une doctrine de propriété conjugale.
- issue: Explicitation de la peine comme exécution judiciaire
  choice: tous deux mourront
  alternative: tous deux seront mis à mort
  rationale: Le contexte juridique prescrit bien la peine capitale, mais l’hébreu dit directement « ils mourront ». Le texte principal conserve cette forme, tandis que la note en précise la portée légale.
translation_notes:
  register: Français international moderne, sobre et digne, avec une syntaxe juridique accessible. Le tutoiement singulier de « tu élimineras » conserve l’adresse collective personnifiée à Israël. Les deux notes rendent visibles la forme littérale du statut matrimonial et la portée judiciaire de la peine sans alourdir le texte principal.
