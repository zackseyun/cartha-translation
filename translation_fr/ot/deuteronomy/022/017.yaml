  text: וְ/הִנֵּה ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵ/אמֹ֗ר לֹֽא מָצָ֤אתִי לְ/בִתְּ/ךָ֙ בְּתוּלִ֔ים וְ/אֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑/י וּ/פָֽרְשׂוּ֙ הַ/שִּׂמְלָ֔ה לִ/פְנֵ֖י זִקְנֵ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: fr
  text: 'Et voici qu’il porte contre elle des accusations diffamatoires en disant : « Je n’ai pas trouvé ta fille vierge[a]. » Mais voici les preuves de la virginité de ma fille[b]. Et ils déploieront le vêtement[c] devant les anciens de la ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Je n’ai pas trouvé de virginité à ta fille », tournure idiomatique par laquelle il affirme qu’elle n’était pas vierge.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les signes de la virginité de ma fille ».'
    reason: lexical_alternative
  - marker: c
    text: Ce vêtement, ou cette étoffe, est présenté ici comme pièce à conviction dans l’affaire.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Conserve la force présentative du marqueur discursif hébreu dans un français digne et naturel.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: porte contre elle des accusations diffamatoires
  rationale: Rend l’expression juridique et la teneur calomnieuse des propos, sans réduire le syntagme à de simples paroles honteuses.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Je n’ai pas trouvé ta fille vierge
  rationale: Formulation française idiomatique de l’accusation; le pluriel hébreu abstrait בְּתוּלִים ne se transpose pas naturellement mot à mot.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Mais voici les preuves de la virginité de ma fille
  rationale: Dans ce cadre judiciaire, le pluriel désigne les signes matériels invoqués comme preuves; « mais » explicite l’opposition contextuelle portée par la conjonction.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: Alors ils déploieront le vêtement
  rationale: « Déployer » convient à la présentation publique de la pièce; « vêtement » conserve la généralité de שִׂמְלָה sans préciser indûment sa nature.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: devant les anciens de la ville
  rationale: Expression judiciaire française claire qui préserve la désignation des autorités civiques locales.
theological_decisions: []
