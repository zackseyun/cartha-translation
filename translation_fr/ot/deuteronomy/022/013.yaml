lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cette formulation juridique casuistique, כִּי introduit le cas envisagé; « si » marque naturellement la proposition conditionnelle en français.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: un homme prend une femme pour épouse
  rationale: Cette formulation conserve le verbe concret « prendre » tout en explicitant le sens matrimonial de אִשָּׁה dans cette construction; elle est plus claire en français actuel que le calque « prend une épouse ».
- source_word: וּבָא אֵלֶיהָ
  choice: s’unit à elle
  rationale: L’expression hébraïque est un euphémisme conventionnel désignant les relations sexuelles. « S’unit à elle » en préserve la retenue et le sens matrimonial, tandis qu’une note donne l’équivalent explicite.
- source_word: וּשְׂנֵאָהּ
  choice: puis la prend en haine
  rationale: Le verbe signifie littéralement « haïr ». « Prendre en haine » exprime en français le développement d’une hostilité et « puis » restitue l’enchaînement du cas juridique.
