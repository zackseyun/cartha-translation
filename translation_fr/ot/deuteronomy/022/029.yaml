  naturalness: Le français est globalement naturel, sobre et adapté à un texte juridique ancien. « Ne pourra jamais » rend bien l’interdiction viagère; « ne pourra pas la renvoyer de toute sa vie » est toutefois légèrement plus explicite quant à la portée de כָּל־יָמָיו.
  terminology: « Sicles d’argent », « jeune femme » et « répudier » dans la note sont appropriés. Le remplacement de « violée » par « humiliée », éclairé par une note qui signale l’atteinte sexuelle, évite de surinterpréter le terme hébreu tout en ne minimisant pas son contexte.
