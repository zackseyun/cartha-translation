  text: וְ֠/נָתַן הָ/אִ֨ישׁ הַ/שֹּׁכֵ֥ב עִמָּ֛/הּ לַ/אֲבִ֥י ה/נער חֲמִשִּׁ֣ים כָּ֑סֶף וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔/הּ לֹא יוּכַ֥ל שַׁלְּחָ֖/ה כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: fr
  text: L’homme qui a couché avec elle donnera cinquante sicles d’argent au père de la jeune femme, et elle deviendra sa femme parce qu’il l’a humiliée[a]. Il ne pourra pas la renvoyer de toute sa vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’il l’a déshonorée » ou « abaissée ». Le verbe hébreu signifie littéralement « humilier »; dans ce contexte, il désigne une atteinte sexuelle grave.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « la renvoyer » signifie la répudier, c’est-à-dire divorcer d’elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: donnera
  rationale: Dans cette prescription juridique, le parfait précédé du waw fait progresser l’énoncé et exprime l’obligation qui découle du cas exposé.
- source_word: הַשֹּׁכֵב עִמָּהּ
  choice: qui a couché avec elle
  rationale: Formulation naturelle et sobre en français pour la construction participiale désignant l’homme par l’acte sexuel commis.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: au père de la jeune femme
  rationale: נַעֲרָה désigne ici une jeune femme en âge de se marier; ce choix évite de suggérer indûment une enfant.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: cinquante sicles d’argent
  rationale: L’hébreu dit littéralement « cinquante d’argent »; dans ce contexte économique, le sicle est l’unité de poids sous-entendue.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: elle deviendra sa femme
  rationale: Rend clairement le statut matrimonial résultant sans introduire une notion de propriété absente de la formulation.
- source_word: תַּחַת אֲשֶׁר
  choice: parce que
  rationale: La locution introduit ici le motif de la sanction juridique.
- source_word: עִנָּהּ
  choice: il l’a violée
  rationale: Au piel et dans ce contexte sexuel, ענה exprime l’humiliation et l’atteinte infligées à la femme. « Violée » communique la gravité de l’acte tout en gardant en note la valeur plus littérale du verbe.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: Il ne pourra jamais la renvoyer
  rationale: « Renvoyer » préserve l’image du texte source; dans ce cadre matrimonial, il s’agit de répudier ou divorcer. « Jamais » exprime naturellement la portée de כָּל יָמָיו.
- source_word: כָּל יָמָיו
  choice: jamais
  rationale: Littéralement « tous ses jours », cette expression hébraïque impose ici une interdiction valable durant toute la vie de l’homme.
theological_decisions:
- issue: Portée du verbe עִנָּהּ dans ce contexte de faute sexuelle
  choice: il l’a violée
  alternative: il l’a humiliée / déshonorée
  rationale: Le verbe évoque littéralement l’humiliation ou l’abaissement infligé, mais prend ici une portée sexuelle grave. « Violée » évite de minimiser l’acte; la note conserve toutefois l’ambiguïté lexicale et n’efface pas la formulation propre de ce verset.
- issue: Sens juridique de שַׁלְּחָהּ
  choice: la renvoyer
  alternative: divorcer d’elle / la répudier
  rationale: La traduction formelle garde l’expression hébraïque, tandis que la note précise sa portée matrimoniale sans imposer dans le corps du texte un terme juridique plus étroit.
translation_notes:
  register: Français international moderne, sobre et digne, adapté au style d’une loi biblique. Le futur exprime l’obligation juridique. « Sicles » conserve la mesure ancienne avec précision; les notes explicitent les expressions potentiellement opaques sans résoudre abusivement les tensions du texte.
