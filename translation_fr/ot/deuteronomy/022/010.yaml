  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: fr
  text: Tu ne laboureras pas avec un bœuf et un âne attelés ensemble.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: Tu ne laboureras pas
  rationale: La négation suivie de l’imparfait qal à la deuxième personne du masculin singulier exprime ici une interdiction juridique. Le futur français conserve naturellement la force normative du texte.
- source_word: בְּשׁוֹר
  choice: avec un bœuf
  rationale: שׁוֹר désigne ici un bovin employé comme animal de trait; « bœuf » est le terme français courant qui convient au contexte du labour.
- source_word: וּבַחֲמֹר
  choice: et un âne
  rationale: חֲמוֹר est le terme ordinaire pour l’âne; cette traduction est claire et actuelle.
- source_word: יַחְדָּו
  choice: attelés ensemble
  rationale: L’adverbe indique que les deux animaux participent conjointement au même labour. L’ajout explicatif « attelés » rend naturellement en français la situation agricole impliquée, tandis que « ensemble » traduit directement l’adverbe.
theological_decisions:
- issue: Force de l’interdiction dans la loi de l’alliance
  choice: 'Formulation juridique directe au futur : « Tu ne laboureras pas… »'
  alternative: 'Impératif négatif plus courant : « Ne laboure pas… »'
  rationale: Le futur à valeur injonctive est naturel dans le registre légal français et préserve la solennité de l’interdiction sans introduire d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu et au registre traditionnel des commandements. « Attelés ensemble » explicite sobrement le lien de trait impliqué par le labour.
