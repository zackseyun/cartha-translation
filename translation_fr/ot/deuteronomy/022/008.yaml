source:
  edition: WLC
  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: fr
  text: Quand tu construiras une maison neuve, tu feras un garde-corps[a] autour de ton toit, afin de ne pas faire peser sur ta maison la responsabilité d’une mort si quelqu’un tombe du toit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un parapet », « une balustrade » ou « une barrière de protection ». Le mot hébreu désigne une barrière protectrice aménagée au bord d’un toit plat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans cette loi casuistique, כִּי introduit une situation envisagée; « Quand » est naturel en français et convient à un cas normalement susceptible de se produire.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: tu construiras une maison neuve
  rationale: Cette formulation rend directement le verbe, le nom et l’adjectif, tout en employant le futur à valeur prescriptive courant dans les textes juridiques français.
- source_word: וְעָשִׂיתָ
  choice: tu feras
  rationale: Le parfait avec waw a ici une force injonctive. Le futur français exprime clairement l’obligation légale sans alourdir le texte.
- source_word: מַעֲקֶה
  choice: parapet
  rationale: Le mot désigne une barrière protectrice au bord d’un toit plat. « Parapet » est précis; une note donne des équivalents plus courants.
- source_word: לְגַגֶּךָ
  choice: autour de ton toit
  rationale: La préposition relie la barrière au toit. « Autour de » explicite naturellement en français l’emplacement fonctionnel du parapet, sans modifier la portée de la prescription.
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: Ainsi, tu ne rendras pas ta maison coupable d’une mort
  rationale: L’expression littérale « mettre des sangs dans/sur ta maison » indique la responsabilité liée à une mort évitable. Cette formulation française conserve la dimension juridique et morale sans employer le peu courant « culpabilité de sang ».
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: si quelqu’un tombe
  rationale: Le participe substantivé désigne de façon indéfinie une personne susceptible de tomber. « Si quelqu’un tombe » rend clairement cette éventualité sans reproduire la répétition hébraïque peu naturelle en français.
- source_word: מִמֶּנּוּ
  choice: en
  rationale: Le pronom adverbial renvoie naturellement au toit ou à l’ensemble de la construction mentionnée; il préserve la concision et une légère souplesse référentielle du texte hébreu.
theological_decisions:
- issue: Portée juridique et morale de דָּמִים
  choice: rendre la maison coupable d’une mort
  alternative: faire retomber sur la maison la responsabilité du sang versé
  rationale: Le pluriel hébreu דָּמִים évoque ici la responsabilité pour une mort évitable, et non seulement le sang physique. La traduction retenue communique cette responsabilité sans introduire de doctrine ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse juridique individuelle de l’hébreu. Le futur garde la tonalité prescriptive; la seconde phrase explicite naturellement le lien de conséquence.
