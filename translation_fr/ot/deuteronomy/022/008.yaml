- from: Quand tu construiras une maison neuve, tu feras un parapet[a] autour de ton toit. Ainsi, tu ne rendras pas ta maison coupable d’une mort si quelqu’un en tombe.
  to: Quand tu construiras une maison neuve, tu feras un garde-corps[a] autour de ton toit, afin de ne pas faire peser sur ta maison la responsabilité d’une mort si quelqu’un tombe du toit.
  rationale: La révision conserve la structure légale et le ton prescriptif du texte, mais remplace une personnification française inexacte par une formulation qui exprime la responsabilité attachée à la maison ou à la maisonnée. Elle emploie aussi un terme courant pour la barrière de sécurité, avec les autres options lexicales en note.
