review_pass:
  verdict: revise
  source_fidelity: 'La prescription de construire une protection autour du toit est bien rendue. En revanche, « tu ne rendras pas ta maison coupable d’une mort » inverse ou brouille la portée de l’idiome hébreu : la maison n’est pas l’agent moral coupable; le texte vise la responsabilité de sang qui pèserait sur la maisonnée/propriété en cas de chute évitable.'
  naturalness: Le français est globalement clair et le futur prescriptif convient. « Rendre sa maison coupable » n’est toutefois ni idiomatique ni naturel. « Garde-corps » est un terme moderne et usuel pour une protection contre les chutes; la note conserve « parapet » parmi les équivalents possibles.
  terminology: « Responsabilité pour une mort » rend de façon intelligible la force juridique et morale de דמים sans imposer une lecture doctrinale. « Garde-corps » convient à מעקה dans ce contexte; « du toit » clarifie le référent de ממנו tout en restant conforme au contexte immédiat.
  issues:
  - severity: medium
    issue: Attribution fautive de la culpabilité à la maison
    rationale: La formulation actuelle (« rendre ta maison coupable ») personnifie la maison comme sujet coupable. L’hébreu parle de sang/responsabilité de sang mis sur la maison, c’est-à-dire de la responsabilité qui retombe sur le propriétaire ou sa maisonnée du fait d’un décès évitable.
  - severity: low
    issue: Référent final insuffisamment explicite
    rationale: « en tombe » peut grammaticalement renvoyer à la maison; dans ce contexte, le référent visé est le toit. « Tombe du toit » est plus net en français et n’ajoute pas de sens étranger au passage.
  revised_text: Quand tu construiras une maison neuve, tu feras un garde-corps[a] autour de ton toit, afin de ne pas faire peser sur ta maison la responsabilité d’une mort si quelqu’un tombe du toit.
  revised_footnotes:
