translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure ouverte, comme dans l’hébreu, puisqu’elle se poursuit au verset suivant. Le vocabulaire judiciaire est explicité sans ajouter de conclusion médicale ou théologique étrangère au texte.
