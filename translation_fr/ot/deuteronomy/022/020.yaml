  text: וְ/אִם אֱמֶ֣ת הָיָ֔ה הַ/דָּבָ֖ר הַ/זֶּ֑ה לֹא נִמְצְא֥וּ בְתוּלִ֖ים ל/נער־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: fr
  text: Mais si cette affaire s’avère vraie[a] et qu’on ne trouve pas de signes de virginité chez la jeune femme,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si cette affaire était vraie ». L’hébreu dit ensuite : « et qu’on n’a pas trouvé de signes de virginité pour la jeune femme ». Le terme traduit par « signes de virginité » peut aussi désigner la virginité elle-même, dans le contexte d’une ancienne procédure juridique.'
    reason: Préserver la formulation littérale de « cette affaire » et l’étendue de sens de בְּתוּלִים, sans transformer les signes attendus par cette coutume ancienne en preuve médicalement certaine.
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction et la particule conditionnelle introduisent un contraste avec le cas exposé juste avant; « Mais si » rend naturellement cette progression.
- source_word: אֱמֶת הָיָה
  choice: est fondée
  rationale: Littéralement, la proposition dit que « cette affaire était vraie ». Dans ce contexte judiciaire, « l’accusation est fondée » exprime idiomatiquement le sens sans modifier le critère de vérité.
- source_word: הַדָּבָר הַזֶּה
  choice: l’accusation
  rationale: דָּבָר est large (« chose », « affaire », « parole »), mais renvoie ici aux allégations formulées contre la jeune femme. « L’accusation » rend clairement le référent judiciaire immédiat.
- source_word: לֹא נִמְצְאוּ
  choice: on n’a pas trouvé
  rationale: La tournure impersonnelle française traduit naturellement le passif hébreu pluriel tout en gardant la preuve comme objet de la recherche.
- source_word: בְּתוּלִים
  choice: de preuve de sa virginité
  rationale: Le pluriel hébreu peut désigner la virginité ou les signes qui étaient censés l’attester dans cette procédure ancienne. « Preuve de sa virginité » communique ce sens contextuel en français moderne.
- source_word: לַנַּעֲרָ
  choice: chez la jeune femme
  rationale: נַעֲרָה désigne une jeune femme en âge de se marier. Ici, « chez » rend naturellement l’idée que la preuve attendue n’a pas été constatée à son sujet.
