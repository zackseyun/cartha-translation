base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: fr
  text: Car il l’a trouvée dans la campagne[a] ; la jeune femme promise en mariage a crié, et il n’y avait personne pour la secourir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en pleine campagne ». L’expression hébraïque désigne ici un cadre rural ouvert et isolé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et personne ne l’a secourue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification du jugement énoncé au verset précédent, avec une valeur explicative naturelle en français.
- source_word: בַשָּׂדֶה
  choice: dans les champs
  rationale: Désigne ici un espace rural et isolé, par opposition à la ville. Le pluriel français exprime naturellement ce cadre sans suggérer nécessairement une parcelle particulière.
- source_word: מְצָאָהּ
  choice: il l’a trouvée
  rationale: Rend directement le sens courant de מצא tout en restant idiomatique dans ce contexte.
- source_word: צָעֲקָה
  choice: a crié
  rationale: Préserve le sens d’un cri de détresse ou d’appel au secours sans préciser davantage que l’hébreu la forme ou l’intensité du cri.
- source_word: הַנַּעַר
  choice: la jeune femme
  rationale: Le contexte ainsi que les accords et suffixes féminins identifient clairement le référent comme féminin. Cette expression est moderne et digne.
- source_word: הַמְאֹרָשָׂה
  choice: fiancée
  rationale: En français courant, « fiancée » désigne clairement une femme promise en mariage. Le contexte légal ancien donne à cet engagement une portée plus contraignante que les fiançailles modernes.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: mais personne n’était là pour la secourir
  rationale: Exprime naturellement l’absence de tout sauveteur disponible. « Secourir » convient à la situation immédiate et évite une possible coloration théologique de « sauver ».
theological_decisions:
- issue: Statut légal exprimé par הַמְאֹרָשָׂה
  choice: fiancée
  alternative: promise en mariage
  rationale: « Fiancée » est le terme français le plus naturel, tandis qu’une note rappelle que les fiançailles de l’ancien Israël constituaient un engagement juridique plus fort que dans l’usage moderne.
- issue: Genre de הַנַּעַר dans ce contexte
  choice: la jeune femme
  alternative: la jeune fille
  rationale: Les éléments grammaticaux et le contexte indiquent une référente féminine. « Jeune femme » évite de suggérer à tort qu’il s’agit nécessairement d’une enfant.
- issue: Valeur de צָעֲקָה dans l’argument juridique
  choice: a crié
  alternative: a appelé au secours
  rationale: La traduction conserve l’acte du cri sans ajouter explicitement son contenu, tout en laissant le contexte montrer qu’il s’agissait d’un appel à l’aide.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la logique explicative du texte légal et son cadre rural, sans archaïsme. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
