    text: 'Ou : « en pleine campagne ». L’expression hébraïque désigne ici un cadre rural ouvert et isolé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et personne ne l’a secourue ».'
    reason: lexical_alternative
  revision_rationale: 'La révision resserre le rendu sur le texte hébreu : elle rend le singulier collectif de « champ » par « campagne », remplace l’ajout « n’était là » par l’absence explicite de tout secoureur, corrige la note b qui ne pouvait être qualifiée de littérale, et choisit « promise en mariage » pour mieux signaler le statut juridique ancien tout en restant idiomatique.'
