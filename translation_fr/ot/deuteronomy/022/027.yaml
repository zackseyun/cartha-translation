revisions:
- from: Car il l’a trouvée dans les champs[a] ; la jeune femme fiancée a crié, mais personne n’était là pour la secourir[b].
  to: Car il l’a trouvée dans la campagne[a] ; la jeune femme promise en mariage a crié, et il n’y avait personne pour la secourir[b].
  rationale: 'La révision resserre le rendu sur le texte hébreu : elle rend le singulier collectif de « champ » par « campagne », remplace l’ajout « n’était là » par l’absence explicite de tout secoureur, corrige la note b qui ne pouvait être qualifiée de littérale, et choisit « promise en mariage » pour mieux signaler le statut juridique ancien tout en restant idiomatique.'
