  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: fr
  text: 'Mais vous ne mangerez rien de ce qui ne possède pas à la fois des nageoires et des écailles : cela est impur pour vous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mais… rien de ce qui
  rationale: Le וְ marque ici le contraste avec la permission du verset précédent, d’où « Mais ». Avec la négation, « rien de ce qui » rend naturellement en français la portée globale de כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: de ce qui n’a
  rationale: La construction אֵין avec suffixe exprime l’absence de possession ; « ce qui n’a » est direct et idiomatique en français moderne.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: ni nageoires ni écailles
  rationale: Après une proposition négative, la corrélation française « ni… ni… » exprime clairement l’absence des deux caractéristiques. Les pluriels sont naturels dans cette règle classificatoire.
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez
  rationale: L’imparfait hébreu nié, à la deuxième personne du pluriel dans un contexte légal, est rendu par le futur à valeur prescriptive, forme digne et courante dans les textes de loi bibliques.
- source_word: טָמֵא
  choice: impur
  rationale: « Impur » désigne clairement la catégorie rituelle ou cultuelle exprimée par טָמֵא et évite de réduire le terme à une simple saleté physique.
- source_word: הוּא לָכֶם
  choice: cela est impur pour vous
  rationale: 'Le pronom reprend collectivement ce qui vient d’être décrit, tandis que « pour vous » conserve la portée relationnelle de לָכֶם : ce statut vaut à l’égard d’Israël.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif conserve le registre juridique sans archaïsme. « Cela » reprend collectivement la catégorie des animaux aquatiques dépourvus des caractéristiques requises.
