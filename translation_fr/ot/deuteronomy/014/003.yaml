source:
  edition: WLC
  text: לֹ֥א תֹאכַ֖ל כָּל תּוֹעֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/003.yaml
  text: You shall not eat any detestable thing[a].
translation:
  language: fr
  text: Tu ne mangeras rien de détestable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rien d’abominable ». Le terme hébreu désigne ce qui est tenu pour odieux ou détestable; ici, il introduit la liste des aliments interdits qui suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: ne… rien
  rationale: La négation לֹא introduit ici une interdiction directe; avec כָּל et un nom singulier, la tournure française « ne… rien de » exprime naturellement sa portée globale.
- source_word: תֹאכַל
  choice: tu ne mangeras
  rationale: L’inaccompli qal, deuxième personne masculine singulière, précédé de לֹא dans ce contexte juridique, a une valeur prohibitive. Le futur français conserve le registre solennel et normatif de la loi.
- source_word: כָּל
  choice: rien de
  rationale: Sous la négation et devant un nom singulier, כָּל a le sens de « quoi que ce soit de »; « rien de » est la formulation française la plus naturelle et complète.
- source_word: תּוֹעֵבָה
  choice: détestable
  rationale: Le terme désigne ce qui est tenu pour abominable, odieux ou répugnant. Dans ce contexte, il introduit les aliments interdits qui suivent sans réduire la notion au simple dégoût esthétique.
theological_decisions:
- issue: Force de l’interdiction dans la loi de l’alliance
  choice: 'Interdiction juridique directe : « Tu ne mangeras rien de détestable. »'
  alternative: 'Constat général : « Tu ne manges rien de détestable. »'
  rationale: Dans ce passage législatif, לֹא suivi de l’inaccompli exprime une prohibition. La traduction garde cette force normative sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète la deuxième personne masculine singulière de l’hébreu, adressée collectivement à Israël. « Détestable » évite l’effet archaïque ou excessivement ecclésiastique d’« abominable », tout en conservant la forte réprobation du terme source.
