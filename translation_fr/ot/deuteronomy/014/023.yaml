source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: fr
  text: Tu mangeras devant Yahweh ton Dieu, au lieu qu’il choisira pour y faire demeurer son nom[a], la dîme de tes céréales, de ton vin nouveau et de ton huile, ainsi que les premiers-nés de ton gros et de ton petit bétail, afin que tu apprennes à craindre Yahweh ton Dieu tous les jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour que son nom y demeure » ou « pour y établir son nom ». L’hébreu emploie l’image du nom de Dieu demeurant dans le sanctuaire choisi.'
    reason: Alternative lexicale et préservation de l’expression théologique hébraïque.
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Tu mangeras
  rationale: Dans cette séquence législative, le parfait avec waw a une valeur prescriptive orientée vers l’avenir. Le futur français exprime naturellement cette instruction.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: devant Yahweh ton Dieu
  rationale: « Devant » conserve le sens spatial et cultuel de לִפְנֵי, c’est-à-dire en présence de Dieu, tout en restant concis.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: au lieu qu’il choisira
  rationale: Le futur maintient la perspective de la législation de Deutéronome et la formule du sanctuaire que Dieu choisira.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  rationale: Le causatif « faire demeurer » rend explicitement le hiphil de שכן et conserve l’image théologique hébraïque sans la réduire à une simple désignation du lieu.
- source_word: מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: la dîme de ton blé, de ton vin nouveau et de ton huile
  rationale: « Dîme » est le terme cultuel usuel; « blé » rend ici le produit céréalier dans un français courant; « vin nouveau » maintient la nuance de תירוש; « huile » conserve la formule agricole traditionnelle.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: ainsi que les premiers-nés de ton gros et de ton petit bétail
  rationale: Cette formulation distingue naturellement en français les bovins et les ovins/caprins visés par בקר et צאן.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: afin que tu apprennes à craindre
  rationale: « Afin que » exprime clairement le but, tandis que « craindre » préserve le vocabulaire biblique de la révérence et de l’obéissance envers Dieu.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Rend littéralement et naturellement l’idée d’une disposition durable, tout au long de la vie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération rend le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Formule du sanctuaire לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: pour y faire demeurer son nom
  alternative: pour y établir son nom
  rationale: Le choix retenu préserve à la fois la valeur causative du verbe et l’image de la présence du nom divin, sans identifier naïvement cette présence à un confinement de Dieu dans le sanctuaire.
- issue: Sens de לְיִרְאָה אֶת־יְהוָה
  choice: craindre Yahweh
  alternative: révérer Yahweh
  rationale: « Craindre » conserve la tension sémantique du terme hébreu, qui peut inclure révérence, fidélité et obéissance, sans en éliminer la force.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse individuelle hébraïque au membre du peuple. La syntaxe reste proche du texte source tout en évitant les tournures archaïques.
