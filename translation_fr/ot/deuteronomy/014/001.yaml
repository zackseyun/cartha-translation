  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: fr
  text: Vous êtes les fils de Yahweh, votre Dieu[a]. Ne vous faites pas d’entailles et ne vous rasez pas une zone du front[b] à cause d’un mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vous êtes les enfants de Yahweh, votre Dieu ». L’hébreu emploie le masculin pluriel et signifie littéralement « fils ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne vous faites pas de tonsure entre vos yeux », c’est-à-dire sur le front.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: fils
  rationale: Le nom hébreu est au masculin pluriel et signifie littéralement « fils ». Le français « fils » préserve cette forme dans l’affirmation de l’identité d’alliance, tandis qu’une note signale la portée collective possible.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: de Yahweh votre Dieu
  rationale: La préposition ל marque ici la relation ou l’appartenance. « de Yahweh votre Dieu » est naturel en français et maintient la formule d’alliance ainsi que le nom divin.
- source_word: תִתְגֹּדְדוּ
  choice: vous faites des entailles
  rationale: La forme réfléchie désigne le fait de se taillader soi-même, notamment lors de pratiques funéraires. « Se faire des entailles » est précis, courant et digne.
- source_word: קָרְחָה בֵּין עֵינֵיכֶם
  choice: vous rasez le front
  rationale: Littéralement, l’expression évoque le fait de produire une zone chauve « entre les yeux », c’est-à-dire sur le front. La formulation française rend naturellement l’acte concret; la note conserve l’image hébraïque.
- source_word: לָמֵת
  choice: en signe de deuil pour un mort
  rationale: La préposition indique que ces gestes sont accomplis à cause d’une personne décédée. L’explicitation minimale « en signe de deuil » rend en français la fonction implicite du rite sans modifier la portée de l’interdit.
theological_decisions:
- issue: Terme genré exprimant l’identité d’alliance
  choice: fils
  alternative: enfants
  rationale: « Fils » reproduit le masculin pluriel du texte source et préserve sa formulation. « Enfants » exprimerait plus directement la portée collective, mais neutraliserait la forme hébraïque; cette possibilité est donc donnée en note.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Degré d’explicitation du contexte funéraire
  choice: en signe de deuil pour un mort
  alternative: pour un mort
  rationale: Les deux gestes interdits sont des pratiques de deuil liées à un décès. L’explicitation rend la relation idiomatique en français sans attribuer au verset une motivation théologique supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu dans l’affirmation initiale, tandis que les interdictions sont formulées idiomatiquement. Le nom divin est translittéré « Yahweh ».
