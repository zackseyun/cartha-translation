  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: fr
  text: le cerf[a], la gazelle, le daim, la chèvre sauvage, le bouquetin, l’antilope et le mouflon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification de plusieurs animaux de ce verset est incertaine. Le « daim » pourrait être un autre cervidé; la « chèvre sauvage », un bouquetin; le « bouquetin », un addax; l’« antilope », un bœuf sauvage ou un aurochs; et le « mouflon », un chamois ou une chèvre de montagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: le cerf
  rationale: Désigne un cervidé, souvent le cerf. « Cerf » est naturel et courant en français; le terme peut ici représenter l’espèce sans imposer que seul le mâle soit visé.
- source_word: צְבִי
  choice: la gazelle
  rationale: L’identification comme gazelle est largement admise et fournit en français moderne un nom clair et précis.
- source_word: יַחְמוּר
  choice: le daim
  rationale: L’identification exacte du cervidé reste discutée; « daim » est une équivalence française traditionnelle et plausible, sans que la note masque l’incertitude.
- source_word: אַקּוֹ
  choice: la chèvre sauvage
  rationale: Le mot semble désigner un caprin sauvage, peut-être le bouquetin. Le terme descriptif « chèvre sauvage » demeure accessible et évite une précision zoologique excessive.
- source_word: דִישֹׁן
  choice: le bouquetin
  rationale: « Bouquetin » est une identification plausible d’un caprin sauvage, mais l’animal précis demeure incertain et pourrait être l’addax.
- source_word: תְאוֹ
  choice: l’antilope
  rationale: L’identification est incertaine. « Antilope » convient au contexte d’une liste de ruminants sauvages, tandis que les interprétations « bœuf sauvage » ou « aurochs » sont signalées en note.
- source_word: זָמֶר
  choice: le mouflon
  rationale: Le mot désigne vraisemblablement un animal de montagne. « Mouflon » est naturel et compréhensible en français, mais « chamois » ou « chèvre de montagne » restent possibles.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La série nominale conserve la concision de l’hébreu. Les noms usuels ont été privilégiés, et l’incertitude zoologique réelle est explicitement préservée dans une note unique.
