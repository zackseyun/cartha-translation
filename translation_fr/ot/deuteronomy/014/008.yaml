  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: fr
  text: Quant au porc, parce qu’il a le sabot fendu mais ne rumine pas, il est impur pour vous. Vous ne mangerez pas de la chair de ces animaux et vous ne toucherez pas leurs cadavres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: le porc
  rationale: « Porc » est le terme courant, précis et digne en français moderne pour désigner cet animal.
- source_word: מַפְרִיס פַּרְסָה
  choice: a le sabot fendu
  rationale: Cette expression naturelle en français rend le critère zoologique du sabot divisé.
- source_word: וְלֹא גֵרָה
  choice: mais ne rumine pas
  rationale: Dans ce contexte alimentaire, « ruminer » exprime clairement et sans lourdeur l’idée de faire remonter et mâcher le bol alimentaire.
- source_word: טָמֵא
  choice: impur
  rationale: « Impur » conserve la catégorie juridique et cultuelle de la Torah sans suggérer que l’animal serait moralement mauvais.
- source_word: מִבְּשָׂרָם
  choice: de sa chair
  rationale: « Chair » reste proche du terme hébreu. Le singulier français reprend naturellement « le porc », tandis qu’une note signale les suffixes pluriels du texte source.
- source_word: נִבְלָתָם
  choice: son cadavre
  rationale: « Cadavre » désigne précisément le corps mort de l’animal. Le singulier assure une référence française naturelle au porc mentionné, avec conservation de la donnée morphologique en note.
- source_word: תִגָּעוּ
  choice: toucherez
  rationale: Le verbe direct « toucher » conserve sans l’élargir la force de l’interdiction hébraïque.
theological_decisions:
- issue: Nature de l’impureté dans la législation alimentaire de la Torah
  choice: Rendre טָמֵא par « impur » sans ajouter d’explication doctrinale dans le texte.
  alternative: « rituellement impur » ou « souillé »
  rationale: Le verset énonce un statut prescrit à Israël. « Impur » préserve cette catégorie tout en évitant d’imposer une interprétation morale ou systématique.
- issue: Portée de l’interdiction de toucher le cadavre
  choice: 'Conserver une interdiction directe : « vous ne toucherez pas ».'
  alternative: « vous ne manipulerez pas » ou « vous ne vous en approcherez pas »
  rationale: נגע signifie directement « toucher » ; les autres formulations restreindraient ou élargiraient indûment le commandement.
- issue: Suffixes pluriels après le nom singulier « porc »
  choice: Employer des possessifs singuliers dans le texte français et signaler le pluriel hébreu en note.
  alternative: « leur chair » et « leurs cadavres »
  rationale: L’hébreu passe du représentant singulier à une référence plurielle ou collective. Le français exige ici une reprise plus naturelle ; la note préserve l’information et l’ambiguïté de nombre.
translation_notes:
  register: Français international moderne, sobre et juridique. La syntaxe reste proche de l’hébreu tout en évitant une discordance de nombre peu naturelle en français. « Comme » marque la cause, et « quant au porc » reflète la reprise coordonnée du texte hébreu dans un verset présenté isolément.
