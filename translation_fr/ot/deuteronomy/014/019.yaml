source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף טָמֵ֥א ה֖וּא לָ/כֶ֑ם לֹ֖א יֵאָכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: fr
  text: Toutes les petites bêtes ailées qui pullulent sont impures pour vous[a] ; elles ne seront pas mangées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les petites bêtes qui volent » ou « toutes les créatures pullulantes ailées ». L’expression hébraïque associe שֶׁרֶץ (« petite bête qui pullule ») à עוֹף (« créature volante, oiseau ») et désigne vraisemblablement surtout les insectes volants plutôt que les oiseaux au sens habituel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Toutes les
  rationale: La conjonction relie cette interdiction aux prescriptions précédentes, et כֹל exprime ici la totalité de la catégorie. Le pluriel français permet une formulation naturelle tout en conservant la portée exhaustive.
- source_word: שֶׁרֶץ
  choice: petites bêtes… qui pullulent
  rationale: שֶׁרֶץ désigne de petites créatures caractérisées par leur foisonnement ou leur déplacement en multitude. « Pullulent » restitue cette nuance sans suggérer exclusivement des animaux qui rampent.
- source_word: הָ/עוֹף
  choice: ailées
  rationale: עוֹף peut désigner l’oiseau ou, plus largement, une créature volante. Avec שֶׁרֶץ, l’expression vise vraisemblablement surtout les petites créatures volantes, notamment les insectes, sans que le français doive réduire explicitement la catégorie aux seuls insectes.
- source_word: טָמֵא
  choice: impures
  rationale: « Impures » exprime la catégorie rituelle et alimentaire du texte, plutôt qu’une saleté matérielle.
- source_word: הוּא
  choice: sont
  rationale: Le pronom hébreu reprend et souligne le sujet collectif. En français, la copule suffit ; le pluriel s’accorde avec la formulation naturelle « toutes les petites bêtes ».
- source_word: לָ/כֶם
  choice: pour vous
  rationale: Cette expression maintient l’orientation de la règle vers les destinataires israélites et leur situation d’alliance.
- source_word: לֹא יֵאָכֵלוּ
  choice: elles ne seront pas mangées
  rationale: Le passif conserve la forme niphal de l’hébreu, et le pluriel rend explicitement le verbe hébreu à la troisième personne du pluriel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Petites bêtes » reste accessible sans imposer le terme plus étroit « insectes » ; « ailées qui pullulent » conserve les deux composantes de l’expression hébraïque. Le pluriel français assure un accord naturel et permet de préserver le passif pluriel final.
