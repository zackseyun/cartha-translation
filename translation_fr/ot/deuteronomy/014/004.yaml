translation:
  language: fr
  text: 'Voici les animaux[a] que vous pouvez manger : le bœuf, le mouton et la chèvre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Voici l’animal que vous pouvez manger » ; le singulier introduit ici une catégorie collective avant l’énumération.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Voici les animaux
  rationale: Le démonstratif et le nom sont formellement au singulier, mais introduisent collectivement la liste des animaux permis. Le pluriel est naturel en français tout en gardant cette valeur collective, signalée en note.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: que vous pouvez manger
  rationale: Dans ce contexte légal, la proposition désigne les animaux dont la consommation est permise ; « pouvez » évite de présenter leur consommation comme une obligation.
- source_word: שׁוֹר
  choice: le bœuf
  rationale: Le terme désigne ici un bovin comme catégorie. « Bœuf » est le terme traditionnel et courant dans une liste alimentaire, sans imposer le sens plus étroit de « taureau ».
- source_word: שֵׂה כְשָׂבִים
  choice: le mouton
  rationale: שֵׂה désigne une bête du petit bétail, ici précisée comme appartenant aux ovins. « Mouton » exprime la catégorie sans introduire une indication d’âge comme le ferait « agneau ».
- source_word: וְשֵׂה עִזִּים
  choice: et la chèvre
  rationale: La construction parallèle désigne une bête du petit bétail appartenant aux caprins. « Chèvre » rend naturellement la catégorie sans préciser indûment l’âge.
