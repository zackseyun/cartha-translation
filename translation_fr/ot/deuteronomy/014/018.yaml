  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: fr
  text: la cigogne[a], le héron[b], selon ses espèces, la huppe[c] et la chauve-souris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le héron » ; l’identification exacte de plusieurs oiseaux de ce verset est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’ibis » ou « le pluvier » pour « le héron ».
    reason: lexical_alternative
  - marker: c
    text: Certaines traductions anciennes ont « le vanneau » ; le terme hébreu désigne plus probablement la huppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: la cigogne
  rationale: « Cigogne » est l’identification traditionnelle et la plus largement admise, tout en laissant en note l’incertitude zoologique de plusieurs noms d’oiseaux de cette liste.
- source_word: הָאֲנָפָה
  choice: le héron
  rationale: L’identification exacte est incertaine. « Héron » est une désignation conventionnelle plausible d’un échassier et convient à la catégorie élargie par la formule qui suit.
- source_word: לְמִינָהּ
  choice: selon ses espèces
  rationale: La formule désigne les diverses espèces appartenant à la catégorie mentionnée. Le pluriel idiomatique français évite de suggérer qu’un individu possède une seule « espèce ».
- source_word: הַדּוּכִיפַת
  choice: la huppe
  rationale: La recherche moderne identifie généralement ce terme rare à la huppe, plutôt qu’au vanneau retenu par certaines traditions anciennes.
- source_word: הָעֲטַלֵּף
  choice: la chauve-souris
  rationale: Le terme hébreu désigne clairement la chauve-souris. Le classement ancien parmi les créatures volantes est conservé sans imposer la taxonomie moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure énumérative de l’hébreu est préservée, tandis que « selon ses espèces » rend la formule classificatoire de façon idiomatique. Les incertitudes zoologiques réelles sont signalées en notes sans alourdir le texte.
