  to: Vous ne mangerez aucun animal mort[a]. Vous pourrez le donner au résident étranger[b] qui vit dans vos villes[c], et il pourra le manger ; ou bien vous pourrez le vendre à un étranger. Car vous êtes un peuple saint pour Yahweh, votre Dieu. Vous ne ferez pas bouillir un chevreau dans le lait de sa mère.
