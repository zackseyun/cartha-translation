base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: fr
  text: Vous ne mangerez aucun animal mort[a]. Vous pourrez le donner au résident étranger[b] qui vit dans vos villes[c], et il pourra le manger ; ou bien vous pourrez le vendre à un étranger. Car vous êtes un peuple saint pour Yahweh, votre Dieu. Vous ne ferez pas bouillir un chevreau dans le lait de sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun animal mort de lui-même ». Le mot hébreu désigne le cadavre d’un animal qui n’a pas été abattu de la manière autorisée.'
    reason: lexical_alternative
  - marker: b
    text: Le « résident étranger » traduit ici un terme désignant un étranger établi parmi les Israélites ; il se distingue de l’« étranger » mentionné ensuite, qui n’a pas le même statut de résidence.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « qui est dans tes portes », expression hébraïque désignant les personnes vivant dans les villes ou les communautés d’Israël. On peut aussi rendre les verbes plus formellement : « vous le donnerez… et il le mangera ; ou vous le vendrez à un étranger ».'
    reason: cultural_note
lexical_decisions:
- source_word: נְבֵלָה
  choice: bête trouvée morte
  rationale: Le terme désigne ici le cadavre d’un animal qui n’a pas été abattu de la manière autorisée. Cette formulation naturelle en français exprime mieux la catégorie alimentaire que le seul mot « cadavre ».
- source_word: גֵּר
  choice: immigré
  rationale: Désigne un non-Israélite établi durablement au sein de la communauté, avec un statut distinct de celui du נָכְרִי. « Immigré » est actuel et compréhensible, tandis qu’une note précise le statut ancien.
- source_word: בִּשְׁעָרֶיךָ
  choice: qui vit dans vos villes
  rationale: Littéralement « dans tes portes » ; les portes représentent ici les villes et leur communauté. Le sens idiomatique est rendu directement en français moderne.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: vous pourrez la donner… et il pourra la manger
  rationale: Dans ce contexte juridique, les formes expriment une possibilité autorisée plutôt qu’une obligation de donner la bête morte.
- source_word: נָכְרִי
  choice: étranger
  rationale: Le mot désigne un étranger extérieur à la communauté et se distingue du גֵּר qui y réside.
- source_word: עַם קָדוֹשׁ
  choice: un peuple saint
  rationale: Formule d’alliance indiquant un peuple consacré et appartenant à Dieu ; « saint » conserve sa portée théologique.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition marque l’appartenance ou la consécration, et le nom divin יהוה est transcrit « Yahweh ».
- source_word: גְּדִי
  choice: chevreau
  rationale: « Chevreau » désigne clairement en français moderne le petit de la chèvre et convient au registre digne du texte.
- source_word: תְבַשֵּׁל
  choice: ferez cuire
  rationale: Le verbe peut désigner la cuisson, notamment par ébullition. « Faire cuire dans le lait » est idiomatique en français tout en conservant l’image concrète.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: dans le lait de sa mère
  rationale: Rendu direct et naturel qui préserve sans interprétation la formulation concrète de l’interdit.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom personnel de l’alliance.
- issue: Valeur des verbes juridiques concernant le don et la vente
  choice: 'formulation permissive : « pourrez »'
  alternative: 'formulation prescriptive : « donnerez… vendrez »'
  rationale: Le contraste porte sur l’interdiction faite aux Israélites d’en manger et sur les modes de disposition permis. La formulation permissive évite d’ajouter une obligation, tout en signalant l’autre lecture en note.
- issue: Portée de l’interdit concernant le chevreau
  choice: conserver l’interdit concret sans en préciser la raison
  alternative: l’expliquer comme interdiction rituelle, culinaire ou symbolique
  rationale: Le verset ne donne aucun motif explicite ; la traduction maintient donc la tension et n’importe aucune interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « vous » reproduit l’adresse collective à Israël. Le texte distingue « immigré » et « étranger », rend l’idiome des portes par son sens, et conserve sans explication ajoutée l’interdit final.
