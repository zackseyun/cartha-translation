translation:
  language: fr
  text: le milan royal[a], le faucon et le milan, selon son espèce ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de ces oiseaux est incertaine. Les traductions anciennes et modernes varient notamment entre « milan royal », « milan » et « faucon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: le milan royal
  rationale: L’identification zoologique reste incertaine, mais ce terme est souvent compris comme désignant un milan, parfois plus précisément le milan royal. La note conserve l’incertitude.
- source_word: הָאַיָּה
  choice: le faucon
  rationale: Ce nom désigne un rapace dont l’identification exacte est discutée. « Faucon » permet de le distinguer des deux termes voisins rendus par des noms de milans.
- source_word: הַדַּיָּה
  choice: le milan
  rationale: Ce nom de rapace est fréquemment rendu par « milan », bien que son identification puisse recouper celle du terme précédent dans certaines traditions.
- source_word: לְמִינָהּ
  choice: selon son espèce
  rationale: Cette formule classificatoire, courante dans les textes de création et les listes alimentaires, est rendue de manière naturelle tout en restant proche de l’hébreu.
- source_word: וְאֶת / וְ
  choice: et
  rationale: Les conjonctions coordonnent les éléments de la liste ; les marqueurs d’objet direct ne se traduisent pas séparément en français.
