  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: fr
  text: À la fin de chaque période de trois ans[a], tu sortiras toute la dîme de toute ta récolte de cette année-là et tu la déposeras dans tes villes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chaque troisième année ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « dans tes portes » ; cette expression désigne les villes ou localités relevant de la communauté.'
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Au terme de chaque période de trois ans
  rationale: מִקְצֵה marque l’aboutissement d’une durée, et le contexte indique une prescription triennale récurrente. Cette formulation conserve à la fois l’idée de terme et celle de répétition.
- source_word: תּוֹצִיא
  choice: tu sortiras
  rationale: Le hifil de יצא signifie littéralement « faire sortir ». « Tu sortiras » en garde le caractère concret sans préciser indûment le lieu d’où la dîme est retirée.
- source_word: כָּל מַעְשַׂר
  choice: toute la dîme
  rationale: כָּל souligne que la totalité de la dîme exigée est concernée. « Dîme » est le terme français courant pour le dixième prescrit.
- source_word: תְּבוּאָתְךָ
  choice: des produits
  rationale: תְּבוּאָה désigne le produit ou rendement agricole. « Produits » demeure assez large pour ne pas limiter le sens aux seules céréales.
- source_word: בַּשָּׁנָה הַהִוא
  choice: de cette année-là
  rationale: Dans la syntaxe française, cette tournure rattache naturellement les produits et leur dîme à l’année triennale visée.
- source_word: וְהִנַּחְתָּ
  choice: et tu la déposeras
  rationale: Le hifil de נוח exprime ici l’action de placer ou de laisser en dépôt. « Déposeras » convient au contexte sans ajouter l’idée explicite d’un entreposage prolongé.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Littéralement « dans tes portes », l’expression désigne par métonymie les villes ou localités relevant de la communauté. La traduction idiomatique évite en français une image susceptible d’être comprise comme un simple portail.
