lexical_decisions:
- source_word: כָּל
  choice: tout
  rationale: Le quantificateur étend la permission à chaque membre de la catégorie définie. Dans « tout oiseau pur », le singulier générique est naturel en français et conserve la portée générale de l’hébreu.
- source_word: עוֹף
  choice: oiseau
  rationale: Bien que le terme puisse désigner plus largement une créature volante, le contexte alimentaire immédiat porte sur les oiseaux; « oiseau » est ici le terme courant et précis.
- source_word: טָהוֹר
  choice: pur
  rationale: Dans la législation alimentaire, le mot désigne la catégorie rituelle de ce qui est autorisé. « Pur » est le terme français biblique usuel en opposition à « impur », sans suggérer ici une simple propreté physique.
- source_word: תֹּאכֵלוּ
  choice: vous pouvez manger
  rationale: Dans ce contexte juridique opposant aliments permis et interdits, l’imparfait hébreu exprime une permission. Cette formulation la rend clairement et naturellement en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe française place naturellement la permission avant son objet tout en préservant la portée exhaustive de l’hébreu.
