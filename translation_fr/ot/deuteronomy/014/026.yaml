reference: Deuteronomy 14:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: fr
  text: 'Tu dépenseras cet argent[a] pour tout ce dont tu auras envie : du gros bétail, du petit bétail, du vin, des boissons enivrantes[c], ou tout ce que tu désireras[b]. Tu mangeras là, devant Yahvé ton Dieu, et tu te réjouiras, toi et ta maisonnée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’argent », c’est-à-dire ici la monnaie.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout ce que ton âme désirera ». Ici, « âme » désigne la personne comme siège de l’envie ou de l’appétit.'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de boissons alcoolisées autres que le vin, probablement produites par fermentation, et non nécessairement d’alcools distillés.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: Tu dépenseras cet argent
  rationale: Dans ce contexte commercial, « donner l’argent » signifie l’employer pour acquérir les provisions de la fête. « Cet argent » est naturel en français tout en renvoyant à l’argent mentionné au verset précédent.
- source_word: תְּאַוֶּה נַפְשְׁךָ
  choice: tout ce dont tu auras envie
  rationale: נֶפֶשׁ désigne ici la personne comme siège du désir, dans un contexte de nourriture et de boisson. Cette formulation française rend naturellement le désir sans imposer une lecture dualiste du mot « âme ».
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: du gros bétail, du petit bétail
  rationale: בָּקָר désigne collectivement les bovins, tandis que צֹאן englobe normalement les ovins et les caprins. Les termes collectifs français préservent cette portée mieux que « bœufs et moutons ».
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: du vin, des boissons enivrantes
  rationale: יַיִן est le vin; שֵׁכָר désigne une boisson alcoolisée distincte du vin. « Boissons enivrantes » évite l’anachronisme possible de « boissons fortes », souvent compris aujourd’hui comme des alcools distillés.
- source_word: וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: ou tout ce que tu désireras
  rationale: La formulation garde l’élargissement récapitulatif de l’hébreu. Le français naturel exprime ici la demande de la נֶפֶשׁ par le désir, tandis qu’une note signale l’image littérale.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: devant Yahvé ton Dieu
  rationale: « Devant » conserve la formule cultuelle concise, et « Yahvé » est la forme française courante du nom divin יהוה.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: et tu te réjouiras, toi et ta maisonnée
  rationale: « Te réjouir » conserve la tonalité festive. « Maisonnée » rend בַּיִת au sens collectif des membres du foyer, plus large que le bâtiment lui-même.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. La forme française « Yahvé » le conserve au lieu de le remplacer par un titre.
- issue: Mention explicite des boissons alcoolisées
  choice: du vin, des boissons enivrantes
  alternative: du vin et d’autres boissons
  rationale: Le texte nomme explicitement le vin et une autre catégorie de boisson enivrante; la traduction ne doit ni atténuer ni moraliser cette donnée.
- issue: Sens anthropologique de נֶפֶשׁ
  choice: envie / désir, avec note littérale
  alternative: âme
  rationale: Dans ce contexte, נֶפֶשׁ est la personne désirante plutôt qu’une composante immatérielle définie. La traduction courante garde le sens contextuel et la note préserve l’image hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque à l’Israélite individuel. Les termes « gros bétail » et « petit bétail » gardent les catégories collectives du texte; « maisonnée » inclut l’ensemble du foyer.
