  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: fr
  text: 'Voici ce que vous pourrez manger parmi tout ce qui vit dans l’eau : vous pourrez manger tout ce qui a des nageoires et des écailles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת זֶה
  choice: Voici ce que
  rationale: Rend naturellement la formule introductive hébraïque tout en conservant son caractère démonstratif.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: parmi tout ce qui vit dans l’eau
  rationale: « Parmi » exprime la sélection au sein de l’ensemble aquatique; « vit » est explicité pour obtenir un français idiomatique sans modifier la catégorie visée.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: des nageoires et des écailles
  rationale: Équivalents zoologiques français courants et précis.
- source_word: תֹּאכְלוּ / תֹּאכֵלוּ
  choice: vous pourrez manger
  rationale: Dans ce contexte légal, l’imparfait hébreu exprime la permission alimentaire plutôt qu’un simple futur.
theological_decisions:
- issue: Portée de la règle alimentaire
  choice: Formuler une permission limitée aux êtres aquatiques ayant à la fois nageoires et écailles
  alternative: Présenter la phrase comme un commandement de manger ces êtres
  rationale: Le contexte distingue le permis de l’interdit; il ne commande pas leur consommation.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « vous pourrez manger » conserve l’insistance juridique de l’hébreu sans lourdeur excessive.
