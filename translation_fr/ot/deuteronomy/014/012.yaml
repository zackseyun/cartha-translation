  text: וְ/זֶ֕ה אֲשֶׁ֥ר לֹֽא תֹאכְל֖וּ מֵ/הֶ֑ם הַ/נֶּ֥שֶׁר וְ/הַ/פֶּ֖רֶס וְ/הָֽ/עָזְנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: fr
  text: 'Voici ceux d’entre eux que vous ne mangerez pas : l’aigle[a], le gypaète barbu et le vautour noir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification des noms hébreux d’oiseaux dans ce verset est incertaine. L’« aigle » pourrait désigner un grand vautour ; le « gypaète barbu » a été traditionnellement rendu par « ossifrage » ; et certains traduisent « vautour noir » par « balbuzard » ou « aigle de mer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Voici ceux
  rationale: Le démonstratif est singulier en hébreu, mais il introduit idiomatiquement une énumération de plusieurs oiseaux ; « Voici ceux » est naturel en français et conserve cette fonction présentative.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: que vous ne mangerez pas parmi eux
  rationale: Cette formulation garde la prohibition au futur normatif et rend la valeur partitive de מִן, qui renvoie à l’ensemble des oiseaux mentionné dans le contexte.
- source_word: הַנֶּשֶׁר
  choice: l’aigle
  rationale: « Aigle » est la désignation française traditionnelle et courante, même si le mot hébreu peut désigner un grand rapace, peut-être un vautour.
- source_word: הַפֶּרֶס
  choice: le gypaète barbu
  rationale: Cette identification moderne correspond au grand rapace charognard aussi appelé anciennement « orfraie » dans certaines traditions ; elle est précise et compréhensible.
- source_word: הָעָזְנִיָּה
  choice: le vautour noir
  rationale: Cette identification est retenue dans plusieurs travaux modernes, mais demeure incertaine ; les autres possibilités sont signalées en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur « vous ne mangerez pas » conserve la forme juridique traditionnelle sans archaïsme marqué. Les noms d’espèces sont modernes, tandis que la note préserve l’incertitude zoologique du texte hébreu.
