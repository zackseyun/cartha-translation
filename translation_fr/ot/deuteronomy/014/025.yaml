  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: fr
  text: alors tu l’échangeras contre de l’argent[a], tu envelopperas l’argent dans ta main[b] et tu iras au lieu que Yahweh, ton Dieu, choisira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu le convertiras en argent ». Le mot hébreu désigne littéralement l’argent métal, utilisé ici comme moyen de paiement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu lieras l’argent dans ta main », c’est-à-dire que tu le garderas en sûreté pour le voyage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: tu l’échangeras contre de l’argent
  rationale: Dans ce contexte, נָתַן avec בְּ et כֶּסֶף exprime la conversion du produit de la dîme en argent. « Échanger contre de l’argent » est naturel en français et rend clairement l’opération, tandis que la note rappelle que le terme hébreu désigne littéralement l’argent métal.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: tu serreras l’argent dans ta main
  rationale: צָרַר peut signifier lier, envelopper ou serrer. Cette formulation conserve l’image concrète de l’argent tenu et mis en sûreté pour le voyage sans imposer une manière précise de l’emballer.
- source_word: בְּיָדְךָ
  choice: dans ta main
  rationale: La traduction conserve l’expression concrète de l’hébreu, qui peut aussi évoquer la possession ou la garde.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: et tu iras au lieu
  rationale: הלך est le verbe courant pour aller. Le futur convient à la formulation de cette instruction légale.
- source_word: אֲשֶׁר יִבְחַר
  choice: que … choisira
  rationale: L’imparfait hébreu a ici une valeur future naturelle dans la formule deutéronomique concernant le lieu choisi par Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rendu français direct de la désignation d’alliance אֱלֹהֶיךָ.
theological_decisions:
- issue: Traduction du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes hébraïques de deuxième personne du singulier. « Argent » rend naturellement כֶּסֶף tout en laissant la note préciser son sens concret d’argent métal.
