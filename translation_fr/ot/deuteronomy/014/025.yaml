  source_fidelity: La première proposition rend correctement l’échange des produits contre de l’argent (כֶּסֶף), et la destination ainsi que le futur de « choisira » correspondent au texte hébreu. Pour וְצַרְתָּ… בְּיָדְךָ, « serreras l’argent dans ta main » est trop susceptible d’évoquer le fait de tenir des pièces dans la main, alors que le verbe exprime plus précisément l’action de lier ou d’envelopper afin de sécuriser l’argent. La formulation révisée conserve cette image sans ajouter de détail matériel non exprimé.
  naturalness: Le français est globalement clair et de registre approprié. « Tu envelopperas l’argent dans ta main » demeure assez littéral, mais il est intelligible dans une instruction solennelle et est soutenu par une note qui explicite la finalité pratique. « Tu serreras l’argent » est moins précis dans le français moderne.
  terminology: « Argent » est le choix naturel pour כֶּסֶף dans ce contexte monétaire, tandis que la note maintient utilement la référence littérale à l’argent métal. « Yahweh, ton Dieu » rend fidèlement le nom divin et la désignation d’alliance. Aucun enjeu théologique supplémentaire n’est en cause.
