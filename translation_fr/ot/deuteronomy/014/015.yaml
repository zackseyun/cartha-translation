  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
translation:
  language: fr
  text: l’autruche[a], l’autour, la mouette et le faucon[b], selon son espèce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « la fille de l’autruche », expression employée ici comme nom d’espèce.
    reason: cultural_note
  - marker: b
    text: L’identification de plusieurs oiseaux de ce verset est incertaine. Le mot rendu par « autour » peut aussi désigner un hibou ou un autre oiseau ; celui rendu par « mouette » a parfois été traduit par « coucou » ; et « faucon » peut aussi se traduire par « épervier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: l’autruche
  rationale: L’expression hébraïque signifie littéralement « fille de la ya‘anah », mais elle fonctionne ici comme un nom d’espèce. « Autruche » rend naturellement l’identification la plus probable d’un oiseau du désert.
- source_word: הַתַּחְמָס
  choice: l’autour
  rationale: L’identification précise demeure incertaine. « Autour » exprime de façon actuelle l’hypothèse d’un rapace de type hawk, tout en le distinguant du נֵץ mentionné ensuite.
- source_word: הַשָּׁחַף
  choice: la mouette
  rationale: Les données lexicographiques modernes orientent vers une mouette ou un oiseau marin apparenté, bien que l’identification ne soit pas certaine.
- source_word: הַנֵּץ
  choice: le faucon
  rationale: Le mot désigne vraisemblablement un rapace et peut être rendu par « faucon » ou « épervier ». « Faucon » le distingue ici de תַּחְמָס.
- source_word: לְמִינֵהוּ
  choice: selon son espèce
  rationale: Cette formule classificatoire hébraïque indique l’espèce concernée avec ses différentes variétés. La formulation retenue reste proche de l’hébreu tout en étant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’article défini est répété conformément au rythme de l’énumération hébraïque. Les identifications zoologiques probables sont données dans le texte, tandis que leur incertitude réelle est explicitement conservée en note.
