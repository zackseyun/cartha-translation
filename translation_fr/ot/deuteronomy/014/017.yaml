lexical_decisions:
- source_word: הַקָּאָת
  choice: le pélican
  rationale: L’identification de cet oiseau reste incertaine. « Pélican » est une traduction traditionnelle et largement répandue dans les listes parallèles, tout en nécessitant une note signalant les autres possibilités.
- source_word: הָרָחָמָה
  choice: le vautour percnoptère
  rationale: Le terme désigne vraisemblablement un rapace charognard. « Vautour percnoptère » est une identification courante en français biblique et zoologique, mais elle demeure incertaine.
- source_word: הַשָּׁלָךְ
  choice: le cormoran
  rationale: « Cormoran » est une traduction moderne courante qui convient à un oiseau aquatique pêcheur; l’espèce exacte visée par l’hébreu est toutefois discutée.
- source_word: וְ / וְאֶת
  choice: et / marqueur d’objet non traduit
  rationale: La conjonction וְ est rendue par « et ». Le marqueur hébreu de l’objet direct אֵת n’a pas d’équivalent lexical en français.
