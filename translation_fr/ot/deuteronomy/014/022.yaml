revisions:
- from: Tu prélèveras avec soin la dîme de tout le produit de ce que tu as semé, de ce qui sort du champ[a], année après année.
  to: Tu veilleras à prélever la dîme de tout le produit de tes semailles, que le champ donne[a], année après année.
  rationale: La révision remplace une expression qui ajoutait l’idée de soin par une formulation française qui restitue l’insistance du commandement. Elle rend aussi plus clairement le produit issu des semailles et du champ, tout en réservant en note l’image littérale de l’hébreu.
