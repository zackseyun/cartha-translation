  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: fr
  text: Tu veilleras à prélever la dîme de tout le produit de tes semailles, que le champ donne[a], année après année.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « qui sort du champ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: Tu prélèveras avec soin la dîme
  rationale: L’infinitif absolu suivi du verbe conjugué renforce le commandement. « avec soin » exprime cette insistance en français naturel, tandis que « prélever la dîme » rend clairement l’action prescrite.
- source_word: תְּבוּאַת
  choice: produit
  rationale: Le nom désigne globalement le produit ou le rendement agricole. « produit » conserve cette ampleur sans le limiter à une céréale particulière.
- source_word: זַרְעֶךָ
  choice: ce que tu as semé
  rationale: Le sens littéral est « ta semence », mais, dans ce contexte, il s’agit de ce qui a été semé et de sa production. « ce que tu as semé » préserve l’image agricole tout en évitant l’ambiguïté moderne de « semence ».
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: de ce qui sort du champ
  rationale: Cette formulation suit de près l’expression hébraïque et reste compréhensible. La note donne une formulation française plus dynamique.
- source_word: שָׁנָה שָׁנָה
  choice: année après année
  rationale: La répétition hébraïque marque la régularité annuelle. « année après année » en restitue naturellement la valeur distributive et continue.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond à l’adresse hébraïque au peuple envisagé collectivement. La formulation conserve l’image de ce qui « sort du champ », avec une variante plus idiomatique en note.
