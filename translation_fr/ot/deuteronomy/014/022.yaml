review_pass:
  verdict: revise
  source_fidelity: 'La tournure « avec soin » ne rend pas exactement l’intensification de l’infinitif absolu : elle introduit l’idée de soin dans l’exécution plutôt que l’insistance de l’obligation. De plus, « le produit de ce que tu as semé, de ce qui sort du champ » juxtapose de façon maladroite deux compléments qui correspondent dans l’hébreu à une seule désignation du produit agricole. La révision rend la relation syntaxique et le sens agricole sans surinterpréter le mot « semence ».'
  naturalness: « Tu veilleras à prélever la dîme » est naturel dans un registre moderne digne et exprime l’insistance injonctive sans le faux sens de « avec soin ». « Que le champ donne » est une expression française idiomatique; la note conserve l’image plus littérale de ce qui « sort du champ ».
  terminology: « Dîme », « produit » et « semailles » conviennent au contexte. « Semailles » rend ici la valeur agricole de זַרְעֶךָ sans suggérer indûment une catégorie de culture particulière.
  issues:
  - severity: medium
    issue: « avec soin » pour l’intensif verbal
    rationale: L’hébreu intensifie le commandement (« tu devras assurément / tu veilleras à »), non la minutie ou le soin apporté au prélèvement.
  - severity: medium
    issue: Construction redondante de « produit de ce que tu as semé, de ce qui sort du champ »
    rationale: Elle obscurcit le lien entre « produit de ta semence » et « qui sort du champ ». Une relative rattachée au produit reflète mieux la syntaxe et produit un français plus clair.
  revised_text: Tu veilleras à prélever la dîme de tout le produit de tes semailles, que le champ donne[a], année après année.
  revised_footnotes:
  - marker: a
    text: 'Litt. : « qui sort du champ ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace une expression qui ajoutait l’idée de soin par une formulation française qui restitue l’insistance du commandement. Elle rend aussi plus clairement le produit issu des semailles et du champ, tout en réservant en note l’image littérale de l’hébreu.
