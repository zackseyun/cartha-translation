  text: וְ/כָל בְּהֵמָ֞ה מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ שְׁתֵּ֣י פְרָס֔וֹת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: fr
  text: Vous pourrez manger tout animal dont le sabot est fendu et entièrement divisé en deux, et qui rumine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: tout animal
  rationale: Dans cette règle de permission, « tout animal qui… » exprime naturellement la portée distributive de וְכָל et rend בְּהֵמָה par le terme moderne et général « animal ».
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: qui a le sabot fendu
  rationale: Cette formulation française idiomatique conserve le critère zoologique concret exprimé par le participe hébreu.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: entièrement divisé en deux
  rationale: L’expression précise et renforce l’idée d’un sabot réellement séparé en deux parties. « Entièrement » traduit la force de la construction sans reproduire maladroitement la répétition hébraïque.
- source_word: מַעֲלַת גֵּרָה
  choice: qui rumine
  rationale: « Ruminer » est l’équivalent français courant et précis de l’idiome hébreu signifiant littéralement « faire remonter la nourriture ruminée ».
- source_word: בַּבְּהֵמָה
  choice: non exprimé séparément
  rationale: Le syntagme « parmi les animaux » est déjà contenu dans « tout animal qui… » ; sa répétition explicite alourdirait inutilement le français sans modifier le sens.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: Vous pourrez manger
  rationale: Dans ce contexte législatif, l’imparfait hébreu énonce une permission alimentaire plutôt qu’un ordre de consommer. Le pronom objet féminin est naturellement repris par « tout animal qui… ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde les deux éléments descriptifs du sabot tout en évitant une répétition peu naturelle, et emploie le terme zoologique courant « ruminer ».
