  source_fidelity: La liste des bénéficiaires et la finalité de la bénédiction sont bien rendues. Une révision légère améliore la coordination de la liste, afin que le Lévite, l’étranger résident, l’orphelin et la veuve soient clairement tous les sujets de « viendront » et de « mangeront ». « Tout ce que tu feras de tes mains » rend plus directement l’expression hébraïque « toute l’œuvre de ta main que tu feras », sans calquer une tournure lourde.
  naturalness: Le texte révisé est plus fluide en français moderne et évite que « ainsi que » ne relègue les trois autres catégories au rang de simple ajout. « Dans tes villes » est une explicitation naturelle et la note conserve l’idiome des « portes ».
  terminology: « Lévite », « étranger résident », « orphelin », « veuve » et « Yahweh » sont appropriés. La note remplace « immigré », terme moderne à connotations administratives qui ne recouvre pas exactement le statut social exprimé par גֵּר.
