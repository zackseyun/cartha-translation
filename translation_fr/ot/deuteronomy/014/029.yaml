source:
  edition: WLC
  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: fr
  text: Le Lévite viendra — puisqu’il n’a ni part ni héritage avec toi —, ainsi que l’étranger résident[a], l’orphelin et la veuve qui vivent dans tes villes[b] ; ils mangeront et seront rassasiés, afin que Yahweh, ton Dieu, te bénisse dans tout ce que tu feras de tes mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résident étranger ». Le terme hébreu désigne un non-Israélite établi parmi les Israélites.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans tes portes », expression qui désigne les villes ou la communauté locale.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: viendra
  rationale: Le parfait qal précédé de la conjonction prend ici, dans cette instruction légale, une valeur prospective. Le futur français exprime naturellement l’action attendue.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: Le terme désigne le membre de la tribu ou de la catégorie sociale des Lévites, sans préciser qu’il s’agit d’un prêtre.
- source_word: חֵלֶק וְנַחֲלָה
  choice: part ni héritage
  rationale: La paire évoque à la fois une part attribuée et un patrimoine foncier. La négation française « ni… ni… » rend naturellement leur coordination dans cette proposition négative.
- source_word: הַגֵּר
  choice: l’étranger résident
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté, et non un étranger simplement de passage. « Étranger résident » conserve ces deux dimensions.
- source_word: הַיָּתוֹם
  choice: l’orphelin
  rationale: Dans ce contexte juridique, le terme désigne l’enfant privé de protection paternelle. « Orphelin » est l’appellation française courante de cette catégorie vulnérable.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: qui vivent dans tes villes
  rationale: L’expression littérale « dans tes portes » emploie les portes par métonymie pour les villes ou communautés locales. La traduction dynamique évite une formulation française trompeuse tout en conservant l’image en note.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: ils mangeront et seront rassasiés
  rationale: 'Les verbes décrivent le résultat attendu de la mise à disposition de la dîme : une nourriture réellement suffisante.'
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: afin que … te bénisse
  rationale: לְמַעַן introduit ici le but ou le résultat recherché. Le subjonctif après « afin que » évite de transformer cette finalité en prédiction inconditionnelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: dans tout le travail que tu accompliras de tes mains
  rationale: Cette formulation conserve l’image concrète du travail de la main tout en restant idiomatique en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » préserve sa fonction de nom sans lui substituer un titre.
- issue: Portée de la bénédiction divine après לְמַעַן
  choice: afin que Yahweh ton Dieu te bénisse
  alternative: et Yahweh ton Dieu te bénira
  rationale: La construction exprime une finalité ou un résultat visé, non une promesse mécanique et inconditionnelle; le subjonctif français maintient cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’adresse collective au singulier (« toi ») propre au discours d’alliance. Les tirets explicatifs ont été évités au profit d’une phrase fluide; « ainsi que » relie clairement les autres bénéficiaires au Lévite.
