source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: fr
  text: 'Toutefois, parmi les animaux qui ruminent ou qui ont le sabot fendu, vous ne mangerez pas les suivants : le chameau, le lièvre[a] et le daman[b]. En effet, ils ruminent, mais n’ont pas le sabot fendu. Ils sont impurs pour vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lapin ». Le terme hébreu désigne probablement le lièvre, mais son identification zoologique exacte est discutée.
    reason: lexical_alternative
  - marker: b
    text: 'Autre nom : « hyrax ». Le terme hébreu désigne probablement le daman des rochers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Marque l’exception apportée à la règle du verset précédent, avec une tournure adversative naturelle en français moderne.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: parmi les animaux qui ruminent
  rationale: « Ruminer » est l’équivalent français courant et concis de l’expression hébraïque désignant le fait de faire remonter la nourriture.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: ou qui ont le sabot fendu
  rationale: Rend clairement la caractéristique du sabot séparé, sans recourir à une formulation technique ou vieillie. « Ou » correspond à la coordination des deux catégories envisagées.
- source_word: הַגָּמָל
  choice: le chameau
  rationale: Équivalent direct et usuel du nom de l’animal.
- source_word: הָאַרְנֶבֶת
  choice: le lièvre[a]
  rationale: Identification traditionnelle et la plus probable; l’incertitude zoologique et l’alternative « lapin » sont signalées en note.
- source_word: הַשָּׁפָן
  choice: le daman[b]
  rationale: Le terme désigne très probablement le petit mammifère rupicole appelé daman, ou hyrax. « Daman » est le nom français courant; une note conserve l’autre appellation.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: En effet, ils ruminent
  rationale: La locution introduit l’explication de leur classement; « en effet » convient naturellement ici et « ruminent » maintient la cohérence lexicale.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: mais n’ont pas le sabot fendu
  rationale: Préserve l’opposition et le singulier collectif de l’hébreu dans une formulation française naturelle.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: Ils sont impurs pour vous
  rationale: « Impurs » conserve le vocabulaire biblique des catégories alimentaires sans ajouter explicitement les qualificatifs interprétatifs « rituellement » ou « cérémoniellement ».
theological_decisions:
- issue: Nature de l’impureté dans la loi alimentaire
  choice: impurs
  alternative: rituellement impurs; cérémoniellement impurs
  rationale: Le texte hébreu emploie le terme général טָמֵא. La traduction garde cette transparence lexicale et n’explicite pas dans le corps du texte une interprétation rituelle ou cérémonielle.
- issue: Description des animaux comme ruminants
  choice: ils ruminent
  alternative: ils font remonter la nourriture
  rationale: La traduction conserve l’énoncé et la catégorisation propres au texte sans tenter de résoudre ou de reformuler la tension avec la classification zoologique moderne.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive (« vous ne mangerez pas ») convient au registre juridique biblique. Les termes zoologiques restent accessibles, tandis que les incertitudes d’identification sont réservées aux notes.
