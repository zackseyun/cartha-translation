  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: fr
  text: Tu ne délaisseras pas le Lévite qui habite dans tes villes[a], car il n’a ni part ni héritage avec toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans tes portes ». Cette expression hébraïque désigne les villes ou les communautés locales.'
    reason: cultural_note
  - marker: b
    text: Le Lévite ne recevait pas, parmi les tribus d’Israël, une part territoriale ordinaire.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: le Lévite
  rationale: Le singulier défini représente ici tout membre de la classe lévitique. « Lévite » est précis sans ajouter « prêtre », car tous les Lévites ne sont pas désignés comme prêtres.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: qui vit dans ta ville
  rationale: L’expression littérale « qui est dans tes portes » désigne idiomatiquement la localité ou la communauté où habite le destinataire. Le singulier distributif français rend naturellement le pluriel hébreu associé au « tu » collectif.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: tu ne délaisseras pas
  rationale: עזב peut signifier laisser, abandonner ou délaisser. Dans ce contexte d’assistance matérielle, « délaisser » conserve la force de l’interdiction tout en couvrant le fait de négliger ses besoins.
- source_word: כִּי
  choice: car
  rationale: Introduit le motif du commandement dans un registre français naturel et digne.
- source_word: אֵין לוֹ
  choice: il n’a
  rationale: Rendu idiomatique de la construction existentielle hébraïque.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ni part ni héritage
  rationale: La coordination négative française « ni… ni… » restitue naturellement les deux termes hébreux coordonnés et leur effet cumulatif. « Part » désigne une part attribuée; « héritage » garde la dimension foncière et familiale.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: Traduction directe qui maintient l’idée que le Lévite ne possède pas de part aux côtés des autres Israélites.
theological_decisions:
- issue: Nature de l’absence de part du Lévite
  choice: L’absence concerne la part territoriale tribale normalement attribuée en Israël.
  alternative: Une marginalisation sociale générale sans référence particulière à la possession foncière.
  rationale: Dans le contexte du Deutéronome, le couple « part et héritage » renvoie à l’absence d’un territoire tribal attribué aux Lévites. La traduction n’explicite pas cette interprétation dans le corps du verset, mais la note fournit le contexte nécessaire.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse covenantale hébraïque à Israël envisagé collectivement. « Ville » privilégie le sens idiomatique de שׁער plutôt que de maintenir une image susceptible d’être mal comprise. « Délaisser » garde une portée plus forte que « négliger » tout en restant naturel dans le contexte de la solidarité communautaire.
