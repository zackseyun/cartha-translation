  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וּ/בְ/ךָ֞ בָּחַ֣ר יְהוָ֗ה לִֽ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: fr
  text: Car tu es un peuple saint pour Yahweh ton Dieu, et Yahweh t’a choisi pour que tu sois pour lui un peuple qui lui appartienne en propre[a] parmi tous les peuples qui sont sur la face de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son bien précieux ». Le mot hébreu סְגֻלָּה désigne une possession personnelle à laquelle son propriétaire attache une valeur particulière.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’interdiction précédente et en conserve la valeur explicative.
- source_word: עַם קָדוֹשׁ
  choice: un peuple saint
  rationale: Expression française naturelle qui garde l’idée d’un peuple consacré à Dieu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: pour Yahweh ton Dieu
  rationale: Le ל marque ici la relation et l’appartenance; « pour » reste naturel sans surinterpréter cette relation.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: et Yahweh t’a choisi
  rationale: Avec בחר, la préposition ב introduit idiomatiquement la personne choisie; le français emploie un complément direct.
- source_word: לִהְיוֹת לוֹ
  choice: pour que tu sois pour lui
  rationale: Conserve explicitement la visée du choix et l’appartenance à Yahweh sans transformer la proposition en simple possession.
- source_word: לְעַם סְגֻלָּה
  choice: un peuple précieux
  rationale: Maintient le nom עַם et rend סְגֻלָּה comme le caractère spécialement estimé de ce peuple; la note donne l’autre formulation possible.
- source_word: מִכֹּל הָעַמִּים
  choice: parmi tous les peuples
  rationale: מן indique ici une sélection au sein de l’ensemble des peuples, sans nécessairement exprimer une supériorité comparative.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: qui sont sur la face de la terre
  rationale: Rend l’idiome hébreu dans sa portée universelle tout en en conservant l’image.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin et préserve son emploi dans le cadre de l’alliance.
theological_decisions:
- issue: Nature du choix d’Israël
  choice: Présenter le choix comme l’établissement d’un peuple appartenant à Yahweh et particulièrement précieux pour lui.
  alternative: Traduire מִכֹּל par « au-dessus de tous les peuples » ou développer la phrase selon une doctrine ultérieure de l’élection.
  rationale: Le texte affirme le choix divin et le statut particulier d’Israël parmi les peuples, sans expliciter une supériorité ethnique ni un système théologique ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques adressées collectivement à Israël. La répétition de « peuple » et l’image « sur la face de la terre » sont conservées.
