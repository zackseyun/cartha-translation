  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: fr
  text: Et si le trajet est trop long pour toi, de sorte que tu ne peux pas transporter ta dîme, parce que le lieu que Yahweh, ton Dieu, choisira pour y établir son nom est trop éloigné de toi, quand Yahweh, ton Dieu, te bénit[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que Yahweh, ton Dieu, te bénit ». La conjonction hébraïque peut ici exprimer aussi bien la cause que le temps.'
    reason: Alternative lexicale reflétant l’ambiguïté de כִּי.
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: Introduit une éventualité qui prolonge l’instruction précédente; « mais » marque naturellement le contraste avec le cas normal envisagé au verset précédent.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: le trajet est trop long pour toi
  rationale: Rend idiomatiquement l’idée d’une distance qui dépasse ce que la personne peut raisonnablement parcourir avec les biens à transporter.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: tu ne peux pas transporter ta dîme
  rationale: Le pronom masculin renvoie, dans le contexte immédiat, au produit de la dîme. L’explicitation évite en français un pronom sans antécédent clair dans le verset isolé.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: le lieu ... est trop éloigné de toi
  rationale: Conserve la portée spatiale de רחק et l’expression deutéronomique caractéristique « le lieu ».
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: que Yahweh ton Dieu choisira
  rationale: Le yiqtol reçoit ici une valeur future dans cette instruction légale, en référence au sanctuaire que Dieu désignera.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, sans le remplacer par un titre.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: pour y établir son nom
  rationale: Expression française naturelle qui préserve le langage théologique propre au Deutéronome concernant le lieu de culte choisi par Dieu.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: lorsque Yahweh ton Dieu t’aura béni
  rationale: La lecture temporelle décrit la situation créée par la bénédiction divine et l’abondance qui en résulte; l’ambiguïté causale de כִּי est conservée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin; sa transcription préserve sa fonction de nom personnel dans l’alliance.
- issue: Valeur de la dernière conjonction כִּי
  choice: 'lecture temporelle : « lorsque »'
  alternative: 'lecture causale : « parce que »'
  rationale: La valeur temporelle s’intègre bien à la situation légale décrite, tandis que la valeur causale demeure grammaticalement possible et est donc signalée sans trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste ouverte par une virgule, car la proposition conditionnelle se poursuit au verset 25. « Ta dîme » explicite le référent contextuel du pronom hébreu.
