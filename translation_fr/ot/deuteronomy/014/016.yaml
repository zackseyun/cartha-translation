lexical_decisions:
- source_word: כּוֹס
  choice: petit-duc
  rationale: Le mot désigne vraisemblablement un rapace nocturne. « Petit-duc » fournit en français un nom d’oiseau naturel et distinct des deux suivants, sans prétendre établir avec certitude l’espèce exacte.
- source_word: יַנְשׁוּף
  choice: grand-duc
  rationale: Dans cette liste d’oiseaux, le terme est traditionnellement compris comme désignant un rapace nocturne. « Grand-duc » maintient la distinction avec כּוֹס et convient au registre zoologique courant, même si l’identification précise demeure incertaine.
- source_word: תִּנְשָׁמֶת
  choice: effraie
  rationale: Le contexte exige ici un oiseau, probablement de type chouette ou hibou. « Effraie » est une désignation française reconnue qui distingue ce troisième terme des deux précédents, tout en laissant à la note le soin de signaler l’incertitude zoologique.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marqueur hébreu du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: וְ
  choice: et
  rationale: Conjonction ordinaire reliant les derniers éléments de l’énumération.
- source_word: הַ
  choice: le / l’
  rationale: L’article défini hébreu présente chaque oiseau comme une catégorie de la liste; il est rendu selon l’usage naturel du français.
