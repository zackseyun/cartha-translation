revisions:
- from: 'Yaïr, fils de Manassé, s’empara de toute la région d’Argob, jusqu’à la frontière des Gueshourites et des Maakatites. Il donna son propre nom à ces lieux du Bashan[a] : Havvoth-Yaïr[b]. Ils portent encore ce nom aujourd’hui.'
  to: 'Yaïr, fils de Manassé, prit possession de toute la région d’Argob, jusqu’à la frontière des Gueshourites et des Maakatites. Il donna à ces lieux du Bashan[a] son propre nom : Havvoth-Yaïr[b], nom qu’ils portent jusqu’à ce jour.'
  rationale: La révision remplace un verbe français trop chargé par une formulation territoriale fidèle et conserve « jusqu’à ce jour », qui reproduit la perspective du narrateur. Elle maintient l’explicitation prudente de l’objet pluriel et l’ambiguïté syntaxique dans la note.
