  text: יָאִ֣יר בֶּן מְנַשֶּׁ֗ה לָקַח֙ אֶת כָּל חֶ֣בֶל אַרְגֹּ֔ב עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּֽעֲכָתִ֑י וַ/יִּקְרָא֩ אֹתָ֨/ם עַל שְׁמ֤/וֹ אֶת הַ/בָּשָׁן֙ חַוֺּ֣ת יָאִ֔יר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: fr
  text: 'Yaïr, fils de Manassé, prit possession de toute la région d’Argob, jusqu’à la frontière des Gueshourites et des Maakatites. Il donna à ces lieux du Bashan[a] son propre nom : Havvoth-Yaïr[b], nom qu’ils portent jusqu’à ce jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il les appela d’après son propre nom, le Bashan, Havvoth-Yaïr ». La syntaxe hébraïque est condensée et peut être comprise de plusieurs manières.'
    reason: alternative_reading
  - marker: b
    text: Havvoth-Yaïr signifie probablement « les villages de Yaïr » ou « les campements de Yaïr ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: région
  rationale: Dans ce contexte géographique, le mot désigne une étendue de territoire délimitée. « Région » est naturel en français moderne.
- source_word: אַרְגֹּב
  choice: Argob
  rationale: Nom géographique conservé par translittération.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: jusqu’à la frontière des Gueshourites et des Maakatites
  rationale: גְּבוּל désigne ici une frontière ou une limite territoriale; les gentilés sont rendus comme noms de peuples.
- source_word: וַיִּקְרָא אֹתָם
  choice: Il donna … à ces lieux … le nom
  rationale: Le suffixe objet est masculin pluriel. « Ces lieux » préserve ce pluriel tout en rendant la phrase compréhensible en français.
- source_word: עַל שְׁמוֹ
  choice: son propre nom
  rationale: L’expression indique que Yaïr nomme les lieux d’après lui-même.
- source_word: אֶת הַבָּשָׁן
  choice: du Bashan
  rationale: La syntaxe hébraïque est condensée et difficile. Cette formulation rattache les lieux au Bashan sans faire de « Bashan » le nom qui leur serait donné.
- source_word: חַוֹּת יָאִיר
  choice: Havvoth-Yaïr
  rationale: L’expression fonctionne comme un nom de lieu. Elle est donc translittérée dans le texte, tandis que son sens probable est indiqué en note.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Ils portent encore ce nom aujourd’hui
  rationale: Équivalent idiomatique français de la formule indiquant que le nom subsistait à l’époque du narrateur.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises aisément reconnaissables. La syntaxe difficile de la proposition hébraïque est clarifiée avec retenue, et son ambiguïté est signalée en note.
