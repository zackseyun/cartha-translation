  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: fr
  text: Mais tout le bétail et le butin des villes, nous les avons pris pour nous-mêmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et tout le bétail et le butin des villes, nous les avons pris pour nous-mêmes. »'
    reason: Conserve la valeur simplement coordonnante possible de וְ sans introduire un emploi inapproprié de « piller » pour l’ensemble « le bétail et le butin ».
lexical_decisions:
- source_word: וְ/כָל
  choice: Mais tout
  rationale: Dans le contexte, le waw relie ce verset au précédent tout en marquant un léger contraste entre les populations vouées à la destruction et les biens conservés. « Mais tout » rend cette nuance sans affaiblir la portée de כָּל.
- source_word: הַ/בְּהֵמָה
  choice: le bétail
  rationale: בְּהֵמָה désigne ici les animaux domestiques appartenant aux habitants des villes. « Le bétail » est précis et naturel en français moderne.
- source_word: וּ/שְׁלַל
  choice: et le butin
  rationale: שָׁלָל désigne les biens pris à la guerre. « Butin » est le terme militaire courant et digne en français.
- source_word: הֶ/עָרִים
  choice: des villes
  rationale: Cette formulation reproduit directement la relation construite de l’hébreu et peut désigner le butin appartenant aux villes ou provenant d’elles.
- source_word: בַּזּוֹנוּ
  choice: nous les avons pris
  rationale: Le verbe בזז signifie piller ou prendre comme butin. Avec le nom « butin » déjà présent, « pris » évite une répétition lourde tout en exprimant clairement l’appropriation; la note conserve le rendu verbal plus explicite.
- source_word: לָֽ/נוּ
  choice: pour nous-mêmes
  rationale: Le ל prépositionnel avec le pronom de première personne du pluriel indique les bénéficiaires de la prise. « Pour nous-mêmes » rend explicitement cette valeur réfléchie et possessive.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le léger contraste contextuel de la conjonction, tandis que la note signale la lecture simplement coordonnante et le rendu verbal plus littéral de בזז.
