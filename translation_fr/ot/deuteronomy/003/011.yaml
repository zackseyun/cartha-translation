  to: 'Car seul Og, roi du Bashân, était resté du reste des Rephaïm[a]. Voyez : son lit était un lit de fer. N’est-il pas à Rabba des Ammonites ? Sa longueur était de neuf coudées et sa largeur de quatre coudées, selon la coudée d’un homme[b].'
  rationale: La révision conserve la structure, la répétition « lit était un lit », les mesures anciennes et l’ambiguïté de « coudée d’un homme ». Elle remplace une interprétation évitable de « reste » et aligne le nom propre du groupe sur l’hébreu et la note. La dernière phrase est rendue plus naturelle et moins ambiguë sans modifier le sens.
