  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: fr
  text: 'Car seul Og, roi du Bashân, était resté du reste des Rephaïm[a]. Voyez : son lit était un lit de fer. N’est-il pas à Rabba des Ammonites ? Sa longueur était de neuf coudées et sa largeur de quatre coudées, selon la coudée d’un homme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « géants ». Le terme hébreu Rephaïm désigne probablement un ancien peuple associé à une stature exceptionnelle.
    reason: alternative_reading
  - marker: b
    text: 'Ou « selon la coudée ordinaire ». L’hébreu dit littéralement : « selon la coudée d’un homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: seul
  rationale: 'Exprime l’exclusivité : Og était le seul à être resté de ce groupe.'
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: était resté parmi les derniers
  rationale: Rend naturellement en français l’idée qu’Og subsistait seul parmi ce qui restait des Rephaïtes, sans suggérer qu’il était nécessairement l’unique Rephaïte de toute époque.
- source_word: הָרְפָאִים
  choice: les Rephaïtes
  rationale: Conserve le nom de cet ancien peuple ou groupe plutôt que de lui substituer l’interprétation « géants ».
- source_word: הִנֵּה
  choice: Voyez
  rationale: Garde la force démonstrative de l’hébreu dans une formulation française actuelle et digne.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: son lit était un lit
  rationale: Conserve la répétition emphatique du nom; « lit » est ici le sens contextuel le plus naturel.
- source_word: בַּרְזֶל
  choice: fer
  rationale: Traduction directe du matériau mentionné.
- source_word: הֲלֹה הִוא
  choice: Ne se trouve-t-il pas
  rationale: Rend la question rhétorique en français idiomatique tout en reliant clairement l’objet au lieu où il était connu.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: à Rabba des Ammonites
  rationale: Emploie la forme française usuelle du toponyme et rend idiomatiquement « fils d’Ammon ».
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: neuf coudées ... quatre coudées
  rationale: Conserve l’unité ancienne afin d’éviter une conversion moderne faussement précise.
- source_word: בְּאַמַּת אִישׁ
  choice: selon la coudée d’un homme
  rationale: Préserve de près l’expression hébraïque et laisse en note l’interprétation probable d’une coudée ordinaire.
theological_decisions:
- issue: Faut-il traduire הָרְפָאִים par « géants » ou conserver le nom du groupe ?
  choice: les Rephaïtes
  alternative: les géants
  rationale: Le mot hébreu désigne un groupe connu dans l’Ancien Testament. « Géants » expliciterait une association avec leur grande taille, mais transformerait cette interprétation en identification directe.
- issue: Le terme עֶרֶשׂ désigne-t-il ici un lit ou un objet funéraire ?
  choice: lit
  alternative: couche, bière ou sarcophage
  rationale: Les dimensions servent naturellement à évoquer la stature exceptionnelle d’Og; le sens funéraire, bien que discuté, n’est pas imposé par le texte.
- issue: Comment comprendre בְּאַמַּת אִישׁ ?
  choice: selon la coudée d’un homme
  alternative: selon la coudée ordinaire
  rationale: La formulation littérale conserve l’ambiguïté de l’expression, tandis que la note indique son interprétation métrologique probable.
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve les mesures anciennes, le nom Rephaïtes et la répétition « son lit était un lit ». La question rhétorique est formulée idiomatiquement.
