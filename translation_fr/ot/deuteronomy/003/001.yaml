base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: fr
  text: Puis nous nous sommes tournés et sommes montés par la route du Bashân[a]. Og, roi du Bashân, est sorti à notre rencontre, lui et tout son peuple, pour nous livrer bataille à Édréï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la route qui mène au Bashân ». L’hébreu dit littéralement « la route du Bashân ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Puis nous avons fait demi-tour
  rationale: Le verbe פנה dans la séquence narrative exprime ici un changement de direction. « Puis » rend naturellement la progression du récit, et « faire demi-tour » convient au contexte de l’itinéraire repris après les événements précédents.
- source_word: וַנַּעַל
  choice: sommes montés
  rationale: עלה signifie couramment « monter ». Cette traduction conserve la nuance directionnelle sans employer le plus soutenu « gravir ».
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: par la route du Bashân
  rationale: L’expression signifie littéralement « la route du Bashân » et peut désigner la voie menant à cette région ou la traversant. La formulation française préserve cette légère ambiguïté, explicitée en note.
- source_word: וַיֵּצֵא
  choice: est sorti
  rationale: יצא signifie « sortir ». Le choix reste proche de l’hébreu et évite d’ajouter l’idée plus précise de « marcher contre ».
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, roi du Bashân
  rationale: Le nom propre est translittéré, et la chaîne construite est rendue par une apposition naturelle en français.
- source_word: לִקְרָאתֵנוּ
  choice: à notre rencontre
  rationale: לקראת signifie « à la rencontre de ». Le contexte militaire étant ensuite explicite, il n’est pas nécessaire de traduire de manière plus interprétative par « pour nous affronter ».
- source_word: הוּא וְכָל עַמּוֹ
  choice: avec tout son peuple
  rationale: עם désigne littéralement le « peuple ». Même si le contexte peut viser les combattants, « peuple » évite de réduire sans nécessité le terme à « armée » ou « troupes ».
- source_word: לַמִּלְחָמָה
  choice: pour nous livrer bataille
  rationale: מלחמה peut signifier « guerre » ou « bataille ». Dans cet affrontement précis, « livrer bataille » est idiomatique en français. Le pronom « nous » explicite la relation déjà indiquée par « à notre rencontre » sans modifier le sens.
- source_word: אֶדְרֶעִי
  choice: à Édréï
  rationale: Le nom de lieu, employé adverbialement sans préposition explicite en hébreu, indique naturellement le lieu de l’affrontement. L’accentuation facilite la prononciation française.
theological_decisions: []
