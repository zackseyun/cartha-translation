  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: fr
  text: En ce temps-là, nous avons pris aux deux rois amorites qui étaient de l’autre côté du Jourdain le territoire qui s’étendait depuis le torrent de l’Arnon[a] jusqu’au mont Hermon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis la vallée de l’Arnon » ou « depuis le cours d’eau de l’Arnon » ; le mot hébreu נחל peut désigner un torrent, le lit d’un cours d’eau ou une vallée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: nous avons pris
  rationale: Le qal narratif de לקח exprime ici la prise de possession du territoire. « Nous avons pris » reste naturel et n’ajoute pas la nuance militaire plus marquée de « conquis ».
- source_word: בָּעֵת הַהִוא
  choice: à cette époque-là
  rationale: Cette formulation française naturelle rend la référence temporelle du récit sans la réduire à un moment ponctuel.
- source_word: הָאָרֶץ
  choice: le territoire
  rationale: Dans ce contexte, אֶרֶץ désigne l’étendue géographique prise aux deux rois, non la terre entière. « Territoire » explicite ce sens local.
- source_word: מִיַּד
  choice: aux deux rois
  rationale: Littéralement « de la main de », l’expression hébraïque indique ici la possession ou le contrôle. La construction française « prendre quelque chose à quelqu’un » en restitue naturellement le sens.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: les deux rois des Amorites
  rationale: Cette formulation suit la construction hébraïque et demeure claire en français moderne.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: situé de l’autre côté du Jourdain
  rationale: Le relatif se rapporte naturellement au territoire dans la phrase française. « De l’autre côté du Jourdain » conserve l’expression géographique et son orientation relative.
- source_word: מִנַּחַל אַרְנֹן
  choice: depuis le torrent de l’Arnon
  rationale: נחל peut désigner un cours d’eau, son lit ou la vallée qu’il traverse. « Torrent » convient à un cours d’eau levantin potentiellement saisonnier sans imposer l’idée d’une rivière permanente.
- source_word: עַד הַר חֶרְמוֹן
  choice: jusqu’au mont Hermon
  rationale: עַד indique ici la limite de l’étendue territoriale. « Jusqu’au mont Hermon » l’exprime directement et naturellement.
