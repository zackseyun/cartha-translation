  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: fr
  text: Les Sidoniens appellent l’Hermon « Sirion », et les Amorites l’appellent « Senir » —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִידֹנִים
  choice: Les Sidoniens
  rationale: Gentilé au pluriel désignant les habitants de Sidon ; l’article défini convient à l’usage naturel du français.
- source_word: יִקְרְאוּ
  choice: appellent
  rationale: Le qal inaccompli de קרא construit avec ל exprime ici l’attribution d’un nom ; « appellent » est naturel et fidèle.
- source_word: לְחֶרְמוֹן
  choice: l’Hermon
  rationale: Le texte hébreu porte simplement le nom propre Hermon, sans terme signifiant « mont » ; l’article est idiomatique en français pour ce relief.
- source_word: שִׂרְיֹן
  choice: Sirion
  rationale: Nom donné à l’Hermon par les Sidoniens, conservé par translittération usuelle.
- source_word: וְהָאֱמֹרִי
  choice: et les Amorites
  rationale: Le gentilé est morphologiquement singulier mais possède ici une valeur collective, comme l’indique aussi le verbe au pluriel.
- source_word: יִקְרְאוּ לוֹ
  choice: l’appellent
  rationale: Le pronom renvoie à l’Hermon ; cette formulation rend naturellement en français la construction hébraïque de dénomination.
- source_word: שְׂנִיר
  choice: Senir
  rationale: Nom donné à l’Hermon par les Amorites, conservé par translittération usuelle.
