  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: fr
  text: N’ayez pas peur d’eux[a], car c’est Yahweh, votre Dieu, qui combat pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne les craignez pas. »'
    reason: Alternative lexicale plus concise et plus formelle pour ירא, dont le sens couvre la peur et la crainte.
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: N’ayez pas peur d’eux
  rationale: Le verbe ירא avec la négation exprime ici une interdiction adressée à plusieurs personnes. « N’ayez pas peur d’eux » est naturel en français moderne et conserve le complément pronominal.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de l’exhortation précédente ; « car » en restitue clairement la valeur explicative dans un registre digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom divin présent dans le texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: אֱלֹהִים désigne ici au singulier le Dieu d’Israël, et le suffixe de deuxième personne du pluriel est rendu par « votre ».
- source_word: הוּא
  choice: c’est lui qui
  rationale: Le pronom indépendant porte une insistance. La tournure française « c’est lui qui » transmet naturellement cette mise en relief.
- source_word: הַנִּלְחָם
  choice: combat
  rationale: Le participe niphal de לחם présente Yahweh comme celui qui mène le combat ; le présent français exprime bien cette action caractéristique dans le contexte de l’assurance donnée.
- source_word: לָכֶם
  choice: pour vous
  rationale: La préposition ל indique ici que l’action est accomplie en faveur d’Israël ; « pour vous » est direct et idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve sous une forme translittérée sans le remplacer par un titre.
- issue: Mise en relief de l’action divine par הוּא
  choice: c’est lui qui combat pour vous
  alternative: il combat pour vous
  rationale: La construction retenue préserve l’insistance du pronom hébreu sans ajouter d’interprétation sur la manière dont Dieu combat.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel vise collectivement les Israélites ; la tournure « c’est lui qui » conserve l’emphase de l’hébreu.
