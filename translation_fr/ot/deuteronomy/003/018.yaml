source:
  edition: WLC
  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: fr
  text: 'À cette époque, je vous ai donné cet ordre : « Yahweh, votre Dieu, vous a donné ce pays pour que vous en preniez possession. En armes[b], vous passerez devant vos frères[a], les fils d’Israël — vous tous, hommes aptes au combat[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « vos compatriotes israélites » ; littéralement : « vos frères, les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « équipés pour le combat ».
    reason: lexical_alternative
  - marker: c
    text: L’expression désigne ici des hommes capables de combattre, et non simplement des hommes courageux.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם
  choice: je vous ai donné cet ordre
  rationale: Exprime naturellement en français l’acte de commander indiqué par צוה, tout en conservant l’adresse au pluriel.
- source_word: בָּעֵת הַהִוא
  choice: À cette époque
  rationale: Rend l’expression temporelle narrative de façon courante et claire.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement le contenu de l’ordre sans qu’il soit nécessaire de traduire littéralement « en disant ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement le nom avec le suffixe possessif de deuxième personne du pluriel.
- source_word: נָתַן לָכֶם
  choice: vous a donné
  rationale: Le passé composé présente le don comme accompli et pertinent pour l’ordre présent.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans ce contexte territorial, « pays » est plus naturel que « terre » en français et désigne le territoire situé à l’est du Jourdain.
- source_word: לְרִשְׁתָּהּ
  choice: pour que vous en preniez possession
  rationale: Rend explicitement l’idée d’acquérir et de détenir le territoire, sans suggérer une réception purement passive.
- source_word: חֲלוּצִים
  choice: En armes
  rationale: Le terme désigne des hommes préparés et équipés pour l’action militaire; la formulation initiale conserve sa mise en relief dans l’hébreu.
- source_word: תַּעַבְרוּ
  choice: vous passerez
  rationale: Le futur français porte ici la valeur d’un ordre ferme dans le discours direct.
- source_word: לִפְנֵי
  choice: devant
  rationale: Indique que ces combattants doivent avancer en tête des autres Israélites.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: vos frères, les fils d’Israël
  rationale: Conserve l’apposition et le langage familial masculin du texte hébreu, tout en signalant en note le sens collectif possible.
- source_word: כָּל בְּנֵי חָיִל
  choice: vous tous, hommes aptes au combat
  rationale: Dans ce contexte militaire, חַיִל désigne l’aptitude et la capacité guerrières plutôt que la seule bravoure intérieure.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée au lieu de la remplacer par un titre.
- issue: Portée des expressions masculines אֲחֵיכֶם, בְּנֵי יִשְׂרָאֵל et בְּנֵי חָיִל
  choice: vos frères, les fils d’Israël — vous tous, hommes aptes au combat
  alternative: vos compatriotes israélites — vous tous qui êtes aptes au combat
  rationale: Le contexte vise les hommes mobilisables et l’hébreu emploie des termes masculins explicites. La traduction les conserve sans exclure en note le sens collectif de « frères ».
- issue: Sens de חֲלוּצִים
  choice: En armes
  alternative: équipés pour le combat
  rationale: Les deux lectures expriment la préparation militaire. « En armes » est concise et naturelle, tandis que la note conserve l’alternative plus explicite.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct est introduit par deux-points plutôt que par un calque de לֵאמֹר. L’ordre militaire reste ferme, et les appositions de l’hébreu sont conservées sans alourdir excessivement la phrase.
