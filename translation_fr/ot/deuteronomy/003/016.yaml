reference: Deuteronomy 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לָ/רֻאוּבֵנִ֨י וְ/לַ/גָּדִ֜י נָתַ֤תִּי מִן הַ/גִּלְעָד֙ וְ/עַד נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַ/נַּ֖חַל וּ/גְבֻ֑ל וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: fr
  text: Aux Rubénites et aux Gadites, j’ai donné le territoire qui va de Galaad jusqu’au ravin de l’Arnon[a], le milieu du ravin servant de frontière, et jusqu’au ravin du Yabboq, qui forme la frontière des Ammonites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner un cours d’eau, un oued ou le ravin qui lui est associé. Ici, « ravin » convient puisque la suite situe la frontière en son milieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des fils d’Ammon », expression de parenté qui désigne le peuple d’Ammon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: Aux Rubénites et aux Gadites
  rationale: Les gentilés désignent ici les groupes tribaux bénéficiaires du territoire. Ces formes sont concises et usuelles en français biblique moderne.
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Le verbe simple garde le sens fondamental de נתן sans ajouter la nuance d’une attribution administrative.
- source_word: מִן הַגִּלְעָד וְעַד
  choice: le territoire qui va de Galaad jusqu’à
  rationale: L’ajout explicatif « le territoire qui va » rend naturellement en français l’étendue introduite par מן…ועד, sans modifier son contenu géographique.
- source_word: נַחַל
  choice: ravin
  rationale: נחל peut désigner un cours d’eau, un oued ou le ravin qui lui est associé. « Ravin » convient à la mention du milieu comme ligne frontalière tout en évitant de supposer un fleuve permanent.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: le milieu du ravin servant de frontière
  rationale: Cette formulation conserve l’idée que la ligne médiane du ravin constitue la limite, tout en rendant naturelle la construction elliptique de l’hébreu.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: qui forme la frontière des Ammonites
  rationale: « Ammonites » rend naturellement en français le gentilé exprimé en hébreu par la locution de parenté « fils d’Ammon ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe explicite l’étendue territoriale sans effacer l’ambiguïté topographique de נחל. Les toponymes suivent les formes françaises usuelles « Galaad », « Arnon » et « Yabboq ».
