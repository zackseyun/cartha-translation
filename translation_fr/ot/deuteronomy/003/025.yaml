  text: אֶעְבְּרָה נָּ֗א וְ/אֶרְאֶה֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן הָ/הָ֥ר הַ/טּ֛וֹב הַ/זֶּ֖ה וְ/הַ/לְּבָנֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: fr
  text: Permets-moi, je t’en prie, de traverser et de voir le bon pays qui est au-delà du Jourdain, cette belle région montagneuse[a] et le Liban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette belle montagne ». Le mot hébreu peut désigner soit une montagne particulière, soit la région montagneuse située à l’ouest du Jourdain.
    reason: Alternative lexicale préservant l’ambiguïté géographique de הָהָר.
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: Permets-moi, je t’en prie, de traverser
  rationale: Le cohortatif exprime la demande pressante de Moïse, et נָא en adoucit la formulation. Cette tournure rend naturellement en français à la fois la volonté et la supplication.
- source_word: וְאֶרְאֶה
  choice: et de voir
  rationale: Le second cohortatif est coordonné au premier et indique ce que Moïse désire faire après avoir traversé.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: le bon pays
  rationale: Dans ce contexte territorial du Deutéronome, אֶרֶץ désigne le pays. « Bon pays » conserve le vocabulaire caractéristique du livre et sa valeur positive.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: qui est au-delà du Jourdain
  rationale: L’expression situe le pays de l’autre côté du Jourdain par rapport à Moïse, qui parle depuis l’est du fleuve.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: cette belle région montagneuse
  rationale: Le singulier הָר peut désigner collectivement une zone montagneuse. « Belle » rend naturellement la seconde occurrence de טוֹב sans alourdir la phrase par la répétition de « bon ».
- source_word: וְהַלְּבָנוֹן
  choice: et le Liban
  rationale: Le nom géographique est rendu selon son appellation française usuelle.
theological_decisions:
- issue: 'Portée géographique de הָהָר : montagne particulière ou région montagneuse'
  choice: cette belle région montagneuse
  alternative: cette belle montagne
  rationale: Dans cette description du pays, le nom singulier peut avoir un sens collectif et désigner les hauteurs de Canaan. Toutefois, le texte hébreu permet aussi d’y voir une montagne déterminée ; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le ton suppliant de Moïse, la désignation deutéronomique du « bon pays » et l’ambiguïté du terme géographique au moyen d’une note.
