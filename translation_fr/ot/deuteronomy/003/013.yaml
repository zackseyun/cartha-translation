  variant: modern international French
source:
  edition: WLC
  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: fr
  text: 'Le reste de Galaad et tout le Bashan, le royaume d’Og, je les ai donnés à la demi-tribu de Manassé : toute la région d’Argob, c’est-à-dire tout le Bashan. Ce territoire est appelé le pays des Réphaïm[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « le pays des géants ». « Réphaïm » est le nom hébreu d’un peuple ancien associé à cette région.'
    reason: Préserver l’autre traduction traditionnelle de רְפָאִים sans remplacer dans le texte principal le nom du peuple par une interprétation.
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: le reste de Galaad
  rationale: Exprime naturellement la partie de Galaad qui restait après l’attribution précédente.
- source_word: כָל הַבָּשָׁן
  choice: tout le Bashan
  rationale: Conserve la valeur englobante de כָל et la forme usuelle du nom géographique en français moderne.
- source_word: מַמְלֶכֶת עוֹג
  choice: le royaume d’Og
  rationale: Rend directement la construction hébraïque et identifie le territoire comme l’ancien royaume d’Og.
- source_word: נָתַתִּי
  choice: je les ai donnés
  rationale: Le passé composé convient au récit français et le pronom reprend les deux territoires mentionnés, sans ajouter l’idée plus interprétative d’une attribution administrative.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: à la demi-tribu de Manassé
  rationale: Formulation française consacrée et claire pour la moitié de la tribu installée à l’est du Jourdain.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: toute la région d’Argob
  rationale: Dans ce contexte, חֶבֶל désigne une étendue territoriale et non une corde; « région » est précis et naturel.
- source_word: לְכָל הַבָּשָׁן
  choice: c’est-à-dire tout le Bashan
  rationale: Rend la relation explicative ou récapitulative probable avec la région d’Argob, tout en conservant l’étendue totale indiquée par כָל.
- source_word: הַהוּא יִקָּרֵא
  choice: Ce territoire est appelé
  rationale: Le démonstratif renvoie au territoire qui vient d’être décrit; le présent rend la désignation coutumière exprimée par l’imparfait passif hébreu.
- source_word: אֶרֶץ רְפָאִים
  choice: le pays des Réphaïm
  rationale: Traite רְפָאִים comme le nom d’un ancien peuple plutôt que de lui imposer dans le texte principal l’interprétation traditionnelle « géants ».
theological_decisions:
- issue: Faut-il traduire רְפָאִים comme un nom de peuple ou par le terme interprétatif « géants » ?
  choice: le pays des Réphaïm
  alternative: le pays des géants
  rationale: Dans ce verset, le mot fonctionne comme une désignation ethnique liée à la région. La translittération préserve cette fonction et évite de trancher dans le texte principal la question de la stature ou de la nature des Réphaïm; l’interprétation traditionnelle est signalée en note.
translation_notes:
  register: 'Français international moderne, digne et accessible. La ponctuation met en relief l’explication territoriale sans alourdir la phrase. Les noms propres suivent les formes françaises courantes : Galaad, Bashan, Og, Manassé, Argob et Réphaïm.'
