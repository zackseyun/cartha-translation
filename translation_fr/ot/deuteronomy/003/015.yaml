  text: And to Machir I gave Gilead[a].
translation:
  language: fr
  text: Et à Makir, j’ai donné le Galaad[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le Galaad » ; le nom peut désigner ici la région de Galaad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: Et à Makir
  rationale: La conjonction וּ relie cette attribution au récit précédent, et la préposition לְ indique le bénéficiaire. « Makir » est la forme française usuelle du nom propre.
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Le qal accompli à la première personne du singulier de נתן exprime ici, dans un rappel narratif, une action passée accomplie. Le passé composé est naturel en français moderne et reste proche du verbe hébreu.
- source_word: אֶת
  choice: '[marque de l’objet direct non traduite]'
  rationale: Cette particule grammaticale introduit l’objet direct défini et n’a pas d’équivalent lexical autonome en français.
- source_word: הַגִּלְעָד
  choice: le Galaad
  rationale: L’hébreu porte l’article défini. En français biblique courant, le nom régional « Galaad » s’emploie naturellement avec l’article, ce qui permet aussi de refléter la forme hébraïque sans ajouter « pays » ou « région ».
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le passé composé convient à la narration rétrospective de Moïse. L’article devant « Galaad » est idiomatique en français et correspond à l’article hébreu.
