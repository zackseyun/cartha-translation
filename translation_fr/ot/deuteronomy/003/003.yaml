  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: fr
  text: Yahweh notre Dieu livra aussi entre nos mains Og, roi du Bashân, ainsi que tout son peuple. Nous le frappâmes jusqu’à ce qu’il ne lui reste aucun survivant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ne lui laisser aucun survivant ».'
    reason: La construction hébraïque peut se rendre par une tournure où le résultat est attribué aux Israélites plutôt que par la tournure résultative du texte.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: livra ... entre nos mains
  rationale: Dans ce contexte militaire, « livrer entre les mains » rend naturellement l’idiome hébreu tout en conservant l’image de la main, symbole de pouvoir.
- source_word: גַּם
  choice: aussi
  rationale: Le terme rattache la défaite d’Og à celle de Sihôn racontée précédemment.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, roi du Bashân
  rationale: Cette formulation française naturelle conserve le nom propre, le titre royal et le nom de la région.
- source_word: כָּל עַמּוֹ
  choice: tout son peuple
  rationale: עַם désigne le peuple dans son ensemble et ne doit pas être restreint sans nécessité à la seule armée.
- source_word: וַנַּכֵּהוּ
  choice: nous le frappâmes
  rationale: Le singulier du suffixe hébreu est conservé; dans ce récit de bataille, Og représente le roi avec les siens. « Frapper » maintient la force concrète de נכה.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: jusqu’à ne lui laisser aucun survivant
  rationale: La formulation rend l’anéantissement complet exprimé par l’hébreu sans ajouter d’explication; elle demeure claire et idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: « Yahweh » représente directement le nom personnel hébreu, tandis que « le SEIGNEUR » lui substituerait un titre.
- issue: Étendue de la destruction militaire
  choice: jusqu’à ne lui laisser aucun survivant
  alternative: jusqu’à ce qu’il ne lui reste aucun survivant
  rationale: Le texte affirme une destruction totale dans le cadre de cette bataille. La traduction en conserve la gravité sans l’atténuer ni lui ajouter une interprétation théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La graphie « Bashân » aide à distinguer le nom propre et reflète une translittération française usuelle. Le marqueur [a] est placé après la proposition qu’il explicite.
