base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: fr
  text: 'À cette époque, j’ai donné cet ordre à Josué : « Tu as vu de tes propres yeux tout ce que Yahweh, votre Dieu, a fait à ces deux rois. Yahweh fera de même à tous les royaumes où tu vas passer.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tous les royaumes que tu passes là-bas ». Le verbe peut évoquer un passage vers un lieu ; on peut donc aussi comprendre : « tous les royaumes dans lesquels tu vas entrer ».'
    reason: L’expression hébraïque associe le verbe « passer, traverser » à un adverbe de direction. Sa relation exacte aux « royaumes » est concise et peut être comprise de plusieurs manières.
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי בָּעֵת הַהִוא
  choice: À cette époque, j’ai donné cet ordre à Josué
  rationale: Cette formulation rend naturellement le verbe צוה et l’expression temporelle, tout en maintenant l’autorité de l’instruction donnée par Moïse.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles rapportées sans qu’il soit nécessaire de reproduire littéralement « en disant ».
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Tu as vu de tes propres yeux
  rationale: Cette tournure idiomatique conserve l’insistance de l’hébreu sur le témoignage visuel personnel de Josué.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, votre Dieu
  rationale: 'Le nom divin est translittéré « Yahweh ». Le suffixe de אֱלֹהֵיכֶם est pluriel : Josué est l’interlocuteur direct, mais Dieu est celui de toute la communauté, d’où « votre Dieu ».'
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: à ces deux rois
  rationale: La préposition ל désigne ici ceux qui ont subi l’action de Yahweh ; « à » reste fidèle sans expliciter davantage l’hostilité déjà claire dans le contexte.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Yahweh fera de même
  rationale: « De même » exprime clairement la comparaison entre le sort des deux rois et celui des royaumes à venir.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: vers lesquels tu vas passer
  rationale: La formulation garde le singulier adressé à Josué, le mouvement de עבר et l’idée de destination portée par שָׁמָּה, dans un français intelligible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le Tétragramme ; « Yahweh » préserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Alternance entre le singulier et le pluriel dans l’adresse
  choice: « Tu » pour Josué, mais « votre Dieu » pour Josué et Israël
  alternative: « ton Dieu » partout
  rationale: Le texte hébreu adresse les verbes et le pronom à Josué au singulier (עֵינֶיךָ, אַתָּה), tandis que le suffixe de « votre Dieu » est pluriel (אֱלֹהֵיכֶם). La traduction conserve cette variation significative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement lissée, notamment par l’emploi des deux-points au lieu de « en disant », tandis que l’insistance visuelle, le passage du singulier au pluriel et le motif de la traversée sont conservés.
