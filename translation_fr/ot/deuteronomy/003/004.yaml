  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר לֹא לָקַ֖חְנוּ מֵֽ/אִתָּ֑/ם שִׁשִּׁ֥ים עִיר֙ כָּל חֶ֣בֶל אַרְגֹּ֔ב מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: fr
  text: 'À ce moment-là, nous avons pris toutes ses villes. Il n’y eut pas une seule ville que nous ne leur ayons prise : soixante villes, toute la région d’Argob, le royaume d’Og en Basan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: nous avons pris
  rationale: Le verbe לכד désigne ici la prise militaire de villes. « Prendre » est naturel en français dans ce contexte et évite la nuance moderne de faire prisonnier que peut suggérer « capturer » appliqué aux villes.
- source_word: כָּל עָרָיו
  choice: toutes ses villes
  rationale: עִיר peut désigner une ville ou une localité; « villes » convient au contexte et le suffixe singulier renvoie à Og.
- source_word: בָּעֵת הַהִוא
  choice: À ce moment-là
  rationale: Rend directement l’expression temporelle hébraïque dans un français actuel et soutenu.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: Il n’y eut pas une seule ville que nous ne leur ayons prise
  rationale: Préserve la double négation emphatique et le pluriel de מֵאִתָּם. La tournure « prendre une ville à quelqu’un » est idiomatique en contexte militaire.
- source_word: מֵאִתָּם
  choice: leur
  rationale: Le suffixe hébreu est explicitement pluriel et renvoie vraisemblablement aux gens ou aux forces d’Og; le français « leur » conserve ce nombre sans explicitation interprétative.
- source_word: שִׁשִּׁים עִיר
  choice: soixante villes
  rationale: Traduction directe du nombre et du nom, cohérente avec les occurrences précédentes.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: toute la région d’Argob
  rationale: חֶבֶל désigne ici un territoire ou district; « région » est clair et naturel en français moderne.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: le royaume d’Og en Basan
  rationale: Reproduit la chaîne de détermination et situe le royaume d’Og en Basan sans ajouter de précision absente du texte.
theological_decisions:
- issue: Référent du pluriel מֵאִתָּם
  choice: Conserver le pluriel par « leur » sans en préciser le référent
  alternative: 'Harmoniser avec Og au singulier : « que nous ne lui ayons prise »'
  rationale: Le texte massorétique porte un suffixe pluriel, qui peut viser le peuple ou les forces d’Og. Le conserver respecte l’ambiguïté et évite une harmonisation interprétative.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation en deux phrases allège la longue coordination hébraïque tout en maintenant sa progression. « Basan » suit la forme française biblique courante du toponyme.
