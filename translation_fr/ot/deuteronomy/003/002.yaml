  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: fr
  text: 'Yahweh me dit : « N’aie pas peur de lui, car je les ai livrés entre tes mains : lui, tout son peuple et son pays. Tu lui feras ce que tu as fait à Sihôn, roi des Amorites, qui habitait à Heshbon. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, conformément à la pratique du projet, plutôt que de le remplacer par un titre.
- source_word: אַל תִּירָא אֹתוֹ
  choice: N’aie pas peur de lui
  rationale: Rend naturellement en français moderne l’interdiction avec son objet explicite, sans affaiblir sa force.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: je l’ai livré entre tes mains
  rationale: Le passé composé présente l’acte comme déjà accompli du point de vue divin; « livré entre tes mains » conserve l’image hébraïque de la main tout en exprimant clairement la remise au pouvoir de quelqu’un.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: lui, tout son peuple et son pays
  rationale: La reprise de « lui » clarifie que les trois compléments dépendent de « livré ». « Peuple » évite de réduire עַם à l’armée, et « pays » convient ici au territoire gouverné.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Tu lui feras ce que tu as fait
  rationale: Cette formulation française naturelle conserve le verbe général « faire » et laisse la comparaison avec le traitement de Sihôn préciser l’action.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: à Sihôn, roi des Amorites
  rationale: Préserve l’apposition et rend le gentilé collectif hébreu selon l’usage français établi.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: qui habitait à Heshbon
  rationale: Le participe ישב désigne ici la résidence; l’imparfait français s’accorde naturellement avec le récit rétrospectif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte source emploie directement le nom divin. La translittération « Yahweh » le distingue d’un titre et évite d’importer une résolution confessionnelle supplémentaire.
- issue: Valeur du parfait נָתַתִּי avant la bataille
  choice: je l’ai livré
  alternative: je le livre / je le livrerai
  rationale: Le parfait présente la remise comme accomplie et certaine dans la parole divine, sans transformer explicitement la forme en futur.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans calque excessif; « entre tes mains » conserve une image biblique encore intelligible. Les graphies « Sihôn » et « Heshbon » suivent un usage francophone biblique courant.
