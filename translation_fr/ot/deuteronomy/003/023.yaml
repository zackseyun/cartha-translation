  text: וָ/אֶתְחַנַּ֖ן אֶל יְהוָ֑ה בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: fr
  text: 'En ce temps-là, j’ai imploré Yahweh[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Souvent rendu dans les traditions françaises par « l’Éternel » ou « le Seigneur » ; autre translittération possible : « Yahvé ».'
    reason: Signaler la forme hébraïque du nom divin et les principales conventions françaises de traduction.
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: j’ai supplié
  rationale: Le hitpael de חנן exprime ici une supplication pressante, un appel à la faveur ou à la grâce. « J’ai supplié » est naturel en français moderne et conserve cette intensité.
- source_word: אֶל
  choice: Yahweh (complément direct de « supplier »)
  rationale: La préposition marque la personne vers qui se porte la supplication. En français courant, « supplier quelqu’un » se construit directement, sans préposition.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de conserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בָּעֵת הַהִוא
  choice: À cette époque-là
  rationale: Cette formulation rend naturellement la référence temporelle rétrospective sans la réduire nécessairement à un instant précis.
- source_word: לֵאמֹר
  choice: en disant
  rationale: La formule hébraïque introduit les paroles directes qui suivent au verset suivant ; « en disant » en préserve explicitement la fonction.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie ici directement le tétragramme. « Yahweh » conserve le nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, clair et digne. « Supplié » maintient la force de la demande ; « à cette époque-là » assure une reprise narrative naturelle. La ponctuation annonce la citation du verset suivant.
