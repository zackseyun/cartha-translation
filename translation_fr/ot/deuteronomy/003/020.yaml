source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: fr
  text: jusqu’à ce que Yahweh accorde le repos à vos frères comme à vous[a], et qu’eux aussi prennent possession du pays que Yahweh votre Dieu leur donne au-delà du Jourdain[b]. Alors, chacun de vous retournera dans sa part d’héritage[c], celle que je vous ai donnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à vos compatriotes israélites comme à vous ». L’hébreu dit « vos frères » pour parler ici des autres membres d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’autre côté du Jourdain ». L’expression est relative à la position du locuteur, qui se trouve à l’est du fleuve.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans son héritage » ou « dans sa part de territoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: accorde le repos
  rationale: Le hifil de נוח signifie ici « faire reposer », donc accorder repos, soulagement et sécurité. « Accorder le repos » reste naturel en français et conserve le thème deutéronomique du repos dans le pays.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: לַאֲחֵיכֶם
  choice: à vos frères
  rationale: Le pluriel masculin de אָח désigne ici les autres membres du peuple d’Israël. « Vos frères » conserve l’image de parenté et la forme du texte source; une note explicite son sens collectif.
- source_word: כָכֶם
  choice: comme à vous
  rationale: La comparaison hébraïque est elliptique. Cette formulation conserve l’ellipse tout en indiquant que les autres Israélites doivent recevoir le même repos que les tribus déjà établies.
- source_word: וְיָרְשׁוּ
  choice: prennent possession de
  rationale: ירשׁ exprime ici l’entrée effective en possession du pays. Cette formulation rend le sens concret sans réduire le terme à une transmission héréditaire passive.
- source_word: גַם הֵם
  choice: eux aussi
  rationale: Cette tournure restitue l’accent porté sur le fait que les autres tribus, elles aussi, recevront leur territoire.
- source_word: נֹתֵן
  choice: leur donne
  rationale: Le participe hébreu présente le don comme actuel et certain. Le présent français est idiomatique et garde cette valeur.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: au-delà du Jourdain
  rationale: L’expression est relative au lieu où se tient le locuteur, à l’est du fleuve, et désigne ici le territoire situé à l’ouest. La note signale la formulation alternative « de l’autre côté du Jourdain ».
- source_word: וְשַׁבְתֶּם
  choice: Alors, chacun de vous retournera
  rationale: 'Le waw fait progresser la séquence: le retour aura lieu après l’accomplissement de l’obligation militaire. Le futur exprime naturellement cette suite en français, sans ajouter explicitement une permission absente de la forme verbale.'
- source_word: אִישׁ
  choice: chacun de vous
  rationale: אִישׁ a ici une valeur distributive. « Chacun de vous » est idiomatique et correspond aux hommes auxquels Moïse s’adresse.
- source_word: לִירֻשָּׁתוֹ
  choice: dans la possession
  rationale: יְרֻשָּׁה désigne un bien reçu et détenu, notamment une part territoriale. « Possession » maintient le lien lexical avec la prise de possession mentionnée plus tôt; « héritage » reste possible.
- source_word: נָתַתִּי לָכֶם
  choice: que je vous ai donnée
  rationale: Le parfait renvoie au don déjà effectué par Moïse, dont les effets demeurent. Le passé composé français convient à cette valeur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de לַאֲחֵיכֶם
  choice: vos frères, avec une note indiquant qu’il s’agit des autres Israélites
  alternative: vos compatriotes israélites; vos frères et sœurs
  rationale: Le masculin pluriel et l’image familiale sont conservés, tandis que la note évite de faire croire qu’il s’agit seulement de frères biologiques. Le contexte immédiat vise les autres tribus engagées dans la conquête.
- issue: Force de וְשַׁבְתֶּם
  choice: retournera, comme événement consécutif annoncé
  alternative: pourra retourner; retournera donc
  rationale: La forme verbale indique nettement la suite des événements, mais n’encode pas à elle seule une modalité explicite de permission. Le futur français préserve cette sobriété.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression temporelle de l’hébreu, le nom divin « Yahweh », l’image fraternelle et l’écho entre « prendre possession » et « possession », tout en évitant des tournures inutilement archaïques.
