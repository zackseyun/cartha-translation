source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: fr
  text: 'Mais Yahweh s’est irrité contre moi à cause de vous[a] et ne m’a pas écouté. Yahweh m’a dit : « Cela suffit[b] ! Ne me parle plus de cette affaire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à votre sujet » ; littéralement, l’expression peut aussi se rendre par « pour vous » ou « à cause de vous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Assez pour toi ! », formule exprimant ici un refus ferme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: s’est irrité
  rationale: Le hitpael de עבר, dans cette expression avec Yahweh pour sujet, exprime la colère. « S’est irrité » est naturel, digne et ne renforce pas indûment l’intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: בִּי
  choice: contre moi
  rationale: Avec le verbe exprimant la colère, « s’irriter contre quelqu’un » est la construction française naturelle.
- source_word: לְמַעַנְכֶם
  choice: à cause de vous
  rationale: Dans ce contexte, l’expression indique que Moïse attribue la colère de Yahweh au comportement du peuple. La note conserve l’autre nuance possible.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: et ne m’a pas écouté
  rationale: שׁמע avec אֶל signifie ici écouter ou donner suite à la requête de quelqu’un.
- source_word: רַב לָךְ
  choice: Cela suffit !
  rationale: Cette formule brève exprime une fin de non-recevoir ferme. « Cela suffit ! » en restitue naturellement la force en français, tandis que la note signale la forme hébraïque.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: Ne me parle plus
  rationale: La construction יסף avec l’infinitif, renforcée par עוֹד, interdit de continuer ou de recommencer à parler du sujet.
- source_word: בַּדָּבָר הַזֶּה
  choice: de cette affaire
  rationale: דבר désigne ici la question dont Moïse vient de parler; « cette affaire » est idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Responsabilité du peuple dans la colère de Yahweh contre Moïse
  choice: à cause de vous
  alternative: pour vous / à votre sujet
  rationale: La lecture causale convient au contexte immédiat, mais לְמַעַן peut porter une nuance plus large; celle-ci est conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation rend la fermeté de la réponse divine sans ajouter de contenu; les ambiguïtés lexicales de לְמַעַנְכֶם et de רַב לָךְ sont conservées en notes.
