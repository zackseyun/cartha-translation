  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: fr
  text: Mais donne des instructions à Josué[a], fortifie-le et encourage-le[b], car c’est lui qui passera devant ce peuple et qui leur donnera le pays en héritage[c] que tu verras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donne mission à Josué » ou « charge Josué ». Le verbe hébreu peut désigner le fait de donner à quelqu’un une charge officielle.
    reason: lexical_alternative
  - marker: b
    text: Ou « rends-le fort et courageux ». Les deux verbes hébreux associent fermeté et courage.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « qui les fera entrer en possession du pays ». Le verbe hébreu est causatif : Josué sera l’agent par lequel le peuple recevra le pays comme héritage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: confie à Josué sa mission
  rationale: Le piel impératif de צוה exprime ici une charge officielle donnée à Josué en vue de sa responsabilité de chef. Cette formulation française est naturelle et fait ressortir l’idée de mandat sans réduire le verbe à un simple ordre ponctuel.
- source_word: וְחַזְּקֵהוּ
  choice: fortifie-le
  rationale: Le piel de חזק signifie rendre fort ou affermir. « Fortifie-le » conserve la valeur causative et l’impératif.
- source_word: וְאַמְּצֵהוּ
  choice: encourage-le
  rationale: Dans son association avec חזק, אמץ évoque le fait de donner courage et fermeté. « Encourage-le » distingue les deux verbes tout en restant idiomatique.
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: car c’est lui qui traversera à la tête de ce peuple
  rationale: עבר renvoie dans ce contexte à la traversée du Jourdain. לִפְנֵי indique à la fois la position en avant du peuple et le rôle de chef; « à la tête de » exprime naturellement ces deux dimensions.
- source_word: וְהוּא יַנְחִיל אוֹתָם אֶת־הָאָרֶץ
  choice: et qui leur donnera en héritage le pays
  rationale: 'Le hiphil de נחל est causatif: Josué sera l’agent par lequel le peuple recevra le pays en héritage. Cette formulation conserve le vocabulaire de l’héritage dans un français naturel.'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: que tu verras
  rationale: L’imparfait hébreu a ici une valeur future et désigne le pays que Moïse sera autorisé à contempler.
theological_decisions:
- issue: Le rôle de Josué dans la remise du pays en héritage
  choice: « qui leur donnera en héritage le pays » présente Josué comme l’agent de cette prise de possession
  alternative: « qui les fera entrer en possession du pays »
  rationale: Le causatif hébreu attribue réellement une action à Josué sans nier que, dans le contexte plus large du Deutéronome, Dieu demeure celui qui donne le pays. La traduction ne précise pas davantage ce rapport afin de préserver la formulation du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Confie à Josué sa mission » rend la charge officielle de façon idiomatique; « à la tête de ce peuple » exprime naturellement la position et la fonction de chef. Le vocabulaire de l’héritage est maintenu malgré une légère explicitation idiomatique.
