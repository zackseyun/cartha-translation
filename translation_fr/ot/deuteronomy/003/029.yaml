  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: fr
  text: Nous sommes restés dans la vallée, en face de Beth-Péor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et nous avons habité dans la vallée, face à Beth-Péor. »'
    reason: Alternative lexicale pour le verbe יָשַׁב et restitution explicite de la continuation narrative marquée par וַ־.
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: Nous sommes donc restés
  rationale: Le verbe יָשַׁב, à l’imparfait consécutif, poursuit le récit au passé. « sommes restés » exprime naturellement ici le séjour dans un lieu, tandis que « donc » rend la continuité narrative en contexte.
- source_word: בַּגָּיְא
  choice: dans la vallée
  rationale: גַּיְא peut désigner une vallée, un ravin ou une gorge. « vallée » reste le terme français le plus large et le plus naturel sans préciser indûment la topographie.
- source_word: מוּל
  choice: en face de
  rationale: מוּל indique une position vis-à-vis d’un lieu, en face ou à l’opposé. « en face de » est idiomatique et conserve la relation spatiale.
- source_word: בֵּית פְּעוֹר
  choice: Beth-Péor
  rationale: Il s’agit d’un nom de lieu, qui est donc translittéré plutôt que traduit. L’accent facilite la prononciation française et le trait d’union unit les deux éléments du toponyme.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la sobriété narrative de l’hébreu et évite de surdéterminer la durée du séjour ou la forme précise du relief.
