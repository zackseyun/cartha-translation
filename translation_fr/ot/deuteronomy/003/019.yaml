id: DEU.3.19
reference: Deuteronomy 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֠ק נְשֵׁי/כֶ֣ם וְ/טַפְּ/כֶם֮ וּ/מִקְנֵ/כֶם֒ יָדַ֕עְתִּי כִּֽי מִקְנֶ֥ה רַ֖ב לָ/כֶ֑ם יֵֽשְׁבוּ֙ בְּ/עָ֣רֵי/כֶ֔ם אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: fr
  text: Seuls vos femmes, vos jeunes enfants[a] et vos troupeaux — je sais que vous avez de nombreux troupeaux — resteront dans les villes[b] que je vous ai données.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vos personnes à charge». Le terme hébreu désigne principalement les jeunes enfants, mais peut englober les dépendants.
    reason: lexical_alternative
  - marker: b
    text: Ou «localités». Le mot hébreu peut désigner des agglomérations de tailles diverses.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Seuls
  rationale: Introduit l’exception à l’ordre précédent et en conserve la force restrictive dans une formulation française naturelle.
- source_word: נְשֵׁיכֶם
  choice: vos femmes
  rationale: Dans ce contexte familial, le terme désigne les épouses; «vos femmes» est idiomatique et digne en français moderne.
- source_word: טַפְּכֶם
  choice: vos jeunes enfants
  rationale: Le terme hébreu désigne les petits enfants, et parfois plus largement les personnes à charge; «jeunes enfants» en rend ici le sens concret sans archaïsme.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: vos troupeaux / de nombreux troupeaux
  rationale: מִקְנֶה couvre l’ensemble des animaux domestiques possédés, pas seulement les bovins. La répétition française reflète celle de l’hébreu.
- source_word: יָדַעְתִּי כִּי
  choice: je sais que
  rationale: Conserve directement l’affirmation à la première personne; les tirets indiquent naturellement la valeur explicative de l’incise.
- source_word: יֵשְׁבוּ
  choice: resteront
  rationale: Le verbe signifie littéralement «s’asseoir, demeurer»; ici, il s’oppose au départ des hommes pour combattre, d’où «resteront».
- source_word: בְּעָרֵיכֶם
  choice: dans les villes
  rationale: עִיר peut désigner une ville ou une localité de taille variable. «Villes» est le terme biblique français courant, avec une note qui préserve l’amplitude du mot hébreu.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: que je vous ai données
  rationale: Le passé composé exprime un don accompli dont les effets demeurent; l’accord féminin renvoie à «villes».
