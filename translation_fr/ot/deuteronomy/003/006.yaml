    rationale: '« en vouant entièrement à la destruction chaque ville : hommes, femmes et jeunes enfants » juxtapose des personnes à « chaque ville » après un deux-points. Le texte hébreu vise la destruction totale, ville après ville, des hommes, femmes et enfants; il convient de rendre ce rapport explicitement sans absorber « hommes » dans « villes habitées ».'
  - severity: low
    issue: Formulation de la note alternative
    rationale: « Mis sous l’interdit » est une formulation française plus usuelle comme équivalent explicatif de « under the ban » que le participe isolé « frappés d’interdit ».
