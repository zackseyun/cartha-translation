base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: fr
  text: Nous les avons voués à la destruction[a], comme nous l’avions fait à Sihôn, roi de Heshbon, en vouant entièrement à la destruction chaque ville, avec les hommes, les femmes et les jeunes enfants qui s’y trouvaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mis sous l’interdit ». Le verbe hébreu חרם est un terme technique signifiant vouer une personne ou une chose à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם אֹתָם
  choice: Nous les avons voués à la destruction
  rationale: Le verbe חרם au hifil est un terme technique indiquant que des personnes ou des biens sont consacrés à une destruction totale. Cette formulation en conserve la portée sans employer dans le texte principal l’expression moins transparente « frapper d’interdit ».
- source_word: כַּאֲשֶׁר עָשִׂינוּ לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: comme nous l’avions fait à Sihôn, roi de Heshbon
  rationale: Le plus-que-parfait exprime naturellement l’action antérieure rappelée par le récit; « faire à » garde ici l’objet affecté marqué par ל.
- source_word: הַחֲרֵם
  choice: en vouant entièrement à la destruction
  rationale: L’infinitif absolu reprend et renforce le verbe חרם. La répétition française préserve à la fois son sens technique et sa force totalisante.
- source_word: כָּל עִיר
  choice: chaque ville
  rationale: עיר désigne ici une ville; « chaque » rend la portée distributive de כָּל dans ce contexte.
- source_word: מְתִם
  choice: hommes
  rationale: Le substantif désigne les personnes de sexe masculin et forme ici une série explicite avec les femmes et les jeunes enfants; il ne convient donc pas de l’absorber dans l’adjectif « habitée ».
- source_word: הַנָּשִׁים
  choice: femmes
  rationale: Équivalent français direct et naturel.
- source_word: וְהַטָּף
  choice: et jeunes enfants
  rationale: טף désigne les petits enfants ou les personnes à charge; « jeunes enfants » exprime clairement le sens dans cette énumération.
theological_decisions:
- issue: Rendu du vocabulaire de חרם dans un contexte de guerre et de jugement
  choice: Employer « vouer à la destruction » dans les deux occurrences, avec « entièrement » pour rendre l’intensification.
  alternative: « exterminer complètement » ou « frapper d’interdit »
  rationale: Le texte décrit sans l’atténuer une destruction totale relevant du חרם. « Vouer à la destruction » conserve la dimension technique du terme, tandis que « entièrement » rend la force de l’infinitif absolu; la variante « frapper d’interdit » est signalée en note parce qu’elle est moins immédiatement claire.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation ne dissimule pas la violence du verset. Les noms propres suivent des formes françaises courantes; la ponctuation introduit clairement l’énumération finale.
