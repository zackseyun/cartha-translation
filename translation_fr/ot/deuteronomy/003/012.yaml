language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את יָרַ֖שְׁנוּ בָּ/עֵ֣ת הַ/הִ֑וא מֵ/עֲרֹעֵ֞ר אֲשֶׁר עַל נַ֣חַל אַרְנֹ֗ן וַ/חֲצִ֤י הַֽר הַ/גִּלְעָד֙ וְ/עָרָ֔י/ו נָתַ֕תִּי לָ/רֻֽאוּבֵנִ֖י וְ/לַ/גָּדִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: fr
  text: À cette époque, nous avons pris possession de ce territoire, depuis Aroër, qui se trouve au bord de la vallée de l’Arnon[a], ainsi que de la moitié de la région montagneuse de Galaad, avec ses villes[b]. Je l’ai donné aux Rubénites et aux Gadites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « près de l’oued de l’Arnon » ou « au bord du ravin de l’Arnon ». Le mot hébreu נחל peut désigner un oued, un ravin ou une vallée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la moitié du mont Galaad ». Dans les descriptions territoriales, le mot hébreu הַר peut désigner toute une région montagneuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: nous avons pris possession de
  rationale: Dans ce contexte de conquête et d’attribution territoriale, ירשׁ exprime l’entrée en possession effective plutôt qu’un héritage reçu passivement.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce territoire
  rationale: « Territoire » rend naturellement la terre conquise et délimitée dont il est question ici.
- source_word: בָּעֵת הַהִוא
  choice: À cette époque
  rationale: Formulation française courante et digne pour cette indication temporelle.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: depuis Aroër, qui se trouve au bord de la vallée de l’Arnon
  rationale: La proposition relative est conservée. עַל indique ici la situation d’Aroër au bord de la vallée ou du ravin associé à l’Arnon.
- source_word: נַחַל
  choice: vallée
  rationale: Dans cette description géographique, נחל désigne le lit encaissé ou la vallée de l’Arnon. « Vallée » reste accessible, tandis que la note signale les rendus plus précis possibles.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: ainsi que de la moitié de la région montagneuse de Galaad
  rationale: הַר peut désigner une zone montagneuse et non une montagne isolée. Le contexte territorial et la mention des villes favorisent ce sens régional.
- source_word: וְעָרָיו
  choice: avec ses villes
  rationale: Le suffixe renvoie à la région de Galaad; « avec ses villes » s’intègre naturellement à l’énumération territoriale.
- source_word: נָתַתִּי
  choice: Je l’ai donné
  rationale: Le passage du pluriel « nous » au singulier « je » est maintenu. Le pronom reprend le territoire décrit.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: aux Rubénites et aux Gadites
  rationale: Les gentilés morphologiquement singuliers ont ici une valeur collective et désignent les deux groupes tribaux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu. La formulation conserve le changement de personne entre « nous avons pris possession » et « Je l’ai donné », ainsi que l’étendue territoriale introduite par « depuis ».
