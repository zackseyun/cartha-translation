  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: fr
  text: Seigneur Yahweh[a], tu as commencé à montrer à ton serviteur ta grandeur et ta main puissante. Car quel dieu, au ciel ou sur la terre, pourrait accomplir des œuvres semblables aux tiennes et des exploits tels que les tiens ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Adonaï YHWH », c’est-à-dire le titre « Seigneur » suivi du nom divin Yahweh.'
    reason: Préciser la combinaison inhabituelle d’un titre divin et du nom propre de Dieu.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: L’hébreu associe le titre אֲדֹנָי, « Seigneur », au nom divin יהוה. « Seigneur Yahweh » distingue clairement le titre du nom propre et reste intelligible en français.
- source_word: הַחִלּוֹתָ
  choice: tu as commencé
  rationale: Le hifil accompli exprime ici le commencement d’une action dont la portée se poursuit au moment de la prière.
- source_word: לְהַרְאוֹת
  choice: à montrer
  rationale: Le hifil de ראה signifie « faire voir », rendu naturellement en français par « montrer ».
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette prière adressée à Dieu, « serviteur » rend naturellement la position de dépendance et de fidélité exprimée par עבד.
- source_word: גָּדְלְךָ
  choice: ta grandeur
  rationale: Traduction directe qui conserve l’idée d’immensité et de majesté sans la préciser excessivement.
- source_word: יָדְךָ הַחֲזָקָה
  choice: la force de ta main
  rationale: Cette formulation française préserve l’image biblique de la main tout en exprimant naturellement l’adjectif « forte ».
- source_word: מִי אֵל
  choice: quel dieu
  rationale: La question rhétorique porte sur l’existence d’une divinité comparable à Yahweh; « quel dieu » en restitue clairement la force.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: au ciel ou sur la terre
  rationale: Dans la question rhétorique française, « ou » exprime naturellement la totalité des domaines envisagés, bien que l’hébreu emploie formellement « et ».
- source_word: יַעֲשֶׂה
  choice: pourrait accomplir
  rationale: L’inaccompli a ici une valeur de possibilité dans une comparaison rhétorique; le conditionnel traduit naturellement l’idée de capacité.
- source_word: כְמַעֲשֶׂיךָ
  choice: des œuvres semblables aux tiennes
  rationale: « Œuvres » rend מעשים dans un registre digne et actuel; « semblables aux tiennes » conserve la comparaison explicite.
- source_word: וְכִגְבוּרֹתֶיךָ
  choice: et des exploits tels que les tiens
  rationale: גבורות désigne des manifestations éclatantes de puissance; « exploits » conserve cette nuance et le parallélisme avec « œuvres ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU; Seigneur, l’Éternel
  rationale: Le texte contient à la fois le titre « Seigneur » et le nom divin YHWH. Garder « Yahweh » évite de confondre les deux et représente explicitement le nom de l’alliance sans imposer une interprétation confessionnelle.
- issue: Portée de la question sur les autres dieux
  choice: quel dieu… pourrait accomplir
  alternative: qui est Dieu… qui accomplisse
  rationale: La formulation conserve le caractère rhétorique et comparatif de l’hébreu sans transformer le verset en énoncé ontologique plus explicite que le texte source.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe de la prière biblique. La syntaxe conserve le parallélisme poétique tout en évitant des tours artificiels.
