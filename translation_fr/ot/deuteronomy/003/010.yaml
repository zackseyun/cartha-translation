  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: fr
  text: toutes les villes du plateau[a], tout le Galaad et tout le Basan, jusqu’à Salka et Édréi, les villes du royaume d’Og au Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la plaine » ou « du haut plateau ». Le terme hébreu désigne ici la région plane et élevée située à l’est du Jourdain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: toutes les villes du plateau
  rationale: Le quantificateur כֹּל porte sur les villes, et מִישׁוֹר désigne ici la région plane et élevée située à l’est du Jourdain. « Plateau » en exprime naturellement la topographie en français moderne.
- source_word: וְכָל הַגִּלְעָד
  choice: tout le Galaad
  rationale: Le nom géographique est rendu selon sa forme française traditionnelle, tandis que כֹּל marque l’ensemble de la région.
- source_word: וְכָל הַבָּשָׁן
  choice: et tout le Bashan
  rationale: Translittération française courante du nom régional; כֹּל conserve l’idée d’intégralité.
- source_word: עַד
  choice: jusqu’à
  rationale: Cette préposition marque ici la limite de l’étendue géographique.
- source_word: סַלְכָה
  choice: Salka
  rationale: Translittération française claire et proche de la forme hébraïque.
- source_word: אֶדְרֶעִי
  choice: Édréi
  rationale: Forme française usuelle du toponyme, avec accents facilitant sa prononciation.
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  choice: les villes du royaume d’Og
  rationale: Le groupe construit indique les villes appartenant au royaume d’Og; l’article français rend l’apposition définie de façon naturelle.
- source_word: בַּבָּשָׁן
  choice: en Bashan
  rationale: La préposition בְּ indique la localisation du royaume en Bashan.
