  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: fr
  text: Monte au sommet du Pisga et lève les yeux vers l’ouest[a], le nord, le sud et l’est. Regarde de tes propres yeux, car tu ne traverseras pas ce Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la mer », manière habituelle de désigner l’ouest.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « ce fleuve Jourdain ». L’hébreu dit simplement : « ce Jourdain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Monte
  rationale: Impératif qal de עלה. « Monte » exprime directement et naturellement le déplacement vers le haut.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: au sommet du Pisga
  rationale: רֹאשׁ désigne ici le sommet, tandis que הַפִּסְגָּה est compris comme le nom géographique Pisga. Cette formulation est idiomatique en français.
- source_word: וְשָׂא עֵינֶיךָ
  choice: porte tes regards
  rationale: L’expression hébraïque signifie diriger ou lever les yeux. « Porte tes regards » conserve un registre littéraire digne tout en restant clair.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: La forme directionnelle dérivée de ים, « mer », désigne conventionnellement l’ouest dans ce contexte géographique. Une note signale le sens littéral.
- source_word: וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: le nord, le sud et l’est
  rationale: Les trois formes directionnelles indiquent les points cardinaux. La préposition « vers », placée avant la série, porte naturellement sur chacun d’eux.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: Regarde de tes propres yeux
  rationale: Cette formulation maintient la répétition emphatique de l’idée des yeux, sans produire en français le tour moins naturel « vois avec tes yeux ».
- source_word: כִּי לֹא תַעֲבֹר
  choice: car tu ne traverseras pas
  rationale: כִּי introduit ici la raison de l’ordre donné. Le futur simple rend naturellement l’interdiction ou la certitude annoncée dans ce contexte.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ce Jourdain
  rationale: Le démonstratif הַזֶּה est conservé. « Jourdain » suffit en français, mais une note donne l’explicitation possible « ce fleuve, le Jourdain ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse directe à Moïse. La répétition hébraïque autour des yeux est préservée sous une forme idiomatique, et la série des quatre directions reste nette.
