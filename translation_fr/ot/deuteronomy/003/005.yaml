source:
  edition: WLC
  text: כָּל אֵ֜לֶּה עָרִ֧ים בְּצֻר֛וֹת חוֹמָ֥ה גְבֹהָ֖ה דְּלָתַ֣יִם וּ/בְרִ֑יחַ לְ/בַ֛ד מֵ/עָרֵ֥י הַ/פְּרָזִ֖י הַרְבֵּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/005.yaml
  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: fr
  text: Toutes ces villes étaient fortifiées, avec une haute muraille, des portes à deux battants et des barres, sans compter un très grand nombre de villes non fortifiées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « villes de la campagne » ou « villes ouvertes ». L’hébreu oppose ces agglomérations aux villes fortifiées qui viennent d’être décrites.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: fortifiées
  rationale: L’adjectif désigne des villes renforcées contre les attaques; « fortifiées » est précis, naturel et adapté au contexte militaire.
- source_word: חוֹמָה גְבֹהָה
  choice: avec une haute muraille
  rationale: Le singulier hébreu est conservé naturellement en français et évoque l’enceinte défensive de chacune des villes.
- source_word: דְּלָתַיִם
  choice: des portes à deux battants
  rationale: La forme duelle désigne les deux vantaux d’une entrée. Cette formulation préserve cette nuance tout en indiquant clairement qu’il s’agit des portes des villes.
- source_word: וּבְרִיחַ
  choice: et des barres
  rationale: Dans cette énumération d’ouvrages défensifs, le singulier peut avoir une valeur collective; « barres » désigne naturellement les dispositifs servant à bloquer les portes.
- source_word: לְבַד
  choice: sans compter
  rationale: L’expression introduit ici les nombreuses autres agglomérations en plus des villes fortifiées; « sans compter » rend naturellement cette valeur additive.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: de villes non fortifiées
  rationale: Le syntagme désigne des agglomérations ouvertes, dépourvues d’enceinte, par contraste direct avec les villes fortifiées qui précèdent.
- source_word: הַרְבֵּה מְאֹד
  choice: un très grand nombre
  rationale: Cette formulation française courante conserve l’intensification marquée par מְאֹד.
- source_word: כָּל אֵלֶּה עָרִים
  choice: Toutes ces villes étaient
  rationale: Le français exige une copule; cet ordre reste naturel et conserve l’accent porté sur la totalité des villes mentionnées.
