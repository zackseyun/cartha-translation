  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: fr
  text: ainsi que l’Araba, avec le Jourdain pour frontière, depuis Kinnéreth jusqu’à la mer de l’Araba, la mer Salée[a], au-dessous des pentes du Pisga, vers l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la mer Morte.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: l’Araba
  rationale: Le terme désigne ici la région géographique reconnue de la dépression du Jourdain, plutôt qu’une simple plaine.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Nom géographique français courant; l’ajout de « fleuve » n’est pas nécessaire dans cette délimitation.
- source_word: גְבֻל
  choice: pour frontière
  rationale: Le substantif signifie « frontière, limite »; cette formulation restitue naturellement en français la syntaxe elliptique de l’hébreu.
- source_word: מִכִּנֶּרֶת
  choice: depuis Kinnéreth
  rationale: Le texte hébreu donne simplement le nom de lieu; la traduction évite de préciser s’il s’agit de la ville, de la région ou du lac.
- source_word: יָם הָעֲרָבָה
  choice: la mer de l’Araba
  rationale: Traduction proche de la désignation hébraïque, conservée avant l’apposition explicative « la mer Salée ».
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Cette expression reproduit le nom hébreu, plutôt que de lui substituer directement le nom moderne « mer Morte ».
- source_word: תַּחַת אַשְׁדֹּת הַפִּסְגָּה
  choice: au pied des pentes du Pisga
  rationale: Dans ce contexte topographique, תַּחַת indique une position en contrebas et אַשְׁדֹּת des pentes ou déclivités; « au pied des pentes » est naturel sans imposer un point cardinal.
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: Rend clairement l’orientation indiquée par l’adverbe hébreu sans préciser abusivement son rattachement syntaxique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms géographiques sont translittérés selon des formes françaises lisibles. La phrase conserve la structure de liste du contexte et l’ambiguïté référentielle de Kinnéreth. La note sur une graphie anglaise alternative de Kinnereth/Chinnereth n’est pas reprise, car elle ne constitue pas une variante pertinente en français.
