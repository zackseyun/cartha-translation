source:
  edition: WLC
  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: fr
  text: Mais l’homme qui agit avec arrogance en refusant d’écouter le prêtre qui se tient là pour servir Yahweh, ton Dieu, ou le juge, cet homme-là mourra. Tu élimineras ainsi le mal du milieu d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: Mais l’homme
  rationale: La conjonction poursuit la disposition précédente tout en introduisant le cas contraire, celui du contrevenant. « L’homme » conserve le singulier masculin du texte.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: agit avec arrogance
  rationale: L’expression décrit une conduite délibérée, insolente et défiante, et non une faute commise par inadvertance.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: en refusant d’écouter
  rationale: Dans ce contexte juridique, שמע implique que l’on prête attention et obéisse. « En refusant d’écouter » rend explicite le caractère volontaire du refus sans remplacer entièrement l’image hébraïque de l’écoute.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: qui se tient là pour servir
  rationale: La formulation conserve le participe « se tenir » et l’idée du service cultuel officiel du prêtre, dans un français naturel.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: 'Le marqueur אֶת introduit ici le complément de שׁרת : le prêtre sert Yahweh. Le nom divin est translittéré et la deuxième personne du singulier est conservée.'
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: cet homme-là mourra
  rationale: Le futur français exprime directement la conséquence pénale prescrite, tandis que « cet homme-là » reproduit l’insistance démonstrative.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: Tu élimineras ainsi le mal du milieu d’Israël
  rationale: La formule juridique récurrente de Deutéronome commande d’ôter le mal de la communauté. « Du milieu d’Israël » explicite naturellement la séparation indiquée par מן.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de שׁמע dans une décision juridique
  choice: refusant d’écouter
  alternative: refusant d’obéir
  rationale: L’obéissance est nettement impliquée, mais conserver « écouter » préserve le lexème hébreu et la tension entre audition et soumission à la décision autorisée.
- issue: Désignation genrée du contrevenant
  choice: l’homme / cet homme-là
  alternative: la personne / cette personne
  rationale: אִישׁ et les formes qui le reprennent sont au masculin singulier; la traduction conserve cette forme sans généralisation neutre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste ferme sans archaïsmes. Aucun appel de note n’est nécessaire, puisque les ambiguïtés principales sont conservées ou rendues directement dans le texte.
