- from: Si une affaire à juger est trop difficile pour toi — qu’il s’agisse de distinguer un cas de sang versé d’un autre[a], une revendication juridique d’une autre[b], ou une atteinte d’une autre[c] —, si ce sont des sujets de contestation dans tes villes[d], alors tu te lèveras et tu monteras au lieu que Yahweh ton Dieu choisira.
  to: Si, dans tes villes, une affaire litigieuse est trop difficile à juger pour toi — qu’il s’agisse de distinguer un cas de sang versé d’un autre[a], une cause juridique d’une autre[b], ou un cas d’atteinte d’un autre[c] —, tu te lèveras et tu monteras au lieu que Yahweh, ton Dieu, choisira.
  rationale: La révision intègre « matières de litiges dans tes portes » à la présentation de l’affaire, au lieu d’en faire une condition distincte. « Dans tes villes » explicite la métonymie de « tes portes » et la note d conserve l’image et l’information culturelle. Les notes a à c préservent les ambiguïtés lexicales pertinentes.
