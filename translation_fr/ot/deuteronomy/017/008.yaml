  terminology: « Yahweh » est conforme à la source. « Cause juridique » est plus idiomatique que « revendication juridique » dans ce contexte. « Cas d’atteinte » conserve l’ambiguïté de נֶגַע sans imposer « blessure », « affection » ou « fléau ».
