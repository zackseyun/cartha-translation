  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: fr
  text: Si, dans tes villes, une affaire litigieuse est trop difficile à juger pour toi — qu’il s’agisse de distinguer un cas de sang versé d’un autre[a], une cause juridique d’une autre[b], ou un cas d’atteinte d’un autre[c] —, tu te lèveras et tu monteras au lieu que Yahweh, ton Dieu, choisira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre sang et sang ». Il s’agit de distinguer différents cas où du sang a été versé, notamment des affaires d’homicide ou de responsabilité pour le sang versé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une revendication juridique d’une autre » ou « un jugement d’un autre ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut aussi désigner une blessure, une affection ou un fléau.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּלֵא
  choice: est trop difficile pour toi
  rationale: Dans ce contexte judiciaire, le niphal de פלא indique qu’une affaire dépasse la capacité du juge local à trancher.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: une affaire à juger
  rationale: Cette expression française naturelle conserve le sens large de דָבָר tout en rendant explicite son cadre judiciaire.
- source_word: בֵּין דָּם לְדָם
  choice: distinguer un cas de sang versé d’un autre
  rationale: La formulation explicite la fonction de בֵּין répété et rend intelligible l’expression littérale « entre sang et sang », sans la réduire exclusivement à l’homicide.
- source_word: בֵּין דִּין לְדִין
  choice: une revendication juridique d’une autre
  rationale: דִּין peut désigner une cause, une prétention ou un jugement. « Revendication juridique » maintient ici la nuance contentieuse et la distingue de l’affaire générale mentionnée au début.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: une atteinte d’une autre
  rationale: « Atteinte » garde une certaine largeur sémantique, car נֶגַע peut désigner un coup, une blessure, une affection ou un fléau.
- source_word: דִּבְרֵי רִיבֹת
  choice: des sujets de contestation
  rationale: Cette formulation naturelle traduit les affaires donnant lieu à querelle ou litige.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Littéralement « dans tes portes » ; par métonymie, les portes représentent les villes et leurs juridictions locales. Le sens est donné dans le texte et l’image culturelle en note.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: tu te lèveras et tu monteras
  rationale: La traduction conserve les deux verbes ainsi que la nuance d’ascension vers le lieu central choisi.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: le lieu que … choisira
  rationale: Le futur correspond à l’orientation prospective du yiqtol dans la formulation deutéronomique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre et le distingue du titre אֲדֹנָי.
- issue: Portée de נֶגַע dans la liste judiciaire
  choice: atteinte
  alternative: blessure ; affection ; fléau
  rationale: Le terme hébreu demeure polysémique. « Atteinte » évite de décider sans certitude entre un dommage corporel et une affection pathologique, tandis que la note conserve les principales possibilités.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La phrase conserve la structure solennelle de l’instruction légale, tout en explicitant la comparaison introduite par les trois occurrences de « entre ». Les ambiguïtés de דִּין et נֶגַע sont signalées sans imposer une interprétation unique.
