  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: fr
  text: Elle sera avec lui, et il y lira[a] tous les jours de sa vie, afin qu’il apprenne à craindre[b] Yahweh[c], son Dieu, à observer toutes les paroles de cette loi et ces prescriptions, et à les mettre en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il lira en elle », c’est-à-dire dans la copie de la loi.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « révérer » ; le verbe hébreu peut exprimer à la fois la crainte, le profond respect et la vénération.'
    reason: lexical_alternative
  - marker: c
    text: « Yahweh » représente le nom divin YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Elle restera auprès de lui
  rationale: Le pronom féminin renvoie à la copie de la loi mentionnée au verset précédent. « Restera auprès de lui » exprime naturellement la possession et l’accès durables impliqués par l’hébreu.
- source_word: וְקָרָא בוֹ
  choice: et il y lira
  rationale: 'Le pronom adverbial « y » restitue naturellement la préposition בְּ : le roi lira dans cette copie, sans rendre la phrase artificielle en français.'
- source_word: כָּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: Cette formulation conserve l’expression hébraïque complète et son insistance sur une pratique qui dure toute la vie.
- source_word: לְמַעַן יִלְמַד
  choice: afin qu’il apprenne
  rationale: La construction exprime le but de cette lecture régulière ; « afin que » en rend clairement la valeur finale.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: à craindre Yahweh, son Dieu
  rationale: « Craindre » préserve la gamme de sens de ירא, qui comprend crainte, respect profond et soumission, sans la réduire à la seule révérence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter directement le tétragramme hébreu plutôt que de le remplacer par un titre.
- source_word: לִשְׁמֹר
  choice: à observer
  rationale: Dans ce contexte d’alliance et de commandements, שׁמר signifie respecter fidèlement les exigences de la loi ; « observer » est l’expression juridique et biblique naturelle en français.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: toutes les paroles de cette loi
  rationale: « Loi » convient au contexte juridique immédiat de Deutéronome, tandis que « toutes les paroles » conserve la formulation concrète du texte hébreu.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ces prescriptions
  rationale: « Prescriptions » rend le caractère normatif de חֻקִּים dans un français moderne et accessible, sans archaïsme inutile.
- source_word: לַעֲשֹׂתָם
  choice: et à les mettre en pratique
  rationale: Littéralement « les faire » ; « les mettre en pratique » restitue en français courant l’idée d’exécuter concrètement les paroles et prescriptions.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le représente comme nom propre et évite de le remplacer silencieusement par le titre « Seigneur ».
- issue: Portée de ירא dans le contexte de l’alliance
  choice: craindre
  alternative: révérer ; respecter profondément
  rationale: « Craindre » maintient la tension biblique entre crainte, respect, vénération et obéissance, au lieu de sélectionner une seule nuance.
- issue: Rapport entre l’apprentissage, la crainte et l’obéissance
  choice: 'maintien de la série d’infinitifs : apprendre à craindre, à observer et à mettre en pratique'
  alternative: apprendre à craindre Yahweh en observant la loi
  rationale: La formulation conserve la structure ouverte de l’hébreu et n’impose pas un rapport instrumental exclusif entre l’observance et la crainte.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence hébraïque est conservée sans calque lourd ; « il y lira » et « mettre en pratique » assurent une formulation idiomatique. Les notes rendent visibles les nuances lexicales importantes et l’emploi du nom divin.
