id: DEU.17.6
reference: Deuteronomy 17:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: fr
  text: C’est sur la déposition de deux témoins ou de trois témoins[a] que sera mis à mort celui qui doit mourir[b] ; il ne sera pas mis à mort sur la déposition d’un seul témoin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la bouche de deux témoins ou de trois témoins ». Cette expression hébraïque désigne ici une déposition ou un témoignage en justice.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui est destiné à mourir » ; c’est-à-dire la personne passible de la peine capitale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: sur la déposition de
  rationale: Littéralement « sur la bouche de ». Dans ce contexte judiciaire, l’expression désigne le témoignage légal ; « sur la déposition de » restitue naturellement cette valeur en français.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: deux témoins ou de trois témoins
  rationale: La répétition de « témoins » reproduit la formulation juridique insistante de l’hébreu.
- source_word: יוּמַת
  choice: sera mis à mort
  rationale: 'Le hofal de מות a une valeur passive causative : la personne est mise à mort dans le cadre d’une décision judiciaire, et ne fait pas que mourir.'
- source_word: הַמֵּת
  choice: celui qui doit mourir
  rationale: Le participe substantivé est elliptique et désigne ici la personne passible de la peine capitale, non un homme déjà mort. Cette formulation conserve l’expression du texte sans ajouter explicitement « condamné ».
- source_word: לֹא יוּמַת
  choice: il ne sera pas mis à mort
  rationale: La reprise du même verbe maintient le parallélisme et exprime clairement l’interdiction légale.
- source_word: עֵד אֶחָד
  choice: un seul témoin
  rationale: « Un seul témoin » rend avec naturel l’insistance restrictive du contraste entre un témoin et les deux ou trois exigés.
theological_decisions:
- issue: Référent et portée de הַמֵּת dans une loi concernant la peine capitale
  choice: « celui qui doit mourir », c’est-à-dire la personne passible de la peine capitale
  alternative: « le condamné » ou, littéralement mais hors contexte, « le mort »
  rationale: Le verset fixe le nombre de témoins requis pour une exécution. « Le mort » contredirait ce cadre, tandis que « le condamné » expliciterait davantage que l’hébreu une conclusion judiciaire déjà acquise. Le choix retenu préserve l’ellipse et la tension du texte.
translation_notes:
  register: Français moderne, digne et juridique sans archaïsme. La tournure clivée « C’est sur… que » met en relief le fondement probatoire comme en hébreu. La répétition de « témoins » et de « mis à mort » conserve le caractère formel et solennel de la loi.
