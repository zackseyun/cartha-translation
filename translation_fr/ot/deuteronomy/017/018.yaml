base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: fr
  text: Lorsqu’il prendra place sur le trône de son royaume, il écrira pour lui-même, sur un rouleau, une copie de cette loi, d’après l’exemplaire qui se trouve devant les prêtres lévites[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant les prêtres lévites ». L’expression peut désigner l’exemplaire de référence placé devant eux ou dont ils disposent ; elle peut aussi être comprise comme « en présence des prêtres lévites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les prêtres, les Lévites » ; on peut aussi traduire : « les prêtres descendants de Lévi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: Lorsqu’il siégera
  rationale: La construction introduit la circonstance temporelle de la prescription. « Siégera » est naturel dans un contexte royal et conserve l’idée de prendre place et de demeurer sur le trône, sans imposer explicitement le seul moment de l’intronisation.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: sur le trône de son royaume
  rationale: Cette formulation garde l’image concrète du trône ainsi que le complément « de son royaume », au lieu de les réduire à « son trône royal ».
- source_word: וְכָתַב לוֹ
  choice: il écrira pour lui-même
  rationale: Dans cette suite légale, le verbe exprime une prescription. Le complément לוֹ indique ici que le roi doit établir cette copie pour lui-même, c’est-à-dire pour son propre usage.
- source_word: מִשְׁנֵה
  choice: une copie
  rationale: Dans ce contexte, le terme désigne un double ou un exemplaire reproduit, et non une simple répétition abstraite.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: cette loi
  rationale: Dans le contexte législatif immédiat, תּוֹרָה désigne l’ensemble d’instructions et de prescriptions dont le roi doit posséder une copie. « Loi » convient au registre sans étendre explicitement la référence à un canon ultérieur.
- source_word: עַל סֵפֶר
  choice: sur un rouleau
  rationale: סֵפֶר peut désigner un écrit, un document ou un livre; dans ce contexte ancien, « rouleau » exprime clairement et naturellement le support matériel probable, tandis que la préposition « sur » respecte l’image de l’écriture portée sur ce support.
- source_word: מִלִּפְנֵי
  choice: d’après l’exemplaire conservé auprès de
  rationale: Littéralement, l’expression signifie « de devant » ou « de la présence de ». Dans le contexte d’une copie à établir, elle renvoie vraisemblablement au modèle accessible auprès des prêtres. La note conserve les autres compréhensions possibles.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  rationale: Cette expression française rend naturellement la relation entre « les prêtres » et « les Lévites », tout en signalant en note la forme appositionnelle plus littérale de l’hébreu.
theological_decisions:
- issue: Étendue de תּוֹרָה dans la loi relative au roi
  choice: cette loi
  alternative: cette instruction; cette Torah
  rationale: « Cette loi » correspond au cadre juridique et covenantal immédiat sans décider au-delà du verset de l’étendue canonique exacte du document.
- issue: Sens de la référence à la présence ou à la garde des prêtres
  choice: d’après l’exemplaire conservé auprès des prêtres lévites
  alternative: devant les prêtres lévites; en présence des prêtres lévites
  rationale: Le contexte favorise l’idée d’un exemplaire de référence gardé auprès des prêtres, mais l’hébreu ne nomme pas explicitement cet exemplaire après la préposition. La note rend cette part d’implicite et d’ambiguïté visible.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple porte naturellement la valeur prescriptive dans ce contexte légal. « Siégera » maintient le registre royal; « rouleau » restitue le support ancien sans archaïsme excessif. Les notes signalent les deux principales ambiguïtés syntaxiques sans alourdir le texte.
