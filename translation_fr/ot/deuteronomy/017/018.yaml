revisions:
- from: Lorsqu’il siégera sur le trône de son royaume, il écrira pour lui-même, sur un rouleau, une copie de cette loi, d’après l’exemplaire conservé auprès des prêtres lévites[a][b].
  to: Lorsqu’il prendra place sur le trône de son royaume, il écrira pour lui-même, sur un rouleau, une copie de cette loi, d’après l’exemplaire qui se trouve devant les prêtres lévites[a][b].
  rationale: 'La révision remplace une affirmation de conservation sacerdotale par « l’exemplaire qui se trouve devant », qui explicite seulement le référent implicite nécessaire à l’idée de copie tout en conservant la relation spatiale ou institutionnelle non résolue de מִלִּפְנֵי. Elle améliore également le rendu temporel de כְשִׁבְתּוֹ. Les deux notes restent correctement ancrées : [a] porte sur la relation à l’exemplaire et aux prêtres, [b] sur l’apposition hébraïque « les prêtres, les Lévites ».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:01:28Z'
review_pass:
