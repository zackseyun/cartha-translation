id: DEU.17.11
reference: Deuteronomy 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: fr
  text: Tu agiras conformément à l’instruction qu’ils te donneront[a] et à la décision qu’ils te communiqueront. Tu ne t’écarteras pas de la parole qu’ils te feront connaître[b], ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu torah peut aussi se traduire par « loi » ou « enseignement ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu davar peut aussi signifier « affaire » ou, dans ce contexte, « décision » ou « jugement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: conformément à
  rationale: Cette locution signifie « selon » ou « en conformité avec ». Dans ce contexte juridique, « conformément à » exprime clairement l’obligation de suivre la décision rendue.
- source_word: הַתּוֹרָה
  choice: l’instruction
  rationale: Le nom torah désigne fondamentalement un enseignement ou une directive. Ici, il s’agit de l’instruction faisant autorité dans l’affaire soumise aux prêtres et au juge, sans nécessairement désigner la Loi mosaïque dans son ensemble.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: qu’ils te donneront
  rationale: La forme causative du verbe ירה signifie ici instruire ou diriger. Avec « instruction », le verbe « donner » produit une expression française naturelle et évite une répétition lourde.
- source_word: הַמִּשְׁפָּט
  choice: la décision
  rationale: Dans ce cadre judiciaire, mishpat désigne la décision ou le jugement rendu. « Décision » est clair en français moderne tout en conservant la portée juridique.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: qu’ils te communiqueront
  rationale: Le sens littéral est « qu’ils te diront ». « Communiqueront » convient naturellement à l’annonce officielle d’une décision et maintient la distinction avec le verbe suivant.
- source_word: תַּעֲשֶׂה
  choice: Tu agiras
  rationale: L’inaccompli exprime ici une obligation. « Tu agiras » conserve le ton normatif tout en formant une phrase française plus naturelle que « tu feras » sans complément direct.
- source_word: לֹא תָסוּר
  choice: Tu ne t’écarteras pas
  rationale: Le verbe סור signifie se détourner ou s’écarter. Cette formulation s’accorde naturellement avec l’image directionnelle qui conclut le verset.
- source_word: הַדָּבָר
  choice: la parole
  rationale: Davar peut signifier parole, chose, affaire ou décision. « Parole » préserve l’expression singulière et solennelle de l’hébreu, tandis que la note signale les autres sens possibles.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: qu’ils te feront connaître
  rationale: La forme causative de נגד signifie annoncer, déclarer ou faire connaître. Cette expression est idiomatique en français et convient à la proclamation d’une décision officielle.
- source_word: יָמִין וּשְׂמֹאל
  choice: ni à droite ni à gauche
  rationale: Cette formule imagée interdit toute déviation, dans un sens comme dans l’autre. La tournure française avec « ni… ni… » s’intègre naturellement à la négation précédente.
theological_decisions:
- issue: Étendue de l’obéissance due à l’autorité sacerdotale et judiciaire
  choice: Présenter le verset comme l’ordre de suivre l’instruction et la décision faisant autorité dans l’affaire jugée.
  alternative: Y voir l’affirmation d’une autorité religieuse absolue ou infaillible applicable sans limite à des institutions ultérieures.
  rationale: Le contexte concerne la procédure judiciaire de l’Israël de l’alliance. La traduction conserve toute la force de l’obligation énoncée sans introduire une doctrine institutionnelle que le texte hébreu ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne, avec un tutoiement singulier conforme à l’adresse hébraïque. Le registre juridique reste perceptible sans archaïsmes. Le parallélisme est rendu en deux phrases pour assurer une lecture naturelle.
