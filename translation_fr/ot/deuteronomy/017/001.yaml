base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: fr
  text: Tu ne sacrifieras pas à Yahweh ton Dieu un bovin ou un animal du petit bétail[a] qui ait un défaut, ou quelque autre chose de mauvais, car c’est une abomination pour Yahweh ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner aussi bien un mouton qu’une chèvre.
    reason: Précision lexicale sur la portée de שֶׂה.
lexical_decisions:
- source_word: תִזְבַּח
  choice: sacrifieras
  rationale: Dans ce contexte cultuel, זבח désigne l’offrande d’un animal en sacrifice, et non le simple fait de l’abattre.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire du sacrifice, et le nom divin יהוה est rendu par « Yahweh ».
- source_word: שׁוֹר
  choice: un bovin
  rationale: Le terme français « bovin » conserve la portée générique de שׁוֹר sans préciser indûment le sexe ou la fonction de l’animal.
- source_word: שֶׂה
  choice: un animal du petit bétail[a]
  rationale: שֶׂה peut désigner une bête du troupeau, mouton ou chèvre. Cette formulation française restitue cette largeur lexicale sans la réduire au seul mouton.
- source_word: מוּם
  choice: un défaut
  rationale: « Défaut » désigne naturellement une imperfection physique rendant l’animal impropre au sacrifice.
- source_word: כֹּל דָּבָר רָע
  choice: quoi que ce soit de mauvais
  rationale: La formulation conserve la généralité et la force de l’expression hébraïque, placée en apposition explicative après « défaut », sans la limiter à un « défaut grave ».
- source_word: תוֹעֲבַת
  choice: une abomination
  rationale: « Abomination » garde la forte réprobation cultuelle exprimée par תוֹעֵבָה et demeure compréhensible en français biblique moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Portée de כֹּל דָּבָר רָע
  choice: quoi que ce soit de mauvais
  alternative: tout défaut grave
  rationale: Le choix maintient l’expression large et quelque peu abrupte de l’hébreu, au lieu de résoudre son rapport avec מוּם par une précision absente du texte.
translation_notes:
  register: Français moderne, digne et direct. Le futur à valeur impérative (« Tu ne sacrifieras pas ») conserve la forme juridique de l’interdiction. « Animal du petit bétail » est légèrement technique, mais exact et usuel dans un contexte de législation pastorale et sacrificielle.
