base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: fr
  text: Il ne prendra pas pour lui un grand nombre d’épouses[a], de peur que son cœur ne se détourne ; il n’accumulera pas non plus pour lui de grandes quantités d’argent et d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et son cœur ne se détournera pas ». L’hébreu peut aussi être compris comme une interdiction coordonnée plutôt que comme l’expression explicite d’une conséquence ou d’un but.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה ... נָשִׁים
  choice: prendra ... un grand nombre de femmes
  rationale: Dans cette règle royale, נָשִׁים désigne des femmes prises pour épouses. La tournure française exprime naturellement l’acquisition excessive d’épouses sans suggérer une interdiction générale de fréquenter des femmes.
- source_word: יָסוּר
  choice: se détourne
  rationale: Le verbe סור évoque le fait de s’écarter ou de se détourner. Cette traduction conserve la métaphore et n’ajoute aucun complément absent de l’hébreu.
- source_word: לְבָבוֹ
  choice: son cœur
  rationale: « Cœur » conserve l’anthropologie biblique, qui englobe la volonté, les dispositions et les affections.
- source_word: כֶּסֶף וְזָהָב
  choice: de l’argent et de l’or
  rationale: La paire concrète traditionnelle est conservée. En français moderne, « argent » rend naturellement כֶּסֶף dans ce contexte d’accumulation de richesses.
- source_word: יַרְבֶּה ... מְאֹד
  choice: amassera ... en très grande quantité
  rationale: Le second emploi de רבה, intensifié par מְאֹד, concerne l’accumulation excessive de métaux précieux. « Amasser » est idiomatique en français et « en très grande quantité » garde l’intensification.
theological_decisions:
- issue: Rapport entre le grand nombre de femmes et le détournement du cœur
  choice: 'La proposition médiane est rendue comme un avertissement de conséquence ou de but : « de peur que son cœur ne se détourne ».'
  alternative: « et son cœur ne se détournera pas », comme interdiction coordonnée
  rationale: La syntaxe hébraïque autorise les deux analyses. Le contexte relie naturellement le détournement du cœur à la multiplication des épouses, mais la lecture coordonnée demeure possible et est signalée en note. Aucun objet tel que « de l’Éternel » n’est ajouté.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur à valeur prescriptive convient au style légal. « Prendre pour lui un grand nombre de femmes » est plus idiomatique que le calque « multiplier les femmes pour lui-même », tandis que la répétition de לּוֹ est reflétée par « pour lui » dans les deux interdictions.
