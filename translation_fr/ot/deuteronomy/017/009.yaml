  text: וּ/בָאתָ֗ אֶל הַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם וְ/אֶל הַ/שֹּׁפֵ֔ט אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/דָרַשְׁתָּ֙ וְ/הִגִּ֣ידוּ לְ/ךָ֔ אֵ֖ת דְּבַ֥ר הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: fr
  text: Tu iras trouver les prêtres lévites et le juge qui sera en fonction en ce temps-là. Tu les consulteras, et ils te feront connaître la décision judiciaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la parole du jugement ». L’expression hébraïque désigne ici la décision judiciaire faisant autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Tu iras trouver
  rationale: Dans cette instruction juridique, le parfait avec waw a une valeur directive. « Tu iras trouver » exprime naturellement en français le déplacement vers l’autorité compétente.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  rationale: L’apposition identifie ces prêtres comme lévites sans laisser entendre que tous les lévites sont prêtres.
- source_word: הַשֹּׁפֵט
  choice: le juge
  rationale: Terme français direct et courant pour le responsable judiciaire désigné par le texte.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: qui sera en fonction en ce temps-là
  rationale: La formulation vise le titulaire de la charge à l’époque où l’affaire se présente. « En fonction » explicite sobrement cette portée institutionnelle.
- source_word: וְדָרַשְׁתָּ
  choice: Tu les consulteras
  rationale: Dans ce cadre judiciaire, le verbe exprime la recherche d’un avis ou d’une décision faisant autorité. Le pronom pluriel correspond naturellement aux prêtres et au juge mentionnés.
- source_word: וְהִגִּידוּ לְךָ
  choice: ils te feront connaître
  rationale: Le hiphil de נגד désigne ici la communication formelle de la décision; cette tournure garde un registre digne sans archaïsme.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: la décision judiciaire
  rationale: Littéralement « la parole de la sentence/du jugement »; dans le contexte, l’expression désigne la décision faisant autorité. La note conserve la forme plus littérale.
