source:
  edition: WLC
  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: fr
  text: S’il se trouve parmi vous, dans l’une des villes[a] que Yahweh votre Dieu vous donne, un homme ou une femme qui fasse ce qui est mal aux yeux de Yahweh votre Dieu en transgressant son alliance[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans l’une de vos portes ». Ici, les « portes » désignent les villes ou les localités.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « en violant son alliance » ou « de manière à rompre son alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: S’il
  rationale: Introduit ici la condition d’un cas juridique; « si » convient à la protase et s’enchaîne naturellement avec « il se trouve ».
- source_word: יִמָּצֵא
  choice: se trouve
  rationale: Le niphal de מצא porte une valeur passive ou résultative. « Il se trouve » conserve la formulation juridique impersonnelle dans un français naturel.
- source_word: בְקִרְבְּךָ
  choice: parmi vous
  rationale: Désigne la présence au sein de la communauté, sans suggérer l’intériorité que pourrait évoquer une traduction trop littérale.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: dans l’une des villes[a]
  rationale: Littéralement « dans l’une de tes portes »; en Deutéronome, « portes » désigne par métonymie les villes ou leurs ressorts locaux. Le sens est rendu dans le texte et la forme hébraïque est signalée en note.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: que Yahweh votre Dieu vous donne
  rationale: Le présent français exprime naturellement la valeur actuelle ou continue du participe נֹתֵן et préserve la formule d’alliance.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: un homme ou une femme
  rationale: Conserve explicitement les deux termes genrés du texte hébreu.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: qui fasse ce qui est mal
  rationale: Rend naturellement l’idiome hébreu « faire le mal ». Le subjonctif s’intègre à la construction française indéfinie « s’il se trouve… un homme ou une femme qui… ».
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: aux yeux de Yahweh votre Dieu
  rationale: Préserve la métaphore évaluative hébraïque dans une expression française courante.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: en transgressant son alliance[b]
  rationale: L’infinitif construit peut préciser la manière ou la portée de l’acte mauvais. « En transgressant » conserve ce lien sans imposer une finalité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre, conformément à la couche de consultation fournie.
theological_decisions:
- issue: Portée de la violation de l’alliance
  choice: en transgressant son alliance
  alternative: en violant son alliance; de manière à rompre son alliance
  rationale: Le verset énonce la faute envers l’alliance en termes généraux; sa forme concrète est précisée dans la suite. La traduction ne détermine donc ni la stipulation particulière ni une systématisation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset reste syntaxiquement ouvert, puisqu’il constitue la protase d’une longue phrase juridique poursuivie aux versets suivants. Le vouvoiement collectif rend les formes hébraïques au singulier adressées à Israël comme communauté.
