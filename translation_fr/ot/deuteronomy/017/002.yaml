  source_fidelity: 'Le projet rend fidèlement la protase juridique : « S’il se trouve » reflète bien le niphal impersonnel, « parmi vous » la portée communautaire de בְּקִרְבְּךָ, et la paire explicite « un homme ou une femme » est conservée. « Dans l’une des villes » transmet de manière idiomatique la métonymie deutéronomique de « portes », qui est correctement documentée par la note. « En transgressant son alliance » respecte la relation de moyen ou de manière exprimée par l’infinitif, sans préciser abusivement la nature de l’infraction.'
