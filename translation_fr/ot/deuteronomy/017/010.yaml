  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: fr
  text: Tu agiras conformément à la décision[a] qu’ils te communiqueront depuis ce lieu que Yahweh choisira, et tu veilleras à faire tout ce qu’ils t’indiqueront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la parole ». Le mot hébreu דָּבָר peut désigner une « parole », une « affaire » ou, dans un contexte judiciaire, une « décision ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu agiras
  rationale: Le verbe עשה est large (« faire, agir »). Dans ce contexte juridique, « agir » exprime naturellement la mise en application de la décision tout en conservant la force prescriptive.
- source_word: עַל פִּי הַדָּבָר
  choice: conformément à la décision
  rationale: עַל־פִּי marque la conformité à une parole faisant autorité. דָּבָר peut signifier « parole », « affaire » ou, dans ce contexte judiciaire, « décision » ; ce dernier terme rend clairement la portée juridique sans effacer l’alternative lexicale, signalée en note.
- source_word: יַגִּידוּ לְךָ
  choice: qu’ils te communiqueront
  rationale: Le hiphil de נגד signifie « faire connaître, annoncer, déclarer ». « Communiquer » convient à la transmission officielle d’une décision et reste naturel en français moderne.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: depuis ce lieu que Yahweh choisira
  rationale: « Depuis » rend la provenance de la décision exprimée par מִן. Le futur « choisira » correspond à la perspective anticipatrice du Deutéronome, et « ce lieu » désigne le sanctuaire central évoqué dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: tu veilleras à faire
  rationale: La construction שׁמר suivie de l’infinitif exprime une observance attentive. « Veiller à faire » est clair, digne et idiomatique.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: tout ce qu’ils t’indiqueront
  rationale: Le hiphil de ירה peut signifier « enseigner, instruire, indiquer, diriger ». Dans le cadre d’une décision judiciaire, « indiquer » exprime une directive faisant autorité sans réduire le terme à un enseignement scolaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. La translittération « Yahweh » préserve le nom personnel de l’original.
- issue: Nature de דָּבָר dans le cadre judiciaire
  choice: décision
  alternative: parole
  rationale: Le contexte concerne la sentence autorisée rendue par les prêtres et le juge. « Décision » explicite cette fonction juridique, tandis que la note conserve l’image plus littérale de la « parole » et l’ambiguïté du terme hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque à la communauté envisagée comme une unité. La syntaxe conserve les deux prescriptions coordonnées et leur portée juridique.
