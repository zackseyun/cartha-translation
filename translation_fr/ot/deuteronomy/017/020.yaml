    issue: « dans sa royauté » est une formulation non idiomatique.
    rationale: En français, « royauté » désigne normalement la dignité ou l’institution monarchique, et l’expression « dans sa royauté » sonne comme un calque. « Dans son royaume » est la formulation usuelle et conserve le lien avec מַמְלַכְתּוֹ, sans trancher indûment entre royaume et règne.
  revised_text: afin que son cœur ne s’élève pas au-dessus de ses frères[a] et qu’il ne s’écarte du commandement ni à droite ni à gauche. Ainsi, il pourra prolonger ses jours dans son royaume, lui et ses fils, au milieu d’Israël.
