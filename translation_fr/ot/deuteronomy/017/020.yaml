  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: fr
  text: afin que son cœur ne s’élève pas au-dessus de ses frères[a] et qu’il ne s’écarte du commandement ni à droite ni à gauche. Ainsi, il pourra prolonger ses jours dans son royaume, lui et ses fils, au milieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-dessus des autres Israélites ». L’hébreu dit littéralement « au-dessus de ses frères », selon le langage de parenté propre au peuple de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: afin que son cœur ne s’élève pas
  rationale: La tournure finale avec infinitif exprime la prévention. « Son cœur ne s’élève pas » conserve l’image hébraïque de l’orgueil tout en restant naturelle en français.
- source_word: מֵאֶחָיו
  choice: au-dessus de ses frères
  rationale: Le texte désigne littéralement ses « frères » et présente le roi comme membre du même peuple d’alliance; une note précise le référent collectif.
- source_word: וּלְבִלְתִּי סוּר
  choice: et qu’il ne s’écarte
  rationale: « S’écarter » rend naturellement le verbe de mouvement employé pour l’abandon de la voie prescrite.
- source_word: מִן הַמִּצְוָה
  choice: du commandement
  rationale: Le singulier défini est conservé; dans le contexte, il peut désigner collectivement le commandement transmis par la Loi.
- source_word: יָמִין וּשְׂמֹאול
  choice: ni à droite ni à gauche
  rationale: Cette formulation française préserve l’image d’une déviation dans l’une ou l’autre direction.
- source_word: לְמַעַן
  choice: Ainsi
  rationale: Ici, la particule introduit l’issue visée de l’obéissance; « Ainsi » exprime clairement ce rapport sans alourdir la phrase.
- source_word: יַאֲרִיךְ יָמִים
  choice: il pourra prolonger ses jours
  rationale: La traduction conserve l’idiome hébraïque de la prolongation des jours, compréhensible en français biblique moderne.
- source_word: עַל מַמְלַכְתּוֹ
  choice: dans sa royauté
  rationale: מַמְלָכָה peut ici désigner la royauté ou le règne plutôt que le seul territoire. « Dans sa royauté » garde cette dimension de durée dynastique sans imposer « royaume ».
- source_word: הוּא וּבָנָיו
  choice: lui et ses fils
  rationale: Le masculin pluriel concret est maintenu, conformément au cadre de succession royale.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: au milieu d’Israël
  rationale: La formulation reproduit l’expression spatiale et communautaire hébraïque.
theological_decisions:
- issue: Langage de parenté dans la loi royale
  choice: ses frères
  alternative: les autres Israélites
  rationale: Le mot hébreu signifie littéralement « frères » et souligne que le roi demeure membre du peuple de l’alliance. La note explicite le référent sans neutraliser le texte principal.
- issue: Formulation de la continuité dynastique
  choice: lui et ses fils
  alternative: lui et ses descendants
  rationale: Le texte nomme explicitement les fils dans un contexte de succession royale; « descendants » élargirait l’expression au-delà de sa forme lexicale.
- issue: Sens de מַמְלָכָה
  choice: royauté
  alternative: royaume
  rationale: Dans la construction avec « prolonger ses jours », le terme peut viser l’exercice durable de la royauté. Ce choix évite de faire des jours du roi une durée passée dans un territoire, tout en laissant subsister la portée dynastique.
translation_notes:
  register: Français international moderne, digne et lisible. Les idiomes bibliques structurants (« son cœur ne s’élève pas », « prolonger ses jours », « au milieu d’Israël ») sont conservés lorsqu’ils restent immédiatement compréhensibles. La coordination est répartie en deux phrases pour une lecture naturelle.
