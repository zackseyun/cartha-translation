  text: וַ/יֵּ֗לֶךְ וַֽ/יַּעֲבֹד֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּ֖חוּ לָ/הֶ֑ם וְ/לַ/שֶּׁ֣מֶשׁ א֣וֹ לַ/יָּרֵ֗חַ א֛וֹ לְ/כָל צְבָ֥א הַ/שָּׁמַ֖יִם אֲשֶׁ֥ר לֹא צִוִּֽיתִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: fr
  text: et qu’il aille servir d’autres dieux et se prosterne devant eux, ou devant le soleil, la lune ou toute l’armée des cieux[a] — ce que je n’ai pas commandé[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « armée des cieux » désigne l’ensemble ordonné des réalités célestes. Dans ce contexte, elle vise surtout les astres, mais elle peut aussi évoquer des êtres célestes.
    reason: lexical_alternative
  - marker: b
    text: La proposition « ce que je n’ai pas commandé » peut se rapporter spécialement à « toute l’armée des cieux » ou, plus largement, à l’ensemble de l’acte consistant à servir d’autres dieux et à se prosterner devant eux.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: qu’il aille
  rationale: Dans cette proposition conditionnelle juridique commencée au verset précédent, le wayyiqtol poursuit l’hypothèse; le subjonctif français rend naturellement cette continuité.
- source_word: וַיַּעֲבֹד
  choice: servir
  rationale: Avec des divinités pour complément, עבד désigne le service cultuel. « Servir » maintient cette valeur propre sans absorber le geste distinct exprimé par le verbe suivant.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe qui n’ajoute pas la nuance ethnique que pourrait suggérer « des dieux étrangers ».
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: se prosterne devant eux
  rationale: Le verbe désigne concrètement l’action de s’incliner ou de se prosterner; cette formulation la distingue du service cultuel déjà exprimé.
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: ou devant le soleil, la lune ou toute l’armée des cieux
  rationale: La formulation française fait ressortir l’alternative portée par les deux occurrences de אוֹ. « Armée des cieux » conserve l’image collective de צבא sans limiter explicitement le référent aux seuls astres ou aux êtres célestes.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: ce que je n’ai pas commandé
  rationale: La formule conserve l’idée précise d’absence de commandement divin, sans la remplacer par « que j’ai interdit ». Le démonstratif neutre permet de ne pas fixer excessivement la portée de la relative.
theological_decisions:
- issue: Portée de la proposition אֲשֶׁר לֹא צִוִּיתִי
  choice: « ce que je n’ai pas commandé », formulation pouvant reprendre l’acte idolâtre décrit
  alternative: Comprendre la proposition comme se rapportant immédiatement à « toute l’armée des cieux »
  rationale: La relative hébraïque peut grammaticalement s’attacher au dernier groupe nominal, mais le contexte permet aussi d’y entendre une désapprobation de l’ensemble du culte idolâtre. Le texte et la note maintiennent cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset demeure syntaxiquement lié à la condition commencée en Deutéronome 17.2; « qu’il aille » préserve donc sa forme fragmentaire. Les tirets isolent la proposition finale sans en imposer une portée unique.
