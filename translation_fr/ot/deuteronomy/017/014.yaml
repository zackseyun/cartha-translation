revisions:
- from: 'Lorsque tu entreras dans le pays que Yahweh ton Dieu te donne, que tu en prendras possession et que tu y habiteras, et que tu diras : « J’établirai sur moi un roi[a], comme toutes les nations qui m’entourent »,'
  to: 'Lorsque tu seras entré dans le pays que Yahweh, ton Dieu, te donne, que tu en auras pris possession et que tu t’y seras établi, et que tu diras : « Je mettrai un roi à ma tête[a], comme toutes les nations qui m’entourent »,'
  rationale: La révision remplace un calque français maladroit par l’expression idiomatique « mettre un roi à ma tête », qui correspond au verbe « mettre/placer » et à la relation d’autorité exprimée par l’hébreu. Elle clarifie aussi la progression temporelle par des futurs antérieurs. Aucun jugement théologique sur la monarchie n’est introduit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:01:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens de la séquence hébraïque est bien rendu : entrée dans le pays donné par Yahweh, prise de possession, installation, puis désir d’avoir un roi à l’exemple des nations voisines. Le singulier « tu » et le point de vue à la première personne dans la citation sont conservés. Toutefois, « établir sur moi un roi » calque l’hébreu d’une manière peu recevable en français et obscurcit l’idée d’autorité royale sur le locuteur collectif.'
  naturalness: La phrase révisée conserve le style juridique et prospectif du texte tout en employant une formulation française idiomatique. « Mettre un roi à ma tête » exprime naturellement l’autorité « sur moi » sans ajouter d’interprétation confessionnelle.
  terminology: « Yahweh », « ton Dieu », « pays », « prendre possession » et « nations » conviennent au registre moderne international et au contexte deutéronomique. « À ma tête » est l’équivalent idiomatique approprié de עָלַי dans la demande de royauté.
  issues:
  - severity: medium
    issue: « J’établirai sur moi un roi » n’est pas une tournure française naturelle.
    rationale: Bien que cette expression cherche à reproduire la préposition hébraïque « sur moi », elle sonne grammaticalement et sémantiquement maladroite en français. « Je mettrai un roi à ma tête » garde l’image d’un roi placé en position d’autorité sur le locuteur.
  - severity: low
    issue: La succession des actions peut être rendue plus clairement en français.
    rationale: Le futur antérieur (« tu seras entré », « tu en auras pris possession », « tu t’y seras établi ») marque naturellement l’antériorité des circonstances avant la déclaration, sans modifier le sens du scénario envisagé.
  revised_text: 'Lorsque tu seras entré dans le pays que Yahweh, ton Dieu, te donne, que tu en auras pris possession et que tu t’y seras établi, et que tu diras : « Je mettrai un roi à ma tête[a], comme toutes les nations qui m’entourent »,'
  revised_footnotes:
