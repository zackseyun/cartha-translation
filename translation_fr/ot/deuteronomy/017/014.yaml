  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: fr
  text: 'Lorsque tu seras entré dans le pays que Yahweh, ton Dieu, te donne, que tu en auras pris possession et que tu t’y seras établi, et que tu diras : « Je mettrai un roi à ma tête[a], comme toutes les nations qui m’entourent »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je nommerai un roi pour me gouverner. » L’hébreu dit littéralement : « Je mettrai sur moi un roi. »'
    reason: Cette note signale la formulation littérale, inhabituelle en français, tout en proposant une autre expression idiomatique possible. « À ma tête » dans le texte rend l’autorité du roi sur le locuteur sans préciser davantage la portée de la demande.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Lorsque tu entreras
  rationale: כִּי introduit ici une situation future envisagée, et בוא avec אֶל signifie entrer dans un lieu. « Lorsque » rend cette perspective attendue sans lui donner un sens causal.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire promis à Israël. « Le pays » est naturel en français moderne et convient à l’idée d’un territoire habité et gouverné.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה; sa translittération préserve le nom propre plutôt que de le remplacer par un titre.
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le participe נֹתֵן présente le don de Yahweh comme une réalité en cours ou caractéristique. Le présent français reste naturel dans la proposition future.
- source_word: וִירִשְׁתָּהּ
  choice: tu en prendras possession
  rationale: Dans les passages relatifs au territoire, ירשׁ exprime l’action de prendre possession. Le pronom « en » reprend naturellement « le pays ».
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: tu y habiteras
  rationale: ישׁב désigne ici une résidence durable. « Habiter » est courant, précis et digne.
- source_word: וְאָמַרְתָּ
  choice: tu diras
  rationale: Le verbe poursuit la série d’actions futures décrivant la situation envisagée par la loi.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: J’établirai sur moi un roi
  rationale: Cette formulation conserve le verbe שׂים, « placer, établir », ainsi que l’expression עָלַי, « sur moi », sans réduire d’emblée le propos à une simple nomination administrative.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: comme toutes les nations qui m’entourent
  rationale: גּוֹיִם désigne ici les peuples organisés en nations autour d’Israël. La première personne de la citation est conservée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: L’hébreu emploie explicitement le tétragramme, un nom propre. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Portée de la demande d’un roi
  choice: J’établirai sur moi un roi
  alternative: Je nommerai un roi pour me gouverner
  rationale: Le texte exprime à la fois l’action d’établir le roi et son autorité « sur » le peuple parlant à la première personne. La traduction conserve cette tension sans préciser ici si la demande est approuvée ou condamnée.
translation_notes:
  register: Français international moderne, avec tutoiement singulier conforme à l’adresse hébraïque. La syntaxe solennelle reste accessible; la répétition de « que » suit l’enchaînement juridique du verset sans archaïsme.
