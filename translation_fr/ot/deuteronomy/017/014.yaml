  revision_rationale: La révision remplace un calque français maladroit par l’expression idiomatique « mettre un roi à ma tête », qui correspond au verbe « mettre/placer » et à la relation d’autorité exprimée par l’hébreu. Elle clarifie aussi la progression temporelle par des futurs antérieurs. Aucun jugement théologique sur la monarchie n’est introduit.
