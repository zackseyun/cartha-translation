base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: fr
  text: alors tu feras sortir à tes portes cet homme ou cette femme qui a commis ce méfait[b], cet homme ou cette femme, et tu les lapideras à coups de pierres, et ils mourront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « cette mauvaise affaire ». Le mot hébreu peut désigner une chose, une affaire ou un acte, notamment dans un contexte juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: alors tu feras sortir
  rationale: Le waw suivi du parfait a ici une valeur séquentielle dans une procédure juridique. « Alors » marque naturellement l’étape suivante, tandis que le futur français conserve la force prescriptive.
- source_word: הָאִישׁ הַהוּא אוֹ אֶת הָאִשָּׁה הַהִוא
  choice: cet homme ou cette femme
  rationale: Cette formulation rend explicitement le couple masculin-féminin et la valeur déterminée de l’article accompagné du démonstratif.
- source_word: אֲשֶׁר עָשׂוּ
  choice: qui aura commis
  rationale: Le pluriel hébreu s’accorde avec les deux possibilités coordonnées, alors que le français emploie naturellement le singulier après « cet homme ou cette femme ». « Commettre » convient au contexte judiciaire sans préciser davantage la nature de l’acte.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: cette mauvaise action
  rationale: דָּבָר peut désigner une chose, une affaire ou un acte. Dans ce contexte pénal, « action » est naturel et concret; une note conserve l’alternative plus littérale « mauvaise affaire ».
- source_word: אֶל שְׁעָרֶיךָ
  choice: vers les portes de ta ville
  rationale: Le pluriel « portes » respecte la forme hébraïque. L’ajout explicatif « de ta ville » communique en français moderne la référence aux portes urbaines, lieux publics de jugement, sans réduire le pluriel au singulier.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: tu les lapideras à coups de pierres
  rationale: « Lapider » exprime précisément l’action, et « à coups de pierres » maintient la mention explicite des pierres présente dans l’hébreu.
- source_word: וָמֵתוּ
  choice: et ils mourront
  rationale: La coordination simple conserve la formulation hébraïque du résultat et sa solennité juridique, sans ajouter une nuance finale ou modale.
theological_decisions:
- issue: Formulation juridique sexuée
  choice: cet homme ou cette femme … l’homme ou la femme
  alternative: cette personne
  rationale: L’hébreu mentionne expressément l’homme et la femme et répète la paire. La traduction conserve cette précision et cette répétition plutôt que de les neutraliser.
- issue: Lieu judiciaire aux portes
  choice: vers les portes de ta ville
  alternative: vers le lieu public du jugement
  rationale: La traduction garde l’image historique concrète des portes tout en explicitant qu’il s’agit de celles de la ville; la note en précise la fonction judiciaire.
- issue: Mort comme résultat de la lapidation
  choice: et ils mourront
  alternative: afin qu’ils meurent
  rationale: La coordination hébraïque permet de présenter le résultat sans imposer explicitement une lecture finale. La traduction préserve cette sobriété.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier reflète l’adresse hébraïque à la communauté envisagée collectivement. La répétition « l’homme ou la femme » est volontaire, car elle appartient au relief juridique du texte source.
