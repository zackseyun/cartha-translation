  source_fidelity: La condition française « S’il est » ne rend pas adéquatement וְהִנֵּה, qui introduit le constat résultant de l’enquête (« voici/et voici que »), non une nouvelle condition. La double confirmation אֱמֶת נָכוֹן est autrement bien préservée par « vraie et bien établie ».
  naturalness: Le texte est globalement naturel et de registre juridique approprié. La reformulation du constat en proposition indépendante avec deux-points rend la syntaxe française plus claire tout en conservant la phrase inachevée qui se poursuit au verset suivant.
  terminology: « enquête approfondie », « abomination », « commise » et « en Israël » sont exacts, idiomatiques et adaptés au contexte judiciaire deutéronomique. Aucun terme théologique ne nécessite d’ajout interprétatif.
  issues:
  - severity: medium
    issue: « S’il est vrai et bien établi » traduit וְהִנֵּה comme une condition.
    rationale: וְהִנֵּה est un marqueur de présentation ou de constat après l’enquête. Bien que la construction globale des vv. 2–5 soit conditionnelle, ce verset énonce le fait établi; « si » risque de maintenir artificiellement l’incertitude et ne correspond pas au marqueur hébreu.
