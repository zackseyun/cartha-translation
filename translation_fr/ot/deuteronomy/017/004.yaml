  text: וְ/הֻֽגַּד לְ/ךָ֖ וְ/שָׁמָ֑עְתָּ וְ/דָרַשְׁתָּ֣ הֵיטֵ֔ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: fr
  text: 'On te le rapporte, tu en entends parler et tu mènes une enquête approfondie. Et voici que l’affaire est vraie et bien établie : cette abomination a été commise en Israël,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: on te le rapporte
  rationale: Le hophal de נגד exprime qu’une information est portée à la connaissance du destinataire. La tournure impersonnelle française conserve le sens passif tout en restant naturelle.
- source_word: וְשָׁמָעְתָּ
  choice: tu en entends parler
  rationale: שׁמע signifie ici « entendre ». Le pronom « en » reprend explicitement, sans ajout de fond, l’affaire signalée dans la proposition précédente.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: tu mènes une enquête approfondie
  rationale: Dans ce contexte judiciaire, דרש désigne une enquête ou un examen, et הֵיטֵב en souligne le caractère soigneux et complet.
- source_word: וְהִנֵּה
  choice: s’il est
  rationale: Dans l’enchaînement juridique commencé aux versets précédents, וְהִנֵּה introduit le résultat constaté de l’enquête. La construction française avec « si » rend naturellement cette condition, sans ajouter d’incertitude au constat une fois établi.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: vrai et bien établi que
  rationale: 'אֱמֶת et נָכוֹן forment une double formule de confirmation judiciaire : vérité du fait et caractère fermement établi de l’affaire.'
- source_word: נֶעֶשְׂתָה
  choice: a été commise
  rationale: Le passif de עשה indique que l’acte a effectivement eu lieu. Avec « abomination », « commettre » est idiomatique en français et convient au cadre pénal.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: cette abomination
  rationale: « Abomination » conserve la forte réprobation morale et cultuelle portée par תּוֹעֵבָה dans le Deutéronome.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La formule situe l’acte au sein d’Israël, la communauté concernée par cette législation.
theological_decisions:
- issue: Formule judiciaire אֱמֶת נָכוֹן הַדָּבָר
  choice: s’il est vrai et bien établi que
  alternative: voici que l’affaire est vraie et certaine
  rationale: La formulation retenue préserve les deux éléments de confirmation et s’intègre naturellement à la longue construction conditionnelle de Deutéronome 17.2-5. Elle ne réduit pas la formule à une simple impression de vraisemblance.
- issue: Valeur de תּוֹעֵבָה
  choice: abomination
  alternative: acte détestable
  rationale: Le terme fort respecte l’évaluation explicite du texte et sa portée dans le vocabulaire deutéronomique, sans préciser davantage la nature théologique de l’offense.
translation_notes:
  register: 'Français moderne, international et digne. La syntaxe suit le cadre procédural du passage : signalement, audition, enquête, puis constat judiciaire. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne masculine singulière.'
