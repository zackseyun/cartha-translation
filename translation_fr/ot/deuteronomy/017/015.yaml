revisions:
- from: Tu établiras sur toi un roi que Yahweh ton Dieu choisira. C’est parmi tes frères que tu établiras sur toi un roi. Tu ne pourras pas placer sur toi un étranger, quelqu’un qui ne soit pas ton frère.[a]
  to: Tu établiras assurément à ta tête un roi que Yahweh, ton Dieu, choisira. C’est parmi tes frères que tu établiras à ta tête un roi. Tu ne pourras pas établir à ta tête un étranger qui n’est pas ton frère.[a]
  rationale: La révision remplace les calques « sur toi » par « à ta tête » et « placer » par « établir », afin d’obtenir un français moderne naturel tout en gardant la répétition structurelle du texte hébreu. « Assurément » restitue sobrement l’intensification de l’infinitif absolu. La relative finale passe à l’indicatif, conforme à l’énoncé hébreu.
