  naturalness: « Établir sur toi » et « placer sur toi » ne sont pas naturels en français moderne international. « Établir à ta tête » est clair, soutenu sans être archaïque, et préserve la répétition voulue. « Qui n’est pas ton frère » est plus direct et plus proche de la relative affirmative hébraïque que le subjonctif « qui ne soit pas ».
  terminology: '« Yahweh », « roi », « tes frères / ton frère » et « étranger » conviennent. La note explicative est utile, mais ne doit pas laisser entendre que le peuple choisit lui-même le roi : le texte attribue le choix à Yahweh et exige que le roi soit issu d’Israël.'
