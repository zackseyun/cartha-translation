  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: fr
  text: Tu établiras assurément à ta tête un roi que Yahweh, ton Dieu, choisira. C’est parmi tes frères que tu établiras à ta tête un roi. Tu ne pourras pas établir à ta tête un étranger qui n’est pas ton frère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « tes frères » et « ton frère » désignent les membres du peuple d’Israël. Yahweh choisit le roi, et celui-ci doit être issu du peuple d’Israël, non d’un peuple étranger.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: Tu établiras
  rationale: L’infinitif absolu suivi de l’imparfait renforce l’injonction. En français juridique, le futur « tu établiras » exprime naturellement une obligation ferme; ajouter « certainement » ou « absolument » serait lourd.
- source_word: עָלֶיךָ
  choice: sur toi
  rationale: Cette traduction conserve la préposition répétée et l’adresse collective au singulier, Israël étant interpellé comme une unité.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: Équivalent français direct et contextuellement précis.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: que Yahweh ton Dieu choisira
  rationale: Le français emploie naturellement le futur dans cette prescription concernant le choix à venir; le pronom hébreu בּוֹ est correctement intégré à la construction « choisir quelqu’un ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: parmi tes frères
  rationale: Formulation française naturelle qui conserve l’image de parenté collective du texte source.
- source_word: לֹא תוּכַל לָתֵת
  choice: Tu ne pourras pas placer
  rationale: La formulation rend de près l’expression littérale d’incapacité tout en étant comprise comme une interdiction dans ce contexte légal.
- source_word: אִישׁ נָכְרִי
  choice: un étranger
  rationale: « Un étranger » est idiomatique en français et désigne bien ici un homme extérieur au peuple, sans la lourdeur de « un homme étranger ».
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: quelqu’un qui ne soit pas ton frère
  rationale: Cette formulation conserve l’explication hébraïque en termes de parenté et emploie naturellement le subjonctif après l’antécédent indéfini sous négation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement sans substituer un titre traditionnel.
- issue: Portée de אַחֶיךָ / אָחִיךָ
  choice: tes frères / ton frère, avec note explicative
  alternative: tes compatriotes / l’un des tiens
  rationale: Le texte hébreu exprime l’appartenance à Israël au moyen d’un langage de parenté masculin. Le conserver maintient la forme et la tension du texte, tandis que la note précise sa portée collective.
- issue: Force de לֹא תוּכַל
  choice: Tu ne pourras pas
  alternative: Tu ne devras pas / Il ne t’est pas permis de
  rationale: Le rendu retenu préserve la formulation d’incapacité du texte hébreu, laquelle a ici une force prohibitive évidente.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « sur toi » et de « tu établiras… un roi » est maintenue parce qu’elle structure l’injonction hébraïque. Le futur sert de forme prescriptive naturelle en français.
