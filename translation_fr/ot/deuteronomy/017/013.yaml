  text: וְ/כָל הָ/עָ֖ם יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹ֥א יְזִיד֖וּ/ן עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: fr
  text: Alors tout le peuple l’entendra et aura peur[a], et personne n’agira plus avec présomption.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éprouvera de la crainte ». L’hébreu ne précise pas si cette crainte a pour objet Dieu, la peine encourue, ou les deux.
    reason: ambiguïté lexicale et théologique
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: Alors tout le peuple
  rationale: « Tout le peuple » traduit directement l’expression hébraïque sans ajouter « d’Israël ». Le וְ initial relie cette conséquence à la sentence précédente; « alors » rend naturellement ce lien en français.
- source_word: יִשְׁמְעוּ
  choice: l’entendra
  rationale: שמע signifie ici entendre parler du jugement. Le pronom « l’ » explicite seulement le complément sous-entendu nécessaire en français, à savoir ce qui vient d’être rapporté.
- source_word: וְיִרָאוּ
  choice: et aura peur
  rationale: La formulation conserve l’absence d’objet dans l’hébreu et ne précise donc pas s’il s’agit de la peur de Dieu, de la peine ou des deux.
- source_word: וְלֹא יְזִידוּן
  choice: et personne n’agira plus avec présomption
  rationale: Le hiphil de זיד exprime une conduite volontairement insolente, arrogante ou présomptueuse. Le singulier distributif « personne » est idiomatique en français tout en visant l’ensemble du peuple.
- source_word: עוֹד
  choice: plus
  rationale: Après la négation, « ne… plus » exprime naturellement la cessation de cette conduite à l’avenir.
theological_decisions:
- issue: Nature de la peur provoquée par le jugement
  choice: « aura peur », sans complément
  alternative: « craindra le Seigneur » ou « redoutera la peine »
  rationale: L’hébreu ne nomme aucun objet de la peur. La traduction maintient cette ambiguïté au lieu de trancher entre crainte de Dieu et crainte du châtiment.
translation_notes:
  register: Français international moderne, clair et digne. « Agir avec présomption » conserve la portée juridique et morale de l’hébreu; la note préserve l’ambiguïté de la crainte.
