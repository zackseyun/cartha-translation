  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: fr
  text: Les témoins seront les premiers à porter la main sur lui pour le mettre à mort[a], puis tout le peuple. Tu élimineras ainsi le mal du milieu de toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la main des témoins sera la première contre lui […] et la main de tout le peuple en dernier ». Cette expression juridique confie aux témoins la responsabilité de commencer l’exécution de la sentence.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « du milieu de vous » ou « d’entre vous ». L’hébreu emploie un pronom singulier collectif en s’adressant à Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד הָעֵדִים
  choice: La main des témoins
  rationale: Conserve le singulier collectif et la tournure juridique hébraïque, qui attribue aux témoins la responsabilité d'engager l'exécution de la sentence.
- source_word: תִּהְיֶה בּוֹ בָרִאשֹׁנָה
  choice: sera la première à se lever contre lui
  rationale: Exprime naturellement en français la priorité d'action et le sens hostile de בּוֹ dans ce contexte judiciaire, sans réduire la « main » à un simple rôle abstrait.
- source_word: לַהֲמִיתוֹ
  choice: pour le mettre à mort
  rationale: Rend le causatif de מות dans son cadre légal; « mettre à mort » est plus précis ici que le terme général « tuer ».
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: puis viendra la main de tout le peuple
  rationale: Maintient le parallélisme et le singulier hébreux tout en indiquant clairement la succession des participants.
- source_word: וּבִעַרְתָּ
  choice: Tu élimineras ainsi
  rationale: Dans cette formule juridique du Deutéronome, בער désigne l'enlèvement effectif du mal plutôt qu'une combustion littérale. « Éliminer » est actuel, clair et digne.
- source_word: הָרָע
  choice: le mal
  rationale: Préserve la portée générale de la formule hébraïque, sans la restreindre explicitement au coupable.
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de toi
  rationale: Reproduit l'image hébraïque et le singulier collectif adressé à Israël; une note donne la formulation française plus idiomatique.
theological_decisions:
- issue: Portée de la formule וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Tu élimineras ainsi le mal du milieu de toi
  alternative: Tu élimineras ainsi le coupable de ton sein
  rationale: Le texte dit littéralement « le mal », formule qui vise le mal présent dans la communauté sans identifier grammaticalement son objet au seul individu. La traduction conserve cette ampleur et cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme concret des deux « mains » est conservé, avec une légère explicitation verbale (« à se lever », « viendra ») pour obtenir une syntaxe française naturelle. Tous les marqueurs de notes figurent dans le texte.
