revisions:
- from: La main des témoins sera la première à se lever contre lui pour le mettre à mort, puis viendra la main de tout le peuple[a]. Tu élimineras ainsi le mal du milieu de toi[b].
  to: Les témoins seront les premiers à porter la main sur lui pour le mettre à mort[a], puis tout le peuple. Tu élimineras ainsi le mal du milieu de toi[b].
  rationale: La révision remplace une explicitation imagée (« se lever contre lui ») par l’idiome français « porter la main sur lui », qui exprime l’action des témoins sans ajouter le mouvement de se lever. Elle conserve l’ordre imposé par l’hébreu, le cadre judiciaire et la portée volontairement générale de « le mal ». Les deux notes sont maintenues, avec une ancre culturelle déplacée au point le plus pertinent.
