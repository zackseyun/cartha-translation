review_pass:
  verdict: revise
  source_fidelity: La séquence (« les témoins » d’abord, « tout le peuple » ensuite), la finalité judiciaire (« le mettre à mort ») et la formule finale sont bien rendues. Toutefois, « sera la première à se lever contre lui » introduit le mouvement de se lever, absent de l’hébreu, et produit une image française moins directe que l’expression idiomatique « porter la main sur ».
  naturalness: La formulation révisée est plus naturelle en français international moderne tout en conservant la responsabilité initiale des témoins et la participation ultérieure de la communauté.
  terminology: « Témoins », « mettre à mort », « peuple » et « éliminer le mal du milieu de toi » conviennent au contexte judiciaire et à la formule deutéronomique. « Éliminer » évite d’imposer une interprétation matérielle particulière à la formule « ôter/purger le mal ».
  issues:
