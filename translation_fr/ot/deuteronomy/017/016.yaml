  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: fr
  text: 'Toutefois, il ne devra pas accumuler des chevaux pour lui-même[a], ni ramener le peuple en Égypte[b] pour multiplier les chevaux, car Yahweh vous a dit : « Vous ne retournerez plus jamais par ce chemin[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se procurer un grand nombre de chevaux ». Le verbe hébreu signifie faire devenir nombreux ou augmenter.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « faire retourner le peuple en Égypte ». La forme verbale est causative : le roi ne doit pas provoquer ce retour.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Vous n''ajouterez plus à retourner par ce chemin », tournure hébraïque signifiant qu''ils ne devront plus jamais y retourner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Toutefois
  rationale: Dans ce contexte législatif, la particule introduit une restriction contrastant avec ce qui précède. « Toutefois » rend naturellement cette transition en français.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: il ne devra pas accumuler les chevaux pour lui-même
  rationale: Le hiphil de רבה exprime l'augmentation. « Accumuler » est naturel en français et suggère une acquisition excessive, tandis que « pour lui-même » conserve la nuance de לּוֹ.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: ni ramener le peuple en Égypte
  rationale: Le hiphil de שוב est causatif. « Ramener » exprime directement le fait de faire retourner le peuple et reste plus idiomatique que « faire retourner ».
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: pour multiplier les chevaux
  rationale: La construction exprime le but. « Multiplier » maintient ici le lien lexical avec l'idée d'augmentation exprimée plus haut.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה; sa translittération préserve le nom propre de l'alliance plutôt que de le remplacer par un titre.
- source_word: לֹא תֹסִפוּן לָשׁוּב
  choice: Vous ne retournerez plus jamais
  rationale: L'idiome יסף suivi de l'infinitif nie toute répétition future. « Plus jamais » en restitue clairement la force en français moderne.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: par ce chemin
  rationale: דרך désigne ici la voie ou l'itinéraire emprunté. « Par ce chemin » est à la fois proche de l'hébreu et naturel en français.
- source_word: עוֹד
  choice: plus jamais
  rationale: L'adverbe renforce l'interdiction d'un nouveau retour; il est intégré à l'expression française « ne… plus jamais ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie explicitement le Tétragramme. « Yahweh » le présente comme un nom propre et évite de substituer un titre au texte source.
- issue: Portée de l'interdiction du retour en Égypte
  choice: Conserver la formulation collective et absolue du discours direct
  alternative: Limiter explicitement l'interdiction aux expéditions royales destinées à acheter des chevaux
  rationale: Le contexte relie le retour au commerce des chevaux, mais la parole citée est formulée de manière générale. La traduction préserve cette tension sans ajouter une restriction absente de la proposition.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive convient au discours légal. « Accumuler » évite le calque peu naturel « multiplier des chevaux » dans la première proposition, tandis que la répétition de la racine est signalée par la note; « multiplier » reste employé dans la proposition de but. Tous les marqueurs de notes figurent dans le texte.
