  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: fr
  text: Et il arrivera que, si tu écoutes attentivement[a] la voix de Yahvé, ton Dieu, en veillant à mettre en pratique tous ses commandements que je te commande aujourd’hui, Yahvé, ton Dieu, t’élèvera au-dessus de toutes les nations de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « si écouter tu écoutes la voix de Yahvé, ton Dieu ». Cette répétition intensive désigne une écoute attentive qui conduit à l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Et voici ce qui arrivera
  rationale: Introduit naturellement en français la formule prospective et conditionnelle, sans la réduire au seul mot « si ».
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: si tu écoutes attentivement la voix
  rationale: Le redoublement hébreu intensifie l’écoute, tandis que le contexte lui donne une portée d’obéissance. La formulation conserve l’image concrète de la voix et la note explicite.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve le nom propre présent dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Conserve directement la désignation relationnelle et alliance du texte.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: en veillant à mettre en pratique
  rationale: Rend à la fois l’idée de garder avec soin et celle d’accomplir concrètement, dans un français naturel.
- source_word: כָּל מִצְוֺתָיו
  choice: tous ses commandements
  rationale: Maintient le registre juridique et alliance du substantif hébreu.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: En français, « donner un commandement » exprime naturellement l’acte présent de Moïse sans alourdir la phrase par une répétition.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: t’élèvera
  rationale: Dans cette construction, נתן avec עֶלְיוֹן indique que Dieu place Israël dans une position élevée; « élever » exprime clairement ce statut.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: au-dessus de toutes les nations de la terre
  rationale: Préserve la comparaison universelle et le sens spatial figuré de la préposition.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre. « Yahvé » est sa forme française courante et évite de le remplacer par un titre.
- issue: Portée de l’idiome שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: écoutes attentivement la voix
  alternative: obéis fidèlement à Yahvé
  rationale: Le choix conserve l’image hébraïque de l’écoute et de la voix, tout en signalant en note que cette écoute implique l’obéissance dans le cadre de l’alliance.
- issue: Nature conditionnelle de la promesse
  choice: si… Yahvé… t’élèvera
  alternative: quand… Yahvé… t’élèvera
  rationale: אִם introduit ici une condition réelle; « si » maintient le lien explicite entre l’écoute-obéissance et l’élévation promise.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement singulier conservé, puisque l’hébreu s’adresse à Israël comme à une entité collective au singulier. La syntaxe reste solennelle sans être archaïque.
