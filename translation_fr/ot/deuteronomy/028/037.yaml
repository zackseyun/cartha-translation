  text: וְ/הָיִ֣יתָ לְ/שַׁמָּ֔ה לְ/מָשָׁ֖ל וְ/לִ/שְׁנִינָ֑ה בְּ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁר יְנַהֶגְ/ךָ֥ יְהוָ֖ה שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: fr
  text: Tu deviendras un objet d’horreur[a], un proverbe et un sujet de raillerie[b] parmi tous les peuples vers lesquels Yahweh te chassera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet de stupeur ». Le terme hébreu peut désigner une réalité si dévastée ou effroyable qu’elle provoque l’horreur ou la stupéfaction.
    reason: lexical_alternative
  - marker: b
    text: Ou « un dicton et une parole méprisante ». L’hébreu emploie deux termes proches mais distincts pour évoquer des paroles proverbiales et la dérision publique.
    reason: lexical_alternative
  - marker: c
    text: Ou « vers lesquels Yahweh te conduira ». Le verbe hébreu peut signifier « conduire » ou « chasser » ; dans ce contexte de malédiction et d’exil, « chasser » en souligne le caractère forcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Tu deviendras
  rationale: Dans cette série de malédictions, le parfait précédé de וְ a une valeur future et résultative. « Deviendras » exprime naturellement l’état qui en résultera.
- source_word: לְשַׁמָּה
  choice: un objet d’horreur
  rationale: שַׁמָּה désigne ici une réalité si dévastée ou effroyable qu’elle suscite l’horreur ou la stupeur. La tournure rend clairement la valeur prédicative du לְ.
- source_word: לְמָשָׁל
  choice: un proverbe
  rationale: מָשָׁל signifie couramment « proverbe » et peut, dans un contexte hostile, prendre le sens de « nom devenu proverbial » ou « dicton ». Le contexte de malédiction et le terme suivant en indiquent la portée négative.
- source_word: וְלִשְׁנִינָה
  choice: un sujet de raillerie
  rationale: שְׁנִינָה désigne une parole mordante ou moqueuse. « Sujet de raillerie » conserve la dimension publique et hostile sans confondre ce terme avec מָשָׁל.
- source_word: בְּכֹל הָעַמִּים
  choice: parmi tous les peuples
  rationale: « Peuples » correspond directement au pluriel עַמִּים et convient naturellement au contexte de dispersion.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: chez lesquels Yahweh te chassera
  rationale: נהג peut signifier conduire ou pousser. Dans le contexte coercitif de l’exil annoncé comme malédiction, « chasser » exprime le déplacement forcé. « Chez lesquels » rattache clairement le relatif aux peuples.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit « Yahweh » afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: שָׁמָּה
  choice: chez lesquels
  rationale: L’adverbe « là » est intégré idiomatiquement à la proposition relative de destination ; le répéter rendrait la phrase française lourde.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Degré de contrainte exprimé par יְנַהֶגְךָ
  choice: te chassera
  alternative: te conduira
  rationale: Le verbe admet les deux nuances. Le contexte des malédictions, de la déportation et de la dispersion favorise ici le sens coercitif, sans nier l’alternative lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse hébraïque à Israël comme entité collective. La formulation maintient les trois prédicats distincts et la force coercitive probable du contexte d’exil.
