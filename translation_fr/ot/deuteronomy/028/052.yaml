source:
  edition: WLC
  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: fr
  text: Il t’assiégera dans toutes tes villes[a], jusqu’à ce que tombent, dans tout ton pays, les hautes murailles fortifiées dans lesquelles tu mets ta confiance. Il t’assiégera dans toutes tes villes, dans tout le pays que Yahweh ton Dieu t’a donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans toutes tes portes » ; les portes désignent ici les villes auxquelles elles donnent accès.'
    reason: La traduction principale explicite la métonymie pour être immédiatement compréhensible, tandis que la note préserve l’image concrète du texte hébreu.
lexical_decisions:
- source_word: וְהֵצַר
  choice: Il t’assiégera
  rationale: Le hiphil de צור, associé ici aux portes et aux murailles, décrit une action militaire de siège. La même formulation est conservée aux deux occurrences.
- source_word: שְׁעָרֶיךָ
  choice: toutes tes villes
  rationale: Littéralement « toutes tes portes » ; dans ce contexte, les portes représentent par métonymie les villes fortifiées assiégées. « Villes » rend clairement ce sens en français moderne, avec une note conservant l’image hébraïque.
- source_word: עַד רֶדֶת
  choice: jusqu’à ce que tombent
  rationale: Littéralement « jusqu’à la descente de ». Appliqué à des murailles sous un siège, le français idiomatique « jusqu’à ce que tombent » exprime leur effondrement sans ajouter de cause.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: les hautes murailles fortifiées
  rationale: 'Conserve les deux caractéristiques : leur hauteur et leur caractère défensif. « Murailles » convient mieux que « murs » aux fortifications urbaines.'
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: dans lesquelles tu mets ta confiance
  rationale: בטח avec ב exprime la confiance ou l’assurance placée en quelque chose. Cette formulation reste naturelle et maintient la portée théologique du faux sentiment de sécurité.
- source_word: בְּכָל אַרְצֶךָ
  choice: dans tout ton pays
  rationale: Rend la portée distributive et totale de l’expression, dans un français direct.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: que Yahweh ton Dieu t’a donné
  rationale: Le parfait est rendu par le passé composé, qui présente le don accompli avec sa pertinence présente. Le nom divin est translittéré.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du tétragramme, qui préserve ici le nom personnel de Dieu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » conserve le nom propre et évite de le remplacer silencieusement par un titre.
- issue: Objet de la confiance d’Israël
  choice: « dans lesquelles tu mets ta confiance »
  alternative: « sur lesquelles tu comptes »
  rationale: La traduction garde explicitement le langage de la confiance, sans préciser davantage la nature morale ou théologique de cette confiance.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme unité collective. La répétition de « Il t’assiégera » est maintenue pour respecter l’insistance du verset.
