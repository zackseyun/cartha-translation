  text: יִתֶּנְ/ךָ֨ יְהוָ֥ה נִגָּף֮ לִ/פְנֵ֣י אֹיְבֶי/ךָ֒ בְּ/דֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔י/ו וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְ/פָנָ֑י/ו וְ/הָיִ֣יתָ לְ/זַעֲוָ֔ה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: fr
  text: Yahweh te livrera vaincu devant tes ennemis. Tu marcheras contre eux par un seul chemin et tu fuiras devant eux par sept chemins. Tu deviendras un objet d’épouvante[a] pour tous les royaumes de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épouvante ». Le terme hébreu peut désigner l’effroi aussi bien que ce qui le provoque.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ יְהוָה נִגָּף
  choice: Yahweh fera de toi un peuple vaincu
  rationale: Le tour avec נתן et le participe נִגָּף exprime ici le fait de placer Israël dans l’état de vaincu. L’ajout de « peuple » explicite naturellement en français le « tu » collectif adressé à Israël sans changer son référent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: devant tes ennemis
  rationale: Cette formulation conserve l’image spatiale hébraïque et son sens militaire de défaite face à l’ennemi.
- source_word: בְּדֶרֶךְ אֶחָד תֵּצֵא אֵלָיו
  choice: Tu marcheras contre eux par un seul chemin
  rationale: Dans ce contexte militaire, יצא אל désigne une sortie contre l’adversaire. « Marcheras » rend clairement cette sortie au combat, tandis que « un seul chemin » préserve le contraste numérique et imagé.
- source_word: וּבְשִׁבְעָה דְרָכִים תָּנוּס לְפָנָיו
  choice: tu fuiras devant eux par sept chemins
  rationale: La formulation maintient le parallélisme entre l’avancée unifiée et la fuite dispersée. Le pluriel français reprend naturellement l’antécédent collectif « ennemis », là où l’hébreu emploie un suffixe singulier collectif.
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: Tu deviendras un objet d’épouvante
  rationale: זַעֲוָה peut désigner l’effroi ou ce qui le provoque. « Objet d’épouvante » exprime clairement que le peuple deviendra un spectacle terrifiant pour les autres royaumes.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: pour tous les royaumes de la terre
  rationale: Le contexte international de la malédiction favorise « terre » au sens large, et « royaumes » rend directement מַמְלְכוֹת.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » le conserve explicitement sans le remplacer par un titre.
- issue: Valeur de לְזַעֲוָה
  choice: un objet d’épouvante
  alternative: une épouvante / un sujet d’horreur
  rationale: Le choix conserve l’effet public de la malédiction sur les royaumes sans préciser davantage la nature de leur réaction. La possibilité plus littérale et abstraite est signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier conserve l’adresse collective de l’hébreu à Israël. Le parallélisme « un seul chemin / sept chemins » est maintenu afin de préserver l’image d’une armée unie à l’aller puis totalement dispersée dans la fuite.
