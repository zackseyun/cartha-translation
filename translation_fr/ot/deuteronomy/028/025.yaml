review_pass:
  verdict: revise
  source_fidelity: La formulation « fera de toi un peuple vaincu » explicite légitimement le destinataire collectif, mais elle ajoute « peuple » et affaiblit la construction hébraïque נתן + participe, qui présente Yahweh comme livrant Israël à la défaite. « Te livrera vaincu » rend plus directement ce rapport tout en restant idiomatique. Le reste préserve le mouvement unifié (« un seul chemin ») puis dispersé (« sept chemins »), ainsi que le sens de זַעֲוָה.
  naturalness: Le français est globalement moderne et clair. « Yahweh te livrera vaincu devant tes ennemis » est plus concis et plus naturel que « fera de toi un peuple vaincu devant tes ennemis ». « Objet d’épouvante » convient dans le registre solennel du passage.
  terminology: « Yahweh » rend correctement le tétragramme. « Objet d’épouvante » exprime avec justesse la valeur de זַעֲוָה comme réalité suscitant l’effroi; la note maintient l’alternative abstraite. Les pluriels français « eux » reprennent naturellement « tes ennemis », malgré les suffixes singuliers collectifs de l’hébreu.
  issues:
  - severity: low
    issue: Ajout de « un peuple » dans le premier membre
    rationale: L’hébreu s’adresse au « tu » collectif sans employer ici le nom « peuple ». Cet ajout est explicatif, mais il n’est pas nécessaire et rend moins directement la tournure de remise à la défaite.
  revised_text: Yahweh te livrera vaincu devant tes ennemis. Tu marcheras contre eux par un seul chemin et tu fuiras devant eux par sept chemins. Tu deviendras un objet d’épouvante[a] pour tous les royaumes de la terre.
  revised_footnotes:
