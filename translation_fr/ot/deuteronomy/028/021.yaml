  text: יַדְבֵּ֧ק יְהוָ֛ה בְּ/ךָ֖ אֶת הַ/דָּ֑בֶר עַ֚ד כַּלֹּת֣/וֹ אֹֽתְ/ךָ֔ מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: fr
  text: Yahweh fera en sorte que la peste[a] s’attache à toi jusqu’à ce qu’il t’ait fait disparaître[b] du pays où tu entres pour en prendre possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épidémie ». Le terme hébreu peut désigner une maladie épidémique mortelle envoyée comme jugement.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à ce qu’elle t’ait fait disparaître », si l’on comprend « la peste » comme sujet implicite de la proposition.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: fera en sorte que… s’attache
  rationale: Le hiphil de דבק est causatif, « faire adhérer, faire s’attacher ». Cette formulation conserve cette valeur et l’image d’un fléau qui ne lâche pas sa victime.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּךָ
  choice: à toi
  rationale: Avec דבק, la préposition ב marque l’attachement étroit ; « s’attacher à toi » est idiomatique en français.
- source_word: הַדָּבֶר
  choice: la peste
  rationale: Dans les malédictions d’alliance, דֶּבֶר désigne une épidémie mortelle. « La peste » est précis, naturel et suffisamment large dans ce contexte biblique.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: jusqu’à ce qu’il t’ait fait disparaître
  rationale: כלה exprime l’achèvement ou l’anéantissement total. « Faire disparaître » rend naturellement l’idée d’élimination complète, avec Yahweh comme sujet implicite le plus naturel, sans masquer l’autre analyse syntaxique possible.
- source_word: מֵעַל הָאֲדָמָה
  choice: du pays
  rationale: Bien que אֲדָמָה puisse désigner le sol, le contexte de l’entrée et de la prise de possession indique ici le territoire, donc « le pays ».
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: où tu entres
  rationale: בוא avec שמה exprime idiomatiquement le fait d’entrer dans le lieu en question ; la tournure française reste concise et actuelle.
- source_word: לְרִשְׁתָּהּ
  choice: pour en prendre possession
  rationale: ירש désigne ici la prise de possession du pays. Cette formulation explicite naturellement le complément repris par « en ».
theological_decisions:
- issue: Sens du terme de malédiction דֶּבֶר
  choice: la peste
  alternative: l’épidémie ; le fléau
  rationale: « La peste » transmet l’idée d’une maladie épidémique mortelle envoyée comme jugement, sans réduire le terme à une maladie moderne précisément identifiée.
- issue: Sujet implicite de כַּלֹּתוֹ
  choice: jusqu’à ce qu’il t’ait fait disparaître
  alternative: jusqu’à ce qu’elle t’ait fait disparaître
  rationale: Le sujet principal, Yahweh, est naturellement repris par « il ». Toutefois, la syntaxe permet aussi de comprendre la peste comme sujet ; cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme entité collective. La formulation conserve l’image vive de la peste qui s’attache à la personne et signale l’ambiguïté du sujet de la proposition finale.
