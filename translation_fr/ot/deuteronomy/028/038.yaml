  text: זֶ֥רַע רַ֖ב תּוֹצִ֣יא הַ/שָּׂדֶ֑ה וּ/מְעַ֣ט תֶּאֱסֹ֔ף כִּ֥י יַחְסְלֶ֖/נּוּ הָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: fr
  text: Tu emporteras beaucoup de semence au champ[a], mais tu en récolteras peu, car le criquet la dévorera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu sèmeras beaucoup de semence dans le champ, mais tu récolteras peu. » Plus littéralement, l’hébreu dit : « emporter beaucoup de semence au champ » et « en recueillir peu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: beaucoup de semence
  rationale: זֶרַע désigne ici la semence destinée aux semailles, et רַב en souligne la grande quantité. Cette formulation conserve l’image agricole concrète et prépare le contraste avec « peu ».
- source_word: תּוֹצִיא
  choice: tu emporteras
  rationale: Le hifil de יצא signifie littéralement « faire sortir » ou « emporter ». Dans ce contexte, il s’agit d’emporter la semence au champ pour la semer; « emporteras » préserve cette image sans expliciter l’action par « sèmeras » dans le texte principal.
- source_word: הַשָּׂדֶה
  choice: au champ
  rationale: שָׂדֶה désigne couramment le champ ou la terre cultivée. « Au champ » est naturel en français et correspond à la destination indiquée par l’hébreu.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: mais tu en récolteras peu
  rationale: אָסַף signifie « rassembler, recueillir ». Dans le contexte agricole, « récolter » rend clairement le sens, tandis que « en… peu » maintient le contraste quantitatif avec l’abondance de semence.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la cause de la faible récolte. « Car » convient au registre digne du passage tout en restant courant.
- source_word: יַחְסְלֶנּוּ
  choice: la dévorera
  rationale: חסל exprime l’idée de consommer ou de détruire entièrement. « Dévorera » traduit la force du verbe; le pronom féminin renvoie grammaticalement à « semence », conformément au suffixe hébreu qui reprend זֶרַע.
- source_word: הָאַרְבֶּה
  choice: le criquet
  rationale: אַרְבֶּה est le terme usuel pour le criquet ravageur. Le singulier défini hébreu a une valeur collective ou générique; le singulier français « le criquet » conserve cette forme et ce sens.
