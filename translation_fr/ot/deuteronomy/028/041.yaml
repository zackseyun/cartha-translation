  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: fr
  text: Tu engendreras des fils et des filles, mais ils ne seront pas à toi[a], car ils partiront en captivité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne resteront pas auprès de toi ». Littéralement : « ils ne seront pas à toi » ou « pour toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils partiront en exil ». L’hébreu parle plus précisément de captivité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: L’hébreu nomme explicitement les enfants des deux sexes. Cette formulation conserve le parallélisme et la force rhétorique du texte.
- source_word: תּוֹלִיד
  choice: tu engendreras
  rationale: Le hifil masculin singulier de ילד exprime ici le fait d’avoir une descendance en tant que père. « Engendrer » préserve cette nuance mieux que le plus général « avoir », tout en restant intelligible en français moderne.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: mais ils ne seront pas à toi
  rationale: La construction signifie littéralement « ils ne seront pas pour/à toi ». La traduction conserve cette formulation concise et sa tension relationnelle, sans expliciter davantage que le texte la perte causée par la captivité.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle les enfants ne seront plus à la disposition du destinataire. « Car » convient au registre solennel sans être archaïque.
- source_word: יֵלְכוּ
  choice: ils partiront
  rationale: Le qal de הלך est actif, « aller ». « Partiront » est idiomatique avec « en captivité » et évite d’introduire la forme passive « seront emmenés », même si une déportation forcée est impliquée par le contexte.
- source_word: בַּשֶּׁבִי
  choice: en captivité
  rationale: שֶׁבִי désigne directement l’état de captif ou la captivité, notamment dans un contexte de guerre et de déportation. « En exil » serait possible, mais moins précis.
theological_decisions: []
