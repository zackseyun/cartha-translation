  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: fr
  text: Tu[a] ne t’écarteras d’aucune des paroles que je vous prescris aujourd’hui, ni à droite ni à gauche, pour suivre[b] d’autres dieux et les servir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le singulier collectif (« tu »), puis le pluriel dans « je vous prescris ».
    reason: textual_grammar
  - marker: b
    text: 'Littéralement : « aller derrière ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « leur rendre un culte ». Le verbe désigne le service rendu à une divinité et peut donc avoir une portée cultuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: ne t’écarteras
  rationale: Le verbe סור exprime ici le fait de s’écarter ou de dévier de l’instruction donnée. Le futur français convient à la formulation d’une exigence dans ce contexte et conserve le singulier collectif de l’hébreu.
- source_word: מִכָּל הַדְּבָרִים
  choice: d’aucune des paroles
  rationale: Sous la négation, מִכָּל prend naturellement le sens de « d’aucune ». « Paroles » rend דְּבָרִים sans anticiper la valeur impérative que précise la proposition suivante.
- source_word: מְצַוֶּה
  choice: je vous prescris
  rationale: Le participe exprime l’action présente de Moïse. « Prescrire » est naturel en français dans un contexte d’instructions faisant autorité et évite la lourdeur de « je suis en train de vous commander ».
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne direct qui conserve l’immédiateté du renouvellement de l’alliance.
- source_word: יָמִין וּשְׂמֹאול
  choice: ni à droite ni à gauche
  rationale: Cette expression spatiale désigne une déviation dans un sens comme dans l’autre. Avec la négation initiale, la construction corrélative « ni… ni… » est idiomatique en français.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: pour suivre
  rationale: L’expression signifie littéralement « aller derrière » et, dans ce contexte, « suivre » au sens d’accorder son adhésion et son allégeance.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe de l’expression hébraïque, sans ajouter une qualification absente du verset.
- source_word: לְעָבְדָם
  choice: les servir
  rationale: עבד désigne le service rendu à une divinité et peut donc inclure le culte. « Servir » conserve à la fois le sens lexical direct et l’idée plus large d’allégeance religieuse.
theological_decisions:
- issue: La mention d’autres divinités dans l’avertissement lié à l’alliance
  choice: d’autres dieux
  alternative: des dieux étrangers
  rationale: Le texte dit simplement « d’autres dieux ». Cette formulation maintient la rhétorique du Deutéronome sans trancher une question ontologique que le verset lui-même n’aborde pas.
- issue: Valeur religieuse du verbe עבד
  choice: les servir
  alternative: leur rendre un culte
  rationale: « Servir » reflète directement le verbe hébreu tout en laissant percevoir, dans son application à des dieux, sa portée cultuelle. Traduire uniquement par « rendre un culte » préciserait davantage que ne le fait le lexème.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse collective de l’hébreu, tandis que « je vous prescris » maintient son passage explicite au pluriel. La métaphore de la droite et de la gauche est conservée parce qu’elle reste transparente en français.
