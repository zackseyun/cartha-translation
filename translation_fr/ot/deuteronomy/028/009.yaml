revisions:
- from: Yahvé fera de toi, pour lui-même, un peuple saint, comme il te l’a juré, si[a] tu gardes les commandements de Yahvé, ton Dieu, et si tu marches dans ses voies.
  to: Yahvé t’établira comme son peuple saint, comme il te l’a juré, si tu gardes les commandements de Yahvé, ton Dieu, et marches dans ses voies.
  rationale: La révision remplace une tournure française lourde par « t’établira comme son peuple saint », qui rend plus précisément l’établissement covenantal et l’appartenance exprimée par לּוֹ. Elle allège aussi la coordination conditionnelle sans en modifier la portée, et ajuste la note afin que l’alternative causale couvre l’ensemble de la proposition concernée.
