  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: fr
  text: Yahvé t’établira comme son peuple saint, comme il te l’a juré, si tu gardes les commandements de Yahvé, ton Dieu, et marches dans ses voies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְקִימְךָ
  choice: fera de toi
  rationale: Le hiphil de קום exprime ici l’établissement d’Israël dans un statut d’alliance. « Fera de toi » rend naturellement en français le résultat de cet établissement, sans évoquer une élévation physique.
- source_word: לּוֹ
  choice: pour lui-même
  rationale: Le pronom datif marque l’appartenance et la relation à Yahvé. « Pour lui-même » conserve cette force réflexive et possessive.
- source_word: לְעַם קָדוֹשׁ
  choice: un peuple saint
  rationale: La formule désigne le statut collectif d’Israël, mis à part pour Dieu. « Peuple saint » conserve le vocabulaire d’alliance sans paraphrase confessionnelle.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: comme il te l’a juré
  rationale: Cette formulation française naturelle rattache la promesse au serment antérieur tout en rendant explicite, par le pronom « l’ », ce qui a été juré.
- source_word: כִּי
  choice: si
  rationale: Dans le cadre des bénédictions et malédictions de Deutéronome 28, la conjonction introduit vraisemblablement la condition liée à l’obéissance. Une valeur causale demeure possible et est signalée en note.
- source_word: תִשְׁמֹר
  choice: tu gardes
  rationale: Avec les commandements pour complément, שׁמר signifie les garder ou les observer. « Garder » préserve l’expression biblique tout en restant compréhensible en français actuel.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: « Commandements » maintient le registre juridique et relationnel de l’alliance.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: et si tu marches dans ses voies
  rationale: La traduction conserve la métaphore hébraïque habituelle de la marche pour désigner la conduite. La répétition de « si » clarifie en français que les deux verbes dépendent de la même condition.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin יהוה et le rend comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Ce choix préserve la formule d’alliance personnelle « Yahvé, ton Dieu ».
theological_decisions:
- issue: Valeur conditionnelle de la proposition introduite par כִּי
  choice: « si tu gardes… et si tu marches… »
  alternative: « parce que tu gardes… et marches… »
  rationale: Le contexte immédiat des bénédictions conditionnées par l’écoute et l’ensemble bénédictions-malédictions favorisent la valeur conditionnelle. La note conserve toutefois la possibilité grammaticale d’une lecture causale, sans trancher au-delà des données du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes hébraïques adressées collectivement à Israël. La métaphore « marcher dans ses voies » est conservée parce qu’elle demeure intelligible et porte la dimension éthique du texte.
