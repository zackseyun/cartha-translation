lexical_decisions:
- source_word: אָרוּר
  choice: Maudits seront
  rationale: Le participe passif exprime la malédiction. La tournure au futur rend naturellement en français la formule nominale hébraïque dans la série des malédictions de l’alliance; le pluriel s’accorde avec les deux noms coordonnés.
- source_word: טַנְאֲךָ
  choice: ton panier
  rationale: טֶנֶא désigne un panier, notamment destiné aux produits récoltés. « Panier » reste précis sans spécifier indûment son contenu.
- source_word: וּמִשְאַרְתֶּךָ
  choice: et ton pétrin
  rationale: מִשְׁאֶרֶת désigne un récipient où l’on pétrit la pâte. « Pétrin » est le terme français naturel et concis; il peut désigner le récipient traditionnel aussi bien que, dans l’usage moderne, un appareil, d’où la note explicative.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. L’inversion « Maudits seront » conserve la solennité et le parallélisme de la formule de malédiction, tout en restant intelligible.
