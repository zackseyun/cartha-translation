  text: Maudits seront ton panier et ton pétrin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta huche à pétrir ». Le terme hébreu désigne un récipient utilisé pour pétrir la pâte.
