source:
  edition: WLC
  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: fr
  text: Yahweh t’ouvrira son riche trésor[a], le ciel, pour donner à ton pays la pluie au moment voulu et pour bénir tout le travail de tes mains. Tu prêteras à de nombreuses nations, mais toi, tu n’emprunteras pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « son bon trésor ». Le terme hébreu peut désigner un trésor, une réserve ou un dépôt; ici, l’image se rapporte à la pluie et aux récoltes.
    reason: alternative lexicale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin de l’alliance, conformément au texte hébreu.
- source_word: יִפְתַּח
  choice: ouvrira
  rationale: L’imparfait qal a ici une valeur future dans le contexte des bénédictions promises, tout en conservant l’image concrète de l’ouverture.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: son bon trésor
  rationale: אוֹצָר peut désigner un trésor, une réserve ou un dépôt. « Trésor » est naturel en français et conserve la valeur métaphorique, tandis que la note signale l’autre possibilité.
- source_word: הַשָּׁמַיִם
  choice: le ciel
  rationale: L’apposition identifie le bon trésor de Yahweh au ciel. Le singulier collectif est l’expression française courante pour le domaine d’où vient la pluie.
- source_word: לָתֵת מְטַר אַרְצְךָ
  choice: afin de donner à ton pays la pluie
  rationale: Cette formulation conserve la construction de but et exprime naturellement en français le rapport entre la pluie et le pays.
- source_word: בְּעִתּוֹ
  choice: en sa saison
  rationale: Le suffixe renvoie très probablement à la pluie; la formulation garde l’accent sur le moment approprié du cycle agricole.
- source_word: וּלְבָרֵךְ
  choice: et de bénir
  rationale: Maintient le parallélisme infinitif avec « afin de donner ».
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: tout le travail de tes mains
  rationale: Le pluriel français est idiomatique pour le travail accompli par une personne et rend clairement l’expression hébraïque au singulier collectif.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: Tu prêteras à de nombreuses nations
  rationale: Le hiphil de לוה signifie ici « prêter »; גּוֹיִם désigne les nations dans ce contexte national et covenantal.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: mais toi, tu n’emprunteras pas
  rationale: Au qal, לוה signifie « emprunter ». « Mais » explicite le contraste, et le pronom tonique rend l’emphase de וְאַתָּה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Identification du trésor avec le ciel
  choice: 'apposition directe : « son bon trésor, le ciel »'
  alternative: « son bon trésor dans le ciel »
  rationale: L’hébreu place « le ciel » en apposition à « son bon trésor ». La traduction évite d’introduire une relation locative absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme entité collective. La syntaxe conserve l’image poétique du ciel comme trésor divin sans devenir artificiellement littérale.
