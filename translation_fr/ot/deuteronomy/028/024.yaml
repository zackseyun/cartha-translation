base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: fr
  text: Yahweh changera la pluie de ton pays en poussière et en terre sèche[a] ; du ciel, il en tombera sur toi jusqu’à ce que tu sois détruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussière et terre ». L’hébreu associe deux termes proches désignant des matières sèches et pulvérulentes, ce qui renforce l’image de la pluie remplacée par la sécheresse et la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, conformément au texte hébreu, plutôt que remplacement par un titre.
- source_word: יִתֵּן
  choice: changera … en
  rationale: Le verbe signifie littéralement « donnera », mais la construction exprime ici que la pluie attendue devient poussière ; « changera … en » rend clairement ce sens en français.
- source_word: מְטַר אַרְצְךָ
  choice: la pluie de ton pays
  rationale: Rend directement la chaîne construite hébraïque dans un français naturel.
- source_word: אָבָק וְעָפָר
  choice: poussière et poudre
  rationale: Conserve les deux termes hébreux proches désignant des matières sèches et pulvérulentes, ainsi que l’intensité de l’image.
- source_word: מִן הַשָּׁמַיִם
  choice: du ciel
  rationale: Expression française courante et digne ; le pluriel morphologique hébreu ne nécessite pas ici un pluriel en français.
- source_word: יֵרֵד עָלֶיךָ
  choice: elles tomberont sur toi
  rationale: Le verbe hébreu est au singulier, mais le français reprend naturellement les deux substances par un pronom pluriel. « Tomberont » maintient l’image d’une pluie funeste.
- source_word: עַד הִשָּׁמְדָךְ
  choice: jusqu’à ce que tu sois détruit
  rationale: Exprime clairement le terme de la malédiction sans ajouter un agent que cette proposition hébraïque ne nomme pas explicitement.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Préserve le nom propre présent dans la source au lieu de lui substituer un titre.
- issue: Agent de la destruction finale
  choice: forme passive sans agent explicite
  alternative: jusqu’à ce qu’il t’ait détruit
  rationale: La formulation compacte de l’hébreu indique le résultat sans nommer explicitement l’agent dans cette proposition ; le passif préserve cette retenue.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse individuelle de l’hébreu. Le point-virgule maintient le parallélisme entre la transformation de la pluie et la chute de poussière depuis le ciel.
