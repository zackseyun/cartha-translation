    rationale: עָפָר renvoie ordinairement à la terre, au sol ou à la poussière. « Poudre » peut évoquer une substance préparée et affaiblit l’image de terre aride soulevée et tombant du ciel.
  - severity: low
    issue: Pronom pluriel « elles »
    rationale: Le verbe hébreu est singulier. Le pluriel français est grammaticalement possible si les deux noms sont pris comme sujet, mais « il en tombera » est plus naturel et conserve mieux la référence collective ou non spécifiée de la matière qui descend.
