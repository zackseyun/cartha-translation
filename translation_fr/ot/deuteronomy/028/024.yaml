- from: Yahweh changera la pluie de ton pays en poussière et en poudre[a] ; du ciel, elles tomberont sur toi jusqu’à ce que tu sois détruit.
  to: Yahweh changera la pluie de ton pays en poussière et en terre sèche[a] ; du ciel, il en tombera sur toi jusqu’à ce que tu sois détruit.
  rationale: La révision remplace « poudre » par « terre sèche », plus conforme au champ sémantique de עָפָר dans ce contexte, et emploie la tournure impersonnelle « il en tombera » pour une formulation française naturelle qui ne force pas le pluriel face au verbe singulier de l’hébreu. Le sens, le registre solennel et l’absence d’agent explicite dans la destruction finale sont conservés.
