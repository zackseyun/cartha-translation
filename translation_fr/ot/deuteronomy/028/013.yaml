base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: fr
  text: Yahweh fera de toi la tête et non la queue ; tu seras seulement en haut et tu ne seras pas en bas, si tu écoutes[a] les commandements de Yahweh ton Dieu, que je te commande aujourd’hui, afin de les observer et de les mettre en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si tu obéis aux commandements de Yahweh ton Dieu ». L’hébreu dit littéralement « si tu écoutes », mais, dans le contexte de l’alliance, cette écoute implique l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: Yahweh fera de toi
  rationale: 'Dans cette construction avec un attribut (« la tête »), נתן a un sens causatif : établir quelqu’un dans une position. « Fera de toi » est idiomatique en français et conserve cette force.'
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: la tête et non la queue
  rationale: La traduction conserve l’image hébraïque de la prééminence opposée à une position subalterne.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: tu seras toujours en haut et jamais en bas
  rationale: רק exprime ici l’exclusivité. « Toujours… jamais » rend naturellement en français l’opposition emphatique, tout en conservant la métaphore spatiale.
- source_word: כִּי תִשְׁמַע אֶל
  choice: si tu écoutes
  rationale: כִּי introduit ici la condition de la bénédiction. « Écoutes » conserve le sens lexical de שמע, tandis que la fin du verset explicite la dimension d’obéissance.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Ce terme usuel et digne désigne clairement les prescriptions de l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ceux que je te donne aujourd’hui
  rationale: « Donner un commandement » est naturel en français et rend l’acte présent de Moïse ; « aujourd’hui » est conservé.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: afin de les observer et de les mettre en pratique
  rationale: Cette formulation distingue les deux verbes et rend idiomatiquement l’observance attentive ainsi que l’accomplissement effectif.
theological_decisions:
- issue: Valeur conditionnelle de כִּי
  choice: si tu écoutes les commandements de Yahweh ton Dieu
  alternative: parce que tu écoutes les commandements de Yahweh ton Dieu
  rationale: Dans la série des bénédictions de Deutéronome 28, כִּי énonce la condition de la promesse. « Si » préserve cette logique d’alliance sans développer une théorie du mérite.
- issue: Portée obéissante de שמע
  choice: écoutes, avec explicitation par « observer » et « mettre en pratique »
  alternative: obéis
  rationale: Le choix conserve l’image source de l’écoute tout en laissant les infinitifs finaux exprimer sans ambiguïté l’obéissance concrète.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme entité collective. Les métaphores « tête/queue » et « haut/bas » sont conservées.
