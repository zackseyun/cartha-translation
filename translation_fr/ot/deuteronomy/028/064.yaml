  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: fr
  text: 'Yahweh te dispersera parmi tous les peuples, d’une extrémité de la terre à l’autre[a]. Là, tu serviras d’autres dieux que ni toi ni tes ancêtres n’avez connus : du bois et de la pierre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une extrémité du pays à l’autre ». Le mot hébreu peut désigner aussi bien la terre que le pays.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « bois et pierre » : il s’agit d’idoles faites de ces matériaux.'
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: te dispersera
  rationale: Le hiphil de פוץ exprime l’action de répandre ou disperser. « Te dispersera » est naturel en français et convient au contexte de la malédiction d’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּכָל הָעַמִּים
  choice: parmi tous les peuples
  rationale: « Peuples » rend directement le pluriel עַמִּים sans lui donner nécessairement le sens politique de « nations ».
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: d’une extrémité de la terre à l’autre
  rationale: Cette formulation française restitue naturellement l’étendue totale exprimée par l’idiome hébreu. « Terre » convient au contexte d’une dispersion parmi tous les peuples, tandis qu’une note préserve le sens possible de « pays ».
- source_word: וְעָבַדְתָּ
  choice: tu serviras
  rationale: « Servir » conserve la valeur fondamentale de עבד et laisse le complément « d’autres dieux » communiquer la dimension cultuelle.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Rendu direct de l’expression hébraïque désignant des divinités autres que Yahweh.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: que ni toi ni tes ancêtres n’avez connus
  rationale: La construction « ni… ni… » rend clairement la double négation implicite, et « connaître » préserve le verbe ידע sans en préciser excessivement la nuance.
- source_word: עֵץ וָאָבֶן
  choice: du bois et de la pierre
  rationale: Les noms de matière identifient par apposition la nature des dieux-idoles. Les articles partitifs sont idiomatiques en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Portée de הָאָרֶץ dans la formule de dispersion
  choice: la terre
  alternative: le pays
  rationale: La dispersion « parmi tous les peuples » favorise ici la portée géographique large de אֶרֶץ. Sa polysémie réelle est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque à Israël envisagé collectivement. La phrase est légèrement segmentée pour préserver sa clarté, et les deux notes sont placées exactement après les expressions qu’elles expliquent.
