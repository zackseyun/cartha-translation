  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: fr
  text: 'Tu serviras tes ennemis, que Yahweh enverra contre toi, dans la faim, la soif, la nudité et le manque de tout. Il[a] mettra un joug de fer sur ton cou, jusqu’à ce qu’il t’ait détruit.


    [a] Le sujet de « mettra » et de « ait détruit » peut aussi être compris comme l’ennemi, pris collectivement. Le texte principal considère que Yahweh reste le sujet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet de « mettra » et de « ait détruit » peut aussi être compris comme l’ennemi, pris collectivement. Le texte principal considère que Yahweh reste le sujet.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: Tu serviras
  rationale: Dans ce contexte de malédiction de l’alliance, עבד désigne un service imposé sous domination ennemie, non un acte d’adoration. Le futur français rend naturellement la valeur prédictive.
- source_word: אֶת אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Le nom désigne directement des ennemis ou adversaires; cette formulation est courante et fidèle.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: que Yahweh enverra contre toi
  rationale: « Contre toi » exprime clairement la portée hostile de בָּךְ, tandis que « enverra » conserve l’action attribuée à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin personnel est transcrit directement, conformément à sa présence explicite dans le texte hébreu.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  choice: dans la faim, dans la soif, dans la nudité et dans le manque de tout
  rationale: La répétition de « dans » restitue l’accumulation hébraïque des conditions de privation. « Nudité » traduit directement עֵירֹם, et « manque de tout » conserve la portée totale de חֹסֶר כֹּל.
- source_word: וְנָתַן עֹל בַּרְזֶל עַל צַוָּארֶךָ
  choice: Il mettra un joug de fer sur ton cou
  rationale: « Mettre un joug sur le cou » est idiomatique en français et préserve l’image concrète d’une domination particulièrement dure.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: jusqu’à ce qu’il t’ait détruit
  rationale: Le subjonctif passé exprime l’aboutissement envisagé par עַד avec l’infinitif construit. « Détruit » rend la gravité du hifil de שׁמד sans ajouter une précision absente du texte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Sujet de וְנָתַן et de הִשְׁמִידוֹ
  choice: 'Yahweh demeure le sujet : « Il mettra… jusqu’à ce qu’il t’ait détruit. »'
  alternative: 'L’ennemi devient le sujet : « Il mettra… jusqu’à ce qu’il t’ait détruit. »'
  rationale: Le dernier sujet singulier explicitement nommé est Yahweh, ce qui permet de poursuivre la même chaîne verbale. Cependant, le rôle de l’ennemi comme agent immédiat rend l’autre analyse possible; l’ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement singulier suit les formes hébraïques de deuxième personne du singulier. La répétition de « dans » maintient le rythme cumulatif et la dureté de la série de privations.
