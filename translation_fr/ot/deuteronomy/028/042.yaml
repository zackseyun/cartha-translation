  text: The cricket shall take possession of all your trees and the fruit of your ground[a].
translation:
  language: fr
  text: L’insecte stridulant[a] prendra possession de tous tes arbres et du fruit de ton sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grillon », « la sauterelle » ou « la locuste » ; l’identification exacte de l’insecte désigné par le mot hébreu צְלָצַל est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: tous
  rationale: Le quantificateur englobe l’ensemble des arbres et, par coordination, le fruit du sol.
- source_word: עֵצְךָ
  choice: tes arbres
  rationale: Dans ce contexte agricole, עֵץ désigne les arbres; le français emploie naturellement le pluriel après «tous».
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: et le fruit de ton sol
  rationale: Cette formulation conserve l’image concrète de פְּרִי et le sens de «sol, terre» porté par אֲדָמָה, sans généraliser en «produits du pays».
- source_word: יְיָרֵשׁ
  choice: en prendra possession
  rationale: Le verbe ירשׁ exprime ici la prise de possession. Le pronom «en» rend la construction française naturelle tout en maintenant cette métaphore plus forte que la simple consommation.
- source_word: הַצְּלָצַל
  choice: l’insecte bourdonnant
  rationale: L’identification zoologique exacte est incertaine. Une désignation descriptive fondée sur l’idée de stridulation ou de bourdonnement évite de privilégier sans certitude le grillon, la sauterelle ou la locuste.
theological_decisions: []
