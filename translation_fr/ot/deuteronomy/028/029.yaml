source:
  edition: WLC
  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: fr
  text: Tu tâtonneras à midi comme l’aveugle tâtonne dans l’obscurité[a], et tu ne réussiras dans aucune de tes entreprises[b]. Tu ne seras qu’opprimé et dépouillé, tous les jours, sans personne pour te délivrer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cherche son chemin à tâtons » ; le verbe hébreu évoque une recherche par le toucher lorsqu’on ne peut pas voir.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tu ne réussiras pas dans tes voies » ; autre traduction possible : « tu ne prospéreras pas dans tes entreprises ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « te sauver », « te secourir » ; le terme désigne ici une personne qui arrache quelqu’un à la détresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: tâtonneras / tâtonne
  rationale: Le verbe décrit l’action de chercher ou de se diriger par le toucher faute de pouvoir voir. « Tâtonner » restitue naturellement l’image concrète et la désorientation métaphorique.
- source_word: בַּצָּהֳרַיִם
  choice: à midi
  rationale: L’expression désigne le moment où la lumière est la plus forte, ce qui accentue le contraste ironique avec l’obscurité.
- source_word: הָעִוֵּר
  choice: l’aveugle
  rationale: L’adjectif masculin singulier est employé comme substantif. « L’aveugle » conserve cette forme représentative sans ajouter un nom absent de l’hébreu.
- source_word: בָּאֲפֵלָה
  choice: dans l’obscurité
  rationale: Le nom peut désigner l’obscurité ou les ténèbres. « Dans l’obscurité » est clair et fait ressortir le contraste avec midi.
- source_word: תַצְלִיחַ אֶת דְּרָכֶיךָ
  choice: tu ne réussiras dans aucune de tes entreprises
  rationale: Le verbe au hiphil exprime la réussite ou la prospérité, tandis que « tes voies » désigne ici le cours des actions et des projets. Cette formulation française naturelle conserve l’idée d’un échec généralisé.
- source_word: אַךְ
  choice: ne… qu’
  rationale: 'La particule a ici une valeur restrictive : la personne se trouvera constamment réduite à l’état décrit.'
- source_word: עָשׁוּק
  choice: opprimé
  rationale: Le participe passif désigne celui qui subit oppression, abus ou extorsion. « Opprimé » en conserve la portée générale.
- source_word: גָזוּל
  choice: dépouillé
  rationale: Le participe passif évoque le fait d’être privé de ses biens par vol ou saisie. « Dépouillé » s’applique naturellement à une personne et s’accorde au registre du passage.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: La formule souligne la continuité de cette condition. La traduction conserve directement cette durée répétée.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: sans personne pour te délivrer
  rationale: La proposition affirme l’absence de toute personne capable d’apporter la délivrance. Cette formulation est personnelle, naturelle et n’impose pas ici un sens technique au terme.
theological_decisions:
- issue: Sens de מוֹשִׁיעַ dans le contexte des malédictions de l’alliance
  choice: personne pour te délivrer
  alternative: aucun sauveur / personne pour te secourir
  rationale: La racine יָשַׁע désigne ici le fait de tirer quelqu’un de la détresse. « Délivrer » exprime ce secours concret sans transformer le participe en titre messianique ni exclure les résonances plus larges du vocabulaire biblique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse hébraïque. La répétition de « tâtonner » maintient la force de la comparaison, et la formulation évite aussi bien l’archaïsme que l’importation d’un titre théologique absent du contexte immédiat.
