  text: וְ/הָי֣וּ בְ/ךָ֔ לְ/א֖וֹת וּ/לְ/מוֹפֵ֑ת וּֽ/בְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: fr
  text: Elles[b] seront sur toi et sur ta descendance[a], comme signe et prodige, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta postérité » ; le mot hébreu signifie littéralement « semence » et peut désigner collectivement les descendants.
    reason: lexical_alternative
  - marker: b
    text: Le pronom « elles » renvoie aux malédictions décrites dans le contexte précédent.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: Elles seront
  rationale: Le parfait qal avec waw poursuit ici l’énoncé des conséquences futures. Le féminin pluriel renvoie naturellement aux malédictions du contexte, sans les nommer dans le texte.
- source_word: בְךָ
  choice: pour toi
  rationale: Dans cette construction avec « un signe et un prodige », « pour toi » est naturel en français et exprime que ces conséquences servent de signe à l’égard du destinataire, sans introduire un verbe plus précis absent de l’hébreu.
- source_word: לְאוֹת
  choice: un signe
  rationale: אוֹת désigne couramment un signe ou une marque. « Un signe » conserve ici sa fonction indicative.
- source_word: וּלְמוֹפֵת
  choice: et un prodige
  rationale: מוֹפֵת peut désigner un prodige, un phénomène frappant ou un présage. « Prodige » préserve l’association biblique avec « signe » sans imposer explicitement une valeur d’augure.
- source_word: וּבְזַרְעֲךָ
  choice: et pour ta descendance
  rationale: זֶרַע, littéralement « semence », désigne collectivement la postérité. « Descendance » est clair, actuel et convient au sens collectif.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: L’expression indique une durée continue et durable. « Pour toujours » en est l’équivalent français courant, sans expliciter davantage la nature de cette durée.
theological_decisions:
- issue: Référent du pronom « elles »
  choice: Le pronom est conservé et renvoie contextuellement aux malédictions décrites auparavant.
  alternative: Nommer explicitement « ces malédictions » ou comprendre plus largement l’ensemble des sanctions de l’alliance.
  rationale: Le verbe pluriel n’a pas de sujet exprimé dans ce verset. Le contexte rend les malédictions très probables, mais le maintien du pronom évite d’insérer cette interprétation dans le corps du texte.
- issue: Portée de עַד עוֹלָם
  choice: pour toujours
  alternative: à jamais ; de génération en génération ; perpétuellement
  rationale: La formule hébraïque exprime une continuité durable dans le cadre des sanctions de l’alliance. La traduction conserve son équivalent usuel sans en faire une affirmation philosophique explicite sur l’infinité absolue.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le pronom sans expliciter son référent dans le texte principal. « Descendance » évite le littéralisme obscur de « semence », et « pour toujours » reste accessible sans surinterprétation doctrinale.
