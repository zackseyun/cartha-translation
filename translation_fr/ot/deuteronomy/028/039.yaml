  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: fr
  text: Tu planteras et cultiveras des vignes, mais tu ne boiras pas de vin et tu n’en recueilleras pas[a], car le ver le dévorera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne le mettras pas en réserve ». Le verbe hébreu peut signifier rassembler, recueillir ou mettre en réserve.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים תִּטַּע וְעָבָדְתָּ
  choice: Tu planteras et cultiveras des vignes
  rationale: Le verbe עבד a ici son sens agricole de « cultiver » ou « travailler ». La formulation française exprime naturellement les deux activités tout en conservant leur coordination.
- source_word: וְיַיִן לֹא תִשְׁתֶּה
  choice: mais tu n’en boiras pas le vin
  rationale: Le pronom « en » rattache explicitement le vin aux vignes déjà mentionnées, sans ajouter d’information étrangère au texte.
- source_word: וְלֹא תֶאֱגֹר
  choice: et tu n’en feras pas la récolte[a]
  rationale: Le verbe אגר signifie rassembler, recueillir ou mettre en réserve. Dans ce contexte viticole, « faire la récolte » rend naturellement l’idée de ne pas pouvoir recueillir la production, tout en signalant en note l’autre nuance possible.
- source_word: כִּי תֹאכְלֶנּוּ הַתֹּלָעַת
  choice: car le ver la dévorera
  rationale: « Le ver » conserve la désignation générale du ravageur sans en préciser indûment l’espèce. « Dévorera » exprime idiomatiquement l’action destructrice de manger la récolte; le pronom féminin reprend « la récolte » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes verbales hébraïques à la deuxième personne du masculin singulier. La formulation conserve l’image agricole et la progression de la malédiction.
