source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: fr
  text: Alors, tous les peuples de la terre verront que tu portes le nom de Yahweh[a], et ils te craindront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que le nom de Yahweh est appelé sur toi ». Cet idiome indique que tu es publiquement identifié comme appartenant à Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Alors, … verront
  rationale: Le parfait qal avec waw s’inscrit dans la suite des conséquences futures de la bénédiction. « Alors » rend clairement cet enchaînement, bien que « et » soit formellement possible.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: tous les peuples de la terre
  rationale: Le pluriel עַמֵּי désigne les divers peuples; dans ce contexte de reconnaissance internationale, הָאָרֶץ a le sens large de « terre » plutôt que celui, plus local, de « pays ».
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que les peuples constateront.
- source_word: שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque construite autour du nom divin et rend directement le tétragramme par « Yahweh ».
- source_word: נִקְרָא עָלֶיךָ
  choice: est invoqué sur toi
  rationale: Cette traduction garde la forme passive et l’image du nom appelé sur une personne. L’expression signale l’identification publique d’Israël à Yahweh et son appartenance à celui-ci, sans réduire l’idiome à une seule explication.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: et ils te craindront
  rationale: Avec מן, ירא présente Israël comme l’objet ou la source de la crainte. « Te craindront » conserve l’amplitude du terme, qui peut évoquer à la fois la peur et une profonde appréhension respectueuse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée de l’idiome נִקְרָא עָלֶיךָ
  choice: le nom de Yahweh est invoqué sur toi
  alternative: tu portes le nom de Yahweh; tu es appelé du nom de Yahweh; le nom de Yahweh est proclamé sur toi
  rationale: L’idiome exprime l’identification d’Israël à Yahweh et son appartenance à lui. La traduction principale conserve l’image hébraïque; la note fournit une formulation française plus immédiatement explicite sans trancher davantage que le texte.
translation_notes:
  register: Français international actuel, clair et digne. « Te craindront » garde une tonalité biblique naturelle sans être archaïque. La tournure inhabituelle « est invoqué sur toi » est conservée pour respecter l’image hébraïque et accompagnée d’une note explicative.
