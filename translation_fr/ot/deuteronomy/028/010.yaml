review_pass:
  verdict: revise
  source_fidelity: Le verset traduit correctement la séquence de conséquence future, « tous les peuples de la terre », la reconnaissance du nom de Yahweh et la crainte qu'elle suscite. Toutefois, « le nom de Yahweh est invoqué sur toi » est trop susceptible, en français actuel, de signifier qu'on prie Yahweh à ton sujet. L'hébreu נִקְרָא עָלֶיךָ exprime plutôt que la personne est désignée/publiquement reconnue comme portant ce nom.
  naturalness: « Alors, tous les peuples de la terre verront ... et ils te craindront » est naturel et de registre biblique moderne. « Tu portes le nom de Yahweh » rend l'idiome de manière claire et idiomatique; la note peut préserver l'image littérale du nom « appelé sur » la personne.
  terminology: « Yahweh » est cohérent avec la décision fournie pour le tétragramme. « Te craindront » conserve utilement la portée de ירא sans imposer « respect » ou « terreur ».
  issues:
  - severity: medium
    issue: Sens français trompeur de « est invoqué sur toi »
    rationale: En français moderne, invoquer un nom signifie habituellement l'appeler dans la prière ou en demander l'assistance. Cette formulation ne communique pas clairement l'idiome hébreu de l'appellation et de l'appartenance; elle peut même suggérer une action cultuelle dirigée vers Yahweh pour le bénéfice de « toi ».
  revised_text: Alors, tous les peuples de la terre verront que tu portes le nom de Yahweh[a], et ils te craindront.
