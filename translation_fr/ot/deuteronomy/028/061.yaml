source:
  edition: WLC
  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: fr
  text: De plus, toute maladie et tout fléau[a] qui ne sont pas écrits dans le livre de cette loi, Yahweh les fera venir sur toi, jusqu’à ce que tu sois détruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute plaie »; le terme hébreu peut désigner un coup, une plaie ou une calamité qui frappe.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De plus
  rationale: Marque l’ajout d’autres malédictions à celles déjà énumérées, dans un français naturel et soutenu.
- source_word: כָּל חֳלִי
  choice: toute maladie
  rationale: חֳלִי désigne largement la maladie ou l’état maladif; « maladie » est clair et courant.
- source_word: וְכָל מַכָּה
  choice: et tout fléau
  rationale: מַכָּה peut désigner un coup, une plaie ou une calamité frappante. « Fléau » conserve ici la portée punitive sans la réduire à une maladie épidémique.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: qui ne sont pas écrits
  rationale: Le participe passif est rendu directement. Le pluriel français s’accorde avec les deux antécédents coordonnés, « maladie » et « fléau ».
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: dans le livre de cette loi
  rationale: Rend le groupe construit de près et maintient l’idée du document de l’alliance; « livre » est plus accessible que « rouleau ».
- source_word: יַעְלֵם
  choice: les fera venir
  rationale: Le hiphil de עלה accompagné du suffixe pronominal exprime ici le fait de faire venir ces maux; le pronom « les » reprend explicitement les deux éléments.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: עָלֶיךָ
  choice: sur toi
  rationale: Avec « fera venir », cette préposition exprime naturellement en français le jugement imposé au destinataire.
- source_word: עַד הִשָּׁמְדָךְ
  choice: jusqu’à ce que tu sois détruit
  rationale: Exprime l’aboutissement du jugement sans renforcer le verbe au-delà du sens de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom propre de l’alliance; « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Portée de מַכָּה
  choice: fléau
  alternative: plaie
  rationale: Le contexte concerne les malédictions de l’alliance, mais le terme hébreu demeure assez large pour évoquer un coup, une plaie ou une calamité. « Fléau » évite de limiter arbitrairement le sens à une affection corporelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et la gravité de la formule hébraïque sans archaïsme inutile.
