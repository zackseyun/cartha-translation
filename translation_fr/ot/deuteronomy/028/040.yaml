source:
  edition: WLC
  text: זֵיתִ֛ים יִהְי֥וּ לְ/ךָ֖ בְּ/כָל גְּבוּלֶ֑/ךָ וְ/שֶׁ֨מֶן֙ לֹ֣א תָס֔וּךְ כִּ֥י יִשַּׁ֖ל זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: fr
  text: Tu auras des oliviers sur tout ton territoire, mais tu ne t’enduiras pas d’huile, car tes olives[a] tomberont.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta récolte d’olives tombera », ou « ton olivier perdra ses fruits ». L’hébreu emploie ici « ton olivier » au singulier collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: des oliviers
  rationale: Le nom peut désigner les olives ou les oliviers selon le contexte. Leur présence sur tout le territoire indique ici naturellement les arbres.
- source_word: יִהְיוּ לְךָ
  choice: tu auras
  rationale: Cette tournure hébraïque exprime la possession; « tu auras » est direct et naturel en français.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: sur tout ton territoire
  rationale: גְּבוּל peut désigner une frontière ou l’étendue délimitée d’un pays. Ici, « territoire » exprime clairement toute la région concernée.
- source_word: וְשֶׁמֶן
  choice: d’huile
  rationale: L’hébreu dit simplement « huile ». Le contexte des oliviers permet de comprendre qu’il s’agit d’huile d’olive sans devoir l’expliciter.
- source_word: לֹא תָסוּךְ
  choice: tu ne t’enduiras pas d’huile
  rationale: Le verbe désigne l’application d’huile sur le corps. « S’enduire d’huile » évite les connotations principalement rituelles que « s’oindre » pourrait avoir pour certains lecteurs modernes.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle l’huile manquera; « car » convient au registre biblique moderne sans être archaïque.
- source_word: יִשַּׁל
  choice: tomberont
  rationale: Le verbe évoque la chute ou la perte des fruits de l’olivier, vraisemblablement avant qu’ils puissent fournir de l’huile.
- source_word: זֵיתֶךָ
  choice: tes olives
  rationale: Le singulier hébreu est collectif et peut renvoyer à l’olivier, à ses fruits ou à la récolte. « Tes olives » rend naturellement l’image des fruits qui tombent tout en conservant une note signalant l’ambiguïté.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme interlocuteur collectif. La formulation évite aussi bien l’archaïsme de « oindre » que toute interprétation cérémonielle indue.
