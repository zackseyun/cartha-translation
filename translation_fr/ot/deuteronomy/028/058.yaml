base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: fr
  text: 'Si tu ne veilles pas à mettre en pratique toutes les paroles de cette loi, écrites dans ce livre[a], afin de craindre[b] ce nom glorieux et redoutable : Yahweh[c], ton Dieu,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ce rouleau ».
    reason: lexical_alternative
  - marker: b
    text: Ou « afin de révérer ». Le verbe hébreu peut exprimer à la fois la révérence et la crainte.
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: tu ne veilles pas à mettre en pratique
  rationale: L’expression associe l’attention vigilante de שׁמר à l’accomplissement concret exprimé par עשׂה. Cette formulation est naturelle en français tout en conservant les deux dimensions.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: toutes les paroles de cette loi
  rationale: « Paroles » traduit directement דִּבְרֵי, tandis que « loi » convient au corpus d’alliance visé ici par תּוֹרָה.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: écrites dans ce livre
  rationale: Le participe passif indique que les paroles sont consignées par écrit. « Livre » est idiomatique en français moderne; « rouleau » demeure une possibilité historique signalée en note.
- source_word: לְיִרְאָה
  choice: en craignant
  rationale: Le gérondif relie l’obéissance à la crainte du nom divin sans réduire ירא à la seule révérence. Il conserve ainsi la tension entre respect profond et crainte.
- source_word: הַשֵּׁם
  choice: ce nom
  rationale: La désignation révérencielle de l’identité révélée de Dieu est maintenue au lieu d’être paraphrasée.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: glorieux et redoutable
  rationale: « Glorieux » rend le poids et l’honneur de נכבד; « redoutable » exprime la crainte mêlée d’admiration portée par נורא, dans un registre français naturel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier est rendu directement et préserve l’expression de la relation d’alliance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre de l’alliance, tandis que la note indique la convention traditionnelle.
- issue: Portée de ירא
  choice: craindre
  alternative: révérer
  rationale: « Craindre » préserve la tension théologique entre révérence et effroi que comporte le verbe hébreu, au lieu de l’adoucir dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète l’adresse hébraïque au masculin singulier. La phrase reste ouverte par une virgule, car la proposition conditionnelle se poursuit au verset suivant.
