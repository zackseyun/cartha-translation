  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: fr
  text: Tu seras fou à la vue de ce que tes yeux verront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Tu seras fou à cause de l’aspect que tes yeux verront. »'
