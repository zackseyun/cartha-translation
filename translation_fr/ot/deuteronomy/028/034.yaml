lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Tu deviendras
  rationale: Dans cette série de malédictions, la forme verbale a une valeur future et résultative. « Tu deviendras » exprime naturellement en français le passage à l’état décrit.
- source_word: מְשֻׁגָּע
  choice: fou
  rationale: Le participe de שׁגע désigne ici l’état de folie provoqué par ce qui est vu. Avec « deviendras », « fou » rend clairement ce résultat sans recourir à une formulation française lourde comme « rendu fou ».
- source_word: מִמַּרְאֵה
  choice: à la vue de
  rationale: La préposition מִן a ici une valeur causale. « À la vue de » est idiomatique et conserve le lien concret avec la perception visuelle.
- source_word: עֵינֶיךָ
  choice: tes yeux
  rationale: La traduction explicite des yeux préserve l’image concrète et l’insistance sensorielle de l’hébreu.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: de ce que tes yeux verront
  rationale: Cette formulation conserve la reprise du vocabulaire de la vue et rend au futur la scène annoncée, tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier reflète l’adresse hébraïque à la deuxième personne du singulier. La répétition « vue… yeux verront » est maintenue parce qu’elle reproduit l’insistance visuelle du texte source.
