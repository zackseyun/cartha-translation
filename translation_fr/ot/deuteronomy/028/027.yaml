  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֤ין מִצְרַ֨יִם֙ ו/ב/עפלים וּ/בַ/גָּרָ֖ב וּ/בֶ/חָ֑רֶס אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: fr
  text: Yahweh te frappera des ulcères d’Égypte, de tumeurs[a], de croûtes et de démangeaisons dont tu ne pourras pas être guéri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hémorroïdes » ; le terme hébreu est incertain et peut désigner plus précisément des gonflements dans la région anale.
    reason: Variante lexicale pour un terme hébreu difficile dont le sens précis et la localisation anatomique sont incertains.
lexical_decisions:
- source_word: יַכְּכָה
  choice: te frappera
  rationale: Le hiphil de נכה exprime ici une atteinte directe. « Te frappera » est clair, énergique et naturel en français biblique moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: des ulcères d’Égypte
  rationale: שְׁחִין désigne une affection cutanée inflammatoire, telle qu’un ulcère ou un furoncle. Le pluriel français convient à la catégorie de maladie, et « d’Égypte » maintient le lien génitival ainsi que l’écho possible aux plaies d’Égypte.
- source_word: וּבְעפלים
  choice: de tumeurs
  rationale: Le terme désigne probablement des gonflements ou tumeurs, mais sa nature précise demeure incertaine. Le choix général « tumeurs » évite de préciser sans certitude une localisation anale.
- source_word: וּבַגָּרָב
  choice: de croûtes
  rationale: גָּרָב renvoie à une affection cutanée caractérisée par des croûtes. Ce rendu concret reste prudent sans imposer un diagnostic médical moderne.
- source_word: וּבֶחָרֶס
  choice: de démangeaisons
  rationale: Le nom évoque une affection cutanée qui démange. « Démangeaisons » exprime ce sens sans la diagnostiquer plus précisément comme eczéma ou dartre.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: dont tu ne pourras pas guérir
  rationale: La formulation conserve l’idée d’une affection incurable et rend naturellement en français la valeur passive du niphal de רפא.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » préserve le nom personnel présent dans le texte hébreu, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. L’énumération garde le caractère concret et sévère du texte, tandis que la note signale l’incertitude réelle de וּבְעפלים sans la résoudre abusivement.
