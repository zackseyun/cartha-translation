base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: fr
  text: 'Le matin, tu diras[a] : « Si seulement c’était le soir ! » et le soir, tu diras : « Si seulement c’était le matin ! » à cause de l’effroi que tu éprouveras dans ton cœur et du spectacle que tes yeux verront.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qui donnera le soir ? […] Qui donnera le matin ? » Formule hébraïque exprimant ici un souhait ardent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à cause de l’effroi de ton cœur, que tu éprouveras, et à cause du spectacle de tes yeux, que tu verras ». Autre traduction possible : « à cause de la peur dans ton cœur et de ce que tes yeux verront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Le matin
  rationale: Le groupe prépositionnel temporel défini se rend naturellement ainsi en français.
- source_word: תֹּאמַר
  choice: tu diras
  rationale: L’imparfait hébreu à la 2e personne du masculin singulier annonce ici les effets futurs de la malédiction.
- source_word: מִי יִתֵּן
  choice: Si seulement c’était
  rationale: La formule idiomatique exprime un souhait ardent, et non une question littérale sur celui qui donnerait le matin ou le soir.
- source_word: עֶרֶב / בֹּקֶר
  choice: le soir / le matin
  rationale: Ces termes temporels courants forment un parallélisme antithétique.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: tant ton cœur sera saisi d’effroi
  rationale: Cette formulation française naturelle conserve l’intensité de פַּחַד et présente la peur intérieure comme la cause du souhait, tout en évitant une répétition maladroite en français.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: à cause de ce que tes yeux verront
  rationale: Cette tournure garde l’image concrète des yeux témoins d’un spectacle terrifiant et exprime clairement la valeur causale de מִן.
theological_decisions: []
translation_notes:
  register: 'Français moderne, international et digne. Le tutoiement singulier conserve l’adresse hébraïque à la deuxième personne du singulier. La phrase privilégie une équivalence optimale : elle maintient le parallélisme matin/soir et les images du cœur et des yeux, tout en rendant idiomatiquement les répétitions hébraïques.'
