  text: אֵלֶּה֩ דִבְרֵ֨י הַ/בְּרִ֜ית אֲֽשֶׁר צִוָּ֧ה יְהוָ֣ה אֶת מֹשֶׁ֗ה לִ/כְרֹ֛ת אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ מוֹאָ֑ב מִ/לְּ/בַ֣ד הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת אִתָּ֖/ם בְּ/חֹרֵֽב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: fr
  text: Voici les paroles de l’alliance que Yahweh ordonna à Moïse de conclure[a] avec les fils d’Israël au pays de Moab, en plus de l’alliance qu’il avait conclue avec eux à Horeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « couper une alliance » ; la même expression revient dans « l’alliance qu’il avait conclue avec eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: Voici les paroles de l’alliance
  rationale: La formule déictique introduit solennellement le contenu de l’alliance. « Voici » est naturel en français et « paroles » conserve la forme concrète de דִבְרֵי sans réduire d’emblée le sens à de simples clauses juridiques.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: צִוָּה
  choice: ordonna
  rationale: Le verbe exprime un commandement explicite. Le passé simple convient au registre narratif solennel du verset.
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: conclure une alliance
  rationale: L’hébreu dit littéralement « couper une alliance », idiome que le français rend naturellement par « conclure une alliance ». La métaphore source est signalée en note.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme hébraïque et sa portée collective, sans la remplacer silencieusement par « les Israélites » ou « le peuple d’Israël ».
- source_word: בְּאֶרֶץ מוֹאָב
  choice: au pays de Moab
  rationale: Cette expression restitue explicitement אֶרֶץ tout en restant idiomatique en français.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: Dans ce contexte, la préposition distingue l’alliance de Moab de celle conclue à Horeb et présente la première comme venant s’y ajouter, sans affirmer davantage sur leur relation théologique.
- source_word: בְּחֹרֵב
  choice: à Horeb
  rationale: « À Horeb » est la tournure française naturelle pour situer l’événement. Le toponyme hébreu est maintenu sans harmonisation avec « Sinaï ».
theological_decisions:
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: La formulation choisie rend directement l’expression hébraïque et laisse visible son langage de filiation collective, même si elle désigne ici l’ensemble d’Israël.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte source emploie le nom propre divin. Sa translittération préserve cette donnée au lieu de lui substituer un titre.
- issue: Relation entre l’alliance de Moab et celle d’Horeb
  choice: en plus de l’alliance
  alternative: indépendamment de l’alliance / outre l’alliance
  rationale: « En plus de » rend la distinction exprimée par מִלְּבַד sans décider si les deux alliances doivent être comprises comme entièrement séparées, renouvelées ou organiquement liées.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient la solennité narrative sans archaïsmes lexicaux. « Voici » donne au verset sa fonction d’introduction ou de titre, et la répétition de « l’alliance » ainsi que de « conclure » reflète la structure hébraïque.
