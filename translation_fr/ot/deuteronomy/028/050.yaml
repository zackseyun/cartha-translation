translation:
  language: fr
  text: une nation au visage farouche[a], qui n’aura aucun égard pour les personnes âgées[b] et n’accordera aucune faveur aux jeunes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une nation forte de visage ». Ou : « une nation au visage dur ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie littéralement « qui ne lève pas le visage de la personne âgée »; elle peut aussi se traduire par « qui ne respecte pas les personnes âgées ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui n’aura aucune pitié des jeunes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹי
  choice: nation
  rationale: Le terme désigne ici un peuple étranger organisé, présenté dans le contexte comme une puissance d’invasion; « nation » est naturel et précis.
- source_word: עַז פָּנִים
  choice: au visage dur
  rationale: L’expression signifie littéralement « fort/dur de visage ». « Au visage dur » conserve l’image du visage tout en évoquant une dureté implacable dans un français actuel.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif introduit naturellement les deux propositions qui caractérisent la nation.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: n’a aucun égard pour les personnes âgées
  rationale: L’expression idiomatique « relever/porter le visage » peut signifier accorder faveur, considération ou respect. Dans ce contraste d’âges, « n’avoir aucun égard » rend clairement le manque de considération envers les vieillards.
- source_word: זָקֵן
  choice: les personnes âgées
  rationale: Le singulier hébreu a une valeur générique. Cette formulation moderne évite d’imposer un référent exclusivement masculin.
- source_word: וְנַעַר
  choice: les jeunes
  rationale: נַעַר peut désigner un enfant, un adolescent ou un jeune homme. En opposition à זָקֵן, « les jeunes » préserve utilement cette amplitude.
- source_word: לֹא יָחֹן
  choice: aucune pitié
  rationale: Le verbe חנן exprime l’octroi de grâce ou de faveur et peut, dans un contexte hostile, évoquer la compassion ou la pitié. « Aucune pitié » communique naturellement ici le caractère impitoyable de l’envahisseur, sans effacer la possibilité de traduire par « faveur ».
