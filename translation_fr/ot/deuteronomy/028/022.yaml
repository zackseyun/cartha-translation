  text: יַכְּ/כָ֣ה יְ֠הוָה בַּ/שַּׁחֶ֨פֶת וּ/בַ/קַּדַּ֜חַת וּ/בַ/דַּלֶּ֗קֶת וּ/בַֽ/חַרְחֻר֙ וּ/בַ/חֶ֔רֶב וּ/בַ/שִּׁדָּפ֖וֹן וּ/בַ/יֵּרָק֑וֹן וּ/רְדָפ֖וּ/ךָ עַ֥ד אָבְדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: fr
  text: Yahweh te frappera de maladie débilitante[a], de fièvre, d’inflammation, de chaleur brûlante, de l’épée, de brûlure des récoltes et de mildiou ; tous ces fléaux te poursuivront[b] jusqu’à ce que tu périsses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maladie qui consume » ; le terme hébreu désigne une affection qui épuise et fait dépérir, sans permettre d’identifier avec certitude une maladie précise.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils te poursuivront » ; le verbe hébreu est au pluriel et renvoie aux afflictions et aux désastres qui précèdent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: te frappera
  rationale: Le hiphil de נכה signifie couramment « frapper ». Cette formulation conserve la force punitive et l’adresse directe au singulier.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: שַׁחֶפֶת
  choice: maladie débilitante
  rationale: Le terme désigne une affection qui consume et affaiblit. Cette expression moderne évite de préciser sans fondement une maladie comme la tuberculose.
- source_word: קַּדַּחַת
  choice: fièvre
  rationale: Le nom désigne une affection fébrile ; « fièvre » est l’équivalent français le plus clair.
- source_word: דַּלֶּקֶת
  choice: inflammation
  rationale: Le terme appartient au champ de la brûlure et de l’inflammation. Le français conserve sa distinction par rapport à la fièvre voisine.
- source_word: חַרְחֻר
  choice: chaleur brûlante
  rationale: Ce terme rare évoque probablement une chaleur ardente ou une fièvre brûlante. La traduction garde cette relative indétermination.
- source_word: חֶרֶב
  choice: par l’épée
  rationale: Le sens usuel est « épée », avec ici une possible portée métonymique de guerre ou de mort violente. L’image concrète est conservée.
- source_word: שִׁדָּפוֹן
  choice: rouille des céréales
  rationale: Dans cette série agricole, le terme désigne un fléau qui dessèche ou brûle les cultures. « Rouille des céréales » offre une désignation française intelligible sans reprendre le sens littéral incertain de façon opaque.
- source_word: יֵרָקוֹן
  choice: mildiou
  rationale: Dans un contexte agricole, le terme évoque une altération ou un jaunissement des végétaux. « Mildiou » est un équivalent traditionnel et compréhensible, sans certitude botanique absolue.
- source_word: וּרְדָפוּךָ
  choice: tous ces fléaux te poursuivront
  rationale: Le verbe est au pluriel et renvoie naturellement aux afflictions et désastres énumérés. Le sujet explicité rend ce pluriel clair en français.
- source_word: עַד אָבְדֶךָ
  choice: jusqu’à ce que tu périsses
  rationale: La forme de אבד exprime la perte ou la ruine. Cette traduction concise maintient l’adresse personnelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
- issue: Référent du verbe pluriel וּרְדָפוּךָ
  choice: tous ces fléaux te poursuivront
  alternative: ils te poursuivront
  rationale: Le pluriel grammatical est maintenu et son référent est explicité sans réduire la liste à une seule catégorie de malheur.
translation_notes:
  register: Français international moderne, digne et direct. L’énumération solennelle est conservée, tout comme la deuxième personne du singulier. Les termes médicaux et agricoles restent accessibles, tandis que les notes signalent les incertitudes lexicales réelles.
