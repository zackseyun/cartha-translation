  text: בָּר֧וּךְ פְּרִֽי בִטְנְ/ךָ֛ וּ/פְרִ֥י אַדְמָתְ/ךָ֖ וּ/פְרִ֣י בְהֶמְתֶּ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: fr
  text: 'Béni sera le fruit de ton ventre, le fruit de ton sol et le fruit de ton bétail : les petits de tes bovins et les jeunes de ton petit bétail.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni sera
  rationale: L’adjectif prédicatif ouvre une formule de bénédiction et, dans le contexte, porte une valeur prospective. Cette tournure conserve la cadence solennelle de l’hébreu.
- source_word: פְּרִי
  choice: fruit
  rationale: Le même mot est maintenu dans ses trois occurrences afin de préserver le parallélisme qui unit fécondité humaine, production du sol et reproduction animale.
- source_word: בִטְנְךָ
  choice: ton ventre
  rationale: Le terme désigne ici le ventre comme lieu de la gestation. Cette image concrète convient à la formule « fruit de ton ventre » et n’impose pas un référent exclusivement féminin au destinataire grammaticalement masculin.
- source_word: אַדְמָתְךָ
  choice: ton sol
  rationale: « Sol » exprime le terrain productif dans ce contexte agricole, sans élargir le sens au territoire tout entier.
- source_word: בְהֶמְתֶּךָ
  choice: ton bétail
  rationale: Le terme hébreu englobe les animaux domestiques; « bétail » est ici un collectif français naturel, ensuite précisé par les bovins et le petit bétail.
- source_word: שְׁגַר
  choice: les petits
  rationale: Dans cette expression d’élevage, le mot désigne ce que les bêtes mettent bas, donc leur progéniture.
- source_word: אֲלָפֶיךָ
  choice: tes bovins
  rationale: Le nom renvoie au gros bétail, notamment aux bœufs et aux vaches. « Bovins » garde cette précision et contraste clairement avec le petit bétail.
- source_word: עַשְׁתְּרֹת
  choice: les jeunes
  rationale: Dans la locution traditionnelle avec צֹאן, le mot désigne vraisemblablement la progéniture ou l’accroissement du troupeau; « les jeunes » exprime ce sens sans fausse précision.
- source_word: צֹאנְךָ
  choice: ton petit bétail
  rationale: Le collectif comprend généralement les moutons et les chèvres. « Petit bétail » est plus précis que « troupeaux » et s’accorde avec le contraste bovins/petit bétail.
theological_decisions: []
translation_notes:
