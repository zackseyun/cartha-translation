  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: fr
  text: Maudit soit le fruit de ton sein, le fruit de ton sol[a], les petits de ton gros bétail et ceux de ton petit bétail[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les produits de ta terre ». L’hébreu dit littéralement « le fruit de ton sol », ce qui maintient le parallèle avec « le fruit de ton sein ».
    reason: lexical_alternative
  - marker: b
    text: 'Les expressions hébraïques désignent ici précisément les petits ou l’accroissement du bétail : d’abord les bovins, puis les moutons et les chèvres.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Maudits seront
  rationale: Cette formule déclarative conserve la cadence solennelle des malédictions de l’alliance. Le pluriel français s’accorde naturellement avec l’ensemble des éléments coordonnés.
- source_word: פְּרִי בִטְנְךָ
  choice: le fruit de ton sein
  rationale: Expression française courante et digne pour désigner la descendance, tout en conservant la métaphore hébraïque du fruit.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: le fruit de ton sol
  rationale: Cette traduction conserve le parallélisme lexical avec « le fruit de ton sein » et rend אַדָמָה comme le sol ou la terre cultivable.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: les petits de ton gros bétail
  rationale: שְׁגַר désigne ici les petits ou la progéniture des bovins; « gros bétail » distingue clairement cette catégorie du petit bétail mentionné ensuite.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: et ceux de ton petit bétail
  rationale: L’expression désigne les petits ou l’accroissement des moutons et des chèvres. « Ceux » évite une répétition lourde tout en reprenant clairement « les petits ».
