  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: fr
  text: Tu seras maudit quand tu entreras[a], et tu seras maudit quand tu sortiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ton entrée… dans ta sortie ». Cette expression hébraïque désigne l’ensemble du cours de la vie quotidienne.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: maudit
  rationale: Le participe passif exprime l’état de celui qui est sous la malédiction. « Maudit » est l’équivalent français courant et solennel qui convient au contexte des sanctions de l’alliance.
- source_word: אַתָּה
  choice: tu
  rationale: Le pronom hébreu est à la deuxième personne du masculin singulier. Le tutoiement conserve cette adresse directe et singulière à Israël.
- source_word: בְּבֹאֶךָ
  choice: à ton arrivée
  rationale: L’expression signifie littéralement « lors de ton entrée ». « À ton arrivée » est naturel en français et maintient le parallélisme avec « à ton départ ».
- source_word: וְ
  choice: et
  rationale: La conjonction simple relie les deux propositions parallèles.
- source_word: בְּצֵאתֶךָ
  choice: à ton départ
  rationale: L’expression signifie littéralement « lors de ta sortie ». Dans cette formule idiomatique, « à ton départ » forme avec « à ton arrivée » une paire qui embrasse l’ensemble des activités quotidiennes.
theological_decisions:
- issue: Rendre la formule de malédiction de l’alliance sans lui donner une valeur imprécatoire
  choice: Tu seras maudit à ton arrivée, et tu seras maudit à ton départ.
  alternative: Maudit sois-tu à ton arrivée, et maudit sois-tu à ton départ.
  rationale: « Maudit sois-tu » pourrait être compris comme un souhait ou une imprécation. Le futur « tu seras maudit » exprime clairement la sanction annoncée dans le contexte, tout en répétant « maudit » conformément au parallélisme solennel de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tu seras maudit » conserve la cadence solennelle de la formule d’alliance; la tournure « à ton arrivée… à ton départ » reste naturelle tout en préservant le mérisme hébreu.
