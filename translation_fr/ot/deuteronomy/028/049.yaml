source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: fr
  text: 'Yahweh fera venir contre toi une nation lointaine, venue des confins de la terre[a], comme l’aigle qui fond[b] : une nation dont tu ne comprendras pas la langue[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’extrémité de la terre »; le mot peut aussi signifier « pays ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme l’aigle vole » ou « s’élance ». Le verbe hébreu souligne la rapidité du mouvement; le nom de l’oiseau peut aussi désigner un vautour.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dont tu n’entendras pas la langue »; il s’agit ici de ne pas la comprendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: fera venir contre
  rationale: Dans cette construction avec עַל, le verbe נשׂא exprime l’action de susciter ou d’amener une nation contre quelqu’un. « Fera venir contre » rend clairement l’initiative divine sans calquer le sens littéral « soulèvera ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé sous forme de translittération plutôt que remplacé par un titre.
- source_word: גּוֹי
  choice: nation
  rationale: Dans ce contexte de malédiction d’alliance et d’invasion, גּוֹי désigne une puissance nationale étrangère.
- source_word: מֵרָחוֹק
  choice: lointaine
  rationale: Cette formulation française naturelle conserve l’idée d’une grande distance.
- source_word: מִקְצֵה הָאָרֶץ
  choice: venue des confins de la terre
  rationale: « Des confins de la terre » restitue l’expression d’éloignement extrême, tout en conservant l’image spatiale de l’hébreu.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: comme l’aigle qui fond
  rationale: Le verbe דאה évoque ici un déplacement aérien rapide. « Fond » communique la vitesse et la menace sans ajouter explicitement une proie absente du texte.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: dont tu ne comprendras pas la langue
  rationale: Littéralement, l’expression parle de ne pas « entendre » la langue; en contexte, שמע désigne la compréhension de paroles prononcées.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de הָאָרֶץ dans l’expression מִקְצֵה הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte insiste sur l’extrême éloignement de la nation envahissante. « Terre » garde toutefois une portée potentiellement plus vaste sans identifier une puissance historique particulière.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste accessible tout en conservant l’image menaçante de l’oiseau et le mouvement du texte hébreu. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme entité collective.
