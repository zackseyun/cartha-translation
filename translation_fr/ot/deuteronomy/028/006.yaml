  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: fr
  text: Tu[a] seras béni quand tu entreras[b], et tu seras béni quand tu sortiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici « tu » au singulier ; Israël est interpellé collectivement comme un seul peuple.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « dans ton entrée… dans ta sortie ». Cette expression désigne probablement l’ensemble de la vie et des activités.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Tu seras béni
  rationale: Le participe passif de ברך a ici une valeur prédicative dans l’annonce des bénédictions de l’alliance. Le futur français convient au contexte et garde la solennité de la formule.
- source_word: אַתָּה
  choice: tu
  rationale: Le pronom hébreu est à la deuxième personne du masculin singulier et s’adresse collectivement à Israël. Le singulier « tu » préserve directement cette forme d’adresse.
- source_word: בְּבֹאֶךָ
  choice: quand tu entreras
  rationale: La préposition ב suivie de l’infinitif construit de בוא et du suffixe de deuxième personne indique la circonstance de l’entrée. Cette formulation est naturelle en français tout en conservant l’image concrète.
- source_word: וּבָרוּךְ
  choice: et tu seras béni
  rationale: La répétition intégrale de la formule reproduit le parallélisme et l’équilibre rhétorique de l’hébreu.
- source_word: בְּצֵאתֶךָ
  choice: quand tu sortiras
  rationale: La préposition ב suivie de l’infinitif construit de יצא et du suffixe de deuxième personne indique la circonstance de la sortie. Le couple « entrer / sortir » conserve à la fois le sens littéral et sa portée englobante probable.
theological_decisions:
- issue: Adresse représentative d’Israël au singulier
  choice: Conserver le singulier « tu » sans le transformer en pluriel ni nommer explicitement Israël dans le verset.
  alternative: « Vous serez bénis… » ou « Israël sera béni… »
  rationale: L’hébreu emploie le masculin singulier pour s’adresser à Israël comme peuple de l’alliance. Le singulier français maintient cette forme sans ajouter une interprétation au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur restitue la portée annoncée de la bénédiction, tandis que la répétition de « tu seras béni » conserve la cadence solennelle et le parallélisme de l’original.
