lexical_decisions:
- source_word: בָּרוּךְ
  choice: seront bénis
  rationale: Le participe passif de ברך a ici une valeur déclarative dans la série des bénédictions de l’alliance. Le futur français exprime cette portée sans transformer l’énoncé en souhait.
- source_word: טַנְאֲךָ
  choice: ton panier
  rationale: טֶנֶא désigne un panier, notamment destiné au transport des produits agricoles. « Panier » reste naturel et n’ajoute pas une précision absente de l’hébreu.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: et ton pétrin
  rationale: מִשְׁאֶרֶת désigne un récipient dans lequel on prépare ou pétrit la pâte. « Pétrin » est concis, idiomatique et adapté au contexte des provisions domestiques.
