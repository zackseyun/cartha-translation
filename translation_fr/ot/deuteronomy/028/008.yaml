  text: יְצַ֨ו יְהוָ֤ה אִתְּ/ךָ֙ אֶת הַ/בְּרָכָ֔ה בַּ/אֲסָמֶ֕י/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֣ח יָדֶ֑/ךָ וּ/בֵ֣רַכְ/ךָ֔ בָּ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: fr
  text: Yahweh ordonnera à la bénédiction d’être avec toi dans tes greniers[a] et dans tout ce que tu entreprendras[b]. Il te bénira dans le pays que Yahweh, ton Dieu, te donne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tes entrepôts » ou « dans tes granges ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans tout envoi de ta main », expression hébraïque qui désigne tout travail ou toute entreprise.
    reason: lexical_alternative
  - marker: c
    text: Ou « est en train de te donner » ou « te donnera ». Le participe hébreu peut prendre ici plusieurs valeurs temporelles.
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו יְהוָה אִתְּךָ אֶת הַבְּרָכָה
  choice: Yahweh ordonnera que la bénédiction soit avec toi
  rationale: Le piel de צוה signifie couramment « ordonner ». Cette formulation française conserve l’image vive selon laquelle Yahweh donne ordre à la bénédiction, tout en rendant naturellement אִתְּךָ, « avec toi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: בַּאֲסָמֶיךָ
  choice: dans tes greniers
  rationale: אָסָם désigne un lieu où l’on entrepose notamment les récoltes. « Greniers » est concret, courant et adapté au contexte agricole; « entrepôts » reste possible.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: et dans tout ce que tu entreprendras
  rationale: L’expression hébraïque, littéralement liée à ce vers quoi l’on envoie ou étend la main, désigne l’ensemble des travaux et entreprises d’une personne. La formulation choisie transmet clairement cet idiome.
- source_word: וּבֵרַכְךָ
  choice: Il te bénira
  rationale: Le parfait précédé de waw poursuit ici la perspective future ouverte par יְצַו. Le pronom explicite maintient Yahweh comme sujet.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans le Deutéronome, אֶרֶץ désigne ici le territoire donné à Israël. « Pays » est naturel en français et conserve la portée territoriale et relationnelle du terme.
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le participe peut présenter le don comme actuel, caractéristique ou imminent. Le présent français « te donne » conserve cette souplesse sans imposer exclusivement une valeur future.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: La translittération préserve le nom personnel du Dieu de l’alliance au lieu de lui substituer un titre. La forme « Yahweh » suit la convention du projet.
- issue: Portée de « la bénédiction »
  choice: ordonnera que la bénédiction soit avec toi
  alternative: fera venir sur toi la bénédiction
  rationale: Le choix conserve la personnification implicite et la force du verbe « ordonner », sans préciser au-delà du texte le mécanisme de la bénédiction.
- issue: Valeur temporelle de נֹתֵן
  choice: te donne
  alternative: est en train de te donner; te donnera
  rationale: Le participe hébreu admet plusieurs nuances temporelles. Le présent français maintient l’ambiguïté entre don en cours, certain et imminent.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme à une unité. La syntaxe conserve l’image inhabituelle mais significative de Yahweh donnant un ordre à la bénédiction, tandis que l’idiome de la main est rendu de façon intelligible et expliqué en note.
