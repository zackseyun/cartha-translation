  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: fr
  text: Yahweh te frappera de graves furoncles aux genoux et aux jambes[a], dont tu ne pourras pas être guéri, de la plante de ton pied jusqu’au sommet de ta tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux tibias » ; le terme hébreu désigne plus précisément la partie inférieure de la jambe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: te frappera
  rationale: Le hiphil de נכה exprime couramment l’action de frapper ou d’infliger un mal. « Te frappera » reste direct, naturel et fidèle à l’action divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בִּשְׁחִין רָע
  choice: de furoncles graves
  rationale: שְׁחִין désigne une éruption cutanée enflammée, un furoncle ou un ulcère; le singulier peut avoir une valeur collective. רָע en souligne la gravité.
- source_word: עַל הַבִּרְכַּיִם
  choice: aux genoux
  rationale: Équivalent anatomique direct et idiomatique en français.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: et aux jambes
  rationale: שׁוֹק vise plus précisément la partie inférieure de la jambe. « Jambes » est naturel dans le corps du texte, tandis que la précision est conservée en note.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: dont tu ne pourras pas guérir
  rationale: Le niphal infinitif de רפא exprime ici l’impossibilité d’être guéri ou de guérir de l’affection. Cette formulation française est fluide sans atténuer son caractère incurable.
- source_word: מִכַּף רַגְלְךָ
  choice: depuis la plante de ton pied
  rationale: כַּף associé au pied désigne idiomatiquement la plante.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: jusqu’au sommet de ta tête
  rationale: קָדְקֹד désigne le sommet ou la partie la plus haute de la tête; la formule rend l’étendue du mal sur tout le corps.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération évite de remplacer ce nom par un titre et n’ajoute aucune interprétation confessionnelle.
- issue: Rapport de la proposition relative אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: La relative se rapporte aux furoncles, comme affection dont on ne peut guérir
  alternative: Comprendre plus généralement que la personne ne pourra être guérie
  rationale: L’antécédent grammatical et le sens permettent de décrire l’affection comme incurable; la formulation française conserve l’effet sans préciser un agent humain ou divin de guérison.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël. « Furoncles graves » conserve l’image concrète et la valeur collective de l’hébreu; « depuis… jusqu’à… » restitue la progression couvrant tout le corps.
