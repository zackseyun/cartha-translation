id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: fr
  text: Ton bœuf sera abattu sous tes yeux, mais tu n’en mangeras pas. Ton âne sera arraché de devant toi[a] et ne te sera pas rendu. Ton petit bétail sera livré à tes ennemis, et tu n’auras personne pour te sauver[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera volé sous tes yeux »; le verbe hébreu évoque une prise injuste, souvent accomplie par la force.
    reason: lexical_alternative
  - marker: b
    text: Ou « il n’y aura pour toi aucun libérateur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: ton bœuf
  rationale: שׁוֹר désigne ici un bovin domestique, vraisemblablement un animal de travail; « bœuf » est précis et naturel dans ce contexte.
- source_word: טָבוּחַ
  choice: sera abattu
  rationale: Le participe passif de טבח évoque l’abattage d’un animal, notamment en vue de sa consommation; le futur convient à la série de malédictions annoncées.
- source_word: לְעֵינֶיךָ
  choice: sous tes yeux
  rationale: Cette expression française courante conserve l’idée d’un acte accompli ouvertement en présence du propriétaire.
- source_word: מִמֶּנּוּ
  choice: tu n’en mangeras pas
  rationale: Le pronom adverbial « en » rend naturellement מן avec suffixe après le verbe « manger » et signifie qu’aucune part de l’animal ne profitera au propriétaire.
- source_word: חֲמֹרְךָ
  choice: ton âne
  rationale: Équivalent moderne et direct du nom hébreu.
- source_word: גָּזוּל
  choice: sera arraché
  rationale: Le participe passif de גזל exprime une prise injuste, souvent violente. « Arraché » restitue mieux cette dépossession forcée que le simple « volé ».
- source_word: מִלְּפָנֶיךָ
  choice: de devant toi
  rationale: La formulation garde l’image concrète de l’animal emmené en présence même de son propriétaire.
- source_word: יָשׁוּב לָךְ
  choice: ne te sera pas rendu
  rationale: Cette tournure française exprime idiomatiquement l’absence de restitution, tout en correspondant au sens contextuel de « ne reviendra pas à toi ».
- source_word: צֹאנְךָ
  choice: ton petit bétail
  rationale: צֹאן peut englober les moutons et les chèvres; « petit bétail » préserve cette portée collective sans la réduire aux seules brebis.
- source_word: נְתֻנוֹת
  choice: sera livré
  rationale: Le participe passif de נתן signifie littéralement « donné ». Avec des ennemis comme bénéficiaires, « livré » exprime naturellement la remise hostile sans ajouter une idée étrangère.
- source_word: לְאֹיְבֶיךָ
  choice: à tes ennemis
  rationale: Équivalent français direct et usuel de אֹיֵב dans ce contexte d’hostilité.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: tu n’auras personne pour te sauver
  rationale: La formule rend de manière naturelle l’absence d’un מוֹשִׁיעַ, c’est-à-dire d’une personne capable de sauver ou de délivrer.
theological_decisions:
- issue: Portée du langage de salut dans la dernière proposition
  choice: tu n’auras personne pour te sauver
  alternative: il n’y aura pour toi aucun libérateur
  rationale: Le participe מוֹשִׁיעַ, issu de ישׁע, désigne celui qui sauve ou délivre. Ici, il s’agit immédiatement d’un secours face à la spoliation liée à la malédiction de l’alliance; « sauver » conserve néanmoins le terme fort du texte sans lui imposer une portée exclusivement spirituelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque. « Petit bétail » conserve l’inclusion possible des moutons et des chèvres. Les participes passifs hébreux sont rendus au futur pour s’intégrer à la séquence prophétique des malédictions.
