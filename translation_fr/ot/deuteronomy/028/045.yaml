  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: fr
  text: Toutes ces malédictions viendront sur toi, te poursuivront et t’atteindront, jusqu’à ce que tu sois détruit, parce que tu n’as pas écouté la voix de Yahweh, ton Dieu, en observant ses commandements et ses prescriptions qu’il t’a commandés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: viendront sur toi
  rationale: Dans cet avertissement d’alliance, la forme verbale présente les malédictions comme une conséquence à venir. « Sur toi » conserve la direction hostile de עַל.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: toutes ces malédictions
  rationale: Rendu direct et naturel du syntagme, adapté au contexte des bénédictions et des malédictions.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: te poursuivront et t’atteindront
  rationale: La séquence évoque des malédictions qui poursuivent leur cible puis la rejoignent. « T’atteindront » est naturel en français et garde l’image sans explicitation excessive.
- source_word: עַד הִשָּׁמְדָךְ
  choice: jusqu’à ce que tu sois détruit
  rationale: L’infinitif construit avec suffixe indique ici le terme ou le résultat; le passif français évite d’ajouter un agent non exprimé.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: parce que tu n’as pas écouté la voix
  rationale: Cette formulation préserve la métaphore auditive de l’hébreu, tout en laissant le contexte d’obéissance apparaître dans la proposition suivante.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu
  rationale: Le nom divin est translittéré afin de conserver le nom propre d’alliance présent dans le texte hébreu.
- source_word: לִשְׁמֹר
  choice: en observant
  rationale: L’infinitif précise concrètement en quoi consiste l’écoute de la voix divine. « En observant » exprime naturellement cette relation de manière en français.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: ses commandements et ses prescriptions
  rationale: « Commandements » garde le registre de l’alliance; « prescriptions » distingue חֻקּוֹת de מִצְוֹת dans un français actuel et digne.
- source_word: אֲשֶׁר צִוָּךְ
  choice: qu’il t’avait donnés
  rationale: Dans ce contexte, צוה désigne des ordres donnés. Le plus-que-parfait rend naturellement l’antériorité de ces commandements par rapport au refus d’écouter.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » en conserve la fonction de nom d’alliance sans le remplacer par un titre.
- issue: Sens de שׁמע בקול
  choice: écouté la voix ... en observant
  alternative: obéi à ... en observant
  rationale: Le choix retenu préserve l’image hébraïque de l’écoute tout en rendant sa portée pratique par « en observant ». Il évite de réduire silencieusement l’expression au seul concept abstrait d’obéissance.
- issue: Relation syntaxique de לִשְׁמֹר
  choice: en observant
  alternative: pour observer
  rationale: L’infinitif peut être compris comme précisant le contenu ou la manifestation de l’écoute. « En observant » rend cette relation sans faire de l’observation un simple but qui n’aurait pas été atteint.
translation_notes:
  register: Français international moderne, solennel mais accessible. Tutoiement conservé pour le singulier hébreu adressé à Israël. La répétition progressive « viendront… poursuivront… atteindront » maintient la force rhétorique du texte source.
