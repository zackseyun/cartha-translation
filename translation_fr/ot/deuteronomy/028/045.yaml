    issue: « qu’il t’avait donnés » ne rend pas le verbe צוה.
    rationale: Le texte hébreu dit que Yahweh les a « commandés » à l’interlocuteur. « Donnés » est plus faible et le plus-que-parfait ajoute une antériorité que la forme hébraïque n’impose pas.
