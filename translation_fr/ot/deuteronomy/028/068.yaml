review_pass:
  verdict: revise
  source_fidelity: Le sens causatif de וֶהֱשִׁיבְךָ, le retour en Égypte par navires, la distinction singulier collectif/pluriel et l’absence d’acheteur sont bien rendus. La forme hitpael de וְהִתְמַכַּרְתֶּם appelle toutefois une formulation française plus idiomatique, sans présumer d’une vente effectivement conclue. Le référent du suffixe féminin de לִרְאֹתָהּ demeure discuté entre « le chemin/la route » et l’Égypte ; il convient de le signaler explicitement.
  naturalness: « Vous vous offrirez en vente » est compréhensible mais peu naturel en français actuel. « Vous vous mettrez en vente » est plus idiomatique tout en conservant l’idée d’une mise en vente qui échoue. « Par le chemin dont je t’avais dit » est également elliptique ; « par le chemin au sujet duquel je t’avais dit » est plus correct et fluide.
  terminology: « Yahweh », « Égypte », « navires » et « esclaves, hommes et femmes » sont appropriés au registre et au texte source. La note existante sur le hitpael est utile ; une seconde note est nécessaire pour ne pas présenter comme certaine l’identification du pronom à « chemin ».
  issues:
  - severity: medium
    issue: Référent ambigu de לִרְאֹתָהּ non signalé dans les notes
    rationale: Le texte français « Tu ne le reverras » oriente nécessairement vers « chemin », alors que l’Égypte est aussi un référent contextuellement plausible. La documentation de traduction affirme que cette tension est signalée en note, mais aucune note correspondante n’est fournie.
  - severity: low
    issue: Formulation française peu idiomatique
    rationale: « Vous vous offrirez en vente » est calqué sur une tournure commerciale rare. « Vous vous mettrez en vente » exprime plus naturellement la valeur réfléchie/moyenne du hitpael et s’accorde avec « personne pour vous acheter ».
  - severity: low
    issue: Relative elliptique
    rationale: « Le chemin dont je t’avais dit » est moins naturel que « le chemin au sujet duquel je t’avais dit », qui rend explicitement le lien entre la route et la parole antérieure.
