revisions:
- from: 'Yahweh te ramènera en Égypte sur des navires, par le chemin dont je t’avais dit : « Tu ne le reverras plus jamais. » Là, vous vous offrirez en vente[a] à vos ennemis comme esclaves, hommes et femmes, mais il n’y aura personne pour vous acheter.'
  to: 'Yahweh te ramènera en Égypte sur des navires, par le chemin au sujet duquel je t’avais dit : « Tu ne le reverras plus jamais. »[a] Là, vous vous mettrez en vente[b] à vos ennemis comme esclaves, hommes et femmes, mais il n’y aura personne pour vous acheter.'
  rationale: La révision améliore deux tournures françaises sans modifier le sens et ajoute l’ancrage nécessaire pour l’ambiguïté réelle du suffixe féminin. « Vous vous mettrez en vente » préserve la valeur réflexive ou moyenne du hitpael et évite d’affirmer que la transaction a abouti, ce que dément la clause finale.
