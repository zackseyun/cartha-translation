  text: וֶֽ/הֱשִֽׁיבְ/ךָ֨ יְהוָ֥ה מִצְרַיִם֮ בָּ/אֳנִיּוֹת֒ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אָמַ֣רְתִּֽי לְ/ךָ֔ לֹא תֹסִ֥יף ע֖וֹד לִ/רְאֹתָ֑/הּ וְ/הִתְמַכַּרְתֶּ֨ם שָׁ֧ם לְ/אֹיְבֶ֛י/ךָ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת וְ/אֵ֥ין קֹנֶֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: fr
  text: 'Yahweh te ramènera en Égypte sur des navires, par le chemin au sujet duquel je t’avais dit : « Tu ne le reverras plus jamais. »[a] Là, vous vous mettrez en vente[b] à vos ennemis comme esclaves, hommes et femmes, mais il n’y aura personne pour vous acheter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom hébreu est féminin. Il peut renvoyer à « la route/le chemin » (mot féminin en hébreu) ou, selon le contexte, à l’Égypte.
    reason: Ambiguïté du référent du suffixe dans לִרְאֹתָהּ.
  - marker: b
    text: 'Le verbe hébreu peut aussi être compris plus généralement : « vous serez vendus là à vos ennemis comme esclaves, hommes et femmes ». Sa forme peut exprimer une action réfléchie (« vous vendre vous-mêmes ») ou l’entrée dans l’esclavage.'
    reason: Ambiguïté lexicale et grammaticale du hitpael וְהִתְמַכַּרְתֶּם.
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: te ramènera
  rationale: 'Le hiphil de שוב est causatif : Yahweh fera revenir le peuple. « Te ramènera » exprime naturellement ce sens en français.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin יהוה, qui conserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: מִצְרַיִם
  choice: en Égypte
  rationale: Nom géographique français standard.
- source_word: בָּאֳנִיּוֹת
  choice: sur des navires
  rationale: Le ב instrumental ou locatif indique ici le moyen de transport maritime ; « sur des navires » est naturel et précis.
- source_word: בַּדֶּרֶךְ
  choice: par le chemin
  rationale: דרך désigne la voie ou l’itinéraire emprunté ; cette traduction conserve l’image concrète du texte.
- source_word: אֲשֶׁר אָמַרְתִּי לְךָ
  choice: dont je t’avais dit
  rationale: Le plus-que-parfait rend naturellement en français l’antériorité de la déclaration rappelée par Moïse.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: Tu ne le reverras plus jamais
  rationale: La construction יסף + עוד nie toute répétition. Le pronom « le » reprend ici « le chemin », conformément au lien syntaxique immédiat, sans alourdir la phrase.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: vous vous offrirez en vente
  rationale: Le hitpael possède une valeur réfléchie ou moyenne. Cette formulation préserve cette nuance sans laisser entendre que la vente aboutira, puisque personne ne voudra acheter.
- source_word: לְאֹיְבֶיךָ
  choice: à vos ennemis
  rationale: Le ל indique les acheteurs potentiels auxquels les Israélites chercheront à se vendre.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: comme esclaves, hommes et femmes
  rationale: Cette formulation actuelle conserve à la fois la condition servile et la paire masculine-féminine du texte hébreu, sans l’atténuation que pourrait suggérer « serviteurs ».
- source_word: וְאֵין קֹנֶה
  choice: mais il n’y aura personne pour vous acheter
  rationale: La tournure explicite naturellement l’hébreu littéral « il n’y a pas d’acheteur » et fait ressortir l’échec de la mise en vente.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom personnel et évite de le remplacer par un titre.
- issue: Référent du suffixe dans לִרְאֹתָהּ
  choice: le chemin (« le revoir »)
  alternative: l’Égypte (« la revoir »)
  rationale: Le nom immédiatement antérieur est דרך, qui peut être féminin en hébreu et correspond au suffixe féminin. Toutefois, l’Égypte demeure un référent contextuel possible ; la tension est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passage du singulier collectif (« te », « t’ ») au pluriel (« vous ») reproduit le changement de nombre du texte hébreu. « Navires » garde une tonalité soutenue sans archaïsme ; « esclaves, hommes et femmes » nomme clairement la réalité sociale visée.
