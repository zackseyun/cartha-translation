  text: וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/בְּרָכ֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֻ֑/ךָ כִּ֣י תִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: fr
  text: Toutes ces bénédictions viendront sur toi et te rattraperont, si tu obéis à Yahweh, ton Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si tu écoutes la voix de Yahweh, ton Dieu ». En hébreu, cette expression implique souvent une écoute qui conduit à l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: viendront sur toi
  rationale: Le verbe et la préposition décrivent les bénédictions venant sur la personne à qui Moïse s’adresse. Le futur convient à cette conséquence annoncée dans le cadre conditionnel.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: toutes ces bénédictions
  rationale: Traduction directe du groupe nominal quantifié, dans son contexte d’énumération des bénédictions de l’alliance.
- source_word: וְהִשִּׂיגֻךָ
  choice: et t’atteindront
  rationale: Le hiphil de נשׂג évoque ce qui rattrape quelqu’un et l’atteint. « T’atteindront » conserve l’image tout en étant naturel en français.
- source_word: כִּי
  choice: si
  rationale: Dans ce contexte, la particule introduit la condition liée à l’annonce des bénédictions.
- source_word: תִשְׁמַע בְּקוֹל
  choice: tu obéis à la voix de
  rationale: L’expression hébraïque signifie littéralement écouter la voix, mais implique couramment une écoute qui se traduit par l’obéissance. La formulation française conserve à la fois « la voix » et la portée d’obéissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: 'Le suffixe de deuxième personne masculine singulière exprime directement la relation : « ton Dieu ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin. « Yahweh » le rend explicitement sans lui substituer un titre traditionnel.
- issue: Portée de שׁמע בקול dans le contexte de l’alliance
  choice: si tu obéis à la voix de Yahweh
  alternative: si tu écoutes la voix de Yahweh
  rationale: L’expression peut être rendue littéralement par l’écoute, mais elle désigne ici une écoute suivie d’une réponse obéissante. Le texte principal explicite cette portée, tandis que la note préserve la forme plus littérale.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier respecte l’adresse hébraïque à la deuxième personne du singulier. « Viendront sur toi » et « t’atteindront » conservent l’image concrète de bénédictions qui viennent jusqu’au destinataire.
