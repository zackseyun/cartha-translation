  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : absence de repos parmi les nations, impossibilité de poser le pied, puis les trois effets intérieurs donnés « là » par Yahweh. Toutefois, « des yeux qui s’épuisent » est moins précis pour כִּלְיוֹן עֵינַיִם, qui évoque des yeux défaillants ou dépérissants. « Une âme en souffrance » conserve plus directement la construction nominale et l’amplitude de דַּאֲבוֹן נָפֶשׁ que « une âme accablée ».'
  naturalness: Le français est fluide et de registre solennel moderne. « La plante de ton pied ne trouvera aucun endroit où se poser » est idiomatique, mais « il n’y aura aucun lieu de repos pour la plante de ton pied » reproduit plus exactement la structure et l’image du texte source tout en restant naturel.
  terminology: « Yahweh » correspond au rendu retenu du tétragramme. « Cœur tremblant » est fidèle et naturel. « Yeux défaillants » et « âme en souffrance » rendent les deux derniers syntagmes sans surinterpréter leur cause ou leur nature exacte.
