  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: fr
  text: Parmi ces nations, tu ne connaîtras aucun repos[a], et il n’y aura aucun lieu de repos pour la plante de ton pied. Là, Yahweh te donnera un cœur tremblant, des yeux défaillants[b] et une âme en souffrance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne seras pas tranquille » ou « tu ne trouveras pas de repos ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le dépérissement des yeux » ; ou « des yeux qui dépérissent ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « souffrance de l’âme » ; ou « affliction de l’âme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: tu ne connaîtras aucun repos
  rationale: Le hiphil de רגע exprime ici le fait de parvenir à se poser ou à être tranquille. Cette formulation française rend naturellement l’absence durable de repos dans l’exil.
- source_word: מָנוֹחַ לְכַף רַגְלֶךָ
  choice: la plante de ton pied ne trouvera aucun endroit où se poser
  rationale: מָנוֹחַ peut désigner un lieu de repos, et כַף רגל la plante du pied. La tournure conserve l’image concrète tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin, sans lui substituer un titre.
- source_word: לֵב רַגָּז
  choice: un cœur tremblant
  rationale: רַגָּז évoque le tremblement, l’agitation et l’angoisse intérieure. « Cœur tremblant » préserve l’image physique et affective.
- source_word: כִלְיוֹן עֵינַיִם
  choice: des yeux qui s’épuisent
  rationale: כִלְיוֹן exprime le dépérissement ou l’épuisement. La formulation garde le caractère progressif et imagé de l’hébreu sans imposer une cause précise.
- source_word: דַאֲבוֹן נָפֶשׁ
  choice: une âme accablée
  rationale: L’expression associe la douleur ou l’affliction à נֶפֶשׁ. « Une âme accablée » en restitue l’intensité dans un français naturel et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve comme nom propre plutôt que de le remplacer par un titre.
- issue: Portée de דַאֲבוֹן נָפֶשׁ
  choice: une âme accablée
  alternative: douleur de l’âme ; affliction de l’âme
  rationale: Le texte décrit une souffrance profonde de la personne sans préciser s’il s’agit de chagrin, de douleur ou de désespoir; la traduction maintient cette largeur de sens.
translation_notes:
  register: Français international moderne, au tutoiement singulier comme dans l’hébreu. Le ton demeure solennel sans archaïsmes. Les trois images parallèles — cœur, yeux, âme — sont conservées, avec une légère explicitation idiomatique pour le lieu où le pied peut se poser.
