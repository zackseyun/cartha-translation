source:
  edition: WLC
  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: fr
  text: Yahweh livrera tes ennemis qui se dresseront contre toi, vaincus devant toi[a]. Ils marcheront contre toi par un seul chemin, mais ils fuiront devant toi par sept chemins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh livrera à ta merci tes ennemis qui se dresseront contre toi, vaincus devant toi. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu oppose « un seul chemin » à « sept chemins » : image d’une arrivée groupée et d’une fuite dans des directions dispersées.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: livrera
  rationale: Dans ce contexte militaire, נתן signifie « donner/livrer » au pouvoir de quelqu’un. « Livrera devant toi » exprime naturellement l’issue promise sans ajouter un verbe absent du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Équivalent direct du pluriel muni du suffixe de deuxième personne du masculin singulier.
- source_word: הַקָּמִים עָלֶיךָ
  choice: qui se dresseront contre toi
  rationale: קום avec על décrit une opposition hostile. Le futur français convient à la portée de la promesse, même si l’hébreu emploie un participe.
- source_word: נִגָּפִים
  choice: vaincus
  rationale: Le participe nifal exprime le fait d’être frappé ou défait. La note conserve explicitement cette nuance, tandis que « livrera devant toi » donne un corps de texte français plus naturel.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Rend directement l’idiome hébreu et maintient sa répétition aux deux endroits du verset.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: par un seul chemin
  rationale: Conserve l’image concrète et le contraste numérique de l’hébreu, tout en exprimant l’approche unie des ennemis.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: ils marcheront contre toi
  rationale: Dans un contexte de combat, יצא אל désigne le fait de sortir ou de s’avancer contre quelqu’un. « Marcheront contre toi » est naturel en français et garde la valeur militaire.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: par sept chemins
  rationale: Préserve le parallélisme avec « un seul chemin » et l’image d’une fuite dispersée.
- source_word: יָנוּסוּ
  choice: ils fuiront
  rationale: Équivalent direct exprimant une fuite après la défaite, plus fort que « se retireront ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Relation entre נתן et נִגָּפִים
  choice: 'Corps du texte : « livrera devant toi » ; note : « livrera vaincus devant toi »'
  alternative: « fera que tes ennemis soient battus devant toi »
  rationale: La formulation retenue évite une tournure française lourde tout en maintenant, dans la note, le participe hébreu « vaincus ». Elle ne précise pas davantage que le texte la manière dont Yahweh produit la défaite.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne du masculin singulier adressées à Israël. Le parallélisme « un seul chemin / sept chemins » est conservé, avec une note explicative. Tous les marqueurs de notes figurent dans le texte.
