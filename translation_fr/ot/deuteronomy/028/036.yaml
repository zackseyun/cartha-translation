- from: Yahweh te conduira, toi et le roi que tu établiras sur toi, vers une nation que ni toi ni tes pères n’avez connue ; là, tu serviras d’autres dieux[a], du bois et de la pierre.
  to: Yahweh te conduira, toi et le roi que tu établiras à ta tête, vers une nation que ni toi ni tes pères n’avez connue ; là, tu serviras d’autres dieux[a], de bois et de pierre.
  rationale: Révision limitée de deux formulations françaises afin de préserver la fidélité au sens tout en assurant une syntaxe et une expression idiomatiques. La construction « de bois et de pierre » conserve la fonction caractérisante de l'apposition hébraïque sans ajouter l'expression interprétative « faits de ».
