  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: fr
  text: Yahweh te conduira, toi et le roi que tu établiras à ta tête, vers une nation que ni toi ni tes pères n’avez connue ; là, tu serviras d’autres dieux[a], de bois et de pierre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « là, tu rendras un culte à d’autres dieux » ; le verbe hébreu signifie littéralement « servir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: te conduira
  rationale: Le hifil de הלך exprime ici le fait de faire aller ou d’emmener. « Te conduira » reste naturel en français tout en évitant d’expliciter davantage l’exil que ne le fait le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: le roi que tu établiras sur toi
  rationale: Le hifil de קום désigne ici l’installation d’un roi. La formulation conserve la construction עָלֶיךָ et sa possible nuance critique.
- source_word: גּוֹי
  choice: une nation
  rationale: גוי désigne couramment une nation ou un peuple ; « nation » convient au contexte d’un déplacement vers un pays étranger.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: que ni toi ni tes pères n’avez connue
  rationale: Cette formulation rend l’insistance du pronom אַתָּה et conserve le terme masculin « pères » du texte source.
- source_word: וְעָבַדְתָּ שָׁם
  choice: là, tu serviras
  rationale: עבד signifie littéralement « servir » et, avec des divinités pour objet, peut aussi désigner le culte ; « serviras » préserve cette portée lexicale.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe de la formule d’alliance, sans lui substituer l’interprétation « dieux étrangers ».
- source_word: עֵץ וָאָבֶן
  choice: du bois et de la pierre
  rationale: L’apposition hébraïque caractérise les autres dieux par leur matière. En français, l’article partitif rend naturellement cette apposition méprisante sans ajouter « faits de ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée cultuelle du verbe עבד
  choice: serviras
  alternative: adoreras
  rationale: « Servir » maintient le sens lexical et la tension entre assujettissement et culte, tandis qu’« adorer » expliciterait seulement la dimension religieuse.
- issue: Terme de parenté וַאֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Le masculin du texte est conservé dans cette expression historique et générationnelle, sans neutralisation.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement singulier reproduit l’adresse collective à Israël sous la forme grammaticale du singulier. La syntaxe conserve la solennité et les appositions du texte hébreu sans devenir artificielle.
