review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris le nom Yahweh, la destination étrangère, les « pères » et le verbe « servir ». Toutefois, « établir sur toi » ne constitue pas une formulation française naturelle pour l'installation d'un roi, et « du bois et de la pierre » après « d'autres dieux » est une apposition grammaticalement et sémantiquement malaisée en français.
  naturalness: La formulation révisée emploie « établir à ta tête », idiomatique dans ce contexte politique, et « dieux de bois et de pierre », qui exprime naturellement en français la caractérisation matérielle appositionnelle du texte hébreu.
  terminology: « Yahweh », « pères », « servir » et « d'autres dieux » sont conservés. « De bois et de pierre » rend sans surinterprétation l'apposition עֵץ וָאָבֶן.
  issues:
  - severity: medium
    issue: « le roi que tu établiras sur toi »
    rationale: Bien que proche mot à mot de עָלֶיךָ, « établir sur toi » est peu idiomatique et peut évoquer une action physique plutôt que l'établissement d'une autorité. « Établir à ta tête » rend naturellement le rapport d'autorité.
  - severity: medium
    issue: « d’autres dieux, du bois et de la pierre »
    rationale: Le partitif « du bois et de la pierre » fonctionne difficilement comme apposition à « dieux » et brouille le lien de caractérisation. « D'autres dieux de bois et de pierre » est naturel et conserve l'idée que ces dieux sont caractérisés par ces matériaux.
  revised_text: Yahweh te conduira, toi et le roi que tu établiras à ta tête, vers une nation que ni toi ni tes pères n’avez connue ; là, tu serviras d’autres dieux[a], de bois et de pierre.
  revised_footnotes:
  - marker: a
    text: Ou « là, tu rendras un culte à d’autres dieux » ; le verbe hébreu signifie littéralement « servir ».
    reason: lexical_alternative
  revision_rationale: Révision limitée de deux formulations françaises afin de préserver la fidélité au sens tout en assurant une syntaxe et une expression idiomatiques. La construction « de bois et de pierre » conserve la fonction caractérisante de l'apposition hébraïque sans ajouter l'expression interprétative « faits de ».
