base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: fr
  text: L’homme parmi vous qui est tendre et très délicat regardera d’un mauvais œil[a] son frère, la femme qu’il serre contre lui, et le reste de ses enfants qui lui resteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son œil sera mauvais envers ». Cette expression hébraïque peut évoquer l’hostilité, l’avarice ou le refus jaloux de partager.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: L’homme
  rationale: Le substantif masculin singulier vise ici expressément un homme, en parallèle avec la femme du verset suivant.
- source_word: הָרַךְ בְּךָ וְהֶעָנֹג מְאֹד
  choice: parmi vous qui est tendre et très délicat
  rationale: « Tendre » et « très délicat » conservent le contraste entre une vie raffinée et la conduite impitoyable provoquée par le siège, sans ajouter l’idée plus interprétative d’un homme « choyé ».
- source_word: תֵּרַע עֵינוֹ
  choice: regardera d’un œil mauvais
  rationale: Cette formulation française conserve l’image de l’œil mauvais tout en restant intelligible; dans le contexte, elle exprime une disposition hostile et le refus jaloux de partager.
- source_word: בְאָחִיו
  choice: son frère
  rationale: Le sens ordinaire du terme est « frère »; rien n’impose ici de l’élargir à « parent ».
- source_word: אֵשֶׁת חֵיקוֹ
  choice: la femme qu’il serre contre lui
  rationale: Cette expression restitue naturellement l’image intime de la « femme de son sein » sans employer le mot vieilli « giron ».
- source_word: יֶתֶר בָּנָיו
  choice: ceux de ses enfants
  rationale: Dans ce contexte, בנים peut désigner collectivement les enfants; la tournure s’articule naturellement avec l’idée de ceux qui restent.
- source_word: אֲשֶׁר יוֹתִיר
  choice: qui lui resteront
  rationale: Le verbe signifie laisser subsister ou avoir encore en reste. Le futur français concorde avec le cadre prophétique de la malédiction et évite l’ambiguïté de « qu’il aura laissés ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore hébraïque de l’œil mauvais est maintenue dans le texte et explicitée en note; l’image conjugale est rendue par une expression française naturelle.
