- from: 'Yahweh te comblera de biens[a] : il rendra nombreux les enfants qui naîtront de toi[b] et le petit de tes troupeaux, et abondant le produit de ton sol[c], dans le pays que Yahweh a juré à tes ancêtres de te donner.'
  to: 'Yahweh te comblera pour ton bien : il te donnera une descendance nombreuse, de nombreux petits à tes troupeaux et des récoltes abondantes, dans le pays que Yahweh a juré à tes ancêtres de te donner.'
  rationale: La révision rend la phrase plus idiomatique tout en conservant la triple bénédiction du texte hébreu. « Descendance nombreuse » évite l’ambiguïté de « naîtront de toi »; le pluriel « petits » rend le collectif du bétail; « récoltes abondantes » exprime naturellement le produit du sol. La note sur l’idiome littéral est maintenue.
