  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: fr
  text: 'Yahweh te comblera pour ton bien : il te donnera une descendance nombreuse, de nombreux petits à tes troupeaux et des récoltes abondantes, dans le pays que Yahweh a juré à tes ancêtres de te donner.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹתִרְךָ לְטוֹבָה
  choice: te comblera de biens
  rationale: Le hiphil de יתר exprime ici une abondance causée par Yahweh, tandis que לְטוֹבָה indique que celle-ci est bénéfique. Cette formulation française naturelle conserve à la fois l'idée de profusion et celle de bien.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel exprimé par le tétragramme.
- source_word: בִּפְרִי בִטְנְךָ
  choice: les enfants qui naîtront de toi
  rationale: Littéralement « le fruit de ton ventre ». Le rendu explicite naturellement l'idiome hébreu désignant la descendance, sans suggérer que l'homme auquel le discours s'adresse porte lui-même les enfants.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: le petit de tes troupeaux
  rationale: Rend naturellement la fécondité et l'accroissement des animaux domestiques dans ce contexte agricole.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: le produit de ton sol
  rationale: אַדָמָה désigne ici le sol cultivé, et פְּרִי ce qu'il produit. Le français évite l'étrangeté de « fruit de ton sol » tout en conservant l'image agricole.
- source_word: עַל הָאֲדָמָה
  choice: dans le pays
  rationale: Dans cette proposition, הָאֲדָמָה renvoie au territoire promis où la bénédiction se réalisera ; « dans le pays » est idiomatique en français.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: que Yahweh a juré à tes ancêtres de te donner
  rationale: 'Conserve la syntaxe de l''hébreu : le serment est fait aux ancêtres, et le pays doit être donné au destinataire collectif présent.'
theological_decisions:
- issue: Rendu du nom d'alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin ; sa translittération préserve cette distinction sans le remplacer par un titre.
- issue: Interprétation de בִּפְרִי בִטְנְךָ
  choice: les enfants qui naîtront de toi
  alternative: le fruit de ton ventre
  rationale: L'expression est un idiome désignant les enfants ou la descendance. Le rendu dynamique transmet son sens dans un français courant et digne ; une note conserve l'image littérale.
- issue: Portée de la bénédiction לְטוֹבָה
  choice: abondance concrète et bénéfique
  alternative: prospérité générale
  rationale: Les trois domaines énumérés — descendance humaine, bétail et sol — précisent la forme concrète de cette abondance, sans réduire toute la notion de « bien » à la seule richesse.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reproduit l'adresse hébraïque à Israël comme destinataire collectif. Le parallélisme est rendu par trois compléments coordonnés, avec une légère explicitation pour éviter des calques peu naturels.
