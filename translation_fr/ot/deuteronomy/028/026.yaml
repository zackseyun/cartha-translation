base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: fr
  text: Ton cadavre servira de nourriture à tous les oiseaux du ciel et aux bêtes de la terre[a], et il n’y aura personne pour les faire fuir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « oiseaux du ciel » et « bêtes de la terre » forme un couple ciel-terre qui souligne l’exposition totale et le déshonneur du cadavre.
    reason: cultural_note
  - marker: b
    text: Le texte hébreu ne précise pas explicitement qui est visé par « les » ; le contexte désigne les oiseaux et les bêtes qui se nourrissent du cadavre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: servira
  rationale: Dans cette série de malédictions, la forme verbale exprime une conséquence future. « Servira de nourriture » rend naturellement en français la construction prédicative avec לְמַאֲכָל.
- source_word: נִבְלָתְךָ
  choice: ton cadavre
  rationale: נְבֵלָה désigne ici le corps mort de la personne frappée par le jugement et comporte une nuance dégradante. « Cadavre » conserve cette dureté sans employer « carcasse », généralement réservé aux animaux en français moderne.
- source_word: לְמַאֲכָל
  choice: de nourriture
  rationale: Le nom désigne ce qui sert de nourriture. La tournure « servir de nourriture à » exprime clairement et idiomatiquement le rapport marqué par לְ.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: à tous les oiseaux du ciel
  rationale: עוֹף est collectif dans ce contexte. « Tous les oiseaux du ciel » est une formulation française naturelle qui préserve l’image hébraïque.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: et aux bêtes de la terre
  rationale: בְּהֵמָה désigne collectivement les animaux terrestres. « Bêtes » maintient le ton menaçant, tandis que « de la terre » conserve le parallélisme ciel-terre.
- source_word: וְאֵין מַחֲרִיד
  choice: et il n’y aura personne pour les effrayer et les chasser
  rationale: Le participe hiphil de חרד évoque l’action de faire trembler ou d’effrayer. Dans ce contexte, il s’agit de faire fuir les charognards; la formulation française explicite cette conséquence implicite sans ajouter un nouvel acteur.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier reproduit la deuxième personne masculine singulière de l’hébreu. « Cadavre » garde la violence déshonorante de la malédiction, et la paire « ciel–terre » est conservée.
