  source_fidelity: 'Le sens central est bien rendu : le cadavre devient la nourriture des oiseaux et des bêtes, sans personne pour les éloigner. Toutefois, « les effrayer et les chasser » dédouble en français l’unique participe hiphil מַחֲרִיד (« faire trembler / faire fuir ») et ajoute inutilement deux actions coordonnées. « Les faire fuir » rend directement l’effet contextuel du verbe.'
  naturalness: Le français est clair, moderne et d’un registre solennel approprié. « Ton cadavre », « les oiseaux du ciel » et « les bêtes de la terre » sont naturels dans ce contexte. La formulation révisée évite la coordination redondante « effrayer et chasser ».
  terminology: « Cadavre » conserve la dureté déshonorante de נִבְלָה sans le faux sens animalier courant de « carcasse ». La paire traditionnelle « oiseaux du ciel / bêtes de la terre » respecte l’imagerie et le parallélisme hébreux. Aucun terme théologique problématique n’est en jeu.
