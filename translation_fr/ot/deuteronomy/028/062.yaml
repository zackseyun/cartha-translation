    issue: Ajout de « plus »
    rationale: Le contexte implique bien une réduction après l’abondance, mais le texte hébreu dit littéralement qu’ils « resteront en petit nombre »; « plus » introduit explicitement une valeur temporelle non exprimée.
  - severity: low
    issue: Ponctuation de l’apposition divine
    rationale: Dans « Yahweh, votre Dieu », la virgule rend en français la relation appositionnelle de la formule hébraïque et améliore la lisibilité.
  - severity: low
    issue: Formulation de la note a
    rationale: « En hommes de petit nombre » est peu naturel en français. Une paraphrase littérale signalée comme telle transmet mieux l’idiome sans suggérer un sens masculin exclusif.
