  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: fr
  text: Vous ne resterez qu’en petit nombre[a], alors que vous étiez devenus aussi nombreux que les étoiles du ciel, parce que vous n’avez pas écouté la voix de Yahweh, votre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en hommes peu nombreux », expression hébraïque signifiant « très peu nombreux ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe ici du pluriel au singulier et s’adresse collectivement à Israël. « Écouter la voix » implique aussi l’idée d’obéir.
    reason: source_feature
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: vous ne resterez plus que
  rationale: Le nifal de שׁאר décrit ceux qui subsistent après les pertes annoncées. Cette tournure française exprime naturellement le résultat et prépare l’idée du très petit nombre.
- source_word: בִּמְתֵי מְעָט
  choice: en petit nombre
  rationale: L’expression idiomatique désigne un faible effectif, sans viser spécialement des hommes de sexe masculin.
- source_word: תַּחַת אֲשֶׁר
  choice: alors que
  rationale: Dans ce contexte, la locution marque le contraste entre la multitude antérieure et la réduction à venir, sans imposer une causalité absente.
- source_word: הֱיִיתֶם
  choice: vous étiez devenus
  rationale: Le plus-que-parfait rend l’état atteint par la multiplication d’Israël avant le jugement annoncé.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: aussi nombreux que les étoiles du ciel
  rationale: Cette formulation idiomatique conserve l’image de l’alliance et explicite la valeur quantitative de לָרֹב.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: parce que vous n’avez pas écouté la voix de
  rationale: La traduction garde l’image hébraïque de l’écoute, tout en laissant entendre son implication d’obéissance dans le langage de l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֶיךָ
  choice: votre Dieu
  rationale: Traduction naturelle de la formule d’alliance associée au nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom personnel dans la formule d’alliance.
- issue: Valeur de שׁמע בקול
  choice: écouté la voix de
  alternative: obéi à
  rationale: L’expression implique l’obéissance, mais la formulation retenue préserve l’image lexicale et la tension du langage d’alliance.
- issue: Passage du pluriel au singulier collectif dans לֹא שָׁמַעְתָּ et אֱלֹהֶיךָ
  choice: maintenir en français le « vous », compatible avec les deux nombres
  alternative: expliciter « toi, Israël »
  rationale: Le français ne distingue pas ici le pluriel du singulier de politesse; aucune explicitation interprétative n’est donc nécessaire, mais une note signale le changement hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Alors que » marque clairement le contraste; « les étoiles du ciel » est naturel en français tout en conservant l’écho de la promesse faite aux ancêtres.
