revisions:
- from: Vous ne resterez plus qu’en petit nombre[a], alors que vous étiez devenus aussi nombreux que les étoiles du ciel, parce que vous n’avez pas écouté la voix de Yahweh votre Dieu[b].
  to: Vous ne resterez qu’en petit nombre[a], alors que vous étiez devenus aussi nombreux que les étoiles du ciel, parce que vous n’avez pas écouté la voix de Yahweh, votre Dieu[b].
  rationale: La révision retire l’ajout temporel « plus », ajuste la ponctuation de la formule « Yahweh, votre Dieu » et reformule la note lexicale pour un français plus naturel. Elle conserve le contraste historique, l’image des étoiles, la terminologie d’alliance et l’ambiguïté du singulier collectif.
