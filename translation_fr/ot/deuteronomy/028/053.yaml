- from: Tu mangeras le fruit de tes entrailles[a], la chair de tes fils et de tes filles que Yahweh ton Dieu t’a donnés, au cours du siège et dans la détresse[b] où ton ennemi te tiendra.
  to: Tu mangeras le fruit de tes entrailles[a], la chair de tes fils et de tes filles que Yahweh ton Dieu t’a donnés, au cours du siège et de la détresse[b] que ton ennemi t’infligera.
  rationale: Une correction ciblée remplace la dernière relative afin de restituer la contrainte exercée par l’ennemi, exprimée par le hiphil de צוּק. Le reste du texte, y compris les ancres et les notes, est conservé.
