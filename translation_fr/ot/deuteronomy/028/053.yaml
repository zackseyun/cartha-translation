  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: fr
  text: Tu mangeras le fruit de tes entrailles[a], la chair de tes fils et de tes filles que Yahweh ton Dieu t’a donnés, au cours du siège et de la détresse[b] que ton ennemi t’infligera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les enfants issus de ton corps ». Littéralement : « le fruit de ton ventre ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’angoisse » ou « dans une situation critique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Tu mangeras
  rationale: Le qatal précédé de la conjonction a ici, dans la série des malédictions, une valeur prédictive. Le futur français exprime naturellement cette annonce solennelle.
- source_word: פְרִי בִטְנְךָ
  choice: le fruit de tes entrailles
  rationale: Cette formulation conserve l’image hébraïque désignant la descendance, tout en restant idiomatique et digne en français.
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: la chair de tes fils et de tes filles
  rationale: « Chair » rend sans l’atténuer l’horreur du contexte, et « fils et filles » maintient la désignation explicite des deux sexes.
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: que Yahweh ton Dieu t’a donnés
  rationale: La proposition relative est conservée, ainsi que l’idée poignante que ces enfants étaient un don de Dieu.
- source_word: בְּמָצוֹר
  choice: au cours du siège
  rationale: Cette tournure française exprime clairement les circonstances du siège sans modifier le sens de la préposition hébraïque.
- source_word: וּבְמָצוֹק
  choice: et dans la détresse
  rationale: Le nom évoque une situation d’extrême contrainte ou d’angoisse. « Détresse » en garde à la fois la gravité concrète et la portée humaine.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: où ton ennemi te tiendra
  rationale: Le hiphil de צוּק exprime l’action de serrer, contraindre ou accabler. Cette formulation naturelle présente l’ennemi comme maintenant la personne dans cette situation extrême sans surdéterminer le type de pression.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, solennel et direct. Le tutoiement singulier reflète les formes hébraïques de deuxième personne du masculin singulier. La violence du verset n’est ni amplifiée ni atténuée; l’image de la descendance et la mention distincte des fils et des filles sont maintenues.
