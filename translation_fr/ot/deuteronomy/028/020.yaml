  source_fidelity: 'La structure principale est fidèle, y compris l’agent divin explicite et les trois sanctions. Toutefois, « parce que tu m’as abandonné » transforme la relative אשר עזבתני en proposition causale autonome. Le relatif se rattache plus directement aux « actes/agissements » : « par lesquels tu m’as abandonné ». « Tu périsses » rend aussi אבד plus précisément que « tu disparaisses ».'
  naturalness: Le français est globalement naturel et d’un registre solennel accessible. « Dans tout ce que tu entreprendras » est une bonne restitution idiomatique, avec une note utile pour l’image de la main.
  terminology: « Yahweh », « malédiction » et « réprimande » conviennent. « Confusion » est plus proche du champ sémantique immédiat de מהומה que « désarroi » tout en restant idiomatique dans l’énumération.
