source:
  edition: WLC
  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: fr
  text: Yahweh enverra contre toi la malédiction, la confusion et la réprimande dans tout ce que tu entreprendras[a], jusqu’à ce que tu sois détruit et que tu périsses rapidement, à cause de la méchanceté de tes agissements, par lesquels tu m’as abandonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans toute entreprise de ta main que tu feras », c’est-à-dire dans tout ce à quoi tu mettras la main.'
    reason: La note préserve l’image idiomatique de מִשְׁלַח יָדְךָ, tandis que le texte principal emploie une formulation française naturelle.
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: enverra
  rationale: Le piel imperfectif présente Yahweh comme l’agent qui fait venir activement les sanctions de l’alliance. « Enverra » est direct et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּךָ
  choice: contre toi
  rationale: Avec les sanctions envoyées par Yahweh, la préposition désigne leur cible. « Contre toi » exprime clairement leur caractère hostile en français.
- source_word: הַמְּאֵרָה
  choice: la malédiction
  rationale: Le nom désigne ici la malédiction comme sanction concrète de l’alliance.
- source_word: הַמְּהוּמָה
  choice: le désarroi
  rationale: Le terme peut évoquer confusion, tumulte ou panique. « Désarroi » garde cette portée assez large tout en convenant à l’échec des entreprises.
- source_word: הַמִּגְעֶרֶת
  choice: la réprimande
  rationale: Issu de גער, le nom évoque une réprobation énergique, ici divine. « Réprimande » en conserve le caractère personnel et judiciaire.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: dans tout ce que tu entreprendras
  rationale: L’expression idiomatique signifie tout ce à quoi quelqu’un met la main. La traduction naturelle est accompagnée d’une note qui préserve l’image hébraïque.
- source_word: עַד הִשָּׁמֶדְךָ
  choice: jusqu’à ce que tu sois détruit
  rationale: L’infinitif construit avec suffixe marque l’aboutissement des sanctions; la tournure verbale française en restitue clairement le sens.
- source_word: וְעַד אֲבָדְךָ מַהֵר
  choice: et que tu disparaisses rapidement
  rationale: « Disparaisses » distingue אבד du verbe précédent tout en conservant l’idée de perte et d’anéantissement; « rapidement » rend מַהֵר sans préciser indûment s’il signifie vite ou bientôt.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ
  choice: à cause de la méchanceté de tes actes
  rationale: מִפְּנֵי a ici une valeur causale, et מַעֲלָלִים désigne les actes ou agissements, qualifiés de mauvais.
- source_word: אֲשֶׁר עֲזַבְתָּנִי
  choice: parce que tu m’as abandonné
  rationale: La proposition relative hébraïque peut exprimer le lien entre les actes mauvais et l’abandon de Yahweh. « Parce que » rend ce lien intelligiblement sans effacer la responsabilité personnelle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; employer « Yahweh » préserve le nom personnel de l’Alliance.
- issue: Agent des sanctions de l’alliance
  choice: Yahweh enverra directement les sanctions
  alternative: Les malheurs surviendront de manière impersonnelle
  rationale: Yahweh est le sujet explicite de יְשַׁלַּח; la traduction ne doit pas atténuer cette action divine.
- issue: Rapport syntaxique de אֲשֶׁר עֲזַבְתָּנִי
  choice: cause explicitée par « parce que tu m’as abandonné »
  alternative: 'relative descriptive : « par lesquels tu m’as abandonné »'
  rationale: אֲשֶׁר peut rattacher l’abandon aux actes précédents de plusieurs manières. La formulation causale est naturelle dans le contexte, tandis que l’autre analyse est signalée comme possibilité en note.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le tutoiement singulier suit les formes hébraïques de deuxième personne masculine singulière. Le parallélisme « détruit… disparaisses » est maintenu sans fusionner les deux verbes. La formulation évite un vocabulaire confessionnel propre à une tradition.
