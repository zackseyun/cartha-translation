source:
  edition: WLC
  text: אִשָּׁ֣ה תְאָרֵ֗שׂ וְ/אִ֤ישׁ אַחֵר֙ ישגל/נה בַּ֥יִת תִּבְנֶ֖ה וְ/לֹא תֵשֵׁ֣ב בּ֑/וֹ כֶּ֥רֶם תִּטַּ֖ע וְ/לֹ֥א תְחַלְּלֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: fr
  text: Tu te fianceras à une femme, mais un autre homme aura des rapports avec elle[a] ; tu bâtiras une maison, mais tu n’y habiteras pas ; tu planteras une vigne, mais tu ne commenceras pas à en consommer les fruits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un terme cru pour désigner l’acte sexuel. Dans ce contexte de dépossession, certaines traductions disent « la violera » ou « la prendra de force », mais le verbe lui-même ne précise pas explicitement si la contrainte est exercée sur la femme.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu ne la rendras pas profane, ou commune ». Il s’agit d’une expression désignant le moment où l’on commence à faire un usage ordinaire des fruits d’une vigne, notamment en les consommant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: tu te fianceras à une femme
  rationale: Le verbe ארשׂ désigne l’entrée dans les fiançailles, engagement matrimonial juridiquement plus fort que les fiançailles modernes dans de nombreux contextes. Cette formulation reste naturelle en français et évite de traduire trop largement par « épouser ».
- source_word: אִישׁ אַחֵר
  choice: un autre homme
  rationale: Traduction directe qui maintient le contraste avec le destinataire.
- source_word: ישגלנה
  choice: aura des rapports avec elle
  rationale: Le ketiv emploie un terme sexuel cru. La formulation française indique clairement l’acte sexuel sans ajouter explicitement une contrainte que cette forme verbale ne précise pas à elle seule; une note signale la rudesse de l’hébreu et l’ambiguïté quant à la violence.
- source_word: תֵשֵׁב בּוֹ
  choice: tu n’y habiteras pas
  rationale: Avec une maison, ישב signifie naturellement y demeurer ou y habiter.
- source_word: כֶּרֶם
  choice: une vigne
  rationale: En français courant, « une vigne » désigne ici un terrain planté de ceps; « vignoble » serait également possible, mais peut évoquer une exploitation plus étendue.
- source_word: תְחַלְּלֶּנּוּ
  choice: tu ne commenceras pas à en consommer les fruits
  rationale: 'Le piel de חלל appliqué à une vigne est un emploi technique: rendre sa production commune, donc commencer à en faire l’usage ordinaire après la période où ses fruits ne pouvaient pas être consommés. La formulation explicite l’idiome sans le réduire à la seule vendange.'
theological_decisions:
- issue: Nature de l’acte exprimé par ישגלנה
  choice: Ne pas préciser grammaticalement que l’acte est forcé, tout en conservant sa gravité et en signalant la crudité du terme dans une note.
  alternative: « la violera » ou « la prendra de force »
  rationale: Le contexte décrit une malédiction violente et une dépossession, mais le verbe employé désigne crûment l’acte sexuel sans encoder à lui seul la contrainte. Une traduction explicitant le viol trancherait une question que la forme lexicale laisse ouverte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque. Le parallélisme en trois propositions est conservé, de même que la progression fiançailles–maison–vigne. « Avoir des rapports avec » est explicite sans être argotique; la note rend compte de la rudesse inhabituelle du terme hébreu.
