reference: Deuteronomy 28:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּר֥וּךְ אַתָּ֖ה בָּ/עִ֑יר וּ/בָר֥וּךְ אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: fr
  text: Tu seras béni dans la ville[a], et tu seras béni dans les champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu es béni dans la ville, et tu es béni dans les champs. »'
    reason: L’hébreu est une proposition sans verbe exprimé; elle peut être comprise comme une déclaration au présent ou, dans ce contexte, comme une promesse.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: béni
  rationale: Participe passif de ברך employé dans un contexte de bénédiction d’alliance. « Béni » conserve la portée déclarative et théologique du terme, sans la réduire à l’idée d’être simplement heureux ou favorisé.
- source_word: אַתָּה
  choice: tu
  rationale: Pronom masculin singulier qui s’adresse à Israël comme interlocuteur collectif de l’alliance. Le tutoiement singulier reproduit directement cette adresse en français.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: La préposition ב indique ici le lieu. « Dans la ville » rend naturellement le domaine urbain mis en parallèle avec les champs.
- source_word: וּבָרוּךְ
  choice: et tu seras béni
  rationale: La conjonction et la répétition du prédicat sont maintenues afin de préserver le parallélisme délibéré de l’hébreu.
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: שׂדה désigne le champ, la campagne ou les terres cultivées. Le pluriel idiomatique français « dans les champs » exprime naturellement la sphère rurale et agricole opposée à la ville.
theological_decisions:
- issue: Valeur temporelle de la formule nominale de bénédiction
  choice: Tu seras béni… et tu seras béni…
  alternative: Tu es béni… et tu es béni…
  rationale: L’hébreu ne comporte pas de verbe exprimé et permet formellement une lecture présente. Dans la série des bénédictions annoncées en Deutéronome 28, le futur français rend toutefois mieux la force de promesse, sans effacer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. La répétition hébraïque est conservée. « Dans les champs », plus idiomatique en français que le singulier littéral, maintient le contraste entre la vie urbaine et la sphère rurale ou agricole.
