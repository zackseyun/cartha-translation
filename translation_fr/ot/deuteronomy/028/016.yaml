  text: אָר֥וּר אַתָּ֖ה בָּ/עִ֑יר וְ/אָר֥וּר אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: fr
  text: Tu es maudit dans la ville[a], et tu es maudit dans les champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu es sous le coup d’une malédiction. »'
    reason: Alternative lexicale explicitant l’état exprimé par le participe hébreu.
lexical_decisions:
- source_word: אָרוּר
  choice: maudit
  rationale: Le participe passif est employé comme prédicat dans une formule de sanction d’alliance. « Maudit » exprime directement l’état déclaré, sans le transformer en prédiction ni en souhait.
- source_word: אַתָּה
  choice: sois-tu
  rationale: Le pronom masculin singulier est explicite et emphatique. La tournure française « Maudit sois-tu » conserve l’ordre prédicat-pronom et la solennité déclarative de la formule, même si la forme coïncide extérieurement avec un subjonctif.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: La préposition indique le lieu; « dans la ville » rend naturellement le cadre urbain opposé aux champs.
- source_word: וְ
  choice: et
  rationale: La conjonction relie les deux propositions parallèles et en conserve l’effet cumulatif.
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: שָׂדֶה désigne ici l’espace agricole ou rural. Le pluriel idiomatique français « dans les champs » forme un pendant naturel à « dans la ville » tout en gardant l’image concrète.
theological_decisions:
- issue: Formule de malédiction de l’alliance et valeur de l’énoncé
  choice: Conserver dans les deux membres la déclaration directe « Maudit sois-tu… »
  alternative: « Tu seras maudit… » ou « Puisses-tu être maudit… »
  rationale: L’hébreu présente une construction prédicative sans verbe, avec répétition du participe et du pronom; il ne formule explicitement ni une prédiction au futur ni un souhait optatif. La traduction retenue préserve la force juridique et solennelle de la sanction.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme est maintenu. « Maudit sois-tu » est une formule solennelle courante; elle doit être comprise ici comme une déclaration de sanction, non comme l’ajout d’un souhait absent de l’hébreu.
