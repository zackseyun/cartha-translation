  naturalness: « Maudit sois-tu » sonne solennel, mais sa forme impérative/subjonctive se comprend naturellement comme un souhait ou une imprécation (« puisses-tu être maudit »). Cela introduit une nuance absente de la construction déclarative hébraïque. « Tu es maudit » est moderne, clair et déclaratif.
