  text: וְ/הָי֣וּ חַיֶּ֔י/ךָ תְּלֻאִ֥ים לְ/ךָ֖ מִ/נֶּ֑גֶד וּ/פָֽחַדְתָּ֙ לַ֣יְלָה וְ/יוֹמָ֔ם וְ/לֹ֥א תַאֲמִ֖ין בְּ/חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: fr
  text: Ta vie sera suspendue devant toi[a] ; tu auras peur nuit et jour, et tu ne seras pas sûr de rester en vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ta vie sera suspendue devant toi » ; l’hébreu présente l’image d’une vie suspendue de manière précaire, dans une incertitude continuelle quant à la survie.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « tu ne croiras pas en ta vie » ou « tu n’auras pas confiance en ta vie » ; c’est-à-dire que tu ne seras pas certain de survivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: ta vie
  rationale: Le pluriel morphologique hébreu désigne ici idiomatiquement la vie ou la survie de la personne ; le singulier est naturel en français.
- source_word: תְּלֻאִים
  choice: ne tiendra qu’à un fil
  rationale: Le participe vient de תלה, « suspendre ». Cette expression française conserve l’image d’une vie suspendue de façon précaire tout en exprimant clairement le danger constant.
- source_word: לְךָ מִנֶּגֶד
  choice: devant toi
  rationale: Traduction directe de l’expression spatiale, qui présente la menace pesant sur la vie comme constamment placée sous les yeux de la personne.
- source_word: וּפָחַדְתָּ
  choice: tu trembleras de peur
  rationale: Le verbe exprime la peur ou l’effroi. Cette formulation française naturelle rend ici une crainte intense sans aller jusqu’à une surtraduction comme « tu seras terrorisé ».
- source_word: לַיְלָה וְיוֹמָם
  choice: nuit et jour
  rationale: L’ordre hébreu est conservé ; l’expression indique une peur continuelle.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: tu ne seras jamais sûr de rester en vie
  rationale: Dans ce contexte, אמן avec ב ne concerne pas la foi théologique, mais l’absence de certitude quant à sa propre survie. « Jamais » explicite la persistance impliquée par la situation décrite, tandis que « rester en vie » clarifie l’enjeu.
theological_decisions:
- issue: Sens de אמן appliqué à la vie
  choice: absence de certitude quant à la survie
  alternative: ne pas avoir confiance en sa vie
  rationale: Le contexte des malédictions et de la vie suspendue indique une insécurité existentielle, sans introduire une notion doctrinale de foi.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. L’image de la suspension est rendue par l’expression courante « ne tenir qu’à un fil », et les notes préservent la formulation plus littérale ainsi que l’ambiguïté lexicale de אמן.
