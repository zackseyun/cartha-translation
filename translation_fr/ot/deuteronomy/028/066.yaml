review_pass:
  verdict: revise
  source_fidelity: La première proposition du projet rend bien l’image de la vie suspendue et l’insécurité qui en découle. Toutefois, « jamais » ajoute une absolutisation temporelle qui n’est pas explicitement formulée par l’hébreu. « Trembleras de peur » est une intensification possible, mais « auras peur » rend plus directement פחד sans renforcer inutilement le degré de peur.
  naturalness: « Ta vie ne tiendra qu’à un fil devant toi » mélange une expression idiomatique française avec le complément spatial « devant toi » de façon un peu heurtée. « Ta vie sera suspendue devant toi » est plus proche de l’image hébraïque et reste compréhensible grâce à la note. « Tu auras peur nuit et jour » est naturel dans un français international moderne.
  terminology: « Vie », « suspendue », « peur » et « rester en vie » rendent convenablement les termes et le contexte. La note sur la dernière proposition doit éviter de présenter comme strictement littérale une formulation française qui interprète la construction hébraïque ; elle peut indiquer le sens littéral de façon plus exacte (« tu ne croiras/ne feras pas confiance en ta vie ») puis expliciter le sens contextuel.
  issues:
  - severity: medium
    issue: Ajout de « jamais » dans la dernière proposition.
    rationale: לֹא תַאֲמִין exprime l’absence d’assurance, mais ne comporte pas d’adverbe équivalant à « jamais ». Le contexte suggère une peur continuelle, sans exiger cette explicitation absolue.
  - severity: low
    issue: Expression « ne tiendra qu’à un fil devant toi » stylistiquement hybride.
    rationale: L’idiome « ne tenir qu’à un fil » rend bien la précarité, mais son association avec « devant toi » est moins fluide et atténue l’image spatiale de la vie suspendue devant la personne.
  - severity: low
    issue: « Trembleras de peur » renforce légèrement le verbe פחד.
    rationale: Le verbe signifie d’abord « craindre/avoir peur ». Une traduction plus directe préserve mieux le degré non spécifié de l’original.
  revised_text: Ta vie sera suspendue devant toi[a] ; tu auras peur nuit et jour, et tu ne seras pas sûr de rester en vie[b].
