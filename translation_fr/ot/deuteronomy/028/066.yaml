  - marker: b
    text: Littéralement, « tu ne croiras pas en ta vie » ou « tu n’auras pas confiance en ta vie » ; c’est-à-dire que tu ne seras pas certain de survivre.
    reason: lexical_alternative
  revision_rationale: La révision conserve l’image hébraïque de la vie suspendue ainsi que l’incertitude de survivre, tout en supprimant l’ajout temporel « jamais ». Elle emploie des formulations plus directes et naturelles sans imposer une interprétation doctrinale de אמן. Les deux appels de note restent attachés aux expressions qu’ils expliquent.
