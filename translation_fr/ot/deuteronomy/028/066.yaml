revisions:
- from: Ta vie ne tiendra qu’à un fil devant toi[a] ; tu trembleras de peur nuit et jour, et tu ne seras jamais sûr de rester en vie[b].
  to: Ta vie sera suspendue devant toi[a] ; tu auras peur nuit et jour, et tu ne seras pas sûr de rester en vie[b].
  rationale: La révision conserve l’image hébraïque de la vie suspendue ainsi que l’incertitude de survivre, tout en supprimant l’ajout temporel « jamais ». Elle emploie des formulations plus directes et naturelles sans imposer une interprétation doctrinale de אמן. Les deux appels de note restent attachés aux expressions qu’ils expliquent.
