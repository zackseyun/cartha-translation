review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : le refus de partager, la « chair de ses fils », le dénuement total, le siège et la détresse sont conservés. Toutefois, « où ton ennemi te réduira » ne rend pas de façon suffisamment précise la relative hébraïque : celle-ci porte sur le siège et la détresse que l’ennemi infligera, et non sur un lieu où il « réduira » le destinataire.'
  naturalness: Le français est globalement sobre et naturel, mais « te réduira dans toutes tes villes » est elliptique et peu idiomatique. « Que ton ennemi t’infligera dans toutes tes villes » est plus clair et correspond mieux à la syntaxe et au sens.
  terminology: « Chair », « fils », « siège » et « détresse » conviennent au registre et au lexique du passage. « Villes » est une explicitation recevable de « portes » dans ce contexte, à condition de maintenir la note culturelle.
  issues:
  - severity: medium
    issue: La proposition « où ton ennemi te réduira dans toutes tes villes » est ambiguë et s’écarte de la relation syntaxique du texte source.
    rationale: 'אֲשֶׁר יָצִיק ... se rapporte au « siège et [à] la détresse » : ce sont les maux que l’ennemi imposera. Le verbe « réduire », sans complément explicite (« à la détresse »), ne transmet pas clairement cette idée et « où » transforme indûment l’antécédent en lieu.'
  revised_text: sans donner à aucun d’eux de la chair de ses fils qu’il mangera, parce qu’il ne lui restera rien, pendant le siège et dans la détresse que ton ennemi t’infligera dans toutes tes villes.[a]
  revised_footnotes:
