  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: fr
  text: sans donner à aucun d’eux de la chair de ses fils qu’il mangera, parce qu’il ne lui restera rien, pendant le siège et dans la détresse que ton ennemi t’infligera dans toutes tes villes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans toutes tes portes » ; les portes représentent ici les villes.'
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: sans donner à aucun d’eux
  rationale: La préposition מִן avec l’infinitif construit exprime ici la retenue ou le refus de donner; « sans donner » maintient le lien syntaxique avec le verset précédent, tandis que « aucun d’eux » rend naturellement la valeur distributive de לְאַחַד מֵהֶם.
- source_word: מִבְּשַׂר בָּנָיו
  choice: de la chair de ses fils
  rationale: « Chair » conserve le caractère concret et terrible de בָּשָׂר; בָּנָיו désigne spécifiquement ses fils plutôt que ses enfants en général.
- source_word: אֲשֶׁר יֹאכֵל
  choice: qu’il mangera
  rationale: L’imparfait s’inscrit dans le scénario futur des malédictions. Le futur français rend cette perspective sans exclure la valeur durative de l’action pendant le siège.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: parce qu’il ne lui restera rien
  rationale: La tournure rend la force explicative du syntagme et la privation totale, tout en conservant la perspective future du contexte.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: pendant le siège et dans la détresse
  rationale: מָצוֹר désigne le siège et מָצוֹק l’état de détresse ou d’extrême contrainte. La légère variation des prépositions produit un français naturel.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: où ton ennemi te réduira
  rationale: Le hiphil de צוּק évoque l’action de mettre quelqu’un à l’étroit ou dans la détresse. « Réduire à la détresse » exprime cette causalité hostile sans ajouter une nuance doctrinale.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: dans toutes tes villes
  rationale: Littéralement « dans toutes tes portes »; dans ce contexte, les portes désignent par métonymie les villes ou localités fortifiées. Le corps du texte donne le sens naturel en français et la note préserve l’image hébraïque.
