revisions:
- from: sans donner à aucun d’eux de la chair de ses fils qu’il mangera, parce qu’il ne lui restera rien, pendant le siège et dans la détresse où ton ennemi te réduira dans toutes tes villes.[a]
  to: sans donner à aucun d’eux de la chair de ses fils qu’il mangera, parce qu’il ne lui restera rien, pendant le siège et dans la détresse que ton ennemi t’infligera dans toutes tes villes.[a]
  rationale: La révision remplace une formulation française ambiguë par une relative qui exprime explicitement que l’ennemi inflige le siège et la détresse. Elle conserve la dépendance syntaxique avec le verset précédent, le futur du scénario de malédiction, les termes concrets « chair » et « fils », ainsi que l’explicitation contextualisée de « portes » par « villes ».
