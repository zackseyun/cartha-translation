    issue: La relation entre « sous tes yeux » et « tes yeux s’épuiseront à les attendre » est légèrement déplacée.
    rationale: Le texte hébreu décrit les yeux qui voient, puis qui dépérissent continuellement en raison de leur orientation vers les enfants. La révision maintient plus visiblement cette image, sans déterminer indûment si les enfants sont encore en vue ou attendus de retour.
