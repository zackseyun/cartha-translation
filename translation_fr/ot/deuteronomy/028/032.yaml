  source_fidelity: La traduction rend correctement la remise des enfants à « un autre peuple » et l’impuissance finale. Toutefois, « sous tes yeux » lie plus étroitement la vision à l’acte de les livrer, tandis que l’hébreu enchaîne explicitement la vue des enfants et l’épuisement des yeux tournés vers eux. Une formulation qui conserve l’image des yeux et l’attente ardente est préférable.
  naturalness: Le français est globalement moderne et digne. « Tes yeux s’épuiseront à les attendre » est compréhensible, mais la phrase gagne en fluidité lorsque l’observation et l’attente sont reliées dans une même proposition.
  terminology: « Livrés à un autre peuple » est juste dans ce contexte. « Sans que tu aies le pouvoir d’agir » rend naturellement l’idiome hébreu d’absence de pouvoir dans la main, sans introduire de référence théologique indue.
  issues:
