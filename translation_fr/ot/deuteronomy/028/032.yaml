base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: fr
  text: Tes fils et tes filles seront livrés à un autre peuple ; tu les verras, et tes yeux s’épuiseront à les attendre tout le jour, sans que tu aies le pouvoir d’agir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’y aura pas de puissance dans ta main ». Cette expression hébraïque signifie que tu seras incapable d’intervenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: Tes fils et tes filles
  rationale: L’hébreu nomme explicitement les enfants des deux sexes; la formulation française conserve cette précision et l’adresse au singulier.
- source_word: נְתֻנִים לְעַם אַחֵר
  choice: seront livrés à un autre peuple
  rationale: Le participe passif prend ici une valeur future dans la série des malédictions. « Livrés » exprime plus naturellement que « donnés » le transfert forcé impliqué par le contexte, tandis que « un autre peuple » reste proche de עַם אַחֵר.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: sous tes yeux
  rationale: Cette tournure française rend de façon concise et vive le fait que le parent assiste impuissant à l’événement.
- source_word: וְכָלוֹת אֲלֵיהֶם כָּל הַיּוֹם
  choice: Tout le jour, tes yeux s’épuiseront à les attendre
  rationale: כלה décrit les yeux qui se consument ou s’épuisent en se tournant vers les enfants. « À les attendre » exprime l’attente ardente suggérée par אֲלֵיהֶם sans réduire l’image à une simple fatigue visuelle.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: mais tu n’auras aucun pouvoir pour agir
  rationale: L’expression idiomatique signifie que la personne n’aura ni capacité ni moyen d’intervention. Cette formulation naturelle évite de faire entendre à tort une référence à Dieu, tout en explicitant l’impuissance concrète de la main.
theological_decisions:
- issue: Sens de וְאֵין לְאֵל יָדֶךָ
  choice: mais tu n’auras aucun pouvoir pour agir
  alternative: et il n’y aura aucune force dans ta main
  rationale: אֵל a ici le sens de puissance ou capacité dans une expression idiomatique, non celui de divinité. La traduction retenue communique l’incapacité d’intervenir sans introduire une affirmation théologique étrangère au contexte.
- issue: Nature de l’épuisement des yeux dans וְכָלוֹת אֲלֵיהֶם
  choice: tes yeux s’épuiseront à les attendre
  alternative: tes yeux se consumeront en regardant vers eux
  rationale: Le texte associe l’épuisement des yeux à leur orientation persistante vers les enfants. La traduction conserve l’image et sa charge affective sans préciser indûment si les enfants restent visibles ou si le parent espère leur retour.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne. Le rythme en deux phrases garde la progression de la perte constatée vers l’attente épuisante, puis l’impuissance.
