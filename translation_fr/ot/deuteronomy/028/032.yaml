  to: Tes fils et tes filles seront livrés à un autre peuple ; tu les verras, et tes yeux s’épuiseront à les attendre tout le jour, sans que tu aies le pouvoir d’agir.[a]
  rationale: La révision rétablit explicitement « tu les verras », correspondant à la clause sur les yeux qui voient, tout en conservant l’image de l’attente épuisante et la durée de « tout le jour ». La dernière clause est intégrée à la même phrase afin de refléter l’enchaînement hébreu et de rendre l’impuissance comme son aboutissement.
