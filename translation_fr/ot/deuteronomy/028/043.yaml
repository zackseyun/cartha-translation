  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: fr
  text: L’étranger qui est au milieu de toi s’élèvera toujours plus haut au-dessus de toi[a], et toi, tu descendras toujours plus bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étranger résident » ou « l’étranger établi ». Le mot hébreu גֵּר désigne un non-Israélite qui réside au sein de la communauté d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: L’étranger
  rationale: גֵּר désigne ici une personne non originaire d’Israël qui réside durablement au sein de la communauté. « L’étranger » est clair et naturel en français moderne; la note précise le statut résidentiel que le mot peut exprimer.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: qui vit au milieu de toi
  rationale: La formulation rend à la fois la présence interne à la communauté et le caractère résidentiel impliqué par גֵּר, dans un français courant.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: s’élèvera … au-dessus de toi
  rationale: L’image hébraïque d’une ascension relative est conservée sans la réduire à une dimension uniquement économique ou politique.
- source_word: מַעְלָה מָּעְלָה
  choice: de plus en plus
  rationale: Cette tournure française idiomatique exprime la progression intensifiée par la répétition hébraïque; « au-dessus de toi » fournit explicitement l’orientation ascendante.
- source_word: וְאַתָּה
  choice: tandis que toi
  rationale: Le waw coordonne deux évolutions opposées. « Tandis que » rend naturellement le contraste contextuel, et le pronom tonique préserve l’emphase portée par אַתָּה.
- source_word: תֵרֵד מַטָּה מָּטָּה
  choice: tu descendras de plus en plus bas
  rationale: La traduction conserve l’image opposée de la descente et rend la répétition intensive par une expression française naturelle.
theological_decisions:
- issue: Renversement de statut dans le cadre des malédictions de l’alliance
  choice: Conserver l’image générale de l’étranger résident qui s’élève au-dessus d’Israël tandis qu’Israël décline.
  alternative: Limiter le sens à un enrichissement économique ou à une domination politique.
  rationale: Les verbes hébreux d’ascension et de descente décrivent un renversement de situation sans en préciser l’unique domaine. La traduction préserve donc cette portée générale et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme une entité collective. Le parallélisme ascendant-descendant et l’intensification progressive sont préservés.
