  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: fr
  text: Yahweh te frappera de folie, d’aveuglement et de confusion du cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « désarroi du cœur » ou « stupeur du cœur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: te frappera
  rationale: Le hiphil de נכה exprime ici le fait de frapper ou d’infliger un mal dans le cadre des malédictions de l’alliance. « Te frappera » en conserve la force en français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: בְּשִׁגָּעוֹן
  choice: de folie
  rationale: שִׁגָּעוֹן désigne la folie ou le dérèglement mental. « Folie » est direct, naturel et adapté au contexte.
- source_word: וּבְעִוָּרוֹן
  choice: d’aveuglement
  rationale: עִוָּרוֹן désigne l’état de cécité. « Aveuglement » s’intègre naturellement après « frapper de » sans préciser s’il est physique ou figuré.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: et d’égarement intérieur
  rationale: תִמְהוֹן évoque la stupeur, la confusion ou le désarroi, tandis que לֵבָב désigne ici le siège intérieur de la pensée et de la volonté. « Égarement intérieur » transmet cette atteinte profonde sans réduire לֵבָב au seul organe physique.
- source_word: לֵבָב
  choice: intérieur
  rationale: Dans ce contexte, le « cœur » hébreu englobe l’esprit, le jugement et la volonté. La tournure française « égarement intérieur » rend cette portée de façon naturelle, tandis que la note conserve l’image littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le nom divin; sa translittération préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de לֵבָב dans תִמְהוֹן לֵבָב
  choice: égarement intérieur
  alternative: confusion du cœur
  rationale: Le mot hébreu « cœur » peut désigner le centre de la pensée, du discernement et de la volonté. Le texte principal privilégie une expression française intelligible, et la note signale le rendu plus formel ainsi que d’autres nuances possibles.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination ternaire et la vigueur du langage de malédiction sont conservées; la dernière expression est formulée idiomatiquement tout en maintenant ses variantes dans la note.
