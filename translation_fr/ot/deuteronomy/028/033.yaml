source:
  edition: WLC
  text: פְּרִ֤י אַדְמָֽתְ/ךָ֙ וְ/כָל יְגִ֣יעֲ/ךָ֔ יֹאכַ֥ל עַ֖ם אֲשֶׁ֣ר לֹא יָדָ֑עְתָּ וְ/הָיִ֗יתָ רַ֛ק עָשׁ֥וּק וְ/רָצ֖וּץ כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: fr
  text: Un peuple que tu n’as pas connu mangera le fruit de ta terre[a] et tout le produit de ton travail[b] ; tu ne seras qu’opprimé et écrasé tous les jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le produit de ta terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout ton labeur » ou « tout ton travail ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: le fruit de ta terre
  rationale: Cette formulation conserve l’image agricole concrète de l’hébreu tout en restant naturelle en français ; « fruit » peut désigner ici l’ensemble de la récolte ou de la production du sol.
- source_word: יְגִיעֲךָ
  choice: le produit de ton travail
  rationale: Le nom peut désigner le labeur ou ce qu’il rapporte. Puisqu’il est l’objet du verbe « manger », la formulation explicite légèrement le résultat du travail sans perdre l’idée d’effort.
- source_word: יֹאכַל
  choice: mangera
  rationale: Le verbe français courant rend directement le sens ordinaire de l’hébreu et maintient l’image de la consommation des biens agricoles.
- source_word: עַם
  choice: un peuple
  rationale: Le singulier collectif hébreu désigne ici un groupe étranger ; « un peuple » en reproduit naturellement la forme et le sens.
- source_word: אֲשֶׁר לֹא יָדָעְתָּ
  choice: que tu n’as pas connu
  rationale: Le passé composé reflète l’accompli hébreu et présente ce peuple comme jusque-là inconnu du destinataire, sans ajouter « jamais », absent du texte.
- source_word: רַק
  choice: ne… que
  rationale: La tournure restrictive française exprime l’exclusivité et souligne le caractère incessant de la situation annoncée.
- source_word: עָשׁוּק
  choice: opprimé
  rationale: Le terme rend clairement l’état de celui qui subit oppression, injustice ou exploitation dans ce contexte de malédiction.
- source_word: רָצוּץ
  choice: écrasé
  rationale: « Écrasé » conserve la force de l’image hébraïque d’une personne brisée ou broyée, tout en formant un couple naturel avec « opprimé ».
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Cette expression française rend simplement l’idée de continuité portée par l’hébreu, sans limiter nécessairement la durée à quelques jours.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne, avec tutoiement singulier conforme à l’adresse hébraïque. La phrase conserve les images concrètes de la consommation, de l’oppression et de l’écrasement, tout en explicitant légèrement יְגִיעֲךָ dans le texte principal afin que l’objet de « mangera » soit naturel en français.
