  text: וְ/הָי֥וּ שָׁמֶ֛י/ךָ אֲשֶׁ֥ר עַל רֹאשְׁ/ךָ֖ נְחֹ֑שֶׁת וְ/הָ/אָ֥רֶץ אֲשֶׁר תַּחְתֶּ֖י/ךָ בַּרְזֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: fr
  text: Le ciel au-dessus de ta tête sera de bronze[a], et la terre sous toi sera de fer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de cuivre ».
    reason: 'Alternative lexicale : נְחֹשֶׁת peut désigner le cuivre ou le bronze.'
lexical_decisions:
- source_word: וְהָיוּ
  choice: sera
  rationale: Dans ce contexte de malédiction, le parfait qal précédé de la conjonction a une valeur future. Le futur français exprime naturellement la portée prédictive et solennelle de l’avertissement.
- source_word: שָׁמֶיךָ
  choice: le ciel
  rationale: שָׁמַיִם peut désigner les cieux ou le ciel visible. Ici, l’image concerne le ciel au-dessus de la personne, vraisemblablement sous l’angle des conditions météorologiques; le singulier collectif « le ciel » est le tour français le plus naturel.
- source_word: אֲשֶׁר עַל רֹאשְׁךָ
  choice: au-dessus de ta tête
  rationale: Cette formulation rend naturellement la proposition relative hébraïque tout en conservant l’image verticale.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » convient à l’image d’un ciel dur et impénétrable et forme en français une paire forte avec « fer »; l’autre possibilité est signalée en note.
- source_word: וְהָאָרֶץ
  choice: et la terre
  rationale: אֶרֶץ peut signifier « terre », « pays » ou « sol ». Le parallélisme avec le ciel et l’expression « sous toi » favorisent ici « la terre ».
- source_word: אֲשֶׁר תַּחְתֶּיךָ
  choice: sous toi
  rationale: La formulation concise conserve la relation spatiale du texte et répond au parallélisme avec « au-dessus de ta tête », sans ajouter « pieds », absent de l’hébreu.
- source_word: בַּרְזֶל
  choice: fer
  rationale: C’est l’équivalent courant du terme hébreu et il achève l’image d’une terre dure et improductive.
theological_decisions:
- issue: Portée métaphorique de l’image de malédiction
  choice: Conserver littéralement les images métalliques du bronze et du fer sans expliciter la sécheresse ni la stérilité dans le texte principal.
  alternative: Paraphraser en parlant d’un ciel sans pluie et d’une terre durcie.
  rationale: L’hébreu présente une image vive de la malédiction de l’alliance. La garder préserve sa force et sa tension sans intégrer au texte une interprétation explicative.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne du singulier. La structure parallèle et l’imagerie concrète du texte source sont conservées.
