base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: fr
  text: La femme tendre et raffinée parmi vous, qui n’a même pas essayé de poser la plante de son pied sur le sol, tant elle était habituée au luxe et à la douceur, regardera d’un mauvais œil[a] son mari[b], son fils et sa fille —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « son œil sera mauvais envers ». Cette expression hébraïque peut évoquer l’hostilité, mais aussi une attitude égoïste ou réticente à partager.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « l’homme de son sein », expression intime qui désigne ici son mari.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה בְךָ וְהָעֲנֻגָּה
  choice: La femme la plus délicate et raffinée parmi vous
  rationale: Les deux adjectifs féminins décrivent une femme tendre ou sensible, habituée au raffinement. Le français coordonne « délicate et raffinée » et emploie le superlatif conformément à la valeur contextuelle de cette désignation au sein du groupe.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: qui n’aurait même pas essayé de poser la plante du pied par terre
  rationale: נִסְּתָה peut exprimer le fait d’essayer ou de se risquer à faire quelque chose. La tournure française conserve l’image concrète et l’idée d’une délicatesse extrême.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: si délicate et sensible que
  rationale: La construction française exprime naturellement le rapport causal entre son raffinement, sa sensibilité et son refus de poser le pied à terre, tout en faisant écho aux adjectifs du début.
- source_word: תֵּרַע עֵינָהּ
  choice: jettera un regard hostile
  rationale: Littéralement, son œil « deviendra mauvais » envers les siens. « Jeter un regard hostile » rend clairement l’hostilité dans le corps du texte, tandis que la note conserve l’étendue possible de l’idiome, notamment l’égoïsme et la réticence à partager.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: sur l’homme qu’elle serre contre elle
  rationale: L’expression désigne littéralement « l’homme de son sein » et, dans ce contexte, son mari. Cette formulation préserve l’image d’intimité sans produire le calque peu naturel « l’homme de son sein ».
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: sur son fils et sur sa fille
  rationale: Le texte hébreu nomme séparément le fils et la fille; la traduction maintient cette précision.
