revisions:
- from: La femme la plus délicate et raffinée parmi vous, si délicate et sensible qu’elle n’aurait même pas essayé de poser la plante du pied par terre, jettera un regard hostile[a] sur l’homme qu’elle serre contre elle[b], sur son fils et sur sa fille —
  to: La femme tendre et raffinée parmi vous, qui n’a même pas essayé de poser la plante de son pied sur le sol, tant elle était habituée au luxe et à la douceur, regardera d’un mauvais œil[a] son mari[b], son fils et sa fille —
  rationale: La révision supprime le superlatif non exprimé par le texte source, rend le parfait hébreu par « n’a même pas essayé », et traduit le lien causal de מֵהִתְעַנֵּג וּמֵרֹךְ sans le confondre avec les deux adjectifs initiaux. L’idiome de l’« œil mauvais » est conservé au moyen d’un idiome français équivalent, dont la note explicite l’éventail sémantique. Le tiret final est maintenu, car la phrase se poursuit au verset suivant.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:03:44Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « la plus » introduit un superlatif absent de l’hébreu. La tournure hypothétique « si... qu’elle n’aurait... » atténue et décale le parfait hébreu, qui décrit son comportement habituel antérieur. « Regard hostile » ne rend qu’une partie de l’idiome « œil mauvais »; l’idiome français correspondant permet de conserver la portée de malveillance et d’avarice intéressée.
  naturalness: Le texte révisé reste fluide en français international moderne, tout en évitant la répétition et la construction conditionnelle peu adaptée au contexte.
  terminology: « Tendre et raffinée » rend les deux qualificatifs sans superlatif. « Regardera d’un mauvais œil » préserve l’idiome hébreu avec une expression française naturelle. « Son mari » rend le référent contextuel de l’expression intime, précisé en note.
