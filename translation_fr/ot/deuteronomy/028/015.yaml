source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: fr
  text: Mais si tu n’écoutes pas la voix de Yahweh, ton Dieu[a], pour observer et mettre en pratique tous ses commandements et toutes ses prescriptions qu’il te prescrit aujourd’hui[b], toutes ces malédictions viendront sur toi et t’atteindront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écouter la voix de ». En hébreu, cette expression implique une écoute obéissante ; autre traduction possible : « obéir à Yahweh, ton Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour garder et faire tous ses commandements et toutes ses prescriptions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: Mais si
  rationale: La tournure ouvre, en contraste avec les bénédictions précédentes, une condition négative. « Mais si » restitue naturellement cette fonction en français.
- source_word: תִשְׁמַע בְּקוֹל
  choice: tu n’écoutes pas la voix de
  rationale: Cette expression hébraïque associe l’écoute à l’obéissance. La conserver préserve son image auditive et sa portée d’alliance sans la réduire au seul verbe « obéir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel attesté directement dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend simplement la formule d’alliance avec suffixe masculin singulier.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: en veillant à mettre en pratique
  rationale: « Veiller à » exprime l’idée de garder ou observer, tandis que « mettre en pratique » rend l’accomplissement concret. Cette formulation française naturelle conserve les deux dimensions des infinitifs hébreux.
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: tous ses commandements et toutes ses prescriptions
  rationale: « Commandements » garde le registre juridique et religieux de מִצְוֹת, tandis que « prescriptions » distingue naturellement חֻקּוֹת en français moderne.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: Dans ce contexte, « donner » des commandements est idiomatique en français et traduit le fait que Moïse les prescrit actuellement à son interlocuteur.
- source_word: וּבָאוּ עָלֶיךָ
  choice: viendront sur toi
  rationale: Rendu direct de l’image hébraïque de malédictions qui surviennent à quelqu’un.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: toutes ces malédictions
  rationale: Traduction lexicale simple qui convient au cadre des bénédictions et malédictions de l’alliance.
- source_word: וְהִשִּׂיגוּךָ
  choice: et t’atteindront
  rationale: Le verbe évoque ce qui rejoint sa cible. « T’atteindront » conserve cette image de poursuite dans un français clair et digne.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Degré d’explicitation de l’obéissance dans תִשְׁמַע בְּקוֹל
  choice: écoutes la voix de
  alternative: obéis à
  rationale: L’expression hébraïque signifie une écoute obéissante. Le rendu retenu conserve à la fois l’image de l’écoute et son implication pratique, précisée par la proposition suivante.
- issue: Relation syntaxique de לִשְׁמֹר לַעֲשׂוֹת
  choice: en veillant à mettre en pratique
  alternative: pour observer et mettre en pratique
  rationale: Le lien exact des infinitifs avec l’écoute peut être formulé de plusieurs manières. Le choix retenu les présente comme la manifestation concrète de l’écoute sans supprimer leur double valeur d’observation et d’action.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël envisagé collectivement. La structure condition-conséquence demeure nette, et l’image de l’écoute ainsi que celle des malédictions qui rejoignent leur cible sont conservées.
