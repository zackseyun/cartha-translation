  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: fr
  text: Il te prêtera[a], mais toi, tu ne lui prêteras pas. Il sera la tête, et toi, tu seras la queue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’étranger résident mentionné au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, hifil)
  choice: te prêtera / ne lui prêteras pas
  rationale: Dans ce contexte, le hifil de לוה désigne le fait de prêter. Cette formulation conserve l’opposition entre créancier et débiteur ainsi que le renversement de dépendance économique.
- source_word: הוּא
  choice: il
  rationale: Le pronom masculin singulier renvoie à l’étranger résident mentionné au verset précédent et conserve la formulation pronominale de l’hébreu.
- source_word: לְרֹאשׁ / לְזָנָב
  choice: la tête / la queue
  rationale: La traduction directe préserve la métaphore hébraïque de la prééminence et de la subordination, ainsi que son contraste frappant.
- source_word: וְאַתָּה
  choice: mais toi / et toi
  rationale: Le pronom explicite est rendu par « toi » afin de garder l’insistance et le contraste. « Mais » exprime naturellement la première opposition, tandis que « et » maintient le parallélisme dans la seconde.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: sera / seras
  rationale: Le futur simple exprime naturellement en français le statut qui résultera de la malédiction annoncée.
theological_decisions:
- issue: Référence masculine au singulier
  choice: Conserver « il » au singulier
  alternative: Employer un pluriel épicène ou répéter « l’étranger résident » dans le texte principal
  rationale: L’hébreu emploie un masculin singulier qui renvoie de manière représentative à l’étranger résident du verset précédent. Le conserver évite de neutraliser ou d’expliciter au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « toi » restitue l’emphase hébraïque; les images concrètes de « la tête » et « la queue » sont conservées sans paraphrase interprétative.
