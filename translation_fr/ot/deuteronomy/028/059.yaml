source:
  edition: WLC
  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: fr
  text: 'Alors Yahweh rendra extraordinaires[a] tes fléaux et ceux de ta descendance : de grands fléaux persistants[b], ainsi que des maladies graves et persistantes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « stupéfiants ». Le verbe hébreu peut désigner ce qui est extraordinaire ou remarquable ; ici, il souligne le caractère exceptionnellement redoutable du jugement.
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « persistants » signifie aussi « fermes » ou « durables ». Le même mot hébreu qualifie les fléaux et les maladies.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: rendra extraordinaires
  rationale: Le hiphil de פלא exprime ici le caractère exceptionnel ou stupéfiant des fléaux. « Rendra extraordinaires » conserve cette intensification sans donner au terme une valeur positive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom personnel divin plutôt que de lui substituer un titre.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: les fléaux qui s’abattront sur toi / fléaux
  rationale: מכה peut désigner un coup ou un fléau. Dans le contexte des malédictions de l’alliance, « fléaux » exprime naturellement des calamités infligées; la tournure verbale rend idiomatiquement le possessif hébreu.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: « Descendance » rend le sens collectif de זרע dans un français moderne et naturel.
- source_word: גְּדֹלוֹת
  choice: grands
  rationale: L’adjectif signifie littéralement « grands » et souligne ici l’ampleur ou la gravité des fléaux.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: persistants
  rationale: Dans ce contexte, le terme issu de אמן décrit ce qui demeure fermement et dure. La répétition de « persistants » reproduit celle de l’hébreu pour les fléaux et les maladies.
- source_word: חֳלָיִם
  choice: maladies
  rationale: Le nom désigne des maladies ou des affections; « maladies » est le terme courant et concret en français.
- source_word: רָעִים
  choice: graves
  rationale: Appliqué aux maladies, רָעִים indique leur caractère mauvais, pénible ou sévère; « graves » est idiomatique en français.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: « Yahweh » conserve le nom propre présent dans le texte hébreu sans le remplacer par un titre.
- issue: Valeur de פלא dans un contexte de jugement
  choice: rendra extraordinaires
  alternative: rendra stupéfiants / fera des fléaux exceptionnels
  rationale: Le verbe évoque ce qui sort de l’ordinaire ou suscite la stupeur. Le choix retenu garde cette force tout en évitant la connotation positive que pourrait avoir « merveilleux ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase explicite idiomatiquement que les fléaux s’abattent sur la personne et sa descendance, tout en conservant le parallélisme et la répétition de l’hébreu.
