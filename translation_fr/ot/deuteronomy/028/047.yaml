  variant: modern international French
source:
  edition: WLC
  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: fr
  text: parce que tu n’as pas servi Yahweh ton Dieu avec joie et de bon cœur[a], dans l’abondance de tout[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « avec bonté de cœur ». L’expression peut aussi évoquer la joie ou le contentement intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause de l’abondance de tout » ou « du fait de l’abondance de tout ». L’hébreu peut évoquer soit le cadre d’une abondance générale, soit un rapport causal; le contexte souligne que le service n’a pas été rendu malgré les abondantes provisions.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: parce que
  rationale: Dans ce contexte d’alliance, la locution introduit la cause des malédictions. « Parce que » en exprime clairement la valeur sans conserver artificiellement le sens spatial de תַּחַת.
- source_word: עָבַדְתָּ
  choice: tu n’as pas servi
  rationale: Avec Dieu comme complément, עבד désigne le service qui lui est dû, englobant culte, fidélité et obéissance. « Servir » conserve cette étendue de sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בְּשִׂמְחָה
  choice: avec joie
  rationale: Cette formulation exprime directement la manière de servir et maintient le parallélisme avec la locution suivante.
- source_word: וּבְטוּב לֵבָב
  choice: et de bon cœur[a]
  rationale: « De bon cœur » est une expression française naturelle qui conserve l’image du cœur et la nuance positive de טוּב, sans la réduire entièrement à la joie déjà exprimée par שִׂמְחָה. La note signale la formulation littérale et l’autre nuance possible.
- source_word: מֵרֹב כֹּל
  choice: alors que tu avais tout en abondance[b]
  rationale: La préposition מִן peut ici marquer la circonstance associée à l’abondance. Cette formulation française fait comprendre que le manquement a eu lieu malgré les biens abondamment accordés, sans présenter nécessairement l’abondance comme sa cause mécanique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Portée du service exprimé par עבד
  choice: servir
  alternative: adorer
  rationale: Dans le cadre de l’alliance, le verbe comprend l’adoration mais aussi l’obéissance et la fidélité pratiques. « Servir » évite de restreindre indûment cette portée.
- issue: Rapport entre l’abondance et le manquement d’Israël
  choice: alors que tu avais tout en abondance
  alternative: à cause de l’abondance de tout
  rationale: Le syntagme hébreu est concis et son rapport exact peut être compris comme causal ou circonstanciel. Le texte principal privilégie la circonstance concessive suggérée par le contexte, tandis que la note préserve la formulation plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement singulier reproduit l’adresse collective à Israël au masculin singulier. « De bon cœur » est idiomatique sans effacer l’image hébraïque du cœur; les notes conservent les ambiguïtés lexicales réelles.
