revisions:
- from: Tout comme Yahweh s’est réjoui à votre sujet en vous faisant du bien et en vous rendant nombreux, de même Yahweh se réjouira à votre sujet en vous faisant périr et en vous exterminant. Vous serez arrachés du sol où tu entres pour en prendre possession.[a]
  to: Il arrivera que, tout comme Yahweh s’est réjoui à votre sujet en vous faisant du bien et en vous rendant nombreux, de même Yahweh se réjouira à votre sujet en vous faisant périr et en vous exterminant ; vous serez arrachés du pays où tu entres pour en prendre possession.[a]
  rationale: La révision restitue explicitement la formule initiale וְהָיָה par « Il arrivera que » et emploie « pays » dans la dernière proposition. Elle maintient le parallélisme verbal, la sévérité du jugement, le nom divin et l’ambiguïté textuelle du singulier, signalée par une note correctement ancrée.
  reviewer_model: gpt-5.6-terra
