  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: fr
  text: Il arrivera que, tout comme Yahweh s’est réjoui à votre sujet en vous faisant du bien et en vous rendant nombreux, de même Yahweh se réjouira à votre sujet en vous faisant périr et en vous exterminant ; vous serez arrachés du pays où tu entres pour en prendre possession.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici du pluriel au singulier : Israël est interpellé comme un seul peuple.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר ... כֵּן
  choice: Tout comme… de même
  rationale: Cette construction française naturelle rend la corrélation hébraïque et son orientation future sans alourdir la phrase par un calque de וְהָיָה.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: s’est réjoui / se réjouira
  rationale: Le même verbe français dans les deux propositions conserve le parallélisme délibéré entre bénédiction et jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin conforme à l’usage du projet.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: en vous faisant du bien
  rationale: Rend largement et directement le causatif de יטב sans le réduire à la seule prospérité matérielle.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: et en vous rendant nombreux
  rationale: Expression idiomatique en français qui conserve l’idée d’accroissement du peuple.
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: en vous faisant périr
  rationale: Rend la valeur causative de אבד et distingue ce premier verbe du suivant.
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: et en vous exterminant
  rationale: Terme fort et digne qui exprime la gravité de שׁמד sans atténuer la malédiction.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: Vous serez arrachés du sol
  rationale: « Arrachés » garde la violence de l’enlèvement forcé; « du sol » rend הָאֲדָמָה et produit un français naturel.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: où tu entres pour en prendre possession
  rationale: Le singulier « tu » préserve le passage soudain de l’adresse plurielle à Israël considéré comme un seul peuple; « en » reprend explicitement le complément du verbe posséder.
theological_decisions:
- issue: La joie divine dans le jugement
  choice: Conserver « Yahweh se réjouira à votre sujet » avant l’annonce de la destruction.
  alternative: Atténuer par « Yahweh consentira » ou reformuler pour éviter d’attribuer une joie à Yahweh.
  rationale: L’hébreu répète intentionnellement le verbe שׂושׂ dans les deux moitiés. La formulation maintient cette tension théologique sans l’expliquer ni l’adoucir.
- issue: Le passage du pluriel au singulier dans l’adresse
  choice: Employer « vous » puis « tu » et ajouter une note.
  alternative: Uniformiser toute la phrase au pluriel pour plus de fluidité.
  rationale: Le texte hébreu passe réellement du pluriel au singulier et présente ainsi Israël collectivement comme un peuple unique.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme est mis en relief par « Tout comme… de même ». Le changement de nombre grammatical est volontairement visible et expliqué en note.
