base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: fr
  text: et même envers son arrière-faix, qui sortira d’entre ses jambes[a], et envers ses enfants qu’elle mettra au monde, car elle les mangera en secret, faute de tout[b], pendant le siège et la détresse que ton ennemi te fera subir dans tes villes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son placenta ». Le terme hébreu désigne l’arrière-faix expulsé lors de l’accouchement.
    reason: lexical_alternative
  - marker: b
    text: Ou « par manque de tout ». L’expression désigne une privation totale.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « dans tes portes » : les portes représentent ici les villes fortifiées assiégées.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: ses délivres
  rationale: Le nom désigne l’arrière-faix, notamment le placenta. « Délivres », terme français usuel au pluriel dans ce sens, garde la référence concrète à l’accouchement sans adopter un registre excessivement clinique.
- source_word: הַיֹּצֵת מִבֵּין רַגְלֶיהָ
  choice: qui sortent d’entre ses jambes
  rationale: La proposition décrit directement l’expulsion lors de l’accouchement. « Jambes » rend naturellement רַגְלַיִם dans ce contexte.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: et ses enfants qu’elle mettra au monde
  rationale: בָּנִים désigne ici sa progéniture sans restriction nécessaire aux fils; « mettre au monde » rend naturellement ילד et maintient le lien avec l’accouchement.
- source_word: כִּי תֹאכְלֵם
  choice: car elle les mangera
  rationale: כִּי introduit la raison de son attitude, et le verbe ordinaire « manger » conserve la brutalité concrète de la malédiction.
- source_word: בְּחֹסֶר כֹּל
  choice: faute de tout
  rationale: Cette expression française concise traduit la privation totale exprimée par l’hébreu.
- source_word: בַּסָּתֶר
  choice: en secret
  rationale: L’expression indique que l’acte sera accompli clandestinement et se lit naturellement en français moderne.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: pendant le siège et dans la détresse
  rationale: La traduction conserve les deux notions distinctes, le siège militaire et l’extrême détresse qui l’accompagne.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: où ton ennemi te réduira
  rationale: Dans ce contexte de siège, צוּק évoque la pression et l’état d’extrême détresse imposés par l’ennemi; « réduire à la détresse » s’intègre naturellement à la syntaxe française.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Littéralement « dans tes portes », l’expression désigne par métonymie les villes fortifiées; traduire le sens évite de faire croire qu’il s’agit seulement des ouvrages d’entrée.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le verset poursuit syntaxiquement le précédent; l’ouverture par « même » rend la portée de la préposition répétée sans tenter de recréer artificiellement une phrase autonome. La violence explicite du texte hébreu est conservée.
