  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: fr
  text: Elle dévorera les petits de ton bétail et les produits de ton sol jusqu’à ce que tu sois détruit. Elle ne te laissera ni grain, ni vin nouveau, ni huile, ni veaux de ton gros bétail, ni petits de ton troupeau[a], jusqu’à ce qu’elle t’ait fait périr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque, rare, désigne probablement la progéniture ou l’accroissement du petit bétail ; autre traduction possible : « les agneaux de ton troupeau ».",'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: Elle dévorera
  rationale: Le verbe signifie littéralement « manger », mais, dans le contexte d’une invasion qui épuise toutes les ressources, « dévorera » exprime naturellement la consommation hostile et totale. Le pronom féminin reprend la nation envahissante mentionnée au verset précédent.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: les petits de ton bétail
  rationale: Avec les animaux, פְּרִי (« fruit ») désigne leur progéniture. « Les petits de ton bétail » rend clairement cet emploi idiomatique.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: les produits de ton sol
  rationale: Avec אַדָמָה, פְּרִי désigne le rendement agricole. « Les produits de ton sol » est naturel et conserve l’image agraire.
- source_word: עַד הִשָּׁמְדָךְ
  choice: jusqu’à ce que tu sois détruit
  rationale: L’infinitif construit avec suffixe indique le terme de l’action. La proposition passive rend clairement la syntaxe et la gravité de la malédiction sans renforcer indûment le sens.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: Elle ne te laissera ni
  rationale: Cette formulation française introduit naturellement l’énumération des ressources dont l’envahisseur ne laissera rien.
- source_word: דָּגָן
  choice: blé
  rationale: דָּגָן désigne les céréales ou le grain en général. Dans la triade agricole traditionnelle, « blé » est une formulation française courante, sans viser nécessairement une seule espèce céréalière.
- source_word: תִּירוֹשׁ
  choice: vin nouveau
  rationale: תִּירוֹשׁ désigne habituellement le produit récent de la vigne, souvent le vin nouveau; cette traduction maintient la distinction avec le vin en général.
- source_word: יִצְהָר
  choice: huile
  rationale: Dans la triade avec le blé et le vin nouveau, le terme renvoie à l’huile, normalement l’huile d’olive. Le contexte rend inutile l’ajout explicatif « d’olive » dans le texte.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: veaux de ton gros bétail
  rationale: שְׁגַר désigne ici les petits ou l’accroissement du bétail, et אֲלָפֶיךָ le gros bétail. « Veaux » est précis et idiomatique en français.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: petits de ton troupeau[a]
  rationale: L’expression rare semble désigner la progéniture ou l’accroissement reproductif du petit bétail. Une formulation générale évite de la limiter aux seuls agneaux, tandis qu’une note signale l’incertitude lexicale.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: jusqu’à ce qu’elle t’ait fait périr
  rationale: Le hiphil de אבד est causatif, « faire périr ». Cette traduction conserve cette nuance et évite d’aplatir la variation avec le verbe précédent.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier conserve l’adresse directe de l’hébreu. La répétition et la progression vers la destruction sont maintenues, tandis que la variation entre « détruit » et « fait périr » reflète les deux verbes hébreux distincts.
