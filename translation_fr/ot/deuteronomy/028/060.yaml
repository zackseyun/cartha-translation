  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: fr
  text: Il fera revenir sur toi toutes les maladies d’Égypte que tu redoutais, et elles s’attacheront à toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיב בְּךָ
  choice: Il fera revenir sur toi
  rationale: Le hifil de שוב exprime ici l’action de faire revenir; «sur toi» rend naturellement בְּךָ dans le contexte de fléaux imposés.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: toutes les maladies d’Égypte
  rationale: מַדְוֶה désigne la maladie ou le mal physique; le pluriel français convient au collectif hébreu précédé de כָּל et reste naturel.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: que tu redoutais
  rationale: יגר exprime la peur ou l’effroi; «redoutais» restitue cette force sans alourdir la phrase. Le suffixe pluriel renvoie aux maladies.
- source_word: וְדָבְקוּ בָּךְ
  choice: et elles s’attacheront à toi
  rationale: דבק évoque une adhérence persistante. «S’attacheront à toi» conserve l’image tout en étant idiomatique en français moderne.
