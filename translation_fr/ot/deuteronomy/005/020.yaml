  text: וְ/לֹֽא תַעֲנֶ֥ה בְ/רֵֽעֲ/ךָ֖ עֵ֥ד שָֽׁוְא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: fr
  text: Tu ne porteras pas de faux témoignage contre ton prochain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne témoigneras pas faussement contre ton prochain. »'
    reason: Alternative lexicale qui explicite directement la valeur juridique de תַעֲנֶה avec עֵד.
lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: Négation ordinaire employée ici dans une interdiction; le futur français exprime la force prescriptive du commandement.
- source_word: תַעֲנֶה
  choice: porteras
  rationale: Dans cette construction juridique avec עֵד, le verbe concerne l’acte de témoigner. « Porter témoignage » conserve l’expression juridique traditionnelle tout en restant compréhensible.
- source_word: בְרֵעֲךָ
  choice: contre ton prochain
  rationale: רֵעַ désigne le prochain, le compagnon ou l’autre membre de la communauté. Après un verbe de témoignage, בְ se rend naturellement par « contre » dans ce contexte judiciaire.
- source_word: עֵד
  choice: témoignage
  rationale: Bien que עֵד puisse désigner un témoin, il entre ici dans une expression signifiant apporter ou donner un témoignage; le nom abstrait produit en français une formulation naturelle et fidèle.
- source_word: שָׁוְא
  choice: faux
  rationale: Le terme peut évoquer la fausseté, la tromperie ou ce qui est sans valeur. Dans un cadre judiciaire, « faux » rend précisément la nature mensongère du témoignage.
theological_decisions: []
