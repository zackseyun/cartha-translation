base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: fr
  text: 'Moïse convoqua tout Israël et leur dit : « Écoute[a], Israël, les prescriptions et les règles de droit[b] que je vous fais entendre aujourd’hui. Apprenez-les et veillez à les mettre en pratique. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Entends, Israël ». L’impératif hébreu désigne ici une écoute attentive appelée à conduire à l’obéissance, et non la simple perception de sons.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire par « décisions de justice », « ordonnances » ou « règles ». Le terme hébreu désigne des décisions juridiques ou des normes prescrites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Dans ce cadre d’adresse à l’ensemble du peuple, קרא exprime l’appel à se rassembler. « Convoqua » rend clairement cette valeur sans alourdir le récit.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette formulation conserve la désignation collective et l’idée que le peuple entier est concerné par l’adresse d’alliance.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Écoute, Israël
  rationale: « Écoute » est l’impératif naturel en français moderne. Dans ce contexte, il implique une attention réceptive appelée à déboucher sur l’obéissance.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: « Prescriptions » désigne des dispositions établies et garde un registre juridique accessible, tout en restant distinct de מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles de droit
  rationale: Cette expression rend la dimension juridique et normative du terme sans la confondre avec les « prescriptions » qui précèdent.
- source_word: דֹּבֵר בְּאָזְנֵיכֶם הַיּוֹם
  choice: que je vous fais entendre aujourd’hui
  rationale: La formulation restitue l’action présente du participe et l’image hébraïque d’une parole prononcée directement aux oreilles des auditeurs, dans un français naturel.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Apprenez-les
  rationale: Le verbe appelle le peuple à acquérir et à assimiler les dispositions énoncées.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: veillez à les mettre en pratique
  rationale: « Veillez à » rend la vigilance et le soin exprimés par שׁמר, tandis que « mettre en pratique » exprime naturellement en français le but concret indiqué par לעשותם.
theological_decisions:
- issue: Maintien de la distinction entre חֻקִּים et מִשְׁפָּטִים
  choice: les prescriptions et les règles de droit
  alternative: les décrets et les ordonnances
  rationale: Les deux termes appartiennent au même champ juridique sans être strictement synonymes. Deux expressions distinctes préservent la texture du vocabulaire de l’alliance sans lui imposer une classification doctrinale ultérieure.
- issue: Portée de l’impératif שְׁמַע
  choice: Écoute, Israël
  alternative: Entends, Israël
  rationale: « Écoute » transmet en français actuel l’appel à une attention active. Une note précise que le verbe peut inclure l’idée d’une écoute conduisant à l’obéissance, sans introduire cette interprétation directement dans le texte.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le discours direct garde la solennité de l’exhortation d’alliance, tandis que « mettre en pratique » évite le calque peu naturel « les faire ».
