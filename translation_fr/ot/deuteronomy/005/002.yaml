  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: fr
  text: Yahweh notre Dieu a conclu une alliance avec nous à l’Horeb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a coupé une alliance avec nous à l’Horeb » — expression hébraïque signifiant « conclure une alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom avec le suffixe de première personne du pluriel et conserve la relation d’alliance exprimée.
- source_word: כָּרַת
  choice: a conclu
  rationale: Dans l’expression כָּרַת בְּרִית, le français idiomatique dit « conclure une alliance » ; le sens concret de « couper » est signalé en note.
- source_word: בְּרִית
  choice: une alliance
  rationale: « Alliance » est le terme français naturel qui garde la portée relationnelle et solennelle de בְּרִית.
- source_word: עִמָּנוּ
  choice: avec nous
  rationale: Traduction directe de la préposition munie du suffixe de première personne du pluriel.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: La préposition est locative ici ; l’article devant le nom du massif est idiomatique en français biblique moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. « Conclure une alliance » restitue l’idiome hébreu sans calque obscur ; la note conserve son image littérale.
