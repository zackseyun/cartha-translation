    issue: « Pendant six jours » est légèrement surinterprétatif.
    rationale: Le syntagme hébreu exprime la durée (« six jours »), sans préposition. En français, « pendant » peut évoquer une continuité durant toute la période; « Six jours » conserve plus sobrement l’ambiguïté et l’ordre de l’original.
  - severity: low
    issue: « Ouvrage » est moins idiomatique que « travail » dans ce contexte.
    rationale: En français international moderne, « tout ton travail » désigne naturellement l’ensemble des tâches à accomplir; « ouvrage » peut faire penser au produit d’un travail ou à une œuvre.
  revised_text: Six jours, tu travailleras et tu feras tout ton travail.[a]
