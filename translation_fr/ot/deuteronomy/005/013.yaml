  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: fr
  text: Six jours, tu travailleras et tu feras tout ton travail.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Six jours, tu peux travailler et faire tout ton travail. » Dans ce contexte juridique, les formes verbales hébraïques peuvent être comprises comme une instruction ou comme une permission.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Pendant six jours
  rationale: Le groupe nominal exprime une durée. En français naturel, « pendant » explicite cette valeur sans modifier le sens.
- source_word: תַּעֲבֹד
  choice: tu travailleras
  rationale: Le verbe עבד désigne ici le travail ordinaire. Le futur français convient à la formulation prescriptive du Décalogue tout en laissant ouverte, en note, la nuance permissive possible.
- source_word: וְעָשִׂיתָ
  choice: et tu feras
  rationale: Le verbe עשה a un sens large, ici celui d’exécuter ou d’accomplir. « Faire » préserve simplement la coordination hébraïque.
- source_word: כָּל
  choice: tout
  rationale: כָּל indique ici la totalité; devant le nom masculin singulier « ouvrage », « tout » est la formulation française naturelle.
- source_word: מְלַאכְתֶּךָ
  choice: ton ouvrage
  rationale: מְלָאכָה désigne le travail, l’activité ou la tâche. « Ouvrage » évite de répéter « travailler » et conserve la distinction lexicale entre עבד et מְלָאכָה.
theological_decisions:
- issue: Valeur modale des formes verbales dans la législation sur le sabbat
  choice: « tu travailleras et tu feras » avec une valeur prescriptive
  alternative: « tu peux travailler et faire » avec une valeur permissive
  rationale: Le contexte d’alliance et de commandement favorise une lecture prescriptive. Toutefois, les formes verbales hébraïques peuvent aussi exprimer ce qui est permis pendant les six jours; cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse hébraïque à la deuxième personne du masculin singulier. « Ouvrage » maintient la différence entre le verbe « travailler » et le nom désignant l’ensemble des tâches.
