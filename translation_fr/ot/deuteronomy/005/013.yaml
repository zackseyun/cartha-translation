review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : la durée de six jours, les deux verbes coordonnés et la totalité du travail sont conservés. Toutefois, « pendant six jours » peut suggérer une activité ininterrompue et ajoute une nuance temporelle plus marquée que le simple accusatif de durée. « Six jours, tu travailleras » suit plus directement la formulation source et reste naturel en français.'
  naturalness: « Ton ouvrage » est possible, mais désigne souvent une œuvre produite ou un travail particulier et sonne moins naturel ici. « Tout ton travail » est l’expression moderne usuelle dans ce contexte, même si elle reprend le verbe « travailler ».
  terminology: « Travailler » rend adéquatement עבד et « travail » rend naturellement מְלָאכָה dans le cadre du sabbat. Le futur français maintient la portée prescriptive de l’imparfait hébreu sans éliminer entièrement la possibilité d’une lecture permissive, qui est correctement signalée en note.
  issues:
