source:
  edition: WLC
  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: fr
  text: Honore ton père et ta mère, comme Yahweh ton Dieu te l’a ordonné, afin que tes jours se prolongent et que tout aille bien pour toi sur la terre que Yahweh ton Dieu te donne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: Honore
  rationale: L’impératif intensif de כבד signifie ici accorder du poids, de la considération et du respect. « Honore » est précis, naturel et consacré dans ce contexte éthique.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: ton père et ta mère
  rationale: La coordination nomme explicitement les deux parents. Le français naturel n’exige pas de répéter le possessif, tout en conservant leur mise sur un pied d’égalité.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: comme ... te l’a ordonné
  rationale: « Comme » rend la comparaison introduite par כַּאֲשֶׁר. Le passé composé convient au français moderne et le pronom « l’ » reprend naturellement le commandement énoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne du singulier exprime directement la relation possessive et d’alliance.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution exprime clairement la visée ou le résultat, dans un registre digne et courant.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: tes jours se prolongent
  rationale: Cette formulation conserve « tes jours » comme sujet, conformément à l’expression hébraïque, sans la réduire à la paraphrase « tu vives longtemps ».
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: et que tout aille bien pour toi
  rationale: L’expression idiomatique ייטב לך désigne le bien-être ou une situation favorable. Cette traduction est naturelle et n’en précise pas indûment la nature.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: אֲדָמָה désigne ici le territoire donné par Dieu, et עַל est rendu directement par « sur ». « Terre » convient au contexte territorial de Deutéronome.
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le présent français rend naturellement le participe hébreu et la réalité actuelle ou imminente du don divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie le Tétragramme comme nom propre. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Nature de la promesse liée à l’honneur dû aux parents
  choice: Conserver la promesse de longévité et de bien-être sur la terre sans en préciser davantage la portée
  alternative: En faire soit une garantie individuelle absolue, soit une promesse exclusivement nationale
  rationale: Le verset formule une véritable promesse dans le cadre de l’alliance, mais ne tranche pas à lui seul entre ces lectures réductrices. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne du masculin singulier. La formulation reste proche de la syntaxe et des images de l’hébreu tout en étant idiomatique.
