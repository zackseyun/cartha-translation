base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: fr
  text: Ce n’est pas avec nos pères[a] que Yahweh a conclu cette alliance[b], mais avec nous — nous qui sommes tous ici aujourd’hui en vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ». L’hébreu dit littéralement « nos pères ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « a coupé cette alliance », expression qui signifie « a conclu cette alliance ».
    reason: lexical_alternative
  - marker: c
    text: 'Certains comprennent l’opposition de manière rhétorique : non pas avec nos pères seulement, mais tout particulièrement avec nous qui sommes ici aujourd’hui, vivants.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית
  choice: a conclu cette alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance », mais « conclure une alliance » en restitue naturellement le sens en français. « Cette » conserve le démonstratif הַזֹּאת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: אֲבֹתֵינוּ
  choice: nos pères
  rationale: Le texte dit explicitement « nos pères ». Cette formulation est conservée dans le corps du texte, tandis que « nos ancêtres » est signalé comme équivalent contextuel possible.
- source_word: כִּי
  choice: mais
  rationale: Après la négation, כִּי introduit ici un contraste, rendu naturellement par « mais ».
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: avec nous — nous tous
  rationale: L’apposition emphatique hébraïque est conservée par la reprise de « nous » après un tiret, sans reproduire artificiellement mot à mot la syntaxe hébraïque.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: nous tous qui sommes ici aujourd’hui, vivants
  rationale: La traduction conserve le lieu, le moment, la totalité du groupe et l’état de vie exprimés par l’hébreu, dans un ordre naturel en français.
theological_decisions:
- issue: Le verset exclut-il absolument les ancêtres de l’alliance, ou souligne-t-il surtout son application à la génération présente ?
  choice: 'Le texte principal conserve l’opposition explicite : « pas avec nos pères… mais avec nous » sans ajouter de restriction.'
  alternative: Certains comprennent cette opposition au sens de « pas seulement avec nos pères », comme une insistance rhétorique sur l’actualisation de l’alliance pour la génération présente.
  rationale: L’hébreu ne contient aucun terme signifiant « seulement ». Ajouter ce mot résoudrait une tension que le texte laisse ouverte ; l’autre compréhension est donc indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La construction emphatique de l’hébreu est rendue par le tiret et la reprise de « nous » ; aucune précision interprétative absente du texte n’est ajoutée au verset.
