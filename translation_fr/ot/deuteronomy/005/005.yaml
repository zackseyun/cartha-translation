  text: אָ֠נֹכִי עֹמֵ֨ד בֵּין יְהוָ֤ה וּ/בֵֽינֵי/כֶם֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/הַגִּ֥יד לָ/כֶ֖ם אֶת דְּבַ֣ר יְהוָ֑ה כִּ֤י יְרֵאתֶם֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ וְ/לֹֽא עֲלִיתֶ֥ם בָּ/הָ֖ר לֵ/אמֹֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: fr
  text: 'Je me tenais alors entre Yahweh et vous pour vous transmettre la parole de Yahweh, car vous aviez peur du feu[a] et vous n’étiez pas montés sur la montagne, en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous aviez peur devant la face du feu » ; cette expression signifie ici que le feu vous effrayait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: Je me tenais
  rationale: Le pronom indépendant met Moïse en relief, tandis que le participe, dans ce récit au passé, décrit sa position de médiateur à ce moment-là. L’imparfait français rend naturellement cette valeur durative.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: entre Yahweh et vous
  rationale: La paire prépositionnelle indique la position de médiateur entre les deux parties; le nom divin est translittéré « Yahweh ».
- source_word: בָּעֵת הַהִוא
  choice: alors
  rationale: « Alors » rend de façon idiomatique et concise l’expression temporelle renvoyant à l’événement de l’Horeb.
- source_word: לְהַגִּיד לָכֶם
  choice: pour vous transmettre
  rationale: Le hiphil de נגד exprime ici la communication de la parole divine par Moïse. « Transmettre » souligne son rôle de médiateur sans ajouter une interprétation doctrinale.
- source_word: אֶת דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve l’expression biblique et désigne ici ce que Yahweh communique.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la médiation de Moïse; « car » convient au registre narratif digne.
- source_word: יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: vous aviez peur du feu
  rationale: L’expression idiomatique signifie que le feu inspirait la peur. La note conserve la forme hébraïque sous-jacente.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: et vous n’êtes pas montés sur la montagne
  rationale: Le verbe עלה exprime la montée, et בָּהָר désigne la montagne comme lieu vers lequel ou sur lequel on monte.
- source_word: לֵאמֹר
  choice: 'Il a dit :'
  rationale: Le marqueur introduit les paroles divines qui commencent au verset suivant. En français, une proposition introductive explicite évite le participe « disant », lourd et ambigu ici; le sujet renvoie naturellement à Yahweh, dont Moïse transmet la parole.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le caractère de nom propre de l’alliance.
- issue: Sujet implicite associé à לֵאמֹר
  choice: 'Il a dit :'
  alternative: 'en ces termes :'
  rationale: Le contexte présente Moïse comme transmettant la parole de Yahweh, puis introduit cette parole. L’hébreu laisse le lien syntaxique compact; le français requiert une transition naturelle. Le pronom n’ajoute pas un nouveau locuteur, mais explicite celui dont la parole est annoncée.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « me tenais » garde la nuance durative du participe hébreu. La dernière formule est ponctuée comme introduction directe au discours du verset 6.
