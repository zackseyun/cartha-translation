  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: fr
  text: Je suis Yahweh, ton Dieu, qui t’ai fait sortir du pays d’Égypte, de la maison d’esclavage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, littéralement, « de la maison des esclaves ».
    reason: Signaler la formulation concrète et plurielle de l’hébreu tout en conservant dans le texte une expression française idiomatique.
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Je suis
  rationale: Le pronom indépendant ouvre une proposition nominale sans copule exprimée en hébreu. « Je suis » restitue naturellement en français cette identification solennelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne masculine singulière est rendu par « ton » ; dans ce contexte d’alliance, אֱלֹהִים désigne Dieu.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le relatif a pour antécédent personnel Yahweh ; « qui » est donc naturel en français.
- source_word: הוֹצֵאתִיךָ
  choice: t’ai fait sortir
  rationale: 'Le hifil de יצא exprime la causation : faire sortir. Cette formulation rend explicitement la valeur factitive et le complément singulier.'
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: La préposition מִן indique la provenance ; « du pays d’Égypte » est idiomatique et précis.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: Cette formulation conserve l’image concrète de la « maison » et le pluriel concret עֲבָדִים, tout en restant intelligible en français ; une formulation plus abstraite est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre ni adopter la forme traditionnelle tardive « Jéhovah ».
- issue: Sens de עֲבָדִים dans la formule de l’Exode
  choice: esclaves
  alternative: esclavage ; serviteurs
  rationale: Dans le contexte de la délivrance d’Égypte, le terme désigne une condition d’asservissement. Le nom concret « esclaves » conserve la morphologie plurielle et la réalité sociale du texte, sans atténuation par « serviteurs ».
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement rend le suffixe masculin singulier adressé à Israël. La tournure « qui t’ai fait sortir » maintient la première personne du locuteur divin ; la note accompagne immédiatement l’expression qu’elle explique.
