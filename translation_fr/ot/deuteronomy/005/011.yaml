  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: fr
  text: Tu ne prendras pas le nom de Yahweh, ton Dieu, en vain[a], car Yahweh ne laissera pas impuni celui qui prendra son nom en vain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la fausseté », « à tort » ou « de manière vide ». L’hébreu peut viser un emploi faux, vide ou abusif du nom de Yahweh, sans se limiter à une seule forme d’abus.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: prononcer
  rationale: Littéralement, le verbe signifie « lever, porter, prendre ». Avec « le nom », il peut désigner le fait de le porter ou de l’avoir aux lèvres, donc de le prononcer ou de l’invoquer. « Prononcer » donne en français moderne un commandement naturel sans limiter l’interdit aux seuls serments.
- source_word: שֵׁם
  choice: nom
  rationale: Équivalent direct qui conserve les connotations possibles d’identité, d’autorité et de réputation sans les expliciter dans le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin יהוה, plutôt que substitution par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend l’adresse covenantale directe à la deuxième personne du singulier.
- source_word: לַשָּׁוְא
  choice: à tort
  rationale: שָׁוְא couvre la fausseté, le vide, la vanité et l’usage sans valeur. « À tort » est idiomatique et assez large; une note conserve les autres nuances.
- source_word: כִּי
  choice: car
  rationale: Introduit de manière concise la raison du commandement.
- source_word: יְנַקֶּה (נקה)
  choice: ne laissera pas impuni
  rationale: Le piel exprime ici le fait de ne pas déclarer innocent ou de ne pas dispenser de peine. Cette formulation française claire met en valeur la portée judiciaire.
- source_word: אֲשֶׁר
  choice: celui qui
  rationale: Rend naturellement le relatif hébreu visant tout contrevenant.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: Conserve explicitement le renvoi au nom propre de Yahweh.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme יהוה. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Étendue de l’interdiction
  choice: prononcer le nom … à tort
  alternative: porter le nom … pour la fausseté; faire un mauvais usage du nom; invoquer le nom pour mentir
  rationale: L’hébreu peut viser les faux serments, une invocation vide ou mensongère et, plus largement, l’usage abusif du nom. Le texte principal ne réduit donc pas le commandement à une seule situation, et la note conserve son amplitude sémantique.
- issue: Portée judiciaire de נקה
  choice: ne laissera pas impuni
  alternative: ne tiendra pas pour innocent; n’acquittera pas
  rationale: La formulation retenue exprime clairement la conséquence judiciaire tout en signalant en note les rendus plus formels.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque. « Prononcer … à tort » est plus naturel que le calque traditionnel « prendre … en vain », tout en maintenant les diverses interprétations dans une note.
