source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: fr
  text: Ah ![a] Si seulement ils avaient toujours un cœur comme celui-ci, pour me craindre et garder tous mes commandements tous les jours de leur vie, afin que tout aille bien pour eux et pour leurs enfants, pour toujours !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ah ! s’ils avaient un cœur comme celui-ci ». L’expression hébraïque est une formule de souhait, littéralement : « Qui donnera… ? »'
    reason: La note signale l’idiome hébreu de souhait et fournit une formulation française alternative qui en conserve la nuance optative.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah ! Si seulement
  rationale: L’idiome hébreu, littéralement « Qui donnera ? », exprime ici un souhait ardent. Cette tournure française en restitue naturellement la force affective.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: ils avaient toujours un cœur ainsi disposé
  rationale: La formulation rend le contenu du souhait et la valeur qualitative du démonstratif זֶה. « Cœur » conserve l’anthropologie biblique, tandis que « ainsi disposé » explicite sans la réduire la disposition intérieure évoquée.
- source_word: לְיִרְאָה אֹתִי
  choice: pour me craindre
  rationale: « Craindre » préserve le terme biblique d’alliance, qui englobe respect, révérence et obéissance, sans l’affaiblir en simple estime.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: et observer tous mes commandements
  rationale: En français actuel, « observer des commandements » exprime clairement leur mise en pratique fidèle; « commandements » maintient la nuance juridique et alliancielle.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Cette expression reste proche de l’hébreu et signifie ici continuellement, durant toute leur vie.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: afin qu’ils soient heureux
  rationale: La formule exprime le bien-être résultant de la bénédiction divine. « Être heureux » est naturel et n’enferme pas le sens dans la seule prospérité matérielle.
- source_word: וְלִבְנֵיהֶם
  choice: eux et leurs enfants
  rationale: בנים désigne ici collectivement leur descendance; « enfants » correspond au référent générique dans ce contexte d’alliance.
- source_word: לְעֹלָם
  choice: pour toujours
  rationale: Cette traduction directe conserve la portée durable et intergénérationnelle de la promesse.
theological_decisions:
- issue: Portée anthropologique de לְבָבָם
  choice: cœur
  alternative: esprit; disposition intérieure
  rationale: Le « cœur » biblique comprend volonté, pensée et orientation morale. Le conserver évite de ramener le propos à l’intellect seul.
- issue: Sens de la crainte de Dieu
  choice: me craindre
  alternative: me révérer
  rationale: « Craindre » maintient la tension du langage biblique et son sens allianciel, plutôt que de résoudre le terme en seule révérence.
- issue: Référent de וְלִבְנֵיהֶם
  choice: leurs enfants
  alternative: leurs fils; leurs descendants
  rationale: Le masculin hébreu est générique ici et vise la postérité du peuple. « Enfants » est précis dans le contexte immédiat sans limiter le référent aux garçons.
- issue: Nuance de יִיטַב לָהֶם
  choice: qu’ils soient heureux
  alternative: que tout aille bien pour eux
  rationale: Le choix exprime leur bien-être sous la bénédiction de Dieu sans le réduire à la réussite matérielle; l’alternative demeure possible et plus formellement proche.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’élan affectif du souhait divin, le vocabulaire biblique du « cœur » et de la « crainte », ainsi que la portée intergénérationnelle. Le marqueur de note est placé après l’ensemble du verset.
