revisions:
- from: Ah ! Si seulement ils avaient toujours un cœur ainsi disposé, pour me craindre et observer tous mes commandements tous les jours, afin qu’ils soient heureux, eux et leurs enfants, pour toujours ![a]
  to: Ah ![a] Si seulement ils avaient toujours un cœur comme celui-ci, pour me craindre et garder tous mes commandements tous les jours de leur vie, afin que tout aille bien pour eux et pour leurs enfants, pour toujours !
  rationale: La révision conserve l’élan optatif et le vocabulaire d’alliance, tout en rendant plus exactement la portée temporelle de « tous les jours » et la formule de bien-être. Elle évite d’expliciter inutilement « cœur » et replace l’appel de note sur l’expression qu’il explique.
