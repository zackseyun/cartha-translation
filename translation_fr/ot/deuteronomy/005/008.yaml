source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: fr
  text: Tu ne te feras pas d’image sculptée[a], ni aucune représentation[b] de ce qui est dans les cieux, en haut, sur la terre, en bas, ou dans les eaux sous la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « idole ». Le terme hébreu désigne souvent une image employée dans un contexte idolâtre, mais la traduction retient ici son sens concret.
    reason: lexical_alternative
  - marker: b
    text: Ou « forme » ou « ressemblance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: statue sculptée
  rationale: Le terme désigne une image façonnée, notamment par la taille, souvent dans un contexte idolâtre. « Statue sculptée » conserve le sens concret sans introduire directement l’interprétation « idole ».
- source_word: תְּמוּנָה
  choice: représentation
  rationale: Le mot peut désigner une forme ou une ressemblance. « Représentation » exprime naturellement en français l’élargissement de l’interdiction à toute forme reproduisant ce qui se trouve dans les différents domaines énumérés.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Tu ne te feras pas
  rationale: Cette formulation française exprime clairement l’interdiction et conserve le pronom לְךָ, qui indique que l’objet est fait pour soi, sans limiter le propos au simple acte de fabrication.
- source_word: כָּל תְּמוּנָה
  choice: aucune représentation
  rationale: Dans une phrase négative, « aucune » rend naturellement la portée globale de כָּל en français moderne.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: de ce qui est dans les cieux en haut
  rationale: « Les cieux » reflète le pluriel hébreu, tandis que « en haut » maintient le contraste spatial du texte.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: sur la terre en bas
  rationale: « Sur la terre » est idiomatique en français pour les êtres et les choses du domaine terrestre; « en bas » préserve le contraste avec les cieux en haut.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: dans les eaux sous la terre
  rationale: La formulation suit directement l’image cosmologique du texte hébreu tout en restant naturelle et compréhensible.
theological_decisions:
- issue: Portée de l’interdiction des images
  choice: Formuler l’interdiction de fabriquer une statue sculptée ou toute représentation sans ajouter qu’elle serait destinée au culte.
  alternative: Traduire de façon interprétative comme une interdiction de fabriquer des idoles destinées au culte.
  rationale: Le verset 8 interdit la fabrication de l’image, tandis que le verset 9 mentionne explicitement le fait de se prosterner devant elle et de la servir. La traduction conserve cette progression et n’ajoute pas au présent verset une précision théologique tirée du suivant.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier reflète l’adresse hébraïque. La structure tripartite — cieux, terre, eaux — est conservée, ainsi que ses indications verticales.
