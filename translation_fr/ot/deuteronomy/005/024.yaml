base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: fr
  text: 'Et vous avez dit : « Voici, le SEIGNEUR notre Dieu nous a montré sa gloire et sa grandeur, et nous avons entendu sa voix du milieu du feu. Aujourd’hui, nous avons vu que Dieu parle avec l’être humain, et que celui-ci reste en vie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Représente le nom divin YHWH selon la convention française courante, tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
- source_word: הֵן
  choice: Voici
  rationale: Rend l’interjection qui attire l’attention, dans un registre digne et naturel.
- source_word: גָּדְלוֹ
  choice: sa grandeur
  rationale: Correspond directement au nom hébreu désignant la grandeur ou la majesté, en parallèle avec « sa gloire ».
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: Conserve l’image spatiale explicite de la voix entendue depuis l’intérieur du feu.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Exprime ici la valeur générique de l’hébreu, sans limiter le propos à un homme de sexe masculin.
- source_word: וָחָי
  choice: et que celui-ci peut rester en vie
  rationale: Exprime la survie de l’être humain après avoir entendu Dieu, avec un référent français explicite et naturel.
theological_decisions:
- issue: Valeur de l’imparfait יְדַבֵּר dans l’affirmation introduite par כִּי
  choice: Dieu peut parler
  alternative: Dieu parle
  rationale: Le contexte présente comme désormais constatée la possibilité qu’un être humain entende Dieu sans mourir. « Peut parler » rend cette portée modale sans transformer l’énoncé en règle abstraite.
- issue: Portée de וָחָי
  choice: que celui-ci peut rester en vie
  alternative: et il vit
  rationale: Le contexte souligne qu’un être humain peut survivre à la parole divine. La formulation retenue garde ce lien logique sans identifier à tort le sujet à Dieu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression du texte hébreu, tandis que « celui-ci » évite l’ambiguïté référentielle que produirait simplement « il ».
