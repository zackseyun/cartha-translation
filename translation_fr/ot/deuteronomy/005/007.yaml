  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
translation:
  language: fr
  text: Tu n’auras pas d’autres dieux devant moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en dehors de moi ». L’hébreu dit littéralement « devant ma face », expression qui peut évoquer à la fois la présence et l’exclusivité.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Tu n’auras pas
  rationale: La construction hébraïque « être à/pour toi » exprime ici la possession ou la relation. « Tu n’auras pas » est naturel en français et conserve la force de l’interdiction ainsi que l’adresse au singulier.
- source_word: אֱלֹהִים
  choice: dieux
  rationale: Le nom pluriel, qualifié par « autres », désigne ici des divinités rivales. « Dieux » en donne le sens direct et courant.
- source_word: אֲחֵרִים
  choice: d’autres
  rationale: L’adjectif désigne des dieux distincts du Seigneur. « D’autres » est idiomatique et n’ajoute pas la nuance de provenance que comporterait « étrangers ».
- source_word: עַל פָּנָי
  choice: devant moi
  rationale: L’expression signifie littéralement « devant ma face ». « Devant moi » conserve sa dimension de présence et de confrontation sans réduire l’ambiguïté à la seule idée d’exclusivité.
theological_decisions:
- issue: Sens de l’expression finale עַל פָּנָי
  choice: devant moi
  alternative: en dehors de moi
  rationale: L’hébreu peut évoquer la présence (« devant moi, en ma présence ») et, dans cette interdiction, l’exclusivité (« en dehors de moi »). Le texte principal garde la formulation la plus transparente, tandis que la note signale l’autre compréhension possible.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme partenaire de l’alliance. La formulation traditionnelle reste immédiatement compréhensible.
