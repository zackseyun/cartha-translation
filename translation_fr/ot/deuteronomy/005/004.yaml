  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: fr
  text: Yahweh vous a parlé face à face[a] sur la montagne, du milieu du feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « face à face », expression qui désigne ici une adresse personnelle et directe ; voir Deutéronome 4.12, où Israël entend la voix sans voir de forme.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: face à face
  rationale: Cette expression conserve l’idiome hébreu et sa force rhétorique. Dans le contexte, elle exprime une communication personnelle et directe sans imposer l’idée d’une perception visuelle de Dieu.
- source_word: דִּבֶּר
  choice: a parlé
  rationale: Le verbe signifie simplement « parler » ; avec עִמָּכֶם, la tournure française naturelle est « vous a parlé ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: עִמָּכֶם
  choice: vous a parlé
  rationale: La préposition עִם signifie normalement « avec ». En français moderne, « Yahweh vous a parlé » rend naturellement la relation exprimée par la construction hébraïque ; « a parlé avec vous » pourrait suggérer plus nettement un dialogue réciproque.
- source_word: בָּהָר
  choice: sur la montagne
  rationale: La préposition est ici locative, et « sur la montagne » est la formulation française naturelle dans le cadre du Sinaï.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: du milieu du feu
  rationale: Cette formulation rend la valeur précise de מִתּוֹךְ, qui désigne une provenance depuis l’intérieur ou le milieu du feu, tout en restant naturelle et solennelle en français.
theological_decisions:
- issue: Expression anthropomorphique « face à face » dans le récit de la théophanie au Sinaï
  choice: Conserver « face à face » comme expression d’une adresse personnelle et directe, sans préciser qu’il s’agit d’une vision littérale.
  alternative: Traduire de manière interprétative par « directement » ou « personnellement ».
  rationale: Deutéronome 4.12 et 4.15 indique qu’Israël a entendu la voix sans voir de forme. La traduction garde donc l’idiome et la tension du texte, sans transformer celui-ci en affirmation explicite d’une vision de Dieu ni effacer son langage frappant.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des éléments suit étroitement l’hébreu tout en restant naturel. Le nom divin est translittéré « Yahweh » et l’expression idiomatique « face à face » est conservée.
