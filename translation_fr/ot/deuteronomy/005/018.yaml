lexical_decisions:
- source_word: וְ/לֹא
  choice: Et… ne… pas
  rationale: La conjonction וְ relie ce commandement aux précédents; « Et » conserve cette coordination. לֹא avec l’inaccompli exprime ici une interdiction solennelle.
- source_word: תִּנְאָף
  choice: tu ne commettras pas d’adultère
  rationale: Le qal inaccompli à la deuxième personne du masculin singulier de נאף désigne l’adultère. Le futur français employé comme défense rend naturellement la formulation juridique et l’adresse directe au singulier.
theological_decisions:
- issue: Formulation de l’interdiction à la deuxième personne du singulier dans la loi de l’alliance
  choice: Et tu ne commettras pas d’adultère.
  alternative: Tu ne commettras pas d’adultère. / Ne commets pas d’adultère.
  rationale: Le singulier « tu » préserve l’adresse directe du Décalogue. Le futur à valeur injonctive maintient le ton solennel de l’interdiction, tandis que « Et » reflète la coordination explicite de l’hébreu sans résoudre autrement sa portée.
translation_notes:
  register: Français international moderne, clair et digne. « Commettre un adultère » est l’expression courante et précise; le futur injonctif convient au registre solennel du Décalogue.
