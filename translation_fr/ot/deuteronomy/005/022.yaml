  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: fr
  text: Ce sont ces paroles que Yahweh prononça à toute votre assemblée sur la montagne, du milieu du feu, de la nuée et de l’obscurité épaisse, d’une voix forte, et il n’ajouta rien de plus.[a] Il les écrivit sur deux tables de pierre et me les donna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il ne continua pas à parler ». L’expression hébraïque peut signifier qu’il n’ajouta rien de plus ou qu’il ne poursuivit pas son discours.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: דְּבָרִים désigne ici les paroles de l’alliance qui viennent d’être récitées; « paroles » conserve l’accent verbal sans préciser excessivement « commandements ».
- source_word: כָּל קְהַלְכֶם
  choice: toute votre assemblée
  rationale: קָהָל désigne la communauté réunie; « assemblée » est courant, collectif et adapté au contexte.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: du milieu du feu, de la nuée et de l’obscurité épaisse
  rationale: « Du milieu de » rend la valeur spatiale marquée de מִתּוֹךְ; « obscurité épaisse » exprime la densité de עֲרָפֶל.
- source_word: קוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: Littéralement « une grande voix/un grand son »; dans ce contexte de proclamation, cette tournure française naturelle en conserve la puissance sonore.
- source_word: וְלֹא יָסָף
  choice: et il n’ajouta rien de plus
  rationale: Cette lecture exprime que Yahweh n’ajouta rien à ces paroles. La formulation hébraïque pouvant aussi signifier qu’il ne continua pas à parler, cette possibilité est signalée en note.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: deux tables de pierre
  rationale: Rend directement le groupe nominal hébreu dans une formulation française traditionnelle mais toujours intelligible.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: et me les donna
  rationale: Le pronom objet reprend naturellement les éléments écrits et maintient Yahweh comme sujet.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: « Yahweh » préserve le nom personnel représenté par le tétragramme, sans le remplacer par un titre.
- issue: Sens de וְלֹא יָסָף
  choice: il n’ajouta rien de plus
  alternative: il ne continua pas à parler; sa voix ne cessa pas
  rationale: La lecture retenue s’accorde avec la mention de « ces paroles » et des tables qui les consignent, tout en laissant ouverte en note l’autre compréhension plausible de l’expression. La lecture « sa voix ne cessa pas » est grammaticalement possible mais moins probable dans ce contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La construction détachée « Ce sont ces paroles que… » met en relief l’objet initial comme en hébreu. « Nuée » conserve le registre solennel du récit théophanique sans être archaïque. Le marqueur [a] est placé immédiatement après la proposition qu’il explique.
