revisions:
- from: Tu ne te prosterneras pas devant elles et tu ne les serviras pas[a], car moi, Yahvé, ton Dieu, je suis un Dieu jaloux, qui demande compte[b] de la faute des pères aux enfants, jusqu’à la troisième et à la quatrième génération[c], chez ceux qui me haïssent.
  to: Tu ne te prosterneras pas devant elles et tu ne les serviras pas[a], car moi, Yahvé, ton Dieu, je suis un Dieu jaloux, qui demande compte[b] de la faute des pères aux enfants, sur la troisième et sur la quatrième génération[c], de ceux qui me haïssent.
  rationale: La révision remplace « jusqu’à » par la répétition de « sur », plus proche de la syntaxe hébraïque, et rend לְשֹׂנְאָי par « de ceux qui me haïssent ». Elle conserve « demande compte » afin de ne pas réduire פקד à la seule punition, sans imposer une lecture doctrinale de la responsabilité intergénérationnelle.
