source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: fr
  text: Tu ne te prosterneras pas devant elles et tu ne les serviras pas[a], car moi, Yahvé, ton Dieu, je suis un Dieu jaloux, qui demande compte[b] de la faute des pères aux enfants, sur la troisième et sur la quatrième génération[c], de ceux qui me haïssent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne t’inclineras pas devant elles ». Le verbe hébreu désigne l’action de s’abaisser ou de se prosterner en signe de révérence.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui punit » ou « qui appelle à répondre de ». Littéralement, l’hébreu emploie un verbe pouvant signifier « visiter », au sens d’intervenir pour demander compte, notamment par un jugement.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « sur les troisièmes et sur les quatrièmes » ; « génération » est sous-entendu en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: te prosterneras
  rationale: Le verbe désigne concrètement le fait de s’incliner ou de se prosterner en signe de révérence. Ce choix maintient sa distinction d’avec le verbe « servir ».
- source_word: תָעָבְדֵם
  choice: les serviras
  rationale: Dans ce contexte, עבד désigne le service cultuel rendu à des divinités ou à leurs représentations. « Servir » préserve le parallélisme sans fondre les deux verbes dans « adorer ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente le nom divin plutôt que de lui substituer un titre.
- source_word: אֵל קַנָּא
  choice: un Dieu jaloux
  rationale: Dans le cadre de l’alliance, קַנָּא exprime l’exigence d’une fidélité exclusive et le refus du culte de rivaux. « Jaloux » conserve cette force relationnelle.
- source_word: פֹּקֵד
  choice: qui demande compte
  rationale: Le verbe פקד associé à la faute a ici une portée judiciaire. « Demander compte » reste plus large que « punir » tout en rendant intelligible l’idée d’une intervention divine à l’égard de la faute.
- source_word: עֲוֺן
  choice: faute
  rationale: עָוֹן peut évoquer l’acte mauvais, la culpabilité ou ses conséquences. « Faute » conserve une certaine largeur sémantique dans un français naturel.
- source_word: אָבוֹת
  choice: pères
  rationale: Le nom hébreu est explicitement masculin pluriel; « pères » en respecte la forme et le cadre généalogique.
- source_word: עַל בָּנִים
  choice: aux enfants
  rationale: בנים peut désigner les fils ou, dans un contexte de succession générationnelle, les enfants au sens collectif. « Enfants » convient à cette portée.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: jusqu’à la troisième et à la quatrième génération
  rationale: Le français doit expliciter « génération », sous-entendu dans l’expression hébraïque. « Jusqu’à » rend naturellement l’étendue de la succession sans modifier les deux degrés nommés.
- source_word: לְשֹׂנְאָי
  choice: chez ceux qui me haïssent
  rationale: La formule finale caractérise le groupe au sein duquel s’exerce cette rétribution. « Chez » permet de la rattacher aux générations évoquées sans faire disparaître la tension syntaxique du texte.
theological_decisions:
- issue: La jalousie divine
  choice: un Dieu jaloux
  alternative: un Dieu passionné / exigeant une fidélité exclusive
  rationale: « Jaloux » garde l’affirmation forte du texte concernant le droit exclusif de Dieu au culte, tandis qu’une paraphrase risquerait de l’atténuer.
- issue: La portée transgénérationnelle de la faute des pères
  choice: Conserver l’application aux enfants et aux générations suivantes, avec la qualification finale « chez ceux qui me haïssent »
  alternative: Présenter les descendants comme automatiquement punis, quelle que soit leur propre attitude
  rationale: L’hébreu affirme une intervention judiciaire s’étendant aux descendants, mais termine par « ceux qui me haïssent ». La traduction conserve ensemble ces deux éléments sans transformer le verset en formulation doctrinale plus déterministe que le texte.
- issue: La nature exacte de l’action exprimée par פקד
  choice: demande compte
  alternative: punit / fait retomber les conséquences
  rationale: Le terme est judiciaire et peut inclure la punition, mais il n’oblige pas à réduire l’action à ce seul aspect. Le texte principal et la note préservent cette amplitude.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier correspond aux formes hébraïques adressées à Israël comme interlocuteur collectif. La syntaxe conserve la solennité du commandement sans archaïsmes inutiles.
