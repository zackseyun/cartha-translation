id: DEU.5.12
reference: Deuteronomy 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁמ֛וֹר אֶת י֥וֹם הַ/שַׁבָּ֖ת לְ/קַדְּשׁ֑/וֹ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: fr
  text: Observe le jour du sabbat[a] pour le garder saint, comme Yahweh ton Dieu te l’a ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Garde le jour du sabbat ». Le verbe hébreu souligne une observance attentive.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Observe
  rationale: L’infinitif absolu qal a ici une valeur impérative. « Observe » exprime une pratique attentive et fidèle, tout en maintenant le contraste intentionnel avec « Souviens-toi » en Exode 20.8.
- source_word: יוֹם הַשַׁבָּת
  choice: le jour du sabbat
  rationale: Formulation française naturelle qui désigne clairement le jour particulier consacré au repos.
- source_word: לְקַדְּשׁוֹ
  choice: pour le garder saint
  rationale: L’infinitif préfixé de ל exprime le but. Cette formulation indique que le jour doit être maintenu à part et traité comme saint, sans suggérer que l’être humain lui confère une sainteté intrinsèque.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Rend naturellement la comparaison avec le commandement divin antérieur.
- source_word: צִוְּךָ
  choice: te l’a ordonné
  rationale: צוה exprime un ordre faisant autorité. Le passé composé convient au rappel, dans le Deutéronome, d’un commandement déjà donné.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement la désignation d’alliance avec le suffixe masculin singulier de deuxième personne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel révélé à Israël.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse hébraïque à la deuxième personne du singulier. « Sabbat » reste en minuscule selon l’usage français courant.
