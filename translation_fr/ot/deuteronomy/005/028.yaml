  source_fidelity: 'Le texte rend fidèlement la structure et le sens de l’hébreu : Yahvé entend les paroles du peuple pendant qu’il s’adresse à Moïse, puis confirme avoir entendu ce peuple et approuve ce qu’il a dit. « Vos paroles » et « les paroles » constituent une traduction française naturelle de l’idiome hébreu « la voix/le son des paroles », correctement documenté par la note a. « Ils ont bien fait de dire tout ce qu’ils ont dit » préserve la portée approbatrice de הֵיטִיבוּ sans imposer l’interprétation plus étroite « ils ont parlé avec éloquence » ou la qualification doctrinale « ils ont dit vrai ».'
