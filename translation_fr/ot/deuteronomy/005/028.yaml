language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: fr
  text: 'Yahvé entendit vos paroles lorsque vous me parliez[a], puis il me dit : « J’ai entendu les paroles que ce peuple t’a adressées. Ils ont bien fait de dire tout ce qu’ils ont dit[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entendit la voix (ou le son) de vos paroles » ; l’hébreu emploie une tournure auditive.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Ils ont bien parlé dans tout ce qu’ils ont dit. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, qui préserve le nom personnel présent dans le texte hébreu.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: entendit / J’ai entendu
  rationale: Le verbe désigne ici l’audition de paroles prononcées; le passé simple convient au récit et le passé composé au discours direct.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: vos paroles / les paroles
  rationale: Littéralement, l’hébreu emploie une tournure auditive, « la voix (ou le son) de vos paroles ». En français naturel, « entendre les paroles » en transmet le sens sans lourdeur; la tournure source est signalée en note.
- source_word: בְּדַבֶּרְכֶם אֵלָי
  choice: lorsque vous me parliez
  rationale: La préposition avec l’infinitif construit exprime une action contemporaine; cette formulation française en garde clairement la valeur temporelle.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Rend directement le nom singulier accompagné du démonstratif.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: que ce peuple t’a adressées
  rationale: Cette formulation naturelle conserve le lien entre les paroles et leur destinataire, Moïse.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: Ils ont bien fait de dire tout ce qu’ils ont dit
  rationale: Le hiphil de יטב signifie « bien faire »; lié à la proposition portant sur ce qu’ils ont dit, il exprime ici l’approbation de leur prise de parole sans réduire le verbe à une simple qualité d’élocution.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. La translittération française conserve le caractère de nom propre sans lui substituer un titre.
- issue: Portée de l’approbation divine exprimée par הֵיטִיבוּ
  choice: Ils ont bien fait de dire tout ce qu’ils ont dit
  alternative: Tout ce qu’ils ont dit est juste
  rationale: La traduction retenue affirme l’approbation de leur parole tout en évitant d’ajouter une qualification doctrinale comme « juste », absente du lexème.
translation_notes:
  register: Français international moderne, naturel et digne. Le récit emploie le passé simple, tandis que la parole directe emploie le passé composé. Le tutoiement singulier dans la citation reflète l’adresse de Yahvé à Moïse; le pluriel initial vise le peuple.
