  text: You shall not murder[a].
translation:
  language: fr
  text: Tu ne commettras pas de meurtre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Tu ne tueras pas. » Le verbe hébreu employé ici désigne plus précisément le meurtre ou le fait de tuer illégitimement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: La particule de négation introduit ici une interdiction catégorique. En français, la tournure « Tu ne… pas » avec le futur simple restitue naturellement la forme traditionnelle et solennelle du commandement.
- source_word: תִּרְצָח
  choice: commettras de meurtre
  rationale: Le verbe רָצַח désigne ici plus précisément le fait de tuer illégitimement, plutôt que toute mise à mort sans distinction. « Commettre un meurtre » exprime cette portée morale et juridique avec précision en français courant et digne.
theological_decisions:
- issue: Portée de l’interdiction du sixième commandement
  choice: Tu ne commettras pas de meurtre.
  alternative: Tu ne tueras pas.
  rationale: Le verbe hébreu רָצַח est plus précis qu’un verbe général signifiant « tuer ». La traduction retenue interdit le meurtre ou l’homicide illégitime sans transformer le commandement en interdiction explicite de toute forme de mise à mort, distinction présente ailleurs dans la Torah.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur injonctive conserve la force lapidaire du Décalogue; « commettre un meurtre » évite l’ambiguïté trop large de « tuer ».
