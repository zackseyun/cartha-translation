  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: fr
  text: Et maintenant, pourquoi mourrions-nous ? Car ce grand feu nous dévorera. Si nous continuons à entendre la voix de Yahweh[a], notre Dieu, plus longtemps, nous mourrons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH. « Yahweh » est une vocalisation conventionnelle du nom divin.'
    reason: Préciser la forme du tétragramme et la nature conventionnelle de sa vocalisation, sans substituer un titre au nom dans le texte.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la valeur connective de וְ et la valeur temporelle de עַתָּה, tout en introduisant naturellement la conclusion immédiate du peuple.
- source_word: לָמָּה נָמוּת
  choice: pourquoi mourrions-nous ?
  rationale: Le conditionnel français rend naturellement la question rhétorique et la perspective redoutée exprimées par l’inaccompli hébreu.
- source_word: כִּי תֹאכְלֵנוּ
  choice: Car … va nous dévorer
  rationale: כִּי introduit la raison de la crainte. « Dévorer » préserve l’image concrète du verbe אכל, littéralement « manger », employé ici avec le feu comme sujet.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: ce grand feu
  rationale: Formulation française directe qui conserve le nom, l’adjectif et le démonstratif du texte hébreu.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ … עוֹד
  choice: Si nous continuons encore à entendre
  rationale: « Continuer » rend l’emploi idiomatique de יסף avec l’infinitif, tandis que « encore » représente עוֹד et maintient l’insistance du texte sur la prolongation de l’expérience.
- source_word: ק֨וֹל
  choice: la voix
  rationale: Dans le contexte de la parole divine, « voix » est plus précis que le sens plus général de « son ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui représente directement le tétragramme plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend simplement la construction possessive et conserve le langage relationnel du texte.
- source_word: וָמָתְנוּ
  choice: nous mourrons
  rationale: Le futur simple exprime clairement le résultat que le peuple tient pour certain si l’audition de la voix divine se prolonge.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » en conserve la fonction de nom propre et correspond à l’usage français, tandis que « le SEIGNEUR » substituerait un titre traditionnel.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la question rhétorique, l’image forte du feu qui « dévore » et l’insistance hébraïque sur la continuation (« continuons encore »).
