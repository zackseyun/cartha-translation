  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: fr
  text: Tu ne convoiteras pas la femme de ton prochain, et tu ne désireras pas la maison de ton prochain[a], ni son champ, ni son esclave, homme ou femme[b], ni son bœuf, ni son âne, ni rien de ce qui appartient à ton prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « maison » peut aussi désigner la maisonnée ou le domaine; la liste qui suit met ici l'accent sur les biens.
    reason: lexical_alternative
  - marker: b
    text: L'hébreu emploie deux termes distincts, l'un pour un esclave homme et l'autre pour une esclave femme.
    reason: lexical_clarification
lexical_decisions:
- source_word: תַחְמֹד
  choice: convoiteras
  rationale: « Convoiter » exprime un désir répréhensible dirigé vers ce qui appartient à autrui et conserve la portée éthique et juridique du commandement.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: la femme de ton prochain
  rationale: Cette formulation naturelle et digne rend directement la construction hébraïque et maintient le terme traditionnel « prochain ».
- source_word: תִתְאַוֶּה
  choice: désireras
  rationale: « Désirer » préserve la distinction avec חמד (« convoiter »), sans imposer une différence de sens plus précise que ne le permet le texte.
- source_word: בֵּית רֵעֶךָ
  choice: la maison de ton prochain
  rationale: בַּיִת peut désigner une maison, une maisonnée ou un domaine; la liste de biens qui suit favorise ici le sens concret de « maison », tout en laissant subsister une portée plus large.
- source_word: שָׂדֵהוּ
  choice: son champ
  rationale: « Champ » est l'équivalent direct et précis de שָׂדֶה dans ce contexte de biens fonciers.
- source_word: עַבְדּוֹ וַאֲמָתוֹ
  choice: son esclave, homme ou femme
  rationale: La formulation rend explicitement la condition servile et conserve la distinction de sexe portée par les deux termes hébreux, dans un français plus naturel que « son esclave mâle et son esclave femelle ».
- source_word: שׁוֹרוֹ
  choice: son bœuf
  rationale: « Bœuf » est le terme usuel et suffisamment précis pour le bovin de travail visé dans ce contexte juridique.
- source_word: חֲמֹרוֹ
  choice: son âne
  rationale: « Âne » est l'équivalent moderne, clair et courant.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: ni rien de ce qui appartient à ton prochain
  rationale: Cette tournure française naturelle exprime la portée exhaustive de la formule hébraïque.
- source_word: רֵעֶךָ
  choice: ton prochain
  rationale: « Prochain » est précis dans ce contexte d'éthique interpersonnelle et conserve la résonance établie du Décalogue.
theological_decisions:
- issue: Distinction entre les deux verbes d'interdiction
  choice: Rendre חמד par « convoiter » et אוה par « désirer »
  alternative: Employer « convoiter » ou « désirer » dans les deux propositions
  rationale: L'hébreu emploie deux verbes apparentés mais distincts. Les différencier respecte la forme du texte sans prétendre définir exactement leur degré de contraste.
- issue: Désignation des personnes en condition servile
  choice: Employer « son esclave, homme ou femme »
  alternative: « son serviteur et sa servante »
  rationale: Le contexte les énumère parmi les biens de la maisonnée; « esclave » rend donc sans atténuation la condition sociale évoquée, tandis que « homme ou femme » préserve la distinction lexicale de l'hébreu.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement singulier conserve l'adresse individuelle du Décalogue. La répétition de « ton prochain » et la distinction « convoiter/désirer » reproduisent la structure hébraïque sans lourdeur excessive.
