id: DEU.5.32
reference: Deuteronomy 5:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֶתְ/כֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּ/שְׂמֹֽאל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: fr
  text: Vous veillerez donc à agir exactement comme Yahweh votre Dieu vous l’a ordonné ; ne vous écartez ni à droite ni à gauche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne vous écartez ni à droite ni à gauche », expression qui signifie ne dévier en aucune manière de ce que Dieu a ordonné.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: Vous veillerez donc
  rationale: Avec l’infinitif לַעֲשׂוֹת, שׁמר exprime une attention vigilante qui conduit à l’obéissance. « Veiller à » rend naturellement cette nuance exhortative en français. Le connecteur « donc » restitue la valeur contextuelle de וּ־.
- source_word: לַ/עֲשׂוֹת
  choice: à agir
  rationale: עשה désigne ici la mise en pratique du commandement. « Agir » est naturel après « veiller à » et garde la portée générale du verbe hébreu.
- source_word: כַּ/אֲשֶׁר
  choice: exactement comme
  rationale: La locution marque la conformité à ce que Dieu a prescrit ; « exactement comme » fait ressortir cette exigence sans ajouter de contenu.
- source_word: צִוָּה
  choice: vous l’a ordonné
  rationale: Le passé composé présente l’ordre donné comme un acte accompli dont l’obligation demeure. Le pronom « l’ » reprend naturellement la conduite prescrite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que remplacé par un titre.
- source_word: אֱלֹהֵי/כֶם
  choice: votre Dieu
  rationale: 'Le construit avec suffixe de deuxième personne du pluriel exprime directement la relation : « votre Dieu ».'
- source_word: לֹא תָסֻרוּ
  choice: ne vous écartez
  rationale: סור évoque ici le fait de quitter la voie prescrite. « S’écarter » conserve cette image tout en étant idiomatique en français.
- source_word: יָמִין וּ/שְׂמֹאל
  choice: ni à droite ni à gauche
  rationale: La formule désigne toute déviation, dans une direction comme dans l’autre. La construction française avec « ni… ni… » convient à la négation précédente.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve sous forme translittérée, sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et direct. Le futur « vous veillerez » garde la forme verbale hébraïque dans son emploi injonctif, tandis que « veiller à agir » exprime clairement l’obéissance attentive.
