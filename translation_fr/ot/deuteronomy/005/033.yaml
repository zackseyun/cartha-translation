source:
  edition: WLC
  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: fr
  text: Vous suivrez toute la voie que Yahweh, votre Dieu, vous a prescrite, afin que vous viviez, que tout aille bien pour vous et que vous prolongiez vos jours dans le pays dont vous prendrez possession[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont vous hériterez ». Le verbe hébreu peut exprimer aussi bien la prise de possession que l’héritage.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: toute la voie
  rationale: Conserve le singulier et la métaphore covenantale de la voie prescrite, tout en employant avec « suivre » une tournure naturelle en français.
- source_word: צִוָּה
  choice: a prescrite
  rationale: Dans le contexte d’une voie, « prescrire » exprime naturellement l’autorité du commandement divin et sa portée toujours actuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement la formule d’alliance, avec reprise détachée naturelle en français après le nom divin.
- source_word: תֵּלֵכוּ
  choice: vous suivrez
  rationale: « Suivre une voie » restitue naturellement en français l’image hébraïque de la marche comme conduite et obéissance, sans l’aplatir en simple déplacement.
- source_word: לְמַעַן
  choice: afin que
  rationale: Marque clairement la finalité, avec un registre digne et courant.
- source_word: תִּחְיוּן
  choice: vous viviez
  rationale: Rend directement le verbe de vie dans le contexte des bénédictions de l’alliance.
- source_word: וְטוֹב לָכֶם
  choice: que tout aille bien pour vous
  rationale: Expression française idiomatique qui communique le bien-être et la prospérité impliqués par l’hébreu.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: que vous prolongiez vos jours
  rationale: Préserve l’image hébraïque du prolongement des jours tout en restant intelligible en français.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: « Pays » convient au territoire promis dans ce contexte et s’intègre naturellement à l’expression française.
- source_word: תִּירָשׁוּן
  choice: dont vous prendrez possession
  rationale: Exprime concrètement l’acquisition et l’occupation du pays, tout en laissant en note l’autre valeur possible du verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Langage de la possession du pays
  choice: le pays dont vous prendrez possession
  alternative: le pays dont vous hériterez
  rationale: Le verbe ירשׁ peut exprimer la possession comme l’héritage. Le texte principal retient ici le sens territorial concret, tandis que la note préserve l’autre nuance légitime.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le singulier « la voie », l’image du prolongement des jours et la finalité exprimée par « afin que », tout en évitant le calque peu idiomatique « marcher dans toute la voie ».
