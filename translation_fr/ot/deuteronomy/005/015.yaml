source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: fr
  text: Souviens-toi que tu as été esclave au pays d’Égypte et que Yahweh, ton Dieu, t’en a fait sortir d’une main forte[a] et d’un bras étendu. C’est pourquoi Yahweh, ton Dieu, t’a ordonné d’observer le jour du sabbat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « d’une main puissante ». Cette image hébraïque souligne la puissance avec laquelle Yahweh a délivré Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de faire le jour du sabbat »; cette expression signifie ici l’observer ou le respecter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Souviens-toi
  rationale: Dans ce contexte d’exhortation, la forme verbale a une valeur impérative. Le français exprime naturellement cette force sans qu’il soit nécessaire de conserver mécaniquement la conjonction initiale.
- source_word: עֶבֶד
  choice: esclave
  rationale: Le mot désigne ici la condition de servitude imposée à Israël en Égypte; « esclave » en rend clairement la gravité et convient au motif de la libération.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: au pays d’Égypte
  rationale: Cette formulation conserve l’expression concrète de l’hébreu tout en restant naturelle en français.
- source_word: וַיֹּצִאֲךָ ... מִשָּׁם
  choice: t’en a fait sortir
  rationale: Le causatif hébreu exprime que Dieu a fait sortir Israël d’Égypte. Le pronom « en » reprend naturellement le pays d’Égypte et évite le tour plus lourd « t’a fait sortir de là ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main forte
  rationale: Conserve l’image hébraïque et rend directement חֲזָקָה par « forte »; l’expression désigne l’intervention puissante de Dieu.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: et d’un bras étendu
  rationale: Préserve l’image biblique du bras déployé, parallèle à celle de la main forte.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Marque clairement le lien logique entre la délivrance de l’esclavage et le commandement relatif au sabbat.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: d’observer le jour du sabbat
  rationale: Littéralement « faire le jour du sabbat »; en contexte, l’expression signifie le respecter ou l’observer. « Observer » est clair, digne et usuel en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin propre. « Yahweh » en maintient la référence personnelle et l’identité d’alliance sans le remplacer par un titre.
- issue: Statut d’Israël en Égypte exprimé par עֶבֶד
  choice: esclave
  alternative: serviteur
  rationale: Le rappel porte sur la servitude oppressive dont Israël a été délivré. « Esclave » préserve cette portée historique et théologique plus nettement que « serviteur ».
- issue: Rapport entre la délivrance d’Égypte et le sabbat
  choice: Maintien explicite du lien causal par « C’est pourquoi »
  alternative: simple juxtaposition
  rationale: עַל כֵּן présente le commandement du sabbat comme découlant du souvenir de l’esclavage et de la délivrance; la traduction conserve ce lien sans en préciser davantage la portée théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme à une personne collective. Les images de la « main forte » et du « bras étendu » sont conservées, tandis que l’idiome « faire le jour du sabbat » est rendu selon son sens.
