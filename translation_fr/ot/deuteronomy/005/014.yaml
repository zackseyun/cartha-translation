base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: fr
  text: Mais le septième jour est un sabbat consacré à Yahweh ton Dieu. Tu ne feras aucun travail, ni toi, ni ton fils, ni ta fille, ni ton esclave, homme ou femme, ni ton bœuf, ni ton âne, ni aucune de tes bêtes, ni le résident étranger qui vit dans tes villes[a], afin que ton esclave, homme ou femme, se repose comme toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans tes portes », expression désignant les villes ou les communautés placées sous ton autorité.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: sabbat
  rationale: Terme français établi pour l’institution consacrée du septième jour; il ne réduit pas le mot à un repos générique.
- source_word: לַיהוָה
  choice: consacré à Yahweh
  rationale: Le ל marque ici l’appartenance ou la dédicace; cette formulation est naturelle en français et explicite que le jour est voué à Yahweh.
- source_word: מְלָאכָה
  choice: travail
  rationale: Équivalent large et usuel dans la législation du sabbat, sans préciser indûment la catégorie d’activité interdite.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: ton esclave, homme ou femme
  rationale: Le texte distingue les membres asservis masculins et féminins du foyer. Cette formulation conserve leur statut social et la distinction de sexe sans lourde répétition.
- source_word: שׁוֹר / חֲמוֹר / בְּהֵמָה
  choice: bœuf / âne / bêtes
  rationale: « Bœuf » et « âne » désignent naturellement les animaux nommés; « bêtes » évite la redondance peu naturelle de « tout ton bétail » après le bœuf et l’âne tout en couvrant les animaux domestiques.
- source_word: גֵּר
  choice: résident étranger
  rationale: Désigne un non-Israélite établi au sein de la communauté, et non un simple voyageur de passage.
- source_word: בִּשְׁעָרֶיךָ
  choice: dans tes villes
  rationale: Littéralement « dans tes portes »; les portes représentent ici les villes ou communautés relevant de la juridiction locale.
- source_word: לְמַעַן יָנוּחַ
  choice: afin que… se repose
  rationale: Rend clairement la relation de but et le repos accordé aux personnes asservies.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin; « Yahweh » le conserve plutôt que de le remplacer par un titre.
- issue: Statut exprimé par עבד et אמה
  choice: esclave, homme ou femme
  alternative: serviteur et servante
  rationale: Dans ce cadre domestique et juridique, les termes signalent un statut d’asservissement. « Esclave » rend cette réalité sans l’atténuer, tandis que « homme ou femme » préserve la distinction du texte.
- issue: Force de לַיהוָה
  choice: consacré à Yahweh
  alternative: pour Yahweh / à Yahweh
  rationale: La préposition peut évoquer l’appartenance ou la destination. « Consacré à » exprime ces deux nuances dans un français idiomatique sans trancher davantage la nature théologique du sabbat.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement au singulier reproduit l’adresse hébraïque à Israël considéré collectivement. La syntaxe énumérative du commandement est conservée, mais légèrement allégée pour rester naturelle en français.
