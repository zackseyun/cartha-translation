revisions:
- from: Car, parmi tous les êtres de chair, qui a entendu comme nous la voix du Dieu vivant parler du milieu du feu et est resté en vie ?
  to: Car quel être humain[a] a entendu, comme nous, la voix du Dieu vivant parler du milieu du feu et est resté en vie ?
  rationale: La révision remplace un calque français peu naturel par « quel être humain », fidèle au référent de l’idiome hébreu, et ajoute une note pour en conserver la portée littérale. Elle garde les éléments sémantiques essentiels du verset et améliore la lisibilité par l’encadrement de « comme nous » par des virgules.
