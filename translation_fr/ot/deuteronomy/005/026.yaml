  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: fr
  text: Car quel être humain[a] a entendu, comme nous, la voix du Dieu vivant parler du milieu du feu et est resté en vie ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute chair » ; idiome désignant l’humanité mortelle.'
    reason: Préserve l’image et la nuance anthropologique de l’expression hébraïque tout en employant un français naturel dans le texte.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui motive la crainte et la demande du peuple dans le contexte immédiat.
- source_word: מִי כָל בָּשָׂר
  choice: parmi tous les êtres de chair, qui
  rationale: Rend la question rhétorique tout en conservant l’image hébraïque de la chair, qui souligne ici la condition mortelle de l’être humain.
- source_word: שָׁמַע קוֹל
  choice: a entendu ... la voix
  rationale: Le passé composé convient à une expérience accomplie ayant une portée présente; קוֹל désigne la voix puisque Dieu parle.
- source_word: אֱלֹהִים חַיִּים
  choice: du Dieu vivant
  rationale: Malgré la forme morphologiquement plurielle, l’expression hébraïque désigne au singulier le Dieu d’Israël.
- source_word: מְדַבֵּר מִתּוֹךְ הָאֵשׁ
  choice: parler du milieu du feu
  rationale: L’infinitif français s’articule naturellement avec « entendre » et « du milieu » préserve l’idée d’une voix venant de l’intérieur du feu.
- source_word: כָּמֹנוּ
  choice: comme nous
  rationale: Compare directement l’expérience envisagée à celle vécue par Israël, sans ajouter un verbe absent du texte.
- source_word: וַיֶּחִי
  choice: et est resté en vie
  rationale: Exprime naturellement en français le fait d’avoir continué à vivre après cette rencontre, sans employer le plus interprétatif « a survécu ».
theological_decisions:
- issue: Portée anthropologique de כָל בָּשָׂר
  choice: tous les êtres de chair
  alternative: un être humain quelconque
  rationale: Cette formulation conserve l’image de la chair et son évocation de la mortalité humaine, tout en étant plus intelligible en français actuel que le calque « toute chair ».
- issue: Nombre et sens de אֱלֹהִים חַיִּים
  choice: le Dieu vivant
  alternative: les dieux vivants
  rationale: Dans le contexte, l’expression désigne le Dieu unique d’Israël; le pluriel morphologique ne doit donc pas être reproduit comme un pluriel référentiel.
- issue: Sens de וַיֶּחִי
  choice: est resté en vie
  alternative: a survécu
  rationale: La traduction maintient le sens fondamental de « vivre » et la tension liée à la rencontre divine, sans expliciter davantage que l’hébreu la notion de survie.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La tournure « êtres de chair » conserve la texture anthropologique de l’hébreu sans recourir à l’expression vieillie « toute chair ». Aucun marqueur de note n’est nécessaire.
