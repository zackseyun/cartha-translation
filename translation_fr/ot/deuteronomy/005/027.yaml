base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: fr
  text: Toi, approche-toi et écoute tout ce que dira le SEIGNEUR notre Dieu. Tu nous diras tout ce que te dira le SEIGNEUR notre Dieu, et nous écouterons et mettrons cela en pratique.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: Approche-toi, toi
  rationale: L’impératif « approche-toi » rend le mouvement vers la présence divine, tandis que le pronom explicite אַתָּה, emphatique en hébreu, est conservé par « toi ».
- source_word: וּשֲׁמָע
  choice: et écoute
  rationale: שׁמע désigne ici l’action d’entendre attentivement ce que Dieu dira ; « écoute » convient mieux que le simple « entends » dans ce contexte.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: La forme en petites capitales suit la convention française courante pour représenter le tétragramme sans imposer une vocalisation reconstruite.
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: tu nous rapporteras
  rationale: L’expression signifie littéralement « tu nous parleras » ; dans ce contexte de médiation, « rapporteras » exprime naturellement la transmission à l’assemblée sans ajouter une interprétation doctrinale.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: nous l’écouterons et nous le mettrons en pratique
  rationale: La coordination littérale « nous écouterons et nous ferons » signifie écouter le message puis agir conformément à celui-ci. Le double pronom « le » reprend naturellement en français ce que Dieu aura dit.
theological_decisions:
- issue: Médiation de Moïse entre Dieu et le peuple
  choice: Conserver l’adresse emphatique à Moïse et la séquence écouter-transmettre-obéir
  alternative: Paraphraser explicitement Moïse comme médiateur ou interprète
  rationale: Le texte présente une fonction de transmission, mais ne formule pas ici une doctrine générale de la médiation ; la traduction reste donc au plus près de la scène.
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: Yahvé
  rationale: Cette convention identifie le nom divin dans le texte source tout en évitant de trancher la question de sa prononciation ancienne.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « le SEIGNEUR notre Dieu » est maintenue, ainsi que l’emphase inhabituelle de « toi ». Le futur français rend naturellement les formes verbales hébraïques dans le discours direct.
