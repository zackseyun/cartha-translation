  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: fr
  text: 'Va leur dire : « Retournez à vos tentes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif singulier de הלך commande à Moïse d’aller transmettre le message. « Va » est direct et naturel en français.
- source_word: אֱמֹר לָהֶם
  choice: leur dire
  rationale: La construction coordonnée « va, dis-leur » se rend idiomatiquement en français par « va leur dire », sans modifier le contenu de l’ordre.
- source_word: שׁוּבוּ
  choice: Retournez
  rationale: L’impératif pluriel de שוב exprime ici le retour des Israélites à leur lieu de campement après la théophanie.
- source_word: לָכֶם
  choice: à vos
  rationale: Le datif pronominal accompagne le mouvement vers le lieu propre aux destinataires; en français, cette nuance est naturellement portée par le possessif « vos ».
- source_word: לְאָהֳלֵיכֶם
  choice: tentes
  rationale: La traduction concrète « tentes » conserve le cadre historique du campement d’Israël et reste immédiatement compréhensible.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La tournure « Va leur dire » évite le calque peu naturel « Va, dis-leur » tout en conservant les deux impératifs hébreux dans une construction française idiomatique.
