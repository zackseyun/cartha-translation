  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַֽ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מצות/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: fr
  text: mais qui fait preuve d’un amour fidèle envers des milliers, envers ceux qui m’aiment et qui gardent ses commandements[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits et certaines traductions ont « mes commandements », ce qui correspond au discours à la première personne dans le contexte ; le texte hébreu fourni ici porte « ses commandements ».
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: mais qui témoigne
  rationale: Le participe poursuit la description de Dieu et, dans le contexte, marque un contraste avec le jugement évoqué au verset précédent. « Témoigne » exprime naturellement l’exercice concret et continu de cet amour.
- source_word: חֶסֶד
  choice: un amour fidèle
  rationale: Le terme désigne un amour qui se manifeste par la fidélité et la loyauté relationnelle; « amour fidèle » en conserve la force sans employer un vocabulaire confessionnel spécialisé.
- source_word: לַאֲלָפִים
  choice: à des milliers
  rationale: Le texte hébreu dit littéralement « à des milliers » sans préciser « générations ». La traduction maintient cette indétermination au lieu d’ajouter un nom tiré de passages parallèles.
- source_word: לְאֹהֲבַי
  choice: à ceux qui m’aiment
  rationale: Le participe avec suffixe de première personne se rend naturellement en français par une proposition relative, tout en conservant l’objet « me ».
- source_word: וּלְשֹׁמְרֵי
  choice: et qui gardent
  rationale: Avec « commandements », שמר exprime le fait de les observer fidèlement. « Garder » conserve aussi l’image fondamentale du verbe hébreu et reste courant dans le registre biblique français.
- source_word: מצות/ו
  choice: ses commandements
  rationale: La forme fournie porte un suffixe masculin singulier de troisième personne, « ses ». La traduction suit ce texte même si le discours environnant ferait attendre la première personne.
theological_decisions:
- issue: Pronom possessif associé aux commandements
  choice: ses commandements
  alternative: mes commandements
  rationale: Le texte hébreu fourni présente un suffixe de troisième personne. La traduction le reproduit sans harmonisation silencieuse avec « ceux qui m’aiment »; la leçon contextuellement attendue « mes commandements » est signalée en note.
- issue: Référent de « des milliers »
  choice: laisser le groupe nominal sans complément explicite
  alternative: des milliers de générations
  rationale: L’hébreu ne contient ici aucun mot signifiant « générations ». L’ambiguïté est donc préservée plutôt que résolue à partir de formulations parallèles.
translation_notes:
  register: Français international moderne, clair et digne. « Amour fidèle » rend la densité relationnelle de חֶסֶד; la syntaxe demeure fluide tout en préservant la formulation inhabituelle « ses commandements » du texte source.
