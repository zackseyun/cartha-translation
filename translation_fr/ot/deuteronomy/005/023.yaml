  text: וַ/יְהִ֗י כְּ/שָׁמְעֲ/כֶ֤ם אֶת הַ/קּוֹל֙ מִ/תּ֣וֹךְ הַ/חֹ֔שֶׁךְ וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וַ/תִּקְרְב֣וּ/ן אֵלַ֔/י כָּל רָאשֵׁ֥י שִׁבְטֵי/כֶ֖ם וְ/זִקְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: fr
  text: Lorsque vous avez entendu la voix du milieu des ténèbres[a], alors que la montagne était en feu, vous vous êtes approchés de moi, vous tous, les chefs de vos tribus et vos anciens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le son ». Le mot hébreu peut avoir les deux sens, mais « la voix » convient mieux ici puisque Dieu parle depuis les ténèbres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: Quand vous avez entendu
  rationale: La construction introduit la circonstance temporelle du récit. En français, « Quand vous avez entendu » rend naturellement cette transition sans reproduire lourdement la formule hébraïque « et il arriva ».
- source_word: הַקּוֹל
  choice: la voix
  rationale: קוֹל peut désigner une voix ou un son. Ici, le contexte du discours divin favorise « voix », tout en laissant l’autre possibilité en note.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: venant du milieu des ténèbres
  rationale: Cette formulation conserve l’image spatiale de תּוֹךְ, « milieu », et rattache clairement l’origine à la voix.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: tandis que la montagne brûlait dans le feu
  rationale: Le waw est compris comme circonstanciel et le participe décrit une action en cours. « Dans le feu » suit de près la préposition hébraïque tout en restant intelligible.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: vous vous êtes approchés de moi
  rationale: Le verbe קרב exprime ici un mouvement vers Moïse ; la tournure pronominale est naturelle en français.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: vous tous, chefs de vos tribus
  rationale: « Chefs » rend clairement la fonction dirigeante exprimée métaphoriquement par רָאשֵׁי. « Vous tous » explicite que כָּל porte sur l’ensemble des chefs, sans suggérer que tout le peuple s’est avancé.
- source_word: וְזִקְנֵיכֶם
  choice: et anciens
  rationale: Dans ce contexte, זְקֵנִים désigne les responsables reconnus de la communauté. Après « vos tribus », l’absence d’un second possessif évite une répétition pesante sans changer le sens.
