source:
  edition: WLC
  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: fr
  text: Quant à toi, tiens-toi ici auprès de moi, et je te communiquerai le commandement tout entier[a], les prescriptions et les règles de droit que tu leur enseigneras, afin qu’ils les mettent en pratique dans le pays que je leur donne pour qu’ils en prennent possession[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici le singulier : « le commandement tout entier », puis les pluriels « prescriptions » et « règles de droit ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour qu’ils en héritent ». Le verbe hébreu peut désigner le fait d’hériter d’un pays ou d’en prendre possession.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה פֹּה עֲמֹד עִמָּדִי
  choice: Quant à toi, tiens-toi ici auprès de moi
  rationale: « Quant à toi » marque le contraste avec le peuple renvoyé à ses tentes au verset précédent. « Tiens-toi » conserve l’image concrète de עמד, tandis que « auprès de moi » exprime naturellement la proximité indiquée par עִמָּדִי.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: et je te dirai
  rationale: Après l’impératif, le cohortatif exprime la suite voulue de l’action. En français, « je te dirai » introduit naturellement le contenu de la parole divine sans alourdir la phrase.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: le commandement tout entier
  rationale: Cette formulation conserve le singulier collectif de מִצְוָה ainsi que la totalité exprimée par כָּל, tout en restant idiomatique en français.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: « Prescriptions » convient au cadre juridique de l’alliance et demeure distinct de מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles de droit
  rationale: Cette expression rend la dimension juridique de מִשְׁפָּטִים et la distingue clairement des « prescriptions », sans suggérer ici des verdicts particuliers.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: que tu leur enseigneras
  rationale: Le futur français rend la mission donnée à Moïse et s’intègre naturellement à la proposition relative.
- source_word: וְעָשׂוּ
  choice: afin qu’ils les mettent en pratique
  rationale: Le contexte indique que l’enseignement vise l’obéissance. « Mettre en pratique » rend idiomatiquement le verbe עשה appliqué à des commandements, sans réduire son sens à une simple connaissance.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: que je leur donne
  rationale: Le présent conserve la valeur actuelle et imminente du participe נֹתֵן ainsi que la vivacité de la donation divine.
- source_word: לְרִשְׁתָּהּ
  choice: pour qu’ils en prennent possession
  rationale: Cette formulation explicite le but exprimé par לְ et rend concrètement le sens de ירש dans le contexte du don du pays.
theological_decisions:
- issue: Le singulier collectif מִצְוָה
  choice: Conserver le singulier dans « le commandement tout entier ».
  alternative: Employer le pluriel « tous les commandements » ou le terme collectif « toute la Loi ».
  rationale: Le texte hébreu emploie délibérément un singulier avant deux substantifs pluriels. Le conserver respecte la forme du texte et laisse ouverte sa portée collective sans l’identifier explicitement à « la Loi ».
- issue: La distinction entre מִצְוָה, חֻקִּים et מִשְׁפָּטִים
  choice: Rendre les trois termes par « commandement », « prescriptions » et « règles de droit ».
  alternative: Uniformiser en « lois et règles » ou employer « commandement, décrets et jugements ».
  rationale: Le maintien de trois termes distincts respecte la texture juridique du passage sans leur attribuer des catégories théologiques plus précises que ne l’exige le verset.
- issue: La relation entre l’enseignement et l’obéissance
  choice: 'Rendre וְעָשׂוּ par une proposition de but : « afin qu’ils les mettent en pratique ».'
  alternative: 'Coordonner simplement : « et ils les mettront en pratique ».'
  rationale: La proposition finale exprime naturellement que l’enseignement confié à Moïse doit conduire le peuple à agir, tout en évitant de transformer le verset en garantie absolue de son obéissance.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme solennel de la parole divine est conservé, mais les tournures artificiellement archaïques sont évitées. Les termes juridiques restent distincts et compréhensibles.
