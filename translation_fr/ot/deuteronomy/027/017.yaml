  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: fr
  text: 'Maudit soit celui qui déplace la borne de son prochain. Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette formulation naturelle et solennelle rend l’adjectif prédicatif de la formule d’imprécation liée à l’alliance, sans archaïsme excessif.
- source_word: מַסִּיג
  choice: celui qui déplace
  rationale: Le participe désigne la personne caractérisée par cet acte. « Déplace » exprime le recul frauduleux de la limite sans restreindre le sens à l’enlèvement pur et simple.
- source_word: גְּבוּל
  choice: la borne
  rationale: Dans ce contexte foncier et juridique, le mot vise la limite d’une propriété, concrètement signalée par une borne. En français courant, « borne » communique clairement cette réalité.
- source_word: רֵעֵהוּ
  choice: de son prochain
  rationale: Le terme désigne ici un autre membre de la communauté dans un rapport juridique et social. « Son prochain » conserve le suffixe masculin singulier du texte hébreu et convient au registre biblique moderne.
- source_word: וְאָמַר
  choice: Et ... dira
  rationale: Le verbe poursuit la formule liturgique et juridique. Le futur français exprime naturellement la réponse prescrite du peuple.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Traduction directe qui n’ajoute pas « d’Israël », bien que ce soit implicite dans le contexte.
- source_word: אָמֵן
  choice: Amen
  rationale: Réponse liturgique établie en français, elle conserve la valeur d’assentiment communautaire au prononcé de la malédiction.
theological_decisions:
- issue: Formule de malédiction dans le cadre juridique de l’alliance
  choice: Maudit soit celui qui déplace la borne de son prochain
  alternative: Maudit celui qui recule la limite de son prochain
  rationale: La formulation retenue préserve la gravité juridique et communautaire de la malédiction visant l’empiétement frauduleux sur une propriété, tout en restant claire pour un lectorat moderne.
- issue: Participe et suffixes masculins au singulier
  choice: celui qui ... son prochain
  alternative: quiconque ... la borne d’autrui
  rationale: Le texte hébreu présente un cas juridique représentatif au masculin singulier. La traduction garde ce nombre et cette forme sans les transformer en généralisation plurielle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la cadence solennelle d’une proclamation d’alliance. « Borne » est suffisamment précis en français et ne nécessite donc pas de note lexicale.
