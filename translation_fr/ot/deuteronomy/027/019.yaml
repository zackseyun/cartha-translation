source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: fr
  text: 'Maudit soit celui qui porte atteinte au droit de l’étranger résident[a], de l’orphelin[b] et de la veuve ! Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduit l’hébreu gēr, qui désigne un étranger résidant au sein de la communauté israélite.
    reason: cultural_note
  - marker: b
    text: Le terme hébreu peut désigner plus précisément un enfant privé de père.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette formule rend naturellement en français la malédiction d’alliance exprimée par l’adjectif prédicatif hébreu, tout en conservant sa solennité.
- source_word: מַטֶּה
  choice: détourne
  rationale: Le participe hifil de נטה évoque ici l’action de faire dévier ou de fausser le cours du droit. « Détourne » préserve l’image hébraïque tout en restant intelligible dans un contexte judiciaire.
- source_word: מִשְׁפַּט
  choice: le droit
  rationale: Dans ce contexte légal, מִשְׁפַּט désigne le droit ou la justice qui doit être garanti aux personnes vulnérables, plutôt qu’un simple verdict abstrait.
- source_word: גֵּר
  choice: l’étranger résident
  rationale: גֵּר désigne un non-Israélite établi au sein de la communauté. « Étranger résident » conserve cette double idée sans l’assimiler entièrement à une catégorie administrative moderne.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: « Orphelin » est le terme français courant et digne pour cette catégorie sociale vulnérable, même si l’hébreu peut viser plus précisément un enfant privé de père.
- source_word: אַלְמָנָה
  choice: la veuve
  rationale: Équivalent direct et naturel de la catégorie sociale mentionnée dans la formule légale.
- source_word: וְאָמַר כָּל הָעָם
  choice: Et tout le peuple dira
  rationale: Dans cette séquence liturgique, la forme verbale prescrit la réponse collective. Le futur français exprime naturellement cette instruction cérémonielle.
- source_word: אָמֵן
  choice: Amen
  rationale: La translittération française consacrée maintient la réponse liturgique solennelle et son sens d’assentiment.
theological_decisions:
- issue: Rendre la triade des personnes socialement vulnérables sans lui imposer des catégories politiques modernes
  choice: l’étranger résident, l’orphelin et la veuve
  alternative: l’immigré, l’enfant sans père et la veuve
  rationale: La formulation retenue conserve les catégories historiques et juridiques du texte hébreu tout en faisant comprendre la situation particulière du גֵּר et la vulnérabilité commune des trois groupes.
- issue: Exprimer la faute judiciaire condamnée
  choice: détourne le droit de
  alternative: prive de justice / fausse la justice due à
  rationale: « Détourne le droit de » maintient l’image du verbe hébreu et laisse ouverte la manière précise dont le droit est dévoyé, sans limiter la faute à un seul acte ou mécanisme judiciaire.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe conserve la forme liturgique de la malédiction et de la réponse collective. Le vocabulaire juridique reste accessible sans effacer la portée historique des catégories hébraïques.
