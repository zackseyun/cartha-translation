    reason: lexical_alternative
  revision_rationale: 'La révision améliore l’idiome juridique français et la ponctuation, tout en conservant la portée de la formule hébraïque : une malédiction contre celui qui dévoie le droit des personnes vulnérables, suivie de l’assentiment collectif. Les deux notes restent correctement ancrées et conservent les nuances lexicales pertinentes.'
