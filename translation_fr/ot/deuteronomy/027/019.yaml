revisions:
- from: '« Maudit soit celui qui détourne le droit de l’étranger résident[a], de l’orphelin[b] et de la veuve ! » Et tout le peuple dira : « Amen ! »'
  to: 'Maudit soit celui qui porte atteinte au droit de l’étranger résident[a], de l’orphelin[b] et de la veuve ! Et tout le peuple dira : « Amen ! »'
  rationale: 'La révision améliore l’idiome juridique français et la ponctuation, tout en conservant la portée de la formule hébraïque : une malédiction contre celui qui dévoie le droit des personnes vulnérables, suivie de l’assentiment collectif. Les deux notes restent correctement ancrées et conservent les nuances lexicales pertinentes.'
  reviewer_model: gpt-5.6-terra
