review_pass:
  verdict: revise
  source_fidelity: Le sens de la formule de malédiction, de la faute judiciaire et de la réponse collective est bien rendu. « Détourne le droit de » reste toutefois moins idiomatique en français juridique que la formulation retenue en révision. Les guillemets autour de la malédiction ne sont pas nécessaires et ne sont pas motivés par le texte hébreu.
  naturalness: Le registre est solennel et globalement naturel. « Porte atteinte au droit de » est plus clair et plus courant que « détourne le droit de », tout en exprimant l’atteinte au droit légal que le verbe hébreu décrit. La note sur gēr est reformulée dans un français plus naturel et sans catégorie contemporaine inutilement technique.
  terminology: « Étranger résident » rend de manière acceptable le gēr comme personne venue d’ailleurs et établie dans la communauté. « Orphelin », « veuve », « droit » et « Amen » sont appropriés. La note sur l’orphelin conserve utilement la nuance possible de l’hébreu, souvent centrée sur la privation du père.
  issues:
  - severity: low
    issue: Expression juridique légèrement peu naturelle
    rationale: En français, « détourner le droit de quelqu’un » peut être compris de façon imprécise. « Porter atteinte au droit de quelqu’un » exprime clairement la violation ou la dénégation de son droit, sans restreindre indûment la portée de מַטֶּה מִשְׁפָּט.
  - severity: low
    issue: Guillemets étendus à la formule de malédiction
    rationale: Le texte source présente la malédiction comme une formule déclarative, puis rapporte la réponse du peuple. Conserver les guillemets pour « Amen » seul évite de présenter comme discours direct un segment que l’hébreu ne marque pas ainsi.
  - severity: low
    issue: Formulation de la note culturelle
    rationale: « Non-autochtone » est moins naturel dans ce contexte et peut évoquer des catégories modernes. Une définition descriptive du résident venu d’ailleurs est plus claire et plus neutre.
  revised_text: 'Maudit soit celui qui porte atteinte au droit de l’étranger résident[a], de l’orphelin[b] et de la veuve ! Et tout le peuple dira : « Amen ! »'
  revised_footnotes:
