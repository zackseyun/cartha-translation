id: DEU.27.15
reference: Deuteronomy 27:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: fr
  text: '« Maudit soit l’homme[b] qui fabrique une statue sculptée ou une statue coulée[a] — une abomination pour Yahweh, œuvre des mains d’un artisan — et qui la place en secret ! » Tout le peuple répondra : « Amen ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une statue de métal fondu ». Le terme hébreu désigne une représentation obtenue par coulage, souvent en métal.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « l’homme »; le masculin singulier a ici une valeur représentative dans cette formule juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette tournure française naturelle conserve la force solennelle de la formule de malédiction de l’alliance.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le texte hébreu emploie le masculin singulier dans une formule juridique à portée représentative; une note en précise la valeur générique.
- source_word: יַעֲשֶׂה
  choice: fabrique
  rationale: Dans le contexte de la confection d’une image, « fabrique » exprime clairement l’action humaine sans être technique.
- source_word: פֶסֶל
  choice: une statue sculptée
  rationale: Le terme désigne une représentation façonnée par sculpture; « statue sculptée » est concret et compréhensible en français actuel.
- source_word: מַסֵּכָה
  choice: une statue coulée
  rationale: Le mot désigne une représentation obtenue par coulage; la traduction n’ajoute pas explicitement « en métal », absent du texte hébreu.
- source_word: תּוֹעֲבַת יְהוָה
  choice: une abomination pour Yahweh
  rationale: La formulation garde la forte réprobation du terme hébreu et son rapport direct avec Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: œuvre des mains d’un artisan
  rationale: La formulation conserve l’accent sur l’origine purement humaine de l’objet tout en restant digne et naturelle.
- source_word: וְשָׂם בַּסָּתֶר
  choice: et qui la place en secret
  rationale: « Place » rend sobrement l’installation de l’image, tandis que « en secret » exprime sa dissimulation.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: Tout le peuple répondra
  rationale: En français, le verbe « répondre » suffit naturellement à introduire la réponse liturgique prononcée par l’assemblée, sans reproduire lourdement « répondra et dira ».
- source_word: אָמֵן
  choice: Amen
  rationale: La réponse liturgique traditionnelle est conservée sous sa forme française reconnue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme; « Yahweh » préserve le nom propre de l’alliance plutôt que de lui substituer un titre.
- issue: Masculin singulier dans la formule de malédiction
  choice: l’homme
  alternative: quiconque / la personne
  rationale: Le masculin grammatical de l’hébreu est maintenu, avec une note indiquant sa portée représentative, sans restreindre artificiellement l’application de la formule aux seuls hommes.
- issue: Nature de מַסֵּכָה
  choice: statue coulée
  alternative: statue coulée en métal
  rationale: Le procédé de coulage est explicite, mais le mot « métal » ne l’est pas formellement dans ce verset; il est donc signalé en note comme contexte usuel plutôt qu’ajouté au texte.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La citation distingue la malédiction proclamée de la réponse de l’assemblée. Les tirets encadrent les deux appositions décrivant l’image.
