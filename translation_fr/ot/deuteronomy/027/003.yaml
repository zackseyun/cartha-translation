    issue: Verbe « traverser » employé sans complément
    rationale: En français moderne, « lorsque tu traverseras » paraît elliptique de façon peu naturelle. L’hébreu peut laisser implicite ce qui est franchi; « lors de ton passage » permet de maintenir cette implicitation.
