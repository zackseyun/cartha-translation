  variant: modern international French
source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: fr
  text: Tu écriras sur elles toutes les paroles de cette loi[a], lors de ton passage, afin que tu entres dans le pays que Yahweh, ton Dieu, te donne, un pays ruisselant de lait et de miel, comme Yahweh, le Dieu de tes pères[b], te l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de cette instruction ». Le mot hébreu torah peut désigner une instruction aussi bien qu’une loi ; ici, « loi » convient au contexte de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Ou « de tes ancêtres ». L’hébreu dit littéralement « de tes pères », selon une formule d’alliance fréquente dans le Deutéronome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Tu écriras
  rationale: Le parfait qal précédé de la conjonction a ici une valeur injonctive. Le futur français exprime naturellement le commandement dans ce contexte légal.
- source_word: עֲלֵיהֶן
  choice: sur elles
  rationale: Le pronom renvoie aux pierres du verset précédent; le féminin français s’accorde avec « pierres ».
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: toutes les paroles de cette loi
  rationale: « Paroles » conserve le sens concret de דִּבְרֵי. « Loi » convient au cadre d’alliance, tout en signalant en note le sens possible d’« instruction » pour תּוֹרָה.
- source_word: בְּעָבְרֶךָ
  choice: lorsque tu traverseras
  rationale: La préposition avec l’infinitif construit a une valeur temporelle. Le complément implicite est le Jourdain, connu du contexte immédiat.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: afin que tu entres
  rationale: Cette formulation conserve le rapport de but ou de résultat du texte hébreu sans en atténuer la tension logique.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: « Pays » est naturel en français pour le territoire promis, sans perdre la dimension territoriale de אֶרֶץ.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré « Yahweh », et le singulier correspond à l’adresse faite à Israël comme unité collective.
- source_word: נֹתֵן לְךָ
  choice: te donne
  rationale: Le présent français reflète le participe hébreu, qui présente le don comme actuel, imminent et assuré.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: un pays ruisselant de lait et de miel
  rationale: Cette tournure française préserve l’image d’abondance exprimée par le participe זָבַת.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme … te l’a dit
  rationale: « Dit » reste proche du verbe דבר et évite d’expliciter par « promis » une valeur seulement impliquée par le contexte.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: le Dieu de tes pères
  rationale: Cette traduction conserve le masculin explicite ainsi que la formule d’alliance caractéristique du Deutéronome.
- source_word: לָךְ
  choice: te
  rationale: Malgré la forme graphique inhabituelle transmise par la tradition du texte, le contexte indique clairement la deuxième personne du singulier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Rendu de אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: « Tes pères » maintient à la fois le masculin du texte source et la formule traditionnelle de continuité de l’alliance, tandis que l’alternative plus inclusive est indiquée en note.
- issue: Relation exprimée par לְמַעַן אֲשֶׁר
  choice: afin que
  alternative: de sorte que
  rationale: La construction peut couvrir le but et le résultat. « Afin que » suit sa valeur habituelle tout en laissant subsister la tension entre l’inscription de la loi et l’entrée dans le pays.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse à Israël comme collectivité. La formulation conserve les images et les rapports syntaxiques du texte hébreu sans expliciter le Jourdain ni remplacer « dit » par « promis ».
