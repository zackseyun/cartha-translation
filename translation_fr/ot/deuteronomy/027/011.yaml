  text: And on that day Moses commanded the people, saying,
translation:
  language: fr
  text: 'Ce jour-là, Moïse donna cet ordre au peuple :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime ici un commandement revêtu d’autorité. « Donna cet ordre » est naturel en français et introduit clairement les paroles qui suivent.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom משה.
- source_word: אֶת הָעָם
  choice: au peuple
  rationale: עָם désigne collectivement le peuple d’Israël. La construction française requise par « donner un ordre » emploie le complément indirect « au peuple ».
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend explicitement le repère temporel hébreu dans un français idiomatique et actuel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif לֵאמֹר introduit le contenu du commandement donné dans les versets suivants. En français moderne, les deux-points remplissent naturellement cette fonction sans alourdir la phrase par « en disant ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve l’autorité du commandement et la transition vers le discours qui suit, tout en évitant le calque peu naturel « commanda au peuple en disant ».
