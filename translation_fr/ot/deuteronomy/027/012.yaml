  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: fr
  text: 'Voici ceux qui se tiendront sur le mont Garizim pour bénir le peuple, quand vous aurez traversé le Jourdain : Siméon, Lévi, Juda, Issacar, Joseph[a] et Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans cette liste tribale, Joseph représente ici les tribus issues de lui, Éphraïm et Manassé.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici ceux qui
  rationale: Le démonstratif pluriel introduit les tribus désignées; cette tournure est naturelle en français et prépare clairement la proposition relative.
- source_word: יַעַמְדוּ
  choice: se tiendront
  rationale: L’imparfait hébreu a ici une valeur directive dans les instructions de Moïse; le futur français convient naturellement au contexte prescriptif.
- source_word: לְבָרֵךְ
  choice: pour bénir
  rationale: L’infinitif construit avec ל exprime le but de leur positionnement.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne collectivement la communauté d’Israël; « le peuple » est le rendu courant et précis.
- source_word: עַל הַר גְּרִזִים
  choice: sur le mont Garizim
  rationale: « Sur le mont » exprime naturellement la localisation; Garizim est la forme française traditionnelle du toponyme.
- source_word: בְּעָבְרְכֶם
  choice: quand vous aurez traversé
  rationale: La préposition ב avec l’infinitif construit et le suffixe de deuxième personne du pluriel a une valeur temporelle; le futur antérieur marque naturellement l’antériorité de la traversée par rapport à la cérémonie.
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: La forme française usuelle du nom du fleuve suffit sans ajouter « fleuve ».
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: Siméon, Lévi, Juda, Issacar, Joseph et Benjamin
  rationale: Emploi des formes françaises bibliques usuelles des noms; les conjonctions hébraïques répétées sont rendues par la ponctuation française et un « et » final.
theological_decisions:
- issue: Valeur de l’instruction concernant la place et le rôle des tribus
  choice: Le futur « se tiendront » est conservé dans un contexte clairement prescriptif.
  alternative: « devront se tenir »
  rationale: Le contexte indique qu’il s’agit d’une instruction, mais l’hébreu emploie un imparfait et non une forme exprimant explicitement l’obligation; le futur français préserve cette nuance sans transformer l’énoncé en commandement plus explicite.
- issue: Sens de Joseph dans la liste tribale
  choice: Le nom « Joseph » est maintenu dans le texte, avec une note explicative.
  alternative: « les tribus de Joseph » ou « Éphraïm et Manassé »
  rationale: Le texte hébreu nomme explicitement Joseph. Développer ce nom dans le corps du verset ajouterait une interprétation absente de la formulation source.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu tout en évitant le calque; les noms propres suivent les formes françaises bibliques courantes.
