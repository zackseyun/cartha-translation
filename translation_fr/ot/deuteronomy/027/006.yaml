  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: fr
  text: Tu bâtiras l’autel de Yahweh, ton Dieu, avec des pierres entières[a], et tu y offriras des holocaustes à Yahweh, ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierres non taillées ». L’hébreu dit littéralement « pierres entières » ou « complètes » ; « non taillées » tient compte de l’interdiction, au verset 5, d’employer un outil en fer sur elles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: pierres entières
  rationale: L’adjectif שְׁלֵמוֹת désigne directement ce qui est entier ou complet. « Pierres entières » préserve ce sens lexical, tandis que « pierres non taillées » explicite le contexte du verset 5.
- source_word: תִּבְנֶה
  choice: tu bâtiras
  rationale: Dans ce contexte prescriptif, l’inaccompli a une valeur directive. Le futur français exprime naturellement et dignement ce commandement.
- source_word: מִזְבַּח
  choice: autel
  rationale: Équivalent français usuel et précis du terme désignant la structure sacrificielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne du masculin singulier exprime directement la relation possessive et d’alliance.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: et tu y offriras
  rationale: Le hiphil de עלה, avec un objet sacrificiel, signifie offrir. Le pronom adverbial « y » reprend naturellement l’autel.
- source_word: עוֹלֹת
  choice: des holocaustes
  rationale: « Holocauste » est le terme français consacré pour l’offrande entièrement consumée par le feu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל exprime ici la destination ou la dédicace de l’offrande.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Interprétation de שְׁלֵמוֹת
  choice: pierres entières
  alternative: pierres non taillées
  rationale: Le texte dit littéralement que les pierres sont entières ou complètes. L’idée de pierres non taillées est bien étayée par l’interdiction d’employer le fer au verset 5, mais elle reste une explicitation contextuelle et figure donc en note.
translation_notes:
  register: Français moderne, international et digne. Le futur simple conserve la force solennelle de l’instruction. « Bâtir » convient au registre biblique sans être archaïque ; « holocaustes » demeure le terme sacrificiel français précis.
