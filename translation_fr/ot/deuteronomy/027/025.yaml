  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: fr
  text: 'Maudit soit celui qui accepte un pot-de-vin pour tuer un innocent, et tout le peuple dira : « Amen. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Rend naturellement en français la formule de malédiction de l’alliance placée en tête de phrase.
- source_word: לֹקֵחַ שֹׁחַד
  choice: celui qui accepte un pot-de-vin
  rationale: Le participe désigne de manière générale la personne qui reçoit un paiement illicite; « pot-de-vin » est le terme juridique courant et précis.
- source_word: לְהַכּוֹת
  choice: pour faire mourir
  rationale: Dans ce contexte, נכה désigne une atteinte mortelle. La construction peut impliquer que le bénéficiaire du pot-de-vin provoque ou fait commettre la mise à mort, sans imposer qu’il porte lui-même le coup.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: un innocent
  rationale: L’expression hébraïque associe la personne ou la vie au « sang innocent »; en français courant, elle désigne clairement une personne qui ne mérite pas la mort, tandis qu’une note conserve la forme littérale.
- source_word: וְאָמַר כָּל הָעָם
  choice: Et tout le peuple dira
  rationale: Dans ce cadre liturgique, le parfait avec waw prescrit la réponse collective; le futur français convient naturellement.
- source_word: אָמֵן
  choice: Amen
  rationale: Cette affirmation liturgique bien établie se conserve telle quelle en français.
theological_decisions:
- issue: Portée de la formule de malédiction dans le cadre de l’alliance
  choice: Maudit soit celui qui accepte un pot-de-vin pour faire mourir un innocent
  alternative: Maudit soit celui qui reçoit un pot-de-vin pour frapper à mort le sang innocent
  rationale: La formulation retenue garde la force juridique et liturgique de la malédiction sans archaïsme, sans atténuer la gravité du meurtre d’un innocent ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Maudit soit » maintient la solennité de la formule; « pot-de-vin » est clair et courant; la ponctuation souligne l’acclamation liturgique.
