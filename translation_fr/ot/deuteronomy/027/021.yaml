  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: fr
  text: '« Maudit soit l’homme[a] qui couche avec un animal quelconque ! » Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « quiconque couche avec un animal quelconque ». L’hébreu emploie une forme masculine singulière.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Rend la formule solennelle de malédiction de l’alliance sous une forme française naturelle et déclarative.
- source_word: שֹׁכֵב
  choice: l’homme qui couche
  rationale: Le participe masculin singulier est substantivé et le verbe constitue ici un euphémisme sexuel; « coucher avec » conserve ce registre sans explicitation excessive.
- source_word: עִם כָּל בְּהֵמָה
  choice: avec un animal, quel qu’il soit
  rationale: Exprime naturellement en français la valeur distributive de כָּל avec le nom singulier, tout en gardant la portée générale de בְּהֵמָה.
- source_word: וְאָמַר כָּל הָעָם
  choice: Et tout le peuple dira
  rationale: Préserve l’enchaînement cérémoniel et la réponse collective exprimés par le waw suivi de l’accompli.
- source_word: אָמֵן
  choice: Amen
  rationale: Conserve l’affirmation liturgique traditionnelle, claire en français et adaptée au cadre de l’alliance.
theological_decisions:
- issue: Participe substantivé masculin dans une formule juridique de malédiction
  choice: l’homme qui couche
  alternative: quiconque couche / celui qui couche
  rationale: Le masculin singulier hébreu est maintenu plutôt que neutralisé. La note signale que la construction peut aussi se rendre de manière générique en français.
translation_notes:
  register: Français international moderne, solennel et accessible. La ponctuation présente la malédiction comme la proclamation à laquelle le peuple répond; le texte hébreu ne marque pas explicitement les guillemets.
