  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: fr
  text: 'Maudit soit celui qui couche avec sa belle-mère[a] ! Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « a des relations sexuelles avec sa belle-mère ». L’hébreu emploie l’expression « couche avec ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette formule française naturelle et solennelle rend l’adjectif prédicatif qui introduit une malédiction d’alliance.
- source_word: שֹׁכֵב עִם
  choice: couche avec
  rationale: Dans ce contexte, l’expression hébraïque désigne les relations sexuelles. « Coucher avec » conserve l’euphémisme tout en restant clair en français moderne.
- source_word: חֹתַנְתּוֹ
  choice: sa belle-mère
  rationale: Le nom désigne la belle-mère, et le suffixe masculin singulier est rendu par le possessif « sa ».
- source_word: וְאָמַר כָּל הָעָם
  choice: Et tout le peuple dira
  rationale: Le futur français exprime ici la réponse liturgique prescrite, tandis que « tout le peuple » suit sans ajout le texte hébreu.
- source_word: אָמֵן
  choice: Amen
  rationale: La translittération consacrée conserve la réponse liturgique hébraïque et demeure immédiatement compréhensible.
theological_decisions:
- issue: Euphémisme sexuel dans une formule juridique
  choice: « couche avec »
  alternative: « a des relations sexuelles avec »
  rationale: Le choix retenu préserve l’euphémisme conventionnel de l’hébreu sans rendre la faute obscure ni adopter une formulation plus explicite que la source.
- issue: Sujet masculin singulier
  choice: « celui qui »
  alternative: « quiconque »
  rationale: « Celui qui » reflète la forme masculine singulière du participe hébreu et s’intègre naturellement à la formule française de malédiction.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Maudit soit celui qui… » garde le caractère solennel et liturgique du passage; « couche avec » conserve l’euphémisme sexuel de la source.
