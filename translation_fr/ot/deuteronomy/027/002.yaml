base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: fr
  text: Le jour où vous traverserez le Jourdain pour entrer dans le pays que Yahweh, votre Dieu, te donne, tu dresseras pour toi de grandes pierres et tu les enduiras de chaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu les recouvriras d’un enduit de chaux » ; le terme hébreu désigne la chaux ou un enduit à base de chaux employé comme revêtement.
    reason: Alternative lexicale pour שִׂיד, dont le sens couvre la chaux et l’enduit à base de chaux.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם אֲשֶׁר
  choice: Le jour où
  rationale: Cette tournure rend naturellement en français l’expression hébraïque qui introduit une circonstance future, sans conserver le littéralisme lourd « Il arrivera, le jour où ».
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: vous traverserez le Jourdain
  rationale: Le verbe עבר désigne ici le passage d’une rive à l’autre; « traverser le Jourdain » est précis et idiomatique.
- source_word: אֶל הָאָרֶץ
  choice: pour entrer dans le pays
  rationale: La préposition marque la destination. L’ajout idiomatique de « entrer » explicite naturellement en français le mouvement vers le pays sans modifier le sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: נֹתֵן לָךְ
  choice: vous donne
  rationale: Le présent français conserve la valeur actuelle et certaine du participe hébreu.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: vous dresserez pour vous
  rationale: Le hiphil de קום signifie « dresser, ériger ». Le texte passe d’un pluriel visant le peuple à un singulier collectif; « vous » permet de préserver en français cette adresse collective sans imposer un singulier individuel.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: de grandes pierres
  rationale: Expression française courante et digne correspondant directement au syntagme hébreu.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: vous les enduirez de chaux
  rationale: Le verbe évoque l’application d’un revêtement et שִׂיד la chaux ou l’enduit à base de chaux. Cette formulation évite la répétition « enduire d’enduit ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie le tétragramme comme nom personnel. « Yahweh » le conserve explicitement sans lui substituer un titre.
- issue: Alternance entre pluriel et singulier dans l’adresse à Israël
  choice: Maintenir « vous » en français, compris collectivement
  alternative: Employer « tu » dans la seconde moitié du verset
  rationale: L’hébreu commence avec un verbe pluriel puis poursuit avec des formes masculines singulières qui s’adressent à Israël comme unité collective. Le français « vous » garde une lecture collective naturelle sans transformer le commandement en adresse à un individu.
translation_notes:
  register: Français international moderne, clair et digne. Le futur convient aux instructions liées au prochain franchissement du Jourdain. « Pays » conserve ici la portée géographique de אֶרֶץ; « grandes pierres » et « enduire de chaux » restent concrets et accessibles.
