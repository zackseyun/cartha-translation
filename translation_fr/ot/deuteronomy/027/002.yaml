  verdict: revise
  source_fidelity: Le texte rend correctement le franchissement du Jourdain, la destination, le don du pays par Yahweh, les grandes pierres et leur revêtement de chaux. Toutefois, l’hébreu passe du pluriel (« vous traverserez ») au singulier (« tu dresseras… tu les enduiras »). Cette alternance doit être conservée, plutôt que neutralisée par un pluriel français continu.
  naturalness: « Pour vous » après « vous dresserez » est peu naturel en français moderne. Le passage au singulier peut paraître abrupt, mais il reproduit une alternance réelle du texte source et reste intelligible dans une instruction adressée à Israël collectivement.
  terminology: « Yahweh », « le Jourdain », « pays », « grandes pierres » et « chaux » conviennent. « Enduire de chaux » est exact. La note doit employer les formes verbales correspondant au texte révisé et expliciter que l’alternative concerne le matériau de revêtement.
