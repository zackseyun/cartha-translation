  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: fr
  text: Quand vous aurez traversé le Jourdain[a], vous dresserez ces pierres que je vous ordonne aujourd’hui de dresser sur le mont Ébal, et vous les enduirez de chaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traditions textuelles, notamment le Pentateuque samaritain, portent « mont Garizim » au lieu de « mont Ébal ».
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: Quand vous aurez traversé
  rationale: La construction וְהָיָה suivie de בְּ et de l’infinitif construit introduit une circonstance temporelle future. Le futur antérieur exprime naturellement en français l’action qui précède l’érection des pierres.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Le nom propre désigne ici le fleuve; l’usage français courant permet de dire simplement « le Jourdain ».
- source_word: תָּקִימוּ
  choice: vous dresserez
  rationale: Le hiphil de קום signifie ici mettre debout ou ériger. « Dresser » convient aux pierres et reste clair et digne.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: ces pierres
  rationale: Traduction directe qui évite de préciser sans fondement qu’il s’agit de monuments.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: que je vous ordonne de dresser aujourd’hui
  rationale: En français, le complément requis par « ordonner » doit être explicité. La reprise de « dresser » rattache naturellement la relative aux pierres et exprime le sens contextuel sans ajouter une nouvelle action.
- source_word: בְּהַר עֵיבָל
  choice: sur le mont Ébal
  rationale: « Sur » rend naturellement la localisation sur une montagne; le nom est transcrit selon l’usage français.
- source_word: וְשַׂדְתָּ אוֹתָם
  choice: et vous les enduirez
  rationale: Le verbe désigne l’application d’un revêtement. « Enduire » s’associe naturellement au matériau mentionné ensuite.
- source_word: בַּשִּׂיד
  choice: de chaux
  rationale: שׂיד désigne la chaux ou un enduit à base de chaux. « Enduire de chaux » est précis et idiomatique en français.
theological_decisions:
- issue: Nom du lieu en Deutéronome 27.4 selon les traditions textuelles
  choice: mont Ébal
  alternative: mont Garizim
  rationale: Le texte massorétique fourni par la WLC porte « Ébal ». Une tradition textuelle notable, particulièrement le Pentateuque samaritain, porte « Garizim »; cette variante est donc signalée sans modifier le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur antérieur marque clairement l’antériorité de la traversée, tandis que le futur simple rend les commandements qui suivent. La formulation évite le calque lourd « il arrivera que ».
