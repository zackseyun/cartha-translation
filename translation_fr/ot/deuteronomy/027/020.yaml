  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: fr
  text: '« Maudit soit celui qui couche avec la femme de son père[a], car il a découvert le pan de son père[b]. » Et tout le peuple dira : « Amen. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « la femme de son père » peut désigner sa belle-mère, mais l’hébreu n’emploie pas explicitement ce terme.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « le pan de son père ». L’expression est un euphémisme sexuel apparenté à ceux de Lévitique 18.8 et 20.11 ; on peut aussi l’interpréter comme « la nudité de son père ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette formule française naturelle conserve la force juridique et liturgique de la malédiction d’alliance.
- source_word: שֹׁכֵב עִם
  choice: couche avec
  rationale: Expression française courante et digne qui rend l’euphémisme hébreu désignant une relation sexuelle, sans devenir clinique ni familière.
- source_word: אֵשֶׁת אָבִיו
  choice: la femme de son père
  rationale: Rend exactement la relation exprimée en hébreu sans préciser qu’il s’agit nécessairement de sa belle-mère.
- source_word: כִּי
  choice: car
  rationale: Introduit clairement le motif de la malédiction et convient au registre solennel de la proclamation.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: a découvert le pan du vêtement de son père
  rationale: Conserve l’image concrète et l’euphémisme sexuel de l’hébreu, tout en rendant כָּנָף par un équivalent français intelligible dans ce contexte.
- source_word: וְאָמַר כָּל הָעָם
  choice: Et tout le peuple dira
  rationale: Le futur français rend naturellement la réponse prescrite dans cette formule liturgique d’alliance.
- source_word: אָמֵן
  choice: Amen
  rationale: La translittération consacrée préserve la réponse liturgique hébraïque et reste immédiatement compréhensible en français.
theological_decisions:
- issue: Rendu de l’euphémisme sexuel dans une malédiction juridique
  choice: 'Conserver la métaphore : « a découvert le pan du vêtement de son père »'
  alternative: « a découvert la nudité de son père » ou « a déshonoré le lit conjugal de son père »
  rationale: L’expression fait écho aux interdictions sexuelles de la Torah et évoque les droits conjugaux ainsi que l’honneur du père. Le maintien de l’image évite de trancher une nuance discutée de כָּנָף ou de remplacer le texte par une interprétation explicative.
- issue: Identification de « la femme de son père »
  choice: Ne pas la désigner directement comme sa belle-mère
  alternative: « sa belle-mère »
  rationale: Le contexte peut viser une belle-mère, mais l’hébreu dit plus largement « la femme de son père ». La traduction conserve cette formulation et signale l’interprétation possible en note.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les guillemets délimitent la malédiction que les Lévites doivent proclamer ; la réponse collective reste formulée au futur. L’image hébraïque est maintenue dans le texte et brièvement expliquée en note.
