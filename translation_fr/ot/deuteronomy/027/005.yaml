base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: fr
  text: Là, tu bâtiras un autel pour Yahvé[a], ton Dieu, un autel de pierres. Tu n’utiliseras sur elles aucun outil en fer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR ».'
    reason: divine_name
  - marker: b
    text: 'Littéralement : « tu ne brandiras/manieras pas le fer sur elles ». Le « fer » désigne ici un outil en fer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: tu bâtiras
  rationale: Le qatal précédé de la conjonction a ici, dans une suite d’instructions, une valeur injonctive ou future. « Tu bâtiras » conserve le ton solennel de la prescription.
- source_word: שָׁם
  choice: là
  rationale: Adverbe locatif simple renvoyant au lieu indiqué dans le contexte.
- source_word: מִזְבֵּחַ
  choice: autel
  rationale: Équivalent français courant et précis pour un lieu construit destiné aux sacrifices.
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: La préposition ל marque ici la destination ou la consécration de l’autel. « Pour » est naturel en français dans ce contexte.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe masculin singulier exprime la relation personnelle et d’alliance avec le destinataire collectif représenté au singulier.
- source_word: מִזְבַּח אֲבָנִים
  choice: un autel de pierres
  rationale: Cette formulation suit directement la construction hébraïque et souligne la matière de l’autel.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: tu n’utiliseras sur elles aucun outil en fer
  rationale: Le fer désigne par métonymie un instrument en fer. Dans ce contexte, le hifil de נוף évoque l’action de manier ou de faire passer cet instrument sur les pierres. La formulation française rend clairement l’interdiction sans en changer la portée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » représente le nom propre et évite de le remplacer dans le corps du texte par un titre, tandis que la note signale la tradition de lecture « le SEIGNEUR ».
- issue: Nature de l’interdiction concernant le fer
  choice: interdiction d’utiliser un outil en fer sur les pierres
  alternative: tu ne feras pas passer le fer sur elles
  rationale: Le texte hébreu dit littéralement « le fer », mais le contexte indique son emploi comme instrument. La traduction explicite la métonymie tout en conservant en note la forme plus littérale.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme destinataire collectif. « Bâtiras » maintient le registre prescriptif, tandis que « utiliseras » rend immédiatement compréhensible l’interdiction technique.
