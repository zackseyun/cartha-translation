  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: fr
  text: 'Les Lévites prendront la parole et diront d’une voix forte à chaque homme d’Israël[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à chaque Israélite ». L’hébreu dit littéralement « à chaque homme d’Israël » : le masculin singulier y a une portée représentative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: prendront la parole
  rationale: Dans cette formule, ענה introduit une prise de parole solennelle. Le français « prendront la parole » rend naturellement cet emploi sans supposer qu’une réponse verbale précise vient d’être donnée.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: L’hébreu désigne explicitement les Lévites, sans les identifier plus étroitement aux prêtres.
- source_word: וְאָמְרוּ
  choice: et diront
  rationale: אמר est le verbe courant signifiant « dire » ; le futur convient au cadre prescriptif du passage.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: à chaque homme d’Israël
  rationale: Cette formulation conserve le masculin singulier אִישׁ et sa portée représentative, plutôt que de le neutraliser silencieusement.
- source_word: קוֹל רָם
  choice: d’une voix forte
  rationale: Expression française naturelle pour une proclamation publique faite à voix haute, qui garde la solennité de l’hébreu.
theological_decisions:
- issue: Masculin singulier représentatif dans אִישׁ
  choice: à chaque homme d’Israël
  alternative: à chaque Israélite
  rationale: L’hébreu emploie explicitement le nom masculin singulier אִישׁ avec une portée collective ou représentative. Le texte principal en conserve la forme, tandis que la note donne l’équivalent français plus synthétique.
translation_notes:
  register: Français moderne, clair et digne. « Prendront la parole et diront » conserve la double expression hébraïque tout en restant idiomatique. Le deux-points final introduit naturellement les proclamations qui suivent.
