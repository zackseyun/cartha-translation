translation_notes:
  register: Français international moderne, direct et digne. Le futur prescriptif convient au discours législatif sans raideur excessive. « Très clairement » reste compréhensible et préserve, grâce à la note, l’ambiguïté entre lisibilité de l’inscription et explicitation de son contenu.
