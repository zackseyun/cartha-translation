  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: fr
  text: Tu écriras sur les pierres toutes les paroles de cette loi, très clairement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « distinctement » ou « de manière à les rendre claires ». L’expression hébraïque associe un verbe signifiant « rendre clair, expliquer » à un terme qui en renforce le sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Tu écriras
  rationale: Le qal accompli à la 2e personne masculine singulière, précédé de la conjonction, poursuit ici une série d’instructions. Le futur français exprime naturellement cette valeur prescriptive tout en conservant l’adresse au singulier.
- source_word: עַל הָאֲבָנִים
  choice: sur les pierres
  rationale: La préposition עַל signifie normalement « sur ». L’article défini renvoie aux pierres déjà mentionnées dans le contexte.
- source_word: אֵת כָּל דִּבְרֵי
  choice: toutes les paroles
  rationale: Cette formulation conserve le sens distributif de כָּל et le terme concret דְּבָרִים, sans le réduire à de simples dispositions juridiques.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: de cette loi
  rationale: Dans le contexte de l’alliance en Deutéronome, « loi » est un équivalent naturel de תּוֹרָה, tandis que « cette » rend explicitement le démonstratif.
- source_word: בַּאֵר הֵיטֵב
  choice: très clairement
  rationale: בַּאֵר évoque l’action de rendre clair ou d’expliquer, et הֵיטֵב en renforce l’idée. Dans ce contexte d’inscription sur des pierres, « très clairement » exprime de façon concise la manière requise d’écrire, tout en laissant la note signaler la nuance possible de clarification ou d’explication.
