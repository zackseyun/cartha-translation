  text: וַ/יְצַ֤ו מֹשֶׁה֙ וְ/זִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת הָ/עָ֖ם לֵ/אמֹ֑ר שָׁמֹר֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: fr
  text: 'Moïse et les anciens d’Israël donnèrent cet ordre au peuple : « Respectez tout le commandement[a] que je vous donne aujourd’hui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le commandement dans son ensemble » ; le mot hébreu est au singulier, avec un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donnèrent cet ordre
  rationale: Le verbe צוה exprime l’action de commander. Cette tournure française est naturelle et permet de conserver Moïse et les anciens comme sujets conjoints.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: et les anciens d’Israël
  rationale: La coordination hébraïque présente Moïse et les anciens comme sujets conjoints du verbe; « et » préserve cette syntaxe.
- source_word: הָעָם
  choice: au peuple
  rationale: עָם désigne ici le peuple d’Israël dans son cadre national et allianciel; « le peuple » est la formulation française la plus directe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles rapportées et rendent la fonction quotative de לֵאמֹר sans calque pesant comme « en disant ».
- source_word: שָׁמֹר
  choice: Respectez
  rationale: Dans le contexte d’un commandement, שׁמר signifie observer fidèlement ou mettre en pratique. « Respectez » exprime clairement cette obéissance attentive en français courant.
- source_word: כָּל הַמִּצְוָה
  choice: tout le commandement
  rationale: Le substantif hébreu est au singulier et possède ici une portée collective. « Tout le commandement » conserve à la fois le singulier et la construction avec כָּל.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: que je vous donne
  rationale: En français, « donner un commandement » est une expression naturelle. Le présent maintient la valeur actuelle du participe hébreu dans cette adresse.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: « Aujourd’hui » rend directement l’accent temporel de l’hébreu dans un registre moderne.
theological_decisions:
- issue: Nombre de מִצְוָה dans l’instruction relative à l’alliance
  choice: 'singulier collectif : « le commandement »'
  alternative: 'pluriel explicatif : « les commandements »'
  rationale: Le texte hébreu emploie le singulier. Le conserver respecte la manière dont le Deutéronome peut présenter collectivement l’ensemble de l’exigence alliancielle, sans imposer un pluriel interprétatif.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le calque « en disant », maintient Moïse et les anciens comme auteurs conjoints de l’ordre et conserve le singulier collectif de « commandement ».
