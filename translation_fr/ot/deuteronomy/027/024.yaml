  text: אָר֕וּר מַכֵּ֥ה רֵעֵ֖/הוּ בַּ/סָּ֑תֶר וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: fr
  text: 'Maudit soit celui qui frappe son prochain en secret. Et tout le peuple dira : « Amen. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette formule rend naturellement en français la malédiction d’alliance exprimée par le participe passif hébreu, tout en conservant sa solennité liturgique.
- source_word: מַכֵּה
  choice: frappe
  rationale: Le participe de נכה peut désigner un coup violent et, selon le contexte, une atteinte mortelle. « Frappe » conserve cette amplitude sans imposer ici le sens précis de « tue ».
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ désigne ici un autre membre de la communauté ou un semblable. « Son prochain » est clair, digne et traditionnellement reconnaissable en français biblique.
- source_word: בַּסָּתֶר
  choice: en secret
  rationale: L’expression indique que l’acte est commis à l’abri des regards. « En secret » suit de près la forme nominale de l’hébreu et reste idiomatique.
- source_word: וְאָמַר
  choice: Et ... dira
  rationale: Dans cette séquence cérémonielle, le qatal précédé de waw exprime la réponse prescrite du peuple. Le futur français convient à cette instruction liturgique.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette formulation traduit exactement l’expression hébraïque sans ajouter « d’Israël », qui relève du contexte mais n’est pas explicite dans le verset.
- source_word: אָמֵן
  choice: Amen
  rationale: La translittération consacrée en français préserve la réponse liturgique et son sens d’assentiment à la déclaration d’alliance.
theological_decisions:
- issue: Degré de violence exprimé par מַכֵּה
  choice: « frappe », avec maintien de l’ambiguïté entre violence non mortelle et mortelle
  alternative: « abat » ou « tue »
  rationale: נכה possède une gamme de sens allant de frapper à tuer. Même si le contexte de malédiction et le verset suivant suggèrent une violence grave, le texte ne précise pas sans ambiguïté que la victime meurt. « Frappe » évite donc de résoudre silencieusement cette tension lexicale.
translation_notes:
  register: Français international moderne, sobre et solennel. La tournure « Maudit soit celui qui… » conserve la cadence d’une proclamation liturgique; « son prochain » maintient le registre biblique sans être archaïque.
