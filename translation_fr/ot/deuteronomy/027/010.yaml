  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: fr
  text: Tu écouteras donc la voix de Yahweh, ton Dieu, et tu mettras en pratique ses commandements et ses prescriptions, que je te commande aujourd’hui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu obéiras donc à Yahweh, ton Dieu. » L’expression hébraïque « écouter la voix » implique souvent l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: Tu écouteras donc la voix
  rationale: L’expression hébraïque signifie écouter attentivement en vue d’obéir. « Écouter la voix » en conserve l’image et laisse la mise en pratique être explicitée par la proposition suivante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin personnel, plutôt que substitution par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement la construction possessive et l’adresse à Israël au singulier.
- source_word: וְעָשִׂיתָ
  choice: et tu mettras en pratique
  rationale: Rend le sens de faire ou d’accomplir des prescriptions dans un français naturel, tout en distinguant cette action de l’écoute mentionnée auparavant.
- source_word: מִצְוֺתָיו
  choice: ses commandements
  rationale: Terme précis et courant pour les ordres divins dans ce contexte d’alliance.
- source_word: חֻקָּיו
  choice: ses prescriptions
  rationale: Maintient une distinction lexicale avec « commandements » et exprime des règles établies, dans un français moderne.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que je te donne aujourd’hui
  rationale: Formulation française naturelle pour des commandements donnés par Moïse dans le moment présent du discours; « aujourd’hui » préserve l’insistance caractéristique du Deutéronome.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée de l’expression שׁמע בקול
  choice: écouter la voix, avec l’obéissance implicite
  alternative: obéir à
  rationale: La formulation retenue conserve l’image hébraïque et évite de fondre l’écoute et la mise en pratique en une seule idée, puisque la seconde proposition exprime explicitement l’action.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse hébraïque à Israël comme collectivité. La tournure conserve l’image de la voix tout en employant « mettre en pratique » pour une expression idiomatique naturelle.
