  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: fr
  text: '« Maudit celui qui égare un aveugle sur le chemin ! » Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit
  rationale: Adjectif prédicatif ouvrant une formule d’imprécation liée à l’alliance. La tournure elliptique « Maudit celui qui… » reste déclarative, solennelle et naturelle en français.
- source_word: מַשְׁגֶּה
  choice: celui qui égare
  rationale: Le participe hiphil exprime le fait de causer l’égarement. « Égare » conserve ce sens causatif tout en restant idiomatique.
- source_word: עִוֵּר
  choice: un aveugle
  rationale: L’adjectif substantivé est au masculin singulier et désigne ici un individu. « Un aveugle » reproduit ce nombre et ce genre sans ajouter le nom « homme », absent de l’hébreu.
- source_word: בַּדָּרֶךְ
  choice: sur le chemin
  rationale: L’expression a ici un sens spatial concret. « Sur le chemin » rend naturellement la situation d’une personne aveugle que l’on détourne de sa route.
- source_word: וְאָמַר
  choice: Et … dira
  rationale: Dans cette prescription liturgique, le waw suivi de l’accompli a une valeur injonctive ou future. Le futur français exprime la réponse collective prescrite.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette formulation traduit directement le groupe dans son ensemble sans expliciter « d’Israël », qui n’apparaît pas dans le verset.
- source_word: אָמֵן
  choice: Amen
  rationale: La translittération consacrée préserve la réponse liturgique et l’assentiment solennel du peuple.
theological_decisions:
- issue: Forme de la malédiction
  choice: « Maudit celui qui… »
  alternative: « Que celui qui… soit maudit » ou « Maudit soit celui qui… »
  rationale: L’hébreu formule une déclaration solennelle de malédiction plutôt qu’un simple souhait. La tournure elliptique française préserve cette force déclarative.
- issue: Genre de עִוֵּר employé substantivement
  choice: « un aveugle »
  alternative: « une personne aveugle »
  rationale: Le masculin singulier du texte est conservé dans une formulation française naturelle, sans transformer le cas individuel en catégorie abstraite.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase conserve le caractère liturgique de la formule tout en évitant une syntaxe inutilement archaïque.
