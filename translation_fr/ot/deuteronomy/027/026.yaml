  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: fr
  text: 'Maudit soit celui qui ne maintient pas en vigueur les paroles de cette loi en les mettant en pratique[a] ! Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut aussi signifier « confirmer » ou « établir » les paroles de cette loi. Ici, il est lié à l’obéissance concrète : « en les mettant en pratique ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Formule française naturelle et solennelle de malédiction d’alliance, correspondant à l’adjectif prédicatif hébreu.
- source_word: אֲשֶׁר
  choice: celui qui
  rationale: Rend la référence singulière à portée générale sans préciser un genre au-delà de ce qu’exige le français idiomatique.
- source_word: לֹא יָקִים
  choice: ne maintient pas en vigueur
  rationale: Le hiphil de קום peut signifier établir, confirmer ou maintenir. Ici, l’expression évoque le maintien de l’autorité effective de la loi, lié à sa mise en pratique.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: les paroles de cette loi
  rationale: « Paroles » conserve le concret de דִּבְרֵי, tandis que « loi » convient au cadre d’alliance du Deutéronome.
- source_word: לַעֲשׂוֹת אֹתָם
  choice: en les mettant en pratique
  rationale: Exprime naturellement en français le moyen concret de maintenir ces paroles en vigueur, sans réduire יָקִים au simple verbe « obéir ».
- source_word: וְאָמַר כָּל הָעָם
  choice: Et tout le peuple dira
  rationale: Dans cette prescription liturgique, le parfait avec waw a une valeur directive ou performative tournée vers la réponse attendue.
- source_word: אָמֵן
  choice: Amen
  rationale: Conserve l’acclamation liturgique traditionnelle et sa force d’assentiment collectif.
theological_decisions:
- issue: Portée de l’obligation d’alliance dans יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: La malédiction vise celui qui ne maintient pas les paroles de la loi en vigueur par une obéissance concrète.
  alternative: La malédiction viserait seulement celui qui ne confirme ou ne ratifie pas publiquement la loi.
  rationale: L’infinitif « en les mettant en pratique » relie explicitement le maintien ou la confirmation de la loi à son accomplissement, tout en préservant les deux éléments de l’hébreu.
- issue: Référence générique de אֲשֶׁר
  choice: celui qui
  alternative: quiconque
  rationale: « Celui qui » correspond à la construction hébraïque au singulier représentatif et reste naturel dans une formule solennelle française.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « maintient en vigueur » préserve la nuance juridique et communautaire du verbe sans effacer son lien avec l’obéissance pratique. Ponctuation expressive adaptée à la proclamation liturgique.
