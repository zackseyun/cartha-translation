  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: fr
  text: 'Moïse et les prêtres lévites parlèrent alors à tout Israël en ces termes : « Fais silence et écoute[a], Israël ! Aujourd’hui, tu es devenu un peuple appartenant à Yahweh, ton Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Sois attentif et écoute ». L’impératif hébreu peut insister soit sur le silence, soit sur l’attention soutenue.
    reason: lexical_alternative
  - marker: b
    text: Litt. « un peuple pour Yahweh, ton Dieu » ; ou « un peuple de Yahweh, ton Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parlèrent alors
  rationale: Le waw narratif fait progresser le récit. Le pluriel français s’impose avec le sujet composé « Moïse et les prêtres lévites », tandis que « alors » marque naturellement la succession.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  rationale: Cette expression étroitement appositive désigne les prêtres identifiés comme lévites. « Prêtres lévites » est concis, naturel en français et évite d’introduire une distinction absente du texte.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette tournure française courante conserve la portée collective et nationale de l’expression hébraïque.
- source_word: הַסְכֵּת
  choice: Fais silence
  rationale: Cet impératif rare appelle probablement au silence attentif. La traduction garde son sens concret, tandis qu’une note signale la nuance possible d’attention soutenue.
- source_word: וּשְׁמַע
  choice: et écoute
  rationale: « Écoute » exprime clairement en français moderne l’impératif de réception attentive porté par שמע.
- source_word: הַיּוֹם הַזֶּה
  choice: Aujourd’hui
  rationale: C’est l’équivalent français actuel et direct de la locution déictique « ce jour-ci ».
- source_word: נִהְיֵיתָ לְעָם
  choice: tu es devenu un peuple
  rationale: Le verbe au masculin singulier s’adresse collectivement à Israël. Le tutoiement singulier préserve cette rhétorique, et « un peuple » rend l’indétermination de לְעָם sans donner à « peuple » un sens excessivement politique.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Avec היה suivi de ל, la formule exprime une relation d’appartenance ou de destination covenantielle. « Pour Yahweh » reste proche de la forme hébraïque; la note explicite la nuance possible d’appartenance.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le possessif singulier correspond à l’adresse collective d’Israël au masculin singulier.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Adresse collective d’Israël au singulier
  choice: Fais… écoute… tu es devenu… ton Dieu
  alternative: Faites… écoutez… vous êtes devenus… votre Dieu
  rationale: Tous les impératifs, le verbe et les suffixes concernés sont au masculin singulier en hébreu. Le « tu » français maintient Israël comme personne collective et préserve la rhétorique de l’alliance.
- issue: Valeur de ל dans נִהְיֵיתָ לְעָם לַיהוָה
  choice: un peuple pour Yahweh
  alternative: un peuple appartenant à Yahweh
  rationale: La formulation principale conserve la concision et la structure de l’hébreu sans trancher entièrement entre destination, relation et appartenance; l’autre lecture est donnée en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le passé simple convient à la narration biblique soutenue sans archaïsme marqué. L’adresse à Israël reste au singulier (« tu »), conformément aux formes hébraïques. Les marqueurs [a] et [b] sont placés exactement aux endroits auxquels se rapportent leurs notes.
