  to: 'Moïse et les prêtres lévites parlèrent alors à tout Israël en ces termes : « Fais silence et écoute[a], Israël ! Aujourd’hui, tu es devenu un peuple appartenant à Yahweh, ton Dieu[b]. »'
  rationale: La révision limitée de « pour Yahweh » en « appartenant à Yahweh » évite un calque français susceptible de déplacer le sens tout en traduisant la relation d’alliance indiquée par l’hébreu. La note [b] conserve la formulation littérale ainsi qu’une possibilité française concise. Aucun autre changement n’est nécessaire.
