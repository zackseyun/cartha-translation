source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: fr
  text: 'Maudit soit celui qui couche avec sa sœur, fille de son père ou fille de sa mère. Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Cette formule rend naturellement en français la malédiction d’alliance exprimée par l’adjectif prédicatif hébreu, tout en conservant sa force solennelle.
- source_word: שֹׁכֵב עִם
  choice: couche avec
  rationale: L’expression française désigne clairement les relations sexuelles et correspond à l’euphémisme hébreu sans adopter un registre clinique ou familier.
- source_word: אֲחֹתוֹ
  choice: sa sœur
  rationale: Équivalent direct du terme de parenté muni du suffixe masculin singulier.
- source_word: בַּת אָבִיו
  choice: fille de son père
  rationale: La formulation conserve l’apposition juridique hébraïque et précise la parenté par le père sans ajouter d’interprétation.
- source_word: אוֹ
  choice: ou
  rationale: La conjonction disjonctive marque l’autre possibilité de filiation.
- source_word: בַת אִמּוֹ
  choice: fille de sa mère
  rationale: Le parallélisme avec « fille de son père » préserve la cadence et l’explicitation juridique de l’hébreu.
- source_word: וְאָמַר
  choice: Et … dira
  rationale: Le futur français exprime naturellement la réponse liturgique prescrite dans la série de malédictions.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Traduction directe, sans développer le référent en « peuple d’Israël » ni le reformuler en « assemblée ».
- source_word: אָמֵן
  choice: Amen
  rationale: La translittération consacrée conserve la portée liturgique et l’affirmation solennelle du terme hébreu.
theological_decisions:
- issue: Portée et formulation de l’interdit relatif à l’inceste
  choice: Conserver « sa sœur », puis la préciser par « fille de son père ou fille de sa mère ».
  alternative: Limiter explicitement le sens à une demi-sœur, ou élargir par une paraphrase telle que « toute proche parente considérée comme sa sœur ».
  rationale: Le texte définit la sœur par la filiation paternelle ou maternelle. La traduction garde cette formulation sans la restreindre aux seules demi-sœurs ni l’élargir au-delà de l’hébreu.
- issue: Sujet masculin générique
  choice: « celui qui … sa sœur »
  alternative: « l’homme qui … sa sœur »
  rationale: Le participe hébreu est au masculin singulier. « Celui qui » conserve ce trait grammatical et la relation exprimée par le possessif, sans ajouter le nom « homme » absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique et liturgique de l’hébreu est préservée sans lourdeur archaïque. « Couche avec » reste intelligible et solennel dans ce contexte; « Amen » reçoit un point d’exclamation pour marquer la réponse publique, sans modifier son contenu.
