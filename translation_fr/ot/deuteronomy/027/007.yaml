source:
  edition: WLC
  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: fr
  text: Tu offriras des sacrifices de paix[a] et tu mangeras là ; tu te réjouiras devant Yahweh, ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Tu offriras
  rationale: Dans ce contexte rituel, זבח désigne l’accomplissement d’un sacrifice. « Offriras » donne en français une formulation naturelle avec « sacrifices », sans l’inutile lourdeur de « sacrifieras des sacrifices ».
- source_word: שְׁלָמִים
  choice: sacrifices de paix
  rationale: שְׁלָמִים désigne une catégorie de sacrifices liée à la paix, au bien-être et à un repas partagé. « Sacrifices de paix » est une désignation française établie ; les autres nuances légitimes sont conservées en note.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: et tu mangeras là
  rationale: La traduction conserve le verbe sans lui ajouter un complément d’objet absent de l’hébreu, ainsi que l’adverbe de lieu שָׁם, « là ».
- source_word: וְשָׂמַחְתָּ
  choice: tu te réjouiras
  rationale: שׂמח exprime ici la joie célébrée dans le cadre de l’adoration ; « se réjouir » en garde la force festive et cultuelle.
- source_word: לִפְנֵי
  choice: devant
  rationale: Dans ce contexte cultuel, לִפְנֵי signifie « devant », avec l’idée d’être en présence de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe hébreu de deuxième personne masculine singulière est explicitement rendu, conformément à l’adresse collective au singulier faite à Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance au lieu de lui substituer un titre.
- issue: Désignation des שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion ; sacrifices de bien-être
  rationale: Il s’agit du nom d’une catégorie sacrificielle, non d’une affirmation doctrinale limitée à un sentiment intérieur. Le choix principal est traditionnel et reconnaissable, tandis que la note préserve les autres dimensions du terme.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule allège la succession des coordinations hébraïques tout en conservant les trois actions prescrites. Le tutoiement singulier respecte l’adresse hébraïque à Israël.
