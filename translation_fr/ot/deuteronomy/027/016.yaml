  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: fr
  text: 'Maudit soit celui qui déshonore[a] son père ou sa mère ! Et tout le peuple dira : « Amen ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « traite comme une personne sans importance », « méprise » ou « traite avec dédain ». Le verbe hébreu exprime le fait de considérer quelqu’un comme insignifiant ou méprisable.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maudit soit
  rationale: Le participe passif introduit une formule de malédiction liée à l’alliance. « Maudit soit » restitue naturellement en français sa force solennelle et liturgique.
- source_word: מַקְלֶה
  choice: déshonore
  rationale: Le verbe signifie littéralement traiter comme léger, sans importance, et donc avec mépris. « Déshonore » exprime clairement la portée sociale et morale de l’acte sans le réduire à un sentiment intérieur ou à une parole particulière.
- source_word: אָבִיו וְאִמּוֹ
  choice: son père ou sa mère
  rationale: L’hébreu coordonne formellement les deux parents par « et », mais la portée distributive de la formule vise toute personne qui déshonore l’un ou l’autre. En français juridique courant, « ou » rend ce sens sans exclure le cas où les deux sont concernés.
- source_word: וְאָמַר כָּל הָעָם
  choice: Et tout le peuple dira
  rationale: La coordination fait avancer la séquence liturgique. Le futur « dira » convient à la prescription de la réponse collective et conserve le simple « tout le peuple » du texte.
- source_word: אָמֵן
  choice: Amen
  rationale: La translittération consacrée préserve l’acclamation solennelle par laquelle le peuple ratifie la malédiction.
theological_decisions:
- issue: Nature de l’offense envers les parents
  choice: déshonore
  alternative: traite avec légèreté ; méprise ; traite avec dédain
  rationale: Le verbe hébreu évoque le fait de considérer quelqu’un comme léger ou sans importance. « Déshonore » maintient le lien avec le devoir d’honorer ses parents tout en évitant de limiter l’offense au mépris intérieur, à l’insulte verbale ou à un acte précis.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Maudit soit celui qui… » conserve la solennité de la formule d’alliance, tandis que la ponctuation souligne la réponse liturgique du peuple.
