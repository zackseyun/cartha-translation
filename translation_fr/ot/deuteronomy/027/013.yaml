source:
  edition: WLC
  text: וְ/אֵ֛לֶּה יַֽעַמְד֥וּ עַל הַ/קְּלָלָ֖ה בְּ/הַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְ/אָשֵׁ֔ר וּ/זְבוּלֻ֖ן דָּ֥ן וְ/נַפְתָּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: fr
  text: 'Et voici ceux qui se tiendront sur le mont Ébal pour la malédiction[a] : Ruben, Gad, Aser, Zabulon, Dan et Nephtali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour prononcer la malédiction » ou « pour maudire ».
    reason: 'Alternative lexicale : l’expression hébraïque désigne l’association à la malédiction sans préciser explicitement l’action accomplie.'
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Et voici ceux qui
  rationale: La conjonction et le démonstratif introduisent le second groupe en parallèle et en contraste avec celui du verset précédent. « Et voici ceux qui » assure un enchaînement naturel en français.
- source_word: יַעַמְדוּ
  choice: se tiendront
  rationale: L’imparfait hébreu exprime ici l’action future prescrite par Moïse. « Se tiendront » convient au cadre cérémoniel sans alourdir la formulation.
- source_word: עַל הַקְּלָלָה
  choice: pour la malédiction
  rationale: Dans ce cadre rituel, עַל associe ces tribus à la malédiction, en parallèle avec la bénédiction du verset précédent. Cette formulation concise préserve l’indétermination du texte quant à l’action exacte.
- source_word: בְּהַר עֵיבָל
  choice: sur le mont Ébal
  rationale: « Sur le mont » rend naturellement la localisation exprimée en hébreu et suit l’usage français courant pour ce toponyme.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française biblique usuelle du nom de la tribu.
- source_word: גָּד
  choice: Gad
  rationale: Forme française biblique usuelle du nom de la tribu.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forme française biblique traditionnelle et largement intelligible du nom de la tribu.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française biblique usuelle du nom de la tribu.
- source_word: דָּן
  choice: Dan
  rationale: Forme française biblique usuelle du nom de la tribu.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française biblique usuelle du nom de la tribu.
theological_decisions:
- issue: Fonction rituelle des tribus par rapport à la malédiction
  choice: pour la malédiction
  alternative: pour prononcer la malédiction ; pour maudire
  rationale: L’hébreu ne répète pas explicitement un verbe tel que « prononcer ». Le contexte des deux montagnes implique une participation cérémonielle, mais la traduction principale conserve la concision et l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle. Les noms propres suivent les formes françaises bibliques usuelles.
