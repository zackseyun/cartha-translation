  text: וְ/לִ/זְבוּלֻ֣ן אָמַ֔ר שְׂמַ֥ח זְבוּלֻ֖ן בְּ/צֵאתֶ֑/ךָ וְ/יִשָּׂשכָ֖ר בְּ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: fr
  text: 'Au sujet de Zabulon, il dit : « Réjouis-toi, Zabulon, quand tu sors[a], et toi, Issacar, dans tes tentes ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tes sorties ». L’expression hébraïque peut désigner le moment où Zabulon sort ou, plus largement, le domaine de ses activités et de sa prospérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: Au sujet de Zabulon
  rationale: La préposition introduit la bénédiction qui concerne Zabulon. Cette formulation est naturelle en français et conserve la fonction de la formule hébraïque.
- source_word: אָמַר
  choice: il dit
  rationale: Rendu simple et direct du verbe אמר dans une formule d’introduction au discours.
- source_word: שְׂמַח
  choice: Réjouis-toi
  rationale: L’impératif singulier s’adresse à la tribu personnifiée et garde le ton solennel de la bénédiction.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et largement reconnue du nom tribal.
- source_word: בְּ/צֵאתֶךָ
  choice: quand tu sors
  rationale: Le ב préfixé à l’infinitif peut exprimer la circonstance, « quand tu sors ». Cette tournure est naturelle en français tout en conservant l’image générale de la sortie, sans préciser indûment s’il s’agit de voyages, de commerce ou d’autres activités.
- source_word: וְ/יִשָּׂשכָר
  choice: et toi, Issacar
  rationale: L’ajout idiomatique de « toi » indique clairement en français que le second membre s’adresse directement à Issacar, comme le suppose le parallélisme hébreu.
- source_word: בְּ/אֹהָלֶיךָ
  choice: dans tes tentes
  rationale: Le pluriel concret de l’hébreu est conservé, ainsi que son contraste avec le fait de sortir.
