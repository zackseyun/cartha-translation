id: DEU.33.11
reference: Deuteronomy 33:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: fr
  text: 'Bénis, Yahweh, sa force[a],

    et agrée l’œuvre de ses mains.

    Brise les reins[b] de ceux qui se dressent contre lui

    et de ceux qui le haïssent,

    afin qu’ils ne se relèvent plus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses ressources », « sa richesse » ou « son armée »; le terme hébreu peut désigner la force, les biens ou la puissance militaire.
    reason: lexical_alternative
  - marker: b
    text: Les « reins » représentent ici la vigueur ou la puissance.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: Bénis
  rationale: Impératif adressé à Yahweh. « Bénis » rend directement le verbe sans expliciter par « fais prospérer » un effet seulement implicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel, plutôt que remplacement par un titre.
- source_word: חֵילוֹ
  choice: sa force
  rationale: חַיִל peut désigner la force, les ressources, la richesse ou la puissance militaire. « Sa force » conserve ici la portée la plus large; les autres sens sont signalés en note.
- source_word: וּפֹעַל יָדָיו
  choice: l’œuvre de ses mains
  rationale: Expression concrète désignant son travail ou ce qu’il accomplit; la formulation française préserve l’image hébraïque.
- source_word: תִּרְצֶה
  choice: agrée
  rationale: Le verbe exprime l’accueil favorable ou l’approbation divine. « Agrée » convient au contexte du service lévitique tout en restant concis et digne.
- source_word: מְחַץ
  choice: Brise
  rationale: L’impératif exprime un coup qui écrase ou fracasse. « Brise » conserve la violence et la brièveté poétiques.
- source_word: מָתְנַיִם
  choice: les reins
  rationale: Équivalent français traditionnel et intelligible de l’image corporelle hébraïque, où les reins représentent le siège de la vigueur.
- source_word: קָמָיו
  choice: ceux qui se dressent contre lui
  rationale: Préserve l’image verbale de קום, « se lever, se dresser », plutôt que de la réduire au nom abstrait « adversaires ».
- source_word: וּמְשַׂנְאָיו
  choice: ceux qui le haïssent
  rationale: Rend directement le participe et maintient l’hostilité personnelle exprimée par l’hébreu.
- source_word: מִן יְקוּמוּן
  choice: afin qu’ils ne se relèvent plus
  rationale: 'La tournure hébraïque elliptique exprime le résultat souhaité du coup: que les ennemis ne se relèvent pas. « Plus » restitue naturellement en français la valeur contextuelle de non-relèvement définitif.'
theological_decisions:
- issue: Référent des pronoms singuliers « sa », « ses » et « lui »
  choice: Les pronoms renvoient à Lévi, immédiatement visé par la bénédiction des versets 8 à 11.
  alternative: Ils peuvent être compris plus largement comme visant le serviteur sacerdotal ou le ministère représentatif de Lévi.
  rationale: Le contexte immédiat favorise Lévi. Le maintien des pronoms singuliers respecte la forme hébraïque sans imposer dans le texte une identification plus étroite ou plus large.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébraïque est conservé par la disposition en lignes. « Agrée » apporte une légère élévation de registre adaptée à une bénédiction sacerdotale, sans archaïsme excessif.
