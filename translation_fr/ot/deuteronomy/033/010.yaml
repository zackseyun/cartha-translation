  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: fr
  text: 'Ils enseigneront tes prescriptions à Jacob

    et ta loi[a] à Israël ;

    ils placeront l’encens devant toi[b]

    et l’offrande entièrement consumée sur ton autel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton enseignement » pour « ta loi » (תּוֹרָה).
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans ton nez » ou « dans ta narine » : expression anthropomorphique évoquant l’encens présenté devant Dieu.'
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: ils enseigneront
  rationale: Le hifil de ירה signifie couramment « enseigner, instruire », notamment dans un contexte sacerdotal et juridique.
- source_word: מִשְׁפָּטֶיךָ
  choice: tes décisions
  rationale: מִשְׁפָּט désigne ici les décisions ou prescriptions divines. « Décisions » conserve la dimension juridique sans employer un terme français vieilli.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: La préposition ל marque naturellement le destinataire de l’enseignement et maintient le parallélisme avec « à Israël ».
- source_word: וְתוֹרָתְךָ
  choice: et ta loi
  rationale: תּוֹרָה peut désigner l’enseignement aussi bien que la loi; dans ce contexte d’obligations de l’alliance, « loi » rend clairement sa portée juridique, tandis que l’autre possibilité est signalée en note.
- source_word: לְיִשְׂרָאֵל
  choice: à Israël
  rationale: Rendu direct de ל, en parallèle poétique avec « à Jacob ».
- source_word: יָשִׂימוּ
  choice: ils placeront
  rationale: שׂים signifie « mettre, placer ». « Placer » convient au geste cultuel et garde un registre digne.
- source_word: קְטוֹרָה
  choice: l’encens
  rationale: קְטוֹרָה désigne l’encens offert dans le culte; le nom français suffit sans explicitation supplémentaire dans le corps du texte.
- source_word: בְּאַפֶּךָ
  choice: devant toi
  rationale: Littéralement « à ton nez/à ta narine », cette expression anthropomorphique décrit l’encens présenté à Dieu. « Devant toi » transmet naturellement la relation spatiale et cultuelle sans la confondre avec la colère.
- source_word: וְכָלִיל
  choice: et l’offrande entièrement consumée
  rationale: כָּלִיל désigne une offrande brûlée tout entière. Cette formulation explicite sobrement le caractère complet de la combustion sans imposer un nombre absent de la forme hébraïque.
- source_word: עַל מִזְבְּחֶךָ
  choice: sur ton autel
  rationale: Traduction directe et naturelle de עַל מִזְבְּחֶךָ dans le contexte sacrificiel.
theological_decisions:
- issue: Portée de תּוֹרָה dans le cadre de l’alliance
  choice: ta loi
  alternative: ton enseignement
  rationale: « Loi » conserve ici la force juridique liée au rôle sacerdotal d’enseignement, mais « enseignement » reste une possibilité lexicale authentique, préservée en note.
- issue: Expression anthropomorphique בְּאַפֶּךָ
  choice: devant toi
  alternative: à ton nez / à ta narine
  rationale: Le littéralisme serait obscur en français moderne et pourrait détourner le lecteur vers la notion de colère. La traduction choisie exprime l’encens présenté en présence de Dieu, tandis que la forme concrète de l’hébreu est documentée en note.
- issue: Nombre et nature de כָּלִיל
  choice: l’offrande entièrement consumée
  alternative: les holocaustes / une offrande entièrement consumée
  rationale: 'Le substantif singulier peut avoir une valeur générique ou collective. La formulation retenue garde cette ouverture et met en avant le trait lexical certain : l’offrande est consumée tout entière.'
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique Jacob/Israël est conservé sur des lignes distinctes. Les termes techniques inutilement opaques sont évités; « offrande entièrement consumée » reste compréhensible tout en rendant précisément le vocabulaire sacrificiel.
