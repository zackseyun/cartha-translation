source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: fr
  text: Son taureau premier-né est majestueux[a] ; ses cornes sont celles d’un bœuf sauvage. Avec elles, il encornera les peuples tous ensemble, jusqu’aux extrémités de la terre. Telles sont les myriades d’Éphraïm[b], tels sont les milliers de Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à lui la majesté » ; autre traduction : « il a de la splendeur ».'
    reason: La proposition hébraïque est nominale et peut être rendue de plusieurs façons naturelles en français.
  - marker: b
    text: 'Ou : « les dizaines de milliers d’Éphraïm ». Le mot hébreu désigne de très grands nombres et contraste ici avec les « milliers de Manassé ».'
    reason: Cette note signale la valeur numérique plus précise possible de רִבְבוֹת.
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: Son taureau premier-né
  rationale: Cette formulation conserve l’image bovine masculine et la notion de primogéniture, sans préciser si l’image désigne Joseph en général ou plus particulièrement l’un de ses descendants.
- source_word: הָדָר לוֹ
  choice: est majestueux
  rationale: Le français idiomatique exprime naturellement la splendeur et la dignité portées par הָדָר dans cette proposition nominale.
- source_word: קַרְנֵי רְאֵם
  choice: les cornes d’un aurochs
  rationale: רְאֵם désigne vraisemblablement un puissant bovidé sauvage. « Aurochs » est précis, actuel et évite le traditionnel mais trompeur « licorne ».
- source_word: יְנַגַּח
  choice: il encornera
  rationale: Le verbe français maintient l’action concrète de frapper avec les cornes et prolonge directement l’image animale.
- source_word: עַמִּים יְנַגַּח יַחְדָּו
  choice: il encornera les peuples tous ensemble
  rationale: « Peuples » rend le pluriel collectif, tandis que « tous ensemble » conserve la portée de יַחְדָּו sans décider s’il s’agit surtout d’une simultanéité ou d’une totalité collective.
- source_word: אַפְסֵי אָרֶץ
  choice: jusqu’aux extrémités de la terre
  rationale: Cette expression française naturelle préserve l’ampleur géographique et poétique de l’idiome hébreu.
- source_word: רִבְבוֹת
  choice: myriades
  rationale: Le terme garde le registre poétique et l’idée de nombres immenses, tout en maintenant le contraste avec les « milliers » de Manassé.
- source_word: אַלְפֵי
  choice: milliers
  rationale: Le parallélisme avec רִבְבוֹת favorise ici le sens numérique plutôt que celui de groupes claniques.
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: Éphraïm / Manassé
  rationale: Ce sont les formes françaises usuelles des noms tribaux.
theological_decisions:
- issue: Référent de l’image du taureau premier-né
  choice: La traduction conserve le possessif et la métaphore sans identifier explicitement le taureau à Joseph ou à Éphraïm.
  alternative: Comprendre le « taureau premier-né » comme une désignation plus précise d’Éphraïm, prééminent parmi les descendants de Joseph.
  rationale: Le contexte bénit Joseph, puis nomme Éphraïm et Manassé. Le texte français préserve cette tension référentielle au lieu de la trancher.
translation_notes:
  register: Français international moderne, poétique et digne. « Encornera » conserve nettement l’image des cornes ; « aurochs » apporte une précision zoologique sans recourir à « licorne ». Le parallélisme final est rendu par « Telles sont… tels sont… ».
