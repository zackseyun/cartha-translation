source:
  edition: WLC
  text: יְחִ֥י רְאוּבֵ֖ן וְ/אַל יָמֹ֑ת וִ/יהִ֥י מְתָ֖י/ו מִסְפָּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: fr
  text: Que Ruben vive et ne meure pas, et que ses hommes soient peu nombreux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et que ses hommes soient comptés ». La dernière proposition est difficile en hébreu. Elle a aussi été comprise comme une prière pour que Ruben ne devienne pas insignifiant ou ne soit pas exclu du dénombrement des tribus.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: Que … vive
  rationale: Le qal jussif de חיה exprime ici un souhait ou une bénédiction. La tournure « Que … vive » restitue naturellement cette valeur volitive en français.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Le nom tribal est rendu selon sa forme française biblique usuelle.
- source_word: וְאַל יָמֹת
  choice: et ne meure pas
  rationale: אַל suivi du jussif exprime un souhait négatif. « Ne meure pas » conserve le sens direct de מות et le parallélisme avec « vive ».
- source_word: וִיהִי
  choice: et que … soient
  rationale: Ce second jussif introduit un autre souhait. Le pluriel français s'accorde naturellement avec « ses hommes ».
- source_word: מְתָיו
  choice: ses hommes
  rationale: Le terme est difficile, mais désigne probablement ici les hommes ou les membres de la tribu. « Ses hommes » préserve cette lecture sans transformer explicitement le groupe en « descendants » ou en « peuple ».
- source_word: מִסְפָּר
  choice: peu nombreux
  rationale: Littéralement « nombre ». Avec היה, l'expression peut signifier « être en petit nombre » ou « être dénombrable ». « Peu nombreux » donne en français le sens contextuel le plus probable, tandis que la note conserve l'autre compréhension importante.
theological_decisions:
- issue: Interprétation de la proposition finale וִיהִי מְתָיו מִסְפָּר
  choice: '« et que ses hommes soient peu nombreux » : Ruben est béni afin de subsister, même avec un effectif réduit.'
  alternative: « et que ses hommes soient comptés », c'est-à-dire que Ruben ne soit pas exclu du dénombrement des tribus; on comprend aussi parfois qu'il ne devienne ni insignifiant ni exclu du compte tribal.
  rationale: Le texte massorétique est concis et difficile. La lecture « peu nombreux » correspond au sens idiomatique probable de מִסְפָּר avec היה, sans recourir à une correction du texte. La note signale cependant la lecture favorable « soient comptés » et préserve ainsi l'ambiguïté et la tension du texte hébreu.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la cadence brève de la bénédiction hébraïque. « Ruben » suit l'usage biblique français courant; « peu nombreux » est idiomatique sans masquer l'incertitude, explicitée en note.
