source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: fr
  text: Ils appelleront des peuples à la montagne[a] ; là, ils offriront des sacrifices de justice. Car ils puiseront[b] dans l’abondance des mers et dans les trésors cachés du sable[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur une montagne ». L’hébreu ne précise pas de quelle montagne il s’agit.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « téteront l’abondance des mers » ; cette image évoque le fait d’en tirer subsistance ou richesse.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les choses cachées, enfouies dans le sable ». L’expression peut désigner des ressources liées au rivage ou aux régions sablonneuses, sans les identifier précisément.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel désigne plusieurs groupes humains collectifs. « Peuples » conserve mieux cette portée que « gens » et reste moins politique que « nations ».
- source_word: הַר
  choice: à la montagne
  rationale: Le nom singulier peut viser une montagne déterminée par le contexte, sans que son identité soit précisée. L’article français donne une formulation naturelle tout en laissant le lieu non identifié.
- source_word: יִקְרָאוּ
  choice: appelleront
  rationale: Le verbe קרא peut exprimer l’appel, la convocation ou l’invitation. « Appelleront » préserve cette amplitude sémantique.
- source_word: שָׁם
  choice: là
  rationale: Équivalent locatif simple et naturel.
- source_word: יִזְבְּחוּ
  choice: offriront
  rationale: Dans ce contexte cultuel, le verbe désigne l’action sacrificielle. Avec le complément explicite « des sacrifices », « offriront » évite une répétition lourde sans perdre le sens.
- source_word: זִבְחֵי צֶדֶק
  choice: des sacrifices justes
  rationale: Cette formulation conserve le lien direct avec צֶדֶק sans décider si l’expression décrit des sacrifices conformes au droit cultuel, offerts dans la justice ou agréés comme légitimes.
- source_word: שֶׁפַע יַמִּים
  choice: l’abondance des mers
  rationale: שֶׁפַע exprime l’abondance ou la profusion. Ce choix ne précise pas indûment s’il s’agit de nourriture, de ressources ou de richesse commerciale.
- source_word: יִינָקוּ
  choice: puiseront
  rationale: Le sens littéral est « téteront ». « Puiseront » rend naturellement l’idée de tirer subsistance ou richesse des mers, tandis qu’une note conserve l’image hébraïque.
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: et dans les trésors cachés du sable
  rationale: Les termes évoquent ce qui est caché, enfoui ou mis en réserve. « Trésors cachés » restitue la poésie sans identifier arbitrairement une ressource précise.
theological_decisions:
- issue: Nature des « sacrifices justes »
  choice: 'Maintenir une qualification ouverte : « des sacrifices justes ».'
  alternative: « des sacrifices de justice », « des sacrifices conformes à la justice » ou « des sacrifices agréés ».
  rationale: L’expression hébraïque peut concerner la conformité cultuelle ou morale des sacrifices, voire les conditions dans lesquelles ils sont offerts. La traduction n’importe aucune catégorie doctrinale ultérieure.
- issue: Identité de « la montagne »
  choice: Ne nommer aucune montagne particulière.
  alternative: Sion, le Sinaï, un sanctuaire de montagne ou le territoire montagneux des tribus.
  rationale: Le texte hébreu ne donne aucun nom. Une identification explicite résoudrait une ambiguïté réelle du passage.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé, ainsi que les ambiguïtés concernant la montagne, la valeur de צֶדֶק et la nature des richesses maritimes ou enfouies.
