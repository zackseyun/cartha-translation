  text: וּ/לְ/דָ֣ן אָמַ֔ר דָּ֖ן גּ֣וּר אַרְיֵ֑ה יְזַנֵּ֖ק מִן הַ/בָּשָֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: fr
  text: 'Et, au sujet de Dan, il dit : « Dan est un lionceau ; il bondit[a] du Bashân. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il s’élance du Bashân ». Le verbe hébreu évoque un mouvement brusque, un bond.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְדָן
  choice: Au sujet de Dan
  rationale: La conjonction et la préposition introduisent la bénédiction concernant Dan. Cette formulation est naturelle en français et conserve le sens de « concernant Dan ».
- source_word: אָמַר
  choice: il dit
  rationale: Rendu simple et direct du verbe courant אמר dans cette formule d’introduction.
- source_word: דָּן
  choice: Dan
  rationale: Nom propre de la personne et de la tribu, conservé sous sa forme française usuelle.
- source_word: גּוּר אַרְיֵה
  choice: un lionceau
  rationale: Le groupe nominal désigne le petit d’un lion. « Lionceau » restitue naturellement en français l’image et la nuance d’âge.
- source_word: יְזַנֵּק
  choice: il bondit
  rationale: Le verbe évoque un mouvement brusque, tel un saut ou un élan. « Bondit » est vif, naturel et n’impose pas l’idée plus précise d’une attaque.
- source_word: מִן הַבָּשָׁן
  choice: depuis le Bashân
  rationale: La préposition מן marque ici le point de départ ou l’origine. « Depuis » rend clairement ce mouvement à partir du Bashân sans préciser davantage le rapport géographique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et imagé. « Lionceau » évite l’archaïsme, tandis que « bondit » préserve la vigueur et la relative indétermination du verbe hébreu. Le toponyme est rendu selon la forme française traditionnelle « Bashân ».
