source:
  edition: WLC
  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: fr
  text: 'Au sujet de Nephtali, il dit :

    « Nephtali, rassasié de faveur

    et comblé de la bénédiction de Yahweh,

    prends possession de la mer[a] et du sud. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « l’ouest et le sud », car en hébreu le mot « mer » peut aussi servir à désigner l’ouest.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: Au sujet de Nephtali
  rationale: La préposition ל introduit ici la tribu concernée par la bénédiction. « Au sujet de » rend naturellement cette fonction thématique en français.
- source_word: שְׂבַע רָצוֹן
  choice: rassasié de faveur
  rationale: שְׂבַע exprime l’état de celui qui est pleinement pourvu ou rassasié, et רָצוֹן désigne ici la faveur, vraisemblablement divine. Cette formulation conserve l’image d’abondance du texte hébreu.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: et comblé de la bénédiction de Yahweh
  rationale: מָלֵא signifie littéralement « plein ». « Comblé de » est naturel en français dans un contexte de bénédiction et maintient le parallélisme avec « rassasié de faveur ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יָם
  choice: la mer
  rationale: Le sens lexical premier est « mer ». Le mot peut aussi désigner l’ouest dans le langage géographique hébreu ; cette possibilité est signalée en note.
- source_word: וְדָרוֹם
  choice: et du sud
  rationale: דָרוֹם désigne le sud ou la région méridionale. « Du sud » forme un complément coordonné naturel avec « de la mer ».
- source_word: יְרָשָׁה
  choice: prends possession de
  rationale: La forme impérative de ירשׁ appelle Nephtali à s’emparer de son territoire ou à le posséder. « Prends possession de » exprime clairement cette valeur territoriale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. La translittération « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Valeur de יָם dans la délimitation territoriale
  choice: la mer
  alternative: l’ouest
  rationale: Le sens concret « mer » est conservé dans le texte principal, tandis que le sens directionnel possible reste visible en note afin de ne pas trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en vers maintient le parallélisme poétique. « Rassasié » et « comblé » rendent l’abondance sans effacer les deux expressions distinctes de l’hébreu.
