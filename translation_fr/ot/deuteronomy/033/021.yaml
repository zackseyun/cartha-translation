  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: fr
  text: Il choisit pour lui la meilleure part[a], car là était réservée la portion du chef. Il vint avec les chefs du peuple ; il accomplit la justice de Yahvé[b] et ses jugements avec Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la première part ». Le terme hébreu peut désigner ce qui vient en premier ou ce qui est le meilleur.
    reason: alternative_reading
  - marker: b
    text: Ou « les actes justes de Yahvé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Il choisit
  rationale: Littéralement « il vit », mais la construction avec לֹו exprime ici le fait de repérer et de prendre pour soi ; « choisit » rend naturellement cet emploi contextuel.
- source_word: רֵאשִׁית
  choice: la meilleure part
  rationale: Dans ce contexte territorial, le terme désigne vraisemblablement la part première au sens de principale ou de meilleure, plutôt qu’un commencement chronologique.
- source_word: חֶלְקַת
  choice: la portion
  rationale: Le nom désigne une part attribuée, notamment dans un partage territorial.
- source_word: מְחֹקֵק
  choice: du chef
  rationale: Le terme peut désigner celui qui décrète, gouverne ou exerce l’autorité. « Chef » reste générique et n’impose ni l’identification à Moïse ni le sens plus précis de « législateur ».
- source_word: סָפוּן
  choice: était réservée
  rationale: Le participe évoque ce qui est caché, mis en réserve ou gardé à part ; « réservée » convient à une portion territoriale.
- source_word: וַיֵּתֵא
  choice: Il vint
  rationale: Le verbe exprime un mouvement de sortie ou de venue. « Il vint » s’accorde naturellement avec le complément « avec les chefs du peuple ».
- source_word: רָאשֵׁי עָם
  choice: les chefs du peuple
  rationale: Littéralement « les têtes du peuple » ; en français actuel, « chefs » restitue clairement la fonction dirigeante.
- source_word: צִדְקַת יְהוָה
  choice: la justice de Yahvé
  rationale: Le syntagme peut évoquer la justice, la fidélité conforme au droit ou les actes justes de Yahvé. La formulation retenue conserve sa densité et son ambiguïté.
- source_word: וּמִשְׁפָּטָיו
  choice: ses jugements
  rationale: Le pluriel désigne les décisions judiciaires, prescriptions ou ordonnances de Yahvé ; « jugements » demeure proche de l’hébreu.
- source_word: עִם יִשְׂרָאֵל
  choice: avec Israël
  rationale: La préposition signifie directement « avec » et présente l’action comme accomplie de concert avec Israël sans préciser davantage la relation.
theological_decisions:
- issue: Identité et portée de מְחֹקֵק dans חֶלְקַת מְחֹקֵק סָפוּן
  choice: Traduction générique par « chef », sans identifier le personnage.
  alternative: « législateur », éventuellement compris comme une allusion à Moïse ; ou « gouvernant »
  rationale: L’expression poétique est condensée et discutée. Une désignation générique préserve l’autorité évoquée sans imposer une identification que le texte ne formule pas explicitement.
- issue: Portée de צִדְקַת יְהוָה
  choice: « la justice de Yahvé »
  alternative: « les actes justes de Yahvé » ou « ce qui est juste aux yeux de Yahvé »
  rationale: Le singulier hébreu peut désigner une qualité, une norme juste ou son expression concrète. La traduction conserve cette tension plutôt que de la résoudre.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe poétique et les parallélismes sont conservés sans calque excessif. Le nom divin est rendu par « Yahvé », conformément à la couche de consultation fournie.
