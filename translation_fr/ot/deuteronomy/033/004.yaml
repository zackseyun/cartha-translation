  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: fr
  text: Moïse nous a prescrit une loi[a][b], un héritage pour l’assemblée de Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Moïse nous a prescrit une loi, l’héritage de l’assemblée de Jacob. » La syntaxe hébraïque est condensée, et « héritage » peut être étroitement apposé à « loi ».'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « loi » peut aussi signifier « enseignement » ; celui rendu par « héritage » peut aussi se traduire par « patrimoine » ou « possession ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: loi
  rationale: Dans ce contexte d’alliance, le mot désigne l’enseignement normatif transmis par Moïse. « Loi » en exprime clairement la portée publique et contraignante, tout en laissant « enseignement » comme possibilité lexicale.
- source_word: צִוָּה
  choice: a prescrit
  rationale: Le verbe exprime l’action de commander. « A prescrit » garde cette autorité et s’emploie naturellement en français avec « loi », contrairement au calque moins idiomatique « a commandé une loi ».
- source_word: לָנוּ
  choice: nous
  rationale: Le pronom complément dans « nous a prescrit » rend naturellement la préposition ל et identifie Israël comme destinataire de la loi.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom propre.
- source_word: מוֹרָשָׁה
  choice: héritage
  rationale: Le terme désigne un bien reçu et possédé durablement, notamment par droit héréditaire. « Héritage » conserve ici la dimension de transmission et d’appartenance liée à l’alliance.
- source_word: קְהִלַּת
  choice: l’assemblée de
  rationale: Le mot désigne la communauté rassemblée. « Assemblée » préserve ce sens collectif sans introduire une institution religieuse postérieure.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le texte hébreu nomme explicitement Jacob; ce nom est conservé plutôt que remplacé par son référent interprétatif, Israël.
theological_decisions:
- issue: Relation syntaxique entre « loi » et « héritage »
  choice: « héritage de l’assemblée de Jacob » est placé en apposition à « loi »
  alternative: « Moïse nous a prescrit une loi; elle est l’héritage de l’assemblée de Jacob »
  rationale: L’hébreu est condensé et ne comporte pas de verbe dans le second segment. L’apposition reproduit cette concision et présente la loi comme l’héritage de la communauté, sans imposer une articulation explicative absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « A prescrit » évite le calque peu naturel « a commandé une loi » tout en conservant la force d’autorité du verbe hébreu. La formulation appositionnelle maintient le rythme poétique et la syntaxe resserrée du verset.
