  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: fr
  text: 'Il dit :


    « Yahweh est venu du Sinaï,

    il a brillé depuis Séïr sur eux ;

    il a resplendi depuis le mont Parân,

    il est venu d’au milieu de myriades saintes[a] ;

    de sa main droite vint pour eux une loi de feu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. Elle peut aussi se comprendre : « des myriades de saints », c’est-à-dire d’êtres saints. Littéralement, le syntagme peut être rendu par « myriades de sainteté ».'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu אשדת est obscur et sa lecture est incertaine. La traduction traditionnelle est « une loi de feu », mais il pourrait aussi désigner du feu ou des traits de feu jaillissant de sa main droite.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: מִסִּינַי בָּא
  choice: est venu du Sinaï
  rationale: Le verbe décrit ici la venue ou la manifestation de Yahweh, et la préposition marque le point de départ.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: il s’est levé comme l’aurore sur eux depuis Séïr
  rationale: זָרַח évoque le lever et l’éclat de la lumière, notamment celui du soleil. La comparaison explicite rend cette image poétique naturelle en français, tandis que « sur eux » traduit la relation exprimée par לָמוֹ.
- source_word: הוֹפִיעַ
  choice: il a resplendi
  rationale: Le hiphil de יפע exprime une apparition rayonnante ; « resplendir » conserve à la fois l’éclat et la solennité de la théophanie.
- source_word: מֵהַר פָּארָן
  choice: depuis le mont Parân
  rationale: La traduction garde le relief géographique et le mouvement à partir de ce lieu.
- source_word: וְאָתָה
  choice: il est venu
  rationale: Le verbe poursuit la série poétique des verbes décrivant la venue divine.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: d’entre des myriades saintes
  rationale: Cette formulation française laisse ouverte l’identité précise de ces myriades tout en rendant naturellement l’association avec la sainteté. La note signale les principales compréhensions possibles.
- source_word: מִימִינוֹ
  choice: de sa main droite
  rationale: La préposition מִן indique le plus naturellement la provenance.
- source_word: אשדת
  choice: une loi de feu
  rationale: La forme hébraïque est particulièrement obscure. Cette traduction suit la lecture traditionnelle associant le feu et la loi, cohérente avec le contexte du Sinaï, sans masquer l’incertitude grâce à une note.
- source_word: לָמוֹ
  choice: leur
  rationale: Le pronom renvoie au groupe bénéficiaire ; la construction « leur venait » exprime naturellement cette destination en français.
theological_decisions:
- issue: Identité du sujet divin dans la théophanie poétique
  choice: Conserver explicitement « Yahweh » comme sujet de la manifestation.
  alternative: Introduire dans le verset une interprétation christologique ultérieure.
  rationale: Le passage décrit, dans son contexte propre, la venue théophanique du Dieu de l’alliance. La traduction ne doit pas incorporer une lecture typologique postérieure dans son libellé.
- issue: Interprétation de מֵרִבְבֹת קֹדֶשׁ
  choice: « d’entre des myriades saintes », avec une note exposant l’ambiguïté
  alternative: « des myriades de saints » ou « des myriades de sainteté »
  rationale: Le syntagme peut évoquer des êtres saints accompagnant Yahweh, mais sa construction ne permet pas d’imposer cette identification sans réserve.
- issue: Interprétation de אשדת
  choice: « une loi de feu », avec signalement explicite de l’incertitude
  alternative: « des traits de feu » ou « du feu »
  rationale: La lecture traditionnelle convient au cadre sinaïtique, mais la forme hébraïque est difficile et peut décrire plutôt un feu émanant de la main droite divine. La note maintient cette tension lexicale.
translation_notes:
  register: Français international actuel, poétique et solennel sans archaïsmes. Les verbes de lumière structurent la théophanie, et la disposition en vers met en valeur le parallélisme hébreu. Les deux difficultés majeures du texte sont rendues lisiblement dans le corps du verset et documentées en notes.
