  to: 'Il dit :


    « Yahweh est venu du Sinaï,

    il a brillé depuis Séïr sur eux ;

    il a resplendi depuis le mont Parân,

    il est venu d’au milieu de myriades saintes[a] ;

    de sa main droite vint pour eux une loi de feu[b]. »'
