  text: וּ/לְ/אָשֵׁ֣ר אָמַ֔ר בָּר֥וּךְ מִ/בָּנִ֖ים אָשֵׁ֑ר יְהִ֤י רְצוּי֙ אֶחָ֔י/ו וְ/טֹבֵ֥ל בַּ/שֶּׁ֖מֶן רַגְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: fr
  text: 'Au sujet d’Aser, il dit :


    « Qu’Aser soit béni plus que les fils[a] !


    Qu’il ait la faveur de ses frères[b]


    et qu’il plonge son pied dans l’huile[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’Aser soit le plus béni parmi les fils ! » La comparaison hébraïque peut avoir un sens comparatif ou superlatif.'
    reason: lexical_alternative
  - marker: b
    text: « Ses frères » désigne vraisemblablement les autres fils de Jacob et, par extension, les autres tribus d’Israël.
    reason: cultural_note
  - marker: c
    text: L’image du pied plongé dans l’huile évoque probablement l’abondance ou la prospérité, mais l’hébreu conserve cette image concrète.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר
  choice: Au sujet d’Aser
  rationale: La préposition introduit la bénédiction concernant la tribu d’Aser ; cette formulation est naturelle en français et respecte la structure du discours.
- source_word: אָמַר
  choice: il dit
  rationale: Rendu simple et direct du verbe narratif, approprié à la formule qui introduit chaque bénédiction.
- source_word: בָּרוּךְ מִבָּנִים
  choice: Béni plus que les fils
  rationale: Le מִן comparatif est rendu explicitement sans trancher en faveur d’un superlatif absolu. « Les fils » conserve l’image familiale qui représente ici les fils ou tribus d’Israël.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: Qu’il ait la faveur de ses frères
  rationale: Le souhait exprimé par יְהִי est rendu par une tournure optative naturelle. רְצוּי indique qu’Aser est agréé ou accueilli favorablement par ses frères.
- source_word: וְטֹבֵל
  choice: et qu’il plonge
  rationale: Dans le parallélisme poétique, le participe prolonge la bénédiction et reçoit naturellement en français la même valeur de souhait que le membre précédent.
- source_word: בַּשֶּׁמֶן רַגְלוֹ
  choice: son pied dans l’huile
  rationale: Le singulier et la métaphore concrète sont conservés ; le texte ne précise ni le type d’huile ni la signification exacte de l’image.
theological_decisions:
- issue: Portée de la comparaison בָּרוּךְ מִבָּנִים
  choice: Béni plus que les fils
  alternative: Le plus béni parmi les fils
  rationale: L’hébreu permet une lecture comparative ou superlative. Le texte principal retient une comparaison formelle et la note signale l’autre possibilité.
- issue: Sens de l’image du pied plongé dans l’huile
  choice: Conserver littéralement l’image
  alternative: Expliciter une abondance agricole, la prospérité ou le bien-être
  rationale: L’image suggère vraisemblablement l’abondance, notamment en huile, mais sa portée précise n’est pas explicitée. La traduction préserve donc son ouverture poétique et théologique.
translation_notes:
  register: Français international moderne, digne et poétique. La disposition en vers fait ressortir le parallélisme de la bénédiction. Les tournures optatives en « Qu’il… » rendent la valeur de souhait sans alourdir le texte.
