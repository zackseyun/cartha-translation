base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: fr
  text: 'Au sujet de Lévi, il dit :

    « Tes Toummim et tes Ourim sont pour l’homme qui t’est fidèle[a],

    celui que tu as mis à l’épreuve à Massa[b],

    avec qui tu as eu un différend aux eaux de Meriba. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme qui est attaché à toi » ou « ton homme loyal ». Le terme hébreu peut désigner quelqu’un qui se distingue par sa fidélité dans le cadre de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Massa signifie « mise à l’épreuve », et Meriba est associé à l’idée de différend ou de contestation (voir Exode 17.1-7 ; Nombres 20.1-13).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: Au sujet de Lévi
  rationale: Dans la suite des bénédictions tribales, la préposition ל introduit naturellement la tribu concernée. Cette formulation française est claire et conserve la fonction de la construction hébraïque.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: Tes Toummim et tes Ourim
  rationale: Il s’agit de termes techniques du culte sacerdotal dont la nature exacte demeure incertaine. Leur translittération préserve leur spécificité historique et religieuse ainsi que les suffixes de deuxième personne.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: sont pour l’homme qui t’est fidèle
  rationale: La proposition hébraïque est sans verbe exprimé; « sont » rend le lien intelligible. אִישׁ est conservé par « l’homme », tandis que חָסִיד désigne ici une personne caractérisée par sa fidélité loyale envers Dieu, possiblement dans un cadre d’alliance.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: celui que tu as mis à l’épreuve
  rationale: Le piel de נסה signifie tester ou éprouver. « Mettre à l’épreuve » est naturel en français et convient à l’épisode du désert évoqué.
- source_word: בְּמַסָּה
  choice: à Massa
  rationale: Le texte emploie le nom propre du lieu; sa translittération est donc maintenue dans le corps du texte.
- source_word: תְּרִיבֵהוּ
  choice: avec qui tu as eu un différend
  rationale: Le verbe ריב exprime une contestation ou un litige. Cette formulation préserve le conflit direct sans recourir au peu naturel « avec qui tu as contesté ».
- source_word: עַל מֵי מְרִיבָה
  choice: aux eaux de Meriba
  rationale: La préposition עַל situe ici l’affrontement par rapport aux eaux de Meriba. « Aux eaux de » restitue naturellement en français la désignation traditionnelle de l’événement et du lieu.
theological_decisions:
- issue: Référent de « l’homme qui t’est fidèle » dans la bénédiction de Lévi
  choice: Conserver une désignation masculine singulière sans identifier son référent.
  alternative: Identifier explicitement cet homme à Aaron, à Lévi comme ancêtre ou à la tribu de Lévi collectivement.
  rationale: L’hébreu singulier permet plusieurs identifications. La traduction garde cette ambiguïté et ne tranche pas la tension entre le représentant sacerdotal individuel et l’identité lévitique collective.
- issue: Nature du conflit exprimé par תְּרִיבֵהוּ
  choice: Rendre explicitement la contestation entre Dieu et le personnage désigné, sans préciser qui avait raison.
  alternative: Interpréter le verbe comme une accusation, une réprimande ou une simple mise à l’épreuve.
  rationale: Le texte juxtapose l’épreuve à Massa et le différend à Meriba. Une traduction non interprétative conserve cette tension et évite d’attribuer unilatéralement la faute.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition poétique reflète les trois membres de l’énoncé. Les noms cultuels sont translittérés « Toummim » et « Ourim »; les toponymes suivent les formes françaises « Massa » et « Meriba ». L’ambiguïté du référent singulier est volontairement préservée.
