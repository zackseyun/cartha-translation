  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: fr
  text: 'Voici la bénédiction par laquelle Moïse, l’homme de Dieu, a béni les fils d’Israël[a] avant sa mort :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette expression hébraïque courante désigne collectivement le peuple d’Israël.
    reason: Précision lexicale sur la portée collective de l’expression hébraïque.
lexical_decisions:
- source_word: וְזֹאת
  choice: Voici
  rationale: Le présentatif français introduit naturellement une nouvelle section et rend la valeur déictique de זֹאת sans ajouter un « maintenant » temporel. La conjonction hébraïque est intégrée à cette tournure idiomatique.
- source_word: הַבְּרָכָה
  choice: la bénédiction
  rationale: Le nom désigne ici une bénédiction solennelle; l’article défini hébreu est conservé.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: par laquelle … a béni
  rationale: Cette formulation rend la relation instrumentale entre la bénédiction et l’acte de bénir, tout en conservant la répétition lexicale présente en hébreu.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Titre hébreu reconnu d’un prophète ou d’un homme investi d’une mission divine; la formulation française traditionnelle demeure transparente.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale masculine du texte hébreu. Une note précise qu’elle désigne collectivement le peuple d’Israël.
- source_word: לִפְנֵי מוֹתוֹ
  choice: avant sa mort
  rationale: Rend directement la construction temporelle nominale de l’hébreu.
theological_decisions:
- issue: Portée du collectif genré בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël / les enfants d’Israël
  rationale: Le texte source emploie littéralement le construit masculin pluriel « fils de ». La traduction en conserve la forme familiale et genrée, tandis que la note empêche de comprendre l’expression comme excluant le reste du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé évite un registre excessivement littéraire, tandis que « Voici » et « l’homme de Dieu » conviennent au caractère solennel de l’introduction.
