source:
  edition: WLC
  text: וּ/מִ/מֶּ֗גֶד אֶ֚רֶץ וּ/מְלֹאָ֔/הּ וּ/רְצ֥וֹן שֹׁכְנִ֖י סְנֶ֑ה תָּב֨וֹאתָ/ה֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: fr
  text: 'avec le meilleur de la terre et tout ce qu’elle contient,

    avec la faveur de celui qui demeure dans le buisson[a].

    Que tout cela vienne sur la tête de Joseph,

    sur le sommet du crâne de celui qui a été mis à part de ses frères[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette expression évoque la manifestation de Dieu à Moïse dans le buisson ardent.
    reason: allusion_textuelle
  - marker: b
    text: Ou « le prince parmi ses frères » ou « celui qui est consacré parmi ses frères ». Le terme hébreu désigne quelqu’un qui est mis à part et peut aussi suggérer ici la prééminence de Joseph.
    reason: alternative_de_traduction
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: avec le meilleur de la terre
  rationale: מֶגֶד désigne ici les produits ou biens précieux et excellents accordés dans la bénédiction. « Le meilleur de la terre » est naturel en français et conserve la valeur superlative du terme dans ce contexte.
- source_word: מְלֹאָהּ
  choice: tout ce qu’elle contient
  rationale: Cette formulation rend clairement ce qui remplit la terre, sans recourir au calque moins naturel « sa plénitude ».
- source_word: רְצוֹן
  choice: la faveur
  rationale: Le mot exprime ici la bienveillance et l’accueil favorable de Dieu envers Joseph. « Faveur » est concis et laisse intacte la portée relationnelle du terme.
- source_word: שֹׁכְנִי סְנֶה
  choice: celui qui demeure dans le buisson
  rationale: La tournure relative rend naturellement le participe hébreu et conserve l’allusion à la manifestation divine du buisson, sans ajouter « ardent », absent de ce verset.
- source_word: תָּבֹואתָה
  choice: Que tout cela vienne
  rationale: Le singulier hébreu rassemble les divers éléments de la bénédiction en un ensemble. « Tout cela » garde cette valeur collective et la forme de souhait.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: sur la tête de Joseph
  rationale: La formulation préserve directement l’image traditionnelle de la bénédiction venant reposer sur la tête du bénéficiaire.
- source_word: קָדְקֹד
  choice: le sommet du crâne
  rationale: Le terme désigne le haut de la tête. Cette expression maintient le parallélisme avec « tête » tout en évitant une répétition plate.
- source_word: נְזִיר אֶחָיו
  choice: celui qui a été mis à part de ses frères
  rationale: נְזִיר évoque fondamentalement une personne séparée ou consacrée, tout en pouvant suggérer ici la distinction et la prééminence de Joseph. La traduction retenue conserve cette ouverture sémantique.
theological_decisions:
- issue: Identification de « celui qui demeure dans le buisson »
  choice: Une désignation de Dieu qui évoque sa manifestation à Moïse dans le buisson
  alternative: Une référence plus générale à une manifestation divine liée à l’Horeb ou au Sinaï
  rationale: La formule renvoie fortement au récit d’Exode 3 et fonctionne comme une désignation révérencielle de Dieu. Le texte traduit conserve l’allusion sans développer une identification doctrinale au-delà de ce qu’exprime l’hébreu.
- issue: Portée de נְזִיר appliqué à Joseph
  choice: Joseph est présenté comme mis à part de ses frères
  alternative: Joseph est présenté comme prince parmi ses frères ou comme consacré parmi eux
  rationale: Le sens de séparation est lexicalement sûr, tandis que la consécration et la prééminence restent des nuances possibles. Le texte principal ne tranche donc pas en faveur d’une fonction politique ou d’un statut religieux précis.
translation_notes:
  register: Français international actuel, poétique et digne. Les deux membres parallèles sont conservés. « Tout ce qu’elle contient » privilégie la clarté, tandis que « demeure dans le buisson » maintient l’étrangeté évocatrice du titre divin. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
