  text: אֵ֥ין כָּ/אֵ֖ל יְשֻׁר֑וּן רֹכֵ֤ב שָׁמַ֨יִם֙ בְ/עֶזְרֶ֔/ךָ וּ/בְ/גַאֲוָת֖/וֹ שְׁחָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: fr
  text: 'Nul n’est comme Dieu, Yeshouroun[a],

    lui qui chevauche les cieux pour venir à ton secours[b]

    et qui chevauche les nuées[c] dans sa majesté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeshouroun est un nom poétique donné à Israël.
    reason: cultural_note
  - marker: b
    text: 'Ou : « pour ton aide ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les hauteurs célestes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: Nul n’est comme Dieu
  rationale: L’expression négative existentielle introduit une comparaison absolue. « Nul n’est comme Dieu » conserve la force poétique et rend אֵל comme désignation divine commune.
- source_word: יְשֻׁרוּן
  choice: Yeshouroun
  rationale: Nom poétique donné à Israël, il est translittéré plutôt que traduit. La ponctuation française fait ressortir l’apostrophe.
- source_word: רֹכֵב
  choice: Il chevauche
  rationale: Le participe présente Dieu comme celui qui se déplace souverainement dans les hauteurs. « Chevauche » préserve l’image concrète et élevée du texte hébreu.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Ce pluriel poétique est rendu naturellement par « les cieux » et maintient le parallélisme avec les nuées.
- source_word: בְעֶזְרֶךָ
  choice: pour venir à ton secours
  rationale: Dans ce contexte, la préposition בְּ avec עֵזֶר exprime le but ou le bénéfice. Cette formulation française est naturelle tout en gardant l’idée que Dieu se porte au secours d’Israël.
- source_word: וּבְגַאֲוָתוֹ
  choice: dans sa majesté
  rationale: Employé à propos de Dieu, גַּאֲוָה évoque son élévation glorieuse ou sa majesté, et non un orgueil répréhensible.
- source_word: שְׁחָקִים
  choice: les nuées
  rationale: Ce terme poétique désigne les nuages ou les hauteurs célestes. « Nuées » conserve le registre élevé et distingue ce second terme de « cieux ».
theological_decisions:
- issue: Référent et valeur de אֵל dans la comparaison poétique
  choice: Désignation divine commune rendue par « Dieu »
  alternative: Nom propre « El » ou titre « le Puissant »
  rationale: Le verset proclame que le Dieu d’Israël est incomparable. « Dieu » est ici l’équivalent français le plus direct et n’introduit pas artificiellement une divinité distincte.
translation_notes:
  register: Français international moderne, poétique et digne. « Chevauche » maintient l’image audacieuse de רֹכֵב, tandis que la disposition en vers fait ressortir le parallélisme entre « les cieux » et « les nuées ». Le tutoiement correspond à l’adresse singulière à Israël sous le nom de Yeshouroun.
