  text: and with the choicest produce of the sun[a], and with the yield of the months[b],
translation:
  language: fr
  text: 'avec les meilleurs produits du soleil[a],

    et avec les précieuses récoltes des mois[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dons précieux du soleil ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des mois »; le mot hébreu est apparenté à celui qui désigne la lune et peut évoquer ce que la terre produit mois après mois.
    reason: cultural_note
lexical_decisions:
- source_word: מֶגֶד
  choice: meilleurs / précieuses
  rationale: Dans cette bénédiction, le nom désigne ce qui est excellent, précieux ou abondant. La variation française évite une répétition lourde tout en conservant le parallélisme sémantique.
- source_word: תְּבוּאֹת
  choice: produits
  rationale: Le terme désigne largement ce que la terre fait pousser; « produits » garde cette portée agricole sans la limiter à une récolte particulière.
- source_word: שָׁמֶשׁ
  choice: du soleil
  rationale: Le soleil est présenté comme ce qui favorise la croissance des produits de la terre.
- source_word: גֶּרֶשׁ
  choice: récoltes
  rationale: Ce terme rare évoque ce qui est poussé au-dehors ou produit. « Récoltes » exprime naturellement le résultat agricole sans reproduire une image étymologique obscure.
- source_word: יְרָחִים
  choice: de chaque mois
  rationale: Le pluriel signifie normalement « mois », tout en restant lié au cycle lunaire. « Chaque mois » rend naturellement l’idée de productions successives au fil des mois.
