revisions:
- from: 'Au sujet de Joseph, il dit :

    « Que sa terre soit bénie par Yahweh,

    par les biens précieux du ciel[a], par la rosée,

    et par les eaux profondes qui reposent en dessous[b] ! »'
  to: 'Pour Joseph, il dit :


    « Que sa terre soit bénie par Yahweh,

    avec les biens précieux du ciel[a], avec la rosée,

    et avec les eaux profondes qui reposent au-dessous[b] ! »'
  rationale: La révision remplace l’emploi instrumental ambigu de « par » par « avec », conserve la série poétique des ressources qui accompagnent la bénédiction et améliore légèrement la formulation de la localisation. La note lexicale est limitée à une alternative réellement justifiée; l’ancrage des deux notes demeure sur les expressions qu’elles expliquent.
