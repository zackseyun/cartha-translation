  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: fr
  text: 'Pour Joseph, il dit :


    « Que sa terre soit bénie par Yahweh,

    avec les biens précieux du ciel[a], avec la rosée,

    et avec les eaux profondes qui reposent au-dessous[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les délices du ciel ».'
    reason: lexical_alternative
  - marker: b
    text: Ces « eaux profondes » désignent vraisemblablement les eaux conçues comme se trouvant sous la terre et l’alimentant.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף
  choice: Au sujet de Joseph
  rationale: Dans la formule qui introduit la bénédiction d’une tribu, לְ peut se rendre par « au sujet de » ou « pour ». « Au sujet de Joseph » est naturel en français et maintient Joseph comme thème de la déclaration.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: Que sa terre soit bénie par Yahweh
  rationale: Le participe passif a ici la valeur d’une bénédiction formulée comme un souhait. Cette tournure française conserve la voix passive et l’origine divine de la bénédiction.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: par les biens précieux du ciel
  rationale: מֶגֶד désigne ce qui est excellent, précieux ou délectable, notamment dans les bénédictions liées à la fécondité. « Biens précieux » reste concret sans préciser indûment qu’il s’agit de cadeaux ou de produits agricoles.
- source_word: מִטָּל
  choice: par la rosée
  rationale: La préposition מִן présente ici la rosée comme moyen ou source de la fécondité promise. « Par » rend ce rapport avec naturel dans la série poétique.
- source_word: וּמִתְּהוֹם
  choice: et par les eaux profondes
  rationale: תְּהוֹם désigne la masse des eaux profondes. En contexte agricole, « les eaux profondes » est plus immédiatement intelligible que « l’abîme » tout en évitant d’ajouter une connotation infernale.
- source_word: רֹבֶצֶת תָּחַת
  choice: qui reposent en dessous
  rationale: Le participe évoque littéralement ce qui est couché ou tapi. « Reposent en dessous » conserve cette image de présence stable sous la terre sans produire en français une personnification animale trop marquée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin, non un titre. La translittération « Yahweh » le distingue de אֲדֹנָי et préserve sa fonction de nom dans la bénédiction.
- issue: Nature de תְּהוֹם dans cette bénédiction
  choice: les eaux profondes
  alternative: l’abîme
  rationale: Le contexte décrit les ressources qui rendent la terre féconde. La traduction conserve donc le référent aquatique probable sans identifier explicitement ces eaux à un système hydrologique moderne ni effacer l’image cosmologique du texte.
translation_notes:
  register: Français international moderne, poétique mais accessible. La mise en vers fait ressortir le parallélisme de la bénédiction. « Terre » convient au territoire attribué aux descendants de Joseph, tandis que la répétition de « par » reproduit sobrement la série des groupes introduits par מִן.
