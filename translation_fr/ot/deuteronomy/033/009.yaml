  naturalness: '« Veillé sur ton alliance » est compréhensible, mais peu idiomatique en français dans ce contexte : on veille sur des personnes ou des biens, tandis qu’une alliance se garde, s’observe ou se préserve. « Préservé ton alliance » est à la fois naturel et apte à rendre la nuance de נצר.'
  terminology: « Alliance », « parole », « frères » et « fils » sont appropriés. La note peut être légèrement resserrée afin d’expliquer l’idiome sans ajouter l’idée plus interprétative d’un « traitement particulier ».
