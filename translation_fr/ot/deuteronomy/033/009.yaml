  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: fr
  text: 'lui qui a dit de son père et de sa mère[a] : « Je ne l’ai pas vu », qui n’a pas reconnu ses frères ni connu ses fils, car ils ont gardé ta parole et préservé ton alliance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Je ne l’ai pas vu. » Dans ce contexte, l’expression signifie probablement : « Je n’ai pas tenu compte de lui » ou « Je ne l’ai pas considéré », la fidélité à l’alliance passant avant les liens familiaux.'
    reason: Alternative lexicale et explication de l’emploi idiomatique de ראה.
lexical_decisions:
- source_word: הָאֹמֵר
  choice: lui qui a dit
  rationale: Le participe substantivé renvoie à Lévi, sujet du contexte. Cette tournure française conserve sa valeur relative et représentative.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: de son père et de sa mère
  rationale: Avec אמר, ל peut introduire les personnes au sujet desquelles on parle. « De » s’accorde naturellement avec le refus de leur accorder une considération familiale.
- source_word: לֹא רְאִיתִיו
  choice: Je ne l’ai pas vu
  rationale: La traduction conserve le sens premier de ראה et la formulation abrupte de l’hébreu, tandis qu’une note signale la valeur contextuelle possible de ne pas tenir compte de quelqu’un.
- source_word: הִכִּיר
  choice: reconnu
  rationale: Le hifil de נכר exprime ici la reconnaissance, notamment relationnelle; « reconnu » préserve le lien lexical sans expliciter davantage.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le nom hébreu est masculin pluriel et désigne explicitement les frères.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le texte massorétique porte le masculin pluriel « fils »; cette précision est conservée.
- source_word: יָדָע
  choice: connu
  rationale: « Connu » rend directement ידע tout en permettant, dans ce parallélisme, une nuance de reconnaissance relationnelle.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la priorité donnée à la fidélité envers Dieu.
- source_word: שָׁמְרוּ
  choice: ont gardé
  rationale: שמר signifie garder ou observer; « garder la parole » convient au registre d’alliance et reste distinct du verbe suivant.
- source_word: אִמְרָתֶךָ
  choice: ta parole
  rationale: אמרה désigne une parole ou déclaration; « ta parole » est naturel sans la réduire à un commandement particulier.
- source_word: בְּרִיתְךָ
  choice: ton alliance
  rationale: « Alliance » est l’équivalent français établi de ברית dans ce contexte.
- source_word: יִנְצֹרוּ
  choice: veillé sur
  rationale: נצר comporte la nuance de garder soigneusement ou préserver. « Veiller sur » maintient la différence lexicale avec שמר.
theological_decisions:
- issue: Passage du singulier au pluriel
  choice: 'Conserver le singulier dans la description représentative de Lévi, puis le pluriel dans la motivation : « ils ont gardé » et « veillé ».'
  alternative: Uniformiser tout le verset au singulier ou au pluriel.
  rationale: 'L’hébreu présente Lévi de manière corporative : un représentant singulier dans les premières propositions, puis les Lévites au pluriel. Ne pas uniformiser préserve cette tension grammaticale et théologique.'
- issue: Sens de « Je ne l’ai pas vu » dans la priorité de l’alliance sur les liens familiaux
  choice: Maintenir la traduction littérale dans le texte et expliquer en note la nuance contextuelle probable.
  alternative: 'Traduire directement : « Je n’ai pas tenu compte de lui » ou « Je ne l’ai pas considéré ».'
  rationale: Le sens premier de ראה est « voir », mais le contexte suggère le refus de faire prévaloir les liens familiaux. La note préserve à la fois la formulation source et son sens idiomatique probable.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme familial est conservé, ainsi que le passage significatif du singulier représentatif au pluriel collectif. La ponctuation présente les trois propositions comme une même description de Lévi.
