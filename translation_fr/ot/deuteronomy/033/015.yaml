  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: fr
  text: 'et des meilleurs produits des montagnes anciennes[a],

    et des richesses des collines éternelles[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sommet des montagnes anciennes ». L’expression hébraïque peut se comprendre spatialement (« sommet, tête ») ou qualitativement (« ce qu’il y a de meilleur »).
    reason: lexical_alternative
  - marker: b
    text: Ou « des biens précieux des collines immémoriales ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: des meilleurs produits de
  rationale: רֹאשׁ signifie littéralement « tête » ou « sommet », mais peut désigner ce qui est principal ou meilleur. Dans cette énumération de bénédictions, le parallélisme avec מֶגֶד favorise un sens qualitatif, sans exclure la lecture spatiale signalée en note.
- source_word: הַרְרֵי
  choice: montagnes
  rationale: Pluriel construit de הַר, rendu naturellement par « montagnes » et distingué de גִּבְעוֹת, « collines », dans le membre parallèle.
- source_word: קֶדֶם
  choice: anciennes
  rationale: קֶדֶם peut évoquer l’orient ou les temps anciens. Son parallèle avec עוֹלָם dans ce contexte poétique favorise le sens temporel.
- source_word: מִמֶּגֶד
  choice: des richesses de
  rationale: מֶגֶד désigne des biens précieux, une production excellente ou une abondance féconde. « Richesses » exprime cette générosité de façon naturelle et poétique en français.
- source_word: גִּבְעוֹת
  choice: collines
  rationale: Équivalent courant de גִּבְעָה, qui maintient le contraste poétique avec les « montagnes » du premier membre.
- source_word: עוֹלָם
  choice: éternelles
  rationale: Dans cette description poétique du paysage, עוֹלָם évoque une durée indéfinie ou une antiquité immémoriale. « Éternelles » conserve la force élevée de l’expression, tandis qu’une autre nuance est indiquée en note.
