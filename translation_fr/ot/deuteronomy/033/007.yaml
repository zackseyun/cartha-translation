base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: fr
  text: 'Voici ce qu’il dit au sujet de Juda :


    « Écoute, Yahweh, la voix de Juda,

    et amène-le auprès de son peuple.

    Que ses mains combattent pour lui[a],

    et sois son secours contre ses adversaires ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que ses mains lui suffisent. » La proposition hébraïque est difficile et peut être comprise de plusieurs manières.'
    reason: Lecture alternative d’une proposition hébraïque obscure.
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה
  choice: Voici ce qu’il dit au sujet de Juda
  rationale: La conjonction et le démonstratif introduisent la bénédiction suivante. « Au sujet de Juda » exprime naturellement la valeur thématique de לְ en français.
- source_word: שְׁמַע יְהוָה קוֹל יְהוּדָה
  choice: Écoute, Yahweh, la voix de Juda
  rationale: L’impératif constitue une prière adressée directement à Yahweh. « La voix » conserve l’image de קוֹל sans préciser qu’il s’agit nécessairement d’un cri.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: et amène-le auprès de son peuple
  rationale: Le hifil de בוא signifie « amener, faire venir ». Cette formulation ne tranche pas entre un retour après le combat et une autre forme de réunion avec le peuple.
- source_word: יָדָיו רָב לוֹ
  choice: Que ses mains combattent pour lui
  rationale: La proposition hébraïque est difficile. Comprendre רָב dans le sens de lutter ou combattre convient au contexte militaire et au parallélisme avec la demande de secours contre les adversaires, tout en signalant l’autre lecture possible en note.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: et sois son secours contre ses adversaires
  rationale: מִן est compris ici dans un sens adversatif ou séparatif. « Sois son secours » rend la prière directement adressée à Yahweh dans un français naturel et solennel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Interprétation de יָדָיו רָב לוֹ
  choice: Que ses mains combattent pour lui
  alternative: Que ses mains lui suffisent
  rationale: L’hébreu est condensé et ambigu. La lecture retenue s’accorde avec la demande de protection contre les ennemis, tandis que l’autre compréhension ancienne et grammaticalement possible est conservée en note plutôt qu’écartée.
translation_notes:
  register: Français international moderne, digne et accessible. La mise en vers fait ressortir la structure poétique. Le vocabulaire reste proche des images hébraïques sans lourdeur archaïque.
