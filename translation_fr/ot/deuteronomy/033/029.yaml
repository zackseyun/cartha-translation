  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: fr
  text: Heureux es-tu, Israël ! Qui est comme toi, peuple sauvé par Yahweh ? Il est le bouclier qui te secourt et l’épée de ta majesté. Tes ennemis se soumettront à toi[a], et toi, tu fouleras leurs hauteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se soumettront à toi de façon trompeuse » ; le verbe hébreu peut évoquer une soumission contrainte ou feinte.
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs positions élevées » ou « leurs places fortes ». Certains comprennent ici « leur dos », mais « hauteurs » est le sens le plus direct du nom hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: Heureux es-tu
  rationale: La formule exclamative exprime un bonheur enviable et une condition bénie. « Heureux es-tu » conserve le ton élevé tout en restant naturel en français moderne.
- source_word: מִי כָמוֹךָ
  choice: Qui est comme toi
  rationale: Cette question rhétorique affirme le caractère incomparable d’Israël dans le cadre de la bénédiction.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: peuple sauvé par Yahweh
  rationale: Le participe niphal présente Israël comme un peuple caractérisé par la délivrance reçue de Yahweh. « Sauvé » garde la portée générale du verbe, sans la limiter à une seule forme de délivrance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: מָגֵן עֶזְרֶךָ
  choice: le bouclier qui te secourt
  rationale: Cette formulation française rend naturellement la construction hébraïque condensée et présente Yahweh comme la protection qui apporte du secours à Israël.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: et l’épée de ta majesté
  rationale: La proposition nominale elliptique continue de décrire Yahweh. « Majesté » conserve ici le sens positif d’élévation et d’honneur de גַּאֲוָה, sans la connotation morale négative que peut avoir « orgueil ».
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: Tes ennemis ramperont devant toi
  rationale: « Ramper devant » traduit de façon idiomatique l’idée d’une soumission abjecte ou contrainte. La possibilité d’une soumission feinte, également portée par le verbe, est signalée en note.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: tu fouleras leurs hauteurs
  rationale: « Hauteurs » est le sens lexical direct de בָּמוֹת et maintient l’image poétique, qui peut évoquer les positions élevées ou les places fortes de l’ennemi.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom d’alliance sans lui substituer un titre.
- issue: Valeur de גַּאֲוָתֶךָ
  choice: ta majesté
  alternative: ton orgueil ; ton élévation ; ta gloire
  rationale: Dans cette bénédiction, le terme désigne positivement l’honneur et l’élévation d’Israël. « Majesté » évite d’introduire l’idée d’un orgueil coupable.
- issue: Nature de la soumission des ennemis
  choice: ramperont devant toi, avec une note sur la soumission feinte
  alternative: te feront une soumission trompeuse ; se soumettront à toi
  rationale: Le verbe peut exprimer une soumission contrainte, servile ou feinte. Le texte principal conserve l’image de l’abaissement, tandis que la note maintient l’ambiguïté liée à la tromperie.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe poétique et les images militaires sont conservées sans archaïsmes. Les ambiguïtés lexicales importantes sont maintenues au moyen de notes placées sur les expressions concernées.
