  naturalness: Le français est globalement naturel, digne et adapté à un registre poétique moderne. « Se soumettront à toi » est plus idiomatique et sémantiquement plus sobre que « ramperont devant toi ».
  terminology: « Yahweh », « peuple sauvé », « bouclier qui te secourt », « épée de ta majesté » et « hauteurs » sont des rendus cohérents. Les appels de note français sont correctement placés sur les expressions auxquelles ils se rapportent, contrairement à l’ordre apparent des appels dans la piste d’audit anglaise.
