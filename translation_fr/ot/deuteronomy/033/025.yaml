  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: fr
  text: Tes verrous seront de fer et de bronze[a], et ta force sera à la mesure de tes jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tes sandales — ou tes chaussures — seront de fer et de bronze. » Le nom hébreu peut désigner des chaussures, mais beaucoup comprennent ici des verrous en raison de l’image des métaux et du contexte de protection.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et ton repos — ou ta sécurité — sera à la mesure de tes jours ». Le dernier mot hébreu est rare et son sens est incertain ; « force » est une traduction traditionnelle qui convient au contexte de bénédiction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: fer
  rationale: Sens courant du métal, ici associé à נְחֹשֶׁת.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou le bronze; « bronze » forme en français une association naturelle avec « fer » dans cette image métallique.
- source_word: מִנְעָלֶיךָ
  choice: tes verrous
  rationale: Bien que le nom puisse désigner des sandales ou des chaussures, les métaux et le contexte de protection favorisent ici l'image de verrous défensifs. L'autre sens est conservé en note.
- source_word: וּכְיָמֶיךָ
  choice: autant que tes jours
  rationale: La préposition כ exprime une comparaison ou une proportion. Cette formulation française naturelle relie la durée de la force à celle des jours.
- source_word: דָּבְאֶךָ
  choice: ta force durera
  rationale: Le terme, très rare et incertain, est traditionnellement compris comme la force ou la vigueur. L'ajout de « durera » explicite en français la relation proportionnelle sans prétendre lever l'incertitude lexicale, signalée en note.
theological_decisions:
- issue: Interprétation des images de la bénédiction
  choice: Le verset promet une protection durable et une force qui se maintient tout au long de la vie.
  alternative: Il peut évoquer des chaussures résistantes pour un terrain difficile; le dernier terme peut aussi désigner le repos ou la sécurité plutôt que la force.
  rationale: Le contexte de bénédiction et l'image du fer et du bronze soutiennent la lecture retenue, mais les deux termes décisifs sont discutés; les variantes sont donc conservées dans les notes plutôt que tranchées silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est formulé idiomatiquement, tandis que les incertitudes lexicales importantes sont explicitement préservées dans les notes.
