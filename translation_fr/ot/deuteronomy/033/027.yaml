source:
  edition: WLC
  text: מְעֹנָה֙ אֱלֹ֣הֵי קֶ֔דֶם וּ/מִ/תַּ֖חַת זְרֹעֹ֣ת עוֹלָ֑ם וַ/יְגָ֧רֶשׁ מִ/פָּנֶ֛י/ךָ אוֹיֵ֖ב וַ/יֹּ֥אמֶר הַשְׁמֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: fr
  text: 'Le Dieu des temps anciens est une demeure[a], et au-dessous se trouvent les bras éternels. Il a chassé l’ennemi devant toi et a dit : « Détruis ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le Dieu éternel est ton refuge. » L’hébreu peut être compris, de manière plus interprétative, dans ce sens traditionnel ; la formulation plus directe est : « Le Dieu des temps anciens est une demeure. »'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: une demeure
  rationale: Le nom désigne un lieu d’habitation ou d’abri. « Demeure » conserve l’image concrète sans la réduire d’emblée au sens métaphorique de « refuge ».
- source_word: אֱלֹהֵי קֶדֶם
  choice: Le Dieu des temps anciens
  rationale: קֶדֶם évoque ici les temps anciens ou les jours d’autrefois. Cette formulation française rend le sens temporel plus directement que « le Dieu éternel », tout en restant naturelle et digne.
- source_word: וּמִתַּחַת
  choice: et au-dessous
  rationale: La locution a un sens spatial. « Au-dessous » préserve le parallélisme poétique sans ajouter un complément absent de l’hébreu.
- source_word: זְרֹעֹת עוֹלָם
  choice: les bras éternels
  rationale: « Bras » conserve la métaphore de la force et du soutien, tandis que « éternels » exprime ici la durée sans fin portée par עוֹלָם.
- source_word: וַיְגָרֶשׁ
  choice: Il a chassé
  rationale: Le verbe signifie chasser ou expulser. « Chasser » est clair, énergique et adapté au contexte.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Littéralement « de devant ta face », l’expression indique que Dieu écarte l’ennemi devant l’avancée d’Israël.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier hébreu est conservé et peut avoir une valeur collective.
- source_word: וַיֹּאמֶר
  choice: et a dit
  rationale: La proposition poursuit le récit avec Dieu comme sujet naturel, repris explicitement par « Il » dans la phrase française.
- source_word: הַשְׁמֵד
  choice: Détruis !
  rationale: L’impératif demande une destruction complète. « Détruis ! » garde la force du commandement sans préciser davantage que l’hébreu.
theological_decisions:
- issue: Faut-il comprendre קֶדֶם dans אֱלֹהֵי קֶדֶם comme une référence aux temps anciens ou comme l’affirmation que Dieu est éternel ?
  choice: Le Dieu des temps anciens
  alternative: Le Dieu éternel
  rationale: Le sens le plus direct de קֶדֶם renvoie à l’ancienneté et aux temps d’autrefois. La traduction traditionnelle « le Dieu éternel » reste une interprétation possible et théologiquement importante ; elle est donc conservée en note plutôt que substituée au sens lexical principal.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure simple. « Demeure » préserve l’image hébraïque, tandis que la note donne la lecture traditionnelle plus interprétative. Le tutoiement singulier rend le suffixe de deuxième personne de מִפָּנֶיךָ.
