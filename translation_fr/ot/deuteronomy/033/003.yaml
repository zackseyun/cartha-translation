  text: אַ֚ף חֹבֵ֣ב עַמִּ֔ים כָּל קְדֹשָׁ֖י/ו בְּ/יָדֶ֑/ךָ וְ/הֵם֙ תֻּכּ֣וּ לְ/רַגְלֶ֔/ךָ יִשָּׂ֖א מִ/דַּבְּרֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: fr
  text: 'Oui, il aime les peuples ;


    tous ses saints sont dans ta main.


    Ils s’assoient à tes pieds[a] ;


    chacun reçoit tes paroles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du verbe hébreu est incertain. On a aussi proposé : « ils se rassemblent », « ils s’accroupissent » ou même « ils sont abattus ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « chacun prend de tes paroles » ou « porte tes propos ». L’expression hébraïque est rare et difficile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Oui
  rationale: La particule a ici une valeur d’affirmation et d’insistance. « Oui » rend cette force naturellement en français sans lui donner nécessairement un sens additif.
- source_word: חֹבֵב
  choice: il aime
  rationale: Le participe exprime une disposition durable ; le présent français est naturel et conserve le sens relationnel.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne des collectivités humaines sans imposer le sens plus précis de « nations » ni limiter la référence aux non-Israélites.
- source_word: כָּל קְדֹשָׁיו
  choice: tous ses saints
  rationale: 'Cette formulation concise conserve le sens de personnes ou d’êtres saints, sans préciser s’il s’agit d’anges ou du peuple consacré. Le suffixe est rendu à la troisième personne : « ses ».'
- source_word: בְּיָדֶךָ
  choice: dans ta main
  rationale: La traduction littérale reste claire en français et préserve le passage poétique de la troisième à la deuxième personne.
- source_word: תֻּכּוּ
  choice: ils s’assoient
  rationale: Le verbe est très incertain. Dans le contexte des pieds et de l’accueil des paroles, l’image de personnes assises aux pieds du locuteur est cohérente, mais les autres analyses sont signalées en note.
- source_word: לְרַגְלֶךָ
  choice: à tes pieds
  rationale: Cette expression idiomatique française convient à la posture d’écoute, de proximité ou de soumission suggérée par le contexte.
- source_word: יִשָּׂא
  choice: recueille
  rationale: Le verbe signifie fondamentalement « lever, porter, prendre ». Avec les paroles comme complément, « recueille » exprime naturellement l’idée de les recevoir ou de les prendre à son compte, tout en laissant percevoir une action plus active que la simple écoute.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: tes paroles
  rationale: Le nom est rare et se rapporte à la parole ou aux propos. « Tes paroles » est clair et digne ; la difficulté du préfixe מ est signalée en note.
theological_decisions:
- issue: Changement de personne dans le poème
  choice: Conserver « il… ses… ta… tes »
  alternative: Uniformiser tous les pronoms à la deuxième ou à la troisième personne
  rationale: Le texte hébreu passe de la troisième à la deuxième personne. Conserver ce mouvement évite de résoudre silencieusement une tension réelle du texte.
- issue: Identité des « saints »
  choice: Ne pas préciser leur identité
  alternative: Traduire explicitement par « les anges », « le peuple saint » ou « les Israélites consacrés »
  rationale: Le terme hébreu ne permet pas à lui seul de trancher entre ces identifications. « Ses saints » maintient l’ouverture du texte.
translation_notes:
  register: Français international moderne, sobre et poétique. Les lignes brèves reflètent le parallélisme du vers. Le tutoiement correspond à l’adresse directe au Seigneur dans le poème. Les changements de personne et les deux principales difficultés lexicales sont conservés plutôt que lissés.
