source:
  edition: WLC
  text: וּ/לְ/גָ֣ד אָמַ֔ר בָּר֖וּךְ מַרְחִ֣יב גָּ֑ד כְּ/לָבִ֣יא שָׁכֵ֔ן וְ/טָרַ֥ף זְר֖וֹעַ אַף קָדְקֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: fr
  text: 'Au sujet de Gad, il dit :


    « Béni soit celui qui donne de l’espace à Gad[a] !


    Gad demeure comme un lion[b]


    et déchire le bras, et même le sommet du crâne[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet de « celui qui donne de l’espace à Gad » n’est pas nommé en hébreu ; il peut être compris implicitement comme Dieu.
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu peut aussi être rendu par « lionne » ; il peut désigner un lion puissant de manière plus générale.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le bras, et même le sommet du crâne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: Au sujet de Gad
  rationale: Introduit naturellement en français l’oracle adressé à la tribu de Gad.
- source_word: בָּרוּךְ מַרְחִיב גָּד
  choice: Béni soit celui qui met Gad au large
  rationale: « Mettre au large » exprime l’idée causative de donner de l’espace ou d’étendre, sans ajouter explicitement Dieu comme sujet.
- source_word: כְּלָבִיא
  choice: comme un lion
  rationale: Le nom peut désigner un lion puissant, parfois une lionne. Le masculin générique s’accorde naturellement avec Gad en français, tandis qu’une note conserve l’alternative lexicale.
- source_word: שָׁכֵן
  choice: demeure
  rationale: Conserve l’idée de demeurer ou de s’établir, compatible à la fois avec le territoire tribal et l’image du lion au repos.
- source_word: וְטָרַף
  choice: et déchire
  rationale: Rend directement l’action violente et prédatrice du verbe hébreu.
- source_word: זְרוֹעַ
  choice: le bras
  rationale: Maintient l’image corporelle concrète plutôt que de l’interpréter abstraitement comme la force.
- source_word: אַף קָדְקֹד
  choice: jusqu’au sommet du crâne
  rationale: Exprime la progression intensive vers le haut de la tête dans un français naturel, tout en conservant l’image anatomique.
theological_decisions:
- issue: Identité de celui qui met Gad au large
  choice: 'Le sujet reste non identifié : « celui qui met Gad au large »'
  alternative: Nommer explicitement Dieu comme celui qui agrandit le territoire de Gad
  rationale: Le participe hébreu ne nomme pas son sujet. La formulation française préserve cette ouverture tout en permettant que Dieu soit implicitement visé.
- issue: Valeur de la formule de bénédiction
  choice: « Béni soit celui »
  alternative: « Béni est celui »
  rationale: Le tour optatif est idiomatique et solennel en français. L’hébreu peut aussi être compris comme une déclaration de bénédiction, possibilité signalée en note.
translation_notes:
  register: Français international moderne, sobre et solennel. La disposition poétique met en relief les deux images de l’oracle. « Mettre au large » conserve la métaphore spatiale sans expliciter indûment un territoire, tandis que les notes préservent les principales ambiguïtés de l’hébreu.
