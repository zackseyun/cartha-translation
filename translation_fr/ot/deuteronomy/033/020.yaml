review_pass:
  verdict: revise
  source_fidelity: 'La structure et les images sont globalement fidèles : Gad demeure comme un lion et déchire des parties du corps. Toutefois, אַף signifie ici « même / et même », non « jusqu’à » ; cette dernière formulation introduit une idée de parcours ou de limite absente de l’hébreu. « Mettre Gad au large » est aussi idiomatiquement ambigu en français et évoque plutôt l’éloignement maritime que l’octroi d’un espace.'
  naturalness: « Donner de l’espace à Gad » est clair en français international moderne tout en conservant l’imagerie spatiale sans ajouter explicitement « territoire ». La syntaxe poétique reste sobre et naturelle.
  terminology: Gad est correctement conservé. « Lion » est un choix recevable pour לָבִיא, dont la référence sexuelle est discutée selon les contextes ; la note peut signaler « lionne » sans imposer cette lecture. « Sommet du crâne » rend précisément קָדְקֹד.
  issues:
  - severity: medium
    issue: « jusqu’au sommet du crâne » traduit אַף
    rationale: אַף est une particule additive ou intensive (« même », « et même »). « Jusqu’à » change la relation entre les deux termes anatomiques et n’est pas justifié par le texte source.
  - severity: medium
    issue: « met Gad au large »
    rationale: Cette expression est susceptible d’évoquer le fait d’éloigner quelqu’un vers le large. Elle ne rend pas avec suffisamment de netteté la causation spatiale de מַרְחִיב.
  - severity: low
    issue: 'Note a : alternative peu utile et formulation du référent divin'
    rationale: La note actuelle présente essentiellement la formulation retenue comme alternative. Il est préférable de signaler directement le caractère implicite et non nommé du sujet, sans le déterminer comme Dieu.
