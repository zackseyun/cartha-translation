  text: וַ/יְהִ֥י בִ/ישֻׁר֖וּן מֶ֑לֶךְ בְּ/הִתְאַסֵּף֙ רָ֣אשֵׁי עָ֔ם יַ֖חַד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: fr
  text: Il fut roi[a] en Yeshouroun[b], lorsque les chefs du peuple se rassemblèrent, les tribus d’Israël toutes ensemble[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il devint roi ». Le sujet n’est pas nommé en hébreu. On peut comprendre : « le SEIGNEUR fut roi en Yeshouroun » ; d’autres comprennent que le sujet est Moïse.'
    reason: alternative_reading
  - marker: b
    text: « Yeshouroun » est un nom poétique donné à Israël.
    reason: cultural_note
  - marker: c
    text: 'La formulation hébraïque est condensée. On peut aussi comprendre : « lorsque les chefs du peuple, les tribus d’Israël, se rassemblèrent tous ensemble ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il devint
  rationale: La forme de היה peut exprimer l’entrée dans un état ou sa manifestation. « Il devint » rend ici naturellement la relation avec le prédicat « roi », sans identifier le sujet implicite.
- source_word: בִישֻׁרוּן
  choice: en Yeshouroun
  rationale: Yeshouroun est un nom poétique d’Israël. La translittération conserve ce nom propre, tandis que « en » rend simplement la préposition ב dans son sens collectif ou locatif.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent français direct du nom hébreu, sans préciser qui porte ce titre.
- source_word: בְּהִתְאַסֵּף
  choice: quand … se rassemblèrent
  rationale: L’infinitif construit précédé de ב introduit naturellement une circonstance temporelle.
- source_word: רָאשֵׁי עָם
  choice: les chefs du peuple
  rationale: L’expression signifie littéralement « les têtes du peuple », idiome désignant ses chefs. Le français « chefs » transmet clairement le sens sans produire une image obscure.
- source_word: יַחַד
  choice: toutes ensemble
  rationale: L’adverbe exprime le rassemblement et l’unité. L’accord au féminin rattache naturellement l’expression aux « tribus ».
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: les tribus d’Israël
  rationale: Traduction directe de l’expression hébraïque, maintenue en apposition après « les chefs du peuple » afin de préserver la formulation condensée du verset.
theological_decisions:
- issue: Référent du sujet implicite et du titre « roi »
  choice: Le texte principal emploie « il » sans identifier explicitement son référent.
  alternative: « Le SEIGNEUR devint roi en Yeshouroun » ou « Moïse devint roi en Yeshouroun ».
  rationale: L’hébreu ne nomme pas le sujet de וַיְהִי. Comme le contexte permet diverses identifications, la traduction conserve cette ambiguïté réelle et la signale en note.
- issue: Unité collective d’Israël
  choice: Le rassemblement des chefs et des tribus est présenté comme un rassemblement commun.
  alternative: Y voir explicitement une cérémonie d’intronisation ou une assemblée d’alliance.
  rationale: Le verset affirme le rassemblement et l’unité, mais n’en précise pas formellement la nature politique ou liturgique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La syntaxe conserve la formulation appositionnelle et resserrée de l’hébreu, tandis que les notes explicitent l’ambiguïté du sujet et une autre construction possible.
