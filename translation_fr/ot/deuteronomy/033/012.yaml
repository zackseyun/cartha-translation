base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: fr
  text: 'Au sujet de Benjamin, il dit :


    « Le bien-aimé de Yahweh demeure en sécurité auprès de lui[a] ;


    il étend sa protection sur lui tout le jour,


    et il demeure entre ses épaules[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « demeure en sécurité près de lui », « sous lui » ou « au-dessus de lui ». La préposition hébraïque est concise et peut exprimer la proximité ou une position protectrice.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « entre ses épaules ». Certains y voient une image de proximité protectrice ; d’autres comprennent les « épaules » comme les hauteurs du territoire de Benjamin, éventuellement en rapport avec le sanctuaire qui s’y trouvait.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: Au sujet de Benjamin
  rationale: Dans la formule qui introduit la bénédiction de chaque tribu, cette tournure française exprime naturellement le rôle de rubrique du לְ, sans imposer « à » ou « pour ».
- source_word: יְדִיד יְהוָה
  choice: le bien-aimé de Yahweh
  rationale: יְדִיד désigne une personne aimée ou chère. « Le bien-aimé » conserve la chaleur relationnelle de l’expression, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: demeure en sécurité
  rationale: שׁכן signifie habiter ou demeurer, tandis que לָבֶטַח exprime la sécurité. Le présent convient à la formulation poétique d’une bénédiction durable.
- source_word: עָלָיו
  choice: auprès de lui
  rationale: La préposition עַל est très condensée ici et peut évoquer la proximité, la position au-dessus ou la protection. « Auprès de lui » donne un sens naturel tout en signalant l’ambiguïté en note.
- source_word: חֹפֵף עָלָיו
  choice: il étend sa protection sur lui
  rationale: Le participe חֹפֵף évoque l’action de couvrir ou de protéger. Cette formulation française conserve l’image d’une protection qui s’étend sur le bien-aimé sans suggérer nécessairement un mouvement.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Cette expression garde la tonalité poétique de l’hébreu tout en restant claire en français moderne.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: et il demeure entre ses épaules
  rationale: La traduction littérale de כָּתֵף par « épaule » préserve l’image poétique ainsi que l’ambiguïté des pronoms et du référent de שָׁכֵן.
theological_decisions:
- issue: Référent des pronoms et sujet des verbes
  choice: Le texte principal présente le bien-aimé comme demeurant en sécurité auprès de Yahweh, Yahweh étendant sa protection sur lui ; la dernière proposition reste délibérément ambiguë.
  alternative: Yahweh demeure au-dessus de Benjamin et entre ses épaules ; ou Benjamin demeure entre les épaules de Yahweh.
  rationale: La compression poétique de l’hébreu et les suffixes pronominaux permettent plusieurs constructions. La traduction ne tranche pas la dernière proposition au-delà de ce qu’autorise le texte.
- issue: Sens de l’image « entre ses épaules »
  choice: Conserver l’image corporelle littérale dans le texte principal.
  alternative: Comprendre les « épaules » comme les versants montagneux du territoire de Benjamin, éventuellement en lien avec le sanctuaire.
  rationale: L’image hébraïque peut exprimer la proximité protectrice ou recevoir une lecture topographique. La formulation littérale maintient cette tension interprétative.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme et la répétition de « demeure » sont conservés. Les formulations évitent de résoudre artificiellement l’ambiguïté des pronoms hébreux.
