  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: fr
  text: Ainsi Israël habite en sécurité, à l’écart[b] — la source de Jacob[a] —, dans un pays de céréales et de vin nouveau ; même ses cieux distillent la rosée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’œil de Jacob ». Le mot hébreu peut désigner soit un œil, soit une source. La construction poétique est condensée; « la source de Jacob » peut être compris comme une désignation d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « seul ». Dans ce contexte de bénédiction, le terme exprime vraisemblablement une existence séparée et paisible, non l’abandon.
    reason: lexical_nuance
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: demeure
  rationale: שׁכן exprime le fait d’habiter ou de résider durablement. « Demeure » convient au registre poétique tout en restant courant.
- source_word: בֶּטַח
  choice: en sécurité
  rationale: Le terme fonctionne ici comme un complément adverbial et décrit la condition paisible et sûre d’Israël.
- source_word: בָּדָד
  choice: à l’écart
  rationale: Le mot évoque une existence séparée, indépendante et sans trouble dans ce contexte de bénédiction, plutôt qu’un abandon douloureux.
- source_word: עֵין יַעֲקֹב
  choice: la source de Jacob
  rationale: עַיִן peut désigner l’œil ou une source. Le contexte de fertilité — céréales, vin nouveau et rosée — favorise « source », sans éliminer l’autre sens, signalé en note.
- source_word: אֶל אֶרֶץ
  choice: est dans un pays
  rationale: Bien que אֶל signifie souvent « vers », la construction poétique exprime ici la relation de la source de Jacob avec le pays fertile. Le verbe « est » rend explicitement en français la proposition nominale hébraïque.
- source_word: דָּגָן
  choice: céréales
  rationale: דָּגָן désigne globalement les productions céréalières. « Céréales » évite de restreindre indûment le sens au seul blé.
- source_word: תִּירוֹשׁ
  choice: vin nouveau
  rationale: Le terme désigne couramment le produit récent de la vigne et participe à l’image d’abondance agricole.
- source_word: אַף
  choice: même
  rationale: '« Même » restitue la force cumulative et emphatique : la bénédiction vient aussi des cieux.'
- source_word: שָׁמָיו
  choice: ses cieux
  rationale: Le pluriel et le suffixe possessif masculin singulier sont conservés, malgré leur caractère légèrement poétique en français.
- source_word: יַעַרְפוּ
  choice: distillent
  rationale: Le verbe décrit ce qui tombe goutte à goutte. « Distillent » est naturel avec la rosée et conserve la tonalité poétique.
- source_word: טָל
  choice: rosée
  rationale: Équivalent direct du terme hébreu et image agricole traditionnelle de fertilité.
theological_decisions:
- issue: Sens de עֵין יַעֲקֹב
  choice: « la source de Jacob » dans le texte principal
  alternative: « l’œil de Jacob »
  rationale: Le contexte agricole favorise le sens « source », mais la polysémie réelle du mot hébreu est conservée en note plutôt que résolue sans indication.
- issue: Portée de בָּדָד
  choice: « à l’écart », au sens d’une séparation sûre
  alternative: « seul » ou « isolé »
  rationale: Le contexte de bénédiction suggère l’indépendance paisible plutôt que l’abandon, tout en laissant perceptible l’idée de séparation.
- issue: Relation syntaxique de עֵין יַעֲקֹב avec la proposition précédente
  choice: 'Proposition poétique distincte : « la source de Jacob est dans… »'
  alternative: 'Apposition à Israël : « Israël… source de Jacob… »'
  rationale: La syntaxe hébraïque est condensée. La formulation choisie rend la lecture agricole cohérente sans identifier explicitement la source à Israël au-delà de ce que dit le texte.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme et les images agricoles sont préservés ; les ajouts nécessaires à la syntaxe française restent minimaux.
