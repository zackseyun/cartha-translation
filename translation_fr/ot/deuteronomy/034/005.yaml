  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: fr
  text: Moïse, serviteur de Yahvé, mourut là, dans le pays de Moab, selon la parole de Yahvé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la bouche de Yahvé »; l’expression peut aussi se traduire par « sur l’ordre de Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut donc
  rationale: Le wayyiqtol fait avancer le récit. « Mourut donc » exprime naturellement en français la succession narrative et la portée conclusive du verset.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe renvoie au lieu décrit dans le contexte précédent et conserve sa valeur déictique.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahvé
  rationale: עֶבֶד peut signifier « esclave » ou « serviteur », mais il constitue ici un titre honorifique de Moïse; « serviteur » convient au contexte sans accentuer indûment la condition servile.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du tétragramme, qui préserve le nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: בְּאֶרֶץ מוֹאָב
  choice: dans le pays de Moab
  rationale: Cette formulation conserve explicitement אֶרֶץ, « pays », ainsi que l’accent géographique de l’hébreu.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahvé
  rationale: Littéralement « sur la bouche de Yahvé », cette locution signifie couramment qu’un événement a lieu conformément à sa parole ou à son ordre. « Sur l’ordre de » est idiomatique en français tout en laissant la formulation littérale et l’autre nuance possible en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahvé » est la transcription française courante qui maintient le caractère personnel du nom divin.
- issue: Nuance du titre עֶבֶד appliqué à Moïse
  choice: serviteur
  alternative: esclave
  rationale: Dans ce contexte, le mot fonctionne comme un titre honorifique exprimant le service et la mission de Moïse auprès de Yahvé; « esclave » mettrait au premier plan une nuance sociale qui n’est pas dominante ici.
- issue: Sens de עַל פִּי יְהוָה
  choice: sur l’ordre de Yahvé
  alternative: selon la parole de Yahvé; littéralement, sur la bouche de Yahvé
  rationale: La locution désigne normalement l’ordre ou la parole qui fait autorité. Le texte ne précise pas davantage la manière de la mort; la traduction évite donc d’introduire une interprétation traditionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu. La virgule après « Moïse » détache naturellement le titre en apposition. Le marqueur [a] figure immédiatement après l’expression qu’il explique.
