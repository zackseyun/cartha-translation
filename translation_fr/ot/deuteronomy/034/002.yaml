  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: fr
  text: tout Nephtali, le pays d’Éphraïm et de Manassé, et tout le pays de Juda jusqu’à la mer occidentale[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la mer de derrière » ou « la dernière mer », manière hébraïque de désigner la mer située à l’ouest, c’est-à-dire la mer Méditerranée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: tout Nephtali
  rationale: Dans cette énumération géographique, כָּל suivi du nom tribal désigne l’ensemble du territoire associé à Nephtali. « Tout Nephtali » reste concis et conserve la formulation métonymique de l’hébreu.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: le pays d’Éphraïm et de Manassé
  rationale: אֶרֶץ désigne ici un pays ou territoire. Le singulier coordonne naturellement les deux régions tribales sans ajouter une précision absente de l’hébreu.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: tout le pays de Juda
  rationale: Cette formulation rend explicitement אֶרֶץ et maintient l’accent géographique du passage.
- source_word: עַד
  choice: jusqu’à
  rationale: עַד indique ici la limite ou l’étendue du territoire visible; « jusqu’à » est la tournure française naturelle dans ce contexte.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: la mer occidentale
  rationale: L’expression signifie littéralement « la mer de derrière » ou « la dernière mer » et fonctionne comme une désignation directionnelle de la mer située à l’ouest. « La mer occidentale » restitue clairement cet idiome sans remplacer le texte par le nom propre « mer Méditerranée ».
