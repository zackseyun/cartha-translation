  text: וְ/אֶת הַ/נֶּ֗גֶב וְֽ/אֶת הַ/כִּכָּ֞ר בִּקְעַ֧ת יְרֵח֛וֹ עִ֥יר הַ/תְּמָרִ֖ים עַד צֹֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: fr
  text: et le Néguev[a], et la plaine, la vallée de Jéricho, la ville des palmiers, jusqu’à Tsoar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sud ». Le terme hébreu peut désigner soit la région appelée le Néguev, soit le sud comme indication géographique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Dans cette énumération de territoires, le terme fonctionne comme un nom géographique reconnu. La translittération « Néguev » préserve cette valeur, tandis que « le sud » demeure une possibilité lexicale signalée en note.
- source_word: הַכִּכָּר
  choice: la plaine
  rationale: Dans cet emploi géographique, le mot désigne la plaine ou le district de la vallée du Jourdain. « La plaine » est naturel en français et convient à la précision appositive qui suit.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: la vallée de Jéricho
  rationale: Le nom désigne une large vallée ou une plaine. « La vallée de Jéricho » conserve le sens topographique tout en évitant la répétition immédiate de « plaine ».
- source_word: עִיר הַתְּמָרִים
  choice: la ville des palmiers
  rationale: Cette expression construite est une désignation traditionnelle de Jéricho. La traduction conserve directement l’image hébraïque dans un français idiomatique.
- source_word: עַד צֹעַר
  choice: jusqu’à Tsoar
  rationale: La préposition marque ici l’étendue ou la limite de ce que Moïse voit.
- source_word: וְאֶת ... וְאֶת
  choice: et… et
  rationale: La répétition de la conjonction et du marqueur d’objet poursuit l’énumération cumulative. Le double « et » en maintient le rythme sans reproduire le marqueur d’objet, qui n’a pas d’équivalent direct en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation par virgules préserve la structure appositive du texte hébreu. « Tsoar » suit une translittération française transparente de צֹעַר. Aucune note distincte n’est ajoutée à « vallée de Jéricho », puisque l’alternative « plaine de Jéricho » risquerait ici de brouiller sa relation avec הַכִּכָּר; l’ampleur sémantique est toutefois conservée dans la décision lexicale.
