reference: Deuteronomy 34:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: fr
  text: 'Moïse monta des plaines de Moab au mont Nébo, au sommet du Pisga, qui fait face à Jéricho. Yahweh lui montra tout le pays : le Galaad jusqu’à Dan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh lui fit voir tout le pays. »'
    reason: La forme causative du verbe ראה peut être rendue soit idiomatiquement par « montrer », soit plus explicitement par « faire voir ».
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime un déplacement vers le haut. « Monta » est direct, naturel et conserve ce mouvement ascendant.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: des plaines de Moab
  rationale: עַרְבוֹת désigne ici la région de plaines ou de steppes. « Plaines de Moab » est clair et géographiquement naturel en français.
- source_word: הַר נְבוֹ
  choice: au mont Nébo
  rationale: La construction הַר suivie d’un nom propre se rend naturellement en français par « mont » suivi du toponyme.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: au sommet du Pisga
  rationale: רֹאשׁ signifie littéralement « tête », mais désigne ici le sommet. Le nom Pisga est conservé comme toponyme avec l’article contracté naturel en français.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: qui fait face à Jéricho
  rationale: Dans cette indication géographique, עַל־פְּנֵי signifie « en face de » ou « face à ». « Fait face à » préserve l’image spatiale et reste idiomatique.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: Yahweh lui montra
  rationale: La forme causative de ראה signifie « faire voir », d’où le français naturel « montrer ». Le nom divin est transcrit « Yahweh ».
- source_word: כָּל הָאָרֶץ
  choice: tout le pays
  rationale: הָאָרֶץ désigne ici le territoire aperçu, non la terre entière. « Tout le pays » exprime clairement ce sens contextuel.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: le Galaad jusqu’à Dan
  rationale: Le groupe précise l’étendue du pays montré. L’article de l’hébreu est rendu devant le nom régional « Galaad », usage français bien établi, et עַד par « jusqu’à ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme, nom personnel du Dieu d’Israël. La translittération « Yahweh » le distingue d’un titre et évite de remplacer silencieusement le nom par « le Seigneur ».
- issue: Nuance causative de וַיַּרְאֵהוּ
  choice: Yahweh lui montra
  alternative: Yahweh lui fit voir
  rationale: Les deux formulations rendent le hiphil causatif de ראה. « Lui montra » est plus naturel, tandis que la note conserve la formulation causative plus explicite sans imposer une distinction théologique absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Syntaxe fluide, toponymes bibliques usuels (« Nébo », « Pisga », « Jéricho », « Galaad », « Dan »), avec maintien du nom divin « Yahweh ». Le deux-points introduit naturellement la première précision géographique de l’énumération.
