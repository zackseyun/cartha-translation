  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: fr
  text: Moïse avait cent vingt ans quand il mourut. Sa vue ne s’était pas affaiblie[a], et sa vigueur ne l’avait pas quitté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son œil ne s’était pas obscurci »; autrement dit, sa vue ne s’était pas affaiblie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa vitalité n’avait pas diminué ». Le terme hébreu évoque la fraîcheur ou la vigueur physique qui demeure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Moïse
  rationale: La conjonction initiale assure la continuité du récit, mais le français n’exige pas ici de connecteur explicite.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: avait cent vingt ans
  rationale: L’expression hébraïque littérale « fils de cent vingt ans » est un idiome indiquant l’âge.
- source_word: בְּמֹתוֹ
  choice: quand il mourut
  rationale: La préposition jointe au nom « mort » et au suffixe personnel a ici une valeur temporelle; cette formulation est naturelle et digne en français narratif.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: Sa vue n’avait pas baissé
  rationale: כָּהָה exprime l’affaiblissement ou l’obscurcissement, notamment de la vue. Le français emploie naturellement « la vue » là où l’hébreu dit au singulier « son œil »; la note conserve l’image littérale.
- source_word: וְלֹא נָס לֵחֹה
  choice: et sa vigueur ne l’avait pas quitté
  rationale: לֵחֹה évoque la fraîcheur, la vitalité ou la vigueur physique, tandis que נָס signifie littéralement « s’enfuir ». La formulation française garde la personnification sans devenir obscure.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « mourut » convient au registre narratif biblique sans rendre la phrase archaïque. Les deux propositions rendent naturellement les idiomes corporels hébreux, tandis que les notes signalent leur forme plus littérale.
