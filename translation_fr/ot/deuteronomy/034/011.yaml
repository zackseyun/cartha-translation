  text: לְ/כָל הָ֨/אֹת֜וֹת וְ/הַ/מּוֹפְתִ֗ים אֲשֶׁ֤ר שְׁלָח/וֹ֙ יְהוָ֔ה לַ/עֲשׂ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: fr
  text: pour tous les signes et les prodiges que Yahweh l’avait envoyé accomplir dans le pays d’Égypte, à Pharaon, à tous ses serviteurs et à tout son pays[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre Pharaon, tous ses serviteurs et tout son pays ». Pour le dernier membre, on peut aussi comprendre : « dans tout son pays ». La préposition hébraïque peut exprimer ici diverses relations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: pour tous les signes et les prodiges
  rationale: Le לְ initial prolonge la construction du verset précédent et introduit le domaine dans lequel Moïse fut sans égal. « Signes et prodiges » rend naturellement la paire hébraïque sans préciser indûment la nature de chaque acte.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: que Yahweh l’avait envoyé accomplir
  rationale: Le plus-que-parfait convient au regard rétrospectif du passage. « Envoyé accomplir » exprime directement la mission confiée à Moïse, tout en donnant à עשה un équivalent français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Cette formulation conserve אֶרֶץ et le registre narratif soutenu du texte.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו
  choice: contre Pharaon, tous ses serviteurs
  rationale: Dans le contexte des plaies, לְ marque naturellement les personnes visées par les signes. « Serviteurs » conserve le sens lexical direct de עֲבָדִים, lequel peut inclure les agents et dignitaires royaux.
- source_word: וּלְכָל אַרְצוֹ
  choice: et tout son pays
  rationale: 'La coordination française évite de répéter « contre » tout en laissant celui-ci porter sur les trois compléments : Pharaon, ses serviteurs et son pays. Une lecture distributive ou spatiale de la préposition demeure toutefois possible et est signalée en note.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement sans remplacer le nom par un titre.
- issue: Valeur de la préposition לְ devant Pharaon, ses serviteurs et son pays
  choice: contre
  alternative: à ; devant ; dans tout
  rationale: Le contexte des signes accomplis en Égypte favorise l’idée d’actes dirigés contre Pharaon et son royaume. Comme la préposition possède une gamme relationnelle plus large, la note préserve les autres compréhensions possibles, surtout pour « tout son pays ».
translation_notes:
  register: Français international moderne, digne et fluide. Le fragment conserve la dépendance syntaxique envers le verset 10 ainsi que la ponctuation ouverte de la phrase. « Accomplir » est plus idiomatique que « faire » avec « signes et prodiges », tandis que la note maintient l’ambiguïté de la préposition hébraïque.
