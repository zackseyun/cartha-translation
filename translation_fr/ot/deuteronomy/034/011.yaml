  naturalness: « Signes et prodiges », « Yahweh », « dans le pays d’Égypte » et « l’avait envoyé accomplir » sont naturels dans un français biblique moderne et soutenu. La répétition de « à » est ici justifiée par la structure hébraïque et assure une lecture claire.
