revisions:
- from: 'Yahweh lui dit : « Voici le pays au sujet duquel j’ai juré à Abraham, à Isaac et à Jacob : “Je le donnerai à ta descendance[a].” Je t’ai permis de le voir de tes propres yeux, mais tu n’y passeras pas. »'
  to: 'Yahweh lui dit : « Voici le pays que j’ai juré de donner à Abraham, à Isaac et à Jacob, en disant : “Je le donnerai à ta descendance[a].” Je t’ai permis de le voir de tes propres yeux, mais tu n’y passeras pas. »'
  rationale: La révision explicite que le serment porte sur le don du pays, conformément à la formule de promesse hébraïque, et rétablit explicitement « en disant » (לֵאמֹר). Elle conserve la valeur collective de « descendance », le nom divin « Yahweh », ainsi que le contraste entre la vision du pays et l’interdiction d’y passer.
