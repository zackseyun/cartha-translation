base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: fr
  text: 'Yahweh lui dit : « Voici le pays que j’ai juré de donner à Abraham, à Isaac et à Jacob, en disant : “Je le donnerai à ta descendance[a].” Je t’ai permis de le voir de tes propres yeux, mais tu n’y passeras pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « semence » ; le mot hébreu est un nom collectif au singulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin du texte hébreu et préserve sa portée d’alliance.
- source_word: זֹאת הָאָרֶץ
  choice: Voici le pays
  rationale: Dans ce contexte de promesse patriarcale, « pays » désigne le pays promis; la tournure présentative est naturelle en français.
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré
  rationale: Rend explicitement la prestation de serment exprimée par le verbe hébreu.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: Conserve la répétition de la préposition, qui reste naturelle et solennelle en français.
- source_word: לְזַרְעֲךָ
  choice: à ta descendance
  rationale: « Descendance » est un nom collectif singulier courant qui convient à la promesse faite aux patriarches.
- source_word: הֶרְאִיתִיךָ
  choice: Je t’ai permis de le voir
  rationale: Rend la valeur causative du hifil de ראה sans lourdeur en français moderne.
- source_word: בְעֵינֶיךָ
  choice: de tes propres yeux
  rationale: Exprime idiomatiquement l’insistance hébraïque sur la vision personnelle et directe.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: mais tu n’y passeras pas
  rationale: Préserve l’image du passage vers le pays et rend clairement le contraste avec le fait de le voir.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le Tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée de זֶרַע dans la promesse patriarcale
  choice: descendance
  alternative: postérité; semence
  rationale: Le terme hébreu est morphologiquement singulier mais collectif dans ce contexte. « Descendance » maintient cette valeur sans imposer une lecture strictement individuelle ou plurielle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la solennité du serment, la valeur collective de זֶרַע et le contraste entre voir le pays et ne pas y passer.
