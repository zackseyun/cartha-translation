base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: fr
  text: ainsi que toute la puissance de sa main et tous les actes redoutables que Moïse accomplit sous les yeux de tout Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute la main forte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toute la grande terreur » ou « toutes les manifestations redoutables ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל הַיָּד הַחֲזָקָה
  choice: ainsi que toute la puissance de sa main
  rationale: La construction coordonne ce dernier élément au résumé du verset précédent. « Main forte » est l’image hébraïque littérale, mais « la puissance de sa main » en exprime naturellement le sens tout en conservant l’image de la main. Le possessif renvoie naturellement à Moïse dans la proposition relative.
- source_word: וּלְכֹל הַמּוֹרָא הַגָּדוֹל
  choice: et tous les actes redoutables
  rationale: מוֹרָא peut désigner la terreur, ce qui inspire la crainte, ou une manifestation redoutable. Dans ce résumé des œuvres de Moïse, le pluriel français « actes redoutables » s’accorde avec כֹל et évite l’expression peu naturelle « toute la grande terreur », sans réduire la force du terme.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: que Moïse accomplit
  rationale: עָשָׂה signifie largement « faire, accomplir ». « Accomplit » convient en français aux actes évoqués et garde un registre digne sans ajouter d’interprétation.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: sous les yeux de tout Israël
  rationale: Cette formulation conserve l’image concrète de l’hébreu et exprime que ces actes furent accomplis publiquement, à la vue de la nation entière.
theological_decisions:
- issue: Nature des actes attribués à Moïse dans l’éloge final
  choice: Présenter le verset comme le résumé des manifestations de puissance et des actes redoutables accomplis publiquement par Moïse.
  alternative: Traduire formellement « toute la main forte et toute la grande terreur que Moïse fit ».
  rationale: Le texte attribue grammaticalement l’action à Moïse, tout en s’inscrivant dans le contexte des signes et prodiges mentionnés au verset précédent. La traduction conserve cette attribution sans préciser davantage l’articulation entre l’action divine et l’action de Moïse.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase poursuit syntaxiquement le verset précédent; « ainsi que » rend cette coordination. Les images et ambiguïtés significatives sont conservées dans le texte ou signalées en note.
