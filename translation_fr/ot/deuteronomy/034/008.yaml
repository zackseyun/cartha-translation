  text: וַ/יִּבְכּוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת מֹשֶׁ֛ה בְּ/עַֽרְבֹ֥ת מוֹאָ֖ב שְׁלֹשִׁ֣ים י֑וֹם וַֽ/יִּתְּמ֔וּ יְמֵ֥י בְכִ֖י אֵ֥בֶל מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: fr
  text: Les Israélites pleurèrent Moïse dans les plaines de Moab pendant trente jours. Puis les jours de pleurs et de deuil pour Moïse prirent fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: pleurèrent
  rationale: Le verbe בכה désigne l’action de pleurer. « Pleurèrent » la distingue du deuil plus général mentionné ensuite.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette expression rend naturellement en français moderne le groupe désigné par l’hébreu littéral « fils d’Israël », sans laisser entendre que seules les personnes de sexe masculin sont concernées.
- source_word: אֶת מֹשֶׁה
  choice: Moïse
  rationale: Après « pleurer », le français peut employer directement le nom de la personne dont on déplore la mort ; le sens est ici « pleurer la mort de Moïse ».
- source_word: בְּעַרְבֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עַרְבוֹת désigne les plaines ou steppes de la région de Moab. « Plaines de Moab » est clair et géographiquement établi.
- source_word: שְׁלֹשִׁים יוֹם
  choice: pendant trente jours
  rationale: La préposition « pendant » exprime naturellement en français la durée indiquée par l’hébreu.
- source_word: וַיִּתְּמוּ
  choice: prirent fin
  rationale: Le qal de תם exprime ici l’achèvement d’une période. « Prirent fin » conserve cette valeur résultative dans un français naturel.
- source_word: יְמֵי בְכִי
  choice: les jours de pleurs
  rationale: Le groupe construit désigne les jours caractérisés par les pleurs.
- source_word: אֵבֶל מֹשֶׁה
  choice: de deuil pour Moïse
  rationale: Le construit associe le deuil à Moïse, c’est-à-dire le deuil observé à sa mort. « Pour Moïse » évite l’ambiguïté française selon laquelle Moïse lui-même porterait le deuil.
