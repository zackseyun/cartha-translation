base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: fr
  text: Il[a] l’enterra dans la vallée, au pays de Moab, en face de Beth-Péor, et jusqu’à ce jour, personne ne connaît le lieu où il a été enterré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet du verbe « enterra » n’est pas nommé dans ce verset ; d’après le contexte précédent, il s’agit du SEIGNEUR.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: Il l’enterra
  rationale: Le qal narratif à la 3e personne du masculin singulier est rendu activement. Le pronom « il » conserve l’absence de sujet explicitement nommé dans ce verset.
- source_word: בַגַּיְ
  choice: dans la vallée
  rationale: « Vallée » est naturel, clair et suffisamment précis pour גַּיְ dans ce contexte.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: au pays de Moab
  rationale: Cette formulation française naturelle préserve l’expression concrète « pays de Moab ».
- source_word: מוּל
  choice: en face de
  rationale: Rend clairement la relation spatiale indiquée par מוּל, dans un registre courant et digne.
- source_word: בֵּית פְּעוֹר
  choice: Beth-Péor
  rationale: Translittération française usuelle du nom de lieu, avec accentuation facilitant la lecture.
- source_word: וְלֹא יָדַע אִישׁ
  choice: personne ne connaît
  rationale: אִישׁ a ici une portée générique. « Personne » exprime naturellement cette valeur inclusive en français moderne sans suggérer que seules les personnes de sexe masculin sont visées.
- source_word: קְבֻרָתוֹ
  choice: le lieu où il a été enterré
  rationale: Dans ce contexte, le nom désigne le lieu de l’ensevelissement. Cette tournure claire évite l’ambiguïté possible de « son ensevelissement » entre l’acte et le lieu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Expression française consacrée qui conserve le point de vue temporel du narrateur.
theological_decisions:
- issue: Identité du sujet de « Il l’enterra »
  choice: Conserver le sujet pronominal non identifié dans le texte principal.
  alternative: Nommer explicitement le SEIGNEUR, d’après le contexte du verset précédent, ou employer une tournure passive.
  rationale: Le contexte désigne fortement le SEIGNEUR comme antécédent, mais le verset lui-même ne nomme pas le sujet. Le pronom préserve cette discrétion grammaticale et la tension du texte.
- issue: Portée générique de אִישׁ
  choice: personne
  alternative: aucun homme
  rationale: Le masculin singulier hébreu est employé génériquement. En français contemporain, « personne » en restitue plus exactement la portée sémantique naturelle.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques peu idiomatiques. Le pronom initial préserve l’ambiguïté formelle du sujet, explicitée seulement en note.
