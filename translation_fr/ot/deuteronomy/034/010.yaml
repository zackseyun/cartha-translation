source:
  edition: WLC
  text: וְ/לֹֽא קָ֨ם נָבִ֥יא ע֛וֹד בְּ/יִשְׂרָאֵ֖ל כְּ/מֹשֶׁ֑ה אֲשֶׁר֙ יְדָע֣/וֹ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: fr
  text: Depuis lors, aucun prophète comme Moïse ne s’est levé en Israël[a], lui que Yahweh connaissait face à face.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jusqu’à présent, aucun prophète comme Moïse ne s’est levé en Israël. » L’adverbe hébreu peut marquer le temps écoulé après Moïse jusqu’au point de vue du narrateur.'
    reason: alternative lexicale et temporelle pour עוֹד
lexical_decisions:
- source_word: וְלֹא קָם
  choice: Depuis lors, aucun … ne s’est levé
  rationale: Le parfait de קום décrit l’apparition d’un prophète dans un bilan rétrospectif. En français, « ne s’est levé » rend naturellement cette valeur; « depuis lors » exprime conjointement la continuité narrative et la portée temporelle de עוֹד.
- source_word: נָבִיא
  choice: prophète
  rationale: Équivalent français courant et précis du terme hébreu.
- source_word: עוֹד
  choice: depuis lors
  rationale: Dans ce contexte conclusif, l’adverbe indique qu’après Moïse aucun prophète comparable ne s’est levé jusqu’au point de vue du narrateur. « Depuis lors » est idiomatique, tout en laissant en note l’autre nuance possible, « jusqu’à présent ».
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition בְּ désigne ici la sphère au sein de laquelle aucun prophète comparable n’est apparu.
- source_word: כְּמֹשֶׁה
  choice: comme Moïse
  rationale: Rend directement et naturellement la comparaison introduite par כְּ.
- source_word: אֲשֶׁר יְדָעוֹ יְהוָה
  choice: lui que Yahweh connaissait
  rationale: Le pronom « lui » rattache clairement la relative à Moïse, objet du verbe ידע. L’imparfait français « connaissait » convient à cette relation caractéristique, et le nom divin est translittéré « Yahweh ».
- source_word: פָּנִים אֶל פָּנִים
  choice: face à face
  rationale: Cette traduction conserve l’image concrète et la résonance intertextuelle de l’expression hébraïque, sans la réduire à une abstraction comme « directement » ou « personnellement ».
theological_decisions:
- issue: Langage anthropomorphique décrivant la relation entre Yahweh et Moïse
  choice: Conserver « face à face »
  alternative: « personnellement » ou « directement »
  rationale: L’hébreu emploie une image relationnelle concrète qui souligne l’immédiateté unique de la révélation accordée à Moïse. La traduction préserve cette tension sans préciser indûment ce qu’elle implique quant à la corporéité divine.
- issue: Sens relationnel de ידע
  choice: « connaissait »
  alternative: « avait connu » ou « reconnaissait »
  rationale: Le sens simple « connaître » respecte le texte et laisse l’expression « face à face » caractériser cette connaissance, sans lui imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la solennité du bilan final sans archaïsme. « Se lever » maintient l’image hébraïque tout en restant naturel dans le langage biblique français; « lui que » évite l’ambiguïté de rattachement de la proposition relative.
