  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: fr
  text: Josué, fils de Noun, était rempli d’un esprit de sagesse[a], car Moïse avait posé les mains sur lui. Les fils d’Israël l’écoutèrent et agirent conformément à ce que Yahweh avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était rempli de l’Esprit de sagesse ». L’hébreu peut désigner plus généralement un esprit caractérisé par la sagesse ou, plus précisément, une habilitation divine.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: était rempli d’un esprit de sagesse
  rationale: Cette formulation naturelle en français conserve la construction hébraïque et laisse ouverte la question de savoir s’il s’agit d’une disposition sage ou d’une habilitation divine particulière.
- source_word: רוּחַ
  choice: esprit
  rationale: Dans ce contexte, le mot désigne un esprit ou une capacité qui confère la sagesse. La minuscule évite d’identifier explicitement ce terme au Saint-Esprit au-delà de ce qu’impose l’hébreu.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: avait posé les mains sur lui
  rationale: « Poser les mains sur quelqu’un » est l’expression française courante pour cet acte officiel de transmission ou d’investiture.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: l’écoutèrent
  rationale: Le verbe avec אֶל exprime ici une écoute attentive qui implique l’obéissance; la proposition suivante rend cette obéissance explicite.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction garde la forme familiale masculine de l’hébreu et sa portée d’identité collective et d’alliance.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: agirent conformément à ce que Yahweh avait ordonné à Moïse
  rationale: Cette tournure française claire exprime que leur conduite s’est conformée au commandement antérieurement donné à Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin propre plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Faut-il comprendre רוּחַ חָכְמָה comme une référence explicite au Saint-Esprit?
  choice: « un esprit de sagesse », avec une minuscule
  alternative: « l’Esprit de sagesse », comme référence explicite à l’Esprit divin
  rationale: Le contexte indique une habilitation liée à l’imposition des mains de Moïse, mais la formulation hébraïque ne tranche pas explicitement l’identité de cet esprit; la traduction préserve cette tension.
- issue: Comment rendre בְּנֵי יִשְׂרָאֵל?
  choice: « les fils d’Israël »
  alternative: « les Israélites » ou « les enfants d’Israël »
  rationale: La formulation retenue conserve le langage familial masculin et collectif du texte source, sans le neutraliser.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Yahweh » conserve le nom divin; « les fils d’Israël » maintient l’expression familiale du texte hébreu.
