  text: וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/חוֹמַ֣ת רַבָּ֔ה וְ/אָכְלָ֖ה אַרְמְנוֹתֶ֑י/הָ בִּ/תְרוּעָה֙ בְּ/י֣וֹם מִלְחָמָ֔ה בְּ/סַ֖עַר בְּ/י֥וֹם סוּפָֽה
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/014.yaml
  text: I will kindle a fire in the wall of Rabbah[a], and it will consume her citadels, with a battle cry on the day of war[c][b], with a storm on the day of tempest.
translation:
  language: fr
  text: J’allumerai un feu dans la muraille de Rabba, et il dévorera ses palais[a], au cri de guerre[b], au jour du combat, dans la tempête, au jour de la tempête[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses citadelles » ou « ses forteresses ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « cri de guerre » peut aussi désigner une forte clameur d’alarme, parfois accompagnée d’une sonnerie de trompette.
    reason: lexical_alternative
  - marker: c
    text: Les images de tempête peuvent évoquer le jugement du Seigneur comme guerrier divin, tout en s’intégrant à la scène immédiate d’une destruction militaire.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: J’allumerai
  rationale: Le hiphil exprime l’action de mettre le feu; dans cet oracle de jugement, l’accompli précédé de וְ a une valeur future. « J’allumerai » est naturel et conserve le sens causatif.
- source_word: בְּחוֹמַת רַבָּה
  choice: dans la muraille de Rabba
  rationale: La préposition ב est rendue sans surinterprétation par « dans ». « Muraille » désigne clairement l’enceinte fortifiée de la capitale ammonite, dont le nom propre est transcrit « Rabba ».
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: Le feu est le sujet implicite du verbe. « Dévorer » conserve l’image vive et courante du feu destructeur.
- source_word: אַרְמְנוֹתֶיהָ
  choice: ses citadelles
  rationale: אַרְמוֹן peut désigner un palais ou un édifice fortifié. Dans un contexte d’assaut contre une ville, « citadelles » rend bien cette amplitude sans limiter le mot à des résidences royales.
- source_word: בִּתְרוּעָה
  choice: au cri de guerre
  rationale: תְּרוּעָה désigne une forte clameur ou un signal d’alarme, parfois lié à la sonnerie d’une trompette. Le contexte militaire favorise « cri de guerre », sans exclure entièrement l’idée d’alarme.
- source_word: בְּיוֹם מִלְחָמָה
  choice: au jour du combat
  rationale: Cette formulation temporelle est concise et idiomatique; « combat » convient au tableau immédiat de l’assaut tout en conservant le cadre guerrier.
- source_word: בְּסַעַר
  choice: dans la tempête
  rationale: סַעַר évoque une tempête ou un vent violent. « Dans la tempête » conserve l’image météorologique et le parallélisme poétique.
- source_word: בְּיוֹם סוּפָה
  choice: au jour de l’ouragan
  rationale: סוּפָה désigne une violente tempête, voire un tourbillon. « Ouragan » marque l’intensification poétique après « tempête » sans reproduire exactement le même terme.
theological_decisions:
- issue: Nature des images du jugement
  choice: Le texte présente une dévastation militaire réelle au moyen d’images de feu et de tempête, sans imposer une lecture exclusivement théophanique.
  alternative: Les images de tempête peuvent également évoquer le Seigneur comme guerrier divin exerçant son jugement souverain.
  rationale: L’hébreu associe explicitement le cri de guerre et le jour du combat à la tempête et à l’ouragan. La traduction maintient ensemble ces deux registres sans décider si la tempête est littérale, métaphorique, providentielle ou théophanique.
- issue: Référent du suffixe féminin dans אַרְמְנוֹתֶיהָ
  choice: Le possessif « ses » renvoie à la ville de Rabba.
  alternative: Rendre le possessif de manière impersonnelle comme s’il se rapportait seulement aux bâtiments.
  rationale: En hébreu, la ville est personnifiée au féminin. Le possessif français « ses » conserve le rapport à Rabba, même si le français n’en marque pas explicitement le genre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme en quatre groupes prépositionnels restitue la cadence poétique de l’hébreu. « Citadelles », « tempête » et « ouragan » gardent la force imagée sans vocabulaire archaïque.
