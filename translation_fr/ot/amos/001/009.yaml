  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Pour trois crimes de Tyr, et pour quatre, je ne révoquerai pas son châtiment[a], parce qu’ils ont livré à Édom un groupe entier de déportés[b] et n’ont pas gardé mémoire d’une alliance de frères[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je ne le ferai pas revenir » ou « je ne le retirerai pas » ; l’objet n’est pas précisé en hébreu. Le sens paraît être que le jugement annoncé ne sera pas retiré.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toute une communauté de déportés » ou « une déportation entière ». L’expression hébraïque désigne un groupe complet de captifs ou de déportés.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « une alliance de frères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique solennelle et naturelle en français ; le nom divin est transcrit « Yahweh ».
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי צֹר וְעַל אַרְבָּעָה
  choice: Pour trois révoltes de Tyr, et même pour quatre
  rationale: Conserve la progression numérique idiomatique d’Amos. « Révoltes » exprime la portée morale et relationnelle de פֶּשַׁע sans suggérer de simples infractions techniques.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas son châtiment
  rationale: Rend explicitement le sens judiciaire probable de l’expression, tout en signalant en note que l’objet demeure implicite en hébreu.
- source_word: הַסְגִּירָם
  choice: ils ont livré
  rationale: Le hiphil de סגר désigne ici la remise de personnes à une autre puissance ; « livrer » convient au ton grave de l’accusation.
- source_word: גָּלוּת שְׁלֵמָה
  choice: toute une population de déportés
  rationale: Exprime le caractère collectif et complet du groupe livré, sans réduire גָּלוּת à l’idée abstraite de déportation.
- source_word: לֶאֱדוֹם
  choice: à Édom
  rationale: Rend simplement la destination ou le bénéficiaire de la livraison.
- source_word: וְלֹא זָכְרוּ
  choice: et n’ont pas tenu compte
  rationale: Dans ce contexte d’alliance, « se souvenir » implique une conduite conforme à l’engagement ; cette formulation naturelle en français rend cette portée pragmatique.
- source_word: בְּרִית אַחִים
  choice: une alliance entre frères
  rationale: Préserve à la fois le terme d’alliance et l’image littérale des frères, sans déterminer la nature historique précise du lien.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Objet implicite dans לֹא אֲשִׁיבֶנּוּ
  choice: Expliciter le sens par « je ne révoquerai pas son châtiment »
  alternative: « je ne le ramènerai pas » ou « je ne reviendrai pas dessus »
  rationale: La formule récurrente annonce que le jugement ne sera pas retiré, mais l’ambiguïté grammaticale de l’objet est préservée dans la note.
- issue: Nature de בְּרִית אַחִים
  choice: une alliance entre frères
  alternative: une alliance fraternelle ; une alliance de frères
  rationale: Cette traduction conserve la tension entre fraternité littérale, parenté politique et relation conventionnelle, sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe conserve le rythme de l’oracle prophétique. Les notes maintiennent les ambiguïtés lexicales réelles de l’hébreu.
