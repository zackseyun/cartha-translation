  - severity: medium
    issue: « Révoltes » pour פְּשָׁעִים
    rationale: Le terme peut évoquer spécifiquement une insurrection ou une rébellion. Dans cette série d’oracles, le mot désigne plus largement des fautes graves ou crimes ; « crimes » est plus exact sans affaiblir l’accusation.
  - severity: low
    issue: Ajout de « même » dans la formule numérique
    rationale: La formule hébraïque dit littéralement « pour trois… et pour quatre ». L’escalade est idiomatique, mais « même » ajoute une accentuation qui n’est pas lexicalement marquée.
  - severity: low
    issue: Rendu interprétatif de זכר
    rationale: « N’ont pas tenu compte » communique une conséquence éthique légitime, mais remplace le verbe « se souvenir ». Une formulation qui garde l’idée de mémoire préserve mieux le choix lexical et l’ambiguïté entre souvenir et fidélité agissante.
