  rationale: La révision resserre le texte sur les choix lexicaux de l’hébreu tout en conservant un français moderne et solennel. Elle supprime l’intensification ajoutée par « même », emploie « crimes » pour le terme d’accusation prophétique, préserve le champ sémantique de « se souvenir », et garde dans le texte comme en note l’ambiguïté de l’expression « alliance de frères ». Les ancres de notes correspondent chacune au segment qu’elles expliquent.
