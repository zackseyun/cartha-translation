  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/בֵ֣ית חֲזָאֵ֑ל וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/004.yaml
  text: So I will send fire upon the house of Hazael[a], and it will consume the citadels of Ben-hadad.
translation:
  language: fr
  text: J’enverrai le feu sur la maison de Hazaël, et il dévorera les palais[a] de Ben-Hadad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « citadelles » ou « places fortes » ; le terme hébreu peut désigner des palais ou des édifices fortifiés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Alors j’enverrai
  rationale: Le piel de שׁלח signifie « envoyer ». Le waw relie cette sentence à l’accusation précédente et prend ici naturellement une valeur consécutive, rendue par « Alors ».
- source_word: אֵשׁ
  choice: le feu
  rationale: Le nom désigne concrètement le feu. Même s’il évoque ici la guerre et le jugement destructeur, l’image prophétique est conservée.
- source_word: בְּבֵית חֲזָאֵל
  choice: contre la maison de Hazaël
  rationale: Après « envoyer le feu », la préposition ב marque la cible. « Maison » préserve la possibilité d’un palais, d’une famille royale ou d’une dynastie.
- source_word: חֲזָאֵל
  choice: Hazaël
  rationale: Translittération française usuelle du nom propre.
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: Avec le feu pour sujet, אכל signifie idiomatiquement « dévorer » ou « consumer ». « Dévorera » conserve l’image vive du verbe hébreu tout en restant naturel en français.
- source_word: אַרְמְנוֹת
  choice: les palais fortifiés
  rationale: אַרְמוֹן peut désigner un palais ou une citadelle. « Palais fortifiés » maintient dans le texte les dimensions royale et défensive sans réduire le terme à une seule.
- source_word: בֶּן הֲדָד
  choice: Ben-Hadad
  rationale: Translittération conventionnelle du nom royal ou dynastique présenté comme nom propre dans l’hébreu.
theological_decisions:
- issue: Sens de « maison de Hazaël »
  choice: Conserver « maison », avec sa portée potentiellement dynastique et royale
  alternative: Limiter l’expression au palais ou au bâtiment de Hazaël
  rationale: Le langage prophétique peut viser la famille régnante ou la dynastie aussi bien qu’un édifice. La formulation française préserve cette amplitude.
- issue: Nature du feu
  choice: Maintenir l’image concrète du feu
  alternative: Paraphraser par « destruction militaire » ou « jugement divin »
  rationale: Le texte présente le feu comme l’instrument du jugement; conserver l’image évite de transformer une métaphore prophétique en explication.
translation_notes:
  register: Français international moderne, digne et accessible. « Alors » exprime le lien conséquent avec le contexte précédent. « Palais fortifiés » rend la double portée possible de אַרְמְנוֹת, explicitée en note.
