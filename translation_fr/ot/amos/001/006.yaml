source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י עַזָּ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל הַגְלוֹתָ֛/ם גָּל֥וּת שְׁלֵמָ֖ה לְ/הַסְגִּ֥יר לֶ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Gaza[a], and for four, I will not revoke its punishment[b], because they carried away an entire population into exile to hand them over to Edom.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Pour trois transgressions de Gaza, et pour quatre, je ne révoquerai pas son châtiment[a], parce qu’ils ont déporté une population entière pour la livrer à Édom[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne le ramènerai pas ». Dans cette formule de jugement, il s’agit vraisemblablement de ne pas révoquer le châtiment annoncé.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « ils ont déporté tout un groupe de captifs » ; l’expression hébraïque souligne le caractère total de la déportation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin et suit la convention du projet.
- source_word: פִּשְׁעֵי
  choice: révoltes
  rationale: Le terme פשע évoque des actes de rupture et de rébellion; « révoltes » en conserve la force morale sans le réduire à de simples fautes.
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  choice: Pour trois… et pour quatre
  rationale: Conserve la formule numérique croissante caractéristique d’Amos, sans la réduire à un décompte strictement littéral.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas son châtiment
  rationale: Le sens littéral est « je ne le ramènerai pas »; dans cette formule de jugement, le pronom renvoie vraisemblablement au châtiment annoncé. La formulation française explicite cet objet implicite.
- source_word: הַגְלוֹתָם גָּלוּת שְׁלֵמָה
  choice: ils ont déporté une population entière
  rationale: Rend naturellement en français l’idée d’une déportation totale ou d’un groupe entier emmené en captivité.
- source_word: לְהַסְגִּיר
  choice: pour la livrer
  rationale: Exprime le transfert des captifs sous le pouvoir d’Édom; le pronom féminin reprend « population ».
- source_word: לֶאֱדוֹם
  choice: à Édom
  rationale: Forme française usuelle du nom du peuple et du territoire.
theological_decisions:
- issue: Objet implicite de לֹא אֲשִׁיבֶנּוּ
  choice: Expliciter « son châtiment » dans le texte.
  alternative: « je ne le révoquerai pas » ou « je ne reviendrai pas là-dessus »
  rationale: L’hébreu laisse l’objet implicite, mais la formule récurrente d’Amos annonce un jugement irrévocable. Une note signale la formulation littérale afin de préserver l’ambiguïté grammaticale.
- issue: Portée de גָּלוּת שְׁלֵמָה
  choice: « une population entière »
  alternative: « tous les captifs » ou « une captivité complète »
  rationale: La phrase souligne le caractère total de la déportation sans permettre de déterminer avec certitude s’il s’agit de toute une population ou d’un groupe complet de captifs; la note maintient cette nuance.
translation_notes:
  register: Français international actuel, digne et accessible. La cadence prophétique « Pour trois… et pour quatre » est conservée. « Ainsi parle » maintient le registre solennel de la formule du messager sans archaïsme excessif.
