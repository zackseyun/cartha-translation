source:
  edition: WLC
  text: וְ/שָֽׁבַרְתִּי֙ בְּרִ֣יחַ דַּמֶּ֔שֶׂק וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מִ/בִּקְעַת אָ֔וֶן וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מִ/בֵּ֣ית עֶ֑דֶן וְ/גָל֧וּ עַם אֲרָ֛ם קִ֖ירָ/ה אָמַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/005.yaml
  text: I will break the gate-bar of Damascus[a], and I will cut off the inhabitant from the Valley of Aven and the one who holds the scepter from Beth-eden[b]; and the people of Aram will go into exile to Kir,” says Yahweh.
translation:
  language: fr
  text: Je briserai la barre de la porte de Damas et je retrancherai l’habitant de la vallée d’Aven[a], ainsi que celui qui tient le sceptre de Beth-Éden[b]. Le peuple d’Aram partira en exil à Kir, dit Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Aven » peut évoquer en hébreu le mal, l’iniquité ou le malheur. Il s’agit probablement ici d’un nom de lieu comportant peut-être un jeu de mots prophétique.
    reason: lexical_alternative
  - marker: b
    text: « Beth-Éden » peut aussi se traduire littéralement par « maison d’Éden » ; certains rapprochent ce lieu de Bit-Adini.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁבַרְתִּי בְּרִיחַ דַּמֶּשֶׂק
  choice: Je briserai la barre des portes de Damas
  rationale: Le parfait prophétique a ici une valeur future. בְּרִיחַ désigne la barre qui verrouille une porte; le pluriel «des portes» explicite naturellement en français la fortification de la ville sans modifier l’image.
- source_word: וְהִכְרַתִּי
  choice: je retrancherai
  rationale: Ce verbe exprime une suppression décisive, souvent destructrice. «Retrancher» conserve la métaphore hébraïque et le registre prophétique.
- source_word: יוֹשֵׁב
  choice: l’habitant
  rationale: Le participe singulier peut représenter collectivement les habitants. Cette traduction directe évite d’imposer le sens plus précis de «dirigeant».
- source_word: מִבִּקְעַת אָוֶן
  choice: de la vallée d’Aven
  rationale: בִּקְעָה signifie «vallée» ou «plaine» et אָוֶן fonctionne vraisemblablement comme un nom de lieu, avec un possible jeu de mots prophétique signalé en note.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: ainsi que celui qui tient le sceptre
  rationale: La formulation conserve l’image concrète du détenteur du bâton royal, donc de l’autorité, sans la réduire simplement à «le roi».
- source_word: מִבֵּית עֶדֶן
  choice: à Beth-Éden
  rationale: Le syntagme est traité comme un toponyme. Après «retrancher», le français emploie naturellement «à» pour le lieu où se trouve la personne supprimée.
- source_word: וְגָלוּ
  choice: partira en exil
  rationale: Le verbe décrit le départ en exil ou la déportation. Le singulier s’accorde avec le collectif «le peuple» et ne précise pas un agent absent de la proposition.
- source_word: עַם אֲרָם
  choice: Le peuple d’Aram
  rationale: «Aram» préserve le nom ethnogéographique hébreu au lieu de lui substituer le terme historique plus tardif «Syrie».
- source_word: קִירָה
  choice: à Kir
  rationale: Le suffixe directionnel indique un mouvement vers Kir; «à» rend naturellement cette destination en français.
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: Le présent français convient à la formule prophétique, et le nom divin est translittéré conformément à sa forme personnelle dans le texte source.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. «Yahweh» conserve le nom propre divin plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
- issue: Identité de יוֹשֵׁב et de תוֹמֵךְ שֵׁבֶט
  choice: 'Maintien de deux désignations distinctes: «l’habitant» et «celui qui tient le sceptre»'
  alternative: Interpréter les deux expressions comme désignant uniquement les souverains
  rationale: Le parallélisme peut évoquer population et autorité, ou deux figures représentatives, mais le texte ne permet pas de réduire avec certitude יוֹשֵׁב à «souverain». La traduction préserve cette tension.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe prophétique ferme. Les images concrètes de la barre, du retranchement et du sceptre sont conservées. Les noms Aram, Aven, Beth-Éden, Kir et Yahweh sont translittérés sous des formes lisibles en français.
