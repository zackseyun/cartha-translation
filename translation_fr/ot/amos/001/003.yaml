base_translation:
  language: en
  yaml_path: translation/ot/amos/001/003.yaml
  text: 'Thus says Yahweh: “For three transgressions of Damascus[a], and for four, I will not revoke it, because they threshed Gilead with threshing sledges of iron.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh :


    « Pour trois transgressions de Damas,


    et pour quatre,


    je ne le révoquerai pas[a],


    parce qu’ils ont battu Galaad


    avec des traîneaux de dépiquage en fer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne le ferai pas revenir » ou « je ne le retirerai pas ». Le pronom renvoie à une réalité laissée implicite dans l’hébreu; dans ce contexte de jugement, il peut désigner la décision annoncée.'
    reason: alternative_lexical
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Conserve la formule solennelle du messager prophétique et rend directement le nom divin יהוה par « Yahweh ».
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל אַרְבָּעָה
  choice: Pour trois révoltes de Damas, et pour quatre
  rationale: Préserve la progression numérique caractéristique d’Amos. « Révoltes » rend פשׁע comme une violation grave et rebelle, sans employer le terme plus général « péchés ».
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne le révoquerai pas
  rationale: Le suffixe objet est maintenu par « le », tandis que le verbe exprime l’idée de ne pas revenir sur la décision annoncée sans ajouter explicitement « châtiment », absent de l’hébreu.
- source_word: עַל דּוּשָׁם
  choice: parce qu’ils ont foulé
  rationale: Le second עַל introduit le motif du jugement. « Foulé » conserve l’image agricole de דושׁ tout en évoquant naturellement l’écrasement brutal.
- source_word: בַּחֲרֻצוֹת הַבַּרְזֶל
  choice: avec des traîneaux à dépiquer en fer
  rationale: Désigne clairement en français l’instrument agricole à lames ou pointes utilisé pour séparer le grain, ici employé comme image de violence destructrice.
- source_word: אֶת הַגִּלְעָד
  choice: Galaad
  rationale: Emploie la forme française traditionnelle et courante du nom régional; la région représente collectivement son territoire et ses habitants.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre divin; « Yahweh » le distingue d’un titre et reflète directement le tétragramme.
- issue: Objet implicite dans לֹא אֲשִׁיבֶנּוּ
  choice: je ne le révoquerai pas
  alternative: je ne reviendrai pas dessus; je ne révoquerai pas le châtiment
  rationale: Le français conserve le pronom dont le référent reste implicite, comme dans l’hébreu, au lieu de résoudre silencieusement l’ellipse en ajoutant « châtiment ».
- issue: Portée de l’image du dépiquage de Galaad
  choice: foulé Galaad avec des traîneaux à dépiquer en fer
  alternative: écrasé les habitants de Galaad avec des instruments de fer
  rationale: La formulation garde la personnification géographique et la métaphore agricole du texte, sans préciser au-delà de celui-ci la nature exacte des victimes ou des événements.
translation_notes:
  register: Français international moderne, solennel mais accessible. La disposition en lignes fait ressortir la formule numérique et le motif du jugement. « Traîneaux à dépiquer » privilégie la précision concrète sans archaïsme excessif.
