source:
  edition: WLC
  text: דִּבְרֵ֣י עָמ֔וֹס אֲשֶׁר הָיָ֥ה בַ/נֹּקְדִ֖ים מִ/תְּק֑וֹעַ אֲשֶׁר֩ חָזָ֨ה עַל יִשְׂרָאֵ֜ל בִּ/ימֵ֣י עֻזִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה וּ/בִ/ימֵ֞י יָרָבְעָ֤ם בֶּן יוֹאָשׁ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל שְׁנָתַ֖יִם לִ/פְנֵ֥י הָ/רָֽעַשׁ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/001.yaml
  text: The words of Amos[a], who was among the shepherds from Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah and in the days of Jeroboam son of Joash, king of Israel[b], two years before the earthquake.
translation:
  language: fr
  text: Paroles qu’Amos, qui faisait partie des éleveurs de moutons de Tekoa, a vues au sujet d’Israël[a], à l’époque d’Ozias, roi de Juda, et à l’époque de Jéroboam, fils de Joas, roi d’Israël, deux ans avant le tremblement de terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre Israël ». Dans un contexte prophétique, la préposition hébraïque peut avoir les deux sens.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Paroles de
  rationale: Le pluriel construit introduit le livre prophétique. « Paroles de » est une formule de suscription naturelle et proche de l’hébreu.
- source_word: בַנֹּקְדִים
  choice: l’un des éleveurs de moutons
  rationale: נֹקֵד désigne vraisemblablement un éleveur de petit bétail, plus précisément de moutons, plutôt qu’un simple berger. La tournure rend aussi la préposition « parmi » de manière idiomatique.
- source_word: מִתְּקוֹעַ
  choice: de Teqoa
  rationale: La préposition מן marque ici l’origine géographique. « Teqoa » translittère le nom hébreu תְּקוֹעַ.
- source_word: חָזָה
  choice: a vues
  rationale: Le verbe signifie « voir » et possède ici son sens prophétique. Le maintien de « voir » conserve l’expression inhabituelle mais intentionnelle selon laquelle Amos a « vu » des paroles.
- source_word: עַל יִשְׂרָאֵל
  choice: au sujet d’Israël
  rationale: עַל peut signifier « au sujet de » ou « contre » dans un contexte prophétique. La première option convient mieux à une suscription générale sans exclure les annonces de jugement.
- source_word: בִּימֵי ... וּבִימֵי
  choice: à l’époque de ... et à l’époque de
  rationale: Cette formulation française actuelle rend naturellement l’expression temporelle hébraïque sans supposer que la référence porte uniquement sur la durée officielle des règnes.
- source_word: שְׁנָתַיִם לִפְנֵי הָרָעַשׁ
  choice: deux ans avant le tremblement de terre
  rationale: Traduction directe de l’indication chronologique, avec l’article défini qui renvoie à un événement alors connu.
theological_decisions:
- issue: Rapport entre les « paroles » et le verbe « voir » dans la suscription prophétique
  choice: Conserver la construction « Paroles ... qu’il a vues »
  alternative: Reformuler par « message qu’Amos a reçu dans une vision » ou séparer paroles et visions
  rationale: L’hébreu fait formellement des « paroles » l’objet de « voir », associant message verbal et révélation visionnaire. Garder cette tension évite une explicitation interprétative.
- issue: Valeur de עַל devant Israël
  choice: au sujet d’Israël
  alternative: contre Israël
  rationale: Les deux valeurs sont possibles dans le discours prophétique. La traduction retenue est la plus large pour une suscription couvrant l’ensemble du livre, tandis que l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve volontairement l’expression prophétique « paroles ... vues ». « Éleveurs de moutons » privilégie la précision lexicale tout en restant compréhensible.
