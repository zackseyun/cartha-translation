revisions:
- from: Paroles d’Amos, qui était l’un des éleveurs de moutons de Teqoa, et qu’il a vues au sujet d’Israël[a], à l’époque d’Ozias, roi de Juda, et à l’époque de Jéroboam, fils de Joas, roi d’Israël, deux ans avant le tremblement de terre.
  to: Paroles qu’Amos, qui faisait partie des éleveurs de moutons de Tekoa, a vues au sujet d’Israël[a], à l’époque d’Ozias, roi de Juda, et à l’époque de Jéroboam, fils de Joas, roi d’Israël, deux ans avant le tremblement de terre.
  rationale: La révision résout la faute de syntaxe sans expliciter le caractère visionnaire ni modifier la relation inhabituelle, mais délibérée, entre les paroles et l’acte de voir. La note demeure correctement ancrée à « Israël » et préserve l’ambiguïté de עַל.
