  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/ח֣וֹמַת צֹ֑ר וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/010.yaml
  text: So I will send fire upon the wall of Tyre[a], and it will consume her citadels.
translation:
  language: fr
  text: J’enverrai un feu contre la muraille de Tyr, et il dévorera ses citadelles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses palais ». Le terme hébreu peut désigner des bâtiments palatiaux ou des forteresses.
    reason: Alternative lexicale reflétant l’étendue sémantique de אַרְמוֹן.
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai donc
  rationale: Le parfait consécutif à la première personne exprime ici l’annonce prophétique à venir. « Donc » relie naturellement la sentence au réquisitoire précédent, tout en conservant la valeur de la conjonction.
- source_word: אֵשׁ
  choice: le feu
  rationale: Équivalent direct et naturel, qui conserve l’image du jugement destructeur sans préciser si son accomplissement sera littéral, militaire ou métaphorique.
- source_word: בְּחוֹמַת
  choice: contre la muraille
  rationale: La préposition בְּ peut ici indiquer la cible. « Contre » convient en français à un feu dirigé vers l’enceinte d’une ville, tandis que « muraille » désigne naturellement sa fortification.
- source_word: צֹר
  choice: Tyr
  rationale: Forme française traditionnelle et actuelle du nom de la ville phénicienne.
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: Le verbe signifie littéralement « manger » et s’emploie couramment pour un feu qui dévore. Cette formulation française conserve la force de l’image hébraïque.
- source_word: אַרְמְנֹתֶיהָ
  choice: ses citadelles
  rationale: אַרְמוֹן peut désigner des palais ou des bâtiments fortifiés. Dans un oracle visant la muraille d’une ville, « citadelles » rend bien la dimension monumentale et défensive, sans exclure entièrement le caractère palatial.
theological_decisions:
- issue: Nature du feu dans l’annonce du jugement
  choice: Conserver l’image selon laquelle Dieu envoie un feu qui dévore les édifices fortifiés de Tyr, sans en définir le mécanisme.
  alternative: Préciser qu’il s’agit soit d’un incendie littéral envoyé par Dieu, soit d’une métaphore de l’invasion militaire.
  rationale: L’hébreu ne tranche pas entre ces modalités. La traduction préserve donc l’ambiguïté et la tension propres à l’annonce prophétique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste concise pour restituer la formule prophétique de jugement. « Dévorera » maintient l’image vive de l’hébreu, et « citadelles » convient au contexte urbain fortifié.
