    rationale: Le terme hébreu désigne des transgressions, crimes ou actes de rébellion; dans la formule d’Amos, « transgressions » est plus précis et plus établi en français biblique moderne.
  - severity: low
    issue: La formulation de la note « je ne reviendrai pas dessus » est familière.
    rationale: Une note lexicale devrait conserver un registre éditorial soutenu et signaler plus directement l’image verbale hébraïque de ne pas “faire revenir” ou retirer le jugement.
