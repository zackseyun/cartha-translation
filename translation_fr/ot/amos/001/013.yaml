source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י בְנֵֽי עַמּ֔וֹן וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל בִּקְעָ/ם֙ הָר֣וֹת הַ/גִּלְעָ֔ד לְמַ֖עַן הַרְחִ֥יב אֶת גְּבוּלָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/013.yaml
  text: 'Thus says Yahweh: “For three transgressions of the sons of Ammon[a], and for four, I will not revoke it[b], because they ripped open the pregnant women of Gilead in order to enlarge their border.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « À cause de trois transgressions des Ammonites, et même de quatre, je ne révoquerai pas mon jugement[a], parce qu’ils ont éventré les femmes enceintes de Galaad afin d’agrandir leur territoire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne le ramènerai pas » ou « je ne le ferai pas revenir » ; le contexte désigne le jugement annoncé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Rend de façon digne et naturelle la formule prophétique de messager, tout en représentant directement le nom divin.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  choice: Pour trois révoltes… et même pour quatre
  rationale: Préserve la progression numérique rhétorique. « Révoltes » conserve la dimension de rupture et de rébellion de פֶּשַׁע; « et même » exprime naturellement en français l’intensification de trois à quatre.
- source_word: בְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Équivalent français naturel de l’expression ethnique littérale « fils d’Ammon », qui sonnerait artificielle ou pourrait être comprise comme désignant seulement des hommes.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas mon jugement
  rationale: Le pronom hébreu a un référent implicite. « Mon jugement » explicite sobrement le châtiment annoncé et évite un « je ne le révoquerai pas » obscur en français; la note conserve la formulation plus littérale.
- source_word: בִּקְעָם הָרוֹת הַגִּלְעָד
  choice: ils ont éventré les femmes enceintes de Galaad
  rationale: « Éventré » rend avec précision et sans euphémisme la violence de בּקע dans ce contexte. « De Galaad » rattache naturellement les victimes à la région.
- source_word: לְמַעַן הַרְחִיב אֶת גְּבוּלָם
  choice: afin d’agrandir leur territoire
  rationale: Rend clairement le but. Ici, גְּבוּל désigne par métonymie l’étendue territoriale plutôt que la seule ligne frontalière.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération permet d’identifier le nom propre présent dans l’hébreu sans le remplacer par un titre.
- issue: Référent implicite de לֹא אֲשִׁיבֶנּוּ
  choice: mon jugement
  alternative: je ne le révoquerai pas / je ne reviendrai pas dessus
  rationale: Le contexte de l’oracle indique un jugement qui ne sera pas retiré, mais l’hébreu ne nomme pas explicitement son référent. Le texte français l’explicite pour être intelligible, tandis que la note signale la littéralité et l’ambiguïté de l’expression.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formule oraculaire et la progression « trois… quatre » sont conservées; la description de l’atrocité reste directe, conformément à l’hébreu.
