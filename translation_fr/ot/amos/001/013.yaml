  to: 'Ainsi parle Yahweh : « À cause de trois transgressions des Ammonites, et même de quatre, je ne révoquerai pas mon jugement[a], parce qu’ils ont éventré les femmes enceintes de Galaad afin d’agrandir leur territoire. »'
  rationale: La révision remplace « révoltes » par « transgressions », qui rend plus exactement פְּשָׁעִים dans le cadre de la formule récurrente d’Amos. Elle améliore aussi la note sans modifier le sens ni masquer le référent implicite du pronom hébreu.
