  verdict: revise
  source_fidelity: 'Le sens de l’oracle est fidèlement rendu : la formule numérique, l’atrocité commise contre les femmes enceintes de Galaad et le but territorial sont conservés. « Mon jugement » explicite de façon sobre le référent implicite de לֹא אֲשִׁיבֶנּוּ, que le contexte identifie au jugement annoncé.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « Transgressions » est toutefois plus exact et plus idiomatique que « révoltes » dans cette formule judiciaire prophétique. La note proposée est également formulée plus naturellement et évite « revenir dessus », trop familier.
  terminology: « Yahweh », « Ammonites » et « Galaad » sont cohérents. « Transgressions » conserve mieux la portée morale et juridique de פְּשָׁעִים que « révoltes », sans réduire le terme à une insurrection.
