language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י אֱד֔וֹם וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל רָדְפ֨/וֹ בַ/חֶ֤רֶב אָחִי/ו֙ וְ/שִׁחֵ֣ת רַחֲמָ֔י/ו וַ/יִּטְרֹ֤ף לָ/עַד֙ אַפּ֔/וֹ וְ/עֶבְרָת֖/וֹ שְׁמָ֥רָ/ה נֶֽצַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/011.yaml
  text: 'Thus says Yahweh: “For three transgressions of Edom[a], and for four, I will not revoke its punishment, because he pursued his brother with the sword and destroyed his compassion; his anger tore continually[c][b], and he kept his wrath forever.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « À cause de trois révoltes d’Édom, et même de quatre, je ne révoquerai pas son châtiment[a], parce qu’il a poursuivi son frère[b] avec l’épée et étouffé toute compassion. Sa colère n’a cessé de déchirer[c], et il a gardé sa fureur pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne le ferai pas revenir », c’est-à-dire : je ne reviendrai pas sur le jugement annoncé.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « son frère » évoque probablement la parenté d’Édom avec Israël par Ésaü et Jacob.
    reason: cross_reference
  - marker: c
    text: 'Autre traduction possible : « Dans sa colère, il a déchiré sans cesse ». L’hébreu emploie l’image saisissante d’un prédateur qui déchire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: פִּשְׁעֵי
  choice: révoltes
  rationale: Le terme désigne des offenses graves comportant une idée de rébellion; « révoltes » convient à la formule d’accusation d’Amos.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas son châtiment
  rationale: 'Cette formulation explicite naturellement en français l’objet sous-entendu de l’expression hébraïque : Yahweh ne reviendra pas sur le jugement annoncé.'
- source_word: רָדְפוֹ בַחֶרֶב אָחִיו
  choice: il a poursuivi son frère avec l’épée
  rationale: Le singulier personnifie Édom et « son frère » conserve le langage familial du texte.
- source_word: וְשִׁחֵת רַחֲמָיו
  choice: et étouffé toute compassion
  rationale: Cette expression française rend l’abolition violente de la pitié naturelle sans suggérer maladroitement que la compassion serait un objet matériel détruit.
- source_word: וַיִּטְרֹף לָעַד אַפּוֹ
  choice: Sa colère n’a cessé de déchirer
  rationale: Le verbe garde l’image prédatrice de l’action de déchirer, tandis que « n’a cessé » exprime la durée de לָעַד. La construction hébraïque reste susceptible d’une autre analyse, signalée en note.
- source_word: וְעֶבְרָתוֹ שְׁמָרָה נֶצַח
  choice: et il a gardé sa fureur pour toujours
  rationale: « Garder » restitue שׁמר et « fureur » la force de עֶבְרָה, tout en maintenant le parallélisme temporel.
theological_decisions:
- issue: Passage entre Édom comme nation et les formes masculines singulières
  choice: Conserver la personnification masculine avec « il » et « son »
  alternative: Employer des formes collectives au pluriel ou traiter Édom comme une entité impersonnelle
  rationale: L’hébreu personnifie Édom au masculin singulier; le conserver maintient la rhétorique prophétique et l’accusation fraternelle sans identifier explicitement le frère dans le corps du texte.
- issue: Identité du « frère » d’Édom
  choice: Laisser « son frère » sans explicitation dans le texte
  alternative: Traduire « Israël, son peuple frère »
  rationale: L’allusion probable à la parenté entre Ésaü et Jacob est éclairée en note, sans transformer cette inférence en élément explicite du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence de l’oracle est conservée; « Ainsi parle » maintient le registre prophétique. Les termes « révoltes », « châtiment » et « fureur » restent soutenus sans être archaïques. Tous les appels de note figurent dans le texte.
