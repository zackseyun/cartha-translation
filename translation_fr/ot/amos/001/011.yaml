  source_fidelity: Le texte rend fidèlement la formule d’accusation et de jugement d’Amos. « Révoltes » conserve la dimension de rébellion de פְּשָׁעִים; « je ne révoquerai pas son châtiment » explicite avec retenue l’objet sous-entendu de l’idiome. Le singulier masculin maintient la personnification d’Édom. « Sa colère n’a cessé de déchirer » correspond à une analyse recevable de וַיִּטְרֹף לָעַד אַפּוֹ, dont l’autre analyse est correctement conservée en note.
  naturalness: Le français est moderne, clair et de registre prophétique approprié. La formulation imagée « sa colère … déchirer » est volontairement poétique et reste intelligible dans le parallélisme avec « il a gardé sa fureur pour toujours ».
  terminology: « Yahweh », « Édom », « son frère », « compassion », « colère » et « fureur » sont cohérents et ne surinterprètent pas le texte. Les notes sont bien ancrées et distinguent l’alternative lexicale de l’éclairage historique probable.
