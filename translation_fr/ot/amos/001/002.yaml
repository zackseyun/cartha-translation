  text: וַ/יֹּאמַ֓ר יְהוָה֙ מִ/צִיּ֣וֹן יִשְׁאָ֔ג וּ/מִ/ירוּשָׁלִַ֖ם יִתֵּ֣ן קוֹל֑/וֹ וְ/אָֽבְלוּ֙ נְא֣וֹת הָ/רֹעִ֔ים וְ/יָבֵ֖שׁ רֹ֥אשׁ הַ/כַּרְמֶֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
translation:
  language: fr
  text: 'Il dit :


    « Yahweh rugit de Sion,


    et de Jérusalem il fait retentir sa voix[a].


    Les pâturages[b] des bergers sont en deuil,


    et le sommet[c] du Carmel se dessèche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donne sa voix » ; on peut aussi traduire : « fait entendre sa voix ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les prairies des bergers ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « la tête du Carmel », c’est-à-dire sa hauteur la plus élevée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Il dit
  rationale: Cette forme sobre conserve l’introduction narrative hébraïque sans alourdir le français par un « Et » peu naturel ici.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin exprimé par le tétragramme.
- source_word: יִשְׁאָג
  choice: rugit
  rationale: Le verbe évoque précisément le rugissement du lion et maintient la puissante image prophétique.
- source_word: מִצִּיּוֹן
  choice: depuis Sion
  rationale: « Depuis » exprime naturellement en français le lieu d’où part le rugissement.
- source_word: יִתֵּן קוֹלוֹ
  choice: fait retentir sa voix
  rationale: Cette formulation française naturelle garde l’idée d’une voix puissante qui se fait entendre, tout en signalant en note l’expression hébraïque littérale.
- source_word: נְאוֹת הָרֹעִים
  choice: les pâturages des bergers
  rationale: Dans ce contexte pastoral, נְאוֹת désigne les lieux où paissent les troupeaux; « pâturages » est plus précis que « demeures ».
- source_word: אָבְלוּ
  choice: prennent le deuil
  rationale: La tournure conserve la personnification poétique de terres qui « sont en deuil », plutôt que de réduire le verbe à leur seul dépérissement physique.
- source_word: רֹאשׁ הַכַּרְמֶל
  choice: le sommet du Carmel
  rationale: Pour un relief, « sommet » restitue idiomatiquement le sens géographique de רֹאשׁ, littéralement « tête ».
- source_word: וְיָבֵשׁ
  choice: se dessèche
  rationale: Le verbe décrit la perte d’humidité et le dépérissement résultant du jugement annoncé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » préserve le caractère de nom propre sans substituer un titre.
- issue: Valeur temporelle des formes verbales prophétiques
  choice: présent (« rugit », « fait retentir »)
  alternative: futur (« rugira », « fera retentir »)
  rationale: Le présent français rend la proclamation prophétique comme une réalité vive et imminente, tout en laissant intacte sa portée de jugement annoncé.
- issue: Personnification des pâturages
  choice: « prennent le deuil »
  alternative: « se dessèchent » ou « dépérissent »
  rationale: Le choix principal conserve la tension poétique et théologique d’une création qui participe au deuil provoqué par le jugement divin.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux premiers membres est conservé, ainsi que la personnification des pâturages. Les vers brefs rendent la cadence de l’oracle sans archaïsmes.
