language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מֵֽ/אַשְׁדּ֔וֹד וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מֵֽ/אַשְׁקְל֑וֹן וַ/הֲשִׁיב֨וֹתִי יָדִ֜/י עַל עֶקְר֗וֹן וְ/אָֽבְדוּ֙ שְׁאֵרִ֣ית פְּלִשְׁתִּ֔ים אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/008.yaml
  text: And I will cut off the inhabitant from Ashdod[a], and the one who holds the scepter from Ashkelon; I will turn my hand against Ekron[b], and the remnant of the Philistines shall perish,” says the Lord GOD.
translation:
  language: fr
  text: 'Je retrancherai l’habitant d’Ashdod

    et, d’Ascalon, celui qui tient le sceptre[a].

    Je tournerai ma main contre Ékron[b],

    et le reste des Philistins périra,

    déclare le Seigneur Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le dirigeant ».'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire plus littéralement : « je ramènerai ma main sur Ékron ». Cette expression hébraïque annonce une action de jugement dirigée contre la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Je retrancherai
  rationale: Le hiphil de כרת exprime ici l’élimination. « Retrancher » conserve l’image et le registre solennel du jugement, sans expliciter davantage par « détruire ».
- source_word: יוֹשֵׁב
  choice: l’habitant
  rationale: Le participe signifie littéralement « celui qui habite » et peut représenter collectivement la population. Le singulier du texte hébreu est conservé.
- source_word: מֵאַשְׁדּוֹד
  choice: d’Ashdod
  rationale: La préposition מִן indique la provenance ou le lieu d’où quelqu’un est retranché.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: celui qui tient le sceptre
  rationale: La traduction garde l’image concrète de celui qui tient le bâton de commandement, tout en laissant entendre sa fonction de dirigeant.
- source_word: מֵאַשְׁקְלוֹן
  choice: d’Ascalon
  rationale: La construction française « retrancher d’Ascalon » rend explicitement la portée de la préposition מִן. « Ascalon » est la forme française traditionnelle et intelligible du nom de la ville.
- source_word: וַהֲשִׁיבוֹתִי יָדִי עַל
  choice: Je tournerai ma main contre
  rationale: La formule hébraïque décrit une action de jugement dirigée contre Ékron. Cette traduction préserve la métaphore de la main et l’idée d’hostilité sans lui substituer l’expression différente « étendre la main ».
- source_word: עֶקְרוֹן
  choice: Ékron
  rationale: Forme française courante du nom de cette ville philistine.
- source_word: וְאָבְדוּ
  choice: périra
  rationale: אבד est ici intransitif et annonce la disparition du reste des Philistins. « Périr » en conserve la force résultative et le ton prophétique.
- source_word: שְׁאֵרִית פְּלִשְׁתִּים
  choice: le reste des Philistins
  rationale: « Le reste » rend naturellement שְׁאֵרִית et désigne ce qui subsiste après les jugements annoncés.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente distinctement le nom divin יהוה, sans confondre les deux éléments du titre.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte réunit un titre, אֲדֹנָי, et le nom divin, יהוה. « Le Seigneur Yahweh » maintient cette distinction et évite de remplacer silencieusement le nom propre par un autre titre.
- issue: Identité de celui qui tient le sceptre
  choice: conserver l’image « celui qui tient le sceptre »
  alternative: le chef ou le roi
  rationale: L’expression désigne vraisemblablement le détenteur du pouvoir, mais le texte ne précise pas son titre institutionnel. La formulation imagée préserve cette relative indétermination.
translation_notes:
  register: 'Français international actuel, sobre et solennel. Le parallélisme poétique est rendu par des retours à la ligne. Les noms géographiques suivent des formes françaises bien établies : Ashdod, Ascalon et Ékron.'
