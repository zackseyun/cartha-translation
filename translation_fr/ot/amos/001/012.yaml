id: AMO.1.12
reference: Amos 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/תֵימָ֑ן וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בָּצְרָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/012.yaml
  text: So I will send fire upon Teman[a], and it will consume the citadels of Bozrah.
translation:
  language: fr
  text: J’enverrai donc le feu sur Témân, et il dévorera les citadelles[a] de Botsra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « palais ». Le terme hébreu peut désigner des résidences palatiales ou des places fortes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שִׁלַּחְתִּי
  choice: J’enverrai donc
  rationale: Le hifil de שׁלח signifie « envoyer ». La conjonction וְ relie cette annonce à l’accusation précédente ; « donc » rend naturellement en français sa valeur consécutive dans cet oracle de jugement.
- source_word: אֵשׁ
  choice: le feu
  rationale: Le sens concret « feu » convient à la formule récurrente des oracles de jugement dans Amos, sans qu’il soit nécessaire d’en expliciter une éventuelle portée figurée.
- source_word: בְּ/תֵימָן
  choice: sur Témân
  rationale: Témân est un nom de lieu. Avec l’envoi du feu, « sur » exprime naturellement en français la direction du jugement tout en restant proche de la préposition hébraïque בְּ.
- source_word: וְ/אָכְלָה
  choice: et il dévorera
  rationale: אכל signifie littéralement « manger » ; lorsque le feu en est le sujet, « dévorer » est une expression française naturelle qui conserve la vigueur de l’image.
- source_word: אַרְמְנוֹת
  choice: les citadelles
  rationale: Le terme peut désigner des palais, notamment des résidences imposantes et fortifiées, ou des places fortes. « Citadelles » préserve ici la dimension défensive sans effacer l’autre sens, signalé en note.
- source_word: בָּצְרָה
  choice: de Botsra
  rationale: Botsra est le nom français traditionnel et intelligible de cette ville édomite. La relation syntaxique avec אַרְמְנוֹת se rend directement par « les citadelles de Botsra ».
theological_decisions:
- issue: Formule prophétique de jugement
  choice: Présenter l’action comme une annonce directe de jugement divin, en conservant l’image concrète du feu.
  alternative: Interpréter explicitement le feu comme une simple métaphore de la destruction.
  rationale: L’hébreu affirme directement l’envoi d’un feu qui dévore les centres fortifiés. La traduction ne doit ni adoucir cette annonce ni résoudre la question de la portée littérale ou figurée de l’image.
translation_notes:
  register: Français international moderne, sobre et solennel. « J’enverrai donc » assure la continuité avec l’oracle précédent ; « dévorera » conserve la force poétique de l’image. Le marqueur de note est placé après « citadelles », terme auquel la variante se rapporte.
