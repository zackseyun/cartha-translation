  source_fidelity: 'Le texte rend fidèlement l’annonce divine au futur : le verbe hifil « envoyer », le feu concret, Témân, puis le feu personnifié qui « dévore » les אַרְמְנוֹת de Botsra. « Sur Témân » est une formulation française recevable dans une formule de jugement et conserve la direction hostile que le contexte permet de donner à בְּ. « Donc » explicite avec mesure la relation de conséquence portée par le contexte immédiat de l’oracle, sans modifier le contenu de l’annonce.'
  naturalness: La formulation est naturelle, claire et d’un registre prophétique sobre en français international moderne. « Le feu » et « il dévorera » produisent une expression idiomatique et vigoureuse. Les formes Témân et Botsra sont cohérentes avec une transcription biblique française intelligible.
  terminology: « Citadelles » rend de manière défendable la portée à la fois prestigieuse et fortifiée de אַרְמְנוֹת. La note, ancrée exactement après le terme concerné, préserve l’alternative légitime « palais » et explicite correctement le champ sémantique. Les noms de lieux et l’imagerie de jugement sont conservés sans interprétation doctrinale ajoutée.
