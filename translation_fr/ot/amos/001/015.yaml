base_translation:
  language: en
  yaml_path: translation/ot/amos/001/015.yaml
  text: And their king shall go into exile[a], he and his officials together, says Yahweh.
translation:
  language: fr
  text: Leur roi partira en exil[a], lui et ses dignitaires, ensemble, dit Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Milkom partira en exil ». Milkom était le dieu des Ammonites ; selon cette lecture, leur dieu serait déporté avec ses prêtres ou ses dignitaires.'
    reason: Lecture alternative permise par les consonnes hébraïques et significative dans le contexte ammonite.
lexical_decisions:
- source_word: וְהָלַךְ
  choice: partira
  rationale: Le qatal précédé de la conjonction, dans ce discours prophétique de jugement, a naturellement une valeur future. « Partira » exprime simplement le déplacement annoncé.
- source_word: מַלְכָּם
  choice: leur roi
  rationale: La vocalisation massorétique et la syntaxe immédiate soutiennent la lecture « leur roi ». Les mêmes consonnes permettent toutefois d’y voir Milkom, possibilité conservée en note.
- source_word: בַּגּוֹלָה
  choice: en exil
  rationale: L’expression désigne la déportation consécutive à la conquête. En français, « partir en exil » rend naturellement le mouvement et le résultat.
- source_word: הוּא
  choice: lui
  rationale: Le pronom indépendant reprend le roi avec une valeur emphatique et introduit le groupe qui subira le même sort.
- source_word: וְשָׂרָיו
  choice: et ses hauts fonctionnaires
  rationale: שָׂרִים désigne ici les dignitaires ou responsables placés sous l’autorité royale. « Hauts fonctionnaires » est clair, actuel et adapté au cadre de la cour.
- source_word: יַחְדָּו
  choice: avec lui
  rationale: Dans la tournure française « lui et ses hauts fonctionnaires avec lui », cette expression communique leur départ commun et évite une formulation pesante avec « ensemble ».
- source_word: אָמַר יְהוָה
  choice: dit Yahvé
  rationale: Le présent français convient à la formule prophétique. Le nom divin est rendu par « Yahvé », transcription française courante du tétragramme.
theological_decisions:
- issue: מַלְכָּם désigne-t-il un roi humain ou le dieu ammonite Milkom ?
  choice: 'Le roi humain : « leur roi »'
  alternative: « Milkom », le dieu des Ammonites
  rationale: La vocalisation massorétique מַלְכָּם et la mention qui suit de « ses hauts fonctionnaires » favorisent la lecture d’un souverain humain. Cependant, les consonnes peuvent aussi représenter le nom Milkom dans ce contexte ammonite ; la note préserve donc cette ambiguïté réelle sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le rythme bref de l’oracle de jugement. « Hauts fonctionnaires » évite l’archaïsme de « princes » tout en indiquant des dignitaires royaux.
