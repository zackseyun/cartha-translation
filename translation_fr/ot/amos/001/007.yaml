  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/חוֹמַ֣ת עַזָּ֑ה וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/007.yaml
  text: So I will send fire upon the wall of Gaza[a], and it will consume her citadels.
translation:
  language: fr
  text: J’enverrai donc le feu contre la muraille de Gaza, et il dévorera ses palais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses citadelles ». Le terme hébreu peut désigner des bâtiments palatiaux et peut aussi évoquer leur caractère fortifié.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai donc
  rationale: Le piel à la première personne exprime l’action directe de YHWH. « Donc » rend naturellement l’enchaînement du jugement dans le contexte.
- source_word: אֵשׁ
  choice: le feu
  rationale: Sens concret ordinaire, qui conserve sans paraphrase l’image prophétique du jugement.
- source_word: בְּחוֹמַת
  choice: contre la muraille de
  rationale: Après « envoyer le feu », la préposition ב marque ici la cible de l’action hostile. « Contre » est naturel en français et « muraille » désigne clairement l’enceinte urbaine.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forme française usuelle du nom de lieu.
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: Le parfait hébreu décrit la conséquence certaine à venir. « Dévorer » conserve l’image vive du feu qui consume, tandis que le masculin français renvoie grammaticalement à « feu ».
- source_word: אַרְמְנֹתֶיהָ
  choice: ses palais fortifiés
  rationale: אַרְמוֹן peut désigner des palais, en particulier des édifices puissants ou fortifiés. Cette formulation conserve à la fois la dimension palatiale et la nuance défensive sans réduire le terme à de simples forteresses.
theological_decisions:
- issue: Suffixe pronominal féminin appliqué à Gaza
  choice: ses palais fortifiés
  alternative: les palais de Gaza
  rationale: Le français ne marque pas le genre du possesseur avec « ses »; la référence à Gaza reste claire, sans imposer artificiellement une personnification féminine que la grammaire française ne peut reproduire ici.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « J’enverrai donc » garde la progression de l’oracle; « dévorera » préserve la force de l’image hébraïque. Le marqueur de note est placé après le syntagme qu’il éclaire.
