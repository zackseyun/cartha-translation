source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה לְ/בֵ֣ית יִשְׂרָאֵ֑ל דִּרְשׁ֖וּ/נִי וִֽ/חְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/004.yaml
  text: 'For thus says Yahweh to the house of Israel: Seek me and live[a].'
translation:
  language: fr
  text: 'Car ainsi parle Yahweh à la maison d’Israël : « Cherchez-moi et vivez[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Cherchez-moi afin que vous viviez », ou « Cherchez-moi, et vous vivrez ». L’hébreu peut exprimer un commandement pressant accompagné d’un résultat promis.
    reason: alternative lexicale et nuance syntaxique
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication liée au contexte précédent, tout en conservant clairement la valeur connective de l’hébreu.
- source_word: כֹה אָמַר
  choice: ainsi parle
  rationale: Rend de manière naturelle et solennelle la formule prophétique consacrée, avec une valeur présente et performative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: Conserve l’expression collective et liée à l’alliance « maison d’Israël », ainsi que la fonction de destinataire marquée par לְ.
- source_word: דִּרְשׁוּנִי
  choice: Cherchez-moi
  rationale: Dans ce contexte prophétique, le verbe désigne le fait de se tourner vers Yahweh et de le rechercher, et non une simple demande de renseignements.
- source_word: וִחְיוּ
  choice: et vivez
  rationale: Préserve la succession hébraïque de deux impératifs sans préciser excessivement si le second exprime avant tout un commandement, un but ou un résultat promis.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La transcription « Yahweh » préserve le nom personnel du Dieu d’Israël au lieu de le remplacer par un titre.
- issue: Portée de « Cherchez-moi et vivez »
  choice: Conserver l’appel direct et l’idée de vie sans en définir ici toute la portée
  alternative: « Cherchez-moi afin que vous viviez » ; « Cherchez-moi, et vous vivrez »
  rationale: L’hébreu permet d’entendre un appel pressant accompagné d’un résultat promis, mais ce verset ne limite pas explicitement la vie à la survie physique ni à la vie spirituelle. La formulation retenue maintient cette ampleur et cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi parle » maintient le ton prophétique traditionnel sans archaïsme marqué ; « maison d’Israël » conserve la portée collective de l’expression source.
