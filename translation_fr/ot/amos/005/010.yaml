source:
  edition: WLC
  text: שָׂנְא֥וּ בַ/שַּׁ֖עַר מוֹכִ֑יחַ וְ/דֹבֵ֥ר תָּמִ֖ים יְתָעֵֽבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/010.yaml
  text: They hate the one who reproves in the gate[b][a], and they abhor the one who speaks with integrity.
translation:
  language: fr
  text: Ils détestent celui qui fait des reproches à la porte de la ville[a], et ils ont en horreur celui qui parle avec intégrité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La porte de la ville était le lieu habituel des procès, des décisions judiciaires et des délibérations publiques.
    reason: cultural_note
  - marker: b
    text: Ou « celui qui dit ce qui est irréprochable » ou « celui qui parle avec droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנְאוּ
  choice: Ils détestent
  rationale: Le qatal décrit ici un comportement caractéristique et persistant; le présent français rend naturellement cette réalité sociale.
- source_word: בַשַּׁעַר
  choice: à la porte de la ville
  rationale: La porte de la ville était le lieu habituel des procédures judiciaires et des décisions publiques. L’explicitation « de la ville » rend l’expression hébraïque intelligible sans effacer son cadre civique.
- source_word: מוֹכִיחַ
  choice: celui qui les reprend
  rationale: Le participe de יכח désigne celui qui corrige, réprimande ou formule un reproche, probablement dans un contexte judiciaire. Le pronom « les » explicite l’objet implicite suggéré par le contexte.
- source_word: וְדֹבֵר
  choice: et celui qui parle
  rationale: Cette formulation conserve le parallélisme participial avec « celui qui les reprend ».
- source_word: תָּמִים
  choice: avec intégrité
  rationale: תמים peut exprimer l’intégrité, la droiture ou le caractère irréprochable. « Avec intégrité » convient à la parole publique sans réduire le terme à l’idée de perfection morale absolue.
- source_word: יְתָעֵבוּ
  choice: ils ont en horreur
  rationale: Le piel exprime une vive répulsion. Cette locution garde l’intensité du verbe et évite de répéter « détestent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme du verset et l’intensification entre « détestent » et « ont en horreur » sont préservés; la note maintient l’ambiguïté de תמים.
