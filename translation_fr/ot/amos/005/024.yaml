id: AMO.5.24
reference: Amos 5:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִגַּ֥ל כַּ/מַּ֖יִם מִשְׁפָּ֑ט וּ/צְדָקָ֖ה כְּ/נַ֥חַל אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/024.yaml
  text: But let justice roll down like waters[b][a], and righteousness like an ever-flowing stream.
translation:
  language: fr
  text: 'Mais que le droit coule comme les eaux,

    et la justice comme un torrent intarissable[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un torrent permanent ». Le mot hébreu peut qualifier ce qui est durable, constant ou puissant; ici, il évoque probablement un cours d’eau qui ne tarit pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגַּל
  choice: Mais que … coule
  rationale: La forme verbale exprime ici une exhortation ou un souhait énergique. « Coule » restitue naturellement en français le mouvement continu de l’eau; « mais » rend la valeur adversative de la conjonction dans le contexte immédiat.
- source_word: כַּמַּיִם
  choice: comme les eaux
  rationale: Le pluriel hébreu est conservé; en français, « les eaux » évoque avec dignité une masse d’eau abondante et en mouvement.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte prophétique, le terme désigne l’exercice concret d’un ordre social et judiciaire juste. « Le droit » permet aussi de le distinguer de צְדָקָה dans le membre parallèle.
- source_word: וּצְדָקָה
  choice: la justice
  rationale: « Justice » exprime la conduite droite et fidèle exigée, sans réduire le terme à une notion juridique ni confondre les deux mots hébreux du parallélisme.
- source_word: כְּנַחַל
  choice: comme un torrent
  rationale: נַחַל peut désigner un cours d’eau ou un oued. « Torrent » est clair pour le lecteur moderne et convient à l’image d’un courant qui ne se dessèche pas.
- source_word: אֵיתָן
  choice: intarissable
  rationale: Associé à un cours d’eau, l’adjectif évoque principalement ce qui demeure et ne tarit pas. « Intarissable » rend cette idée avec force et naturel, tout en signalant l’alternative dans une note.
theological_decisions:
- issue: Traduction du couple éthique מִשְׁפָּט / צְדָקָה
  choice: le droit … la justice
  alternative: la justice … la droiture
  rationale: « Le droit … la justice » maintient la distinction lexicale et le parallélisme entre l’ordre juste dans la vie publique et la conduite moralement droite, sans imposer une lecture doctrinale plus étroite.
translation_notes:
  register: Français international moderne, sobre et solennel. Le rythme en deux membres conserve le parallélisme poétique hébreu. « Les eaux » assume une légère élévation de registre adaptée à la poésie prophétique.
