  text: כַּ/אֲשֶׁ֨ר יָנ֥וּס אִישׁ֙ מִ/פְּנֵ֣י הָ/אֲרִ֔י וּ/פְגָע֖/וֹ הַ/דֹּ֑ב וּ/בָ֣א הַ/בַּ֔יִת וְ/סָמַ֤ךְ יָד/וֹ֙ עַל הַ/קִּ֔יר וּ/נְשָׁכ֖/וֹ הַ/נָּחָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/019.yaml
  text: It will be as when a man flees from before the lion[a], and the bear meets him; then he enters the house and leans his hand on the wall[b], and the snake bites him.
translation:
  language: fr
  text: Ce sera comme lorsqu’un homme fuit devant un lion et qu’un ours le rencontre, puis qu’il entre dans la maison, appuie sa main contre le mur, et qu’un serpent le mord.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: comme lorsque
  rationale: Introduit naturellement en français la comparaison avec la situation décrite au verset précédent.
- source_word: יָנוּס אִישׁ מִפְּנֵי הָאֲרִי
  choice: un homme fuit devant le lion
  rationale: « Fuit » conserve l’urgence du verbe, tandis que « devant le lion » rend l’idée de s’éloigner de sa présence menaçante.
- source_word: וּפְגָעוֹ הַדֹּב
  choice: tombe sur l’ours
  rationale: פגע peut exprimer une rencontre ou un heurt. « Tombe sur » garde la soudaineté et la menace sans préciser au-delà de l’hébreu que l’ours l’attaque déjà.
- source_word: וּבָא הַבַּיִת
  choice: puis entre dans la maison
  rationale: בוא signifie ici entrer dans la maison; « puis » rend clairement la succession narrative.
- source_word: וְסָמַךְ יָדוֹ עַל הַקִּיר
  choice: appuie la main contre le mur
  rationale: Formulation française naturelle et concrète pour l’action de prendre appui ou de poser sa main sur le mur.
- source_word: וּנְשָׁכוֹ הַנָּחָשׁ
  choice: et le serpent le mord
  rationale: « Serpent » est un terme français courant, digne et assez large pour נָחָשׁ; l’article défini reflète celui de l’hébreu.
