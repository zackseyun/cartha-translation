  yaml_path: translation/ot/amos/005/021.yaml
  text: I hate[a], I reject your festivals, and I will not delight in your solemn assemblies.
translation:
  language: fr
  text: Je hais, je rejette vos fêtes, et je ne prendrai aucun plaisir à vos assemblées solennelles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne sentirai pas [d’odeur] dans vos assemblées solennelles » ; dans le langage cultuel, sentir une odeur exprime ici l’agrément ou le plaisir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Je hais
  rationale: Le qal accompli à la première personne exprime ici une déclaration vigoureuse de rejet divin. Le présent français restitue naturellement sa force actuelle sans atténuer le verbe.
- source_word: מָאַסְתִּי
  choice: je rejette
  rationale: Le verbe מָאַס signifie repousser ou refuser comme inacceptable. « Rejette » conserve cette idée de répudiation et forme avec « hais » une progression naturelle.
- source_word: חַגֵּיכֶם
  choice: vos fêtes
  rationale: חַג désigne des célébrations religieuses, notamment les fêtes de pèlerinage. « Fêtes » est courant, clair et approprié au contexte cultuel.
- source_word: וְלֹא
  choice: et je ne… aucun
  rationale: La coordination et la négation relient étroitement la dernière proposition aux deux déclarations précédentes. La tournure française avec « aucun » renforce naturellement la négation.
- source_word: אָרִיחַ
  choice: je ne prendrai aucun plaisir
  rationale: Le verbe signifie littéralement « sentir, respirer une odeur » et évoque, dans un contexte cultuel, le fait d'agréer ou de trouver agréable. La traduction idiomatique évite une formulation française opaque, tandis que la note conserve l'image hébraïque.
- source_word: בְּעַצְּרֹתֵיכֶם
  choice: à vos assemblées solennelles
  rationale: עֲצֶרֶת désigne une assemblée religieuse officielle ou solennelle. Cette traduction préserve à la fois le cadre cultuel et le registre élevé du passage.
theological_decisions:
- issue: Langage cultuel anthropomorphique exprimant l'acceptation divine
  choice: Rendre l'idée par « je ne prendrai aucun plaisir » dans le texte principal
  alternative: 'Traduire littéralement : « je ne sentirai rien lors de vos assemblées solennelles »'
  rationale: L'hébreu emploie l'image de Dieu qui sent une odeur, couramment associée à l'agrément des offrandes. Une traduction strictement littérale serait ambiguë ou étrange en français, surtout avec les assemblées comme cadre. Le texte principal en exprime donc le sens sans effacer l'image, qui demeure signalée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme abrupt de l'hébreu est conservé par « Je hais, je rejette », tandis que « assemblées solennelles » maintient le registre religieux du texte.
