id: AMO.5.8
reference: Amos 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֹשֵׂ֨ה כִימָ֜ה וּ/כְסִ֗יל וְ/הֹפֵ֤ךְ לַ/בֹּ֨קֶר֙ צַלְמָ֔וֶת וְ/י֖וֹם לַ֣יְלָה הֶחְשִׁ֑יךְ הַ/קּוֹרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/008.yaml
  text: He who made the Pleiades and Orion[a], and turns deep darkness into morning, and darkens day into night[b], who calls for the waters of the sea and pours them out over the face of the earth—Yahweh is his name.
translation:
  language: fr
  text: 'Celui qui fait les Pléiades et Orion,

    qui change l’obscurité profonde[a] en matin

    et assombrit le jour en nuit,

    celui qui appelle les eaux de la mer

    et les déverse sur la surface de la terre,

    Yahweh est son nom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ombre de la mort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: Celui qui fait
  rationale: Le participe qal masculin singulier est employé substantivement. Le présent français conserve sa valeur descriptive et l’enchaînement des actions divines.
- source_word: כִימָה וּכְסִיל
  choice: les Pléiades et Orion
  rationale: Dans ce parallélisme astronomique, les deux termes désignent vraisemblablement l’amas des Pléiades et la constellation d’Orion; les noms usuels français communiquent clairement les référents.
- source_word: וְהֹפֵךְ לַבֹּקֶר צַלְמָוֶת
  choice: qui change l’obscurité profonde en matin
  rationale: « Changer … en » exprime naturellement le renversement. צַלְמָוֶת désigne ici une obscurité intense, dans un contexte cosmique opposant matin, jour et nuit.
- source_word: וְיוֹם לַיְלָה הֶחְשִׁיךְ
  choice: et assombrit le jour jusqu’à en faire la nuit
  rationale: Cette formulation garde la valeur causative de החשיך ainsi que le mouvement du jour vers la nuit, sans aplanir l’image hébraïque.
- source_word: הַקּוֹרֵא לְמֵי הַיָּם
  choice: celui qui appelle les eaux de la mer
  rationale: « Appeler » conserve l’image d’eaux convoquées par l’ordre divin et reprend naturellement la construction participiale.
- source_word: וַיִּשְׁפְּכֵם עַל פְּנֵי הָאָרֶץ
  choice: et les déverse sur la surface de la terre
  rationale: Le pronom renvoie aux eaux. « Déverser » rend l’action de répandre en abondance, tandis que « la surface de la terre » restitue clairement l’expression hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH, et non un titre. « Yahweh » en donne une translittération courante et explicite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie le nom propre divin. Le translittérer évite de le remplacer silencieusement par un titre.
- issue: Sens de צַלְמָוֶת
  choice: l’obscurité profonde
  alternative: l’ombre de la mort
  rationale: Dans l’opposition cosmique entre matin, jour et nuit, l’obscurité intense est le sens contextuel le plus probable; la note préserve toutefois l’interprétation traditionnelle liée à la mort.
translation_notes:
  register: Poésie élevée mais immédiatement compréhensible, avec des propositions relatives parallèles qui reproduisent l’accumulation hébraïque. Le présent donne aux actions une portée descriptive, et la disposition en lignes met en valeur les renversements entre obscurité, matin, jour et nuit.
