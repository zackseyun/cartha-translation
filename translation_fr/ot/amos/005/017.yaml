id: AMO.5.17
reference: Amos 5:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/כָל כְּרָמִ֖ים מִסְפֵּ֑ד כִּֽי אֶעֱבֹ֥ר בְּ/קִרְבְּ/ךָ֖ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/017.yaml
  text: And in all the vineyards there will be wailing[b][a], for I will pass through your midst," says Yahweh.
translation:
  language: fr
  text: Et dans toutes les vignes, il y aura des lamentations[a], car je passerai au milieu de toi[b] — dit Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le deuil » ou « des cris de deuil ». Le terme hébreu désigne un deuil public, souvent exprimé à haute voix.
    reason: lexical_alternative
  - marker: b
    text: L’expression « je passerai au milieu de toi » peut faire écho à des textes antérieurs où la venue de Dieu apporte le jugement; voir Exode 12.12. Le verset ne rend toutefois pas cette allusion explicite.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל
  choice: Et dans toutes
  rationale: La conjonction, la préposition et le quantificateur prolongent la série des lieux touchés par le deuil. « Toutes » conserve la portée distributive de l’hébreu.
- source_word: כְּרָמִים
  choice: les vignes
  rationale: Le pluriel désigne les terrains plantés de vigne. « Les vignes » est l’expression française courante dans ce contexte agricole.
- source_word: מִסְפֵּד
  choice: il y aura des lamentations
  rationale: Le nom désigne un deuil public, souvent exprimé à haute voix. La tournure existentielle restitue naturellement en français la proposition nominale hébraïque sans copule.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison des lamentations.
- source_word: אֶעֱבֹר
  choice: je passerai
  rationale: Le verbe exprime un déplacement à travers un lieu; avec le complément suivant, « passer au milieu de » conserve l’image et sa possible résonance judiciaire.
- source_word: בְּקִרְבְּךָ
  choice: au milieu de toi
  rationale: Le suffixe de deuxième personne du singulier s’adresse collectivement à Israël. Cette formulation préserve à la fois le singulier et l’image spatiale.
- source_word: אָמַר יְהוָה
  choice: dit Yahvé
  rationale: Le présent français convient à la formule prophétique. Le nom divin est rendu sous sa forme française usuelle « Yahvé », plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » conserve le nom d’alliance tout en employant une forme établie en français moderne.
- issue: Portée du passage de Dieu au milieu du peuple
  choice: je passerai au milieu de toi
  alternative: je passerai parmi vous
  rationale: Le singulier collectif et l’image spatiale sont maintenus. La formulation laisse subsister une possible évocation du jugement d’Exode 12 sans transformer cette résonance en affirmation explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la structure hébraïque, avec ajout idiomatique de « il y aura ». Le singulier « toi » est conservé parce qu’Israël est interpellé collectivement.
