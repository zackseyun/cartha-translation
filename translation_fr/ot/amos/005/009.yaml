  text: הַ/מַּבְלִ֥יג שֹׁ֖ד עַל עָ֑ז וְ/שֹׁ֖ד עַל מִבְצָ֥ר יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/009.yaml
  text: He who brings sudden destruction upon the strong[b][a], so that destruction comes upon the fortress.
translation:
  language: fr
  text: Celui qui fait éclater[a] la dévastation contre le puissant, et la dévastation atteint la forteresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Celui qui fait surgir la dévastation contre le puissant. » Le verbe hébreu est rare et difficile; certains le comprennent autrement.'
    reason: lexical_alternative
  - marker: b
    text: « Forteresse » peut aussi se traduire par « place forte » ou « lieu fortifié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבְלִיג
  choice: lui qui fait fondre soudain
  rationale: Le participe hiphil substantivé désigne « celui qui… ». Le verbe, rare et difficile ici, paraît exprimer le déclenchement brusque de la ruine. Cette formulation française conserve cette soudaineté tout en restant intelligible.
- source_word: שֹׁד
  choice: la dévastation
  rationale: Le nom évoque une ruine violente plutôt qu’un simple butin. « Dévastation » convient aux deux occurrences et au parallélisme militaire.
- source_word: עַל
  choice: sur
  rationale: La préposition désigne la cible sur laquelle s’abat la dévastation, tout en conservant l’image hébraïque.
- source_word: עָז
  choice: le puissant
  rationale: L’adjectif substantivé peut désigner un être ou un pouvoir fort. Le singulier français « le puissant » préserve cette forme sans préciser indûment son identité.
- source_word: וְשֹׁד
  choice: si bien que la dévastation
  rationale: Le waw relie étroitement les deux propositions. « Si bien que » exprime naturellement la progression vers l’atteinte de la forteresse, sans modifier le contenu essentiel.
- source_word: מִבְצָר
  choice: la forteresse
  rationale: Le terme désigne un lieu fortifié ou une place forte. « Forteresse » est clair, actuel et adapté à l’image militaire.
- source_word: יָבוֹא
  choice: atteint
  rationale: Le verbe signifie littéralement « vient ». Avec la dévastation pour sujet et la forteresse comme cible, « atteint » donne en français le sens contextuel naturel sans ajouter l’idée précise d’une chute.
theological_decisions:
- issue: Identification du sujet
  choice: Le sujet reste exprimé par « lui qui… », avec Dieu comme référent implicite d’après le contexte.
  alternative: Une force impersonnelle qui provoque la dévastation.
  rationale: Amos 5.8-9 décrit la puissance du Seigneur, mais le verset lui-même emploie un participe substantivé. La traduction préserve cette formulation sans ajouter explicitement le nom divin.
- issue: Sens du verbe הַמַּבְלִיג
  choice: Une dévastation brusquement déclenchée contre le puissant.
  alternative: Celui qui fortifie le faible contre le puissant, ou celui qui fait éclater la dévastation.
  rationale: Le verbe est difficile et admet plusieurs analyses. Le parallélisme avec la dévastation atteignant la forteresse favorise ici l’idée d’une ruine soudaine, tout en exigeant une note signalant l’incertitude.
translation_notes:
  register: Français international moderne, poétique mais accessible. La reprise de « dévastation » respecte le parallélisme hébreu. Les marqueurs [a] et [b] sont placés immédiatement après les termes concernés.
