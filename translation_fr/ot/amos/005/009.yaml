  naturalness: « Celui qui fait éclater la dévastation contre le puissant » est poétique mais intelligible en français moderne. « La dévastation atteint la forteresse » est naturel et conserve le sens contextuel de « vient sur ».
  terminology: « Dévastation », « puissant » et « forteresse » conviennent au registre prophétique et militaire. La note sur le verbe rare est rattachée au verbe, plutôt qu’à « le puissant », et la note sur « forteresse » reste correctement ancrée.
