    rationale: En français moderne, on entre « dans » une ville; « entrer à » est peu idiomatique. De plus, le verbe hébreu signifie ici plus largement venir à ou se rendre à.
  - severity: low
    issue: « ne passez pas à Bersabée »
    rationale: La formule peut se comprendre comme « passer par Bersabée » ou y faire escale. « N’allez pas jusqu’à Bersabée » est plus clair pour le déplacement visé.
  - severity: low
    issue: « sera certainement déportée »
    rationale: Le passif communique le sens, mais l’hébreu emploie le verbe actif « aller en exil » avec infinitif absolu intensif. Une formulation active reproduit plus directement cette image.
