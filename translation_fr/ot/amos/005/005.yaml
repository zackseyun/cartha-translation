  text: וְ/אַֽל תִּדְרְשׁוּ֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּל֙ לֹ֣א תָבֹ֔אוּ וּ/בְאֵ֥ר שֶׁ֖בַע לֹ֣א תַעֲבֹ֑רוּ כִּ֤י הַ/גִּלְגָּל֙ גָּלֹ֣ה יִגְלֶ֔ה וּ/בֵֽית אֵ֖ל יִהְיֶ֥ה לְ/אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/005.yaml
  text: But do not seek Bethel[a], and do not enter Gilgal, and do not cross over to Beersheba; for Gilgal will surely go into exile, and Bethel will become nothingness.
translation:
  language: fr
  text: Mais ne cherchez pas Béthel[a], ne vous rendez pas à Guilgal et n’allez pas jusqu’à Bersabée, car Guilgal partira assurément en exil, et Béthel sera réduite à néant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Béthel deviendra Beth-Aven ». L’hébreu joue alors sur les noms : Béthel (« maison de Dieu ») devient aven, mot qui peut évoquer le « néant », le « mal » ou le « désastre ».'
    reason: Alternative lexicale et jeu de mots hébreu.
lexical_decisions:
- source_word: תִּדְרְשׁוּ
  choice: cherchez
  rationale: Le verbe דרשׁ signifie « chercher » ou « consulter ». Avec Béthel comme objet, « cherchez » conserve le sens religieux du recours à un sanctuaire et fait écho à l’appel voisin à chercher le Seigneur.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Nom de lieu rendu selon sa forme française usuelle plutôt que traduit par « maison de Dieu ».
- source_word: תָבֹאוּ
  choice: n’entrez pas à
  rationale: Dans le contexte d’un déplacement vers un centre cultuel, « entrer à » exprime naturellement l’arrivée dans le lieu visé.
- source_word: הַגִּלְגָּל
  choice: Guilgal
  rationale: Nom de lieu rendu selon la translittération française usuelle.
- source_word: תַעֲבֹרוּ
  choice: ne passez pas à
  rationale: עבר signifie fondamentalement « passer, traverser ». La formulation conserve cette valeur concrète sans réduire le verbe au simple fait d’aller.
- source_word: בְאֵר שֶׁבַע
  choice: Bersabée
  rationale: Nom de lieu rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: גָּלֹה יִגְלֶה
  choice: sera certainement déportée
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude. Le passif français exprime clairement le sort de la ville et conserve le motif de la déportation.
- source_word: יְהִיֶה לְאָוֶן
  choice: sera réduite à néant
  rationale: אָוֶן peut évoquer le néant, la vanité, le mal ou le désastre. « Réduite à néant » rend ici le jugement de ruine sans trancher en faveur de la seule dimension morale.
theological_decisions:
- issue: Sens de לְאָוֶן dans le sort annoncé à Béthel
  choice: Béthel sera réduite à néant
  alternative: Béthel deviendra Beth-Aven, ou deviendra malheur/méchanceté
  rationale: L’hébreu associe probablement la portée sémantique de אָוֶן à un jeu polémique entre Béthel et Beth-Aven. Le texte principal reste naturel en français, tandis que la note préserve l’ambiguïté et le jeu de mots possibles.
translation_notes:
  register: Français moderne, international et digne. Les impératifs négatifs sont directs; les noms propres suivent les formes françaises courantes. La répétition de Guilgal et de Béthel ainsi que la certitude solennelle du jugement sont conservées.
