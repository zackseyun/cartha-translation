  source_fidelity: 'Le sens général est fidèle : l’interdiction vise les trois sanctuaires, l’intensif de גָּלֹה יִגְלֶה est rendu, et « réduite à néant » représente de façon recevable אָוֶן tout en laissant la note signaler le jeu de mots. Toutefois, « n’entrez pas à Guilgal » sur-spécifie légèrement le simple « venir à / se rendre à » de תָבֹאוּ et n’est pas idiomatique en français moderne. « N’allez pas jusqu’à Bersabée » rend naturellement le déplacement lointain impliqué par תַעֲבֹרוּ, même si la nuance concrète de franchissement est moins explicite.'
  naturalness: La révision remplace « n’entrez pas à Guilgal », formulation peu naturelle, par « ne vous rendez pas à Guilgal ». Elle remplace aussi « ne passez pas à Bersabée », qui peut suggérer une simple étape ou un passage par la ville, par une formulation moderne claire.
  terminology: Les formes françaises usuelles Béthel, Guilgal et Bersabée sont appropriées. « Partira assurément en exil » conserve la forme active et l’insistance de l’hébreu mieux que le passif « sera déportée », tout en exprimant le jugement sur Guilgal. La note maintient avec prudence l’alternative Beth-Aven et les valeurs possibles de אָוֶן.
