  naturalness: « Il est ténèbres et non lumière » est intelligible mais son pronom masculin est moins naturel en français moderne, puisque le référent immédiat est « le jour » tout en étant qualifié par le substantif poétique « ténèbres ». « Ce jour est ténèbres et non lumière » conserve la densité prophétique et sonne plus net. « À quoi vous sert » rend la question elliptique sans imposer un futur absent de l’hébreu.
  terminology: « Yahweh » est cohérent avec la politique fournie pour le Tétragramme. « Malheur », « le jour de Yahweh », « ténèbres » et « lumière » sont appropriés au registre prophétique et ne surinterprètent pas le jugement implicite.
