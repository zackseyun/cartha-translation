  text: ה֥וֹי הַ/מִּתְאַוִּ֖ים אֶת י֣וֹם יְהוָ֑ה לָ/מָּה זֶּ֥ה לָ/כֶ֛ם י֥וֹם יְהוָ֖ה הוּא חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
translation:
  language: fr
  text: Malheur à ceux qui désirent ardemment le jour de Yahweh ! À quoi vous sert donc le jour de Yahweh ?[a] Ce jour est ténèbres et non lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Pourquoi cela pour vous, le jour de Yahweh ? » L’expression hébraïque est elliptique et peut aussi se comprendre : « Pourquoi voulez-vous le jour de Yahweh ? »'
    reason: ambiguïté idiomatique et lexicale
lexical_decisions:
- source_word: הוֹי
  choice: Malheur
  rationale: Introduit ici une dénonciation prophétique chargée de menace ; « Malheur » en conserve la force sans l’atténuer en simple lamentation.
- source_word: הַמִּתְאַוִּים
  choice: ceux qui désirent ardemment
  rationale: Le participe hitpael décrit des personnes caractérisées par un désir intense et durable ; cette formulation rend l’ardeur visée par la réprimande ironique.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: Conserve l’expression prophétique et rend directement le nom divin יהוה par « Yahweh ».
- source_word: לָמָּה זֶּה לָכֶם
  choice: À quoi vous servira donc
  rationale: L’expression hébraïque est elliptique et rhétorique. Cette formulation française exprime naturellement la mise en cause du bénéfice que les destinataires attendent de ce jour, tout en signalant l’alternative plus littérale en note.
- source_word: הוּא חֹשֶׁךְ וְלֹא אוֹר
  choice: Il est ténèbres et non lumière
  rationale: Maintient le contraste métaphorique abrupt entre ténèbres et lumière ainsi que la prédication nominale de l’hébreu, sans expliciter prématurément la nature du jugement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le Tétragramme ; « Yahweh » préserve la référence au nom propre divin sans le remplacer par un titre.
- issue: Nature du « jour de Yahweh »
  choice: Conserver l’ironie et l’image des ténèbres sans explication ajoutée
  alternative: Préciser qu’il s’agit d’un jour de jugement
  rationale: Le verset renverse l’attente favorable des auditeurs, mais n’énonce pas encore explicitement toutes les implications théologiques de ce jour. La traduction laisse subsister cette tension.
translation_notes:
  register: Français international moderne, solennel et prophétique. La tournure « Il est ténèbres et non lumière » conserve volontairement la densité poétique de l’hébreu ; le marqueur de note est placé immédiatement après la proposition qu’il explique.
