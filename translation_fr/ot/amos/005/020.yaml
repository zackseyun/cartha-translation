  text: הֲ/לֹא חֹ֛שֶׁךְ י֥וֹם יְהוָ֖ה וְ/לֹא א֑וֹר וְ/אָפֵ֖ל וְ/לֹא נֹ֥גַֽהּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/020.yaml
  text: Is not the day of Yahweh darkness[a], and not light, and gloom with no brightness in it?
translation:
  language: fr
  text: Le jour de Yahweh n’est-il pas ténèbres, et non lumière, et obscurité, sans aucune clarté en lui[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et obscurité, sans qu’il ait le moindre éclat ».'
    reason: Alternative lexicale et syntaxique pour וְאָפֵל וְלֹא נֹגַהּ לוֹ.
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-il pas
  rationale: Conserve la question rhétorique, qui appelle une réponse affirmative, au lieu de la transformer en affirmation explicite.
- source_word: חֹשֶׁךְ
  choice: ténèbres
  rationale: Rend le nom hébreu et maintient son opposition directe avec « lumière » dans un registre prophétique naturel en français.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: Préserve l’expression prophétique et rend le tétragramme par le nom divin « Yahweh ».
- source_word: וְלֹא אוֹר
  choice: et non lumière
  rationale: Reproduit la négation répétée et le parallélisme antithétique de l’hébreu sans les atténuer.
- source_word: וְאָפֵל
  choice: obscurité
  rationale: Exprime l’assombrissement intense évoqué par אָפֵל tout en évitant d’ajouter un degré non explicite comme « profonde ».
- source_word: וְלֹא נֹגַהּ לוֹ
  choice: sans aucune clarté en lui
  rationale: נֹגַהּ désigne la clarté ou l’éclat; « en lui » rattache naturellement le pronom au jour, tandis que « aucune » fait ressortir la négation absolue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve ici le nom propre plutôt que de lui substituer un titre.
- issue: Nature du jour de Yahweh
  choice: Maintien de l’opposition « ténèbres, et non lumière »
  alternative: Paraphrase explicative telle que « un jour de jugement »
  rationale: Le verset décrit ce jour par une image paradoxale et saisissante; la traduction ne remplace pas cette tension prophétique par son interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe nominale légèrement marquée conserve le parallélisme poétique hébreu; « ténèbres » et « obscurité » évitent une paraphrase explicative.
