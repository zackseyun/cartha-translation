base_translation:
  language: en
  yaml_path: translation/ot/amos/005/027.yaml
  text: Therefore I will send you into exile beyond Damascus,” says Yahweh[a], whose name is the God of hosts.
translation:
  language: fr
  text: « C’est pourquoi je vous déporterai[a] au-delà de Damas », dit Yahweh, dont le nom est Dieu des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je vous exilerai au-delà de Damas ».'
    reason: Alternative lexicale reflétant directement la valeur causative du hifil de גלה.
lexical_decisions:
- source_word: וְהִגְלֵיתִי
  choice: C’est pourquoi je vous déporterai
  rationale: Le hifil de גלה exprime le fait de faire partir en exil. « Déporter » rend naturellement cette valeur causative en français. La conjonction וְ est rendue par « C’est pourquoi » pour expliciter le lien conclusif avec le jugement annoncé dans le contexte immédiat.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le suffixe de deuxième personne masculine plurielle est rendu par le pronom français « vous », sans marquage de genre.
- source_word: מֵהָלְאָה לְדַמָּשֶׂק
  choice: au-delà de Damas
  rationale: L’expression indique une destination située plus loin que Damas. Cette formulation française est concise et conserve la portée géographique du texte.
- source_word: אָמַר
  choice: dit
  rationale: Dans cette formule prophétique, le présent français maintient le caractère direct et actuel de l’oracle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Dieu des armées
  rationale: צְבָאוֹת désigne des armées ou des troupes. « Armées » est intelligible en français moderne et ne précise pas si elles sont terrestres ou célestes.
- source_word: שְׁמוֹ
  choice: dont le nom est
  rationale: Cette tournure française naturelle conserve l’affirmation explicite du texte hébreu concernant le nom, sans donner à « nom » une majuscule interprétative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve le caractère personnel du nom divin sans lui substituer un titre.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: armées
  alternative: puissances / armées célestes
  rationale: « Armées » rend le sens lexical de façon claire tout en préservant l’indétermination du texte quant à la nature exacte de ces armées.
- issue: Relation syntaxique entre Yahweh et אֱלֹהֵי צְבָאוֹת שְׁמוֹ
  choice: dont le nom est « Dieu des armées »
  alternative: « Dieu des armées » est son nom
  rationale: La relative donne une phrase française fluide tout en conservant la proposition nominale hébraïque qui identifie explicitement son nom. L’alternative est plus formelle mais sensiblement moins naturelle.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Déporter » est idiomatique dans un contexte de déplacement forcé collectif; la note conserve l’équivalent plus littéral « exiler ». Les guillemets autour du titre final clarifient que celui-ci est présenté comme un nom.
