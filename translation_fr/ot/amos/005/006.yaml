revisions:
- from: Recherchez Yahvé et vivez ! Sinon, il se déchaînera[a] comme un feu dans la maison de Joseph, il la dévorera, et personne ne pourra l’éteindre pour Béthel[b].
  to: Recherchez Yahvé et vivez ! Sinon, il fera irruption comme un feu dans la maison de Joseph ; le feu la dévorera, et personne ne pourra l’éteindre pour Béthel[a].
  rationale: La révision distingue explicitement Yahvé, sujet probable de l’irruption, du feu, sujet féminin du verbe « dévorer » en hébreu. Elle conserve l’ambiguïté du sujet initial dans la note et maintient « pour Béthel », avec l’explication du tour hébreu difficile. Les deux notes d’origine sont regroupées sous l’unique ancre placée après la proposition concernée, afin d’éviter une note culturelle détachée du terme qu’elle explique.
