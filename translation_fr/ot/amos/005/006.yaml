source:
  edition: WLC
  text: דִּרְשׁ֥וּ אֶת יְהוָ֖ה וִֽ/חְי֑וּ פֶּן יִצְלַ֤ח כָּ/אֵשׁ֙ בֵּ֣ית יוֹסֵ֔ף וְ/אָכְלָ֥ה וְ/אֵין מְכַבֶּ֖ה לְ/בֵֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/006.yaml
  text: Seek Yahweh and live[a], lest he break out like fire in the house of Joseph, and it consume[b], with no one to quench it for Bethel.
translation:
  language: fr
  text: Recherchez Yahvé et vivez ! Sinon, il fera irruption comme un feu dans la maison de Joseph ; le feu la dévorera, et personne ne pourra l’éteindre pour Béthel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sujet du verbe hébreu traduit par « il fera irruption » n’est pas exprimé. Il s’agit très probablement de Yahvé, mentionné juste avant ; on pourrait aussi comprendre qu’un feu fasse irruption. Béthel était un sanctuaire important du royaume du Nord. Littéralement, la fin du verset dit : « et il n’y a personne pour éteindre pour Béthel ».'
    reason: alternative_reading; cultural_note
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Recherchez
  rationale: L’impératif pluriel de דרשׁ, dans ce contexte prophétique, appelle à se tourner activement vers Dieu. « Recherchez » exprime cette démarche sans la réduire à une simple demande de renseignements.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle du nom divin représente directement le tétragramme plutôt que de lui substituer un titre.
- source_word: וִחְיוּ
  choice: et vivez
  rationale: Cette formulation conserve les deux impératifs brefs de l’hébreu et laisse entendre à la fois l’exhortation et son résultat.
- source_word: פֶּן
  choice: Sinon
  rationale: פֶּן introduit ici la conséquence redoutée. « Sinon » rend clairement l’avertissement en français moderne, sans la tournure plus soutenue « de peur que ».
- source_word: יִצְלַח
  choice: il se déchaînera
  rationale: Avec la comparaison au feu, le verbe évoque une irruption puissante. « Se déchaîner » restitue cette image avec naturel, tandis que le pronom garde Yahvé comme référent probable.
- source_word: כָּאֵשׁ
  choice: comme un feu
  rationale: Comparaison directe et idiomatique qui conserve l’image hébraïque.
- source_word: בֵּית יוֹסֵף
  choice: la maison de Joseph
  rationale: Cette désignation traditionnelle du royaume du Nord est maintenue plutôt que remplacée par une interprétation géopolitique.
- source_word: וְאָכְלָה
  choice: il la dévorera
  rationale: Le pronom masculin français renvoie naturellement au « feu », tandis que « la » reprend « la maison de Joseph ». « Dévorer » convient à l’image du feu et rend explicites seulement les référents imposés par le contexte.
- source_word: וְאֵין מְכַבֶּה
  choice: et personne ne pourra l’éteindre
  rationale: Cette tournure française exprime clairement l’absence de quiconque pour éteindre le feu.
- source_word: לְבֵית אֵל
  choice: pour Béthel
  rationale: « Béthel » est ici le nom du grand sanctuaire du royaume du Nord. « Pour » préserve la préposition hébraïque difficile sans imposer « à » ou « dans ».
theological_decisions:
- issue: Référent du sujet implicite de יִצְלַח
  choice: Le pronom « il » renvoie probablement à Yahvé.
  alternative: 'Le feu lui-même serait le sujet implicite : « qu’un feu ne se déchaîne » ou « que cela ne se propage comme un feu ».'
  rationale: Yahvé est le référent explicite le plus proche, et l’image prophétique présente souvent son jugement comme un feu. Une note conserve toutefois l’ambiguïté grammaticale réelle.
- issue: Sens de Béthel
  choice: Béthel est le nom du lieu et du centre cultuel du royaume du Nord.
  alternative: 'Traduire le nom selon son sens étymologique : « maison de Dieu ».'
  rationale: Dans Amos, le contexte historique et géographique désigne clairement la ville-sanctuaire de Béthel.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme bref de l’exhortation est conservé. « Sinon » évite un tour archaïsant, tandis que « maison de Joseph » maintient la désignation prophétique. La formulation garde « pour Béthel » en raison de l’ambiguïté de la préposition hébraïque, expliquée en note.
