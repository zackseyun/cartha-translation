id: AMO.5.14
reference: Amos 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דִּרְשׁוּ ט֥וֹב וְ/אַל רָ֖ע לְמַ֣עַן תִּֽחְי֑וּ וִ/יהִי כֵ֞ן יְהוָ֧ה אֱלֹהֵֽי צְבָא֛וֹת אִתְּ/כֶ֖ם כַּ/אֲשֶׁ֥ר אֲמַרְתֶּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/014.yaml
  text: Seek good and not evil[a], so that you may live; and so Yahweh, the God of hosts, will be with you, as you have said.
translation:
  language: fr
  text: Recherchez le bien et non le mal, afin que vous viviez. Alors Yahweh, le Dieu des armées, sera avec vous, comme vous l’avez dit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme vous le dites ». L’accompli hébreu peut renvoyer à ce qu’ils ont affirmé auparavant au sujet de la présence de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Recherchez
  rationale: Le verbe דרשׁ exprime ici une recherche active et soutenue. « Recherchez » conserve à la fois la force de l’impératif prophétique et sa portée morale et relationnelle.
- source_word: טוֹב וְאַל רָע
  choice: le bien et non le mal
  rationale: Les adjectifs substantivés forment une antithèse morale concise. Cette formulation naturelle en français préserve le parallélisme serré de l’hébreu.
- source_word: לְמַעַן תִּחְיוּ
  choice: afin que vous viviez
  rationale: לְמַעַן marque le but ou le résultat. « Afin que » en conserve clairement la valeur sans expliciter davantage la nature de la vie promise.
- source_word: וִיהִי כֵן
  choice: Alors … sera
  rationale: La forme verbale et כֵן présentent la présence divine comme la conséquence attendue de la recherche du bien. « Alors » rend ce lien de manière idiomatique et évite d’affirmer une présence divine déjà acquise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui préserve sa fonction de nom personnel dans le texte hébreu.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: צְבָאוֹת désigne des armées ou des troupes. « Dieu des armées » est compréhensible en français moderne et conserve l’étendue possible du titre sans préciser s’il s’agit d’armées célestes ou terrestres.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: La préposition indique ici la présence et l’accompagnement; « avec vous » en est l’équivalent direct.
- source_word: כַּאֲשֶׁר אֲמַרְתֶּם
  choice: comme vous l’avez dit
  rationale: L’accompli hébreu peut renvoyer à une affirmation antérieure des destinataires. Le passé composé conserve cette nuance rétrospective sans transformer leur parole en accusation explicite.
theological_decisions:
- issue: La présence de Yahweh est-elle affirmée sans condition ou présentée comme la conséquence de la recherche du bien ?
  choice: « Alors Yahweh … sera avec vous » présente cette présence comme une conséquence de l’exhortation.
  alternative: « Et ainsi Yahweh … est avec vous » pourrait être compris comme une affirmation plus statique.
  rationale: Dans le contexte de l’appel à la repentance, la construction hébraïque relie la vie et la présence divine à la recherche du bien. Cette formulation maintient aussi la tension avec la prétention du peuple évoquée dans la dernière proposition.
- issue: La dernière proposition rapporte-t-elle une parole passée ou habituelle du peuple ?
  choice: « comme vous l’avez dit » retient la valeur rétrospective naturelle de l’accompli.
  alternative: « comme vous le dites » est également possible si l’expression vise leur affirmation habituelle ou actuelle.
  rationale: L’accompli אֲמַרְתֶּם favorise une parole déjà prononcée, mais le français au présent reste contextuellement possible; cette variation est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. L’antithèse « le bien … le mal » reste concise; « afin que » convient au registre prophétique sans être archaïque. La coupure en deux phrases rend clairement la conséquence exprimée par « Alors ».
