  rationale: La révision rend le résultat de תַּשְׁאִיר par « laisser subsister », plus proche du sens de « laisser rester », et corrige la note afin qu’elle ne présente pas « avec » comme un élément littéral de l’hébreu. Le sens militaire demeure signalé comme contextuel plutôt que lexicalement imposé.
