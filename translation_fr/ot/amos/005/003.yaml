    issue: « n’en conservera que »
    rationale: Le hiphil תַּשְׁאִיר signifie plus précisément « laisser subsister / laisser rester ». « Conserver » peut suggérer une conservation délibérée plutôt que le reste qui demeure après le désastre.
  - severity: low
    issue: Formulation de la note comme si « avec » appartenait au littéral
    rationale: L’hébreu dit littéralement qu’une ville « sort mille » puis « sort cent »; « avec » et « hommes » explicitent le contingent sous-entendu. La note devrait distinguer clairement le littéral de cette explicitation.
