review_pass:
  verdict: revise
  source_fidelity: Le sens militaire est fortement suggéré par les effectifs, mais le verbe hébreu signifie littéralement « sortir » et présente la ville comme sujet. « Part au combat avec mille hommes » est une explicitation contextuelle recevable; « laissera subsister » rend plus directement le hiphil de שׁאר que « conservera ».
  naturalness: La formulation proposée est naturelle en français moderne et conserve le parallélisme. « Il ne lui en restera que… » est plus idiomatique, mais déplacerait légèrement l’agentivité du verbe; « n’en laissera subsister que… » est à la fois naturel et plus proche de la construction source.
  terminology: « le Seigneur Yahweh » distingue correctement אֲדֹנָי et יהוה conformément au choix de rendu fourni. « maison d’Israël » préserve la désignation collective. Le maintien de « pour » est possible, mais la tournure finale reste quelque peu opaque; elle reflète néanmoins le לְ relationnel sans interprétation confessionnelle.
  issues:
