source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָ/עִ֛יר הַ/יֹּצֵ֥את אֶ֖לֶף תַּשְׁאִ֣יר מֵאָ֑ה וְ/הַ/יּוֹצֵ֥את מֵאָ֛ה תַּשְׁאִ֥יר עֲשָׂרָ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/003.yaml
  text: 'For thus says the Lord GOD: The city that marches out a thousand will have a hundred left[a], and the one that marches out a hundred will have ten left, for the house of Israel.'
translation:
  language: fr
  text: 'Car ainsi parle le Seigneur Yahweh :


    « La ville qui part au combat avec mille hommes n’en laissera subsister que cent[a], et celle qui part avec cent hommes n’en laissera subsister que dix, pour la maison d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui sort mille… qui sort cent ». Les nombres désignent vraisemblablement des contingents; « part au combat avec … hommes » explicite le contexte militaire.'
    reason: Distinguer le libellé littéral du verbe hébreu (« sortir ») de l’explicitation militaire contextuelle et de l’ajout sous-entendu d’« hommes ».
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Car ainsi parle
  rationale: Conserve le lien explicatif de כִּי et la formule prophétique solennelle, dans un français naturel.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: 'Rend distinctement les deux éléments du titre divin : אֲדֹנָי par « le Seigneur » et le nom personnel יהוה par « Yahweh ».'
- source_word: הָעִיר
  choice: La ville
  rationale: Le nom est défini en hébreu et désigne ici la collectivité urbaine qui fournit un contingent.
- source_word: הַיֹּצֵאת
  choice: qui part au combat
  rationale: Le verbe signifie littéralement « sortir » ou « partir ». Le dénombrement des hommes et des survivants indique vraisemblablement une sortie militaire ; cette valeur contextuelle est explicitée sans remplacer l’image de la ville qui part.
- source_word: אֶלֶף / מֵאָה / עֲשָׂרָה
  choice: mille hommes / cent / dix
  rationale: Les nombres sont rendus directement. « hommes » est explicité une seule fois pour rendre intelligible en français le contingent militaire sous-entendu, puis repris par le pronom « en ».
- source_word: תַּשְׁאִיר
  choice: n’en conservera que
  rationale: Le hiphil de שׁאר exprime le fait de laisser subsister. Cette formulation française présente naturellement le très faible reste, tandis que « ne… que » rend l’implication restrictive du contraste numérique.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: Conserve le marqueur relationnel לְ et l’expression collective et historique « maison d’Israël ».
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix retenu distingue le titre אֲדֹנָי du nom divin יהוה et préserve explicitement le nom d’alliance, sans produire l’expression redondante « le Seigneur SEIGNEUR ».
- issue: Nature de la catastrophe annoncée
  choice: départ au combat et survivants fortement réduits
  alternative: simple sortie d’une population sans précision militaire
  rationale: Le contexte des contingents de mille et de cent favorise nettement le sens militaire, mais la note signale que le verbe hébreu lui-même dit seulement « sortir/partir », afin de ne pas dissimuler l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure parallèle et la désignation « maison d’Israël » sont conservées. L’ajout contextuel « hommes » évite une tournure obscure en français ; il n’est pas répété dans le second membre.
