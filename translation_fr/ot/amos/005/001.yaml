source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר אָנֹכִ֜י נֹשֵׂ֧א עֲלֵי/כֶ֛ם קִינָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/001.yaml
  text: 'Hear this word that I am taking up over you as a lament[a], O house of Israel:'
translation:
  language: fr
  text: 'Écoutez cette parole que je prononce sur vous comme une complainte[a], maison d’Israël :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « que j’entonne à votre sujet comme un chant funèbre » ; littéralement, l’hébreu dit : « que je porte sur vous une complainte ».'
    reason: Alternative lexicale et explication de l’expression idiomatique hébraïque.
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » rend naturellement en français l’appel solennel du prophète.
- source_word: הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: דבר peut désigner une parole ou un message. « Cette parole » conserve la formule prophétique et sa concision.
- source_word: אֲשֶׁר אָנֹכִי נֹשֵׂא
  choice: que je prononce
  rationale: נשא signifie littéralement « soulever, porter » et, avec קינה, forme l’expression idiomatique « entonner/prononcer une complainte ». « Je prononce » est naturel tout en laissant la métaphore littérale à la note.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: La préposition על peut ici signifier qu’une complainte est prononcée sur quelqu’un; « sur vous » préserve l’image funèbre sans imposer le sens plus nettement hostile de « contre vous ».
- source_word: קִינָה
  choice: comme une complainte
  rationale: קינה désigne une lamentation solennelle, souvent funèbre. « Complainte » convient au registre prophétique et distingue ce chant formel d’une simple plainte.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: L’expression désigne collectivement le peuple d’Israël. Sans interjection ajoutée, le vocatif demeure clair et solennel en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le tour « prononce sur vous comme une complainte » garde la solennité et l’ambiguïté de על, tandis que la note explicite l’image littérale et le caractère potentiellement funèbre de קינה.
