id: AMO.5.23
reference: Amos 5:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָסֵ֥ר מֵ/עָלַ֖/י הֲמ֣וֹן שִׁרֶ֑י/ךָ וְ/זִמְרַ֥ת נְבָלֶ֖י/ךָ לֹ֥א אֶשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/023.yaml
  text: Take away from me the noise of your songs[a], and I will not listen to the melody of your harps.
translation:
  language: fr
  text: Éloigne de moi le vacarme de tes chants ; je n’écouterai pas la musique de tes harpes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lyres » ; l’hébreu désigne un ancien instrument à cordes dont l’équivalent moderne exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Éloigne
  rationale: L’impératif exprime un ordre ferme de retirer quelque chose de la présence du locuteur. « Éloigne de moi » est naturel en français et conserve cette force.
- source_word: מֵעָלַי
  choice: de moi
  rationale: Littéralement « de dessus moi » ; avec « éloigne », le français idiomatique « de moi » rend clairement le rejet personnel.
- source_word: הֲמוֹן
  choice: le vacarme
  rationale: Dans ce contexte de culte rejeté, le terme évoque une masse sonore bruyante plutôt qu’une simple multitude. « Vacarme » en restitue la nuance péjorative.
- source_word: שִׁרֶיךָ
  choice: tes chants
  rationale: Le pluriel désigne directement les chants adressés à Dieu. « Chants » convient au contexte cultuel et reste naturel.
- source_word: וְזִמְרַת
  choice: la musique
  rationale: Le nom peut désigner le chant ou la musique. « Musique » évite une répétition avec « chants » et convient à la mention de l’instrument.
- source_word: נְבָלֶיךָ
  choice: tes harpes
  rationale: נבל désigne un ancien instrument à cordes dont l’équivalent moderne exact demeure incertain. « Harpes » est une désignation française familière, accompagnée d’une note.
- source_word: לֹא אֶשְׁמָע
  choice: je n’écouterai pas
  rationale: La négation avec l’imparfait hébreu exprime ici le refus volontaire de prêter l’oreille, mieux rendu par « ne pas écouter » que par le simple « ne pas entendre ».
theological_decisions:
- issue: Force du rejet divin du culte
  choice: Le verset formule un rejet direct et vigoureux des chants cultuels.
  alternative: Employer un terme neutre comme « son » pour הֲמוֹן et traduire « je n’entendrai pas ».
  rationale: Le contexte immédiat condamne un culte dissocié de la justice. « Vacarme » et « je n’écouterai pas » préservent la vigueur prophétique sans ajouter d’explication doctrinale au texte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier suit les formes hébraïques de deuxième personne et représente collectivement Israël. Le parallélisme entre les chants et la musique instrumentale est conservé.
