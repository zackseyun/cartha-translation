id: AMO.5.22
reference: Amos 5:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אִם תַּעֲלוּ לִ֥/י עֹל֛וֹת וּ/מִנְחֹתֵי/כֶ֖ם לֹ֣א אֶרְצֶ֑ה וְ/שֶׁ֥לֶם מְרִיאֵי/כֶ֖ם לֹ֥א אַבִּֽיט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/022.yaml
  text: For even if you offer up to me burnt offerings and your grain offerings[a], I will not accept them; and I will not look upon the peace offerings of your fattened animals.
translation:
  language: fr
  text: Car, même si vous m’offrez des holocaustes et vos offrandes de céréales, je ne les agréerai pas ; et je ne regarderai pas les sacrifices de paix[a] de vos bêtes engraissées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion ». Le terme hébreu désigne une catégorie particulière de sacrifices associée au bien-être, à la paix et à la communion.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car, même si
  rationale: Cette tournure conserve à la fois le lien avec la dénonciation précédente et la valeur concessive de l’expression hébraïque.
- source_word: תַּעֲלוּ לִי
  choice: vous m’offrez
  rationale: Le hiphil de עלה, employé avec des objets sacrificiels, désigne ici l’action de faire monter une offrande sur l’autel ; « offrir » restitue naturellement cet emploi cultuel en français.
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: « Holocaustes » est le terme français établi pour les sacrifices entièrement brûlés sur l’autel.
- source_word: וּמִנְחֹתֵיכֶם
  choice: et vos offrandes de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne une offrande végétale, principalement céréalière, plutôt qu’un don générique.
- source_word: לֹא אֶרְצֶה
  choice: je ne les agréerai pas
  rationale: Le verbe רצה exprime ici l’acceptation favorable d’un sacrifice. « Agréer » garde cette nuance cultuelle tout en restant intelligible.
- source_word: וְשֶׁלֶם
  choice: et … les sacrifices de paix
  rationale: Le terme désigne une catégorie sacrificielle liée au bien-être, à la paix et à la communion. « Sacrifices de paix » maintient le lien lexical avec שָׁלוֹם sans réduire cette catégorie à une seule de ses dimensions.
- source_word: מְרִיאֵיכֶם
  choice: de vos bêtes engraissées
  rationale: Le nom renvoie à du bétail engraissé ; cette formulation est précise, actuelle et dépourvue d’archaïsme.
- source_word: לֹא אַבִּיט
  choice: je ne regarderai pas
  rationale: Cette traduction préserve la métaphore visuelle du verbe נבט et exprime le refus divin d’accorder la moindre considération à ces sacrifices.
theological_decisions:
- issue: Préserver la spécificité cultuelle des offrandes d’Israël sans introduire une interprétation doctrinale ultérieure
  choice: 'Maintenir les catégories distinctes : « holocaustes », « offrandes de céréales » et « sacrifices de paix ».'
  alternative: Employer des termes généraux comme « sacrifices » ou « offrandes ».
  rationale: Le prophète nomme des catégories précises du culte d’Israël. Les conserver empêche d’aplatir la portée de sa dénonciation et ne tranche pas au-delà de ce que dit le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien argumentatif avec le verset précédent, tandis que les termes sacrificiels établis maintiennent la précision du texte hébreu.
