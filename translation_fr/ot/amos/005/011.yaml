  variant: modern international French
source:
  edition: WLC
  text: לָ֠/כֵן יַ֣עַן בּוֹשַׁסְ/כֶ֞ם עַל דָּ֗ל וּ/מַשְׂאַת בַּר֙ תִּקְח֣וּ מִמֶּ֔/נּוּ בָּתֵּ֥י גָזִ֛ית בְּנִיתֶ֖ם וְ/לֹא תֵ֣שְׁבוּ בָ֑/ם כַּרְמֵי חֶ֣מֶד נְטַעְתֶּ֔ם וְ/לֹ֥א תִשְׁתּ֖וּ אֶת יֵינָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/011.yaml
  text: Therefore[a], because you trample on the poor and take a grain tax from him, you have built houses of cut stone, but you will not live in them; you have planted delightful vineyards[c][b], but you will not drink their wine.
translation:
  language: fr
  text: C’est pourquoi, puisque vous piétinez le pauvre et exigez de lui un tribut de céréales[a], vous avez bâti des maisons en pierre de taille[b], mais vous ne les habiterez pas ; vous avez planté des vignobles de choix[c], mais vous ne boirez pas leur vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui imposez une redevance en céréales ». L’expression hébraïque désigne une charge imposée, acquittée en céréales.
    reason: lexical_alternative
  - marker: b
    text: Ou « des maisons de pierre taillée ».
    reason: lexical_alternative
  - marker: c
    text: Ou « des vignobles agréables » ou « des vignobles désirables ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Voilà pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire annoncée par le prophète, avec plus de force qu’un simple « alors ».
- source_word: יַעַן
  choice: parce que
  rationale: Conserve le rapport causal explicite entre l’exploitation dénoncée et le jugement annoncé.
- source_word: בּוֹשַׁסְכֶם עַל דָּל
  choice: vous piétinez le pauvre
  rationale: Maintient l’image concrète et violente du verbe hébreu plutôt que de la généraliser par « opprimez ».
- source_word: וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ
  choice: et prélevez sur lui une redevance en céréales
  rationale: מַשְׂאַת désigne ici une charge ou un prélèvement, et בַּר les céréales. « Redevance » évite de présumer trop précisément la forme administrative du prélèvement.
- source_word: בָּתֵּי גָזִית
  choice: des maisons en pierre de taille
  rationale: Rend précisément la pierre travaillée et coûteuse sans ajouter l’idée non exprimée de palais ou de demeures luxueuses.
- source_word: בְּנִיתֶם
  choice: vous avez bâti
  rationale: Le passé composé présente l’action accomplie dont les auteurs seront privés du bénéfice.
- source_word: וְלֹא תֵשְׁבוּ בָם
  choice: mais vous ne les habiterez pas
  rationale: Formulation directe, actuelle et digne pour le fait de ne pas demeurer dans les maisons bâties.
- source_word: כַּרְמֵי חֶמֶד
  choice: des vignobles de choix
  rationale: חֶמֶד exprime ce qui est désirable, précieux ou agréable. « De choix » restitue cette qualité sans lourdeur.
- source_word: נְטַעְתֶּם
  choice: vous avez planté
  rationale: Le passé composé fait pendant à « vous avez bâti » et souligne un travail déjà accompli dont la jouissance sera refusée.
- source_word: וְלֹא תִשְׁתּוּ אֶת יֵינָם
  choice: mais vous ne boirez pas leur vin
  rationale: Préserve la brièveté de l’hébreu ainsi que l’ironie du fruit attendu mais non consommé.
theological_decisions:
- issue: Nature de l’annonce de jugement
  choice: 'Une annonce prophétique directe : les richesses acquises par l’exploitation ne profiteront pas à leurs détenteurs.'
  alternative: Un simple proverbe moral général sur l’injustice.
  rationale: La deuxième personne et les futurs négatifs situent le verset dans une sentence prophétique précise, et non dans une maxime abstraite.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la construction et de la plantation, suivi dans chaque cas de la privation annoncée, est conservé. Les images concrètes de l’exploitation et du luxe restent visibles sans ajout confessionnel ni résolution excessive des nuances lexicales.
