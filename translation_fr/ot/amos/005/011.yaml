  to: C’est pourquoi, puisque vous piétinez le pauvre et exigez de lui un tribut de céréales[a], vous avez bâti des maisons en pierre de taille[b], mais vous ne les habiterez pas ; vous avez planté des vignobles de choix[c], mais vous ne boirez pas leur vin.
  rationale: La révision améliore l’idiomaticité sans modifier le sens ni atténuer la force de l’accusation. Elle conserve les deux articulations logiques de l’hébreu, le singulier collectif « le pauvre / de lui », le parallélisme des actions achevées et des privations futures, ainsi que les ancres de notes a, b et c.
