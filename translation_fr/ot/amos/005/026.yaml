  text: וּ/נְשָׂאתֶ֗ם אֵ֚ת סִכּ֣וּת מַלְכְּ/כֶ֔ם וְ/אֵ֖ת כִּיּ֣וּן צַלְמֵי/כֶ֑ם כּוֹכַב֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר עֲשִׂיתֶ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/026.yaml
  text: And you carried Sikkuth your king[a], and Kiyyun your images, the star of your god[c][b], which you made for yourselves.
translation:
  language: fr
  text: Et vous avez porté Sikkouth, votre roi[a], et Kiyyoun[b], vos images, l’étoile de votre dieu[c], que vous avez fabriqués pour vous-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre Molek ». L’hébreu se lit littéralement « votre roi », mais une ancienne tradition d’interprétation y voit la divinité Molek (ou Moloch), comme en Actes 7.43.
    reason: alternative_reading
  - marker: b
    text: Sikkouth et Kiyyoun sont des noms rares, probablement associés à un culte astral ; leur identification exacte reste incertaine.
    reason: cultural_note
  - marker: c
    text: On pourrait aussi comprendre « l’étoile de vos dieux », mais la vocalisation du texte massorétique appuie le singulier « votre dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשָׂאתֶם
  choice: Vous avez porté
  rationale: Le qal accompli, 2e personne du pluriel, décrit le transport d’objets cultuels. « Porter » est naturel et précis en français moderne; la conjonction peut rester implicite puisque le verset dépend étroitement du contexte précédent.
- source_word: סִכּוּת
  choice: Sikkouth
  rationale: Ce terme rare et difficile est vraisemblablement un nom propre. La translittération préserve l’incertitude au lieu d’imposer une identification conjecturale.
- source_word: מַלְכְּכֶם
  choice: votre roi
  rationale: Le texte massorétique porte littéralement « votre roi ». Une identification à Molek/Moloch est ancienne mais interprétative; elle est donc signalée en note.
- source_word: כִּיּוּן
  choice: Kiyyoun
  rationale: Nom rare, probablement lié à un culte astral. Sa translittération évite une identification trop assurée, notamment à Saturne.
- source_word: צַלְמֵיכֶם
  choice: vos images
  rationale: צֶלֶם désigne une image ou une représentation. « Images » reste plus formellement exact et moins interprétatif qu’« idoles ».
- source_word: כּוֹכַב אֱלֹהֵיכֶם
  choice: l’étoile de votre dieu
  rationale: Cette traduction conserve la relation construite de l’hébreu et le singulier indiqué par la vocalisation massorétique, sans préciser abusivement le rapport exact avec les noms précédents.
- source_word: אֲשֶׁר עֲשִׂיתֶם לָכֶם
  choice: que vous vous étiez fabriquées
  rationale: Le plus-que-parfait exprime naturellement en français l’antériorité de la fabrication par rapport au transport; la tournure pronominale rend la valeur de לָכֶם, « pour vous-mêmes ».
theological_decisions:
- issue: Faut-il comprendre מַלְכְּכֶם comme le nom d’une divinité ou comme « votre roi » ?
  choice: votre roi
  alternative: votre Molek / Moloch votre roi
  rationale: La forme du texte massorétique se lit directement « votre roi ». La tradition qui y voit Molek/Moloch, notamment en lien avec Actes 7.43, demeure possible mais ne doit pas remplacer silencieusement le texte hébreu.
- issue: Faut-il interpréter סִכּוּת et כִּיּוּן ou les translittérer ?
  choice: Sikkouth et Kiyyoun
  alternative: le sanctuaire; ou identification explicite à des divinités astrales
  rationale: Le sens et l’identification de ces termes rares restent incertains. Les traiter comme des noms propres translittérés préserve cette incertitude réelle.
- issue: Le mot אֱלֹהֵיכֶם est-il singulier ou pluriel dans ce contexte ?
  choice: votre dieu
  alternative: vos dieux
  rationale: La vocalisation massorétique soutient ici le singulier, même si la graphie consonantique permettrait théoriquement une autre compréhension. L’alternative est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’énumération dense et l’ambiguïté du texte hébreu. Les noms propres sont translittérés selon une forme lisible en français, sans identification spéculative.
