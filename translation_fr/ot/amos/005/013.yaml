  text: לָ/כֵ֗ן הַ/מַּשְׂכִּ֛יל בָּ/עֵ֥ת הַ/הִ֖יא יִדֹּ֑ם כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/013.yaml
  text: Therefore the prudent man keeps silent at that time[a], for it is an evil time.
translation:
  language: fr
  text: C’est pourquoi, en ce temps-là, l’homme avisé garde le silence[a], car c’est un temps mauvais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sage » ou « celui qui discerne » ; l’hébreu est au masculin singulier, employé ici dans un sens représentatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence logique de l’accusation précédente, dans un français naturel et soutenu.
- source_word: הַמַּשְׂכִּיל
  choice: l’homme avisé
  rationale: Le participe hiphil de שכל désigne celui qui fait preuve de discernement et agit avec prudence. Le masculin singulier hébreu est conservé, avec sa portée représentative précisée en note.
- source_word: בָּעֵת הַהִיא
  choice: en ce temps-là
  rationale: Renvoie à la période précise évoquée dans le contexte; cette tournure est idiomatique et conserve la valeur démonstrative.
- source_word: יִדֹּם
  choice: garde le silence
  rationale: דמם exprime le fait de se taire ou de rester silencieux; « garde le silence » rend ici l’idée d’une retenue délibérée ou durable sans surinterpréter sa motivation.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison du silence dans un registre français clair et digne.
- source_word: עֵת רָעָה
  choice: un temps mauvais
  rationale: Conserve la formulation attributive de l’hébreu et la portée morale ou calamiteuse possible de רָעָה, sans la réduire à un simple désagrément.
- source_word: הִיא
  choice: c’est
  rationale: Le pronom féminin renvoie à עֵת; la construction française naturelle reprend le groupe nominal par « c’est ».
theological_decisions:
- issue: Portée du masculin singulier הַמַּשְׂכִּיל
  choice: l’homme avisé
  alternative: la personne avisée; celui qui discerne
  rationale: Le texte porte un masculin singulier vraisemblablement représentatif. La traduction maintient cette forme sans limiter explicitement l’énoncé aux hommes; la note signale les autres possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. « En ce temps-là » garde la référence temporelle précise; « temps mauvais » préserve la tension entre mal moral et période funeste.
