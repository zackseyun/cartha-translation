  text: נָֽפְלָה֙ לֹֽא תוֹסִ֣יף ק֔וּם בְּתוּלַ֖ת יִשְׂרָאֵ֑ל נִטְּשָׁ֥ה עַל אַדְמָתָ֖/הּ אֵ֥ין מְקִימָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/002.yaml
  text: Fallen[a], virgin Israel will not rise again; abandoned on her own land[b], she has no one to raise her up.
translation:
  language: fr
  text: 'Elle est tombée, elle ne se relèvera plus[a] :

    la vierge d’Israël[b].

    Délaissée sur sa terre,

    elle n’a personne pour la relever.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elle ne continuera pas à se lever » ; autrement : « elle ne se relèvera pas de nouveau ».'
    reason: lexical_alternative
  - marker: b
    text: « La vierge d’Israël » est une personnification poétique de la nation ; cette expression ne renvoie pas à la virginité littérale de ses habitants.
    reason: cultural_note
lexical_decisions:
- source_word: נָפְלָה
  choice: Elle est tombée
  rationale: Le qal accompli, troisième personne féminine singulière de נפל, présente la chute comme un fait désormais établi. La formulation brève ouvre naturellement la complainte en français.
- source_word: לֹא תוֹסִיף קוּם
  choice: elle ne se relèvera plus
  rationale: La construction יסף à l’hiphil suivie de l’infinitif קום signifie ici « faire de nouveau » sous négation. « Ne se relèvera plus » exprime avec naturel le caractère définitif annoncé par l’oracle.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: la vierge d’Israël
  rationale: Le syntagme construit personnifie poétiquement la nation sous les traits d’une jeune femme vierge. La traduction directe conserve l’image prophétique sans l’expliquer dans le corps du verset.
- source_word: נִטְּשָׁה
  choice: Délaissée
  rationale: Le niphal accompli de נטש décrit celle qui a été laissée sans secours. « Délaissée » convient au registre poétique et à l’image d’Israël gisant sans aide.
- source_word: עַל אַדְמָתָהּ
  choice: sur sa terre
  rationale: אֲדָמָה peut désigner le sol ou la terre. Avec le suffixe possessif et dans le contexte national, « sa terre » rend sobrement le sens territorial tout en conservant l’image concrète.
- source_word: אֵין מְקִימָהּ
  choice: elle n’a personne pour la relever
  rationale: La tournure existentielle אֵין avec le participe hiphil de קום et le suffixe féminin signifie qu’il n’existe personne qui la remette debout. « La relever » reprend la racine קום déjà rendue par « se relèvera » et conserve ainsi l’écho verbal hébreu.
theological_decisions:
- issue: Désignation métaphorique d’Israël comme « vierge » dans un oracle de jugement
  choice: Conserver directement « la vierge d’Israël ».
  alternative: « la jeune fille d’Israël »
  rationale: Le texte personnifie la nation dans le langage d’une complainte. Maintenir « vierge » préserve l’image prophétique de vulnérabilité et de chute tragique sans lui imposer une interprétation doctrinale supplémentaire.
- issue: Caractère définitif du jugement dans לֹא תוֹסִיף קוּם
  choice: Traduire par « elle ne se relèvera plus ».
  alternative: « elle ne se relèvera pas de nouveau »
  rationale: L’idiome hébreu annonce ici une chute décisive. La formulation retenue en restitue la force tout en restant idiomatique en français, sans exclure artificiellement les tensions créées par d’autres annonces prophétiques de restauration.
translation_notes:
  register: Français international moderne, clair et digne. La disposition en lignes fait entendre le rythme de la complainte. La répétition « se relèvera / relever » reproduit le jeu sur la racine hébraïque קום, tandis que « Délaissée » placé en tête de ligne conserve l’intensité poétique du texte.
