  naturalness: Le français est moderne, solennel et fluide. La mise en lignes sert bien le parallélisme. « Ceux qui savent se lamenter » est plus direct et naturel que la formulation actuelle, tout en évitant l’ajout de « chants ».
  terminology: « Yahvé », « le Dieu des armées » et « le Seigneur » conservent distinctement le nom divin et les deux titres. « Hélas ! Hélas ! » convient au cri de deuil. « Cultivateur » rend correctement le singulier générique איכר.
