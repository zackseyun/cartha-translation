id: AMO.5.16
reference: Amos 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֲדֹנָ֔/י בְּ/כָל רְחֹב֣וֹת מִסְפֵּ֔ד וּ/בְ/כָל חוּצ֖וֹת יֹאמְר֣וּ הוֹ ה֑וֹ וְ/קָרְא֤וּ אִכָּר֙ אֶל אֵ֔בֶל וּ/מִסְפֵּ֖ד אֶל י֥וֹדְעֵי נֶֽהִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/016.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the Lord: In all the squares there will be wailing, and in all the streets they will say, “Alas! Alas!” They will call the farmer to mourning[b], and those who know lamentation to wailing.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahvé, le Dieu des armées, le Seigneur :


    Sur toutes les places, on se lamentera,


    et dans toutes les rues, on dira :


    « Hélas ! Hélas ! »[a]


    On appellera le cultivateur au deuil,


    et ceux qui savent se lamenter, aux lamentations.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Malheur ! Malheur ! » L’hébreu הוֹ הוֹ est ici un cri de douleur ; « Hélas ! Hélas ! » met en avant le deuil plutôt qu’une annonce de condamnation.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui connaissent la lamentation » ; il s’agit probablement de personnes expertes dans les rites de deuil, peut-être des pleureurs professionnels.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence de l’accusation et de l’avertissement précédents, tout en restant naturel en français moderne.
- source_word: כֹּה אָמַר
  choice: ainsi parle
  rationale: Conserve la formule solennelle du messager prophétique dans une tournure française consacrée et intelligible.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin sous sa forme française courante au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: Rend צְבָאוֹת de manière transparente sans préciser s’il s’agit d’armées terrestres ou célestes.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rend le titre divin en apposition aux désignations précédentes.
- source_word: בְּכָל רְחֹבוֹת
  choice: Sur toutes les places
  rationale: רְחֹבוֹת désigne les vastes espaces publics des villes; « places » convient mieux ici que « rues ».
- source_word: מִסְפֵּד
  choice: on se lamentera / aux lamentations
  rationale: Le mot évoque l’expression publique et audible du deuil; la variation française évite une répétition maladroite tout en maintenant le même champ sémantique.
- source_word: בְכָל חוּצוֹת
  choice: dans toutes les rues
  rationale: Désigne ici les voies et espaces extérieurs de la ville, en parallèle avec les places.
- source_word: הוֹ הוֹ
  choice: Hélas ! Hélas !
  rationale: Reproduit une exclamation redoublée de douleur sans lui donner artificiellement la valeur d’un oracle de condamnation.
- source_word: אִכָּר
  choice: le cultivateur
  rationale: Rend le singulier générique désignant celui qui travaille la terre; « cultivateur » garde cette portée sans surinterpréter son statut.
- source_word: יֹדְעֵי נֶהִי
  choice: ceux qui savent entonner des chants funèbres
  rationale: Exprime l’idée de personnes expérimentées dans la lamentation rituelle, sans affirmer dans le texte qu’elles exercent nécessairement une profession rémunérée.
theological_decisions:
- issue: Rendu de la suite de titres יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי
  choice: Yahvé, le Dieu des armées, le Seigneur
  alternative: le SEIGNEUR, Dieu de l’univers, le Seigneur
  rationale: Le texte énonce le nom divin puis deux titres. La traduction les conserve séparément et ne remplace ni le nom propre par un titre ni « armées » par « univers », ce qui éliminerait une image et résoudrait sa portée.
- issue: Identité de ceux qui connaissent les chants funèbres
  choice: Formulation descriptive dans le texte, avec explication en note
  alternative: les pleureurs professionnels
  rationale: Le contexte peut viser des spécialistes ou des professionnels du deuil, mais le syntagme hébreu signifie littéralement des personnes qui connaissent la lamentation; la traduction ne transforme donc pas cette inférence en certitude.
translation_notes:
  register: Français moderne, digne et accessible, avec une mise en lignes qui fait ressortir le parallélisme poétique. « Ainsi parle » maintient la solennité prophétique; « chants funèbres » explicite naturellement נֶהִי sans imposer dans le corps du texte le statut professionnel des personnes concernées. Le marqueur [a] est placé après le cri auquel sa note se rapporte, plutôt qu’après la proposition introductive.
