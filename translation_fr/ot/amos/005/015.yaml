id: AMO.5.15
reference: Amos 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׂנְאוּ רָע֙ וְ/אֶ֣הֱבוּ ט֔וֹב וְ/הַצִּ֥יגוּ בַ/שַּׁ֖עַר מִשְׁפָּ֑ט אוּלַ֗י יֶֽחֱנַ֛ן יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁאֵרִ֥ית יוֹסֵֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/015.yaml
  text: Hate evil[a], and love good, and establish justice in the gate; perhaps Yahweh, the God of hosts[c][b], will be gracious to the remnant of Joseph.
translation:
  language: fr
  text: Détestez le mal, aimez le bien et faites régner la justice à la porte de la ville[a]. Peut-être alors Yahweh, le Dieu des armées, fera-t-il grâce au reste de Joseph[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La porte de la ville était le lieu public où les anciens et les responsables examinaient les affaires et rendaient la justice.
    reason: cultural_note
  - marker: b
    text: Ici, « Joseph » désigne collectivement ses descendants, en particulier le royaume du Nord. Le « reste de Joseph » correspond à ceux qui auront survécu au jugement.
    reason: cultural_note
lexical_decisions:
- source_word: שִׂנְאוּ רָע
  choice: Détestez le mal
  rationale: L’impératif שִׂנְאוּ exprime une opposition morale forte. « Détestez » conserve cette force en français actuel, tandis que « le mal » maintient le contraste substantivé avec « le bien ».
- source_word: וְאֶהֱבוּ טוֹב
  choice: aimez le bien
  rationale: La traduction directe garde le parallélisme antithétique « détestez… aimez » et le sens éthique de טוֹב.
- source_word: וְהַצִּיגוּ ... מִשְׁפָּט
  choice: faites régner la justice
  rationale: Le hiphil הַצִּיגוּ demande que la justice soit mise en place et maintenue dans la vie publique. « Faites régner » rend naturellement cette idée en français sans réduire מִשְׁפָּט à une décision judiciaire isolée.
- source_word: בַשַּׁעַר
  choice: à la porte de la ville
  rationale: La porte désigne le lieu urbain où se traitaient les affaires judiciaires et civiques. L’ajout explicatif « de la ville » rend l’image immédiatement compréhensible sans remplacer l’expression hébraïque par une abstraction.
- source_word: אוּלַי
  choice: Peut-être alors
  rationale: « Peut-être » conserve l’espérance sans certitude exprimée par אוּלַי. « Alors » explicite avec naturel le lien contextuel entre l’exhortation et l’éventuelle faveur divine, sans en faire une garantie.
- source_word: יֶחֱנַן
  choice: fera-t-il grâce
  rationale: Le verbe חנן désigne l’octroi bienveillant d’une faveur. « Faire grâce » restitue sa force tout en convenant au contexte d’un jugement annoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: Cette expression conserve la valeur large et concrète de צְבָאוֹת dans le titre divin, sans préciser indûment s’il s’agit exclusivement d’armées terrestres ou célestes.
- source_word: שְׁאֵרִית יוֹסֵף
  choice: le reste de Joseph
  rationale: « Le reste » désigne ceux qui subsistent après le jugement. « Joseph » est conservé comme désignation collective des descendants de Joseph, particulièrement du royaume du Nord.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par le titre traditionnel.
- issue: Incertitude exprimée par אוּלַי devant יֶחֱנַן
  choice: Peut-être alors Yahweh… fera-t-il grâce
  alternative: afin que Yahweh… fasse grâce
  rationale: 'La formulation retenue préserve l’incertitude et l’espérance du prophète : le retour à la justice ne permet pas de présumer de la grâce divine.'
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: le Dieu des armées
  alternative: le Dieu des armées célestes
  rationale: Le texte ne limite pas explicitement les « armées » aux êtres célestes. La traduction garde donc l’ampleur et une part de l’ambiguïté du titre.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Les impératifs sont nets, le parallélisme poétique est conservé, et l’inversion « fera-t-il » soutient un registre biblique naturel sans archaïsme excessif.
