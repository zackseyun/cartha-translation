source:
  edition: WLC
  text: הַ/הֹפְכִ֥ים לְ/לַעֲנָ֖ה מִשְׁפָּ֑ט וּ/צְדָקָ֖ה לָ/אָ֥רֶץ הִנִּֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/007.yaml
  text: you who turn justice into wormwood and cast righteousness down to the earth:[a][b]
translation:
  language: fr
  text: 'vous qui changez le droit en absinthe[a]

    et jetez la justice à terre[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en amertume » ; l’hébreu nomme une plante très amère et l’emploie ici comme image.
    reason: lexical_alternative
  - marker: b
    text: Ou « et laissez à terre ce qui est juste ». Le verbe peut signifier « déposer » ou « laisser », et le nom traduit par « justice » peut aussi désigner la droiture ou ce qui est juste.
    reason: alternative_reading
lexical_decisions:
- source_word: הַהֹפְכִים
  choice: vous qui changez
  rationale: Le participe muni de l’article a ici une valeur d’interpellation. La deuxième personne maintient l’adresse prophétique directe du contexte.
- source_word: לַעֲנָה
  choice: en absinthe
  rationale: Le terme hébreu désigne une plante très amère, employée ici comme image d’une justice rendue amère et nocive. « Absinthe » conserve cette image concrète.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte social et judiciaire, מִשְׁפָּט désigne l’ordre juste et l’exercice équitable du jugement. « Le droit » permet aussi de le distinguer du terme parallèle צְדָקָה.
- source_word: וּצְדָקָה
  choice: la justice
  rationale: צְדָקָה peut exprimer la justice, la droiture ou ce qui est juste. « La justice » est naturel en français dans ce contexte prophétique, tout en maintenant un terme distinct de מִשְׁפָּט.
- source_word: לָאָרֶץ
  choice: à terre
  rationale: Cette expression spatiale évoque l’abaissement et le mépris. « À terre » rend naturellement l’image en français moderne.
- source_word: הִנִּיחוּ
  choice: jetez
  rationale: Le hifil de נוח signifie fondamentalement faire reposer, déposer ou laisser. Avec « à terre » et dans ce contexte accusateur, « jetez » communique clairement l’abaissement délibéré, sans adopter l’interprétation plus abstraite « abandonnez ».
theological_decisions:
- issue: Rendu de צְדָקָה dans un contexte éthique prophétique
  choice: la justice
  alternative: la droiture / ce qui est juste
  rationale: Le mot recouvre à la fois la conformité à ce qui est juste et la justice dans les relations sociales. Le texte principal retient l’expression française la plus naturelle, tandis que la note préserve l’autre nuance sans réduire les deux termes hébreux à un seul concept.
translation_notes:
  register: Français international moderne, direct et solennel. Le parallélisme poétique est conservé sur deux lignes. « Absinthe » maintient l’image végétale biblique, explicitée en note pour éviter que le lecteur ne pense seulement à la boisson. Les termes proches מִשְׁפָּט et צְדָקָה sont distingués par « droit » et « justice ».
