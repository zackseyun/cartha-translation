  text: הַ/זְּבָחִ֨ים וּ/מִנְחָ֜ה הִֽגַּשְׁתֶּם לִ֧/י בַ/מִּדְבָּ֛ר אַרְבָּעִ֥ים שָׁנָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/025.yaml
  text: Did you bring me sacrifices and offerings in the wilderness for forty years[a], O house of Israel?
translation:
  language: fr
  text: M’avez-vous présenté des sacrifices et une offrande[a] dans le désert pendant quarante ans, maison d’Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des sacrifices et une offrande végétale ». Dans un contexte cultuel, le mot hébreu traduit par « offrande » peut désigner plus précisément une offrande de céréales.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּבָחִים
  choice: des sacrifices
  rationale: זֶבַח désigne couramment un sacrifice impliquant l’immolation. « Sacrifices » est naturel en français et suffisamment précis ici.
- source_word: וּמִנְחָה
  choice: et une offrande
  rationale: מִנְחָה peut désigner un don, un tribut ou, dans un contexte cultuel, une offrande végétale. Le singulier « une offrande » respecte la forme hébraïque et conserve dans le texte la portée lexicale plus large.
- source_word: הִגַּשְׁתֶּם
  choice: M’avez-vous présenté
  rationale: Le hifil de נגשׁ exprime ici l’action d’apporter ou de présenter des offrandes. « Présenter » convient aux deux compléments et garde le registre cultuel sans rendre le verbe lui-même par « offrir ».
- source_word: לִי
  choice: m’
  rationale: Le pronom indirect לִי est rendu naturellement par « m’ » dans la construction française « m’avez-vous présenté ».
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: Dans le contexte de l’Exode et de l’errance d’Israël, « désert » est le terme français courant, clair et porteur de la résonance biblique appropriée.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: « Pendant » exprime clairement la durée indiquée par le syntagme hébreu.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Cette formule conserve l’expression prophétique traditionnelle et sa fonction d’apostrophe, sans la réduire par paraphrase à « peuple d’Israël ».
theological_decisions:
- issue: Force rhétorique de la question
  choice: Conserver une question directe qui appelle implicitement une réponse négative ou met fortement Israël en cause, sans expliciter cette réponse.
  alternative: 'Paraphraser : « Vous ne m’avez pas vraiment présenté… »'
  rationale: La particule interrogative hébraïque et le contexte de la réprimande donnent à la phrase sa force rhétorique. L’explicitation de la réponse implicite supprimerait une tension réelle du texte.
- issue: Portée de la période de quarante ans
  choice: Laisser « pendant quarante ans » dépendre naturellement de l’acte de présenter, sans expliquer si la question nie toute offrande ou conteste plutôt sa destination et sa valeur.
  alternative: Préciser qu’Israël n’aurait offert aucun sacrifice à Dieu durant toute cette période.
  rationale: Le verset formule une question dense dont l’interprétation doit tenir compte du contexte biblique plus large. La traduction ne doit pas résoudre dans le corps du texte la tension entre cette question et les traditions cultuelles du désert.
translation_notes:
  register: Français moderne, international et digne. L’inversion interrogative maintient la vigueur prophétique. « Maison d’Israël » conserve la solennité de l’apostrophe biblique ; le vocatif final est séparé par une virgule. Le marqueur de note est placé après l’expression finale, avant l’espace précédant le point d’interrogation selon la typographie française.
