source:
  edition: WLC
  text: כִּ֤י יָדַ֨עְתִּי֙ רַבִּ֣ים פִּשְׁעֵי/כֶ֔ם וַ/עֲצֻמִ֖ים חַטֹּֽאתֵי/כֶ֑ם צֹרְרֵ֤י צַדִּיק֙ לֹ֣קְחֵי כֹ֔פֶר וְ/אֶבְיוֹנִ֖ים בַּ/שַּׁ֥עַר הִטּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/012.yaml
  text: For I know how many your transgressions are, and how great your sins are—oppressors of the righteous[a], takers of a bribe[b], and those who turn aside the needy in the gate.
translation:
  language: fr
  text: 'Car je sais combien vos révoltes sont nombreuses

    et combien vos péchés sont graves —

    vous qui opprimez le juste,

    qui acceptez des pots-de-vin[a]

    et qui écartez les pauvres à la porte de la ville[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner une rançon ou une compensation ; ici, le contexte judiciaire indique probablement un pot-de-vin.
    reason: lexical_alternative
  - marker: b
    text: La porte de la ville était le lieu où l’on jugeait les affaires et prenait les décisions publiques. Ici, « écarter les pauvres » signifie probablement leur refuser justice.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’avertissement ou du jugement précédent et conserve naturellement la valeur explicative de la conjonction.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait qal exprime ici la connaissance ferme et actuelle de Dieu; le présent français rend cette valeur avec naturel.
- source_word: רַבִּים פִּשְׁעֵיכֶם
  choice: combien sont nombreuses vos révoltes
  rationale: La tournure conserve la mise en relief de l’adjectif רַבִּים. « Révoltes » exprime la dimension volontaire et rebelle de פֶּשַׁע, au-delà du terme général « péchés ».
- source_word: וַעֲצֻמִים חַטֹּאתֵיכֶם
  choice: et combien graves vos péchés
  rationale: עֲצֻמִים évoque ici la force, le poids ou l’ampleur des fautes, et non simplement leur nombre. « Graves » communique clairement leur sévérité.
- source_word: צֹרְרֵי צַדִּיק
  choice: vous qui opprimez le juste
  rationale: Le participe de צרר décrit une action hostile ou oppressive. Le singulier générique « le juste » maintient la portée morale et judiciaire de צַדִּיק sans la limiter au seul sens d’« innocent ».
- source_word: לֹקְחֵי כֹפֶר
  choice: qui acceptez des pots-de-vin
  rationale: Dans ce contexte de corruption judiciaire, כֹפֶר désigne très probablement un paiement corrupteur. La note conserve son sens lexical plus large de rançon ou de compensation.
- source_word: וְאֶבְיוֹנִים
  choice: les pauvres
  rationale: אֶבְיוֹן désigne des personnes démunies et socialement vulnérables. « Les pauvres » est courant, clair et naturel en français moderne.
- source_word: בַּשַּׁעַר
  choice: à la porte de la ville
  rationale: La porte était le lieu où se traitaient les affaires judiciaires et publiques. L’ajout explicite « de la ville » évite une image indéterminée tout en conservant le cadre culturel du texte.
- source_word: הִטּוּ
  choice: écartez
  rationale: Le hiphil de נטה signifie faire dévier ou écarter. Cette formulation conserve l’image hébraïque sans réduire entièrement l’expression à une seule paraphrase juridique.
theological_decisions:
- issue: Sens de צַדִּיק dans un contexte prophétique de justice sociale
  choice: le juste
  alternative: l’innocent
  rationale: « Le juste » préserve à la fois la portée morale et la portée judiciaire du mot. « L’innocent » préciserait davantage le contexte judiciaire, mais restreindrait le champ sémantique.
- issue: Portée judiciaire de הִטּוּ appliqué aux pauvres
  choice: écartez les pauvres à la porte de la ville
  alternative: privez les pauvres de justice au tribunal
  rationale: Le texte principal maintient l’image et une part de l’ambiguïté de l’hébreu, tandis que la note explique l’implication judiciaire probable sans l’imposer comme unique traduction.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et la série des participes sont rendus par des propositions relatives parallèles. Les formulations « le juste » et « écartez » préservent la tension entre les dimensions morale, sociale et judiciaire du texte.
