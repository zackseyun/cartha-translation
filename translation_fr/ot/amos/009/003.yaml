    issue: La note [a] donne « au grand serpent » comme variante lexicale.
    rationale: Le nom hébreu נָחָשׁ désigne un serpent; il ne porte pas en lui-même le sens de « grand ». La note doit proposer une véritable alternative, telle que « serpent »/« snake » en fonction des usages français, sans ajouter une notion de taille.
  - severity: low
    issue: « à mes yeux » est ambigu en français.
    rationale: Cette expression peut se comprendre comme « selon mon appréciation ». « loin de mes yeux » conserve l’image spatiale et le sens de soustraction au regard exprimé par מִנֶּגֶד עֵינַי.
  revised_text: S’ils se cachent au sommet du Carmel, de là je les chercherai et je les prendrai. S’ils se dissimulent loin de mes yeux au fond de la mer, de là j’ordonnerai au serpent[a] de les mordre.
  revised_footnotes:
