source:
  edition: WLC
  text: וְ/אִם יֵחָֽבְאוּ֙ בְּ/רֹ֣אשׁ הַ/כַּרְמֶ֔ל מִ/שָּׁ֥ם אֲחַפֵּ֖שׂ וּ/לְקַחְתִּ֑י/ם וְ/אִם יִסָּ֨תְר֜וּ מִ/נֶּ֤גֶד עֵינַ/י֙ בְּ/קַרְקַ֣ע הַ/יָּ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/נָּחָ֖שׁ וּ/נְשָׁכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/003.yaml
  text: And if they hide themselves on the summit of Carmel[a], from there I will search them out and take them; and if they conceal themselves from before my eyes on the floor of the sea, from there I will command the serpent[b], and it will bite them.
translation:
  language: fr
  text: S’ils se cachent au sommet du Carmel, de là je les chercherai et je les prendrai. S’ils se dissimulent loin de mes yeux au fond de la mer, de là j’ordonnerai au serpent[a] de les mordre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au serpent ». Le mot hébreu peut se rendre par « serpent » ou « serpent/snake » selon le registre; il ne précise pas l’espèce.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵחָבְאוּ
  choice: se cachent
  rationale: Le niphal de חבא exprime ici le fait de se cacher; la tournure pronominale est naturelle en français et rend l’action délibérée.
- source_word: בְּרֹאשׁ הַכַּרְמֶל
  choice: au sommet du Carmel
  rationale: רֹאשׁ désigne le point le plus élevé; «sommet» conserve l’image spatiale sans ajouter «mont», absent de l’expression hébraïque.
- source_word: אֲחַפֵּשׂ
  choice: je les chercherai
  rationale: Le piel de חפשׂ évoque une recherche active et approfondie. En français, «chercherai» est naturel dans ce contexte et la provenance «de là» souligne que la recherche les atteindra.
- source_word: וּלְקַחְתִּים
  choice: et je les prendrai
  rationale: לקח a le sens large de «prendre». Ce choix préserve cette ampleur sans préciser indûment «saisir» ou «capturer».
- source_word: יִסָּתְרוּ
  choice: se dissimulent
  rationale: «Se dissimulent» distingue ce second verbe, סתר, de חבא rendu par «se cachent», tout en restant idiomatique.
- source_word: מִנֶּגֶד עֵינַי
  choice: à mes yeux
  rationale: La formule conserve l’image concrète des yeux tout en exprimant naturellement en français une tentative de se soustraire au regard divin.
- source_word: בְּקַרְקַע הַיָּם
  choice: au fond de la mer
  rationale: קַרְקַע désigne le sol ou la partie inférieure. «Au fond de la mer» est l’équivalent français courant et clair; «sur le sol de la mer» serait plus formel mais moins naturel.
- source_word: אֲצַוֶּה
  choice: j’ordonnerai
  rationale: צוה exprime un ordre; la construction française naturelle est «ordonner à [quelqu’un] de».
- source_word: הַנָּחָשׁ
  choice: serpent
  rationale: נחשׁ peut désigner un serpent ou un grand reptile ophidien. «Serpent» convient au registre prophétique sans imposer un symbolisme supplémentaire.
- source_word: וּנְשָׁכָם
  choice: de les mordre
  rationale: נשׁך signifie «mordre». L’infinitif dépend naturellement de «j’ordonnerai» en français et garde le serpent comme agent de l’action.
theological_decisions:
- issue: Omniscience divine et caractère inéluctable du jugement exprimés par une image anthropomorphique
  choice: Conserver la mention concrète des «yeux» dans «à mes yeux».
  alternative: Rendre par «hors de ma vue» ou «loin de mon regard».
  rationale: La formulation garde l’image hébraïque du regard divin et l’idée que nul lieu n’échappe à la recherche et au jugement de Dieu, sans développer une explication théologique étrangère au verset.
- issue: Discours divin à la première personne sans ajout du nom divin
  choice: Maintenir «je» sans insérer «le Seigneur».
  alternative: Ajouter «le Seigneur» pour expliciter le locuteur.
  rationale: L’hébreu poursuit un discours divin déjà engagé et ne répète pas ici le nom du locuteur; l’ajout dépasserait le texte du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux propositions introduites par «Même si» est conservé. La syntaxe évite les archaïsmes tout en maintenant la solennité de l’oracle. Le marqueur [a] est placé après «serpent» dans le texte principal.
