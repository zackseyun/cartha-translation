  rationale: La révision corrige la note lexicale, qui ajoutait indûment l’idée d’un « grand serpent », et lève l’ambiguïté française de « à mes yeux ». Elle emploie également « S’ils » pour refléter directement les deux propositions conditionnelles hébraïques, sans modifier le sens du passage.
