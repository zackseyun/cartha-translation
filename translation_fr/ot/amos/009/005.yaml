source:
  edition: WLC
  text: וַ/אדֹנָ֨/י יְהוִ֜ה הַ/צְּבָא֗וֹת הַ/נּוֹגֵ֤עַ בָּ/אָ֨רֶץ֙ וַ/תָּמ֔וֹג וְ/אָבְל֖וּ כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/עָלְתָ֤ה כַ/יְאֹר֙ כֻּלָּ֔/הּ וְ/שָׁקְעָ֖ה כִּ/יאֹ֥ר מִצְרָֽיִם־
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/005.yaml
  text: And the Lord GOD of hosts is the one who touches the earth[a], and it melts, and all who dwell in it mourn; and all of it rises like the Nile and sinks like the Nile of Egypt.
translation:
  language: fr
  text: 'Le Seigneur Yahweh, maître des armées[a], touche la terre[b] : elle fond, et tous ceux qui l’habitent sont en deuil. Elle se soulève tout entière comme le Nil, et elle s’abaisse comme le Nil d’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le titre hébreu associe « le Seigneur », le nom divin Yahweh et « des armées ». Il évoque Yahweh comme commandant des forces célestes et terrestres.
    reason: clarification_du_titre_divin
  - marker: b
    text: 'Ou : « le pays ». Le mot hébreu peut avoir l’un ou l’autre sens.'
    reason: ambiguïté_lexicale
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé associe אֲדֹנָי (« Seigneur ») au nom divin YHWH. La translittération « Yahweh » distingue clairement les deux éléments et évite le doublon français « le Seigneur, le Seigneur ».
- source_word: הַצְּבָאוֹת
  choice: maître des armées
  rationale: Le mot צְבָאוֹת désigne des armées ou des forces organisées, célestes ou terrestres. « Maître des armées » exprime naturellement en français l’autorité impliquée par ce titre, sans limiter explicitement sa portée aux seules armées humaines.
- source_word: הַנּוֹגֵעַ
  choice: est celui qui touche
  rationale: Le participe présente l’action comme une caractéristique du Seigneur. La tournure clivée « C’est… qui » rend cette valeur descriptive dans un français naturel, tandis que « touche » conserve le sens simple du verbe sans anticiper ses effets dévastateurs.
- source_word: בָּאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un pays. Le tableau théophanique et la mention de tous ceux qui l’habitent favorisent ici « la terre », tout en laissant l’autre possibilité signalée en note.
- source_word: וַתָּמוֹג
  choice: elle fond
  rationale: מוּג évoque la fonte, la dissolution ou l’effondrement. « Elle fond » conserve l’image forte et concise du texte prophétique.
- source_word: וְאָבְלוּ כָּל יֹשְׁבֵי בָהּ
  choice: et tous ceux qui l’habitent sont dans le deuil
  rationale: אבל exprime le deuil provoqué par une calamité. La formulation reste actuelle et rend la construction participiale « ceux qui l’habitent ».
- source_word: וְעָלְתָה כַיְאֹר כֻּלָּהּ
  choice: Elle se soulève tout entière comme le Nil
  rationale: Le sujet féminin demeure la terre. יְאֹר désigne ici le Nil et son mouvement de crue; « tout entière » rend כֻּלָּהּ.
- source_word: וְשָׁקְעָה כִּיאֹר מִצְרָיִם
  choice: et elle s’affaisse comme le Nil d’Égypte
  rationale: שׁקע signifie s’enfoncer, s’abaisser ou s’affaisser. « S’affaisse » maintient l’image physique appliquée à la terre, tandis que « le Nil d’Égypte » explicite le référent géographique du texte.
theological_decisions:
- issue: Rendu du nom divin YHWH dans le titre אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: Employer « Yahweh » représente directement le nom propre présent dans l’hébreu et préserve la distinction avec אֲדֹנָי, rendu par « Seigneur ». Cela évite aussi de faire d’une interprétation étymologique comme « l’Éternel » le contenu même du nom.
- issue: Portée du titre צְבָאוֹת
  choice: maître des armées
  alternative: des armées / des puissances célestes
  rationale: Le titre affirme l’autorité de Yahweh sur les forces placées sous son commandement. Le texte ne précise pas qu’il s’agit uniquement d’armées terrestres ou célestes; le rendu choisi conserve cette ampleur sans trancher.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe met en relief le participe hébreu sans lourdeur; les images de la fonte, du soulèvement et de l’affaissement sont conservées. Les coordinations répétées reflètent le mouvement cumulatif de l’hébreu.
