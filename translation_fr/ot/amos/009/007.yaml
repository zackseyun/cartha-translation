id: AMO.9.7
reference: Amos 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/ל֣וֹא כִ/בְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛/י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֶת יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/פְלִשְׁתִּיִּ֥ים מִ/כַּפְתּ֖וֹר וַ/אֲרָ֥ם מִ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/007.yaml
  text: Are you not like the Cushites to me[a], O sons of Israel? declares Yahweh. Did I not bring up Israel from the land of Egypt, and the Philistines from Caphtor[c][b], and Aram from Kir?
translation:
  language: fr
  text: « N’êtes-vous pas pour moi comme les Koushites[a], fils d’Israël ? — déclaration de Yahweh. N’ai-je pas fait monter Israël du pays d’Égypte, les Philistins de Caphtor[b] et Aram de Qir[c] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme les Éthiopiens » ; l’hébreu dit « Koushites », c’est-à-dire les gens de Koush.
    reason: lexical_alternative
  - marker: b
    text: Caphtor est un nom de lieu que beaucoup associent traditionnellement à la Crète, mais son identification exacte reste discutée.
    reason: cultural_note
  - marker: c
    text: Ou « les Araméens de Qir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: N’êtes-vous pas / N’ai-je pas
  rationale: L’interrogation rhétorique attend une réponse affirmative. Cette tournure française conserve directement la force des deux questions hébraïques.
- source_word: כִבְנֵי כֻשִׁיִּים
  choice: comme les Koushites
  rationale: La préposition כִּ marque la comparaison, et בְּנֵי désigne ici idiomatiquement les membres d’un peuple. « Koushites » rend le nom ethnogéographique hébreu sans l’identifier trop vite à l’Éthiopie moderne.
- source_word: אַתֶּם לִי
  choice: vous êtes pour moi
  rationale: Le datif לִי exprime la relation du point de vue de Yahweh. « Pour moi » reste direct sans réduire le sens à la seule apparence.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: La forme masculine plurielle sert de désignation nationale et a ici une valeur vocative. La traduction en conserve la forme lexicale.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule prophétique solennelle présente ce qui précède comme l’énoncé autoritatif de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui le distingue d’un titre tel que « le Seigneur ».
- source_word: הֶעֱלֵיתִי
  choice: j’ai fait monter
  rationale: Le hifil de עלה signifie littéralement « faire monter ». Ce choix maintient le même acte verbal pour les déplacements d’Israël, des Philistins et d’Aram, au prix d’une légère étrangeté naturelle dans ce contexte ancien.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: La traduction garde le nom explicite אֶרֶץ, « pays », et respecte le parallélisme des provenances.
- source_word: פְלִשְׁתִּיִּים
  choice: les Philistins
  rationale: Ethnonyme français établi.
- source_word: כַּפְתּוֹר
  choice: Caphtor
  rationale: Le nom propre est conservé, car son identification géographique exacte demeure discutée.
- source_word: אֲרָם
  choice: Aram
  rationale: L’hébreu peut désigner le pays ou, collectivement, son peuple. Le nom propre préserve cette ambiguïté et évite l’anachronisme « Syrie ».
- source_word: קִיר
  choice: Qir
  rationale: Translittération française du nom de lieu hébreu.
theological_decisions:
- issue: Portée de la comparaison entre Israël et les Koushites
  choice: La formulation place Israël, du point de vue de Yahweh, sur le même plan comparatif que les Koushites et met en question toute sécurité fondée uniquement sur l’identité nationale ou sur l’exode.
  alternative: La comparaison concernerait seulement les déplacements géographiques des peuples, sans rien dire de leur statut devant Dieu.
  rationale: La question « N’êtes-vous pas pour moi comme les Koushites ? » relativise la prétention d’Israël à une exception automatique, tandis que la suite attribue aussi à Yahweh les migrations d’autres peuples. La traduction laisse subsister cette tension sans en faire une explication doctrinale.
- issue: Valeur de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: peuple d’Israël / enfants d’Israël
  rationale: La désignation nationale est grammaticalement masculine plurielle. La rendre littéralement conserve à la fois sa forme et son adresse vocative.
- issue: Providence de Yahweh sur les migrations nationales
  choice: Le même verbe gouverne la sortie d’Israël, celle des Philistins et celle d’Aram.
  alternative: Employer « faire sortir » uniquement pour Israël afin de singulariser explicitement l’exode.
  rationale: L’hébreu construit un parallèle délibéré entre les trois déplacements. Répéter implicitement « faire monter » préserve ce parallèle sans nier les particularités historiques ou théologiques de l’exode.
translation_notes:
  register: Français international actuel, sobre et solennel. Les questions rhétoriques et le parallélisme hébreu sont maintenus. « Fait monter » conserve l’image verbale de la source malgré une légère étrangeté en français ; les noms anciens Koush, Caphtor, Aram et Qir évitent des identifications modernes incertaines.
