  text: וְ/אִם יֵלְכ֤וּ בַ/שְּׁבִי֙ לִ/פְנֵ֣י אֹֽיבֵי/הֶ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/חֶ֖רֶב וַ/הֲרָגָ֑תַ/ם וְ/שַׂמְתִּ֨י עֵינִ֧/י עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֥א לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/004.yaml
  text: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
translation:
  language: fr
  text: S’ils partent en captivité devant leurs ennemis, de là j’ordonnerai à l’épée de les tuer. Je fixerai mes yeux sur eux pour leur malheur, et non pour leur bien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour leur mal et non pour leur bien ». Ici, le mot hébreu traduit par « malheur » désigne une calamité ou un jugement, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Même si
  rationale: 'Dans la série des tentatives de fuite vouées à l’échec, la construction a ici une valeur concessive naturelle en français : même ce cas extrême ne les soustraira pas au jugement.'
- source_word: יֵלְכוּ בַשְּׁבִי
  choice: ils partent en captivité
  rationale: Le verbe הלך garde son sens de mouvement, tandis que שבי indique l’état de captivité. Cette formulation évite d’introduire un passif absent du texte.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: devant leurs ennemis
  rationale: Rend directement l’expression hébraïque et évoque leur départ captif sous le regard et au pouvoir de leurs ennemis.
- source_word: מִשָּׁם
  choice: de là
  rationale: 'Préserve l’insistance spatiale : même le lieu de captivité ne les met pas hors d’atteinte.'
- source_word: אֲצַוֶּה אֶת־הַחֶרֶב וַהֲרָגָתַם
  choice: je commanderai à l’épée de les tuer
  rationale: Conserve la personnification de l’épée comme exécutante d’un ordre divin, tout en employant une syntaxe française naturelle.
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Je poserai les yeux sur eux
  rationale: Préserve l’image hébraïque d’une attention divine délibérément dirigée vers eux.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: pour leur malheur, et non pour leur bonheur
  rationale: Le contraste français malheur/bonheur rend la polarité רעה/טובה sans laisser entendre que Dieu agirait avec une perversité morale.
theological_decisions:
- issue: Sens de רָעָה appliqué à l’action divine
  choice: pour leur malheur
  alternative: pour leur mal et non pour leur bien ; pour leur désastre et non pour leur bien
  rationale: Dans ce contexte de jugement, רָעָה désigne le tort subi, la calamité ou le malheur, non le mal moral. La traduction préserve le caractère redoutable du jugement sans résoudre le texte par une qualification doctrinale ajoutée.
translation_notes:
  register: Français international moderne, sobre et solennel. La personnification de l’épée et l’image des yeux de Dieu sont conservées. Le marqueur [a] est placé après la proposition qu’il éclaire.
