id: AMO.9.1
reference: Amos 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָאִ֨יתִי אֶת אֲדֹנָ֜/י נִצָּ֣ב עַֽל הַ/מִּזְבֵּ֗חַ וַ/יֹּאמֶר֩ הַ֨ךְ הַ/כַּפְתּ֜וֹר וְ/יִרְעֲשׁ֣וּ הַ/סִּפִּ֗ים וּ/בְצַ֨עַ/ם֙ בְּ/רֹ֣אשׁ כֻּלָּ֔/ם וְ/אַחֲרִיתָ֖/ם בַּ/חֶ֣רֶב אֶהֱרֹ֑ג לֹֽא יָנ֤וּס לָ/הֶם֙ נָ֔ס וְ/לֹֽא יִמָּלֵ֥ט לָ/הֶ֖ם פָּלִֽיט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/001.yaml
  text: 'I saw the Lord standing beside the altar[a], and he said: Strike the capital, so that the thresholds may shake; shatter them on the heads of all of them. And I will kill their survivors with the sword; not one who flees among them will get away[d][c][b], and not one who escapes among them will be delivered.'
translation:
  language: fr
  text: 'J’ai vu le Seigneur debout sur l’autel[a], et il a dit : « Frappe le chapiteau[b], pour que les seuils tremblent ; brise-les sur la tête de tous[c]. Je tuerai par l’épée ceux qui survivront[d]. Pas un fuyard parmi eux ne réussira à fuir, pas un rescapé parmi eux n’échappera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de l’autel ». La préposition hébraïque signifie d’abord « sur », mais la scène peut aussi présenter le Seigneur debout près de l’autel, prêt à juger.
    reason: lexical_alternative
  - marker: b
    text: Ou « la partie supérieure de la colonne ». Le terme hébreu désigne un élément architectural placé au sommet.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu est difficile : littéralement, « brise-les sur la tête de tous ». L’image semble être celle de l’édifice brisé qui s’effondre sur toutes les personnes présentes.'
    reason: lexical_alternative
  - marker: d
    text: Ou « leur reste ». Ici, le contexte désigne probablement ceux qui ont survécu à la destruction initiale, et non un reste promis au salut.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rend le titre divin אֲדֹנָי de manière naturelle et traditionnelle, sans le confondre avec le nom divin YHWH.
- source_word: נִצָּב עַל הַמִּזְבֵּחַ
  choice: debout près de l’autel
  rationale: Le participe exprime une position ferme, tandis que עַל peut désigner ici la proximité de l’autel. La note conserve l’autre lecture possible, « sur l’autel ».
- source_word: הַךְ
  choice: Frappe
  rationale: Impératif direct et énergique, adapté à l’oracle de jugement sans employer un registre archaïque.
- source_word: הַכַּפְתּוֹר
  choice: le chapiteau
  rationale: Le terme désigne vraisemblablement l’élément architectural supérieur d’une colonne ou de l’édifice.
- source_word: הַסִּפִּים
  choice: les seuils
  rationale: Traduction courante du nom dans ce contexte architectural ; les montants ou les soubassements restent possibles.
- source_word: וְיִרְעֲשׁוּ
  choice: pour que les seuils tremblent
  rationale: Le français exprime la nuance de but ou de résultat qui suit naturellement l’impératif.
- source_word: וּבְצַעַם
  choice: brise-les
  rationale: Le verbe est difficile ici ; le contexte décrit l’effondrement destructeur de l’édifice. Le pronom maintient l’ambiguïté de son référent.
- source_word: בְּרֹאשׁ כֻּלָּם
  choice: sur la tête de tous
  rationale: Conserve l’image concrète des éléments de l’édifice qui s’abattent sur toutes les personnes présentes.
- source_word: וְאַחֲרִיתָם
  choice: ceux qui survivront
  rationale: Dans ce contexte de destruction totale, le mot désigne ceux qui restent en vie après le premier désastre plutôt qu’un reste porteur d’espérance.
- source_word: בַּחֶרֶב אֶהֱרֹג
  choice: Je tuerai par l’épée
  rationale: Formulation directe et actuelle qui conserve la déclaration de jugement à la première personne.
- source_word: לֹא יָנוּס לָהֶם נָס
  choice: Pas un fuyard parmi eux ne réussira à fuir
  rationale: Conserve autant que possible la répétition emphatique de la racine hébraïque liée à la fuite, tout en restant intelligible en français.
- source_word: וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  choice: pas un rescapé parmi eux n’échappera
  rationale: Reproduit le parallélisme du membre précédent et l’exclusion absolue de toute délivrance.
theological_decisions:
- issue: Titre divin dans la vision prophétique
  choice: le Seigneur
  alternative: le Maître
  rationale: Le texte emploie אֲדֹנָי, titre de souveraineté divine, et non le tétragramme. « Le Seigneur » respecte cette distinction sans introduire une interprétation confessionnelle particulière.
- issue: Sens du « reste » dans l’oracle de jugement
  choice: ceux qui survivront
  alternative: leur reste
  rationale: Le contexte immédiat parle des personnes encore vivantes après l’effondrement et promises à l’épée. Cette formulation évite d’attribuer ici au terme la valeur théologique positive que « reste » peut avoir ailleurs.
translation_notes:
  register: Français international actuel, solennel mais accessible. La syntaxe brève et les impératifs conservent la violence du jugement. Les répétitions « fuyard… fuir » et « rescapé… échappera » reflètent le parallélisme emphatique de l’hébreu sans archaïsme.
