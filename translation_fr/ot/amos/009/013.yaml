  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/נִגַּ֤שׁ חוֹרֵשׁ֙ בַּ/קֹּצֵ֔ר וְ/דֹרֵ֥ךְ עֲנָבִ֖ים בְּ/מֹשֵׁ֣ךְ הַ/זָּ֑רַע וְ/הִטִּ֤יפוּ הֶֽ/הָרִים֙ עָסִ֔יס וְ/כָל הַ/גְּבָע֖וֹת תִּתְמוֹגַֽגְנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/013.yaml
  text: Behold[a], days are coming, declares Yahweh, when the plowman will overtake the reaper, and the one who treads grapes the one who sows the seed; the mountains will drip sweet wine[c][b], and all the hills will melt.
translation:
  language: fr
  text: Voici que des jours viennent — déclaration de Yahweh — où le laboureur rattrapera le moissonneur, et celui qui foule les raisins, celui qui répand la semence[a]. Les montagnes ruisselleront de vin doux[b], et toutes les collines fondront[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui tire la semence ». L’expression désigne probablement celui qui sème.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vin nouveau ».'
    reason: lexical_alternative
  - marker: c
    text: L’image évoque une telle abondance que le travail d’une saison commence avant la fin de la précédente. Le verbe hébreu évoque littéralement le fait de fondre ou de se dissoudre.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Marque naturellement en français l'appel solennel à l'attention propre au discours prophétique.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Conserve de près la formule prophétique hébraïque tout en restant idiomatique et digne en français.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule solennelle נְאֻם et conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְנִגַּשׁ
  choice: rattrapera
  rationale: Dans cette image de récoltes surabondantes, le travail d'une saison rejoint celui de la précédente avant qu'il soit achevé.
- source_word: חוֹרֵשׁ / בַּקֹּצֵר
  choice: le laboureur / le moissonneur
  rationale: Termes agricoles concrets, concis et usuels, qui préservent le parallélisme.
- source_word: וְדֹרֵךְ עֲנָבִים
  choice: celui qui foule les raisins
  rationale: Préserve l'image concrète du foulage des raisins destiné à produire du vin.
- source_word: בְּמֹשֵׁךְ הַזָּרַע
  choice: celui qui répand la semence
  rationale: Le sens littéral implique celui qui tire ou étend la semence; en contexte, l'expression désigne vraisemblablement le semeur. Cette formulation française garde une trace de l'image sans devenir obscure.
- source_word: וְהִטִּיפוּ
  choice: ruisselleront
  rationale: Exprime de façon vive et naturelle l'écoulement abondant décrit par le verbe, plutôt qu'un simple goutte-à-goutte.
- source_word: עָסִיס
  choice: vin doux
  rationale: Désigne un vin frais ou doux; ce choix communique richesse et abondance sans réduire nécessairement le terme à du jus non fermenté.
- source_word: תִּתְמוֹגַגְנָה
  choice: fondront
  rationale: Conserve l'image poétique saisissante du verbe hébreu, qui évoque le fait de fondre ou de se dissoudre.
theological_decisions:
- issue: Imagerie de la restauration prophétique
  choice: Conserver l'image concrète et hyperbolique d'une abondance agricole.
  alternative: La présenter comme une prédiction agricole strictement littérale ou comme une bénédiction exclusivement spirituelle.
  rationale: Le texte hébreu emploie une poésie agricole de restauration sans préciser ici la nature exacte ni le cadre de son accomplissement; la traduction ne doit pas trancher ce débat.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le rythme prophétique est maintenu par « Voici que » et l'incise « déclaration de Yahweh ». Les images agricoles et la métaphore finale sont préservées plutôt qu'explicitées dans le corps du verset.
