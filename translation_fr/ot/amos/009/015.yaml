id: AMO.9.15
reference: Amos 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/נְטַעְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹ֨א יִנָּתְשׁ֜וּ ע֗וֹד מֵ/עַ֤ל אַדְמָתָ/ם֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם אָמַ֖ר יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/015.yaml
  text: I will plant them on their land[a], and they will never again be uprooted from the land that I have given them, says Yahweh your God.
translation:
  language: fr
  text: Je les planterai sur leur terre, et jamais plus ils ne seront arrachés de la terre que je leur ai donnée, déclare Yahweh, ton Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « ton Dieu » au singulier. Cela peut être compris comme une adresse à Israël considéré comme un peuple ; « leur Dieu » serait une formulation harmonisée avec les pronoms pluriels du verset.
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְטַעְתִּים
  choice: Je les planterai
  rationale: Le verbe נטע signifie concrètement « planter ». Cette traduction conserve la métaphore agricole, reprise ensuite par « arrachés », et exprime la stabilité promise sans l’aplatir en « installer ».
- source_word: עַל אַדְמָתָם
  choice: sur leur terre
  rationale: אדמה peut désigner le sol, la terre ou le territoire. « Leur terre » convient au contexte de restauration tout en conservant le suffixe possessif pluriel.
- source_word: וְלֹא יִנָּתְשׁוּ עוֹד
  choice: et jamais plus ils ne seront arrachés
  rationale: Le nifal de נתש exprime l’action d’être arraché ou déraciné. « Arrachés » maintient le lien avec l’image de la plantation et évoque aussi clairement l’expulsion du pays.
- source_word: מֵעַל אַדְמָתָם
  choice: de la terre
  rationale: מֵעַל signifie littéralement « de dessus ». En français idiomatique, « de la terre » restitue le mouvement d’éloignement sans lourdeur, tandis que la répétition de « terre » préserve le motif du texte.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: que je leur ai donnée
  rationale: Le passé composé rend naturellement l’accompli hébreu et souligne que le don effectué demeure pertinent dans la promesse.
- source_word: אָמַר יְהוָה
  choice: déclare Yahweh
  rationale: Dans cette formule prophétique, le présent français « déclare » transmet la force actuelle de l’affirmation divine. Le nom propre יהוה est translittéré « Yahweh ».
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le texte massorétique porte un suffixe masculin singulier, « ton Dieu », malgré les pronoms pluriels du reste du verset. La traduction conserve ce changement de nombre au lieu de l’harmoniser.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom divin. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Changement de nombre dans אֱלֹהֶיךָ
  choice: ton Dieu
  alternative: leur Dieu
  rationale: L’hébreu reçu est au singulier et peut s’adresser à Israël envisagé collectivement. « Leur Dieu » harmoniserait la syntaxe avec les pronoms pluriels, mais effacerait une tension réelle du texte ; cette possibilité est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore cohérente « planter/arrachés » est préservée. L’ordre « jamais plus » donne une tournure naturelle et solennelle à la négation hébraïque. Le tutoiement singulier de « ton Dieu » reproduit délibérément la forme du texte source.
