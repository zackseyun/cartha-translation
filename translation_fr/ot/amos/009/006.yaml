source:
  edition: WLC
  text: הַ/בּוֹנֶ֤ה בַ/שָּׁמַ֨יִם֙ מעלות/ו וַ/אֲגֻדָּת֖/וֹ עַל אֶ֣רֶץ יְסָדָ֑/הּ הַ/קֹּרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/006.yaml
  text: He who builds his upper chambers in the heavens[a], and has founded his vault upon the earth[b], who calls for the waters of the sea and pours them out upon the face of the earth—Yahweh is his name.
translation:
  language: fr
  text: Lui qui bâtit dans le ciel ses chambres hautes[a] et qui a fondé sa voûte sur la terre[b], lui qui appelle les eaux de la mer et les déverse sur la surface de la terre — Yahweh est son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses montées » ou « ses degrés ». Le terme hébreu peut désigner des hauteurs, des escaliers ou des pièces situées à l’étage ; il évoque ici les structures élevées du ciel.
    reason: lexical_alternative
  - marker: b
    text: Ou « son assemblage », « sa structure » ou « son faisceau ». Le mot hébreu désigne ce qui est lié ou réuni ; il est employé ici dans une image d’architecture cosmique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנֶה
  choice: Lui qui bâtit
  rationale: Le participe qal avec article désigne Dieu par une action qui le caractérise. La tournure française « Lui qui bâtit » conserve la solennité et prépare la proclamation finale.
- source_word: מַעֲלוֹתָיו
  choice: ses chambres hautes
  rationale: Le nom peut évoquer des montées, des marches ou des pièces situées en hauteur. Dans cette image cosmique et architecturale, « chambres hautes » est naturel tout en laissant percevoir leur élévation céleste.
- source_word: וַאֲגֻדָּתוֹ
  choice: sa voûte
  rationale: Le terme désigne fondamentalement ce qui est lié ou assemblé. Dans ce contexte cosmologique, « voûte » rend l'idée d'une structure cohérente établie sur la terre, sans la transformer en description scientifique moderne.
- source_word: יְסָדָהּ
  choice: a fondé
  rationale: Le verbe יסד signifie poser les fondations ou établir. Le passé composé exprime ici l'acte fondateur accompli, tandis que le pronom féminin renvoie à la structure évoquée.
- source_word: הַקֹּרֵא לְמֵי הַיָּם
  choice: lui qui appelle les eaux de la mer
  rationale: Le second participe reprend la description de Yahweh. « Appelle » reste proche du texte et exprime son autorité souveraine sur les eaux, sans préciser au-delà de l'hébreu s'il les convoque ou les fait venir.
- source_word: וַיִּשְׁפְּכֵם
  choice: et les déverse
  rationale: שפך signifie verser ou répandre. « Déverse » restitue la force et l'ampleur de l'image, avec pour antécédent explicite les eaux de la mer.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: sur la surface de la terre
  rationale: Cette formulation rend naturellement l'idiome hébreu « sur la face de la terre » en français moderne, tout en conservant l'idée d'une étendue couverte.
- source_word: יְהוָה שְׁמוֹ
  choice: Yahweh est son nom
  rationale: Le nom divin est translittéré et la proposition nominale finale est conservée comme proclamation culminante de l'identité du Créateur.
theological_decisions:
- issue: Imagerie cosmologique de מַעֲלוֹתָיו et אֲגֻדָּתוֹ
  choice: Conserver une imagerie architecturale avec « chambres hautes » et « voûte ».
  alternative: Traduire plus littéralement par « ses montées » et « son faisceau / assemblage », ou plus explicitement par « palais céleste » et « dôme ».
  rationale: Le verset célèbre Yahweh comme bâtisseur et souverain du monde au moyen d'images anciennes. La traduction maintient ces images sans les réduire à une cosmologie scientifique précise ni effacer l'ambiguïté lexicale, signalée en notes.
- issue: Sens des eaux déversées sur la terre
  choice: Ne pas préciser s'il s'agit de pluie, de déluge ou d'eaux de jugement.
  alternative: Expliciter l'image comme une référence à la pluie ou au jugement divin.
  rationale: Le texte décrit l'autorité divine sur les eaux marines et leur déversement, mais n'identifie pas explicitement le phénomène. La formulation préserve cette tension contextuelle.
- issue: Nom divin יהוה
  choice: Yahweh
  alternative: « le Seigneur » ou « Jéhovah »
  rationale: 'Le texte porte le nom propre divin. Sa translittération préserve la fonction de la déclaration finale : « Yahweh est son nom ».'
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « Lui qui… lui qui… » conserve le mouvement doxologique du texte. « Surface de la terre » rend l’idiome hébreu plus naturellement que « face de la terre », tandis que les notes maintiennent les ambiguïtés des deux termes cosmologiques rares.
