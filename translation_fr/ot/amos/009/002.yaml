source:
  edition: WLC
  text: אִם יַחְתְּר֣וּ בִ/שְׁא֔וֹל מִ/שָּׁ֖ם יָדִ֣/י תִקָּחֵ֑/ם וְ/אִֽם יַעֲלוּ֙ הַ/שָּׁמַ֔יִם מִ/שָּׁ֖ם אוֹרִידֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/002.yaml
  text: Though they dig into Sheol[a], from there my hand will take them; and though they climb up to the heavens, from there I will bring them down.
translation:
  language: fr
  text: Même s’ils creusent jusque dans le Shéol[a], de là ma main les saisira ; même s’ils montent jusqu’aux cieux, de là je les ferai descendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles de « Shéol » : « la tombe » ou « le séjour des morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתְּרוּ
  choice: creusent
  rationale: Le verbe חתר évoque l’action de creuser ou de se frayer un passage en creusant. « Creusent jusqu’au » conserve l’image concrète d’une fuite vers le monde souterrain et reste naturel en français.
- source_word: בִשְׁאוֹל
  choice: jusqu’au Shéol
  rationale: « Shéol » préserve le concept hébreu du séjour des morts sans le réduire à la tombe ni lui imposer une conception doctrinale ultérieure. Avec « creuser », « jusqu’au » exprime naturellement le mouvement vers cette profondeur.
- source_word: יָדִי
  choice: ma main
  rationale: Le calque de l’image anthropomorphique conserve la représentation concrète de la portée et de la puissance divines.
- source_word: תִּקָּחֵם
  choice: les saisira
  rationale: לקח peut signifier prendre ou saisir. Ici, « saisir » rend clairement l’idée d’appréhension inévitable tout en s’accordant naturellement avec « ma main ».
- source_word: יַעֲלוּ
  choice: montent
  rationale: « Monter » rend directement le mouvement ascendant sans ajouter l’idée d’une escalade matérielle que le verbe hébreu n’impose pas.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Le pluriel français traditionnel et toujours intelligible correspond au pluriel hébreu et maintient le contraste cosmique avec le Shéol.
- source_word: אוֹרִידֵם
  choice: je les ferai descendre
  rationale: La tournure causative rend précisément le hifil de ירד, sans renforcer indûment la violence par « précipiter ».
- source_word: אִם ... וְאִם
  choice: Même si… même si
  rationale: 'Dans ce contexte, les propositions ont une valeur concessive : aucune tentative de fuite, vers le bas ou vers le haut, ne peut réussir.'
theological_decisions:
- issue: Rendu de שְׁאוֹל
  choice: Shéol
  alternative: la tombe ; le séjour des morts
  rationale: Le verset oppose les extrêmes cosmiques du Shéol et des cieux pour exprimer l’impossibilité d’échapper au jugement de Dieu. La translittération conserve l’ampleur et l’ambiguïté du terme hébreu ; une note fournit des équivalents explicatifs sans en imposer un dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et l’image de la main divine sont conservées ; le point-virgule met en relief les deux extrêmes cosmiques.
