source:
  edition: WLC
  text: לְמַ֨עַן יִֽירְשׁ֜וּ אֶת שְׁאֵרִ֤ית אֱדוֹם֙ וְ/כָל הַ/גּוֹיִ֔ם אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עֲלֵי/הֶ֑ם נְאֻם יְהוָ֖ה עֹ֥שֶׂה זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/012.yaml
  text: so that they may possess the remnant of Edom and all the nations who are called by my name,” declares Yahweh[b][a], who does this.
translation:
  language: fr
  text: afin qu’ils prennent possession du reste d’Édom et de toutes les nations qui portent mon nom[a] — déclaration de Yahweh, qui accomplit cela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur lesquelles mon nom est appelé ». Cette expression hébraïque indique que ces nations appartiennent à Yahweh ou qu’il les revendique comme siennes.'
    reason: lexical_alternative
  - marker: b
    text: 'La forme grecque de ce verset, citée en Actes 15.17, diffère sensiblement : elle se lit approximativement « afin que le reste des humains cherche le Seigneur, ainsi que toutes les nations sur lesquelles mon nom a été invoqué ».'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Exprime naturellement en français le but ou le résultat de la restauration annoncée dans le contexte précédent.
- source_word: יִירְשׁוּ
  choice: ils prennent possession de
  rationale: Le verbe ירשׁ peut désigner l’action de posséder, d’hériter ou de prendre possession. Cette formulation convient à des peuples comme objets et conserve la nuance territoriale et historique.
- source_word: שְׁאֵרִית אֱדוֹם
  choice: le reste d’Édom
  rationale: « Reste » conserve le vocabulaire prophétique de ce qui subsiste après le jugement, tandis qu’« Édom » est la forme française usuelle du nom propre.
- source_word: וְכָל הַגּוֹיִם
  choice: et de toutes les nations
  rationale: גּוֹיִם désigne ici les peuples autres qu’Israël. « Nations » est large, naturel et moins chargé d’une tradition particulière que « païens ».
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: sur lesquelles mon nom a été invoqué
  rationale: Rend assez directement l’expression passive hébraïque et son idée d’appartenance ou de revendication par Yahweh, sans la réduire au simple fait de porter un nom.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Restitue la formule prophétique comme une parole solennelle attribuée à Yahweh, tout en conservant le nom divin.
- source_word: עֹשֶׂה זֹּאת
  choice: qui accomplit cela
  rationale: Le participe présente Yahweh comme l’auteur effectif de l’action promise. « Accomplit » convient mieux qu’un plat « fait » à une œuvre annoncée.
theological_decisions:
- issue: Rapport d’Israël à Édom et aux nations dans l’oracle de restauration
  choice: Conserver l’idée que les bénéficiaires de la restauration prendront possession du reste d’Édom et des nations concernées.
  alternative: 'Traduire d’après la forme grecque attestée en Actes 15.17 : le reste des humains chercherait le Seigneur.'
  rationale: Le texte massorétique fourni parle explicitement de prendre possession du reste d’Édom et des nations. La traduction principale suit donc l’hébreu sans l’harmoniser avec la tradition grecque, dont la différence importante est signalée en note.
- issue: Sens de l’invocation du nom divin sur les nations
  choice: Employer « sur lesquelles mon nom a été invoqué » et expliquer l’idée d’appartenance en note.
  alternative: Employer directement « qui portent mon nom » ou « qui m’appartiennent ».
  rationale: La formulation retenue préserve l’image et le passif de l’hébreu, tandis que la note explicite l’idiome sans imposer une seule paraphrase interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu tout en évitant les tournures archaïques. Le nom divin est rendu par « Yahweh » conformément à la donnée de consultation, et les variantes textuelles ne sont pas incorporées silencieusement au corps du verset.
