  text: כִּֽי הִנֵּ֤ה אָֽנֹכִי֙ מְצַוֶּ֔ה וַ/הֲנִע֥וֹתִי בְ/כָֽל הַ/גּוֹיִ֖ם אֶת בֵּ֣ית יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֤ר יִנּ֨וֹעַ֙ בַּ/כְּבָרָ֔ה וְ/לֹֽא יִפּ֥וֹל צְר֖וֹר אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/009.yaml
  text: For look, I am commanding, and I will shake the house of Israel among all the nations, as one shakes with a sieve, yet not a pebble will fall to the ground.
translation:
  language: fr
  text: 'Car voici que je donne l’ordre : je secouerai la maison d’Israël parmi toutes les nations, comme on secoue le grain dans un crible, sans qu’un seul caillou tombe à terre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: Conserve à la fois le lien explicatif de כִּי et la force présentative de הִנֵּה dans un français digne et naturel.
- source_word: מְצַוֶּה
  choice: je donne mes ordres
  rationale: Le participe présente Dieu en train d’ordonner l’action; cette tournure française reste ouverte quant aux agents chargés de l’exécuter.
- source_word: וַהֲנִעוֹתִי
  choice: je vais secouer
  rationale: Rend le mouvement vigoureux annoncé, tout en s’accordant naturellement avec l’ordre divin qui précède.
- source_word: בְכָל־הַגּוֹיִם
  choice: parmi toutes les nations
  rationale: Exprime la dispersion et le criblage d’Israël au sein des nations.
- source_word: כַּאֲשֶׁר יִנּוֹעַ בַּכְּבָרָה
  choice: comme on secoue dans un crible
  rationale: Préserve l’image du criblage sans ajouter un sujet absent de l’hébreu; בַּכְּבָרָה désigne l’instrument dans lequel s’effectue le mouvement.
- source_word: צְרוֹר
  choice: un seul caillou
  rationale: Dans l’image du crible, le mot désigne vraisemblablement un petit élément solide; « caillou » maintient cette image concrète, et « un seul » explicite la portée de la négation sans changer le sens.
theological_decisions:
- issue: Portée de l’image du crible et identité de ce qui ne tombe pas
  choice: sans qu’un seul caillou tombe à terre
  alternative: sans qu’un seul grain tombe à terre
  rationale: Le terme צְרוֹר signifie plus naturellement « caillou » ou « petit paquet » que « grain ». La traduction conserve donc l’image énigmatique et sa tension contextuelle, sans décider ici si elle évoque la préservation des fidèles ou la rétention des coupables en vue du jugement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation met en relief l’ordre divin et son exécution. Aucun ajout confessionnel; l’ambiguïté de l’image finale est préservée.
