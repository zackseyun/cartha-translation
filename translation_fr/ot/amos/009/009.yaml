review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : YHWH ordonne le mouvement, la maison d’Israël est secouée parmi toutes les nations, et aucun צְרוֹר ne tombe à terre. « Caillou » est une option défendable pour צְרוֹר et préserve l’ambiguïté interprétative de l’image. Le futur français rend correctement le futur consécutif וַהֲנִעוֹתִי.'
  naturalness: « Comme on secoue dans un crible » est elliptique en français au point de laisser le verbe sans complément clairement exprimé. L’hébreu emploie lui aussi une formulation imagée elliptique, mais le référent implicite est naturellement le grain dans l’opération de tamisage. L’expliciter rend la comparaison idiomatique sans trancher la portée théologique de l’image.
  terminology: « Crible » convient pour כְּבָרָה. « Caillou » pour צְרוֹר est plus proche de l’idée de petit caillou/objet compact que « grain » et évite d’interpréter ce qui est préservé ou retenu. « Je donne mes ordres » reste possible, mais « je donne l’ordre » est plus direct et moins susceptible de suggérer une pluralité absente du texte.
  issues:
  - severity: low
    issue: Complément implicite trop abrupt dans la comparaison
    rationale: La formule française « comme on secoue dans un crible » ne dit pas ce qui est secoué. « Comme on secoue le grain dans un crible » restitue de manière naturelle l’objet normalement sous-entendu par l’image, sans identifier ce grain à un groupe théologique précis.
  - severity: low
    issue: « mes ordres » introduit une pluralité non marquée
    rationale: Le participe מְצַוֶּה signifie « ordonnant / donnant l’ordre ». Le singulier français est plus resserré et plus proche de l’énoncé, tout en conservant l’agent d’exécution non précisé.
  revised_text: 'Car voici que je donne l’ordre : je secouerai la maison d’Israël parmi toutes les nations, comme on secoue le grain dans un crible, sans qu’un seul caillou tombe à terre.'
