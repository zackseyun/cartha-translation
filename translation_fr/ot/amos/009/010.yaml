  text: בַּ/חֶ֣רֶב יָמ֔וּתוּ כֹּ֖ל חַטָּאֵ֣י עַמִּ֑/י הָ/אֹמְרִ֗ים לֹֽא תַגִּ֧ישׁ וְ/תַקְדִּ֛ים בַּעֲדֵ֖י/נוּ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/010.yaml
  text: By the sword all the sinners of my people will die—those who say, ‘The disaster will not overtake us or come against us.’
translation:
  language: fr
  text: 'Tous les pécheurs de mon peuple mourront par l’épée, eux qui disent : « Le malheur ne s’approchera pas et ne viendra pas à notre rencontre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne nous devancera pas ». Le second verbe hébreu peut aussi évoquer l’idée de venir au-devant, de rencontrer ou d’atteindre.'
    reason: Préserve l’ambiguïté de וְתַקְדִּים בַּעֲדֵינוּ sans réduire le sens à celui de surprise.
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Exprime naturellement en français le moyen de la mort tout en conservant l’image concrète du texte hébreu.
- source_word: כֹּל חַטָּאֵי עַמִּי
  choice: tous les pécheurs de mon peuple
  rationale: Reproduit directement la portée de כֹּל et maintient la tension du jugement visant des pécheurs qui appartiennent au peuple du locuteur.
- source_word: הָרָעָה
  choice: le malheur
  rationale: Dans ce contexte prophétique, רָעָה désigne la calamité ou le désastre annoncé plutôt que le mal moral abstrait.
- source_word: לֹא תַגִּישׁ
  choice: ne s’approchera pas de nous
  rationale: Rend l’idée d’approcher ou de parvenir jusqu’aux locuteurs; « de nous » explicite en français le complément commun avec la proposition coordonnée.
- source_word: וְתַקְדִּים בַּעֲדֵינוּ
  choice: et ne nous prendra pas de court
  rationale: קד״ם à l’hiphil évoque ici le fait de venir au-devant, de devancer ou de surprendre. Cette formulation française est naturelle sans effacer la nuance d’anticipation.
theological_decisions:
- issue: Le jugement à l’intérieur du peuple de Dieu
  choice: « les pécheurs de mon peuple »
  alternative: « les pécheurs parmi mon peuple »
  rationale: Le possessif hébreu rattache directement ces pécheurs au peuple; la traduction conserve cette tension au lieu d’en faire implicitement un groupe extérieur.
- issue: Nature de הָרָעָה
  choice: « le malheur » comme calamité annoncée
  alternative: « le mal » au sens moral
  rationale: Les verbes d’approche et de venue, ainsi que le contexte de mort par l’épée, indiquent un événement de jugement.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme verbal hébreu tout en employant une expression idiomatique compréhensible aujourd’hui.
