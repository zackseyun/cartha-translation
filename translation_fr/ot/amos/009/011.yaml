source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא אָקִ֛ים אֶת סֻכַּ֥ת דָּוִ֖יד הַ/נֹּפֶ֑לֶת וְ/גָדַרְתִּ֣י אֶת פִּרְצֵי/הֶ֗ן וַ/הֲרִֽסֹתָי/ו֙ אָקִ֔ים וּ/בְנִיתִ֖י/הָ כִּ/ימֵ֥י עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/011.yaml
  text: In that day I will raise up the fallen shelter of David[a], and I will wall up its breaches[c][b], and I will raise up its ruins and rebuild it as in the days of old.
translation:
  language: fr
  text: En ce jour-là, je relèverai l’abri de David qui s’est effondré[a] ; je réparerai ses brèches[b], je relèverai ses ruines et je le rebâtirai comme aux jours d’autrefois[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la hutte de David qui tombe ». Traditionnellement : « le tabernacle de David ». L’image hébraïque est celle d’un abri temporaire ; elle évoque ici la maison ou la dynastie de David dans son état d’abaissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je murerai ses brèches » ; on peut aussi traduire : « je refermerai ses ouvertures ».'
    reason: lexical_alternative
  - marker: c
    text: « Aux jours d’autrefois » désigne les temps anciens, sans signifier nécessairement l’éternité au sens abstrait.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique courante, rendue dans un français naturel tout en conservant son registre solennel.
- source_word: אָקִים
  choice: je relèverai
  rationale: Le hifil de קום exprime l’action de faire tenir debout ou de relever. Ce choix préserve l’image concrète et sa répétition dans le verset.
- source_word: סֻכַּת דָּוִיד
  choice: l’abri de David
  rationale: סֻכָּה désigne une hutte, une cabane ou un abri temporaire. « Abri » conserve l’image de fragilité sans introduire les connotations cultuelles de « tabernacle » ni remplacer la métaphore par « dynastie ».
- source_word: הַנֹּפֶלֶת
  choice: qui s’est effondré
  rationale: Le participe signifie littéralement « qui tombe ». Dans ce contexte de restauration, le français accompli exprime naturellement l’état résultant de l’effondrement, sans réduire l’expression à une simple épithète.
- source_word: וְגָדַרְתִּי אֶת פִּרְצֵיהֶן
  choice: je réparerai ses brèches
  rationale: גדר signifie entourer d’un mur ou fermer. Avec « brèches », « réparer » est idiomatique en français et maintient clairement l’image architecturale, tandis que « murer » pourrait suggérer l’obturation d’ouvertures normales.
- source_word: וַהֲרִסֹתָיו
  choice: ses ruines
  rationale: הריסה désigne ce qui a été démoli ou ruiné. « Ruines » est concis et naturel ; la variation de genre du suffixe dans le texte consonantique ne modifie pas le référent global.
- source_word: וּבְנִיתִיהָ
  choice: je le rebâtirai
  rationale: Bien que בנה signifie simplement « bâtir », le contexte de destruction et de relèvement appelle naturellement « rebâtir ». Le pronom masculin reprend « l’abri » en français.
- source_word: כִּימֵי עוֹלָם
  choice: comme aux jours d’autrefois
  rationale: עוֹלָם renvoie ici au passé ancien ou lointain, et non nécessairement à l’éternité au sens abstrait.
theological_decisions:
- issue: Référent de « l’abri de David »
  choice: Conserver l’image concrète d’un abri effondré, qui évoque la maison ou la dynastie davidique abaissée.
  alternative: Traduire directement par « dynastie de David », ou comprendre un tabernacle cultuel littéral.
  rationale: Le texte associe explicitement David à une סֻכָּה fragile. Garder cette métaphore préserve sa force et laisse ouverte la portée précise de la restauration annoncée, sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « je relèverai » reproduit celle de אָקִים et structure la promesse. Le point-virgule articule les actes successifs de restauration sans alourdir la phrase.
