source:
  edition: WLC
  text: הִנֵּ֞ה עֵינֵ֣י אֲדֹנָ֣/י יְהוִ֗ה בַּ/מַּמְלָכָה֙ הַֽ/חַטָּאָ֔ה וְ/הִשְׁמַדְתִּ֣י אֹתָ֔/הּ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה אֶ֗פֶס כִּ֠י לֹ֣א הַשְׁמֵ֥יד אַשְׁמִ֛יד אֶת בֵּ֥ית יַעֲקֹ֖ב נְאֻם יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/008.yaml
  text: Look[a], the eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob," declares Yahweh.
translation:
  language: fr
  text: 'Voici : le Seigneur Yahweh a les yeux fixés sur le royaume pécheur. Je le détruirai de la surface de la terre. Cependant, je ne détruirai pas entièrement[a] la maison de Jacob, déclare Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce ici le verbe « détruire » au moyen d’un infinitif absolu : « je ne détruirai certainement pas complètement » ou « je ne détruirai pas totalement ».'
    reason: La note signale la construction emphatique hébraïque et l’ambiguïté de sa restitution naturelle sous la négation.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette particule déictique attire solennellement l’attention sur l’annonce qui suit. « Voici » reste actuel, digne et concis en français.
- source_word: עֵינֵי אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh a les yeux fixés sur
  rationale: La reformulation française conserve l’image des « yeux » tout en exprimant naturellement l’attention divine soutenue, ici orientée vers le jugement. אֲדֹנָי est rendu par « le Seigneur » et le nom divin יְהוָה par « Yahweh ».
- source_word: בַּמַּמְלָכָה הַחַטָּאָה
  choice: sur le royaume pécheur
  rationale: La préposition indique l’objet du regard divin. « Royaume pécheur » rend directement l’adjectif et maintient le caractère moral du jugement sans préciser indûment l’identité du royaume.
- source_word: וְהִשְׁמַדְתִּי אֹתָהּ
  choice: Je le détruirai
  rationale: Le hiphil de שׁמד exprime la destruction ou la suppression. « Détruire » en garde la force sans imposer une manière particulière.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface de la terre
  rationale: Cette formulation française rend naturellement l’idiome hébreu désignant la disparition complète d’un territoire ou du monde habité.
- source_word: אֶפֶס כִּי
  choice: Cependant
  rationale: L’expression introduit une forte restriction au jugement annoncé et marque clairement le contraste entre la destruction du royaume et la préservation de la maison de Jacob.
- source_word: לֹא הַשְׁמֵיד אַשְׁמִיד
  choice: je ne détruirai pas entièrement
  rationale: L’infinitif absolu associé au verbe conjugué intensifie l’idée verbale. Sous la négation, la formulation nie une destruction totale sans nier le jugement lui-même.
- source_word: אֶת בֵּית יַעֲקֹב
  choice: la maison de Jacob
  rationale: Cette expression traditionnelle désigne collectivement les descendants de Jacob et préserve ses résonances nationales et intertextuelles.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule prophétique est rendue de manière claire et actuelle, tandis que le nom divin est conservé sous la forme « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה et נְאֻם יְהוָה
  choice: « le Seigneur Yahweh » dans le titre composé et « Yahweh » dans la formule finale
  alternative: « le Seigneur DIEU » puis « le SEIGNEUR », ou « le Souverain Seigneur »
  rationale: Le texte hébreu emploie explicitement le nom divin יְהוָה. Le conserver sous la forme « Yahweh » distingue le nom propre du titre אֲדֹנָי et évite le redoublement peu naturel « Seigneur SEIGNEUR ».
- issue: Rapport entre la destruction du royaume pécheur et le sort de la maison de Jacob
  choice: Affirmer la destruction du royaume tout en niant la destruction totale de la maison de Jacob
  alternative: Atténuer le premier jugement ou comprendre la seconde proposition comme une simple réduction de sa sévérité
  rationale: L’hébreu juxtapose délibérément un jugement radical et une limite explicite à l’anéantissement. La traduction conserve cette tension sans identifier simplement le royaume à la totalité de Jacob ni effacer la promesse de préservation.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe « a les yeux fixés sur » rend l’image hébraïque de façon idiomatique sans en perdre la force. Le contraste entre jugement et préservation est marqué par « Cependant ». Le terme traditionnel « maison de Jacob » est conservé pour sa portée collective et intertextuelle.
