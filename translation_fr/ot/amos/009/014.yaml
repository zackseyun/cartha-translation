  to: 'Je restaurerai le sort de mon peuple Israël[a] : ils rebâtiront les villes dévastées et y habiteront ; ils planteront des vignes et en boiront le vin ; ils aménageront des jardins et en mangeront les fruits.'
  rationale: La révision remplace une expression générale et administrative par « restaurerai le sort », qui est à la fois naturelle dans ce registre et suffisamment ouverte pour rendre l’ambiguïté reconnue de la formule hébraïque. La note distingue plus nettement une interprétation de retour des captifs d’un rendu littéral traditionnellement ambigu. La ponctuation par deux-points maintient le lien étroit entre l’action divine annoncée et les effets de restauration qui suivent.
