  text: וְ/שַׁבְתִּי֮ אֶת שְׁב֣וּת עַמִּ֣/י יִשְׂרָאֵל֒ וּ/בָנ֞וּ עָרִ֤ים נְשַׁמּוֹת֙ וְ/יָשָׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/שָׁת֖וּ אֶת יֵינָ֑/ם וְ/עָשׂ֣וּ גַנּ֔וֹת וְ/אָכְל֖וּ אֶת פְּרִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/014.yaml
  text: I will restore the fortunes of my people Israel[a], and they will rebuild ruined cities and inhabit them; they will plant vineyards and drink their wine; they will make gardens and eat their fruit.
translation:
  language: fr
  text: 'Je restaurerai le sort de mon peuple Israël[a] : ils rebâtiront les villes dévastées et y habiteront ; ils planteront des vignes et en boiront le vin ; ils aménageront des jardins et en mangeront les fruits.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ferai revenir les captifs de mon peuple Israël » ; littéralement, « Je restaurerai la captivité de mon peuple Israël ». La formule hébraïque peut désigner le retour de captivité ou, plus largement, le renversement d’une situation de détresse.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: Je rétablirai la situation
  rationale: La formule hébraïque exprime le renversement d'une situation de détresse et peut aussi évoquer le retour de captifs. « Rétablirai la situation » rend naturellement en français la portée générale de la restauration sans exclure l'arrière-plan de l'exil.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: mon peuple Israël
  rationale: Conserve directement la désignation d'alliance et l'apposition du texte hébreu.
- source_word: וּבָנוּ עָרִים נְשַׁמּוֹת
  choice: Ils rebâtiront les villes dévastées
  rationale: Le verbe signifie littéralement « bâtir », mais la dévastation préalable implique ici une reconstruction. « Dévastées » exprime clairement l'état de désolation.
- source_word: וְיָשָׁבוּ
  choice: y habiteront
  rationale: Le verbe ישׁב signifie ici demeurer ou habiter ; le pronom adverbial « y » renvoie naturellement aux villes.
- source_word: וְנָטְעוּ כְרָמִים
  choice: ils planteront des vignes
  rationale: « Vignes » est l'équivalent français courant de כְרָמִים dans cette image agricole.
- source_word: וְשָׁתוּ אֶת יֵינָם
  choice: en boiront le vin
  rationale: Le suffixe renvoie aux vignes ; la tournure française avec « en » exprime naturellement qu'ils boiront le vin qui en provient.
- source_word: וְעָשׂוּ גַנּוֹת
  choice: ils aménageront des jardins
  rationale: עשה signifie littéralement « faire ». Avec des jardins, « aménager » est une formulation française naturelle qui conserve l'idée de leur établissement par le travail.
- source_word: וְאָכְלוּ אֶת פְּרִיהֶם
  choice: en mangeront les fruits
  rationale: Le suffixe renvoie aux jardins. « Fruits » traduit directement פְּרִי, tandis que « en » rend ce rapport sans ambiguïté en français.
theological_decisions:
- issue: Traduction de la formule de restauration שׁוּב שְׁבוּת
  choice: Je rétablirai la situation
  alternative: Je ramènerai les captifs / Je mettrai fin à la captivité
  rationale: La formule peut désigner à la fois un retour de captivité et, plus largement, un renversement de la détresse. Le contexte immédiat développe une restauration globale des villes, de l'habitat et de l'agriculture. Le texte principal garde cette portée large, et la note préserve les lectures plus étroitement liées à la captivité.
translation_notes:
  register: Français international moderne, digne et accessible. Les propositions parallèles et le rythme agricole du texte hébreu sont conservés. Le point après la première phrase allège une longue coordination sans modifier la logique du verset.
