source:
  edition: WLC
  text: הַ/שֹּׁתִ֤ים בְּ/מִזְרְקֵי֙ יַ֔יִן וְ/רֵאשִׁ֥ית שְׁמָנִ֖ים יִמְשָׁ֑חוּ וְ/לֹ֥א נֶחְל֖וּ עַל שֵׁ֥בֶר יוֹסֵֽף־
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/006.yaml
  text: who drink wine from bowls and anoint themselves with the finest oils[b][a], but are not grieved over the ruin of Joseph—
translation:
  language: fr
  text: ceux qui boivent du vin dans des coupes et s’enduisent d’huiles de premier choix[a], mais ne s’affligent pas de la ruine de Joseph[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des huiles les plus raffinées »; littéralement « les premières des huiles ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « Joseph » désigne poétiquement le peuple d’Israël, en particulier le royaume du Nord.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׁתִים
  choice: eux qui boivent
  rationale: Le participe avec article poursuit la description commencée dans le contexte précédent. La tournure « eux qui » conserve ce lien tout en restant naturelle en français.
- source_word: בְּמִזְרְקֵי יַיִן
  choice: le vin dans des coupes
  rationale: מִזְרָק désigne une coupe ou un bassin, souvent de grande taille. « Dans des coupes » préserve l’image concrète et la démesure du banquet sans ajouter « à pleines coupes », absent de l’hébreu.
- source_word: וְרֵאשִׁית שְׁמָנִים
  choice: des huiles les plus raffinées
  rationale: רֵאשִׁית signifie littéralement « commencement, première part » et, ici, la qualité supérieure ou le meilleur choix. « Les plus raffinées » exprime naturellement le luxe recherché.
- source_word: יִמְשָׁחוּ
  choice: s’enduisent
  rationale: Le verbe משׁח signifie « oindre ». Dans ce contexte de luxe personnel plutôt que de consécration rituelle, « s’enduisent » rend clairement l’application d’huile sur soi sans suggérer à tort un rite religieux.
- source_word: וְלֹא נֶחְלוּ
  choice: mais ne s’affligent pas
  rationale: Le niphal de חלה peut évoquer le fait de devenir faible ou malade et, par extension, d’être profondément peiné. « Ne s’affligent pas » rend ici la portée morale et émotionnelle sans imposer une maladie physique.
- source_word: עַל שֵׁבֶר יוֹסֵף
  choice: de la ruine de Joseph
  rationale: שֵׁבֶר désigne une fracture, un effondrement ou un désastre. « Ruine » est idiomatique en français et conserve la force de l’image prophétique.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Le nom propre est maintenu plutôt que remplacé par « Israël », afin de préserver la désignation poétique et ses résonances tribales; une note en précise le référent.
theological_decisions:
- issue: Emploi métonymique de « Joseph »
  choice: Conserver « Joseph » dans le texte comme désignation poétique du peuple d’Israël, particulièrement du royaume du Nord.
  alternative: Traduire explicitement par « Israël » ou « la maison de Joseph ».
  rationale: Le maintien du nom respecte l’image prophétique et évite de résoudre dans le corps du texte une référence qui demeure poétique. La note fournit l’explication nécessaire.
translation_notes:
  register: Français moderne, international et digne. La phrase garde la continuité syntaxique avec les versets précédents. « S’enduisent » évite la connotation principalement cultuelle que pourrait avoir « s’oignent » pour certains lecteurs, tandis que les notes préservent le sens littéral et la métonymie.
