  terminology: « Coupes » est acceptable pour מִזְרָק dans ce contexte, même si le terme peut désigner une coupe ou un bassin. « Huiles de premier choix » exprime bien la valeur superlative de רֵאשִׁית; « ruine » convient à שֵׁבֶר. Aucun enjeu doctrinal ne requiert d’interprétation supplémentaire.
