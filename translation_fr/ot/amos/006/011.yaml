source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ מְצַוֶּ֔ה וְ/הִכָּ֛ה הַ/בַּ֥יִת הַ/גָּד֖וֹל רְסִיסִ֑ים וְ/הַ/בַּ֥יִת הַ/קָּטֹ֖ן בְּקִעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/011.yaml
  text: For behold[a], Yahweh commands, and the great house will be struck into fragments, and the small house into pieces.
translation:
  language: fr
  text: 'Car voici que Yahweh donne l’ordre : la grande maison sera frappée[a] et réduite en éclats, et la petite maison, brisée en morceaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il frappera la grande maison en éclats, et la petite maison en fissures [ou : en morceaux] ». L’agent du verbe n’est pas explicitement nommé.'
    reason: Préciser la forme active de l’hébreu, l’ambiguïté de son agent et la nuance possible de בְּקִעִים.
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici que
  rationale: כִּי rattache le verset à ce qui précède en donnant le fondement de l’annonce, tandis que הִנֵּה attire vivement l’attention. « Car voici que » conserve ces deux fonctions dans un français biblique actuel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du tétragramme, qui conserve le nom divin présent dans le texte hébreu.
- source_word: מְצַוֶּה
  choice: donne l’ordre
  rationale: Le participe exprime ici l’action souveraine et imminente de commander. Cette tournure est plus naturelle en français que « commande » sans complément.
- source_word: הַבַּיִת הַגָּדוֹל
  choice: la grande maison
  rationale: Cette traduction maintient le nom « maison » et laisse à « grande » sa possible double portée, matérielle et sociale, sans imposer « palais ».
- source_word: רְסִיסִים
  choice: réduite en éclats
  rationale: Le terme désigne des fragments produits par une destruction violente. « Éclats » restitue cette image avec force et clarté.
- source_word: הַבַּיִת הַקָּטֹן
  choice: la petite maison
  rationale: La formulation conserve le parallélisme antithétique avec « la grande maison ».
- source_word: בְּקִעִים
  choice: brisée en morceaux
  rationale: Le mot peut évoquer des fissures, des brèches ou des parties fendues. Dans ce contexte de destruction, « brisée en morceaux » exprime naturellement le résultat tout en restant distinct de « éclats ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve la référence comme nom propre sans le remplacer par un titre.
- issue: Agent de וְהִכָּה
  choice: 'tournure passive : « sera frappée »'
  alternative: « il frappera », avec Yahweh ou un agent non exprimé comme référent possible
  rationale: La forme hébraïque est active à la troisième personne masculine du singulier, mais son agent immédiat n’est pas nommé. Le passif français met en avant le résultat du jugement sans trancher artificiellement l’identité de l’exécutant.
translation_notes:
  register: Français international moderne, sobre et prophétique. « Car voici que » garde l’élan solennel du texte sans archaïsme excessif; l’ellipse verbale dans le second membre renforce le parallélisme.
