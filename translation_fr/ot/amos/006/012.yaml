id: AMO.6.12
reference: Amos 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/יְרֻצ֤וּ/ן בַּ/סֶּ֨לַע֙ סוּסִ֔ים אִֽם יַחֲר֖וֹשׁ בַּ/בְּקָרִ֑ים כִּֽי הֲפַכְתֶּ֤ם לְ/רֹאשׁ֙ מִשְׁפָּ֔ט וּ/פְרִ֥י צְדָקָ֖ה לְ/לַעֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/012.yaml
  text: Do horses run on rock? Does one plow there with oxen? Yet you have turned justice into poison[c][b][a], and the fruit of righteousness into wormwood.
translation:
  language: fr
  text: Les chevaux courent-ils sur le roc ? Y laboure-t-on avec des bœufs ? Pourtant, vous avez changé le droit en poison[a], et le fruit de la justice en absinthe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en plante vénéneuse » ou « en fiel » : le mot hébreu désigne une substance ou une plante amère et toxique.'
    reason: lexical_alternative
  - marker: b
    text: L’absinthe est une plante très amère; elle évoque ici la corruption du bien et ses conséquences amères.
    reason: cultural_note
lexical_decisions:
- source_word: הַיְרֻצוּן
  choice: courent-ils
  rationale: L’interrogation avec l’imparfait exprime ici une question rhétorique à valeur générale; le présent français restitue naturellement cette portée proverbiale.
- source_word: בַּסֶּלַע
  choice: sur le roc
  rationale: סֶלַע désigne un rocher ou un escarpement; « sur le roc » conserve l’image d’un sol impropre à la course et au labour.
- source_word: אִם יַחֲרוֹשׁ בַּבְּקָרִים
  choice: Y laboure-t-on avec des bœufs ?
  rationale: אִם introduit la seconde question rhétorique plutôt qu’une condition. Le pronom « y » rend explicite, sans l’alourdir, le lieu repris de la première question; « bœufs » convient au contexte du labour.
- source_word: כִּי
  choice: Pourtant
  rationale: La particule relie l’absurdité des images à l’accusation. « Pourtant » fait ressortir en français le contraste implicite, sans imposer une relation causale étroite.
- source_word: הֲפַכְתֶּם
  choice: vous avez changé
  rationale: Le passé composé rend l’action accomplie dont les effets demeurent, dans une accusation directe adressée au pluriel.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte public et judiciaire, « le droit » désigne l’ordre juste et son exercice; il évite aussi de confondre מִשְׁפָּט avec צְדָקָה dans le membre parallèle.
- source_word: רֹאשׁ
  choice: poison
  rationale: רֹאשׁ peut désigner une substance ou une plante amère et toxique. « Poison » transmet clairement la force destructrice de la métaphore en français moderne.
- source_word: פְרִי צְדָקָה
  choice: le fruit de la justice
  rationale: צְדָקָה associe rectitude morale et justice sociale. Dans le contexte d’Amos, « justice » est idiomatique et maintient la métaphore concrète du fruit, tout en laissant « le droit » rendre le terme juridique parallèle מִשְׁפָּט.
- source_word: לַעֲנָה
  choice: absinthe
  rationale: לַעֲנָה est une plante réputée pour son amertume. « Absinthe » est le nom biblique français usuel de cette plante et préserve l’image concrète.
theological_decisions:
- issue: Relation entre מִשְׁפָּט et צְדָקָה
  choice: « le droit » puis « la justice »
  alternative: « la justice » puis « la droiture »
  rationale: Les deux termes se recouvrent partiellement. La formulation choisie conserve leur distinction sans réduire צְדָקָה à la seule moralité privée ni présenter les deux comme de parfaits synonymes.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux questions restent brèves et proverbiales. « Sur le roc » et « absinthe » préservent les images concrètes de l’hébreu; « droit » et « justice » rendent le parallélisme social et judiciaire sans effacer la proximité sémantique des deux notions.
