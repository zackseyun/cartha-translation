  yaml_path: translation/ot/amos/006/005.yaml
  text: who strum on the mouth of the harp, and like David invent for themselves instruments of song—
translation:
  language: fr
  text: 'vous qui jouez de la harpe

    et qui, comme David, inventez pour vous des instruments de musique —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֹּרְטִים עַל־פִּי הַנָּבֶל
  choice: vous qui improvisez au son de la harpe
  rationale: Le participe פרט désigne ici probablement le fait de produire ou d’égrener des sons; « au son de la harpe » rend naturellement l’expression littérale « sur la bouche de la harpe ». Dans ce contexte de luxe insouciant, « improvisez » conserve l’idée d’une pratique musicale désinvolte sans imposer le geste précis de « pincer ».
- source_word: כְּדָוִיד
  choice: comme David
  rationale: Correspondance directe qui conserve la comparaison explicite.
- source_word: חָשְׁבוּ לָהֶם
  choice: inventez pour vous-mêmes
  rationale: חשב peut signifier penser, concevoir ou inventer; le contexte musical favorise « inventer ». Le pronom réfléchi conserve לָהֶם et souligne leur activité tournée vers eux-mêmes.
- source_word: כְּלֵי שִׁיר
  choice: des instruments de musique
  rationale: Littéralement « instruments de chant »; en français courant, « instruments de musique » exprime clairement le sens sans suggérer qu’il s’agit d’instruments vocaux.
theological_decisions:
- issue: Nature exacte de l’activité attribuée à David
  choice: inventez pour vous-mêmes des instruments de musique
  alternative: composez pour vous-mêmes des chants accompagnés d’instruments
  rationale: La syntaxe rattache naturellement « inventer/concevoir » aux « instruments de musique ». La traduction conserve ainsi la comparaison ironique avec David sans préciser davantage ce que le texte ne précise pas.
translation_notes:
  register: Adresse directe au pluriel, en continuité avec la série de participes décrivant les notables de Samarie. Langue moderne et digne; le tiret final maintient l’élan syntaxique vers le verset suivant.
