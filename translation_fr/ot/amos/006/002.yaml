revisions:
- from: Passez à Kalné et regardez[a] ; de là, allez à Hamath la Grande ; puis descendez à Gath des Philistins. Sont-elles meilleures que ces royaumes ? Ou leur territoire est-il plus étendu que le vôtre ?
  to: Allez à Kalné[b] et voyez[a] ; de là, allez à Hamath la Grande ; puis descendez à Gath des Philistins. Sont-ils meilleurs que ces royaumes ? Ou leur territoire est-il plus étendu que le vôtre ?
  rationale: La révision corrige l’accord qui limitait l’ambiguïté de l’hébreu, améliore légèrement l’idiomaticité des impératifs et rétablit deux notes séparées avec des ancres explicites. Elle ne tranche pas l’identité de Kalné ni le sujet implicite de la question rhétorique.
