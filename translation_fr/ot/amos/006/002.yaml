  text: עִבְר֤וּ כַֽלְנֵה֙ וּ/רְא֔וּ וּ/לְכ֥וּ מִ/שָּׁ֖ם חֲמַ֣ת רַבָּ֑ה וּ/רְד֣וּ גַת פְּלִשְׁתּ֗ים הֲ/טוֹבִים֙ מִן הַ/מַּמְלָכ֣וֹת הָ/אֵ֔לֶּה אִם רַ֥ב גְּבוּלָ֖/ם מִ/גְּבֻלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/002.yaml
  text: Cross over to Calneh and see[a]; and from there go to Hamath the great; then go down to Gath of the Philistines[b]. Are they better than these kingdoms? Or is their territory greater than your territory?
translation:
  language: fr
  text: Allez à Kalné[b] et voyez[a] ; de là, allez à Hamath la Grande ; puis descendez à Gath des Philistins. Sont-ils meilleurs que ces royaumes ? Ou leur territoire est-il plus étendu que le vôtre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Êtes-vous meilleurs que ces royaumes ? » En hébreu, l’adjectif traduit par « meilleurs » n’a pas de sujet explicite : il peut se rapporter soit aux villes ou royaumes nommés, soit aux personnes auxquelles le prophète s’adresse.'
    reason: alternative_reading
  - marker: b
    text: Kalné est un nom de lieu ; certains l’identifient à une ville du nord de la Syrie ou de Mésopotamie, mais cette identification reste incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: Passez à
  rationale: L’impératif pluriel de עבר exprime ici un déplacement vers Kalné. « Passez à » reste proche du verbe hébreu tout en étant naturel en français dans cette série d’ordres.
- source_word: כַּלְנֵה
  choice: Kalné
  rationale: Nom propre translittéré selon une forme française claire ; l’identification exacte du lieu demeure incertaine.
- source_word: וּרְאוּ
  choice: et regardez
  rationale: L’impératif de ראה invite les destinataires à observer la ville ; « regardez » rend naturellement cette invitation à l’examen.
- source_word: וּלְכוּ מִשָּׁם
  choice: de là, allez
  rationale: La formulation conserve le mouvement séquentiel et l’indication de provenance, sans alourdir le français par une coordination supplémentaire.
- source_word: חֲמַת רַבָּה
  choice: Hamath la Grande
  rationale: רַבָּה signifie « grande » et qualifie Hamath ; cette tournure respecte le sens et convient à un nom de ville en français.
- source_word: וּרְדוּ
  choice: puis descendez
  rationale: L’impératif de ירד désigne une descente géographique ; « puis » rend clairement la progression du parcours.
- source_word: גַּת פְּלִשְׁתִּים
  choice: Gath des Philistins
  rationale: Le groupe construit rattache Gath aux Philistins ; la formulation française est à la fois concise et proche de l’hébreu.
- source_word: הֲטוֹבִים מִן הַמַּמְלָכוֹת הָאֵלֶּה
  choice: Sont-elles meilleures que ces royaumes ?
  rationale: L’adjectif masculin pluriel « meilleures » n’a pas de sujet explicite en hébreu. Le pronom renvoie ici aux villes ou entités politiques nommées, tout en signalant en note l’autre compréhension possible.
- source_word: אִם
  choice: Ou
  rationale: Dans cette double interrogation rhétorique, אִם introduit la seconde possibilité et se rend naturellement par « ou ».
- source_word: רַב גְּבוּלָם מִגְּבֻלְכֶם
  choice: leur territoire est-il plus étendu que le vôtre
  rationale: גְּבוּל désigne ici l’étendue territoriale plutôt que la seule ligne frontalière. « Plus étendu » exprime idiomatiquement la comparaison de superficie.
theological_decisions:
- issue: Sujet implicite de הֲטוֹבִים (« meilleures »)
  choice: Le texte principal comprend comme sujet les villes ou royaumes qui viennent d’être nommés.
  alternative: 'Comprendre les destinataires : « Êtes-vous meilleurs que ces royaumes ? »'
  rationale: L’hébreu ne donne aucun sujet explicite. Les lieux récemment nommés constituent l’antécédent le plus immédiat, mais l’autre lecture est grammaticalement possible et doit être conservée en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Les impératifs conservent la progression géographique du texte. L’ambiguïté syntaxique centrale est maintenue par une note plutôt que résolue silencieusement.
