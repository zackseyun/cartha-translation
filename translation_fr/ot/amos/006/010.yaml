base_translation:
  language: en
  yaml_path: translation/ot/amos/006/010.yaml
  text: Then his uncle[a], the one who burns him, will carry him out to bring the bones out of the house, and he will say to the one who is in the innermost part of the house, “Is there still anyone with you?” And he will say, “No one.” Then he will say[c][b], “Hush! For we must not mention the name of Yahweh.”
translation:
  language: fr
  text: 'Son proche parent[a], celui qui le brûle[b], l’emportera pour faire sortir les ossements de la maison. Il dira à celui qui se trouve tout au fond de la maison : « Y a-t-il encore quelqu’un avec toi ? » Celui-ci répondra : « Personne. » Alors il dira : « Silence ! Car il ne faut pas prononcer le nom de Yahweh[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son oncle » ; le terme hébreu peut désigner un proche parent masculin.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celui qui le brûle ». Cette formulation inhabituelle peut évoquer une combustion liée à l’évacuation des cadavres en temps de jugement.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « Ne prononce pas le nom de Yahweh. » L’expression hébraïque est concise et peut se comprendre comme une interdiction directe ou comme l’énoncé d’une nécessité.'
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: son proche parent
  rationale: Dans ce contexte de retrait des morts, le terme désigne vraisemblablement un parent masculin proche. « Oncle » est possible, mais « proche parent » préserve mieux l’étendue sémantique de l’hébreu.
- source_word: וּמְסָרְפוֹ
  choice: chargé de le brûler
  rationale: Le participe vient de שׂרף, « brûler ». La formulation garde cette image inhabituelle sans la réduire à une préparation générale des funérailles.
- source_word: לְהוֹצִיא עֲצָמִים
  choice: pour sortir les ossements
  rationale: עֲצָמִים signifie concrètement « os, ossements ». « Sortir les ossements » reste proche de l’hébreu et naturel dans la scène.
- source_word: בְּיַרְכְּתֵי הַבַּיִת
  choice: tout au fond de la maison
  rationale: יַרְכָּה désigne les parties reculées ou intérieures d’un lieu. Cette expression est claire en français moderne.
- source_word: הַעוֹד עִמָּךְ
  choice: Y a-t-il encore quelqu’un avec toi ?
  rationale: Le pronom indéfini implicite est explicité en français afin de rendre naturellement la question sur une éventuelle personne encore présente.
- source_word: אָפֶס
  choice: Personne
  rationale: Le terme constitue ici une réponse elliptique indiquant qu’il ne reste personne.
- source_word: הָס
  choice: Silence !
  rationale: Cette interjection brusque impose le silence et conserve le ton de crainte de la scène.
- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: il ne faut pas prononcer le nom de Yahweh
  rationale: La construction infinitive est concise et peut exprimer une interdiction ou une nécessité négative. « Il ne faut pas » en préserve la force sans préciser abusivement qui impose l’interdit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Force de כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: Car il ne faut pas prononcer le nom de Yahweh
  alternative: Car ne prononce pas le nom de Yahweh
  rationale: L’hébreu est elliptique et peut s’entendre comme une interdiction directe ou comme l’énoncé d’une nécessité. Le rendu retenu préserve cette tension sans expliquer la raison du silence.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste abrupt, et l’étrangeté de la mention du feu est conservée. « Ossements » convient mieux que « restes » à l’image concrète de l’hébreu.
