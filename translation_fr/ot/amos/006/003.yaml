source:
  edition: WLC
  text: הַֽ/מְנַדִּ֖ים לְ/י֣וֹם רָ֑ע וַ/תַּגִּישׁ֖וּ/ן שֶׁ֥בֶת חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/003.yaml
  text: you who put far away the evil day and bring near the seat of violence[a][b].
translation:
  language: fr
  text: 'vous qui repoussez au loin le jour du malheur[a]

    et faites approcher le siège de la violence[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui remettez à plus tard le jour du malheur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « faites approcher le trône de la violence » ou « le règne de la violence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְנַדִּים
  choice: vous qui repoussez au loin
  rationale: Le participe interpelle directement les destinataires et exprime l’action de tenir à distance ou d’écarter. « Repoussez au loin » conserve l’image spatiale et la force accusatrice.
- source_word: לְיוֹם רָע
  choice: le jour du malheur
  rationale: L’expression désigne un jour à venir marqué par la calamité ou le jugement. « Jour du malheur » est naturel en français et garde ouverte la portée prophétique du syntagme.
- source_word: וַתַּגִּישׁוּן
  choice: et faites approcher
  rationale: La forme causative signifie « faire approcher ». Cette traduction maintient le contraste ironique entre le jour que les destinataires éloignent et la violence qu’ils font approcher.
- source_word: שֶׁבֶת
  choice: le siège
  rationale: Le terme peut évoquer un siège, un lieu établi de pouvoir, voire un règne. « Siège » préserve l’image concrète sans préciser indûment qu’il s’agit d’un trône ou d’un régime.
- source_word: חָמָס
  choice: la violence
  rationale: Le mot désigne couramment la violence, l’oppression ou le tort brutal. « Violence » convient directement au contexte de dénonciation sociale chez Amos.
theological_decisions:
- issue: Portée de l’ironie entre le jour du malheur et le siège de la violence
  choice: La formulation accuse les dirigeants complaisants d’écarter mentalement la calamité à venir tout en faisant approcher ou en établissant la domination de la violence.
  alternative: Ils pensent retarder le jugement, mais font en réalité approcher un jour de violence qui les frappera.
  rationale: L’hébreu est condensé et ne précise pas entièrement si la seconde expression vise surtout l’oppression qu’ils instaurent ou le jugement violent qu’elle attire. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme spatial « repoussez au loin / faites approcher » reproduit l’ironie du texte hébreu. Le vers conserve la forme d’interpellation dépendant du contexte précédent.
