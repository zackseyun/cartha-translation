review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : l’oracle vise les personnes insouciantes à Sion et celles qui se sentent en sécurité sur la montagne de Samarie. « Malheur à », « notables » et « la maison d’Israël » sont fidèles et appropriés. Toutefois, « de la première des nations » est grammaticalement compréhensible mais peu naturel en français et risque de laisser croire que les notables proviennent d’une entité explicitement identifiée comme « la première nation ». « Parmi les premières nations » maintient la densité et l’indétermination du syntagme רֵאשִׁית הַגּוֹיִם sans imposer son référent.'
  naturalness: Le registre est moderne et solennel. « Vivent dans l’insouciance » est naturel, mais légèrement plus explicatif que nécessaire; « sont insouciants » est plus direct et conserve mieux la valeur participiale. La relative « vers qui vient la maison d’Israël » est fidèle à la compression hébraïque, mais « auprès de qui » est plus idiomatique en français pour des personnes sans modifier le sens directionnel.
  terminology: Les toponymes Sion et Samarie, ainsi que la formule collective « maison d’Israël », sont correctement conservés. « Notables » convient pour נְקֻבֵי, avec une note qui sauvegarde la valeur littérale « désignés/nommés ». La note sur רֵאשִׁית הַגּוֹיִם doit offrir l’alternative littérale « les premières des nations » plutôt que des paraphrases qui réduisent l’ambiguïté.
