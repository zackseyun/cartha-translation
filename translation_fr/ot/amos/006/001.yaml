source:
  edition: WLC
  text: ה֚וֹי הַ/שַּׁאֲנַנִּ֣ים בְּ/צִיּ֔וֹן וְ/הַ/בֹּטְחִ֖ים בְּ/הַ֣ר שֹׁמְר֑וֹן נְקֻבֵי֙ רֵאשִׁ֣ית הַ/גּוֹיִ֔ם וּ/בָ֥אוּ לָ/הֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
translation:
  language: fr
  text: 'Malheur à ceux qui sont insouciants à Sion,

    et à ceux qui se croient en sécurité sur la montagne de Samarie,

    les notables[a] parmi les premières des nations[b],

    auprès de qui vient la maison d’Israël[c] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ceux qui sont désignés » ou « ceux qui sont nommés » : l’expression évoque des personnes reconnues comme éminentes.'
    reason: lexical_alternative
  - marker: b
    text: Ou « les premières des nations » ou « les principales des nations ».
    reason: lexical_alternative
  - marker: c
    text: 'La proposition hébraïque est très condensée; littéralement : « et la maison d’Israël vient vers eux ».'
    reason: textual_clarity
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule prophétique exprime à la fois la lamentation et l’annonce du jugement; « Malheur à » est l’équivalent français consacré et naturel.
- source_word: הַשַּׁאֲנַנִּים
  choice: ceux qui vivent dans l’insouciance
  rationale: Le terme désigne des personnes installées dans une tranquillité complaisante. « Dans l’insouciance » rend la nuance morale sans suggérer une simple paix légitime.
- source_word: בְּצִיּוֹן
  choice: à Sion
  rationale: La préposition française « à » convient naturellement au lieu habité que représente ici Sion.
- source_word: וְהַבֹּטְחִים
  choice: et à ceux qui se croient en sécurité
  rationale: Le verbe peut exprimer la confiance ou le sentiment de sécurité. Le tour pronominal souligne ici une assurance que l’oracle dénonce comme trompeuse.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: sur la montagne de Samarie
  rationale: Traduction géographique proche de l’hébreu, sans transformer nécessairement l’expression en nom propre « mont Samarie ».
- source_word: נְקֻבֵי
  choice: les notables
  rationale: Le mot signifie littéralement des personnes désignées ou nommées et, dans ce contexte, évoque des hommes reconnus comme éminents. « Les notables » est concis et idiomatique; le sens littéral est signalé en note.
- source_word: רֵאשִׁית הַגּוֹיִם
  choice: de la première des nations
  rationale: Cette formulation garde le caractère condensé et l’ambiguïté de l’expression hébraïque, qui peut indiquer le premier rang, la prééminence ou la primauté.
- source_word: וּבָאוּ לָהֶם
  choice: vers qui vient
  rationale: Le texte hébreu enchaîne littéralement « et vient vers eux ». La relative française explicite le lien syntaxique sans préciser indûment pourquoi Israël vient vers ces responsables.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Le maintien de l’expression hébraïque préserve sa portée collective, nationale et familiale, au lieu de la réduire simplement à « Israël ».
theological_decisions:
- issue: Destinataires situés à Sion et sur la montagne de Samarie
  choice: L’oracle nomme directement les élites insouciantes des deux centres, Sion et Samarie.
  alternative: Comprendre que l’ensemble du verset vise seulement les dirigeants du royaume du Nord, la mention de Sion ayant une fonction rhétorique ou soulevant une question textuelle.
  rationale: Le parallélisme du texte reçu place naturellement Sion et Samarie côte à côte. La traduction conserve cette tension géographique sans ramener les deux mentions à un seul groupe.
- issue: Identification de « la première des nations »
  choice: Conserver l’expression sans identifier explicitement la nation concernée.
  alternative: Paraphraser en désignant Israël comme la nation principale ou en faisant des notables les chefs des principales nations.
  rationale: La construction hébraïque est dense et son référent peut être compris de plusieurs façons. Une traduction non explicative évite de trancher une question que le verset laisse ouverte.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le rythme en quatre lignes convient à l’interpellation prophétique. « Maison d’Israël » est conservé comme formule biblique intelligible, tandis que « notables » évite une périphrase lourde.
