  text: לָ/כֵ֛ן עַתָּ֥ה יִגְל֖וּ בְּ/רֹ֣אשׁ גֹּלִ֑ים וְ/סָ֖ר מִרְזַ֥ח סְרוּחִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/007.yaml
  text: Therefore now they will go into exile at the head of the exiles[a], and the revelry of those who sprawl will pass away.
translation:
  language: fr
  text: C’est pourquoi, maintenant, ils partiront en exil en tête des déportés, et les réjouissances de ceux qui se prélassent[a] prendront fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le banquet de ceux qui sont étendus » ou « la fête bruyante de ceux qui sont vautrés ». L’expression hébraïque est concise et fait probablement écho à ceux qui s’allongent sur des divans au verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit clairement la conséquence du réquisitoire prophétique qui précède, dans un français naturel et soutenu.
- source_word: עַתָּה
  choice: maintenant
  rationale: Conserve la portée temporelle et l’imminence du jugement exprimées par l’adverbe hébreu.
- source_word: יִגְלוּ
  choice: ils partiront en exil
  rationale: Rend le sens actif de גלה tout en exprimant idiomatiquement la déportation annoncée.
- source_word: בְּרֹאשׁ גֹּלִים
  choice: en tête des déportés
  rationale: Préserve l’image de la tête ou du premier rang et l’ironie selon laquelle les notables seront les premiers emmenés.
- source_word: וְסָר
  choice: prendront fin
  rationale: Dans ce contexte festif, exprime naturellement la disparition ou la cessation annoncée par סור.
- source_word: מִרְזַח
  choice: les réjouissances
  rationale: Le terme désigne un festin ou une assemblée festive, souvent associé ici à l’excès; « réjouissances » conserve une certaine amplitude lexicale sans surinterpréter.
- source_word: סְרוּחִים
  choice: ceux qui se prélassent
  rationale: Évoque l’attitude relâchée et complaisante des élites étendues sur leurs divans au verset précédent, dans une formulation française actuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La tournure conserve la progression logique du jugement, l’ironie du premier rang dans la déportation et l’image des privilégiés nonchalamment étendus, tout en signalant en note l’ambiguïté de l’expression finale.
