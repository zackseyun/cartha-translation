  text: וְ/הָיָ֗ה אִם יִוָּ֨תְר֜וּ עֲשָׂרָ֧ה אֲנָשִׁ֛ים בְּ/בַ֥יִת אֶחָ֖ד וָ/מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/009.yaml
  text: And it will happen that if ten men remain in one house[a], they will die.
translation:
  language: fr
  text: Et s’il reste dix hommes dans une même maison[a], ils mourront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sont laissés ». Le verbe hébreu désigne le fait de rester ou d’être laissé après que d’autres ne sont plus là.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Et
  rationale: Dans ce contexte prophétique, la tournure וְהָיָה introduit la situation à venir. En français moderne, « Et » assure naturellement l’enchaînement sans la lourdeur de « il arrivera que ».
- source_word: אִם
  choice: si
  rationale: La particule introduit ici une condition. « Si » préserve cette valeur sans transformer la proposition en certitude temporelle comme pourrait le faire « quand ».
- source_word: יִוָּתְרוּ
  choice: il reste
  rationale: Le niphal de יתר désigne ce qui demeure ou subsiste après la disparition d’autres personnes. « Reste » est direct et conserve la voix et l’ambiguïté du verbe; « survivent » serait plus interprétatif.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dix hommes
  rationale: L’hébreu emploie explicitement un nom masculin pluriel. « Dix hommes » en rend précisément la forme.
- source_word: בְּבַיִת אֶחָד
  choice: dans une seule maison
  rationale: La locution est concrète et spatiale. « Une seule maison » exprime naturellement en français que les dix hommes se trouvent réunis dans la même maison, sans substituer la notion de maisonnée.
- source_word: וָמֵתוּ
  choice: ils mourront
  rationale: Le verbe poursuit la situation future annoncée. Le futur simple français rend clairement le résultat, tandis que l’enchaînement syntaxique suffit à porter la coordination.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et prophétique. La formulation conserve la condition introduite par « si », la référence masculine explicite et le sens concret de « maison », sans expliciter la cause de la mort.
