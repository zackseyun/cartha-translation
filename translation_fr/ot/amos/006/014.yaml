  variant: modern international French
source:
  edition: WLC
  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
translation:
  language: fr
  text: Car voici que je fais surgir contre vous, maison d’Israël, une nation qui vous opprimera depuis Lebo-Hamath[a] jusqu’au torrent de l’Araba[b] — déclaration de Yahweh, le Dieu des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’entrée de Hamath ». L’expression hébraïque peut être comprise comme le nom de lieu Lebo-Hamath ou comme une indication descriptive de frontière.
    reason: alternative_reading
  - marker: b
    text: Ou « jusqu’au ouadi de l’Araba ». Le mot hébreu désigne souvent un cours d’eau saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison du jugement annoncé dans le contexte et conserve le lien logique avec ce qui précède.
- source_word: הִנְנִי מֵקִים
  choice: voici que je fais surgir
  rationale: « Voici que » garde la force d’interpellation prophétique, tandis que « fais surgir » exprime le causatif de קום et l’action souveraine de Dieu.
- source_word: עֲלֵיכֶם
  choice: contre vous
  rationale: Dans ce contexte de jugement et d’agression militaire, la préposition a clairement une valeur hostile.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Conserve l’expression collective traditionnelle tout en fonctionnant naturellement comme apostrophe en français.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend de manière solennelle la formule prophétique et conserve le nom divin conformément à la ligne éditoriale.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: le Dieu des armées
  rationale: Rendu français clair et établi qui préserve la portée militaire de צבאות sans préciser indûment s’il s’agit d’armées terrestres ou célestes.
- source_word: גּוֹי
  choice: une nation
  rationale: Désigne ici une puissance nationale étrangère suscitée comme instrument de jugement.
- source_word: וְלָחֲצוּ
  choice: qui vous opprimera
  rationale: « Opprimer » exprime une pression et une domination durables. Le singulier français reprend naturellement « une nation », là où l’hébreu emploie ensuite un pluriel selon un accord collectif.
- source_word: מִלְּבוֹא חֲמָת
  choice: depuis Lebo-Hamath
  rationale: Traite l’expression comme le toponyme ou repère frontalier connu, tout en signalant en note l’analyse descriptive possible.
- source_word: נַחַל הָעֲרָבָה
  choice: le torrent de l’Araba
  rationale: נחל désigne un cours d’eau, souvent saisonnier; « torrent » est naturel en français biblique moderne, et « Araba » conserve le nom géographique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération « Yahweh » représente directement le nom propre hébreu et suit la convention indiquée par le projet, sans substituer un titre.
- issue: Portée de צבאות
  choice: le Dieu des armées
  alternative: le Dieu des puissances / le Dieu des armées célestes
  rationale: Le choix retenu préserve l’image de forces organisées sans limiter explicitement la référence aux seules armées célestes ou terrestres.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en incise conserve la solennité de la formule prophétique sans alourdir la phrase. Les marqueurs de notes sont placés sur les expressions géographiques auxquelles les variantes se rapportent.
