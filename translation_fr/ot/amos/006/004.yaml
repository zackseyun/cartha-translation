  text: הַ/שֹּֽׁכְבִים֙ עַל מִטּ֣וֹת שֵׁ֔ן וּ/סְרֻחִ֖ים עַל עַרְשׂוֹתָ֑/ם וְ/אֹכְלִ֤ים כָּרִים֙ מִ/צֹּ֔אן וַ/עֲגָלִ֖ים מִ/תּ֥וֹךְ מַרְבֵּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/004.yaml
  text: those who lie on beds of ivory and sprawl on their couches[b][a], and eat lambs from the flock and calves from the stall—
translation:
  language: fr
  text: ceux qui se couchent sur des lits d’ivoire et s’étalent sur leurs divans[a], et qui mangent les agneaux du troupeau et les veaux de l’étable[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’allongent de tout leur long » sur leurs divans.
    reason: lexical_alternative
  - marker: b
    text: Ou « les veaux d’une étable d’engraissement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁכְבִים
  choice: ceux qui se couchent
  rationale: Le participe substantivé poursuit la description commencée au verset précédent et exprime une conduite habituelle.
- source_word: מִטּוֹת שֵׁן
  choice: des lits d’ivoire
  rationale: Cette traduction formelle conserve l’expression concise de l’hébreu; il s’agit vraisemblablement de lits ornés ou incrustés d’ivoire, plutôt que fabriqués entièrement en ivoire.
- source_word: וּסְרֻחִים
  choice: et s’étalent
  rationale: Le terme évoque le fait de s’allonger de tout son long avec une aisance complaisante; «s’étalent» rend cette posture et sa nuance critique en français courant.
- source_word: עַל עַרְשׂוֹתָם
  choice: sur leurs divans
  rationale: «Divans» maintient la distinction avec les «lits» déjà mentionnés et convient au cadre luxueux du passage.
- source_word: וְאֹכְלִים
  choice: qui mangent
  rationale: La reprise de «qui» rend naturellement en français la série de participes hébreux et leur valeur habituelle.
- source_word: כָּרִים
  choice: les agneaux
  rationale: Le nom désigne de jeunes ovins; «agneaux» est l’équivalent français le plus clair, sans ajouter explicitement l’idée de bêtes de choix.
- source_word: מִצֹּאן
  choice: du troupeau
  rationale: Rendu direct qui conserve l’image d’animaux sélectionnés parmi le troupeau.
- source_word: וַעֲגָלִים
  choice: et les veaux
  rationale: Équivalent lexical direct, adapté à l’évocation de jeunes animaux consommés lors de repas luxueux.
- source_word: מִתּוֹךְ מַרְבֵּק
  choice: pris dans l’étable
  rationale: מַרְבֵּק désigne un enclos ou une étable où les animaux sont gardés, possiblement pour être engraissés. «Pris dans l’étable» rend explicitement מִתּוֹךְ tout en restant naturel.
