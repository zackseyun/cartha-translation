review_pass:
  verdict: revise
  source_fidelity: Le verset décrit, par une série de participes, des personnes qui reposent dans le luxe et consomment des jeunes bêtes. «Lits d’ivoire», «divans», «agneaux du troupeau» et «veaux» rendent fidèlement les expressions hébraïques. En revanche, «veaux pris dans l’étable» ajoute l’idée d’une prise ou d’une sélection, absente de מִתּוֹךְ («du milieu de / provenant de»).
  naturalness: Le français est globalement naturel et conserve bien le parallélisme. «Veaux de l’étable» est plus direct et idiomatique que «veaux pris dans l’étable», sans perte du sens spatial ou de provenance.
  terminology: «Divans» maintient utilement la distinction avec «lits». «S’étalent» exprime convenablement la détente ostentatoire de סְרֻחִים. La note sur l’étable doit également supprimer l’ajout «pris» et présenter l’engraissement comme une possibilité lexicale, non comme un élément affirmé du texte.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans «les veaux pris dans l’étable»
    rationale: Le syntagme hébreu מִתּוֹךְ מַרְבֵּק indique la provenance («de/dans l’étable ou l’enclos») mais ne dit pas que les veaux sont «pris». Cette formulation introduit une action supplémentaire.
  - severity: low
    issue: La note b reprend le même ajout «pris»
    rationale: La variante doit refléter l’alternative «étable d’engraissement» sans ajouter une sélection ou une prise des animaux.
  revised_text: ceux qui se couchent sur des lits d’ivoire et s’étalent sur leurs divans[a], et qui mangent les agneaux du troupeau et les veaux de l’étable[b] —
