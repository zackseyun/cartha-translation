base_translation:
  language: en
  yaml_path: translation/ot/amos/006/013.yaml
  text: you who rejoice over nothing[a], who say[b], “Have we not by our own strength taken horns for ourselves?”
translation:
  language: fr
  text: 'vous qui vous réjouissez pour rien[a],

    qui dites :

    « N’est-ce pas par notre propre force

    que nous avons pris pour nous des cornes[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « pour rien » peut aussi faire écho au nom de lieu Lo-Debar, ce qui créerait un jeu de mots entre ce nom et « rien » ou « aucune chose ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « que nous avons pris Karnaïm pour nous ? » Le mot hébreu traduit par « cornes » peut aussi évoquer Karnaïm, probablement dans un jeu de mots associant puissance militaire et conquête.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: vous qui vous réjouissez
  rationale: Le participe masculin pluriel prolonge l’interpellation prophétique du contexte. La tournure vocative conserve l’accusation directe.
- source_word: לְלֹא דָבָר
  choice: de ce qui n’est rien
  rationale: L’expression signifie littéralement « de/pour rien, aucune chose ». Cette formulation garde le jugement dépréciatif tout en permettant de signaler en note l’éventuel jeu de mots avec Lo-Debar.
- source_word: הָאֹמְרִים
  choice: qui dites
  rationale: Ce second participe pluriel est parallèle au premier et introduit directement la parole orgueilleuse.
- source_word: הֲלוֹא
  choice: N’est-ce pas
  rationale: La particule introduit une question rhétorique qui exprime l’assurance satisfaite des interlocuteurs.
- source_word: בְחָזְקֵנוּ
  choice: par notre propre force
  rationale: Le nom désigne la force ou la puissance, avec un suffixe de première personne du pluriel. « propre » rend explicite l’accent orgueilleux sans modifier le sens essentiel.
- source_word: לָקַחְנוּ לָנוּ
  choice: nous avons pris … pour nous-mêmes
  rationale: La formulation conserve le sens large de « prendre » ainsi que le datif d’intérêt, sans décider s’il s’agit seulement d’une image de puissance ou de la prise d’une ville.
- source_word: קַרְנָיִם
  choice: des cornes
  rationale: Le duel hébreu signifie littéralement « deux cornes » ou « une paire de cornes », image courante de puissance. Il peut aussi évoquer le nom de lieu Karnaïm ; la traduction principale garde l’image et la note préserve le jeu de mots possible.
theological_decisions:
- issue: Nature de la vantardise dénoncée
  choice: Conserver à la fois l’image des cornes et l’affirmation de force autonome
  alternative: Interpréter directement les cornes comme la puissance militaire ou traduire Karnaïm comme un nom de ville
  rationale: L’hébreu associe probablement orgueil militaire, symbole de puissance et éventuelles allusions géographiques. Le texte principal ne tranche pas ce que la formulation source laisse ouvert.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme participial et la question rhétorique sont conservés. L’expression inhabituelle « prendre des cornes pour nous-mêmes » maintient volontairement l’image concrète et le possible double sens géographique de l’hébreu.
