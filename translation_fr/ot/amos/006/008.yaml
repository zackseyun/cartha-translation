source:
  edition: WLC
  text: נִשְׁבַּע֩ אֲדֹנָ֨/י יְהוִ֜ה בְּ/נַפְשׁ֗/וֹ נְאֻם יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת מְתָאֵ֤ב אָֽנֹכִי֙ אֶת גְּא֣וֹן יַֽעֲקֹ֔ב וְ/אַרְמְנֹתָ֖י/ו שָׂנֵ֑אתִי וְ/הִסְגַּרְתִּ֖י עִ֥יר וּ/מְלֹאָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/008.yaml
  text: 'The Lord GOD has sworn by himself—oracle of Yahweh[a], the God of Armies: I abhor the pride of Jacob, and I hate his citadels[c][b]; and I will hand over the city and all that fills it.'
translation:
  language: fr
  text: 'Le Seigneur Yahweh a juré par lui-même — déclaration de Yahweh, le Dieu des armées[a] : « J’ai en horreur l’orgueil de Jacob[b] et je déteste ses citadelles[c] ; je livrerai la ville et tout ce qu’elle contient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « le Dieu des armées célestes » ou « le Dieu des puissances » ; le terme hébreu peut désigner des armées terrestres ou célestes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la majesté de Jacob ». Le mot hébreu peut évoquer soit la grandeur, soit l’orgueil ; le contexte de jugement favorise ici le sens négatif.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ses palais ». Le terme hébreu peut désigner des palais servant aussi de places fortes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire en français la combinaison confuse « le Seigneur SEIGNEUR ».
- source_word: נִשְׁבַּע ... בְּנַפְשׁוֹ
  choice: l’a juré par lui-même
  rationale: L’expression hébraïque signifie littéralement jurer par sa propre personne ou sa propre vie ; « par lui-même » en transmet naturellement la force.
- source_word: נְאֻם יְהוָה אֱלֹהֵי צְבָאוֹת
  choice: déclaration de Yahweh, le Dieu des armées
  rationale: « Déclaration » restitue la formule prophétique נְאֻם dans un français clair et solennel ; « armées » conserve l’image concrète de צְבָאוֹת.
- source_word: מְתָאֵב
  choice: J’ai en horreur
  rationale: Exprime la vive répulsion portée par le participe hébreu, dans un registre digne et courant.
- source_word: גְּאוֹן יַעֲקֹב
  choice: l’orgueil de Jacob
  rationale: Dans cet oracle de jugement, le sens négatif « orgueil » est le plus probable, tout en signalant en note l’autre valeur lexicale possible.
- source_word: אַרְמְנֹתָיו
  choice: ses citadelles
  rationale: Le terme peut désigner des palais fortifiés ; « citadelles » exprime ici à la fois le prestige urbain et la fonction défensive.
- source_word: שָׂנֵאתִי
  choice: je déteste
  rationale: Le présent français rend avec force l’attitude ferme exprimée par le parfait hébreu.
- source_word: וְהִסְגַּרְתִּי
  choice: je livrerai
  rationale: Au hiphil, סגר peut signifier livrer une ville au pouvoir de l’ennemi. Le futur convient à l’annonce du jugement, et la coordination simple évite d’ajouter une causalité absente de l’hébreu.
- source_word: עִיר וּמְלֹאָהּ
  choice: la ville avec tout ce qu’elle contient
  rationale: Formulation française naturelle qui englobe les habitants, les biens et tout ce qui remplit la ville sans restreindre le référent.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: La translittération préserve le nom divin distinct du titre אֲדֹנָי et évite de les confondre dans l’expression composée.
- issue: Sens de גְּאוֹן יַעֲקֹב
  choice: l’orgueil de Jacob
  alternative: la majesté de Jacob
  rationale: Le contexte immédiat de répulsion, de haine et de jugement favorise le sens négatif, mais la polysémie réelle du mot est conservée en note.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La ponctuation distingue la formule introductive de la parole divine. Les temps français rendent l’oath accompli avec portée actuelle, l’attitude divine ferme et le jugement annoncé.
