revisions:
- from: C’est pourquoi, voici comment j’agirai envers toi, Israël. Puisque j’agirai ainsi envers toi, prépare-toi à rencontrer ton Dieu, Israël.[a]
  to: C’est pourquoi, voici ce que je vais te faire, Israël ; puisque je vais te faire cela, prépare-toi à rencontrer ton Dieu[a], Israël.
  rationale: La révision rétablit en français la répétition de « faire » correspondant à עשה et rend plus directement les démonstratifs כֹּה et זֹאת. Elle maintient la tension du contexte sans introduire dans le texte une interprétation plus précise que « rencontrer ». Le repère de note est déplacé auprès de l’expression concernée.
