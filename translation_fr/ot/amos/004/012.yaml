    issue: Rendu de כֹּה אֶעֱשֶׂה et de זֹאת אֶעֱשֶׂה
    rationale: « Voici comment j’agirai envers toi » et sa reprise remplacent le verbe large et répété « faire » par « agir envers » et font de כֹּה une question de manière. « Voici ce que je vais te faire » / « je vais te faire cela » préserve mieux le déictique et la répétition rhétorique du texte hébreu.
  revised_text: C’est pourquoi, voici ce que je vais te faire, Israël ; puisque je vais te faire cela, prépare-toi à rencontrer ton Dieu[a], Israël.
