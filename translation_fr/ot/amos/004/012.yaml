base_translation:
  language: en
  yaml_path: translation/ot/amos/004/012.yaml
  text: Therefore[a], thus I will do to you, Israel; because I will do this to you, prepare to meet your God, Israel.
translation:
  language: fr
  text: C’est pourquoi, voici ce que je vais te faire, Israël ; puisque je vais te faire cela, prépare-toi à rencontrer ton Dieu[a], Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « prépare-toi à faire face à ton Dieu ». Dans ce contexte, cette rencontre est une confrontation redoutable après l’annonce du jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conclusion tirée des jugements évoqués dans les versets précédents, dans un français naturel et soutenu.
- source_word: כֹּה אֶעֱשֶׂה לְּךָ
  choice: voici comment j’agirai envers toi
  rationale: כֹּה garde sa valeur déictique (« ainsi/voici comment »), tandis que « agir envers » rend l’expression sans préciser artificiellement la forme du jugement.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Conservation usuelle du nom propre et de l’adresse directe.
- source_word: עֵקֶב כִּי
  choice: Puisque
  rationale: Introduit ici le motif de l’injonction qui suit; « puisque » évite la lourdeur d’une répétition causale tout en conservant le lien logique.
- source_word: זֹאת אֶעֱשֶׂה לָךְ
  choice: j’agirai ainsi envers toi
  rationale: Le démonstratif זֹאת reprend l’action annoncée; la formulation conserve la généralité de עשה et la portée menaçante donnée par le contexte.
- source_word: הִכּוֹן
  choice: prépare-toi
  rationale: Rend directement l’impératif niphal de כון, qui appelle Israël à se tenir prêt.
- source_word: לִקְרַאת
  choice: à rencontrer
  rationale: Exprime le mouvement vers une rencontre ou une confrontation sans imposer dans le corps du texte une nuance absente du terme lui-même.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le possessif singulier correspond au suffixe hébreu et maintient la force de l’adresse à Israël comme collectivité.
theological_decisions:
- issue: Tonalité de « prépare-toi à rencontrer ton Dieu »
  choice: Une sommation menaçante à comparaître devant Dieu dans le contexte du jugement
  alternative: Un appel neutre ou favorable à l’adoration ou à la repentance
  rationale: Le contexte immédiat énumère des châtiments et annonce une nouvelle intervention divine. Toutefois, l’expression elle-même ne décrit pas explicitement la nature de la rencontre; cette portée contextuelle est donc signalée en note plutôt qu’ajoutée au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise de « j’agirai » conserve la répétition rhétorique de l’hébreu, tandis que « envers toi » préserve l’ambiguïté lexicale de la préposition sans masquer la menace indiquée par le contexte.
