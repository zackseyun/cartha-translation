id: AMO.4.13
reference: Amos 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֡י הִנֵּה֩ יוֹצֵ֨ר הָרִ֜ים וּ/בֹרֵ֣א ר֗וּחַ וּ/מַגִּ֤יד לְ/אָדָם֙ מַה שֵּׂח֔/וֹ עֹשֵׂ֥ה שַׁ֨חַר֙ עֵיפָ֔ה וְ/דֹרֵ֖ךְ עַל בָּ֣מֳתֵי אָ֑רֶץ יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/013.yaml
  text: For behold[a], the one who forms the mountains and creates the wind, and declares to man what his thought is, who makes the dawn darkness and treads on the heights of the earth—Yahweh, the God of hosts[c][b], is his name.
translation:
  language: fr
  text: 'Car voici celui qui façonne les montagnes et crée le vent[a], qui révèle à l’être humain[b] ce qu’il pense[c], qui fait de l’aurore l’obscurité et foule les hauteurs de la terre : Yahweh, le Dieu des armées, tel est son nom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle » ou « l’esprit » ; le mot hébreu רוּחַ peut avoir ces différents sens.
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’homme » ; le mot hébreu אָדָם est ici un singulier représentatif.
    reason: lexical_alternative
  - marker: c
    text: Ou « quelle est sa pensée », « sa méditation » ou « son propos intérieur » ; le terme hébreu peut désigner une pensée ou une réflexion intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: כִּי rattache le verset à l’avertissement précédent en en donnant le fondement, tandis que הִנֵּה attire solennellement l’attention.
- source_word: יוֹצֵר הָרִים
  choice: façonne les montagnes
  rationale: Le participe יוֹצֵר évoque une action intentionnelle de mise en forme; « façonne » en conserve l’image concrète.
- source_word: וּבֹרֵא רוּחַ
  choice: et crée le vent
  rationale: Dans cette série d’actes cosmiques, « vent » convient au contexte, sans exclure les autres sens possibles de רוּחַ, signalés en note.
- source_word: וּמַגִּיד לְאָדָם
  choice: qui révèle à l’être humain
  rationale: מַגִּיד exprime ici le fait de faire connaître; אָדָם est un singulier représentatif désignant l’être humain.
- source_word: מַה שֵּׂחוֹ
  choice: ce qu’est sa pensée
  rationale: שֵׂחַ peut désigner la pensée, la méditation ou le propos intérieur. Le possessif français maintient l’ambiguïté possible de son référent.
- source_word: עֹשֵׂה שַׁחַר עֵיפָה
  choice: qui fait de l’aurore l’obscurité
  rationale: La formulation rend directement l’image d’une aurore transformée en obscurité, signe de la souveraineté divine et possible image de jugement.
- source_word: וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ
  choice: et foule les hauteurs de la terre
  rationale: « Foule » conserve la force de דרך, tandis que « hauteurs » rend ici le sens topographique de בָּמוֹת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: Cette traduction conserve l’image hébraïque des armées placées sous l’autorité divine.
- source_word: שְׁמוֹ
  choice: tel est son nom
  rationale: Cette formule française naturelle préserve l’identification solennelle et culminante du texte hébreu.
theological_decisions:
- issue: Sens de רוּחַ dans le contexte de la création
  choice: vent
  alternative: esprit ou souffle
  rationale: Les montagnes, l’aurore et les hauteurs terrestres favorisent le sens cosmique de « vent », mais la polysémie du mot hébreu est explicitement conservée en note.
- issue: Référent du possessif dans מַה שֵּׂחוֹ
  choice: sa pensée
  alternative: ce que lui-même pense / ce que pense l’être humain
  rationale: Le possessif hébreu peut être compris comme renvoyant à Dieu ou à l’être humain. Le français « sa pensée » préserve cette tension au lieu de la trancher.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et conserve la force de la déclaration « tel est son nom ».
- issue: Portée de אָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Ici, le singulier אָדָם a une valeur représentative et générique. « L’être humain » rend cette portée sans transformer le singulier en pluriel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe cumulative conserve l’élan de la proclamation prophétique; « façonne », « foule » et « tel est son nom » maintiennent sa force poétique sans archaïsme excessif.
