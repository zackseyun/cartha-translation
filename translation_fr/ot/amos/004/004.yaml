id: AMO.4.4
reference: Amos 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֹּ֤אוּ בֵֽית אֵל֙ וּ/פִשְׁע֔וּ הַ/גִּלְגָּ֖ל הַרְבּ֣וּ לִ/פְשֹׁ֑עַ וְ/הָבִ֤יאוּ לַ/בֹּ֨קֶר֙ זִבְחֵי/כֶ֔ם לִ/שְׁלֹ֥שֶׁת יָמִ֖ים מַעְשְׂרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/004.yaml
  text: Come to Bethel—and transgress; to Gilgal—and multiply transgression. Bring your sacrifices every morning[a], your tithes every three days,
translation:
  language: fr
  text: Venez à Béthel et commettez des transgressions ; à Guilgal, multipliez vos transgressions. Apportez chaque matin vos sacrifices, et tous les trois jours[a] vos dîmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le troisième jour » ou « au bout de trois jours ».'
    reason: L’expression hébraïque peut recevoir ces différentes interprétations temporelles.
lexical_decisions:
- source_word: בֹּאוּ
  choice: Venez
  rationale: L’impératif pluriel conserve l’interpellation prophétique vive et directe.
- source_word: בֵית אֵל
  choice: Béthel
  rationale: Transcription française usuelle du nom de lieu, sans le traduire par « maison de Dieu ».
- source_word: וּפִשְׁעוּ
  choice: et commettez des transgressions
  rationale: פשע évoque la transgression et la rébellion ; cette formulation garde l’ironie mordante tout en restant naturelle en français.
- source_word: הַגִּלְגָּל
  choice: à Guilgal
  rationale: Nom de lieu selon sa forme française usuelle ; le mouvement est compris par parallélisme avec « Venez à Béthel ».
- source_word: הַרְבּוּ לִפְשֹׁעַ
  choice: multipliez vos transgressions
  rationale: L’impératif hiphil suivi de l’infinitif exprime l’accroissement ; la formulation préserve la concision et le sarcasme prophétiques.
- source_word: וְהָבִיאוּ
  choice: Apportez
  rationale: L’impératif pluriel poursuit l’invitation ironique du prophète.
- source_word: לַבֹּקֶר
  choice: chaque matin
  rationale: Le contexte favorise une valeur distributive soulignant avec ironie l’assiduité rituelle.
- source_word: זִבְחֵיכֶם
  choice: vos sacrifices
  rationale: Équivalent français courant et précis dans ce contexte cultuel.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: tous les trois jours
  rationale: Cette lecture convient à la satire d’un zèle rituel fréquent, tout en signalant en note l’ambiguïté réelle de l’expression hébraïque.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: vos dîmes
  rationale: Terme français établi pour les dons cultuels correspondant au dixième.
theological_decisions:
- issue: Ironie prophétique des impératifs
  choice: 'Conserver de véritables impératifs : « Venez… commettez… multipliez… Apportez »'
  alternative: 'Expliciter le sarcasme, par exemple : « Allez-y, commettez des transgressions »'
  rationale: L’hébreu formule des ordres dans une dénonciation ironique. Les rendre directement laisse l’ironie surgir du contexte sans ajouter une interprétation.
- issue: Sens temporel de לִשְׁלֹשֶׁת יָמִים
  choice: « tous les trois jours » dans le texte principal
  alternative: « le troisième jour » ou « au bout de trois jours »
  rationale: L’expression est réellement ambiguë. Le choix principal correspond bien à la satire du zèle cultuel, tandis que la note préserve les autres lectures possibles.
translation_notes:
  register: Français moderne international, digne et direct. Les impératifs gardent la force de l’ironie prophétique ; le vocabulaire cultuel demeure courant et compréhensible.
