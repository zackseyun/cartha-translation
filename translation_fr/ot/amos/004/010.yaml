  text: שִׁלַּ֨חְתִּי בָ/כֶ֥ם דֶּ֨בֶר֙ בְּ/דֶ֣רֶךְ מִצְרַ֔יִם הָרַ֤גְתִּי בַ/חֶ֨רֶב֙ בַּח֣וּרֵי/כֶ֔ם עִ֖ם שְׁבִ֣י סֽוּסֵי/כֶ֑ם וָ/אַעֲלֶ֞ה בְּאֹ֤שׁ מַחֲנֵי/כֶם֙ וּֽ/בְ/אַפְּ/כֶ֔ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/010.yaml
  text: I sent among you a plague in the manner of Egypt[a]; I killed your young men with the sword, along with your captured horses, and I made the stench of your camps rise even into your nostrils; yet you did not return to me[b], declares Yahweh.
translation:
  language: fr
  text: J’ai envoyé parmi vous une épidémie à la manière de l’Égypte[a] ; j’ai tué vos jeunes hommes par l’épée, et vos chevaux ont été capturés[b]. J’ai fait monter la puanteur de vos camps jusque dans vos narines. Pourtant, vous n’êtes pas revenus à moi, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme en Égypte ». L’expression évoque probablement les fléaux et les jugements liés à l’Égypte, plutôt qu’une route conduisant en Égypte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec la captivité de vos chevaux ». L’expression condensée semble décrire une défaite militaire au cours de laquelle les jeunes hommes ont été tués et les chevaux capturés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלַּחְתִּי בָכֶם
  choice: J’ai envoyé parmi vous
  rationale: Cette formulation conserve l’action divine exprimée par שׁלח et rend naturellement בָכֶם sans préciser davantage que le texte si le fléau est envoyé « parmi » ou « contre » le peuple.
- source_word: דֶּבֶר
  choice: une épidémie
  rationale: Le nom désigne un fléau épidémique meurtrier. « Épidémie » est clair en français actuel et évite d’identifier à tort une maladie précise, comme pourrait le faire « peste ».
- source_word: בְּדֶרֶךְ מִצְרַיִם
  choice: comme en Égypte
  rationale: La formule évoque vraisemblablement les fléaux ou jugements associés à l’Égypte. Cette traduction française est naturelle tout en laissant l’allusion être précisée en note.
- source_word: הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם
  choice: j’ai tué par l’épée vos jeunes hommes
  rationale: « Tué » restitue directement הָרַגְתִּי ; « par l’épée » est l’expression française habituelle pour une mort guerrière, et « jeunes hommes » garde le sens premier de בַּחוּרֵיכֶם sans le réduire à « soldats ».
- source_word: עִם שְׁבִי סוּסֵיכֶם
  choice: tandis que vos chevaux étaient emmenés captifs
  rationale: L’hébreu est condensé et associe la mort des jeunes hommes à la capture des chevaux. La formulation retenue exprime naturellement cette défaite militaire sans faire des chevaux les objets du verbe « tuer ».
- source_word: וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּבְאַפְּכֶם
  choice: J’ai fait monter la puanteur de vos camps jusque dans vos narines
  rationale: La tournure causative « j’ai fait monter » suit le verbe hébreu ; « puanteur » conserve la force concrète de בְּאֹשׁ, et « narines » correspond au sens physique évident de אַף dans ce contexte.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Pourtant, vous n’êtes pas revenus à moi
  rationale: Le verbe שׁוב porte ici une forte dimension d’appel à la repentance, mais « revenir à moi » conserve l’image et la tension propres au texte sans ajouter une explicitation doctrinale.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue directement, et le nom divin personnel est transcrit plutôt que remplacé par un titre.
theological_decisions:
- issue: Le nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom personnel de Dieu au lieu de lui substituer un titre.
- issue: La portée de וְלֹא שַׁבְתֶּם עָדַי
  choice: vous n’êtes pas revenus à moi
  alternative: vous ne vous êtes pas repentis et n’êtes pas revenus à moi
  rationale: Le retour implique ici la repentance dans le cadre de l’alliance, mais la traduction conserve le verbe concret du texte sans déployer cette implication dans le corps du verset.
translation_notes:
  register: Français international actuel, clair et digne. Le rythme prophétique demeure direct et sévère. « Puanteur » garde la vigueur sensorielle de l’hébreu, tandis que « épidémie » évite l’archaïsme de « pestilence » et la précision médicale excessive de « peste ».
