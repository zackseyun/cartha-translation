revisions:
- from: J’ai envoyé parmi vous une épidémie comme en Égypte[a] ; j’ai tué par l’épée vos jeunes hommes, tandis que vos chevaux étaient emmenés captifs[b]. J’ai fait monter la puanteur de vos camps jusque dans vos narines. Pourtant, vous n’êtes pas revenus à moi, déclare Yahweh.
  to: J’ai envoyé parmi vous une épidémie à la manière de l’Égypte[a] ; j’ai tué vos jeunes hommes par l’épée, et vos chevaux ont été capturés[b]. J’ai fait monter la puanteur de vos camps jusque dans vos narines. Pourtant, vous n’êtes pas revenus à moi, déclare Yahweh.
  rationale: La révision remplace un connecteur temporel interprétatif par une coordination française simple, tout en maintenant en note la forme condensée et l’incertitude d’interprétation du syntagme hébreu. Elle affine également la première expression afin de rendre plus nettement le sens modal probable de « à la manière de l’Égypte ».
