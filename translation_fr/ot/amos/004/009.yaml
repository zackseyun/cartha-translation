  text: הִכֵּ֣יתִי אֶתְ/כֶם֮ בַּ/שִּׁדָּפ֣וֹן וּ/בַ/יֵּרָקוֹן֒ הַרְבּ֨וֹת גַּנּוֹתֵי/כֶ֧ם וְ/כַרְמֵי/כֶ֛ם וּ/תְאֵנֵי/כֶ֥ם וְ/זֵיתֵי/כֶ֖ם יֹאכַ֣ל הַ/גָּזָ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/009.yaml
  text: I struck you with blight and mildew; your many gardens and your vineyards[a], your fig trees and your olive trees, the locust devoured; yet you did not return to me, declares Yahweh.
translation:
  language: fr
  text: Je vous ai frappés par la brûlure et le jaunissement. Le criquet ravageur a dévoré vos nombreux jardins et vos vignes, vos figuiers et vos oliviers. Pourtant, vous n’êtes pas revenus à moi — déclaration de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: Je vous ai frappés
  rationale: Le hiphil de נכה exprime directement l’action de frapper. Cette formulation moderne conserve l’affirmation explicite du jugement divin.
- source_word: בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן
  choice: par la flétrissure et le jaunissement
  rationale: Les deux termes désignent des atteintes agricoles, probablement un dessèchement ou une brûlure des végétaux et leur jaunissement. Cette formulation reste claire sans prétendre identifier avec certitude des maladies végétales précises.
- source_word: הַרְבּוֹת גַּנּוֹתֵיכֶם
  choice: Vos nombreux jardins
  rationale: הַרְבּוֹת indique ici l’abondance ou le grand nombre, tandis que גַּנּוֹת désigne directement des jardins ou terrains cultivés.
- source_word: כַרְמֵיכֶם
  choice: vos vignes
  rationale: כֶּרֶם peut désigner une vigne au sens de terrain planté de ceps, ou un vignoble. « Vos vignes » s’intègre naturellement à l’énumération française.
- source_word: תְאֵנֵיכֶם וְזֵיתֵיכֶם
  choice: vos figuiers et vos oliviers
  rationale: Dans ce contexte agricole, les deux noms désignent les arbres eux-mêmes plutôt que leurs fruits.
- source_word: יֹאכַל הַגָּזָם
  choice: le criquet ravageur les a dévorés
  rationale: גָּזָם désigne un insecte destructeur de cultures, traditionnellement compris comme une sorte de criquet. Le passé convient à la série rétrospective des jugements, et le pronom de reprise rend naturelle en français l’antéposition des objets présente en hébreu.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Pourtant, vous n’êtes pas revenus à moi
  rationale: שׁוב avec עַד exprime le retour vers Dieu. « Revenir à moi » préserve la portée relationnelle et spirituelle sans la réduire au seul sentiment de repentir.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule solennelle d’oracle prophétique. « Déclaration de » en conserve la force formelle, et le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée de שַׁבְתֶּם עָדַי
  choice: vous n’êtes pas revenus à moi
  alternative: vous ne vous êtes pas repentis devant moi
  rationale: Le verbe exprime un mouvement de retour vers Dieu qui comprend la repentance et le rétablissement de l’allégeance, sans se limiter à une notion doctrinale plus étroite.
- issue: Agent du désastre agricole
  choice: Je vous ai frappés
  alternative: vous avez été frappés
  rationale: La première personne du texte attribue explicitement le jugement à Yahweh; la voix active doit être conservée plutôt qu’atténuée.
translation_notes:
  register: Français international moderne, digne et accessible. L’antéposition de l’énumération suivie du pronom « les » reflète l’ordre emphatique de l’hébreu tout en restant idiomatique. « Flétrissure et jaunissement » évite les termes agricoles vieillissants « rouille et nielle » et préserve l’incertitude exacte des deux fléaux.
