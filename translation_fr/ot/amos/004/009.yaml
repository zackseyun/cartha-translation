revisions:
- from: Je vous ai frappés par la flétrissure et le jaunissement. Vos nombreux jardins et vos vignes, vos figuiers et vos oliviers, le criquet ravageur[a] les a dévorés. Pourtant, vous n’êtes pas revenus à moi — déclaration de Yahweh.
  to: Je vous ai frappés par la brûlure et le jaunissement. Le criquet ravageur a dévoré vos nombreux jardins et vos vignes, vos figuiers et vos oliviers. Pourtant, vous n’êtes pas revenus à moi — déclaration de Yahweh.
  rationale: La révision remplace « flétrissure » par « brûlure », terme plus concret pour le premier fléau agricole, et simplifie la syntaxe de la proposition concernant le criquet. La note reste nécessaire pour préserver l’incertitude lexicale de גָּזָם. Le sens, l’agent divin explicite, l’énumération des cultures et la formule oraculaire sont maintenus.
