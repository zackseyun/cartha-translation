review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est fidèlement rendu : Yahweh parle à la première personne, les fléaux agricoles et les cultures touchées sont conservés, de même que le constat final de l’absence de retour vers lui. Toutefois, « flétrissure » est peu précis et peu naturel ici pour שִׁדָּפוֹן, qui évoque plus concrètement une brûlure/dessiccation des cultures.'
  naturalness: La dislocation « Vos nombreux jardins … le criquet ravageur les a dévorés » est grammaticalement possible, mais lourde. Une reprise syntaxique plus directe demeure proche de l’ordre hébreu tout en étant plus fluide. « Brûlure et jaunissement » est plus idiomatique et plus concret que « flétrissure et jaunissement ».
  terminology: « Yahweh » suit la décision éditoriale fournie. « Criquet ravageur » rend de façon accessible l’insecte désigné par גָּזָם sans prétendre à une identification zoologique certaine. La note conserve correctement cette incertitude.
  issues:
  - severity: low
    issue: « flétrissure » pour בַּשִּׁדָּפוֹן
    rationale: Le terme français est abstrait et évoque surtout l’état d’une plante fanée. Dans ce contexte de calamité agricole, « brûlure » rend mieux l’idée de dessiccation ou de brûlure des cultures, sans imposer une identification technique incertaine.
  - severity: low
    issue: Construction disloquée avec « les a dévorés »
    rationale: Elle est possible, mais l’accumulation des groupes nominaux antéposés suivis du pronom rend la phrase plus pesante que nécessaire. Une construction directe reste fidèle à la relation objet-agent du texte hébreu.
  revised_text: Je vous ai frappés par la brûlure et le jaunissement. Le criquet ravageur a dévoré vos nombreux jardins et vos vignes, vos figuiers et vos oliviers. Pourtant, vous n’êtes pas revenus à moi — déclaration de Yahweh.
  revised_footnotes:
  - marker: a
    text: Ou « l’insecte rongeur » ; le mot hébreu désigne un insecte qui détruit les cultures, traditionnellement considéré comme une sorte de criquet.
    reason: Alternative lexicale en raison de l’identification zoologique incertaine de גָּזָם.
  revision_rationale: La révision remplace « flétrissure » par « brûlure », terme plus concret pour le premier fléau agricole, et simplifie la syntaxe de la proposition concernant le criquet. La note reste nécessaire pour préserver l’incertitude lexicale de גָּזָם. Le sens, l’agent divin explicite, l’énumération des cultures et la formule oraculaire sont maintenus.
