source:
  edition: WLC
  text: וְ/קַטֵּ֤ר מֵֽ/חָמֵץ֙ תּוֹדָ֔ה וְ/קִרְא֥וּ נְדָב֖וֹת הַשְׁמִ֑יעוּ כִּ֣י כֵ֤ן אֲהַבְתֶּם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/005.yaml
  text: And burn a thank offering from leavened bread[a], and proclaim freewill offerings—announce them! For this is what you have loved, O sons of Israel[b], declares the Lord GOD.
translation:
  language: fr
  text: Faites monter en fumée une offrande de reconnaissance avec du levain[a] ; proclamez des offrandes volontaires, annoncez-les ! Car voilà ce que vous aimez, fils d’Israël — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec du pain levé » ou « faite de pain levé » ; l’hébreu associe à l’offrande de reconnaissance du levain ou une matière levée, sans préciser entièrement leur relation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַטֵּר
  choice: Faites monter en fumée
  rationale: Le piel impératif décrit l’action cultuelle de faire brûler une offrande sur l’autel afin que sa fumée monte. Cette formulation conserve l’image sacrificielle et le ton ironique de l’ordre.
- source_word: מֵחָמֵץ
  choice: avec du levain
  rationale: La préposition מִן et חָמֵץ relient à l’offrande du levain ou une matière levée, sans préciser entièrement la relation. La traduction principale reste donc concise et la note conserve les autres lectures possibles.
- source_word: תּוֹדָה
  choice: une offrande de reconnaissance
  rationale: Dans ce contexte cultuel, תּוֹדָה désigne une offrande ou un sacrifice présenté en reconnaissance, et non simplement un sentiment de gratitude.
- source_word: וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ
  choice: proclamez des offrandes volontaires, annoncez-les !
  rationale: Les deux impératifs soulignent la publicité donnée aux offrandes. « Offrandes volontaires » rend le terme sacrificiel נְדָבוֹת, tandis que « annoncez-les » exprime le causatif « faites entendre » dans un français courant.
- source_word: כִּי כֵן אֲהַבְתֶּם
  choice: Car voilà ce que vous aimez
  rationale: Cette tournure française rend l’accusation portant sur l’attachement habituel des destinataires à ces pratiques. Le présent exprime naturellement cette disposition établie sans atténuer l’ironie prophétique.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: La traduction conserve la forme masculine plurielle et la force de l’interpellation prophétique hébraïque.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם. « Seigneur » traduit אֲדֹנָי et « Yahweh » représente distinctement le nom divin יהוה.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. Les rendre séparément préserve cette distinction au lieu de remplacer le nom divin par un second titre.
- issue: Portée ironique des impératifs cultuels
  choice: Conserver les impératifs sans ajouter une condamnation explicite
  alternative: Paraphraser comme une dénonciation directe du culte
  rationale: L’ironie ressort du contexte et de la clause « voilà ce que vous aimez ». La traduction ne doit pas transformer les ordres sarcastiques en interdictions ni préciser au-delà du texte la faute cultuelle visée.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le vocabulaire sacrificiel est explicite sans devenir technique à l’excès. La ponctuation met en valeur l’accumulation ironique des impératifs et la formule prophétique finale.
