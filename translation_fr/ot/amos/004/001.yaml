  text: שִׁמְע֞וּ הַ/דָּבָ֣ר הַ/זֶּ֗ה פָּר֤וֹת הַ/בָּשָׁן֙ אֲשֶׁר֙ בְּ/הַ֣ר שֹֽׁמְר֔וֹן הָ/עֹשְׁק֣וֹת דַּלִּ֔ים הָ/רֹצְצ֖וֹת אֶבְיוֹנִ֑ים הָ/אֹמְרֹ֥ת לַ/אֲדֹֽנֵי/הֶ֖ם הָבִ֥יאָ/ה וְ/נִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/001.yaml
  text: Hear this word[a], you cows of Bashan, who are on the mountain of Samaria, who oppress the poor, who crush the needy, who say to their masters, “Bring[b], that we may drink.”
translation:
  language: fr
  text: 'Écoutez cette parole, vaches du Bashan[a], qui êtes sur la montagne de Samarie, qui opprimez les pauvres, qui écrasez les démunis, qui dites à leurs maîtres[b] : « Apporte, pour que nous buvions. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Bashan était une région fertile à l’est du Jourdain, réputée pour son bétail bien nourri. L’image constitue ici une insulte mordante contre le luxe nourri par l’oppression.
    reason: cultural_note
  - marker: b
    text: Ou « à leurs maris ». Le terme hébreu peut désigner des maîtres, des seigneurs ou des maris selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » constitue en français un appel prophétique direct, naturel et solennel.
- source_word: הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: Dans un contexte prophétique, « parole » conserve la portée formelle de l’annonce sans réduire דָּבָר à une simple information.
- source_word: פָּרוֹת הַבָּשָׁן
  choice: vaches du Bashan
  rationale: פָּרוֹת désigne des bovins femelles. La traduction garde l’image insultante et évocatrice du texte hébreu.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: sur la montagne de Samarie
  rationale: Rend directement le singulier הַר et la valeur locative de la préposition בְּ.
- source_word: הָעֹשְׁקוֹת דַּלִּים
  choice: qui opprimez les faibles
  rationale: עשׁק exprime l’oppression ou l’exploitation. דַּלִּים désigne ici des personnes socialement faibles ou démunies; « faibles » permet aussi de distinguer ce terme de אֶבְיוֹנִים.
- source_word: הָרֹצְצוֹת אֶבְיוֹנִים
  choice: qui écrasez les pauvres
  rationale: « Écrasez » préserve la métaphore violente de רצץ. « Pauvres » rend naturellement אֶבְיוֹנִים dans ce contexte social.
- source_word: הָאֹמְרֹת לַאֲדֹנֵיהֶם
  choice: qui dites à vos maîtres
  rationale: La deuxième personne maintient l’adresse directe commencée par l’impératif. אֲדֹנֵיהֶם peut désigner des maîtres, des seigneurs ou des maris; « maîtres » conserve le sens le plus large.
- source_word: הָבִיאָה
  choice: Apportez
  rationale: Impératif causatif de בוא employé transitivement. L’objet, non exprimé en hébreu, reste implicite en français.
- source_word: וְנִשְׁתֶּה
  choice: et buvons
  rationale: La forme peut exprimer la volonté ou l’invitation à la première personne du pluriel après l’impératif. « Et buvons » demeure concise et préserve mieux la coordination hébraïque qu’une proposition finale explicitée.
theological_decisions:
- issue: Référent de l’adresse féminine « vaches du Bashan »
  choice: Métaphore prophétique visant directement des femmes aisées de Samarie, présentées comme repues et oppressives.
  alternative: Métaphore visant plus largement l’élite luxueuse de Samarie, sans se limiter strictement aux femmes.
  rationale: Les formes féminines plurielles employées tout au long du verset appuient fortement une adresse à des femmes. La traduction conserve cette marque grammaticale et ne neutralise pas l’insulte prophétique.
- issue: Sens de לַאֲדֹנֵיהֶם
  choice: à vos maîtres
  alternative: à vos maris; à vos seigneurs
  rationale: Le substantif hébreu admet plusieurs rapports possibles. Le texte principal retient le terme français le plus large, tandis qu’une note préserve l’interprétation conjugale plausible.
translation_notes:
  register: Français international actuel, digne et direct. Le verset conserve l’appel prophétique, l’image volontairement offensante des « vaches du Bashan », les participes féminins rendus par une adresse à la deuxième personne, ainsi que l’ambiguïté relationnelle de אֲדֹנֵיהֶם. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
