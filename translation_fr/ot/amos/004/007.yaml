source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִי֩ מָנַ֨עְתִּי מִ/כֶּ֜ם אֶת הַ/גֶּ֗שֶׁם בְּ/ע֨וֹד שְׁלֹשָׁ֤ה חֳדָשִׁים֙ לַ/קָּצִ֔יר וְ/הִמְטַרְתִּי֙ עַל עִ֣יר אֶחָ֔ת וְ/עַל עִ֥יר אַחַ֖ת לֹ֣א אַמְטִ֑יר חֶלְקָ֤ה אַחַת֙ תִּמָּטֵ֔ר וְ/חֶלְקָ֛ה אֲשֶֽׁר לֹֽא תַמְטִ֥יר עָלֶ֖י/הָ תִּיבָֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/007.yaml
  text: And I also withheld the rain from you when there were still three months until the harvest; and I caused it to rain on one city[a], but on another city I did not cause it to rain. One field received rain, but the field on which it did not rain dried up.
translation:
  language: fr
  text: Et moi aussi, je vous ai privés de pluie alors qu’il restait encore trois mois avant la moisson. J’ai fait pleuvoir sur une ville, mais sur une autre ville je n’ai pas fait pleuvoir. Une parcelle a reçu la pluie, tandis que la parcelle sur laquelle il n’a pas plu s’est desséchée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אָנֹכִי
  choice: Et moi aussi
  rationale: Préserve à la fois le lien additif de וְגַם et l’accent porté par le pronom indépendant אָנֹכִי, dans une tournure française naturelle.
- source_word: מָנַעְתִּי מִכֶּם אֶת הַגֶּשֶׁם
  choice: je vous ai retenu la pluie
  rationale: מנע construit avec מן exprime la privation ou la rétention. Cette formulation conserve l’action directe de Dieu et son effet sur les destinataires.
- source_word: בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר
  choice: alors qu’il restait encore trois mois avant la moisson
  rationale: Rend clairement la durée qui restait jusqu’à la moisson et souligne que la pluie a été retenue pendant une période agricole décisive.
- source_word: וְהִמְטַרְתִּי
  choice: J’ai fait pleuvoir
  rationale: Le hiphil de מטר est causatif; « faire pleuvoir » en conserve la force tout en restant idiomatique.
- source_word: עַל עִיר אֶחָת ... וְעַל עִיר אַחַת לֹא אַמְטִיר
  choice: sur une ville, mais sur une autre ville je n’ai pas fait pleuvoir
  rationale: Conserve le contraste délibéré et la répétition de « ville » présente dans le parallélisme hébreu.
- source_word: חֶלְקָה אַחַת
  choice: Une parcelle
  rationale: חֶלְקָה désigne ici une portion ou parcelle de terre; « parcelle » est précis et naturel dans ce contexte agricole.
- source_word: תִּמָּטֵר
  choice: a reçu la pluie
  rationale: Rend idiomatiquement la forme passive du verbe sans alourdir la phrase.
- source_word: וְחֶלְקָה אֲשֶׁר לֹא תַמְטִיר עָלֶיהָ
  choice: tandis que la parcelle sur laquelle il n’a pas plu
  rationale: Respecte la proposition relative hébraïque et le contraste, sans imposer un sujet divin là où la formulation grammaticale passe à « il n’a pas plu ».
- source_word: תִּיבָשׁ
  choice: s’est desséchée
  rationale: Exprime naturellement le résultat du manque de pluie appliqué à une terre agricole.
theological_decisions:
- issue: Action divine dans la répartition sélective de la pluie et de la sécheresse
  choice: Conserver l’action divine explicite à la première personne dans « je vous ai retenu la pluie », « J’ai fait pleuvoir » et « je n’ai pas fait pleuvoir ».
  alternative: Employer des formulations impersonnelles telles que « la pluie vous a été refusée » ou « la pluie est tombée ».
  rationale: L’hébreu souligne à plusieurs reprises l’intervention directe de Dieu dans ce jugement; la traduction ne doit pas l’atténuer en simple description météorologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme et le parallélisme du texte hébreu sont conservés, avec une formulation agricole précise. Aucun marqueur de note n’est requis puisqu’aucune note n’est retenue.
