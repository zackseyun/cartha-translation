  variant: modern international French
source:
  edition: WLC
  text: וְ/נָע֡וּ שְׁתַּיִם֩ שָׁלֹ֨שׁ עָרִ֜ים אֶל עִ֥יר אַחַ֛ת לִ/שְׁתּ֥וֹת מַ֖יִם וְ/לֹ֣א יִשְׂבָּ֑עוּ וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/008.yaml
  text: So two or three cities staggered to one city to drink water[a], but they were not satisfied; yet you did not return to me[b], declares Yahweh.
translation:
  language: fr
  text: Ainsi, deux ou trois villes se traînaient vers une même ville pour boire de l’eau[a], mais elles n’en avaient pas assez. Pourtant, vous n’êtes pas revenus à moi[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « allaient en chancelant ». Le verbe hébreu évoque un mouvement instable ou de-ci de-là à la recherche d’eau.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne vous êtes pas tournés de nouveau vers moi ». Chez Amos, « revenir » comporte l’idée de retourner à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: erraient
  rationale: Le verbe נוע évoque un déplacement instable ou de-ci de-là. « Erraient » rend naturellement en français la recherche désespérée d’eau sans réduire le sens à un simple déplacement.
- source_word: שְׁתַּיִם שָׁלֹשׁ עָרִים
  choice: deux ou trois villes
  rationale: La paire numérique hébraïque désigne un petit nombre indéfini. Le français idiomatique emploie « deux ou trois ».
- source_word: אֶל עִיר אַחַת
  choice: vers une seule ville
  rationale: « Vers » exprime la direction, tandis que « une seule ville » souligne la convergence de plusieurs villes vers un même lieu.
- source_word: לִשְׁתּוֹת מַיִם
  choice: pour boire de l’eau
  rationale: L’infinitif exprime directement le but du déplacement.
- source_word: וְלֹא יִשְׂבָּעוּ
  choice: mais elles n’en avaient pas assez
  rationale: שׂבע signifie être rassasié ou avoir suffisamment. Cette formulation française reste naturelle avec l’eau et conserve l’idée générale d’insuffisance sans expliciter seulement la soif.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Pourtant, vous n’êtes pas revenus à moi
  rationale: שׁוב peut exprimer à la fois le retour et le fait de se détourner de sa conduite pour revenir à Dieu. « Revenir à moi » maintient ces deux dimensions.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique solennelle rendue dans un français actuel et direct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée de שׁוב dans l’appel prophétique
  choice: vous n’êtes pas revenus à moi
  alternative: vous ne vous êtes pas tournés de nouveau vers moi
  rationale: « Revenir » préserve à la fois l’image du retour et sa portée d’appel à la repentance, sans remplacer le terme hébreu par une interprétation théologique plus explicite.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » en préserve la fonction personnelle et d’alliance.
translation_notes:
  register: Français international moderne, sobre et prophétique. La personnification hébraïque des villes est conservée; elle représente naturellement leurs habitants. La ponctuation distingue l’insuffisance d’eau du reproche divin tout en maintenant leur lien logique.
