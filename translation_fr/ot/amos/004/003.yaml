reference: Amos 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/פְרָצִ֥ים תֵּצֶ֖אנָה אִשָּׁ֣ה נֶגְדָּ֑/הּ וְ/הִשְׁלַכְתֶּ֥נָה הַ/הַרְמ֖וֹנָ/ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/003.yaml
  text: And through the breaches you will go out[a], each woman straight ahead of her[b], and you will be cast out toward Harmon,” declares Yahweh.
translation:
  language: fr
  text: Vous sortirez par les brèches, chacune droit devant elle[b], et vous serez jetées vers Harmôn[a] — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « vers la forteresse » ou « vers l’Hermon ». Le mot hébreu הַהַרְמוֹנָה est obscur, et sa désignation exacte demeure incertaine.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « chaque femme devant elle » ou « en face d’elle »; l’expression signifie probablement que chacune sortira tout droit par la brèche qui se trouve devant elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְרָצִים
  choice: par les brèches
  rationale: פְרָצִים désigne des ouvertures pratiquées dans une muraille. En français, « sortir par les brèches » exprime naturellement le passage à travers ces ouvertures.
- source_word: תֵּצֶאנָה
  choice: vous sortirez
  rationale: Le qal à la 2e personne du féminin pluriel de יצא signifie normalement « sortir ». La forme active est conservée, même si le contexte évoque une expulsion forcée.
- source_word: אִשָּׁה נֶגְדָּהּ
  choice: chacune droit devant elle
  rationale: אִשָּׁה a ici une valeur distributive, tandis que נֶגְדָּהּ indique ce qui se trouve devant chacune. La formulation suggère que chaque femme passera par la brèche située directement en face d’elle.
- source_word: וְהִשְׁלַכְתֶּנָה
  choice: et vous serez jetées
  rationale: La forme est difficile. Une tournure passive ou impersonnelle convient au contexte de déportation et préserve l’idée d’une expulsion violente sans préciser l’agent.
- source_word: הַהַרְמוֹנָה
  choice: vers Harmôn
  rationale: Le terme est obscur et pourrait être un nom de lieu. Sa translittération évite de trancher artificiellement entre plusieurs interprétations; la finale directionnelle est rendue par « vers ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule prophétique présente les paroles comme un oracle divin. Le nom propre יהוה est rendu par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme, conservé ici sous la forme française « Yahweh » plutôt que remplacé par un titre.
- issue: Sujet et voix de וְהִשְׁלַכְתֶּנָה
  choice: vous serez jetées
  alternative: vous jetterez; on vous jettera
  rationale: La morphologie et la syntaxe sont difficiles. Le passif maintient l’image d’une expulsion subie dans le contexte, sans introduire un objet ou un agent absent du texte.
translation_notes:
  register: Français international moderne, sobre et prophétique. Le féminin pluriel est maintenu, puisque le discours s’adresse aux femmes de Samarie dans le contexte immédiat. « Harmôn » conserve l’incertitude du terme hébreu au lieu de la résoudre dans le corps du texte.
