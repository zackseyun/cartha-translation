  terminology: « Le Seigneur Yahweh » rend distinctement אֲדֹנָי et יהוה. « Sainteté », « crochets » et « hameçons » conviennent, à condition de signaler que les deux derniers choix restent incertains. « Les dernières d’entre vous » conserve le féminin pluriel contextuel sans trancher en faveur de « descendance ».
