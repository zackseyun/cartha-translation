source:
  edition: WLC
  text: נִשְׁבַּ֨ע אֲדֹנָ֤/י יְהוִה֙ בְּ/קָדְשׁ֔/וֹ כִּ֛י הִנֵּ֥ה יָמִ֖ים בָּאִ֣ים עֲלֵי/כֶ֑ם וְ/נִשָּׂ֤א אֶתְ/כֶם֙ בְּ/צִנּ֔וֹת וְ/אַחֲרִיתְ/כֶ֖ן בְּ/סִיר֥וֹת דּוּגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/002.yaml
  text: 'The Lord GOD has sworn by his holiness: For behold[a], days are coming upon you when they will lift you away with hooks[b], and your posterity with fishhooks.'
translation:
  language: fr
  text: 'Le Seigneur Yahweh a juré par sa sainteté : car voici que des jours viennent contre vous où l’on vous emportera avec des crochets[a], et les dernières d’entre vous avec des hameçons[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les termes hébreux rendus par « crochets » et « hameçons » sont difficiles. Ils peuvent désigner plus généralement des instruments pointus employés pour emmener des captives, ou du matériel de pêche.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque rendue par « les dernières d’entre vous » peut aussi évoquer leur fin, leur avenir, leur postérité ou celles qui restent.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Le Seigneur Yahweh
  rationale: Rend les deux éléments du titre divin sans la répétition peu naturelle « le Seigneur SEIGNEUR » et conserve le nom propre Yahweh.
- source_word: נִשְׁבַּע
  choice: l’a juré
  rationale: Le parfait exprime un serment solennel déjà prononcé et toujours en vigueur.
- source_word: בְּקָדְשׁוֹ
  choice: par sa sainteté
  rationale: Dans cette formule de serment, קֹדֶשׁ désigne le plus naturellement la sainteté de Dieu plutôt que son sanctuaire.
- source_word: כִּי הִנֵּה
  choice: Oui
  rationale: Cette formulation française actuelle marque l’insistance et introduit vivement l’annonce, sans recourir à l’archaïsme « voici que ».
- source_word: יָמִים בָּאִים עֲלֵיכֶם
  choice: des jours viennent sur vous
  rationale: Conserve la formule prophétique et la valeur menaçante de עַל.
- source_word: וְנִשָּׂא אֶתְכֶם
  choice: où l’on vous emportera
  rationale: Le verbe au singulier peut avoir ici un sujet indéfini; « l’on » le rend naturellement tout en exprimant la déportation forcée.
- source_word: בְּצִנּוֹת
  choice: avec des crochets
  rationale: Le parallélisme avec les engins de pêche favorise le sens de crochets ou d’instruments barbelés, malgré la difficulté du terme.
- source_word: וְאַחֲרִיתְכֶן
  choice: les dernières d’entre vous
  rationale: Le nom peut évoquer la fin, l’avenir ou ce qui reste. Dans ce contexte de déportation totale, l’expression désigne probablement celles qui resteront jusqu’à la fin, sans imposer l’idée de descendance.
- source_word: בְּסִירוֹת דּוּגָה
  choice: avec des hameçons
  rationale: La locution difficile renvoie vraisemblablement à du matériel de pêche; « hameçons » maintient le parallèle concret avec les crochets.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: Le Seigneur Yahweh
  alternative: Le Seigneur DIEU
  rationale: « Yahweh » préserve le nom divin présent dans l’hébreu, tandis que « Seigneur » rend אֲדֹנָי; cette solution évite aussi de confondre le nom propre avec le titre générique « Dieu ».
- issue: Identité de אַחֲרִיתְכֶן
  choice: les dernières d’entre vous
  alternative: votre descendance
  rationale: Le contexte menace les femmes de Samarie d’un enlèvement complet. Le texte peut viser celles qui restent ou se trouvent à la fin; traduire par « descendance » résoudrait trop nettement une ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et direct. Le pluriel féminin de « les dernières d’entre vous » reflète les destinataires féminines du contexte. La formulation conserve l’image brutale et l’ambiguïté du texte sans archaïsmes inutiles.
