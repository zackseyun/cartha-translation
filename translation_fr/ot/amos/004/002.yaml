    issue: « l’a juré » a un antécédent implicite absent du texte source.
    rationale: Le parfait נִשְׁבַּע signifie simplement « a juré / a fait serment ». En français, le pronom objet de « l’a juré » laisse entendre qu’un contenu précis du serment a déjà été exprimé.
  - severity: low
