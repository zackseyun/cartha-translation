  source_fidelity: 'Le sens général est fidèlement rendu : le titre divin, le serment, l’annonce de jugement et l’enlèvement forcé sont conservés. Toutefois, « l’a juré » introduit en français un objet pronominal absent de l’hébreu ; « a juré par sa sainteté » correspond plus directement à נִשְׁבַּע ... בְּקָדְשׁוֹ. « Voici que » rend naturellement כִּי הִנֵּה sans perdre son effet déictique. « Contre vous » exprime plus idiomatiquement la menace portée par עֲלֵיכֶם. L’ambiguïté de אַחֲרִיתְכֶן et celle des deux termes d’équipement sont explicitement maintenues en note.'
