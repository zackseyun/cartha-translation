  source_fidelity: 'Le sens général est fidèle : le jugement est comparé à la destruction de Sodome et Gomorrhe, les rescapés à un tison sauvé du feu, et le refrain du non-retour à Yahweh est bien rendu. « Certains d’entre vous » est une explicitation interprétative possible de בָכֶם, mais elle convient à condition que l’alternative non partitive soit clairement signalée. « Renversé » appliqué à des personnes est toutefois moins précis et moins idiomatique en français pour le jugement destructeur visé.'
