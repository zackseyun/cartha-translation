  terminology: « Yahweh », « revenir à moi », « Sodome et Gomorrhe » et « tison » sont appropriés. « Déclaration de Yahweh » restitue correctement la formule prophétique, bien que sa place après un tiret soit une convention de présentation plutôt qu’une nécessité syntaxique.
