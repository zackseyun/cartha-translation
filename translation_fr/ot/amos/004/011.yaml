source:
  edition: WLC
  text: הָפַ֣כְתִּי בָ/כֶ֗ם כְּ/מַהְפֵּכַ֤ת אֱלֹהִים֙ אֶת סְדֹ֣ם וְ/אֶת עֲמֹרָ֔ה וַ/תִּהְי֕וּ כְּ/א֖וּד מֻצָּ֣ל מִ/שְׂרֵפָ֑ה וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/011.yaml
  text: I overthrew some among you as God overthrew Sodom and Gomorrah[a], and you became like a brand snatched from the burning; yet you did not return to me[c][b], declares Yahweh.
translation:
  language: fr
  text: J’ai anéanti certains d’entre vous[a], comme Dieu a anéanti Sodome et Gomorrhe[b]. Vous êtes alors devenus comme un tison tiré du brasier[c]. Pourtant, vous n’êtes pas revenus à moi — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai anéanti parmi vous » ; la préposition hébraïque n’oblige pas à exprimer explicitement le sens partitif « certains d’entre vous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme le renversement de Dieu de Sodome et Gomorrhe », c’est-à-dire le renversement que Dieu leur a fait subir.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « comme un morceau de bois retiré des flammes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַכְתִּי
  choice: J’ai renversé
  rationale: Le verbe הפך évoque ici un renversement destructeur et fait écho au jugement de Sodome et Gomorrhe. « Renversé » conserve ce lien lexical sans réduire le verbe à une simple destruction.
- source_word: בָכֶם
  choice: certains d’entre vous
  rationale: 'La préposition ב avec le suffixe pluriel peut recevoir ici un sens partitif : le jugement a frappé des membres du peuple. Une note conserve toutefois la formulation moins explicite « parmi vous ».'
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: comme Dieu a renversé
  rationale: La tournure nominale hébraïque, littéralement « comme le renversement de Dieu », désigne naturellement le renversement accompli par Dieu. La formulation verbale est plus naturelle en français.
- source_word: סְדֹם וְאֶת עֲמֹרָה
  choice: Sodome et Gomorrhe
  rationale: Formes françaises traditionnelles et immédiatement reconnaissables de ces noms de lieux.
- source_word: וַתִּהְיוּ
  choice: Vous êtes alors devenus
  rationale: La forme verbale présente l’état qui résulte du jugement précédent ; « alors » rend clairement cet enchaînement sans l’alourdir.
- source_word: כְּאוּד
  choice: comme un tison
  rationale: אוּד désigne un morceau de bois brûlant ou à demi brûlé. « Tison » exprime précisément cette image en français courant.
- source_word: מֻצָּל מִשְּׂרֵפָה
  choice: arraché à l’incendie
  rationale: Le participe passif de נצל exprime une délivrance hors du danger, tandis que שְׂרֵפָה désigne une combustion ou un embrasement. « Arraché à l’incendie » restitue la vigueur de l’image.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Pourtant, vous n’êtes pas revenus à moi
  rationale: שׁוב avec עַד exprime le retour vers Dieu dans toute sa portée relationnelle et spirituelle. « Revenir à moi » préserve cette ampleur mieux que le seul verbe « se repentir ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: La formule prophétique solennelle est rendue de façon concise, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le nom divin. Sa translittération préserve sa fonction de nom propre sans lui substituer un titre.
- issue: Portée de שׁוב dans le contexte prophétique
  choice: vous n’êtes pas revenus à moi
  alternative: vous ne vous êtes pas repentis devant moi
  rationale: Le verbe évoque un retour à Dieu qui comprend la repentance mais ne s’y réduit pas ; la traduction garde donc l’image relationnelle du mouvement vers Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image concrète du tison et le refrain prophétique du retour à Dieu. « Déclaration de Yahweh » maintient la solennité de la formule finale.
