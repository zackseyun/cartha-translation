source:
  edition: WLC
  text: וְ/גַם אֲנִי֩ נָתַ֨תִּי לָ/כֶ֜ם נִקְי֤וֹן שִׁנַּ֨יִם֙ בְּ/כָל עָ֣רֵי/כֶ֔ם וְ/חֹ֣סֶר לֶ֔חֶם בְּ/כֹ֖ל מְקוֹמֹֽתֵי/כֶ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/006.yaml
  text: And I also gave you cleanness of teeth in all your cities[a], and lack of bread in all your places; yet you did not return to me, declares Yahweh.
translation:
  language: fr
  text: Moi aussi, je vous ai donné la propreté des dents[a] dans toutes vos villes, et le manque de pain dans tous vos lieux. Pourtant, vous n’êtes pas revenus à moi — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « propreté des dents » : image de dents qui restent propres parce qu’il n’y a rien à manger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Moi aussi
  rationale: Rend la valeur additive et l’emphase du pronom explicite dans un ordre naturel en français.
- source_word: נָתַתִּי לָכֶם
  choice: je vous ai donné
  rationale: Le passé composé convient au rappel prophétique de jugements déjà infligés et conserve la formulation directe de l’hébreu.
- source_word: נִקְיוֹן שִׁנַּיִם
  choice: des dents nettes
  rationale: Préserve l’image concrète de dents restées propres faute de nourriture; la note et le parallèle avec le manque de pain en explicitent le sens.
- source_word: בְּכָל עָרֵיכֶם
  choice: dans toutes vos villes
  rationale: Rendu locatif direct de עָרִים.
- source_word: וְחֹסֶר לֶחֶם
  choice: et le manque de pain
  rationale: Conserve les éléments lexicaux concrets sans les réduire au terme interprétatif « famine ».
- source_word: בְּכֹל מְקוֹמֹתֵיכֶם
  choice: dans tous vos lieux
  rationale: Maintient la portée générale de מְקוֹמוֹת et la distinction avec les villes du membre précédent.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Pourtant, vous n’êtes pas revenus à moi
  rationale: Exprime le retour vers Dieu avec sa portée relationnelle et d’alliance, sans le limiter à un repentir intérieur.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique nominale et conserve le nom divin exprimé par le tétragramme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Traitement de l’expression נִקְיוֹן שִׁנַּיִם
  choice: Conserver l’image « des dents nettes » dans le texte principal
  alternative: la faim; rien à manger
  rationale: Le parallélisme avec « le manque de pain » rend l’image intelligible, tandis qu’une paraphrase ferait disparaître sa force rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. L’image hébraïque est conservée, avec une note explicative; la répétition distributive « toutes… tous… » maintient le parallélisme du verset.
