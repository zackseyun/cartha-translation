  to: Moi aussi, je vous ai donné la propreté des dents[a] dans toutes vos villes, et le manque de pain dans tous vos lieux. Pourtant, vous n’êtes pas revenus à moi — déclaration de Yahweh.
  rationale: La révision se limite à l’idiome hébreu נִקְיוֹן שִׁנַּיִם. « La propreté des dents » reproduit son caractère nominal et son image de manière plus exacte que « des dents nettes », tout en évitant une expression française pouvant suggérer une bonne hygiène dentaire. La note conserve l’explication non interprétative nécessaire.
