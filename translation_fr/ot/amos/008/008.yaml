  text: הַ֤/עַל זֹאת֙ לֹֽא תִרְגַּ֣ז הָ/אָ֔רֶץ וְ/אָבַ֖ל כָּל יוֹשֵׁ֣ב בָּ֑/הּ וְ/עָלְתָ֤ה כָ/אֹר֙ כֻּלָּ֔/הּ וְ/נִגְרְשָׁ֥ה ו/נשקה כִּ/יא֥וֹר מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/008.yaml
  text: Because of this[a], will not the land tremble, and every one who dwells in it mourn? All of it will rise like the Nile[b]; it will be driven along and sink like the Nile of Egypt.
translation:
  language: fr
  text: 'À cause de cela[a], le pays ne tremblera-t-il pas, et tous ceux qui y habitent ne seront-ils pas en deuil ? Le pays tout entier montera comme le Nil[b] ; il sera emporté, puis s’affaissera comme le Nil d’Égypte.


    [a] Ou « la terre ». Le mot hébreu peut désigner soit un pays, soit la terre ; ici, « le pays » est retenu en raison de la mention de ses habitants.


    [b] Littéralement : « comme le Nil […] comme le Nil d’Égypte ». La montée et l’abaissement du Nil fournissent ici l’image d’un bouleversement violent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre ». Le mot hébreu peut désigner soit un pays, soit la terre ; ici, « le pays » est retenu en raison de la mention de ses habitants.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme le Nil […] comme le Nil d’Égypte ». La montée et l’abaissement du Nil fournissent ici l’image d’un bouleversement violent.'
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל זֹאת
  choice: À cause de cela
  rationale: Cette formulation française naturelle conserve la valeur causale de עַל accompagné du démonstratif.
- source_word: תִרְגַּז
  choice: ne tremblera-t-il pas
  rationale: רגז peut exprimer le tremblement, l’ébranlement ou l’agitation. Avec le pays comme sujet, « trembler » rend à la fois le bouleversement physique et l’effroi associé au jugement.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ peut signifier « pays » ou « terre ». Le contexte immédiat vise le territoire jugé et ses habitants ; l’autre sens est conservé en note.
- source_word: וְאָבַל כָּל יוֹשֵׁב בָּהּ
  choice: et tous ceux qui y habitent ne seront-ils pas en deuil
  rationale: אבל désigne le fait de mener deuil. La reprise de la tournure interrogative en français rend clairement la portée de la question rhétorique sur les deux propositions.
- source_word: וְעָלְתָה כָאֹר כֻּלָּהּ
  choice: Il montera tout entier comme le Nil
  rationale: Le pronom renvoie au pays, de genre masculin en français, tandis que כֻּלָּהּ indique sa totalité. אֹר/יְאֹר désigne ici le Nil, explicité par la mention de l’Égypte.
- source_word: וְנִגְרְשָׁה
  choice: il sera agité
  rationale: Le niphal de גרשׁ décrit ici un mouvement imposé et tumultueux dans l’image de la crue. « Sera agité » évite de suggérer une expulsion littérale du pays tout en gardant l’idée de bouleversement.
- source_word: וְנשקה
  choice: puis s’affaissera
  rationale: Dans le parallélisme avec la montée du Nil, la forme transmise décrit l’abaissement ou la décrue. « S’affaissera » convient à la fois au pays figuré et au mouvement descendant des eaux.
- source_word: כִּיאוֹר מִצְרָיִם
  choice: comme le Nil d’Égypte
  rationale: La formulation identifie explicitement le fleuve dont la crue et la décrue fournissent l’image.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. La question rhétorique est rendue sans l’aplatir en affirmation. L’image poétique du pays qui monte et s’affaisse comme le Nil est conservée, sans la rationaliser.
