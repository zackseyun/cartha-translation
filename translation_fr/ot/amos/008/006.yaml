source:
  edition: WLC
  text: לִ/קְנ֤וֹת בַּ/כֶּ֨סֶף֙ דַּלִּ֔ים וְ/אֶבְי֖וֹן בַּ/עֲב֣וּר נַעֲלָ֑יִם וּ/מַפַּ֥ל בַּ֖ר נַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/006.yaml
  text: to buy the poor for silver[a], and the needy for a pair of sandals, and sell the sweepings of the grain.
translation:
  language: fr
  text: afin d’acheter les pauvres pour de l’argent, les indigents pour une paire de sandales, et de vendre les déchets du grain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rebuts du grain » ou « le grain tombé ». L’hébreu désigne probablement des restes de grain de qualité inférieure vendus comme marchandise.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְנוֹת
  choice: afin d’acheter
  rationale: L’infinitif construit exprime ici le but poursuivi par les marchands dans la continuité du verset précédent. « Acheter » garde le sens économique direct et suggère l’asservissement pour dettes sans l’expliciter au-delà du texte.
- source_word: בַּכֶּסֶף
  choice: pour de l’argent
  rationale: La préposition marque le prix. En français moderne, « argent » est naturel tout en conservant l’ambivalence du terme hébreu, qui peut désigner le métal argent ou la monnaie.
- source_word: דַּלִּים
  choice: les pauvres
  rationale: Dans ce contexte d’injustice économique, דַּלִּים désigne les personnes pauvres et socialement vulnérables.
- source_word: וְאֶבְיוֹן
  choice: les indigents
  rationale: « Indigents » distingue אֶבְיוֹן de דַּלִּים tout en préservant le parallélisme entre deux catégories proches de personnes démunies.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: pour une paire de sandales
  rationale: Le duel נַעֲלָיִם est rendu idiomatiquement par « une paire de sandales »; l’expression souligne le prix dérisoire auquel les indigents sont réduits.
- source_word: וּמַפַּל בַּר
  choice: et de vendre jusqu’aux déchets du grain
  rationale: מַפַּל désigne vraisemblablement ce qui tombe, les rebuts ou résidus de qualité inférieure; בַּר signifie ici « grain ». « Jusqu’aux » rend naturellement l’intensification implicite de cette ultime pratique cupide.
- source_word: נַשְׁבִּיר
  choice: de vendre
  rationale: Le hiphil de שׁבר signifie vendre ou commercialiser du grain dans ce contexte. La coordination avec « afin d’acheter » appelle naturellement l’infinitif français.
theological_decisions:
- issue: Nature de l’achat des pauvres et des indigents
  choice: Conserver la formulation économique « acheter » sans préciser le mécanisme
  alternative: Expliciter « réduire en esclavage pour dettes »
  rationale: Le contexte suggère fortement l’asservissement économique, mais le verset ne nomme pas expressément l’esclavage; la traduction préserve donc cette tension sans imposer une explication.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme poétique est conservé, avec un vocabulaire économique clair. « Indigents » évite de répéter « pauvres » et maintient la distinction lexicale de l’hébreu.
