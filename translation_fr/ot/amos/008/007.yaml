source:
  edition: WLC
  text: נִשְׁבַּ֥ע יְהוָ֖ה בִּ/גְא֣וֹן יַעֲקֹ֑ב אִם אֶשְׁכַּ֥ח לָ/נֶ֖צַח כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/007.yaml
  text: 'Yahweh has sworn by the pride of Jacob: Surely I will never forget any of their deeds[a][b].'
translation:
  language: fr
  text: 'Yahvé a juré par l’orgueil de Jacob[a] : « Je n’oublierai jamais aucun de leurs actes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la gloire de Jacob » ou « par la grandeur de Jacob ». L’expression hébraïque peut désigner, avec ironie, ce dont Jacob tire orgueil, ou peut-être Dieu comme la véritable gloire de Jacob.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « si j’oublie pour toujours tous leurs actes ». Il s’agit d’une formule de serment qui signifie : « Je n’oublierai jamais aucun de leurs actes. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: l’a juré
  rationale: Le nifal de שׁבע exprime ici l’action de prêter serment. Le passé composé convient à cette déclaration prophétique solennelle, et le pronom « l’ » annonce naturellement le contenu du serment.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé par un titre.
- source_word: בִּגְאוֹן
  choice: par l’orgueil de
  rationale: גָּאוֹן peut désigner l’orgueil, la gloire, la grandeur ou la majesté. « Orgueil » est direct et conserve ici la possibilité d’une nuance ironique, sans exclure les autres interprétations signalées en note.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est conservé; il désigne ici le peuple dans le langage prophétique.
- source_word: אִם
  choice: Je n’oublierai jamais
  rationale: Après une formule de serment, אִם introduit une condition imprécatoire elliptique, littéralement « si j’oublie… ». En français, la négation catégorique rend naturellement la force réelle du serment.
- source_word: אֶשְׁכַּח
  choice: j’oublierai
  rationale: La première personne renvoie à Yahvé, qui énonce lui-même le contenu du serment; le futur convient à cet engagement.
- source_word: לָנֶצַח
  choice: jamais
  rationale: Dans une proposition négative portant sur l’oubli, « jamais » rend idiomatiquement le sens de « pour toujours ».
- source_word: כָּל
  choice: aucun
  rationale: Sous la négation, « aucun de » restitue naturellement la portée distributive de כָּל.
- source_word: מַעֲשֵׂיהֶם
  choice: leurs actes
  rationale: מַעֲשֶׂה désigne ce qui est fait, un acte ou une action. « Actes » est naturel dans ce contexte de jugement et évite d’ajouter une qualification absente de l’hébreu.
theological_decisions:
- issue: Sens de « l’orgueil de Jacob » dans la formule de serment
  choice: Conserver « l’orgueil de Jacob » sans explicitation dans le texte.
  alternative: « la gloire de Jacob » ou « la majesté de Jacob », éventuellement comme désignation de Dieu lui-même.
  rationale: 'L’expression hébraïque reste ambiguë : elle peut viser ironiquement ce dont Jacob s’enorgueillit ou désigner Dieu comme sa véritable gloire. La traduction ne tranche pas cette tension.'
- issue: Forme elliptique du serment
  choice: Exprimer sa portée par « Je n’oublierai jamais… »
  alternative: Traduire littéralement « si jamais j’oublie… »
  rationale: L’hébreu emploie une formule d’auto-imprécation abrégée. Une traduction strictement conditionnelle serait obscure ou incomplète en français; la formulation retenue communique la certitude du serment, tandis que la note en préserve la forme.
translation_notes:
  register: Français moderne, clair et digne. La tournure « l’a juré » introduit naturellement le discours direct et maintient la solennité prophétique. Les notes préservent l’ambiguïté lexicale de גָּאוֹן et la forme hébraïque elliptique du serment.
