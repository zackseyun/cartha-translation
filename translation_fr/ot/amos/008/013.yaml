    rationale: Le terme « vierges » rend déjà la catégorie désignée par בְּתוּלֹת. L’ajout de « jeunes filles » est explicatif mais pesant et moins élégant dans ce verset concis.
  - severity: low
    issue: Nuance de « s’évanouiront »
    rationale: Le verbe peut évoquer plus précisément une perte de connaissance. « Défailliront » conserve mieux l’amplitude de תִּתְעַלַּפְנָה, qui peut désigner le fait de devenir faible ou de défaillir.
