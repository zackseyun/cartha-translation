  yaml_path: translation/ot/amos/008/013.yaml
  text: In that day the beautiful virgins and the young men will faint from thirst[a].
translation:
  language: fr
  text: En ce jour-là, les belles vierges et les jeunes hommes défailliront de soif[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’évanouiront de soif ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique qui conserve la valeur démonstrative de l’hébreu dans un français naturel.
- source_word: תִּתְעַלַּפְנָה
  choice: s’évanouiront
  rationale: Le hitpael de עלף exprime le fait de défaillir ou de perdre connaissance sous l’effet de la faiblesse; « s’évanouiront » est clair et idiomatique.
- source_word: הַבְּתוּלֹת
  choice: jeunes filles vierges
  rationale: Cette formulation préserve la spécificité lexicale de בְּתוּלָה tout en restant plus naturelle en français moderne que le substantif isolé « vierges ».
- source_word: הַיָּפוֹת
  choice: belles
  rationale: Rend directement l’adjectif qui qualifie les jeunes filles, dans un registre courant et digne.
- source_word: וְהַבַּחוּרִים
  choice: et les jeunes hommes
  rationale: בָּחוּר désigne couramment des hommes jeunes, dans la force de l’âge; cette traduction est naturelle et précise.
- source_word: בַּצָּמָא
  choice: de soif
  rationale: La préposition indique ici la cause de la défaillance; « de soif » est la tournure française idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve le contraste entre la beauté et la vigueur de la jeunesse, d’une part, et leur défaillance causée par la soif, d’autre part.
