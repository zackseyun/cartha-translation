  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : la formule temporelle, les deux groupes et la cause de leur défaillance sont bien rendus. Toutefois, « jeunes filles vierges » alourdit inutilement le texte et associe deux expressions françaises dont l’une suffit à rendre בְּתוּלֹת.'
