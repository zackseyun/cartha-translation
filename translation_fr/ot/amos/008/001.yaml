source:
  edition: WLC
  text: כֹּ֥ה הִרְאַ֖/נִי אֲדֹנָ֣/י יְהוִ֑ה וְ/הִנֵּ֖ה כְּל֥וּב קָֽיִץ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], a basket of summer fruit.'
translation:
  language: fr
  text: 'Voici ce que le Seigneur Yahweh me fit voir : une corbeille de fruits d’été[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une corbeille de fruits mûrs ». L’hébreu dit littéralement « fruits d’été », expression qui prépare un jeu de sons avec le mot « fin » au verset suivant.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Voici ce que
  rationale: Cette tournure introduit naturellement le contenu de la vision tout en conservant la valeur démonstrative de l’hébreu.
- source_word: הִרְאַנִי
  choice: me fit voir
  rationale: Le hiphil de ראה signifie « faire voir, montrer ». « Me fit voir » convient au registre prophétique et garde la nuance causative.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom divin יהוה et évite la répétition artificielle « le Seigneur, le SEIGNEUR ».
- source_word: וְהִנֵּה
  choice: — présentation directe après les deux-points
  rationale: 'La construction française avec « Voici ce que… : » présente directement l’objet soudainement aperçu sans alourdir la phrase par un second « voici ».'
- source_word: כְּלוּב
  choice: corbeille
  rationale: Dans le contexte des fruits, le mot désigne un récipient ou panier. « Corbeille » est naturel en français pour des fruits.
- source_word: קָיִץ
  choice: fruits d’été
  rationale: Le terme désigne les fruits récoltés en été. Cette traduction préserve le mot « été », important pour le jeu sonore hébreu avec קֵץ, « fin », au verset suivant.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre « Seigneur » au nom propre divin. Garder « Yahweh » rend cette distinction visible sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise comme la formule visionnaire hébraïque. Le double présentatif potentiel de כֹּה et וְהִנֵּה est rendu par une seule construction française fluide avec deux-points.
