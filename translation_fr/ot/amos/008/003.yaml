source:
  edition: WLC
  text: וְ/הֵילִ֜ילוּ שִׁיר֤וֹת הֵיכָל֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה רַ֣ב הַ/פֶּ֔גֶר בְּ/כָל מָק֖וֹם הִשְׁלִ֥יךְ הָֽס־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/003.yaml
  text: And the songs of the palace will become wailing in that day[a], declares the Lord GOD. Many will be the corpses[b]; in every place they will throw them out—silence!
translation:
  language: fr
  text: « En ce jour-là, les chants du palais se changeront en lamentations[a], déclare le Seigneur Yahweh. Les cadavres seront nombreux ; partout, on les jettera. Silence ![b] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les chants du temple se changeront en lamentations ». Le mot hébreu הֵיכָל peut désigner soit un palais, soit un temple.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu הָס est une injonction brusque : « Chut ! » ou « Taisez-vous ! » Elle exprime probablement l’effroi ou la stupeur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵילִילוּ
  choice: se changeront en lamentations
  rationale: Le hiphil de ילל, avec « les chants » pour sujet, évoque ici des chants transformés en cris de deuil. Cette formulation naturelle en français conserve ce contraste saisissant.
- source_word: שִׁירוֹת
  choice: les chants
  rationale: Le pluriel concret désigne des chants plutôt que la musique au sens abstrait.
- source_word: הֵיכָל
  choice: du palais
  rationale: Le mot peut désigner un palais ou un temple. « Palais » convient au contexte du jugement frappant les puissants et la vie publique, sans exclure l'autre sens, signalé en note.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique temporelle courante, rendue dans un français actuel et solennel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: « Déclare » rend naturellement la formule prophétique נְאֻם. Le titre « Seigneur » traduit אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה.
- source_word: רַב הַפֶּגֶר
  choice: Les cadavres seront nombreux
  rationale: La tournure existentielle française exprime clairement l'adjectif quantitatif רַב appliqué au nom collectif singulier « cadavre » en hébreu.
- source_word: בְּכָל מָקוֹם
  choice: partout
  rationale: Équivalent français idiomatique de « en tout lieu », qui conserve la portée distributive de l'expression.
- source_word: הִשְׁלִיךְ
  choice: on les jettera
  rationale: Bien que la forme verbale soit au masculin singulier, son emploi est vraisemblablement impersonnel. « On » rend cette indétermination, tandis que « les » reprend les cadavres, objet sous-entendu en hébreu.
- source_word: הָס
  choice: Silence !
  rationale: Cette interjection abrupte ordonne le silence et suggère l'effroi devant l'ampleur de la mort.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. « Le Seigneur Yahweh » maintient cette distinction et rend visible le nom divin sans produire la répétition « le Seigneur, le SEIGNEUR ».
- issue: Sens de הֵיכָל
  choice: palais dans le texte principal
  alternative: temple
  rationale: Les deux sens sont lexicalement possibles. Le contexte sociopolitique favorise légèrement « palais », mais l'ambiguïté réelle est conservée dans une note plutôt que tranchée de manière doctrinale.
translation_notes:
  register: Français international moderne, digne et prophétique. La syntaxe reste directe et l'interjection finale conserve la rupture brutale du texte hébreu.
