id: AMO.8.12
reference: Amos 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָעוּ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/צָּפ֖וֹן וְ/עַד מִזְרָ֑ח יְשֽׁוֹטְט֛וּ לְ/בַקֵּ֥שׁ אֶת דְּבַר יְהוָ֖ה וְ/לֹ֥א יִמְצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/012.yaml
  text: They will wander from sea to sea[a], and from north to east; they will roam about seeking the word of Yahweh[b], but they will not find it.
translation:
  language: fr
  text: Ils erreront d’une mer à l’autre et du nord jusqu’à l’est. Ils iront en tous sens[a] pour chercher la parole de Yahweh[b], mais ils ne la trouveront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils courront çà et là ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire un message ou une révélation venant de Dieu.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנָעוּ
  choice: ils erreront
  rationale: Le verbe נוע peut exprimer une marche errante ou chancelante. Ici, la recherche désespérée à travers plusieurs régions favorise « erreront », sans imposer une image d’ivresse.
- source_word: מִיָּם עַד יָם
  choice: d’une mer à l’autre
  rationale: Cette formulation française naturelle conserve l’expression géographique hébraïque et son idée d’une vaste étendue.
- source_word: וּמִצָּפוֹן וְעַד מִזְרָח
  choice: et du nord jusqu’à l’est
  rationale: מִזְרָח désigne l’est, littéralement le levant. La traduction garde l’enchaînement directionnel inhabituel du texte sans tenter de le normaliser.
- source_word: יְשֹׁטְטוּ
  choice: ils iront en tous sens
  rationale: Le verbe évoque des déplacements répétés, çà et là, dans une recherche agitée. « Iront en tous sens » est idiomatique et garde cette nuance.
- source_word: לְבַקֵּשׁ
  choice: pour chercher
  rationale: L’infinitif exprime le but de leurs déplacements.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: דָּבָר peut désigner une parole ou un message. Dans ce contexte prophétique, « la parole de Yahweh » reste transparente tout en permettant de comprendre une révélation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְלֹא יִמְצָאוּ
  choice: mais ils ne la trouveront pas
  rationale: « Mais » rend naturellement le contraste entre leur recherche et son échec. Le pronom « la » reprend explicitement « la parole ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le Tétragramme. « Yahweh » conserve le nom personnel, tandis que « le Seigneur » serait une substitution traditionnelle par un titre.
- issue: Sens de דְּבַר יְהוָה
  choice: la parole de Yahweh
  alternative: le message de Yahweh
  rationale: « Parole » préserve l’expression prophétique traditionnelle et la largeur sémantique de דָּבָר; la note précise qu’il s’agit ici d’un message ou d’une révélation venant de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des déplacements est conservé, ainsi que l’étrange trajet « du nord jusqu’à l’est », sans harmonisation géographique.
