source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר כְּל֣וּב קָ֑יִץ וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בָּ֤א הַ/קֵּץ֙ אֶל עַמִּ֣/י יִשְׂרָאֵ֔ל לֹא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/002.yaml
  text: And he said[a], “What do you see, Amos?” And I said, “A basket of summer fruit.” Then Yahweh said to me, “The end has come upon my people Israel[b]; I will not again pass by them.”
translation:
  language: fr
  text: 'Il dit : « Que vois-tu, Amos ? » Je répondis : « Une corbeille de fruits d’été[a]. » Alors Yahweh me dit : « La fin est arrivée pour mon peuple Israël ; je ne passerai plus à côté de lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu, « fruits d’été » (qayits) ressemble par le son à « la fin » (qets) : ce jeu de mots relie la vision à l’annonce du jugement.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « je ne l’épargnerai plus » ou « je ne passerai plus par-dessus lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol de אמר introduit directement la parole. « Il dit » conserve la sobriété du récit hébreu sans préciser davantage la succession temporelle.
- source_word: מָה אַתָּה רֹאֶה
  choice: Que vois-tu
  rationale: Cette formulation française naturelle rend le participe רֹאֶה avec l’immédiateté de la vision en cours.
- source_word: עָמוֹס
  choice: Amos
  rationale: Le nom propre est rendu selon sa forme française usuelle.
- source_word: כְּלוּב קָיִץ
  choice: une corbeille de fruits d’été
  rationale: כְּלוּב désigne ici un contenant de type panier ou corbeille, et קָיִץ des fruits d’été. Cette traduction permet aussi d’expliquer le jeu sonore hébreu avec קֵץ, « fin ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme nom divin plutôt que remplacé par un titre.
- source_word: בָּא הַקֵּץ
  choice: La fin est arrivée
  rationale: Le parfait בָּא présente prophétiquement l’arrivée de la fin comme accomplie. L’article de הַקֵּץ justifie « la fin ».
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: pour mon peuple Israël
  rationale: Dans ce contexte de jugement, « pour » exprime naturellement en français que la fin atteint Israël, sans réduire אֶל à une simple direction spatiale.
- source_word: לֹא אוֹסִיף עוֹד
  choice: je ne … plus
  rationale: La tournure française exprime la cessation définitive de l’action répétée indiquée par l’idiome hébreu.
- source_word: עֲבוֹר לוֹ
  choice: passerai … à côté de lui
  rationale: Cette formulation maintient l’image concrète du verbe עבר et reprend au singulier le collectif « mon peuple ». Le sens possible « épargner » est signalé en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. Le transcrire préserve cette donnée au lieu de lui substituer un titre.
- issue: Portée de l’expression עֲבוֹר לוֹ dans l’annonce du jugement
  choice: je ne passerai plus à côté de lui
  alternative: je ne l’épargnerai plus
  rationale: Le choix principal conserve la métaphore et son ambiguïté, tandis que la note donne le sens contextuel probable sans l’imposer dans le corps du texte.
- issue: Valeur prophétique de בָּא הַקֵּץ
  choice: La fin est arrivée
  alternative: La fin arrive
  rationale: Le parfait hébreu présente l’événement annoncé comme déjà advenu dans la déclaration prophétique ; le français au passé composé maintient cette force.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct et sobre. « Corbeille » est courant sans être familier ; « fruits d’été » conserve la donnée lexicale nécessaire au jeu de mots. La métaphore finale demeure dans le texte principal, avec son interprétation probable en note.
