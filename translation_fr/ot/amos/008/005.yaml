  text: לֵ/אמֹ֗ר מָתַ֞י יַעֲבֹ֤ר הַ/חֹ֨דֶשׁ֙ וְ/נַשְׁבִּ֣ירָה שֶּׁ֔בֶר וְ/הַ/שַּׁבָּ֖ת וְ/נִפְתְּחָה בָּ֑ר לְ/הַקְטִ֤ין אֵיפָה֙ וּ/לְ/הַגְדִּ֣יל שֶׁ֔קֶל וּ/לְ/עַוֵּ֖ת מֹאזְנֵ֥י מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/005.yaml
  text: saying[a], “When will the new moon be over, so that we may sell grain, and the Sabbath, so that we may offer wheat for sale—making the ephah small and the shekel large[b], and distorting deceitful scales?”
translation:
  language: fr
  text: 'ils disent[a] : « Quand la nouvelle lune sera-t-elle passée afin que nous vendions du grain, et quand le sabbat sera-t-il passé afin que nous mettions du blé en vente, en réduisant l’épha, en alourdissant le sicle et en faussant des balances frauduleuses ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le mois ». Ici, le contexte favorise la célébration de la nouvelle lune plutôt que le mois calendaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: ils disent
  rationale: Le participe introduit les paroles des marchands visés dans le contexte. Le présent français s’intègre naturellement à la dénonciation prophétique.
- source_word: הַחֹדֶשׁ
  choice: la nouvelle lune
  rationale: Dans ce contexte religieux et commercial, le terme désigne vraisemblablement la célébration de la nouvelle lune, dont les marchands attendent impatiemment la fin, plutôt que le mois abstrait.
- source_word: וְנַשְׁבִּירָה שֶּׁבֶר
  choice: pour que nous vendions du grain
  rationale: Le hiphil de שׁבר peut signifier vendre des céréales ou des provisions. Cette formulation est claire et idiomatique en français.
- source_word: וְהַשַּׁבָּת
  choice: et le sabbat
  rationale: Le terme désigne le jour sacré hebdomadaire dont ces marchands souhaitent la fin afin de reprendre leur commerce.
- source_word: וְנִפְתְּחָה בָּר
  choice: pour que nous mettions du blé en vente
  rationale: L’expression évoque l’ouverture des réserves ou des sacs pour la vente. « Mettre en vente » en exprime naturellement la portée commerciale, tandis que « blé » conserve la nuance concrète possible de בָּר.
- source_word: לְהַקְטִין אֵיפָה
  choice: Nous réduirons l’épha
  rationale: L’épha est une mesure de capacité pour les matières sèches. Garder le nom de l’unité préserve l’image concrète de la fraude consistant à livrer moins de produit.
- source_word: וּלְהַגְדִּיל שֶׁקֶל
  choice: et alourdirons le sicle
  rationale: 'Le sicle fonctionne ici comme poids servant à calculer le paiement. « Alourdir » rend concrètement la fraude : exiger davantage en échange d’une quantité réduite.'
- source_word: וּלְעַוֵּת מֹאזְנֵי מִרְמָה
  choice: et nous fausserons les balances pour tromper
  rationale: « Fausser » rend en français naturel l’action de tordre ou de pervertir le fonctionnement des balances. La finale explicite la valeur attributive de מִרְמָה sans perdre l’idée de fraude.
theological_decisions:
- issue: Sens des temps sacrés dans la dénonciation de la cupidité
  choice: Rendre חֹדֶשׁ par « nouvelle lune » et שַׁבָּת par « sabbat », comme deux observances religieuses reconnues.
  alternative: Comprendre חֹדֶשׁ comme le simple mois calendaire.
  rationale: Le reproche prophétique vise des commerçants qui supportent mal l’interruption de leurs affaires par les temps sacrés. Le sens cultuel convient donc mieux au parallélisme avec le sabbat, sans ajouter de doctrine étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve l’impatience et le cynisme des marchands. Les unités anciennes « épha » et « sicle » sont maintenues afin de préserver le parallélisme et l’image concrète de la fraude, avec une note explicative.
