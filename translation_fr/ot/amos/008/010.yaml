id: AMO.8.10
reference: Amos 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָפַכְתִּ֨י חַגֵּי/כֶ֜ם לְ/אֵ֗בֶל וְ/כָל שִֽׁירֵי/כֶם֙ לְ/קִינָ֔ה וְ/הַעֲלֵיתִ֤י עַל כָּל מָתְנַ֨יִם֙ שָׂ֔ק וְ/עַל כָּל רֹ֖אשׁ קָרְחָ֑ה וְ/שַׂמְתִּ֨י/הָ֙ כְּ/אֵ֣בֶל יָחִ֔יד וְ/אַחֲרִיתָ֖/הּ כְּ/י֥וֹם מָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/010.yaml
  text: I will turn your feasts into mourning[a], and all your songs into lamentation; I will bring sackcloth on every waist and baldness on every head; I will make it like mourning for an only son[d][c][b], and its end like a bitter day.
translation:
  language: fr
  text: 'Je changerai vos fêtes[a] en deuil,

    et tous vos chants en complaintes.


    Je mettrai de la toile de sac autour de chaque taille

    et je rendrai chauve chaque tête.


    J’en ferai un deuil comme pour un enfant unique[b],

    et sa fin sera comme un jour amer[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos célébrations » ; le terme désigne notamment des fêtes religieuses.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « pour un unique » ; on comprend aussi traditionnellement « pour un fils unique ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « comme un jour d’amertume ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: Je changerai
  rationale: Le verbe exprime ici la transformation radicale de la fête en deuil. « Changer en » est naturel en français et garde clairement l’action divine.
- source_word: חַגֵּיכֶם
  choice: vos fêtes
  rationale: חַג désigne des célébrations festives, souvent religieuses. « Fêtes » est direct, courant et suffisamment large.
- source_word: לְאֵבֶל
  choice: en deuil
  rationale: אֵבֶל évoque particulièrement le deuil lié à la mort, avec ses dimensions affective et rituelle.
- source_word: שִׁירֵיכֶם
  choice: vos chants
  rationale: Le pluriel שִׁירִים désigne directement des chants; ce choix conserve le contraste sonore entre célébration et lamentation.
- source_word: לְקִינָה
  choice: en complaintes
  rationale: קִינָה désigne une lamentation formelle, souvent funèbre. « Complaintes » conserve cette tonalité tout en restant compréhensible dans un registre biblique digne.
- source_word: וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק
  choice: Je mettrai le sac autour de toutes les tailles
  rationale: La construction décrit le port du sac comme signe de deuil. « Autour de toutes les tailles » restitue naturellement l’emplacement indiqué par מָתְנַיִם.
- source_word: וְעַל כָּל רֹאשׁ קָרְחָה
  choice: je rendrai toutes les têtes chauves
  rationale: קָרְחָה désigne la calvitie ou le crâne rasé comme signe de deuil. La formulation verbale est plus naturelle en français que « la calvitie sur toute tête » sans perdre l’image.
- source_word: וְשַׂמְתִּיהָ
  choice: J’en ferai
  rationale: Cette tournure évite d’assigner explicitement le suffixe féminin à la terre, à la ville ou à la situation, et préserve ainsi l’indétermination du texte hébreu.
- source_word: כְּאֵבֶל יָחִיד
  choice: comme un deuil pour un enfant unique
  rationale: יָחִיד signifie littéralement « unique » ou « seul ». « Enfant unique » rend l’intensité de la perte sans ajouter au texte le sexe de cet enfant.
- source_word: וְאַחֲרִיתָהּ
  choice: sa fin
  rationale: אַחֲרִית désigne la fin ou l’issue. Le possessif féminin français conserve une certaine ambiguïté quant à son référent.
- source_word: כְּיוֹם מָר
  choice: comme un jour amer
  rationale: La traduction directe garde l’image concise et la forte charge affective de מָר.
theological_decisions:
- issue: Référent des suffixes féminins dans וְשַׂמְתִּיהָ et וְאַחֲרִיתָהּ
  choice: « J’en ferai » puis « sa fin », sans identifier explicitement le référent
  alternative: « Je rendrai le pays semblable… et sa fin… » ou « Je ferai de cette fête… »
  rationale: L’hébreu permet de comprendre une réalité féminine implicite, par exemple la terre, la ville ou l’ensemble de la situation annoncée. La traduction ne tranche pas là où le texte reste ouvert.
- issue: Sens de יָחִיד dans l’image du deuil
  choice: « un enfant unique »
  alternative: « un fils unique » ou, plus littéralement, « un être unique »
  rationale: Le mot hébreu ne précise pas grammaticalement « fils » dans ce verset. « Enfant unique » exprime naturellement en français la perte incomparable évoquée tout en évitant une précision absente de la forme hébraïque.
translation_notes:
  register: Français international moderne, sobre et prophétique. Le parallélisme poétique est conservé par la mise en lignes. « Sac », « deuil » et « complaintes » maintiennent les images rituelles sans les expliquer dans le corps du texte. Les formulations évitent les archaïsmes tels que « reins » pour מָתְנַיִם.
