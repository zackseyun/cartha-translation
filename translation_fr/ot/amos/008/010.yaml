review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les fêtes deviennent deuil, les chants lamentations, et les signes corporels de deuil sont universalisés. « Enfant unique » préserve prudemment l’ouverture de יָחִיד, dont l’expression peut néanmoins évoquer conventionnellement un fils unique. La formulation « J’en ferai comme un deuil » est toutefois inachevée en français et ne rend pas nettement la comparaison introduite par כְּ.'
  naturalness: Le registre est sobre et approprié, mais « autour de toutes les tailles » est peu idiomatique, et « J’en ferai comme un deuil » n’est pas une construction française naturelle. « De la toile de sac autour de chaque taille » et « J’en ferai un deuil comme pour un enfant unique » sont plus fluides tout en gardant l’imagerie du texte.
  terminology: « Fêtes », « deuil », « chants », « complaintes » et « jour amer » conviennent au registre prophétique. « Toile de sac » rend plus clairement שָׂק que le seul « sac », lequel peut évoquer un contenant en français moderne. La note sur « enfant unique » maintient à juste titre l’alternative traditionnelle « fils unique ».
  issues:
  - severity: medium
    issue: « autour de toutes les tailles » est maladroit et « le sac » est lexicalement imprécis en français contemporain.
    rationale: Le terme hébreu שָׂק désigne l’étoffe ou le vêtement grossier porté en signe de deuil, non simplement un sac-contenant. « De la toile de sac autour de chaque taille » restitue l’image et se lit naturellement.
  - severity: medium
    issue: « J’en ferai comme un deuil » est syntaxiquement incomplet et affaiblit la comparaison.
    rationale: La construction française exige ici un complément nominal ou une formulation comparative explicite. « J’en ferai un deuil comme pour un enfant unique » conserve l’action divine, le deuil et l’indétermination du référent.
