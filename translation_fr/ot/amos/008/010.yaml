  to: 'Je changerai vos fêtes[a] en deuil,

    et tous vos chants en complaintes.


    Je mettrai de la toile de sac autour de chaque taille

    et je rendrai chauve chaque tête.


    J’en ferai un deuil comme pour un enfant unique[b],

    et sa fin sera comme un jour amer[c].'
  rationale: La révision corrige deux formulations françaises insuffisamment naturelles sans modifier le sens. « Toile de sac » rend explicitement le tissu de deuil évoqué par שָׂק. La réfection de la troisième ligne rend la comparaison avec le deuil pour un unique grammaticalement claire, tout en laissant non spécifié le référent féminin des suffixes hébreux, comme le fait « J’en » puis « sa fin ».
