language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֣ה יָמִ֣ים בָּאִ֗ים נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִשְׁלַחְתִּ֥י רָעָ֖ב בָּ/אָ֑רֶץ לֹֽא רָעָ֤ב לַ/לֶּ֨חֶם֙ וְ/לֹֽא צָמָ֣א לַ/מַּ֔יִם כִּ֣י אִם לִ/שְׁמֹ֔עַ אֵ֖ת דִּבְרֵ֥י יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/011.yaml
  text: Behold[a], days are coming, declares the Lord GOD, when I will send a famine on the land—not a famine for bread, nor a thirst for water, but for hearing the words of Yahweh.
translation:
  language: fr
  text: 'Voici venir des jours — déclaration du Seigneur Yahweh — où j’enverrai une famine dans le pays : non pas une famine de pain ni une soif d’eau, mais la faim d’entendre[a] les paroles de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais d’entendre les paroles de Yahweh ». L’infinitif hébreu peut être rendu plus directement ainsi; « la faim d’entendre » explicite en français le lien avec la famine annoncée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה יָמִים בָּאִים
  choice: Voici venir des jours
  rationale: Cette tournure française actuelle mais solennelle conserve la force d’annonce de הִנֵּה et l’expression prophétique d’un avenir imminent.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם sans l’assimiler au contenu même de l’oracle. « Seigneur Yahweh » distingue אֲדֹנָי du nom divin יְהוִה.
- source_word: וְהִשְׁלַחְתִּי
  choice: où j’enverrai
  rationale: Le relatif « où » rattache naturellement l’action divine aux jours annoncés, tout en conservant le futur et l’initiative explicite de Dieu.
- source_word: רָעָב בָּאָרֶץ
  choice: une famine dans le pays
  rationale: רָעָב désigne ici une famine touchant collectivement le territoire. אֶרֶץ est rendu par « pays », sens contextuellement plus probable que « terre » au sens mondial.
- source_word: לֹא רָעָב לַלֶּחֶם
  choice: non pas une famine de pain
  rationale: La répétition de « famine » maintient l’insistance hébraïque et « pain » conserve l’image concrète, même s’il représente plus largement la nourriture.
- source_word: וְלֹא צָמָא לַמַּיִם
  choice: ni une soif d’eau
  rationale: La coordination et le parallélisme avec la famine de pain sont conservés dans une formulation française naturelle.
- source_word: כִּי אִם לִשְׁמֹעַ
  choice: mais la faim d’entendre
  rationale: « Mais » marque l’opposition corrective de כִּי אִם. « La faim d’entendre » rend intelligible en français la métaphore de la privation tout en maintenant le champ lexical de la faim.
- source_word: דִּבְרֵי יְהוָה
  choice: les paroles de Yahweh
  rationale: Le pluriel « paroles » correspond à דִּבְרֵי et peut désigner les messages ou déclarations venant de Dieu; le nom propre Yahweh rend יְהוָה directement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; l’Éternel
  rationale: La translittération préserve le nom divin distinct, notamment dans la formule אֲדֹנָי יְהוִה, rendue « Seigneur Yahweh », et évite de confondre les deux termes.
- issue: Nature de la famine annoncée
  choice: Une famine métaphorique définie comme la faim d’entendre les paroles de Yahweh
  alternative: Une famine matérielle accompagnée d’une privation spirituelle
  rationale: Le texte nie explicitement qu’il s’agisse d’une famine de pain ou d’une soif d’eau, puis en précise l’objet. La traduction garde l’image sans expliquer la cause de l’impossibilité d’entendre.
- issue: Portée de « entendre »
  choice: Conserver le simple fait d’entendre
  alternative: Comprendre; recevoir; obéir aux paroles de Yahweh
  rationale: שׁמע peut, selon le contexte, impliquer l’écoute attentive ou l’obéissance, mais le verset ne tranche pas explicitement entre ces nuances. « Entendre » préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et prophétique. Les deux tirets isolent la formule d’autorité sans alourdir la phrase. La répétition de « famine » et les images du pain et de l’eau sont maintenues; « la faim d’entendre » assure une métaphore compréhensible sans préciser si la privation vient de l’absence de révélation, de l’incapacité d’écouter ou d’un refus divin de répondre.
