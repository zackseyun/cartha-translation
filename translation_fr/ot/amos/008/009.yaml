source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הֵבֵאתִ֥י הַ/שֶּׁ֖מֶשׁ בַּֽ/צָּהֳרָ֑יִם וְ/הַחֲשַׁכְתִּ֥י לָ/אָ֖רֶץ בְּ/י֥וֹם אֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/009.yaml
  text: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
translation:
  language: fr
  text: 'Ce jour-là, il arrivera ceci — déclaration du Seigneur Yahweh : je ferai se coucher le soleil à midi et j’obscurcirai la terre[a] en plein jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays » ; le mot hébreu אֶרֶץ peut désigner soit la terre en général, soit un territoire particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: il arrivera ceci
  rationale: Rend la formule prophétique annonçant un événement futur dans un français actuel, tout en introduisant naturellement les actes divins qui suivent.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle prophétique courante, rendue avec naturel sans supprimer sa portée solennelle.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » conserve la valeur de la formule prophétique נְאֻם. « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יהוה et évite l’expression redondante « Seigneur SEIGNEUR ».
- source_word: וְהֵבֵאתִי הַשֶּׁמֶשׁ
  choice: je ferai coucher le soleil
  rationale: 'Le hiphil de בוא exprime ici la causalité : Dieu fera descendre ou se coucher le soleil. Cette formulation est idiomatique et maintient explicitement l’action divine.'
- source_word: בַּצָּהֳרָיִם
  choice: à midi
  rationale: Équivalent français direct et courant du moment central de la journée.
- source_word: וְהַחֲשַׁכְתִּי
  choice: j’obscurcirai
  rationale: Le hiphil indique que Dieu causera l’obscurité ; « obscurcir » l’exprime de manière concise et naturelle.
- source_word: לָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un territoire particulier. L’imagerie cosmique favorise ici « la terre », sans exclure l’autre sens.
- source_word: בְּיוֹם אוֹר
  choice: en plein jour
  rationale: Cette expression française restitue naturellement l’idée littérale d’un « jour de lumière » et souligne le renversement saisissant annoncé.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur, l’Éternel
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. La translittération « Yahweh » préserve cette distinction et évite de confondre le nom divin avec un second titre.
- issue: Portée de l’obscurcissement annoncé
  choice: la terre
  alternative: le pays
  rationale: Le phénomène solaire permet une lecture cosmique, mais le champ sémantique de אֶרֶץ laisse possible une référence au pays. Cette ambiguïté est signalée sans imposer une interprétation eschatologique ou locale.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme prophétique est conservé au moyen de l’incise « déclaration du Seigneur Yahweh », tandis que « en plein jour » rend l’intensité du contraste sans littéralisme maladroit.
