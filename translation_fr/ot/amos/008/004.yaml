  text: שִׁמְעוּ זֹ֕את הַ/שֹּׁאֲפִ֖ים אֶבְי֑וֹן וְ/לַ/שְׁבִּ֖ית ענוי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/004.yaml
  text: Hear this[a], you who trample the needy and bring the poor of the land to an end,
translation:
  language: fr
  text: 'Écoutez ceci, vous qui écrasez l’indigent[a] et qui faites disparaître les pauvres du pays :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous qui haletez après l’indigent » ou « vous qui engloutissez l’indigent ». Le participe hébreu évoque avec force une oppression avide.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel appelle directement les destinataires à prêter attention; « Écoutez » garde le ton solennel de l’interpellation prophétique en français naturel.
- source_word: זֹאת
  choice: ceci
  rationale: Le démonstratif est l’objet direct de l’impératif et introduit l’accusation qui suit.
- source_word: הַשֹּׁאֲפִים
  choice: vous qui écrasez
  rationale: Le participe de שאף véhicule ici une image vive de convoitise prédatrice et d’oppression. « Écrasez » exprime clairement la violence sociale dans ce contexte, tandis que les images lexicales possibles sont conservées en note.
- source_word: אֶבְיוֹן
  choice: l’indigent
  rationale: אֶבְיוֹן désigne une personne dans le besoin. « L’indigent » distingue ce terme des « pauvres » du membre parallèle sans perdre sa portée socioéconomique.
- source_word: וְלַשְׁבִּית
  choice: et qui faites disparaître
  rationale: L’infinitif causatif de שבת signifie faire cesser ou éliminer. « Faites disparaître » rend naturellement cette valeur causative sans imposer nécessairement l’idée explicite de mise à mort.
- source_word: ענוי
  choice: les pauvres
  rationale: Dans ce contexte d’exploitation économique, le terme désigne les personnes pauvres ou affligées; « les pauvres » communique directement la réalité sociale visée.
- source_word: אָרֶץ
  choice: du pays
  rationale: Le contexte vise la société locale d’Israël; « pays » rend ici le sens territorial et sociopolitique de אָרֶץ mieux que « terre ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. L’impératif « Écoutez » conserve la vigueur prophétique. La coordination répétée rend lisible l’adresse aux oppresseurs, et les choix « indigent » puis « pauvres » maintiennent la variation lexicale de l’hébreu.
