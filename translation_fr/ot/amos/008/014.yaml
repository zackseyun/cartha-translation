source:
  edition: WLC
  text: הַ/נִּשְׁבָּעִים֙ בְּ/אַשְׁמַ֣ת שֹֽׁמְר֔וֹן וְ/אָמְר֗וּ חֵ֤י אֱלֹהֶ֨י/ךָ֙ דָּ֔ן וְ/חֵ֖י דֶּ֣רֶךְ בְּאֵֽר שָׁ֑בַע וְ/נָפְל֖וּ וְ/לֹא יָק֥וּמוּ עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/014.yaml
  text: Those who swear by the guilt of Samaria and say[a], ‘As your god, Dan, lives,’ and[c][b], ‘As the way of Beer-sheba lives,’ will fall and never rise again.
translation:
  language: fr
  text: 'Ceux qui jurent par la faute de Samarie[a] et qui disent : « Par la vie de ton dieu, ô Dan ! »[b] et : « Par la vie du chemin de Beer-Shéba ! »[c] tomberont et ne se relèveront plus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le péché de Samarie » ; certains y voient le nom d’une idole ou d’une divinité associée à Samarie.
    reason: Alternative lexicale et interprétative pour אַשְׁמַת שֹׁמְרוֹן.
  - marker: b
    text: Ou « Par la vie de ton dieu de Dan ! »
    reason: La syntaxe condensée de l’hébreu peut aussi être comprise comme une référence au dieu associé à Dan.
  - marker: c
    text: Le « chemin de Beer-Shéba » peut désigner la route de pèlerinage vers Beer-Shéba ou la pratique cultuelle qui y était associée.
    reason: L’expression דֶּרֶךְ בְּאֵר שָׁבַע est littérale mais probablement chargée d’un sens cultuel.
lexical_decisions:
- source_word: הַנִּשְׁבָּעִים
  choice: Ceux qui jurent
  rationale: Le participe substantivé désigne le groupe soumis au jugement; cette relative est naturelle en français.
- source_word: בְּאַשְׁמַת שֹׁמְרוֹן
  choice: par la faute de Samarie
  rationale: « Faute » conserve le sens courant de culpabilité ou de faute porté par אַשְׁמָה, tout en permettant une référence métonymique au culte coupable de Samarie.
- source_word: חֵי
  choice: Par la vie de… !
  rationale: Formule française d’assermentation qui reproduit l’invocation hébraïque de la vie de l’être ou de la réalité par laquelle on jure.
- source_word: אֱלֹהֶיךָ דָּן
  choice: ton dieu, Dan
  rationale: La syntaxe hébraïque est condensée. Le texte principal conserve Dan comme nom de lieu en apposition, sans exclure l’analyse « ton dieu de Dan » signalée en note.
- source_word: דֶּרֶךְ בְּאֵר שָׁבַע
  choice: le chemin de Beer-Shéba
  rationale: « Chemin » garde le sens concret de דֶּרֶךְ et préserve l’ambiguïté entre route de pèlerinage et pratique cultuelle.
- source_word: וְנָפְלוּ
  choice: tomberont
  rationale: Le futur français convient à l’annonce prophétique du jugement.
- source_word: וְלֹא יָקוּמוּ עוֹד
  choice: et ne se relèveront plus
  rationale: Cette formulation naturelle exprime la finalité du jugement sans ajouter d’interprétation.
theological_decisions:
- issue: Nature de « la faute de Samarie »
  choice: Référence métonymique possible au culte idolâtre et coupable de Samarie, rendue littéralement par « la faute de Samarie »
  alternative: « le péché de Samarie » ou le nom propre d’une divinité, « Ashima de Samarie »
  rationale: Le nom commun signifie habituellement faute ou culpabilité. La traduction conserve ce sens lexical et laisse ouverte sa portée cultuelle sans identifier avec certitude une divinité.
- issue: Sens du « chemin de Beer-Shéba »
  choice: Maintien de l’expression concrète dans le texte principal
  alternative: Le pèlerinage vers Beer-Shéba ou la pratique cultuelle associée à Beer-Shéba
  rationale: L’expression hébraïque reste ambiguë dans ce contexte cultuel; la traduire littéralement évite de trancher indûment.
- issue: Syntaxe de « ton dieu, Dan »
  choice: Dan compris comme nom de lieu en apposition dans une formule condensée
  alternative: « ton dieu de Dan »
  rationale: Les deux analyses sont possibles. Le texte principal suit la construction la plus proche de l’ordre hébreu, et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. Les formules d’assermentation conservent leur étrangeté cultuelle, tandis que les ambiguïtés lexicales et syntaxiques authentiques sont reportées en notes.
