  rationale: La révision restitue explicitement וְהִנֵּה par « et voici ». Elle remplace « mur d’aplomb » par une expression qui conserve le rapport au fil à plomb, sans prétendre résoudre l’ambiguïté lexicale, laquelle demeure documentée dans la note. Le déplacement de l’appel de note à la fin de la proposition évite de laisser entendre que seule la désignation du mur, plutôt que l’ensemble de la construction et du terme répété, est en cause.
