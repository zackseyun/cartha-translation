  text: כֹּ֣ה הִרְאַ֔/נִי וְ/הִנֵּ֧ה אֲדֹנָ֛/י נִצָּ֖ב עַל חוֹמַ֣ת אֲנָ֑ךְ וּ/בְ/יָד֖/וֹ אֲנָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/007.yaml
  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
translation:
  language: fr
  text: 'Voici ce qu’il me montra : et voici, le Seigneur se tenait près d’un mur construit au fil à plomb, un fil à plomb à la main[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur un mur au fil à plomb ». L’expression hébraïque est difficile. Le nom אֲנָךְ désigne probablement un fil à plomb ou son poids, mais certains y voient le métal, « plomb » ou « étain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Voici ce qu’il me montra
  rationale: Cette formulation française naturelle conserve l’introduction démonstrative du récit de vision et le sens causatif du hiphil de ראה, « montrer ».
- source_word: וְהִנֵּה
  choice: Voici
  rationale: Dans le récit visionnaire, וְהִנֵּה introduit soudainement la scène présentée au regard. « Voici » en restitue la force déictique dans un registre digne; il est intégré à l’ouverture pour éviter le lourd « et voici » après une première formule démonstrative.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le titre divin est traduit en français plutôt que translittéré.
- source_word: נִצָּב
  choice: se tenait
  rationale: Le participe décrit une posture en cours dans la scène; « se tenait » est naturel et garde cette valeur descriptive.
- source_word: עַל
  choice: près de
  rationale: La préposition peut signifier « sur » ou « près de ». Dans cette scène d’inspection d’un mur, « près de » donne un sens spatial naturel sans imposer que le Seigneur soit au sommet du mur.
- source_word: חוֹמַת אֲנָךְ
  choice: un mur d’aplomb
  rationale: Le syntagme hébreu est difficile. « Mur d’aplomb » conserve le lien étroit avec אֲנָךְ et évoque un mur érigé ou vérifié au fil à plomb, sans développer excessivement le texte.
- source_word: אֲנָךְ
  choice: fil à plomb
  rationale: Dans le contexte immédiat, le terme désigne probablement l’instrument servant à contrôler la verticalité, même si le métal du plomb ou de l’étain a aussi été proposé.
- source_word: וּבְיָדוֹ אֲנָךְ
  choice: un fil à plomb à la main
  rationale: Cette tournure idiomatique française préserve clairement l’image de l’objet tenu dans la main du Seigneur.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur
  rationale: L’hébreu emploie ici un titre divin, non le tétragramme. « Le Seigneur » est la formulation française naturelle dans cette proposition et ne confond pas les deux formes.
- issue: Position du Seigneur par rapport au mur
  choice: près d’un mur
  alternative: sur un mur
  rationale: עַל permet les deux lectures. Le contexte du fil à plomb favorise la présence auprès du mur en vue de son examen, mais l’autre valeur spatiale demeure signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au cadre narratif bref, tandis que l’imparfait « se tenait » présente la scène en cours. La répétition conceptuelle d’אֲנָךְ est maintenue par « d’aplomb » puis « fil à plomb ».
