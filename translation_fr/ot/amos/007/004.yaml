  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּ֥ה קֹרֵ֛א לָ/רִ֥ב בָּ/אֵ֖שׁ אֲדֹנָ֣/י יְהוִ֑ה וַ/תֹּ֨אכַל֙ אֶת תְּה֣וֹם רַבָּ֔ה וְ/אָכְלָ֖ה אֶת הַ/חֵֽלֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/004.yaml
  text: 'This is what the Lord GOD showed me: behold[a], the Lord GOD was calling for a judgment by fire[b], and it consumed the great deep and was consuming the land.'
translation:
  language: fr
  text: 'Voici ce que le Seigneur Yahweh me fit voir : et voici, le Seigneur Yahweh appelait à plaider par le feu[a]. Le feu dévora le grand abîme et se mit à dévorer la part[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à engager un procès par le feu » ou « à exercer un jugement par le feu ». Le terme hébreu peut évoquer une contestation ou une procédure judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la part » ou « la portion » ; il peut s’agir du territoire attribué en partage.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Voici ce que … me fit voir
  rationale: Cette formulation française naturelle conserve l’introduction démonstrative de la vision et la valeur causative du hifil de ראה.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend les deux éléments du titre divin sans produire « Seigneur Seigneur » et préserve le nom propre représenté par le tétragramme.
- source_word: וְהִנֵּה
  choice: il appelait…
  rationale: La fonction présentative et vivante de הִנֵּה est rendue par les deux-points et l’entrée immédiate dans la scène; un « voici » supplémentaire alourdirait le français.
- source_word: קֹרֵא לָרִב בָּאֵשׁ
  choice: il appelait à engager un procès par le feu
  rationale: Le participe קֹרֵא décrit l’action en cours, tandis que ריב garde ici ses connotations judiciaires de litige ou de procès. « Par le feu » exprime le moyen.
- source_word: וַתֹּאכַל
  choice: Celui-ci dévora
  rationale: Le pronom reprend clairement « le feu » en français. « Dévora » conserve l’image concrète du verbe אכל.
- source_word: תְּהוֹם רַבָּה
  choice: le grand abîme
  rationale: Expression biblique compréhensible qui désigne les eaux profondes ou l’abîme immense, sans lui imposer une interprétation spéculative.
- source_word: וְאָכְלָה
  choice: et se mit à dévorer
  rationale: La formulation distingue l’action déjà accomplie sur l’abîme de celle qui commence ou se poursuit contre la part.
- source_word: הַחֵלֶק
  choice: la part attribuée
  rationale: Conserve le sens premier de חלק, « part » ou « portion », tout en indiquant naturellement qu’il s’agit vraisemblablement d’un territoire reçu en partage, sans réduire explicitement le mot à « pays ».
theological_decisions:
- issue: Le nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom יהוה. La traduction retenue les distingue et conserve le nom d’alliance.
- issue: La valeur judiciaire de לָרִב
  choice: engager un procès
  alternative: combattre / exercer un jugement
  rationale: ריב évoque une contestation, souvent de nature juridique. « Procès » maintient cette dimension sans décider précisément qui est la partie adverse ni détailler la procédure.
- issue: Le référent de הַחֵלֶק
  choice: la part attribuée
  alternative: le pays
  rationale: Le contexte peut viser le territoire d’Israël reçu en partage, mais le nom hébreu signifie littéralement « part, portion ». La traduction conserve cette tension plutôt que de fixer le référent.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe garde la vivacité de la vision; les notes préservent les ambiguïtés lexicales de ריב et חלק.
