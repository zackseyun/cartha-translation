revisions:
- from: 'Voici ce que le Seigneur Yahweh me fit voir : il appelait à engager un procès par le feu[a]. Celui-ci dévora le grand abîme et se mit à dévorer la part attribuée[b].'
  to: 'Voici ce que le Seigneur Yahweh me fit voir : et voici, le Seigneur Yahweh appelait à plaider par le feu[a]. Le feu dévora le grand abîme et se mit à dévorer la part[b].'
  rationale: La révision explicite le feu comme sujet des verbes de dévoration, conserve le marqueur présentatif de la vision (« et voici »), évite de transformer « la part » en une attribution explicite dans le corps du texte et maintient en note les possibilités judiciaires de ריב ainsi que le référent possiblement territorial de חֵלֶק.
  reviewer_model: gpt-5.6-terra
