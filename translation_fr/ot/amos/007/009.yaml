  text: וְ/נָשַׁ֨מּוּ֙ בָּמ֣וֹת יִשְׂחָ֔ק וּ/מִקְדְּשֵׁ֥י יִשְׂרָאֵ֖ל יֶחֱרָ֑בוּ וְ/קַמְתִּ֛י עַל בֵּ֥ית יָרָבְעָ֖ם בֶּ/חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/009.yaml
  text: The high places of Isaac will be made desolate[a], and the sanctuaries of Israel will be laid waste[c][b]; and I will rise against the house of Jeroboam with the sword.
translation:
  language: fr
  text: Les hauts lieux d’Isaac seront dévastés[a], et les sanctuaires d’Israël tomberont en ruine. Et je me dresserai contre la maison de Jéroboam[c] par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « deviendront déserts ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, « maison de Jéroboam » désigne sa famille ou sa dynastie.
    reason: clarification
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: seront dévastés
  rationale: Le niphal de שׁמם exprime l’état de désolation qui résultera du jugement. « Seront dévastés » est naturel en français et conserve la force du contexte, tandis que la note signale la nuance possible de changement d’état.
- source_word: בָּמוֹת
  choice: hauts lieux
  rationale: Désigne des lieux de culte, souvent établis sur des hauteurs. « Hauts lieux » est l’équivalent biblique français usuel et reste suffisamment concis.
- source_word: יִשְׂחָק
  choice: Isaac
  rationale: Le nom propre est conservé, conformément au texte hébreu, même s’il sert ici de désignation poétique au peuple du royaume du Nord.
- source_word: וּמִקְדְּשֵׁי
  choice: et les sanctuaires de
  rationale: מִקְדָּשׁ désigne un lieu consacré ou sanctuaire. « Sanctuaires » maintient clairement la dimension cultuelle.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom du texte source est conservé; dans ce contexte, il renvoie au royaume du Nord.
- source_word: יֶחֱרָבוּ
  choice: tomberont en ruine
  rationale: Le verbe חרב indique qu’un lieu est ruiné ou dévasté. Cette formulation française naturelle préserve le résultat de destruction et évite une répétition mécanique de « dévastés ».
- source_word: וְקַמְתִּי עַל
  choice: Je me dresserai contre
  rationale: Avec עַל, קום exprime ici une prise de position hostile. « Se dresser contre » rend directement l’opposition personnelle et active de Dieu.
- source_word: בֵּית יָרָבְעָם
  choice: la maison de Jéroboam
  rationale: La formulation conserve l’image familiale de בֵּית tout en permettant le sens dynastique, précisé en note.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: Cette expression rend l’instrument ou le moyen du jugement violent, vraisemblablement la guerre ou l’exécution.
theological_decisions:
- issue: Référent d’« Isaac »
  choice: Conserver « Isaac » dans le texte comme désignation poétique du peuple associé au royaume du Nord.
  alternative: Remplacer « Isaac » par « Israël » pour expliciter le référent.
  rationale: Le texte hébreu emploie intentionnellement le nom d’Isaac. Le remplacer effacerait sa portée poétique et possiblement covenantale.
- issue: Portée de « Je me dresserai contre »
  choice: Exprimer une opposition et un jugement divins directs.
  alternative: Employer la formulation plus faible « j’agirai contre ».
  rationale: La construction hébraïque présente Dieu prenant lui-même position contre la maison de Jéroboam; une expression atténuée perdrait la force judiciaire et militaire de l’image.
- issue: Sens de « maison de Jéroboam »
  choice: Préserver l’expression « maison » dans le texte et expliquer sa portée dynastique en note.
  alternative: Traduire directement par « dynastie de Jéroboam ».
  rationale: « Maison » maintient l’image hébraïque et laisse subsister sa dimension à la fois familiale et dynastique.
translation_notes:
  register: Français international moderne, digne et accessible. Les tournures bibliques reconnues « hauts lieux » et « maison de Jéroboam » sont conservées, avec une note lorsque leur portée risque de ne pas être immédiatement claire.
