  source_fidelity: La déclaration rapportée, la mort de Jéroboam « par l’épée » et l’exil emphatiquement annoncé d’Israël sont bien rendus. Toutefois, « partira ... en exil » peut suggérer en français un départ davantage volontaire que ne le permet naturellement le contexte de גלה. « Ira en exil » conserve mieux la formulation de mouvement sans cette nuance. « Hors de sa terre » rend directement מֵעַל אַדְמָתוֹ, sans ajouter l’idée spatiale comparative de « loin de ».
  naturalness: Le français est globalement clair et d’un registre moderne approprié. « Certainement » exprime l’intensification hébraïque de façon plus sobre et internationale que « bel et bien », qui est plus conversationnel dans une déclaration prophétique solennelle.
  terminology: Les noms Amos, Jéroboam et Israël suivent l’usage français. « Épée », « exil » et « terre » sont justes dans ce contexte. La note explique correctement l’infinitif absolu avec verbe fini et demeure ancrée à la proposition concernée.
