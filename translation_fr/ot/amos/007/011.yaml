source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר עָמ֔וֹס בַּ/חֶ֖רֶב יָמ֣וּת יָרָבְעָ֑ם וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/011.yaml
  text: 'For this is what Amos has said: ‘Jeroboam will die by the sword[a], and Israel will surely go into exile from its land.’'
translation:
  language: fr
  text: 'Car voici ce qu’a dit Amos : « Jéroboam mourra par l’épée, et Israël ira certainement en exil hors de sa terre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera certainement déporté » ou « sera à coup sûr emmené en exil ». L’hébreu associe un infinitif absolu au verbe conjugué pour renforcer l’affirmation.
    reason: Variante lexicale et explication de la construction emphatique hébraïque.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication donnée par Amatsia et relie naturellement cette déclaration à l’accusation du verset précédent.
- source_word: כֹה אָמַר
  choice: voici ce qu’a dit
  rationale: Rend l’expression hébraïque consacrée dans le cadre d’un discours rapportant une déclaration antérieure.
- source_word: עָמוֹס
  choice: Amos
  rationale: Forme française traditionnelle du nom propre.
- source_word: בַּחֶרֶב יָמוּת
  choice: mourra par l’épée
  rationale: Expression française naturelle qui conserve le moyen instrumental et l’idée d’une mort violente.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle du nom royal.
- source_word: וְיִשְׂרָאֵל
  choice: et Israël
  rationale: Conserve le nom employé pour désigner collectivement le royaume ou le peuple du Nord.
- source_word: גָּלֹה יִגְלֶה
  choice: partira bel et bien en exil
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Bel et bien » exprime cette insistance, tandis que « partir en exil » respecte la forme intransitive de l’hébreu.
- source_word: מֵעַל אַדְמָתוֹ
  choice: loin de sa terre
  rationale: Formulation française idiomatique exprimant l’éloignement hors du territoire auquel Israël appartient; « terre » convient au contexte national de l’exil.
theological_decisions:
- issue: Référent collectif d’Israël et suffixe possessif singulier
  choice: Israël… sa terre
  alternative: les Israélites… leur terre
  rationale: L’hébreu présente Israël comme une entité collective singulière. Le français permet de conserver cette valeur politique et collective sans explicitation supplémentaire.
- issue: Valeur emphatique de גָּלֹה יִגְלֶה
  choice: partira bel et bien en exil
  alternative: sera certainement déporté
  rationale: La traduction retenue préserve à la fois l’insistance grammaticale et le mouvement vers l’exil, sans préciser si l’action doit être comprise comme volontaire ou subie, même si le contexte implique une déportation.
translation_notes:
  register: Français international moderne, clair et digne. « Bel et bien » communique naturellement l’insistance sans archaïsme. Le marqueur de note est placé après la proposition sur l’exil, à laquelle la note se rapporte.
