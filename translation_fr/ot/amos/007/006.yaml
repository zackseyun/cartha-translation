id: AMO.7.6
reference: Amos 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִחַ֥ם יְהוָ֖ה עַל זֹ֑את גַּם הִיא֙ לֹ֣א תִֽהְיֶ֔ה אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/006.yaml
  text: 'Yahweh relented concerning this also: “It too shall not happen,” said the Lord GOD[a].'
translation:
  language: fr
  text: Yahvé revint sur sa décision à ce sujet[a]. « Cela non plus n’arrivera pas », déclara le Seigneur Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « changea d’avis à ce sujet ». L’hébreu emploie un langage humain pour décrire la réponse de Yahvé à l’intercession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: revint sur sa décision
  rationale: Au nifal, le verbe peut exprimer le fait de revenir sur une décision ou de renoncer à une action annoncée. Cette formulation conserve ici la réponse de Dieu à l’intercession d’Amos sans suggérer une faute morale.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante du tétragramme préserve le nom divin au lieu de le remplacer par un titre.
- source_word: עַל זֹאת
  choice: à ce sujet
  rationale: La préposition et le démonstratif désignent ici le jugement annoncé dans la vision précédente; cette tournure est naturelle et précise en français.
- source_word: גַּם הִיא
  choice: Cela non plus
  rationale: Le pronom féminin renvoie à la catastrophe envisagée, et la tournure négative française restitue naturellement la valeur additive de גַּם avec לֹא.
- source_word: לֹא תִהְיֶה
  choice: n’arrivera pas
  rationale: Littéralement « ne sera pas », l’expression signifie en contexte que l’événement annoncé ne se produira pas.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יְהוָה tout en conservant les deux éléments de l’hébreu.
theological_decisions:
- issue: Langage anthropopathique appliqué à Dieu dans נִחַם
  choice: revint sur sa décision
  alternative: changea d’avis; renonça à cela; eut compassion
  rationale: Le texte présente Yahvé comme répondant à l’intercession prophétique. La traduction maintient cette tension relationnelle sans expliquer le passage par une doctrine extérieure ni laisser entendre que Dieu aurait commis une faute.
translation_notes:
  register: Français international moderne, clair et digne. « Déclara » rend la formule narrative אָמַר sans lourdeur; « Cela non plus » relie naturellement ce second jugement à celui qui précède.
