source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֲמַצְיָה֙ כֹּהֵ֣ן בֵּֽית אֵ֔ל אֶל יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר קָשַׁ֨ר עָלֶ֜י/ךָ עָמ֗וֹס בְּ/קֶ֨רֶב֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹא תוּכַ֣ל הָ/אָ֔רֶץ לְ/הָכִ֖יל אֶת כָּל דְּבָרָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/010.yaml
  text: Then Amaziah[a], the priest of Bethel, sent word to Jeroboam king of Israel, saying, “Amos has conspired against you in the midst of the house of Israel[c][b]; the land is not able to bear all his words.”
translation:
  language: fr
  text: 'Alors Amatsia, le prêtre de Béthel, envoya dire à Jéroboam, roi d’Israël : « Amos a conspiré contre toi[a] au sein de la maison d’Israël[b]. Le pays ne peut pas supporter toutes ses paroles[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a comploté contre toi ». Le verbe hébreu peut désigner une conspiration ou un complot, particulièrement dans un contexte politique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parmi la maison d’Israël » ou « au milieu du peuple d’Israël ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « contenir toutes ses paroles » ou « endurer tout ce qu’il dit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya dire
  rationale: Le verbe signifie « envoyer »; puisque לֵאמֹר introduit le message sans préciser le messager, « envoya dire » exprime naturellement en français l’acte de communication implicite.
- source_word: כֹּהֵן בֵּית אֵל
  choice: le prêtre de Béthel
  rationale: La chaîne construite désigne la fonction d’Amatsia et son rattachement au sanctuaire de Béthel; cette formulation reste naturelle et institutionnellement précise.
- source_word: קָשַׁר עָלֶיךָ
  choice: a conspiré contre toi
  rationale: Le verbe désigne couramment une conspiration ou un complot, notamment politique; la formulation conserve le caractère accusatoire des propos d’Amatsia sans valider l’accusation.
- source_word: בְּקֶרֶב בֵּית יִשְׂרָאֵל
  choice: au sein de la maison d’Israël
  rationale: « Au sein de » restitue l’idée d’une action menée à l’intérieur même du peuple, tandis que « maison d’Israël » préserve l’expression nationale et collective du texte prophétique.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte politique adressé au roi d’Israël, le terme renvoie naturellement au territoire ou à la communauté nationale plutôt qu’à la terre entière.
- source_word: לְהָכִיל
  choice: supporter
  rationale: Le verbe exprime ici la capacité de contenir ou d’endurer. « Supporter » rend en français la force rhétorique de l’affirmation tout en laissant perceptible l’idée de tolérance.
- source_word: כָּל דְּבָרָיו
  choice: toutes ses paroles
  rationale: Cette traduction conserve le pluriel concret et la totalité exprimée par כָּל, dans un registre digne adapté au discours prophétique.
theological_decisions:
- issue: Nature de l’accusation portée par Amatsia contre Amos
  choice: « Amos a conspiré contre toi » comme formulation de l’accusation politique d’Amatsia
  alternative: « Amos a comploté contre toi »
  rationale: Le récit rapporte la caractérisation hostile d’Amatsia devant le roi; il ne confirme pas qu’Amos ait réellement commis une trahison. La traduction maintient cette tension narrative.
- issue: Portée de « maison d’Israël »
  choice: Conserver l’expression collective « maison d’Israël »
  alternative: Simplifier en « Israël » ou « le peuple d’Israël »
  rationale: L’expression hébraïque possède une résonance nationale et relationnelle propre au langage prophétique; la conserver évite d’en réduire la portée.
translation_notes:
  register: 'Français international moderne, naturel et digne. « Envoya dire » suit l’usage français pour la formule de messager. « Au sein de » évite la lourdeur de « au milieu de » tout en gardant l’idée d’intériorité. Les noms propres suivent les formes françaises usuelles : Amatsia, Béthel, Jéroboam.'
