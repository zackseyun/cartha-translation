id: AMO.7.3
reference: Amos 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִחַ֥ם יְהוָ֖ה עַל זֹ֑את לֹ֥א תִהְיֶ֖ה אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/003.yaml
  text: 'Yahweh relented concerning this: “It will not happen,” said Yahweh[a].'
translation:
  language: fr
  text: 'Yahweh renonça à cela : « Cela n’arrivera pas », dit Yahweh[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh changea d’avis à ce sujet » ou « Yahweh regretta cela ». Selon le contexte, le verbe hébreu peut exprimer le fait de renoncer à une action prévue, le regret ou un changement d’intention.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: renonça
  rationale: Dans ce contexte d’intercession prophétique, le niphal de נחם indique que Yahweh n’exécute pas le jugement annoncé. « Renonça » exprime naturellement en français le retrait de l’action envisagée, tandis que la note conserve les autres nuances possibles du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh » plutôt que remplacé par un titre.
- source_word: עַל זֹאת
  choice: à cela
  rationale: Cette expression renvoie au jugement décrit dans la vision précédente. « À cela » reste concis et préserve ce renvoi sans préciser davantage son objet.
- source_word: לֹא תִהְיֶה
  choice: Cela n’arrivera pas
  rationale: Le verbe féminin singulier renvoie à l’action ou au désastre annoncé. Cette formulation est claire et idiomatique en français moderne.
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: Le passé simple rend directement la forme accomplie de אמר et introduit sobrement la parole divine, sans lui donner la valeur plus technique d’une formule d’oracle.
theological_decisions:
- issue: Langage anthropopathique appliqué à Dieu dans נִחַם יְהוָה
  choice: Traduire par « Yahweh renonça » et maintenir l’image de Dieu retirant le jugement annoncé en réponse à l’intercession.
  alternative: « Yahweh changea d’avis », « Yahweh regretta » ou « Yahweh eut compassion »
  rationale: « Renonça » conserve l’idée centrale d’une action annoncée qui ne sera pas exécutée, sans effacer la tension théologique du passage ni suggérer explicitement une faute morale. La note signale les autres nuances lexicalement possibles.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste proche de la brièveté et de l’ambiguïté de l’hébreu.
