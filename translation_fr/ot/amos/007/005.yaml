source:
  edition: WLC
  text: וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ חֲדַל נָ֔א מִ֥י יָק֖וּם יַעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/005.yaml
  text: Then I said[a], “Lord GOD, please cease[b]. How can Jacob stand? For he is small.”
translation:
  language: fr
  text: 'Alors j’ai dit : « Seigneur Yahvé[a], arrête, je t’en prie ! Comment Jacob pourra-t-il subsister[b] ? Car il est petit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Adonaï YHWH » (אֲדֹנָי יְהוִה), titre composé qui associe « Seigneur » au nom divin YHWH.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Qui relèvera Jacob ? » La formulation hébraïque est très concise.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors j’ai dit
  rationale: Le waw narratif fait progresser le récit. « Alors j’ai dit » exprime naturellement cette succession en français.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahvé
  rationale: Le titre composé associe אֲדֹנָי, « Seigneur », au nom divin YHWH. « Seigneur Yahvé » rend distinctement les deux éléments sans produire l’expression maladroite « Seigneur SEIGNEUR ».
- source_word: חֲדַל נָא
  choice: arrête, je t’en prie
  rationale: L’impératif חֲדַל demande de cesser, tandis que נָא marque la supplication. Cette formulation est directe, naturelle et digne.
- source_word: מִי יָקוּם
  choice: Comment … pourra-t-il subsister ?
  rationale: La tournure hébraïque est concise et inhabituelle. Dans ce contexte de jugement, « subsister » exprime la capacité de Jacob à tenir et à survivre, tout en laissant en note l’autre analyse possible.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le texte nomme explicitement Jacob, employé ici comme désignation collective du peuple d’Israël; la traduction conserve ce nom.
- source_word: כִּי קָטֹן הוּא
  choice: Car il est petit
  rationale: La proposition donne la raison de la supplication. « Petit » conserve l’image et le genre grammatical de l’hébreu, sans expliciter celle-ci par « faible ».
theological_decisions:
- issue: Rendu du nom divin YHWH dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahvé
  alternative: Seigneur DIEU
  rationale: Le choix retenu distingue le titre אֲדֹנָי du nom propre divin YHWH et évite de remplacer silencieusement ce dernier par un titre.
- issue: Sens de מִי יָקוּם יַעֲקֹב
  choice: Comment Jacob pourra-t-il subsister ?
  alternative: Qui relèvera Jacob ?
  rationale: Le contexte appuie une question rhétorique sur l’incapacité du petit Jacob à résister au jugement. Cependant, la syntaxe très resserrée permet aussi de comprendre qu’un agent devrait le relever; cette possibilité est donc signalée en note.
translation_notes:
  register: Français international actuel, clair et digne. La supplication est rendue par une expression idiomatique sans atténuer son urgence; « petit » préserve l’image hébraïque plutôt que de l’interpréter comme « faible ».
