source:
  edition: WLC
  text: וַ/יִּקָּחֵ֣/נִי יְהוָ֔ה מֵ/אַחֲרֵ֖י הַ/צֹּ֑אן וַ/יֹּ֤אמֶר אֵלַ/י֙ יְהוָ֔ה לֵ֥ךְ הִנָּבֵ֖א אֶל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
translation:
  language: fr
  text: 'Mais Yahweh m’a pris d’auprès du troupeau[a], et Yahweh m’a dit : « Va, prophétise à mon peuple Israël[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de derrière le troupeau », selon une traduction plus littérale de l’expression hébraïque.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « à mon peuple Israël ». Dans le contexte, le message prophétique comporte un jugement, mais ce verset ne dit pas explicitement « contre » Israël.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵנִי
  choice: m’a pris
  rationale: Le verbe לקח signifie couramment « prendre ». Ici, il décrit l’appel d’Amos, que Yahweh prend à son ancienne occupation, sans imposer l’idée plus forte de le saisir de force.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: מֵאַחֲרֵי הַצֹּאן
  choice: alors que je suivais le troupeau
  rationale: L’expression signifie littéralement « de derrière le troupeau ». Cette formulation française conserve l’image pastorale tout en exprimant naturellement la situation dans laquelle Yahweh a pris Amos.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: צֹאן désigne collectivement le petit bétail, souvent des moutons et des chèvres. « Troupeau » garde cette valeur collective sans la limiter aux seuls moutons.
- source_word: וַיֹּאמֶר אֵלַי
  choice: m’a dit
  rationale: Rendu direct et naturel de אמר suivi de אֶל.
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif simple conserve la force directe de l’envoi prophétique.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: Le niphal impératif de נבא désigne l’action de parler en prophète ; « prophétise » est précis, concis et idiomatique.
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: à mon peuple Israël
  rationale: La préposition אֶל indique ici naturellement la direction du message, « à », sans introduire le sens hostile de « contre ». La formulation conserve aussi l’affirmation d’appartenance « mon peuple ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Orientation de la mission prophétique envers Israël
  choice: à mon peuple Israël
  alternative: contre mon peuple Israël
  rationale: אֶל signifie le plus naturellement « à » ou « vers ». Même si le contexte comporte un jugement, ce verset ne qualifie pas explicitement la prophétie comme dirigée « contre » Israël.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste naturelle tout en conservant l’image pastorale, la répétition du nom divin et l’ambiguïté du rapport entre la prophétie et Israël.
