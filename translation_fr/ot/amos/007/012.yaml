  text: וַ/יֹּ֤אמֶר אֲמַצְיָה֙ אֶל עָמ֔וֹס חֹזֶ֕ה לֵ֥ךְ בְּרַח לְ/ךָ֖ אֶל אֶ֣רֶץ יְהוּדָ֑ה וֶ/אֱכָל שָׁ֣ם לֶ֔חֶם וְ/שָׁ֖ם תִּנָּבֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/012.yaml
  text: Then Amaziah said to Amos[a], “Seer, go, flee away to the land of Judah, and eat bread there, and prophesy there.”
translation:
  language: fr
  text: 'Alors Amatsia dit à Amos : « Voyant, va, enfuis-toi au pays de Juda. Là-bas, mange du pain[a] et prophétise. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gagne ton pain là-bas » ou « gagne ta vie là-bas » ; l’expression peut désigner le fait d’y assurer sa subsistance.
    reason: alternative lexicale et portée idiomatique
lexical_decisions:
- source_word: חֹזֶה
  choice: Voyant
  rationale: Ce terme désigne spécifiquement celui qui reçoit ou voit des visions. « Voyant » conserve cette nuance et évite de l'aplanir en « prophète ».
- source_word: לֵךְ בְּרַח לְךָ
  choice: va, enfuis-toi
  rationale: La succession des impératifs exprime un ordre pressant de partir. « Enfuis-toi » rend ברח, tandis que la forme pronominale restitue naturellement la valeur personnelle de לְךָ.
- source_word: אֶרֶץ יְהוּדָה
  choice: au pays de Juda
  rationale: « Pays de Juda » conserve la dimension géographique et politique de אֶרֶץ dans un français naturel.
- source_word: וֶאֱכָל שָׁם לֶחֶם
  choice: Là-bas, mange ton pain
  rationale: La formulation concrète de l'hébreu est maintenue dans le texte principal. En contexte, elle peut suggérer le fait de gagner sa vie, sens signalé en note.
- source_word: תִּנָּבֵא
  choice: prophétise
  rationale: Le verbe français rend directement l'activité de parler en prophète.
- source_word: וַיֹּאמֶר
  choice: Alors Amatsia dit
  rationale: « Alors » marque naturellement la progression du récit portée par le waw consécutif.
theological_decisions:
- issue: Faut-il expliciter l'idée qu'Amos gagnerait sa vie en prophétisant ?
  choice: Conserver dans le texte l'expression concrète « mange ton pain ».
  alternative: Traduire « gagne ton pain là-bas » ou « gagne ta vie là-bas ».
  rationale: Le contexte peut laisser entendre qu'Amatsia traite Amos comme un prophète professionnel, mais l'hébreu dit littéralement « mange du pain ». Maintenir cette image préserve l'ambiguïté et évite de rendre explicite une accusation seulement implicite.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « là » en hébreu est allégée en français par « Là-bas » placé en tête de la dernière phrase, sans perdre l'insistance sur Juda comme nouveau lieu de subsistance et de prophétie.
