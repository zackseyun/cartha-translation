source:
  edition: WLC
  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּה֙ יוֹצֵ֣ר גֹּבַ֔י בִּ/תְחִלַּ֖ת עֲל֣וֹת הַ/לָּ֑קֶשׁ וְ/הִ֨נֵּה לֶ֔קֶשׁ אַחַ֖ר גִּזֵּ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], he was forming locusts at the beginning of the spring crop''s coming up, and behold[b], it was the spring crop after the king''s mowings.'
translation:
  language: fr
  text: 'Voici ce que le Seigneur Yahweh me fit voir : voici qu’il était en train de former des criquets, au début de la levée de la pousse tardive[a] ; et voici : c’était la pousse tardive après les coupes du roi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la seconde pousse » ou « la repousse ». Le terme hébreu désigne la végétation qui pousse plus tard, après une première coupe.
    reason: lexical_alternative
  - marker: b
    text: Les « coupes du roi » désignent probablement une première coupe d’herbe ou de fourrage prélevée pour le roi, après laquelle venait la pousse tardive.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Voici ce que … me fit voir
  rationale: Rend naturellement la formule d’introduction de la vision tout en conservant la valeur démonstrative de כֹּה et le causatif de הִרְאַנִי.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve les deux éléments du titre divin et rend explicitement le nom propre יהוה, sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: וְהִנֵּה
  choice: il était en train de / c’était
  rationale: La présentation vive signalée par וְהִנֵּה est intégrée à une narration française naturelle; sa répétition structure les deux éléments de la vision sans recourir à l’archaïsme « voici que » deux fois.
- source_word: יוֹצֵר
  choice: était en train de former
  rationale: Le participe décrit une action en cours dans la vision.
- source_word: גֹּבַי
  choice: des criquets
  rationale: Dans ce contexte de destruction agricole, le terme désigne des criquets ravageurs; le français « criquets » est précis et courant.
- source_word: בִּתְחִלַּת עֲלוֹת
  choice: au moment où … commençait à lever
  rationale: Exprime à la fois le commencement et la montée de la végétation dans un français agricole compréhensible.
- source_word: הַלָּקֶשׁ / לֶקֶשׁ
  choice: la seconde pousse
  rationale: Le terme désigne la repousse tardive qui suit une première coupe. « Seconde pousse » est plus transparent en français que « pousse tardive » tout en gardant la relation avec les coupes mentionnées ensuite.
- source_word: גִּזֵּי הַמֶּלֶךְ
  choice: les coupes du roi
  rationale: Rend le sens agricole probable de גִּזִּים, des coupes de végétation, tout en conservant la formulation concise et l’association au roi.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte contient à la fois le titre אֲדֹנָי et le nom יהוה. Le rendu choisi distingue les deux et préserve le nom divin comme nom propre.
- issue: Agent de la formation des criquets
  choice: il était en train de former
  alternative: des criquets se formaient
  rationale: Le participe masculin singulier יוֹצֵר renvoie naturellement au Seigneur Yahweh comme agent. Le texte garde ainsi l’implication théologique du jugement sans l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le caractère visionnaire et progressif du texte hébreu. Le tiret clarifie que la seconde proposition explique de quelle pousse il s’agit.
