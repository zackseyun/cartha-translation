  terminology: « Le Seigneur Yahweh » préserve adéquatement les deux éléments d’אַדֹנָי יְהוִה. « Criquets », « pousse tardive » et « coupes du roi » sont des choix compréhensibles. « Pousse tardive » est préférable ici à « seconde pousse », qui peut présenter comme certaine une relation de second cycle que le terme hébreu décrit plus prudemment comme une croissance tardive/later growth.
  issues:
