    rationale: Ils encadrent les deux éléments de la vision. Les rendre par « voici que » et « et voici » conserve la force de présentation sans archaïsme excessif.
  - severity: low
    issue: « Seconde pousse » est plus interprétatif que nécessaire.
    rationale: לֶקֶשׁ désigne la croissance tardive; « pousse tardive » maintient le sens tout en évitant de fixer indûment le mécanisme agricole exact.
