    issue: « cultivateur de figues de sycomore » est trop spécifique pour וּבוֹלֵס שִׁקְמִים.
    rationale: Le terme hébreu ne désigne pas simplement la culture des figuiers ou la production des fruits ; il renvoie probablement à leur traitement ou préparation, possiblement par incision pour hâter la maturation. Une formulation plus large est préférable dans le texte, avec l’explication technique en note.
  - severity: low
    issue: L’ambiguïté de « fils de prophète » n’est pas signalée en note.
    rationale: La formulation principale la préserve bien, mais une note permet au lecteur de comprendre qu’elle peut aussi évoquer l’appartenance à un groupe de prophètes, sans réduire l’expression à cette seule lecture.
