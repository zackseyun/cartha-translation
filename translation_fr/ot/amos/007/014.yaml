  text: וַ/יַּ֤עַן עָמוֹס֙ וַ/יֹּ֣אמֶר אֶל אֲמַצְיָ֔ה לֹא נָבִ֣יא אָנֹ֔כִי וְ/לֹ֥א בֶן נָבִ֖יא אָנֹ֑כִי כִּֽי בוֹקֵ֥ר אָנֹ֖כִי וּ/בוֹלֵ֥ס שִׁקְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
translation:
  language: fr
  text: 'Amos répondit à Amatsia : « Je ne suis ni prophète ni fils de prophète[a] ; je suis plutôt éleveur de bétail et celui qui prépare les figues de sycomore[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « fils de prophète » peut désigner un fils de prophète, mais aussi l’appartenance à un groupe de prophètes.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut désigner celui qui soigne ou prépare les figues de sycomore, peut-être en les incisant afin de favoriser leur maturation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן … וַיֹּאמֶר
  choice: répondit
  rationale: En français actuel, le simple verbe « répondit » rend naturellement la formule narrative hébraïque sans la tournure lourde « répondit et dit ».
- source_word: לֹא נָבִיא אָנֹכִי
  choice: Je ne suis pas prophète
  rationale: Traduction directe de la proposition nominale, qui maintient la déclaration d’Amos sans en préciser la portée professionnelle ou absolue.
- source_word: וְלֹא בֶן נָבִיא אָנֹכִי
  choice: ni fils de prophète
  rationale: La formulation littérale conserve l’idiome hébreu et son ambiguïté entre filiation réelle et appartenance à un groupe prophétique.
- source_word: כִּי
  choice: plutôt
  rationale: Dans ce contexte, la conjonction introduit la description contrastée de l’activité d’Amos.
- source_word: בוֹקֵר
  choice: éleveur de bétail
  rationale: Le terme concerne les bovins ou le gros bétail ; « éleveur de bétail » est plus précis que « berger » et plus courant que « bouvier ».
- source_word: וּבוֹלֵס שִׁקְמִים
  choice: cultivateur de figues de sycomore
  rationale: Cette expression intelligible désigne l’activité agricole sans imposer l’interprétation technique incertaine selon laquelle Amos inciserait les fruits.
theological_decisions:
- issue: Amos nie-t-il absolument être prophète, ou seulement être prophète de métier ou membre d’un groupe prophétique ?
  choice: Maintenir la déclaration littérale « Je ne suis pas prophète ni fils de prophète »
  alternative: Expliciter « Je n’étais pas prophète » ou « Je ne suis pas prophète de métier »
  rationale: Le contexte présente pourtant Amos comme porteur de la parole de Dieu. La traduction conserve donc la tension du texte hébreu au lieu de la résoudre par une précision absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formule narrative hébraïque est allégée selon l’usage naturel du français, tandis que l’idiome « fils de prophète » et la tension théologique sont conservés.
