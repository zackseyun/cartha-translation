  text: לָ/כֵ֞ן כֹּה אָמַ֣ר יְהוָ֗ה אִשְׁתְּ/ךָ֞ בָּ/עִ֤יר תִּזְנֶה֙ וּ/בָנֶ֤י/ךָ וּ/בְנֹתֶ֨י/ךָ֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/אַדְמָתְ/ךָ֖ בַּ/חֶ֣בֶל תְּחֻלָּ֑ק וְ/אַתָּ֗ה עַל אֲדָמָ֤ה טְמֵאָה֙ תָּמ֔וּת וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/017.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘Your wife will prostitute herself in the city, and your sons and your daughters will fall by the sword, and your land will be divided by measuring line; and you yourself will die on unclean land[c][b], and Israel will surely go into exile from its land.’'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : « Ta femme se prostituera[a] dans la ville ; tes fils et tes filles tomberont par l’épée ; ta terre sera partagée au cordeau[b]. Toi-même, tu mourras sur une terre impure, et Israël ira bel et bien[c] en exil hors de sa terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « se livrera à la prostitution ». Le verbe hébreu désigne directement la prostitution.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sera partagée par le cordeau », c’est-à-dire à l’aide du cordeau de mesure employé pour répartir des terres.'
    reason: lexical_alternative
  - marker: c
    text: La tournure hébraïque associe un infinitif absolu au verbe conjugué afin de souligner la certitude ou l’intensité de l’exil annoncé.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence judiciaire introduite par le terme hébreu.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend la formule prophétique de messager dans un français actuel et solennel, tout en conservant le nom divin.
- source_word: תִּזְנֶה
  choice: se prostituera
  rationale: Expression directe et moderne qui conserve la dureté du verbe זנה sans recourir à une tournure archaïque.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: tes fils et tes filles
  rationale: Conserve les deux groupes explicitement nommés dans l’hébreu.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: tomberont par l’épée
  rationale: Préserve l’image hébraïque traditionnelle de la mort violente à la guerre.
- source_word: בַּחֶבֶל תְּחֻלָּק
  choice: sera partagée au cordeau
  rationale: Le cordeau est l’instrument de mesure servant ici à répartir la terre conquise ; la formulation est concise et idiomatique en français.
- source_word: וְאַתָּה
  choice: Toi-même
  rationale: Reproduit l’insistance du pronom personnel explicitement exprimé.
- source_word: עַל אֲדָמָה טְמֵאָה
  choice: sur une terre impure
  rationale: Suit de près la préposition et le vocabulaire hébreux, sans expliciter dans le texte principal la portée rituelle ou territoriale de l’impureté.
- source_word: גָּלֹה יִגְלֶה
  choice: ira bel et bien en exil
  rationale: La locution « bel et bien » restitue l’intensification ou la certitude produite par l’infinitif absolu suivi du verbe conjugué.
- source_word: מֵעַל אַדְמָתוֹ
  choice: loin de sa terre
  rationale: Rend l’éloignement hors du territoire exprimé par מֵעַל dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Conserve le nom propre divin dans la formule prophétique, conformément à l’orientation fournie, sans lui substituer un titre.
- issue: Sens de « terre impure »
  choice: Conserver littéralement « une terre impure »
  alternative: Expliciter « une terre étrangère considérée comme impure »
  rationale: Le contexte suggère une terre étrangère liée à l’exil, mais le texte ne l’explicite pas dans cette proposition ; la traduction maintient donc la tension rituelle et théologique.
- issue: Force de גָּלֹה יִגְלֶה
  choice: 'Certitude emphatique : « ira bel et bien en exil »'
  alternative: 'Simple futur : « ira en exil »'
  rationale: La construction hébraïque avec infinitif absolu renforce l’énoncé ; le français doit en faire entendre l’insistance sans ajouter une cause ou un agent.
translation_notes:
  register: Français international moderne, direct et digne. Le rythme judiciaire de l’oracle est conservé par des propositions brèves séparées par des points-virgules. Les images fortes du texte — prostitution, épée, cordeau, terre impure et exil — ne sont ni atténuées ni développées au-delà de l’hébreu.
