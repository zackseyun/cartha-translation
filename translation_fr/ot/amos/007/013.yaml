  text: וּ/בֵֽית אֵ֔ל לֹֽא תוֹסִ֥יף ע֖וֹד לְ/הִנָּבֵ֑א כִּ֤י מִקְדַּשׁ מֶ֨לֶךְ֙ ה֔וּא וּ/בֵ֥ית מַמְלָכָ֖ה הֽוּא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/013.yaml
  text: But at Bethel you must not prophesy any longer[a], for it is the king’s sanctuary[b], and it is a royal house.
translation:
  language: fr
  text: Mais à Béthel, ne prophétise plus[a], car c’est le sanctuaire du roi et la maison du royaume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « n’ajoute plus à prophétiser ». On peut aussi traduire : « ne continue plus à prophétiser » ou « ne prophétise plus désormais ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la maison du royaume ». L’expression présente probablement Béthel comme une institution liée au pouvoir royal ; on pourrait aussi traduire : « une maison royale ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵית אֵל
  choice: Mais à Béthel
  rationale: Dans la continuité de l’ordre donné au verset précédent de partir en Juda, וּ prend ici naturellement une valeur adversative. Le préfixe ב marque le lieu.
- source_word: לֹא תוֹסִיף עוֹד לְהִנָּבֵא
  choice: ne prophétise plus
  rationale: Cette formulation française naturelle rend l’interdiction ainsi que l’idée de répétition ou de continuation portée par יסף, עוד et l’infinitif.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’interdiction.
- source_word: מִקְדַּשׁ מֶלֶךְ
  choice: le sanctuaire du roi
  rationale: Le syntagme construit désigne directement un sanctuaire appartenant au roi ou placé sous son autorité, sans statuer sur sa légitimité cultuelle.
- source_word: וּ/בֵית מַמְלָכָה
  choice: la maison du royaume
  rationale: Cette traduction conserve l’image et l’ambiguïté institutionnelle de l’hébreu, plutôt que de préciser de façon interprétative « palais royal » ou « temple d’État ».
- source_word: הוּא ... הוּא
  choice: c’est ... et la maison ...
  rationale: La copule française exprime la première prédication; son ellipse dans la seconde est naturelle en français tout en maintenant les deux qualifications parallèles de Béthel.
theological_decisions:
- issue: Nature de la désignation de Béthel dans le discours d’Amatsia
  choice: Présenter Béthel comme « le sanctuaire du roi » et « la maison du royaume »
  alternative: « sanctuaire royal » et « temple d’État »
  rationale: Le texte rapporte l’argument politique et religieux d’Amatsia sans approuver la légitimité du culte de Béthel. La traduction retenue reste proche des expressions hébraïques et évite une explicitation doctrinale ou institutionnelle excessive.
translation_notes:
  register: Français international moderne, sobre et digne. « Ne prophétise plus » est idiomatique sans affaiblir l’interdiction. « Maison du royaume » conserve la formulation politique et institutionnelle du texte source, avec une note pour en éclairer la portée.
