  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר אֲנָ֑ךְ וַ/יֹּ֣אמֶר אֲדֹנָ֗/י הִנְ/נִ֨י שָׂ֤ם אֲנָךְ֙ בְּ/קֶ֨רֶב֙ עַמִּ֣/י יִשְׂרָאֵ֔ל לֹֽא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
translation:
  language: fr
  text: 'Yahvé me dit : « Que vois-tu, Amos ? » Je répondis : « Un fil à plomb[a]. » Alors le Seigneur dit : « Regarde, je place un fil à plomb au milieu de mon peuple Israël. Désormais, je ne l’épargnerai plus[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner le plomb, l’étain ou le poids métallique d’un fil à plomb ; son sens précis est discuté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je ne passerai plus par-dessus lui ». L’expression signifie probablement que Dieu ne l’épargnera plus ou ne fermera plus les yeux sur ses fautes. Le pronom singulier désigne collectivement le peuple d’Israël.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel et le distingue du titre אֲדֹנָי présent plus loin dans le verset.
- source_word: מָה אַתָּה רֹאֶה
  choice: Que vois-tu
  rationale: Question naturelle au présent, conforme au participe hébreu dans le cadre immédiat de la vision.
- source_word: אֲנָךְ
  choice: fil à plomb
  rationale: Dans la vision d’Amos 7.7-8, le contexte indique vraisemblablement un instrument servant à vérifier l’aplomb, même si le terme peut désigner plus précisément son poids métallique ou le métal dont il est fait.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rend le titre divin sans le confondre avec le nom יְהוָה.
- source_word: הִנְנִי
  choice: Regarde, je
  rationale: Conserve la fonction déictique et l’appel à l’attention dans un français actuel, sans recourir à l’archaïsme « voici que ».
- source_word: שָׂם
  choice: place
  rationale: Le présent rend la valeur vive du participe dans la scène visionnaire.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: 'Préserve la dimension spatiale forte : l’étalon est placé au sein même d’Israël.'
- source_word: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: Désormais, je ne passerai plus par-dessus lui
  rationale: Maintient l’image hébraïque du passage tout en rendant la cessation définitive exprimée par לֹא אוֹסִיף עוֹד. Le pronom masculin singulier renvoie collectivement au peuple d’Israël.
theological_decisions:
- issue: Distinction entre le nom divin et le titre divin
  choice: Rendre יְהוָה par « Yahvé » et אֲדֹנָי par « le Seigneur »
  alternative: Rendre les deux par « le Seigneur »
  rationale: La distinction du texte source est théologiquement significative et peut être conservée clairement en français.
- issue: Portée de l’expression de jugement לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: Conserver dans le texte l’image « je ne passerai plus par-dessus lui »
  alternative: « Je ne l’épargnerai plus » ou « je ne fermerai plus les yeux sur ses fautes »
  rationale: Le contexte annonce la fin de la patience divine, mais la formulation hébraïque reste imagée. La traduction conserve cette tension, tandis que la note en explicite le sens probable.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue est fluide, tandis que les images centrales de la vision et du jugement sont conservées. « Yahvé » distingue le nom divin du titre « le Seigneur ».
