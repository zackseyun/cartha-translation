id: AMO.7.16
reference: Amos 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע דְּבַר יְהוָ֑ה אַתָּ֣ה אֹמֵ֗ר לֹ֤א תִנָּבֵא֙ עַל יִשְׂרָאֵ֔ל וְ/לֹ֥א תַטִּ֖יף עַל בֵּ֥ית יִשְׂחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/016.yaml
  text: 'And now[a], hear the word of Yahweh: You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’'
translation:
  language: fr
  text: 'Et maintenant, écoute la parole de Yahweh : « Tu dis : “Ne prophétise pas contre Israël et ne prononce pas d’oracles[a] contre la maison d’Isaac.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « faire couler goutte à goutte » ; il est employé ici comme une expression pour la proclamation prophétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction et l’adverbe temporel, qui introduisent la réponse immédiate d’Amos.
- source_word: שְׁמַע
  choice: écoute
  rationale: Impératif masculin singulier adressé à Amatsia ; « écoute » exprime naturellement en français l’appel à prêter attention.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Maintient la formule prophétique et la portée révélatrice de דָּבָר, tout en transcrivant directement le nom divin.
- source_word: אַתָּה אֹמֵר
  choice: Tu dis
  rationale: Le pronom explicite donne de l’insistance au destinataire ; le présent français rend naturellement la déclaration rapportée.
- source_word: לֹא תִנָּבֵא עַל יִשְׂרָאֵל
  choice: Ne prophétise pas contre Israël
  rationale: La négation suivie de l’inaccompli a ici valeur d’interdiction ; dans ce contexte de dénonciation, עַל a une force hostile justement rendue par « contre ».
- source_word: וְלֹא תַטִּיף
  choice: et ne prononce pas d’oracles
  rationale: Le hiphil de נטף signifie littéralement faire couler ou goutter, mais sert idiomatiquement à désigner la parole prophétique. « Prononcer des oracles » est naturel, distinct de « prophétiser » et adapté au contexte.
- source_word: עַל בֵּית יִשְׂחָק
  choice: contre la maison d’Isaac
  rationale: « Contre » préserve le parallélisme hostile avec la proposition précédente, tandis que « maison d’Isaac » conserve la désignation poétique et collective du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Relation de la prophétie à Israël
  choice: contre Israël / contre la maison d’Isaac
  alternative: à Israël / au sujet d’Israël
  rationale: Le contexte montre qu’Amatsia interdit une proclamation de jugement dirigée contre Israël ; « contre » en préserve la force sans ajouter de contenu.
- issue: Valeur de תַטִּיף
  choice: prononcer des oracles
  alternative: prêcher / faire couler des paroles / prophétiser
  rationale: Le choix rend l’emploi idiomatique prophétique tout en laissant la métaphore littérale accessible dans la note et en évitant la coloration spécifiquement homilétique de « prêcher ».
translation_notes:
  register: Français international moderne, direct et digne. L’impératif singulier et le tutoiement correspondent à l’adresse personnelle d’Amos à Amatsia. Les guillemets emboîtés distinguent la parole d’Amos de la citation des ordres d’Amatsia.
