source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם כִּלָּה֙ לֶֽ/אֱכוֹל֙ אֶת עֵ֣שֶׂב הָ/אָ֔רֶץ וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ סְֽלַֽח נָ֔א מִ֥י יָק֖וּם יַֽעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/002.yaml
  text: And when it had finished eating the vegetation of the land[a], I said, “Lord GOD, please forgive! How can Jacob stand? For he is small.”
translation:
  language: fr
  text: 'Quand elles eurent fini de dévorer la végétation du pays, je dis : « Seigneur Yahweh, pardonne, je t’en prie ! Comment Jacob pourra-t-il subsister[a] ? Car il est petit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui relèvera Jacob ? »'
    reason: La formulation hébraïque peut évoquer soit la capacité de Jacob à tenir ou à survivre, soit quelqu’un qui le relèvera.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Quand
  rationale: Dans ce récit de vision, la tournure introduit le moment où l’action suivante se produit; « quand » rend naturellement sa valeur temporelle.
- source_word: כִּלָּה לֶאֱכוֹל
  choice: elles eurent fini de dévorer
  rationale: La construction exprime l’achèvement de l’action. Le pronom reprend les sauterelles de la vision précédente; « dévorer » convient à leur action destructrice.
- source_word: עֵשֶׂב הָאָרֶץ
  choice: la végétation du pays
  rationale: עֵשֶׂב désigne largement l’herbe ou la végétation. Dans le cadre national de la vision, הָאָרֶץ désigne ici le pays plutôt que la terre entière.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יהוה et évite la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: סְלַח נָא
  choice: pardonne, je t’en prie
  rationale: « Je t’en prie » restitue la supplication pressante marquée par נָא dans un français actuel et digne.
- source_word: מִי יָקוּם יַעֲקֹב
  choice: Comment Jacob pourra-t-il subsister ?
  rationale: Dans ce contexte de jugement dévastateur, la question exprime le doute qu’a Amos sur la capacité de Jacob à survivre ou à tenir. « Subsister » rend cette portée sans réduire l’image à la seule posture physique.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le texte emploie le nom d’alliance « Jacob » pour désigner le peuple; il convient de le conserver plutôt que de le remplacer par « Israël ».
- source_word: כִּי קָטֹן הוּא
  choice: Il est si petit !
  rationale: La petitesse peut être numérique, politique ou existentielle. « Si petit » conserve cette ampleur tout en exprimant naturellement le motif de l’intercession.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte juxtapose un titre et le nom divin. « Seigneur Yahweh » préserve cette distinction et rend explicitement le nom d’alliance.
- issue: Sens de מִי יָקוּם יַעֲקֹב
  choice: Comment Jacob pourra-t-il subsister ?
  alternative: Qui relèvera Jacob ?
  rationale: La lecture principale comprend la question comme une lamentation sur l’incapacité du peuple à survivre au jugement. La syntaxe inhabituelle et la gamme de sens de קום permettent aussi une lecture restauratrice, conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé antérieur marque clairement l’achèvement de la dévastation avant l’intercession. L’exclamation finale communique l’urgence affective du plaidoyer sans ajouter d’interprétation confessionnelle.
