id: AMO.2.12
reference: Amos 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תַּשְׁק֥וּ אֶת הַ/נְּזִרִ֖ים יָ֑יִן וְ/עַל הַ/נְּבִיאִים֙ צִוִּיתֶ֣ם לֵ/אמֹ֔ר לֹ֖א תִּנָּבְאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/012.yaml
  text: But you made the Nazirites drink wine[a], and you commanded the prophets, saying[b], ‘Do not prophesy.’
translation:
  language: fr
  text: 'Mais vous avez fait boire du vin aux naziréens[a], et vous avez ordonné aux prophètes : « Ne prophétisez pas ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux consacrés ». Le terme hébreu désigne les personnes liées par un vœu particulier de consécration, qui impliquait notamment de s’abstenir de vin.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « Vous ne prophétiserez pas ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּשְׁקוּ
  choice: vous avez fait boire
  rationale: Le hifil de שׁקה exprime ici la causation. « Faire boire » en rend directement la force en français naturel.
- source_word: הַנְּזִרִים
  choice: les naziréens
  rationale: Le terme technique « naziréens » préserve la catégorie particulière des personnes vouées à Dieu, sans la réduire au sens général de « consacrés ».
- source_word: יָיִן
  choice: du vin
  rationale: Traduction courante de יַיִן ; le vin est ici significatif puisque les naziréens devaient s’en abstenir.
- source_word: וְעַל הַנְּבִיאִים צִוִּיתֶם
  choice: et vous avez ordonné aux prophètes
  rationale: Avec צוה, la construction introduite par עַל désigne les personnes auxquelles l’ordre est imposé. Cette formulation est idiomatique et conserve la force de l’interdiction.
- source_word: לֹא תִּנָּבְאוּ
  choice: Ne prophétisez pas !
  rationale: L’imparfait à la négation rapporte une interdiction adressée aux prophètes. L’impératif négatif français en exprime clairement et directement la valeur.
theological_decisions:
- issue: Préserver la portée religieuse et morale de הַנְּזִרִים
  choice: les naziréens
  alternative: les consacrés
  rationale: Israël est accusé d’avoir poussé à enfreindre leur engagement des personnes spécialement vouées à Dieu. Le terme technique garde cette précision culturelle et théologique.
- issue: Force de לֹא תִּנָּבְאוּ
  choice: Ne prophétisez pas !
  alternative: Vous ne prophétiserez pas !
  rationale: Les deux formulations peuvent exprimer une défense. La première rend plus naturellement en français actuel l’ordre rapporté, sans éliminer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le terme technique « naziréens » est conservé et expliqué en note. La coordination initiale est rendue par « Mais », conforme à la valeur adversative du contexte.
