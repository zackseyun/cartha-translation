id: AMO.2.5
reference: Amos 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בִּֽ/יהוּדָ֑ה וְ/אָכְלָ֖ה אַרְמְנ֥וֹת יְרוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/005.yaml
  text: So I will send fire upon Judah[a], and it will devour the citadels of Jerusalem.
translation:
  language: fr
  text: J’enverrai donc le feu sur Juda, et il dévorera les citadelles de Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « palais » ou « places fortes » pour « citadelles ». Le terme hébreu peut désigner des bâtiments palatiaux fortifiés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai donc
  rationale: Le hifil de שׁלח signifie couramment « envoyer ». « Donc » rend naturellement la portée consécutive de la conjonction qui rattache cette sentence de jugement à l’oracle précédent, tout en conservant la première personne au futur.
- source_word: אֵשׁ
  choice: le feu
  rationale: אשׁ désigne simplement le feu. Dans ce contexte prophétique, le terme peut évoquer à la fois un incendie réel et le jugement destructeur, sans qu’il soit nécessaire de trancher.
- source_word: בִּיהוּדָה
  choice: sur Juda
  rationale: Avec le verbe « envoyer » dans une formule de jugement, la préposition ב peut être rendue idiomatiquement par « sur », qui exprime la direction hostile sans ajouter une interprétation plus précise.
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: אכל signifie littéralement « manger », mais, avec le feu pour sujet, « dévorer » restitue en français l’image vive et idiomatique.
- source_word: אַרְמְנוֹת
  choice: les citadelles
  rationale: ארמנות peut désigner des édifices palatiaux fortifiés ou des places fortes. « Citadelles » conserve ici à la fois l’idée d’importance et celle de défense; les autres sens possibles sont signalés en note.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Nature du feu annoncé
  choice: Présenter directement l’image du jugement divin sans préciser si le feu est littéral, métaphorique ou provoqué par une invasion.
  alternative: Un incendie strictement littéral, ou une métaphore explicitement interprétée comme une invasion militaire.
  rationale: Le verset affirme que Dieu enverra un feu qui dévorera les citadelles de Jérusalem, mais il n’en précise pas le mécanisme. La traduction préserve cette tension prophétique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme prophétique et l’image vive du feu qui dévore. Le marqueur de note est placé immédiatement après le groupe nominal auquel il se rapporte.
