  text: וְ/עַל בְּגָדִ֤ים חֲבֻלִים֙ יַטּ֔וּ אֵ֖צֶל כָּל מִזְבֵּ֑חַ וְ/יֵ֤ין עֲנוּשִׁים֙ יִשְׁתּ֔וּ בֵּ֖ית אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/008.yaml
  text: And on garments taken in pledge they stretch themselves out beside every altar[c][b][a], and in the house of their God they drink the wine of those they have fined.
translation:
  language: fr
  text: Ils s’étendent sur des vêtements pris en gage auprès de chaque autel[a], et ils boivent, dans la maison de leur Dieu[b], du vin obtenu par des amendes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils se couchent sur des vêtements donnés en gage auprès de chaque autel ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de leurs dieux ». Le terme hébreu peut désigner Dieu au singulier ou des dieux au pluriel.'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « le vin de ceux qui ont été frappés d’une amende » ou « le vin des punis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים חֲבֻלִים
  choice: des vêtements pris en gage
  rationale: Le syntagme désigne des vêtements reçus ou saisis comme garantie. Cette formulation conserve le cadre juridique sans préciser indûment le type de vêtement.
- source_word: יַטּוּ
  choice: ils s’étendent
  rationale: Le hiphil exprime ici l’action de s’allonger ou de s’étendre. « S’étendent » garde l’image physique et la nuance d’une installation complaisante.
- source_word: אֵצֶל כָּל מִזְבֵּחַ
  choice: auprès de chaque autel
  rationale: « Auprès de » rend la proximité spatiale, et « chaque autel » restitue naturellement la valeur distributive de כָּל avec le singulier.
- source_word: יֵין עֲנוּשִׁים
  choice: du vin obtenu par des amendes
  rationale: עֲנוּשִׁים renvoie à des personnes frappées d’une sanction, souvent pécuniaire. La formulation explicite sobrement le rapport probable entre le vin et les amendes, tandis qu’une note conserve le tour plus littéral.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: dans la maison de leur Dieu
  rationale: Dans ce syntagme, אֱלֹהִים avec suffixe peut désigner au singulier la divinité reconnue par les intéressés. La majuscule française correspond à la lecture « leur Dieu », sans approuver leur culte; la possibilité plurielle est signalée en note.
theological_decisions:
- issue: Nombre et référent de אֱלֹהֵיהֶם
  choice: leur Dieu
  alternative: leurs dieux
  rationale: Bien que la forme אֱלֹהִים soit morphologiquement plurielle, elle sert très souvent de désignation singulière de Dieu; le suffixe ne tranche pas à lui seul. « Leur Dieu » convient au cadre d’un sanctuaire, tout en laissant en note la lecture plurielle possible dans le contexte polémique d’Amos.
translation_notes:
  register: Français international moderne, sobre et prophétique. La phrase garde le parallélisme des deux accusations et rend explicites seulement les relations nécessaires à une compréhension naturelle.
