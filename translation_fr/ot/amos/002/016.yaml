source:
  edition: WLC
  text: וְ/אַמִּ֥יץ לִבּ֖/וֹ בַּ/גִּבּוֹרִ֑ים עָר֛וֹם יָנ֥וּס בַּ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/016.yaml
  text: Even the stouthearted among the warriors will flee naked on that day,” declares Yahweh[a].
translation:
  language: fr
  text: Même celui qui a le cœur vaillant parmi les guerriers s’enfuira nu, ce jour-là — déclaration de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « oracle de Yahweh ».'
    reason: La formule נְאֻם יְהוָה peut être rendue par la tournure prophétique traditionnelle « oracle de Yahweh ».
lexical_decisions:
- source_word: אַמִּיץ לִבּוֹ
  choice: celui qui a le cœur vaillant
  rationale: L’expression hébraïque signifie littéralement « fort/vaillant de cœur ». Cette formulation française conserve l’image du cœur tout en exprimant naturellement le courage et la résolution.
- source_word: בַּגִּבּוֹרִים
  choice: parmi les guerriers
  rationale: Dans ce contexte militaire, גִּבּוֹרִים désigne des combattants puissants ou valeureux. « Guerriers » restitue clairement cette valeur sans archaïsme.
- source_word: עָרוֹם
  choice: nu
  rationale: Le sens direct est « nu ». Ce terme conserve la force de l’image, qui évoque une fuite précipitée, sans équipement ni protection, plutôt que d’en préciser la cause.
- source_word: יָנוּס
  choice: s’enfuira
  rationale: Le verbe נוּס exprime la fuite devant un danger. Le futur français convient à l’annonce prophétique.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Cette tournure naturelle en français correspond à la formule temporelle prophétique « en/à ce jour-là ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם introduit solennellement une parole divine. « Déclaration de » reste proche de la forme nominale hébraïque, tandis que « Yahweh » représente directement le nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Portée de la bravoure du guerrier
  choice: Même celui qui a le cœur vaillant parmi les guerriers
  alternative: Même le plus courageux des guerriers
  rationale: L’hébreu décrit un homme au cœur vaillant au sein des guerriers, sans employer explicitement un superlatif. La traduction évite donc d’ajouter « le plus », tout en gardant l’idée que même un combattant courageux ne pourra résister.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe conserve l’intensification initiale « Même » et la rudesse de « s’enfuira nu ». « Cœur vaillant » maintient l’image hébraïque sans employer une expression vieillie.
