language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מוֹאָ֔ב וְ/אָכְלָ֖ה אַרְמְנ֣וֹת הַ/קְּרִיּ֑וֹת וּ/מֵ֤ת בְּ/שָׁאוֹן֙ מוֹאָ֔ב בִּ/תְרוּעָ֖ה בְּ/ק֥וֹל שׁוֹפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/002.yaml
  text: So I will send fire upon Moab[a], and it will consume the citadels of Kerioth; and Moab will die amid tumult, amid shouting[c][b], amid the sound of a trumpet.
translation:
  language: fr
  text: J’enverrai donc le feu contre Moab, et il dévorera les citadelles[a] de Qeriyoth[b]. Moab mourra dans le tumulte, au milieu des cris de guerre[c], au son du cor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les palais fortifiés » ou « les places fortes ».
    reason: lexical_alternative
  - marker: b
    text: Qeriyoth peut aussi être compris comme « les villes », mais il s’agit probablement ici d’un nom de lieu.
    reason: alternative_reading
  - marker: c
    text: Ou « au milieu des clameurs » ; le terme désigne notamment le cri poussé au combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai donc
  rationale: Le futur exprime la portée prophétique de la forme verbale; « donc » conserve naturellement le lien avec la sentence de jugement qui précède.
- source_word: אֵשׁ בְּמוֹאָב
  choice: le feu contre Moab
  rationale: « Feu » garde l’image concrète du jugement destructeur, tandis que « contre » rend clairement l’orientation hostile de la préposition dans ce contexte.
- source_word: וְאָכְלָה
  choice: et il dévorera
  rationale: Le verbe, dont le sujet est « le feu », signifie littéralement manger ou dévorer; ce choix conserve la vigueur de l’image hébraïque tout en étant idiomatique en français.
- source_word: אַרְמְנוֹת
  choice: les citadelles
  rationale: Le terme peut désigner des palais fortifiés ou des places fortes; « citadelles » maintient à la fois la dimension monumentale et défensive.
- source_word: הַקְּרִיּוֹת
  choice: de Qeriyoth
  rationale: Le mot est compris comme le nom d’une localité moabite, lecture probable dans ce contexte, sans masquer en note la possibilité du nom commun « les villes ».
- source_word: וּמֵת מוֹאָב
  choice: Moab mourra
  rationale: La nation est personnifiée comme sujet du verbe « mourir »; la formulation directe préserve cette image et la valeur future de l’énoncé prophétique.
- source_word: בְּשָׁאוֹן
  choice: dans le tumulte
  rationale: Le nom évoque le fracas, l’agitation et le vacarme; « tumulte » en restitue la portée sans préciser indûment sa cause.
- source_word: בִּתְרוּעָה
  choice: au milieu des cris de guerre
  rationale: Le terme peut désigner une clameur ou un cri de guerre. Le contexte militaire et la mention distincte du cor favorisent « cris de guerre ».
- source_word: בְּקוֹל שׁוֹפָר
  choice: au son du cor
  rationale: Le shofar est un cor, généralement fait d’une corne de bélier, employé notamment comme signal; « cor » est précis, naturel et distinct des trompettes métalliques.
theological_decisions:
- issue: Personnification de Moab dans וּמֵת מוֹאָב
  choice: Moab mourra
  alternative: Moab périra
  rationale: La traduction retient le sens direct de « mourir » et maintient la personnification collective sans l’atténuer ni expliquer théologiquement la nature du jugement.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste proche de la progression hébraïque, tout en évitant une répétition pesante des prépositions. « Qeriyoth » translittère le nom de lieu; « cor » rend concrètement le shofar.
