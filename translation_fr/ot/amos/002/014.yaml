base_translation:
  language: en
  yaml_path: translation/ot/amos/002/014.yaml
  text: Flight will perish from the swift[a], and the strong will not strengthen his power[d][c][b], and the warrior will not save his life.
translation:
  language: fr
  text: L’homme agile ne pourra pas fuir[a], le fort ne pourra pas mobiliser sa force, et le guerrier ne sauvera pas sa vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La fuite disparaîtra pour l’homme agile. » Autre traduction : « Toute échappatoire sera ôtée à l’homme agile. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne se sauvera pas lui-même ». Ici, le mot hébreu traduit par « vie » désigne la personne ou sa vie, et non spécifiquement l’âme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד מָנוֹס מִקָּל
  choice: Le plus rapide ne pourra plus fuir
  rationale: Littéralement, « la fuite disparaîtra pour le rapide ». La formulation française exprime naturellement la disparition de toute possibilité de fuite, tandis que la note conserve la forme imagée de l’hébreu.
- source_word: חָזָק
  choice: le fort
  rationale: Adjectif substantivé désignant l’homme fort; ce choix le distingue du גִּבּוֹר qui suit.
- source_word: יְאַמֵּץ כֹּחוֹ
  choice: ne pourra pas mobiliser sa force
  rationale: Le piel de אמץ avec כח évoque le fait d’affermir, de déployer ou de rassembler sa force. « Mobiliser sa force » est idiomatique en français et rend l’incapacité annoncée sans tautologie.
- source_word: גִּבּוֹר
  choice: le guerrier
  rationale: Dans ce contexte de défaite militaire, le terme désigne naturellement un combattant valeureux ou puissant.
- source_word: יְמַלֵּט נַפְשׁוֹ
  choice: ne sauvera pas sa vie
  rationale: מלט signifie ici sauver ou mettre hors de danger, et נפש désigne la vie ou la personne elle-même, non spécifiquement l’âme.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme ternaire est conservé. Les trois sujets restent au singulier comme dans l’hébreu, avec une valeur représentative.
