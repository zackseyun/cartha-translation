review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la succession des trois incapacités annoncées. Toutefois, « le plus rapide » introduit un superlatif absent de מִקָּל (« du/chez le rapide, l’homme agile »), et « ne pourra plus » ajoute une nuance temporelle (« plus désormais ») qui n’est pas explicitée par l’hébreu. « L’homme agile ne pourra pas fuir » exprime naturellement, sans ajout, la perte de toute possibilité de fuite.
  naturalness: Le français est globalement naturel, de registre courant et digne. « Mobiliser sa force » est idiomatique et constitue un bon équivalent contextuel de יְאַמֵּץ כֹּחוֹ. « L’homme agile » est plus naturel comme substantif personnel que « le rapide » tout en évitant le superlatif injustifié.
  terminology: « Le fort », « le guerrier » et « sauver sa vie » rendent adéquatement חָזָק, גִּבּוֹר et יְמַלֵּט נַפְשׁוֹ. La note sur נפש préserve justement le sens de « vie/personne », sans imposer le sens théologique d’« âme ».
  issues:
  - severity: medium
    issue: « Le plus rapide » traduit מִקָּל par un superlatif.
    rationale: קַל est un adjectif au sens de « rapide, agile »; le texte ne comporte pas de forme superlative. Il convient de conserver une désignation non comparative.
  - severity: low
    issue: « ne pourra plus fuir » ajoute « plus ».
    rationale: Le verset annonce que la fuite/possibilité de fuir sera ôtée; il ne marque pas explicitement une cessation temporelle par « ne… plus ». La formulation sans « plus » est plus sobre et plus proche de la portée du texte.
  revised_text: L’homme agile ne pourra pas fuir[a], le fort ne pourra pas mobiliser sa force, et le guerrier ne sauvera pas sa vie[b].
  revised_footnotes:
