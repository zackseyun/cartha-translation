  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י מוֹאָ֔ב וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל שָׂרְפ֛/וֹ עַצְמ֥וֹת מֶֽלֶךְ אֱד֖וֹם לַ/שִּֽׂיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/001.yaml
  text: 'Thus says Yahweh: “For three transgressions of Moab[a], and for four, I will not revoke it[b], because he burned the bones of the king of Edom to lime.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Pour trois révoltes de Moab, et pour quatre, je ne le révoquerai pas[a], parce qu’il a brûlé les os du roi d’Édom pour en faire de la chaux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne le ferai pas revenir ». Le référent du pronom n’est pas exprimé; dans le contexte, il renvoie vraisemblablement au jugement annoncé.'
    reason: lexical_alternative
  - marker: b
    text: Ou « en plâtre ». L’hébreu évoque des os brûlés au point d’être réduits en chaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Reproduit la formule prophétique solennelle au présent et rend directement le nom divin יהוה par « Yahweh ».
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל אַרְבָּעָה
  choice: Pour trois révoltes de Moab, et pour quatre
  rationale: Conserve la progression numérique caractéristique d’Amos. « Révoltes » exprime la dimension de rupture et de rébellion de פֶּשַׁע, au-delà du simple délit.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas la sentence
  rationale: Littéralement, « je ne le/la ferai pas revenir ». Dans cette formule d’Amos, il s’agit de ne pas retirer ou inverser la sentence annoncée; la note signale l’expression plus littérale et l’implicite du complément.
- source_word: עַל שָׂרְפוֹ
  choice: parce qu’il a brûlé
  rationale: עַל introduit ici le motif du jugement. Le suffixe de l’infinitif est au singulier; « il » représente Moab comme entité collective personnifiée.
- source_word: עַצְמוֹת מֶלֶךְ אֱדוֹם
  choice: les os du roi d’Édom
  rationale: Rend directement la chaîne construite hébraïque et identifie clairement l’objet de la profanation.
- source_word: לַשִּׂיד
  choice: pour en faire de la chaux
  rationale: שִׂיד désigne la chaux ou un matériau de plâtre, et non de simples cendres. Cette formulation naturelle indique que les os ont été calcinés jusqu’à devenir de la chaux.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Référent implicite de לֹא אֲשִׁיבֶנּוּ
  choice: la sentence
  alternative: je ne la retirerai pas / je ne le ferai pas revenir
  rationale: L’hébreu emploie un pronom dont le référent n’est pas nommé dans le verset. Le contexte de l’oracle indique la sentence ou le jugement, mais la note conserve l’ambiguïté formelle de l’expression.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La formule numérique et le singulier personnifiant Moab sont conservés. Les notes rendent visibles l’objet implicite du verbe et la portée matérielle de שִׂיד.
