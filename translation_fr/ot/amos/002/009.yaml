  text: וְ/אָ֨נֹכִ֜י הִשְׁמַ֤דְתִּי אֶת הָֽ/אֱמֹרִי֙ מִ/פְּנֵי/הֶ֔ם אֲשֶׁ֨ר כְּ/גֹ֤בַהּ אֲרָזִים֙ גָּבְה֔/וֹ וְ/חָסֹ֥ן ה֖וּא כָּֽ/אַלּוֹנִ֑ים וָ/אַשְׁמִ֤יד פִּרְי/וֹ֙ מִ/מַּ֔עַל וְ/שָׁרָשָׁ֖י/ו מִ/תָּֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/009.yaml
  text: Yet I destroyed the Amorite before them[a], whose height was like the height of cedars, and he was strong like the oaks[b]; I destroyed his fruit above and his roots beneath.
translation:
  language: fr
  text: Pourtant, moi, j’ai détruit devant eux l’Amoréen[a], lui qui était aussi grand que les cèdres et aussi robuste que les chênes. J’ai détruit son fruit en haut et ses racines en bas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Amoréens » : l’hébreu emploie le singulier « l’Amoréen » pour désigner collectivement ce peuple.'
    reason: lexical_alternative
  - marker: b
    text: Le « fruit » et les « racines » prolongent l’image de l’arbre et évoquent une destruction totale, de haut en bas.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Pourtant, moi
  rationale: La conjonction et le pronom emphatique marquent ici un contraste appuyé. « Pourtant, moi » rend naturellement ces deux valeurs.
- source_word: הִשְׁמַדְתִּי / וָאַשְׁמִיד
  choice: j’ai détruit / J’ai détruit
  rationale: Le hifil de שׁמד exprime la destruction. La répétition du même verbe conserve l’insistance rhétorique de l’hébreu.
- source_word: הָאֱמֹרִי
  choice: l’Amoréen
  rationale: Le singulier collectif hébreu est conservé afin de maintenir la personnification du peuple sous l’image d’un arbre gigantesque.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: Cette expression spatiale indique que Dieu a supprimé l’Amoréen de devant les Israélites; la formulation française reste concise et proche de l’image hébraïque.
- source_word: אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ
  choice: lui qui était aussi grand que les cèdres
  rationale: Cette formulation française naturelle exprime pleinement la comparaison de hauteur sans reproduire une répétition hébraïque lourde en français.
- source_word: וְחָסֹן הוּא כָּאַלּוֹנִים
  choice: et aussi robuste que les chênes
  rationale: « Robuste » évoque la vigueur et la solidité exprimées par חָסֹן, tandis que « chênes » est le rendu courant et accessible de אַלּוֹנִים dans ce contexte.
- source_word: פִּרְיוֹ מִמַּעַל
  choice: son fruit en haut
  rationale: Le terme concret « fruit » préserve la métaphore végétale plutôt que d’en imposer une interprétation comme « descendance ».
- source_word: וְשָׁרָשָׁיו מִתָּחַת
  choice: ses racines en bas
  rationale: La paire « en haut / en bas » rend le parallélisme et présente la destruction comme totale.
theological_decisions:
- issue: Singulier collectif désignant le peuple amoréen
  choice: Conserver « l’Amoréen » et les possessifs au singulier.
  alternative: 'Employer le pluriel : « les Amoréens… leurs fruits… leurs racines ».'
  rationale: L’hébreu personnifie collectivement le peuple comme un arbre unique. Le singulier conserve cette rhétorique sans décider qu’il s’agirait d’un individu.
- issue: Portée de l’image du fruit et des racines
  choice: Maintenir l’image concrète sans expliciter son référent dans le texte principal.
  alternative: Interpréter « fruit » comme « descendance » et « racines » comme « survivants » ou « fondements ».
  rationale: Le verset insiste sur une destruction complète au moyen d’une métaphore arboricole, mais il n’identifie pas explicitement chaque élément de l’image à une réalité précise.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme met en relief l’intervention divine et conserve le singulier collectif ainsi que la métaphore de l’arbre, tout en évitant une syntaxe artificiellement calquée sur l’hébreu.
