  text: וָ/אָקִ֤ים מִ/בְּנֵי/כֶם֙ לִ/נְבִיאִ֔ים וּ/מִ/בַּחוּרֵי/כֶ֖ם לִ/נְזִרִ֑ים הַ/אַ֥ף אֵֽין זֹ֛את בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/011.yaml
  text: And I raised up some of your sons to be prophets[a], and some of your young men to be Nazirites. Is this not so[b], O sons of Israel? declares Yahweh.
translation:
  language: fr
  text: Et j’ai suscité parmi vos fils des prophètes, et parmi vos jeunes hommes des naziréens[a]. N’en est-il pas ainsi, fils d’Israël[b] ? déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les « naziréens » étaient des personnes spécialement consacrées à Dieu par un vœu de naziréat ; on pourrait aussi traduire : « des consacrés ».'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « fils d’Israël » ; l’expression désigne collectivement le peuple d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקִים
  choice: Et j’ai suscité
  rationale: Le hiphil de קום signifie ici « faire se lever, susciter ». « Susciter » exprime naturellement en français l’action de Dieu qui fait apparaître et établit des personnes dans une fonction.
- source_word: מִבְּנֵיכֶם
  choice: parmi vos fils
  rationale: 'La préposition מִן a ici une valeur partitive : Dieu a choisi certains de leurs fils. « Parmi vos fils » conserve cette nuance sans ajouter explicitement « certains ».'
- source_word: לִנְבִיאִים
  choice: des prophètes
  rationale: 'Le לְ indique la fonction ou le résultat de l’action : Dieu a suscité ces fils comme prophètes. La construction française avec « susciter… des prophètes » rend ce rôle clairement.'
- source_word: וּמִבַּחוּרֵיכֶם
  choice: et parmi vos jeunes hommes
  rationale: בָּחוּר désigne des hommes jeunes, dans la force de l’âge. La formulation maintient le parallélisme partitif avec « parmi vos fils ».
- source_word: לִנְזִרִים
  choice: des naziréens
  rationale: נָזִיר est ici le terme technique désignant des personnes spécialement consacrées à Dieu selon le naziréat. « Naziréens » conserve cette institution particulière plutôt que de la réduire à une consécration générique.
- source_word: הַאַף אֵין זֹאת
  choice: N’en est-il pas ainsi
  rationale: Cette interrogation rhétorique appelle l’assentiment. La tournure retenue préserve son caractère affirmatif et solennel sans la surcharger.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: La formule signifie littéralement « fils d’Israël » et sert ici d’interpellation collective du peuple. Le masculin marqué du texte hébreu est conservé.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: נְאֻם introduit une déclaration divine solennelle et יְהוָה est rendu par le nom propre « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Traduction de נְזִרִים comme terme technique ou comme description
  choice: naziréens
  alternative: consacrés / personnes vouées à Dieu
  rationale: Le mot renvoie au statut reconnu du naziréat en Israël. Le terme technique évite d’effacer cette référence, tandis que la note en donne le sens au lecteur.
- issue: Maintien de la forme masculine בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: enfants d’Israël / peuple d’Israël
  rationale: La traduction conserve la forme masculine et l’image de la descendance présentes dans l’hébreu, tout en signalant en note la portée collective de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est maintenu par la répétition de « parmi », et l’interrogation rhétorique conserve sa force solennelle. La ponctuation fait de « déclare Yahweh » la formule prophétique finale sans ajouter une rupture absente du texte.
