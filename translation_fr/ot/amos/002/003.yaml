  naturalness: '« J’exterminerai de son sein celui qui gouverne » est lourd et peu idiomatique : l’enchaînement de « exterminer » avec « de son sein » sonne particulièrement artificiel. « Je ferai disparaître de son sein le juge » est clair, moderne et conserve le caractère solennel du jugement.'
  terminology: « Le juge » rend directement שׁוֹפֵט, sans exclure par la note son emploi plus large pour une autorité gouvernante dans ce contexte. « Dirigeants », « tuerai » et « Yahweh » conviennent. La note doit donc présenter « le gouvernant » comme possibilité contextuelle, plutôt que « le juge » comme alternative au choix paraphrastique.
