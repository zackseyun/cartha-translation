  text: וְ/הִכְרַתִּ֥י שׁוֹפֵ֖ט מִ/קִּרְבָּ֑/הּ וְ/כָל שָׂרֶ֛י/הָ אֶהֱר֥וֹג עִמּ֖/וֹ אָמַ֥ר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/003.yaml
  text: And I will cut off the judge from her midst[a], and I will kill all her officials with him,” says Yahweh.
translation:
  language: fr
  text: Je ferai disparaître de son sein le juge[a], et je tuerai avec lui tous ses dirigeants, dit Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le gouvernant » ; le terme hébreu désigne d’abord un juge, mais peut aussi désigner ici, plus largement, une autorité dirigeante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: J’exterminerai
  rationale: Le hiphil de כרת exprime ici une suppression décisive sous forme de jugement. « J’exterminerai » rend cette force plus naturellement en français que le calque « je retrancherai ».
- source_word: שׁוֹפֵט
  choice: celui qui gouverne
  rationale: שׁוֹפֵט désigne littéralement celui qui juge, mais peut aussi désigner un gouvernant. La formulation retenue exprime la fonction politique probable tout en évitant de préciser indûment un titre royal.
- source_word: מִקִּרְבָּהּ
  choice: de son sein
  rationale: Cette expression conserve l’idée d’une élimination opérée au milieu même de Moab, avec le suffixe féminin repris naturellement par « son » en français.
- source_word: וְכָל שָׂרֶיהָ
  choice: tous ses dirigeants
  rationale: שׂרים désigne les membres de l’élite dirigeante. « Dirigeants » est actuel et moins spécifiquement dynastique que « princes ».
- source_word: אֶהֱרֹג
  choice: je tuerai
  rationale: הרג signifie directement « tuer » ; ce choix moderne conserve sans atténuation la violence du jugement annoncé.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Le suffixe masculin singulier renvoie naturellement à שׁוֹפֵט et associe les dirigeants à son sort.
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: La formule prophétique est rendue sobrement au présent français, et le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Sens institutionnel de שׁוֹפֵט
  choice: celui qui gouverne
  alternative: le juge
  rationale: Le terme garde son arrière-plan judiciaire, mais le parallélisme avec les dirigeants de Moab favorise ici le sens plus large de gouvernant. Une note préserve l’autre lecture.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La transcription rend explicitement le nom propre présent dans l’hébreu au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, direct et solennel. Le vocabulaire évite à la fois l’archaïsme de « retrancher » et une précision institutionnelle absente de l’hébreu.
