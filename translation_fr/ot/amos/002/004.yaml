  to: 'Ainsi parle Yahweh :


    « Pour trois transgressions de Juda,

    et pour quatre, je ne reviendrai pas sur cela[a],

    parce qu’ils ont rejeté l’instruction de Yahweh[b]

    et n’ont pas observé ses prescriptions.


    Leurs mensonges[c] les ont égarés,

    ces mensonges que leurs ancêtres avaient suivis. »'
  rationale: La révision conserve les choix lexicaux solides du projet et les ambiguïtés importantes du texte hébreu. Elle remplace seulement une expression française peu naturelle par une formulation idiomatique qui ne nomme pas le jugement implicite, et emploie « transgressions », terme plus englobant et plus directement correspondant à פִּשְׁעֵי.
