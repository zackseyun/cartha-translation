  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יְהוּדָ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל מָאֳסָ֞/ם אֶת תּוֹרַ֣ת יְהוָ֗ה וְ/חֻקָּי/ו֙ לֹ֣א שָׁמָ֔רוּ וַ/יַּתְעוּ/ם֙ כִּזְבֵי/הֶ֔ם אֲשֶׁר הָלְכ֥וּ אֲבוֹתָ֖/ם אַחֲרֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/004.yaml
  text: 'Thus says Yahweh: “For three transgressions of Judah[a], and for four, I will not turn it back, because they have rejected the law of Yahweh and have not kept his statutes; and their lies have led them astray[c][b], after which their fathers walked.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh :


    « Pour trois transgressions de Juda,

    et pour quatre, je ne reviendrai pas sur cela[a],

    parce qu’ils ont rejeté l’instruction de Yahweh[b]

    et n’ont pas observé ses prescriptions.


    Leurs mensonges[c] les ont égarés,

    ces mensonges que leurs ancêtres avaient suivis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la formule peut se rendre par « je ne le ferai pas revenir ». Le pronom désigne probablement le jugement ou la peine annoncée ; on pourrait aussi traduire : « je ne le révoquerai pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « la loi de Yahweh ». Le mot hébreu peut désigner une instruction, un enseignement ou une loi.'
    reason: lexical_alternative
  - marker: c
    text: « Leurs mensonges » peut désigner plus précisément de faux dieux, des idoles ou les cultes trompeurs que leurs ancêtres avaient suivis.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: פִּשְׁעֵי
  choice: révoltes
  rationale: Le terme exprime des transgressions graves comportant une dimension de rébellion, notamment dans le cadre de l’alliance. « Révoltes » préserve cette force mieux que « fautes ».
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas cela
  rationale: 'La formule hébraïque est elliptique : le pronom renvoie vraisemblablement au jugement annoncé, sans que celui-ci soit explicitement nommé. Cette formulation française garde l’objet indéterminé tout en restant intelligible.'
- source_word: מָאֳסָם
  choice: ils ont rejeté
  rationale: « Rejeté » rend clairement le refus délibéré de l’enseignement de Yahweh sans ajouter l’idée plus affective de mépris.
- source_word: תּוֹרַת יְהוָה
  choice: l’instruction de Yahweh
  rationale: תּוֹרָה désigne fondamentalement un enseignement ou une instruction. Ce choix est naturel en français et évite de réduire ici le terme à une législation, tout en signalant « loi » comme traduction possible.
- source_word: חֻקָּיו
  choice: ses prescriptions
  rationale: « Prescriptions » exprime des dispositions normatives établies par Dieu et convient au contexte de l’alliance dans un français actuel.
- source_word: שָׁמָרוּ
  choice: n’ont pas observé
  rationale: Dans un contexte normatif, « observer » est l’équivalent français naturel du sens de garder et mettre en pratique.
- source_word: וַיַּתְעוּם
  choice: les ont égarés
  rationale: La forme causative indique que ces mensonges les ont fait dévier. « Égarés » conserve la métaphore du chemin et sa portée religieuse.
- source_word: כִּזְבֵיהֶם
  choice: leurs mensonges
  rationale: Le sens lexical direct est « mensonges » ou « faussetés ». Le terme peut désigner par métonymie de faux dieux ou des cultes trompeurs, mais le texte ne nomme pas explicitement des idoles.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם
  choice: ces mensonges que leurs ancêtres avaient suivis
  rationale: La formulation rend explicite en français l’antécédent du relatif sans en changer le référent. « Suivre » restitue naturellement l’expression hébraïque « marcher derrière », et « ancêtres » évite l’ambiguïté moderne de « pères ».
theological_decisions:
- issue: Objet de la formule de jugement לֹא אֲשִׁיבֶנּוּ
  choice: Maintenir l’objet indéterminé avec « je ne révoquerai pas cela ».
  alternative: « Je ne révoquerai pas mon jugement » ou « je ne renoncerai pas à les punir ».
  rationale: Le suffixe pronominal hébreu a un objet implicite, probablement le jugement ou la peine annoncée. Nommer directement le jugement ou la punition résoudrait une ellipse que le texte conserve.
- issue: Référent de כִּזְבֵיהֶם
  choice: Traduire littéralement par « leurs mensonges ».
  alternative: « Leurs faux dieux » ou « leurs idoles ».
  rationale: Dans le langage prophétique, les « mensonges » peuvent évoquer les idoles ou les pratiques cultuelles trompeuses suivies par les ancêtres. La traduction principale garde toutefois le terme plus large du texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes conserve le rythme de l’oracle. « Et même pour quatre » rend la progression numérique idiomatique. Les répétitions nécessaires ont été maintenues ou légèrement explicitées pour assurer un rattachement clair en français sans supprimer les ambiguïtés réelles de l’hébreu.
