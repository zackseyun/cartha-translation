  text: וְ/אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אוֹלֵ֨ךְ אֶתְ/כֶ֤ם בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה לָ/רֶ֖שֶׁת אֶת אֶ֥רֶץ הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/010.yaml
  text: Yet I brought you up from the land of Egypt[a], and I led you in the wilderness forty years, to take possession of the land of the Amorites.
translation:
  language: fr
  text: Pourtant, c’est moi qui vous ai fait monter du pays d’Égypte et qui vous ai conduits dans le désert pendant quarante ans, afin que vous preniez possession du pays des Amorites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays de l’Amorite » ; le singulier hébreu a ici un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Pourtant, c’est moi qui
  rationale: La conjonction et le pronom indépendant ont ici une valeur emphatique et contrastive. Cette formulation française souligne l’action bienveillante de Dieu en contraste avec les accusations du contexte.
- source_word: הֶעֱלֵיתִי
  choice: vous ai fait monter
  rationale: Le hiphil de עלה exprime littéralement le fait de faire monter. Cette tournure conserve l’image traditionnelle de la montée hors d’Égypte sans la réduire au seul sens de « faire sortir ».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Le choix conserve explicitement אֶרֶץ, « pays/terre », tout en restant idiomatique en français.
- source_word: וָאוֹלֵךְ
  choice: vous ai conduits
  rationale: Le hiphil de הלך avec un complément direct signifie faire aller ou conduire. « Conduire » exprime naturellement la direction exercée par Dieu.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme français courant dans le récit de l’Exode et rend naturellement מִדְבָּר avec la préposition בְּ.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: L’ajout idiomatique de « pendant » explicite en français la durée indiquée par l’expression hébraïque.
- source_word: לָרֶשֶׁת
  choice: afin que vous preniez possession de
  rationale: L’infinitif de ירשׁ peut évoquer la possession, l’héritage ou la dépossession. Dans ce contexte territorial, « prendre possession de » rend son sens actif sans imposer une lecture théologique supplémentaire.
- source_word: אֶרֶץ הָאֱמֹרִי
  choice: le pays des Amorites
  rationale: Bien que l’hébreu emploie le singulier collectif « l’Amorite », le pluriel français exprime clairement et naturellement le peuple visé; la forme source est signalée en note.
theological_decisions:
- issue: Le singulier collectif הָאֱמֹרִי (« l’Amorite »)
  choice: le pays des Amorites
  alternative: le pays de l’Amorite
  rationale: Le singulier hébreu désigne collectivement le peuple amorite. Le pluriel est plus naturel en français moderne et ne modifie pas la portée historique ou théologique du verset; la particularité de l’original est néanmoins conservée en note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La construction emphatique « c’est moi qui » restitue le relief rhétorique de אָנֹכִי. Le marqueur de note est placé après « Amorites », expression effectivement concernée par la variante lexicale.
