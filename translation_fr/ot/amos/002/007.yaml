id: AMO.2.7
reference: Amos 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/שֹּׁאֲפִ֤ים עַל עֲפַר אֶ֨רֶץ֙ בְּ/רֹ֣אשׁ דַּלִּ֔ים וְ/דֶ֥רֶךְ עֲנָוִ֖ים יַטּ֑וּ וְ/אִ֣ישׁ וְ/אָבִ֗י/ו יֵֽלְכוּ֙ אֶל הַֽ/נַּעֲרָ֔ה לְמַ֥עַן חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/007.yaml
  text: those who trample the head of the poor into the dust of the earth[a], and turn aside the way of the humble; and a man and his father go in to the same girl[d][c][b], so as to profane my holy name.
translation:
  language: fr
  text: eux qui écrasent la tête des pauvres dans la poussière du sol[a] et font dévier le chemin des humbles[b] ; un homme et son père ont des rapports avec la même jeune femme[c][d], afin de profaner mon saint nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « eux qui halètent après la poussière du sol sur la tête des pauvres ». Le verbe hébreu peut exprimer un désir intense, mais, dans ce contexte, il décrit probablement une oppression impitoyable.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « font dévier le chemin des affligés » ; le terme hébreu peut désigner les humbles, les affligés ou les opprimés.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « vont vers la jeune femme » ; il s’agit ici d’un euphémisme sexuel. Le mot peut aussi se traduire par « jeune fille ».'
    reason: lexical_alternative
  - marker: d
    text: Le verset ne présente pas explicitement cette jeune femme comme une prostituée sacrée, une servante ou une esclave, même si certains comprennent le passage comme une forme d’exploitation de ce genre.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁאֲפִים עַל עֲפַר אֶרֶץ בְּרֹאשׁ דַּלִּים
  choice: eux qui écrasent la tête des pauvres dans la poussière du sol
  rationale: Le participe שׁאף peut évoquer le fait de haleter après quelque chose ou de le convoiter avidement, mais, dans ce contexte d’oppression sociale, « écrasent » restitue naturellement la violence de l’image. La note conserve la lecture plus formelle et l’ambiguïté lexicale.
- source_word: וְדֶרֶךְ עֲנָוִים יַטּוּ
  choice: et font dévier le chemin des humbles
  rationale: Cette formulation garde la métaphore du chemin et la valeur causative de נטה. « Humbles » préserve la polysémie de עֲנָוִים, qui peut aussi désigner des personnes affligées, démunies ou opprimées.
- source_word: וְאִישׁ וְאָבִיו
  choice: un homme et son père
  rationale: La construction singulière est rendue directement, sans ajouter qu’ils agissent ensemble ni préciser la chronologie.
- source_word: יֵלְכוּ אֶל הַנַּעֲרָה
  choice: ont des rapports avec la même jeune femme
  rationale: Dans ce contexte, « aller vers » fonctionne comme un euphémisme sexuel. La formulation française rend le sens sans vulgarité. « La même » explicite naturellement que le père et le fils ont affaire à une seule femme, tandis que « jeune femme » convient au champ sémantique de נַעֲרָה sans suggérer nécessairement une enfant.
- source_word: לְמַעַן חַלֵּל
  choice: afin de profaner
  rationale: La formulation conserve la valeur de but ou de conséquence visée exprimée par לְמַעַן avec l’infinitif.
- source_word: אֶת שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: Expression française idiomatique qui conserve pleinement la portée religieuse de l’hébreu.
theological_decisions:
- issue: Nature de la première accusation
  choice: Présenter l’image comme l’écrasement violent des pauvres tout en signalant la lecture littérale incertaine.
  alternative: « eux qui convoitent avidement la poussière du sol sur la tête des pauvres »
  rationale: Le verbe hébreu permet une évocation du désir avide, mais cette lecture est obscure en français. Le texte principal exprime l’oppression indiquée par le contexte sans effacer l’autre analyse, conservée en note.
- issue: Nature de la faute sexuelle
  choice: Dire qu’un homme et son père ont des rapports avec la même jeune femme, sans préciser son statut.
  alternative: Y voir explicitement une prostituée sacrée, une servante ou une esclave exploitée.
  rationale: Le texte hébreu condamne une relation sexuelle impliquant le père, le fils et la même jeune femme, et la relie à la profanation du nom de Dieu. Il ne précise toutefois ni prostitution cultuelle ni condition servile ; ces interprétations ne doivent donc pas entrer dans le texte principal.
- issue: Portée de « afin de profaner »
  choice: Conserver la formulation de but, qui peut également exprimer le résultat recherché ou produit.
  alternative: « profanant ainsi »
  rationale: לְמַעַן peut exprimer le but ou une conséquence. La traduction formelle maintient la tension du texte au lieu de la réduire à une simple conséquence involontaire.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme accusatoire et les images concrètes sont conservés. Le point-virgule distingue les deux volets de l’accusation, tandis que les notes rendent visibles les ambiguïtés lexicales et historiques sans alourdir le texte principal.
