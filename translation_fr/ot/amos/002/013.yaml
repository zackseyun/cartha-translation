    text: Le texte hébreu est difficile. Littéralement, il évoque une forte pression « sous vous »; la construction peut aussi se comprendre comme un jugement qui les atteint là où ils se tiennent. Le verbe peut exprimer une action présente, vive, ou imminente.
    reason: lexical_and_syntactic_ambiguity
