revisions:
- from: Voici, je vais vous écraser sur place[a], comme un chariot chargé de gerbes écrase ce qui se trouve sous lui.
  to: Voici, je vais vous accabler là où vous êtes, comme un chariot chargé de gerbes pèse lourdement.[a]
  rationale: La révision élimine l’ambiguïté française de « sur place » et l’objet ajouté dans la comparaison. Elle maintient le sens de jugement accablant, l’image agricole et la réserve nécessaire devant la syntaxe contestée de l’hébreu, que la note explicite sans imposer une solution unique.
