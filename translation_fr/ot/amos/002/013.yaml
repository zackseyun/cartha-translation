review_pass:
  verdict: revise
  source_fidelity: Le texte principal interprète de façon admissible la construction difficile de תַּחְתֵּיכֶם comme « là où vous êtes », mais « sur place » est ambigu en français moderne (il peut vouloir dire « immédiatement »). La seconde moitié ajoute « ce qui se trouve sous lui », objet qui n’est pas exprimé dans l’hébreu. Une formulation plus neutre conserve l’image du chariot lourdement chargé sans sur-expliciter cet objet implicite.
  naturalness: « Voici » convient au registre prophétique moderne. « Je vais vous accabler là où vous êtes » est naturel, clair et moins mécaniquement violent que « vous écraser sur place ». « Comme un chariot chargé de gerbes pèse lourdement » est idiomatique et rend l’image sans une transitivité française artificielle.
  terminology: « Chariot » et « gerbes » sont exacts. « Accabler » rend bien l’idée de pression/poids dans le premier membre; « pèse lourdement » traduit la même image dans le second, tout en évitant de prétendre résoudre définitivement le sens précis du verbe rare.
  issues:
  - severity: medium
    issue: « sur place » est sémantiquement ambigu.
    rationale: En français actuel, l’expression peut évoquer une action immédiate (« abattre sur place ») plutôt que le sens local que l’interprétation de תַּחְתֵּיכֶם cherche à exprimer. « Là où vous êtes » est plus transparent.
  - severity: medium
    issue: La comparaison ajoute « ce qui se trouve sous lui ».
    rationale: L’hébreu ne formule pas cet objet. Il est peut-être impliqué par l’image, mais le rendre explicite réduit inutilement l’ambiguïté syntaxique et interprétative du texte.
  - severity: low
    issue: La note décrit trop littéralement la forme verbale.
    rationale: « Je fais pression sous vous » n’est pas une traduction française utilisable du syntagme hébreu et risque de donner l’impression qu’un objet et une direction sont grammaticalement déterminés. La note doit signaler la difficulté sans la figer.
  revised_text: Voici, je vais vous accabler là où vous êtes, comme un chariot chargé de gerbes pèse lourdement.[a]
