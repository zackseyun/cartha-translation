source:
  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י מֵעִ֖יק תַּחְתֵּי/כֶ֑ם כַּ/אֲשֶׁ֤ר תָּעִיק֙ הָ/עֲגָלָ֔ה הַֽ/מְלֵאָ֥ה לָ֖/הּ עָמִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/013.yaml
  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
translation:
  language: fr
  text: Voici, je vais vous accabler là où vous êtes, comme un chariot chargé de gerbes pèse lourdement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu est difficile. Littéralement, il évoque une forte pression « sous vous »; la construction peut aussi se comprendre comme un jugement qui les atteint là où ils se tiennent. Le verbe peut exprimer une action présente, vive, ou imminente.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit avec force l’annonce du jugement, dans un français actuel mais digne.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom hébreu indépendant souligne le sujet. En français, « voici, je » conserve suffisamment cette mise en relief sans alourdir par « moi-même ».
- source_word: מֵעִיק
  choice: je vais vous écraser
  rationale: Le participe hiphil exprime ici une pression accablante, présentée comme imminente. « Je vais » rend cette imminence, et « écraser » maintient l’image concrète du chariot lourdement chargé. L’objet « vous » est explicité d’après le contexte et la comparaison.
- source_word: תַּחְתֵּיכֶם
  choice: sur place
  rationale: Littéralement « sous vous ». Dans cette construction difficile, « sur place » exprime naturellement l’idée que le jugement les atteindra là où ils sont, tandis que la note conserve le sens spatial et l’ambiguïté de l’hébreu.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit simplement et naturellement la comparaison.
- source_word: תָּעִיק
  choice: écrase
  rationale: La répétition du même verbe français que dans la première proposition reflète la répétition hébraïque et relie directement le jugement à l’image du chariot.
- source_word: הָעֲגָלָה
  choice: un chariot
  rationale: Le chariot est générique dans la comparaison ; l’article indéfini est idiomatique en français.
- source_word: הַמְלֵאָה לָהּ
  choice: chargé
  rationale: Rend naturellement l’état du chariot rempli de sa charge, sans reproduire de manière artificielle le datif לָהּ.
- source_word: עָמִיר
  choice: de gerbes
  rationale: Désigne des tiges de céréales récoltées et rassemblées ; « gerbes » convient précisément à l’image agricole.
theological_decisions:
- issue: Objet et portée de la pression divine
  choice: « je vais vous écraser sur place »
  alternative: « je fais pression sous vous » / « je vais faire ployer ce qui est sous vous »
  rationale: La syntaxe et le lexique hébreux sont difficiles. Le texte principal suit le sens contextuel du jugement exercé contre Israël et l’image du chariot qui pèse sur ce qui se trouve dessous, sans transformer l’image en affirmation doctrinale plus précise. La note signale la lecture spatiale plus littérale.
translation_notes:
  register: Français international moderne, concret et solennel. « Voici » porte l’emphase de l’annonce prophétique. La formulation principale privilégie une image intelligible, tandis que la note préserve la difficulté syntaxique et les principales possibilités de l’hébreu.
