  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יִשְׂרָאֵ֔ל וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל מִכְרָ֤/ם בַּ/כֶּ֨סֶף֙ צַדִּ֔יק וְ/אֶבְי֖וֹן בַּ/עֲב֥וּר נַעֲלָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Israel[a], and for four, I will not revoke the punishment, because they sell the righteous for silver, and the needy for a pair of sandals.”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « À cause de trois rébellions d’Israël, et même de quatre, je ne reviendrai pas sur ma décision[a], parce qu’ils vendent le juste pour de l’argent et le pauvre pour une paire de sandales. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne le ramènerai pas » ou « je ne le ferai pas revenir ». Le référent du pronom n’est pas précisé en hébreu ; il peut désigner la décision ou le jugement annoncé.'
    reason: 'L’hébreu emploie un pronom à référent elliptique. La formulation française rend l’idiome de manière naturelle sans identifier ce référent au seul « châtiment ». '
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique solennelle et naturelle en français. Le nom divin est translittéré afin de représenter explicitement יְהוָה.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי יִשְׂרָאֵל וְעַל אַרְבָּעָה
  choice: À cause de trois révoltes d’Israël, et même de quatre
  rationale: « À cause de » exprime la valeur causale de עַל, tandis que « et même de quatre » restitue l’intensification numérique. « Révoltes » garde la dimension morale et relationnelle de פֶּשַׁע.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas le châtiment
  rationale: Cette formulation française rend naturellement l’idiome dans son contexte judiciaire. Comme l’objet reste elliptique en hébreu, cette explicitation interprétative est signalée par une note.
- source_word: מִכְרָם
  choice: parce qu’ils vendent
  rationale: L’infinitif construit avec suffixe indique le motif du jugement; une proposition verbale causale est idiomatique en français.
- source_word: בַּכֶּסֶף
  choice: pour de l’argent
  rationale: כֶּסֶף désigne littéralement l’argent-métal, mais « de l’argent » exprime naturellement ici le prix d’une transaction en français moderne.
- source_word: צַדִּיק
  choice: le juste
  rationale: « Le juste » conserve le vocabulaire de la justice tout en permettant le sens contextuel de celui qui est dans son droit.
- source_word: אֶבְיוֹן
  choice: le pauvre
  rationale: Le terme désigne une personne démunie. « Le pauvre » est clair, naturel et adapté au parallélisme social du verset.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: pour une paire de sandales
  rationale: La forme duale est naturellement rendue par « une paire de sandales »; l’expression souligne la valeur dérisoire de l’échange.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La translittération représente directement le nom propre de l’alliance sans lui substituer un titre confessionnel traditionnel.
- issue: Objet elliptique de לֹא אֲשִׁיבֶנּוּ
  choice: je ne révoquerai pas le châtiment
  alternative: je ne le révoquerai pas / je ne reviendrai pas là-dessus
  rationale: Le contexte indique un jugement qui ne sera pas retiré, mais l’hébreu ne nomme pas expressément son objet. Le texte principal privilégie l’intelligibilité et la note préserve l’ellipse originale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive propre aux oracles d’Amos est conservée, avec une syntaxe fluide et un vocabulaire non confessionnel.
