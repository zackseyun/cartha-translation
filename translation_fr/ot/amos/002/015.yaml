  text: וְ/תֹפֵ֤שׂ הַ/קֶּ֨שֶׁת֙ לֹ֣א יַעֲמֹ֔ד וְ/קַ֥ל בְּ/רַגְלָ֖י/ו לֹ֣א יְמַלֵּ֑ט וְ/רֹכֵ֣ב הַ/סּ֔וּס לֹ֥א יְמַלֵּ֖ט נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/015.yaml
  text: And the one who grasps the bow will not stand[a], and the swift of foot will not escape[c][b], and the rider of the horse will not save his life.
translation:
  language: fr
  text: Celui qui manie l’arc ne tiendra pas debout[a], celui qui est rapide à la course n’échappera pas, et le cavalier ne sauvera pas sa vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne tiendra pas sa position » ou « ne tiendra pas bon ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne s’échappera pas vivant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹפֵשׂ הַקֶּשֶׁת
  choice: celui qui manie l’arc
  rationale: L’expression participiale signifie littéralement « celui qui saisit/manie l’arc » et désigne un archer. Cette formulation naturelle conserve l’image concrète de l’hébreu sans la réduire à un titre professionnel.
- source_word: לֹא יַעֲמֹד
  choice: ne tiendra pas ferme
  rationale: Le verbe עמד signifie « se tenir debout, rester en place ». Dans ce contexte militaire, il exprime l’incapacité à résister ou à tenir sa position; « tenir ferme » rend cette portée tout en restant proche de l’image source.
- source_word: קַל בְּרַגְלָיו
  choice: celui qui court vite
  rationale: Littéralement « léger/rapide de ses pieds ». La formulation choisie est claire et naturelle en français moderne, et communique directement l’aptitude à la course.
- source_word: יְמַלֵּט
  choice: n’échappera pas
  rationale: À la deuxième proposition, le piel de מלט exprime le fait de se mettre hors de danger. « Échapper » est l’équivalent contextuel le plus naturel.
- source_word: רֹכֵב הַסּוּס
  choice: le cavalier
  rationale: Littéralement « celui qui monte le cheval ». « Le cavalier » restitue avec concision et naturel le référent singulier.
- source_word: יְמַלֵּט נַפְשׁוֹ
  choice: ne sauvera pas sa vie
  rationale: Dans ce contexte, נֶפֶשׁ désigne la vie ou la personne elle-même. « Sauver sa vie » rend clairement l’idée de survivre au jugement annoncé.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme ternaire et les formes singulières de l’hébreu sont conservés. « Celui qui manie l’arc » garde l’image concrète du texte, tandis que « cavalier » évite une tournure artificielle en français.
