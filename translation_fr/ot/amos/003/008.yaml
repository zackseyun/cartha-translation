reference: Amos 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַרְיֵ֥ה שָׁאָ֖ג מִ֣י לֹ֣א יִירָ֑א אֲדֹנָ֤/י יְהוִה֙ דִּבֶּ֔ר מִ֖י לֹ֥א יִנָּבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/008.yaml
  text: A lion has roared—who will not fear? The Lord GOD has spoken—who will not prophesy?[a][b]
translation:
  language: fr
  text: 'Un lion a rugi : qui n’aurait pas peur ? Le Seigneur YHWH[a] a parlé : qui ne prophétiserait pas ?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Seigneur YHWH ». YHWH est le nom propre divin, souvent transcrit « Yahvé » et traditionnellement rendu par « l’Éternel » ou « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou, en explicitant la force de la question : « qui pourrait s’empêcher de prophétiser ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: un lion
  rationale: Le nom commun désigne simplement le lion. En français, l’article indéfini exprime naturellement la valeur non déterminée du nom hébreu.
- source_word: שָׁאָג
  choice: a rugi
  rationale: Le parfait qal présente le rugissement comme accompli et déclenchant une réaction immédiate. Le passé composé convient au français actuel.
- source_word: מִי לֹא יִירָא
  choice: qui n’aurait pas peur ?
  rationale: La question rhétorique avec négation suppose que tout être humain aurait peur. Le conditionnel rend naturellement en français cette conséquence inévitable sans transformer l’énoncé en prédiction temporelle.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur YHWH
  rationale: Le titre associe « Seigneur » au nom divin YHWH. La translittération consonantique conserve explicitement le nom présent dans la source sans imposer comme certaine une vocalisation reconstruite.
- source_word: דִּבֶּר
  choice: a parlé
  rationale: Le parfait piel indique une parole accomplie. Le passé composé maintient le parallélisme avec « a rugi ».
- source_word: מִי לֹא יִנָּבֵא
  choice: qui ne prophétiserait pas ?
  rationale: La formulation reproduit directement la seconde question rhétorique et son parallélisme avec la première. Le verbe « prophétiser » est l’équivalent lexical précis, tandis que le conditionnel exprime la réaction qui s’impose.
theological_decisions:
- issue: Restitution du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur YHWH
  alternative: le Seigneur Yahvé ; le Seigneur, l’Éternel
  rationale: Le texte hébreu contient le nom propre divin après אֲדֹנָי. « YHWH » le signale sans effacer sa présence ni trancher définitivement la question de sa prononciation. Une note donne les principales formes françaises.
- issue: Force de la réponse prophétique
  choice: qui ne prophétiserait pas ?
  alternative: qui pourrait s’empêcher de prophétiser ?
  rationale: La traduction principale préserve la forme concise et ambiguë de la question hébraïque. L’alternative explicite davantage l’idée d’une réponse prophétique irrésistible, mais ajoute la notion de capacité ou d’empêchement.
translation_notes:
  register: Français international actuel, sobre et digne. Les deux propositions gardent un parallélisme serré grâce au passé composé suivi d’une question rhétorique au conditionnel. « Avoir peur » est plus naturel pour le grand public que « craindre » employé absolument, tout en conservant la force de la réaction au rugissement.
