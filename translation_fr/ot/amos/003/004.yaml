id: AMO.3.4
reference: Amos 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/יִשְׁאַ֤ג אַרְיֵה֙ בַּ/יַּ֔עַר וְ/טֶ֖רֶף אֵ֣ין ל֑/וֹ הֲ/יִתֵּ֨ן כְּפִ֤יר קוֹל/וֹ֙ מִ/מְּעֹ֣נָת֔/וֹ בִּלְתִּ֖י אִם לָכָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/004.yaml
  text: Does a lion roar in the forest when it has no prey? Does a young lion raise its voice from its den unless it has caught something?[a][b]
translation:
  language: fr
  text: Le lion rugit-il dans la forêt quand il n’a pas de proie ? Le jeune lion donne-t-il de la voix depuis sa tanière[a], à moins d’avoir capturé quelque chose[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis son repaire ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à moins d’avoir capturé ». L’objet est sous-entendu par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁאַג
  choice: rugit
  rationale: Le verbe désigne le cri puissant du lion ; « rugir » est l’équivalent français précis et naturel.
- source_word: אַרְיֵה
  choice: lion
  rationale: Terme courant et direct, qui conserve l’image et le parallélisme.
- source_word: בַּיַּעַר
  choice: dans la forêt
  rationale: יַעַר désigne couramment une forêt ou une région boisée ; « forêt » est clair en français moderne.
- source_word: טֶרֶף
  choice: proie
  rationale: Le nom évoque ce qui est pris ou déchiré par un prédateur ; « proie » convient au contexte de chasse.
- source_word: אֵין לוֹ
  choice: il n’a pas de
  rationale: Cette tournure hébraïque exprime l’absence ; la formulation retenue est idiomatique en français.
- source_word: יִתֵּן קוֹלוֹ
  choice: donne de la voix
  rationale: Littéralement « donne sa voix » ; l’expression française conserve l’image hébraïque tout en restant naturelle.
- source_word: כְּפִיר
  choice: jeune lion
  rationale: Le terme désigne un lion jeune et vigoureux, pas nécessairement un petit lionceau.
- source_word: מִמְּעֹנָתוֹ
  choice: depuis sa tanière
  rationale: Le nom désigne l’habitation ou le refuge de l’animal ; « tanière » est naturel et précis dans ce contexte.
- source_word: בִּלְתִּי אִם
  choice: à moins de
  rationale: La locution introduit une condition d’exception ; « à moins de » reproduit clairement cette relation.
- source_word: לָכָד
  choice: avoir capturé quelque chose
  rationale: Le verbe signifie saisir ou capturer. L’objet n’est pas exprimé en hébreu ; « quelque chose » complète naturellement la phrase sans préciser davantage que le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Les deux questions rhétoriques et leur parallélisme sont conservés. « Donne de la voix » maintient l’idiome imagé sans lourdeur, tandis que la note signale l’objet implicite du dernier verbe.
