id: AMO.3.1
reference: Amos 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל עַ֚ל כָּל הַ/מִּשְׁפָּחָ֔ה אֲשֶׁ֧ר הֶעֱלֵ֛יתִי מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/001.yaml
  text: 'Hear this word that Yahweh has spoken against you[a], sons of Israel, against the whole family that I brought up from the land of Egypt, saying:'
translation:
  language: fr
  text: 'Écoutez cette parole que Yahweh a prononcée contre vous, fils d’Israël[a], contre toute la famille que j’ai fait monter du pays d’Égypte :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants d’Israël », « Israélites » ou « peuple d’Israël ». L’hébreu dit littéralement « fils d’Israël » et désigne collectivement le peuple issu d’Israël.
    reason: Préciser le sens collectif et les équivalents idiomatiques de l’expression hébraïque sans effacer son image familiale.
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel introduit solennellement l’oracle prophétique. « Écoutez » est naturel en français tout en conservant la force de la sommation.
- source_word: הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: Dans ce contexte prophétique, דָּבָר désigne une parole divine; « parole » en préserve le caractère d’énoncé plutôt que de simple information.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh a prononcée
  rationale: Le passé composé rend naturellement l’accompli hébreu. « Prononcer une parole » évite la tournure française moins idiomatique « parler une parole ».
- source_word: עֲלֵיכֶם
  choice: contre vous
  rationale: Dans le contexte judiciaire de l’oracle, עַל indique que la parole est dirigée contre ses destinataires, et non seulement qu’elle les concerne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: Cette formulation reproduit l’expression familiale et collective de l’hébreu; une formulation française plus explicite est signalée en note.
- source_word: עַל כָּל הַמִּשְׁפָּחָה
  choice: contre toute la famille
  rationale: La répétition de « contre » conserve le parallélisme et la tonalité accusatrice. « Famille » maintient l’image de parenté collective portée par מִשְׁפָּחָה.
- source_word: הֶעֱלֵיתִי
  choice: j’ai fait monter
  rationale: Le hifil de עָלָה évoque littéralement l’action de faire monter Israël d’Égypte. Cette traduction préserve l’image traditionnelle de l’exode sans la remplacer par « faire sortir ».
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Formulation française directe qui conserve l’expression géographique de l’hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En fin de verset, la formule hébraïque introduit les paroles qui suivent. En français, les deux-points remplissent naturellement cette fonction sans ajouter un lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme nom personnel plutôt que de lui substituer un titre.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites; descendants d’Israël; peuple d’Israël
  rationale: « Fils d’Israël » conserve l’expression de filiation collective et sa portée d’alliance, tout en laissant la note préciser le sens inclusif du groupe.
- issue: Passage de la troisième à la première personne
  choice: « Yahweh a prononcée » puis « j’ai fait monter »
  alternative: harmoniser tout le verset à la troisième personne
  rationale: Le changement de personne est présent dans l’hébreu et marque l’intégration de la parole divine dans la formule introductive. Il est conservé plutôt que lissé.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe conserve la répétition accusatrice de « contre » et le changement de personne du texte hébreu. Les deux-points rendent sobrement la formule לֵאמֹר qui ouvre la suite de l’oracle.
