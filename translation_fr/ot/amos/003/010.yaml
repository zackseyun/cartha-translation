id: AMO.3.10
reference: Amos 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא יָדְע֥וּ עֲשׂוֹת נְכֹחָ֖ה נְאֻם יְהוָ֑ה הָ/אֽוֹצְרִ֛ים חָמָ֥ס וָ/שֹׁ֖ד בְּ/אַרְמְנֽוֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/010.yaml
  text: They do not know how to do what is right—oracle of Yahweh—those who store up violence and destruction in their citadels[a][b].
translation:
  language: fr
  text: Ils ne savent pas faire ce qui est droit — oracle de Yahweh — eux qui entassent la violence et la destruction dans leurs citadelles[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pillage » au lieu de « la destruction ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs palais » au lieu de « leurs citadelles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדְעוּ
  choice: ils ne savent pas
  rationale: Avec l’infinitif עֲשׂוֹת, le verbe exprime ici une ignorance pratique et morale, et non une simple absence d’information.
- source_word: עֲשׂוֹת נְכֹחָה
  choice: faire ce qui est droit
  rationale: Cette formulation naturelle conserve l’idée de droiture et de conduite juste portée par נְכֹחָה.
- source_word: נְאֻם יְהוָה
  choice: oracle de Yahweh
  rationale: « Oracle » maintient le registre prophétique formel de נְאֻם, tandis que « Yahweh » rend directement le nom divin.
- source_word: הָאֹצְרִים
  choice: eux qui entassent
  rationale: Le participe décrit des personnes qui accumulent de façon habituelle; « entassent » rend vivement cette accumulation.
- source_word: חָמָס
  choice: violence
  rationale: Le terme désigne ici la violence injuste et oppressive, sens fréquent dans les dénonciations prophétiques.
- source_word: שֹׁד
  choice: destruction
  rationale: Le mot peut évoquer la destruction violente ou le pillage; « destruction » forme en français un couple clair avec « violence », sans exclure l’autre sens signalé en note.
- source_word: בְּאַרְמְנוֹתֵיהֶם
  choice: dans leurs citadelles
  rationale: אַרְמוֹן peut désigner un palais fortifié ou une citadelle; ce choix met en valeur la puissance et la sécurité des élites, tout en conservant « palais » en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve ici le nom personnel plutôt que de lui substituer un titre.
- issue: Ignorance morale ou incapacité absolue dans לֹא יָדְעוּ עֲשׂוֹת נְכֹחָה
  choice: Ils ne savent pas faire ce qui est droit
  alternative: Ils ne savent pas ce qui est droit; ils sont incapables de faire ce qui est droit
  rationale: La formulation conserve l’accusation d’une corruption morale devenue pratique habituelle sans transformer explicitement le propos en affirmation d’incapacité totale.
translation_notes:
  register: Français international moderne, clair et digne. Le tour « oracle de Yahweh » conserve la solennité prophétique; « eux qui » reprend le participe hébreu avec une légère dislocation accusatrice. Les deux ambiguïtés lexicales importantes sont maintenues en notes.
