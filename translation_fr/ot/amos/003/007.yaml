source:
  edition: WLC
  text: כִּ֣י לֹ֧א יַעֲשֶׂ֛ה אֲדֹנָ֥/י יְהוִ֖ה דָּבָ֑ר כִּ֚י אִם גָּלָ֣ה סוֹד֔/וֹ אֶל עֲבָדָ֖י/ו הַ/נְּבִיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/007.yaml
  text: For the Lord GOD does nothing unless he reveals his secret to his servants the prophets[a].
translation:
  language: fr
  text: Car le Seigneur Yahweh ne fait rien sans révéler son secret à ses serviteurs, les prophètes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son conseil secret » ou « son projet confidentiel ». Le mot hébreu peut désigner une confidence, une délibération intime ou une affaire tenue secrète.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’affirmation précédente; « Car » rend naturellement ce lien logique.
- source_word: לֹא ... כִּי אִם
  choice: ne fait rien sans
  rationale: La construction négative suivie de l’exception signifie que Yahweh n’agit pas sans accomplir d’abord la révélation mentionnée; cette tournure est claire et idiomatique en français.
- source_word: יַעֲשֶׂה ... דָּבָר
  choice: ne fait rien
  rationale: Littéralement « ne fait pas une chose »; la formulation française condense naturellement עשה et דבר sans perte de sens.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette traduction conserve les deux éléments du titre hébreu, אֲדֹנָי et le nom divin יהוה, sans produire le redoublement « Seigneur SEIGNEUR ».
- source_word: גָּלָה
  choice: révéler
  rationale: Le verbe signifie « découvrir, dévoiler, révéler ». L’infinitif dépend naturellement de « sans » dans la construction française.
- source_word: סוֹדוֹ
  choice: son dessein secret
  rationale: סוד peut désigner une confidence, une délibération intime ou un projet tenu secret. « Dessein secret » garde à la fois l’idée de confidentialité et celle d’une intention communiquée, sans imposer un système théologique plus précis.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte prophétique, le terme souligne le service et la mission reçue de Dieu; « serviteurs » convient mieux que « esclaves ».
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: Traduction directe du nom défini au pluriel; l’apposition après « ses serviteurs » est rendue clairement par une virgule.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom יהוה. « Yahweh » le conserve, tandis que « le Seigneur » rend אֲדֹנָי; cette solution maintient donc les deux éléments distincts.
- issue: Portée de סוֹד
  choice: son dessein secret
  alternative: son secret
  rationale: « Dessein secret » exprime le contenu confidentiel communiqué aux prophètes tout en laissant ouverte la nuance exacte de סוד; la note signale ses autres valeurs possibles.
- issue: Caractère général de l’affirmation
  choice: présent de vérité générale
  alternative: formulation ponctuelle au futur
  rationale: La séquence verbale hébraïque énonce ici un principe général concernant l’action et la révélation divines; le présent français le rend sans élargir ni restreindre artificiellement l’énoncé.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la relation logique avec le contexte par « Car », le titre divin composé et l’ambiguïté sémantique de סוד au moyen d’une note.
