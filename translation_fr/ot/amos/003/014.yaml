source:
  edition: WLC
  text: כִּ֗י בְּ/י֛וֹם פָּקְדִ֥/י פִשְׁעֵֽי יִשְׂרָאֵ֖ל עָלָ֑י/ו וּ/פָֽקַדְתִּי֙ עַל מִזְבְּח֣וֹת בֵּֽית אֵ֔ל וְ/נִגְדְּעוּ֙ קַרְנ֣וֹת הַ/מִּזְבֵּ֔חַ וְ/נָפְל֖וּ לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/014.yaml
  text: For on the day when I punish Israel for his transgressions[a], I will also punish the altars of Bethel[b]; the horns of the altar will be cut off and fall to the ground.
translation:
  language: fr
  text: Car, le jour où je punirai Israël pour ses révoltes[a], je sévirai aussi contre les autels de Béthel. Les cornes de l’autel[b] seront tranchées et tomberont à terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jour où je demanderai compte à Israël de ses révoltes ». Le verbe hébreu peut signifier « intervenir à l’égard de quelqu’un », ici pour lui demander des comptes et le punir.
    reason: lexical_alternative
  - marker: b
    text: Les « cornes » étaient des saillies en forme de corne situées aux angles de l’autel et liées à son caractère sacré ainsi qu’à son usage rituel.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la déclaration précédente et conserve la valeur causale du terme hébreu.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Rend naturellement en français l’expression temporelle hébraïque sans nécessairement désigner une journée de vingt-quatre heures.
- source_word: פָּקְדִי
  choice: je punirai
  rationale: Dans ce contexte de jugement, פקד signifie demander des comptes et infliger une sanction. « Punirai » exprime clairement cette portée judiciaire.
- source_word: פִשְׁעֵי
  choice: révoltes
  rationale: פשע désigne des actes de rupture et de rébellion contre une autorité légitime ; « révoltes » en préserve la force, notamment dans le cadre de l’alliance.
- source_word: יִשְׂרָאֵל עָלָיו
  choice: Israël pour ses révoltes
  rationale: Le suffixe singulier renvoie au nom collectif Israël. En français, le possessif « ses » conserve naturellement ce rapport sans imposer un pronom genré.
- source_word: וּפָקַדְתִּי עַל
  choice: je sévirai aussi contre
  rationale: La reprise de פקד relie le jugement d’Israël à celui de ses lieux de culte. « Aussi » rend la coordination additive, tandis que « sévir contre » convient à des autels comme objets du jugement.
- source_word: מִזְבְּחוֹת בֵּית אֵל
  choice: les autels de Béthel
  rationale: Rend directement la chaîne construite hébraïque et conserve Béthel comme nom de lieu.
- source_word: וְנִגְדְּעוּ
  choice: seront tranchées
  rationale: גדע évoque l’action de couper ou d’abattre avec violence. « Tranchées » convient aux cornes saillantes de l’autel.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: les cornes de l’autel
  rationale: Conserve l’image cultuelle concrète des saillies en forme de corne placées aux angles de l’autel.
- source_word: וְנָפְלוּ לָאָרֶץ
  choice: et tomberont à terre
  rationale: Expression française naturelle décrivant le résultat physique de leur sectionnement.
theological_decisions:
- issue: Portée judiciaire du verbe פקד
  choice: je punirai / je sévirai aussi contre
  alternative: j’interviendrai contre / je demanderai des comptes à
  rationale: Le contexte impose une intervention divine de jugement, mais la note signale que le verbe hébreu a une gamme de sens plus large que la seule punition.
- issue: Force morale et relationnelle de פשׁע
  choice: révoltes
  alternative: transgressions
  rationale: « Révoltes » fait entendre l’idée fondamentale de rébellion sans réduire le terme à une infraction abstraite.
- issue: Maintien littéral de l’imagerie cultuelle
  choice: les cornes de l’autel
  alternative: les saillies de l’autel
  rationale: Les cornes sont des éléments matériels précis de l’autel et portent une importance rituelle. Les conserver évite d’aplanir l’image prophétique du sanctuaire frappé dans sa puissance symbolique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme du jugement porté contre Israël puis contre les autels, ainsi que l’image cultuelle concrète des cornes. La répétition hébraïque de פקד est rendue par deux expressions françaises adaptées à leurs compléments respectifs afin d’éviter une tournure artificielle.
