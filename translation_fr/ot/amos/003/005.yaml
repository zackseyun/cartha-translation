  text: הֲ/תִפֹּ֤ל צִפּוֹר֙ עַל פַּ֣ח הָ/אָ֔רֶץ וּ/מוֹקֵ֖שׁ אֵ֣ין לָ֑/הּ הֲ/יַֽעֲלֶה פַּח֙ מִן הָ֣/אֲדָמָ֔ה וְ/לָכ֖וֹד לֹ֥א יִלְכּֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/005.yaml
  text: Does a bird fall into a trap on the ground when there is no snare for it? Does a trap spring up from the ground when it has caught nothing at all?[a][b]
translation:
  language: fr
  text: Un oiseau tombe-t-il dans un piège sur le sol sans qu’il y ait pour lui un appât ?[a] Un piège se soulève-t-il du sol sans rien capturer ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans qu’il y ait pour lui un dispositif de piégeage » ; le terme hébreu peut désigner l’appât, ou plus largement ce qui attire l’oiseau ou déclenche le piège.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et capturer, il ne capture pas » ; cette construction hébraïque insistante signifie que le piège ne se soulève pas sans avoir effectivement capturé quelque chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִפֹּל
  choice: tombe
  rationale: Le sens premier du verbe נפל est « tomber ». Dans cette image de chasse, « tomber dans un piège » est naturel en français et évite de remplacer directement l’image par l’interprétation « être capturé ».
- source_word: צִפּוֹר
  choice: un oiseau
  rationale: Le nom désigne ici un oiseau de manière générale, sans permettre d’identifier une espèce particulière.
- source_word: פַּח
  choice: piège
  rationale: Le terme désigne un dispositif servant à capturer des oiseaux ou d’autres animaux. « Piège » est clair et convient à ses deux occurrences dans le verset.
- source_word: הָאָרֶץ
  choice: à terre
  rationale: Dans cette scène concrète de chasse, l’expression situe naturellement le piège au niveau du sol.
- source_word: מוֹקֵשׁ
  choice: collet
  rationale: « Collet » préserve dans le texte principal la distinction avec פַּח, rendu par « piège », tout en évoquant un dispositif destiné à prendre l’oiseau. Le mot hébreu peut toutefois désigner plus précisément l’appât ou le mécanisme déclencheur, possibilité signalée en note.
- source_word: אֵין לָהּ
  choice: sans qu’un collet lui soit tendu
  rationale: Cette formulation française exprime l’absence du dispositif destiné à l’oiseau et rend le suffixe pronominal féminin par « lui ».
- source_word: יַעֲלֶה
  choice: se soulève
  rationale: Le verbe עלה signifie « monter, s’élever ». Appliqué à un piège qui se déclenche, « se soulève » conserve le mouvement de l’image sans surinterprétation.
- source_word: הָאֲדָמָה
  choice: du sol
  rationale: Dans ce contexte, אֲדָמָה désigne le sol d’où le piège se soulève.
- source_word: וְלָכוֹד לֹא יִלְכּוֹד
  choice: sans avoir rien capturé
  rationale: La construction associant l’infinitif absolu au verbe conjugué donne ici une insistance à l’idée de capture. La formulation choisie rend naturellement la question rhétorique en français, tandis que la tournure hébraïque est explicitée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques et l’image concrète du piégeage sont conservées. La distinction entre פַּח et מוֹקֵשׁ est maintenue par « piège » et « collet », sans masquer en note l’ambiguïté lexicale du second terme.
