id: AMO.3.2
reference: Amos 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֚ק אֶתְ/כֶ֣ם יָדַ֔עְתִּי מִ/כֹּ֖ל מִשְׁפְּח֣וֹת הָ/אֲדָמָ֑ה עַל כֵּן֙ אֶפְקֹ֣ד עֲלֵי/כֶ֔ם אֵ֖ת כָּל עֲוֺנֹֽתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/002.yaml
  text: You only have I known from among all the families of the earth[b][a]; therefore I will punish you for all your iniquities.
translation:
  language: fr
  text: Je n’ai connu que vous parmi toutes les familles de la terre[a] ; c’est pourquoi je vous punirai pour toutes vos fautes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je n’ai choisi que vous » ou « Je n’ai reconnu que vous comme miens parmi toutes les familles de la terre ». En hébreu, « connaître » peut désigner ici une relation particulière, liée à l’alliance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je ferai retomber sur vous toutes vos fautes », c’est-à-dire : « je vous en demanderai compte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ne… que
  rationale: La tournure restrictive française exprime naturellement l’exclusivité mise en relief par רַק.
- source_word: יָדַעְתִּי
  choice: j’ai connu
  rationale: Le verbe garde son sens lexical de « connaître » tout en laissant entendre, sans l’expliciter à tort, la relation particulière et l’élection d’Israël.
- source_word: מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה
  choice: parmi toutes les familles de la terre
  rationale: « Familles » conserve l’image collective des groupes humains, et « terre » désigne ici largement le monde habité.
- source_word: עַל־כֵּן
  choice: c’est pourquoi
  rationale: Cette expression marque clairement que le jugement annoncé découle de la relation privilégiée évoquée auparavant.
- source_word: אֶפְקֹד עֲלֵיכֶם
  choice: je vous punirai
  rationale: Dans ce contexte judiciaire, פקד annonce que Dieu demandera compte des fautes et les sanctionnera ; « punirai » en donne clairement le sens en français actuel.
- source_word: עֲוֺנֹתֵיכֶם
  choice: toutes vos fautes
  rationale: « Fautes » exprime des actes moralement coupables dans une langue moderne et accessible ; le pluriel et « toutes » reproduisent la portée globale de l’hébreu.
theological_decisions:
- issue: Portée relationnelle et d’alliance de יָדַע
  choice: Maintenir « connu » dans le texte principal.
  alternative: Traduire par « choisi » ou « reconnu comme mien ».
  rationale: 'L’hébreu parle littéralement de connaissance, avec ici une forte dimension relationnelle et d’alliance. « Connu » préserve à la fois cette formulation et la tension du verset : le privilège de cette relation fonde une responsabilité accrue.'
- issue: Valeur judiciaire de פקד
  choice: Traduire par « punirai ».
  alternative: Traduire plus littéralement par « demanderai compte » ou « interviendrai contre vous au sujet de ».
  rationale: Avec les fautes comme objet du jugement, le verbe désigne ici une intervention punitive. La traduction principale reste immédiatement intelligible, tandis que la note conserve l’image hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe restrictive « ne… que » rend naturellement l’emphase initiale. « Connu » conserve l’ambiguïté féconde du verbe hébreu, expliquée en note ; « punirai » évite un calque obscur de l’idiome judiciaire.
