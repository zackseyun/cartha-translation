source:
  edition: WLC
  text: אִם יִתָּקַ֤ע שׁוֹפָר֙ בְּ/עִ֔יר וְ/עָ֖ם לֹ֣א יֶחֱרָ֑דוּ אִם תִּהְיֶ֤ה רָעָה֙ בְּ/עִ֔יר וַ/יהוָ֖ה לֹ֥א עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/006.yaml
  text: If a trumpet is blown in a city[a], do not the people tremble? If disaster happens in a city, has not Yahweh done it?
translation:
  language: fr
  text: Si l’on sonne du cor dans une ville, le peuple ne tremble-t-il pas ? S’il survient un malheur[a] dans une ville, n’est-ce pas Yahvé qui l’a fait ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une calamité ». Le mot hébreu peut aussi signifier « mal », mais il désigne ici un désastre ou un jugement, et non le mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַע שׁוֹפָר
  choice: l’on sonne du cor
  rationale: Le שׁוֹפָר est un cor utilisé notamment comme signal d’alarme. « Sonner du cor » est naturel en français et conserve cette fonction publique d’avertissement.
- source_word: בְּעִיר
  choice: dans une ville
  rationale: עִיר désigne couramment une ville ou une localité. La répétition de « dans une ville » maintient le parallélisme du verset.
- source_word: וְעָם
  choice: le peuple
  rationale: Dans ce contexte, עָם renvoie à la population de la ville. « Le peuple » restitue naturellement cette référence collective.
- source_word: יֶחֱרָדוּ
  choice: tremble
  rationale: חרד exprime le tremblement causé par la peur ou l’alarme. « Trembler » en conserve à la fois la dimension physique et émotionnelle.
- source_word: רָעָה
  choice: un malheur
  rationale: רָעָה peut désigner le mal, le malheur ou une calamité. Ici, le contexte d’alarme et de jugement indique un événement funeste plutôt que le mal moral.
- source_word: תִּהְיֶה
  choice: arrive
  rationale: Avec רָעָה comme sujet, « arriver » exprime naturellement en français la venue ou la réalisation d’un malheur.
- source_word: וַיהוָה
  choice: l’Éternel
  rationale: « L’Éternel » est une convention française établie pour rendre le nom divin יהוה tout en signalant qu’il s’agit du nom propre de Dieu.
- source_word: עָשָׂה
  choice: l’a fait
  rationale: עשה signifie largement « faire ». La formulation directe « l’a fait » conserve la force et la sobriété de l’attribution hébraïque sans l’atténuer par une paraphrase.
theological_decisions:
- issue: Sens de רָעָה en rapport avec l’action de l’Éternel
  choice: « un malheur » plutôt que « le mal »
  alternative: « une calamité » ou « le mal »
  rationale: Dans ce contexte prophétique, le terme désigne un désastre ou un jugement qui frappe la ville, non une faute morale. Ce choix évite de faire dire au texte que l’Éternel commet le mal moral, tout en maintenant son affirmation concernant le jugement.
- issue: Action divine dans la seconde question
  choice: « n’est-ce pas l’Éternel qui l’a fait ? »
  alternative: « l’Éternel ne l’a-t-il pas provoqué ? » ou « amené ? »
  rationale: La traduction conserve l’attribution directe du malheur à l’action de l’Éternel. Elle ne réduit pas la tension théologique du texte et reste proche du verbe général עשה, « faire ».
translation_notes:
  register: Français moderne, clair et digne. Les deux questions rhétoriques et leur parallélisme sont conservés. « Du cor » évoque plus précisément le שׁוֹפָר que « de la trompette », tandis que « l’on » convient au registre soutenu mais accessible.
