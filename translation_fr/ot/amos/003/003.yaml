  yaml_path: translation/ot/amos/003/003.yaml
  text: Do two walk together unless they have agreed to meet?[a]
translation:
  language: fr
  text: Deux personnes marchent-elles ensemble sans s’être donné rendez-vous ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans s’être mises d’accord » ou « sans avoir convenu de se rencontrer ». Le verbe hébreu évoque une rencontre fixée ou convenue d’avance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵלְכוּ
  choice: marchent-elles
  rationale: L’imparfait précédé de la particule interrogative introduit ici une question rhétorique à portée générale. Le présent français rend naturellement cette valeur proverbiale.
- source_word: שְׁנַיִם
  choice: deux personnes
  rationale: Le numéral désigne deux êtres humains dans ce contexte. « Deux personnes » évite en français l’emploi substantivé, plus ambigu, de « deux ».
- source_word: יַחְדָּו
  choice: ensemble
  rationale: Équivalent direct et naturel de l’adverbe signifiant « ensemble, conjointement ».
- source_word: בִּלְתִּי אִם
  choice: sans
  rationale: Dans cette interrogation rhétorique, « sans » suivi de l’infinitif passé exprime avec naturel la condition exceptive portée par la locution hébraïque.
- source_word: נוֹעָדוּ
  choice: s’être donné rendez-vous
  rationale: Le niphal de יעד peut exprimer le fait de convenir mutuellement d’une rencontre ou de se retrouver sur rendez-vous. Cette formulation conserve la réciprocité et le lien concret avec la marche commune.
