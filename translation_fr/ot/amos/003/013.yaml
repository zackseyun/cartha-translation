base_translation:
  language: en
  yaml_path: translation/ot/amos/003/013.yaml
  text: Hear and testify against the house of Jacob[a], declares the Lord GOD[b], the God of hosts.
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh, le Dieu des armées : Écoutez et témoignez contre la maison de Jacob[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendez témoignage dans la maison de Jacob » ou « auprès de la maison de Jacob ». Le verbe hébreu peut désigner un témoignage de caractère judiciaire, et la préposition permet plusieurs nuances ; le contexte de jugement favorise ici « contre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » rend naturellement en français l’appel prophétique solennel adressé à plusieurs personnes.
- source_word: וְהָעִידוּ
  choice: et témoignez contre
  rationale: L’impératif hiphil de עוד relève ici du témoignage, probablement dans un cadre judiciaire. « Témoignez contre » exprime clairement cette valeur accusatrice tout en restant idiomatique.
- source_word: בְּבֵית יַעֲקֹב
  choice: contre la maison de Jacob
  rationale: La préposition בְּ peut avoir ici une valeur hostile, soutenue par le contexte de jugement et par le verbe de témoignage. « Maison de Jacob » conserve la désignation collective et historique d’Israël.
- source_word: נְאֻם
  choice: déclare
  rationale: Cette formule prophétique introduit solennellement une parole divine. « Déclare » est courant, digne et naturel en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé associe אֲדֹנָי, « Seigneur », au nom divin YHWH. La traduction conserve les deux éléments sans masquer le nom propre.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: le Dieu des armées
  rationale: Cette traduction traditionnelle et intelligible préserve la portée ouverte de צְבָאוֹת, qui peut évoquer les armées ou puissances sous l’autorité divine sans préciser indûment leur nature.
theological_decisions:
- issue: Traduction du nom divin יְהוָה dans le titre composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » rend explicitement le nom divin présent dans l’hébreu, tandis que « Seigneur » traduit אֲדֹנָי. Cela évite de remplacer silencieusement le nom par un titre.
- issue: Portée de l’expression אֱלֹהֵי הַצְּבָאוֹת
  choice: le Dieu des armées
  alternative: le Dieu des puissances célestes
  rationale: Le texte ne précise pas si les צְבָאוֹת sont terrestres, célestes ou englobent l’ensemble des puissances. La formulation retenue préserve cette amplitude.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La citation directe met en relief les deux impératifs pluriels. « Maison de Jacob » et « Dieu des armées » sont conservés pour leur portée biblique et intertextuelle.
