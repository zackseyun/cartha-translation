  source_fidelity: 'Le rendu conserve correctement la progression et les principaux éléments du texte hébreu : לָכֵן (« C’est pourquoi »), la formule divine אַדֹנָי יְהוִה (« le Seigneur Yahweh »), l’adversaire singulier et non identifié, l’encerclement elliptique du pays, la dépossession de la puissance, puis le pillage des אַרְמְנוֹת. « Un adversaire encerclera le pays » est une explicitation idiomatique et contextuellement justifiée de צַר וּסְבִיב הָאָרֶץ, sans identification indue de l’ennemi.'
