id: AMO.3.11
reference: Amos 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צַ֖ר וּ/סְבִ֣יב הָ/אָ֑רֶץ וְ/הוֹרִ֤ד מִמֵּ/ךְ֙ עֻזֵּ֔/ךְ וְ/נָבֹ֖זּוּ אַרְמְנוֹתָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/011.yaml
  text: 'Therefore[a], thus says the Lord GOD: An adversary shall surround the land, and he shall bring down your strength from you[b], and your citadels shall be plundered.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh :

    « Un adversaire[a] encerclera le pays ;

    il t’enlèvera ta puissance,

    et tes citadelles[b] seront pillées. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un ennemi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tes palais ». Le mot hébreu peut désigner des palais ou des résidences fortifiées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence annoncée par le prophète.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans les confondre en une répétition de « Seigneur ».
- source_word: צַר וּסְבִיב הָאָרֶץ
  choice: Un adversaire encerclera le pays
  rationale: La formulation hébraïque est très concise et elliptique. Cette traduction explicite la menace d’encerclement suggérée par « adversaire » et « autour du pays », tout en conservant le singulier.
- source_word: וְהוֹרִד מִמֵּךְ עֻזֵּךְ
  choice: il t’enlèvera ta puissance
  rationale: Le hiphil de ירד indique que l’adversaire fera descendre ou disparaître la puissance de la destinataire. « Enlever ta puissance » est naturel en français et garde l’idée de dépossession exprimée par מִמֵּךְ.
- source_word: וְנָבֹזּוּ
  choice: seront pillées
  rationale: Le niphal décrit ce que les envahisseurs feront subir aux citadelles ; « piller » convient précisément au contexte militaire.
- source_word: אַרְמְנוֹתָיִךְ
  choice: tes citadelles
  rationale: Le mot peut désigner des palais ou des bâtiments fortifiés. « Citadelles » met en valeur ici la sécurité politique et militaire que le jugement renversera, sans exclure la fonction de résidence prestigieuse signalée en note.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction distingue le titre « Seigneur » du nom propre divin et rend explicitement le tétragramme, conformément à sa présence dans le texte hébreu.
- issue: Identité de l’adversaire
  choice: Un adversaire
  alternative: L’ennemi
  rationale: Le texte ne nomme pas ici la puissance envahissante. L’indéfini maintient cette ouverture au lieu d’identifier implicitement un acteur précis.
translation_notes:
  register: 'Français moderne, clair et solennel. Le tutoiement féminin singulier de l’hébreu est conservé, la ville ou le pays personnifié étant directement interpellé. La structure poétique en trois lignes souligne la progression : encerclement, perte de puissance, pillage.'
