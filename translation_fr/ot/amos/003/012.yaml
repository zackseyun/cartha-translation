- from: 'Ainsi parle Yahweh : Comme le berger arrache à la gueule du lion deux pattes ou un bout d’oreille, ainsi seront arrachés les Israélites[a] qui habitent à Samarie, avec un coin de lit et le divan de Damas[b].'
