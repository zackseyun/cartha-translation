source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ כַּ/אֲשֶׁר֩ יַצִּ֨יל הָ/רֹעֶ֜ה מִ/פִּ֧י הָ/אֲרִ֛י שְׁתֵּ֥י כְרָעַ֖יִם א֣וֹ בְדַל אֹ֑זֶן כֵּ֣ן יִנָּצְל֞וּ בְּנֵ֣י יִשְׂרָאֵ֗ל הַ/יֹּֽשְׁבִים֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/פְאַ֥ת מִטָּ֖ה וּ/בִ/דְמֶ֥שֶׁק עָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/012.yaml
  text: 'Thus says Yahweh: As the shepherd rescues from the mouth of the lion two legs or a piece of an ear[b][a], so will the sons of Israel who dwell in Samaria be rescued—with the corner of a bed and the cover of a couch.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Comme le berger arrache à la gueule du lion deux pattes ou un bout d’oreille, ainsi seront arrachés les Israélites[a] qui habitent à Samarie, dans un coin de lit et sur un divan à Damas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset est difficile. L’hébreu dit littéralement : « dans un coin de lit et à Damas, un divan ». Il pourrait être question d’un mobilier luxueux ; d’autres comprennent « un divan damassé » ou proposent une autre analyse de l’expression.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Comme… ainsi
  rationale: Conserve explicitement la structure comparative de l’hébreu dans un français soutenu et naturel.
- source_word: יַצִּיל / יִנָּצְלוּ
  choice: arrache / seront arrachés
  rationale: Maintient le lien lexical entre les deux formes de נצל et rend vive l’image de restes retirés de la gueule du lion.
- source_word: הָרֹעֶה
  choice: le berger
  rationale: Respecte l’article hébreu et convient à l’exemple générique.
- source_word: מִפִּי הָאֲרִי
  choice: à la gueule du lion
  rationale: Expression française idiomatique qui préserve l’image concrète; « gueule » est le terme naturel pour la bouche d’un lion.
- source_word: שְׁתֵּי כְרָעַיִם
  choice: deux pattes
  rationale: Dans ce contexte animal, « pattes » est plus naturel et précis que « jambes », tout en conservant l’image des maigres restes.
- source_word: בְדַל אֹזֶן
  choice: un bout d’oreille
  rationale: Rend clairement le sens de fragment détaché porté par בְדַל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent collectif courant en français de l’expression idiomatique « fils d’Israël », sans suggérer qu’il ne s’agit que des hommes.
- source_word: הַיֹּשְׁבִים בְּשֹׁמְרוֹן
  choice: qui habitent à Samarie
  rationale: Rend naturellement le participe et le complément de lieu.
- source_word: בִּפְאַת מִטָּה
  choice: avec un coin de lit
  rationale: Conserve la formulation concise et obscure du texte massorétique sans imposer une interprétation locative.
- source_word: וּבִדְמֶשֶׁק עָרֶשׂ
  choice: et le divan de Damas
  rationale: Suit les consonnes et la vocalisation massorétiques, distingue עָרֶשׂ de מִטָּה et réserve les autres analyses plausibles à la note.
theological_decisions:
- issue: Portée du salut évoqué par la comparaison
  choice: Préserver l’image ironique d’un sauvetage réduit à de misérables restes
  alternative: Formuler une délivrance générale ou substantielle des habitants de Samarie
  rationale: Les deux pattes et le bout d’oreille ne représentent pas un sauvetage triomphal, mais les seuls restes récupérés après la destruction; le français ne doit pas atténuer ce jugement.
- issue: Interprétation de la dernière expression obscure
  choice: Conserver en texte principal la lecture massorétique « le divan de Damas »
  alternative: « un divan damassé », « un divan à Damas » ou une compréhension liée à la couverture d’un divan
  rationale: L’hébreu est difficile et les solutions proposées restent incertaines. La traduction principale garde la lecture transmise, tandis que la note expose les possibilités sans en ériger une en certitude.
translation_notes:
  register: Français international moderne, digne et prophétique. La syntaxe « Comme… ainsi » conserve la solennité de l’oracle. Les images concrètes restent abruptes, et l’obscurité réelle de la dernière expression n’est pas gommée.
