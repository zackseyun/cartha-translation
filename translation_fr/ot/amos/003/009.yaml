  text: הַשְׁמִ֨יעוּ֙ עַל אַרְמְנ֣וֹת בְּ/אַשְׁדּ֔וֹד וְ/עַֽל אַרְמְנ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אִמְר֗וּ הֵאָֽסְפוּ֙ עַל הָרֵ֣י שֹׁמְר֔וֹן וּ/רְא֞וּ מְהוּמֹ֤ת רַבּוֹת֙ בְּ/תוֹכָ֔/הּ וַ/עֲשׁוּקִ֖ים בְּ/קִרְבָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/009.yaml
  text: Proclaim to the citadels of Ashdod and to the citadels in the land of Egypt[a], and say, “Assemble on the mountains of Samaria, and see the many tumults within her[d][c][b], and the oppressed in her midst.”
translation:
  language: fr
  text: 'Faites entendre ceci dans les citadelles d’Asdod et dans les citadelles du pays d’Égypte[a] ; dites : « Rassemblez-vous sur les montagnes de Samarie[b] ! Voyez les nombreux désordres en son sein[c], et les opprimés au milieu d’elle[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « palais » au lieu de « citadelles ». Le terme hébreu peut désigner de grandes résidences fortifiées.
    reason: lexical_alternative
  - marker: b
    text: Ou « les collines de Samarie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la grande agitation » ou « les nombreux troubles ».
    reason: lexical_alternative
  - marker: d
    text: Ou « les actes d’oppression ». La forme hébraïque peut recevoir une lecture plus abstraite, mais « les opprimés » correspond bien à sa forme passive et au contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: Proclamez ceci
  rationale: Le hiphil impératif de שׁמע appelle ici à faire entendre publiquement un message. « Proclamez ceci » rend naturellement cette valeur causative sans lourdeur.
- source_word: עַל אַרְמְנוֹת
  choice: sur les citadelles
  rationale: עַל conserve l’image d’une annonce faite sur ou depuis les édifices élevés. אַרְמְנוֹת désigne des résidences monumentales souvent fortifiées ; « citadelles » maintient à la fois leur prestige et leur caractère défensif.
- source_word: בְּאַשְׁדּוֹד
  choice: d’Asdod
  rationale: Après « citadelles », le complément de nom est idiomatique en français pour désigner celles qui se trouvent à Asdod, sans changer le sens locatif de la préposition hébraïque.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: La formulation développée de l’hébreu est conservée. Avec « citadelles », le complément de nom donne une phrase française fluide.
- source_word: הֵאָסְפוּ
  choice: Rassemblez-vous
  rationale: L’impératif niphal constitue une convocation adressée aux témoins étrangers ; « Rassemblez-vous » est direct et naturel.
- source_word: הָרֵי שֹׁמְרוֹן
  choice: les montagnes de Samarie
  rationale: הַר peut désigner une montagne ou une colline. « Montagnes » est le correspondant direct et préserve l’idée d’un point d’observation élevé.
- source_word: מְהוּמֹת רַבּוֹת
  choice: les nombreux désordres
  rationale: Le pluriel מְהוּמוֹת évoque agitation, confusion et troubles collectifs. « Nombreux désordres » garde le pluriel et évite de préciser abusivement leur nature.
- source_word: בְּתוֹכָהּ
  choice: qui y règnent
  rationale: Le pronom adverbial « y » renvoie naturellement à Samarie. « Règnent » explicite idiomatiquement la présence intérieure indiquée par בְּתוֹכָהּ sans ajouter de cause.
- source_word: עֲשׁוּקִים
  choice: les opprimés
  rationale: La forme passive plurielle se comprend le plus naturellement comme substantivée et désigne les personnes victimes d’oppression, plutôt que des actes abstraits.
- source_word: בְּקִרְבָּהּ
  choice: qui sont en son sein
  rationale: Cette expression conserve l’image spatiale et la personnification féminine de la ville, tout en variant par rapport au premier complément de lieu.
theological_decisions:
- issue: Référent de עֲשׁוּקִים dans la description de Samarie
  choice: Le texte désigne les personnes opprimées présentes dans Samarie.
  alternative: Le terme pourrait être compris abstraitement comme « les actes d’oppression » ou « les oppressions ».
  rationale: La morphologie passive et substantivable favorise « les opprimés ». Cette lecture met les victimes au premier plan sans ajouter une interprétation doctrinale ; l’autre possibilité est signalée en note afin de préserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Le ton impératif et public de l’oracle est maintenu. La ponctuation clarifie les deux ordres successifs sans atténuer la vigueur prophétique. Tous les appels de note figurent immédiatement après les expressions concernées.
