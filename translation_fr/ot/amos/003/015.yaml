  text: וְ/הִכֵּיתִ֥י בֵית הַ/חֹ֖רֶף עַל בֵּ֣ית הַ/קָּ֑יִץ וְ/אָבְד֞וּ בָּתֵּ֣י הַ/שֵּׁ֗ן וְ/סָפ֛וּ בָּתִּ֥ים רַבִּ֖ים נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
translation:
  language: fr
  text: Je frapperai la maison d’hiver avec la maison d’été ; les maisons d’ivoire[a] disparaîtront, et de nombreuses maisons seront anéanties — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se comprendre plus explicitement ainsi : « les maisons ornées d’ivoire ». Il s’agit probablement de demeures luxueuses décorées d’incrustations d’ivoire, et non de maisons littéralement construites en ivoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: Je frapperai
  rationale: Le verbe נכה exprime l’action de frapper. Cette formulation directe préserve la force du jugement divin sans préciser indûment le mode de destruction.
- source_word: בֵית הַחֹרֶף עַל בֵּית הַקָּיִץ
  choice: la maison d’hiver avec la maison d’été
  rationale: Les deux groupes désignent vraisemblablement des résidences saisonnières. « Avec » rend ici עַל comme associant les deux objets du jugement, tout en maintenant le parallélisme.
- source_word: וְאָבְדוּ
  choice: disparaîtront
  rationale: אבד peut signifier périr, disparaître ou être perdu. Appliqué aux maisons, « disparaîtront » est naturel en français et conserve la tournure intransitive.
- source_word: בָּתֵּי הַשֵּׁן
  choice: les maisons d’ivoire
  rationale: La traduction reproduit l’image concise de l’hébreu. Il s’agit probablement de demeures luxueuses ornées d’incrustations d’ivoire, précision donnée en note.
- source_word: וְסָפוּ
  choice: prendront fin
  rationale: Le verbe סוף indique ici l’arrivée à une fin. La traduction évite de préciser un mécanisme de destruction que le texte ne nomme pas.
- source_word: בָּתִּים רַבִּים
  choice: de nombreuses maisons
  rationale: רַבִּים a naturellement un sens quantitatif, « nombreuses », plutôt que qualitatif, « grandes ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule française solennelle rend la formule prophétique נְאֻם et conserve le nom divin personnel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- issue: Portée de רַבִּים
  choice: de nombreuses maisons
  alternative: de grandes maisons
  rationale: Le contexte évoque certes le luxe, mais l’adjectif est le plus naturellement quantitatif. La traduction ne transforme donc pas cette possible implication contextuelle en sens lexical explicite.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme en trois propositions conserve l’accumulation du jugement. « Maison d’hiver » et « maison d’été » maintiennent le contraste social et saisonnier de l’hébreu.
