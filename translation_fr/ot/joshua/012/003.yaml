  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: fr
  text: ainsi que l’Arabah[a] jusqu’à la mer de Kinnereth, à l’est, et jusqu’à la mer de l’Arabah, la mer du Sel[b], à l’est, en direction de Beth-Yeshimoth, et vers le sud, au-dessous des pentes du Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’Arabah désigne ici vraisemblablement la grande dépression du Jourdain, plutôt qu’une plaine au sens général.
    reason: lexical_alternative
  - marker: b
    text: La « mer de l’Arabah, la mer du Sel » est celle qui sera plus tard couramment appelée la mer Morte.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: la Araba
  rationale: Le terme est conservé comme nom géographique de la grande dépression du Jourdain plutôt que rendu par le générique « plaine ».
- source_word: יָם כִּנְרוֹת
  choice: la mer de Kinnereth
  rationale: Cette formulation conserve le nom hébreu et la désignation « mer » du texte source.
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: Rendu adverbial naturel en français, adapté à une description territoriale concise.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: la mer de la Araba, la mer du Sel
  rationale: La juxtaposition explicative de l’hébreu est préservée sans substituer le nom moderne « mer Morte ».
- source_word: דֶּרֶךְ
  choice: en direction de
  rationale: Dans cette délimitation géographique, cette expression indique naturellement l’orientation sans imposer l’idée d’un itinéraire précis.
- source_word: בֵּית הַיְשִׁמוֹת
  choice: Beth-Yeshimoth
  rationale: Le toponyme est translittéré en suivant des conventions françaises lisibles.
- source_word: וּמִתֵּימָן
  choice: puis vers le sud
  rationale: Le contexte topographique favorise une indication directionnelle; « vers le sud » maintient toutefois la portée sans préciser indûment s’il s’agit d’un mouvement ou d’un côté.
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: au-dessous des pentes du Pisga
  rationale: La formulation rend clairement la relation topographique et le sens de אַשְׁדּוֹת comme pentes ou déclivités.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible; syntaxe de liste géographique conservée. L’élision est évitée devant « Araba » afin que le toponyme reste immédiatement reconnaissable. Les marqueurs [a] et [b] figurent dans le texte principal.
