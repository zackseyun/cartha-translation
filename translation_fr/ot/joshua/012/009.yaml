- source_word: אֲשֶׁר
  choice: qui
  rationale: Introduit naturellement en français une proposition relative décrivant Aï.
- source_word: מִצַּד
  choice: à côté de
  rationale: Rend clairement la relation spatiale de proximité, sans préciser davantage que l’hébreu la position exacte.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française traditionnelle et courante du nom de lieu.
