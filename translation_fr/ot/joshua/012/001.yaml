  naturalness: Le français est globalement clair et moderne. La coordination finale gagne en naturel et en précision avec « ainsi que toute l’Araba à l’est ».
  terminology: « fils d’Israël », « torrent de l’Arnon », « mont Hermon » et « Araba » sont appropriés. « Prirent possession du territoire » rend ירשׁ plus directement que « conquirent le territoire », qui peut renforcer inutilement l’idée d’action militaire déjà exprimée par « vainquirent ».
