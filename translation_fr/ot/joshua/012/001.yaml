source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: fr
  text: Voici les rois du pays que les fils d’Israël[a] vainquirent et dont ils prirent possession du territoire, de l’autre côté du Jourdain, du côté du soleil levant[b], depuis le torrent de l’Arnon[c] jusqu’au mont Hermon, ainsi que toute l’Araba[d], à l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ; littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « du côté du lever du soleil », c’est-à-dire à l’est.
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut désigner un cours d’eau torrentiel ou la vallée dans laquelle il coule ; on peut aussi traduire « la vallée de l’Arnon ».
    reason: cultural_note
  - marker: d
    text: Ou « la plaine ». L’Araba est ici un terme géographique désignant la région de la grande dépression.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne la liste qui suit, sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: מַלְכֵי הָאָרֶץ
  choice: les rois du pays
  rationale: Conserve la construction et la portée territoriale générale de הָאָרֶץ.
- source_word: אֲשֶׁר הִכּוּ
  choice: que ... vainquirent
  rationale: Dans ce contexte militaire, נכה désigne le fait de frapper et de défaire; « vainquirent » restitue le sens sans affirmer explicitement que chaque roi fut tué.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque tout en signalant en note l’équivalent collectif courant « les Israélites ».
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: et dont ils conquirent le territoire
  rationale: Dans le cadre de la conquête, ירשׁ exprime la prise de possession. Cette formulation française naturelle conserve aussi le lien possessif avec les rois.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Rend l’expression spatiale sans supprimer son caractère relatif; la précision suivante indique le côté oriental.
- source_word: מִזְרְחָה הַשָּׁמֶשׁ
  choice: du côté du soleil levant
  rationale: Préserve l’image hébraïque du lever du soleil tout en restant immédiatement compréhensible.
- source_word: מִנַּחַל אַרְנוֹן
  choice: depuis le torrent de l’Arnon
  rationale: נחל peut désigner le cours d’eau torrentiel comme la vallée où il coule; « torrent » convient au contexte géographique et au français biblique moderne.
- source_word: עַד הַר חֶרְמוֹן
  choice: jusqu’au mont Hermon
  rationale: Marque clairement la limite septentrionale de l’étendue territoriale.
- source_word: וְכָל הָעֲרָבָה
  choice: ainsi que dans toute l’Araba
  rationale: Conserve le nom géographique spécifique de la région de la grande dépression plutôt que de le réduire au terme générique « plaine ».
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: Rend simplement et naturellement l’indication adverbiale finale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement de l’énumération hébraïque tout en évitant une formulation possessive maladroite. Les images et termes géographiques spécifiques sont conservés et brièvement explicités en note.
