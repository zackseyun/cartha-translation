revisions:
- from: Voici les rois du pays que les fils d’Israël[a] vainquirent et dont ils conquirent le territoire, de l’autre côté du Jourdain, du côté du soleil levant[b], depuis le torrent de l’Arnon[c] jusqu’au mont Hermon, ainsi que dans toute l’Araba[d], à l’est.
  to: Voici les rois du pays que les fils d’Israël[a] vainquirent et dont ils prirent possession du territoire, de l’autre côté du Jourdain, du côté du soleil levant[b], depuis le torrent de l’Arnon[c] jusqu’au mont Hermon, ainsi que toute l’Araba[d], à l’est.
  rationale: La révision supprime une préposition non exprimée dans le texte source et restaure la coordination de « toute l’Araba à l’est » avec les limites territoriales. Elle remplace également « conquirent » par « prirent possession », plus proche de la valeur de ירשׁ dans cette phrase, sans modifier le sens général.
