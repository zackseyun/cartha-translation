  text: the king of Dor in Naphath-dor[a], one; the king of Goiim in Gilgal, one[b];
translation:
  language: fr
  text: 'le roi de Dor, dans la région de Dor[a] : un ; le roi de Goïm[b], à Guilgal : un ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « sur les hauteurs de Dor » ou « dans le district de Dor ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit ici par « Goïm » signifie habituellement « nations » ou « peuples » ; dans ce passage, il peut fonctionner comme un nom de lieu ou de territoire.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: le roi de
  rationale: Dans cette liste de rois vaincus, le nom est en relation construite avec le lieu ou le peuple qui suit. « Le roi de » est la formulation française naturelle.
- source_word: דּוֹר
  choice: Dor
  rationale: Nom de lieu conservé sous sa forme traditionnelle française.
- source_word: לְנָפַת דּוֹר
  choice: dans la région de Dor
  rationale: נָפָה désigne ici un territoire ou district rattaché à Dor, avec une possible nuance topographique de hauteur. « Région » reste clair sans imposer cette nuance incertaine.
- source_word: אֶחָד
  choice: un
  rationale: Le mot sert de total après chaque roi dans ce catalogue. Le rendu bref « un » préserve le rythme de décompte de l’hébreu.
- source_word: גּוֹיִם
  choice: Goïm
  rationale: Bien que le mot signifie habituellement « nations » ou « peuples », il peut ici désigner un lieu, un territoire ou un groupe portant ce nom. La translittération maintient cette ambiguïté référentielle.
- source_word: לְגִלְגָּל
  choice: à Guilgal
  rationale: La préposition לְ marque ici le rattachement à une localité. « À Guilgal » est idiomatique en français et ne précise pas davantage la nature de ce rattachement.
