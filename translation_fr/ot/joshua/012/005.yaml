base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: fr
  text: et qui dominait sur le mont Hermon[a], sur Salka et sur tout le Bashân, jusqu’à la frontière des Gueshourites et des Maakatites, et sur la moitié de Galaad, jusqu’à la frontière de Sihôn, roi de Heshbôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « et il dominait sur le mont Hermon, sur Salka et sur tout le Bashân ». L’hébreu emploie un participe qui prolonge la description commencée au verset précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: et qui dominait
  rationale: Le participe hébreu prolonge la description d’Og commencée au verset précédent. La relative française maintient ce lien syntaxique et exprime une autorité territoriale durable.
- source_word: בְּהַר חֶרְמוֹן
  choice: sur le mont Hermon
  rationale: Avec משל, la préposition ב indique le domaine sur lequel s’exerce l’autorité; « sur » est naturel en français.
- source_word: וּבְסַלְכָה
  choice: sur Salka
  rationale: Salka est un toponyme. La préposition est répétée pour assurer la clarté et le parallélisme en français.
- source_word: וּבְכָל הַבָּשָׁן
  choice: sur tout le Bashân
  rationale: La formulation désigne l’ensemble de la région soumise à l’autorité d’Og.
- source_word: עַד גְּבוּל
  choice: jusqu’à la frontière de
  rationale: עַד avec גְּבוּל marque la limite géographique du territoire.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: des Gueshourites et des Maakatites
  rationale: Les gentilés hébreux singuliers désignent ici les peuples auxquels appartiennent les territoires limitrophes; le pluriel français est idiomatique.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: ainsi que sur la moitié de Galaad
  rationale: La locution désigne la portion de Galaad relevant de cette domination. « Ainsi que » rend l’addition sans suggérer que cette moitié se situe nécessairement dans l’étendue précédemment délimitée.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: jusqu’à la frontière de Sihôn, roi de Heshbon
  rationale: Cette expression précise la limite de la moitié de Galaad. La virgule présente naturellement en français l’apposition « roi de Heshbon ».
