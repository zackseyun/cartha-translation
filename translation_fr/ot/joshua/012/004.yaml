source:
  edition: WLC
  text: וּ/גְב֗וּל ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים הַ/יּוֹשֵׁ֥ב בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: fr
  text: et le territoire d’Og, roi du Basan, qui faisait partie du reste des Rephaïm[a] et qui habitait à Astaroth et à Édréi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les géants ». Le terme hébreu Rephaïm peut désigner un peuple ancien réputé pour sa grande taille.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: et le territoire de
  rationale: גְּבוּל peut désigner une frontière ou un territoire. Dans ce résumé géographique des conquêtes, « territoire » exprime naturellement le domaine placé sous l’autorité d’Og; le ו initial poursuit l’énumération par « et ».
- source_word: ע֚וֹג
  choice: Og
  rationale: Nom propre transcrit selon l’usage français courant.
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: roi du Bashân
  rationale: Cette construction identifie Og comme roi du territoire de Bashân. Le nom géographique est transcrit sous sa forme française courante.
- source_word: מִ/יֶּ֖תֶר
  choice: qui était l’un des derniers
  rationale: יֶתֶר désigne ce qui reste. Cette formulation française rend clairement l’appartenance d’Og au reste survivant du groupe, sans suggérer que son territoire provenait des Rephaïm.
- source_word: הָ/רְפָאִ֑ים
  choice: Rephaïm
  rationale: Le nom du peuple est conservé plutôt que remplacé dans le texte par l’interprétation « géants ». La note présente cette possibilité sémantique.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: qui habitait
  rationale: Le participe singulier de ישׁב renvoie à Og et signifie ici habiter ou résider. « Habitait » est naturel en français moderne.
- source_word: בְּ/עַשְׁתָּר֖וֹת
  choice: à Ashtaroth
  rationale: Nom de lieu transcrit; « à » est la préposition française naturelle devant une ville ou un lieu habité.
- source_word: וּ/בְ/אֶדְרֶֽעִי
  choice: et à Édréï
  rationale: Le nom de lieu est transcrit selon l’usage français, et la conjonction ainsi que la préposition sont toutes deux rendues.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicite que מִיֶּתֶר הָרְפָאִים décrit Og, tandis que le second relatif rend le participe singulier. Les noms propres suivent des graphies françaises reconnaissables.
