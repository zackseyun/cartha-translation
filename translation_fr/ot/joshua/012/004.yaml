revisions:
- from: et le territoire d’Og, roi du Bashân, qui était l’un des derniers Rephaïm[a] et qui habitait à Ashtaroth et à Édréï.
  to: et le territoire d’Og, roi du Basan, qui faisait partie du reste des Rephaïm[a] et qui habitait à Astaroth et à Édréi.
  rationale: La révision conserve le sens territorial de גְּבוּל et le relatif singulier renvoyant à Og. Elle remplace une explicitation légèrement plus forte par « faisait partie du reste des Rephaïm », plus proche de מִיֶּתֶר הָרְפָאִים, et emploie des graphies françaises bibliques courantes. La note maintient l’alternative interprétative sans la faire entrer dans le texte principal.
