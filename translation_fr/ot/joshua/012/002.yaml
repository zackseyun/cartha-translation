source:
  edition: WLC
  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: fr
  text: Sihôn, roi des Amorites, qui habitait à Heshbon et régnait depuis Aroër, qui se trouve sur la rive de l’oued de l’Arnon[a], et depuis le milieu de cet oued, sur la moitié de Galaad, jusqu’à l’oued du Yabboq[a], frontière des Ammonites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu נחל peut désigner une vallée, un oued ou le cours d’eau qui le parcourt ; ici, l’Arnon et le Yabboq servent de limites territoriales.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « des fils d’Ammon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  choice: qui habitait
  rationale: Le participe de ישׁב indique ici le lieu de résidence. « Habitait » est naturel et conserve ce sens sans rendre littéralement l’idée de s’asseoir.
- source_word: מֹשֵׁל
  choice: régnait
  rationale: Le participe de משׁל décrit l’exercice de l’autorité royale sur les territoires énumérés.
- source_word: מֵעֲרוֹעֵר
  choice: depuis Aroër
  rationale: La préposition מ־ marque le point de départ de l’étendue territoriale.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: au bord de la vallée de l’Arnon
  rationale: שׂפה signifie le bord ou la rive, tandis que נחל peut désigner une vallée, un oued ou le cours d’eau qui l’occupe. « Vallée » évite d’imposer l’image d’une rivière pérenne.
- source_word: וְתוֹךְ הַנַּחַל
  choice: ainsi que depuis le milieu de la vallée
  rationale: תוך désigne le milieu ou l’intérieur. La répétition de « depuis », implicite en hébreu, rend clairement la délimitation territoriale en français.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: sur la moitié de Galaad
  rationale: חצי désigne une moitié; « sur » explicite naturellement en français le territoire soumis à l’autorité de Sihôn.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: jusqu’à la vallée du Yabboq
  rationale: עד indique la limite extrême; la même traduction de נחל est retenue pour préserver la cohérence et l’ambiguïté topographique.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: frontière des Ammonites
  rationale: L’expression signifie littéralement « frontière des fils d’Ammon », formule ethnonymique rendue naturellement par « Ammonites ».
- source_word: הָאֱמֹרִי
  choice: des Amorites
  rationale: Bien que le terme hébreu soit morphologiquement singulier en apposition à « roi », le français désigne naturellement le peuple gouverné au pluriel.
