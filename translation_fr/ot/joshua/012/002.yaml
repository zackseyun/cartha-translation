    issue: Rendu et syntaxe de וְתוֹךְ הַנַּחַל
    rationale: « Depuis le milieu de la vallée » est peu naturel et peut évoquer une étendue terrestre plutôt que le lit ouedien visé par נחל. « Depuis le milieu de cet oued » maintient la coordination territoriale et le référent de manière plus claire.
