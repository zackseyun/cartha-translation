revisions:
- from: Sihôn, roi des Amorites, qui habitait à Heshbon et régnait depuis Aroër, située au bord de la vallée de l’Arnon[a], ainsi que depuis le milieu de la vallée, sur la moitié de Galaad jusqu’à la vallée du Yabboq[a], frontière des Ammonites[b].
  to: Sihôn, roi des Amorites, qui habitait à Heshbon et régnait depuis Aroër, qui se trouve sur la rive de l’oued de l’Arnon[a], et depuis le milieu de cet oued, sur la moitié de Galaad, jusqu’à l’oued du Yabboq[a], frontière des Ammonites[b].
  rationale: La révision remplace « vallée » par « oued » et précise que le second repère est le milieu du même oued. Elle conserve la portée territoriale, les noms propres et l’ambiguïté topographique de נחל, sans ajouter d’interprétation historique ou doctrinale.
