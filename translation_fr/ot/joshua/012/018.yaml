lexical_decisions:
- source_word: מֶלֶךְ
  choice: le roi de
  rationale: Dans cette liste de victoires, מֶלֶךְ introduit chaque souverain vaincu. L’article défini et la préposition adaptée au nom qui suit donnent une formulation française naturelle tout en conservant la structure répétitive.
- source_word: אֲפֵק
  choice: Afek
  rationale: Nom de lieu translittéré en français ; la graphie « Afek » représente naturellement la consonne פ sans redoublement.
- source_word: אֶחָד
  choice: un
  rationale: Le terme sert ici au décompte des rois. La traduction brève « un » conserve le style elliptique et énumératif de l’hébreu.
- source_word: לַשָּׁרוֹן
  choice: du Sharon
  rationale: La forme hébraïque comprend la préposition et l’article devant le nom régional. « du Sharon » les reflète de façon naturelle en français, sans ajouter le mot interprétatif « plaine ».
