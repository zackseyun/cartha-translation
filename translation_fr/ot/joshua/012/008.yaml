base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: fr
  text: 'dans la région montagneuse, dans la plaine[a], dans l’Araba[b], sur les versants, dans le désert et dans le Néguev[c] : les Hittites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la Shéphéla », nom de la région de plaine et de collines basses située à l’ouest des montagnes de Juda.
    reason: lexical_alternative
  - marker: b
    text: L’Araba est la région aride de la grande vallée du rift ; on pourrait aussi traduire « dans la plaine désertique ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans le pays du sud » ; le mot hébreu Néguev peut désigner aussi bien cette région que le sud.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: Le nom הַר désigne ici non une montagne isolée, mais une zone géographique de montagnes et de collines.
- source_word: וּבַשְּׁפֵלָה
  choice: dans le Bas-Pays
  rationale: שְׁפֵלָה est le nom de la région basse de collines située à l’ouest des montagnes de Juda. « Bas-Pays » reste intelligible tout en gardant sa valeur régionale.
- source_word: וּבָעֲרָבָה
  choice: dans l’Araba
  rationale: עֲרָבָה fonctionne ici comme un nom régional désignant la vallée aride du rift; la translittération préserve cette valeur géographique.
- source_word: וּבָאֲשֵׁדוֹת
  choice: sur les versants
  rationale: אֲשֵׁדוֹת désigne des pentes ou déclivités, notamment les versants montagneux.
- source_word: וּבַמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région aride et peu habitée; « désert » est naturel en français sans impliquer nécessairement une étendue de sable.
- source_word: וּבַנֶּגֶב
  choice: dans le Néguev
  rationale: Dans cette énumération géographique, נֶגֶב désigne vraisemblablement la région méridionale appelée le Néguev, tout en pouvant aussi signifier « sud ».
- source_word: הַחִתִּי הָאֱמֹרִי וְהַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: les Hittites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites
  rationale: Les gentilés hébreux sont morphologiquement au singulier, mais ont ici un sens collectif; le pluriel est idiomatique en français.
theological_decisions: []
