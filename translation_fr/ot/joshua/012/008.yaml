  register: Français international moderne, clair et digne. La série des conjonctions hébraïques est allégée pour produire une énumération naturelle en français. Les noms régionaux Araba et Néguev sont conservés, tandis que Shéphéla est rendu de façon transparente dans le texte et signalé en note.
