source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: fr
  text: Moïse, serviteur de Yahweh, et les fils d’Israël[a] les battirent. Puis Moïse, serviteur de Yahweh, donna ce pays en héritage aux Rubénites, aux Gadites et à la demi-tribu de Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».'
    reason: Préciser la forme littérale de l’expression collective et son équivalent naturel en français.
lexical_decisions:
- source_word: עֶבֶד
  choice: serviteur
  rationale: Dans le titre donné à Moïse, le mot désigne son service fidèle et sa mission auprès de Dieu; « serviteur » convient mieux ici que « esclave ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque masculine et collective; une note en donne l’équivalent idiomatique moderne.
- source_word: הִכּוּם
  choice: les battirent
  rationale: Dans ce résumé militaire, « battre » peut exprimer à la fois l’action guerrière et la défaite infligée, sans préciser au-delà de l’hébreu si tous furent tués.
- source_word: וַיִּתְּנָהּ
  choice: donna leur pays
  rationale: Le suffixe féminin renvoie au pays ou au territoire évoqué dans le contexte. Le nom est explicité en français pour éviter un pronom sans antécédent clair dans la phrase.
- source_word: יְרֻשָּׁה
  choice: en héritage
  rationale: Cette expression rend l’idée d’un bien attribué comme possession durable et héréditaire.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: aux Rubénites, aux Gadites
  rationale: Les gentilés hébreux au singulier ont ici un sens collectif et désignent les groupes tribaux.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: à la demi-tribu de Manassé
  rationale: Formulation française conventionnelle et précise pour la moitié de la tribu établie à l’est du Jourdain.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même; « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Portée de l’expression collective בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal conserve la forme masculine collective de l’hébreu sans prétendre qu’elle exclut les autres membres du peuple; la note fournit l’expression française plus idiomatique.
- issue: Degré de violence exprimé par נכה
  choice: les battirent
  alternative: les abattirent
  rationale: « Les battirent » convient au contexte de victoire militaire tout en évitant d’imposer l’idée explicite que chaque adversaire fut tué.
translation_notes:
  register: Français moderne, digne et lisible. La répétition de « Moïse, serviteur de Yahweh » est conservée parce qu’elle structure l’hébreu. « Puis » rend naturellement la succession narrative. L’expression « leur pays » explicite le référent implicite du pronom hébreu sans ajouter une interprétation théologique.
