lexical_decisions:
- source_word: מֶלֶךְ
  choice: le roi de
  rationale: Le nom à l’état construit introduit le souverain de chaque cité-État ; l’article défini convient naturellement en français dans cette liste.
- source_word: מַקֵּדָה
  choice: Makkéda
  rationale: Nom propre de lieu, translittéré selon une forme française claire plutôt que traduit.
- source_word: אֶחָד
  choice: un
  rationale: Dans cette liste de conquêtes, le numéral sert de décompte après chaque roi. Le conserver seul respecte le style bref et répétitif de l’hébreu.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Il s’agit ici du toponyme établi, et non d’une expression à traduire littéralement par « maison de Dieu ».
