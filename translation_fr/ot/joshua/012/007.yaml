source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: fr
  text: Et voici les rois du pays que Josué et les fils d’Israël vainquirent à l’ouest du Jourdain, depuis Baal-Gad, dans la vallée du Liban, jusqu’au mont Halak, qui s’élève en direction de Séir[a]. Josué donna ce pays en héritage aux tribus d’Israël, selon leurs divisions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui monte vers Séir ».
    reason: La formulation hébraïque peut décrire soit l’élévation du relief, soit la montée en direction de Séir.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Et voici
  rationale: Introduit naturellement en français la liste qui suit tout en conservant le lien narratif marqué par la conjonction hébraïque.
- source_word: אֲשֶׁר הִכָּה
  choice: que ... vainquirent
  rationale: Dans ce contexte de conquête, נכה désigne la défaite infligée aux rois. « Vainquirent » garde la force militaire du verbe sans suggérer nécessairement que chacun fut tué sur-le-champ.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: et les fils d’Israël
  rationale: Reproduit l’expression hébraïque masculine et traditionnelle sans la neutraliser en « Israélites ».
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: à l’ouest du Jourdain
  rationale: Rend clairement et naturellement le repère géographique visé par l’hébreu, sans employer l’ambigu « au-delà du Jourdain ».
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: dans la vallée du Liban
  rationale: בִּקְעָה désigne une large vallée ou plaine encaissée; « vallée » convient au contexte géographique.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: jusqu’au mont Halak
  rationale: Traite l’expression comme un nom géographique et le translittère, plutôt que de produire l’obscur « montagne lisse ».
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: qui s’élève en direction de Séir
  rationale: Préserve la valeur topographique et directionnelle du participe et du suffixe hébreu, sans affirmer que la montagne atteint nécessairement Séir.
- source_word: וַיִּתְּנָהּ
  choice: Josué donna leur territoire
  rationale: Le suffixe féminin singulier renvoie au pays/territoire conquis. L’explicitation française évite que « le donna » paraisse renvoyer aux rois.
- source_word: יְרֻשָּׁה
  choice: en héritage
  rationale: Expression française naturelle qui conserve la notion d’attribution durable du territoire aux tribus.
- source_word: כְּמַחְלְקֹתָם
  choice: selon leurs divisions
  rationale: Rend formellement la répartition du territoire selon les subdivisions ou parts tribales, sans préciser davantage que le texte.
theological_decisions: []
