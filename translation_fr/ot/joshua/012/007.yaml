revisions:
- from: Et voici les rois du pays que Josué et les fils d’Israël vainquirent à l’ouest du Jourdain, depuis Baal-Gad, dans la vallée du Liban, jusqu’au mont Halak, qui s’élève en direction de Séir[a]. Josué donna leur territoire[b] en héritage aux tribus d’Israël, selon leurs divisions.
  to: Et voici les rois du pays que Josué et les fils d’Israël vainquirent à l’ouest du Jourdain, depuis Baal-Gad, dans la vallée du Liban, jusqu’au mont Halak, qui s’élève en direction de Séir[a]. Josué donna ce pays en héritage aux tribus d’Israël, selon leurs divisions.
  rationale: Le seul changement nécessaire remplace « leur territoire » par « ce pays ». Cette correction conserve le référent singulier du suffixe hébreu sans ajouter de possesseur. La note b devient inutile, puisque le référent est exprimé directement et sans ambiguïté.
