translation:
  language: fr
  text: Beth-Araba[a], Tsemaraïm et Béthel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms hébreux « Beth-Araba » et « Béthel » pourraient se traduire plus littéralement par « maison de l’Araba » et « maison de Dieu », mais le texte principal conserve leurs formes usuelles comme noms de lieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: Beth-Araba
  rationale: Il s’agit d’un nom de lieu dans une liste de villes. La translittération préserve sa fonction toponymique, tandis que la traduction littérale de ses éléments serait moins naturelle dans le texte principal.
- source_word: צְמָרַיִם
  choice: Tsemaraïm
  rationale: Ce nom propre est translittéré en français. La forme « Tsemaraïm » rend de manière transparente la consonne initiale צ et la terminaison hébraïque -ַיִם.
- source_word: בֵית אֵל
  choice: Béthel
  rationale: Ce toponyme bien établi est conservé sous sa forme française traditionnelle plutôt que traduit littéralement par « maison de Dieu ».
- source_word: וּ
  choice: et
  rationale: La conjonction préfixée coordonne les noms de lieux. En français naturel, les virgules séparent les premiers éléments et « et » introduit le dernier.
theological_decisions: []
translation_notes:
  register: Style bref et dignifié convenant à une liste de villes. Les toponymes sont donnés sous des formes françaises claires et usuelles, sans expliciter dans le corps du texte le sens de leurs éléments hébreux.
