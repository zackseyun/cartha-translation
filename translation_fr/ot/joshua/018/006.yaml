  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: fr
  text: Quant à vous, vous décrirez le pays en le divisant en sept parts, puis vous m’apporterez ici cette description. Je jetterai alors le sort pour vous, ici, devant le SEIGNEUR notre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִכְתְּבוּ אֶת־הָאָרֶץ
  choice: vous décrirez le pays
  rationale: Littéralement « vous écrirez le pays » ; dans ce contexte de relevé territorial, le français naturel exprime l’idée de consigner par écrit une description du pays.
- source_word: שִׁבְעָה חֲלָקִים
  choice: en le divisant en sept parts
  rationale: Rend explicitement le rapport entre la description du pays et ses sept divisions, sans préciser davantage leur nature.
- source_word: וַהֲבֵאתֶם אֵלַי הֵנָּה
  choice: puis vous m’apporterez ici cette description
  rationale: Le complément implicite est la description écrite demandée ; sa reprise explicite évite en français de suggérer qu’ils apporteraient le pays lui-même.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: Je tirerai alors au sort pour vous
  rationale: Expression française idiomatique correspondant à l’action d’attribuer les territoires par le sort ; le singulier hébreu גּוֹרָל désigne ici le procédé du tirage au sort.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme, en petites capitales typographiques simulées ici par des capitales.
theological_decisions:
- issue: Fonction du tirage au sort devant Dieu
  choice: Conserver « devant le SEIGNEUR notre Dieu » sans explicitation théologique
  alternative: Ajouter que le tirage révèle ou accomplit directement la volonté divine
  rationale: Le texte situe l’acte devant YHWH, mais n’énonce pas ici une théorie détaillée de la providence ou de la révélation par le sort.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicite l’objet apporté pour éviter une ambiguïté artificielle en français, tout en conservant le déroulement et la solennité de l’énoncé hébreu.
