  text: וַ/יָּקֻ֥מוּ הָ/אֲנָשִׁ֖ים וַ/יֵּלֵ֑כוּ וַ/יְצַ֣ו יְהוֹשֻׁ֡עַ אֶת הַ/הֹלְכִים֩ לִ/כְתֹּ֨ב אֶת הָ/אָ֜רֶץ לֵ/אמֹ֗ר לְ֠כוּ וְ/הִתְהַלְּכ֨וּ בָ/אָ֜רֶץ וְ/כִתְב֤וּ אוֹתָ/הּ֙ וְ/שׁ֣וּבוּ אֵלַ֔/י וּ֠/פֹה אַשְׁלִ֨יךְ לָ/כֶ֥ם גּוֹרָ֛ל לִ/פְנֵ֥י יְהוָ֖ה בְּ/שִׁלֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: fr
  text: 'Les hommes se levèrent donc et partirent. Josué donna cet ordre à ceux qui allaient faire le relevé écrit du pays[a] : « Allez, parcourez le pays, consignez-le par écrit, puis revenez auprès de moi. Ici, à Silo, je jetterai le sort pour vous devant Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « écrire le pays »; il s’agit d’en consigner la description en vue du partage.
    reason: Préciser l’expression hébraïque inhabituelle et la portée contextuelle de « relevé écrit ».
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: Les hommes se levèrent donc et partirent
  rationale: La formulation conserve les deux verbes successifs et le référent masculin précis, tout en employant une narration française naturelle.
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime une directive donnée avec autorité. « Donner cet ordre » restitue cette force avec naturel en français.
- source_word: לִכְתֹּב אֶת הָאָרֶץ
  choice: faire le relevé écrit du pays
  rationale: L’hébreu dit littéralement « écrire le pays ». Dans le contexte du partage territorial, il s’agit d’en établir une description écrite; « relevé écrit » rend ce sens sans introduire l’idée moderne et plus précise d’une carte.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: parcourez le pays
  rationale: La forme intensive-réfléchie de הלך indique le déplacement à travers l’ensemble du territoire. « Parcourir » est plus idiomatique que « marcher dans » dans ce contexte de reconnaissance.
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: consignez-le par écrit
  rationale: Le pronom renvoie au pays. Cette formulation maintient explicitement l’action d’écrire tout en indiquant qu’il faut en établir un relevé.
- source_word: וְשׁוּבוּ אֵלַי
  choice: revenez auprès de moi
  rationale: שוב exprime le retour vers Josué; la formulation convient au registre digne de l’instruction.
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: je jetterai le sort pour vous
  rationale: Cette expression française conserve l’image verbale de l’hébreu et son singulier collectif, qui désigne la procédure d’attribution par le sort.
- source_word: בְּשִׁלֹה
  choice: à Silo
  rationale: « Silo » est la forme française traditionnelle et toujours intelligible du toponyme hébreu שִׁלֹה.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin au lieu de le remplacer par un titre.
- issue: Nature du גּוֹרָל
  choice: le sort
  alternative: les sorts / un tirage au sort
  rationale: Le singulier hébreu est conservé sans préciser davantage le mécanisme. Il désigne ici le moyen par lequel les territoires seront attribués devant Yahweh.
- issue: Genre de הָאֲנָשִׁים
  choice: les hommes
  alternative: les gens / les personnes
  rationale: Le nom masculin pluriel renvoie aux représentants précédemment désignés. La traduction conserve cette référence sans la neutraliser.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs restent directs; le vocabulaire administratif moderne trop technique, tel que « cartographier », est évité.
