  text: and Hamizpeh[a], Hakkephirah, and Hammozah.
translation:
  language: fr
  text: Ha-Mitspeh[a], Ha-Kefira et Ha-Motsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « la Mitspeh, la Kefira et la Motsa », si le préfixe hébreu est compris comme l’article défini ordinaire plutôt que comme une partie des noms de lieux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: et
  rationale: La conjonction préfixée coordonne les derniers noms de la liste. En français, elle est rendue une seule fois devant le dernier élément, conformément à l’usage naturel dans une énumération.
- source_word: הַמִּצְפֶּה
  choice: Ha-Mitspa
  rationale: Nom de lieu translittéré plutôt que traduit par « poste d’observation ». Le préfixe Ha- est conservé dans le toponyme afin de refléter l’article hébreu, dont l’analyse reste incertaine ici.
- source_word: הַכְּפִירָה
  choice: Ha-Kefira
  rationale: Toponyme translittéré selon une forme lisible en français. Le préfixe Ha- est conservé; le redoublement phonétique indiqué par le dagesh n’est pas représenté, conformément aux usages courants de translittération française des noms bibliques.
- source_word: הַמֹּצָה
  choice: Ha-Motsa
  rationale: Toponyme translittéré selon une forme adaptée au français, avec ts pour צ. Le préfixe Ha- est conservé dans le nom.
