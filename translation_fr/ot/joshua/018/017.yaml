source:
  edition: WLC
  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: fr
  text: Puis la frontière s’infléchit vers le nord, atteignit En-Shémesh[a], puis atteignit Gueliloth[b], qui est en face de la montée d’Adoummim[c], et descendit jusqu’à la pierre de Bohân, fils de Ruben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Shémesh signifie « Source du Soleil » ; le nom de lieu est translittéré dans le texte.
    reason: lexical_alternative
  - marker: b
    text: Gueliloth peut aussi signifier « cercles » ou « districts » ; le terme est ici compris comme un nom de lieu.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le col d’Adoummim ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: Puis la frontière s’infléchissait
  rationale: Dans les descriptions de frontières, le verbe תאר indique le tracé ou le changement de direction de la limite. « S’infléchissait » exprime naturellement une courbe sans préciser abusivement sa forme.
- source_word: מִצָּפוֹן
  choice: vers le nord
  rationale: La succession de verbes de mouvement favorise un sens directionnel plutôt qu’un point d’origine.
- source_word: וְיָצָא
  choice: débouchait … puis à
  rationale: Dans une formule de délimitation territoriale, יצא décrit le parcours de la frontière jusqu’à un lieu. « Débouchait » rend ce mouvement en français naturel; la seconde occurrence est allégée pour éviter une répétition pesante.
- source_word: עֵין שֶׁמֶשׁ
  choice: En-Shémesh
  rationale: Le nom de lieu est translittéré plutôt que traduit; une note en donne le sens lexical.
- source_word: גְּלִילוֹת
  choice: Gueliloth
  rationale: Le terme fonctionne ici comme un toponyme; la translittération préserve cette fonction tout en laissant son sens lexical en note.
- source_word: נֹכַח
  choice: en face de
  rationale: Cette expression française rend clairement la relation spatiale sans imposer une distance précise.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: la montée d’Adoummim
  rationale: מַעֲלֵה désigne une montée ou un passage ascendant. « Montée » conserve le relief topographique, tandis qu’Adoummim reste un nom propre.
- source_word: וְיָרַד
  choice: descendait
  rationale: Le verbe indique le mouvement descendant de la frontière dans le relief et s’intègre naturellement à la série verbale française.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: la pierre de Bohân, fils de Ruben
  rationale: La chaîne construite désigne un repère associé à Bohân, lui-même identifié comme fils ou descendant de Ruben. La formulation principale reste proche de la syntaxe hébraïque.
theological_decisions:
- issue: Portée généalogique de בֶּן רְאוּבֵן
  choice: fils de Ruben
  alternative: descendant de Ruben
  rationale: Le texte dit littéralement « fils de Ruben ». Même si בן peut désigner plus largement un descendant ou un membre de la tribu, la traduction conserve l’expression formelle et son ambiguïté historique.
translation_notes:
  register: Français international moderne, digne et lisible. L’ajout explicite de « la frontière » clarifie le sujet implicite des verbes dans cette description territoriale. L’imparfait présente le parcours continu de la limite, tandis que les toponymes sont translittérés de manière accessible au lectorat francophone.
