  to: La frontière se prolongea et tourna, du côté ouest, vers le sud, à partir de la montagne qui fait face à Beth-Horôn, au sud. Elle aboutissait à Qiryath-Baal, c’est-à-dire Qiryath-Yearim, une ville des descendants de Juda[a]. Tel était le côté ouest.
  rationale: 'La correction rétablit le rattachement prudent de l’indication « au sud » à Beth-Horôn, conformément à l’ordre et à l’accentuation du texte hébreu. Le reste du texte est conservé dans son sens : la frontière suit son tracé, tourne vers le sud à l’ouest, puis atteint Qiryath-Baal/Qiryath-Yearim.'
