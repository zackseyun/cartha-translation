source:
  edition: WLC
  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: fr
  text: La frontière se prolongea et tourna, du côté ouest, vers le sud, à partir de la montagne qui fait face à Beth-Horôn, au sud. Elle aboutissait à Qiryath-Baal, c’est-à-dire Qiryath-Yearim, une ville des descendants de Juda[a]. Tel était le côté ouest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une ville des fils de Juda » ; il s’agit ici des membres de la tribu, ou descendants, de Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל
  choice: La frontière se prolongeait en décrivant une courbe
  rationale: Dans cette description territoriale, תאר indique le tracé ou le prolongement de la frontière. La formulation française exprime son parcours courbe sans réduire le verbe à un simple marquage.
- source_word: וְנָסַב
  choice: puis tournait
  rationale: Le verbe signale un changement de direction; « tournait » convient au style topographique.
- source_word: לִפְאַת יָם נֶגְבָּה
  choice: vers le sud sur le côté ouest
  rationale: יָם désigne ici l’ouest dans la formule géographique, tandis que נֶגְבָּה marque la direction vers le sud.
- source_word: מִן הָהָר אֲשֶׁר עַל פְּנֵי בֵית חוֹרוֹן נֶגְבָּה
  choice: depuis la montagne située au sud, en face de Beth-Horôn
  rationale: La place du second נֶגְבָּה est syntaxiquement délicate. Cette traduction le rattache à la montagne et rend עַל־פְּנֵי par « en face de », tout en gardant l’indication géographique explicite.
- source_word: וְהָיָה תֹצְאוֹתָיו אֶל
  choice: Elle aboutissait à
  rationale: L’expression idiomatique désigne le point terminal de la frontière. « Aboutissait à » est naturel et précis en français.
- source_word: קִרְיַת בַּעַל הִיא קִרְיַת יְעָרִים
  choice: Qiryath-Baal, c’est-à-dire Qiryath-Yearim
  rationale: Le pronom identifie deux noms d’une même ville; « c’est-à-dire » rend clairement cette apposition.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: une ville des descendants de Juda
  rationale: בְּנֵי signifie littéralement « fils de », mais désigne ici le groupe tribal issu de Juda. « Descendants » conserve le lien de filiation sans laisser entendre que seuls des hommes sont concernés.
- source_word: זֹאת פְּאַת יָם
  choice: Tel était le côté ouest
  rationale: Formule récapitulative de la description de la limite occidentale; « côté ouest » reste proche du lexique hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms géographiques sont translittérés de manière à refléter les formes hébraïques. Le style conserve la précision d’un relevé de frontière tout en évitant des tournures artificielles.
