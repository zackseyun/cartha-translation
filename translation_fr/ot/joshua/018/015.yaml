source:
  edition: WLC
  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: fr
  text: Le côté sud partait de l’extrémité de Kiriath-Yéarim. La frontière se prolongeait vers l’ouest[a] et aboutissait à la source des eaux de Nephtoah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la mer » ; dans ce contexte géographique, il s’agit de l’ouest.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi rendre plus simplement : « la source de Nephtoah ». Le texte hébreu porte littéralement « la source des eaux de Nephtoah ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: Le côté sud
  rationale: פֵאָה désigne ici un côté ou un bord, et נֶגְבָּה en précise l’orientation méridionale. « Le côté sud » est naturel en français et évite de répéter prématurément « frontière ».
- source_word: מִקְצֵה
  choice: de l’extrémité de
  rationale: קָצֶה désigne une extrémité, une limite ou un bord. Dans cette description territoriale, « extrémité » exprime clairement le point de départ de la ligne.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-Yéarim
  rationale: Le nom propre est translittéré plutôt que traduit, selon un usage français lisible.
- source_word: וְיָצָא הַגְּבוּל
  choice: La frontière se prolongeait
  rationale: Dans les formules de délimitation, יָצָא décrit le tracé qui part ou s’étend vers un point. « Se prolongeait » rend ce sens spatial dans un français naturel.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: Le terme signifie littéralement « vers la mer », mais indique ici l’ouest, la Méditerranée se trouvant dans cette direction.
- source_word: וְיָצָא אֶל
  choice: et aboutissait à
  rationale: La seconde occurrence de יָצָא conduit la frontière jusqu’au repère suivant. « Aboutissait à » évite une répétition peu naturelle tout en conservant le mouvement du tracé.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: la source des eaux de Nephtoah
  rationale: Cette formulation conserve la construction hébraïque en chaîne, מַעְיַן (« source ») suivi de מֵי (« eaux de »), sans la simplifier silencieusement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire géographique reste précis, tandis que les deux emplois successifs du verbe hébreu יָצָא sont rendus de manière idiomatique par « se prolongeait » puis « aboutissait ».
