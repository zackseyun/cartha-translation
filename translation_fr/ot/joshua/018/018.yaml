  yaml_path: translation/ot/joshua/018/018.yaml
  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: fr
  text: Puis la frontière passa vers l’épaulement[b] qui fait face à l’Araba[a], au nord, et descendit vers l’Araba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la plaine ». Le terme hébreu peut désigner aussi bien une forme de terrain qu’une région appelée l’Araba.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu signifie littéralement « épaule » ; appliqué au relief, il peut désigner un flanc, une crête ou une pente.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָבַר
  choice: Puis la frontière passait
  rationale: Dans cette description de limites territoriales, le verbe indique la poursuite du tracé. L’ajout explicite de « la frontière », fourni par le contexte, rend le français naturel sans changer le référent.
- source_word: אֶל כֶּתֶף
  choice: vers l’épaulement
  rationale: « Épaulement » conserve la métaphore topographique de l’épaule tout en désignant naturellement un relief saillant ou une pente en français.
- source_word: מוּל הָעֲרָבָה
  choice: en face de l’Araba
  rationale: Cette formulation exprime directement la relation spatiale indiquée par מוּל et conserve Araba comme désignation géographique.
- source_word: צָפוֹנָה
  choice: situé au nord
  rationale: Dans cette construction, l’indication est comprise comme la position septentrionale de l’épaulement plutôt que comme la direction du mouvement; la formulation française évite cette ambiguïté syntaxique immédiate.
- source_word: וְיָרַד
  choice: et descendait
  rationale: Le verbe décrit la descente du tracé dans le relief; l’imparfait convient à la narration continue d’une frontière.
- source_word: הָעֲרָבָתָה
  choice: jusqu’à l’Araba
  rationale: Le ה directionnel marque le mouvement vers l’Araba. « Jusqu’à » exprime clairement la destination du tracé sans imposer l’idée d’une entrée dans la région.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tracé de la frontière est explicité d’après le contexte. « Épaulement » préserve l’image topographique hébraïque sans paraître artificiel; « Araba » maintient le nom régional tout en signalant en note l’autre lecture possible.
