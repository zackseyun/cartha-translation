  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: fr
  text: Il restait, parmi les Israélites, sept tribus qui n’avaient pas encore reçu leur héritage en partage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui n’avaient pas encore partagé leur héritage » ou « dont l’héritage n’avait pas encore été réparti ». L’hébreu peut mettre l’accent soit sur la participation des tribus au partage, soit sur le fait que leur territoire ne leur avait pas encore été attribué.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: Il restait cependant
  rationale: Le niphal de יתר exprime ce qui demeure ou reste. « Il restait » est naturel en français; « cependant » rend ici la progression contrastive du ו narratif dans le contexte.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: parmi les Israélites
  rationale: Littéralement « parmi les fils d’Israël ». « Les Israélites » transmet naturellement en français moderne la désignation collective sans laisser entendre que seuls les hommes sont concernés.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: qui n’avaient pas encore reçu … en partage
  rationale: חלק signifie partager ou répartir. Bien que les tribus soient grammaticalement le sujet, le contexte de l’attribution territoriale permet de comprendre qu’elles n’avaient pas encore obtenu leur part. « Encore » explicite l’état restant signalé par la proposition principale, sans prétendre qu’il figure comme adverbe distinct dans l’hébreu.
- source_word: אֶת נַחֲלָתָם
  choice: leur héritage
  rationale: נחלה désigne ici la part territoriale attribuée comme patrimoine; « héritage » conserve la terminologie biblique usuelle et sa portée théologique.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: sept tribus
  rationale: Rendu direct et idiomatique de l’expression numérique.
theological_decisions:
- issue: Agent et perspective de la répartition de l’héritage
  choice: qui n’avaient pas encore reçu leur héritage en partage
  alternative: qui n’avaient pas partagé leur héritage
  rationale: La forme hébraïque met grammaticalement les tribus comme sujet de חלק, mais le contexte peut viser le fait que leur territoire ne leur avait pas encore été attribué. Le texte retient la formulation française contextuellement la plus claire et signale l’autre perspective en note, sans trancher excessivement l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Israélites » est préféré au calque « fils d’Israël ». La formulation principale privilégie la clarté contextuelle, tandis que la note conserve l’ambiguïté réelle du verbe hébreu.
