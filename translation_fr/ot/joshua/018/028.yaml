source:
  edition: WLC
  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: fr
  text: 'Tséla, Ha-Élef[b], le Jébusien[a] — c’est Jérusalem —, Guibéath[b] et Qiryath[c] : quatorze villes avec les villages qui en dépendaient. Tel fut l’héritage des fils de Benjamin, selon leurs clans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « le Jébusien, c’est Jérusalem ». La forme gentilique « Jébusien » sert ici à désigner un lieu.'
    reason: lexical_alternative
  - marker: b
    text: Certaines traductions donnent « Élef » au lieu de « Ha-Élef », et « Guibéa » au lieu de « Guibéath ».
    reason: alternative_reading
  - marker: c
    text: Dans ce verset, le texte hébreu porte « Qiryath », et non « Qiryath-Yéarim ».
    reason: textual_variant
lexical_decisions:
- source_word: וְ/צֵלַע
  choice: Tséla
  rationale: Nom de lieu translittéré selon des conventions françaises lisibles; la finale hébraïque est rendue par « a » plutôt que par un h non prononcé.
- source_word: הָאֶלֶף
  choice: Ha-Élef
  rationale: Le ה initial est conservé dans la forme du toponyme, avec un trait d’union qui en facilite la lecture en français.
- source_word: וְ/הַ/יְבוּסִי הִיא יְרוּשָׁלִַם
  choice: le Jébusien — c’est Jérusalem —
  rationale: La traduction garde la forme gentilique inhabituelle du texte hébreu au lieu de la remplacer silencieusement par « Jébous »; l’incise rend explicitement הִיא, « c’est ».
- source_word: גִּבְעַת
  choice: Guibéath
  rationale: Le nom propre est translittéré d’après la forme consonantique attestée dans ce verset, sans l’harmoniser silencieusement avec la forme plus connue « Guibéa ».
- source_word: קִרְיַת
  choice: Qiryath
  rationale: Le texte massorétique porte ici le seul nom « Qiryath »; « Yéarim » n’est donc pas ajouté.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: quatorze villes
  rationale: Rendu direct de la formule récapitulative; « villes » convient au vocabulaire des listes territoriales.
- source_word: וְ/חַצְרֵי/הֶן
  choice: avec les villages qui en dépendaient
  rationale: חֲצֵרִים désigne ici les villages ou établissements rattachés aux villes; cette formulation exprime naturellement cette relation en français.
- source_word: זֹאת נַחֲלַת
  choice: Tel fut le patrimoine
  rationale: La formule nominale hébraïque est rendue au passé pour s’intégrer au récit. « Patrimoine » exprime un bien territorial reçu et transmis, sans surcharger le texte du mécanisme d’attribution.
- source_word: בְּנֵי בִנְיָמִן
  choice: les descendants de Benjamin
  rationale: Dans ce contexte tribal, l’expression désigne l’ensemble de la postérité de Benjamin; « descendants » restitue clairement cet emploi collectif en français actuel.
- source_word: לְ/מִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans les répartitions tribales, מִשְׁפָּחוֹת désigne les subdivisions claniques plutôt que les seules familles nucléaires.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent une translittération francisée cohérente. La forme étrange « le Jébusien » est maintenue dans le texte pour préserver la particularité de l’hébreu, puis expliquée en note. Les marqueurs sont placés immédiatement après les formes concernées.
