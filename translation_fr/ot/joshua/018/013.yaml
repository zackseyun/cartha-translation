base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: fr
  text: De là, la frontière passa vers Louz, jusqu’au versant méridional de Louz — c’est-à-dire Béthel[a] —, puis la frontière descendit vers Atroth-Addar[b], sur la montagne qui se trouve au sud de Beth-Horon-la-Basse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Louz est ici identifiée à Béthel.
    reason: cross_reference
  - marker: b
    text: Le nom Atroth-Addar est aussi transcrit Ataroth-Addar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: passait
  rationale: Dans une description territoriale, le verbe décrit naturellement le tracé de la frontière; l’imparfait convient à la narration géographique en français.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: Terme français courant pour la ligne délimitant un territoire dans les descriptions de Josué.
- source_word: לוּזָה
  choice: vers Louz
  rationale: Le nom propre est translittéré, et le hé directionnel est rendu par « vers ».
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: sur le versant sud de Louz
  rationale: כֶּתֶף signifie littéralement « épaule », mais désigne ici le côté ou versant d’un relief; « versant sud » restitue clairement le sens topographique.
- source_word: הִיא בֵּית אֵל
  choice: c’est-à-dire Béthel
  rationale: Cette formulation rend l’identification explicative entre Louz et Béthel de façon naturelle en français.
- source_word: וְיָרַד
  choice: puis elle descendait
  rationale: Le verbe conserve l’image topographique d’une frontière qui descend; « puis » marque naturellement la progression du tracé.
- source_word: עַטְרוֹת אַדָּר
  choice: Atroth-Addar
  rationale: Translittération proche de la forme consonantique hébraïque, avec trait d’union pour le nom composé.
- source_word: עַל הָהָר
  choice: sur la montagne
  rationale: Le singulier défini renvoie le plus naturellement à un relief précis dans le tracé.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: située au sud de Beth-Horon-la-Basse
  rationale: מִנֶּגֶב indique une position au sud; « Beth-Horon-la-Basse » rend le toponyme qualifié de façon idiomatique et le distingue de Beth-Horon-la-Haute.
