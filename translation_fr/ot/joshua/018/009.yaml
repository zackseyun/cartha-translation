  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּלְכ֤וּ הָֽ/אֲנָשִׁים֙ וַ/יַּעַבְר֣וּ בָ/אָ֔רֶץ וַ/יִּכְתְּב֧וּ/הָ לֶֽ/עָרִ֛ים לְ/שִׁבְעָ֥ה חֲלָקִ֖ים עַל סֵ֑פֶר וַ/יָּבֹ֧אוּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה שִׁלֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: fr
  text: Les hommes partirent et parcoururent le pays. Ils le décrivirent par écrit, ville par ville[a], en sept parties, dans un document[b]. Puis ils vinrent auprès de Josué, au camp de Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les villes » ; le relevé du pays était organisé ville par ville.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « sur un livre » ou « sur un rouleau », c’est-à-dire dans un document écrit.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: partirent
  rationale: Le verbe הלך ouvre la suite narrative. « Partirent » exprime naturellement leur mise en route sans ajouter de destination.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le nom désigne les représentants masculins chargés de cette mission dans le contexte précédent.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: parcoururent le pays
  rationale: עבר avec ב indique ici qu’ils traversent le territoire afin d’en faire le relevé ; « parcoururent » rend clairement cette activité.
- source_word: וַיִּכְתְּבוּהָ
  choice: ils le décrivirent par écrit
  rationale: Le suffixe féminin renvoie au pays. Cette formulation française conserve ce renvoi tout en exprimant qu’ils en consignèrent la description.
- source_word: לֶעָרִים
  choice: ville par ville
  rationale: La préposition ל marque vraisemblablement le principe d’organisation du relevé, effectué selon les villes.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: en sept parties
  rationale: חֲלָקִים désigne des divisions ou portions ; la formulation reste neutre quant à leur attribution ultérieure.
- source_word: עַל סֵפֶר
  choice: dans un document
  rationale: סֵפֶר désigne ici un écrit matériel, probablement un rouleau. « Document » est naturel en français et n’impose pas la forme moderne du livre relié.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: ils vinrent auprès de Josué
  rationale: Le texte dit simplement qu’ils vinrent vers Josué ; il n’est pas nécessaire d’expliciter qu’ils revinrent.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: au camp de Silo
  rationale: La tournure indique le lieu où se trouve Josué. « Au camp de Silo » est concise et idiomatique.
