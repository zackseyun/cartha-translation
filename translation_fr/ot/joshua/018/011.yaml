  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: fr
  text: Le sort de la tribu des descendants de Benjamin fut tiré selon leurs clans, et le territoire qui leur échut par le sort[a] se situa entre les descendants de Juda et ceux de Joseph[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et la frontière de leur lot se trouva entre les descendants de Juda et ceux de Joseph ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « descendants de Joseph » désigne collectivement les tribus issues de Joseph, notamment Éphraïm et Manassé.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל גּוֹרַל
  choice: le sort… fut tiré
  rationale: Dans le contexte du partage du pays, cette tournure française exprime naturellement la désignation par tirage au sort. Elle rend le sens contextuel de עלה sans conserver artificiellement l’image littérale de ce qui « monte ».
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: la tribu des descendants de Benjamin
  rationale: מַטֵּה désigne ici la tribu. « Descendants de Benjamin » restitue l’expression généalogique בְנֵי בִנְיָמִן dans un français actuel et évite de laisser entendre qu’il s’agit uniquement des fils immédiats de Benjamin.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחוֹת désigne les groupes familiaux constitutifs de la tribu; « clans » en préserve le niveau social plus précisément que le terme général « familles ».
- source_word: גְּבוּל גּוֹרָלָם
  choice: le territoire qui leur échut par le sort
  rationale: גְּבוּל peut désigner une frontière ou, par métonymie, le territoire qu’elle délimite. Ici, la localisation entre Juda et Joseph favorise le sens territorial; la note conserve l’autre lecture possible.
- source_word: וַיֵּצֵא
  choice: se situa
  rationale: Le verbe יצא décrit ici le résultat géographique produit par le tirage. « Se situa » est naturel en français avec « territoire », tout en gardant la progression du récit.
- source_word: בֵּין ... וּבֵין
  choice: entre… et…
  rationale: La construction indique directement que le lot de Benjamin se trouvait entre les territoires de Juda et des tribus issues de Joseph.
- source_word: בְנֵי יְהוּדָה / בְנֵי יוֹסֵף
  choice: les descendants de Juda / ceux de Joseph
  rationale: « Descendants » rend l’emploi collectif de בְנֵי. La reprise par « ceux de Joseph » évite une répétition lourde sans effacer le parallélisme généalogique.
