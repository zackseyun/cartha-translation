lexical_decisions:
- source_word: הָעַוִּים
  choice: Avvim
  rationale: Dans cette liste territoriale, la forme fonctionne vraisemblablement comme un nom de ville. La translittération « Avvim » conserve le nom hébreu tout en laissant en note l'autre analyse possible.
- source_word: הַפָּרָה
  choice: Para
  rationale: Nom de lieu du territoire de Benjamin. L'article préfixé en hébreu n'est pas rendu séparément; « Para » est une translittération française naturelle de פָּרָה.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Nom de lieu translittéré selon les usages naturels du français moderne; « Ofra » représente עָפְרָה sans lui attribuer le sens d'un nom commun.
- source_word: וְ
  choice: et
  rationale: Les conjonctions répétées relient les noms d'une liste; en français naturel, on emploie des virgules puis « et » devant le dernier élément.
