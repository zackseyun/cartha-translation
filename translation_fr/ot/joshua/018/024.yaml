base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/024.yaml
  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: fr
  text: 'Kefar-Haammoni[a], Ophni et Guéba : douze villes avec leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Kefar-Haammoni peut aussi être transcrit Kefar-Ammoni ou d’une manière similaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: Kefar-Haammoni
  rationale: Nom de lieu translittéré d’après l’hébreu. « Kefar » convient aux usages français modernes; le second élément conserve l’article hébreu et la forme toponymique sans proposer une traduction conjecturale comme « village de l’Ammonite ».
- source_word: הָעָפְנִי
  choice: Ofni
  rationale: Nom de lieu translittéré selon les conventions françaises, avec « f » pour la consonne פ; l’article initial est intégré à la forme toponymique plutôt que rendu séparément.
- source_word: גָבַע
  choice: Guéba
  rationale: Nom propre de ville, rendu sous sa forme française usuelle plutôt que traduit par le nom commun « colline ».
- source_word: עָרִים
  choice: villes
  rationale: Dans cette liste territoriale, le terme désigne les principaux centres urbains; « villes » conserve la terminologie biblique traditionnelle tout en restant naturel.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: douze
  rationale: Nombre cardinal qualifiant les villes.
- source_word: חַצְרֵיהֶן
  choice: les villages qui en dépendaient
  rationale: Le terme désigne des établissements ruraux secondaires rattachés aux villes mentionnées. Cette formulation explicite naturellement en français la relation marquée par le suffixe possessif féminin pluriel.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La coordination initiale hébraïque n’est pas rendue mécaniquement, puisque le verset poursuit une liste. Les noms propres suivent des conventions de translittération adaptées au français.
