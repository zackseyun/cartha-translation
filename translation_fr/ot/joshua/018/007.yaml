- from: En effet, les Lévites n’auront aucune part au milieu de vous, car le sacerdoce de Yahweh est leur héritage[a]. Quant à Gad, à Ruben et à la demi-tribu de Manassé, ils ont reçu leur héritage de l’autre côté du Jourdain, à l’est, celui que leur a donné Moïse, serviteur de Yahweh.
  to: En effet, les Lévites n’ont pas de part parmi vous, car le sacerdoce de Yahweh est leur héritage[a]. Gad, Ruben et la demi-tribu de Manassé ont reçu leur héritage au-delà du Jourdain, à l’est, héritage que Moïse, serviteur de Yahweh, leur a donné.
  rationale: La révision remplace le futur non exprimé dans le texte source par le présent et affine deux formulations pour un français plus direct, sans modifier le sens ni résoudre au-delà de la note l’ambiguïté du suffixe singulier.
