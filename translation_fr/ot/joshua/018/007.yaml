source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: fr
  text: En effet, les Lévites n’ont pas de part parmi vous, car le sacerdoce de Yahweh est leur héritage[a]. Gad, Ruben et la demi-tribu de Manassé ont reçu leur héritage au-delà du Jourdain, à l’est, héritage que Moïse, serviteur de Yahweh, leur a donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « son héritage » ; le singulier renvoie vraisemblablement, de manière collective, à Lévi ou aux Lévites, d’où « leur héritage » dans le texte.
    reason: Préserver la forme singulière de l’hébreu tout en expliquant le rendu collectif français.
lexical_decisions:
- source_word: חֵלֶק
  choice: part
  rationale: « Part » exprime naturellement une part attribuée dans le partage du pays, tout en restant distinct de נַחֲלָה, rendu par « héritage ».
- source_word: לַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française courante des membres de la tribu de Lévi.
- source_word: בְּקִרְבְּכֶם
  choice: au milieu de vous
  rationale: Formulation française naturelle qui conserve l’image spatiale de l’hébreu dans le contexte du partage entre les tribus.
- source_word: כְהֻנַּת יְהוָה
  choice: le sacerdoce de Yahweh
  rationale: « Sacerdoce » rend le statut et la fonction sacerdotale exprimés par כְהֻנָּה; le génitif hébreu est conservé sans préciser davantage sa relation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve ici le nom propre du texte hébreu plutôt que de lui substituer un titre.
- source_word: נַחֲלָתוֹ
  choice: leur héritage
  rationale: Le suffixe hébreu est au masculin singulier, mais son référent collectif est Lévi ou les Lévites; le pluriel français communique naturellement ce sens collectif.
- source_word: לָקְחוּ
  choice: ont reçu
  rationale: Dans le contexte d’une attribution territoriale légitime, « ont reçu » exprime mieux le sens contextuel que le littéral « ont pris », susceptible de suggérer une saisie.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: « Héritage » convient à la possession territoriale durable attribuée aux tribus.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: de l’autre côté du Jourdain, à l’est
  rationale: La formulation précise clairement, en français moderne, que le territoire se trouve sur la rive orientale du Jourdain.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: Dans ce titre honorifique et relationnel, « serviteur » est le terme français naturel; « esclave » mettrait au premier plan une nuance qui ne domine pas ici.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Suffixe collectif singulier dans נַחֲלָתוֹ
  choice: leur héritage
  alternative: son héritage
  rationale: Le singulier hébreu peut renvoyer collectivement à Lévi, tandis que le contexte parle des Lévites. Le pluriel est plus clair en français, et une note conserve la forme grammaticale de la source.
- issue: Relation exprimée par כְהֻנַּת יְהוָה
  choice: le sacerdoce de Yahweh
  alternative: le service sacerdotal pour Yahweh
  rationale: Le génitif peut évoquer le sacerdoce relevant de Yahweh ou exercé à son service. La traduction formelle « de Yahweh » préserve cette relation sans la résoudre abusivement.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » marque le lien explicatif de כִּי; « Quant à » rend la transition vers les tribus déjà pourvues. La syntaxe évite l’archaïsme tout en conservant les termes bibliques établis « sacerdoce », « héritage » et « serviteur ».
