review_pass:
  verdict: revise
  source_fidelity: La première proposition du brouillon emploie le futur (« n’auront »), alors que l’hébreu exprime ici l’absence de part comme un état (« il n’y a pas / n’ont pas »). Le reste rend fidèlement les groupes tribaux, la localisation à l’est du Jourdain et l’attribution mosaïque.
  naturalness: Le français est globalement naturel. « Parmi vous » convient mieux que « au milieu de vous » dans le contexte d’une répartition entre tribus. La reprise explicite d’« héritage » évite que « celui que » ne paraisse pesant ou ambigu.
  terminology: « Lévites », « sacerdoce », « héritage », « Yahweh » et « serviteur » sont appropriés et cohérents. La note sur le suffixe singulier est utile et conserve l’ambiguïté grammaticale sans lui imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Temps de « n’auront »
    rationale: אֵין (« il n’y a pas ») n’est pas un futur. Même si le contexte porte sur le partage à venir, le français présent rend plus exactement l’énoncé hébreu.
  revised_text: En effet, les Lévites n’ont pas de part parmi vous, car le sacerdoce de Yahweh est leur héritage[a]. Gad, Ruben et la demi-tribu de Manassé ont reçu leur héritage au-delà du Jourdain, à l’est, héritage que Moïse, serviteur de Yahweh, leur a donné.
