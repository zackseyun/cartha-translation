base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: fr
  text: Du côté nord, leur frontière partait du Jourdain. Elle montait vers le versant nord de Jéricho[a], puis montait dans la région montagneuse vers l’ouest et aboutissait[b] au désert de Beth-Aven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’épaule de Jéricho, au nord » ; dans le langage géographique, « épaule » désigne un côté, un flanc ou un versant.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est au pluriel et peut aussi se rendre par « ses extrémités » ou « ses issues » ; il désigne le ou les points où aboutit la frontière.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: Du côté nord
  rationale: פאה désigne un côté ou un bord ; dans cette description territoriale, « du côté nord » est naturel et conserve la fonction directionnelle.
- source_word: הַגְּבוּל
  choice: frontière
  rationale: גְּבוּל désigne ici la ligne délimitant le territoire attribué ; « frontière » convient au contexte géographique.
- source_word: מִן הַיַּרְדֵּן
  choice: partait du Jourdain
  rationale: La préposition מן marque le point de départ. Avec la copule היה, « partait du » rend naturellement la formule française.
- source_word: וְעָלָה
  choice: montait
  rationale: עלה exprime un mouvement ascendant dans les descriptions topographiques ; « montait » en préserve l’image spatiale.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: vers le versant de Jéricho situé au nord
  rationale: כֶּתֶף signifie littéralement « épaule », mais désigne géographiquement un flanc, un côté ou un versant. מִצָּפוֹן précise sa situation au nord.
- source_word: בָהָר יָמָּה
  choice: dans la région montagneuse en direction de l’ouest
  rationale: הָר peut désigner collectivement la région montagneuse, tandis que יָמָּה est un adverbe directionnel signifiant « vers l’ouest ».
- source_word: תֹּצְאֹתָיו
  choice: aboutissait
  rationale: Le substantif pluriel technique תֹּצְאוֹת désigne ici l’issue ou le point terminal de la frontière. Une formulation verbale donne un français clair sans multiplier artificiellement les extrémités.
- source_word: מִדְבַּרָה בֵּית אָוֶן
  choice: au désert de Beth-Aven
  rationale: Le ה directionnel indique que la frontière se dirige vers ce lieu et y aboutit ; « au désert de Beth-Aven » convient après « aboutissait ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition hébraïque de « la frontière » est allégée par le pronom « elle ». Les mouvements ascendants et la direction vers l’ouest restent explicites. Le marqueur [b] est placé après le nom de lieu auquel se rapporte la note.
