  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: fr
  text: Toute la communauté des fils d’Israël[a] se rassembla à Silo. Ils y installèrent la tente de la Rencontre, et le pays était soumis devant eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ; traditionnellement, « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: Alternative lexicale et précision sur la forme littérale de la désignation collective.
  - marker: b
    text: Ou « le pays avait été conquis devant eux ».
    reason: Autre rendu possible du passif hébreu נִכְבְּשָׁה.
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: se rassembla
  rationale: Le niphal de קהל exprime ici la réunion de la communauté constituée. « Se rassembla » est naturel en français et s’accorde avec le sujet collectif singulier « toute la communauté ».
- source_word: כָּל עֲדַת
  choice: toute la communauté
  rationale: עֵדָה désigne la communauté d’Israël considérée collectivement. « Toute la communauté » rend à la fois כָּל et la valeur collective du nom dans un français actuel et digne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque masculine et son langage d’identité collective, tandis qu’une note signale l’équivalent idiomatique « les Israélites ».
- source_word: שִׁלֹה
  choice: Silo
  rationale: Forme française traditionnelle et courante du nom de lieu biblique.
- source_word: וַיַּשְׁכִּינוּ
  choice: installèrent
  rationale: Le hiphil de שכן signifie littéralement « firent demeurer ». Avec la tente pour complément, « installèrent » exprime naturellement son établissement durable à Silo sans réduire l’action au simple montage de la toile.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Rendu transparent et bien établi de l’expression hébraïque, préférable ici au terme plus interprétatif « tabernacle ». La majuscule à « Rencontre » signale l’emploi consacré comme désignation.
- source_word: נִכְבְּשָׁה
  choice: était soumis
  rationale: Le passif de כבשׁ décrit l’état résultant de la mise sous contrôle du pays. « Était soumis » préserve cette nuance sans affirmer plus que le contexte, qui mentionne encore des territoires à répartir ou à prendre.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: La traduction conserve l’image spatiale de l’expression hébraïque, qui indique contextuellement que le pays se trouvait sous leur domination.
theological_decisions:
- issue: Désignation collective d’Israël
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le rendu principal garde la forme concrète et masculine de l’hébreu sans lui imposer une reformulation neutre. La note fournit l’équivalent collectif naturel afin d’éviter que le lecteur n’y voie nécessairement une restriction à certains individus.
- issue: Étendue de la soumission du pays
  choice: le pays était soumis devant eux
  alternative: le pays avait été conquis devant eux
  rationale: Le passif hébreu affirme la mise sous domination, mais le récit environnant laisse subsister des zones non encore occupées. « Soumis » maintient cette tension narrative sans atténuer l’affirmation du verset ni la transformer en conquête absolument achevée.
translation_notes:
  register: Français international moderne, fluide et soutenu sans archaïsme. La première phrase évite une coordination trop lourde, tandis que la reprise par « Ils » clarifie naturellement le changement entre le sujet collectif singulier et l’action du groupe. Les termes cultuels restent transparents et accessibles.
