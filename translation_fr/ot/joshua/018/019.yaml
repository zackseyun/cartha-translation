translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit la progression topographique du texte hébreu tout en évitant les tournures archaïques. « Flanc » est préféré au littéral « épaule » pour rester immédiatement compréhensible, tandis que « langue » est maintenu et expliqué en note afin de préserver l’image hébraïque.
