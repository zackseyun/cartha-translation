base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: fr
  text: La frontière passait ensuite vers le flanc nord de Beth-Hogla, puis elle aboutissait à la langue[a] nord de la mer Salée[b], à l’extrémité sud du Jourdain. C’était la frontière méridionale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « langue de la mer Salée » : expression géographique désignant une partie de la mer ou du rivage en forme de langue.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, la mer Morte ; le texte hébreu porte « mer Salée ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: La frontière passait ensuite
  rationale: Dans les descriptions de frontières, עָבַר indique que la ligne se poursuit ou passe par un lieu. L’imparfait convient à la description suivie, et « ensuite » exprime naturellement l’enchaînement.
- source_word: כֶּתֶף
  choice: flanc
  rationale: Le mot signifie littéralement « épaule », mais désigne géographiquement le côté ou le versant d’un relief. « Flanc » conserve l’image topographique dans un français naturel.
- source_word: בֵּית חָגְלָה
  choice: Beth-Hogla
  rationale: Le nom de lieu est translittéré selon un usage français clair et cohérent.
- source_word: צָפוֹנָה
  choice: nord / septentrionale
  rationale: La première occurrence localise le flanc de Beth-Hogla au nord; la seconde qualifie la langue de la mer. La variation française évite une répétition lourde sans modifier le sens.
- source_word: תצאותיו
  choice: aboutissait
  rationale: Dans les formules de délimitation, ce terme désigne l’issue ou le point terminal de la frontière. « Aboutissait » rend ce sens avec naturel.
- source_word: לְשׁוֹן
  choice: langue
  rationale: Le terme désigne littéralement une « langue » et s’emploie ici comme expression géographique. Le conserver préserve l’image concrète et la précision du texte hébreu.
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Traduction directe du nom hébreu, plutôt que substitution par le nom moderne conventionnel « mer Morte ».
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: à l’extrémité sud du Jourdain
  rationale: קָצֶה indique une extrémité et נֶגְבָּה précise ici la direction méridionale.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: Telle était la frontière sud
  rationale: Dans ce contexte, נֶגֶב a une valeur directionnelle et ne désigne pas la région proprement dite du Néguev. Cette formulation résume naturellement la délimitation.
