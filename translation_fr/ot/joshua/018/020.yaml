  text: וְ/הַ/יַּרְדֵּ֥ן יִגְבֹּל אֹת֖/וֹ לִ/פְאַת קֵ֑דְמָ/ה זֹ֡את נַחֲלַת֩ בְּנֵ֨י בִנְיָמִ֧ן לִ/גְבֽוּלֹתֶ֛י/הָ סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: fr
  text: Le Jourdain lui servait de frontière du côté est[a]. Tel fut l’héritage des descendants de Benjamin, avec ses frontières tout autour, selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « le délimitait » ou « en formait la frontière ». Le verbe hébreu indique que le Jourdain constituait la limite territoriale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: Le Jourdain
  rationale: Le nom propre désigne le fleuve ; en français courant, « le Jourdain » suffit sans ajouter « fleuve ».
- source_word: יִגְבֹּל אֹתוֹ
  choice: en formait la frontière
  rationale: Dans ce contexte territorial, גבל indique que le Jourdain servait de limite au territoire évoqué.
- source_word: לִפְאַת קֵדְמָה
  choice: du côté est
  rationale: פאה désigne le côté ou le bord, et קֵדְמָה l'orientation vers l'est.
- source_word: זֹאת נַחֲלַת
  choice: Tel fut le territoire attribué
  rationale: La proposition hébraïque est sans verbe. « Tel fut » convient au bilan narratif, tandis que « territoire attribué » exprime naturellement la נחלה tribale sans effacer l'idée d'un lot reçu.
- source_word: בְּנֵי בִנְיָמִן
  choice: les descendants de Benjamin
  rationale: Dans ce contexte tribal, l'expression littérale « fils de Benjamin » désigne l'ensemble de ses descendants ; la formulation choisie est naturelle et non ambiguë en français moderne.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: avec ses frontières tout autour
  rationale: La formule récapitule les limites qui entourent le territoire ; le suffixe féminin renvoie à la נחלה.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחוֹת désigne ici les subdivisions familiales de la tribu, mieux rendues par « clans » que par le terme plus large « familles ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de bilan territorial reste concise. « Territoire attribué » privilégie l'intelligibilité géographique tout en conservant la notion biblique de נחלה ; « descendants de Benjamin » explicite l'emploi tribal de l'expression hébraïque littérale « fils de Benjamin ».
