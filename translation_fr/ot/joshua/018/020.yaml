    rationale: Dans Josué, נַחֲלָה est le lot reçu comme héritage. « Territoire attribué » décrit le résultat géographique, mais réduit la composante juridique et héritée du terme.
  - severity: low
    issue: « En formait la frontière » est légèrement moins direct que la formulation fonctionnelle française habituelle.
    rationale: Le verbe גבל indique que le Jourdain sert de limite au territoire. « Lui servait de frontière » exprime ce rapport sans modifier le sens.
  revised_text: Le Jourdain lui servait de frontière du côté est[a]. Tel fut l’héritage des descendants de Benjamin, avec ses frontières tout autour, selon leurs clans.
