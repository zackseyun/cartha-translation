source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: fr
  text: 'Josué dit aux Israélites[a] : « Jusqu’à quand tarderez-vous à aller prendre possession du pays que Yahweh, le Dieu de vos pères, vous a donné ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: L’expression hébraïque familiale et masculine est rendue dans le texte par le nom collectif français plus naturel « Israélites ».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple suffit naturellement, sans qu’il soit nécessaire d’ajouter une relation logique absente de l’hébreu.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites[a]
  rationale: Cette formulation française naturelle désigne clairement le peuple d’Israël. Une note conserve la transparence de l’expression hébraïque littérale, « les fils d’Israël ».
- source_word: עַד אָנָה
  choice: Jusqu’à quand
  rationale: Rend directement la question temporelle de reproche formulée en hébreu.
- source_word: מִתְרַפִּים
  choice: tarderez-vous
  rationale: Dans ce contexte, la forme de רפה dénonce un manque de résolution et une inaction prolongée. « Tarder » exprime naturellement ce relâchement dans l’action sans renforcer indûment le reproche par « paresseux » ou « négligents ».
- source_word: לָבוֹא לָרֶשֶׁת
  choice: à aller prendre possession
  rationale: « Aller » rend le mouvement d’entrée dans le pays, tandis que « prendre possession » conserve le sens contextuel de ירשׁ sans le réduire à la seule notion juridique d’héritage.
- source_word: הָאָרֶץ
  choice: du pays
  rationale: Dans ce contexte territorial précis, « le pays » est l’équivalent français naturel de הָאָרֶץ et renvoie au pays promis.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: que … vous a donné
  rationale: Le passé composé présente le don comme déjà accompli tout en maintenant sa pertinence présente, alors même que la prise de possession reste inachevée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du nom divin, qui préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Conserve la formulation familiale et intergénérationnelle de l’hébreu ainsi que sa portée d’alliance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Don déjà accordé et possession encore à réaliser
  choice: « vous a donné » associé à « aller prendre possession »
  alternative: « vous donnera » ou une formulation qui confondrait don et occupation
  rationale: 'La traduction maintient la tension du texte : Dieu a déjà donné le pays, mais les Israélites doivent encore y entrer et en prendre possession.'
translation_notes:
  register: Français international moderne, clair et digne. La question conserve le ton de reproche de Josué sans employer un vocabulaire excessivement accusateur. « Pays » est préféré à « terre » pour le territoire promis, et la syntaxe reste adaptée à une lecture publique.
