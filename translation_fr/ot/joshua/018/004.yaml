  text: הָב֥וּ לָ/כֶ֛ם שְׁלֹשָׁ֥ה אֲנָשִׁ֖ים לַ/שָּׁ֑בֶט וְ/אֶשְׁלָחֵ֗/ם וְ/יָקֻ֜מוּ וְ/יִֽתְהַלְּכ֥וּ בָ/אָ֛רֶץ וְ/יִכְתְּב֥וּ אוֹתָ֛/הּ לְ/פִ֥י נַֽחֲלָתָ֖/ם וְ/יָבֹ֥אוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: fr
  text: Désignez pour vous trois hommes par tribu[a], et je les enverrai. Ils se mettront en route, parcourront le pays et en feront le relevé selon leurs parts d’héritage[b], puis ils viendront à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Fournissez trois hommes par tribu. »'
    reason: lexical_alternative
  - marker: b
    text: Ils devaient consigner le pays en tenant compte des parts de territoire destinées aux différentes tribus.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Choisissez parmi vous
  rationale: Dans ce contexte, l’impératif demande aux Israélites de fournir ou de désigner eux-mêmes des représentants. « Choisissez parmi vous » exprime naturellement cette valeur sans le calque peu idiomatique « donnez-vous ».
- source_word: שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט
  choice: trois hommes par tribu
  rationale: 'Le nom hébreu désigne explicitement des hommes, et le singulier « la tribu » a ici une valeur distributive : trois représentants pour chacune.'
- source_word: וְאֶשְׁלָחֵם
  choice: Je les enverrai
  rationale: Rend directement le verbe שלח et la mission confiée aux hommes, sans ajouter une destination absente du texte.
- source_word: וְיָקֻמוּ
  choice: ils se mettront en route
  rationale: קום signifie littéralement « se lever », mais introduit ici le départ effectif des hommes. La formulation française restitue naturellement cette fonction narrative.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: parcourront le pays
  rationale: La forme intensive-réfléchie de הלך évoque le fait de circuler à travers le territoire. « Parcourir » convient à cette mission d’exploration.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: en feront le relevé
  rationale: Littéralement, ils doivent « l’écrire », le pronom féminin renvoyant au pays. Dans ce contexte territorial, « faire le relevé » rend clairement l’acte de consigner le pays sans préciser indûment la méthode.
- source_word: לְפִי נַחֲלָתָם
  choice: en fonction de l’héritage qui leur revient
  rationale: L’expression signifie que le relevé doit être établi en rapport avec les parts territoriales destinées aux tribus. Cette formulation conserve la notion biblique d’héritage tout en explicitant la relation.
- source_word: וְיָבֹאוּ אֵלָי
  choice: puis ils viendront me retrouver
  rationale: Le texte dit littéralement « ils viendront vers moi ». « Me retrouver » est idiomatique dans le contexte de leur venue auprès de Josué après la mission, sans imposer le verbe « revenir ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset privilégie des formulations idiomatiques (« se mettront en route », « parcourront », « feront le relevé ») tout en conservant le vocabulaire biblique de l’héritage. Les futurs coordonnés rendent la succession des formes verbales hébraïques.
