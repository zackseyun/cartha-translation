base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: fr
  text: La frontière descendit ensuite jusqu’à l’extrémité de la montagne qui fait face à la vallée de Ben-Hinnom[a], située vers le nord dans la vallée des Rephaïm. Puis elle descendit dans la vallée de Hinnom jusqu’au versant du Jébusien, vers le sud[b], et descendit jusqu’à En-Roguel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « la vallée du fils de Hinnom »; Ben-Hinnom est ici traité comme un nom de lieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jusqu’au versant méridional du Jébusien ». « Le Jébusien » peut désigner ici le site ou le territoire associé aux Jébusiens; dans ce contexte, il est traditionnellement identifié à Jérusalem.'
    reason: lexical_alternative
  - marker: c
    text: 'En-Roguel est un nom de lieu; littéralement : « source de Roguel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: La frontière descendait ensuite
  rationale: ירד exprime une descente topographique; l’imparfait français convient à la description suivie du tracé. גְּבוּל désigne ici la ligne frontière.
- source_word: קְצֵה הָהָר
  choice: l’extrémité de la montagne
  rationale: קָצֶה désigne une extrémité ou un bord; « montagne » rend directement הָר sans imposer la lecture possible « colline ».
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: qui fait face à la vallée de Ben-Hinnom
  rationale: עַל־פְּנֵי marque ici une relation spatiale, « en face de ». Ben-Hinnom est conservé comme nom de lieu.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: au nord de la vallée des Rephaïm
  rationale: Cette formulation rend la direction צָפוֹנָה sans ajouter « extrémité », absent de l’hébreu, tout en restant naturelle en français.
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: Puis elle descendait par la vallée de Hinnom
  rationale: Dans cette description d’itinéraire, l’absence de préposition devant גֵּי permet naturellement de comprendre que la frontière descend en suivant ou par la vallée.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: jusqu’au versant du Jébusien, au sud
  rationale: כֶּתֶף, littéralement « épaule », désigne un flanc ou versant topographique. Le texte dit « du Jébusien » sans le nom « ville »; נֶגְבָּה indique la direction méridionale.
- source_word: עֵין רֹגֵל
  choice: En-Roguel
  rationale: Le groupe fonctionne comme un toponyme; la translittération française usuelle conserve ce statut, tandis que son sens littéral est signalé en note.
