translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le mouvement topographique répété du texte hébreu. Les toponymes sont translittérés selon une forme française reconnaissable; aucune précision absente de l’hébreu, telle que « ville », n’est ajoutée au corps du texte.
