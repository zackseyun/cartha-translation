  text: וְ/הִֽתְחַלְּק֥וּ אֹתָ֖/הּ לְ/שִׁבְעָ֣ה חֲלָקִ֑ים יְהוּדָ֞ה יַעֲמֹ֤ד עַל גְּבוּל/וֹ֙ מִ/נֶּ֔גֶב וּ/בֵ֥ית יוֹסֵ֛ף יַעַמְד֥וּ עַל גְּבוּלָ֖/ם מִ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: fr
  text: Ils la partageront en sept portions. Juda restera à sa frontière, au sud[a], et la maison de Joseph restera à leurs frontières, au nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se tiendra sur sa frontière » et « se tiendront sur leurs frontières ». Dans ce contexte territorial, le verbe peut désigner le maintien des territoires dans leurs limites déjà établies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: Ils la partageront
  rationale: La forme peut exprimer ici l’action à venir des hommes chargés de parcourir et de décrire le pays dans le contexte immédiat. « Partager » rend naturellement l’idée de répartir le territoire.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: en sept portions
  rationale: חֲלָקִים désigne les portions résultant du partage du territoire; « portions » convient au contexte d’attribution foncière.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: restera dans ses limites
  rationale: עמד signifie littéralement « se tenir », mais indique ici le maintien de Juda dans les limites territoriales déjà établies. Cette formulation évite de suggérer qu’une tribu se tient physiquement sur une ligne frontière.
- source_word: מִנֶּגֶב
  choice: au sud
  rationale: Le terme a ici une valeur directionnelle, en parallèle avec « au nord », plutôt qu’une désignation spécifique de la région du Néguev.
- source_word: וּבֵית יוֹסֵף
  choice: et la maison de Joseph
  rationale: « Maison de Joseph » conserve l’expression collective désignant les tribus issues de Joseph.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: restera dans les siennes
  rationale: Le verbe pluriel et le suffixe pluriel renvoient collectivement aux groupes de la maison de Joseph. La reprise pronominale évite une répétition lourde tout en gardant l’idée de limites territoriales.
- source_word: מִצָּפוֹן
  choice: au nord
  rationale: Emploi directionnel et géographique, parallèle à « au sud ».
