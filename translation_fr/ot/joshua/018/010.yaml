source:
  edition: WLC
  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: fr
  text: Alors Josué tira au sort pour eux à Silo, devant Yahweh, et là, il répartit le pays entre les fils d’Israël[a], selon leurs divisions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ». Cette expression désigne collectivement le peuple d’Israël.'
    reason: L’expression hébraïque est maintenue dans le texte, mais sa portée collective peut ne pas être immédiatement évidente pour tous les lecteurs.
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: tira au sort
  rationale: Cette locution française rend naturellement l’expression hébraïque « jeter le sort » dans le contexte d’une attribution territoriale, sans introduire l’idée moderne d’un simple jeu de hasard.
- source_word: בְּשִׁלֹה
  choice: à Silo
  rationale: « À » est la préposition française usuelle devant le nom d’une ville ou d’un lieu habité.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formulation conserve l’image hébraïque d’un acte accompli en présence de Yahweh, vraisemblablement dans le cadre du sanctuaire.
- source_word: וַיְחַלֶּק
  choice: répartit
  rationale: Le verbe désigne ici le partage du pays entre ses bénéficiaires. « Répartit » exprime clairement cette distribution sans répéter la notion de tirage au sort.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le terme désigne le territoire attribué à Israël. « Le pays » est naturel en français et garde cette portée géographique.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: entre les fils d’Israël
  rationale: La traduction conserve l’expression hébraïque littérale tout en employant « entre » avec « répartir », tournure idiomatique en français.
- source_word: כְּמַחְלְקֹתָם
  choice: selon leurs divisions
  rationale: Cette formulation proche de l’hébreu préserve le sens de groupements ou de sections servant de cadre à la répartition, sans préciser davantage que le texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant les répétitions et les principaux repères du texte hébreu; le second « Josué » est remplacé par « il » pour éviter une lourdeur non nécessaire en français.
