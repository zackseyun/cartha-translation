  text: וְ/הָי֣וּ הֶֽ/עָרִ֗ים לְ/מַטֵּ֛ה בְּנֵ֥י בִנְיָמִ֖ן לְ/מִשְׁפְּחֽוֹתֵי/הֶ֑ם יְרִיח֥וֹ וּ/בֵית חָגְלָ֖ה וְ/עֵ֥מֶק קְצִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: fr
  text: Et les villes de la tribu des fils de Benjamin, selon leurs clans, étaient Jéricho, Beth-Hogla et Emek-Ketsits[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vallée de Ketsits », si l’expression est comprise comme un nom de lieu descriptif plutôt que comme un toponyme entièrement translittéré.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: Les villes ... étaient
  rationale: La conjonction suivie du parfait de היה introduit ici la liste. Une proposition copulative naturelle en français restitue clairement cette fonction sans accentuer inutilement une nuance existentielle.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: de la tribu des fils de Benjamin
  rationale: Le ל marque ici l’appartenance ou l’attribution dans le cadre du partage territorial. « Fils de Benjamin » conserve l’expression de parenté de l’hébreu tout en restant compréhensible.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: selon leurs clans
  rationale: Dans le contexte tribal, מִשְׁפָּחָה désigne une subdivision de la tribu plutôt que la seule famille nucléaire; « clans » rend donc mieux la portée administrative et sociale.
- source_word: יְרִיחוֹ
  choice: Jéricho
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: בֵית חָגְלָה
  choice: Beth-Hogla
  rationale: Translittération française intelligible du toponyme composé, conforme à l’usage biblique francophone.
- source_word: עֵמֶק קְצִיץ
  choice: Émek-Ketsits
  rationale: Le groupe est traité comme un toponyme composé et translittéré; עֵמֶק peut toutefois garder son sens lexical de « vallée », d’où la note.
