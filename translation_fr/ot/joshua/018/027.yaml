  text: Réqem, Yirpéel et Taréala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֶקֶם
  choice: Réqem
  rationale: Nom propre de lieu dans une liste de villes. La translittération française emploie « q » pour ק et des accents afin de guider naturellement la prononciation.
- source_word: יִרְפְּאֵל
  choice: Yirpéel
  rationale: Nom propre de lieu. « Y » représente directement le yod initial et évite que « Irpéel » soit lu avec une voyelle initiale sans consonne; « é » rend la vocalisation du second élément de façon lisible en français.
- source_word: תַרְאֲלָה
  choice: Taréala
  rationale: Nom propre de lieu translittéré plutôt que traduit. La forme conserve les éléments consonantiques et les voyelles attestées tout en restant prononçable en français.
- source_word: וְ
  choice: et
  rationale: La conjonction préfixée coordonne les noms de lieux; en français, une liste simple prend des virgules et « et » devant le dernier élément.
