  text: וַ/יְהִ֕י כִּ/שְׁמֹ֖עַ יָבִ֣ין מֶֽלֶךְ חָצ֑וֹר וַ/יִּשְׁלַ֗ח אֶל יוֹבָב֙ מֶ֣לֶךְ מָד֔וֹן וְ/אֶל מֶ֥לֶךְ שִׁמְר֖וֹן וְ/אֶל מֶ֥לֶךְ אַכְשָֽׁף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: fr
  text: Lorsque Yabîn, roi de Hatsor, apprit cela[a][b], il envoya à Yobab, roi de Madôn, au roi de Shimrôn[c] et au roi d’Akshaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Et il arriva, lorsque Yabîn, roi de Hatsor, apprit… » La formule narrative hébraïque est rendue ici de façon idiomatique.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit simplement « apprit » ; « cela » est sous-entendu d’après le contexte précédent.
    reason: cross_reference
  - marker: c
    text: Certains identifient ici Shimrôn à « Shimrôn-Merôn », mentionnée en Josué 12.20.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … apprit cela
  rationale: La formule narrative וַיְהִי suivie de כִּשְׁמֹעַ introduit une circonstance temporelle. « Lorsque … apprit » en rend naturellement la valeur en français moderne, sans conserver artificiellement « et il arriva que ».
- source_word: יָבִין
  choice: Yabîn
  rationale: Translittération française du nom personnel hébreu, avec yod initial rendu par « Y » et voyelle longue signalée selon l’usage biblique français.
- source_word: מֶלֶךְ חָצוֹר
  choice: roi de Hatsor
  rationale: La chaîne construite désigne le titre et le territoire. « Hatsor » rend le ח initial et le צ par une graphie française courante et reconnaissable.
- source_word: וַיִּשְׁלַח אֶל
  choice: il envoya des messagers à
  rationale: L’hébreu dit littéralement « il envoya vers », sans préciser le complément envoyé. En français, « des messagers » explicite l’agent nécessairement sous-entendu par cette construction diplomatique et produit une phrase complète et naturelle.
- source_word: יוֹבָב מֶלֶךְ מָדוֹן
  choice: Yobab, roi de Madôn
  rationale: Les noms sont translittérés conformément à leur forme hébraïque, et la chaîne construite est rendue directement par « roi de ».
- source_word: שִׁמְרוֹן
  choice: Shimrôn
  rationale: Le texte massorétique porte ici simplement שִׁמְרוֹן. La traduction conserve cette forme sans l’harmoniser avec « Shimrôn-Merôn » de Josué 12.20.
- source_word: אַכְשָׁף
  choice: Akshaf
  rationale: 'Translittération adaptée au français moderne : א initial n’est pas représenté, כְשׁ est rendu par « ksh », et ף par « f ».'
