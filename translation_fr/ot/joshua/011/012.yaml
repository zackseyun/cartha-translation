source:
  edition: WLC
  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: fr
  text: Josué s’empara de toutes les villes de ces rois et de tous leurs rois. Il les frappa du tranchant de l’épée et les voua à la destruction[a], comme Moïse, serviteur de Yahweh, l’avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les détruisit entièrement » ; l’hébreu emploie ici le verbe technique qui signifie placer des personnes ou des choses sous l’interdit, c’est-à-dire les vouer irrévocablement à la destruction.
    reason: Alternative lexicale explicitant le sens technique de חרם.
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: les villes de ces rois
  rationale: Le groupe construit signifie littéralement « les villes de ces rois ». Cette formulation conserve le lien avec les rois mentionnés dans le contexte sans préciser indûment qu’il s’agirait de « villes royales ».
- source_word: לָכַד
  choice: s’empara de
  rationale: Dans ce contexte de conquête militaire, « s’empara de » exprime naturellement la prise des villes et des rois en français moderne.
- source_word: וַיַּכֵּם
  choice: Il les frappa
  rationale: Le verbe נכה a un sens assez large, mais l’expression suivante, « du tranchant de l’épée », indique ici une action meurtrière. « Frapper » préserve toutefois la formulation concrète de l’hébreu sans la réduire à un simple « vaincre ».
- source_word: לְפִי חֶרֶב
  choice: du tranchant de l’épée
  rationale: Cette expression idiomatique signifie littéralement « à la bouche de l’épée ». « Du tranchant de l’épée » en conserve l’image concrète tout en restant idiomatique en français.
- source_word: הֶחֱרִים
  choice: les voua à la destruction
  rationale: Au hiphil, חרם désigne ici le fait de placer des personnes ou des biens sous l’interdit, en les consacrant irrévocablement à la destruction. Cette traduction garde la valeur technique du terme.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme ... l’avait ordonné
  rationale: La tournure exprime la conformité de l’action de Josué à un ordre antérieur donné par Moïse. Le plus-que-parfait rend clairement cette antériorité narrative.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: Dans ce titre honorifique appliqué à Moïse, « serviteur » convient mieux que « esclave » et exprime son statut officiel dans la relation d’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle « Yahweh », plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Traduction du vocabulaire de חרם dans le récit de conquête
  choice: les voua à la destruction
  alternative: les détruisit entièrement ; les frappa d’interdit
  rationale: Le verbe hébreu est un terme technique qui ne désigne pas seulement une destruction générique. La formulation choisie conserve sa dimension de mise à part irrévocable en vue de la destruction, sans atténuer la violence du texte.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre divin au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « ces rois ... leurs rois », inhabituelle mais présente dans l’hébreu, est conservée afin de ne pas effacer la distinction entre les rois déjà évoqués et les souverains associés à leurs villes. Le marqueur de note est placé directement après l’expression qu’il explique.
