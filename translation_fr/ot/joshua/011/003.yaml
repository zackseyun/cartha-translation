  text: הַֽ/כְּנַעֲנִי֙ מִ/מִּזְרָ֣ח וּ/מִ/יָּ֔ם וְ/הָ/אֱמֹרִ֧י וְ/הַ/חִתִּ֛י וְ/הַ/פְּרִזִּ֥י וְ/הַ/יְבוּסִ֖י בָּ/הָ֑ר וְ/הַֽ/חִוִּי֙ תַּ֣חַת חֶרְמ֔וֹן בְּ/אֶ֖רֶץ הַ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: fr
  text: les Cananéens à l’est et à l’ouest[a], les Amorites, les Hittites, les Perizzites et les Jébusites dans la région montagneuse, ainsi que les Hivites au pied de l’Hermon, dans le pays de Mitspa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « et du côté de la mer » ; ici, « la mer » désigne vraisemblablement l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le gentilé singulier avec article a un sens collectif en hébreu. Le pluriel désigne naturellement le peuple en français.
- source_word: מִמִּזְרָח וּמִיָּם
  choice: à l’est et à l’ouest
  rationale: Dans cette indication géographique, les prépositions marquent la localisation ou l’étendue. « La mer » désigne vraisemblablement l’ouest, par référence à la Méditerranée.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: les Amorites, les Hittites, les Perizzites et les Jébusites
  rationale: Ces gentilés singuliers sont collectifs en hébreu; le pluriel est la forme naturelle en français pour les peuples concernés.
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: Dans Josué, le terme désigne couramment les hautes terres ou la région montagneuse plutôt qu’une montagne isolée.
- source_word: הַחִוִּי
  choice: les Hivites
  rationale: Le singulier hébreu est collectif; le pluriel français exprime clairement le peuple.
- source_word: תַּחַת חֶרְמוֹן
  choice: au pied de l’Hermon
  rationale: La préposition indique ici une situation en contrebas de l’Hermon; cette formulation est naturelle et géographiquement claire sans ajouter « mont », absent de l’hébreu.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: dans le pays de Mitspa
  rationale: אֶרֶץ désigne ici un territoire. Mitspa est conservé comme nom géographique selon sa forme française biblique usuelle.
