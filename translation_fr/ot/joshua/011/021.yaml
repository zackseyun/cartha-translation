source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: fr
  text: 'À cette époque-là, Josué vint et élimina les Anaqites de la région montagneuse : d’Hébron, de Debir, d’Anab, de toute la région montagneuse de Juda et de toute la région montagneuse d’Israël. Josué les voua à la destruction[a], ainsi que leurs villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « les frappa d’interdit ». Le verbe hébreu exprime ici le fait de vouer des personnes ou des biens à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint
  rationale: Le verbe בוא fait progresser le récit et peut signifier « venir » ou « aller » selon le point de vue. « Vint » conserve ici le mouvement exprimé par l’hébreu sans préciser une perspective absente du texte.
- source_word: בָּעֵת הַהִיא
  choice: À cette époque-là
  rationale: Cette tournure française naturelle maintient le lien temporel avec le récit précédent sans définir une durée précise.
- source_word: וַיַּכְרֵת
  choice: élimina
  rationale: כרת signifie littéralement « retrancher, couper ». Appliqué à un peuple retiré d’un territoire, « élimina » rend clairement le sens contextuel tout en restant distinct du verbe חרם qui suit.
- source_word: הָעֲנָקִים
  choice: les Anaqites
  rationale: « Anaqites » est la forme française usuelle du nom de ce peuple, dérivé d’Anaq.
- source_word: מִן הָהָר
  choice: de la région montagneuse
  rationale: Dans Josué, הָהָר désigne couramment une zone de hautes terres plutôt qu’une montagne isolée. « Région montagneuse » est géographiquement précis et naturel en français international.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: d’Hébron, de Debir, d’Anab
  rationale: Les noms de lieux sont translittérés selon l’usage français. La répétition de « de » reflète la structure de la liste hébraïque.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: et de toute la région montagneuse de Juda
  rationale: Le syntagme désigne l’ensemble des hautes terres associées à Juda.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: et de toute la région montagneuse d’Israël
  rationale: La désignation « Israël » est conservée sans l’expliciter comme un territoire ou un groupe humain, afin de préserver la formulation du texte.
- source_word: עִם עָרֵיהֶם
  choice: ainsi que leurs villes
  rationale: עִם exprime l’accompagnement. « Ainsi que » relie naturellement les villes au sort des Anaqites.
- source_word: הֶחֱרִימָם
  choice: les voua à la destruction
  rationale: Au hiphil, חרם exprime la mise à part sous interdit en vue de la destruction. Cette formulation garde sa force particulière et évite de le confondre avec כרת dans la première phrase.
theological_decisions:
- issue: Rendu du vocabulaire de חרם dans le contexte de guerre
  choice: Josué les voua à la destruction
  alternative: Josué les frappa d’interdit / les détruisit entièrement
  rationale: Le verset emploie à la fois כרת et חרם. Les distinguer préserve la dimension particulière, à la fois consacratoire et destructrice, de חרם sans ajouter d’explication doctrinale au corps du texte. La note donne l’équivalent plus formel.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve l’enchaînement narratif et la liste géographique de l’hébreu. Le vocabulaire distingue volontairement כרת (« élimina ») de חרם (« voua à la destruction »).
