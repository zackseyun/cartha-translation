  register: Français international moderne, naturel et digne. Le verset demeure une proposition coordonnée incomplète, puisqu’il poursuit la phrase du verset précédent. Les noms géographiques sont rendus de façon transparente, tandis que l’incertitude de נָפוֹת est conservée en note.
