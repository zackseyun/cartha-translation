  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: fr
  text: et aux rois qui étaient au nord, dans la région montagneuse, dans l’Araba au sud de Kinnéreth, dans le Bas-Pays et sur les hauteurs de Dor[a], à l’ouest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les districts de Dor », « dans la région de Dor » ou « sur les pentes de Dor ». Le terme hébreu est rare, et son sens topographique précis est discuté.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « depuis la mer » ; dans l’usage géographique hébreu, cette expression désigne couramment l’ouest.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: et aux
  rationale: La conjonction et la préposition poursuivent la liste commencée au verset précédent et introduisent d’autres destinataires.
- source_word: הַמְּלָכִים
  choice: rois
  rationale: מֶלֶךְ désigne précisément des rois, plutôt que des dirigeants au sens large.
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: qui étaient au nord
  rationale: La proposition relative situe ces rois dans la région septentrionale; cette formulation française s’accorde naturellement avec l’énumération géographique qui suit.
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: Dans les descriptions territoriales de Josué, הַר désigne souvent une zone de montagnes ou de collines, et non une montagne isolée.
- source_word: וּבָעֲרָבָה
  choice: dans l’Araba
  rationale: עֲרָבָה est ici un nom géographique reconnu; le conserver évite de le réduire au sens générique de plaine.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: au sud de Kinnéroth
  rationale: נֶגֶב a ici une valeur directionnelle et situe l’Araba par rapport à Kinnéroth, plutôt que de désigner la région méridionale du Néguev.
- source_word: וּבַשְּׁפֵלָה
  choice: dans le Bas-Pays
  rationale: שְׁפֵלָה désigne la région basse ou les contreforts; « Bas-Pays » garde la valeur régionale du terme tout en restant compréhensible.
- source_word: וּבְנָפוֹת דּוֹר
  choice: sur les hauteurs de Dor
  rationale: Le terme rare נָפוֹת a un sens topographique discuté. « Sur les hauteurs de Dor » conserve une interprétation topographique plausible sans masquer l’incertitude, signalée en note.
- source_word: מִיָּם
  choice: à l’ouest
  rationale: Littéralement lié à la « mer », יָם sert fréquemment d’indication géographique pour l’ouest, la Méditerranée se trouvant de ce côté.
theological_decisions: []
