  text: לֹֽא נוֹתַ֣ר עֲנָקִ֔ים בְּ/אֶ֖רֶץ בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֗ק בְּ/עַזָּ֛ה בְּ/גַ֥ת וּ/בְ/אַשְׁדּ֖וֹד נִשְׁאָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: fr
  text: Il ne resta aucun Anakite dans le pays des Israélites ; il n’en resta qu’à Gaza, à Gath et à Ashdod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נוֹתַר עֲנָקִים
  choice: Il ne resta aucun Anakite
  rationale: 'Le nifal singulier נוֹתַר exprime ici le résultat des campagnes : aucun membre de ce peuple ne subsista dans le territoire indiqué. « Aucun Anakite » rend naturellement en français le pluriel ethnonymique עֲנָקִים.'
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: dans le pays des Israélites
  rationale: Littéralement « dans le pays des fils d’Israël ». En français actuel, « les Israélites » désigne naturellement le peuple issu d’Israël sans perdre la valeur collective de l’expression hébraïque.
- source_word: רַק
  choice: ne… qu’
  rationale: La tournure restrictive française « ne… qu’ » rend directement la limitation marquée par רַק.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: à Gaza, à Gath et à Ashdod
  rationale: La préposition locative est répétée devant chaque nom, conformément à un français naturel et soigné. Les formes françaises usuelles des toponymes sont conservées.
- source_word: נִשְׁאָרוּ
  choice: il n’en resta
  rationale: Le pronom « en » reprend les Anakites et évite d’ajouter explicitement « quelques-uns ». Le pluriel hébreu est rendu par la construction impersonnelle idiomatique française, tout en conservant l’idée d’un reste.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit de près la structure contrastive de l’hébreu, tout en évitant le littéralisme peu naturel « fils d’Israël ». Le passé simple convient au registre narratif biblique sans être archaïque.
