source:
  edition: WLC
  text: וַ/יֵּצְא֣וּ הֵ֗ם וְ/כָל מַֽחֲנֵי/הֶם֙ עִמָּ֔/ם עַם רָ֕ב כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַת הַ/יָּ֖ם לָ/רֹ֑ב וְ/ס֥וּס וָ/רֶ֖כֶב רַב מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: fr
  text: 'Ils sortirent, eux et toutes les troupes qui les accompagnaient[a] : un peuple nombreux, aussi nombreux que le sable qui est au bord de la mer, avec des chevaux et des chars en très grand nombre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tous leurs camps ». Le mot hébreu peut désigner les campements militaires ou, par extension, les troupes qui y sont rassemblées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Ils sortirent
  rationale: Le verbe יצא décrit un mouvement vers l’extérieur. « Sortirent » conserve ce sens sans ajouter explicitement l’idée d’une marche militaire.
- source_word: מַחֲנֵיהֶם
  choice: toutes les troupes qui les accompagnaient
  rationale: מַחֲנֶה peut désigner un campement ou, par extension, les forces qui y sont rassemblées. Dans ce contexte de coalition militaire en mouvement, « troupes » est naturel en français, tandis que la note conserve l’image littérale des camps.
- source_word: עַם רָב
  choice: un peuple nombreux
  rationale: Cette formulation garde le nom collectif עַם, « peuple », et rend רָב dans son sens quantitatif, explicité par la comparaison qui suit.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: aussi nombreux que le sable qui est au bord de la mer
  rationale: La comparaison exprime l’immensité du nombre. « Aussi nombreux que » intègre naturellement la valeur adverbiale de לָרֹב tout en conservant l’image concrète du texte hébreu.
- source_word: סוּס
  choice: des chevaux
  rationale: Le singulier hébreu a ici une valeur collective ; le pluriel est idiomatique en français.
- source_word: רֶכֶב
  choice: des chars
  rationale: רֶכֶב désigne ici les chars ou la force de chars. « Chars » est clair et approprié au contexte militaire ancien.
- source_word: רַב מְאֹד
  choice: en très grand nombre
  rationale: Cette expression française rend l’intensification quantitative appliquée aux chevaux et aux chars sans tournure archaïque.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe conserve l’insistance de « eux » et le nom collectif « peuple », tout en rendant naturellement le vocabulaire militaire.
