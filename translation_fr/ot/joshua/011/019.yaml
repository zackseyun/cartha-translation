translation_notes:
  register: Français international moderne, narratif et digne. « Gabaon » et « Hivites » suivent les formes bibliques françaises usuelles. La formulation évite un calque lourd de « fils d’Israël » et clarifie le référent de la dernière proposition sans modifier le contraste du verset.
