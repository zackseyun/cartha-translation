  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: fr
  text: Il n’y eut aucune ville qui fit la paix avec les Israélites, à l’exception des Hivites qui habitaient Gabaon ; les Israélites prirent toutes les autres à la guerre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: fit la paix avec
  rationale: Le hiphil de שׁלם associé à אֶל exprime ici l’établissement de relations pacifiques. « Faire la paix avec » est naturel en français et n’ajoute pas l’idée plus précise d’une reddition.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation française courante rend naturellement le nom collectif littéralement exprimé par « les fils d’Israël », sans suggérer que seuls les hommes sont concernés.
- source_word: בִּלְתִּי
  choice: à l’exception de
  rationale: Le terme introduit l’unique exception à la négation qui précède.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: les Hivites qui habitaient Gabaon
  rationale: Le participe יֹשְׁבֵי désigne ceux qui résident dans la ville. « Qui habitaient » est clair, actuel et fidèle au sens.
- source_word: אֶת הַכֹּל
  choice: toutes les autres
  rationale: Le pronom implicite renvoie aux villes mentionnées dans la première proposition. « Les autres » rend explicite ce référent et évite de donner l’impression que les Gabaonites furent eux aussi pris au combat.
- source_word: לָקְחוּ בַמִּלְחָמָה
  choice: furent prises au combat
  rationale: Le verbe לקח signifie littéralement « prendre » et reçoit ici un sens militaire. Le passif français garde les villes comme référent de « toutes les autres », tandis que « au combat » exprime naturellement la circonstance guerrière.
