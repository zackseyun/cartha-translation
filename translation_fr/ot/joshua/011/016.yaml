  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: fr
  text: 'Josué prit tout ce pays : la région montagneuse, tout le Néguev, tout le pays de Goshen[a], la plaine[b], l’Araba[c], la région montagneuse d’Israël et sa plaine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pays de Goshen mentionné ici est une région de Canaan, à ne pas confondre nécessairement avec le pays de Goshen en Égypte.
    reason: cultural_note
  - marker: b
    text: Ou « la Shéphéla ». Le terme hébreu désigne la région de basses collines située entre les hautes terres centrales et la plaine côtière; il revient à la fin du verset.
    reason: lexical_alternative
  - marker: c
    text: « L’Araba » est un nom géographique régional; on le traduit parfois de manière plus interprétative par « vallée du Jourdain » ou « plaine désertique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: s’empara de
  rationale: Dans ce résumé de conquête, לקח signifie littéralement « prendre », mais « s’empara de » exprime naturellement en français la prise militaire du territoire sans développer davantage la notion de possession.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: tout ce pays
  rationale: אֶרֶץ désigne ici l’ensemble du territoire énuméré ensuite. « Tout ce pays » conserve la portée du démonstratif הַזֹּאת et convient à une liste de régions.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Dans Josué, הָהָר désigne généralement la zone de hauteurs plutôt que des montagnes particulières. « Région montagneuse » rend clairement ce sens géographique.
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Le terme fonctionne ici comme le nom reconnu d’une région méridionale; sa translittération évite de le réduire au simple « sud ».
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: le pays de Goshèn
  rationale: La construction hébraïque est rendue directement, sans identifier cette région cananéenne au Goshèn d’Égypte.
- source_word: הַשְּׁפֵלָה
  choice: le Bas-Pays
  rationale: שְׁפֵלָה désigne la région de basses collines entre les hautes terres centrales et la plaine côtière. « Bas-Pays » est intelligible et garde sa valeur de désignation régionale.
- source_word: הָעֲרָבָה
  choice: l’Araba
  rationale: עֲרָבָה est ici un terme géographique régional. La translittération préserve son extension sans l’identifier trop étroitement à la seule vallée du Jourdain.
- source_word: הַר יִשְׂרָאֵל
  choice: la région montagneuse d’Israël
  rationale: Comme הָהָר au début du verset, l’expression désigne une région de hauteurs; « d’Israël » conserve simplement le rapport construit.
- source_word: וּשְׁפֵלָתוֹ
  choice: et son Bas-Pays
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à la région montagneuse d’Israël. Le possessif conserve ce lien grammatical et le contraste topographique du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les noms régionaux Néguev et Araba sont conservés, tandis que les termes topographiques sont traduits de façon accessible. La répétition et le lien pronominal de l’hébreu sont maintenus.
