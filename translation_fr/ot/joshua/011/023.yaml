    issue: 'La répartition est reformulée comme un participe d’action : « en le répartissant entre ses tribus ».'
    rationale: Le texte hébreu dit que Josué donna le pays à Israël comme héritage « selon leurs divisions, par leurs tribus ». La reformulation reste globalement plausible, mais elle interprète plus explicitement la manière dont Josué agit et ne conserve pas aussi bien l’organisation en divisions tribales.
  - severity: low
    issue: La note b donne « selon leurs tribus » comme littéral.
    rationale: La préposition ל dans לְשִׁבְטֵיהֶם est mieux représentée dans cette construction par « par leurs tribus »; « selon » répète indûment la valeur du premier כְּ.
