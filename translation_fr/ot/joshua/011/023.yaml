  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: fr
  text: Ainsi, Josué prit tout le pays[a], conformément à tout ce que Yahweh avait dit à Moïse, et il le donna à Israël comme héritage, selon leurs divisions tribales[b]. Puis le pays connut le repos, sans guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la terre ». Ici, l’expression résume la conquête du territoire dont il est question.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon leurs divisions, par leurs tribus ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie fondamentalement « prendre ». « Prit » conserve la concision du résumé hébreu sans préciser indûment « conquit » ou « prit possession de ».
- source_word: כָּל הָאָרֶץ
  choice: tout le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire dont il est question, non la terre entière. « Tout le pays » est naturel en français et préserve la portée générale du résumé.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: conformément à tout ce que … avait dit
  rationale: La tournure exprime la conformité à une parole antérieure. Le plus-que-parfait rend clairement cette antériorité en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיִּתְּנָהּ
  choice: le donna
  rationale: Le pronom reprend « le pays », masculin en français. « Donner » conserve le sens de base de נתן, tandis que la suite précise qu'il s'agit d'un héritage réparti.
- source_word: לְנַחֲלָה
  choice: en héritage
  rationale: נחלה désigne ici un bien reçu en partage et transmis comme patrimoine. « En héritage » en conserve la portée juridique et théologique.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: en le répartissant entre ses tribus
  rationale: La formulation française exprime naturellement l'idée d'une distribution en parts selon l'organisation tribale, sans alourdir le texte par le calque « selon leurs divisions ».
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: connut le repos, sans guerre
  rationale: שקט exprime le calme ou le repos après le conflit. Cette formulation française conserve l'image du repos et indique qu'il s'agit de la cessation de la guerre, sans affirmer une paix absolue en tout lieu.
theological_decisions:
- issue: Portée de « tout le pays » dans le résumé de la conquête
  choice: Conserver l'affirmation générale « tout le pays » sans en préciser davantage la portée dans le corps du texte.
  alternative: Interpréter explicitement l'expression comme une occupation immédiate et exhaustive de chaque territoire, ou comme une simple hyperbole militaire.
  rationale: Le texte hébreu formule un résumé de l'accomplissement de la parole de Yahweh. La traduction doit préserver cette affirmation ainsi que sa tension avec les passages qui mentionnent encore des territoires à prendre, sans imposer une harmonisation.
- issue: Nature du repos après la guerre
  choice: Rendre l'expression comme une cessation de la guerre dans le pays.
  alternative: Comprendre qu'une paix universelle et définitive était alors établie.
  rationale: Le verbe שקט évoque le calme après les hostilités, mais ne requiert pas que la traduction affirme l'absence absolue de tout conflit ultérieur.
translation_notes:
  register: Français international moderne, clair et digne. « Pays » a été préféré à « terre » dans le texte principal pour désigner naturellement le territoire, tandis que la note conserve l'autre rendu possible. La syntaxe a été légèrement restructurée afin d'éviter un calque lourd de l'hébreu.
