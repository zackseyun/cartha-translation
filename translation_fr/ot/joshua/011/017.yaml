  variant: modern international French
source:
  edition: WLC
  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: fr
  text: depuis le mont Halak[a], qui s’élève en direction de Séïr, jusqu’à Baal-Gad, dans la vallée du Liban[b], au-dessous du mont Hermon. Josué captura tous leurs rois, les frappa et les mit à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la montagne lisse ». L’hébreu peut être compris comme une description, mais il s’agit probablement ici du nom de lieu « mont Halak ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la plaine du Liban ». Le terme hébreu peut désigner une large vallée ou une plaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: le mont Halak
  rationale: Dans ce résumé géographique, l’expression fonctionne vraisemblablement comme un nom de lieu. La translittération préserve cette lecture, tandis que la note signale le sens descriptif possible.
- source_word: הָעֹלֶה שֵׂעִיר
  choice: qui s’élève en direction de Séïr
  rationale: Le participe de עלה exprime ici l’élévation ou la montée topographique; « en direction de » rend naturellement la relation avec Séïr sans imposer que la montagne elle-même se déplace.
- source_word: וְעַד
  choice: jusqu’à
  rationale: Marque la limite de l’étendue territoriale décrite.
- source_word: בַּעַל גָּד
  choice: Baal-Gad
  rationale: Nom géographique translittéré plutôt que traduit.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: dans la vallée du Liban
  rationale: בִּקְעָה désigne une large vallée ou une plaine encaissée; « vallée » est naturel ici, tout en conservant l’autre possibilité en note.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: au-dessous du mont Hermon
  rationale: Rend la position géographique inférieure indiquée par תַּחַת dans un français clair.
- source_word: לָכַד
  choice: captura
  rationale: Verbe militaire approprié lorsque les objets sont des rois.
- source_word: וַיַּכֵּם
  choice: les frappa
  rationale: Conserve le sens concret et violent de נכה sans l’assimiler au verbe suivant, qui exprime explicitement la mise à mort.
- source_word: וַיְמִיתֵם
  choice: les mit à mort
  rationale: Rend explicitement la forme causative de מות et maintient sa distinction avec « les frappa ».
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le nom « Josué » est explicité dans la seconde phrase afin d’éviter en français une reprise pronominale ambiguë après « mont Hermon », tout en conservant le référent du contexte hébreu. Les trois verbes successifs sont maintenus pour respecter la progression du texte source.
