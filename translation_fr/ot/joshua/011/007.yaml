  text: וַ/יָּבֹ֣א יְהוֹשֻׁ֡עַ וְ/כָל עַם֩ הַ/מִּלְחָמָ֨ה עִמּ֧/וֹ עֲלֵי/הֶ֛ם עַל מֵ֥י מֵר֖וֹם פִּתְאֹ֑ם וַֽ/יִּפְּל֖וּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: fr
  text: Alors Josué, avec tous les combattants[a] qui l’accompagnaient, arriva soudain contre eux aux eaux de Mérom, et ils fondirent sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « le peuple de la guerre » ; traduction traditionnelle : « les hommes de guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le qal narratif de בוא peut signifier « venir » ou « aller » selon le point de vue. « Arriva » exprime naturellement ici le mouvement jusqu’au lieu de l’affrontement.
- source_word: עַם הַמִּלְחָמָה
  choice: les combattants
  rationale: Littéralement « le peuple de la guerre/du combat ». « Les combattants » conserve le sens collectif et militaire sans ajouter la précision masculine de la tournure traditionnelle « les hommes de guerre ».
- source_word: עִמּוֹ
  choice: qui l’accompagnaient
  rationale: 'Rend naturellement en français l’idée d’accompagnement exprimée par la préposition et son suffixe : « avec lui ».'
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: Avec un déplacement hostile, עַל peut signifier « contre » ou « sur ». « Contre eux » indique clairement la progression offensive.
- source_word: עַל מֵי מֵרוֹם
  choice: aux eaux de Mérom
  rationale: La formule désigne le lieu appelé les eaux de Mérom. « Aux eaux de Mérom » reste proche de l’hébreu tout en étant idiomatique.
- source_word: פִּתְאֹם
  choice: soudain
  rationale: Équivalent direct qui conserve le caractère brusque et inattendu de l’arrivée.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: ils fondirent sur eux
  rationale: נפל avec ב décrit idiomatiquement une attaque. « Fondre sur » conserve l’image vive de l’hébreu mieux que le simple « attaquer ».
- source_word: וְ
  choice: donc
  rationale: Le waw initial poursuit la séquence narrative. « Donc » relie naturellement cette action au contexte précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase garde la brusquerie de l’attaque et emploie « combattants » comme collectif naturel, sans introduire une spécification masculine absente du nom collectif hébreu.
