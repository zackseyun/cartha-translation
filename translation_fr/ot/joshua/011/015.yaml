revisions:
- from: Comme Yahweh l’avait ordonné à Moïse, son serviteur, ainsi Moïse l’ordonna à Josué, et ainsi fit Josué. Il ne retrancha rien de tout ce que Yahweh avait ordonné à Moïse.[a]
  to: De même que Yahweh avait ordonné à Moïse, son serviteur, Moïse l’ordonna à Josué, et Josué fit ainsi. Il n’omit rien de tout ce que Yahweh avait ordonné à Moïse.[a]
  rationale: La révision remplace un calque français ambigu par une formulation idiomatique qui exprime l’obéissance complète visée par l’idiome hébreu, tout en préservant l’image littérale dans une note. Elle fluidifie également le second membre de la comparaison sans modifier la structure ni le sens du verset.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:08:16Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet conserve correctement la chaîne d’autorité (Yahweh → Moïse → Josué), le statut de Moïse comme « son serviteur », la répétition comparative et l’affirmation finale d’une obéissance sans exception. « Ne retrancha rien » reproduit trop littéralement l’image de הֵסִיר, mais ne rend pas clairement en français le sens contextuel d’omission ou de non-exécution.
  naturalness: « Ainsi Moïse l’ordonna à Josué, et ainsi fit Josué » est compréhensible, mais son inversion est inutilement raide en français international moderne. « Josué fit ainsi » est plus naturel. « Il n’omit rien » est une expression française claire et digne pour l’idiome final.
  terminology: « Yahweh », « Moïse », « Josué » et « serviteur » sont appropriés. Le nom divin est maintenu de manière cohérente. La note conserve l’image littérale sans lui attribuer une portée doctrinale.
  issues:
  - severity: medium
    issue: « Il ne retrancha rien » est un calque peu idiomatique et imprécis dans ce contexte.
    rationale: En français, retrancher évoque surtout la suppression d’un élément d’un texte ou d’un ensemble. L’hébreu לֹא הֵסִיר דָּבָר, dans ce contexte d’exécution d’ordres, affirme que Josué n’a rien omis ou laissé inexécuté.
  - severity: low
    issue: La double tournure « ainsi … et ainsi fit Josué » est lourde.
    rationale: Elle imite la syntaxe hébraïque au détriment de la fluidité française. La correspondance de כֵּן est suffisamment préservée par « Josué fit ainsi ».
  revised_text: De même que Yahweh avait ordonné à Moïse, son serviteur, Moïse l’ordonna à Josué, et Josué fit ainsi. Il n’omit rien de tout ce que Yahweh avait ordonné à Moïse.[a]
  revised_footnotes:
  - marker: a
    text: 'Litt. : « Il ne retira pas une chose de tout ce que Yahweh avait ordonné à Moïse. »'
    reason: Explicitation de l’image lexicale hébraïque derrière « Il n’omit rien ».
