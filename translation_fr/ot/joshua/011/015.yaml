source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: fr
  text: De même que Yahweh avait ordonné à Moïse, son serviteur, Moïse l’ordonna à Josué, et Josué fit ainsi. Il n’omit rien de tout ce que Yahweh avait ordonné à Moïse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Il ne retira pas une chose de tout ce que Yahweh avait ordonné à Moïse. »'
    reason: Explicitation de l’image lexicale hébraïque derrière « Il n’omit rien ».
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Comme
  rationale: Introduit la correspondance entre l’ordre donné par Yahweh à Moïse et celui que Moïse transmet à Josué; « Comme » est naturel et conserve la comparaison.
- source_word: צִוָּה
  choice: avait ordonné / ordonna
  rationale: Le verbe exprime un commandement faisant autorité. Le plus-que-parfait situe le commandement de Yahweh avant sa transmission par Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans ce contexte honorifique appliqué à Moïse, « serviteur » convient mieux que « esclave ».
- source_word: כֵּן
  choice: ainsi
  rationale: Marque la correspondance; sa répétition conserve le parallélisme sobre de l’hébreu.
- source_word: עָשָׂה
  choice: fit
  rationale: Préserve la brièveté du verbe hébreu, la phrase suivante précisant l’étendue de l’obéissance de Josué.
- source_word: לֹא הֵסִיר דָּבָר
  choice: Il ne retrancha rien
  rationale: Rend de manière intelligible l’image hébraïque de ne rien enlever aux commandements reçus, tout en restant proche de sa formulation.
- source_word: מִכֹּל אֲשֶׁר
  choice: de tout ce que
  rationale: Exprime la totalité des commandements concernés dans une tournure française naturelle.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marqueur du complément d’objet direct sans équivalent lexical autonome en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le Tétragramme; « Yahweh » préserve ici le nom personnel de Dieu sans lui substituer un titre.
- issue: Portée de l’obéissance de Josué
  choice: Il ne retrancha rien de tout ce que Yahweh avait ordonné
  alternative: Il n’omit rien de tout ce que Yahweh avait ordonné
  rationale: La formulation retenue conserve l’image de l’hébreu sans atténuer l’affirmation d’une obéissance complète; la note donne l’équivalent idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « ainsi… et ainsi… » maintient la structure emphatique de l’hébreu. Le marqueur de note est placé après la proposition qu’il explique.
