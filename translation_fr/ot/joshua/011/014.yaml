revisions:
- from: Les Israélites prirent pour eux tout le butin de ces villes ainsi que le bétail. Mais ils frappèrent toute la population du tranchant de l’épée, jusqu’à l’exterminer. Ils ne laissèrent en vie aucun être qui respire.[a]
  to: Les Israélites prirent pour eux tout le butin de ces villes ainsi que le bétail. Seulement, ils frappèrent toute la population avec le tranchant de l’épée, jusqu’à l’exterminer. Ils ne laissèrent en vie aucun être qui respire.[a]
  rationale: La révision est limitée au renforcement du contraste exprimé par רַק, à une formulation française plus idiomatique de l’expression « tranchant de l’épée », et à une note lexicale plus exacte. Elle ne modifie ni la portée collective de la population humaine ni la violence explicite du texte source.
