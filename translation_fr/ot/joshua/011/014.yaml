source:
  edition: WLC
  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: fr
  text: Les Israélites prirent pour eux tout le butin de ces villes ainsi que le bétail. Seulement, ils frappèrent toute la population avec le tranchant de l’épée, jusqu’à l’exterminer. Ils ne laissèrent en vie aucun être qui respire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ne laissèrent aucun être respirant »; cette expression signifie qu’ils ne laissèrent aucun survivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  choice: butin
  rationale: Désigne les biens pris à la guerre; « butin » est le terme français naturel et précis.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: Le démonstratif renvoie aux villes qui viennent d’être mentionnées.
- source_word: הַבְּהֵמָה
  choice: le bétail
  rationale: Dans ce contexte, le nom désigne les animaux domestiques considérés comme prise de guerre.
- source_word: בָּזְזוּ לָהֶם
  choice: prirent pour eux
  rationale: Cette formulation rend l’appropriation du butin et conserve la nuance de bénéfice exprimée par לָהֶם, sans répétition maladroite de « butin » et « piller ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël »; en français moderne, « les Israélites » est la désignation collective naturelle du peuple dans ce récit.
- source_word: כָּל הָאָדָם
  choice: toute la population
  rationale: אָדָם désigne ici collectivement les êtres humains des villes, par contraste avec le bétail; cette traduction n’exclut ni les femmes ni les enfants.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: ils frappèrent du tranchant de l’épée
  rationale: Rend naturellement l’idiome hébreu, littéralement « à la bouche de l’épée », tout en en conservant l’image concrète.
- source_word: עַד הִשְׁמִדָם אוֹתָם
  choice: jusqu’à l’exterminer
  rationale: Le hiphil de שׁמד exprime ici la destruction totale de la population; « exterminer » restitue cette force sans introduire le vocabulaire distinct du ḥerem.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: Ils ne laissèrent en vie aucun être qui respire
  rationale: Conserve l’image du souffle portée par נְשָׁמָה tout en explicitant idiomatiquement l’absence de survivants.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression fonctionne ici comme une désignation collective du peuple. La forme idiomatique française évite de suggérer que seuls des hommes au sens sexué sont visés.
- issue: Portée de כָּל הָאָדָם
  choice: toute la population
  alternative: tous les êtres humains
  rationale: Le singulier collectif אָדָם s’oppose au bétail et englobe les habitants humains sans distinction; « population » préserve cette portée.
- issue: Force de שׁמד
  choice: exterminer
  alternative: détruire entièrement
  rationale: Le verbe exprime la suppression totale dans ce contexte. La traduction ne l’assimile pas au vocabulaire technique de la mise à l’interdit, absent de la proposition.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe divisée en phrases lisibles; violence du texte conservée sans euphémisme. Le marqueur [a] figure dans le texte principal.
