  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: fr
  text: Ils frappèrent du tranchant de l’épée toutes les personnes qui s’y trouvaient, les vouant à la destruction[a]. Il ne resta aucun être vivant[b], puis il livra Hatsor aux flammes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les mettant sous l’interdit ». Le verbe hébreu appartient au vocabulaire du ḥerem : ce qui est ainsi voué est mis à part pour être détruit.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « il ne resta aucun souffle », expression signifiant qu’il ne resta aucun survivant.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu passe ici du pluriel (« ils frappèrent ») au singulier (« il livra Hatsor aux flammes »), ce dernier sujet désignant vraisemblablement Josué.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: Ils frappèrent
  rationale: Le hifil de נכה désigne couramment le fait d’abattre des ennemis au combat. Dans ce contexte, « frappèrent du tranchant de l’épée » exprime naturellement l’issue mortelle sans ajouter un verbe absent du texte.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: toutes les personnes qui s’y trouvaient
  rationale: נֶפֶשׁ désigne ici les personnes présentes dans la ville, non une âme immatérielle. Le pluriel français rend naturellement le collectif singulier hébreu.
- source_word: לְפִי חֶרֶב
  choice: du tranchant de l’épée
  rationale: Cette tournure rend l’expression idiomatique hébraïque, littéralement « à la bouche de l’épée », tout en conservant son image concrète.
- source_word: הַחֲרֵם
  choice: les vouant à la destruction
  rationale: L’infinitif absolu de חרם précise que les victimes sont placées sous le ḥerem. La formulation retient l’idée de consécration irrévocable à la destruction sans recourir dans le texte principal au terme technique « interdit ».
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: Il ne resta aucun être qui respire
  rationale: 'נְשָׁמָה évoque le souffle. Cette formulation conserve l’image hébraïque et son sens contextuel : aucun survivant ne demeura.'
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Transcription française moderne du nom propre hébreu חָצוֹר.
- source_word: שָׂרַף בָּאֵשׁ
  choice: il brûla Hatsor
  rationale: En français, « brûler Hatsor » exprime pleinement l’action; ajouter « par le feu » serait redondant et peu naturel. Le singulier du verbe hébreu est néanmoins strictement conservé.
theological_decisions:
- issue: Rendu de חרם dans le récit de conquête
  choice: les vouant à la destruction
  alternative: les exterminant ; les mettant sous l’interdit
  rationale: 'חרם comporte ici davantage que l’idée générale de tuer : il désigne une mise à part irrévocable en vue de la destruction. Le choix garde cette portée cultuelle et judiciaire sans développer une interprétation doctrinale.'
- issue: Passage du sujet pluriel au sujet singulier
  choice: Ils frappèrent… puis il brûla Hatsor
  alternative: Ils frappèrent… puis ils brûlèrent Hatsor
  rationale: L’hébreu passe explicitement du pluriel וַיַּכּוּ au singulier שָׂרַף. La traduction conserve cette variation, le sujet singulier renvoyant vraisemblablement à Josué, sans l’insérer directement dans le texte.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe reste directe, la violence du texte n’est ni atténuée ni amplifiée. « Hatsor » suit l’usage courant des traductions bibliques françaises. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
