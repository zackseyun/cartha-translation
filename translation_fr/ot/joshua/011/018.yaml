  text: Joshua made war against all these kings for many days[a].
translation:
  language: fr
  text: Josué fit la guerre à tous ces rois pendant de nombreux jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Josué fit la guerre à tous ces rois pendant longtemps ». L’hébreu dit littéralement « de nombreux jours » et emploie l’expression « faire la guerre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: La formule signifie littéralement « de nombreux jours » et peut désigner une longue période. Cette traduction conserve l’image hébraïque tout en restant naturelle en français.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: fit la guerre
  rationale: L’expression hébraïque emploie le verbe courant « faire » avec « guerre ». « Faire la guerre » est idiomatique en français et demeure proche de la formulation source.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: à tous ces rois
  rationale: Dans la construction « faire la guerre à », le français exige la préposition « à », qui exprime ici clairement l’hostilité envers l’ensemble de ces rois.
- source_word: מִלְחָמָה
  choice: la guerre
  rationale: Le nom peut signifier « guerre » ou « combat ». Avec עָשָׂה, « faire la guerre » rend naturellement l’expression dans ce contexte.
