  text: וַ/יִּוָּ֣עֲד֔וּ כֹּ֖ל הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַ/יָּבֹ֜אוּ וַ/יַּחֲנ֤וּ יַחְדָּו֙ אֶל מֵ֣י מֵר֔וֹם לְ/הִלָּחֵ֖ם עִם יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/005.yaml
  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: fr
  text: Tous ces rois se donnèrent rendez-vous[a], puis ils vinrent et campèrent ensemble aux eaux de Mérom pour combattre Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se rassemblèrent d’un commun accord » ou « se réunirent » ; le verbe hébreu évoque un rassemblement convenu d’avance, et non une rencontre fortuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: se concertèrent
  rationale: Le niphal de יעד exprime ici un rassemblement coordonné ou convenu. « Se concertèrent » rend naturellement l’entente et l’action commune, sans suggérer une rencontre fortuite.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: tous ces rois
  rationale: Traduction directe qui conserve la valeur démonstrative de הָאֵלֶּה et le renvoi aux rois mentionnés juste auparavant.
- source_word: וַיָּבֹאוּ
  choice: ils vinrent
  rationale: Le verbe narratif בוא reçoit son équivalent français courant et maintient la succession des actions.
- source_word: וַיַּחֲנוּ
  choice: camper
  rationale: חנה désigne l’installation d’un camp. Après « vinrent », l’infinitif coordonné donne une phrase française fluide tout en conservant l’action du texte.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe souligne l’action unifiée de la coalition.
- source_word: אֶל מֵי מֵרוֹם
  choice: près des eaux de Mérom
  rationale: אֶל indique le lieu vers lequel ils viennent établir leur camp. « Près des eaux de Mérom » est naturel en français et conserve le pluriel « eaux » du texte hébreu sans préciser indûment la nature du site.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: pour combattre Israël
  rationale: L’infinitif de לחם avec עִם exprime ici l’affrontement militaire. Le complément direct est idiomatique en français et ne laisse aucune ambiguïté sur le caractère hostile de l’action.
