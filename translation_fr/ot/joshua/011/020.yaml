revisions:
- from: 'Car cela venait de Yahweh : leur cœur devait être endurci pour qu’ils affrontent Israël au combat[a], afin qu’ils soient voués à la destruction[b], sans qu’il y ait pour eux de grâce[c], mais afin qu’ils soient détruits, comme Yahweh l’avait ordonné à Moïse.'
  to: Car c’est Yahweh qui endurcissait leur cœur pour qu’ils livrent bataille à Israël[a], afin qu’il les voue à la destruction[b], afin qu’ils ne puissent obtenir aucune grâce[c], mais afin qu’il les détruise, comme Yahweh l’avait ordonné à Moïse.
  rationale: La révision rétablit l’action de Yahweh explicitement exprimée dans le texte source et rattache clairement à cette action les deux desseins de destruction. Elle remplace la modalité non exprimée de « devait » par un imparfait narratif naturel. Elle rend aussi plus exactement la difficulté de תְּחִנָּה dans le texte et dans la note, tout en préservant l’ambiguïté quant à la supplication et à la faveur.
  reviewer_model: gpt-5.6-terra
