  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Car c’est Yahweh qui endurcissait leur cœur pour qu’ils livrent bataille à Israël[a], afin qu’il les voue à la destruction[b], afin qu’ils ne puissent obtenir aucune grâce[c], mais afin qu’il les détruise, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fortifier leur cœur ». Dans ce contexte, il s’agit de les rendre résolus dans leur opposition, c’est-à-dire d’endurcir leur cœur.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu désigne le fait de placer quelqu’un ou quelque chose sous l’interdit, en le vouant à la destruction. Autres traductions possibles : « les détruire entièrement », « les mettre sous l’interdit ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « afin qu’il n’y ait pour eux aucune supplication » ou « afin qu’aucune faveur ne leur soit accordée ». L’expression hébraïque est concise et peut évoquer soit l’absence d’une demande de grâce, soit l’absence de la faveur demandée.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: cela venait de Yahweh
  rationale: La tournure exprime l’origine ou la source. « Venait de Yahweh » reste proche de l’hébreu tout en étant naturel en français.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: leur cœur devait être endurci
  rationale: חזק signifie littéralement « fortifier », mais décrit ici une résolution obstinée dans l’opposition. « Endurcir le cœur » en rend la force idiomatique et conserve l’action divine sans préciser au-delà de l’hébreu son mode d’exercice.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: pour qu’ils affrontent Israël au combat
  rationale: La construction indique une rencontre hostile. Cette formulation française est claire et conserve explicitement le contexte guerrier.
- source_word: לְמַעַן הַחֲרִימָם
  choice: afin qu’ils soient voués à la destruction
  rationale: Le hiphil de חרם désigne la mise à part sous l’interdit en vue de la destruction. Cette formulation préserve le caractère technique et judiciaire du terme sans employer le jargon peu transparent de « mettre à l’interdit ».
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: sans qu’il y ait pour eux de grâce
  rationale: La formulation garde la concision de l’hébreu et le champ sémantique de la faveur ou de la grâce, sans déterminer artificiellement qui présenterait une supplication ou accorderait la faveur.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: mais afin qu’ils soient détruits
  rationale: שמד exprime une destruction totale. Le passif conserve l’ambiguïté de l’infinitif hébreu quant à l’agent immédiat et évite de l’identifier sans nécessité à Yahweh, Josué ou Israël.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: Le plus-que-parfait situe naturellement le commandement avant les événements racontés, tandis que « comme » exprime leur conformité à celui-ci.
theological_decisions:
- issue: Action divine dans l’endurcissement du cœur des peuples cananéens
  choice: Conserver explicitement l’origine divine par « cela venait de Yahweh »
  alternative: Yahweh permit que leur cœur s’endurcisse
  rationale: L’hébreu attribue directement à Yahweh l’origine de cet endurcissement. Une simple permission atténuerait la tension théologique présente dans le texte.
- issue: Sujet implicite des infinitifs exprimant la destruction
  choice: 'Employer le passif : « qu’ils soient voués… qu’ils soient détruits »'
  alternative: afin qu’il les voue à la destruction… afin qu’il les détruise
  rationale: Les infinitifs hébreux n’identifient pas explicitement leur agent grammatical. Le passif français préserve cette ambiguïté réelle tout en maintenant le lien entre le dessein de Yahweh et la destruction exécutée dans le récit.
- issue: Valeur de חרם
  choice: « voués à la destruction » dans le texte principal
  alternative: « exterminés » ou « frappés d’interdit »
  rationale: Ce choix garde à la fois l’idée de consécration irrévocable au jugement et son aboutissement destructeur, sans réduire le terme à une violence générique ni recourir à une expression obscure.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Yahweh » translittère le nom divin conformément à la couche de consultation fournie. Les passifs préservent l’ambiguïté syntaxique des infinitifs hébreux, et les trois notes rendent visibles les principales difficultés lexicales sans alourdir le verset.
