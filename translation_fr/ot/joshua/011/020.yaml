review_pass:
  verdict: revise
  source_fidelity: 'La formulation passive « leur cœur devait être endurci » affaiblit et modalise indûment l’attribution explicite à Yahweh : le texte hébreu présente l’endurcissement comme venant de Yahweh. Les infinitifs de dessein qui suivent sont le plus naturellement rattachés à cette action divine; les rendre par des passifs obscurcit ce lien. « Grâce » seul est aussi trop éloigné de תְּחִנָּה, qui désigne d’abord une supplication ou une demande de faveur, même si le résultat impliqué est l’absence de miséricorde.'
  naturalness: 'Le verset actuel est globalement lisible, mais « cela venait de Yahweh : leur cœur devait être endurci » est pesant et donne à « devait » une valeur de nécessité qui n’est pas exprimée. La révision offre une syntaxe française plus directe sans expliciter davantage que le texte.'
  terminology: « Yahweh », « endurcir leur cœur » et « vouer à la destruction » sont cohérents et appropriés. La note sur חרם est resserrée pour éviter « irrévocablement », nuance non lexicalement nécessaire, et « aucune grâce » est remplacé dans le texte par une expression qui maintient le sens de supplication/faveur de תְּחִנָּה.
  issues:
  - severity: medium
    issue: Modalisation et obscurcissement de l’action divine dans « leur cœur devait être endurci ».
    rationale: מֵאֵת יְהוָה הָיְתָה לְחַזֵּק exprime que l’endurcissement procédait de Yahweh; « devait être » introduit une nécessité et le passif éloigne Yahweh de l’action.
  - severity: medium
    issue: Les passifs « qu’ils soient voués » et « qu’ils soient détruits » occultent le sujet le plus naturel des infinitifs de dessein.
    rationale: Dans la structure du verset, les desseins sont rattachés à l’action de Yahweh. Le français peut le conserver par « qu’il les voue » et « qu’il les détruise », comme le fait l’audit anglais.
  - severity: low
    issue: « Sans qu’il y ait pour eux de grâce » ne rend pas suffisamment le sens premier de תְּחִנָּה.
    rationale: Le terme signifie « supplication, demande de faveur ». « Qu’ils ne puissent obtenir aucune grâce » exprime le résultat sans identifier qui ferait une éventuelle supplication; la note conserve l’ambiguïté.
  revised_text: Car c’est Yahweh qui endurcissait leur cœur pour qu’ils livrent bataille à Israël[a], afin qu’il les voue à la destruction[b], afin qu’ils ne puissent obtenir aucune grâce[c], mais afin qu’il les détruise, comme Yahweh l’avait ordonné à Moïse.
