  text: וַ/יָּ֨שָׁב יְהוֹשֻׁ֜עַ בָּ/עֵ֤ת הַ/הִיא֙ וַ/יִּלְכֹּ֣ד אֶת חָצ֔וֹר וְ/אֶת מַלְכָּ֖/הּ הִכָּ֣ה בֶ/חָ֑רֶב כִּֽי חָצ֣וֹר לְ/פָנִ֔ים הִ֕יא רֹ֖אשׁ כָּל הַ/מַּמְלָכ֥וֹת הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: fr
  text: En ce temps-là, Josué revint[a], s’empara de Hatsor et frappa son roi de l’épée[b], car Hatsor était autrefois à la tête de tous ces royaumes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retourna sur ses pas ». Le verbe hébreu peut exprimer le retour ou un changement de direction dans le déroulement de la campagne.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « frappa son roi de l’épée ». Dans ce contexte, l’expression implique probablement qu’il le tua, mais le verbe hébreu signifie proprement « frapper ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « était la tête de tous ces royaumes », métaphore exprimant sa prééminence.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime ici un mouvement de retour dans le déroulement de la campagne. « Revint » est naturel en français et conserve ce mouvement sans préciser excessivement son orientation.
- source_word: בָּעֵת הַהִיא
  choice: À ce moment-là
  rationale: Expression temporelle courante qui situe l’action dans la période du récit sans la réduire nécessairement à un instant ponctuel.
- source_word: וַיִּלְכֹּד
  choice: s’empara de
  rationale: לכד désigne couramment la prise militaire d’une ville. « S’empara de » est idiomatique et convient au contexte.
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Transcription française usuelle du nom propre hébreu חָצוֹר.
- source_word: מַלְכָּהּ
  choice: son roi
  rationale: Le suffixe féminin renvoie à la ville de Hatsor. En français, « son roi » rend naturellement cette relation.
- source_word: הִכָּה בֶחָרֶב
  choice: frappa son roi de l’épée
  rationale: Cette formulation conserve le sens littéral et mesuré de נכה, « frapper », tandis que le contexte peut impliquer la mise à mort sans que celle-ci soit explicitée dans le verbe.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication de l’importance particulière de Hatsor dans un registre narratif soutenu mais courant.
- source_word: לְפָנִים
  choice: autrefois
  rationale: Indique naturellement en français un état de choses antérieur.
- source_word: רֹאשׁ
  choice: à la tête
  rationale: Préserve la métaphore hébraïque de la « tête » tout en exprimant clairement la prééminence de Hatsor.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: tous ces royaumes
  rationale: Rend directement le quantificateur, le démonstratif et le nom collectif du texte hébreu.
