  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: fr
  text: 'Cependant, Israël ne brûla aucune des villes qui se dressaient sur leurs tertres[a], à l’exception de Hatsor seule : Josué la brûla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur leurs tells », c’est-à-dire sur des monticules formés par les couches successives d’occupation d’un même site.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Cependant
  rationale: Introduit naturellement en français le contraste et l’exception signalés par le contexte.
- source_word: כָּל הֶעָרִים
  choice: aucune des villes
  rationale: Sous la négation, cette tournure idiomatique rend le sens distributif de l’hébreu sans suggérer qu’Israël aurait seulement épargné une partie des villes.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: qui se dressaient sur leur tertre
  rationale: « Se dressaient » conserve l’image du participe hébreu; « tertre » désigne de façon accessible le monticule d’occupation sur lequel chaque ville était établie.
- source_word: לֹא שְׂרָפָם יִשְׂרָאֵל
  choice: Israël ne brûla
  rationale: L’ordre syntaxique est naturel en français, et l’objet est déjà exprimé par « aucune des villes ».
- source_word: זוּלָתִי
  choice: à l’exception de
  rationale: Marque clairement l’unique exception.
- source_word: לְבַדָּהּ
  choice: seule
  rationale: Souligne que Hatsor constitue à elle seule l’exception, conformément à l’emphase hébraïque.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: Josué la brûla
  rationale: Conserve la répétition du verbe dans l’hébreu et explicite naturellement en français que son objet est Hatsor.
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Translittération française courante du nom propre hébreu.
