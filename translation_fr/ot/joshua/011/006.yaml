  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: fr
  text: 'Yahweh dit à Josué : « N’aie pas peur d’eux, car demain, à cette heure-ci[a], je les livre tous à Israël, morts au combat[b]. Tu couperas les jarrets de leurs chevaux et tu brûleras leurs chars au feu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « demain, vers cette heure-ci » ou « demain à cette même heure ».'
    reason: La locution temporelle hébraïque peut désigner le même moment le lendemain et peut aussi comporter une nuance approximative selon l’analyse de כ־.
  - marker: b
    text: 'Littéralement : « je les donne tous, tués, devant Israël ». Le sens est qu’ils sont livrés à Israël pour être abattus.'
    reason: La note conserve la formulation inhabituelle de l’hébreu et explicite le sens contextuel de « donner/livrer » sans développer davantage le rapport entre l’action divine et celle d’Israël.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin exprimé directement dans le texte hébreu, conformément à l’usage du projet.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: N’aie pas peur d’eux
  rationale: Rend naturellement en français moderne l’interdiction et la construction indiquant ceux qui inspirent la crainte.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: demain, vers cette heure-ci
  rationale: La préposition כ־ peut exprimer une approximation; cette formulation conserve cette nuance tout en restant idiomatique.
- source_word: אָנֹכִי נֹתֵן
  choice: je les livrerai
  rationale: Dans cette promesse imminente, le futur français exprime naturellement la valeur prospective du participe; «livrer» explicite le sens contextuel de נתן sans ajouter l’agent de leur mise à mort.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: tous, morts au combat, devant Israël
  rationale: «Morts au combat» conserve la portée martiale de חֲלָלִים, tandis que «devant Israël» maintient l’image spatiale de לִפְנֵי.
- source_word: תְּעַקֵּר
  choice: tu couperas les jarrets
  rationale: Expression française précise pour l’action militaire consistant à rendre les chevaux inutilisables en sectionnant leurs tendons.
- source_word: מַרְכְּבֹתֵיהֶם תִּשְׂרֹף בָּאֵשׁ
  choice: tu brûleras leurs chars
  rationale: Formulation française naturelle; le moyen «par le feu», explicite mais redondant en hébreu, est inhérent au verbe «brûler».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Rapport entre l’action divine et la mort des ennemis
  choice: je les livrerai tous, morts au combat, devant Israël
  alternative: je vous les livrerai tous pour que vous les tuiez
  rationale: La traduction conserve la formulation tendue et imagée de l’hébreu sans préciser davantage que le texte la manière exacte dont l’action divine et celle d’Israël s’articulent.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond au discours singulier adressé à Josué. «Couper les jarrets» est précis mais reste compréhensible; la syntaxe conserve la solennité de la promesse sans calquer lourdement l’hébreu.
