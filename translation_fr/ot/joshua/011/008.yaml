  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: fr
  text: Yahweh les livra aux mains d’Israël, et les Israélites les frappèrent et les poursuivirent jusqu’à Sidon la Grande, jusqu’à Misrefoth-Maïm[a] et jusqu’à la vallée de Mitspa, à l’est. Ils les frappèrent jusqu’à ne plus leur laisser aucun survivant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Misrefoth-Maïm » est un nom de lieu ; l’hébreu peut évoquer des « lieux de combustion des eaux ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu traduit par « laisser » est au singulier ; son sujet peut être Israël pris collectivement ou Josué comme représentant.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: les livra aux mains d’Israël
  rationale: Dans un contexte militaire, נתן ביד signifie livrer quelqu’un au pouvoir d’un autre. « Aux mains de » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, plutôt que substitution par un titre.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: les frappa
  rationale: נכה désigne ici le fait de frapper l’ennemi avec une portée militaire potentiellement mortelle; la répétition du verbe source est conservée.
- source_word: וַיִּרְדְּפוּם
  choice: les poursuivit
  rationale: רדף est le verbe courant pour poursuivre un ennemi.
- source_word: צִידוֹן רַבָּה
  choice: Sidon la Grande
  rationale: Rend naturellement le nom de la ville qualifié par l’adjectif רבה.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: Misrefoth-Maïm
  rationale: Le groupe est traité comme un toponyme et translittéré; son sens étymologique possible est signalé en note.
- source_word: בִּקְעַת מִצְפֶּה
  choice: la vallée de Mitspa
  rationale: בקעה désigne une large vallée ou une plaine encaissée; « vallée » est clair et naturel.
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: La forme directionnelle est rendue adverbialement.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: sans leur laisser un seul survivant
  rationale: La tournure exprime l’élimination de tout survivant. Cette formulation française reste naturelle sans imposer dans le corps du texte un référent précis au verbe hébreu singulier.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction sans le remplacer par un titre.
- issue: Sujet implicite de הִשְׁאִיר, morphologiquement singulier
  choice: 'construction infinitive sans sujet explicite : « sans leur laisser »'
  alternative: « jusqu’à ce qu’il ne leur laisse aucun survivant » ou « jusqu’à ce qu’ils ne leur laissent aucun survivant »
  rationale: Le singulier peut renvoyer à Israël pris collectivement ou à Josué comme représentant. La formulation retenue préserve cette ambiguïté plutôt que de la trancher silencieusement; la note l’explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite une longue succession de « et » sans effacer la progression du récit. L’accord au singulier de « qui les frappa et les poursuivit » traite Israël comme un collectif, conformément au nom singulier hébreu; la dernière proposition est reformulée pour préserver l’ambiguïté du sujet de הִשְׁאִיר.
