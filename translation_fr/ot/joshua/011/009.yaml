  source_fidelity: 'Le sens principal est fidèlement rendu : Josué agit envers les ennemis conformément à ce que Yahweh lui avait dit, neutralise leurs chevaux et détruit leurs chars. Toutefois, le complément explicite בָּאֵשׁ (« au feu ») est omis dans le texte courant. Bien que « brûler » implique normalement le feu en français, l’optique d’équivalence optimale justifie de conserver cet élément exprimé dans l’hébreu.'
