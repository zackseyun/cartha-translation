  terminology: « Yahweh » rend correctement le Tétragramme conformément au dossier. « Chevaux » et « chars » sont exacts. La note devrait proposer une alternative lexicale plus directement équivalente à l’idée générale de mutiler/neutraliser les chevaux, plutôt que « rendit ... inaptes », formulation plus interprétative.
