base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: fr
  text: 'Josué leur fit ce que Yahweh lui avait dit : il coupa les tendons des jarrets de leurs chevaux[a] et brûla leurs chars au feu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « estropia leurs chevaux » ; l’hébreu désigne plus précisément le fait de leur couper les tendons des jarrets.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: Josué leur fit ce que
  rationale: Cette formulation française naturelle exprime l’action exercée à leur encontre et se complète par la directive divine qui suit, sans suggérer un bienfait.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: ce que Yahweh lui avait dit
  rationale: Le plus-que-parfait situe la parole divine avant son exécution; la construction entière rend la conformité exprimée par כַּאֲשֶׁר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶת סוּסֵיהֶם עִקֵּר
  choice: il coupa les tendons des jarrets de leurs chevaux
  rationale: Cette expression précise et compréhensible décrit l’action concrète de rendre les chevaux inaptes en sectionnant les tendons, sens spécifique du verbe עקר dans ce contexte.
- source_word: וְאֶת מַרְכְּבֹתֵיהֶם שָׂרַף בָּאֵשׁ
  choice: et brûla leurs chars
  rationale: En français, « brûler » implique déjà l’action du feu; ajouter « par le feu » serait lourd et redondant, sans perte de sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve directement sans le remplacer par un titre confessionnel traditionnel.
translation_notes:
  register: Français international moderne, digne et direct. « Couper les tendons des jarrets » est plus immédiatement intelligible que le terme technique ou rare « éjarreter ». La mention explicite « par le feu » n’est pas reproduite, car elle serait redondante en français avec « brûla ».
