  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁבֹּ֨ת הַ/מָּ֜ן מִֽ/מָּחֳרָ֗ת בְּ/אָכְלָ/ם֙ מֵ/עֲב֣וּר הָ/אָ֔רֶץ וְ/לֹא הָ֥יָה ע֛וֹד לִ/בְנֵ֥י יִשְׂרָאֵ֖ל מָ֑ן וַ/יֹּאכְל֗וּ מִ/תְּבוּאַת֙ אֶ֣רֶץ כְּנַ֔עַן בַּ/שָּׁנָ֖ה הַ/הִֽיא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: fr
  text: La manne cessa le lendemain, après qu’ils eurent mangé des produits du pays[a]. Il n’y eut plus de manne pour les Israélites[b], et ils mangèrent des récoltes du pays de Canaan cette année-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’ancienne récolte du pays ». Le terme hébreu peut désigner plus précisément des produits conservés de la récolte de l’année précédente.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: cessa
  rationale: Le verbe שׁבת exprime ici l’arrêt de la manne, et non l’observance du sabbat.
- source_word: הַמָּן / מָן
  choice: la manne / de manne
  rationale: « Manne » est le terme français traditionnel et courant pour cette nourriture du désert; la syntaxe française commande l’article défini au premier emploi et « de manne » après la négation.
- source_word: מִמָּחֳרָת
  choice: dès le lendemain
  rationale: L’expression temporelle désigne le jour suivant; « dès » rend naturellement l’idée que la cessation prend effet à partir de ce moment.
- source_word: בְּאָכְלָם
  choice: après qu’ils eurent mangé
  rationale: L’infinitif construit avec בְּ peut marquer le temps. Dans ce contexte, le passé antérieur exprime clairement que la consommation des produits précède la cessation de la manne.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: des produits du pays
  rationale: עֲבוּר désigne les denrées ou produits agricoles du pays. La possibilité plus précise de réserves provenant d’une récolte antérieure est conservée en note.
- source_word: וְלֹא הָיָה עוֹד
  choice: n’eurent plus
  rationale: Cette formulation française naturelle rend la tournure existentielle hébraïque et l’idée de cessation durable exprimée par עוֹד.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: Dans ce contexte collectif, « les Israélites » est naturel, précis et inclusif; le sens formel « fils d’Israël » est signalé en note.
- source_word: וַיֹּאכְלוּ
  choice: ils mangèrent
  rationale: Le passé simple convient à la progression d’un récit historique en français soutenu mais accessible.
- source_word: מִתְּבוּאַת
  choice: des récoltes
  rationale: תְּבוּאָה désigne ce que la terre produit, notamment la récolte. Ce choix évite une répétition tout en conservant le sens agricole.
- source_word: אֶרֶץ כְּנַעַן
  choice: le pays de Canaan
  rationale: Cette expression rend explicitement le syntagme construit hébreu et correspond à l’usage biblique français courant.
- source_word: בַּשָּׁנָה הַהִיא
  choice: cette année-là
  rationale: Formulation idiomatique qui conserve la référence démonstrative au moment du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple et le passé antérieur maintiennent une tenue littéraire accessible. « Israélites » est préféré dans le texte courant à la formulation littérale potentiellement ambiguë « fils d’Israël », laquelle est conservée en note.
