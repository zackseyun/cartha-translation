source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: fr
  text: 'En ce temps-là, Yahvé dit à Josué : « Fais-toi des couteaux de silex[a], puis circoncis de nouveau les fils d’Israël[b], une seconde fois[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne ici des instruments tranchants en silex employés pour la circoncision.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « les fils d’Israël »; on peut aussi traduire plus généralement par « les Israélites ».
    reason: lexical_alternative
  - marker: c
    text: « Une seconde fois » signifie que la circoncision doit être pratiquée de nouveau au sein d’Israël en tant que peuple, non que les mêmes hommes doivent être circoncis deux fois.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: En ce temps-là
  rationale: Expression temporelle narrative courante, rendue dans un français naturel et digne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin, qui conserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: עֲשֵׂה לְךָ
  choice: Fais-toi
  rationale: Rend avec concision l’impératif accompagné du datif d’intérêt, sans alourdir la phrase.
- source_word: חַרְבוֹת צֻרִים
  choice: des couteaux de silex
  rationale: Dans ce contexte de circoncision, חַרְבוֹת désigne des instruments tranchants et צֻרִים leur matière; « couteaux de silex » est précis et idiomatique.
- source_word: וְשׁוּב
  choice: puis … de nouveau
  rationale: Le verbe « revenir » a ici une valeur adverbiale de répétition devant l’impératif; « de nouveau » en exprime clairement la force.
- source_word: מֹל
  choice: circoncis
  rationale: Équivalent direct et courant du verbe dans ce contexte d’alliance.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression masculine du texte, particulièrement pertinente puisque la circoncision concerne ici les hommes, tout en restant intelligible en français.
- source_word: שֵׁנִית
  choice: une seconde fois
  rationale: Préserve l’indication explicite d’une deuxième occurrence, sans la fusionner avec la valeur répétitive de וְשׁוּב.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin; sa transcription préserve le nom propre au lieu de le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation masculine du texte correspond aussi aux personnes soumises à la circoncision dans le contexte immédiat.
- issue: Sens de la répétition exprimée par וְשׁוּב et שֵׁנִית
  choice: de nouveau … une seconde fois
  alternative: circoncis encore les Israélites
  rationale: La formulation conserve les deux marques hébraïques de répétition et laisse la note préciser qu’il s’agit d’un nouvel acte collectif, non d’une seconde circoncision des mêmes individus.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La légère redondance « de nouveau … une seconde fois » est maintenue parce qu’elle reflète les deux expressions distinctes du texte hébreu. Les appels de note sont placés immédiatement après les expressions qu’ils expliquent.
