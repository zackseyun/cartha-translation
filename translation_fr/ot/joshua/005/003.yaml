base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/003.yaml
  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: fr
  text: Alors Josué se fit des couteaux de silex[a] et circoncit les fils d’Israël[b] à Guibéath-Haaraloth[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lames de silex »; le mot hébreu désigne souvent des épées, mais il s’agit ici d’instruments tranchants utilisés pour la circoncision.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « les fils d’Israël »; on peut aussi traduire : « les Israélites ».'
    reason: lexical_alternative
  - marker: c
    text: Le nom hébreu signifie « colline des prépuces ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  choice: se fit
  rationale: Le tour français exprime naturellement l’action de fabriquer ou préparer quelque chose pour soi, tout en conservant la valeur réflexive contextuelle de לּוֹ.
- source_word: חַרְבוֹת צֻרִים
  choice: des couteaux de silex
  rationale: חֶרֶב désigne normalement une épée ou une lame, mais le contexte de la circoncision appelle ici « couteaux »; צֻרִים précise qu’ils sont en silex.
- source_word: וַיָּמָל
  choice: circoncit
  rationale: Le verbe מול signifie sans ambiguïté « circoncire ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve la structure et le genre grammatical de l’hébreu; « les Israélites » serait plus idiomatique mais moins formellement transparent.
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: à Guibéath-Haaraloth
  rationale: La préposition est rendue selon l’usage français pour situer l’action; le toponyme est translittéré afin de préserver son caractère de nom de lieu, tandis que son sens est donné en note.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique. « Guibéath-Haaraloth » suit une translittération adaptée au français, avec le sens transparent du toponyme conservé en note.
