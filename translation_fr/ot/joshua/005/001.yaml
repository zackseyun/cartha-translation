- from: Or, lorsque tous les rois des Amoréens qui étaient de l’autre côté du Jourdain, à l’ouest, et tous les rois des Cananéens qui étaient près de la mer[a] apprirent que Yahweh avait asséché les eaux du Jourdain devant les fils d’Israël jusqu’à ce que nous ayons traversé[b], leur cœur fondit et il ne resta plus en eux aucun souffle[c] devant les fils d’Israël.
  to: Or, lorsque tous les rois des Amoréens qui étaient de l’autre côté du Jourdain, à l’ouest, et tous les rois des Cananéens qui étaient près de la mer[a] apprirent que Yahweh avait asséché les eaux du Jourdain devant les fils d’Israël jusqu’à ce que nous ayons traversé[b], leur cœur fondit et il n’y eut plus en eux aucun courage[c] à cause des fils d’Israël.
  rationale: La seule correction porte sur l’idiome hébreu « il n’y eut plus de ruach en eux ». Le corps du texte emploie « courage », qui en transmet le sens contextuel sans l’ambiguïté physiologique de « souffle » en français; la note conserve l’image littérale. « À cause des fils d’Israël » explicite naturellement la valeur causale de מִפְּנֵי dans la seconde occurrence, tandis que « devant les fils d’Israël » est conservé pour le retrait des eaux devant leur passage.
