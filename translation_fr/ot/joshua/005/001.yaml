source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: fr
  text: Or, lorsque tous les rois des Amoréens qui étaient de l’autre côté du Jourdain, à l’ouest, et tous les rois des Cananéens qui étaient près de la mer[a] apprirent que Yahweh avait asséché les eaux du Jourdain devant les fils d’Israël jusqu’à ce que nous ayons traversé[b], leur cœur fondit et il n’y eut plus en eux aucun courage[c] à cause des fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la côte »; l’expression « près de la mer » désigne ici la région côtière.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits et des versions anciennes portent « jusqu’à ce qu’ils aient traversé » au lieu de « jusqu’à ce que nous ayons traversé ».
    reason: textual_variant
  - marker: c
    text: Littéralement « il n’y eut plus de souffle en eux »; cette expression signifie qu’ils avaient perdu tout courage ou toute résolution.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Or, lorsque … apprirent
  rationale: La tournure introduit un nouvel épisode et situe temporellement la réaction des rois. « Or, lorsque » restitue cette fonction narrative en français naturel sans recourir à l’archaïsme « il advint que ».
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: de l’autre côté du Jourdain, à l’ouest
  rationale: La formulation conserve à la fois l’idée de l’autre rive et l’indication directionnelle יָמָּה, « vers l’ouest/vers la mer ».
- source_word: אֲשֶׁר עַל הַיָּם
  choice: qui étaient près de la mer
  rationale: Traduction proche du texte, avec une note précisant qu’il s’agit de la région côtière.
- source_word: הוֹבִישׁ
  choice: avait asséché
  rationale: Le hiphil de יבש exprime ici l’action de rendre les eaux sèches; le plus-que-parfait marque naturellement l’antériorité de l’événement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et nationale masculine du texte source.
- source_word: עַד עברנו
  choice: jusqu’à ce que nous ayons traversé
  rationale: La première personne du texte consonantique fourni est maintenue dans le corps du verset; la lecture à la troisième personne est signalée en note.
- source_word: וַיִּמַּס לְבָבָם
  choice: leur cœur fondit
  rationale: Le singulier collectif hébreu et l’image de la fonte sont tous deux conservés; l’expression évoque l’effondrement du courage.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: il ne resta plus en eux aucun souffle
  rationale: « Souffle » conserve l’image et la latitude sémantique de רוּחַ, qui désigne ici idiomatiquement le courage ou la résolution.
- source_word: מִפְּנֵי בְנֵי יִשְׂרָאֵל
  choice: devant les fils d’Israël
  rationale: « Devant » préserve la formulation spatiale et causale du texte sans réduire explicitement le sens à la seule causalité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le nom propre divin; sa translittération le distingue d’un titre et suit directement la donnée hébraïque.
- issue: Désignation nationale בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le choix conserve la forme familiale masculine de l’expression hébraïque sans la neutraliser.
- issue: Personne grammaticale dans עַד עברנו
  choice: jusqu’à ce que nous ayons traversé
  alternative: jusqu’à ce qu’ils aient traversé
  rationale: La première personne attestée par la forme consonantique fournie est retenue malgré la tension avec le récit à la troisième personne; l’autre lecture est documentée plutôt que substituée silencieusement.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste fluide malgré la longue proposition initiale. Les images hébraïques du cœur qui fond et du souffle disparu sont conservées, avec éclaircissement en note lorsque nécessaire.
