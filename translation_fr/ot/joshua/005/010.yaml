  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: fr
  text: Les fils d’Israël campèrent à Guilgal[a] et célébrèrent la Pâque le quatorzième jour du mois, le soir, dans les plaines de Jéricho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: Le verbe חנה désigne l’action d’établir un camp. « Campèrent » est précis, naturel et digne en français moderne.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et le masculin pluriel explicites de l’hébreu. « Les Israélites » serait plus idiomatique, mais moins transparent par rapport à la forme source.
- source_word: בַּגִּלְגָּל
  choice: à Guilgal
  rationale: La préposition locale et le nom de lieu se rendent naturellement par « à Guilgal » dans ce contexte de campement.
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: célébrèrent la Pâque
  rationale: Avec פֶּסַח, le verbe עשה forme ici une expression désignant l’observance de la Pâque. « Célébrèrent » est idiomatique et immédiatement compréhensible.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: le quatorzième jour du mois
  rationale: Rendu calendérique exact et naturel en français.
- source_word: בָּעֶרֶב
  choice: le soir
  rationale: Expression temporelle concise et naturelle qui correspond au sens de עֶרֶב dans ce contexte.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: dans les plaines de Jéricho
  rationale: עַרְבוֹת désigne ici la région de plaines ou de steppes proche de Jéricho. « Plaines » est le terme géographique le plus clair en français courant.
theological_decisions:
- issue: Traduction de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Aucun enjeu doctrinal direct n’est en cause, mais le choix conserve la formulation familiale et masculine plurielle de l’hébreu au lieu de la neutraliser par un gentilé.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le déroulement narratif hébreu sans lourdeur, tandis que « célébrèrent la Pâque » rend naturellement l’idiome source.
