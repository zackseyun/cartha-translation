  text: וַ/יְהִ֛י כַּ/אֲשֶׁר תַּ֥מּוּ כָל הַ/גּ֖וֹי לְ/הִמּ֑וֹל וַ/יֵּשְׁב֥וּ תַחְתָּ֛/ם בַּֽ/מַּחֲנֶ֖ה עַ֥ד חֲיוֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: fr
  text: Quand toute la nation eut fini d’être circoncise, ils restèrent à leur place dans le camp jusqu’à leur rétablissement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à leur guérison » ou « jusqu’à ce qu’ils reprennent des forces ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quand
  rationale: La formule narrative introduit ici une proposition temporelle. « Quand » rend naturellement la succession sans reproduire lourdement « et il arriva que ».
- source_word: תַּמּוּ
  choice: eut fini
  rationale: Le verbe exprime l’achèvement; le passé antérieur convient à cette proposition temporelle dans un registre narratif soutenu mais accessible.
- source_word: כָל הַגּוֹי
  choice: toute la nation
  rationale: Le singulier collectif hébreu désigne Israël dans son ensemble; « toute la nation » en conserve la force collective.
- source_word: לְהִמּוֹל
  choice: d’être circoncise
  rationale: Cette formulation garde le sens passif du nifal et s’intègre naturellement après « eut fini ».
- source_word: וַיֵּשְׁבוּ
  choice: ils restèrent
  rationale: Dans ce contexte de convalescence, le verbe indique qu’ils demeurèrent sur place plutôt qu’une posture assise.
- source_word: תַחְתָּם
  choice: à leur place
  rationale: L’expression idiomatique signifie qu’ils restèrent là où ils étaient, et non littéralement « sous eux ».
- source_word: בַּמַּחֲנֶה
  choice: dans le camp
  rationale: Rendu locatif direct et idiomatique.
- source_word: עַד חֲיוֹתָם
  choice: jusqu’à leur rétablissement
  rationale: Dans le contexte qui suit la circoncision, חיה évoque le retour à la santé ou aux forces. Le substantif français produit une phrase naturelle tout en laissant la note signaler les autres nuances possibles.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le singulier collectif « toute la nation » est suivi du pluriel « ils », accord selon le sens, afin de refléter le passage hébreu du collectif aux membres du groupe.
