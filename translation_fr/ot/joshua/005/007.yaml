    rationale: Le sujet n’est pas exprimé dans le verset, mais le singulier renvoie contextuellement au SEIGNEUR mentionné au verset 6. Il convient de signaler l’implicite sans suggérer une ambiguïté de référent plus large que ne le permet le contexte.
