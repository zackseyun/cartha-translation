  source_fidelity: 'Le sens essentiel est bien rendu : les fils remplacent la génération précédente, Josué les circoncit, et leur incirconcision s’explique par l’absence de circoncision pendant le voyage. Toutefois, le sujet singulier implicite de הֵקִים est plus naturellement repris en français par « il » avec l’antécédent contextuel divin; la note actuelle présente cette lecture comme seulement possible alors que le contexte immédiat précédent l’oriente fortement.'
