source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: fr
  text: 'Il circoncit les fils qu’il avait fait surgir à leur place[a], car ils étaient incirconcis : on ne les avait pas circoncis en chemin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à leur place : les fils qui les remplaçaient ». Le sujet de « avait fait surgir » est implicite en hébreu et renvoie, dans le contexte, au SEIGNEUR mentionné au verset précédent.'
    reason: Précise la valeur de remplacement de תַּחְתָּם et l’antécédent contextuel du sujet implicite, sans l’ajouter au texte principal.
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: Quant à leurs fils
  rationale: La construction hébraïque met « leurs fils » en tête comme objet repris ensuite par un pronom. « Quant à » reproduit naturellement cette mise en relief en français; « fils » convient précisément au contexte de la circoncision.
- source_word: הֵקִים
  choice: avait suscités
  rationale: Le hiphil de קום exprime ici le fait de faire surgir une nouvelle génération. « Susciter » conserve cette image et la succession générationnelle sans réduire le verbe à une simple naissance.
- source_word: תַּחְתָּם
  choice: à leur place
  rationale: 'תַּחַת exprime ici le remplacement ou la succession : les fils prennent la place de la génération précédente.'
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: Josué les circoncit
  rationale: Le pronom reprend les fils placés en tête de phrase, tandis que l’ordre français identifie clairement Josué comme sujet de מָל.
- source_word: עֲרֵלִים הָיוּ
  choice: ils étaient incirconcis
  rationale: « Incirconcis » est le terme français courant et précis pour l’état physique et cultuel décrit ici.
- source_word: כִּי לֹא מָלוּ אוֹתָם
  choice: on ne les avait pas circoncis
  rationale: La troisième personne du pluriel sans sujet explicite peut avoir une valeur indéfinie en hébreu. Le français « on » préserve l’absence d’agent nommé plus naturellement qu’un « ils » ambigu.
- source_word: בַּדָּרֶךְ
  choice: en chemin
  rationale: Cette expression française concise rend naturellement le voyage au cours duquel la circoncision n’avait pas été pratiquée.
theological_decisions:
- issue: Agent qui a suscité la nouvelle génération
  choice: Conserver le pronom « il » sans identifier explicitement son référent
  alternative: Écrire « le Seigneur avait suscités » ou attribuer l’action à Josué
  rationale: Le sujet de הֵקִים n’est pas exprimé dans ce verset. Le contexte précédent peut orienter vers le Seigneur, mais l’ajouter dans le texte principal supprimerait une ambiguïté syntaxique réelle.
- issue: État lié au signe de l’alliance
  choice: incirconcis
  alternative: non circoncis
  rationale: Le verset décrit littéralement l’absence de circoncision. « Incirconcis » garde le vocabulaire biblique et la portée liée à l’alliance sans transformer l’expression en état spirituel métaphorique.
translation_notes:
  register: Français international moderne, digne et lisible. La reprise « Quant à leurs fils… Josué les circoncit » conserve la dislocation de l’hébreu sans lourdeur excessive. Le passé simple convient au récit biblique, tandis que le plus-que-parfait marque l’antériorité.
