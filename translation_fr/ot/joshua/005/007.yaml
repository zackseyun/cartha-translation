  terminology: « Incirconcis » et « circoncit » sont exacts, usuels et appropriés au registre biblique. « En chemin » rend correctement בַּדָּרֶךְ. Le français impersonnel « on ne les avait pas circoncis » rend de façon idiomatique le sujet pluriel non précisé du texte hébreu.
