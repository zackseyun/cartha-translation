source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: fr
  text: 'Il répondit[a] : « Non, mais je suis maintenant venu comme chef de l’armée de Yahweh. » Alors Josué tomba face contre terre et se prosterna[b]. Il lui demanda : « Que dit mon seigneur à son serviteur ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ni l’un ni l’autre ; je suis maintenant venu comme chef de l’armée de Yahweh. »'
    reason: Cette formulation explicite la portée possible de la négation en réponse à l’alternative du verset précédent, tout en conservant le singulier de צָבָא.
  - marker: b
    text: Le verbe hébreu peut aussi être rendu par « adora ». « Se prosterna » décrit ici le geste sans trancher, à partir de ce seul verset, l’identité du personnage ni la nature précise de l’hommage.
    reason: Préserver l’ambiguïté sémantique et théologique du verbe hébreu.
lexical_decisions:
- source_word: לֹא
  choice: Non
  rationale: Réponse négative directe à la question précédente de Josué. « Ni l’un ni l’autre » explicite davantage le sens et est donc conservé en note.
- source_word: כִּי
  choice: En fait
  rationale: Après la négation, la conjonction introduit ici une rectification ou une explication. « En fait » rend naturellement ce mouvement en français.
- source_word: שַׂר צְבָא יְהוָה
  choice: le chef de l’armée de Yahweh
  rationale: Dans ce contexte militaire, « chef » rend naturellement שַׂר sans préciser indûment un grade moderne; « armée » exprime clairement צְבָא, et le nom divin est translittéré « Yahweh ».
- source_word: עַתָּה בָאתִי
  choice: et maintenant je suis venu
  rationale: Cette formulation conserve l’adverbe temporel et l’accompli hébreu tout en restant naturelle dans le discours direct.
- source_word: וַיִּפֹּל ... אֶל פָּנָיו אַרְצָה
  choice: tomba face contre terre
  rationale: Expression française courante qui restitue concrètement la chute de Josué, le visage tourné vers le sol.
- source_word: וַיִּשְׁתָּחוּ
  choice: se prosterna
  rationale: Le verbe français décrit l’acte de profonde révérence sans décider à lui seul s’il s’agit formellement d’adoration.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Forme respectueuse correspondant au nom avec suffixe de première personne; la minuscule évite d’imposer une identification divine.
- source_word: מָה אֲדֹנִי מְדַבֵּר אֶל עַבְדּוֹ
  choice: Que dit mon seigneur à son serviteur ?
  rationale: Le présent « dit » convient au participe dans ce dialogue immédiat, tandis que « son serviteur » conserve la manière humble dont Josué se désigne.
theological_decisions:
- issue: La prosternation de Josué doit-elle être explicitement qualifiée d’adoration ?
  choice: Traduire וַיִּשְׁתָּחוּ par « se prosterna » dans le texte principal.
  alternative: « adora »
  rationale: Le verbe hébreu peut désigner une prosternation révérencieuse ou un acte d’adoration. Le rendu choisi préserve le geste sans trancher, à partir de ce seul verset, la nature théologique exacte de l’acte.
- issue: Faut-il identifier le personnage comme un ange ou comme une manifestation divine ?
  choice: Ne pas l’identifier au-delà de son titre de « chef de l’armée de Yahweh ».
  alternative: Employer une formulation qui l’identifierait explicitement comme ange, théophanie ou christophanie.
  rationale: Le verset donne un titre au personnage, mais ne tranche pas explicitement son identité ontologique. La traduction conserve cette réserve du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le discours conserve une certaine solennité sans tournures archaïques. « Yahweh » rend le nom divin; « mon seigneur » reste en minuscule afin de ne pas résoudre l’identité du personnage par la typographie.
