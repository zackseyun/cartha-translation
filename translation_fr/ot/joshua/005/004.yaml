  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁר מָ֣ל יְהוֹשֻׁ֑עַ כָּל הָ/עָ֣ם הַ/יֹּצֵא֩ מִ/מִּצְרַ֨יִם הַ/זְּכָרִ֜ים כֹּ֣ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה מֵ֤תוּ בַ/מִּדְבָּר֙ בַּ/דֶּ֔רֶךְ בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: fr
  text: 'Voici pourquoi Josué les circoncit[a] : tous les hommes du peuple qui était sorti d’Égypte, tous les hommes de guerre[b], étaient morts dans le désert, en chemin, lorsqu’ils sortirent d’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Voici la chose que Josué circoncit ». L’expression hébraïque est idiomatique et introduit ici l’explication de l’acte de Josué.'
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les combattants » ou « tous les guerriers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: Voici pourquoi Josué les circoncit
  rationale: Littéralement, « voici la chose que Josué circoncit » ; dans ce contexte, la tournure introduit l’explication de l’acte. « Voici pourquoi » rend naturellement cette valeur, tandis que « les » explicite l’objet sous-entendu.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: tous les hommes du peuple sorti d’Égypte
  rationale: Le mot הַזְּכָרִים précise qu’il s’agit des personnes de sexe masculin. Cette formulation française conserve cette précision sans l’expression peu naturelle « les mâles » appliquée à des personnes.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: tous les hommes de guerre
  rationale: Rendu formel et intelligible de la désignation militaire ; « combattants » serait également possible.
- source_word: מֵתוּ
  choice: étaient morts
  rationale: Le plus-que-parfait marque en français que leur mort était antérieure à la circoncision accomplie par Josué.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans le récit de l’Exode, מִדְבָּר désigne la région aride et inhabitée traversée par Israël ; « désert » est le terme français courant et traditionnel.
- source_word: בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרָיִם
  choice: en chemin, après leur sortie d’Égypte
  rationale: « En chemin » restitue la progression du voyage. L’infinitif construit peut situer ce parcours lors de leur sortie ; « après leur sortie » exprime naturellement la séquence contextuelle sans préciser une durée absente du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple « circoncit » convient au registre narratif biblique sans être archaïque. La répétition de « tous les hommes » reflète l’apposition hébraïque tout en clarifiant que la circoncision concerne la population masculine.
