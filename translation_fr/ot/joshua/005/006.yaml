revisions:
- from: Car les fils d’Israël avaient marché dans le désert pendant quarante ans, jusqu’à ce que toute la nation — les hommes de guerre sortis d’Égypte — ait disparu, parce qu’ils n’avaient pas écouté la voix de Yahweh. Yahweh leur avait juré de ne pas leur laisser voir le pays qu’il avait juré à leurs pères de nous donner[a], un pays ruisselant de lait et de miel.
  to: Car les fils d’Israël avaient marché dans le désert pendant quarante ans, jusqu’à ce que toute la nation — les hommes de guerre sortis d’Égypte — ait disparu, parce qu’ils n’avaient pas écouté la voix de Yahweh. Yahweh leur avait juré de ne pas leur laisser voir le pays que Yahweh avait juré à leurs pères de nous donner[a], un pays ruisselant de lait et de miel.
  rationale: La seule révision nécessaire explicite la seconde occurrence de Yahweh, conformément au texte hébreu, afin d’éviter une ambiguïté syntaxique en français. Le « nous » du texte massorétique et la note sur la lecture « leur » sont conservés.
  reviewer_model: gpt-5.6-terra
