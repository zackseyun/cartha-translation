source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: fr
  text: Car les fils d’Israël avaient marché dans le désert pendant quarante ans, jusqu’à ce que toute la nation — les hommes de guerre sortis d’Égypte — ait disparu, parce qu’ils n’avaient pas écouté la voix de Yahweh. Yahweh leur avait juré de ne pas leur laisser voir le pays que Yahweh avait juré à leurs pères de nous donner[a], un pays ruisselant de lait et de miel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « de nous donner » ; certaines versions anciennes et certaines traductions ont : « de leur donner ».'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de ce qui précède et conserve naturellement la valeur causale ou explicative de la conjonction.
- source_word: הָלְכוּ
  choice: avaient marché
  rationale: Conserve l’image concrète du verbe « marcher, aller » tout en marquant l’antériorité dans cette explication rétrospective.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque masculine et demeure intelligible en français biblique moderne.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français courant, « désert » désigne naturellement l’espace inculte et aride du parcours d’Israël; « région sauvage » serait ici moins idiomatique.
- source_word: עַד תֹּם
  choice: jusqu’à ce que ... ait disparu
  rationale: Exprime l’achèvement de ce groupe dans le contexte de la mort de la génération combattante, sans détailler le mode de disparition.
- source_word: כָּל הַגּוֹי
  choice: toute la nation
  rationale: Préserve la valeur collective de גּוֹי; l’apposition suivante précise qu’il s’agit des hommes de guerre sortis d’Égypte.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les hommes de guerre
  rationale: Rendu proche de la forme hébraïque, qui garde à la fois le marquage masculin et le sens militaire.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: ils n’avaient pas écouté la voix de Yahweh
  rationale: Conserve l’image auditive de l’idiome hébreu ainsi que son implication d’obéissance.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: avait juré de ne pas leur laisser voir
  rationale: Formulation française naturelle qui maintient la nuance causative de la forme de ראה.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays ruisselant de lait et de miel
  rationale: « Ruisselant » restitue vivement le participe זָבַת et conserve l’image traditionnelle d’abondance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom d’alliance sans le remplacer par un titre.
- issue: Pronom de לָנוּ
  choice: de nous donner
  alternative: de leur donner
  rationale: Le texte massorétique porte la première personne du pluriel, dont la tension avec le récit est conservée dans le texte; la variante ancienne à la troisième personne est signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu sans devenir artificielle; les répétitions théologiquement significatives, notamment le serment de Yahweh, sont maintenues.
