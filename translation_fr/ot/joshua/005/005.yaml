  text: כִּֽי מֻלִ֣ים הָי֔וּ כָּל הָ/עָ֖ם הַ/יֹּֽצְאִ֑ים וְ/כָל הָ֠/עָם הַ/יִּלֹּדִ֨ים בַּ/מִּדְבָּ֥ר בַּ/דֶּ֛רֶךְ בְּ/צֵאתָ֥/ם מִ/מִּצְרַ֖יִם לֹא מָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: fr
  text: Car tout le peuple qui était sorti avait été circoncis, mais tous ceux qui étaient nés dans le désert, au cours du voyage après leur sortie d’Égypte[a], ne l’avaient pas été.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur le chemin, lors de leur sortie d’Égypte ». La construction hébraïque rattache la naissance dans le désert au voyage commencé lors de la sortie d’Égypte.'
    reason: La note rend compte de la formulation plus formelle de l’hébreu tout en expliquant la relation temporelle adoptée dans le texte principal.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente ; « Car » marque naturellement ce lien logique dans un récit de registre soutenu mais accessible.
- source_word: מֻלִים הָיוּ
  choice: avait été circoncis
  rationale: Le participe passif accompagné de היה décrit un état déjà acquis ; le plus-que-parfait français exprime cette antériorité.
- source_word: כָּל הָעָם הַיֹּצְאִים
  choice: tout le peuple qui était sorti
  rationale: « Peuple » conserve la désignation collective du texte hébreu sans la réduire explicitement aux hommes, tandis que le singulier collectif est naturel en français.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: mais tous ceux qui étaient nés
  rationale: Le וְ met ici les deux générations en contraste ; « mais » rend ce rapport. « Tous ceux » évite la tournure peu naturelle « tout le peuple qui étaient nés » tout en conservant la portée collective.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans ce contexte, « désert » est le terme français courant et traditionnel pour la région inhabitée traversée par Israël.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: Cette expression concise conserve l’idée du déplacement et du voyage présente dans דֶּרֶךְ.
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: après la sortie d’Égypte
  rationale: Dans le contexte, la formule situe les naissances pendant le trajet consécutif à l’exode. Une note signale la formulation plus littérale et l’étendue possible de la relation temporelle.
- source_word: לֹא מָלוּ
  choice: ne l’avaient pas été
  rationale: Bien que le verbe hébreu soit actif, son sujet agentif n’est pas exprimé et le contexte porte sur l’état des personnes concernées. La reprise pronominale évite de répéter lourdement « circoncis ».
theological_decisions:
- issue: Portée de « tout le peuple » dans un contexte de circoncision
  choice: Conserver le terme collectif « peuple » sans insérer « hommes »
  alternative: Traduire par « tous les hommes »
  rationale: La circoncision concerne les personnes de sexe masculin, mais le texte emploie עָם, « peuple », et non un terme signifiant explicitement « hommes ». La traduction ne précise donc pas davantage que la source.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, évite un calque grammatical maladroit du collectif hébreu et conserve le contraste entre la génération sortie d’Égypte et celle née dans le désert.
