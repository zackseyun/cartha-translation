    issue: Formulation temporelle maladroite et note imprécise
    rationale: « En chemin après la sortie d’Égypte » ne relie pas clairement le voyage à la sortie. De plus, la note présente « lors de leur sortie » comme une option plus littérale sans signaler qu’une lecture strictement simultanée serait peu naturelle dans ce contexte. Une formulation explicitant le voyage postexodique, tout en signalant la construction hébraïque, est préférable.
