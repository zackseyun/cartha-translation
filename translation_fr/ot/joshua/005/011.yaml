  text: וַ/יֹּ֨אכְל֜וּ מֵ/עֲב֥וּר הָ/אָ֛רֶץ מִ/מָּֽחֳרַ֥ת הַ/פֶּ֖סַח מַצּ֣וֹת וְ/קָל֑וּי בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: fr
  text: 'Ils mangèrent des produits du pays le lendemain de la Pâque : des pains sans levain et du grain rôti[a], ce jour-là même.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du grain grillé ». Le terme hébreu désigne du grain préparé par la chaleur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: Ils mangèrent
  rationale: Le wayyiqtol de אכל poursuit la narration. Le passé simple convient au registre narratif biblique en français tout en restant clair.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: des produits du pays
  rationale: עֲבוּר désigne ici les produits ou la récolte du pays. « Des produits du pays » rend naturellement la valeur partitive de מִן sans ajouter explicitement l’idée d’une ancienne récolte.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: dès le lendemain de la Pâque
  rationale: La locution marque le jour suivant la Pâque. « Dès » rend naturellement la nuance temporelle possible de מִן dans ce contexte.
- source_word: מַצּוֹת
  choice: des pains sans levain
  rationale: Équivalent français courant et précis dans le contexte de la Pâque.
- source_word: וְקָלוּי
  choice: et du grain rôti
  rationale: קָלוּי désigne du grain préparé par grillage ou torréfaction. « Grain rôti » est clair en français moderne.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ce jour-là même
  rationale: Cette tournure conserve l’insistance de l’idiome hébreu sur le jour précis, avec une deixis naturelle dans un récit français au passé.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient le ton du récit. La formulation évite d’introduire « ancienne récolte », nuance possible mais non explicitement exprimée par le nom hébreu lui-même.
