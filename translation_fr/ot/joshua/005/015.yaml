  text: וַ/יֹּאמֶר֩ שַׂר צְבָ֨א יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ שַׁל נַֽעַלְ/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֥ר אַתָּ֛ה עֹמֵ֥ד עָלָ֖י/ו קֹ֣דֶשׁ ה֑וּא וַ/יַּ֥עַשׂ יְהוֹשֻׁ֖עַ כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: fr
  text: 'Alors le chef de l’armée de Yahweh[a] dit à Josué : « Enlève ta sandale de ton pied[b], car le lieu où tu te tiens est saint. » Et Josué fit ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « le chef des troupes de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est au singulier : « ta sandale… ton pied ». Comparer la formulation plurielle, plus familière, en Exode 3:5.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: chef
  rationale: Dans ce contexte militaire, « chef » exprime clairement l’autorité sur une armée, sans la connotation moderne de grade précis que pourrait avoir « commandant ».
- source_word: צְבָא יְהוָה
  choice: l’armée de Yahweh
  rationale: צָבָא désigne ici une armée ou une troupe. « Armée » conserve le sens militaire dans un français moderne et accessible; la construction hébraïque peut aussi être comprise comme « l’armée de Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver son caractère de nom personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: שַׁל
  choice: Enlève
  rationale: L’impératif ordonne de retirer la sandale; « enlève » est direct, naturel et exact en français.
- source_word: נַעַלְךָ
  choice: ta sandale
  rationale: Le singulier hébreu est conservé. « Sandale » correspond mieux au type de chaussure du contexte ancien que le terme générique « chaussure ».
- source_word: מֵעַל רַגְלְךָ
  choice: de ton pied
  rationale: Le texte hébreu emploie le singulier, qui est maintenu malgré la formulation plurielle plus familière d’Exode 3.5.
- source_word: הַמָּקוֹם
  choice: le lieu
  rationale: Rendu direct du nom défini, sans ajouter un démonstratif absent de l’hébreu.
- source_word: עֹמֵד עָלָיו
  choice: où tu te tiens
  rationale: Cette tournure française rend naturellement la posture continue exprimée par le participe et sous-entend sans ambiguïté « sur lequel ».
- source_word: קֹדֶשׁ הוּא
  choice: est saint
  rationale: « Saint » est le terme biblique usuel et conserve la portée religieuse de קֹדֶשׁ.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: Et Josué fit ainsi
  rationale: Formule française concise qui préserve la notation narrative de l’obéissance de Josué.
theological_decisions:
- issue: Identité et statut du personnage appelé שַׂר צְבָא יְהוָה
  choice: Traduire le titre de manière descriptive par « le chef de l’armée de Yahweh »
  alternative: L’identifier explicitement comme un chef angélique, une manifestation de Yahweh ou une apparition du Christ avant son incarnation
  rationale: Le verset fournit un titre et rapporte l’ordre relatif au lieu saint, mais ne précise pas davantage l’identité du personnage. La traduction préserve donc cette tension sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste solennel sans archaïsme. Le singulier inhabituel de « sandale » et « pied » est volontairement conservé et expliqué en note.
