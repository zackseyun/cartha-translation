  to: 'Yahvé dit à Josué : « Aujourd’hui, j’ai fait rouler loin de vous l’opprobre de l’Égypte[a]. » C’est pourquoi on appela ce lieu Guilgal[b], nom qu’il porte encore aujourd’hui.'
  rationale: La révision remplace une formulation française peu idiomatique par « j’ai fait rouler loin de vous », qui conserve l’image et le jeu de mots de גלל/Guilgal. « Opprobre » est retenu pour חרפה afin de mieux garder la portée sociale et potentiellement cultuelle du terme sans résoudre l’ambiguïté de « l’Égypte ». Les ancres et le contenu des notes demeurent cohérents avec le texte révisé.
