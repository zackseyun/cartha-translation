source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: fr
  text: 'Yahvé dit à Josué : « Aujourd’hui, j’ai fait rouler loin de vous l’opprobre de l’Égypte[a]. » C’est pourquoi on appela ce lieu Guilgal[b], nom qu’il porte encore aujourd’hui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la honte de l’Égypte ». L’expression peut désigner la honte du passé d’Israël en Égypte, les reproches venant des Égyptiens ou une disgrâce liée à l’alliance qui vient d’être ôtée.
    reason: lexical_alternative
  - marker: b
    text: En hébreu, le nom « Guilgal » fait écho au verbe traduit par « j’ai fait rouler », ce qui crée un jeu de mots.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui représente le tétragramme plutôt que de le remplacer par un titre.
- source_word: גַּלּוֹתִי
  choice: j’ai roulé loin de vous
  rationale: Conserve l’image concrète du verbe גלל (« rouler ») et son jeu de mots avec Guilgal, malgré une tournure volontairement plus imagée que le simple « j’ai enlevé ».
- source_word: חֶרְפַּת מִצְרַיִם
  choice: la honte de l’Égypte
  rationale: « Honte » rend de façon claire חֶרְפָּה, tandis que le complément « de l’Égypte » maintient l’ambiguïté du rapport génitif hébreu.
- source_word: מֵעֲלֵיכֶם
  choice: loin de vous
  rationale: Rend naturellement en français l’idée de retirer ce qui pesait sur les Israélites, sans reproduire le calque peu idiomatique « de dessus vous ».
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: C’est pourquoi on appela ce lieu Guilgal
  rationale: Le sujet du verbe singulier est implicite. Le pronom indéfini « on » préserve cette indétermination et donne une formule française naturelle de dénomination; « C’est pourquoi » explicite le lien narratif porté par וַ־ et par le jeu de mots.
- source_word: גִּלְגָּל
  choice: Guilgal
  rationale: Translittération traditionnelle et immédiatement reconnaissable en français du nom de lieu hébreu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: nom qu’il porte encore aujourd’hui
  rationale: Rend idiomatiquement la formule temporelle depuis le point de vue du narrateur tout en la rattachant clairement au nom du lieu.
theological_decisions:
- issue: Sens de « la honte de l’Égypte »
  choice: Maintenir l’expression ouverte sans préciser la nature ni l’origine exacte de cette honte.
  alternative: L’identifier explicitement à l’esclavage en Égypte, aux railleries des Égyptiens ou à l’incirconcision d’Israël.
  rationale: L’hébreu ne tranche pas entre ces interprétations. La formulation retenue préserve donc l’ambiguïté historique et théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « j’ai roulé loin de vous » conserve l’image et le jeu de mots hébreux; les notes expliquent l’ambiguïté lexicale et l’écho sonore sans imposer une interprétation.
