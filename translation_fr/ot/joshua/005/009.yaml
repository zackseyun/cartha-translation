  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : YHWH parle à Josué, déclare avoir ôté « l’opprobre de l’Égypte » de dessus le peuple, puis le récit rattache le nom de Guilgal à cette déclaration. L’ambiguïté du génitif hébreu est préservée. Toutefois, « j’ai roulé loin de vous la honte » est une construction française peu naturelle et atténue légèrement la relation verbale avec son complément.'
  naturalness: Le registre est globalement moderne et digne. « J’ai fait rouler loin de vous l’opprobre » est plus fluide en français tout en gardant l’image du roulement et le jeu de mots. « Nom qu’il porte encore aujourd’hui » rend bien la formule narrative « jusqu’à ce jour ».
  terminology: « Yahvé », « Josué » et « Guilgal » conviennent à l’usage biblique français. « Opprobre » rend plus précisément et plus durablement חרפה que « honte », tout en laissant ouverte l’origine ou la nature de cet opprobre.
