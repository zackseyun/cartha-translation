  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: fr
  text: 'Or, lorsque Josué était à Jéricho[a], il leva les yeux et vit : voici qu’un homme se tenait en face de lui, son épée dégainée à la main. Josué alla vers lui et lui demanda : « Es-tu avec nous ou avec nos ennemis ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de Jéricho ». La préposition hébraïque peut désigner la localisation de façon large, sans préciser si Josué se trouvait dans la ville même ou à proximité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Or, lorsque
  rationale: La formule narrative introduit une nouvelle scène. « Or » en restitue naturellement la transition en français moderne sans recourir à l’archaïque « il arriva que ».
- source_word: בִּהְיוֹת
  choice: lorsque ... était
  rationale: L’infinitif construit précédé de ב exprime ici la circonstance temporelle.
- source_word: בִּירִיחוֹ
  choice: près de Jéricho
  rationale: La préposition ב peut exprimer une localisation assez large. Dans le contexte du siège, « près de Jéricho » évite de placer explicitement Josué à l’intérieur de la ville, sans prétendre que l’hébreu impose cette précision.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: il leva les yeux et regarda
  rationale: Cette formulation conserve les deux verbes et l’image vive de l’idiome hébreu, tout en restant naturelle en français.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure attire l’attention sur l’apparition soudaine de l’homme et rend la vivacité de la particule hébraïque.
- source_word: אִישׁ
  choice: un homme
  rationale: Le verset désigne simplement la figure comme un homme; la traduction n’anticipe pas son identification ultérieure.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: se tenait en face de lui
  rationale: Cette expression rend la position frontale, potentiellement confrontante, indiquée par לְנֶגֶד.
- source_word: חַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: son épée dégainée à la main
  rationale: « Dégainée » exprime précisément qu’elle est sortie du fourreau; la tournure française demeure concise et visuelle.
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: Josué alla vers lui
  rationale: Traduction directe du mouvement de Josué en direction de l’homme, sans ajouter l’idée d’attaque ou de défi.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: Es-tu avec nous ou avec nos ennemis ?
  rationale: Le ל marque ici l’appartenance ou l’allégeance. « Avec nous » est idiomatique en français et convient à la situation militaire.
theological_decisions:
- issue: Identité de l’homme rencontré par Josué
  choice: Le désigner uniquement comme « un homme ».
  alternative: L’identifier comme un ange, l’ange de l’Éternel, une théophanie ou une christophanie.
  rationale: Ce verset emploie seulement אִישׁ, « homme ». Même si la suite du récit nourrit l’interprétation, la traduction ne doit pas résoudre ici une identité que le verset laisse encore ouverte.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte garde la progression visuelle de l’hébreu et sa tension, sans archaïsmes appuyés ni identification théologique anticipée.
