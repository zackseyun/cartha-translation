base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: fr
  text: J’ai donné à Isaac Jacob et Ésaü, et j’ai donné à Ésaü la région montagneuse de Séïr[a] pour qu’il en prenne possession. Mais[b] Jacob et ses fils sont descendus en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mont Séïr » ou « les montagnes de Séïr ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Et Jacob et ses fils sont descendus en Égypte ». La conjonction hébraïque est simplement « et » ; le texte emploie « mais » pour rendre explicite le contraste.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: J’ai donné
  rationale: Le verbe נתן exprime ici directement le don de descendants puis d’un territoire; la répétition française conserve celle de l’action divine dans l’hébreu.
- source_word: הַר שֵׂעִיר
  choice: la région montagneuse de Séïr
  rationale: הַר peut désigner une montagne ou une zone montagneuse. Dans ce contexte territorial, « région montagneuse » évite de réduire Séïr à un sommet isolé.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: pour qu’il en prenne possession
  rationale: ירש signifie ici acquérir et occuper un territoire. Cette formulation française est naturelle et explicite sans imposer le sens plus spécialisé d’« hériter ».
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: Mais Jacob et ses fils
  rationale: Le waw signifie formellement « et », mais la juxtaposition oppose le territoire reçu par Ésaü à la descente de Jacob en Égypte; « mais » rend ce contraste discursif en français.
- source_word: יָרְדוּ מִצְרָיִם
  choice: sont descendus en Égypte
  rationale: La traduction conserve le mouvement exprimé par ירד ainsi que l’idiome géographique traditionnel, qui demeure naturel en français biblique moderne.
theological_decisions:
- issue: Valeur de la dernière conjonction hébraïque
  choice: Mais
  alternative: Et
  rationale: Le waw ne marque pas à lui seul une opposition forte. Toutefois, le contexte juxtapose deux destinées différentes; « mais » explicite ce contraste narratif sans ajouter d’interprétation doctrinale. La note préserve la possibilité de la traduction formelle « et ».
translation_notes:
  register: Français international moderne, naturel et digne. Les noms propres suivent les formes françaises usuelles. La formulation conserve la répétition de « J’ai donné » et le contraste narratif, tout en signalant dans les notes les ambiguïtés lexicales et conjonctives.
