id: JOS.24.24
reference: Joshua 24:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: fr
  text: 'Le peuple dit à Josué : « Nous servirons[a] Yahweh, notre Dieu, et nous obéirons à sa voix[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous rendrons un culte à ». Le verbe hébreu peut désigner le service cultuel rendu à Dieu, mais « servir » conserve ici le sens plus large de l’engagement dans l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « nous écouterons sa voix » ; cette expression hébraïque implique qu’on répond avec obéissance à ce qu’il dit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: Le peuple dit à Josué
  rationale: Le wayyiqtol de אמר introduit simplement le discours direct. הָעָם désigne ici la communauté d’alliance assemblée, rendue naturellement par « le peuple ».
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, notre Dieu
  rationale: 'Le nom divin est translittéré « Yahweh », et le suffixe de première personne du pluriel dans אֱלֹהֵינוּ exprime la relation d’alliance : « notre Dieu ».'
- source_word: נַעֲבֹד
  choice: nous servirons
  rationale: עבד peut désigner le service rendu à Dieu, y compris le culte, mais « servir » conserve ici toute la portée de l’engagement et de la loyauté d’alliance.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: et nous obéirons à sa voix
  rationale: L’expression hébraïque signifie littéralement écouter la voix de quelqu’un, avec ici le sens d’y répondre par l’obéissance. La formulation française conserve « sa voix » tout en explicitant la force du verbe שמע.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens religieux de עבד dans le contexte de l’alliance
  choice: servir
  alternative: adorer / rendre un culte
  rationale: L’engagement exprimé dépasse le seul acte cultuel et comprend la fidélité active envers Dieu ; « servir » préserve cette amplitude.
- issue: Portée de שמע dans l’expression בְקוֹלוֹ נִשְׁמָע
  choice: obéir à sa voix
  alternative: écouter sa voix
  rationale: Dans ce contexte d’engagement d’alliance, entendre ou écouter implique une réponse obéissante. La note maintient toutefois visible la formulation plus littérale.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple rend l’engagement collectif. La tournure « obéir à sa voix » conserve la résonance hébraïque tout en restant intelligible en français.
