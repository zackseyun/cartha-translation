  text: וְ/אֶלְעָזָ֥ר בֶּֽן אַהֲרֹ֖ן מֵ֑ת וַ/יִּקְבְּר֣וּ אֹת֗/וֹ בְּ/גִבְעַת֙ פִּֽינְחָ֣ס בְּנ֔/וֹ אֲשֶׁ֥ר נִתַּן ל֖/וֹ בְּ/הַ֥ר אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: fr
  text: Éléazar, fils d’Aaron, mourut. On l’enterra à Guibéa de Phinéas, son fils, qui lui avait été donnée[a] dans la région montagneuse d’Éphraïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui avait été donnée à Phinéas ». Le pronom hébreu peut renvoyer à Phinéas, le nom masculin le plus proche, mais son antécédent n’est pas explicitement indiqué.'
    reason: Préserver l’ambiguïté grammaticale réelle de לו sans rendre le texte principal artificiel.
lexical_decisions:
- source_word: גִבְעַת פִּינְחָס
  choice: Guibéa de Phinéas
  rationale: Le syntagme désigne vraisemblablement un lieu nommé d’après Phinéas; la translittération traditionnelle « Guibéa » conserve sa valeur de nom propre, tandis que « de Phinéas » rend la relation génitivale.
- source_word: הַר אֶפְרָיִם
  choice: la région montagneuse d’Éphraïm
  rationale: Ici, הַר désigne le massif ou la région montagneuse d’Éphraïm, et non une montagne isolée.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: On l’enterra
  rationale: Le pluriel hébreu indéfini se rend naturellement en français par « on », sans introduire des acteurs non précisés.
theological_decisions:
- issue: Antécédent du pronom לו dans « qui lui avait été donnée »
  choice: Conserver le pronom ambigu dans le texte et expliciter l’incertitude en note
  alternative: Préciser « qui avait été donnée à Phinéas »
  rationale: Le masculin singulier לו peut renvoyer naturellement à Phinéas, le nom masculin le plus proche, mais le texte hébreu ne nomme pas explicitement son antécédent; il convient donc de ne pas trancher silencieusement.
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au registre historique biblique tout en restant clair. « Guibéa de Phinéas » est traité comme un nom de lieu, et « région montagneuse » évite de faire de הַר une montagne unique.
