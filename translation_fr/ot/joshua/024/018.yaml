  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: fr
  text: Yahweh a chassé tous les peuples de devant nous, ainsi que les Amorites qui habitaient le pays. Nous aussi, nous servirons Yahweh, car il est notre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: a chassé
  rationale: Le verbe גרש exprime l’action de chasser ou d’expulser. « A chassé » restitue directement la force du terme sans préciser indûment les modalités de l’éviction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: כָּל הָעַמִּים
  choice: tous les peuples
  rationale: Le pluriel עַמִּים désigne ici plusieurs groupes ethniques ou nationaux; « peuples » en conserve naturellement le nombre et la portée.
- source_word: וְאֶת הָאֱמֹרִי
  choice: ainsi que les Amorites
  rationale: La coordination hébraïque ajoute les Amorites aux peuples précédemment mentionnés. « Ainsi que » reste proche de la syntaxe sans imposer qu’ils soient explicitement présentés comme un sous-ensemble.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: qui habitaient le pays
  rationale: Le participe décrit les Amorites comme résidents du territoire. L’accord français au pluriel est naturel puisque le nom collectif hébreu désigne ici le peuple amorite.
- source_word: מִפָּנֵינוּ
  choice: devant nous
  rationale: L’expression idiomatique signifie que Yahweh les a ôtés de devant Israël. « Devant nous » préserve l’image spatiale hébraïque dans un français idiomatique.
- source_word: גַּם אֲנַחְנוּ
  choice: Nous aussi
  rationale: Cette formulation marque clairement l’engagement parallèle du peuple en réponse à la déclaration précédente de Josué.
- source_word: נַעֲבֹד
  choice: nous servirons
  rationale: Avec Dieu pour objet, עבד englobe le service, la fidélité et le culte. « Servir » en maintient la portée plus large que le seul acte cultuel.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: car il est notre Dieu
  rationale: כִּי introduit ici la raison de l’engagement. « Car » convient au registre digne du passage tout en restant courant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée de עבד dans le contexte de l’alliance
  choice: servir
  alternative: adorer
  rationale: Le verbe inclut l’adoration, mais aussi l’allégeance et l’obéissance. « Servir » conserve cette amplitude théologique sans réduire le sens au culte.
- issue: Relation entre « tous les peuples » et « les Amorites »
  choice: coordination conservée par « ainsi que »
  alternative: « notamment les Amorites » ou « y compris les Amorites »
  rationale: L’hébreu coordonne les deux compléments sans expliciter formellement si le second est une précision inclusive. La traduction évite de résoudre silencieusement cette relation.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « Nous aussi, nous » est idiomatique et souligne l’engagement collectif. Aucun archaïsme ni vocabulaire confessionnel particulier n’est introduit.
