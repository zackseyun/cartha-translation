id: JOS.24.9
reference: Joshua 24:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: fr
  text: Alors Balak, fils de Tsippor, roi de Moab, se leva[a] et combattit Israël[b]. Il envoya chercher Balaam, fils de Béor, et l’appela pour qu’il vous maudisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mit en action ». Le verbe hébreu peut marquer le commencement d’une action résolue.
    reason: lexical_alternative
  - marker: b
    text: Ou « fit la guerre à Israël » ou « entra en guerre contre Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Dans le récit, קום peut marquer le commencement d’une action résolue. « Se leva » conserve cette formulation sans la réduire au simple fait de se mettre debout.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: combattit Israël
  rationale: לחם avec ב exprime ici une action hostile dirigée contre Israël. Cette formulation est directe et naturelle en français.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: Il envoya chercher … et l’appela
  rationale: La traduction garde les deux verbes successifs de l’hébreu. « Envoya chercher » explicite naturellement en français l’envoi de messagers auprès de Balaam, tandis que « l’appela » préserve le second verbe.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: Balaam, fils de Béor
  rationale: Les noms propres suivent leurs formes françaises bibliques courantes.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: pour qu’il vous maudisse
  rationale: Le verbe קלל désigne ici l’action d’appeler une malédiction sur quelqu’un. Cette formulation rend clairement le but de l’appel adressé à Balaam.
theological_decisions:
- issue: La déclaration selon laquelle Balak combattit Israël, alors que le récit des Nombres met surtout en avant sa tentative de faire maudire Israël par Balaam
  choice: 'Conserver le sens direct : « combattit Israël »'
  alternative: Atténuer en « agit en ennemi contre Israël » ou harmoniser en « se prépara à combattre Israël »
  rationale: L’hébreu affirme explicitement וַיִּלָּחֶם בְּיִשְׂרָאֵל. La traduction ne doit pas modifier cette formulation afin de l’harmoniser avec un autre passage.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au récit solennel. La syntaxe reste accessible tout en conservant la succession des actions de l’hébreu.
