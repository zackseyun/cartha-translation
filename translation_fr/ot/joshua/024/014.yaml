  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: fr
  text: Maintenant, craignez Yahweh et servez-le avec intégrité et fidélité[a]. Débarrassez-vous des dieux que vos pères ont servis de l’autre côté du Fleuve[b] et en Égypte, et servez Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une entière sincérité et en vérité »; les termes hébreux évoquent l’intégrité, la sincérité, la vérité et la fidélité.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire de l’autre côté de l’Euphrate.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition entre le rappel historique précédent et l’exhortation de Josué. « Maintenant » est naturel en français actuel.
- source_word: יְרָאוּ
  choice: craignez
  rationale: Conserve le sens fort de la crainte révérencielle et obéissante envers Dieu, sans l’atténuer en simple respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: et servez-le
  rationale: Le verbe עבד englobe ici le culte, l’allégeance et l’obéissance; « servir » en préserve l’étendue et permet de rendre la répétition finale.
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: avec intégrité et fidélité
  rationale: Le binôme exprime une consécration entière, sincère et fiable. « Intégrité » évite l’idée excessive de perfection sans faute, tandis que « fidélité » convient à la portée relationnelle de אֱמֶת.
- source_word: וְהָסִירוּ
  choice: Débarrassez-vous
  rationale: Formulation française actuelle exprimant clairement l’ordre d’éliminer les divinités rivales de leur pratique.
- source_word: אֱלֹהִים
  choice: des dieux
  rationale: L’hébreu dit simplement « dieux »; aucun qualificatif comme « étrangers » n’est ajouté.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Reproduit le terme familial masculin du texte, qui désigne les aïeux concernés.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: de l’autre côté du Fleuve
  rationale: Rend l’expression géographique conventionnelle sans insérer dans le corps du texte l’identification implicite à l’Euphrate.
- source_word: וּבְמִצְרַיִם
  choice: et en Égypte
  rationale: Rend directement la seconde indication géographique.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: et servez Yahweh
  rationale: Maintient la répétition rhétorique de l’impératif et la coordination simple de l’hébreu.
theological_decisions:
- issue: Traduction du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Portée de la crainte de Dieu
  choice: craignez Yahweh
  alternative: révérez Yahweh
  rationale: « Craignez » maintient la force et la tension théologique du verbe hébreu, tout en laissant le contexte montrer qu’il s’agit d’une crainte liée au service fidèle.
- issue: Sens du couple תָמִים / אֱמֶת
  choice: avec intégrité et fidélité
  alternative: avec sincérité et vérité
  rationale: Le choix retenu exprime la totalité de l’engagement et sa fiabilité, sans prétendre que תָמִים désigne ici une perfection morale absolue.
- issue: Désignation des générations antérieures
  choice: vos pères
  alternative: vos ancêtres
  rationale: « Vos pères » conserve la forme masculine précise de l’hébreu, sans exclure la portée ancestrale du référent.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde les impératifs successifs et la répétition de « servez », importante pour la structure exhortative du verset. Les marqueurs [a] et [b] ont été placés selon le contenu réel des notes, en corrigeant leur inversion apparente dans la couche anglaise fournie.
