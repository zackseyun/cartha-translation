  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: fr
  text: 'Josué dit à tout le peuple : « Voyez, cette pierre servira de témoin contre nous[a], car elle a entendu[b] toutes les paroles que Yahvé a prononcées avec nous. Elle servira de témoin contre vous, de peur que vous ne reniiez votre Dieu[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « témoin pour nous » ou « témoin à notre égard ». La préposition hébraïque peut avoir un sens plus neutre; dans ce contexte, la pierre témoigne contre toute infidélité à l’alliance.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit bien « elle a entendu » : la pierre est personnifiée comme témoin des paroles de l’alliance.'
    reason: cultural_note
  - marker: c
    text: Ou « n’agissiez avec perfidie envers votre Dieu » ou « ne vous montriez infidèles à votre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voyez
  rationale: Cette interjection actuelle attire l’attention sur la pierre sans recourir à la tournure archaïque « Voici que ».
- source_word: הָאֶבֶן הַזֹּאת
  choice: cette pierre
  rationale: אֶבֶן désigne normalement une pierre et convient précisément au monument qui vient d’être dressé.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: servira de témoin
  rationale: Cette formulation française naturelle conserve la portée testimoniale et juridique du terme עֵדָה dans le cadre de l’alliance.
- source_word: בָּנוּ / בָכֶם
  choice: contre nous / contre vous
  rationale: Dans cet avertissement relatif à l’infidélité à l’alliance, la préposition ב introduit vraisemblablement les personnes contre lesquelles la pierre témoignera. Une note conserve toutefois la valeur plus neutre possible.
- source_word: שָׁמְעָה
  choice: elle a entendu
  rationale: Le parfait hébreu est rendu avec sa pertinence présente et la personnification explicite de la pierre est maintenue.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: toutes les paroles que Yahvé nous a dites
  rationale: « Paroles » est naturel pour les déclarations divines; la relative permet de rendre idiomatiquement אֲשֶׁר דִּבֶּר עִמָּנוּ. Le nom divin est translittéré « Yahvé ».
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française exprime clairement la valeur préventive et menaçante de פֶּן.
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: vous ne reniiez votre Dieu
  rationale: « Renier » exprime ici le désaveu de Dieu et l’infidélité envers lui, tout en restant digne et intelligible.
theological_decisions:
- issue: Personnification de la pierre qui entend et témoigne
  choice: Conserver littéralement la personnification
  alternative: Expliciter seulement que la pierre est un mémorial symbolique de l’alliance
  rationale: L’hébreu affirme expressément que la pierre a entendu et qu’elle servira de témoin. Maintenir cette image préserve la force rhétorique de la cérémonie d’alliance.
- issue: Fonction accusatrice du témoin
  choice: Traduire בָּנוּ et בָכֶם par « contre nous » et « contre vous »
  alternative: Employer les formulations plus neutres « pour nous », « à notre égard » ou « parmi vous »
  rationale: Le contexte d’avertissement favorise une fonction accusatrice, mais la note signale honnêtement l’ambiguïté de la préposition hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste solennel sans archaïsmes. La répétition de « servira de témoin » et la personnification de la pierre sont conservées, tandis que « de peur que… ne » restitue naturellement la mise en garde de l’hébreu.
