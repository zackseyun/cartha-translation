language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: fr
  text: Puis je fis sortir vos pères d’Égypte, et vous arrivâtes à la mer. Les Égyptiens poursuivirent vos pères avec des chars et des cavaliers jusqu’à la mer Rouge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement, « la mer des Roseaux ». Hébreu : yam souf.'
    reason: Alternative lexicale importante pour יַם סוּף.
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: Puis je fis sortir
  rationale: Le hiphil de יצא signifie « faire sortir » ou « conduire hors de ». « Puis » rend naturellement la progression narrative marquée par le waw.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Traduction formellement proche de l’hébreu, qui désigne ici les pères ancestraux d’Israël. « Vos ancêtres » serait possible, mais atténuerait le terme familial masculin du texte.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Rend simplement et idiomatiquement la provenance marquée par מן après « fis sortir ».
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: et vous arrivâtes à la mer
  rationale: Le verbe בוא et la finale directionnelle indiquent un mouvement vers la mer. La deuxième personne est conservée, car le discours identifie les auditeurs à la génération de l’Exode.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Les Égyptiens poursuivirent
  rationale: Le nom collectif « Égypte » désigne ici les forces égyptiennes et commande un verbe hébreu au pluriel. « Les Égyptiens » est naturel et explicite en français.
- source_word: בְּרֶכֶב
  choice: avec des chars
  rationale: רכב désigne ici les chars ou les forces de chars; cette formulation est claire et conserve l’image militaire.
- source_word: וּבְפָרָשִׁים
  choice: et des cavaliers
  rationale: פָּרָשִׁים désigne des hommes montés ou des troupes à cheval; « cavaliers » est le terme français courant et précis.
- source_word: יַם סוּף
  choice: la mer Rouge
  rationale: La désignation traditionnelle est immédiatement reconnaissable en français. Le sens plus littéral « mer des Roseaux » est signalé en note.
theological_decisions:
- issue: Adresse représentative à l’Israël ultérieur (« vous arrivâtes » à propos de la génération de l’Exode)
  choice: 'Conserver la deuxième personne : « vous arrivâtes à la mer »'
  alternative: 'Employer la troisième personne : « ils arrivèrent à la mer »'
  rationale: La formulation hébraïque associe intentionnellement l’auditoire présent à ses pères dans l’histoire de l’alliance; passer à la troisième personne en effacerait la force rhétorique.
- issue: Traduction de יַם סוּף
  choice: Employer « la mer Rouge » dans le texte principal
  alternative: « la mer des Roseaux »
  rationale: « Mer Rouge » maintient l’identification traditionnelle et la reconnaissance du récit, tandis que la traduction lexicale plus littérale est conservée en note sans trancher la question géographique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La ponctuation en deux phrases évite un enchaînement lourd tout en préservant la progression du verset.
