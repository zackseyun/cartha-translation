source:
  edition: WLC
  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: fr
  text: Je vous ai donné une terre sur laquelle vous n’aviez pas travaillé[a], ainsi que des villes que vous n’aviez pas bâties et où vous habitez. Vous mangez le produit de vignobles et d’oliviers que vous n’avez pas plantés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe ici au singulier (« tu n’avais pas travaillé »), puis revient au pluriel dans le reste du verset.
    reason: Préserver l’alternance grammaticale de l’adresse collective à Israël.
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Je vous ai donné
  rationale: Le wayyiqtol qal à la première personne du singulier rapporte le don accompli par Dieu; le passé composé convient au récit oral en français moderne.
- source_word: אֶרֶץ
  choice: un pays
  rationale: « Pays » exprime ici naturellement le territoire donné à Israël, sans ajouter au texte l’article défini.
- source_word: אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: pour lequel vous n’aviez pas peiné
  rationale: יגע désigne l’effort pénible ou le labeur. Le plus-que-parfait marque que ce travail n’avait pas précédé le don; « pour lequel » est idiomatique en français.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: ainsi que des villes que vous n’aviez pas bâties
  rationale: « Villes » correspond directement à עָרִים; « bâties » garde un registre digne et le plus-que-parfait explicite l’antériorité.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: et où vous habitez
  rationale: ישב signifie ici habiter ou demeurer. Le présent rend l’état qui résulte encore du don passé.
- source_word: כְּרָמִים וְזֵיתִים
  choice: vignobles et oliviers
  rationale: כְּרָמִים désigne des vignobles; זֵיתִים peut désigner les olives ou les oliviers, et le parallèle avec ce qui a été planté favorise ici « oliviers ».
- source_word: אַתֶּם אֹכְלִים
  choice: Vous mangez le produit de
  rationale: Le pronom explicite suivi du participe exprime une situation présente avec une certaine insistance. « Le produit de » rend naturellement en français le fait de manger ce qui provient des plantations.
theological_decisions:
- issue: Alternance entre le singulier et le pluriel dans l’adresse à Israël
  choice: Employer « vous » dans le texte courant et signaler le singulier hébreu en note
  alternative: Reproduire l’alternance par « tu » puis « vous »
  rationale: Israël est interpellé collectivement. Une alternance française non expliquée semblerait incohérente, tandis que la note préserve la particularité du texte hébreu sans en imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient à un discours rétrospectif, tandis que les présents « habitez » et « mangez » expriment la jouissance actuelle du don. « Le produit de » évite la tournure moins idiomatique « manger de vignobles et d’oliviers ».
