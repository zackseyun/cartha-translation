  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: fr
  text: Car Yahweh, notre Dieu, est celui qui nous a fait monter du pays d’Égypte, nous et nos pères, hors de la maison des esclaves[a]. C’est lui qui a accompli sous nos yeux ces grands signes[b] et qui nous a gardés sur tout le chemin que nous avons parcouru, parmi tous les peuples au milieu desquels nous sommes passés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « hors de la maison des esclaves »; on peut aussi comprendre : « hors du lieu d’esclavage ».'
    reason: Précise l’expression idiomatique hébraïque tout en conservant son terme concret.
  - marker: b
    text: 'Ou : « ces grands prodiges », « ces grands miracles ».'
    reason: Signale les principales nuances possibles de אוֹת dans ce contexte.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison donnée par le peuple pour son engagement exprimé au verset précédent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu et en préserve la portée d’alliance.
- source_word: הוּא הַמַּעֲלֶה
  choice: est celui qui nous a fait monter
  rationale: Le pronom indépendant est emphatique, et le participe de עלה conserve l’image d’une montée depuis l’Égypte.
- source_word: וְאֶת אֲבוֹתֵינוּ
  choice: nous et nos pères
  rationale: Conserve l’ordre des objets et le terme concret « pères » du texte hébreu.
- source_word: מִבֵּית עֲבָדִים
  choice: hors de la maison des esclaves
  rationale: Rend concrètement le pluriel עֲבָדִים, « esclaves », sans l’abstraire en « esclavage ».
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: ces grands signes
  rationale: « Signes » conserve la valeur première de אוֹת et laisse au contexte sa dimension miraculeuse.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: nous a gardés
  rationale: Exprime la protection assurée pendant le voyage tout en restant proche du verbe שׁמר.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: sur tout le chemin que nous avons parcouru
  rationale: Formulation française naturelle qui préserve l’image du chemin et l’étendue complète de la protection.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; la transcription distingue le nom personnel de Dieu d’un titre.
- issue: Sens de עֲבָדִים dans la formule de l’Exode
  choice: esclaves
  alternative: esclavage
  rationale: Le mot hébreu est un nom pluriel désignant des personnes asservies; le choix retenu maintient cette réalité sociale concrète.
translation_notes:
  register: Français international actuel, digne et lisible. La structure emphatique « est celui qui » et l’image de la montée hors d’Égypte sont conservées; la seconde phrase évite une coordination trop lourde sans modifier le référent.
