base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: fr
  text: Puis vous avez traversé le Jourdain et vous êtes arrivés à Jéricho. Les hommes de Jéricho[a], les Amorites, les Perizzites, les Cananéens, les Hittites, les Guirgashites, les Hivites et les Jébusites vous ont fait la guerre, et je les ai livrés entre vos mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les seigneurs de Jéricho » ou « les dirigeants de Jéricho ». L’expression hébraïque signifie littéralement « les maîtres/propriétaires de Jéricho » et peut désigner les responsables ou les notables de la ville plutôt que l’ensemble de ses habitants.
    reason: 'Alternative lexicale: l’expression civique hébraïque est ambiguë; la note signale l’interprétation politique possible sans l’imposer au texte.'
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: vous avez traversé le Jourdain
  rationale: Le qal de עבר décrit ici le franchissement du fleuve. « Traverser le Jourdain » est l’expression française naturelle et précise.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: vous êtes arrivés à Jéricho
  rationale: בוא avec אֶל peut exprimer l’arrivée à un lieu. Cette formulation respecte la préposition sans affirmer plus précisément que le texte l’entrée à l’intérieur de la ville.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: vous ont fait la guerre
  rationale: Le verbe לחם avec ב indique une action hostile dirigée contre Israël. « Faire la guerre à » convient au cadre collectif et reste idiomatique.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: les maîtres de Jéricho
  rationale: Le pluriel construit de בעל signifie littéralement « maîtres » ou « propriétaires ». Ce choix préserve l’ambiguïté entre dirigeants, notables et détenteurs de la ville, au lieu de la réduire à « habitants » ou à « hommes ».
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: les Amorites, les Perizzites, les Cananéens, les Hittites, les Guirgashites, les Hivites et les Jébusites
  rationale: Les formes hébraïques singulières sont des collectifs désignant des peuples; le pluriel est naturel en français. Les graphies retenues sont courantes dans les traductions bibliques françaises.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: je les ai livrés entre vos mains
  rationale: נתן ביד est un idiome de remise au pouvoir de quelqu’un. « Livrer entre les mains » en exprime clairement le sens tout en conservant l’image biblique.
theological_decisions:
- issue: L’action de Dieu dans la victoire d’Israël
  choice: « je les ai livrés entre vos mains »
  alternative: « je vous ai donné le pouvoir sur eux »
  rationale: La première personne du discours divin et l’attribution explicite de la victoire à Dieu sont conservées, sans réduire son action à une simple permission.
- issue: Identité des בַּעֲלֵי יְרִיחוֹ
  choice: « les maîtres de Jéricho » avec note
  alternative: « les dirigeants de Jéricho » ou « les habitants de Jéricho »
  rationale: Le terme peut viser les détenteurs, notables ou dirigeants de la ville. Une traduction plus déterminée trancherait une ambiguïté réelle du texte hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Le verset garde la longue énumération solennelle des peuples et l’image biblique « entre vos mains », tout en employant une syntaxe française fluide.
