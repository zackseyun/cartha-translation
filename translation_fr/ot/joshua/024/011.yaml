    rationale: Bien que בעלים puisse littéralement évoquer des maîtres/propriétaires, cette formulation française suggère indûment la possession. Dans ce contexte civique, le référent peut être les hommes ou habitants de Jéricho, ou plus précisément ses notables; le texte principal ne devrait pas trancher ni produire une connotation étrangère.
  - severity: low
    issue: Les ethnonymes sont présentés comme une apposition après un tiret.
    rationale: La syntaxe hébraïque énumère les groupes qui ont combattu. Les coordonner explicitement comme sujets rend mieux la structure et évite de laisser entendre que les peuples énumérés identifient uniquement les « maîtres de Jéricho ».
