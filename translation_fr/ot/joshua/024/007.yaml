  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: fr
  text: Alors ils crièrent vers Yahweh, qui plaça l’obscurité entre vous et les Égyptiens. Il fit venir la mer sur lui, et elle le recouvrit[a]. Vous avez vu de vos propres yeux ce que j’ai fait en Égypte. Puis vous avez vécu dans le désert pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici deux pronoms au singulier : « sur lui » et « le recouvrit ». Le singulier peut avoir un sens collectif et désigner l’Égypte ou l’armée égyptienne ; beaucoup de traductions mettent donc « sur eux » et « les recouvrit ».'
    reason: Signaler les suffixes singuliers du texte hébreu et l’autre traduction courante sans résoudre silencieusement leur référent.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל יְהוָה
  choice: ils crièrent vers Yahweh
  rationale: Le verbe צעק exprime ici un cri de détresse adressé à Dieu. « Crièrent vers » conserve à la fois l’urgence et la direction marquée par אֶל, tandis que « Yahweh » rend directement le nom divin.
- source_word: מַאֲפֵל
  choice: l’obscurité
  rationale: Le nom désigne l’obscurité ou les ténèbres. « L’obscurité » est naturel en français moderne et n’ajoute pas un degré d’intensité absent du terme lui-même.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: entre vous et les Égyptiens
  rationale: Cette traduction directe maintient la deuxième personne du pluriel par laquelle Josué associe rhétoriquement ses auditeurs à leurs ancêtres.
- source_word: וַיָּבֵא עָלָיו אֶת הַיָּם וַיְכַסֵּהוּ
  choice: Il fit venir la mer sur lui et le recouvrit
  rationale: Les deux suffixes hébreux sont masculins singuliers. Le français conserve ce singulier abrupt plutôt que de le remplacer silencieusement par un pluriel interprétatif; une note en explique la probable valeur collective.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: Vous avez vu de vos propres yeux
  rationale: L’hébreu mentionne explicitement les yeux des destinataires. La locution française naturelle « de vos propres yeux » en préserve l’emphase et le motif du témoignage direct.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: ce que j’ai fait en Égypte
  rationale: « En Égypte » rend simplement la préposition ב sans imposer la nuance possible « contre l’Égypte ».
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר יָמִים רַבִּים
  choice: vous avez vécu dans le désert pendant de nombreux jours
  rationale: « Avez vécu » exprime naturellement le séjour prolongé indiqué par ישב. « De nombreux jours » conserve l’expression hébraïque au lieu de l’expliciter en années ou de la réduire à « longtemps ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre, sans introduire une particularité confessionnelle supplémentaire.
- issue: Nombre des pronoms désignant l’adversaire égyptien
  choice: conserver le singulier « lui / le » dans le texte
  alternative: traduire collectivement par « eux / les », ou expliciter « les Égyptiens »
  rationale: Les suffixes de עָלָיו et וַיְכַסֵּהוּ sont singuliers, même si leur référent paraît collectif. Le maintien du singulier préserve la forme et l’ambiguïté du texte source; la note indique le sens collectif possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient à un discours narratif oral en français actuel. La syntaxe a été légèrement segmentée pour la clarté, tout en conservant les changements de personne du texte hébreu et le singulier inhabituel des pronoms.
