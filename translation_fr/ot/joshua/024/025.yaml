  text: וַ/יִּכְרֹ֨ת יְהוֹשֻׁ֧עַ בְּרִ֛ית לָ/עָ֖ם בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יָּ֥שֶׂם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט בִּ/שְׁכֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: fr
  text: Ce jour-là, Josué conclut une alliance[a] avec le peuple et, à Sichem, il établit pour eux une loi et une ordonnance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « coupa une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « un statut et un jugement » ou « une prescription et une règle de droit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: conclut une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance ». En français naturel, « conclure une alliance » rend clairement l’idiome tout en conservant sa portée solennelle et contraignante.
- source_word: לָעָם
  choice: avec le peuple
  rationale: Avec l’expression כרת ברית, la préposition ל introduit ici le peuple impliqué dans l’alliance. « Avec le peuple » est la formulation française naturelle, sans préciser davantage l’identité théologique des parties.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rendu temporel direct et idiomatique, placé en tête conformément à l’enchaînement du récit.
- source_word: וַיָּשֶׂם לוֹ
  choice: il lui donna
  rationale: שׂים est un verbe général signifiant « mettre, placer, établir ». Avec des dispositions juridiques, « donner » exprime naturellement leur promulgation; « lui » reprend le nom collectif singulier « le peuple ».
- source_word: חֹק
  choice: prescription
  rationale: חֹק désigne une disposition fixée ou prescrite. « Prescription » conserve ici la nuance normative et se distingue de מִשְׁפָּט.
- source_word: וּמִשְׁפָּט
  choice: et une règle de droit
  rationale: Dans ce contexte juridique, מִשְׁפָּט peut désigner une règle, une décision ou un ordre juridique. « Règle de droit » transmet cette portée sans réduire le mot à la justice abstraite.
- source_word: בִּשְׁכֶם
  choice: à Sichem
  rationale: Forme française usuelle du nom de lieu; aucune expansion telle que « là » n’est nécessaire, puisque l’hébreu indique simplement le lieu.
theological_decisions:
- issue: Nature de l’action d’alliance accomplie par Josué
  choice: Josué conclut une alliance avec le peuple
  alternative: Josué renouvela l’alliance pour le peuple
  rationale: Le verset présente Josué comme sujet de l’action et le peuple avec la préposition ל, sans expliciter ici toutes les parties de l’alliance. La traduction conserve cette formulation de surface et n’importe pas du contexte l’idée explicite d’un renouvellement.
- issue: Nature des dispositions données à Sichem
  choice: une prescription et une règle de droit
  alternative: une loi et une ordonnance / un statut et un jugement
  rationale: Les deux termes juridiques sont maintenus distincts sans leur attribuer une portée cultuelle, civile ou doctrinale plus précise que ne le permet ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit la progression de l’hébreu, tout en employant l’idiome français « conclure une alliance ». Le pronom collectif singulier « lui » reprend naturellement « le peuple ». Les deux termes juridiques sont rendus distinctement et leur ambiguïté sémantique est signalée en note.
