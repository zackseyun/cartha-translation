id: JOS.24.31
reference: Joshua 24:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: fr
  text: Israël servit Yahweh pendant toute la vie de Josué et pendant toute la vie des anciens qui survécurent à Josué et qui avaient connu toute l’œuvre[a] que Yahweh avait accomplie pour Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les actes de Yahweh ».
    reason: Le nom מַעֲשֶׂה peut être compris collectivement comme « œuvre » ou, selon le contexte, rendu au pluriel par « actes ».
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: servit
  rationale: Le verbe עבד, avec Yahweh comme objet, exprime le service et la fidélité d’alliance; « servit » conserve une portée plus large que le seul culte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כֹּל יְמֵי
  choice: pendant toute la vie de
  rationale: Cette formulation française naturelle rend l’expression temporelle hébraïque « tous les jours de » dans son sens contextuel.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Dans le cadre communautaire israélite, « les anciens » désigne naturellement des hommes reconnus par leur âge et leur autorité sans réduire le terme à l’une de ces seules dimensions.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: survécurent à Josué
  rationale: L’expression hébraïque évoque littéralement ceux qui prolongèrent leurs jours après Josué; « survécurent à Josué » en donne le sens idiomatique.
- source_word: יָדְעוּ
  choice: avaient connu
  rationale: Le plus-que-parfait situe leur connaissance personnelle des œuvres de Yahweh avant la période rétrospectivement décrite, sans préciser davantage la manière dont ils les avaient connues.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: toute l’œuvre de Yahweh
  rationale: מַעֲשֶׂה peut désigner l’œuvre, l’action ou les actes; le singulier collectif « toute l’œuvre » reste proche de la forme hébraïque et convient au contexte.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: avait accomplie pour Israël
  rationale: La préposition ל indique ici naturellement une action en faveur d’Israël; « accomplie pour Israël » exprime ce sens bénéfique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte emploie le tétragramme comme nom personnel. « Yahweh » le conserve sous une forme translittérée au lieu de le remplacer par un titre traditionnel.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique; les répétitions de « Josué » et de « Yahweh » sont conservées afin de respecter la structure et les référents explicites de l’hébreu.
