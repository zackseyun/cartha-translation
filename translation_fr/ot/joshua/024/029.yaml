  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: fr
  text: Après ces événements, Josué, fils de Noun, serviteur de Yahweh, mourut à l’âge de cent dix ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: La formule narrative situe simplement la mort de Josué après ce qui précède. En français moderne, « Après ces événements » exprime naturellement la valeur temporelle de l’hébreu sans reproduire lourdement « et il arriva ».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Forme française traditionnelle et largement reconnue du nom, suivie de la filiation hébraïque.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: עֶבֶד peut désigner un serviteur ou un esclave; ici, il s’agit d’un titre honorifique soulignant le service fidèle de Josué envers Yahweh.
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות signifie directement « mourir ». Le passé simple convient au registre narratif biblique soutenu tout en restant clair.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: à l’âge de cent dix ans
  rationale: Cette formulation française idiomatique rend exactement l’expression hébraïque de l’âge, littéralement « fils de cent dix ans ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin, le tétragramme. « Yahweh » le conserve comme nom plutôt que de lui substituer un titre.
- issue: Portée de עֶבֶד appliqué à Josué
  choice: serviteur
  alternative: esclave
  rationale: Bien que « esclave » soit lexicalement possible, le contexte emploie le mot comme titre honorifique de service envers Yahweh, sans mettre l’accent sur un statut social d’asservissement.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase évite le calque peu naturel « Et il arriva après ces choses »; le passé simple maintient la tenue littéraire du récit.
