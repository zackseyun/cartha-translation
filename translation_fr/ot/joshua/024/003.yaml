reference: Joshua 24:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: fr
  text: Puis j’ai pris Abraham, votre père, de l’autre côté du Fleuve[a], et je l’ai conduit à travers tout le pays de Canaan. J’ai multiplié sa descendance[b] et je lui ai donné Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Fleuve » désigne probablement l’Euphrate.
    reason: cultural_note
  - marker: b
    text: Ou « ses descendants » ; le mot hébreu traduit par « descendance » est un singulier collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Puis j’ai pris
  rationale: Le wayyiqtol qal à la première personne poursuit le récit des actes passés de Dieu. « Puis » exprime naturellement la succession narrative.
- source_word: אֲבִיכֶם אֶת־אַבְרָהָם
  choice: Abraham, votre père
  rationale: « Père » conserve l’expression ancestrale et covenantale de l’hébreu, plutôt que de l’expliciter par « ancêtre ».
- source_word: מֵעֵבֶר הַנָּהָר
  choice: de l’autre côté du Fleuve
  rationale: Cette formulation rend le sens spatial de עֵבֶר avec מִן. La majuscule signale l’emploi géographique conventionnel sans remplacer le terme hébreu par le nom propre « Euphrate ».
- source_word: וָאוֹלֵךְ אוֹתוֹ
  choice: et je l’ai conduit
  rationale: La forme hiphil de הלך a ici un sens causatif, rendu naturellement en français par « conduire ».
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: à travers tout le pays de Canaan
  rationale: « À travers » convient au contexte de déplacement et rend la préposition ב associée à l’ensemble du territoire.
- source_word: וָאַרְבֶּה אֶת־זַרְעוֹ
  choice: J’ai multiplié sa descendance
  rationale: Le hiphil de רבה exprime l’accroissement. « Descendance » rend naturellement le collectif singulier זֶרַע en français moderne.
- source_word: וָאֶתֶּן לוֹ אֶת־יִצְחָק
  choice: et je lui ai donné Isaac
  rationale: La construction française conserve Isaac comme don accordé par Dieu à Abraham.
theological_decisions:
- issue: Désignation ancestrale d’Abraham
  choice: Abraham, votre père
  alternative: Abraham, votre ancêtre
  rationale: Le texte hébreu dit explicitement « votre père ». Le maintien de cette formulation préserve sa force familiale et covenantale sans l’aplanir.
- issue: Identification du « Fleuve »
  choice: le Fleuve
  alternative: l’Euphrate
  rationale: L’hébreu emploie le nom commun défini « le fleuve », non le nom propre. L’identification probable est donc donnée en note plutôt qu’insérée dans le texte.
- issue: Portée de זַרְעוֹ
  choice: sa descendance
  alternative: ses descendants / sa postérité
  rationale: Le terme hébreu est un singulier collectif. « Descendance » en conserve la portée collective sans préciser artificiellement quels descendants sont visés.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement narratif hébreu tout en évitant une tournure artificielle. « Pays de Canaan » est retenu comme expression géographique française courante.
