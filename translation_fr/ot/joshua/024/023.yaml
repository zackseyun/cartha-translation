source:
  edition: WLC
  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: fr
  text: « Et maintenant, enlevez les dieux étrangers qui sont au milieu de vous, et tournez votre cœur vers Yahweh, le Dieu d’Israël. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la transition marquée par וְ et l’immédiateté de עַתָּה, dans un français naturel et soutenu.
- source_word: הָסִירוּ
  choice: enlevez
  rationale: L’impératif causatif signifie « ôter, enlever, écarter ». « Enlevez » exprime clairement l’ordre concret sans archaïsme.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: les dieux étrangers
  rationale: L’expression désigne les divinités étrangères, et non des dieux simplement étranges. Cette formulation est idiomatique en français.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: qui sont au milieu de vous
  rationale: בְּקִרְבְּכֶם situe ces dieux au sein du peuple. « Au milieu de vous » conserve cette image et évite une interprétation exclusivement intérieure.
- source_word: וְהַטּוּ
  choice: inclinez
  rationale: נטה signifie littéralement « incliner, pencher, orienter ». Avec « cœur » et אֶל, « inclinez » conserve la métaphore hébraïque de l’orientation volontaire.
- source_word: לְבַבְכֶם
  choice: votre cœur
  rationale: Le texte emploie un nom singulier avec un suffixe pluriel, donnant au peuple un cœur collectif. Le singulier français préserve cette force.
- source_word: אֶל יְהוָה
  choice: vers Yahweh
  rationale: אֶל marque la direction, d’où « vers ». Le nom divin est translittéré « Yahweh » afin de représenter explicitement le tétragramme.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement et naturellement le groupe construit qui identifie Yahweh comme le Dieu d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre, sans adopter la forme moins probable « Jéhovah ».
- issue: Nature du « cœur » du peuple
  choice: votre cœur, au singulier collectif
  alternative: vos cœurs
  rationale: Le singulier לְבַבְכֶם peut présenter l’allégeance intérieure commune du peuple. Le conserver évite de supprimer cette nuance, sans nier l’implication de chaque personne.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La formulation conserve les images concrètes de l’hébreu (« au milieu de vous », « inclinez votre cœur ») ainsi que le singulier collectif, tout en évitant un ton archaïque.
