id: JOS.24.2
reference: Joshua 24:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: fr
  text: 'Josué dit à tout le peuple : « Voici ce que dit Yahweh, le Dieu d’Israël : Autrefois, vos pères[b] habitaient au-delà du Fleuve[a] — Térah, père d’Abraham et père de Nahor —, et ils servaient d’autres dieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’autre côté du Fleuve »; il s’agit probablement de l’Euphrate.
    reason: cultural_note
  - marker: b
    text: Littéralement « vos pères », c’est-à-dire vos ancêtres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple convient au récit historique en français et rend naturellement la progression narrative du wayyiqtol.
- source_word: אֶל כָּל הָעָם
  choice: à tout le peuple
  rationale: עָם désigne ici l’ensemble de la communauté d’Israël réunie; « peuple » est précis et naturel.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle et digne rend la formule de messager sans donner à אָמַר une valeur temporelle indûment passée dans le discours divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription conserve le nom divin personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement le syntagme construit et son identification relationnelle.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: de l’autre côté du Fleuve
  rationale: Cette expression idiomatique conserve le point de vue géographique de l’hébreu sans introduire explicitement le nom « Euphrate » dans le texte.
- source_word: יָשְׁבוּ
  choice: habitaient
  rationale: Dans ce contexte, ישׁב décrit le lieu de résidence des ancêtres; « habitaient » est naturel et précis.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Le choix conserve la forme masculine explicite de l’hébreu; une note précise que le sens est celui des ancêtres.
- source_word: מֵעוֹלָם
  choice: Autrefois
  rationale: Ici, le terme renvoie à un passé ancien plutôt qu’à l’éternité; « autrefois » le communique sobrement.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: Térah, père d’Abraham et père de Nahor
  rationale: La répétition de « père » reproduit celle du texte hébreu tout en restant claire en français.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: Ils servaient d’autres dieux
  rationale: « Servir » garde la portée cultuelle de עבד sans réduire le sens au seul acte d’adoration.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription le distingue du titre אֲדֹנָי et évite de remplacer silencieusement le nom par un titre.
- issue: Portée de אֲבוֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: « Vos pères » reflète la forme masculine du texte source, tandis que la note conserve clairement sa portée généalogique plus large.
- issue: Nature du service rendu aux autres dieux
  choice: servaient d’autres dieux
  alternative: adoraient d’autres dieux
  rationale: Le verbe עבד peut désigner le service cultuel et donc l’adoration; « servaient » préserve toutefois la métaphore hébraïque et sa portée théologique sans la restreindre.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve la solennité de la formule divine sans archaïsmes. « Fleuve » prend une majuscule comme désignation conventionnelle d’un cours d’eau connu, l’identification probable à l’Euphrate étant réservée à la note.
