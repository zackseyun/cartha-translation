  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: fr
  text: 'Josué dit alors au peuple : « Vous êtes témoins contre vous-mêmes[a] que vous avez choisi Yahweh pour vous-mêmes, afin de le servir. » Ils répondirent : « Nous sommes témoins. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous êtes vos propres témoins », c’est-à-dire que vos propres paroles attestent votre choix.'
    reason: Alternative lexicale liée au sens de la préposition בְּ dans עֵדִים אַתֶּם בָּכֶם.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit ; « dit alors » exprime naturellement la succession en français.
- source_word: הָעָם
  choice: le peuple
  rationale: Dans ce contexte, עָם désigne le peuple assemblé auquel Josué s’adresse.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: Vous êtes témoins contre vous-mêmes
  rationale: Dans ce cadre d’engagement solennel, la préposition בְּ peut indiquer que leur propre témoignage pourra leur être opposé. La note conserve l’autre compréhension possible.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce dont ils sont témoins.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: vous avez choisi
  rationale: Le passé composé convient au choix récemment formulé et toujours engageant. Le pronom לָכֶם souligne que ce choix est le leur ; en français, cette nuance ressort déjà de « contre vous-mêmes » et de la construction personnelle, tandis que « choisi pour vous-mêmes Yahweh » serait peu naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: לַעֲבֹד אֹתוֹ
  choice: pour le servir
  rationale: עבד exprime le service et l’allégeance, avec une dimension cultuelle possible ; « servir » en préserve l’étendue.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: 'Ils répondirent : « Nous en sommes témoins. »'
  rationale: Le verbe « répondirent » rend naturellement la réplique dans le dialogue. L’hébreu elliptique « témoins » exige en français une proposition complète ; « en » renvoie au choix qui vient d’être énoncé.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa translittération préserve cette donnée sans lui substituer un titre.
- issue: Portée juridique de עֵדִים אַתֶּם בָּכֶם
  choice: témoins contre vous-mêmes
  alternative: témoins pour vous-mêmes / vos propres témoins
  rationale: Le contexte d’alliance donne aux paroles du peuple une valeur de témoignage susceptible de lui être opposé, mais la construction hébraïque permet aussi de comprendre que ses propres paroles attestent son choix ; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste solennel sans archaïsmes ; la formulation conserve la tonalité d’engagement juridique et religieux.
