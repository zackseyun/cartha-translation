    issue: La nuance de לָכֶם est absente de la traduction principale.
    rationale: Le texte dit littéralement que le peuple a choisi Yahweh « pour lui-même ». Le français peut l’exprimer par « pour vous-mêmes » sans altérer le sens ni alourdir excessivement la phrase.
  - severity: low
    issue: L’ancre de note est placée après « peuple », alors que la note porte sur « témoins contre vous-mêmes ».
    rationale: L’ancre doit être rattachée à l’expression commentée afin que le lecteur identifie sans ambiguïté l’alternative lexicale.
  - severity: low
    issue: « Nous en sommes témoins » explicite davantage le référent que la réponse elliptique hébraïque.
    rationale: « Nous sommes témoins » demeure idiomatique en français tout en reflétant plus directement עֵדִים.
