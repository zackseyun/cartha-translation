  verdict: revise
  source_fidelity: La traduction rend correctement la progression narrative, le cadre de témoignage solennel, le nom divin « Yahweh » et l’infinitif de service. Toutefois, elle omet la nuance explicite de לָכֶם (« pour vous-mêmes / pour votre propre compte ») dans « vous avez choisi Yahweh ». Cette nuance doit être conservée, même si elle est moins idiomatique en français que dans l’hébreu.
  naturalness: Le français est clair, moderne et d’un registre convenant à une déclaration d’alliance. « Nous en sommes témoins » est naturel, mais « Nous sommes témoins » reproduit plus directement l’ellipse hébraïque sans imposer un antécédent supplémentaire à « en ».
  terminology: « Yahweh », « servir » et « témoins contre vous-mêmes » sont appropriés. La note doit rester explicitement liée à l’expression ambiguë « témoins contre vous-mêmes », et non à « le peuple ».
  issues:
