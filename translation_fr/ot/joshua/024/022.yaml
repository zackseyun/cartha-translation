  to: 'Josué dit alors au peuple : « Vous êtes témoins contre vous-mêmes[a] que vous avez choisi Yahweh pour vous-mêmes, afin de le servir. » Ils répondirent : « Nous sommes témoins. »'
  rationale: La révision rétablit « pour vous-mêmes », qui correspond à לָכֶם, déplace l’ancre vers l’expression effectivement commentée et rend la réponse finale de façon plus proche de l’ellipse hébraïque. L’ambiguïté de la construction « témoins contre vous-mêmes » est conservée en note, sans privilégier indûment une lecture confessionnelle.
