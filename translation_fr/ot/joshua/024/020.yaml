id: JOS.24.20
reference: Joshua 24:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: fr
  text: Si vous abandonnez Yahweh et servez des dieux étrangers, il se retournera contre vous, vous fera du mal[a] et vous anéantira[b], après vous avoir fait du bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fera venir le malheur sur vous ». Le verbe hébreu désigne ici le tort ou le malheur causé, et non un mal moral commis par Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous détruira ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cet avertissement, la conjonction introduit la condition dont les conséquences sont ensuite énoncées.
- source_word: תַעַזְבוּ
  choice: vous abandonnez
  rationale: « Abandonner » exprime naturellement en français la rupture d’alliance et d’attachement visée par le verbe עזב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: וַעֲבַדְתֶּם
  choice: et servez
  rationale: Le verbe עבד désigne ici le service religieux rendu à des divinités, tout en gardant son sens direct de « servir ».
- source_word: אֱלֹהֵי נֵכָר
  choice: des dieux étrangers
  rationale: Cette expression naturelle désigne les divinités étrangères à Israël et à son alliance avec Yahweh.
- source_word: וְשָׁב
  choice: il se retournera contre vous
  rationale: Le verbe שוב marque un renversement dans l’action favorable de Yahweh. L’ajout idiomatique « contre vous » explicite en français la direction hostile donnée par les verbes suivants sans supprimer l’image du retournement.
- source_word: וְהֵרַע לָכֶם
  choice: vous fera du mal
  rationale: Le hiphil de רעה signifie ici causer du tort ou un malheur, sans impliquer que Dieu commette un mal moral.
- source_word: וְכִלָּה אֶתְכֶם
  choice: et vous anéantira
  rationale: כלה exprime l’action de mener à son terme jusqu’à la destruction. « Anéantir » restitue clairement la gravité de la menace en français moderne.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: après vous avoir fait du bien
  rationale: Cette tournure française naturelle conserve le contraste entre les bienfaits antérieurs de Yahweh et le jugement annoncé.
theological_decisions:
- issue: Le jugement divin après les bienfaits accordés
  choice: Yahweh est présenté comme renversant directement son action favorable et infligeant le jugement en réponse à l’apostasie.
  alternative: Présenter le malheur uniquement comme la conséquence naturelle de l’idolâtrie.
  rationale: Les verbes hébreux attribuent directement l’action nuisible et destructrice à Yahweh. La traduction préserve cette tension théologique sans atténuer son rôle ni imposer un système doctrinal ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la structure condition-conséquence du texte hébreu. « Yahweh » préserve le nom divin; « se retournera contre vous » rend idiomatiquement le renversement exprimé par שוב.
