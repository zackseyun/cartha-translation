  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: fr
  text: 'Josué dit au peuple : « Vous ne pourrez pas servir Yahweh, car il est un Dieu saint[a], un Dieu jaloux. Il ne pardonnera ni vos révoltes ni vos péchés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, les mots traduits par « Dieu » et « saint » ont une forme plurielle, mais le pronom rendu par « il » est singulier ; la phrase désigne donc le Dieu unique d’Israël.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Il ne portera pas vos révoltes et vos péchés » ; ou : « Il n’enlèvera pas vos révoltes et vos péchés ». Cette expression hébraïque peut signifier pardonner les fautes.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: vous ne pourrez pas
  rationale: Le verbe יכל exprime la capacité. Le futur français correspond naturellement à la forme hébraïque et présente ici l’incapacité du peuple à servir Yahweh dans les conditions évoquées.
- source_word: לַעֲבֹד
  choice: servir
  rationale: עבד englobe le service dû à Yahweh, y compris le culte, sans se limiter aux actes cultuels.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu au lieu de le remplacer par un titre.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: il est un Dieu saint
  rationale: Bien que le nom et l’adjectif aient une morphologie plurielle, le pronom הוּא est singulier et désigne le Dieu unique d’Israël. Le français exige donc ici le singulier.
- source_word: אֵל קַנּוֹא
  choice: un Dieu jaloux
  rationale: קַנּוֹא exprime l’exigence d’une fidélité exclusive et le refus de toute allégeance rivale; « jaloux » préserve cette dimension relationnelle et d’alliance.
- source_word: לֹא יִשָּׂא
  choice: il ne pardonnera pas
  rationale: נשא employé avec les fautes et les péchés est une expression hébraïque courante pour enlever la faute, donc pardonner. La note conserve l’image littérale.
- source_word: פִשְׁעֲכֶם
  choice: vos révoltes
  rationale: פשע désigne particulièrement la rébellion ou la rupture d’allégeance; « révoltes » maintient cette nuance d’insoumission.
- source_word: חַטֹּאותֵיכֶם
  choice: vos péchés
  rationale: חטאת est le terme courant pour le péché; « péchés » en est l’équivalent direct et naturel.
theological_decisions:
- issue: Morphologie plurielle de אֱלֹהִים קְדֹשִׁים avec un pronom singulier
  choice: 'Traduire au singulier : « il est un Dieu saint »'
  alternative: Reproduire littéralement les formes plurielles
  rationale: Le pronom singulier הוּא et le contexte identifient clairement un seul référent. Un pluriel français suggérerait à tort plusieurs dieux; la particularité grammaticale est néanmoins signalée en note.
- issue: Sens de לֹא יִשָּׂא appliqué aux révoltes et aux péchés
  choice: Rendre l’expression par « il ne pardonnera pas »
  alternative: « il ne portera pas » ou « il n’emportera pas »
  rationale: Avec un objet désignant la faute, נשא fonctionne idiomatiquement au sens de pardonner. La traduction exprime ce sens sans effacer l’image source, donnée en note.
translation_notes:
  register: Français moderne, clair et digne. « Servir » conserve l’ampleur du service d’alliance; « révoltes » distingue פשע du terme plus général rendu par « péchés ». La formulation garde la dureté de l’avertissement de Josué sans l’atténuer ni l’expliquer théologiquement.
