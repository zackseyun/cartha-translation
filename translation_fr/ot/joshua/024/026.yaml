  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: fr
  text: Josué écrivit ces paroles dans le livre de la loi de Dieu. Puis il prit une grande pierre et la dressa là, sous le térébinthe[a] qui se trouvait dans le sanctuaire de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous le chêne ». Le terme hébreu peut aussi désigner un chêne.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui se trouvait près du sanctuaire de Yahweh ». Dans ce contexte, la préposition hébraïque peut avoir un sens spatial plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: écrivit
  rationale: Le verbe כתב signifie directement « écrire » ; ce choix conserve ici le caractère documentaire de l’action.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: דברים peut désigner des paroles, des choses ou des affaires. Dans ce contexte où Josué consigne les déclarations de l’alliance, « ces paroles » convient le mieux.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: dans le livre de la loi de Dieu
  rationale: « Livre » est naturel en français tout en pouvant désigner le document sous forme de rouleau ; « loi » rend תורה dans ce contexte d’alliance sans effacer son sens plus large d’instruction.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: il prit une grande pierre
  rationale: Cette formulation rend simplement la taille physique indiquée par גְּדוֹלָה.
- source_word: וַיְקִימֶהָ
  choice: la dressa
  rationale: La forme causative de קום indique que Josué fit tenir la pierre debout, vraisemblablement comme pierre commémorative.
- source_word: תַּחַת הָאַלָּה
  choice: sous le térébinthe
  rationale: אַלָּה désigne probablement un térébinthe, même si son identification comme chêne est également traditionnelle ; l’alternative est signalée en note.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: dans le sanctuaire de Yahweh
  rationale: מִקְדָּשׁ désigne un lieu saint ou sanctuaire, et la préposition בְּ a normalement ici le sens de « dans ». Le sens spatial plus lâche « près de » reste possible et figure en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin personnel est translittéré afin de le distinguer d’un titre tel que « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve comme nom plutôt que de lui substituer un titre.
- issue: Emplacement de l’arbre par rapport au sanctuaire
  choice: qui se trouvait dans le sanctuaire de Yahweh
  alternative: qui se trouvait près du sanctuaire de Yahweh
  rationale: La préposition hébraïque בְּ signifie normalement « dans », et la proposition relative décrit le plus naturellement l’emplacement de l’arbre dans l’enceinte sacrée. Un sens spatial plus lâche demeure toutefois possible.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu sans lourdeur ; « Puis » clarifie la succession narrative. « Térébinthe » privilégie l’identification botanique probable, tandis que la note conserve l’appellation traditionnelle « chêne ».
