source:
  edition: WLC
  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: fr
  text: 'Mais si vous trouvez mauvais[a] de servir Yahweh, choisissez aujourd’hui qui vous servirez : les dieux que vos pères servaient de l’autre côté du Fleuve[b], ou les dieux des Amorites dont vous habitez le pays. Quant à moi et à ma maison[c], nous servirons Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « si servir Yahweh vous paraît mauvais » ou « si cela vous déplaît »; littéralement : « si c’est mauvais à vos yeux ».'
    reason: lexical_alternative
  - marker: b
    text: Le « Fleuve » désigne l’Euphrate.
    reason: cultural_note
  - marker: c
    text: 'Ou « mon foyer »; littéralement : « ma maison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע בְּעֵינֵיכֶם
  choice: vous trouvez mauvais
  rationale: Cette tournure française naturelle conserve l’idée d’une appréciation négative exprimée par l’idiome hébreu « mauvais à vos yeux », sans en durcir artificiellement le sens.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / נַעֲבֹד
  choice: servir / servirons
  rationale: « Servir » préserve la répétition du même verbe hébreu et son sens large d’allégeance religieuse, qui inclut le culte sans s’y limiter.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin dans le cadre éditorial demandé, plutôt que substitution par un titre.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם אֶת מִי תַעֲבֹדוּן
  choice: choisissez aujourd’hui qui vous voulez servir
  rationale: Formulation française idiomatique qui maintient l’impératif, l’urgence d’« aujourd’hui » et la décision personnelle indiquée par לָכֶם.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: que vos pères servaient
  rationale: Rend explicitement le masculin אֲבוֹתֵיכֶם et conserve le lien ancestral, tandis que l’imparfait convient à la pratique passée.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: de l’autre côté du Fleuve
  rationale: Expression géographique française claire; la majuscule signale que « le Fleuve » désigne ici l’Euphrate.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: dont vous habitez le pays
  rationale: Rend naturellement en français la situation présente décrite par le participe hébreu, sans lourdeur.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: Quant à moi et à ma maison
  rationale: « Quant à moi » exprime le contraste emphatique; « ma maison » conserve l’image hébraïque et peut désigner l’ensemble du foyer.
theological_decisions:
- issue: Sens religieux du verbe עבד
  choice: servir
  alternative: adorer / rendre un culte
  rationale: Le verbe articule ici service, culte et allégeance. « Servir » garde cette amplitude et la répétition rhétorique du texte.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte un nom propre; sa translittération le distingue d’un titre tout en évitant de substituer une tradition confessionnelle particulière.
- issue: Portée de בֵּיתִי
  choice: ma maison
  alternative: mon foyer / les gens de ma maison
  rationale: Le choix maintient l’expression collective et patriarcale du texte sans préciser davantage que l’hébreu la composition ou les modalités de l’engagement du foyer.
- issue: Formule רַע בְּעֵינֵיכֶם
  choice: vous trouvez mauvais
  alternative: cela est mauvais à vos yeux / cela vous déplaît
  rationale: Le choix conserve le jugement attribué aux auditeurs sans décider s’il s’agit d’un jugement moral (« mauvais ») ou d’une répugnance (« déplaisant »).
translation_notes:
  register: Français international actuel, digne et oralement fluide. Le rythme conserve l’opposition entre le choix proposé au peuple et la déclaration résolue de Josué. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
