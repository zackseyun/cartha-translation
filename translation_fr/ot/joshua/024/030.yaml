  text: וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת סֶ֖רַח אֲשֶׁ֣ר בְּ/הַר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: fr
  text: Ils l’ensevelirent dans le territoire de son héritage[a], à Timnath-Sérah, dans la région montagneuse d’Éphraïm, au nord du mont Gaash.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la frontière de son héritage ». Le terme hébreu peut désigner soit une limite, soit le territoire qu’elle délimite ; ici, il désigne probablement le territoire attribué à Josué.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Ils l’ensevelirent
  rationale: Le wayyiqtol poursuit le récit, tandis que אֹתוֹ fournit l’objet masculin singulier. « Ensevelir » exprime naturellement et dignement la mise au tombeau en français.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: dans le territoire de son héritage
  rationale: גְּבוּל peut désigner une frontière ou le territoire qu’elle délimite. Dans ce contexte géographique, « territoire » est le sens le plus naturel, tandis que « héritage » conserve la portée foncière de נַחֲלָה.
- source_word: בְּתִמְנַת סֶרַח
  choice: à Timnath-Sérah
  rationale: La préposition locative est rendue idiomatiquement par « à » devant le nom de lieu, translittéré en français.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: הַר désigne ici la région de collines ou montagneuse d’Éphraïm plutôt qu’un sommet isolé. En français, l’apposition sans reprise explicite de אֲשֶׁר est fluide et fidèle à sa fonction descriptive.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: au nord du mont Gaash
  rationale: La construction indique la position relative de Timnath-Sérah par rapport au mont Gaash.
