base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: fr
  text: Puis Josué rassembla toutes les tribus d’Israël à Sichem[a]. Il convoqua les anciens d’Israël, ses chefs[b], ses juges et ses officiers. Ils se présentèrent devant Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme hébraïque est directionnelle, littéralement : « vers Sichem ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « ses dirigeants ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « devant Dieu »; dans ce contexte, l’expression peut impliquer qu’ils se présentent dans un sanctuaire ou sur un lieu sacré lié à l’alliance.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: rassembla
  rationale: Dans ce contexte narratif, אָסַף désigne l’action de réunir des personnes. « Rassembla » est naturel en français et conserve ce sens concret.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: les tribus d’Israël
  rationale: « Tribus » est le terme français courant et exact pour les groupes constitutifs d’Israël dans ce contexte national.
- source_word: שְׁכֶמָה
  choice: à Sichem
  rationale: Le hé directionnel indique un mouvement vers Sichem. En français, « rassembler à Sichem » exprime naturellement le lieu où l’assemblée est réunie; la nuance directionnelle est signalée en note.
- source_word: וַיִּקְרָא לְ
  choice: convoqua
  rationale: קרא avec ל signifie ici faire venir officiellement les responsables désignés. « Convoqua » convient au caractère formel de l’assemblée.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Rendu consacré et exact du groupe de responsables reconnu sous ce titre.
- source_word: רָאשָׁיו
  choice: ses chefs
  rationale: Le suffixe masculin singulier renvoie collectivement à Israël. « Chefs » conserve l’image de la tête tout en désignant naturellement des responsables en français.
- source_word: שֹׁפְטָיו
  choice: ses juges
  rationale: Titre civique et judiciaire direct dans ce contexte.
- source_word: שֹׁטְרָיו
  choice: ses officiers
  rationale: שֹׁטֵר désigne des agents chargés de fonctions administratives. « Officiers » est un équivalent biblique français établi sans préciser excessivement leur fonction.
- source_word: וַיִּתְיַצְּבוּ
  choice: Ils se présentèrent
  rationale: La forme hitpael exprime le fait de prendre place ou de comparaître dans un cadre formel. « Se présentèrent » rend bien cette nuance cérémonielle.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: devant Dieu
  rationale: L’hébreu nomme explicitement Dieu et non YHWH ni le sanctuaire. Le rendu direct préserve la formulation du texte.
theological_decisions:
- issue: Sens de לִפְנֵי הָאֱלֹהִים dans le cadre d’une assemblée d’alliance
  choice: devant Dieu
  alternative: devant le sanctuaire de Dieu
  rationale: Le texte hébreu dit littéralement « devant Dieu ». Il peut sous-entendre une comparution dans un lieu sacré, mais cette précision ne doit pas être introduite dans le corps du texte; elle est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée en trois unités pour une lecture naturelle, sans modifier la progression du récit. Les titres institutionnels sont conservés distinctement et aucun cadre cultuel non explicite n’est ajouté au texte principal.
