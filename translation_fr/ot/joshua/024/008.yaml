  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: fr
  text: Puis je vous ai amenés dans le pays des Amorites, qui habitaient de l’autre côté du Jourdain. Ils vous ont fait la guerre, et je les ai livrés entre vos mains. Vous avez pris possession de leur pays, et je les ai détruits devant vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: Puis je vous ai conduits
  rationale: Le hiphil de בוא exprime ici le fait de faire venir ou d’amener. « Conduire » rend naturellement en français l’action divine qui mène Israël jusque dans le territoire, tandis que « puis » marque la progression du récit portée par le waw.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: dans le pays des Amorites
  rationale: אֶל indique ici l’entrée dans le territoire. Le singulier collectif hébreu הָאֱמֹרִי se rend naturellement par le nom de peuple au pluriel en français.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: qui habitaient de l’autre côté du Jourdain
  rationale: Le participe ישב décrit les Amorites comme habitants de cette région. « De l’autre côté du Jourdain » conserve le repère spatial du texte sans préciser artificiellement une direction.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: Ils vous ont fait la guerre
  rationale: לחם avec אֵת exprime ici un engagement hostile. Cette formulation française est claire et idiomatique, contrairement à « ils ont combattu avec vous », qui suggérerait normalement qu’ils étaient leurs alliés.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: je les ai livrés entre vos mains
  rationale: נתן ביד est un idiome signifiant livrer quelqu’un au pouvoir d’un autre. « Entre vos mains » conserve l’image hébraïque tout en restant immédiatement compréhensible.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: Vous avez pris possession de leur pays
  rationale: ירש peut désigner l’héritage, la possession ou la dépossession. Dans ce contexte de victoire et d’occupation du territoire, « prendre possession » exprime précisément le résultat sans ajouter une nuance absente du passage.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: je les ai détruits devant vous
  rationale: שמד porte le sens fort de destruction et ne doit pas être atténué. « Devant vous » conserve l’expression spatiale מִפְּנֵיכֶם et l’idée que Dieu les enlève de la présence d’Israël.
theological_decisions:
- issue: La force du langage relatif à la conquête
  choice: 'Conserver la parole divine directe et les verbes forts : « je les ai livrés entre vos mains […] je les ai détruits »'
  alternative: Employer des formulations atténuées telles que « je les ai vaincus » ou « je les ai chassés »
  rationale: Le texte attribue explicitement à Dieu la remise des Amorites au pouvoir d’Israël et leur destruction. La traduction préserve cette tension théologique sans l’adoucir ni l’amplifier.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient au discours rétrospectif direct. Les formulations idiomatiques françaises évitent les contresens tout en maintenant les images hébraïques encore naturelles, notamment « entre vos mains » et « devant vous ».
