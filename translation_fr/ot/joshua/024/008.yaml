revisions:
- from: Puis je vous ai conduits dans le pays des Amorites, qui habitaient de l’autre côté du Jourdain. Ils vous ont fait la guerre, mais je les ai livrés entre vos mains. Vous avez pris possession de leur pays, et je les ai détruits devant vous.
  to: Puis je vous ai amenés dans le pays des Amorites, qui habitaient de l’autre côté du Jourdain. Ils vous ont fait la guerre, et je les ai livrés entre vos mains. Vous avez pris possession de leur pays, et je les ai détruits devant vous.
  rationale: La révision supprime le contraste ajouté par « mais » et remplace « conduits » par « amenés », plus proche du hiphil de בוא. Elle conserve le langage explicite de guerre et de destruction, ainsi que l’ambiguïté géographique de « de l’autre côté du Jourdain ».
  reviewer_model: gpt-5.6-terra
