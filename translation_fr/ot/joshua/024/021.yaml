  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: fr
  text: 'Mais le peuple dit à Josué : « Non ! C’est Yahweh que nous servirons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר introduit ici le discours direct ; le passé simple convient au registre narratif français.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne la communauté d’Israël rassemblée dans le cadre du renouvellement de l’alliance.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: à Josué
  rationale: אֶל marque le destinataire de la parole, et יְהוֹשֻׁעַ reçoit sa forme française usuelle.
- source_word: לֹא כִּי
  choice: Non ! C’est… que
  rationale: 'Après la négation énergique, כִּי introduit une correction affirmative. La construction clivée rend naturellement en français le contraste : loin de refuser, le peuple affirme son choix.'
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת marque le complément d’objet direct et n’est pas traduit séparément ; le tétragramme est rendu par le nom divin Yahweh.
- source_word: נַעֲבֹד
  choice: nous servirons
  rationale: L’imparfait qal à la première personne du pluriel exprime ici l’engagement du peuple. « Servir » conserve les dimensions d’obéissance, d’allégeance et de culte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le caractère propre du nom d’alliance sans le remplacer par un titre.
- issue: Portée de עבד dans le contexte de l’alliance
  choice: servir
  alternative: adorer
  rationale: « Servir » maintient l’étendue sémantique du verbe, qui comprend le culte mais aussi l’obéissance et la fidélité d’alliance ; « adorer » en réduirait la portée.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase clivée « C’est Yahweh que… » exprime clairement la valeur corrective de לֹא כִּי sans introduire un connecteur français maladroit.
