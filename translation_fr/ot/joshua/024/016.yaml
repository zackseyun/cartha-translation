source:
  edition: WLC
  text: וַ/יַּ֤עַן הָ/עָם֙ וַ/יֹּ֔אמֶר חָלִ֣ילָ/ה לָּ֔/נוּ מֵ/עֲזֹ֖ב אֶת יְהוָ֑ה לַ/עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: fr
  text: 'Le peuple répondit : « Loin de nous l’idée d’abandonner Yahweh pour servir d’autres dieux ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: Le peuple répondit
  rationale: En hébreu narratif, la combinaison littérale « répondit et dit » introduit la prise de parole. En français moderne, « répondit » rend naturellement l’ensemble sans lourdeur.
- source_word: חָלִילָה לָּנוּ
  choice: Loin de nous l’idée de
  rationale: Cette tournure française exprime une répudiation énergique sans ajouter une mention de Dieu absente de l’expression hébraïque.
- source_word: מֵעֲזֹב
  choice: d’abandonner
  rationale: Dans ce contexte d’alliance, עזב désigne l’abandon d’une fidélité ou d’un engagement ; « abandonner » en conserve la force en français courant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לַעֲבֹד
  choice: pour servir
  rationale: עבד appliqué à une divinité englobe le culte et l’allégeance. « Servir » préserve cette étendue de sens ; la construction française « abandonner… pour servir » exprime ici le passage implicite d’une fidélité à une autre.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe de l’expression, sans ajouter la nuance « étrangers », qui n’est pas explicitement portée par אֲחֵרִים.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Force idiomatique de חָלִילָה
  choice: Loin de nous l’idée de
  alternative: À Dieu ne plaise que nous
  rationale: L’hébreu marque un rejet catégorique, mais ne nomme pas explicitement Dieu. Le choix retenu conserve l’intensité sans explicitation théologique ajoutée.
- issue: Rapport entre abandonner Yahweh et servir d’autres dieux
  choice: abandonner Yahweh pour servir d’autres dieux
  alternative: abandonner Yahweh et servir d’autres dieux
  rationale: La préposition ל introduit « servir » et permet une lecture de finalité ou de résultat. En français, « pour servir » rend clairement le remplacement d’allégeance tout en gardant le lien syntaxique du texte.
translation_notes:
  register: Français international moderne, courant et digne. La formule exclamative restitue la vigueur de la réponse collective. La redondance hébraïque « répondit et dit » est allégée selon l’usage naturel du français.
