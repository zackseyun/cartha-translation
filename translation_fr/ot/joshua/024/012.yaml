  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: fr
  text: J’ai envoyé devant vous le frelon[a], et il les a chassés loin de vous — les deux rois amorites. Ce n’était ni par ton épée ni par ton arc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être une expression figurée désignant la panique ou la terreur envoyée par Dieu, plutôt qu’une mention littérale de frelons.
    reason: Alternative lexicale et interprétative pour הַצִּרְעָה.
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: J’ai envoyé
  rationale: Le wayyiqtol qal à la première personne du singulier rapporte l’action passée de YHWH; le passé composé convient naturellement au récit oral en français moderne.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: L’expression signifie littéralement « devant votre face » et indique ici que les frelons précèdent Israël.
- source_word: הַצִּרְעָה
  choice: les frelons
  rationale: Le nom désigne le frelon; le singulier hébreu avec article peut avoir une valeur collective. Le pluriel français exprime naturellement cette valeur sans substituer au terme concret une interprétation métaphorique.
- source_word: וַתְּגָרֶשׁ אוֹתָם מִפְּנֵיכֶם
  choice: qui les ont chassés loin de vous
  rationale: גרשׁ signifie « chasser, expulser ». « Loin de vous » rend explicitement le mouvement d’éloignement porté par מִן, tout en restant idiomatique.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: ainsi que les deux rois des Amorites
  rationale: Le groupe nominal hébreu est conservé. « Ainsi que » rattache les deux rois au pronom « les » comme une précision appositive et évite de suggérer que les rois seraient un troisième groupe distinct.
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: Ce n’était ni par ton épée ni par ton arc
  rationale: La préposition ב est instrumentale. La tournure française met en relief que la victoire ne résultait pas des armes d’Israël et conserve le passage du « vous » collectif au « ton » singulier du texte hébreu.
theological_decisions:
- issue: Faut-il comprendre הַצִּרְעָה littéralement ou comme une image de la panique envoyée par Dieu ?
  choice: Conserver le sens lexical concret « les frelons » dans le texte principal.
  alternative: Traduire de manière interprétative par « la panique » ou « la terreur ».
  rationale: Le contexte affirme clairement l’action souveraine de Dieu, mais n’impose pas de remplacer le nom concret par son interprétation possible. Une note conserve l’ambiguïté sans la résoudre dans le texte.
- issue: Alternance entre la deuxième personne du pluriel et du singulier
  choice: Conserver « vous » puis « ton ».
  alternative: Uniformiser tout le verset au pluriel pour désigner Israël collectivement.
  rationale: 'L’alternance existe dans l’hébreu : לִפְנֵיכֶם et מִפְּנֵיכֶם sont pluriels, tandis que חַרְבְּךָ et קַשְׁתֶּךָ sont singuliers. La préserver maintient la tension entre les membres du peuple et Israël envisagé comme une unité.'
translation_notes:
  register: Français international moderne, courant et digne. « Frelons » est plus naturel en français que le singulier collectif « le frelon ». La syntaxe préserve l’insistance finale sur l’origine divine de la victoire ainsi que l’alternance hébraïque entre adresse plurielle et singulière.
