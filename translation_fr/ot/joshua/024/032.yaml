  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: fr
  text: Quant aux ossements de Joseph, que les fils d’Israël avaient fait monter d’Égypte, ils les enterrèrent à Sichem, dans la parcelle du champ[a] que Jacob avait achetée aux fils de Hamor, père de Sichem[b], pour cent qesitas[c] ; et ils devinrent un héritage pour les fils de Joseph[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portion du terrain ». Le terme hébreu désigne une parcelle ou une part de terre.
    reason: lexical_alternative
  - marker: b
    text: Ou peut-être « ancêtre principal de Sichem » ou « fondateur de Sichem », si « père » est employé dans un sens plus large.
    reason: lexical_alternative
  - marker: c
    text: La qesita était une ancienne unité de valeur ou de monnaie dont l’équivalent exact est inconnu.
    reason: cultural_note
  - marker: d
    text: 'L’hébreu porte littéralement un verbe au pluriel : « ils devinrent ». Ce pluriel peut renvoyer aux ossements ; en raison du contexte foncier, certains comprennent toutefois que la parcelle devint l’héritage des fils de Joseph.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַצְמוֹת
  choice: ossements
  rationale: Le terme hébreu désigne concrètement les os. « Ossements » est naturel et digne en français dans un contexte funéraire, tout en maintenant le lien avec la tradition concernant Joseph.
- source_word: הֶעֱלוּ
  choice: avaient fait monter
  rationale: Le hifil de עלה signifie « faire monter » ou « amener en montant ». Le plus-que-parfait marque l’antériorité du transport depuis l’Égypte par rapport à l’ensevelissement.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et identitaire de l’hébreu. Elle reste intelligible en français moderne sans la réduire au seul ethnonyme « Israélites ».
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: dans la parcelle du champ
  rationale: חֶלְקָה désigne une portion ou une parcelle de terrain. « Parcelle du champ » rend clairement l’idée foncière sans précision ajoutée.
- source_word: קָנָה
  choice: avait achetée
  rationale: Dans ce contexte de prix payé, « acheter » exprime plus précisément l’acquisition que le verbe plus général « acquérir ». Le plus-que-parfait situe cet achat avant l’ensevelissement.
- source_word: בְּנֵי חֲמוֹר
  choice: aux fils de Hamor
  rationale: La traduction conserve littéralement le lien de filiation exprimé par l’hébreu, sans le remplacer par l’interprétation plus large « descendants ».
- source_word: אֲבִי שְׁכֶם
  choice: père de Sichem
  rationale: C’est le sens direct de la construction hébraïque. Une note signale que « père » peut éventuellement avoir un sens ancestral ou fondateur plus large.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: pour cent qesitas
  rationale: קְשִׂיטָה est une unité ancienne de valeur dont l’équivalent précis est inconnu. La translittération évite une conversion moderne trompeuse.
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: et ils devinrent un héritage pour les fils de Joseph
  rationale: Le verbe hébreu est au pluriel. Le français conserve ce nombre et laisse « ils » renvoyer naturellement aux ossements, tout en signalant en note l’incertitude possible concernant le référent dans le contexte foncier.
theological_decisions:
- issue: Expression d’identité בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix maintient la dimension familiale et collective de l’expression hébraïque sans lui imposer une interprétation confessionnelle particulière.
- issue: Référent du pluriel וַיִּהְיוּ dans la proposition finale
  choice: 'maintien du pluriel : « ils devinrent un héritage »'
  alternative: « la parcelle devint un héritage »
  rationale: Le pluriel grammatical s’accorde naturellement avec « les ossements », mais le contexte de propriété foncière peut inciter à comprendre la parcelle comme héritage. Le texte principal préserve la forme hébraïque et la note expose l’ambiguïté au lieu de la résoudre silencieusement.
- issue: Nature de la קְשִׂיטָה
  choice: translittération « qesita »
  alternative: « pièce d’argent » ou autre équivalent monétaire
  rationale: L’unité et sa valeur exacte sont incertaines. La translittération évite une précision historique ou économique non démontrable.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « enterrèrent / Ils les enterrèrent » découle de la mise en avant hébraïque des ossements, mais elle a été structurée pour rendre explicite le sujet. Les noms propres suivent les formes françaises usuelles « Joseph », « Sichem », « Jacob » et « Hamor ». La translittération « qesita » est francisée au pluriel en « qesitas ».
