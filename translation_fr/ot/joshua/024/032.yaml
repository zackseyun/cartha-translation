  to: Quant aux ossements de Joseph, que les fils d’Israël avaient fait monter d’Égypte, ils les enterrèrent à Sichem, dans la parcelle du champ[a] que Jacob avait achetée aux fils de Hamor, père de Sichem[b], pour cent qesitas[c] ; et ils devinrent un héritage pour les fils de Joseph[d].
