  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: fr
  text: Mais je n’ai pas voulu écouter Balaam, et il vous a bel et bien bénis[a] ; je vous ai délivrés de sa main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une tournure intensive, littéralement : « bénir, il vous a bénis ».'
    reason: La note signale la construction emphatique du verbe et de l’infinitif absolu apparenté, sans lui attribuer le sens de répétition ni de simultanéité.
lexical_decisions:
- source_word: אָבִיתִי
  choice: je n’ai pas voulu
  rationale: Le verbe exprime ici la volonté ou le consentement, et non une incapacité. Cette formulation naturelle conserve la nuance volitive de la parole divine.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: écouter Balaam
  rationale: Avec la préposition ל, שׁמע signifie souvent écouter quelqu’un ou lui prêter attention. « Écouter » reste naturel sans préciser davantage l’effet recherché par Balaam.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: il vous a bel et bien bénis
  rationale: Le verbe suivi de l’infinitif absolu de même racine renforce l’affirmation. « Bel et bien » rend cette insistance sans imposer l’idée, possible dans le contexte mais non explicitement encodée par la construction, de bénédictions répétées.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le pronom objet est masculin pluriel ; en français, le participe passé « bénis » et « délivrés » en reflète le nombre et le genre dans l’adresse faite à Israël.
- source_word: וָאַצִּל
  choice: je vous ai délivrés
  rationale: נצל désigne le fait d’arracher quelqu’un à un danger ou de le délivrer. Ce choix convient au registre du récit de l’alliance et évite de surcharger le verbe d’une portée théologique non explicitée ici.
- source_word: מִיָּדוֹ
  choice: de sa main
  rationale: La métaphore hébraïque de la main comme pouvoir ou emprise demeure claire en français et peut donc être conservée.
theological_decisions:
- issue: Agent de la bénédiction
  choice: Le sujet de « il vous a bel et bien bénis » est Balaam.
  alternative: 'Comprendre implicitement Dieu comme sujet : « je vous ai bénis ».'
  rationale: Le verbe hébreu est à la troisième personne masculine du singulier après la mention de Balaam, qui en est donc le sujet grammatical le plus naturel. Le contexte montre que Dieu a contrarié son intention, sans qu’il soit nécessaire de modifier l’agent exprimé dans la phrase.
translation_notes:
  register: Français international moderne, clair et digne. « Bel et bien » restitue l’emphase avec naturel ; le point-virgule maintient le lien entre la bénédiction imposée à Balaam et la délivrance opérée par Dieu. La métaphore « de sa main » conserve la coloration biblique sans devenir obscure.
