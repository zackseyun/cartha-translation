  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: fr
  text: Puis Josué renvoya le peuple, chacun vers son héritage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: renvoya
  rationale: Le piel de שׁלח indique ici que Josué congédie l’assemblée et la laisse repartir. « Renvoya » exprime naturellement cette action en français.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: הָעָם
  choice: le peuple
  rationale: עָם désigne collectivement le peuple d’Israël réuni, sans qu’il soit nécessaire de préciser « nation ».
- source_word: אִישׁ
  choice: chacun
  rationale: Le masculin singulier אִישׁ a ici une valeur distributive. « Chacun » rend clairement cette fonction en français moderne sans suggérer que seuls les hommes sont concernés.
- source_word: לְנַחֲלָתוֹ
  choice: vers son héritage
  rationale: נַחֲלָה désigne dans Josué le territoire reçu en partage. « Héritage » préserve la portée foncière et la nuance d’attribution héritée, tandis que « vers » convient au mouvement de retour.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure concise conserve le mouvement du texte hébreu et la valeur distributive de אִישׁ. Aucun marqueur de note n’est requis, puisque « chacun » rend directement l’ambiguïté représentative du masculin hébreu.
