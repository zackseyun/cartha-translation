revisions:
- from: Puis j’ai envoyé Moïse et Aaron, et j’ai frappé[a] l’Égypte par tout ce que j’ai fait en son sein[b]. Après cela, je vous ai fait sortir.
  to: Puis j’ai envoyé Moïse et Aaron, et j’ai frappé[a] l’Égypte, comme je l’ai fait au milieu d’elle[b]. Après cela, je vous ai fait sortir.
  rationale: La révision remplace la tournure instrumentale et amplifiée « par tout ce que » par « comme je l’ai fait », qui rend la valeur de כַּאֲשֶׁר tout en préservant la concision et la légère ellipse de l’hébreu. La note b signale les possibilités de formulation littérale sans trancher au-delà du texte. La note a est rendue moins interprétative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:12:00Z'
