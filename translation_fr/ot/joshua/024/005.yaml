    issue: « par tout ce que j’ai fait en son sein »
    rationale: « Par » exprime ici le moyen et « tout » amplifie le texte; ni l’un ni l’autre ne correspond à כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ, qui signifie littéralement « comme / selon ce que j’ai fait au milieu d’elle ».
  - severity: low
    issue: 'Note a : « j’ai accablé de fléaux »'
    rationale: Cette alternative contextualise fortement נגף comme les plaies. « J’ai affligé » rend l’alternative lexicale sans introduire explicitement les fléaux dans la traduction alternative.
