  verdict: revise
  source_fidelity: La proposition « par tout ce que j’ai fait en son sein » transforme כַּאֲשֶׁר (« comme / selon ce que ») en expression instrumentale (« par ») et ajoute « tout », absent de l’hébreu. Le texte doit conserver le rapport comparatif condensé, sans expliciter les actes comme un moyen.
  naturalness: « Comme je l’ai fait au milieu d’elle » est une formulation française claire et suffisamment littérale pour cette construction elliptique; elle conserve le singulier renvoyant à l’Égypte.
  terminology: « Moïse », « Aaron », « l’Égypte », « j’ai frappé » et « je vous ai fait sortir » sont justes et naturels. La note lexicale doit proposer « j’ai affligé » plutôt que l’expression plus interprétative « j’ai accablé de fléaux ».
  issues:
