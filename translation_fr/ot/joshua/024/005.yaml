  variant: modern international French
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֞ח אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ וָ/אֶגֹּ֣ף אֶת מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּ֑/וֹ וְ/אַחַ֖ר הוֹצֵ֥אתִי אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: fr
  text: Puis j’ai envoyé Moïse et Aaron, et j’ai frappé[a] l’Égypte, comme je l’ai fait au milieu d’elle[b]. Après cela, je vous ai fait sortir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai affligé ». Le verbe hébreu peut signifier « frapper » ou « affliger »; dans ce contexte, il renvoie aux coups portés à l’Égypte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme ce que j’ai fait au milieu d’elle »; ou : « selon ce que j’ai fait en son sein ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: j’ai envoyé
  rationale: Le qal de שׁלח signifie couramment « envoyer ». Cette formulation exprime simplement la mission confiée par Dieu à Moïse et Aaron.
- source_word: מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles de ces noms propres bibliques.
- source_word: וָאֶגֹּף
  choice: j’ai frappé
  rationale: נגף peut signifier « frapper » ou « infliger un fléau ». « J’ai frappé » conserve la force et l’étendue du verbe sans expliciter davantage que le texte les fléaux d’Égypte.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Le nom désigne ici l’Égypte comme pays et entité collective.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: par tout ce que j’ai fait en son sein
  rationale: La proposition hébraïque est condensée. Cette formulation française relie naturellement le coup porté à l’Égypte aux actes accomplis à l’intérieur du pays, tandis qu’une note conserve la tournure plus littérale et son ambiguïté.
- source_word: וְאַחַר
  choice: Après cela
  rationale: אַחַר a ici une valeur temporelle et marque l’étape suivante du récit.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: je vous ai fait sortir
  rationale: Le hiphil de יצא signifie « faire sortir ». La traduction maintient l’adresse directe au pluriel et ne remplace pas « vous » par une référence explicative aux ancêtres.
theological_decisions:
- issue: Référent du pronom pluriel « vous »
  choice: Maintien de « je vous ai fait sortir », adressé collectivement à Israël
  alternative: « J’ai fait sortir vos ancêtres »
  rationale: L’hébreu s’adresse directement à l’Israël présent en solidarité d’alliance avec la génération de l’Exode. La traduction conserve cette rhétorique et la tension du texte au lieu de la résoudre par une paraphrase.
- issue: Nature des coups portés à l’Égypte
  choice: « j’ai frappé »
  alternative: « j’ai accablé de fléaux »
  rationale: Le contexte évoque les fléaux d’Égypte, mais le verbe hébreu reste plus large. Le choix évite d’introduire dans le corps du texte une précision interprétative inutile.
translation_notes:
  register: Français international moderne, clair et digne. « En son sein » conserve la référence singulière à l’Égypte comme entité collective; la ponctuation française allège la longue coordination hébraïque sans modifier l’ordre des événements.
