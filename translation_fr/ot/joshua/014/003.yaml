id: JOS.14.3
reference: Joshua 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: fr
  text: En effet, Moïse avait donné leur héritage aux deux tribus et à la demi-tribu de l’autre côté du Jourdain[a], mais il n’avait pas donné d’héritage aux Lévites parmi elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au-delà du Jourdain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit ici l’explication de ce qui précède; « En effet » rend naturellement cette fonction discursive en français.
- source_word: נָתַן
  choice: avait donné
  rationale: Le plus-que-parfait exprime l’antériorité de l’attribution faite par Moïse par rapport à la situation narrative présente.
- source_word: נַחֲלַת
  choice: leur héritage
  rationale: Le terme désigne ici le territoire attribué comme possession héréditaire aux tribus; le possessif produit une formulation française naturelle sans perdre le sens foncier.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: aux deux tribus
  rationale: Dans ce contexte de répartition territoriale, מַטֶּה désigne clairement une tribu et non un bâton.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: et à la demi-tribu
  rationale: Formulation française consacrée et précise pour la moitié de la tribu de Manassé.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Rend l’expression géographique hébraïque tout en conservant son caractère relatif au point de vue; une note signale l’autre traduction courante.
- source_word: וְלַלְוִיִּם
  choice: mais ... aux Lévites
  rationale: Bien que וְ soit formellement copulatif, la seconde proposition contraste avec l’attribution faite aux tribus; « mais » rend ce rapport naturellement.
- source_word: לֹא נָתַן נַחֲלָה
  choice: il n’avait pas donné d’héritage
  rationale: Conserve le vocabulaire d’héritage et l’antériorité narrative, sans rendre l’affirmation plus absolue que l’hébreu.
- source_word: בְּתוֹכָם
  choice: parmi elles
  rationale: Le pronom renvoie naturellement en français aux tribus mentionnées; cette expression maintient la précision selon laquelle Lévi ne reçut pas de territoire tribal parmi elles.
theological_decisions:
- issue: Nature de l’absence d’héritage pour Lévi
  choice: Le texte nie aux Lévites un héritage territorial parmi les tribus mentionnées.
  alternative: Formuler de manière absolue que les Lévites ne reçurent aucun héritage d’aucune sorte.
  rationale: La présence de « parmi elles » doit être conservée. Elle évite de confondre l’absence de lot territorial tribal avec une absence totale de provision, sans ajouter au verset une explication théologique extérieure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de l’hébreu, tandis que « En effet », le plus-que-parfait et la reprise pronominale assurent une lecture naturelle.
