- from: 'Alors les fils de Juda s’approchèrent de Josué à Guilgal, et Caleb, fils de Yefounné, le Qenizzite, lui dit : « Tu sais ce que[a] Yahweh a déclaré à Moïse, l’homme de Dieu, à mon sujet et à ton sujet, à Qadesh-Barnéa. »'
  to: 'Alors les fils de Juda s’approchèrent de Josué à Guilgal, et Caleb, fils de Jephunné, le Qenizzite, lui dit : « Tu sais la parole[a] que Yahweh a adressée à Moïse, l’homme de Dieu, à mon sujet et à ton sujet, à Qadesh-Barnéa. »'
  rationale: La révision rétablit le substantif hébreu הַדָּבָר dans le texte français, conserve son ambiguïté sémantique au moyen d’une note correctement ancrée, et adopte la graphie française usuelle « Jephunné ».
