  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: fr
  text: 'Alors les fils de Juda s’approchèrent de Josué à Guilgal, et Caleb, fils de Jephunné, le Qenizzite, lui dit : « Tu sais la parole[a] que Yahweh a adressée à Moïse, l’homme de Dieu, à mon sujet et à ton sujet, à Qadesh-Barnéa. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « parole » peut aussi désigner une « affaire » ou une « chose ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: s’approchèrent
  rationale: Le verbe נגשׁ décrit le fait de s’avancer ou de venir auprès de quelqu’un ; « s’approchèrent » est naturel et précis dans ce récit.
- source_word: בְנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: Cette formulation conserve l’expression tribale et familiale littérale de l’hébreu, sans la neutraliser en « peuple de Juda ».
- source_word: בַּגִּלְגָּל
  choice: à Guilgal
  rationale: Préposition locative française naturelle et graphie française courante du toponyme.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Caleb, fils de Yefounné, le Qenizzite
  rationale: Les noms et le gentilé clanique sont translittérés ; les virgules rendent clairement l’apposition en français.
- source_word: אַתָּה יָדַעְתָּ
  choice: Tu sais
  rationale: Le parfait hébreu exprime ici un état présent de connaissance ; le présent français convient au discours direct.
- source_word: הַדָּבָר אֲשֶׁר דִּבֶּר
  choice: ce que … a déclaré
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Dans cette construction, « ce que … a déclaré » exprime naturellement la parole divine sans imposer un substantif français ambigu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: Moïse, l’homme de Dieu
  rationale: La formulation préserve le titre biblique établi tout en employant une ponctuation française naturelle.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: à mon sujet et à ton sujet
  rationale: La répétition de « à … sujet » reflète la structure parallèle et distingue nettement les deux personnes concernées.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: à Qadesh-Barnéa
  rationale: La préposition est idiomatique pour un lieu ; la graphie choisie translittère le qoph et conserve la forme composée du nom.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le nom propre divin ; « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Désignation tribale בְנֵי יְהוּדָה
  choice: les fils de Juda
  alternative: les gens de Juda ; les hommes de Juda
  rationale: Le choix maintient la métaphore généalogique masculine de la désignation tribale hébraïque sans préciser au-delà du texte quels représentants étaient présents.
- issue: Portée de הַדָּבָר
  choice: ce que Yahweh a déclaré
  alternative: la parole que Yahweh a prononcée ; l’affaire dont Yahweh a parlé
  rationale: Le contexte renvoie à une déclaration divine précise, mais le nom hébreu reste polysémique ; la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond au singulier hébreu adressé directement à Josué. Les répétitions significatives sont conservées, tandis que la syntaxe du discours est rendue idiomatique.
