source:
  edition: WLC
  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: fr
  text: En effet, les descendants de Joseph formaient deux tribus, Manassé et Éphraïm. On n’attribua aux Lévites aucune part dans le pays, mais seulement des villes où habiter, avec les pâturages qui les entouraient[a] pour leur bétail et leurs biens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « pâturages » étaient les terrains ouverts situés autour des villes lévitiques, notamment utilisés pour le bétail.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication de l’affirmation précédente et rend naturellement le lien causal ou explicatif en français.
- source_word: בְנֵי יוֹסֵף
  choice: les descendants de Joseph
  rationale: Dans ce contexte tribal, l’expression désigne la postérité de Joseph plutôt que ses seuls fils immédiats.
- source_word: שְׁנֵי מַטּוֹת
  choice: formaient deux tribus
  rationale: מַטּוֹת désigne ici des divisions tribales; la formulation française explicite naturellement la relation prédicative de l’hébreu.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: Manassé et Éphraïm
  rationale: Formes françaises usuelles des noms personnels et tribaux.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: On n’attribua … aucune part
  rationale: Le sujet implicite renvoie aux responsables du partage; le pronom indéfini évite une ambiguïté française selon laquelle Joseph ou ses descendants auraient effectué l’attribution.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Le pluriel désigne collectivement les membres de la tribu de Lévi.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Désigne le territoire en cours de répartition; « pays » est naturel tout en conservant la portée territoriale.
- source_word: כִּי אִם
  choice: mais seulement
  rationale: Marque l’exception après une négation et se lit naturellement dans cette construction française.
- source_word: עָרִים לָשֶׁבֶת
  choice: des villes où habiter
  rationale: Conserve la valeur de destination de l’infinitif dans un français actuel.
- source_word: מִגְרְשֵׁיהֶם
  choice: les pâturages qui les entouraient
  rationale: Désigne les espaces ouverts attenants aux villes, notamment destinés aux animaux; la formulation précise le référent du suffixe.
- source_word: לְמִקְנֵיהֶם
  choice: pour leur bétail
  rationale: מִקְנֶה est un terme collectif large pour les animaux domestiques possédés.
- source_word: וּלְקִנְיָנָם
  choice: et leurs biens
  rationale: קִנְיָן désigne ce qui est acquis ou possédé; « biens » préserve la portée générale sans le confondre avec le bétail déjà mentionné.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue coordination hébraïque sans modifier son rapport explicatif. « Descendants » clarifie l’emploi collectif de « fils », et le passif de sens rendu par « on » évite d’attribuer à tort le partage aux tribus de Joseph.
