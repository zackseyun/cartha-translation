id: JOS.14.2
reference: Joshua 14:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: fr
  text: Leur héritage fut attribué par tirage au sort, comme Yahweh l’avait ordonné par l’intermédiaire de Moïse[a], aux neuf tribus et à la demi-tribu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse », expression hébraïque indiquant l’intermédiaire ou l’agent.'
    reason: idiome hébreu et équivalent littéral
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: par tirage au sort
  rationale: La préposition בְּ marque ici le moyen ou la procédure. « Par tirage au sort » exprime clairement en français actuel la répartition des terres au moyen des lots.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: נַחֲלָה désigne ici le territoire reçu en partage comme héritage. « Leur héritage » conserve la portée foncière et théologique du terme sans l’expliciter excessivement.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme … l’avait ordonné
  rationale: כַּאֲשֶׁר introduit la conformité à un commandement antérieur. Le plus-que-parfait français marque naturellement l’antériorité de cet ordre par rapport au partage raconté.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: L’expression hébraïque « par la main de Moïse » indique l’agence ou la médiation. Cette formulation française en communique naturellement le sens.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: aux neuf tribus et à la demi-tribu
  rationale: La préposition לְ indique les destinataires de l’attribution. Dans ce contexte, מַטֶּה signifie « tribu »; le singulier précédé de « moitié » désigne la demi-tribu concernée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin et évite de le remplacer par un titre.
- issue: Médiation de Moïse dans le commandement
  choice: par l’intermédiaire de Moïse
  alternative: par la main de Moïse
  rationale: Le choix conserve l’idée que Yahweh est l’auteur du commandement et Moïse son médiateur, sans imposer au français le calque anatomique de l’idiome hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Fut attribué » explicite la relation implicite entre l’héritage et le tirage au sort, tandis que « aux neuf tribus et à la demi-tribu » rend clairement les bénéficiaires. Le marqueur de note est placé après « Moïse », là où se trouve l’expression annotée.
