  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: fr
  text: Je suis encore aujourd’hui aussi fort que je l’étais le jour où Moïse m’a envoyé. J’ai autant de force maintenant qu’alors, pour le combat, pour sortir et entrer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour sortir et pour entrer ». Cette expression hébraïque peut désigner une pleine capacité d’agir, dans la vie courante ou, ici, dans un contexte militaire.'
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם
  choice: Je suis encore aujourd’hui
  rationale: « Encore aujourd’hui » exprime naturellement en français la continuité indiquée par עוֹד avec la référence temporelle הַיּוֹם.
- source_word: חָזָק
  choice: fort
  rationale: Dans ce contexte de combat et de capacité d’action, l’adjectif désigne principalement la force physique de Caleb.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: aussi fort que le jour où Moïse m’a envoyé
  rationale: Cette formulation française restitue directement la comparaison et la précision temporelle du texte hébreu.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: J’ai autant de force maintenant qu’alors
  rationale: Le texte hébreu est elliptique et sans verbe. Cette formulation explicite la relation comparative sans modifier son sens, tout en conservant l’opposition entre le passé et le présent.
- source_word: לַמִּלְחָמָה
  choice: pour le combat
  rationale: מִלְחָמָה peut désigner la guerre ou le combat ; ici, « le combat » convient à l’affirmation personnelle de Caleb sur son aptitude militaire.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: pour sortir et pour rentrer
  rationale: Cette traduction reste proche de l’ordre des verbes hébreux tout en étant idiomatique en français. La note signale la portée plus large possible de l’expression.
