  terminology: « Yahweh », « héritage », « tes fils » et « pour toujours » rendent adéquatement les termes clés. La note sur « tes descendants » est pertinente; une note sur la formule emphatique « Oui » permet aussi de rendre compte du אִם לֹא sans alourdir le texte.
