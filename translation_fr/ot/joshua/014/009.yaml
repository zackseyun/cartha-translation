source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: fr
  text: 'Moïse jura ce jour-là : « Oui[a], le pays que ton pied a foulé te reviendra en héritage, à toi et à tes fils, pour toujours[b], parce que tu as pleinement suivi Yahweh, mon Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « si ne… pas » : formule de serment employée ici pour affirmer avec force.'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour tes descendants ». L’hébreu dit littéralement « pour tes fils ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: fit ce serment
  rationale: Le niphal de שׁבע signifie « jurer, prêter serment ». Cette formulation française est naturelle et conserve la solennité de l’acte.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Rend directement l’expression temporelle hébraïque dans un français courant.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles qui suivent sans qu’il soit nécessaire d’ajouter le calque « en disant ».
- source_word: אִם לֹא
  choice: Oui
  rationale: Dans cette formule de serment, אִם לֹא ne constitue pas une condition ordinaire, mais renforce solennellement l’affirmation. « Oui » en restitue la force sans introduire une fausse condition.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: le pays où ton pied a marché
  rationale: Conserve l’image concrète du pied au singulier et le sens de דרך, tout en restant naturel en français.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: sera pour toi […] un héritage
  rationale: Préserve la valeur future ainsi que la notion de possession transmise ou de lot héréditaire exprimée par נַחֲלָה.
- source_word: וּלְבָנֶיךָ
  choice: et pour tes fils
  rationale: Rend explicitement le masculin pluriel בנים, tout en signalant en note l’autre portée possible dans le contexte d’une lignée.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française usuelle qui rend la durée durable et indéfinie de l’hébreu.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: parce que tu as pleinement suivi
  rationale: Reproduit l’idée idiomatique de suivre entièrement ou sans réserve, sans effacer l’image verbale de « suivre ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Conserve le suffixe possessif de première personne explicitement présent dans le texte hébreu.
theological_decisions:
- issue: Formule de serment אִם לֹא
  choice: Oui
  alternative: littéralement « si… ne… pas »
  rationale: Dans ce contexte, la tournure hébraïque sert d’affirmation jurée et non de condition laissée en suspens. La traduction en restitue la force tout en évitant un français obscur.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette distinction par rapport au titre « Seigneur ».
- issue: Portée de וּלְבָנֶיךָ
  choice: pour tes fils
  alternative: pour tes descendants
  rationale: Le texte dit formellement « tes fils », mais le contexte d’un héritage durable peut inclure la lignée; la traduction retient la forme lexicale précise et présente l’élargissement possible en note.
- issue: Durée exprimée par עַד עוֹלָם
  choice: pour toujours
  alternative: à perpétuité
  rationale: La formulation conserve l’affirmation forte du texte sans préciser davantage, dans un sens juridique ou métaphysique, la nature de cette durée.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est légèrement resserrée par l’emploi des deux-points à la place du participe hébraïque « disant ». L’image du pied et le terme « héritage » sont maintenus pour préserver la couleur et la portée du texte source.
