  text: וְ/אַחַ/י֙ אֲשֶׁ֣ר עָל֣וּ עִמִּ֔/י הִמְסִ֖יו אֶת לֵ֣ב הָ/עָ֑ם וְ/אָנֹכִ֣י מִלֵּ֔אתִי אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/008.yaml
  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: fr
  text: Mais mes frères[a] qui étaient montés avec moi ont fait fondre le cœur du peuple, tandis que moi, j’ai pleinement suivi le SEIGNEUR, mon Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : mes compagnons.'
    reason: Dans ce contexte, « frères » peut désigner les autres hommes partis avec Caleb, sans impliquer une parenté biologique.
lexical_decisions:
- source_word: אַחַי
  choice: mes frères
  rationale: Rend directement le terme hébreu, qui peut désigner ici des compatriotes ou compagnons plutôt que des frères biologiques; l’alternative contextuelle est signalée en note.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: ont fait fondre le cœur du peuple
  rationale: Conserve la métaphore hébraïque expressive de l’effondrement du courage collectif, sans la réduire à une simple émotion.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: j’ai pleinement suivi
  rationale: Reproduit l’idée idiomatique d’une fidélité entière et résolue tout en restant naturelle en français.
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: Suit la convention française courante qui représente le tétragramme par SEIGNEUR en capitales.
theological_decisions:
- issue: Rapport entre la réaction des autres explorateurs et la fidélité de Caleb
  choice: tandis que moi
  alternative: mais moi
  rationale: Le waw marque ici un contraste; « tandis que moi » préserve l’opposition sans imposer une nuance causale ou polémique supplémentaire.
- issue: Expression du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La convention typographique retenue distingue le nom divin tout en offrant une lecture publique naturelle; elle n’efface pas son statut de nom propre.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore sémitique « faire fondre le cœur » est volontairement conservée, car elle demeure intelligible et porte la force rhétorique du texte.
