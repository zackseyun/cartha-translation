  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: fr
  text: Hébron s’appelait autrefois Qiryath-Arba[a]. Arba était l’homme le plus éminent parmi les Anakites[b]. Et le pays fut tranquille, sans guerre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qiryath-Arba signifie probablement « ville d’Arba ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le grand homme parmi les Anakites ». L’hébreu peut désigner Arba comme la figure la plus éminente associée aux Anakites.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « le pays fut en repos, loin de la guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: Hébron s’appelait autrefois
  rationale: Cette formulation française naturelle rend littéralement l’idée du « nom de Hébron autrefois » sans ajouter un marqueur temporel absent du texte.
- source_word: קִרְיַת אַרְבַּע
  choice: Qiryath-Arba
  rationale: Le nom propre composé est translittéré; une note en indique le sens probable.
- source_word: הָאָדָם הַגָּדוֹל
  choice: l’homme le plus éminent
  rationale: Dans ce contexte, אָדָם désigne un homme précis et גָּדוֹל peut exprimer son importance ou sa prééminence. La note conserve l’autre lecture possible, « le grand homme ».
- source_word: בָּעֲנָקִים
  choice: parmi les Anaqites
  rationale: Le terme désigne le groupe humain associé à Anaq; « Anaqites » est une forme française claire et usuelle.
- source_word: וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה
  choice: Et le pays connut le repos après la guerre
  rationale: שקט exprime le calme ou le repos résultant de la cessation des combats; « après la guerre » rend idiomatiquement la séparation marquée par מִן, sans prétendre que toute guerre était définitivement achevée.
theological_decisions:
- issue: Degré de prééminence attribué à Arba
  choice: l’homme le plus éminent parmi les Anaqites
  alternative: le grand homme parmi les Anaqites
  rationale: L’hébreu peut présenter Arba comme une figure prééminente ou simplement comme « le grand homme ». Le texte principal adopte une lecture contextuelle naturelle et la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent une translittération proche de l’hébreu; la syntaxe reste naturelle tout en conservant la coordination finale du texte source.
