source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: fr
  text: Voici les parts d’héritage que les fils d’Israël[a] reçurent dans le pays de Canaan et qu’Éléazar le prêtre, Josué fils de Noun, ainsi que les chefs des maisons ancestrales[b] des tribus des fils d’Israël leur attribuèrent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « les Israélites ». L’hébreu emploie littéralement l’expression familiale « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Les « maisons ancestrales » étaient des groupements familiaux au sein des tribus. Littéralement : « maisons des pères ».'
    reason: cultural_note
  - marker: c
    text: 'On peut aussi traduire : « leur donnèrent en héritage ». L’hébreu emploie ici la même racine que dans le verbe rendu par « reçurent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Le démonstratif introduit la nouvelle section tout en assurant la continuité du récit. « Voici » est naturel en français et n’ajoute aucune valeur temporelle absente de l’hébreu.
- source_word: נָחֲלוּ
  choice: reçurent
  rationale: Le qal décrit la réception par Israël des parts qui lui sont échues. « Reçurent » convient mieux ici que « héritèrent », qui peut évoquer en français une succession après décès.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et collective de l’hébreu. Une note signale l’équivalent idiomatique « les Israélites ».
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: Le mot « pays » rend explicitement אֶרֶץ et maintient l’accent territorial propre au contexte du partage.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: qu’… leur attribuèrent
  rationale: La forme verbale désigne ici l’action officielle par laquelle les responsables font recevoir leur héritage aux Israélites. « Attribuèrent » exprime clairement ce partage administratif.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: les chefs des maisons ancestrales des tribus
  rationale: « Chefs » rend רָאשֵׁי, tandis que « maisons ancestrales » exprime en français actuel les groupements de parenté désignés par אֲבוֹת sans les réduire à de simples familles nucléaires.
- source_word: נָחֲלוּ / נִחֲלוּ
  choice: parts d’héritage / reçurent / attribuèrent
  rationale: Le français ne permet pas de reproduire élégamment la répétition de la racine נחל. « Parts d’héritage » maintient explicitement la notion, et les deux verbes distinguent la réception du partage.
theological_decisions:
- issue: Désignation collective et familiale בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: L’hébreu emploie une expression masculine plurielle devenue une désignation collective du peuple. Le texte principal en conserve la forme familiale sans prétendre que seuls les hommes sont concernés; la note donne l’équivalent ethnonymique courant.
- issue: Terminologie de parenté dans אֲבוֹת
  choice: maisons ancestrales
  alternative: maisons paternelles
  rationale: « Maisons ancestrales » préserve la structure sociale fondée sur la filiation tout en évitant que le lecteur moderne comprenne « maisons paternelles » comme les domiciles personnels des pères.
- issue: Valeur de la racine נחל dans les deux propositions
  choice: reçurent… attribuèrent
  alternative: reçurent en héritage… donnèrent en héritage
  rationale: La traduction distingue le point de vue des bénéficiaires de celui des responsables du partage, comme le font les formes verbales hébraïques, sans imposer l’idée d’une succession liée à un décès.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase unique conserve la structure de la présentation hébraïque, tandis que « parts d’héritage » et « maisons ancestrales » rendent le contexte territorial et social intelligible sans effacer les notions sources.
