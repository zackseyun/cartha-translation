source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: fr
  text: Maintenant, donne-moi cette région montagneuse dont Yahweh a parlé ce jour-là[a], car tu as toi-même entendu ce jour-là qu’il y a là des Anakites et de grandes villes fortifiées. Peut-être Yahweh sera-t-il avec moi[b], et je les en chasserai, comme Yahweh l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette montagne ». Le mot hébreu peut désigner une montagne particulière ou une région montagneuse ; le contexte territorial favorise ici le second sens.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « Peut-être Yahweh avec moi », une expression elliptique qui exprime l’espérance de sa présence et de son aide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers la demande présente de Caleb; le français naturel peut laisser implicite la coordination initiale.
- source_word: תְּנָה לִּי
  choice: donne-moi
  rationale: Rend directement l’impératif de נתן avec son complément indirect, sans atténuer la vigueur de la demande.
- source_word: אֶת־הָהָר הַזֶּה
  choice: cette région montagneuse
  rationale: הַר peut désigner une montagne ou une zone montagneuse; le contexte territorial favorise ici le sens régional.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: dont Yahweh a parlé
  rationale: Conserve le sens lexical de « parler » sans expliciter en « promettre » la portée promissoire donnée par le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: En effet, tu as toi-même entendu
  rationale: כִּי introduit ici une justification, et le pronom explicite אַתָּה porte une emphase rendue par « toi-même ».
- source_word: כִּי עֲנָקִים שָׁם
  choice: que les Anakites s’y trouvent
  rationale: « Anakites » est la désignation française courante du groupe; le présent convient à la situation que Caleb décrit.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: et qu’il y a de grandes villes fortifiées
  rationale: Formulation française naturelle qui conserve les deux qualifications des villes.
- source_word: אוּלַי
  choice: Peut-être
  rationale: Préserve l’expression d’une espérance confiante mais non présomptueuse.
- source_word: יְהוָה אוֹתִי
  choice: Yahweh sera-t-il avec moi
  rationale: La proposition nominale elliptique est comprise, dans ce contexte futur, comme l’espoir de la présence et de l’aide de Yahweh.
- source_word: וְהוֹרַשְׁתִּים
  choice: je les en déposséderai
  rationale: Le hiphil de ירשׁ exprime ici l’expulsion des habitants et leur dépossession du territoire; le pronom « en » rattache clairement l’action à la région demandée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Portée de אוּלַי יְהוָה אוֹתִי
  choice: Peut-être Yahweh sera-t-il avec moi
  alternative: Peut-être Yahweh m’aidera-t-il
  rationale: La traduction retenue conserve à la fois l’incertitude exprimée par אוּלַי et l’ellipse hébraïque de la présence divine, sans la réduire explicitement à l’aide militaire.
- issue: Nature de l’assurance de Caleb
  choice: Maintien de « Peut-être »
  alternative: Puisque Yahweh sera avec moi
  rationale: Le texte associe confiance dans la parole divine et formulation non présomptueuse; cette tension doit rester perceptible.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure directe, avec une légère solennité adaptée au récit biblique. « Anakites » suit l’usage français courant; « région montagneuse » explicite le sens territorial probable sans exclure l’autre lecture, signalée en note.
