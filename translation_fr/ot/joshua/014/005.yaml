  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: fr
  text: Tout comme Yahweh l’avait ordonné à Moïse, les fils d’Israël[a] agirent ainsi et répartirent le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression collective courante désignant le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Tout comme
  rationale: Cette locution exprime naturellement en français la correspondance exacte entre l’ordre donné et son exécution.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique que l’ordre adressé à Moïse précède l’action des Israélites.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Avec le verbe « ordonner », le français désigne idiomatiquement la personne qui reçoit l’ordre au moyen de la préposition « à ».
- source_word: כֵּן עָשׂוּ
  choice: agirent ainsi
  rationale: Cette formulation conserve l’idée de conformité exprimée par כֵּן et le sens général du verbe עָשׂוּ sans ajouter d’objet absent de l’hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation reproduit l’expression collective masculine de l’hébreu; une note indique l’équivalent français courant « les Israélites ».
- source_word: וַיַּחְלְקוּ
  choice: et partagèrent
  rationale: Dans le contexte de la répartition territoriale, « partager » rend clairement l’action de diviser ou de répartir le pays.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte de Josué, אָרֶץ désigne le territoire à répartir, et non la terre au sens mondial ou matériel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé; Jéhovah; le Seigneur
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: L’expression hébraïque est grammaticalement masculine mais fonctionne collectivement pour le peuple d’Israël. Le texte conserve sa forme, tandis que la note en explicite l’usage collectif.
translation_notes:
  register: Français international actuel, digne et accessible. « Tout comme » et « agirent ainsi » maintiennent le parallélisme de l’hébreu; « le pays » convient au contexte territorial du livre de Josué.
