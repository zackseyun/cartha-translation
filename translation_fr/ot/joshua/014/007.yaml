  - severity: low
    issue: La note qualifie de littérale une paraphrase syntaxiquement maladroite.
    rationale: « une parole selon ce qui était avec mon cœur » ne correspond pas exactement à la construction hébraïque et sonne peu français. Il vaut mieux signaler que l’hébreu porte littéralement « une parole selon ce qui était avec mon cœur », puis expliciter prudemment la valeur idiomatique.
