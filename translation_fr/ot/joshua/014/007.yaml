  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: fr
  text: J’avais quarante ans lorsque Moïse, serviteur de Yahweh, m’a envoyé de Qadesh-Barnéa pour reconnaître le pays. Je lui ai fait un rapport selon ce que j’avais à cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « une parole selon ce qui était avec mon cœur ». La formule peut désigner un rapport conforme à sa conviction ou à son appréciation intérieure.'
    reason: La note préserve l’ambiguïté de la formule hébraïque tout en expliquant son sens idiomatique sans réduire « cœur » à la seule sincérité ou à une interprétation confessionnelle.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: J’avais quarante ans
  rationale: L’expression hébraïque d’âge, littéralement « fils de quarante ans », se rend naturellement ainsi en français.
- source_word: בִּשְׁלֹחַ
  choice: lorsque ... m’a envoyé
  rationale: L’infinitif construit précédé de בְּ exprime ici la circonstance temporelle.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: « Serviteur » convient au titre honorifique de Moïse et le nom divin est conservé sous la forme Yahweh.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Qadesh-Barnéa
  rationale: Transcription française usuelle du nom de lieu composé.
- source_word: לְרַגֵּל אֶת הָאָרֶץ
  choice: pour reconnaître le pays
  rationale: Le verbe désigne une mission de reconnaissance ou d’exploration; « reconnaître » est naturel en français et garde cette nuance sans suggérer uniquement l’espionnage clandestin.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: Je lui ai rapporté
  rationale: La construction signifie idiomatiquement rapporter une parole, des renseignements ou un compte rendu; le verbe français suffit naturellement dans ce contexte.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: ce que j’avais à cœur
  rationale: Cette formulation conserve la métaphore du cœur et l’idée d’une parole conforme à la conviction intérieure de Caleb, sans préciser indûment s’il s’agit surtout de sincérité ou de jugement personnel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de כַּאֲשֶׁר עִם לְבָבִי
  choice: ce que j’avais à cœur
  alternative: un rapport conforme à ce que je pensais
  rationale: Le choix maintient l’image hébraïque du cœur et l’ambiguïté entre conviction intérieure, appréciation personnelle et franchise, sans imposer la notion plus interprétative d’intégrité totale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est naturelle pour un large lectorat; « reconnaître le pays » appartient au registre narratif courant, tandis que « avoir à cœur » préserve l’image sémitique sans devenir obscur.
