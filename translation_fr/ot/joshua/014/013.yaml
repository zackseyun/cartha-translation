  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: fr
  text: Alors Josué le bénit[a] et donna Hébron à Caleb, fils de Jephunné, en héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bénit Caleb » ; l’hébreu porte « le bénit », Caleb étant clairement désigné par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: le bénit
  rationale: Le verbe בָּרַךְ, muni du suffixe masculin singulier, signifie littéralement « le bénit ». Le pronom reste naturel en français, et le contexte identifie clairement Caleb comme son référent.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נָתַן signifie couramment « donner ». « Donna » rend directement l’acte d’attribution sans ajouter de nuance interprétative.
- source_word: אֶת חֶבְרוֹן
  choice: Hébron
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas; חֶבְרוֹן est rendu par la forme française usuelle « Hébron ».
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: à Caleb, fils de Yefounné
  rationale: La préposition לְ marque ici le bénéficiaire. La formulation généalogique « fils de Yefounné » est directe, naturelle et fidèle.
- source_word: לְנַחֲלָה
  choice: comme héritage
  rationale: נַחֲלָה désigne ici un bien foncier reçu en partage. « Comme héritage » conserve le sens d’attribution durable de la terre.
