source:
  edition: WLC
  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: fr
  text: C’est pourquoi Hébron est devenue l’héritage de Caleb, fils de Yefounné, le Quenizzite, jusqu’à ce jour, parce qu’il a suivi pleinement[a] Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « il a suivi Yahweh de tout son cœur ». L’expression hébraïque signifie littéralement « remplir après » et exprime une fidélité entière.'
    reason: Précise l’idiome hébreu מִלֵּא אַחֲרֵי et signale une traduction française naturelle possible.
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’attribution racontée précédemment, tout en conservant la force causale de l’hébreu.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: est devenue l’héritage
  rationale: 'Le tour hébreu marque l’entrée dans un nouvel état : Hébron est devenue la part attribuée à Caleb. Cette formulation reste naturelle et conserve la notion d’héritage territorial.'
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française usuelle du nom de lieu.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: de Caleb, fils de Yefounné, le Quenizzite
  rationale: Le lamed indique ici l’appartenance ou le bénéficiaire. « de Caleb » s’accorde naturellement avec « l’héritage »; les noms propres suivent des formes françaises claires et proches de l’hébreu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Rend l’expression temporelle conventionnelle et indique que cette situation perdurait au temps du narrateur.
- source_word: יַעַן אֲשֶׁר
  choice: parce que
  rationale: Exprime directement en français moderne la raison donnée pour l’attribution d’Hébron.
- source_word: מִלֵּא אַחֲרֵי
  choice: a suivi pleinement
  rationale: Rend l’idée d’une fidélité entière tout en gardant le verbe « suivre » de l’idiome hébreu, littéralement « remplir après ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite hébraïque et conserve l’identification de Yahweh comme Dieu d’Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de מִלֵּא אַחֲרֵי
  choice: a suivi pleinement
  alternative: a suivi Yahweh de tout son cœur
  rationale: La formulation retenue conserve l’image verbale du texte et son idée de loyauté complète sans ajouter explicitement la notion de « cœur », absente de l’expression hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement causal de l’hébreu sans être littérale au point de devenir obscure. Le marqueur de note est placé après « jusqu’à ce jour » conformément au texte de consultation, bien que la note explique l’expression située plus loin dans le verset.
