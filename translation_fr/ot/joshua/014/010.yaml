id: JOS.14.10
reference: Joshua 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: fr
  text: Et maintenant, voici que Yahweh m’a gardé en vie[a], comme il l’avait dit, durant ces quarante-cinq années qui se sont écoulées depuis que Yahweh a adressé cette parole[b] à Moïse, tandis qu’Israël marchait dans le désert[c]. Et maintenant, voici que j’ai aujourd’hui quatre-vingt-cinq ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a conservé en vie ».'
    reason: lexical_alternative
  - marker: b
    text: « Cette parole » peut aussi se traduire par « cette affaire » ou, de manière plus interprétative, « cette promesse ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tandis qu’Israël cheminait dans le désert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: m’a gardé en vie
  rationale: Le hiphil de חיה exprime ici la conservation de la vie de Caleb jusqu’au moment présent. « Gardé en vie » est naturel en français et convient au contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: comme il l’avait dit
  rationale: Le plus-que-parfait situe naturellement la parole divine avant les quarante-cinq années écoulées, sans préciser davantage qu’il s’agit formellement d’une promesse.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: pendant ces quarante-cinq années
  rationale: Cette formulation rend la durée écoulée jusqu’au présent tout en conservant la valeur déictique de זֶה.
- source_word: מֵאָז
  choice: depuis que
  rationale: Cette locution introduit clairement en français le point de départ de la période.
- source_word: הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: דבר désigne ici ce que Yahweh a dit à Moïse. « Parole » reste proche de l’hébreu sans imposer l’interprétation plus précise de « promesse ».
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: tandis qu’Israël marchait dans le désert
  rationale: « Marchait » conserve l’image de הלך et « tandis que » rend la relation temporelle de la proposition.
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » conserve la fonction d’appel à l’attention et l’emphase rhétorique dans un français digne et courant.
- source_word: אָנֹכִי הַיּוֹם
  choice: j’ai aujourd’hui
  rationale: Ordre idiomatique français qui maintient l’accent sur la situation présente de Caleb.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: quatre-vingt-cinq ans
  rationale: L’idiome hébreu « fils de quatre-vingt-cinq ans » se rend naturellement par l’expression française de l’âge.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; la transcription « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Portée de הַדָּבָר הַזֶּה
  choice: cette parole
  alternative: cette promesse
  rationale: Le contexte permet de comprendre une promesse, mais le nom דבר demeure plus large. « Cette parole » conserve cette latitude sémantique et évite de résoudre implicitement l’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « Et maintenant, voici » conserve l’insistance rhétorique de l’hébreu. Les deux emplois de Yahweh sont maintenus, ainsi que l’image d’Israël marchant dans le désert.
