revisions:
- from: Dès que la plante des pieds des prêtres qui portent l’arche de Yahweh[a], le Seigneur de toute la terre, reposera dans les eaux du Jourdain, les eaux qui descendent d’en haut seront coupées dans le Jourdain[b] et se dresseront en un seul amas.
  to: Dès que les plantes des pieds des prêtres qui portent l’arche de Yahweh[a], le Seigneur de toute la terre, se poseront dans les eaux du Jourdain, les eaux du Jourdain seront coupées, et les eaux qui descendent d’en haut[b] se dresseront en un seul amas.
  rationale: La révision corrige le pluriel concret de l’expression des pieds, rétablit la répétition signifiante de « les eaux du Jourdain » et déplace la note lexicale vers le segment qu’elle commente. Elle préserve l’ambiguïté syntaxique signalée par la note a et l’imagerie de l’hébreu.
