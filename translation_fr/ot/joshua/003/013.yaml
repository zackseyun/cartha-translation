review_pass:
  verdict: revise
  source_fidelity: La version conserve correctement l’action conditionnelle, les plantes des pieds, les prêtres portant l’arche, le nom Yahweh et le titre apposé. Toutefois, elle efface la répétition de « les eaux du Jourdain » présente dans l’hébreu et place la note b sur « Jourdain », alors que son alternative (« venant d’amont ») explique « qui descendent d’en haut ».
  naturalness: « La plante des pieds ... reposera » est grammaticalement possible si « plante » est pris comme noyau singulier, mais peu naturel avec des pieds pluriels. « Les plantes des pieds ... se poseront » est plus fluide. La formulation révisée rétablit également une articulation plus claire entre les eaux coupées et les eaux venant d’en haut.
  terminology: « Yahweh », « Seigneur de toute la terre », « arche », « prêtres » et « plantes des pieds » conviennent au français international moderne. « Seront coupées » conserve volontairement l’image du verbe hébreu, sans imposer une explication interprétative.
  issues:
  - severity: medium
    issue: Accord et idiome de « la plante des pieds ... reposera »
    rationale: Le référent concret est pluriel, comme en hébreu (« plantes des pieds »). Employer le pluriel et le verbe « se poseront » est plus naturel et rend mieux l’entrée effective dans l’eau.
  - severity: medium
    issue: La répétition de « les eaux du Jourdain » n’est pas rendue
    rationale: Le texte hébreu nomme d’abord « les eaux du Jourdain » comme ce qui sera coupé, puis qualifie les eaux qui descendent d’en haut. La révision conserve cette répétition sans l’alourdir indûment.
  - severity: medium
    issue: Ancrage inadéquat de la note b
    rationale: La note « les eaux venant d’amont » explicite « les eaux qui descendent d’en haut », non le nom « Jourdain ». Le marqueur doit donc suivre cette expression.
