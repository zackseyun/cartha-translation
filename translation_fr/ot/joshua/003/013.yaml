source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: fr
  text: Dès que les plantes des pieds des prêtres qui portent l’arche de Yahweh[a], le Seigneur de toute la terre, se poseront dans les eaux du Jourdain, les eaux du Jourdain seront coupées, et les eaux qui descendent d’en haut[b] se dresseront en un seul amas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’arche du Seigneur de toute la terre ». L’hébreu permet de rattacher étroitement « Seigneur de toute la terre » à « arche » ; le texte principal le comprend comme un titre en apposition à Yahweh.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « les eaux venant d’amont ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: Dès que ... reposera
  rationale: La construction introduit une circonstance future et כְּנוֹחַ exprime le moment où les pieds viennent se poser. « Dès que » rend naturellement la valeur temporelle immédiate dans ce contexte.
- source_word: כַּפּוֹת רַגְלֵי
  choice: la plante des pieds
  rationale: כַּף désigne ici la face inférieure du pied. L’expression française usuelle et précise est « la plante des pieds ».
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: les prêtres qui portent l’arche
  rationale: Le participe נֹשְׂאֵי caractérise les prêtres comme porteurs de l’arche. « Qui portent » est moderne, clair et fidèle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui distingue יְהוָה du titre אֲדוֹן présent juste après.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: le Seigneur de toute la terre
  rationale: « Seigneur » exprime le titre de souveraineté universelle porté par אֲדוֹן, tout en restant distinct du nom propre Yahweh.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: dans les eaux du Jourdain
  rationale: La préposition בְּ marque ici le contact et la position dans l’eau du fleuve.
- source_word: יִכָּרֵתוּן
  choice: seront coupées
  rationale: Le niphal de כרת évoque littéralement des eaux retranchées ou coupées. Cette image forte est conservée plutôt qu’aplanie en « s’arrêteront ».
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: les eaux qui descendent d’en haut
  rationale: La formulation conserve l’image spatiale de la source hébraïque; dans le contexte d’un fleuve, elle désigne les eaux venant de l’amont.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: et se dresseront en un seul amas
  rationale: יַעַמְדוּ signifie qu’elles se tiendront ou se dresseront, tandis que נֵד décrit une masse d’eau amoncelée. La formulation reste concrète et naturelle en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel et permet de le distinguer du titre אֲדוֹן, « le Seigneur ».
- issue: Rapport syntaxique de « le Seigneur de toute la terre » avec ce qui précède
  choice: 'Titre en apposition à Yahweh : « l’arche de Yahweh, le Seigneur de toute la terre »'
  alternative: « l’arche du Seigneur de toute la terre »
  rationale: La suite hébraïque permet les deux rattachements. Le texte principal comprend אֲדוֹן כָּל הָאָרֶץ comme un titre apposé à Yahweh, tandis que la note conserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel de l’annonce est conservé sans archaïsmes. « Se dresseront en un seul amas » maintient l’image miraculeuse concrète, tandis que les notes signalent les ambiguïtés réelles du rattachement syntaxique et de l’expression spatiale.
