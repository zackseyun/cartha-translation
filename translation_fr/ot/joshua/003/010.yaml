  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: fr
  text: 'Josué dit : « À ceci vous reconnaîtrez que le Dieu vivant est au milieu de vous et qu’il chassera assurément de devant vous les Cananéens, les Hittites, les Hivites, les Perizzites, les Guirgashites, les Amorites et les Jébusites. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Josué dit
  rationale: Le wayyiqtol poursuit le récit et introduit directement les paroles de Josué ; en français, « dit » suffit naturellement sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: בְּזֹאת
  choice: À ceci
  rationale: Le démonstratif renvoie au signe ou à l’événement qui permettra au peuple de reconnaître l’action de Dieu. « À ceci » reste proche de l’hébreu tout en étant idiomatique.
- source_word: תֵּדְעוּן
  choice: vous reconnaîtrez
  rationale: L’imparfait hébreu a ici une valeur future. « Reconnaîtrez » exprime une connaissance acquise grâce au signe annoncé, sans exclure le sens simple de « saurez ».
- source_word: אֵל חַי
  choice: le Dieu vivant
  rationale: Cette formulation française consacrée et naturelle rend la valeur qualitative et définie de l’expression, sans substituer le nom divin YHWH, absent du verset.
- source_word: בְּקִרְבְּכֶם
  choice: au milieu de vous
  rationale: L’expression désigne la présence de Dieu au sein du peuple ; elle évite la possible lecture individualiste de « en vous ».
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: il chassera à coup sûr
  rationale: La construction infinitif absolu + verbe conjugué souligne la certitude de l’action. « Chassera » rend clairement l’expulsion, tandis que « à coup sûr » conserve l’intensification.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: 'Cette expression conserve l’image spatiale hébraïque : les peuples seront écartés de la route et de la présence d’Israël.'
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: les Cananéens ... les Jébusites
  rationale: Les formes hébraïques sont des singuliers collectifs ; les noms de peuples au pluriel sont naturels en français.
theological_decisions:
- issue: Désignation de Dieu par אֵל חַי plutôt que par le nom YHWH
  choice: le Dieu vivant
  alternative: le Dieu qui vit
  rationale: Le texte porte אֵל חַי et non le tétragramme. « Le Dieu vivant » rend directement l’affirmation théologique sans introduire le nom d’alliance absent de cette phrase.
- issue: Force et portée du verbe de conquête
  choice: il chassera à coup sûr
  alternative: il dépossédera certainement
  rationale: La traduction conserve à la fois l’expulsion effective des peuples et l’emphase de la construction hébraïque, sans atténuer l’action ni lui ajouter une justification théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe convient à une proclamation publique. Les ethnonymes suivent les formes françaises bibliques courantes ; l’emphase hébraïque est rendue sans archaïsme par « à coup sûr ».
