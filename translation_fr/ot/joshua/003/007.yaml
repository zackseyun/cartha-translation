  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: fr
  text: 'Yahweh dit à Josué : « Aujourd’hui, je commencerai à te rendre grand aux yeux de tout Israël, afin qu’ils sachent que je serai avec toi comme j’ai été avec Moïse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre, conformément au texte hébreu.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Équivalent narratif naturel du wayyiqtol de אמר en français.
- source_word: הַיּוֹם הַזֶּה
  choice: Aujourd’hui
  rationale: Rend naturellement l’expression « ce jour-ci » tout en conservant son accent temporel.
- source_word: אָחֵל
  choice: je commencerai
  rationale: Le hiphil exprime ici le commencement; le futur convient à la déclaration portant sur l’action imminente.
- source_word: גַּדֶּלְךָ
  choice: à te rendre grand
  rationale: Conserve le sens causatif du piel de גדל et l’idée d’élever publiquement la stature de Josué.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: aux yeux de tout Israël
  rationale: Reproduit fidèlement l’image hébraïque, idiomatique aussi en français, concernant la perception publique.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: afin qu’ils sachent
  rationale: Exprime naturellement la finalité, sans exclure la nuance de résultat possible dans la proposition hébraïque.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: comme j’ai été avec Moïse
  rationale: Préserve la comparaison explicite entre la présence de Dieu auprès de Moïse et auprès de Josué.
- source_word: אֶהְיֶה עִמָּךְ
  choice: je serai avec toi
  rationale: Rend directement la promesse future de la présence divine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel au lieu de le remplacer par un titre.
- issue: Nature de l’élévation promise à Josué
  choice: te rendre grand aux yeux de tout Israël
  alternative: t’exalter devant tout Israël
  rationale: La formulation garde l’idée d’une stature publiquement reconnue sans préciser davantage la nature de cette grandeur ni lui imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative de l’hébreu est conservée, tandis que la phrase reste fluide pour une lecture publique.
