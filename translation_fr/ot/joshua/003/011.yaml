id: JOS.3.11
reference: Joshua 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: fr
  text: Voici, l’arche de l’alliance du Seigneur de toute la terre passe devant vous dans le Jourdain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre dans le Jourdain ». Avec ce verbe de mouvement, l’hébreu peut exprimer l’entrée dans le fleuve, bien que la préposition signifie littéralement « dans ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Particule qui attire vivement l’attention. « Voici » conserve la solennité du récit biblique tout en restant courant et immédiatement compréhensible en français.
- source_word: אֲרוֹן הַבְּרִית
  choice: l’arche de l’alliance
  rationale: Rend directement la relation construite de l’hébreu et correspond à l’expression française consacrée, claire pour les lecteurs modernes.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: du Seigneur de toute la terre
  rationale: אָדוֹן exprime ici la souveraineté. « Seigneur » garde le poids du titre sans ajouter de précision doctrinale. Le rattachement par « du » rend la relation naturelle avec « l’arche de l’alliance » et évite que la ponctuation française identifie involontairement l’arche elle-même au Seigneur.
- source_word: עֹבֵר
  choice: passe
  rationale: Le participe hébreu dépeint une action en cours ou imminente. En français narratif, le présent « passe » restitue cette vivacité sans la lourdeur de « est en train de passer ».
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: Dans ce contexte de déplacement, l’expression signifie que l’arche avance en tête du peuple. « Devant vous » est naturel et fidèle.
- source_word: בַּיַּרְדֵּן
  choice: dans le Jourdain
  rationale: La préposition בְּ signifie littéralement « dans », tandis que le verbe de mouvement peut donner à l’ensemble une nuance directionnelle. Le texte principal conserve la formulation la plus proche, et la note signale l’autre possibilité contextuelle.
theological_decisions:
- issue: Rattachement de אֲדוֹן כָּל הָאָרֶץ
  choice: l’arche de l’alliance du Seigneur de toute la terre
  alternative: l’arche de l’alliance, le Seigneur de toute la terre
  rationale: La formulation retenue comprend le titre comme désignant celui à qui appartient l’arche de l’alliance. Elle évite une apposition française qui semblerait identifier l’arche au Seigneur, tout en maintenant l’affirmation de sa souveraineté universelle.
- issue: Titre divin אֲדוֹן
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le titre français biblique naturel et digne; « Maître » est lexicalement possible, mais convient moins à cette formule de souveraineté universelle.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase reste concise et solennelle; elle évite à la fois l’archaïsme marqué et une paraphrase explicative.
