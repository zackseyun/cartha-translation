  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: fr
  text: Josué se leva de bon matin. Puis Josué et tous les fils d’Israël[a] partirent de Shittim et arrivèrent au Jourdain. Ils y passèrent la nuit avant de le traverser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les Israélites ». Hébreu : « tous les fils d’Israël ».'
    reason: Alternative lexicale et explicitation de l’expression collective hébraïque.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: se leva de bon matin
  rationale: Cette tournure française naturelle rend à la fois l’idée de se lever tôt portée par le verbe et la précision temporelle « le matin ».
- source_word: וַיִּסְעוּ
  choice: ils partirent
  rationale: Dans un récit de déplacement, le verbe indique la levée du camp et le départ; « partirent » est clair et idiomatique.
- source_word: מֵהַשִּׁטִּים
  choice: de Shittim
  rationale: Le terme est ici un nom de lieu; la translittération conserve le toponyme plutôt que d’en traduire le sens possible, « Acacias ».
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: arrivèrent au Jourdain
  rationale: La construction exprime le fait d’atteindre le Jourdain; cette formulation française rend naturellement le point d’arrivée.
- source_word: הוּא וְכָל בְּנֵי יִשְׂרָאֵל
  choice: lui et tous les fils d’Israël
  rationale: « Lui » conserve la reprise explicite de Josué, tandis que « fils d’Israël » reflète la forme de l’expression hébraïque; l’équivalent collectif plus idiomatique est signalé en note.
- source_word: וַיָּלִנוּ שָׁם
  choice: ils y passèrent la nuit
  rationale: Le verbe désigne le fait de demeurer en un lieu pendant la nuit; « y passèrent la nuit » est précis et courant.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: avant de traverser
  rationale: Le contexte rend évident qu’il s’agit de traverser le Jourdain; l’infinitif français évite une répétition lourde tout en conservant le rapport temporel.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites
  rationale: Aucun enjeu doctrinal particulier n’est tranché ici. Le texte principal expose la forme de l’expression de parenté hébraïque, tandis que la note donne son équivalent collectif naturel en français.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; « de bon matin » reste courant et met en valeur le départ matinal. La ponctuation répartit la longue chaîne hébraïque en trois phrases lisibles sans modifier sa progression.
