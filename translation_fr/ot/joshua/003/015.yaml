  to: Quand ceux qui portaient l’arche arrivèrent au Jourdain et que les pieds des prêtres qui portaient l’arche entrèrent dans l’eau au bord du fleuve[a] — le Jourdain était alors en crue et débordait sur toutes ses rives pendant toute la saison de la moisson[b] —,
