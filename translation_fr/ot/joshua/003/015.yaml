source:
  edition: WLC
  text: וּ/כְ/ב֞וֹא נֹשְׂאֵ֤י הָֽ/אָרוֹן֙ עַד הַ/יַּרְדֵּ֔ן וְ/רַגְלֵ֤י הַ/כֹּֽהֲנִים֙ נֹשְׂאֵ֣י הָֽ/אָר֔וֹן נִטְבְּל֖וּ בִּ/קְצֵ֣ה הַ/מָּ֑יִם וְ/הַ/יַּרְדֵּ֗ן מָלֵא֙ עַל כָּל גְּדוֹתָ֔י/ו כֹּ֖ל יְמֵ֥י קָצִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: fr
  text: Quand ceux qui portaient l’arche arrivèrent au Jourdain et que les pieds des prêtres qui portaient l’arche entrèrent dans l’eau au bord du fleuve[a] — le Jourdain était alors en crue et débordait sur toutes ses rives pendant toute la saison de la moisson[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « dans l’extrémité de l’eau » : les pieds des prêtres pénétrèrent dans l’eau à son bord.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, pendant la saison de la moisson, le Jourdain était en crue et sortait de son lit.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְב֞וֹא
  choice: Quand… arrivèrent
  rationale: La conjonction avec la préposition temporelle et l’infinitif construit introduit une proposition temporelle. Cette formulation française rend naturellement la succession du récit.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: ceux qui portaient l’arche
  rationale: Le participe désigne les personnes chargées de porter l’arche. La répétition hébraïque est conservée dans les deux propositions.
- source_word: עַד הַיַּרְדֵּן
  choice: arrivèrent au Jourdain
  rationale: עַד indique que le mouvement atteint sa limite, ici le bord du fleuve. En français, « arriver au Jourdain » exprime clairement ce mouvement sans suggérer qu’ils l’avaient déjà traversé.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: et que les pieds des prêtres
  rationale: Le groupe construit est rendu directement, tout en coordonnant naturellement les deux propositions temporelles en français.
- source_word: נִטְבְּלוּ
  choice: entrèrent dans l’eau
  rationale: Le niphal de טבל signifie que les pieds furent plongés ou trempés. Dans ce contexte, cette expression naturelle indique leur entrée effective dans l’eau sans exagérer la profondeur.
- source_word: בִּקְצֵה הַמָּיִם
  choice: dans l’eau au bord du fleuve
  rationale: 'L’expression signifie littéralement « dans l’extrémité/le bord de l’eau » : les pieds pénètrent dans l’eau à sa lisière. La formulation française préserve ces deux aspects.'
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: le Jourdain déborde sur toutes ses rives
  rationale: מָלֵא avec la locution suivante décrit un fleuve plein au-delà de ses rives. « Déborde » rend clairement l’état de crue, tandis que « sur toutes ses rives » conserve l’étendue exprimée par כָּל.
- source_word: כֹּל יְמֵי קָצִיר
  choice: pendant toute la saison de la moisson
  rationale: L’expression couvre l’ensemble de la période des moissons. « Saison de la moisson » est idiomatique en français moderne et conserve la valeur temporelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste ouverte par une virgule parce que le verset se poursuit syntaxiquement au verset suivant. Les tirets signalent l’information circonstancielle sur la crue du Jourdain.
