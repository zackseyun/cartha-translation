  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les porteurs arrivent au Jourdain et les pieds des prêtres entrent dans l’eau à sa lisière. Toutefois, la remarque parenthétique hébraïque décrit l’état du Jourdain dans le cadre narratif ; le présent « déborde » crée un décalage temporel injustifié. La formulation révisée rend גם מלא על כל גדותיו comme une crue qui dépasse les rives, sans atténuer l’image.'
  naturalness: La phrase révisée conserve l’ouverture syntaxique voulue par la suite au verset 16. « Était en crue et débordait sur toutes ses rives » est plus idiomatique et cohérent au passé que « déborde sur toutes ses rives ».
  terminology: « Arche », « Jourdain », « prêtres » et « moisson » sont appropriés. « Entrèrent dans l’eau au bord du fleuve » exprime de façon naturelle que les pieds furent trempés à la marge de l’eau ; la note maintient la précision lexicale.
  issues:
