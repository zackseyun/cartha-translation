  yaml_path: translation/ot/joshua/003/012.yaml
  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: fr
  text: Maintenant, prenez douze hommes parmi les tribus d’Israël, un homme par tribu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme, un homme pour la tribu » ; cette répétition hébraïque exprime une répartition : un représentant de chaque tribu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit l’instruction suivante. « Maintenant » rend naturellement la transition discursive sans qu’il soit nécessaire d’expliciter la conjonction וְ.
- source_word: קְחוּ לָכֶם
  choice: prenez parmi vous
  rationale: L’impératif de לקח accompagné de לָכֶם demande au groupe de prendre ou choisir des hommes pour cette mission. Dans ce contexte, « parmi vous » exprime naturellement la sélection au sein d’Israël.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: douze hommes
  rationale: אִישׁ désigne ici des représentants masculins; « hommes » conserve cette précision.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: choisis dans les tribus d’Israël
  rationale: La préposition מִן indique l’origine des hommes. L’ajout explicatif « choisis » découle du contexte de sélection et produit une phrase française claire sans changer le référent.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: un homme par tribu
  rationale: 'La répétition hébraïque a une valeur distributive: chaque tribu doit fournir un seul représentant. « Un homme par tribu » est la formulation française la plus concise et naturelle.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure est légèrement réorganisée pour éviter l’ambiguïté possible de « douze hommes des tribus d’Israël, un par tribu », tout en conservant le commandement et la valeur distributive de l’hébreu.
