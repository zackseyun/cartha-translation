source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: fr
  text: 'Josué dit aux fils d’Israël[a] : « Venez ici et écoutez les paroles de Yahweh, votre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « aux Israélites ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: Alternative lexicale et précision sur la forme littérale de la désignation collective hébraïque.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative ordinaire qui introduit ici un discours direct ; « dit » est naturel et précis en français.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Rend de façon transparente l’expression hébraïque littérale, tout en signalant en note les équivalents collectifs courants.
- source_word: גֹּשׁוּ הֵנָּה
  choice: Venez ici
  rationale: L’impératif de נגשׁ appelle les destinataires à s’approcher, et הֵנָּה indique un mouvement vers le lieu du locuteur. « Venez ici » exprime naturellement les deux éléments en français moderne.
- source_word: וְשִׁמְעוּ
  choice: et écoutez
  rationale: Dans cet appel direct, שׁמע demande une attention volontaire. « Écoutez » est plus idiomatique que « entendez » sans ajouter l’idée plus forte d’obéir.
- source_word: אֶת דִּבְרֵי
  choice: les paroles de
  rationale: Conserve le pluriel concret דִּבְרֵי et évite de réduire interprétativement l’expression à un unique « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici, avec le suffixe pluriel de deuxième personne, le Dieu unique d’Israël ; le singulier français est donc requis.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » maintient le nom personnel et le distingue d’un titre substitutif.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël ; les Israélites
  rationale: L’expression est formellement masculine plurielle mais fonctionne comme désignation ethnique collective. Le texte principal en conserve la forme, tandis que la note indique les formulations françaises qui explicitent cette portée collective.
translation_notes:
  register: Français international moderne, direct et digne. Le discours garde deux impératifs coordonnés et un vocabulaire accessible ; la formulation littérale « fils d’Israël » est accompagnée d’une note afin d’éviter toute ambiguïté sur sa fonction collective.
