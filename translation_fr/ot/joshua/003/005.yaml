  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: fr
  text: 'Puis Josué dit au peuple : « Consacrez-vous, car demain le Seigneur accomplira des prodiges au milieu de vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: Consacrez-vous
  rationale: L’impératif réfléchi exprime le fait de se rendre prêt et saint en vue de l’action divine; « consacrez-vous » conserve cette dimension cultuelle sans préciser des rites que le verset ne nomme pas.
- source_word: נִפְלָאוֹת
  choice: des prodiges
  rationale: Le terme désigne des actes extraordinaires suscitant l’émerveillement; « prodiges » convient au registre biblique tout en restant compréhensible.
- source_word: בְּקִרְבְּכֶם
  choice: au milieu de vous
  rationale: Cette expression rend directement l’idée spatiale et communautaire de l’action du Seigneur parmi le peuple.
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Conforme à l’usage français courant de représentation du tétragramme, sans ajouter de note inutile dans ce verset.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français le motif de l’ordre donné, sans surinterpréter la relation logique.
theological_decisions:
- issue: Nature de la préparation demandée au peuple
  choice: « Consacrez-vous » sans explicitation
  alternative: « Purifiez-vous » ou ajout de pratiques rituelles précises
  rationale: Le texte demande une sanctification ou consécration de soi, mais ne détaille ici ni rite ni procédure; la traduction préserve cette ouverture.
- issue: Localisation de l’action divine
  choice: « au milieu de vous »
  alternative: « parmi vous » ou « en vous »
  rationale: « Au milieu de vous » préserve la portée collective et évite de transformer l’expression en affirmation d’une action intérieure propre à chaque individu.
translation_notes:
  register: Français moderne, digne et oralement fluide. Le passé simple « dit » convient au récit biblique soutenu; « accomplira des prodiges » conserve la solennité sans archaïsme excessif.
