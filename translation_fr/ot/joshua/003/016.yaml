source:
  edition: WLC
  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: fr
  text: 'Les eaux qui descendaient d’en amont s’arrêtèrent[a] : elles s’élevèrent en un seul amas, très loin, à Adam, la ville située à côté de Tsartân. Quant aux eaux qui descendaient vers la mer de l’Araba, la mer Salée, elles furent complètement arrêtées. Et le peuple traversa en face de Jéricho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se tinrent immobiles ». L’hébreu décrit littéralement les eaux comme se tenant debout, puis comme formant un seul amas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: s’arrêtèrent
  rationale: Dans ce contexte, עמד décrit l’interruption du mouvement des eaux. « S’arrêtèrent » exprime naturellement en français la cessation de l’écoulement.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: les eaux qui descendaient d’en amont
  rationale: L’expression désigne les eaux venant de la partie supérieure du cours du fleuve. « D’en amont » conserve le sens directionnel et géographique.
- source_word: קָמוּ נֵד אֶחָד
  choice: elles s’élevèrent en un seul amas
  rationale: קום avec נֵד représente les eaux dressées et amassées en une masse unique. Cette formulation préserve l’image concrète sans l’expliquer excessivement.
- source_word: הַרְחֵק מְאֹד
  choice: très loin
  rationale: La construction intensifie l’éloignement ; « très loin » est direct et naturel.
- source_word: בְאָדָם
  choice: à Adam
  rationale: אָדָם est ici un nom de lieu, non le nom commun désignant l’être humain.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: la ville située à côté de Tsartân
  rationale: מִצַּד indique la proximité ou la position adjacente. « À côté de » conserve cette indication sans la réduire au sens plus vague de « près de ».
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: Quant aux eaux qui descendaient vers la mer de l’Araba
  rationale: Le participe reprend implicitement « les eaux », tandis que עַל a ici une valeur directionnelle. L’ajout explicite d’« eaux » évite une ambiguïté grammaticale en français.
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Traduction directe de la désignation hébraïque, préférable dans le texte principal au nom plus tardif « mer Morte ».
- source_word: תַּמּוּ נִכְרָתוּ
  choice: elles furent entièrement coupées
  rationale: Les deux verbes associés soulignent la cessation totale du courant en aval. « Entièrement » rend leur force cumulative.
- source_word: וְהָעָם עָבְרוּ
  choice: Et le peuple traversa
  rationale: Dans le contexte narratif, עבר désigne la traversée du Jourdain ; le verbe français suffit sans complément répété.
- source_word: נֶגֶד יְרִיחוֹ
  choice: en face de Jéricho
  rationale: נֶגֶד situe le passage vis-à-vis de Jéricho. « En face de » est idiomatique et géographiquement précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe distingue clairement les eaux d’amont de celles qui continuaient vers la mer de l’Araba. Les toponymes suivent une translittération française lisible, et la désignation hébraïque « mer Salée » est conservée.
