base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: fr
  text: Toutefois, il y aura entre vous et elle une distance mesurée d’environ deux mille coudées[a]. Ne vous approchez pas d’elle, afin que vous sachiez quel chemin suivre, car vous n’avez encore jamais emprunté ce chemin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une unité de longueur ancienne correspondant approximativement à la longueur de l’avant-bras.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « depuis hier et avant-hier », expression idiomatique qui signifie « auparavant » ou « jusqu’à présent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule introduit ici une restriction ou un contraste par rapport à l’ordre précédent; « toutefois » en restitue naturellement la nuance.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: il y aura entre vous et elle une distance
  rationale: Cette formulation conserve la tournure existentielle de l’hébreu. Le pronom féminin renvoie naturellement en français à l’arche, mentionnée dans le contexte.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: une distance mesurée d’environ deux mille coudées
  rationale: « Environ » rend la valeur approximative de כְּ; l’unité ancienne est conservée, tandis que « mesurée » intègre בַּמִּדָּה dans une formulation française fluide.
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: Ne vous approchez pas d’elle
  rationale: Rend directement l’interdiction, avec le pronom correspondant à « l’arche » en français.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: afin que vous sachiez
  rationale: Exprime explicitement le but, comme la construction hébraïque.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: quel chemin suivre
  rationale: Formulation française naturelle qui conserve l’idée de connaître la route à emprunter sans ajouter une obligation modale absente du verbe hébreu.
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: car vous n’êtes jamais passés par ce chemin
  rationale: « Passer par ce chemin » restitue le sens spatial de עָבַר et reste idiomatique en français.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: auparavant
  rationale: Cette expression idiomatique signifie « précédemment » ou « avant maintenant »; sa forme littérale est signalée en note.
