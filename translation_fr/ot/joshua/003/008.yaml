id: JOS.3.8
reference: Joshua 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: fr
  text: 'Et toi, tu donneras cet ordre aux prêtres qui portent l’arche de l’alliance : « Quand vous arriverez au bord des eaux du Jourdain[a], vous vous tiendrez dans le Jourdain. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la limite des eaux du Jourdain ».'
    reason: Le nom קָצֶה peut désigner le bord, l’extrémité ou la limite. La variante signale cette nuance spatiale sans modifier le sens général.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Et toi
  rationale: Le waw relie l’instruction au récit précédent, tandis que le pronom indépendant met Josué en relief. « Et toi » conserve ces deux nuances en français naturel.
- source_word: תְּצַוֶּה אֶת הַכֹּהֲנִים
  choice: tu donneras cet ordre aux prêtres
  rationale: Le piel de צוה exprime l’ordre que Josué doit transmettre. Cette formulation est plus idiomatique en français que « tu commanderas les prêtres » et prépare clairement la citation.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: qui portent l’arche de l’alliance
  rationale: La proposition relative rend naturellement le participe attributif, et « l’arche de l’alliance » conserve précisément la chaîne construite hébraïque.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement le contenu de l’ordre sans imposer le calque lourd « en disant ».
- source_word: כְּבֹאֲכֶם עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: Quand vous arriverez au bord des eaux du Jourdain
  rationale: La tournure rend la relation temporelle et l’idée d’atteindre la limite des eaux, tout en conservant l’expression hébraïque « eaux du Jourdain ».
- source_word: בַּיַּרְדֵּן תַּעֲמֹדוּ
  choice: vous vous tiendrez dans le Jourdain
  rationale: Le verbe עמד signifie ici prendre position ou se tenir debout. Le futur français maintient la forme directive solennelle de l’imparfait hébreu sans préciser à tort s’il faut simplement s’arrêter ou demeurer sur place.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier distingue l’ordre adressé à Josué du vouvoiement pluriel employé dans la citation adressée aux prêtres. Le marqueur de note est placé après la proposition à laquelle il se rapporte.
