  text: And at the end of three days[a], the officers went through the midst of the camp.
translation:
  language: fr
  text: Au bout de trois jours, les responsables passèrent au milieu du camp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[intégré à la proposition temporelle]'
  rationale: Cette forme sert ici de transition narrative. En français moderne, il est plus naturel de l’intégrer à « Au bout de trois jours » que de traduire littéralement par « il arriva que ».
- source_word: מִקְצֵה
  choice: Au bout de
  rationale: Dans cet emploi temporel, l’expression désigne le terme d’une période. « Au bout de » conserve cette idée de limite tout en étant idiomatique.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: trois jours
  rationale: Traduction directe de l’expression numérique et temporelle.
- source_word: וַיַּעַבְרוּ
  choice: parcoururent
  rationale: Avec le complément désignant l’intérieur du camp, le verbe exprime un déplacement à travers celui-ci. « Parcoururent » est naturel et suggère que les responsables circulèrent dans le camp; la note conserve une formulation plus proche de la structure hébraïque.
- source_word: הַשֹּׁטְרִים
  choice: les responsables
  rationale: Le terme désigne des agents investis d’une fonction administrative, chargés notamment de transmettre ou de faire appliquer des consignes. « Responsables » convient au contexte sans suggérer spécifiquement des policiers modernes.
- source_word: בְּקֶרֶב הַמַּחֲנֶה
  choice: le camp
  rationale: Avec « parcoururent », le mouvement à l’intérieur du camp est déjà exprimé; cette formulation évite la lourdeur de « parcoururent au milieu du camp ».
- source_word: הַמַּחֲנֶה
  choice: le camp
  rationale: Rendu courant et précis du lieu où Israël est installé.
