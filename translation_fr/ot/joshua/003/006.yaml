  source_fidelity: 'Le sens essentiel est bien rendu : Josué ordonne aux prêtres de prendre l’arche de l’alliance et de passer devant le peuple, puis ceux-ci exécutent l’ordre. Toutefois, « donc » n’est pas exprimé par le récit hébreu et « marchèrent » est plus spécifique que וַיֵּלְכוּ (« ils allèrent »).'
  naturalness: Le français est naturel, clair et d’un registre narratif approprié. « Ils prirent l’arche de l’alliance et allèrent devant le peuple » conserve une formulation tout aussi fluide tout en restant plus près du texte.
