base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: fr
  text: 'Alors Josué dit aux prêtres : « Prenez l’arche de l’alliance et traversez devant le peuple. » Ils prirent l’arche de l’alliance et allèrent devant le peuple.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession en français sans alourdir le texte par un « et » hébraïsant.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent direct et usuel du pluriel défini désignant les officiants cultuels d’Israël.
- source_word: שְׂאוּ
  choice: Prenez
  rationale: Dans ce contexte, נשׂא implique de soulever l’arche afin de la porter. « Prenez » rend naturellement l’ordre en français; « soulevez » insisterait seulement sur le geste initial et « portez » atténuerait la mise en mouvement.
- source_word: אֲרוֹן הַבְּרִית
  choice: l’arche de l’alliance
  rationale: Traduction française consacrée, claire et transparente du groupe construit, sans préciser davantage la relation que ne le fait l’hébreu.
- source_word: וְעִבְרוּ
  choice: et traversez
  rationale: עבר signifie ici franchir ou traverser; le contexte immédiat est celui du passage du Jourdain. Le complément n’étant pas répété dans ce verset, la traduction conserve cette concision.
- source_word: לִפְנֵי הָעָם
  choice: devant le peuple
  rationale: Rend directement la position en avant du peuple tout en conservant la sobriété de l’expression hébraïque.
- source_word: וַיִּשְׂאוּ
  choice: Ils prirent donc
  rationale: La reprise de « prirent » maintient la correspondance lexicale avec l’ordre « Prenez ». « Donc » marque naturellement l’exécution de cet ordre.
- source_word: וַיֵּלְכוּ
  choice: marchèrent
  rationale: הלך désigne le fait d’aller ou de marcher. Ici, « marchèrent » exprime concrètement le déplacement des prêtres porteurs de l’arche, sans ajouter de nuance cérémonielle.
theological_decisions:
- issue: Rendu du vocabulaire de l’alliance dans un contexte cultuel
  choice: l’arche de l’alliance
  alternative: l’arche d’alliance
  rationale: « L’arche de l’alliance » est la formulation française la plus reconnue et traduit sobrement l’association de l’arche avec l’alliance, sans développer une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif est fluide, avec conservation de la répétition structurante « l’arche de l’alliance » et de la formule spatiale « devant le peuple ». Aucun marqueur de note n’est requis.
