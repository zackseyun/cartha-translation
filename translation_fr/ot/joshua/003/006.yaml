    rationale: Le verbe הלך signifie simplement « aller » dans ce contexte. « Marchèrent » peut préciser le mode de déplacement au-delà de ce que dit le texte source.
  revised_text: 'Alors Josué dit aux prêtres : « Prenez l’arche de l’alliance et traversez devant le peuple. » Ils prirent l’arche de l’alliance et allèrent devant le peuple.'
