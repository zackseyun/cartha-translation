  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: fr
  text: 'Ils donnèrent cet ordre au peuple : « Lorsque vous verrez l’arche de l’alliance de Yahweh votre Dieu, et les prêtres lévites[a] qui la portent, vous partirez de l’endroit où vous êtes et vous la suivrez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les prêtres, les Lévites ».'
    reason: Alternative lexicale et syntaxique pour l’apposition hébraïque הַכֹּהֲנִים הַלְוִיִּם.
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: Ils donnèrent cet ordre
  rationale: Le piel de צוה exprime un ordre ou une consigne faisant autorité. Cette tournure est naturelle en français et conserve cette force.
- source_word: הָעָם
  choice: au peuple
  rationale: עם désigne ici collectivement les Israélites assemblés.
- source_word: לֵאמֹר
  choice: ': «'
  rationale: L’infinitif hébreu introduit le discours direct; en français moderne, les deux-points et les guillemets remplissent naturellement cette fonction sans ajouter « en disant ».
- source_word: כִּרְאוֹתְכֶם
  choice: Lorsque vous verrez
  rationale: La construction כ avec l’infinitif construit et le suffixe a ici une valeur temporelle, sans exiger l’idée plus précise d’immédiateté.
- source_word: אֲרוֹן בְּרִית
  choice: l’arche de l’alliance
  rationale: Expression française consacrée et exacte dans ce contexte cultuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement le suffixe de deuxième personne du pluriel dans la formule d’alliance.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  rationale: Cette formulation française naturelle comprend « lévites » comme une précision sur les prêtres, tout en signalant en note la lecture appositionnelle possible.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: qui la portent
  rationale: נשא signifie ici porter; le pronom féminin renvoie naturellement en français à « l’arche ».
- source_word: תִּסְעוּ
  choice: vous partirez
  rationale: נסע exprime le fait de se mettre en route ou de quitter un lieu. Le futur français convient à la consigne donnée sans préciser indûment qu’il faut lever le camp.
- source_word: מִמְּקוֹמְכֶם
  choice: de l’endroit où vous êtes
  rationale: Rend naturellement le sens large de מקום avec le suffixe, sans employer le calque peu idiomatique « de votre lieu ».
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: et vous la suivrez
  rationale: הלך אחרי exprime ici un déplacement derrière l’arche; « suivre » en restitue clairement le sens spatial.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Rapport syntaxique dans הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  alternative: les prêtres, les Lévites
  rationale: L’hébreu permet une construction appositionnelle. Le texte principal donne l’expression française la plus naturelle sans suggérer deux groupes distincts, tandis que la note conserve l’autre analyse formelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe du discours direct est allégée selon l’usage français, et le futur conserve la valeur directive des formes verbales hébraïques.
