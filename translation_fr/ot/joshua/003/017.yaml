source:
  edition: WLC
  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: fr
  text: Les prêtres qui portaient l’arche[a] de l’alliance de Yahweh se tinrent fermement[b] sur la terre sèche, au milieu du Jourdain, tandis que tout Israël traversait sur la terre sèche, jusqu’à ce que toute la nation[c] ait achevé de traverser le Jourdain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, littéralement : « le coffre ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu souligne que les prêtres demeuraient fermement à leur place dans le lit du fleuve.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tout le peuple ». L’hébreu emploie un nom collectif singulier pour Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... הָכֵן
  choice: restèrent fermement en place
  rationale: Le verbe עמד décrit la position debout ou le fait de demeurer à un endroit, et הָכֵן en souligne ici la stabilité. Cette formulation naturelle indique que les prêtres ne bougèrent pas du lit du fleuve.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: les prêtres qui portaient
  rationale: Le participe נֹשְׂאֵי exprime une action en cours et caractérise les prêtres pendant la traversée.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: le coffre de l’alliance de Yahweh
  rationale: « Coffre » rend concrètement אָרוֹן en français moderne, tandis que la suite conserve la relation syntaxique entre le coffre, l’alliance et le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom personnel divin est translittéré plutôt que remplacé par un titre.
- source_word: בֶּחָרָבָה
  choice: sur le sol sec / à pied sec
  rationale: Le terme désigne un terrain devenu sec. La variation française évite une répétition pesante tout en conservant deux fois l’idée miraculeuse d’un passage sans eau.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: au milieu du Jourdain
  rationale: בְּתוֹךְ situe les prêtres à l’intérieur, au milieu du cours du fleuve.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: tandis que tout Israël traversait
  rationale: Le participe présente une action en cours, simultanée à la station des prêtres; « tandis que » explicite naturellement ce rapport temporel.
- source_word: עַד אֲשֶׁר תַּמּוּ כָּל הַגּוֹי לַעֲבֹר
  choice: jusqu’à ce que toute la nation ait fini de traverser
  rationale: La tournure marque l’achèvement complet de la traversée par Israël pris collectivement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve son statut de nom personnel sans le remplacer par un titre.
- issue: Désignation collective d’Israël par גּוֹי
  choice: toute la nation
  alternative: tout le peuple
  rationale: « Nation » conserve le sens collectif singulier de גּוֹי sans introduire de distinction théologique étrangère au contexte.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve le mouvement narratif du verset, la simultanéité des actions et la répétition significative de la traversée sur terrain sec, avec une légère variation idiomatique entre « sur le sol sec » et « à pied sec ».
