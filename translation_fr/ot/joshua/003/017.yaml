revisions:
- from: Les prêtres qui portaient le coffre[a] de l’alliance de Yahweh restèrent fermement en place[b] sur le sol sec, au milieu du Jourdain, tandis que tout Israël traversait à pied sec, jusqu’à ce que toute la nation[c] ait fini de traverser le Jourdain.
  to: Les prêtres qui portaient l’arche[a] de l’alliance de Yahweh se tinrent fermement[b] sur la terre sèche, au milieu du Jourdain, tandis que tout Israël traversait sur la terre sèche, jusqu’à ce que toute la nation[c] ait achevé de traverser le Jourdain.
  rationale: La révision emploie le terme biblique français établi « arche » tout en signalant en note le sens concret du mot hébreu. Elle rend explicitement la position debout et ferme des prêtres, et maintient les deux occurrences de « terre sèche » afin de refléter la répétition du texte source. La construction finale conserve l’achèvement de la traversée par Israël considéré comme une collectivité.
