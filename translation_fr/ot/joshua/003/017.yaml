  timestamp: '2026-07-14T13:06:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « restèrent fermement en place » rend globalement la stabilité, mais ne dit pas explicitement que les prêtres se tenaient debout. « Se tinrent fermement » rend mieux וַיַּעַמְדוּ ... הָכֵן. Le double emploi de « terre sèche » conserve la répétition voulue de בֶּחָרָבָה.'
  naturalness: La phrase révisée est naturelle en français international actuel et garde la simultanéité entre la position des prêtres et le passage d’Israël. « À pied sec » est idiomatique, mais « sur la terre sèche » est plus directement parallèle à la première occurrence et moins susceptible d’ajouter l’idée de marche.
  terminology: « L’arche de l’alliance » est le terme biblique français établi pour הָאָרוֹן בְּרִית. Une note peut signaler le sens concret de « coffre » sans remplacer dans le texte ce terme technique usuel. « Yahweh » et « nation » sont appropriés ici.
  issues:
  - severity: medium
    issue: « coffre » dans le texte principal
    rationale: Bien que אָרוֹן désigne concrètement un coffre, « l’arche de l’alliance » est la désignation biblique française habituelle et immédiatement identifiable. « Coffre de l’alliance » est moins idiomatique comme terme référentiel dans ce contexte; le sens concret peut être préservé en note.
  - severity: low
    issue: « restèrent fermement en place » n’explicite pas la posture de עמד
    rationale: Le verbe hébreu exprime le fait de se tenir debout, avec הָכֵן qui souligne la fermeté. « Se tinrent fermement » préserve plus précisément les deux éléments.
  - severity: low
    issue: Variation « sur le sol sec » / « à pied sec »
    rationale: La variation est défendable, mais la répétition de « terre sèche » reproduit mieux la répétition lexicale de בֶּחָרָבָה et évite la nuance additionnelle possible de « à pied ».
