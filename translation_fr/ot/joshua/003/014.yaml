base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: fr
  text: Lorsque le peuple partit de ses tentes pour traverser le Jourdain, les prêtres qui portaient l’arche de l’alliance étaient devant le peuple[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en tête du peuple ».
    reason: Alternative lexicale pour לִפְנֵי, qui peut souligner que les prêtres se trouvent à l’avant de la procession.
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Quand … quitta
  rationale: La tournure וַיְהִי suivie de בּ et de l’infinitif construit introduit ici la circonstance temporelle du récit. « Quand » la rend naturellement en français moderne sans recourir à l’archaïsant « il arriva que ».
- source_word: הָעָם
  choice: le peuple
  rationale: Désigne collectivement Israël dans ce contexte narratif.
- source_word: מֵאָהֳלֵיהֶם
  choice: ses tentes
  rationale: אֹהֶל désigne concrètement la tente. Le singulier possessif s’accorde avec le collectif français « le peuple ».
- source_word: לַעֲבֹר אֶת־הַיַּרְדֵּן
  choice: pour traverser le Jourdain
  rationale: L’infinitif exprime le but du départ; « traverser » est le verbe français idiomatique pour le franchissement d’un cours d’eau.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: les prêtres qui portaient
  rationale: La construction nominale « les prêtres, porteurs de » est rendue par une relative naturelle qui conserve l’action simultanée.
- source_word: הָאָרוֹן הַבְּרִית
  choice: l’arche de l’alliance
  rationale: Formulation biblique consacrée et précise pour l’objet cultuel associé à l’alliance.
- source_word: לִפְנֵי הָעָם
  choice: devant lui
  rationale: לִפְנֵי indique une position spatiale en avant du peuple. Le pronom évite une répétition lourde sans changer le référent.
