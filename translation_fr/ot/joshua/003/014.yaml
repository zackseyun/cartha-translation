revisions:
- from: Quand le peuple quitta ses tentes pour traverser le Jourdain, les prêtres qui portaient l’arche de l’alliance marchaient devant lui[a],
  to: Lorsque le peuple partit de ses tentes pour traverser le Jourdain, les prêtres qui portaient l’arche de l’alliance étaient devant le peuple[a],
  rationale: La révision supprime le verbe interprétatif « marchaient » et rend la relation spatiale de לִפְנֵי הָעָם par « étaient devant le peuple ». Elle améliore aussi l’expression du départ collectif sans modifier le sens ni la syntaxe ouverte du verset, qui se poursuit au verset suivant.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:06:17Z'
review_pass:
  verdict: revise
  source_fidelity: La relative « qui portaient » rend correctement le participe נֹשְׂאֵי. En revanche, « marchaient devant lui » introduit explicitement l’action de marcher, alors que l’hébreu décrit les prêtres porteurs de l’arche comme étant devant le peuple. « Étaient devant le peuple » préserve mieux cette construction et son caractère descriptif. L’ouverture temporelle « Lorsque » rend naturellement la circonstance introduite par וַיְהִי בִּנְסֹעַ; la formule narrative וַיְהִי n’exige pas en français moderne un équivalent lourd tel que « il arriva que ».
  naturalness: « Partit de ses tentes » est plus idiomatique et plus direct que « quitta ses tentes » pour le départ collectif d’un camp. La répétition de « le peuple » à la fin évite un pronom dont l’antécédent reste certes compréhensible, mais qui est moins explicite dans une phrase déjà longue.
  terminology: « Le Jourdain », « les prêtres » et « l’arche de l’alliance » sont exacts, établis et adaptés à un français international moderne. La note propose une alternative spatiale légitime sans imposer de nuance théologique.
  issues:
  - severity: medium
    issue: Ajout de « marchaient »
    rationale: Le texte hébreu ne dit pas que les prêtres marchaient; il les présente comme porteurs de l’arche placés devant le peuple. Le verbe ajouté est plausible dans le contexte, mais évitable et moins précis.
  - severity: low
    issue: « quitta ses tentes »
    rationale: La formulation est intelligible, mais « partit de ses tentes » rend plus naturellement le départ du peuple depuis son campement.
  revised_text: Lorsque le peuple partit de ses tentes pour traverser le Jourdain, les prêtres qui portaient l’arche de l’alliance étaient devant le peuple[a],
  revised_footnotes:
  - marker: a
    text: Ou « en tête du peuple ».
    reason: Alternative lexicale pour לִפְנֵי, qui peut souligner que les prêtres se trouvent à l’avant de la procession.
  revision_rationale: La révision supprime le verbe interprétatif « marchaient » et rend la relation spatiale de לִפְנֵי הָעָם par « étaient devant le peuple ». Elle améliore aussi l’expression du départ collectif sans modifier le sens ni la syntaxe ouverte du verset, qui se poursuit au verset suivant.
