  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: fr
  text: 'Les descendants de Joseph dirent : « La région montagneuse ne nous suffit pas[a], et tous les Cananéens qui habitent le pays de la vallée ont des chars de fer[b], aussi bien ceux de Beth-Shéân et des localités qui en dépendent[c] que ceux de la vallée de Jizréel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la montagne ne se trouve pas pour nous » ; dans ce contexte, le sens est que la région montagneuse ne suffit pas aux descendants de Joseph.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des chars en fer ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ses filles », expression qui désigne les petites localités dépendant d’une ville principale.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: les descendants de Joseph
  rationale: Littéralement « les fils de Joseph » ; dans ce contexte territorial, l’expression désigne les tribus issues de Joseph. « Descendants » exprime naturellement ce sens collectif.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Dans ce contexte géographique, le terme désigne les hautes terres attribuées aux descendants de Joseph, par opposition au pays de la vallée.
- source_word: לֹא יִמָּצֵא לָנוּ
  choice: ne nous suffit pas
  rationale: La tournure avec le niphal de מצא et לְ exprime ici l’idée de disponibilité ou de suffisance. La traduction littérale « ne se trouve pas pour nous » serait obscure en français.
- source_word: רֶכֶב בַּרְזֶל
  choice: des chars de fer
  rationale: Cette expression militaire est rendue au plus près de la construction hébraïque tout en restant idiomatique en français.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: tous les Cananéens qui habitent
  rationale: Le singulier hébreu a ici une valeur collective ; le pluriel français en restitue clairement le sens.
- source_word: אֶרֶץ הָעֵמֶק
  choice: le pays de la vallée
  rationale: Cette formulation conserve le contraste topographique entre les hautes terres et la région basse sans réduire le terme à une seule vallée précise.
- source_word: בְּבֵית שְׁאָן
  choice: Beth-Shéân
  rationale: Transcription française reconnaissable du nom hébreu.
- source_word: וּבְנוֹתֶיהָ
  choice: des localités qui en dépendent
  rationale: Littéralement « ses filles » ; il s’agit des petites agglomérations rattachées administrativement ou territorialement à la ville principale.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: la vallée de Jizréel
  rationale: Traduction directe et naturelle de cette désignation géographique.
