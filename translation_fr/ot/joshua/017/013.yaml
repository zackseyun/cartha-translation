    issue: Portée de la négation intensifiée
    rationale: '« Ne les chassèrent pas complètement » peut suggérer qu’une expulsion partielle a eu lieu. L’infinitif absolu suivi du verbe conjugué sous négation accentue plus naturellement le refus ou l’absence totale de l’action : « ne les chassèrent absolument pas ».'
  - severity: low
    issue: Formulation elliptique de l’alternative « au tribut » dans la note a
    rationale: « Au tribut » ne formule pas idiomatiquement l’alternative à « soumirent ... au travail forcé ». « Les assujettirent à un tribut » explicite correctement le rapport syntaxique et sémantique.
