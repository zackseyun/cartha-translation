review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : Israël, devenu puissant, impose aux Cananéens une obligation coercitive. Toutefois, l’infinitif absolu הוֹרֵשׁ placé devant la forme verbale négative renforce la négation (« ne les chassèrent absolument pas »), plutôt que d’exprimer nécessairement une expulsion seulement incomplète. La formulation anglaise auditée (« not completely ») reflète une analyse possible, mais le français peut rendre plus directement l’emphase de l’hébreu sans introduire cette implication de partialité.'
  naturalness: Le français est moderne, clair et de registre approprié. « Les fils d’Israël », « devinrent puissants » et « travail forcé » sont naturels dans ce contexte. La note a gagnerait à employer des formulations syntaxiquement complètes et idiomatiques pour ses alternatives.
  terminology: « Travail forcé » rend bien מַס dans ce contexte de domination, avec « corvée » comme alternative utile. « Tribut » reste possible, mais il convient de le formuler comme une mise sous tribut ou un assujettissement à un tribut. « Chasser » convient pour ירש dans ce contexte; « absolument pas » rend l’intensification négative sans imposer une lecture doctrinale ou historique supplémentaire.
  issues:
