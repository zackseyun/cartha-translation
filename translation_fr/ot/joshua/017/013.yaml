  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: fr
  text: Quand les fils d’Israël devinrent puissants, ils soumirent les Cananéens au travail forcé[a], mais ils ne les chassèrent absolument pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les astreignirent à la corvée » ou « les assujettirent à un tribut ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu renforce la négation : « ils ne les chassèrent absolument pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quand
  rationale: La construction introduit ici une nouvelle circonstance dans le récit. En français actuel, « Quand » en restitue naturellement la fonction sans calque lourd tel que « Il arriva que, lorsque ».
- source_word: חָזְקוּ
  choice: devinrent puissants
  rationale: Le verbe חזק exprime ici l’acquisition de force ou de puissance; « devinrent puissants » rend clairement cette valeur ingressive dans le contexte politique et militaire.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale hébraïque, qui fonctionne aussi comme désignation nationale conventionnelle.
- source_word: וַיִּתְּנוּ אֶת הַכְּנַעֲנִי לָמַס
  choice: ils soumirent les Cananéens au travail forcé
  rationale: מַס désigne ici vraisemblablement une corvée ou un service obligatoire. Le singulier collectif « le Cananéen » est rendu par le pluriel naturel en français.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: mais ils ne les chassèrent pas complètement
  rationale: L’infinitif absolu associé au verbe conjugué renforce l’action. « pas complètement » rend cette intensification, tandis que le pronom pluriel reprend naturellement le collectif cananéen.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix retenu préserve la formulation familiale et le masculin grammatical de l’hébreu, sans nier que l’expression sert de désignation nationale.
- issue: Sens de מַס
  choice: travail forcé
  alternative: tribut ou corvée
  rationale: Le contexte évoque la mise sous domination des Cananéens. « Travail forcé » exprime sans l’atténuer le caractère coercitif probable de cette obligation, tout en signalant en note les autres nuances possibles.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative est allégée pour être naturelle en français, tout en conservant « les fils d’Israël ». « Travail forcé » rend la coercition de manière accessible; l’alternative « corvée » figure en note.
