  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: fr
  text: Car les filles de Manassé reçurent un héritage parmi ses fils[a], et le pays de Galaad revint aux fils de Manassé restants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « héritèrent un héritage parmi ses fils ». Le texte souligne que les filles reçurent leur part parmi les fils de Manassé.'
    reason: lexical_and_cultural_note
  - marker: b
    text: 'Ou : « le pays de Galaad était aux fils de Manassé qui restaient ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de la répartition mentionnée précédemment ; « car » en conserve naturellement la valeur explicative.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: les filles de Manassé
  rationale: Le lien construit est rendu directement, et « filles » demeure explicite en raison du contraste juridique avec les fils.
- source_word: נָחֲלוּ נַחֲלָה
  choice: reçurent un héritage
  rationale: Cette formulation française naturelle exprime l’attribution d’un bien héréditaire sans reproduire maladroitement la répétition étymologique de l’hébreu.
- source_word: בְּתוֹךְ בָּנָיו
  choice: parmi ses fils
  rationale: « Parmi » rend בְּתוֹךְ, et « fils » préserve le masculin explicite ainsi que le contraste central entre filles et fils. Le pronom renvoie naturellement à Manassé.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: tandis que le pays de Galaad
  rationale: « Le pays de Galaad » est la désignation territoriale usuelle. « Tandis que » explicite en français le contraste porté par l’enchaînement des deux attributions, sans en modifier le contenu.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: revint aux autres fils de Manassé
  rationale: « Revint à » exprime naturellement ici l’attribution territoriale indiquée littéralement par « fut/était à ». « Les autres fils » désigne ceux qui restent dans cette répartition.
theological_decisions:
- issue: Maintien du contraste entre filles et fils dans le droit successoral
  choice: Conserver explicitement « filles » et « fils »
  alternative: Employer le terme collectif « enfants »
  rationale: Le texte hébreu distingue expressément בְּנוֹת et בָּנִים ; neutraliser cette distinction ferait disparaître un élément essentiel de l’arrangement successoral décrit.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en évitant la répétition peu idiomatique « héritèrent un héritage ». Le contraste successoral entre filles et fils est conservé explicitement.
