revisions:
- from: Car les filles de Manassé reçurent un héritage parmi ses fils[a], tandis que le pays de Galaad revint aux autres fils de Manassé[b].
  to: Car les filles de Manassé reçurent un héritage parmi ses fils[a], et le pays de Galaad revint aux fils de Manassé restants[b].
  rationale: La révision remplace « tandis que » par « et » afin de ne pas ajouter de relation contrastive au waw hébreu, et remplace « autres fils » par « fils ... restants » pour rendre explicitement הַנּוֹתָרִים. Les notes sont conservées avec une légère harmonisation rédactionnelle.
