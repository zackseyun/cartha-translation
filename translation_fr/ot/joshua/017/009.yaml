source:
  edition: WLC
  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: fr
  text: Puis la frontière descendait jusqu’au torrent de Qana[a], au sud du torrent. Ces villes appartenaient à Éphraïm au milieu des villes de Manassé[b]. La frontière de Manassé passait au nord du torrent et aboutissait à la mer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oued de Qana ». Le mot hébreu peut désigner aussi bien un cours d’eau qu’un lit de torrent saisonnier ou un ravin.
    reason: lexical_alternative
  - marker: b
    text: Des villes attribuées à Éphraïm se trouvaient ainsi au sein du territoire attribué à Manassé.
    reason: cultural_note
  - marker: c
    text: Il s’agit ici de la mer Méditerranée.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Puis la frontière descendait
  rationale: Dans les descriptions territoriales, ירד indique que la ligne descend selon le relief ou la direction. L’imparfait français convient à la description suivie du tracé, tandis que « Puis » rend la progression du récit.
- source_word: נַחַל קָנָה
  choice: le torrent de Qana
  rationale: נחל désigne un cours d’eau, souvent intermittent, ou son lit encaissé. « Torrent » est naturel dans le registre géographique biblique français; une note conserve l’alternative « oued ».
- source_word: נֶגְבָּה לַנַּחַל
  choice: au sud du torrent
  rationale: נֶגְבָּה exprime ici la position méridionale de la frontière par rapport au cours d’eau, sans imposer l’idée d’un mouvement vers celui-ci.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: Ces villes appartenaient à Éphraïm
  rationale: La proposition nominale avec לְ indique ici l’appartenance ou l’attribution territoriale.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: au milieu des villes de Manassé
  rationale: בְּתוֹךְ marque l’inclusion de ces villes attribuées à Éphraïm dans l’ensemble territorial associé à Manassé, sans expliciter davantage que le texte.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: La frontière de Manassé passait au nord du torrent
  rationale: מִצְּפוֹן situe la frontière de Manassé sur le côté nord du cours d’eau. « passait » produit une description géographique idiomatique.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: et aboutissait à la mer
  rationale: Dans les formules de délimitation, תֹצְאוֹת désigne le point d’aboutissement d’une frontière. הַיָּמָּה indique la direction ou l’arrivée à la mer.
