  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: fr
  text: 'Tselophchad, fils de Hépher, fils de Galaad, fils de Makir, fils de Manassé, n’avait pas de fils, mais seulement des filles. Voici les noms de ses filles : Mahlah, Noa[a], Hogla, Milca et Thirtsa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noa est ici une fille de Tselophchad, et non le personnage masculin du livre de la Genèse.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: Celofehad
  rationale: La construction avec וְ et לְ introduit ici le cas de Celofehad; en français, le nom placé directement comme sujet rend naturellement cette transition sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: fils de ... fils de ... fils de ... fils de
  rationale: La répétition de « fils de » conserve la chaîne généalogique explicite, importante dans ce contexte d’héritage.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: n’eut pas de fils
  rationale: Cette formulation française idiomatique exprime la possession tout en maintenant la référence précise aux fils, en contraste avec les filles.
- source_word: כִּי אִם בָּנוֹת
  choice: mais seulement des filles
  rationale: La tournure rend l’opposition exclusive exprimée par כִּי אִם après la négation.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Voici les noms de ses filles
  rationale: « Voici » restitue naturellement en français la formule hébraïque qui introduit une liste de noms.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mala, Noa, Hogla, Milka et Tirsa
  rationale: Les noms propres sont translittérés sous des formes françaises bibliques reconnaissables et proches de l’hébreu.
