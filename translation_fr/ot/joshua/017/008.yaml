  text: לִ/מְנַשֶּׁ֕ה הָיְתָ֖ה אֶ֣רֶץ תַּפּ֑וּחַ וְ/תַפּ֛וּחַ אֶל גְּב֥וּל מְנַשֶּׁ֖ה לִ/בְנֵ֥י אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: fr
  text: Le territoire de Tappouah appartenait à Manassé[a], mais Tappouah, à la frontière de Manassé, appartenait aux fils d’Éphraïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Le territoire de Tappouah était à Manassé ; mais Tappouah, à la frontière de Manassé, était aux fils d’Éphraïm. »'
    reason: Conserve plus directement la structure d’attribution elliptique de l’hébreu, sans préciser la nature du second Tappouah.
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: appartenait à Manassé
  rationale: La construction avec ל exprime ici l’attribution territoriale ou la possession; « appartenait à » est naturel en français dans le contexte du partage du pays.
- source_word: אֶרֶץ תַּפּוּחַ
  choice: le pays de Tappouah
  rationale: אֶרֶץ désigne ici l’étendue territoriale associée à Tappouah, par contraste avec la localité elle-même dans la proposition suivante.
- source_word: תַּפּוּחַ
  choice: Tappouah
  rationale: Le nom de lieu est translittéré selon une forme française transparente.
- source_word: וְתַפּוּחַ
  choice: mais la ville de Tappouah
  rationale: Le ו a ici une valeur contrastive. L’ajout explicatif de « la ville de » rend intelligible en français l’opposition contextuelle entre le territoire de Tappouah et Tappouah elle-même, sans l’inscrire dans la note plus formelle.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: située à la frontière de Manassé
  rationale: אֶל avec גְּבוּל situe la localité à la frontière ou près de celle-ci; « à la frontière » conserve la relation spatiale sans préciser davantage.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: appartenait aux descendants d’Éphraïm
  rationale: Dans un contexte tribal, בְּנֵי désigne les membres issus d’Éphraïm. « descendants » est plus naturel et moins susceptible d’être compris comme les seuls fils immédiats.
