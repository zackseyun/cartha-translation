source:
  edition: WLC
  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: fr
  text: La frontière de Manassé allait d’Aser à Mikmetath, qui se trouve en face de Sichem[a]. Puis la frontière se dirigea vers la droite[b], en direction des habitants d’En-Tappouah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est devant Sichem » ou « qui fait face à Sichem ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vers la droite » ; dans une description de frontières, cette expression peut désigner la direction du sud.
    reason: lexical_alternative
  - marker: c
    text: En-Tappouah signifie « source de Tappouah ».
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: frontière
  rationale: Dans le contexte du partage du pays, le terme désigne la ligne délimitant le territoire de Manassé, non l’ensemble du territoire.
- source_word: מֵאָשֵׁר הַמִּכְמְתָת
  choice: d’Aser à Mikmetath
  rationale: La préposition מִן indique le point de départ, Aser, et Mikmetath est compris comme l’étape suivante du tracé; les deux noms géographiques sont translittérés.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: qui se trouve en face de Sichem
  rationale: עַל־פְּנֵי exprime ici une relation spatiale de vis-à-vis sans permettre d’imposer avec certitude une orientation cardinale.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: Puis la frontière se dirigeait
  rationale: הלך décrit idiomatiquement le parcours d’une frontière; cette formulation est naturelle en français tout en conservant la progression du tracé.
- source_word: אֶל־הַיָּמִין
  choice: vers la droite
  rationale: La traduction conserve l’expression hébraïque littérale et laisse en note son interprétation géographique possible comme direction du sud.
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe désigne les personnes qui demeurent dans le lieu; « habitants » est précis et naturel.
- source_word: עֵין תַּפּוּחַ
  choice: En-Tappouah
  rationale: Le toponyme est translittéré dans le texte; son sens lexical est indiqué en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tracé frontalier est formulé naturellement sans préciser une orientation géographique que l’hébreu laisse implicite. Les graphies françaises traditionnelles sont retenues pour Aser et Sichem, tandis que Mikmetath et En-Tappouah sont translittérés de manière lisible.
