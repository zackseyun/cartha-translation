base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: fr
  text: Au sud, le territoire appartenait à Éphraïm, et au nord, à Manassé. La mer en était la frontière. Au nord, ils atteignaient le territoire d’Aser[a], et à l’est, celui d’Issacar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils jouxtaient Aser au nord et Issacar à l’est ». Dans les descriptions territoriales, le verbe hébreu peut signifier « rencontrer », « toucher » ou « jouxter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: Au sud, le territoire appartenait à Éphraïm
  rationale: La forme directionnelle situe le côté sud, tandis que ל marque ici l’attribution territoriale. L’ajout de « le territoire appartenait » explicite en français l’ellipse hébraïque.
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: et au nord, à Manassé
  rationale: La formulation maintient le parallélisme directionnel et sous-entend naturellement le verbe déjà exprimé.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: La mer en était la frontière
  rationale: Traduction directe et idiomatique de la clause qui désigne la limite occidentale du territoire.
- source_word: וּבְאָשֵׁר יִפְגְּעוּן
  choice: ils touchaient au territoire d’Aser
  rationale: Dans les descriptions de frontières, פגע exprime le contact ou la rencontre entre territoires. « Toucher au territoire de » garde cette image géographique tout en restant naturel en français; le pluriel du verbe hébreu est conservé par « ils ».
- source_word: מִצָּפוֹן
  choice: Au nord
  rationale: Dans cette formule territoriale, la préposition indique le côté où se trouve la région limitrophe.
- source_word: וּבְיִשָּׂשכָר מִמִּזְרָח
  choice: et à l’est, à celui d’Issacar
  rationale: Le verbe et le nom « territoire » sont repris elliptiquement, comme en hébreu, tandis que « à l’est » exprime clairement le côté concerné.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe explicite les ellipses indispensables à la compréhension sans effacer le style concis d’une description de frontières. Le pronom pluriel « ils » préserve le nombre du verbe hébreu et laisse ouverte l’identification exacte de son antécédent.
