source:
  edition: WLC
  text: וַ/יִּפְּל֥וּ חַבְלֵֽי מְנַשֶּׁ֖ה עֲשָׂרָ֑ה לְ/בַ֞ד מֵ/אֶ֤רֶץ הַ/גִּלְעָד֙ וְ/הַ/בָּשָׁ֔ן אֲשֶׁ֖ר מֵ/עֵ֥בֶר לַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/005.yaml
  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: fr
  text: Dix portions échurent à Manassé[a], sans compter le pays de Galaad et le Bashân, qui se trouve au-delà du Jourdain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dix lots furent attribués à Manassé » ou « Dix parts revinrent par tirage au sort à Manassé ». L’hébreu emploie littéralement le verbe « tomber » dans le contexte d’un partage territorial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: échurent
  rationale: Dans le contexte du partage du territoire, נפל exprime ce qui revient par le sort. « Échurent » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: חַבְלֵי
  choice: portions
  rationale: חבל peut désigner une étendue mesurée ou une part de territoire. « Portions » rend le résultat du partage sans préciser davantage son mécanisme.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: עֲשָׂרָה
  choice: dix
  rationale: Rend directement le nombre cardinal associé aux portions.
- source_word: לְבַד
  choice: sans compter
  rationale: Cette expression indique que le territoire transjordanien s'ajoute aux dix portions; « sans compter » est naturel et clair en français.
- source_word: מֵאֶרֶץ
  choice: le pays de
  rationale: Après לְבַד, la préposition מִן s'intègre idiomatiquement à l'expression « sans compter le pays de », plutôt que d'être traduite séparément par « de ».
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Galaad et le Bashân
  rationale: Formes françaises usuelles de ces noms géographiques; l'article devant « Bashân » reflète l'article hébreu et l'usage français fréquent.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: qui se trouve au-delà du Jourdain
  rationale: Le singulier reprend collectivement « le pays de Galaad et le Bashân ». « Au-delà du Jourdain » conserve le repérage géographique du texte sans en préciser le point de vue.
theological_decisions: []
