  source_fidelity: 'Le texte rend fidèlement le sens de וַיִּפְּלוּ ... עֲשָׂרָה : dix portions échurent à Manassé. « Sans compter » rend naturellement לְבַד dans ce contexte additif/exclusif. La désignation de Galaad et du Bashân, ainsi que « au-delà du Jourdain », préservent la localisation sans imposer de point de vue géographique supplémentaire. Le singulier de « qui se trouve » peut reprendre l’ensemble territorial de manière collective, comme l’hébreu.'
