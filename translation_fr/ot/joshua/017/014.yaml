base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: fr
  text: 'Les descendants de Joseph dirent à Josué : « Pourquoi m’as-tu donné en héritage un seul lot et une seule portion de territoire[a], car je suis un peuple nombreux, puisque Yahvé m’a béni jusqu’à présent ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une seule étendue de terre ». Le mot hébreu peut désigner une portion de territoire mesurée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: les descendants de Joseph
  rationale: Dans ce contexte tribal, l’expression désigne collectivement les tribus issues de Joseph. « Descendants » est plus naturel et moins susceptible d’être compris comme une référence aux seuls fils immédiats de Joseph.
- source_word: וַיְדַבְּרוּ ... לֵאמֹר
  choice: dirent
  rationale: Le français exprime naturellement la formule hébraïque d’introduction du discours par le seul verbe « dirent », sans reproduire le redondant « parlèrent… en disant ».
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: m’as-tu donné en héritage
  rationale: Cette formulation conserve le don adressé au groupe parlant au singulier et la fonction de la terre comme héritage.
- source_word: גּוֹרָל אֶחָד
  choice: un seul lot
  rationale: « Lot » garde le lien avec l’attribution par tirage au sort; « un seul » fait ressortir la plainte portée par אֶחָד.
- source_word: וְחֶבֶל אֶחָד
  choice: et une seule part de territoire
  rationale: חֶבֶל peut désigner une étendue mesurée ou une portion territoriale. Cette traduction est claire en français tout en la distinguant de גּוֹרָל.
- source_word: וַאֲנִי עַם רָב
  choice: alors que je forme un peuple nombreux
  rationale: Le singulier collectif « je » est conservé, tandis que « je forme » rend idiomatique en français l’identification du groupe à un peuple. « Nombreux » exprime ici l’importance démographique.
- source_word: עַד אֲשֶׁר עַד כֹּה
  choice: puisque ... jusqu’à présent
  rationale: La tournure hébraïque comprimée associe le motif invoqué à l’étendue temporelle de la bénédiction. La traduction garde à la fois la valeur causale contextuelle et « jusqu’à présent ».
- source_word: בֵּרְכַנִי
  choice: m’a béni
  rationale: Le verbe ברך signifie normalement « bénir »; le suffixe singulier maintient la voix collective du groupe.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » rend le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » préserve ici le caractère personnel du nom divin dans une forme française largement reconnue.
- issue: Singulier collectif des tribus de Joseph
  choice: « me », « je » et « m’ » au singulier
  alternative: « nous » au pluriel
  rationale: Bien que l’introduction nomme plusieurs descendants, leur discours hébreu se présente au singulier comme la voix collective d’un seul peuple. La traduction conserve cette tension grammaticale et rhétorique.
translation_notes:
  register: Français international moderne, naturel et digne. La formule hébraïque d’introduction du discours est allégée, mais le singulier collectif inhabituel de la plainte est volontairement conservé. Le marqueur de note est placé après l’expression qu’il explique.
