  rationale: 'Révision limitée de la relation discursive et de l’expression du singulier collectif : « car je suis un peuple nombreux » reflète directement la syntaxe et le sens contextuel de וַאֲנִי עַם רָב, tout en restant naturel en français moderne. Le reste du texte et la note sont conservés.'
