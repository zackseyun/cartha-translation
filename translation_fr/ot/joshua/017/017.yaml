  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל בֵּ֣ית יוֹסֵ֔ף לְ/אֶפְרַ֥יִם וְ/לִ/מְנַשֶּׁ֖ה לֵ/אמֹ֑ר עַם רַ֣ב אַתָּ֗ה וְ/כֹ֤חַ גָּדוֹל֙ לָ֔/ךְ לֹֽא יִהְיֶ֥ה לְ/ךָ֖ גּוֹרָ֥ל אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: fr
  text: 'Josué dit à la maison de Joseph — à Éphraïm et à Manassé : « Vous êtes un peuple nombreux[a] et vous avez une grande force ; vous n’aurez pas qu’un seul lot[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand peuple ». L’expression hébraïque peut évoquer soit le nombre, soit la grandeur ; le contexte du partage du territoire favorise ici le sens « nombreux ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu signifie « lot ». Dans le livre de Josué, il désigne souvent une part d’héritage attribuée par tirage au sort.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: la maison de Joseph
  rationale: Conserve l’expression familiale et tribale de l’hébreu, précisée immédiatement par les noms d’Éphraïm et de Manassé.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: à Éphraïm et à Manassé
  rationale: Les deux noms précisent qui constitue ici la maison de Joseph ; les tirets rendent clairement cette apposition en français.
- source_word: עַם רַב
  choice: un peuple nombreux
  rationale: Dans le contexte du partage du territoire, רַב renvoie surtout au nombre. Cette formulation évite que « grand peuple » soit compris comme une appréciation de prestige.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: et vous avez une grande force
  rationale: Rend naturellement en français la construction possessive hébraïque et conserve l’idée de force ou de capacité considérable.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: vous n’aurez pas un seul lot
  rationale: Dans Josué, גּוֹרָל désigne couramment la part de territoire attribuée par tirage au sort. « Un seul » exprime la valeur restrictive impliquée par le contexte sans effacer l’image du lot.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles directes et rendent la fonction discursive de l’infinitif hébreu sans le calque pesant « en disant ».
theological_decisions:
- issue: Nombre grammatical dans l’adresse à la maison de Joseph
  choice: vous
  alternative: tu
  rationale: L’hébreu emploie le singulier en considérant la maison de Joseph comme une entité collective. Le français « vous » s’adresse naturellement aux deux groupes explicitement nommés, Éphraïm et Manassé, sans modifier le sens théologique du collectif.
translation_notes:
  register: Français international moderne, digne et accessible. La structure appositionnelle est conservée, tandis que לֵאמֹר est rendu par la ponctuation française naturelle. Les marqueurs de notes sont placés sur les expressions auxquelles les notes se rapportent.
