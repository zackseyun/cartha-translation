source:
  edition: WLC
  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: fr
  text: 'Mais la région montagneuse sera à toi[a] : car c’est une forêt, et tu la défricheras ; ses confins seront à toi[b]. En effet, tu déposséderas les Cananéens[c], même s’ils ont des chars de fer et sont puissants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la montagne ». Le mot hébreu peut désigner une montagne ou, collectivement, une région de hauteurs ; ici, il s’agit probablement du territoire montagneux attribué aux descendants de Joseph.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le terme hébreu désigne ses « extrémités », ses « sorties » ou ses parties les plus éloignées, c’est-à-dire les limites extérieures du territoire boisé.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie le singulier collectif : « le Cananéen… il a… il est puissant », pour désigner l’ensemble du peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: la région montagneuse
  rationale: Dans ce contexte de partage territorial, le nom désigne vraisemblablement l’ensemble des hauteurs plutôt qu’un sommet isolé.
- source_word: יִהְיֶה לָּךְ
  choice: sera à toi
  rationale: La tournure היה + ל exprime ici la possession ou l’attribution ; cette formulation française est concise et naturelle.
- source_word: כִּי
  choice: car / en effet / même si
  rationale: 'Les occurrences répétées de כִּי ont des fonctions discursives différentes selon le contexte : explication, renforcement et concession. Une traduction uniforme obscurcirait ces rapports.'
- source_word: יַעַר
  choice: une forêt
  rationale: Le terme désigne directement une étendue boisée ; « forêt » en conserve le sens concret.
- source_word: וּבֵרֵאתוֹ
  choice: tu la défricheras
  rationale: Au piel, ברא décrit ici le déboisement ou le dégagement d’un terrain boisé en vue de son occupation ; « défricher » exprime précisément cette action.
- source_word: וְהָיָה לְךָ תֹּצְאֹתָיו
  choice: elle t’appartiendra jusqu’à ses confins
  rationale: תֹּצְאוֹתָיו évoque les extrémités ou limites extérieures du territoire. Cette tournure indique naturellement en français que toute son étendue sera possédée.
- source_word: תוֹרִישׁ
  choice: tu déposséderas
  rationale: Le hiphil de ירש signifie faire perdre à quelqu’un sa possession. « Déposséder » conserve à la fois la dimension territoriale et l’éviction des habitants.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le singulier morphologique fonctionne collectivement pour désigner le peuple cananéen ; le pluriel est plus clair en français moderne.
- source_word: רֶכֶב בַּרְזֶל
  choice: des chars de fer
  rationale: La construction désigne des chars renforcés ou équipés de fer ; « chars de fer » est une expression française concise et établie.
- source_word: חָזָק הוּא
  choice: ils sont puissants
  rationale: Le pronom et l’adjectif singuliers reprennent collectivement le peuple cananéen. Le pluriel français concorde avec « les Cananéens ».
theological_decisions:
- issue: Le singulier collectif désignant la population cananéenne
  choice: 'Employer le pluriel : « les Cananéens… ils ont… sont puissants »'
  alternative: 'Conserver formellement le singulier : « le Cananéen… il a… il est puissant »'
  rationale: Le singulier hébreu est collectif. Le pluriel rend le référent sans transformer cette particularité grammaticale en individu précis et sans introduire d’interprétation doctrinale.
- issue: La force des dernières occurrences de כִּי
  choice: Les rendre concessivement par « même si »
  alternative: Les rendre causalement par « car ils ont… car ils sont… »
  rationale: Dans le contexte, les chars de fer et la puissance des Cananéens constituent l’obstacle malgré lequel la dépossession est annoncée. La concession rend cette tension sans nier la valeur polyvalente de כִּי.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit l’adresse hébraïque à Joseph comme entité collective. La ponctuation explicite les rapports logiques sans effacer la répétition rhétorique de כִּי ; « même si » préserve la tension entre la supériorité militaire cananéenne et la promesse de dépossession.
