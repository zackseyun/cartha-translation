  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: fr
  text: 'Elles s’approchèrent du prêtre Éléazar, de Josué, fils de Noun, et des responsables. Elles dirent : « Yahweh a commandé à Moïse de nous donner un héritage parmi nos frères[a]. » Il leur donna alors, conformément à l’ordre de Yahweh[b], un héritage parmi les frères de leur père[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « nos frères » désigne ici les hommes du groupe familial au sein duquel ces filles demandent à recevoir une part d’héritage.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « selon la bouche de Yahweh ».'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire au sein de leur parenté paternelle. Le sujet de « donna » est implicite en hébreu ; dans le contexte, il renvoie probablement à Josué.
    reason: textual_clarity
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: Elles se présentèrent
  rationale: Le qal narratif 3e personne féminin pluriel renvoie aux filles de Tselofhad. « Se présentèrent » exprime naturellement leur démarche officielle auprès des autorités.
- source_word: לִפְנֵי
  choice: devant
  rationale: La répétition de « devant » conserve la solennité et le caractère public de leur comparution.
- source_word: הַנְּשִׂיאִים
  choice: les responsables
  rationale: Le terme désigne les chefs de la communauté ou des tribus. « Responsables » est clair en français moderne et évite la connotation monarchique de « princes ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: de nous donner un héritage
  rationale: Dans Josué, נַחֲלָה désigne la part foncière héréditaire attribuée. « Héritage » conserve ce sens juridique et familial.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: parmi nos frères
  rationale: La traduction maintient le terme masculin du texte, qui vise ici les membres masculins parmi lesquels les filles réclament leur part.
- source_word: וַיִּתֵּן
  choice: Josué leur donna
  rationale: Le verbe hébreu a un sujet masculin singulier implicite. Nommer Josué rend le français naturel tout en signalant l’acteur narratif le plus probable, sans attribuer l’acte au groupe entier.
- source_word: אֶל־פִּי יְהוָה
  choice: conformément à l’ordre de Yahweh
  rationale: Cette formulation restitue idiomatiquement l’expression littérale « selon la bouche de Yahweh » et sa force normative.
- source_word: אֲחֵי אֲבִיהֶן
  choice: les frères de leur père
  rationale: La formulation conserve la précision du lien de parenté paternel au lieu de généraliser en « famille » ou « proches ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin; « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Langage de parenté dans אַחֵינוּ
  choice: nos frères
  alternative: les membres de notre parenté
  rationale: « Nos frères » préserve la forme genrée et la spécificité juridique du contexte, où des femmes demandent une part au sein d’un héritage normalement réparti entre hommes.
- issue: Sujet implicite de וַיִּתֵּן
  choice: Josué leur donna
  alternative: Il leur donna
  rationale: Le singulier hébreu exclut un sujet collectif explicite, mais ne nomme pas son référent. Josué est le référent narratif le plus naturel; une note préserve l’ambiguïté formelle.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme de la comparution est conservé, tandis que « elles dirent » remplace idiomatiquement l’infinitif hébreu introduisant le discours. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
