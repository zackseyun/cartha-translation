  naturalness: Le français est clair, actuel et de registre approprié. « S’approchèrent » est un équivalent direct et naturel de וַתִּקְרַבְנָה dans ce cadre formel. Le pronom « il » permet un français fluide tout en respectant l’implicite du texte source.
  terminology: « Prêtre Éléazar », « responsables », « Yahweh », « héritage », « nos frères » et « les frères de leur père » sont appropriés. Les notes distinguent utilement le sens clanique des deux expressions de parenté et l’idiome « selon la bouche de Yahweh ».
