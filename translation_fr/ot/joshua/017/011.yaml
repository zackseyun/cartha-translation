  text: וַ/יְהִ֨י לִ/מְנַשֶּׁ֜ה בְּ/יִשָּׂשכָ֣ר וּ/בְ/אָשֵׁ֗ר בֵּית שְׁאָ֣ן וּ֠/בְנוֹתֶי/הָ וְ/יִבְלְעָ֨ם וּ/בְנוֹתֶ֜י/הָ וְֽ/אֶת יֹשְׁבֵ֧י דֹ֣אר וּ/בְנוֹתֶ֗י/הָ וְ/יֹשְׁבֵ֤י עֵֽין דֹּר֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֤י תַעְנַךְ֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֥י מְגִדּ֖וֹ וּ/בְנוֹתֶ֑י/הָ שְׁלֹ֖שֶׁת הַ/נָּֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: fr
  text: Manassé avait, dans les territoires d’Issacar et d’Aser, Beth-Shéân et les localités qui en dépendaient[a], Yibléam et les localités qui en dépendaient, ainsi que les habitants de Dor et des localités qui en dépendaient, les habitants d’Eïn-Dor et des localités qui en dépendaient, les habitants de Taanak et des localités qui en dépendaient, et les habitants de Meguiddo et des localités qui en dépendaient — les trois régions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ses filles », expression hébraïque désignant les localités ou villages dépendant d’une ville principale.
    reason: cultural_note
  - marker: b
    text: Expression hébraïque difficile; on peut aussi traduire « les trois districts » ou « les trois hauteurs ». Elle semble désigner un regroupement géographique ou administratif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: Manassé possédait aussi
  rationale: La tournure ויהי ל exprime ici l’appartenance ou la possession dans le cadre du territoire attribué à Manassé. « Possédait » est naturel en français; « aussi » assure la continuité de l’énumération du contexte.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: dans les territoires d’Issakar et d’Aser
  rationale: La préposition ב indique que ces villes se trouvaient à l’intérieur des territoires tribaux d’Issakar et d’Aser. L’ajout explicatif « territoires » évite de suggérer qu’elles se situaient dans les personnes ou les tribus au sens abstrait.
- source_word: בֵּית שְׁאָן
  choice: Beth-Shéân
  rationale: Transcription française moderne du nom de lieu, avec signes diacritiques facilitant la prononciation.
- source_word: בְנוֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles »; dans cet emploi géographique, le mot désigne les villages ou agglomérations dépendant d’une ville principale. La formulation française restitue clairement la relation sans conserver une métaphore opaque.
- source_word: יִבְלְעָם
  choice: Yibléam
  rationale: Transcription française du nom propre hébreu, avec yod initial rendu par « Y ».
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe substantivé désigne ceux qui habitent un lieu. « Les habitants de » est précis et idiomatique.
- source_word: עֵין דֹּר
  choice: Eïn-Dor
  rationale: Transcription française qui garde la structure composée du toponyme.
- source_word: תַעְנַךְ
  choice: Taanak
  rationale: Transcription proche de la forme hébraïque et lisible en français moderne.
- source_word: מְגִדּוֹ
  choice: Meguiddo
  rationale: Forme française traditionnelle et immédiatement reconnaissable du toponyme.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: les trois régions
  rationale: Le substantif rare נפת semble désigner ici des circonscriptions ou zones géographiques. « Régions » reste assez large pour ne pas trancher indûment entre une nuance géographique et administrative.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La longue structure énumérative de l’hébreu est conservée, mais « ainsi que » organise la transition entre les villes elles-mêmes et leurs habitants. Les toponymes suivent des formes françaises lisibles; l’idiome des « filles » est explicité dans le texte et signalé en note.
