  text: וְ/לֹ֤א יָכְלוּ֙ בְּנֵ֣י מְנַשֶּׁ֔ה לְ/הוֹרִ֖ישׁ אֶת הֶֽ/עָרִ֣ים הָ/אֵ֑לֶּה וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: fr
  text: Mais les descendants de Manassé ne purent déposséder ces villes, et les Cananéens[a] étaient déterminés à demeurer dans ce pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le Cananéen », au singulier collectif. Le verbe peut exprimer la volonté ou la détermination; il peut aussi évoquer le fait de s’obstiner à demeurer dans ce pays.
    reason: Le nom hébreu est un singulier collectif, et la nuance de וַיּוֹאֶל permet une formulation qui souligne la persistance résolue.
lexical_decisions:
- source_word: יָכְלוּ
  choice: ne purent pas
  rationale: Exprime directement l’incapacité indiquée par le verbe, dans un français naturel et soutenu.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: les descendants de Manassé
  rationale: Littéralement « les fils de Manassé »; ici, l’expression désigne les membres de la tribu issue de Manassé. « Descendants » rend clairement cette valeur collective en français moderne.
- source_word: לְהוֹרִישׁ
  choice: déposséder
  rationale: Dans ce contexte territorial, le hiphil de ירש signifie priver les habitants antérieurs de leur possession; « déposséder » conserve cette portée juridique et territoriale.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: Rend de manière standard les centres habités mentionnés dans la liste territoriale.
- source_word: וַיּוֹאֶל
  choice: persistèrent
  rationale: Dans la construction avec « habiter », le verbe exprime la volonté résolue et durable des Cananéens de demeurer sur place. « Persistèrent » restitue cette détermination sans réduire le sens à un simple consentement.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le substantif hébreu est morphologiquement singulier mais fonctionne collectivement; le pluriel est naturel en français pour désigner ce groupe.
- source_word: לָשֶׁבֶת
  choice: à habiter
  rationale: Conserve le sens concret de résidence continue porté par l’infinitif hébreu.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: אֶרֶץ désigne ici le territoire local dont il vient d’être question; « pays » est idiomatique en français dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Descendants de Manassé » explicite la valeur tribale de l’expression familiale hébraïque; « persistèrent à habiter » préserve l’idée de résolution durable tout en restant compréhensible.
