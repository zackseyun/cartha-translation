  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: fr
  text: Le lot échut à la tribu de Manassé, puisque Manassé était le premier-né de Joseph. Makir, premier-né de Manassé et père de Galaad[a], reçut le Galaad et le Basan, car c’était un homme de guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtre de Galaad » ou « fondateur de Galaad ». En hébreu, « père de » peut désigner un ancêtre ou un fondateur, et pas seulement le père biologique immédiat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Le lot échut
  rationale: Cette tournure française naturelle exprime le résultat du tirage au sort qui déterminait le partage territorial, sans ajouter de marqueur temporel absent de l’hébreu.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: à la tribu de Manassé
  rationale: Dans Josué, מַטֶּה désigne ici la tribu, et non un bâton au sens concret.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: puisque Manassé était le premier-né de Joseph
  rationale: La répétition du nom lève une ambiguïté pronominale peu naturelle en français tout en conservant la valeur explicative de כִּי et la portée généalogique de « premier-né ».
- source_word: לְמָכִיר
  choice: Makir … reçut
  rationale: 'La restructuration en une proposition française explicite rend la valeur distributive du לְ : le territoire revient à la lignée de Makir.'
- source_word: בְּכוֹר מְנַשֶּׁה
  choice: premier-né de Manassé
  rationale: Rendu généalogique direct qui conserve l’idée de rang de naissance et sa possible portée successorale.
- source_word: אֲבִי הַגִּלְעָד
  choice: père de Galaad
  rationale: Le texte principal conserve l’expression familiale hébraïque; une note signale que אָב peut aussi désigner un ancêtre ou un fondateur.
- source_word: אִישׁ מִלְחָמָה
  choice: un homme de guerre
  rationale: Cette expression française compréhensible conserve de près la formulation hébraïque et présente Makir comme un homme expérimenté dans la guerre.
- source_word: וַיְהִי לוֹ
  choice: reçut
  rationale: Dans le contexte du partage territorial, le verbe exprime naturellement l’attribution et la possession des régions nommées.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: le Galaad et le Basan
  rationale: Les noms géographiques sont donnés sous leurs formes françaises établies, avec l’article qui convient aux régions.
theological_decisions:
- issue: Référent de כִּי הוּא dans la première proposition
  choice: Manassé
  alternative: la tribu de Manassé prise collectivement
  rationale: Le titre « premier-né de Joseph » vise naturellement la personne de Manassé, ancêtre éponyme de la tribu; le nom est répété en français pour rendre ce référent clair sans modifier le sens.
- issue: Référent de כִּי הוּא הָיָה אִישׁ מִלְחָמָה
  choice: Makir
  alternative: Galaad
  rationale: La structure de la phrase rattache le motif de l’attribution à Makir, bénéficiaire nommé du territoire. La traduction conserve cette lecture syntaxiquement naturelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe hébraïque très compacte a été répartie en deux phrases afin d’éviter une construction lourde, tout en maintenant les liens de cause et d’attribution. Les formes françaises traditionnelles Manassé, Makir, Galaad et Basan ont été retenues.
