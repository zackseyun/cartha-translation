  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: fr
  text: 'Il y eut une part pour les autres fils de Manassé[a], selon leurs clans[b] : pour les fils d’Abiézer, les fils de Hélek, les fils d’Asriel, les fils de Sichem, les fils de Hépher et les fils de Shemida. Ce sont là les fils mâles[c] de Manassé, fils de Joseph, selon leurs clans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils restants de Manassé »; le mot « fils » peut ici désigner ses descendants.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une subdivision de parenté au sein d’une tribu; on pourrait aussi traduire par « familles ».
    reason: cultural_note
  - marker: c
    text: L’hébreu souligne qu’il s’agit ici des lignées masculines de Manassé, par contraste avec les filles de Tselofhad mentionnées dans le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה
  choice: Il y eut une part pour les fils de Manassé
  rationale: La tournure וַיְהִי לְ introduit ici l’attribution territoriale. « Il y eut une part pour » rend naturellement en français la relation d’attribution, sans reproduire mécaniquement l’hébreu.
- source_word: הַנּוֹתָרִים
  choice: les autres
  rationale: Dans le contexte, il s’agit des autres lignées de Manassé après le cas particulier évoqué auparavant. « Les autres » est plus idiomatique que « les fils restants », tandis qu’une note conserve le sens littéral.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici une subdivision de parenté au sein de la tribu; « clan » est donc plus précis que le français moderne « famille ».
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: pour les fils d’Abiézer… les fils de Shemida
  rationale: La répétition de « fils de » maintient la formulation généalogique et le caractère juridique de la liste, tout en allégeant les prépositions répétées après le premier élément conformément à l’usage français.
- source_word: אֵלֶּה
  choice: Voilà
  rationale: « Voilà » introduit naturellement la récapitulation et l’identification des groupes qui viennent d’être énumérés.
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף הַזְּכָרִים
  choice: les descendants mâles de Manassé, fils de Joseph
  rationale: « Descendants mâles » exprime clairement que le texte vise les lignées masculines, tandis que « fils de Joseph » conserve la formule généalogique appliquée à Manassé.
