  naturalness: Le français est généralement fluide. « Voilà », bien que compréhensible, est plus oral que le registre généalogique et récapitulatif du passage; « Ce sont là » convient mieux à un français biblique moderne et international.
  terminology: « clans » rend avec justesse מִשְׁפָּחֹת dans ce contexte. Les formes des noms et « fils de Joseph » sont appropriées. « Fils mâles » préserve à la fois la désignation de filiation et l’accent masculin de הַזְּכָרִים.
