id: JOS.17.15
reference: Joshua 17:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יְהוֹשֻׁ֗עַ אִם עַם רַ֤ב אַתָּה֙ עֲלֵ֣ה לְ/ךָ֣ הַ/יַּ֔עְרָ/ה וּ/בֵרֵאתָ֤ לְ/ךָ֙ שָׁ֔ם בְּ/אֶ֥רֶץ הַ/פְּרִזִּ֖י וְ/הָֽ/רְפָאִ֑ים כִּֽי אָ֥ץ לְ/ךָ֖ הַר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: fr
  text: 'Josué leur dit : « Si tu es un peuple nombreux, monte dans la forêt et défriche là un territoire pour toi-même[a], dans le pays des Perizzites et des Rephaïm, puisque la région montagneuse d’Éphraïm[b] est trop étroite pour toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « défriche-la là pour toi-même ». Le verbe hébreu désigne le défrichement d’un terrain boisé.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire par « le mont Éphraïm » ; l’expression désigne ici la région de hauteurs attribuée à Éphraïm.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: un peuple nombreux
  rationale: L’expression désigne ici l’importance numérique du peuple. Cette formulation naturelle conserve la reconnaissance, par Josué, de la revendication des descendants de Joseph.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: monte dans la forêt
  rationale: Le verbe exprime un déplacement vers une zone boisée, probablement située en hauteur. Le bénéficiaire indiqué par לְךָ est rendu dans la proposition suivante.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: défriche là un territoire pour toi-même
  rationale: À cette forme, ברא désigne le défrichement d’un terrain boisé. « Un territoire » explicite sobrement l’objet sous-entendu, tandis que « pour toi-même » rend la nuance bénéficiaire de לְךָ.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: dans le pays des Perizzites et des Rephaïm
  rationale: Les deux noms de groupes sont conservés par translittération, sans donner à Rephaïm une interprétation plus précise que ne l’impose le contexte.
- source_word: כִּי אָץ לְךָ
  choice: puisque ... est trop étroite pour toi
  rationale: La tournure exprime l’exiguïté ou le manque d’espace. « Trop étroite pour toi » rend clairement l’insuffisance du territoire au regard du nombre revendiqué.
- source_word: הַר אֶפְרָיִם
  choice: la région montagneuse d’Éphraïm
  rationale: Dans ce contexte territorial, הַר désigne plus vraisemblablement une région de hauteurs qu’un sommet isolé.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passage du pluriel (« leur ») au singulier collectif (« tu », « toi »), présent dans l’hébreu parce que Josué s’adresse au groupe comme à un seul peuple, est conservé.
