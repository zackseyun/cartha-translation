base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: fr
  text: Puis la frontière descendit de Yanoah à Ataroth et à Naarah[a], atteignit Jéricho[b] et aboutit au Jourdain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Naarah ; certains rapprochent ce nom de lieu de Naarath.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : touchait Jéricho ; le verbe hébreu peut désigner une frontière qui rencontre ou touche un lieu.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : sortait au Jourdain ; cette expression hébraïque décrit le parcours ou le point d’aboutissement de la frontière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Puis la frontière descendait
  rationale: Dans une description de territoire, ירד indique que la limite descend selon le relief ou la direction. « La frontière » explicite en français le sujet sous-entendu par le contexte, et l’imparfait convient au tracé géographique décrit.
- source_word: מִיָּנוֹחָה
  choice: de Yanoah
  rationale: La préposition מִן est rendue par « de ». Le toponyme est translittéré sous la forme française « Yanoah ».
- source_word: עֲטָרוֹת
  choice: Ataroth
  rationale: Le nom de lieu est translittéré plutôt que traduit.
- source_word: וְנַעֲרָתָה
  choice: et Naarah
  rationale: La forme massorétique est translittérée « Naarah »; le hé directionnel est rendu dans la construction globale « vers Ataroth et Naarah ». Le rapprochement possible avec Naarath est signalé en note.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: atteignait Jéricho
  rationale: Dans les descriptions de frontières, פגע peut exprimer le fait de rencontrer, toucher ou atteindre un point. « Atteignait » est naturel en français sans préciser abusivement si la limite traversait la ville.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: et aboutissait au Jourdain
  rationale: Dans les formules de délimitation, יצא décrit souvent le débouché ou le terme d’une frontière. « Aboutissait au Jourdain » communique clairement cette fonction tout en conservant en note l’expression plus littérale.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme française usuelle du nom du fleuve, avec l’article défini.
