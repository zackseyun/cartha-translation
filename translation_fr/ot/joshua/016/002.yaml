  text: וְ/יָצָ֥א מִ/בֵּֽית אֵ֖ל ל֑וּזָ/ה וְ/עָבַ֛ר אֶל גְּב֥וּל הָ/אַרְכִּ֖י עֲטָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/002.yaml
  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: fr
  text: Puis la frontière partait de Béthel vers Louz et passait jusqu’à la frontière des Arkites, à Ataroth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: Puis la frontière partait
  rationale: Dans cet itinéraire territorial, le sujet implicite est la frontière mentionnée dans le contexte. « Puis » marque naturellement la progression, et « partait » décrit son tracé.
- source_word: מִבֵּית אֵל
  choice: de Béthel
  rationale: Forme française usuelle du nom de lieu בֵּית אֵל.
- source_word: לוּזָה
  choice: vers Louz
  rationale: Le hé directionnel exprime un mouvement en direction de Louz; « vers » préserve mieux cette nuance que « jusqu’à ».
- source_word: וְעָבַר
  choice: et passait
  rationale: Dans la description d’une frontière, le verbe indique que son tracé se poursuit; cette formulation évite de suggérer nécessairement une traversée.
- source_word: אֶל גְּבוּל
  choice: jusqu’à la frontière
  rationale: גְּבוּל désigne ici une limite territoriale, et אֶל marque la direction ou le point atteint.
- source_word: הָאַרְכִּי
  choice: des Arkites
  rationale: Gentilé désignant le groupe associé à cette région; le pluriel français convient à un nom de peuple ou de clan.
- source_word: עֲטָרוֹת
  choice: Ataroth
  rationale: Translittération française traditionnelle et reconnaissable de ce nom de lieu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La frontière, implicite en hébreu mais fournie par le contexte, est explicitée pour assurer la clarté. La différence entre « vers Louz » et « à Ataroth » conserve la nuance directionnelle du premier toponyme et l’association géographique du second.
