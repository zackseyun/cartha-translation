revisions:
- from: La frontière se prolongeait vers l’ouest[a], au nord de Mikmetath. Puis elle tournait vers l’est, en direction de Taanath-Silo, passait à l’est de cette localité et continuait jusqu’à Yanoah.
  to: La frontière se prolongeait vers l’ouest[a] jusqu’à Mikmetath, au nord ; elle tournait vers l’est, vers Taanath-Silo, passait à l’est de celle-ci jusqu’à Yanoah.
  rationale: La révision évite de préciser indûment le repère de « au nord » et retire l’ajout de « continuait », tout en conservant le déroulement clair de la description frontalière, les toponymes et la note sur l’idiome « vers la mer ».
  reviewer_model: gpt-5.6-terra
