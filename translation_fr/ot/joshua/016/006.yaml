base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: fr
  text: La frontière se prolongeait vers l’ouest[a] jusqu’à Mikmetath, au nord ; elle tournait vers l’est, vers Taanath-Silo, passait à l’est de celle-ci jusqu’à Yanoah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la mer », expression hébraïque désignant l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: se prolongeait
  rationale: Dans les descriptions de frontières, le verbe indique que la ligne poursuit son tracé. « Se prolongeait » exprime naturellement ce mouvement en français.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: Le terme désigne ici la ligne délimitant le territoire attribué, et non le territoire lui-même.
- source_word: הַיָּמָּה
  choice: vers l’ouest
  rationale: Littéralement « vers la mer », cette expression directionnelle hébraïque désigne habituellement l’ouest; le sens géographique est donné dans le texte et l’image littérale en note.
- source_word: הַמִּכְמְתָת
  choice: Mikmetath
  rationale: Transcription française du nom de lieu hébreu.
- source_word: מִצָּפוֹן
  choice: au nord de Mikmetath
  rationale: La préposition et le nom directionnel situent le tracé au nord de cette localité; cette formulation est topographiquement claire en français.
- source_word: וְנָסַב
  choice: elle tournait
  rationale: Dans un relevé de limites, le verbe marque un changement de direction de la frontière.
- source_word: מִזְרָחָה
  choice: vers l’est
  rationale: Le suffixe directionnel indique un mouvement en direction de l’est.
- source_word: תַּאֲנַת שִׁלֹה
  choice: Taanath-Silo
  rationale: Transcription française du toponyme composé, avec « Silo » selon l’usage français traditionnel du nom שִׁלֹה.
- source_word: וְעָבַר אֹתוֹ מִמִּזְרַח
  choice: passait à l’est de cette localité
  rationale: Le pronom renvoie à Taanath-Silo. La formulation française rend la position relative du tracé sans faire croire qu’il traversait la ville.
- source_word: יָנוֹחָה
  choice: continuait jusqu’à Yanoah
  rationale: Le hé directionnel attaché au toponyme indique que la frontière allait vers Yanoah; « jusqu’à » restitue naturellement cette destination.
