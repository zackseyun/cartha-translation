review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle, mais « donc » explicite une relation de conséquence qui n’est pas marquée par le waw narratif hébreu. Le texte présente une succession narrative : ils ne les expulsèrent pas; les Cananéens demeurèrent parmi Éphraïm; ils furent soumis à la corvée.'
  naturalness: « Dépossédèrent » est possible, mais « chassèrent » est plus naturel en français moderne dans ce contexte et rend directement le hiphil de ירש. Le présent « habitent ... jusqu’à ce jour » rend naturellement la durée signalée par עד היום הזה.
  terminology: « Guézer », « Éphraïm », « Cananéens » et « travaux forcés » sont appropriés. « Furent astreints aux travaux forcés » rend bien לְמַס עֹבֵד, sans réduire indûment le terme à un impôt.
