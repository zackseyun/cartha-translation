- from: Mais ils ne dépossédèrent pas les Cananéens qui habitaient Guézer. Les Cananéens ont donc habité au milieu d’Éphraïm jusqu’à ce jour et ont été astreints aux travaux forcés.
  to: Mais ils ne chassèrent pas les Cananéens qui habitaient Guézer. Les Cananéens habitent au milieu d’Éphraïm jusqu’à ce jour et furent astreints aux travaux forcés.
  rationale: 'La révision retire l’inférence ajoutée par « donc » et emploie un verbe français plus idiomatique pour l’expulsion des habitants. Elle conserve la distinction narrative : la présence cananéenne est exprimée comme durable jusqu’au jour de rédaction, tandis que leur soumission au travail obligatoire est rapportée comme un fait établi.'
