    issue: « donc » ajoute une inférence causale explicite.
    rationale: La coordination hébraïque ne comporte pas de connecteur causal; la conséquence peut être comprise contextuellement mais ne devrait pas être imposée.
  - severity: low
    issue: « dépossédèrent » est moins idiomatique que « chassèrent » pour des habitants.
    rationale: Le sens contextuel du hiphil est l’expulsion des occupants. « Chassèrent » est clair, naturel et ne préjuge pas du moyen employé.
  revised_text: Mais ils ne chassèrent pas les Cananéens qui habitaient Guézer. Les Cananéens habitent au milieu d’Éphraïm jusqu’à ce jour et furent astreints aux travaux forcés.
