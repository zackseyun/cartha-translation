  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: fr
  text: Mais ils ne chassèrent pas les Cananéens qui habitaient Guézer. Les Cananéens habitent au milieu d’Éphraïm jusqu’à ce jour et furent astreints aux travaux forcés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: dépossédèrent
  rationale: Dans ce contexte de conquête et d’attribution du territoire, le hiphil de ירש signifie faire perdre la possession du pays, donc chasser ou déposséder. « Déposséder » conserve le lien avec la terre sans suggérer nécessairement une extermination.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: au milieu d’Éphraïm
  rationale: Rend littéralement l’idée de présence au sein du territoire ou de la population d’Éphraïm, sans préciser davantage ce que le texte laisse implicite.
- source_word: לְמַס עֹבֵד
  choice: astreints aux travaux forcés
  rationale: מַס désigne ici une corvée ou un groupe soumis au travail obligatoire; le participe עֹבֵד souligne le service effectivement accompli. La formulation française exprime naturellement ce statut imposé.
theological_decisions:
- issue: Relation entre la non-expulsion et la présence cananéenne
  choice: deux phrases reliées par « donc »
  alternative: simple coordination par « et »
  rationale: Le wayyiqtol narratif permet une succession, tandis que le contexte fait de la présence durable la conséquence de la non-expulsion. « Donc » explicite légèrement cette relation sans ajouter de motif théologique.
- issue: Valeur temporelle de וַיְהִי
  choice: ont été astreints
  alternative: devinrent
  rationale: Le verbe indique l’entrée ou l’établissement dans un état. Le passé composé convient au récit français et s’accorde avec la perspective prolongée de « jusqu’à ce jour », sans affirmer que ce statut a commencé exactement au même moment que leur installation.
translation_notes:
  register: Français moderne, international et digne. « Guézer » et « Éphraïm » suivent les graphies bibliques françaises courantes. La formulation reste proche de la syntaxe hébraïque tout en évitant une phrase trop chargée.
