revisions:
- from: Il y avait aussi les villes mises à part pour les fils d’Éphraïm au milieu du territoire reçu en héritage par les fils de Manassé, toutes ces villes avec les villages qui en dépendaient.[a]
  to: Il y avait aussi les villes mises à part pour les fils d’Éphraïm à l’intérieur du territoire reçu en héritage par les fils de Manassé, toutes les villes et les villages qui en dépendaient.[a]
  rationale: La révision supprime le démonstratif non exprimé dans le texte source et précise la relation d’inclusion territoriale. Elle conserve la structure récapitulative, les désignations tribales et le sens de hameaux ou villages dépendant des villes.
