  text: וְ/הֶ/עָרִ֗ים הַ/מִּבְדָּלוֹת֙ לִ/בְנֵ֣י אֶפְרַ֔יִם בְּ/ת֖וֹךְ נַחֲלַ֣ת בְּנֵֽי מְנַשֶּׁ֑ה כָּֽל הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: fr
  text: Il y avait aussi les villes mises à part pour les fils d’Éphraïm à l’intérieur du territoire reçu en héritage par les fils de Manassé, toutes les villes et les villages qui en dépendaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les villes séparées pour les fils d’Éphraïm ». Le participe hébreu souligne que ces villes étaient distinguées du territoire de Manassé et réservées à Éphraïm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: les villes
  rationale: עִיר désigne une ville ou une localité; « villes » convient au registre des listes territoriales de Josué.
- source_word: הַמִּבְדָּלוֹת
  choice: mises à part
  rationale: Le participe de בדל exprime la séparation ou la distinction de ces villes, réservées à Éphraïm à l’intérieur du territoire de Manassé.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: pour les fils d’Éphraïm
  rationale: La formulation conserve le sens littéral de בְּנֵי et la désignation tribale traditionnelle, sans réduire le référent aux seuls hommes.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression rend naturellement l’idée d’une enclave située à l’intérieur du territoire attribué à une autre tribu.
- source_word: נַחֲלַת
  choice: territoire reçu en héritage
  rationale: נַחֲלָה désigne ici le lot territorial accordé à la tribu; cette formulation explicite la valeur foncière tout en conservant la notion d’héritage.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: les fils de Manassé
  rationale: La traduction reflète la formule tribale hébraïque et reste parallèle à « fils d’Éphraïm ».
- source_word: כָּל הֶעָרִים
  choice: toutes ces villes
  rationale: כָּל introduit une récapitulation de l’ensemble des villes mises à part; le démonstratif rend ce lien naturel en français.
- source_word: וְחַצְרֵיהֶן
  choice: avec les villages qui en dépendaient
  rationale: חָצֵר désigne souvent, dans les listes territoriales, les villages ou établissements non fortifiés rattachés à une ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’ouverture « Il y avait aussi » transforme le fragment nominal hébreu en phrase française naturelle tout en maintenant son lien avec le contexte. La terminologie territoriale conserve la notion biblique d’héritage sans lourdeur excessive.
