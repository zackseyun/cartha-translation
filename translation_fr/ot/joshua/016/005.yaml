id: JOS.16.5
reference: Joshua 16:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֛י גְּב֥וּל בְּנֵֽי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֞י גְּב֤וּל נַחֲלָתָ/ם֙ מִזְרָ֔חָ/ה עַטְר֣וֹת אַדָּ֔ר עַד בֵּ֥ית חוֹרֹ֖ן עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: fr
  text: 'Voici quel fut le territoire des fils d’Éphraïm, selon leurs clans : la frontière de leur héritage, à l’est, allait d’Ataroth-Addar jusqu’à Beth-Horôn-la-Haute.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: territoire / frontière
  rationale: 'Le même nom est rendu selon ses deux emplois contextuels : d’abord l’étendue territoriale de la tribu, puis la ligne de démarcation décrite par des lieux.'
- source_word: בְּנֵי אֶפְרַיִם
  choice: les fils d’Éphraïm
  rationale: Cette formulation conserve l’expression généalogique hébraïque tout en restant naturelle dans le cadre tribal du livre de Josué.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte du partage du pays, מִשְׁפָּחָה désigne les subdivisions claniques de la tribu.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: « Héritage » préserve la valeur foncière et l’arrière-plan d’attribution attachés à נַחֲלָה dans Josué.
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: Le terme indique ici le côté oriental de la frontière et s’intègre naturellement à la description géographique française.
- source_word: עַטְרוֹת אַדָּר
  choice: Ataroth-Addar
  rationale: Le nom de lieu est translittéré; le trait d’union fait apparaître son caractère composé.
- source_word: עַד
  choice: jusqu’à
  rationale: Dans une description de frontière, cette préposition marque clairement le point jusqu’auquel celle-ci s’étend.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: Beth-Horôn-la-Haute
  rationale: Cette forme distingue naturellement en français ce lieu de Beth-Horôn-la-Basse.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « Voici quel fut » restitue l’introduction descriptive וַיְהִי sans lourdeur. Aucun appel de note n’est nécessaire, car l’ambiguïté signalée en anglais relève surtout de possibilités syntaxiques propres à cette langue et ne modifie pas le sens géographique.
