  text: וַ/יֵּצֵ֨א הַ/גּוֹרָ֜ל לִ/בְנֵ֤י יוֹסֵף֙ מִ/יַּרְדֵּ֣ן יְרִיח֔וֹ לְ/מֵ֥י יְרִיח֖וֹ מִזְרָ֑חָ/ה הַ/מִּדְבָּ֗ר עֹלֶ֧ה מִ/ירִיח֛וֹ בָּ/הָ֖ר בֵּֽית אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: fr
  text: Le lot échut aux fils de Joseph[a]. Leur territoire partait du Jourdain, près de Jéricho, et allait jusqu’aux eaux de Jéricho[b], à l’est. Il traversait le désert qui monte de Jéricho vers la région montagneuse de Béthel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le lot sortit pour les fils de Joseph ».'
    reason: lexical_alternative
  - marker: b
    text: Les « eaux de Jéricho » peuvent désigner une source ou des points d’eau associés à Jéricho.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: Le lot échut
  rationale: Dans un contexte de partage territorial par tirage au sort, « le lot échut » est une formulation française naturelle. La note conserve l’image plus littérale du verbe יצא, « sortir ».
- source_word: לִבְנֵי יוֹסֵף
  choice: aux fils de Joseph
  rationale: Cette expression garde la formule de parenté hébraïque tout en désignant collectivement les descendants tribaux de Joseph.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: du Jourdain, près de Jéricho
  rationale: La phrase situe le point de départ sur le Jourdain dans le secteur de Jéricho, sans préciser une relation géographique plus étroite que ne le fait l’hébreu.
- source_word: לְמֵי יְרִיחוֹ
  choice: jusqu’aux eaux de Jéricho
  rationale: Le pluriel collectif « eaux » reproduit l’expression hébraïque sans décider s’il s’agit d’une source particulière ou de plusieurs points d’eau.
- source_word: מִזְרָחָה
  choice: à l’est
  rationale: Rend simplement l’orientation donnée par l’adverbe directionnel.
- source_word: הַמִּדְבָּר
  choice: le désert
  rationale: Ici, מדבר désigne la région aride et inhabitée proche de Jéricho. « Désert » est clair en français moderne sans imposer nécessairement l’idée de dunes.
- source_word: עֹלֶה מִירִיחוֹ
  choice: qui monte de Jéricho
  rationale: Le participe exprime la montée topographique depuis la dépression de Jéricho vers les hauteurs.
- source_word: בָּהָר בֵּית אֵל
  choice: vers la région montagneuse de Béthel
  rationale: Dans cette description géographique, הר renvoie aux hauteurs ou au pays montagneux plutôt qu’à une montagne isolée.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La première phrase conserve le vocabulaire du tirage au sort; « leur territoire » explicite ensuite le référent géographique implicite afin de rendre la longue description de frontière naturelle en français. Le découpage en trois phrases améliore la lisibilité sans supprimer les étapes du tracé.
