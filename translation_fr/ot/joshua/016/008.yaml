source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: fr
  text: De Tappouah, la frontière se dirige vers l’ouest[a], jusqu’au torrent de Qana[b], et aboutit à la mer. Tel est le territoire attribué à la tribu des fils d’Éphraïm[c], selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en direction de la mer »; dans les descriptions de frontières, cette expression hébraïque désigne couramment l’ouest.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner un oued, c’est-à-dire un cours d’eau souvent intermittent, ou son lit.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « fils d’Éphraïm », désignation habituelle de la tribu issue d’Éphraïm.
    reason: lexical_clarification
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: De Tappouah
  rationale: La préposition מִן indique le point de départ du tracé. « Tappouah » est une translittération française claire du nom de lieu.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: la frontière se dirige
  rationale: Dans une description territoriale, הלך exprime le parcours de la limite. Cette tournure est naturelle en français tout en conservant l’image d’un tracé.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: La forme directionnelle dérivée de יָם peut littéralement évoquer la direction de la mer, mais elle désigne couramment l’ouest dans les descriptions de frontières.
- source_word: נַחַל קָנָה
  choice: le torrent de Qana
  rationale: נַחַל peut désigner un torrent, un cours d’eau intermittent, son lit ou un oued. « Torrent » est accessible en français et convient à un élément géographique servant de limite.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: et aboutit à la mer
  rationale: La formule de délimitation indique le point où le tracé se termine. Le singulier idiomatique français reprend « la frontière », tandis que « à la mer » conserve ici le référent géographique concret.
- source_word: זֹאת נַחֲלַת
  choice: Tel est le territoire attribué à
  rationale: נַחֲלָה désigne ici le patrimoine territorial reçu en partage. « Territoire attribué » exprime clairement ce sens dans le contexte du partage du pays.
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: la tribu des fils d’Éphraïm
  rationale: מַטֵּה désigne la tribu dans ce contexte, et בְנֵי אֶפְרַיִם est conservé littéralement comme désignation tribale traditionnelle.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans l’organisation tribale, מִשְׁפָּחוֹת désigne les grands groupes familiaux; « clans » est plus précis que « familles » dans ce contexte.
theological_decisions:
- issue: Désignation tribale genrée בְנֵי אֶפְרַיִם
  choice: les fils d’Éphraïm
  alternative: les descendants d’Éphraïm
  rationale: L’expression hébraïque signifie littéralement « fils d’Éphraïm » et fonctionne comme désignation tribale. La conserver respecte sa forme masculine et son lien explicite avec l’ancêtre éponyme sans imposer une reformulation interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. Le tracé est formulé au présent descriptif. « Torrent » reste immédiatement compréhensible, tandis qu’une note conserve la précision géographique possible d’« oued ». « Clans » rend le cadre tribal plus nettement que « familles ».
