    rationale: Le wayyiqtol וְיָרַד poursuit la succession des étapes de la frontière. « Descendit » rend plus fidèlement cette progression que l’imparfait descriptif.
  - severity: medium
    issue: Le singulier « elle aboutissait » efface le pluriel de תּוֹצְאֹתָיו
    rationale: Le texte hébreu parle des « extrémités » ou points terminaux de la frontière. La traduction principale doit conserver ce pluriel, et non le réserver à la note.
  - severity: low
    issue: Formes françaises des noms
    rationale: « Japhléthites » et « Beth-Horôn-le-Bas » sont préférables à « Yaflétites » et « Beth-Horôn-la-Basse » dans l’usage biblique français courant.
