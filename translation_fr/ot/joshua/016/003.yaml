  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: fr
  text: Puis elle descendit vers l’ouest jusqu’à la frontière des Japhléthites, jusqu’à la frontière de Beth-Horôn-le-Bas et jusqu’à Guézer ; ses extrémités aboutissaient à la mer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses extrémités étaient à la mer » ; formule de délimitation indiquant les points où la frontière se termine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Puis la frontière descendait
  rationale: Dans cette description territoriale, le verbe indique la progression descendante du tracé. L’ajout explicite de « la frontière », sous-entendu par le contexte, donne une formulation française naturelle.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: La forme directive dérivée de « mer » désigne couramment l’ouest dans les descriptions géographiques, la Méditerranée se trouvant dans cette direction.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: jusqu’à la frontière des Yaflétites
  rationale: גְּבוּל désigne ici une limite territoriale. Le gentilé est translittéré sous une forme française lisible.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: jusqu’à celle de Beth-Horôn-la-Basse
  rationale: עַד marque l’étendue du tracé. « Celle » évite une répétition lourde de « frontière », et תַּחְתּוֹן distingue cette localité de Beth-Horôn-la-Haute.
- source_word: וְעַד גָּזֶר
  choice: et jusqu’à Guézer
  rationale: La répétition de עַד poursuit l’énumération des points atteints par la frontière.
- source_word: וְהָיוּ תצאתו יָמָּה
  choice: elle aboutissait à la mer
  rationale: La formule frontalière תֹצְאוֹתָיו désigne les extrémités ou le point terminal du tracé. « Aboutissait » exprime naturellement ce sens technique en français, tandis que יָמָּה est ici compris concrètement comme la mer.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les toponymes suivent une translittération française usuelle ; la syntaxe technique des relevés de frontières est rendue de façon naturelle sans effacer l’image du tracé descendant puis aboutissant à la mer.
