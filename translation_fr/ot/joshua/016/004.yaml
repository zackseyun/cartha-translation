  yaml_path: translation/ot/joshua/016/004.yaml
  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: fr
  text: Les fils de Joseph, Manassé et Éphraïm, reçurent leur héritage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « héritèrent » ou « prirent possession de leur héritage ».'
    reason: Alternative lexicale pour נחל, qui peut exprimer le fait d’hériter ou d’entrer en possession d’un héritage.
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: reçurent donc leur héritage
  rationale: Le verbe נחל au qal exprime ici l’entrée en possession d’un héritage attribué. « Reçurent leur héritage » convient au contexte du partage du pays sans suggérer aussi fortement que « prirent possession » une conquête active. « Donc » rend naturellement la progression narrative marquée par le waw.
- source_word: בְנֵי יוֹסֵף
  choice: les fils de Joseph
  rationale: La traduction conserve l’expression généalogique formelle, qui désigne ici les fils de Joseph et, dans le contexte territorial, les tribus issues d’eux.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: וְאֶפְרָיִם
  choice: et Éphraïm
  rationale: Forme française traditionnelle du nom propre, avec maintien explicite de la conjonction.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; le passé simple convient au registre narratif biblique écrit.
