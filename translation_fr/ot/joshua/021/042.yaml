  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: fr
  text: Chacune de ces villes avait des pâturages autour d’elle[a] ; il en était ainsi pour toutes ces villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ville par ville, et ses pâturages autour d’elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: avait
  rationale: L’imparfait qal féminin pluriel de היה décrit ici la situation récapitulative des villes. En français, « avait » exprime naturellement le lien entre chaque ville et les terres qui lui étaient rattachées.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: עִיר peut désigner une ville ou une localité ; « villes » convient au contexte formel du partage territorial et assure la cohérence du passage.
- source_word: עִיר עִיר
  choice: chacune
  rationale: La répétition distributive, littéralement « ville par ville », considère séparément chaque ville. « Chacune » en conserve clairement la valeur en français naturel.
- source_word: וּמִגְרָשֶׁיהָ
  choice: des pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts rattachés à une ville, notamment pour le bétail. « Pâturages » est moderne et compréhensible, contrairement à « banlieues », qui aurait aujourd’hui un sens trompeur.
- source_word: סְבִיבֹתֶיהָ
  choice: autour d’elle
  rationale: Cette expression indique explicitement que les pâturages entouraient chaque ville et préserve le suffixe féminin singulier renvoyant distributivement à la ville.
- source_word: כֵּן
  choice: il en était ainsi
  rationale: כֵּן introduit une récapitulation comparative. « Il en était ainsi » restitue son sens et s’accorde avec le cadre narratif passé.
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: pour toutes ces villes
  rationale: La tournure généralise à l’ensemble des villes la disposition qui vient d’être décrite.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite l’ancien emploi biblique de « banlieues », désormais ambigu, et conserve à la fois la valeur distributive de עִיר עִיר et l’idée de terrains ouverts entourant chaque ville.
