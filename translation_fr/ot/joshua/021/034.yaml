  text: וּ/לְ/מִשְׁפְּח֣וֹת בְּנֵֽי מְרָרִי֮ הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים֒ מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן אֶֽת יָקְנְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת קַרְתָּ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: fr
  text: Aux clans des descendants de Merari, les Lévites restants, on attribua, de la tribu de Zabulon, Joknéam et ses pâturages, ainsi que Qarta et ses pâturages.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּח֣וֹת
  choice: Aux clans
  rationale: Le waw poursuit la liste des attributions et peut rester implicite en français après la ponctuation contextuelle. « Clans » rend précisément les subdivisions familiales désignées par מִשְׁפָּחוֹת.
- source_word: בְּנֵֽי מְרָרִי
  choice: des descendants de Merari
  rationale: Dans ce cadre généalogique, בְּנֵי désigne les membres de la lignée de Merari; « descendants » est naturel et évite de suggérer uniquement ses fils immédiats.
- source_word: הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים
  choice: les autres Lévites
  rationale: Le groupe est celui des Lévites restant à pourvoir dans la répartition. « Les autres Lévites » exprime naturellement cette relation au contexte précédent.
- source_word: מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן
  choice: sur le territoire de la tribu de Zabulon
  rationale: מֵאֵת indique ici la provenance de l'attribution. La formulation explicite et naturelle précise que les villes proviennent du territoire tribal sans modifier le sens.
- source_word: יָקְנְעָם
  choice: Joknéam
  rationale: Translittération française courante du toponyme hébreu, avec accent graphique facilitant la prononciation.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts attenants à la ville, notamment destinés au bétail. « Pâturages » est clair et traditionnel en français.
- source_word: קַרְתָּה
  choice: Karta
  rationale: Translittération simple du toponyme hébreu adaptée au français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe française ajoute « on donna » pour rendre explicite le verbe sous-entendu par la continuation de la liste, sans changer l'agent indéfini ni le contenu de l'attribution.
