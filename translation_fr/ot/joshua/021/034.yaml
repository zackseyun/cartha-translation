  rationale: La révision resserre la traduction sur les expressions hébraïques « les Lévites restants » et « de la tribu de Zabulon », tout en conservant l’explicitation française minimale du verbe d’attribution sous-entendu. Elle ajuste également la translittération de Qarta.
