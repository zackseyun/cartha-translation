source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֖צֶר וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: fr
  text: 'Et, de la tribu de Ruben : Bétser avec ses pâturages[b], et Yahats[a] avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahats est aussi appelé Yahatsa dans certaines traductions.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits hébreux et des témoins anciens omettent Josué 21.36-37; les villes énumérées ici correspondent à celles de 1 Chroniques 6.63-64 dans la numérotation française courante (6.78-79 dans certaines éditions).
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: Et, de la tribu de
  rationale: Dans ce contexte de répartition, מִן + מַטֶּה indique la provenance tribale. Cette formulation française s’insère naturellement dans l’énumération.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française courante du nom de la tribu biblique.
- source_word: אֶת בֶּצֶר
  choice: Bétser
  rationale: אֶת est la marque de l’objet direct et ne se traduit pas; le toponyme est translittéré selon une forme française usuelle.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Dans le contexte des villes lévitiques, מִגְרָשׁ désigne les terrains ouverts entourant la ville, notamment destinés au bétail. Le possessif renvoie à chaque ville.
- source_word: יַהְצָה
  choice: Yahats
  rationale: Translittération française du toponyme; la terminaison hébraïque peut expliquer les variantes traditionnelles signalées en note.
theological_decisions: []
