  text: Helkath avec ses pâturages, et Rehob avec ses pâturages — quatre villes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: Helkath
  rationale: Nom de lieu translittéré selon une forme française qui conserve la consonne finale du texte hébreu.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Désigne les terrains rattachés à chaque ville et destinés notamment au bétail; « pâturages » est naturel en français et convient au contexte des villes lévitiques.
- source_word: רְחֹב
  choice: Rehob
  rationale: Nom de lieu translittéré; la forme « Rehob » est claire et proche de l'hébreu.
- source_word: עָרִים אַרְבַּע
  choice: quatre villes
  rationale: Rend directement la formule récapitulative hébraïque; le total inclut les villes énumérées au verset précédent.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: avec ... et ... avec ...
  rationale: Les marqueurs d'objet ne se traduisent pas directement; « avec » exprime naturellement le rattachement des pâturages à chaque ville.
