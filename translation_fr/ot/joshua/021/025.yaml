source:
  edition: WLC
  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת תַּעְנַךְ֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: fr
  text: 'Et de la demi-tribu de Manassé : Taanak avec ses pâturages[a], et Gath-Rimmôn avec ses pâturages, soit deux villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits hébreux et le passage parallèle de 1 Chroniques 6.55 présentent des noms différents pour les villes attribuées par la demi-tribu de Manassé.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה
  choice: Et de la demi-tribu
  rationale: La préposition מִן indique ici la provenance de l’attribution. « Demi-tribu » est l’expression française naturelle dans ce contexte territorial.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: תַּעְנַךְ
  choice: Taanak
  rationale: Transcription française claire du nom de lieu hébreu, avec restitution de la consonne finale.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts attenants à une ville, notamment destinés au bétail. Le possessif renvoie à chacune des villes.
- source_word: גַּת רִמּוֹן
  choice: Gath-Rimmôn
  rationale: Transcription française du nom composé, avec trait d’union et accent circonflexe signalant la voyelle longue dans Rimmôn.
- source_word: עָרִים שְׁתָּיִם
  choice: soit deux villes
  rationale: La formule récapitule le nombre des localités. « Soit » rend naturellement en français la fonction de ce décompte final.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La structure de liste du texte hébreu est conservée, tandis que « soit deux villes » explicite naturellement la valeur récapitulative de la formule finale. La référence du parallèle suit la numérotation française courante; elle correspond à 1 Chroniques 6:70 dans la numérotation anglaise.
