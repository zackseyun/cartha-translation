  - severity: low
    issue: Construction non parallèle dans l’énumération des provenances.
    rationale: « prises aux clans de la tribu d’Issacar, à la tribu d’Aser... » est grammaticalement possible, mais « provenant des/de la » rend plus nettement et uniformément les prépositions répétées de l’hébreu.
