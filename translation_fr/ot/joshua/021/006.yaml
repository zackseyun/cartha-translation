base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: fr
  text: Les descendants de Guershon reçurent, par tirage au sort, treize villes provenant des clans de la tribu d’Issacar, de la tribu d’Aser, de la tribu de Nephtali et de la demi-tribu de Manassé en Basan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: Les descendants de Guershon
  rationale: Dans ce contexte de répartition entre groupes lévitiques, בְּנֵי désigne les descendants de l’ancêtre Guershon plutôt que ses seuls fils immédiats. La préposition ל indique les bénéficiaires; la formulation française avec « reçurent » l’exprime naturellement.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: aux clans de
  rationale: מִשְׁפָּחוֹת désigne ici les subdivisions familiales de la tribu. « Clans » évite de suggérer de simples foyers domestiques. Le מִן est rendu par « prises aux » pour indiquer l’origine des villes.
- source_word: מַטֵּה
  choice: tribu
  rationale: Dans le contexte territorial de Josué, מַטֶּה désigne l’unité tribale, non un bâton.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: et à la demi-tribu de Manassé
  rationale: « Demi-tribu » est la désignation française concise et traditionnelle de la moitié territoriale de Manassé.
- source_word: בַ/בָּשָׁן
  choice: établie en Basan
  rationale: Le complément local qualifie ici la demi-tribu de Manassé. « Établie » rend explicite sans surcharge sa localisation territoriale.
- source_word: בַּ/גּוֹרָל
  choice: par tirage au sort
  rationale: L’expression désigne le procédé d’attribution. « Par tirage au sort » est plus immédiatement intelligible en français moderne que le seul « par le sort ».
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: treize villes
  rationale: עָרִים désigne les localités attribuées; « villes » convient au registre des listes territoriales de Josué.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase nominale elliptique de l’hébreu est transformée en phrase verbale avec « reçurent », verbe fourni par le contexte immédiat de l’attribution. La répétition de « de la tribu » est légèrement allégée après le premier élément pour obtenir une énumération naturelle sans modifier les sources tribales.
