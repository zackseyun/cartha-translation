  source_fidelity: 'Le sens essentiel est fidèle : les descendants de Guershon reçoivent treize villes, attribuées par le sort, provenant des quatre groupes tribaux indiqués. Toutefois, « établie » ajoute une idée non exprimée explicitement par le complément hébreu « en Basan »; une formulation plus neutre préserve mieux la concision du texte source.'
