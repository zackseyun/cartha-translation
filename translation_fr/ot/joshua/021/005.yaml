  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפְּחֹ֣ת מַטֵּֽה אֶ֠פְרַיִם וּֽ/מִ/מַּטֵּה דָ֞ן וּ/מֵ/חֲצִ֨י מַטֵּ֧ה מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: fr
  text: Les autres descendants de Qehath[a] reçurent, par tirage au sort, dix villes provenant des clans de la tribu d’Éphraïm, de la tribu de Dan et de la demi-tribu de Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les autres Qehathites ».'
    reason: Alternative lexicale qui rend בני קהת comme un nom de groupe plutôt que par l’expression généalogique « descendants de Qehath ».
lexical_decisions:
- source_word: וְלִבְנֵי קְהָת הַנּוֹתָרִים
  choice: Les autres descendants de Qehath
  rationale: Dans ce contexte généalogique et tribal, בְּנֵי désigne les descendants ou membres du clan plutôt que les seuls fils immédiats. הַנּוֹתָרִים distingue ceux qui n’ont pas été mentionnés au verset précédent.
- source_word: מִמִּשְׁפְּחֹת מַטֵּה אֶפְרַיִם
  choice: prises aux clans de la tribu d’Éphraïm
  rationale: מִשְׁפָּחוֹת désigne ici les subdivisions claniques de la tribu. « Prises aux » explicite naturellement en français la provenance des villes sans changer le sens distributif du passage.
- source_word: וּמִמַּטֵּה דָן
  choice: à la tribu de Dan
  rationale: La préposition מִן marque la provenance. Après « prises », le français emploie naturellement « à » pour indiquer les territoires tribaux dont les villes sont prélevées.
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: à la demi-tribu de Manassé
  rationale: « Demi-tribu » est l’expression française conventionnelle et précise pour cette division territoriale de Manassé.
- source_word: בַּגּוֹרָל
  choice: par tirage au sort
  rationale: Cette formulation actuelle exprime clairement le procédé d’attribution indiqué par le substantif גּוֹרָל.
- source_word: עָרִים עָשֶׂר
  choice: dix villes
  rationale: Rendu direct de l’expression numérale; « villes » convient au vocabulaire des listes territoriales.
- source_word: implicit verbless clause
  choice: reçurent
  rationale: La proposition hébraïque est elliptique. « Reçurent » fournit en français le lien verbal exigé par le contexte d’attribution des villes, sans modifier les bénéficiaires ni le mode de répartition.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase est légèrement réorganisée pour éviter une tournure nominale artificielle et rendre explicite que les villes provenaient des territoires tribaux mentionnés. Le nom קְהָת est transcrit « Qehath », forme française transparente et proche de l’hébreu.
