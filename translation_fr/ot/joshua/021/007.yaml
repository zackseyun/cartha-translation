  text: לִ/בְנֵ֨י מְרָרִ֜י לְ/מִשְׁפְּחֹתָ֗/ם מִ/מַּטֵּ֨ה רְאוּבֵ֤ן וּ/מִ/מַּטֵּה גָד֙ וּ/מִ/מַּטֵּ֣ה זְבוּלֻ֔ן עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: fr
  text: 'Aux descendants de Merari, selon leurs clans : douze villes prises sur la tribu de Ruben, sur la tribu de Gad et sur la tribu de Zabulon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Aux descendants de Merari
  rationale: Dans ce contexte de répartition, le préfixe ל marque les bénéficiaires de l’attribution. « Descendants » rend naturellement en français l’expression généalogique בְּנֵי sans laisser entendre qu’il s’agit uniquement des fils immédiats de Merari.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les subdivisions familiales du groupe lévitique. « Clans » est plus précis que « familles » dans ce contexte tribal, et « selon » conserve le sens distributif du préfixe ל.
- source_word: מִמַּטֵּה
  choice: prises sur les tribus de
  rationale: מַטֶּה signifie idiomatiquement « tribu » dans les listes territoriales. « Prises sur » explicite avec naturel la provenance des villes sans changer leur mode d’attribution.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: גָד
  choice: Gad
  rationale: Translittération française usuelle du nom propre.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française biblique courante du nom de la tribu.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: douze villes
  rationale: Rend directement le nombre et le nom dans l’ordre naturel du français; « villes » correspond au vocabulaire conventionnel des listes d’attribution territoriale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase nominale hébraïque est transformée en proposition verbale avec « revinrent » pour une lecture naturelle; ce verbe exprime l’attribution déjà établie par le contexte, sans ajouter d’agent. La répétition hébraïque de « de la tribu de » est condensée en français afin d’éviter une lourdeur inutile.
