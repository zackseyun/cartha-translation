id: JOS.21.43
reference: Joshua 21:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: fr
  text: Ainsi, Yahvé donna à Israël tout le pays qu’il avait juré de donner à leurs pères. Ils en prirent possession et s’y établirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin dans sa forme française traditionnelle et intelligible, plutôt que de le remplacer par un titre.
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Rend directement נתן, qui exprime ici le don divin du pays.
- source_word: כָּל הָאָרֶץ
  choice: tout le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le pays promis à Israël, et non la terre entière; כָּל en affirme la totalité.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: qu’il avait juré de donner
  rationale: Conserve explicitement la force du serment et marque naturellement en français son antériorité.
- source_word: לַאֲבוֹתָם
  choice: à leurs pères
  rationale: Reproduit le terme masculin concret du texte hébreu, qui renvoie ici aux pères d’Israël.
- source_word: וַיִּרָשׁוּהָ
  choice: Ils en prirent possession
  rationale: Dans ce contexte, ירשׁ décrit l’entrée effective en possession du pays promis, tout en laissant perceptible l’arrière-plan d’héritage.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: s’y établirent
  rationale: ישׁב avec ב exprime ici l’installation durable dans le pays; « s’y établirent » convient au contexte de prise de possession et de peuplement.
- source_word: וַ
  choice: Ainsi
  rationale: Le waw initial introduit une récapitulation résultative de ce qui précède; « Ainsi » rend cette fonction en français naturel.
theological_decisions:
- issue: Portée de l’accomplissement de la promesse territoriale
  choice: Maintenir l’affirmation forte selon laquelle Yahvé donna à Israël « tout le pays » promis, sans la restreindre ni l’étendre par une harmonisation doctrinale.
  alternative: Comprendre cette totalité comme seulement partielle ou, à l’inverse, comme une formulation devant déterminer à elle seule l’interprétation de tous les autres récits de conquête.
  rationale: Le verset est une récapitulation explicite de l’accomplissement, avec כָּל et les verbes successifs de possession et d’établissement. La traduction doit conserver cette force et la tension éventuelle avec d’autres passages.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’enchaînement hébreu tout en étant idiomatique. « Pays » évite l’ambiguïté cosmique possible de « terre », et « s’y établirent » exprime naturellement l’installation durable.
