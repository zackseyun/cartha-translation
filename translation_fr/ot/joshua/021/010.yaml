  text: וַֽ/יְהִי֙ לִ/בְנֵ֣י אַהֲרֹ֔ן מִ/מִּשְׁפְּח֥וֹת הַ/קְּהָתִ֖י מִ/בְּנֵ֣י לֵוִ֑י כִּ֥י לָ/הֶ֛ם הָיָ֥ה הַ/גּוֹרָ֖ל רִיאשֹׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: fr
  text: Les fils d’Aaron, issus des clans qehatites parmi les descendants de Lévi, reçurent le premier lot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ce fut
  rationale: Cette tournure rend l’introduction narrative et la valeur existentielle de היה sans conserver mécaniquement le waw initial.
- source_word: לִבְנֵי אַהֲרֹן
  choice: pour les fils d’Aaron
  rationale: La préposition ל indique ici le bénéficiaire de l’attribution, tandis que « fils d’Aaron » conserve la formulation généalogique.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: parmi les clans des Qehatites
  rationale: מִשְׁפָּחוֹת désigne ici des groupes familiaux étendus au sein d’une division tribale; « clans » est naturel dans ce contexte. Le gentilé collectif est rendu par « Qehatites ».
- source_word: מִבְּנֵי לֵוִי
  choice: descendants de Lévi
  rationale: Cette formulation exprime naturellement en français l’appartenance généalogique indiquée par « fils de Lévi », sans suggérer uniquement les fils immédiats.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’attribution mentionnée; « car » maintient clairement le lien causal dans un registre narratif digne.
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: le premier lot leur revint
  rationale: La tournure française exprime idiomatiquement que ce groupe reçut le premier lot, tout en conservant l’idée d’attribution par tirage au sort.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe généalogique est légèrement allégée pour éviter une succession pesante de « fils de », sans modifier les rapports d’appartenance. « Qehatites » suit une translittération française courante du nom hébreu קְהָת.
