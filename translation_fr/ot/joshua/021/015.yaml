  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: fr
  text: Holôn avec ses pâturages[a], et Debir avec ses pâturages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La liste parallèle de 1 Chroniques 6.58 (6.43 dans le texte hébreu) donne « Hilen » pour cette ville; Josué porte ici « Holôn ».
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: Holôn
  rationale: Nom de lieu transcrit en français à partir de la forme massorétique de Josué. L’accent circonflexe indique naturellement la voyelle longue dans la translittération française usuelle.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts dépendant de la ville, notamment destinés au bétail. « Ses pâturages » est clair, naturel et adapté au contexte des villes lévitiques; le possessif renvoie chaque fois à la ville citée.
- source_word: דְּבִר
  choice: Debir
  rationale: Nom de lieu transcrit directement, sans traduire son éventuel sens lexical.
- source_word: וְאֶת
  choice: et / avec
  rationale: La conjonction coordonne les éléments de la liste, tandis que le marqueur d’objet n’a pas d’équivalent français direct. La relation entre chaque ville et ses terrains est rendue idiomatiquement par « avec ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève de la liste est conservée, avec une formulation idiomatique pour l’association des villes à leurs pâturages.
