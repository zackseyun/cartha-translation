  text: וַ/יִּתְּנ֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/לְוִיִּ֔ם אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה בַּ/גּוֹרָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: fr
  text: Les Israélites donnèrent donc aux Lévites ces villes avec leurs pâturages, comme Yahweh l’avait ordonné par l’intermédiaire de Moïse, par tirage au sort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: donnèrent donc
  rationale: Le verbe נתן désigne ici l’attribution effective des villes. « Donnèrent » en conserve le sens direct, tandis que « donc » marque naturellement la continuité narrative du wayyiqtol.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais désigne collectivement le peuple. « Les Israélites » est naturel, exact et inclusif en français moderne.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Rend directement le datif et le nom du groupe tribal.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: Conserve la valeur démonstrative renvoyant aux villes qui viennent d’être énumérées.
- source_word: מִגְרְשֵׁיהֶן
  choice: leurs pâturages
  rationale: Dans ce contexte d’attribution territoriale, le terme désigne les terrains ouverts autour des villes, notamment destinés au bétail. « Pâturages » exprime clairement leur fonction principale.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme … l’avait ordonné
  rationale: « Comme » exprime la conformité à l’ordre divin; le plus-que-parfait situe naturellement cet ordre avant son exécution.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Rend idiomatiquement l’expression hébraïque « par la main de Moïse », qui indique une action ou une parole transmise par sa médiation.
- source_word: בַּגּוֹרָל
  choice: par tirage au sort
  rationale: Explicite en français courant la procédure d’attribution par le sort.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve sans le remplacer par un titre.
- issue: Médiation de Moïse dans בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  alternative: par la main de Moïse
  rationale: La formulation choisie rend clairement l’agence médiatisée sans suggérer que Moïse serait l’auteur indépendant du commandement.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure littérale « fils d’Israël » est rendue par l’appellation collective naturelle « Israélites ». L’idiome hébreu « par la main de Moïse » est exprimé clairement, sans note nécessaire.
