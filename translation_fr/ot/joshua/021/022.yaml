source:
  edition: WLC
  text: וְ/אֶת קִבְצַ֨יִם֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת בֵּ֥ית חוֹרֹ֖ן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/022.yaml
  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: fr
  text: ainsi que Qibtsaïm avec ses pâturages[a], et Beth-Horon avec ses pâturages — quatre villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « terres de pâture ». Le terme hébreu désigne les terrains ouverts dépendant d’une ville.
    reason: Préciser l’étendue sémantique de מִגְרָשׁ, que « pâturages » peut rendre de façon plus étroite.
lexical_decisions:
- source_word: קִבְצַיִם
  choice: Qibtsaïm
  rationale: Nom de lieu translittéré selon des conventions françaises qui rendent généralement ק par « q » et marquent les deux syllabes finales.
- source_word: מִגְרָשֶׁהָ
  choice: avec ses pâturages
  rationale: Le terme désigne les terrains ouverts dépendant d’une ville, notamment utilisables pour le bétail. « Pâturages » est naturel et clair dans ce contexte, tandis que la note préserve l’étendue possible du sens.
- source_word: בֵּית חוֹרֹן
  choice: Beth-Horon
  rationale: Translittération française courante du nom de lieu; le nom propre n’est pas traduit littéralement.
- source_word: עָרִים אַרְבַּע
  choice: quatre villes
  rationale: Rend directement la formule récapitulative qui clôt la liste.
- source_word: וְאֶת ... וְאֶת
  choice: ainsi que ... et
  rationale: « Ainsi que » signale naturellement en français que le verset poursuit l’énumération précédente; les marqueurs d’objet אֶת ne sont pas traduits séparément.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève de l’énumération et sa formule finale sont conservées; le tiret met en relief le récapitulatif.
