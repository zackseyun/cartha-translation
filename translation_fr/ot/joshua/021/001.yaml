  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: fr
  text: Alors les chefs des maisons paternelles des Lévites s’approchèrent du prêtre Éléazar, de Josué, fils de Noun, et des chefs des maisons paternelles des tribus des fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des tribus des Israélites ». Littéralement : « des fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: s’approchèrent
  rationale: Le verbe נגשׁ exprime ici le fait de s’avancer vers des responsables pour leur présenter une demande; « s’approchèrent » conserve le mouvement narratif et le ton administratif.
- source_word: רָאשֵׁי אֲבוֹת
  choice: les chefs des maisons ancestrales
  rationale: L’expression hébraïque désigne les dirigeants de groupements familiaux structurés selon l’ascendance paternelle. « Maisons ancestrales » reste proche de l’organisation sociale visée tout en étant plus naturel en français que « maisons des pères ».
- source_word: הַלְוִיִּם
  choice: des Lévites
  rationale: Désignation française usuelle du groupe tribal des לְוִיִּם.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: du prêtre Éléazar
  rationale: כֹּהֵן signifie directement « prêtre ». L’antéposition française du titre produit une formulation naturelle sans ajouter de fonction au texte.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: de Josué, fils de Noun
  rationale: Rendu français traditionnel et précis de la construction patronymique hébraïque.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: des chefs des maisons ancestrales des tribus
  rationale: 'Le rendu maintient les deux niveaux de l’organisation sociale évoquée: les maisons ancestrales et les tribus.'
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Le texte dit littéralement « fils d’Israël ». Ce rendu conserve l’image familiale et collective de l’hébreu; une note indique l’équivalent idiomatique moderne.
theological_decisions:
- issue: Langage masculin de parenté dans la structure tribale d’Israël
  choice: Conserver « fils d’Israël » et rendre רָאשֵׁי אֲבוֹת par « chefs des maisons ancestrales »
  alternative: « Israélites » et « chefs de famille »
  rationale: « Fils d’Israël » préserve l’expression de parenté collective du texte. Pour רָאשֵׁי אֲבוֹת, « maisons ancestrales » garde la structure lignagère sans employer le calque français peu naturel « maisons des pères ».
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’énumération solennelle du texte hébreu, tandis que « maisons ancestrales » évite un calque obscur. Le marqueur [a] figure dans le texte principal.
