    issue: « sur leur héritage »
    rationale: Cette formulation peut évoquer une localisation (« sur » un territoire) plutôt que la provenance exigée par la préposition מן. « prélevés sur leur héritage » exprime clairement que les villes et leurs terrains sont tirés de l’allotissement des Israélites.
