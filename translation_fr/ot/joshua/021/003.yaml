  source_fidelity: 'Le sens global est fidèle au texte hébreu : les fils d’Israël donnent aux Lévites les villes désignées et leurs terrains attenants, conformément à l’ordre de Yahweh. Toutefois, « sur leur héritage » est ambigu en français moderne et ne rend pas avec assez de netteté le sens de provenance de מִנַּחֲלָתָם (« prélevés sur / provenant de leur héritage »).'
