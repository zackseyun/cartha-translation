source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: fr
  text: Les fils d’Israël donnèrent donc aux Lévites ces villes et leurs pâturages[b], prélevés sur leur héritage, conformément à l’ordre de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche de Yahweh », c’est-à-dire conformément à son ordre.'
    reason: lexical_alternative
  - marker: b
    text: Terrains non bâtis dépendant des villes, utilisés notamment comme pâturages.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: donnèrent donc
  rationale: Le verbe נתן a ici son sens courant de « donner ». « Donc » rend la continuité narrative du waw, dans le contexte de l’exécution de l’ordre précédent.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend directement l’expression familiale masculine de l’hébreu, tout en restant compréhensible en français biblique moderne.
- source_word: לַלְוִיִּם
  choice: aux Lévites
  rationale: Datif de destinataire rendu naturellement ; « Lévites » est le terme français usuel.
- source_word: מִנַּחֲלָתָם
  choice: sur leur héritage
  rationale: Dans ce contexte territorial, la préposition מן indique que les villes sont prélevées sur la part foncière reçue en héritage. « Sur leur héritage » est idiomatique en français.
- source_word: אֶל פִּי יְהוָה
  choice: conformément à l’ordre de Yahweh
  rationale: L’expression littérale « selon la bouche de Yahweh » est un idiome signifiant que l’action s’effectue conformément à son ordre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: Rendu direct du nom accompagné du démonstratif.
- source_word: מִגְרְשֵׁיהֶן
  choice: leurs pâturages
  rationale: Désigne les terrains non bâtis dépendant des villes, notamment destinés au bétail ; « pâturages » communique clairement leur fonction principale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin. Sa transcription préserve cette donnée sans le remplacer par un titre.
- issue: Rendu de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le choix conserve la formulation familiale masculine du texte source. La note signale l’équivalent collectif naturel sans effacer la forme hébraïque.
translation_notes:
  register: Français international moderne, digne et lisible. La structure du verset reste proche de l’hébreu, avec une formulation idiomatique pour אֶל־פִּי. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
