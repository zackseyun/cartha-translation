  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: fr
  text: Yahweh leur accorda le repos de tous côtés, conformément à tout ce qu’il avait juré à leurs pères. Aucun homme parmi tous leurs ennemis ne put leur résister[a] ; Yahweh livra tous leurs ennemis en leur pouvoir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne se tint devant eux ». Dans cet idiome hébreu, « se tenir devant » signifie résister avec succès.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans leur main », expression hébraïque courante signifiant « en leur pouvoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: leur accorda le repos
  rationale: Le hifil de נוח exprime ici le fait de procurer ou d’accorder le repos. Cette formulation française est naturelle et conserve le thème du repos accordé après la conquête.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִסָּבִיב
  choice: de tous côtés
  rationale: Cette locution rend le sens spatial et global de la sécurité accordée face aux menaces environnantes.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: conformément à tout ce qu’il avait juré
  rationale: La formulation conserve à la fois l’idée de conformité et la totalité de l’accomplissement du serment.
- source_word: לַאֲבוֹתָם
  choice: à leurs pères
  rationale: Le terme hébreu est explicitement masculin et désigne ici les pères ancestraux d’Israël.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: Aucun homme … ne put leur résister
  rationale: Le sens idiomatique de « se tenir devant » dans ce contexte militaire est celui de résister avec succès. La traduction conserve אִישׁ par « homme » tout en exprimant clairement l’idiome.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: parmi tous leurs ennemis
  rationale: 'La préposition מן a ici une valeur partitive : pas un seul homme appartenant à l’ensemble de leurs ennemis.'
- source_word: נָתַן ... בְּיָדָם
  choice: livra … en leur pouvoir
  rationale: L’expression hébraïque signifie remettre quelqu’un au pouvoir d’un autre. Cette traduction française transmet naturellement l’idiome, dont l’image littérale est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » en conserve la fonction de nom personnel.
- issue: Langage masculin dans לַאֲבוֹתָם et אִישׁ
  choice: leurs pères / aucun homme
  alternative: leurs ancêtres / personne
  rationale: Les formes masculines du texte source sont conservées sans neutralisation, puisqu’elles conviennent au contexte patriarcal et militaire.
- issue: Portée de l’affirmation sur la victoire
  choice: ne put leur résister
  alternative: ne se tint devant eux
  rationale: La formulation exprime le sens reconnu de l’idiome hébreu sans transformer l’affirmation en une proposition théologique plus large que le contexte militaire immédiat.
translation_notes:
  register: Français international moderne, digne et accessible. « Accorda le repos » maintient le motif biblique du repos sans lourdeur. Les deux idiomes militaires sont rendus selon leur sens en français, tandis que leur forme hébraïque est conservée dans les notes.
