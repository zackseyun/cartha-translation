  text: אֶת אַיָּלוֹן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/024.yaml
  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
translation:
  language: fr
  text: 'Ayalôn avec ses pâturages[a], et Gath-Rimmôn avec ses pâturages : quatre villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « terrains environnants » ; le terme hébreu désigne les terres qui dépendaient d’une ville et servaient souvent à faire paître le bétail.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Ayalôn
  rationale: Nom de lieu translittéré selon une forme française courante, avec l’accent circonflexe indiquant la voyelle longue traditionnelle.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains dépendant de la ville, situés autour d’elle et notamment destinés au bétail. « Pâturages » exprime naturellement leur fonction probable dans le contexte des villes lévitiques.
- source_word: גַּת רִמּוֹן
  choice: Gath-Rimmôn
  rationale: Nom composé translittéré et relié par un trait d’union pour être reconnu comme un seul toponyme.
- source_word: עָרִים אַרְבַּע
  choice: quatre villes
  rationale: Formule récapitulative directe; « villes » convient au sens administratif de עָרִים dans les listes de répartition.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: structure de liste rendue par « avec » et « et »
  rationale: La marque répétée de l’objet direct n’a pas d’équivalent autonome naturel en français; la syntaxe française restitue la coordination de la liste.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve le rythme bref d’une liste territoriale et emploie des toponymes de forme française.
