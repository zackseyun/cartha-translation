base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/023.yaml
  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: fr
  text: 'Et de la tribu de Dan : Elteqé avec ses pâturages[a], et Guibbetôn avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les terrains qui l’entourent » ou « ses terres communales », pour l’hébreu מִגְרָשֶׁהָ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: Et, de la tribu de Dan
  rationale: Dans le contexte du partage territorial, מַטֶּה désigne la tribu. La conjonction et la préposition sont rendues naturellement par « Et, de ».
- source_word: אֶת
  choice: '[marque de l’objet direct non traduite]'
  rationale: La particule hébraïque signalant l’objet direct défini n’a pas d’équivalent lexical en français.
- source_word: אֶלְתְּקֵא
  choice: Elteqé
  rationale: Le nom de lieu est translittéré en suivant des conventions françaises lisibles, avec q pour ק et un é final pour rendre la voyelle.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts entourant une ville, notamment destinés au bétail et à l’usage commun. Le suffixe féminin singulier renvoie à la ville; le français emploie naturellement le possessif pluriel « ses » avec « pâturages ».
- source_word: גִּבְּתוֹן
  choice: Guibbetôn
  rationale: 'Le nom propre est translittéré selon des conventions françaises lisibles : gu devant i pour le son /g/, consonne redoublée pour le dagesh et accent circonflexe pour signaler la voyelle longue.'
- source_word: וְ/אֶת
  choice: et
  rationale: La conjonction est traduite par « et »; la marque de l’objet direct n’est pas rendue séparément.
