  yaml_path: translation/ot/joshua/021/035.yaml
  text: Dimnah with its pasturelands[b][a], and Nahalal with its pasturelands—four cities.
translation:
  language: fr
  text: Dimna avec ses pâturages[a][b], et Nahalal avec ses pâturages — quatre villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux ».
    reason: lexical_alternative
  - marker: b
    text: Les manuscrits hébreux et les versions anciennes divergent quant à la présence et à l’ordre de certains noms de villes dans cette section; comparer la liste parallèle en 1 Chroniques 6.62 [6.77 dans certaines éditions].
    reason: textual_variant
lexical_decisions:
- source_word: דִּמְנָה
  choice: Dimna
  rationale: Nom de lieu translittéré selon une forme française naturelle, sans traduire le nom propre.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts dépendant de chaque ville, notamment destinés au pâturage dans le contexte des villes lévitiques. Le suffixe féminin singulier est rendu par « ses ».
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Nom de lieu translittéré; cette forme reproduit clairement les consonnes du texte hébreu et reste naturelle en français.
- source_word: עָרִים אַרְבַּע
  choice: quatre villes
  rationale: Rendu direct de la formule récapitulative qui clôt la liste.
