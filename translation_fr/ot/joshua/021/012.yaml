  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָֽתְנ֛וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה בַּ/אֲחֻזָּתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: fr
  text: Mais ils donnèrent à Caleb, fils de Yefounné, les terres de la ville et les villages qui en dépendaient[a], comme sa propriété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hameaux qui l’entouraient » ou « les établissements qui en dépendaient ». Le terme hébreu peut désigner les petites localités ou zones habitées rattachées à une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: les terres de la ville
  rationale: Le nom est au singulier construit, mais il désigne collectivement le territoire agricole rattaché à la ville. « Les terres » rend ce sens naturel en français sans le limiter à une seule parcelle.
- source_word: חֲצֵרֶיהָ
  choice: les villages qui en dépendaient
  rationale: Dans ce contexte territorial, חֲצֵרִים désigne vraisemblablement des localités secondaires ou établissements dépendant de la ville, plutôt que de simples cours. La relation de dépendance est explicitée pour être claire en français.
- source_word: נָתְנוּ
  choice: ils donnèrent
  rationale: Le verbe נתן signifie simplement « donner ». Le sujet pluriel, implicite en hébreu, est conservé sans préciser davantage son identité.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: à Caleb, fils de Yefounné
  rationale: La préposition marque le destinataire. « Yefounné » suit une translittération française moderne du nom hébreu.
- source_word: בַּאֲחֻזָּתוֹ
  choice: pour qu’ils soient sa propriété
  rationale: אֲחֻזָּה désigne un bien foncier détenu durablement. Cette formulation exprime clairement le statut de possession tout en évitant de traduire automatiquement par « héritage ».
- source_word: וְ
  choice: Mais
  rationale: 'La conjonction relie le verset au précédent en marquant ici un contraste : la ville et ses pâturages revenaient aux prêtres, tandis que les terres agricoles et les localités dépendantes revenaient à Caleb.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe française rétablit l’ordre usuel sujet-verbe-compléments, tout en conservant le contraste avec le verset précédent et le sujet pluriel non précisé de l’hébreu.
