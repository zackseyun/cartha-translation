  yaml_path: translation/ot/joshua/021/029.yaml
  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: fr
  text: Yarmouth avec ses pâturages, et En-Gannim[a] avec ses pâturages — quatre villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi la graphie « Aïn-Gannim ».
    reason: Variante de translittération du nom hébreu.
lexical_decisions:
- source_word: יַרְמוּת
  choice: Yarmouth
  rationale: Nom de lieu translittéré selon un usage français courant; l’initiale hébraïque י est rendue par « Y ».
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Dans les listes d’attribution, מִגְרָשׁ désigne les terrains ouverts entourant une ville, notamment destinés au bétail. « Ses pâturages » est naturel en français et conserve le suffixe féminin singulier renvoyant à chaque ville.
- source_word: עֵין גַּנִּים
  choice: En-Gannim
  rationale: Le nom propre est translittéré plutôt que traduit; ses éléments pourraient littéralement évoquer une « source des jardins », mais il fonctionne ici comme toponyme.
- source_word: עָרִים אַרְבַּע
  choice: quatre villes
  rationale: Rendu direct de la formule récapitulative employée dans cette liste de villes.
