  text: כֹּ֚ל עָרֵ֣י הַ/לְוִיִּ֔ם בְּ/ת֖וֹךְ אֲחֻזַּ֣ת בְּנֵֽי יִשְׂרָאֵ֑ל עָרִ֛ים אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה וּ/מִגְרְשֵׁי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: fr
  text: Toutes les villes des Lévites au sein du territoire des fils d’Israël[a] étaient au nombre de quarante-huit, avec leurs pâturages[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites » ou « des enfants d’Israël ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « leurs terrains ouverts » ou « leurs terrains communaux » : il s’agit des terres entourant les villes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Toutes
  rationale: Exprime simplement et naturellement la totalité des villes récapitulées.
- source_word: עָרֵי הַלְוִיִּם
  choice: les villes des Lévites
  rationale: Reproduit clairement la relation génitive du syntagme hébreu sans la rendre plus interprétative.
- source_word: בְּתוֹךְ
  choice: situées au milieu de
  rationale: Rend la localisation de ces villes à l’intérieur du territoire détenu par Israël tout en donnant une phrase française naturelle.
- source_word: אֲחֻזַּת
  choice: la propriété
  rationale: Désigne ici le territoire détenu ou possédé; « propriété » conserve ce sens foncier sans imposer la nuance d’« héritage ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve la forme masculine et la transparence du syntagme national hébreu; « les Israélites » reste une possibilité idiomatique signalée en note.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: étaient au nombre de quarante-huit
  rationale: Restitue en français idiomatique le bilan numérique appositionnel de l’hébreu.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: avec leurs pâturages
  rationale: Dans le contexte des attributions urbaines, le terme désigne les terrains ouverts entourant les villes, notamment destinés au bétail.
theological_decisions:
- issue: Désignation collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: La formulation conserve le masculin grammatical du texte hébreu et sa forme filiale, sans nier que l’expression désigne collectivement le peuple d’Israël.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite une répétition maladroite de « villes » tout en conservant exactement le total et les rapports territoriaux du texte hébreu.
