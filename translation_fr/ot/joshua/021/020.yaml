  text: וּ/לְ/מִשְׁפְּח֤וֹת בְּנֵֽי קְהָת֙ הַ/לְוִיִּ֔ם הַ/נּוֹתָרִ֖ים מִ/בְּנֵ֣י קְהָ֑ת וַֽ/יְהִי֙ עָרֵ֣י גֽוֹרָלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: fr
  text: Quant aux familles des descendants de Qehath, les Lévites qui restaient parmi les descendants de Qehath, les villes qui leur furent attribuées par le sort provenaient de la tribu d’Éphraïm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: Quant aux familles
  rationale: Le ל introduit ici les groupes familiaux concernés par la répartition; « Quant aux » donne en français une transition naturelle dans la liste tout en maintenant ce rapport.
- source_word: בְּנֵי קְהָת
  choice: descendants de Qehath
  rationale: Dans ce contexte généalogique et collectif, בְּנֵי désigne les descendants de Qehath plutôt que ses seuls fils immédiats.
- source_word: הַלְוִיִּם הַנּוֹתָרִים מִבְּנֵי קְהָת
  choice: les autres descendants de Qehath, les Lévites
  rationale: הַנּוֹתָרִים désigne le reste des Qehathites après l’attribution précédente. « Les autres » exprime cette valeur contextuelle plus naturellement que « ceux qui restaient », tandis que l’apposition conserve leur identification comme Lévites.
- source_word: עָרֵי גוֹרָלָם
  choice: les villes qui leur furent attribuées par tirage au sort
  rationale: Cette formulation explicite naturellement l’idiome hébreu « les villes de leur lot » et conserve le rôle du גורל dans l’attribution.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: se trouvaient dans la tribu d’Éphraïm
  rationale: Le מן indique ici la provenance territoriale de l’attribution. En français, « dans la tribu » exprime clairement que les villes provenaient du territoire tribal d’Éphraïm.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite le calque peu naturel « les villes de leur lot » tout en préservant l’idée d’une attribution par tirage au sort. La répétition de Qehath dans l’hébreu est légèrement condensée afin d’obtenir une phrase française claire sans perte référentielle.
