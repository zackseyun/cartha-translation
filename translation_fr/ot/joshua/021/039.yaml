  text: אֶת חֶשְׁבּוֹן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת יַעְזֵ֖ר וְ/אֶת מִגְרָשֶׁ֑/הָ כָּל עָרִ֖ים אַרְבַּֽע־־־־־׃
