  language: en
  yaml_path: translation/ot/joshua/021/039.yaml
  text: Heshbon with its pasturelands[a], and Jazer with its pasturelands—four cities in all.
translation:
  language: fr
  text: Heshbon avec ses pâturages[a], et Yazer avec ses pâturages — quatre villes en tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « terrains environnants » pour chaque ville ; le terme hébreu désigne les espaces non bâtis dépendant d’une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Heshbon
  rationale: Nom de lieu conservé sous une forme translittérée courante et proche de l’hébreu.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains non bâtis dépendant d’une ville, notamment destinés au pâturage. Le pluriel français convient à ces étendues environnantes et le possessif reprend chaque ville.
- source_word: יַעְזֵר
  choice: Yazer
  rationale: Translittération française naturelle du nom hébreu, avec y pour la consonne initiale et z pour rendre la consonne médiane.
- source_word: כָּל עָרִים אַרְבַּע
  choice: quatre villes en tout
  rationale: 'Cette formulation idiomatique restitue le résumé hébreu littéralement proche de « toutes les villes : quatre ».'
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: coordination de la liste
  rationale: Les marques répétées de l’objet direct n’ont pas d’équivalent lexical nécessaire en français; la structure coordonnée en porte la fonction.
