  text: Jattir avec ses pâturages[a], et Eshtemoa avec ses pâturages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux », c’est-à-dire les terres qui entouraient chaque ville.
