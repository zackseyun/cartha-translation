lexical_decisions:
- source_word: יַתִּר
  choice: Jattir
  rationale: Nom de lieu transcrit selon la forme française biblique usuelle, plutôt que traduit.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts entourant une ville, notamment ceux destinés à l’usage collectif et au pâturage dans les listes de villes lévitiques. Le suffixe féminin singulier renvoie chaque fois à la ville.
- source_word: אֶשְׁתְּמֹעַ
  choice: Eshtemoa
  rationale: Nom de lieu transcrit sous une forme claire et conforme à l’usage biblique français.
- source_word: וְאֶת
  choice: et
  rationale: La conjonction relie les éléments de la liste; le marqueur hébreu de l’objet direct n’a pas d’équivalent explicite naturel en français.
