  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: fr
  text: 'et de la tribu de Benjamin : Gabaon avec ses pâturages[a], et Guéba avec ses pâturages ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « espaces libres », pour désigner les terres entourant chaque ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה בִנְיָמִן
  choice: et, de la tribu de Benjamin
  rationale: Dans le contexte des attributions territoriales, מַטֶּה désigne une tribu. Les préfixes וּמִ־ sont rendus par « et, de », en continuité avec la liste précédente.
- source_word: גִּבְעוֹן
  choice: Guibéon
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains non bâtis entourant une ville lévitique, notamment destinés au bétail. « Pâturages » est ici une formulation française claire et naturelle; le suffixe féminin renvoie à la ville.
- source_word: גֶּבַע
  choice: Guéba
  rationale: Forme française usuelle de ce nom de lieu.
- source_word: וְ/אֶת
  choice: et
  rationale: La conjonction coordonne les villes énumérées; le marqueur d’objet direct אֶת n’est pas rendu séparément en français.
