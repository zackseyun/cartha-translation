  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: fr
  text: 'Ils leur parlèrent à Silo, dans le pays de Canaan, en ces termes : « Yahweh a ordonné, par l’intermédiaire de Moïse[a], qu’on nous donne des villes où habiter, ainsi que les pâturages qui les entourent[b] pour notre bétail. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse », expression hébraïque signifiant ici « par l’intermédiaire de Moïse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les terrains communaux qui les entourent ». Le terme hébreu désigne les espaces ouverts autour des villes, utilisés notamment pour faire paître le bétail.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: Ils leur parlèrent
  rationale: Le piel de דבר signifie ici « parler », et אֶל marque les destinataires. Le passé simple convient au récit français soutenu sans être archaïque.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: à Silo, dans le pays de Canaan
  rationale: « À Silo » est idiomatique pour le lieu de la rencontre, tandis que « dans le pays de Canaan » conserve explicitement אֶרֶץ, « pays ».
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule française introduit naturellement le discours direct sans reproduire servilement l’hébraïsme « en disant ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: צִוָּה בְיַד מֹשֶׁה
  choice: a ordonné, par l’intermédiaire de Moïse
  rationale: צוה est le verbe usuel pour « ordonner ». L’expression בְיַד, littéralement « par la main de », indique ici la médiation de Moïse.
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: qu’on nous donne des villes où habiter
  rationale: La tournure impersonnelle « qu’on nous donne » préserve l’absence de sujet explicite pour נתן. « Où habiter » exprime naturellement la finalité de לָשָׁבֶת.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: ainsi que les pâturages qui les entourent
  rationale: מִגְרָשׁ désigne les terrains ouverts dépendant des villes, notamment destinés au bétail. L’ajout relationnel « qui les entourent » explicite le suffixe féminin pluriel renvoyant aux villes.
- source_word: לִבְהֶמְתֵּנוּ
  choice: pour notre bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques; « bétail » est précis et naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin. « Yahweh » le préserve sans le remplacer par un titre.
- issue: Agent non exprimé de לָתֶת
  choice: qu’on nous donne
  alternative: de nous donner
  rationale: L’hébreu ne précise pas grammaticalement qui doit donner les villes. La construction impersonnelle française conserve cette indétermination au lieu de faire de Yahweh le sujet direct de « donner ».
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. Les deux notes sont placées immédiatement après les expressions auxquelles elles se rapportent, conformément au sens de l’hébreu.
