base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: fr
  text: 'De la tribu des fils de Juda et de la tribu des fils de Siméon, ils donnèrent les villes suivantes[a], désignées nommément :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ces villes, qu’on appelle par leur nom ». L’expression hébraïque indique que les villes sont nommées individuellement dans la liste qui suit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ils donnèrent
  rationale: Le verbe נתן signifie ici « donner » au sens d’attribuer des villes aux Lévites. La traduction directe convient au contexte du partage.
- source_word: מִמַּטֵּה
  choice: de la tribu de
  rationale: Dans le contexte des répartitions territoriales, מַטֶּה désigne une tribu, et non le bâton qui constitue son sens concret.
- source_word: בְּנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: Cette formulation conserve l’expression généalogique hébraïque tout en restant intelligible comme désignation tribale.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: et de la tribu des fils de Siméon
  rationale: La traduction garde le parallélisme exact avec la mention de Juda et préserve la désignation généalogique.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: les villes suivantes
  rationale: Puisqu’une liste suit immédiatement, « les villes suivantes » rend naturellement la valeur déictique de « ces villes » en français.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: dont les noms sont indiqués
  rationale: L’expression hébraïque idiomatique annonce que chaque ville sera nommée dans la liste qui suit. Cette formulation française en communique clairement la fonction sans préciser davantage que le texte.
