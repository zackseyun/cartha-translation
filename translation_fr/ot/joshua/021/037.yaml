base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/037.yaml
  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: fr
  text: 'Kedémoth avec ses pâturages[a], et Méphaath avec ses pâturages : quatre villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « terrains communaux » ou « pâturages environnants » : terrains rattachés à chaque ville (hébreu מִגְרָשׁ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedémoth
  rationale: Nom de lieu translittéré selon une forme française lisible, avec accents indiquant naturellement la prononciation.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains non bâtis rattachés à la ville, notamment destinés au bétail. « Pâturages » est clair et naturel; le possessif renvoie chaque fois à la ville nommée.
- source_word: מֵיפָעַת
  choice: Méphaath
  rationale: Nom de lieu translittéré dans une forme française qui conserve la distinction consonantique traditionnelle.
- source_word: עָרִים אַרְבַּע
  choice: quatre villes
  rationale: Rend directement le récapitulatif numérique et maintient le vocabulaire usuel des listes territoriales.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: avec ... et ... avec ...
  rationale: Les marqueurs d’objet structurent la liste; « avec » exprime naturellement en français le lien entre chaque ville et les terrains qui lui sont rattachés.
