  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת קִרְיַת֩ אַרְבַּ֨ע אֲבִ֧י הָֽ/עֲנ֛וֹק הִ֥יא חֶבְר֖וֹן בְּ/הַ֣ר יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: fr
  text: Ils leur donnèrent Qiryath-Arba — Arba était le père d’Anak[a] —, c’est-à-dire Hébron, dans la région montagneuse de Juda, avec les pâturages qui l’entouraient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Arba était l’ancêtre d’Anak ». L’expression hébraïque peut désigner le père immédiat ou un ancêtre plus éloigné.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils leur donnèrent donc
  rationale: Le wayyiqtol de נתן poursuit la séquence narrative. « donc » rend naturellement cette progression en français, tandis que le pronom destinataire reste explicite.
- source_word: קִרְיַת אַרְבַּע
  choice: Qiryath-Arba
  rationale: Le nom de lieu est translittéré plutôt que traduit littéralement par « ville d’Arba »; la graphie choisie reflète de près l’hébreu tout en restant lisible en français.
- source_word: אֲבִי הָעֲנֹוק
  choice: Arba était le père d’Anaq
  rationale: L’apposition hébraïque identifie Arba par son lien avec Anaq. La phrase complète est naturelle en français; une note conserve la possibilité d’un ancêtre plus éloigné.
- source_word: הִיא חֶבְרוֹן
  choice: c’est-à-dire Hébron
  rationale: 'Le pronom suivi du nom de lieu a ici une fonction explicative: Qiryath-Arba est identifiée à Hébron.'
- source_word: בְּהַר יְהוּדָה
  choice: dans la région montagneuse de Juda
  rationale: Dans cette expression géographique, הַר désigne les hautes terres de Juda plutôt qu’une montagne isolée.
- source_word: מִגְרָשֶׁיהָ
  choice: les pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts attenants à une ville, notamment destinés au pacage; « pâturages » est clair et adapté au contexte.
- source_word: סְבִיבֹתֶיהָ
  choice: qui l’entouraient
  rationale: Cette formulation rend naturellement l’idée des terrains situés tout autour de la ville.
theological_decisions:
- issue: Nature du lien entre Arba et Anaq
  choice: père
  alternative: ancêtre
  rationale: Le sens premier de אָב est « père », mais le terme peut aussi désigner un ancêtre. Le texte retient le sens direct sans éliminer l’ambiguïté, signalée en note.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au récit biblique écrit; les tirets isolent clairement l’apposition. Les noms propres suivent une translittération française cohérente avec les formes hébraïques, tandis que « Hébron » et « Juda » conservent leurs formes françaises établies.
