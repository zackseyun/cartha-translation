base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: fr
  text: Aux fils d’Aaron, le prêtre, ils donnèrent Hébron, la ville de refuge pour l’auteur d’un homicide[a], avec ses pâturages, ainsi que Libna avec ses pâturages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner celui qui tue ou l’auteur d’un homicide. Dans le cadre juridique des villes de refuge, il n’indique pas à lui seul si l’acte était prémédité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Aux fils du prêtre Aaron
  rationale: Le לְ marque ici les bénéficiaires. « Fils » conserve la forme hébraïque tout en désignant la lignée sacerdotale d’Aaron; « du prêtre Aaron » rend naturellement l’apposition hébraïque.
- source_word: נָתְנוּ
  choice: ils donnèrent
  rationale: Le verbe נתן signifie couramment « donner ». Le passé simple convient au registre narratif biblique sans remplacer le terme par l’interprétation contextuelle « attribuer ».
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ville de refuge pour celui qui avait tué quelqu’un
  rationale: « Ville de refuge » rend l’expression juridique établie עִיר מִקְלָט. La périphrase choisie reste compréhensible et n’impose ni préméditation ni innocence, conformément à la fonction de ces villes dans le contexte légal.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française usuelle du nom de lieu.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les espaces ouverts dépendant d’une ville, notamment destinés au bétail. « Pâturages » est clair et naturel dans le contexte des villes lévitiques.
- source_word: לִבְנָה
  choice: Libna
  rationale: Forme française traditionnelle et courante du nom de lieu.
theological_decisions:
- issue: Portée juridique de הָרֹצֵחַ
  choice: celui qui avait tué quelqu’un
  alternative: le meurtrier
  rationale: « Meurtrier » suggérerait en français un homicide volontaire et coupable. Or, dans la législation des villes de refuge, le terme vise l’auteur d’un homicide dont le degré de culpabilité doit être établi; la traduction conserve cette tension sans l’innocenter.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif; la formulation juridique reste accessible sans introduire une qualification pénale absente du verset.
