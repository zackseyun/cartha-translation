    issue: Préposition de l’attribution initiale
    rationale: La formule « tomba sur les clans » peut se comprendre comme une désignation qui les atteint, mais לְמִשְׁפְּחֹת marque les bénéficiaires/destinataires du lot. « Échut aux clans » exprime plus précisément cette relation.
  - severity: low
    issue: Rendu de l’apposition « Aaron le prêtre »
    rationale: « Les fils d’Aaron, le prêtre » préserve l’ordre et l’apposition du texte hébreu, tout en restant naturel en français.
