base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: fr
  text: Le sort échut aux clans des Qehatites. Les fils d’Aaron, le prêtre, parmi les Lévites, obtinrent par le sort treize villes de la tribu de Juda, de la tribu de Siméon et de la tribu de Benjamin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: Le sort tomba
  rationale: L’expression hébraïque signifie littéralement que « le sort sortit ». « Le sort tomba » est l’idiome français naturel correspondant et conserve l’image d’un résultat obtenu par tirage au sort.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: sur les clans des Qehatites
  rationale: מִשְׁפָּחָה désigne ici les subdivisions familiales du groupe lévitique; « clans » est plus précis que « familles » dans ce contexte généalogique et tribal. Le collectif hébreu est rendu naturellement par « les Qehatites ».
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Les fils du prêtre Aaron […] reçurent
  rationale: La proposition hébraïque est elliptique. « Reçurent » explicite sobrement l’attribution indiquée par la suite du verset, tandis que « fils » préserve l’expression de parenté du texte source.
- source_word: מִן הַלְוִיִּם
  choice: qui faisaient partie des Lévites
  rationale: 'Cette formulation rend clairement la valeur partitive de מִן : les fils d’Aaron constituent un groupe au sein des Lévites.'
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: sur la tribu de Juda, sur la tribu de Siméon et sur la tribu de Benjamin
  rationale: מַטֶּה désigne ici une tribu. La répétition de « sur la tribu de » reflète la structure répétitive de l’hébreu, et « prises sur » indique que les villes provenaient des territoires de ces tribus.
- source_word: בַּגּוֹרָל
  choice: par tirage au sort
  rationale: La préposition marque le moyen d’attribution. « Par tirage au sort » est clair et idiomatique en français moderne.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: treize villes
  rationale: « Villes » est le terme usuel et cohérent dans les récits de répartition territoriale.
