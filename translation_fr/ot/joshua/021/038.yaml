source:
  edition: WLC
  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: fr
  text: 'Et de la tribu de Gad : Ramoth en Galaad[a], la ville de refuge pour celui qui a tué[b], avec ses pâturages[c], et Mahanaïm avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ramoth-de-Galaad », selon la forme traditionnelle du nom.
    reason: alternative_reading
  - marker: b
    text: Littéralement « le tueur ». Dans le contexte des villes de refuge, il s’agit de l’auteur d’un homicide, sans que cette expression précise à elle seule si l’acte était volontaire ou accidentel.
    reason: lexical_alternative
  - marker: c
    text: Il s’agit des terrains entourant la ville et attribués avec elle, notamment pour les troupeaux.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה גָד
  choice: De la tribu de Gad
  rationale: Dans le contexte du partage territorial, מַטֶּה désigne la tribu. En français, la coordination initiale implicite dans cette liste n’exige pas nécessairement « Et » après les deux-points du verset précédent.
- source_word: עִיר מִקְלַט
  choice: ville de refuge
  rationale: Expression française établie qui rend précisément l’institution juridique désignée par l’hébreu.
- source_word: הָרֹצֵחַ
  choice: celui qui a tué
  rationale: Dans la législation sur les villes de refuge, le terme désigne l’auteur d’un homicide sans préjuger ici de son caractère volontaire ou accidentel. Cette formulation naturelle conserve cette ouverture mieux que « meurtrier ».
- source_word: רָמֹת בַּגִּלְעָד
  choice: Ramoth en Galaad
  rationale: La préposition ב situe naturellement Ramoth dans la région de Galaad; une note signale la forme composée traditionnelle.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains attenants à la ville, notamment destinés aux troupeaux. « Pâturages » est clair, naturel et adapté à cette liste de villes lévitiques.
- source_word: מַחֲנַיִם
  choice: Mahanaïm
  rationale: Nom propre translittéré selon l’usage français courant, avec tréma pour marquer la séparation vocalique.
theological_decisions:
- issue: Qualification juridique de הָרֹצֵחַ
  choice: celui qui a tué
  alternative: le meurtrier; l’auteur d’un homicide
  rationale: « Meurtrier » peut impliquer une culpabilité intentionnelle que le régime des villes de refuge ne présuppose pas. « Celui qui a tué » préserve la tension juridique du texte sans décider d’avance de l’intention.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève de la liste est conservée. « Celui qui a tué » évite le terme juridiquement trop chargé « meurtrier », tandis que les notes expliquent les réalités géographiques et foncières.
