  variant: modern international French
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י אֶת עִ֣יר מִקְלַ֣ט הָֽ/רֹצֵ֗חַ אֶת קֶ֨דֶשׁ בַּ/גָּלִ֤יל וְ/אֶת מִגְרָשֶׁ֨/הָ֙ וְ/אֶת חַמֹּ֥ת דֹּאר֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת קַרְתָּ֖ן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שָׁלֹֽשׁ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: fr
  text: 'Et de la tribu de Nephtali : Qédesh en Galilée, ville de refuge pour l’auteur d’un homicide[a], avec ses pâturages ; Hammoth-Dor[b] avec ses pâturages ; et Qartân avec ses pâturages — trois villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour celui qui a tué ». Le terme hébreu désigne une personne ayant causé la mort, particulièrement dans le cadre juridique des villes de refuge, sans impliquer nécessairement un meurtre prémédité.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte « Hammoth-Dor » ; certaines traditions identifient ce lieu à Hammath.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: Et de la tribu de Nephtali
  rationale: Dans le contexte de la répartition territoriale, מַטֶּה désigne une tribu, non un bâton. La conjonction et la préposition sont rendues naturellement par « Et de ».
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ville de refuge pour l’auteur d’un homicide
  rationale: « Ville de refuge » est l’expression juridique consacrée. « L’auteur d’un homicide » indique qu’une personne a causé la mort sans présumer ici la préméditation, contrairement à « meurtrier ».
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Qédesh en Galilée
  rationale: Le nom du lieu est translittéré selon un usage français lisible, et בַּגָּלִיל situe la ville en Galilée.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts dépendant d’une ville, notamment destinés au bétail. « Pâturages » est clair et naturel dans cette liste.
- source_word: חַמֹּת דֹּאר
  choice: Hammoth-Dor
  rationale: Le texte consonantique présente un nom de lieu composé ; le trait d’union en reflète clairement les deux éléments.
- source_word: קַרְתָּן
  choice: Qartân
  rationale: Le nom propre est translittéré directement, avec une graphie adaptée à la lecture française.
- source_word: עָרִים שָׁלֹשׁ
  choice: trois villes
  rationale: La formule récapitulative hébraïque est rendue dans l’ordre naturel du français.
theological_decisions:
- issue: Portée juridique de הָרֹצֵחַ
  choice: l’auteur d’un homicide
  alternative: le meurtrier
  rationale: Dans les lois sur les villes de refuge, le terme désigne celui qui a tué sans établir à lui seul qu’il s’agit d’un assassinat prémédité. La traduction retenue préserve cette distinction juridique et morale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure en liste est conservée, avec une ponctuation qui facilite la lecture. Les noms propres suivent une translittération française cohérente, et le vocabulaire juridique évite d’ajouter une culpabilité intentionnelle que le verset ne précise pas.
