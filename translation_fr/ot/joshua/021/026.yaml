  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: fr
  text: Il y avait en tout dix villes[a], avec leurs pâturages[b], pour les clans restants des descendants de Qehath[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une formule récapitulative que l’on pourrait rendre plus littéralement par : « Toutes les villes étaient au nombre de dix. »'
    reason: lexical_alternative
  - marker: b
    text: Les « pâturages » sont les terrains non bâtis qui dépendaient des villes, notamment pour faire paître le bétail et pour d’autres usages liés à la vie rurale.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « fils de Qehath ». On peut aussi traduire : « Qehathites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: Il y avait en tout dix villes
  rationale: Rend naturellement en français la formule récapitulative hébraïque, tout en conservant sa valeur de total conclusif.
- source_word: מִגְרְשֵׁיהֶן
  choice: leurs pâturages
  rationale: Désigne ici les terrains non bâtis rattachés aux villes, notamment destinés au bétail; « pâturages » est clair et adapté au contexte.
- source_word: לְמִשְׁפְּחֹת
  choice: pour les clans
  rationale: מִשְׁפָּחוֹת désigne des subdivisions de parenté au sein d’une tribu; « clans » est plus précis que « familles » dans ce contexte social.
- source_word: בְּנֵי קְהָת
  choice: descendants de Qehath
  rationale: Littéralement « fils de Qehath »; « descendants » exprime clairement la portée généalogique collective en français moderne.
- source_word: הַנּוֹתָרִים
  choice: les autres
  rationale: Distingue ces clans qehathites de la branche déjà mentionnée; « les autres » est naturel et garde la relation au contexte précédent.
theological_decisions: []
