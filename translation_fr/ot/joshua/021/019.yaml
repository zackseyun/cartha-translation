  yaml_path: translation/ot/joshua/021/019.yaml
  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: fr
  text: Toutes les villes des fils d’Aaron, les prêtres, étaient au nombre de treize, avec leurs pâturages.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Le nombre total des villes
  rationale: Dans cette formule récapitulative, כָּל porte sur l’ensemble des villes énumérées. Cette tournure française rend naturellement l’idée de total et s’accorde avec le nombre qui suit.
- source_word: בְנֵי אַהֲרֹן
  choice: des fils d’Aaron
  rationale: Conserve l’expression généalogique formelle de l’hébreu et sa référence à la lignée sacerdotale, sans expliciter par « descendants ».
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Apposition qui identifie les fils d’Aaron; « les prêtres » est précis et naturel en français.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: treize
  rationale: Le nom « villes » est déjà exprimé dans la proposition; sa non-répétition donne une phrase française naturelle sans perte de sens.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: avec leurs pâturages
  rationale: Dans le contexte des villes lévitiques, מִגְרָשׁ désigne les terrains ouverts attenants destinés notamment au bétail. « Avec » rend naturellement la coordination hébraïque dans ce résumé.
