source:
  edition: WLC
  text: לֹֽא נָפַ֣ל דָּבָ֔ר מִ/כֹּל֙ הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל בֵּ֣ית יִשְׂרָאֵ֑ל הַ/כֹּ֖ל בָּֽא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: fr
  text: 'Pas une seule parole n’est restée sans effet parmi toutes les bonnes paroles que Yahweh avait adressées à la maison d’Israël[a] : tout s’est accompli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aucune des bonnes promesses que Yahweh avait faites à la maison d’Israël n’est restée sans effet. »'
    reason: Alternative contextuelle qui rend דָּבָר par « promesse » et explicite la portée de l’idiome.
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: Pas une seule parole n’est restée sans effet
  rationale: Littéralement, aucune « parole » n’est « tombée ». En contexte, l’expression signifie qu’aucune parole divine n’a échoué. « N’est restée sans effet » restitue naturellement cet idiome en français tout en conservant « parole ».
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: parmi toutes les bonnes paroles
  rationale: Le singulier collectif hébreu désigne l’ensemble des déclarations favorables de Yahweh. Le pluriel français est plus naturel ici et maintient le motif lexical de la parole sans expliciter d’emblée « promesse ».
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ... avait adressées
  rationale: Le verbe signifie « parler ». Avec un destinataire introduit par אֶל, « adresser des paroles à » est idiomatique en français et le plus-que-parfait situe ces paroles avant leur accomplissement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: Cette formulation conserve l’expression collective et covenantale de l’hébreu, sans la réduire simplement à « Israël ».
- source_word: הַכֹּל בָּא
  choice: tout s’est accompli
  rationale: Le verbe בוא signifie littéralement « venir », mais l’expression indique ici que tout ce qui avait été dit est devenu réalité. « S’est accompli » rend clairement cet idiome.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre traditionnel.
- issue: 'Sens de דָּבָר : « parole » ou « promesse »'
  choice: parole
  alternative: promesse
  rationale: « Parole » préserve la répétition lexicale et le lien avec le verbe « parler ». « Promesse » exprime justement l’implication contextuelle, mais interprète plus explicitement la nature de ces paroles; cette possibilité est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « n’est restée sans effet » évite l’archaïsme de « ne tomba à terre »; « tout s’est accompli » est clair sans surcharger le texte. Le deux-points souligne la reprise récapitulative de la dernière proposition.
