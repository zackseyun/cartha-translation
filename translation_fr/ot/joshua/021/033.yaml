  text: כָּל עָרֵ֥י הַ/גֵּרְשֻׁנִּ֖י לְ/מִשְׁפְּחֹתָ֑/ם שְׁלֹשׁ עֶשְׂרֵ֥ה עִ֖יר וּ/מִגְרְשֵׁי/הֶֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/033.yaml
  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: fr
  text: Toutes les villes des Guershonites, selon leurs clans, étaient au nombre de treize villes, avec leurs terrains de pâturage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Le nombre total des villes
  rationale: Dans cette formule récapitulative, כָּל avec le pluriel construit עָרֵי introduit l’ensemble compté. Cette tournure française rend naturellement le sens totalisant et s’accorde avec le singulier hébreu עִיר après le nombre.
- source_word: הַגֵּרְשֻׁנִּי
  choice: des Guershonites
  rationale: Le gentilé singulier avec article a ici une valeur collective et désigne les descendants de Guershon; le pluriel français est idiomatique.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: La préposition לְ marque ici le classement par groupes familiaux. « Clans » convient au contexte tribal et évite le sens moderne plus étroit de « familles ».
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: était de treize
  rationale: Après « le nombre total des villes », le français naturel évite de répéter « villes » tout en conservant exactement le total indiqué par l’hébreu.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: avec leurs pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts attenants aux villes, notamment destinés au bétail. Dans cette formule d’attribution, le waw peut être rendu naturellement par « avec ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation récapitulative est naturelle, tout en conservant la structure clanique et la distinction entre les villes et leurs terrains de pâture.
