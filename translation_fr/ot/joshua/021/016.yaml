  text: וְ/אֶת עַ֣יִן וְ/אֶת מִגְרָשֶׁ֗/הָ וְ/אֶת יֻטָּה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת בֵּ֥ית שֶׁ֖מֶשׁ וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֣ים תֵּ֔שַׁע מֵ/אֵ֕ת שְׁנֵ֥י הַ/שְּׁבָטִ֖ים הָ/אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: fr
  text: 'Aïn avec ses pâturages[a], Youtta avec ses pâturages, et Beth-Shémesh avec ses pâturages : neuf villes prises sur ces deux tribus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « terres alentour », c’est-à-dire les terres rattachées à chaque ville.
    reason: Alternative lexicale pour מִגְרָשׁ, dont le sens couvre les espaces ouverts ou communaux autour d’une ville, souvent employés comme pâturages.
lexical_decisions:
- source_word: עַיִן
  choice: Aïn
  rationale: Forme française traditionnelle du nom de lieu, qui reflète la consonne initiale hébraïque sans traduire le toponyme.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Désigne les terrains ouverts rattachés à chaque ville, notamment destinés au bétail. « Pâturages » est naturel et concret en français moderne.
- source_word: יֻטָּה
  choice: Youtta
  rationale: Translittération française lisible du nom de lieu hébreu, sans le traduire.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Le toponyme est conservé sous une forme française usuelle plutôt que traduit littéralement par « maison du soleil ».
- source_word: עָרִים תֵּשַׁע
  choice: neuf villes
  rationale: Rend directement le nombre et le terme administratif courant pour ces localités.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: prises sur ces deux tribus
  rationale: Exprime clairement que les villes provenaient de la part territoriale des deux tribus mentionnées dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres sont translittérés selon des formes françaises lisibles; la structure énumérative et le bilan numérique de l’hébreu sont conservés.
