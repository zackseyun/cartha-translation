source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: fr
  text: 'Aux fils de Guershon, qui appartenaient aux clans des Lévites, on donna, sur le territoire de la demi-tribu de Manassé, Golan en Basan, ville de refuge pour l’auteur d’un homicide, avec ses pâturages, ainsi que Bé-Eshtéra[a], avec ses pâturages : deux villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Bé-Eshtéra; comparer 1 Chroniques 6.56 (6.71 selon une autre numérotation), où l’on trouve Ashtaroth.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: Aux fils de Guershon
  rationale: « Fils de Guershon » conserve la forme généalogique de l’hébreu tout en restant naturelle en français.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: qui appartenaient aux clans des Lévites
  rationale: מִשְׁפָּחוֹת désigne ici les subdivisions de parenté de la tribu; « clans » convient mieux que le terme plus général « familles ». La relative clarifie le lien syntaxique en français.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: sur le territoire de la demi-tribu de Manassé
  rationale: Le contexte est celui d’un prélèvement de villes dans le territoire tribal. Cette formulation française rend clairement la provenance géographique exprimée par מִן sans laisser entendre que la demi-tribu elle-même serait donnée.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ville de refuge pour l’auteur d’un homicide
  rationale: « Ville de refuge » est l’expression juridique consacrée. Dans ce cadre légal, הָרֹצֵחַ désigne la personne qui a causé la mort, notamment sans préméditation; « auteur d’un homicide » préserve cette portée sans la qualifier d’emblée de meurtrier.
- source_word: גלון בַּ/בָּשָׁן
  choice: Golan en Basan
  rationale: Les deux noms de lieux sont translittérés selon leurs formes françaises usuelles.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: מִגְרָשׁ désigne les espaces ouverts attenants aux villes lévitiques, notamment destinés au bétail; « pâturages » est précis et compréhensible.
- source_word: בְּעֶשְׁתְּרָה
  choice: Bé-Eshtéra
  rationale: Le texte massorétique porte ce nom; le texte principal le conserve au lieu de l’harmoniser avec le passage parallèle des Chroniques.
- source_word: עָרִים שְׁתָּיִם
  choice: deux villes
  rationale: Cette formule rend directement le décompte récapitulatif placé à la fin du verset.
- source_word: sens verbal implicite dans la liste d’attributions
  choice: on donna
  rationale: Le verset ne comporte pas de verbe conjugué, mais celui-ci est fourni par la formule d’attribution du contexte. Le sujet indéfini « on » évite de préciser davantage que l’hébreu les agents de l’attribution.
theological_decisions:
- issue: Portée juridique de הָרֹצֵחַ
  choice: l’auteur d’un homicide
  alternative: le meurtrier
  rationale: « Meurtrier » suggérerait couramment un acte intentionnel et coupable, alors que les villes de refuge concernent particulièrement celui qui a causé une mort sans préméditation. La traduction retenue maintient la catégorie juridique générale sans résoudre au-delà du contexte le degré de culpabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement explicitée pour rendre naturelle la liste d’attribution, tout en conservant les termes institutionnels et les noms propres du texte hébreu. Le marqueur de note est placé après Bé-Eshtéra, le mot effectivement concerné.
