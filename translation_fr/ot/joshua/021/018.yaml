  yaml_path: translation/ot/joshua/021/018.yaml
  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
translation:
  language: fr
  text: 'Anatoth et ses pâturages[a], et Almon et ses pâturages : quatre villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrains communaux » ou « terrains environnants ». Le terme hébreu désigne les espaces ouverts appartenant à une ville.
    reason: Alternative lexicale permettant de conserver l’étendue de sens du terme hébreu.
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: Anatoth
  rationale: Nom de lieu transcrit selon sa forme française traditionnelle et proche de l’hébreu.
- source_word: מִגְרָשֶׁהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts rattachés à une ville, notamment destinés au pâturage. Le possessif renvoie chaque fois à la ville nommée.
- source_word: עַלְמוֹן
  choice: Almôn
  rationale: Nom de lieu transcrit en français en signalant la voyelle longue de la syllabe finale.
- source_word: עָרִים אַרְבַּע
  choice: quatre villes
  rationale: Expression numérique récapitulative directe ; « villes » convient au contexte des listes d’attribution territoriale.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: coordination par « et »
  rationale: La marque répétée du complément d’objet direct n’a pas d’équivalent lexical en français ; la succession des éléments est rendue par la coordination.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « et » conserve la structure cumulative de la liste hébraïque.
