  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: fr
  text: Ils leur donnèrent Sichem, ville de refuge pour l’auteur d’un homicide[a], avec ses pâturages dans la région montagneuse d’Éphraïm, ainsi que Guézer avec ses pâturages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour celui qui tue ». Dans la législation sur les villes de refuge, le terme hébreu désigne l’auteur d’un homicide qui peut chercher asile dans l’attente d’un jugement; il ne s’agit donc pas nécessairement d’un meurtrier reconnu coupable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils leur donnèrent
  rationale: Le wayyiqtol de נתן exprime la suite narrative au passé. Le passé simple convient au registre narratif biblique français sans rendre systématiquement la conjonction initiale.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ville de refuge pour celui qui avait tué quelqu’un
  rationale: L’expression désigne juridiquement une ville d’asile destinée à l’auteur d’un homicide, dont la culpabilité ou l’intention n’est pas présupposée. Cette formulation naturelle évite « meurtrier », qui impliquerait un meurtre coupable.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et largement reconnue du toponyme biblique.
- source_word: מִגְרָשֶׁיהָ
  choice: ses pâturages
  rationale: Le terme désigne les terrains ouverts dépendant d’une ville, notamment destinés au bétail. « Pâturages » est clair et naturel dans cette liste de villes lévitiques.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: Dans cet emploi géographique, הַר désigne la zone montagneuse d’Éphraïm plutôt qu’un sommet particulier.
- source_word: גֶּזֶר
  choice: Guézer
  rationale: Transcription française usuelle du toponyme.
theological_decisions:
- issue: Statut moral et juridique de הָרֹצֵחַ
  choice: celui qui avait tué quelqu’un
  alternative: le meurtrier
  rationale: Le contexte des villes de refuge concerne l’auteur d’un homicide susceptible d’obtenir asile dans l’attente d’un jugement; traduire par « meurtrier » trancherait indûment la question de l’intention et de la culpabilité.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le ton narratif; les toponymes suivent les formes françaises bibliques usuelles. L’apposition « ville de refuge… » conserve l’ordre et la relation syntaxique de l’hébreu.
