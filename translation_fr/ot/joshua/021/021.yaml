    issue: Rendu de הָרֹצֵחַ par « celui qui avait tué quelqu’un »
    rationale: Le plus-que-parfait ajoute une nuance temporelle absente du participe hébreu et la périphrase est moins apte à rendre le sens juridique générique. « L’auteur d’un homicide » maintient l’ambiguïté quant à l’intention et à la responsabilité.
  - severity: low
    issue: Placement de l’apposition « ville de refuge »
    rationale: Placée après le complément géographique et après « ses pâturages », l’apposition se rattache moins immédiatement à Sichem. La placer directement après le nom de la ville améliore la lisibilité.
