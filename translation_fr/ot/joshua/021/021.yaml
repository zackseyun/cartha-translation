revisions:
- from: Ils leur donnèrent Sichem et ses pâturages, dans la région montagneuse d’Éphraïm, ville de refuge pour celui qui avait tué quelqu’un[a], ainsi que Guézer et ses pâturages.
  to: Ils leur donnèrent Sichem, ville de refuge pour l’auteur d’un homicide[a], avec ses pâturages dans la région montagneuse d’Éphraïm, ainsi que Guézer avec ses pâturages.
  rationale: La révision restitue plus exactement la portée juridique non tranchée de הָרֹצֵחַ et rapproche l’apposition « ville de refuge » de Sichem. Elle conserve les toponymes français usuels, la géographie et les terrains attenants, sans ajouter d’interprétation doctrinale.
