  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: fr
  text: 'et de la tribu d’Aser : Mishal[a] avec ses pâturages[b], et Abdon avec ses pâturages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Misheal ». La transcription de ce nom de lieu varie.
    reason: lexical_alternative
  - marker: b
    text: Les « pâturages » sont les terrains ouverts qui dépendaient de la ville, notamment pour faire paître les troupeaux et pour d’autres usages communautaires.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: et, de la tribu de
  rationale: Dans le contexte du partage territorial, מַטֶּה désigne une tribu. Le waw et la préposition מן sont rendus naturellement par « et, de ».
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: אֶת
  choice: —
  rationale: La particule introduisant le complément d’objet direct n’a pas d’équivalent explicite en français.
- source_word: מִשְׁאָל
  choice: Mishal
  rationale: Translittération proche de la forme consonantique hébraïque; les traditions textuelles et françaises présentent aussi d’autres formes.
- source_word: מִגְרָשֶׁהָ
  choice: avec ses pâturages
  rationale: מִגְרָשׁ désigne les terrains ouverts dépendant d’une ville, notamment destinés au pâturage et aux usages communautaires.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Forme française usuelle de ce nom de lieu.
- source_word: וְ/אֶת
  choice: et
  rationale: La conjonction est rendue par « et »; la particule אֶת reste sans traduction explicite.
theological_decisions: []
