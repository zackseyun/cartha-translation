source:
  edition: WLC
  text: כָּל הֶ֨/עָרִ֜ים לִ/בְנֵ֤י מְרָרִי֙ לְ/מִשְׁפְּחֹתָ֔/ם הַ/נּוֹתָרִ֖ים מִ/מִּשְׁפְּח֣וֹת הַ/לְוִיִּ֑ם וַ/יְהִי֙ גּוֹרָלָ֔/ם עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: fr
  text: Toutes les villes destinées aux descendants de Merari[a], selon leurs clans — ceux qui restaient parmi les clans des Lévites[b] — constituaient leur lot, soit douze villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « aux fils de Merari » ; on peut aussi traduire « aux Merarites ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « ceux qui restaient parmi les familles lévitiques ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Toutes les villes
  rationale: עִיר peut désigner une ville ou une localité. « Villes » convient à la liste des territoires attribués et maintient la cohérence du passage.
- source_word: לִבְנֵי מְרָרִי
  choice: destinées aux descendants de Merari
  rationale: La préposition לְ marque ici les bénéficiaires, tandis que בְּנֵי, littéralement « fils de », désigne dans ce contexte généalogique les descendants de Merari. « Destinées à » rend naturellement le rapport d’attribution sans déplacer le tirage au sort hors de la proposition finale.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les subdivisions du groupe lévitique; « clans » est plus précis que « familles » dans ce contexte tribal.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: ceux qui restaient parmi les clans des Lévites
  rationale: Le participe masculin pluriel הַנּוֹתָרִים renvoie naturellement aux descendants de Merari et les présente comme le groupe restant au sein des clans lévitiques. « Parmi » exprime en français idiomatique leur appartenance à cet ensemble.
- source_word: וַיְהִי גּוֹרָלָם
  choice: formaient leur lot
  rationale: Littéralement, « et leur lot fut ». Cette formulation française relie clairement les villes au lot attribué tout en conservant l’idée du tirage au sort portée par גּוֹרָל.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: douze villes
  rationale: Le français place normalement le nombre avant le nom; la reprise après les deux-points restitue l’accent final de l’hébreu.
theological_decisions: []
