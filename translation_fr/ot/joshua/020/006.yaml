  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: fr
  text: Il restera dans cette ville jusqu’à ce qu’il comparaisse devant l’assemblée pour être jugé[a], et jusqu’à la mort du grand prêtre en fonction à cette époque. Alors, l’auteur de l’homicide[b] pourra retourner dans sa ville et dans sa maison, dans la ville d’où il s’était enfui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant la communauté pour le jugement ». L’hébreu désigne la communauté réunie qui intervient dans la décision judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « celui qui a tué ». Le terme ne préjuge pas ici qu’il s’agit d’un meurtre intentionnel.
    reason: lexical_and_legal_clarification
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: Il restera dans cette ville
  rationale: Dans ce cadre juridique, ישב exprime le maintien de la résidence dans la ville de refuge. « Restera » rend clairement l’obligation de ne pas la quitter.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: jusqu’à ce qu’il comparaisse devant l’assemblée pour être jugé
  rationale: עמד לפני désigne la comparution devant une autorité, tandis que משפט renvoie ici à la procédure de jugement. Cette formulation est naturelle en français juridique courant.
- source_word: הָעֵדָה
  choice: l’assemblée
  rationale: Le terme désigne la communauté réunie qui exerce ici une fonction judiciaire. « Assemblée » conserve cette dimension collective sans suggérer une institution confessionnelle moderne.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל
  choice: jusqu’à la mort du grand prêtre
  rationale: Traduction directe du groupe nominal hébreu, avec le titre consacré « grand prêtre ».
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: en fonction à cette époque
  rationale: La proposition identifie le grand prêtre qui exerce alors sa charge. « En fonction » explicite naturellement cette valeur sans ajouter de contenu théologique.
- source_word: אָז יָשׁוּב
  choice: Alors … pourra retourner
  rationale: Dans ce contexte légal, la mort du grand prêtre ouvre le droit au retour. « Pourra » exprime l’autorisation sans présenter le retour comme nécessairement réalisé.
- source_word: הָרֹצֵחַ
  choice: l’auteur de l’homicide
  rationale: רצח désigne ici celui qui a causé la mort, sans que ce verset le qualifie nécessairement de meurtrier coupable. Cette expression française préserve la neutralité juridique, contrairement à « meurtrier ».
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: dans sa ville et dans sa maison
  rationale: La formulation maintient les deux dimensions du retour, à la communauté civique et à la maisonnée.
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: dans la ville d’où il s’était enfui
  rationale: Le plus-que-parfait marque naturellement en français que la fuite précède le retour, tout en conservant la reprise explicative de l’hébreu.
theological_decisions:
- issue: Statut juridique de הָרֹצֵחַ dans la législation des villes de refuge
  choice: l’auteur de l’homicide
  alternative: le meurtrier ; celui qui a tué
  rationale: « Meurtrier » pourrait attribuer une culpabilité intentionnelle que le contexte des villes de refuge ne présuppose pas. « L’auteur de l’homicide » désigne le fait matériel sans anticiper le verdict.
- issue: Valeur du retour après la mort du grand prêtre
  choice: pourra retourner
  alternative: retournera ; peut retourner
  rationale: La disposition établit une permission juridique. Le futur « retournera » pourrait suggérer une prédiction ou une obligation, tandis que « pourra » rend le droit désormais ouvert.
translation_notes:
  register: Français international moderne, digne et accessible. Le registre juridique reste clair sans archaïsmes. « Comparaisse », « en fonction » et « auteur de l’homicide » rendent précisément la procédure et le statut légal, tandis que la structure répétitive finale de l’hébreu est conservée de façon naturelle.
