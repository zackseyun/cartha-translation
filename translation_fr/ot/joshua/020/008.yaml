source:
  edition: WLC
  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: fr
  text: De l’autre côté du Jourdain, à l’est de Jéricho, ils désignèrent Bétser, dans le désert, sur le plateau, dans le territoire de la tribu de Ruben ; Ramoth en Galaad[a], dans le territoire de la tribu de Gad ; et Golan en Bashan, dans le territoire de la tribu de Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « Ramoth-de-Galaad ». L’hébreu dit littéralement : « Ramoth en Galaad ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: De l’autre côté du Jourdain, à l’est de Jéricho
  rationale: 'Cette formulation naturelle conserve le repérage géographique du texte hébreu : les villes se trouvent à l’est du Jourdain, par rapport au pays de Canaan, et à l’est de Jéricho.'
- source_word: נָתְנוּ
  choice: ils désignèrent
  rationale: Dans le contexte de l’établissement des villes de refuge, le verbe indique une affectation officielle plutôt qu’un simple don.
- source_word: בֶּצֶר
  choice: Bétser
  rationale: Transcription française usuelle du nom de lieu hébreu.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Le terme désigne ici une région aride ou peu cultivée ; « désert » est clair et naturel en français moderne.
- source_word: בַּמִּישֹׁר
  choice: sur le plateau
  rationale: Le mot renvoie au haut plateau relativement plat situé à l’est du Jourdain ; « plateau » rend mieux cette topographie que « plaine ».
- source_word: מִמַּטֵּה רְאוּבֵן / גָד / מְנַשֶּׁה
  choice: dans le territoire de la tribu de Ruben / Gad / Manassé
  rationale: La préposition indique ici l’appartenance des villes aux lots territoriaux des tribus. Cette formulation française explicite naturellement la relation sans modifier le sens.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: Ramoth en Galaad
  rationale: Le texte hébreu présente le nom de la ville suivi de sa région ; la traduction conserve cette structure plutôt que de former un nom composé.
- source_word: גלון בַּבָּשָׁן
  choice: Golan en Bashan
  rationale: Les noms propres sont transcrits selon l’usage français, et la relation géographique est rendue directement.
