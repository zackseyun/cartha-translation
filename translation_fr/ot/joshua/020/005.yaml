base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: fr
  text: Et si le vengeur du sang le poursuit, on ne livrera pas celui qui a tué au pouvoir du vengeur, car il a frappé son prochain sans le savoir et ne le haïssait pas auparavant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis hier et avant-hier », expression hébraïque signifiant « auparavant » ou « autrefois ».'
    reason: Signaler la forme concrète de l’idiome temporel hébreu, rendue naturellement dans le texte.
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Introduit un cas éventuel dans la procédure juridique tout en maintenant le lien avec le verset précédent.
- source_word: גֹּאֵל הַדָּם
  choice: le vengeur du sang
  rationale: Expression juridique consacrée et intelligible pour le représentant familial chargé de venger le sang versé.
- source_word: וְלֹא יַסְגִּרוּ
  choice: les habitants de la ville ne livreront pas
  rationale: Le verbe exprime la remise d’une personne au pouvoir d’une autre. Le sujet implicite est explicité d’après le contexte immédiat de la ville de refuge, sans le limiter aux seuls anciens.
- source_word: הָרֹצֵחַ
  choice: celui qui a causé la mort
  rationale: Évite « meurtrier », qui impliquerait une culpabilité intentionnelle précisément exclue ici, et rend la désignation juridique sans employer le terme vieilli « homicide » comme nom de personne.
- source_word: בְּיָדוֹ
  choice: entre ses mains
  rationale: Conserve l’image hébraïque du transfert au pouvoir du vengeur, dans une tournure française naturelle.
- source_word: בִּבְלִי דַעַת
  choice: sans le savoir
  rationale: Rend directement l’idée d’absence de connaissance ou de conscience au moment de l’acte, tout en laissant le contexte juridique établir l’absence d’intention.
- source_word: הִכָּה אֶת רֵעֵהוּ
  choice: il a frappé son prochain
  rationale: Conserve le sens propre de נכה, sans introduire dans ce verbe seul l’issue mortelle fournie par le contexte.
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: et ne le haïssait pas
  rationale: Exprime l’absence d’hostilité préalable sans transformer la formulation en une qualification plus générale d’ennemi.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: auparavant
  rationale: Rend naturellement l’idiome hébreu désignant la période antérieure; sa forme littérale est signalée en note.
theological_decisions:
- issue: Statut juridique de הָרֹצֵחַ dans le cadre des villes de refuge
  choice: celui qui a causé la mort
  alternative: le meurtrier / l’homicide
  rationale: « Meurtrier » attribuerait une intention criminelle que le verset nie. La périphrase choisie désigne le fait d’avoir tué sans trancher abusivement la culpabilité.
- issue: Portée de בִּבְלִי דַעַת
  choice: sans le savoir
  alternative: sans intention / involontairement
  rationale: La traduction garde au premier plan le défaut de connaissance exprimé par l’hébreu, tandis que le contexte et l’absence de haine indiquent la non-préméditation.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste accessible; l’image « entre ses mains » conserve la vivacité de l’hébreu. Le marqueur [a] est placé après « auparavant », l’expression à laquelle la note se rapporte.
