id: JOS.20.1
reference: Joshua 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: fr
  text: 'Puis[a] Yahweh parla à Josué en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et Yahweh parla à Josué en ces termes ». La forme narrative hébraïque peut marquer aussi bien la continuité que la succession du récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement en français la succession narrative, tandis que « parla » conserve la nuance de דבר, plus précise ici que le simple « dit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription usuelle « Yahweh », afin de conserver le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: Dans la construction « parler à quelqu’un », la préposition française « à » correspond naturellement à l’hébreu אֶל.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cet infinitif introduit de manière formulaire les paroles qui suivent. « En ces termes » remplit naturellement cette fonction en français sans la lourdeur de « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. La transcription « Yahweh » préserve le nom personnel divin et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « en ces termes » introduit clairement le discours divin annoncé au verset suivant; les deux valeurs possibles de la conjonction narrative sont conservées au moyen d’une note.
source_grounding:
  english_pob_role: consult_only
