    rationale: Le texte hébreu dit que la protection s’applique jusqu’à la comparution devant l’assemblée. « Avant d’avoir comparu » présente la comparution comme déjà accomplie avant la non-mort, plutôt que comme le terme de cette protection.
  - severity: low
    issue: « l’immigré établi » pour גֵּר הַגָּר
    rationale: Le choix est défendable, mais « immigré » peut évoquer des catégories administratives modernes. « L’étranger qui réside parmi eux » garde la répétition sémantique du nom et du participe hébreux et reste naturel.
