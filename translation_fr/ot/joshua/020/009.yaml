  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: fr
  text: Telles furent les villes désignées pour tous les Israélites et pour l’étranger qui réside parmi eux[a], afin que quiconque avait causé involontairement la mort d’une personne puisse s’y enfuir et ne meure pas de la main du vengeur du sang jusqu’à sa comparution devant l’assemblée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’« étranger qui réside » désigne ici un non-Israélite vivant parmi les Israélites et relevant de l’ordre juridique de leur communauté.
    reason: cultural_note
  - marker: b
    text: 'Ou : « la communauté ». Le terme hébreu peut désigner la communauté réunie pour examiner l’affaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: les villes désignées
  rationale: L’expression désigne des villes officiellement choisies. « Désignées » conserve ce sens sans ajouter ici « de refuge », absent de la formule hébraïque.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: pour tous les Israélites
  rationale: Littéralement « pour tous les fils d’Israël ». En français actuel, « Israélites » rend naturellement l’expression collective sans suggérer qu’elle exclut les femmes.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: et pour l’immigré établi parmi eux
  rationale: גֵּר désigne un non-Israélite installé durablement au sein de la société d’Israël. « Immigré établi » rend la catégorie sociojuridique dans un français actuel; une note en précise le sens contextuel.
- source_word: לָנוּס שָׁמָּה
  choice: pouvait s’y enfuir
  rationale: נוּס signifie « fuir ». La tournure française exprime ici la possibilité offerte par la désignation de ces villes.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: quiconque avait causé la mort d’une personne
  rationale: L’idiome évoque celui qui frappe une personne à mort. Cette formulation française explicite l’issue mortelle requise par le contexte juridique sans présupposer une intention homicide.
- source_word: בִּשְׁגָגָה
  choice: involontairement
  rationale: Le terme indique un acte commis sans intention, nuance juridique essentielle dans la législation des villes de refuge.
- source_word: וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם
  choice: et ne pas mourir de la main du vengeur du sang
  rationale: « Vengeur du sang » conserve le titre juridique traditionnel du proche parent chargé de venger le sang versé; « de la main de » maintient l’image hébraïque de l’agent.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: avant d’avoir comparu devant l’assemblée
  rationale: La construction fixe la comparution comme limite temporelle de la protection immédiate. « Comparaître devant » convient à la scène judiciaire, tandis qu’« assemblée » rend עֵדָה sans lui donner un sens ecclésial moderne.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: tous les Israélites
  alternative: tous les fils d’Israël
  rationale: La formule masculine hébraïque est une désignation nationale collective. En français, le calque « fils d’Israël » pourrait être compris comme limité aux hommes; « Israélites » en préserve la portée communautaire.
- issue: Statut du גֵּר
  choice: l’immigré établi parmi eux
  alternative: l’étranger résidant parmi eux
  rationale: Le verset étend la protection juridique au non-natif durablement intégré à la vie du pays. Le choix évite de réduire גֵּר à un étranger simplement de passage.
- issue: Fonction de גֹּאֵל הַדָּם
  choice: le vengeur du sang
  alternative: le proche parent chargé de venger le sang
  rationale: Le texte nomme une fonction juridico-familiale précise. La formulation retenue conserve la tension du système ancien sans l’assimiler à une vengeance privée moderne ni l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement juridique du verset sans lourdeur. Les termes « vengeur du sang » et « assemblée » conservent la couleur institutionnelle du texte ancien; la note explique le statut du résident non israélite.
