- from: Telles furent les villes désignées pour tous les Israélites et pour l’immigré établi parmi eux[a]. Quiconque avait causé la mort d’une personne involontairement pouvait s’y enfuir et ne pas mourir de la main du vengeur du sang avant d’avoir comparu devant l’assemblée[b].
  to: Telles furent les villes désignées pour tous les Israélites et pour l’étranger qui réside parmi eux[a], afin que quiconque avait causé involontairement la mort d’une personne puisse s’y enfuir et ne meure pas de la main du vengeur du sang jusqu’à sa comparution devant l’assemblée[b].
  rationale: La révision rétablit la valeur de limite temporelle de עַד par « jusqu’à sa comparution ». Elle remplace aussi « immigré établi » par une expression moins liée aux catégories administratives modernes, tout en conservant la précision sociojuridique en note. Le reste de la formulation conserve fidèlement la portée juridique et le mouvement du verset.
