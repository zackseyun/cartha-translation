source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר תְּנ֤וּ לָ/כֶם֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: fr
  text: '« Parle aux fils d’Israël et dis-leur : “Désignez pour vous-mêmes les villes de refuge dont je vous ai parlé par l’intermédiaire de Moïse[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse », expression hébraïque signifiant « par l’intermédiaire de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel adressé à Josué est rendu directement, sans ajouter de nuance interprétative.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale masculine du texte hébreu, qui désigne ici collectivement le peuple d’Israël.
- source_word: לֵאמֹר
  choice: et dis-leur
  rationale: L’infinitif introducteur de discours direct est rendu par une tournure française naturelle qui explicite les destinataires déjà mentionnés.
- source_word: תְּנוּ לָכֶם
  choice: Désignez pour vous-mêmes
  rationale: Dans ce contexte administratif, נתן signifie attribuer ou affecter des villes à une fonction précise; « désignez » exprime ce sens plus naturellement que le littéral « donnez ».
- source_word: עָרֵי הַמִּקְלָט
  choice: les villes de refuge
  rationale: Expression française établie et précise pour ces villes destinées à protéger certaines personnes poursuivies.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: dont je vous ai parlé
  rationale: La construction avec « dont » est idiomatique en français et représente fidèlement l’objet du discours antérieur.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: L’expression hébraïque littérale « par la main de Moïse » indique ici que Moïse est l’intermédiaire par lequel l’ordre divin a été communiqué.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix retient l’image familiale et la forme masculine du texte source sans réduire l’expression à une simple étiquette ethnique; dans le contexte, elle vise collectivement le peuple de l’alliance.
- issue: Médiation exprimée par בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  alternative: par la main de Moïse
  rationale: La formulation française naturelle maintient l’idée que l’ordre de Dieu a été transmis par Moïse, tandis que la note conserve l’image hébraïque pour la transparence.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct et les impératifs sont conservés. « Fils d’Israël » maintient la formulation familiale du texte source; « par l’intermédiaire de » rend naturellement l’idiome d’agence, documenté en note.
