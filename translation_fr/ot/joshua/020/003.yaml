  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: fr
  text: afin que celui qui a tué quelqu’un involontairement[a], sans le savoir, puisse s’y enfuir. Elles vous serviront de refuge contre le vengeur du sang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par inadvertance ». Il s’agit ici d’une personne ayant causé une mort sans intention, et non d’un meurtrier ayant agi délibérément.
    reason: lexical_alternative
  - marker: b
    text: Le « vengeur du sang » était la personne chargée, dans le cadre familial et juridique de l’ancien Israël, de venger la mort d’un proche.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: puisse s’y enfuir
  rationale: L’infinitif avec ל exprime ici le but à la suite de l’ordre précédent. « S’y enfuir » rend naturellement en français le mouvement vers les villes désignées.
- source_word: רוֹצֵחַ
  choice: celui qui aura tué quelqu’un
  rationale: Dans ce contexte juridique, les compléments « involontairement » et « sans le savoir » excluent l’idée d’un meurtre prémédité. Cette formulation évite « meurtrier », qui impliquerait couramment une intention criminelle.
- source_word: מַכֵּה נֶפֶשׁ
  choice: aura tué quelqu’un
  rationale: L’expression, littéralement liée au fait de frapper une personne, désigne ici le fait de causer sa mort. Le futur antérieur convient au cas envisagé par la prescription.
- source_word: בִּשְׁגָגָה
  choice: involontairement
  rationale: Le terme désigne, dans ce cadre légal, un acte commis par inadvertance ou sans intention.
- source_word: בִּבְלִי דָעַת
  choice: sans le savoir
  rationale: La formule précise l’absence de connaissance ou de conscience au moment de l’acte, sans la fondre entièrement dans la notion d’inadvertance.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: et que ces villes vous servent de refuge
  rationale: Le verbe pluriel renvoie aux villes mentionnées dans le contexte. La reprise explicite « ces villes » rend le référent clair et produit un français naturel.
- source_word: מִגֹּאֵל הַדָּם
  choice: contre le vengeur du sang
  rationale: Cette expression consacrée conserve l’image juridique hébraïque du proche chargé de venger une mort, sans introduire dans le corps du texte une explication culturelle.
theological_decisions:
- issue: Qualification juridique de l’auteur de l’homicide
  choice: Présenter la personne comme ayant causé une mort involontairement et sans le savoir
  alternative: Employer « meurtrier » ou simplement « tueur »
  rationale: Les deux qualifications hébraïques définissent un homicide non intentionnel. « Meurtrier » suggérerait à tort une intention criminelle, tandis que la périphrase retenue exprime clairement l’acte sans préjuger une culpabilité volontaire.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste accessible; elle évite le terme ambigu « homicide » dans le corps du verset et conserve l’expression biblique « vengeur du sang », expliquée en note.
