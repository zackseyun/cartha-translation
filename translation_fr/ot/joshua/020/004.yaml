    issue: La proposition principale relative à אָסַף ne rend pas explicitement l’entrée dans la ville.
    rationale: Le suffixe directionnel de הָעִירָה indique le déplacement vers la ville. « Accueillir ... dans la ville » peut décrire l’accueil sans exprimer clairement cette admission ou entrée; « faire entrer » rend les deux aspects.
