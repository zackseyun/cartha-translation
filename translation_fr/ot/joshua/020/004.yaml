  to: Il s’enfuira vers l’une de ces villes et se tiendra à l’entrée de la porte de la ville. Là, il exposera son affaire[a] aux anciens de cette ville. Ceux-ci le feront entrer dans la ville auprès d’eux[b], lui donneront une place et il habitera avec eux.
  rationale: La révision remplace « l’accueilleront auprès d’eux dans la ville » par « le feront entrer dans la ville auprès d’eux » afin de rendre explicitement le mouvement vers la ville, tout en conservant la relation d’accueil auprès des anciens. La note b est ajustée pour présenter « accueillir » comme l’alternative lexicale.
