  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: fr
  text: Il s’enfuira vers l’une de ces villes et se tiendra à l’entrée de la porte de la ville. Là, il exposera son affaire[a] aux anciens de cette ville. Ceux-ci le feront entrer dans la ville auprès d’eux[b], lui donneront une place et il habitera avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses paroles » ou « sa situation » ; l’hébreu peut désigner soit les paroles qu’il prononce, soit l’affaire qu’il présente.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’accueilleront dans la ville auprès d’eux » ; le verbe hébreu peut signifier « rassembler », « faire entrer » ou « accueillir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: Il s’enfuira
  rationale: Dans cette suite d’instructions juridiques, le parfait qal avec waw a une valeur prospective; le futur français exprime naturellement la procédure prescrite.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: à l’entrée de la porte de la ville
  rationale: Cette formulation conserve à la fois l’idée de l’entrée et celle de la porte, lieu public où les affaires civiques étaient entendues.
- source_word: וְדִבֶּר בְּאָזְנֵי ... אֶת דְּבָרָיו
  choice: il exposera son affaire aux anciens
  rationale: « Exposer ... aux » rend idiomatiquement l’action de parler à leur audience, tandis que « son affaire » convient au cadre judiciaire sans effacer la polysémie de דָּבָר, signalée en note.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: ils l’accueilleront auprès d’eux dans la ville
  rationale: אָסַף peut ici exprimer l’accueil ou l’admission. La traduction conserve l’entrée dans la ville ainsi que la dimension relationnelle de אֲלֵיהֶם.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: lui donneront une place
  rationale: « Une place » préserve l’étendue sémantique de מָקוֹם sans préciser indûment s’il s’agit d’un logement ou d’un emplacement assigné.
- source_word: וְיָשַׁב עִמָּם
  choice: il habitera avec eux
  rationale: Dans un contexte de résidence, יָשַׁב signifie habiter ou demeurer; « habitera » est clair, digne et actuel.
theological_decisions: []
