source:
  edition: WLC
  text: וַ/יַּקְדִּ֜שׁוּ אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ בְּ/הַ֣ר נַפְתָּלִ֔י וְ/אֶת שְׁכֶ֖ם בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן בְּ/הַ֥ר יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: fr
  text: Ils mirent donc à part Qédesh, en Galilée, dans la région montagneuse de Nephtali, Sichem, dans la région montagneuse d’Éphraïm, et Qiryath-Arba — c’est-à-dire Hébron[a] —, dans la région montagneuse de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qiryath-Arba, c’est Hébron » ; Qiryath-Arba est un autre nom d’Hébron.'
    reason: La note signale la forme explicite de l’identification en hébreu et clarifie le rapport entre les deux noms.
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: ils mirent donc à part
  rationale: Dans le contexte juridique des villes de refuge, le verbe קדשׁ exprime leur affectation officielle à une fonction particulière. « Mettre à part » conserve cette idée sans suggérer avant tout une consécration rituelle.
- source_word: קֶדֶשׁ
  choice: Qédesh
  rationale: Nom de lieu translittéré sous une forme claire et usuelle en français biblique.
- source_word: בַּגָּלִיל
  choice: en Galilée
  rationale: Forme française courante du nom de cette région.
- source_word: בְּהַר נַפְתָּלִי
  choice: dans la région montagneuse de Nephtali
  rationale: Dans cette description territoriale, הַר désigne une zone de relief plutôt qu’un sommet unique.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et largement reconnue de ce nom de lieu.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: La formulation rend la valeur régionale et topographique de הַר.
- source_word: קִרְיַת אַרְבַּע
  choice: Qiryath-Arba
  rationale: Le nom propre est translittéré plutôt que traduit par « ville d’Arba ».
- source_word: הִיא חֶבְרוֹן
  choice: c’est-à-dire Hébron
  rationale: Cette tournure française naturelle exprime l’identification appositive donnée par l’hébreu.
- source_word: בְּהַר יְהוּדָה
  choice: dans la région montagneuse de Juda
  rationale: הַר renvoie ici aux hauteurs du territoire de Juda, non à une montagne isolée.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. L’énumération géographique de l’hébreu est conservée, avec des virgules pour assurer la lisibilité. Le marqueur de note est placé après « Hébron », auquel la note se rapporte, plutôt qu’après « Nephtali ».
