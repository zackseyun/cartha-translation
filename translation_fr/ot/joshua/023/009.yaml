revisions:
- from: Car Yahweh a dépossédé devant vous des nations grandes et puissantes[a]. Quant à vous, personne n’a pu vous résister jusqu’à aujourd’hui[b].
  to: Car Yahweh a chassé de devant vous de grandes et puissantes nations[a]. Quant à vous, personne n’a pu vous résister jusqu’à ce jour[b].
  rationale: La révision remplace une construction française ambiguë par « a chassé de devant vous », qui est à la fois naturelle et proche de l’idiome hébreu dans un contexte de conquête. La note conserve la nuance de dépossession. « Jusqu’à ce jour » maintient le point de vue narratif sans modifier le sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:11:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu, y compris l’agent divin, l’expulsion des nations et l’idiome de l’absence de résistance. Toutefois, « a dépossédé devant vous des nations » n’est pas une construction française satisfaisante : déposséder appelle normalement un complément indiquant ce dont quelqu’un est privé. « Chassé de devant vous » rend directement le verbe dans ce contexte et l’expression hébraïque מִפְּנֵיכֶם.'
  naturalness: Le texte est globalement clair et de registre approprié. « Jusqu’à aujourd’hui » peut toutefois évoquer le présent du lecteur ; « jusqu’à ce jour » conserve naturellement le repère narratif hébreu. La formulation révisée reste moderne tout en gardant la dignité du discours.
  terminology: « Yahweh » respecte le choix établi pour le tétragramme. « Grandes et puissantes nations » rend adéquatement גְּדֹלִים וַעֲצוּמִים. La note sur l’idiome militaire est utile ; la première note doit présenter « dépossédé » comme une option explicative plutôt que comme une construction elliptique en français.
  issues:
  - severity: medium
    issue: Construction de « déposséder » incomplète et peu naturelle
    rationale: En français, « déposséder des nations » est ambigu et normalement incomplet, puisqu’on dépossède quelqu’un de quelque chose. Le contexte hébreu permet « chasser de devant vous » ; la nuance de dépossession territoriale peut être expliquée en note.
  - severity: low
    issue: « jusqu’à aujourd’hui » actualise inutilement le repère temporel
    rationale: עַד הַיּוֹם הַזֶּה renvoie au moment de l’énonciation ou du récit. « Jusqu’à ce jour » est l’équivalent français idiomatique qui évite de l’identifier au présent du lecteur.
  revised_text: Car Yahweh a chassé de devant vous de grandes et puissantes nations[a]. Quant à vous, personne n’a pu vous résister jusqu’à ce jour[b].
  revised_footnotes:
  - marker: a
    text: Ou « a dépossédé » ou « a expulsé ». Le verbe hébreu peut souligner que ces peuples ont été retirés du pays afin qu’Israël en prenne possession.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pas un homme ne s’est tenu devant vous ». Cette expression signifie que personne n’a pu vous tenir tête.'
    reason: idiom_explanation
  revision_rationale: La révision remplace une construction française ambiguë par « a chassé de devant vous », qui est à la fois naturelle et proche de l’idiome hébreu dans un contexte de conquête. La note conserve la nuance de dépossession. « Jusqu’à ce jour » maintient le point de vue narratif sans modifier le sens.
