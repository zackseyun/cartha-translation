source:
  edition: WLC
  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: fr
  text: Car Yahweh a chassé de devant vous de grandes et puissantes nations[a]. Quant à vous, personne n’a pu vous résister jusqu’à ce jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a dépossédé » ou « a expulsé ». Le verbe hébreu peut souligner que ces peuples ont été retirés du pays afin qu’Israël en prenne possession.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pas un homme ne s’est tenu devant vous ». Cette expression signifie que personne n’a pu vous tenir tête.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: a dépossédé
  rationale: Le hifil de ירשׁ exprime ici l’expulsion de peuples de leur territoire afin qu’un autre en prenne possession. « Déposséder » conserve cette dimension territoriale, que « chasser » rendrait moins explicitement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin יהוה, plutôt que substitution par un titre.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Dans ce contexte de conquête, l’expression désigne l’éloignement ou l’expulsion d’ennemis qui se trouvent face à Israël.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: des nations grandes et puissantes
  rationale: « Grandes » rend גְּדֹלִים sans préciser indûment s’il s’agit de leur taille, de leur nombre ou de leur importance; « puissantes » exprime la force indiquée par עֲצוּמִים.
- source_word: וְאַתֶּם
  choice: Quant à vous
  rationale: La tournure détachée restitue l’accent porté par le pronom hébreu placé en tête, sans transformer la coordination en opposition forte.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: personne n’a pu vous résister
  rationale: L’expression littérale « pas un homme ne s’est tenu devant vous » est un idiome militaire signifiant que personne n’a réussi à tenir tête à Israël. La formulation française naturelle en explicite le sens.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Équivalent français naturel de l’expression indiquant la continuité de la situation jusqu’au moment où parle Josué.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Agent de la conquête
  choice: Yahweh a dépossédé les nations
  alternative: les nations ont été dépossédées devant Israël
  rationale: La syntaxe hébraïque nomme explicitement Yahweh comme sujet et lui attribue l’action; la traduction maintient cette affirmation sans l’atténuer.
translation_notes:
  register: Français international moderne, digne et lisible. « Dépossédé » préserve la portée territoriale du verbe, tandis que la seconde proposition traduit naturellement l’idiome militaire. Les deux appels de note figurent dans le texte.
