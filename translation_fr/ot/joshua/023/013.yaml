source:
  edition: WLC
  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: fr
  text: 'Sachez-le avec certitude : Yahweh, votre Dieu, ne continuera pas à chasser ces nations devant vous. Elles deviendront pour vous un piège et un filet, un fouet sur vos flancs[a] et des épines dans vos yeux, jusqu’à ce que vous disparaissiez de ce bon pays que Yahweh, votre Dieu, vous a donné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un fléau sur vos flancs ». Le mot hébreu est difficile; il peut désigner un instrument qui frappe ou, par image, une affliction douloureuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: Sachez-le avec certitude
  rationale: L’infinitif absolu suivi du verbe conjugué renforce fortement l’exhortation. Cette formulation restitue l’emphase dans un français naturel et digne.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: ne continuera pas à chasser
  rationale: Le hiphil de יסף suivi de l’infinitif exprime ici la cessation d’une action jusque-là poursuivie; « ne continuera pas à » en conserve l’aspect sans lourdeur excessive.
- source_word: מִלִּפְנֵיכֶם
  choice: devant vous
  rationale: Cette expression française naturelle conserve l’image spatiale de l’idiome hébreu dans le contexte de l’expulsion des nations.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: un piège et un filet
  rationale: Les deux termes hébreux désignent des dispositifs de capture proches. Deux mots distincts conservent le redoublement rhétorique sans les confondre.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: un fouet sur vos flancs
  rationale: Le substantif שֹׁטֵט est difficile, mais semble désigner un instrument qui frappe ou une affliction douloureuse. « Fouet » garde concrètement la métaphore corporelle, tandis que la note signale l’incertitude.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: des épines dans vos yeux
  rationale: La formulation préserve l’image hébraïque vive d’objets pointus causant une irritation persistante.
- source_word: עַד אֲבָדְכֶם מֵעַל הָאֲדָמָה
  choice: jusqu’à ce que vous disparaissiez de ce bon pays
  rationale: אבד peut exprimer la perte, la ruine ou la disparition. Dans ce contexte territorial, « disparaissiez de » rend l’expulsion finale sans préciser indûment le mode de destruction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Nature de l’avertissement
  choice: Yahweh cessera de chasser les nations, qui deviendront une source d’affliction jusqu’à la disparition d’Israël du pays donné
  alternative: Simple prédiction militaire sans portée liée au don du pays
  rationale: La syntaxe relie explicitement la cessation de l’action divine, les afflictions causées par les nations et la perte du bon pays donné par Dieu. La traduction conserve ce lien sans développer une interprétation doctrinale.
- issue: Portée de אבד
  choice: « disparaissiez de ce bon pays »
  alternative: « périssiez loin de ce bon pays » ou « soyez détruits »
  rationale: Le verbe autorise une idée de ruine ou de disparition. Avec מֵעַל הָאֲדָמָה, la formulation retenue met en évidence la perte du pays tout en préservant une part de l’ambiguïté quant au sort exact des personnes.
translation_notes:
  register: Français international moderne, solennel mais accessible. L’ouverture impérative conserve l’emphase hébraïque. Les métaphores corporelles sont maintenues, et le terme difficile שֹׁטֵט est accompagné d’une note plutôt que résolu silencieusement.
