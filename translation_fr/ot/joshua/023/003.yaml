  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: fr
  text: Vous-mêmes, vous avez vu tout ce que Yahweh, votre Dieu, a fait à toutes ces nations en votre présence[a], car c’est Yahweh, votre Dieu, qui a combattu pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «de devant vous». L’expression peut évoquer ce qui s’est produit en présence d’Israël ; dans ce contexte, elle peut aussi suggérer l’éloignement des nations devant lui ou une action accomplie à cause de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם רְאִיתֶם
  choice: Vous avez vous-mêmes vu
  rationale: Le pronom indépendant אַתֶּם renforce le sujet déjà indiqué par la forme verbale; «vous-mêmes» restitue cette insistance en français naturel. Le passé composé convient à une expérience passée dont Josué souligne ici la portée présente.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: tout ce que … a fait
  rationale: Cette formulation garde l’étendue générale de כָּל et le sens large de עָשָׂה sans préciser indûment la nature des actes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle en français afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le suffixe de deuxième personne du pluriel est conservé dans l’adresse collective faite à Israël.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: à toutes ces nations
  rationale: Avec עָשָׂה, לְ désigne ici les peuples touchés par l’action. «À toutes ces nations» reste proche de la construction hébraïque sans expliciter plus que le texte.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: L’expression signifie littéralement «de devant vous» et évoque, dans ce contexte, l’éloignement des nations de la présence d’Israël. Le texte principal emploie une tournure française concise, précisée en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication de ce qu’Israël a constaté; «car» exprime clairement ce lien logique.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: c’est … qui a combattu pour vous
  rationale: La construction clivée restitue l’insistance portée par הוּא et par le participe substantivé. Le passé composé correspond au regard rétrospectif du discours, tandis que «pour vous» marque le bénéfice ou l’intervention en faveur d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: L’hébreu emploie explicitement le tétragramme comme nom propre. «Yahweh» le conserve en français sans le remplacer par un titre.
- issue: Agent de la victoire d’Israël
  choice: c’est Yahweh, votre Dieu, qui a combattu pour vous
  alternative: Yahweh, votre Dieu, combattait pour vous
  rationale: La formulation préserve l’insistance hébraïque sur Yahweh comme acteur du combat, sans ajouter d’explication doctrinale sur les moyens de son action.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de «Yahweh, votre Dieu» est maintenue parce qu’elle structure et souligne l’affirmation hébraïque. «Vous-mêmes» et la construction «c’est… qui» conservent les deux accents emphatiques du verset.
