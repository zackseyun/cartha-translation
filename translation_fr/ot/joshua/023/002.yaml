id: JOS.23.2
reference: Joshua 23:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יְהוֹשֻׁ֨עַ֙ לְ/כָל יִשְׂרָאֵ֔ל לִ/זְקֵנָי/ו֙ וּ/לְ/רָאשָׁ֔י/ו וּ/לְ/שֹׁפְטָ֖י/ו וּ/לְ/שֹֽׁטְרָ֑י/ו וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אֲנִ֣י זָקַ֔נְתִּי בָּ֖אתִי בַּ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: fr
  text: 'Alors Josué convoqua tout Israël — ses anciens, ses chefs, ses juges et ses officiers[a] — et leur dit : « Je suis devenu vieux ; j’ai avancé en âge[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses administrateurs ». Le terme hébreu désigne des agents chargés de fonctions administratives ou exécutives, pas nécessairement des militaires.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je suis entré dans les jours », expression hébraïque signifiant être avancé en âge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Avec la préposition לְ et des personnes comme complément, קרא exprime ici l’action de faire venir ou de réunir. « Convoqua » rend ce sens directement et naturellement en français.
- source_word: לְכָל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette formulation conserve la désignation collective explicite du texte hébreu. La liste qui suit indique que le peuple est ici présent à travers ses responsables.
- source_word: לִזְקֵנָיו
  choice: ses anciens
  rationale: Le suffixe renvoie à Israël pris collectivement. « Anciens » est le terme français courant pour ces responsables reconnus de la communauté.
- source_word: וּלְרָאשָׁיו
  choice: ses chefs
  rationale: Dans cette liste institutionnelle, רָאשׁ désigne les personnes placées à la tête du peuple. « Chefs » conserve cette idée sans confondre cette catégorie avec les autres fonctions énumérées.
- source_word: וּלְשֹׁפְטָיו
  choice: ses juges
  rationale: Le terme désigne clairement ici des responsables exerçant une fonction judiciaire.
- source_word: וּלְשֹׁטְרָיו
  choice: ses officiers
  rationale: שֹׁטְרִים désigne des agents investis de fonctions administratives ou exécutives. « Officiers » maintient une catégorie distincte, tandis qu’une note prévient une lecture exclusivement militaire.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: et leur dit
  rationale: Cette tournure française introduit directement et sobrement les paroles adressées au groupe.
- source_word: אֲנִי זָקַנְתִּי
  choice: Je suis devenu vieux
  rationale: Le parfait hébreu présente le vieillissement comme un processus désormais accompli. « Je suis devenu vieux » en conserve la nuance tout en restant naturel.
- source_word: בָּאתִי בַּיָּמִים
  choice: j’ai avancé en âge
  rationale: Cette expression française transmet naturellement l’idiome hébreu qui signifie être arrivé à un âge avancé.
theological_decisions:
- issue: Référent de « tout Israël » devant la liste des responsables
  choice: Conserver « tout Israël », puis énumérer ses anciens, chefs, juges et officiers comme représentants du peuple.
  alternative: Réduire la formulation à « tous les responsables d’Israël ».
  rationale: L’hébreu nomme explicitement « tout Israël » avant la liste. La traduction conserve à la fois la portée collective et l’indication contextuelle d’une représentation par les responsables, sans trancher davantage que le texte.
translation_notes:
  register: Français international actuel, sobre et digne. « Convoqua » évite le calque de « appeler à ». Les tirets rendent clairement la liste appositive. La répétition des deux déclarations sur l’âge est conservée afin de respecter le parallélisme et l’insistance du texte hébreu.
