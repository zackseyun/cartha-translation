  verdict: revise
  source_fidelity: Le sens conditionnel, l’intensif « vraiment », l’attachement aux nations restantes, les alliances matrimoniales et la réciprocité finale sont bien rendus. Toutefois, le pronom réfléchi manque dans « et vous attachez », ce qui empêche de rendre correctement וּדְבַקְתֶּם (« vous vous attachez »). La note b doit également présenter la formulation littérale comme une approximation idiomatique, plutôt que de la faire passer pour une équivalence strictement mot à mot.
  naturalness: Le registre est soutenu et compréhensible. La construction longue et inachevée est justifiée par la continuation de la phrase au verset 13. L’ellipse finale « elles avec vous » conserve utilement la concision réciproque de l’hébreu.
  terminology: « Reste », « vous vous alliez à elles par mariage » et « entretenez des relations avec elles » sont des choix recevables et non confessionnels. « Relations » garde ici une portée sociale large et ne force pas une lecture sexuelle de l’idiome.
  issues:
