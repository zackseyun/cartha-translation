source:
  edition: WLC
  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: fr
  text: Car si vous vous détournez vraiment et vous vous attachez au reste de ces nations[a], à celles qui subsistent encore avec vous, si vous vous alliez à elles par mariage et entretenez des relations avec elles, elles avec vous[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous vous cramponnez à ce qui reste de ces nations ».'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « vous allez parmi elles, et elles parmi vous » ; l’expression peut désigner plus largement des relations ou des fréquentations réciproques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: Introduit la condition menaçante tout en conservant le lien argumentatif avec le verset précédent.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: vous vous détournez vraiment
  rationale: Le tour infinitif absolu plus verbe conjugué intensifie l'action. « Vraiment » rend cette insistance, tandis que « vous détournez » exprime ici l'abandon de la fidélité attendue sans ajouter un objet absent de l'hébreu.
- source_word: וּדְבַקְתֶּם
  choice: vous attachez
  rationale: Rend l'idée d'un attachement étroit et durable; le pronom réfléchi est naturel en français.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: au reste de ces nations
  rationale: « Reste » exprime simplement ce qui subsiste, sans les possibles connotations théologiques positives de « reste » employé comme terme technique ou de « résidu ».
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: à celles qui subsistent encore avec vous
  rationale: Conserve la reprise explicative et la présence continue de ces nations aux côtés d'Israël, dans un français fluide.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: vous vous alliez à elles par mariage
  rationale: Exprime l'établissement réciproque de liens matrimoniaux sans employer le peu naturel « vous vous intermarriez ».
- source_word: וּבָאתֶם בָּהֶם
  choice: entretenez des relations avec elles
  rationale: L'expression hébraïque peut viser le fait d'aller parmi elles ou d'entrer en relation avec elles. Cette formulation garde la portée sociale générale et évite d'imposer un euphémisme sexuel.
- source_word: וְהֵם בָּכֶם
  choice: elles avec vous
  rationale: Préserve l'ellipse et la réciprocité très concises de l'hébreu; le féminin reprend naturellement « nations » en français.
theological_decisions:
- issue: Portée négative de שׁוֹב תָּשׁוּבוּ dans l'avertissement d'alliance
  choice: vous vous détournez vraiment
  alternative: vous revenez vraiment
  rationale: Dans le contexte, le mouvement est un recul par rapport à la fidélité, non un retour positif. La traduction garde cette orientation sans expliciter davantage la nature de l'infidélité.
- issue: Portée de וּבָאתֶם בָּהֶם après la mention des mariages
  choice: entretenez des relations avec elles
  alternative: allez parmi elles
  rationale: L'idiome demeure plus large qu'un déplacement physique et n'exige pas une lecture sexuelle. La formulation retenue préserve l'intégration sociale réciproque sans résoudre excessivement l'ambiguïté.
- issue: Connotations possibles de יֶתֶר
  choice: reste
  alternative: survivants
  rationale: Le mot désigne ici ce qui demeure des nations. « Reste » est lexicalement sobre et n'introduit ni approbation théologique ni focalisation exclusive sur les personnes.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue phrase conditionnelle et sa virgule finale sont conservées parce que le verset se poursuit par la conséquence au verset 13. Les répétitions hébraïques sont partiellement maintenues, mais ajustées pour éviter une formulation artificielle.
