  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: fr
  text: Il arrivera que, de même que toutes les bonnes paroles que Yahweh, votre Dieu, vous a dites se sont accomplies pour vous, de même Yahweh fera venir sur vous toutes les paroles de malheur[a], jusqu’à ce qu’il vous ait fait disparaître de cette bonne terre que Yahweh, votre Dieu, vous a donnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toutes les mauvaises choses » ou « tous les malheurs ». Littéralement : « toutes les paroles/choses mauvaises », en parallèle avec « toutes les bonnes paroles » plus haut dans le verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Et voici ce qui arrivera
  rationale: Rend avec naturel et solennité l’introduction d’une circonstance future, sans recourir à la tournure archaïque « il adviendra ».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: tout comme ... de même
  rationale: Conserve explicitement la structure comparative qui met en parallèle l’accomplissement des bénédictions et celui du jugement annoncé.
- source_word: בָּא עֲלֵיכֶם
  choice: s’est accomplie pour vous
  rationale: Dans ce contexte, la venue de la parole désigne sa réalisation. Cette formulation française naturelle exprime l’accomplissement déjà constaté, bien qu’elle ne reproduise pas littéralement l’image de ce qui « vient sur » les destinataires.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: toute bonne parole
  rationale: Préserve le sens premier de דָּבָר et le parallélisme lexical délibéré avec « toute parole de malheur », sans préciser de manière interprétative qu’il s’agit uniquement de promesses.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme, plutôt que de le remplacer par un titre.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: fera venir sur vous
  rationale: Reproduit la valeur causative du hiphil de בוא ainsi que la préposition עַל.
- source_word: כָּל הַדָּבָר הָרָע
  choice: toute parole de malheur
  rationale: Maintient le mot « parole » et son parallèle avec « toute bonne parole », tandis que « de malheur » indique ici une conséquence funeste ou un jugement plutôt qu’un mal moral commis par Dieu.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: jusqu’à vous exterminer
  rationale: Exprime l’aboutissement du jugement et conserve la force du verbe causatif שׁמד.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: de cette bonne terre
  rationale: Rend idiomatiquement en français l’éloignement hors du territoire, sans calquer la préposition composée par une tournure lourde comme « de dessus cette terre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin personnel. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Sens de רָע dans l’annonce d’une action judiciaire de Dieu
  choice: parole de malheur
  alternative: mauvaise parole / désastre
  rationale: Le terme désigne ici le versant funeste des sanctions annoncées, en contraste avec le bien déjà accompli. La traduction conserve la tension du texte sans attribuer explicitement à Dieu un mal moral.
- issue: Portée de הַשְׁמִידוֹ
  choice: vous exterminer
  alternative: vous détruire / vous faire disparaître
  rationale: Le choix garde la sévérité de la sanction d’alliance annoncée et évite d’atténuer le verbe hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « tout comme… de même » conserve la symétrie rhétorique du texte. « Parole de malheur » est légèrement soutenu mais clair et permet de préserver le parallélisme hébreu sans suggérer un mal moral en Dieu.
