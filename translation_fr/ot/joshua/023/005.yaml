  variant: modern international French
source:
  edition: WLC
  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: fr
  text: Yahweh, votre Dieu, c’est lui qui les chassera loin de vous et les dépossédera loin de vous ; vous prendrez possession de leur pays[a], comme Yahweh, votre Dieu, vous l’a dit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous hériterez de leur pays ». Le verbe hébreu peut signifier « hériter » ou « prendre possession » ; cette dernière expression convient au contexte de la conquête.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme Yahweh, votre Dieu, vous a parlé ». Dans ce contexte, ses paroles ont valeur de promesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh votre Dieu
  rationale: Rend directement le nom divin et le syntagme singulier désignant le Dieu d’Israël.
- source_word: הוּא
  choice: c’est lui qui
  rationale: La tournure disloquée française restitue naturellement l’insistance portée par le pronom indépendant hébreu.
- source_word: יֶהְדֳּפֵם
  choice: les chassera
  rationale: Le verbe הדף exprime ici l’action énergique de repousser ou de chasser les peuples devant Israël.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Conserve l’image spatiale de l’expression hébraïque dans une formulation française intelligible.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: et les dépossédera
  rationale: Le hiphil de ירש décrit la perte de possession imposée aux occupants, distincte de la prise de possession par Israël.
- source_word: מִלִּפְנֵיכֶם
  choice: sous vos yeux
  rationale: Rend la seconde expression spatiale sans produire en français une répétition lourde de « devant vous ».
- source_word: וִירִשְׁתֶּם אֶת־אַרְצָם
  choice: Vous prendrez possession de leur pays
  rationale: Le qal de ירש peut signifier hériter ou prendre possession ; le contexte territorial favorise ici la seconde nuance.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme … vous l’a dit
  rationale: Rend le sens lexical de דבר, « parler/dire », tout en laissant au contexte sa portée de promesse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le tétragramme ; sa translittération préserve la référence au nom propre divin sans la remplacer par un titre.
- issue: Deux emplois de la racine ירש
  choice: « les dépossédera » puis « prendrez possession »
  alternative: Employer « chasser » dans les deux cas, ou « hériterez » pour l’action d’Israël
  rationale: 'Les deux formes verbales ont ici des fonctions complémentaires : Dieu fait perdre leur possession aux peuples, puis Israël acquiert leur pays. Cette distinction préserve le contraste du texte sans effacer l’ambiguïté possible du second emploi.'
- issue: Portée de כַּאֲשֶׁר דִּבֶּר
  choice: « comme … vous l’a dit »
  alternative: « comme … vous l’a promis »
  rationale: Le discours a bien valeur de promesse dans le contexte, mais le verbe hébreu signifie d’abord « parler » ou « dire » ; la traduction ne rend donc pas explicite ce que le contexte permet de comprendre.
translation_notes:
  register: Français international moderne, clair et digne. « C’est lui qui » conserve l’emphase hébraïque. La légère variation entre « devant vous » et « sous vos yeux » évite une répétition peu naturelle tout en maintenant l’idée de peuples écartés de la présence d’Israël.
