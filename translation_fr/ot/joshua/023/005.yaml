  verdict: revise
  source_fidelity: La seconde occurrence de מִלִּפְנֵיכֶם (« loin de vous / de devant vous ») ne signifie pas « sous vos yeux », qui introduit l’idée d’une action observée. La traduction doit garder l’idée d’éloignement ou d’expulsion hors de la présence d’Israël. La note b doit aussi rendre דִּבֶּר לָכֶם par « vous a dit / parlé », non « vous en a parlé ».
  naturalness: La formulation révisée reste naturelle en français international moderne. « Loin de vous » restitue l’idiome spatial hébreu sans la lourdeur d’une répétition littérale de « de devant vous ».
