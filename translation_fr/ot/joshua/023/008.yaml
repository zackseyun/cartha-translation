source:
  edition: WLC
  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: fr
  text: Mais attachez-vous[a] à Yahweh, votre Dieu, comme vous l’avez fait jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « restez attachés à » ; le verbe hébreu exprime un attachement étroit et fidèle dans le cadre de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: Dans ce contexte, les particules marquent un contraste net avec l’avertissement précédent, et non une condition.
- source_word: בַּיהוָה
  choice: à Yahweh
  rationale: Avec דבק, la préposition ב introduit ici celui auquel on demeure attaché ; « à » convient à l’usage français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom personnel de Dieu présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: 'Lorsqu’il désigne Yahweh, אֱלֹהִים a un sens singulier ; le suffixe exprime la relation : « votre Dieu ».'
- source_word: תִּדְבָּקוּ
  choice: restez attachés
  rationale: Dans ce contexte d’alliance, דבק exprime un attachement étroit, fidèle et durable. Cette formulation française rend aussi la continuité indiquée par la suite du verset.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Le terme introduit la comparaison entre l’exhortation présente et la conduite passée des Israélites.
- source_word: עֲשִׂיתֶם
  choice: vous l’avez fait
  rationale: Le passé composé exprime naturellement en français une conduite passée qui se prolonge jusqu’au moment où Josué parle.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Cette expression française courante conserve la continuité temporelle de l’hébreu.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel et évite de le remplacer silencieusement par un titre ; « Yahvé » est une autre forme française traditionnelle.
- issue: Portée de דבק dans le contexte de l’alliance
  choice: restez attachés
  alternative: attachez-vous fermement / demeurez unis
  rationale: Le choix garde la dimension relationnelle et la fidélité durable sans réduire le verbe à une simple adhésion intellectuelle.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif « restez attachés » est naturel, exprime une exhortation continue et s’accorde avec « jusqu’à aujourd’hui ».
