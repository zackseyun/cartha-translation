    issue: « attribué par tirage au sort » explicite indûment le mode d’attribution.
    rationale: Le hiphil de נפל est idiomatique dans ce contexte d’attribution territoriale et peut évoquer le sort, mais le texte ne décrit pas explicitement un tirage. « Ai attribué » rend le sens sans ajouter ce détail procédural.
  - severity: medium
    issue: « comme patrimoine » est moins exact pour בְּנַחֲלָה.
    rationale: Dans ce contexte, le terme désigne l’héritage ou la possession territoriale attribuée aux tribus. « En héritage » maintient cette valeur et évite les sens modernes plus larges de « patrimoine ».
  revised_text: Voyez, je vous ai attribué ces nations qui subsistent en héritage pour vos tribus, du Jourdain — ainsi que toutes les nations que j’ai retranchées — jusqu’à la Grande Mer, vers le coucher du soleil.[a]
