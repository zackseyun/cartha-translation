source:
  edition: WLC
  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: fr
  text: Voyez, je vous ai attribué ces nations qui subsistent en héritage pour vos tribus, du Jourdain — ainsi que toutes les nations que j’ai retranchées — jusqu’à la Grande Mer, vers le coucher du soleil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers l’entrée du soleil », expression qui désigne l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Voyez
  rationale: Impératif pluriel de ראה qui attire avec insistance l’attention des destinataires; « Voyez » en conserve la force déictique dans un registre digne et actuel.
- source_word: הִפַּלְתִּי
  choice: je vous ai attribué par tirage au sort
  rationale: Le hiphil de נפל désigne ici l’attribution de territoires par le sort. Cette formulation explicite l’image idiomatique sans donner l’impression que les nations elles-mêmes auraient été physiquement « jetées ».
- source_word: בְּנַחֲלָה
  choice: comme patrimoine
  rationale: נחלה désigne une possession territoriale transmise et durable. « Patrimoine » garde cette nuance tout en convenant aux tribus comme bénéficiaires collectifs.
- source_word: לְשִׁבְטֵיכֶם
  choice: pour vos tribus
  rationale: La préposition ל marque ici les bénéficiaires de l’attribution.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: ces nations qui subsistent
  rationale: Le participe niphal indique les peuples encore présents; la proposition relative préserve cette valeur verbale et évite la nuance accessoire de « restantes ».
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: depuis le Jourdain ... jusqu’à la Grande Mer
  rationale: Même si l’hébreu emploie une coordination devant « la Grande Mer », l’ensemble exprime l’étendue géographique comprise entre deux limites.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: ainsi que toutes les nations que j’ai retranchées
  rationale: כרת signifie ici supprimer ou éliminer. « Retranchées » conserve l’image hébraïque de la coupure et la tonalité de jugement, sans amplifier en « exterminées ».
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: là où le soleil se couche
  rationale: L’expression signifie littéralement l’entrée ou le coucher du soleil et désigne l’ouest. La traduction maintient l’image tout en étant immédiatement intelligible.
theological_decisions:
- issue: Rapport entre les nations qui subsistent et celles que Dieu a retranchées
  choice: Conserver les deux groupes dans la même déclaration d’attribution, avec une incise
  alternative: Interpréter « toutes les nations que j’ai retranchées » comme une simple précision des limites géographiques
  rationale: La syntaxe est compacte et peut sembler tendue puisque des nations encore présentes et des nations retranchées sont mentionnées ensemble. L’incise préserve cette formulation sans trancher plus que l’hébreu le rapport exact entre les groupes.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Grande Mer » conserve le nom géographique traditionnel de la Méditerranée. La ponctuation en incise clarifie la longue phrase hébraïque sans en supprimer la tension.
