revisions:
- from: Voyez, je vous ai attribué par tirage au sort, comme patrimoine pour vos tribus, ces nations qui subsistent, depuis le Jourdain — ainsi que toutes les nations que j’ai retranchées — jusqu’à la Grande Mer, là où le soleil se couche.[a]
  to: Voyez, je vous ai attribué ces nations qui subsistent en héritage pour vos tribus, du Jourdain — ainsi que toutes les nations que j’ai retranchées — jusqu’à la Grande Mer, vers le coucher du soleil.[a]
  rationale: La révision retire l’explicitation procédurale « par tirage au sort » et remplace « patrimoine » par « héritage », plus fidèle au vocabulaire territorial du passage. Elle maintient l’incise relative aux nations retranchées afin de ne pas résoudre artificiellement la syntaxe compacte de l’hébreu, et conserve une note correctement ancrée sur l’expression de direction occidentale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:11:27Z'
review_pass:
  verdict: revise
  source_fidelity: La structure générale et les principaux référents sont bien rendus. Toutefois, « par tirage au sort » explicite un procédé sous-entendu par le verbe idiomatique הִפִּילתי et va au-delà de ce que la formulation française doit nécessairement préciser. « En héritage » rend plus directement בְּנַחֲלָה dans son sens territorial.
  naturalness: La phrase révisée conserve une syntaxe française fluide tout en gardant la tension de l’énumération hébraïque. « En héritage » est plus idiomatique et plus précis ici que « comme patrimoine ».
  terminology: « Grande Mer » est conservé comme appellation géographique traditionnelle. « Retranchées » préserve sobrement l’image de כרת. Le repère de note est placé sur l’expression relative au coucher du soleil, à laquelle la note se rapporte.
  issues:
