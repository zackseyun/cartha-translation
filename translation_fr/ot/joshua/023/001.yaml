source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: fr
  text: Or, longtemps après que Yahweh eut accordé à Israël du repos face à tous les ennemis qui l’entouraient, Josué était vieux, avancé en âge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entré dans les jours », expression hébraïque signifiant « avancé en âge ».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים רַבִּים
  choice: Longtemps après
  rationale: L’ensemble forme une transition narrative temporelle. « Longtemps après » exprime naturellement en français le laps de temps considérable indiqué par l’hébreu, sans reproduire lourdement « et il arriva, après de nombreux jours ».
- source_word: אַחֲרֵי אֲשֶׁר
  choice: après que
  rationale: Cette locution introduit l’événement servant de repère temporel; « après que » en rend directement la fonction.
- source_word: הֵנִיחַ
  choice: eut accordé du repos … en le délivrant
  rationale: Le hiphil de נוח indique que Yahweh a procuré à Israël repos et sécurité vis-à-vis de ses ennemis. L’ajout explicatif « en le délivrant » rend clairement la relation marquée par מִן sans réduire le repos à une simple inactivité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: לְיִשְׂרָאֵל
  choice: à Israël
  rationale: Le ל marque le bénéficiaire du repos accordé.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: de tous les ennemis qui l’entouraient
  rationale: Cette formulation conserve l’idée d’une délivrance complète à l’égard des ennemis environnants; le singulier « l’ » reprend naturellement le collectif « Israël » en français.
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: Josué était devenu vieux
  rationale: Dans ce cadre temporel, « était devenu vieux » exprime plus naturellement l’état atteint par Josué que le calque « était vieux ».
- source_word: בָּא בַּיָּמִים
  choice: avancé en âge
  rationale: Équivalent français courant et digne de l’idiome hébreu signifiant littéralement « entré dans les jours ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom propre divin; sa transcription le distingue d’un titre et préserve sa fonction dans le récit.
- issue: Nature du « repos » accordé à Israël
  choice: repos lié à la délivrance de tous les ennemis environnants
  alternative: cessation absolue et définitive de toute hostilité
  rationale: Le verset décrit le repos procuré dans la situation narrative sans obliger le français à lui donner une portée théologique absolue dépassant l’énoncé.
translation_notes:
  register: Français international moderne, narratif et digne. La longue phrase temporelle de l’hébreu est conservée sous une forme fluide. Le nom Josué suit l’usage biblique français établi; le nom divin est transcrit « Yahweh ».
