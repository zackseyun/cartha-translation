    text: 'Littéralement : « entré dans les jours », expression hébraïque signifiant « avancé en âge ».'
    reason: cultural_note
  revision_rationale: La révision maintient le laps de temps considérable, le repos procuré par Yahweh et l’idée d’ennemis tout autour, sans ajouter l’explication « en le délivrant ». Elle rend les deux prédicats hébreux concernant l’âge de Josué comme une description d’état et conserve leur effet d’insistance. La note explique l’idiome de manière exacte et non amplifiée.
