revisions:
- from: Longtemps après que Yahweh eut accordé du repos à Israël en le délivrant de tous les ennemis qui l’entouraient, Josué était devenu vieux, avancé en âge.[a]
  to: Or, longtemps après que Yahweh eut accordé à Israël du repos face à tous les ennemis qui l’entouraient, Josué était vieux, avancé en âge.[a]
  rationale: La révision maintient le laps de temps considérable, le repos procuré par Yahweh et l’idée d’ennemis tout autour, sans ajouter l’explication « en le délivrant ». Elle rend les deux prédicats hébreux concernant l’âge de Josué comme une description d’état et conserve leur effet d’insistance. La note explique l’idiome de manière exacte et non amplifiée.
