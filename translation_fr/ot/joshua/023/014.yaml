source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: fr
  text: Et voici[a], aujourd’hui je prends le chemin de toute la terre[b]. Vous savez de tout votre cœur et de toute votre âme qu’aucune parole n’est restée sans effet parmi toutes les bonnes paroles que Yahweh, votre Dieu, a prononcées à votre sujet. Elles se sont toutes accomplies pour vous ; aucune d’elles n’est restée sans effet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Maintenant, voyez ».'
    reason: lexical_alternative
  - marker: b
    text: « Le chemin de toute la terre » est une expression hébraïque désignant la destinée commune à tous les humains, ici la mort.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la fonction solennelle d’appel à l’attention, dans une formulation française biblique mais encore courante.
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: aujourd’hui je prends le chemin de toute la terre
  rationale: Préserve la métaphore hébraïque de la destinée commune des humains, tout en employant la tournure française naturelle « prendre le chemin ».
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: de tout votre cœur et de toute votre âme
  rationale: Maintient la paire anthropologique et covenantale cœur/âme dans une expression française familière.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: aucune parole n’est restée sans effet
  rationale: דָּבָר est rendu par « parole » afin de conserver son lien avec « a prononcées » ; l’idiome avec נפל est exprimé naturellement par « rester sans effet », tandis qu’une note signale l’image littérale.
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: parmi toutes les bonnes paroles
  rationale: « Paroles » préserve la reprise lexicale de דָּבָר et évite d’expliciter celles-ci comme des « promesses » dans le texte principal.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: que Yahweh, votre Dieu, a prononcées à votre sujet
  rationale: « À votre sujet » rend עֲלֵיכֶם sans le réduire à « à vous » ; « prononcées » s’accorde naturellement avec « paroles ».
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: Elles se sont toutes accomplies pour vous
  rationale: Rend explicitement en français le sens d’accomplissement de l’image d’arrivée, sans introduire l’idée plus spécifique de promesse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin ; « Yahweh » le distingue du titre אֲדֹנָי et suit la convention du projet.
- issue: Nature des דְּבָרִים הַטּוֹבִים
  choice: bonnes paroles
  alternative: bonnes promesses
  rationale: Le contexte implique leur accomplissement, mais le substantif demeure « paroles/choses ». La traduction ne transforme donc pas implicitement toutes ces déclarations en une catégorie théologique plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore principale est conservée, tandis que l’idiome répété « une parole tomber » est rendu par une expression française intelligible. Les marqueurs [a] et [b] figurent tous deux dans le texte.
