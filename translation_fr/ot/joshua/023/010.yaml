source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: fr
  text: Un seul homme parmi vous en poursuivra mille[a], car Yahvé, votre Dieu, est celui qui combat pour vous, comme il vous l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en pourchassera mille ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: Un seul homme parmi vous
  rationale: La formulation conserve le masculin singulier représentatif de l’hébreu et rend naturellement la valeur partitive de מִכֶּם.
- source_word: יִרְדָּף
  choice: poursuivra
  rationale: רדף signifie poursuivre ou pourchasser. « Poursuivra » convient au contexte militaire et reste naturel en français.
- source_word: אָלֶף
  choice: mille
  rationale: Le nombre est conservé littéralement afin de préserver la force rhétorique de l’affirmation.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de cette supériorité militaire. « Car » donne une articulation claire et digne.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahvé, votre Dieu
  rationale: Le nom divin est translittéré sous sa forme française courante « Yahvé », et le suffixe pluriel est rendu par « votre ».
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: est celui qui combat pour vous
  rationale: Cette tournure restitue l’insistance de הוּא et la valeur caractéristique du participe, tout en exprimant clairement que Dieu combat en faveur d’Israël.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: comme il vous l’a dit
  rationale: La traduction garde le sens littéral de דבר, « dire/parler », sans expliciter en « promettre » la portée implicite de la parole.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. « Yahvé » le représente directement dans une forme établie en français, plutôt que de lui substituer un titre.
- issue: Masculin représentatif dans אִישׁ אֶחָד
  choice: Un seul homme
  alternative: Une seule personne
  rationale: Le texte source porte explicitement le nom masculin אִישׁ. Le conserver respecte sa forme genrée sans empêcher sa fonction représentative.
- issue: Portée de דִּבֶּר לָכֶם
  choice: comme il vous l’a dit
  alternative: comme il vous l’a promis
  rationale: Le contexte peut donner à la parole une valeur de promesse, mais le verbe signifie littéralement « parler/dire ». La traduction préserve cette latitude.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant idiomatique; le registre militaire et l’insistance sur l’action de Dieu sont conservés.
