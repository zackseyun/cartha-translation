  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: fr
  text: Si vous transgressez l’alliance de Yahweh, votre Dieu, qu’il vous a prescrite[a], et allez servir d’autres dieux et vous prosterner devant eux, alors la colère de Yahweh s’enflammera contre vous, et vous périrez rapidement loin du bon pays qu’il vous a donné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lorsque vous transgresserez l’alliance de Yahweh, votre Dieu ». Le début de la phrase hébraïque peut avoir un sens conditionnel (« si ») ou temporel (« lorsque »).
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « de dessus le bon pays » ; l’expression souligne qu’ils en seront retirés et n’y demeureront plus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: Si vous transgressez
  rationale: La préposition ב avec l’infinitif construit peut exprimer ici une circonstance conditionnelle ou temporelle. Dans l’expression d’alliance עבר ברית, le verbe signifie « transgresser » ou « violer », et « si » convient à la portée d’avertissement du contexte.
- source_word: בְּרִית
  choice: l’alliance
  rationale: Terme usuel et théologiquement précis pour l’engagement qui lie Yahweh et Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, qui préserve le nom personnel présent dans l’hébreu plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: qu’il vous a prescrite
  rationale: « Prescrire une alliance » rend le lien syntaxique direct entre le relatif féminin et « alliance », sans ajouter l’idée non exprimée de la garder.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: si vous allez servir
  rationale: Cette formulation naturelle conserve le mouvement exprimé par הלך et le service cultuel exprimé par עבד.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: et vous prosterner devant eux
  rationale: Le verbe désigne précisément l’acte de se courber ou de se prosterner; ce choix le distingue du verbe précédent « servir ».
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: alors la colère de Yahweh s’enflammera contre vous
  rationale: La formulation conserve la métaphore hébraïque d’une colère qui s’embrase et explicite naturellement la conséquence par « alors ».
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ
  choice: vous disparaîtrez rapidement du bon pays
  rationale: אבד peut signifier périr ou disparaître. Avec מֵעַל הָאָרֶץ, « disparaître du pays » exprime directement la perte et l’éviction du territoire sans imposer exclusivement la mort de chaque individu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin; sa translittération préserve cette donnée et évite de remplacer le nom par un titre.
- issue: Valeur de la proposition initiale
  choice: Avertissement conditionnel introduit par « si »
  alternative: Proposition temporelle introduite par « quand » ou « lorsque »
  rationale: La construction hébraïque permet les deux valeurs. Dans cette exhortation, le conditionnel traduit bien l’avertissement sans présenter l’apostasie comme inévitable; l’ambiguïté est signalée en note.
- issue: Portée de אבד avec מֵעַל הָאָרֶץ
  choice: disparaître du pays
  alternative: périr loin du pays / être rapidement exterminés du pays
  rationale: Le contexte met fortement l’accent sur la suppression de la présence d’Israël dans le pays donné par Yahweh. Le choix retenu préserve cette portée sans trancher inutilement entre expulsion et destruction.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la solennité de l’avertissement d’alliance, distingue le service religieux de la prosternation et conserve l’image de la colère qui s’enflamme.
