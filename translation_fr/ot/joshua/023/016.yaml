revisions:
- from: Si vous transgressez l’alliance de Yahweh votre Dieu, qu’il vous a prescrite[a], si vous allez servir d’autres dieux et vous prosterner devant eux, alors la colère de Yahweh s’enflammera contre vous, et vous disparaîtrez rapidement du bon pays qu’il vous a donné[b].
  to: Si vous transgressez l’alliance de Yahweh, votre Dieu, qu’il vous a prescrite[a], et allez servir d’autres dieux et vous prosterner devant eux, alors la colère de Yahweh s’enflammera contre vous, et vous périrez rapidement loin du bon pays qu’il vous a donné[b].
  rationale: La révision rétablit la coordination des actions suivant la condition initiale, améliore la ponctuation française et remplace « disparaîtrez » par « périrez », plus proche de la force de אבד. « Loin du bon pays » conserve l’idée de retrait exprimée par מֵעַל sans surinterpréter le texte comme une expulsion seule ou comme la mort de chaque individu.
