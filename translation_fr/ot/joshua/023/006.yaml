  text: וַ/חֲזַקְתֶּ֣ם מְאֹ֔ד לִ/שְׁמֹ֣ר וְ/לַ/עֲשׂ֔וֹת אֵ֚ת כָּל הַ/כָּת֔וּב בְּ/סֵ֖פֶר תּוֹרַ֣ת מֹשֶׁ֑ה לְ/בִלְתִּ֥י סוּר מִמֶּ֖/נּוּ יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: fr
  text: Soyez donc très résolus à garder et à mettre en pratique tout ce qui est écrit dans le livre de la Loi de Moïse[a], sans vous en écarter ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le livre de l’Instruction de Moïse ». Le mot hébreu torah peut signifier « instruction » aussi bien que « loi »; ici, il désigne précisément le corpus législatif mosaïque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: Soyez donc très résolus
  rationale: Le verbe חזק, adressé ici à un groupe, exprime la fermeté requise. « Très résolus » rend naturellement en français l’exhortation renforcée par מְאֹד. « Donc » explicite la valeur de liaison du waw dans le contexte discursif.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: à garder et à mettre en pratique
  rationale: שׁמר évoque l’observance fidèle, tandis que עשה souligne l’exécution concrète. « Garder » conserve l’image hébraïque; « mettre en pratique » est plus idiomatique que le littéral « faire » en français moderne.
- source_word: כָּל הַכָּתוּב
  choice: tout ce qui est écrit
  rationale: Cette formulation rend clairement et intégralement la portée générale de la construction hébraïque.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: dans le livre de la Loi de Moïse
  rationale: סֵפֶר peut désigner un livre ou un rouleau; « livre » convient au référent sans imposer son support matériel. Dans cette formule, תּוֹרָה désigne le corpus normatif mosaïque, d’où « Loi », avec une note signalant le sens plus large d’« instruction ».
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: sans vous en écarter
  rationale: La tournure française exprime naturellement l’évitement visé par לְבִלְתִּי. Le pronom « en » reprend au singulier l’ensemble écrit considéré comme une unité.
- source_word: יָמִין וּשְׂמֹאול
  choice: ni à droite ni à gauche
  rationale: Cette expression conserve l’image hébraïque d’une déviation dans l’une ou l’autre direction; la corrélation négative « ni… ni… » est naturelle après « sans ».
theological_decisions:
- issue: Traduction de תּוֹרָה dans le contexte de l’alliance mosaïque
  choice: Loi, dans « le livre de la Loi de Moïse »
  alternative: Instruction, dans « le livre de l’Instruction de Moïse »
  rationale: Bien que תּוֹרָה puisse signifier plus largement « instruction », la formule renvoie ici au corpus prescriptif associé à Moïse. « Loi » identifie clairement ce référent traditionnel sans nier l’étendue sémantique du terme, indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel « soyez » respecte l’adresse collective. « Très résolus » évite une formulation lourde comme « soyez très forts » tout en conservant l’idée de fermeté; « garder et mettre en pratique » maintient les deux verbes hébreux sans produire un calque peu naturel.
