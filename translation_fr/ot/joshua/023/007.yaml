  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: fr
  text: afin de ne pas vous mêler à ces nations qui restent avec vous. Ne mentionnez pas le nom de leurs dieux[a], ne faites jurer personne par eux[b], ne les servez pas et ne vous prosternez pas devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’invoquez pas le nom de leurs dieux ». Le verbe hébreu peut signifier « mentionner » ou, dans ce contexte, « invoquer ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie une forme causative, littéralement « ne faites pas jurer ». L’objet n’est pas exprimé et l’interdiction peut viser le fait d’amener d’autres personnes à prêter serment par ces dieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: afin de ne pas vous mêler à ces nations
  rationale: La construction לְבִלְתִּי suivie de l’infinitif exprime ici le but ou la prévention. Avec בוא et la préposition ב, le contexte vise l’entrée en relation avec les peuples restants plutôt qu’un simple déplacement géographique. « Vous mêler à » restitue naturellement cette idée en français.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: qui subsistent parmi vous
  rationale: Le participe de שׁאר désigne ceux qui sont restés. « Subsistent parmi vous » exprime leur présence continue aux côtés d’Israël sans laisser entendre qu’ils appartiennent à Israël.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: Ne mentionnez pas le nom de leurs dieux
  rationale: À la forme hiphil, זכר peut signifier mentionner, rappeler ou invoquer. « Mentionner le nom » demeure proche de la formulation hébraïque; une note conserve la valeur cultuelle possible d’« invoquer ».
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: ne faites jurer personne par eux
  rationale: 'Le hiphil de שׁבע est causatif: « faire jurer ». L’objet non exprimé en hébreu est rendu par « personne », formulation naturelle qui maintient cette valeur causative.'
- source_word: וְלֹא תַעַבְדוּם
  choice: ne les servez pas
  rationale: עבד signifie servir et peut désigner le service religieux. « Servir » maintient la distinction lexicale avec l’acte de prosternation mentionné ensuite.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: ne vous prosternez pas devant eux
  rationale: Le verbe désigne le fait de s’incliner profondément ou de se prosterner. Cette traduction conserve le geste concret et sa distinction d’avec le service cultuel.
theological_decisions:
- issue: Énumération des actes liés à l’idolâtrie
  choice: Conserver séparément les interdictions de mentionner, faire jurer, servir et se prosterner.
  alternative: Résumer l’ensemble par une interdiction générale d’adorer.
  rationale: L’hébreu nomme plusieurs actes distincts d’allégeance aux dieux étrangers. Les conserver évite de réduire la portée concrète du texte ou d’imposer une synthèse théologique absente de sa formulation.
translation_notes:
  register: Français international moderne, clair et digne. « Vous mêler à » rend idiomatiquement l’association avec les nations restantes. La série des impératifs négatifs garde le rythme ferme de l’exhortation et distingue chaque acte interdit.
