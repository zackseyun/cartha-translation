source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: fr
  text: Veillez donc avec le plus grand soin à aimer Yahweh, votre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: Veillez donc
  rationale: Le verbe exprime une vigilance active sur soi-même. « Veillez » rend naturellement cette exhortation en français, tandis que « donc » explicite le lien avec l'avertissement précédent.
- source_word: מְאֹד
  choice: avec le plus grand soin
  rationale: Cette tournure française restitue l'intensité de מְאֹד sans produire le calque peu naturel « veillez beaucoup ».
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: sens réfléchi intégré à « Veillez »
  rationale: Dans cette construction, נֶפֶשׁ désigne les personnes elles-mêmes, non une composante immatérielle isolée. Le français « veillez » porte ici naturellement l'idée de vigilance personnelle; ajouter « sur vous-mêmes » alourdirait la phrase et pourrait détourner l'attention du but exprimé ensuite.
- source_word: לְאַהֲבָה
  choice: à aimer
  rationale: L'infinitif construit avec לְ exprime ici le but ou l'orientation de cette vigilance. Après « veiller », « à aimer » est naturel et conserve ce rapport.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le suffixe de deuxième personne du pluriel exprime directement la relation d'alliance avec les destinataires.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans l'exhortation d'alliance
  choice: Valeur réfléchie portant sur la personne entière, intégrée au verbe « veillez »
  alternative: « vos âmes », « vos vies » ou « sur vous-mêmes »
  rationale: Le contexte appelle les Israélites à une vigilance personnelle et entière afin d'aimer fidèlement Yahweh. Traduire par « âmes » introduirait une distinction anthropologique que l'hébreu n'impose pas; « vos vies » déplacerait le sens vers la survie physique.
- issue: Rapport de לְאַהֲבָה avec l'impératif
  choice: 'But ou orientation : « à aimer »'
  alternative: 'Résultat strict ou simple complément nominal : « pour l''amour de »'
  rationale: La formulation conserve la possibilité que l'infinitif exprime à la fois le but recherché et l'orientation concrète de la vigilance, sans réduire l'amour à un sentiment.
translation_notes:
  register: Français international moderne, clair et digne. L'impératif pluriel s'adresse collectivement à Israël. La formulation garde l'accent solennel de l'exhortation tout en évitant un calque de לְנַפְשֹׁתֵיכֶם.
