reference: Joshua 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: fr
  text: Ce jour-là, Yahweh éleva Josué aux yeux de tout Israël, et ils le craignirent[a], tout comme ils avaient craint Moïse tous les jours de sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils éprouvèrent pour lui une crainte respectueuse » ou « ils le révérèrent » ; le verbe hébreu peut exprimer la peur, la crainte mêlée de respect ou la révérence selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Cette expression temporelle convient au récit et se dit naturellement en français moderne.
- source_word: גִּדַּל
  choice: éleva
  rationale: Le piel de גדל exprime ici que Yahweh confère à Josué une grandeur ou un rang reconnu. « Éleva » restitue cette valeur causative sans le calque peu naturel « rendit grand ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: aux yeux de tout Israël
  rationale: Cette formulation conserve l’image hébraïque et exprime l’estime publique dont Josué bénéficie.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: et ils le craignirent
  rationale: Le verbe ירא peut désigner la peur, la crainte respectueuse ou la révérence. « Craignirent » en préserve l’étendue sémantique et maintient le parallèle avec Moïse.
- source_word: כַּאֲשֶׁר
  choice: tout comme
  rationale: Cette locution française marque clairement l’étroite comparaison établie par le texte.
- source_word: יָרְאוּ אֶת מֹשֶׁה
  choice: ils avaient craint Moïse
  rationale: Le plus-que-parfait situe naturellement en français cette attitude envers Moïse avant l’élévation publique de Josué.
- source_word: כָּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: La traduction conserve la portée et la cadence de l’expression hébraïque; le pronom renvoie naturellement à Moïse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte le nom propre divin; sa translittération préserve son statut de nom plutôt que de lui substituer un titre.
- issue: Nuance de ירא à l’égard de Josué
  choice: ils le craignirent
  alternative: ils le révérèrent / ils éprouvèrent pour lui une crainte respectueuse
  rationale: Le choix principal conserve la force et l’ambivalence du terme hébreu ainsi que le parallèle littéraire avec Moïse, tandis que la note signale que le contexte peut impliquer respect et révérence plutôt que terreur.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « aux yeux de » conserve une image hébraïque encore naturelle en français. « Éleva » évite un calque pesant tout en exprimant la grandeur publiquement conférée à Josué.
