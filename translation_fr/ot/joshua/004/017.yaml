  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: fr
  text: 'Alors Josué donna cet ordre aux prêtres : « Remontez du Jourdain. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime un commandement faisant autorité. « Donna cet ordre » en conserve la force tout en introduisant naturellement le discours direct en français narratif.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: אֶת הַכֹּהֲנִים
  choice: aux prêtres
  rationale: Le groupe nominal défini désigne les prêtres comme destinataires du commandement; la construction française « donner un ordre à » exige le complément indirect.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles prononcées. En français moderne, les deux-points rendent cette fonction plus naturellement que « en disant ».
- source_word: עֲלוּ
  choice: Remontez
  rationale: Le verbe עלה décrit ici le mouvement vers le haut, depuis le lit du fleuve jusqu’à la terre ferme. « Remontez » est idiomatique dans ce contexte et n’impose pas le choix déictique entre « venez » et « allez ».
- source_word: מִן הַיַּרְדֵּן
  choice: du Jourdain
  rationale: La préposition מן marque le point de départ du mouvement. Avec « remonter », « du Jourdain » exprime naturellement la sortie hors du fleuve sans ajout explicatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe directe évite le calque « en disant », tandis que « Remontez » restitue le mouvement physique depuis le lit du Jourdain.
