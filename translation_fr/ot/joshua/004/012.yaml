base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: fr
  text: Les fils de Ruben, les fils de Gad et la demi-tribu de Manassé[a] traversèrent en armes[c] devant les fils d’Israël[b], comme Moïse le leur avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Rubénites, les Gadites et la demi-tribu de Manassé ». L’hébreu dit plus littéralement « les fils de Ruben… les fils de Gad… ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les Israélites ». L’hébreu dit plus littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « en armes » traduit un terme hébreu qui peut désigner des hommes équipés ou disposés pour le combat. Certains proposent un sens plus littéral tel que « rangés en formation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: traversèrent
  rationale: Dans ce contexte narratif, le verbe עבר désigne la traversée du Jourdain. « Traversèrent » est naturel en français et le lieu de la traversée ressort du contexte.
- source_word: בְּנֵי רְאוּבֵן
  choice: les fils de Ruben
  rationale: Cette formulation conserve l’expression hébraïque de filiation, tout en restant intelligible en français. « Les Rubénites » est signalé en note comme équivalent idiomatique.
- source_word: וּבְנֵי גָד
  choice: les fils de Gad
  rationale: La construction de filiation est conservée parallèlement à « les fils de Ruben ». « Les Gadites » constitue l’alternative idiomatique.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: la demi-tribu de Manassé
  rationale: Expression française claire et usuelle qui reproduit précisément la désignation tribale.
- source_word: חֲמֻשִׁים
  choice: en armes
  rationale: Le terme indique ici que les hommes sont équipés ou disposés pour le combat. « En armes » est concis et naturel, sans trancher plus que nécessaire entre équipement et formation militaire.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition indique leur position en avant du reste d’Israël pendant la traversée.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction maintient l’expression hébraïque de filiation. « Les Israélites » est donné en note comme formulation française plus idiomatique.
- source_word: כַּאֲשֶׁר
  choice: exactement comme
  rationale: Cette expression marque clairement la conformité entre leur action et les instructions antérieures de Moïse.
- source_word: דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: Moïse le leur avait dit
  rationale: Le plus-que-parfait rend l’antériorité des paroles de Moïse. Le pronom « le » exprime naturellement en français le contenu implicite de ses instructions sans transformer explicitement le verbe en « ordonner ».
