  text: וְ/הוֹדַעְתֶּ֖ם אֶת בְּנֵי/כֶ֣ם לֵ/אמֹ֑ר בַּ/יַּבָּשָׁה֙ עָבַ֣ר יִשְׂרָאֵ֔ל אֶת הַ/יַּרְדֵּ֖ן הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/022.yaml
  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: fr
  text: 'alors vous ferez savoir à vos enfants[a] : « Israël a traversé ce Jourdain à pied sec. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à vos fils » ; le mot hébreu peut désigner précisément les enfants de sexe masculin ou, plus généralement, les enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: alors vous ferez savoir
  rationale: Le hiphil de ידע exprime ici l’idée de faire connaître ou d’informer. « Vous ferez savoir » conserve cette valeur causative, tandis que « alors » rend naturellement l’enchaînement de l’instruction.
- source_word: בְּנֵיכֶם
  choice: vos enfants
  rationale: בנים peut désigner plus étroitement les fils ou, selon le contexte, les enfants au sens général. Ici, la transmission du souvenir à la génération suivante favorise « vos enfants », sans effacer l’autre possibilité.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le contenu des paroles. En français moderne, les deux-points rendent plus naturellement cette fonction qu’un calque tel que « en disant ».
- source_word: בַּיַּבָּשָׁה
  choice: à pied sec
  rationale: Le nom désigne la terre ou le sol sec. Dans le contexte d’une traversée, l’expression française idiomatique « à pied sec » transmet clairement que les Israélites ont traversé sans passer dans l’eau.
- source_word: עָבַר
  choice: a traversé
  rationale: עבר signifie passer ou traverser. Avec le Jourdain comme objet direct, « traverser » est le verbe français courant et précis.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre désigne ici le peuple d’Israël; la forme française traditionnelle est conservée.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: ce Jourdain
  rationale: Le démonstratif est maintenu afin de préserver l’immédiateté de l’hébreu. « Jourdain » suffit en français sans ajouter « fleuve », absent du texte source.
