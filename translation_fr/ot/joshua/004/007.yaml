source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: fr
  text: 'alors vous leur répondrez : « Les eaux du Jourdain se sont arrêtées devant l’arche de l’alliance de Yahweh. Lorsqu’elle a traversé le Jourdain, les eaux du Jourdain se sont arrêtées. » Ces pierres seront un mémorial pour les fils d’Israël, pour toujours[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les enfants d’Israël » ou « pour les Israélites ». L’hébreu dit littéralement « pour les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: ont été coupées
  rationale: Le nifal de כרת décrit ici l’interruption des eaux du fleuve. « Ont été coupées » conserve l’image hébraïque et sa répétition dans le verset.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: les eaux du Jourdain
  rationale: Le pluriel hébreu désigne les eaux ou le cours du fleuve; cette formulation est naturelle et bibliquement digne en français.
- source_word: מִפְּנֵי
  choice: devant
  rationale: 'Le terme garde ici son sens spatial : les eaux se sont interrompues devant l’arche, à son approche ou en sa présence.'
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Cette formulation conserve le titre complet et rattache directement l’alliance au nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּעָבְרוֹ
  choice: lorsqu’elle a traversé
  rationale: Le suffixe masculin singulier renvoie grammaticalement à l’arche; le féminin français « elle » reprend donc naturellement « l’arche ». « Traverser le Jourdain » est idiomatique sans ajouter une direction absente de l’hébreu.
- source_word: וְהָיוּ הָאֲבָנִים הָאֵלֶּה לְזִכָּרוֹן
  choice: Ces pierres serviront de mémorial
  rationale: La tournure exprime clairement la fonction durable assignée aux pierres. « Mémorial » garde l’idée d’un objet commémoratif public.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette traduction formelle conserve l’expression généalogique masculine du texte; une note signale les équivalents collectifs possibles en français.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression française courante rend directement l’idée de durée indéfinie et permanente.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; l’Éternel; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans introduire un titre de remplacement ni privilégier une tradition confessionnelle.
- issue: Portée de לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  alternative: aux enfants d’Israël; aux Israélites
  rationale: Le rendu principal garde la forme lexicale et généalogique de l’hébreu. La note préserve toutefois la possibilité d’une valeur collective désignant l’ensemble des Israélites.
- issue: Référent de בְּעָבְרוֹ
  choice: l’arche — « lorsqu’elle a traversé »
  alternative: Yahweh — « lorsqu’il a traversé »
  rationale: L’antécédent grammatical le plus immédiat est אֲרוֹן, « arche », masculin en hébreu. Le français reprend normalement ce nom par le pronom féminin « elle », sans effacer l’association de l’arche avec la présence de Yahweh.
translation_notes:
  register: Français international moderne, clair et digne. La reprise exacte de « les eaux du Jourdain ont été coupées » préserve l’insistance rhétorique de l’hébreu. « Alors vous leur répondrez » s’insère naturellement dans la situation question-réponse du contexte. Le futur « serviront » rend la fonction assignée aux pierres sans lourdeur archaïque.
