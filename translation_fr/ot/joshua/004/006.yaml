source:
  edition: WLC
  text: לְמַ֗עַן תִּֽהְיֶ֛ה זֹ֥את א֖וֹת בְּ/קִרְבְּ/כֶ֑ם כִּֽי יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ לֵ/אמֹ֔ר מָ֛ה הָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/006.yaml
  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: fr
  text: 'afin que cela serve de signe parmi vous. Quand, à l’avenir[c], vos enfants[a] demanderont : « Que signifient pour vous ces pierres[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vos fils ». Le terme désigne ici la génération suivante.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « Que sont pour vous ces pierres ? »'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « demain » ; le mot peut ici désigner un temps à venir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but de manière naturelle et soutenue en français.
- source_word: תִּהְיֶה זֹאת אוֹת
  choice: cela serve de signe
  rationale: Exprime le résultat visé après לְמַעַן; « serve de » est idiomatique et conserve la fonction symbolique de אוֹת.
- source_word: בְּקִרְבְּכֶם
  choice: parmi vous
  rationale: Désigne la présence du signe au sein de la communauté.
- source_word: כִּי יִשְׁאָלוּן
  choice: Quand … demanderont
  rationale: כִּי introduit ici la circonstance future anticipée; le futur français convient naturellement.
- source_word: בְּנֵיכֶם
  choice: vos enfants
  rationale: Littéralement « vos fils », mais le terme désigne ici représentativement la génération suivante.
- source_word: מָחָר
  choice: à l’avenir
  rationale: Le mot signifie littéralement « demain », mais peut désigner idiomatiquement un temps futur, comme ici.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles rapportées sans rendre lourdement l’infinitif quotatif « en disant ».
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: Que signifient pour vous ces pierres ?
  rationale: Rend en français idiomatique la question littérale « Que sont pour vous ces pierres ? » tout en conservant le complément « pour vous ».
theological_decisions:
- issue: Portée du masculin בְּנֵיכֶם
  choice: vos enfants
  alternative: vos fils
  rationale: Dans ce contexte de transmission mémorielle, le masculin pluriel représente la génération suivante plutôt qu’un groupe nécessairement limité aux garçons.
- issue: Sens de la question מָה ... לָכֶם
  choice: Que signifient pour vous ces pierres ?
  alternative: Que sont pour vous ces pierres ?
  rationale: La formulation choisie explicite la valeur interrogée — la signification des pierres — sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour la lisibilité. L’infinitif quotatif hébreu est rendu par une ponctuation française idiomatique.
