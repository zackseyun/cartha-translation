  text: צַוֵּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הָ/עֵד֑וּת וְ/יַעֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: fr
  text: Ordonne aux prêtres qui portent l’arche du témoignage de sortir du Jourdain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arche de l’attestation ». L’hébreu porte ici « témoignage », et non le terme plus familier « alliance » employé dans de nombreux autres passages concernant l’arche.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: Ordonne
  rationale: L’impératif masculin singulier de צוה exprime un ordre direct adressé à Josué ; « Ordonne » en conserve clairement la force.
- source_word: הַכֹּהֲנִים
  choice: aux prêtres
  rationale: Traduction courante de כהנים ; l’article défini hébreu est rendu par « les », contracté avec la préposition en « aux ».
- source_word: נֹשְׂאֵי
  choice: qui portent
  rationale: Le participe qal pluriel construit de נשׂא qualifie les prêtres. Une proposition relative rend naturellement en français sa valeur descriptive continue.
- source_word: אֲרוֹן הָעֵדוּת
  choice: l’arche du témoignage
  rationale: Cette formulation respecte la chaîne construite et traduit précisément עֵדוּת par « témoignage », sans l’harmoniser avec l’expression plus fréquente « arche de l’alliance ».
- source_word: וְיַעֲלוּ
  choice: de sortir
  rationale: עלה signifie littéralement « monter ». Dans ce contexte, il s’agit de remonter du lit du fleuve pour en sortir ; « sortir » exprime ce mouvement sans l’ambiguïté française de « remonter le Jourdain », qui pourrait signifier aller vers l’amont.
- source_word: מִן הַיַּרְדֵּן
  choice: du Jourdain
  rationale: La préposition מן indique ici le mouvement depuis l’intérieur du fleuve ; avec « sortir », « du Jourdain » est idiomatique et précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe directe conserve la force de l’ordre, tandis que « sortir du Jourdain » rend naturellement le mouvement hors du lit du fleuve. Le terme « témoignage » maintient la particularité lexicale du texte hébreu.
