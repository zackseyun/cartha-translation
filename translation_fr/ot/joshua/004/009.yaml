  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: fr
  text: Josué dressa douze pierres au milieu du Jourdain, sous l’emplacement occupé par les pieds des prêtres qui portaient l’arche de l’alliance[a], et elles y sont restées jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « sous le lieu où se tenaient les pieds des prêtres ». L’expression hébraïque désigne l’endroit où les prêtres se tenaient en portant l’arche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: dressa
  rationale: Le hiphil de קום signifie ici établir ou ériger. « Dressa » convient naturellement à des pierres commémoratives et conserve la solennité du récit.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: au milieu du Jourdain
  rationale: תּוֹךְ désigne le milieu ou l’intérieur d’un espace. Cette formulation française rend clairement l’emplacement dans le Jourdain lui-même.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: à l’endroit où s’étaient tenus les pieds
  rationale: מַצָּב désigne ici l’emplacement où l’on se tient. La formulation évite le calque peu naturel « sous la position des pieds » tout en préservant la précision locale; la note signale une traduction plus littérale de תַּחַת.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: les prêtres qui portaient l’arche de l’alliance
  rationale: Le participe נֹשְׂאֵי caractérise les prêtres comme ceux qui portent l’arche. « Portaient » est clair et courant en français moderne.
- source_word: וַיִּהְיוּ שָׁם
  choice: Elles sont restées là
  rationale: Dans la formule associée à עַד הַיּוֹם הַזֶּה, le verbe exprime une présence qui se prolonge jusqu’au présent du narrateur. Le féminin reprend naturellement « pierres ».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Expression française consacrée qui rend la persistance jusqu’à l’époque du narrateur, sans l’étendre au présent du lecteur.
theological_decisions:
- issue: Tension narrative entre les pierres de ce verset et les douze pierres dressées à Guilgal dans le contexte
  choice: Présenter sans harmonisation douze pierres dressées par Josué au milieu du Jourdain.
  alternative: Comprendre ce verset comme un résumé des pierres retirées du Jourdain et dressées ailleurs, ou modifier le texte afin de ne conserver qu’un seul monument.
  rationale: L’hébreu situe explicitement l’action בְּתוֹךְ הַיַּרְדֵּן, « au milieu du Jourdain ». La traduction conserve cette affirmation et laisse ouverte toute tentative de conciliation.
- issue: Portée temporelle de la formule עַד הַיּוֹם הַזֶּה
  choice: « Elles sont restées là jusqu’à ce jour. »
  alternative: « Elles y étaient jusqu’à ce jour. »
  rationale: La formulation choisie exprime la continuité jusqu’au présent du narrateur sans affirmer que les pierres existent encore à l’époque du lecteur.
translation_notes:
  register: Français international moderne, digne et narratif. « Dressa » conserve le caractère commémoratif de l’action; la syntaxe reste accessible. Le marqueur [a] figure dans le texte principal.
