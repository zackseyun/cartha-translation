  to: Josué dressa douze pierres au milieu du Jourdain, sous l’emplacement occupé par les pieds des prêtres qui portaient l’arche de l’alliance[a], et elles y sont restées jusqu’à ce jour.
  rationale: La révision retire l’adverbe non exprimé « aussi », restitue dans le texte principal la préposition תַּחַת (« sous »), et place la note sur le groupe qu’elle explicite. Elle conserve sans harmonisation les douze pierres situées au milieu du Jourdain et maintient la formule temporelle relative au point de vue du narrateur.
