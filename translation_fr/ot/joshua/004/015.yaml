  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/015.yaml
  text: And Yahweh said to Joshua,[a]
translation:
  language: fr
  text: Yahweh dit à Josué :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « en disant » ; cette expression introduit les paroles directes du verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple « dit » convient au registre narratif français ; la coordination וַ est naturellement laissée implicite ici.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: « Josué » est la forme française traditionnelle et reconnue de ce nom hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles directes du verset suivant. En français, les deux-points rendent cette fonction plus naturellement que le calque « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom sans le remplacer par un titre, tout en évitant la forme moins probable « Jéhovah ».
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au récit biblique écrit sans être archaïque ; les deux-points annoncent naturellement la parole qui suit.
