id: JOS.4.24
reference: Joshua 4:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ֠מַעַן דַּ֜עַת כָּל עַמֵּ֤י הָ/אָ֨רֶץ֙ אֶת יַ֣ד יְהוָ֔ה כִּ֥י חֲזָקָ֖ה הִ֑יא לְמַ֧עַן יְרָאתֶ֛ם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: fr
  text: afin que tous les peuples de la terre[a] sachent que la main de Yahweh est forte, et afin que vous craigniez[b] Yahweh, votre Dieu, tous les jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les peuples du pays », si הָאָרֶץ est compris dans un sens local plutôt que mondial.
    reason: lexical_alternative
  - marker: b
    text: Ici, « craindre » comprend la révérence et le profond respect envers Yahweh, et non la seule terreur.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution introduit naturellement en français le but visé dans chacune des deux propositions.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: tous les peuples de la terre
  rationale: « Peuples » rend עַמֵּי sans le préciser en « nations » ; « terre » retient ici la portée globale probable de הָאָרֶץ tout en signalant l'autre lecture possible en note.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: La traduction conserve l'image anthropomorphique hébraïque plutôt que de l'expliciter par « puissance ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La forme française reproduit directement le nom divin personnel exprimé par le tétragramme.
- source_word: כִּי חֲזָקָה הִיא
  choice: est forte
  rationale: L'adjectif féminin se rapporte à « main » et correspond directement au sens de חֲזָקָה.
- source_word: יְרָאתֶם
  choice: vous craigniez
  rationale: « Craindre » conserve la force et la tension du verbe ירא, qui peut englober ici respect, révérence et saisissement sans se réduire à la terreur.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans cette construction où Yahweh est le référent, אֱלֹהֵיכֶם désigne au singulier le Dieu d'Israël.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Cette expression française naturelle rend la durée continue de l'hébreu sans ajouter explicitement « de votre vie ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom personnel divin ; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Portée de ירא dans le cadre de l'alliance
  choice: craigniez
  alternative: révériez / respectiez profondément
  rationale: Le terme direct préserve à la fois la révérence et la crainte devant Dieu, sans atténuer ni limiter le sens hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle de l'hébreu est conservée par la répétition de « afin que ». L'image de la « main » et le verbe « craindre » sont maintenus afin de préserver la texture et la tension théologique du texte.
