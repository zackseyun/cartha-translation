  text: וַ/יֹּ֛אמֶר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אֲשֶׁר֩ יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ אֶת אֲבוֹתָ֣/ם לֵ/אמֹ֔ר מָ֖ה הָ/אֲבָנִ֥ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: fr
  text: 'Il dit aux fils d’Israël : « Lorsque vos enfants demanderont à l’avenir[a] à leurs pères : “Que sont ces pierres[c] ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « demain » ; ici, le mot désigne idiomatiquement un temps futur.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, de façon plus interprétative : « Que signifient ces pierres ? » L’hébreu dit plus littéralement : « Que sont ces pierres ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit le récit. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et communautaire de l’hébreu, plutôt que de la remplacer par le terme plus général « Israélites ».
- source_word: לֵאמֹר
  choice: deux-points et discours direct
  rationale: Le premier infinitif de אמר introduit la parole; la ponctuation française remplit naturellement cette fonction.
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: Quand […] demanderont
  rationale: אֲשֶׁר introduit ici une circonstance future, et שאל signifie couramment « demander ».
- source_word: בְּנֵיכֶם
  choice: vos enfants
  rationale: Bien que le nom soit formellement masculin pluriel, le contexte vise vraisemblablement les enfants ou descendants en général.
- source_word: מָחָר
  choice: plus tard
  rationale: « Demain » est employé idiomatiquement pour un temps futur; « plus tard » communique ce sens en français actuel.
- source_word: אֶת אֲבוֹתָם
  choice: à leurs pères
  rationale: La scène présente les enfants interrogeant leurs pères. « Ancêtres » élargirait indûment la référence.
- source_word: לֵאמֹר
  choice: deux-points et discours direct
  rationale: Le second infinitif introduit le contenu précis de la question; les deux-points et les guillemets sont plus naturels qu’un participe comme « en disant ».
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: Que sont ces pierres ?
  rationale: Cette question conserve la formulation identificatrice de l’hébreu et laisse au contexte le soin d’en faire ressortir la portée commémorative.
