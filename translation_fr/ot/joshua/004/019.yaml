base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: fr
  text: Le peuple remonta du Jourdain[a] le dixième jour du premier mois, et il campa à Guilgal, à l’extrémité est de Jéricho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sortit du Jourdain ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’est de Jéricho ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: remonta
  rationale: Le verbe עלה exprime un mouvement ascendant. « Remonta du Jourdain » conserve ce mouvement depuis le lit du fleuve tout en restant idiomatique dans un récit.
- source_word: מִן הַיַּרְדֵּן
  choice: du Jourdain
  rationale: La préposition מן marque ici le point de départ. En contexte, « le Jourdain » désigne clairement le fleuve.
- source_word: בֶּעָשׂוֹר
  choice: le dixième jour
  rationale: La formule hébraïque indique une date; le français explicite naturellement « jour ».
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: du premier mois
  rationale: חֹדֶשׁ a ici son sens calendaire ordinaire de « mois ».
- source_word: וַיַּחֲנוּ
  choice: il campa
  rationale: חנה signifie camper. Le singulier reprend naturellement le nom collectif « le peuple » en français.
- source_word: בַּגִּלְגָּל
  choice: à Guilgal
  rationale: Le nom de lieu est translittéré selon son usage français courant; « à » convient à un lieu de campement.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: à l’extrémité est de Jéricho
  rationale: קָצֶה désigne une extrémité ou un bord, et מִזְרַח précise le côté oriental. Cette formulation garde la relation géographique sans la durcir artificiellement en frontière administrative.
