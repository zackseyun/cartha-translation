  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: fr
  text: Les prêtres qui portaient l’arche restèrent debout au milieu du Jourdain jusqu’à ce que soit accompli tout ce que Yahweh avait ordonné à Josué de dire au peuple[a], conformément à tout ce que Moïse avait ordonné à Josué. Le peuple se hâta de traverser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à l’accomplissement de toute la parole » ou « de toute l’affaire ». L’expression résume l’achèvement de tout ce que Yahweh avait ordonné à Josué de dire au peuple.'
    reason: Signaler l’étendue sémantique de דָּבָר et préserver l’ambiguïté entre parole et affaire.
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  choice: les prêtres qui portaient l’arche
  rationale: La proposition relative rend naturellement en français le participe hébreu qui caractérise les prêtres par leur action en cours.
- source_word: עֹמְדִים
  choice: restèrent debout
  rationale: Le participe exprime une posture continue pendant que le peuple traverse. « Restèrent debout » restitue cette durée plus clairement que le simple « se tinrent ».
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: au milieu du Jourdain
  rationale: Rend directement la valeur spatiale de בְּתוֹךְ; le contexte identifie le Jourdain comme le fleuve.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: jusqu’à ce que soit accompli tout ce que
  rationale: Formulation française naturelle qui conserve l’idée d’achèvement total, tandis qu’une note signale l’expression hébraïque plus littérale et l’étendue possible de דָּבָר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: לְדַבֵּר אֶל הָעָם
  choice: de dire au peuple
  rationale: Dans cette construction, « dire au peuple » est idiomatique en français et conserve l’acte verbal commandé sans préciser davantage son contenu.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: conformément à tout ce que Moïse avait ordonné à Josué
  rationale: « Conformément à » exprime la conformité marquée par כְּכֹל, et le plus-que-parfait situe naturellement l’ordre antérieur.
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: Le peuple se hâta de traverser
  rationale: La tournure conserve l’idée explicite de hâte et relie naturellement en français les deux verbes successifs.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée de כָּל הַדָּבָר
  choice: tout ce que Yahweh avait ordonné à Josué de dire
  alternative: toute l’affaire / toute la parole
  rationale: Le français retenu rattache naturellement l’achèvement à l’ensemble du commandement transmis au peuple, sans préciser si דָּבָר désigne seulement les paroles ou plus largement les opérations commandées; la note conserve l’expression littérale.
translation_notes:
  register: Français international moderne, narratif et digne. « Restèrent debout » met en valeur la durée de la scène; « se hâta » garde une légère solennité biblique tout en restant immédiatement compréhensible.
