  yaml_path: translation/ot/joshua/004/020.yaml
  text: And Joshua set up these twelve stones at Gilgal, which they had taken from the Jordan.
translation:
  language: fr
  text: Josué dressa à Guilgal ces douze pierres qu’ils avaient prises dans le Jourdain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: Josué dressa
  rationale: La conjonction relie le verset au récit précédent; le marqueur d’objet אֵת ne se traduit pas directement. En français, commencer sans « Et » donne ici une narration plus naturelle sans perdre le lien contextuel.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: ces douze pierres
  rationale: Cette formulation rend le nombre, le nom défini et le démonstratif dans l’ordre naturel du français.
- source_word: אֲשֶׁר לָקְחוּ
  choice: qu’ils avaient prises
  rationale: Le plus-que-parfait marque naturellement que le prélèvement des pierres précède leur installation. L’accord de « prises » avec l’antécédent féminin pluriel est requis.
- source_word: מִן הַיַּרְדֵּן
  choice: dans le Jourdain
  rationale: Avec le verbe français « prendre », « prises dans le Jourdain » exprime idiomatiquement leur provenance. « Le Jourdain » désigne sans ambiguïté le fleuve.
- source_word: הֵקִים
  choice: dressa
  rationale: Dans le contexte de pierres commémoratives, « dresser » exprime clairement leur mise en place et conserve la valeur concrète du verbe hébreu.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française conventionnelle du nom propre.
- source_word: בַּגִּלְגָּל
  choice: à Guilgal
  rationale: La préposition « à » est naturelle en français devant ce nom de lieu; « Guilgal » est la forme biblique française usuelle.
