base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: fr
  text: 'et donnez-leur cet ordre : « Prenez pour vous, ici même, au milieu du Jourdain, du lieu où les pieds des prêtres sont fermement posés[a], douze pierres. Emportez-les avec vous de l’autre côté et déposez-les au lieu où vous passerez la nuit[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « depuis l’emplacement des pieds des prêtres, fermement établis » ou « depuis l’endroit où les pieds des prêtres sont fermement posés ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « lieu » désigne ici l’endroit où Israël fera étape pour la nuit après la traversée, et non nécessairement un établissement permanent.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: et donnez-leur cet ordre
  rationale: Le piel impératif de צוה exprime un ordre direct. Cette tournure française en conserve la force tout en introduisant naturellement le discours cité.
- source_word: שְׂאוּ לָכֶם
  choice: Prenez pour vous
  rationale: « Prenez » rend l’action de soulever et d’emporter les pierres; « pour vous » conserve le datif לָכֶם et souligne l’implication personnelle sans suggérer une propriété privée.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: ici même, au milieu du Jourdain
  rationale: « Ici même » restitue l’insistance de מִזֶּה, et « au milieu du Jourdain » situe précisément les pierres dans le lit du fleuve.
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: à l’endroit où les prêtres se tiennent, les pieds fermement posés
  rationale: La formulation française exprime à la fois le lieu où les prêtres se tiennent et la stabilité indiquée par הָכִין, sans transformer cette stabilité en commentaire explicatif.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: douze pierres
  rationale: Traduction directe du nombre et du nom.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: Emportez-les avec vous de l’autre côté
  rationale: Le hiphil de עבר indique ici que les pierres doivent être transportées lors de la traversée; « de l’autre côté » rend clairement le mouvement de franchissement.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: et déposez-les
  rationale: '« Déposez » rend concrètement le hiphil de נוח : les pierres transportées doivent être posées au lieu d’étape.'
- source_word: בַּמָּלוֹן אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: au lieu où vous passerez la nuit
  rationale: Cette formulation naturelle conserve l’idée d’un lieu d’étape pour la nuit et la valeur future du verbe dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours garde le caractère concret et solennel de l’ordre. « Ici même » préserve l’insistance spatiale de l’hébreu; « lieu où vous passerez la nuit » évite le sens potentiellement trop militaire de « camp ».
