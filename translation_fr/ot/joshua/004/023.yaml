source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: fr
  text: Car Yahweh, votre Dieu, a mis à sec devant vous les eaux du Jourdain jusqu’à ce que vous passiez, tout comme Yahweh, votre Dieu, avait mis à sec devant nous les eaux de la mer des Roseaux[a] jusqu’à ce que nous passions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement rendu par « la mer Rouge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: a mis à sec
  rationale: Le hiphil de יבש exprime ici l’action de rendre les eaux sèches afin de permettre le passage. « Mettre à sec » est naturel en français et peut être repris dans les deux propositions.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel porté par le tétragramme, plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Associé à Yahweh et employé au singulier, le terme désigne sans ambiguïté le Dieu d’Israël.
- source_word: מֵי הַיַּרְדֵּן
  choice: les eaux du Jourdain
  rationale: Cette formulation conserve l’image concrète et la construction hébraïque tout en étant idiomatique en français.
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: devant vous / devant nous
  rationale: L’expression spatiale hébraïque est rendue directement et naturellement, avec le changement de personne du texte source.
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: jusqu’à ce que vous soyez passés / jusqu’à ce que nous soyons passés
  rationale: La tournure marque la durée jusqu’à l’accomplissement du passage. Le verbe « passer » laisse l’objet implicite comme en hébreu et préserve le parallélisme.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: tout comme … l’avait fait
  rationale: « Tout comme » rend clairement la comparaison entre le passage du Jourdain et celui de la mer; le plus-que-parfait situe naturellement l’événement antérieur en français.
- source_word: יַם סוּף
  choice: la mer des Roseaux
  rationale: סוּף désigne des roseaux ou plantes aquatiques. « Mer des Roseaux » suit donc de près la désignation hébraïque, tandis que l’appellation traditionnelle est signalée en note.
- source_word: אֲשֶׁר
  choice: Car
  rationale: Dans l’enchaînement discursif avec le verset précédent, la proposition explique comment Israël a traversé à pied sec; « Car » exprime naturellement cette valeur explicative en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre de l’alliance sans lui substituer un titre.
- issue: Identification de יַם סוּף
  choice: la mer des Roseaux
  alternative: la mer Rouge
  rationale: Le sens lexical de סוּף favorise « Roseaux ». La traduction traditionnelle « mer Rouge » reste indiquée en note afin d’orienter le lecteur sans imposer cette identification au texte principal.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre les deux miracles et le contraste « vous / nous » sont conservés. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
