source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: fr
  text: 'Voici ce qui arriva : lorsque les prêtres qui portaient l’arche de l’alliance de Yahweh remontèrent du milieu du Jourdain et que les plantes de leurs pieds se furent retirées vers la terre sèche[a], les eaux du Jourdain reprirent leur place et se remirent à couler comme auparavant[b], par-dessus toutes ses rives.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « les plantes des pieds des prêtres furent retirées vers la terre sèche ».'
    reason: Le verbe hébreu exprime concrètement le retrait ou le détachement des pieds hors du fleuve; la tournure française conserve ce mouvement tout en restant naturelle.
  - marker: b
    text: 'Littéralement : « comme hier et avant-hier », expression hébraïque qui signifie « comme auparavant » ou « comme autrefois ».'
    reason: La note signale l’idiome temporel sous-jacent à la traduction naturelle.
lexical_decisions:
- source_word: וַיְהִי
  choice: Voici ce qui arriva
  rationale: Cette formule narrative introduit l’événement qui suit. La tournure française conserve cette fonction sans employer l’archaïque « il advint ».
- source_word: בַעֲלוֹת
  choice: lorsque ... remontèrent
  rationale: L’infinitif construit avec ב introduit une circonstance temporelle. « Remonter » exprime naturellement la sortie du lit du fleuve.
- source_word: נֹשְׂאֵי
  choice: qui portaient
  rationale: Le participe décrit les prêtres pendant l’action ; cette proposition relative est claire et naturelle en français.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Le groupe construit est rendu explicitement, en conservant le nom divin comme nom propre.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: du milieu du Jourdain
  rationale: תוך désigne l’intérieur ou le milieu du fleuve, et non simplement sa rive.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: la plante de leurs pieds eut atteint la terre sèche
  rationale: La formulation française exprime le passage final hors du lit du fleuve. Une note conserve la nuance plus concrète et inhabituelle du verbe נתק.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: les eaux du Jourdain reprirent leur place
  rationale: « Reprendre leur place » rend naturellement le retour des eaux à leur emplacement antérieur.
- source_word: וַיֵּלְכוּ
  choice: coulèrent
  rationale: Dans le contexte des eaux d’un fleuve, « couler » est l’équivalent français idiomatique de הלך, littéralement « aller ».
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: comme auparavant
  rationale: Cette expression hébraïque est un idiome temporel signifiant « comme autrefois » ou « comme auparavant ».
- source_word: עַל כָּל גְּדוֹתָיו
  choice: par-dessus toutes ses rives
  rationale: La préposition עַל indique ici que les eaux passent au-dessus des rives, conformément au niveau de crue décrit dans le contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » le rend comme nom propre et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase garde la progression temporelle du texte hébreu tout en évitant une syntaxe calquée et maladroite. « Arche », « alliance » et « Jourdain » conservent le vocabulaire biblique courant.
