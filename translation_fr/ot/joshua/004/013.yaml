  text: כְּ/אַרְבָּעִ֥ים אֶ֖לֶף חֲלוּצֵ֣י הַ/צָּבָ֑א עָבְר֞וּ לִ/פְנֵ֤י יְהוָה֙ לַ/מִּלְחָמָ֔ה אֶ֖ל עַֽרְב֥וֹת יְרִיחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: fr
  text: Environ quarante mille hommes équipés pour la guerre passèrent devant Yahweh pour le combat, jusqu’aux plaines de Jéricho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אַרְבָּעִים אֶלֶף
  choice: Environ quarante mille
  rationale: Le préfixe כְּ donne ici au nombre une valeur approximative, rendue naturellement par « environ ».
- source_word: חֲלוּצֵי הַצָּבָא
  choice: hommes équipés pour la guerre
  rationale: L’expression désigne des hommes armés et disposés pour l’action militaire. Cette formulation reste claire sans préciser indûment qu’il s’agissait d’une avant-garde.
- source_word: עָבְרוּ
  choice: passèrent
  rationale: Dans le contexte immédiat, le franchissement du Jourdain est déjà établi. « Passèrent » est naturel en français et conserve le mouvement du récit.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La traduction formelle de לִפְנֵי préserve l’idée d’agir devant ou en présence de Yahweh, sans trancher davantage la nuance spatiale ou cultuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu et suit la convention du projet.
- source_word: לַמִּלְחָמָה
  choice: prêts au combat
  rationale: La tournure exprime la destination ou la préparation à l’affrontement. « Prêts au combat » évite la répétition maladroite de « guerre » tout en conservant le sens militaire.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: vers les plaines de Jéricho
  rationale: עַרְבוֹת désigne la région de plaines ou de steppes de la vallée du Jourdain. « Plaines de Jéricho » est précis et accessible; « vers » rend אֶל sans imposer que le mouvement soit déjà achevé.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre et suit la politique indiquée pour le projet.
- issue: Sens de לִפְנֵי יְהוָה
  choice: devant Yahweh
  alternative: en présence de Yahweh
  rationale: « Devant » maintient la formulation concrète et l’ambiguïté possible entre présence divine, ordre de marche et représentation sacrée, sans expliquer le texte à la place du lecteur.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’ordre général de l’hébreu tout en évitant une répétition peu naturelle entre « équipés pour la guerre » et « pour la guerre ». Aucun marqueur de note n’est requis, puisque le texte proposé ne déplace pas le complément final comme le fait la couche anglaise auditée.
