  text: So Joshua called the twelve men whom he had appointed from the sons of Israel[b][a], one man from each tribe.
translation:
  language: fr
  text: Josué appela les douze hommes qu’il avait désignés parmi les fils d’Israël[a], un homme par tribu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Israélites ». L’hébreu porte littéralement « parmi les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le verbe קרא avec אֶל exprime ici l’action de faire venir à soi les hommes déjà choisis. « Appela » est naturel en français et n’ajoute pas la force plus marquée de « convoqua ».
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: les douze hommes
  rationale: L’article et le contexte désignent un groupe déterminé, déjà présenté au verset précédent.
- source_word: אֲשֶׁר הֵכִין
  choice: qu’il avait désignés
  rationale: Dans ce contexte, הכין ne signifie pas simplement préparer matériellement, mais établir ou mettre à part ces représentants. « Désignés » exprime ce sens tout en évitant la nuance institutionnelle plus forte de « nommés ».
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: « Fils d’Israël » conserve la forme hébraïque de cette désignation collective. Avec un verbe de sélection, « parmi » rend naturellement la provenance du groupe.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: un homme par tribu
  rationale: Cette formulation française restitue clairement la valeur distributive de la répétition hébraïque, sans reproduire une tournure maladroite.
