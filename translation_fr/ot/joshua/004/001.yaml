id: JOS.4.1
reference: Joshua 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֙ כַּ/אֲשֶׁר תַּ֣מּוּ כָל הַ/גּ֔וֹי לַ/עֲב֖וֹר אֶת הַ/יַּרְדֵּ֑ן וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־־־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: fr
  text: 'Quand toute la nation[a] eut fini de traverser le Jourdain, Yahweh dit à Josué :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le peuple ». L’hébreu emploie ici un nom collectif singulier pour désigner Israël.
    reason: Variante lexicale et précision sur la valeur collective de גּוֹי.
lexical_decisions:
- source_word: וַיְהִי
  choice: Quand… Yahweh dit
  rationale: Le wayyiqtol de היה sert ici à faire avancer le récit et à introduire la circonstance temporelle. En français actuel, cette fonction s’exprime naturellement par la proposition introduite par « Quand », sans la tournure vieillie « Il arriva que ».
- source_word: כַּאֲשֶׁר
  choice: Quand
  rationale: La conjonction introduit une proposition temporelle antérieure à la parole de Yahweh.
- source_word: תַּמּוּ
  choice: eut fini
  rationale: Le verbe תמם indique l’achèvement. Le passé antérieur marque clairement que la traversée était terminée avant la parole de Yahweh, dans un registre narratif digne.
- source_word: כָל הַגּוֹי
  choice: toute la nation
  rationale: גּוֹי désigne ici Israël comme collectivité nationale. « Toute la nation » conserve le singulier collectif de l’hébreu; la variante plus idiomatique « tout le peuple » est signalée en note.
- source_word: לַעֲבוֹר
  choice: de traverser
  rationale: 'L’infinitif construit avec ל complète naturellement תמם : « finir de traverser ».'
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme géographique française courante; l’ajout de « fleuve » n’est pas nécessaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: 'dit à Josué :'
  rationale: La formule hébraïque de discours est rendue idiomatiquement; les deux-points annoncent les paroles qui suivent au verset suivant.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste naturelle tout en conservant l’antériorité de la traversée et la valeur collective de « nation ». Le deux-points maintient l’ouverture vers la parole rapportée au verset suivant.
