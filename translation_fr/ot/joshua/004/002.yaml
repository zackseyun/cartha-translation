  text: Take for yourselves from the people twelve men[a], one man from each tribe.
translation:
  language: fr
  text: Prenez parmi le peuple douze hommes, un homme de chaque tribu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète littéralement : « un homme, un homme d’une tribu » ; cette répétition exprime une distribution, un homme par tribu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ לָכֶם
  choice: Prenez
  rationale: 'L’impératif pluriel de לקח signifie fondamentalement « prendre ». En français, le pronom bénéficiaire לָכֶם n’a pas besoin d’être rendu séparément ici : « prenez-vous » serait ambigu ou peu naturel, tandis que le contexte conserve l’idée que les hommes sont pris pour la mission confiée à Israël.'
- source_word: מִן הָעָם
  choice: parmi le peuple
  rationale: La préposition מן exprime ici le prélèvement au sein d’un groupe. « Parmi le peuple » est plus idiomatique et plus précis en français que « du peuple ».
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: douze hommes
  rationale: Le syntagme désigne explicitement douze hommes adultes ; « hommes » conserve cette indication sans généralisation.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: un homme de chaque
  rationale: La répétition hébraïque a une valeur distributive. La formulation française exprime naturellement qu’un homme doit être pris dans chacune des tribus, tandis qu’une note signale la forme littérale.
- source_word: מִשָּׁבֶט
  choice: tribu
  rationale: Dans ce contexte, שֵׁבֶט désigne chacune des tribus d’Israël ; « tribu » est le terme français courant et précis.
