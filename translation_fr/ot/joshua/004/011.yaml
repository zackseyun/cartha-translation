id: JOS.4.11
reference: Joshua 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: fr
  text: Lorsque tout le peuple eut fini de traverser, l’arche de Yahweh et les prêtres traversèrent devant le peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence du peuple ». L’expression hébraïque peut désigner soit une position spatiale (« devant, en avant de »), soit la présence de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule introduit ici une circonstance temporelle dans le récit. « Lorsque » rend naturellement cette transition sans alourdir le français par « il arriva que ».
- source_word: תַּם
  choice: eut fini
  rationale: Le verbe exprime l’achèvement. Le passé antérieur marque clairement que la traversée du peuple était achevée avant l’action de la proposition principale.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette expression collective naturelle conserve l’idée de totalité portée par כָּל.
- source_word: לַעֲבוֹר / וַיַּעֲבֹר
  choice: de traverser / traversèrent
  rationale: La répétition de « traverser » reproduit celle de la racine עבר et convient au passage du Jourdain.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le groupe construit désigne l’arche appartenant à Yahweh ou associée à sa présence; le nom divin est conservé sous sa forme personnelle.
- source_word: וְהַכֹּהֲנִים
  choice: et les prêtres
  rationale: La conjonction coordonne les prêtres avec l’arche comme participants à la traversée. Le verbe est mis au pluriel en français conformément à l’accord usuel avec deux sujets coordonnés.
- source_word: לִפְנֵי הָעָם
  choice: devant le peuple
  rationale: 'Le sens spatial, « devant », convient bien au contexte, tout en laissant en note l’autre valeur possible de la locution: « en présence de ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Relation de l’arche et des prêtres avec le peuple lors de la traversée
  choice: devant le peuple
  alternative: en présence du peuple
  rationale: La locution לִפְנֵי peut indiquer soit une position en avant, soit la présence ou le regard d’autrui. Le contexte favorise la lecture spatiale, mais ne permet pas d’exclure totalement l’autre sens.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé antérieur après « lorsque » maintient une chronologie nette dans un registre digne. La répétition de « traverser » est volontaire afin de refléter celle du texte hébreu.
