revisions:
- from: Les fils d’Israël firent donc ce que Josué avait ordonné. Ils prirent douze pierres au milieu du Jourdain, comme Yahweh l’avait dit à Josué, une pour chacune des tribus des fils d’Israël. Ils les emportèrent avec eux jusqu’au lieu où ils devaient passer la nuit[a] et les y déposèrent.
  to: 'Les fils d’Israël firent ainsi, comme Josué le leur avait ordonné : ils emportèrent douze pierres du milieu du Jourdain, comme Yahweh l’avait dit à Josué, selon le nombre des tribus des fils d’Israël. Ils les transportèrent avec eux jusqu’au lieu d’étape[a] et les y déposèrent.'
  rationale: La correction resserre le texte sur les formulations et les relations syntaxiques de l’hébreu, tout en conservant un français international naturel. Elle remplace l’interprétation distributive par l’expression plus littérale « selon le nombre », précise que les pierres viennent « du milieu » du Jourdain et maintient la note lexicale au seul emplacement nécessaire.
