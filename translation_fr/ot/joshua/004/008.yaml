  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: fr
  text: 'Les fils d’Israël firent ainsi, comme Josué le leur avait ordonné : ils emportèrent douze pierres du milieu du Jourdain, comme Yahweh l’avait dit à Josué, selon le nombre des tribus des fils d’Israël. Ils les transportèrent avec eux jusqu’au lieu d’étape[a] et les y déposèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’au campement »; le terme hébreu désigne plus précisément un lieu d’étape où l’on passe la nuit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression familiale explicite de l’hébreu et son parallélisme dans le verset.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent donc ce que Josué avait ordonné
  rationale: Rend naturellement l’idée qu’ils agirent conformément à l’ordre donné, sans le calque peu idiomatique « firent ainsi ».
- source_word: וַיִּשְׂאוּ
  choice: ils prirent
  rationale: Dans ce contexte, le verbe englobe le fait de soulever les pierres puis de les transporter; la suite explicite leur déplacement.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: au milieu du Jourdain
  rationale: Préserve la valeur spatiale de תּוֹךְ et désigne naturellement la partie du lit du fleuve d’où les pierres furent prises.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: une pour chacune des tribus des fils d’Israël
  rationale: Exprime clairement la correspondance distributive impliquée par les douze pierres et le nombre des tribus.
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: ils les emportèrent avec eux
  rationale: Rend le déplacement causatif des pierres pendant la traversée, dans un français naturel.
- source_word: הַמָּלוֹן
  choice: le lieu où ils devaient passer la nuit
  rationale: Restitue le sens concret d’un lieu d’étape ou de campement nocturne sans suggérer un logement bâti.
- source_word: וַיַּנִּחוּם שָׁם
  choice: les y déposèrent
  rationale: Rend avec concision l’action de poser les pierres à cet endroit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom propre et évite de le confondre avec un titre.
- issue: Rapport entre les douze pierres et les douze tribus
  choice: une pour chacune des tribus
  alternative: selon le nombre des tribus
  rationale: Cette formulation explicite la correspondance numérique indiquée par לְמִסְפַּר, sans ajouter de symbolisme théologique absent du verset.
translation_notes:
  register: Français moderne international, narratif et digne. La syntaxe hébraïque très coordonnée est légèrement segmentée pour la lisibilité. L’expression « fils d’Israël » est conservée malgré la possibilité plus courante « Israélites », tandis que « lieu où ils devaient passer la nuit » rend concrètement le sens de l’étape nocturne.
