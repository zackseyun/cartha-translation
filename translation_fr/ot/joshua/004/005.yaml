source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: fr
  text: 'Josué leur dit : « Passez devant l’arche de Yahweh, votre Dieu, au milieu du Jourdain, et que chacun de vous charge une pierre sur son épaule, selon le nombre des tribus des fils d’Israël[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ». Cette expression hébraïque formelle est souvent rendue par « les Israélites » ou « le peuple d’Israël ».'
    reason: Précision sur l’expression collective hébraïque et ses traductions possibles.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple rend naturellement cette succession sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: עִבְרוּ לִפְנֵי
  choice: Passez devant
  rationale: עבר désigne ici le passage, et לִפְנֵי situe les hommes en avant de l’arche. Cette formulation est naturelle et conserve le rapport spatial.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: l’arche de Yahweh, votre Dieu
  rationale: La chaîne construite est rendue directement, et le nom divin est translittéré « Yahweh ».
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: jusqu’au milieu du Jourdain
  rationale: תּוֹךְ désigne l’intérieur ou le milieu. « Jusqu’au milieu » exprime clairement la destination du mouvement en français.
- source_word: וְהָרִימוּ לָכֶם אִישׁ אֶבֶן אַחַת
  choice: Que chacun de vous soulève une pierre
  rationale: 'La tournure distributive אִישׁ est rendue par « chacun de vous » : chaque représentant doit prendre une pierre. « Soulève » conserve le sens causatif de רום sans alourdir la phrase.'
- source_word: עַל שִׁכְמוֹ
  choice: et la mette sur son épaule
  rationale: Le pronom singulier distributif est conservé. L’ajout du pronom « la » explicite naturellement en français que la pierre soulevée doit être placée sur l’épaule.
- source_word: לְמִסְפַּר
  choice: selon le nombre de
  rationale: La préposition exprime une correspondance entre le nombre de pierres et celui des tribus.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: les tribus des fils d’Israël
  rationale: Cette traduction conserve les deux éléments de l’expression hébraïque et son caractère formel, plutôt que de la réduire à « les tribus d’Israël ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance au lieu de le remplacer par un titre.
- issue: Rendu de אִישׁ et de בְנֵי יִשְׂרָאֵל
  choice: chacun de vous … les fils d’Israël
  alternative: chaque homme … les Israélites
  rationale: « Chacun de vous » garde la valeur distributive de אִישׁ dans l’adresse aux représentants masculins, tandis que « fils d’Israël » préserve la formule collective et généalogique du texte source.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique sans archaïsme excessif. La syntaxe de l’ordre a été légèrement réorganisée pour être idiomatique, tout en conservant le mouvement, la position devant l’arche, le milieu du Jourdain et la correspondance d’une pierre par tribu.
