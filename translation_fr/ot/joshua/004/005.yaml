  to: 'Josué leur dit : « Passez devant l’arche de Yahweh, votre Dieu, au milieu du Jourdain, et que chacun de vous charge une pierre sur son épaule, selon le nombre des tribus des fils d’Israël[a]. »'
  rationale: 'La révision rend plus précisément le mouvement vers le milieu du Jourdain et remplace l’ajout interprétatif « la mette » par une formulation française naturelle qui conserve l’unique action exprimée : porter une pierre sur l’épaule. La note et son ancre sont conservées.'
