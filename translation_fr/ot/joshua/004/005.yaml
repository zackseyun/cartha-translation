  naturalness: Le français est globalement naturel et d’un registre biblique moderne. « Charger une pierre sur son épaule » est idiomatique et exprime directement le fait de soulever/porter la pierre sur l’épaule sans introduire une étape supplémentaire.
  terminology: « Yahweh, votre Dieu » respecte le nom divin et la relation possessive. « Les fils d’Israël » conserve la formule hébraïque formelle; la note correspond bien à son ancre.
