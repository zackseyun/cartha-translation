source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: fr
  text: 'Leur territoire s’étendait depuis Mahanaïm : tout le Bashân, tout le royaume d’Og, roi du Bashân, et tous les villages de Yaïr[a] situés dans le Bashân, soit soixante villes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Havvoth-Yaïr », translittération traditionnelle du nom hébreu de ces localités.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: leur territoire
  rationale: Dans le contexte du partage du pays, גְּבוּל désigne ici la région délimitée plutôt que la seule ligne de frontière.
- source_word: מִמַּחֲנַיִם
  choice: s’étendait depuis Mahanaïm
  rationale: La préposition מִן indique le point de départ de la description territoriale. Cette formulation est naturelle en français tout en conservant ce rapport spatial.
- source_word: כָּל הַבָּשָׁן
  choice: tout le Bashân
  rationale: Cette traduction conserve la portée exhaustive de כָּל et traite Bashân comme le nom de la région.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: tout le royaume d’Og, roi du Bashân
  rationale: מַמְלְכוּת désigne le royaume ou domaine royal; « royaume » est ici clair et usuel.
- source_word: חַוֹּת יָאִיר
  choice: les villages de Yaïr
  rationale: חַוּוֹת désigne des campements ou agglomérations associés à Yaïr. « Villages » est compréhensible en français moderne; la translittération traditionnelle est signalée en note.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: situés dans le Bashân
  rationale: Le participe français rend naturellement la proposition relative de localisation sans modifier son sens.
- source_word: שִׁשִּׁים עִיר
  choice: soixante villes
  rationale: עִיר peut désigner une ville ou une localité. « Villes » respecte l’usage courant dans les listes territoriales bibliques sans nécessairement évoquer de grands centres urbains.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres sont translittérés de manière usuelle. Le deux-points clarifie que ce qui suit décrit l’étendue du territoire à partir de Mahanaïm, sans prétendre résoudre plus précisément la géographie implicite.
