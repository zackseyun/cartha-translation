  text: וְ/עַתָּ֗ה חַלֵּ֞ק אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את בְּ/נַחֲלָ֖ה לְ/תִשְׁעַ֣ת הַ/שְּׁבָטִ֑ים וַ/חֲצִ֖י הַ/שֵּׁ֥בֶט הַֽ/מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: fr
  text: Maintenant, répartis ce pays en héritage entre les neuf tribus et la demi-tribu de Manassé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et maintenant, répartis ce pays comme héritage entre les neuf tribus et la moitié de la tribu de Manassé. »'
    reason: Alternative lexicale et syntaxique préservant explicitement la conjonction initiale et une autre analyse naturelle des expressions בְּנַחֲלָה et חֲצִי הַשֵּׁבֶט.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit le commandement suivant dans la continuité du discours. « Maintenant » est naturel en français moderne; « Et maintenant » reste possible.
- source_word: חַלֵּק
  choice: répartis
  rationale: Impératif adressé à Josué. « Répartir » exprime ici plus naturellement que « diviser » l'attribution du territoire entre plusieurs bénéficiaires.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Désigne le territoire dont il vient d'être question. « Pays » convient au contexte territorial et historique; « territoire » serait également possible.
- source_word: בְּנַחֲלָה
  choice: en héritage
  rationale: נַחֲלָה désigne le bien foncier attribué durablement aux tribus. « En héritage » conserve la portée juridique et l'écho théologique sans les expliciter davantage.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: entre les neuf tribus
  rationale: La préposition indique les bénéficiaires de la répartition. Avec le verbe « répartir », « entre » est la tournure française la plus idiomatique.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: et la demi-tribu
  rationale: Expression construite désignant la subdivision reconnue d'une tribu. « Demi-tribu » est la formulation française biblique claire et usuelle.
- source_word: הַמְנַשֶּׁה
  choice: de Manassé
  rationale: Le nom propre tribal est translittéré sous sa forme française consacrée.
