  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: fr
  text: 'Voici le territoire qui reste : tous les districts[a] des Philistins et tout le pays des Gueshuriens[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « régions ». Le mot hébreu désigne des zones territoriales.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement « tout le Gueshurien » : le gentilé singulier est employé collectivement et désigne ici le pays des Gueshuriens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: Voici le territoire qui reste
  rationale: « Voici » restitue naturellement la valeur présentative de זֹאת. « Territoire » convient au contexte géographique de la répartition du pays, et « qui reste » rend le participe niphal sans préciser davantage pourquoi ces terres restent.
- source_word: כָּל גְּלִילוֹת
  choice: tous les districts
  rationale: גְּלִילוֹת désigne ici des zones territoriales. « Districts » en conserve la nuance géographique ou administrative, tandis que « régions » reste une variante possible.
- source_word: הַפְּלִשְׁתִּים
  choice: des Philistins
  rationale: L’hébreu nomme le peuple plutôt que la Philistie; le complément « des Philistins » préserve cette relation.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: et tout le territoire des Gueshourites
  rationale: Le gentilé singulier הַגְּשׁוּרִי a une valeur collective et, en parallèle avec les districts philistins, peut désigner la zone occupée par ce groupe. L’ajout de « territoire » rend explicite en français le référent territorial sous-entendu, sans identifier ce Gueshour à une autre entité homonyme.
