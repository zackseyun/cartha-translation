  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: fr
  text: 'Heshbon et toutes ses villes situées sur le plateau[a] : Dibon, Bamoth-Baal et Beth-Baal-Meon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la plaine » ou « sur le haut plateau ». Le terme hébreu désigne ici la région d’altitude relativement plane située à l’est du Jourdain.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Heshbon
  rationale: Nom de lieu transcrit sous une forme proche de l’hébreu et aisément reconnaissable en français.
- source_word: וְכָל עָרֶיהָ
  choice: et toutes ses villes
  rationale: Le suffixe féminin singulier renvoie à Heshbon. Le possessif « ses » est naturel en français tout en conservant ce lien grammatical.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: situées sur le plateau[a]
  rationale: Dans ce contexte territorial transjordanien, מִישׁוֹר désigne une région élevée et relativement plane. « Sur le plateau » rend clairement cette réalité géographique, tandis que la note conserve les autres valeurs lexicales possibles.
- source_word: דִּיבוֹן
  choice: Dibon
  rationale: Nom de lieu transcrit plutôt que traduit.
- source_word: וּבָמוֹת בַּעַל
  choice: Bamoth-Baal
  rationale: L’expression fonctionne ici comme un toponyme composé; la transcription et le trait d’union évitent de la transformer en syntagme commun (« hauts lieux de Baal »).
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: et Beth-Baal-Meon
  rationale: Toponyme composé transcrit dans son ensemble; « Beth » est conservé comme élément du nom propre plutôt que traduit par « maison ».
theological_decisions: []
