  text: וַ/יִּתֵּ֣ן מֹשֶׁ֔ה לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ/יְהִ֗י לַ/חֲצִ֛י מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: fr
  text: 'Moïse donna à la demi-tribu de Manassé, et elle fut pour la demi-tribu des fils de Manassé[a], selon leurs clans :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils de Manassé » ; expression de parenté désignant ici les descendants ou les membres de la tribu de Manassé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna une part
  rationale: Dans ce contexte de partage territorial, נתן signifie « donner ». L’ajout de « une part » explicite naturellement en français l’objet sous-entendu, à savoir le territoire attribué.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: à la demi-tribu de Manassé
  rationale: חֲצִי désigne la moitié et שֵׁבֶט l’unité tribale. « Demi-tribu » est la formulation française usuelle et concise dans ce contexte.
- source_word: וַיְהִי
  choice: elle revint donc à
  rationale: Le verbe היה signifie littéralement « être », mais la formule exprime ici le résultat du partage. « Revint à » rend clairement cette valeur distributive tout en conservant le lien avec l’attribution précédente.
- source_word: לַחֲצִי מַטֵּה
  choice: à la moitié de la tribu
  rationale: מַטֶּה signifie ici « tribu », non « bâton ». La formulation distingue légèrement cette seconde expression de « demi-tribu » tout en restant naturelle.
- source_word: בְנֵי מְנַשֶּׁה
  choice: des descendants de Manassé
  rationale: Littéralement « fils de Manassé », cette expression de parenté désigne ici les membres de la tribu issus de Manassé. « Descendants » transmet sans ambiguïté ce sens collectif en français moderne.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחוֹת désigne les groupes familiaux constituant une tribu ; « clans » convient au cadre du partage tribal, et « selon » rend la valeur distributive de la préposition לְ.
