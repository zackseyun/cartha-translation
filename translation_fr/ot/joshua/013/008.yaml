id: JOS.13.8
reference: Joshua 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: fr
  text: Avec elle[a], les Rubénites et les Gadites reçurent leur héritage, celui que Moïse leur avait donné de l’autre côté du Jourdain, à l’est, comme le leur avait donné Moïse, serviteur de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Avec lui ». Le pronom renvoie probablement à la demi-tribu de Manassé mentionnée dans le contexte précédent.'
    reason: ambiguity
lexical_decisions:
- source_word: עִמּוֹ
  choice: Avec elle
  rationale: Le suffixe masculin singulier renvoie très probablement, dans le contexte précédent, à la demi-tribu de Manassé. Le féminin français s’accorde naturellement avec « demi-tribu », sans effacer l’implicite de l’hébreu.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: les Rubénites et les Gadites
  rationale: Les gentilés hébreux au singulier ont ici un sens collectif; le pluriel français désigne naturellement les membres des deux tribus.
- source_word: לָקְחוּ
  choice: reçurent
  rationale: Le verbe peut signifier « prendre » ou « recevoir ». Avec נַחֲלָה et dans le contexte d’une attribution territoriale, « reçurent » est idiomatique et n’implique pas une saisie autonome.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: « Héritage » conserve la portée territoriale et l’idée d’un bien attribué durablement, caractéristiques de נַחֲלָה.
- source_word: אֲשֶׁר נָתַן לָהֶם מֹשֶׁה
  choice: celui que Moïse leur avait donné
  rationale: Le plus-que-parfait rend clairement l’antériorité du don de Moïse par rapport au résumé narratif, tandis que « celui » rattache sans lourdeur la relative à « héritage ».
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: de l’autre côté du Jourdain, à l’est
  rationale: 'La formulation française rend l’expression géographique et sa précision directionnelle: il s’agit du côté oriental du Jourdain.'
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » conserve la valeur comparative ou confirmative de la conjonction sans surinterpréter le rapport entre les deux propositions.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: « Serviteur » rend le titre honorifique de Moïse, et « Yahweh » conserve le nom divin personnel représenté par le tétragramme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme; la translittération « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
- issue: Nature de l’acquisition de l’héritage
  choice: reçurent leur héritage
  alternative: prirent possession de leur héritage
  rationale: Dans ce contexte, le territoire est donné par Moïse. « Reçurent » met en évidence ce don sans exclure le sens lexical de prise ou d’entrée en possession.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « Moïse » et du verbe « donner » est maintenue parce qu’elle appartient à la structure emphatique de l’hébreu. Le passé simple convient au registre narratif biblique, tandis que le plus-que-parfait marque naturellement l’antériorité du don.
