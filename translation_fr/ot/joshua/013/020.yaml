lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: Beth-Péor
  rationale: Il s’agit d’un nom de lieu. La translittération, adaptée aux usages français, convient mieux qu’une traduction littérale comme « maison de Péor ».
- source_word: אַשְׁדּוֹת
  choice: versants
  rationale: Dans ce contexte topographique lié au Pisga, le terme désigne probablement les pentes ou déclivités de la montagne. « Versants » est naturel en français et préserve le caractère géographique de l’énumération.
- source_word: הַפִּסְגָּה
  choice: le Pisga
  rationale: Le terme fonctionne ici comme un nom géographique. L’article hébreu est rendu en français, où « le Pisga » est une désignation naturelle.
- source_word: בֵית הַיְשִׁמוֹת
  choice: Beth-Yeshimoth
  rationale: Ce nom de lieu est translittéré plutôt que traduit littéralement. La graphie avec trait d’union rend clairement son unité toponymique.
