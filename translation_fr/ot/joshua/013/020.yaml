translation_notes:
  register: Formulation concise et digne, adaptée à une liste géographique. Les noms propres sont translittérés selon des formes lisibles en français moderne. Le marqueur de note est placé après « Pisga », car l’ambiguïté porte sur le terme traduit par « versants », non sur Beth-Péor.
