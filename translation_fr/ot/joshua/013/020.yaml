  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: fr
  text: et Beth-Péor, les versants[a] du Pisga et Beth-Yeshimoth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sources » ou « les contreforts du Pisga ». Le terme hébreu peut recevoir plusieurs interprétations topographiques.
