  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: fr
  text: 'ainsi que toutes les villes du plateau[a] et tout le royaume de Sihôn, roi des Amorites, qui régnait à Heshbôn, que Moïse avait vaincu, lui et les chefs de Madian : Évi, Réqem, Tsour, Hour et Réba, les princes de Sihôn[c] qui habitaient le pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la plaine » ou « du haut plateau ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie deux termes de rang différents : « chefs de Madian » (נְשִׂיאֵי) et « princes de Sihôn » (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: les villes du plateau
  rationale: מִישׁוֹר désigne ici le pays plat ou haut plateau de Transjordanie. « Plateau » rend la topographie régionale avec naturel en français moderne.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: le royaume de Sihôn
  rationale: מַמְלְכוּת désigne le royaume ou domaine royal; « royaume » est direct et idiomatique.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: roi des Amorites
  rationale: Cette formulation conserve le rapport explicite de la chaîne construite hébraïque.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: qui régnait à Heshbôn
  rationale: מָלַךְ signifie spécifiquement régner ou exercer la royauté; l’imparfait convient à l’arrière-plan narratif.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: Moïse l’avait abattu
  rationale: Dans ce contexte militaire, נכה exprime une défaite décisive pouvant aller jusqu’à la mise à mort. Le pronom objet אֹתוֹ est naturellement rendu par « l’ ».
- source_word: נְשִׂיאֵי מִדְיָן
  choice: les chefs de Madian
  rationale: נָשִׂיא peut désigner un chef, un dirigeant ou un prince. « Chefs » permet de le distinguer du terme נְסִיכֵי employé ensuite.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: Évi, Réqem, Tsour, Hour et Réba
  rationale: Les noms propres sont translittérés en suivant des conventions lisibles en français tout en reflétant les formes hébraïques.
- source_word: נְסִיכֵי סִיחוֹן
  choice: princes de Sihôn
  rationale: נָסִיךְ désigne un prince ou dirigeant. « Princes » maintient la différence lexicale avec נְשִׂיאֵי, rendu par « chefs ».
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: qui habitaient le pays
  rationale: Le participe de ישׁב désigne ceux qui résident dans un territoire; « habitaient le pays » est clair, actuel et proche de la structure relative.
