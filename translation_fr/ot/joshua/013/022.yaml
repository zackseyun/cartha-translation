source:
  edition: WLC
  text: וְ/אֶת בִּלְעָ֥ם בֶּן בְּע֖וֹר הַ/קּוֹסֵ֑ם הָרְג֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בַּ/חֶ֖רֶב אֶל חַלְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: fr
  text: Les fils d’Israël tuèrent aussi par l’épée Balaam, fils de Béor, le devin, parmi leurs victimes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec leurs victimes ». L’expression hébraïque finale est inhabituelle; elle associe Balaam aux autres personnes tuées par Israël, sans préciser davantage la relation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: aussi
  rationale: Le waw ajoute Balaam aux personnes mentionnées dans le résumé de la conquête; la marque de l’objet direct אֵת n’a pas d’équivalent lexical distinct en français.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam, fils de Béor
  rationale: Les noms suivent l’usage français courant, et le patronyme hébreu est rendu directement.
- source_word: הַקּוֹסֵם
  choice: le devin
  rationale: קֹסֵם désigne celui qui pratique la divination. « Devin » est concis, actuel et garde la qualification appositive du texte.
- source_word: הָרְגוּ בְנֵי יִשְׂרָאֵל
  choice: Les fils d’Israël tuèrent
  rationale: La formulation conserve explicitement בְּנֵי, « fils », tout en adoptant l’ordre naturel de la phrase française.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Cette expression française rend l’emploi instrumental de la préposition et l’image hébraïque de la mise à mort au combat.
- source_word: אֶל חַלְלֵיהֶם
  choice: parmi ceux qu’ils avaient tués
  rationale: La locution inhabituelle associe Balaam aux autres morts causés par Israël. Le plus-que-parfait clarifie l’antériorité implicite sans effacer l’ambiguïté de la relation, signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Tuèrent » convient au registre narratif biblique sans être archaïque; « le devin » conserve la désignation négative liée à la divination. La syntaxe a été réordonnée pour être naturelle en français tout en maintenant tous les éléments du texte hébreu.
