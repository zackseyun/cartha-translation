  text: וּ/מֵ/חֶשְׁבּ֛וֹן עַד רָמַ֥ת הַ/מִּצְפֶּ֖ה וּ/בְטֹנִ֑ים וּ/מִֽ/מַּחֲנַ֖יִם עַד גְּב֥וּל לִדְבִֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: fr
  text: et depuis Heshbon jusqu’à Ramath-Mitspe et Betonim, et depuis Mahanaïm jusqu’à la frontière de Debir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à la frontière en direction de Debir ». Le lamed hébreu peut ici exprimer une orientation plutôt qu’une relation d’appartenance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵחֶשְׁבּוֹן
  choice: et depuis Heshbon
  rationale: Le waw coordonne ce segment au contexte précédent, tandis que la préposition מִן marque le point de départ. Le nom de lieu est translittéré.
- source_word: עַד
  choice: jusqu’à
  rationale: Dans une description de limites territoriales, עַד indique l’étendue atteinte; « jusqu’à » rend clairement cette valeur.
- source_word: רָמַת הַמִּצְפֶּה
  choice: Ramath-Mitspe
  rationale: L’expression fonctionne ici comme un toponyme. La translittération conserve le nom propre plutôt que de le traduire par « hauteur du poste d’observation ».
- source_word: וּבְטֹנִים
  choice: et Betonim
  rationale: Il s’agit d’un nom de lieu précédé de la conjonction; le toponyme est translittéré.
- source_word: וּמִמַּחֲנַיִם
  choice: et depuis Mahanaïm
  rationale: La conjonction et la préposition introduisent un nouveau point de départ. Le tréma aide à distinguer les voyelles dans la forme française du toponyme.
- source_word: גְּבוּל
  choice: la frontière
  rationale: Dans le contexte du partage territorial, גְּבוּל désigne une limite géographique; « frontière » est naturel et précis en français.
- source_word: לִדְבִר
  choice: de Debir
  rationale: Après גְּבוּל, le lamed peut exprimer le rapport entre la frontière et le lieu nommé. « La frontière de Debir » convient au contexte tout en laissant l’autre nuance possible en note.
