id: JOS.13.10
reference: Joshua 13:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: fr
  text: et toutes les villes de Sihon, roi des Amorites, qui régnait à Heshbon, jusqu’à la frontière des fils d’Ammon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des Ammonites ». Littéralement : « des fils d’Ammon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: et toutes
  rationale: La conjonction וְ rattache ce segment à la description territoriale précédente, tandis que כֹל en exprime la totalité.
- source_word: עָרֵי
  choice: les villes de
  rationale: Le pluriel construit de עִיר désigne ici les villes relevant de Sihon; « villes » convient au registre d’une liste territoriale.
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Le nom propre est translittéré directement de l’hébreu.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: roi des Amorites
  rationale: Cette formulation restitue naturellement le rapport construit et comprend le singulier collectif הָאֱמֹרִי comme désignant le peuple amorite.
- source_word: אֲשֶׁר מָלַךְ
  choice: qui régnait
  rationale: Le verbe מָלַךְ exprime l’exercice de la royauté; l’imparfait s’accorde naturellement en français avec cette caractérisation passée.
- source_word: בְּ/חֶשְׁבּוֹן
  choice: à Heshbon
  rationale: Avec une ville envisagée comme siège du règne, « à » est la tournure française la plus naturelle.
- source_word: עַד גְּבוּל
  choice: jusqu’à la frontière de
  rationale: עַד marque la limite atteinte par l’étendue territoriale.
- source_word: בְּנֵי עַמּוֹן
  choice: les fils d’Ammon
  rationale: La traduction conserve l’expression filiale littérale de l’hébreu, tandis que l’équivalent ethnique courant figure en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve sa fonction de continuation grâce au « et » initial. Le marqueur de note est placé après « fils d’Ammon », expression à laquelle la variante se rapporte.
