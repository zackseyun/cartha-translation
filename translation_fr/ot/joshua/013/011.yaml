  text: וְ/הַ/גִּלְעָ֞ד וּ/גְב֧וּל הַ/גְּשׁוּרִ֣י וְ/הַ/מַּעֲכָתִ֗י וְ/כֹ֨ל הַ֥ר חֶרְמ֛וֹן וְ/כָל הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: fr
  text: ainsi que Galaad, le territoire des Gueshuriens et des Maacathiens[a], tout le mont Hermon[b] et tout le Bashân jusqu’à Salka —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner une « frontière » ou une « limite ». Dans cette liste géographique, « territoire » convient probablement mieux.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « tout le mont Hermon » ; l’expression peut désigner l’ensemble du massif ou de la région montagneuse, et non seulement le sommet.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: Galaad
  rationale: Nom français traditionnel et courant de la région; l’article hébreu n’est pas repris devant ce nom propre.
- source_word: גְבוּל
  choice: territoire
  rationale: Dans cette énumération géographique, le terme désigne vraisemblablement l’étendue relevant de ces peuples plutôt que la seule ligne frontalière.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: des Gueshourites et des Maakatites
  rationale: Les gentilés singuliers hébreux ont ici une valeur collective. Le pluriel français désigne naturellement les peuples auxquels le territoire est rattaché.
- source_word: כֹל הַר חֶרְמוֹן
  choice: tout le mont Hermon
  rationale: Rend directement la formulation hébraïque tout en laissant ouverte la possibilité qu’il s’agisse de l’ensemble du massif.
- source_word: כָל הַבָּשָׁן
  choice: tout le Bashân
  rationale: Conserve l’idée d’étendue complète exprimée par כָל et emploie la forme française usuelle du nom régional.
- source_word: עַד סַלְכָה
  choice: jusqu’à Salka
  rationale: Exprime clairement la limite territoriale marquée par עַד; «Salka» est une translittération française lisible de סַלְכָה.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le caractère énumératif du contexte. Le tiret final signale que la phrase se poursuit. Une note est retenue pour l’étendue possible de «mont Hermon»; l’ambiguïté de גְבוּל est rendue dans le texte par le sens contextuellement probable «territoire», sans alourdir ce verset bref.
