source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֔ה לְ/מַטֵּ֥ה בְנֵֽי רְאוּבֵ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/015.yaml
  text: And Moses gave to the tribe of the sons of Reuben according to their clans:[a]
translation:
  language: fr
  text: Moïse donna à la tribu des fils de Ruben, selon leurs clans :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Rubénites ». L’hébreu dit littéralement « les fils de Ruben ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le wayyiqtol de נתן fait progresser le récit. En français, le passé simple exprime naturellement cette succession narrative sans qu’il soit nécessaire de rendre וַ par « et ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: לְמַטֵּה
  choice: à la tribu
  rationale: Dans le contexte du partage territorial, מַטֶּה désigne une tribu, et le préfixe לְ marque ici le bénéficiaire de l’attribution.
- source_word: בְנֵי רְאוּבֵן
  choice: des fils de Ruben
  rationale: Rend directement l’expression hébraïque de parenté tout en restant claire en français. « Rubénites » constitue une formulation idiomatique possible.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les subdivisions familiales de la tribu; « selon » restitue la valeur distributive de לְ dans cette formule d’attribution.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au registre biblique écrit sans être archaïque. « Clans » précise l’organisation interne de la tribu, tandis que la note donne l’équivalent collectif plus idiomatique.
