  text: וְ/לֹ֤א הוֹרִ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/גְּשׁוּרִ֖י וְ/אֶת הַ/מַּעֲכָתִ֑י וַ/יֵּ֨שֶׁב גְּשׁ֤וּר וּ/מַֽעֲכָת֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: fr
  text: Mais les Israélites ne chassèrent ni les Gueshourites ni les Maakatites. Gueshour et Maakat habitèrent au milieu d’Israël jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français naturel de l’expression hébraïque littérale « les fils d’Israël » lorsqu’elle désigne collectivement le peuple.
- source_word: הוֹרִישׁוּ
  choice: chassèrent
  rationale: Dans ce contexte territorial, le hiphil de ירש exprime l’expulsion ou la dépossession des habitants; « chasser » rend clairement l’action sans surinterprétation.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: les Gueshourites ... les Maakatites
  rationale: Les gentilés désignent les populations que les Israélites n’ont pas expulsées.
- source_word: וַיֵּשֶׁב
  choice: habitèrent
  rationale: Le singulier hébreu gouverne les deux noms collectifs Gueshour et Maakat; le pluriel français est naturel avec ce sujet composé et rend l’établissement durable.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: au milieu d’Israël
  rationale: Conserve l’image spatiale et communautaire de l’hébreu, plutôt que de la réduire à une simple proximité.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule narrative traditionnelle, claire et digne, qui préserve le point de vue temporel du rédacteur.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms propres suivent des translittérations françaises lisibles. Le verset conserve le contraste initial « Mais » et ne précise pas la nature politique ou ethnique de Gueshour et Maakat au-delà de ce qu’indique l’hébreu.
