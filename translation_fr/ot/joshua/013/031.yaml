source:
  edition: WLC
  text: וַ/חֲצִ֤י הַ/גִּלְעָד֙ וְ/עַשְׁתָּר֣וֹת וְ/אֶדְרֶ֔עִי עָרֵ֛י מַמְלְכ֥וּת ע֖וֹג בַּ/בָּשָׁ֑ן לִ/בְנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה לַ/חֲצִ֥י בְנֵֽי מָכִ֖יר לְ/מִשְׁפְּחוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: fr
  text: La moitié de Galaad, ainsi qu’Ashtaroth et Édréi, villes du royaume d’Og en Basan[a], revinrent aux fils de Makir, fils de Manassé — à la moitié des fils de Makir[b] —, selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « villes du royaume d’Og en Basan »; on pourrait aussi comprendre « villes royales d’Og en Basan ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « fils de Makir » peut désigner plus largement ses descendants; la traduction conserve toutefois la formulation familiale de l’hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: La moitié de Galaad
  rationale: Le syntagme désigne une moitié du territoire de Galaad. L’article hébreu n’est pas reproduit devant le nom propre, conformément à l’usage français. La conjonction initiale poursuit la liste précédente et est naturellement rendue par la coordination de la phrase.
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: Ashtaroth et Édréi
  rationale: Translittérations françaises claires des deux noms de lieux; l’accent d’Édréi facilite la prononciation française.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: villes du royaume d’Og en Basan
  rationale: Cette formulation suit directement la chaîne construite hébraïque sans décider qu’il s’agit nécessairement de capitales ou de résidences royales.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: revinrent aux fils de Makir, fils de Manassé
  rationale: La préposition ל marque ici l’attribution territoriale; « revinrent à » restitue naturellement la proposition nominale hébraïque. « Fils » conserve le langage généalogique du texte.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: à la moitié des fils de Makir
  rationale: La traduction garde la précision selon laquelle seule une moitié de la lignée de Makir est concernée, sans ajouter le mot « tribu », absent de l’hébreu.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte des répartitions territoriales, מִשְׁפָּחוֹת désigne des groupes généalogiques structurés; « clans » est plus précis que « familles » en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicite l’attribution territoriale implicite dans la proposition hébraïque, tout en maintenant les répétitions généalogiques et l’ambiguïté possible de « fils ».
