    text: 'Ou : « à recevoir en héritage ». Le verbe hébreu peut désigner la prise de possession d’un pays reçu en héritage.'
    reason: Alternative lexicale préservant la double nuance possible de ירשׁ.
  revision_rationale: La révision remplace « dont il faut prendre possession » par « à posséder ». Elle préserve ainsi la construction et la portée du texte source sans ajouter de modalité, tout en maintenant la note sur la nuance d’héritage.
