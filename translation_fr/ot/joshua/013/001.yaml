source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: fr
  text: 'Josué était vieux, avancé en âge. Yahweh lui dit : « Tu es vieux, avancé en âge, et il reste encore une très grande partie du pays à posséder[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à recevoir en héritage ». Le verbe hébreu peut désigner la prise de possession d’un pays reçu en héritage.'
    reason: Alternative lexicale préservant la double nuance possible de ירשׁ.
lexical_decisions:
- source_word: זָקֵן
  choice: était vieux
  rationale: Le terme décrit directement l’état de Josué. « Était vieux » est simple, naturel et fidèle, sans ajouter l’idée explicite d’un processus.
- source_word: בָּא בַּיָּמִים
  choice: avancé en âge
  rationale: L’expression idiomatique, littéralement « entré dans les jours », désigne un âge avancé. Cette tournure française moderne conserve ce sens sans archaïsme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אַתָּה זָקַנְתָּה בָּאתָ בַיָּמִים
  choice: Tu es vieux, avancé en âge
  rationale: La parole divine répète la description du narrateur. La traduction maintient cette répétition emphatique et rend l’état présent avec naturel.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte géographique et covenantal, « le pays » est une désignation française naturelle du territoire promis, tout en évitant de réduire le terme à une simple parcelle.
- source_word: נִשְׁאֲרָה
  choice: il reste encore
  rationale: Cette formulation rend l’idée de ce qui demeure non acquis. « Encore » explicite naturellement en français la valeur résiduelle du verbe.
- source_word: הַרְבֵּה מְאֹד
  choice: une très grande partie
  rationale: Avec « le pays », cette formulation idiomatique exprime la quantité considérable qui reste, tout en conservant la forte intensification de l’hébreu.
- source_word: לְרִשְׁתָּהּ
  choice: dont il faut prendre possession
  rationale: Le verbe ירשׁ exprime ici l’acquisition effective du pays. La construction française évite le peu naturel « reste à posséder » et garde la notion de prise de possession, tandis que la note signale la nuance possible d’héritage.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Portée de ירשׁ dans le contexte du pays
  choice: prendre possession
  alternative: recevoir en héritage
  rationale: Le contexte immédiat met l’accent sur le territoire qu’Israël doit encore acquérir. Comme le verbe peut aussi évoquer l’héritage, cette possibilité est conservée dans une note plutôt qu’exclue.
translation_notes:
  register: Français international moderne, clair et digne. La répétition entre le récit et la parole de Yahweh est conservée. La première coordination hébraïque est rendue par deux phrases afin d’éviter une longue chaîne de propositions tout en gardant la progression du verset.
