source:
  edition: WLC
  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: fr
  text: 'et, dans la vallée : Beth-Haram, Beth-Nimra, Soukkoth et Tsaphôn — le reste du royaume de Sihôn, roi de Heshbôn —, avec le Jourdain pour frontière jusqu’à l’extrémité de la mer de Kinnéreth[a], de l’autre côté du Jourdain, à l’est.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au bord de la mer de Kinnéreth »; dans ce contexte, il peut s’agir de son extrémité inférieure, c’est-à-dire méridionale.
    reason: L’expression קְצֵה יָם peut désigner le bord ou l’extrémité du lac; l’identification plus précise de l’extrémité méridionale repose sur le contexte géographique.
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: et, dans la vallée
  rationale: עֵמֶק désigne une vallée ou une région basse. « Dans la vallée » introduit naturellement la zone géographique où se trouvent les villes énumérées.
- source_word: בֵּית הָרָם וּ/בֵית נִמְרָה וְ/סֻכּוֹת וְ/צָפוֹן
  choice: Beth-Haram, Beth-Nimra, Soukkoth et Tsaphôn
  rationale: Ces noms de lieux sont translittérés selon des formes françaises claires. צָפוֹן est ici un toponyme, et non le nom commun « nord ».
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: le reste du royaume de Sihôn, roi de Heshbôn
  rationale: יֶתֶר signifie « reste » ou « partie restante », et מַמְלָכוּת désigne ici le royaume sur lequel régnait Sihôn.
- source_word: הַ/יַּרְדֵּן וּ/גְבֻל
  choice: le Jourdain servant de frontière
  rationale: L’hébreu est condensé et appositionnel. Cette formulation française explicite sobrement la fonction frontalière du Jourdain sans ajouter de détail territorial.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: jusqu’à l’extrémité de la mer de Kinnéreth[a]
  rationale: קְצֵה signifie « extrémité », « limite » ou « bord ». Le texte hébreu ne précise pas explicitement qu’il s’agit de l’extrémité inférieure ou méridionale; la traduction principale conserve donc cette indétermination.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: de l’autre côté du Jourdain, vers l’est
  rationale: Cette expression territoriale situe la région sur la rive orientale du Jourdain. « Vers l’est » préserve la valeur directionnelle de מִזְרָחָה.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation met en évidence l’apposition « le reste du royaume… » tout en gardant la continuité de la liste territoriale. Les noms propres suivent une translittération française cohérente.
