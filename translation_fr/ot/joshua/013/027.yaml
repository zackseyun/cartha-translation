  naturalness: La construction actuelle après l’incise (« —, le Jourdain servant… ») est lourde et sa coordination reste difficile à suivre. Une ponctuation qui introduit clairement la liste, puis rattache la frontière au territoire décrit, est plus naturelle en français moderne.
  terminology: Les formes Beth-Haram, Beth-Nimra, Soukkoth, Tsaphôn, Sihôn, Heshbôn et Kinnéreth sont cohérentes avec une translittération française. « Mer de Kinnéreth » préserve le nom hébreu sans lui substituer un nom postérieur.
