source:
  edition: WLC
  text: זֹ֛את נַחֲלַ֥ת בְּנֵי גָ֖ד לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/028.yaml
  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: fr
  text: 'Tel fut l’héritage des descendants de Gad, selon leurs clans : les villes et leurs villages.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tel est l’héritage des descendants de Gad, selon leurs clans : les villes et leurs villages. » La formule récapitulative hébraïque ne comporte pas de verbe exprimé et peut se rendre au présent ou au passé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Tel fut
  rationale: Le démonstratif féminin renvoie à la part territoriale décrite précédemment. Le passé convient naturellement à cette formule récapitulative en français, tandis que le présent reste possible.
- source_word: נַחֲלַת
  choice: l’héritage
  rationale: נַחֲלָה désigne ici la part de territoire attribuée en possession héréditaire; « héritage » conserve la portée foncière et l’arrière-plan de l’alliance.
- source_word: בְּנֵי גָד
  choice: des descendants de Gad
  rationale: L’expression hébraïque signifie littéralement « fils de Gad », mais désigne ici la tribu issue de Gad. « Descendants de Gad » rend clairement cet emploi collectif en français moderne.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Le לְ marque ici la répartition ou le classement, et מִשְׁפָּחוֹת désigne les groupes familiaux constituant la tribu.
- source_word: הֶעָרִים
  choice: les villes
  rationale: עָרִים est le terme courant pour les localités constituées dans les listes territoriales.
- source_word: וְחַצְרֵיהֶם
  choice: et les villages qui en dépendaient
  rationale: Dans les formules territoriales, חֲצֵרִים désigne souvent les établissements ruraux dépendant des villes. L’explicitation du rapport de dépendance évite que le possessif hébreu soit compris comme renvoyant aux descendants de Gad plutôt qu’aux villes.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Descendants de Gad » évite l’ambiguïté contemporaine de « fils de Gad », tandis que « clans » conserve le niveau d’organisation familiale du texte. La ponctuation présente « les villes et les villages » comme l’explicitation de l’héritage.
