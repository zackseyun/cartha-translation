  to: Tous les habitants de la région montagneuse, depuis le Liban jusqu’à Misrephoth-Maïm[a], tous les Sidoniens, c’est moi qui les chasserai devant les fils d’Israël[b]. Seulement, attribue ce territoire à Israël comme héritage[c], ainsi que je te l’ai ordonné.
