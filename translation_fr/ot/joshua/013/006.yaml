    issue: « Mais toi » pour רַק
    rationale: La conjonction française met fortement en relief l’opposition entre Dieu et Josué; רַק exprime plus exactement une limitation ou réserve. « Seulement » conserve cette valeur sans perdre l’adresse à Josué, portée par l’impératif singulier.
  - severity: medium
    issue: « patrimoine » pour נַחֲלָה
    rationale: Bien que possible, « patrimoine » est moins spécifique pour une part de territoire reçue en héritage et moins stable dans le lexique biblique français. « Héritage » rend directement le sens de נַחֲלָה dans ce contexte.
