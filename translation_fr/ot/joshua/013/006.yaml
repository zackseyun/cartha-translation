reference: Joshua 13:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: fr
  text: Tous les habitants de la région montagneuse, depuis le Liban jusqu’à Misrephoth-Maïm[a], tous les Sidoniens, c’est moi qui les chasserai devant les fils d’Israël[b]. Seulement, attribue ce territoire à Israël comme héritage[c], ainsi que je te l’ai ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrephoth-Maïm est un nom de lieu. Il pourrait signifier quelque chose comme « brûlures des eaux », mais son sens exact est incertain.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction : « je les déposséderai devant les fils d’Israël ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie ici une expression liée au fait de faire tomber le sort, c’est-à-dire d’attribuer le territoire par tirage au sort.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: les habitants de la région montagneuse
  rationale: Dans ce contexte territorial, הָהָר désigne une région de relief plutôt qu’une montagne isolée. Cette formulation est naturelle en français et conserve la portée géographique.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: depuis le Liban jusqu’à Misrephoth-Maïm
  rationale: Les deux termes sont traités comme des noms de lieux. Le second est translittéré, car son étymologie et son sens exact demeurent incertains.
- source_word: כָּל צִידֹנִים
  choice: tous les Sidoniens
  rationale: La formule désigne collectivement la population sidonienne et conserve la force totalisante de כָּל.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: c’est moi qui les chasserai
  rationale: La tournure clivée rend l’insistance du pronom indépendant אָנֹכִי. Le hiphil de ירשׁ exprime ici l’expulsion ou la dépossession des habitants.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: devant les fils d’Israël
  rationale: Cette traduction conserve l’image relationnelle de l’hébreu et la formulation filiale explicite de בְּנֵי יִשְׂרָאֵל.
- source_word: רַק
  choice: Mais toi
  rationale: 'Dans le contexte, רַק introduit une restriction assortie d’un contraste pratique : Dieu chassera les habitants, tandis que Josué doit attribuer le territoire. « Mais toi » exprime naturellement ce mouvement en français.'
- source_word: הַפִּלֶהָ
  choice: attribue ce pays par le sort
  rationale: Le hiphil de נפל appartient ici à l’idiome de la répartition par tirage au sort. Le pronom féminin renvoie au territoire; l’explicitation « ce pays » évite une référence pronominale ambiguë en français.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: à Israël comme patrimoine
  rationale: נַחֲלָה désigne un bien foncier transmis et durablement possédé. « Patrimoine » rend cette nuance en français sans suggérer que chaque bénéficiaire reçoit le pays par succession après un décès.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: ainsi que je te l’ai ordonné
  rationale: Le passé composé renvoie naturellement à un ordre antérieur qui demeure en vigueur, et le tutoiement correspond à l’adresse singulière à Josué.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: L’expression source est explicitement filiale. La traduction la conserve sans neutralisation, tout en restant idiomatique dans le registre biblique français.
- issue: Traduction de נַחֲלָה dans le contexte du partage du pays
  choice: patrimoine
  alternative: héritage / possession
  rationale: « Patrimoine » maintient l’idée d’un territoire attribué comme bien durable et transmissible. « Héritage » est possible, mais peut évoquer plus directement en français moderne une succession consécutive à un décès.
- issue: Rapport entre la promesse divine et l’ordre donné à Josué
  choice: c’est moi qui les chasserai… Mais toi, attribue
  alternative: je les déposséderai… seulement, fais-en le partage
  rationale: La formulation préserve la tension du texte entre l’action promise par Dieu et la responsabilité confiée à Josué, sans expliquer ni harmoniser leur articulation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la parole divine sans archaïsmes inutiles. « Région montagneuse » précise la valeur territoriale de הָהָר; « c’est moi qui » porte l’emphase divine; « Mais toi » fait entendre l’adresse singulière à Josué et le contraste avec l’action de Dieu.
