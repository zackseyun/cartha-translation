  text: כָּל מַמְלְכ֥וּת עוֹג֙ בַּ/בָּשָׁ֔ן אֲשֶׁר מָלַ֥ךְ בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶ֑עִי ה֤וּא נִשְׁאַר֙ מִ/יֶּ֣תֶר הָ/רְפָאִ֔ים וַ/יַּכֵּ֥/ם מֹשֶׁ֖ה וַ/יֹּרִשֵֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: fr
  text: tout le royaume d’Og dans le Bashân, lui qui régnait à Ashtaroth et à Édréi. Il était l’un des derniers Rephaïm[a]. Moïse les vainquit et les déposséda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « géants ». Le mot hébreu « Rephaïm » désigne probablement un ancien peuple.
    reason: Alternative lexicale et clarification d’un nom de groupe peu connu.
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: tout le royaume d’Og dans le Bashân
  rationale: כָּל avec le singulier מַמְלְכוּת désigne la totalité du royaume. La préposition בְּ a ici son sens géographique ordinaire, rendu par « dans ».
- source_word: אֲשֶׁר מָלַךְ
  choice: lui qui régnait
  rationale: « Régnait » conserve la nuance royale de מלך; « lui » rattache clairement la relative à Og malgré le groupe nominal précédent.
- source_word: בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: à Ashtaroth et à Édréi
  rationale: Pour des noms de villes, « à » est l’expression française naturelle de la localisation marquée par בְּ.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: Il était l’un des derniers Rephaïm
  rationale: Cette formulation française naturelle exprime qu’Og subsistait parmi ce qui restait des Rephaïm, sans ajouter qu’il était absolument le seul survivant.
- source_word: וַיַּכֵּם מֹשֶׁה
  choice: Moïse les vainquit
  rationale: Dans ce contexte militaire, נכה signifie frapper ou défaire. « Vainquit » restitue naturellement l’action et conserve l’objet pluriel du suffixe hébreu.
- source_word: וַיֹּרִשֵׁם
  choice: et les déposséda
  rationale: Le hifil de ירשׁ signifie ici priver les adversaires de leur possession; « déposséda » en garde la précision.
theological_decisions:
- issue: Sens de רְפָאִים
  choice: Rephaïm
  alternative: géants
  rationale: Le terme hébreu peut désigner un ancien groupe humain et ne doit pas être réduit dans le texte à une description interprétative de sa stature. La translittération préserve les rapprochements avec les autres passages et l’ambiguïté du terme.
translation_notes:
  register: Français international moderne, digne et lisible. Les toponymes suivent des formes françaises bibliques reconnaissables. La reprise « lui qui » évite que la relative soit comprise comme qualifiant le Bashân, et la division en deux phrases allège une longue construction hébraïque.
