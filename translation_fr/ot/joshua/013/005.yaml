base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: fr
  text: le pays des Guibliens, tout le Liban du côté du soleil levant, depuis Baal-Gad, au-dessous du mont Hermon, jusqu’à Lebo-Hamath[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à l’entrée de Hamath ». L’hébreu peut être compris comme une expression géographique descriptive plutôt que comme un nom de lieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: le territoire des Guiblites
  rationale: Dans cette énumération géographique, « territoire » rend naturellement הָאָרֶץ, tandis que « Guiblites » conserve le gentilé lié à Guébal.
- source_word: וְכָל הַלְּבָנוֹן
  choice: tout le Liban
  rationale: Rend directement la totalité exprimée par כָל dans un français géographique naturel.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: du côté du soleil levant
  rationale: Conserve l’image hébraïque du lever du soleil tout en exprimant clairement l’orientation vers l’est.
- source_word: מִבַּעַל גָּד
  choice: depuis Baal-Gad
  rationale: Le nom de lieu est translittéré; « depuis » marque naturellement le point de départ de la limite.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: au-dessous du mont Hermon
  rationale: Préserve la relation spatiale assez générale de תַּחַת sans préciser davantage la topographie par « au pied de ».
- source_word: עַד לְבוֹא חֲמָת
  choice: jusqu’à Lebo-Hamath[a]
  rationale: La lecture comme nom de lieu convient à la fonction de borne géographique; l’autre analyse possible est conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve l’image du « soleil levant » et maintient l’ambiguïté de לְבוֹא חֲמָת en note. La virgule finale reflète le fait que le verset s’insère dans une énumération continue.
