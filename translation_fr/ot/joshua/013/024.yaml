  text: וַ/יִּתֵּ֤ן מֹשֶׁה֙ לְ/מַטֵּה גָ֔ד לִ/בְנֵי גָ֖ד לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/024.yaml
  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: fr
  text: Moïse donna à la tribu de Gad, aux fils de Gad, selon leurs clans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Dans ce contexte de partage territorial, נתן exprime l’action de donner ou d’attribuer. « Donna » reste direct et conserve, comme l’hébreu, l’objet implicite.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: לְמַטֵּה
  choice: au clan de
  rationale: מַטֶּה désigne ici l’unité tribale, non un bâton. « Clan » évite la répétition maladroite de « tribu » tout en introduisant une nuance moins précise que le terme source; toutefois, dans la formule d’allotissement, « tribu » serait plus exact.
- source_word: גָד
  choice: Gad
  rationale: Translittération française usuelle du nom propre גָד.
- source_word: לִבְנֵי
  choice: aux fils de
  rationale: Rend littéralement בְּנֵי tout en préservant l’expression généalogique tribale de l’hébreu; dans ce contexte, elle englobe les descendants ou membres du groupe.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs familles
  rationale: מִשְׁפָּחָה désigne les subdivisions familiales ou claniques de la tribu. « Selon leurs familles » rend naturellement la valeur distributive de la préposition.
