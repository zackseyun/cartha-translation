source:
  edition: WLC
  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: fr
  text: Leur territoire s’étendait depuis Aroër, au bord de la vallée de l’Arnon[a], et comprenait la ville située au milieu de la vallée, ainsi que tout le plateau[b] jusqu’à Médeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au bord du torrent de l’Arnon » ou « de l’oued de l’Arnon ». Le mot hébreu peut désigner une vallée encaissée, le lit d’un torrent ou un oued.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute la plaine élevée »; le terme hébreu désigne un pays plat, ici sur les hauteurs de Transjordanie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Leur territoire s’étendait
  rationale: Dans cette description territoriale, cette formulation française naturelle rend la portée de « la frontière était pour eux » sans donner à penser qu’une frontière physique comprendrait elle-même des villes.
- source_word: מֵעֲרוֹעֵר
  choice: depuis Aroër
  rationale: La préposition מִן indique ici le point de départ de l’étendue territoriale; le nom de lieu est translittéré.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: au bord de la vallée de l’Arnon
  rationale: שׂפה désigne le bord ou la rive. נחל peut désigner une vallée encaissée, le lit d’un torrent ou un oued; « vallée » convient au contexte géographique tout en laissant l’alternative en note.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: et comprenait la ville située au milieu de la vallée
  rationale: בְּתוֹךְ exprime une position à l’intérieur ou au milieu. L’ajout contextuel de « comprenait » rend en français la coordination hébraïque dans une liste de possessions territoriales.
- source_word: וְכָל הַמִּישֹׁר
  choice: ainsi que tout le plateau
  rationale: מִישׁוֹר désigne ici le pays plat et élevé de Transjordanie; « plateau » est plus précis que le simple « plaine ».
- source_word: עַל מֵידְבָא
  choice: jusqu’à Médeba
  rationale: Dans une délimitation territoriale, עַל peut indiquer l’extension jusqu’à un lieu ou dans sa direction; « jusqu’à » exprime clairement cette limite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe hébraïque coordonne le point de départ, la ville et le plateau; la formulation « s’étendait… et comprenait » explicite naturellement leur rapport au territoire sans modifier les éléments géographiques.
