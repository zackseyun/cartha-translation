source:
  edition: WLC
  text: וַ/יְהִ֗י גְּבוּל֙ בְּנֵ֣י רְאוּבֵ֔ן הַ/יַּרְדֵּ֖ן וּ/גְב֑וּל זֹ֣את נַחֲלַ֤ת בְּנֵֽי רְאוּבֵן֙ לְ/מִשְׁפְּחֹתָ֔/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: fr
  text: 'Le Jourdain formait la frontière des descendants de Ruben[a]. Tel fut l’héritage des descendants de Ruben, selon leurs clans : les villes et leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le Jourdain et la frontière ». Cette expression hébraïque concise peut aussi se comprendre : « le Jourdain comme frontière ».'
    reason: L’hébreu présente une construction compacte dont le rapport exact entre « le Jourdain » et « frontière » demeure ambigu.
lexical_decisions:
- source_word: וַיְהִי גְּבוּל
  choice: La frontière … était
  rationale: Dans cette formule récapitulative de délimitation, היה indique ce qui constituait la frontière plutôt qu’un changement d’état.
- source_word: בְּנֵי רְאוּבֵן
  choice: les descendants de Ruben
  rationale: « Descendants » restitue naturellement l’expression généalogique hébraïque sans suggérer qu’il s’agit uniquement des fils immédiats de Ruben.
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: le Jourdain, qui en constituait la limite
  rationale: La formule hébraïque compacte identifie vraisemblablement le Jourdain comme ligne de démarcation. La note conserve l’ambiguïté formelle de l’expression.
- source_word: נַחֲלַת
  choice: l’héritage
  rationale: Terme usuel et théologiquement non restrictif pour la part territoriale attribuée à une tribu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre des répartitions tribales, מִשְׁפָּחוֹת désigne les subdivisions claniques plutôt que les seules familles nucléaires.
- source_word: הֶעָרִים וְחַצְרֵיהֶן
  choice: les villes avec les villages qui en dépendaient
  rationale: חֲצֵרִים désigne ici les localités rurales ou non fortifiées rattachées aux villes; la formulation française explicite ce rapport de dépendance.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la formule territoriale hébraïque, tandis que « descendants », « clans » et « villages qui en dépendaient » rendent clairement les réalités tribales et géographiques.
