  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: fr
  text: Du sud, tout le pays des Cananéens, et Méara[a], qui appartient aux Sidoniens, jusqu’à Afek, jusqu’à la frontière des Amorites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la grotte qui appartient aux Sidoniens », si מְעָרָה est compris comme un nom commun plutôt que comme un nom de lieu.
    reason: lexical_alternative
  - marker: b
    text: En hébreu, « le Cananéen » et « l’Amorite » sont au singulier, avec une valeur collective ; ils sont rendus ici au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: depuis le sud
  rationale: תֵּימָן désigne couramment le sud ou la région méridionale. Dans cette délimitation territoriale, le sens géographique convient mieux que le nom propre « Témân ».
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: tout le pays des Cananéens
  rationale: L’hébreu dit littéralement « tout le pays du Cananéen », avec un singulier ethnique à valeur collective. Le pluriel français exprime naturellement cette valeur sans remplacer l’expression par « pays de Canaan ».
- source_word: וּמְעָרָה
  choice: ainsi que Méara
  rationale: Dans cette liste territoriale, מְעָרָה est probablement un toponyme. La translittération « Méara » évite de trancher silencieusement en faveur du nom commun « grotte », signalé en note comme autre lecture possible.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: qui appartient aux Sidoniens
  rationale: La préposition ל indique ici l’appartenance ou le rattachement. Cette formulation est naturelle en français moderne.
- source_word: עַד אֲפֵקָה
  choice: jusqu’à Afek
  rationale: עַד marque la limite ou l’étendue jusqu’à un point donné. Le suffixe directionnel du toponyme est naturellement rendu par « jusqu’à ».
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: jusqu’à la frontière des Amorites
  rationale: גְּבוּל désigne ici une frontière ou une limite territoriale. Le singulier ethnique hébreu הָאֱמֹרִי a une valeur collective, rendue naturellement par le pluriel français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la structure de la délimitation territoriale et la répétition de « jusqu’à ». Les ethnonymes sont rendus par des pluriels collectifs naturels en français.
