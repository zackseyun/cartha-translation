base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: fr
  text: Voici ce que Moïse attribua en héritage dans les plaines de Moab, au-delà du Jourdain[a], à l’est de Jéricho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’autre côté du Jourdain ». L’expression hébraïque est une formule géographique dont la traduction peut varier selon le point de vue adopté.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Voilà les territoires que
  rationale: La construction introduit un récapitulatif de ce qui vient d’être réparti. Le nom « territoires », explicité d’après le contexte immédiat de la distribution des terres, rend la phrase naturelle en français.
- source_word: נִחַל
  choice: attribua en héritage
  rationale: La forme causative de נחל désigne ici l’attribution de terres comme possession héréditaire; cette formulation conserve à la fois l’idée de répartition et celle d’héritage.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom propre.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: dans les plaines de Moab
  rationale: עֲרָבוֹת désigne les plaines ou steppes de cette région; « plaines de Moab » est l’expression géographique française claire et traditionnelle.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: au-delà du Jourdain
  rationale: Cette formule géographique courante préserve la perspective relative de l’hébreu sans la préciser davantage; la suite indique le côté concerné.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: à l’est de Jéricho
  rationale: Le locatif directionnel מִזְרָחָה situe la région du Jourdain par rapport à Jéricho; cette formulation est idiomatique et géographiquement claire en français.
