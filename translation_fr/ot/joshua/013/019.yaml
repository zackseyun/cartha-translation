lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: Qiryataïm
  rationale: Nom de lieu translittéré selon des conventions françaises modernes; le tréma signale que « aï » se prononce en deux syllabes.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Nom de lieu translittéré; שׂ est rendu par « s », et le h final non prononcé n’est pas conservé.
- source_word: צֶרֶת הַשַּׁחַר
  choice: Tséreth-Shahar
  rationale: L’expression est comprise comme un toponyme composé dans cette liste de villes et reste donc translittérée plutôt que traduite sémantiquement.
- source_word: בְּהַר הָעֵמֶק
  choice: sur la colline de la vallée
  rationale: La préposition ב est locative; « colline » convient ici au relief local, et le rapport construit avec « vallée » est conservé.
