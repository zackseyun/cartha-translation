source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: fr
  text: Leur territoire comprenait Yazer, toutes les villes du Galaad et la moitié du pays des Ammonites, jusqu’à Aroër, qui se trouve en face de Rabba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui fait face à Rabba ». L’expression hébraïque signifie littéralement « qui est devant Rabba ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Leur territoire comprenait
  rationale: גְּבוּל peut désigner une frontière ou, par extension, le territoire délimité. Comme la proposition introduit une liste de lieux appartenant au lot tribal, « territoire » exprime naturellement le sens, et « comprenait » permet d’intégrer cette liste en français courant.
- source_word: יַעְזֵר
  choice: Yazer
  rationale: Transcription française courante du nom de lieu hébreu.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: toutes les villes du Galaad
  rationale: עָרִים désigne des villes ou des localités. « Villes » convient au registre d’une liste territoriale, tandis que « Galaad » est la forme française traditionnelle du toponyme.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: et la moitié du pays des Ammonites
  rationale: בְּנֵי עַמּוֹן est l’expression ethnogéographique usuelle pour les Ammonites. Dans ce contexte territorial, אֶרֶץ est naturellement rendu par « pays ».
- source_word: עַד
  choice: jusqu’à
  rationale: La préposition marque ici la limite géographique du territoire.
- source_word: עֲרוֹעֵר
  choice: Aroër
  rationale: Transcription française usuelle du nom de lieu, avec le tréma qui distingue les deux voyelles.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: qui se trouve en face de Rabba
  rationale: L’expression עַל־פְּנֵי indique une relation spatiale pouvant signifier « devant », « en face de » ou « faisant face à ». La traduction retenue reste géographique sans préciser une direction absente de l’hébreu.
