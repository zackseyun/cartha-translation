  text: from Aroer, which is on the edge of the Arnon Valley, and the city that is in the middle of the valley, and all the tableland from Medeba to Dibon,
translation:
  language: fr
  text: depuis Aroër, qui est au bord de la vallée de l’Arnon, ainsi que la ville située au milieu de la vallée, et tout le plateau, depuis Médeba jusqu’à Dibôn,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: au bord de la vallée de l’Arnon
  rationale: שׂפה désigne le bord ou la rive; נחל peut désigner le cours d’eau ou la vallée qu’il parcourt. «Au bord de la vallée» conserve ici la formulation géographique de la source et l’ambiguïté du terme נחל.
- source_word: הָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: la ville située au milieu de la vallée
  rationale: Traduction naturelle de la proposition relative, sans préciser l’identité de la ville ni résoudre davantage la topographie.
- source_word: הַמִּישֹׁר
  choice: le plateau
  rationale: Dans ce contexte territorial transjordanien, le terme désigne la région plane et élevée, couramment rendue par «plateau».
