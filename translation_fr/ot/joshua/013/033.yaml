source:
  edition: WLC
  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: fr
  text: 'Mais à la tribu de Lévi, Moïse ne donna pas d’héritage[a] : Yahweh, le Dieu d’Israël, est leur héritage, comme il le leur avait dit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit deux fois par « héritage » peut aussi se rendre par « part ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: Mais à la tribu de Lévi
  rationale: La conjonction introduit ici un contraste avec les attributions territoriales précédentes. « Tribu de Lévi » désigne naturellement l’ensemble tribal.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: Moïse ne donna pas d’héritage
  rationale: Cette formulation conserve l’action passée et le sens territorial et alliancé de נַחֲלָה, tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu qui emploie le tétragramme.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette tournure française courante préserve l’identification relationnelle et historique du texte.
- source_word: הוּא נַחֲלָתָם
  choice: est leur héritage
  rationale: La proposition maintient l’affirmation explicite selon laquelle Yahweh lui-même constitue l’héritage des Lévites, et reprend le même terme qu’au début du verset.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: comme il le leur avait dit
  rationale: « Dire » rend naturellement דִּבֶּר sans renforcer le sens en « promettre ». Le plus-que-parfait exprime l’antériorité implicite de cette parole.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Yahvé
  rationale: Le texte donne le nom personnel divin. La translittération le préserve au lieu de lui substituer un titre.
- issue: Nature de l’héritage de Lévi
  choice: Yahweh lui-même est leur héritage
  alternative: Yahweh est leur part
  rationale: La traduction conserve l’identification théologique directe et la tension métaphorique du texte, sans la réduire à des privilèges sacerdotaux ou à une simple attribution matérielle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le contraste initial, tandis que les deux emplois apparentés de נַחֲלָה sont rendus uniformément par « héritage » afin de préserver le lien rhétorique et théologique.
