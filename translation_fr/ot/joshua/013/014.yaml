base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: fr
  text: 'Seulement, il ne donna aucun héritage à la tribu de Lévi : les offrandes consumées par le feu pour Yahvé, le Dieu d’Israël, constituent son héritage[a], comme il le lui avait dit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains comprennent, à la lumière de passages voisins : « Yahvé, le Dieu d’Israël, est son héritage. »'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: Mais
  rationale: Dans ce contexte, la particule introduit l’exception à la répartition précédente; « Mais » exprime naturellement ce contraste en français.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: à la tribu de Lévi
  rationale: Rend directement le complément du verbe « donner » et conserve le nom tribal traditionnel.
- source_word: לֹא נָתַן נַחֲלָה
  choice: il ne donna aucun héritage
  rationale: Traduction directe de la négation, du verbe et de l’objet; « héritage » convient au contexte du partage territorial.
- source_word: אִשֵּׁי יְהוָה
  choice: les offrandes consumées par le feu pour Yahvé
  rationale: Préserve le rapport lexical au feu dans אִשֵּׁי et indique clairement que les offrandes sont destinées à Yahvé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend naturellement la chaîne construite, en apposition à Yahvé.
- source_word: הוּא נַחֲלָתוֹ
  choice: constituent son héritage
  rationale: Rattache le pronom à l’antécédent immédiat, les offrandes, tout en formulant naturellement en français leur fonction d’héritage.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: comme il le lui avait dit
  rationale: Conserve le sens concret de « parler/dire » sans l’interpréter comme « promettre »; le plus-que-parfait situe naturellement cette parole avant le partage décrit.
theological_decisions:
- issue: Nature de l’héritage de Lévi
  choice: les offrandes consumées par le feu pour Yahvé constituent son héritage
  alternative: Yahvé, le Dieu d’Israël, est son héritage
  rationale: La lecture principale suit l’antécédent syntaxique immédiat, אִשֵּׁי יְהוָה. Une autre compréhension, favorisée par des passages voisins, prend Yahvé lui-même comme héritage; la note préserve cette tension sans harmoniser le texte.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la syntaxe hébraïque tout en évitant une tournure artificielle; le singulier collectif renvoie à la tribu de Lévi.
