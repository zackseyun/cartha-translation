revisions:
- from: 'depuis le Shihor, qui se trouve à l’est de l’Égypte[a], jusqu’à la frontière d’Éqron, au nord — ce territoire est considéré comme cananéen —, ainsi que les territoires des cinq chefs[b] des Philistins : celui de Gaza, celui d’Ashdod, celui d’Ascalon, celui de Gath et celui d’Éqron, et le territoire des Avviens[c].'
  to: 'depuis le Shihor, qui est en face de l’Égypte[a], jusqu’à la frontière d’Éqron, vers le nord — ce territoire est compté comme cananéen — : les cinq chefs[b] des Philistins, celui de Gaza, celui d’Ashdod, celui d’Ascalon, celui de Gath et celui d’Éqron, ainsi que les Avviens.'
  rationale: La révision retire les ajouts territoriaux qui modifiaient l’énumération hébraïque, rend les Avviens comme le groupe explicitement nommé, et remplace l’orientation interprétative « à l’est » par une formulation française fidèle à l’ambiguïté de l’original. Elle conserve l’explicitation minimale « ce territoire » pour le référent implicite de « est compté comme cananéen », sans en faire une affirmation ethnique au sujet des Philistins.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:09:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction doit conserver le caractère elliptique de l’énumération hébraïque. Le texte ne dit ni « territoires » pour les cinq cités ni « le territoire des Avviens » : il énumère les cinq dirigeants philistins, puis « les Avviens ». De plus, עַל־פְּנֵי מִצְרַיִם signifie littéralement « en face de l’Égypte »; « à l’est » est une interprétation géographique plausible, mais non explicite.'
  naturalness: « En face de l’Égypte » et « jusqu’à la frontière d’Éqron, vers le nord » sont naturels en français moderne tout en évitant de surdéterminer l’orientation. La reprise « celui de » rend avec clarté les cinq désignations de chefs sans transformer les gentilés en territoires.
  terminology: « Chefs » convient pour סַרְנֵי, titre distinctif des dirigeants philistins, à condition que la note le précise. Les formes Shihor, Éqron, Gaza, Ashdod, Ascalon, Gath et Avviens sont recevables. « compté comme cananéen » rend directement תֵּחָשֵׁב לַכְּנַעֲנִי sans assimiler les Philistins aux Cananéens.
  issues:
  - severity: medium
    issue: Ajout de « les territoires » et de « le territoire des Avviens »
    rationale: L’hébreu énumère les cinq chefs philistins par leurs gentilés, puis ajoute « et les Avviens ». L’explicitation territoriale modifie la référenciation de ces syntagmes et la note ne remédie pas à cette modification.
  - severity: medium
    issue: « à l’est de l’Égypte » est présenté dans le texte courant comme non ambigu
    rationale: L’expression עַל־פְּנֵי מִצְרַיִם est littéralement « en face de l’Égypte ». Le sens oriental est défendable dans ce contexte, mais demeure une interprétation; le texte français peut préserver l’ambiguïté.
  - severity: low
    issue: Ponctuation et liaison syntaxique de l’énumération
    rationale: « ainsi que les territoires » rattache artificiellement l’énumération à la borne géographique. Un երկու-points après l’incise introduit plus fidèlement la liste elliptique.
