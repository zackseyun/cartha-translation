source:
  edition: WLC
  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: fr
  text: 'depuis le Shihor, qui est en face de l’Égypte[a], jusqu’à la frontière d’Éqron, vers le nord — ce territoire est compté comme cananéen — : les cinq chefs[b] des Philistins, celui de Gaza, celui d’Ashdod, celui d’Ascalon, celui de Gath et celui d’Éqron, ainsi que les Avviens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui est devant l’Égypte » ou « en face de l’Égypte ». Dans ce contexte géographique, l’expression est souvent comprise comme désignant le côté oriental de l’Égypte.'
    reason: Préserve dans le texte la formulation non directionnelle explicite de l’hébreu tout en signalant l’interprétation géographique courante.
  - marker: b
    text: Le terme hébreu désigne le titre particulier porté par les dirigeants des cinq principales cités philistines.
    reason: Précise la valeur institutionnelle de סַרְנֵי sans imposer un titre politique plus précis.
lexical_decisions:
- source_word: שִׁיחוֹר
  choice: Shihor
  rationale: Transcription du nom propre traditionnel, sans identification conjecturale avec un cours d’eau précis.
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: à l’est de l’Égypte
  rationale: Dans cette indication géographique, l’expression « devant l’Égypte » désigne vraisemblablement son côté oriental; une note conserve toutefois le sens plus littéral.
- source_word: סַרְנֵי
  choice: chefs
  rationale: Titre propre aux dirigeants des cités philistines; « chefs » est naturel et n’impose ni le statut de roi ni celui de prince.
- source_word: הָעַזָּתִי ... הָעֶקְרוֹנִי
  choice: celui de Gaza… celui d’Éqron
  rationale: Les gentilés hébreux désignent ici chacun des cinq chefs par sa cité; cette formulation est claire et naturelle en français.
- source_word: עַוִּים
  choice: Avviens
  rationale: Transcription française transparente du nom de ce peuple, sans l’identifier à un autre groupe.
theological_decisions:
- issue: Portée de « considéré comme cananéen »
  choice: ce territoire est considéré comme cananéen
  alternative: elle est comptée comme appartenant aux Cananéens
  rationale: Le contexte énumère des terres encore à conquérir. « Ce territoire » explicite seulement le référent implicite sans assimiler ethniquement les Philistins aux Cananéens.
- issue: Rapport des Avviens avec les cinq chefs philistins
  choice: et le territoire des Avviens
  alternative: et les Avviens
  rationale: Le texte associe les Avviens à l’énumération mais ne dit pas qu’ils relèvent d’un sixième chef philistin; la formulation les maintient comme groupe distinct dans la liste territoriale.
translation_notes:
  register: Français international moderne, clair et digne. Les noms suivent des formes françaises usuelles (Égypte, Gaza, Ashdod, Ascalon, Gath) et des transcriptions lisibles pour Shihor, Éqron et Avviens. L’ajout de « territoires » rend cohérente en français l’énumération elliptique des régions encore à prendre, tout en étant signalé lorsque l’hébreu reste plus bref.
