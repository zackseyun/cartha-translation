  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: fr
  text: 'Ils dirent à Josué : « En effet, le SEIGNEUR a livré tout le pays entre nos mains, et tous les habitants du pays ont perdu courage devant nous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: Ici, la particule introduit une affirmation assurée qui résume le rapport des espions ; « Oui » rend naturellement cette valeur emphatique en français.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: a livré ... entre nos mains
  rationale: L’expression idiomatique hébraïque décrit le fait de remettre un territoire au pouvoir de quelqu’un ; cette formulation française conserve l’image des « mains » et la valeur de victoire accordée.
- source_word: נָמֹגוּ
  choice: tremblent
  rationale: Le verbe évoque littéralement le fait de fondre ou de se dissoudre sous l’effet de la peur. Dans ce contexte, « tremblent » transmet clairement la terreur et l’effondrement du courage sans produire une image peu naturelle en français.
- source_word: מִפָּנֵינוּ
  choice: devant nous
  rationale: Rend directement l’expression relationnelle hébraïque, ici avec le sens de peur suscitée par l’approche d’Israël.
theological_decisions:
- issue: Nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La forme en petites capitales suit l’usage français largement reconnu pour signaler le tétragramme, sans imposer une vocalisation reconstruite.
- issue: Aspect de נָתַן
  choice: a livré
  alternative: livrera
  rationale: Le parfait hébreu présente le don du pays comme acquis dans la conviction des espions, bien que la conquête reste à réaliser ; le passé composé préserve cette tension entre assurance divine et accomplissement historique.
translation_notes:
  register: Français moderne, courant et digne. La phrase garde le parallélisme du rapport hébreu et son ton d’assurance. « Tout le pays » est conservé dans les deux propositions, conformément à la répétition du texte source.
