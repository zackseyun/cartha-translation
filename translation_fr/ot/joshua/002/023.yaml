source:
  edition: WLC
  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: fr
  text: Puis les deux hommes revinrent, descendirent de la région montagneuse, passèrent de l’autre côté et se rendirent auprès de Josué, fils de Noun. Ils lui racontèrent tout ce qui leur était arrivé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui les avait atteints » ; plus littéralement, « toutes les choses qui les avaient trouvés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: revinrent
  rationale: Le verbe שׁוב exprime ici le retour des deux hommes après leur mission. « Revinrent » est naturel et conserve la progression narrative.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: les deux hommes
  rationale: Cette traduction suit directement l’hébreu sans remplacer « hommes » par « espions », rôle fourni par le contexte.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: descendirent de la région montagneuse
  rationale: הָהָר peut désigner une zone montagneuse plutôt qu’une montagne isolée. Le contexte géographique favorise ici « la région montagneuse ».
- source_word: וַיַּעַבְרוּ
  choice: passèrent de l’autre côté
  rationale: עבר signifie traverser ou passer de l’autre côté. L’objet n’étant pas exprimé en hébreu, cette formulation préserve cette concision sans préciser explicitement ce qu’ils traversèrent.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: se rendirent auprès de Josué, fils de Noun
  rationale: « Se rendirent auprès de » exprime naturellement en français le mouvement vers Josué. Le patronyme est conservé selon la formulation explicite de l’hébreu.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: ils lui racontèrent
  rationale: Au piel, ספר signifie raconter ou rapporter. « Racontèrent » convient au compte rendu détaillé de leur expérience.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: tout ce qui leur était arrivé
  rationale: La tournure issue de מצא signifie littéralement ce qui les a « trouvés », mais fonctionne idiomatiquement pour tout ce qui leur est arrivé. La traduction française restitue ce sens tout en conservant la totalité exprimée par כָּל.
