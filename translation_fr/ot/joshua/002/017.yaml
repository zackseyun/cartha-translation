  text: וַ/יֹּאמְר֥וּ אֵלֶ֖י/הָ הָ/אֲנָשִׁ֑ים נְקִיִּ֣ם אֲנַ֔חְנוּ מִ/שְּׁבֻעָתֵ֥/ךְ הַ/זֶּ֖ה אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/017.yaml
  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: fr
  text: 'Les hommes lui dirent : « Nous serons dégagés de ce serment[a] que tu nous as fait prêter. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous sommes quittes de ce serment que tu nous as fait prêter. » L’hébreu peut exprimer le fait d’être libéré de l’obligation ou de la responsabilité liée au serment ; la proposition nominale ne marque pas elle-même le temps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et rend inutile un « et » initial peu naturel ici.
- source_word: אֵלֶיהָ
  choice: lui
  rationale: La préposition אֶל avec le suffixe féminin singulier désigne Rahab; « lui dirent » est la tournure idiomatique moderne.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte dit simplement « les hommes ». Le contexte les identifie comme espions, mais cette précision n’est pas ajoutée au verset.
- source_word: נְקִיִּם
  choice: dégagés
  rationale: Dans ce contexte juridique et lié à un serment, נָקִי exprime l’absence d’obligation ou de responsabilité. « Dégagés » communique cette idée sans suggérer principalement l’innocence morale.
- source_word: אֲנַחְנוּ
  choice: nous
  rationale: Le pronom explicite est conservé dans « nous serons », avec la valeur prospective indiquée par le contexte immédiat.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: du serment
  rationale: מִן marque ici la libération à l’égard du serment. En français, « le serment que tu nous as fait prêter » exprime naturellement le serment précis de Rahab sans la lourdeur de « ce serment qui est le tien ».
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: que tu nous as fait prêter
  rationale: 'Le hiphil de שׁבע est causatif : Rahab leur a fait prêter serment. Cette formulation française conserve ce sens et le suffixe objet « nous ».'
theological_decisions:
- issue: Valeur temporelle de נְקִיִּם אֲנַחְנוּ
  choice: Nous serons dégagés
  alternative: Nous sommes dégagés
  rationale: La proposition est nominale et ne marque pas elle-même le temps. Le contexte des conditions énoncées ensuite favorise une portée prospective, sans faire de cette valeur une propriété explicite de la forme hébraïque.
translation_notes:
  register: Français international moderne, narratif et digne. « Dégagés du serment » maintient la nuance juridique ou conventionnelle; la note signale la formulation littérale et l’ambiguïté temporelle de la proposition nominale.
