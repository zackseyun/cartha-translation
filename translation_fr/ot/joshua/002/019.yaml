  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: fr
  text: Quiconque sortira par les portes de ta maison, son sang retombera sur sa propre tête, et nous ne serons pas coupables. Mais quiconque sera avec toi dans la maison, son sang retombera sur nos têtes[a] si quelqu’un porte la main sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Son sang retombera sur sa propre tête » et « son sang retombera sur nos têtes » sont des expressions juridiques qui attribuent la responsabilité d’une mort ou du sang versé.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: non représenté séparément
  rationale: La forme introduit ici la stipulation suivante. En français, la proposition relative conditionnelle exprime naturellement cette fonction sans formule supplémentaire.
- source_word: כֹּל אֲשֶׁר
  choice: quiconque
  rationale: L’expression désigne distributivement toute personne concernée. « Quiconque » convient au registre solennel et juridique du serment.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: franchira les portes de ta maison pour sortir
  rationale: Cette formulation rend clairement le passage de l’intérieur à l’extérieur sans reproduire lourdement les indications directionnelles de l’hébreu.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: son sang retombera sur sa propre tête
  rationale: Le tour français conserve l’image juridique hébraïque et indique que cette personne portera elle-même la responsabilité de sa mort.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: et nous ne serons pas coupables
  rationale: Cette formulation naturelle rend l’absence de culpabilité ou de responsabilité des espions au regard de leur engagement.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: Mais quiconque sera avec toi dans la maison
  rationale: « Mais » fait ressortir le contraste entre celui qui sort et celui qui demeure dans le lieu protégé.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: son sang retombera sur nos têtes
  rationale: Le parallélisme avec la première expression est maintenu, tout comme l’attribution de responsabilité aux espions.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: si l’on porte la main sur lui
  rationale: Cette locution française naturelle évoque une atteinte violente sans identifier l’auteur, conformément à la formulation indéfinie de l’hébreu.
theological_decisions:
- issue: Maintien de l’expression relative au sang versé
  choice: Conserver « son sang retombera sur sa propre tête / sur nos têtes » dans le texte principal
  alternative: Traduire explicitement « il sera responsable de sa propre mort / nous serons responsables de sa mort »
  rationale: L’image hébraïque porte la solennité juridique et éthique de l’engagement. Une note en explicite la portée sans remplacer l’image par son interprétation.
- issue: Genre grammatical de la personne indéfinie
  choice: Employer le masculin singulier après « quiconque »
  alternative: Reformuler au pluriel ou répéter « cette personne »
  rationale: L’hébreu emploie le singulier masculin distributif. Le français suit naturellement cet usage juridique et représentatif sans restreindre l’application aux hommes.
translation_notes:
  register: Français international moderne, clair et digne, avec une tonalité solennelle adaptée à un engagement sous serment. Le parallélisme juridique et l’image du sang sur la tête sont préservés, tandis que les mouvements et les conditions sont exprimés idiomatiquement.
