  text: וַ/תּוֹרִדֵ֥/ם בַּ/חֶ֖בֶל בְּעַ֣ד הַֽ/חַלּ֑וֹן כִּ֤י בֵיתָ/הּ֙ בְּ/קִ֣יר הַֽ/חוֹמָ֔ה וּ/בַֽ/חוֹמָ֖ה הִ֥יא יוֹשָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: fr
  text: Alors elle les fit descendre avec une corde par la fenêtre, car sa maison se trouvait dans la muraille[a] de la ville, et elle habitait dans la muraille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « sa maison se trouvait sur la muraille de la ville, et elle habitait sur la muraille ». L’hébreu situe son habitation dans ou sur la structure de la muraille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: Alors elle les fit descendre
  rationale: Le hiphil de ירד exprime l’action de faire descendre. Cette formulation naturelle en français conserve le sens causatif et « Alors » rend l’enchaînement narratif.
- source_word: בַּחֶבֶל
  choice: avec une corde
  rationale: חֶבֶל désigne couramment une corde; la préposition marque ici le moyen employé.
- source_word: בְּעַד הַחַלּוֹן
  choice: par la fenêtre
  rationale: בְּעַד indique ici le passage à travers une ouverture. « Par la fenêtre » est idiomatique et précis en français.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit l’explication qui rend cette fuite possible; « car » convient au registre narratif et dignifié.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: sa maison se trouvait dans la muraille de la ville
  rationale: La formulation maintient la localisation exprimée par בְּ sans imposer une reconstruction architecturale plus précise que l’hébreu. « Muraille de la ville » explicite naturellement la fonction de l’ouvrage.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: et c’est dans la muraille qu’elle habitait
  rationale: ישׁב signifie ici habiter ou demeurer. La tournure emphatique rend la reprise du texte hébreu et conserve l’étrangeté descriptive de la localisation.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et dignifié. La traduction conserve la répétition de « muraille » et l’ambiguïté spatiale des prépositions hébraïques, tout en évitant l’expression interprétative « construite dans la muraille ».
