  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: fr
  text: 'Josué, fils de Noun, envoya secrètement de Shittim deux hommes comme espions. Il leur dit : « Allez examiner le pays et Jéricho. » Ils partirent et entrèrent dans la maison d’une prostituée nommée Rahab, où ils se couchèrent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « où ils logèrent ». L’hébreu dit littéralement : « ils se couchèrent là ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשִּׁטִּים
  choice: depuis Shittim
  rationale: Le nom géographique est translittéré plutôt que traduit; « depuis » exprime naturellement le point de départ.
- source_word: מְרַגְּלִים חֶרֶשׁ
  choice: secrètement … comme espions
  rationale: Cette formulation conserve à la fois la fonction des deux hommes et le caractère clandestin de leur mission.
- source_word: לְכוּ רְאוּ
  choice: Allez examiner
  rationale: Dans le cadre d’une mission de reconnaissance, « examiner » rend le sens contextuel de « voir » sans ajouter de précision étrangère au texte.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: le pays et Jéricho
  rationale: La coordination hébraïque est maintenue, ce qui évite de définir de manière interprétative le rapport exact entre le pays et Jéricho.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: la maison d’une prostituée
  rationale: זוֹנָה désigne normalement une prostituée; « aubergiste » est une interprétation moins directement fondée sur le lexique.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: où ils se couchèrent
  rationale: La formulation garde le sens concret de שכב et n’introduit ni activité sexuelle ni dispositif formel d’hébergement.
theological_decisions:
- issue: Métier de Rahab (זוֹנָה)
  choice: prostituée
  alternative: aubergiste
  rationale: Le sens lexical ordinaire est « prostituée ». Employer « aubergiste » atténuerait sans fondement suffisant la portée sociale et morale du récit.
- issue: Portée de וַיִּשְׁכְּבוּ שָׁמָּה
  choice: où ils se couchèrent
  alternative: où ils logèrent
  rationale: Le choix retenu préserve l’expression concrète de l’hébreu sans suggérer une relation sexuelle; « logèrent » expliciterait davantage la situation que ne le fait le texte.
- issue: Rapport entre le pays et Jéricho
  choice: le pays et Jéricho
  alternative: le pays, en particulier Jéricho
  rationale: Le simple « et » maintient la tension syntaxique du texte au lieu de préciser que Jéricho serait seulement un sous-ensemble mis en relief.
translation_notes:
  register: Français international moderne, narratif et digne. « Josué, fils de Noun » suit l’usage biblique français courant; « Shittim » conserve le toponyme. La syntaxe a été légèrement restructurée en phrases brèves pour une lecture naturelle sans perte de contenu.
