revisions:
- from: et que vous laisserez en vie mon père et ma mère[a], mes frères et mes sœurs, ainsi que tous ceux qui leur appartiennent[b], et que vous arracherez nos vies à la mort.
  to: et que vous gardiez en vie mon père et ma mère[a], mes frères et mes sœurs, ainsi que tout ce qui est à eux[b], et que vous nous délivriez de la mort.
  rationale: La révision emploie un subjonctif naturel pour la teneur de l’engagement sollicité, rend le causatif de חיה par « garder en vie », et rétablit l’ampleur non spécifiée de כָּל אֲשֶׁר לָהֶם. La délivrance « de la mort » reste concrète et fidèle au contexte, sans introduire de lecture doctrinale.
