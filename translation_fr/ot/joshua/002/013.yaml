review_pass:
  verdict: revise
  source_fidelity: La demande de maintenir les proches en vie et de délivrer les suppliants de la mort est bien comprise. Toutefois, « tous ceux qui leur appartiennent » restreint le sens de כָּל אֲשֶׁר לָהֶם à des personnes, alors que l’hébreu dit plus largement « tout ce qui est à eux »; le contexte rend une référence à la maisonnée probable, sans l’imposer dans le texte. « Arracher nos vies à la mort » est expressif, mais « nous délivrerez de la mort » rend plus directement הִצַּלְתֶּם ... מִמָּוֶת et conserve naturellement la valeur concrète de נפש dans ce contexte.
  naturalness: « Et que vous laisserez » est moins naturel dans une proposition complétive introduite par « que » (qui dépend vraisemblablement de la demande de serment au verset précédent). Le subjonctif « que vous gardiez en vie » est idiomatique et conserve la portée de l’engagement demandé. « Que vous nous délivriez de la mort » est également naturel et digne.
  terminology: « Garder en vie » convient au hiphil de חיה sans réduire le verbe à la seule idée de ne pas tuer. « Tout ce qui est à eux » préserve l’ouverture sémantique de la formule hébraïque; la note peut signaler que la maisonnée et les dépendants sont probablement visés. « Délivrer de la mort » rend נצל sans surcharge théologique.
  issues:
  - severity: medium
    issue: Restriction indue de « כָּל אֲשֶׁר לָהֶם »
    rationale: « Tous ceux qui leur appartiennent » ne vise que des personnes, tandis que l’hébreu peut aussi englober les biens et emploie une formule volontairement large. Il convient de préserver cette ambiguïté dans le texte.
  - severity: low
    issue: Mode verbal peu naturel après « que »
    rationale: Dans cette formulation de demande/serment, « que vous laissiez/gardiez » est plus idiomatique que « que vous laisserez ».
  - severity: low
    issue: Rendu très idiomatique mais moins direct de la délivrance
    rationale: « Arracher nos vies à la mort » est possible, mais « nous délivriez de la mort » correspond plus directement à la construction hébraïque et est plus naturel en français courant.
  revised_text: et que vous gardiez en vie mon père et ma mère[a], mes frères et mes sœurs, ainsi que tout ce qui est à eux[b], et que vous nous délivriez de la mort.
  revised_footnotes:
