  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: fr
  text: et que vous gardiez en vie mon père et ma mère[a], mes frères et mes sœurs, ainsi que tout ce qui est à eux[b], et que vous nous délivriez de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « que vous laissiez vivre mon père et ma mère […] et que vous nous délivriez de la mort ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner tout ce qui est à eux. Dans ce contexte, elle vise probablement les autres membres de leur maisonnée ou les personnes à leur charge.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: vous laisserez en vie
  rationale: Le hiphil de חיה exprime ici le fait de faire vivre ou de maintenir en vie. « Laisser en vie » est naturel en français dans une demande d’épargner quelqu’un, tout en gardant le sens causatif.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: mon père et ma mère, mes frères et mes sœurs
  rationale: Les termes de parenté sont rendus distinctement, conformément à leur succession dans l’hébreu. Dans ce contexte, אחותי est compris collectivement comme désignant les sœurs.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: tous ceux qui leur appartiennent
  rationale: La formule peut viser tout ce qui est à eux, personnes comme biens. Le contexte d’un sauvetage de vies favorise la référence aux membres ou dépendants de leur maison, sans rendre cette interprétation certaine.
- source_word: וְהִצַּלְתֶּם
  choice: vous arracherez
  rationale: Le hiphil de נצל signifie délivrer ou arracher au danger. Avec « à la mort », « arracher nos vies à la mort » forme une expression française naturelle et vigoureuse.
- source_word: נַפְשֹׁתֵינוּ
  choice: nos vies
  rationale: נפש désigne ici les vies ou les personnes menacées, et non des âmes immatérielles.
- source_word: מִמָּוֶת
  choice: à la mort
  rationale: La préposition hébraïque marque l’éloignement ou la délivrance hors de la mort. En français, la construction idiomatique avec « arracher » demande « à la mort ».
