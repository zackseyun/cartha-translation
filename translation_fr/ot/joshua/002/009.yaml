  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: fr
  text: 'Elle dit aux hommes : « Je sais que Yahweh vous a donné le pays, que la terreur que vous inspirez s’est abattue sur nous et que tous les habitants du pays ont fondu devant vous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les habitants du pays ont perdu courage à cause de vous ». Le verbe hébreu signifie littéralement « fondre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: Elle dit aux hommes
  rationale: Le waw consécutif fait avancer le récit. En français narratif, le passé simple rend naturellement cette progression, tandis que l’article défini désigne les hommes déjà présents dans le contexte.
- source_word: יָדַעְתִּי
  choice: Je sais
  rationale: Le parfait du verbe statif exprime ici une connaissance acquise qui demeure actuelle.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: Yahweh vous a donné le pays
  rationale: Le parfait présente le don comme déjà acquis du point de vue de Rahab, même si la conquête reste à venir. « Le pays » désigne naturellement le territoire concerné.
- source_word: אֵימַתְכֶם
  choice: la terreur que vous inspirez
  rationale: Cette formulation explicite sans ambiguïté que les Israélites causent la terreur; אֵימָה est plus fort que la simple peur.
- source_word: נָפְלָה ... עָלֵינוּ
  choice: s’est abattue sur nous
  rationale: Cette expression française conserve l’image d’une terreur qui « tombe sur » les habitants tout en restant idiomatique.
- source_word: נָמֹגוּ
  choice: se sont fondus de peur
  rationale: Le verbe signifie littéralement « fondre » et évoque métaphoriquement la perte de courage. L’ajout « de peur » rend l’image immédiatement compréhensible en français sans l’effacer.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: tous les habitants du pays
  rationale: Rend directement le participe substantivé et reprend le sens territorial de הָאָרֶץ.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Conserve l’expression hébraïque, qui peut évoquer à la fois la présence, l’avancée et la causalité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le transmet comme nom plutôt que de lui substituer un titre.
- issue: Statut du don du pays
  choice: vous a donné le pays
  alternative: vous donne le pays; vous donnera le pays
  rationale: Le parfait hébreu présente le don comme effectivement accompli selon la confession de Rahab, sans nier que la prise de possession historique soit encore en cours.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; les images hébraïques de la terreur qui tombe et des habitants qui fondent sont conservées sous une forme naturelle.
