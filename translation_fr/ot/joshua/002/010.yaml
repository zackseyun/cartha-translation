id: JOS.2.10
reference: Joshua 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: fr
  text: Car nous avons appris comment Yahweh a asséché devant vous les eaux de la mer des Roseaux[a], lorsque vous êtes sortis d’Égypte, et ce que vous avez fait aux deux rois des Amorites qui étaient de l’autre côté du Jourdain, Sihôn et Og, que vous avez voués à la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Yam Souf, littéralement « mer des Roseaux »; traditionnellement appelée « mer Rouge ».'
    reason: Signaler l’appellation traditionnelle et l’ambiguïté géographique tout en donnant priorité au sens lexical hébreu.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la crainte évoquée dans le contexte immédiat et assure un enchaînement naturel en français.
- source_word: שָׁמַעְנוּ
  choice: nous avons appris
  rationale: Le parfait exprime une information reçue dont l’effet demeure; « avons appris » est naturel pour une nouvelle parvenue aux habitants de Jéricho.
- source_word: הוֹבִישׁ
  choice: a asséché
  rationale: Le hifil de יבש signifie « rendre sec, assécher »; ce verbe restitue clairement l’action causative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: מֵי יַם סוּף
  choice: les eaux de la mer des Roseaux
  rationale: « Eaux » reflète le pluriel hébreu, et « mer des Roseaux » rend le sens lexical de יַם־סוּף sans dépendre de l’appellation traditionnelle.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Exprime naturellement que les eaux ont été retirées du chemin des Israélites.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: lorsque vous êtes sortis d’Égypte
  rationale: Rend la proposition temporelle formée par l’infinitif construit avec בְּ.
- source_word: עֲשִׂיתֶם
  choice: vous avez fait
  rationale: Conserve le caractère général du verbe עשה, dont la précision vient ensuite.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: aux deux rois des Amorites
  rationale: Suit la construction hébraïque tout en restant idiomatique en français.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: qui étaient de l’autre côté du Jourdain
  rationale: Localise les rois à l’est du Jourdain selon la perspective du récit, sans surcharger le texte.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: Sihôn et Og
  rationale: Rend l’apposition qui identifie les deux rois; la répétition de « à » serait inutile en français.
- source_word: הֶחֱרַמְתֶּם
  choice: vous avez voués à la destruction
  rationale: 'Préserve la notion spécifique de חרם: consacrer irrévocablement à une destruction imposée, plutôt que réduire le terme au simple fait de vaincre ou détruire.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; « Yahweh » le conserve explicitement plutôt que de lui substituer un titre.
- issue: Rendu du vocabulaire de חרם
  choice: voués à la destruction
  alternative: exterminés / frappés d’interdit
  rationale: Cette formulation maintient la dimension de mise à part irrévocable conduisant à la destruction, sans aplanir le terme en simple action militaire ni expliquer davantage que l’hébreu.
- issue: Identification de יַם־סוּף
  choice: mer des Roseaux
  alternative: mer Rouge
  rationale: Le rendu principal suit le sens lexical de l’expression hébraïque; l’appellation française traditionnelle est signalée en note sans trancher abusivement la question géographique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la progression de l’hébreu et sa terminologie théologiquement chargée. « Sihôn » suit l’accentuation française usuelle; « Yahweh » conserve le nom divin.
