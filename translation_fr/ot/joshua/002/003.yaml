source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ מֶ֣לֶךְ יְרִיח֔וֹ אֶל רָחָ֖ב לֵ/אמֹ֑ר ה֠וֹצִיאִי הָ/אֲנָשִׁ֨ים הַ/בָּאִ֤ים אֵלַ֨יִ/ךְ֙ אֲשֶׁר בָּ֣אוּ לְ/בֵיתֵ֔/ךְ כִּ֛י לַ/חְפֹּ֥ר אֶת כָּל הָ/אָ֖רֶץ בָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: fr
  text: 'Alors le roi de Jéricho envoya dire à Rahab : « Fais sortir les hommes qui sont venus chez toi, ceux qui sont entrés dans ta maison, car ils sont venus reconnaître tout le pays[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « espionner tout le pays ». Le verbe hébreu peut désigner une reconnaissance clandestine dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya dire
  rationale: Le verbe signifie littéralement « envoya » ; en français, « envoya dire » exprime naturellement l’envoi d’un message introduit par לֵאמֹר sans suggérer que le roi s’est rendu lui-même chez Rahab.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: le roi de Jéricho
  rationale: Le syntagme construit désigne naturellement le roi de la ville de Jéricho ; l’article défini est requis par le contexte narratif français.
- source_word: הוֹצִיאִי
  choice: Fais sortir
  rationale: L’impératif féminin singulier au hifil de יצא signifie « faire sortir » et s’adresse directement à Rahab.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: qui sont venus chez toi
  rationale: Le participe décrit les hommes venus auprès de Rahab ; « chez toi » est idiomatique et prépare la précision suivante concernant sa maison.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: ceux qui sont entrés dans ta maison
  rationale: Le verbe בוא avec « maison » indique leur arrivée dans la maison. « Sont entrés » évite une répétition lourde tout en conservant le mouvement vers l’intérieur.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif donné à l’ordre royal.
- source_word: לַחְפֹּר
  choice: reconnaître
  rationale: Dans ce contexte, חפר désigne l’examen clandestin d’un territoire, une reconnaissance. Ce choix garde la nuance d’investigation sans expliciter davantage que l’hébreu le statut militaire des hommes.
- source_word: אֶת כָּל הָאָרֶץ
  choice: tout le pays
  rationale: הָאָרֶץ désigne ici le territoire concerné, non la planète entière. « Tout le pays » est naturel en français dans ce contexte.
- source_word: בָּאוּ
  choice: ils sont venus
  rationale: Le passé composé rend l’action accomplie dont les conséquences demeurent actuelles dans l’accusation du roi.
theological_decisions: []
