  yaml_path: translation/ot/joshua/002/008.yaml
  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: fr
  text: Avant qu’ils se couchent[a], elle monta les rejoindre sur le toit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avant qu’ils s’endorment ». Le verbe hébreu signifie littéralement « se coucher » ou « s’allonger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: Avant que
  rationale: Introduit naturellement en français une action antérieure à celle du verbe suivant.
- source_word: יִשְׁכָּבוּן
  choice: ils se couchent
  rationale: Le verbe שׁכב signifie littéralement « se coucher, s’allonger ». En contexte, il peut impliquer le sommeil, sans toutefois le nommer explicitement.
- source_word: עָלְתָה
  choice: elle monta
  rationale: Le qal de עלה exprime ici un mouvement vers le haut; le passé simple convient au récit et au mouvement vers le toit.
- source_word: עֲלֵיהֶם
  choice: les rejoindre
  rationale: Avec un verbe de mouvement et des personnes comme référent, la préposition indique ici qu’elle monte vers eux. « Les rejoindre » est idiomatique et évite le calque trompeur « sur eux ».
- source_word: עַל הַגָּג
  choice: sur le toit
  rationale: Désigne le lieu où se trouvent les hommes et vers lequel elle monte; l’expression convient au toit plat de la scène.
- source_word: וְהֵמָּה ... וְהִיא
  choice: ils… elle
  rationale: La structure française conserve le contraste explicite entre les hommes et Rahab.
theological_decisions: []
