id: JOS.2.20
reference: Joshua 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: fr
  text: Mais si tu divulgues cette affaire qui nous concerne[a], nous serons dégagés[b] du serment que tu nous as fait prêter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu révèles ce qui nous concerne » ou « tu divulgues notre secret ». Le mot hébreu peut désigner une parole, une chose ou une affaire; ici, il renvoie à la mission secrète des espions.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « nous serons innocents à l'égard du serment ». Cette expression hébraïque signifie qu'ils ne seront plus liés par celui-ci si elle divulgue leur secret.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction suivie de la particule conditionnelle introduit une condition opposée à l'engagement qui précède; « Mais si » rend clairement ce contraste.
- source_word: תַּגִּידִי
  choice: tu divulgues
  rationale: Le hifil de נגד signifie « déclarer, faire connaître ». Dans ce contexte de mission secrète, « divulguer » exprime naturellement l'idée de révéler ce qui doit rester caché.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: cette affaire qui nous concerne
  rationale: דבר peut désigner une parole, une chose ou une affaire. Ici, l'expression renvoie au secret lié aux espions; cette formulation conserve la portée large du terme sans le réduire aux seules paroles prononcées.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: nous serons dégagés
  rationale: L'expression avec נקי indique ici l'absence de responsabilité ou la libération d'une obligation. « Dégagés » convient précisément au lien créé par le serment.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: du serment
  rationale: La préposition מן marque la délivrance à l'égard du serment. En français, le relatif qui suit précise naturellement qu'il s'agit du serment imposé par Rahab.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: que tu nous as fait prêter
  rationale: 'Le hifil de שׁבע est causatif: Rahab leur a fait prêter serment. Cette tournure française en restitue directement la valeur.'
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement respecte l'adresse au singulier féminin de l'hébreu. « Affaire qui nous concerne » préserve l'ampleur de דבר, tandis que « divulgues » explicite seulement la dimension de révélation secrète imposée par le contexte.
