  text: וַ/יֵּ֣אָמַ֔ר לְ/מֶ֥לֶךְ יְרִיח֖וֹ לֵ/אמֹ֑ר הִנֵּ֣ה אֲ֠נָשִׁים בָּ֣אוּ הֵ֧נָּה הַ/לַּ֛יְלָה מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/חְפֹּ֥ר אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: fr
  text: 'On rapporta au roi de Jéricho : « Voici, des hommes d’entre les Israélites sont arrivés ici cette nuit pour explorer le pays[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaître le pays » ou « espionner le pays ». Le verbe hébreu peut exprimer l’idée de rechercher ou d’examiner à fond; ici, il s’agit d’une mission de reconnaissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: On rapporta
  rationale: La forme hébraïque laisse l’auteur du signalement indéterminé. La tournure française avec « on » conserve cette indétermination tout en étant plus naturelle que le passif « il fut dit ».
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: au roi de Jéricho
  rationale: Cette formulation rend directement le titre politique et son complément géographique.
- source_word: לֵאמֹר
  choice: introduit par les deux-points et le discours direct
  rationale: L’infinitif hébreu introduit les paroles rapportées; la ponctuation française en donne l’équivalent naturel.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » attire l’attention sur une information nouvelle et urgente sans adopter un registre archaïque.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom désigne ici des personnes de sexe masculin, conformément au contexte narratif.
- source_word: בָּאוּ הֵנָּה
  choice: sont arrivés ici
  rationale: Le passé composé exprime une arrivée accomplie dont la pertinence demeure immédiate; « ici » conserve la valeur déictique de הֵנָּה.
- source_word: הַלַּיְלָה
  choice: cette nuit
  rationale: L’expression renvoie à la nuit en cours et se formule naturellement ainsi en français international.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: d’entre les Israélites
  rationale: Cette formulation rend la provenance ou l’appartenance au peuple d’Israël tout en conservant la nuance partitive de la préposition מִן.
- source_word: לַחְפֹּר
  choice: pour explorer
  rationale: Le verbe peut littéralement évoquer l’action de creuser ou de rechercher à fond; dans ce contexte, il désigne une exploration à visée de reconnaissance. « Explorer » est naturel sans expliciter excessivement l’intention d’espionnage.
- source_word: אֶת הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « le pays » est une expression française naturelle et ne précise pas un nom géographique absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, international et narratif, avec une dignité sobre. La construction impersonnelle préserve l’identité inconnue de l’informateur, tandis que « explorer » maintient la portée contextuelle du verbe sans rendre obligatoire la nuance plus accusatrice d’« espionner ».
