  text: וַ/תֹּ֨אמֶר֙ כְּ/דִבְרֵי/כֶ֣ם כֶּן ה֔וּא וַֽ/תְּשַׁלְּחֵ֖/ם וַ/יֵּלֵ֑כוּ וַ/תִּקְשֹׁ֛ר אֶת תִּקְוַ֥ת הַ/שָּׁנִ֖י בַּ/חַלּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: fr
  text: 'Elle répondit : « Qu’il en soit comme vous l’avez dit. » Puis elle les laissa partir, et ils s’en allèrent. Elle attacha le cordon écarlate à la fenêtre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fil écarlate ». Le terme hébreu peut désigner un fil, un cordon ou une corde servant de signe visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם כֶּן הוּא
  choice: Qu’il en soit comme vous l’avez dit
  rationale: Rend naturellement la formule hébraïque d’assentiment tout en conservant la référence aux paroles des deux hommes.
- source_word: וַתְּשַׁלְּחֵם
  choice: elle les laissa partir
  rationale: Dans ce contexte, שׁלח décrit le fait de congédier les espions et de les laisser poursuivre leur route; cette formulation est naturelle en français.
- source_word: וַיֵּלֵכוּ
  choice: ils s’en allèrent
  rationale: Reproduit simplement la progression narrative exprimée par הלך.
- source_word: וַתִּקְשֹׁר
  choice: elle attacha
  rationale: קשר signifie nouer ou attacher; « attacha » convient naturellement à la fixation du cordon à la fenêtre.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: le cordon écarlate
  rationale: Dans ce contexte, תִּקְוָה désigne un fil, une cordelette ou un cordon servant de signe visible, et non l’« espérance »; « cordon écarlate » est clair et idiomatique.
- source_word: בַּחַלּוֹן
  choice: à la fenêtre
  rationale: La préposition ב marque ici l’emplacement où le cordon est attaché; « à la fenêtre » est la tournure française la plus naturelle.
theological_decisions: []
