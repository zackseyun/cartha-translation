  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: fr
  text: « Eh bien, lorsque nous entrerons dans le pays, attache à la fenêtre par laquelle tu nous as fait descendre ce cordon écarlate[a]. Réunis auprès de toi, dans la maison, ton père, ta mère, tes frères et toute la maisonnée de ton père. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ce cordon de fil écarlate » ; ou : « ce fil écarlate servant de cordon ».'
    reason: La construction תִּקְוַת חוּט הַשָּׁנִי comprend explicitement חוּט (« fil »), tandis que תִּקְוָה désigne ici un cordon ou une ligne.
lexical_decisions:
- source_word: הִנֵּה
  choice: « Quand… » avec valeur d’introduction marquée par les guillemets
  rationale: הִנֵּה attire l’attention et introduit ici les conditions énoncées par les espions. Une traduction autonome comme « Vois » ou « Voici » serait peu naturelle en français dans cette construction; l’ouverture directe de la déclaration en conserve la fonction discursive.
- source_word: בָאִים בָּאָרֶץ
  choice: « quand nous entrerons dans le pays »
  rationale: Le participe exprime ici une entrée future envisagée dans le cadre de l’engagement. Le futur français après « quand » rend clairement cette valeur.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: « ce cordon écarlate »
  rationale: La chaîne nominale désigne le cordon servant de signe distinctif. « Cordon écarlate » est précis et naturel; la formulation plus littérale est conservée en note.
- source_word: תִּקְשְׁרִי
  choice: « attache »
  rationale: L’imparfait hébreu a ici une valeur injonctive. L’impératif français exprime naturellement la stipulation adressée à Rahab.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: « à la fenêtre par laquelle tu nous as fait descendre »
  rationale: La forme causative de ירד signifie qu’elle les a fait descendre. « À la fenêtre » convient idiomatiquement à l’endroit où le cordon doit être attaché.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: « Réunis auprès de toi, dans la maison »
  rationale: La formulation garde à la fois l’idée de rassembler les proches auprès de Rahab et leur destination à l’intérieur de la maison.
- source_word: אַחַיִךְ
  choice: « tes frères »
  rationale: Le nom est au masculin pluriel et rien dans le contexte immédiat n’impose de l’élargir à « frères et sœurs ».
- source_word: כָּל בֵּית אָבִיךְ
  choice: « toute la famille de ton père »
  rationale: « Maison du père » désigne ici le groupe familial plutôt que le bâtiment. « Famille de ton père » reste intelligible et proche de cette structure sociale.
theological_decisions: []
