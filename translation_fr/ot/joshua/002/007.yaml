  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: fr
  text: Les hommes les poursuivirent par le chemin qui mène au Jourdain, jusqu’aux gués[a]. On ferma la porte dès que les poursuivants furent sortis à leur poursuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’aux lieux de passage », c’est-à-dire aux endroits peu profonds du Jourdain où l’on pouvait traverser.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Les hommes
  rationale: Le groupe défini renvoie, dans le contexte, aux agents du roi partis rechercher les espions. En français, il n’est pas nécessaire de rendre systématiquement le waw narratif par « et ».
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: les poursuivirent
  rationale: « Poursuivre » exprime naturellement en français le verbe רדף avec son complément introduit en hébreu par אַחֲרֵי.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: par la route du Jourdain
  rationale: דֶּרֶךְ désigne ici la route empruntée en direction du Jourdain; cette formulation reste concise sans préciser plus que l’hébreu.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: jusqu’aux gués
  rationale: מַעְבָּרוֹת désigne les endroits où l’on traverse le fleuve; dans ce contexte de déplacement, עַל peut indiquer le point atteint.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: On ferma la porte
  rationale: Le sujet du pluriel hébreu est indéfini. Le pronom français « on » le préserve sans attribuer explicitement l’action à un groupe non nommé; « la porte » renvoie à la porte de la ville dans le contexte.
- source_word: כַּאֲשֶׁר יָצְאוּ
  choice: dès que ... furent sortis
  rationale: La locution temporelle indique ici que la porte fut fermée une fois les poursuivants sortis, vraisemblablement sans délai.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: les poursuivants ... à leur poursuite
  rationale: Le participe substantivé est rendu par « les poursuivants ». La reprise de l’idée de poursuite reflète la répétition hébraïque tout en restant idiomatique.
