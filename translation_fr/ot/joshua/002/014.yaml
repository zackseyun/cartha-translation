source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: fr
  text: 'Les hommes lui dirent : « Notre vie pour les vôtres, jusqu’à la mort, si vous ne divulguez pas notre affaire[a]. Quand Yahweh nous donnera le pays, nous agirons envers toi avec bonté et fidélité[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le pluriel (« vous »), puis s’adresse à Rahab au singulier (« toi »). Le pluriel peut inclure les membres de sa maisonnée.
    reason: ambiguïté grammaticale
  - marker: b
    text: L’expression hébraïque peut aussi se traduire par « amour loyal et vérité ». Elle évoque une bonté loyale, sûre et fidèle à l’engagement pris.
    reason: alternative lexicale
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le contexte les identifie comme les espions, mais l’hébreu dit simplement « les hommes » ; la traduction n’ajoute donc pas cette précision.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: Notre vie pour les vôtres, jusqu’à la mort
  rationale: נֶפֶשׁ désigne ici la vie exposée au danger, תַּחַת exprime la substitution et לָמוּת souligne l’engagement jusque dans la mort. La formulation française conserve le caractère bref et solennel du serment.
- source_word: אִם לֹא תַגִּידוּ
  choice: si vous ne divulguez pas
  rationale: Le hiphil de נגד signifie « dire, déclarer, révéler ». « Divulguer » convient à une affaire qui doit rester secrète et permet de conserver l’adresse au pluriel de la forme hébraïque.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: notre affaire
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Ici, il renvoie à la mission et à l’accord qui concernent les hommes, sans qu’il soit nécessaire de les préciser davantage.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: Quand Yahweh nous donnera le pays
  rationale: L’infinitif construit précédé de בְּ exprime ici la circonstance temporelle. Le futur français rend naturellement l’action attendue.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter directement le tétragramme présent dans le texte hébreu.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: nous agirons envers toi
  rationale: עשה avec עִם signifie ici agir ou se conduire envers quelqu’un. Cette formulation s’associe naturellement aux deux qualités qui suivent.
- source_word: חֶסֶד וֶאֱמֶת
  choice: avec bonté et fidélité
  rationale: « Bonté » rend la bienveillance loyale de חֶסֶד, tandis que « fidélité » exprime la fiabilité et la vérité de אֱמֶת. La note signale la portée relationnelle et possiblement conventionnelle de l’expression sans l’imposer dans le texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Portée de חֶסֶד וֶאֱמֶת
  choice: bonté et fidélité
  alternative: amour loyal et vérité
  rationale: La traduction choisie reste naturelle en français tout en maintenant deux notions distinctes. La note conserve la dimension de loyauté ferme et fiable que l’expression peut porter dans un engagement solennel.
- issue: Passage de l’adresse plurielle à l’adresse singulière
  choice: « vous » puis « toi »
  alternative: uniformiser par « tu »
  rationale: L’hébreu emploie une forme plurielle dans la condition, puis un suffixe féminin singulier pour Rahab. Le texte français conserve ce changement, qui peut inclure sa maisonnée dans l’obligation de garder le secret sans trancher définitivement la question.
translation_notes:
  register: Français international moderne, sobre et digne. La brièveté nominale de « Notre vie pour les vôtres » conserve le ton de serment. Le passage volontaire de « vous » à « toi » reflète le changement de nombre dans l’hébreu.
