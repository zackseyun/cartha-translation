base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: fr
  text: 'Mais la femme avait pris les deux hommes et les avait cachés[a]. Elle dit : « Oui, les hommes sont venus chez moi, mais je ne savais pas d’où ils venaient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte un suffixe singulier, littéralement « le cacha », mais le contexte renvoie collectivement aux deux hommes ; d’où « les avait cachés ».
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: avait pris
  rationale: Le plus-que-parfait présente naturellement en français l’accueil et la dissimulation comme antérieurs aux paroles adressées aux envoyés du roi.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Dans ce contexte, le terme désigne Rahab comme femme, sans signifier qu’elle est l’épouse de quelqu’un.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: les deux hommes
  rationale: Le groupe nominal désigne les deux espions israélites de sexe masculin.
- source_word: וַתִּצְפְּנוֹ
  choice: les avait cachés
  rationale: Bien que le suffixe hébreu soit au singulier, le contexte renvoie clairement aux deux hommes pris collectivement; le pluriel est donc requis en français courant.
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Formule narrative ordinaire introduisant les paroles de Rahab.
- source_word: כֵּן
  choice: Oui
  rationale: Le mot confirme directement que les hommes sont bien venus chez elle.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: ces hommes sont venus chez moi
  rationale: « Chez moi » rend naturellement la venue au lieu où Rahab demeure; le démonstratif reprend les hommes dont parlent ses interlocuteurs.
- source_word: וְלֹא יָדַעְתִּי
  choice: mais je ne savais pas
  rationale: « Mais » exprime en français le contraste discursif entre son aveu de leur venue et sa prétendue ignorance de leur origine; l’imparfait convient à l’état de connaissance au moment concerné.
- source_word: מֵאַיִן הֵמָּה
  choice: d’où ils étaient
  rationale: La formulation conserve la question de provenance exprimée par מֵאַיִן tout en restant compréhensible en français moderne.
