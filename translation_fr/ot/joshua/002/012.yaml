  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: fr
  text: Et maintenant, je vous en prie, jurez-moi par Yahweh que, de même que j’ai fait preuve de bonté envers vous, vous aussi, vous ferez preuve de bonté envers la maison de mon père et vous me donnerez un signe sûr[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un signe véritable », « un signe fiable » ou « un gage sûr ».
    reason: Alternative lexicale pour אוֹת אֱמֶת, qui peut souligner la véracité, la sûreté ou la fiabilité du signe demandé.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien discursif וְ et l’adverbe temporel עַתָּה, qui introduisent la demande pressante de Rahab.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: je vous en prie, jurez-moi
  rationale: L’impératif pluriel niphal de שבע exprime la prestation d’un serment; נָא en atténue la formulation tout en marquant l’insistance.
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: La préposition introduit celui par qui le serment est prêté; le nom divin יהוה est translittéré « Yahweh ».
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: j’ai agi avec bonté envers vous
  rationale: חֶסֶד désigne ici une bonté concrète et loyale. « Agir avec bonté envers » permet de répéter naturellement la même expression dans les deux propositions.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: vous agirez vous aussi
  rationale: Dans la suite de la demande de serment, le qatal coordonné a une valeur prospective; גַּם אַתֶּם souligne la réciprocité.
- source_word: בֵּית אָבִי
  choice: la famille de mon père
  rationale: L’expression hébraïque désigne la maisonnée ou le groupe familial paternel; « famille » est ici naturel et immédiatement compréhensible en français moderne.
- source_word: אוֹת אֱמֶת
  choice: un signe fiable
  rationale: אוֹת est un signe ou gage, tandis que אֱמֶת en souligne la véracité et la sûreté. « Signe fiable » préserve cette nuance sans préciser prématurément la forme du signe.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Portée de חֶסֶד
  choice: agir avec bonté
  alternative: faire preuve de fidélité loyale
  rationale: Le contexte met en avant une bonté réciproque concrète. Le choix retenu garde la dimension éthique sans imposer ici une formulation technique d’alliance.
- issue: Sens de אוֹת אֱמֶת
  choice: un signe fiable
  alternative: un signe véritable / un gage sûr
  rationale: La construction peut évoquer la vérité, la fiabilité ou l’assurance. Le texte principal retient une formulation naturelle, et la note maintient l’éventail réel des nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « bonté » reproduit celle de חֶסֶד. « La famille de mon père » explicite naturellement l’idiome familial בֵּית אָבִי sans en réduire la portée aux seuls habitants d’une maison.
