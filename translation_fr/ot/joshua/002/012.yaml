  to: Et maintenant, je vous en prie, jurez-moi par Yahweh que, de même que j’ai fait preuve de bonté envers vous, vous aussi, vous ferez preuve de bonté envers la maison de mon père et vous me donnerez un signe sûr[a],
  rationale: La révision corrige la rupture syntaxique entre le futur attendu des éclaireurs et l’impératif final, en intégrant « vous me donnerez » au contenu du serment. Elle améliore légèrement l’idiomaticité de la première occurrence de חסד et restitue « maison de mon père », expression qui préserve l’idiome de maisonnée/groupe familial du texte hébreu. La note reste ancrée à « signe sûr » et préserve l’ambiguïté lexicale de אמת.
