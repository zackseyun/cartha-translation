    issue: Emploi du plus-que-parfait pour la recherche des poursuivants
    rationale: « Ceux-ci les avaient cherchés… mais ne les avaient pas trouvés » présente la recherche comme explicitement antérieure au retour. L’hébreu emploie des formes narratives successives (« les poursuivants revinrent; les poursuivants cherchèrent… et ne trouvèrent pas »). Il convient de préserver cette présentation sans résoudre grammaticalement la relation temporelle.
  - severity: low
    issue: Ajout de « donc »
    rationale: Le waw initial est narratif et ne requiert pas une inférence (« donc »). Le supprimer évite d’ajouter une relation logique non marquée.
