base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: fr
  text: Ils partirent et gagnèrent la région montagneuse[a], où ils restèrent trois jours, jusqu’au retour des poursuivants. Les poursuivants cherchèrent tout le long de la route, mais ne les trouvèrent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la montagne » ou « les collines ». L’hébreu désigne probablement la région montagneuse à l’ouest de Jéricho plutôt qu’un sommet particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Ils partirent donc et gagnèrent
  rationale: Les deux verbes successifs expriment le déplacement. « Partirent » puis « gagnèrent » restitue naturellement la progression en français sans supprimer le second verbe.
- source_word: הָהָרָה
  choice: la région montagneuse
  rationale: Le ה directionnel marque le mouvement vers une zone élevée. Dans le contexte géographique à l’ouest de Jéricho, le nom singulier peut désigner le relief montagneux plutôt qu’un sommet précis.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: où ils restèrent
  rationale: ישׁב indique ici un séjour temporaire; « restèrent » convient mieux que « habitèrent ».
- source_word: שְׁלֹשֶׁת יָמִים
  choice: trois jours
  rationale: Traduction directe de l’expression temporelle.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: jusqu’au retour de ceux qui les poursuivaient
  rationale: Le participe substantivé désigne les poursuivants; la formulation française évite une répétition immédiate et explicite naturellement l’objet de la poursuite.
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים
  choice: Ceux-ci les avaient cherchés
  rationale: בקשׁ désigne ici une recherche menée pour retrouver les espions. Le plus-que-parfait rend explicite que cette recherche avait eu lieu avant le retour mentionné, conformément à la relation contextuelle des événements.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: tout le long de la route
  rationale: Cette tournure française exprime naturellement une recherche menée sur l’ensemble de l’itinéraire.
- source_word: וְלֹא מָצָאוּ
  choice: mais ne les avaient pas trouvés
  rationale: Le complément « les » est implicite en hébreu et nécessaire en français; « mais » rend la valeur adversative du contexte.
