  text: וַ/יְהִ֨י הַ/שַּׁ֜עַר לִ/סְגּ֗וֹר בַּ/חֹ֨שֶׁךְ֙ וְ/הָ/אֲנָשִׁ֣ים יָצָ֔אוּ לֹ֣א יָדַ֔עְתִּי אָ֥נָה הָלְכ֖וּ הָֽ/אֲנָשִׁ֑ים רִדְפ֥וּ מַהֵ֛ר אַחֲרֵי/הֶ֖ם כִּ֥י תַשִּׂיגֽוּ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: fr
  text: Au moment où l’on allait fermer la porte, à la tombée de la nuit[a], les hommes sont sortis. Je ne sais pas où ils sont allés. Poursuivez-les vite, car vous les rattraperez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand il faisait sombre » ; l’hébreu situe la fermeture de la porte au moment où l’obscurité s’installait.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשַּׁעַר לִסְגּוֹר
  choice: Au moment où l’on allait fermer la porte de la ville
  rationale: La construction situe l’action au moment où la fermeture est imminente. La tournure impersonnelle est naturelle en français. « De la ville » explicite sobrement la fonction contextuelle de la porte à Jéricho.
- source_word: בַּחֹשֶׁךְ
  choice: à la tombée de la nuit
  rationale: L’expression marque ici le moment où l’obscurité s’installe, plutôt qu’une simple situation « dans l’obscurité ».
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: les hommes sont sortis
  rationale: Le verbe יצא désigne concrètement le fait de sortir; le passé composé convient au récit oral rapporté en français moderne.
- source_word: לֹא יָדַעְתִּי
  choice: Je ne sais pas
  rationale: Bien que la forme hébraïque soit un accompli, elle exprime dans ce discours l’état présent d’ignorance que Rahab affirme.
- source_word: אָנָה הָלְכוּ הָאֲנָשִׁים
  choice: où ils sont allés
  rationale: אָנָה interroge la destination. Le pronom évite en français une répétition lourde de « les hommes » sans perte de référent.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: Poursuivez-les vite
  rationale: « Poursuivre » intègre naturellement l’idée exprimée par אַחֲרֵיהֶם, tandis que « vite » restitue directement l’adverbe מַהֵר.
- source_word: כִּי תַשִּׂיגוּם
  choice: car vous les rattraperez
  rationale: כִּי introduit le motif de l’ordre, et le hiphil de נשׂג signifie atteindre ou rattraper quelqu’un que l’on poursuit.
