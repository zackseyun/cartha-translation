  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: fr
  text: Quand nous l’avons appris, nos cœurs ont fondu, et personne n’eut plus le moindre courage[a] à cause de vous. Car Yahweh, votre Dieu[b], est Dieu dans les cieux, là-haut, et sur la terre, ici-bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucun esprit ne se leva plus en aucun homme ». Ici, « esprit » désigne le courage.'
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH employé dans le texte hébreu.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: Quand nous l’avons appris
  rationale: Le verbe signifie « entendre »; dans ce contexte, le français « apprendre » exprime naturellement la réception de la nouvelle évoquée aux versets précédents. Le complément implicite est rendu par « l’ ».
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: notre cœur a fondu
  rationale: La formulation conserve l’image hébraïque du cœur qui fond sous l’effet de la peur. Le singulier collectif « notre cœur » correspond au texte source et demeure intelligible en français.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: il ne resta plus de courage en personne
  rationale: רוּחַ désigne ici la force intérieure ou le courage. La traduction communique le sens idiomatique sans faire penser au Saint-Esprit; une note conserve la formulation hébraïque plus concrète.
- source_word: מִפְּנֵיכֶם
  choice: à cause de vous
  rationale: L’expression signifie littéralement « devant votre présence », mais elle indique ici la cause de l’effroi des habitants du pays.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de la peur qui vient d’être décrite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin YHWH est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le syntagme désigne le Dieu d’Israël et se trouve en apposition au nom divin.
- source_word: הוּא אֱלֹהִים
  choice: est Dieu
  rationale: Cette formulation rend directement l’affirmation hébraïque sans ajouter « seul » ou « le vrai », termes qui ne sont pas explicitement présents.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: dans les cieux, là-haut
  rationale: Le pluriel « les cieux » reflète שָׁמַיִם, tandis que « là-haut » préserve le contraste vertical du mérisme.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: et sur la terre, ici-bas
  rationale: Cette expression complète le mérisme cieux-terre et affirme la souveraineté universelle de Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de la confession de Rahab
  choice: est Dieu dans les cieux, là-haut, et sur la terre, ici-bas
  alternative: est le vrai Dieu; est le seul Dieu
  rationale: Le mérisme cieux-terre affirme la divinité et la souveraineté universelle de Yahweh. La traduction n’ajoute toutefois aucun marqueur explicite tel que « vrai » ou « seul », absent de cette proposition hébraïque.
- issue: Sens de רוּחַ
  choice: courage
  alternative: esprit; souffle
  rationale: Dans le contexte de la peur collective, le mot désigne la force intérieure ou le courage, non le Saint-Esprit. La note signale néanmoins l’image littérale.
translation_notes:
  register: Français international moderne, digne et accessible. L’image du cœur qui fond est conservée, tandis que la seconde expression idiomatique est explicitée par « courage ». Le couple « là-haut / ici-bas » rend de façon naturelle le contraste spatial hébreu.
