  text: וְ/הִ֖יא הֶעֱלָ֣תַ/ם הַ/גָּ֑גָ/ה וַֽ/תִּטְמְנֵ/ם֙ בְּ/פִשְׁתֵּ֣י הָ/עֵ֔ץ הָ/עֲרֻכ֥וֹת לָ֖/הּ עַל הַ/גָּֽג־׃
