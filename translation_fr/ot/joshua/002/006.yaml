  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: fr
  text: Mais elle les avait fait monter sur le toit et les avait cachés parmi les tiges de lin disposées pour elle sur le toit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל־הַגָּג
  choice: sur le toit
  rationale: Le toit-terrasse des maisons de l’époque est visé; «sur le toit» est naturel en français et suffit sans ajouter une précision absente du texte.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: parmi les tiges de lin
  rationale: L’expression désigne le lin sous forme de tiges, vraisemblablement étalées pour sécher; «tiges de lin» rend concrètement le sens sans expliciter le séchage.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: disposées pour elle
  rationale: Le participe passif féminin pluriel s’accorde avec les tiges, et לָהּ signifie littéralement «pour elle»; cette nuance est conservée plutôt que supprimée ou transformée en possession.
theological_decisions: []
