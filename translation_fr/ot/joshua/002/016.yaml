source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: fr
  text: 'Elle leur dit : « Allez vers la région montagneuse[a], de peur que ceux qui vous poursuivent ne vous rencontrent[b]. Cachez-vous là pendant trois jours, jusqu’à ce qu’ils soient revenus. Ensuite, vous pourrez reprendre votre chemin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers la montagne » ; le mot hébreu peut désigner soit une montagne précise, soit la région montagneuse environnante.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne tombent sur vous » ; le verbe désigne une rencontre qui, dans ce contexte de poursuite, serait hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: vers la région montagneuse
  rationale: הַר peut désigner une montagne précise ou une région de reliefs. Le contexte d’une zone où se cacher favorise le sens régional, tout en maintenant l’ambiguïté dans une note.
- source_word: לֵּכוּ
  choice: Allez
  rationale: L’impératif simple rend directement l’ordre urgent de Rahab.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française naturelle exprime la précaution négative introduite par פֶּן.
- source_word: יִפְגְּעוּ בָכֶם
  choice: ne vous rencontrent
  rationale: פגע avec ב signifie rencontrer ou tomber sur quelqu’un. « Rencontrer » conserve le noyau lexical sans ajouter explicitement l’idée plus forte de capture.
- source_word: הָרֹדְפִים
  choice: ceux qui vous poursuivent
  rationale: Le participe substantivé désigne les personnes lancées à leur poursuite. Cette formulation est plus courante et transparente que « les poursuivants ».
- source_word: וְנַחְבֵּתֶם
  choice: Cachez-vous
  rationale: L’impératif niphal a ici une valeur réfléchie, rendue naturellement par le verbe pronominal français.
- source_word: שָׁמָּה
  choice: là
  rationale: L’adverbe local renvoie à la région montagneuse indiquée juste avant.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: pendant trois jours
  rationale: La préposition « pendant » explicite naturellement en français l’accusatif hébreu de durée.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: jusqu’à ce qu’ils soient revenus
  rationale: Le retour des poursuivants constitue le terme de la période de cachette. Le pronom évite une répétition lourde sans obscurcir son référent.
- source_word: וְאַחַר
  choice: Ensuite
  rationale: Ce connecteur courant marque clairement la succession des actions.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: vous pourrez reprendre votre chemin
  rationale: Dans ce contexte, l’imparfait hébreu indique l’action possible après l’attente. « Reprendre votre chemin » est idiomatique et exprime le départ poursuivi vers leur destination.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs restent directs, et la syntaxe conserve la progression précise des instructions. Les notes préservent l’ambiguïté géographique de הַר et la portée lexicale de פגע.
