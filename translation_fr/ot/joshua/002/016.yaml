  source_fidelity: 'Le texte rend fidèlement la progression des impératifs et la précaution introduite par פֶּן : aller vers le relief, éviter les poursuivants, se cacher trois jours, puis repartir. « Région montagneuse » est un choix contextuellement justifié pour הָהָרָה, dont l’alternative au singulier est conservée en note. « Jusqu’à ce qu’ils soient revenus » exprime naturellement le point d’aboutissement indiqué par עַד שׁוֹב.'
  naturalness: 'Le français est moderne, clair et idiomatique. « De peur que … ne », « Cachez-vous là » et « vous pourrez reprendre votre chemin » conviennent au registre narratif direct du passage. Le pronom « ils » a un référent immédiat et non ambigu : les poursuivants.'
  terminology: « Ceux qui vous poursuivent » restitue avec transparence le participe substantivé הָרֹדְפִים. « Rencontrent » maintient la valeur lexicale de פגע sans introduire abusivement l’idée de capture ; la note indique utilement l’alternative plus contextuelle « tombent sur vous ».
