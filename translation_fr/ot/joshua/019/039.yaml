source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: fr
  text: 'Tel fut l’héritage de la tribu des descendants de Nephtali, selon leurs clans : les villes et les villages qui en dépendaient.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tel est l’héritage… » L’hébreu ne précise pas le temps dans cette proposition nominale; le passé convient au récapitulatif qui suit la liste des villes.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת נַחֲלַת
  choice: Tel fut l’héritage
  rationale: La proposition nominale hébraïque n’exprime pas explicitement le temps. Le passé convient naturellement à cette formule récapitulative après la liste des villes, tandis que « héritage » conserve la portée territoriale et l’arrière-plan d’une terre reçue.
- source_word: מַטֵּה בְנֵי נַפְתָּלִי
  choice: de la tribu des descendants de Nephtali
  rationale: מַטֶּה désigne ici la tribu. L’expression littérale « fils de Nephtali » est une désignation généalogique collective; « descendants » en restitue le sens sans laisser entendre qu’elle exclut les femmes.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte de la répartition tribale, מִשְׁפָּחָה désigne un clan plutôt que la famille nucléaire, et la préposition לְ marque ici la répartition ou le classement.
- source_word: הֶעָרִים
  choice: les villes
  rationale: « Villes » est l’équivalent conventionnel de עָרִים dans les formules territoriales de Josué, même si certaines localités étaient de taille modeste.
- source_word: וְחַצְרֵיהֶן
  choice: et les villages qui en dépendaient
  rationale: חֲצֵרִים désigne ici les établissements ruraux rattachés aux villes. Cette formulation française explicite naturellement le lien exprimé par le suffixe féminin pluriel renvoyant aux villes.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure récapitulative « Tel fut » évite un calque pesant, tandis que « descendants de Nephtali » rend clairement l’expression tribale hébraïque. Le marqueur [a] figure dans le texte principal.
