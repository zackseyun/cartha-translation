- source_word: עָצֶם
  choice: Étsem
  rationale: Nom de lieu translittéré d’après la vocalisation massorétique; « ts » représente naturellement en français la consonne צ.
- source_word: וּ / וָ
  choice: et
  rationale: La conjonction hébraïque coordonne les noms de lieux; en français, la ponctuation de l’énumération permet de ne conserver « et » qu’avant le dernier nom.
