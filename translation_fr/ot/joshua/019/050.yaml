source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: fr
  text: Sur l’ordre de Yahweh, ils lui donnèrent la ville qu’il avait demandée, Timnath-Sérah, dans la région montagneuse d’Éphraïm. Il construisit[a] la ville et s’y installa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rebâtit » ou « restaura ». Le verbe hébreu signifie normalement « construire », mais le contexte peut indiquer la reconstruction ou la remise en état d’une ville existante.'
    reason: alternative lexicale contextuelle
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: Sur l’ordre de Yahweh
  rationale: L’expression idiomatique עַל־פִּי indique ici une directive faisant autorité. « Sur l’ordre de » est naturel en français et conserve l’idée d’autorisation divine.
- source_word: נָתְנוּ לוֹ
  choice: ils lui donnèrent
  rationale: Le verbe נתן signifie simplement « donner » ; cette formulation reste proche de l’hébreu et convient au récit.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: la ville qu’il avait demandée
  rationale: שׁאל signifie « demander ». Le plus-que-parfait explicite naturellement en français que la demande précédait l’attribution.
- source_word: תִּמְנַת סֶרַח
  choice: Timnath-Sérah
  rationale: Le nom de lieu est translittéré, avec les accents et la graphie adaptés à la lecture française.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: הַר désigne ici le territoire montagneux d’Éphraïm plutôt qu’un sommet isolé.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: Il construisit la ville
  rationale: בנה signifie d’abord « construire ». Le contexte permet toutefois le sens de rebâtir ou restaurer une ville déjà existante ; cette possibilité est signalée en note sans être imposée dans le texte.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: et s’y installa
  rationale: ישׁב peut signifier habiter ou s’établir. Après l’attribution et la construction de la ville, « s’y installa » rend naturellement la progression narrative.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le tétragramme comme nom propre. « Yahweh » le représente directement au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit ; « région montagneuse » évite de faire de הַר un mont unique. La virgule autour du nom de la ville clarifie l’apposition.
