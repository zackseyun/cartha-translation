revisions:
- from: L’héritage des fils de Siméon fut pris sur le territoire des fils de Juda[a], car la part des fils de Juda était trop grande pour eux[b]. Les fils de Siméon reçurent donc leur héritage au milieu de celui de Juda.
  to: L’héritage des fils de Siméon[b] provenait de la portion des fils de Juda[a], car la part des fils de Juda était trop grande pour eux. Les fils de Siméon reçurent donc leur héritage à l’intérieur de l’héritage de Juda.
  rationale: La révision remplace une formulation passive plus interprétative par une expression de provenance conforme à la première proposition hébraïque et rend בְּתוֹךְ par « à l’intérieur de », qui marque clairement l’inclusion de l’héritage de Siméon dans celui de Juda. Les termes d’héritage et les désignations tribales littérales sont conservés.
