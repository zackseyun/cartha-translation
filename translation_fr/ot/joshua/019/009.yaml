base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: fr
  text: L’héritage des fils de Siméon[b] provenait de la portion des fils de Juda[a], car la part des fils de Juda était trop grande pour eux. Les fils de Siméon reçurent donc leur héritage à l’intérieur de l’héritage de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du territoire des fils de Juda ». Le mot hébreu peut désigner une étendue de terre mesurée et attribuée.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « les fils de Juda » et « les fils de Siméon », expressions qui désignent ici les tribus de Juda et de Siméon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: sur le territoire
  rationale: Dans ce contexte de partage du pays, חֶבֶל désigne une étendue de terre délimitée. « Sur le territoire » exprime naturellement que l’héritage de Siméon fut prélevé à l’intérieur de la portion attribuée à Juda.
- source_word: נַחֲלַת
  choice: l’héritage
  rationale: נַחֲלָה désigne ici la terre reçue en partage comme possession héréditaire; « héritage » conserve cette nuance propre au livre de Josué.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: les fils de Juda / les fils de Siméon
  rationale: La formulation garde la désignation tribale littérale de l’hébreu, intelligible en français biblique moderne, sans la remplacer silencieusement par « tribu ».
- source_word: חֵלֶק
  choice: la part
  rationale: « Part » rend la portion attribuée à Juda tout en distinguant ce terme de נַחֲלָה.
- source_word: רַב מֵ/הֶם
  choice: était trop grande pour eux
  rationale: 'Cette formulation restitue le sens comparatif: la part de Juda excédait les besoins ou la capacité d’occupation de ses membres.'
- source_word: וַ/יִּנְחֲלוּ
  choice: reçurent donc leur héritage
  rationale: Le verbe נחל indique ici l’entrée en possession de la terre attribuée. « Donc » rend la conséquence exprimée par la construction narrative après כִּי.
- source_word: בְּ/תוֹךְ נַחֲלָתָם
  choice: au milieu de celui de Juda
  rationale: La traduction exprime l’emplacement à l’intérieur de l’héritage de Juda et explicite sobrement l’antécédent du suffixe pluriel hébreu.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe initiale a été réorganisée pour être naturelle en français, tout en conservant les notions distinctes de territoire, de part et d’héritage. Le dernier pronom a été explicité par « celui de Juda » afin d’éviter une ambiguïté absente du contexte.
