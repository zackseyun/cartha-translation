  - severity: medium
    issue: « au milieu de celui de Juda » affaiblit la valeur spatiale de בְּתוֹךְ
    rationale: Dans ce verset, בְּתוֹךְ signifie que l’héritage de Siméon était situé dans les limites de celui de Juda, non nécessairement en son centre. « À l’intérieur de » restitue mieux ce sens.
