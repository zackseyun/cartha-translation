source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: fr
  text: 'Voici la part d’héritage[a] de la tribu des descendants de Dan, selon leurs clans : ces villes et leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « territoire attribué » ; le terme hébreu peut souligner soit l’attribution de la part, soit son caractère d’héritage.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Voici
  rationale: La formule présentative française rend naturellement le démonstratif hébreu dans ce récapitulatif, sans imposer un temps verbal absent de l’hébreu.
- source_word: נַחֲלַת
  choice: la part d’héritage
  rationale: Cette expression conserve à la fois l’idée d’une portion territoriale attribuée et celle d’un bien reçu en héritage.
- source_word: מַטֵּה בְנֵי דָן
  choice: de la tribu des descendants de Dan
  rationale: « Tribu » est le sens contextuel de מַטֶּה, et « descendants de Dan » rend clairement l’expression généalogique בְנֵי דָן.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte de la répartition tribale, מִשְׁפָּחוֹת désigne les subdivisions de parenté de la tribu plutôt que les seules familles nucléaires.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: Rendu direct de la formule déictique qui récapitule la liste précédente.
- source_word: וְחַצְרֵיהֶן
  choice: avec les villages qui en dépendaient
  rationale: חָצֵר désigne ici les localités secondaires rattachées aux villes; cette formulation explicite naturellement cette relation en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Voici » préserve la formule nominale hébraïque sans trancher artificiellement entre présent et passé; « part d’héritage » garde la nuance territoriale et héréditaire.
