  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: fr
  text: De là, la frontière passait vers l’est, du côté du soleil levant[a], jusqu’à Gath-Héfer, puis jusqu’à Eth-Qatsîn[b], et se dirigeait vers Rimmôn[c], qui s’étend jusqu’à Néa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie deux expressions directionnelles, littéralement « vers l’est, vers le soleil levant », probablement pour insister sur la direction.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Eth-Qatsîn » ; la première partie du nom peut aussi être comprise ou transcrite « Itta-Qatsîn ».'
    reason: alternative_reading
  - marker: c
    text: 'L’hébreu de cette proposition est difficile : littéralement, quelque chose comme « Rimmôn, le délimité, Néa ». Beaucoup comprennent que la frontière se prolongeait de Rimmôn jusqu’à Néa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: De là
  rationale: Expression naturelle dans l’enchaînement d’une description de frontière; la coordination hébraïque est portée par la continuité du récit.
- source_word: עָבַר
  choice: la frontière passait
  rationale: Le sujet implicite est explicité pour rendre clairement en français la formule territoriale.
- source_word: קֵדְמָה מִזְרָחָה
  choice: vers l’est, du côté du soleil levant
  rationale: Conserve les deux indications directionnelles de l’hébreu sans les réduire à une seule.
- source_word: גִּתָּה חֵפֶר
  choice: Gath-Héfer
  rationale: Translittération française usuelle du nom de lieu composé.
- source_word: עִתָּה קָצִין
  choice: Eth-Qatsîn
  rationale: Traité comme un toponyme conformément au découpage massorétique probable; la translittération rend le qoph par Q et le tsadé par ts.
- source_word: וְיָצָא
  choice: et aboutissait
  rationale: Dans les descriptions de limites, le verbe indique que la ligne sort vers un point ou l’atteint; « aboutissait » est naturel en français cartographique.
- source_word: רִמּוֹן
  choice: Rimmôn
  rationale: Translittération du nom de lieu.
- source_word: הַמְּתֹאָר
  choice: d’où elle se prolongeait
  rationale: Rendu contextuel prudent d’une forme difficile, comprise comme décrivant le tracé de la frontière, sans masquer l’incertitude signalée en note.
- source_word: הַנֵּעָה
  choice: jusqu’à Néa
  rationale: Compris comme le nom de lieu Néa, terme du prolongement de la frontière.
theological_decisions: []
