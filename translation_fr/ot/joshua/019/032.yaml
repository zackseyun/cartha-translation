  text: לִ/בְנֵ֣י נַפְתָּלִ֔י יָצָ֖א הַ/גּוֹרָ֣ל הַ/שִּׁשִּׁ֑י לִ/בְנֵ֥י נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: fr
  text: Pour les fils de Nephtali, le sixième lot fut tiré[a], pour les fils de Nephtali, selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « échut ». Litt. « sortit » ; le verbe hébreu désigne ici le résultat du tirage au sort.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: pour les fils de
  rationale: La préposition ל marque ici les bénéficiaires du lot. « Fils de » conserve l’expression tribale formelle de l’hébreu, tout en restant intelligible en français.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: יָצָא
  choice: sortit
  rationale: Le verbe signifie littéralement « sortir ». Dans le contexte du tirage au sort, « le lot sortit » préserve l’image hébraïque sans la remplacer par le plus interprétatif « échut ».
- source_word: הַגּוֹרָל
  choice: le lot
  rationale: Dans ce contexte, גורל désigne le lot tiré pour attribuer le territoire; « le lot » est précis et naturel.
- source_word: הַשִּׁשִּׁי
  choice: le sixième
  rationale: L’adjectif ordinal qualifie directement le lot.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre de la répartition tribale, מִשְׁפָּחוֹת désigne les subdivisions de parenté de la tribu; « clans » est plus précis que « familles » en français moderne.
