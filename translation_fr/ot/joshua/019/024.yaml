  text: וַ/יֵּצֵא֙ הַ/גּוֹרָ֣ל הַֽ/חֲמִישִׁ֔י לְ/מַטֵּ֥ה בְנֵֽי אָשֵׁ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: fr
  text: Le cinquième lot revint à la tribu des descendants d’Aser[a], selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la tribu des fils d’Aser ». On peut aussi traduire le début du verset : « Le cinquième lot fut tiré pour la tribu des fils d’Aser, selon leurs familles. »'
    reason: Alternative lexicale et formulation plus littérale du tirage au sort.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: revint
  rationale: Dans le contexte du tirage au sort des territoires, « revint à » exprime naturellement en français le résultat du lot tout en conservant l’idée qu’il est sorti en faveur d’un groupe.
- source_word: הַגּוֹרָל
  choice: lot
  rationale: « Lot » désigne ici ce qui est déterminé par tirage au sort et reste plus proche de l’hébreu que « territoire attribué » ou « partage ».
- source_word: הַחֲמִישִׁי
  choice: cinquième
  rationale: Adjectif ordinal qui qualifie directement le lot.
- source_word: לְמַטֵּה
  choice: à la tribu
  rationale: Dans ce contexte, מַטֶּה désigne idiomatiquement une tribu, et non littéralement un bâton.
- source_word: בְנֵי אָשֵׁר
  choice: des descendants d’Aser
  rationale: Littéralement « fils d’Aser »; « descendants d’Aser » rend clairement la désignation généalogique de la tribu en français moderne.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחוֹת désigne les groupements familiaux internes à la tribu; « selon » rend la valeur distributive de la préposition.
theological_decisions: []
