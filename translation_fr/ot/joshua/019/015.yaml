base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: fr
  text: 'Qattat, Nahalal, Shimron, Yidéala et Bethléem[a] : douze villes avec leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bethléem est ici un nom de lieu, et non l’expression traduite « maison du pain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: Qattath
  rationale: Nom de lieu translittéré. Le q rend le qof hébreu et le th final reflète la consonne finale, selon une forme française précise et lisible.
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Nom de lieu translittéré directement sous une forme naturelle en français.
- source_word: שִׁמְרוֹן
  choice: Shimron
  rationale: Nom de lieu translittéré; « sh » représente clairement la consonne hébraïque שׁ pour le lectorat francophone.
- source_word: יִדְאֲלָה
  choice: Yideala
  rationale: Nom de lieu translittéré en conservant le yod initial et la succession vocalique perceptible dans le texte massorétique.
- source_word: בֵית לָחֶם
  choice: Bethléem
  rationale: Forme française consacrée du toponyme; il ne convient pas de traduire littéralement ses éléments par « maison du pain ».
- source_word: עָרִים
  choice: villes
  rationale: Terme conventionnel et adéquat pour les localités recensées dans les listes territoriales.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: douze
  rationale: Nombre cardinal rendu directement et idiomatiquement en français.
- source_word: חַצְרֵיהֶן
  choice: leurs villages
  rationale: Dans ce contexte géographique, le mot désigne les villages ou établissements dépendant des villes; « villages » est clair et naturel.
theological_decisions: []
