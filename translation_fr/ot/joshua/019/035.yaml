  text: וְ/עָרֵ֖י מִבְצָ֑ר הַ/צִּדִּ֣ים צֵ֔ר וְ/חַמַּ֖ת רַקַּ֥ת וְ/כִנָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: fr
  text: Les villes fortifiées étaient Tsiddim[a], Tser, Hammath, Rakkath et Kinnéreth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les villes forteresses : Tsiddim, Tser… ».'
    reason: L’hébreu permet de comprendre מִבְצָר comme une caractérisation (« fortifiées ») ou comme un nom en construction (« villes forteresses »).
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: Les villes fortifiées étaient
  rationale: Le syntagme construit désigne des villes munies de fortifications. En français, « villes fortifiées » est naturel et précis. La copule « étaient », implicite en hébreu, est nécessaire pour introduire clairement la liste.
- source_word: הַ/צִּדִּים
  choice: Tsiddim
  rationale: Translittération française du toponyme hébreu ; l’article préfixé n’est pas rendu devant le nom de ville.
- source_word: צֵר
  choice: Tser
  rationale: Translittération adaptée aux conventions françaises, où « ts » représente ici la consonne initiale צ.
- source_word: וְ/חַמַּת
  choice: Hammath
  rationale: Le nom propre est translittéré en conservant le redoublement consonantique et la forme finale traditionnelle en « th ».
- source_word: רַקַּת
  choice: Rakkath
  rationale: Translittération du toponyme conservant le redoublement médian et distinguant la consonne finale.
- source_word: וְ/כִנָּרֶת
  choice: Kinnéreth
  rationale: Translittération française lisible du nom propre, avec accent graphique pour guider la prononciation et maintien du redoublement consonantique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les toponymes suivent une translittération adaptée au français ; la coordination initiale n’est pas rendue, car le verset forme en français une phrase de liste autonome.
