  text: וְ/שָׁ֨ב הַ/גְּב֥וּל יָ֨מָּ/ה֙ אַזְנ֣וֹת תָּב֔וֹר וְ/יָצָ֥א מִ/שָּׁ֖ם חוּקֹ֑קָ/ה וּ/פָגַ֨ע בִּ/זְבֻל֜וּן מִ/נֶּ֗גֶב וּ/בְ/אָשֵׁר֙ פָּגַ֣ע מִ/יָּ֔ם וּ/בִ֣/יהוּדָ֔ה הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: fr
  text: Puis la frontière tourna vers l’ouest jusqu’à Aznoth-Tabor et, de là, elle se prolongea jusqu’à Houqoq. Elle atteignit Zabulon au sud, Aser à l’ouest et Juda au Jourdain, vers l’est, là où le soleil se lève.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « et Juda au Jourdain, vers le levant ». La géographie est difficile, puisque le territoire de Nephtali ne touchait pas directement celui de Juda au sens habituel. Certains comprennent la formulation autrement ou supposent une difficulté textuelle; la traduction conserve ici le texte hébreu tel qu’il se présente.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Puis la frontière tournait
  rationale: Dans les descriptions de frontières, שוב indique couramment un changement de direction. L’imparfait descriptif français convient au tracé géographique suivi dans le contexte.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: Le terme signifie littéralement « vers la mer », la Méditerranée servant de repère occidental; le sens directionnel est rendu clairement.
- source_word: אַזְנוֹת תָּבוֹר
  choice: Aznoth-Tabor
  rationale: Nom de lieu translittéré, avec une graphie française lisible et proche de la forme hébraïque.
- source_word: וְיָצָא מִשָּׁם חוּקֹקָה
  choice: et, de là, elle se prolongeait jusqu’à Houqoq
  rationale: Dans une formule de délimitation, יצא décrit la continuation du tracé. « Se prolongeait jusqu’à » est naturel en français et respecte la fonction du locatif hébreu.
- source_word: וּפָגַע
  choice: elle atteignait
  rationale: Dans ce contexte territorial, פגע signifie que la frontière arrive au contact d’un territoire ou d’un repère.
- source_word: בִּזְבֻלוּן מִנֶּגֶב
  choice: Zabulon au sud
  rationale: מן avec נגב désigne ici le côté sud du contact territorial; la formulation reste concise sans préciser davantage une relation géographique ambiguë.
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: Aser à l’ouest
  rationale: מִיָּם, littéralement lié à la mer, désigne ici le côté occidental.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן
  choice: et Juda au Jourdain
  rationale: La formulation massorétique, difficile sur le plan géographique, est conservée sans correction conjecturale.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: vers l’est, là où le soleil se lève
  rationale: Cette expression rend à la fois l’orientation orientale et l’image explicite du lever du soleil présente en hébreu.
theological_decisions:
- issue: La mention géographiquement difficile de Juda au Jourdain
  choice: Conserver dans le texte principal la formulation du texte massorétique sans harmonisation.
  alternative: Comprendre « Juda » autrement, supposer une corruption de copie ou reformuler de façon à éviter l’idée d’un contact direct entre Nephtali et Juda.
  rationale: Même si la question est surtout textuelle et géographique, la traduction ne doit pas résoudre silencieusement une difficulté authentique du texte reçu.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent des formes françaises usuelles ou des translittérations lisibles. La répétition de la structure du tracé est conservée, tout en employant une syntaxe géographique naturelle.
