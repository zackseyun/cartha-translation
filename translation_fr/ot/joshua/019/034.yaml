    issue: « en direction d’Aznoth-Tabor » est moins précis
    rationale: La préposition hébraïque indique que la frontière arrive à Aznoth-Tabor. « jusqu’à Aznoth-Tabor » conserve plus directement cette fonction dans la formule de frontière.
