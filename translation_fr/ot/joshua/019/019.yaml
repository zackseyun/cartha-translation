  text: Hafaraïm[a], Shion et Anaharath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms de lieux hébreux connaissent diverses translittérations; on trouve aussi « Hapharaïm », « Shiôn » et « Anacharath ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲפָרַיִם
  choice: Hafaraïm
  rationale: Nom de lieu dans une liste de villes. La forme française translittère le toponyme plutôt que d’en proposer une traduction et conserve distinctement les deux voyelles finales.
- source_word: שִׁיאֹן
  choice: Shion
  rationale: Nom de lieu translittéré sous une forme concise et lisible en français, correspondant aux consonnes et aux voyelles du texte hébreu.
- source_word: אֲנָחֲרַת
  choice: Anaharath
  rationale: Nom de lieu translittéré. Le h médian signale sobrement la consonne gutturale hébraïque sans employer « ch », qui suggérerait en français une prononciation différente.
- source_word: וַ / וְ
  choice: virgule et « et »
  rationale: Les conjonctions hébraïques coordonnent les noms de la liste; en français naturel, une virgule suivie de « et » avant le dernier élément rend clairement cette structure.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Les trois toponymes sont translittérés et la coordination suit l’usage naturel des listes en français.
