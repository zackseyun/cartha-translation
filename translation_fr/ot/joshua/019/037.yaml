lexical_decisions:
- source_word: קֶדֶשׁ
  choice: Qédesh
  rationale: Nom de lieu translittéré selon des conventions françaises lisibles; l’accent indique naturellement la prononciation de la première syllabe.
- source_word: אֶדְרֶעִי
  choice: Édréï
  rationale: Nom de lieu translittéré; le tréma maintient la distinction vocalique finale et évite une lecture française en une seule syllabe.
- source_word: עֵין חָצוֹר
  choice: En-Hatsor
  rationale: Toponyme composé conservé comme nom propre plutôt que traduit; « En » représente עֵין dans son emploi toponymique, et « Hatsor » rend la consonne initiale ח selon une convention française courante.
- source_word: וְ
  choice: et
  rationale: Dans cette suite de villes, le français naturel coordonne les derniers éléments par un seul « et », sans reproduire mécaniquement chaque conjonction hébraïque.
