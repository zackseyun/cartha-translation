  text: Qédesh, Édréï et En-Hatsor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aïn-Hatsor »; le nom peut aussi se comprendre étymologiquement comme « Source de Hatsor ».
