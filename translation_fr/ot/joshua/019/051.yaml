source:
  edition: WLC
  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: fr
  text: Voici les héritages qu’Éléazar le prêtre, Josué fils de Noun et les chefs des familles ancestrales des tribus des fils d’Israël[a] attribuèrent par tirage au sort à Silo, devant Yahweh, à l’entrée de la tente de la rencontre. Ils achevèrent ainsi le partage du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël »; cette expression hébraïque désigne collectivement le peuple d’Israël.'
    reason: Précise la portée collective d’une expression de parenté conservée dans le texte.
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: les héritages
  rationale: Le terme désigne les possessions territoriales reçues en partage; « héritages » conserve sa portée juridique et son arrière-plan d’alliance.
- source_word: נִחֲלוּ
  choice: attribuèrent
  rationale: Dans ce contexte de répartition territoriale, le verbe exprime l’attribution des héritages par les responsables; « attribuèrent » est précis et naturel en français.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: les chefs des familles ancestrales
  rationale: Cette formulation rend la structure sociale des maisons paternelles sans recourir au calque peu naturel « chefs des pères ».
- source_word: לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: des tribus des fils d’Israël
  rationale: « Tribus » rend מַטּוֹת, tandis que « fils d’Israël » conserve l’expression de parenté collective du texte hébreu.
- source_word: בְּגוֹרָל
  choice: par tirage au sort
  rationale: Formulation française claire pour la procédure d’attribution au moyen du sort.
- source_word: בְּשִׁלֹה
  choice: à Silo
  rationale: Préposition idiomatique en français avec ce nom de lieu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: « Entrée » rend פֶּתַח et « tente de la rencontre » traduit directement la fonction désignée par אֹהֶל מוֹעֵד.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: Ils achevèrent ainsi le partage du pays
  rationale: La phrase exprime l’achèvement du processus de répartition; « pays » convient ici au territoire de Canaan envisagé comme ensemble.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre de l’alliance est conservé sous la forme « Yahweh », sans le remplacer par un titre.
- issue: Expression collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction principale maintient l’image généalogique de l’hébreu; une note précise sa valeur collective afin d’éviter de la restreindre indûment aux seuls hommes.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche de l’hébreu tout en évitant les calques opaques. Le marqueur [a] est placé après l’expression qu’il explique.
