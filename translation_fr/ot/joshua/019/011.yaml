  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: fr
  text: Leur frontière montait vers l’ouest jusqu’à Marala, atteignait Dabbésheth et atteignait le cours d’eau qui est en face de Yoqnéam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: montait
  rationale: Le verbe décrit le tracé de la frontière en fonction du relief; l’imparfait convient à une description géographique suivie.
- source_word: לַיָּמָּה
  choice: vers l’ouest
  rationale: Littéralement « vers la mer »; dans ce contexte géographique, la mer indique l’ouest.
- source_word: וּפָגַע
  choice: atteignait
  rationale: Le verbe signifie ici que la limite rencontre ou rejoint un lieu; « atteignait » est naturel en français cartographique et conserve les deux occurrences.
- source_word: הַנַּחַל
  choice: le cours d’eau
  rationale: נחל peut désigner un torrent, un ravin ou son lit; « cours d’eau » garde une certaine latitude sans imposer un débit permanent.
- source_word: עַל פְּנֵי
  choice: en face de
  rationale: Rend directement la relation spatiale indiquée par l’expression hébraïque.
