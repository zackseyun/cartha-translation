source:
  edition: WLC
  text: וּ/פָגַע֩ הַ/גְּב֨וּל בְּ/תָב֤וֹר ו/שחצומ/ה וּ/בֵ֣ית שֶׁ֔מֶשׁ וְ/הָי֛וּ תֹּצְא֥וֹת גְּבוּלָ֖/ם הַ/יַּרְדֵּ֑ן עָרִ֥ים שֵׁשׁ עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: fr
  text: 'La frontière atteignait Tabor[a], Shahatsouma et Beth-Shémesh, puis elle aboutissait au Jourdain[b] : seize villes avec les villages qui en dépendaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rencontrait »; le verbe hébreu peut désigner une ligne frontière qui entre en contact avec un lieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les issues de leur frontière étaient le Jourdain »; il s’agit d’une formule indiquant l’extrémité ou l’étendue de la frontière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: La frontière atteignait
  rationale: Dans une description territoriale, פגע indique qu’une ligne frontière entre en contact avec un lieu. « Atteignait » exprime naturellement ce rapport spatial sans préciser davantage la configuration.
- source_word: בְּתָבוֹר
  choice: Tabor
  rationale: Nom de lieu conservé sous sa forme française usuelle.
- source_word: וְשַׁחֲצוּמָה
  choice: Shahatsouma
  rationale: Translittération française du toponyme hébreu, dont la vocalisation et la forme exacte restent peu assurées.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Le nom propre est translittéré selon l’usage biblique français plutôt que traduit littéralement par « Maison du Soleil ».
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: puis elle aboutissait au Jourdain
  rationale: La formule territoriale désigne l’issue ou le point terminal de la frontière. Cette formulation française rend sa fonction géographique tout en signalant en note sa structure littérale.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: seize villes
  rationale: Traduction directe du groupe nominal et du nombre cardinal.
- source_word: וְחַצְרֵיהֶן
  choice: avec les villages qui en dépendaient
  rationale: חצר désigne ici les villages ou établissements secondaires rattachés aux villes recensées; l’explicitation de la dépendance évite l’ambiguïté du possessif français.
theological_decisions: []
