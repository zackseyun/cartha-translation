  yaml_path: translation/ot/joshua/019/018.yaml
  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: fr
  text: Leur frontière allait vers Yizréel[a], Kesoulloth et Shounem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Yizréel » porte en hébreu une terminaison directionnelle, qui peut signifier « vers Yizréel » ou « en direction de Yizréel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Leur frontière allait
  rationale: La forme narrative de היה enchaîne avec la description du territoire. En français, « allait » donne une formulation naturelle pour le tracé d’une frontière sans reproduire lourdement « et leur frontière était ».
- source_word: גְּבוּלָם
  choice: leur frontière
  rationale: גְּבוּל désigne ici la frontière du territoire attribué; le suffixe masculin pluriel est rendu par « leur ».
- source_word: יִזְרְעֶאלָה
  choice: vers Jizréel
  rationale: Le ה directionnel attaché au nom de lieu marque une orientation vers Jizréel. « vers » conserve cette nuance sans préciser indûment si la ville constitue un point d’arrivée ou une direction générale.
- source_word: הַכְּסוּלֹת
  choice: Kesoulloth
  rationale: Nom de lieu translittéré en français; l’article préfixé n’est pas rendu séparément, puisqu’il appartient ici à la forme toponymique.
- source_word: שׁוּנֵם
  choice: Shounem
  rationale: Nom de lieu translittéré selon une forme française claire et usuelle.
theological_decisions: []
