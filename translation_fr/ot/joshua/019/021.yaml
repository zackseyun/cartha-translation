translation:
  language: fr
  text: Rémeth[a], En-Gannim, En-Hadda et Beth-Patsets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Noms de lieux hébreux : « En-Gannim » signifie probablement « source des jardins » ; « En-Hadda » commence par « source », et « Beth-Patsets » par « maison de ». Le texte principal les translittère parce qu’ils servent ici de noms de villes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: Rémeth
  rationale: Nom de lieu dans une liste de villes ; il est translittéré plutôt que traduit. L’accent facilite en français la lecture de la première syllabe.
- source_word: עֵין גַּנִּים
  choice: En-Gannim
  rationale: Toponyme composé de עֵין (« source ») et de גַּנִּים (« jardins »). Comme il désigne ici une ville, la translittération est retenue dans le texte principal.
- source_word: עֵין חַדָּה
  choice: En-Hadda
  rationale: Toponyme commençant par עֵין (« source »). Le sens précis du second élément est incertain ; la translittération préserve cette incertitude.
- source_word: בֵית פַּצֵּץ
  choice: Beth-Patsets
  rationale: Toponyme composé, dont le premier élément בֵית signifie « maison de ». La translittération convient à cette liste géographique ; « ts » rend la consonne צ de manière accessible en français.
- source_word: וְ
  choice: et
  rationale: La conjonction répétée coordonne les noms. En français naturel, des virgules et un seul « et » avant le dernier élément suffisent.
