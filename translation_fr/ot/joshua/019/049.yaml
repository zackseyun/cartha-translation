  text: וַ/יְכַלּ֥וּ לִ/נְחֹל אֶת הָ/אָ֖רֶץ לִ/גְבֽוּלֹתֶ֑י/הָ וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל נַחֲלָ֛ה לִ/יהוֹשֻׁ֥עַ בִּן נ֖וּן בְּ/תוֹכָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: fr
  text: Lorsqu’ils eurent achevé de répartir le pays selon ses frontières[a], les Israélites[b] accordèrent à Josué, fils de Noun, un héritage parmi eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon ses divisions territoriales ». Le terme hébreu peut désigner les frontières elles-mêmes ou les territoires qu’elles délimitent.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: Lorsqu’ils eurent fini
  rationale: Le wayyiqtol de כלה exprime l’achèvement de l’action dans la suite narrative. La tournure temporelle française relie naturellement cet achèvement à l’action suivante.
- source_word: לִנְחֹל אֶת־הָאָרֶץ
  choice: de répartir le pays en héritages
  rationale: Dans le contexte de Josué 13–19, נחל désigne la distribution du pays comme patrimoine attribué aux tribus, et non sa simple prise de possession.
- source_word: לִגְבוּלֹתֶיהָ
  choice: selon ses territoires
  rationale: Le pluriel de גְּבוּל peut viser les limites ou les étendues délimitées. « Territoires » convient ici aux divisions géographiques du partage, tandis qu’une note conserve la nuance de frontières.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation nationale signifie littéralement « les fils d’Israël ». « Les Israélites » est la formulation française moderne la plus naturelle sans modifier le référent collectif.
- source_word: נַחֲלָה
  choice: un héritage
  rationale: Le terme désigne une part foncière attribuée et conserve ici sa portée juridique et théologique liée au don du pays.
- source_word: לִיהוֹשֻׁעַ בִּן־נוּן
  choice: à Josué, fils de Noun
  rationale: Forme française usuelle du nom et du patronyme, avec une apposition claire.
- source_word: בְּתוֹכָם
  choice: parmi eux
  rationale: La formule situe l’héritage de Josué au sein de la communauté et de ses attributions territoriales, non à l’écart.
theological_decisions:
- issue: Portée de נַחֲלָה dans le partage du pays
  choice: un héritage
  alternative: une propriété attribuée ; un lot
  rationale: « Héritage » maintient la dimension légale et théologique du pays reçu comme part accordée, sans réduire le terme à la seule possession matérielle.
- issue: Désignation בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression hébraïque est une désignation collective conventionnelle du peuple. Le français idiomatique « les Israélites » en rend le sens national, tandis que la forme littérale est signalée en note.
translation_notes:
  register: Français international actuel, narratif et digne. Le passé antérieur marque nettement l’achèvement du partage avant l’attribution faite à Josué. « En héritages » explicite la valeur distributive de נחל tout en conservant « héritage » pour le terme נַחֲלָה.
