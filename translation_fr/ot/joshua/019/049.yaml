revisions:
- from: Lorsqu’ils eurent fini de répartir le pays en héritages selon ses territoires[a], les Israélites[b] donnèrent un héritage à Josué, fils de Noun, parmi eux.
  to: Lorsqu’ils eurent achevé de répartir le pays selon ses frontières[a], les Israélites[b] accordèrent à Josué, fils de Noun, un héritage parmi eux.
  rationale: La révision supprime l’explicitation « en héritages » au premier emploi afin de suivre plus étroitement la syntaxe et la progression du texte hébreu, tout en conservant « un héritage » pour נַחֲלָה. Elle retient « frontières » comme rendu principal de גבולות et préserve en note l’ambiguïté légitime vers les divisions territoriales.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:10:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : l’achèvement du partage, l’attribution à Josué et son insertion au sein d’Israël sont conservés. Toutefois, « répartir le pays en héritages » introduit une formulation plus explicative que le texte hébreu, qui dit simplement de répartir le pays ; l’idée d’« héritage » est déjà exprimée ensuite par נַחֲלָה.'
  naturalness: Le français est globalement clair et soutenu. « Répartir le pays selon ses frontières » est plus direct et idiomatique que « répartir le pays en héritages selon ses territoires », dont l’enchaînement est un peu lourd.
  terminology: « Israélites », « Josué, fils de Noun » et « héritage » sont appropriés. La note sur « les fils d’Israël » conserve utilement la forme littérale. Pour לִגְבוּלֹתֶיהָ, « frontières » rend le sens premier, avec une note indiquant l’alternative territoriale.
  issues:
  - severity: low
    issue: Ajout interprétatif dans « en héritages »
    rationale: L’infinitif לנחל porte bien l’idée de répartition pour héritage, mais le texte ne répète pas ici le substantif « héritages ». Le conserver seulement pour נַחֲלָה évite une explicitation redondante.
  - severity: low
    issue: Rendu principal de לִגְבוּלֹתֶיהָ
    rationale: « Selon ses territoires » est défendable, mais « selon ses frontières » correspond plus directement à גבול. L’alternative territoriale doit être maintenue en note.
  revised_text: Lorsqu’ils eurent achevé de répartir le pays selon ses frontières[a], les Israélites[b] accordèrent à Josué, fils de Noun, un héritage parmi eux.
  revised_footnotes:
