  text: Yehoud, Bené-Béraq[a] et Gath-Rimmôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, les éléments de ce nom peuvent aussi signifier « fils de Béraq » ; ici, le contexte désigne la ville de Bené-Béraq.
    reason: lexical_alternative
  - marker: b
    text: Ou « Gath Rimmôn » ; l’hébreu présente ce nom de lieu en deux éléments.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהֻד
  choice: Yehoud
  rationale: Nom de ville dans une liste territoriale. La forme « Yehoud » translittère naturellement l’hébreu en français, sans traduire le toponyme.
- source_word: וּבְנֵי בְרַק
  choice: Bené-Bérak
  rationale: Le contexte impose d’y reconnaître un seul nom de ville. La graphie avec trait d’union rend cette unité claire tout en restant proche des deux éléments hébreux.
- source_word: וְגַת רִמּוֹן
  choice: Gath-Rimmôn
  rationale: Nom de lieu composé de deux éléments. Le trait d’union évite que le lecteur français les prenne pour deux villes distinctes, et l’accent circonflexe indique la voyelle longue de la translittération usuelle.
theological_decisions: []
translation_notes:
  register: Style bref adapté à une liste de villes. Les toponymes sont translittérés dans une graphie française actuelle et lisible ; aucune information absente de l’hébreu n’est ajoutée au corps du verset.
