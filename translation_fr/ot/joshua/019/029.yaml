revisions:
- from: Puis la frontière tournait vers Rama et allait jusqu’à la ville fortifiée de Tyr. Ensuite, elle tournait vers Hosa et aboutissait à la mer, du côté du territoire d’Akzib[a].
  to: Puis la frontière tourne vers Rama, jusqu’à la ville fortifiée de Tyr ; puis elle tourne vers Hosa, et ses extrémités atteignent la mer, à partir du territoire d’Akzib[a].
  rationale: La révision conserve le tracé et les noms propres du projet, mais restitue plus précisément la préposition hébraïque מִן et le pluriel de תֹצְאֹתָיו. Elle maintient l’incertitude du rapport géographique au moyen d’une note explicitement ancrée à Akzib.
