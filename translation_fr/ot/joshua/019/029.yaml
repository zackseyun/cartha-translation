  text: וְ/שָׁ֤ב הַ/גְּבוּל֙ הָֽ/רָמָ֔ה וְ/עַד עִ֖יר מִבְצַר צֹ֑ר וְ/שָׁ֤ב הַ/גְּבוּל֙ חֹסָ֔ה ו/יהיו תֹצְאֹתָ֛י/ו הַ/יָּ֖מָּ/ה מֵ/חֶ֥בֶל אַכְזִֽיבָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: fr
  text: Puis la frontière tourne vers Rama, jusqu’à la ville fortifiée de Tyr ; puis elle tourne vers Hosa, et ses extrémités atteignent la mer, à partir du territoire d’Akzib[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis la région d’Akzib » ou « depuis le district d’Akzib ». Le rapport géographique précis exprimé par l’hébreu demeure incertain.'
    reason: La préposition « à partir de » rend le sens de base de מִן, tandis que חֶבֶל peut désigner un territoire, une région ou un district.
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Puis la frontière tournait / Ensuite, elle tournait
  rationale: Dans les descriptions territoriales, שׁוּב signale couramment un changement de direction. « Tournait » rend ce mouvement avec naturel, tandis que le pronom évite une répétition pesante dans la seconde proposition.
- source_word: הָרָמָה
  choice: vers Rama
  rationale: Le ה final marque ici la direction vers le lieu nommé Rama; il ne signifie pas « vers la mer » ou « vers l’ouest ».
- source_word: וְעַד עִיר מִבְצַר צֹר
  choice: et allait jusqu’à la ville fortifiée de Tyr
  rationale: עַד indique l’extension jusqu’à Tyr, tandis que עִיר מִבְצַר décrit celle-ci comme une ville fortifiée. L’ajout de « allait » explicite naturellement en français le mouvement sous-entendu.
- source_word: חֹסָה
  choice: Hosa
  rationale: Transcription française simple du nom de lieu hébreu.
- source_word: וַיהיו תֹצְאֹתָיו הַיָּמָּה
  choice: et aboutissait à la mer
  rationale: Dans les formules de délimitation, תֹצְאוֹת désigne l’issue ou l’extrémité d’une frontière. Le singulier français reprend naturellement « la frontière », et הַיָּמָּה indique la direction de la mer, vraisemblablement la Méditerranée.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: du côté du territoire d’Akzib
  rationale: חֶבֶל peut désigner une étendue délimitée, un territoire ou une région. « Du côté du territoire » conserve le rapport géographique sans imposer une précision administrative absente de l’hébreu.
theological_decisions: []
