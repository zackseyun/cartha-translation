  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: fr
  text: et les eaux du Yarkôn[a] et Rakkôn, avec le territoire en face de Jaffa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi être compris comme le nom de lieu « Mé-Yarkôn », plutôt que comme l’expression « les eaux du Yarkôn ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec la frontière en face de Jaffa » ou « avec la limite en face de Jaffa ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵי
  choice: les eaux du
  rationale: מֵי est l’état construit pluriel de מַיִם, « eaux ». Dans cette liste géographique, l’expression désigne naturellement un cours d’eau ou un élément hydrographique associé au Yarkôn; la conjonction initiale se rend implicitement dans la continuité de la liste.
- source_word: הַיַּרְקוֹן
  choice: Yarkôn
  rationale: Nom géographique translittéré sous une forme proche de l’hébreu; l’article hébreu n’est pas reproduit séparément dans le nom propre.
- source_word: וְהָרַקּוֹן
  choice: et Rakkôn
  rationale: Nom géographique translittéré; la conjonction est explicitement rendue et l’article hébreu n’est pas calqué.
- source_word: עִם
  choice: avec
  rationale: Rend directement la préposition et relie les lieux précédents à l’indication territoriale qui suit.
- source_word: הַגְּבוּל
  choice: le territoire
  rationale: גְּבוּל peut désigner une frontière, une limite ou un territoire. Ici, « territoire » convient à l’énumération de lieux, tout en laissant en note les autres possibilités.
- source_word: מוּל
  choice: en face de
  rationale: Expression française naturelle pour la relation spatiale « vis-à-vis de, face à » exprimée par מוּל.
- source_word: יָפוֹ
  choice: Jaffa
  rationale: Forme moderne internationale française courante du nom de la ville biblique anciennement appelée Joppé en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les noms sont translittérés de façon lisible; « Jaffa » emploie la forme française actuelle. L’ambiguïté de מֵי et la polysémie de גְּבוּל sont conservées en notes.
