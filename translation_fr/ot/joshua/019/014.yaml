  text: וְ/נָסַ֤ב אֹת/וֹ֙ הַ/גְּב֔וּל מִ/צְּפ֖וֹן חַנָּתֹ֑ן וְ/הָיוּ֙ תֹּֽצְאֹתָ֔י/ו גֵּ֖י יִפְתַּח אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: fr
  text: Puis la frontière le contourna au nord de Hannaton[a], et ses extrémités[b] aboutirent à la vallée de Yifta-El.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis le nord de Hannaton ». La construction hébraïque peut être comprise comme une indication de position (« au nord de Hannaton ») ou comme un point de départ directionnel (« depuis le nord de Hannaton »).'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses sorties » ; dans une description de frontière, cette expression désigne ses extrémités ou ses points d’aboutissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Puis … contournait
  rationale: Dans les descriptions de frontières, נָסַב indique que la ligne tourne ou décrit une courbe autour d’un point. « Contournait » rend naturellement ce mouvement en français.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom objet masculin singulier est conservé sans préciser davantage son référent, que le contexte géographique antérieur doit fournir.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: Dans le contexte du partage territorial, גְּבוּל désigne la ligne qui délimite un territoire.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: au nord de Hannaton
  rationale: La formule peut situer la frontière par rapport au côté nord de Hannaton. Une lecture plus directionnelle reste possible et est signalée en note.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: et ses extrémités aboutissaient
  rationale: תֹּצָאוֹת est un terme technique des tracés territoriaux désignant les points terminaux d’une frontière. Le pluriel hébreu est maintenu, tandis que « aboutissaient » donne un français géographique naturel.
- source_word: גֵּי
  choice: la vallée de
  rationale: גֵּי désigne une vallée ou un ravin; ici, le mot appartient à la désignation géographique du lieu.
- source_word: יִפְתַּח אֵל
  choice: Yifta-El
  rationale: Le nom de lieu est translittéré directement de l’hébreu selon une forme lisible en français, plutôt que traduit.
