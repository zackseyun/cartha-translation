lexical_decisions:
- source_word: וְ
  choice: virgule, puis « et » devant le dernier nom
  rationale: Dans une énumération française, cette coordination est plus naturelle que la répétition de « et » devant chaque nom, tout en conservant clairement la structure de la liste hébraïque.
- source_word: שַׁעֲלַבִּין
  choice: Shaalabbîn
  rationale: Translittération française du toponyme, qui rend notamment la consonne redoublée et la voyelle longue finale. La note signale les formes bibliques apparentées.
- source_word: אַיָּלוֹן
  choice: Ayalôn
  rationale: Translittération directe et naturelle en français du nom de lieu hébreu.
- source_word: יִתְלָה
  choice: Yitla
  rationale: Translittération proche de la forme hébraïque de ce verset; la variante traditionnelle française est indiquée en note.
