  text: וְ/שָׁ֣ב מִ/שָּׂרִ֗יד קֵ֚דְמָ/ה מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ עַל גְּב֥וּל כִּסְלֹ֖ת תָּבֹ֑ר וְ/יָצָ֥א אֶל הַ/דָּֽבְרַ֖ת וְ/עָלָ֥ה יָפִֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: fr
  text: Puis la frontière se tournait de Sarid vers l’est[a], du côté du soleil levant, atteignait la frontière de Kisloth-Tabor, continuait jusqu’à Daberath et montait à Japhia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers l’est, vers l’orient » ; littéralement « vers l’est, au levant du soleil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Puis la frontière repartait
  rationale: Dans une description territoriale, le verbe שׁוב signale ici un changement de direction du tracé. Le sujet explicite « la frontière », repris du contexte, et l’imparfait descriptif rendent naturellement le mouvement en français.
- source_word: מִשָּׂרִיד
  choice: de Sarid
  rationale: Le nom de lieu est translittéré, et la préposition מן indique le point de départ de cette portion du tracé.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: vers l’est, du côté du soleil levant
  rationale: Cette formulation conserve les deux indications orientales de l’hébreu sans les réduire à une seule, tout en restant naturelle en français moderne.
- source_word: עַל גְּבוּל
  choice: atteignait la frontière de
  rationale: Dans ce contexte de déplacement, עַל avec גְּבוּל désigne l’arrivée du tracé à la limite territoriale; « atteignait » exprime clairement cette relation.
- source_word: כִּסְלֹת תָּבֹר
  choice: Kisloth-Tabor
  rationale: Nom de lieu composé, translittéré avec un trait d’union afin d’en manifester l’unité.
- source_word: וְיָצָא
  choice: continuait jusqu’à
  rationale: Dans les descriptions de frontières, יצא décrit la progression ou le prolongement d’un tracé. Cette traduction idiomatique évite l’expression peu naturelle « sortait vers ».
- source_word: אֶל הַדָּבְרַת
  choice: jusqu’à Daberath
  rationale: Le nom propre est translittéré sans article, conformément à l’usage français; אֶל marque ici le point atteint.
- source_word: וְעָלָה
  choice: et montait à
  rationale: Le verbe עלה conserve l’idée topographique d’une montée vers un lieu situé plus haut.
- source_word: יָפִיעַ
  choice: Japhia
  rationale: Translittération française traditionnelle et intelligible du nom propre hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase explicite « la frontière », sous-entendue dans ce verset mais fournie par le contexte, et emploie l’imparfait pour la continuité du relevé territorial. Les toponymes suivent des formes françaises usuelles ou des translittérations transparentes.
