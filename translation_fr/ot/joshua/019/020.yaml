lexical_decisions:
- source_word: הָרַבִּית
  choice: Harabbith
  rationale: Nom de lieu translittéré selon la vocalisation massorétique; en français, conserver le h initial représente clairement la forme hébraïque complète.
- source_word: קִשְׁיוֹן
  choice: Qishôn
  rationale: Nom de lieu translittéré en français; « Q » représente le qof, « sh » le shin, et l'accent circonflexe signale la voyelle longue de la syllabe finale.
- source_word: אָבֶץ
  choice: Ébets
  rationale: Nom de lieu translittéré selon une forme française naturelle; « ts » représente le tsadé final.
- source_word: וְ / וָ
  choice: et
  rationale: La conjonction coordonne les trois noms. En français naturel, un seul « et » avant le dernier élément suffit, sans altérer la fonction de la liste.
