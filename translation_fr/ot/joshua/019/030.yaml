  text: וְ/עֻמָ֥ה וַ/אֲפֵ֖ק וּ/רְחֹ֑ב עָרִ֛ים עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/030.yaml
  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: fr
  text: 'Oumma, Afek et Rehob : vingt-deux villes, avec les villages qui en dépendaient.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec leurs hameaux » ou « avec les localités qui en dépendaient »; le terme hébreu désigne ici des établissements ruraux associés aux villes mentionnées.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: Oumma
  rationale: Nom de lieu translittéré selon les conventions françaises, en représentant la consonne redoublée de la forme hébraïque vocalisée.
- source_word: אֲפֵק
  choice: Afek
  rationale: Translittération française naturelle du toponyme hébreu, avec « f » pour la consonne spirantisée.
- source_word: רְחֹב
  choice: Rehob
  rationale: Nom de lieu translittéré; « h » conserve de façon lisible la consonne gutturale sans imposer une graphie savante.
- source_word: עָרִים
  choice: villes
  rationale: Terme conventionnel dans les listes territoriales de Josué; il n'implique pas nécessairement de grandes agglomérations.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: vingt-deux
  rationale: Rend directement le nombre cardinal hébreu récapitulant les localités.
- source_word: חַצְרֵיהֶן
  choice: les villages qui en dépendaient
  rationale: Dans ce contexte territorial, le mot désigne des établissements ruraux rattachés aux villes citées; cette formulation exprime clairement cette relation en français courant.
