  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: fr
  text: 'Tel fut l’héritage de la tribu des descendants d’Aser, selon leurs clans : ces villes et leurs villages.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « Tel est l’héritage […] : ces villes et leurs localités. » Le terme hébreu rendu par « villages » peut désigner des établissements ruraux ou non fortifiés associés aux villes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Tel fut
  rationale: Le démonstratif féminin renvoie au territoire qui vient d’être décrit. Le passé convient à cette formule récapitulative dans le récit, tandis que « Tel est » resterait possible dans une traduction plus formelle.
- source_word: נַחֲלַת
  choice: le territoire attribué
  rationale: Dans le contexte du partage du pays, נַחֲלָה désigne la part territoriale reçue par la tribu. Cette formulation française exprime clairement le sens concret sans exclure la notion d’héritage.
- source_word: מַטֵּה בְנֵי אָשֵׁר
  choice: la tribu des descendants d’Aser
  rationale: מַטֵּה désigne ici la tribu, et בְנֵי אָשֵׁר ses membres issus d’Aser. « Descendants » est plus naturel en français actuel que le calque « fils d’Aser ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne les subdivisions familiales de la tribu, et la préposition לְ a ici une valeur distributive.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: עָרִים est le terme courant pour des localités urbaines; « villes » conserve l’usage biblique habituel sans présumer leur taille moderne.
- source_word: וְחַצְרֵיהֶן
  choice: et les localités qui en dépendaient
  rationale: חָצֵר désigne ici des établissements ruraux ou non fortifiés rattachés aux villes énumérées. La formulation explicite cette relation de dépendance.
