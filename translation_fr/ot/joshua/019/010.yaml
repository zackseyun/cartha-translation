id: JOS.19.10
reference: Joshua 19:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: fr
  text: Le troisième lot échut aux descendants de Zabulon[a], selon leurs clans. La frontière de leur héritage s’étendait jusqu’à Sarid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « monta pour les descendants de Zabulon »; dans le contexte d’un tirage au sort, on peut aussi traduire : « fut tiré pour les descendants de Zabulon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: échut
  rationale: Dans le contexte d’un tirage au sort, « échut » exprime naturellement en français le résultat du lot, tout en restant proche de l’idée hébraïque selon laquelle le lot « monta ».
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: le troisième lot
  rationale: Rend directement le nom et l’adjectif ordinal, dans le contexte de la répartition du pays par tirage au sort.
- source_word: לִבְנֵי זְבוּלֻן
  choice: aux descendants de Zabulon
  rationale: « Descendants » rend ici l’expression tribale בני de manière naturelle et inclusive, sans donner à entendre qu’il s’agit seulement des fils immédiats de Zabulon.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre tribal de Josué, משפחה désigne les subdivisions claniques; la préposition ל a ici une valeur distributive.
- source_word: גְּבוּל נַחֲלָתָם
  choice: la frontière de leur héritage
  rationale: « Frontière » désigne la limite géographique, tandis qu’« héritage » conserve la nuance de terre reçue en partage.
- source_word: עַד שָׂרִיד
  choice: jusqu’à Sarid
  rationale: עַד marque l’étendue de la frontière jusqu’au lieu nommé Sarid.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Échut » appartient à un registre légèrement soutenu mais demeure courant dans l’expression du résultat d’un tirage au sort. La seconde proposition devient une phrase distincte pour éviter une coordination lourde sans modifier le sens.
