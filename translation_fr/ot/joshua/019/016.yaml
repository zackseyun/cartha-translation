  text: זֹ֛את נַחֲלַ֥ת בְּנֵֽי זְבוּלֻ֖ן לְ/מִשְׁפְּחוֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/016.yaml
  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: fr
  text: 'Tel fut[a] l’héritage des fils de Zabulon, selon leurs clans : ces villes et les villages qui en dépendaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tel est l’héritage ». L’hébreu emploie un démonstratif dans une proposition sans verbe, que cette formule récapitulative permet de rendre au présent ou au passé.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Tel fut
  rationale: Le démonstratif féminin ouvre une proposition sans verbe et renvoie à la part territoriale qui vient d’être décrite. « Tel fut » rend naturellement en français cette formule récapitulative dans un récit au passé, sans nier la possibilité formelle du présent.
- source_word: נַחֲלַת
  choice: l’héritage
  rationale: Dans le contexte du partage du pays, נַחֲלָה désigne une part reçue en héritage. « Héritage » conserve mieux la portée juridique et liée à la promesse que le terme plus administratif « lot ».
- source_word: בְּנֵי זְבוּלֻן
  choice: des fils de Zabulon
  rationale: La traduction conserve l’expression familiale littérale, employée collectivement pour les descendants et la tribu de Zabulon.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: La préposition ל marque ici la répartition selon les subdivisions de la tribu, et מִשְׁפָּחוֹת désigne les clans plutôt que les seules familles nucléaires.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: L’expression définie récapitule les centres urbains précédemment énumérés. « Villes » est le terme français courant dans les listes territoriales de Josué.
- source_word: וְחַצְרֵיהֶן
  choice: et les villages qui en dépendaient
  rationale: חָצֵר désigne ici les localités rurales rattachées aux villes. Cette formulation explicite naturellement en français le lien exprimé par le suffixe possessif féminin pluriel hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le deux-points restitue la fonction récapitulative de « ces villes et les villages qui en dépendaient », tandis que la formulation évite l’ambiguïté que pourrait créer le simple possessif « leurs villages ».
