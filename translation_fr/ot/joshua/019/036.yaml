lexical_decisions:
- source_word: אֲדָמָה
  choice: Adama
  rationale: Nom de lieu dans une liste de villes. La translittération française courante est retenue plutôt qu’une traduction par « terre » ou « sol ».
- source_word: הָרָמָה
  choice: Rama
  rationale: Nom de lieu précédé de l’article en hébreu. En français biblique courant, l’article n’est pas rendu séparément et la forme établie « Rama » est naturelle.
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Nom propre de lieu, rendu selon une translittération française usuelle qui représente la consonne initiale ח par « h » et צ par « ts ».
- source_word: וְ
  choice: et
  rationale: La conjonction coordonne les noms de lieux; en français, elle est exprimée naturellement devant le dernier élément de la liste.
