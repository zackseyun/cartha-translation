  text: Ebron[a], Rehob, Hammon, and Kanah, as far as Great Sidon.
translation:
  language: fr
  text: Ébron[a], Rehob, Hammon et Kana, jusqu’à Sidon la Grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : «Ébron»; certaines traditions textuelles et traductions lisent «Abdon».'
