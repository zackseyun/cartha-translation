lexical_decisions:
- source_word: עֶבְרֹן
  choice: Ébron
  rationale: Translittération naturelle en français du toponyme porté par le texte massorétique; l’accent initial facilite la prononciation française. La variante «Abdon» est signalée en note.
- source_word: רְחֹב
  choice: Rehob
  rationale: Translittération française usuelle du nom de lieu, sans notation technique de la consonne gutturale.
- source_word: חַמּוֹן
  choice: Hammon
  rationale: Translittération directe du toponyme hébreu, avec maintien de la consonne redoublée.
- source_word: קָנָה
  choice: Kana
  rationale: Forme francisée lisible du toponyme, où «k» représente clairement la consonne hébraïque ק.
- source_word: עַד
  choice: jusqu’à
  rationale: Exprime naturellement en français la limite ou l’étendue territoriale indiquée par la préposition.
- source_word: צִידוֹן רַבָּה
  choice: Sidon la Grande
  rationale: Rend l’adjectif postposé רַבָּה dans un ordre français naturel tout en conservant sa fonction distinctive appliquée à la ville.
