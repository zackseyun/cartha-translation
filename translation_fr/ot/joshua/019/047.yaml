  source_fidelity: La première proposition hébraïque est difficile et doit rester spatialement ambiguë. « Au-delà de leurs limites » introduit le mot et l’idée de « limites », absents du texte, et atténue l’ambiguïté de מֵהֶם (« d’eux »). Le reste rend fidèlement la progression narrative, y compris la prise, l’attaque au fil de l’épée, la possession et le changement de nom.
  naturalness: Le français est globalement naturel et digne. La formulation révisée conserve une légère difficulté contrôlée au premier membre, explicitée par la note, plutôt que de lui donner une précision non attestée. La suppression de « donc » évite d’ajouter une relation logique explicite.
  terminology: « Fils de Dan », « Léshem », « au fil de l’épée », « prirent possession » et « leur père » conviennent au registre biblique moderne et suivent le texte hébreu. « Mirent ... au fil de l’épée » est l’expression française idiomatique pour l’idiome militaire hébreu.
