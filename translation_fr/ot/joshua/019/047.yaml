revisions:
- from: Mais le territoire des fils de Dan s’étendit au-delà de leurs limites[a]. Les fils de Dan montèrent donc combattre Léshem. Ils s’en emparèrent et la passèrent au fil de l’épée ; ils en prirent possession et s’y établirent. Ils donnèrent à Léshem le nom de Dan[b], d’après le nom de Dan, leur père.
  to: Mais le territoire des fils de Dan s’étendit au-delà d’eux[a]. Les fils de Dan montèrent combattre Léshem. Ils s’en emparèrent et la mirent au fil de l’épée ; ils en prirent possession et s’y établirent. Ils donnèrent à Léshem le nom de Dan[b], d’après le nom de Dan, leur père.
  rationale: La révision retire l’ajout interprétatif « leurs limites » et rend מֵהֶם par « d’eux », en préservant l’ambiguïté spatiale signalée par la note. Elle supprime aussi « donc », non exprimé dans l’hébreu. Les autres choix sont maintenus; « la mirent au fil de l’épée » restitue naturellement l’idiome militaire sans explicitation doctrinale ou historique supplémentaire.
