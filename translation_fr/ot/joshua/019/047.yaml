  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: fr
  text: Mais le territoire des fils de Dan s’étendit au-delà d’eux[a]. Les fils de Dan montèrent combattre Léshem. Ils s’en emparèrent et la mirent au fil de l’épée ; ils en prirent possession et s’y établirent. Ils donnèrent à Léshem le nom de Dan[b], d’après le nom de Dan, leur père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « la frontière des fils de Dan s’étendit au-delà d’eux ». Certaines traductions comprennent, d’après le contexte : « le territoire des fils de Dan était trop petit pour eux » ; toutefois, la formulation hébraïque est plus littéralement spatiale.'
    reason: alternative_reading
  - marker: b
    text: Léshem est associée à Laïsh en Juges 18.7, 14, 27, 29.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: le territoire des fils de Dan s’étendit au-delà de leurs limites
  rationale: גְבוּל peut désigner une frontière ou un territoire. La formulation hébraïque difficile, littéralement spatiale, est conservée sans introduire dans le texte l’interprétation selon laquelle le territoire aurait été trop petit.
- source_word: בְּנֵי דָן
  choice: les fils de Dan
  rationale: Cette expression garde visible l’idiome familial et tribal de l’hébreu, tout en restant intelligible en français biblique courant.
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: עלה exprime normalement une montée, géographique ou militaire. « Montèrent » en préserve sobrement l’image.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: combattre Léshem
  rationale: Le verbe signifie combattre ou faire la guerre. Cette formulation française naturelle traite le nom de la ville comme la cible de l’action.
- source_word: לֶשֶׁם
  choice: Léshem
  rationale: Le texte massorétique porte לֶשֶׁם. La translittération française « Léshem » respecte cette forme plutôt que de la remplacer par Laïsh.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: ils s’en emparèrent
  rationale: לכד désigne la prise militaire d’une ville. « S’en emparèrent » est naturel et précis en français.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: la passèrent au fil de l’épée
  rationale: Cette tournure française conserve l’image de l’expression hébraïque « à la bouche/au tranchant de l’épée » et son sens militaire.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: ils en prirent possession
  rationale: ירשׁ signifie ici prendre possession, avec la possible implication d’une dépossession, sans qu’il soit nécessaire d’expliciter davantage.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: s’y établirent
  rationale: ישׁב peut signifier habiter ou demeurer. Dans le contexte de la conquête d’une ville, « s’y établirent » rend naturellement le résultat durable.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: ils donnèrent à Léshem le nom de Dan
  rationale: Cette formulation exprime clairement en français l’acte de renommer la ville tout en suivant de près la construction hébraïque.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: d’après le nom de Dan, leur père
  rationale: אָב peut désigner un père ou un ancêtre. « Leur père » conserve l’idiome généalogique et tribal du texte sans l’expliquer excessivement.
