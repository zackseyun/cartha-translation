  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: fr
  text: ainsi qu’Allammélek, Amad et Mishal. La frontière atteignait le Carmel vers l’ouest[a], et le Shihor-Libnath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la mer » ; dans ce contexte géographique, il s’agit de l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: Alammélek
  rationale: Nom de lieu transcrit en suivant les conventions françaises, avec un accent pour guider naturellement la prononciation.
- source_word: עַמְעָד
  choice: Amad
  rationale: Nom de lieu transcrit sous une forme française simple et lisible.
- source_word: מִשְׁאָל
  choice: Misheal
  rationale: Nom de lieu transcrit selon la forme française biblique usuelle, qui distingue les consonnes du nom hébreu.
- source_word: וּפָגַע
  choice: La frontière atteignait
  rationale: Dans une description territoriale, פגע indique que la limite atteint ou rencontre un repère. L’ajout explicite de « la frontière », fourni par le contexte, rend la phrase naturelle en français.
- source_word: בְּכַרְמֶל
  choice: le Carmel
  rationale: Avec le verbe « atteindre », le complément direct exprime naturellement en français le point atteint par la frontière.
- source_word: הַיָּמָּה
  choice: vers l’ouest
  rationale: L’expression signifie littéralement « vers la mer », mais désigne ici la direction de l’ouest dans le langage géographique hébreu.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: puis le Shihor-Libnath
  rationale: Le toponyme composé est transcrit et relié par un trait d’union. « Puis » poursuit naturellement le tracé sans imposer une relation géographique plus précise que le texte.
