  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: fr
  text: Pour la tribu des fils de Dan, selon leurs clans, le septième lot sortit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: pour la tribu de
  rationale: 'Dans ce contexte de partage territorial, מַטֶּה désigne une tribu, et le préfixe לְ marque naturellement en français le bénéficiaire de l’attribution : « pour ».'
- source_word: בְנֵי דָן
  choice: les fils de Dan
  rationale: Cette formulation conserve l’expression hébraïque de parenté tout en restant claire et digne en français moderne.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחוֹת désigne ici les subdivisions de la tribu; « clans » évite le sens trop domestique que pourrait suggérer « familles ».
- source_word: יָצָא
  choice: sortit
  rationale: Le verbe signifie littéralement « sortir ». Appliqué au tirage au sort, « le lot sortit » est compréhensible et demeure proche de la formulation hébraïque.
- source_word: הַגּוֹרָל
  choice: le lot
  rationale: גוֹרָל est le terme courant pour le lot employé lors de l’attribution des territoires.
- source_word: הַשְּׁבִיעִי
  choice: le septième
  rationale: L’ordinal indique directement la place de ce lot dans la suite des attributions.
