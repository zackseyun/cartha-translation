  text: וַ/יְהִ֖י גְּב֣וּל נַחֲלָתָ֑/ם צָרְעָ֥ה וְ/אֶשְׁתָּא֖וֹל וְ/עִ֥יר שָֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: fr
  text: La frontière de leur héritage comprenait Tsorea, Eshtaol et Ir-Shémesh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ir-Shémesh signifie « ville du soleil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La frontière … comprenait
  rationale: Le waw consécutif relie ce verset au récit précédent. En français, la continuité est suffisamment portée par le contexte; « comprenait » introduit naturellement la liste des villes sans rendre lourdement la tournure hébraïque « et fut ».
- source_word: גְּבוּל
  choice: frontière
  rationale: Dans le contexte du partage territorial, le terme désigne la limite ou, par extension, le territoire délimité. « Frontière » conserve son sens premier, tandis que le verbe « comprenait » rend la liste qui suit naturelle en français.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: Le nom désigne ici la part territoriale attribuée à la tribu de Dan. « Héritage » préserve la portée foncière et théologique du terme sans ajouter « attribué », absent de l’hébreu.
- source_word: צָרְעָה
  choice: Tsorea
  rationale: Translittération française courante du nom de lieu hébreu.
- source_word: אֶשְׁתָּאוֹל
  choice: Eshtaol
  rationale: Translittération française claire et usuelle du nom de lieu hébreu.
- source_word: עִיר שָׁמֶשׁ
  choice: Ir-Shémesh
  rationale: Le nom de lieu est translittéré dans le texte principal. Sa signification transparente est indiquée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite le calque peu naturel « Et la frontière de leur héritage fut » tout en conservant « frontière » et « héritage », termes importants du texte source. Les toponymes sont translittérés selon des formes françaises lisibles.
