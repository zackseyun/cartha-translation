id: JOS.19.23
reference: Joshua 19:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי יִשָּׂשכָ֖ר לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: fr
  text: 'Tel fut l’héritage de la tribu des descendants d’Issacar[a], selon leurs clans : les villes et les villages qui en dépendaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tel est l’héritage… » L’hébreu ne comporte ici aucun verbe exprimé; cette formule récapitulative peut donc être rendue au présent ou au passé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Tel fut
  rationale: Le démonstratif féminin singulier renvoie à la part territoriale qui vient d’être décrite. La proposition hébraïque est sans verbe exprimé; le passé convient au récit rétrospectif français, tandis qu’une note conserve la possibilité du présent.
- source_word: נַחֲלַת
  choice: l’héritage
  rationale: Dans Josué, נַחֲלָה désigne le territoire reçu en partage et en héritage. « Héritage » garde la portée foncière et traditionnelle du terme.
- source_word: מַטֵּה
  choice: la tribu
  rationale: Dans ce contexte de répartition du pays, מַטֶּה désigne sans ambiguïté une tribu.
- source_word: בְנֵי יִשָּׂשכָר
  choice: des descendants d’Issacar
  rationale: Littéralement « fils d’Issacar ». En français actuel, « descendants d’Issacar » exprime naturellement l’appartenance généalogique de la tribu sans suggérer uniquement des fils immédiats.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחוֹת désigne ici les subdivisions de la tribu; la préposition לְ a une valeur distributive rendue par « selon ».
- source_word: הֶעָרִים
  choice: les villes
  rationale: עָרִים désigne les centres habités mentionnés dans la liste territoriale; « villes » est le terme conventionnel et intelligible dans ce contexte.
- source_word: וְחַצְרֵיהֶן
  choice: et les villages qui en dépendaient
  rationale: חֲצֵרִים désigne ici les établissements ruraux rattachés aux villes. L’explicitation « qui en dépendaient » rend le rapport exprimé par le suffixe féminin pluriel renvoyant aux villes.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le caractère récapitulatif du verset, avec une ponctuation qui présente les villes et leurs villages comme le contenu concret de l’héritage.
