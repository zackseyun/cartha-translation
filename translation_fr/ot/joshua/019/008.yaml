source:
  edition: WLC
  text: וְ/כָל הַֽ/חֲצֵרִ֗ים אֲשֶׁ֤ר סְבִיבוֹת֙ הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה עַד בַּֽעֲלַ֥ת בְּאֵ֖ר רָ֣אמַת נֶ֑גֶב זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: fr
  text: ainsi que tous les villages situés autour de ces villes, jusqu’à Baalath-Béer, Ramath-Néguev[a]. Tel fut l’héritage de la tribu des descendants de Siméon, selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Baalath-Béer, c’est-à-dire Ramath-Néguev », si le second nom identifie le premier.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: ainsi que tous les villages
  rationale: La conjonction rattache ce verset à la liste précédente; « ainsi que » exprime naturellement l’ajout. Dans ce relevé territorial, חֲצֵרִים désigne des villages ou localités dépendant des villes.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: situés autour de ces villes
  rationale: Cette formulation française concise conserve la relation géographique et la valeur proximale de הָאֵלֶּה, « ces ».
- source_word: עַד
  choice: jusqu’à
  rationale: Dans une indication d’étendue territoriale, עַד marque ici la limite géographique atteinte.
- source_word: בַּעֲלַת בְּאֵר
  choice: Baalath-Béer
  rationale: Le nom de lieu est translittéré; le trait d’union en signale le caractère composé et les accents facilitent la lecture française.
- source_word: רָאמַת נֶגֶב
  choice: Ramath-Néguev
  rationale: La translittération préserve le toponyme sans décider s’il s’agit d’un second lieu ou d’une autre désignation de Baalath-Béer.
- source_word: זֹאת נַחֲלַת
  choice: Tel fut l’héritage
  rationale: La proposition hébraïque est sans verbe exprimé. Le passé convient au résumé rétrospectif, tandis que « héritage » garde le sens territorial, juridique et ancestral de נַחֲלָה.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: la tribu des descendants de Siméon
  rationale: מַטֵּה désigne ici la tribu. « Descendants de Siméon » rend naturellement en français la formule généalogique בְנֵי שִׁמְעוֹן sans suggérer uniquement ses fils immédiats.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre du partage tribal, מִשְׁפָּחוֹת désigne les subdivisions familiales de la tribu; « clans » évite l’ambiguïté moderne de « familles ».
theological_decisions: []
