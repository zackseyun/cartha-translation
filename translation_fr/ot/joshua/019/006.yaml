lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: Beth-Lebaoth
  rationale: Nom de lieu translittéré plutôt que traduit; son sens littéral (« maison des lionnes ») n’est pas explicité dans cette liste territoriale.
- source_word: שָׁרוּחֶן
  choice: Sharouhen
  rationale: Translittération française du nom propre lu par le texte massorétique; la forme différente de Josué 15.32 est signalée en note.
- source_word: עָרִים
  choice: villes
  rationale: Équivalent traditionnel et approprié dans une liste de localités, même si certaines pouvaient être de taille modeste.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: treize
  rationale: Rendu cardinal direct et idiomatique.
- source_word: חַצְרֵיהֶן
  choice: les villages qui en dépendaient
  rationale: Dans les listes territoriales, le terme désigne généralement des localités secondaires ou non fortifiées rattachées aux villes nommées; cette formulation rend clairement le lien de dépendance.
