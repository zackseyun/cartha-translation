  text: וַ/יְהִ֥י לָ/הֶ֖ם בְּ/נַֽחֲלָתָ֑/ם בְּאֵֽר שֶׁ֥בַע וְ/שֶׁ֖בַע וּ/מוֹלָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/002.yaml
  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: fr
  text: 'Ils eurent dans leur héritage : Beer-Shéba[a], Shéba et Molada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Beer-Shéba et Shéba ». Certains comprennent l’ensemble comme un seul nom de lieu (« Beer-Shéba »), avec une irrégularité textuelle ou stylistique, plutôt que comme deux villes distinctes.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: Ils eurent
  rationale: La tournure existentielle avec ל et suffixe pronominal exprime ici la possession ou l’attribution. « Ils eurent » est naturel en français et convient à une liste de villes attribuées.
- source_word: בְּנַחֲלָתָם
  choice: dans leur héritage
  rationale: נחלה désigne le bien reçu en partage, particulièrement le territoire tribal. La formulation conserve la préposition hébraïque et situe les villes à l’intérieur du lot de Siméon.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-Shéba
  rationale: Le nom de lieu est translittéré dans une forme française courante, avec un trait d’union qui reflète ses deux éléments.
- source_word: וְשֶׁבַע
  choice: Shéba
  rationale: Le texte consonantique présente « et Shéba » comme un élément distinct de la liste. L’irrégularité possible auprès de Beer-Shéba est signalée en note plutôt que résolue dans le texte.
- source_word: וּמוֹלָדָה
  choice: et Molada
  rationale: Le nom propre est translittéré, et la conjonction finale est conservée naturellement dans l’énumération française.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La tournure verbale rend idiomatiquement l’attribution territoriale, tandis que la ponctuation introduit clairement la liste. Les toponymes suivent une translittération française lisible.
