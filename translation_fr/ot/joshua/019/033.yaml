- from: Leur frontière partait de Hélef[a], du chêne de Tsaannanim, passait par Adami-Néqeb et Yabnéel, et allait jusqu’à LaqQoum ; elle aboutissait au Jourdain[b].
  to: Leur frontière partait de Hélef, du chêne de Tsaannanim[a], passait par Adami-Néqeb et Yabnéel, et allait jusqu’à Laqqoum ; ses extrémités aboutissaient au Jourdain[b].
  rationale: La révision rétablit le pluriel de l’expression hébraïque relative aux extrémités de la frontière, déplace la note textuelle vers le syntagme qu’elle explique et normalise la graphie de Laqqoum. Elle préserve la lecture principale et l’ambiguïté toponymique signalée par l’audit anglais.
