base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: fr
  text: Leur frontière partait de Hélef, du chêne de Tsaannanim[a], passait par Adami-Néqeb et Yabnéel, et allait jusqu’à Laqqoum ; ses extrémités aboutissaient au Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible : « Élon-Betsaannanim » ; l’hébreu peut être compris comme un nom de lieu composé ou comme « le chêne de Tsaannanim ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ses sorties étaient le Jourdain », expression qui désigne les extrémités ou les points où la frontière atteint le Jourdain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: leur frontière
  rationale: Dans cette liste territoriale, גְּבוּל désigne la ligne qui délimite le territoire de Nephtali ; « frontière » est naturel et précis en français.
- source_word: מֵחֵלֶף
  choice: partait de Hélef
  rationale: חֵלֶף est un nom de lieu. Le verbe « partait » explicite naturellement en français la préposition מִן dans une description de frontière.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: du chêne de Tsaannanim
  rationale: אֵלוֹן peut désigner un grand arbre, chêne ou térébinthe. La syntaxe permet de comprendre un arbre associé au lieu de Tsaannanim ; l'autre lecture comme nom de lieu composé est conservée en note.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: Adami-Néqeb
  rationale: La suite de noms dans cette description territoriale favorise l'interprétation comme toponyme composé plutôt que la traduction de נֶקֶב par « passage ».
- source_word: וְיַבְנְאֵל
  choice: Yabnéel
  rationale: Nom de lieu translittéré selon une forme française proche de l'hébreu.
- source_word: עַד לַקּוּם
  choice: jusqu’à LaqQoum
  rationale: עַד indique l'étendue jusqu'à un point terminal ; « jusqu'à » rend directement cette relation.
- source_word: תֹצְאֹתָיו
  choice: elle aboutissait
  rationale: Littéralement, le terme évoque les « sorties » ou extrémités de la frontière. Dans les descriptions territoriales, il indique son point d'aboutissement ; la note conserve l'image hébraïque.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Forme française usuelle du nom géographique ; l'ajout de « fleuve » n'est pas nécessaire.
