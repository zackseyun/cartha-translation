review_pass:
  verdict: revise
  source_fidelity: Le tracé, les toponymes et le sens territorial sont globalement fidèles au texte hébreu. Toutefois, תֹצְאֹתָיו est formellement pluriel (« ses extrémités / ses points de sortie ») ; « elle aboutissait » réduit cette expression à un aboutissement singulier. La révision conserve l’image et le pluriel sans imposer une interprétation géographique plus précise.
  naturalness: 'Le français est clair et adapté à une liste de frontières. « Ses extrémités aboutissaient au Jourdain » est un peu plus formel que la formulation initiale, mais reste naturel dans ce registre géographique et biblique. La graphie « LaqQoum » doit être normalisée : la majuscule interne n’est pas justifiée.'
  terminology: « Frontière », « chêne », « Adami-Néqeb », « Yabnéel » et « Jourdain » conviennent. La note d’alternative doit être ancrée au groupe ambigu « chêne de Tsaannanim », non à « Hélef ».
  issues:
  - severity: medium
    issue: Réduction du pluriel de תֹצְאֹתָיו
    rationale: Le texte hébreu dit littéralement « ses sorties/extrémités étaient le Jourdain ». « Elle aboutissait » et la note au singulier (« le point ») effacent le pluriel. « Ses extrémités aboutissaient » rend la forme source tout en restant idiomatique dans une description de frontière.
  - severity: low
    issue: Ancrage inexact de la note a
    rationale: La note a porte sur מֵאֵלוֹן בְּצַעֲנַנִּים (« le chêne de Tsaannanim » ou un toponyme composé), et non sur Hélef. Le marqueur doit donc suivre l’expression concernée.
  - severity: low
    issue: Capitalisation non standard de « LaqQoum »
    rationale: Une majuscule interne n’a pas de fonction en français. « Laqqoum » normalise la translittération sans modifier le nom.
