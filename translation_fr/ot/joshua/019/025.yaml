  text: And their border was Helkath[a], Hali, Beten, and Akshaph.
translation:
  language: fr
  text: Leur frontière comprenait Helqath, Hali, Béten et Akshaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי גְּבוּלָם
  choice: Leur frontière comprenait
  rationale: La formule narrative introduit ici la liste des lieux qui jalonnent ou constituent la frontière. « comprenait » donne un français naturel sans confondre la frontière avec l’ensemble du territoire.
- source_word: חֶלְקַת
  choice: Helqath
  rationale: Nom de lieu translittéré ; « q » représente le ק et « th » rend la consonne finale ת selon une forme française lisible.
- source_word: וַחֲלִי
  choice: Hali
  rationale: Nom de lieu translittéré dans une forme simple et lisible en français ; la conjonction est rendue par la ponctuation de l’énumération.
- source_word: וָבֶטֶן
  choice: Béten
  rationale: Nom de lieu translittéré ; l’accent facilite en français la lecture de la première voyelle comme /e/.
- source_word: וְאַכְשָׁף
  choice: Akshaf
  rationale: Nom de lieu translittéré au plus près de l’hébreu אַכְשָׁף, avec « sh » pour שׁ et « f » pour le פ final.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure naturelle « comprenait » conserve la fonction géographique du verset, tandis que les toponymes sont translittérés de façon cohérente et accessible.
