  text: עַ֥יִן רִמּ֖וֹן וָ/עֶ֣תֶר וְ/עָשָׁ֑ן עָרִ֥ים אַרְבַּ֖ע וְ/חַצְרֵי/הֶֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: fr
  text: 'Aïn[a], Rimmôn, Éther et Ashân : quatre villes et leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu énumère quatre noms de lieux : Aïn, Rimmôn, Éther et Ashân. Certains rapprochent ce passage de 1 Chroniques 4.32, où « Aïn, Rimmôn » peut être compris comme un nom composé, ce qui modifie le décompte des villes.'
    reason: Renvoi permettant de préserver une difficulté de décompte et une autre compréhension possible des noms.
lexical_decisions:
- source_word: עַיִן
  choice: Aïn
  rationale: Nom de lieu translittéré plutôt que traduit; le tréma indique naturellement en français que les deux voyelles se prononcent séparément.
- source_word: רִמּוֹן
  choice: Rimmôn
  rationale: Nom de lieu translittéré; l’accent circonflexe rend la voyelle longue dans une graphie française traditionnelle et lisible.
- source_word: וָעֶתֶר
  choice: Éther
  rationale: Nom de lieu translittéré avec une graphie adaptée au français; la conjonction est rendue dans l’énumération française.
- source_word: וְעָשָׁן
  choice: et Ashân
  rationale: Nom de lieu translittéré, précédé de la conjonction qui clôt naturellement l’énumération.
- source_word: עָרִים
  choice: villes
  rationale: Terme courant et traditionnel pour les localités recensées dans les listes territoriales.
- source_word: אַרְבַּע
  choice: quatre
  rationale: Rendu direct du nombre cardinal, sans chercher à harmoniser la difficulté textuelle.
- source_word: וְחַצְרֵיהֶן
  choice: avec les villages qui en dépendaient
  rationale: Dans cette formule territoriale, חָצֵר désigne vraisemblablement des établissements ruraux rattachés aux villes; cette formulation française explicite sobrement le rapport administratif.
theological_decisions:
- issue: Le texte nomme apparemment quatre villes, tandis qu’une comparaison avec 1 Chroniques 4.32 peut conduire à associer Aïn et Rimmôn.
  choice: Conserver quatre noms distincts dans le texte et maintenir le total « quatre villes ».
  alternative: Lire « Aïn-Rimmôn » comme un seul nom composé.
  rationale: Le texte massorétique de Josué 19.7 présente les noms séparément et affirme explicitement le nombre quatre; la variante d’interprétation est signalée en note sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, clair et digne. Les toponymes sont translittérés selon des conventions françaises lisibles. La formule finale privilégie une expression naturelle qui indique que les villages étaient rattachés aux villes.
