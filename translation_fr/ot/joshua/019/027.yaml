- from: Puis la frontière tournait vers l’est, du côté du soleil levant, jusqu’à Beth-Dagon. Elle atteignait le territoire de Zabulon et, vers le nord, la vallée de Yifta-El, Beth-Émek et Néiel ; puis elle aboutissait à Kaboul, du côté gauche[a].
  to: Puis la frontière s’est tournée vers l’est, en direction du soleil levant, jusqu’à Beth-Dagon. Elle a atteint Zabulon et la vallée de Yifta-El, vers le nord, jusqu’à Beth-Émek et Néiel ; puis elle s’est prolongée jusqu’à Kaboul, à gauche[a].
  rationale: La révision conserve tous les repères et l’ambiguïté géographique du texte source, tout en employant une succession verbale naturelle en français moderne. Elle remplace l’expression lourde « du côté gauche » par « à gauche » et maintient la note qui explicite sans imposer l’éventuelle orientation nordique.
