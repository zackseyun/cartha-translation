  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: fr
  text: Puis la frontière s’est tournée vers l’est, en direction du soleil levant, jusqu’à Beth-Dagon. Elle a atteint Zabulon et la vallée de Yifta-El, vers le nord, jusqu’à Beth-Émek et Néiel ; puis elle s’est prolongée jusqu’à Kaboul, à gauche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « depuis la gauche ». Dans les descriptions de frontières, la gauche peut désigner le côté nord lorsque l’on est orienté vers l’est.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: Puis la frontière tournait
  rationale: Dans une description de limites territoriales, שׁוב indique ici un changement de direction. L’ajout explicite de « la frontière » rend en français le sujet implicite sans modifier le sens.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: vers l’est, du côté du soleil levant
  rationale: « Vers l’est » exprime clairement la direction géographique, tandis que « du côté du soleil levant » conserve l’image de l’expression hébraïque.
- source_word: בֵּית דָּגֹן
  choice: Beth-Dagon
  rationale: Le nom de lieu est translittéré plutôt que traduit.
- source_word: וּפָגַע בִּזְבֻלוּן
  choice: Elle atteignait le territoire de Zabulon
  rationale: Dans les descriptions territoriales, פגע avec ב marque le contact de la limite avec un territoire. « Le territoire de » explicite naturellement le référent géographique.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: et […] la vallée de Yifta-El
  rationale: גֵי signifie « vallée » ; Yifta-El est conservé comme nom propre translittéré.
- source_word: צָפוֹנָה
  choice: vers le nord
  rationale: Cette expression conserve la valeur directionnelle de l’adverbe hébreu sans décider si elle qualifie tout le trajet ou plus précisément l’approche de la vallée.
- source_word: בֵּית הָעֵמֶק
  choice: Beth-Émek
  rationale: Le toponyme est translittéré, non traduit.
- source_word: וּנְעִיאֵל
  choice: et Néiel
  rationale: Le nom propre est translittéré sous une forme lisible en français.
- source_word: וְיָצָא אֶל כָּבוּל
  choice: puis elle aboutissait à Kaboul
  rationale: Dans une formule de délimitation, יצא décrit la ligne qui se prolonge ou débouche sur un point. « Aboutissait » est naturel et géographiquement précis.
- source_word: מִשְּׂמֹאל
  choice: du côté gauche[a]
  rationale: Le texte dit littéralement « depuis la gauche ». La traduction maintient cette indication concrète et laisse à la note son éventuelle portée géographique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les noms de lieux sont translittérés de façon lisible. La syntaxe explicite « la frontière », sujet sous-entendu par le contexte, et conserve l’ambiguïté de l’indication « gauche » au lieu de la remplacer directement par « nord ».
