id: JOS.19.17
reference: Joshua 19:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/יִ֨שָּׂשכָ֔ר יָצָ֖א הַ/גּוֹרָ֣ל הָֽ/רְבִיעִ֑י לִ/בְנֵ֥י יִשָּׂשכָ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: fr
  text: Le quatrième lot échut à Issacar, aux fils d’Issacar[a], selon leurs clans[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire aux descendants d’Issacar, considérés comme membres de la tribu.
    reason: clarification_lexicale
  - marker: b
    text: Ou « selon leurs familles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: à Issacar
  rationale: La préposition לְ indique ici le bénéficiaire du lot; « à Issacar » convient naturellement à l’attribution d’un territoire.
- source_word: יָצָא הַגּוֹרָל הָרְבִיעִי
  choice: Le quatrième lot échut
  rationale: Dans le contexte d’un tirage au sort, « échut » exprime naturellement en français le résultat indiqué par le verbe יָצָא, littéralement « sortit », sans confondre le lot avec le territoire lui-même.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: aux fils d’Issacar
  rationale: La formulation conserve l’expression hébraïque de filiation tribale, tout en laissant une note préciser sa portée collective.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte tribal, מִשְׁפָּחוֹת désigne les subdivisions de la tribu; « clans » est plus précis que le mot moderne « familles ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La répétition d’« Issacar » est maintenue parce qu’elle appartient à la structure du texte hébreu; « échut » rend idiomatiquement le résultat du tirage au sort.
