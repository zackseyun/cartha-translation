- source_word: אֵילוֹן
  choice: Ayalôn
  rationale: Nom de lieu translittéré selon une forme française usuelle et proche de la prononciation hébraïque; la graphie avec accent circonflexe signale naturellement la voyelle longue dans l'usage biblique français.
- source_word: תִמְנָתָה
  choice: Timna
  rationale: Le nom de la ville est rendu sous sa forme française conventionnelle; la finale hébraïque -ָה est ici comprise comme directionnelle ou locative et n'est pas intégrée au nom français.
- source_word: עֶקְרוֹן
  choice: Éqrôn
  rationale: Translittération française du nom propre, avec q pour représenter ק et une graphie conforme aux conventions bibliques françaises.
- source_word: וְ
  choice: et / ponctuation de liste
  rationale: La coordination hébraïque répétée est rendue par une énumération française naturelle, avec « et » avant le dernier élément; cela préserve la fonction syntaxique sans alourdir la liste.
