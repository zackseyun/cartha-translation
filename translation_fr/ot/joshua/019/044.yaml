  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְתְּקֵה
  choice: Elteqé
  rationale: Nom de lieu translittéré selon une forme française courante, sans chercher à le traduire.
- source_word: גִבְּתוֹן
  choice: Guibbetôn
  rationale: Nom de lieu translittéré en français; « Gu » garde devant i la valeur consonantique du guimel, le double b reflète le daguesh et l’accent circonflexe signale la voyelle longue finale.
- source_word: בַעֲלָת
  choice: Baalath
  rationale: Le terme fonctionne ici comme un toponyme; il est donc translittéré plutôt que traduit. La graphie conserve le groupe « Baal » et rend le tav final par « th », conformément à une forme française biblique bien établie.
- source_word: וְ / וּ
  choice: et
  rationale: Les conjonctions préfixées coordonnent les noms d’une liste; en français naturel, les premiers éléments sont séparés par une virgule et « et » introduit le dernier.
