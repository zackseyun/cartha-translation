source:
  edition: WLC
  text: וְ/יִרְאוֹן֙ וּ/מִגְדַּל אֵ֔ל חֳרֵ֥ם וּ/בֵית עֲנָ֖ת וּ/בֵ֣ית שָׁ֑מֶשׁ עָרִ֥ים תְּשַֽׁע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: fr
  text: 'Yiréôn, Migdal-El[a], Horem, Beth-Anath[b] et Beth-Shémesh[c] : dix-neuf villes, avec leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-El signifie littéralement « tour d’El » ou « tour de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Beth-Anath signifie littéralement « maison d’Anath ».
    reason: lexical_alternative
  - marker: c
    text: Beth-Shémesh signifie littéralement « maison du soleil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: Yiréôn
  rationale: Nom de lieu translittéré sous une forme lisible en français moderne; la conjonction initiale n’est pas rendue, car le verset poursuit directement une liste commencée au verset précédent.
- source_word: וּ/מִגְדַּל אֵל
  choice: Migdal-El
  rationale: Nom de lieu composé, translittéré plutôt que traduit; le trait d’union en signale les deux éléments.
- source_word: חֳרֵם
  choice: Horem
  rationale: Nom de lieu translittéré directement, sans lui attribuer un sens contextuel non explicité.
- source_word: וּ/בֵית עֲנָת
  choice: Beth-Anath
  rationale: Toponyme composé conservé par translittération; son sens littéral est indiqué en note.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Toponyme composé translittéré selon une graphie naturelle en français; son sens littéral est indiqué en note.
- source_word: עָרִים תְּשַׁע עֶשְׂרֵה
  choice: dix-neuf villes
  rationale: Rendu idiomatique du nombre et du terme courant des listes territoriales, sans présumer la taille moderne de ces localités.
- source_word: וְ/חַצְרֵי/הֶן
  choice: avec leurs villages
  rationale: Dans cette formule territoriale, le terme désigne vraisemblablement les villages ou établissements dépendant des villes nommées; « avec » exprime naturellement leur rattachement.
theological_decisions: []
