source:
  edition: WLC
  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: fr
  text: Le deuxième lot revint à Siméon[a], à la tribu des fils de Siméon, selon leurs clans[b]. Leur héritage se trouvait à l’intérieur de l’héritage des fils de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le deuxième lot sortit pour Siméon. » Le verbe hébreu signifie littéralement « sortir » et désigne ici le résultat d’un tirage au sort.'
    reason: lexical_alternative
  - marker: b
    text: Les expressions « fils de Siméon » et « fils de Juda » sont des désignations tribales hébraïques; elles renvoient aux descendants ou aux membres de ces tribus.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: revint
  rationale: Dans le contexte du tirage au sort, « revint à » exprime naturellement en français le résultat, tandis que la note conserve l’image littérale du verbe « sortir ».
- source_word: הַגּוֹרָל הַשֵּׁנִי
  choice: le deuxième lot
  rationale: « Lot » désigne ici le moyen de répartition territoriale et conserve la distinction avec l’héritage attribué.
- source_word: לְשִׁמְעוֹן
  choice: à Siméon
  rationale: La préposition marque le bénéficiaire du lot; « revint à Siméon » est idiomatique en français.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: à la tribu des fils de Siméon
  rationale: מַטֶּה signifie « tribu » dans ce contexte, et « fils de Siméon » maintient l’expression généalogique hébraïque.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: selon leurs clans
  rationale: « Clans » rend mieux que « familles » les groupes de parenté structurants au sein de la tribu.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: Le terme désigne la part territoriale reçue et conserve ses résonances juridiques et liées à la transmission.
- source_word: בְּתוֹךְ
  choice: à l’intérieur de
  rationale: Cette formulation indique clairement que le territoire de Siméon était enclavé dans celui de Juda.
- source_word: נַחֲלַת בְּנֵי יְהוּדָה
  choice: l’héritage des fils de Juda
  rationale: La répétition d’« héritage » reflète celle du terme hébreu, et « fils de Juda » préserve la désignation tribale familiale.
