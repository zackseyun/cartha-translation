  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: fr
  text: Les hommes en armes marchaient devant les prêtres qui sonnaient des trompes[a], et l’arrière-garde marchait derrière l’arche, tandis que l’on continuait à sonner des trompes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : shofarot, c’est-à-dire des trompes faites de corne, souvent rendues par « cornes de bélier ».'
    reason: Précise la nature de l’instrument tout en évitant de présenter comme certaine une identification plus étroite que le terme hébreu.
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: les hommes en armes
  rationale: Le terme désigne ici le contingent armé placé en tête du cortège. Cette formulation est claire, concrète et respecte la valeur collective du substantif.
- source_word: הֹלֵךְ
  choice: marchaient
  rationale: Le participe exprime une action en cours; dans le contexte d’un cortège militaire, « marchaient » est plus naturel et précis que « allaient ».
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement la relation spatiale et l’ordre du cortège.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et exact dans ce contexte cultuel.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: qui sonnaient des trompes
  rationale: Le verbe décrit l’action des prêtres pendant la marche. « Sonner des trompes » est idiomatique en français et « trompes » évoque mieux que « trompettes » des instruments faits de corne.
- source_word: הַמְאַסֵּף
  choice: l’arrière-garde
  rationale: Le mot désigne le corps qui ferme la marche et rassemble ou protège l’arrière de la formation.
- source_word: אַחֲרֵי
  choice: derrière
  rationale: Le sens spatial convient à la description de la disposition du cortège.
- source_word: הָאָרוֹן
  choice: l’arche
  rationale: Le contexte immédiat identifie déjà l’arche; il n’est pas nécessaire d’ajouter « de l’alliance », absent de ce verset.
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: tandis que l’on continuait à sonner
  rationale: La construction exprime la continuité de l’action pendant la progression. La tournure impersonnelle évite d’attribuer explicitement la seconde action à un groupe lorsque l’hébreu laisse le sujet sous-entendu.
- source_word: בַּשּׁוֹפָרוֹת
  choice: des trompes
  rationale: Reprend naturellement le nom des instruments sans imposer qu’il s’agisse exclusivement de cornes de bélier.
