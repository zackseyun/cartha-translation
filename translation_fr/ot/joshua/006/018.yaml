source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: fr
  text: Mais vous, gardez-vous bien de ce qui est voué à la destruction[a], de peur qu’en prenant de ce qui est voué à la destruction, vous ne deveniez vous-mêmes voués à la destruction[b], que vous ne vouiez le camp d’Israël à la destruction et que vous n’attiriez le malheur sur lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu חֵרֶם (ḥérèm), traditionnellement rendu par « l’interdit » ou « l’anathème », désigne ici ce qui est irrévocablement consacré à Dieu en vue de la destruction.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « vous vous placeriez vous-mêmes sous l’interdit ».'
    reason: alternative_reading
  - marker: c
    text: L’expression « attirer le malheur » annonce le récit de la faute d’Acan et de ses conséquences pour Israël (Josué 7.1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: Mais vous
  rationale: La conjonction et רַק introduisent ici une restriction fortement contrastive, tandis que le pronom indépendant אַתֶּם met les destinataires en relief. « Mais vous » rend naturellement les deux effets en français.
- source_word: שִׁמְרוּ מִן
  choice: gardez-vous bien de
  rationale: שמר avec מן exprime l’idée de se garder de quelque chose. L’ajout idiomatique de « bien » restitue l’insistance de l’avertissement sans alourdir la phrase.
- source_word: הַחֵרֶם
  choice: ce qui est voué à la destruction
  rationale: Le singulier collectif חֵרֶם désigne ici ce qui est irrévocablement consacré à Dieu dans le cadre d’une destruction. Cette formulation reste intelligible sans réduire le terme à des objets distincts ni employer le technique « interdit » sans explication.
- source_word: פֶּן תַּחֲרִימוּ
  choice: Sinon […] vous vous voueriez vous-mêmes à la destruction
  rationale: פֶּן introduit la conséquence redoutée. Dans ce contexte, le hiphil de חרם indique que les Israélites encourraient eux-mêmes le statut de ce qui est voué à la destruction. Le conditionnel français rend naturellement la mise en garde.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: en prenant de ce qui est voué à la destruction
  rationale: La coordination hébraïque lie étroitement la prise interdite et la conséquence. La tournure participiale française explicite ce rapport sans ajouter de contenu.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: vous voueriez le camp d’Israël à la destruction
  rationale: 'שׂים avec le complément לְחֵרֶם exprime le résultat causé : le camp entier serait placé sous le même sort. La répétition du même vocabulaire préserve le lien lexical avec חֵרֶם.'
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: vous attireriez le malheur sur lui
  rationale: עכר signifie causer le trouble ou le malheur. « Attirer le malheur sur » est une expression française actuelle et digne; « lui » renvoie au camp d’Israël.
theological_decisions:
- issue: Rendu de חֵרֶם dans le contexte du jugement et de la guerre sainte
  choice: ce qui est voué à la destruction
  alternative: l’interdit ; ce qui est frappé d’anathème ; les choses vouées à la destruction
  rationale: La formulation choisie conserve l’idée d’une consécration irrévocable à Dieu aboutissant ici à la destruction, sans employer un terme ecclésiastique potentiellement trompeur ni transformer le singulier collectif en liste d’objets.
- issue: Valeur de תַּחֲרִימוּ appliqué aux destinataires
  choice: vous vous voueriez vous-mêmes à la destruction
  alternative: vous placeriez vous-mêmes sous l’interdit ; vous deviendriez vous-mêmes voués à la destruction
  rationale: Le contexte permet de comprendre à la fois une action qui engage leur responsabilité et le statut de jugement qu’ils encourent. La tournure pronominale préserve cette tension plutôt que de trancher entièrement entre acte causatif et état résultant.
- issue: Portée communautaire de la faute
  choice: vous voueriez le camp d’Israël à la destruction
  alternative: vous mettriez le camp d’Israël sous l’interdit
  rationale: Le texte étend explicitement les conséquences de la prise individuelle au camp entier. La traduction maintient cette solidarité collective sans en fournir une explication doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase hébraïque très coordonnée est restructurée autour de « Sinon » et de deux-points afin de rendre clairement le rapport entre l’acte interdit et ses conséquences, tout en conservant les répétitions théologiquement importantes de la racine חרם.
