  naturalness: 'La restructuration proposée est plus fluide en français moderne que la succession « Sinon … : ». Elle conserve l’avertissement et les trois conséquences coordonnées sans calquer inutilement la syntaxe hébraïque.'
  terminology: « Ce qui est voué à la destruction » est un bon rendu du collectif חֵרֶם. « Devenir vous-mêmes voués à la destruction » évite de surinterpréter la forme causative comme un acte délibéré d’auto-consécration. Le nom français usuel est « Acan », non « Akân ».
