base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: fr
  text: Lorsque l’on fera retentir longuement la corne de bélier[a] et que vous entendrez le son de la trompe, tout le peuple poussera un grand cri. Alors la muraille de la ville s’effondrera sur place[b], et le peuple montera, chacun droit devant lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand on prolongera la sonnerie de la corne de bélier ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la muraille de la ville tombera sous elle-même »; l’expression signifie probablement qu’elle s’effondrera verticalement, sur place.'
    reason: lexical_alternative
  - marker: c
    text: Ou « chacun directement en face de lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: fera retentir longuement
  rationale: Dans cette construction, משׁך désigne la prolongation de la sonnerie. Cette formulation française exprime clairement l’idée d’un son prolongé sans reproduire littéralement une image verbale qui serait obscure.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: la corne de bélier
  rationale: Dans ce contexte, יוֹבֵל désigne le bélier ou sa corne employée comme instrument, et non le jubilé au sens institutionnel.
- source_word: קוֹל הַשּׁוֹפָר
  choice: le son de la trompe
  rationale: שׁוֹפָר désigne une trompe faite d’une corne. « Trompe » traduit le nom commun dans un français naturel, tandis que « le son » rend explicitement קוֹל.
- source_word: יָרִיעוּ תְּרוּעָה גְדוֹלָה
  choice: poussera un grand cri
  rationale: Le verbe et son complément expriment ensemble l’action de lancer une forte clameur. « Pousser un grand cri » est idiomatique et conserve l’intensité de l’hébreu sans préciser indûment qu’il s’agit d’un cri de guerre.
- source_word: תַּחְתֶּיהָ
  choice: sur elle-même
  rationale: La formule décrit la muraille s’effondrant verticalement sur sa propre base. « Sur elle-même » conserve l’image réflexive tout en restant naturel en français.
- source_word: וְעָלוּ
  choice: montera
  rationale: עלה signifie fondamentalement « monter ». Le contexte peut suggérer l’entrée ou l’assaut de la ville, mais le texte principal garde le sens spatial sans explicitation militaire supplémentaire.
- source_word: אִישׁ נֶגְדּוֹ
  choice: chacun droit devant lui
  rationale: La tournure distributive indique que chaque homme avance directement à partir de l’endroit où il se trouve. « Chacun » est naturel en français et « droit devant lui » préserve précisément l’orientation spatiale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve la succession entre la sonnerie prolongée, le cri du peuple, l’effondrement de la muraille et la montée de chacun droit devant lui. Les formulations interprétatives comme « monter à l’assaut » ont été évitées afin de ne pas dépasser le sens explicite de l’hébreu.
