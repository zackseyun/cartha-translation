  naturalness: Le français est globalement moderne et fluide. « Lorsque …, lorsque … » peut être allégé par une coordination, sans perte de précision.
  terminology: « Corne de bélier », « trompe », « grand cri » et « montera » sont des choix justes, naturels et non surinterprétatifs. Les notes distinguent utilement la formulation littérale de la compréhension probable.
