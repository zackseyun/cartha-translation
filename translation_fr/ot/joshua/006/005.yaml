  to: Lorsque l’on fera retentir longuement la corne de bélier[a] et que vous entendrez le son de la trompe, tout le peuple poussera un grand cri. Alors la muraille de la ville s’effondrera sur place[b], et le peuple montera, chacun droit devant lui[c].
  rationale: La révision remplace uniquement l’expression française qui déformait le rapport spatial de « sous elle-même ». « S’effondrera sur place » est idiomatique et exprime la compréhension probable sans introduire l’idée d’un assaut; la note maintient la forme littérale et signale explicitement le caractère probable de l’explication. La coordination initiale améliore légèrement la fluidité.
