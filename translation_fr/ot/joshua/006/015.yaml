base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: fr
  text: Le septième jour, ils se levèrent de bon matin, au lever de l’aube, et firent sept fois le tour de la ville de la même manière. Ce jour-là seulement, ils firent sept fois le tour de la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Le septième jour
  rationale: La formule narrative hébraïque introduit ici la circonstance temporelle; en français naturel, elle n’exige pas un calque tel que « Et il arriva ».
- source_word: וַיַּשְׁכִּימוּ
  choice: ils se levèrent de bon matin
  rationale: Le verbe exprime le fait de se lever ou d’agir tôt; cette tournure française conserve cette nuance.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: dès le lever de l’aube
  rationale: Rend l’image hébraïque de l’aube qui monte tout en restant idiomatique en français.
- source_word: וַיָּסֹבּוּ אֶת־הָעִיר
  choice: firent … le tour de la ville
  rationale: Expression française naturelle pour l’action de tourner autour de la ville; le contexte de procession n’impose pas lexicalement « marchèrent ».
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: de la même manière
  rationale: Dans ce contexte, מִשְׁפָּט désigne la manière prescrite ou habituelle, et non un jugement juridique.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: Ce fut seulement ce jour-là
  rationale: Préserve l’accent restrictif de רַק et la mise en relief du jour en question.
