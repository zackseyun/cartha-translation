  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: fr
  text: 'Josué, fils de Noun, appela les prêtres et leur dit : « Portez l’arche de l’alliance, et que sept prêtres portent sept trompes faites de cornes de bélier devant l’arche de Yahweh. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le qal wayyiqtol de קרא introduit ici Josué s’adressant aux prêtres. « Appela » est naturel et n’ajoute pas la force plus marquée de « convoqua ».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Forme française traditionnelle du nom, suivie d’une expression filiale claire et idiomatique.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent courant et précis de כֹּהֵן dans ce contexte cultuel.
- source_word: שְׂאוּ
  choice: Portez
  rationale: L’impératif de נשׂא désigne ici le transport de l’arche ; « portez » exprime directement l’action demandée.
- source_word: אֲרוֹן הַבְּרִית
  choice: l’arche de l’alliance
  rationale: Rend fidèlement la relation construite et correspond à l’expression française consacrée.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: et que sept prêtres portent
  rationale: L’imparfait hébreu prolonge l’instruction donnée à l’impératif. La tournure avec « que » en conserve naturellement la valeur directive.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: sept trompes en corne de bélier
  rationale: שׁוֹפָר désigne une trompe, tandis que יוֹבְלִים précise vraisemblablement ici la matière ou l’origine, des cornes de bélier. Une autre compréhension possible est signalée en note.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend clairement la position des prêtres dans la procession.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le syntagme associe directement l’arche au nom divin יהוה ; « Yahweh » préserve ce nom personnel dans le texte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le Tétragramme. « Yahweh » le rend comme nom personnel plutôt que de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
- issue: Valeur directive de יִשְׂאוּ après l’impératif
  choice: que sept prêtres portent
  alternative: sept prêtres porteront
  rationale: Le contexte présente une consigne, non une simple prédiction. La tournure choisie conserve cette valeur sans durcir l’énoncé en commandement indépendant.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe conserve le discours direct et la progression des instructions tout en évitant les calques pesants. « Trompe » est retenu plutôt que « trompette » pour évoquer naturellement un instrument fait d’une corne.
