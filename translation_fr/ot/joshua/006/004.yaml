base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: fr
  text: Sept prêtres porteront devant l’arche sept trompes en corne de bélier[a]. Le septième jour, vous ferez sept fois le tour de la ville, et les prêtres feront retentir les trompes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept cors de bélier » ou « sept shofars en corne de bélier ». L’expression hébraïque désigne des instruments à vent en corne, probablement fabriqués avec des cornes de bélier.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: porteront
  rationale: Le verbe נשׂא signifie ici « porter »; le futur français exprime naturellement l’instruction donnée pour l’action à venir.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: trompes en corne de bélier
  rationale: שׁוֹפָר désigne une trompe faite d’une corne, et הַיּוֹבְלִים en précise vraisemblablement le type. Cette formulation indique à la fois la nature de l’instrument et sa matière, sans introduire ici l’idée potentiellement trompeuse de « jubilé ».
- source_word: לִפְנֵי הָאָרוֹן
  choice: devant l’arche
  rationale: Traduction spatiale directe et idiomatique; « de l’alliance » n’est pas exprimé dans ce verset.
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: vous ferez … le tour de la ville
  rationale: סבב signifie tourner ou aller autour. « Faire le tour de » rend naturellement le mouvement processionnel sans ajouter explicitement une marche militaire.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Avec une action répétée et un nombre, פְּעָמִים se traduit naturellement par « fois ».
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: sonneront des trompes
  rationale: תקע avec שׁוֹפָר désigne l’action de faire retentir l’instrument. « Sonner de la trompe » est idiomatique en français; le pluriel « des trompes » reprend les instruments déjà définis.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Trompe » est préféré à « trompette », car il évoque mieux un instrument en corne. La répétition de « sept » et la structure prescriptive du texte hébreu sont conservées.
