  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: fr
  text: 'En ce temps-là, Josué leur fit prêter serment[a] en disant : « Maudit devant Yahweh soit l’homme[b] qui entreprendra de rebâtir cette ville, Jéricho ! Il en posera les fondations au prix de son premier-né[c], et il en installera les portes au prix du plus jeune de ses enfants. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les plaça sous serment ». Le verbe hébreu est causatif : Josué amena les personnes présentes à prêter serment.'
    reason: lexical_alternative
  - marker: b
    text: Ou « Maudit devant Yahweh soit quiconque entreprendra de rebâtir cette ville ». En hébreu, « l’homme » est un masculin singulier employé ici de façon générique.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « avec son premier-né […] et avec le plus jeune de ses enfants ». Dans ce contexte, l’expression signifie vraisemblablement que la reconstruction se fera au prix de leur perte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: leur fit prêter serment
  rationale: 'Le hifil de שׁבע a un sens causatif : Josué amène les personnes présentes à prêter serment ou les place sous serment. Le pronom « leur », absent de la forme hébraïque mais requis en français, est fourni par le contexte.'
- source_word: בָּעֵת הַהִיא
  choice: En ce temps-là
  rationale: Expression temporelle française naturelle et digne, correspondant directement à la locution hébraïque.
- source_word: אָרוּר הָאִישׁ לִפְנֵי יְהוָה
  choice: Maudit devant Yahweh soit l’homme
  rationale: Cette formulation conserve l’ordre emphatique et la solennité de la formule de malédiction hébraïque, ainsi que le nom divin.
- source_word: יָקוּם וּבָנָה
  choice: qui entreprendra de rebâtir
  rationale: Le couple verbal exprime le fait de se lever pour agir et reconstruire la ville détruite. « Entreprendre de rebâtir » rend naturellement cette force en français.
- source_word: הָעִיר הַזֹּאת אֶת יְרִיחוֹ
  choice: cette ville, Jéricho
  rationale: La juxtaposition française restitue simplement l’apposition explicative de l’hébreu.
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: au prix de son premier-né ... au prix de son plus jeune
  rationale: Dans cette malédiction, la préposition בְּ indique vraisemblablement le prix humain associé aux deux étapes de la reconstruction. La formulation exprime la perte sans préciser un mécanisme que le verset ne donne pas.
- source_word: יְיַסְּדֶנָּה
  choice: Il en posera les fondations
  rationale: Le verbe יסד désigne ici concrètement la pose des fondations ; « en » reprend naturellement la ville en français.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: il en installera les portes
  rationale: Dans le contexte d’une ville fortifiée, דְּלָתוֹת désigne les portes de la ville. « Installer » convient à l’achèvement de leur mise en place.
theological_decisions:
- issue: Nature de la déclaration de Josué
  choice: Une formule solennelle de malédiction prononcée devant Yahweh contre quiconque rebâtira Jéricho
  alternative: Un simple souhait personnel de Josué ou une interdiction purement civile
  rationale: L’expression « maudit devant Yahweh » donne à la déclaration une portée religieuse et judiciaire, sans que la traduction ajoute une explication théologique absente du verset.
- issue: Sens de la malédiction touchant le premier-né et le plus jeune
  choice: La reconstruction se fera au prix de leur perte, sans préciser comment celle-ci surviendra
  alternative: Un sacrifice d’enfants délibéré, ou seulement un malheur indéterminé pendant les travaux
  rationale: La construction hébraïque relie les deux proches aux étapes initiale et finale de la reconstruction. « Au prix de » rend cette conséquence sévère tout en laissant ouverte la manière exacte dont elle s’accomplit.
- issue: Portée de הָאִישׁ
  choice: Conserver le singulier masculin « l’homme », employé ici de façon générique
  alternative: Expliciter par « quiconque » ou « toute personne »
  rationale: Le texte hébreu emploie un nom masculin singulier dans une formule générale. La traduction le conserve et signale sa portée générique en note.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe de la malédiction garde une élévation adaptée au contexte biblique. « Premier-né » et « plus jeune » préservent le parallélisme et évitent d’ajouter explicitement « fils » là où l’hébreu ne l’énonce pas.
