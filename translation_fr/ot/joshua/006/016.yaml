source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: fr
  text: 'À la septième fois, les prêtres sonnèrent des cors[a], et Josué dit au peuple : « Poussez des cris, car Yahweh vous a donné la ville ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : shofarot, pluriel de shofar, instrument fait d’une corne et traditionnellement identifié à un cor de bélier.'
    reason: Précision lexicale sur la nature de l’instrument.
lexical_decisions:
- source_word: וַיְהִי
  choice: À la septième fois
  rationale: La formule narrative introduit ici l’événement suivant. En français, une traduction littérale comme « Et il arriva » alourdirait la phrase; sa fonction est naturellement intégrée à la proposition temporelle.
- source_word: בַּפַּעַם הַשְּׁבִיעִית
  choice: À la septième fois
  rationale: פַּעַם désigne ici la septième occurrence de l’action répétée. Cette formulation reste proche de l’hébreu sans préciser davantage qu’il s’agit du septième tour.
- source_word: תָּקְעוּ
  choice: sonnèrent
  rationale: Avec שׁוֹפָרוֹת, le verbe désigne l’action de faire retentir un instrument à vent. « Sonnèrent des cors » est idiomatique en français.
- source_word: שׁוֹפָרוֹת
  choice: cors
  rationale: Le shofar est un instrument fait d’une corne. « Cors » conserve mieux cette réalité que « trompettes », tout en restant naturel; la précision traditionnelle « cornes de bélier » est signalée en note.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Équivalent français courant de אמר pour introduire un discours direct.
- source_word: הָרִיעוּ
  choice: Poussez des cris
  rationale: Le verbe commande une forte acclamation, pouvant être un cri de guerre ou de victoire. La traduction conserve cette amplitude sans imposer une seule nuance.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison donnée pour pousser des cris.
- source_word: נָתַן
  choice: vous a donné
  rationale: Le parfait présente l’acte comme accompli du point de vue de Josué, alors même que la prise de la ville se réalise dans le récit. Le passé composé préserve cette perspective et sa force d’assurance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, au lieu de le remplacer par un titre.
- source_word: הָעִיר
  choice: la ville
  rationale: Le nom défini renvoie à Jéricho dans le contexte, tout en conservant ici la formulation hébraïque générale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom propre.
- issue: Valeur du parfait נָתַן avant la chute effective de la ville
  choice: vous a donné
  alternative: vous donnera
  rationale: Le passé composé maintient la présentation hébraïque de l’acte comme déjà accompli ou assuré, sans transformer cette tension narrative en simple futur.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe évite l’archaïsme « il arriva que » tout en gardant la progression narrative. Le discours direct est énergique sans ajouter explicitement la notion de cri de guerre.
