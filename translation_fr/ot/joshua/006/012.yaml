source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם יְהוֹשֻׁ֖עַ בַּ/בֹּ֑קֶר וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/012.yaml
  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: fr
  text: Josué se leva de bon matin, et les prêtres portèrent l’arche de Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: se leva de bon matin
  rationale: Le hifil de שׁכם exprime le fait de se lever ou de commencer tôt. « Se leva de bon matin » est naturel, digne et conserve l’insistance temporelle.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française conventionnelle du nom propre.
- source_word: בַּבֹּקֶר
  choice: de bon matin
  rationale: Dans cette construction avec « se leva », cette expression rend naturellement « le matin » tout en communiquant l’idée d’une action matinale.
- source_word: וַיִּשְׂאוּ
  choice: portèrent
  rationale: Dans le contexte du transport de l’arche, נשׂא signifie ici « porter » plutôt que simplement « soulever ».
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Traduction directe du nom pluriel défini.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahvé
  rationale: Le syntagme construit est rendu directement, et le nom divin est translittéré selon sa forme française courante.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente ici le nom divin personnel plutôt que de lui substituer le titre « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahvé », forme bien établie en français, préserve le caractère de nom propre sans importer un titre de remplacement.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « se leva de bon matin » évite la raideur de « se leva tôt le matin » tout en conservant l’accent hébreu sur l’action matinale.
