base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: fr
  text: 'Jéricho était complètement fermée à cause des Israélites[a] : personne ne sortait[b] et personne n’entrait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël », expression hébraïque courante désignant collectivement le peuple d’Israël.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque, qui associe deux formes du verbe « fermer », souligne que la ville était entièrement fermée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: Jéricho
  rationale: Le nom propre est translittéré selon son usage français établi. Le waw narratif n’exige pas ici l’ajout d’un marqueur explicite tel que « Or » ou « Maintenant ».
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: était hermétiquement fermée
  rationale: Le redoublement de formes issues de סגר intensifie la fermeture complète de la ville. « Hermétiquement fermée » rend cette emphase en français naturel sans reproduire lourdement les deux formes.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans ce contexte, la préposition indique que la présence des Israélites motive la fermeture. Cette formulation n’ajoute pas la notion de peur, qui reste implicite au mieux.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël », cette expression hébraïque est une désignation collective habituelle du peuple d’Israël. « Les Israélites » en transmet naturellement la portée inclusive en français moderne.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: personne ne sortait et personne n’entrait
  rationale: 'Les participes dans cette proposition descriptive expriment une situation continue : aucun mouvement de sortie ou d’entrée n’avait lieu. L’imparfait convient au cadre narratif français.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’intensité de la fermeture sans ajouter explicitement la peur comme motivation. Le deux-points introduit naturellement la précision qui décrit l’absence totale de circulation.
