  text: וְ/לִ/שְׁנַ֨יִם הָ/אֲנָשִׁ֜ים הַֽ/מְרַגְּלִ֤ים אֶת הָ/אָ֨רֶץ֙ אָמַ֣ר יְהוֹשֻׁ֔עַ בֹּ֖אוּ בֵּית הָ/אִשָּׁ֣ה הַ/זּוֹנָ֑ה וְ/הוֹצִ֨יאוּ מִ/שָּׁ֤ם אֶת הָֽ/אִשָּׁה֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ כַּ/אֲשֶׁ֥ר נִשְׁבַּעְתֶּ֖ם לָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: fr
  text: 'Josué dit aux deux hommes qui avaient exploré le pays : « Entrez dans la maison de la prostituée et faites sortir de là la femme ainsi que tout ce qui lui appartient, selon ce que vous lui avez juré. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: aux deux hommes
  rationale: Le lamed introduit les destinataires de la parole de Josué. En français narratif, placer « Josué dit » en tête produit une phrase naturelle sans perdre ce rapport.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: qui avaient exploré le pays
  rationale: Le participe de רגל désigne ici une mission de reconnaissance déjà accomplie. « Explorer » convient au contexte militaire sans suggérer l’espionnage d’une personne, et le plus-que-parfait marque naturellement l’antériorité.
- source_word: בֹּאוּ בֵּית
  choice: Entrez dans la maison
  rationale: בוא peut signifier venir ou entrer selon le contexte. L’impératif français « Entrez » exprime directement le déplacement vers l’intérieur de la maison.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: la prostituée
  rationale: זוֹנָה désigne sans euphémisme une prostituée. Le français substantivé est naturel et rend l’expression hébraïque sans la lourdeur de « la femme prostituée ».
- source_word: וְהוֹצִיאוּ מִשָּׁם אֶת הָאִשָּׁה
  choice: et faites sortir de là cette femme
  rationale: Le hiphil de יצא signifie « faire sortir ». Le démonstratif « cette » reprend clairement la femme qui vient d’être désignée tout en conservant la répétition hébraïque de « femme ».
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: ainsi que tout ce qui lui appartient
  rationale: 'La formulation reste volontairement large : dans le contexte, elle peut englober ses biens et les personnes placées sous sa protection.'
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: conformément au serment que vous lui avez fait
  rationale: Cette tournure française exprime naturellement que l’ordre repose sur l’engagement solennel pris envers elle, sans modifier le contenu de cet engagement.
theological_decisions:
- issue: Désignation de Rahab par זוֹנָה
  choice: la prostituée
  alternative: la courtisane ; la femme prostituée
  rationale: Le terme hébreu désigne explicitement une prostituée. Une atténuation comme « courtisane » ne serait pas justifiée, tandis que « femme prostituée » serait moins naturel en français actuel.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été réorganisée pour éviter l’ouverture lourde « Et aux deux hommes… », tout en conservant tous les éléments du texte hébreu. Aucun archaïsme ni euphémisme n’a été retenu.
