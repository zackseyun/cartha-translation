review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Josué s’adresse aux deux hommes ayant effectué la reconnaissance, leur ordonne d’entrer dans la maison, d’en faire sortir la femme et tout ce qui est à elle, selon leur serment. « Faites sortir » rend précisément le hiphil de יצא. Toutefois, « cette femme » ajoute une valeur démonstrative que l’hébreu n’exprime pas : le texte répète simplement « la femme ». La clausule « conformément au serment que vous lui avez fait » est recevable, mais « selon ce que vous lui avez juré » rend plus directement כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ.'
  naturalness: Le français est moderne, clair et d’un registre narratif approprié. « La femme » est aussi naturel que « cette femme » dans ce contexte et respecte mieux la reprise définie du texte source. « Selon ce que vous lui avez juré » est idiomatique et plus direct.
  terminology: « Josué », « pays », « maison », « prostituée » et « tout ce qui lui appartient » sont justes. « Prostituée » rend sans euphémisme זונה et convient au français international moderne. Aucun terme théologique spécialisé ni nom propre ne nécessite de modification.
  issues:
  - severity: low
    issue: « cette femme » pour אֶת־הָאִשָּׁה
    rationale: Le démonstratif français introduit une nuance déictique ou contrastive absente de l’hébreu, qui emploie l’article défini et répète « la femme ». « La femme » préserve plus exactement cette reprise.
  - severity: low
    issue: « conformément au serment que vous lui avez fait » pour כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
    rationale: Cette formulation est compréhensible, mais elle nominalise et reformule davantage que nécessaire. « Selon ce que vous lui avez juré » conserve explicitement le verbe « jurer » et la comparaison introduite par כַּאֲשֶׁר.
  revised_text: 'Josué dit aux deux hommes qui avaient exploré le pays : « Entrez dans la maison de la prostituée et faites sortir de là la femme ainsi que tout ce qui lui appartient, selon ce que vous lui avez juré. »'
