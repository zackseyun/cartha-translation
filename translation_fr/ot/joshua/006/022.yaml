revisions:
- from: 'Josué dit aux deux hommes qui avaient exploré le pays : « Entrez dans la maison de la prostituée et faites sortir de là cette femme ainsi que tout ce qui lui appartient, conformément au serment que vous lui avez fait. »'
  to: 'Josué dit aux deux hommes qui avaient exploré le pays : « Entrez dans la maison de la prostituée et faites sortir de là la femme ainsi que tout ce qui lui appartient, selon ce que vous lui avez juré. »'
  rationale: La révision élimine la nuance démonstrative ajoutée par « cette » et rapproche la dernière proposition de la formulation hébraïque, sans alourdir le français. L’omission du waw initial (« Et ») demeure une adaptation syntaxique française sûre et ne modifie pas le sens.
