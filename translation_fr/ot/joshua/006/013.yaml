source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: fr
  text: Les sept prêtres, portant sept trompettes en corne de bélier[a] devant l’arche de Yahweh, avançaient en sonnant des trompettes. Les hommes armés marchaient devant eux, et l’arrière-garde marchait derrière l’arche de Yahweh, tandis que l’on avançait en sonnant des trompettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept trompettes du jubilé » ou « sept cornes de béliers ». L’expression hébraïque désigne des shofars faits de corne de bélier ou associés à celle-ci.
    reason: alternative lexicale
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: trompettes en corne de bélier
  rationale: שׁוֹפָר désigne une trompe ou trompette de corne, et הַיֹּבְלִים précise ici son association avec le bélier. Cette formulation française exprime à la fois la matière ou l’origine et la fonction instrumentale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que remplacé par un titre.
- source_word: הֹלְכִים הָלוֹךְ
  choice: avançaient
  rationale: La construction associant le verbe conjugué à l’infinitif absolu souligne la continuité de la marche; l’imparfait français rend naturellement cette action en cours.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: en sonnant des trompettes
  rationale: תקע avec שׁוֹפָר signifie sonner de l’instrument. Le gérondif relie naturellement cette action continue à la marche.
- source_word: הֶחָלוּץ
  choice: les hommes armés
  rationale: Dans ce contexte militaire et processionnel, le terme désigne les combattants équipés qui ouvrent la marche.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Rendu spatial direct; le pronom renvoie le plus naturellement aux prêtres qui viennent d’être mentionnés.
- source_word: הַמְאַסֵּף
  choice: l’arrière-garde
  rationale: Le participe désigne ceux qui ferment la marche; « l’arrière-garde » est le terme français idiomatique et précis.
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: tandis que l’on avançait en sonnant des trompettes
  rationale: La tournure conserve l’aspect duratif et la reprise de la sonnerie, tout en évitant d’imposer un sujet précis là où la forme et la syntaxe hébraïques présentent une difficulté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sujet de la proposition finale הוֹלֵךְ וְתָקוֹעַ בַּשּׁוֹפָרוֹת
  choice: tournure indéfinie « l’on avançait »
  alternative: « ils avançaient » ou rattachement explicite à l’arrière-garde
  rationale: Le texte massorétique présente une forme singulière et une syntaxe difficile après « l’arrière-garde », alors que l’action de sonner renvoie naturellement aux prêtres. La tournure indéfinie maintient cette tension sans attribuer silencieusement la sonnerie à un groupe déterminé.
translation_notes:
  register: Français international moderne, clair et digne. Les imparfaits donnent à la procession son caractère continu. La répétition de « sonnant des trompettes » est conservée parce qu’elle structure le mouvement du texte hébreu.
