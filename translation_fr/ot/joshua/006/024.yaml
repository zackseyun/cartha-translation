source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: fr
  text: Ils livrèrent au feu la ville et tout ce qui s’y trouvait. Seuls l’argent, l’or et les objets[a] de bronze et de fer furent déposés dans le trésor de la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ustensiles » ou « récipients ». Le terme hébreu peut désigner diverses sortes d’objets ou d’instruments.
    reason: Le sens de כְּלֵי est large et ne permet pas de déterminer précisément la nature des objets.
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: ils brûlèrent
  rationale: Le verbe שׂרף exprime directement l’action de brûler; בָאֵשׁ précise le moyen («par le feu»), déjà naturellement inclus dans le verbe français «brûler».
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: et tout ce qui s’y trouvait
  rationale: Cette formulation rend la totalité du contenu de la ville dans un français actuel et naturel.
- source_word: רַק
  choice: Seuls
  rationale: רַק introduit ici les biens exceptés de la destruction. «Seuls» maintient nettement cette valeur restrictive.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: l’argent, l’or
  rationale: Les noms de métaux désignent ici les matières précieuses récupérées; les articles définis français conviennent à cet inventaire précis.
- source_word: כְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: les objets de bronze et de fer
  rationale: כְלֵי est un terme large pour des objets, récipients ou ustensiles. «Objets» évite de préciser indûment leur fonction. Dans ce contexte, נְחֹשֶׁת est rendu par «bronze».
- source_word: נָתְנוּ
  choice: furent déposés
  rationale: נתן signifie ici placer ou remettre les métaux dans un dépôt. Le passif français permet de conserver naturellement les biens exceptés comme thème de la phrase, sans modifier l’agent implicite.
- source_word: אוֹצַר בֵּית יְהוָה
  choice: le trésor de la maison de Yahvé
  rationale: אוֹצַר désigne le lieu où sont conservés les biens précieux consacrés. «Maison» évite l’anachronisme possible de «temple» dans le cadre narratif de Josué.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR / Yahweh
  rationale: Le texte porte explicitement le tétragramme. «Yahvé» est la forme française traditionnelle et immédiatement reconnaissable du nom propre, plutôt qu’un titre substitutif.
- issue: Destination cultuelle des métaux
  choice: dans le trésor de la maison de Yahvé
  alternative: dans le trésor appartenant à la maison de Yahvé
  rationale: La chaîne construite hébraïque rattache le trésor à la maison de Yahvé. La formulation retenue marque cette destination sans ajouter d’explication sur l’usage ultérieur des biens.
translation_notes:
  register: Français international moderne, sobre et digne. La première phrase reste directe; la seconde met en relief l’exception introduite par רַק. Le passif évite une reprise lourde de «ils» tout en conservant le sens.
