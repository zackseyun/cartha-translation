  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: fr
  text: Vous tous, les hommes de guerre[a], marcherez autour de la ville et en ferez une fois le tour. Tu feras ainsi pendant six jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « combattants » ou « guerriers ». L’hébreu dit littéralement « tous les hommes de la guerre ».
    reason: Variante lexicale et précision sur la formulation hébraïque.
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: vous marcherez autour
  rationale: Le verbe סבב exprime ici le déplacement autour de la ville. « Marcherez autour » convient au contexte militaire sans réduire le sens à un encerclement tactique.
- source_word: הָעִיר
  choice: la ville
  rationale: Le nom commun défini est conservé, bien que le contexte identifie la ville comme Jéricho.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: vous tous, hommes de guerre
  rationale: Cette formulation garde le caractère masculin et militaire de l’hébreu, littéralement « tous les hommes de la guerre », tout en intégrant naturellement le groupe au commandement pluriel.
- source_word: הַקֵּיף אֶת הָעִיר
  choice: en ferez le tour
  rationale: La reprise hébraïque de l’action autour de la ville est maintenue sous une forme française fluide, sans répéter lourdement « la ville ».
- source_word: פַּעַם אֶחָת
  choice: une fois
  rationale: Équivalent idiomatique direct indiquant un seul circuit.
- source_word: כֹּה תַעֲשֶׂה
  choice: Tu feras ainsi
  rationale: « Ainsi » rend l’adverbe de manière כֹּה, et le singulier de « tu feras » préserve le passage hébreu de la deuxième personne du pluriel à celle du singulier.
- source_word: שֵׁשֶׁת יָמִים
  choice: pendant six jours
  rationale: La préposition « pendant » exprime clairement la durée au cours de laquelle l’action prescrite doit être répétée.
theological_decisions:
- issue: Désignation genrée des combattants
  choice: hommes de guerre
  alternative: combattants ; guerriers
  rationale: L’expression hébraïque est explicitement masculine et désigne les hommes affectés au combat. Le texte principal conserve cette précision, tandis que la note signale des équivalents français possibles.
- issue: Changement de nombre dans l’adresse
  choice: pluriel « vous marcherez », puis singulier « tu feras »
  alternative: uniformiser tout le verset au pluriel ou au singulier
  rationale: L’hébreu passe de la deuxième personne masculine plurielle à la deuxième personne masculine singulière, probablement des hommes engagés dans la marche à Josué, responsable de l’exécution de l’ordre. La traduction conserve cette tension grammaticale sans l’expliquer dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition hébraïque du mouvement autour de la ville est conservée de façon allégée par « en ferez le tour ». Le passage de « vous » à « tu » est volontaire afin de refléter le changement de nombre du texte source.
