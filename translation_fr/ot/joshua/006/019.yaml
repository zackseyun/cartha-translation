  text: וְ/כֹ֣ל כֶּ֣סֶף וְ/זָהָ֗ב וּ/כְלֵ֤י נְחֹ֨שֶׁת֙ וּ/בַרְזֶ֔ל קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה אוֹצַ֥ר יְהוָ֖ה יָבֽוֹא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: fr
  text: Mais tout l’argent et l’or, ainsi que les objets en bronze et en fer[a], sont consacrés à Yahweh ; ils entreront dans le trésor de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le singulier : « cela est consacré » et « cela entrera », considérant l’ensemble des métaux et des objets comme un tout collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mais tout
  rationale: 'Dans le contexte, ו relie cette consigne à l’interdit précédent tout en marquant un contraste : contrairement aux autres biens voués à la destruction, tous ces métaux sont réservés à Yahweh.'
- source_word: כֶּסֶף וְ/זָהָב
  choice: l’argent et l’or
  rationale: כֶּסֶף désigne ici l’argent comme métal, puisqu’il figure dans une liste de métaux avec l’or, le bronze et le fer.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: ainsi que les objets en bronze et en fer
  rationale: כְּלִי est un terme large désignant des objets, ustensiles ou récipients. « Objets » évite de restreindre indûment leur nature ; « bronze » est le rendu usuel de נְחֹשֶׁת dans ce contexte matériel.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: sont consacrés à Yahweh
  rationale: קֹדֶשׁ exprime ici la mise à part pour Yahweh. « Consacrés » communique cette fonction plus naturellement en français que le littéral « saints », tandis que le pluriel suit l’usage français avec l’énumération.
- source_word: אוֹצַר יְהוָה
  choice: le trésor de Yahweh
  rationale: אוֹצָר désigne un trésor ou dépôt ; avec des métaux précieux consacrés, « trésor » convient au contexte.
- source_word: יָבֹוא
  choice: ils entreront dans
  rationale: Le verbe hébreu est au singulier parce que l’ensemble est envisagé collectivement. Le français emploie naturellement le pluriel en renvoyant aux métaux et objets énumérés, sans ajouter le passif interprétatif « seront apportés ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin et évite de le remplacer par un titre.
- issue: Sens de קֹדֶשׁ dans une formule de destination cultuelle
  choice: consacrés à Yahweh
  alternative: saints pour Yahweh
  rationale: La formule indique que ces biens sont mis à part et réservés à Yahweh. « Consacrés » exprime clairement cette destination sans attribuer aux objets une qualité morale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tout en employant l’accord pluriel naturel en français. « Objets » préserve l’étendue sémantique de כְּלִי.
