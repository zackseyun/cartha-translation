source:
  edition: WLC
  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: fr
  text: La ville et tout ce qui s’y trouve seront voués à la destruction pour le SEIGNEUR[a]. Seule Rahab, la prostituée, restera en vie, elle et tous ceux qui sont avec elle dans la maison, car elle a caché les messagers[b] que nous avions envoyés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frappés d’interdit ». Le terme hébreu désigne ce qui est irrévocablement voué au SEIGNEUR, ici par la destruction.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu signifie « messagers » ; dans le contexte, il s’agit des hommes que Josué avait envoyés reconnaître le pays.
    reason: lexical_clarification
lexical_decisions:
- source_word: חֵרֶם
  choice: voués à la destruction
  rationale: Dans ce contexte de conquête, le terme désigne ce qui est irrévocablement consacré à Dieu par la destruction. Cette formulation conserve à la fois l’idée de consécration et celle de destruction, sans réduire le mot à une simple malédiction.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: La préposition exprime ici la destination ou la consécration à YHWH. « Pour le SEIGNEUR » s’intègre naturellement à la formulation « voués à la destruction ».
- source_word: רַק
  choice: Seule
  rationale: Le terme introduit l’unique exception au sort de la ville et porte ici directement sur Rahab.
- source_word: הַזּוֹנָה
  choice: la prostituée
  rationale: Équivalent moderne, clair et non archaïque du nom désignant l’activité ou le statut de Rahab.
- source_word: תִּחְיֶה
  choice: restera en vie
  rationale: Rend explicitement, dans ce contexte de destruction, le sens de vivre ou demeurer vivante, sans ajouter une notion étrangère au verbe.
- source_word: אִתָּהּ בַּבַּיִת
  choice: avec elle dans la maison
  rationale: La phrase désigne les personnes physiquement réunies avec Rahab dans la maison, plutôt que son foyer au sens familial.
- source_word: הֶחְבְּאַתָה
  choice: elle a caché
  rationale: Rend directement le causatif de חבא, sans ajouter la nuance de protection qu’introduirait « abriter ».
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: Le mot signifie largement « messagers ». Le contexte les identifie comme les hommes envoyés en reconnaissance, mais la traduction conserve le sens lexical du terme hébreu.
- source_word: שָׁלָחְנוּ
  choice: nous avions envoyés
  rationale: Le plus-que-parfait français marque naturellement que leur envoi a précédé l’action de les cacher.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: La ville et tout ce qui s’y trouve seront voués à la destruction
  rationale: La formulation française naturelle conserve la portée collective de l’énoncé et l’accent mis sur la ville avec tout son contenu, sans reproduire lourdement le pronom de reprise hébreu.
theological_decisions:
- issue: Traduction du terme de conquête חֵרֶם
  choice: voués à la destruction
  alternative: frappés d’interdit ; voués ; maudits
  rationale: Ce choix ne minimise pas la violence du jugement, tout en préservant l’idée que la ville est irrévocablement livrée au SEIGNEUR par sa destruction. « Maudits » ferait perdre cette dimension de consécration.
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH ; Yahvé
  rationale: La forme en petites capitales suit la convention française courante qui distingue le tétragramme du titre ordinaire « Seigneur », tout en restant lisible dans un texte biblique destiné au grand public.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluide sans atténuer la sévérité du texte. « La maison » garde le sens spatial du contexte, et « restera en vie » exprime clairement l’exception accordée à Rahab.
