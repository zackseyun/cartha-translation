  text: וַ/יָּסֹ֨בּוּ אֶת הָ/עִ֜יר בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ פַּ֣עַם אַחַ֔ת וַ/יָּשֻׁ֖בוּ הַֽ/מַּחֲנֶ֑ה כֹּ֥ה עָשׂ֖וּ שֵׁ֥שֶׁת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: fr
  text: Le deuxième jour, ils firent une fois le tour de la ville, puis retournèrent au camp. Ils firent ainsi pendant six jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils firent ainsi six jours »; c’est-à-dire qu’ils répétèrent ce déroulement pendant six jours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: ils firent […] le tour
  rationale: Le verbe סבב exprime ici le mouvement autour de la ville. « Faire le tour de » est naturel en français moderne et n’ajoute pas de nuance militaire absente du verbe.
- source_word: אֶת הָעִיר
  choice: de la ville
  rationale: עִיר désigne normalement une ville; la construction française « faire le tour de la ville » rend naturellement l’objet direct hébreu.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour
  rationale: Rendu temporel direct, idiomatique et proche de l’hébreu.
- source_word: פַּעַם אַחַת
  choice: une fois
  rationale: Équivalent français exact et naturel de l’expression « une fois ».
- source_word: וַיָּשֻׁבוּ
  choice: puis retournèrent
  rationale: שׁוב signifie « revenir, retourner ». « Puis » explicite avec naturel la succession narrative portée par le waw consécutif.
- source_word: הַמַּחֲנֶה
  choice: au camp
  rationale: Le français requiert ici la préposition « à », contractée en « au », pour marquer la destination.
- source_word: כֹּה עָשׂוּ
  choice: Ils firent ainsi
  rationale: Cette formulation française actuelle et digne rend directement la manière résumée par כֹּה avec le verbe courant עשה.
- source_word: שֵׁשֶׁת יָמִים
  choice: pendant six jours
  rationale: Le syntagme indique la durée et, dans le contexte, la répétition de ce même déroulement. « Pendant » est idiomatique sans préciser plus que le texte.
