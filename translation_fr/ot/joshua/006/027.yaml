source:
  edition: WLC
  text: וַ/יְהִ֥י יְהוָ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְהִ֥י שָׁמְע֖/וֹ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: fr
  text: Yahweh était avec Josué, et sa renommée se répandit dans tout le pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nouvelles à son sujet » ou « sa réputation ». Le terme hébreu peut désigner une nouvelle, ce que l’on rapporte, ou la réputation d’une personne ; ici, il évoque probablement la renommée grandissante de Josué.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel du Dieu d’Israël plutôt que de le remplacer par un titre.
- source_word: וַיְהִי יְהוָה אֶת יְהוֹשֻׁעַ
  choice: Yahweh était avec Josué
  rationale: La construction היה avec אֶת exprime ici la présence et l’accompagnement. L’imparfait français rend naturellement cet état dans le récit.
- source_word: שָׁמְעוֹ
  choice: sa renommée
  rationale: Le nom dérivé de שמע peut désigner ce qui est entendu à propos de quelqu’un — nouvelle, réputation ou renommée. Dans ce contexte, « renommée » exprime naturellement la notoriété croissante de Josué sans effacer l’ambiguïté, signalée en note.
- source_word: וַיְהִי שָׁמְעוֹ
  choice: sa renommée se répandit
  rationale: L’hébreu dit littéralement que sa renommée « fut » dans tout le pays. « Se répandit » restitue en français courant l’idée de sa diffusion sur l’ensemble du territoire.
- source_word: בְּכָל הָאָרֶץ
  choice: dans tout le pays
  rationale: Dans le contexte narratif, הָאָרֶץ désigne vraisemblablement le pays ou territoire concerné, non la terre entière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: La translittération conserve le nom divin personnel et évite de le remplacer par un titre ou d’adopter une autre vocalisation traditionnelle.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « se répandit » est idiomatique tout en restant proche de l’image d’une renommée présente dans tout le pays.
