base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: fr
  text: Josué laissa en vie Rahab la prostituée, ainsi que la maisonnée de son père et tout ce qui lui appartenait[a]. Elle habite au milieu d’Israël jusqu’à ce jour, parce qu’elle avait caché les messagers que Josué avait envoyés espionner Jéricho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut englober ici aussi bien les personnes rattachées à Rahab que ses biens.
    reason: ambiguïté lexicale
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: la prostituée
  rationale: Le nom désigne une femme qui se livre à la prostitution. « Prostituée » est le terme moderne, direct et non archaïque.
- source_word: בֵּית אָבִיהָ
  choice: la maisonnée de son père
  rationale: L’expression désigne le groupe familial ou domestique rattaché au père, et non seulement son habitation. « Maisonnée » préserve cette portée collective.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: tout ce qui lui appartenait
  rationale: La formule hébraïque est large et peut englober des personnes aussi bien que des biens; cette traduction évite de la restreindre.
- source_word: הֶחֱיָה
  choice: laissa en vie
  rationale: Le hiphil de חיה exprime ici le fait de maintenir ou de laisser en vie. Cette formulation conserve la nuance causative tout en restant naturelle.
- source_word: וַתֵּשֶׁב
  choice: elle habite
  rationale: Avec « jusqu’à ce jour », le verbe décrit une situation commencée dans le passé et toujours vraie au temps du narrateur. Le présent français rend clairement cette continuité.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: au milieu d’Israël
  rationale: Cette expression suit de près l’idiome hébraïque et affirme son intégration résidentielle dans le peuple sans préciser davantage son statut.
- source_word: הֶחְבִּיאָה
  choice: avait caché
  rationale: Le verbe signifie cacher ou dissimuler. Le plus-que-parfait explicite naturellement en français l’antériorité de cet acte par rapport au récit principal.
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: מַלְאָכִים signifie ici « messagers ». Leur mission d’espionnage est ensuite indiquée par le verbe, ce qui permet de conserver la distinction lexicale du texte.
- source_word: לְרַגֵּל
  choice: espionner
  rationale: Dans ce contexte militaire, le verbe désigne l’observation clandestine d’une ville en vue d’une opération; « espionner » est clair et idiomatique.
theological_decisions:
- issue: Intégration de Rahab au sein d’Israël
  choice: Elle habite au milieu d’Israël jusqu’à ce jour
  alternative: Elle s’établit parmi les Israélites jusqu’à ce jour
  rationale: La formulation retenue conserve l’affirmation d’une présence durable au sein d’Israël sans tirer de conclusion supplémentaire sur son statut religieux, ethnique ou juridique.
translation_notes:
  register: Français international moderne, narratif et digne. « Maisonnée » est légèrement soutenu, mais précis et compréhensible; il évite de réduire « la maison de son père » au bâtiment. Les temps verbaux français rendent la continuité jusqu’au temps du narrateur et l’antériorité de l’acte de Rahab.
