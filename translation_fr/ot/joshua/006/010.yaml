  text: וְ/אֶת הָ/עָם֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ לֵ/אמֹ֗ר לֹ֤א תָרִ֨יעוּ֙ וְ/לֹֽא תַשְׁמִ֣יעוּ אֶת קוֹלְ/כֶ֔ם וְ/לֹא יֵצֵ֥א מִ/פִּי/כֶ֖ם דָּבָ֑ר עַ֠ד י֣וֹם אָמְרִ֧/י אֲלֵי/כֶ֛ם הָרִ֖יעוּ וַ/הֲרִיעֹתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: fr
  text: 'Josué donna cet ordre au peuple : « Ne poussez aucun cri[a], ne faites pas entendre votre voix, et qu’aucune parole ne sorte de votre bouche[b], jusqu’au jour où je vous dirai : “Poussez des cris !” Alors, vous pousserez des cris. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément dans ce contexte : « Ne poussez pas de cri de guerre » ou « Ne lancez pas le cri de guerre ».'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire plus simplement : « ne prononcez pas un mot ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: donna cet ordre
  rationale: Le verbe exprime un commandement faisant autorité. « Donna cet ordre » est naturel en français et conserve cette force.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme hébreu courant désigne le peuple. Même dans ce contexte militaire, il n’est pas nécessaire de préciser « les soldats » ou « l’armée ».
- source_word: לֹא תָרִיעוּ
  choice: Ne poussez aucun cri
  rationale: À la forme causative, רוע désigne l’action de pousser un cri, souvent un cri de guerre ou de triomphe. La formulation retenue reste naturelle tout en laissant au contexte le soin d’en préciser la nuance.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: ne faites pas entendre votre voix
  rationale: La forme causative de שׁמע signifie ici « faire entendre ». Cette tournure française suit de près l’expression hébraïque.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: qu’aucune parole ne sorte de votre bouche
  rationale: La traduction conserve l’image hébraïque d’une parole qui sort de la bouche, ainsi que le singulier collectif דָּבָר.
- source_word: עַד יוֹם
  choice: jusqu’au jour où
  rationale: Cette expression garde la référence concrète au « jour » tout en assurant une syntaxe française naturelle avec la proposition qui suit.
- source_word: אָמְרִי אֲלֵיכֶם
  choice: je vous dirai
  rationale: L’infinitif construit avec suffixe a ici une valeur temporelle. Le futur français convient puisque Josué évoque l’ordre qu’il donnera ultérieurement.
- source_word: הָרִיעוּ
  choice: Poussez des cris !
  rationale: L’impératif reprend le même verbe que l’interdiction initiale. « Poussez des cris ! » constitue un ordre idiomatique en français.
- source_word: וַהֲרִיעֹתֶם
  choice: Alors, vous pousserez des cris
  rationale: Le waw a ici une valeur consécutive après l’impératif cité. « Alors » rend clairement la succession et la répétition maintient le lien lexical avec הָרִיעוּ.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La formulation conserve les trois interdictions successives, l’image de la parole sortant de la bouche et la répétition du verbe רוע, sans préciser dans le texte principal qu’il s’agit nécessairement d’un cri de guerre.
