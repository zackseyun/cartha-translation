  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: fr
  text: Ils vouèrent à la destruction tout ce qui se trouvait dans la ville[a] — hommes et femmes, jeunes et vieux, jusqu’aux bœufs, aux moutons et aux ânes — en les passant au fil de l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exterminèrent entièrement » ou « mirent sous interdit ». Le verbe hébreu désigne ici le fait de vouer quelque chose irrévocablement à la destruction en le plaçant sous l’interdit (ḥerem).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: Ils vouèrent à la destruction
  rationale: Le hiphil de חרם exprime ici la mise sous interdit vouée irrévocablement à la destruction. Cette formulation conserve la portée technique du terme sans la réduire au simple fait de détruire.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: tout ce qui se trouvait dans la ville
  rationale: Rend naturellement l’expression globale, dont les habitants et les animaux sont ensuite précisés.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: hommes et femmes
  rationale: Cette formulation française naturelle conserve le mérisme qui inclut les deux sexes, sans imposer artificiellement le singulier hébreu distributif.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: jeunes et vieux
  rationale: Rend clairement le mérisme couvrant tous les âges, sans restreindre indûment les référents au sexe masculin.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: jusqu’aux bœufs, aux moutons et aux ânes
  rationale: Préserve la progression inclusive de וְעַד vers le bétail tout en employant des pluriels collectifs naturels en français.
- source_word: לְפִי חָרֶב
  choice: qu’ils passèrent au fil de l’épée
  rationale: L’expression idiomatique française conserve l’image du tranchant de l’épée et indique sans ambiguïté le moyen de mise à mort.
theological_decisions:
- issue: Rendu du vocabulaire de חרם dans un contexte de jugement guerrier
  choice: vouèrent à la destruction
  alternative: exterminèrent entièrement ; frappèrent d’interdit
  rationale: Le verbe appartient au vocabulaire technique du ḥerem et ne désigne pas seulement une mise à mort générique. Le choix retenu préserve la dimension de consécration irrévocable à la destruction, sans atténuer la violence du texte ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe en deux temps évite une accumulation pesante, tandis que « au fil de l’épée » conserve l’image hébraïque traditionnelle. Le marqueur [a] est placé immédiatement après « ville », conformément au texte de consultation.
