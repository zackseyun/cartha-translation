source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: fr
  text: Quand Josué eut parlé au peuple, les sept prêtres qui portaient les sept trompettes en corne de bélier[a] devant Yahweh s’avancèrent et sonnèrent des trompettes. L’arche de l’alliance de Yahweh avançait derrière eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les sept shofars des yovels ». Il s’agit probablement de trompettes en corne de bélier; « trompettes du jubilé » est aussi possible, mais moins vraisemblable ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: Quand Josué eut parlé
  rationale: La formule narrative וַיְהִי, suivie de l’infinitif construit avec כְּ, introduit l’événement qui se produit après la parole de Josué. En français, « Quand… eut parlé » exprime naturellement cette antériorité sans calquer lourdement « il arriva que ».
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme désigne ici l’ensemble des Israélites auxquels Josué s’adresse, plutôt qu’une troupe militaire au sens strict.
- source_word: נֹשְׂאִים
  choice: qui portaient
  rationale: Le participe décrit les prêtres en train de porter les instruments; la proposition relative est naturelle et claire en français.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: les sept trompettes en corne de bélier
  rationale: שׁוֹפָר désigne un instrument à vent fait d’une corne, et הַיּוֹבְלִים renvoie vraisemblablement ici aux béliers ou à leurs cornes. Cette formulation indique à la fois la nature et la fonction des instruments.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la position devant ou en présence de Yahweh; « devant » conserve cette image spatiale dans la procession.
- source_word: עָבְרוּ
  choice: s’avancèrent
  rationale: Dans ce contexte processionnel, עבר décrit le mouvement vers l’avant, non la traversée d’une limite.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: et sonnèrent des trompettes
  rationale: תקע avec שׁוֹפָר signifie souffler dans l’instrument ou le faire retentir. « Sonner de la trompette » est idiomatique en français.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Cette traduction transparente de la chaîne construite conserve explicitement le lien entre l’arche, l’alliance et Yahweh.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: avançait derrière eux
  rationale: Le participe הֹלֵךְ présente le mouvement en cours, tandis que אַחֲרֵיהֶם précise la position derrière les prêtres.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin. « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- issue: Sens de לִפְנֵי יְהוָה dans la procession
  choice: devant Yahweh
  alternative: en présence de Yahweh
  rationale: « Devant » préserve à la fois le sens spatial et la portée cultuelle de l’expression, sans préciser au-delà du texte comment la présence divine se rapporte à l’arche.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase a été légèrement restructurée pour éviter le calque pesant de la syntaxe hébraïque. L’imparfait « avançait » conserve la valeur progressive du participe final.
