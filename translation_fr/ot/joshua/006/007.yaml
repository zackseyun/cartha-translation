  variant: modern international French
source:
  edition: WLC
  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: fr
  text: 'Ils dirent au peuple : « Avancez et faites le tour de la ville. Que les hommes armés[a] passent devant l’arche de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’avant-garde », c’est-à-dire les hommes armés qui marchaient devant l’arche.
    reason: Alternative lexicale et fonctionnelle possible pour הֶחָלוּץ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol du verbe אמר poursuit la séquence narrative. Le français n’a pas besoin de rendre mécaniquement le ו initial par « et ».
- source_word: אֶל־הָעָם
  choice: au peuple
  rationale: עָם désigne normalement le peuple. Même si le contexte est militaire, « peuple » conserve la portée lexicale du terme sans le réduire à l’armée.
- source_word: עִבְרוּ
  choice: Avancez
  rationale: Dans cette procession, עבר ordonne d’aller de l’avant plutôt que de franchir une frontière ou un cours d’eau. « Avancez » exprime naturellement ce mouvement.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: et faites le tour de la ville
  rationale: סבב indique ici le déplacement autour de la ville. Cette formulation française est claire et n’ajoute pas une nuance militaire absente du verbe.
- source_word: וְהֶחָלוּץ
  choice: les hommes armés
  rationale: חָלוּץ désigne ceux qui sont équipés pour le combat et peut, dans ce contexte, évoquer l’avant-garde. Le texte retient le sens concret, tandis que la fonction possible est signalée en note.
- source_word: יַעֲבֹר
  choice: Que ... passent
  rationale: L’imparfait hébreu a ici une valeur jussive ou prescriptive. La tournure « Que ... passent » en restitue directement la force.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: devant l’arche de Yahweh
  rationale: לִפְנֵי exprime la position en avant de l’arche, et le nom divin est conservé sous sa forme personnelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par « Yahweh », translittération française courante du nom divin, plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs restent naturels et directs. Le marqueur de note est placé après « les hommes armés », expression à laquelle l’alternative se rapporte.
