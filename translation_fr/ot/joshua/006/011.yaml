  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב אֲרוֹן יְהוָה֙ אֶת הָ/עִ֔יר הַקֵּ֖ף פַּ֣עַם אֶחָ֑ת וַ/יָּבֹ֨אוּ֙ הַֽ/מַּחֲנֶ֔ה וַ/יָּלִ֖ינוּ בַּֽ/מַּחֲנֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: fr
  text: L’arche de Yahweh fit donc une fois le tour de la ville[a]. Puis ils entrèrent dans le camp et y passèrent la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu présente l’arche comme le sujet de l’action, bien qu’elle ait été portée par les prêtres.
    reason: Préciser le raccourci narratif et la personnification grammaticale sans les effacer du texte principal.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: fit le tour
  rationale: Le verbe décrit ici le déplacement autour de la ville. « Fit le tour » est naturel en français et conserve l’arche comme sujet grammatical, sans expliciter dans le texte qu’elle était portée.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: Le syntagme construit désigne l’arche associée au Dieu d’Israël. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: הָעִיר
  choice: la ville
  rationale: Le nom défini renvoie à Jéricho dans le contexte; le rendre par « la ville » préserve la formulation hébraïque.
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: une fois le tour
  rationale: L’expression précise qu’un seul circuit complet fut accompli. Cette formulation française restitue le sens sans reproduire lourdement la répétition verbale de l’hébreu.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: ils entrèrent dans le camp
  rationale: בוא exprime l’arrivée ou l’entrée dans un lieu. « Entrèrent dans » convient à la destination indiquée, sans ajouter l’idée interprétative d’un retour.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: y passèrent la nuit
  rationale: לון signifie passer la nuit. Le pronom adverbial « y » évite en français une répétition pesante de « dans le camp » tout en conservant clairement le même lieu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: L’arche présentée comme sujet de l’action
  choice: l’arche fit le tour
  alternative: on fit faire le tour à l’arche
  rationale: L’hébreu présente l’arche comme sujet grammatical dans un raccourci narratif, même si le contexte indique qu’elle était portée par les prêtres. Le texte principal conserve cette personnification sans résoudre implicitement la formulation.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La répétition hébraïque du mot « camp » est allégée par « y », conformément à l’usage naturel du français, sans perte de sens.
