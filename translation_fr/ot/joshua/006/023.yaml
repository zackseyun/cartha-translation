  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: fr
  text: Les jeunes hommes, les espions, entrèrent et firent sortir Rahab, son père, sa mère, ses frères et tout ce qui lui appartenait[a]. Ils firent sortir toute sa parenté[b] et les placèrent hors du camp d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qui était à elle ». L’expression hébraïque peut englober les personnes de sa maison et, éventuellement, ses biens.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous ses clans » ou « toutes ses familles ». Le terme hébreu désigne souvent la famille élargie ou le groupe familial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: les jeunes hommes
  rationale: נַעַר désigne couramment un jeune homme. Ici, le terme qualifie les deux espions et non des serviteurs en général.
- source_word: הַמְרַגְּלִים
  choice: les espions
  rationale: Le participe substantivé identifie directement les jeunes hommes déjà connus du récit. « Les espions » reste proche de l’hébreu sans ajouter un complément absent de ce verset.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: firent sortir
  rationale: Le hiphil de יצא signifie « faire sortir ». La répétition est conservée, comme dans le texte hébreu.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: tout ce qui lui appartenait
  rationale: Cette formulation conserve la portée large et l’ambiguïté de l’hébreu, qui peut viser les personnes de sa maison et éventuellement ses biens.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: toutes les familles de sa parenté
  rationale: מִשְׁפָּחָה peut désigner une famille élargie ou un clan. Cette traduction garde le pluriel tout en restant naturelle et compréhensible en français moderne.
- source_word: וַיַּנִּיחוּם
  choice: les placèrent
  rationale: Le hiphil de נוח peut signifier placer, déposer ou laisser. « Placèrent » exprime la mise en un lieu sans préciser une intention que le texte ne donne pas.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: hors du camp d’Israël
  rationale: Traduction spatiale directe et idiomatique, sans expliquer la raison de cette mise à l’écart.
theological_decisions:
- issue: Raison pour laquelle Rahab et les siens sont placés hors du camp
  choice: Conserver uniquement l’indication spatiale, sans en préciser la raison.
  alternative: Y voir une séparation rituelle temporaire, une mesure de protection ou une attente avant leur intégration à Israël.
  rationale: Le verset ne donne aucune explication. La traduction préserve donc l’ouverture narrative et théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « firent sortir » reflète celle de l’hébreu. « Hors du camp » conserve la sobriété de l’indication spatiale originale.
