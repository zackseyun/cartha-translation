  terminology: « Les jeunes hommes, les espions », « firent sortir », « hors du camp d’Israël » et le nom Rahab conviennent. « Toute sa parenté » rend de façon souple le pluriel hébreu, dont la référence exacte peut être les clans, familles élargies ou proches de Rahab; la note préserve les alternatives.
