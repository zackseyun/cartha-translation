  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: fr
  text: Alors le peuple poussa des cris, et l’on sonna des trompettes[a]. Dès que le peuple entendit le son de la trompette, il poussa un grand cri, et la muraille s’effondra sur place[b]. Le peuple monta dans la ville, chacun droit devant lui, et ils s’emparèrent de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne le shofar, un instrument servant à donner des signaux, généralement fait d’une corne animale.
    reason: cultural_note
  - marker: b
    text: 'L’hébreu dit littéralement que la muraille « tomba sous elle-même », expression inhabituelle qui peut décrire un effondrement sur place. Autre traduction possible : « tomba à plat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: poussa des cris / poussa un grand cri
  rationale: La racine רוע et le nom תְּרוּעָה désignent une forte clameur, notamment guerrière ou cultuelle. « Pousser des cris » et « pousser un grand cri » rendent la répétition et l’intensification sans préciser davantage la nature du cri.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: cors / cor
  rationale: Le שׁוֹפָר est un instrument à vent fait d’une corne et utilisé pour donner des signaux. « Cor » est naturel en français et évite de le confondre avec une trompette métallique moderne.
- source_word: קוֹל הַשּׁוֹפָר
  choice: le son du cor
  rationale: קוֹל signifie ici le son produit par l’instrument. Cette formulation française est simple et proche de l’hébreu.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: la muraille s’effondra sur elle-même
  rationale: L’expression hébraïque, littéralement proche de « tomba sous elle-même », est inhabituelle. « S’effondra sur elle-même » reste intelligible tout en conservant l’image d’un affaissement vertical sur place.
- source_word: וַיַּעַל ... הָעִירָה
  choice: monta dans la ville
  rationale: עלה signifie « monter », et le suffixe directionnel de עִירָה indique le mouvement vers la ville puis à l’intérieur de celle-ci.
- source_word: אִישׁ נֶגְדּוֹ
  choice: chacun droit devant lui
  rationale: אִישׁ est employé distributivement et נֶגְדּוֹ indique ce qui se trouve directement en face de chacun. La formulation française préserve cette progression individuelle et directe.
- source_word: וַיִּלְכְּדוּ
  choice: ils s’emparèrent
  rationale: לכד désigne couramment la prise militaire d’une ville. « S’emparer de » est idiomatique et précis en français.
theological_decisions:
- issue: Expression distributive masculine אִישׁ נֶגְדּוֹ
  choice: chacun droit devant lui
  alternative: chaque homme droit devant lui
  rationale: Le masculin singulier hébreu est distributif. En français, « chacun… lui » conserve le masculin grammatical et l’avancée individuelle sans produire la lourdeur de « chaque homme », tout en laissant le contexte narratif déterminer le groupe concerné.
- issue: Nature de l’effondrement de la muraille
  choice: s’effondra sur elle-même
  alternative: tomba à plat
  rationale: Le texte hébreu comporte une expression rare qui ne décrit pas avec certitude le mécanisme exact. La traduction conserve cette étrangeté relative plutôt que de trancher en faveur d’un aplatissement précis.
translation_notes:
  register: Français international actuel, narratif et digne. Le passé simple convient au récit soutenu sans archaïsme excessif. La répétition de « peuple » et de « ville » reflète celle de l’hébreu, tandis que « l’on sonna » rend naturellement le changement de sujet implicite entre le peuple qui crie et ceux qui sonnent des cors.
