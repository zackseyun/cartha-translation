review_pass:
  verdict: revise
  source_fidelity: La séquence narrative, la répétition de « peuple », le grand cri, l’entrée dans la ville et sa prise rendent fidèlement l’hébreu. Cependant, « cors » désigne normalement en français un instrument de cuivre et risque donc de présenter le shofar comme un cor moderne. De plus, « s’effondra sur elle-même » suggère une direction de l’effondrement que l’expression rare תחתיה ne précise pas. « S’effondra sur place » est plus naturel et ne tranche pas le sens litigieux, que la note explicite.
  naturalness: Le français est fluide et le passé simple convient au récit biblique soutenu. « Trompettes » est l’équivalent biblique usuel et le plus immédiatement compréhensible; la note permet de préciser la nature du shofar. « Monta dans la ville » maintient utilement la nuance de montée et de mouvement à l’intérieur.
  terminology: Remplacer « cors » par « trompettes » évite l’anachronisme instrumental potentiel tout en conservant le terme hébreu shofar en note. « Chacun droit devant lui » rend correctement la valeur distributive de איש נגדו sans imposer une interprétation supplémentaire.
  issues:
  - severity: medium
    issue: « Cors » pour שופרות
    rationale: En français contemporain, un cor évoque principalement un instrument de cuivre (notamment le cor d’orchestre). Cette désignation entre en tension avec la note, qui décrit le shofar comme une corne animale. « Trompettes », accompagné de la note sur le shofar, est plus idiomatique et plus sûr.
  - severity: medium
    issue: « La muraille s’effondra sur elle-même » pour ותפל החומה תחתיה
    rationale: « Sur elle-même » évoque un effondrement vers ou sur ses propres débris. Le texte hébreu emploie une expression inhabituelle, littéralement proche de « sous elle-même », dont le mécanisme reste incertain. « S’effondra sur place » préserve l’absence de précision; la note conserve la formulation littérale et l’alternative « tomba à plat ».
  revised_text: Alors le peuple poussa des cris, et l’on sonna des trompettes[a]. Dès que le peuple entendit le son de la trompette, il poussa un grand cri, et la muraille s’effondra sur place[b]. Le peuple monta dans la ville, chacun droit devant lui, et ils s’emparèrent de la ville.
  revised_footnotes:
