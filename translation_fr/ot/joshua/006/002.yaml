base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: fr
  text: 'Yahweh dit à Josué : « Vois, j’ai livré entre tes mains Jéricho, son roi et les vaillants guerriers[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les puissants hommes de guerre ». L’expression hébraïque associe les idées de force, de valeur et d’aptitude militaire.'
    reason: Alternative lexicale reflétant les composantes de גִּבּוֹרֵי הֶחָיִל.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel YHWH au lieu de le remplacer par un titre, dans une forme largement reconnaissable en français.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw narratif fait progresser le récit. En français moderne, le passé simple suffit naturellement à exprimer cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif attire directement l’attention de Josué. « Vois » conserve sa forme et sa force, sans recourir à l’archaïsant « voici » ou à l’explicitation « sache-le ».
- source_word: נָתַתִּי
  choice: j’ai livré
  rationale: Le parfait présente l’action comme accomplie du point de vue de Yahweh. Dans ce contexte militaire, « livrer » exprime naturellement le fait de placer la ville au pouvoir de Josué tout en conservant l’aspect accompli.
- source_word: בְיָדְךָ
  choice: entre tes mains
  rationale: Cette expression française conserve l’image corporelle de l’idiome hébreu et communique clairement l’idée de mise au pouvoir de quelqu’un.
- source_word: יְרִיחוֹ
  choice: Jéricho
  rationale: Forme française usuelle du nom de la ville.
- source_word: מַלְכָּהּ
  choice: son roi
  rationale: Le suffixe féminin renvoie à Jéricho, ville de genre féminin en hébreu. « Son roi » identifie naturellement ce lien en français.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: ses vaillants guerriers
  rationale: « Guerriers » rend la dimension militaire, tandis que « vaillants » conserve l’idée de force, de capacité et de bravoure portée par l’expression hébraïque composée.
theological_decisions:
- issue: Valeur du parfait נָתַתִּי avant la prise de Jéricho
  choice: « j’ai livré », déclaration présentant la victoire comme acquise
  alternative: « je livre » ou « je livrerai »
  rationale: Le parfait hébreu présente le don divin comme déjà accompli ou assuré, alors même que la bataille reste à venir. Le passé composé préserve cette tension narrative et théologique sans la convertir explicitement en futur.
translation_notes:
  register: Français international moderne, direct et digne. La formulation garde l’impératif « Vois », le nom divin et l’image « entre tes mains », tout en employant un vocabulaire militaire naturel.
