source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: fr
  text: 'Mais les hommes d’Israël dirent au Hivite : « Peut-être habites-tu parmi nous[a]. Comment donc pourrais-je conclure une alliance avec toi[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au milieu de moi » ; le singulier correspond vraisemblablement à un porte-parole représentant Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « couper une alliance avec toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: les hommes d’Israël
  rationale: Le singulier אִישׁ a ici une valeur collective et désigne les représentants israélites. Cette formulation garde la force masculine et collective de l’hébreu sans donner l’impression qu’un seul homme est en cause.
- source_word: הַחִוִּי
  choice: au Hivvite
  rationale: 'Le singulier hébreu est conservé : la personne interpellée représente vraisemblablement son groupe.'
- source_word: אוּלַי
  choice: Peut-être
  rationale: Ce terme exprime naturellement le soupçon ou l’éventualité envisagée, dans un registre français courant et digne.
- source_word: בְּקִרְבִּי
  choice: parmi nous
  rationale: L’expression signifie littéralement « en mon sein », mais le locuteur parle au nom d’Israël. « Parmi nous » rend clairement le sens collectif et géographique, tandis qu’une note signale le singulier hébreu.
- source_word: יוֹשֵׁב
  choice: habites-tu
  rationale: Le participe de ישׁב décrit ici le fait de résider durablement dans un lieu. « Habiter » est précis, naturel et plus concis que « être en train de vivre ».
- source_word: וְאֵיךְ
  choice: Comment donc pourrais-je
  rationale: « Donc » marque le lien logique avec le soupçon précédent, et le conditionnel français exprime naturellement l’impossibilité envisagée dans ce contexte.
- source_word: אכרות ... בְרִית
  choice: conclure une alliance
  rationale: Littéralement, l’hébreu dit « couper une alliance ». « Conclure une alliance » est l’expression française idiomatique qui conserve pleinement la notion d’engagement formel.
- source_word: לְךָ
  choice: avec toi
  rationale: Avec le vocabulaire de l’alliance, la préposition désigne naturellement l’autre partie contractante et se rend en français par « avec ».
theological_decisions:
- issue: Les formes singulières dans la parole représentative d’Israël
  choice: Rendre בְּקִרְבִּי collectivement par « parmi nous », tout en conservant le singulier « pourrais-je » dans la question suivante
  alternative: 'Conserver tous les singuliers : « en mon sein… comment pourrais-je conclure une alliance avec toi ? »'
  rationale: L’hébreu emploie un locuteur représentatif d’Israël. Une traduction entièrement littérale de בְּקִרְבִּי serait obscure en français. Le mélange de « nous » et « je » préserve à la fois la portée collective et le singulier effectif du verbe אכרות, sans supprimer la tension grammaticale du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Hivvite » suit l’appellation biblique française traditionnelle. Le contraste initial est rendu par « Mais », et le tutoiement reflète les formes singulières de l’adresse hébraïque.
