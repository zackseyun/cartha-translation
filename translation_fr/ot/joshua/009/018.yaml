  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: fr
  text: Mais les Israélites ne les frappèrent pas[a], car les chefs de la communauté leur avaient prêté serment par Yahweh, le Dieu d’Israël. Et toute la communauté murmura contre les chefs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne les attaquèrent pas » ou « ne les tuèrent pas ». Dans ce contexte, le verbe hébreu traduit par « frapper » peut désigner une attaque allant jusqu’à la mise à mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: ne les frappèrent pas
  rationale: Le verbe נכה signifie concrètement « frapper » et peut, dans un contexte militaire, impliquer une attaque ou une mise à mort. La traduction retient le terme non spécifié du texte hébreu, avec une note explicitant sa portée possible.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël »; en français moderne, « les Israélites » exprime naturellement l’ensemble du peuple sans suggérer qu’il s’agit seulement des hommes.
- source_word: כִּי
  choice: car
  rationale: Introduit clairement la raison pour laquelle les Israélites ne frappèrent pas les Gabaonites, dans un registre narratif digne et courant.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: leur avaient prêté serment
  rationale: Le plus-que-parfait marque que le serment précède le refus de les frapper; « prêter serment à quelqu’un » rend idiomatiquement le niphal de שׁבע avec ל.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: les chefs de la communauté
  rationale: נְשִׂיאִים désigne les dirigeants reconnus, et עֵדָה le corps collectif d’Israël. « Communauté » est clair et n’importe pas de structure ecclésiale ultérieure.
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: par Yahweh, le Dieu d’Israël
  rationale: Avec le verbe « prêter serment », בְּ désigne celui par qui l’on jure. Le nom divin יהוה est transcrit « Yahweh », puis identifié par l’apposition hébraïque.
- source_word: וַיִּלֹּנוּ
  choice: se mit à murmurer
  rationale: Le verbe לון décrit la protestation collective dirigée contre les responsables. « Murmurer contre » conserve sa résonance narrative biblique sans se réduire à une simple remarque.
- source_word: כָל הָעֵדָה עַל הַנְּשִׂיאִים
  choice: toute la communauté … contre les chefs
  rationale: « Toute » préserve la portée de כָל, tandis que « contre » rend la valeur adversative de עַל après לון.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie explicitement le Tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Désignation de la collectivité עֵדָה
  choice: communauté
  alternative: assemblée; congrégation
  rationale: « Communauté » désigne naturellement Israël comme corps collectif rassemblé, sans imposer une connotation ecclésiastique plus tardive.
- issue: Portée violente de נכה
  choice: frapper
  alternative: attaquer; tuer
  rationale: Le contexte autorise une attaque potentiellement mortelle, mais le verbe ne précise pas ici à lui seul l’issue. Le texte principal conserve cette tension et la note indique les possibilités contextuelles.
translation_notes:
  register: Français international moderne, narratif et digne. « Israélites » est préféré au calque « fils d’Israël » pour désigner naturellement tout le peuple. La coordination finale est rendue par « Alors » afin de marquer la réaction qui suit, sans ajouter de causalité doctrinale.
