id: JOS.9.20
reference: Joshua 9:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: fr
  text: 'Voici ce que nous leur ferons : nous les laisserons vivre[a], afin que la colère[b] ne s’abatte pas sur nous à cause du serment que nous leur avons fait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous les maintiendrons en vie » ou « nous les épargnerons ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, il s’agit vraisemblablement de la colère de Dieu, bien que le texte hébreu ne dise pas explicitement « la colère du Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: Voici ce que nous leur ferons
  rationale: Le démonstratif introduit la conduite proposée, et l’imparfait hébreu exprime ici une action future décidée. « Voici ce que » est naturel en français tout en conservant la fonction discursive de זֹאת.
- source_word: וְהַחֲיֵה אֹתָם
  choice: nous les laisserons vivre
  rationale: Le hiphil de חיה signifie laisser vivre ou maintenir en vie. Cette formulation française est concise, naturelle et moins interprétative que « nous les épargnerons ».
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: afin que la colère ne s’abatte pas sur nous
  rationale: La tournure exprime la conséquence que les chefs veulent éviter. « S’abattre sur nous » rend naturellement היה עַל dans ce contexte de menace, tandis que « afin que » explicite sans excès la nuance de but ou de résultat.
- source_word: קֶצֶף
  choice: la colère
  rationale: Le terme désigne une colère intense, vraisemblablement divine ici. « La colère » demeure idiomatique et grave en français, sans ajouter explicitement un possesseur absent de l’hébreu.
- source_word: עַל הַשְּׁבוּעָה
  choice: à cause du serment
  rationale: עַל indique ici le motif de la colère redoutée. « À cause de » exprime clairement cette relation causale.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: que nous leur avons fait
  rationale: En français, on « fait » ou « prête » un serment à quelqu’un. « Le serment que nous leur avons fait » restitue directement le sens du niphal de שׁבע avec ל et évite la tournure moins naturelle « que nous leur avons juré ».
theological_decisions:
- issue: Nature de קֶצֶף dans le contexte de la violation d’un serment
  choice: Conserver « la colère » sans nommer explicitement Dieu dans le texte principal.
  alternative: Traduire « la colère du Seigneur » afin d’expliciter le référent divin probablement sous-entendu.
  rationale: Dans ce contexte d’un serment solennel, la colère est vraisemblablement celle de Dieu, mais le texte hébreu ne nomme pas explicitement le Seigneur. La traduction préserve cette implication sans transformer une donnée implicite en affirmation explicite.
translation_notes:
  register: Français international actuel, clair et digne. Le deux-points rend naturelle en français la relation entre l’annonce de la décision et son contenu, sans ajouter d’idée. « Laisser vivre » demeure accessible et proche de l’hébreu ; « la colère » conserve l’ambiguïté quant à son détenteur explicite.
