source:
  edition: WLC
  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: fr
  text: Les hommes prirent donc une partie de leurs provisions, mais ils ne consultèrent pas Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la bouche de Yahweh » ; cette expression désigne sa réponse, sa décision ou sa direction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: prirent donc
  rationale: Le verbe לקח signifie fondamentalement « prendre ». Le contexte justifie le lien narratif « donc », qui rend le וַ consécutif sans surinterpréter l’action.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: L’hébreu dit simplement « les hommes ». Le contexte permet de les identifier, mais le verset ne précise ici ni « d’Israël » ni « les chefs ».
- source_word: מִצֵּידָם
  choice: une partie de leurs provisions
  rationale: 'צֵיד désigne ici les vivres ou provisions de voyage, et la préposition מִן a vraisemblablement une valeur partitive : ils en prennent une partie.'
- source_word: וְאֶת־פִּי יְהוָה לֹא שָׁאָלוּ
  choice: mais ils ne consultèrent pas Yahweh
  rationale: Littéralement, ils « ne demandèrent pas la bouche de Yahweh ». Dans ce contexte, l’expression signifie qu’ils ne sollicitèrent pas sa réponse ou sa direction. « Consulter Yahweh » restitue naturellement cet acte en français sans préciser indûment le moyen de consultation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Interprétation de l’expression פִּי יְהוָה
  choice: consultèrent Yahweh, avec note littérale
  alternative: demandèrent l’avis de Yahweh ; interrogèrent la bouche de Yahweh
  rationale: L’expression « bouche de Yahweh » désigne sa réponse ou sa décision. La traduction idiomatique évite un calque obscur, tandis que la note conserve l’image hébraïque et la gamme de sens sans imposer « conseil », « ordre » ou « oracle ».
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste concise. « Une partie de » explicite la valeur partitive de מִן ; la note préserve l’idiome concret de l’hébreu.
