source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: fr
  text: Ce jour-là, Josué les chargea de couper du bois et de puiser de l’eau pour la communauté et pour l’autel de Yahweh, jusqu’à ce jour, au lieu qu’il choisirait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: les chargea de
  rationale: Dans cette construction avec des participes désignant des fonctions, נתן exprime l’affectation à une tâche. « Les chargea de » rend naturellement cette valeur en français sans suggérer que Josué les aurait littéralement donnés.
- source_word: חֹטְבֵי עֵצִים
  choice: couper du bois
  rationale: L’expression participiale désigne ceux qui coupent du bois. La tournure verbale française est plus naturelle que « coupeurs de bois » tout en conservant précisément la tâche imposée.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: puiser de l’eau
  rationale: שאב signifie tirer ou puiser de l’eau. « Puiser de l’eau » exprime directement l’action, alors que « porter de l’eau » déplacerait l’accent vers le transport.
- source_word: לָעֵדָה
  choice: pour la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël. « Communauté » est clair en français moderne et conserve la dimension collective sans la connotation spécifiquement ecclésiale que peut prendre « assemblée ».
- source_word: וּלְמִזְבַּח יְהוָה
  choice: et pour l’autel de Yahweh
  rationale: La formulation garde le lien direct entre leur service et l’autel, ainsi que le nom divin présent dans le texte hébreu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Cette expression indique que la situation décrite se prolonge jusqu’à l’époque du narrateur.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: au lieu qu’il choisirait
  rationale: « Au lieu » rend ici la destination ou le cadre du service. Le conditionnel français situe le choix à venir par rapport au moment du récit et le pronom personnel préserve la formulation hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Référent de « il » dans « le lieu qu’il choisirait »
  choice: Maintien du pronom « il », qui renvoie implicitement à Yahweh
  alternative: le lieu qui serait choisi
  rationale: La formule biblique attribue normalement à Yahweh le choix du sanctuaire. Conserver le pronom respecte cette initiative divine tout en évitant d’ajouter le nom là où l’hébreu ne le répète pas.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation verbale « les chargea de couper… et de puiser… » évite les noms de métier peu naturels tout en conservant l’affectation durable à ces tâches. L’ordre des éléments suit de près l’hébreu et maintient la perspective narrative de « choisirait ».
