revisions:
- from: 'Ils répondirent à Josué : « C’est que tes serviteurs ont été clairement informés[a] de ce que Yahweh, ton Dieu, avait ordonné à Moïse, son serviteur : vous donner tout le pays et exterminer devant vous tous ses habitants. Nous avons donc eu très peur pour notre vie à cause de vous, et voilà pourquoi nous avons agi ainsi. »'
  to: 'Ils répondirent à Josué : « Tes serviteurs avaient en effet été bien informés[a] de ce que Yahweh, ton Dieu, avait ordonné à Moïse, son serviteur : vous donner tout le pays et faire disparaître devant vous tous les habitants du pays. C’est pourquoi nous avons eu très peur pour nos vies à cause de vous, et nous avons fait cela. »'
  rationale: La révision maintient le sens et le ton du discours des Gabaonites tout en préférant des équivalents français plus exacts et moins surinterprétatifs. Elle conserve l’ambiguïté du passif hébreu quant à l’agent de l’information, la valeur intensive de la construction emphatique, ainsi que la double fonction contextuelle de « devant vous » et « à cause de vous ».
