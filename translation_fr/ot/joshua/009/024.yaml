  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: fr
  text: 'Ils répondirent à Josué : « Tes serviteurs avaient en effet été bien informés[a] de ce que Yahweh, ton Dieu, avait ordonné à Moïse, son serviteur : vous donner tout le pays et faire disparaître devant vous tous les habitants du pays. C’est pourquoi nous avons eu très peur pour nos vies à cause de vous, et nous avons fait cela. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un infinitif absolu avec le verbe conjugué pour renforcer l’affirmation. On pourrait aussi traduire : « Tes serviteurs avaient bel et bien été informés » ou « il avait été expressément rapporté à tes serviteurs ».'
    reason: Signaler l’emphase de la construction hébraïque sans réduire celle-ci à l’idée de clarté de l’information.
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: Ils répondirent à Josué
  rationale: Le français naturel n’a pas besoin de reproduire le double introducteur hébreu « répondirent… et dirent » ; « répondirent » conserve pleinement la fonction dialogique.
- source_word: כִּי
  choice: C’est que
  rationale: Introduit naturellement en français l’explication de leur conduite, sans alourdir la réponse par un « parce que » isolé.
- source_word: הֻגֵּד הֻגַּד
  choice: ont été clairement informés
  rationale: L’infinitif absolu joint au verbe conjugué intensifie l’affirmation. La formulation passive préserve la structure et « clairement » en exprime l’emphase.
- source_word: לַעֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Il s’agit ici d’une autodésignation déférente dans un échange diplomatique, non d’une insistance sur l’esclavage.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré, tandis que le possessif singulier adressé à Josué est conservé.
- source_word: אֵת אֲשֶׁר צִוָּה
  choice: de ce que… avait ordonné
  rationale: « Ce que » restitue la relative de contenu. Le plus-que-parfait français situe naturellement l’ordre antérieur à l’information reçue, sans changer le contenu verbal.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: vous donner tout le pays
  rationale: « Pays » convient mieux que « terre » au territoire précis évoqué dans le contexte de la conquête.
- source_word: וּלְהַשְׁמִיד
  choice: et exterminer
  rationale: Dans ce contexte où l’objet est l’ensemble des habitants, « exterminer » rend la destruction totale visée par השמיד, sans l’atténuer.
- source_word: מִפְּנֵיכֶם
  choice: devant vous / à cause de vous
  rationale: 'La même locution reçoit deux équivalents contextuels : déplacement ou élimination devant l’avancée d’Israël dans la première occurrence, cause de la peur dans la seconde.'
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ
  choice: Nous avons donc eu très peur pour notre vie
  rationale: « Avoir très peur pour sa vie » est l’expression française courante correspondant au sens de נפשׁ dans ce contexte de menace mortelle.
- source_word: וַנַּעֲשֵׂה אֶת־הַדָּבָר הַזֶּה
  choice: voilà pourquoi nous avons agi ainsi
  rationale: Rend idiomatiquement « nous avons fait cette chose » comme l’explication de leur stratagème.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le caractère propre du nom divin sans le remplacer par un titre.
- issue: Portée de l’ordre de destruction
  choice: exterminer devant vous tous ses habitants
  alternative: détruire tous les habitants du pays devant vous
  rationale: La traduction conserve la dureté et l’étendue universelle de la déclaration rapportée par les Gabaonites, sans l’atténuer ni ajouter une justification théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours reste déférent avec « tes serviteurs », mais les tournures inutilement calquées sur l’hébreu sont idiomatisées. Le vouvoiement pluriel (« vous ») désigne Israël, tandis que « ton Dieu » s’adresse personnellement à Josué.
