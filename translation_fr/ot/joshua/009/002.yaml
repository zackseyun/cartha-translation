translation:
  language: fr
  text: Ils se rassemblèrent tous pour combattre Josué et Israël d’un commun accord[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’une seule bouche »; cette expression hébraïque évoque une action menée dans une entière unité de volonté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: ils se rassemblèrent
  rationale: Le nifal de קבץ exprime ici le fait de se réunir en groupe. « Se rassemblèrent » est naturel et conserve l’idée d’une action collective.
- source_word: יַחְדָּו
  choice: tous
  rationale: L’adverbe souligne que les groupes mentionnés au verset précédent agissent ensemble. « Tous » s’intègre naturellement à la proposition tout en préservant cette portée collective.
- source_word: לְהִלָּחֵם
  choice: pour combattre
  rationale: L’infinitif nifal de לחם désigne l’engagement dans le combat. « Pour combattre » exprime clairement le but de leur rassemblement.
- source_word: עִם יְהוֹשֻׁעַ וְעִם יִשְׂרָאֵל
  choice: Josué et Israël
  rationale: Après un verbe de combat, עִם indique les adversaires. En français, le verbe « combattre » peut prendre directement son objet; cette formulation évite le tour moins naturel « combattre contre » tout en rendant exactement l’opposition.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: פֶּה אֶחָד
  choice: d’un commun accord
  rationale: L’expression signifie littéralement « d’une seule bouche » et décrit une action unanime. « D’un commun accord » en restitue naturellement le sens en français moderne.
