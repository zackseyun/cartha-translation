  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: fr
  text: 'Ils lui dirent : « Tes serviteurs sont venus d’un pays très lointain à cause du nom de Yahweh, ton Dieu, car nous avons entendu parler de sa renommée[a] et de tout ce qu’il a fait en Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ce qu’on rapporte à son sujet » ou « sa réputation ». L’hébreu emploie deux mots apparentés et dit littéralement : « nous avons entendu ce qu’on entend de lui » ou « nous avons entendu son rapport ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Ils lui dirent
  rationale: Formule narrative française naturelle qui rend le wayyiqtol suivi du discours direct sans surinterpréter le lien logique.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: d’un pays très lointain
  rationale: Rend l’adjectif רְחוֹקָה et son intensif מְאֹד dans un français courant et fidèle à l’emphase.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cette démarche diplomatique, le terme exprime une humble déférence plutôt qu’il ne souligne une condition d’esclavage.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: à cause du nom de Yahweh, ton Dieu
  rationale: La préposition לְ indique ici le motif de leur venue. « À cause du nom » conserve l’expression hébraïque tout en restant intelligible en français.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: nous avons entendu parler de sa renommée
  rationale: L’expression construite sur deux mots apparentés évoque ce que l’on entend dire de quelqu’un, sa réputation ou sa renommée. La formulation française est naturelle sans effacer les autres nuances, signalées en note.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: et de tout ce qu’il a fait en Égypte
  rationale: Rendu direct et idiomatique de la proposition objet; la répétition de « de » coordonne clairement les deux compléments d’« entendre parler ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre et évite de le remplacer par un titre.
- issue: Sens de לְשֵׁם dans le motif de la venue
  choice: à cause du nom de Yahweh
  alternative: pour le nom de Yahweh / au nom de Yahweh
  rationale: « À cause du nom » exprime que la réputation attachée à Yahweh motive leur venue, sans suggérer à tort qu’ils sont ses représentants ni définir plus précisément leur intention.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier hébreu adressé à Josué. La formulation conserve la déférence diplomatique des Gabaonites et l’expression théologiquement chargée « le nom de Yahweh ».
