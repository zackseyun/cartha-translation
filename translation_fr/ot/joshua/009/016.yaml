  source_fidelity: 'La structure temporelle et l’alliance sont correctement rendues. En revanche, « vivaient près d’eux, dans leur voisinage » fusionne et affaiblit les deux affirmations distinctes de l’hébreu : ces gens « étaient proches » et « habitaient au milieu/dans le sein » d’Israël. La révision conserve explicitement les deux prédications.'
