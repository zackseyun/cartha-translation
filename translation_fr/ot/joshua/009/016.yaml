  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: fr
  text: Au bout de trois jours, après qu’ils eurent conclu une alliance avec eux, les Israélites apprirent que ces gens étaient proches d’eux et habitaient au milieu d’eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: Au bout de trois jours
  rationale: Formulation française naturelle qui rend l’indication temporelle hébraïque sans alourdir le récit par un calque de « et il arriva ».
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: ils eurent conclu une alliance avec eux
  rationale: « Conclure une alliance » est l’équivalent idiomatique courant de l’expression hébraïque littérale « couper une alliance »; le plus-que-parfait situe clairement l’action avant la découverte.
- source_word: וַיִּשְׁמְעוּ
  choice: les Israélites apprirent
  rationale: Dans ce contexte, שמע signifie recevoir une information. Le sujet implicite est explicité pour éviter l’ambiguïté entre les deux groupes désignés par des pronoms.
- source_word: כִּי קְרֹבִים הֵם אֵלָיו וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: que ces gens vivaient près d’eux, dans leur voisinage
  rationale: 'Rend les deux affirmations étroitement parallèles: proximité géographique et résidence dans la région proche. « Ces gens » clarifie le référent sans ajouter d’identification absente du verset.'
