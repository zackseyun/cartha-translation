source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּֽל הַ/מְּלָכִ֡ים אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בְ/כֹל֙ ח֚וֹף הַ/יָּ֣ם הַ/גָּד֔וֹל אֶל מ֖וּל הַ/לְּבָנ֑וֹן הַֽ/חִתִּי֙ וְ/הָ֣/אֱמֹרִ֔י הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: fr
  text: Il arriva que, lorsque tous les rois qui se trouvaient par-delà le Jourdain[b] — dans la région montagneuse, dans les basses terres[c] et sur tout le littoral de la Grande Mer, en direction du Liban — les Hittites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites, apprirent cela[a]...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « lorsque tous les rois ... entendirent », sans préciser ce qu’ils entendirent ; « cela » est explicité d’après le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’autre côté du Jourdain ». L’expression hébraïque peut se comprendre dans l’un ou l’autre sens selon le point de vue géographique.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans la Shéphéla », région de basses collines située à l’ouest des hautes terres.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette formule rend l’ouverture narrative hébraïque sans recourir à l’archaïsme « il advint que ».
- source_word: כִשְׁמֹעַ
  choice: apprirent cela
  rationale: L’infinitif construit avec כִּי exprime ici la circonstance temporelle. Le français emploie naturellement un verbe conjugué; « cela » explicite l’objet que l’hébreu laisse sous-entendu.
- source_word: כָּל הַמְּלָכִים
  choice: tous les rois
  rationale: Rendu direct du quantificateur et du nom définis.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: qui se trouvaient par-delà le Jourdain
  rationale: « Par-delà » conserve l’expression géographique sans imposer explicitement un point de vue oriental ou occidental.
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: Dans ce contexte, הַר désigne une région géographique de hautes terres plutôt qu’une montagne isolée.
- source_word: וּבַשְּׁפֵלָה
  choice: dans le Bas-Pays
  rationale: Ce nom géographique désigne la zone de basses collines située entre les hautes terres et la plaine côtière; la majuscule signale qu’il s’agit d’une région déterminée.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: et sur tout le littoral de la Grande Mer
  rationale: « Littoral » rend naturellement חוֹף, tandis que « Grande Mer » conserve la désignation hébraïque de la Méditerranée.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: en direction du Liban
  rationale: La formulation exprime l’orientation géographique sans surdéterminer le sens de la locution.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: les Hittites, les Amorites, les Cananéens, les Perizzites, les Hivites et les Jébusites
  rationale: Le pluriel français rend naturellement les ethnonymes hébreux au singulier collectif et clarifie qu’il s’agit des peuples auxquels appartiennent les rois.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les tirets structurent la longue description géographique et l’énumération des peuples. Le verset conserve la relation étroite avec la suite du récit tout en restant lisible isolément.
