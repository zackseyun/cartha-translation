source:
  edition: WLC
  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: fr
  text: 'Voici notre pain : il était chaud lorsque nous l’avons emporté de chez nous comme provision, le jour où nous sommes partis pour venir vers vous. Mais maintenant, regardez : il est sec et s’est couvert de taches[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est devenu moisi », « friable » ou « fendillé ». Le terme hébreu évoque quelque chose marqué de points ou de taches; appliqué à du vieux pain, sa nuance exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: Voici notre pain
  rationale: Le démonstratif désigne le pain présenté comme preuve. « Voici notre pain » restitue naturellement ce geste déictique en français.
- source_word: חָם
  choice: il était chaud
  rationale: « Chaud » traduit directement l’adjectif hébreu sans remplacer son sens par l’implication plus interprétative « frais ».
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: nous l’avons emporté […] comme provision
  rationale: La forme verbale exprime le fait de se munir de provisions. Cette tournure française conserve le pain comme objet et explicite sa fonction pour le voyage.
- source_word: מִבָּתֵּינוּ
  choice: de chez nous
  rationale: Littéralement « de nos maisons ». « De chez nous » est plus naturel en français moderne tout en conservant l’idée du lieu de départ domestique.
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: le jour où nous sommes partis
  rationale: La construction infinitive situe l’action au jour du départ; la formulation retenue est claire et idiomatique.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: pour venir vers vous
  rationale: Le verbe hébreu signifie littéralement « aller », mais les locuteurs décrivent un déplacement en direction de leurs interlocuteurs. « Venir vers vous » est naturel en français dans cette situation.
- source_word: וְעַתָּה הִנֵּה
  choice: Mais maintenant, regardez
  rationale: « Mais » marque le contraste avec l’état initial, tandis que « regardez » conserve l’appel à constater l’état présent du pain.
- source_word: יָבֵשׁ
  choice: il est sec
  rationale: La traduction exprime directement l’état présent indiqué par l’hébreu.
- source_word: וְהָיָה נִקֻּדִים
  choice: s’est couvert de taches
  rationale: נִקֻּדִים évoque littéralement des points ou des marques. Cette traduction conserve l’image visible sans déterminer avec une certitude injustifiée s’il s’agit de moisissure, de fissures ou d’un pain devenu friable.
