base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: fr
  text: 'Eux aussi agirent avec ruse[a] : ils allèrent se déguiser et prirent des sacs usés pour leurs ânes, ainsi que des outres à vin usées, fendues et liées[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu rendu par « se déguiser » est difficile. On peut aussi comprendre : « ils se munirent de provisions » ou « ils se firent passer pour des envoyés ». Le contexte de la tromperie et de l’apparence créée par les objets usés favorise ici « se déguiser ».'
    reason: alternative_reading
  - marker: b
    text: Ou « raccommodées ». Le terme peut désigner des outres attachées ou liées, probablement pour les réparer après qu’elles se furent fendues.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הֵמָּה
  choice: Eux aussi
  rationale: Rend l’idée que les Gabaonites, eux aussi, réagirent aux événements rapportés auparavant.
- source_word: בְּעָרְמָה
  choice: avec ruse
  rationale: Le nom désigne l’habileté rusée; dans ce contexte de tromperie, « avec ruse » reste précis sans surinterpréter.
- source_word: וַיִּצְטַיָּרוּ
  choice: se déguiser
  rationale: Le verbe est difficile. Le contexte immédiat, où les objets usés servent à créer l’apparence d’un long voyage, favorise l’idée qu’ils se donnèrent une fausse apparence.
- source_word: שַׂקִּים בָּלִים
  choice: de vieux sacs usés
  rationale: « Sacs » désigne naturellement les contenants de transport, et « usés » exprime leur détérioration; « vieux » est conservé pour refléter la répétition descriptive du verset.
- source_word: לַחֲמוֹרֵיהֶם
  choice: pour leurs ânes
  rationale: La préposition indique ici que les sacs étaient destinés à être portés par leurs ânes.
- source_word: נֹאדוֹת יַיִן
  choice: outres à vin
  rationale: Expression française courante pour les récipients en peau destinés au vin.
- source_word: מְבֻקָּעִים
  choice: fendues
  rationale: Le participe passif décrit des outres ouvertes ou éclatées par une fente.
- source_word: מְצֹרָרִים
  choice: raccommodées
  rationale: Rend naturellement la réparation des outres endommagées, probablement effectuée en les liant ou en les attachant.
