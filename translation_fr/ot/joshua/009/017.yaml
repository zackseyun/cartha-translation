  text: וַ/יִּסְע֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יָּבֹ֛אוּ אֶל עָרֵי/הֶ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וְ/עָרֵי/הֶם֙ גִּבְע֣וֹן וְ/הַ/כְּפִירָ֔ה וּ/בְאֵר֖וֹת וְ/קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: fr
  text: Les Israélites partirent et arrivèrent à leurs villes le troisième jour. Leurs villes étaient Gabaon, Kefira, Bééroth et Qiryath-Yéarim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partirent
  rationale: Le verbe נסע marque ici le départ et la mise en route. « Partirent » est naturel en français et n’ajoute pas l’idée explicite de lever le camp.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais fonctionne couramment comme ethnonyme collectif. « Les Israélites » est clair, inclusif et idiomatique en français moderne.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: arrivèrent à leurs villes
  rationale: 'בוא avec אֶל exprime l’arrivée à une destination. Cette formulation conserve aussi le référent du possessif : les villes des Gabaonites.'
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Rendu temporel direct et naturel de l’expression hébraïque.
- source_word: וְעָרֵיהֶם
  choice: Leurs villes étaient
  rationale: Le waw introduit ici une précision explicative donnant la liste des villes. Une nouvelle phrase sans connecteur est fluide en français.
- source_word: גִּבְעוֹן
  choice: Gabaon
  rationale: Forme française biblique traditionnelle et largement reconnue.
- source_word: הַכְּפִירָה
  choice: Kefira
  rationale: Translittération française lisible du nom hébreu, avec k pour כ et f pour פ spirant.
- source_word: בְּאֵרוֹת
  choice: Bééroth
  rationale: Forme française traditionnelle, qui représente les voyelles et la consonne finale du nom hébreu.
- source_word: קִרְיַת יְעָרִים
  choice: Qiryath-Yéarim
  rationale: Forme française transparente du nom composé, le trait d’union en préservant la structure.
