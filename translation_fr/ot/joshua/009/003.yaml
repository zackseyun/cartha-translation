  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: fr
  text: Mais les habitants de Gabaon apprirent ce que Josué avait fait à Jéricho et à Aï.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et les habitants de Gabaon apprirent ce que Josué avait fait à Jéricho et à Aï. »'
    reason: Alternative lexicale pour la conjonction initiale וְ, qui peut marquer soit une simple coordination, soit un contraste contextuel.
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: Mais les habitants de
  rationale: יֹשְׁבֵי désigne les habitants ou ceux qui résident dans un lieu. Le וְ initial est rendu par « Mais » afin de marquer le contraste narratif entre la réaction des rois aux versets précédents et celle des habitants de Gabaon.
- source_word: גִבְעוֹן
  choice: Gabaon
  rationale: Forme française traditionnelle et courante du nom de lieu biblique.
- source_word: שָׁמְעוּ
  choice: apprirent
  rationale: Le verbe שׁמע signifie littéralement « entendre », mais peut désigner le fait d'apprendre une nouvelle. Ici, « apprirent » exprime naturellement en français la réception de l'information, sans changer le sens.
- source_word: אֵת אֲשֶׁר
  choice: ce que
  rationale: Cette construction introduit le contenu appris ; « ce que » est sa formulation française naturelle et directe.
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le plus-que-parfait rend clairement l'antériorité des actions de Josué par rapport au moment où les habitants de Gabaon en apprennent la nouvelle.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française usuelle du nom propre biblique.
- source_word: לִֽ/ירִיחוֹ
  choice: à Jéricho
  rationale: La préposition ל indique ici l'objet auquel l'action est appliquée. « À Jéricho » est idiomatique en français et évite d'expliciter par « contre » une nuance seulement implicite.
- source_word: וְ/לָ/עָי
  choice: et à Aï
  rationale: Rendu parallèlement à לִירִיחוֹ ; « Aï » est la forme française usuelle du toponyme.
theological_decisions:
- issue: Valeur de la conjonction וְ au début du verset
  choice: Mais
  alternative: Et
  rationale: Il s'agit d'une décision discursive plutôt que doctrinale. Le וְ peut être simplement coordonnant, mais le contexte oppose la réaction particulière de Gabaon à celle des rois mentionnés auparavant. La variante est conservée en note afin de ne pas effacer l'ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l'hébreu tout en employant « apprirent » plutôt que le plus littéral « entendirent », moins idiomatique ici. Les noms propres suivent l'usage biblique français courant.
