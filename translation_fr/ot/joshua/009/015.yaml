review_pass:
  verdict: revise
  source_fidelity: 'Le sens des deux actions est bien rendu : Josué établit la paix et conclut une alliance afin que les Gabaonites restent en vie; les chefs de la communauté leur prêtent ensuite serment. « Faire alliance » rend convenablement l’idiome hébreu כרת ברית sans littéralisme opaque. Toutefois, « leur en firent le serment » introduit un pronom « en » dont le référent est inutilement ambigu et ne correspond pas directement à וַיִּשָּׁבְעוּ לָהֶם, « ils leur jurèrent / prêtèrent serment ».'
  naturalness: « Josué conclut la paix avec eux » et « pour leur laisser la vie » sont naturels dans un registre narratif soutenu. En revanche, « leur en firent le serment » est lourd et moins idiomatique que « leur jurèrent ».
  terminology: « Alliance » conserve la portée juridique du terme בְּרִית; « chefs de la communauté » convient à נְשִׂיאֵי הָעֵדָה et évite une connotation ecclésiale. La note sur « assemblée » maintient une alternative légitime pour עֵדָה.
  issues:
  - severity: medium
    issue: 'Formulation du serment : « leur en firent le serment »'
    rationale: Le texte hébreu dit simplement que les chefs « leur jurèrent ». Le pronom « en » suggère un objet de serment repris du contexte et alourdit la phrase. « Leur jurèrent » est à la fois plus direct, idiomatique et fidèle.
  - severity: low
    issue: Note b actuelle
    rationale: « Les chefs de l’assemblée le leur jurèrent » conserve le pronom superflu « le » et mêle l’alternative pour הָעֵדָה à une reformulation du verbe. La note doit se limiter à l’alternative terminologique.
  revised_text: Josué conclut la paix avec eux et fit alliance avec eux pour leur laisser la vie[a] ; les chefs de la communauté[b] leur jurèrent.
