  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: fr
  text: Josué conclut la paix avec eux et fit alliance avec eux pour leur laisser la vie[a] ; les chefs de la communauté[b] leur jurèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les maintenir en vie » ou « pour épargner leur vie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les chefs de l’assemblée » ou « les responsables de la communauté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם יְהוֹשֻׁעַ שָׁלוֹם
  choice: Josué conclut la paix avec eux
  rationale: L’expression hébraïque signifie établir des relations pacifiques. « Conclure la paix » est naturel en français et convient au cadre politique et juridique du récit.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: fit alliance avec eux
  rationale: Littéralement, l’hébreu dit « couper une alliance », idiome qui ne se transpose pas naturellement en français moderne. « Faire alliance » conserve le sens juridique et solennel.
- source_word: לְחַיּוֹתָם
  choice: pour leur laisser la vie
  rationale: 'L’infinitif exprime le but de l’alliance : ils ne seront pas mis à mort. Cette formulation reste proche de l’hébreu tout en étant idiomatique.'
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: leur en firent le serment
  rationale: Le verbe désigne la prestation d’un serment. Le pronom « en » relie clairement le serment à l’engagement qui précède sans ajouter de contenu.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: les chefs de la communauté
  rationale: נְשִׂיאִים désigne les dirigeants reconnus, et עֵדָה la collectivité d’Israël. « Chefs de la communauté » est précis, actuel et dépourvu de connotation ecclésiale indue.
theological_decisions:
- issue: Expression idiomatique de l’alliance
  choice: fit alliance
  alternative: conclut une alliance ; littéralement « coupa une alliance »
  rationale: Le français rend le sens de l’idiome hébreu sans reproduire une image opaque, tout en maintenant la portée juridique et théologique de l’alliance.
- issue: Sens de הָעֵדָה
  choice: la communauté
  alternative: l’assemblée ; la collectivité
  rationale: Le mot désigne ici la communauté israélite représentée par ses chefs. « Communauté » préserve cette dimension collective sans suggérer une institution ecclésiale ultérieure.
- issue: Portée de לְחַיּוֹתָם
  choice: pour leur laisser la vie
  alternative: pour les maintenir en vie ; pour épargner leur vie
  rationale: La formulation conserve l’idée explicite que l’alliance garantit leur survie, sans préciser davantage les motifs ou les modalités.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le point-virgule distingue les deux actes liés : l’engagement de Josué et le serment des chefs. Tous les marqueurs de notes figurent dans le texte.'
