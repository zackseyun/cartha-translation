base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: fr
  text: 'Alors Josué les convoqua et leur dit : « Pourquoi nous avez-vous trompés en disant : “Nous sommes très loin de vous”, alors que vous habitez au milieu de nous ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: les fit appeler
  rationale: Dans ce contexte, l’expression indique que Josué les convoque ou les fait venir. « Les fit appeler » est naturel en français et rend cette nuance mieux que le simple « les appela ».
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: leur dit
  rationale: Cette formule hébraïque introduit directement le discours. Le français naturel condense « parla avec eux en disant » en « leur dit » sans perte de sens.
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: nous avez-vous trompés
  rationale: Le piel de רמה exprime une tromperie délibérée. « Tromper » conserve la force de l’accusation tout en restant courant et digne.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: Nous habitons très loin de vous
  rationale: Le texte dit littéralement « nous sommes très éloignés de vous ». Dans ce contexte géographique, « nous habitons très loin de vous » explicite naturellement la résidence revendiquée sans modifier l’accusation.
- source_word: בְּקִרְבֵּנוּ יֹשְׁבִים
  choice: vous habitez au milieu de nous
  rationale: בקרבנו signifie « au milieu de nous » ou « parmi nous », et le participe ישׁב désigne ici le fait d’habiter. Cette formulation préserve l’image spatiale et l’opposition avec « très loin ».
theological_decisions:
- issue: Portée de l’accusation de Josué
  choice: Présenter uniquement l’accusation de tromperie concernant la distance géographique
  alternative: Expliciter dans le verset les conséquences liées à l’alliance conclue avec les Gabaonites
  rationale: Le verset accuse directement les interlocuteurs d’avoir menti sur leur lieu d’habitation. Les implications liées à l’alliance relèvent du contexte et ne doivent pas être ajoutées au texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est rendue fluide sans reproduire mécaniquement la formule hébraïque de discours. Le contraste entre la distance prétendue et la proximité réelle est maintenu avec « très loin de vous » et « au milieu de nous ».
