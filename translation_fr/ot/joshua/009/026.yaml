base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: fr
  text: Il agit ainsi à leur égard, et les délivra de la main des fils d’Israël[a], et ceux-ci ne les tuèrent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Il agit donc ainsi envers eux
  rationale: Cette formulation rend l’expression « faire ainsi » et sa fonction de reprise du contexte précédent dans un français naturel.
- source_word: וַיַּצֵּל
  choice: il les délivra
  rationale: Le hifil de נצל signifie délivrer ou arracher au pouvoir de quelqu’un ; « délivra » convient à la construction avec « de la main de ».
- source_word: מִיַּד
  choice: de la main de
  rationale: Le calque idiomatique reste intelligible en français et conserve l’image hébraïque de la puissance ou de l’emprise.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme masculine plurielle et l’expression nationale concrète de l’hébreu.
- source_word: וְלֹא הֲרָגוּם
  choice: qui ne les tuèrent pas
  rationale: Le pluriel renvoie naturellement aux fils d’Israël. La relative évite en français l’ambiguïté que créerait une simple coordination après deux sujets masculins singuliers possibles.
theological_decisions:
- issue: Désignation collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation choisie garde un contact étroit avec l’expression explicitement masculine du texte source, sans nier sa fonction de désignation nationale.
- issue: Référent du sujet pluriel dans וְלֹא הֲרָגוּם
  choice: les fils d’Israël ne les tuèrent pas
  alternative: 'coordination littérale potentiellement ambiguë : « et ils ne les tuèrent pas »'
  rationale: La morphologie plurielle renvoie au groupe immédiatement précédent. La relative explicite seulement ce lien grammatical nécessaire en français, sans ajouter de causalité.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La métaphore « de la main de » et la désignation « fils d’Israël » préservent la texture du texte hébreu.
