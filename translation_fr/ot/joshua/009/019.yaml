source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: fr
  text: 'Mais tous les chefs dirent à toute l’assemblée : « Nous leur avons juré par Yahweh, le Dieu d’Israël, et maintenant nous ne pouvons pas les toucher[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur faire du mal » ou « les frapper » ; littéralement « les toucher ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mais … dirent
  rationale: Le waw consécutif fait progresser le récit, tandis que le contexte donne à la réponse une valeur contrastive; « Mais » exprime naturellement cette nuance en français.
- source_word: הַנְּשִׂיאִים
  choice: les chefs
  rationale: נָשִׂיא désigne ici les responsables qui représentent et gouvernent Israël; « chefs » est clair, actuel et adapté au contexte.
- source_word: הָעֵדָה
  choice: l’assemblée
  rationale: עֵדָה désigne collectivement la communauté d’Israël, ici réunie; « assemblée » conserve cette dimension collective sans coloration confessionnelle particulière.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: Nous leur avons prêté serment
  rationale: Le nifal de שׁבע signifie prêter serment. Le passé composé exprime un acte passé dont l’obligation demeure au moment où les chefs parlent.
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: Avec le verbe « prêter serment », la préposition ב indique celui par qui le serment est prononcé. Le nom divin יהוה est rendu par « Yahweh ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette construction d’annexion identifie directement Yahweh comme le Dieu d’Israël.
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: L’expression introduit la conséquence présente du serment. Une nouvelle phrase rend clairement ce passage de l’acte passé à son effet actuel.
- source_word: לֹא נוּכַל
  choice: nous ne pouvons pas
  rationale: יכל exprime l’incapacité. Dans ce contexte, elle est d’ordre moral en raison du serment, mais le texte ne précise pas davantage cette nuance.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: les toucher
  rationale: נגע signifie littéralement « toucher », tout en pouvant évoquer ici le fait de porter atteinte à quelqu’un. Le sens littéral est conservé dans le texte et la portée contextuelle est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme יהוה. « Yahweh » conserve le caractère personnel du nom divin et suit la décision éditoriale indiquée, sans le remplacer par un titre.
- issue: Nature de l’impossibilité exprimée par לֹא נוּכַל
  choice: nous ne pouvons pas
  alternative: nous n’avons pas le droit de
  rationale: L’obligation issue du serment implique une impossibilité morale, mais l’hébreu formule littéralement une incapacité. La traduction conserve cette tension sans transformer explicitement l’énoncé en interdiction juridique.
translation_notes:
  register: Français international moderne, narratif et digne. « Chefs » et « assemblée » sont compréhensibles sans technicité; la formulation du serment reste solennelle. Le marqueur [a] est placé après « toucher », le terme auquel la note se rapporte.
