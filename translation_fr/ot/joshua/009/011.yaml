  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: fr
  text: 'Nos anciens et tous les habitants de notre pays nous ont dit : « Prenez avec vous des provisions pour le voyage et allez à leur rencontre. Vous leur direz : “Nous sommes vos serviteurs[a]. Maintenant, concluez une alliance avec nous[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi signifier « esclaves »; il exprime ici une déférence diplomatique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « coupez une alliance avec nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: nos anciens
  rationale: Dans ce contexte, le terme désigne les responsables reconnus de la communauté, et non simplement des hommes âgés.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: tous les habitants de notre pays
  rationale: Cette formulation naturelle conserve le sens collectif du participe hébreu et l’idée du territoire habité par les Gabaonites.
- source_word: צֵידָה
  choice: des provisions
  rationale: Le mot désigne ce que l’on emporte pour un déplacement, notamment de la nourriture; « provisions » convient au contexte sans restreindre indûment le sens.
- source_word: בְיֶדְכֶם
  choice: avec vous
  rationale: Littéralement « dans votre main », l’expression indique ici ce qu’ils doivent emporter. « Avec vous » rend naturellement l’idiome en français.
- source_word: לַדֶּרֶךְ
  choice: pour le voyage
  rationale: Le nom désigne ici le trajet à effectuer; « voyage » exprime clairement cette valeur contextuelle.
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: Cette expression française correspond naturellement au mouvement vers des personnes que l’on va rencontrer.
- source_word: עַבְדֵיכֶם
  choice: vos serviteurs
  rationale: עבד peut désigner un esclave ou un serviteur. Ici, il relève d’un langage diplomatique de déférence; « serviteurs » préserve ce registre sans imposer une condition juridique d’esclavage.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: concluez une alliance avec nous
  rationale: L’hébreu dit littéralement « coupez une alliance ». « Conclure une alliance » est idiomatique en français tout en maintenant la notion biblique d’alliance.
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: L’adverbe introduit directement la demande qui découle des paroles précédentes; « Maintenant » conserve cette transition sans l’alourdir.
- source_word: וַיֹּאמְרוּ אֵלֵינוּ ... לֵאמֹר
  choice: nous ont donc dit
  rationale: La formule hébraïque d’introduction au discours est rendue de façon naturelle en français. « Donc » relie cette explication au contexte narratif immédiat.
