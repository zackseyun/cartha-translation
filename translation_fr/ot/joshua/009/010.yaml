source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל אֲשֶׁ֣ר עָשָׂ֗ה לִ/שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן לְ/סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וּ/לְ/ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן אֲשֶׁ֥ר בְּ/עַשְׁתָּרֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: fr
  text: 'et tout ce qu’il a fait aux deux rois des Amorites qui étaient au-delà du Jourdain[a] : Sihon, roi de Heshbon, et Og, roi du Bashan, qui était à Ashtaroth[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’autre côté du Jourdain » ou « au-delà du Jourdain » selon le point de vue.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui était dans Ashtaroth ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: et
  rationale: La conjonction poursuit l’énumération du verset précédent; le marqueur d’objet direct אֵת ne se traduit pas séparément en français.
- source_word: כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure française naturelle exprime la totalité des actes évoqués par l’hébreu.
- source_word: עָשָׂה
  choice: il a fait
  rationale: Le verbe עשה a le sens général de « faire ». Le pronom conserve le sujet implicite de l’hébreu, identifié par le contexte.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: aux deux rois des Amorites
  rationale: La préposition ל indique ici les personnes auxquelles ces actes ont été infligés. « Aux » reste proche de la formulation hébraïque sans expliciter « contre ».
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: qui étaient au-delà du Jourdain
  rationale: « Au-delà du Jourdain » rend de façon concise l’expression géographique, dont le point de vue dépend de la position du locuteur.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihon, roi de Heshbon
  rationale: La préposition française est déjà portée par « aux deux rois »; l’apposition identifie clairement Sihon et son royaume.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: et Og, roi du Bashan
  rationale: La formulation est parallèle à celle qui présente Sihon et conserve les noms propres par translittération.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: qui résidait à Ashtaroth
  rationale: La proposition relative se rapporte naturellement à Og. « Résidait à » exprime idiomatiquement son association avec cette ville, tout en laissant en note la traduction plus littérale.
theological_decisions:
- issue: Sujet implicite de עָשָׂה
  choice: Conserver « il a fait »
  alternative: Expliciter « ce que le Seigneur a fait »
  rationale: L’hébreu porte un verbe à la troisième personne du masculin singulier sans nommer le sujet dans ce verset. Le contexte l’identifie, mais la traduction évite d’ajouter ici un nom divin absent du texte.
- issue: Portée de la relative אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: La rapporter à Og
  alternative: La comprendre comme une indication plus générale liée à son titre royal
  rationale: La proximité syntaxique fait d’Og l’antécédent naturel; la traduction n’ajoute aucune précision sur la nature exacte de sa présence à Ashtaroth.
translation_notes:
  register: Français international moderne, clair et digne. Le verset demeure syntaxiquement lié au précédent par son « et » initial. Les noms propres sont translittérés sans accents circonflexes afin de rester simples et cohérents pour un lectorat international.
