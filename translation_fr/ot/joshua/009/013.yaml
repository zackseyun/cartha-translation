base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: fr
  text: 'Et voici les outres de vin que nous avions remplies lorsqu’elles étaient neuves : regardez, elles se sont fendues[a]. Et voici nos vêtements et nos sandales : ils sont usés à cause de la longueur extrême du voyage[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elles ont éclaté » ou « elles se sont ouvertes ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à cause de la très grande étendue du voyage » ; c’est-à-dire parce que le voyage était extrêmement long.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: outres de vin
  rationale: נֹאד désigne un récipient fait de peau, notamment destiné au vin. « Outres de vin » est précis, naturel et conforme au contexte ancien.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: que nous avions remplies lorsqu’elles étaient neuves
  rationale: Le plus-que-parfait situe naturellement le remplissage avant l’état désormais constaté, tandis que « lorsqu’elles étaient neuves » rattache clairement חֲדָשִׁים aux outres.
- source_word: וְהִנֵּה
  choice: regardez
  rationale: L’impératif attire l’attention sur la preuve présentée et rend en français moderne la force démonstrative de הִנֵּה.
- source_word: הִתְבַּקָּעוּ
  choice: elles se sont fendues
  rationale: Le verbe décrit des outres qui se sont ouvertes en se fendant. Cette formulation préserve la valeur résultative sans imposer l’idée plus forte d’une explosion.
- source_word: שַׂלְמוֹתֵינוּ
  choice: nos vêtements
  rationale: « Vêtements » rend le terme collectif dans un registre courant et digne, sans le limiter indûment à des manteaux.
- source_word: נְעָלֵינוּ
  choice: nos sandales
  rationale: « Sandales » correspond au type de chaussure attendu dans ce contexte ancien et demeure immédiatement compréhensible.
- source_word: בָּלוּ
  choice: les voici usés
  rationale: Le verbe exprime l’usure devenue visible. La construction avec « voici » restitue aussi la présentation démonstrative des objets.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: à cause de la très longue route
  rationale: La formulation française exprime naturellement la cause liée à la grande étendue du trajet et conserve l’intensification de מְאֹד.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve le geste de présentation des Gabaonites par « voici » et « regardez », tout en évitant une tournure française artificiellement calquée sur l’hébreu.
