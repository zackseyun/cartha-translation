source:
  edition: WLC
  text: וְ/עַתָּ֖ה הִנְ/נ֣וּ בְ/יָדֶ֑/ךָ כַּ/טּ֨וֹב וְ/כַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לַ/עֲשׂ֥וֹת לָ֖/נוּ עֲשֵֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: fr
  text: Et maintenant, nous voici entre tes mains. Fais de nous ce qui est bon et droit à tes yeux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « Traite-nous comme tu le juges bon et juste. »'
    reason: Propose une formulation française plus explicite de l’idiome hébraïque, sans l’imposer au texte principal.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison exprimée par וְ et le repère temporel עַתָּה, qui introduit la soumission présente des Gabaonites.
- source_word: הִנְנוּ
  choice: nous voici
  rationale: Rend naturellement en français moderne la valeur présentative de l’expression hébraïque, sans recourir à l’archaïsme « voici que nous sommes ».
- source_word: בְיָדֶךָ
  choice: entre tes mains
  rationale: Maintient l’image hébraïque de la main comme symbole de pouvoir, tout en employant la forme idiomatique française au pluriel.
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: ce qui est bon et droit
  rationale: Reproduit directement les deux qualificatifs hébreux sans réduire le second à la simple convenance.
- source_word: בְּעֵינֶיךָ
  choice: à tes yeux
  rationale: Conserve l’image hébraïque courante qui exprime l’évaluation ou le jugement personnel.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: Fais de nous
  rationale: Formulation française naturelle qui garde le verbe « faire » et l’idée que Josué peut disposer d’eux, même si la répétition hébraïque infinitif-impératif ne peut être reproduite sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le texte conserve les images hébraïques des mains et des yeux, tout en adaptant leur formulation à l’usage naturel du français.
