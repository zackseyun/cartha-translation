source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: fr
  text: 'Ils allèrent trouver Josué au camp de Guilgal et lui dirent, ainsi qu’aux hommes d’Israël : « Nous sommes venus d’un pays lointain. Maintenant, concluez une alliance[a] avec nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « concluez un traité avec nous ». L’expression hébraïque signifie littéralement « coupez une alliance avec nous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Ils allèrent trouver
  rationale: Le verbe הלך signifie normalement « aller ». Avec la destination personnelle introduite par אֶל, « aller trouver Josué » est naturel en français et n’ajoute pas la perspective de « venir ».
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: Josué au camp de Guilgal
  rationale: La répétition de אֶל indique le mouvement vers Josué et vers le camp. En français, « au camp de Guilgal » exprime clairement et naturellement le lieu où se trouve Josué.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: lui dirent, ainsi qu’aux hommes d’Israël
  rationale: אִישׁ יִשְׂרָאֵל est un singulier collectif désignant les hommes ou représentants d’Israël. Cette formulation conserve la référence masculine et indique que les paroles s’adressent à Josué comme à eux.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: d’un pays lointain
  rationale: אֶרֶץ peut désigner une terre ou un pays, et רְחוֹקָה signifie « lointain ». « Pays lointain » convient naturellement à la prétention géographique formulée ici.
- source_word: בָּאנוּ
  choice: Nous sommes venus
  rationale: L’accompli hébreu décrit leur déplacement comme achevé avec un résultat présent. Le passé composé est la forme idiomatique en français moderne.
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: L’expression introduit la demande qui découle de leur déclaration. « Maintenant » garde la progression du discours sans alourdir la phrase.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: concluez une alliance avec nous
  rationale: כרת ברית est littéralement « couper une alliance », mais « conclure une alliance » est l’expression française naturelle. Elle conserve le terme biblique central בְרִית tout en restant immédiatement compréhensible.
theological_decisions:
- issue: Rendu de בְרִית dans le contexte d’un accord diplomatique
  choice: alliance
  alternative: traité
  rationale: Même si le contexte est politique, בְרִית est le terme biblique habituel pour une alliance. « Alliance » maintient cette continuité lexicale et sa portée potentielle, tandis que « traité » explicite plus étroitement la dimension diplomatique et figure donc en note.
translation_notes:
  register: Français international moderne, courant et digne. Le passé simple soutient le registre narratif biblique sans archaïsme excessif; le discours direct emploie le passé composé naturel. « Guilgal » suit la forme française traditionnelle du toponyme.
