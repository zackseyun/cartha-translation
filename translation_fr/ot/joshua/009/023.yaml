source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: fr
  text: 'Maintenant donc, vous êtes maudits : il y aura toujours parmi vous des esclaves[a] chargés de couper du bois et de puiser de l’eau pour la maison de mon Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « un esclave ne sera jamais retranché d’entre vous ». Le singulier hébreu peut avoir ici une valeur collective : leur peuple fournirait continuellement cette main-d’œuvre.'
    reason: Précision sur la formulation hébraïque et sur la valeur collective du singulier.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Cette transition naturelle introduit en français la conséquence judiciaire que Josué prononce.
- source_word: אֲרוּרִים
  choice: vous êtes maudits
  rationale: L’adjectif prédicatif pluriel est rendu directement, sans atténuer la portée de la malédiction.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: il y aura toujours parmi vous des esclaves
  rationale: La formulation exprime clairement la continuité collective indiquée par le niphal de כרת avec מן. Le singulier עֶבֶד a ici une valeur collective.
- source_word: עֶבֶד
  choice: esclaves
  rationale: Dans cette peine imposée et héréditaire, « esclaves » rend mieux le statut de dépendance forcée que le terme plus atténué « serviteurs ».
- source_word: חֹטְבֵי עֵצִים
  choice: chargés de couper du bois
  rationale: Cette formulation moderne conserve la tâche concrète exprimée par le participe hébreu tout en s’intégrant naturellement à la phrase.
- source_word: שֹׁאֲבֵי מַיִם
  choice: puiser de l’eau
  rationale: Le verbe « puiser » restitue précisément l’action décrite et reste courant en français moderne.
- source_word: לְבֵית אֱלֹהָי
  choice: pour la maison de mon Dieu
  rationale: « Maison » conserve la désignation hébraïque du sanctuaire et évite de réduire l’expression à un foyer domestique.
theological_decisions:
- issue: Rendu du statut servile imposé par la malédiction de Josué
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte décrit une condition subordonnée, imposée et durable. « Esclaves » en préserve la gravité sans ajouter de précision étrangère au texte.
- issue: Portée temporelle de la sentence
  choice: il y aura toujours parmi vous
  alternative: un esclave ne sera jamais retranché d’entre vous
  rationale: Le choix principal communique la continuité de la condition collective sans laisser entendre que tous les destinataires accompliront personnellement ces tâches. La note conserve la forme plus littérale et l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la solennité de la sentence tout en évitant une tournure littérale obscure. « Maison de mon Dieu » conserve le langage cultuel du texte source.
