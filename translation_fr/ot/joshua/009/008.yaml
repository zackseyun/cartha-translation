  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: fr
  text: 'Ils dirent à Josué : « Nous sommes tes serviteurs[a]. » Josué leur demanda alors : « Qui êtes-vous et d’où venez-vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes esclaves ». Le mot hébreu עֲבָדֶיךָ peut désigner des serviteurs ou des esclaves; ici, « serviteurs » convient à la déférence d’une démarche diplomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: עֶבֶד peut désigner un serviteur ou un esclave selon le contexte. Ici, les Gabaonites emploient une formule diplomatique de déférence et se présentent comme des subordonnés; « serviteurs » convient donc mieux au contexte immédiat, sans exclure l’autre sens possible.
- source_word: אֲנָחְנוּ
  choice: nous sommes
  rationale: La proposition nominale hébraïque ne comporte pas de copule exprimée; le français naturel exige ici l’ajout de « sommes ».
- source_word: מִי אַתֶּם
  choice: Qui êtes-vous
  rationale: L’interrogatif suivi du pronom se rend directement ainsi, sans ajouter un nom absent de l’hébreu.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: et d’où venez-vous
  rationale: מֵאַיִן interroge sur la provenance. Dans ce dialogue, l’imparfait de בוא s’exprime naturellement au présent en français.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: Ils dirent… Josué leur demanda alors
  rationale: Les formes narratives successives sont rendues au passé simple. « alors » marque naturellement le changement de locuteur; « demanda » explicite la valeur interrogative de la seconde prise de parole sans en modifier le contenu.
theological_decisions: []
