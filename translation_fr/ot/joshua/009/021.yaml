  text: וַ/יֹּאמְר֧וּ אֲלֵי/הֶ֛ם הַ/נְּשִׂיאִ֖ים יִֽחְי֑וּ וַ֠/יִּֽהְיוּ חֹטְבֵ֨י עֵצִ֤ים וְ/שֹֽׁאֲבֵי מַ֨יִם֙ לְ/כָל הָ֣/עֵדָ֔ה כַּ/אֲשֶׁ֛ר דִּבְּר֥וּ לָ/הֶ֖ם הַ/נְּשִׂיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: fr
  text: 'Les responsables leur dirent : « Qu’ils restent en vie ! » Ils devinrent coupeurs de bois et puiseurs d’eau[a] pour toute la communauté, comme les responsables le leur avaient dit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « chargés de couper le bois et de puiser l’eau ».'
    reason: Alternative idiomatique explicitant les deux fonctions de service exprimées par les participes hébreux.
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: les responsables
  rationale: Dans ce récit, le terme désigne les chefs reconnus de la communauté d’Israël. « Responsables » est actuel, clair et moins susceptible d’évoquer une dignité royale que « princes ».
- source_word: יִחְיוּ
  choice: Qu’ils vivent !
  rationale: L’imparfait a ici une valeur jussive et exprime la décision de leur laisser la vie. Cette formulation française conserve la brièveté et la force du décret.
- source_word: וַיִּהְיוּ
  choice: ils devinrent donc
  rationale: Le verbe marque le statut qui en résulta pour les Gabaonites. « Devinrent » rend cette transition, tandis que « donc » explicite sobrement la conséquence portée par la narration.
- source_word: חֹטְבֵי עֵצִים
  choice: coupeurs de bois
  rationale: La construction participiale désigne une fonction durable. Cette expression conserve l’image concrète et le parallélisme de l’hébreu sans employer le terme plus spécialisé « bûcherons ».
- source_word: שֹׁאֲבֵי מַיִם
  choice: puiseurs d’eau
  rationale: Le groupe désigne ceux qui puisent l’eau, et non simplement ceux qui la transportent. « Puiseurs d’eau » reste précis et fait pendant à « coupeurs de bois ».
- source_word: לְכָל הָעֵדָה
  choice: pour toute la communauté
  rationale: עֵדָה désigne ici la communauté collective d’Israël. « Communauté » est naturel en français moderne et garde cette portée collective.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: conformément à ce que les responsables leur avaient dit
  rationale: La tournure relie leur nouvelle condition à la déclaration antérieure des responsables. Le plus-que-parfait rend clairement cette antériorité en français.
