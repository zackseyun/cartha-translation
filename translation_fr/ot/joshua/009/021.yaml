  to: 'Les responsables leur dirent : « Qu’ils restent en vie ! » Ils devinrent coupeurs de bois et puiseurs d’eau[a] pour toute la communauté, comme les responsables le leur avaient dit.'
  rationale: La révision clarifie en français la portée décisionnelle du jussif, retire une conséquence logique ajoutée par « donc » et allège la clause finale. Elle maintient les choix lexicaux fondamentaux, le parallélisme des tâches, l’ancrage de la note et le sens du texte source.
