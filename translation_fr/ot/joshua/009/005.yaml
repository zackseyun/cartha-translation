  variant: modern international French
source:
  edition: WLC
  text: וּ/נְעָל֨וֹת בָּל֤וֹת וּ/מְטֻלָּאוֹת֙ בְּ/רַגְלֵי/הֶ֔ם וּ/שְׂלָמ֥וֹת בָּל֖וֹת עֲלֵי/הֶ֑ם וְ/כֹל֙ לֶ֣חֶם צֵידָ֔/ם יָבֵ֖שׁ הָיָ֥ה נִקֻּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: fr
  text: Ils avaient aux pieds des sandales usées et raccommodées, et portaient des vêtements usés. Tout le pain de leurs provisions était sec et émietté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « moisi ». Le terme hébreu est rare et peut désigner du pain sec qui se défait en morceaux ; certains le comprennent comme du pain « moisi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: sandales
  rationale: Ce terme désigne des chaussures; « sandales » convient au contexte matériel du Proche-Orient ancien et reste naturel en français.
- source_word: בָּלוֹת
  choice: usées
  rationale: L’adjectif indique une détérioration due à l’âge ou à l’usage, et non simplement quelque chose d’ancien.
- source_word: מְטֻלָּאוֹת
  choice: raccommodées
  rationale: Le participe passif décrit des sandales réparées; « raccommodées » est idiomatique en français et évite la tournure plus lourde « couvertes de pièces ».
- source_word: בְּרַגְלֵיהֶם
  choice: aux pieds
  rationale: Rend naturellement la localisation concrète exprimée par l’hébreu.
- source_word: שְׂלָמוֹת
  choice: vêtements
  rationale: Terme français courant et digne pour un mot général désignant les habits.
- source_word: עֲלֵיהֶם
  choice: portaient
  rationale: La reformulation verbale rend naturellement en français l’idée des vêtements qui étaient sur eux sans perdre le détail concret.
- source_word: לֶחֶם צֵידָם
  choice: le pain de leurs provisions
  rationale: Conserve le concret « pain » ainsi que sa fonction de provision pour le voyage.
- source_word: יָבֵשׁ הָיָה
  choice: était sec
  rationale: Rend directement l’état du pain décrit par la construction hébraïque.
- source_word: נִקֻּדִים
  choice: s’émiettait
  rationale: Le terme rare est incertain. Dans ce contexte, il peut évoquer du pain desséché qui se défait en morceaux; la note conserve l’autre interprétation traditionnelle, « moisi ».
theological_decisions: []
