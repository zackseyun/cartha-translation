source:
  edition: WLC
  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: fr
  text: J’ai vu parmi le butin un beau manteau de Shinéar[a], deux cents sicles d’argent et un lingot d’or[b] pesant cinquante sicles. Je les ai convoités et je les ai pris. Les voici cachés dans la terre, à l’intérieur de ma tente, et l’argent est sous le manteau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un magnifique vêtement de Shinéar ». Le mot hébreu peut désigner un vêtement extérieur somptueux, un manteau ou une cape.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « une langue d’or », sans doute une pièce d’or ayant une forme allongée. Certaines traductions emploient « barre » ou « coin d’or ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « sous elle ». Le pronom est féminin singulier et renvoie très probablement au manteau.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: parmi le butin
  rationale: שָׁלָל désigne le butin pris à la guerre, et la préposition ב indique ici que les objets se trouvaient parmi celui-ci.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: un beau manteau de Shinéar
  rationale: אַדֶּרֶת peut désigner un vêtement extérieur ample et de qualité. « Manteau » est naturel en français, tandis que « de Shinéar » indique vraisemblablement la provenance.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: deux cents sicles d’argent
  rationale: La formulation conserve l’unité de poids ancienne sans introduire une conversion moderne incertaine.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: un lingot d’or
  rationale: לָשׁוֹן signifie littéralement « langue » et désigne ici une pièce d’or vraisemblablement allongée. « Lingot » communique clairement la nature de l’objet, avec une note qui conserve l’image hébraïque.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: pesant cinquante sicles
  rationale: Cette tournure française fluide rend explicitement l’indication du poids de la pièce d’or.
- source_word: וָאֶחְמְדֵם
  choice: Je les ai convoités
  rationale: חמד exprime ici un désir coupable qui conduit à la prise des objets; « convoiter » en préserve la portée morale.
- source_word: וָאֶקָּחֵם
  choice: et je les ai pris
  rationale: לקח est le verbe courant signifiant « prendre »; le contexte suffit à montrer que l’acte était illégitime.
- source_word: וְהִנָּם
  choice: Les voici
  rationale: La particule déictique attire vivement l’attention sur l’emplacement présent des objets; « les voici » est idiomatique et direct.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: cachés dans la terre
  rationale: Le participe indique que les objets ont été dissimulés, et אֶרֶץ désigne ici la terre ou le sol dans la tente.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: à l’intérieur de ma tente
  rationale: Cette formulation rend naturellement la localisation précise donnée par le texte.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: et l’argent est sous le manteau
  rationale: Le suffixe féminin singulier renvoie très probablement à אַדֶּרֶת, « manteau ». Le référent est explicité en français afin d’éviter un pronom obscur, tout en signalant l’interprétation en note.
