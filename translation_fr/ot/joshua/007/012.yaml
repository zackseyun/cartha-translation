  verdict: revise
  source_fidelity: La traduction rend correctement l’incapacité d’Israël à tenir face à ses ennemis, le retournement dans la fuite, le statut de ḥèrem et la condition liée à la présence divine. Toutefois, « qui se trouve au milieu de vous » décrit seulement la localisation du ḥèrem et n’exprime pas clairement le mouvement implicite de מִקִּרְבְּכֶם (« de votre milieu ») avec l’élimination demandée.
  naturalness: Le français est moderne, clair et d’un registre approprié. La révision proposée simplifie la dernière proposition et rend plus explicitement, sans lourdeur, l’élimination hors de la communauté.
  terminology: « Voués à la destruction » / « ce qui est voué à la destruction » maintient de façon satisfaisante le lien entre les deux emplois de חֵרֶם. La note est utile; sa formulation est légèrement resserrée afin de ne pas définir le terme de manière trop absolue tout en préservant sa dimension cultuelle et judiciaire.
  issues:
  - severity: medium
    issue: La dernière proposition ne rend pas pleinement « de votre milieu ».
    rationale: « Ce qui est voué à la destruction et qui se trouve au milieu de vous » localise l’objet, mais le texte hébreu exige qu’il soit détruit/éliminé de la communauté. « En le faisant disparaître de votre milieu » rend cette portée sans modifier le sens.
