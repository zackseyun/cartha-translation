source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: fr
  text: C’est pourquoi les Israélites ne peuvent pas tenir devant leurs ennemis. Ils tournent le dos à leurs ennemis, parce qu’ils sont eux-mêmes voués à la destruction. Je ne serai plus avec vous, à moins que vous ne détruisiez ce qui est voué à la destruction en le faisant disparaître de votre milieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même mot hébreu, ḥèrem, désigne ce qui est consacré à Dieu sous interdit et, dans ce contexte, destiné à la destruction. Il peut aussi être rendu par « ce qui est frappé d’interdit » ou, traditionnellement, par « anathème ».
    reason: Précision lexicale sur les deux emplois de ḥèrem, terme cultuel et judiciaire sans équivalent français unique.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Expression collective naturelle en français moderne; elle désigne ici l’ensemble du peuple sans imposer une lecture exclusivement masculine de « fils d’Israël ».
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: tenir devant leurs ennemis
  rationale: Conserve l’image hébraïque tout en exprimant idiomatiquement l’incapacité de résister ou de tenir bon face à l’ennemi.
- source_word: עֹרֶף יִפְנוּ
  choice: ils tournent le dos à leurs ennemis
  rationale: Préserve la métaphore concrète du texte, qui évoque la retraite et la défaite, plutôt que de la réduire à « ils fuient ».
- source_word: הָיוּ לְחֵרֶם
  choice: ils sont eux-mêmes voués à la destruction
  rationale: Rend le statut judiciaire et cultuel de חֵרֶם. « Eux-mêmes » clarifie que le sujet est Israël, devenu soumis au même sort que ce qui avait été voué à la destruction.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: Je ne serai plus avec vous
  rationale: Formulation française concise exprimant la cessation de la présence favorable de Dieu.
- source_word: אִם לֹא
  choice: à moins que… ne
  rationale: Tour conditionnel négatif naturel et soutenu en français.
- source_word: תַשְׁמִידוּ הַחֵרֶם מִקִּרְבְּכֶם
  choice: vous ne détruisiez ce qui est voué à la destruction et qui se trouve au milieu de vous
  rationale: Rend l’action décisive demandée et le sens concret de הַחֵרֶם, tout en évitant l’expression peu naturelle « la chose vouée ».
theological_decisions:
- issue: Double emploi de חֵרֶם, d’abord comme statut d’Israël puis comme réalité présente dans le camp
  choice: Employer « voués à la destruction » puis « ce qui est voué à la destruction »
  alternative: « sous l’anathème » puis « l’anathème »; ou « maudits » puis « l’objet maudit »
  rationale: La formulation retenue maintient le lien lexical entre les deux emplois et le rapport avec une consécration irrévocable entraînant la destruction. Elle évite de réduire חֵרֶם à une simple malédiction ou d’introduire le terme ecclésiastique ambigu « anathème ».
- issue: Portée de la présence divine dans « Je ne serai plus avec vous »
  choice: Conserver l’énoncé sans l’expliciter
  alternative: « Je ne vous accorderai plus mon soutien »
  rationale: Le texte parle de la présence de Dieu et laisse subsister sa portée relationnelle, militaire et covenantale; une paraphrase par le seul soutien militaire en réduirait la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Les Israélites » est préféré au calque « les fils d’Israël ». La répétition « devant leurs ennemis » est conservée pour respecter l’insistance du texte. La note [a] est placée après la seconde occurrence française afin d’expliquer les deux emplois du même terme hébreu.
