  to: C’est pourquoi les Israélites ne peuvent pas tenir devant leurs ennemis. Ils tournent le dos à leurs ennemis, parce qu’ils sont eux-mêmes voués à la destruction. Je ne serai plus avec vous, à moins que vous ne détruisiez ce qui est voué à la destruction en le faisant disparaître de votre milieu.[a]
  rationale: 'La révision conserve les choix justes du projet, notamment « les Israélites », « tenir devant leurs ennemis », « tourner le dos » et la cohérence terminologique autour de ḥèrem. Elle corrige uniquement la portée de מִקִּרְבְּכֶם : l’objet voué à la destruction doit disparaître du milieu du peuple, et non simplement y être identifié.'
