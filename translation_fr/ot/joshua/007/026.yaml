revisions:
- from: Ils élevèrent sur lui un grand tas de pierres, qui subsiste jusqu’à ce jour. Alors Yahweh se détourna de son ardente colère. C’est pourquoi cet endroit a été appelé « vallée d’Akor »[a] jusqu’à ce jour.
  to: Ils élevèrent sur lui un grand tas de pierres, qui subsiste jusqu’à ce jour. Alors Yahweh se détourna de son ardente colère. C’est pourquoi ce lieu porte le nom de vallée d’Akor[a] jusqu’à ce jour.
  rationale: La révision conserve l’explicitation française nécessaire de la première occurrence de « jusqu’à ce jour », qui porte sur la permanence du tas de pierres. Elle rend la seconde formule par « porte le nom de », expression idiomatique qui marque la dénomination durable. La note est corrigée afin de présenter le jeu de mots sans graphie de translittération ambiguë.
  reviewer_model: gpt-5.6-terra
