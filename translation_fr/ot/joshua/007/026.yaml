base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: fr
  text: Ils élevèrent sur lui un grand tas de pierres, qui subsiste jusqu’à ce jour. Alors Yahweh se détourna de son ardente colère. C’est pourquoi ce lieu porte le nom de vallée d’Akor[a] jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akor évoque le mot hébreu qui signifie « troubler » ou « causer le malheur » ; voir Josué 7.25.
    reason: Jeu de mots étiologique entre le nom du lieu עָכוֹר et le verbe עכר employé au verset précédent.
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: Ils élevèrent sur lui un grand tas de pierres
  rationale: Le hiphil de קום exprime ici l’action d’élever ou d’amonceler. « Un grand tas de pierres » rend directement גַּל אֲבָנִים גָּדוֹל dans un français courant et digne.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: qui subsiste jusqu’à ce jour / jusqu’à ce jour
  rationale: 'La première occurrence se rattache naturellement au tas de pierres en français : l’explicitation « qui subsiste » évite de laisser entendre que l’amoncellement s’est poursuivi jusqu’au présent. La seconde conserve directement la formule temporelle dans l’explication du nom.'
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Alors Yahweh se détourna de son ardente colère
  rationale: « Se détourna » conserve l’image de שׁוב sans imposer l’idée plus interprétative de repentir. « Ardente colère » rend de façon idiomatique l’image de חֲרוֹן אַף, la colère qui brûle.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution française introduit naturellement la relation causale et l’explication étiologique du nom.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: cet endroit a été appelé
  rationale: Le passif français rend naturellement le sujet indéfini de la formule hébraïque de dénomination et garde la valeur résultative du parfait.
- source_word: עֵמֶק עָכוֹר
  choice: vallée d’Akor
  rationale: Le nom propre est translittéré plutôt que remplacé par une interprétation. Son jeu de mots avec עכר est signalé en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. La translittération « Yahweh » le distingue d’un simple titre et suit la couche de consultation fournie.
- issue: Expression de la colère divine en מֵחֲרוֹן אַפּוֹ
  choice: se détourna de son ardente colère
  alternative: revint de l’embrasement de sa colère
  rationale: Le choix conserve à la fois le mouvement exprimé par שׁוב et l’intensité imagée de la colère, sans résoudre la tension théologique par « se repentit » ni l’atténuer.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans être archaïque. Les formulations restent transparentes pour un lectorat général ; le jeu de mots hébreu est conservé par translittération et expliqué en note.
