  text: וַ/יַּעֲל֤וּ מִן הָ/עָם֙ שָׁ֔מָּ/ה כִּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יָּנֻ֕סוּ לִ/פְנֵ֖י אַנְשֵׁ֥י הָ/עָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: fr
  text: Environ trois mille hommes du peuple y montèrent, mais ils s’enfuirent devant les hommes d’Aï.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה signifie couramment « monter ». Dans ce contexte, il décrit le déplacement vers Aï sans intégrer explicitement l’idée d’attaque.
- source_word: מִן הָעָם
  choice: du peuple
  rationale: עַם désigne littéralement le « peuple » ; il s’agit ici d’un contingent issu d’Israël. Cette formulation reste proche de l’hébreu et naturelle en français.
- source_word: שָׁמָּה
  choice: y
  rationale: L’adverbe renvoie à la destination mentionnée auparavant. Le pronom adverbial « y » rend naturellement ce mouvement vers Aï.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: environ trois mille hommes
  rationale: La préposition כִּ devant le nombre marque l’approximation. אִישׁ sert ici à compter les personnes ; « hommes » évite de préciser « soldats » au-delà du terme source.
- source_word: וַיָּנֻסוּ
  choice: ils s’enfuirent
  rationale: נוּס signifie « fuir ». Le passé simple convient au registre narratif biblique, tout en restant clair en français moderne.
- source_word: לִפְנֵי
  choice: devant
  rationale: Avec le verbe « fuir », לִפְנֵי exprime la retraite face à l’adversaire. « S’enfuir devant » est idiomatique et conserve l’image de l’hébreu.
- source_word: אַנְשֵׁי הָעָי
  choice: les hommes d’Aï
  rationale: Le syntagme désigne les hommes de la ville, vraisemblablement ses défenseurs, sans employer explicitement un nom militaire. « Aï » est la forme française traditionnelle du toponyme.
theological_decisions: []
