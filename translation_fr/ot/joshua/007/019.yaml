  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: fr
  text: 'Alors Josué dit à Acan : « Mon fils, je t’en prie, rends gloire à Yahweh, le Dieu d’Israël, et rends-lui grâce[a]. Je t’en prie, dis-moi ce que tu as fait ; ne me le cache pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remercie-le » ; dans ce contexte, l’expression peut aussi évoquer un aveu fait à Dieu.
    reason: Alternative lexicale de תוֹדָה, dont le sens peut inclure l’action de grâce ou l’aveu selon le contexte.
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Conserve l’adresse filiale masculine et le ton à la fois paternel, personnel et solennel de Josué.
- source_word: שִׂים נָא כָבוֹד
  choice: je t’en prie, rends gloire
  rationale: L’expression hébraïque signifie littéralement « place donc la gloire », mais « rendre gloire » exprime naturellement en français la reconnaissance de l’honneur de Dieu. « Je t’en prie » rend la particule נָא.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: à Yahweh, le Dieu d’Israël
  rationale: Rend directement le nom divin et la construction qui identifie Yahweh comme le Dieu d’Israël.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: et rends-lui grâce[a]
  rationale: « Rendre grâce » traduit naturellement l’idée de reconnaissance ou de remerciement adressé à Dieu, tout en signalant par une note la nuance possible d’aveu dans ce contexte judiciaire.
- source_word: וְהַגֶּד נָא לִי מֶה עָשִׂיתָ
  choice: Je t’en prie, dis-moi ce que tu as fait
  rationale: Formulation française directe et actuelle qui conserve la demande insistante et polie portée par נָא.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: ne me le cache pas
  rationale: Rend idiomatiquement l’interdiction de dissimuler ou de taire l’acte ; le pronom « le » explicite en français l’objet implicite en hébreu.
theological_decisions:
- issue: Sens de תוֹדָה dans un contexte d’aveu
  choice: 'Reconnaissance adressée à Dieu : « rends-lui grâce »'
  alternative: « confesse-le devant lui » ou « avoue-le devant lui »
  rationale: Le nom תוֹדָה peut exprimer l’action de grâce, la louange ou, selon le contexte, l’aveu. Le texte principal garde le sens large de reconnaissance envers Dieu, tandis que la note préserve explicitement la nuance confessionnelle suggérée par l’appel immédiat à révéler la faute.
translation_notes:
  register: Français international moderne, digne et accessible. « Rends gloire » garde la solennité de l’appel sans calquer maladroitement l’hébreu. La répétition de « je t’en prie » conserve les deux occurrences de נָא.
