base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: fr
  text: Puis il fit approcher sa famille, homme par homme[a], et Akân, fils de Karmi, fils de Zabdi, fils de Zérah, de la tribu de Juda, fut pris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les hommes ». L’expression hébraïque est concise ; elle peut indiquer que la maisonnée fut présentée par subdivisions masculines ou homme par homme lors du tirage au sort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: il fit approcher
  rationale: Le hifil de קרב signifie « faire approcher » ou « présenter ». La formulation conserve l’image procédurale du texte hébreu tout en étant naturelle en français.
- source_word: בֵּיתוֹ
  choice: les hommes de sa famille
  rationale: בַּיִת désigne ici la maisonnée ou la famille. Avec לַגְּבָרִים, le français explicite naturellement que les membres masculins de cette famille sont présentés individuellement.
- source_word: לַגְּבָרִים
  choice: un par un
  rationale: La formule hébraïque, littéralement « selon les hommes » ou « par les hommes », est concise et probablement procédurale. « Un par un » exprime la présentation individuelle sans imposer davantage de précision que le contexte.
- source_word: וַיִּלָּכֵד
  choice: fut désigné
  rationale: Le nifal de לכד signifie littéralement « être pris ». Dans cette procédure de tirage au sort, « fut désigné » transmet clairement le sens contextuel, tandis qu’une note conserve l’idiome littéral.
- source_word: עָכָן
  choice: Akân
  rationale: Transcription française courante du nom hébreu, avec accent circonflexe indiquant la voyelle longue dans l’usage biblique français.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶן זֶרַח
  choice: fils de Karmi, fils de Zabdi, fils de Zérah
  rationale: La chaîne généalogique est conservée intégralement, sans réduire les occurrences répétées de בֶּן.
- source_word: לְמַטֵּה יְהוּדָה
  choice: de la tribu de Juda
  rationale: Dans ce contexte, מַטֶּה désigne une tribu. Cette tournure est claire et consacrée en français moderne.
