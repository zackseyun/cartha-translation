source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: fr
  text: 'Lève-toi, consacre le peuple et dis : « Consacrez-vous pour demain, car voici ce que dit Yahweh, le Dieu d’Israël : Ce qui est voué à la destruction[a] se trouve au milieu de toi, Israël. Tu ne pourras pas tenir devant tes ennemis tant que vous n’aurez pas retiré du milieu de vous ce qui est voué à la destruction. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu חֵרֶם (ḥèrem), traditionnellement rendu par « l’interdit » ou « ce qui est voué », désigne quelque chose placé sous une consécration irrévocable, ici en vue de sa destruction.
    reason: Précision lexicale sur un terme culturel et théologique sans équivalent français unique.
lexical_decisions:
- source_word: קֻם
  choice: Lève-toi
  rationale: Impératif adressé à Josué, exprimant une action immédiate dans un français naturel.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: consacre / Consacrez-vous
  rationale: Préserve le lien lexical entre le piel causatif et le hitpael réfléchi, ainsi que la dimension de préparation rituelle.
- source_word: לְמָחָר
  choice: pour demain
  rationale: Exprime une préparation en vue du lendemain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel présent dans le texte hébreu.
- source_word: חֵרֶם
  choice: ce qui est voué à la destruction
  rationale: Rend l’idée d’une chose placée sous consécration irrévocable et, dans ce contexte, destinée à la destruction, sans recourir au terme technique peu transparent « interdit ».
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: au milieu de toi, Israël
  rationale: Conserve l’adresse directe à Israël envisagé collectivement au singulier.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: Tu ne pourras pas tenir devant tes ennemis
  rationale: Rend l’expression idiomatique signifiant résister ou faire face aux ennemis.
- source_word: עַד הֲסִירְכֶם
  choice: tant que vous n’aurez pas retiré
  rationale: Exprime la limite temporelle et conditionnelle; le pluriel du suffixe verbal est conservé par le passage à « vous ».
theological_decisions:
- issue: Sens de חֵרֶם dans le contexte du jugement
  choice: ce qui est voué à la destruction
  alternative: l’interdit ; la chose vouée ; la chose maudite
  rationale: Le terme désigne ici quelque chose soustrait à l’usage ordinaire par une consécration irrévocable impliquant sa destruction. La formulation explicite ce sens tout en signalant sa portée particulière dans la note.
- issue: Alternance du singulier et du pluriel dans l’adresse à Israël
  choice: « toi » pour Israël collectif, puis « vous » selon la forme hébraïque
  alternative: Uniformiser tout le passage au pluriel
  rationale: Le texte hébreu passe délibérément d’Israël personnifié au singulier à la communauté au pluriel. La traduction conserve cette tension grammaticale plutôt que de la lisser.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs restent directs; la répétition de « consacrer » et le passage du singulier collectif au pluriel sont préservés.
