  rationale: La révision améliore la fluidité du français et exprime le ḥerem comme un statut présent, sans réduire son sens à une simple malédiction ni résoudre au-delà du texte la nature précise de l’objet ou de la procédure par laquelle le coupable est identifié. Elle maintient la syntaxe inclusive « lui et tout ce qui lui appartient » et le registre juridique et moral du verset.
