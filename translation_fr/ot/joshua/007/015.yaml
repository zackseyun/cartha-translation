  terminology: « Yahweh », « alliance », « voué à la destruction » et « infamie » sont appropriés au registre sobre et solennel du passage. La note présente avec justesse « frappé d’interdit » comme une possibilité traditionnelle et explique la double idée de consécration irrévocable et de destruction. « Chose maudite » doit rester une alternative signalée, non le rendu principal.
