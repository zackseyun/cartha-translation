  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: fr
  text: Celui qui sera trouvé avec ce qui est voué à la destruction[a] sera brûlé au feu, lui et tout ce qui lui appartient, parce qu’il a violé l’alliance de Yahweh et commis une infamie en Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon la traduction traditionnelle, « ce qui est frappé d’interdit » ou « la chose maudite ». Le mot hébreu ḥerem désigne ce qui est mis à part de façon irrévocable pour Dieu et, dans ce contexte, voué à la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: celui qui sera pris
  rationale: Le participe passif de לכד désigne ici la personne identifiée par la procédure de tirage au sort. « Sera pris » conserve l’image hébraïque sans suggérer explicitement une capture militaire.
- source_word: בַּחֵרֶם
  choice: avec ce qui a été voué à la destruction
  rationale: חֵרֶם désigne ce qui est soustrait à l’usage ordinaire et voué à Dieu, ici en vue de sa destruction. Cette formulation exprime à la fois la consécration et l’issue destructrice, tout en conservant l’association marquée par la préposition בְּ.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: sera brûlé par le feu
  rationale: Rend directement le passif et la tournure instrumentale hébraïque, dans un français digne et compréhensible.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: lui et tout ce qui lui appartient
  rationale: La construction inclut l’homme et tout ce qui est à lui, sans préciser davantage l’étendue de ses biens ou de sa maison.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: a violé l’alliance de Yahweh
  rationale: Dans ce contexte, עבר appliqué à une alliance exprime le franchissement de ses limites, donc sa violation. « Violer » restitue clairement la portée juridique et relationnelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: נְבָלָה
  choice: une infamie
  rationale: נְבָלָה désigne ici un acte moralement scandaleux et déshonorant, non une simple sottise. « Une infamie » en restitue la gravité avec concision.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: 'La préposition a ici son sens locatif : l’acte a été commis au sein de la communauté d’Israël.'
theological_decisions:
- issue: Sens de חֵרֶם dans un contexte de jugement lié à l’alliance
  choice: ce qui a été voué à la destruction
  alternative: ce qui est frappé d’interdit ; la chose maudite
  rationale: Le terme décrit d’abord un statut de mise à part irrévocable pour Dieu, qui entraîne ici la destruction. La traduction retenue rend cette double dimension sans présenter l’objet comme intrinsèquement maudit.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel ; le Seigneur ; Jéhovah
  rationale: Le texte porte un nom personnel. « Yahweh » le conserve et évite de le remplacer par un titre.
- issue: Portée de « lui et tout ce qui lui appartient »
  choice: maintenir la formulation large du texte
  alternative: préciser qu’il s’agit seulement de ses biens ou inclure explicitement sa maisonnée
  rationale: L’hébreu ne détaille pas ici les personnes ou les objets compris dans cette expression. La traduction en préserve donc l’étendue sans résoudre la question à partir du récit ultérieur.
translation_notes:
  register: Français international actuel, sobre et solennel. La formulation reste proche de la structure hébraïque tout en évitant les archaïsmes. « Pris avec » conserve une certaine ambiguïté quant à la manière dont le coupable est identifié, comme dans le texte source.
