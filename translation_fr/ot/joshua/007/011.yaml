reference: Joshua 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: fr
  text: Israël a péché. Ils ont aussi transgressé mon alliance, que je leur avais prescrite. Ils ont aussi pris de ce qui était voué à la destruction[a] ; ils ont aussi volé, ils ont aussi menti[b] et ils ont aussi mis ces objets parmi leurs propres affaires[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « de ce qui était voué à l’interdit » ou « de ce qui était frappé d’interdit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils ont aussi trompé » ; autre sens possible : « ils l’ont aussi nié ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « parmi leurs objets » ou « parmi leurs récipients ». Le terme hébreu peut désigner largement les objets, le matériel ou les effets que possède une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא
  choice: a péché
  rationale: Cette formulation directe conserve la portée morale et théologique du verbe hébreu.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le sujet collectif explicite du texte hébreu est maintenu, bien que le récit mette en cause l’acte d’un individu.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: ont transgressé mon alliance
  rationale: « Transgresser » exprime la violation des limites de l’alliance tout en conservant le registre juridique et religieux de l’hébreu.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: que je leur avais prescrite
  rationale: Cette tournure française naturelle rend l’idée d’une alliance imposée par commandement sans ajouter explicitement « de respecter », absent de l’hébreu.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: ont pris de ce qui était voué à la destruction
  rationale: Dans ce contexte, חֵרֶם désigne ce qui a été placé sous interdit et destiné à la destruction. La formulation rend ce sens clairement sans réduire le terme à un simple objet consacré.
- source_word: גָּנְבוּ
  choice: ont aussi volé
  rationale: Le verbe est rendu directement, et « aussi » maintient l’accumulation emphatique des accusations.
- source_word: כִּחֲשׁוּ
  choice: ont aussi menti
  rationale: « Mentir » exprime de façon concise la fausseté ou le déni impliqué par le verbe, tandis que ses autres nuances sont signalées en note.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: ont aussi mis ces objets parmi leurs propres affaires
  rationale: כְּלִים peut désigner des récipients, des objets, du matériel ou des effets personnels. « Leurs propres affaires » convient au contexte de dissimulation parmi leurs possessions.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: aussi ... aussi ... aussi
  rationale: La répétition de « aussi » reproduit l’effet cumulatif et accusateur de la particule hébraïque répétée.
theological_decisions:
- issue: Attribution collective de la faute à Israël alors que l’acte immédiat est celui d’un individu
  choice: Conserver « Israël » comme sujet, puis les verbes et pronoms au pluriel.
  alternative: Reformuler le verset pour n’attribuer la faute qu’à Akân.
  rationale: L’hébreu attribue explicitement le péché à Israël en tant que peuple de l’alliance. La traduction conserve cette solidarité collective et la tension qu’elle crée dans le récit.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition de « ils ont aussi » est volontaire : elle conserve la progression rhétorique insistante de l’hébreu. Le passé composé porte les accusations principales ; le plus-que-parfait situe naturellement en français le commandement antérieur de l’alliance.'
