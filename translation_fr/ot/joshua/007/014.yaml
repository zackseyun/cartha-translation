source:
  edition: WLC
  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: fr
  text: Le matin, vous vous approcherez tribu par tribu. La tribu que Yahweh désignera[a] s’approchera clan par clan, le clan que Yahweh désignera s’approchera famille par famille, et la famille que Yahweh désignera s’approchera homme par homme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « saisira » ou « prendra ». Le verbe hébreu peut signifier « capturer » ou « saisir »; ici, il désigne le groupe indiqué par Yahweh, vraisemblablement au moyen du sort sacré.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit « homme par homme » : l’identification finale se fait parmi les hommes de la famille, individuellement.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: vous vous approcherez / s’approchera
  rationale: Le verbe קרב décrit ici une approche formelle en vue de l’identification. La répétition d’« approcher » conserve le mouvement procédural du texte hébreu.
- source_word: לְשִׁבְטֵיכֶם
  choice: tribu par tribu
  rationale: La préposition marque ici la répartition ordonnée selon les tribus; cette formulation française exprime clairement la valeur distributive.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: désignera
  rationale: לכד signifie normalement « saisir, capturer », mais désigne ici le groupe indiqué par Yahweh au cours d’une procédure de sélection, vraisemblablement par le sort sacré. « Désignera » rend ce sens contextuel sans suggérer une capture physique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: לַמִּשְׁפָּחוֹת
  choice: clan par clan
  rationale: מִשְׁפָּחָה désigne dans l’organisation tribale une unité plus petite que la tribu et plus large que la maisonnée.
- source_word: לַבָּתִּים / הַבַּיִת
  choice: famille par famille / la famille
  rationale: בַּיִת désigne ici la maisonnée ou famille constituée, non un bâtiment. « Famille » est naturel en français et maintient la progression tribu–clan–famille–individu.
- source_word: לַגְּבָרִים
  choice: homme par homme
  rationale: Le pluriel masculin גְּבָרִים a une valeur distributive et indique l’identification finale de chaque homme au sein de la famille.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Mode de désignation divine
  choice: désignera, avec une note indiquant la valeur littérale « saisira »
  alternative: saisira / prendra
  rationale: Le contexte décrit une sélection progressive, probablement au moyen du sort sacré, mais le verset ne nomme pas explicitement le procédé. La traduction rend la fonction contextuelle, tandis que la note préserve l’image et l’ambiguïté lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive du texte source est conservée, avec des formulations distributives naturelles (« tribu par tribu », etc.). « Famille » rend ici la maisonnée (בַּיִת), tandis que « clan » reste réservé à מִשְׁפָּחָה.
