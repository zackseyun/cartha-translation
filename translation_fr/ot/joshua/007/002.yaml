base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: fr
  text: 'Josué envoya de Jéricho des hommes à Aï, qui se trouve près de Beth-Aven[a], à l’est de Béthel. Il leur dit : « Montez et reconnaissez le pays. » Les hommes montèrent reconnaître Aï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est à côté de Beth-Aven » ; l’hébreu dit littéralement « qui est avec Beth-Aven », au moyen d’une préposition pouvant exprimer la proximité géographique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שלח exprime simplement l’envoi dans la trame narrative; « envoya » est naturel et précis.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom masculin pluriel désigne explicitement des hommes, ce qui convient au contexte de reconnaissance.
- source_word: מִירִיחוֹ
  choice: de Jéricho
  rationale: La préposition מן indique le point de départ; « Jéricho » suit la forme française usuelle du toponyme.
- source_word: הָעַי
  choice: Aï
  rationale: Le toponyme est rendu selon sa forme française traditionnelle; l’article hébreu n’est pas reproduit, conformément à l’usage français.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: qui se trouve près de Beth-Aven
  rationale: Dans cette indication géographique, עִם (« avec ») marque vraisemblablement la proximité. La note conserve la valeur plus littérale possible.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: à l’est de Béthel
  rationale: Dans une description géographique, מִקֶּדֶם situe Aï à l’est de Béthel.
- source_word: עֲלוּ / וַיַּעֲלוּ
  choice: Montez / montèrent
  rationale: Le verbe עלה conserve l’idée d’un déplacement vers un terrain plus élevé et son écho entre l’ordre et son exécution.
- source_word: וְרַגְּלוּ / וַיְרַגְּלוּ
  choice: explorer / explorer
  rationale: Le piel de רגל désigne ici une reconnaissance du territoire. « Explorer » reste naturel en français tout en convenant au contexte militaire; la répétition préserve l’écho lexical hébreu.
- source_word: אֶת הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ désigne ici le territoire à reconnaître; « pays » est idiomatique dans ce contexte.
