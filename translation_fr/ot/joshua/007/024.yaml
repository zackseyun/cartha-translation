- from: Alors Josué prit Akan, fils de Zéra, ainsi que l’argent, le manteau, le lingot d’or[a], ses fils, ses filles, son bœuf, son âne, son petit bétail, sa tente et tout ce qui lui appartenait. Tout Israël l’accompagnait. Ils les firent monter dans la vallée d’Akor[b].
  to: Alors Josué prit Akan, fils de Zéra, ainsi que l’argent, le manteau, le lingot d’or[a], ses fils, ses filles, son bœuf, son âne, son petit bétail, sa tente et tout ce qui lui appartenait. Tout Israël l’accompagnait. Ils les emmenèrent dans la vallée d’Akor[b].
  rationale: La seule correction nécessaire remplace une causative française potentiellement ambiguë par « les emmenèrent ». Le texte maintient la liste exhaustive, ne tranche pas la question de la responsabilité des enfants d’Akan et conserve les deux notes existantes à leurs ancres.
