source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: fr
  text: Alors Josué prit Akan, fils de Zéra, ainsi que l’argent, le manteau, le lingot d’or[a], ses fils, ses filles, son bœuf, son âne, son petit bétail, sa tente et tout ce qui lui appartenait. Tout Israël l’accompagnait. Ils les emmenèrent dans la vallée d’Akor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « langue d’or », c’est-à-dire une pièce d’or probablement façonnée comme une langue; traduction traditionnelle : « coin d’or ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom Akor évoque en hébreu le malheur ou le trouble.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Alors Josué prit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession, et « prit » conserve le sens simple de לקח sans ajouter l’idée de violence.
- source_word: עָכָן בֶּן זֶרַח
  choice: Akan, fils de Zéra
  rationale: Les noms suivent une translittération française moderne; la filiation est rendue directement.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כסף désigne ici le métal précieux déjà mentionné dans le contexte; en français, « l’argent » convient sans préciser indûment sa forme.
- source_word: הָאַדֶּרֶת
  choice: le manteau
  rationale: אדרת désigne un vêtement extérieur distinctif; « manteau » est actuel, clair et digne.
- source_word: לְשׁוֹן הַזָּהָב
  choice: le lingot d’or[a]
  rationale: Littéralement « langue d’or », expression désignant vraisemblablement une pièce d’or allongée ou en forme de langue. « Lingot » rend clairement l’objet, tandis que la note conserve l’image hébraïque.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: ses fils, ses filles
  rationale: L’hébreu distingue explicitement les fils et les filles; cette précision est conservée.
- source_word: שׁוֹרוֹ
  choice: son bœuf
  rationale: Le singulier correspond à la forme hébraïque et « bœuf » est l’équivalent courant de שור dans ce contexte.
- source_word: חֲמֹרוֹ
  choice: son âne
  rationale: Équivalent français moderne et direct.
- source_word: צֹאנוֹ
  choice: son petit bétail
  rationale: צאן est un collectif pouvant inclure moutons et chèvres. « Petit bétail » préserve cette extension mieux que « troupeau », qui est moins précis.
- source_word: אָהֳלוֹ
  choice: sa tente
  rationale: Rendu direct du sens ordinaire du terme.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartenait
  rationale: Formulation française idiomatique qui conserve la portée possessive du syntagme.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Tout Israël l’accompagnait
  rationale: Le pronom renvoie le plus naturellement à Josué. Une phrase distincte rend ce rapport clair sans altérer le contenu.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: Ils les firent monter
  rationale: Le hiphil de עלה est causatif (« faire monter », « conduire en montant »). Le pluriel « les » conserve la référence collective et l’ambiguïté du groupe emmené.
- source_word: עֵמֶק עָכוֹר
  choice: la vallée d’Akor[b]
  rationale: Le toponyme est translittéré; la note signale son jeu sonore et sémantique avec le mot hébreu évoquant le malheur.
theological_decisions:
- issue: La culpabilité ou l’innocence des fils et des filles d’Akan
  choice: Les mentionner sans expliquer leur degré d’implication
  alternative: Préciser qu’ils étaient complices, ou au contraire qu’ils étaient seulement présents et n’ont pas été punis
  rationale: Ce verset les inclut parmi les personnes emmenées, mais ne précise ni leur connaissance du délit ni leur responsabilité. La traduction préserve cette tension interprétative.
- issue: Référent de « avec lui »
  choice: Comprendre que tout Israël accompagne Josué
  alternative: Comprendre que tout Israël accompagne Akan ou l’ensemble du groupe
  rationale: Josué demeure le sujet directeur de la phrase et constitue le référent le plus naturel, mais la traduction n’en tire aucune conclusion théologique supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe hébraïque très coordonnée est répartie en phrases lisibles, sans supprimer les éléments de la liste ni résoudre les ambiguïtés théologiques du verset.
