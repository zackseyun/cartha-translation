base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: fr
  text: Josué se leva de bon matin et fit approcher Israël, tribu par tribu[a]. La tribu de Juda fut prise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit approcher Israël selon ses tribus ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fut prise » ; dans cette procédure, l’expression indique qu’elle fut retenue ou mise en évidence, sans préciser le mécanisme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: se leva de bon matin
  rationale: La tournure rend à la fois l’idée de se lever tôt exprimée par שׁכם au hifil et l’indication temporelle « le matin », dans un français naturel et narratif.
- source_word: וַיַּקְרֵב
  choice: fit approcher
  rationale: Le hifil de קרב signifie « faire approcher » ou « amener près ». « Fit approcher » conserve le mouvement et le caractère formel de la comparution sans préciser devant qui ni selon quel rite.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne ici collectivement le peuple de l’alliance. Le maintien d’« Israël » suit directement l’hébreu.
- source_word: לִשְׁבָטָיו
  choice: tribu par tribu
  rationale: Cette formulation française exprime clairement la répartition procédurale selon les tribus. Une note conserve l’alternative plus formelle « selon ses tribus ».
- source_word: וַיִּלָּכֵד
  choice: fut désignée
  rationale: Le nifal de לכד signifie littéralement « fut prise », mais, dans cette procédure d’identification, il indique que la tribu est celle qui ressort. « Fut désignée » communique naturellement la fonction contextuelle de l’idiome, tandis qu’une note en signale la forme littérale et évite de préciser un mécanisme absent du verset.
- source_word: שֵׁבֶט יְהוּדָה
  choice: la tribu de Juda
  rationale: Équivalent direct et usuel de la construction hébraïque.
theological_decisions:
- issue: Nature de la procédure exprimée par וַיִּלָּכֵד
  choice: Employer « fut désignée » sans ajouter « par le sort » ni « par le Seigneur », avec une note sur l’idiome hébreu.
  alternative: « fut prise » ; « fut désignée par le sort » ; « fut identifiée »
  rationale: Le contexte décrit une procédure sacrée d’identification, mais ce verset n’en nomme pas explicitement le mécanisme ni l’agent. La traduction principale rend la fonction de l’idiome en français courant, et la note préserve sa formulation concrète sans introduire une précision théologique absente de la clause.
translation_notes:
  register: Français international moderne, clair et digne. « De bon matin » convient au récit sans archaïsme marqué. « Fit approcher » garde la solennité procédurale de l’hébreu, tandis que « tribu par tribu » rend immédiatement compréhensible l’organisation de la comparution.
