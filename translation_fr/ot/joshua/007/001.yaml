source:
  edition: WLC
  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: fr
  text: 'Mais les Israélites se montrèrent infidèles au sujet de ce qui avait été voué à la destruction[a] : Acan, fils de Carmi, fils de Zabdi, fils de Zérah, de la tribu de Juda, prit une partie de ce qui avait été voué à la destruction. Alors la colère de Yahweh s’enflamma contre les Israélites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui avait été consacré » ; plus littéralement, « l’interdit ». Le mot hébreu חֵרֶם désigne des personnes ou des choses mises à part pour Dieu, afin d’être détruites ou retirées de l’usage humain ordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: se montrèrent infidèles
  rationale: Le verbe מעל et son nom apparenté expriment ici une rupture de fidélité. Cette formulation française rend naturellement la force de l’accusatif cognat sans réduire l’acte à un péché générique.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: En français moderne, « les Israélites » exprime clairement l’identité collective d’Israël sans le caractère artificiel qu’aurait ici « les fils d’Israël ».
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: ce qui avait été voué à la destruction
  rationale: חֵרֶם désigne ici ce qui est soustrait à l’usage humain et voué à Dieu, dans ce contexte en vue de sa destruction. La formulation rend le sens contextuel tout en laissant une note signaler les autres nuances du terme.
- source_word: וַיִּקַּח ... מִן
  choice: prit une partie de
  rationale: 'La préposition מן a une valeur partitive : Akan prit certains éléments de l’ensemble voué à la destruction.'
- source_word: לְמַטֵּה יְהוּדָה
  choice: de la tribu de Juda
  rationale: Dans ce cadre généalogique, מַטֶּה désigne naturellement une tribu.
- source_word: וַיִּחַר אַף יְהוָה
  choice: la colère de Yahweh s’enflamma
  rationale: Cette expression conserve l’image hébraïque vive de la colère qui brûle tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la valeur de nom propre du tétragramme.
theological_decisions:
- issue: Responsabilité collective des Israélites et acte individuel d’Akan
  choice: Conserver le sujet collectif dans la proposition principale, puis nommer Akan comme l’auteur individuel de l’acte.
  alternative: Attribuer toute l’infidélité au seul Akan ou réduire le sujet collectif à une simple métonymie.
  rationale: L’hébreu associe délibérément la faute d’un individu à la responsabilité et aux conséquences collectives. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Se montrèrent infidèles » conserve la portée relationnelle de la faute ; « voué à la destruction » explicite le sens contextuel du terme technique חֵרֶם. Les noms propres suivent des formes françaises usuelles, tandis que Yahweh est conservé comme nom divin.
