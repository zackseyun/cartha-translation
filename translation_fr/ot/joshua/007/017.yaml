  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: fr
  text: Il fit approcher le clan de Juda, et le clan des Zérahites fut désigné. Puis il fit approcher le clan des Zérahites, homme par homme[a], et Zabdi fut désigné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par les hommes ». L’hébreu semble indiquer que le clan des Zérahites fut présenté individuellement, homme par homme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: il fit approcher
  rationale: Le hiphil de קרב signifie « faire approcher, présenter ». Cette formulation conserve le mouvement procédural du texte sans préciser au-delà de l’hébreu le moyen de la désignation.
- source_word: מִשְׁפַּחַת
  choice: clan
  rationale: Dans cette procédure qui va de la tribu vers des unités de parenté plus petites, מִשְׁפָּחָה désigne un clan plutôt que la famille nucléaire.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: fut désigné
  rationale: Le verbe לכד signifie littéralement « prendre, saisir », mais, dans ce contexte de sélection, il indique l’entité sur laquelle tombe la désignation. « Fut désigné » évite le sens militaire trompeur de « fut capturé » tout en gardant la voix passive.
- source_word: הַזַּרְחִי
  choice: les Zérahites
  rationale: Le gentilé hébreu désigne les descendants de Zérah; « les Zérahites » est concis et naturel en français biblique moderne.
- source_word: לַגְּבָרִים
  choice: homme par homme
  rationale: 'L’expression signifie littéralement « selon/par les hommes » et prend ici une valeur distributive: les hommes sont présentés individuellement.'
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Translittération française usuelle du nom propre.
theological_decisions:
- issue: Mode de désignation
  choice: Ne pas ajouter « par le sort »
  alternative: « fut désigné par le sort »
  rationale: Le contexte plus large peut suggérer un procédé sacré de sélection, mais ce verset ne nomme pas explicitement le sort. La traduction évite donc de préciser le mécanisme.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « il fit approcher » et de « clan » est conservée pour refléter les étapes successives de la procédure hébraïque.
