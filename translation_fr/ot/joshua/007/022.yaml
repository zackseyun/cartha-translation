  text: וַ/יִּשְׁלַ֤ח יְהוֹשֻׁ֨עַ֙ מַלְאָכִ֔ים וַ/יָּרֻ֖צוּ הָ/אֹ֑הֱלָ/ה וְ/הִנֵּ֧ה טְמוּנָ֛ה בְּ/אָהֳל֖/וֹ וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: fr
  text: 'Alors Josué envoya des messagers, qui coururent à la tente. Et voici : le manteau était caché dans sa tente, et l’argent était dessous[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et l’argent sous elle ». Le pronom féminin renvoie vraisemblablement au manteau mentionné au verset 21. La coordination hébraïque peut aussi être rendue : « avec l’argent dessous ».'
    reason: Précise l’antécédent du pronom féminin et signale qu’en hébreu l’expression concernant l’argent est coordonnée à la proposition précédente plutôt que formulée explicitement comme une proposition verbale distincte.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Rend simplement et naturellement le verbe שלח dans ce récit.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Il s’agit ici d’émissaires humains envoyés par Josué, non d’anges.
- source_word: וַיָּרֻצוּ
  choice: ils coururent
  rationale: Conserve l’action vive exprimée par רוץ, sans l’atténuer en « se dépêchèrent ».
- source_word: הָאֹהֱלָה
  choice: à la tente
  rationale: Le hé directionnel indique un mouvement vers la tente; le contexte précise qu’il s’agit de celle d’Akân.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Préserve l’effet de découverte et la vivacité narrative de הִנֵּה dans un français digne et courant.
- source_word: טְמוּנָה
  choice: elle était cachée
  rationale: Le participe féminin singulier renvoie naturellement au manteau mentionné au verset précédent; « cachée » évite de préciser sans nécessité qu’il aurait été enterré.
- source_word: בְּאָהֳלוֹ
  choice: dans sa tente
  rationale: Expression locative directe; le suffixe masculin singulier renvoie à Akân.
- source_word: וְהַכֶּסֶף
  choice: avec l’argent
  rationale: Exprime idiomatiquement que l’argent fait partie de la scène découverte, tout en signalant en note la coordination hébraïque plus littérale.
- source_word: תַּחְתֶּיהָ
  choice: dessous
  rationale: Le pronom féminin hébreu renvoie vraisemblablement au manteau; « dessous » restitue naturellement sa position sans répétition lourde.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tour « Et voici que » conserve l’effet dramatique de la découverte. La répétition de « tente » suit le texte hébreu et maintient la clarté.
