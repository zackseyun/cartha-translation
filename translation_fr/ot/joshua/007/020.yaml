base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: fr
  text: 'Akân répondit à Josué : « Oui, c’est bien moi qui ai péché contre Yahweh, le Dieu d’Israël. Voici ce que j’ai fait[a] : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ainsi et ainsi j’ai fait ». Cette expression hébraïque introduit les détails de ce qu’il a fait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן עָכָן אֶת־יְהוֹשֻׁעַ וַיֹּאמַר
  choice: Akân répondit à Josué
  rationale: La formule hébraïque associe « répondre » et « dire ». En français actuel, « répondit à Josué » restitue naturellement l’acte de parole sans la lourdeur de « répondit et dit ».
- source_word: אָמְנָה
  choice: Oui, c’est bien
  rationale: Cet adverbe marque une affirmation solennelle. Dans le contexte de l’aveu, « Oui, c’est bien » rend avec naturel la confirmation emphatique.
- source_word: אָנֹכִי חָטָאתִי
  choice: moi qui ai péché
  rationale: Le pronom indépendant אָנֹכִי est emphatique. La tournure clivée française conserve cette insistance personnelle sans l’exagérer.
- source_word: לַיהוָה
  choice: contre Yahweh
  rationale: Avec le verbe « pécher », la préposition ל désigne ici la personne offensée; « pécher contre » est l’expression française idiomatique. Le nom divin est translittéré « Yahweh ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et naturelle de la construction possessive hébraïque.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: Voici exactement ce que j’ai fait
  rationale: La locution redoublée est une formule qui annonce les détails de l’acte, donnés au verset suivant. Cette formulation française en restitue la fonction et l’insistance sans employer un calque obscur.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Nature de l’aveu d’Akân
  choice: c’est bien moi qui ai péché
  alternative: j’ai péché
  rationale: Le pronom hébreu אָנֹכִי met le sujet en relief. La traduction conserve cette responsabilité personnelle sans ajouter d’interprétation sur la sincérité ou la portée théologique de l’aveu.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le nom Akân suit une translittération française usuelle; la syntaxe évite le calque narratif « répondit et dit » tout en conservant l’emphase de la confession.
