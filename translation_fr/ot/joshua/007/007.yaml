  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: fr
  text: 'Josué dit : « Ah ! Seigneur Yahweh[a], pourquoi as-tu donc fait traverser le Jourdain à ce peuple ? Était-ce pour nous livrer aux mains des Amorites et nous faire périr ? Si seulement nous avions accepté de rester de l’autre côté du Jourdain ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Adonaï YHWH », associant le titre « Seigneur » au nom divin Yahweh.
    reason: Clarifier la forme inhabituelle mais délibérément conservée de l’adresse divine.
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Cette interjection exprime abruptement la détresse et la lamentation de Josué ; « Ah ! » reste naturel en français actuel.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: L’expression associe le titre אֲדֹנָי au nom divin יהוה. « Seigneur Yahweh » conserve les deux éléments sans les confondre.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: as-tu donc fait traverser
  rationale: Le verbe conjugué suivi de l’infinitif absolu donne une force emphatique. « donc » restitue cette insistance dans la question angoissée, tandis que « fait traverser » rend la forme causative.
- source_word: אֶת־הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif hébreu est directement et naturellement conservé.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: nous livrer aux mains des Amorites
  rationale: Cette formulation française naturelle conserve l’image sémitique de la main comme symbole du pouvoir, avec le nom de peuple rendu au pluriel.
- source_word: לְהַאֲבִידֵנוּ
  choice: nous faire périr
  rationale: La tournure rend la valeur causative du verbe sans atténuer la menace d’anéantissement.
- source_word: וְלוּ
  choice: Si seulement
  rationale: Cette locution introduit naturellement en français un souhait irréalisé et chargé de regret.
- source_word: הוֹאַלְנוּ וַנֵּשֶׁב
  choice: nous avions accepté de rester
  rationale: הוֹאַלְנוּ exprime le consentement ou la volonté, non la satisfaction ; « accepté » préserve cette nuance, et « rester » convient au choix envisagé de demeurer à l’est du Jourdain.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: L’expression désigne ici le côté oriental du fleuve, celui où le peuple se trouvait avant la traversée ; la formulation française conserve le point de vue contextuel.
theological_decisions:
- issue: Rendu du nom divin dans l’adresse אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU ; Seigneur, l’Éternel
  rationale: Le texte hébreu juxtapose un titre souverain et le nom propre divin. Le choix retenu rend explicitement les deux et évite de remplacer silencieusement le nom יהוה par un titre.
- issue: Portée de la plainte de Josué
  choice: Conserver la question accusatrice et le souhait contraire aux faits
  alternative: Reformuler comme une simple demande d’explication ou une confession
  rationale: Le verset présente une lamentation tendue où Josué demande pourquoi Dieu a fait traverser le peuple et regrette qu’il ne soit pas resté au-delà du Jourdain. La traduction ne résout ni n’adoucit cette tension théologique.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La ponctuation fait entendre la détresse de Josué. Les expressions « aux mains des Amorites » et « de l’autre côté du Jourdain » gardent la texture biblique tout en restant immédiatement compréhensibles.
