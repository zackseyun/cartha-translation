  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: fr
  text: Les Cananéens et tous les habitants du pays en entendront parler. Ils nous encercleront et effaceront notre nom de la terre[a]. Alors, que feras-tu pour ton grand nom ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Effacer notre nom » est une expression hébraïque qui signifie anéantir un peuple, de sorte qu’il ne subsiste ni continuité ni souvenir de lui.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: en entendront parler
  rationale: Le qal imparfait exprime ici la conséquence future redoutée par Josué. « En entendre parler » rend naturellement en français l’idée qu’ils apprendront la défaite d’Israël, sans préciser davantage ce que l’hébreu laisse au contexte.
- source_word: הַכְּנַעֲנִי
  choice: Les Cananéens
  rationale: Le nom morphologiquement singulier a un sens collectif; le pluriel français désigne naturellement ce peuple.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: et tous les habitants du pays
  rationale: Le participe substantivé désigne ceux qui habitent le territoire. Dans ce premier emploi, הָאָרֶץ renvoie naturellement au pays environnant plutôt qu’au monde entier.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: Ils nous encercleront
  rationale: נסב avec עַל évoque l’encerclement, particulièrement adapté à la menace militaire envisagée.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: et effaceront notre nom de la terre
  rationale: « Effacer notre nom » conserve l’image hébraïque tout en exprimant clairement l’élimination totale d’un peuple et de sa mémoire. Ici, « la terre » donne à la formule sa portée existentielle plus large.
- source_word: וּמַה תַּעֲשֵׂה
  choice: Alors, que feras-tu
  rationale: L’interrogatif suivi de l’imparfait s’adresse directement à Dieu. « Alors » explicite sobrement le lien logique déjà porté par la conjonction hébraïque.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: pour ton grand nom
  rationale: La préposition ל permet cette formulation concise, qui préserve l’appel concernant l’honneur et la réputation du nom de Dieu sans développer l’interprétation dans le texte.
theological_decisions:
- issue: Portée de « ton grand nom » dans l’appel de Josué
  choice: Un appel à l’honneur public de Dieu, lié au sort d’Israël devant les peuples
  alternative: Une simple question concernant le nom de Dieu, sans implication liée à l’alliance ou à sa réputation
  rationale: Le contexte met en jeu ce que les peuples environnants concluraient après l’anéantissement d’Israël. La traduction garde cependant la formulation ouverte et ne développe pas explicitement cette dimension dans le verset.
translation_notes:
  register: Français international moderne, naturel et digne. « En entendront parler » évite un calque abrupt de « entendront ». L’image du « nom » est conservée et expliquée en note. La ponctuation répartit clairement les conséquences redoutées et l’appel final à Dieu.
