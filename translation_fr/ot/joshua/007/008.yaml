id: JOS.7.8
reference: Joshua 7:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: fr
  text: De grâce, Seigneur, que puis-je dire[a], après qu’Israël a tourné le dos devant ses ennemis[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que dirai-je ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « a tourné la nuque devant ses ennemis » ; expression hébraïque désignant une retraite ou une fuite devant l’ennemi.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: De grâce
  rationale: Dans cette adresse à un supérieur, la particule introduit une supplication respectueuse et pressante. « De grâce » restitue cette valeur dans un registre digne et naturel.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin employé en adresse directe. « Seigneur » conserve la révérence sans introduire le nom d’alliance, absent du verset.
- source_word: מָה אֹמַר
  choice: que puis-je dire
  rationale: Littéralement, la forme peut se rendre par « que dirai-je ? ». Dans cette prière de détresse, « que puis-je dire ? » exprime naturellement l’impuissance rhétorique de Josué, tandis que l’autre nuance est conservée en note.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: après que
  rationale: La locution introduit la circonstance à la suite de laquelle Josué pose sa question. « Après que » en conserve directement la valeur temporelle.
- source_word: הָפַךְ עֹרֶף
  choice: a tourné le dos
  rationale: L’expression évoque littéralement le fait de présenter la nuque et fonctionne ici comme un idiome militaire désignant la fuite ou la retraite devant l’ennemi.
- source_word: לִפְנֵי אֹיְבָיו
  choice: devant ses ennemis
  rationale: Dans le contexte du combat, « devant ses ennemis » exprime clairement la relation spatiale et la défaite d’Israël. Le possessif singulier renvoie au nom collectif Israël.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: Seigneur
  alternative: mon Seigneur
  rationale: Dans cet emploi, אֲדֹנָי fonctionne comme un titre révérenciel de Dieu. « Seigneur » est la forme française habituelle et n’ajoute pas le nom divin, qui ne figure pas dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. « De grâce » maintient la supplication solennelle sans archaïsme excessif ; la tournure « tourner le dos » conserve l’image hébraïque tout en restant immédiatement compréhensible.
