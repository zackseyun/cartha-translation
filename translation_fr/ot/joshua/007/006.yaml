source:
  edition: WLC
  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: fr
  text: Josué déchira ses vêtements et tomba face contre terre devant l’arche de Yahweh jusqu’au soir, lui et les anciens d’Israël. Ils jetèrent de la poussière sur leurs têtes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeter de la poussière sur sa tête était un signe habituel de deuil, de détresse ou d’humiliation.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: déchira ses vêtements
  rationale: Le verbe קרע désigne ici le geste concret de déchirer ses habits en signe de détresse ou de deuil. « Vêtements » est courant et suffisamment large pour שִׂמְלָה.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: tomba face contre terre
  rationale: Cette expression rend clairement la prosternation physique exprimée par l’hébreu, dans un français actuel et naturel.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: devant l’arche de Yahweh
  rationale: לִפְנֵי signifie « devant » ou « en présence de »; אֲרוֹן désigne ici l’arche sacrée. Le nom divin est translittéré.
- source_word: עַד הָעֶרֶב
  choice: jusqu’au soir
  rationale: Rendu temporel direct, naturel et précis.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: avec les anciens d’Israël
  rationale: Cette formulation française indique que les anciens partagent la scène et la durée de l’humiliation sans préciser davantage que l’hébreu quelles actions singulières précédentes ils ont toutes accomplies.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: Ils jetèrent de la poussière sur leur tête
  rationale: Le tour français restitue le geste rituel concret exprimé par l’idiome hébreu; le singulier distributif « leur tête » est naturel ici.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » le présente comme un nom propre sans le remplacer par un titre.
- issue: Participation des anciens aux actions de Josué
  choice: avec les anciens d’Israël
  alternative: lui et les anciens d’Israël
  rationale: L’hébreu ajoute הוּא וְזִקְנֵי יִשְׂרָאֵל après des verbes au singulier. « Avec » conserve leur participation à la scène d’humiliation tout en évitant d’affirmer explicitement qu’ils ont également déchiré leurs vêtements.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une apposition lourde; le geste de prosternation et celui de la poussière demeurent concrets.
