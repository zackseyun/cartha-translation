revisions:
- from: Josué déchira ses vêtements et tomba face contre terre devant l’arche de Yahweh jusqu’au soir, avec les anciens d’Israël. Ils jetèrent de la poussière sur leur tête.[a]
  to: Josué déchira ses vêtements et tomba face contre terre devant l’arche de Yahweh jusqu’au soir, lui et les anciens d’Israël. Ils jetèrent de la poussière sur leurs têtes.[a]
  rationale: La formulation « lui et les anciens d’Israël » restitue l’apposition hébraïque et situe explicitement les anciens dans la scène de prosternation jusqu’au soir, sans étendre avec certitude leur participation au geste initial de déchirer les vêtements. « Leurs têtes » est la formulation française la plus directe pour le référent pluriel.
