  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל יְהוֹשֻׁ֖עַ קֻ֣ם לָ֑/ךְ לָ֣/מָּה זֶּ֔ה אַתָּ֖ה נֹפֵ֥ל עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: fr
  text: 'Yahweh dit à Josué : « Lève-toi ! Pourquoi es-tu ainsi prosterné, face contre terre ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Forme narrative standard du verbe אמר, rendue naturellement par le passé simple dans un récit français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui conserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: אֶל־יְהוֹשֻׁעַ
  choice: à Josué
  rationale: Rend directement la préposition introduisant le destinataire et emploie la forme française traditionnelle du nom.
- source_word: קֻם לָךְ
  choice: Lève-toi !
  rationale: L’impératif de קום commande à Josué de quitter sa posture; לָךְ est idiomatique et n’exige pas d’équivalent distinct en français.
- source_word: לָמָּה זֶּה
  choice: Pourquoi … ainsi
  rationale: « Ainsi » restitue discrètement la nuance démonstrative ou emphatique de זֶּה sans produire un calque lourd.
- source_word: אַתָּה נֹפֵל
  choice: restes-tu
  rationale: Dans le contexte, le participe décrit la posture où Josué se trouve encore, plutôt que le mouvement littéral de tomber; le français naturel exprime donc l’état prolongé.
- source_word: עַל־פָּנֶיךָ
  choice: face contre terre
  rationale: Expression française idiomatique et précise pour la prosternation indiquée par l’hébreu « sur ton visage ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; la transcription préserve le nom personnel et évite de le remplacer par un titre.
- issue: Sens de la posture de Josué
  choice: restes-tu ainsi face contre terre
  alternative: tombes-tu sur ton visage
  rationale: Le participe נֹפֵל peut évoquer l’action ou l’état. Le contexte immédiat présente Josué déjà prosterné; la traduction retient cet état sans effacer complètement la valeur durative.
translation_notes:
  register: Français international actuel, sobre et digne. Le passé simple convient à la narration biblique littéraire sans être archaïque. L’interpellation demeure directe; « ainsi » conserve l’emphase de לָמָּה זֶּה.
