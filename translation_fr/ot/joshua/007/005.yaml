  text: וַ/יַּכּ֨וּ מֵ/הֶ֜ם אַנְשֵׁ֣י הָ/עַ֗י כִּ/שְׁלֹשִׁ֤ים וְ/שִׁשָּׁה֙ אִ֔ישׁ וַֽ/יִּרְדְּפ֞וּ/ם לִ/פְנֵ֤י הַ/שַּׁ֨עַר֙ עַד הַ/שְּׁבָרִ֔ים וַ/יַּכּ֖וּ/ם בַּ/מּוֹרָ֑ד וַ/יִּמַּ֥ס לְבַב הָ/עָ֖ם וַ/יְהִ֥י לְ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: fr
  text: Les hommes d’Aï abattirent environ trente-six hommes d’entre eux, puis les poursuivirent depuis les abords de la porte jusqu’à Shebarim[a] et les frappèrent sur la pente. Alors le cœur du peuple se fondit et devint comme de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’aux carrières » ou « jusqu’aux lieux de fracture ». Le mot hébreu שברים peut être compris comme un nom de lieu, Shebarim, ou comme un terme descriptif.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: tuèrent … d’entre eux
  rationale: Dans ce contexte de décompte des pertes au combat, נכה indique ici des coups mortels; « d’entre eux » rend naturellement מן avec le pronom.
- source_word: אַנְשֵׁי הָעַי
  choice: les hommes d’Aï
  rationale: Le groupe construit désigne les hommes appartenant à la ville d’Aï; la forme française usuelle du toponyme est conservée.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: environ trente-six
  rationale: Le préfixe כ־ marque l’approximation. Le nom « hommes » est déjà exprimé comme sujet et n’a pas besoin d’être répété en français.
- source_word: וַיִּרְדְּפוּם לִפְנֵי הַשַּׁעַר
  choice: les poursuivirent depuis la porte
  rationale: « Poursuivirent » convient au récit militaire; « depuis la porte » transmet clairement le point de départ indiqué par לִפְנֵי sans lourdeur littérale.
- source_word: עַד הַשְּׁבָרִים
  choice: jusqu’à Shebarim
  rationale: Le terme peut fonctionner comme un toponyme ou comme un nom commun. Le texte principal conserve le toponyme, tandis que l’ambiguïté est signalée en note.
- source_word: וַיַּכּוּם בַּמּוֹרָד
  choice: les frappèrent dans la descente
  rationale: La seconde occurrence de נכה n’implique pas nécessairement que tous les poursuivis furent tués; « frappèrent » préserve donc la portée du verbe. מוֹרָד désigne une pente descendante ou une descente.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: le cœur du peuple se liquéfia
  rationale: La traduction conserve l’image hébraïque vive de la fonte du cœur, expression de l’effondrement du courage.
- source_word: וַיְהִי לְמָיִם
  choice: devint comme de l’eau
  rationale: Cette formulation française maintient la métaphore sans suggérer une transformation matérielle littérale.
