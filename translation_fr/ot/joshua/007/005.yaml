review_pass:
  verdict: revise
  source_fidelity: La première occurrence de נכה ne précise pas explicitement la mort de chaque homme; « tuèrent » est donc plus affirmatif que le texte. « Abattirent » rend la force militaire du verbe sans la surinterpréter. « Depuis les abords de la porte » restitue mieux לִפְנֵי (« devant / aux abords de ») que « depuis la porte ».
  naturalness: « Se liquéfia » est compréhensible, mais son registre est plutôt technique et matérialise l’image. « Se fondit » conserve l’image hébraïque dans un français narratif naturel. « Sur la pente » est plus idiomatique que « dans la descente ».
  terminology: Aï est une forme française usuelle. Shebarim est conservé dans le texte, avec une note qui maintient explicitement l’incertitude entre toponyme et terme descriptif. Aucun terme théologique ne requiert d’ajustement.
  issues:
  - severity: medium
    issue: « tuèrent » surinterprète la première occurrence de נכה.
    rationale: Le verbe signifie fondamentalement « frapper » et peut désigner des pertes mortelles en contexte guerrier, mais il ne l’explicite pas. Une formulation moins déterminée est préférable.
  - severity: low
    issue: « depuis la porte » atténue la nuance spatiale de לִפְנֵי הַשַּׁעַר.
    rationale: L’hébreu situe le départ devant ou aux abords de la porte, non simplement à la porte.
  - severity: low
    issue: « se liquéfia » et « dans la descente » sont moins naturels dans ce registre narratif.
    rationale: « Se fondit » et « sur la pente » transmettent les images et le relief du texte dans un français plus fluide.
  - severity: low
    issue: « lieux brisés » est peu idiomatique en français.
    rationale: « Lieux de fracture » exprime plus clairement l’alternative descriptive tout en évitant de trancher la valeur de שברים.
  revised_text: Les hommes d’Aï abattirent environ trente-six hommes d’entre eux, puis les poursuivirent depuis les abords de la porte jusqu’à Shebarim[a] et les frappèrent sur la pente. Alors le cœur du peuple se fondit et devint comme de l’eau.
  revised_footnotes:
