revisions:
- from: Les hommes d’Aï tuèrent environ trente-six d’entre eux, puis les poursuivirent depuis la porte jusqu’à Shebarim[a] et les frappèrent dans la descente. Alors le cœur du peuple se liquéfia et devint comme de l’eau.
  to: Les hommes d’Aï abattirent environ trente-six hommes d’entre eux, puis les poursuivirent depuis les abords de la porte jusqu’à Shebarim[a] et les frappèrent sur la pente. Alors le cœur du peuple se fondit et devint comme de l’eau.
  rationale: La révision évite d’affirmer explicitement que les trente-six hommes furent tués, restitue plus précisément le point de départ de la poursuite et améliore le naturel français sans modifier le sens ni résoudre l’ambiguïté de Shebarim.
