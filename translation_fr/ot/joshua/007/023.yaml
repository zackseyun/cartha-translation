revisions:
- from: Ils les prirent à l’intérieur de la tente, les apportèrent à Josué et à tous les fils d’Israël, puis les étalèrent devant Yahweh.[a]
  to: Ils les retirèrent de l’intérieur de la tente, les apportèrent à Josué et à tous les fils d’Israël, puis les déposèrent devant Yahweh.[a]
  rationale: La révision explicite la provenance « depuis l’intérieur de la tente », portée par מִתּוֹךְ, et adopte « déposèrent », qui rend sobrement l’action de placer les objets devant Yahweh tout en laissant la note signaler la valeur littérale possible de « verser ».
