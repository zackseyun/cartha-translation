  text: וַ/יִּקָּחוּ/ם֙ מִ/תּ֣וֹךְ הָ/אֹ֔הֶל וַ/יְבִאוּ/ם֙ אֶל יְהוֹשֻׁ֔עַ וְ/אֶ֖ל כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּצִּקֻ֖/ם לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: fr
  text: Ils les retirèrent de l’intérieur de la tente, les apportèrent à Josué et à tous les fils d’Israël, puis les déposèrent devant Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut littéralement signifier « verser ». Ici, il décrit vraisemblablement le fait de déposer ou d’étaler devant Yahweh les objets retirés de la tente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: Ils les prirent
  rationale: Le verbe לקח signifie naturellement « prendre » dans ce récit; « saisir » serait trop énergique et « aller chercher » plus interprétatif.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: à l’intérieur de la tente
  rationale: La préposition composée מִתּוֹךְ marque une provenance depuis l’intérieur; avec « prendre », le français idiomatique emploie ici « à l’intérieur de ».
- source_word: וַיְבִאוּם
  choice: les apportèrent
  rationale: Le hiphil de בוא exprime le fait d’amener ou d’apporter. Puisque les antécédents sont des objets, « apporter » est naturel en français.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: à Josué et à tous les fils d’Israël
  rationale: La formulation conserve le parallélisme des destinataires et rend formellement l’expression collective בְּנֵי יִשְׂרָאֵל sans la réduire à « tout Israël ».
- source_word: וַיַּצִּקֻם
  choice: puis les étalèrent
  rationale: יצק signifie souvent « verser », mais ses objets sont ici les biens retirés de la tente. « Étaler » restitue leur dépôt ou leur exposition sans leur attribuer une nature liquide; la valeur littérale est signalée en note.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de ». Le nom divin est translittéré « Yahweh », conformément à sa fonction de nom propre dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère personnel du nom, tandis que « le SEIGNEUR » est une substitution liturgique traditionnelle et « Jéhovah » une forme historique moins proche de la vocalisation généralement reconstruite.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: « Fils d’Israël » conserve la forme de l’ethnonyme collectif hébreu et sa résonance narrative, sans décider que l’expression désigne uniquement les hommes présents.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique digne sans archaïsme marqué. Les pronoms pluriels gardent l’enchaînement compact de l’hébreu; « puis » clarifie la progression narrative. Le marqueur [a] apparaît dans le texte principal.
