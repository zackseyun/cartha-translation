translation_notes:
  register: Français international moderne, soutenu mais accessible. Le texte conserve « le peuple » plutôt que de le réduire à « l’armée », ainsi que le double emploi de « monter ». Les impératifs au subjonctif gardent le ton de recommandation énergique des éclaireurs.
