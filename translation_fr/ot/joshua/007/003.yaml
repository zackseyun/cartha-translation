revisions:
- from: 'Ils revinrent auprès de Josué et lui dirent : « Que tout le peuple ne monte pas ! Que deux mille hommes environ, ou trois mille hommes environ, montent et frappent Aï. Ne fatigue pas tout le peuple à l’y faire aller[a], car ses habitants sont peu nombreux[b]. »'
  to: 'Ils revinrent auprès de Josué et lui dirent : « Que tout le peuple ne monte pas. Que deux mille hommes environ, ou trois mille hommes environ, montent et frappent Aï. Ne fatigue pas tout le peuple là-bas[a], car ses habitants sont peu nombreux[b]. »'
  rationale: La seule correction de fond remplace une paraphrase causative (« à l’y faire aller ») par une expression qui rend directement le verbe hébreu et sa localisation. La ponctuation du premier conseil est également normalisée, sans modifier sa valeur prohibitive.
