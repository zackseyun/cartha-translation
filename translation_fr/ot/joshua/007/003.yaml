base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: fr
  text: 'Ils revinrent auprès de Josué et lui dirent : « Que tout le peuple ne monte pas. Que deux mille hommes environ, ou trois mille hommes environ, montent et frappent Aï. Ne fatigue pas tout le peuple là-bas[a], car ses habitants sont peu nombreux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne donne pas à tout le peuple la peine d’y aller. »'
    reason: Le verbe hébreu peut évoquer la fatigue, la peine ou l’effort inutile imposé au peuple.
  - marker: b
    text: 'Littéralement : « car ils sont peu nombreux ». Le pronom renvoie vraisemblablement aux habitants ou aux défenseurs d’Aï.'
    reason: Le référent est implicite en hébreu et doit être clarifié dans un français naturel sans masquer la formulation littérale.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו
  choice: Ils revinrent auprès de Josué et lui dirent
  rationale: Le retour des éclaireurs vers Josué est exprimé dans un français narratif naturel, tout en conservant les deux verbes hébreux.
- source_word: אַל יַעַל כָּל־הָעָם
  choice: Que tout le peuple ne monte pas !
  rationale: La tournure rend le conseil prohibitif avec יַעַל et conserve l’image topographique et militaire de la montée.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: deux mille hommes environ, ou trois mille hommes environ
  rationale: Le préfixe כ־ marque l’approximation dans les deux nombres; « hommes » correspond à אִישׁ dans le contexte de la force combattante.
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: montent et frappent Aï
  rationale: « Montent » maintient la répétition de עלה; « frappent » préserve la portée de נכה sans présumer que l’attaque réussira.
- source_word: אַל־תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: Ne fatigue pas tout le peuple à l’y faire aller
  rationale: Le piel de יגע exprime le fait d’imposer une fatigue ou un effort. La formulation française rattache naturellement שָׁמָּה au déplacement vers Aï.
- source_word: כִּי מְעַט הֵמָּה
  choice: car ses habitants sont peu nombreux
  rationale: Le pronom désigne implicitement les gens d’Aï; expliciter « ses habitants » évite en français une référence ambiguë à l’armée israélite, tandis que « peu nombreux » rend מְעַט.
