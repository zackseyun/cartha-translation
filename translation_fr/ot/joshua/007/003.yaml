review_pass:
  verdict: revise
  source_fidelity: La recommandation de n’envoyer qu’un contingent, la répétition de « monter », l’approximation des effectifs et le sens militaire non conclusif de « frapper Aï » sont bien rendus. En revanche, « à l’y faire aller » transforme inutilement le verbe hébreu « fatiguer / imposer un effort » en une construction causative de déplacement. L’explicitation « ses habitants » est contextuellement justifiée pour le pronom final, dont le référent est implicite dans l’hébreu.
  naturalness: Le texte révisé emploie une formulation française moderne et directe. « Ne fatigue pas tout le peuple là-bas » conserve la localisation de שָׁמָּה sans surtraduire le moyen par lequel cette fatigue serait causée.
  terminology: « Josué », « Aï », « le peuple », « hommes », « monter » et « frapper » sont appropriés. « Le peuple » est maintenu sans le réduire interprétativement à une armée. Les notes distinguent utilement le sens de fatigue/effort et l’antécédent implicite du pronom.
  issues:
  - severity: medium
    issue: La formulation « Ne fatigue pas tout le peuple à l’y faire aller » ajoute une causation et un déplacement formulé comme « faire aller » qui ne sont pas exprimés ainsi par le texte hébreu.
    rationale: אַל־תְּיַגַּע ... אֶת־כָּל־הָעָם signifie directement ne pas fatiguer ou imposer un effort à tout le peuple, avec « là-bas ». La révision évite de présenter l’envoi comme le contenu lexical du verbe.
