  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ מֶ֣ה עֲכַרְתָּ֔/נוּ יַעְכֳּרְ/ךָ֥ יְהוָ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּרְגְּמ֨וּ אֹת֤/וֹ כָל יִשְׂרָאֵל֙ אֶ֔בֶן וַ/יִּשְׂרְפ֤וּ אֹתָ/ם֙ בָּ/אֵ֔שׁ וַ/יִּסְקְל֥וּ אֹתָ֖/ם בָּ/אֲבָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: fr
  text: 'Josué dit : « Pourquoi nous as-tu troublés ? Yahweh te troublera aujourd’hui. » Alors tout Israël le lapida à coups de pierres[a] ; puis ils les brûlèrent au feu et les lapidèrent à coups de pierres[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un premier verbe signifiant « lapider » ; un autre verbe de sens voisin apparaît ensuite dans le verset.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe du singulier (« le ») au pluriel (« les »). Ce changement, qui peut englober Akân avec d’autres personnes ou avec ce qui lui appartenait, est conservé sans être explicité davantage. Le dernier verbe rendu par « lapidèrent » est différent du premier en hébreu, bien qu’il ait un sens voisin.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכָּרְךָ
  choice: nous as-tu attiré le malheur / attirera le malheur sur toi
  rationale: Le verbe עכר exprime le fait d’attirer le malheur ou le trouble. La même formulation dans les deux propositions conserve le jeu de mots et la réciprocité du jugement, dans un français naturel et solennel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בַּיּוֹם הַזֶּה
  choice: Aujourd’hui
  rationale: Cette formulation rend directement l’immédiateté solennelle de l’expression hébraïque en français moderne.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: le lapida à coups de pierres
  rationale: רגם désigne ici la lapidation. « À coups de pierres » conserve la mention explicite de l’instrument sans produire la redondance peu naturelle de « lapider avec des pierres ».
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: ils les brûlèrent
  rationale: Le pronom pluriel est conservé. En français, « brûler » indique déjà l’action du feu ; ajouter « par le feu » serait lourd sans apporter de sens distinct.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: les lapidèrent à coups de pierres
  rationale: סקל désigne également la lapidation. Le français ne permet pas de distinguer naturellement les deux verbes hébreux dans ce contexte ; la variation lexicale est signalée en note.
theological_decisions:
- issue: Passage du singulier au pluriel après la mention d’Akân
  choice: Conserver « le » puis « les » dans le texte principal.
  alternative: Uniformiser tous les pronoms au singulier, ou préciser que le pluriel vise exclusivement la famille ou les biens d’Akân.
  rationale: Le texte massorétique passe explicitement du singulier au pluriel. La traduction préserve cette tension sans déterminer de façon artificielle qui ou quoi est inclus dans le pluriel.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme fondé sur עכר est rendu par la répétition de « attirer le malheur ». Les marqueurs de notes [a] et [b] figurent dans le texte principal, et le passage du singulier au pluriel est strictement préservé.
