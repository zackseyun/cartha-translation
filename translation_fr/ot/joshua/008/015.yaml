base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: fr
  text: Josué et tout Israël furent battus devant eux[a] et s’enfuirent par le chemin du désert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « firent semblant d’être battus devant eux ». Dans le contexte, cette défaite apparente semble faire partie d’une manœuvre destinée à attirer les hommes d’Aï loin de la ville.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur la route du désert » ou « en direction du désert ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: se laissèrent battre
  rationale: Le nifal exprime ici une défaite apparente dans un contexte militaire. « Se laissèrent battre » rend naturellement la manœuvre tactique indiquée par le contexte, sans développer le verbe en une explication complète; la valeur passive simple demeure signalée en note.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Équivalent français direct et naturel de לִפְנֵי avec suffixe, qui conserve la dimension spatiale de l’affrontement.
- source_word: וַיָּנֻסוּ
  choice: s’enfuirent
  rationale: נוּס signifie couramment « fuir ». Le terme conserve la force du texte, même si cette fuite fait partie d’une ruse militaire.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: en direction du désert
  rationale: Cette formulation rend naturellement la route ou la direction associée au désert. Comme דֶּרֶךְ peut aussi désigner explicitement le chemin, cette possibilité est conservée en note.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: Josué et tout Israël
  rationale: La formulation conserve le nom collectif « Israël » du texte hébreu et son rôle de désignation du peuple.
theological_decisions:
- issue: Caractère réel ou simulé de la défaite
  choice: se laissèrent battre
  alternative: furent battus
  rationale: Le contexte de l’embuscade favorise une défaite feinte ou consentie, mais la forme verbale peut se lire comme un passif simple. Le texte principal suit la stratégie narrative tandis que la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans archaïsme excessif. Les deux marqueurs sont placés dans le texte principal, le premier après l’expression de direction complète afin de ne pas alourdir le milieu de la phrase.
