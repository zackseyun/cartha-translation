  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: fr
  text: Il pendit le roi d’Aï à un arbre jusqu’au soir[a]. Au coucher du soleil[b], Josué donna l’ordre de descendre son cadavre de l’arbre. Ils le jetèrent à l’entrée de la porte de la ville et élevèrent sur lui un grand tas de pierres, qui subsiste jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le suspendit ». Le verbe hébreu signifie « pendre, suspendre » et ne précise pas à lui seul si le roi fut tué ainsi ou si son corps fut ensuite exposé.
    reason: lexical_alternative
  - marker: b
    text: Ou « quand le soleil se coucha ». L’expression hébraïque désigne le coucher du soleil.
    reason: idiom_clarification
lexical_decisions:
- source_word: תָּלָה
  choice: fit pendre
  rationale: Le verbe signifie « pendre, suspendre ». « Fit pendre » convient au récit et laisse ouverte la question de savoir si la suspension constituait l’exécution ou l’exposition du cadavre; une note signale l’autre rendu possible.
- source_word: הָעֵץ
  choice: un arbre
  rationale: עֵץ désigne couramment un arbre ou du bois. « Un arbre » est naturel en français et évite de préciser sans preuve qu’il s’agissait d’un poteau ou d’un dispositif particulier.
- source_word: עַד עֵת הָעָרֶב
  choice: jusqu’au soir
  rationale: Rendu français fluide et fidèle de l’expression temporelle hébraïque.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: au coucher du soleil
  rationale: L’expression idiomatique décrit le moment où le soleil se couche; ce rendu est précis et naturel.
- source_word: נִבְלָתוֹ
  choice: son cadavre
  rationale: נְבֵלָה désigne un corps mort. « Cadavre » conserve la force concrète du terme sans la connotation animale que pourrait avoir « carcasse ».
- source_word: וַיַּשְׁלִיכוּ אוֹתָהּ
  choice: Ils le jetèrent
  rationale: En hébreu, le suffixe féminin reprend נְבֵלָה, nom féminin. En français, le pronom masculin « le » reprend naturellement « cadavre ».
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: à l’entrée de la porte de la ville
  rationale: Le rendu conserve les deux éléments, « entrée/ouverture » et « porte », sans réduire l’expression au seul espace général de la porte.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: un grand tas de pierres
  rationale: Expression claire et accessible pour un amoncellement de pierres; « cairn » serait moins courant.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: qui est resté là jusqu’à ce jour
  rationale: La formule hébraïque ne comporte pas ici de verbe explicite. L’ajout contextuel « est resté là » rend clairement en français la permanence du tas jusqu’au temps du narrateur.
theological_decisions:
- issue: Sujet de la proposition initiale
  choice: Josué est représenté comme le donneur d’ordre implicite par « Il fit pendre »
  alternative: « Ils pendirent le roi d’Aï » ou « Josué pendit le roi d’Aï »
  rationale: Le verbe hébreu est au masculin singulier sans sujet explicite, et Josué est nommé dans la proposition suivante. Le pronom singulier respecte la syntaxe tout en évitant d’ajouter son nom là où l’hébreu ne le répète pas. La tournure causative française n’affirme pas qu’il accomplit personnellement le geste.
- issue: Nature exacte de la pendaison
  choice: Ne pas préciser si le roi fut tué par pendaison ou si son corps fut suspendu après sa mort
  alternative: Traduire explicitement par « exécuta par pendaison » ou par « exposa son corps »
  rationale: Le verbe תלה signifie suspendre ou pendre, mais ne tranche pas à lui seul entre exécution et exposition. Le texte français et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement réorganisées pour éviter une coordination trop lourde, sans modifier l’enchaînement des actions. Les deux marqueurs de note figurent immédiatement après les expressions qu’ils expliquent.
