revisions:
- from: Il fit pendre le roi d’Aï à un arbre jusqu’au soir[a]. Au coucher du soleil[b], Josué donna l’ordre de descendre son cadavre de l’arbre. Ils le jetèrent à l’entrée de la porte de la ville et élevèrent sur lui un grand tas de pierres, qui est resté là jusqu’à ce jour.
  to: Il pendit le roi d’Aï à un arbre jusqu’au soir[a]. Au coucher du soleil[b], Josué donna l’ordre de descendre son cadavre de l’arbre. Ils le jetèrent à l’entrée de la porte de la ville et élevèrent sur lui un grand tas de pierres, qui subsiste jusqu’à ce jour.
  rationale: La révision remplace la construction causative par le verbe actif requis par l’hébreu, tout en maintenant dans la note l’ambiguïté sur les circonstances de la suspension. La formule finale est resserrée pour refléter la permanence indiquée par l’hébreu sans ajout de sens. Les ancres de notes restent placées sur les expressions expliquées.
