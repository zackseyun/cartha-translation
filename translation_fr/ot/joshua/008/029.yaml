review_pass:
  verdict: revise
  source_fidelity: La tournure causative « Il fit pendre » ne correspond pas directement au verbe hébreu actif au singulier (« il pendit / suspendit »). Elle ajoute l’idée que Josué a fait accomplir l’acte par d’autres, même si le contexte peut le suggérer. Le reste rend fidèlement la succession des actions, y compris la descente du cadavre, son jet à l’entrée de la porte et le tas de pierres élevé sur lui.
  naturalness: Le français est globalement naturel et de registre narratif approprié. « Il pendit » est plus direct et plus fidèle que « Il fit pendre ». « Qui subsiste jusqu’à ce jour » rend plus simplement la formule mémorielle finale, sans l’ajout spatial « là ».
  terminology: « Roi d’Aï », « arbre », « cadavre », « porte de la ville » et « grand tas de pierres » sont appropriés. La note sur תלה doit proposer une alternative sans transformer le texte en formulation causative. La note sur le coucher du soleil est correctement ancrée dans le projet français.
  issues:
  - severity: medium
    issue: « Il fit pendre » introduit une causalité absente de la forme verbale hébraïque.
    rationale: וְאֶת מֶלֶךְ הָעַי תָּלָה est un verbe actif à la troisième personne du singulier. Le sujet implicite est vraisemblablement Josué, mais le texte ne dit pas explicitement qu’il a donné l’ordre à des exécutants. « Il pendit » conserve la voix et la syntaxe source.
  - severity: low
    issue: « qui est resté là jusqu’à ce jour » ajoute « là » et emploie un parfait français moins directement formulé comme la permanence du monument.
    rationale: La formule עַד הַיּוֹם הַזֶּה signifie que le tas subsiste au temps du narrateur. « qui subsiste jusqu’à ce jour » est idiomatique et plus sobre.
  revised_text: Il pendit le roi d’Aï à un arbre jusqu’au soir[a]. Au coucher du soleil[b], Josué donna l’ordre de descendre son cadavre de l’arbre. Ils le jetèrent à l’entrée de la porte de la ville et élevèrent sur lui un grand tas de pierres, qui subsiste jusqu’à ce jour.
  revised_footnotes:
