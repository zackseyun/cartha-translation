  text: וְ/כָל הָ/עָ֨ם הַ/מִּלְחָמָ֜ה אֲשֶׁ֣ר אִתּ֗/וֹ עָלוּ֙ וַֽ/יִּגְּשׁ֔וּ וַ/יָּבֹ֖אוּ נֶ֣גֶד הָ/עִ֑יר וַֽ/יַּחֲנוּ֙ מִ/צְּפ֣וֹן לָ/עַ֔י וְ/הַ/גַּ֖י בינ/ו וּ/בֵין הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: fr
  text: Tous les combattants qui étaient avec lui montèrent et s’approchèrent de la ville. Ils arrivèrent en face de celle-ci et établirent leur camp au nord d’Aï, la vallée se trouvant entre lui[a] et Aï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre lui et Aï ». Le pronom singulier renvoie probablement à Josué, mais certains comprennent le groupe collectivement : « entre eux et Aï ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: Tous les combattants
  rationale: L’expression désigne collectivement les personnes engagées dans le combat. « Les combattants » est naturel en français, n’ajoute aucune précision de genre absente de l’hébreu et évite le calque peu idiomatique « le peuple de guerre ».
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient avec lui
  rationale: La proposition relative identifie les troupes qui accompagnaient Josué.
- source_word: עָלוּ
  choice: montèrent
  rationale: Le verbe עלה exprime ici une montée ou un déplacement vers le haut; le sens directionnel simple est conservé sans développer en « marchèrent ».
- source_word: וַיִּגְּשׁוּ
  choice: s’approchèrent de la ville
  rationale: נגשׁ signifie s’approcher. Le complément « de la ville », fourni par la suite immédiate, rend la phrase française claire sans modifier le mouvement décrit.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: Ils arrivèrent en face de celle-ci
  rationale: נֶגֶד indique une position devant ou en face de la ville. « En face de » préserve nettement cette relation spatiale; « celle-ci » évite une répétition lourde.
- source_word: וַיַּחֲנוּ
  choice: établirent leur camp
  rationale: Expression française courante et digne pour l’action de camper, avec une légère élévation de registre adaptée au récit.
- source_word: מִצְּפוֹן לָעַי
  choice: au nord d’Aï
  rationale: Rendu spatial direct et naturel en français.
- source_word: הַגַּי
  choice: la vallée
  rationale: גַּי peut désigner une vallée ou un ravin. « Vallée » conserve la portée générale du terme sans imposer une topographie plus étroite.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: entre lui et Aï
  rationale: Le suffixe massorétique est au masculin singulier et renvoie le plus naturellement à Josué. La traduction conserve cette formulation difficile plutôt que de l’harmoniser au pluriel.
