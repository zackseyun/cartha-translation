  naturalness: Le français est globalement clair et moderne. La reprise explicite « Tous étaient là » est fluide, mais elle n’est pas nécessaire et affaiblit légèrement la construction du verset. Une formulation intégrée est à la fois plus exacte et plus naturelle.
  terminology: « anciens », « officiers », « juges », « prêtres lévites », « arche de l’alliance », « Yahweh », « étranger résident » et « Israélite de naissance » conviennent au registre et au contexte. « Officiers » rend plus précisément la fonction administrative de שֹׁטְרִים que le terme très large « responsables ».
