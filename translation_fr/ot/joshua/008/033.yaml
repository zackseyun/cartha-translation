  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: fr
  text: Tout Israël, avec ses anciens, ses officiers et ses juges, se tenait de part et d’autre de l’arche, en face des prêtres lévites qui portaient l’arche de l’alliance de Yahweh, l’étranger résident aussi bien que l’Israélite de naissance[a]. Une moitié du peuple faisait face au mont Garizim et l’autre moitié au mont Ébal, comme Moïse, serviteur de Yahweh, l’avait ordonné au commencement[b], afin de bénir le peuple d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme l’étranger résident, comme l’autochtone ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « au commencement » ou « en premier » ; l’expression peut renvoyer à l’ordre donné antérieurement par Moïse ou indiquer que la bénédiction devait être le premier acte accompli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Tout Israël
  rationale: Cette formulation naturelle conserve le sens collectif de la nation entière réunie pour la cérémonie.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: avec ses anciens, ses responsables et ses juges
  rationale: « Avec » rend clairement l’accompagnement; « responsables » exprime la fonction administrative de שֹׁטְרִים sans suggérer à tort des policiers ou uniquement des officiers militaires.
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: de part et d’autre de l’arche
  rationale: Expression française idiomatique qui restitue exactement la disposition des deux côtés de l’arche.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  rationale: Rend naturellement le groupe nominal hébreu tout en conservant l’identification lévitique des prêtres concernés.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: qui portaient l’arche de l’alliance de Yahweh
  rationale: La relative française traduit clairement le participe hébreu et maintient le nom personnel divin.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: l’étranger résident aussi bien que l’Israélite de naissance
  rationale: La formulation souligne l’égale présence des deux catégories; « étranger résident » rend le statut social du גֵּר, tandis qu’« Israélite de naissance » explicite ici l’appartenance autochtone.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: Une moitié du peuple ... et l’autre moitié
  rationale: Le référent collectif est explicité pour éviter toute ambiguïté en français.
- source_word: בָּרִאשֹׁנָה
  choice: au commencement
  rationale: Cette traduction proche de l’hébreu conserve l’ambiguïté entre un ordre donné antérieurement et la bénédiction accomplie comme premier acte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel; sa translittération évite de le remplacer par un titre.
- issue: Portée sociale de גֵּר et אֶזְרָח
  choice: l’étranger résident aussi bien que l’Israélite de naissance
  alternative: l’immigré comme l’autochtone
  rationale: Le choix maintient l’inclusion égale des résidents non natifs et des membres natifs d’Israël, sans projeter sur eux des catégories politiques modernes.
- issue: Sens temporel de בָּרִאשֹׁנָה
  choice: au commencement
  alternative: auparavant / comme premier acte
  rationale: La formulation principale et la note préservent les deux lectures possibles au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases ont été légèrement réorganisées pour éviter une longue période difficile à suivre, sans modifier les rapports syntaxiques essentiels. Les toponymes usuels « Garizim » et « Ébal » sont conservés.
