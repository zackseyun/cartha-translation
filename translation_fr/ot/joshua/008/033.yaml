revisions:
- from: Tout Israël, avec ses anciens, ses responsables et ses juges, se tenait de part et d’autre de l’arche, en face des prêtres lévites qui portaient l’arche de l’alliance de Yahweh. Tous étaient là, l’étranger résident aussi bien que l’Israélite de naissance[a]. Une moitié du peuple faisait face au mont Garizim, et l’autre moitié au mont Ébal, comme Moïse, serviteur de Yahweh, l’avait ordonné au commencement[b], afin de bénir le peuple d’Israël.
  to: Tout Israël, avec ses anciens, ses officiers et ses juges, se tenait de part et d’autre de l’arche, en face des prêtres lévites qui portaient l’arche de l’alliance de Yahweh, l’étranger résident aussi bien que l’Israélite de naissance[a]. Une moitié du peuple faisait face au mont Garizim et l’autre moitié au mont Ébal, comme Moïse, serviteur de Yahweh, l’avait ordonné au commencement[b], afin de bénir le peuple d’Israël.
  rationale: La révision supprime l’explicitation autonome non nécessaire et rétablit le rattachement direct des deux catégories sociales à l’ensemble de l’assemblée. Elle remplace également « responsables » par « officiers », terme plus précis dans ce contexte. La formulation « au commencement », accompagnée de la note, conserve l’ambiguïté de בָּרִאשֹׁנָה.
