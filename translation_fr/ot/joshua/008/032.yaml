source:
  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: fr
  text: Là, sur les pierres, il écrivit une copie de la loi de Moïse[a], que Moïse avait écrite devant les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une répétition de la loi de Moïse » ou « un double de la loi de Moïse ». Le terme hébreu peut désigner une copie ou une version répétée.
    reason: lexical_alternative
  - marker: b
    text: Ou « en présence des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: il écrivit
  rationale: Le qal wayyiqtol de כתב est le verbe narratif principal. « Écrivit » rend simplement l’action; « grava » préciserait plus que ne le fait le verbe hébreu, même si le support est de pierre.
- source_word: שָׁם עַל הָאֲבָנִים
  choice: Là, sur les pierres
  rationale: Cette formulation conserve l’adverbe de lieu et présente naturellement les pierres comme support de l’écriture.
- source_word: אֵת מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: une copie de la loi de Moïse
  rationale: מִשְׁנֵה peut désigner une copie, un double ou une répétition. Dans ce contexte d’écriture sur des pierres, « une copie » est naturel sans déterminer l’étendue du corpus écrit.
- source_word: תּוֹרַת
  choice: la loi
  rationale: Bien que תּוֹרָה puisse signifier « instruction », l’expression reconnue « la loi de Moïse » convient au contexte juridique et d’alliance.
- source_word: אֲשֶׁר כָּתַב
  choice: que celui-ci avait écrite
  rationale: Le plus-que-parfait exprime l’antériorité de l’écriture de Moïse. « Celui-ci » clarifie que le sujet implicite de כָּתַב est Moïse plutôt que Josué.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » conserve la brièveté et l’ambivalence spatiale et publique de לִפְנֵי; le sens « en présence de » est signalé en note.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation rend formellement le masculin pluriel construit et reste une expression biblique intelligible en français.
theological_decisions:
- issue: Étendue de מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: « une copie de la loi de Moïse », sans préciser s’il s’agit de toute la Torah ou d’une partie juridique
  alternative: « une répétition de la loi de Moïse » ou « un double de la loi de Moïse »
  rationale: Le verset ne définit pas l’étendue de ce qui fut écrit. La traduction maintient cette indétermination sans imposer une harmonisation.
- issue: Référent du sujet implicite dans אֲשֶׁר כָּתַב
  choice: Moïse, rendu par « celui-ci »
  alternative: Josué, si l’on rattache mécaniquement le sujet au verbe principal
  rationale: La syntaxe et le sens de « copie de la loi de Moïse » favorisent Moïse comme auteur de l’écrit antérieur. La clarification française évite une ambiguïté référentielle artificielle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. La formulation reste proche de l’ordre hébreu sans être gauche; les notes préservent les principales possibilités lexicales.
