base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: fr
  text: 'Alors Yahweh dit à Josué : « Tends le javelot[a] que tu tiens à la main vers Aï, car je la livrerai entre tes mains. » Josué tendit alors le javelot qu’il tenait à la main vers la ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lance ». Le mot hébreu כִּידוֹן peut désigner un javelot, une lance ou une arme comparable selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, conformément à la politique du projet.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: Tends / tendit
  rationale: Rend le geste d’étendre l’arme dans une direction sans le réduire au simple fait de la pointer.
- source_word: כִּידוֹן
  choice: javelot
  rationale: Désigne ici une arme pouvant être tenue et tendue vers une cible; « javelot » conserve la distinction possible avec le terme hébreu plus courant pour « lance ».
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: que tu as à la main / qu’il avait à la main
  rationale: Conserve les propositions relatives répétées de l’hébreu tout en employant une tournure française naturelle.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: vers Aï / vers la ville
  rationale: Exprime la direction du geste et préserve la variation du texte entre le nom propre et « la ville ».
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: car je la livrerai entre tes mains
  rationale: Conserve l’image idiomatique hébraïque de la remise au pouvoir de Josué ainsi que la valeur future du verbe.
- source_word: אֶתְּנֶנָּה
  choice: la
  rationale: Le suffixe féminin singulier renvoie implicitement à la ville; le pronom féminin français maintient cette référence.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme; la translittération « Yahweh » préserve le nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « à la main » et le passage de « Aï » à « la ville » sont conservés. L’idiome « livrer entre tes mains » maintient l’image hébraïque tout en restant intelligible.
