id: JOS.8.8
reference: Joshua 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: fr
  text: Quand vous vous serez emparés de la ville, vous y mettrez le feu. Vous agirez selon la parole de Yahweh[a]. Voyez, je vous l’ai ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à l’ordre de Yahweh ». L’hébreu dit littéralement : « selon la parole de Yahweh ».'
    reason: La tournure peut désigner ici aussi bien la parole donnée que l’ordre qu’elle exprime.
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: Quand vous vous serez emparés
  rationale: La tournure introduit une circonstance future précédant l’action commandée. Le futur antérieur exprime naturellement en français l’achèvement de la prise de la ville.
- source_word: הָעִיר
  choice: la ville
  rationale: Rendu courant de עִיר dans ce contexte militaire.
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: vous y mettrez le feu
  rationale: Le hifil de יצת a un sens causatif, « mettre le feu, incendier ». Le pronom « y » évite une répétition lourde tout en gardant la ville comme objet.
- source_word: כִּדְבַר יְהוָה
  choice: selon la parole de Yahweh
  rationale: Cette formulation conserve le sens littéral de דָּבָר, « parole », sans exclure ici la nuance d’ordre ou de commandement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: תַּעֲשׂוּ
  choice: Vous agirez
  rationale: Dans ce contexte, « agir selon » est plus naturel en français que le calque « faire selon », tout en maintenant la valeur directive de l’imparfait hébreu.
- source_word: רְאוּ
  choice: Voyez
  rationale: L’impératif conserve l’appel direct à l’attention du texte hébreu.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: je vous l’ai ordonné
  rationale: Le passé composé rend l’acte de commandement déjà accompli ; « l’ » renvoie naturellement aux instructions qui précèdent.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le Tétragramme comme nom personnel ; « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Portée de כִּדְבַר יְהוָה
  choice: selon la parole de Yahweh
  alternative: conformément à l’ordre de Yahweh
  rationale: « Parole » maintient la formulation hébraïque et sa possible amplitude sémantique ; une note signale la nuance contextuelle de commandement sans l’imposer dans le texte.
translation_notes:
  register: Français international moderne, sobre et direct. Le futur antérieur marque clairement l’antériorité de la prise de la ville ; le futur simple conserve ensuite la force de l’instruction. « Voyez » garde la vigueur de l’impératif hébreu malgré son caractère légèrement solennel en français.
