base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: fr
  text: Alors Josué et tous les combattants se levèrent pour monter contre Aï[a]. Josué choisit trente mille hommes, de vaillants guerriers, et les envoya de nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour monter vers Aï »; le contexte indique qu’il s’agit d’un mouvement militaire contre la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal de קום marque ici le début de l’action. « Se leva » conserve l’image et la progression narrative sans préciser prématurément qu’il partit.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: tous les combattants
  rationale: Littéralement « tout le peuple de la guerre ». « Tous les combattants » exprime naturellement en français moderne la valeur collective et militaire de l’expression, sans donner à עַם le sens institutionnel plus précis d’« armée ».
- source_word: לַעֲלוֹת
  choice: pour monter contre
  rationale: עלה désigne une montée vers une destination. Dans ce contexte militaire, « contre » laisse entendre le mouvement hostile tout en conservant l’idée de monter; la note signale la lecture directionnelle moins explicite.
- source_word: הָעָי
  choice: Aï
  rationale: Forme française usuelle du nom de lieu, avec tréma pour marquer les deux voyelles.
- source_word: וַיִּבְחַר
  choice: choisit
  rationale: בחר signifie directement « choisir, sélectionner »; « choisit » convient au récit et reste proche de l’hébreu.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: trente mille hommes
  rationale: La formulation conserve le substantif explicite אִישׁ et évite de le remplacer par « soldats », bien que le contexte soit militaire.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: de vaillants guerriers
  rationale: Cette expression militaire désigne des hommes reconnus pour leur force, leur courage et leur capacité au combat. « Vaillants guerriers » est clair, actuel et digne, sans l’archaïsme de « hommes de valeur » dans ce contexte.
- source_word: וַיִּשְׁלָחֵם
  choice: les envoya
  rationale: שלח avec le suffixe objet signifie simplement « les envoya ». Le français n’a pas besoin d’ajouter « au loin » ou « en avant », qui dépasserait l’explicite.
- source_word: לָיְלָה
  choice: de nuit
  rationale: L’emploi adverbial indique le moment de l’envoi. « De nuit » est concis et naturel dans un récit militaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « Josué » au début de la seconde phrase suit la reprise explicite du nom dans l’hébreu. « Combattants » et « vaillants guerriers » évitent des tournures vieillies tout en conservant le caractère militaire du verset.
