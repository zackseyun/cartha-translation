  to: 'comme Moïse, serviteur de Yahweh, l’avait ordonné aux fils d’Israël, ainsi qu’il est écrit dans le livre de la loi de Moïse : un autel en pierres intactes[a], sur lesquelles aucun outil de fer n’avait été manié. Ils y offrirent des holocaustes à Yahweh et sacrifièrent des sacrifices de paix[b].'
