source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: fr
  text: 'comme Moïse, serviteur de Yahweh, l’avait ordonné aux fils d’Israël, ainsi qu’il est écrit dans le livre de la loi de Moïse : un autel en pierres intactes[a], sur lesquelles aucun outil de fer n’avait été manié. Ils y offrirent des holocaustes à Yahweh et sacrifièrent des sacrifices de paix[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en pierres non taillées ». L’hébreu dit littéralement « en pierres entières » et souligne qu’elles étaient restées intactes, sans avoir été travaillées avec du fer.
    reason: lexical_alternative
  - marker: b
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme […] l’avait ordonné
  rationale: Le plus-que-parfait situe naturellement l’ordre de Moïse avant son exécution, tandis que « comme » exprime la conformité à cet ordre.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: « Serviteur » convient au titre honorifique de Moïse, et « Yahweh » rend directement le nom divin.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et collective explicite de l’hébreu.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: dans le livre de la loi de Moïse
  rationale: Rend distinctement סֵפֶר, « livre », et תּוֹרָה, « loi/instruction », dans une formule française reconnaissable.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: un autel en pierres intactes
  rationale: « Intactes » exprime le sens de pierres demeurées entières sans suggérer qu’elles étaient naturellement régulières; la proposition suivante précise l’absence de travail au fer.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: sur lesquelles on n’avait passé aucun outil de fer
  rationale: Cette tournure naturelle communique l’image d’un outil de fer appliqué aux pierres, sans reproduire littéralement l’expression hébraïque « lever du fer sur ».
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: Ils y offrirent des holocaustes
  rationale: « Holocaustes » est le terme sacrificiel français usuel pour les offrandes entièrement brûlées; « y » reprend clairement l’autel.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: sacrifièrent des sacrifices de paix
  rationale: La formulation garde le verbe sacrificiel et le terme traditionnel « sacrifices de paix », tout en signalant en note l’étendue sémantique de שְׁלָמִים.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Expression collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix maintient l’image familiale masculine du texte hébreu sans la neutraliser.
- issue: Portée du terme sacrificiel שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion / sacrifices de bien-être
  rationale: Le terme traditionnel reste intelligible et ne tranche pas exclusivement entre les notions de paix, de communion et de bien-être; les autres possibilités sont conservées en note.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase garde la structure dépendante du contexte précédent : « un autel » précise l’objet construit au verset 30. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.'
