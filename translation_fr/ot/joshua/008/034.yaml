  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: fr
  text: Après cela, il lut[a] toutes les paroles de la Loi[b], la bénédiction et la malédiction, conformément à tout ce qui est écrit dans le livre de la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il proclama » ou « il lut à haute voix » ; le verbe hébreu peut désigner une lecture publique ou une proclamation selon le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « Loi » peut aussi signifier « instruction ». Dans ce contexte de document d’alliance, « Loi » est retenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: La locution marque la succession temporelle avec les actions précédentes; cette formulation est naturelle en français narratif moderne.
- source_word: קָרָא
  choice: il lut à haute voix
  rationale: Avec «toutes les paroles» pour complément et dans une scène publique, le verbe désigne ici la lecture ou la proclamation audible. L'explicitation «à haute voix» restitue cette portée contextuelle sans réduire l'acte à une simple proclamation.
- source_word: אֶת כָּל דִּבְרֵי הַתּוֹרָה
  choice: toutes les paroles de la Loi
  rationale: «Paroles» conserve le caractère concret de דִּבְרֵי. Dans ce contexte de document d'alliance, «Loi» rend naturellement תּוֹרָה, tout en signalant en note l'autre valeur possible, «instruction».
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: la bénédiction et la malédiction
  rationale: Les singuliers hébreux résument vraisemblablement les sections ou catégories de bénédiction et de malédiction de l'alliance; le français conserve ces singuliers.
- source_word: כְּכָל הַכָּתוּב
  choice: conformément à tout ce qui est écrit
  rationale: Cette tournure exprime clairement la conformité de la lecture au document écrit et rend l'ensemble prépositionnel et participial de manière idiomatique.
- source_word: בְּסֵפֶר הַתּוֹרָה
  choice: dans le livre de la Loi
  rationale: סֵפֶר désigne un document écrit et peut être rendu par «livre» ou «rouleau». «Livre de la Loi» est une désignation française claire, sans imposer que le support matériel soit précisé.
theological_decisions:
- issue: Sens de תּוֹרָה dans le cadre de l'alliance
  choice: Loi
  alternative: instruction
  rationale: Le contexte documentaire et l'association avec la bénédiction et la malédiction favorisent «Loi», mais le champ sémantique plus large de «instruction» est préservé en note.
translation_notes:
  register: Français international moderne, digne et accessible. «Lut à haute voix» rend explicite le caractère public suggéré par le contexte. La majuscule à «Loi» dans la désignation du document facilite l'identification sans ajouter de précision confessionnelle.
