base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: fr
  text: Josué les envoya. Ils se rendirent au lieu de l’embuscade[a] et s’établirent entre Béthel et Aï, à l’ouest d’Aï. Josué passa cette nuit-là au milieu du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner l’embuscade, la troupe embusquée ou l’endroit où elle se tient. Ici, le contexte favorise le sens de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Josué les envoya
  rationale: Le verbe שׁלח signifie ici simplement « envoyer ». Le pronom objet pluriel est conservé par « les ».
- source_word: הַמַּאְרָב
  choice: au lieu de l’embuscade
  rationale: Le nom peut désigner soit la troupe embusquée, soit l’endroit où elle se tient. Avec le verbe de mouvement « se rendirent », le sens locatif convient bien au contexte, tandis qu’une note préserve l’ambiguïté lexicale.
- source_word: וַיֵּשְׁבוּ
  choice: s’établirent
  rationale: ישׁב peut signifier s’asseoir, demeurer ou s’installer. Dans ce cadre militaire, « s’établirent » exprime naturellement le fait de prendre et de garder une position sans expliciter excessivement la tactique.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: entre Béthel et Aï
  rationale: Traduction directe de l’indication géographique, avec les formes françaises usuelles des noms propres bibliques.
- source_word: מִיָּם לָעָי
  choice: à l’ouest d’Aï
  rationale: יָם signifie littéralement « mer », mais sert couramment à indiquer l’ouest dans les expressions géographiques hébraïques.
- source_word: וַיָּלֶן
  choice: passa cette nuit-là
  rationale: לון désigne le fait de demeurer ou de loger pendant la nuit. La tournure choisie est naturelle en français et évite la répétition « passa la nuit cette nuit-là ».
- source_word: בְּתוֹךְ הָעָם
  choice: au milieu du peuple
  rationale: La préposition et le nom expriment la présence de Josué au sein du groupe. « Au milieu du peuple » reste clair, digne et proche de la formulation hébraïque.
