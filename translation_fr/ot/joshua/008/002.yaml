base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: fr
  text: Tu traiteras Aï et son roi comme tu as traité Jéricho et son roi. Toutefois, vous pourrez prendre pour vous son butin et son bétail[a]. Place une embuscade contre la ville, en arrière de celle-ci[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous prendrez pour vous ». La forme hébraïque peut exprimer un futur directif ou une autorisation ; le texte retient l’autorisation, en contraste avec Jéricho où le butin était interdit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Place des hommes en embuscade contre la ville, en arrière de celle-ci. » Le terme hébreu au singulier peut désigner l’embuscade comme un tout ou le groupe chargé de la tendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu traiteras
  rationale: Le parfait qal 2ms avec waw a ici une valeur directive. « Tu traiteras » exprime naturellement en français l’instruction adressée à Josué et convient à la construction « traiter… comme ».
- source_word: לָעַי וּלְמַלְכָּהּ
  choice: Aï et son roi
  rationale: Le nom propre est rendu selon l’usage français courant. La préposition hébraïque se laisse naturellement intégrer au verbe « traiter ».
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: comme tu as traité
  rationale: La comparaison désigne Jéricho comme précédent; la répétition de « traité » donne une phrase française fluide sans préciser davantage ce que le texte laisse au contexte.
- source_word: רַק
  choice: Toutefois
  rationale: La particule introduit ici une exception importante au parallèle avec Jéricho. « Toutefois » marque clairement ce contraste.
- source_word: שְׁלָלָהּ
  choice: son butin
  rationale: « Butin » est le terme français actuel et précis pour les biens saisis à la guerre.
- source_word: וּבְהֶמְתָּהּ
  choice: et son bétail
  rationale: Dans ce contexte, בְּהֵמָה désigne les animaux domestiques considérés comme biens; « bétail » conserve cette valeur économique et collective.
- source_word: תָּבֹזּוּ לָכֶם
  choice: vous pourrez prendre pour vous
  rationale: La 2e personne masculine plurielle vise les combattants, après le singulier adressé à Josué. Dans le contexte, la forme autorise la prise du butin, contrairement à Jéricho; « pourrez » conserve cette valeur permissive, tandis que « pour vous » rend לָכֶם.
- source_word: שִׂים לְךָ אֹרֵב
  choice: Place une embuscade
  rationale: L’impératif singulier revient à Josué. אֹרֵב peut désigner l’embuscade ou le détachement embusqué; le texte principal retient l’expression française naturelle « placer une embuscade ».
- source_word: לָעִיר מֵאַחֲרֶיהָ
  choice: contre la ville, derrière elle
  rationale: « Contre la ville » explicite la visée hostile de לְ, et « derrière elle » conserve la référence pronominale de l’hébreu à la ville.
theological_decisions:
- issue: Valeur modale de תָּבֹזּוּ
  choice: vous pourrez prendre pour vous
  alternative: vous prendrez pour vous
  rationale: La forme peut se lire comme un futur directif, mais le contraste avec l’interdit concernant le butin de Jéricho favorise une autorisation. La note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et direct. L’alternance entre « tu » et « vous » reproduit le passage de l’adresse à Josué au singulier à celle de ses forces au pluriel. Les répétitions utiles du texte source sont conservées, tandis que la formulation reste naturelle.
