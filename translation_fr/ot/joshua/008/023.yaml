  text: וְ/אֶת מֶ֥לֶךְ הָ/עַ֖י תָּ֣פְשׂוּ חָ֑י וַ/יַּקְרִ֥בוּ אֹת֖/וֹ אֶל יְהוֹשֻֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/023.yaml
  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: fr
  text: Mais ils capturèrent le roi d’Aï vivant et l’amenèrent auprès de Josué.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ils capturèrent le roi d’Aï vivant et l’amenèrent auprès de Josué. »'
    reason: La conjonction hébraïque peut être rendue simplement par « Et » ; « Mais » fait ressortir le contraste contextuel avec la mise à mort des autres habitants.
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mais
  rationale: 'Dans le contexte du massacre qui précède, la conjonction introduit un contraste implicite : contrairement aux autres, le roi est pris vivant. « Et » reste grammaticalement possible.'
- source_word: מֶלֶךְ הָעַי
  choice: le roi d’Aï
  rationale: Cette tournure rend naturellement la chaîne construite hébraïque et conserve la forme française traditionnelle du nom de lieu.
- source_word: תָּפְשׂוּ
  choice: capturèrent
  rationale: En contexte militaire, le verbe signifie saisir ou faire prisonnier ; « capturèrent » exprime clairement cette action.
- source_word: חָי
  choice: vivant
  rationale: L’adjectif prédicatif précise que le roi fut capturé sans être tué.
- source_word: וַיַּקְרִבוּ
  choice: l’amenèrent
  rationale: Le hiphil de קרב signifie faire approcher ou amener. Avec le complément introduit par אֶל, « amener à » est naturel en français et conserve l’idée de mouvement vers Josué.
- source_word: אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: l’amenèrent à Josué
  rationale: Le pronom désigne le roi et la préposition marque Josué comme destination ; « devant Josué » ajouterait une nuance de comparution ou de présentation qui n’est pas explicite.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif. La formulation reste concise et suit l’ordre des actions de l’hébreu.
