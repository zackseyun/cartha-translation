source:
  edition: WLC
  text: וַ/יִּזָּעֲק֗וּ כָּל הָ/עָם֙ אֲשֶׁ֣ר ב/עיר לִ/רְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַֽ/יִּרְדְּפוּ֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/יִּנָּתְק֖וּ מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: fr
  text: Alors, tous les gens qui étaient dans la ville furent mobilisés pour les poursuivre[a]. Ils poursuivirent Josué et furent entraînés loin de la ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussèrent un cri » ; le verbe hébreu peut désigner un cri, mais il semble ici évoquer plutôt un appel ou une mobilisation en vue de la poursuite.
    reason: lexical_alternative
  - marker: b
    text: Ou « furent séparés de la ville », voire « furent coupés de la ville ». L’hébreu exprime le fait d’en être détaché ou éloigné.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: furent mobilisés
  rationale: Le niphal de זעק peut exprimer ici l’appel ou le rassemblement en vue d’une action. Dans ce contexte militaire, « furent mobilisés » rend naturellement cette mise en mouvement collective, tout en signalant en note l’autre sens lexical possible.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: tous les gens qui étaient dans la ville
  rationale: עָם désigne le peuple ou les gens, sans imposer ici le masculin « hommes ». Cette formulation française reste large et naturelle.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: pour les poursuivre
  rationale: רדף אחרי est l’expression courante pour poursuivre quelqu’un. Le pronom pluriel « les » est conservé sans l’harmoniser avec la mention ultérieure de Josué.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: Ils poursuivirent Josué
  rationale: La répétition du verbe est conservée, ainsi que le passage de l’objet pluriel « les » au chef nommé, Josué.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: furent entraînés loin de la ville
  rationale: Le niphal de נתק évoque l’idée d’être arraché, détaché ou éloigné. « Furent entraînés loin de » exprime l’effet tactique sans réduire le verbe au seul sens d’une coupure physique.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom biblique.
theological_decisions: []
