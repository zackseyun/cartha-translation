  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: fr
  text: Le peuple disposa donc tout le camp au nord de la ville, avec son arrière[a] à l’ouest de la ville[b]. Cette nuit-là, Josué alla au milieu de la vallée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son arrière-garde ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « du côté de la mer par rapport à la ville »; en hébreu, « mer » peut servir de terme d’orientation pour désigner l’ouest.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: disposa
  rationale: Le verbe שׂים signifie largement « mettre, placer ». Dans ce contexte militaire, « disposa » exprime un placement organisé sans préciser davantage la manœuvre.
- source_word: הָעָם
  choice: le peuple
  rationale: L’hébreu emploie le terme général עָם, « peuple », même si le contexte concerne les combattants; la traduction conserve ce choix.
- source_word: כָּל הַמַּחֲנֶה
  choice: tout le camp
  rationale: Cette expression rend directement כָּל, « tout », et מַחֲנֶה, « camp, campement », dans un français naturel.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: au nord de la ville
  rationale: La formulation française intègre naturellement la proposition de localisation sans perdre son contenu spatial.
- source_word: עֲקֵבוֹ
  choice: son arrière
  rationale: עָקֵב désigne littéralement le « talon », puis par extension la partie arrière. « Son arrière » préserve cette image spatiale sans imposer le sens plus précis d’« arrière-garde ».
- source_word: מִיָּם לָעִיר
  choice: à l’ouest de la ville
  rationale: יָם, « mer », sert couramment de terme d’orientation pour l’ouest en hébreu biblique. Le sens directionnel est rendu dans le texte, tandis que l’expression littérale est signalée en note.
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: הלך est le verbe courant signifiant « aller, marcher »; « alla » convient simplement au déplacement rapporté.
- source_word: בַּלַּיְלָה הַהוּא
  choice: cette nuit-là
  rationale: C’est l’équivalent idiomatique et précis de l’expression temporelle hébraïque.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: au milieu de la vallée
  rationale: בְּתוֹךְ signifie « au milieu de, à l’intérieur de ». Avec le verbe de mouvement « alla », le français exprime naturellement la destination sans devoir ajouter « jusque » ou « dans ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Disposa » garde la nuance tactique du contexte tout en restant courant. La seconde proposition est séparée en une nouvelle phrase pour une lecture fluide, sans modifier le rapport temporel ni le contenu du verset.
