source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: fr
  text: 'Puis Yahweh dit à Josué : « N’aie pas peur et ne te laisse pas abattre. Prends avec toi tous les combattants[a], lève-toi et monte à Aï. Vois : j’ai livré entre tes mains le roi d’Aï, son peuple, sa ville et son territoire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tout le peuple de la guerre » ; l’expression désigne l’ensemble des combattants. On peut aussi traduire « tous les guerriers » ou « toute l’armée ».
    reason: Préciser la forme littérale et les principales possibilités lexicales de כָּל עַם הַמִּלְחָמָה.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Rendu narratif français naturel du wayyiqtol de אמר.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: N’aie pas peur et ne te laisse pas abattre
  rationale: La première proposition interdit la peur; la seconde exprime l’idée d’être brisé intérieurement ou découragé, dans un français actuel.
- source_word: קַח עִמְּךָ
  choice: Prends avec toi
  rationale: Représente explicitement la locution prépositionnelle עִמְּךָ.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: tous les hommes de guerre
  rationale: Rend clairement la force combattante visée tout en restant proche de l’expression hébraïque « tout le peuple de la guerre ».
- source_word: וְקוּם עֲלֵה
  choice: lève-toi et monte
  rationale: Conserve les deux impératifs successifs et leur vigueur.
- source_word: הָעָי
  choice: Aï
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: רְאֵה
  choice: Vois
  rationale: Conserve l’impératif qui introduit l’assurance divine sans recourir à une tournure archaïque.
- source_word: נָתַתִּי בְיָדְךָ
  choice: j’ai livré entre tes mains
  rationale: Le parfait présente l’action comme accomplie et certaine; l’image des mains, qui exprime la mise au pouvoir de Josué, est conservée.
- source_word: מֶלֶךְ הָעַי ... עַמּוֹ ... עִירוֹ ... אַרְצוֹ
  choice: le roi d’Aï, son peuple, sa ville et son territoire
  rationale: Respecte la série hébraïque et rattache naturellement les suffixes masculins au roi; « territoire » convient mieux que « terre » au domaine relevant de la ville.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; la translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur du parfait נָתַתִּי dans la promesse divine
  choice: j’ai livré
  alternative: je livre / je livrerai
  rationale: Le passé composé maintient la présentation de la victoire comme déjà acquise, sans réduire cette forme à un simple futur.
- issue: Portée de כָּל עַם הַמִּלְחָמָה
  choice: tous les hommes de guerre
  alternative: toute l’armée / tous les guerriers / tout le peuple de guerre
  rationale: Le contexte désigne la force combattante. Le choix conserve la référence humaine et militaire sans suggérer l’ensemble de la population.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs restent nets; les deux membres de l’encouragement et les deux verbes de mouvement sont conservés. La ponctuation met en relief l’assurance introduite par « Vois ».
