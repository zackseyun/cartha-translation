revisions:
- from: 'Puis Yahweh dit à Josué : « N’aie pas peur et ne te laisse pas abattre. Prends avec toi tous les hommes de guerre[a], lève-toi et monte contre Aï. Vois : j’ai livré entre tes mains le roi d’Aï, son peuple, sa ville et son territoire. »'
  to: 'Puis Yahweh dit à Josué : « N’aie pas peur et ne te laisse pas abattre. Prends avec toi tous les combattants[a], lève-toi et monte à Aï. Vois : j’ai livré entre tes mains le roi d’Aï, son peuple, sa ville et son territoire. »'
  rationale: La révision supprime l’ajout implicite de « contre » afin de suivre de plus près l’impératif de mouvement hébreu, et emploie « tous les combattants », plus naturel dans le français moderne. Le reste du texte et la note sont maintenus quant au sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:07:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les éléments essentiels du texte hébreu sont bien représentés : le nom Yahweh, les deux interdictions, les deux impératifs, l’assurance formulée au parfait et la série « roi, peuple, ville, pays ». Toutefois, « monte contre Aï » explicite une opposition militaire que l’impératif עֲלֵה (« monte à/vers ») ne formule pas lui-même. Le contexte est militaire, mais la traduction peut conserver cette nuance sans l’ajouter.'
  naturalness: Le français est globalement clair et digne. « Tous les combattants » est plus naturel en français international moderne que « tous les hommes de guerre », tout en désignant sans ambiguïté la force combattante.
  terminology: « Yahweh », « Josué » et « Aï » sont cohérents. « Ne te laisse pas abattre » rend convenablement l’idée de découragement ou d’effondrement exprimée par חתת. « J’ai livré entre tes mains » conserve l’image idiomatique hébraïque et la valeur d’assurance du parfait.
  issues:
  - severity: medium
    issue: « monte contre Aï »
    rationale: Le texte hébreu porte littéralement « monte à/vers Aï » (עֲלֵה הָעָי), sans préposition exprimant « contre ». Même si l’affrontement est contextuellement évident, « monte à Aï » évite d’ajouter cette relation explicite.
  - severity: low
    issue: « tous les hommes de guerre »
    rationale: Cette expression est intelligible mais moins idiomatique en français moderne. « Tous les combattants » rend naturellement le groupe militaire visé; la note conserve la formulation littérale et les autres possibilités.
