source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: fr
  text: Il n’y eut rien de tout ce que Moïse avait commandé que Josué ne lut devant toute l’assemblée d’Israël, les femmes, les petits enfants et l’étranger[b] qui vivait au milieu d’eux[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’y eut aucune parole, de tout ce que Moïse avait commandé, que Josué ne lut. »'
    reason: lexical_alternative
  - marker: b
    text: Ici, « l’étranger » désigne un non-Israélite établi parmi le peuple d’Israël.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « qui marchait au milieu d’eux »; on peut aussi comprendre : « qui se trouvait au milieu d’eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר
  choice: parole
  rationale: Dans le contexte d’une lecture publique des commandements, « parole » convient mieux que « chose » ou « affaire » et garde le lien avec ce qui est lu à haute voix.
- source_word: צִוָּה
  choice: avait commandé
  rationale: Le verbe exprime ici l’autorité des prescriptions transmises par Moïse; le plus-que-parfait situe naturellement ces commandements avant leur lecture par Josué.
- source_word: קָרָא
  choice: lut
  rationale: Le contexte immédiat est celui de la lecture publique de la loi. « Lut » est donc plus précis que « proclama », même si le verbe hébreu peut aussi signifier appeler ou proclamer.
- source_word: נֶגֶד
  choice: devant
  rationale: « Devant » exprime simplement et naturellement une lecture faite en présence de l’assemblée.
- source_word: קְהַל
  choice: assemblée
  rationale: Ce terme désigne le peuple officiellement réuni, sans les connotations ecclésiales que pourrait prendre « congrégation ».
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Le texte les mentionne explicitement parmi les personnes présentes à la lecture; la traduction conserve cette inclusion.
- source_word: הַטַּף
  choice: les petits enfants
  rationale: טַף désigne particulièrement les jeunes enfants ou les personnes à charge; « petits enfants » en conserve la nuance d’âge.
- source_word: הַגֵּר
  choice: l’étranger
  rationale: Dans ce contexte, le terme désigne non un simple inconnu, mais un non-Israélite établi au sein du peuple. Le texte courant garde le terme bref, précisé par une note culturelle.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: qui vivait au milieu d’eux
  rationale: Le participe de « marcher » décrit idiomatiquement la présence durable de l’étranger au sein de la communauté. « Vivait » transmet ce sens en français naturel, tandis qu’une note conserve l’image littérale.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: Il n’y eut aucune parole… que Josué ne lut
  rationale: Cette double négation française reste naturelle, reproduit la structure hébraïque et souligne que Josué a tout lu sans exception.
theological_decisions:
- issue: Portée publique de l’enseignement de l’alliance
  choice: La traduction nomme explicitement les femmes, les petits enfants et l’étranger parmi ceux qui assistent à la lecture.
  alternative: Les englober sans les nommer dans une formulation générale comme « tout Israël ».
  rationale: L’hébreu énumère expressément ces groupes après l’assemblée d’Israël. Les conserver évite d’atténuer la portée collective et inclusive de la scène.
- issue: Statut du גֵּר
  choice: « l’étranger », compris grâce au contexte et à la note comme un étranger établi parmi Israël
  alternative: « l’immigré », « le résident étranger » ou « l’étranger de passage »
  rationale: « L’étranger » est digne et immédiatement compréhensible; la note empêche de l’interpréter comme un simple visiteur, sans imposer une catégorie administrative moderne.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve la double négation emphatique de l’hébreu sans devenir obscure. « Ainsi que devant » rend explicite la portée de נֶגֶד sur tous les groupes énumérés et évite une coordination française maladroite.
