  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: fr
  text: Les Israélites ne prirent pour eux que le bétail et le butin de cette ville, conformément à l’ordre que Yahvé avait donné à Josué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Mais
  rationale: Dans ce contexte, la particule marque l’exception par rapport à la destruction qui précède. « Mais » introduit naturellement ce contraste, tandis que la restriction ressort des seuls objets énumérés.
- source_word: הַבְּהֵמָה
  choice: le bétail
  rationale: Le terme désigne ici les animaux domestiques pouvant être pris comme butin; « le bétail » est le collectif français courant.
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: et le butin de cette ville
  rationale: שׁלל désigne les biens pris à la guerre, et le démonstratif hébreu identifie précisément la ville dont il vient d’être question.
- source_word: בָּזְזוּ לָהֶם
  choice: prirent pour eux
  rationale: Le verbe exprime l’action de prendre comme butin et לָהֶם indique que les Israélites gardèrent ces biens pour eux. Cette formulation évite la lourdeur de « pillèrent le butin ».
- source_word: יִשְׂרָאֵל
  choice: les Israélites
  rationale: Le nom national est ici sujet collectif d’un verbe au pluriel; « les Israélites » rend naturellement cet accord en français.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahvé
  rationale: La locution exprime la conformité à ce que Yahvé avait déclaré ou prescrit; « conformément à » convient au registre narratif digne.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: qui l’avait ordonné à Josué
  rationale: Le relatif se rapporte naturellement à Yahvé comme sujet de צוה. Le plus-que-parfait situe l’ordre avant son exécution, et le pronom « l’ » reprend le contenu de la parole.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahvé » le rend directement en français sans lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation privilégie une syntaxe française naturelle tout en conservant le contraste avec la destruction précédente, l’appropriation du butin par Israël et la conformité à l’ordre divin.
