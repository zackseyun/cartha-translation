base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: fr
  text: Moi-même et tout le peuple qui est avec moi, nous nous approcherons de la ville[a]. Quand ils sortiront à notre rencontre, comme la première fois[b], nous fuirons devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous nous avancerons vers la ville ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme la première fois » ; cela renvoie à la première attaque contre Aï.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: nous nous approcherons
  rationale: Le qal inaccompli à la première personne du pluriel exprime ici l’action future prévue dans la stratégie. « Nous nous approcherons » est naturel et conserve le mouvement vers la ville.
- source_word: הָעָם
  choice: le peuple
  rationale: « Peuple » garde le sens ordinaire de עם sans réduire explicitement le groupe à des soldats ou à des hommes.
- source_word: אֲשֶׁר אִתִּי
  choice: qui est avec moi
  rationale: Le relatif se rapporte grammaticalement au collectif singulier « le peuple » ; cette formulation reste naturelle en français.
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette construction introduit l’événement temporel suivant. « Quand » en rend clairement la fonction sans reproduire lourdement l’idiome hébreu.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: ils sortiront à notre rencontre
  rationale: יצא suivi de לקראת décrit le fait de sortir pour rencontrer quelqu’un. La formulation préserve le mouvement tactique sans préciser davantage s’il s’agit de combattre.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: comme la première fois
  rationale: La locution renvoie à la première confrontation avec Aï. Cette traduction est idiomatique tout en restant proche de l’expression hébraïque.
- source_word: וְנַסְנוּ
  choice: nous fuirons
  rationale: Le verbe נוס signifie « fuir » ; dans cette séquence, il désigne l’action future planifiée. « Fuirons » conserve la force du verbe, même si la fuite est feinte dans le contexte.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Avec נוס, l’expression signifie fuir devant eux ou loin de leur présence. « Devant eux » conserve l’idiome et sa perspective spatiale.
- source_word: וַאֲנִי וְכָל הָעָם
  choice: Moi et tout le peuple
  rationale: La coordination hébraïque est conservée, tandis que la reprise par « nous » produit une phrase française claire et naturelle.
