  yaml_path: translation/ot/joshua/008/010.yaml
  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: fr
  text: Josué se leva de bon matin, passa le peuple en revue[a], puis Josué et les anciens d’Israël montèrent devant le peuple vers Aï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dénombra le peuple » ou « inspecta le peuple » ; le verbe hébreu peut désigner le fait de compter, d’inspecter, de désigner ou de rassembler en vue d’une mission. Le contexte militaire favorise ici « passa le peuple en revue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: se leva de bon matin
  rationale: Cette tournure française naturelle rend à la fois l’idée de se lever tôt portée par le hifil de שׁכם et la mention explicite du matin.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: passa le peuple en revue
  rationale: Dans ce contexte militaire, פקד désigne vraisemblablement l’inspection ou le rassemblement organisé du peuple. « Passer en revue » conserve cette nuance sans réduire nécessairement l’action à un simple dénombrement.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme hébreu est général. « Le peuple » évite de le restreindre explicitement aux troupes, même si le contexte est militaire.
- source_word: וַיַּעַל
  choice: montèrent
  rationale: Le verbe עלה signifie ordinairement « monter ». Le pluriel français correspond au sujet coordonné, Josué et les anciens.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: lui et les anciens d’Israël
  rationale: Le pronom hébreu met explicitement Josué en relief aux côtés des anciens; « lui et » préserve cette insistance inhabituelle mais significative.
- source_word: לִפְנֵי הָעָם
  choice: en tête du peuple
  rationale: Dans le récit d’une marche militaire, cette expression rend naturellement la position indiquée par לפני, littéralement « devant le peuple », sans ajouter une fonction non exprimée.
- source_word: הָעָי
  choice: Aï
  rationale: La forme française traditionnelle et claire du nom de lieu est « Aï »; l’article hébreu n’est pas reproduit avec ce nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde l’insistance hébraïque sur Josué lui-même avec « lui et les anciens », tandis que « en tête du peuple » exprime clairement leur position dans la marche.
