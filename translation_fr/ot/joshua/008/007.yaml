source:
  edition: WLC
  text: וְ/אַתֶּ֗ם תָּקֻ֨מוּ֙ מֵ/הָ֣/אוֹרֵ֔ב וְ/הוֹרַשְׁתֶּ֖ם אֶת הָ/עִ֑יר וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: fr
  text: Alors, vous sortirez de l’embuscade et prendrez possession de la ville[a], car Yahweh, votre Dieu, la livrera entre vos mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous vous emparerez de la ville ». Le verbe hébreu peut désigner la prise de possession, et pas seulement la conquête militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: vous surgirez
  rationale: Le qal inaccompli de קום s’inscrit dans une suite d’instructions militaires. « Surgir » exprime naturellement le mouvement hors de la position cachée, sans lourdeur.
- source_word: מֵהָאוֹרֵב
  choice: de votre embuscade
  rationale: אֹרֵב désigne ici l’embuscade ou la position depuis laquelle les hommes sont à l’affût. Le possessif explicite naturellement en français l’embuscade occupée par les destinataires.
- source_word: וְהוֹרַשְׁתֶּם
  choice: vous vous emparerez de
  rationale: Le hiphil de ירשׁ peut exprimer la prise de possession, l’occupation ou la dépossession. Dans ce contexte militaire, « s’emparer de » conserve à la fois l’idée de conquête et celle de prise de possession.
- source_word: הָעִיר
  choice: la ville
  rationale: Traduction directe de עִיר avec l’article défini.
- source_word: וּנְתָנָהּ
  choice: la livrera
  rationale: Le parfait coordonné, après les instructions, annonce avec assurance le résultat à venir. « Livrer entre les mains » rend idiomatiquement en français l’action promise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le construit muni du suffixe de deuxième personne du pluriel est rendu directement.
- source_word: בְּיֶדְכֶם
  choice: entre vos mains
  rationale: L’expression hébraïque signifie remettre quelque chose au pouvoir de quelqu’un. Le pluriel français « entre vos mains » est l’équivalent idiomatique courant et reste proche de l’image source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur traduit la suite d’instructions et la certitude de la promesse. « Surgirez » convient au contexte d’une troupe quittant brusquement sa position d’embuscade; « la livrera entre vos mains » conserve une image biblique aisément comprise en français.
