review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : Josué brûle Aï et la transforme en un תל, puis le texte qualifie son état de désolation durable « jusqu’à ce jour ». Toutefois, dans « en fit pour toujours un monceau », « pour toujours » se rattache plus naturellement à l’action de faire qu’au monceau, alors que עוֹלָם qualifie directement תֵּל. « Lieu dévasté » est aussi un peu plus interprétatif et moins nominal que שְׁמָמָה (« désolation »).'
  naturalness: Le passé simple et le nom « Aï » conviennent. La formulation révisée est plus fluide en français moderne tout en conservant la structure à deux prédicats du texte source.
  terminology: « Tertre » rend de façon concise et non surinterprétée תֵּל, un monticule, notamment de ruines. « Permanent » exprime ici la durée longue ou indéfinie de עוֹלָם sans imposer l’idée d’une éternité métaphysique; la note conserve l’alternative lexicale. « Désolation » rend directement שְׁמָמָה.
  issues:
  - severity: medium
    issue: Portée syntaxique ambiguë de « pour toujours »
    rationale: Dans le brouillon, l’adverbe suit « en fit » et peut qualifier l’acte de Josué; dans l’hébreu, עוֹלָם qualifie le « tertre/monceau » (תֵּל).
  - severity: low
    issue: « un lieu dévasté » affaiblit le parallélisme nominal
    rationale: שְׁמָמָה est un nom abstrait (« désolation »). Cette traduction directe préserve mieux la construction hébraïque et évite d’ajouter « lieu ».
  revised_text: Josué brûla Aï et en fit un tertre permanent[a], une désolation jusqu’à ce jour.
