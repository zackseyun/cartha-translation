  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: fr
  text: Josué brûla Aï et en fit un tertre permanent[a], une désolation jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un tertre éternel ». Le mot hébreu עוֹלָם peut désigner une durée très longue ou indéfinie; il est souvent traduit par « pour toujours » ou « éternel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: brûla
  rationale: Le verbe שׂרף désigne clairement l’action de brûler; le passé simple convient au registre narratif biblique tout en restant naturel.
- source_word: הָעָי
  choice: Aï
  rationale: Nom propre traditionnellement translittéré ainsi en français.
- source_word: וַיְשִׂימֶהָ
  choice: en fit
  rationale: Cette tournure rend naturellement le sens résultatif de שׂים avec le suffixe féminin renvoyant à la ville.
- source_word: תֵּל
  choice: un monceau de ruines
  rationale: תֵּל désigne ici l’amas ou le tertre formé par les vestiges d’une ville détruite; cette expression française communique clairement ce sens sans suggérer un simple tas quelconque.
- source_word: עוֹלָם
  choice: pour toujours
  rationale: Cette expression conserve la force temporelle de עוֹלָם, tout en laissant la note préciser qu’il peut s’agir d’une durée très longue ou indéfinie.
- source_word: שְׁמָמָה
  choice: un lieu dévasté
  rationale: Cette formulation rend la désolation produite par la destruction et fonctionne naturellement comme second prédicat en français.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Équivalent français courant de la formule hébraïque indiquant que cet état persistait à l’époque du narrateur.
