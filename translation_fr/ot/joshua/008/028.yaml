    reason: lexical_alternative
  revision_rationale: La révision rattache explicitement la durée à l’état du tertre, conformément à la syntaxe hébraïque, et rend שְׁמָמָה par « désolation ». Elle maintient le registre narratif et l’ambiguïté temporelle de עוֹלָם grâce à la note.
