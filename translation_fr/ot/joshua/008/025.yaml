source:
  edition: WLC
  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה שְׁנֵ֥ים עָשָׂ֖ר אָ֑לֶף כֹּ֖ל אַנְשֵׁ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: fr
  text: 'Tous ceux qui tombèrent ce jour-là, hommes et femmes, furent au nombre de douze mille : toute la population d’Aï.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les hommes d’Aï » ; cette expression hébraïque peut désigner collectivement toute la population ou tous les habitants de la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: furent au nombre de
  rationale: Dans cette phrase récapitulative, la forme de היה remplit une fonction copulative et introduit le total. « Furent au nombre de » rend naturellement cette valeur en français sans recourir à l’archaïsme « il arriva que ».
- source_word: כָל הַנֹּפְלִים
  choice: tous ceux qui tombèrent
  rationale: Le participe de נפל désigne ici les personnes tombées au combat, donc mortes. Cette formulation conserve l’image hébraïque tout en restant claire dans le contexte.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française courante correspondant directement à l’hébreu.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: hommes et femmes
  rationale: La tournure hébraïque signifie littéralement « depuis l’homme jusqu’à la femme » et exprime ici la totalité des deux groupes. « Hommes et femmes » en restitue naturellement la portée inclusive en français.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: douze mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: toute la population d’Aï
  rationale: אַנְשֵׁי signifie littéralement « hommes de », mais peut désigner collectivement les gens ou habitants d’un lieu. Comme la proposition précédente inclut explicitement hommes et femmes, « toute la population d’Aï » rend ici la référence collective sans contradiction apparente.
theological_decisions:
- issue: Portée du langage genré dans le bilan des morts
  choice: « hommes et femmes » et « toute la population d’Aï »
  alternative: « depuis l’homme jusqu’à la femme » et « tous les hommes d’Aï »
  rationale: Le texte nomme explicitement les deux sexes dans la première expression, puis emploie אַנְשֵׁי הָעָי, formule masculine susceptible d’un sens collectif. Le texte principal exprime donc la portée globale, tandis que la note conserve la forme littérale et l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans rendre la phrase archaïque ; les deux-points marquent clairement l’apposition récapitulative.
