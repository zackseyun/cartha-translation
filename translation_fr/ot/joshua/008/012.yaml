  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: fr
  text: Il prit environ cinq mille hommes[a] et les plaça en embuscade entre Béthel et Aï, à l’ouest de la ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « comme cinq milliers d’hommes » ; le préfixe attaché au nombre marque vraisemblablement l’approximation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « du côté de la mer par rapport à la ville » ; en hébreu, « mer » désigne couramment l’ouest.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Il prit
  rationale: Le verbe לקח signifie ici naturellement « prendre »; le contexte militaire peut impliquer un choix au sein de l’armée, mais le français conserve la simplicité de l’hébreu.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: environ cinq mille hommes
  rationale: Le préfixe כ sur le nombre exprime vraisemblablement l’approximation; אִישׁ s’emploie collectivement après le nombre.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: et les plaça en embuscade
  rationale: שׂים exprime l’action de placer, tandis que אֹרֵב désigne ici une troupe mise en embuscade. Cette formulation est naturelle en français sans préciser davantage la fonction grammaticale du terme.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: entre Béthel et Aï
  rationale: Expression géographique directe; les noms propres suivent leur forme française biblique courante.
- source_word: מִיָּם לָעִיר
  choice: à l’ouest de la ville
  rationale: יָם, littéralement « mer », désigne idiomatiquement l’ouest dans l’orientation géographique hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Placer en embuscade » restitue naturellement le contexte militaire; « à l’ouest » explicite l’idiome géographique hébreu sans alourdir le verset.
