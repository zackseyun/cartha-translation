id: JOS.8.26
reference: Joshua 8:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: fr
  text: Josué ne ramena pas la main qu’il avait tendue avec le javelot, jusqu’à ce qu’il ait voué à la destruction[a] tous les habitants d’Aï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exterminé ». Le verbe hébreu est associé à la mise sous l’interdit, c’est-à-dire au fait de vouer quelqu’un ou quelque chose à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: ne ramena pas
  rationale: Le hifil de שוב signifie ici « faire revenir, ramener ». Avec « la main » comme complément dans cette scène de bataille, « ne ramena pas la main » exprime naturellement en français le maintien du geste.
- source_word: יָדוֹ
  choice: la main
  rationale: Le référent possessif est clairement Josué en français; la tournure « ramener la main » évite une répétition lourde de « sa main » tout en conservant la référence corporelle littérale.
- source_word: נָטָה
  choice: avait tendue
  rationale: Le verbe signifie « étendre, tendre ». Le plus-que-parfait situe l’extension de la main avant son maintien durant l’action.
- source_word: בַּכִּידוֹן
  choice: avec le javelot
  rationale: כידון désigne une arme de type lance ou javelot. « Javelot » conserve le sens probablement spécifique et s’accorde avec le contexte immédiat.
- source_word: הֶחֱרִים
  choice: ait voué à la destruction
  rationale: Le hifil de חרם porte ici le sens technique de placer sous l’interdit en vouant à la destruction. Cette formulation conserve cette nuance sans la réduire au simple fait de tuer.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: tous les habitants d’Aï
  rationale: Rendu direct, naturel et digne de « tous ceux qui habitent Aï ».
- source_word: וִיהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle du nom. La conjonction initiale n’est pas rendue mécaniquement, car le verset s’insère naturellement dans la continuité narrative française.
theological_decisions:
- issue: Rendu de חרם dans un contexte de jugement guerrier
  choice: voué à la destruction tous les habitants d’Aï
  alternative: exterminé tous les habitants d’Aï; placé tous les habitants d’Aï sous l’interdit
  rationale: « Vouer à la destruction » préserve la dimension cultuelle et judiciaire du terme hébreu, tandis que la note donne une formulation plus immédiate. « Placer sous l’interdit » serait plus technique et moins transparent pour le lecteur courant.
translation_notes:
  register: Français international moderne, sobre et narratif. La syntaxe reste proche de l’hébreu tout en étant idiomatique. « Aï » suit la forme française usuelle du toponyme biblique.
