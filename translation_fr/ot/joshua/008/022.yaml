  to: Les autres sortirent de la ville à leur rencontre. Les hommes d’Aï se retrouvèrent ainsi au milieu d’Israël, avec des Israélites d’un côté et d’autres Israélites de l’autre[a]. Israël les frappa jusqu’à ne lui laisser ni survivant ni fuyard[b].
