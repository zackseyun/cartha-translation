base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: fr
  text: Les autres sortirent de la ville à leur rencontre. Les hommes d’Aï se retrouvèrent ainsi au milieu d’Israël, avec des Israélites d’un côté et d’autres Israélites de l’autre[a]. Israël les frappa jusqu’à ne lui laisser ni survivant ni fuyard[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux-ci de ce côté et ceux-là de ce côté »; les hommes d’Aï étaient pris entre deux forces israélites.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu passe ici au singulier : littéralement, « jusqu’à ce qu’il ne lui laisse ni survivant ni fuyard ». Les référents des pronoms restent implicites; le sens est qu’aucun homme d’Aï ne survécut ni ne s’échappa.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Les autres
  rationale: Le démonstratif renvoie au groupe israélite sorti de la ville, distinct de celui qui faisait déjà face aux hommes d’Aï. En français narratif, « les autres » rend naturellement ce contraste contextuel.
- source_word: יָצְאוּ מִן־הָעִיר לִקְרָאתָם
  choice: sortirent de la ville à leur rencontre
  rationale: יצא désigne la sortie de la ville et לִקְרָאתָם le mouvement à la rencontre de l’autre groupe; le contexte militaire indique l’affrontement sans qu’il soit nécessaire de traduire par « contre eux ».
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: Les hommes d’Aï se retrouvèrent ainsi au milieu d’Israël
  rationale: 'La formulation exprime le résultat tactique: les hommes d’Aï sont pris entre les deux forces israélites. « Se retrouvèrent ainsi » communique ce résultat en français naturel.'
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: avec des Israélites d’un côté et d’autres de l’autre
  rationale: Cette expression symétrique décrit les deux côtés de l’encerclement. La traduction garde les deux groupes tout en explicitant sobrement leur identité d’après le contexte.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Israël les frappa
  rationale: נכה, dans un récit de bataille, signifie frapper ou abattre. « Frapper » conserve la formulation martiale sans anticiper sur la proposition suivante, qui précise l’extermination.
- source_word: שָׂרִיד וּפָלִיט
  choice: ni survivant ni fuyard
  rationale: Les deux substantifs distinguent celui qui reste en vie de celui qui parvient à s’échapper. La construction « ni… ni… » restitue naturellement la négation totale en français.
