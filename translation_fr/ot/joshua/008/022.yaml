  verdict: revise
  source_fidelity: La structure tactique et l’issue du combat sont bien rendues. Toutefois, « jusqu’à ne laisser parmi eux » efface dans le texte le singulier inhabituel et les pronoms implicites de l’hébreu (הִשְׁאִיר לוֹ), alors que la note signale précisément ce trait. Une formulation française naturelle peut conserver ce décalage par « ne lui laisser » sans trancher son référent.
  naturalness: Le français est globalement clair et narratif. « d’autres de l’autre » est cependant elliptique de façon un peu heurtée; « d’autres Israélites de l’autre » est plus idiomatique. La conservation de « lui » au dernier membre est volontairement un peu tendue, mais elle est justifiée par la fidélité à l’ambiguïté syntaxique source et explicitée en note.
  terminology: « Aï », « Israël », « survivant » et « fuyard » conviennent. « Les autres » rend de manière naturelle le démonstratif contrastif désignant le second groupe israélite dans le contexte. « Frapper » reste sobre et fidèle au verbe militaire hébreu.
  issues:
