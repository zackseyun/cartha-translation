translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe hébraïque très elliptique est rendue avec des référents suffisamment clairs pour une lecture courante, tandis que la note [b] préserve le changement inhabituel au singulier et son ambiguïté pronominale.
