  text: וְ/יָצְא֣וּ אַחֲרֵ֗י/נוּ עַ֣ד הַתִּיקֵ֤/נוּ אוֹתָ/ם֙ מִן הָ/עִ֔יר כִּ֣י יֹֽאמְר֔וּ נָסִ֣ים לְ/פָנֵ֔י/נוּ כַּ/אֲשֶׁ֖ר בָּ/רִֽאשֹׁנָ֑ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: fr
  text: 'Ils sortiront à notre poursuite jusqu’à ce que nous les ayons éloignés de la ville[a], car ils diront[b] : « Ils fuient devant nous comme la première fois. » Et nous fuirons devant eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « jusqu’à ce que nous les ayons attirés loin de la ville ». Le verbe hébreu signifie tirer ou éloigner ; « attirer » explicite la tactique.'
    reason: lexical_alternative
  - marker: b
    text: « Comme la première fois » renvoie à la précédente retraite d’Israël devant Aï (voir Josué 7.4-5).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: Ils sortiront à notre poursuite
  rationale: Le futur convient au plan exposé par Josué. « À notre poursuite » exprime naturellement en français le sens militaire de אַחֲרֵינוּ sans ajouter d’idée étrangère au contexte.
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: jusqu’à ce que nous les ayons éloignés de la ville
  rationale: Le hiphil de נתק signifie faire partir, tirer ou éloigner. Cette formulation conserve l’action causative et la tactique sans rendre explicite, comme le ferait « attirer », une nuance seulement implicite.
- source_word: כִּי יֹאמְרוּ
  choice: car ils se diront
  rationale: כִּי introduit la raison pour laquelle la manœuvre réussira. Dans ce contexte de supposition collective, le français idiomatique « ils se diront » restitue naturellement leur raisonnement, bien que l’hébreu dise littéralement « ils diront ».
- source_word: נָסִים לְפָנֵינוּ
  choice: Ils fuient devant nous
  rationale: Le participe נָסִים présente l’action en cours. « Fuir devant » conserve l’expression militaire et prépare le parallélisme avec la dernière proposition.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: comme la première fois
  rationale: Cette expression renvoie précisément à la première retraite d’Israël devant Aï, plutôt qu’à une simple répétition indéfinie.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: Et nous fuirons devant eux
  rationale: Dans l’énoncé du plan, la forme verbale a une valeur prospective. La répétition de « fuir devant » maintient le parallélisme voulu avec les paroles prêtées aux hommes d’Aï.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire militaire reste accessible ; le parallélisme de l’hébreu est conservé par la répétition de « fuir devant ». Les deux marqueurs de note figurent dans le texte.
