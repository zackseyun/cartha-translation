source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: fr
  text: Lorsque Israël eut achevé de tuer tous les habitants d’Aï dans la campagne, dans le désert où ils les avaient poursuivis, et qu’ils furent tous tombés sous le tranchant de l’épée, sans qu’il en reste aucun[a], tout Israël revint à Aï et la frappa du tranchant de l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu exprime l’achèvement complet : « jusqu’à leur fin » ou « jusqu’à ce qu’ils soient exterminés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Quand … eut achevé
  rationale: La construction temporelle introduit l’action préalable à la suite du récit. Le passé antérieur exprime naturellement cette succession en français soutenu sans reproduire lourdement le marqueur narratif וַיְהִי.
- source_word: לַהֲרֹג
  choice: de tuer
  rationale: Le verbe הרג signifie explicitement « tuer ». Cette traduction directe ne minimise pas la violence du récit.
- source_word: יֹשְׁבֵי הָעַי
  choice: les habitants d’Aï
  rationale: Le participe substantivé de ישב désigne ceux qui habitent la ville.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שדה désigne ici l’espace extérieur à la ville, terrain de l’affrontement. « Campagne » rend ce contraste sans préciser indûment qu’il s’agissait d’un champ cultivé.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מדבר désigne une région non cultivée ou peu habitée. « Désert » est idiomatique en français biblique moderne et ne suppose pas nécessairement une étendue de sable.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: où ils les avaient poursuivis
  rationale: Le relatif renvoie au lieu de la poursuite; le plus-que-parfait marque l’antériorité de celle-ci.
- source_word: וַיִּפְּלוּ כֻלָּם
  choice: et que tous furent tombés
  rationale: Dans un contexte militaire, נפל signifie tomber au combat. La tournure conserve le lien syntaxique avec la proposition temporelle.
- source_word: לְפִי חֶרֶב
  choice: sous le tranchant de l’épée / du tranchant de l’épée
  rationale: L’expression hébraïque signifie littéralement « à la bouche de l’épée ». « Tranchant de l’épée » en restitue l’image traditionnelle et demeure compréhensible.
- source_word: עַד תֻּמָּם
  choice: jusqu’à leur anéantissement
  rationale: La formule exprime l’achèvement total de la mise à mort du groupe poursuivi. « Anéantissement » en rend la force dans un registre digne; une note conserve l’ambiguïté lexicale entre achèvement, disparition et destruction.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: tout Israël revint à Aï
  rationale: שוב suivi d’une destination indique le retour; l’ordre français reste naturel tout en conservant le sujet collectif.
- source_word: וַיַּכּוּ אֹתָהּ
  choice: et la frappa
  rationale: Le pronom féminin singulier a pour antécédent la ville d’Aï. La traduction conserve cet objet grammatical sans ajouter explicitement « ses habitants ».
theological_decisions:
- issue: Rendre un récit de guerre et de destruction sans en atténuer ni en amplifier la portée
  choice: Conserver les termes explicites « tuer », « tombés » et « anéantissement »
  alternative: Employer des formulations atténuées comme « vaincre », ou ajouter que l’action constituait un jugement divin
  rationale: Le verset décrit sans détour une mise à mort complète. La traduction doit en préserver la dureté, sans ajouter une justification théologique absente de ce verset.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé antérieur convient à la séquence temporelle dans un récit écrit. La formulation reste explicite sur la violence et évite aussi bien l’euphémisme que l’expansion interprétative.
