  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: fr
  text: Lorsque le roi d’Aï vit cela, les hommes de la ville se hâtèrent, se levèrent de bon matin et sortirent à la rencontre d’Israël pour livrer bataille, lui et tout son peuple, au lieu fixé[a], devant l’Araba[b]. Mais il ne savait pas qu’une embuscade était postée contre lui derrière la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moment fixé ». Le mot hébreu peut désigner un lieu ou un moment convenu.
    reason: ambiguïté lexicale et syntaxique
  - marker: b
    text: Ou « devant la plaine désertique ». Le terme hébreu peut désigner l’Araba en tant que région géographique ou, plus généralement, une plaine aride ou une steppe.
    reason: alternative lexicale et géographique
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Lorsque ... vit cela
  rationale: La construction introduit la circonstance temporelle du nouvel épisode. En français narratif moderne, « Lorsque » rend naturellement l’enchaînement sans reproduire lourdement la formule hébraïque; « cela » explicite l’objet sous-entendu de la vision.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: les hommes de la ville se dépêchèrent, se levèrent de bon matin
  rationale: Les deux verbes sont au pluriel; leur sujet est précisé par la proposition suivante. L’antéposer évite un pronom français sans antécédent clair tout en conservant la rapidité et le départ matinal.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: à la rencontre d’Israël pour livrer bataille
  rationale: « À la rencontre de » respecte le sens directionnel de לִקְרַאת, tandis que « pour livrer bataille » explicite, comme l’hébreu, le caractère hostile de la rencontre.
- source_word: הוּא וְכָל עַמּוֹ
  choice: Le roi et tout son peuple
  rationale: Le pronom masculin renvoie au roi d’Aï. « Peuple » conserve le terme général עַם sans le réduire explicitement à une armée.
- source_word: לַמּוֹעֵד
  choice: au lieu fixé
  rationale: מוֹעֵד peut désigner un temps ou un lieu convenu. Le contexte de déplacement et la précision géographique qui suit favorisent ici le sens spatial, sans éliminer l’autre possibilité, signalée en note.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: en face de l’Araba
  rationale: לִפְנֵי indique une position devant ou en face de. « Araba » conserve le possible nom géographique; le sens générique « plaine désertique » est indiqué en note.
- source_word: אֹרֵב לוֹ
  choice: une embuscade était postée contre lui
  rationale: Le participe אֹרֵב évoque des hommes placés en embuscade. Cette formulation française garde l’image d’un dispositif hostile déjà en position sans préciser indûment son effectif.
