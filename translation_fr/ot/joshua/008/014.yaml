  to: Lorsque le roi d’Aï vit cela, les hommes de la ville se hâtèrent, se levèrent de bon matin et sortirent à la rencontre d’Israël pour livrer bataille, lui et tout son peuple, au lieu fixé[a], devant l’Araba[b]. Mais il ne savait pas qu’une embuscade était postée contre lui derrière la ville.
  rationale: La révision rétablit dans une seule action la sortie des hommes de la ville et la participation du roi avec tout son peuple, conformément à la syntaxe et à la portée de l’hébreu. Elle préserve l’ambiguïté de מוֹעֵד dans la note et corrige la note sur עֲרָבָה afin de maintenir la relation spatiale du texte source.
