base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: fr
  text: Il ne resta à Aï ni à Béthel un seul homme qui ne soit sorti à la poursuite d’Israël[a]. Ils laissèrent la ville ouverte[b] et poursuivirent Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « un seul homme » traduit אִישׁ, forme masculine singulière employée ici de façon générique pour désigner toute personne qui aurait pu rester sur place.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de manière plus explicite : « sans défense ». L’hébreu dit littéralement : « ouverte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: il ne resta pas un seul homme
  rationale: Cette formulation conserve le singulier masculin אִישׁ et l’idée de « rester », tout en exprimant naturellement en français qu’aucun homme n’est demeuré sur place.
- source_word: בָּעַי וּבֵית אֵל
  choice: à Aï ou à Béthel
  rationale: Dans une proposition négative, « ou » indique naturellement que personne ne resta dans l’une ni dans l’autre ville.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: qui ne soit sorti à la poursuite d’Israël
  rationale: Le subjonctif s’intègre à la tournure négative française, tandis que « à la poursuite de » rend clairement l’expression directionnelle אַחֲרֵי dans ce contexte militaire.
- source_word: וַיַּעַזְבוּ
  choice: ils laissèrent
  rationale: Le verbe « laisser » rend simplement עזב dans le récit sans ajouter la nuance plus forte d’un abandon définitif.
- source_word: הָעִיר פְּתוּחָה
  choice: la ville ouverte
  rationale: La traduction garde l’image concrète de l’hébreu, même si, dans le contexte, elle signifie que la ville était exposée ou sans défense.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: et poursuivirent Israël
  rationale: « Poursuivre » rend avec précision רדף dans un récit militaire; la préposition « après » serait superflue en français.
