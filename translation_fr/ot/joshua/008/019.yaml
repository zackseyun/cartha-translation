  text: וְ/הָ/אוֹרֵ֡ב קָם֩ מְהֵרָ֨ה מִ/מְּקוֹמ֤/וֹ וַ/יָּר֨וּצוּ֙ כִּ/נְט֣וֹת יָד֔/וֹ וַ/יָּבֹ֥אוּ הָ/עִ֖יר וַֽ/יִּלְכְּד֑וּ/הָ וַֽ/יְמַהֲר֔וּ וַ/יַּצִּ֥יתוּ אֶת הָ/עִ֖יר בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: fr
  text: Ceux qui étaient en embuscade se levèrent rapidement de leur position et coururent dès qu’il tendit la main[a]. Ils entrèrent dans la ville, s’en emparèrent et se hâtèrent d’y mettre le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsqu’il tendit la main ». La construction hébraïque situe leur action au moment du signal et peut être rendue avec ou sans insistance sur son immédiateté.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: ceux qui étaient en embuscade
  rationale: Le participe substantivé désigne collectivement les hommes placés en embuscade. Cette formulation française rend clairement les personnes concernées et s’accorde naturellement avec les verbes suivants au pluriel.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: se levèrent rapidement de leur position
  rationale: קום décrit ici la mise en mouvement de la troupe jusque-là dissimulée, et מְהֵרָה en souligne la rapidité. Le singulier collectif hébreu est rendu au pluriel conformément au choix « ceux qui ».
- source_word: וַיָּר֨וּצוּ֙
  choice: coururent
  rationale: Le verbe exprime simplement l’action de courir; ce choix conserve le rythme direct du récit sans ajouter l’idée plus interprétative de se précipiter.
- source_word: כִּנְטוֹת יָדוֹ
  choice: dès qu’il tendit la main
  rationale: La construction infinitive avec כ est temporelle et peut marquer la réaction immédiate au signal. « Dès que » exprime naturellement cette immédiateté, tandis que le pronom reste aussi implicite dans son référent que dans l’hébreu immédiat.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: Ils entrèrent dans la ville
  rationale: Avec une destination, בוא signifie ici pénétrer dans la ville. « Entrer dans » est l’expression idiomatique courante en français.
- source_word: וַיִּלְכְּדוּהָ
  choice: s’en emparèrent
  rationale: לכד désigne la prise militaire d’une ville. Le pronom « en » reprend naturellement « la ville » en français et évite une répétition lourde.
- source_word: וַיְמַהֲרוּ
  choice: se hâtèrent
  rationale: Le verbe souligne qu’ils accomplirent sans délai l’action suivante. La tournure verbale conserve explicitement cette nuance de hâte.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: d’y mettre le feu
  rationale: Le hifil de יצת signifie allumer ou mettre le feu. Cette expression française actuelle et idiomatique conserve la valeur causative; « y » renvoie sans ambiguïté à la ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le choix « ceux qui étaient en embuscade » explicite la valeur personnelle du collectif hébreu sans ajouter de détail militaire absent du texte. Les passés simples maintiennent le rythme soutenu du récit historique.
