  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: fr
  text: 'Il leur donna cet ordre : « Voyez : vous allez vous mettre en embuscade contre la ville, derrière elle. Ne vous éloignez pas trop de la ville, et tenez-vous tous prêts. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: Voyez
  rationale: L’impératif attire l’attention sur les instructions qui suivent ; « Voyez » en conserve directement la force sans ajouter une idée absente du texte.
- source_word: אֹרְבִים
  choice: vous allez vous mettre en embuscade
  rationale: Le participe décrit ici le rôle assigné aux hommes ; cette tournure est naturelle en français et explicite l’action militaire.
- source_word: מֵאַחֲרֵי הָעִיר
  choice: derrière elle
  rationale: Le pronom évite une répétition lourde tout en gardant clairement la ville comme référent.
- source_word: נְכֹנִים
  choice: prêts
  rationale: Dans ce contexte militaire, le terme indique qu’ils doivent être préparés à agir.
