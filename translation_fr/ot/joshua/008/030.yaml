  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: fr
  text: Alors Josué bâtit un autel à Yahvé[a], le Dieu d’Israël, sur le mont Ébal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme du texte source et l’autre convention majeure de traduction sans alourdir le verset.
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession temporelle dans le récit; « Alors » est naturel en français et conserve l’enchaînement narratif.
- source_word: יִבְנֶה
  choice: bâtit
  rationale: Bien que la forme soit morphologiquement un inaccompli, après אָז elle a ici une valeur narrative passée; le passé simple convient au registre narratif biblique en français.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: מִזְבֵּחַ
  choice: un autel
  rationale: Désigne un autel sacrificiel; l’article indéfini convient à cette première mention dans la scène.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La préposition ל indique ici la destination ou la consécration de l’autel. « À Yahvé » est concis et conserve le nom divin.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite et maintient l’apposition qui identifie Yahvé comme le Dieu d’Israël.
- source_word: בְּהַר עֵיבָל
  choice: sur le mont Ébal
  rationale: Indique le lieu où l’autel fut construit; « sur le mont Ébal » est l’expression française idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » le rend comme un nom propre en français, tandis que la note signale la forme hébraïque et l’usage traditionnel concurrent.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient une narration biblique soutenue mais courante à l’écrit; les noms propres suivent leurs formes françaises usuelles.
