base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: fr
  text: 'Alors les hommes d’Aï se retournèrent et regardèrent derrière eux : voici que la fumée de la ville montait vers le ciel[a]. Ils ne pouvaient fuir ni d’un côté ni de l’autre[b]. Quant au peuple qui avait fui vers le désert, il se retourna contre ceux qui le poursuivaient[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « montait en direction du ciel ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « il n’y avait pas de mains en eux », expression signifiant qu’ils n’avaient aucun pouvoir ni aucune possibilité d’agir.'
    reason: cultural_note
  - marker: c
    text: L’hébreu porte le singulier « celui qui poursuivait », probablement employé dans un sens collectif pour désigner les poursuivants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ
  choice: les hommes d’Aï se retournèrent et regardèrent derrière eux
  rationale: La formulation distingue le changement d’orientation exprimé par פנה de l’acte de regarder exprimé par ראה, tout en donnant naturellement à אַחֲרֵיהֶם son sens spatial.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française actuelle conserve la fonction présentative du marqueur hébreu, qui attire l’attention sur une découverte soudaine.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: la fumée de la ville montait vers le ciel
  rationale: L’imparfait rend la scène en cours, tandis que « vers le ciel » traduit la direction indiquée par le suffixe directionnel sans imposer ici un sens théologique.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: ils n’avaient aucun moyen
  rationale: L’expression hébraïque, littéralement liée aux « mains », est un idiome d’incapacité. « Aucun moyen » transmet clairement l’impossibilité d’agir dans ce contexte.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: de fuir ni d’un côté ni de l’autre
  rationale: Cette expression idiomatique française restitue la paire directionnelle hébraïque et souligne qu’aucune voie de fuite ne restait ouverte.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: le peuple qui avait fui vers le désert
  rationale: Le plus-que-parfait situe cette fuite avant le retournement tactique raconté dans la proposition principale.
- source_word: נֶהְפַּךְ אֶל הָרוֹדֵף
  choice: se retourna contre ceux qui le poursuivaient
  rationale: « Se retourna contre » exprime la volte-face hostile. Le singulier collectif הָרוֹדֵף est rendu au pluriel en français naturel, sans changer son référent collectif.
theological_decisions: []
