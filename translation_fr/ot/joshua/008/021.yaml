base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: fr
  text: Lorsque Josué et tout Israël virent que le groupe en embuscade[a] s’était emparé de la ville et que la fumée de la ville s’était élevée, ils firent demi-tour et abattirent les hommes d’Aï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui étaient en embuscade ».
    reason: Alternative lexicale explicitant autrement le participe hébreu substantivé et collectif.
lexical_decisions:
- source_word: רָאוּ
  choice: virent
  rationale: Le verbe exprime ici une perception concrète; les deux propositions introduites par כִּי précisent ce que Josué et Israël constatèrent.
- source_word: כִּי ... וְכִי
  choice: que… et que
  rationale: Les conjonctions introduisent le contenu de ce que Josué et tout Israël virent; cette construction est naturelle en français.
- source_word: לָכַד
  choice: s’était emparé de
  rationale: Le plus-que-parfait marque une prise de la ville déjà accomplie au moment où Josué et Israël la constatent.
- source_word: הָאֹרֵב
  choice: le groupe embusqué
  rationale: Le participe substantivé au singulier désigne collectivement les hommes placés en embuscade. Cette formulation rend le référent humain explicite sans le réduire à un seul individu.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: la fumée de la ville montait
  rationale: Cette formulation conserve l’image hébraïque du mouvement ascendant de la fumée tout en restant idiomatique en français narratif.
- source_word: וַיָּשֻׁבוּ
  choice: ils firent demi-tour
  rationale: Dans ce contexte militaire, le verbe indique qu’ils inversèrent leur direction pour reprendre le combat.
- source_word: וַיַּכּוּ
  choice: abattirent
  rationale: Le verbe נכה désigne une action violente contre l’ennemi et implique fréquemment une mise à mort dans les récits de guerre; « abattirent » préserve cette force martiale.
- source_word: אַנְשֵׁי הָעָי
  choice: les hommes d’Aï
  rationale: La locution signifie littéralement « les hommes d’Aï »; le contexte ne justifie pas de la restreindre à « guerriers » ni de la généraliser en « habitants ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Groupe embusqué » est clair pour un lectorat général; « firent demi-tour » exprime naturellement le retournement tactique, et « abattirent » conserve la vigueur du récit de bataille.
