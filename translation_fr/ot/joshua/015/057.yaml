source:
  edition: WLC
  text: הַ/קַּ֖יִן גִּבְעָ֣ה וְ/תִמְנָ֑ה עָרִ֥ים עֶ֖שֶׂר וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/057.yaml
  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
translation:
  language: fr
  text: 'Haqqaïn, Guibéa et Timna : dix villes avec les localités qui en dépendaient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקַּיִן
  choice: Haqqaïn
  rationale: Nom de lieu dans une liste territoriale. La translittération conserve l’article hébreu préfixé comme partie de la forme du toponyme et rend la consonne redoublée, tout en employant le tréma pour distinguer les voyelles.
- source_word: גִּבְעָה
  choice: Guibéa
  rationale: Dans cette liste de villes, le mot est un toponyme et non le nom commun « colline » ; la forme française traditionnelle et intelligible est retenue.
- source_word: תִמְנָה
  choice: Timna
  rationale: Le nom de lieu est translittéré selon une forme naturelle en français, sans ajouter un h final qui ne se prononcerait pas.
- source_word: עָרִים עֶשֶׂר
  choice: dix villes
  rationale: Cette expression constitue la formule récapitulative habituelle des listes territoriales ; « villes » rend clairement עָרִים.
- source_word: חַצְרֵיהֶן
  choice: les localités qui en dépendaient
  rationale: Le terme désigne ici les agglomérations secondaires rattachées aux villes nommées. Cette formulation française explicite la relation de dépendance sans imposer la catégorie plus étroite de « villages ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les toponymes sont translittérés plutôt que traduits. La tournure « qui en dépendaient » restitue naturellement le statut des établissements satellites dans une liste territoriale.
