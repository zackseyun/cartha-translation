lexical_decisions:
- source_word: דַנָּה
  choice: Danna
  rationale: Nom de lieu transcrit en français, sans traduire le toponyme.
- source_word: קִרְיַת סַנָּה
  choice: Qiryath-Sanna
  rationale: Nom de lieu composé transcrit comme une unité; « Qiryath » conserve la forme toponymique hébraïque plutôt que de la rendre par « ville de ».
- source_word: הִיא
  choice: c’est-à-dire
  rationale: Dans cette identification appositionnelle, cette formule française exprime naturellement l’équivalence entre les deux noms de lieu.
- source_word: דְבִר
  choice: Debir
  rationale: Nom propre transcrit; il désigne ici le même lieu que Qiryath-Sanna.
- source_word: וְ
  choice: et
  rationale: La conjonction est conservée afin de respecter la structure de l’énumération.
