lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hatsar-Shoual
  rationale: Le nom de lieu est translittéré dans une forme adaptée à la lecture française plutôt que traduit par « village du renard »; cette option convient au contexte d’une liste de villes.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-Shéba
  rationale: Forme française courante du toponyme biblique. Le nom est conservé comme toponyme, tandis que son jeu étymologique possible est signalé en note.
- source_word: בִּזְיוֹתְיָה
  choice: Biziotia
  rationale: La dérivation du nom étant incertaine, une translittération lisible en français est préférable à une traduction conjecturale.
- source_word: וַ / וּ
  choice: virgules et « et »
  rationale: Les conjonctions hébraïques relient les éléments de la liste; le français naturel emploie des virgules et « et » avant le dernier nom.
