  text: Hatsar-Shoual, Beer-Shéba[a] et Biziotia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Beer-Shéba peut évoquer en hébreu le « puits des sept » et, par jeu de mots, le « puits du serment ».
