  text: 'In the wilderness: Beth-arabah[a], Middin[b], and Secacah.'
translation:
  language: fr
  text: 'Dans le désert[a] : Beth-Araba[b], Middîn et Sekaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la région désertique ». Le mot hébreu מִדְבָּר peut désigner une étendue aride ou un territoire peu habité servant parfois de pâturage.
    reason: lexical_alternative
  - marker: b
    text: Nom de lieu qui signifie littéralement « maison de l’Araba ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: Dans le désert
  rationale: La préposition בְּ avec l’article introduit la sous-région où se trouvent les villes énumérées. Dans ce contexte judéen, « désert » désigne une région aride et peu habitée, sans nécessairement évoquer une étendue entièrement dépourvue de végétation.
- source_word: בֵּית הָעֲרָבָה
  choice: Beth-Araba
  rationale: Il s’agit d’un nom de lieu. La forme française translittérée conserve les éléments du nom hébreu plutôt que d’en donner une traduction dans le corps du texte.
- source_word: מִדִּין
  choice: Middîn
  rationale: Nom de lieu translittéré selon un usage français lisible, avec maintien du redoublement consonantique et indication de la voyelle longue.
- source_word: וּסְכָכָה
  choice: et Sekaka
  rationale: Le וּ initial est rendu par « et »; le nom propre est translittéré sous une forme naturelle en français.
