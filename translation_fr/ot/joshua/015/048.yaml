  text: 'In the hill country: Shamir[a], Jattir[c][b], and Socoh.'
translation:
  language: fr
  text: 'Dans la région montagneuse[a] : Shamir, Yattir[b] et Soko[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et dans la région montagneuse » ; la conjonction initiale rattache ce verset à la liste de villes qui précède.'
