lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: Dans la région montagneuse
  rationale: Le syntagme signifie littéralement « et dans la montagne/région montagneuse ». Dans cette liste de villes, « région montagneuse » désigne naturellement les hautes terres de Juda; la conjonction initiale, qui rattache le verset à la liste précédente, n’est pas reproduite dans le corps du texte.
- source_word: שָׁמִיר
  choice: Shamir
  rationale: Nom de lieu translittéré; cette forme représente naturellement l’hébreu שָׁמִיר en français.
- source_word: וְ/יַתִּיר
  choice: Yattir
  rationale: Nom de lieu translittéré selon la valeur consonantique de l’initiale hébraïque; la conjonction est rendue par la syntaxe de l’énumération.
- source_word: וְ/שׂוֹכֹה
  choice: Soko
  rationale: Nom de lieu translittéré en français; « k » rend sans ambiguïté le son de la lettre כ, et la conjonction est exprimée par « et ».
