lexical_decisions:
- source_word: מָעוֹן
  choice: Maon
  rationale: Nom propre d’une ville dans une liste de localités. La forme française traditionnelle « Maon » est retenue plutôt qu’une traduction du nom commun pouvant signifier « demeure ».
- source_word: כַּרְמֶל
  choice: Carmel
  rationale: Nom propre désignant ici la ville judéenne; la forme française usuelle « Carmel » est conservée, sans traduire le sens lexical possible du terme.
- source_word: וָזִיף
  choice: Zif
  rationale: Le ו conjonctif relie ce nom à la liste. « Zif » est la graphie française biblique usuelle du toponyme זִיף; en français, la coordination finale seule reçoit normalement « et ».
- source_word: וְיוּטָּה
  choice: et Youtta
  rationale: Le ו est rendu par « et ». « Youtta » représente naturellement en français le toponyme יוּטָּה tout en restant proche de sa prononciation hébraïque.
