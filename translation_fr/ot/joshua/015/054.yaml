base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: fr
  text: 'Houmta, Qiryath-Arba (c’est Hébron)[a] et Tsior : neuf villes avec leurs localités.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Qiryath-Arba, elle est Hébron » ; il identifie ainsi Qiryath-Arba à Hébron.'
    reason: cross_reference
  - marker: b
    text: Ou « leurs villages ». Le terme hébreu peut désigner de petites localités rattachées aux villes mentionnées.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: Houmta
  rationale: Nom de lieu transcrit sous une forme naturelle en français moderne.
- source_word: קִרְיַת אַרְבַּע
  choice: Qiryath-Arba
  rationale: Le composé fonctionne ici comme un toponyme établi; il est donc transcrit plutôt que traduit par « ville d’Arba ».
- source_word: הִיא חֶבְרוֹן
  choice: c’est Hébron
  rationale: Cette formulation rend directement l’identification appositionnelle du nom ancien avec Hébron.
- source_word: צִיעֹר
  choice: Tsior
  rationale: Nom de lieu transcrit conformément à sa prononciation hébraïque approximative et aux usages français.
- source_word: עָרִים תֵּשַׁע
  choice: neuf villes
  rationale: Traduction conventionnelle et naturelle dans cette liste territoriale.
- source_word: חַצְרֵיהֶן
  choice: les localités qui en dépendaient
  rationale: Le terme désigne ici des lieux habités secondaires rattachés aux villes énumérées, sans imposer qu’il s’agisse précisément de villages ou de hameaux.
