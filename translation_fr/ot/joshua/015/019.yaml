base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: fr
  text: 'Elle dit : « Je t’en prie, accorde-moi une bénédiction[a]. Puisque tu m’as donné une terre dans le Néguev[b], donne-moi aussi des sources d’eau[c]. » Il lui donna donc les sources d’en haut et les sources d’en bas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cadeau ». L’hébreu dit littéralement « une bénédiction » et emploie ce mot pour désigner ici un bienfait concret accordé.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi signifier « le Sud », « la région méridionale » ou « la région aride ».
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut désigner des sources, des bassins ou des réservoirs d’eau; « sources » convient le mieux au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: une bénédiction
  rationale: Le nom signifie normalement « bénédiction », mais désigne ici un bienfait concret accordé par le père. Ce choix conserve la formulation hébraïque tout en restant intelligible; « un cadeau » serait plus interprétatif.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: une terre dans le Néguev
  rationale: נֶגֶב peut désigner le sud, une région aride, ou plus précisément le Néguev. Dans ce contexte territorial, le nom géographique est naturel; « dans le Néguev » exprime clairement la localisation sans effacer l’ambiguïté signalée en note.
- source_word: גֻּלֹּת מָיִם
  choice: des sources d’eau
  rationale: Le sens précis de גֻּלֹּת est discuté et peut évoquer des sources, des bassins ou des réservoirs. Ici, des points d’eau liés à la propriété sont en vue; « sources d’eau » convient au contexte et permet de rendre naturellement le contraste entre celles d’en haut et celles d’en bas.
- source_word: תְּנָה
  choice: Je t’en prie, accorde-moi
  rationale: L’impératif demande l’octroi d’un bienfait. « Je t’en prie » rend la valeur polie de la requête, tandis qu’« accorde-moi » s’accorde naturellement avec « une bénédiction ».
- source_word: וְנָתַתָּה לִי
  choice: donne-moi aussi
  rationale: La conjonction introduit une demande supplémentaire. « Aussi » explicite avec naturel que les points d’eau sont demandés en complément de la terre déjà reçue.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: les sources d’en haut
  rationale: Cette formulation rend la position supérieure indiquée par עִלִּיּוֹת et reste naturelle en français, sans imposer une interprétation technique du relief.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: les sources d’en bas
  rationale: Le choix maintient le parallélisme avec « les sources d’en haut » et rend la position inférieure exprimée par תַּחְתִּיּוֹת.
- source_word: וַיִּתֶּן לָהּ
  choice: Il lui donna donc
  rationale: Le waw narratif fait progresser le récit, et « donc » fait ressortir naturellement que le don répond à sa demande.
theological_decisions: []
