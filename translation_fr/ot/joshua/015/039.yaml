lexical_decisions:
- source_word: לָכִישׁ
  choice: Lakish
  rationale: Nom de lieu translittéré selon une forme française courante, qui rend la consonne finale שׁ par « sh ».
- source_word: בָצְקַת
  choice: Botsqath
  rationale: Nom de ville translittéré dans une forme française reconnaissable; « ts » représente צ et « q » représente ק.
- source_word: עֶגְלוֹן
  choice: Églon
  rationale: Forme française traditionnelle du nom de cette ville; dans ce contexte, il s’agit du lieu et non du roi moabite portant le même nom.
- source_word: וּ / וְ
  choice: et
  rationale: Les conjonctions préfixées relient les trois noms dans une simple liste; la ponctuation française moderne suffit à exprimer la coordination.
