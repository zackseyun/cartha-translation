lexical_decisions:
- source_word: מֵעֶקְרוֹן וָיָמָּה
  choice: depuis Éqrôn vers l’ouest
  rationale: יָמָּה signifie littéralement « vers la mer », mais désigne ici naturellement l’ouest dans le contexte géographique.
- source_word: עַל יַד אַשְׁדּוֹד
  choice: aux abords d’Ashdod
  rationale: L’expression עַל יַד signifie littéralement « à côté de » et désigne ici le territoire situé près d’Ashdod.
- source_word: וְחַצְרֵיהֶן
  choice: avec leurs villages
  rationale: חֲצֵרִים désigne dans les listes territoriales des villages ou établissements dépendants; le suffixe féminin pluriel est rendu par « leurs » sans expliciter un antécédent que le verset laisse implicite.
