base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: fr
  text: Les villes situées à l’extrémité du territoire de la tribu des fils de Juda[a], du côté de la frontière d’Édom, dans le Néguev[b], étaient Qabtséel, Éder et Yagour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se traduire par « à l’extrémité de la tribu des fils de Juda » ; elle désigne la bordure extérieure du territoire de Juda.
    reason: lexical_alternative
  - marker: b
    text: « Néguev » peut aussi se traduire par « sud » ou « région du sud ». Ici, le mot désigne probablement la région méridionale de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: Les villes… étaient
  rationale: Cette tournure conserve la structure de la proposition hébraïque tout en introduisant naturellement l’énumération en français.
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: situées à l’extrémité du territoire de la tribu des fils de Juda
  rationale: מִקְצֵה désigne ici une extrémité ou une bordure. L’ajout explicatif de « territoire » rend clairement le sens géographique de l’expression sans changer son référent; « fils de Juda » conserve la désignation tribale hébraïque.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: du côté de la frontière d’Édom
  rationale: Cette formulation exprime l’orientation vers la frontière indiquée par אֶל, sans affirmer plus précisément que le texte que toutes les villes la touchaient directement.
- source_word: בַּנֶּגְבָּה
  choice: dans le Néguev
  rationale: Dans cette description territoriale, le terme désigne vraisemblablement la région méridionale connue sous le nom de Néguev, tout en pouvant aussi avoir le sens général de « sud ».
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: Qabseel, Éder et Yagour
  rationale: Les noms de lieux sont translittérés selon des conventions françaises lisibles, en représentant notamment le yod initial de יָגוּר par « Y ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu, tandis que « territoire » explicite le sens géographique implicite et que les noms propres suivent une translittération française.
