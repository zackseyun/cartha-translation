id: JOS.15.17
reference: Joshua 15:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ֛/הּ עָתְנִיאֵ֥ל בֶּן קְנַ֖ז אֲחִ֣י כָלֵ֑ב וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: fr
  text: Otniel, fils de Qenaz, frère de Caleb[a], s’en empara[b]. Alors Caleb lui donna pour femme sa fille Aksa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « frère de Caleb ». Elle peut, dans cette construction, qualifier Otniel ou Qenaz; de plus, le mot « frère » peut parfois désigner plus largement un proche parent.
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: Il s’agit de la ville de Qiryath-Sépher, appelée aussi Debir, mentionnée au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: s’en empara
  rationale: Le verbe לכד exprime la prise ou la conquête. Le pronom féminin renvoie à la ville mentionnée au verset précédent. « S’en empara » est naturel en français et conserve le sens militaire.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Translittération française usuelle du nom propre.
- source_word: בֶּן קְנַז
  choice: fils de Qenaz
  rationale: Rend directement la relation filiale exprimée par בֶּן.
- source_word: אֲחִי כָלֵב
  choice: frère de Caleb
  rationale: C’est le sens le plus direct de l’expression hébraïque. La formulation française conserve aussi l’ambiguïté syntaxique quant à savoir si elle qualifie Otniel ou Qenaz.
- source_word: וַיִּתֶּן לוֹ
  choice: Alors Caleb lui donna
  rationale: Le sujet implicite est Caleb, d’après le contexte précédent, et le bénéficiaire est Otniel. Répéter « Caleb » lève une ambiguïté pronominale qui serait peu naturelle en français sans ajouter d’information au récit.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: sa fille Aksa
  rationale: L’ordre des mots est adapté au français tout en conservant le nom et la relation familiale.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Expression française naturelle correspondant à l’idiome hébreu qui signifie donner une femme en mariage.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « S’en empara » évite de répéter le nom de la ville tout en rendant clairement la conquête. La ponctuation ne tranche pas l’ambiguïté d’attachement de « frère de Caleb »; celle-ci est explicitée en note.
