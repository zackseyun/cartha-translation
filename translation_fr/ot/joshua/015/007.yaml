  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: fr
  text: La frontière montait de la vallée d’Akor vers Debir, puis elle tournait vers le nord en direction de Guilgal[a], qui se trouve en face de la montée d’Adoummim, laquelle est au sud du torrent[b]. La frontière passait ensuite jusqu’aux eaux d’En-Shémesh et aboutissait à En-Roguel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à Guilgal » ; l’hébreu peut indiquer soit une orientation vers ce lieu, soit un déplacement qui y aboutit.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner un cours d’eau, souvent saisonnier, ainsi que son lit ou le ravin où il coule.
    reason: cultural_note
  - marker: c
    text: Littéralement « ses issues étaient vers En-Roguel » ; l’hébreu emploie une forme plurielle pour désigner l’aboutissement de la frontière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: La frontière montait
  rationale: Dans les descriptions de frontières, עלה indique que la ligne progresse en montant, probablement selon le relief. L’imparfait français convient à la description suivie du tracé.
- source_word: דְּבִרָה מֵעֵמֶק עָכוֹר
  choice: de la vallée d’Akor vers Debir
  rationale: Le hé directionnel attaché à Debir exprime un mouvement vers ce lieu. L’ordre français clarifie le point de départ et la direction sans modifier le sens.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: puis elle tournait vers le nord
  rationale: פנה associé à une direction décrit ici l’orientation nouvelle de la frontière. « Tournait vers le nord » est naturel dans un relevé topographique.
- source_word: אֶל הַגִּלְגָּל
  choice: en direction de Guilgal
  rationale: אל peut signaler soit l’orientation vers le site, soit le mouvement jusqu’à lui. Le texte principal retient l’orientation, tout en conservant l’autre possibilité en note.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: qui se trouve en face de la montée d’Adoummim
  rationale: נכח signifie « en face de » ou « vis-à-vis de », et מעלה désigne une montée topographique. Cette formulation préserve les rapports géographiques.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: au sud du torrent
  rationale: נגב est ici un repère directionnel. נחל désigne un cours d’eau ou son lit, souvent saisonnier; « torrent » est idiomatique en français biblique moderne sans suggérer un fleuve permanent.
- source_word: וְעָבַר הַגְּבוּל
  choice: La frontière passait ensuite
  rationale: Dans une formule de délimitation, עבר décrit la poursuite du tracé jusqu’au point suivant, sans exiger l’idée d’une traversée.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: jusqu’aux eaux d’En-Shémesh
  rationale: מֵי signifie littéralement « eaux de ». Le nom du lieu est translittéré plutôt que traduit, tandis que « jusqu’aux » rend naturellement אל dans le mouvement du tracé.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: et aboutissait à En-Roguel
  rationale: Dans les descriptions territoriales, תוצאות désigne l’issue ou le point terminal de la frontière. « Aboutissait » rend ce sens naturellement, malgré la forme plurielle de l’hébreu, signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les temps à l’imparfait présentent le tracé comme une progression continue. Les toponymes sont translittérés selon des formes françaises lisibles; les termes topographiques restent concrets sans technicité excessive.
