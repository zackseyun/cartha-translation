  rationale: Nom de lieu transcrit sous sa forme française biblique usuelle.
- source_word: חֹלֹן
  choice: Holôn
  rationale: Nom de lieu transcrit en français; l’accent circonflexe aide à signaler la voyelle longue sans rendre la forme artificielle.
- source_word: גִלֹה
  choice: Guilo
  rationale: Transcription française naturelle du nom hébreu, avec « gu » pour conserver le son dur de ג devant i.
- source_word: עָרִים
  choice: villes
  rationale: Terme courant pour des agglomérations dans les listes territoriales; il conserve la valeur administrative du mot hébreu.
- source_word: אַחַת עֶשְׂרֵה
  choice: onze
  rationale: Rendu cardinal direct et idiomatique en français.
- source_word: חַצְרֵיהֶן
  choice: les villages qui en dépendaient
  rationale: Le terme désigne ici des établissements ruraux ou non fortifiés rattachés aux villes; cette formulation explicite naturellement la relation exprimée par le suffixe possessif.
