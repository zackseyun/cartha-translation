revisions:
- from: Le territoire attribué par tirage au sort à la tribu des descendants de Juda[a], selon leurs clans, s’étendait jusqu’à la frontière d’Édom et au désert de Tsîn, tout au sud, à l’extrême sud[b].
  to: Le lot attribué par tirage au sort à la tribu des descendants de Juda[a], selon leurs clans, allait jusqu’à la frontière d’Édom, au désert de Tsîn, au sud, depuis l’extrémité du sud[b].
  rationale: La révision conserve le lot obtenu par tirage au sort et les subdivisions claniques, tout en rétablissant une énumération de repères territoriaux plus proche du texte hébreu. Elle évite la redondance « tout au sud, à l’extrême sud » et préserve, en note, l’ambiguïté de תימן entre « sud » et « Témân ».
