source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: fr
  text: Le lot attribué par tirage au sort à la tribu des descendants de Juda[a], selon leurs clans, allait jusqu’à la frontière d’Édom, au désert de Tsîn, au sud, depuis l’extrémité du sud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des fils de Juda », c’est-à-dire des descendants de Juda.
    reason: cultural_note
  - marker: b
    text: Ou « depuis l’extrémité de Témân ». Le terme hébreu peut désigner le sud ou Témân, un lieu ou une région.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Le territoire attribué par tirage au sort … s’étendait
  rationale: Cette formulation française exprime naturellement le résultat du partage tout en conservant explicitement le recours au tirage au sort, indiqué par גּוֹרָל.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: à la tribu des descendants de Juda
  rationale: מַטֶּה désigne ici la tribu, et « descendants de Juda » rend le sens collectif de בְּנֵי יְהוּדָה plus clairement que le calque « fils de Juda ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le cadre du partage tribal, מִשְׁפָּחָה désigne les clans qui constituent la tribu, plutôt que de simples familles nucléaires.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: jusqu’à la frontière d’Édom
  rationale: גְּבוּל indique ici la limite territoriale; « jusqu’à » convient à l’énumération géographique de l’étendue du lot.
- source_word: מִדְבַּר צִן
  choice: désert de Tsîn
  rationale: מִדְבָּר désigne une région aride ou désertique; « désert » est naturel en français pour ce toponyme biblique.
- source_word: נֶגְבָּה
  choice: tout au sud
  rationale: La forme directionnelle indique ici le côté ou la direction du sud, sans devoir être comprise comme le nom propre du Néguev.
- source_word: מִקְצֵה תֵימָן
  choice: à l’extrême sud
  rationale: Dans ce contexte, תֵימָן désigne probablement le sud et la locution marque l’extrémité méridionale; une note conserve l’autre lecture possible.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La formulation évite le calque syntaxique de l’hébreu, mais maintient le tirage au sort, l’organisation en clans et l’ambiguïté géographique finale au moyen d’une note.
