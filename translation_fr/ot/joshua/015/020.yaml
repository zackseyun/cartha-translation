id: JOS.15.20
reference: Joshua 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/020.yaml
  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: fr
  text: Tel fut le territoire attribué à la tribu des descendants de Juda, selon leurs clans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tel est le territoire attribué à la tribu des descendants de Juda, selon leurs clans. »'
    reason: L’hébreu ne comporte pas de verbe exprimé ; le présent est donc également possible.
lexical_decisions:
- source_word: זֹאת
  choice: Tel fut
  rationale: Le démonstratif féminin singulier renvoie au territoire décrit dans les versets précédents. « Tel fut » convient à une formule récapitulative dans un récit passé, tandis que l’hébreu ne marque pas explicitement le temps.
- source_word: נַחֲלַת
  choice: le territoire attribué
  rationale: Dans ce contexte de partage du pays, נַחֲלָה désigne la part territoriale reçue comme possession héréditaire. Cette formulation française naturelle rend le cadre de l’attribution sans réduire le terme à un simple héritage familial.
- source_word: מַטֵּה
  choice: la tribu
  rationale: Dans ce contexte tribal, מַטֶּה désigne la tribu et non son sens concret de « bâton ».
- source_word: בְנֵי יְהוּדָה
  choice: des descendants de Juda
  rationale: Littéralement « fils de Juda » ; « descendants de Juda » exprime clairement en français moderne l’appartenance généalogique et collective de la tribu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les groupes familiaux constitutifs de la tribu, et la préposition לְ marque la répartition selon ces clans.
theological_decisions:
- issue: Valeur temporelle de la proposition nominale hébraïque
  choice: Tel fut
  alternative: Tel est
  rationale: La proposition hébraïque ne comporte pas de verbe exprimé et permet une lecture au présent ou au passé. Le passé s’intègre naturellement au récit récapitulatif, tandis que la variante préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. « Territoire attribué » est plus idiomatique ici que « héritage » tout en conservant l’idée d’une part de pays reçue ; « descendants » évite l’ambiguïté moderne de « fils » appliqué à l’ensemble tribal.
