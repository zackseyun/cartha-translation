lexical_decisions:
- source_word: עֶקְרוֹן
  choice: Éqrôn
  rationale: Nom propre translittéré sous une forme française qui représente les consonnes hébraïques et indique la voyelle longue finale.
- source_word: וּבְנֹתֶיהָ
  choice: avec les localités qui en dépendaient
  rationale: Le mot « filles » est ici un idiome hébreu désignant les localités rattachées à une ville principale. Cette formulation naturelle en français explicite le lien de dépendance sans confondre nécessairement ces établissements avec des villes d'une catégorie précise.
- source_word: וַחֲצֵרֶיהָ
  choice: et ses villages
  rationale: Dans les listes territoriales, חֲצֵרִים désigne de petites agglomérations ou des établissements non fortifiés. « Villages » est clair, courant et convient au contraste avec les localités dépendantes.
