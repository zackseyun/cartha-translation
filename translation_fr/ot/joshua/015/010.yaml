revisions:
- from: Puis la frontière tournait, depuis Baala, vers l’ouest[a], en direction du mont Séir. Elle passait par le versant nord du mont Yéarim — c’est-à-dire Kesalon —, descendait vers Beth-Shémesh et continuait jusqu’à Timna.
  to: Puis la frontière tourna depuis Baala vers l’ouest[a], en direction du mont Séir. Elle passa par le versant nord du mont Yéarim — c’est-à-dire Kesalon —, descendit vers Beth-Shémesh et passa par Timna.
  rationale: La révision remplace l’imparfait par le passé simple afin de reproduire la succession des mouvements de la frontière. Elle rend aussi le dernier verbe par « passa par », formulation plus proche de la description topographique hébraïque, sans surinterpréter la relation exacte de la frontière à Timna.
