  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: fr
  text: Puis la frontière tourna depuis Baala vers l’ouest[a], en direction du mont Séir. Elle passa par le versant nord du mont Yéarim — c’est-à-dire Kesalon —, descendit vers Beth-Shémesh et passa par Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la mer », expression hébraïque courante pour désigner l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: Puis la frontière tournait
  rationale: Dans une description territoriale, le verbe indique un changement de direction du tracé. « Tournait » reste naturel en français et conserve l’image cartographique.
- source_word: מִבַּעֲלָה
  choice: depuis Baala
  rationale: Le toponyme est translittéré; « depuis » marque clairement le point de départ du nouveau segment de frontière.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: La forme directionnelle signifie littéralement « vers la mer » et désigne ici l’ouest dans la géographie du pays.
- source_word: אֶל הַר שֵׂעִיר
  choice: en direction du mont Séir
  rationale: הַר peut désigner une montagne ou une région montagneuse; « mont Séir » préserve ici la valeur toponymique et le relief mentionné.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: Elle passait par le versant
  rationale: Dans les formules de délimitation, עבר décrit le prolongement du tracé, tandis que כֶּתֶף, littéralement « épaule/côté », désigne naturellement le versant d’un relief.
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: le versant nord du mont Yéarim
  rationale: Le complément directionnel situe la frontière sur le côté nord du mont; cette formulation française est claire sans effacer la topographie.
- source_word: הִיא כְסָלוֹן
  choice: c’est-à-dire Kesalon
  rationale: Le pronom introduit une identification explicative du lieu précédent; l’incise rend naturellement cette apposition.
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: descendait vers Beth-Shémesh
  rationale: Le verbe exprime un mouvement topographique descendant; « vers » rend l’enchaînement du tracé sans suggérer nécessairement une entrée dans la ville.
- source_word: וְעָבַר תִּמְנָה
  choice: continuait jusqu’à Timna
  rationale: Dans ce contexte frontalier, עבר indique que la ligne se prolonge vers le lieu suivant. « Continuait jusqu’à » est idiomatique et évite l’idée trop précise d’une traversée.
