    reason: lexical_alternative
  revision_rationale: La révision remplace l’imparfait par le passé simple afin de reproduire la succession des mouvements de la frontière. Elle rend aussi le dernier verbe par « passa par », formulation plus proche de la description topographique hébraïque, sans surinterpréter la relation exacte de la frontière à Timna.
