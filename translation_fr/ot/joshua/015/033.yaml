lexical_decisions:
- source_word: בַּשְּׁפֵלָה
  choice: Dans le Bas-Pays
  rationale: Le terme désigne ici la région de collines basses située entre les montagnes de Juda et la plaine côtière. « Bas-Pays » exprime le sens géographique tout en signalant qu’il s’agit d’une région déterminée.
- source_word: אֶשְׁתָּאוֹל
  choice: Eshtaol
  rationale: Nom de lieu transcrit en français sans être traduit.
- source_word: וְצָרְעָה
  choice: Tsorea
  rationale: Nom de lieu transcrit selon un usage français courant ; la conjonction hébraïque est rendue naturellement par la coordination de la liste.
- source_word: וְאַשְׁנָה
  choice: et Ashna
  rationale: Nom de lieu transcrit en français ; le וְ préfixé est rendu par « et » devant le dernier élément de l’énumération.
