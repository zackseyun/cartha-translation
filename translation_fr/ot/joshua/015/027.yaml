  text: Hazar-gaddah[a], Heshmon[b], and Beth-pelet.
translation:
  language: fr
  text: Hatsar-Gadda[a], Heshmôn et Beth-Péleth[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hatsar Gadda » (sans trait d’union).
    reason: lexical_alternative
  - marker: b
    text: Ou « Beth Péleth »; plus littéralement, « maison de Péleth », mais l’expression hébraïque est ici un nom de lieu.
