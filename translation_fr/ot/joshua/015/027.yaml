lexical_decisions:
- source_word: חֲצַר גַּדָּה
  choice: Hatsar-Gadda
  rationale: Nom de lieu du territoire de Juda, translittéré plutôt que traduit. Le trait d’union rend lisible son caractère composé, et « ts » représente naturellement en français la consonne צ.
- source_word: חֶשְׁמוֹן
  choice: Heshmon
  rationale: Toponyme translittéré selon une forme française claire, sans en proposer une traduction conjecturale.
- source_word: בֵית פָּלֶט
  choice: Beth-Péleth
  rationale: Toponyme composé conservé comme nom propre. « Beth » préserve l’élément hébreu traditionnellement reconnaissable, tandis que le trait d’union marque l’unité du nom.
- source_word: וְ / וּ
  choice: et
  rationale: Les conjonctions préfixées coordonnent les trois noms; en français naturel, des virgules séparent les premiers éléments et « et » introduit le dernier.
theological_decisions: []
translation_notes:
  register: Style sobre et dignifié adapté à une liste territoriale. Les toponymes sont translittérés selon des conventions lisibles en français moderne; les accents aident à guider la prononciation sans traduire les noms.
