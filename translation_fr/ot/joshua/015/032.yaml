base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/032.yaml
  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: fr
  text: 'Lebaoth, Shilhim, Aïn et Rimmon : vingt-neuf villes en tout, avec leurs villages[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « villages » peut aussi désigner des hameaux ou des établissements ruraux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: Lebaoth
  rationale: Nom de lieu dans une liste de villes, conservé par translittération. La coordination initiale hébraïque est rendue naturellement par la ponctuation et l’enchaînement de la liste en français.
- source_word: וְשִׁלְחִים
  choice: Shilhim
  rationale: Nom de lieu translittéré selon une forme française lisible.
- source_word: וְעַיִן
  choice: Aïn
  rationale: Le contexte exige un toponyme plutôt que le nom commun « source » ou « œil » ; la graphie Aïn est usuelle et claire en français.
- source_word: וְרִמּוֹן
  choice: Rimmon
  rationale: Nom de lieu translittéré ; bien que le nom commun puisse désigner une grenade, il s’agit ici d’une ville.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: en tout, vingt-neuf villes
  rationale: Rend explicitement et naturellement en français la récapitulation numérique de l’hébreu.
- source_word: וְחַצְרֵיהֶן
  choice: avec les villages qui en dépendaient
  rationale: Dans les listes territoriales, חָצֵר désigne des villages ou établissements rattachés aux villes mentionnées. Cette formulation exprime clairement cette relation sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les toponymes sont translittérés ; la formulation récapitulative reste naturelle tout en conservant la relation entre les villes et leurs dépendances.
