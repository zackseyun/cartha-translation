  text: וּ/גְב֥וּל קֵ֨דְמָ/ה֙ יָ֣ם הַ/מֶּ֔לַח עַד קְצֵ֖ה הַ/יַּרְדֵּ֑ן וּ/גְב֞וּל לִ/פְאַ֤ת צָפ֨וֹנָ/ה֙ מִ/לְּשׁ֣וֹן הַ/יָּ֔ם מִ/קְצֵ֖ה הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: fr
  text: La frontière orientale était la mer Salée jusqu’à l’embouchure du Jourdain[a]. Du côté nord, la frontière partait de la langue de la mer[b], à l’embouchure du Jourdain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’extrémité du Jourdain ».'
    reason: Signale la formulation concrète de l’hébreu derrière l’interprétation géographique « embouchure ».
  - marker: b
    text: 'Ou : « l’avancée de la mer ». Littéralement : « la langue de la mer ».'
    reason: Éclaire une image géographique hébraïque inhabituelle sans imposer une identification topographique plus précise.
lexical_decisions:
- source_word: קֵדְמָה
  choice: orientale
  rationale: Dans ce relevé territorial, le terme directionnel désigne le côté est de la frontière; « orientale » est naturel et précis en français.
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Traduction formelle du nom hébreu, qui conserve l’appellation biblique plutôt que de lui substituer le nom moderne « mer Morte ».
- source_word: קְצֵה הַיַּרְדֵּן
  choice: l’embouchure du Jourdain
  rationale: Littéralement « l’extrémité du Jourdain »; dans ce contexte géographique, il s’agit de l’endroit où le Jourdain se jette dans la mer Salée.
- source_word: לְשׁוֹן הַיָּם
  choice: la langue de mer
  rationale: L’image hébraïque de la « langue » est conservée; en français, « langue de mer » peut désigner une étendue étroite de mer qui pénètre dans les terres.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. La formulation conserve le vocabulaire géographique imagé de l’hébreu tout en rendant explicitement le sens contextuel de קְצֵה הַיַּרְדֵּן.
