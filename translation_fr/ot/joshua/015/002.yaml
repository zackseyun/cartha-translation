  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: fr
  text: Leur frontière sud partait de l’extrémité de la mer Salée[a], de la langue[b] tournée vers le sud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la mer Morte.
    reason: cross_reference
  - marker: b
    text: L’hébreu dit littéralement « la langue », terme topographique pouvant désigner une avancée de terre, un bras d’eau ou une baie en forme de langue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: Leur … partait
  rationale: La tournure hébraïque introduit la délimitation attribuée au groupe. En français, le possessif suivi de « partait » exprime naturellement à la fois l’appartenance et le point de départ.
- source_word: גְּבוּל נֶגֶב
  choice: frontière sud
  rationale: נֶגֶב indique ici le côté méridional de la frontière, et non le nom propre de la région du Néguev.
- source_word: מִקְצֵה
  choice: de l’extrémité de
  rationale: Le terme désigne le bout ou le point extrême d’un espace géographique.
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Cette traduction conserve la désignation hébraïque littérale, tout en signalant en note son nom courant moderne.
- source_word: מִן הַלָּשׁוֹן
  choice: depuis la langue de terre
  rationale: לָשׁוֹן signifie littéralement « langue » et sert ici de terme topographique. « Langue de terre » conserve l’image du texte source sans employer le mot isolé de façon obscure.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: orientée vers le sud
  rationale: Le participe פנה exprime l’orientation du relief; cette formulation est naturelle et précise en français géographique.
