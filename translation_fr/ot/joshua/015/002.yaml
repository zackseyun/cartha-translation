  source_fidelity: La formulation « frontière sud » rend bien גְּבוּל נֶגֶב, et « mer Salée » conserve de façon recevable la désignation hébraïque יָם הַמֶּלַח, avec l’identification usuelle en note. Toutefois, « langue de terre » fixe le référent comme une avancée terrestre, alors que לָשׁוֹן est ici un terme topographique dont le référent précis (saillie, bras ou baie) ne doit pas être tranché dans le texte principal. La répétition « de … depuis » est également moins fidèle à la construction répétée מִן dans une phrase française naturelle.
  naturalness: « Leur frontière sud partait de l’extrémité… » est naturel. La coordination « de …, depuis … » est néanmoins maladroite; répéter « de » est plus idiomatique et plus proche du parallélisme de l’hébreu. « La langue tournée vers le sud » est sobre et compréhensible grâce à la note.
  terminology: « Frontière », « extrémité », « mer Salée » et « vers le sud » conviennent au registre géographique biblique. Le terme non interprétatif « langue » est préférable à « langue de terre »; la note peut exposer les possibilités topographiques sans en privilégier une.
