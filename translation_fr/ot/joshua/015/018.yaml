base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: fr
  text: 'À son arrivée, elle le poussa[a] à demander un champ à son père. Puis elle descendit de l’âne[b]. Caleb lui demanda : « Que veux-tu[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle le persuada » ou, avec une nuance plus négative, « elle l’incita ».
    reason: lexical_alternative
  - marker: b
    text: Ou « elle mit pied à terre » ; le verbe hébreu peut suggérer une descente soudaine.
    reason: lexical_alternative
  - marker: c
    text: 'L’expression hébraïque est littéralement elliptique : « Quoi [à] toi ? » Elle peut signifier « Que veux-tu ? », « Qu’as-tu ? » ou « Qu’est-ce qui te préoccupe ? ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: À son arrivée
  rationale: L’infinitif construit précédé de ב et muni du suffixe féminin singulier forme une proposition temporelle. Cette formulation naturelle conserve le sens sans préciser un lieu que l’hébreu ne nomme pas.
- source_word: וַתְּסִיתֵהוּ
  choice: elle poussa son mari
  rationale: Le verbe סות exprime ici une incitation pressante. « Poussa » garde cette force sans lui donner nécessairement une valeur négative. Le pronom masculin désigne Otniel dans le contexte immédiat; « son mari » clarifie le référent implicite.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: à demander un champ à son père
  rationale: שאל avec מֵאֵת indique que la demande est adressée au père. L’ordre français retenu est idiomatique, et « un champ » rend directement שָׂדֶה.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: elle descendit de son âne
  rationale: צנח peut évoquer une descente soudaine, mais le contexte indique surtout qu’elle met pied à terre. « Descendit » reste naturel et n’exagère pas la vivacité possible du verbe.
- source_word: מַה לָּךְ
  choice: Que veux-tu ?
  rationale: Littéralement « Qu’y a-t-il pour toi ? », cette expression idiomatique demande ici ce qu’elle souhaite obtenir. La traduction contextuelle demeure concise et naturelle.
