  text: וְ/תָאַ֨ר הַ/גְּב֜וּל מֵ/רֹ֣אשׁ הָ/הָ֗ר אֶל מַעְיַן֙ מֵ֣י נֶפְתּ֔וֹחַ וְ/יָצָ֖א אֶל עָרֵ֣י הַר עֶפְר֑וֹן וְ/תָאַ֤ר הַ/גְּבוּל֙ בַּעֲלָ֔ה הִ֖יא קִרְיַ֥ת יְעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: fr
  text: Puis la frontière obliqua, depuis le sommet de la montagne, vers la source des eaux de Nephtoah[a], puis elle se prolongea vers les villes du mont Éphrôn. La frontière obliqua ensuite vers Baala, c’est-à-dire Qiryath-Yéarim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la frontière fut tracée » ou « la frontière tourna ». Dans ce contexte de délimitation, le verbe hébreu peut désigner le tracé de la frontière ou son changement de direction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: tournait
  rationale: Dans cette description territoriale, le verbe indique que la ligne frontière change de direction ou est tracée autour d’un point géographique. « Tournait » est naturel en français et conserve cette valeur sans imposer une courbe précise.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: Terme français courant pour la ligne délimitant un territoire attribué.
- source_word: מֵרֹאשׁ הָהָר
  choice: depuis le sommet de la montagne
  rationale: « Sommet » rend naturellement רֹאשׁ dans ce contexte topographique.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: la source des eaux de Nephtoah
  rationale: Cette formulation conserve de près la chaîne construite hébraïque tout en restant intelligible en français; Nephtoah est translittéré comme nom de lieu.
- source_word: וְיָצָא
  choice: se prolongeait
  rationale: Dans les formules de délimitation, יצא décrit la frontière qui continue son parcours. « Se prolongeait » exprime clairement ce mouvement topographique en français.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: les villes du mont Éphrôn
  rationale: Rendu direct de la construction hébraïque, sans transformer « mont » en une région montagneuse plus large.
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Nom de lieu translittéré sous une forme lisible en français.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: c’est-à-dire Qiryath-Yéarim
  rationale: Le pronom identifie Baala à cet autre nom de lieu; « c’est-à-dire » rend naturellement cette apposition.
theological_decisions: []
