  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: fr
  text: 'Caleb dit : « Celui qui attaquera Qiryath-Sépher et s’en emparera, je lui donnerai ma fille Aksa pour femme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: כָּלֵב
  choice: Caleb
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: אֲשֶׁר
  choice: celui qui
  rationale: Introduit ici une relative indéfinie exprimant le défi ouvert lancé par Caleb; « celui qui » est naturel et conserve une formulation proche de l’hébreu.
- source_word: יַכֶּה
  choice: attaquera
  rationale: Le hiphil de נכה désigne ici une action militaire dirigée contre la ville. « Attaquer » rend le sens contextuel sans anticiper la réussite, exprimée séparément par וּלְכָדָהּ.
- source_word: קִרְיַת סֵפֶר
  choice: Qiryath-Sépher
  rationale: Translittération française du nom de lieu, en conservant ses deux éléments comme nom propre.
- source_word: וּלְכָדָהּ
  choice: et s’en emparera
  rationale: לכד désigne la prise d’une ville dans un contexte militaire; le pronom « en » renvoie naturellement en français à la ville attaquée.
- source_word: וְנָתַתִּי לוֹ
  choice: je lui donnerai
  rationale: La forme exprime une promesse consécutive au succès; cette tournure française restitue explicitement le bénéficiaire.
- source_word: עַכְסָה
  choice: Aksa
  rationale: Translittération française claire du nom propre hébreu.
- source_word: בִתִּי
  choice: ma fille
  rationale: Rend directement la relation filiale explicitement indiquée dans le texte.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Expression française naturelle pour le don en mariage, sans ajouter un possessif absent de l’hébreu.
