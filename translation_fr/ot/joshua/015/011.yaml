source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל אֶל כֶּ֣תֶף עֶקְרוֹן֮ צָפוֹנָ/ה֒ וְ/תָאַ֤ר הַ/גְּבוּל֙ שִׁכְּר֔וֹנָ/ה וְ/עָבַ֥ר הַר הַֽ/בַּעֲלָ֖ה וְ/יָצָ֣א יַבְנְאֵ֑ל וְ/הָי֛וּ תֹּצְא֥וֹת הַ/גְּב֖וּל יָֽמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: fr
  text: La frontière se prolongeait ensuite jusqu’au flanc nord d’Ékron[a], puis elle tournait vers Shikkéron, passait le mont Baalah et se prolongeait jusqu’à Yabnéel. Les extrémités de la frontière aboutissaient à la mer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au flanc d’Ékron, vers le nord » ; l’hébreu associe le « flanc » d’Ékron à une forme indiquant la direction du nord.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les issues de la frontière étaient vers la mer » ; la forme hébraïque peut aussi se comprendre « vers l’ouest ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: se prolongeait / se prolongeait jusqu’à
  rationale: Dans les descriptions de frontières, le verbe indique que la ligne poursuit son tracé vers un nouveau point. Cette formulation est naturelle en français et conserve le mouvement du texte.
- source_word: גְּבוּל
  choice: frontière
  rationale: « Frontière » convient à la délimitation d’un territoire et se lit naturellement en français moderne.
- source_word: כֶּתֶף
  choice: flanc
  rationale: Le sens concret est « épaule », avec un emploi topographique désignant un côté ou un versant. « Flanc » préserve l’image tout en étant idiomatique.
- source_word: עֶקְרוֹן צָפוֹנָה
  choice: flanc nord d’Ékron
  rationale: La forme directionnelle peut indiquer une orientation vers le nord, mais, associée à « flanc », elle se comprend naturellement comme le côté nord d’Ékron. L’ambiguïté est signalée en note.
- source_word: תָּאַר
  choice: tournait vers
  rationale: Dans une formule de délimitation, le verbe décrit le changement de direction du tracé. « Tournait vers » est clair sans imposer une géométrie trop précise.
- source_word: שִׁכְּרוֹנָה
  choice: Shikkéron
  rationale: Nom de lieu translittéré sous une forme lisible en français, avec la consonne redoublée reflétant le dagesh.
- source_word: עָבַר
  choice: passait par
  rationale: Le verbe exprime le passage à travers, par-dessus ou au-delà d’un relief. « Passait par » reste naturel et évite de préciser indûment la relation exacte au mont.
- source_word: הַר הַבַּעֲלָה
  choice: le mont Baala
  rationale: הַר désigne une hauteur ou une montagne; « mont » est la formulation toponymique française usuelle. Baala est translittéré.
- source_word: יַבְנְאֵל
  choice: Yabnéel
  rationale: Le nom propre est translittéré en conservant la consonne initiale yod et la distinction des deux voyelles.
- source_word: תֹּצְאוֹת
  choice: aboutissait
  rationale: Le pluriel idiomatique hébreu désigne ici l’issue ou le point terminal de la frontière. Le verbe français exprime clairement cette fonction sans l’expression peu naturelle « les sorties ».
- source_word: יָמָּה
  choice: à la mer
  rationale: La forme peut signifier « vers la mer » ou « vers l’ouest ». Dans cette clause terminale, elle indique vraisemblablement que la frontière atteignait la mer, sans que le texte hébreu nomme explicitement la Méditerranée.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tracé est exprimé avec des verbes naturels pour une frontière. Les noms sont translittérés selon des habitudes françaises, et les ambiguïtés directionnelles de l’hébreu sont conservées dans les notes.
