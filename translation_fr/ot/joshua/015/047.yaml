  terminology: Ashdod et Gaza sont les formes françaises usuelles. « Torrent d’Égypte » est une désignation biblique établie; la note conserve justement l'alternative « ouadi ». « Littoral » exprime naturellement la valeur géographique de גבול dans la séquence finale.
