  text: אַשְׁדּ֞וֹד בְּנוֹתֶ֣י/הָ וַ/חֲצֵרֶ֗י/הָ עַזָּ֥ה בְּנוֹתֶ֥י/הָ וַ/חֲצֵרֶ֖י/הָ עַד נַ֣חַל מִצְרָ֑יִם וְ/הַ/יָּ֥ם ה/גבול וּ/גְבֽוּל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: fr
  text: Ashdod, ses villes dépendantes[a] et ses villages ; Gaza, ses villes dépendantes et ses villages, jusqu’au torrent d’Égypte[b], et à la Grande Mer[c], avec son littoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses filles ». Il s’agit de villes ou de localités rattachées à une ville principale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’ouadi d’Égypte ». Le mot hébreu peut désigner un cours d’eau saisonnier ou son lit.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire la mer Méditerranée.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Dans les listes territoriales, le pluriel « filles » désigne les localités rattachées à une ville principale. Cette formulation naturelle en français explicite la relation de dépendance sans suggérer qu’elles étaient seulement voisines.
- source_word: חֲצֵרֶיהָ
  choice: ses villages
  rationale: Dans ce contexte géographique, le terme désigne de petites agglomérations périphériques ; « villages » est clair et les distingue des localités dépendantes.
- source_word: נַחַל מִצְרָיִם
  choice: le torrent d’Égypte
  rationale: נַחַל peut désigner un cours d’eau, souvent saisonnier, ou son lit. « Torrent d’Égypte » conserve la désignation biblique traditionnelle tout en permettant de signaler « ouadi » en note.
- source_word: הַיָּם
  choice: la Grande Mer
  rationale: Bien que le texte massorétique conservé lise littéralement « la mer », l’appellation biblique usuelle « Grande Mer » identifie ici la Méditerranée. La note en précise le référent.
- source_word: הַגְּבוּל וּגְבוּל
  choice: formait la frontière
  rationale: 'La fin hébraïque est abrupte et présente une difficulté textuelle. Cette formulation restitue sobrement le sens territorial probable : la mer sert de limite.'
- source_word: עַד
  choice: jusqu’à
  rationale: Rendu français courant d’un marqueur d’extension territoriale.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: Ashdod / Gaza
  rationale: Translittérations françaises usuelles de ces noms de lieux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure en deux groupes parallèles est conservée ; le point-virgule rend lisible l’énumération territoriale. Le passé convient au cadre narratif de l’attribution du territoire.
