  text: Yanim, Beth-Tappouah et Aféqa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ו/ינים
  choice: Yanim
  rationale: Le nom de lieu ינים est translittéré selon des conventions françaises modernes; la conjonction ו s’intègre naturellement à l’énumération par « et » devant le dernier élément plutôt que d’être répétée.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: Beth-Tappouah
  rationale: Le toponyme composé est conservé par translittération. « Beth » est la forme française traditionnelle pour בֵית dans les noms de lieux, et « Tappouah » représente תַּפּוּחַ de façon lisible en français.
- source_word: וַ/אֲפֵקָה
  choice: Aféqa
  rationale: Le nom אֲפֵקָה est translittéré sans le réduire à Afek, afin de conserver sa forme particulière; « q » représente le qoph et distingue la consonne du kaph.
