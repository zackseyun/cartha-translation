base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/043.yaml
  text: And Iphtah[a], and Ashnah[b], and Nezib.
translation:
  language: fr
  text: Yifta[a], Ashna et Netsib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jifta » ; traditionnellement « Jephté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Nezib ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְתָּח
  choice: Yifta
  rationale: Nom propre de lieu dans une liste de villes. La translittération « Yifta » représente naturellement en français moderne la forme hébraïque yiftāḥ, sans l’assimiler au nom traditionnel du juge Jephté.
- source_word: אַשְׁנָה
  choice: Ashna
  rationale: Nom propre de lieu, translittéré selon une forme claire et naturelle en français.
- source_word: נְצִיב
  choice: Netsib
  rationale: Nom propre de lieu. « Netsib » rend le tsadé hébreu par « ts », convention intelligible en français, tandis que « Nezib » reflète une autre tradition de transcription.
- source_word: וְ / וּ
  choice: et
  rationale: La conjonction préfixée relie les noms de cette liste. En français, un seul « et » avant le dernier élément produit une énumération naturelle sans modifier les relations syntaxiques.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les toponymes sont translittérés plutôt que traduits. La polysyndète hébraïque est adaptée à l’usage français par des virgules et un « et » final.
