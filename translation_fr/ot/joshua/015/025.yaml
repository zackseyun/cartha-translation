  text: וְ/חָצ֤וֹר חֲדַתָּה֙ וּ/קְרִיּ֔וֹת חֶצְר֖וֹן הִ֥יא חָצֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: fr
  text: Hatsor-Hadatta[a] et Qerioth-Hetsron (c’est Hatsor).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Hatsor, Hadatta et Qerioth-Hetsron (c’est Hatsor) », si חֲדַתָּה est le nom d’une localité distincte plutôt que le second élément du nom composé « Hatsor-Hadatta ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/חָצוֹר
  choice: Hatsor
  rationale: Nom de lieu précédé de la conjonction וְ. La forme « Hatsor » suit une translittération française courante de חָצוֹר.
- source_word: חֲדַתָּה
  choice: -Hadatta
  rationale: Le mot est compris comme le second élément du toponyme composé « Hatsor-Hadatta », conformément à l’accentuation massorétique et à l’interprétation habituelle de cette liste, sans effacer la possibilité qu’il désigne une localité distincte.
- source_word: וּ/קְרִיּוֹת
  choice: et Qerioth
  rationale: Dans cette liste de villes, קְרִיּוֹת est traité comme un nom propre plutôt que comme le nom commun « villes ». « Qerioth » rend naturellement la consonne initiale en français.
- source_word: חֶצְרוֹן
  choice: -Hetsron
  rationale: Le nom est rattaché au précédent pour former le toponyme composé « Qerioth-Hetsron ».
- source_word: הִיא
  choice: c’est
  rationale: Le pronom introduit ici une identification en apposition. « C’est » en restitue la fonction explicative dans un français naturel.
- source_word: חָצוֹר
  choice: Hatsor
  rationale: Le nom final identifie Qerioth-Hetsron à Hatsor; la translittération reste cohérente avec la première occurrence.
