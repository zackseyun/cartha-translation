  text: וַ/יַּ֣עַל מִ/שָּׁ֔ם אֶל יֹשְׁבֵ֖י דְּבִ֑ר וְ/שֵׁם דְּבִ֥ר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/015.yaml
  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: fr
  text: De là, il monta contre les habitants de Debir[a]. (Autrefois, Debir s’appelait Qiryath-Sépher.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qiryath-Sépher peut signifier « Ville du Livre » ou « Ville de l’écriture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: il monta contre
  rationale: Le verbe עלה signifie littéralement « monter ». Dans ce récit militaire, avec אֶל et les habitants d’une ville comme complément, « monta contre » conserve à la fois l’idée de déplacement ascendant et celle d’une avancée hostile.
- source_word: מִשָּׁם
  choice: De là
  rationale: Rend naturellement l’adverbe indiquant le point de départ par rapport au lieu mentionné précédemment.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: contre les habitants de Debir
  rationale: יֹשְׁבֵי désigne ceux qui habitent la ville. Le contexte militaire justifie « contre », sans réduire explicitement le mouvement à une attaque.
- source_word: דְּבִר
  choice: Debir
  rationale: Nom de lieu conservé par translittération usuelle plutôt que traduit.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: Autrefois, Debir s’appelait
  rationale: לְפָנִים a ici un sens temporel. Cette formulation française actuelle et naturelle exprime fidèlement l’ancien nom de la ville.
- source_word: קִרְיַת סֵפֶר
  choice: Qiryath-Sépher
  rationale: Le toponyme est translittéré dans le texte principal. Ses éléments peuvent suggérer « ville du livre » ou « ville de l’écriture », possibilité signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Il monta contre » garde l’image géographique de l’hébreu et la portée militaire du contexte. La parenthèse conserve le caractère d’information historique secondaire.
