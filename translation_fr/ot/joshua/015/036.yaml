  text: וְ/שַׁעֲרַ֨יִם֙ וַ/עֲדִיתַ֔יִם וְ/הַ/גְּדֵרָ֖ה וּ/גְדֵרֹתָ֑יִם עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/036.yaml
  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: fr
  text: 'Shaaraïm[a], Adithaïm, Guedéra et Guedérothaïm : quatorze villes avec leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les quatre noms de lieux donnés dans ce verset ne permettent pas, à eux seuls, d’arriver au total indiqué de « quatorze villes ». L’histoire textuelle de l’ensemble de cette liste peut expliquer cet écart, mais l’hébreu est traduit ici tel qu’il nous est parvenu.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: Shaaraïm
  rationale: Nom de lieu translittéré; le tréma indique naturellement en français que le a et le i se prononcent séparément.
- source_word: עֲדִיתַיִם
  choice: Adithaïm
  rationale: Nom de lieu translittéré directement, avec un tréma adapté aux conventions graphiques françaises.
- source_word: הַגְּדֵרָה
  choice: Guedéra
  rationale: Nom de lieu rendu sous une forme lisible en français; l’article hébreu n’est pas reproduit, puisqu’il fait partie de la forme toponymique et qu’un article autonome serait peu naturel ici.
- source_word: גְדֵרֹתָיִם
  choice: Guedérothaïm
  rationale: Nom de lieu translittéré sous une forme conforme à la prononciation française.
- source_word: עָרִים
  choice: villes
  rationale: Rendu traditionnel et approprié dans une liste territoriale de localités.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: quatorze
  rationale: Traduction directe et idiomatique du nombre cardinal.
- source_word: חַצְרֵיהֶן
  choice: les villages qui en dépendaient
  rationale: Dans ces listes territoriales, le terme désigne vraisemblablement des localités secondaires ou non fortifiées rattachées aux villes; cette formulation explicite naturellement leur relation administrative.
theological_decisions: []
