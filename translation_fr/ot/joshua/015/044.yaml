  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
translation:
  language: fr
  text: 'Qéila, Akzib et Marésha : neuf villes et leurs villages.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs localités rurales ». Le terme hébreu peut désigner des lieux ruraux associés à une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְעִילָה
  choice: Qéila
  rationale: Nom de lieu transcrit sous une forme française claire et conforme à l’usage biblique francophone.
- source_word: אַכְזִיב
  choice: Akzib
  rationale: Nom de lieu transcrit plutôt que traduit; la graphie conserve approximativement les consonnes hébraïques dans une forme lisible en français.
- source_word: מָרֵאשָׁה
  choice: Marésha
  rationale: Nom de lieu transcrit sous une forme naturelle en français.
- source_word: עָרִים
  choice: villes
  rationale: Terme courant pour des agglomérations; il convient au contexte de cette liste territoriale.
- source_word: תֵּשַׁע
  choice: neuf
  rationale: Nombre cardinal rendu directement.
- source_word: חַצְרֵיהֶן
  choice: les villages qui en dépendaient
  rationale: Le terme désigne ici des localités rurales ou non fortifiées rattachées aux villes; cette formulation explicite naturellement le rapport de dépendance exprimé par le suffixe féminin pluriel.
- source_word: וְ
  choice: et / avec
  rationale: Les conjonctions hébraïques coordonnent les noms puis relient le total des villes aux localités qui leur sont rattachées; le français emploie naturellement « et » dans la liste et « avec » dans la formule finale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure concise d’une liste territoriale est conservée, tandis que « qui en dépendaient » rend explicite en français la relation entre les villes et leurs localités rurales.
