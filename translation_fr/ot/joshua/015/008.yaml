source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: fr
  text: Puis la frontière remonta par la vallée de Ben-Hinnom jusqu’au versant méridional du Jébusien[a] — c’est-à-dire Jérusalem[b]. La frontière remonta jusqu’au sommet de la montagne située à l’ouest[c] de la vallée de Hinnom, à l’extrémité nord de la vallée des Refaïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’épaule du Jébusien » ; « versant » rend ici l’emploi topographique d’« épaule ».
    reason: lexical_alternative
  - marker: b
    text: Ou « celle-ci est Jérusalem ». L’hébreu identifie explicitement le « Jébusien » à Jérusalem.
    reason: alternative_reading
  - marker: c
    text: Littéralement « vers la mer », expression hébraïque courante pour désigner l’ouest.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: Puis la frontière montait / La frontière montait ensuite
  rationale: Dans la description successive d’une frontière, le qal de עלה indique que la ligne remonte. L’imparfait descriptif français présente naturellement son parcours, tandis que « puis » et « ensuite » en marquent la progression.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: Dans le contexte d’un partage territorial, גְּבוּל désigne la ligne qui délimite le territoire.
- source_word: גֵּי בֶן הִנֹּם
  choice: la vallée de Ben-Hinnom
  rationale: La translittération conserve le caractère toponymique de l’expression sans la surtraduire par « fils de Hinnom ».
- source_word: כֶּתֶף
  choice: le flanc
  rationale: Le sens premier est « épaule », mais son emploi topographique désigne le côté ou le versant d’un relief. « Flanc » reste imagé tout en étant naturel en français.
- source_word: הַיְבוּסִי
  choice: le Jébusien
  rationale: La forme hébraïque désigne ici le site associé aux Jébusiens sans ajouter explicitement « ville » ou « territoire ».
- source_word: מִנֶּגֶב
  choice: du côté sud
  rationale: Cette formulation rend la localisation sur le côté méridional tout en évitant de donner à la préposition un mouvement trop précis que le contexte ne garantit pas.
- source_word: הִיא יְרוּשָׁלִָם
  choice: c’est Jérusalem
  rationale: Le pronom et le nom de lieu forment une identification en apposition. La note conserve aussi la possibilité d’une traduction plus littérale.
- source_word: רֹאשׁ הָהָר
  choice: le sommet de la montagne
  rationale: רֹאשׁ désigne ici le point culminant du relief; « sommet » est la formulation géographique française la plus naturelle.
- source_word: אֲשֶׁר עַל פְּנֵי
  choice: qui fait face à
  rationale: L’expression situe la montagne en vis-à-vis de la vallée. « Fait face à » en préserve mieux la valeur spatiale qu’un simple « se trouve ».
- source_word: יָמָּה
  choice: à l’ouest
  rationale: L’adverbe signifie littéralement « vers la mer », idiome directionnel hébreu usuel pour l’ouest.
- source_word: בִּקְצֵה ... צָפֹנָה
  choice: à l’extrémité nord de
  rationale: La combinaison exprime l’extrémité située au nord de la vallée.
- source_word: עֵמֶק רְפָאִים
  choice: la vallée des Refaïm
  rationale: Le nom est conservé comme toponyme, sans trancher ici la question de l’identité des Refaïm.
theological_decisions:
- issue: Référent de הִיא dans l’identification avec Jérusalem
  choice: c’est Jérusalem
  alternative: celle-ci est Jérusalem
  rationale: La formulation principale rend naturellement l’apposition explicative, tandis que la note signale la construction pronominale littérale sans imposer un référent plus précis que l’hébreu.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe suit le mouvement de l’itinéraire sans alourdir la phrase. Les toponymes sont translittérés, et les images ou ambiguïtés significatives de l’hébreu sont conservées dans le texte ou signalées en note.
