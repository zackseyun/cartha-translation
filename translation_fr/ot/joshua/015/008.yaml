revisions:
- from: Puis la frontière montait par la vallée de Ben-Hinnom jusqu’au flanc[a] du Jébusien, du côté sud — c’est Jérusalem[b]. La frontière montait ensuite jusqu’au sommet de la montagne qui fait face à la vallée de Hinnom, à l’ouest[c], à l’extrémité nord de la vallée des Refaïm.
  to: Puis la frontière remonta par la vallée de Ben-Hinnom jusqu’au versant méridional du Jébusien[a] — c’est-à-dire Jérusalem[b]. La frontière remonta jusqu’au sommet de la montagne située à l’ouest[c] de la vallée de Hinnom, à l’extrémité nord de la vallée des Refaïm.
  rationale: La révision explicite la position occidentale de la montagne par rapport à la vallée de Hinnom, conformément à l’hébreu, et améliore la précision topographique du premier segment. Les notes conservent les alternatives lexicales et la construction identificatrice sans en surinterpréter le référent.
