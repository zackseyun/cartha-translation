  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: fr
  text: 'et Guéderoth, Beth-Dagon[a], Naama et Maqqéda : seize villes avec leurs villages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Dagon signifie littéralement « maison de Dagon » ; ici, l’expression sert de nom de lieu et est donc translittérée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: Guéderoth
  rationale: Nom de lieu précédé de la conjonction hébraïque. Il est translittéré selon un usage français naturel; la conjonction n’a pas à être reproduite en tête de cet extrait de liste.
- source_word: בֵּית דָּגוֹן
  choice: Beth-Dagon
  rationale: Toponyme composé de בֵּית (« maison de ») et du nom Dagon. Comme il s’agit ici d’un nom de lieu, la translittération est retenue plutôt que la traduction littérale.
- source_word: וְ/נַעֲמָה
  choice: Naama
  rationale: Nom propre de lieu translittéré sous une forme française simple, sans signes diacritiques savants.
- source_word: וּ/מַקֵּדָה
  choice: Maqqéda
  rationale: Nom propre de lieu translittéré en conservant le redoublement consonantique signalé par le dagesh et une vocalisation lisible en français.
- source_word: עָרִים
  choice: villes
  rationale: Dans cette liste territoriale, le terme désigne des centres habités; « villes » est le rendu français conventionnel et adéquat.
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: seize
  rationale: Rendu direct du nombre cardinal qui dénombre les villes.
- source_word: וְ/חַצְרֵיהֶן
  choice: avec les villages qui en dépendaient
  rationale: חֲצֵרִים désigne ici les localités rurales rattachées aux villes. Cette formulation naturelle explicite la relation administrative implicite dans la formule géographique.
theological_decisions: []
