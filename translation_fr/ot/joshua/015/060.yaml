  text: קִרְיַת בַּ֗עַל הִ֛יא קִרְיַ֥ת יְעָרִ֖ים וְ/הָֽ/רַבָּ֑ה עָרִ֥ים שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: fr
  text: 'Qiriath-Baal (c’est-à-dire Qiriath-Yéarim) et Rabba : deux villes avec les localités qui en dépendaient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: Qiriath-Baal
  rationale: Nom de lieu translittéré plutôt que traduit; la graphie française « Qiriath » rend le nom propre de façon conventionnelle et lisible.
- source_word: הִיא
  choice: c’est-à-dire
  rationale: Le pronom a ici une fonction explicative et identifie Qiriath-Baal à Qiriath-Yéarim.
- source_word: קִרְיַת יְעָרִים
  choice: Qiriath-Yéarim
  rationale: Nom propre translittéré; l’accent facilite une prononciation française proche de la forme hébraïque.
- source_word: הָרַבָּה
  choice: Rabba
  rationale: Nom de lieu translittéré; l’article hébreu n’est pas reproduit, conformément à l’usage naturel des noms géographiques en français.
- source_word: עָרִים שְׁתַּיִם
  choice: deux villes
  rationale: Rendu direct de l’expression récapitulative dans cette liste territoriale.
- source_word: חַצְרֵיהֶן
  choice: les localités qui en dépendaient
  rationale: Dans ce contexte, le terme désigne des habitats secondaires rattachés aux villes nommées; cette formulation moderne exprime clairement cette relation sans imposer une taille précise.
theological_decisions: []
