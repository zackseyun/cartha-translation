  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: fr
  text: La frontière occidentale était la Grande Mer, qui servait de limite[a]. Telle était, tout autour, la frontière des fils de Juda, selon leurs clans[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « vers la mer, la Grande Mer, et [sa] limite » ; il s’agit de la mer Méditerranée, qui constituait la limite occidentale de Juda.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « selon leurs familles ». Le terme hébreu désigne ici les groupes familiaux, ou clans, au sein de la tribu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: La frontière occidentale
  rationale: Dans les descriptions territoriales, יָם (« mer ») désigne idiomatiquement le côté de la mer, donc l’ouest, puisque la Méditerranée se trouve à l’ouest du pays.
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: la Grande Mer
  rationale: Cette désignation géographique traditionnelle renvoie à la mer Méditerranée. La majuscule indique qu’il s’agit d’un nom géographique.
- source_word: וּגְבוּל
  choice: qui servait de limite
  rationale: La reprise concise de גְּבוּל après « la Grande Mer » présente celle-ci comme la limite territoriale. Cette formulation française restitue clairement cette valeur sans reproduire une juxtaposition obscure.
- source_word: זֶה גְּבוּל
  choice: Telle était […] la frontière
  rationale: La proposition hébraïque est sans verbe exprimé. L’imparfait convient au récit décrivant l’attribution ancienne du territoire.
- source_word: בְּנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: La formulation conserve l’expression filiale masculine de l’hébreu, qui désigne collectivement les descendants formant la tribu de Juda.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’expression résume l’ensemble des frontières qui entouraient le territoire attribué à Juda.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans le contexte des répartitions tribales, מִשְׁפָּחָה désigne les groupes de parenté, ou clans, constituant la tribu.
theological_decisions:
- issue: Désignation tribale genrée dans בְּנֵי יְהוּדָה
  choice: les fils de Juda
  alternative: les descendants de Juda / les gens de Juda
  rationale: Aucun enjeu doctrinal particulier n’est impliqué, mais la formulation retenue préserve l’expression masculine et filiale du texte hébreu, employée collectivement pour la tribu.
translation_notes:
  register: Français international moderne, clair et digne. « Frontière occidentale » explicite l’idiome géographique hébreu, tandis que « Grande Mer » conserve la désignation biblique traditionnelle. La légère répétition de « frontière » reflète celle du texte source et convient à la conclusion formelle de la description territoriale.
