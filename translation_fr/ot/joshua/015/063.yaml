  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: fr
  text: Mais les descendants de Juda ne purent pas déposséder les Jébusites qui habitaient Jérusalem. Les Jébusites[a] ont donc habité avec les descendants de Juda à Jérusalem jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici le singulier collectif : « le Jébusite habita avec/parmi les descendants de Juda ».'
    reason: Signaler à la fois le singulier ethnique collectif et l’ambiguïté légère de la relation rendue par « avec ».
lexical_decisions:
- source_word: וְאֶת
  choice: Mais
  rationale: La conjonction introduit ici, après la description du territoire attribué, une exception contrastive. « Mais » rend naturellement cette fonction discursive.
- source_word: הַיְבוּסִי
  choice: les Jébusites
  rationale: Le nom ethnique est morphologiquement singulier en hébreu, mais il désigne collectivement le peuple jébusite ; le pluriel est naturel en français.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: qui habitaient Jérusalem
  rationale: Le participe identifie les Jébusites comme les habitants de la ville. Cette proposition relative est claire et idiomatique en français moderne.
- source_word: לֹא יוכלו
  choice: ne purent pas
  rationale: Le verbe exprime une incapacité dans un récit au passé. Le passé simple convient au registre narratif biblique tout en restant intelligible.
- source_word: בְנֵי יְהוּדָה
  choice: les descendants de Juda
  rationale: L’expression hébraïque signifie littéralement « les fils de Juda », mais désigne collectivement les membres de la tribu. « Les descendants de Juda » conserve le lien généalogique sans suggérer qu’il s’agit uniquement des fils immédiats ou des hommes.
- source_word: לְהוֹרִישָׁם
  choice: déposséder
  rationale: Dans ce contexte de conquête, le hiphil de ירשׁ signifie faire perdre à un groupe la possession de son territoire. « Déposséder » est précis et n’ajoute pas nécessairement l’idée d’une expulsion physique complète.
- source_word: וַיֵּשֶׁב
  choice: habitèrent
  rationale: Le verbe décrit l’établissement ou la résidence des Jébusites ; « habitèrent », avec « jusqu’à ce jour », exprime une situation commencée dans le passé et prolongée jusqu’au temps du narrateur.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: avec les descendants de Juda
  rationale: Après le verbe « habiter », אֶת présente une construction inhabituelle. Le contexte indique une coexistence ; « avec » la rend clairement sans préciser davantage la nature des rapports entre les groupes.
- source_word: בִּירוּשָׁלַם
  choice: à Jérusalem
  rationale: Rendu locatif français naturel du syntagme hébreu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française consacrée et fidèle, indiquant que la situation persistait au moment où le narrateur écrivait.
theological_decisions:
- issue: Sens collectif de בְנֵי יְהוּדָה
  choice: les descendants de Juda
  alternative: les fils de Juda
  rationale: Le groupe tribal dans son ensemble est visé. La traduction retenue préserve l’idée de filiation tout en évitant de limiter indûment la référence aux seuls hommes ou aux fils immédiats.
- issue: Relation exprimée par וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה
  choice: les Jébusites habitèrent avec les descendants de Juda
  alternative: les Jébusites habitèrent parmi les descendants de Juda
  rationale: La construction hébraïque est inhabituelle et permet une nuance entre « avec » et « parmi ». « Avec » préserve sobrement l’idée de coexistence sans imposer une assimilation ou une relation particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif soutenu sans archaïsme lexical. « Descendants de Juda » explicite la portée tribale de l’idiome hébreu, tandis que la note conserve la forme collective et l’ambiguïté de la dernière proposition.
