  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: fr
  text: Puis elle passait vers Atsmon et atteignait le torrent d’Égypte[a]. Les extrémités de la frontière étaient du côté de la mer. Voilà quelle sera pour vous la frontière du sud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oued d’Égypte ». Le mot hébreu naḥal désigne souvent un cours d’eau saisonnier ou son lit. La traduction traditionnelle « fleuve d’Égypte » pourrait faire penser à tort au Nil dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Puis elle passait
  rationale: Dans le tracé d’une frontière, עבר décrit la poursuite de son parcours. L’imparfait convient à la description géographique en français sans suggérer nécessairement le franchissement d’un obstacle.
- source_word: עַצְמוֹנָה
  choice: vers Atsmon
  rationale: Le ה directionnel indique un mouvement vers ce lieu. Le nom propre est translittéré sous la forme française naturelle « Atsmon ».
- source_word: וְיָצָא
  choice: et débouchait
  rationale: Dans un itinéraire frontalier, יצא indique que la limite atteint un point ou y aboutit. « Débouchait » conserve l’image spatiale tout en étant idiomatique.
- source_word: נַחַל מִצְרַיִם
  choice: au torrent d’Égypte
  rationale: נחל désigne souvent un cours d’eau, fréquemment saisonnier, ou son lit. « Torrent » est naturel en français et évite d’identifier trop facilement ce lieu au Nil.
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: La frontière aboutissait à la mer
  rationale: תוצאות הגבול désigne l’issue ou l’extrémité de la frontière, tandis que ימה signifie ici « vers la mer ». La formulation rend clairement l’aboutissement à la Méditerranée sans alourdir le texte.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: Telle sera pour vous la frontière sud
  rationale: נֶגֶב est ici directionnel et signifie « sud », plutôt que le nom propre de la région du Néguev. La formulation conserve le futur et le pronom pluriel לָכֶם.
