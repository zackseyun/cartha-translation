lexical_decisions:
- source_word: יִזְרְעֶאל
  choice: Yizréel
  rationale: Nom de lieu translittéré selon une forme française proche de l’hébreu; l’accent facilite la prononciation en français et permet de distinguer ce toponyme de la forme française traditionnelle d’Israël.
- source_word: יָקְדְעָם
  choice: Yoqdeam
  rationale: Nom de lieu rare, translittéré directement de l’hébreu; « q » représente le qoph et conserve la structure du nom sans dépendre de la convention anglaise « Jokdeam ».
- source_word: זָנוֹחַ
  choice: Zanoah
  rationale: Nom de lieu translittéré; cette graphie française usuelle rend les principales consonnes hébraïques, sans tenter de traduire le nom.
- source_word: וְ
  choice: et
  rationale: La conjonction préfixée relie les noms d’une liste simple; en français naturel, les virgules et un « et » final suffisent.
