  text: Baala[a], Iyyim[b] et Atsem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines versions donnent « Bala », sans doute sous l’influence de listes parallèles de villes ; le texte massorétique porte « Baala ».
    reason: alternative_reading
  - marker: b
    text: Le nom « Iyyim » peut être apparenté au mot hébreu désignant des ruines ou des monceaux ; ici, il est traité comme un nom de lieu et translittéré.
    reason: lexical_alternative
  - marker: c
    text: On rencontre aussi les formes « Azem » ou « Ézem » dans certaines traductions ; « Atsem » représente plus directement la vocalisation et les consonnes hébraïques de ce verset en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Nom de lieu translittéré selon les usages naturels du français. La finale hébraïque ה n’impose pas un h graphique en français, et la vocalisation massorétique soutient Baala plutôt que Bala.
- source_word: עִיִּים
  choice: Iyim
  rationale: Dans cette liste de villes, le mot est compris comme un nom propre et translittéré. « Iyim » représente de façon lisible la vocalisation hébraïque sans traduire le sens lexical possible du nom.
- source_word: עָצֶם
  choice: Atsem
  rationale: 'Nom de lieu translittéré directement d’après la vocalisation massorétique : la voyelle initiale est a, et ts rend clairement la consonne צ en français.'
- source_word: וְ / וָ
  choice: et
  rationale: Les deux formes du préfixe conjonctif relient les derniers éléments d’une simple énumération; le français naturel emploie « et » avant le dernier nom seulement.
