  text: וּ/מַעֲרָ֥ת וּ/בֵית עֲנ֖וֹת וְ/אֶלְתְּקֹ֑ן עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: fr
  text: 'Maarath, Beth-Anoth et Elteqôn : six villes avec leurs villages[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec leurs localités rurales » ou « avec leurs hameaux ». Le terme hébreu désigne ici des lieux ruraux associés aux villes mentionnées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲרָת
  choice: Maarath
  rationale: Nom de lieu translittéré selon une forme française claire; la conjonction initiale s’intègre naturellement à l’énumération.
- source_word: וּ/בֵית עֲנוֹת
  choice: Beth-Anoth
  rationale: Nom de lieu composé, translittéré et relié par un trait d’union pour en rendre la structure reconnaissable.
- source_word: וְ/אֶלְתְּקֹן
  choice: Elteqôn
  rationale: Nom propre translittéré; « q » représente le qof hébreu et l’accent circonflexe signale la voyelle longue sans alourdir la lecture.
- source_word: עָרִים שֵׁשׁ
  choice: six villes
  rationale: Rend directement le nom et le nombre tout en conservant la tension du texte, qui annonce six villes bien que ce verset n’en nomme que trois.
- source_word: וְ/חַצְרֵי/הֶן
  choice: avec les villages qui en dépendaient
  rationale: Dans les listes territoriales, חָצֵר désigne des localités rurales rattachées aux villes; cette formulation française exprime clairement ce rapport de dépendance.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. L’énumération demeure concise, et l’indication « six villes » est conservée telle quelle malgré le fait que le verset ne donne ici que trois noms, afin de ne pas résoudre silencieusement une difficulté textuelle ou contextuelle.
