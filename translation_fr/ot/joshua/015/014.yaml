  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: fr
  text: 'Caleb chassa[a] de là les trois fils d’Anak : Shéshaï, Ahimân et Talmaï, les enfants d’Anak[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les déposséda ». Le verbe hébreu peut souligner le fait de prendre possession d’un lieu en en chassant ses occupants.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui étaient nés d’Anak ». Le verset emploie deux expressions généalogiques apparentées pour désigner le même groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: chassa
  rationale: À la forme causative, le verbe ירשׁ signifie ici faire perdre à quelqu’un sa possession, donc « déposséder » ou « chasser ». Avec des personnes comme complément, « chassa » est naturel en français et convient au contexte.
- source_word: מִשָּׁם
  choice: de là
  rationale: Rendu locatif direct, idiomatique et concis.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: les trois fils d’Anak
  rationale: Cette traduction conserve l’expression généalogique formelle de l’hébreu sans la réduire au terme interprétatif « Anakites ».
- source_word: שֵׁשַׁי
  choice: Shéshaï
  rationale: Translittération française usuelle du nom hébreu.
- source_word: אֲחִימַן
  choice: Ahimân
  rationale: Translittération française claire du nom hébreu.
- source_word: תַּלְמַי
  choice: Talmaï
  rationale: Translittération française usuelle du nom hébreu.
- source_word: יְלִידֵי הָעֲנָק
  choice: descendants d’Anak
  rationale: L’expression désigne littéralement ceux qui sont nés d’Anak. « Descendants d’Anak » communique naturellement l’appartenance à sa lignée tout en évitant la formulation potentiellement trop étroite « enfants d’Anak ».
