lexical_decisions:
- source_word: צִקְלַג
  choice: Tsiklag
  rationale: Nom de lieu translittéré selon sa forme hébraïque; « Tsiklag » rend naturellement en français la consonne initiale צ et correspond à l’usage biblique français courant.
- source_word: מַדְמַנָּה
  choice: Madmanna
  rationale: Nom de lieu translittéré. La forme française « Madmanna » reflète le redoublement consonantique signalé par le dagesh, sans ajouter le h final propre aux conventions anglaises.
- source_word: סַנְסַנָּה
  choice: Sansanna
  rationale: Nom de lieu translittéré. « Sansanna » reflète la forme hébraïque et adapte la finale ה aux conventions françaises, sans h final.
- source_word: וְ
  choice: et
  rationale: La conjonction préfixée relie les noms de lieux; dans une énumération française, les virgules séparent les premiers éléments et « et » introduit le dernier.
