id: JOS.15.13
reference: Joshua 15:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: fr
  text: 'À Caleb, fils de Yefounné, il donna une part au milieu des descendants de Juda, conformément à l’ordre donné par Yahweh à Josué : Qiryath-Arba (Arba était le père d’Anaq[a]), c’est-à-dire Hébron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Père d’Anaq » peut aussi signifier « ancêtre d’Anaq » ou « fondateur d’Anaq ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב
  choice: À Caleb
  rationale: Le waw relie ce verset au contexte précédent; en français, la continuité peut rester implicite afin d’éviter une ouverture lourde par « Et à Caleb ».
- source_word: בֶּן יְפֻנֶּה
  choice: fils de Yefounné
  rationale: La construction filiale est directe; le nom propre est translittéré dans une forme adaptée au français.
- source_word: נָתַן חֵלֶק
  choice: il donna une part
  rationale: Cette formulation conserve le verbe actif et le sujet implicite du texte hébreu sans préciser abusivement qui agit.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: au milieu des descendants de Juda
  rationale: « Au milieu de » rend בְּתוֹךְ, tandis que « descendants de Juda » exprime naturellement en français la désignation tribale littéralement formulée « fils de Juda ».
- source_word: אֶל פִּי יְהוָה
  choice: conformément à l’ordre donné par Yahweh
  rationale: L’expression idiomatique, littéralement « selon la bouche de Yahweh », désigne ici une directive divine. « Donné » clarifie en français le rapport entre l’ordre et Josué sans changer l’agent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לִיהוֹשֻׁעַ
  choice: à Josué
  rationale: La préposition marque naturellement le destinataire de l’ordre divin.
- source_word: קִרְיַת אַרְבַּע
  choice: Qiryath-Arba
  rationale: Le toponyme est translittéré; le trait d’union rend clairement son unité graphique en français.
- source_word: אֲבִי הָעֲנָק
  choice: Arba était le père d’Anaq
  rationale: La parenthèse explicite que « père d’Anaq » qualifie Arba, non la ville, tout en maintenant le sens premier de אָב.
- source_word: הִיא חֶבְרוֹן
  choice: c’est-à-dire Hébron
  rationale: Cette tournure française identifie naturellement Qiryath-Arba à Hébron.
theological_decisions:
- issue: Référent du sujet implicite de « donna »
  choice: Maintenir le sujet implicite par « il donna »
  alternative: Expliciter « Josué donna » ou « Yahweh donna »
  rationale: L’hébreu n’exprime pas le sujet. Le préciser résoudrait une ambiguïté réelle du texte; la traduction la préserve.
- issue: Portée de אֲבִי הָעֲנָק
  choice: « père d’Anaq » avec une note sur l’étendue sémantique
  alternative: « ancêtre d’Anaq » ou « fondateur d’Anaq » dans le texte
  rationale: « Père » reste le correspondant le plus direct de אָב, tandis que la note conserve les autres nuances possibles sans trancher.
translation_notes:
  register: Français international moderne, digne et lisible. Les formes Yefounné, Qiryath-Arba et Anaq privilégient une translittération cohérente avec les consonnes hébraïques; Josué, Juda et Hébron conservent leurs formes françaises usuelles. Le sujet non exprimé en hébreu demeure volontairement non identifié.
