  text: Zanoah[a], En-gannim, Tappuah[c][b], and Enam.
translation:
  language: fr
  text: Zanoah, En-Gannim[a], Tappouah[b] et Énam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Gannim signifie probablement « source des jardins ».
    reason: lexical_alternative
  - marker: b
    text: Tappouah est un nom de lieu; le mot hébreu correspondant peut aussi désigner une pomme ou un arbre fruitier.
    reason: lexical_alternative
  - marker: c
    text: Énam est un nom de lieu; la forme hébraïque comporte l’article et signifie approximativement « les sources ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנוֹחַ
  choice: Zanoah
  rationale: Nom de lieu dans une liste de villes; il est translittéré plutôt que traduit.
- source_word: עֵין גַּנִּים
  choice: En-Gannim
  rationale: Nom de lieu composé de עֵין (« source ») et גַּנִּים (« jardins »). La translittération convient au texte principal, tandis que le sens est signalé en note.
- source_word: תַּפּוּחַ
  choice: Tappouah
  rationale: Ici, le terme fonctionne comme nom de lieu. La graphie « ou » rend naturellement en français la voyelle de la translittération usuelle, sans traduire le toponyme.
- source_word: הָעֵינָם
  choice: Énam
  rationale: Nom de lieu comportant l’article hébreu. Le texte principal emploie une forme francisée concise; la présence de l’article et le sens possible sont indiqués en note.
