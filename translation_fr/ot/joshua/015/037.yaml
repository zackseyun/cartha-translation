translation:
  language: fr
  text: Tsenân, Hadasha et Migdal-Gad[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-Gad pourrait être traduit plus littéralement par « Tour de Gad », mais il est conservé ici comme nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְנָן
  choice: Tsenân
  rationale: Nom de lieu dans la liste territoriale de Juda. La forme française translittère le צ initial par « Ts » et marque la voyelle longue finale.
- source_word: חֲדָשָׁה
  choice: Hadasha
  rationale: Bien que le mot soit apparenté à l’adjectif « nouveau », il fonctionne ici comme un toponyme et est donc translittéré. Le h simple évite d’imposer en français une prononciation de « ch » étrangère à l’hébreu.
- source_word: מִגְדַּל גָּד
  choice: Migdal-Gad
  rationale: Toponyme composé, conservé comme nom propre plutôt que traduit. Le trait d’union rend visible son unité.
- source_word: וַ / וּ
  choice: et
  rationale: Les conjonctions coordonnent les derniers éléments de l’énumération; en français naturel, un seul « et » avant le dernier nom suffit.
theological_decisions: []
translation_notes:
  register: Formulation brève conforme à une liste de villes. Noms propres translittérés selon des conventions lisibles en français moderne; ponctuation française simple et registre digne.
