  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: fr
  text: Puis la frontière monta vers Beth-Hogla, passa au nord de Beth-Araba et monta jusqu’à la pierre de Bohân, fils de Ruben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: montait
  rationale: Dans les descriptions de frontières, le verbe indique que la ligne se poursuit en montant, probablement selon le relief; l’imparfait français convient à la progression descriptive.
- source_word: הַגְּבוּל
  choice: la frontière
  rationale: Le terme désigne ici la ligne délimitant le territoire; « frontière » est naturel et précis en français.
- source_word: בֵּית חָגְלָה
  choice: Beth-Hogla
  rationale: Le nom de lieu est translittéré selon une forme française claire et usuelle.
- source_word: וְעָבַר
  choice: passait
  rationale: Le verbe décrit la poursuite du tracé par rapport à un point géographique; « passait » s’intègre naturellement à la description.
- source_word: מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: au nord de Beth-Araba
  rationale: Dans cette formule de délimitation, la construction situe la frontière du côté nord du lieu nommé.
- source_word: אֶבֶן בֹּהַן
  choice: la pierre de Bohân
  rationale: Cette formulation conserve explicitement le rapport construit de l’hébreu et le caractère de repère géographique.
- source_word: בֶּן רְאוּבֵן
  choice: fils de Ruben
  rationale: La traduction directe préserve l’expression généalogique ou tribale du texte sans la réduire à l’interprétation « Rubénite ».
