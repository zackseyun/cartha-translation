revisions:
- from: Puis la frontière se dirigeait vers le sud, jusqu’à la montée d’Akrabbim[a]. Elle passait par Tsin, montait du sud vers Qadesh-Barnéa, passait par Hetsron, montait jusqu’à Addar, puis tournait en direction de Qarqa[b].
  to: Puis la frontière se dirigea vers le sud, jusqu’à la montée d’Akrabbim[a]. Elle passa par Tsin, monta du sud vers Qadesh-Barnéa, passa par Hetsron, monta jusqu’à Addar, puis tourna en direction de Karka[b].
  rationale: La révision se limite à employer le passé simple pour la succession narrative et à normaliser prudemment la graphie principale du dernier toponyme, tout en conservant les variantes en note. Le sens du trajet, y compris la montée depuis le sud vers Qadesh-Barnéa, demeure inchangé.
