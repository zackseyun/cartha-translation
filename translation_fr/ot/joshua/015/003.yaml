  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: fr
  text: Puis la frontière se dirigea vers le sud, jusqu’à la montée d’Akrabbim[a]. Elle passa par Tsin, monta du sud vers Qadesh-Barnéa, passa par Hetsron, monta jusqu’à Addar, puis tourna en direction de Karka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Akrabbim signifie probablement « scorpions » en hébreu. Il est conservé ici comme nom de lieu.
    reason: lexical_alternative
  - marker: b
    text: La graphie de ce nom de lieu varie dans les translittérations ; on trouve aussi « Qarqaa » ou « Qarqa ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא אֶל מִנֶּגֶב
  choice: Puis la frontière se dirigeait vers le sud
  rationale: Dans cette description territoriale, le sujet implicite est la frontière. « Se dirigeait » exprime naturellement la progression de la ligne frontière, tandis que « vers le sud » conserve l’orientation donnée par le texte.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: jusqu’à la montée d’Akrabbim
  rationale: מַעֲלֵה désigne une montée ou un passage en pente. Le toponyme עַקְרַבִּים est translittéré plutôt que traduit.
- source_word: וְעָבַר צִנָה
  choice: Elle passait par Tsin
  rationale: Dans une formule de délimitation, עבר décrit le passage de la frontière par un lieu. Le hé directionnel de צִנָה indique le mouvement vers Tsin sans exiger que le français précise si la ligne traversait exactement le site.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: montait du sud vers Qadesh-Barnéa
  rationale: Cette formulation rend le mouvement ascendant et la provenance méridionale exprimée par מִנֶּגֶב, sans transformer le texte en simple indication de position au sud de Qadesh-Barnéa.
- source_word: וְעָבַר חֶצְרוֹן
  choice: passait par Hetsron
  rationale: « Passer par » convient à la progression d’une frontière et conserve Hetsron comme nom de lieu.
- source_word: וְעָלָה אַדָּרָה
  choice: montait jusqu’à Addar
  rationale: Le verbe עלה garde son sens topographique de montée, et le hé directionnel attaché au nom indique la direction vers Addar.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: puis tournait en direction de Qarqa
  rationale: נסב marque un changement de direction de la frontière. « En direction de » respecte le mouvement vers le lieu sans affirmer plus précisément que le texte si la ligne l’atteignait.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’ajout explicite de « la frontière » évite une succession de verbes sans sujet naturel en français. L’imparfait présente la ligne frontière dans sa progression descriptive. Les toponymes suivent une translittération francophone cohérente, sans franciser leur sens.
