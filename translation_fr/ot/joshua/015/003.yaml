    issue: Imparfait narratif dans une série d’étapes de frontière
    rationale: « Se dirigeait, passait, montait » après « Puis » est moins idiomatique et affaiblit la séquentialité des verbes hébreux. Le passé simple maintient le registre biblique et la progression du tracé.
  - severity: low
    issue: Présentation de Qarqa comme forme principale et note sur une « transcription incertaine »
    rationale: Le point en cause est la variation de translittération/convention du toponyme, non une incertitude textuelle. Employer « Karka » dans le texte et signaler les autres graphies évite de surinterpréter cette variation.
