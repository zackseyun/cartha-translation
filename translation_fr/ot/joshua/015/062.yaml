  text: וְ/הַ/נִּבְשָׁ֥ן וְ/עִיר הַ/מֶּ֖לַח וְ/עֵ֣ין גֶּ֑דִי עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: fr
  text: 'Et Nibshan, la ville du Sel et En-Guédi : six villes avec leurs localités[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec leurs villages ». Le terme hébreu peut désigner de petites localités dépendant des villes mentionnées.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: Nibshan
  rationale: Nom de lieu translittéré sans représenter séparément l’article hébreu, conformément à l’usage français pour ce toponyme.
- source_word: עִיר הַמֶּלַח
  choice: la Ville du Sel
  rationale: Le syntagme construit signifie littéralement « ville du sel ». La traduction conserve le sens transparent du toponyme dans une forme française naturelle.
- source_word: עֵין גֶּדִי
  choice: En-Guédi
  rationale: Forme française traditionnelle et reconnaissable de ce nom de lieu; la translittération est préférable à la traduction littérale de ses éléments.
- source_word: עָרִים שֵׁשׁ
  choice: six villes
  rationale: Rendu direct du résumé numérique; « villes » convient au vocabulaire des listes territoriales sans préjuger de la taille moderne des sites.
- source_word: חַצְרֵיהֶן
  choice: les localités qui en dépendaient
  rationale: Le terme désigne des lieux secondaires, souvent non fortifiés, rattachés aux villes énumérées. Cette formulation explicite naturellement la relation de dépendance sans imposer la catégorie plus précise de « villages ».
- source_word: וְ
  choice: et
  rationale: Les conjonctions structurent l’énumération. En français, elles sont rendues là où l’usage naturel l’exige, sans reproduire mécaniquement chaque occurrence.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe d’énumération est allégée selon l’usage français, tandis que les noms propres et le résumé territorial sont conservés.
