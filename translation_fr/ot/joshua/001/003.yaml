source:
  edition: WLC
  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: fr
  text: Tout lieu que foulera la plante de votre pied[a], je vous l’ai donné, comme je l’ai dit à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Tout endroit où se posera la plante de votre pied ».'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: Tout lieu
  rationale: 'Avec כָּל, מָקוֹם prend ici un sens distributif : chaque lieu concerné. « Tout lieu » est naturel en français et conserve la portée de la promesse.'
- source_word: אֲשֶׁר ... בּוֹ
  choice: que
  rationale: La construction relative hébraïque comporte littéralement un élément repris par « en lui ». En français, « tout lieu que foulera… » exprime naturellement le rapport avec le lieu sans reproduire cette reprise.
- source_word: תִּדְרֹךְ
  choice: foulera
  rationale: Le verbe דרך désigne l’action de poser le pied, de fouler. Le futur convient en français dans la relative qui définit l’étendue encore à parcourir, sans transformer le don divin en promesse future.
- source_word: כַּף רַגְלְכֶם
  choice: la plante de votre pied
  rationale: כַּף רֶגֶל désigne concrètement la plante du pied. Le singulier distributif conserve l’image hébraïque malgré le suffixe pluriel de « votre ».
- source_word: לָכֶם נְתַתִּיו
  choice: je vous l’ai donné
  rationale: Le pronom objet de נְתַתִּיו renvoie au lieu, et לָכֶם indique les bénéficiaires. Le passé composé rend l’accompli hébreu et présente le don comme établi.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » marque simplement la correspondance avec la parole antérieure adressée à Moïse, sans surcharger l’expression.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: je l’ai dit à Moïse
  rationale: Dans ce contexte, דבר אל peut être rendu idiomatiquement par « dire à ». Le pronom « l’ » reprend le contenu annoncé sans expliciter celui-ci comme une promesse.
theological_decisions:
- issue: Aspect du don divin
  choice: « je vous l’ai donné »
  alternative: « je vous le donne » ou « je vous le donnerai »
  rationale: L’accompli נְתַתִּיו présente le don comme déjà accordé et certain, même si sa prise de possession doit encore se déployer. Le passé composé préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. « Fouler » conserve l’image concrète du texte tout en restant intelligible. Le pluriel « votre » s’adresse collectivement à Josué et au peuple, tandis que « pied » demeure au singulier distributif.
