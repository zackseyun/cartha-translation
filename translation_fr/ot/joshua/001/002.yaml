  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: fr
  text: 'Moïse, mon serviteur, est mort. À présent, lève-toi : traverse ce Jourdain, toi et tout ce peuple, pour entrer dans le pays que je donne aux fils d’Israël[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: Alternative lexicale et précision sur la forme masculine de la désignation collective hébraïque.
lexical_decisions:
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, le terme exprime la relation honorable de Moïse à Dieu sans mettre l’accent sur un statut servile; « mon serviteur » convient donc au contexte.
- source_word: מֵת
  choice: est mort
  rationale: L’accompli présente la mort de Moïse comme un fait actuel qui fonde la mission donnée à Josué. « Est mort » conserve la brièveté et la force de l’hébreu.
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: 'La combinaison de la conjonction et de l’adverbe marque à la fois la transition et la conséquence: puisque Moïse est mort, Josué doit désormais agir.'
- source_word: קוּם
  choice: lève-toi
  rationale: Dans cet appel à une action décisive, « lève-toi » est naturel en français tout en gardant la dignité de l’ordre divin.
- source_word: עֲבֹר אֶת־הַיַּרְדֵּן הַזֶּה
  choice: traverse ce Jourdain
  rationale: Avec le Jourdain comme objet direct, עָבַר signifie le franchir. Le démonstratif « ce » reproduit הַזֶּה sans ajouter « fleuve », absent de l’hébreu.
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: toi et tout ce peuple
  rationale: Cette formulation conserve le pronom emphatique, le nom collectif singulier et le démonstratif de l’hébreu.
- source_word: אֶל־הָאָרֶץ
  choice: pour entrer dans le pays
  rationale: Après l’ordre de traverser le Jourdain, אֶל indique le mouvement vers l’intérieur du pays. Cette tournure rend naturellement en français l’idée d’entrée dans le territoire.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: que je leur donne
  rationale: Le participe נֹתֵן présente le don comme en cours ou imminent. Le présent français garde cette perspective, tandis que « leur » rend explicitement לָהֶם.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: à eux, les fils d’Israël
  rationale: La reprise disloquée conserve à la fois le pronom לָהֶם et sa précision par לִבְנֵי יִשְׂרָאֵל. « Fils d’Israël » reflète formellement le masculin pluriel hébreu, même si la désignation vise collectivement le peuple d’Israël.
theological_decisions:
- issue: Désignation collective genrée dans לִבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: L’hébreu emploie explicitement le pluriel masculin « fils », tout en désignant le peuple de l’alliance dans son ensemble. Le texte principal préserve cette forme; une note signale les rendus collectifs français possibles sans réduire la portée du référent aux seuls hommes.
translation_notes:
  register: Français moderne, international et digne. La formulation reste directe et solennelle sans archaïsmes. « Maintenant donc » marque clairement la transition causale, et la reprise « à eux, les fils d’Israël » préserve la structure explicative de l’hébreu malgré sa légère emphase en français.
