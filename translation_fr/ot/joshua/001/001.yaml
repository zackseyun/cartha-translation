id: JOS.1.1
reference: Joshua 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: fr
  text: 'Après la mort de Moïse, serviteur de Yahweh, Yahweh dit à Josué, fils de Noun, l’assistant de Moïse[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui servait Moïse » ; le terme peut aussi se traduire par « auxiliaire » ou « serviteur de Moïse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Après…
  rationale: La formule narrative ouvre la scène. En français moderne, la proposition temporelle suffit à marquer la transition, sans ajouter un « alors » qui pourrait suggérer un élément temporel plus explicite.
- source_word: אַחֲרֵי מוֹת מֹשֶׁה
  choice: Après la mort de Moïse
  rationale: Rendu direct et idiomatique de la proposition temporelle.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: Dans ce titre honorifique appliqué à Moïse, « serviteur » exprime le service officiel et fidèle envers Dieu sans imposer l’idée plus étroite d’un statut d’esclave.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel, plutôt que substitution par un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Équivalent français naturel du verbe courant אמר dans l’introduction d’un discours direct.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Formes françaises usuelles des noms, avec le patronyme rendu explicitement.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: l’assistant de Moïse
  rationale: Le participe désigne celui qui assiste une personne et se tient à son service. « Assistant » est actuel et clair, sans les connotations ecclésiastiques possibles de « ministre ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français moderne les paroles qui suivent et remplissent la fonction discursive de l’infinitif « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte hébreu emploie le tétragramme comme nom propre. « Yahweh » le conserve explicitement au lieu de le remplacer par un titre.
- issue: Sens de עֶבֶד dans le titre de Moïse
  choice: serviteur
  alternative: esclave
  rationale: Dans l’expression honorifique עֶבֶד יְהוָה, « serviteur » rend mieux la fonction et la fidélité de Moïse, sans effacer la gamme sémantique générale du mot.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Yahweh » est conservée parce qu’elle se trouve dans l’hébreu. Le marqueur de note est placé après « l’assistant de Moïse », expression à laquelle la note se rapporte.
