source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: fr
  text: jusqu’à ce que Yahweh accorde à vos frères[a] le repos qu’il vous a accordé et qu’eux aussi prennent possession du pays que Yahweh, votre Dieu, leur donne. Alors vous retournerez dans le pays qui est votre héritage et vous en prendrez possession, celui que Moïse, serviteur de Yahweh, vous a donné de l’autre côté du Jourdain, vers le soleil levant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les autres Israélites » ; l’hébreu dit « vos frères », terme masculin pluriel qui désigne ici les membres des autres tribus d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou simplement « à l’est » ; littéralement « vers le soleil levant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: accorde du repos
  rationale: Le hiphil de נוח exprime ici le fait d’accorder le repos et la sécurité après les combats; « accorder du repos » est naturel et conserve le motif théologique du repos.
- source_word: לַאֲחֵיכֶם
  choice: à vos frères
  rationale: Le texte hébreu emploie le masculin pluriel « vos frères »; le contexte désigne les membres des autres tribus d’Israël, précision donnée en note.
- source_word: כָּכֶם
  choice: comme à vous
  rationale: L’hébreu est elliptique, littéralement « comme vous ». Le français reprend sans lourdeur l’idée du repos déjà accordé aux tribus établies à l’est du Jourdain.
- source_word: וְיָרְשׁוּ
  choice: prennent possession
  rationale: Dans le contexte de la conquête et de l’attribution du pays, ירשׁ signifie entrer effectivement en possession d’un territoire accordé en héritage.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « le pays » est idiomatique en français et désigne la terre promise aux tribus d’Israël.
- source_word: נֹתֵן
  choice: leur donne
  rationale: Le participe présente le don divin comme actuel ou en cours d’accomplissement; le présent français convient naturellement.
- source_word: וְשַׁבְתֶּם
  choice: Alors, vous retournerez
  rationale: La forme verbale fait avancer la séquence; « alors » explicite naturellement la succession temporelle.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: le pays qui est votre possession
  rationale: Cette formulation conserve l’idée d’un territoire attribué et possédé, ainsi que le lien lexical avec le verbe qui suit.
- source_word: וִירִשְׁתֶּם אוֹתָהּ
  choice: vous en prendrez possession
  rationale: La répétition de « prendre possession » reproduit celle de la racine ירשׁ et convient à l’occupation effective du territoire attribué.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: Pour Moïse, עבד est un titre honorifique de service officiel envers Dieu; « serviteur » convient mieux que « esclave » dans ce contexte.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Expression géographique française naturelle qui conserve le point de référence contextuel sans préciser artificiellement une direction.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: vers le soleil levant
  rationale: La formulation préserve l’image concrète de l’hébreu tout en restant digne et compréhensible; le sens géographique est expliqué en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin sans le remplacer par un titre.
- issue: Portée du terme masculin אֲחֵיכֶם
  choice: vos frères
  alternative: les autres Israélites; vos frères et sœurs
  rationale: Le masculin pluriel du texte est conservé, tandis que sa portée contextuelle — les autres tribus d’Israël — est signalée en note sans neutraliser le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la progression du texte hébreu et la répétition de « prendre possession », tout en évitant des tournures excessivement littérales.
