base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: fr
  text: Ne t’ai-je pas ordonné cela ? Sois fort et courageux. Ne sois pas terrifié et ne te décourage pas, car Yahweh[a], ton Dieu, est avec toi partout où tu iras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, le nom divin traditionnellement rendu par « le SEIGNEUR ».
    reason: Précision sur le tétragramme et sur son rendu traditionnel, tout en cohérence avec « Yahweh » dans le texte principal.
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: Ne t’ai-je pas donné cet ordre ?
  rationale: La question rhétorique négative rappelle avec force un ordre déjà donné. Cette formulation est naturelle en français et conserve l’emphase de l’hébreu.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sois fort et courageux
  rationale: Les deux impératifs associent force ou fermeté et courage. La tournure française distingue clairement les deux notions tout en conservant la formule exhortative.
- source_word: אַל תַּעֲרֹץ
  choice: Ne sois pas terrifié
  rationale: Le verbe ערץ exprime une peur intense, voire la terreur, plutôt qu’une crainte générale.
- source_word: וְאַל תֵּחָת
  choice: et ne te laisse pas abattre
  rationale: Au nifal, חתת peut évoquer le fait d’être brisé intérieurement, consterné ou découragé. « Ne te laisse pas abattre » rend naturellement cette atteinte au courage sans la confondre avec la terreur du membre précédent.
- source_word: כִּי עִמְּךָ
  choice: car … est avec toi
  rationale: כִּי introduit ici le motif des impératifs, et עִמְּךָ affirme simplement la présence divine auprès de Josué.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé silencieusement par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le nom porte un suffixe masculin singulier de deuxième personne et signifie directement « ton Dieu ».
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: partout où tu iras
  rationale: L’expression distributive vise tous les lieux où Josué se rendra. Le futur français convient à la mission qui s’ouvre devant lui.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom personnel divin. Le conserver dans le texte principal rend visible cette donnée, tandis qu’une note signale la substitution traditionnelle par un titre.
translation_notes:
  register: 'Français international moderne, direct et digne. Le tutoiement reflète les formes masculines singulières adressées à Josué. Les deux interdictions restent distinctes : terreur d’une part, abattement ou découragement d’autre part.'
