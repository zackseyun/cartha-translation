source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: fr
  text: Seulement, sois fort et très courageux. Veille à observer et à mettre en pratique toute la loi que Moïse, mon serviteur, t’a prescrite. Ne t’en écarte ni à droite ni à gauche, afin que tu agisses avec discernement[a] partout où tu iras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que tu réussisses » ou « afin que tu aies du succès » partout où tu iras.'
    reason: Alternative lexicale pour תַּשְׂכִּיל, qui peut exprimer une conduite avisée ou la réussite qui en découle.
lexical_decisions:
- source_word: רַק
  choice: Seulement
  rationale: Marque la restriction et met en relief l’exhortation essentielle, sans réduire le terme à un simple mot de liaison.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: sois fort et très courageux
  rationale: Rend les deux impératifs complémentaires, qui expriment la fermeté et le courage, tandis que « très » conserve l’intensité de מְאֹד.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: Veille à agir
  rationale: Exprime à la fois l’observation attentive et sa mise en pratique, dans un français naturel.
- source_word: כְּכָל הַתּוֹרָה
  choice: conformément à toute la loi
  rationale: Dans ce contexte, תּוֹרָה désigne l’ensemble des prescriptions transmises par Moïse; « toute » en préserve la portée exhaustive.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: que Moïse, mon serviteur, t’a prescrite
  rationale: Conserve la force normative de צוה ainsi que le titre divin donné à Moïse.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: Ne t’en écarte ni à droite ni à gauche
  rationale: Préserve la métaphore directionnelle d’une déviation hors de la voie prescrite, dans une formulation française idiomatique.
- source_word: לְמַעַן
  choice: afin de
  rationale: Introduit naturellement la finalité ou le résultat visé.
- source_word: תַּשְׂכִּיל
  choice: agir avec discernement
  rationale: Le hiphil de שׂכל évoque une conduite avisée ou prudente, susceptible de mener à la réussite; la formulation principale garde ce noyau sémantique.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: partout où tu iras
  rationale: Rend naturellement la portée générale de l’expression tout en conservant le verbe « aller ».
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte de l’alliance
  choice: loi
  alternative: enseignement, instruction
  rationale: La référence immédiate porte sur ce que Moïse a prescrit; le sens légal et conventionnel est donc premier, sans nier la portée instructive plus large du mot.
- issue: Sens de תַּשְׂכִּיל
  choice: agir avec discernement
  alternative: réussir; avoir du succès
  rationale: L’hébreu peut désigner une conduite avisée ainsi que la réussite qui en résulte. Le texte principal privilégie l’action prudente sans imposer une lecture centrée sur la prospérité, tandis que la note conserve l’autre nuance.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse directe à Josué. La structure hébraïque est légèrement segmentée pour assurer une lecture naturelle sans modifier la progression de l’exhortation.
