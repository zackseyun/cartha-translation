  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: fr
  text: Que ce livre de la Loi ne s’éloigne pas de ta bouche. Médite-le[a] jour et nuit, afin de veiller à mettre en pratique tout ce qui y est écrit. Alors tu feras prospérer ta voie et tu agiras avec sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « Médite-le » peut aussi évoquer le fait de murmurer le texte ou de le réciter à voix basse ; il comporte ici une dimension orale aussi bien que méditative.
    reason: alternative lexicale et préservation de la nuance orale de הגה
lexical_decisions:
- source_word: יָמוּשׁ
  choice: ne s’éloigne pas
  rationale: Le verbe signifie « se retirer, s’éloigner ». Cette formulation conserve l’image concrète d’un livre qui ne doit pas quitter la bouche de Josué.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ce livre de la Loi
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un document. Dans ce contexte d’alliance, תּוֹרָה désigne l’enseignement normatif écrit confié à Josué ; « la Loi » est clair et établi en français.
- source_word: מִפִּיךָ
  choice: de ta bouche
  rationale: 'La traduction conserve l’expression corporelle hébraïque et sa portée orale : dire, réciter et garder le texte sur ses lèvres.'
- source_word: וְהָגִיתָ בּוֹ
  choice: Médite-le
  rationale: הגה peut évoquer à la fois la méditation et une récitation à voix basse. « Médite-le » est naturel en français, tandis que la note préserve explicitement la nuance orale.
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: Cette expression littérale et idiomatique forme un mérisme exprimant la continuité.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: afin de veiller à agir
  rationale: La construction exprime le but et associe une attention vigilante à la mise en pratique.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: conformément à tout ce qui y est écrit
  rationale: Cette formulation rend la totalité exprimée par כְּכָל et maintient l’écrit comme norme de l’action.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: tu feras prospérer ta voie
  rationale: Le hiphil est causatif. La formulation préserve cette valeur plutôt que de réduire le sens à une simple expérience de réussite.
- source_word: תַּשְׂכִּיל
  choice: tu agiras avec sagesse
  rationale: Le hiphil de שכל peut désigner une conduite avisée, avec parfois une réussite qui en résulte. Ce choix maintient la distinction avec צלח, déjà rendu par « faire prospérer ».
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte de l’alliance
  choice: la Loi
  alternative: l’enseignement ; la Torah
  rationale: Le mot peut désigner l’instruction au sens large, mais il renvoie ici au corpus écrit de l’alliance que Josué doit mettre en pratique. « La Loi » en exprime clairement la fonction sans imposer une interprétation confessionnelle particulière.
- issue: Méditation intérieure ou récitation orale
  choice: Médite-le, avec une note signalant la récitation à voix basse
  alternative: Récite-le à voix basse ; murmure-le
  rationale: Le contexte de la « bouche » et le champ sémantique de הגה comportent une dimension orale, mais le verbe peut aussi exprimer la méditation réfléchie. Le texte principal reste naturel et la note conserve l’ambiguïté réelle.
- issue: Rapport entre obéissance, prospérité et sagesse
  choice: Conserver la progression textuelle sans préciser la nature de la prospérité
  alternative: Interpréter la prospérité comme réussite matérielle, militaire ou spirituelle
  rationale: Le verset relie la fidélité au texte à une voie rendue prospère et à une conduite sage, mais ne définit pas ici la prospérité. La traduction ne doit donc pas en restreindre théologiquement le sens.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé puisque l’adresse vise Josué au singulier. La formulation reste proche des images hébraïques tout en évitant les tournures inutilement archaïques.
