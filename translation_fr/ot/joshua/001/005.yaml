source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: fr
  text: Personne[a] ne pourra te résister pendant toute ta vie[b]. De même que j’ai été avec Moïse, je serai avec toi. Je ne te ferai pas défaut[c] et je ne t’abandonnerai pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « Aucun homme ». Le masculin singulier hébreu a ici une portée générique et désigne tout adversaire humain.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « personne ne pourra se tenir devant toi ». Dans ce contexte, l’expression hébraïque peut désigner le fait de résister avec succès.
    reason: lexical_alternative
  - marker: c
    text: Ou « je ne te laisserai pas tomber ». Le verbe hébreu peut évoquer le fait de relâcher sa prise ou de cesser de soutenir quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: ne pourra tenir devant toi
  rationale: Le hitpael de יצב évoque ici le fait de prendre position face à Josué, avec l’idée contextuelle d’une résistance efficace. La formulation française conserve l’image hébraïque tout en explicitant, par « pourra », l’incapacité des adversaires à lui résister.
- source_word: אִישׁ
  choice: Personne
  rationale: אִישׁ est un masculin singulier employé ici avec une portée générique. « Personne » exprime naturellement en français qu’aucun adversaire humain, homme ou femme, ne pourra tenir devant Josué, sans ajouter au texte la notion plus précise d’« ennemi ».
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: La locution signifie littéralement « devant ta face ». Dans ce contexte militaire, « devant toi » conserve l’expression imagée et sa valeur adversative.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: pendant toute ta vie
  rationale: Cette expression désigne la totalité de la vie de Josué. La formulation est plus naturelle en français moderne que le calque « tous les jours de ta vie », sans rien retrancher à sa portée.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: Comme j’ai été avec Moïse
  rationale: כַּאֲשֶׁר établit une comparaison directe entre la présence de Dieu auprès de Moïse et celle qu’il promet à Josué.
- source_word: אֶהְיֶה עִמָּךְ
  choice: je serai avec toi
  rationale: Le futur de היה avec עִם exprime sans détour la promesse de la présence divine, sans en préciser davantage la manière.
- source_word: אַרְפְּךָ
  choice: je ne te ferai pas défaut
  rationale: Le hiphil de רפה peut évoquer le relâchement d’une prise ou la cessation d’un soutien. « Ne pas faire défaut » rend naturellement la fidélité du soutien promis tout en restant distinct d’« abandonner ».
- source_word: אֶעֶזְבֶךָּ
  choice: je ne t’abandonnerai pas
  rationale: עזב signifie laisser ou abandonner. « Abandonner » convient au ton solennel de la promesse et préserve le second élément de la double négation.
theological_decisions:
- issue: Portée du masculin singulier אִישׁ
  choice: Personne
  alternative: Aucun homme
  rationale: 'Le nom hébreu est morphologiquement masculin, mais sa portée est générique dans cette promesse: aucun être humain ne pourra s’opposer avec succès à Josué. En français moderne, « personne » communique cette portée sans laisser croire que la promesse ne concernerait que des adversaires masculins. Une note conserve la forme plus littérale.'
- issue: Sens de la promesse double לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ
  choice: Je ne te ferai pas défaut et je ne t’abandonnerai pas
  alternative: Je ne te laisserai pas tomber et je ne t’abandonnerai pas
  rationale: 'Les deux verbes présentent des aspects complémentaires de la fidélité divine: Dieu ne relâchera pas son soutien et ne quittera pas Josué. La traduction maintient cette distinction sans réduire les deux verbes à un seul concept.'
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche de la progression hébraïque, tandis que « pendant toute ta vie » et « ne te ferai pas défaut » évitent des calques peu naturels. Le tutoiement correspond à l’adresse singulière de Dieu à Josué.
