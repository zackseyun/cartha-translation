  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: fr
  text: Tout homme qui se rebellera contre tes ordres[a] et n’écoutera pas tes paroles dans tout ce que tu lui commanderas sera mis à mort. Seulement, sois fort et courageux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « contre ta bouche ». En hébreu, « ta bouche » désigne ici ta parole d’autorité, donc tes ordres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: Tout homme
  rationale: Rend la construction distributive masculine singulière de l’hébreu. Dans ce contexte, elle désigne chaque homme soumis à l’autorité de Josué.
- source_word: יַמְרֶה
  choice: se rebellera contre
  rationale: Le verbe exprime une rébellion ou une défiance envers une autorité, et non une simple omission d’obéir.
- source_word: אֶת פִּיךָ
  choice: tes ordres
  rationale: Littéralement « ta bouche » ; l’expression désigne ici la parole autorisée de Josué. Le pluriel français convient naturellement à l’ensemble des directives qu’il donnera.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: et n’écoutera pas tes paroles
  rationale: Préserve la valeur d’écoute attentive de שׁמע ainsi que la distinction lexicale avec la rébellion déjà exprimée.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: en tout ce que tu lui commanderas
  rationale: Reproduit la portée exhaustive de l’exigence d’obéissance sans réduire la proposition à un seul ordre.
- source_word: יוּמָת
  choice: sera mis à mort
  rationale: La forme causative passive indique qu’une peine de mort lui sera infligée, et non qu’il mourra simplement.
- source_word: רַק
  choice: Seulement
  rationale: 'Marque une transition restrictive et fortement exhortative : en contrepartie de leur engagement, les hommes pressent Josué de rester ferme.'
- source_word: חֲזַק וֶאֱמָץ
  choice: sois fort et courageux
  rationale: Formule naturelle et digne qui rend l’exhortation récurrente du livre à la force, à la fermeté et à l’audace.
theological_decisions:
- issue: Langage représentatif masculin
  choice: Tout homme
  alternative: Quiconque ; toute personne
  rationale: Le texte hébreu emploie אִישׁ au masculin singulier dans une construction distributive. La traduction conserve cette forme plutôt que de la neutraliser.
- issue: Nature de la sanction
  choice: sera mis à mort
  alternative: mourra ; sera exécuté
  rationale: Le verbe hébreu présente la mort comme une peine infligée. « Sera mis à mort » en conserve la portée judiciaire sans ajouter de précisions procédurales.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple convient à la déclaration solennelle. « Tes ordres » explicite l’idiome hébreu, tandis que la note en conserve l’image littérale. « Seulement » maintient la brièveté et la force de la dernière exhortation.
