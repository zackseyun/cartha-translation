  text: וְ/לָ/רֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה אָמַ֥ר יְהוֹשֻׁ֖עַ לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: fr
  text: Josué dit aux Rubénites, aux Gadites et à la demi-tribu de Manassé :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en disant ». Cette expression introduit les paroles de Josué, qui commencent au verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: aux Rubénites
  rationale: Le gentilé singulier hébreu a ici un sens collectif. Le pluriel français désigne naturellement l’ensemble du groupe; la conjonction initiale n’a pas besoin d’être rendue par « et » en tête de phrase.
- source_word: וְ/לַ/גָּדִי
  choice: aux Gadites
  rationale: Comme pour « Rubénites », le gentilé singulier est collectif et se rend naturellement par un pluriel en français.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַ/מְנַשֶּׁה
  choice: à la demi-tribu de Manassé
  rationale: Cette formulation concise et consacrée rend précisément le groupe constitué par la moitié de la tribu de Manassé.
- source_word: אָמַר
  choice: dit
  rationale: Le verbe courant אמר signifie ici simplement « dire »; le passé simple convient au registre narratif biblique digne et actuel.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Le nom est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: L’infinitif « en disant » introduit les paroles rapportées au verset suivant. En français naturel, les deux-points remplissent clairement cette fonction.
