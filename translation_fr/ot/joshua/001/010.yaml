  yaml_path: translation/ot/joshua/001/010.yaml
  text: Then Joshua commanded the officers of the people, saying,
translation:
  language: fr
  text: 'Alors Josué ordonna aux responsables du peuple :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Alors … donna cet ordre
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession, et « donna cet ordre » conserve la force directive du verbe צוה dans un français courant.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre biblique.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur de l’objet direct sans équivalent lexical autonome en français ; sa fonction est rendue par la construction du complément « aux responsables du peuple ».
- source_word: שֹׁטְרֵי
  choice: responsables
  rationale: Le terme désigne ici des agents investis d’une fonction administrative auprès du peuple, et non des chefs militaires. « Responsables » est naturel en français moderne et évite l’ambiguïté policière que pourrait susciter « officiers ».
- source_word: הָעָם
  choice: du peuple
  rationale: עָם désigne ici le peuple considéré comme communauté. « Le peuple » en est l’équivalent français direct et naturel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: La formule hébraïque introduit les paroles rapportées au verset suivant. En français moderne, les deux-points remplissent naturellement cette fonction sans l’expression lourde « en disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation privilégie une narration naturelle tout en conservant la force de l’ordre et la fonction administrative des שֹׁטְרִים.
