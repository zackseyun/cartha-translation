  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: fr
  text: 'Ils répondirent à Josué : « Nous ferons tout ce que tu nous as ordonné, et nous irons partout où tu nous enverras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ לֵאמֹר
  choice: 'Ils répondirent à Josué :'
  rationale: Le verbe ענה introduit une réponse dans le récit, et Josué est la personne à qui elle est adressée. En français naturel, les deux-points introduisent directement les paroles et rendent la fonction de לֵאמֹר sans le calque pesant « en disant ».
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: tout ce que tu nous as ordonné
  rationale: כֹּל אֲשֶׁר désigne ici la totalité des instructions. צוה exprime un ordre donné avec autorité ; « ordonné » convient mieux que le plus faible « demandé ».
- source_word: נַעֲשֶׂה
  choice: Nous ferons
  rationale: עשה signifie ici faire ou exécuter ce qui a été ordonné. Le futur français exprime clairement l'engagement pris.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ נֵלֵךְ
  choice: et nous irons partout où tu nous enverras
  rationale: 'La tournure est locative : elle vise tout lieu vers lequel Josué pourra les envoyer. « Partout où » rend naturellement cette portée générale, tandis que « enverras » et « irons » conservent les verbes simples du texte hébreu.'
