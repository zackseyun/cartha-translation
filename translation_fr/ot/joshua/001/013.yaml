reference: Joshua 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: fr
  text: 'Souvenez-vous de la parole que Moïse, serviteur de Yahweh, vous a prescrite : « Yahweh, votre Dieu, vous accorde le repos et vous donnera ce pays[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous a donné ce pays ». La forme hébraïque peut présenter le don comme déjà accompli ou comme assuré; dans le contexte, les tribus à l’est du Jourdain avaient déjà reçu leur territoire.'
    reason: La valeur temporelle de וְנָתַן est ambiguë entre accomplissement contextuel et futur assuré.
lexical_decisions:
- source_word: זָכוֹר
  choice: Souvenez-vous
  rationale: L’impératif hébreu est au singulier, mais il s’adresse collectivement aux tribus mentionnées dans le contexte; le français emploie donc naturellement le pluriel de politesse collective « Souvenez-vous ».
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר peut désigner une parole, une affaire ou une instruction. « La parole » conserve la formulation du texte sans répéter inutilement l’idée de commandement.
- source_word: צִוָּה אֶתְכֶם
  choice: vous a prescrite
  rationale: Le verbe exprime une instruction investie d’autorité. « Prescrire » est naturel avec « parole » et maintient la force normative sans lourdeur.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: Dans ce titre honorifique appliqué à Moïse, « serviteur » convient mieux que « esclave » et exprime son service mandaté auprès de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement le nom avec suffixe de deuxième personne du pluriel et conserve la relation d’alliance exprimée dans l’adresse.
- source_word: מֵנִיחַ לָכֶם
  choice: vous accorde le repos
  rationale: Le participe causatif exprime le fait de procurer repos, soulagement et stabilité. Cette tournure française est actuelle et garde la portée du contexte territorial.
- source_word: וְנָתַן לָכֶם
  choice: vous donnera
  rationale: Après le participe, la forme verbale coordonnée se comprend naturellement comme la suite annoncée de l’action divine. Le futur est retenu dans le texte, tout en signalant en note la lecture accomplie possible dans le contexte narratif.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans ce contexte d’héritage territorial, « pays » rend naturellement אֶרֶץ; « cette terre » demeure possible, mais sonne ici moins idiomatique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve explicitement sans le remplacer par un titre.
- issue: Valeur temporelle de וְנָתַן
  choice: vous donnera
  alternative: vous a donné
  rationale: 'La coordination avec le participe מֵנִיחַ permet une lecture prospective: Yahweh procure le repos et donnera le pays. Toutefois, puisque les tribus orientales avaient déjà reçu leur territoire, une lecture accomplie est contextuellement défendable et est conservée en note.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe évite l’hébraïsme lourd « en disant »; les deux-points introduisent naturellement la citation. Le nom Yahweh est conservé, et l’ambiguïté aspectuelle du dernier verbe est explicitée en note.
