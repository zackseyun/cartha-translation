source:
  edition: WLC
  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: fr
  text: Vos femmes, vos jeunes enfants et vos troupeaux resteront dans le pays que Moïse vous a donné de l’autre côté du Jourdain. Mais vous, tous les vaillants guerriers, vous traverserez en armes[a] devant vos frères[b] et vous les aiderez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rangés en ordre de bataille ».'
    reason: alternative_reading
  - marker: b
    text: Ici, « vos frères » désigne les autres Israélites; l’hébreu emploie le terme de parenté masculin avec une portée collective.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: vos femmes
  rationale: Dans ce contexte familial et militaire, le terme désigne les épouses des hommes concernés.
- source_word: טַפְּכֶם
  choice: vos jeunes enfants
  rationale: טַף désigne couramment les petits enfants, parfois plus largement les personnes à charge; « jeunes enfants » conserve ici le sens concret.
- source_word: וּמִקְנֵיכֶם
  choice: et vos troupeaux
  rationale: מִקְנֶה renvoie ici aux animaux domestiques; « troupeaux » est naturel en français et convient au contexte pastoral.
- source_word: יֵשְׁבוּ
  choice: resteront
  rationale: Dans le contexte, le verbe indique que les familles et les troupeaux demeureront dans le territoire déjà attribué.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le territoire établi à l’est du Jourdain; « pays » est idiomatique et digne.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: que Moïse vous a donné
  rationale: Le parfait présente le don comme accompli; le passé composé est naturel en français moderne.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Cette formulation rend la relation spatiale sans imposer « à l’est », orientation que l’expression hébraïque ne précise pas à elle seule.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: Mais vous, … vous traverserez
  rationale: « Mais » fait ressortir le contraste entre ceux qui restent et les combattants qui traversent; la dislocation est naturelle en français.
- source_word: חֲמֻשִׁים
  choice: en armes
  rationale: Dans ce contexte militaire, le mot signifie probablement équipés pour le combat, tout en gardant une nuance discutée signalée en note.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: devant vos frères
  rationale: « Devant » conserve l’idée que ces hommes passeront en avant des autres Israélites.
- source_word: אֲחֵיכֶם
  choice: vos frères
  rationale: La traduction garde le terme de parenté masculin de l’hébreu; son emploi représentatif pour les autres Israélites est expliqué en note.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: tous les vaillants guerriers
  rationale: La formule désigne l’ensemble des hommes capables et courageux au combat; cette expression est claire et soutenue sans archaïsme.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: et vous les aiderez
  rationale: La coordination et le futur expriment naturellement l’ordre donné dans ce discours.
theological_decisions:
- issue: Portée du masculin אֲחֵיכֶם
  choice: vos frères
  alternative: les autres Israélites
  rationale: Le texte principal conserve le terme de parenté masculin de la source, tandis qu’une note indique sa portée collective dans ce contexte d’alliance.
- issue: Sens militaire de חֲמֻשִׁים
  choice: en armes
  alternative: rangés en ordre de bataille
  rationale: Le contexte favorise l’idée d’hommes équipés pour combattre, mais la nuance exacte demeure discutée; l’autre compréhension est donc conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La structure est légèrement réorganisée pour rattacher sans ambiguïté « tous les vaillants guerriers » au sujet « vous », tout en préservant l’enchaînement et les tensions lexicales de l’hébreu.
