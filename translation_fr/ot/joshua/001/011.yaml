source:
  edition: WLC
  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: fr
  text: 'Parcourez le camp et donnez cet ordre au peuple : « Préparez-vous des provisions, car d’ici trois jours[a], vous allez traverser ce Jourdain pour entrer dans le pays que Yahweh, votre Dieu, vous donne et en prendre possession. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans trois jours » ou « après trois jours ». L’expression hébraïque désigne un court délai restant avant la traversée ; « d’ici trois jours » en rend ici le mieux le sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: Parcourez le camp
  rationale: L’impératif de עבר associé à « au milieu du camp » ordonne aux responsables de circuler parmi les personnes qui y campent. « Parcourez le camp » restitue naturellement ce mouvement à travers tout le camp sans alourdir la phrase.
- source_word: וְצַוּוּ אֶת־הָעָם
  choice: et donnez cet ordre au peuple
  rationale: צוה exprime un commandement faisant autorité. Cette formulation française est plus naturelle ici que « commandez au peuple », tout en conservant la force de l’ordre.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: Préparez-vous des provisions
  rationale: צֵידָה désigne des vivres ou provisions destinés notamment au voyage. « Provisions » convient au contexte du départ et לָכֶם est rendu par « vous ».
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: car d’ici trois jours
  rationale: בְּעוֹד suivi d’une durée indique qu’un bref délai reste avant l’événement. « D’ici trois jours » exprime cette imminence tout en laissant subsister la légère souplesse temporelle de l’hébreu.
- source_word: אַתֶּם עֹבְרִים
  choice: vous allez traverser
  rationale: Le participe présente la traversée comme imminente et assurée. La périphrase française « aller + infinitif » rend cet aspect plus naturellement qu’un présent littéral.
- source_word: אֶת־הַיַּרְדֵּן הַזֶּה
  choice: ce Jourdain
  rationale: Le démonstratif הַזֶּה est conservé par « ce », qui souligne la proximité concrète du fleuve devant le peuple.
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: pour prendre possession du pays
  rationale: Les infinitifs expriment le but de la traversée. Dans ce contexte d’héritage territorial, ירשׁ signifie entrer en possession; « prendre possession » en rend mieux la portée que le simple verbe « posséder ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte géographique concret, « le pays » est un équivalent français naturel de אֶרֶץ et évite la possible lecture matérielle de « terre ».
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, votre Dieu
  rationale: Le nom divin יהוה est translittéré « Yahweh », tandis que le possessif pluriel est rendu par « votre Dieu ». Les virgules rendent naturelle l’apposition en français.
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: vous donne afin que vous en preniez possession
  rationale: Le participe נֹתֵן présente le don comme actuel et certain. La proposition finale conserve la répétition intentionnelle de l’idée de possession, tout en étant claire en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Rapport entre le don divin et la prise de possession humaine
  choice: « vous donne afin que vous en preniez possession »
  alternative: « vous donnera en possession »
  rationale: 'Cette formulation maintient ensemble les deux affirmations du texte : Dieu donne actuellement le pays, et le peuple doit effectivement en prendre possession. Elle n’efface ni l’initiative divine ni l’action humaine.'
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct emploie le vouvoiement pluriel. La formulation évite les tournures inutilement archaïques tout en conservant l’autorité de l’ordre, l’imminence de la traversée et la répétition théologiquement significative de la prise de possession.
