source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: fr
  text: De même que nous avons écouté Moïse dans tout ce qu’il disait[a], nous t’écouterons de même. Seulement, que Yahweh, ton Dieu, soit avec toi, comme il était avec Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons obéi à Moïse dans tout ce qu’il disait… nous t’obéirons ». Le verbe hébreu שׁמע peut signifier « écouter » ou « obéir », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: avons écouté / écouterons
  rationale: Avec אֶל, le verbe שׁמע signifie écouter quelqu’un, avec souvent une implication d’obéissance. « Écouter » conserve cette amplitude sémantique sans expliciter excessivement l’obéissance.
- source_word: כְּכֹל אֲשֶׁר
  choice: Tout comme… en toute chose
  rationale: Cette formulation rend à la fois la comparaison introduite par כְּ et la portée globale de כֹל, dans un français naturel et digne.
- source_word: רַק
  choice: Seulement
  rationale: רַק introduit ici une réserve ou une condition exprimée sous forme de souhait. « Seulement » en préserve la force concise.
- source_word: יִהְיֶה
  choice: que… soit
  rationale: Après רַק, l’imparfait a ici une valeur souhaitative plutôt que celle d’une simple prédiction. La tournure « que… soit » l’exprime naturellement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le nom porte un suffixe masculin singulier de deuxième personne, directement rendu par « ton Dieu ».
- source_word: עִמָּךְ / עִם
  choice: avec toi / avec Moïse
  rationale: עִם exprime la présence et l’association; « avec » convient naturellement au contexte de la présence divine auprès du dirigeant.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » marque clairement le parallèle entre la présence de Yahweh auprès de Josué et sa présence auprès de Moïse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel et d’alliance sans lui substituer un titre.
- issue: Portée de שׁמע dans l’engagement envers Josué
  choice: écouter
  alternative: obéir
  rationale: Le contexte implique l’obéissance, mais le verbe conserve le sens premier d’écoute attentive. Le texte principal préserve cette tension, tandis que la note signale l’autre rendu possible.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé sans lourdeur; « en toute chose » maintient la portée globale, et « que… soit » rend la nuance de souhait.
