base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: fr
  text: 'Du désert et de ce Liban jusqu’au grand fleuve, l’Euphrate — tout le pays des Hittites —, et jusqu’à la Grande Mer[a], du côté où le soleil se couche[b] : telle sera votre frontière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la mer Méditerranée.
    reason: cross_reference
  - marker: b
    text: Ou « vers l’ouest » ; littéralement, « vers l’entrée du soleil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: Depuis le désert
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert » est naturel en français et convient ici au repère géographique méridional sans le préciser davantage.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: et ce Liban
  rationale: Le démonstratif הַזֶּה est explicitement rendu par « ce »; « Liban » conserve le nom géographique sans ajouter « massif ».
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: jusqu’au grand fleuve, l’Euphrate
  rationale: 'La formulation conserve l’apposition hébraïque : le « grand fleuve » est ensuite identifié comme l’Euphrate. La répétition française de « fleuve » n’est pas nécessaire pour préserver le sens.'
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: tout le pays des Hittites
  rationale: Cette formulation rend כֹּל et le groupe construit אֶרֶץ הַחִתִּים de manière transparente, sans réduire la désignation ethnogéographique.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: et jusqu’à la Grande Mer
  rationale: La désignation hébraïque est conservée dans le texte; son identification habituelle avec la Méditerranée est donnée en note.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: du côté où le soleil se couche
  rationale: Cette traduction française naturelle préserve l’image hébraïque du coucher du soleil tout en signalant l’orientation occidentale.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: tel sera votre territoire
  rationale: גְּבוּל peut désigner une frontière ou le territoire qu’elle délimite. Après l’énumération des limites, « territoire » donne un français idiomatique sans modifier la portée géographique de l’énoncé.
