id: JOS.1.6
reference: Joshua 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: fr
  text: Sois fort et courageux, car c’est toi qui donneras en héritage[a] à ce peuple le pays que j’ai juré à leurs pères[b] de leur donner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu feras hériter ce peuple ». Le verbe hébreu est causatif et peut aussi se rendre par « tu attribueras ce pays à ce peuple en héritage ».'
    reason: lexical_alternative
  - marker: b
    text: '« Leurs pères » désigne les pères du peuple d’Israël, en particulier les patriarches ; autre traduction possible : « leurs ancêtres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: Sois fort et courageux
  rationale: Les deux impératifs masculins singuliers forment une exhortation consacrée à la force et à la résolution. Cette formulation est naturelle, digne et fidèle à leur force idiomatique.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’exhortation adressée à Josué.
- source_word: תַּנְחִיל
  choice: tu donneras en héritage
  rationale: 'Le hiphil de נחל a une valeur causative : Josué fera entrer le peuple en possession de son héritage. « Donner en héritage » exprime naturellement cette nuance en français, sans attribuer à Josué l’origine divine du don.'
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif hébreu avec démonstratif est conservé dans une tournure française naturelle.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte territorial, « le pays » désigne naturellement le territoire promis à Israël. « La terre » reste possible, mais peut avoir en français une portée plus générale.
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré
  rationale: Le parfait exprime le serment antérieur et toujours pertinent de Dieu ; le passé composé convient au français moderne.
- source_word: לַאֲבוֹתָם
  choice: à leurs pères
  rationale: La traduction conserve la référence masculine explicite aux pères d’Israël, en particulier aux patriarches, tout en signalant en note la possibilité idiomatique « ancêtres ».
- source_word: לָתֵת לָהֶם
  choice: de leur donner
  rationale: L’infinitif précise le contenu du serment, et les pronoms gardent les bénéficiaires explicites.
theological_decisions:
- issue: Rôle de Josué dans l’entrée en possession du pays
  choice: tu donneras en héritage à ce peuple
  alternative: tu feras hériter ce peuple
  rationale: La formulation retenue préserve la valeur causative du verbe tout en restant idiomatique. Elle présente Josué comme l’agent chargé de conduire la transmission de l’héritage, sans effacer que le pays est le don promis par Dieu.
- issue: Référence patriarcale de אֲבוֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le texte hébreu emploie le masculin pluriel et vise les pères du peuple d’Israël, notamment les patriarches. Le texte principal maintient cette précision, tandis que la note indique l’équivalent plus général.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse directe de Dieu à Josué. La phrase garde le lien causal et la solennité du serment, tout en rendant le causatif hébreu de façon idiomatique.
