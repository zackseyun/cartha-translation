  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: fr
  text: Alors le soleil s’immobilisa, et la lune s’arrêta, jusqu’à ce que la nation se soit vengée de ses ennemis.[a] Cela n’est-il pas écrit dans le Livre du Juste[b] ? Le soleil resta immobile au milieu du ciel et ne se hâta pas de se coucher pendant environ un jour entier.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce que la nation ait obtenu justice contre ses ennemis ». Le verbe hébreu peut exprimer la vengeance ou la rétribution qui rétablit le droit.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le Livre du Juste » ; titre traditionnellement transcrit « Livre de Yashar ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « comme un jour entier ». La tournure hébraïque exprime une comparaison ou une approximation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: le soleil s’immobilisa
  rationale: דמם peut signifier « se taire » ou « demeurer immobile ». Le parallélisme avec l’arrêt de la lune et le contexte céleste favorisent ici « s’immobilisa ».
- source_word: וְיָרֵחַ עָמָד
  choice: et la lune s’arrêta
  rationale: עמד signifie littéralement « se tenir, rester debout », mais appliqué à un astre dans ce contexte, « s’arrêta » exprime naturellement la cessation du mouvement.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: jusqu’à ce que la nation se soit vengée de ses ennemis
  rationale: Dans cette construction, נקם — écrit ici sous la forme consonantique יִקֹּם — exprime l’exercice de la vengeance ou de la rétribution. « La nation » conserve la valeur de גוי et le singulier collectif du suffixe.
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: Cela n’est-il pas écrit
  rationale: Le pronom féminin renvoie vraisemblablement à la parole, à la citation ou à l’affaire précédente. « Cela » restitue ce renvoi sans imposer un antécédent précis.
- source_word: סֵפֶר הַיָּשָׁר
  choice: le Livre du Juste
  rationale: הַיָּשָׁר signifie « le droit, le juste ». La traduction du titre en français en communique le sens, tandis qu’une note conserve l’autre convention traditionnelle, « Livre de Yashar ».
- source_word: וַיַּעֲמֹד הַשֶּׁמֶשׁ
  choice: Le soleil resta immobile
  rationale: Cette formulation reprend l’idée d’arrêt tout en reflétant la valeur stative de עמד et en évitant une répétition française trop mécanique.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: au milieu du ciel
  rationale: Expression française naturelle qui rend la position médiane indiquée par חצי et le pluriel hébreu idiomatique שׁמים.
- source_word: וְלֹא אָץ לָבוֹא
  choice: et ne se hâta pas de se coucher
  rationale: אוץ signifie « se hâter » ; בוא, à propos du soleil, désigne son arrivée au couchant, d’où le français idiomatique « se coucher ».
- source_word: כְּיוֹם תָּמִים
  choice: pendant presque un jour entier
  rationale: תמים désigne ce qui est complet ou entier. Le כ comparatif suggère une approximation, rendue ici par « presque », tout en conservant l’ambiguïté dans la note.
theological_decisions:
- issue: Nature du phénomène céleste
  choice: Décrire directement le soleil et la lune comme s’arrêtant ou demeurant immobiles.
  alternative: Réduire le récit à une apparence observée, à un phénomène naturel ou à une simple image poétique.
  rationale: Le verset présente sans détour un événement extraordinaire. La traduction conserve cette affirmation sans lui imposer une harmonisation scientifique ni décider si la formulation est phénoménologique.
- issue: Sens de la vengeance exercée par la nation
  choice: « se soit vengée de ses ennemis »
  alternative: « ait obtenu justice contre ses ennemis »
  rationale: Le contexte militaire et le verbe hébreu favorisent la vengeance ou la rétribution, mais la note signale la nuance possible de justice vindicative sans l’effacer.
translation_notes:
  register: Français international moderne, narratif et digne. Les verbes « s’immobilisa », « s’arrêta » et « resta immobile » rendent les nuances des verbes hébreux sans archaïsme. Le titre est traduit pour rester intelligible, avec translittération en note.
