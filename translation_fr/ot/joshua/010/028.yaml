source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: fr
  text: Ce jour-là, Josué s’empara de Makkéda et la frappa du tranchant de l’épée. Il voua à la destruction son roi et toutes les personnes qui s’y trouvaient[a] ; il ne laissa aucun survivant. Il fit au roi de Makkéda ce qu’il avait fait au roi de Jéricho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « extermina entièrement » ; le verbe hébreu désigne le fait de vouer quelqu’un ou quelque chose à la destruction en le plaçant sous interdit.
    reason: Alternative lexicale et explicitation du sens de חרם.
lexical_decisions:
- source_word: לָכַד
  choice: s’empara de
  rationale: Dans ce contexte militaire, le verbe désigne la prise d’une ville. « S’empara de » est naturel en français et conserve l’idée de conquête.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: la frappa du tranchant de l’épée
  rationale: Cette formulation conserve à la fois la force concrète de נכה et l’image hébraïque du « tranchant » de l’épée.
- source_word: הֶחֱרִם
  choice: voua à la destruction
  rationale: Le hifil de חרם désigne ici la mise sous interdit en vue de la destruction, et non une simple défaite ou mise à mort.
- source_word: וְאֶת מַלְכָּהּ ... אוֹתָם וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: son roi et toutes les personnes qui s’y trouvaient
  rationale: Le pluriel אוֹתָם englobe les référents mentionnés. נֶפֶשׁ désigne ici des personnes, non l’âme immatérielle.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: il ne laissa aucun survivant
  rationale: Rendu direct et idiomatique de la négation absolue portant sur שָׂרִיד, « survivant ».
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Il fit au roi de Maqqéda ce qu’il avait fait au roi de Jéricho
  rationale: Le tour français garde la concision volontaire de עשה ל sans préciser davantage la manière dont le roi fut traité.
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: Maqqéda / Jéricho / Josué
  rationale: Formes françaises usuelles ou translittération française lisible des noms propres bibliques.
theological_decisions:
- issue: Sens de חרם dans le contexte de la conquête
  choice: voua à la destruction
  alternative: détruisit entièrement ; mit sous interdit
  rationale: « Voua à la destruction » préserve la dimension rituelle et théologique de la mise sous interdit, sans réduire le terme à la seule action de tuer ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. Le récit conserve sa sobriété et sa dureté, sans euphémiser la violence ni ajouter d’explication morale. La syntaxe reste claire pour un lectorat général.
