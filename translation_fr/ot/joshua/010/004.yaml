  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: fr
  text: Montez vers moi et venez à mon aide, et attaquons Gabaon, car elle a fait la paix avec Josué et les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites » ou « le peuple d’Israël ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: Montez vers moi
  rationale: L’impératif pluriel de עלה exprime un déplacement ascendant, tandis que אֵלַי oriente le mouvement vers le locuteur. Cette formulation conserve les deux nuances en français naturel.
- source_word: וְעִזְרֻנִי
  choice: et venez à mon aide
  rationale: L’impératif pluriel avec objet de première personne signifie littéralement « aidez-moi ». « Venez à mon aide » évite la répétition de « moi » tout en gardant l’appel direct.
- source_word: וְנַכֶּה
  choice: puis attaquons
  rationale: La forme volitive à la première personne du pluriel de נכה appelle à une action militaire commune. « Attaquons » est ici plus idiomatique que « frappons » et n’ajoute pas de détail tactique.
- source_word: אֶת גִּבְעוֹן
  choice: Gabaon
  rationale: Le nom traditionnel français de la ville biblique est retenu; le marqueur d’objet direct אֶת ne se traduit pas séparément.
- source_word: כִּי הִשְׁלִימָה
  choice: car elle a fait la paix
  rationale: כִּי introduit le motif de l’attaque. Le hiphil de שלם décrit ici l’établissement de relations pacifiques, possiblement dans un cadre d’alliance, sans exiger que cette précision soit intégrée au texte principal.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: avec Josué et les fils d’Israël
  rationale: Avec הִשְׁלִימָה, אֶת introduit les parties avec lesquelles la paix a été conclue. « Les fils d’Israël » reproduit l’expression familiale et nationale hébraïque, avec une note donnant l’équivalent collectif usuel.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte principal conserve l’image généalogique masculine de l’hébreu sans nier que, dans ce contexte historique et national, l’expression désigne collectivement le peuple d’Israël.
- issue: Nature de la paix exprimée par הִשְׁלִימָה
  choice: a fait la paix avec
  alternative: a conclu une alliance avec
  rationale: « Faire la paix » préserve l’étendue sémantique du verbe. « Conclure une alliance » explicite davantage la dimension diplomatique, mais la rend plus précise que ne l’impose le verbe seul.
translation_notes:
  register: Français international moderne, direct et digne. « Montez vers moi » conserve l’orientation géographique et le point de vue du locuteur; « venez à mon aide » et « attaquons » donnent à l’appel militaire une formulation courante. Le féminin « elle » reprend naturellement la ville de Gabaon.
