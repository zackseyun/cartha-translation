  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: fr
  text: Josué s’empara de tous ces rois et de leur pays en une seule fois[a], car Yahweh, le Dieu d’Israël, combattit pour Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en une seule campagne ». L’hébreu dit littéralement « en une seule fois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: s’empara de
  rationale: Le verbe désigne ici la prise militaire des rois et de leur territoire. « S’empara de » convient aux deux compléments sans renforcer le sens jusqu’à « conquit ».
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: tous ces rois
  rationale: Rendu direct et naturel du groupe nominal avec démonstratif.
- source_word: וְאֶת אַרְצָם
  choice: et de leur pays
  rationale: אֶרֶץ désigne ici le domaine soumis à ces rois. « Pays » est naturel en français et conserve l’étendue générale du terme.
- source_word: פַּעַם אֶחָת
  choice: en une seule fois
  rationale: Cette formulation reste proche de l’expression hébraïque, littéralement « une fois », tout en étant idiomatique. Dans ce résumé militaire, elle peut désigner une seule campagne, possibilité signalée en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du succès de Josué. « Car » exprime clairement ce rapport causal dans un registre narratif digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et idiomatique de la construction hébraïque.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: combattait pour Israël
  rationale: Le niphal de לחם suivi de ל indique que Yahweh menait le combat en faveur d’Israël. L’imparfait français présente cette action comme la cause active du succès résumé dans le verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom divin sans lui substituer un titre et correspond à une translittération largement reconnue.
- issue: Valeur de l’action divine נִלְחָם
  choice: combattait pour Israël
  alternative: combattit pour Israël
  rationale: Les deux temps sont possibles dans ce résumé. L’imparfait français met naturellement en relief l’action divine qui sous-tend la prise de l’ensemble des rois et de leur pays, sans modifier l’affirmation théologique selon laquelle Dieu agit en faveur d’Israël.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant un calque lourd. Le marqueur de note [a] figure immédiatement après l’expression concernée.
