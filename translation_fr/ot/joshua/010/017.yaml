  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: fr
  text: 'On rapporta à Josué : « On a trouvé les cinq rois cachés[a] dans la grotte, à Maqqéda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se cachaient ». Le participe hébreu peut décrire leur état (« cachés ») ou, de façon plus verbale, leur action (« qui se cachaient »).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On rapporta
  rationale: La forme passive narrative indique qu’une information fut transmise à Josué sans identifier celui qui la donna. En français, la tournure indéfinie « On rapporta » restitue naturellement cette absence d’agent explicite.
- source_word: לִיהוֹשֻׁעַ
  choice: à Josué
  rationale: Le complément désigne le destinataire du rapport; le nom reçoit sa forme française usuelle.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif quotatif hébreu introduit les paroles rapportées. En français actuel, les deux-points remplissent naturellement cette fonction sans l’artificiel « en disant ».
- source_word: נִמְצְאוּ
  choice: On a trouvé
  rationale: Le passif pluriel de מצא exprime la découverte des rois. Le passé composé convient à une découverte récente rapportée dans le récit, tandis que le sujet indéfini évite d’ajouter un agent déterminé.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: les cinq rois
  rationale: Le numéral en construction avec le nom défini renvoie directement aux cinq rois déjà mentionnés.
- source_word: נֶחְבְּאִים
  choice: cachés
  rationale: Le participe décrit l’état des rois au moment où ils sont trouvés. « Cachés » conserve cette valeur tout en laissant ouverte la nuance plus verbale « qui se cachaient », signalée en note.
- source_word: בַּמְּעָרָה
  choice: dans la grotte
  rationale: La préposition et le nom défini indiquent le lieu précis où se trouvent les rois.
- source_word: בְּמַקֵּדָה
  choice: de Maqqéda
  rationale: Le complément rattache naturellement la grotte au lieu nommé Maqqéda. Cette formulation française rend l’emplacement sans préciser indûment si la grotte se trouvait à l’intérieur de la ville ou dans ses environs.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe hébraïque « il fut rapporté… en disant » est rendue par une tournure française idiomatique avec sujet indéfini et deux-points. Le marqueur de note est placé immédiatement après le terme concerné.
