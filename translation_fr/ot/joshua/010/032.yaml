  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֶת לָכִ֜ישׁ בְּ/יַ֣ד יִשְׂרָאֵ֗ל וַֽ/יִּלְכְּדָ/הּ֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֔רֶב וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּ֑/הּ כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לִבְנָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: fr
  text: Yahweh livra Lakish au pouvoir d’Israël[a]. Celui-ci s’en empara le deuxième jour et la passa au fil de l’épée, ainsi que toute personne qui s’y trouvait, exactement comme il l’avait fait à Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donna Lakish dans la main d’Israël ».'
    reason: L’expression française traduit un idiome hébreu qui signifie livrer quelqu’un ou quelque chose au pouvoir d’un autre.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et le distingue d’un titre tel que « le Seigneur ».
- source_word: וַיִּתֵּן ... בְּיַד
  choice: livra ... au pouvoir de
  rationale: Rend naturellement l’idiome hébreu « donner dans la main de », qui exprime la remise sous l’autorité ou la puissance d’un autre.
- source_word: לָכִישׁ
  choice: Lakish
  rationale: Forme française courante du nom de lieu biblique.
- source_word: וַיִּלְכְּדָהּ
  choice: s’en empara
  rationale: Terme militaire naturel en français pour la prise d’une ville, avec un pronom dont l’antécédent est Lakish.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: le deuxième jour
  rationale: Conserve la précision chronologique du texte plutôt que de l’interpréter comme « le lendemain ».
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: la passa au fil de l’épée
  rationale: Expression française traditionnelle mais intelligible qui restitue l’image hébraïque de la « bouche » ou du tranchant de l’épée et, dans ce contexte, l’extermination violente.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: toute personne qui s’y trouvait
  rationale: נֶפֶשׁ désigne ici chaque être humain présent, non une âme conçue séparément du corps.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: exactement comme il l’avait fait à Libna
  rationale: Préserve le verbe hébreu au singulier et exprime clairement le parallèle avec le sort antérieur de Libna.
theological_decisions:
- issue: Formule de conquête concernant les habitants
  choice: ainsi que toute personne qui s’y trouvait
  alternative: ainsi que toute âme qui s’y trouvait
  rationale: « Personne » communique le sens humain collectif de נֶפֶשׁ sans introduire une distinction métaphysique entre âme et corps, tout en maintenant sans atténuation la gravité du récit.
- issue: Référent du sujet dans la comparaison finale
  choice: exactement comme il l’avait fait à Libna
  alternative: exactement comme ils l’avaient fait à Libna
  rationale: L’hébreu emploie un verbe masculin singulier. Le pronom peut viser Josué comme chef représentatif, malgré l’action collective d’Israël; conserver le singulier respecte cette tension grammaticale.
- issue: Agent grammatical de la prise de Lakish
  choice: Celui-ci s’en empara
  alternative: il s’en empara
  rationale: Le sujet singulier implicite de וַיִּלְכְּדָהּ est vraisemblablement Josué dans le fil narratif, mais le verset nomme immédiatement Israël. « Celui-ci » maintient le singulier du texte sans ajouter explicitement le nom de Josué.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve le nom divin « Yahweh », la précision « le deuxième jour », la violence explicite de la formule de conquête et le sujet singulier de la dernière proposition. « Au fil de l’épée » reste courant dans le registre biblique et historique.
