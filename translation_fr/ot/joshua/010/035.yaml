review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la succession des verbes pluriels (« ils ») puis des deux verbes hébreux au masculin singulier. L’explicitation de Josué pour le sujet singulier est justifiée par le contexte immédiat et rend cette rupture grammaticale intelligible en français. « Vouer à la destruction » restitue de manière appropriée le sens technique de הֶחֱרִים, et « toute personne » rend bien נֶפֶשׁ dans ce contexte.
  naturalness: « Frapper une ville du tranchant de l’épée » est compréhensible mais peu idiomatique en français moderne. « La passèrent au fil de l’épée » est l’expression française usuelle pour cet idiome militaire et conserve son caractère violent sans l’atténuer. La note littérale permet de garder visible l’image hébraïque.
  terminology: « Josué », « Lakish », « voua à la destruction » et « interdit » sont cohérents avec un français biblique moderne international. La variante de note « extermina entièrement » est moins naturelle et moins précisément formulée que « détruisit complètement ».
  issues:
