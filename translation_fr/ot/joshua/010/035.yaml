    issue: Expression française peu naturelle pour לְפִי חֶרֶב
    rationale: « La frappèrent du tranchant de l’épée » calque partiellement l’hébreu, mais « la passèrent au fil de l’épée » est l’équivalent idiomatique français établi. La note conserve le littéral.
  - severity: low
    issue: Formulation de l’alternative en note b
    rationale: « Extermina entièrement » est redondant et moins naturel. « Détruisit complètement » exprime mieux l’alternative lexicale sans modifier le sens.
