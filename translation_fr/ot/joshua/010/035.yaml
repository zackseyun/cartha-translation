base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: fr
  text: Ils s’en emparèrent ce jour-là et la passèrent au fil de l’épée[a]. Ce jour-là, Josué voua à la destruction toute personne qui s’y trouvait[b], exactement comme il l’avait fait à Lakish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la bouche de l’épée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « détruisit complètement » ; le verbe hébreu désigne ici le fait de vouer à la destruction sous l’interdit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Ils s’en emparèrent
  rationale: Le verbe לכד décrit ici la prise militaire d’une ville. « S’emparer de » est naturel en français et conserve ce sens.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle idiomatique qui maintient l’insistance sur le fait que la prise et la mise à mort eurent lieu le même jour.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: la frappèrent du tranchant de l’épée
  rationale: Cette formulation conserve l’image hébraïque de la « bouche » ou du tranchant de l’épée, tout en restant compréhensible en français.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: toute personne qui s’y trouvait
  rationale: Dans ce contexte, נֶפֶשׁ désigne une personne vivante, non une âme immatérielle. Cette formulation évite une implication anthropologique étrangère au passage.
- source_word: הֶחֱרִים
  choice: voua à la destruction
  rationale: Le hiphil de חרם exprime la mise sous interdit avec destruction. « Vouer à la destruction » préserve sa portée technique et sacrale sans la réduire au simple fait de détruire.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: exactement comme il l’avait fait à Lakish
  rationale: Cette tournure rend clairement la correspondance complète avec l’action antérieure menée contre Lakish et respecte le verbe hébreu au masculin singulier.
theological_decisions:
- issue: Sens de חרם dans le contexte de la conquête
  choice: voua à la destruction
  alternative: extermina entièrement ; frappa d’interdit
  rationale: Le verbe possède une portée liée à l’interdit de destruction, qui dépasse l’idée générale de tuer. La traduction retenue conserve cette tension théologique sans l’expliquer excessivement dans le texte.
- issue: Sens de נֶפֶשׁ dans la population d’une ville
  choice: personne
  alternative: âme ; être vivant
  rationale: Ici, le mot désigne les personnes présentes dans la ville. « Âme » pourrait suggérer à tort une affirmation sur la composition de l’être humain.
- issue: Sujet singulier de הֶחֱרִים et עָשָׂה après les verbes pluriels
  choice: Josué… il
  alternative: ils
  rationale: Les deux verbes hébreux sont au masculin singulier et renvoient naturellement à Josué, tandis que les premiers verbes ont pour sujet les combattants. Nommer Josué rend le changement de sujet clair en français sans effacer la morphologie singulière.
translation_notes:
  register: 'Français international moderne, digne et lisible. La syntaxe est scindée en deux phrases afin de rendre clairement le passage du sujet pluriel au sujet singulier. « Josué » explicite le référent du verbe singulier sans ajouter un nouvel agent au récit. Orthographe retenue du toponyme : « Lakish ».'
