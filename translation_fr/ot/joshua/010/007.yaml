  text: וַ/יַּ֨עַל יְהוֹשֻׁ֜עַ מִן הַ/גִּלְגָּ֗ל ה֚וּא וְ/כָל עַ֤ם הַ/מִּלְחָמָה֙ עִמּ֔/וֹ וְ/כֹ֖ל גִּבּוֹרֵ֥י הֶ/חָֽיִל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: fr
  text: Josué monta donc de Guilgal, lui et tous les combattants qui l’accompagnaient, ainsi que tous les vaillants guerriers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie « monter ». « Monta » conserve l’indication de déplacement ascendant sans ajouter explicitement l’idée de marche militaire.
- source_word: מִן הַגִּלְגָּל
  choice: de Guilgal
  rationale: Traduction directe de la préposition מן et forme française usuelle du nom propre.
- source_word: הוּא
  choice: lui
  rationale: Le pronom indépendant explicite met Josué en relief; la construction appositive « lui et… » conserve naturellement cet accent en français.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: tous les combattants
  rationale: Littéralement « tout le peuple de la guerre ». Dans ce contexte, l’expression désigne les hommes constituant la force combattante; « combattants » est naturel, précis et actuel.
- source_word: עִמּוֹ
  choice: qui l’accompagnaient
  rationale: Rend le sens de « avec lui » dans une syntaxe française fluide, sans modifier la relation exprimée.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: tous les vaillants guerriers
  rationale: L’expression désigne des guerriers reconnus pour leur force, leur courage ou leur capacité. « Vaillants guerriers » préserve le caractère militaire et distingue ce groupe des « combattants » mentionnés auparavant.
