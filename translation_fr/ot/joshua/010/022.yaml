  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: fr
  text: 'Alors Josué dit : « Ouvrez l’entrée de la grotte et amenez-moi ces cinq rois hors de la grotte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: פִּתְחוּ
  choice: Ouvrez
  rationale: Impératif masculin pluriel de פתח ; « ouvrez » rend directement l’ordre adressé à plusieurs personnes.
- source_word: פִּי הַמְּעָרָה
  choice: l’entrée de la grotte
  rationale: L’hébreu dit littéralement « la bouche de la grotte ». En français courant, « l’entrée de la grotte » exprime clairement le référent sans produire une tournure artificielle.
- source_word: וְהוֹצִיאוּ
  choice: faites sortir
  rationale: L’impératif hiphil de יצא a un sens causatif. « Faites sortir » conserve cette valeur et le mouvement depuis l’intérieur.
- source_word: אֵלַי
  choice: pour les amener jusqu’à moi
  rationale: La préposition אֶל avec suffixe indique un mouvement en direction de Josué. Cette formulation française rend explicitement la destination tout en s’intégrant naturellement à « faites sortir ».
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ces cinq rois
  rationale: Le démonstratif הָאֵלֶּה correspond directement à « ces » et désigne les cinq rois déjà identifiés dans le contexte.
- source_word: מִן הַמְּעָרָה
  choice: de la grotte
  rationale: Avec « faites sortir », la préposition מִן est naturellement rendue par « de » ; l’idée de mouvement vers l’extérieur est déjà portée par le verbe.
