  source_fidelity: Le projet rend correctement la progression narrative, les impératifs pluriels, l’ouverture de la grotte, les cinq rois, leur sortie et leur acheminement vers Josué. Toutefois, « faites sortir ... pour les amener jusqu’à moi » dédouble en français l’unique impératif hébreu וְהוֹצִיאוּ (« faites sortir/amenez dehors ») et transforme la direction אֵלַי en action additionnelle de but.
  naturalness: « Faites sortir de la grotte ces cinq rois pour les amener jusqu’à moi » est compréhensible, mais lourd et redondant. « Amenez-moi ces cinq rois hors de la grotte » est naturel en français international moderne et exprime à la fois la sortie et la direction vers Josué.
  terminology: « Josué », « grotte » et « cinq rois » sont appropriés. « Entrée » rend idiomatiquement l’hébreu littéral « bouche de la grotte » sans perte de sens pertinente.
