  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: fr
  text: Il s’en empara, ainsi que de son roi et de toutes ses villes. Ils les frappèrent au fil de l’épée et vouèrent à la destruction[a] toute personne qui s’y trouvait. Il ne laissa aucun survivant. Comme il avait fait à Hébron, ainsi fit-il à Debir et à son roi, et comme il avait fait à Libna et à son roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exterminèrent entièrement ». L’hébreu emploie ici le vocabulaire du ḥérem, qui désigne ce qui est voué à une destruction totale.
    reason: Alternative lexicale et précision sur le terme technique חרם.
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Il s’en empara
  rationale: Le verbe est au singulier masculin et son suffixe renvoie à Debir. Le singulier, probablement centré sur Josué comme chef représentatif, est conservé plutôt que régularisé au pluriel.
- source_word: כָּל עָרֶיהָ
  choice: toutes les villes qui en dépendaient
  rationale: עִיר peut désigner une ville ou une localité. La formulation explicite naturellement le rapport entre Debir, ville principale, et les localités relevant d’elle.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: Ils les frappèrent au fil de l’épée
  rationale: L’expression française « au fil de l’épée » conserve l’image hébraïque de la bouche ou du tranchant de l’épée tout en restant idiomatique.
- source_word: וַיַּחֲרִימוּ
  choice: vouèrent à la destruction
  rationale: 'Cette formulation conserve la valeur technique de חרם : livrer quelque chose à une destruction totale, plutôt que réduire le terme au simple verbe « détruire ».'
- source_word: כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: toute personne qui s’y trouvait
  rationale: נֶפֶשׁ désigne ici les personnes présentes, et non une âme immatérielle.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Il ne laissa aucun survivant
  rationale: Le singulier du verbe est conservé, tandis que שָׂרִיד est rendu par le français naturel « survivant ».
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: Il fit à Debir et à son roi ce qu’il avait fait à Hébron
  rationale: La construction comparative est rendue naturellement, et le plus-que-parfait marque que le traitement d’Hébron précède celui de Debir.
theological_decisions:
- issue: Langage de guerre associé à חרם
  choice: vouèrent à la destruction
  alternative: exterminèrent entièrement ; frappèrent d’anathème
  rationale: Le choix garde la dimension particulière de חרם, qui ne désigne pas une destruction ordinaire, sans ajouter dans le texte une interprétation doctrinale non exprimée.
- issue: Alternance des sujets singulier et pluriel
  choice: 'conserver l’alternance : « Il s’en empara » / « Ils les frappèrent » / « Il ne laissa »'
  alternative: uniformiser tous les verbes au pluriel ou au singulier
  rationale: L’hébreu alterne réellement entre le chef représentatif au singulier et le groupe au pluriel. La traduction préserve cette tension narrative au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. « S’en empara » convient au récit militaire sans archaïsme marqué ; « au fil de l’épée » garde l’image de l’hébreu. L’alternance singulier/pluriel, potentiellement abrupte en français, est volontairement maintenue parce qu’elle appartient au texte source.
