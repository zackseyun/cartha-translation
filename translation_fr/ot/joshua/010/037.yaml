base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: fr
  text: Ils s’en emparèrent et la passèrent au fil de l’épée, ainsi que son roi, toutes les villes qui en dépendaient et toutes les personnes qui s’y trouvaient. Josué ne laissa aucun survivant, exactement comme il l’avait fait à Églôn. Il la voua à la destruction[a], avec toutes les personnes qui s’y trouvaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il la détruisit entièrement ». Le verbe hébreu évoque ici le fait de vouer quelque chose à une destruction irrévocable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Ils s’en emparèrent
  rationale: לכד désigne la prise d’une ville. « S’emparer de » est naturel en français et garde la valeur militaire du verbe.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: la passèrent au fil de l’épée
  rationale: Cette expression française courante rend ensemble נכה et l’idiome לְפִי חֶרֶב, littéralement « à la bouche de l’épée », sans archaïsme excessif.
- source_word: כָּל עָרֶיהָ
  choice: toutes les villes qui en dépendaient
  rationale: עיר peut désigner des villes ou des localités. Le possessif indique ici les agglomérations rattachées à Hébron; l’explicitation évite l’étrange « toutes ses villes ».
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: toutes les personnes qui s’y trouvaient
  rationale: נפש désigne ici les personnes vivantes, non une âme immatérielle. La formulation est claire et moderne.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Josué ne laissa aucun survivant
  rationale: Le verbe singulier réintroduit vraisemblablement Josué comme sujet après le pluriel précédent. Nommer Josué en français lève une ambiguïté référentielle sans modifier l’action rapportée.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: exactement comme il l’avait fait à Églôn
  rationale: ככל אשר marque une comparaison complète avec le traitement antérieur d’Églôn; le plus-que-parfait convient au retour narratif.
- source_word: וַיַּחֲרֵם אוֹתָהּ
  choice: Il la voua à la destruction
  rationale: Le hiphil de חרם exprime ici la mise sous ḥerem, c’est-à-dire une consécration entraînant la destruction. Cette traduction conserve la portée technique du terme.
theological_decisions:
- issue: Sens de חרם dans un récit de guerre
  choice: Il la voua à la destruction
  alternative: Il la détruisit entièrement
  rationale: 'Le verbe ne décrit pas seulement l’ampleur d’une destruction: il porte l’idée technique de mise à part irrévocable, ici en vue de la destruction. Le texte principal en conserve la tension cultuelle et militaire.'
- issue: Sujet du singulier לֹא הִשְׁאִיר et de וַיַּחֲרֵם
  choice: Josué, puis « il »
  alternative: Conserver uniquement le pronom « il »
  rationale: Après les verbes pluriels, le singulier résume l’action sous la responsabilité de Josué, comme dans le contexte immédiat. Son nom est explicité une fois pour assurer une lecture française intelligible.
translation_notes:
  register: Français international moderne, narratif et digne. « Passer au fil de l’épée » conserve l’image hébraïque dans une expression française établie. Le nom « Églôn » suit une translittération française usuelle.
