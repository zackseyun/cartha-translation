base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: fr
  text: Mais vous, ne vous arrêtez pas ! Poursuivez vos ennemis et attaquez-les par l’arrière[a]. Ne les laissez pas rentrer dans leurs villes, car Yahweh, votre Dieu, les a livrés entre vos mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frappez leur arrière » ou « attaquez les traînards » ; le verbe hébreu évoque l’attaque de la « queue », c’est-à-dire de l’arrière d’une troupe en fuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mais vous
  rationale: La conjonction et le pronom indépendant marquent ici un contraste appuyé avec l’action précédente ; « Mais vous » le rend naturellement en français.
- source_word: אַל תַּעֲמֹדוּ
  choice: ne vous arrêtez pas
  rationale: Dans le contexte de la poursuite militaire, עמד interdit de s’immobiliser ou d’interrompre l’avancée ; cette formulation exprime clairement la portée contextuelle.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: Poursuivez vos ennemis
  rationale: Équivalent direct, naturel et approprié au contexte militaire de l’expression רדף אחרי.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: attaquez-les par l’arrière
  rationale: Le verbe זנב, apparenté à l’idée de « queue », désigne l’attaque de l’arrière d’une troupe en fuite. La formulation française conserve l’image tactique sans supposer nécessairement une arrière-garde constituée.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: Ne les laissez pas rentrer
  rationale: נתן suivi de l’infinitif exprime ici la permission. « Rentrer » convient à des soldats qui cherchent refuge dans leurs propres villes.
- source_word: אֶל עָרֵיהֶם
  choice: dans leurs villes
  rationale: עיר peut désigner une ville ou une localité ; « villes » convient au cadre urbain fortifié du récit.
- source_word: כִּי נְתָנָם
  choice: car ... les a livrés
  rationale: Le parfait présente la victoire comme déjà assurée par l’action divine. « Livrer entre les mains » est un idiome français naturel qui correspond au sens de domination ou de pouvoir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du nom divin représenté par le tétragramme, sans le remplacer par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement le construit avec suffixe de deuxième personne du pluriel.
- source_word: בְּיֶדְכֶם
  choice: entre vos mains
  rationale: L’hébreu emploie le singulier collectif « dans votre main » pour exprimer le pouvoir. L’idiome français courant est « livrer entre les mains de quelqu’un ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs énergiques reflètent le discours militaire. « Attaquez-les par l’arrière » évite de préciser abusivement qu’il s’agit d’une arrière-garde organisée, tandis que la note préserve l’image et les autres possibilités lexicales.
