source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: fr
  text: Quand Adoni-Tsédeq, roi de Jérusalem, apprit que Josué avait pris Aï et l’avait vouée à la destruction[a], que, de même qu’il avait traité Jéricho et son roi, il avait traité Aï et son roi, et que les habitants de Gabaon avaient conclu la paix avec Israël[b] et se trouvaient parmi eux,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’avait entièrement détruite ». Le verbe hébreu relève du vocabulaire de ce qui est voué à la destruction.
    reason: lexical_alternative
  - marker: b
    text: Ou « avaient conclu un accord de paix avec Israël ».
    reason: alternative_rendering
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Quand … apprit
  rationale: La combinaison de la formule narrative וַיְהִי et de l’infinitif temporel כִשְׁמֹעַ introduit ici la circonstance de l’épisode. « Quand … apprit » est naturel en français moderne sans ajouter un « maintenant » absent de l’hébreu.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Tsédeq
  rationale: Translittération française lisible du nom composé, avec un trait d’union qui en reflète la structure.
- source_word: לָכַד
  choice: avait pris
  rationale: Dans ce contexte militaire, le verbe désigne la prise d’une ville. « Avait pris » est idiomatique et précis en français.
- source_word: וַיַּחֲרִימָהּ
  choice: l’avait vouée à l’anéantissement
  rationale: Le hiphil de חרם exprime ici la mise sous ḥerem en vue de la destruction. Cette formulation conserve la dimension de consécration et de jugement, sans employer un jargon opaque.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: comme … comme
  rationale: La réorganisation naturelle de la phrase française conserve la comparaison étroite entre le sort de Jéricho et celui d’Aï, sans reproduire lourdement le tour « de même que… ainsi ».
- source_word: עָשָׂה לִירִיחוֹ ... עָשָׂה לָעַי
  choice: avait traité Aï … comme il avait traité Jéricho
  rationale: עשה avec ל signifie ici « faire à » ou « traiter ». La répétition de « traiter » rend le parallélisme tout en restant naturelle en français.
- source_word: הִשְׁלִימוּ ... אֶת יִשְׂרָאֵל
  choice: avaient conclu la paix avec Israël
  rationale: Le hiphil de שלם désigne l’établissement de relations pacifiques ou d’un accord de paix. « Conclure la paix » convient bien au contexte d’alliance négociée.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: les habitants de Gabaon
  rationale: Le participe substantivé désigne les résidents de la ville. « Habitants » est courant et exact.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: et se trouvaient parmi eux
  rationale: בקרבם indique leur présence au milieu du peuple d’Israël. « Se trouvaient parmi eux » préserve cette idée sans préciser davantage la nature de leur intégration.
theological_decisions:
- issue: Rendu du vocabulaire de חרם dans le récit de la conquête
  choice: l’avait vouée à l’anéantissement
  alternative: l’avait entièrement détruite
  rationale: 'Le terme hébreu ne décrit pas seulement une destruction militaire : il comporte l’idée d’une mise à part vouée à la destruction. Le texte principal en conserve la tension cultuelle et judiciaire, tandis que la note donne une formulation plus directe.'
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises bibliques usuelles (Jérusalem, Josué, Aï, Jéricho, Gabaon), tandis qu’Adoni-Tsédeq est translittéré de façon transparente. La virgule finale est conservée parce que le verset forme la proposition circonstancielle d’une phrase qui se poursuit au verset suivant.
