revisions:
- from: Lorsque Josué et les Israélites eurent fini de leur infliger une très grande défaite, jusqu’à les exterminer, les survivants qui restaient parmi eux gagnèrent les villes fortifiées.
  to: Lorsque Josué et les Israélites eurent fini de leur infliger une très grande défaite, jusqu’à ce qu’ils soient entièrement détruits, ceux d’entre eux qui avaient survécu entrèrent dans les villes fortifiées,
  rationale: Révision limitée pour rendre plus fidèlement l’expression hébraïque d’achèvement au passif et préciser que les survivants provenaient du groupe frappé. La phrase conserve sa suspension finale, car le verset se poursuit au verset suivant.
