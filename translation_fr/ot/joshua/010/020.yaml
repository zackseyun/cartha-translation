review_pass:
  verdict: revise
  source_fidelity: La structure temporelle, « les Israélites » et « villes fortifiées » sont bien rendus. Cependant, « jusqu’à les exterminer » introduit une formulation française catégorique qui entre en tension avec la mention explicite de survivants. Le texte hébreu emploie bien une expression d’achèvement/destruction, dont la tension narrative doit être conservée sans être résolue ou accentuée. « Ceux d’entre eux qui avaient survécu » rend clairement מֵהֶם comme désignant le groupe frappé.
  naturalness: La révision reste naturelle en français international moderne. « Ceux d’entre eux qui avaient survécu » est plus idiomatique que « les survivants qui restaient parmi eux » et évite l’ambiguïté de « parmi eux », qui pourrait renvoyer à Josué et aux Israélites.
  terminology: « Infliger une très grande défaite » atténue quelque peu la répétition hébraïque de « frapper » / « grand coup », mais demeure acceptable dans le registre militaire. « Entièrement détruits » restitue plus directement le passif d’achèvement hébreu que « exterminer », sans ajouter un choix lexical chargé.
  issues:
  - severity: medium
    issue: « jusqu’à les exterminer »
    rationale: « Exterminer » présente l’action comme l’élimination totale effective, alors que la proposition suivante mentionne des survivants. Le texte source conserve lui-même une formulation absolue suivie de survivants; « jusqu’à ce qu’ils soient entièrement détruits » suit plus étroitement sa forme passive sans imposer une explication.
  - severity: medium
    issue: « les survivants qui restaient parmi eux »
    rationale: « Parmi eux » est ambigu en français et « restaient » ne rend pas explicitement le verbe שָׂרְדוּ (« survécurent »). La formulation révisée identifie sans ambiguïté les survivants comme appartenant au groupe adverse.
  revised_text: Lorsque Josué et les Israélites eurent fini de leur infliger une très grande défaite, jusqu’à ce qu’ils soient entièrement détruits, ceux d’entre eux qui avaient survécu entrèrent dans les villes fortifiées,
  revised_footnotes: []
