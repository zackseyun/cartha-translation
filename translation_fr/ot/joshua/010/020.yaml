  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: fr
  text: Lorsque Josué et les Israélites eurent fini de leur infliger une très grande défaite, jusqu’à ce qu’ils soient entièrement détruits, ceux d’entre eux qui avaient survécu entrèrent dans les villes fortifiées,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Lorsque … eurent fini
  rationale: La tournure temporelle française rend naturellement וַיְהִי suivi de l’infinitif construit avec כְּ, sans conserver un « il arriva que » lourd et peu idiomatique.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: En français moderne, cette désignation collective restitue naturellement l’idiome hébreu « fils d’Israël » sans suggérer qu’il s’agit uniquement des hommes.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: de leur infliger une très grande défaite
  rationale: La construction associant נכה et מַכָּה exprime ici une frappe militaire dévastatrice. « Infliger une très grande défaite » est naturel et conserve l’idée sans ajouter au nom מַכָּה le sens plus précis de « massacre ».
- source_word: עַד תֻּמָּם
  choice: jusqu’à les exterminer
  rationale: La forme exprime leur anéantissement presque total; « exterminer » convient au contexte militaire tout en laissant la proposition suivante signaler explicitement les survivants.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: les survivants qui restaient parmi eux
  rationale: Cette formulation garde l’insistance produite par le nom et le verbe apparentés en hébreu, mais évite en français la tautologie maladroite « les survivants survécurent ». « Parmi eux » indique qu’ils appartenaient au groupe vaincu.
- source_word: וַיָּבֹאוּ אֶל עָרֵי הַמִּבְצָר
  choice: gagnèrent les villes fortifiées
  rationale: Dans ce contexte, בוא אל indique qu’ils atteignirent ou se réfugièrent dans ces villes. « Gagnèrent » exprime naturellement le mouvement sans expliciter indûment l’idée de refuge.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase demeure suspendue par une virgule, conformément à la syntaxe du verset qui se poursuit au verset suivant. L’expression idiomatique « les Israélites » est préférée au calque « les fils d’Israël ».
