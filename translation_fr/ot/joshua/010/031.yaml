  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לִּבְנָ֖ה לָכִ֑ישָׁ/ה וַ/יִּ֣חַן עָלֶ֔י/הָ וַ/יִּלָּ֖חֶם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: fr
  text: Puis Josué et tout Israël avec lui passèrent de Libna à Lakish. Ils établirent leur camp contre la ville et combattirent contre elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passèrent
  rationale: Le verbe עבר exprime ici le déplacement de l’armée d’une ville à l’autre. « Passèrent de… à… » reste proche de l’hébreu tout en étant naturel en français, sans suggérer nécessairement la traversée d’un cours d’eau.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: et tout Israël avec lui
  rationale: Traduction directe de la tournure collective, qui désigne ici les Israélites accompagnant Josué, notamment les forces engagées dans la campagne.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: de Libna à Lakish
  rationale: Le hé directionnel de לָכִישָׁה marque le mouvement vers Lakish ; « à Lakish » exprime naturellement la destination en français.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Ils établirent leur camp contre la ville
  rationale: חנה signifie établir son camp. Dans ce contexte de siège, עַל indique une position hostile ; « contre la ville » évite l’ambiguïté de « près d’elle ».
- source_word: וַיִּלָּחֶם בָּהּ
  choice: et l’attaquèrent
  rationale: Le niphal de לחם signifie combattre ou faire la guerre. Dans ce contexte militaire, « attaquèrent » rend naturellement l’action dirigée contre la ville, sans lourde répétition de « contre elle ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le second sujet est repris par « Ils » pour alléger la longue coordination hébraïque. « La ville » explicite l’antécédent féminin des suffixes hébreux, à savoir Lakish.
