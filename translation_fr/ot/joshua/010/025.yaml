  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: fr
  text: 'Josué leur dit : « N’ayez pas peur et ne vous laissez pas abattre[a]. Soyez forts et courageux, car c’est ainsi que Yahweh agira envers tous vos ennemis que vous combattez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne soyez pas terrifiés »; le verbe peut évoquer le fait d’être décontenancé ou brisé intérieurement.'
    reason: Alternative lexicale pour חתת, dont le champ sémantique peut inclure la terreur, le découragement ou l’abattement.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: Josué leur dit
  rationale: Le waw consécutif fait avancer le récit. Le passé simple convient au registre narratif français, et le nom est rendu selon sa forme française traditionnelle.
- source_word: אַל תִּירְאוּ
  choice: N’ayez pas peur
  rationale: Cette formulation moderne et naturelle exprime directement l’interdiction portée par ירא.
- source_word: וְאַל תֵּחָתּוּ
  choice: et ne soyez pas terrifiés
  rationale: Le niphal de חתת évoque le fait d’être brisé intérieurement, épouvanté ou décontenancé. « Terrifiés » reste distinct de « avoir peur » tout en étant naturel en français.
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Soyez forts et courageux
  rationale: Cette formule établie dans Josué conserve les deux idées complémentaires de force et de ferme courage.
- source_word: כִּי כָכָה
  choice: car c’est ainsi que
  rationale: Cette tournure conserve à la fois la valeur causale de כִּי et la portée démonstrative de כָּכָה dans un français actuel.
- source_word: יַעֲשֶׂה יְהוָה לְכָל אֹיְבֵיכֶם
  choice: Yahweh traitera tous vos ennemis ainsi
  rationale: Le yiqtol a ici une valeur future. Avec עשה et ל, le français idiomatique « traiter ainsi » exprime ce que Yahweh fera aux ennemis.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: que vous combattez
  rationale: Cette formulation lisse l’objet pronominal redondant, normal en hébreu, sans perdre le sens adversatif du combat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple maintient le registre narratif biblique sans archaïsme marqué; les impératifs au pluriel rendent clairement l’adresse collective.
