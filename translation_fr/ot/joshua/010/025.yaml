  to: 'Josué leur dit : « N’ayez pas peur et ne vous laissez pas abattre[a]. Soyez forts et courageux, car c’est ainsi que Yahweh agira envers tous vos ennemis que vous combattez. »'
  rationale: La révision rétablit le possessif exigé par le texte hébreu et affine le rendu de חתת afin de préserver sa distinction avec ירא. « Agira ainsi envers » exprime le sens de « fera ainsi à/envers » sans l’ambiguïté possible de « traitera ».
