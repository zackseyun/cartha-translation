review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’adresse de Josué, les deux interdictions, l’exhortation « soyez forts et courageux », la valeur future de יעשה et le nom divin Yahweh. Toutefois, « tous les ennemis que vous combattez » omet le possessif explicite de לְכָל אֹיְבֵיכֶם (« tous vos ennemis »).
  naturalness: Le français est globalement naturel et d’un registre biblique moderne. « Ne vous laissez pas abattre » exprime plus idiomatiquement la seconde interdiction que « ne soyez pas terrifiés », tout en évitant de redoubler presque exactement « n’ayez pas peur ».
  terminology: « Josué » et « Yahweh » sont appropriés. « Soyez forts et courageux » rend bien la formule consacrée חזקו ואמצו. « Agira ainsi envers » rend naturellement עשה + ל sans ajouter de nuance étrangère au texte.
  issues:
  - severity: medium
    issue: Le possessif « vos » manque devant « ennemis ».
    rationale: Le suffixe de deuxième personne du pluriel dans אֹיְבֵיכֶם désigne explicitement « vos ennemis »; le français doit le conserver.
  - severity: low
    issue: « Terrifiés » est très proche de « avoir peur » et réduit la distinction entre les deux verbes hébreux.
    rationale: חתת peut évoquer l’abattement, le découragement ou le fait d’être brisé/démoralisé. « Ne vous laissez pas abattre » conserve mieux cette nuance dans un français courant.
  revised_text: 'Josué leur dit : « N’ayez pas peur et ne vous laissez pas abattre[a]. Soyez forts et courageux, car c’est ainsi que Yahweh agira envers tous vos ennemis que vous combattez. »'
  revised_footnotes:
  - marker: a
    text: 'Ou : « ne soyez pas terrifiés »; le verbe peut évoquer le fait d’être décontenancé ou brisé intérieurement.'
    reason: Alternative lexicale pour חתת, dont le champ sémantique peut inclure la terreur, le découragement ou l’abattement.
  revision_rationale: La révision rétablit le possessif exigé par le texte hébreu et affine le rendu de חתת afin de préserver sa distinction avec ירא. « Agira ainsi envers » exprime le sens de « fera ainsi à/envers » sans l’ambiguïté possible de « traitera ».
