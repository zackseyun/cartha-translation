  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לָּכִ֖ישׁ עֶגְלֹ֑נָ/ה וַ/יַּחֲנ֣וּ עָלֶ֔י/הָ וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: fr
  text: Puis Josué, avec tout Israël, passa de Lakish à Églon. Ils campèrent devant elle et combattirent contre elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passa
  rationale: Dans ce récit de déplacement militaire, עבר indique que Josué poursuit sa marche d’une ville à l’autre, sans impliquer nécessairement le franchissement d’un obstacle.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: avec tout Israël
  rationale: Formulation française naturelle qui conserve la désignation collective d’Israël accompagnant Josué.
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: de Lakish à Églon
  rationale: La préposition מִן marque le point de départ, tandis que le hé directionnel de עֶגְלֹנָה marque le mouvement vers Églon.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: Ils établirent leur camp contre la ville
  rationale: חנה désigne l’installation du camp; dans ce contexte de siège, עַל exprime une position hostile. « La ville » explicite naturellement le référent féminin Églon en français.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: et l’attaquèrent
  rationale: Le niphal de לחם avec עַל décrit le fait de combattre contre la ville. « L’attaquèrent » rend naturellement l’action militaire dirigée contre elle, sans la lourde répétition de « contre la ville ».
