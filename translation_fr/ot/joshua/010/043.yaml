  text: וַ/יָּ֤שָׁב יְהוֹשֻׁ֨עַ֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּֽלָ/ה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/043.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: fr
  text: Puis Josué retourna avec tout Israël au camp de Guilgal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « au camp, vers Guilgal ». En hébreu, le nom « Guilgal » porte une terminaison indiquant la direction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: retourna
  rationale: Dans cette suite narrative, le verbe שׁוב exprime le retour; le passé simple convient au registre narratif français.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: וְכָל יִשְׂרָאֵל
  choice: avec tout Israël
  rationale: Conserve le sens collectif de l’hébreu sans préciser indûment s’il s’agit de tout le peuple ou de l’armée qui le représente.
- source_word: עִמּוֹ
  choice: avec
  rationale: L’accompagnement exprimé par « avec lui » est rendu naturellement en français par la construction « Josué retourna avec tout Israël », qui évite une reprise pronominale lourde sans en changer le sens.
- source_word: אֶל הַמַּחֲנֶה
  choice: au camp
  rationale: Rend naturellement le mouvement vers le camp militaire, sans surspécifier l’entrée dans celui-ci.
- source_word: הַגִּלְגָּלָה
  choice: de Guilgal
  rationale: Dans « au camp de Guilgal », le complément identifie naturellement le lieu du camp, tandis que le déplacement vers Guilgal est déjà porté par « au »; une note signale la forme directionnelle de l’hébreu.
