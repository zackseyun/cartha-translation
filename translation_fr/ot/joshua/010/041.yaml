source:
  edition: WLC
  text: וַ/יַּכֵּ֧/ם יְהוֹשֻׁ֛עַ מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ וְ/עַד עַזָּ֑ה וְ/אֵ֛ת כָּל אֶ֥רֶץ גֹּ֖שֶׁן וְ/עַד גִּבְעֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: fr
  text: Josué les battit depuis Qadesh-Barnéa jusqu’à Gaza[a], ainsi que tout le pays de Goshèn, jusqu’à Gabaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frappa ». Le verbe hébreu peut désigner une attaque ou une défaite militaire sans toujours préciser de quelle manière les personnes visées furent atteintes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: les battit
  rationale: Le verbe נכה, muni du suffixe de troisième personne du pluriel, décrit ici une action militaire contre les populations évoquées dans le contexte. « Les battit » exprime leur défaite sans affirmer que chacun fut tué.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: depuis Qadesh-Barnéa
  rationale: La préposition מִן marque le point de départ ou l’une des limites de l’étendue géographique. La graphie française « Qadesh-Barnéa » conserve le nom traditionnel tout en indiquant la prononciation du qof.
- source_word: וְעַד עַזָּה
  choice: jusqu’à Gaza
  rationale: עַד indique ici la limite de l’étendue territoriale, naturellement rendue en français par « jusqu’à ».
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: ainsi que tout le pays de Goshèn
  rationale: La marque d’objet direct אֵת introduit une autre région touchée par la campagne. « Ainsi que » rend clairement l’ajout sans transformer explicitement la relation en inclusion.
- source_word: וְעַד גִּבְעוֹן
  choice: jusqu’à Gabaon
  rationale: עַד marque de nouveau une limite géographique. « Gabaon » est la forme française usuelle du toponyme biblique.
theological_decisions: []
