base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: fr
  text: Alors Horam, roi de Guézer, monta au secours de Lakish, et Josué le frappa, lui et son peuple, jusqu’à ne lui laisser aucun survivant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « personne qui restait ». Le mot hébreu שָׂרִיד peut désigner un survivant ou quelqu’un qui demeure.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel et narratif qui introduit l’événement suivant; « Alors » conserve naturellement l’enchaînement du récit.
- source_word: עָלָה
  choice: monta
  rationale: Le verbe signifie littéralement « monter ». Dans ce contexte militaire, il décrit l’avancée de Horam sans qu’il soit nécessaire d’ajouter explicitement « marcher » ou « combattre ».
- source_word: הֹרָם
  choice: Horam
  rationale: Translittération usuelle du nom propre hébreu.
- source_word: מֶלֶךְ גֶּזֶר
  choice: roi de Guézer
  rationale: Rend directement la chaîne construite qui indique la fonction royale de Horam et la ville sur laquelle il règne.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: au secours de Lakish
  rationale: L’infinitif de עזר exprime l’aide apportée. « Monter au secours de » est une formulation française naturelle dans ce contexte militaire.
- source_word: וַיַּכֵּהוּ
  choice: mais Josué le frappa
  rationale: נכה peut signifier frapper ou vaincre. « Frapper » préserve l’image verbale du texte, tandis que « mais » explicite avec naturel le contraste narratif implicite entre le secours projeté et son échec.
- source_word: וְאֶת עַמּוֹ
  choice: lui et son peuple
  rationale: עַם désigne le « peuple » au sens large. Même si le contexte vise probablement les combattants, « peuple » évite de réduire sans nécessité le terme à l’armée.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: jusqu’à ne lui laisser aucun
  rationale: 'La construction marque l’étendue ou le résultat de l’attaque: elle se poursuit au point qu’il ne reste personne à Horam. Cette tournure conserve la syntaxe et la relation de résultat.'
- source_word: שָׂרִיד
  choice: survivant
  rationale: שָׂרִיד désigne quelqu’un qui survit ou demeure. « Survivant » est ici le terme français le plus naturel, tout en signalant en note l’autre nuance possible.
