source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: fr
  text: Comme ils fuyaient devant Israël[a], alors qu’ils étaient sur la descente de Beth-Horôn, Yahweh lança du ciel sur eux de grosses pierres jusqu’à Azéqa, et ils moururent. Il y eut plus de morts par les pierres de grêle que les fils d’Israël n’en tuèrent par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « devant les Israélites ».'
    reason: Alternative lexicale explicitant le sens collectif d’« Israël » dans ce contexte militaire.
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: Pendant qu’ils fuyaient devant Israël
  rationale: L’infinitif construit précédé de ב exprime une action simultanée; « devant Israël » rend naturellement la fuite face à l’adversaire tout en conservant le nom collectif du texte.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: alors qu’ils descendaient la pente de Beth-Horôn
  rationale: מוֹרָד désigne une descente ou une pente descendante; cette formulation française exprime clairement le mouvement et la réalité topographique.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Transcription du nom divin יהוה, plutôt que son remplacement par un titre.
- source_word: הִשְׁלִיךְ
  choice: lança
  rationale: Le verbe signifie jeter ou lancer; « lança » est direct, actuel et convient à des projectiles venant du ciel sans ajouter un adverbe absent de l’hébreu.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: de grosses pierres
  rationale: Conserve la description initiale générique des objets, avant leur identification ultérieure comme pierres de grêle.
- source_word: מִן הַשָּׁמַיִם
  choice: du ciel
  rationale: Rend le sens spatial tout en maintenant la résonance théologique de l’intervention divine.
- source_word: עַד עֲזֵקָה
  choice: jusqu’à Azéqa
  rationale: עַד marque ici l’étendue géographique du phénomène le long de la fuite.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: sous les pierres de grêle
  rationale: La formulation garde le lien lexical avec les « pierres » déjà mentionnées et les identifie maintenant comme de la grêle; « sous » exprime idiomatiquement en français la cause de la mort provoquée par leur chute.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit l’expression ethnonymique masculine du texte hébreu; une formulation française plus idiomatique est signalée en note.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: Rend le beth instrumental et conserve le singulier collectif conventionnel de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Nature des projectiles célestes
  choice: Maintenir la progression « grosses pierres », puis « pierres de grêle »
  alternative: Employer « grêlons » dès la première mention
  rationale: L’hébreu les décrit d’abord comme de grosses pierres venues du ciel, puis les désigne comme des pierres de grêle; conserver les deux étapes évite d’aplanir la présentation narrative.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal garde la forme traditionnelle et grammaticalement masculine de l’expression hébraïque, tandis que la note fournit l’équivalent ethnonymique courant sans imposer une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent une translittération française lisible. La structure comparative finale est explicitée sans résoudre autrement la tension du texte entre l’action directe de Yahweh et celle des combattants israélites.
