revisions:
- from: Pendant qu’ils fuyaient devant Israël[a], alors qu’ils descendaient la pente de Beth-Horôn, Yahweh lança du ciel sur eux de grosses pierres jusqu’à Azéqa, et ils moururent. Ceux qui moururent sous les pierres de grêle furent plus nombreux que ceux que les fils d’Israël tuèrent par l’épée.
  to: Comme ils fuyaient devant Israël[a], alors qu’ils étaient sur la descente de Beth-Horôn, Yahweh lança du ciel sur eux de grosses pierres jusqu’à Azéqa, et ils moururent. Il y eut plus de morts par les pierres de grêle que les fils d’Israël n’en tuèrent par l’épée.
  rationale: La révision supprime une redondance stylistique, évite d’ajouter explicitement un mouvement de descente que le texte hébreu n’énonce pas, et rend l’instrumental des pierres de grêle de manière plus directe. Elle conserve les noms propres, le nom divin, la progression narrative des projectiles et l’ambiguïté historique du récit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:07:48Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend avec exactitude la fuite devant Israël, l’intervention de Yahweh, la progression « grosses pierres » puis « pierres de grêle », et la comparaison avec les morts causées par l’épée. Toutefois, le participe circonstanciel hébreu situe les fuyards « dans/sur la descente de Beth-Horôn » sans exprimer explicitement qu’ils étaient en train de descendre. La formulation révisée préserve cette nuance topographique.
  naturalness: Le double marquage temporel « Pendant que …, alors que … » est lourd. La reformulation allège la phrase tout en gardant la simultanéité. La tournure comparative « Il y eut plus de morts … que les fils d’Israël n’en tuèrent » est idiomatique et restitue clairement le comparatif hébreu.
  terminology: « Yahweh », « Beth-Horôn », « Azéqa », « grosses pierres », « pierres de grêle », « les fils d’Israël » et « par l’épée » sont cohérents avec le texte source et avec un registre biblique moderne. « Par les pierres de grêle » rend plus directement la valeur instrumentale de l’hébreu que « sous les pierres de grêle ».
  issues:
  - severity: low
    issue: Redondance temporelle et mouvement rendu trop explicitement
    rationale: « Pendant qu’ils fuyaient » et « alors qu’ils descendaient » alourdissent la construction; de plus, בְּמוֹרַד désigne la descente/le versant comme lieu, sans verbe explicite de descendre.
  - severity: low
    issue: Valeur instrumentale de בְּאַבְנֵי הַבָּרָד
    rationale: « Sous les pierres de grêle » est compréhensible, mais « par les pierres de grêle » correspond plus directement à l’instrumental hébreu et maintient le parallèle avec « par l’épée ».
  revised_text: Comme ils fuyaient devant Israël[a], alors qu’ils étaient sur la descente de Beth-Horôn, Yahweh lança du ciel sur eux de grosses pierres jusqu’à Azéqa, et ils moururent. Il y eut plus de morts par les pierres de grêle que les fils d’Israël n’en tuèrent par l’épée.
