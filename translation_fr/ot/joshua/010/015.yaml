  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: fr
  text: Puis Josué, avec tout Israël, retourna au camp de Guilgal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une déclaration semblable sur le retour à Guilgal figure en Josué 10.43. Certains interprètes considèrent ce verset comme une anticipation narrative ou comme un élément déplacé dans le texte ; l’hébreu est ici traduit tel qu’il se présente.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Puis … retourna
  rationale: Le verbe שׁוב au wayyiqtol exprime ici la progression du récit et un retour vers un lieu antérieur. « Puis » rend naturellement l’enchaînement narratif.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: וְכָל יִשְׂרָאֵל
  choice: avec tout Israël
  rationale: Cette formulation conserve le sens collectif de l’hébreu sans préciser indûment s’il s’agit de l’ensemble du peuple ou des forces engagées.
- source_word: עִמּוֹ
  choice: avec …
  rationale: Rend directement la préposition עִם munie du suffixe masculin singulier, le référent étant Josué.
- source_word: אֶל הַמַּחֲנֶה
  choice: au camp
  rationale: מַחֲנֶה désigne couramment un camp, notamment militaire; « au camp » exprime naturellement le mouvement vers celui-ci.
- source_word: הַגִּלְגָּלָה
  choice: de Guilgal
  rationale: Le suffixe directionnel indique un mouvement vers Guilgal. En français, « au camp de Guilgal » est naturel et situe le camp sans alourdir la phrase.
theological_decisions:
- issue: Place du verset dans le récit et ressemblance avec Josué 10.43
  choice: Traduire le texte massorétique tel qu’il se présente, sans harmoniser ni omettre le verset.
  alternative: Considérer cette phrase comme une anticipation narrative ou comme un élément déplacé, puisqu’une déclaration semblable figure en Josué 10.43.
  rationale: La traduction représente fidèlement le texte hébreu reçu et laisse ouverte la question de sa place littéraire; la note signale la difficulté sans la résoudre dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre des compléments a été légèrement réorganisé pour produire une phrase naturelle, tout en conservant le sens collectif de « tout Israël » et l’ambiguïté littéraire du verset.
