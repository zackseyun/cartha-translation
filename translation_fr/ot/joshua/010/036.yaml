  text: וַ/יַּ֣עַל יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מֵ/עֶגְל֖וֹנָ/ה חֶבְר֑וֹנָ/ה וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: fr
  text: Puis Josué monta d’Églon à Hébron avec tout Israël, et ils combattirent contre la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime un déplacement vers le haut. « Monta » conserve ce sens directionnel et convient naturellement au trajet vers Hébron.
- source_word: וְכָל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Cette expression collective désigne ici l’ensemble des forces israélites accompagnant Josué. « Tout Israël » reste proche de l’hébreu et appartient au français biblique courant.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Rend directement la préposition et son suffixe masculin singulier, qui renvoie à Josué.
- source_word: מֵעֶגְלוֹנָה
  choice: d’Églon
  rationale: La préposition מן indique le point de départ. En français, « d’Églon » exprime naturellement cette provenance.
- source_word: חֶבְרוֹנָה
  choice: à Hébron
  rationale: Le ה directionnel marque un mouvement vers Hébron ; « à Hébron » en donne l’équivalent français idiomatique.
- source_word: וַיִּלָּחֲמוּ
  choice: ils combattirent
  rationale: Le niphal de לחם signifie ici livrer combat. « Ils combattirent » préserve la valeur militaire sans transformer explicitement l’action en siège ou en attaque.
- source_word: עָלֶיהָ
  choice: contre la ville
  rationale: La préposition על a ici un sens hostile, et le suffixe féminin renvoie à Hébron en tant que ville. La reprise explicite « la ville » est naturelle en français et évite l’étrangeté de « contre elle » sans modifier le référent.
