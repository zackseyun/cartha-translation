source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: fr
  text: Yahvé livra aussi la ville et son roi au pouvoir d’Israël. Il la frappa du tranchant de l’épée, ainsi que toute personne[a] qui s’y trouvait. Il n’y laissa aucun survivant et fit à son roi ce qu’il avait fait au roi de Jéricho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute âme qui était en elle », expression hébraïque désignant toute personne présente dans la ville.'
    reason: Précise le sens contextuel de נֶפֶשׁ et signale la formulation littérale sans suggérer une doctrine particulière de l’âme.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre, dans une forme française courante et immédiatement reconnaissable.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: livra ... au pouvoir d’Israël
  rationale: L’expression hébraïque signifie remettre quelqu’un ou quelque chose sous l’autorité d’un autre. « Au pouvoir de » restitue naturellement le sens de l’image de la main.
- source_word: גַּם
  choice: aussi
  rationale: Marque la continuité avec la conquête racontée juste auparavant.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: la ville et son roi
  rationale: Le pronom féminin renvoie à Libna, la ville mentionnée dans le contexte. L’explicitation évite en français un pronom sans antécédent dans le verset isolé.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: Il la frappa du tranchant de l’épée
  rationale: Conserve le verbe « frapper » et l’image hébraïque de la bouche ou du tranchant de l’épée, sans réduire l’expression à une simple défaite militaire.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: toute personne qui s’y trouvait
  rationale: נפש désigne ici chaque être humain présent dans la ville, et non l’âme au sens d’une affirmation anthropologique.
- source_word: לֹא הִשְׁאִיר בָּהּ שָׂרִיד
  choice: Il n’y laissa aucun survivant
  rationale: שָׂרִיד désigne celui qui demeure en vie; « aucun survivant » est précis et naturel en français.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: fit à son roi ce qu’il avait fait au roi de Jéricho
  rationale: Reproduit la répétition du verbe עשה et rend explicitement l’antériorité de l’action concernant Jéricho.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans un récit de guerre
  choice: toute personne
  alternative: toute âme
  rationale: Dans ce contexte, le mot désigne les personnes présentes dans la ville. « Personne » évite d’introduire une conception particulière de l’âme.
- issue: Sujet implicite des verbes après l’action de Yahvé
  choice: conserver le pronom « il »
  alternative: nommer Josué
  rationale: L’hébreu n’explicite pas de nouveau le sujet. Le contexte narratif permet de comprendre Josué, mais le pronom préserve la formulation et une part de l’implicite du texte source.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe demeure proche de l’hébreu tout en explicitant « la ville » pour assurer la clarté hors contexte. Le registre guerrier et la dureté du propos sont conservés sans atténuation ni amplification.
