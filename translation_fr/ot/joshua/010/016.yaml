  yaml_path: translation/ot/joshua/010/016.yaml
  text: But these five kings fled and hid in the cave at Makkedah[a].
translation:
  language: fr
  text: Ces cinq rois s’enfuirent et se cachèrent dans la grotte de Maqqéda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: s’enfuirent
  rationale: Le verbe נוּס exprime la fuite devant un danger. « S’enfuirent » rend naturellement en français le mouvement de retraite sous la menace.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ces cinq rois
  rationale: Cette formulation conserve le démonstratif הָאֵלֶּה et suit l’ordre naturel du français.
- source_word: וַיֵּחָבְאוּ
  choice: se cachèrent
  rationale: La forme exprime l’action de se dissimuler; « se cachèrent » est clair, courant et fidèle à la valeur réfléchie du contexte.
- source_word: בַמְּעָרָה
  choice: dans la grotte
  rationale: L’article hébreu est conservé par « la »; la préposition « dans » exprime précisément l’entrée ou la présence à l’intérieur de la grotte.
- source_word: בְּמַקֵּדָה
  choice: de Maqqéda
  rationale: Dans « la grotte de Maqqéda », le complément situe naturellement la grotte par rapport à la localité. « Maqqéda » translittère le nom מַקֵּדָה en français.
- source_word: וַ
  choice: Ces cinq rois…
  rationale: Le waw narratif fait avancer le récit sans imposer à lui seul une opposition. En français, l’absence de connecteur est naturelle ici et évite d’ajouter le contraste explicite de « mais ».
