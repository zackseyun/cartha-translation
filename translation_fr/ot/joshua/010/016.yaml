  text: וַ/יָּנֻ֕סוּ חֲמֵ֖שֶׁת הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַ/יֵּחָבְא֥וּ בַ/מְּעָרָ֖ה בְּ/מַקֵּדָֽה׃
base_translation:
