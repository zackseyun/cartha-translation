base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: fr
  text: 'Ils firent ainsi et amenèrent auprès de lui, hors de la grotte, ces cinq rois : le roi de Jérusalem, le roi d’Hébron, le roi de Yarmouth, le roi de Lakish et le roi d’Églôn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Ils firent ainsi
  rationale: Formule narrative exprimant l’exécution de l’ordre précédent; cette tournure est naturelle et digne en français.
- source_word: וַיֹּצִיאוּ
  choice: amenèrent … hors de
  rationale: La forme causative de יצא signifie « faire sortir ». Avec des personnes conduites à Josué, « amenèrent … hors de » exprime naturellement le mouvement sans ajouter qu’elles furent escortées.
- source_word: אֵלָיו
  choice: auprès de lui
  rationale: אל indique un mouvement en direction de Josué. « Auprès de lui » reste proche du sens spatial sans expliciter son nom ni transformer la formule en « devant lui ».
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ces cinq rois
  rationale: Rend directement le groupe nominal avec numéral et démonstratif; « rois » traduit précisément מְלָכִים.
- source_word: מִן הַמְּעָרָה
  choice: hors de la grotte
  rationale: Exprime clairement l’extraction depuis l’intérieur de la grotte.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent français précis et usuel du titre royal.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française traditionnelle et standard du nom de lieu.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française traditionnelle et standard du nom de lieu.
- source_word: יַרְמוּת
  choice: Yarmouth
  rationale: Forme française biblique courante du nom de cette ville cananéenne.
- source_word: לָכִישׁ
  choice: Lakish
  rationale: Translittération française moderne et reconnaissable du nom de lieu.
- source_word: עֶגְלוֹן
  choice: Églôn
  rationale: Forme française traditionnelle du nom de lieu; dans ce contexte, il s’agit de la ville et non du roi moabite du livre des Juges.
