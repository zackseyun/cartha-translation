  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: fr
  text: Ils eurent très peur, car Gabaon était une grande ville, comme l’une des villes du royaume, et parce qu’elle était plus grande qu’Aï et que tous ses hommes étaient des guerriers vaillants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ses hommes étaient puissants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: Ils furent saisis d’une grande peur
  rationale: Rend avec naturel le verbe ירא et l’intensif מְאֹד, tout en conservant la force de la réaction dans le récit.
- source_word: כִּי
  choice: car
  rationale: Introduit clairement la cause de leur peur dans un registre narratif français courant et digne.
- source_word: עִיר גְּדוֹלָה
  choice: une grande ville
  rationale: Préserve l’amplitude de גָּדוֹל, qui peut évoquer à la fois les dimensions et l’importance de la ville.
- source_word: גִּבְעוֹן
  choice: Gabaon
  rationale: Forme française biblique usuelle du nom de lieu.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: comparable à l’une des villes royales
  rationale: Exprime idiomatiquement la comparaison et le rang royal suggéré par l’expression hébraïque, sans réduire celle-ci à la seule appartenance territoriale.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: Elle était plus grande qu’Aï
  rationale: Maintient le même adjectif que dans la proposition précédente et laisse ouvertes les nuances de taille et d’importance.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: tous ses hommes
  rationale: Dans ce contexte militaire, אֲנָשִׁים vise les hommes de la ville, plutôt que l’ensemble indifférencié de ses habitants.
- source_word: גִּבֹּרִים
  choice: de vaillants guerriers
  rationale: Rend explicitement la valeur martiale probable de גִּבּוֹרִים en français naturel; une formulation plus littérale est conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « grande » est conservée afin de refléter le lien lexical de l’hébreu. La division en deux phrases améliore la lisibilité sans modifier la logique causale.
