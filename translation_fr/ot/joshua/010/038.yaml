  text: וַ/יָּ֧שָׁב יְהוֹשֻׁ֛עַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ דְּבִ֑רָ/ה וַ/יִּלָּ֖חֶם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: fr
  text: Puis Josué, avec tout Israël à ses côtés, retourna à Debir et la combattit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: retournèrent
  rationale: Le verbe שׁוב exprime ici un mouvement de retour. Le pluriel français s’accorde naturellement avec le sujet composé « Josué et tout Israël avec lui ».
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: et tout Israël avec lui
  rationale: Cette formulation conserve l’expression collective כָל יִשְׂרָאֵל ainsi que la précision עִמּוֹ, sans expliciter davantage la nature des forces concernées.
- source_word: דְּבִרָה
  choice: à Debir
  rationale: Le hé directionnel indique un mouvement vers Debir ; après « retourner », la préposition « à » l’exprime naturellement en français.
- source_word: וַיִּלָּחֶם
  choice: combattirent
  rationale: Le verbe לחם désigne ici l’engagement dans le combat. Le pluriel suit le sujet composé en français et évite de réduire le sens à une simple attaque initiale.
- source_word: עָלֶיהָ
  choice: contre elle
  rationale: Le pronom féminin singulier renvoie à la ville de Debir. En français, « ville » étant féminin, « contre elle » est à la fois naturel et proche de la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Récit historique en français moderne, sobre et digne. Le passé simple convient à la narration suivie. Le pronom féminin « elle » conserve naturellement le renvoi à la ville, sans personnification particulière.
