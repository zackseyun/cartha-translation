  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: fr
  text: Il n’y eut, ni avant ce jour-là ni après lui, de jour semblable où Yahweh ait écouté la voix d’un homme, car Yahweh combattait pour Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא הָיָה
  choice: Il n’y eut jamais
  rationale: Rend naturellement en français la proposition existentielle négative et son caractère absolu dans ce contexte.
- source_word: כַּיּוֹם הַהוּא
  choice: de jour pareil
  rationale: Exprime la comparaison et l’unicité de ce jour sans alourdir la formulation.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: ni avant ni après
  rationale: Les suffixes renvoient le plus naturellement au jour; la formulation française permet de conserver ce sens de façon concise.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: où Yahweh ait écouté la voix d’un homme
  rationale: Conserve l’image et l’ambiguïté de l’idiome hébreu, tout en reliant l’infinitif à la circonstance qui rend ce jour incomparable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français l’explication donnée par la dernière proposition.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: combattait pour Israël
  rationale: Le verbe désigne l’action de combattre en faveur d’Israël; l’imparfait présente cette action comme la circonstance explicative de l’événement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription préserve le nom propre présent dans le texte hébreu et évite de le confondre avec un titre.
- issue: Sens de לִשְׁמֹעַ ... בְּקוֹל אִישׁ
  choice: Yahweh ait écouté la voix d’un homme
  alternative: Yahweh ait exaucé la demande d’un homme
  rationale: Le texte dit littéralement « écouter la voix d’un homme ». Le maintien de cet idiome préserve sa force et évite de préciser implicitement que la parole était une requête, même si ce sens est probable dans le contexte.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « Il n’y eut jamais » souligne l’affirmation d’unicité; le subjonctif passé après « jour pareil où » est soutenu mais courant dans un texte littéraire.
