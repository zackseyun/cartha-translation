id: JOS.10.40
reference: Joshua 10:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: fr
  text: Josué frappa tout le pays — la région montagneuse, le Néguev, les basses terres et les versants — ainsi que tous leurs rois. Il ne laissa aucun survivant et voua à la destruction[b] tout ce qui respirait[a], comme Yahvé, le Dieu d’Israël, l’avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout souffle » ; autre traduction : « tout être qui respirait ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions : « extermina entièrement » ou « frappa d’interdit ». Le verbe hébreu désigne le fait de vouer irrévocablement quelque chose à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: frappa
  rationale: Le verbe נכה exprime ici l’action de frapper ou d’abattre dans un contexte militaire. « Frappa » en conserve la force sans préciser davantage l’issue que ne le fait le verbe hébreu.
- source_word: כָּל הָאָרֶץ
  choice: tout le pays
  rationale: אֶרֶץ désigne ici le territoire régional concerné par la campagne, et non la terre entière. « Tout le pays » rend naturellement cette portée.
- source_word: הָהָר
  choice: la région montagneuse
  rationale: Dans Josué, הָהָר est souvent un terme géographique régional. « La région montagneuse » le rend clairement sans le réduire à quelques montagnes particulières.
- source_word: הַנֶּגֶב
  choice: le Néguev
  rationale: Le mot désigne ici la région aride du sud. Le nom géographique « Néguev » est précis et courant en français.
- source_word: הַשְּׁפֵלָה
  choice: les basses terres
  rationale: שְׁפֵלָה désigne la zone de faible altitude située entre la région montagneuse et la plaine côtière. « Les basses terres » reste intelligible tout en conservant la valeur topographique.
- source_word: הָאֲשֵׁדוֹת
  choice: les versants
  rationale: אֲשֵׁדוֹת désigne des pentes ou déclivités. « Les versants » convient à cette énumération topographique.
- source_word: כָּל מַלְכֵיהֶם
  choice: tous leurs rois
  rationale: Cette formulation conserve le pronom pluriel hébreu, qui renvoie aux différentes régions énumérées.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Il ne laissa aucun survivant
  rationale: שָׂרִיד signifie « survivant » ou « reste ». Dans ce contexte militaire, « aucun survivant » est direct et naturel.
- source_word: כָּל הַנְּשָׁמָה
  choice: tout ce qui respirait
  rationale: L’expression signifie littéralement « tout souffle » ou « tout ce qui respire ». Cette traduction garde l’image et l’étendue non explicitement restreinte de l’hébreu.
- source_word: הֶחֱרִים
  choice: voua à la destruction
  rationale: Le hiphil de חרם désigne le fait de placer irrévocablement sous le ḥerem en vue de la destruction. « Voua à la destruction » conserve à la fois la dimension de consécration et l’issue destructrice.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme … l’avait ordonné
  rationale: La proposition marque la conformité à un commandement divin antérieur. Le plus-que-parfait l’exprime naturellement en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du vocabulaire de guerre חרם
  choice: voua à la destruction
  alternative: extermina entièrement ; frappa d’interdit
  rationale: Le rendu retenu préserve la charge cultuelle et théologique du verbe sans la réduire à une simple destruction militaire ni employer seul un terme technique difficile.
- issue: Portée de כָּל הַנְּשָׁמָה
  choice: tout ce qui respirait
  alternative: toute personne ; tout être vivant
  rationale: La traduction maintient l’expression hébraïque et son ampleur, sans la restreindre de manière interprétative aux seuls humains ni en atténuer la dureté.
translation_notes:
  register: Français international moderne, sobre et digne. Les termes géographiques sont rendus de façon accessible. Les deux notes sont placées sur les expressions auxquelles elles se rapportent, contrairement au positionnement manifestement décalé des marqueurs dans la couche anglaise fournie.
