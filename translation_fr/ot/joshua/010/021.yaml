base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: fr
  text: Tout le peuple revint sain et sauf au camp, auprès de Josué, à Maqqéda. Personne ne prononça la moindre parole contre aucun des fils d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Personne n’a aiguisé sa langue contre les fils d’Israël. » Cette expression évoque une parole hostile ou menaçante.'
    reason: Conserver l’image de l’idiome hébreu tout en employant une formulation naturelle dans le texte principal.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל־הָעָם
  choice: Tout le peuple revint
  rationale: Le verbe שׁוּב décrit ici le retour après la poursuite. « Tout le peuple » conserve le collectif hébreu עָם sans le remplacer par le terme plus interprétatif « armée ».
- source_word: אֶל־הַמַּחֲנֶה אֶל־יְהוֹשֻׁעַ מַקֵּדָה
  choice: au camp, auprès de Josué, à Maqqéda
  rationale: La formulation hébraïque est condensée. Cette construction française rattache naturellement le camp à Josué et situe celui-ci à Maqqéda, sans multiplier artificiellement les verbes de mouvement.
- source_word: בְּשָׁלוֹם
  choice: sain et sauf
  rationale: Dans ce contexte militaire, שָׁלוֹם indique que le groupe revient en sécurité et indemne. « Sain et sauf » exprime ce sens plus clairement que le calque potentiellement ambigu « en paix ».
- source_word: לֹא חָרַץ ... אֶת־לְשֹׁנוֹ
  choice: Personne ne prononça la moindre parole contre
  rationale: L’expression hébraïque, littéralement liée à l’action d’aiguiser ou de remuer la langue, désigne ici une parole hostile. La traduction idiomatique française en donne le sens, tandis que la note conserve l’image originale.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette formulation garde la désignation nationale et généalogique explicitement masculine de l’hébreu, ainsi que sa résonance biblique.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites
  rationale: « Fils d’Israël » reproduit la forme généalogique du texte source sans imposer une reformulation confessionnelle. « Israélites » serait naturel, mais effacerait cette forme.
- issue: Portée de l’expression concernant la langue
  choice: parole hostile dirigée contre Israël
  alternative: silence absolu de toute personne présente
  rationale: Le contexte et l’idiome indiquent l’absence de parole hostile ou menaçante contre les fils d’Israël, non nécessairement un silence universel au sens strict.
translation_notes:
  register: Français international moderne, digne et accessible. La première phrase réorganise légèrement les compléments pour être naturelle en français. « Sain et sauf » explicite la valeur contextuelle de בְּשָׁלוֹם; le collectif singulier « tout le peuple » commande cette forme.
