source:
  edition: WLC
  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: fr
  text: Alors les cinq rois des Amorites — le roi de Jérusalem, le roi d’Hébron, le roi de Yarmouth, le roi de Lakish et le roi d’Églon — se rassemblèrent et montèrent, eux et toutes leurs armées[a]. Ils établirent leur camp contre Gabaon et lui firent la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « eux et tous leurs camps ».'
    reason: L’hébreu emploie le pluriel de מַחֲנֶה, « camp », qui peut désigner par extension une armée ou des troupes.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: se rassemblèrent
  rationale: Le nifal exprime ici le fait de se réunir. Cette formulation conserve le sens collectif sans préciser indûment la nature politique de leur entente.
- source_word: וַיַּעֲלוּ
  choice: montèrent
  rationale: Le verbe עלה signifie couramment « monter ». Le choix conserve la formulation spatiale ou directionnelle de l’hébreu sans la remplacer par l’interprétation plus militaire « avancèrent ».
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: les cinq rois des Amorites
  rationale: Cette traduction maintient explicitement le rapport construit et la désignation ethnique du texte source.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: le roi de Jérusalem, le roi d’Hébron, le roi de Yarmouth, le roi de Lakish et le roi d’Églon
  rationale: La répétition de « le roi de » reproduit l’énumération délibérée de chaque souverain dans l’hébreu.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: eux et toutes leurs armées
  rationale: Dans ce contexte militaire, מַחֲנֶה désigne par métonymie les troupes réunies autour de chaque roi. « Armées » communique naturellement ce sens en français, tandis que l’image littérale des « camps » est signalée en note.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: ils établirent leur camp contre Gabaon
  rationale: Le contexte immédiatement hostile favorise le sens adversatif de עַל. « Établirent leur camp » restitue clairement le verbe חנה.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: lui firent la guerre
  rationale: Le verbe désigne l’action de combattre ou de faire la guerre. Le pronom renvoie à la ville de Gabaon et cette tournure reste naturelle en français.
