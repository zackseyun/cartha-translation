source:
  edition: WLC
  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: fr
  text: Après cela, Josué les frappa et les mit à mort, puis il les pendit à cinq arbres[a]. Ils restèrent pendus aux arbres jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les suspendit ». Le verbe hébreu désigne le fait de suspendre des corps à un arbre ou à du bois ; « les empala » est possible, mais moins certain ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: les frappa
  rationale: Le hifil de נכה avec suffixe pluriel indique que Josué les frappe. Cette formulation conserve l’action distincte de la mise à mort exprimée par le verbe suivant, sans ajouter « abattit », qui pourrait déjà impliquer leur mort.
- source_word: אַחֲרֵי כֵן
  choice: Après cela
  rationale: Expression temporelle courante qui marque naturellement la succession des événements.
- source_word: וַיְמִיתֵם
  choice: les mit à mort
  rationale: Le hifil de מות a une valeur causative. « Mit à mort » convient au contexte d’exécution et reste distinct de « les frappa ».
- source_word: וַיִּתְלֵם
  choice: les pendit
  rationale: תלה désigne ici la suspension de personnes ou de leurs corps à du bois ou à un arbre pour les exposer. « Pendit » préserve cette idée sans préciser à tort le procédé exact.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: à cinq arbres
  rationale: עֵץ signifie couramment « arbre » ou « bois ». « Arbres » est le sens concret le plus direct dans ce passage, sans introduire des poteaux ou des gibets non explicités.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: Ils restèrent pendus
  rationale: La construction היה suivie d’un participe passif décrit un état qui se prolonge. « Restèrent pendus » en rend clairement la durée.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Rendu français naturel de la limite temporelle, sans interpréter plus précisément l’expression comme « jusqu’au coucher du soleil ».
theological_decisions:
- issue: Nature du support désigné par עֵץ dans ce contexte d’exposition judiciaire
  choice: arbres
  alternative: poteaux de bois ; gibets
  rationale: Le texte ne précise pas la forme d’un dispositif d’exécution. « Arbres » conserve le sens ordinaire du nom hébreu et évite d’importer une représentation ultérieure ou trop précise.
- issue: Procédé exact désigné par תלה
  choice: pendit
  alternative: suspendit ; empala
  rationale: Le verbe indique la suspension ou l’exposition sur du bois, mais ne permet pas à lui seul d’établir une pendaison causant la mort ni un empalement. Le contexte précise déjà qu’ils ont été mis à mort avant d’être pendus.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « pendit/pendus » et de « arbres » reflète celle de l’hébreu. La ponctuation en deux phrases allège la lecture sans modifier la séquence des actions.
