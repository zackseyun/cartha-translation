source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: fr
  text: 'Lorsqu’on eut fait sortir ces rois pour les amener à Josué, Josué appela tous les hommes d’Israël[a] et dit aux chefs des combattants[b] qui étaient allés avec lui : « Approchez-vous et posez vos pieds sur les cous de ces rois. » Ils s’approchèrent donc et posèrent leurs pieds sur leurs cous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chaque homme d’Israël » ; dans ce contexte militaire, l’expression désigne les hommes rassemblés avec l’armée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aux commandants des combattants » ; littéralement, « aux chefs des hommes de guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: Lorsqu’on eut fait sortir
  rationale: La construction narrative וַיְהִי suivie de כְּ et de l’infinitif introduit ici une proposition temporelle. Le pronom indéfini « on » conserve l’absence d’agent exprimé dans l’hébreu, tandis que le passé antérieur marque naturellement l’antériorité immédiate.
- source_word: אֶת הַמְּלָכִים הָאֵלֶּה אֶל יְהוֹשֻׁעַ
  choice: ces rois pour les amener à Josué
  rationale: « Ces rois » garde la valeur déictique de הָאֵלֶּה. La formulation explicite le mouvement vers Josué indiqué par אֶל sans suggérer que les rois seraient simplement sortis de Josué.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: La traduction conserve la référence masculine explicite de אִישׁ dans ce contexte militaire, tout en employant une tournure française naturelle.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: les chefs des hommes de guerre
  rationale: קְצִינֵי désigne ici des chefs ou commandants, et אַנְשֵׁי הַמִּלְחָמָה signifie littéralement « hommes de guerre ». La formulation préserve la structure et le registre militaires de l’hébreu.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: qui étaient allés avec lui
  rationale: La proposition attributive identifie les chefs ayant accompagné Josué. Le plus-que-parfait situe correctement cet accompagnement avant l’ordre rapporté.
- source_word: קִרְבוּ
  choice: Approchez-vous
  rationale: L’impératif exprime un déplacement physique vers les rois. « Approchez-vous » est direct, idiomatique et actuel en français.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: posez vos pieds sur le cou de
  rationale: La formulation conserve le geste concret de domination. En français, le singulier distributif « le cou de ces rois » est naturel, chaque homme posant son pied sur le cou d’un roi.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: Ils s’approchèrent donc et posèrent
  rationale: Les deux verbes narratifs expriment l’exécution immédiate de l’ordre. « Donc » rend avec naturel la conséquence sans alourdir la séquence.
- source_word: עַל צַוְּארֵיהֶם
  choice: sur leur cou
  rationale: Le suffixe renvoie aux rois. Le singulier distributif est idiomatique en français et ne change pas le fait que plusieurs rois sont concernés.
theological_decisions:
- issue: Langage masculin dans כָּל אִישׁ יִשְׂרָאֵל et אַנְשֵׁי הַמִּלְחָמָה
  choice: tous les hommes d’Israël / hommes de guerre
  alternative: tout Israël / tous les Israélites / combattants
  rationale: Le cadre est explicitement militaire et les expressions hébraïques sont masculines. Le français conserve cette précision contextuelle sans généraliser à toute la population.
- issue: Représentation du geste de conquête
  choice: posez vos pieds sur le cou de ces rois
  alternative: tenez ces rois sous votre domination
  rationale: Le texte décrit un acte physique à valeur symbolique. La traduction en maintient la dureté concrète sans l’atténuer ni lui substituer une interprétation abstraite.
translation_notes:
  register: Français international moderne, narratif et digne. Les termes militaires restent concrets sans archaïsme excessif. Le passé antérieur et le passé simple conviennent au registre du récit biblique écrit tout en demeurant clairs.
