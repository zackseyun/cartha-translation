id: JOS.10.10
reference: Joshua 10:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: fr
  text: Yahweh les jeta dans la confusion devant Israël[a], leur infligea une lourde défaite à Gabaon, les poursuivit par la montée de Beth-Horôn et les frappa jusqu’à Azéqa et jusqu’à Maqqéda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les mit en déroute » ou « les frappa de panique ». Le verbe hébreu évoque la confusion ou la panique provoquée au combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: les mit en déroute
  rationale: Le verbe המם exprime ici la panique et la confusion provoquées dans une armée, avec pour effet sa déroute. Cette formulation française naturelle conserve le contexte militaire; la note signale les nuances possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, plutôt que substitution par un titre.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: devant Israël
  rationale: Rend directement l’expression hébraïque et préserve sa possible nuance spatiale ou relationnelle.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: Il leur infligea une lourde défaite
  rationale: Dans ce récit militaire, נכה avec מכה désigne le fait de frapper sévèrement l’ennemi; «lourde défaite» exprime le résultat sans imposer que tous aient été tués.
- source_word: בְּגִבְעוֹן
  choice: à Gabaon
  rationale: Forme française traditionnelle et largement reconnue du toponyme biblique.
- source_word: וַיִּרְדְּפֵם
  choice: les poursuivit
  rationale: Équivalent direct et naturel du verbe רדף dans un contexte militaire.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: sur la route qui monte à Beth-Horôn
  rationale: Rend clairement le détail topographique de la route et de la montée, dans un français courant.
- source_word: וַיַּכֵּם עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: les frappa jusqu’à Azéqa et Maqqéda
  rationale: Conserve la répétition du verbe נכה tout en exprimant naturellement l’étendue géographique de l’action.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le Tétragramme; «Yahweh» préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Degré de mortalité impliqué par מַכָּה גְדוֹלָה
  choice: une lourde défaite
  alternative: un grand massacre
  rationale: Le contexte implique une action militaire meurtrière, mais le syntagme peut désigner un coup sévère ou une grande défaite; cette formulation évite de préciser au-delà de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Les formes Gabaon, Beth-Horôn, Azéqa et Maqqéda suivent des usages français reconnaissables, avec une formulation topographique naturelle.
