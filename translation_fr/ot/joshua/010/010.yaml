  source_fidelity: La note reconnaît justement que וַיְהֻמֵּם décrit une confusion ou une panique suscitée par Yahweh. Toutefois, « mit en déroute » présente dans le texte principal le résultat militaire comme le sens exclusif, alors que l'hébreu exprime d'abord l'action de jeter dans le trouble. « Jeta dans la confusion » conserve mieux cette nuance et s'accorde avec la piste d'audit anglaise. « Par la montée de Beth-Horôn » reflète plus directement le groupe topographique hébreu que « sur la route qui monte à Beth-Horôn ».
