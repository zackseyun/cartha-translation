  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: fr
  text: 'Yahweh dit à Josué : « N’aie pas peur d’eux, car je les ai livrés entre tes mains. Aucun d’eux ne tiendra devant toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Rend naturellement en français le wayyiqtol narratif de אמר qui introduit le discours direct.
- source_word: אַל תִּירָא מֵהֶם
  choice: N’aie pas peur d’eux
  rationale: Expression française courante qui restitue directement l’interdiction et le complément introduit en hébreu par מן.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison donnée par Yahweh pour ne pas avoir peur.
- source_word: בְיָדְךָ נְתַתִּים
  choice: je les ai livrés entre tes mains
  rationale: Le passé composé rend l’acte présenté comme accompli dans la parole divine; « livrés entre tes mains » conserve l’image hébraïque tout en explicitant la remise au pouvoir de Josué.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Aucun d’eux ne tiendra
  rationale: אִישׁ a ici une valeur distributive dans un groupe masculin; « aucun d’eux » est idiomatique et conserve l’idée que pas un seul ne résistera.
- source_word: בְּפָנֶיךָ
  choice: devant toi
  rationale: Préserve l’expression hébraïque, qui implique en contexte militaire l’incapacité à tenir tête à Josué.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin personnel; « Yahweh » le conserve par translittération sans le remplacer par un titre.
- issue: Rendu de אִישׁ dans לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Aucun d’eux
  alternative: Pas un homme parmi eux
  rationale: Dans cette construction négative, אִישׁ signifie distributivement « aucun, pas un seul ». Le contexte vise les combattants ennemis, mais le français naturel n’exige pas de répéter leur sexe grammatical.
- issue: Valeur de l’accompli נְתַתִּים
  choice: je les ai livrés
  alternative: je les livre
  rationale: Le parfait présente leur remise comme déjà accomplie du point de vue de la décision et de la promesse divines, sans qu’il soit nécessaire d’imposer une catégorie doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse singulière à Josué. La formulation conserve l’image « entre tes mains » et l’expression « devant toi », tout en évitant un calque peu naturel de la négation hébraïque.
