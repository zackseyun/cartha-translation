  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/מַּקֵּדָ֖ה לִבְנָ֑ה וַ/יִּלָּ֖חֶם עִם לִבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: fr
  text: Puis Josué, avec tout Israël, passa de Makkéda à Libna et combattit contre Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: quittèrent… pour
  rationale: Dans cet itinéraire militaire, עבר exprime le déplacement d’un lieu au suivant. La tournure française « quitter… pour » rend naturellement le point de départ et la destination sans suggérer à tort la traversée d’un cours d’eau.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: La préposition עִם avec le suffixe masculin singulier indique simplement que tout Israël accompagne Josué.
- source_word: מִמַּקֵּדָה
  choice: Makkéda
  rationale: La préposition מִן marque ici le point de départ, intégré à la tournure « quittèrent Makkéda »; le nom du lieu est translittéré selon l’usage français.
- source_word: לִבְנָה
  choice: pour Libna
  rationale: La préposition לְ indique la destination du déplacement; « pour Libna » s’accorde naturellement avec « quittèrent ».
- source_word: וַיִּלָּחֶם
  choice: combattirent
  rationale: Le nifal de לחם signifie couramment « combattre » ou « livrer bataille ». « Combattirent » convient au registre narratif et militaire.
- source_word: עִם לִבְנָה
  choice: contre Libna
  rationale: Après לחם, עִם désigne idiomatiquement l’adversaire. Le français exige « contre » plutôt que le sens littéral ordinaire « avec ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le sujet pluriel est repris devant « combattirent » pour éviter que le lecteur ne comprenne que Josué seul combattit, tout en conservant l’accompagnement de « tout Israël ». Aucun appel de note n’est nécessaire, puisque l’emploi adversatif de עִם se rend directement et sans ambiguïté par « contre ».
