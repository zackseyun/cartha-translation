  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: fr
  text: 'Josué dit : « Roulez de grosses pierres à l’entrée de la grotte et postez-y des hommes pour les garder.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « les garder », au pluriel, ce qui renvoie probablement aux rois enfermés dans la grotte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français moderne, la simple succession des phrases rend naturellement cet enchaînement sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: גֹּלּוּ
  choice: Roulez
  rationale: L’impératif pluriel de גלל désigne ici directement l’action de faire rouler des pierres.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: de grosses pierres
  rationale: L’adjectif exprime la grande taille; « grosses pierres » est naturel et concret en français actuel.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: à l’entrée de la grotte
  rationale: Littéralement « à la bouche de la grotte »; « entrée » restitue clairement l’idiome hébreu dans un français naturel.
- source_word: וְהַפְקִידוּ
  choice: et postez
  rationale: Le hifil de פקד exprime l’affectation de personnes à une tâche. « Postez » convient précisément à des hommes placés en faction.
- source_word: עָלֶיהָ
  choice: -y
  rationale: Le pronom adverbial renvoie naturellement à l’entrée ou à la grotte et indique le lieu où les hommes doivent être postés.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom hébreu désigne explicitement des hommes; la traduction conserve cette précision sans les appeler directement « gardes ».
- source_word: לְשָׁמְרָם
  choice: pour les garder
  rationale: Le suffixe objet est masculin pluriel et renvoie le plus naturellement aux cinq rois enfermés dans la grotte, plutôt qu’à la grotte singulière.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « À l’entrée de la grotte » privilégie l’idiome français plutôt que le calque « à la bouche de la grotte »; « postez-y » évite la tournure moins naturelle « établissez des hommes sur elle ».
