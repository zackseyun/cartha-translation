  yaml_path: translation/ot/joshua/010/009.yaml
  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: fr
  text: Josué arriva soudain auprès d’eux[a], après avoir passé toute la nuit à monter depuis Guilgal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arriva soudainement auprès d’eux » ; le verbe hébreu signifie littéralement « vint, arriva », et le contexte militaire évoque une arrivée soudaine face à l’ennemi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il monta de Guilgal toute la nuit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: arriva sur eux
  rationale: Le verbe בוא signifie fondamentalement « venir, arriver », et אֶל indique un mouvement vers eux. Dans ce contexte militaire, « arriva sur eux » exprime naturellement l’approche soudaine de l’ennemi sans introduire explicitement l’idée d’attaque.
- source_word: פִּתְאֹם
  choice: à l’improviste
  rationale: L’adverbe exprime une arrivée soudaine ou inattendue. « À l’improviste » rend bien l’effet tactique dans un français naturel.
- source_word: כָּל הַלַּיְלָה
  choice: pendant toute la nuit
  rationale: Cette expression marque la durée complète de la progression nocturne.
- source_word: עָלָה
  choice: être monté
  rationale: Le verbe עלה signifie littéralement « monter ». Le choix conserve la dimension topographique, sans expliciter davantage le mode de déplacement militaire.
- source_word: מִן הַגִּלְגָּל
  choice: de Guilgal
  rationale: Le syntagme indique le point de départ. « Guilgal » est la forme française usuelle du nom de lieu.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
