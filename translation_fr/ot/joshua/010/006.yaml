    issue: La note traduit littéralement l’expression par « Ne relâche pas ta main loin de tes serviteurs ».
    rationale: « Loin de » ajoute une nuance spatiale absente du texte. La construction signifie littéralement que Josué ne doit pas relâcher/retirer sa main à l’égard de ses serviteurs ; l’explication idiomatique peut ensuite être conservée.
  - severity: low
    issue: « Se sont ligués contre nous » est plus interprétatif que le verbe hébreu.
    rationale: נִקְבְּצוּ signifie « se sont rassemblés ». Dans ce contexte l’hostilité est explicite par « contre nous », sans qu’il soit nécessaire d’ajouter l’idée de ligue ou de complot.
