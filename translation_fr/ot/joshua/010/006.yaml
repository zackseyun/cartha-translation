  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: fr
  text: 'Alors les hommes de Gabaon envoyèrent un message à Josué, au camp de Guilgal : « Ne cesse pas de soutenir tes serviteurs[a]. Monte vite vers nous, sauve-nous et viens à notre secours, car tous les rois des Amorites qui habitent la région montagneuse se sont rassemblés contre nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ne relâche pas ta main à l’égard de tes serviteurs », expression qui signifie : « ne cesse pas de nous soutenir » ou « ne nous abandonne pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: les hommes de Gabaon envoyèrent un message
  rationale: La construction désigne littéralement les hommes de Gabaon, vraisemblablement ses représentants. « Envoyèrent un message » explicite naturellement en français l'envoi adressé à Josué.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: à Josué, au camp de Guilgal
  rationale: Le double אֶל indique le destinataire puis l'endroit où il se trouve. Cette formulation française conserve les deux éléments sans lourdeur.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: Ne cesse pas de soutenir tes serviteurs
  rationale: L'expression hébraïque évoque littéralement le relâchement ou le retrait de la main. En contexte, elle demande à Josué de ne pas leur retirer son appui; la formulation choisie rend clairement cet idiome tout en le signalant en note.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: Monte vite vers nous
  rationale: עלה marque ici la montée depuis Guilgal vers la région montagneuse. « Monte » conserve cette précision topographique et « vite » exprime l'urgence.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: sauve-nous et viens à notre secours
  rationale: « Sauve-nous » rend directement ישע dans une situation militaire; « viens à notre secours » traduit עזר de manière naturelle et évite une répétition stylistiquement faible.
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: car ... se sont ligués contre nous
  rationale: Le contexte hostile donne à אֶל le sens de mouvement dirigé contre Gabaon. « Se sont ligués » exprime ici le rassemblement concerté des rois sans ajouter une notion étrangère au contexte.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: tous les rois des Amorites qui habitent la région montagneuse
  rationale: Le singulier collectif « l'Amorite » est rendu idiomatiquement par le pluriel français. הָהָר désigne dans ce contexte la région montagneuse plutôt qu'une montagne particulière.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises bibliques usuelles « Gabaon » et « Guilgal ». Le tutoiement correspond au discours direct singulier adressé à Josué.
