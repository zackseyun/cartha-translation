  source_fidelity: 'Le sens général est fidèlement rendu : l’appel urgent des Gabaonites, la montée depuis Guilgal, le secours demandé et le rassemblement des rois amorites sont bien conservés. Toutefois, « se sont ligués » explicite une entente conspiratrice que נִקְבְּצוּ exprime plus sobrement comme un rassemblement ; « se sont rassemblés contre nous » est plus proche du texte.'
  naturalness: Le français est naturel, clair et d’un registre narratif approprié. « Ne cesse pas de soutenir tes serviteurs » rend idiomatiquement l’expression hébraïque sans alourdir le discours.
  terminology: Les formes « Gabaon », « Josué », « Guilgal » et « Amorites » sont conformes à l’usage biblique français. « Tes serviteurs » restitue correctement l’auto-désignation déférente. La note doit corriger « loin de », qui ne correspond pas littéralement à la préposition hébraïque.
  issues:
