  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: fr
  text: 'Alors Josué parla à Yahweh, le jour où Yahweh livra les Amorites aux Israélites[a]. Il dit sous les yeux d’Israël :

    « Soleil, arrête-toi[b] sur Gabaon,

    et toi, lune, dans la vallée d’Ayalôn[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « reste immobile », « tais-toi » ou « cesse ». Le verbe hébreu peut exprimer le silence, l’immobilité ou l’arrêt.'
    reason: lexical_alternative
  - marker: c
    text: 'En hébreu, le second membre est littéralement : « et lune, dans la vallée d’Ayalôn » ; le verbe « arrête-toi » du premier membre est sous-entendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: parla
  rationale: Le piel de דבר signifie couramment « parler ». « Parla » maintient la distinction avec וַיֹּאמֶר, rendu ensuite par « Il dit ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque le destinataire de la parole de Josué, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: le jour où Yahweh livra
  rationale: La construction infinitive avec בְּיוֹם a une valeur temporelle. « Le jour où » est naturel en français et garde ce repère explicite.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier morphologique a ici un sens collectif et désigne le peuple amorite engagé dans la bataille.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Dans ce contexte militaire, נתן ... לפני exprime la livraison de l’ennemi au pouvoir d’Israël. La note conserve la forme hébraïque plus littérale « devant les fils d’Israël ».
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: Il dit sous les yeux d’Israël
  rationale: לְעֵינֵי indique que la déclaration fut faite publiquement, à la vue d’Israël. La formulation française conserve l’image des « yeux ».
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: Soleil, arrête-toi
  rationale: דום peut exprimer l’immobilité, l’arrêt ou le silence. Dans cette adresse cosmique, « arrête-toi » rend clairement l’idée sans préciser un mécanisme astronomique.
- source_word: בְּגִבְעוֹן
  choice: sur Gabaon
  rationale: La préposition ב est spatialement souple. « Sur Gabaon » convient à la position apparente du soleil tout en restant proche de l’expression poétique.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: et toi, lune, dans la vallée d’Ayalôn
  rationale: Le second membre n’a pas de verbe exprimé ; l’impératif précédent y est sous-entendu. « Et toi » rend naturelle l’apostrophe parallèle sans répéter silencieusement le verbe dans le texte principal.
- source_word: אַיָּלוֹן
  choice: Ayalôn
  rationale: « Ayalôn » est une translittération française transparente du nom hébreu, avec accent graphique pour guider la prononciation.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Nature de l’ordre adressé au soleil et à la lune
  choice: Conserver une injonction poétique sans explicitation cosmologique
  alternative: Paraphraser en décrivant l’arrêt de la rotation terrestre ou le prolongement de la lumière
  rationale: Le verset formule ce que Josué dit aux astres mais n’explique pas ici le mécanisme du phénomène. La traduction ne doit pas résoudre une question que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. Le parallélisme poétique est mis en lignes. « Israélites » privilégie la clarté courante, tandis que la note signale l’expression hébraïque littérale. Les variantes de דום et l’ellipse verbale du second membre sont explicitement préservées en notes.
