  text: וַ/יִּשְׁלַ֨ח אֲדֹנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל הוֹהָ֣ם מֶֽלֶךְ חֶ֠בְרוֹן וְ/אֶל פִּרְאָ֨ם מֶֽלֶךְ יַרְמ֜וּת וְ/אֶל יָפִ֧יעַ מֶֽלֶךְ לָכִ֛ישׁ וְ/אֶל דְּבִ֥יר מֶֽלֶךְ עֶגְל֖וֹן לֵ/אמֹֽר־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: fr
  text: 'Alors Adoni-Tsédeq, roi de Jérusalem, envoya dire à Hoham, roi d’Hébron, à Piram, roi de Yarmouth, à Yafia, roi de Lakish et à Debir, roi d’Églon :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors … envoya un message
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement le lien narratif avec le verset précédent, tandis que « envoya un message » explicite en français idiomatique que l’envoi vise les destinataires nommés et introduit des paroles.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Tsédeq
  rationale: Nom propre translittéré plutôt que traduit. Le trait d’union conserve visiblement sa structure composée, et « Tsédeq » suit une forme française intelligible de la consonne initiale צ.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: roi de Jérusalem
  rationale: Le groupe construit est rendu directement, avec la forme française traditionnelle du nom de lieu.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne les destinataires du message ; « à » est son équivalent français naturel dans cette construction.
- source_word: הוֹהָם
  choice: Hoham
  rationale: Translittération naturelle du nom propre en français.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française traditionnelle du nom de lieu.
- source_word: פִּרְאָם
  choice: Piram
  rationale: Translittération naturelle du nom propre.
- source_word: יַרְמוּת
  choice: Yarmouth
  rationale: Forme française biblique usuelle du nom de lieu, distincte de la graphie anglaise « Jarmuth ».
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Translittération française transparente du nom propre hébreu, avec yod rendu par « Y ».
- source_word: לָכִישׁ
  choice: Lakish
  rationale: Translittération française transparente du nom de lieu, où « sh » représente la consonne שׁ.
- source_word: דְּבִיר
  choice: Debir
  rationale: Nom propre translittéré ; le contexte désigne ici un roi portant ce nom et non le nom commun attesté ailleurs.
- source_word: עֶגְלוֹן
  choice: Églon
  rationale: Forme française traditionnelle du nom de lieu.
- source_word: לֵאמֹר
  choice: 'Il leur dit :'
  rationale: L’infinitif introducteur de discours est rendu par une proposition française naturelle. Le pronom « leur » reprend sans ambiguïté les quatre destinataires.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les titres royaux sont répétés pour conserver la structure et l’identification précise de chaque personnage. La longue phrase hébraïque est divisée avant l’introduction du discours afin d’améliorer la lisibilité sans modifier son contenu.
