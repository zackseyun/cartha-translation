translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit, tandis que l’imparfait décrit le coucher du soleil en cours. La coordination hébraïque répétée est légèrement structurée en phrases et avec « puis » pour assurer une lecture naturelle sans modifier la séquence.
