revisions:
- from: Au moment où le soleil se couchait[a], Josué donna l’ordre de les descendre des arbres. On les jeta dans la grotte où ils s’étaient cachés[b], puis on plaça de grosses pierres devant l’entrée de la grotte, où elles sont restées jusqu’à ce jour.
  to: Au moment où le soleil se couchait[a], Josué donna l’ordre, et ils les descendirent des arbres, les jetèrent dans la grotte où ils s’étaient cachés[b], et placèrent de grosses pierres à l’entrée de la grotte; elles y sont restées jusqu’à ce jour.
  rationale: La révision corrige l’antécédent ambigu de la proposition finale en faisant explicitement des pierres son sujet (« elles y sont restées »). Elle maintient la valeur résultative et durable de « jusqu’à ce jour », sans prétendre que l’action de placer les pierres s’est prolongée. Les actions sont également attribuées au sujet pluriel implicite du texte hébreu. La note b conserve l’information sur l’adverbe hébreu « là », tandis que le texte français garde une tournure naturelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:09:14Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la séquence générale, les référents et l’expression temporelle finale. Toutefois, « où elles sont restées jusqu’à ce jour » est syntaxiquement rattaché à « la grotte » plutôt qu’aux pierres; il inverse donc le référent et affirme que la grotte est restée. Le sujet pluriel des actions peut aussi être rendu plus nettement sans recourir au pronom indéfini « on ».
  naturalness: Le français est globalement moderne et narratif. La révision emploie des verbes au passé simple avec un sujet pluriel explicite, et rattache sans ambiguïté la permanence des pierres à celles-ci.
  terminology: « Josué », « grotte », « grosses pierres » et « entrée de la grotte » conviennent. « À l’entrée » rend naturellement l’hébreu « sur la bouche de la grotte » sans introduire de détail supplémentaire. La note b signale adéquatement l’adverbe hébreu explicite, que le français n’a pas besoin de reproduire de façon lourde dans le corps du texte.
  issues:
  - severity: medium
    issue: Le relatif « où elles sont restées » se rapporte grammaticalement à « la grotte ».
    rationale: Le féminin pluriel de « elles » ne peut désigner que les pierres, mais la construction « la grotte, où » fait de la grotte l’antécédent de « où ». Cela produit une incohérence syntaxique et ne rend pas clairement l’état continu des pierres, visé par la formule finale hébraïque.
  - severity: low
    issue: L’alternance entre « Josué donna l’ordre » et des sujets indéfinis (« On les jeta », « on plaça ») affaiblit légèrement la continuité du sujet pluriel du texte source.
    rationale: Le sujet est non nommé en hébreu mais clairement pluriel. « Ils » conserve cette donnée et donne au récit français une cohésion plus directe.
