base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: fr
  text: Au moment où le soleil se couchait[a], Josué donna l’ordre, et ils les descendirent des arbres, les jetèrent dans la grotte où ils s’étaient cachés[b], et placèrent de grosses pierres à l’entrée de la grotte; elles y sont restées jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus brièvement : « au coucher du soleil ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « où ils s’étaient cachés là »; le mot « là » souligne explicitement le lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: Au moment où le soleil se couchait
  rationale: Cette tournure conserve l’image hébraïque de l’entrée du soleil tout en l’exprimant dans un français actuel et naturel; « au coucher du soleil » serait plus condensé.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: Josué donna l’ordre
  rationale: Le verbe signifie « ordonner ». Cette formulation introduit naturellement les actions accomplies ensuite par d’autres personnes.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: de les descendre des arbres
  rationale: Le causatif exprime le fait d’enlever les corps de l’endroit où ils avaient été pendus; « descendre des arbres » est direct et idiomatique.
- source_word: וַיַּשְׁלִכֻם
  choice: On les jeta
  rationale: Le verbe signifie couramment « jeter ». Le pronom indéfini « on » rend naturellement le sujet pluriel non précisé en français.
- source_word: הַמְּעָרָה
  choice: la grotte
  rationale: « Grotte » est l’équivalent français courant de מְעָרָה dans ce contexte narratif.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: où ils s’étaient cachés
  rationale: Le plus-que-parfait situe correctement leur cachette avant les événements racontés. En français, « où » contient déjà la valeur locative de שָׁם; reproduire « là » dans le texte donnerait une redondance peu naturelle, signalée toutefois en note.
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת
  choice: on plaça de grosses pierres
  rationale: Cette expression rend simplement l’action de mettre en place des pierres de grande taille.
- source_word: עַל פִּי הַמְּעָרָה
  choice: devant l’entrée de la grotte
  rationale: פִּי, littéralement « bouche », désigne ici l’ouverture. « Devant l’entrée » exprime naturellement la position et la fonction de blocage des pierres.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: où elles sont restées jusqu’à ce jour
  rationale: L’idiome indique que l’état résultant subsistait à l’époque du narrateur. L’explicitation des pierres comme sujet évite de faire croire que leur mise en place s’est prolongée jusqu’à ce jour.
