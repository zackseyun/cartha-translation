source:
  edition: WLC
  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: fr
  text: 'Non, c’est parce que nous étions inquiets que nous avons fait cela. Nous nous sommes dit : « Un jour, vos fils pourraient dire à nos fils : “Qu’avez-vous à voir avec le Seigneur, le Dieu d’Israël ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם־לֹא
  choice: Non, c’est parce que
  rationale: Dans ce serment elliptique, la tournure introduit avec force la véritable motivation, en opposition à l’accusation précédente. Cette formulation française en restitue naturellement la valeur sans ajouter de note inutile.
- source_word: מִדְּאָגָה מִדָּבָר
  choice: parce que nous étions inquiets
  rationale: דְּאָגָה exprime l’inquiétude ou l’appréhension; מִדָּבָר renforce ici l’idée de motif ou de situation préoccupante. Une formulation idiomatique évite le calque obscur « par inquiétude à cause d’une chose ».
- source_word: מָחָר
  choice: Un jour
  rationale: Littéralement « demain », mais le mot désigne ici un avenir indéterminé, comme le montre la préoccupation intergénérationnelle.
- source_word: מַה־לָּכֶם וְלַיהוָה
  choice: Qu’avez-vous à voir avec le Seigneur
  rationale: L’expression idiomatique demande quelle relation ou quel droit les interlocuteurs ont à l’égard du Seigneur. « Qu’avez-vous à voir avec » conserve son caractère abrupt et accusateur.
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Rend le tétragramme selon la convention française biblique largement reconnue, avec la majuscule signalant le nom divin.
theological_decisions:
- issue: Nature de la crainte à l’origine de l’autel
  choice: une inquiétude concernant une rupture future entre les descendants
  alternative: une simple prudence générale
  rationale: Le contexte immédiat et la proposition citée montrent que la préoccupation porte précisément sur une future exclusion religieuse; la traduction conserve cette motivation sans lui attribuer une portée doctrinale supplémentaire.
- issue: Relation contestée avec le Dieu d’Israël
  choice: 'formulation relationnelle ouverte : « Qu’avez-vous à voir avec »'
  alternative: « Quel droit avez-vous sur le Seigneur »
  rationale: L’hébreu peut viser la relation, l’appartenance ou l’intérêt commun. La formulation choisie préserve cette amplitude plutôt que de réduire la question au seul droit juridique ou cultuel.
translation_notes:
  register: Français moderne, naturel et digne. Le discours direct imbriqué est conservé. « Vos fils » et « nos fils » maintiennent la forme concrète de l’hébreu, où les descendants représentent les générations futures.
