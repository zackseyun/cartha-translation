    issue: Ajout de « donc plus »
    rationale: « Donc » et « plus » introduisent respectivement une inférence et l’idée qu’ils avaient auparavant continué à en parler. Ces nuances ne sont pas exprimées par וְלֹא אָמְרוּ.
  - severity: low
    issue: « Cette explication » pour הַדָּבָר
    rationale: Le mot hébreu désigne une affaire, une chose ou ce qui vient d’être dit ; « explication » est possible contextuellement, mais plus étroit que le terme source.
  - severity: low
    issue: Absence de note sur « ne dirent pas de monter »
    rationale: Le texte français idiomatique « ne parlèrent pas de monter » est approprié, mais une note permet de conserver l’accès au tour verbal plus littéral du source.
