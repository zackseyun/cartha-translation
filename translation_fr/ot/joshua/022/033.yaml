revisions:
- from: Cette explication parut bonne aux Israélites[a], qui bénirent Dieu[b]. Ils ne parlèrent donc plus de monter en guerre contre eux pour détruire le pays où habitaient les descendants de Ruben et de Gad.
  to: Cette affaire parut bonne aux Israélites[a], et les Israélites bénirent Dieu[b]. Ils ne parlèrent pas de monter contre eux pour la guerre[c], afin de détruire le pays où habitaient les descendants de Ruben et de Gad.
  rationale: La révision élimine les ajouts aspectuels et logiques de « donc plus », emploie « affaire » pour ne pas restreindre הַדָּבָר à une explication, et ajoute une note pour le tour littéral « ne dirent pas de monter ». Le sens territorial, militaire et tribal du verset est conservé.
