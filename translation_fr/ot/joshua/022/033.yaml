source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: fr
  text: Cette affaire parut bonne aux Israélites[a], et les Israélites bénirent Dieu[b]. Ils ne parlèrent pas de monter contre eux pour la guerre[c], afin de détruire le pays où habitaient les descendants de Ruben et de Gad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « louèrent Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ne dirent pas de monter contre eux pour la guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: Cette explication parut bonne
  rationale: L’expression désigne ici favorablement les paroles explicatives qui précèdent. « Parut bonne » transpose naturellement l’idiome hébreu בְּעֵינֵי sans en changer le jugement positif.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce contexte collectif, l’ethnonyme français est plus naturel que le calque « les fils d’Israël » et désigne l’ensemble du peuple concerné.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: bénirent Dieu
  rationale: Le rendu conserve le sens lexical direct de ברך avec Dieu pour objet; dans ce contexte, il implique qu’ils lui adressèrent louange et reconnaissance.
- source_word: וְלֹא אָמְרוּ
  choice: Ils ne parlèrent donc plus
  rationale: Littéralement, l’hébreu dit « ils ne dirent pas ». Le contexte indique qu’ils abandonnèrent le projet militaire dont ils avaient parlé; « ne parlèrent donc plus » l’exprime naturellement sans affirmer qu’une expédition avait déjà commencé.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: de monter en guerre contre eux
  rationale: Cette formulation conserve l’image militaire de « monter contre » et rend לַצָּבָא par une expression française compréhensible.
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: pour détruire le pays
  rationale: « Détruire » reflète la force de שׁחת, tandis que « le pays » désigne naturellement le territoire habité, sans évoquer la terre entière.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: les descendants de Ruben et de Gad
  rationale: Ici, בנים renvoie aux groupes tribaux issus de Ruben et de Gad. « Descendants » est exact et plus naturel en français moderne que « fils ».
- source_word: יֹשְׁבִים בָּהּ
  choice: où habitaient
  rationale: Le participe exprime leur résidence continue dans ce territoire; l’imparfait français convient au cadre narratif.
theological_decisions:
- issue: Sens de « bénir Dieu »
  choice: Conserver « bénirent Dieu » dans le texte
  alternative: « louèrent Dieu »
  rationale: Le français biblique et courant permet de dire que des humains bénissent Dieu, et ce choix maintient la réciprocité lexicale de ברך sans réduire explicitement l’action à la seule louange.
translation_notes:
  register: Français moderne, narratif et digne. Le calque « bon aux yeux de » est évité au profit de « parut bonne », plus idiomatique. « Monter en guerre contre » conserve toutefois l’image militaire hébraïque. Les répétitions lourdes de « fils d’Israël » sont rendues par l’ethnonyme naturel, tandis que les groupes tribaux sont appelés « descendants ».
