  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: fr
  text: Loin de nous l’idée de nous révolter contre Yahweh et de cesser aujourd’hui de suivre Yahweh[a] en construisant un autel pour y offrir des holocaustes, des offrandes de céréales ou des sacrifices, en dehors de l’autel de Yahweh notre Dieu qui se trouve devant son tabernacle !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de nous détourner aujourd’hui de Yahweh ». Littéralement, l’hébreu parle de revenir « de derrière Yahweh », c’est-à-dire de cesser de le suivre.'
    reason: La note rend correctement l’image de l’expression hébraïque et explicite son sens, sans recourir à un littéralisme français trompeur.
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: Loin de nous l’idée
  rationale: Cette formule française exprime naturellement et avec force le rejet indigné porté par l’idiome hébreu.
- source_word: לִמְרֹד בַּיהוָה
  choice: de nous révolter contre Yahweh
  rationale: Avec מרד, la préposition marque ici l’adversaire de la révolte; «se révolter contre» restitue clairement cette opposition.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: et de cesser aujourd’hui de suivre Yahweh
  rationale: L’expression hébraïque décrit littéralement le fait de revenir de derrière quelqu’un, donc d’abandonner sa suite. La formulation française conserve l’idée d’une rupture d’allégeance.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: en construisant un autel
  rationale: L’infinitif précise le moyen par lequel cette révolte et cet abandon se manifesteraient.
- source_word: לְעֹלָה
  choice: pour y offrir des holocaustes
  rationale: «Holocauste» est le terme sacrificiel français consacré pour עֹלָה; l’ajout de «y offrir» rend explicite et naturel le rapport entre l’autel et les sacrifices.
- source_word: לְמִנְחָה
  choice: des offrandes de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne l’offrande végétale plutôt qu’une offrande indéterminée.
- source_word: וּלְזָבַח
  choice: ou des sacrifices
  rationale: זֶבַח reste ici un terme sacrificiel général; «sacrifices» évite d’imposer une catégorie plus précise.
- source_word: מִלְּבַד
  choice: en dehors de
  rationale: Cette expression marque que tout autel sacrificiel autre que l’autel autorisé serait exclu, sans suggérer nécessairement une simple addition spatiale.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: l’autel de Yahweh notre Dieu
  rationale: La formulation reproduit directement la chaîne construite et maintient la confession d’appartenance «notre Dieu».
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: qui se trouve devant sa demeure
  rationale: «Demeure» rend le sens fondamental de מִשְׁכָּן et le possessif traduit explicitement le suffixe masculin singulier.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le Tétragramme, nom personnel d’alliance; «Yahweh» le représente directement plutôt que de le remplacer par un titre.
- issue: Nature de l’autel dénoncé
  choice: un autel destiné à des sacrifices, distinct de l’autel autorisé
  alternative: tout monument commémoratif en forme d’autel
  rationale: La négation porte précisément sur la construction d’un autel destiné aux holocaustes, offrandes et sacrifices; le texte ne condamne donc pas ici sans distinction toute structure appelée autel.
translation_notes:
  register: Français international moderne, solennel sans archaïsmes. La répétition de «Yahweh» est maintenue comme dans l’hébreu. Les pluriels génériques rendent naturellement en français les trois catégories sacrificielles.
