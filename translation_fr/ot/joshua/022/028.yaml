  to: 'Nous avons donc dit : « S’il arrive qu’un jour on nous dise, à nous ou aux générations qui nous suivront, nous répondrons : “Regardez la reproduction[a] de l’autel de Yahvé que nos pères ont faite : elle n’est destinée ni aux holocaustes ni aux sacrifices, mais elle est un témoin entre nous et vous.” »'
