source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: fr
  text: 'Nous avons donc dit : « S’il arrive qu’un jour on nous dise, à nous ou aux générations qui nous suivront, nous répondrons : “Regardez la reproduction[a] de l’autel de Yahvé que nos pères ont faite : elle n’est destinée ni aux holocaustes ni aux sacrifices, mais elle est un témoin entre nous et vous.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « modèle », « forme » ou « représentation ». Le terme hébreu désigne une forme ou une représentation; dans ce contexte, cette construction sert de témoin et n’est pas destinée à recevoir des sacrifices.
    reason: Alternative lexicale et clarification contextuelle de תַּבְנִית, sans présenter comme explicite dans le terme lui-même le statut cultuel de la construction.
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Nous avons donc dit
  rationale: Le waw consécutif fait avancer le récit, tandis que « donc » rend naturellement la valeur explicative du propos dans son contexte.
- source_word: וְהָיָה כִּי יֹאמְרוּ
  choice: S’ils viennent un jour nous parler
  rationale: L’expression introduit une éventualité future. Cette formulation française est naturelle sans transformer l’hypothèse en certitude.
- source_word: וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: ou aux générations qui nous suivront
  rationale: מָחָר désigne ici l’avenir plutôt que le lendemain littéral. « Les générations qui nous suivront » exprime clairement la postérité tout en conservant l’idée de générations.
- source_word: וְאָמַרְנוּ
  choice: nous répondrons
  rationale: Dans cette situation hypothétique, le verbe introduit la réponse qui sera donnée; « répondrons » explicite naturellement cette fonction en français.
- source_word: תַּבְנִית
  choice: reproduction
  rationale: Le terme désigne une forme, un modèle ou une représentation. Ici, l’autel construit reproduit l’autel de Yahvé sans être destiné au culte sacrificiel.
- source_word: מִזְבַּח יְהוָה
  choice: l’autel de Yahvé
  rationale: Le nom divin est conservé comme nom propre, et la relation construite est rendue directement.
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: que nos pères ont faite
  rationale: « Nos pères » conserve le terme masculin du texte hébreu. Le participe passé s’accorde avec « reproduction », qui est l’objet représentatif construit.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: elle n’est destinée ni aux holocaustes ni aux sacrifices
  rationale: La tournure « ni… ni… » reproduit la double négation hébraïque. « Holocaustes » rend l’offrande entièrement brûlée, tandis que « sacrifices » garde le second terme plus général.
- source_word: כִּי עֵד הוּא
  choice: mais elle est un témoin
  rationale: La proposition nominale et son pronom sont maintenus. « Mais » fait ressortir le contraste entre l’usage sacrificiel nié et la véritable fonction de l’autel.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: entre nous et vous
  rationale: Traduction directe et idiomatique; le français « vous » convient naturellement au pluriel hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » conserve le nom personnel divin plutôt que de lui substituer un titre.
- issue: Valeur cultuelle de l’autel reproduit
  choice: Un témoin qui n’est destiné ni aux holocaustes ni aux sacrifices
  alternative: Un second autel sacrificiel
  rationale: Le verset nie expressément tout usage sacrificiel et affirme la fonction testimoniale de la construction; la traduction maintient cette opposition sans ajouter d’explication doctrinale.
- issue: Terme de parenté אֲבוֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le masculin du texte source est conservé, sans neutralisation, tout en restant idiomatique dans ce contexte historique.
translation_notes:
  register: Français international actuel, digne et accessible. Les citations emboîtées sont conservées. La formulation privilégie une syntaxe naturelle tout en maintenant la contingence future, la double négation et l’affirmation explicite que l’autel est un témoin.
