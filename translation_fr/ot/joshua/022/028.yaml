  naturalness: Le français est globalement naturel et d’un registre approprié. « S’il arrive qu’un jour on nous dise » est à la fois plus idiomatique et plus proche de l’original que « S’ils viennent un jour nous parler ».
  terminology: « Yahvé », « holocaustes », « sacrifices », « nos pères » et « témoin » conviennent. « Reproduction » est un choix défendable pour תַּבְנִית, à maintenir avec une note qui signale les alternatives sans affirmer plus que le verset ne le fait.
