id: JOS.22.14
reference: Joshua 22:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: fr
  text: Il avait avec lui dix responsables, un responsable pour chaque maison ancestrale de toutes les tribus d’Israël. Chacun était chef de sa maison ancestrale parmi les milliers[a] d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les milliers d’Israël » ; ici, le mot traduit par « milliers » peut désigner des subdivisions tribales, telles que des clans ou de grands groupes familiaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: responsables / responsable
  rationale: Le terme désigne ici des hommes investis d’une autorité officielle. « Responsables » est naturel en français moderne et évite la connotation monarchique de « princes ».
- source_word: עִמּוֹ
  choice: avec lui
  rationale: La locution renvoie à Pinhas, mentionné au verset précédent.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: un responsable pour chaque
  rationale: 'La répétition hébraïque a une valeur distributive : un représentant par maison ancestrale.'
- source_word: לְבֵית אָב
  choice: pour chaque maison ancestrale
  rationale: « Maison ancestrale » rend le groupe de parenté et l’unité administrative exprimés par בֵּית אָב, sans le littéralisme peu naturel de « maison du père ».
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: de toutes les tribus d’Israël
  rationale: La formulation indique l’appartenance et la représentation des tribus; elle est idiomatique en français.
- source_word: וְאִישׁ
  choice: chacun
  rationale: אִישׁ est ici distributif et reprend chacun des dix représentants.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: chef de sa maison ancestrale
  rationale: « Chef » exprime clairement la fonction d’autorité de רֹאשׁ dans cette structure familiale.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: parmi les milliers d’Israël
  rationale: Cette traduction conserve l’image et l’ambiguïté du mot אֶלֶף, qui peut désigner soit un millier, soit une subdivision sociale ou militaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure distributive est rendue idiomatiquement, tandis que l’expression « milliers d’Israël » est conservée dans le texte afin de ne pas effacer l’ambiguïté lexicale de l’hébreu.
