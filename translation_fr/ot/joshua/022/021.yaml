  text: וַֽ/יַּעֲנוּ֙ בְּנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֔ד וַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה וַֽ/יְדַבְּר֔וּ אֶת רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: fr
  text: 'Alors les descendants de Ruben, les descendants de Gad et la demi-tribu de Manassé répondirent et s’adressèrent aux chefs des clans d’Israël[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux chefs des milliers d’Israël ». Le mot « milliers » peut désigner des subdivisions sociales, tribales ou militaires ; « clans » en exprime ici le sens probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: répondirent
  rationale: Dans ce récit dialogué, le qal de ענה introduit leur réponse aux accusations précédentes.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: les descendants de Ruben, les descendants de Gad
  rationale: « Descendants » conserve la formulation généalogique de l’hébreu tout en étant plus naturel en français moderne que « fils » lorsqu’il s’agit de groupes tribaux.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: la demi-tribu de Manassé
  rationale: Formulation française usuelle et proche de la construction hébraïque.
- source_word: וַיְדַבְּרוּ אֶת
  choice: répondirent aux
  rationale: Le second verbe, littéralement « parlèrent », est intégré à la construction française de réponse avec destinataire. Reproduire « répondirent et parlèrent » serait lourd et peu idiomatique sans apporter ici de nuance distincte.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: aux chefs des groupes d’Israël
  rationale: רָאשֵׁי désigne les chefs. אַלְפֵי signifie littéralement « milliers », mais peut désigner des unités sociales, tribales ou militaires; « groupes » préserve cette relative indétermination mieux que « clans ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le deux-points prépare la déclaration solennelle du verset suivant. La répétition « les descendants de » reflète la structure hébraïque sans employer le littéral potentiellement trompeur « les fils de ».
