  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: fr
  text: 'Nous avons donc dit[a] : « Construisons donc pour nous l’autel[b], non pour l’holocauste ni pour le sacrifice. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Alors nous avons dit » ou « Et nous avons dit ». La conjonction hébraïque permet plusieurs nuances selon la manière dont on relie cette phrase au verset précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Faisons donc pour nous, pour construire l’autel » ; il s’agit d’une tournure hébraïque signifiant : « Construisons donc pour nous l’autel. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Alors nous nous sommes dit
  rationale: Le wayyiqtol à la première personne du pluriel poursuit le récit et introduit la résolution collective. « Alors » rend naturellement l’enchaînement sans imposer un rapport causal trop précis; la tournure pronominale convient en français à une délibération interne du groupe.
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: Construisons-nous donc
  rationale: Le cohortatif exprime une proposition ou une résolution. La combinaison littérale « faisons pour nous, afin de construire » est idiomatique en hébreu; la tournure française « construisons-nous » en restitue à la fois l’action et la valeur bénéficiaire. « Donc » rend ici la particule נָא comme une nuance d’encouragement délibératif, plutôt que comme une demande polie.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: l’autel
  rationale: L’article défini désigne l’autel précis dont il est question. Le français conserve cette détermination sans ajouter de démonstratif absent de l’hébreu.
- source_word: לֹא לְעוֹלָה
  choice: non pour des holocaustes
  rationale: La préposition indique l’usage auquel l’autel n’est pas destiné. « Holocauste » est le terme français établi pour עֹלָה, offrande entièrement consumée; le pluriel générique est naturel en français.
- source_word: וְלֹא לְזָבַח
  choice: ni pour des sacrifices
  rationale: זֶבַח désigne ici une catégorie sacrificielle distincte de l’holocauste sans en préciser davantage le type. « Sacrifices » conserve cette généralité, et « ni » rend naturellement la seconde négation coordonnée.
theological_decisions:
- issue: Finalité de l’autel
  choice: Présenter l’holocauste et le sacrifice comme des usages explicitement niés
  alternative: Interpréter l’autel comme étant déjà qualifié de mémorial ou de témoin
  rationale: Le verset nie seulement deux fonctions cultuelles. Il ne faut pas anticiper ici l’explication positive donnée dans le contexte suivant.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde la délibération collective, la détermination de « l’autel » et le parallélisme des deux usages niés, tout en reformulant l’idiome hébreu dans un français naturel.
