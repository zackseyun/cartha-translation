  - severity: medium
    issue: Ambiguïté stylistique de « Construisons-nous donc l’autel »
    rationale: En français, l’enclise « nous » après l’impératif peut être comprise de diverses manières et rend moins clairement le datif de bénéfice. « Construisons donc pour nous l’autel » est plus transparent tout en conservant « pour nous ».
