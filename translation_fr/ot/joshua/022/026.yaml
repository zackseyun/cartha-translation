  source_fidelity: 'Le sens fondamental est bien rendu : le groupe décide de bâtir l’autel, en excluant son emploi pour l’holocauste ou le sacrifice. Toutefois, « Alors » resserre la liaison temporelle plus que nécessaire; le waw narratif peut aussi s’entendre comme « Et » ou « Donc ».'
  naturalness: 'La formulation est globalement naturelle. Cependant, « Construisons-nous donc l’autel » est ambigu en français moderne : le pronom peut se lire comme complément indirect (« construisons l’autel pour nous ») mais la tournure est moins fluide que « Construisons donc pour nous l’autel ».'
  terminology: « Autel », « holocaustes » et « sacrifices » conviennent. Le singulier générique (« pour l’holocauste ni pour le sacrifice ») suit de plus près l’hébreu et maintient le parallélisme des deux catégories, sans changement de sens.
