id: JOS.22.31
reference: Joshua 22:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: fr
  text: 'Phinéas, fils d’Éléazar le prêtre, dit aux descendants de Ruben, de Gad et de Manassé : « Aujourd’hui, nous savons que Yahvé est au milieu de nous, puisque vous n’avez pas commis cette infidélité envers Yahvé[a]. Ainsi, vous avez délivré les Israélites de la main de Yahvé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu associe ici un verbe et un nom de même racine : littéralement, « vous n’avez pas été infidèles envers Yahvé de cette infidélité ». Il s’agit d’une rupture de loyauté ou d’un acte de trahison.'
    reason: lexical_alternative
  - marker: b
    text: « De la main de Yahvé » signifie ici que les Israélites ont été préservés de l’intervention puissante ou du jugement de Yahvé.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple rend naturellement la progression narrative du waw consécutif en français soutenu, sans ajouter une nuance temporelle absente du contexte.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Phinéas, fils d’Éléazar le prêtre
  rationale: Cette formulation conserve l’identification hébraïque et rattache naturellement « le prêtre » à Éléazar.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: aux descendants de Ruben, de Gad et de Manassé
  rationale: Dans ce contexte tribal, בְּנֵי désigne les descendants ou membres des tribus. « Descendants » est plus naturel en français que la répétition littérale « fils de ».
- source_word: הַיּוֹם יָדַעְנוּ
  choice: Aujourd’hui, nous savons
  rationale: Le parfait exprime ici une certitude désormais acquise; le présent français en restitue clairement la force.
- source_word: בְּתוֹכֵנוּ
  choice: au milieu de nous
  rationale: Expression française naturelle qui conserve l’image spatiale et communautaire de la présence divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, conformément à la valeur du tétragramme dans le texte source.
- source_word: אֲשֶׁר
  choice: puisque
  rationale: La proposition donne le motif permettant de reconnaître la présence de Yahvé; « puisque » exprime cette relation de manière naturelle sans la surdéterminer.
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: vous n’avez pas commis cette infidélité envers Yahvé
  rationale: Le verbe et le nom apparentés décrivent une rupture de loyauté envers Dieu. La formulation française évite une répétition artificielle tout en conservant la gravité relationnelle et cultuelle du terme.
- source_word: אָז
  choice: Ainsi
  rationale: Dans ce contexte, le terme introduit le résultat ou la conséquence de l’innocence reconnue, plutôt qu’une simple succession chronologique.
- source_word: הִצַּלְתֶּם אֶת בְּנֵי יִשְׂרָאֵל
  choice: vous avez délivré les Israélites
  rationale: Le hiphil de נצל signifie délivrer ou arracher au danger. « Les Israélites » rend idiomatiquement « les fils d’Israël ».
- source_word: מִיַּד יְהוָה
  choice: de la main de Yahvé
  rationale: La traduction conserve l’image hébraïque de la main comme puissance agissante, tout en l’éclairant dans une note.
theological_decisions:
- issue: Présence divine au sein du peuple
  choice: Yahvé est au milieu de nous
  alternative: Yahvé est parmi nous
  rationale: « Au milieu de nous » conserve l’image du texte et affirme la présence de Yahvé auprès de la communauté sans lui imposer une construction théologique ultérieure.
- issue: Portée du vocabulaire de מעל
  choice: commis cette infidélité envers Yahvé
  alternative: trahi Yahvé par cette trahison
  rationale: Le choix retenu exprime une déloyauté d’alliance plutôt qu’une simple faute technique, tout en restant naturel en français.
- issue: Délivrance de la main de Yahvé
  choice: idiome conservé littéralement
  alternative: préservé les Israélites du jugement de Yahvé
  rationale: L’expression implique une menace venant de la puissance ou du jugement divin, mais le texte ne nomme pas explicitement le jugement. La traduction maintient donc l’image et la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit sans être archaïque. Les noms tribaux sont formulés avec « descendants » pour éviter le calque peu naturel « fils de », tandis que l’expression théologiquement forte « de la main de Yahvé » est conservée et expliquée.
