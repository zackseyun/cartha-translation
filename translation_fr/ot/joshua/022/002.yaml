source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: fr
  text: 'Il leur dit : « Vous avez observé tout ce que Moïse, serviteur de Yahweh, vous avait commandé, et vous avez écouté ma voix[a] en tout ce que je vous ai commandé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous m’avez obéi ». L’expression hébraïque « écouter la voix » implique souvent une réponse obéissante.
    reason: alternative lexicale et explicitation d’un idiome hébraïque
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Il leur dit
  rationale: Le waw consécutif fait progresser le récit. Le passé simple convient au registre narratif français, et « leur » rend directement le complément pronominal.
- source_word: שְׁמַרְתֶּם
  choice: vous avez observé
  rationale: Dans un contexte de commandements, שׁמר signifie respecter ou mettre en pratique. « Observer » exprime naturellement cette fidélité en français sans suggérer la simple perception visuelle.
- source_word: כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: tout ce que … vous avait commandé
  rationale: « Tout ce que » conserve la portée exhaustive de l’hébreu. Le plus-que-parfait situe naturellement le commandement de Moïse avant le constat présent de Josué.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Moïse, serviteur de Yahweh
  rationale: עֶבֶד fonctionne ici comme un titre honorifique lié au service confié à Moïse, d’où « serviteur » plutôt qu’« esclave ». Le nom divin est translittéré « Yahweh ».
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: et vous avez écouté ma voix
  rationale: La formulation conserve l’image auditive de l’expression hébraïque, laquelle implique aussi l’obéissance dans ce contexte.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: en tout ce que je vous ai commandé
  rationale: Cette tournure maintient la portée globale de לְכֹל אֲשֶׁר et le parallélisme avec le commandement de Moïse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de עֶבֶד appliqué à Moïse
  choice: serviteur
  alternative: esclave
  rationale: Dans cette expression consacrée, le mot désigne la relation de service et la mission honorifique de Moïse auprès de Yahweh; le statut servile n’est pas l’élément mis en avant.
- issue: Portée de l’expression שׁמע בקול
  choice: écouté ma voix
  alternative: obéi à ma voix / vous m’avez obéi
  rationale: Le choix principal préserve l’image hébraïque sans supprimer son implication d’obéissance; la note explicite cette nuance.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple introduit la parole, tandis que les passés composés rendent le bilan adressé aux tribus. L’expression légèrement marquée « écouter ma voix » est conservée pour refléter l’idiome hébraïque, avec une note qui en précise le sens.
