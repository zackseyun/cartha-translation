  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: fr
  text: Les fils de Ruben et les fils de Gad appelèrent l’autel « Témoin »[a], car il est témoin entre nous que Yahweh est Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus développée : « Ils appelèrent l’autel : “Témoin entre nous que Yahweh est Dieu” », si l’on comprend la proposition explicative comme faisant partie du nom plutôt que comme la raison de ce nom.'
    reason: Lecture alternative de la syntaxe et de l’étendue du nom donné à l’autel.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: appelèrent
  rationale: Avec ל et l’objet, קרא exprime ici l’action d’appeler ou de donner un nom. « Appelèrent » reste proche de la forme hébraïque tout en étant naturel en français.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: les fils de Ruben et les fils de Gad
  rationale: Cette formulation conserve la construction hébraïque et le lien explicite avec les descendants des deux patriarches.
- source_word: לַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français courant de מִזְבֵּחַ ; l’autel est ici l’objet auquel un nom est donné.
- source_word: עֵד
  choice: Témoin
  rationale: Le nom signifie « témoin » ou « témoignage ». La majuscule et les guillemets indiquent sa fonction possible de nom propre sans ajouter au texte.
- source_word: כִּי
  choice: car
  rationale: Le premier כִּי introduit naturellement l’explication ou la raison du nom donné à l’autel.
- source_word: הוּא
  choice: il est
  rationale: Le pronom reprend « l’autel », nom masculin en français.
- source_word: בֵּינֹתֵינוּ
  choice: entre nous
  rationale: L’expression désigne le rapport de témoignage établi entre les groupes concernés.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: que Yahweh est Dieu
  rationale: Le second כִּי introduit le contenu du témoignage. « Est Dieu » rend la confession de façon idiomatique sans surinterpréter l’article hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Faut-il comprendre toute la proposition explicative comme le nom de l’autel ?
  choice: Ne donner dans le texte principal que le nom explicitement attesté « Témoin » et traiter la suite comme son explication.
  alternative: '« Ils appelèrent l’autel : “Témoin entre nous que Yahweh est Dieu.” »'
  rationale: Le texte massorétique permet de lire עֵד comme le nom, suivi d’une proposition explicative. Il reste toutefois possible de prendre l’ensemble comme un nom développé ; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « les fils de… et les fils de… » est maintenue pour refléter la structure hébraïque. « Yahweh » conserve le nom divin, conformément aux données lexicales fournies.
