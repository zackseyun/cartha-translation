  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: fr
  text: si nous nous sommes bâti un autel pour nous détourner de Yahweh, ou pour y offrir un holocauste et une offrande de céréales, ou pour y offrir des sacrifices de paix[a], que Yahweh lui-même nous en demande compte[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « sacrifices de communion ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Yahweh lui-même nous en demandera compte. »'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: si nous nous sommes bâti un autel
  rationale: Dans le contexte du serment commencé au verset précédent, l’infinitif avec ל a une valeur conditionnelle. Le pronom réfléchi et le datif « nous » rendent naturellement לָנוּ en français.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: pour nous détourner de Yahweh
  rationale: שׁוּב מֵאַחֲרֵי exprime l’abandon de celui que l’on suivait. « Nous détourner de » restitue clairement cette idée d’apostasie sans alourdir la phrase.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: pour y offrir un holocauste et une offrande de céréales
  rationale: « Holocauste » est le terme cultuel français usuel pour עוֹלָה. Dans ce contexte sacrificiel, מִנְחָה désigne une offrande de céréales. La conjonction וּ est conservée par « et ».
- source_word: לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: pour y offrir des sacrifices de paix
  rationale: עָשָׂה est ici employé dans le sens idiomatique d’accomplir ou d’offrir des sacrifices. « Sacrifices de paix » garde le lien lexical avec שָׁלוֹם, tandis qu’une autre désignation possible est signalée en note.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: que Yahweh lui-même nous en demande compte
  rationale: Dans ce serment d’auto-malédiction, le yiqtol a une force imprécatoire. « Que… » la restitue en français, « lui-même » rend l’emphase de הוּא, et « demander compte » exprime le sens contextuel de בִּקֵּשׁ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est translittéré afin de préserver le nom d’alliance présent dans le texte hébreu.
- issue: Valeur de la proposition finale dans le serment
  choice: que Yahweh lui-même nous en demande compte
  alternative: Yahweh lui-même nous en demandera compte
  rationale: Le contexte favorise une imprécation volontaire plutôt qu’une simple prédiction, tout en laissant l’autre compréhension possible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle est rendue explicitement à partir du contexte du serment. Les termes sacrificiels traditionnels restent intelligibles, avec une variante lexicale en note.
