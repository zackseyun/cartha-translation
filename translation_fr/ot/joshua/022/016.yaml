  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: fr
  text: 'Voici ce que dit toute la communauté de Yahweh : « Quelle est cette infidélité que vous avez commise envers le Dieu d’Israël[a], en vous détournant aujourd’hui de Yahweh, en vous construisant un autel et en vous révoltant aujourd’hui contre Yahweh ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette trahison » ou « cet acte de déloyauté ». Le terme hébreu désigne une infidélité, notamment envers Dieu dans le cadre de l’alliance ou du culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: Voici ce que dit
  rationale: Cette tournure rend naturellement en français la formule de transmission כֹּה אָמְרוּ. Le présent convient au discours rapporté, et le singulier s’accorde avec le sujet collectif.
- source_word: כֹּל עֲדַת יְהוָה
  choice: toute la communauté de Yahweh
  rationale: « Communauté » désigne clairement l’ensemble du peuple constitué en assemblée, sans connotation confessionnelle moderne trop marquée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: Quelle est cette infidélité que vous avez commise
  rationale: Le substantif et le verbe apparentés forment une construction emphatique. « Infidélité » exprime la déloyauté cultuelle et relationnelle, tandis que « commise » permet une formulation française naturelle.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: envers le Dieu d’Israël
  rationale: Avec מעל, la préposition introduit celui envers qui l’infidélité est commise. « Envers » garde la dimension relationnelle sans affaiblir l’accusation.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: Vous vous détournez aujourd’hui de Yahweh
  rationale: La traduction exprime l’abandon de l’allégeance à Yahweh. Le français naturel n’exige pas de reproduire littéralement l’image « de derrière Yahweh ».
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: en vous construisant un autel
  rationale: Le gérondif rend la circonstance ou le moyen exprimé par l’infinitif préfixé de ב, et le pronom réfléchi traduit לָכֶם.
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: vous révoltant aujourd’hui contre Yahweh
  rationale: Cette formulation conserve la valeur verbale de מרד, l’objet de la révolte et la répétition rhétorique de « aujourd’hui ».
theological_decisions:
- issue: Sens de מַעַל dans l’accusation
  choice: infidélité
  alternative: trahison ; acte de déloyauté
  rationale: Le mot désigne ici une violation de loyauté envers Dieu, probablement dans le domaine cultuel et communautaire. « Infidélité » garde cette portée sans réduire l’acte à une faute générique.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom personnel.
- issue: Rapport syntaxique des infinitifs לָשׁוּב et לִמְרָדְכֶם
  choice: Deux propositions participiales décrivant l’infidélité alléguée
  alternative: 'Des infinitifs de but : « pour vous détourner… afin de vous révolter »'
  rationale: Le contexte présente la construction de l’autel comme la manifestation de l’abandon et de la révolte. La formulation française choisie laisse ouverte la nuance exacte entre contenu, résultat et intention.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « aujourd’hui » est conservée pour maintenir l’urgence rhétorique. L’exclamation finale transmet la force accusatrice de la question hébraïque prolongée.
