review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : la communauté accuse les tribus de l’est d’une infidélité envers le Dieu d’Israël, consistant à se détourner de Yahweh par la construction d’un autel et à se rebeller contre lui. Toutefois, la première proposition infinitive est rendue comme une affirmation indépendante (« Vous vous détournez »), alors qu’elle dépend de la question et décrit l’infidélité reprochée.'
  naturalness: Le français est globalement clair et moderne. La coordination de deux gérondifs après une proposition indépendante (« Vous vous détournez..., vous révoltant... ») est cependant syntaxiquement moins nette que de rattacher les deux actions à « que vous avez commise ».
  terminology: « Communauté », « Yahweh », « Dieu d’Israël », « autel », « infidélité » et « révolter contre » sont appropriés. « Infidélité » est un rendu recevable de מַעַל; la note conserve utilement les nuances « trahison » et « déloyauté ».
  issues:
  - severity: medium
    issue: 'Le segment לָשׁוּב ... (« se détourner aujourd’hui de Yahweh ») est formulé comme une proposition autonome : « Vous vous détournez ».'
    rationale: En hébreu, l’infinitif est syntaxiquement rattaché à l’accusation/question précédente et expose la nature ou le résultat de l’infidélité. Le rattacher explicitement à « que vous avez commise » préserve mieux la structure sans trancher indûment entre but, résultat et explication.
  - severity: low
    issue: La ponctuation sépare la question initiale des éléments qui en développent l’accusation.
    rationale: Une seule question englobant les propositions participiales donne une articulation plus fidèle et plus fluide en français.
