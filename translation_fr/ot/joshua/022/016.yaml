- from: 'Voici ce que dit toute la communauté de Yahweh : « Quelle est cette infidélité que vous avez commise envers le Dieu d’Israël[a] ? Vous vous détournez aujourd’hui de Yahweh en vous construisant un autel, vous révoltant aujourd’hui contre Yahweh ! »'
  to: 'Voici ce que dit toute la communauté de Yahweh : « Quelle est cette infidélité que vous avez commise envers le Dieu d’Israël[a], en vous détournant aujourd’hui de Yahweh, en vous construisant un autel et en vous révoltant aujourd’hui contre Yahweh ? »'
  rationale: La révision rattache explicitement les actions de se détourner, de construire un autel et de se révolter à l’« infidélité » mise en cause par la question. Elle maintient la répétition de « aujourd’hui », le nom divin Yahweh, l’ambiguïté syntaxique des infinitifs hébreux et le registre moderne soutenu.
