  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: fr
  text: Les Rubénites, les Gadites et la demi-tribu de Manassé s’en retournèrent et partirent d’auprès des Israélites, de Silo, qui est au pays de Canaan, pour aller au pays de Galaad, au pays de leur propriété, dont ils avaient pris possession[a] sur l’ordre de Yahweh transmis par Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « où ils avaient été établis ». Le verbe hébreu peut souligner soit leur établissement dans ce territoire, soit leur prise de possession de celui-ci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: s’en retournèrent et partirent
  rationale: 'Les deux verbes hébreux sont conservés : שוב exprime le retour vers leur territoire, tandis que הלך marque leur départ effectif.'
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: les Rubénites, les Gadites et la demi-tribu de Manassé
  rationale: Les gentilés français rendent naturellement l’expression hébraïque « fils de » employée pour désigner ces groupes tribaux, sans perdre leur identité collective.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: de chez les Israélites
  rationale: La tournure exprime la séparation d’avec le reste de l’assemblée d’Israël dans un français naturel.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: Silo, au pays de Canaan
  rationale: Cette formulation conserve l’identification géographique tout en évitant une relative pesante en français.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: au pays de Galaad
  rationale: Le mot אֶרֶץ est rendu explicitement afin de maintenir l’accent territorial.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: le territoire qui était leur propriété
  rationale: אֲחֻזָּה désigne une possession foncière durable; « territoire » et « propriété » en communiquent ensemble la portée juridique et géographique.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: où ils avaient été établis
  rationale: Le niphal de אחז peut présenter leur installation dans le territoire comme un état reçu ou acquis. Le passif français respecte cette nuance sans exclure l’idée de prise de possession, signalée en note.
- source_word: עַל פִּי יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: L’expression idiomatique signifie « selon l’ordre de ». Le nom divin est translittéré afin de représenter directement le tétragramme.
- source_word: בְּיַד מֹשֶׁה
  choice: transmis par Moïse
  rationale: L’expression « par la main de Moïse » indique ici la médiation; « transmis par Moïse » la rend clairement en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Mode d’acquisition du territoire
  choice: où ils avaient été établis
  alternative: dont ils avaient pris possession
  rationale: Le niphal נֹאחֲזוּ permet d’entendre soit l’établissement dans une possession reçue, soit l’entrée en possession. Le texte principal conserve la valeur passive, et la note maintient l’autre lecture possible sans trancher la tension.
translation_notes:
  register: Français international moderne, digne et accessible. Les gentilés allègent la formulation, tandis que la répétition des deux verbes de mouvement et les désignations territoriales maintiennent la structure et les accents de l’hébreu.
