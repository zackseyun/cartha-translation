base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: fr
  text: 'Mais cet autel est un témoin entre nous et vous, et entre nos générations après nous, afin que nous accomplissions le service de l’Éternel devant lui, avec nos holocaustes, nos sacrifices et nos sacrifices de communion, afin que vos fils ne disent pas un jour à nos fils : « Vous n’avez aucune part à l’Éternel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Mais
  rationale: 'Dans le contexte, la particule introduit la correction de l’interprétation précédente : l’autel n’est pas destiné aux sacrifices, mais au témoignage.'
- source_word: עֵד הוּא
  choice: cet autel servira de témoin
  rationale: Le pronom renvoie à l’autel du contexte. L’explicitation légère rend le référent clair en français, tandis que le futur fonctionnel exprime son rôle durable.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: nous accomplissons le service de l’Éternel
  rationale: La formulation conserve la répétition sémantique de la racine עבד sans produire le calque peu naturel « servir le service ».
- source_word: שְׁלָמִים
  choice: sacrifices de communion
  rationale: Ce terme désigne des sacrifices associés à la paix, à la plénitude et au repas partagé; « sacrifices de communion » communique ici leur fonction cultuelle.
- source_word: חֵלֶק בַּיהוָה
  choice: part à l’Éternel
  rationale: La tournure préserve l’image d’une part ou d’un droit d’appartenance lié à l’Éternel, sans préciser indûment sa portée.
theological_decisions:
- issue: Fonction de l’autel
  choice: Il est présenté comme témoin du culte légitime rendu à l’Éternel, non comme lieu où ces offrandes sont apportées.
  alternative: Comprendre que le service et les sacrifices seraient accomplis sur cet autel.
  rationale: Le contexte immédiat distingue explicitement l’autel-témoin d’un autel destiné aux holocaustes et aux sacrifices.
- issue: Sens de « part à l’Éternel »
  choice: Conserver la formulation ouverte « aucune part à l’Éternel ».
  alternative: Expliciter par « aucun droit de servir l’Éternel » ou « aucune appartenance au peuple de l’Éternel ».
  rationale: L’hébreu peut évoquer l’accès cultuel, l’appartenance et les droits liés à l’alliance; la traduction ne tranche pas entre ces dimensions.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « L’Éternel » suit l’usage biblique français pour le tétragramme. La phrase hébraïque très longue est divisée en deux pour la clarté, sans supprimer le lien logique entre le témoignage de l’autel et la prévention d’une exclusion future.
