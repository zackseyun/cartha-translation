review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, notamment la fonction de l’autel comme témoin et la formule ouverte « part à l’Éternel ». Toutefois, « il attestera que nous accomplissons » transforme la proposition finale hébraïque (« afin que nous accomplissions ») en une déclaration attestée et au présent, plutôt qu’en but durable. Le verbe final doit également exprimer le but préventif (« afin que ... ne disent pas »), non une impossibilité (« ne pourront pas dire »).
  naturalness: Le français est fluide et de registre biblique moderne. La formulation révisée conserve cette clarté tout en suivant plus directement l’articulation de la phrase hébraïque.
  terminology: « L’Éternel », « holocaustes », « sacrifices » et « sacrifices de communion » sont cohérents et précis dans ce registre. « Part à l’Éternel » préserve volontairement l’ambiguïté du terme hébreu sans lui imposer une interprétation institutionnelle ou doctrinale.
  issues:
  - severity: medium
    issue: La subordonnée de but est remplacée par une proposition d’attestation au présent.
    rationale: 'לַעֲבֹד introduit le but : le témoin est là afin que les générations puissent accomplir le service de YHWH. « Il attestera que nous accomplissons » modifie à la fois la relation syntaxique et la portée générationnelle.'
  - severity: medium
    issue: « Ne pourront pas dire » renforce indûment le verbe final.
    rationale: 'Le yiqtol négatif exprime ici le résultat recherché ou la prévention d’une exclusion future : « afin que ... ne disent pas ». Il n’affirme pas nécessairement une incapacité à parler.'
  revised_text: 'Mais cet autel est un témoin entre nous et vous, et entre nos générations après nous, afin que nous accomplissions le service de l’Éternel devant lui, avec nos holocaustes, nos sacrifices et nos sacrifices de communion, afin que vos fils ne disent pas un jour à nos fils : « Vous n’avez aucune part à l’Éternel. »'
  revised_footnotes: []
  revision_rationale: 'La révision restitue les deux propositions de but du texte hébreu : le témoin établit la continuité du service cultuel et empêche une future exclusion. L’explicitation contextuelle « cet autel » est maintenue, car le pronom hébreu renvoie directement à l’autel dont il est question dans le passage.'
