revisions:
- from: 'Mais cet autel servira de témoin entre nous et vous, ainsi qu’entre les générations qui viendront après nous : il attestera que nous accomplissons le service de l’Éternel devant lui par nos holocaustes, nos sacrifices et nos sacrifices de communion. Ainsi, à l’avenir, vos fils ne pourront pas dire aux nôtres : « Vous n’avez aucune part à l’Éternel. »'
  to: 'Mais cet autel est un témoin entre nous et vous, et entre nos générations après nous, afin que nous accomplissions le service de l’Éternel devant lui, avec nos holocaustes, nos sacrifices et nos sacrifices de communion, afin que vos fils ne disent pas un jour à nos fils : « Vous n’avez aucune part à l’Éternel. »'
  rationale: 'La révision restitue les deux propositions de but du texte hébreu : le témoin établit la continuité du service cultuel et empêche une future exclusion. L’explicitation contextuelle « cet autel » est maintenue, car le pronom hébreu renvoie directement à l’autel dont il est question dans le passage.'
