base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: fr
  text: 'Ils arrivèrent auprès des fils de Ruben, des fils de Gad et de la demi-tribu de Manassé, au pays de Galaad, et leur parlèrent en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils arrivèrent
  rationale: Le qal wayyiqtol de בוא exprime ici le déplacement jusqu’au lieu où se trouvent les tribus orientales. « Arrivèrent » est naturel en français narratif et rend clairement l’aboutissement du trajet.
- source_word: בְּנֵי
  choice: fils de
  rationale: Dans cette formule tribale, le pluriel construit de בן désigne conventionnellement les membres issus de Ruben et de Gad. « Fils de » conserve la forme hébraïque traditionnelle sans ajouter d’interprétation.
- source_word: חֲצִי שֵׁבֶט
  choice: demi-tribu
  rationale: Cette expression construite est une désignation tribale récurrente et se rend naturellement en français par « demi-tribu ».
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: au pays de Galaad
  rationale: אֶל porte normalement une nuance directionnelle. Placée après les groupes tribaux, l’expression indique ici le lieu de destination où ils les rejoignent. « Au pays de Galaad » préserve à la fois la destination et la localisation sans lourdeur.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: leur parlèrent
  rationale: דבר avec אֵת peut signifier parler avec quelqu’un ou lui parler. Dans l’introduction immédiate d’un discours, « leur parlèrent » est idiomatique et laisse le contexte préciser la nature de l’échange.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif construit introduit le discours direct qui suit. « En ces termes : » remplit naturellement cette fonction en français moderne, tout en maintenant le lien narratif avec le verset suivant.'
