source:
  edition: WLC
  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: fr
  text: Vous n’avez pas abandonné vos frères[a] durant ces nombreux jours, jusqu’à ce jour, et vous avez rempli le devoir imposé par le commandement de Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos compatriotes israélites » ; l’hébreu dit littéralement « vos frères », terme masculin pluriel de parenté qui peut désigner plus largement les membres d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: vous n’avez pas abandonné
  rationale: Le verbe עזב signifie quitter, délaisser ou abandonner. « Abandonné » exprime clairement ici la fidélité relationnelle des tribus envers leurs frères.
- source_word: אֲחֵיכֶם
  choice: vos frères
  rationale: Le nom hébreu est un pluriel masculin de parenté. « Vos frères » en conserve la forme et la portée fraternelle, tandis qu’une note précise son sens collectif possible.
- source_word: זֶה יָמִים רַבִּים
  choice: durant toute cette longue période
  rationale: L’expression idiomatique désigne une longue durée. Cette formulation moderne restitue à la fois la durée et la valeur démonstrative de זֶה sans calquer maladroitement l’hébreu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Cette expression temporelle indique que la fidélité s’est prolongée sans interruption jusqu’au moment présent.
- source_word: וּשְׁמַרְתֶּם
  choice: vous avez fidèlement rempli
  rationale: שׁמר évoque ici l’observation soigneuse d’une responsabilité. L’adverbe « fidèlement » rend la nuance de vigilance attachée au verbe dans cette construction.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: le devoir imposé par le commandement
  rationale: La chaîne construite associe une responsabilité confiée à un commandement. Cette formulation conserve les deux notions tout en évitant en français le calque obscur « la garde du commandement ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Cette désignation d’alliance est directement et naturellement rendue en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée du terme de parenté אֲחֵיכֶם
  choice: vos frères
  alternative: vos compatriotes israélites
  rationale: Le masculin pluriel de l’hébreu est conservé dans le texte principal. Comme il peut désigner plus largement les autres membres d’Israël, cette portée est signalée en note sans neutraliser silencieusement le terme.
- issue: Rapport entre מִשְׁמֶרֶת et מִצְוַת
  choice: le devoir imposé par le commandement
  alternative: la charge du commandement
  rationale: La formulation retenue maintient la distinction entre la responsabilité assumée et le commandement qui la fonde, tout en restant intelligible en français courant.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton solennel de la déclaration de Josué, mais rend les idiomes hébreux dans un français naturel. Le nom divin est transcrit « Yahweh ».
