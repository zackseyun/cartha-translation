revisions:
- from: Vous n’avez pas abandonné vos frères[a] durant toute cette longue période, jusqu’à aujourd’hui, et vous avez fidèlement rempli le devoir imposé par le commandement de Yahweh votre Dieu.
  to: Vous n’avez pas abandonné vos frères[a] durant ces nombreux jours, jusqu’à ce jour, et vous avez rempli le devoir imposé par le commandement de Yahweh, votre Dieu.
  rationale: La révision retire l’intensification non exprimée « fidèlement » et resserre l’expression de durée afin de suivre plus étroitement זֶה יָמִים רַבִּים. Elle conserve le nom divin, le terme « frères » avec sa note explicative, ainsi que la distinction entre le devoir/charge et le commandement.
