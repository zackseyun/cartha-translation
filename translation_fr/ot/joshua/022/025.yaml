source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: fr
  text: Car Yahweh a établi le Jourdain comme frontière entre nous et vous, fils de Ruben et fils de Gad. Vous n’avez aucune part auprès de Yahweh. Ainsi, vos fils pourraient amener nos fils à ne plus craindre Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: a placé … comme frontière
  rationale: Avec גְּבוּל, נָתַן exprime ici l’établissement d’une limite. Cette tournure française est naturelle tout en restant proche de l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֶת הַיַּרְדֵּן
  choice: le Jourdain
  rationale: En français, le nom propre suffit naturellement pour désigner le fleuve.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: fils de Ruben et fils de Gad
  rationale: Cette formulation conserve la désignation tribale explicite de l’hébreu sans la convertir en gentilés.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: Vous n’avez aucune part en Yahweh
  rationale: « Part » rend חֵלֶק sans préciser indûment s’il s’agit d’héritage, de territoire ou de participation à l’alliance; « en Yahweh » préserve la construction et sa tension théologique.
- source_word: וְהִשְׁבִּיתוּ
  choice: pourraient amener … à ne plus
  rationale: Le hiphil de שבת est causatif. Le conditionnel « pourraient » convient à la conséquence redoutée dans le contexte.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: à ne plus craindre Yahweh
  rationale: La formulation exprime la cessation ou la prévention de la crainte de Yahweh, tout en conservant le vocabulaire biblique de la crainte révérencielle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; sa translittération maintient le caractère personnel du nom divin.
- issue: Sens de חֵלֶק בַּיהוָה
  choice: aucune part en Yahweh
  alternative: aucun héritage auprès de Yahweh
  rationale: Le texte n’explicite pas la nature exacte de cette « part ». Le rendu retenu conserve l’ambiguïté et la portée relationnelle ou cultuelle possible sans imposer une interprétation particulière.
- issue: Modalité de la conséquence exprimée par וְהִשְׁבִּיתוּ
  choice: pourraient amener
  alternative: amèneront
  rationale: Dans le discours, il s’agit d’un risque futur invoqué pour expliquer la construction de l’autel. Le conditionnel rend cette crainte sans présenter l’issue comme certaine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste assez formelle pour préserver la progression du discours, avec « fils de Ruben et fils de Gad » et l’expression biblique « craindre Yahweh ».
