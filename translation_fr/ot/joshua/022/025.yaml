    issue: 'Expression peu naturelle : « Vous n’avez aucune part en Yahweh ».'
    rationale: Bien qu’elle reproduise formellement la préposition hébraïque, cette construction n’est pas idiomatique en français moderne. « Vous n’avez aucune part auprès de Yahweh » exprime naturellement l’exclusion en cause tout en maintenant l’ambiguïté du terme חֵלֶק.
  - severity: low
    issue: « Yahweh a placé le Jourdain comme frontière » est légèrement moins précis que nécessaire.
    rationale: Avec נָתַן et גְּבוּל, l’idée est celle d’établir ou de fixer une frontière. « A établi » rend mieux cette collocation sans modifier le sens.
  revised_text: Car Yahweh a établi le Jourdain comme frontière entre nous et vous, fils de Ruben et fils de Gad. Vous n’avez aucune part auprès de Yahweh. Ainsi, vos fils pourraient amener nos fils à ne plus craindre Yahweh.
