    issue: Référence pronominale et construction de « Josué en donna un avec leurs frères »
    rationale: Le pronom « en » suivi de « un » est peu naturel avec « un territoire » comme seul antécédent exprimé, et « leurs frères » manque d’un référent pluriel grammaticalement saillant. Une reformulation avec « les membres de l’autre moitié » donne un antécédent clair à « leur/leurs » tout en conservant le sens collectif du texte hébreu.
