  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: fr
  text: À une moitié de la tribu de Manassé, Moïse avait donné un territoire dans le Bashân ; quant aux membres de l’autre moitié, Josué leur donna un territoire avec leurs frères[a], de l’autre côté du Jourdain, vers l’ouest. Lorsque Josué les renvoya à leurs tentes, il les bénit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec leurs frères ». Il s’agit des autres Israélites appartenant aux tribus établies à l’ouest du Jourdain.'
    reason: Clarifie le référent collectif du terme de parenté sans neutraliser le texte principal.
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: À une moitié de la tribu de Manassé
  rationale: Cette formulation française exprime naturellement la première des deux divisions de la tribu et prépare le contraste avec « l’autre moitié ».
- source_word: נָתַן מֹשֶׁה
  choice: Moïse avait donné
  rationale: Le plus-que-parfait marque l’antériorité du don fait par Moïse par rapport à celui de Josué.
- source_word: בַּבָּשָׁן
  choice: dans le Bashân
  rationale: Le nom régional est rendu selon l’usage français traditionnel et avec l’article attendu en français.
- source_word: וּלְחֶצְיוֹ
  choice: à l’autre moitié
  rationale: Le suffixe renvoie à la tribu de Manassé ; « l’autre moitié » explicite clairement le contraste.
- source_word: נָתַן יְהוֹשֻׁעַ
  choice: Josué en donna un
  rationale: Le pronom « en » reprend « un territoire », objet sous-entendu en hébreu mais requis pour une lecture française fluide.
- source_word: עִם אֲחֵיהֶם
  choice: avec leurs frères
  rationale: La traduction conserve le terme de parenté masculin du texte hébreu, qui désigne ici les autres Israélites établis à l’ouest.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: de l’autre côté du Jourdain, vers l’ouest
  rationale: Cette formulation maintient à la fois l’expression relative « de l’autre côté » et l’indication directionnelle littérale vers la mer, c’est-à-dire l’ouest.
- source_word: וְגַם כִּי
  choice: Lorsque
  rationale: Dans ce contexte narratif, la combinaison introduit naturellement l’action temporelle suivante ; le lien avec la phrase précédente est assuré par l’enchaînement.
- source_word: שִׁלְּחָם
  choice: les renvoya
  rationale: Le piel de שלח signifie ici faire partir ou congédier ; « renvoya » convient au départ vers leur lieu de résidence.
- source_word: אֶל אָהֳלֵיהֶם
  choice: à leurs tentes
  rationale: La traduction préserve l’image concrète du texte plutôt que de la remplacer par « chez eux ».
- source_word: וַיְבָרֲכֵם
  choice: il les bénit
  rationale: Rendu direct et usuel du verbe ברך dans ce contexte.
