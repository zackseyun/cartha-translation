revisions:
- from: À une moitié de la tribu de Manassé, Moïse avait donné un territoire dans le Bashân ; à l’autre moitié, Josué en donna un avec leurs frères[a], de l’autre côté du Jourdain, vers l’ouest. Lorsque Josué les renvoya à leurs tentes, il les bénit.
  to: À une moitié de la tribu de Manassé, Moïse avait donné un territoire dans le Bashân ; quant aux membres de l’autre moitié, Josué leur donna un territoire avec leurs frères[a], de l’autre côté du Jourdain, vers l’ouest. Lorsque Josué les renvoya à leurs tentes, il les bénit.
  rationale: 'La révision résout l’ambiguïté syntaxique française en explicitant, de façon minimale, que l’« autre moitié » désigne ses membres. Elle évite le tour peu idiomatique « en donna un » et maintient les éléments sémantiques du texte source : l’attribution par Josué, l’association avec leurs frères et la localisation à l’ouest du Jourdain.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T13:11:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement l’opposition entre les deux moitiés de Manassé, l’antériorité de l’attribution par Moïse, le Bashân, la localisation occidentale par rapport au Jourdain, le renvoi aux tentes et la bénédiction. Toutefois, « Josué en donna un avec leurs frères » est syntaxiquement et référentiellement maladroit en français : « en donna un » suppose une série explicite de territoires, tandis que « leurs » n’a pas d’antécédent pluriel net dans la formulation immédiate.'
  naturalness: La première proposition est globalement fluide. La seconde nécessite une reformulation afin que l’attribution à l’autre moitié et l’association avec ses frères soient immédiatement intelligibles, sans introduire de contenu interprétatif.
  terminology: « Manassé », « Moïse », « Josué », « Bashân », « Jourdain », « tentes » et « bénit » sont appropriés. La note doit correspondre exactement à la formulation conservée pour le terme de parenté.
  issues:
