  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: fr
  text: Alors Phinéas, fils d’Éléazar le prêtre, et les chefs revinrent de chez les descendants de Ruben et de Gad, du pays de Galaad au pays de Canaan, auprès des Israélites[a], et leur firent un rapport[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « auprès des fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils leur rapportèrent ce qui s’était passé ». Le terme hébreu davar peut désigner une parole, une affaire ou un rapport selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: retournèrent
  rationale: Le verbe שׁוב exprime ici le retour accompli de la délégation. Le pluriel français s’impose naturellement puisque Phinéas et les chefs constituent ensemble le sujet.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Phinéas, fils du prêtre Éléazar
  rationale: Cette formulation naturelle rattache explicitement le titre « prêtre » à Éléazar, conformément à la construction hébraïque, tout en conservant les formes françaises traditionnelles des noms.
- source_word: וְהַנְּשִׂיאִים
  choice: et les chefs
  rationale: נְשִׂיאִים désigne ici les chefs représentant les tribus. « Chefs » est actuel, concis et n’introduit aucune idée de royauté.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: quittèrent les descendants de Ruben et de Gad
  rationale: Dans ce contexte tribal, בְּנֵי désigne les membres ou descendants des tribus. « Descendants » garde le lien généalogique de l’expression hébraïque sans employer le littéralisme peu naturel « fils de ».
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: au pays de Galaad, et retournèrent au pays de Canaan
  rationale: « Pays » rend אֶרֶץ dans les deux membres et préserve le contraste géographique. La syntaxe française place Galaad avec le groupe que la délégation quitte.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: auprès des Israélites
  rationale: « Israélites » exprime naturellement l’emploi collectif de « fils d’Israël »; « auprès de » convient au retour vers les personnes auxquelles la délégation rend compte.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: auxquels ils firent un rapport
  rationale: L’expression indique que les délégués transmettent en retour une parole, une information ou un compte rendu. « Firent un rapport » est idiomatique et conserve la portée contextuelle de דָּבָר, tandis qu’une note signale son étendue lexicale.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase a été légèrement réorganisée pour éviter l’empilement peu naturel des compléments de provenance en français, sans effacer le trajet de Galaad vers Canaan ni les destinataires du rapport.
