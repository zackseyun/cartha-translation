  to: Alors Phinéas, fils d’Éléazar le prêtre, et les chefs revinrent de chez les descendants de Ruben et de Gad, du pays de Galaad au pays de Canaan, auprès des Israélites[a], et leur firent un rapport[b].
  rationale: La révision clarifie la provenance de la délégation et conserve les repères géographiques successifs du texte hébreu. Elle garde « Israélites » comme équivalent idiomatique de « fils d’Israël », signalé en note, et rend l’acte final comme un rapport adressé aux destinataires, sans préciser indûment le contenu de davar.
