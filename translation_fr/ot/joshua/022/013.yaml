id: JOS.22.13
reference: Joshua 22:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: fr
  text: Alors les Israélites[a] envoyèrent Phinéas, fils du prêtre Éléazar, auprès des descendants de Ruben, des descendants de Gad et de la demi-tribu de Manassé, au pays de Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: La note conserve la forme généalogique de l’hébreu derrière la désignation collective idiomatique « les Israélites ».
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Alors ... envoyèrent
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation collective rend naturellement en français moderne l’expression hébraïque littérale « les fils d’Israël », sans laisser entendre qu’il ne s’agit que des hommes.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: les descendants de Ruben / les descendants de Gad
  rationale: « Descendants » conserve l’image généalogique de בְּנֵי tout en désignant clairement les groupes tribaux en français courant.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: la demi-tribu de Manassé
  rationale: Expression française établie et précise pour la chaîne construite hébraïque.
- source_word: אֶל
  choice: auprès de
  rationale: Avec le verbe « envoyer » et des destinataires humains, « auprès de » exprime naturellement la mission confiée à Phinéas, plutôt qu’une action hostile.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: au pays de Galaad
  rationale: Rend la destination géographique introduite par אֶל, tout en indiquant où se trouvaient les groupes concernés.
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Phinéas, fils du prêtre Éléazar
  rationale: Le marqueur d’objet אֶת n’est pas traduit. La formulation française rattache naturellement le titre « prêtre » à Éléazar, son antécédent immédiat.
theological_decisions:
- issue: Rattachement de הַכֹּהֵן (« le prêtre »)
  choice: 'le titre qualifie Éléazar : « fils du prêtre Éléazar »'
  alternative: « Phinéas, fils d’Éléazar, le prêtre », qui pourrait faire de Phinéas le prêtre
  rationale: En hébreu, הַכֹּהֵן suit immédiatement אֶלְעָזָר et l’identifie le plus naturellement ; la formulation retenue évite une ambiguïté française artificielle.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms propres suivent les formes françaises bibliques usuelles : Phinéas, Éléazar, Ruben, Manassé et Galaad.'
