source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: fr
  text: La faute de Péor[b] ne nous suffisait-elle pas[a] ? Nous ne nous en sommes pas purifiés jusqu’à ce jour, et le fléau a frappé la communauté de Yahweh !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La faute de Péor était-elle trop peu de chose pour nous ? » Le mot hébreu peut aussi signifier « culpabilité » ou, par extension, les conséquences de la faute.'
    reason: La note conserve la forme de la question hébraïque et l’ambiguïté de עָוֹן.
  - marker: b
    text: Le texte hébreu porte « Péor » ; dans des passages apparentés, l’expression complète est « Baal-Péor ».
    reason: La note signale la forme exacte du nom dans ce verset et son appellation plus complète ailleurs.
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: ne nous suffisait-elle pas ?
  rationale: Cette question rhétorique rend naturellement en français l’idée littérale « était-ce trop peu pour nous ? » et conserve la force du reproche.
- source_word: עֲוֺן
  choice: faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » garde ici la portée morale sans choisir exclusivement entre l’acte coupable et la culpabilité qui en découle.
- source_word: פְּעוֹר
  choice: Péor
  rationale: Le texte hébreu porte simplement « Péor »; il ne convient pas d’y introduire la forme plus développée « Baal-Péor » attestée ailleurs.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: Nous ne nous en sommes pas purifiés
  rationale: La forme réfléchie de טהר indique que la communauté ne s’est pas dégagée de la souillure liée à cette faute. « Se purifier de » conserve cette valeur et le registre cultuel et moral.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Expression française courante qui marque la persistance de la situation au moment où parle le locuteur.
- source_word: וַיְהִי הַנֶּגֶף
  choice: et un fléau a frappé
  rationale: La tournure française exprime naturellement la survenue du נֶגֶף. Aucun « pourtant » ou lien causal explicite n’est ajouté, car le waw hébreu coordonne simplement les propositions.
- source_word: בַּעֲדַת יְהוָה
  choice: la communauté de Yahweh
  rationale: עֵדָה désigne ici la communauté d’Israël dans sa dimension collective. « Yahweh » représente directement le nom divin יהוה.
theological_decisions:
- issue: Sens de עֲוֺן
  choice: faute
  alternative: culpabilité; châtiment de la faute
  rationale: Le contexte permet que le mot évoque à la fois l’offense de Péor et la culpabilité persistante. « Faute » laisse ouverte cette amplitude sémantique, explicitée en note.
- issue: Rapport entre la faute de Péor et le fléau
  choice: coordination sans causalité explicitée
  alternative: « à cause de laquelle un fléau a frappé »
  rationale: Le contexte historique suggère nettement un rapport causal, mais la proposition hébraïque est reliée par ו sans formule causale explicite. La traduction ne résout donc pas silencieusement ce rapport.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, direct et digne. La phrase hébraïque très compacte est répartie en deux phrases pour éviter une construction française obscure, tout en maintenant la question de reproche, la purification encore inachevée et le souvenir du fléau. Les marqueurs [a] et [b] figurent dans le texte.
