id: JOS.22.20
reference: Joshua 22:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: fr
  text: Akân, fils de Zérah, n’a-t-il pas commis une infidélité au sujet de ce qui était voué à la destruction, si bien que la colère a frappé toute l’assemblée d’Israël ? Pourtant, il n’a pas été le seul à périr à cause de sa faute.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: commis une infidélité
  rationale: La construction intensive désigne une violation grave de la fidélité due à Dieu. Cette formulation française est naturelle tout en conservant la portée religieuse et collective du terme.
- source_word: בַּחֵרֶם
  choice: au sujet de ce qui était voué à la destruction
  rationale: חֵרֶם désigne ici les biens mis à part sous interdit et destinés à la destruction. La périphrase explicite ce sens contextuel sans réduire le terme au simple « butin interdit ».
- source_word: קָצֶף
  choice: la colère
  rationale: Le contexte renvoie à la colère divine, mais le texte hébreu n'explicite pas ici son possesseur; la traduction conserve cette formulation implicite.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: l’assemblée d’Israël
  rationale: « Assemblée » rend le groupe constitué et solidaire visé par עֵדָה, dans un registre biblique clair et actuel.
- source_word: גָוַע
  choice: périr
  rationale: Le verbe exprime la mort; « périr » convient au contexte de jugement et reste idiomatique en français.
- source_word: בַּעֲוֹנוֹ
  choice: à cause de sa faute
  rationale: La préposition peut ici exprimer la cause. « Faute » rend עָוֹן sans imposer exclusivement le sens de culpabilité, de châtiment ou d'iniquité.
theological_decisions:
- issue: Portée collective de la faute d’Akân
  choice: « si bien que la colère a frappé toute l’assemblée d’Israël » et « il n’a pas été le seul à périr »
  alternative: Comprendre la dernière proposition comme « il n’est pas mort seul pour sa faute »
  rationale: La traduction maintient le contraste entre l’acte d’un seul homme et ses conséquences collectives, sans préciser au-delà du texte l’identité de tous ceux qui ont péri.
- issue: Identification de la colère comme divine
  choice: « la colère »
  alternative: « la colère de Dieu »
  rationale: Dans le contexte, la colère est manifestement divine, mais l’hébreu dit seulement קָצֶף. Ne pas ajouter « de Dieu » préserve la formulation de la source.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, ainsi que la tension entre responsabilité individuelle et conséquences collectives. Le nom עָכָן est transcrit « Akân », forme française courante.
