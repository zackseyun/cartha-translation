source:
  edition: WLC
  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: fr
  text: 'Les Israélites apprirent ceci[a] : « Voici que les descendants de Ruben, les descendants de Gad et la demi-tribu de Manassé ont construit l’autel en face du pays de Canaan[b], dans la région du Jourdain[c], du côté des Israélites[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « entendirent dire » ou « entendirent, disant »; l’hébreu emploie ici une formule introduisant le contenu du rapport.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vis-à-vis du pays de Canaan ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte littéralement « les régions » ou « les districts du Jourdain »; la nuance géographique exacte est incertaine.
    reason: cultural_note
  - marker: d
    text: La dernière expression géographique est difficile. Elle peut désigner le côté occupé par les Israélites, à l’ouest du Jourdain, ou une position située de l’autre côté, face à eux.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Les Israélites apprirent ceci
  rationale: Rend naturellement la formule hébraïque introduisant le contenu d’un rapport. « Les Israélites » est l’équivalent français courant de בְנֵי יִשְׂרָאֵל, tandis que la note conserve la possibilité d’une traduction plus formelle de לֵאמֹר.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Marque l’attention portée au contenu du rapport dans un français actuel et digne, sans recourir à l’archaïque « voici, » employé isolément.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: les descendants de Ruben, les descendants de Gad
  rationale: Dans ce contexte tribal, בְנֵי désigne les membres issus de ces ancêtres. « Descendants » préserve l’image familiale mieux que le seul nom des tribus et reste naturel en français.
- source_word: בָנוּ
  choice: ont construit
  rationale: Le parfait présente l’action comme accomplie; le passé composé convient au rapport nouvellement reçu.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Conserve l’article défini de l’hébreu, qui désigne l’autel précis au centre du récit.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: en face du pays de Canaan
  rationale: Exprime la relation spatiale de מוּל sans décider si elle implique seulement une orientation ou une position sur la rive opposée.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: la région du Jourdain
  rationale: Formulation française naturelle pour un pluriel hébreu pouvant désigner les districts ou territoires associés au Jourdain; l’incertitude géographique est signalée en note.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: du côté des Israélites
  rationale: Préserve le rapport spatial difficile exprimé par עֵבֶר sans imposer une identification géographique trop précise; une autre compréhension est donnée en note.
