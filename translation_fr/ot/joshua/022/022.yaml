  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: fr
  text: '« Le Puissant, Dieu, Yahweh[a] ! Le Puissant, Dieu, Yahweh ! Il sait, et Israël lui-même saura : si c’est par rébellion, ou si c’est par infidélité envers Yahweh[b], ne nous sauve pas aujourd’hui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète deux fois l’invocation divine : « El, Élohim, Yahweh ». Cette répétition donne à la déclaration la solennité d’un serment. La relation exacte entre les titres peut aussi être comprise comme « Dieu des dieux, Yahweh ».'
    reason: ambiguïté_syntaxique_et_note_culturelle
  - marker: b
    text: 'Ou : « manquement à la fidélité envers Yahweh », c’est-à-dire une rupture de loyauté ou de confiance.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Le Puissant, Dieu, Yahweh
  rationale: La suite solennelle des trois désignations divines est conservée, ainsi que sa répétition intégrale. « Le Puissant » distingue אֵל de אֱלֹהִים sans les fondre en une seule expression, tandis que Yahweh rend directement le nom divin.
- source_word: הוּא יֹדֵעַ
  choice: Il sait
  rationale: Rend simplement et naturellement la connaissance présente exprimée par la forme hébraïque.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: et Israël lui-même saura
  rationale: « Lui-même » restitue l’insistance portée par הוּא, et le futur « saura » convient à l’imparfait dans ce contexte.
- source_word: אִם בְּמֶרֶד
  choice: si c’est par rébellion
  rationale: מֶרֶד désigne la rébellion ou la révolte. La tournure française complète légèrement l’ellipse hébraïque tout en gardant sa force conditionnelle.
- source_word: וְאִם בְּמַעַל
  choice: ou si c’est par infidélité
  rationale: מַעַל évoque une rupture de loyauté ou de confiance, souvent dans un cadre d’alliance. « Infidélité » est naturel en français et conserve cette portée relationnelle.
- source_word: בַּיהוָה
  choice: envers Yahweh
  rationale: Dans le contexte de la rébellion et de l’infidélité, la préposition marque la personne contre laquelle la faute est commise. « Envers » s’accorde naturellement avec « infidélité ».
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: ne nous sauve pas
  rationale: Conserve l’appel négatif direct adressé à Dieu et rend le causatif de ישׁע par le verbe transparent « sauver ».
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Expression française courante et digne qui rend exactement la référence temporelle sans raideur archaïsante.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de la double invocation divine
  choice: Répéter intégralement « Le Puissant, Dieu, Yahweh »
  alternative: Fusionner ou réduire les titres en « Yahweh, le Dieu des dieux »
  rationale: La répétition hébraïque produit une invocation solennelle, proche d’une formule de serment. La conserver respecte son poids rhétorique sans trancher excessivement la relation syntaxique entre les titres.
- issue: Changement de personne dans l’appel final
  choice: Passer de « Il sait » à l’adresse directe « ne nous sauve pas »
  alternative: qu’il ne nous sauve pas
  rationale: La forme verbale finale permet et favorise ici l’adresse directe à Dieu. Le changement abrupt de personne appartient à la vigueur de l’appel et ne doit pas être lissé.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les exclamations et la répétition gardent la force de l’invocation hébraïque. Les guillemets signalent que le verset rapporte la déclaration des tribus.
