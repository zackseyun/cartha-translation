  terminology: « Yahweh », « impur », « autel » et « notre Dieu » conviennent. « Pays qui est votre propriété » maintient le parallèle avec le pays appartenant à Yahweh, mais « appartient » est plus naturel que la tournure possessive abstraite avec « propriété ». La note peut conserver l’information sur la parenté entre le verbe hébreu et « tabernacle ».
