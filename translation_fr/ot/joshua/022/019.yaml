source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: fr
  text: Mais si le pays qui vous appartient est impur[a], passez dans le pays qui appartient à Yahweh, là où se trouve le tabernacle de Yahweh[b], et établissez-vous parmi nous[c]. Seulement, ne vous révoltez ni contre Yahweh ni contre nous en vous construisant un autel en dehors de l’autel de Yahweh, notre Dieu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays que vous avez reçu en possession est impur ». Le mot hébreu peut désigner une propriété foncière héréditaire.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement, avec un verbe apparenté au terme rendu par « tabernacle », « là où le tabernacle de Yahweh demeure [ou : a demeuré] ».'
    reason: wordplay_and_lexical_alternative
  - marker: c
    text: Ou « prenez possession parmi nous ». Le verbe peut évoquer l’obtention d’un domaine ou l’établissement dans un lieu.
    reason: lexical_alternative
  - marker: d
    text: Ou « à côté de » ou « en plus de l’autel de Yahweh, notre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Mais
  rationale: Introduit naturellement en français la réserve appuyée qui ouvre la proposition.
- source_word: טְמֵאָה
  choice: impur
  rationale: Conserve la possible portée cultuelle du terme sans préciser la nature exacte de l’impureté.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: le pays qui est votre propriété
  rationale: אֲחֻזָּה désigne une possession foncière, souvent héréditaire; « propriété » permet aussi de maintenir le parallèle avec la propriété de Yahweh.
- source_word: עִבְרוּ לָכֶם
  choice: passez
  rationale: Rend l’action de traverser, vraisemblablement le Jourdain; la nuance bénéficiaire de לָכֶם n’est pas explicitée, car « passez pour vous-mêmes » serait peu naturel en français.
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: dans le pays qui est la propriété de Yahweh
  rationale: Maintient le parallèle lexical avec « votre propriété » et rend le nom divin par « Yahweh ».
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: là où demeure la demeure de Yahweh
  rationale: Préserve le jeu étymologique hébreu entre שׁכן et מִשְׁכָּן. La répétition est marquée mais intelligible et reflète la formulation source.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: et établissez-vous au milieu de nous
  rationale: Exprime naturellement l’obtention d’une implantation ou d’un domaine parmi les tribus occidentales; une note signale le sens foncier plus littéral.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: Seulement, ne vous révoltez pas contre Yahweh ni contre nous
  rationale: « Seulement » rend l’insistance restrictive, tandis que « ni » réunit naturellement en français les deux interdictions parallèles.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: en vous construisant un autel
  rationale: Rend l’infinitif avec ב comme le moyen ou la circonstance de la révolte, tout en conservant la nuance réflexive de לָכֶם.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: en dehors de l’autel de Yahweh, notre Dieu
  rationale: « En dehors de » préserve l’ambivalence entre un autel distinct de l’autel légitime et un autel ajouté à celui-ci, sans préciser davantage la nature de la concurrence.
theological_decisions:
- issue: Nature de l’impureté du territoire transjordanien
  choice: « si le pays qui est votre propriété est impur »
  alternative: « si votre pays est souillé » ou une explicitation liée à son éloignement du sanctuaire
  rationale: L’hébreu ne précise pas si l’impureté est cultuelle, géographique ou rhétorique; la traduction conserve cette indétermination.
- issue: Statut de l’autel supplémentaire
  choice: « un autel en dehors de l’autel de Yahweh »
  alternative: « un autre autel que l’autel de Yahweh » ou « un autel en plus de l’autel de Yahweh »
  rationale: La formulation n’impose pas à elle seule une théorie complète de la centralisation; elle interdit un autel distinct ou concurrent sans en définir explicitement toutes les modalités.
- issue: Demeure du sanctuaire
  choice: « là où demeure la demeure de Yahweh »
  alternative: « là où se trouve le sanctuaire de Yahweh »
  rationale: Le choix conserve le lien verbal intentionnel entre « demeurer » et « demeure », sans faire de Yahweh lui-même le sujet grammatical de שׁכן dans cette phrase.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant les calques peu naturels. Le nom divin est translittéré « Yahweh ». Les répétitions foncières sont conservées; le jeu de mots sur la demeure est maintenu dans le texte et expliqué en note.
