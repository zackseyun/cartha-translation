revisions:
- from: Mais si le pays qui est votre propriété est impur[a], passez dans le pays qui est la propriété de Yahweh, là où demeure la demeure de Yahweh[b], et établissez-vous au milieu de nous[c]. Seulement, ne vous révoltez pas contre Yahweh ni contre nous en vous construisant un autel en dehors de l’autel de Yahweh, notre Dieu[d].
  to: Mais si le pays qui vous appartient est impur[a], passez dans le pays qui appartient à Yahweh, là où se trouve le tabernacle de Yahweh[b], et établissez-vous parmi nous[c]. Seulement, ne vous révoltez ni contre Yahweh ni contre nous en vous construisant un autel en dehors de l’autel de Yahweh, notre Dieu[d].
  rationale: La révision remplace la répétition artificielle « demeure la demeure » par « se trouve le tabernacle », rendu cultuellement précis et naturel. La note b conserve l’observation pertinente sur la parenté lexicale hébraïque sans transformer le texte français en calque. « Qui vous appartient » améliore aussi la fluidité tout en préservant le parallèle foncier du verset.
