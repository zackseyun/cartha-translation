  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: fr
  text: Maintenant, Yahweh votre Dieu a accordé le repos à vos frères[a], comme il le leur avait dit[b]. Maintenant donc, tournez-vous et allez vers vos tentes[c], dans le territoire qui vous appartient, celui que Moïse, serviteur de Yahweh, vous a donné de l’autre côté du Jourdain[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne les autres Israélites.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « comme il le leur avait promis ». L’hébreu dit littéralement : « comme il leur avait parlé ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vers vos foyers ». Littéralement : « vers vos tentes ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « au-delà du Jourdain » ou « par-delà le Jourdain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: a accordé le repos
  rationale: Le hiphil de נוח exprime ici le fait de procurer le repos, notamment après les conflits. « Accorder le repos » est naturel en français et conserve l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel employé dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Associé à Yahweh et employé au singulier quant au sens, אֱלֹהִים désigne ici le Dieu d’Israël.
- source_word: לַאֲחֵיכֶם
  choice: à vos frères
  rationale: Le masculin pluriel désigne, dans ce contexte tribal et militaire, les autres Israélites. « Frères » conserve à la fois la forme et l’idée de solidarité du texte source.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: comme il le leur avait dit
  rationale: דבר signifie littéralement « parler, dire ». La formulation française reste proche du texte sans expliciter l’idée de promesse, bien qu’elle soit impliquée par le contexte.
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: tournez-vous et allez
  rationale: Les deux impératifs sont conservés. Le datif לָכֶם n’exige pas de traduction distincte en français.
- source_word: לְאָהֳלֵיכֶם
  choice: vers vos tentes
  rationale: « Tentes » conserve le terme concret et le cadre historique, même si le mot peut désigner plus largement les foyers ou les demeures.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: au pays qui est votre propriété
  rationale: אֲחֻזָּה désigne une propriété foncière ou un territoire possédé. Cette traduction évite d’introduire le terme théologiquement plus chargé d’« héritage ».
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: celui que Moïse ... vous a donné
  rationale: נתן est rendu par son sens courant « donner », sans remplacer ce verbe par l’interprétation administrative « attribuer ».
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: Dans ce titre honorifique appliqué à Moïse, « serviteur » convient mieux que « esclave » au contexte, tout en rendant עֶבֶד.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: L’expression situe le territoire transjordanien par rapport au lieu où parle Josué. Cette formulation française conserve la relation spatiale sans imposer « à l’est », absent de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de lui substituer un titre, sans adopter la forme francisée plus tardive « Jéhovah ».
- issue: Portée de « frères »
  choice: vos frères, avec une note précisant qu’il s’agit des autres Israélites
  alternative: vos compatriotes / les autres Israélites
  rationale: La traduction garde la métaphore familiale et la solidarité d’alliance sans élargissement genré ni paraphrase dans le corps du verset.
- issue: Valeur de דִּבֶּר dans l’accomplissement de la parole divine
  choice: comme il le leur avait dit
  alternative: comme il le leur avait promis
  rationale: Le contexte permet de comprendre une promesse, mais le verbe hébreu signifie formellement « parler, dire ». La traduction préserve cette nuance sans effacer l’implication contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les deux impératifs hébreux et le vocabulaire concret des « tentes », tandis que « au pays qui est votre propriété » explicite naturellement la relation nominale אֶרֶץ אֲחֻזַּתְכֶם sans la transformer en « héritage ».
