  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: fr
  text: 'Il leur dit : « Retournez à vos tentes avec de grandes richesses, avec des troupeaux très nombreux, avec de l’argent et de l’or, du bronze[a] et du fer, ainsi qu’une très grande quantité de vêtements. Partagez avec vos frères[b] le butin pris à vos ennemis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du cuivre ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne leurs compatriotes israélites des autres tribus.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: Il leur dit
  rationale: La formule hébraïque comportant littéralement « en disant » est rendue naturellement en français sans répétition, tout en conservant pleinement l’introduction du discours.
- source_word: בִּנְכָסִים רַבִּים
  choice: avec de grandes richesses
  rationale: נְכָסִים désigne les biens ou la richesse; cette formulation française est naturelle et introduit bien l’énumération qui suit.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: Retournez à vos tentes
  rationale: « Tentes » conserve l’image concrète et le cadre historique du texte, sans l’interpréter simplement comme « foyers ».
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: avec des troupeaux très nombreux
  rationale: מִקְנֶה est un collectif désignant le bétail; « troupeaux » convient naturellement en français et מְאֹד est exprimé par « très nombreux ».
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: avec de l’argent et de l’or
  rationale: Traduction directe des deux matières précieuses dans une tournure française idiomatique.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: du bronze et du fer
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze; « bronze » est le terme traditionnellement approprié dans ce type d’énumération antique, avec une note signalant l’autre possibilité.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: ainsi qu’une très grande quantité de vêtements
  rationale: שְׂלָמוֹת désigne largement des vêtements; la formulation rend de façon naturelle la forte intensification הַרְבֵּה מְאֹד.
- source_word: חִלְקוּ
  choice: Partagez
  rationale: L’impératif pluriel commande une répartition entre les destinataires et leurs frères; « partagez » exprime clairement cette action en français courant.
- source_word: שְׁלַל אֹיְבֵיכֶם
  choice: le butin pris à vos ennemis
  rationale: שָׁלָל désigne le butin de guerre; l’ajout syntaxique « pris à » rend sans ambiguïté la relation hébraïque avec les ennemis.
- source_word: עִם אֲחֵיכֶם
  choice: avec vos frères
  rationale: La traduction conserve le terme masculin de parenté אָחִים, qui désigne ici les autres Israélites concernés.
theological_decisions:
- issue: Portée du terme de parenté אֲחֵיכֶם
  choice: avec vos frères
  alternative: avec les autres Israélites
  rationale: Le texte emploie le masculin pluriel « frères » dans un sens collectif et solidaire. Le maintenir préserve l’expression relationnelle du texte, tandis qu’une note explicite sa référence contextuelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre cumulatif de l’énumération hébraïque est préservé, avec des ajustements de déterminants et de coordination propres au français. Les ambiguïtés lexicales pertinentes sont signalées en note.
