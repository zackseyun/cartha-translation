source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: fr
  text: 'Seulement, veillez avec le plus grand soin à mettre en pratique le commandement et la loi[a] que Moïse, serviteur de Yahweh, vous a prescrits : aimez Yahweh votre Dieu, marchez dans toutes ses voies, gardez ses commandements, attachez-vous à lui et servez-le de tout votre cœur et de toute votre âme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’instruction » pour « la loi » (hébreu : torah).'
    reason: alternative lexicale authentique de תּוֹרָה dans ce contexte
lexical_decisions:
- source_word: רַק שִׁמְרוּ מְאֹד
  choice: Seulement, veillez avec le plus grand soin
  rationale: « Seulement » conserve la restriction emphatique de רַק, tandis que « veillez avec le plus grand soin » rend naturellement l’intensité de שִׁמְרוּ מְאֹד dans cette exhortation.
- source_word: לַעֲשׂוֹת
  choice: à mettre en pratique
  rationale: Dans le contexte d’un commandement et de la loi, cette expression française traduit l’exécution concrète demandée par l’infinitif עשה plus naturellement que le littéral « faire ».
- source_word: הַמִּצְוָה וְאֶת הַתּוֹרָה
  choice: le commandement et la loi
  rationale: Le singulier de מִצְוָה est conservé. « Loi » est le terme français reconnu dans ce contexte mosaïque, tandis que le sens également possible d’« instruction » est signalé en note.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: « Serviteur » convient au titre honorifique de Moïse; le nom divin est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: marchez dans toutes ses voies
  rationale: La métaphore éthique hébraïque de la marche est conservée; elle reste intelligible et digne en français biblique moderne.
- source_word: וּלְדָבְקָה בּוֹ
  choice: attachez-vous à lui
  rationale: « S’attacher à » exprime l’adhésion étroite et fidèle de דבק dans un français naturel, sans archaïsme.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: de tout votre cœur et de toute votre âme
  rationale: Cette formulation conserve les deux termes anthropologiques et l’idée d’un engagement entier, sans tenter de les réduire à des catégories françaises trop précises.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel et l’identité d’expression entre ses deux occurrences.
- issue: Métaphores de fidélité à l’alliance
  choice: marchez dans toutes ses voies; attachez-vous à lui
  alternative: vivez selon toutes ses voies; restez fermement unis à lui
  rationale: Les métaphores du texte source sont maintenues afin de préserver leur force éthique et relationnelle sans les expliquer dans le corps du verset.
- issue: Relation syntaxique des infinitifs après l’ordre principal
  choice: Deux-points puis impératifs coordonnés
  alternative: Répéter « à » devant chaque infinitif
  rationale: Les infinitifs hébreux explicitent le contenu concret de l’obéissance demandée. En français, une série d’impératifs après les deux-points restitue clairement cette force exhortative sans décider qu’il s’agit d’une simple liste détachée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le rythme solennel de l’exhortation, les métaphores bibliques de la marche et de l’attachement, ainsi que les termes « cœur » et « âme ». L’accord « prescrits » porte sur les deux compléments coordonnés « le commandement et la loi ».
