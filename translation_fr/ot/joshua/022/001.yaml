  text: Alors Josué appela les Rubénites, les Gadites et la demi-tribu de Manassé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marqueur temporel et narratif introduisant l’événement suivant; « Alors » conserve naturellement l’enchaînement du récit.
- source_word: יִקְרָא
  choice: appela
  rationale: Le qal exprime ici l’action d’appeler ces groupes auprès de Josué. « Appela » est direct et naturel; « convoqua » serait possible, mais ajouterait une nuance plus officielle.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: לָרֽאוּבֵנִי
  choice: les Rubénites
  rationale: Le gentilé singulier hébreu a ici un sens collectif et désigne les membres de la tribu de Ruben.
- source_word: וְלַגָּדִי
  choice: les Gadites
  rationale: Comme le terme précédent, le gentilé singulier fonctionne collectivement pour désigner les membres de la tribu de Gad.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: la demi-tribu de Manassé
  rationale: מַטֶּה désigne ici la tribu comme unité sociale; « la demi-tribu de Manassé » est une formulation française précise et consacrée.
