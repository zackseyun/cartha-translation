revisions:
- from: Lorsqu’ils arrivèrent dans la région du Jourdain[a] qui se trouve dans le pays de Canaan, les fils de Ruben, les fils de Gad et la demi-tribu de Manassé y bâtirent un autel près du Jourdain — un autel grand par son apparence[b].
  to: Lorsqu’ils arrivèrent dans la région du Jourdain[a] qui se trouve dans le pays de Canaan, les fils de Ruben, les fils de Gad et la demi-tribu de Manassé y bâtirent un autel près du Jourdain — un grand autel, remarquable à voir[b].
  rationale: La révision se limite à la dernière qualification de l’autel. Elle remplace une expression française peu naturelle par une formulation lisible qui rend le caractère visuellement remarquable indiqué par לְמַרְאֶה, sans préjuger de la fonction cultuelle de l’autel ni de l’intention des tribus.
