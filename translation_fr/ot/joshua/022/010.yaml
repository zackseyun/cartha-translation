source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: fr
  text: Lorsqu’ils arrivèrent dans la région du Jourdain[a] qui se trouve dans le pays de Canaan, les fils de Ruben, les fils de Gad et la demi-tribu de Manassé y bâtirent un autel près du Jourdain — un grand autel, remarquable à voir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les districts » ou « aux confins du Jourdain ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un grand autel, bien visible », c’est-à-dire remarquable par son apparence.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: région
  rationale: Le nom désigne ici une zone ou un district environnant. « Région » est naturel en français moderne et convient au sens géographique, tout en laissant en note les possibilités « districts » et « confins ».
- source_word: וַיָּבֹאוּ אֶל
  choice: Lorsqu’ils arrivèrent dans
  rationale: Cette formulation relie naturellement l’arrivée à l’action principale qui suit et rend la progression temporelle du récit.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: qui se trouve dans le pays de Canaan
  rationale: La proposition relative explicite la localisation géographique comme en hébreu, sans la réduire au simple complément « en Canaan ».
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: les fils de Ruben, les fils de Gad
  rationale: La traduction conserve l’expression tribale et familiale de l’hébreu plutôt que de la remplacer par les gentilés « Rubénites » et « Gadites ».
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: la demi-tribu de Manassé
  rationale: Expression française claire et consacrée qui correspond directement à la construction hébraïque.
- source_word: מִזְבֵּחַ
  choice: autel
  rationale: Équivalent français usuel du terme désignant une structure cultuelle ou sacrificielle.
- source_word: עַל הַיַּרְדֵּן
  choice: près du Jourdain
  rationale: Dans ce contexte géographique, עַל exprime vraisemblablement la proximité. « Près du Jourdain » est idiomatique et évite l’image trompeuse d’un autel construit sur le fleuve.
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: un autel grand par son apparence
  rationale: Cette formulation assez proche de l’hébreu conserve l’ambiguïté entre grande taille et aspect impressionnant, plutôt que de choisir d’emblée « imposant ».
theological_decisions:
- issue: Possibilité d’un autel cultuel rival
  choice: Décrire simplement la construction et l’apparence remarquable de l’autel
  alternative: un autel imposant / un grand autel destiné aux sacrifices
  rationale: Le verset ne précise pas encore la fonction de l’autel ni les intentions des tribus. La traduction préserve donc la tension narrative sans suggérer prématurément une rivalité cultuelle ou un jugement sur leurs motivations.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans être archaïque. La répétition de « Jourdain » et de « autel » est maintenue parce qu’elle structure et souligne l’énoncé hébreu.
