    text: Ou « dans les districts » ou « aux confins du Jourdain ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un grand autel, bien visible », c’est-à-dire remarquable par son apparence.
    reason: lexical_alternative
  revision_rationale: La révision se limite à la dernière qualification de l’autel. Elle remplace une expression française peu naturelle par une formulation lisible qui rend le caractère visuellement remarquable indiqué par לְמַרְאֶה, sans préjuger de la fonction cultuelle de l’autel ni de l’intention des tribus.
