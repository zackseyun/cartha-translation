  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: fr
  text: Quand les Israélites l’apprirent, toute la communauté d’Israël se rassembla à Silo pour partir en guerre contre eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour monter contre eux pour la guerre ».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: l’apprirent
  rationale: Dans cette séquence narrative, שׁמע signifie qu’ils reçurent la nouvelle évoquée par le contexte. « L’apprirent » est naturel en français et évite l’emploi absolu peu idiomatique de « entendirent ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites / d’Israël
  rationale: Littéralement « les fils d’Israël ». En français moderne, « les Israélites » désigne naturellement le peuple, tandis que la seconde occurrence s’intègre avec fluidité dans « la communauté d’Israël ».
- source_word: וַיִּקָּהֲלוּ
  choice: se rassembla
  rationale: Le verbe קהל exprime le rassemblement collectif. Le singulier s’accorde en français avec le sujet collectif « toute la communauté ».
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté d’Israël
  rationale: עֵדָה désigne ici l’ensemble organisé du peuple. « Communauté » restitue ce sens collectif dans un français actuel et digne.
- source_word: שִׁלֹה
  choice: Silo
  rationale: Forme française traditionnelle et usuelle du nom de lieu biblique.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: pour partir en guerre contre eux
  rationale: L’expression signifie littéralement « monter contre eux pour la guerre » et constitue un idiome d’action militaire. La formulation française transmet clairement l’intention hostile sans ajouter l’idée plus précise d’une attaque déjà engagée.
