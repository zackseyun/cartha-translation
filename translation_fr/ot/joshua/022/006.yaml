  text: וַֽ/יְבָרְכֵ֖/ם יְהוֹשֻׁ֑עַ וַֽ/יְשַׁלְּחֵ֔/ם וַ/יֵּלְכ֖וּ אֶל אָהֳלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/006.yaml
  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: fr
  text: Josué les bénit et les laissa partir ; ils allèrent à leurs tentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez eux » — littéralement « leurs tentes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: les bénit
  rationale: Le piel de ברך exprime ici l’action de Josué qui accorde une bénédiction aux hommes sur le départ. « Les bénit » est direct, naturel et fidèle.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: וַיְשַׁלְּחֵם
  choice: les renvoya
  rationale: Dans ce contexte, שלח désigne le fait de donner congé et de laisser repartir. « Les renvoya » rend cette nuance avec concision, sans suggérer un rejet.
- source_word: וַיֵּלְכוּ
  choice: ils regagnèrent
  rationale: הלך signifie littéralement « aller ». Avec la destination « leurs tentes », « regagnèrent » exprime naturellement en français le déplacement vers leur lieu de résidence, sans ajouter l’idée explicite d’un retour absente du verbe seul.
- source_word: אֶל
  choice: vers / à
  rationale: La préposition marque le mouvement vers une destination; elle est intégrée idiomatiquement au verbe français « regagner », qui prend un complément direct.
- source_word: אָהֳלֵיהֶם
  choice: leurs tentes
  rationale: Le nom désigne littéralement leurs tentes. Cette image concrète convient au cadre historique, tout en pouvant désigner par métonymie leurs lieux d’habitation.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La coordination est légèrement fluidifiée par « puis ». La formulation conserve l’image concrète des tentes et signale en note son sens possible de foyers ou lieux d’habitation.
