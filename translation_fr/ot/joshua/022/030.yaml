  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: fr
  text: Lorsque Phinéas, le prêtre, les responsables de la communauté et les chefs des milliers d’Israël[a] qui étaient avec lui entendirent les paroles que les fils de Ruben, les fils de Gad et les fils de Manassé avaient prononcées, cela leur parut bon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les milliers d’Israël ». Le terme peut désigner des subdivisions claniques, tribales ou administratives, et pas nécessairement un effectif numérique strict.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « cela fut bon à leurs yeux » ; autre traduction possible : « cela leur plut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: eurent entendu
  rationale: Le verbe שׁמע signifie ici « entendre ». Le passé antérieur marque naturellement en français l’action antérieure au jugement exprimé dans la proposition principale.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: le prêtre Phinéas
  rationale: Cette tournure française naturelle conserve le titre défini et l’identification de Phinéas.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: les responsables de la communauté
  rationale: נְשִׂיאֵי désigne des dirigeants reconnus et עֵדָה la communauté assemblée d’Israël. « Responsables » est actuel et non technique.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: les chefs des groupes d’Israël
  rationale: אַלְפֵי signifie littéralement « milliers », mais peut désigner ici des subdivisions sociales, administratives ou militaires. « Groupes » évite d’imposer soit un nombre strict, soit l’interprétation plus précise « clans ».
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient avec lui
  rationale: La proposition relative et le pronom hébreux sont conservés; « lui » renvoie clairement à Phinéas.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: les paroles prononcées
  rationale: Cette formulation évite en français la répétition maladroite « les paroles qu’ils parlèrent » tout en conservant le sens de דְּבָרִים et דִּבְּרוּ.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: les descendants de Ruben, de Gad et de Manassé
  rationale: Dans ce contexte tribal, בְּנֵי désigne les membres issus des ancêtres éponymes. « Descendants » est naturel en français et préserve ce lien généalogique.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: ils les trouvèrent bonnes
  rationale: Cette expression française rend naturellement l’idiome « cela fut bon à leurs yeux » sans le réduire entièrement à une simple émotion de plaisir.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure soutenue sans archaïsme. Le rendu « groupes » préserve l’indétermination référentielle de אַלְפֵי, tandis que la note conserve l’image de l’idiome final.
