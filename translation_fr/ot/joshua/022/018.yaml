id: JOS.22.18
reference: Joshua 22:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: fr
  text: Et vous, vous vous détournez aujourd’hui de Yahvé[a]. Or, si vous vous révoltez aujourd’hui contre Yahvé, demain, il s’irritera contre toute l’assemblée d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « vous revenez de derrière Yahvé ». Dans ce contexte, l’expression hébraïque signifie cesser de le suivre, se détourner de lui.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit simplement « il s’irritera » ; d’après le contexte, le sujet sous-entendu est Yahvé.
    reason: implicit_subject
lexical_decisions:
- source_word: תָּשֻׁבוּ
  choice: vous vous détournez
  rationale: Avec מֵאַחֲרֵי, le verbe שוב exprime ici l’abandon déloyal de celui que l’on suivait, et non un simple retour.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: de l’Éternel
  rationale: Littéralement « de derrière YHWH », cet idiome signifie cesser de le suivre. La note conserve l’image et explicite l’expression hébraïque.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et immédiatement reconnaissable du tétragramme, employé de façon uniforme dans le verset.
- source_word: וְהָיָה אַתֶּם תִּמְרְדוּ
  choice: Si vous vous révoltez
  rationale: La construction introduit naturellement l’éventualité qui entraîne la conséquence annoncée; « se révolter contre » rend la forte idée de défiance envers l’autorité légitime.
- source_word: יִקְצֹף
  choice: il s’irritera
  rationale: Le verbe קצף désigne une vive colère. « S’irritera contre » est actuel, digne et s’accorde naturellement avec le complément introduit par אֶל.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: עֵדָה désigne ici collectivement le peuple d’alliance; « assemblée » en conserve la dimension corporative sans suggérer seulement une population locale.
theological_decisions:
- issue: Sujet implicite de יִקְצֹף
  choice: Le pronom « il » renvoie à l’Éternel.
  alternative: Formulation impersonnelle telle que « la colère éclatera ».
  rationale: Le sujet n’est pas exprimé dans la proposition hébraïque, mais le contexte immédiat nomme deux fois YHWH comme celui qui est abandonné et contre qui porte la révolte. Le pronom garde l’implicite tout en restant naturel en français.
- issue: Responsabilité collective d’Israël
  choice: La colère divine vise « toute l’assemblée d’Israël ».
  alternative: Restreindre la conséquence aux seules tribus accusées.
  rationale: Le texte affirme explicitement la portée collective de la conséquence; cette tension théologique ne doit pas être atténuée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La reprise « Et vous, vous… » conserve l’insistance accusatrice de וְאַתֶּם. L’exclamation rend la force de la question rhétorique implicite dans le contexte, tandis que la seconde phrase exprime clairement le rapport entre révolte présente et colère imminente.
