  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: fr
  text: Prière de David. Prête l’oreille, Yahweh ; réponds-moi, car je suis pauvre[a] et démuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affligé et démuni ». Le mot hébreu עָנִי peut désigner une personne pauvre, affligée ou humiliée.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Prière de David
  rationale: Rend naturellement le titre hébreu tout en conservant la relation génitive, qui peut indiquer l’auteur, l’association ou la destination.
- source_word: הַטֵּה אָזְנְךָ
  choice: Tends l’oreille
  rationale: Conserve l’image corporelle de l’hébreu dans une expression française claire signifiant « écoute attentivement ».
- source_word: עֲנֵנִי
  choice: réponds-moi
  rationale: Impératif direct et fidèle à la supplication du psalmiste.
- source_word: עָנִי
  choice: pauvre
  rationale: Sens courant possible dans ce parallélisme avec אֶבְיוֹן, sans exclure la nuance d’affliction signalée en note.
- source_word: אֶבְיוֹן
  choice: démuni
  rationale: Exprime le manque et la dépendance tout en évitant une répétition plate de « pauvre ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Portée de לְ dans le titre לְדָוִד
  choice: de David
  alternative: pour David / au sujet de David
  rationale: La formule française traditionnelle et concise préserve une certaine souplesse, sans imposer explicitement une théorie de composition.
- issue: Nature de la détresse exprimée par עָנִי
  choice: pauvre, avec variante en note
  alternative: affligé / humilié
  rationale: Le contexte associe עָנִי à אֶבְיוֹן, ce qui favorise la pauvreté ou le dénuement, mais le terme hébreu peut aussi désigner l’affliction ou l’abaissement; la note maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la prière reste directe, et l’image hébraïque « tendre l’oreille » est conservée.
