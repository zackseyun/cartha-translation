  text: כִּֽי גָד֣וֹל אַ֭תָּה וְ/עֹשֵׂ֣ה נִפְלָא֑וֹת אַתָּ֖ה אֱלֹהִ֣ים לְ/בַדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/010.yaml
  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: fr
  text: Car tu es grand et tu accomplis des merveilles ; toi seul, tu es Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la prière et de la louange précédentes, dans un style poétique français naturel.
- source_word: גָדוֹל
  choice: grand
  rationale: Rend directement la grandeur de Dieu, notamment en dignité et en puissance.
- source_word: וְעֹשֵׂה
  choice: et tu accomplis
  rationale: Le participe décrit une action caractéristique et continue ; le présent français l'exprime naturellement, tandis qu’« accomplir » convient aux actes extraordinaires.
- source_word: נִפְלָאוֹת
  choice: des merveilles
  rationale: Désigne des actes extraordinaires qui suscitent l’émerveillement ; « des merveilles » est concis, courant et digne.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans cette adresse au singulier accompagnée d’une affirmation d’exclusivité, le terme désigne sans ambiguïté le Dieu unique.
- source_word: לְבַדֶּךָ
  choice: toi seul
  rationale: Préserve l’insistance exclusive du syntagme hébreu et sa référence directe à l’interlocuteur.
theological_decisions:
- issue: Affirmation monothéiste exclusive dans la dernière proposition
  choice: toi seul, tu es Dieu
  alternative: tu es Dieu, toi seul
  rationale: Cette formulation met clairement en relief l’exclusivité exprimée par לְבַדֶּךָ, sans ajouter d’élaboration doctrinale étrangère au texte.
translation_notes:
  register: 'Français international moderne, poétique et digne. Le redoublement « toi seul, tu » est idiomatique et porte l’emphase de l’hébreu. Aucune note n’est nécessaire : l’ambiguïté signalée dans la couche anglaise concerne l’ordre des mots anglais plutôt qu’une différence substantielle de sens dans l’hébreu.'
