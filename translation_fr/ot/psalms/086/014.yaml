source:
  edition: WLC
  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: fr
  text: Dieu, des hommes arrogants se sont dressés contre moi, et une bande d’hommes violents a cherché à m’ôter la vie[a] ; ils ne t’ont pas placé devant eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ont cherché ma vie » ; cet idiome hébreu signifie qu’ils ont cherché à le tuer.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « ils ne t’ont pas placé devant leurs yeux » ; c’est-à-dire qu’ils ne tiennent aucun compte de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom fonctionne ici comme une adresse directe au Dieu d’Israël. « Dieu » rend naturellement le vocatif sans ajouter l’interjection « ô », absente de l’hébreu.
- source_word: זֵדִים
  choice: des hommes arrogants
  rationale: Le substantif adjectival désigne des personnes orgueilleuses, insolentes ou présomptueuses. « Hommes arrogants » exprime clairement leur attitude hostile.
- source_word: קָמוּ עָלַי
  choice: se sont dressés contre moi
  rationale: L’expression idiomatique décrit le fait de se soulever contre quelqu’un avec hostilité. Le passé composé convient au parfait hébreu dans cette plainte.
- source_word: וַעֲדַת
  choice: une bande de
  rationale: Le nom désigne un groupe assemblé. Dans ce contexte hostile, « bande » est plus naturel et évocateur qu’« assemblée ».
- source_word: עָרִיצִים
  choice: hommes violents
  rationale: Le terme qualifie des personnes brutales, impitoyables ou oppressives. « Violents » rend la menace sans imposer le sens politique plus étroit de « tyrans ».
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: en veut à ma vie
  rationale: Littéralement, le groupe « a recherché ma vie ». L’expression française « en vouloir à la vie de quelqu’un » transmet naturellement l’intention meurtrière de l’idiome hébreu tout en conservant la référence à la vie.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: ils ne te placent pas devant eux
  rationale: La formulation conserve la métaphore hébraïque consistant à placer Dieu devant soi, c’est-à-dire à le garder présent à l’esprit et à tenir compte de lui.
theological_decisions:
- issue: Faut-il expliciter le vocatif par « Ô Dieu » ?
  choice: Dieu
  alternative: Ô Dieu
  rationale: Le contexte indique clairement une adresse directe, mais l’hébreu ne comporte aucune particule correspondant à « ô ». La traduction garde donc l’adresse sobre et directe.
- issue: Faut-il expliciter l’intention meurtrière de בִּקְשׁוּ נַפְשִׁי ?
  choice: en veut à ma vie
  alternative: cherche à me tuer
  rationale: L’idiome implique couramment une intention de tuer. Le choix retenu l’exprime en français naturel sans remplacer entièrement l’image hébraïque par une explicitation.
- issue: Faut-il interpréter explicitement l’absence de Dieu « devant eux » comme un manque d’égard pour lui ?
  choice: ils ne te placent pas devant eux
  alternative: ils ne tiennent aucun compte de toi
  rationale: La traduction principale préserve la métaphore et sa tension. La note en donne le sens pragmatique sans l’inscrire directement dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme conserve les trois mouvements du verset. « Se sont dressés », « bande » et « en veut à ma vie » sont idiomatiques sans être familiers ; la dernière proposition maintient volontairement la métaphore concrète de l’hébreu.
