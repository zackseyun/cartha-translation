id: PSA.86.3
reference: Psalms 86:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָנֵּ֥/נִי אֲדֹנָ֑/י כִּ֥י אֵלֶ֥י/ךָ אֶ֝קְרָ֗א כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: fr
  text: Fais-moi grâce[a], Seigneur, car je t’appelle tout au long du jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aie pitié de moi ». Le verbe hébreu peut exprimer une demande de faveur bienveillante ou de miséricorde.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Fais-moi grâce
  rationale: L’impératif de חנן avec suffixe de première personne demande à Dieu d’accorder sa faveur bienveillante. « Fais-moi grâce » préserve directement cette nuance, tandis que « Aie pitié de moi » demeure une autre traduction contextuellement possible.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי. « Seigneur » est son équivalent français conventionnel et naturel dans une prière, sans surtraduire la forme par « mon Seigneur ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de la supplication. « Car » exprime clairement et sobrement ce rapport causal.
- source_word: אֵלֶיךָ
  choice: je t’appelle
  rationale: La préposition אֶל avec suffixe de deuxième personne indique que l’appel est adressé à Dieu. En français, le complément indirect « t’ » rend naturellement « vers/toi » avec le verbe appeler.
- source_word: אֶקְרָא
  choice: j’appelle
  rationale: קרא signifie couramment « appeler » ou « crier ». « J’appelle » conserve le sens sans ajouter une intensité que la forme verbale ne marque pas explicitement.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: L’expression signifie littéralement « tout le jour ». « Tout au long du jour » est une formulation française actuelle et digne qui traduit la durée soutenue de l’appel.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: Seigneur
  alternative: mon Seigneur ; Maître
  rationale: Le verset s’adresse à Dieu au moyen du titre divin usuel. « Seigneur » traduit le titre sans introduire de précision confessionnelle ni surinterpréter l’élément pronominal lexicalisé.
- issue: Portée de חנן dans la supplication
  choice: Fais-moi grâce
  alternative: Aie pitié de moi
  rationale: Le verbe peut évoquer la faveur gracieuse comme la miséricorde. Le texte principal retient la première nuance, tandis que la note préserve l’autre lecture légitime sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la concision et le mouvement causal de la prière hébraïque, avec une note signalant l’étendue sémantique de חנן.
