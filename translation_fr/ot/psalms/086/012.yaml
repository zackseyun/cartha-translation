id: PSA.86.12
reference: Psalms 86:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: fr
  text: Je te louerai[a], Seigneur mon Dieu, de tout mon cœur, et je glorifierai ton nom pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je te rendrai grâce » ; le verbe hébreu peut exprimer aussi bien l’action de grâce que la louange dans un contexte de culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Je te louerai
  rationale: Le hiphil de ידה peut exprimer la louange ou l’action de grâce. Ici, son parallélisme avec « je glorifierai ton nom » favorise « louer ». L’imparfait hébreu est rendu au futur, conformément au caractère déclaratif, voire votif, du verset.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Le titre divin אֲדֹנָי est rendu par « Seigneur », forme française usuelle et respectueuse.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne est explicite et doit être conservé. Dans l’adresse double, « Seigneur mon Dieu » est naturel en français.
- source_word: בְּכָל לְבָבִי
  choice: de tout mon cœur
  rationale: Cette tournure française courante conserve l’image hébraïque et exprime une dévotion entière, sans partage.
- source_word: וַאֲכַבְּדָה
  choice: et je glorifierai
  rationale: Le piel de כבד signifie honorer ou glorifier. Avec « ton nom » comme complément et dans ce contexte de culte, « glorifier » rend bien la portée élevée du verbe.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: La traduction littérale préserve la métonymie biblique du nom, qui évoque la personne, son caractère révélé et sa renommée.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression rend clairement et naturellement en français la durée indéfinie ou perpétuelle exprimée par לְעוֹלָם.
theological_decisions:
- issue: Traduction de l’adresse divine אֲדֹנָי אֱלֹהַי
  choice: Seigneur mon Dieu
  alternative: Ô Seigneur, mon Dieu
  rationale: Le texte hébreu juxtapose deux titres dans une adresse directe, dont le second porte le suffixe « mon ». « Seigneur mon Dieu » les conserve sans ajouter une interjection absente de l’hébreu.
- issue: Portée de ידה dans ce contexte cultuel
  choice: louer
  alternative: remercier / rendre grâce
  rationale: Les deux sens sont lexicalement possibles. Le parallélisme avec l’action de glorifier le nom de Dieu soutient « louer », tandis qu’une note maintient ouverte l’autre nuance légitime.
translation_notes:
  register: Français international moderne, digne et fluide. Le futur conserve la valeur déclarative ou votive des formes hébraïques. Le tutoiement correspond à l’adresse biblique directe à Dieu et permet de préserver clairement les suffixes de deuxième personne.
