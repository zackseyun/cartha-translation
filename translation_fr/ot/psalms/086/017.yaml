source:
  edition: WLC
  text: עֲשֵֽׂה עִמִּ֥/י א֗וֹת לְ/ט֫וֹבָ֥ה וְ/יִרְא֣וּ שֹׂנְאַ֣/י וְ/יֵבֹ֑שׁוּ כִּֽי אַתָּ֥ה יְ֝הוָ֗ה עֲזַרְתַּ֥/נִי וְ/נִחַמְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: fr
  text: Donne-moi un signe en ma faveur[a] ; que ceux qui me haïssent le voient et soient couverts de honte, car toi, Yahweh, tu m’as secouru et consolé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Agis envers moi par un signe favorable » ; l’hébreu dit littéralement « fais avec moi un signe pour le bien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי
  choice: Donne-moi
  rationale: L’expression signifie littéralement « fais avec moi », mais, avec אוֹת (« signe »), « donne-moi » exprime naturellement en français la demande d’une intervention divine visible, sans modifier la force de l’impératif.
- source_word: אוֹת לְטוֹבָה
  choice: un signe en ma faveur
  rationale: אוֹת désigne un signe ou un témoignage visible, et לְטוֹבָה indique ici le bien, le bénéfice ou la faveur. Cette formulation française reste claire tout en conservant l’idée d’un signe favorable au psalmiste.
- source_word: וְיִרְאוּ
  choice: qu’ils le voient
  rationale: Après l’impératif, l’imparfait peut exprimer le résultat souhaité. Le pronom « le » reprend naturellement « signe » en français, sans changer le sens.
- source_word: שֹׂנְאַי
  choice: ceux qui me haïssent
  rationale: Le participe substantivé désigne littéralement ceux qui haïssent le psalmiste. Cette traduction est plus précise que « mes ennemis ».
- source_word: וְיֵבֹשׁוּ
  choice: soient couverts de honte
  rationale: Le verbe בוש peut évoquer la honte, l’échec et la confusion publiquement constatée. Cette expression française en restitue la force.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: עֲזַרְתַּנִי
  choice: tu m’as secouru
  rationale: Le parfait présente l’aide divine comme un fait accompli. « Secouru » convient au contexte de détresse et demeure naturel en français.
- source_word: וְנִחַמְתָּנִי
  choice: tu m’as consolé
  rationale: Dans cette forme, נחם signifie consoler ou réconforter. « Consolé » est direct, courant et fidèle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. La traduction conserve donc le nom propre sous sa forme française courante au lieu de le remplacer par un titre.
- issue: Nature du signe demandé
  choice: un signe en ma faveur
  alternative: un signe de ta faveur
  rationale: La préposition לְ indique que le signe est orienté vers le bien ou l’avantage du psalmiste. « De ta faveur » est possible, mais préciserait davantage que l’hébreu la nature ou la source du signe.
translation_notes:
  register: Français moderne, international et digne. La tournure reste accessible tout en gardant le parallélisme de la demande, de la honte des adversaires et du motif fondé sur l’aide déjà reçue de Yahvé.
