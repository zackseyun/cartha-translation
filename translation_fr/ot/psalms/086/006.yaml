  text: הַאֲזִ֣ינָ/ה יְ֭הוָה תְּפִלָּתִ֑/י וְ֝/הַקְשִׁ֗יבָ/ה בְּ/ק֣וֹל תַּחֲנוּנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: fr
  text: Prête l’oreille, Yahweh, à ma prière, et sois attentif au cri de mes supplications[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : mes appels pressants à la compassion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Prête l’oreille
  rationale: L’impératif appelle Dieu à écouter. L’expression française conserve l’image concrète de l’hébreu tout en restant naturelle et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, plutôt que substitution par un titre.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Équivalent direct de תְּפִלָּה avec le suffixe de première personne du singulier.
- source_word: וְהַקְשִׁיבָה
  choice: et sois attentif
  rationale: קשב exprime une écoute attentive. Cette formulation distingue le second impératif du premier et préserve le parallélisme poétique.
- source_word: בְּקוֹל
  choice: à la voix de
  rationale: קוֹל signifie « voix » ou « son ». « À la voix de » reflète directement le nom hébreu et demeure intelligible dans ce registre poétique.
- source_word: תַּחֲנוּנוֹתָי
  choice: mes supplications
  rationale: Le pluriel תַּחֲנוּנִים désigne des appels fervents à la faveur ou à la compassion. « Supplications » en conserve la forme plurielle et la tonalité insistante; une note en explicite le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte adresse directement le Dieu d’Israël par son nom propre. La translittération préserve cette fonction sans lui substituer un titre.
translation_notes:
  register: Français international moderne, dans un registre poétique et digne. Le parallélisme entre « Prête l’oreille » et « sois attentif » est conservé sans lourdeur; « supplications » garde la force et le pluriel de l’hébreu, avec une brève explicitation en note.
