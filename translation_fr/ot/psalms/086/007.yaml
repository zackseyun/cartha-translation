- source_word: אֶקְרָאֶךָּ
  choice: je t’appelle
  rationale: Le yiqtol de קרא exprime ici l’action du psalmiste dans la détresse; le présent français convient à cette déclaration de confiance.
- source_word: כִּי תַעֲנֵנִי
  choice: car tu me réponds
  rationale: כִּי est conservé avec sa valeur causale, et ענה est rendu simplement par « répondre ». Le présent exprime l’assurance du psalmiste sans préciser davantage la nuance temporelle.
theological_decisions:
- issue: Valeur de כִּי et assurance de la réponse divine
  choice: « car tu me réponds »
  alternative: « puisque tu me répondras »
  rationale: La formulation retenue préserve le lien causal explicite et l’assurance immédiate du texte hébreu, sans transformer nécessairement le yiqtol en futur français ni ajouter une explication doctrinale.
