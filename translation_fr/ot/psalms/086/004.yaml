source:
  edition: WLC
  text: שַׂ֭מֵּחַ נֶ֣פֶשׁ עַבְדֶּ֑/ךָ כִּ֥י אֵלֶ֥י/ךָ אֲ֝דֹנָ֗/י נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: fr
  text: Réjouis l’âme de ton serviteur[a], car vers toi, Seigneur, j’élève mon âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Réjouis ton serviteur lui-même » ou « la vie de ton serviteur » ; le mot hébreu peut désigner l’âme, la vie ou la personne elle-même selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: Réjouis
  rationale: L’impératif piel exprime la demande directe que Dieu procure la joie. « Réjouis » est concis, naturel dans la prière et conserve la force causative.
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: l’âme / mon âme
  rationale: Dans cette prière, נֶפֶשׁ désigne la personne intérieure, voire la personne elle-même. « Âme » préserve le poids poétique et spirituel du terme ainsi que sa répétition dans le verset, sans imposer une anthropologie technique.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans l’adresse à Dieu propre aux Psaumes, le mot exprime ici surtout l’humble service et l’appartenance dévouée, plutôt que la condition sociale d’un esclave.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la demande. « Car » maintient clairement ce lien logique dans un registre de prière digne.
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition marque une orientation en direction de Dieu. « Vers toi » rend explicitement cette direction et s’accorde naturellement avec la métaphore d’élever son âme.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin exprimant l’autorité souveraine; « Seigneur » est sa traduction française habituelle et convient au registre de la prière.
- source_word: אֶשָּׂא
  choice: j’élève
  rationale: Le verbe נשׂא signifie ici élever ou porter vers le haut dans une image de prière et de confiance. « J’élève mon âme » conserve cette métaphore.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ dans la prière
  choice: Traduire les deux occurrences par « âme »
  alternative: « personne », « vie » ou « être »
  rationale: La répétition relie étroitement la demande et son motif. « Âme » conserve cette cohérence littéraire et la portée spirituelle du langage sans définir techniquement la constitution humaine.
- issue: Sens de עבד dans la relation à Dieu
  choice: « ton serviteur »
  alternative: « ton esclave »
  rationale: Dans cette supplication psalmique, le contexte met en avant l’humilité, le dévouement et le service envers Dieu; la condition juridique ou sociale de l’esclavage n’est pas au premier plan.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme et la répétition de « âme », ainsi que l’image poétique d’une âme élevée vers Dieu.
