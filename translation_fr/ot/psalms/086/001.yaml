id: PSA.86.1
reference: Psalms 86:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: fr
  text: 'Prière de David.


    Yahweh, tends l’oreille et réponds-moi, car je suis pauvre et dans le besoin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car je suis affligé et dans le besoin ». Le mot hébreu עָנִי peut désigner une personne pauvre, affligée ou humiliée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Prière
  rationale: Le nom isolé sert de désignation de genre dans le titre du psaume; « Prière » est naturel et fidèle.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ dans les titres peut exprimer l’auteur, l’appartenance ou l’association; « de David » conserve cette relative ambiguïté sans la préciser indûment.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: tends l’oreille
  rationale: Cette expression française actuelle conserve l’image corporelle de l’hébreu et exprime l’écoute attentive demandée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, plutôt que substitution par un titre.
- source_word: עֲנֵנִי
  choice: réponds-moi
  rationale: Dans le contexte d’une prière, ענה signifie naturellement « répondre ».
- source_word: כִּי
  choice: car
  rationale: Introduit le motif de la supplication dans un registre concis et digne.
- source_word: עָנִי
  choice: pauvre
  rationale: Le mot peut désigner une personne pauvre, affligée ou humiliée; « pauvre » convient à son association avec אֶבְיוֹן tout en laissant l’autre nuance en note.
- source_word: וְאֶבְיוֹן
  choice: et dans le besoin
  rationale: Rend le parallélisme sans la lourdeur de « nécessiteux » et demeure naturel en français moderne.
- source_word: אָנִי
  choice: je suis
  rationale: Le pronom hébreu est rendu avec la copule nécessaire dans la proposition nominale française.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée de עָנִי
  choice: pauvre
  alternative: affligé
  rationale: Le contexte permet les deux nuances. Le texte principal retient le sens socio-économique concret, tandis que la note préserve explicitement le sens possible d’affliction.
translation_notes:
  register: Français international moderne, sobre et digne. Le titre reste nominal. « Tends l’oreille » conserve la métaphore hébraïque dans une tournure idiomatique; « dans le besoin » évite un terme vieilli tout en gardant le parallélisme.
