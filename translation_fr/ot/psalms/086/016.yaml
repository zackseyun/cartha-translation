source:
  edition: WLC
  text: פְּנֵ֥ה אֵלַ֗/י וְ/חָ֫נֵּ֥/נִי תְּנָֽ/ה עֻזְּ/ךָ֥ לְ/עַבְדֶּ֑/ךָ וְ֝/הוֹשִׁ֗יעָ/ה לְ/בֶן אֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: fr
  text: Tourne-toi vers moi et fais-moi grâce ; donne ta force à ton serviteur et sauve le fils de ta servante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Tourne-toi vers moi
  rationale: L’impératif demande à Dieu de diriger son attention vers le psalmiste. Cette formulation est naturelle en français et conserve l’image relationnelle du mouvement vers lui.
- source_word: וְחָנֵּנִי
  choice: et fais-moi grâce
  rationale: Le verbe חנן exprime l’octroi bienveillant de la faveur. « Fais-moi grâce » garde cette nuance sans réduire la demande à la seule compassion.
- source_word: תְּנָה עֻזְּךָ
  choice: donne ta force
  rationale: La traduction directe conserve à la fois l’impératif simple de נתן et le sens courant de עֹז, la force ou la puissance.
- source_word: לְעַבְדֶּךָ
  choice: à ton serviteur
  rationale: Dans cette prière, עבד exprime l’humble appartenance et la dépendance envers Dieu. « Serviteur » convient au registre psalmique sans accentuer indûment l’institution de l’esclavage.
- source_word: וְהוֹשִׁיעָה
  choice: et sauve
  rationale: L’impératif de ישׁע demande une délivrance. « Sauve » en préserve la force et l’ampleur théologique.
- source_word: לְבֶן אֲמָתֶךָ
  choice: le fils de ta servante
  rationale: La formulation traduit explicitement l’expression hébraïque et maintient l’évocation de l’appartenance humble, possiblement reçue dès la naissance, sans employer un terme français archaïque.
theological_decisions:
- issue: Désignation humble par עבד et אמה
  choice: « ton serviteur » et « le fils de ta servante »
  alternative: « ton esclave » et « le fils de ton esclave » ; ou « le fils de ta servante personnelle »
  rationale: Le contexte met surtout en avant l’appartenance humble et la dépendance du priant envers Dieu. « Serviteur » et « servante » rendent cette relation avec naturel, tandis que la mention explicite de la mère est conservée au lieu d’être aplatie.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme de la supplication est conservé en trois impératifs coordonnés. « Fais-moi grâce » maintient le vocabulaire de la faveur divine, et « le fils de ta servante » garde intégralement l’image maternelle de l’hébreu.
