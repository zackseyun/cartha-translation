source:
  edition: WLC
  text: כִּֽי חַ֭סְדְּ/ךָ גָּד֣וֹל עָלָ֑/י וְ/הִצַּ֥לְתָּ נַ֝פְשִׁ֗/י מִ/שְּׁא֥וֹל תַּחְתִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: fr
  text: Car ton amour fidèle envers moi est grand, et tu as délivré ma vie des profondeurs du séjour des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du shéol le plus profond » ou « de la tombe, tout au fond ». Le shéol est le terme hébreu désignant le séjour des morts.
    reason: Alternative lexicale et conservation de l’ambiguïté de שְׁאוֹל תַּחְתִּיָּה.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange exprimée dans le contexte précédent et conserve la liaison poétique.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: Rend la bonté loyale, durable et relationnelle exprimée par חֶסֶד, dans un français naturel et digne.
- source_word: גָּדוֹל עָלָי
  choice: envers moi est grand
  rationale: Préserve le sens direct de גָּדוֹל et la relation indiquée par עַל sans amplifier le texte.
- source_word: וְהִצַּלְתָּ
  choice: et tu as délivré
  rationale: Le hifil de נצל exprime l'action d'arracher au danger ou de délivrer; le passé composé convient à un acte accompli célébré pour son effet présent.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: Dans ce contexte de délivrance du shéol, נֶפֶשׁ désigne naturellement la vie ou la personne vivante; «ma vie» évite d'imposer une anthropologie technique au mot.
- source_word: מִשְּׁאוֹל
  choice: du séjour des morts
  rationale: Rend le référent ancien de שְׁאוֹל de façon immédiatement compréhensible, sans le réduire à la tombe matérielle ni lui attribuer une précision doctrinale ultérieure.
- source_word: תַּחְתִּיָּה
  choice: tout en bas
  rationale: Conserve l'image spatiale de ce qui est inférieur ou le plus bas, ainsi que la construction quelque peu énigmatique de l'hébreu.
theological_decisions:
- issue: Rendre שְׁאוֹל sans lui imposer une conception doctrinale ultérieure
  choice: le séjour des morts
  alternative: le shéol; la tombe
  rationale: «Le séjour des morts» communique le monde des morts évoqué par le terme hébreu, tandis que la note maintient visibles les autres possibilités lexicales.
- issue: Interprétation de נַפְשִׁי dans une scène de délivrance de la mort
  choice: ma vie
  alternative: mon âme; moi-même
  rationale: Le mot peut désigner la vie, la personne ou l'âme. Ici, «ma vie» convient au péril mortel sans trancher une question sur la composition de l'être humain.
translation_notes:
  register: Français international moderne, poétique et accessible. «Amour fidèle» garde la densité relationnelle de חֶסֶד; «tout en bas» préserve l'image descendante de l'hébreu sans produire la formulation peu naturelle «le séjour des morts inférieur».
