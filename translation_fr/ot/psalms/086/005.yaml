  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֲ֭דֹנָ/י ט֣וֹב וְ/סַלָּ֑ח וְ/רַב חֶ֝֗סֶד לְ/כָל קֹרְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: fr
  text: Car toi, Seigneur, tu es bon et prêt à pardonner, riche en amour fidèle envers tous ceux qui font appel à toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de la supplication précédente et conserve naturellement le lien logique en français.
- source_word: אַתָּה
  choice: toi… tu
  rationale: Le pronom hébreu explicite porte une emphase; la dislocation française « toi… tu » la rend de façon naturelle.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Rend le titre divin אֲדֹנָי en adresse directe, sans le confondre avec le nom divin YHWH.
- source_word: טוֹב
  choice: bon
  rationale: Conserve le sens large de la bonté de Dieu sans le réduire à la seule bienveillance.
- source_word: סַלָּח
  choice: prêt à pardonner
  rationale: Exprime en français courant l'adjectif rare qui caractérise Dieu comme disposé au pardon.
- source_word: רַב חֶסֶד
  choice: riche en amour fidèle
  rationale: « Riche » traduit l'abondance exprimée par רַב, tandis que « amour fidèle » maintient conjointement la bienveillance et la loyauté de חֶסֶד.
- source_word: לְכָל קֹרְאֶיךָ
  choice: envers tous ceux qui font appel à toi
  rationale: Rend les bénéficiaires de cet amour et le sens du participe désignant ceux qui invoquent Dieu dans la prière.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי
  choice: Seigneur
  alternative: Maître; mon Seigneur
  rationale: Le texte porte אֲדֹנָי et non le tétragramme; « Seigneur » traduit donc le titre sans adopter une convention réservée à YHWH.
- issue: Rendu de חֶסֶד
  choice: amour fidèle
  alternative: fidélité bienveillante; bonté; miséricorde
  rationale: « Amour fidèle » préserve la tension entre affection bienveillante et loyauté durable, que « miséricorde » seule réduirait.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l'emphase du pronom hébreu et le parallélisme des qualités divines, sans archaïsme.
