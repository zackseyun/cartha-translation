  source_fidelity: 'La formulation « viendront se prosterner » exprime bien l’idée générale, mais elle peut présenter la prosternation comme le but de la venue. L’hébreu coordonne deux verbes à l’imparfait : les nations « viendront et se prosterneront ». Rendre explicitement la coordination reproduit plus précisément la structure et la progression du texte source.'
  naturalness: Le français est moderne, clair et d’un registre digne. « Toutes les nations que tu as faites », « Seigneur » et « honoreront ton nom » sont naturels. La coordination explicite « viendront et se prosterneront » demeure tout aussi fluide et améliore la précision.
  terminology: '« Nations » rend justement גּוֹיִם sans introduire « païens » ou « Gentils ». « Se prosterner » conserve le geste révérenciel de וְיִשְׁתַּחֲווּ, et « honorer ton nom » rend naturellement le piel de כבד. « Seigneur » convient pour le titre divin אֲדֹנָי. Les ancres de notes sont correctement placées : a sur l’action de prosternation et b sur l’honneur rendu au nom.'
