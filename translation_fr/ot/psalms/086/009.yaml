source:
  edition: WLC
  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: fr
  text: Toutes les nations que tu as faites viendront et se prosterneront devant toi[a], Seigneur, et elles honoreront ton nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’adorer » ; le verbe hébreu peut désigner le fait de se prosterner avec révérence et, par extension, d’adorer.
    reason: lexical_alternative
  - marker: b
    text: Ou « glorifieront ton nom ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Toutes les nations
  rationale: Cette formulation conserve la portée collective et universelle de l’hébreu, sans introduire la distinction plus particulière que pourrait suggérer « les païens ».
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: que tu as faites
  rationale: « Faire » correspond directement au sens courant de עשה et laisse au contexte l’idée implicite de création sans la préciser davantage.
- source_word: יָבֹאוּ
  choice: viendront
  rationale: L’imparfait hébreu exprime ici naturellement une attente future.
- source_word: וְיִשְׁתַּחֲווּ
  choice: se prosterner
  rationale: Le verbe désigne l’action de s’incliner profondément ou de se prosterner en signe de révérence; cette traduction conserve à la fois le geste concret et sa portée cultuelle.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Équivalent français naturel de l’expression hébraïque signifiant littéralement « devant ta face », c’est-à-dire en ta présence.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Dans cet emploi, אֲדֹנָי est le titre divin révérenciel; « Seigneur » en est l’équivalent français usuel.
- source_word: וִיכַבְּדוּ
  choice: honoreront
  rationale: Au piel, כבד signifie ici accorder honneur ou gloire. « Honoreront » est clair, actuel et s’emploie naturellement avec « ton nom ».
- source_word: לִשְׁמֶךָ
  choice: ton nom
  rationale: Cette tournure française naturelle préserve la référence au nom de Dieu, qui représente son identité révélée et sa réputation.
theological_decisions:
- issue: Portée de la réponse des nations
  choice: Une reconnaissance future du Seigneur par toutes les nations qu’il a faites
  alternative: Une formulation hyperbolique désignant un grand nombre de nations plutôt que chacune sans exception
  rationale: Le texte présente sans restriction « toutes les nations » comme venant devant Dieu. La traduction en conserve la portée universelle sans trancher les questions relatives aux modalités de son accomplissement.
- issue: Sens cultuel de וְיִשְׁתַּחֲווּ
  choice: Conserver le geste de prosternation tout en signalant sa valeur d’adoration
  alternative: Traduire directement par « adoreront »
  rationale: Le verbe hébreu décrit d’abord un geste corporel de révérence qui, adressé à Dieu dans ce contexte, exprime l’adoration. « Se prosterner » préserve les deux dimensions sans réduire le terme à une abstraction.
- issue: Rendu du titre אֲדֹנָי
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » rend naturellement le titre divin consacré par l’usage français, tandis que « Maître » risquerait d’en réduire la portée révérencielle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. « Se prosterner » conserve l’image concrète de l’hébreu, tandis que les notes signalent les principales possibilités lexicales sans surcharger le verset.
