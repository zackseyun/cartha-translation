id: PSA.86.15
reference: Psalms 86:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: fr
  text: Mais toi, Seigneur, tu es un Dieu compatissant et bienveillant, lent à la colère, riche en amour constant et en fidélité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vérité ». Dans cette formule, le mot hébreu peut désigner la fidélité ou la fiabilité, plutôt que la vérité au sens abstrait.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mais toi
  rationale: La conjonction, jointe au pronom explicite, marque ici un contraste avec l’hostilité évoquée auparavant. « Mais toi » restitue naturellement ce contraste et l’emphase du pronom.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin Adonaï, rendu conventionnellement par « Seigneur » plutôt que par la forme possessive « mon Seigneur ».
- source_word: אֵל
  choice: Dieu
  rationale: Dans cette formule qui rappelle Exode 34.6, אֵל désigne le Seigneur comme Dieu. « Dieu » est précis et naturel sans ajouter la nuance non explicite de puissance.
- source_word: רַחוּם
  choice: compatissant
  rationale: Le terme exprime une profonde compassion qui se traduit en miséricorde. « Compatissant » conserve cette nuance et convient à la formule associée à חַנּוּן.
- source_word: וְ/חַנּוּן
  choice: et bienveillant
  rationale: חַנּוּן décrit celui qui accorde volontiers sa faveur. « Bienveillant » est actuel, clair et distingue ce trait de la compassion déjà exprimée; « plein de grâce » resterait possible mais serait moins immédiatement transparent pour certains lecteurs.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Cette expression idiomatique hébraïque signifie que Dieu ne se met pas rapidement en colère. L’équivalent français établi en conserve précisément le sens.
- source_word: וְ/רַב חֶסֶד
  choice: riche en amour constant
  rationale: רַב exprime l’abondance, tandis que חֶסֶד désigne ici un amour durable, loyal et miséricordieux. « Riche en amour constant » communique ces dimensions dans un français naturel.
- source_word: וֶ/אֱמֶת
  choice: et en fidélité
  rationale: Associé à חֶסֶד dans cette formule d’alliance, אֱמֶת évoque surtout la fiabilité et la fidélité de Dieu, tout en pouvant aussi être rendu par « vérité »; cette possibilité est conservée en note.
theological_decisions:
- issue: Formulation de la description divine qui fait écho à Exode 34.6
  choice: 'Employer une langue actuelle mais solennelle : « compatissant et bienveillant… riche en amour constant et en fidélité »'
  alternative: 'Employer une formulation plus traditionnelle : « miséricordieux et plein de grâce… riche en bonté et en vérité »'
  rationale: La formulation retenue préserve la résonance de la déclaration divine fondatrice sans imposer un vocabulaire confessionnel particulier. Elle rend les qualités relationnelles de חֶסֶד et אֱמֶת tout en laissant en note l’autre sens réel de אֱמֶת.
- issue: Valeur de אֱמֶת dans le couple חֶסֶד וֶאֱמֶת
  choice: fidélité
  alternative: vérité
  rationale: Dans cette association, « fidélité » exprime plus directement la fiabilité relationnelle et l’attachement durable, mais l’hébreu permet « vérité »; l’ambiguïté lexicale est donc signalée plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve l’adresse emphatique « Mais toi, Seigneur » et le rythme de l’énumération hébraïque. Le marqueur de note est placé après « fidélité », terme auquel la variante se rapporte.
