id: PSA.86.2
reference: Psalms 86:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: fr
  text: 'Protège ma vie[a], car je suis fidèle[b] ; sauve ton serviteur, qui met sa confiance en toi : tu es mon Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mon âme » ; ici, le mot hébreu désigne vraisemblablement la vie ou la personne elle-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « pieux », « attaché à toi » ou « loyal ». Le mot hébreu évoque la fidélité vécue dans la relation avec Dieu, non une perfection sans péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: Protège
  rationale: L’impératif de שׁמר exprime ici la protection demandée à Dieu. « Protège » est naturel en français moderne et convient à une supplication face au danger.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: Dans cette demande de préservation, נֶפֶשׁ désigne la vie ou la personne du psalmiste plutôt qu’une âme immatérielle distincte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif invoqué à l’appui de la demande.
- source_word: חָסִיד
  choice: fidèle
  rationale: Le terme décrit une personne attachée à Dieu avec loyauté et piété. « Fidèle » conserve cette dimension relationnelle sans suggérer une perfection morale absolue.
- source_word: הוֹשַׁע
  choice: sauve
  rationale: L’impératif de ישׁע appelle une délivrance concrète tout en gardant la portée théologique habituelle du verbe.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans la prière, עֶבֶד est un titre d’humilité et d’appartenance à Dieu ; « serviteur » convient mieux ici que « esclave ».
- source_word: אַתָּה אֱלֹהַי
  choice: tu es mon Dieu
  rationale: La proposition nominale affirme directement la relation personnelle du psalmiste avec Dieu ; cette formulation en conserve explicitement le pronom אַתָּה.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: qui met sa confiance en toi
  rationale: Le participe décrit le serviteur comme celui qui s’appuie continuellement sur Dieu. La relative française rend clairement ce rattachement.
theological_decisions:
- issue: Portée de חָסִיד dans l’affirmation du psalmiste
  choice: Le psalmiste se présente comme fidèle et loyal envers Dieu.
  alternative: « pieux », « consacré » ou « saint »
  rationale: « Fidèle » exprime la loyauté vécue dans la relation avec Dieu sans transformer cette affirmation en revendication de perfection ni en mérite qui rendrait le salut superflu.
- issue: Relation entre fidélité, confiance et demande de salut
  choice: Maintenir ensemble l’appel à la fidélité du psalmiste et sa dépendance envers Dieu pour être sauvé.
  alternative: Atténuer l’affirmation de fidélité afin d’éviter toute apparence de mérite.
  rationale: 'Le texte assume cette tension : le priant invoque sa loyauté tout en se présentant comme serviteur dépendant qui place sa confiance en son Dieu.'
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme de la prière est conservé. Les deux-points rendent explicite l’affirmation אַתָּה אֱלֹהַי sans la réduire à un simple vocatif ; la relative est placée auprès de « ton serviteur » pour éviter qu’elle ne paraisse décrire Dieu.
