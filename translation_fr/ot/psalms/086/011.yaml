id: PSA.86.11
reference: Psalms 86:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: fr
  text: Enseigne-moi ta voie, Yahvé, afin que je marche dans ta vérité[a] ; unifie mon cœur[b] pour qu’il craigne ton nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ta fidélité ». Le mot hébreu peut exprimer aussi bien la vérité que la fidélité ou la fiabilité.
    reason: lexical_alternative
  - marker: b
    text: Ou « donne-moi un cœur sans partage ». Le verbe hébreu signifie « unir » ou « rendre un » et évoque un cœur qui n’est pas partagé entre des loyautés concurrentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Enseigne-moi
  rationale: L’impératif hiphil de ירה avec suffixe de première personne signifie « enseigne-moi » ou « instruis-moi ». « Enseigne-moi » est naturel et conserve la demande d’une instruction divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: דַּרְכֶּךָ
  choice: ta voie
  rationale: דֶּרֶךְ désigne un chemin ou une manière de vivre. « Ta voie » conserve le singulier et la portée métaphorique.
- source_word: אֲהַלֵּךְ
  choice: afin que je marche
  rationale: L’inaccompli qui suit l’impératif exprime ici vraisemblablement le but ou le résultat de la demande. Cette formulation rend clairement ce rapport sans le surinterpréter.
- source_word: בַּאֲמִתֶּךָ
  choice: dans ta vérité
  rationale: אֱמֶת peut désigner la vérité, la fidélité ou la fiabilité. « Dans ta vérité » est direct et garde une certaine ampleur sémantique ; « dans ta fidélité » est signalé en note.
- source_word: יַחֵד
  choice: unifie
  rationale: L’impératif piel de יחד signifie « unir » ou « rendre un ». « Unifie » reste proche du verbe hébreu et exprime la demande d’un cœur sans loyautés divisées.
- source_word: לְבָבִי
  choice: mon cœur
  rationale: לֵבָב représente la personne intérieure, notamment sa volonté et ses dispositions. « Cœur » est ici l’équivalent français naturel.
- source_word: לְיִרְאָה
  choice: pour qu’il craigne
  rationale: L’infinitif construit avec ל exprime le but. La tournure française rattache naturellement l’action au cœur et conserve « craindre », sans l’atténuer en simple respect.
- source_word: שְׁמֶךָ
  choice: ton nom
  rationale: Le « nom » représente aussi la personne et sa renommée, mais l’expression littérale porte une valeur théologique et cultuelle qu’il convient de préserver.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: Yahweh ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahvé » en conserve le caractère de nom personnel sous sa forme française usuelle, sans lui substituer un titre.
- issue: Portée de la crainte du nom de Dieu
  choice: craigne ton nom
  alternative: révère ton nom
  rationale: ירא recouvre la crainte, la révérence et l’effroi respectueux. « Craigne » préserve la force et la tension du vocabulaire biblique au lieu de les réduire à la seule révérence.
- issue: Unité du cœur
  choice: unifie mon cœur
  alternative: donne-moi un cœur sans partage
  rationale: La traduction choisie conserve l’image verbale du texte hébreu. L’alternative en explicite le sens probable, celui d’une personne intérieure libérée des fidélités concurrentes.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement suit l’adresse directe du psaume. La syntaxe conserve le parallélisme de la prière tout en évitant une formulation artificielle.
