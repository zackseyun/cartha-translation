id: PSA.86.8
reference: Psalms 86:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵין כָּמ֖וֹ/ךָ בָ/אֱלֹהִ֥ים אֲדֹנָ֗/י וְ/אֵ֣ין כְּֽ/מַעֲשֶֽׂי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: fr
  text: 'Seigneur, parmi les dieux[a], nul n’est comme toi,

    et aucune œuvre n’est comparable aux tiennes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les êtres célestes ». L’hébreu dit littéralement « parmi les dieux », formule biblique qui proclame que le Seigneur est sans égal face à toute puissance considérée comme divine.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין כָּמוֹךָ
  choice: nul n’est comme toi
  rationale: L’expression rend directement la négation existentielle et la comparaison, dans un français poétique, naturel et digne.
- source_word: בָאֱלֹהִים
  choice: parmi les dieux
  rationale: Le pluriel hébreu est conservé afin de préserver la formulation et la tension théologique du texte sans les réduire à une lecture particulière.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Le titre divin employé comme vocatif se rend naturellement par « Seigneur » dans la langue de la prière.
- source_word: וְאֵין כְּמַעֲשֶׂיךָ
  choice: et aucune œuvre n’est comparable aux tiennes
  rationale: מַעֲשֶׂה désigne largement une œuvre, une action ou un acte. La formulation française exprime clairement qu’aucune œuvre ne ressemble aux œuvres du Seigneur.
theological_decisions:
- issue: Sens de « parmi les dieux »
  choice: Conserver le pluriel littéral « parmi les dieux » comme affirmation poétique de l’incomparabilité du Seigneur.
  alternative: « parmi les êtres célestes » ; « il n’est pas de dieu comme toi »
  rationale: אֱלֹהִים est explicitement pluriel dans cette construction. Le conserver respecte l’ambiguïté du texte et n’impose ni une lecture polythéiste ni une identification précise de ces êtres.
translation_notes:
  register: Français international moderne, poétique et accessible. L’ordre place le vocatif « Seigneur » en tête pour une lecture naturelle, sans modifier le sens. « Œuvre » garde la portée large du terme hébreu ; « actes » ou « actions » seraient également possibles.
