source:
  edition: WLC
  text: יוֹרְדֵ֣י הַ֭/יָּם בָּ/אֳנִיּ֑וֹת עֹשֵׂ֥י מְ֝לָאכָ֗ה בְּ/מַ֣יִם רַבִּֽים׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/023.yaml
  text: Those who go down to the sea in ships[a], doing business on great waters—
translation:
  language: fr
  text: Ceux qui descendent sur la mer à bord de navires, qui accomplissent leur travail sur les vastes eaux[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui font du commerce sur les vastes eaux ». Dans ce contexte maritime, l’expression hébraïque peut désigner un travail, une activité professionnelle ou des affaires commerciales menées en haute mer.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: Ceux qui descendent
  rationale: Le participe qal masculin pluriel est employé comme substantif et désigne une catégorie de personnes. « Ceux qui descendent » conserve l’image hébraïque sans la remplacer par « marins ».
- source_word: הַיָּם
  choice: sur la mer
  rationale: Le nom défini désigne ici la mer au sens maritime général; avec le verbe « descendre », « sur la mer » rend naturellement la destination en français.
- source_word: בָּאֳנִיּוֹת
  choice: à bord de navires
  rationale: La préposition ב indique le moyen ou le cadre du voyage. « À bord de navires » est plus idiomatique en français que « dans des navires ».
- source_word: עֹשֵׂי מְלָאכָה
  choice: qui accomplissent leur travail
  rationale: L’expression signifie littéralement « faisant un travail/une activité ». Cette formulation reste large et n’impose pas le sens plus précis, mais possible, de commerce maritime.
- source_word: בְּמַיִם רַבִּים
  choice: sur les vastes eaux
  rationale: L’expression poétique évoque l’étendue de la haute mer. « Vastes eaux » rend idiomatiquement רַבִּים tout en conservant l’image au pluriel.
theological_decisions: []
