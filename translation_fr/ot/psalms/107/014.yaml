source:
  edition: WLC
  text: יֽ֭וֹצִיאֵ/ם מֵ/חֹ֣שֶׁךְ וְ/צַלְמָ֑וֶת וּ/מוֹסְר֖וֹתֵי/הֶ֣ם יְנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: fr
  text: Il les fit sortir des ténèbres et de l’ombre de la mort[a], et il rompit leurs liens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de l’obscurité profonde». Le mot hébreu peut désigner l’ombre de la mort ou des ténèbres très profondes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: Il les fit sortir
  rationale: Le hiphil de יצא exprime l’action de faire sortir. Le passé simple convient au récit poétique des délivrances accomplies par Dieu.
- source_word: מֵחֹשֶׁךְ
  choice: des ténèbres
  rationale: חֹשֶׁךְ est le terme courant pour l’obscurité; «des ténèbres» rend naturellement la préposition מִן en français.
- source_word: וְצַלְמָוֶת
  choice: et de l’ombre de la mort
  rationale: צַלְמָוֶת peut évoquer l’ombre de la mort ou une obscurité profonde. La formulation traditionnelle demeure défendable et correspond ici au péril mortel et à l’emprisonnement; l’autre sens est signalé en note.
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: leurs liens
  rationale: מוֹסְרוֹת désigne des entraves ou des liens. «Liens» s’associe naturellement au verbe «rompre» tout en préservant l’image de la captivité.
- source_word: יְנַתֵּק
  choice: il rompit
  rationale: Le piel de נתק exprime une séparation énergique, l’action d’arracher ou de briser. «Rompre les liens» est idiomatique, vigoureux et fidèle en français.
theological_decisions:
- issue: Sens de צַלְמָוֶת
  choice: l’ombre de la mort
  alternative: l’obscurité profonde
  rationale: Les deux analyses lexicales sont possibles. Le texte principal conserve l’image traditionnelle du danger mortel, tandis qu’une note maintient explicitement l’autre lecture sans trancher artificiellement.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple soutient le registre poétique du psaume sans archaïsme lexical; «rompit leurs liens» est naturel et restitue la vigueur de la délivrance.
