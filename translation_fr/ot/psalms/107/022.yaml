  text: Qu’ils offrent des sacrifices de reconnaissance et racontent ses œuvres avec des chants de joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: Qu’ils offrent
  rationale: Dans ce contexte psalmique, l’imparfait à valeur jussive exprime une exhortation. « Offrir » est naturel en français et conserve le sens cultuel du verbe.
- source_word: זִבְחֵי תוֹדָה
  choice: des sacrifices de reconnaissance
  rationale: Le syntagme construit désigne des sacrifices exprimant la gratitude. « Sacrifices de reconnaissance » est une formulation française consacrée, claire et proche de l’hébreu.
- source_word: תוֹדָה
  choice: reconnaissance
  rationale: Dans ce contexte sacrificiel, le terme désigne l’action de grâce ou l’offrande de reconnaissance, plutôt qu’une louange générique.
- source_word: וִיסַפְּרוּ
  choice: et racontent
  rationale: Au piel, ספר signifie raconter ou relater. « Racontent » rend naturellement l’idée de faire connaître les actes de Dieu.
- source_word: מַעֲשָׂיו
  choice: ses œuvres
  rationale: Le nom peut désigner des œuvres ou des actes. « Ses œuvres » convient au registre poétique des Psaumes sans préciser davantage la nature de ces actes.
- source_word: בְּרִנָּה
  choice: avec des chants de joie
  rationale: רִנָּה évoque un cri retentissant et joyeux, souvent chanté. Cette expression française restitue à la fois la joie et sa manifestation vocale.
